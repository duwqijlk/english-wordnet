simpleMeaning: Food is wrapped in a thin sheet of a plastic called saran, a sheet that sticks to itself.
scope: Also called clingfilm, this is a thin sheet of a plastic called saran that sticks to itself.
examples:
- She covered the bowl with cling film.
- He tore off a piece of cling film and wrapped the food in it.
