simpleMeaning: Something put into dough or a liquid to make it ferment.
scope: A thing put into dough or liquid to make it ferment, not the sense of a quiet force that lightens
  or changes something, and not the verb that means to puff dough up.
examples:
- A little leaven makes the whole loaf rise.
- She added leaven to the dough and left it to stand.
