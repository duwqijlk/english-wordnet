simpleMeaning: to set an instrument or machine so that it reads nought when it should show nothing
scope: Setting a tool or machine to read nought, not setting a gun's sights, and not the number itself.
examples:
- The technician zeroed the scales before weighing the sample.
- He zeroed the meter at the start of the test.
