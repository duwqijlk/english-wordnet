schema: oewn-learning-gloss-v2
senseId: proportional%5:00:00:proportionate:00
synsetId: 00484662-s
simpleMeaning: fitting well with another thing in size, amount, or other things that can be measured,
  usually used with the word to
scope: 'Also called relative: this sense describes a good fit in size or amount, not the noun sense of
  one number in a set of numbers in maths.'
examples:
- The pay rise was proportional to the extra work she did.
- The punishment should be proportional to the crime.
