simpleMeaning: The part of a fungus that grows and feeds, made of a mass of thin branching threads.
scope: The growing, feeding part of a fungus, not the part that makes spores and not a single mushroom.
examples:
- The mycelium spread through the damp soil under the tree.
- White mycelium covered the dead log.
