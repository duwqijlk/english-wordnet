simpleMeaning: total and without any limit; used in informal speech to make a word stronger, often showing
  dislike
scope: 'Also called perfect, complete, staring, utter, pure, thorough, gross, stark, everlasting, unadulterated,
  sodding and arrant: used to mean total, not the other consummate sense about having great skill.'
examples:
- He is a consummate fool and never learns from his mistakes.
- It was consummate nonsense from start to finish.
