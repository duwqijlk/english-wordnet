simpleMeaning: to be busy with fun, lively activity and amuse oneself in the way children do.
scope: This sense is not about adult recreation such as cards or sports, not about a staged performance,
  and not about careless behavior; it is the free, childlike kind of playing.
examples:
- The children played happily with their toys.
- Two kittens played on the rug.
