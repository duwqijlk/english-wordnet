simpleMeaning: a shaking of the ground that comes after the big shake of an earthquake, sometimes one
  of several such shakes
scope: This is a shake that comes after the main earthquake shake, not the main shake itself.
examples:
- A strong aftershock shook the town hours after the earthquake.
- People felt several aftershocks through the night.
