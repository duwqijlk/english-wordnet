simpleMeaning: Money that one person or firm must pay to another after a court has ruled against them
scope: Money that one person or firm must pay to another after a court has ruled against them, also called
  a judgement in personam, personal judgement or personal judgment; not a court order about a thing and
  not an order that asks for no money.
examples:
- The judgment in personam forced the company to pay damages.
- She faced a judgment in personam for the money she owed.
