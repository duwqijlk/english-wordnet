schema: oewn-learning-gloss-v2
senseId: 'envy%2:37:01::'
synsetId: 01831561-v
simpleMeaning: to want what another person has, with unkind feeling toward them, and to look on them with
  strong respect at the same time
scope: This verb is about wanting what another person has and looking on them with respect; it is not
  the noun for the feeling itself, and not bitter ill will at another person's success.
examples:
- I envy her good luck and the fine work she does.
- They envy his free life and wish they could live like him.
