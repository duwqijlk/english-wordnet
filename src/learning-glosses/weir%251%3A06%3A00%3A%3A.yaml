simpleMeaning: A low dam across a stream that keeps the water high or sends it another way.
scope: A low barrier that controls a stream's level, not the woven fish trap.
examples:
- A weir across the mill stream kept the water deep enough for the wheel.
- Engineers built a weir to send part of the river into the canal.
