simpleMeaning: A long-legged wading bird with three toes, found in the partly salty marshes of Australia
scope: A wading bird of Australia's partly salty marshes; not the black-and-white stilt of inland ponds,
  and not the tall poles used for walking.
examples:
- A stilt stood in the partly salty marsh in Australia.
- We watched stilts feeding in the Australian marsh.
