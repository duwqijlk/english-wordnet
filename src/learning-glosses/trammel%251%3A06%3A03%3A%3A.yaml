simpleMeaning: A fishing net of three layers, the outer two of coarse mesh, the loose inner one of fine
  mesh.
scope: A fishing net of three layers, the outer two of coarse mesh, the loose inner one of fine mesh;
  also called trammel net; not a check that binds or holds one back, as a thing used to tie down a prisoner,
  nor a hook in a fireplace that can be raised or lowered.
examples:
- Their trammel caught the fish.
- The trammel was cast at dawn.
