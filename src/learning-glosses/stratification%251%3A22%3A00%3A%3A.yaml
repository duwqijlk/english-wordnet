senseId: 'stratification%1:22:00::'
synsetId: 13583531-n
simpleMeaning: The making or laying down of layers.
scope: The making or laying down of layers; not the putting of seeds in damp sand or sawdust or peat,
  to keep them or make them sprout, nor the act of sorting people into classes or ranks, nor the state
  of being set out in ranks or classes within a group.
examples:
- Their stratification built the rock over years.
- The stratification showed in the cliff.
