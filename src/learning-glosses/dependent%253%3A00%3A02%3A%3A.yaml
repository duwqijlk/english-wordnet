simpleMeaning: In grammar, a clause that cannot stand on its own as a full sentence
scope: In grammar, a clause that cannot stand alone as a full sentence, not a person who needs help from
  others.
examples:
- The dependent clause 'when she arrived' cannot stand alone.
- A dependent clause needs the main part of the sentence to make sense.
