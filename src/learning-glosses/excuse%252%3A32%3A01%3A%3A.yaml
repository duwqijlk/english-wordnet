simpleMeaning: to use reasons to defend a person or act, to explain it, or to make it seem less wrong
scope: Another name for this sense is apologize. It is giving reasons to defend a person or act, not accepting
  a reason for something bad and not letting a wrong act pass without blame.
examples:
- He excused his son's rude act, saying the boy was too tired to think clearly.
- She tried to excuse the late work by giving reasons about the broken machine.
