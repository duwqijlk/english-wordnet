simpleMeaning: A cutting tool with a handle and a blade that narrows to a point along a sharp edge.
scope: This is the cutting tool with a handle; it is not the weapon sense, and not the long, thin, fleeting
  shape such as a flame.
examples:
- She sharpened the knife before slicing the bread.
- He kept a small knife in his pocket for opening parcels.
