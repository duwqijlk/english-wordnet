senseId: 'exoskeleton%1:08:00::'
synsetId: 05594409-n
simpleMeaning: a hard outer covering that keeps many animals, especially animals with no backbone, safe
  and holds them up, with hard parts like nails, scales, or hoofs
scope: This is the hard support on the outside of an animal's body, not the bones inside the body.
examples:
- A crab's exoskeleton is hard and protects its soft body.
- When the insect grew too big, it shed its old exoskeleton.
