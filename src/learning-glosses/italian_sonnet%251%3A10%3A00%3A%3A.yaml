simpleMeaning: 'A poem of fourteen lines: first eight lines with the rhyme shape abbaabba, then six lines
  with the rhyme shape cdecde or cdcdcd'
scope: Also called a Petrarchan sonnet; a fourteen-line poem in two parts, eight lines then six, with
  set rhyme shapes.
examples:
- She wrote an Italian sonnet for the contest, keeping the abbaabba rhyme in the first eight lines.
- His Italian sonnet ended with six lines in the cdecde shape.
