simpleMeaning: lasting only a very short time, and then gone
scope: Lasting only a very short time and then gone, also called momentary or fugitive; not a thing that
  is short in size.
examples:
- She caught a fleeting glimpse of the deer before it vanished.
- Their joy was fleeting, and soon gave way to worry.
