senseId: 'presence%1:09:00::'
synsetId: 05925768-n
simpleMeaning: A sense that something is there, though you cannot actually see it.
scope: A felt sense that something unseen is nearby; not the thing itself, not the plain fact of being
  somewhere, and not a dignified manner.
examples:
- Halfway up the stairs she felt a presence behind her and turned.
- The medium claimed to sense a presence in the empty room.
