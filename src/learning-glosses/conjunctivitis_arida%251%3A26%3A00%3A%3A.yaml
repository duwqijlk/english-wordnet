simpleMeaning: A state of dryness in the clear skin and the clear front of the eye, sometimes brought
  on when the whole body lacks vitamin A.
scope: Also called xeroma, xerophthalmia and xerophthalmus, this state of dryness in the clear skin and
  the clear front of the eye sometimes comes when the whole body lacks vitamin A.
examples:
- Conjunctivitis arida left her eyes feeling dry.
- Conjunctivitis arida can come from too little vitamin A in the body.
