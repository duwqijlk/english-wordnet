simpleMeaning: a thought or a feeling that enters your mind and becomes clear to you
scope: When a thought or a feeling enters your mind and becomes clear to you, also called click or dawn;
  not the act of putting one thing into another person's body during sex.
examples:
- It slowly penetrated his mind that she had left him for good.
- She was penetrated with sorrow when she heard the news.
