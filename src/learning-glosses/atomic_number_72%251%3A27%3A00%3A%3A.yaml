simpleMeaning: A grey metal that joins with four other atoms, like zirconium in its chemistry and found
  in zirconium minerals; used in thin wires because it gives off electrons freely.
scope: 'Also called hafnium and Hf: a grey metal that joins with four other atoms, not zirconium itself.'
examples:
- Atomic number 72 is found in zirconium minerals.
- Hafnium, atomic number 72, gives off electrons freely in thin wires.
