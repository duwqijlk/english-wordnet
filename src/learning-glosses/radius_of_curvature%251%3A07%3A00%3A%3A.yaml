simpleMeaning: One divided by how sharply a line bends at one point, with no minus sign, equals half the
  width of the round shape that fits the bend best.
scope: It is the reciprocal of how much a line bends at one point, not the bending itself.
examples:
- The radius of curvature at that point told them how sharp the bend was.
- They worked out the radius of curvature from the shape of the bend.
