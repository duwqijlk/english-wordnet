simpleMeaning: a narrow raised area like a balcony set back along an upper floor inside a building, usually
  with a row of tall round posts in front
scope: A raised area inside a building, not a covered passage along a wall, not a porch outside a building,
  and not the people watching a golf or tennis match.
examples:
- From the gallery inside the church, we could look down on the seats below.
- The upper gallery runs along the inside wall of the hall, behind a row of thin posts.
