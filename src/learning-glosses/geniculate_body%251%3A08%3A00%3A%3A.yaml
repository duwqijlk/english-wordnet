simpleMeaning: Signals pass to the outer brain through these small oval lumps, one of four sticking out
  a little from under the thalamus, the deep middle part of the brain.
scope: This is one of four small lumps under the thalamus, not the thalamus itself or a part of the outer
  brain.
examples:
- The geniculate body passes signals on the way to the outer brain.
- Scientists traced the geniculate body as one of four small lumps under the thalamus.
