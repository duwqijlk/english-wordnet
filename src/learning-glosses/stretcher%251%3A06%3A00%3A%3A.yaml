simpleMeaning: Usually a bed of cloth stretched between two poles, used to carry a sick, hurt, or dead
  person
scope: A cloth bed on poles for carrying the sick or dead, not the wooden frame for a painting and not
  a device for making shoes bigger.
examples:
- They carried him away on a stretcher.
- The stretcher bearers moved quickly through the crowd.
