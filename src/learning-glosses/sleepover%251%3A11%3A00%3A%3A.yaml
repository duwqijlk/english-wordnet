simpleMeaning: a time when someone sleeps for one night at another person's home, or a guest sleeps at
  your home, especially as a party for children
scope: A night stayed at another person's home, especially a children's party with a night stay; it is
  not a party where guests go home at night, and not a long stay away.
examples:
- My daughter had a sleepover at her friend's house on Friday.
- We let the children have a sleepover for her birthday.
