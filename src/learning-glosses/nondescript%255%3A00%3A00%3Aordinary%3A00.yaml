simpleMeaning: with no clear or special features that make a thing or person easy to notice or remember,
  and not interesting
scope: 'Also called characterless: having no special look or quality, not bright, clear, or easy to describe
  in a special way.'
examples:
- He wore a nondescript grey coat that no one noticed.
- They met in a small, nondescript room with plain walls.
