simpleMeaning: A big-flowered vine that winds weakly or lies flat, from New Jersey to hot eastern North
  America, sometimes grown for its purple and white flowers.
scope: This sense is a big-flowered vine that winds weakly or lies flat, from New Jersey to hot eastern
  North America, unlike the sense for a big-flowered wild twining vine of the southeastern and central
  United States with pale blue flowers, and unlike the sense for a vine of hot Asia with feather-like
  leaves and bright blue flowers with yellow middles.
examples:
- Butterfly pea has purple and white flowers.
- Butterfly pea grows in New Jersey.
