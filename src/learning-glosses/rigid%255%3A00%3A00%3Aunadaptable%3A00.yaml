senseId: rigid%5:00:00:unadaptable:00
synsetId: 01032766-s
simpleMeaning: not able to change in a way that fits what is happening or what is needed
scope: About not changing to fit what is happening or what is needed, not about a thing that will not
  bend, and not about not being able to agree with other people.
examples:
- His rigid way of teaching did not work with the new class.
- A rigid plan cannot meet the needs of a changing town.
