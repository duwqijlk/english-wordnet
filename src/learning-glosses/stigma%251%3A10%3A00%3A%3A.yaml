simpleMeaning: a sign that people see as shameful and that gives someone a bad name
scope: A sign of shame and a bad name, not a mark on a flower or an opening in an insect's body; brand,
  mark and stain are other names for this sense.
examples:
- There was a stigma about asking for help in those days.
- The stigma of prison stayed with him for years.
