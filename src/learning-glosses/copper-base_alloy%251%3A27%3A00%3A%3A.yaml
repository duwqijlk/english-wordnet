simpleMeaning: any mix of metals in which the reddish brown metal is the main part
scope: A mix of metals whose main part is the reddish brown metal, not a mix with some other metal as
  the main part and not the reddish brown metal on its own.
examples:
- Brass is a copper-base alloy used for taps and fittings.
- The copper-base alloy in the coin is mostly the reddish metal.
