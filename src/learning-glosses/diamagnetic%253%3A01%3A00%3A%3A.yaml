senseId: 'diamagnetic%3:01:00::'
synsetId: 02722335-a
simpleMeaning: Describes a thing that is pushed away, only slightly, by a magnet
scope: This word describes a thing pushed away, only slightly, by a magnet, not a thing pulled hard toward
  a magnet and not a thing a magnet does not affect at all.
examples:
- Copper is diamagnetic, so a strong magnet pushes it away a little.
- The diamagnetic sample moved only slightly from the magnet.
