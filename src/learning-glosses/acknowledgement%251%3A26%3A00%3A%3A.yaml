senseId: 'acknowledgement%1:26:00::'
synsetId: 14435385-n
simpleMeaning: the state of being seen, known and given credit by others for who you are or what you have
  done
scope: 'Also called recognition and acknowledgment: the state of being seen and given credit. Not the
  statement itself in which someone says they have received or accepted something.'
examples:
- The acknowledgement of their work by the city made the partners very happy.
- She wanted acknowledgement for years of work that others had taken credit for.
