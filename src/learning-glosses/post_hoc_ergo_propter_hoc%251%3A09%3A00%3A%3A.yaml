simpleMeaning: People take the first of two things, one after the other, to have made the second happen,
  a false step in thinking.
scope: This is the false step of taking the first of two things to have made the second happen, also called
  post hoc, not a cause shown by sound proof.
examples:
- The crowd fell for post hoc ergo propter hoc, blaming the new mayor for a storm that came after the
  vote.
- Post hoc ergo propter hoc is at work when a win after a new song is blamed on the song.
