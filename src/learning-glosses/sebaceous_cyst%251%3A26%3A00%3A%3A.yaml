simpleMeaning: Fatty stuff from a skin gland that has got blocked fills this common lump under the skin.
scope: Wen, pilar cyst, and steatocystoma are other names for this common lump under the skin, filled
  with fatty stuff from a skin gland that has got blocked.
examples:
- The sebaceous cyst under the skin was filled with fatty stuff.
- A sebaceous cyst forms from a skin gland that has got blocked.
