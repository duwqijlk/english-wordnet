simpleMeaning: a kind of music with a strong regular beat, written for people to walk in step to, as soldiers
  or a band do
scope: This sense is not the act of walking with regular steps, and not a walk held as a protest.
examples:
- The band played a lively march as the soldiers entered the square.
- Elgar's marches are often performed at graduation ceremonies.
