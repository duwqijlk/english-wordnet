simpleMeaning: A tasteless, odourless gummy substance made by breaking starch down, used as a thickener
  and in glues and food supplements.
scope: A starch-derived thickener, not ordinary starch or sugar.
examples:
- Dextrin is used to thicken sauces and to make glue.
- The label lists dextrin among the ingredients.
