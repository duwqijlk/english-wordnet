simpleMeaning: a place of work made up of a coal mine and all the buildings and tools and machines used
  with it
scope: A coal mine together with its buildings and machines, not an open place dug only to get stone and
  not a hollow in a surface.
examples:
- He worked at the pit for thirty years, going down the mine each day.
- The pit closed, and its buildings stood empty.
