simpleMeaning: strong black coffee made by pushing hot water with great force through coffee beans ground
  into very small bits
scope: A strong black coffee made in this hot-water way, not weak coffee, not coffee with milk, and not
  the beans on their own.
examples:
- He drank a small cup of espresso after lunch.
- The espresso was strong and black, with no milk.
