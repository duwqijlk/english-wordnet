simpleMeaning: An offensive name, used as an insult, for a Black man who bows down to white people and
  does whatever they ask.
scope: This is an offensive name, used as an insult, for a Black man who bows down to white people and
  does whatever they ask, also called Tom; it is an ethnic slur, not a plain name for a Black man.
examples:
- The book calls the man an Uncle Tom for doing whatever the white men ask.
- People called him Uncle Tom because he bowed down to white people.
