simpleMeaning: a bicycle with a strong frame and wide tires, first made for riding in hilly country
scope: 'Also called an all-terrain bike or an off-roader: a strong-framed bicycle with wide tires for
  hilly country, not a road bicycle and not a motorbike.'
examples:
- She rode her mountain bike up the steep trail.
- His mountain bike has wide tires for rough ground.
