simpleMeaning: a cut in a piece of clothing that shows cloth of a different colour under it, used in clothing
  from the Renaissance (a time long ago in Europe)
scope: This is a cut in clothing that lets a different colour show under it, as used long ago. It is not
  the flap along the edge of clothing, and not the act of cutting teeth into something.
examples:
- The jag in his sleeve showed bright red cloth underneath.
- In the Renaissance costume, a jag in the sleeve showed gold cloth below.
