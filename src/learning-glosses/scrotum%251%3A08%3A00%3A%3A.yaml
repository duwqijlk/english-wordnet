simpleMeaning: the bag of skin outside a man's body that holds the testes (the two small round parts inside
  it that help make babies)
scope: This is the outer bag of skin itself, not the two round parts inside it and not the penis above
  it.
examples:
- The doctor checked his scrotum for any swelling.
- Cold water can make the scrotum tighten and pull up.
