simpleMeaning: a book that most often comes with a machine and tells you, step by step, how to set it
  up or use it
scope: A book that tells you how to set up or use a machine, also called instructions, a book of instructions
  or operating instructions; not a guide to a place and not a school textbook.
examples:
- The instruction manual for the printer explains how to load the paper.
- Read the instruction manual before you switch the machine on.
