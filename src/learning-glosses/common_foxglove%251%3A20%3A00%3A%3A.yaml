simpleMeaning: A tall European plant, living two years or longer, with large pink-purple tube-shaped flowers
  in striking clusters; its leaves give the drug digitalis and poison livestock.
scope: This is the familiar tall European plant whose pink-purple tubes yield digitalis; it is one species,
  not the whole foxglove genus or other garden flowers.
examples:
- The common foxglove sent up tall spires of pink-purple tubes along the hedge.
- Farmers keep the common foxglove out of pastures because its leaves poison sheep and cattle.
