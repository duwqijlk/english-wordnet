simpleMeaning: singing notes with the sounds do, re, mi and the rest, to name each note in the scale of
  C major
scope: Singing notes with do, re, mi and the rest to name each note in the scale of C major, also called
  solfeggio and solmization; not ordinary singing and not playing an instrument.
examples:
- The class practised solfege before singing the new song.
- She learned solfege to help her read music.
