simpleMeaning: be unable to see, hear, notice, or understand something.
scope: This is not about an object you owned going missing or out of view; it is about failing to notice,
  hear, or follow something.
examples:
- Sorry, I lost you for a moment — could you say that again?
- He lost the thread of the argument halfway through the talk.
