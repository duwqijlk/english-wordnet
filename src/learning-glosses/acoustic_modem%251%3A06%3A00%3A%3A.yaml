simpleMeaning: This box swaps sounds on the phone line for electric signals, and electric signals for
  sounds on the phone line.
scope: This box changes what comes down a phone line into electric signals, and changes electric signals
  back into what goes down a phone line.
examples:
- This computer uses an acoustic modem to reach the phone line.
- The acoustic modem turns the computer's signals into tones the phone can carry.
