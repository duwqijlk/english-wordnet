synsetId: 06750757-n
simpleMeaning: A bid set very high so that the players on the other side cannot make their own bids
scope: The high bid itself in a bidding game; not the act of making such a bid, and not taking a place
  before others.
examples:
- His preempt was so high that the other pair could not bid.
- She made a preempt to stop the other side from bidding more.
