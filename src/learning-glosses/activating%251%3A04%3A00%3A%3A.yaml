simpleMeaning: the act of making a person or thing have energy and do things
scope: This sense is the act of making a person or thing have energy and do things; it is also called
  activation, and another name for it is energizing. It is not the energy itself.
examples:
- The activating of the new team was the coach's first job.
- Activating the volunteers before the long day helped them feel ready to work.
