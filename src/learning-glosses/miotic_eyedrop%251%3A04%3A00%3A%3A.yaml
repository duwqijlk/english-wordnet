simpleMeaning: By shrinking the pupil, this medicine lets the clear liquid inside flow out more freely
  and so treats glaucoma, a sickness that raises the pressure where we see.
scope: Medicine for glaucoma that works by shrinking the pupil so the clear liquid inside can flow out.
examples:
- The doctor gave her miotic eyedrops for her glaucoma.
- She keeps the miotic eyedrops beside her bed.
