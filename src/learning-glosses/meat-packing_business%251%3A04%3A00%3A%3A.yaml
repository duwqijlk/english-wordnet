simpleMeaning: Shops get their flesh from this trade, where animals are killed, cut up, and made ready
  in large amounts for sale later.
scope: Also called meat packing and meatpacking, it is the trade that gets flesh ready for sale in large
  amounts.
examples:
- The meat-packing business supplied meat to shops.
- Many people work in a meat-packing business.
