simpleMeaning: a person who thinks so highly of someone that they cannot see that person's faults
scope: 'Another name for this sense is worshiper: a person who admires someone so much that they cannot
  see any faults; not a person who worships a god in religion.'
examples:
- He was a true worshipper of the famous singer and would hear no bad word about her.
- As a worshipper of the old painter, she refused to admit that any of his work was weak.
