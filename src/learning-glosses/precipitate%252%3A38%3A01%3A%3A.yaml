simpleMeaning: to fall straight down, to fall at a sharp angle, or to fall head first
scope: To fall straight down, at a sharp angle, or head first; not the solid stuff that is left after
  a liquid settles or is passed through a filter.
examples:
- The climber lost his hold and precipitated headlong into the valley below.
- The stone broke free and precipitated straight down the mountain side.
