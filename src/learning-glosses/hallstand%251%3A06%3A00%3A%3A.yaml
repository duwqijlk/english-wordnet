simpleMeaning: A stand in a hallway for hanging coats, hats, and umbrellas, which usually has a mirror.
scope: This is a stand in a hallway for hanging coats, hats, and umbrellas, not a wardrobe or a coat hook.
examples:
- He hung his coat on the hallstand.
- The hallstand by the door had a mirror.
