simpleMeaning: a badge worn at the top of the arm on a soldier's coat to show which group of soldiers
  the wearer belongs to
scope: A badge on a soldier's coat that shows the wearer's division; not a shoulder cord and not a medal.
examples:
- His shoulder flash showed he belonged to the Third Division.
- The new soldier sewed a shoulder flash onto his uniform.
