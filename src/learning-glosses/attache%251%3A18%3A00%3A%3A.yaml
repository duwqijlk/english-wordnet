simpleMeaning: a person with special skills who works on the staff of a group sent to another country
  to speak for their own country
scope: A person with special skills who works for a diplomatic mission, not a flat case for carrying papers.
examples:
- The attache spoke to the press about the talks.
- She worked as a cultural attache at the embassy.
