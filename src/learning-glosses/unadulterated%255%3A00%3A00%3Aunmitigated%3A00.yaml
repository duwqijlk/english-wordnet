schema: oewn-learning-gloss-v2
senseId: unadulterated%5:00:00:unmitigated:00
synsetId: 01524174-s
simpleMeaning: complete, with no limit; used in informal speech to make another word stronger, often to
  show that something is bad
scope: Another name for this sense is perfect, complete, staring, utter, pure, thorough, gross, stark,
  everlasting, consummate, sodding or arrant, all used in the same way. This sense makes a word stronger;
  it is not the sense that means clean and not mixed with anything else.
examples:
- What he told the police was unadulterated nonsense.
- She called him an unadulterated fool for trusting the man.
