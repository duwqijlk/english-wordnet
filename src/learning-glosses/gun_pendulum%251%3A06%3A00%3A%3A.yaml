simpleMeaning: a gun hung so that it swings, used to find the speed of a shot from how far it kicks back
  when fired
scope: A gun hung to swing, used to measure shot speed; not a clock pendulum and not a plain hanging gun.
examples:
- The gun pendulum swung back when the shot was fired.
- They used a gun pendulum to find the speed of the shot.
