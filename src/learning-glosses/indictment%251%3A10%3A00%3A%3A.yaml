simpleMeaning: a formal paper written for a lawyer who acts for the state, saying that a person is charged
  with a crime
scope: 'Also called a bill of indictment: this is the formal paper that charges a person with a crime,
  not a court''s final finding that the person did the crime.'
examples:
- The grand jury returned an indictment against the man.
- She read the indictment, which charged him with theft.
