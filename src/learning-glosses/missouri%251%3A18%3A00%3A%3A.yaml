simpleMeaning: A person of the Siouan people who once lived in the valley of the river that bears their
  name, in the state of the same name.
scope: 'Also called Missouria: a person of the Siouan people who once lived in the river valley of the
  state that bears their name, not the language spoken by these people.'
examples:
- A Missouri elder spoke of the old villages by the river.
- The Missouri once lived along the river that now bears their name.
