simpleMeaning: A band of tough tissue that joins part of the liver to the breathing muscle and the belly
  wall.
scope: A band of tough tissue that joins part of the liver to the breathing muscle and the belly wall,
  not a muscle and not a blood vessel.
examples:
- The falciform ligament holds part of the liver in place.
- Surgeons cut the falciform ligament to reach the liver.
