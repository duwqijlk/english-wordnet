simpleMeaning: food that an animal such as a cow brings back up from its stomach to chew again
scope: Food that an animal such as a cow brings back up to chew again; not a lump of tobacco or another
  thing that a person chews.
examples:
- The cow lay in the field chewing its cud.
- A sheep stands quietly and chews the cud.
