simpleMeaning: A big event put on in 1883 by William F. Cody, with horse riding and fine shooting on a
  grand scale, that toured the United States and Europe.
scope: A touring event of horse riding and shooting from 1883, also called Buffalo Bill's Wild West Show;
  its nearest kin are the circus and the rodeo.
examples:
- The Wild West Show came to town with riders and sharp shooters.
- Crowds packed in to see the Wild West Show in the big field.
