senseId: 'catalepsy%1:26:00::'
synsetId: 14093688-n
simpleMeaning: A state like a trance, in which a person cannot move at will and does not answer to things
  around them.
scope: A trance-like state with no movement at will and no answer to things around, not ordinary sleep.
examples:
- The patient fell into a catalepsy and lay still for hours.
- During the catalepsy, she did not flinch at the loud noise.
