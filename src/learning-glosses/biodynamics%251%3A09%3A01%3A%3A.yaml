simpleMeaning: the part of the study of living things that deals with energy and how living things move
  and act
scope: The part of the study of living things that deals with their energy and activity, not the study
  of how living things are built and not the study of where they live.
examples:
- She studied the biodynamics of the human body.
- The course covers the biodynamics of animals in motion.
