senseId: 'overhaul%1:04:01::'
synsetId: 00265962-n
simpleMeaning: the act of repairing something and changing it so that it works better and is like new
  again
scope: Renovation and redevelopment are other names for this sense. This is the act of repairing something
  and making it better and like new again. Not the verb overhaul, which means to do this work.
examples:
- The hospital needs a complete overhaul of its booking system.
- They planned a major overhaul of the old school building.
