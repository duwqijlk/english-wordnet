simpleMeaning: Picked ripe and cured in salty water, this fruit is then dried, pickled, or kept in cans
  or in oil.
scope: Also called ripe olive, this is fruit picked ripe and cured in salty water, then dried, pickled,
  or kept in cans or in oil, set apart from fruit picked before it is ripe.
examples:
- The black olive was cured in salty water.
- Black olives are kept in cans or in oil.
