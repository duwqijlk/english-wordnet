simpleMeaning: a speech in a play, usually long, made to seem like the unspoken thoughts of a person in
  the play
scope: A speech in a play that shows one person's thoughts; not a talk between two people in the play
  and not a speech made to other people in the play.
examples:
- In the play, her soliloquy showed what she was thinking while she stood alone.
- The actor gave a long soliloquy about his secret fears.
