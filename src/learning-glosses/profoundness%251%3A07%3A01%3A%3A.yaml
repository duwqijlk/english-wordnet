simpleMeaning: deep thought, sharp knowledge, and a clear eye for what things mean, and more of the same
  kind
scope: Deep thought and sharp knowledge; also called profundity; not deep feeling, and not a deep hole
  or a deep sound.
examples:
- The profoundness of her answer surprised the whole class.
- His essay showed a profoundness that few of his friends could match.
