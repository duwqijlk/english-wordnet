senseId: 'photalgia%1:26:00::'
synsetId: 14353293-n
simpleMeaning: Often found in people whose skin, hair and eyes have no colour, this is pain in the eye
  that comes from bright light
scope: 'Also called photophobia: pain in the eye from bright light, not an ache from reading and not a
  hurt from a blow to the eye.'
examples:
- Bright sunlight gave her photalgia after only a few minutes outdoors.
- His photalgia grew worse whenever he stepped into strong light.
