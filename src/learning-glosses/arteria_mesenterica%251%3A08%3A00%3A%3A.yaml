simpleMeaning: One of two branches of the main body artery that run between the two layers of the fold
  of tissue that holds the bowels to the bowels.
scope: 'Also called mesenteric artery: one of two branches of the main body artery that run between the
  two layers of the fold of tissue that holds the bowels to the bowels, not the main body artery itself
  and not a vein.'
examples:
- The arteria mesenterica carries blood to the bowels.
- Food is taken up where the arteria mesenterica feeds the gut.
