simpleMeaning: a white oxide in the form of tiny crystals, a chemical in which oxygen has joined with
  another element, used to make calcium hydroxide
scope: 'Also called lime, quicklime, calx, calcined lime, calcium oxide, or fluxing lime: a white chemical
  used to make calcium hydroxide, not the green fruit called lime and not the white rock called chalk.'
examples:
- Burnt lime was added to the mix to make calcium hydroxide.
- The workers stored the burnt lime in dry sacks.
