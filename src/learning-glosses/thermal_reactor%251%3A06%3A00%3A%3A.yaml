simpleMeaning: a device that splits atoms, where the splits are caused by neutrons that a material has
  slowed down
scope: A device that splits atoms with slow neutrons, not a fast reactor that uses fast neutrons, and
  not a bomb that splits atoms in one blast.
examples:
- The new thermal reactor began making power for the city this year.
- Engineers checked the thermal reactor to make sure the neutrons stayed slow.
