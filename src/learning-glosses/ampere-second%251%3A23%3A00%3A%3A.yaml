simpleMeaning: a unit of electric charge, the amount moved when a current of one unit flows for one unit
  of time
scope: 'Also called a coulomb: a unit of electric charge, not a unit of current and not a unit of time.'
examples:
- A charge of one ampere-second passes when a current of one ampere flows for one second.
- The battery stored only a few ampere-seconds of charge.
