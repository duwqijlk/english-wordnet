simpleMeaning: Atabrine, a drug that treats some kinds of worms living in the body and was once used to
  treat malaria
scope: 'Also called mepacrine and quinacrine hydrochloride: a drug for some kinds of worms in the body,
  once used for malaria, not a drug for other fevers.'
examples:
- The doctor gave him quinacrine for the worms.
- Quinacrine was once used to treat malaria.
