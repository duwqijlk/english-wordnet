simpleMeaning: not able to stay calm and wait, especially when held back or kept waiting
scope: This means not able to wait calmly when held back or delayed; it is not the same as being unable
  to rest or keep still.
examples:
- The workers grew restive after months of waiting for a pay rise.
- Passengers became restive when the train was delayed again.
