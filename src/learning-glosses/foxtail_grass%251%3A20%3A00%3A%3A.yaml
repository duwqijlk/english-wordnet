simpleMeaning: grasses of two kinds, Alopecurus and Setaria, with thick flower heads like soft or stiff
  brushes
scope: 'Also called foxtail: grasses with thick brush-like flower heads, not the orchid called foxtail
  orchid and not a lawn grass.'
examples:
- Foxtail grass grows thick along the field edge, its soft brush-like heads swaying.
- We cut back the foxtail grass before its bristly flower heads went to seed.
