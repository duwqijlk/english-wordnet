simpleMeaning: A plant of southern Europe and North Africa with purple flowers, yellow fruits, and a forked
  root that people once thought held magic powers.
scope: Also called devil's apples, this is the whole plant with purple flowers and a forked root, not
  the root alone as used for medicine or as a drug.
examples:
- Mandrake grew at the edge of the field, its purple flowers open.
- A mandrake stood among the herbs, yellow fruits hanging from its stems.
