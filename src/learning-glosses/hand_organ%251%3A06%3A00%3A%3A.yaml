simpleMeaning: A music-making box that plays tunes when a peg-covered roller inside it turns round.
scope: This is a music-making box that plays tunes when a peg-covered roller inside it turns, not a piano
  or a wind pipe; also called barrel organ and grind organ.
examples:
- The hand organ played in the square.
- A man turned the hand organ at the fair.
