simpleMeaning: in a bullfight, this bullfighter runs up and plants decorated darts in the neck or shoulders
  of the bull
scope: The bullfighter who sticks decorated darts into the bull, not the matador who kills it and not
  the picador on horseback.
examples:
- The banderillero ran in and stuck two decorated darts into the bull's shoulders.
- The banderillero steps forward to place the darts in the bull's neck.
