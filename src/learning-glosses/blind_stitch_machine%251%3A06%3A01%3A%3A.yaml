simpleMeaning: Thread that joins two pieces of fabric stays out of sight, or nearly so, on this device
  that sews them together
scope: This device is also called a blindstitch machine and a blindstitch sewing machine, and it sews
  two pieces of fabric with thread that stays out of sight.
examples:
- The blind stitch machine joined the two pieces of fabric, and the thread could not be seen.
- She finished the seam with the blind stitch machine, and the thread could not be seen.
