simpleMeaning: In Europe and North America, a plant of ponds and slow-moving streams bears white blooms,
  some of its leaves under the surface and some floating.
scope: Also called water buttercup, this is one of the pond plants of Europe and North America whose leaves
  are partly under the surface and partly floating, with white blooms.
examples:
- We found water crowfoot in the pond near the bridge.
- The water crowfoot was in bloom along the slow stream.
