simpleMeaning: Tiny white flowers shaped like bells hang in thick soft bunches on a bush that loses its
  leaves each year and grows many branches.
scope: 'Also called he-huckleberry, male berry, and maleberry: a bush that loses its leaves each year,
  with bunches of small white bell-shaped flowers.'
examples:
- The privet andromeda was covered in small white bell-shaped flowers.
- We planted a privet andromeda for its dense bunches of white flowers.
