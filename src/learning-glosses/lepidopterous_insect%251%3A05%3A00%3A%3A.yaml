simpleMeaning: Tiny scales more or less cover the four wings of this grown bug
scope: 'Another name for a lepidopteran and a lepidopteron: a grown insect with four wings more or less
  covered with tiny scales, not a wingless insect and not a bat.'
examples:
- The lepidopterous insect flew from flower to flower in the garden.
- She pinned the lepidopterous insect in her case next to the moths.
