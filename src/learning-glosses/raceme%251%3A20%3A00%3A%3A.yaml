simpleMeaning: usually a long group of flowers on a single main stem, with the lowest flowers opening
  first
scope: Usually a long group of flowers on one main stem, the lowest opening first, not a single flower
  and not a bunch of flowers with no order.
examples:
- The raceme hung down with small white flowers along its stem.
- New buds on the raceme opened from the bottom up.
