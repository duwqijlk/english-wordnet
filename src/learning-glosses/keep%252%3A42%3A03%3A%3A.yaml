simpleMeaning: to remain in good condition and not go bad, as food does when stored well.
scope: This sense is not about storing something or holding on to it, and not about continuing an activity;
  it describes food remaining unspoiled.
examples:
- These apples keep well in a cool cellar.
- The cheese kept for months because it was wrapped tightly.
