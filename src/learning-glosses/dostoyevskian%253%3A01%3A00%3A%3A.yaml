simpleMeaning: This word is used of things that have to do with that writer, or that are written in his
  way
scope: Things that have to do with that writer or are written in his way; Dostoevskian is another name
  for this sense, and it is not about any other writer.
examples:
- The Dostoyevskian tone of the story came from its long talks about right and wrong.
- Critics called the play Dostoyevskian in its dark mood.
