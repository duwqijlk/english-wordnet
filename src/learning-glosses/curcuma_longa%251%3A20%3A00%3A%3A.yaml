simpleMeaning: A warm-climate plant from India, grown in many places, with yellow flowers and a big sweet-smelling
  dark yellow underground stem; it gives a spice and a yellow dye
scope: This is a tropical Indian plant grown for its spice and yellow dye; turmeric and Curcuma domestica
  are other names for this sense, and it stands apart from other spice plants by its dark yellow underground
  stem.
examples:
- Curcuma longa grows in warm fields in India.
- Farmers dry the underground stem of Curcuma longa to make a yellow spice.
