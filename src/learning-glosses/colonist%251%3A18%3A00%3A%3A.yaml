simpleMeaning: a person who goes to live in a new land ruled by another country, or who moves to a new
  country to live there
scope: 'Also called settler: a person who moves to a new country to live there and stay, not a visitor
  who stays only a short time.'
examples:
- The first colonists built small houses near the river.
- Many colonists came by ship to start a new life.
