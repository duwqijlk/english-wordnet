simpleMeaning: The way something stays put and is hard to get rid of, to rub out, or to wash off
scope: The hard-to-remove quality of a mark or stain, also called ineffaceability; not the mark itself
  and not something that fades on its own.
examples:
- The indelibility of the ink made the stain a lasting part of the shirt.
- Oil paint is prized for its indelibility on canvas.
