senseId: 'physical_restoration%1:04:00::'
synsetId: 00401803-n
simpleMeaning: Help given to people who cannot use part of their body well, to take away or lessen what
  keeps them from doing things.
scope: This is help that takes away or lessens what keeps a person from using the body well; physical
  rehabilitation is another name for this sense, not a cure that makes the body whole again and not help
  with money or a home.
examples:
- Physical restoration after the injury took six months of daily work.
- He went to physical restoration to get his leg working again.
