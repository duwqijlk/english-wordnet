simpleMeaning: a bag that closes with a cord pulled tight, used to hold money
scope: A bag that closes with a pulled cord and holds money, not a purse with a clasp and not a wallet
  that folds flat.
examples:
- The old moneybag was tied with a cord and full of coins.
- He kept his savings in a leather moneybag.
