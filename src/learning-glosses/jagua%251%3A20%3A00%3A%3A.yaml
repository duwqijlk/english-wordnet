scope: Also called genipap fruit or marmalade box, it is the tree of the West Indies and northern South
  America that bears juicy fruit as big as oranges.
examples:
- The jagua bore juicy fruit as big as oranges.
- A jagua grew in northern South America and bore juicy fruit.
