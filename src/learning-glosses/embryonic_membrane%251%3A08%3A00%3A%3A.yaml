simpleMeaning: The inner thin layer around a young animal before birth, in higher animals with a backbone,
  above all when it covers the head at birth.
scope: The inner thin layer around a young animal before birth, also called a veil and a caul; not the
  outer skin and not the cord.
examples:
- The embryonic membrane covered the calf's head at birth.
- Doctors found the embryonic membrane still around the newborn.
