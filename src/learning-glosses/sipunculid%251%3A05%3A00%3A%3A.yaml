simpleMeaning: looking like a peanut, a small sea worm with a plain body pulls its front end back inside
  when touched
scope: It is also called a peanut worm, a small sea worm that pulls in its front end when touched, not
  a worm with a jointed body.
examples:
- A sipunculid drew its front end inside when touched.
- The sipunculid looked like a peanut when its front end was inside.
