simpleMeaning: In physics, a sudden move by an electron, an atom, or a molecule from one energy state
  to another, giving off or taking in a fixed amount of energy
scope: This is the physics sense of a sudden move between energy states, not a big sudden change in general.
examples:
- An electron makes a quantum jump when it moves to a higher state.
- The quantum jump gave off a flash of light.
