simpleMeaning: a building with clear walls and roof where plants are grown and shown under set conditions
scope: A building with clear walls and roof where plants are grown and shown under set conditions; greenhouse
  is another name for this sense, not an open garden and not a cold frame.
examples:
- Tomatoes grow in the glasshouse all winter.
- She showed her orchids in the glasshouse.
