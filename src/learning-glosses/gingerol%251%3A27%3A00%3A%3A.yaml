simpleMeaning: A substance that comes from a hot root and gives that root its hot taste
scope: A substance from a hot root that makes it taste hot, not the root itself and not a spice mix.
examples:
- Gingerol gives ginger its bite.
- Scientists study gingerol to learn why ginger burns the tongue.
