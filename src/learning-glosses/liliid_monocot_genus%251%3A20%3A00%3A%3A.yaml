simpleMeaning: Plants with one seed leaf, one branch, mostly soft, with flowers that usually have outer
  leaves like petals and petals and a seed case of joined parts, form this genus.
scope: A genus of one-seed-leaf plants, not a family and not a single plant.
examples:
- The liliid monocot genus holds herbs with petal-like flowers.
- This liliid monocot genus groups plants with joined seed cases.
