simpleMeaning: These small birds are busy and brownish or greyish, and they live in the lands of Europe,
  Asia and Africa.
scope: Also called true warbler; small brownish or greyish birds from the lands of Europe, Asia and Africa,
  not the birds of the same name from the Americas.
examples:
- We saw an Old World warbler in the garden this morning.
- Old World warblers are small brownish or greyish birds.
