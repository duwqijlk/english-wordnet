senseId: 'equality_before_the_law%1:07:00::'
synsetId: 05189720-n
simpleMeaning: the right to be treated in the same way by the rules of a state as everyone else
scope: The right to the same treatment under the rules of a state for every person, rich or poor; not
  a right to vote and not a right to free speech.
examples:
- Equality before the law means every person is treated in the same way by the rules of a state.
- Under equality before the law, a poor person is treated in the same way as a rich person.
