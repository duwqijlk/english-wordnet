simpleMeaning: A person who writes short printed papers, often taking one side on matters argued about
  in public
scope: A person who writes short printed papers, often taking one side on matters argued about in public;
  not a writer of books and not a writer of news stories.
examples:
- The pamphleteer attacked the mayor in print.
- A fierce pamphleteer stirred the town against the new tax.
