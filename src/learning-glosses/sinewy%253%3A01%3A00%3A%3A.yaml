simpleMeaning: made of the tough cords that join muscle to bone, or looking like such a cord
scope: Made of tough cords in the body, or like such a cord, not merely strong and not full of gristle
  in meat.
examples:
- The sinewy cords in his forearm stood out under the skin.
- You could see the sinewy cords along the back of her hand.
