simpleMeaning: A sickness of the nerves outside the brain and the cord down the back, marked by pain,
  weakness, and at times limbs that cannot move; its cause is not known.
scope: Also called infectious polyneuritis or Landry's paralysis; a sickness of the nerves outside the
  brain and the cord down the back, marked by pain, weakness, and at times limbs that cannot move.
examples:
- Guillain-Barre syndrome left his limbs weak and in pain.
- The doctors said Guillain-Barre syndrome has no known cause.
