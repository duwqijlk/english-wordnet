simpleMeaning: to give a ship the equipment it needs and bring it into active service.
scope: This is not the payment for services, and it is not the act of giving someone authority in general;
  it applies only to ships being made ready.
examples:
- The navy commissioned the new destroyer last month.
- The ship was commissioned after a year of repairs.
