simpleMeaning: The hinge joint where the lower arm meets the upper arm, and the same joint in the front
  leg of a four-legged animal
scope: The hinge joint where the lower arm meets the upper arm, also called elbow, cubital joint, cubitus,
  elbow joint and human elbow; not the shoulder joint and not the wrist joint.
examples:
- The articulatio cubiti bends when you lift your arm.
- The articulatio cubiti in a horse works like the elbow in a person.
