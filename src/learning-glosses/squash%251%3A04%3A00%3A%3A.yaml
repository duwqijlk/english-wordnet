simpleMeaning: a game for two or four players in a closed room with walls, where they hit a ball with
  long-handled rackets
scope: This is the sport played with rackets and a ball in a closed room. It is not the plant, and not
  the fruit of that plant eaten as a vegetable.
examples:
- They play squash every Tuesday at the sports center.
- Squash is a fast game for two players.
