simpleMeaning: A light material full of small spaces, made by putting gas bubbles into it while it is
  being made
scope: This is the light material made with gas bubbles, not the verb that means to become bubbly or full
  of bubbles.
examples:
- The chair seat is made of thick foam.
- She packed the glass in soft foam to keep it safe.
