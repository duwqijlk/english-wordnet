simpleMeaning: Made of iron or steel sheets, this old kind of body covering took the place of mail in
  the 1300s
scope: 'Also called plate armour: old body covering of iron or steel sheets that took the place of mail
  in the 1300s, not the steel plates that guard forts or cars.'
examples:
- In the 1300s, soldiers gave up mail for plate armor.
- The museum shows a full suit of plate armor.
