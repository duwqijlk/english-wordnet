simpleMeaning: A very big tan American moth, one of the silkworm moths, with big eye-like spots on its
  back wings; its young feed on fruit trees and shade trees
scope: A very big tan American moth with eye-like spots on its back wings, not a butterfly and not a small
  brown house moth.
examples:
- The polyphemus moth rested on the oak with its wings spread wide.
- A polyphemus moth caterpillar fed on the leaves of our shade tree.
