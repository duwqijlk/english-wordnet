simpleMeaning: The angle between the straight-up plane through a body in the sky and the plane of the
  line running north to south.
scope: An angle that fixes a body's place in the sky, also called azimuth; not the body's height and not
  a distance.
examples:
- The AZ of the star was read from the dial.
- Sailors use the AZ to find where a star stands.
