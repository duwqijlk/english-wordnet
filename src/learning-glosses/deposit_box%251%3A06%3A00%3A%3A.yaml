simpleMeaning: a strong metal safe that will not burn, often kept in a bank, for keeping things of great
  worth
scope: A strong metal safe, often in a bank, for keeping things of great worth, also called a lockbox,
  and not a bank account or a small cash tin at home.
examples:
- She keeps her grandmother's jewels in a deposit box at the bank.
- He rented a deposit box to store the family will.
