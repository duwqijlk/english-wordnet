simpleMeaning: A heavy silver-coloured poisonous metal that joins with one or two other atoms, the only
  metal that stays liquid at everyday temperatures
scope: A heavy poisonous metal that is liquid at everyday temperatures; mercury, quicksilver, atomic number
  80 and hydrargyrum are other names for this sense, not a light metal that melts only in great heat and
  not a gas.
examples:
- Hg is the only metal that stays liquid at room temperature.
- The old thermometer held a small drop of Hg.
