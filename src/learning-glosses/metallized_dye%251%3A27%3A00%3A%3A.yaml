senseId: 'metallized_dye%1:27:00::'
synsetId: 14651707-n
simpleMeaning: An acid colouring liquid in which the part with a negative charge holds a metal atom locked
  in place by the rest of the molecule.
scope: An acid colouring liquid whose part with a negative charge holds a metal atom locked in place,
  not a plain colouring liquid with no metal in it and not a colour that only coats the outside.
examples:
- The metallized dye gave the cloth a deep colour that would not wash out.
- This metallized dye holds a metal atom in its charged part.
