simpleMeaning: for buildings or large groups such as a government, no longer strong or steady and close
  to falling down or coming to an end
scope: This sense is about buildings or large groups that are close to falling or ending; it is not about
  a person walking in a weak, unsteady way because of illness or old age.
examples:
- The tottering empire fell within a few years.
- They left the tottering old building before it fell down.
