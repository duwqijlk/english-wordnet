simpleMeaning: All the land where rain and streams flow into one river and its smaller streams, and all
  that water goes out at the same place
scope: This is land around a river system, also called basin, catchment area, catchment basin, drainage
  area, drainage basin and river basin; it is not a high line of land between two river systems and not
  a big turning-point event in history.
examples:
- The whole watershed was put under rules to keep the river clean.
- Farms across the watershed send their rain water to the same river.
