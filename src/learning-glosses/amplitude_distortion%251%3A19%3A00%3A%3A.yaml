simpleMeaning: When what goes in and what comes out do not grow in step, the signal is warped.
scope: Also called nonlinear distortion, this warping of a signal means what comes out does not grow in
  step with what goes in.
examples:
- Amplitude distortion changed the output signal.
- The amplitude distortion broke the straight link between input and output.
