senseId: 'moro_reflex%1:04:00::'
synsetId: 00866962-n
simpleMeaning: 'A natural movement of a young baby: a sudden loud noise makes the baby stretch out its
  arms and bend its legs.'
scope: This is the automatic startle response of a very young baby, also called startle reflex, not a
  movement the baby learns or chooses and not a response seen in older children.
examples:
- The Moro reflex made the baby throw out her arms at the loud bang.
- Her Moro reflex was strong in her first weeks.
