simpleMeaning: Tough ears and a long part sticking out at the back mark this small, fast flying mammal
  that hunts insects, seen often in warm lands.
scope: Also called a free-tailed bat or a freetail, it is a small, fast flying mammal that hunts insects,
  with tough ears, often found in warm places.
examples:
- A freetailed bat darted after insects in the warm evening air.
- We watched a freetailed bat hunting insects as night fell.
