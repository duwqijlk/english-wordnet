simpleMeaning: One of the small units that make up the matter carrying the body's plans, made from thymine,
  a sugar with one oxygen less, and a phosphate group.
scope: 'Also called deoxythymidine monophosphate, deoxythymidylic acid, thymidine monophosphate, thymidylic
  acid, T, and TMP: one of the small units that make up DNA, built from thymine, a sugar with one oxygen
  less, and a phosphate group.'
examples:
- The lab found dTMP, a small unit of DNA made from thymine, in the sample.
- dTMP is one of the units that make up DNA.
