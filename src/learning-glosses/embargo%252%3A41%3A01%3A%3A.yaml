simpleMeaning: to stop papers from being made public, for safety or because of who owns the rights to
  them
scope: This means stopping papers from being made public; it is not stopping trade with a country, and
  not a ban on all use of a thing.
examples:
- The court embargoed the report until the trial had ended.
- The government embargoed the papers for safety reasons.
