simpleMeaning: The spread of Jews outside Israel since the temple in Jerusalem was destroyed in 587-86
  BC and they were sent away to Babylonia, still going on today.
scope: This is the long spreading of the Jews outside Israel, not a single move nor the return to Israel.
examples:
- The Diaspora began with the exile to Babylonia.
- Jews of the Diaspora live in many lands.
