simpleMeaning: to stop living, so the body loses all the parts and work it needs to stay alive
scope: 'Also called die, go, pass, pass away, choke, conk, croak, decease, drop dead, exit, expire, give-up
  the ghost, kick the bucket, perish, pop off and cash in one''s chips: to stop living, not to leave a
  place and not to fall asleep.'
examples:
- He bought the farm at the age of ninety.
- The old soldier bought the farm in the war.
