simpleMeaning: a small round lump of meat cut up very fine, fried or left to cook gently in thin soup
scope: A small round lump of meat cut up very fine, fried or left to cook gently in thin soup; not a whole
  piece of meat, and not a cake.
examples:
- She rolled the meat into meatballs for dinner.
- The meatballs simmered in tomato sauce all afternoon.
