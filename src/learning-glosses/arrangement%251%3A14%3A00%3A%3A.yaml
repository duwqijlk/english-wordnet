simpleMeaning: A neat set of things or people put in order, taken as one group
scope: A neat set of things or people put in order, not a set way of sorting things into groups and not
  a piece of music made for certain voices or instruments.
examples:
- She made a flower arrangement for the table.
- The arrangement of chairs made the room look tidy.
