simpleMeaning: a low-ranking officer on a ship that carries goods, who tells the other sailors what work
  to do
scope: 'Also called bo''sun, boatswain, bos''n or bosun: a low-ranking officer on a ship that carries
  goods who tells the other sailors what work to do, not the captain and not a sailor with no rank.'
examples:
- The bo's'n called the crew to the deck.
- Our bo's'n showed the new sailors how to tie the ropes.
