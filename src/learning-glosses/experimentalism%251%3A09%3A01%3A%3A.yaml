simpleMeaning: The belief that knowledge should rest on what is found by testing things in practice.
scope: The belief that knowledge should rest on testing things in practice; not the belief that knowledge
  comes from reason alone and not a love of trying new things for fun.
examples:
- Experimentalism guided his approach to science.
- She held to experimentalism, trusting tests over theory.
