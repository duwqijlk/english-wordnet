simpleMeaning: happening in or reaching all parts of a country
scope: 'Also called countrywide: this adjective sense is about something that happens across a whole country,
  not the adverb sense that says how far something spreads.'
examples:
- The story drew nationwide interest from readers in every state.
- They ran a nationwide search to find the missing child.
