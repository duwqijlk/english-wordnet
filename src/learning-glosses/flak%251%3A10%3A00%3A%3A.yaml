simpleMeaning: very strong words that say a person or thing is bad
scope: Attack, fire and blast are other names for this sense; these are very strong words that say a person
  or thing is bad. Not guns that shoot at planes and not a person who speaks for a company.
examples:
- The mayor took a lot of flak for the new tax plan.
- Do not give me any flak about the late report.
