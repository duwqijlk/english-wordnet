simpleMeaning: a killer who strikes without warning, above all one who kills a well-known political leader
  and is often paid for the killing
scope: A killer who strikes by surprise, often paid for the killing, and assassin is another name for
  this sense; not a soldier in open battle and not the shout of praise.
examples:
- The bravo waited in the dark street for his victim.
- Police said a bravo had been paid to kill the minister.
