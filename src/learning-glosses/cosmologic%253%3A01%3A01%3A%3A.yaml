senseId: 'cosmologic%3:01:01::'
synsetId: 02713737-a
simpleMeaning: About the branch of thought that looks at what the universe is made of, the rules it follows,
  and above all space, time and cause
scope: This word is used of the branch of thought that deals with the stuff and rules of the universe,
  above all space, time and cause; cosmological is another name for this sense, not of the branch of star
  study about how the universe began.
examples:
- A cosmologic argument says the universe needs a cause outside itself.
- His cosmologic philosophy dealt with space, time and cause.
