simpleMeaning: A tree of far southern Florida and the West Indies with thin scaly bark and fragrant fruits
  and seeds; its hard, heavy, fine-grained wood is called zebrawood.
scope: Another name for Eugenia dicrana, the Florida and West Indies tree that yields zebrawood timber;
  not the broader nakedwood name for several similar trees with dark heartwood.
examples:
- The nakedwood has thin, scaly bark and fragrant fruits.
- The nakedwood yields a hard, heavy wood called zebrawood.
