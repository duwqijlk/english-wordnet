simpleMeaning: A mix of sulfur compounds that forms when metal rock rich in sulfur is heated till it melts.
scope: A mix of sulfur compounds formed when metal rock is heated till it melts, not the flat look of
  a surface with no shine, and not the act of making a thing felt-like.
examples:
- The matte from the smelter was drawn off and cooled.
- Workers skimmed the matte off the hot metal.
