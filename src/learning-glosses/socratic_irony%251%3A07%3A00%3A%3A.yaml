senseId: 'socratic_irony%1:07:00::'
synsetId: 04722584-n
simpleMeaning: Saying you know nothing and want to learn, while showing where what another person says
  does not fit together by asking close questions.
scope: A way of talking in which you say you know nothing and want to learn, while close questions show
  where another person's words do not fit together; close to the Socratic method, but here the point is
  to show the other person's words do not fit.
examples:
- His Socratic irony made the speaker admit he knew less than he claimed.
- She used Socratic irony to show the holes in his plan.
