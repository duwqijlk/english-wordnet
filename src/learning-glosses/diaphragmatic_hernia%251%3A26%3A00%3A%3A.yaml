senseId: 'diaphragmatic_hernia%1:26:00::'
synsetId: 14319901-n
simpleMeaning: A bulge in which part of the stomach pushes up through the thin sheet of muscle that helps
  you breathe
scope: This is a bulge in which part of the stomach pushes up through the thin sheet of muscle that helps
  you breathe; hiatal hernia and hiatus hernia are other names for it, not a bulge in the belly wall and
  not a stomach pain on its own.
examples:
- A diaphragmatic hernia let part of her stomach push upward.
- The scan showed a diaphragmatic hernia after the accident.
