simpleMeaning: An orchid with two triangular leaves and a short, loose cluster of green to rust-colored
  flowers with a mauve-tinged lip, growing in Europe, Asia, North America and Greenland.
scope: This is the small orchid with two triangular leaves and a short spike of greenish to rust-colored
  flowers, not the common twayblade, which is a separate species.
examples:
- Lesser twayblade hides among the moss in damp woodland.
- Each lesser twayblade stem carries a short spike of greenish flowers.
