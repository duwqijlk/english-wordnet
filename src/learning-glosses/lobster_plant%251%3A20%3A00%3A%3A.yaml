simpleMeaning: From warm America, it has poisonous sap and usually bright red leaves like petals that
  narrow to a point round small yellow flowers.
scope: 'Also called poinsettia and painted leaf: a plant of warm America with poisonous sap and red petal-like
  leaves, not a sea creature.'
examples:
- The lobster plant by the door had scarlet leaves round small yellow flowers.
- Keep the lobster plant away from children, as its milk is poisonous.
