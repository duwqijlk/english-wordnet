simpleMeaning: Any evergreen shrub that looks like heather, grown for its dense, showy spikes of small
  bell-shaped or tube-like flowers.
scope: The shrubby plants of the genus Epacris, which look like heather and are grown for crowded spikes
  of small bell- or tube-shaped flowers. It is not heather itself, despite the similar foliage.
examples:
- The epacris in the rockery was covered in tiny bell-shaped flowers.
- We chose epacris for the border because its flower spikes are so showy.
