simpleMeaning: the thin, leaf-like plates that spread out under the cap of a mushroom or a similar fungus
  and make the tiny bits by which it grows
scope: The spore-making plates under a mushroom cap, not the breathing part of a fish and not a measure
  of liquid.
examples:
- The gills under the cap were dark brown.
- He brushed the dirt from the mushroom gills before cooking it.
