simpleMeaning: A film machine that records noises at the same time as the pictures it takes
scope: A film camera that records noise with the pictures, not a silent film camera and not a video camera.
examples:
- The sound camera caught both the words and the actors' faces.
- With a sound camera, the director recorded the scene in one take.
