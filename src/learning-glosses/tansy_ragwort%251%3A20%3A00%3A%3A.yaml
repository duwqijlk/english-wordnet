simpleMeaning: A far-spread weed of Europe with yellow daisy-like blooms, sometimes a hateful weed and
  deadly to cows if eaten in bulk.
scope: This sense is also called ragwort, benweed, and ragweed.
examples:
- Tansy ragwort grew in Europe.
- A tansy ragwort poisoned the cow.
