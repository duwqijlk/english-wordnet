simpleMeaning: Animals feed on this thin-leaved plant of the dry high ground and flat land, found from
  the west of North America to the north of Mexico.
scope: People also call it mountain rice and silk grass, and it is the thin-leaved plant animals feed
  on from the west of North America to the north of Mexico.
examples:
- On dry high ground, silkgrass feeds grazing animals.
- The flat land of the west is home to silkgrass.
