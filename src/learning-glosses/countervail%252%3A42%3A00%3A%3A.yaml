simpleMeaning: To make up for, or balance out.
scope: This sense is to make up for, or balance out, unlike the sense for standing against and softening
  the force of a thing, by doing the opposite.
examples:
- They countervail the loss, making up for it.
- They countervail the weight, balancing it out.
