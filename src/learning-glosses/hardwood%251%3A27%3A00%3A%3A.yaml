simpleMeaning: wood from a tree with wide leaves whose seeds have two first leaves, not from a tree that
  bears cones
scope: This is wood from a tree with wide leaves whose seeds have two first leaves; it is not wood from
  a tree that bears cones.
examples:
- The table is made of hardwood from an oak tree.
- Hardwood from a maple tree was used to make the chair.
