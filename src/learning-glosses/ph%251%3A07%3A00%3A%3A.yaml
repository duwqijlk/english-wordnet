simpleMeaning: 'A number from 0 to 14 that tells how acid or base a liquid is, worked out from its hydrogen:
  7 is neither, more is base, less is acid.'
scope: A scale from 0 to 14 for how acid or base a liquid is, also called the pH scale; not the liquid
  itself and not a test for heat.
examples:
- The pH of the soil was 6, a little on the acid side.
- We checked the pH of the water before we drank it.
