simpleMeaning: The ball thrown in between the two sides starts play in rugby, with the front players of
  both sides crouched side by side with arms locked, fighting for it.
scope: A scrum is another name for this way of starting play in rugby.
examples:
- The scrummage began when the ball was thrown in between the two sides.
- Both sides crouched side by side in the scrummage, arms locked.
