simpleMeaning: a person who follows a person or thing with strong interest and great admiration
scope: 'Also called fan, lover and buff: a person who follows a person or thing with strong interest and
  great admiration. In this sense, lover does not mean a romantic partner.'
examples:
- She is a devotee of classical music and goes to concerts every week.
- Devotees of the old singer waited outside the hall.
