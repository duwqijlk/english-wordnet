simpleMeaning: a slow increase in size or amount
scope: This is a slow increase in size or amount; the growing of the moon is one case of it. Not the describing
  word for the moon in the time when the part you can see grows bigger.
examples:
- The waxing of the moon could be seen night after night.
- The waxing of support for the plan took several months.
