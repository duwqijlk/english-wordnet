senseId: 'psychogenic_fugue%1:26:00::'
synsetId: 14417884-n
simpleMeaning: A mind illness in which a person forgets who they are, leaves home to start a new life,
  and later cannot recall what happened while it lasted.
scope: A mind illness with loss of memory and a new life, also called fugue, not simple forgetfulness
  and not a change of mind about where to live.
examples:
- During the psychogenic fugue, he left his home and began a new life under a different name.
- After the psychogenic fugue ended, she could not recall anything that had happened while it lasted.
