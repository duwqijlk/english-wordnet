simpleMeaning: making a person feel a little angry and bothered
scope: 'Also called annoying, teasing, irritating, pestering, galling, pesky, bothersome, nettlesome,
  plaguey and vexatious: it makes a person feel a little angry and bothered, rather than sad or afraid.'
examples:
- The vexing noise from next door kept us awake all night.
- It is vexing to wait for a bus that never comes.
