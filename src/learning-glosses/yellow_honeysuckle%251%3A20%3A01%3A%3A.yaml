simpleMeaning: Bunches of yellow-green flowers touched with purple grow on this twining bush, which drops
  its leaves in winter, in the northeast of America.
scope: A twining bush of northeastern America, not the climbing kind of the southeast with sweet yellow
  flowers that turn orange.
examples:
- The yellow honeysuckle opened its yellow-green flowers.
- A yellow honeysuckle wound round the post.
