simpleMeaning: any fish or shellfish from the sea that is sold for food, except herring
scope: This is the wide name for sea fish and shellfish sold as food, except herring. It is not the silver
  fish that lives in cold lakes in the north, nor only the flesh of that fish.
examples:
- The shop sold whitefish such as cod and haddock.
- At the market, the whitefish on sale included cod, haddock and shrimp.
