simpleMeaning: A tall, rough perennial American plant with small white flowers and dark red fruit in long
  hanging clusters; young thick stems can be eaten, but fruit and root are toxic.
scope: This names the tall American plant with edible young stems, not the paper or plastic shopping bag
  or the sharp jab of a finger.
examples:
- Poke grows tall and coarse along roadsides, with dark berries hanging in long clusters.
- In spring, people boil the young shoots of poke, but the root and berries are poisonous.
