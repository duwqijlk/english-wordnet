simpleMeaning: In music, a mark that makes a note sound higher, lower, or plain again, even though the
  key does not ask for it
scope: A mark in written music that changes a note's sound, not a note that is sharp or flat by the key
  and not a chance event.
examples:
- The accidental in bar three makes the note sound higher.
- She added an accidental to make the note flat.
