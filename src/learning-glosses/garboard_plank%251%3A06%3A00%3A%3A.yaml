synsetId: 03422112-n
simpleMeaning: the length of thick wood put on a wooden ship first, right beside the long beam that runs
  along the bottom of the ship
scope: Another name for garboard and garboard strake, this is the first strip of wood next to a ship's
  keel, not any other strip of wood on the side of the ship and not the keel itself.
examples:
- They replaced the damaged garboard plank with a new length of oak.
- The garboard plank sits hard against the keel on each side of the ship.
