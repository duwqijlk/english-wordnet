simpleMeaning: the acts people carry out, and the rites they follow, when they worship devils
scope: Acts people carry out, and rites they follow, when they worship devils, also called demonolatry
  and devil-worship; not a belief in devils and not the worship of God.
examples:
- The old diabolatry of the valley centred on rites held at night.
- The diabolatry included rites in which the people bowed before devils.
