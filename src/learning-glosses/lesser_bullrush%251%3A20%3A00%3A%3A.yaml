simpleMeaning: a reed plant found in America, Europe, North Africa and Asia
scope: A reed plant found in America, Europe, North Africa and Asia, also called a narrow-leaf cattail,
  a narrow-leaved reedmace or a soft flag, not a tall reed that grows only in one place and not a grass
  of dry fields.
examples:
- The lesser bullrush grows by the lake in Europe and Asia.
- A lesser bullrush stood among the reeds at the water's edge.
