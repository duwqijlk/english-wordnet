simpleMeaning: used of a cross on a shield, with three knobs in a group at the tip of every arm
scope: 'Also called botonee: a cross with three knobs at the end of each arm, not a plain cross and not
  a cross with a single knob at each end.'
examples:
- The botonnee cross in the book showed three knobs at the end of each arm.
- Heraldry books show a botonnee cross with knobs in groups of three.
