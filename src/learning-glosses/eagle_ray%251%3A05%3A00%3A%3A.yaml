simpleMeaning: A strong tropical ray that swims freely, seeming to soar by flapping its winglike fins;
  usually harmless, it has venom near the base of its tail like a stingray.
scope: This is the tropical fish with winglike fins, not the bird called an eagle and not a stingray.
  Like a stingray it carries venom near the base of its tail, but it is usually harmless. The name is
  ordinary, not dated or technical.
examples:
- The diver kept her distance as a big eagle ray cruised past.
- Children at the aquarium crowded round the tank when an eagle ray swam by.
