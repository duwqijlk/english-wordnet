simpleMeaning: belief in devils and deep respect for them, above all for Satan
scope: Belief in devils and deep respect for them, also called diabolism; not the worship of devils in
  acts and rites and not a fear of devils.
examples:
- His demonism led him to keep books about Satan on his shelf.
- She turned to demonism and gave deep respect to devils in her prayers.
