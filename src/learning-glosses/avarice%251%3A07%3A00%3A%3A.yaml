senseId: 'avarice%1:07:00::'
synsetId: 04952935-n
simpleMeaning: a very strong wish to have more and more money and things, and to keep them for yourself
scope: Also called covetousness, this is a person's very strong wish for more money and things; it is
  not the sense where this wish is shown as a person and named as a deadly sin.
examples:
- His avarice made him hold on to every coin and never help others.
- Avarice drove the rich man to take more land from poor families.
