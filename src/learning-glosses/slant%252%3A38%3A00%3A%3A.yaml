simpleMeaning: to lean or bend away from a straight up position
scope: Also called lean, tip, tilt, and angle. This means to lean away from straight up, not to tell news
  in a way that helps only one side.
examples:
- The old fence slants to one side after years of wind.
- The tower slants a little to the left when you look at it.
