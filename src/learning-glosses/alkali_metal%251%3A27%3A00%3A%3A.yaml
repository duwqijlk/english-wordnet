senseId: 'alkali_metal%1:27:00::'
synsetId: 14736385-n
simpleMeaning: Any of the group I elements of the table of elements that join with one other atom (lithium,
  sodium, potassium, rubidium, cesium or francium)
scope: Any of the group I elements that join with one other atom; alkaline metal is another name for this
  sense, not the group II elements, which join with two other atoms.
examples:
- Sodium is an alkali metal.
- The alkali metals react fast with water.
