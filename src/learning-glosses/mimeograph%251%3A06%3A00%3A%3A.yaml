simpleMeaning: A turning copier that presses ink through a stencil, a sheet with cut-out marks, sold under
  the trade name Roneo.
scope: Also called a mimeo or mimeograph machine; a turning copier that presses ink through a stencil,
  not the act of printing copies from one.
examples:
- The mimeograph ran off fifty copies for the class.
- She used a mimeograph to print the school paper.
