simpleMeaning: advice to be careful because something is about to happen, especially danger or something
  bad
scope: Advice to be careful about what is about to happen, also called warning and monition; not strong
  angry words for something a person has already done and not general help.
examples:
- She read the letter of admonition about the dangers ahead.
- His final admonition was not to play with matches near the house.
