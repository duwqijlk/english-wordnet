simpleMeaning: Insulting words for how Roman Catholics worship and for what they do in church
scope: 'Also called papism: insulting words for how Roman Catholics worship and for what they do in church,
  not the church itself and not a fair name for its ways.'
examples:
- He used the word popery as an insult for Catholic ways of worship.
- The old book used popery to attack the rites of the Roman Catholic Church.
