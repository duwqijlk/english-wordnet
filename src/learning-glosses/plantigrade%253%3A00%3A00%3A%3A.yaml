senseId: 'plantigrade%3:00:00::'
synsetId: 00754874-a
simpleMeaning: Said of a mammal that walks on its whole foot, heel and toes both down on the ground, like
  rabbits, raccoons, bears and people
scope: This describes a mammal walking with the whole sole of the foot flat on the ground, not walking
  on the toes only; the noun plantigrade names an animal that walks this way.
examples:
- Bears are plantigrade, so their whole foot touches the ground with each step.
- A plantigrade animal walks with the full sole of its foot flat on the ground.
