simpleMeaning: A church censure by Rome, taking away some sacraments and Christian burial from one person,
  or all in a place.
scope: A church censure by Rome, taking away some sacraments and Christian burial from one person, or
  all in a place; not to wreck by gunfire, as an enemy's line of supply.
examples:
- Their interdict fell on the town.
- The interdict was lifted at last.
