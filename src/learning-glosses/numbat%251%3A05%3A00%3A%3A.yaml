simpleMeaning: Termites are the food of a small Australian animal with a pouch, a long nose and strong
  claws, now nearly gone.
scope: Other names for it are anteater and banded anteater, and it is the small Australian animal with
  a pouch that eats termites and is now nearly gone.
examples:
- The numbat pushed its long snout into the termite nest.
- The numbat is now nearly gone from the wild.
