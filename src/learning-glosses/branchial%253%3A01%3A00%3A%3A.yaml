simpleMeaning: Of or having to do with gills, or with parts of the body that grow from gills in the unborn
  young
scope: Of or having to do with gills, or with parts of the body that grow from gills in the unborn young;
  not of the lungs and not of the skin.
examples:
- Branchial arches form the gills of a fish.
- The branchial muscles move the gills as the fish breathes.
