senseId: 'contra_danse%2:38:00::'
synsetId: 01900288-v
simpleMeaning: to dance a folk dance in which pairs of dancers face each other in two long lines
scope: To dance a folk dance in two long lines facing each other; contradance and contredanse are other
  names for this sense; not the dance itself as a thing, and not a modern dance.
examples:
- They will contra danse at the village dance after supper.
- She learned to contra danse at the folk festival.
