simpleMeaning: In Yiddish, a boldness so great it shocks, with no shame and no fear
scope: In Yiddish, a boldness so great it shocks, with no shame and no fear; chutzpah and hutzpah are
  other names for this sense, not boldness that stays within good manners and not anger.
examples:
- It took real chutzpa to ask for a raise on his first day.
- Her chutzpa shocked the whole room.
