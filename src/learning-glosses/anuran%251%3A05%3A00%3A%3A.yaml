simpleMeaning: 'a name for the whole group of frogs and toads: stout, tailless animals with long back
  legs made for leaping, at home both in water and on land'
scope: 'Also called frog, toad, batrachian, salientian, and toad frog: the group name for frogs and toads,
  not a single kind of frog and not a salamander.'
examples:
- Frogs and toads are anurans, with long hind legs for leaping.
- The anuran sat by the pond, ready to jump into the water.
