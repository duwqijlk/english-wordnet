simpleMeaning: A company allowed by Congress to buy house debts from banks and sell them on, so banks
  can lend more money
scope: 'Also called FHLMC and Freddie Mac: a company that buys house debts from banks so they can lend
  more, not a bank that lends straight to people buying houses.'
examples:
- The Federal Home Loan Mortgage Corporation buys house loans from banks.
- Banks sell their loans to the Federal Home Loan Mortgage Corporation to free up money for new lending.
