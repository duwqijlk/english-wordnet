simpleMeaning: a set of stairs leading from one level to another.
scope: This is not a single stair, not the movements of the feet in walking, and not a stage in a process;
  it names a whole set of stairs connecting two levels.
examples:
- She ran up the steps to the door.
- The steps at the back of the building lead to the garden.
