simpleMeaning: thinking without a break, and in depth, about subjects that are hard to grasp, whether
  one subject or a whole set of them
scope: 'Also called meditation: long, deep thinking about hard subjects, not a guess about what might
  happen and not a risky investment.'
examples:
- The habit of speculation was the basis for all real knowledge.
- She spent the evening in quiet speculation about the stars.
