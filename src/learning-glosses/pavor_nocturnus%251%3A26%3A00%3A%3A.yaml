simpleMeaning: A sleep problem in which a person, in sleep without rapid eye movement, has a dream far
  more frightening than a usual bad dream.
scope: It is also called sleep terror disorder, and it is a sleep problem in which a person has a dream
  far more frightening than a usual bad dream, in sleep without rapid eye movement.
examples:
- Pavor nocturnus woke him with a dream far worse than a nightmare.
- Pavor nocturnus struck during sleep without rapid eye movement.
