simpleMeaning: The faith of one God followed by Muslims, begun in Arabia in the 7th century and built
  on the teachings of Muhammad as set down in the Koran
scope: The faith of one God followed by Muslims; Islam, Mohammedanism, Muhammadanism and Muslimism are
  other names for this sense, not the fundamentalist revivalist movement that seeks Islamic values in
  all of life.
examples:
- Islamism is another name for the faith founded in Arabia in the 7th century.
- Scholars once used Islamism where we now say Islam.
