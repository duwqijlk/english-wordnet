simpleMeaning: The person a hostile person or force picks out to strike at, mock, or use for gain.
scope: This is a person picked out to be attacked or used, also called a target or prey, not a pit dug
  for stone or the act of digging stone out.
examples:
- He became the quarry of the bullies at school.
- The new boy was the quarry of their jokes.
