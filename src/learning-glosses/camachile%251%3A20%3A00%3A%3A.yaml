simpleMeaning: A common prickly tree of tropical America with clusters of yellow flowers and curved, edible
  seed pods; it also gives useful wood, a yellow dye and a sticky gum.
scope: This is the thorny American tree with edible pods, not the true tamarind used in cooking.
examples:
- The camachile in the village square was covered in yellow flowers.
- We picked ripe camachile pods by the roadside and ate them raw.
