simpleMeaning: The smallest unit in the word stock of a language, such as a word or stem; 'go', 'went',
  'gone' and 'going' are all forms of the one English word 'go'
scope: The smallest unit in the word stock of a language, not a single word form and not a morpheme, the
  smallest part of a word that carries meaning.
examples:
- The words 'go' and 'went' belong to the same lexeme.
- A lexeme can take many forms in a sentence.
