simpleMeaning: A weed that grows in thick bunches and comes back year after year in the cool lands of
  the north.
scope: A weed that grows in thick bunches and comes back year after year in the cool lands of the north;
  also called field mouse-ear, not a weed that lives for one year only.
examples:
- Field chickweed spreads in thick bunches across the cool meadow.
- The field chickweed comes back year after year in the north garden.
