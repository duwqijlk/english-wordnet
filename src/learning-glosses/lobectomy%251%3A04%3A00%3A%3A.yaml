senseId: 'lobectomy%1:04:00::'
synsetId: 00684843-n
simpleMeaning: An operation that cuts out a rounded part (a lobe) of any organ of the body, such as the
  lung or brain
scope: An operation that cuts out a lobe of any organ of the body, not an operation that cuts out a whole
  organ and not one that cuts out only a small lump.
examples:
- She needed a lobectomy after the tumour was found in her lung.
- The lobectomy removed part of his brain.
