simpleMeaning: A way to mark heat that sets water's freezing point at 0 and its boiling point at 100.
scope: A way to mark heat that sets water's freezing point at 0 and its boiling point at 100, also called
  centigrade scale; not the scale that sets freezing at 32 and not a scale for length.
examples:
- The international scale sets water's boiling point at 100.
- On the international scale, ice melts at 0.
