scope: 'Also called leaded gasoline: car fuel with a lead mix added to cut down engine bangs, not plain
  fuel and not diesel.'
examples:
- In Britain they once sold leaded petrol at every garage.
- His car needed leaded petrol, not the new unleaded kind.
