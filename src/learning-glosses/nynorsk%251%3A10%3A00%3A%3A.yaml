simpleMeaning: One of the two official ways of speaking and writing in Norway, built on the speech of
  the countryside.
scope: Also called Landsmaal, Landsmal and New Norwegian; one of the two official languages of Norway,
  based on the rural dialects, while Bokmaal is the other official language.
examples:
- Nynorsk is used in schools and books all over Norway.
- She wrote her letter in Nynorsk, the language of the Norwegian countryside.
