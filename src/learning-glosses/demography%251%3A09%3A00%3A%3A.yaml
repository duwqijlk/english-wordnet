simpleMeaning: the part of the study of society that looks at the size and make-up of groups of people
scope: The study of human groups and their size and make-up, also called human ecology; not the study
  of how people act in groups and not the counting of people in one place.
examples:
- She studies demography to learn how city populations grow and change.
- His demography course covers birth rates and migration.
