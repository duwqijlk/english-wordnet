simpleMeaning: In astronomy, a body in the sky showing again after it was hidden in an eclipse
scope: 'Also called egress: in astronomy, a body in the sky showing again after it was hidden in an eclipse,
  not a body going behind something and not the eclipse itself.'
examples:
- The emersion of the moon was watched through a telescope.
- After the eclipse, the emersion of the planet came slowly into view.
