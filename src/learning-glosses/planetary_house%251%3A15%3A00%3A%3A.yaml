simpleMeaning: In astrology, the zodiac is split into 12 equal parts, and this is one of them
scope: 'Also called a house, a sign, or a mansion: one of the 12 equal parts into which astrology splits
  the zodiac, not a building where people live.'
examples:
- The astrologer said the planet had moved into a new planetary house.
- She checked which planetary house the moon was in that night.
