simpleMeaning: The meeting of the Western Church in 1245 that cast out Holy Roman Emperor Frederick II
  and planned a new crusade against the Holy Land.
scope: This is the meeting of the Western Church in 1245 that cast out Holy Roman Emperor Frederick II
  and planned a new crusade against the Holy Land; First Council of Lyons is another name for this meeting,
  and it is not the council of 1274 that joined the Greek Orthodox with the Roman Catholic Church.
examples:
- Lyons met in 1245 and cast out the Holy Roman Emperor.
- At Lyons, the Western Church planned a new crusade against the Holy Land.
