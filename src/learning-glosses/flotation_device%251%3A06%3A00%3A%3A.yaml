simpleMeaning: Life-saving gear made as a light belt or coat that keeps a person up in water so they do
  not sink.
scope: This is life-saving gear that keeps a person up in water, not a boat or a rope, and it is also
  called a preserver and a life preserver.
examples:
- He wore a flotation device in the boat.
- The flotation device kept her up in the water.
