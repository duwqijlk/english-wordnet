simpleMeaning: Fish that live in fresh water or near the shore and are eaten as food, with a long thin
  body shaped like a spindle, found all over the world
scope: These food fish are also called mullet and grey mullet, and are not the flesh sold as food and
  not a river fish only.
examples:
- Gray mullet swam in the shallow coastal water.
- Fishermen caught gray mullet near the harbour.
