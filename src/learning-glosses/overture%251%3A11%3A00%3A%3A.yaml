schema: oewn-learning-gloss-v2
senseId: 'overture%1:11:00::'
synsetId: 07341613-n
simpleMeaning: a thing or event that comes first and leads into what comes next
scope: 'Also called preliminary and prelude: a first thing or event that leads into what follows, not
  music played at the start of an opera and not a first try at an idea to test how others react.'
examples:
- Drinks were the overture to a long dinner.
- His short speech was an overture to the main talk.
