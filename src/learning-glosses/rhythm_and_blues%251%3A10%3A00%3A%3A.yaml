simpleMeaning: a mix of sad song music with jazz, first made in the United States by Black players; a
  key step on the way to rock 'n' roll
scope: Not jazz alone, not the sad song music alone; a mix of the two that led to rock 'n' roll.
examples:
- Rhythm and blues filled the hall that night.
- She grew up singing rhythm and blues.
