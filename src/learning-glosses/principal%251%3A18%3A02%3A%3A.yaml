simpleMeaning: The main person or company in a deal at a stock exchange (a place where shares are bought
  and sold). They buy and sell for their own account.
scope: 'Also called dealer: this is the main buyer or seller in a share deal, buying and selling for their
  own account, not a person in a crime and not an actor in a main part.'
examples:
- The principal bought the shares for its own account, not for a client.
- At the stock exchange, the principal sells only from its own holdings.
