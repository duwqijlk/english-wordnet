simpleMeaning: deserving to be called wrong because it is bad, evil or harmful
scope: 'Also called blamable, blameful, blameworthy, censurable and culpable: it describes a person or
  act that deserves to be called wrong, not a crime proven in court and not mere bad luck.'
examples:
- His blameable conduct cost him his job.
- The report called the blameable delay inexcusable.
