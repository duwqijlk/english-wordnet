simpleMeaning: Tiny parts that build a mineral sit in a neat set pattern, in rows that run in three directions.
scope: Also called a space lattice, this is the set pattern of a mineral's tiny parts, not the outside
  shape of the mineral.
examples:
- The crystal lattice holds the tiny parts in neat rows.
- In a crystal lattice, the parts repeat in the same set pattern.
