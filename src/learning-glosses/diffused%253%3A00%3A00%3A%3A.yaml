simpleMeaning: of light, coming from a wide light source or bounced off a surface
scope: Light that comes from a wide light source or bounces off a surface; soft and diffuse are other
  names for this sense. It is not the sense about light rays spread out by a rough surface or by passing
  through a material that lets some light through.
examples:
- The room was lit by diffused light from the large window.
- The lamp's diffused light bounced off the white wall and lit the whole room.
