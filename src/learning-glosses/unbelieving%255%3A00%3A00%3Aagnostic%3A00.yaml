simpleMeaning: holding the view that only things we can see or touch in the material world can be known,
  and nothing can be known about spiritual things or deepest causes
scope: 'This sense is about what can be known: it holds that only things in the material world can be
  known. It is not about doubting or denying the teachings of a religion, and not about rejecting belief
  in gods.'
examples:
- He took an unbelieving view, saying only what we can see and test can ever be known.
- Her unbelieving position was that no one can know anything about spirits or first causes.
