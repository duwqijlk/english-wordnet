simpleMeaning: A lasting worry disorder with no one cause, bringing tight muscles, sweating, shaking,
  dizziness, bad temper or other signs for more than six months
scope: anxiety reaction and generalized anxiety disorder are other names for this sense; not a short fear
  and not worry about one thing only.
examples:
- Her GAD made everyday choices feel hard.
- People with GAD often feel tense for months.
