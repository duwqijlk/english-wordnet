simpleMeaning: Sometimes put in the group Naja, this large snake of southeastern Asia and the East Indies
  is the largest snake with a deadly bite.
scope: Also called hamadryad, this large snake of southeastern Asia and the East Indies is the largest
  snake with a deadly bite and is sometimes put in the group Naja.
examples:
- The king cobra is the largest snake with a deadly bite in southeastern Asia.
- The king cobra is sometimes put in the group Naja.
