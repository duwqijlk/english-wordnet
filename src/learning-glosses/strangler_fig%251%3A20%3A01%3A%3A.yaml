simpleMeaning: a common plant from warm parts of the Americas with single white or pink flowers
scope: 'Also called pitch apple: a common plant from warm parts of the Americas with single flowers, not
  the strangler tree from Florida and the West Indies that starts life on another tree.'
examples:
- The strangler fig in the garden had single white flowers.
- We saw a strangler fig with pink flowers on the path.
