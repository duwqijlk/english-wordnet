simpleMeaning: paying kind attention to women and helping them, as a perfect knight of old times would
  do
scope: 'Also called gallant and knightly: kind and helpful to women like a knight of old times; not brave
  in battle alone and not just polite to everyone.'
examples:
- He was chivalrous and held the door open for her.
- The chivalrous man gave his seat to the old woman.
