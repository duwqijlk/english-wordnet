simpleMeaning: In southern Russia, North Africa, and north central North America grows this wheat, above
  all, with hard dark grains rich in gluten, used for bread and pasta.
scope: Also called durum, durum wheat, and hard wheat; a wheat with hard dark grains rich in gluten, used
  for bread and pasta.
examples:
- Macaroni wheat grows in the fields of North Africa.
- The baker used macaroni wheat flour for the pasta.
