simpleMeaning: Meant to wipe out enemy reserves and guns and to break up their command, supplies, and
  messages, these shots are aimed at targets far behind your own troops.
scope: These shots are aimed at targets far behind your own troops, not at the enemy right in front of
  your troops.
examples:
- Deep supporting fire hit targets far behind our own troops.
- The deep supporting fire broke up the enemy's command and supplies.
