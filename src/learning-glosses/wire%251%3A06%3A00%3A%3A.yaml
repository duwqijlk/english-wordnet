simpleMeaning: a long thin piece of metal used to hold things together or to make cages, fences, and other
  such things
scope: Metal used to hold things together or to make cages and fences, not metal that carries electricity
  over a distance and not sending a message by cable.
examples:
- She fixed the gate with a piece of strong wire.
- The cage is made of thin wire.
