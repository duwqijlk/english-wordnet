schema: oewn-learning-gloss-v2
senseId: 'judgment_by_default%1:04:00::'
synsetId: 01191027-n
simpleMeaning: In law, a court decision in favour of the person who sued, made when the other side fails
  to appear in court.
scope: This is a court decision in favour of the person who sued, made when the other side fails to appear
  in court; judgement by default, default judgement and default judgment are other names for it, not a
  ruling made before any trial because the facts are not in dispute.
examples:
- The court entered a judgment by default after the defendant failed to appear.
- He won a judgment by default when the other side never came to court.
