simpleMeaning: a statement of strong dislike that says someone or something is wrong and to blame in a
  moral way
scope: This is speaking out in strong dislike against something as wrong, also called disapprobation.
  It is not the law act of taking land for public use, and it is not a court finding a person guilty with
  a punishment.
examples:
- His condemnation of racism was clear and strong.
- The newspaper's condemnation of the cruel new law surprised many readers.
