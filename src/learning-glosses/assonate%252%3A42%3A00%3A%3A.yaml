senseId: 'assonate%2:42:00::'
synsetId: 02756517-v
simpleMeaning: to have the same vowel sounds as another word, with the vowels matching and the other sounds
  free to differ
scope: To match another word in its vowel sounds, not to rhyme in full and not to match the first sounds
  of words.
examples:
- The accented vowels assonated in this poem.
- In the song, 'lake' and 'rain' assonate.
