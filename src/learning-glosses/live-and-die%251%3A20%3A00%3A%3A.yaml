simpleMeaning: A spreading or half-upright shrub from tropical America and Australia, covered in backward-curving
  thorns and soft grey-green leaflets that close and hang down when handled, chilled or after dark.
scope: The low, flat-growing, thorn-armed tropical shrub, not the other semi-climbing sensitive plant
  with prickles and not the annual touch-me-not of wet ground.
examples:
- The live-and-die beside the path closed its leaflets the moment I brushed past.
- She keeps a live-and-die in the conservatory, where its thorny stems need plenty of room.
