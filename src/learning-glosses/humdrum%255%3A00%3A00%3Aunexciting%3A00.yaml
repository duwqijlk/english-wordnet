simpleMeaning: Dull and unexciting, with nothing in it to stretch the mind.
scope: Also called commonplace, unglamorous, or prosaic; dull and unexciting, not the noun sense of wearisome
  routine and not the sense of tediously repetitious.
examples:
- His humdrum routine never changed from week to week.
- The humdrum talk went on and on.
