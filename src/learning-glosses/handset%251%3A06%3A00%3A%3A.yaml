simpleMeaning: a phone part held in the hand, with the part you speak into and the part you listen through
  on one handle
scope: The handled part of a phone that you speak into and listen through, not the whole phone set and
  not its base.
examples:
- She picked up the handset and said hello.
- He put the handset back after the call ended.
