simpleMeaning: Usually after tonsillitis, pus gathers in the tonsils and the flesh round them, leaving
  them sore and swollen.
scope: 'It is also called quinsy: the pus-filled swelling that follows tonsillitis, rather than tonsillitis
  itself.'
examples:
- His peritonsillar abscess came on after tonsillitis.
- The peritonsillar abscess left his tonsils sore and swollen.
