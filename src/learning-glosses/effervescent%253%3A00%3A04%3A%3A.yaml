simpleMeaning: Filled with bubbles of carbon dioxide, put there by nature or by people; said of wines
  and waters.
scope: Also called sparkling; said of wine or water filled with bubbles of carbon dioxide, not the lively,
  high-spirited sense.
examples:
- The effervescent water fizzed as she poured it.
- They served effervescent wine with the meal.
