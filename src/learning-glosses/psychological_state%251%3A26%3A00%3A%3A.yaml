senseId: 'psychological_state%1:26:00::'
synsetId: 14396987-n
simpleMeaning: In psychology, a set of thoughts and feelings that keeps its main traits even while it
  keeps changing
scope: A set of thoughts and feelings that keeps its main traits even while it changes, also called mental
  condition, mental state, and psychological condition; not a passing mood, and not a state of the body.
examples:
- Her psychological state stayed much the same in its main traits, even though her feelings shifted through
  the day.
- The test showed a psychological state whose main traits held steady, though the state itself kept shifting.
