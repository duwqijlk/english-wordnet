simpleMeaning: the building up of sand, mud or small stones
scope: This is sand, mud or small stones building up; it is not a place for keeping things, not money
  in a bank, not the matter itself after it has built up, and not the natural process of laying matter
  down.
examples:
- Deposit happens in this valley when gravel carried by the river slowly piles up.
- Over many years, deposit of sand and mud filled the shallow end of the lake.
