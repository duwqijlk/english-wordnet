simpleMeaning: Able to talk, or connected with the act of talking.
scope: This is not the noun for a speech or a turn to talk; it describes something that can talk or is
  connected with talking.
examples:
- Parrots are among the few speaking birds.
- She joined a speaking club to practise talking in public.
