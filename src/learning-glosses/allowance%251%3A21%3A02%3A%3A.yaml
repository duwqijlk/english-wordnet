simpleMeaning: money given back to a person to pay for costs they have had
scope: Money paid back for costs, not a regular payment given to a child and not a fund a company keeps.
examples:
- The company paid her an allowance for her travel costs.
- He got an allowance to cover the cost of his meals on the trip.
