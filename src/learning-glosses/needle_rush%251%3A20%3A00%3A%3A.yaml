simpleMeaning: A thin-leaved water plant often used to put air into the water of fish tanks.
scope: A thin-leaved water plant used to put air into fish tanks, also called hair grass, needle spike
  rush and slender spike rush; not a pond weed and not a water lily.
examples:
- The needle rush in the aquarium keeps the water full of air.
- She planted needle rush along the edge of the pond.
