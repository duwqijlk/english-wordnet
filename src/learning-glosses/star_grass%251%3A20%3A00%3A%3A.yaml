simpleMeaning: In Africa, Australia, southern Asia, and North America grow plants of the Hypoxis group
  with long narrow leaves and yellow flowers that spread out in points.
scope: A plant of the Hypoxis group with yellow flowers, not the star grass with bitter roots said to
  cure colic, and not a grass grown for lawns.
examples:
- The star grass had long narrow leaves and yellow flowers.
- Star grass grows in Africa, Australia, southern Asia, and North America.
