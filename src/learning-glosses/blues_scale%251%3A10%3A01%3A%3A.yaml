senseId: 'blues_scale%1:10:01::'
synsetId: 92441674-n
simpleMeaning: A set of notes in music whose steps shift between the major key and the minor key, heard
  above all in jazz
scope: A set of notes used above all in jazz, shifting between major and minor; not a fixed set of notes
  in one key and not a scale used only in classical music.
examples:
- She played a blues scale on the piano to warm up.
- The blues scale gives his solo its sad, sliding sound.
