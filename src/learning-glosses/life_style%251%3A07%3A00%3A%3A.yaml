simpleMeaning: The way a person lives, which shows what they value and how they think.
scope: 'Also called life-style, lifestyle and modus vivendi: the way a person lives, showing what they
  hold dear and how they think, not a way of earning money or a passing fad.'
examples:
- Her life style shows how much she cares about the earth.
- His life style changed after he moved to the country.
