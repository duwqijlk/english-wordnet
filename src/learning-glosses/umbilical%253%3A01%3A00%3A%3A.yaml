simpleMeaning: connected with, or like, the small mark in the middle of the belly where the cord joined
  a baby to its mother before birth
scope: This describes a thing that is connected with or like the small mark in the middle of the belly;
  it is not the mark itself, and not the cord itself that joined a baby to its mother before birth.
examples:
- The doctor cut the umbilical cord soon after the baby was born.
- She has a small umbilical mark in the middle of her belly.
