simpleMeaning: In Europe and North America, a plant that lives for years grows in wet grassland and ditches,
  with wide leaves.
scope: Also called lady's laces, reed canary grass and ribbon grass, it is a plant of wet grassland and
  ditches in Europe and North America.
examples:
- The gardener's garters grew beside the ditch.
- We saw gardener's garters with wide leaves in the wet meadow.
