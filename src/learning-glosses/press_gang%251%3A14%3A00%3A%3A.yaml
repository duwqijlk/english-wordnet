simpleMeaning: A small group allowed to make ordinary people join the army or navy
scope: A small group that forces ordinary people to join the army or navy; not a group of reporters and
  not people who join of their own free will.
examples:
- In the old days, the press gang took men from the streets to serve on ships.
- He feared the press gang would seize him and force him into the navy.
