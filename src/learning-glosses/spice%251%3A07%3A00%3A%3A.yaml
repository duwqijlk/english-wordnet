simpleMeaning: the quality of food that tastes strong because strong-tasting plant parts have been added
  to it
scope: This is the strong taste itself, not the plant parts added to food to give it taste and not the
  act of adding them.
examples:
- There was a pleasant spice to the soup.
- The spice of the curry was strong but not too hot.
