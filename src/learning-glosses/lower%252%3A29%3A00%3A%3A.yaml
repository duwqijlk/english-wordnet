senseId: 'lower%2:29:00::'
synsetId: 00032974-v
simpleMeaning: to frown and look angry or unhappy, as if you strongly disapprove.
scope: This is only about a face showing anger or dislike; it is not about moving something down or making
  a sound quieter.
examples:
- Don't lower at me like that - I only asked a question.
- She lowers at her brother whenever he borrows her things without asking.
