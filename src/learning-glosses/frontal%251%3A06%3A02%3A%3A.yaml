simpleMeaning: the front part of a building
scope: The front of a building, also called frontage; not something worn on the forehead, and not the
  cloth that covers the front of an altar.
examples:
- The frontal of the old church was made of white stone.
- Workers cleaned the dirty frontal of the town hall.
