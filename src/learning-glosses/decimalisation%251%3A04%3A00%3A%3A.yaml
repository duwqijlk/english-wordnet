simpleMeaning: the act of changing a system of counting or measuring to one based on tens
scope: The act of moving to a system based on tens, also called decimalization; not a change of coins
  only, and not a change of language.
examples:
- The decimalisation of British currency took place in 1971.
- Decimalisation made the old coins useless overnight.
