simpleMeaning: A bog plant with wide heart-shaped basal leaves and cream-colored or white saucer-shaped
  flowers with frilled petals; it grows west of the Rocky Mountains from Alaska to New Mexico.
scope: A bog plant with heart-shaped leaves, also called Parnassia fimbriata; not a true grass.
examples:
- Fringed grass of Parnassus grew beside the bog pool.
- We saw fringed grass of Parnassus in flower on the mountain.
