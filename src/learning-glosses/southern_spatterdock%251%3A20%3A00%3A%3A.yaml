simpleMeaning: A water plant of the flowing waters of the southeast United States that may form thick
  mats that block streams
scope: A water plant of flowing waters in the southeast United States that may form thick mats, not a
  dry-land plant and not a plant that stays in still ponds.
examples:
- Southern spatterdock spreads across the stream, forming thick mats.
- The southern spatterdock may block the flow where the water runs fast.
