simpleMeaning: a wild plant from Europe and Asia that often grows as a weed in fields of grain
scope: A weedy plant that harms grain crops; charlock and field mustard are other names for this sense,
  not a garden plant and not a crop plant itself.
examples:
- Chadlock grows thick among the wheat in the lower field.
- The farmer pulled the chadlock out before it could spread.
