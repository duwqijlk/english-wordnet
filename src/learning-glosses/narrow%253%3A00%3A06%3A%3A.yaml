simpleMeaning: Having rigid opinions and unwilling to consider views different from one's own.
scope: This is about an intolerant attitude, also called 'narrow-minded', not the physical sense of little
  width nor a limited range or amount.
examples:
- His narrow outlook made him reject every idea that was new.
- She was too narrow to accept that her rival might be right.
