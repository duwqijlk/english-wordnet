simpleMeaning: A heavy metal that gives off rays on its own, heavier than uranium; made by firing helium
  nuclei at plutonium.
scope: 'Also called Cm and curium: a heavy metal that gives off rays on its own, made by firing helium
  nuclei at plutonium; the metal before it in the set is atomic number 95.'
examples:
- Atomic number 96 was made by firing helium nuclei at plutonium.
- The metal of atomic number 96 gives off rays on its own.
