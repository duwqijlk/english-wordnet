simpleMeaning: A fragrant, rounded shrub of the southwestern US and Mexico, with easily broken stems,
  dense blue-green leaves and yellow flowers; its resin goes into incense, varnish and folk medicine.
scope: The resinous desert shrub of the US Southwest and Mexico; brittle bush and incienso are other names
  for the same plant, not separate species or unrelated incense plants.
examples:
- Brittlebush covered the hillside in a low mound of blue-green leaves.
- Bees swarmed the yellow brittlebush flowers in early spring.
