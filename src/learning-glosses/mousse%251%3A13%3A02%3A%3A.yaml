simpleMeaning: a rich sweet food eaten at the end of a meal, light and full of air, made by mixing beaten
  egg whites with thick cream
scope: This is the sweet food eaten at the end of a meal, not the foam put in hair to shape it and not
  the light dish made from fish or meat.
examples:
- We had chocolate mousse after dinner.
- She made a light lemon mousse with beaten egg whites and cream.
