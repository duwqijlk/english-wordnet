senseId: 'precipitant%1:27:00::'
synsetId: 15021960-n
simpleMeaning: A thing added to a liquid that makes a solid fall out of it
scope: This is a thing added to a liquid that makes a solid fall out of it, not a thing that speeds up
  a change without being used up, and not a liquid that simply dissolves a solid.
examples:
- The chemist added the precipitant to the clear liquid.
- Too much precipitant made the solid fall out at once.
