simpleMeaning: When small folds in the throat shake, the sound they make is shaped by the hollow of the
  throat.
scope: Also called voice, phonation, vocalisation, vocalization, and vox, it is the sound that small folds
  shaking in the throat make.
examples:
- The vocalism of the singer filled the hall.
- The giraffe cannot make any vocalism.
