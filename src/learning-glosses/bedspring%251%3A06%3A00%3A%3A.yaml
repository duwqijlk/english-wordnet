simpleMeaning: usually used in the plural, one of the springs in a bed that a mattress rests on
scope: One of the springs under a mattress in a bed, usually in the plural; not the whole bed and not
  the mattress itself.
examples:
- The old bedsprings made a noise every time he turned over in bed.
- We took out the broken bedsprings and put in new ones.
