simpleMeaning: a person whose job is to make cloth, flour, or other such things white or lighter in colour
scope: A worker who whitens cloth or flour, not the rows of seats at a sports ground.
examples:
- The bleacher worked long hours at the cloth mill.
- A bleacher checks the flour until it is white enough.
