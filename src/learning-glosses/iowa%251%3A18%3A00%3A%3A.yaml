simpleMeaning: A person of the Siouan people who used to live in the state of that name and in Minnesota
  and Missouri.
scope: A person of the Siouan people who used to live in the state of that name and in Minnesota and Missouri,
  also called Ioway; not the tongue spoken by these people.
examples:
- An Iowa elder told stories of Minnesota and Missouri.
- The Iowa lived in the state of that name long ago.
