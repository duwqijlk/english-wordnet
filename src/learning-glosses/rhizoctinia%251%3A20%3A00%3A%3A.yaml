simpleMeaning: any fungus of one named group, whether it still sits in that group or used to sit there
scope: A fungus of one named group, now or in the past, not a rot-causing fungus and not a common mould.
examples:
- The lab found rhizoctinia in the soil sample.
- Rhizoctinia was once placed in a different group of fungi.
