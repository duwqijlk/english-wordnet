simpleMeaning: In dentistry, a hard shell shaped like a tooth-top, fitted over a tooth that is broken
  or rotten
scope: Also called jacket, crown, cap, or crownwork, it is what a dentist fits over a tooth that is broken
  or rotten.
examples:
- Tomorrow my dentist will fit me for a jacket crown.
- The jacket crown covered the tooth she had broken.
