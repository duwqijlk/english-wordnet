simpleMeaning: a salt made from two parts, used in Seidlitz powder, that helps clear the bowels
scope: A salt made from two parts and used in Seidlitz powder to help clear the bowels, not potassium
  bromide, potassium carbonate, or potassium cyanide.
examples:
- The chemist added potassium sodium tartrate to the Seidlitz powder.
- Doctors once gave potassium sodium tartrate to help clear a patient's bowels.
