simpleMeaning: a set of pipes that can be pulled in or pushed out, letting air in and out, so a submarine
  can stay under water for a long time
scope: Also called snorkel, schnorchel, schnorkel or snorkel breather; this is the air pipe set of a submarine,
  not a short rest or break.
examples:
- The submarine rose near the surface and raised its breather to take in fresh air.
- With the breather up, the submarine could stay under water for many hours.
