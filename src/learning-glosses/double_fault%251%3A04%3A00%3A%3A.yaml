simpleMeaning: In tennis, two bad serves in a row, so the server loses the point.
scope: In tennis, two bad serves in a row that lose the point, not one bad serve and not a bad return
  of the ball.
examples:
- Her double fault gave the game to her opponent.
- He lost the point with a double fault at the end of the set.
