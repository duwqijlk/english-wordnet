simpleMeaning: a light carriage with four wheels, pulled by horses, used for ceremonies
scope: This is the light four-wheel carriage used for ceremonies, not the two-wheel vehicle used in war
  and races long ago, and not the act of riding in one.
examples:
- The king rode through the city in a gold chariot during the ceremony.
- Four white horses pulled the chariot slowly past the cheering crowd.
