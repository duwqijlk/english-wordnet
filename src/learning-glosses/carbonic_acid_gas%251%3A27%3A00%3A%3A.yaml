simpleMeaning: Plants take this heavy, colourless, smell-free substance from the air to make food from
  sunlight; living things breathe it out, and dead matter gives it off as it rots.
scope: 'Also called carbon dioxide: a heavy gas plants take in from the air to grow, not the gas animals
  breathe in to live.'
examples:
- Green plants take in carbonic acid gas from the air to make food from sunlight.
- Carbonic acid gas is made when living things breathe and when dead matter rots.
