simpleMeaning: a cup fungus of early spring; its fruiting body is thin and tough, shaped like a saucer,
  quarter to half-dollar size, deep bright red on top and whitish outside
scope: A cup fungus that comes early in spring, with a thin tough saucer-shaped fruiting body, deep bright
  red on top; not a red flower and not a drinking cup.
examples:
- Scarlet cup dots the woods in early spring.
- We found a scarlet cup with a bright red top on the forest floor.
