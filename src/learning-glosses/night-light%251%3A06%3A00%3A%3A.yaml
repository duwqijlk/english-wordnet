simpleMeaning: A candle or small bulb that stays lit in a bedroom while people sleep, for children or
  people who are sick.
scope: A candle or small bulb that stays lit in a bedroom while people sleep, for children or people who
  are sick, not a lamp used in the evening and not a torch.
examples:
- A small night-light burned in the children's bedroom.
- She left a night-light on for the sick boy.
