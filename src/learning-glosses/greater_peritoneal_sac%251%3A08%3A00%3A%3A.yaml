simpleMeaning: a space that can open up inside the peritoneum, the thin skin that lines the belly, between
  its two layers
scope: The space inside the thin skin that lines the belly, between its two layers, also called the peritoneal
  cavity, not the belly itself and not the skin that covers the body.
examples:
- Fluid can collect in the greater peritoneal sac.
- The greater peritoneal sac lies between the layers of the thin skin that lines the belly.
