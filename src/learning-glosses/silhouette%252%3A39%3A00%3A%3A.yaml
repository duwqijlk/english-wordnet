simpleMeaning: to throw a thing's shape onto a background, or a screen, like a dark edge shape
scope: To throw a thing's shape onto a background, or a screen, like a dark edge shape, not a picture
  filled in with one colour, not the dark shape itself, and not showing a thing as a dark edge shape.
examples:
- The lamp silhouetted the vase on the wall.
- Shadows silhouetted the dancers on the screen.
