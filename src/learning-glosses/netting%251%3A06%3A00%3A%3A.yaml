simpleMeaning: a see-through cloth with threads woven loosely, leaving many small open spaces
scope: This cloth, also called gauze or veiling, is see-through and woven loosely; not a strong net used
  for catching fish or for sport.
examples:
- Fine netting hung over the bed to keep insects out at night.
- The dress had a layer of soft netting over the skirt.
