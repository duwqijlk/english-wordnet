simpleMeaning: A one-year plant of the Old World, now settled widely in warm lands, with white flowers
  and thick leaves covered in hairs that look like ice.
scope: This is a one-year plant of the Old World, now settled widely in warm lands, with white flowers
  and thick leaves covered in hairs that look like ice; ice plant and icicle plant are other names for
  this sense, not a plant with smooth leaves and not a plant of cold lands.
examples:
- The Mesembryanthemum crystallinum leaves glittered like ice in the sun.
- We grew Mesembryanthemum crystallinum in the warm corner of the garden.
