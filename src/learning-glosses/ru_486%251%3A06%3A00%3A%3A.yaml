simpleMeaning: A medicine developed in France that ends a pregnancy in its first five weeks by stopping
  the work of progesterone, so the womb sheds the embryo
scope: This medicine ends a pregnancy in its first five weeks by stopping the work of progesterone; abortion
  pill and mifepristone are other names for it.
examples:
- Her doctor gave her RU 486 in the first five weeks of her pregnancy.
- RU 486 blocks progesterone, so the womb sheds the embryo.
