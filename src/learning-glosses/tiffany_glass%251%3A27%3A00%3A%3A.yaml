simpleMeaning: A milky material that shines with soft colours, used in the early 1900s for windows made
  with coloured panes and for lamps
scope: A kind of coloured glass of the early 1900s, used for stained-glass windows and lamps, whose milky
  surface softens the light into soft colours instead of giving a clear view.
examples:
- The old church had Tiffany glass in its tall windows.
- She bought a small Tiffany glass lamp for her desk.
