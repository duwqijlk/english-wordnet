simpleMeaning: The dot just before the digits showing the part of a decimal number smaller than one.
scope: This is not the mark that ends a sentence; it separates the whole-number part from the fractional
  part of a decimal number.
examples:
- Move the decimal point one place to the left.
- The decimal point in 0.5 comes before the 5.
