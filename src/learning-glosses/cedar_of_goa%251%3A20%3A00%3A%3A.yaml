simpleMeaning: A tall spreading evergreen found in Mexico, with drooping branches, believed to have been
  brought into Portugal from Asia.
scope: Also called Cupressus lusitanica, Mexican cypress and Portuguese cypress, this tall wide-spreading
  evergreen tree of Mexico has branches that hang down and was believed to have reached Portugal from
  Asia; other cypresses, cedars and pines are near trees with their own names.
examples:
- The cedar of Goa grows in Mexico and has drooping branches.
- Cedar of Goa was believed to have been brought into Portugal from Asia.
