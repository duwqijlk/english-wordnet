simpleMeaning: A herb of tropical America that stings when touched.
scope: This is a herb of tropical America that stings when touched; devil nettle, pica-pica, spurge nettle,
  tread-softly, Jatropha stimulosus and Jatropha urens are other names for it, not a harmless herb and
  not a herb of cool lands.
examples:
- Cnidoscolus urens stings if you brush against it.
- We kept clear of Cnidoscolus urens on the path.
