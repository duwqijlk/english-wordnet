simpleMeaning: Strong streams of rising air bring a storm of heavy rain or hail, thunder, and lightning.
scope: A thunderstorm and an electrical storm are other names for this storm of heavy rain or hail, thunder,
  and lightning, which comes when air rises in strong streams.
examples:
- The electric storm brought hail that rattled on the roof.
- We stayed indoors while the electric storm passed over the town.
