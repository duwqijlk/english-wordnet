simpleMeaning: a place where someone can stay out of sight, usually far from other people and used by
  people who break the law
scope: 'Also called a den or a hideout: a place to stay out of sight, usually far away and used by people
  who break the law, not just any place to play.'
examples:
- The men ran to their hideaway in the hills when the police came near.
- She kept a small hideaway deep in the woods where no one could find her.
