simpleMeaning: One of the mourners at a funeral who carry the coffin.
scope: One of the mourners who carry the coffin at a funeral, not a messenger, not a person holding a
  cheque or bond, and not a person whose job is carrying things.
examples:
- Six bearers carried the coffin into the church.
- He served as a bearer at his grandfather's funeral.
