simpleMeaning: a thing or piece of equipment that joins two things together
scope: 'Also called connection, and another name for it is connector: a thing that joins two things together,
  not a joining word in a sentence and not the describing sense that means joining.'
examples:
- He used a small connective to join the amplifier to the speakers.
- The connective between the two pipes was made of metal.
