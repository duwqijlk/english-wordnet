simpleMeaning: to make an animal unable to walk by cutting the joint at the back of its hind leg
scope: To cripple an animal by cutting the joint at the back of its hind leg, not the joint itself and
  not a white wine.
examples:
- In the old tale, the cruel lord had the horses hocked.
- A lame horse may have been hocked in a fight long ago.
