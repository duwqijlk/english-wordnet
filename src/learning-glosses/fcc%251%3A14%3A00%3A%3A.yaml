simpleMeaning: The state body that sets the rules, on its own, for messages by radio, television, wire,
  cable and satellite that go between states or between lands.
scope: Also called the Federal Communications Commission, this is the state body that sets the rules for
  messages by radio, television, wire, cable and satellite that go between states or between lands, not
  a company that sends the messages itself.
examples:
- The FCC sets the rules for radio and television.
- The FCC also covers messages sent by satellite.
