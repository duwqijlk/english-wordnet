simpleMeaning: a tool that holds things tightly together, usually used by a person who makes things from
  wood
scope: A tool that holds things tightly together, not the act of fixing things with such a tool and not
  the act of putting a rule or limit on people by force.
examples:
- He used a clamp to hold the two pieces of wood together.
- The clamp kept the board still while he cut it.
