simpleMeaning: A person who keeps getting in the way of something others want to do, on purpose and time
  after time.
scope: A person who keeps getting in the way of what others want to do; obstructer and obstructionist
  are other names for this; not a person who blocks the way by accident, and not a thing that stands in
  the road.
examples:
- The obstructor delayed every plan the council put forward.
- He was known as an obstructor of the new road.
