simpleMeaning: to do with the study of forces (pushes and pulls) and how they make things move
scope: This word is about forces and movement in science, not about a person full of energy and action,
  and not about verbs that show action.
examples:
- The book is about dynamic forces that move heavy objects.
- Students learn how dynamic pressure changes when air moves fast.
