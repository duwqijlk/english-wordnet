senseId: 'adult-onset_diabetes%1:26:00::'
synsetId: 14142418-n
simpleMeaning: 'Older name for type 2 diabetes: a mild form developing slowly in adults, possibly after
  weight gain, stress or menopause, and manageable with diet and tablets instead of insulin.'
scope: The common adult kind of blood-sugar disease, now called type 2, not the childhood type that needs
  insulin from the start or the rare water-balance disorder.
examples:
- My grandfather was diagnosed with adult-onset diabetes at sixty.
- Her doctor said the adult-onset diabetes could be controlled with diet.
