simpleMeaning: a ring of striped muscle that tightens the tube through which urine leaves the body
scope: 'Also called musculus sphincter urethrae: a ring of muscle that tightens the tube that carries
  urine out of the body, not a muscle that moves the arm or leg and not the ring of muscle at the end
  of the gut.'
examples:
- After the operation, his urethral sphincter could not close well, so urine leaked.
- The doctor tested whether the urethral sphincter could still tighten the tube.
