simpleMeaning: used in the plural; a word used in informal talk for breeches (short trousers)
scope: An informal word, used in the plural, for short trousers; it is not a formal word and it does not
  mean a dress or a skirt.
examples:
- He wore a pair of old britches to work in the fields.
- Put your britches on and come outside.
