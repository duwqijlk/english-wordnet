senseId: 'cranial_index%1:24:00::'
synsetId: 13843038-n
simpleMeaning: A number, given as a percent, got by dividing the widest part of a skull by its longest
  part
scope: This is a number, given as a percent, got by dividing the widest part of a skull by its longest
  part; breadth index and cephalic index are other names for it; not the length of a skull on its own,
  and not the weight of a skull.
examples:
- The cranial index of the skull was 78 percent.
- Anthropologists use the cranial index to compare skull shapes.
