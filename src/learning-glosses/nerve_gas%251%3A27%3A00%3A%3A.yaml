simpleMeaning: A poisonous air-like substance that is breathed in or taken in through the skin and harms
  the nervous system and the breathing parts of the body.
scope: A poisonous air-like substance breathed in or taken in through the skin that harms the nervous
  system, also called nerve agent; not a tear gas and not a poison taken by mouth.
examples:
- The soldiers feared a nerve gas attack on the camp.
- A nerve gas can harm people who breathe it in.
