simpleMeaning: To take part in a rising against those in power, and give up the side you once stood by
scope: 'Also called rise and rebel: joining a rising and leaving the side you once stood by, not simply
  getting up.'
examples:
- The people arise against the king and take the town.
- They arise to throw off the old rule.
