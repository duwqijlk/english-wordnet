simpleMeaning: A Chadic tongue spoken in the north of Nigeria, most of all in Plateau State, in the Bokkos,
  Barakin-Ladi and Mangu areas
scope: This is a Chadic tongue of northern Nigeria, most of all in Plateau State; Ron, Bokkos, Bokkos
  language, Daffo and Ron language are other names for this sense, and it stands apart from other Chadic
  tongues by its home in Bokkos, Barakin-Ladi and Mangu.
examples:
- Daffo language is spoken in northern Nigeria.
- Many people in Bokkos speak the Daffo language.
