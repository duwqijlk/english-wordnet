senseId: 'conjuration%1:10:00::'
synsetId: 07174767-n
simpleMeaning: A rite of spoken words, thought to call up magic.
scope: This sense is also called an incantation, for a rite of spoken words, thought to call up magic,
  where an incantation is words or sounds spoken aloud in a set rite, believed to work magic, unlike the
  sense for a trick of the eye, held to be magic by simple onlookers.
examples:
- The conjuration called up magic with spoken words.
- Conjurations are rites of words and sounds.
