simpleMeaning: one of a group of germs not spread by bugs, that includes the germ that makes babies sick
  in the gut
scope: A germ of a group not spread by bugs, not a germ spread by a bug bite and not the flu.
examples:
- A reovirus can make a young child sick in the gut.
- The lab found a reovirus in samples from sick babies.
