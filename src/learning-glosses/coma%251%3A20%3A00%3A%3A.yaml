simpleMeaning: In botany, a bunch of small leaf-like parts or fine hairs, most often at the tip of a plant,
  as on a pineapple or, most of all, on certain seeds
scope: In botany, a tuft on a plant, not the cloud around a comet and not the deep sleep of a person who
  cannot wake.
examples:
- The pineapple wears a coma of stiff green leaves at its top.
- Certain seeds carry a coma of fine hairs that helps them drift on the wind.
