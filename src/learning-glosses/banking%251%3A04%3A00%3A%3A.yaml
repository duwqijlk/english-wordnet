simpleMeaning: doing business with a bank, such as putting money in, taking money out, or asking for a
  loan
scope: Doing business with a bank, not the business of running a bank that keeps money and lends it, and
  not the sloping side of a road or river.
examples:
- She does all her banking on her phone these days.
- They went into town to do their banking on Friday morning.
