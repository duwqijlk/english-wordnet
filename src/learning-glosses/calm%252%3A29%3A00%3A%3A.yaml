simpleMeaning: to make someone quiet and peaceful, as by giving a sedative
scope: To settle a person down by giving a sedative, not the intransitive sense of becoming quiet on one's
  own, nor the adjective describing a peaceful condition or manner.
examples:
- The nurse calmed the frightened patient with a mild sedative.
- A small dose calmed him enough for the procedure to begin.
