simpleMeaning: the fact that the distance between two things is fairly small
scope: 'Also called closeness: this is how small the distance between things is, not how close people
  feel to each other as friends.'
examples:
- The nearness of the dock made him act at once.
- She liked the nearness of the shops to her home.
