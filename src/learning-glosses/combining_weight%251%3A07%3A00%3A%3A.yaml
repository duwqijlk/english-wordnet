simpleMeaning: In chemistry, the heaviness of one stuff that joins with a set amount of another stuff
  in the same way, with 8 as the set amount for oxygen
scope: In chemistry, the heaviness of one stuff that joins with a set amount of another stuff in the same
  way; equivalent, eq and equivalent weight are other names for this sense, not the heaviness of one stuff
  alone and not a count of its parts.
examples:
- The combining weight of the stuff was worked out from oxygen.
- Chemists set the combining weight against 8 for oxygen.
