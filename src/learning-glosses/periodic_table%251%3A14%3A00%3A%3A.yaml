simpleMeaning: In chemistry, a chart that sets out the chemical elements in order of their atomic number,
  following the law of repeating patterns
scope: In chemistry, a chart setting out the chemical elements by atomic number, not a list of compounds
  and not a chart of atoms alone.
examples:
- Hydrogen sits at the top of the periodic table.
- She looked up iron on the periodic table.
