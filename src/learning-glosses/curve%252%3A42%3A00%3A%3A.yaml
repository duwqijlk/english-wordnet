simpleMeaning: to go onward with smooth bends and turns
scope: To go onward in bends and turns, as a road or river does. Not to form a tight ring or sharp twist,
  and not to form an arch.
examples:
- The road curves through the hills for miles.
- The river curves on past the town and into the woods.
