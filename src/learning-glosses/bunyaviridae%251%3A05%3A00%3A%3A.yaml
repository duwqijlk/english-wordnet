simpleMeaning: A large group of germs carried by small biting creatures that can sicken a wide range of
  living things, mainly animals with backbones and small creatures with jointed legs.
scope: This is a large group of germs spread by biting creatures that sicken many kinds of living things;
  it is set apart from germs spread in other ways and from small groups that sicken only one kind of host.
examples:
- Bunyaviridae includes germs that spread through mosquito bites.
- Doctors study Bunyaviridae to track illnesses spread by insects.
