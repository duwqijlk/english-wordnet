simpleMeaning: Of the mind and body movement, where thoughts lead to movement or movement leads to thoughts
scope: Of the mind and body movement, where thoughts lead to movement or the other way round; not a thought
  alone, and not a move of the body alone.
examples:
- The test measured psychomotor speed by timing how fast she moved after a signal.
- Her psychomotor skills grew as she learned to link what she saw with how she moved.
