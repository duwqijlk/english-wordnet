simpleMeaning: A tool used in land measuring, with a small telescope on a three-legged stand, for finding
  angles up and down and from side to side.
scope: A land-measuring tool with a telescope on a stand, not a way of moving people or goods.
examples:
- The surveyor set up the transit on the hilltop.
- He looked through the transit to measure the angle.
