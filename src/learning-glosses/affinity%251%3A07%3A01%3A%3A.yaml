schema: oewn-learning-gloss-v2
senseId: 'affinity%1:07:01::'
synsetId: 04755038-n
simpleMeaning: a likeness between people or things that is part of their nature
scope: A natural likeness between people or things, not a family link made by marriage or adoption, and
  not a force that pulls atoms together.
examples:
- 'People noticed an affinity between the two sisters: they look and speak alike.'
- There is an affinity between the two designs, as both use the same shapes and colours.
