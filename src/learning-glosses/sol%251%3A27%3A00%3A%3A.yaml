simpleMeaning: a mix in which small bits of solid stay spread out in a liquid, and the liquid is one whole
  that goes on all through the mix
scope: A science word for this mix of solid bits in a liquid; it is not a plain liquid with nothing in
  it and not a solid on its own.
examples:
- The clear sol flowed like water, though it held tiny bits of solid.
- The chemist made a sol by mixing the fine powder into the liquid.
