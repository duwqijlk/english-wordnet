simpleMeaning: A tangled web of nerve cells deep in the middle of the brain stem that keeps watch over
  the body and helps with waking, sleep, focus and muscle tone.
scope: Also called the reticular formation; a web of nerve cells in the middle of the brain stem that
  keeps watch over the body, not a single nerve and not a part of the outer brain.
examples:
- The RF keeps the brain alert during the day.
- Damage to the RF can disturb sleep and muscle tone.
