simpleMeaning: one of several ranks for soldiers who are not officers, in the Army, Air Force, or Marines,
  above a corporal
scope: A rank for soldiers who are not officers, in the Army, Air Force, or Marines, above a corporal;
  not a police officer of that rank and not the English lawyer of the highest rank.
examples:
- The sergeant gave orders to his men.
- She was made a sergeant in the Marines.
