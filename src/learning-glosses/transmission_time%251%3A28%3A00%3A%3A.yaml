simpleMeaning: the moment, by the clock the whole world uses, when a message is sent from Earth to a craft
  in space or some other body in the sky
scope: This is the moment, by the clock the whole world uses, when a message is sent from Earth to a craft
  in space; not the gears in a car and not a wire that carries power.
examples:
- The team noted the transmission time of the signal to the probe.
- They logged the transmission time when the message left Earth.
