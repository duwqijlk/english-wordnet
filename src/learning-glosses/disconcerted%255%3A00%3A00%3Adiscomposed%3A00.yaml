simpleMeaning: feeling that you cannot stay calm and your thoughts are mixed up and unclear
scope: 'Also called discombobulated: this means a person feels not calm and cannot think clearly, not
  that a plan or a thing is in a mixed-up state.'
examples:
- The loud questions left the speaker disconcerted, and he lost his place.
- She looked disconcerted when everyone turned to stare at her.
