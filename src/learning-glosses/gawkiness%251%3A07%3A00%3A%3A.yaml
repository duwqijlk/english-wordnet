simpleMeaning: The way a person holds the body and moves, when the movements and the pose are very clumsy
  and not graceful.
scope: This is the way a person holds the body and moves, when the movements and the pose are very clumsy
  and not graceful, not being shy around people and not a single clumsy slip.
examples:
- His gawkiness showed in every step he took.
- Teenagers often feel their gawkiness when they dance.
