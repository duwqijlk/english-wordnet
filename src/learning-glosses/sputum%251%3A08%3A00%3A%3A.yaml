simpleMeaning: matter coughed up from the chest, made of spit mixed with what comes from the air passages;
  in old ideas about the body it was thought to make people slow
scope: 'Also called phlegm: matter coughed up from the chest, not just spit in the mouth and not mucus
  from the nose.'
examples:
- The doctor asked him to cough up some sputum into a cup for a test.
- Her sputum was thick and yellow when she had a chest infection.
