simpleMeaning: A way of finding out who a person is by looking at the DNA in bits of their body tissue
  or body fluid.
scope: This is the test that names a person from their DNA, also called genetic profiling.
examples:
- Genetic fingerprinting named the man from a drop of his blood.
- A bit of hair was enough for genetic fingerprinting to name its owner.
