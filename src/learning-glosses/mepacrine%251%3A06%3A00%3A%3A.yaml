simpleMeaning: Sold as Atabrine, this drug treats some worm infections and was once used to treat malaria
scope: Also called quinacrine or quinacrine hydrochloride, this is a drug that treats some worm infections
  and was once used for malaria, not a general worm medicine.
examples:
- The doctor gave mepacrine for the worm infection.
- Mepacrine was once used to treat malaria, but newer drugs took its place.
