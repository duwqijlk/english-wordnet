simpleMeaning: A dive where the diver throws the feet forth to finish a full back somersault, and hits
  the water feet first, facing away from the board.
scope: A dive where the diver throws the feet forth to finish a full back somersault, and hits the water
  feet first, facing away from the board; also called full gainer; not a person who gains, in profit or
  in edge.
examples:
