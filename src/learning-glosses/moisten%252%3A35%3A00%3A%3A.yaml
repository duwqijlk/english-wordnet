simpleMeaning: to make something a little wet by putting small drops of liquid on it
scope: This sense is about making something wet with small drops of liquid, not just making something
  wet in any other way.
examples:
- The cook moistened the meat with small drops of melted butter.
- She moistened the cloth with a fine spray of water.
