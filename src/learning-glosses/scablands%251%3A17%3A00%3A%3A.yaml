simpleMeaning: In geology, dry channels left by ice cut through high flat land with poor soil and few
  plants, above all in eastern Washington.
scope: In geology, high flat land with poor soil, cut by dry ice-made channels, not low rich farm land.
examples:
- The scablands are flat, high land cut by dry channels.
- Little grows on the scablands, where the soil is poor.
