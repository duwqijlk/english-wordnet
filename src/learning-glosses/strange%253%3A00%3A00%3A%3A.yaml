simpleMeaning: clearly unusual and unexpected, a little odd or even somewhat peculiar
scope: This sense is about something unusual and unexpected, not about something coming from another country
  and not about being unfamiliar because it is new.
examples:
- A strange noise came from the empty room.
- It felt strange to be back in his old school.
