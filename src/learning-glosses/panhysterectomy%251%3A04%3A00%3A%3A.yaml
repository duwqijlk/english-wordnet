simpleMeaning: The womb, the egg sacs, the tubes that carry eggs, the neck of the womb and the small glands
  near them are all taken out in this operation.
scope: 'It is also called radical hysterectomy: not the womb alone, but the womb with the egg sacs, tubes,
  neck and glands near them.'
examples:
- The panhysterectomy removed the womb and the egg sacs.
- A panhysterectomy also takes out the tubes that carry eggs.
