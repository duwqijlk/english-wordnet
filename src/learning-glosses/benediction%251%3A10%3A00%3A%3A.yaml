simpleMeaning: a formal prayer in a ceremony that asks God to keep someone or something safe
scope: 'Also called blessing: a formal prayer in a ceremony that asks God to keep someone or something
  safe, not a general good wish and not thanks said before a meal.'
examples:
- The priest gave the benediction at the end of the service.
- The benediction asked God to keep the travellers safe on their way.
