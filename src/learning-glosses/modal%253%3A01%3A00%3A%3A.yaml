simpleMeaning: About the form of a verb, which shows how the speaker sees what is said
scope: About the mood of a verb, not the most common value in a set of numbers and not a musical mode.
examples:
- In 'She may come', the word 'may' is a modal auxiliary.
- Modal verbs such as 'can' and 'must' show the mood of the main verb.
