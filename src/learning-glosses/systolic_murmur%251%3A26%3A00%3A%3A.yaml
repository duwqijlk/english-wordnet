simpleMeaning: a soft sound in the chest heard when the heart squeezes to push blood out
scope: A soft sound in the chest heard when the heart squeezes to push blood out, not a sound heard while
  the heart rests between beats and not a loud heart noise.
examples:
- The doctor heard a systolic murmur through the stethoscope.
- A systolic murmur was heard while the heart was beating.
