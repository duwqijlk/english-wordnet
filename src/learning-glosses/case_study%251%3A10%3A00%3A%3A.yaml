simpleMeaning: a close look at one group, such as a firm or a part of one, to find out what made it do
  well or badly
scope: A close look at one group, not a survey of many and not a mere history of one firm.
examples:
- The case study showed why the firm failed.
- Her case study of the small firm took a year to finish.
