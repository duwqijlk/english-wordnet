simpleMeaning: A band of people who have joined together in secret to do something harmful or against
  the law.
scope: A band of people joined in secret for a harmful or unlawful end, not the secret plan itself.
examples:
- The conspiracy plotted to seize the castle by night.
- Police broke up a conspiracy to rob the bank.
