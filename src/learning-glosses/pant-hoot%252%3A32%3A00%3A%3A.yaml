simpleMeaning: To call out to others with loud cries and quick, hard breaths, as apes and monkeys do
scope: To call out with loud cries and quick breaths, as apes and monkeys do; not a call made by a bird
  and not a cry of fear.
examples:
- The chimpanzees pant-hoot to call the group together.
- At dawn the males pant-hoot from the trees.
