simpleMeaning: not having sex, for example because of a promise made for reasons of religion
scope: 'This sense is also called chastity: it is about not having sex, for example for religion, not
  about having no partner for other reasons.'
examples:
- He chose celibacy after he made a promise for his religion.
- Her celibacy was part of the life she had promised to live.
