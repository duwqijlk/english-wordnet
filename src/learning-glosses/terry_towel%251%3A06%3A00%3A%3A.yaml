simpleMeaning: a cloth for drying the body after a bath, with a rough surface of loose raised threads
scope: A bath cloth with a rough, loose surface, not a smooth hand cloth and not a kitchen cloth.
examples:
- She dried her hands on a terry towel after her shower.
- The terry towel felt rough against his skin.
