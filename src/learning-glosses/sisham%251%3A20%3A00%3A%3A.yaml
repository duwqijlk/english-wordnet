simpleMeaning: Makers of ships and railway ties prize the dense, dark brown, long-lasting wood of this
  East Indian tree, whose leaves feed farm animals.
scope: 'Also called sissoo and sissu: an East Indian tree whose leaves feed farm animals and whose wood
  is used for ships and railway ties.'
examples:
- Farmers cut sisham leaves to feed their animals.
- Shipbuilders used sisham timber for their ships.
