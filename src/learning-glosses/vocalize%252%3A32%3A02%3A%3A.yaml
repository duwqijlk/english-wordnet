simpleMeaning: to say something out loud while the folds in the throat shake to make sound
scope: To say something out loud while the folds in the throat shake to make sound; voice and sound are
  other names for this sense, and it is not singing notes on one vowel.
examples:
- Babies vocalize long before they can say words.
- The teacher asked the class to vocalize the sounds one by one.
