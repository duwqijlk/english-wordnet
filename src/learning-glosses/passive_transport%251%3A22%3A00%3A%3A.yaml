simpleMeaning: The moving of a substance through a cell's thin wall by spreading out, which takes no energy
scope: A substance crossing a cell's wall by spreading out, with no energy spent, not a move that needs
  energy and not a move through a blood vessel.
examples:
- Passive transport lets salt cross the cell membrane without using energy.
- Oxygen enters the cell by passive transport.
