simpleMeaning: Said of a thing that can change when it joins with oxygen
scope: Said of a thing that can change with oxygen, not of a thing that stays the same in air.
examples:
- Iron is oxidizable and rusts in damp air.
- This metal is oxidizable, so keep it dry.
