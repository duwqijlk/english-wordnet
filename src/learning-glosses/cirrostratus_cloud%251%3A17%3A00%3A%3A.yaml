simpleMeaning: a thin, even sheet of haze high up in the sky
scope: A thin, even sheet of haze high in the sky; cirrostratus is another name for this sense, not a
  wispy high cloud and not a low grey layer.
examples:
- The cirrostratus cloud made a pale veil over the sun.
- A cirrostratus cloud is a thin sheet of haze high above us.
