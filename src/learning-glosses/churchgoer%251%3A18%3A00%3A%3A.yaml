simpleMeaning: someone who believes in a religion and goes to church regularly
scope: A person who goes to church regularly for their religion, not a priest who leads the service and
  not a person who goes only once in a while.
examples:
- As a regular churchgoer, she is at church every Sunday.
- The churchgoers filled the seats for the morning service.
