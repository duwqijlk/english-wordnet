simpleMeaning: a viewing tool that uses lenses to make the image of a small thing look bigger
scope: A viewing tool that uses lenses to make small things look bigger; not a tool that uses electrons
  to do the same job and not a plain magnifying glass.
examples:
- She put the slide under the light microscope to see the cells.
- The light microscope showed the tiny threads clearly.
