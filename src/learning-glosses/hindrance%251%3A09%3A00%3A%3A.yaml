simpleMeaning: something you cannot see or touch that gets in the way of action or makes progress slower
scope: This sense is something you cannot see or touch that slows action or progress, also called check,
  balk, deterrent, impediment, handicap, and baulk. It is not a thing that blocks the way, and not the
  act of blocking.
examples:
- Fear was a hindrance to her progress at school.
- A lack of money was a hindrance to the building work.
