simpleMeaning: Said of living things, like green plants, that make rich food stuffs from plain lifeless
  matter by using light from the sun
scope: Autophytic is another name for autotrophic, used of living things like green plants that make food
  from light and plain matter.
examples:
- Autophytic algae make food from light and plain matter.
- The autophytic leaves use light from the sun to make food.
