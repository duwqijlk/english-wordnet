simpleMeaning: A bed or layer of rock or earth under the ground that holds water and gives water to wells
  and springs
scope: This is the underground layer that holds the water; it is not the well or spring that takes water
  from it, and not a river on the ground.
examples:
- The town gets its water from an aquifer deep under the fields.
- If the aquifer dries up, the wells will have no water.
