simpleMeaning: a pattern of diamonds in many colours on a plain ground, first used for knitted clothes,
  copied from the checked cloth of a clan in western Scotland
scope: 'Also called argyle: a diamond pattern first used for knitted clothes, not a silver gravy holder
  of the same name.'
examples:
- His socks had an argyll pattern of coloured diamonds.
- The argyll design came from a Scottish clan's checked cloth.
