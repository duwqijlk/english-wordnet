simpleMeaning: a careful and full search for something, often leaving things messy or mixed up
scope: This is the act of a careful, full search for something, often leaving a mess; it is not the thing
  you are looking for.
examples:
- After a long rummage through the attic, she found the old photos.
- He gave the box a good rummage but found nothing in it.
