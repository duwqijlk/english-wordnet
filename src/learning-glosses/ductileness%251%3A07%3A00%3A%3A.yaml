simpleMeaning: 'Pulled out into threads or wires, or beaten into thin sheets: this is how a thing can
  be shaped.'
scope: Also called ductility, it names the way a thing can be pulled out into threads or wires or beaten
  into thin sheets.
examples:
- The ductileness of copper lets it be drawn into fine wire.
- Gold is prized for its ductileness.
