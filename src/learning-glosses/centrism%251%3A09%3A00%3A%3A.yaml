simpleMeaning: a way of thinking in politics that stays away from the far left and the far right and takes
  a middle path
scope: 'Also called moderatism: a way of thinking in politics that takes a middle path, not a way of thinking
  that holds to the far left or the far right.'
examples:
- His centrism put him at odds with both wings of the party.
- Centrism won few cheers at a meeting full of strong views.
