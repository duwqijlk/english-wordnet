simpleMeaning: From a salt of ammonia, a chemical is made by swapping its hydrogen bits for bits that
  hold carbon; it cleans, kills germs, and goes into drugs.
scope: It is made from a salt of ammonia, not ammonia itself, and is used to clean, kill germs, or go
  into drugs.
examples:
- The cleaner has a quaternary ammonium compound that kills germs.
- Doctors use a quaternary ammonium compound in some drugs.
