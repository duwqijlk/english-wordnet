simpleMeaning: The movement of the muscles of the food tube in the opposite way to the waves that push
  food along.
scope: The movement of the muscles of the food tube in the opposite way to the waves that push food along,
  not the waves that push food along and not a still food tube.
examples:
- Anastalsis moved the food back up the tube.
- The doctor noted anastalsis in the food tube.
