simpleMeaning: Its sap smells sweet, and round spiky bunches of fruit grow on this North American tree
  of the group Liquidambar
scope: 'Also called bilsted, sweet gum, and sweet gum tree: a North American tree with round spiky fruit
  and sap that smells sweet, not the dried sap that comes from gum trees.'
examples:
- The red gum dropped its round spiky fruit on the ground.
- The red gum gave off sap that smelled sweet.
