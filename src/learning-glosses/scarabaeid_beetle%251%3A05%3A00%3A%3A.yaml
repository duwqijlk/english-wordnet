simpleMeaning: Any of many kinds of thick-bodied insects with hard spikes on their heads.
scope: A thick-bodied insect with hard spikes on its head, also called scarabaean and scarabaeid; not
  a stag beetle with great jaws and not a dung beetle that rolls dung.
examples:
- The scarabaeid beetle is thick and dark.
- A scarabaeid beetle crawled across the path.
