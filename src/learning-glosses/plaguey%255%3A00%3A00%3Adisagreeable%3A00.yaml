senseId: plaguey%5:00:00:disagreeable:00
synsetId: 00090253-s
simpleMeaning: That vexes and annoys.
scope: This sense is also called annoying, teasing, irritating, pestering, vexing, galling, pesky, bothersome,
  nettlesome, and vexatious, for vexing and annoying, where annoying is causing a person to feel upset
  and a little angry, teasing is making people feel annoyed and a little angry, and irritating is making
  people feel annoyed or bothered, unlike the sense for acting in a harmful or nettling way.
examples:
- The wait was plaguey, vexing and annoying.
- The noise was plaguey, vexing.
