simpleMeaning: a college or university's official recognition that a student has passed a course, usually
  counted in hours for each semester
scope: This is the academic unit for finishing a course, not praise for an achievement or a lender's trust
  in repayment.
examples:
- She earned three credits for the biology course.
- He needs six more credits to graduate.
