simpleMeaning: a short, hard breath taken in through an open mouth
scope: Another name for a gasp, one short strained breath drawn through the mouth, not the verb for breathing
  noisily when tired or the puff of steam from an engine.
examples:
- She let out a pant and leaned against the wall.
- He gave a short pant before answering.
