simpleMeaning: Instead of a line that heats steel without stopping, this heater takes the stiffness out
  of flat steel that work has made hard.
scope: Bell-type annealing furnace is another name for this heater, which takes the stiffness out of flat
  steel that work has made hard.
examples:
- The steel strip went into the bell-type furnace to lose its stiffness.
- After the bell-type furnace, the strip bent without breaking.
