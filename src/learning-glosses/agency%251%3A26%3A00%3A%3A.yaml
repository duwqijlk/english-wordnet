senseId: 'agency%1:26:00::'
synsetId: 14023888-n
simpleMeaning: The condition of acting for someone else with official permission and authority.
scope: This is the role of standing in for another person with official authority, not a business or government
  office that provides services, and not the general power to act or make things happen.
examples:
- The lawyer had agency to sign the contract on behalf of her client.
- The company granted him agency to negotiate in its name.
