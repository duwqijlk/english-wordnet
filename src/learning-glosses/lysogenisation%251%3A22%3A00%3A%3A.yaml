simpleMeaning: The way a germ takes in a virus that then joins into the germ's own set of genes.
scope: The way a germ takes in a virus that then joins into the germ's own set of genes; lysogenization
  is another name for this sense, not a germ taking in food.
examples:
- Lysogenisation left the germ carrying the virus in its genes.
- Through lysogenisation the virus became part of the germ.
