simpleMeaning: Rooms where the crew live, built as a raised part at the front of a goods ship.
scope: These are rooms where the crew live at the front of a goods ship, not a cabin for officers or a
  store room, and they are also called a forecastle.
examples:
- The crew slept in the fo'c'sle.
- The fo'c'sle was at the bow of the ship.
