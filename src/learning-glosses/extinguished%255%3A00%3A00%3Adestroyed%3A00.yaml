simpleMeaning: Said of a learned response that has died out because the reward that kept it going was
  taken away or was never given.
scope: Said of a learned response that has died out for want of its reward, not a fire put out and not
  a life ended.
examples:
- The extinguished response no longer came when the bell rang.
- After weeks without a reward, the extinguished habit faded away.
