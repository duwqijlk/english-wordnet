senseId: 'carrick_bend%1:06:00::'
synsetId: 02973093-n
simpleMeaning: a knot that joins the ends of two thick ropes, such as the heavy ropes used on ships
scope: A knot for joining the ends of two thick ropes, not a knot for tying one rope to a post and not
  a knot that joins thin cords.
examples:
- He tied a carrick bend to join the two ropes into one long line.
- The sailors used a carrick bend to connect the ends of the heavy ropes.
