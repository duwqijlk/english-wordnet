simpleMeaning: a sharp part shaped like a triangle that sticks out from a bone
scope: A sharp part shaped like a triangle that sticks out from a bone, also called processus coronoideus;
  not the one on the lower jaw that holds a jaw muscle, and not a break in a bone.
examples:
- The coronoid process on the elbow bone helps the joint bend.
- A coronoid process juts out from the bone near the elbow.
