simpleMeaning: Cassava, with long swollen roots that can be eaten and soft stems that break easily, used
  most of all to make cassiri, a drink that makes people drunk, and tapioca.
scope: 'Also called gari, manioc, bitter cassava, mandioc, mandioca, tapioca plant and Manihot utilissima:
  cassava with long swollen edible roots, used most of all to make cassiri and tapioca.'
examples:
- Manihot esculenta grew in the field, its long roots ready to dig.
- We ground Manihot esculenta roots to make tapioca.
