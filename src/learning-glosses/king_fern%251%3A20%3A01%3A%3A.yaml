simpleMeaning: a large plant with deep roots, found all over the world, with upright leaves of small leaflets
  split twice, growing in a bunch
scope: 'Also called ditch fern, royal fern, or royal osmund: a large deep-rooted plant found all over
  the world, not the rain-forest fern of the same name, and not a small woodland fern.'
examples:
- A king fern taller than a person grew beside the stream.
- The king fern's deep roots held it firm in the wet soil.
