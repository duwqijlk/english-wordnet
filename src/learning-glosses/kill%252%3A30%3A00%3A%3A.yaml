simpleMeaning: mark something so it will be removed, rub it out, or wipe it away.
scope: This is about removing written or printed marks, not about ending a life, delighting someone, or
  ruining something's essential nature.
examples:
- The editor killed the paragraph before the article went to print.
- Kill that line in the script; it doesn't fit the scene.
