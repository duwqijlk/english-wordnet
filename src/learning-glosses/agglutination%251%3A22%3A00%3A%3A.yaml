simpleMeaning: the making of words by joining small word parts that keep their own shape and sense
scope: The building of words from parts that keep their shape and sense, not the clumping of blood cells
  or germs and not the joining of small bits in a liquid.
examples:
- In agglutination, words are built by joining parts that keep their form.
- Agglutination lets a language build long words from small parts that keep their meaning.
