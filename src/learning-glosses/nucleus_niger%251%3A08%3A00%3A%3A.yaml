simpleMeaning: a layer of dark grey matter in the midbrain, linked with the striate body, that plays a
  part in body chemistry upset seen with Parkinson's disease and Huntington's disease
scope: 'Also called locus niger and substantia nigra: a layer of dark grey matter in the midbrain, not
  the whole midbrain and not the outer grey matter of the brain.'
examples:
- The nucleus niger is a dark layer of grey matter in the midbrain.
- Damage to the nucleus niger is seen in Parkinson's disease.
