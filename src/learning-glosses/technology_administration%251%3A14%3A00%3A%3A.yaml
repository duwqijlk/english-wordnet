simpleMeaning: A part of the United States Department of Commerce that works with American firms to help
  them compete and to get the most good from new tools for the economy.
scope: This is a United States Department of Commerce office that helps American firms compete through
  new tools, not a firm itself and not a body that makes laws.
examples:
- The Technology Administration helps small firms use new tools.
- The Technology Administration works with industries across the United States.
