simpleMeaning: a person who guides the push to get the same fair chances for members of groups with less
  power
scope: This is a person who guides the push for fair chances for people in groups with less power; civil
  rights activist and civil rights worker are other names for this sense, not a person who only backs
  the push.
examples:
- The civil rights leader spoke to the crowd about fair housing.
- A young civil rights leader took charge of the campaign.
