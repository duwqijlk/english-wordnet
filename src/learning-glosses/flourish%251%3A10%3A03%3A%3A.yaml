simpleMeaning: In music, a short lively tune played on brass instruments (metal instruments that you blow
  into, such as a trumpet)
scope: In music, a short lively tune played on brass instruments (metal instruments that you blow into);
  not the verb that means to make steady progress and do well.
examples:
- The king walked in to a flourish of trumpets.
- A short flourish from the band marked the start of the show.
