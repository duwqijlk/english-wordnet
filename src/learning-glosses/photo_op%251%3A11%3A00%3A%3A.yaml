simpleMeaning: Pictures that give those in them good public notice are the point of this time, which suits
  taking them or is set up on purpose for them.
scope: It is also called photo opportunity, and it is a time set up for pictures that give good public
  notice to the people in them.
examples:
- The mayor called a photo op.
- A photo op gave the singer good publicity.
