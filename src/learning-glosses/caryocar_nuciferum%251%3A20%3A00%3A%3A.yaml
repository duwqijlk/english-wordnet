simpleMeaning: A large South American tree that keeps its leaves all year, with leaves in threes and stone
  fruits with nut-like seeds eaten as food and pressed for cooking oil.
scope: Also called souari, souari nut and souari tree; a large South American tree with nut-like seeds
  used as food and oil, among the large trees of South America.
examples:
- The Caryocar nuciferum stood tall in the forest, its leaves in threes.
- Caryocar nuciferum bears stone fruits with nut-like seeds pressed for cooking oil.
