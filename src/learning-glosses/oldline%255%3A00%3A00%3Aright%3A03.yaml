simpleMeaning: Against any change in how things are run, this person keeps the ways of the past
scope: Said of a person who fights change and keeps the ways of the past, also called old-line; not a
  person open to new ways and not a person who wants only small changes.
examples:
- The oldline members of the club kept the old rules.
- She was known as an oldline thinker who distrusted change.
