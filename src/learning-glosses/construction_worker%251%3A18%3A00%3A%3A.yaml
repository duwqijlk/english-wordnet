simpleMeaning: A person skilled at putting up offices, homes, and other buildings.
scope: Also called hard hat; a person skilled at putting up offices, homes, and other buildings, not the
  person who plans them and not a person who repairs roads.
examples:
- The construction worker put up the frame of the new house.
- Construction workers arrived at dawn to start the roof.
