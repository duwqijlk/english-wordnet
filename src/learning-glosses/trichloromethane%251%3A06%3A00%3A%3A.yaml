simpleMeaning: A liquid with three chlorine atoms that turns to air fast and was once used to put people
  to sleep for operations
scope: A liquid with three chlorine atoms that turns to air fast and was once used to put people to sleep,
  also called chloroform; not drinking alcohol and not a modern sleeping drug.
examples:
- Trichloromethane was once used to put patients to sleep before surgery.
- The nurse kept the trichloromethane bottle tightly closed so it would not turn to air.
