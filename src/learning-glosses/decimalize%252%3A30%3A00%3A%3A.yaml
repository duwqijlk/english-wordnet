simpleMeaning: to move a system of counting or measuring over to one based on tens
scope: To move a system to one based on tens, also called decimalise; not changing fractions into decimals,
  and not changing the coins alone.
examples:
- The country decimalized the currency in 1975.
- The new law decimalized the old weights and measures.
