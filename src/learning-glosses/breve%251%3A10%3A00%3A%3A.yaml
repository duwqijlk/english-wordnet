simpleMeaning: To show that a vowel sounds short, a small U-shaped mark is set above it.
scope: A breve is a small U-shaped mark set above a vowel to show that its sound is short.
examples:
- The breve over the vowel shows it is short.
- The vowel with a breve is short.
