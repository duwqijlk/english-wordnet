simpleMeaning: in boxing, a win awarded on points because neither fighter was knocked out
scope: This is the boxing result, not the act of making up your mind, not an opinion reached after thinking,
  not the outcome of a game in general, and not firmness of character.
examples:
- He won the fight by decision after twelve rounds.
- The judges awarded her a unanimous decision.
