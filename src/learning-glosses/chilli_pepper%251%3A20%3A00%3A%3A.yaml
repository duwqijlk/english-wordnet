simpleMeaning: a plant that bears very hot long fruit, thin and pointed at the tip, most often red
scope: 'Also called jalapeno, cayenne, cayenne pepper, chili pepper and long pepper: the plant that bears
  very hot long fruit, not the fruit itself and not a plant that bears mild sweet fruit.'
examples:
- The chilli pepper by the fence had long red fruit hanging from it.
- She picked a chilli pepper plant that was covered in thin pointed fruit.
