simpleMeaning: A tall, showy annual from tropical America, with hairy stems, deep purple-flushed leaves
  and long spikes of usually red flowers; people often eat its seeds as a cereal.
scope: Another name for the tall grain plant also called red amaranth; it is the whole plant, not just
  the seeds, and not the Asian annual with drooping crimson spikes.
examples:
- Purple amaranth grew in a tall row along the fence, its red spikes bright against the purple-washed
  leaves.
- The seeds of purple amaranth are often used as a cereal.
