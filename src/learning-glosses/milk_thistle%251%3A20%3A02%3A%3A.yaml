simpleMeaning: a tall Old World plant living two years, its large stem-hugging leaves blotched with white
  and its flower heads purple; now wild in California and South America
scope: 'Also called blessed thistle, holy thistle, and lady''s thistle: a tall plant with white-marked
  leaves and purple flower heads, not a small garden flower or a tree.'
examples:
- Milk thistle grew tall along the fence, its big leaves marked with white.
- The milk thistle in the field had purple flower heads.
