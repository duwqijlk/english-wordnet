simpleMeaning: A bushy shrub that grows on damp riverbanks and flood plains in the eastern United States,
  with fragrant leaves and tight spikes of dark purple flowers.
scope: This is the eastern North American riverbank shrub with dark purple flowers, not the wild indigo
  plants of the genus Baptisia or the Pacific coast shrub with red to indigo flowers; bastard indigo is
  another name for this plant.
examples:
- False indigo covered the flood plain beside the creek.
- In late summer the false indigo is covered in spikes of dark purple flowers.
