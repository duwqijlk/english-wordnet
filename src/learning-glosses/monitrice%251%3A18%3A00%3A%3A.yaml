simpleMeaning: By getting a woman in labour to use what she learned in birth classes, this helper, often
  the father of the child to be born, backs her
scope: 'Also called a doula, a birthing coach or a labor coach: a helper who backs a woman in labour,
  not a midwife and not the doctor.'
examples:
- The monitrice stayed with her through the long labour.
- Her husband acted as monitrice, urging her to breathe as she had learned.
