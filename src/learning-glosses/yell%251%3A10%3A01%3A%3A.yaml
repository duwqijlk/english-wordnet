simpleMeaning: a loud sound someone makes from strong feeling, often wordless
scope: This is an emotional, often wordless outburst - another name for cry in this sense - not the shout
  of protest or opposition covered by the other yell noun.
examples:
- Her yell of pain brought the nurse running.
- A yell of rage came from the room next door.
