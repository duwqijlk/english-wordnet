senseId: 'clayeyness%1:07:01::'
synsetId: 92419230-n
simpleMeaning: The quality of being like clay in thickness or in feel.
scope: The quality of being like clay in thickness or in feel, also called clayiness and clayishness;
  not being made of clay itself and not mere wetness.
examples:
- The clayeyness of the wet soil made it stick to her boots.
- He noted the clayeyness of the mixture before he shaped it.
