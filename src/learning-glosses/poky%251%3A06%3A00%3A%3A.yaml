simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: US slang for a prison, an alternative spelling of pokey; not the adjective meaning slow, or the
  one meaning small and remote.
examples:
- They threw him in the poky for the weekend.
- The town poky had not been repaired in years.
