simpleMeaning: Yellow skin and white parts of eyes, caused by too much bilirubin (a yellow substance from
  bile) in the blood; a possible sign of gallstones, liver infection or anemia
scope: 'Also called icterus: this is the yellow colour in skin and eyes from illness, not a rough and
  bitter way of behaving and not the verb sense.'
examples:
- The baby had jaundice, and her skin looked yellow for a few days.
- His eyes turned yellow, and the doctor said it was jaundice caused by a liver problem.
