simpleMeaning: a mark put above a vowel to show that it is said with more force or in a special way
scope: A written mark over a vowel, not the way a person speaks and not the words used by one group of
  people.
examples:
- The accent over the e in café shows how to say it.
- She put an accent on the letter to show its special sound.
