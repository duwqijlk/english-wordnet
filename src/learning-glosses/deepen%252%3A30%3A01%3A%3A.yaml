senseId: 'deepen%2:30:01::'
synsetId: 00227591-v
simpleMeaning: to make something grow stronger, or easier to notice
scope: Compound, intensify and heighten are other names for this sense, which is to make something grow
  stronger or easier to notice; not for a sound to become lower in tone, and not to make a place or a
  hole go further down.
examples:
- The bad news deepened her worry about the job.
- Working together deepened their trust in each other.
