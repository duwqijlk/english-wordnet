simpleMeaning: a tree of New Zealand that drops its leaves in winter; its inner bark makes a strong fibre
  like flax, known as New Zealand cotton
scope: Also called ribbon tree; not the small New Zealand shrub with paper-white flowers that shares the
  name ribbonwood.
examples:
- The ribbonwood drops its leaves in winter.
- Workers took fibre from the ribbonwood's inner bark.
