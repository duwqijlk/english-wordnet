simpleMeaning: On the high flat land that runs from Arizona to the west of Colorado lives a lizard marked
  by clear long lines from head to tail.
scope: This lizard of the high flat land from Arizona to the west of Colorado is set apart from other
  lizards by the clear long lines that run from head to tail.
examples:
- The plateau striped whiptail lives on the high flat land from Arizona to the west of Colorado.
- You can tell a plateau striped whiptail by the clear long lines that run from head to tail.
