simpleMeaning: The part of the outer layer of the brain that takes in sound signals from a small deep
  part of the brain
scope: This is the part of the outer layer of the brain that takes in sound signals from a small deep
  part of the brain; auditory area is another name for it, not the part that takes in what the eyes see
  and not the part that moves the body.
examples:
- The auditory cortex takes in sound signals from deep in the brain.
- Damage to the auditory cortex can make it hard to make sense of sounds.
