senseId: 'girdle%2:35:01::'
synsetId: 01611026-v
simpleMeaning: to cut a ring round a plant or tree so that water and food can no longer move inside it,
  and it dies
scope: 'Also called deaden: to cut a ring round a plant or tree to kill it, not a waist band for clothes
  and not putting a band round something.'
examples:
- They girdled the tree, and it died the next year.
- If you girdle the young plant, water cannot move up inside it.
