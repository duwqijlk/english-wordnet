simpleMeaning: One of several lichens of the genus Parmelia, used as the source of red-brown or purple
  dyes
scope: This is one of a group of dye-making growths of the genus Parmelia, not a moss and not a flowering
  plant; crotal and crottle are other names for this sense.
examples:
- She boiled crottal to make a red dye.
- Crottal grows on the old stones.
