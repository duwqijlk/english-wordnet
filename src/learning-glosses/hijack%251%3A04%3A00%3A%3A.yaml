simpleMeaning: taking over a vehicle while it is on a journey, either to steal from it or to take it somewhere
  else
scope: Taking over a moving vehicle to rob it or divert it; not simply stealing a vehicle, and not holding
  its passengers for ransom.
examples:
- The hijack of the truck left the driver tied up by the road.
- Police stopped the hijack before the van reached the border.
