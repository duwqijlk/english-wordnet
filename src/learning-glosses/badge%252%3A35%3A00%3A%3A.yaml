simpleMeaning: to put a small sign on someone that shows what group they belong to
scope: This is the verb for putting the sign on someone; not the noun, which is the small sign itself
  that shows rank or a group.
examples:
- All the workers at the gate must be badged before they go in.
- The guard badged each visitor at the front desk.
