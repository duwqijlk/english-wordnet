simpleMeaning: having sudden jerky muscle pulls that a person cannot control, like a sudden tight pull
  in a muscle
scope: 'Also called spastic and spasmodic: this means jerky muscle pulls a person cannot control, not
  sudden and violent in a general way.'
examples:
- His hands made small convulsive movements and he could not hold the cup still.
- The sick child gave a convulsive jerk, her muscles tightening again and again.
