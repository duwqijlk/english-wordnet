senseId: 'generalization%1:09:00::'
synsetId: 05921869-n
simpleMeaning: A broad thought or finding, one that fits many cases and not just a single one.
scope: Also called generality, a broad thought or finding that fits many cases; not the act of working
  out broad ideas from what cases have in common, not reasoning from detailed facts to general principles,
  and not the carrying over of a learned response to a similar stimulus.
examples:
- He spoke in broad generalizations about life in the city.
- Her generalization about all teenagers was unfair.
