simpleMeaning: This timber tree grows in those islands, and its wood is hard and red and smells sweet.
scope: Also called kalantas, Cedrela calantas, Philippine mahogany, and Toona calantas; a timber tree
  with hard red wood that smells sweet, not any other kind of timber tree.
examples:
- The Philippine cedar by the house has hard red wood that smells sweet.
- They cut Philippine cedar for its hard red wood.
