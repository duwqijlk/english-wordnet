simpleMeaning: to get in the way of signals or to stop them from being received
scope: Also called block. This is the verb for stopping radio or other signals from being received. Not
  the sweet fruit food you spread on bread, and not the noun that names the act of sending out energy
  to stop enemy electronic devices from working.
examples:
- The enemy tried to jam the radio signals so no one could hear the news.
- They jammed the station's broadcasts all through the night.
