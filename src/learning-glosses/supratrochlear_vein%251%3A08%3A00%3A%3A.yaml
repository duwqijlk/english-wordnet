simpleMeaning: The tube over the eye is met by this blood tube, and the two become one tube that carries
  blood away from the front of the scalp.
scope: Vena supratrochlearis is another name for this blood tube that drains the front of the scalp and
  joins the tube over the eye.
examples:
- The supratrochlear vein drains blood from the front of the scalp.
- The supratrochlear vein joins the supraorbital vein to form the angular vein.
