simpleMeaning: A skin disease a person gets in life, with patches of skin that lose their color, often
  with a ring of much darker skin around them
scope: This is a skin disease got in life that leaves patches where the skin loses its color, often with
  darker skin around them. It is not a skin mark a person is born with.
examples:
- The light patches on his hands were caused by vitiligo.
- Her vitiligo left white patches on her face, each with a dark edge.
