simpleMeaning: to make something cover a bigger area or a wider range of things or people
scope: This is about making the area or range bigger, not about reaching across a distance and not about
  pushing a hand out.
examples:
- The new law was extended to cover all workers.
- They extended their garden by buying the land next to it.
