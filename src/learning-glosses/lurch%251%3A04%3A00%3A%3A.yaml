simpleMeaning: A person's steps do not fall in an even, steady way as they walk
scope: 'Also called stumble and stagger: an unsteady way of walking, not the sudden up-and-down motion
  of a ship and not a defeat in a game.'
examples:
- He walked with a lurch after his ankle was hurt.
- Her lurch made it hard for her to keep up with us.
