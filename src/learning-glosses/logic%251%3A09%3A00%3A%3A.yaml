simpleMeaning: the part of philosophy that studies how we work out what must be true from facts we are
  given
scope: This is the study of how we work out what must be true from facts, not a computer's system of steps
  and not sound, fair judgment by itself.
examples:
- She studied logic at university to learn how arguments are built.
- Logic helps us test whether a conclusion really follows from the facts.
