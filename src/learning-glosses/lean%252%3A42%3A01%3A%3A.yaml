simpleMeaning: to tend or be naturally disposed toward doing or being something, or to be inclined that
  way
scope: The sense of having a usual tendency or preference, not the physical act of bending sideways and
  not the adjective for thinness; run is another name for this sense, as in dresses that run small.
examples:
- The committee leans toward approving the plan.
- He leans toward optimism even after a bad week.
