simpleMeaning: a matching set of outer clothes, usually a jacket with trousers or a skirt, all made from
  the same cloth in the same color.
scope: This is the clothing itself, not a legal case, not a set of playing cards, and not the slang word
  for an executive.
examples:
- He wore a dark gray suit to the interview.
- She bought a new suit for the wedding.
