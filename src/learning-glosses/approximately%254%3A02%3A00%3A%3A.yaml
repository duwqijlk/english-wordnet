simpleMeaning: not exact, but fairly close to the true number or amount
scope: This says a number or amount is not exact but fairly close to the true one, and about, some, around
  and roughly are other names for it, not a word that means exactly.
examples:
- The walk takes approximately an hour.
- She is approximately thirty years old.
