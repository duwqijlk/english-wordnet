simpleMeaning: the steps taken to work out a number or an answer, by doing sums or by following rules
  of maths or thought
scope: 'Also called a calculation: the steps of working out an answer by sums or rules, not a number problem
  itself.'
examples:
- The computation took the clerk all morning to finish.
- Their computation of the costs showed the plan would lose money.
