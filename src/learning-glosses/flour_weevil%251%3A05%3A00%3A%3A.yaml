simpleMeaning: A bug that lives in and spoils ground grain and grain kept in store.
scope: A bug that lives in and spoils ground grain and stored grain, also called a flour beetle; not a
  bug that eats leaves and not a bug that lives in a house without spoiling food.
examples:
- The flour weevil had got into the sack of flour.
- Flour weevils spoil grain kept in the store.
