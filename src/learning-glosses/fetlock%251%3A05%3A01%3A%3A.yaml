simpleMeaning: the joint in a horse's leg between the cannon bone (the long bone above it) and the pastern
  (the short part below it, above the hoof)
scope: This is a joint in a horse's leg, not the part that sticks out behind and above a horse's hoof.
examples:
- The horse hurt its fetlock when it jumped the fence.
- The vet put a band around the horse's fetlock.
