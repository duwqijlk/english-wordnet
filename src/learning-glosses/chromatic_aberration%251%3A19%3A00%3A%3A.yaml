simpleMeaning: a fault in the way light passes through glass, so the picture shows coloured edges
scope: A fault where a picture shows coloured edges, not a blurred picture and not a fault in the camera
  body.
examples:
- The photo showed chromatic aberration around the tree branches.
- Cheap lenses often show chromatic aberration at the edges.
