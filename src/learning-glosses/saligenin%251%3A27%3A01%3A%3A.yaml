simpleMeaning: a crystalline alcohol of the phenol type, with chemical formula C7H8O2, usually made by
  breaking down salicin with water.
scope: Another name for salicylic alcohol; this is the crystalline phenolic alcohol obtained from salicin,
  not salicylic acid or ordinary alcohol.
examples:
- Saligenin is usually obtained by breaking down salicin.
- The chemist crystallised saligenin from the plant extract.
