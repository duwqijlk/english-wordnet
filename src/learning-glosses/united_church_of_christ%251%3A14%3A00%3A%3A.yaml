simpleMeaning: The joining in 1957 of two Protestant groups, the Congregational followers of Jesus and
  the Evangelical and Reformed group.
scope: This is the joining in 1957 of two Protestant groups, the Congregational followers of Jesus and
  the Evangelical and Reformed group, different from the two groups before they joined and from other
  Protestant groups.
examples:
- The United Church of Christ was formed in 1957.
- He is a minister of the United Church of Christ.
