simpleMeaning: Travel, food and a place to stay are all paid for in one price, on a trip planned by a
  travel agent
scope: 'Also called package tour: a trip planned by a travel agent with travel, food and a place to stay
  all paid for in one price, not a trip planned on your own and not a trip where you pay for each part
  as you go.'
examples:
- We booked a package holiday to Greece for the summer.
- Their package holiday covered flights, meals and the hotel.
