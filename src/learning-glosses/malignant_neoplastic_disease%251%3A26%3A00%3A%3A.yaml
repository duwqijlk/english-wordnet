simpleMeaning: Any harmful new growth in the body, caused when cells divide without control, which may
  spread to other parts through the clear-fluid tubes or the blood.
scope: Any harmful new growth from cells dividing without control, which may spread through the body,
  also called cancer, not a harmless lump and not a growth caused by injury.
examples:
- Malignant neoplastic disease can spread through the blood.
- Doctors found malignant neoplastic disease in his lung.
