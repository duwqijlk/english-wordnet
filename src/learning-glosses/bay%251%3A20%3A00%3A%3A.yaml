simpleMeaning: A small evergreen tree of the Mediterranean with dark berries and shiny, fragrant leaves
  used to flavor food; the ancient Greeks also used it to crown winners.
scope: This is the tree and its leaves; it is not a curve in a coastline and not the long cry of a dog.
examples:
- She dropped a bay leaf into the simmering sauce.
- Ancient Greek victors were crowned with bay leaves.
