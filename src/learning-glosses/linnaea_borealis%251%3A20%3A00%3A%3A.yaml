simpleMeaning: A low creeping evergreen shrub of northern Europe and Asia, with delicate sweet-smelling
  tube-shaped bell flowers, usually pink, borne in pairs.
scope: Also called twinflower; a low creeping evergreen shrub of the far north, not a tall rose and not
  a single-flowered plant.
examples:
- Linnaea borealis spreads low across the forest floor in the far north.
- The pink pairs of Linnaea borealis smell sweet in June.
