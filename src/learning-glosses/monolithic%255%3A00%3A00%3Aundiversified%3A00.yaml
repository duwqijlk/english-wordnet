simpleMeaning: Big, stiff, and all the same through, with no change or variety in any part.
scope: Big, stiff, and all the same through, with no change or variety; not the use for a thing that is
  merely large and solid in build.
examples:
- The party was monolithic in its refusal to change.
- The movement remained monolithic, with one voice and one plan.
