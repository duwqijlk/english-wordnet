simpleMeaning: reaching a long way in from the outer edge or surface.
scope: This is not about how far down something goes from the top or about a low sound; it is about distance
  in from the front or outer edge.
examples:
- The shelf is deep enough to hold a row of large books.
- A deep drawer runs far back under the counter.
