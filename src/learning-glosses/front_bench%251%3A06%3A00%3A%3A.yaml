simpleMeaning: Any of the first-row seats in the House of Commons kept for ministers or past ministers
scope: Seats kept for ministers in the House of Commons, not the back seats for ordinary members and not
  the Speaker's chair.
examples:
- The minister took his place on the front bench.
- Former ministers still sit on the front bench.
