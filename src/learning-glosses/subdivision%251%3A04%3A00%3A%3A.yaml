simpleMeaning: the act of splitting something that was already split into smaller parts
scope: The act of splitting something already split into smaller parts. This is not a part of a written
  or musical work, and not an area of land made up of smaller plots.
examples:
- The subdivision of the large field into small plots took months of work.
- Further subdivision of the long chapter into short parts made it easier to read.
