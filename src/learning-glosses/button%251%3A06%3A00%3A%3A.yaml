simpleMeaning: a round thing sewn onto a shirt, a coat, or other clothes, that goes through a hole made
  for it and holds the clothes shut
scope: This is the round piece sewn on clothes to hold them shut; not the area you click on a screen,
  not a badge, and not a switch you press.
examples:
- One button on his shirt came off in the wash.
- She sewed a new button onto her coat.
