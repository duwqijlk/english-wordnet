simpleMeaning: a fighting person on the other side, especially a soldier in the army you are fighting
scope: 'Also called enemy and foe: an armed person on the opposing side, not the act of standing against
  a thing and not a group of people joined against a thing.'
examples:
- A soldier must be ready to face the opposition in battle.
- The opposition shelled the town through the night.
