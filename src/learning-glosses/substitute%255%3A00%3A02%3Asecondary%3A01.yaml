simpleMeaning: Able to play in any of several spots on a team
scope: Able to play in any of several spots on a team, also called utility, not the player who only goes
  in when a first-choice player comes off.
examples:
- The substitute infielder could play second, shortstop, or third.
- A substitute player who can fill many spots is worth keeping.
