simpleMeaning: In Western painting, a French movement that both carried on from the style before it and
  turned against the limits built into that style
scope: In Western painting, this is a French movement that both grew out of Impressionism and turned against
  that style's limits, not Impressionism itself and not a later modern movement.
examples:
- The Post-Impressionism of Toulouse-Lautrec changed French art.
- She studied Post-Impressionism in Paris.
