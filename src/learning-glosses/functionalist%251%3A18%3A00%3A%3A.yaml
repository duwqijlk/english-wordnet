simpleMeaning: A person who follows the idea that things are known by what they do
scope: This is a person who follows the idea that things are known by what they do, not a person who judges
  things by their form alone.
examples:
- The functionalist argued that the mind is best known by what it does.
- She was a functionalist in her approach to design.
