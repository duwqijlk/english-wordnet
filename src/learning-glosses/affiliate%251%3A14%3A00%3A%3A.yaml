simpleMeaning: an organization that is linked to another organization and works under it
scope: This sense is a smaller organization linked to a larger one; it is not a person who is linked to
  an organization, and not the act of joining one.
examples:
- The local radio station is an affiliate of the national network.
- Several small companies became affiliates of the large group.
