senseId: 'day_of_reckoning%1:28:00::'
synsetId: 15196354-n
simpleMeaning: In the New Testament, the time at the end of the world after Armageddon when God fixes
  each person's fate by the good and bad of their life on earth.
scope: In the New Testament, this is the time at the end of the world when God fixes each person's fate,
  also called doomsday, the crack of doom, the end of the world, and eschaton, not a court day in this
  life or the end of a single person's life.
examples:
- The preacher spoke of the day of reckoning at the end of time.
- On the day of reckoning, God will judge each person by their life.
