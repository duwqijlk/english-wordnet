simpleMeaning: In American football, a player on the attacking line who stands between the center and
  a tackle at the start of a play.
scope: This is a football position, not someone who keeps a place safe.
examples:
- The guard pulled to the right to block for the runner.
- He played guard on the offensive line in college.
