simpleMeaning: A piece of clothing that covers the lower limb, usually from the knee down to the ankle
scope: A garment for the lower limb; legging and leg covering are other names for this sense, not a sock
  for the foot alone and not a pair of trousers.
examples:
- She wore a thick leging against the cold.
- His leging reached from knee to ankle.
