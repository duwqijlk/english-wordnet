simpleMeaning: In physics, an energy packet moving as a wave through non-linear systems, with no other
  pulse before or after it, neither fading nor combining with other waves as usual.
scope: 'Another name for a soliton: a single wave pulse that holds its shape, not an ordinary water wave.'
examples:
- A solitary wave can cross a long channel without changing shape.
- Physicists study solitary waves in optical fibres.
