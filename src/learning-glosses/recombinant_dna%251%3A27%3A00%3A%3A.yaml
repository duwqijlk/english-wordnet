senseId: 'recombinant_dna%1:27:00::'
synsetId: 14855649-n
simpleMeaning: Gene material made by gene work, joining bits of gene material from different living things.
scope: Also called recombinant deoxyribonucleic acid; gene material made by gene work from bits of different
  living things, not natural gene material unchanged and not a single living thing's own gene material.
examples:
- Recombinant DNA lets scientists move a gene from one living thing to another.
- The lab made recombinant DNA by joining bits from two kinds of bacteria.
