senseId: 'inverse%3:00:00::'
synsetId: 00773049-a
simpleMeaning: This word says that a thing is the opposite of another in its kind or its effect, or that
  two amounts are linked the opposite way round
scope: This describes something that is opposite in its link to another amount, not the noun for a thing
  that has been turned the other way round.
examples:
- 'There is an inverse link between price and demand: when one rises, the other falls.'
- The two amounts move in an inverse way, one growing as the other gets smaller.
