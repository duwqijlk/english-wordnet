  with wavy lines, a tree at times put in the group Dacrydium.
scope: This tree of Tasmania is at times put in the group Dacrydium.
examples:
- They cut huon pine for shipbuilding.
- Carvers prize huon pine for its sweet-smelling yellow wood.
