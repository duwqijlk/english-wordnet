simpleMeaning: The taking up of oxygen by a chemical, which loses electrons as it does so, always coming
  with reduction, the taking up of electrons by something else.
scope: This taking up of oxygen by a chemical is also called oxidation and oxidization.
examples:
- During oxidisation, a chemical takes up oxygen and loses electrons.
- In oxidisation, a chemical loses electrons as it takes up oxygen.
