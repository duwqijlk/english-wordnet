simpleMeaning: of theories and the like, not able to be defended with good reasons or shown to be right
scope: 'Also called indefensible: used of ideas and the like that cannot be shown right with good reasons,
  not of a house or place that cannot be lived in or held.'
examples:
- His theory became untenable after the new facts came out.
- That excuse is untenable because it does not fit the facts.
