simpleMeaning: How living things came to be over time shapes how they are related, and facts about cells
  and body chemistry help work that out.
scope: Also called biosystematy, this is the use of facts to judge how living things are related through
  their past.
examples:
- Biosystematics uses facts about cells to work out how two kinds of plant are related.
- In biosystematics, body chemistry helps show how living things came to be related over time.
