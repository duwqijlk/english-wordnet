simpleMeaning: A policy of not taking sides in the affairs between nations
scope: This is a policy of not taking sides between nations; not a policy of peace at any cost and not
  the act of staying out of one fight.
examples:
- Neutralism kept the small nation out of the war.
- The leader chose neutralism over joining either side.
