simpleMeaning: a busy hard-bodied insect that as a rule hunts other creatures or feeds on dead things
scope: A busy insect that hunts or feeds on dead things, not a slow plant-eating beetle and not a fly.
examples:
- A rove beetle darted across the path under the leaves.
- We found a rove beetle hunting tiny insects in the compost.
