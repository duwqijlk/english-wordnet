simpleMeaning: An extinct animal with one pair of side openings in the skull, behind the temples.
scope: This is an extinct animal with one pair of side openings in the skull, also called synapsid, and
  not a dinosaur or a lizard.
examples:
- The synapsid reptile lived long before the dinosaurs.
- A synapsid reptile skull shows one pair of side openings.
