simpleMeaning: Staying away from a thing on purpose, so that it does not happen or does not reach you
scope: This is staying away from a thing on purpose, not failing to do an unpleasant thing you are meant
  to do and not a clever answer that slips past a question.
examples:
- Dodging the rain, she took the covered walkway.
- Dodging the crowds, he took the back streets.
