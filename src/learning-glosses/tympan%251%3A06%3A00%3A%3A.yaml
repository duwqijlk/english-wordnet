simpleMeaning: Usually a hollow round tube with a thin skin pulled tight over each end, struck to sound
  a beat in music.
scope: Also called a drum and a membranophone, this hollow round tube has a thin skin over each end and
  is struck to sound a beat.
examples:
- He struck the tympan to sound a beat.
- The tympan has a thin skin over each end.
