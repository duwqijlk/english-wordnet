simpleMeaning: Players bet on which small space a ball will stop in, as a flat round board with such spaces
  spins round lying flat for a game of chance.
scope: 'Also called a wheel: the flat round board with small spaces that spins in roulette, on which players
  bet where the ball will stop.'
examples:
- The roulette wheel spun round, and the ball stopped in one of the small spaces.
- He bet on the small space where he thought the ball would stop on the roulette wheel.
