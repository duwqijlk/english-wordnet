simpleMeaning: to think in a deep, careful way about life, truth, and what is right and wrong
scope: Also called philosophise. This is deep thinking about life, truth and right and wrong, not quick
  thinking about an everyday problem.
examples:
- He liked to philosophize about why people are here.
- They sat by the fire philosophizing about life and death.
