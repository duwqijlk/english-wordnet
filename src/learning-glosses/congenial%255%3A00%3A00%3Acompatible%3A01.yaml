senseId: congenial%5:00:00:compatible:01
synsetId: 00509701-s
simpleMeaning: For plants, able to breed with another kind of plant or to be joined to another plant so
  they grow as one
scope: For plants, this means able to breed with or be joined to another plant; it is not about a person
  being friendly or a place being pleasant.
examples:
- The two plants are congenial, so pollen from one can make seeds on the other.
- Because the trees are congenial, the grower could graft a branch of one onto the other.
