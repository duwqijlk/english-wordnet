simpleMeaning: a person whose job is to perform steps and moves to music in front of people
scope: This is a person whose job is to perform steps and moves to music in front of people; not a person
  who takes part in a social gathering arranged for dancing, such as a ball.
examples:
- The dancer practised for hours before the show.
- She works as a dancer in a theatre company.
