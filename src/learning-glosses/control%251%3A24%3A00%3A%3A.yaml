senseId: 'control%1:24:00::'
synsetId: 13849418-n
simpleMeaning: A situation in which one person, group, or thing limits what another can do.
scope: This is the limiting relationship between two parties, not the act of directing people or things.
examples:
- Their relationship was one of control, with one side limiting what the other could do.
- The old contract kept the workers under the control of the owners.
