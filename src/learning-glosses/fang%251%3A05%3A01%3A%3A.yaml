simpleMeaning: a long pointed tooth of an animal that eats meat, used to hold and tear the animals it
  hunts for food
scope: This is the tooth of an animal that eats meat, not a snake's poison tooth and not an insect's poison
  part.
examples:
- The wolf showed its fangs before it bit into the meat.
- A dog's fang can hold and tear food.
