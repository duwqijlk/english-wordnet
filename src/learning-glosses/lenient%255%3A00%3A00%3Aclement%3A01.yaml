simpleMeaning: kind and forgiving, and willing to accept what other people do
scope: Kind and forgiving toward people; not the sense of being easy about rules and letting people do
  as they wish.
examples:
- The judge was lenient and let the young man go with a warning.
- Our teacher is lenient and does not get angry when we hand work in late.
