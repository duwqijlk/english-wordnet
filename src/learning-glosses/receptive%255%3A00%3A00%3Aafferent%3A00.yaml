simpleMeaning: 'of a nerve thread or a signal in a nerve: starting outside and going toward the brain
  and the main nerve cord in the back'
scope: Also called sensory and centripetal, this describes a nerve or a signal going toward the center,
  not being able to soak up liquid and not being open to new ideas.
examples:
- Receptive nerve fibers carry signals from the skin toward the brain.
- The receptive impulse travels from the hand toward the brain and the cord in the back.
