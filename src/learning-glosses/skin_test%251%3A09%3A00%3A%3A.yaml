simpleMeaning: a check that puts a tiny amount of a thing on or under the body surface to see if a person
  reacts to it or is safe from a disease
scope: A check that puts a tiny amount of a thing on or under the body surface to test for a reaction
  or safety from a disease; not a blood test and not a treatment.
examples:
- The nurse gave him a skin test to check for the allergy.
- A skin test showed she was safe from the disease.
