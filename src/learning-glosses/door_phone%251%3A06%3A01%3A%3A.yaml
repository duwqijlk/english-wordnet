simpleMeaning: a way for people at the street and at home to talk to each other, made of parts that run
  on power, in houses, flats or villas
scope: A way for people at the street and at home to talk to each other, also called a door bell phone,
  and not a plain bell or a telephone for calls outside the house.
examples:
- She pressed the door phone to ask who was at the gate.
- The door phone in our block lets visitors talk to us before we open the door.
