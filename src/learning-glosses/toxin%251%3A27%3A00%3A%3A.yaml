senseId: 'toxin%1:27:00::'
synsetId: 15058641-n
simpleMeaning: A poison made while living things grow and change food into energy, such as some germs
  and some higher plants and animals.
scope: A poison made inside living things as they grow; not a poison made in a factory, and not a poison
  from the ground.
examples:
- The toxin in the plant can make people ill.
- Scientists studied the toxin made by the germs.
