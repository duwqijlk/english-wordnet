simpleMeaning: to keep something from being seen or understood, by covering it up or making it unclear
scope: This is about making something hard to see through or to decipher, as with a coded message, not
  the everyday sense of putting an object out of sight or the noun for an animal's skin.
examples:
- A thin coat of paint hid the words scratched into the wall.
- The cipher hid the message's meaning from anyone without the key.
