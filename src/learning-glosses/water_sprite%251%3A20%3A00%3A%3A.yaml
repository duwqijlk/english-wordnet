simpleMeaning: a fern that grows in the wet in the warm lands of the Americas, often kept in fish tanks
scope: 'Also called floating fern: a fern that grows in water, not a fairy or spirit and not a plant that
  grows on dry land.'
examples:
- The water sprite spread its green fronds across the surface of the tank.
- He planted a water sprite in the aquarium to give the fish shade.
