simpleMeaning: One of a set of chemical elements that are often bright solids, carry heat or power, and
  can be made into sheets
scope: Also called a metal; a kind of matter that is bright, hard and carries heat or power, not a gas
  and not a soft plant matter.
examples:
- Iron is a metallic element that can be beaten into sheets.
- A metallic element often looks bright and carries heat well.
