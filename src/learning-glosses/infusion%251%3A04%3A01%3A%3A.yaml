simpleMeaning: the act of adding something new that changes a person, group, or thing in some way
scope: This is adding a new, changing part to something, not the act of soaking a plant to get parts out
  of it, not the liquid made that way, and not putting a liquid into a vein as medicine.
examples:
- The team got a fresh infusion of new players this year.
- An infusion of new ideas helped the old company grow again.
