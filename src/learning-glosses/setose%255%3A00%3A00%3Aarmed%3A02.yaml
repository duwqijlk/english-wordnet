simpleMeaning: Barbs, quills, spines, thorns, or stiff hairs — and the like — stand out from its surface
  to guard it.
scope: Prickly, bristled, barbed, thorny, bristly, spiny, burred, barbellate, briary, briery, burry and
  setaceous are other names for it.
examples:
- The setose leaves felt rough to the touch.
- The setose stem was thick with sharp hairs.
