simpleMeaning: a unit for how loud a sound is, worked out on a log scale; it is the same as ten units
  each one tenth of this unit
scope: This is the unit for how loud a sound is, not the tiny germ, the metal, the vitamin, or the 2nd
  letter, and it is also called Bel.
examples:
- The sound rose by 1 B.
- B is ten times the smaller unit.
