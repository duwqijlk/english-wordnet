simpleMeaning: Small centres of atoms join to form a heavier centre, and at the same time energy is set
  free
scope: This is the joining of the centres of atoms, also called fusion and nuclear fusion reaction; not
  the splitting of such a centre, which is fission.
examples:
- Nuclear fusion powers the sun.
- Scientists hope nuclear fusion will one day give us clean energy.
