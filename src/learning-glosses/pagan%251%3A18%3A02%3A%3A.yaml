simpleMeaning: a person who does things because he or she wants pleasures of the body
scope: A person who does things because he or she wants pleasures of the body, not a person who follows
  an old religion with many gods, and not the sense that means not believing in the God of Christians,
  Jews and Muslims.
examples:
- They called him a pagan because he lived only for food, drink and sex.
- In the old story, the pagan cared only for pleasures of the body.
