synsetId: 01200148-n
simpleMeaning: A court looks again at what a government official, a public body, or another person or
  body given legal power has done, or at a lower court's ruling
scope: A court looking again at what a government official, a public body, another person or body given
  legal power, or a lower court has done; not a fresh trial and not a court looking at its own work.
examples:
- The judicial review asked whether the minister had acted within the law.
- A judicial review of the trial court's ruling is under way.
