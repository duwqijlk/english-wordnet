simpleMeaning: an American bird with a fine song, whose males have a patch of bright red on the head
scope: 'Also called a ruby-crowned wren: an American bird with a fine song whose males have a bright red
  patch on the head, not a gold-crowned kinglet and not a sparrow.'
examples:
- A ruby-crowned kinglet sang from the pine all morning.
- We saw the ruby-crowned kinglet flash its red crown patch.
