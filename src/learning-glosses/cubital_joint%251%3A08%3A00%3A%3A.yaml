simpleMeaning: The bend where the lower arm meets the upper arm, and the same bend in the front leg of
  a four-legged animal.
scope: Also called elbow, cubitus, elbow joint, human elbow, and articulatio cubiti; the bend of the arm,
  not the bend of the leg and not the wrist.
examples:
- He hurt his cubital joint when he fell on his elbow.
- The cubital joint bends when you lift your arm.
