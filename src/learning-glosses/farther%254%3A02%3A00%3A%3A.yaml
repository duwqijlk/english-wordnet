simpleMeaning: more distant in space or time; for this meaning, 'further' is used less often
scope: Also called further. This is about real distance in space or time, not about degree or a more advanced
  stage.
examples:
- We walked farther down the road before we stopped to rest.
- The village is farther north than we thought.
