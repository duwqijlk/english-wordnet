simpleMeaning: a night animal of the lemur kind, with long bony fingers and front teeth like those of
  a rat
scope: A night animal of the lemur kind with long bony fingers and rat-like front teeth, not a rat and
  not a monkey.
examples:
- The aye-aye moves about at night, tapping trees with its long bony fingers.
- The aye-aye's long bony fingers help it grip branches in the dark.
