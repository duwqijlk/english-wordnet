simpleMeaning: In law, a court ruling given before a verdict, when no facts are in dispute and a side
  must win as a matter of law.
scope: This is a court ruling given before a verdict, when no facts are in dispute; judgment on the pleadings,
  summary judgement and summary judgment are other names for it, not a ruling given because the other
  side failed to come to court.
examples:
- The judge issued a judgement on the pleadings because no facts were in dispute.
- With no facts in dispute, she asked for a judgement on the pleadings.
