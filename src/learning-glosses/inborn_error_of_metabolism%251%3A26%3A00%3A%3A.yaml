simpleMeaning: A fault passed down in the family makes the way the body uses food go wrong in any of several
  illnesses, most often a missing or weak helper chemical.
scope: This is any of several illnesses from a fault passed down in the family, not one caught from another
  person, that makes the way the body uses food go wrong.
examples:
- The baby was born with an inborn error of metabolism.
- She lives with an inborn error of metabolism.
