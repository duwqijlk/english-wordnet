simpleMeaning: Since no one can be sure, this teaching in philosophy says what is likely is enough to
  believe and to act on.
scope: This teaching in philosophy says we may act on what is likely, not the Roman Catholic teaching
  about following any solidly probable opinion when experts disagree.
examples:
- They turned to probabilism when no sure answer could be found.
- Under probabilism, a likely answer is enough to act on.
