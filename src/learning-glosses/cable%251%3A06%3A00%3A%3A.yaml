simpleMeaning: a thick, very strong rope made by twisting together steel wire or hemp, a strong plant
  fibre
scope: This is the thick rope itself, not a wire that carries power or signals and not a television system
  that sends programmes by wire.
examples:
- A thick steel cable held the boat safely to the dock.
- Workers lifted the heavy beam with a strong cable.
