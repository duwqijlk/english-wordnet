senseId: 'fiber_optic_microphone%1:06:01::'
synsetId: 92449236-n
simpleMeaning: A microphone that turns sound into an electrical signal by detecting changes in light,
  rather than changes in stored electric charge or magnetic fields, as standard microphones do.
scope: This is the light-sensing microphone itself, not an ordinary microphone that responds to electric
  or magnetic changes, and not the optical fiber it uses.
examples:
- A fiber optic microphone can pick up infrasound that ordinary microphones miss.
- The studio chose a fiber optic microphone because electrical interference spoiled other recordings.
