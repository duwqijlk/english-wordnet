simpleMeaning: being friendly to people of lower rank for a time, and not letting the difference in rank
  matter
scope: Also called condescendingness. This is friendly behaviour from a person of high rank who sets rank
  aside for a time, not proud behaviour that looks down on others and not a rude message.
examples:
- The queen showed condescension when she talked warmly with the servants and treated them as equals for
  the visit.
- His condescension put the young workers at ease because he spoke to them as friends, not as a boss.
