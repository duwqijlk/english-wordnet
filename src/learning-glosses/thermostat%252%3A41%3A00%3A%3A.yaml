simpleMeaning: to control how hot or cold a place is by using a device that turns the heat on and off
  by itself
scope: Doing the controlling with such a device; not the device itself that turns the heat on and off
  to keep a set heat.
examples:
- They thermostat their home at twenty degrees all winter.
- The new system can thermostat each room on its own.
