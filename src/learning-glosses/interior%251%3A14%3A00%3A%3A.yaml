simpleMeaning: The United States federal department that looks after the care and growth of natural resources,
  set up in 1849.
scope: The federal department for natural resources, not the department for transport and not a state
  office; also called DoI, the Department of the Interior, and the Interior Department.
examples:
- The Interior looks after national parks.
- Interior was set up in 1849.
