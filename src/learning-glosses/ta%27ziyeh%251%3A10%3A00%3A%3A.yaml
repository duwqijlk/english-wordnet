simpleMeaning: In Islam, an Iranian song play that gives stage form to deep religious feeling; it tells
  of the Battle of Kerbala and is put on each year in Farsi.
scope: One of the Iranian musical plays of Islam, set apart by its Kerbala story and its yearly showing
  in Farsi.
examples:
- The Ta'ziyeh was performed in the town square during the holy month.
- Actors in the Ta'ziyeh sang the story of Kerbala.
