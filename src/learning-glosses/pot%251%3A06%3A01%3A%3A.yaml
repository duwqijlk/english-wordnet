simpleMeaning: A thing fixed to a building's water pipes; people use it to pass urine and solid waste
  from the body
scope: Also called can, throne, and toilet, this is the thing fixed to water pipes that people use to
  pass waste; it is not the cooking container and not the small electric part in a radio or TV set.
examples:
- He sat on the pot in the small bathroom.
- The plumber came to fix the pot in the bathroom.
