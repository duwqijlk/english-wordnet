simpleMeaning: For a short time, this drug eases the nose troubles of a cold, of a swollen nose lining,
  and of infections higher up in the breathing tubes.
scope: This drug eases nose troubles for a short time, whether they come from a cold, a swollen nose lining,
  or infections higher up in the breathing tubes.
examples:
- She used a nasal decongestant for her blocked nose.
- A nasal decongestant helped him breathe through his nose again.
