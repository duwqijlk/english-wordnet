synsetId: 01003512-v
simpleMeaning: To put words first, often to make clear what comes next.
scope: To put words first, often to explain what follows, not a claim taken as true and not giving a talk
  a preface.
examples:
- He premised his remarks with a short note about his sources.
- She premised the report so that readers might follow it.
