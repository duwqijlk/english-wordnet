simpleMeaning: A person who turns away from the ways most people live, and speaks up for very free ideas
  about politics and the way to live.
scope: A person who turns away from the ways most people live and speaks up for very free ideas, also
  called a hippie, a hippy, or a hipster; not a person who follows the usual ways and not a political
  leader.
examples:
- The flower child wore bright clothes and spoke of peace.
- Flower children in the 1960s turned away from the ways of their parents.
