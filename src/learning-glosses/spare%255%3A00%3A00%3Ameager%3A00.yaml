simpleMeaning: small in amount or size, with only a little of something there
scope: 'Also called bare: small in amount or size, not an extra wheel for a car, not a score in tenpins,
  and not plain with nothing added for looks.'
examples:
- They lived on a spare diet of rice and beans.
- The spare harvest left the family with little food for winter.
