simpleMeaning: to say what you think is probably true, even though you know you may be wrong
scope: This is not about estimating an amount or time; it is about offering an opinion or answer that
  others may question.
examples:
- I guess she's still at work, but I'm not sure.
- '''Why did he go?'' ''I''d guess he was tired.'''
