senseId: 'receive%2:31:08::'
synsetId: 00618785-v
simpleMeaning: To be considered either good or bad by others.
scope: This is how people judge something, with approval or disapproval; it is not accepting an idea as
  true, not going through an experience, and not being given a particular kind of treatment.
examples:
- Her first novel was received coldly by the reviewers.
- The proposal was received with loud applause.
