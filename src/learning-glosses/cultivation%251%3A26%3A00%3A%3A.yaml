simpleMeaning: a state that has grown to a very high level, with a quality that has no faults at all
scope: This sense is a state of being perfect, with no faults; it is also called finish, culture, polish,
  and refinement, and it is not growing crops or learning manners.
examples:
- Her singing had a cultivation that left no note out of place.
- The cultivation in his prose made each page feel complete and perfect.
