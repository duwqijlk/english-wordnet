simpleMeaning: the body's salt-like minerals are lost in an unhealthy way, and this loss hits the bones
  most of all
scope: This is the body's salt-like minerals being lost in an unhealthy way, with the bones hit most of
  all; demineralisation is another name for this sense, not minerals taken out of water and not a loss
  of body weight.
examples:
- Demineralization left her bones thin after years of poor diet.
- The scan showed demineralization in his hips and spine.
