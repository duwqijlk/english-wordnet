simpleMeaning: The soft inner mass of a fungus such as a puffball or a stinkhorn, which makes spores,
  the tiny bits from which new fungi grow.
scope: This is the soft spore-making part inside a fungus such as a puffball or a stinkhorn.
examples:
- The gleba held the spores of the puffball.
- We cut open the puffball and saw the gleba inside.
