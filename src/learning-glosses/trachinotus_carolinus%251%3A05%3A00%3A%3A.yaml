simpleMeaning: A fish found in the sea along the coast from New England to Brazil, but not in the clear
  waters of the West Indies
scope: A fish of coastal waters from New England to Brazil, also called a Florida pompano; not a fish
  of the clear waters of the West Indies and not a fish of the open ocean far from shore.
examples:
- Trachinotus carolinus swims in the warm coastal waters off Florida.
- Anglers catch Trachinotus carolinus along the beaches of Brazil.
