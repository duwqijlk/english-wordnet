simpleMeaning: a plant gum with a nice smell, burned to give off scent and used to make perfume
scope: This is a scented plant gum burned for its smell, not the leafy herb used in food; myrrh and gum
  myrrh are other names for this sense.
examples:
- The priest burned sweet cicely during the ceremony.
- Sweet cicely gives the perfume its sweet scent.
