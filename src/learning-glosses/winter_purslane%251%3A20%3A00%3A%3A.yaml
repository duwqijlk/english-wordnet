simpleMeaning: Sometimes grown to eat raw in salads or cooked in a pot, this juicy herb grows on sand
  hills and bare ground along the Pacific coast of North America.
scope: Also called miner's lettuce, this juicy herb of the Pacific coast grows on sand hills and bare
  ground and is the one people sometimes eat raw in salads or cook in a pot.
examples:
- We picked winter purslane from the dunes for a salad.
- Winter purslane grows on bare ground along the Pacific coast.
