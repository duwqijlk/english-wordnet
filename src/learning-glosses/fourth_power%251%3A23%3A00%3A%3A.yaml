simpleMeaning: In maths, an equation or a rule in which a number is multiplied by itself three more times
scope: This is a number times by itself four times in all, not just times by itself once (the square)
  or twice (the cube).
examples:
- The fourth power of 2 is 16.
- She worked out the fourth power of 3 on paper.
