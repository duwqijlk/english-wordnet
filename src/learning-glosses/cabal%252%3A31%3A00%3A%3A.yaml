simpleMeaning: To take part in secret plotting with others, and swear together to do what is plotted.
scope: To plot together in secret and swear to do it, also called conspire, conjure, or complot; not the
  noun, the plot itself or the secret group.
examples:
- The ministers caballed against the king.
- They cabal in secret to bring the leader down.
