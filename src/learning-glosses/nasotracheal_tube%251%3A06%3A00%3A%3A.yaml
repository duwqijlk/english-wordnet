simpleMeaning: Oxygen reaches the body through a hollow pipe put into the windpipe through the nose and
  throat.
scope: This hollow pipe is put into the windpipe through the nose and throat to bring oxygen to the body,
  not one put in through the mouth.
examples:
- The nasotracheal tube brought oxygen through the nose and throat into the windpipe.
- A nasotracheal tube passes through the nose and throat into the windpipe.
