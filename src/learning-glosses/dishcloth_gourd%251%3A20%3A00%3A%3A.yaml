simpleMeaning: Any of several tropical vines that last one season and bear big yellow flowers and edible
  young fruit; the dried fibres inside the ripe fruit are sold as sponges.
scope: Another name for the tropical vine also called luffa, rag gourd or sponge gourd; not the dried
  sponge sold from its fruit.
examples:
- Dishcloth gourd vines are grown for the sponges inside their ripe fruit.
- Young dishcloth gourd fruit can be eaten as a vegetable.
