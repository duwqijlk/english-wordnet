simpleMeaning: In the study of measuring the earth from space, a way of working out land-measuring problems
  from angle sightings of man-made craft circling the earth
scope: A way of solving land-measuring problems from sightings of man-made craft in orbit, not a way of
  measuring land with ground tools alone.
examples:
- Satellite triangulation helps map makers fix the shape of a coastline.
- Surveyors used satellite triangulation to place the new road.
