simpleMeaning: a rough, unpleasant sound made when one thing is rubbed or pulled across another
scope: 'Also called scratch: this is the sound itself, not a hurt place where skin is torn off, and not
  the act of making something by rubbing.'
examples:
- The scrape of the chair on the floor made her cover her ears.
- I heard the scrape of a key in the lock.
