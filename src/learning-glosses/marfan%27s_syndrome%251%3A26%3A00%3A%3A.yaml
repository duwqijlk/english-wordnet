simpleMeaning: A sickness passed down from one parent that makes bones grow too long, most of all in arms,
  legs, fingers and toes, and harms the eyes and the blood system.
scope: A sickness passed down from one parent that makes bones grow too long and harms the eyes and blood
  system, not other inherited sicknesses of the bones.
examples:
- Marfan's syndrome made his arms and fingers grow very long.
- She lived with Marfan's syndrome and its harm to her eyes.
