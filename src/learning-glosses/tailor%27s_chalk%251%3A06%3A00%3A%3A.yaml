simpleMeaning: a soft white stick used by people who make clothes to draw marks on cloth that wash out
scope: This is a soft white stick for marking cloth that washes out; not the chalk used on a blackboard
  and not a pen that leaves a lasting mark.
examples:
- She drew a line with tailor's chalk before she cut the cloth.
- The tailor's chalk left a pale mark that washed out.
