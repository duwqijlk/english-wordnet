simpleMeaning: A group of people kept apart from others by the place in society they get at birth from
  their family, by their job, or by their money
scope: This is a general group of people in society, kept apart by the place in society they get at birth
  from their family, by job, or by money; not the Hindu group a person is born into and not a group of
  insects.
examples:
- In the old system, each caste had its own work and place in society.
- People from a lower caste were kept apart from those above them.
