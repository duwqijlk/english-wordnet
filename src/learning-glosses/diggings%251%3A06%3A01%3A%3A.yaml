simpleMeaning: a hole cut into the ground to get rock with metal in it or valuable stones, or to study
  old things from the past
scope: 'Also called digs: this is a hole cut into the ground to get rock with metal in it or valuable
  stones, or to study old things from the past; it is not a place where people live.'
examples:
- The old diggings near the river once gave gold to many men.
- They found old tools at the diggings and sent them to a museum.
