simpleMeaning: a device that lets two or more streams of facts share one path for sending them
scope: A device that lets two or more sources share one sending path, not a single line for one source
  and not a switch that picks one source.
examples:
- The data multiplexer lets two computers share one line.
- A data multiplexer sends facts from many sources down one path.
