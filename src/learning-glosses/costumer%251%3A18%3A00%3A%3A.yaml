simpleMeaning: someone who makes the plans for the clothes actors wear in a play or at a masquerade ball,
  or who hands those clothes out
scope: Someone who plans or gives out the clothes worn on stage or at a fancy-dress party, not a person
  who sews them and not a person who acts in the play; costume designer and costumier are other names
  for this sense.
examples:
- The costumer fitted the actors with their new outfits.
- He has worked as a costumer at the theatre for ten years.
