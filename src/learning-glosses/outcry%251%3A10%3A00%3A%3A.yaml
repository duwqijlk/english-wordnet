simpleMeaning: a loud shout or cry, often made to show that people do not agree with something or are
  against it
scope: 'Also called call, cry, shout and yell: a loud shout, often against something; not the verb sense
  of saying words out loud with surprise, fear or joy.'
examples:
- There was a loud outcry when the price of bread rose.
- The plan caused an outcry from workers who would lose their jobs.
