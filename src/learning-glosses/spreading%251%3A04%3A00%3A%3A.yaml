simpleMeaning: The act of growing wider or longer, over more space or more time
scope: 'Also called spread: the act of making a thing cover more space or last more time, not the finished
  spread-out state of a thing.'
examples:
- The spreading of the fire took only minutes.
- The spreading of the rumour went on for days.
