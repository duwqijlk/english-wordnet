simpleMeaning: following a person's family line through either the father's side or the mother's side
  only
scope: This describes a family line that goes through one parent's side only, not an action or choice
  that one side makes on its own.
examples:
- In a unilateral system, children belong to their mother's family line.
- They trace descent in a unilateral way, through the father only.
