simpleMeaning: A way to stop a pregnancy in which sex is started but the man pulls out before he lets
  go of his seed
scope: 'Also called withdrawal, onanism, coitus interruptus and pulling out: a way to stop a pregnancy
  by pulling out, not a pill and not a device put in the body.'
examples:
- They used the withdrawal method for years.
- The withdrawal method fails more often than the pill.
