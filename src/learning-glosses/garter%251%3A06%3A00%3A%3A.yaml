simpleMeaning: a band, usually made of material that stretches, worn round the leg to hold up a stocking,
  or round the arm to hold up a sleeve
scope: 'Also called supporter: a stretchy band worn round the leg for a stocking or round the arm for
  a sleeve, not the act of tying something in place with such a band.'
examples:
- Her garter held her stocking up all day.
- He wore a garter on his arm to keep his sleeve in place.
