simpleMeaning: in a brave, strong way that people think is right for a man
scope: 'Also called manly: done in a brave, strong way people think fits a man, not in a weak or fearful
  way.'
examples:
- He manfully carried the heavy bags for his mother without a word of complaint.
- She manfully faced the hard news and kept helping her family.
