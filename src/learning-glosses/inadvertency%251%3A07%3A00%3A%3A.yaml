senseId: 'inadvertency%1:07:00::'
synsetId: 04672900-n
simpleMeaning: Forgetting what you must do, or paying no heed to it, is a fixed part of how a person acts
scope: This is the trait of forgetting or ignoring your duties; heedlessness and inadvertence are other
  names for this sense, not a single careless mistake.
examples:
- His inadvertency showed in the way he ignored every reminder.
- The report blamed her inadvertency for the missed payments.
