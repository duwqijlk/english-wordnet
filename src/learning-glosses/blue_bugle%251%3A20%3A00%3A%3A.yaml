simpleMeaning: Bright sky-coloured flowers grow on this plant of southern Europe, which stands straight
  up, comes back year after year, and spreads sideways underground by its roots.
scope: Also called erect bugle, this is a plant of southern Europe with bright sky-coloured flowers, standing
  straight up and coming back year after year.
examples:
- A blue bugle stood tall, its bright sky-coloured flowers open.
- The blue bugle came back year after year.
