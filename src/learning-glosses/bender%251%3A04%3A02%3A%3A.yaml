simpleMeaning: In baseball, a throw of the ball with spin so the ball curves in the air as it gets near
  the person with the bat
scope: This baseball throw is also called a curve, a breaking ball, and a curve ball, not a tool for bending
  metal and not a long time of drinking.
examples:
- The pitcher threw a bender that curved away at the last moment.
- He missed the bender because it moved sideways as it reached him.
