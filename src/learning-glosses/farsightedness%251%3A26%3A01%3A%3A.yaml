simpleMeaning: A lessened power to fix on near things, brought on by loss of spring in the eye's lens
  after age 45.
scope: A lessened power to fix on near things, brought on by loss of spring in the eye's lens after age
  45; not a wrong state where sight for far things is better than for near things.
examples:
- Their farsightedness blurred the book.
- The farsightedness was plain in the test.
