simpleMeaning: seeds with a strong, pleasant smell, used to give flavor to food like cinnamon and cloves
  do, especially in pickles and barbecue sauces
scope: These are the seeds used to give flavor to food, also called cardamon and cardamum; they are not
  the plant from India that the seeds grow on.
examples:
- She added cardamom to the sauce to give it more flavor.
- A little cardamom in the pickles gives them a strong, pleasant smell.
