simpleMeaning: a drug that works on the mind and tends to make a person feel very happy and full of joy
scope: A drug that works on the mind and tends to lift the mood, not a drug that puts a person to sleep
  and not a drug that takes pain away.
examples:
- The doctor warned that the euphoriant could lift his mood too far.
- She felt light and glad after taking the euphoriant.
