simpleMeaning: Recent things are forgotten while older memories stay whole in this failing of the mind,
  seen in the last stages of long heavy drinking.
scope: 'Also called alcoholic dementia or polyneuritic psychosis: a failing of the mind in the last stages
  of long heavy drinking, in which recent things are forgotten while older memories stay whole, not a
  failing that takes all memory.'
examples:
- Alcohol amnestic disorder left him unable to recall recent events.
- In alcohol amnestic disorder, older memories stay whole while recent things are forgotten.
