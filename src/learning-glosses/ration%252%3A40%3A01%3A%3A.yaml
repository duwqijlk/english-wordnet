simpleMeaning: to limit how much people may use of a thing that is hard to get, as in war
scope: Limiting how much of a scarce thing people may use, not giving out fixed shares and not handing
  things out in shares.
examples:
- The town rationed water during the long dry summer.
- During the war, the government rationed sugar and butter.
