simpleMeaning: the best or most important part of an idea or an experience
scope: 'Also called heart, center, core, centre, meat, sum, essence and marrow: the part of an idea or
  experience that matters most. It is not the solid stuff that a thing is made of.'
examples:
- The substance of his argument was that the plan would cost too much.
- I understood the substance of her speech, even if I missed some words.
