simpleMeaning: In golf, a shot that curls off to the right for a player who hits right-handed.
scope: In golf, a right-bending shot, not the verb for growing faint nor the noun for a slow disappearance;
  slice and slicing are other names for it.
examples:
- His drive had a slight fade that carried it to the right edge of the fairway.
- She plays a fade when the dogleg demands it.
