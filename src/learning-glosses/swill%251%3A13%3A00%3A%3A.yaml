simpleMeaning: wet food, especially for pigs, made mostly of bits of food left from the kitchen mixed
  with water or skimmed or sour milk
scope: Wet pig food, also called slop, slops, pigswill and pigwash; not the verb sense of drinking a lot.
examples:
- He poured the swill into the pigs' food box.
- The farmer mixed kitchen scraps to make swill for the pigs.
