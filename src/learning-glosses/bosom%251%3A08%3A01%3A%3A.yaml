simpleMeaning: A person's chest, or the breast on it
scope: A person's chest, not the soft milk-making organs of a woman, not the cloth that covers it, not
  a warm loving welcome, and not hiding a thing close to the body.
examples:
- She pressed the child to her bosom.
- He clasped the letter to his bosom.
