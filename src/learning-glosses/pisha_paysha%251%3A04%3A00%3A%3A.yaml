simpleMeaning: Two players, one usually a child, draw by turns to build up or down from the open card
  of a face-down pack; fewest left at the end wins.
scope: This Yiddish game for two players, one usually a child, is won by the player left with the fewest
  cards.
examples:
- We played pisha paysha, and the younger player won.
- She drew from the pack in pisha paysha and built up from the open card.
