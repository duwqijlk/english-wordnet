simpleMeaning: the state of a change that takes place with no heat gained or lost, so the measure of disorder
  stays the same when the change is slow and steady
scope: A change with no heat gained or lost and no change in disorder, not a change that gives off heat
  and not a change that takes heat in.
examples:
- The adiabaticity of the slow squeeze meant no heat moved in or out of the gas.
- They checked the adiabaticity of the process to see if its heat stayed the same.
