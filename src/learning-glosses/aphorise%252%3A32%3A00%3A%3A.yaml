simpleMeaning: to speak or write using short, sharp sayings that hold a general truth
scope: 'Also called aphorize: to put thoughts into short, sharp sayings, not to write a long essay and
  not to quote another person.'
examples:
- He liked to aphorise about life in a single line.
- She aphorised her advice into a sentence she could remember.
