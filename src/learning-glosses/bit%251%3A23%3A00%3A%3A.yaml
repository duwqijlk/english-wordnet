simpleMeaning: A basic unit for measuring information; the name is short for binary digit, and it equals
  the information in a system with two states that are equally likely, such as yes or no.
scope: This is not the cutting end of a drill, the end of a key, or the metal piece in a horse's mouth;
  it is a unit for measuring information.
examples:
- A byte is made up of eight bits.
- Each pixel needs one bit to record whether it is black or white.
