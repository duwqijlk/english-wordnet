simpleMeaning: a South American animal related to the camel but smaller and with no hump; it lives wild
  or is kept by people, and it chews its food again after eating
scope: A South American animal like a small camel with no hump, not a camel itself and not a sheep.
examples:
- A llama carried the bags up the mountain path.
- The children fed the llama at the farm.
