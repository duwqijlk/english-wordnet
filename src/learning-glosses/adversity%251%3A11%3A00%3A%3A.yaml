simpleMeaning: a piece of bad luck, or a very bad event that brings great harm
scope: One bad event or piece of bad luck, not a long hard time in a person's life in general.
examples:
- The flood was an adversity that left the village with nothing.
- Losing his job was a new adversity for the family that year.
