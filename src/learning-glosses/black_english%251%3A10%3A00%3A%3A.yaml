simpleMeaning: A form of American speech, not the standard form, spoken in its own way by African Americans
  in the United States.
scope: The form of American speech used by African Americans in the United States, with its own patterns
  and not the standard form; also called AAVE, African American English, African American Vernacular English,
  Black English Vernacular, Black Vernacular, Black Vernacular English and Ebonics.
examples:
- Black English is spoken by many African Americans.
- She grew up speaking Black English at home.
