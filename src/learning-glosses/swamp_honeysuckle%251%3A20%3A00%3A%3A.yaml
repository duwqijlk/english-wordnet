simpleMeaning: A bush that grows in wet land all through the east of the United States, with small white
  to pink flowers like those of another bush.
scope: A bush that grows in wet land all through the east of the United States, with small white to pink
  flowers; also called swamp azalea and white honeysuckle; not a bush of dry land and not a bush with
  red flowers.
examples:
- Swamp honeysuckle blooms in the wet woods in spring.
- The swamp honeysuckle by the pond has small white flowers.
