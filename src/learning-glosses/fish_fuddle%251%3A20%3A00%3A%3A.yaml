simpleMeaning: A small West Indian and Florida tree with large leaves divided into leaflets, clusters
  of red-striped purple to white flowers, curly winged seedpods, and poisons used in fishing.
scope: This is the small Caribbean and Florida tree grown for its curly winged seedpods, not the poison
  made from it or a different plant used to stun fish.
examples:
- Fish fuddle grows on limestone in the Florida Keys.
- Its curly winged seedpods make fish fuddle easy to spot in late summer.
