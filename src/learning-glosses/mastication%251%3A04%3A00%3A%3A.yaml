senseId: 'mastication%1:04:00::'
synsetId: 00279654-n
simpleMeaning: Working food with the teeth, till it can be gulped down.
scope: This sense is also called chew and chewing, for working food with the teeth, till it can be gulped
  down, where chew is the act of biting food in your mouth with your teeth to break it down so it gets
  soft enough to swallow, and chewing is the act of using your teeth to bite and crush food in your mouth
  until it is soft enough to swallow.
examples:
- Mastication works food with the teeth.
- Mastication grinds food till it can be gulped down.
