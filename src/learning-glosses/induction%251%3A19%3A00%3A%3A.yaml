simpleMeaning: An electrical happening in which a force that drives current, called EMF, is made in a
  closed loop when the flow of current changes.
scope: An electrical happening that makes a current-driving force in a closed loop, also called inductance,
  not the drawing out of a kind of behaviour and not reasoning from facts to general rules.
examples:
- Induction lit the lamp without any wire touching it.
- The coil showed induction when the current changed.
