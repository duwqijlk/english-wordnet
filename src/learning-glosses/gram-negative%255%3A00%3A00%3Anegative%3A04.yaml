simpleMeaning: In the study of germs, of a germ that does not keep the violet colour used in a set way
  of staining.
scope: Of a germ that does not keep the violet colour used in a set way of staining, not one that keeps
  it, as in the Gram-positive sense.
examples:
- Gram-negative germs do not keep the violet colour.
- The test showed the germ was Gram-negative, so it did not keep the violet colour.
