senseId: choking%5:00:01:breathless:00
synsetId: 00269249-s
simpleMeaning: making it hard to breathe, especially when there is not enough fresh air and it is hot
scope: Also called suffocating, this describes air or heat that makes it hard to breathe, not a blocked
  throat and not the act of stopping someone's breath by pressing the neck.
examples:
- The choking heat in the small room made everyone gasp for air.
- We opened the windows to clear the choking dust from the house.
