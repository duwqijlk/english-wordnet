senseId: 'stratification%1:04:00::'
synsetId: 01015546-n
simpleMeaning: The act of sorting people into classes or ranks.
scope: The act of sorting people into classes or ranks; not the putting of seeds in damp sand or sawdust
  or peat, to keep them or make them sprout, nor the making or laying down of layers, nor the state of
  being set out in ranks or classes within a group.
examples:
- Their stratification shaped the whole town.
- The stratification was plain to see.
