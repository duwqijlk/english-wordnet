simpleMeaning: With long curving branches and deep green leaves, this very tall tree grows on the Pacific
  coast of north-west America.
scope: Also called a giant fir, a lowland fir, or a lowland white fir, this is the very tall tree of the
  Pacific coast with long curving branches and deep green leaves.
examples:
- The grand fir towered over the other trees on the coast.
- Grand firs grow along the Pacific coast of north-west America.
