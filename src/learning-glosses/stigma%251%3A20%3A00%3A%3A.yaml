simpleMeaning: the tip of the thin stalk in a flower where pollen lands and goes in to reach the seed-making
  part
scope: The tip of the thin stalk in a flower where pollen lands and goes in to reach the seed-making part;
  not a breathing hole in an insect, and not a mark of shame.
examples:
- Bees leave pollen on the stigma of the flower.
- The stigma stood at the top of the style, ready to catch pollen.
