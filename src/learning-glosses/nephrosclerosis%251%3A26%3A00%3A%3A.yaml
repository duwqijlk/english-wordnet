senseId: 'nephrosclerosis%1:26:00::'
synsetId: 14137420-n
simpleMeaning: A kidney disease usually linked to high blood pressure, where hardened renal arterioles
  reduce blood flow and can lead to kidney and heart failure.
scope: Nephroangiosclerosis is another name for this kidney sickness in which hardened small blood tubes
  in the kidney let less blood through, so the kidney and heart can fail, and which most often comes with
  high blood pressure.
examples:
- The small blood tubes in the kidney had hardened in nephrosclerosis.
- High blood pressure most often comes with nephrosclerosis.
