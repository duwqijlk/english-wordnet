simpleMeaning: clay mixed with water to make it thin and wet, used by people who make pots to cover clay
  objects or to make them look nicer
scope: This is thin, wet clay used to cover clay objects or to make them look nicer. It is not a part
  cut from a plant, and not a wrong step that makes you fall.
examples:
- The potter brushed slip over the bowl before it went into the fire.
- She dipped the cup in slip to give it a smooth, dark cover.
