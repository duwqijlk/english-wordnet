simpleMeaning: in a way or to a degree that makes people feel bothered or cross
scope: This says how or how much something bothers people; it does not name a person or thing that bothers
  them.
examples:
- The clock ticked annoyingly all through the night.
- He was annoyingly late again, and we missed the start.
