simpleMeaning: In Judaism, a stand with nine arms for candles, used at the festival of Hanukkah.
scope: In Judaism, a stand with nine arms for candles, used at the festival of Hanukkah; not the seven-armed
  stand used in ceremonies for the seven days of Creation.
examples:
- They lit the menorah on the first night of Hanukkah.
- A brass menorah stood on the windowsill.
