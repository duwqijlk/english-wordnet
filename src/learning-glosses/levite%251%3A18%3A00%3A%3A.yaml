senseId: 'levite%1:18:00::'
synsetId: 10275612-n
simpleMeaning: A member of the Hebrew tribe of Levi, above all of the line that gave male helpers to the
  priests in the temple.
scope: A member of the tribe of Levi who helped the temple priests, not a priest and not a member of another
  tribe.
examples:
- The Levite carried the holy things into the temple.
- A Levite helped the priests with their work each day.
