simpleMeaning: Plain and natural in manner, with no show of being grand or important, and nothing done
  for effect.
scope: Of a country church or a quiet manner, plain and natural, with no show of being grand.
examples:
- The church was unpretentious, a plain stone building with no decoration.
- Her manner was unpretentious, and guests felt at ease at once.
