simpleMeaning: In anatomy, any part of the body that goes around something like a belt or ring
scope: 'Also called zone: in anatomy, a body part shaped like a belt or ring around something. Not a general
  area or a place on a map.'
examples:
- The doctor pointed to a thin zona that went around the cell.
- This zona forms a ring around the centre of the organ.
