simpleMeaning: How often each value of a thing that can change is seen, or would be seen, is set out in
  statistics as this arrangement
scope: Also called distribution, this arrangement in statistics sets out the values of a thing that can
  change and how often each one is seen.
examples:
- I worked out the statistical distribution.
- The statistical distribution showed how often each value was seen.
