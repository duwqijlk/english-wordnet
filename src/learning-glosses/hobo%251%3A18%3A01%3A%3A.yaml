senseId: 'hobo%1:18:01::'
synsetId: 10719072-n
simpleMeaning: a worker who moves from place to place and works in each place for a short time only
scope: This is a worker who travels and works for short times in different places, not a person who travels
  with no home and does not work.
examples:
- During the harvest, a hobo arrived in town looking for short work on the farms.
- The hobo worked in the fields for a few weeks, then moved on to the next town.
