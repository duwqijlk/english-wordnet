simpleMeaning: having a narrow tip at its end
scope: This sense is also called acute or needlelike; it means shaped with a narrow tip, not a blade's
  cutting quality or a dangerously steep slope.
examples:
- The pencil has a sharp point.
- The arrowhead comes to a sharp point.
