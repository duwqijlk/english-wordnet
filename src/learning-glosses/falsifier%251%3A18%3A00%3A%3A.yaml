synsetId: 10096737-n
simpleMeaning: A person who makes a thing look true when it is not.
scope: It is a person who changes a thing so that what is false looks true, while a person who makes an
  honest mistake and a person who copies a thing openly are different kinds of people.
examples:
- The falsifier changed the dates on the letter.
- Police caught the falsifier of the old paintings.
