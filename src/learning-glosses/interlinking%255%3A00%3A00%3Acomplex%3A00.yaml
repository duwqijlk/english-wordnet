simpleMeaning: Things hold tight together, the way the ends of two pieces of wood fit into each other
scope: Joined or locked close together, also called interwoven, interlocking or interlacing; not things
  just laid side by side, and not things tied with string.
examples:
- The interlinking roots held the bank of earth in place.
- The interlinking pieces of the puzzle held the whole picture together.
