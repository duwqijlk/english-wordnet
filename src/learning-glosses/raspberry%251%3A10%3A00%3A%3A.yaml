simpleMeaning: a rude noise people make to show they dislike something or think little of it
scope: This is a rude noise made to show dislike or scorn, and bird, hiss, snort, hoot and boo are other
  names for it, not the red fruit and not a word of praise.
examples:
- The crowd gave a raspberry when the speaker began.
- He blew a raspberry at his brother's silly idea.
