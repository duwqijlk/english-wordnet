simpleMeaning: The rubber tool used for marking takes an even coat of ink from this block, which is soaked
  in ink.
scope: A pad, an inkpad, and an inking pad are other names for this ink-soaked block, from which the rubber
  tool used for marking takes an even coat of ink.
examples:
- The rubber tool took ink from the stamp pad.
- The stamp pad gave the rubber tool an even coat of ink.
