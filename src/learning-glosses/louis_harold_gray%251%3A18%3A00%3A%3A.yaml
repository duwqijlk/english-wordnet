simpleMeaning: An English scientist who studied living things and radiation, after whom the unit that
  measures the energy taken in from radiation was named; he lived from 1905 to 1965.
scope: An English radiobiologist whose name was given to the gray unit, also called Gray, the SI unit
  that measures the energy taken in from radiation.
examples:
- Louis Harold Gray worked on the effects of radiation on living things.
- The unit named for Louis Harold Gray measures energy taken in from radiation.
