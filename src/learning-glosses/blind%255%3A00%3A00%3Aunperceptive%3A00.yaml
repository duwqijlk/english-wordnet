simpleMeaning: failing to grasp or notice something, whether from inability or reluctance
scope: The sense of failing to notice or understand, through inability or choice, not the literal loss
  of eyesight or the sense meaning not based on reason.
examples:
- She was blind to her son's faults.
- He seemed blind to the risks of the plan.
