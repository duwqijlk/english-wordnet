simpleMeaning: With hanging green flower clusters and smooth stems and leaves you can almost see through,
  this is a plant of the group Pilea.
scope: Also called dead nettle and richweed, this is a plant of the group Pilea with hanging green flower
  clusters and smooth stems and leaves you can almost see through, not one with flowers that stand upright.
examples:
- Clearweed grows with hanging green flower clusters and smooth stems.
- The clearweed had stems you could almost see through.
