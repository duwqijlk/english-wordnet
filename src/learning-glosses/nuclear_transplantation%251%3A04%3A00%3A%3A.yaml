senseId: 'nuclear_transplantation%1:04:00::'
synsetId: 00640013-n
simpleMeaning: Moving the nucleus of a cell, with the genes inside it, from one cell into another.
scope: Moving a cell's nucleus and genes into another cell; not moving a whole organ from one body to
  another, and not copying genes without moving the nucleus.
examples:
- Nuclear transplantation lets scientists study how genes control growth.
- The team used nuclear transplantation to move the nucleus into an empty egg cell.
