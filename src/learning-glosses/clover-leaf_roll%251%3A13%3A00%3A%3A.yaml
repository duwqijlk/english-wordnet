simpleMeaning: a dinner bun raised with yeast, made by baking three small balls of dough in each cup of
  a muffin tin
scope: A dinner bun raised with yeast, baked as three small balls of dough in each cup of a muffin tin;
  not a plain single bun, and not a sweet cake.
examples:
- She served clover-leaf rolls with the soup.
- The clover-leaf roll has three round tops.
