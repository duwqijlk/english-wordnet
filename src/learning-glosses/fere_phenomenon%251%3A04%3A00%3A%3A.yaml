synsetId: 00861689-n
simpleMeaning: A change in the skin's power to carry a current under strain or worry, found by measuring
  the skin's hold on a current or weak currents the body makes
scope: Also called GSR, an electrical skin response, an electrodermal response, a galvanic skin response,
  a psychogalvanic response, and a Tarchanoff phenomenon, it is found by measuring the skin's hold on
  a current or the weak currents the body makes.
examples:
- The Fere phenomenon shows up when a speaker grows nervous before a crowd.
- Researchers used the Fere phenomenon to track stress during the test.
