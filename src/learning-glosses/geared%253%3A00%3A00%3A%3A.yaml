simpleMeaning: Having toothed wheels on it, joined by toothed wheels, or with toothed wheels whose teeth
  fit into each other
scope: This is about a machine part that has toothed wheels, is joined by them, or has them fitted together;
  it is not about a person being ready for something.
examples:
- The geared wheels turned slowly inside the old clock.
- This geared motor is joined to the pump by a short shaft.
