simpleMeaning: hard proof that a crime has been committed, the facts that make up the offence, though
  at times wrongly taken to mean the body of a murder victim
scope: This is the hard proof that a crime took place, not the body of a murder victim.
examples:
- Without a corpus delicti, no crime can be proved to have taken place.
- The corpus delicti showed that a crime had been committed.
