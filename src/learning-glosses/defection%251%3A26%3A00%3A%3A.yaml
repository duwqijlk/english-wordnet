simpleMeaning: the state of having turned away from your religion for a political party or a cause, often
  to take up opposing beliefs or causes
scope: 'Also called apostasy and renunciation: this is giving up your religion for a party or a cause,
  not leaving a country or an army to join an enemy.'
examples:
- His defection from the church to join the new party shocked his family.
- Her defection was a giving up of her old faith for a political cause.
