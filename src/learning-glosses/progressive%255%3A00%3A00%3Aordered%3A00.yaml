simpleMeaning: of a card game or a dance in which the players move on to a new place after each part,
  so they keep changing places
scope: A game or dance in rounds where players move on, not a person who backs reform, not a tax that
  rises with income, and not a verb tense for actions still going on.
examples:
- They played a progressive game of cards, moving to a new table after each round.
- At the progressive dance, partners changed places after every set.
