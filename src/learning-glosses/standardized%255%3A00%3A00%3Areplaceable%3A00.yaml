senseId: standardized%5:00:00:replaceable:00
synsetId: 01985596-s
simpleMeaning: able to take the place of another thing or swap places with it, with no loss of how well
  it works or how well it fits the job
scope: 'Also called similar, interchangeable, exchangeable, and standardised: this is about things that
  can swap places and still work as well, not about being made to follow a set standard.'
examples:
- The two standardized fittings can change places, and each works as well as the other.
- These standardized parts can replace each other with no loss of function.
