simpleMeaning: In the brain, a set of nerve threads that spread out like rays and join one part to another
scope: In the brain, nerve threads joining one part to another, not the rays given off in nuclear decay
  and not the treatment of disease with rays.
examples:
- The radiation links the front of the brain to the back.
- Damage to the radiation can slow signals between brain areas.
