simpleMeaning: a close tie between two kinds of living things that need each other, each gaining from
  the other
scope: A close tie between two kinds of living things that help each other, not one living off the other
  and not mere friendship.
examples:
- The bee and the flower live in symbiosis.
- Symbiosis lets the two kinds of life help each other.
