simpleMeaning: A person who is far too careful with money, holding on to each small coin before letting
  it go.
scope: A person far too careful with money, not a person who spends freely and not a person who saves
  a fair amount for later.
examples:
- My uncle is a penny pincher who counts every coin.
- The penny pincher would not pay for a taxi.
