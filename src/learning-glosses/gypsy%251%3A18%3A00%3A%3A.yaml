simpleMeaning: a member of a dark-skinned, dark-haired people who speak Romany and traditionally live
  by seasonal work and fortune-telling, thought to come from northern India and now found on all continents
scope: Also called Gipsy, Bohemian, Roma, Romani, Romany, or Rommany; a member of the Romany-speaking
  people, not a member of any other people.
examples:
- The Gypsy family camped near the fair.
- A Gypsy told her fortune at the market.
