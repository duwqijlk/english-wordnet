simpleMeaning: A surface quality with little or no contrast, without bright reflections or a shiny finish.
scope: The dull, non-reflecting quality of a surface, another name for matte; not the floor covering called
  mat and not the metal mixture called matte.
examples:
- The paint is sold in gloss or matt.
- A finish in matt gives the surface little contrast and no shine.
