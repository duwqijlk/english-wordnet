simpleMeaning: Its head is thick with hair that looks like the hood a monk wears, and this monkey lives
  in Central and South America.
scope: Also called ringtail, this monkey of Central and South America is known by the thick hair on its
  head that looks like a monk's hood.
examples:
- We watched a capuchin swing through the trees in the forest.
- The capuchin groomed the thick hair on its head.
