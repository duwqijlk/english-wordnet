simpleMeaning: In botany, a plant category of high rank, matching the level called a phylum in animals.
scope: This is a rank in plant classification, not a portion of something split up, not the general biology
  term for any group inside a larger category, and not an administrative unit of a company or government.
examples:
- Ferns and their allies form a single division of the plant kingdom.
- Botanists place conifers and flowering plants in separate divisions.
