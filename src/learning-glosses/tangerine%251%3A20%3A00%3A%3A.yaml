simpleMeaning: A kind of mandarin orange, called kamala kaya in Telugu and in Portugal, and called a mandarin
  in Australia
scope: This kind of mandarin orange, also called a tangerine tree, is not the orange-red colour and not
  the wider group of deep orange mandarins grown in the United States and southern Africa.
examples:
- He planted a tangerine in the garden, and it grew into a small tree.
- The tangerine in her yard gives sweet fruit every winter.
