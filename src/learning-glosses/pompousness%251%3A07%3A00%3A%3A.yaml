simpleMeaning: a lack of grace that comes from acting grand and thinking too highly of yourself
scope: Also called inflation, puffiness, ostentation, ostentatiousness, pomposity, pretentiousness, and
  splashiness, this is a lack of grace that comes from acting grand and thinking too highly of yourself.
examples:
- Her pompousness showed when she spoke as if she knew more than everyone else.
- They laughed at the pompousness of his grand, showy welcome.
