simpleMeaning: the special hard stuff like bone that covers the root of a tooth
scope: The special hard bone-like stuff round a tooth root, not the grey building powder and not the stuff
  a dentist uses to fill a hole in a tooth.
examples:
- The cement covers the root of the tooth and holds it in the gum.
- Damage to the cement round a tooth root can make the tooth loose.
