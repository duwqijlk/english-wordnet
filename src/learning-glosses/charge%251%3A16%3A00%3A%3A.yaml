schema: oewn-learning-gloss-v2
senseId: 'charge%1:16:00::'
synsetId: 09208509-n
simpleMeaning: In psychoanalysis, the amount of sexual or life energy that a person attaches to an idea,
  person, or object.
scope: This is a psychoanalytic term for emotional energy, not the amount of unbalanced electricity in
  a body, not a sudden release of strong feeling, not a formal accusation or a criminal-law pleading,
  not a price or a request for payment, not a financial liability, not the care or supervision of someone,
  not a special assignment, not a person in someone's care, not a design on a shield, not an amount of
  explosive, and not a headlong rush at someone or something.
examples:
- Freud described the charge of love that the infant invests in the mother.
- In analysis, the charge attached to a memory can shape how a person behaves.
