simpleMeaning: a meeting where people find the problems in one activity, teach ways to fix them, and help
  people get better at it
scope: A meeting to find problems in one activity, teach ways to fix them and help people improve, not
  a place where people go for medical care.
examples:
- The tennis clinic helped players fix faults in their serve.
- She went to a writing clinic to get help with her stories.
