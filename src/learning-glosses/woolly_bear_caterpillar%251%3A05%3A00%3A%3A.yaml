simpleMeaning: a thick coat of soft hairs covers the young of many moths, which eat plants; some kinds
  are pests that harm the plants badly
scope: Also called woolly bear, the hairy young of moths that feed on plants, not a worm and not a grub.
examples:
- The woolly bear caterpillar curled up on the leaf, its soft hairs standing out.
- A woolly bear caterpillar eats the leaves of garden plants.
