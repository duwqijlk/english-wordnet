simpleMeaning: A large brain sits in the skull of these animals, whose bony or gristly frames hold a jointed
  spine down the back.
scope: 'Also called vertebrate: animals with a jointed spine and a large brain in a skull, not animals
  with no backbone at all.'
examples:
- A craniate has a skull around its brain.
- Fish and birds are craniates.
