simpleMeaning: A small thick-furred egg-laying water animal of Australia and Tasmania, with a wide bill,
  a wide tail, and webbed feet; the only kind in its family.
scope: 'Also called platypus, duck-billed platypus, duckbill and duckbilled platypus: a small thick-furred
  egg-laying water animal of Australia and Tasmania, with a wide bill, a wide tail and webbed feet, the
  only kind in its family, not a duck and not a beaver.'
examples:
- The Ornithorhynchus anatinus swam in the river with only its bill above the water.
- An Ornithorhynchus anatinus builds its burrow in the river bank.
