simpleMeaning: of, made from, or using things made or used in changes where atoms (the smallest parts
  of things) join, split, or move in new ways
scope: About things made or changed in this way, not just about the study of substances itself, and not
  the noun for a substance itself.
examples:
- They used a chemical process to turn plant material into fuel.
- Chemical fertilizer is made through changes that join simple substances in new ways.
