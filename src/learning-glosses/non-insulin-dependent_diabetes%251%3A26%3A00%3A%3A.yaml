simpleMeaning: A mild adult sugar-handling disorder that starts slowly and may arise from obesity, severe
  stress, menopause or other factors, and usually yields to diet and sugar-lowering drugs, not insulin.
scope: The adult form of diabetes that can be handled without insulin, not the form that begins in childhood
  and depends on it.
examples:
- Her non-insulin-dependent diabetes is managed with tablets and a careful diet.
- The clinic files non-insulin-dependent diabetes separately from the form that needs daily injections.
