simpleMeaning: Rich and careless of the gods, the second time of the world in old Greek and Roman stories
  falls short of a golden time
scope: In old Greek and Roman stories, this second time of the world falls short of a golden time in what
  it achieved.
examples:
- They told tales of the silver age.
- Men of the silver age forgot the gods.
