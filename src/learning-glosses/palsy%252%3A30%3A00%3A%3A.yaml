simpleMeaning: to cause a person to have a condition in which the body shakes in a way they cannot control
scope: This verb means to cause the shaking condition in someone; it is not the condition itself, which
  is the noun sense.
examples:
- The illness palsied his hands, so they shook all the time.
- Her arms were palsied by the disease and would not stop shaking.
