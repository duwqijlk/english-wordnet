simpleMeaning: A British measure for how much a thing holds, for liquids or dry goods, the same as four
  quarts or 4.545 liters.
scope: This is a British measure for how much a thing holds, for liquids or dry goods, the same as four
  quarts or 4.545 liters; gallon and congius are other names for it; not a small cup measure and not a
  weight measure.
examples:
- An imperial gallon holds four quarts.
- The tank held ten imperial gallons of water.
