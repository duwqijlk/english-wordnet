simpleMeaning: a person who supports the idea that a king or queen should rule a country
scope: 'Also called royalist: a person who supports rule by a king or queen, not a king or queen who rules
  and not a person who wants no king or queen.'
examples:
- As a monarchist, he wanted the king to keep his power.
- Many monarchists marched to show support for the queen.
