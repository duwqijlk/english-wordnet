simpleMeaning: to cook food and serve it on a flat piece of wood
scope: This is cooking and serving food on a flat piece of wood, not a long piece of wood itself and not
  covering something with such pieces.
examples:
- They planked the fish and served it hot.
- We planked the vegetables for dinner.
