simpleMeaning: Being native to a place because it started or grows there by itself.
scope: Being native to a place by starting there, also called autochthony and indigenousness; not being
  brought in and not being common everywhere.
examples:
- Endemism marks the plants that grow only on that island.
- The bird's endemism to the valley made it rare.
