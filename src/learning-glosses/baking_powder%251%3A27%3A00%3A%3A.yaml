simpleMeaning: Any of several dry mixes that a cook adds to food in place of yeast
scope: A dry mix used in place of yeast in cooking, not yeast itself and not a flavouring.
examples:
- She added baking powder to the cake mix.
- Without baking powder the sponge stayed flat.
