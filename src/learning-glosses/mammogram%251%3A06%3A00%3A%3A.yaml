simpleMeaning: a film picture of the soft parts inside the breast, made with X-rays
scope: The film picture itself, made with X-rays; not the visit or test in which it is taken, and not
  a picture of bone or of another part of the body.
examples:
- The doctor looked at the mammogram to check for signs of illness in her breast.
- Her mammogram showed a small lump that needed more tests.
