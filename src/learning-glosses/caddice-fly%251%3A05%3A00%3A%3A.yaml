simpleMeaning: With two pairs of hairy, thin wings, this small insect looks like a moth, and its young
  live in water.
scope: Also called caddice fly, caddis-fly, and caddis fly, this is a small moth-like insect with two
  pairs of hairy wings whose young live in water, not a true moth.
examples:
- A caddice-fly rested, its hairy wings folded flat.
- The young of the caddice-fly live in the water before they grow wings.
