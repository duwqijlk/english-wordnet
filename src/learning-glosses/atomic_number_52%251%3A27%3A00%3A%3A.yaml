simpleMeaning: Tellurium, a brittle silver-white element between metal and non-metal, like selenium and
  sulfur; used in alloys and in electronic parts; found mostly as tellurides in copper, nickel, silver,
  gold ores.
scope: 'Also called Te and tellurium: a brittle element close to selenium, not a true metal, and not a
  compound.'
examples:
- Atomic number 52 is close kin to selenium.
- Tellurium, atomic number 52, is found in ores of gold.
