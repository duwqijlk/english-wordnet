synsetId: 01220960-v
simpleMeaning: to hold up something by putting blocks of wood under it
scope: This sense is to hold up something by putting blocks of wood under it, not the block of wood itself
  and not using such blocks to keep something from moving.
examples:
- Chock the boat so it rests on blocks of wood in the yard.
- They chocked the boat before they began to fix its bottom.
