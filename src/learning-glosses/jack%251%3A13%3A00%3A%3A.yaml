simpleMeaning: a very large fruit from East India, like breadfruit, with soft parts you can eat and seeds
  full of good food, often roasted
scope: A very large fruit you can eat; not the fast sea fish with the same name, not the socket for a
  plug, and not the tool for lifting things.
examples:
- The jack hung heavy on the tree, too big for one person to carry alone.
- We cut open a ripe jack and roasted its seeds.
