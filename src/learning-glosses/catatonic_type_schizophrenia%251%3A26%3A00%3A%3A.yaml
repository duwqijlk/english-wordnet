simpleMeaning: an illness in which the sick person holds one dull, still pose for a long time, then for
  a short time becomes wildly excited
scope: 'Also called catatonia and catatonic schizophrenia: a form of schizophrenia with long still spells
  and short bursts of excitement, not a short faint and not a mood that changes often.'
examples:
- Catatonic type schizophrenia left him fixed and dull for days.
- Her catatonic type schizophrenia gave way to wild excitement for a short while.
