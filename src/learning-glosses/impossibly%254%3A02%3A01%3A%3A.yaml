simpleMeaning: To a point so far past what can be done that it cannot be reached
scope: This is about a point so far past what can be done that it cannot be reached, not about a thing
  that is merely hard to do.
examples:
- The task was impossibly hard for one person alone.
- The shop stood impossibly far from the nearest town.
