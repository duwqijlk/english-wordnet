simpleMeaning: a spider with a row of stiff hairs like the teeth of a comb on each back foot
scope: 'Also called a comb-footed spider: a spider with a row of stiff hairs like a comb on each back
  foot, not a spider with smooth back feet and not a spider known only for its web.'
examples:
- The theridiid has a row of comb-like hairs on each of its back feet.
- A theridiid sat in the corner of the shed, its back feet lined with tiny bristles.
