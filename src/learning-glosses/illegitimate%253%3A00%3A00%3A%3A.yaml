simpleMeaning: Used to say a marriage or a child is not accepted by the law
scope: This word describes marriages and children as not accepted under the law; it is not the noun that
  names such a child, and not a word for any wrong act.
examples:
- In the old law, their marriage was called illegitimate.
- The child was treated as illegitimate because the law did not accept the parents' marriage.
