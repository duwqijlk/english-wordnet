simpleMeaning: This shrub stays green all year in North America and northern Eurasia, bears small white
  flowers and red berries, spreads like a mat, and its leaves turn red in autumn.
scope: Also called bear's grape, common bearberry, creashak, hog cranberry, mealberry, mountain box, red
  bearberry, sand berry, and sandberry, it is an evergreen shrub that spreads like a mat, with small white
  flowers and red berries.
examples:
- The wild cranberry had small white flowers.
- Wild cranberry leaves turn red in autumn.
