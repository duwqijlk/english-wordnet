simpleMeaning: In psychology, the way things we see keep looking much the same even when how we look at
  them changes a lot.
scope: 'Also called constancy: in psychology, the way things keep looking the same, not a change in the
  things themselves.'
examples:
- Perceptual constancy is why a door still looks the same shape when seen from the side.
- Thanks to perceptual constancy, a white wall still looks white in dim light.
