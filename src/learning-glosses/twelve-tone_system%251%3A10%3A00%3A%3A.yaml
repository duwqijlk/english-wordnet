simpleMeaning: A set of rules for serial music from Arnold Schoenberg, built on a fixed row using every
  note of the scale, used as it stands or upside down or backwards.
scope: This sense is also called 12-tone music and 12-tone system, for a way of writing serial music credited
  to Arnold Schoenberg, setting the twelve chromatic notes in a fixed order, also used upside down or
  backwards.
examples:
- The twelve-tone system uses a tone row.
- Twelve-tone systems shape the work.
