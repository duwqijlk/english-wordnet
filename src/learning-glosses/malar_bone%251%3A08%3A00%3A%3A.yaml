simpleMeaning: The curved hard part under the eye that makes the cheek stand out
scope: The curved bone under the eye that makes the cheek stand out, not the jaw bone and not the bone
  of the nose; cheekbone, jugal bone, malar and os zygomaticum are other names for this sense.
examples:
- The malar bone forms the high point of her cheek.
- He broke his malar bone in the fall.
