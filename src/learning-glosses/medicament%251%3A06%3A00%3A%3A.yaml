simpleMeaning: In medicine, a sickness is fought, kept away, or made less strong in its signs by this
  thing
scope: 'Also called medication, medicinal drug or medicine: a thing used to treat, prevent or ease sickness,
  not a drug taken for fun and not a cure that works at once.'
examples:
- The doctor gave him a medicament to bring down the fever.
- This medicament should ease the cough within a day.
