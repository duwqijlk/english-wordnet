senseId: 'chronic_pyelonephritis%1:26:00::'
synsetId: 14590347-n
simpleMeaning: Often found with a kidney stone or narrow tubes that carry urine, this kidney sickness
  grows slowly and can stop the kidneys from working if left alone
scope: A slow kidney sickness, not a sudden kidney infection and not a kidney stone itself.
examples:
- Chronic pyelonephritis can harm the kidneys over time.
- Her chronic pyelonephritis came with a kidney stone.
