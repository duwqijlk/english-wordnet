simpleMeaning: A rude noise made to show dislike or scorn for someone or something.
scope: Also called a bird, a hiss, a snort, a hoot, a boo, a raspberry, a razz, and a razzing; a rude
  noise of dislike or scorn, not a shout of praise or a cry of joy.
examples:
- The crowd gave the speaker a Bronx cheer when he finished.
- A Bronx cheer rose from the back of the hall.
