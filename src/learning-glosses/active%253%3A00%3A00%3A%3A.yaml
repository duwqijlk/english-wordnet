senseId: 'active%3:00:00::'
synsetId: 00041840-a
simpleMeaning: In grammar, describing a verb or participle that shows doing or performing something rather
  than a state or condition.
scope: This applies to verb forms and participial modifiers themselves, not to the grammatical voice of
  a whole clause (the sibling sense about a subject acting), not to the noun naming that voice, not to
  the noun for a chemical substance, not to the noun for a participating member, and not to senses about
  energetic people, being disposed to act, taking part, exerting influence, being in operation, growing
  more severe, military readiness, volcanoes, the sun, or full-time work.
examples:
- '''Running'' in ''running water'' is an active participle, while ''broken'' names a state.'
- In 'she broke the vase', the active verb shows what she did, not how the vase was.
