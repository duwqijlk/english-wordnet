simpleMeaning: a harmful growth in the kidney of a small child that can be felt as a lump, raises blood
  pressure, and puts blood in the urine
scope: It is also called embryoma of the kidney or nephroblastoma, and it is a harmful growth in the kidney
  of a small child, not a harmless lump.
examples:
- The doctors found an adenomyosarcoma in the kidney of a young child.
- Blood in the urine led them to look for an adenomyosarcoma.
