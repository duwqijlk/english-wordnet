simpleMeaning: A pleasing quality in a thing or place that draws people to it.
scope: Also called attraction or magnet, a pleasing quality that draws people in, not the point in physics,
  in the space of all its states, toward which a system moves, whatever state it starts in, and not a
  performer who draws large crowds.
examples:
- The flowers were an attractor for the bees.
- Bright colours are an attractor for visitors to the garden.
