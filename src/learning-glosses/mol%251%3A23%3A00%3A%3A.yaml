simpleMeaning: a unit for how much of a thing there is in the world system of units, equal to its smallest-part
  weight in grams
scope: 'Also called a mole: a unit for how much of a thing there is, worked out from the weight of its
  smallest parts in grams.'
examples:
- One mol of water weighs about eighteen grams.
- The chemist measured out two mol of the salt.
