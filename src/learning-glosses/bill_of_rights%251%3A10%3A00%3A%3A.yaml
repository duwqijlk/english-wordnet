simpleMeaning: The first ten changes to the United States Constitution, which set out basic freedoms and
  special claims.
scope: This is the name for those first ten changes to the United States Constitution, which protect basic
  freedoms, not the whole Constitution and not a list of rights from another country.
examples:
- The Bill of Rights guards free speech.
- Schoolchildren learn the Bill of Rights in class.
