simpleMeaning: A trailing plant with crowded groups of three deep pink flowers like one flower near the
  ground, in dry stony or sandy soil in the southwestern United States and Mexico.
scope: Also called trailing four o'clock and trailing windmills; a low plant with groups of pink flowers
  close to the ground, not a tall upright flower and not a plant with one big flower.
examples:
- Allionia incarnata spreads along the dry ground.
- The deep pink flowers of Allionia incarnata look like one big flower.
