simpleMeaning: to show that you are unhappy or that you think something is wrong
scope: 'Also called grumble: to show you are unhappy or think something is wrong, not to speak to someone
  in a strong, angry way about what they did wrong, and not a person who always finds fault.'
examples:
- He scolded about anything that he thought was wrong.
- She scolded about the long wait and the poor service.
