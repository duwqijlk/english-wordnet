simpleMeaning: Under a senior doctor's watch, a student near the end of training, or a new doctor, learns
  by doing real work
scope: 'Also called intern, houseman or interne: a student near the end of training, or a new doctor,
  learning by doing real work under watch, not a fully trained doctor working alone and not a student
  still in class.'
examples:
- As a medical intern, she spent her first year working on the wards under a senior doctor.
- The medical intern took my blood pressure before the doctor arrived.
