simpleMeaning: In Judaism, a great fast day on the Jewish year-count that calls to mind the fall of the
  temples in Jerusalem.
scope: In Judaism, a great fast day, also called Fast of Ab, Fast of Av, Ninth of Av, Tisha b'Ab, Tisha
  b'Av, Tishah b'Ab and Tishah b'Av; its near kin are the other great fast days on the Jewish year-count.
examples:
- The Ninth of Ab marks the destruction of the temples.
- Jews fast on the Ninth of Ab.
