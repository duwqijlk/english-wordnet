simpleMeaning: This needlework pattern makes lines that zigzag.
scope: This needlework pattern makes lines that zigzag; bargello is another name for this sense, not a
  pattern of small crosses, and not a plain straight seam.
examples:
- She worked the flame stitch in red and gold thread.
- The flame stitch made zigzags across the cloth.
