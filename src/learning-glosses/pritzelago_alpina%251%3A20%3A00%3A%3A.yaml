simpleMeaning: A small tufted long-lived plant from mountains of central and southern Europe, with very
  small flowers on stems that mostly have no leaves; some lists put it in genus Lepidium.
scope: A small mountain plant with tiny flowers on mostly bare stems; also called chamois cress and Lepidium
  alpina.
examples:
- Pritzelago alpina grows high in the mountains of central Europe.
- The tiny flowers of Pritzelago alpina sit on stems with almost no leaves.
