simpleMeaning: a tree that stays green all year and bears cones; any one of a group of such cone-bearing
  trees named Tsuga
scope: 'Also called hemlock tree: a tree that stays green all year and bears cones, not the poison made
  from a different plant and not wood cut from this tree.'
examples:
