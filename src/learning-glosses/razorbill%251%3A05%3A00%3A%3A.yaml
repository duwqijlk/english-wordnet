simpleMeaning: a sea bird of the north Atlantic, black and white, with a beak that is flat and has a sharp
  edge
scope: 'Also called a razor-billed auk: a black-and-white sea bird of the north Atlantic, not a puffin
  and not a penguin.'
examples:
- The razorbill stood on the ledge, its black and white feathers bright against the rock.
- A razorbill flew low over the waves with fish in its sharp beak.
