simpleMeaning: the act of saying that something must not be done, or one case of this
scope: 'Also called prohibition and forbiddance: an act or a case of saying something must not be done,
  not a mind keeping out thoughts or wants, and not nerves slowing a body part.'
examples:
- The charter set an inhibition on building tall houses near the old church.
- This inhibition forbids doctors from giving alcohol to their patients.
