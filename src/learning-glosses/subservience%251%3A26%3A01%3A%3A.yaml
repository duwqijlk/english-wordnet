senseId: 'subservience%1:26:01::'
synsetId: 13975684-n
simpleMeaning: the state of being too willing to obey other people and let them control you
scope: This is being in a state of obeying others too much; it is not the low, fearful way of behaving
  that is a lasting part of a person.
examples:
- His subservience to his boss meant he never dared to say no.
- She lived in subservience to her husband for many years.
