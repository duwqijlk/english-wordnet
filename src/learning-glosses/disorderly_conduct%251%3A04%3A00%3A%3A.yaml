simpleMeaning: A wrong that molests, cuts in on, hinders, stirs, or rouses folk from their rest, else
  strips dwellers of stillness and quiet due them.
scope: This sense is also called breach of the peace, disorderly behavior, and disturbance of the peace,
  a wrong that molests, cuts in on, hinders, stirs, or rouses folk from their rest, else strips dwellers
  of stillness and quiet due them.
examples:
- Disorderly conducts wake folk from rest.
- The disorderly conduct strips dwellers of calm.
