simpleMeaning: a fizzy drink made by people putting carbon dioxide (a gas) into water
scope: 'Also called carbonated water, club soda, soda water and sparkling water: a fizzy drink made by
  people. It is not the other sense of this word, fizzy water that comes from the ground as it is.'
examples:
- She drank a cold glass of seltzer with a piece of lemon.
- He put some seltzer in his drink to make it fizzy.
