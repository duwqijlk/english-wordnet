simpleMeaning: Waves you cannot see carry heat to whatever they reach, the way the warmth from a heat
  lamp reaches you.
scope: This is a stream of unseen waves that warms what it falls on, not the lamp that gives it off.
examples:
- The infrared ray warmed their hands.
- They felt the infrared ray on their face.
