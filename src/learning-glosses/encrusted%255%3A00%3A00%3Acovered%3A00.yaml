simpleMeaning: covered by a hard layer that has gone firm on the outside
scope: Covered by a hard layer that has gone firm on the outside; crusted and crusty are other names for
  this sense, and it is not merely dirt but a hard cover.
examples:
- His boots were encrusted with dried mud.
- The old pan was encrusted with burnt food.
