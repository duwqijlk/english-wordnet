simpleMeaning: To put oxygen into a thing, filling it or mixing it in.
scope: Also called oxygenate, to put oxygen into a thing, not to treat sewage so that the tiny living
  things that break down waste can grow.
examples:
- The nurse aerated the patient's blood with extra oxygen.
- The gardener aerated the soil to let oxygen reach the roots.
