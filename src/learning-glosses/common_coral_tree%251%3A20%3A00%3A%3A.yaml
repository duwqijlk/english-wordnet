simpleMeaning: This small thorny tree from South America bears flowers of dark red and bright red, some
  alone and some in bunches.
scope: Also called ceibo, a cry-baby tree, or a crybaby tree, this small thorny tree from South America
  bears dark red and bright red flowers, some alone and some in bunches.
examples:
- The common coral tree bore dark red flowers in bunches.
- A common coral tree stood in flower with bright red blooms.
