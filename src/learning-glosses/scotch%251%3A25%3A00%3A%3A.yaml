simpleMeaning: a small cut on a surface, in particular a notch made to keep count
scope: A small cut on a surface, above all a notch made to keep count; score is another name for this
  sense, and it is not a deep cut or the drink of the same name.
examples:
- He made a scotch in the wood to mark the count.
- Each scotch on the stick stood for one day's work.
