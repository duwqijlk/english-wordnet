simpleMeaning: about the learning movement of the Renaissance in Europe, which turned back to old Greek
  and Roman learning and put people first
scope: 'Also called humanist: this sense is about the Renaissance and its learning; it is not the wider
  idea that people matter most and can think for themselves, and it is not about school subjects like
  history and art.'
examples:
- The humanistic revival brought old Greek books back into schools.
- He wrote a humanistic poem in the style of the old Roman writers.
