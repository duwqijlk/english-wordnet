simpleMeaning: A card game where players lay down sevens first, then play other cards in sequence in the
  same suit as those sevens; the first to run out of cards wins.
scope: This is a card game; it is not a law-making body or the building where such a body meets.
examples:
- We played parliament after dinner, and my aunt was first to run out of cards.
- In the card game parliament, the sevens open the piles and the other cards must follow in the same suit.
