simpleMeaning: A wall inside a ship or plane that splits it into separate rooms or parts.
scope: A wall inside a ship or plane that splits it into separate rooms or parts, not the outer wall of
  the ship or plane.
examples:
- Water poured through the broken bulkhead into the next compartment.
- The crew sealed the bulkhead to keep the fire from spreading.
