senseId: 'impropriety%1:04:01::'
synsetId: 00738834-n
simpleMeaning: An act that offends against what is proper, breaking the rules of good behaviour.
scope: Also called indecency, an act that offends against what is proper and breaks the rules of good
  behaviour, not an improper way of behaving and not the state of being improper.
examples:
- His impropriety at the dinner shocked the other guests.
- The letter of complaint listed every impropriety the manager had allowed.
