simpleMeaning: the gas form of the liquid in seas and rain, spread through the air but cooler than boiling
  heat
scope: 'Also called water vapour: gas in the air below boiling point, not liquid water and not steam.'
examples:
- Water vapor rose from the kettle before it began to boil.
- On cold mornings water vapor in the air fogs the windows.
