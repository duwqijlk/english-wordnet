simpleMeaning: a hard part of the body that is about as wide as it is long and as deep as it is wide
scope: A hard part of the body about as wide as it is long, also called os breve; not a long arm or leg
  bone and not a flat rib.
examples:
- The wrist has a short bone that helps it move.
- A short bone in the ankle lets the foot bend.
