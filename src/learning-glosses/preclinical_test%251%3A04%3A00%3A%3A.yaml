simpleMeaning: Animals in a lab are tried with a new drug or a new device put inside the body, gathering
  proof that it may be tried on people.
scope: It is also called a preclinical phase or a preclinical trial, and it is the lab work on animals
  that comes before any test on people.
examples:
- The preclinical test was done on animals in a lab.
- A preclinical test must come before any test on people.
