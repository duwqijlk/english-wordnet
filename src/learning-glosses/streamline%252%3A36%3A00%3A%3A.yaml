simpleMeaning: to give something a shape that saves money or does its work well
scope: This is about giving a thing a shape that saves money or works well; it is not about making an
  office or a set of steps run with fewer steps.
examples:
- The makers streamlined the shape of the new car so that it would use less fuel.
- Engineers streamlined the boat so that it could move with less effort and cost.
