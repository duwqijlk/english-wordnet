senseId: 'ticker%1:08:00::'
synsetId: 05396148-n
simpleMeaning: the hollow organ of muscle in the chest, behind the breastbone and between the lungs, whose
  steady beats push blood through the body
scope: This sense is the organ in the chest, also called heart and pump. It is not the machine that prints
  prices for shares on tape.
examples:
- His ticker beat fast after he ran up the stairs.
- The doctor said her ticker was strong and healthy.
