simpleMeaning: A unit of money in Turkey, where one hundred kurus make one lira.
scope: This is the Turkish unit of money, also called piastre and kurus; the piaster of Egypt, Lebanon,
  Sudan, and Syria is a different sense.
examples:
- The shopkeeper asked for ten piasters in Turkish money.
- A piaster was worth one hundred kurus in Turkey.
