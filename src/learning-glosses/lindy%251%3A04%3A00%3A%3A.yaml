simpleMeaning: a lively American dance that was liked by many people in the 1930s, probably named for
  the flyer Charles Lindbergh
scope: A lively American dance liked by many in the 1930s; lindy hop is another name for this sense, not
  a slow dance and not a dance from another land.
examples:
- They danced the lindy until the band stopped.
- The lindy was the dance of the 1930s.
