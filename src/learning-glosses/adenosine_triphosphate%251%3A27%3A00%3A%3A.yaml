simpleMeaning: Cells get most of the power they need to work from this building block, made from a smaller
  cell stuff and found in muscle.
scope: This is the stuff in muscle that gives cells most of the power they need to work; it is not the
  power itself but the stuff that gives it.
examples:
- Adenosine triphosphate gives the muscle cells most of the power they need to work.
- The muscle cells got most of their power to work from adenosine triphosphate.
