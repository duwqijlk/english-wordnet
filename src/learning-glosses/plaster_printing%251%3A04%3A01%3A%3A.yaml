simpleMeaning: a print from a cut plate turned into a raised print by a plaster copy of it, so the lines
  once cut in stand out above the surface
scope: A print made from a cut plate, not a print from a flat plate and not a print from raised type.
examples:
- Plaster printing was used to copy fine lines from a cut plate.
- The artist showed us a piece of plaster printing with raised lines.
