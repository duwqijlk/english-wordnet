senseId: 'jollify%2:41:00::'
synsetId: 02497032-v
simpleMeaning: To celebrate noisily, often with plenty of drink, and to join in wild, noisy fun.
scope: To celebrate noisily, often with plenty of drink; racket, revel, make happy, make merry, make whoopee,
  wassail and whoop it up are other names for this sense, not a quiet party and not a formal dinner.
examples:
- They jollified all night after the wedding.
- The members jollified until dawn, singing and drinking.
