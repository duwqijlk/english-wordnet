simpleMeaning: A lichen of the genus Parmelia, one of several kinds used as the source of red-brown or
  purple dyes
scope: This is one of a group of dye-making growths of the genus Parmelia, not a moss and not a flowering
  plant; crotal and crottal are other names for this sense.
examples:
- Crottle gave the cloth a deep purple colour.
- Dyers in the north used crottle for their wool.
