simpleMeaning: Australian plants that live for years and keep their leaves, with a short thick woody stem
  crowned by a tuft of grasslike foliage; they produce acaroid resins.
scope: This is the Australian plant with a short thick woody stem and a tuft of grasslike leaves that
  yields acaroid resin; it is not the gaunt Tasmanian shrubby kind with long tapering leaves, and not
  the New Zealand tree with large clusters of fragrant flowers.
examples:
- A grass tree stood on the sandy ridge, its grasslike leaves rising from a short woody stem.
- The grass tree yields acaroid resin from the base of its leaves.
