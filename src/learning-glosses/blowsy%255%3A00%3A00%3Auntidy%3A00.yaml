simpleMeaning: having the messy look and manner of a woman who is careless about how she looks and acts,
  used especially of women
scope: 'Also called blowzy, slatternly, and sluttish: a messy look or manner in a woman, not a neat and
  tidy appearance, and not a merely casual one.'
examples:
- Her blowsy dress and smeared lipstick made her look as if she had not bothered to get ready.
- The old actress played the blowsy landlady with a loud laugh and a stained apron.
