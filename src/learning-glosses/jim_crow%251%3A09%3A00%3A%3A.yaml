simpleMeaning: A set of rules and ways that kept black people from taking part in things with white people.
scope: A set of rules and ways that kept black people from taking part in things with white people, also
  called color bar, color line, colour bar and colour line, among other ways of keeping black and white
  people apart.
examples:
- Jim Crow kept black people out of white schools in the South.
- Under Jim Crow, black people could not eat with white people in the same place.
