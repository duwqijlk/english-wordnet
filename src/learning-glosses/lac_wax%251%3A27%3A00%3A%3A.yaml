scope: A hard stuff taken out of a sticky coating made by tiny insects, because it does not dissolve in
  spirits, not the sticky coating itself and not wax from bees.
examples:
- Lac wax was used to polish the wooden box.
- The lac wax would not dissolve in spirits.
