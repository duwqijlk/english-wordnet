simpleMeaning: To pay a tenth part of what one earns, especially to the church.
scope: To pay a tenth part of what one earns, especially to the church, not to take a tenth from a crop
  and not to take it from a person.
examples:
- He tithes a tenth of his pay each month.
- They tithe to the church every year.
