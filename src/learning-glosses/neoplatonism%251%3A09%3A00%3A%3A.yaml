simpleMeaning: A philosophical and theological system mixing Platonism, Aristotelianism and eastern mysticism,
  whose key teaching is that the first source of reality lies beyond being and thought and cannot be known.
scope: A system of ancient thought, not Platonism itself and not a religion.
examples:
- Neoplatonism shaped early Christian thought.
- Neoplatonism was strong in pagan Europe until the 6th century.
