simpleMeaning: the act of shaping hair and putting it in place to make it look good
scope: The act of shaping a person's hair so it looks good; not a person's way of dressing, and not the
  look of a car or a room.
examples:
- Styling takes her an hour every morning before work.
- She took a course in styling hair for weddings.
