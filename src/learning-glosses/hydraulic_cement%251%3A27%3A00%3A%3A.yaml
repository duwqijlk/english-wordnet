simpleMeaning: Ground powder from limestone and clay heated in a kiln turns into a hard mass when mixed
  with water, and stays firm even below the surface.
scope: This is the powder that sets hard under water.
examples:
- They mixed hydraulic cement with water and used it to mend the floor of the tank.
- The crack was sealed with hydraulic cement, and the patch stayed hard under water.
