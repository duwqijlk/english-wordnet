simpleMeaning: 'Gambling card game: chips go on an ace, king, queen and jack of separate suits, players
  lay ever-higher cards of a suit, and matching a layout card takes its chips.'
scope: This is the card game played with chips on four face cards; boodle is another name for it, and
  it is not the plural of stop as in organ stops or bus stops.
examples:
- Stops was the favourite card game at their club.
- They cleared the table and dealt a round of stops.
