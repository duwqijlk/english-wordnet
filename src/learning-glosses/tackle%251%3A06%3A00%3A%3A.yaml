simpleMeaning: the ropes and other things used on a ship to hold up its tall posts and sails
scope: This is ship gear made of ropes, not the act of bringing a player to the ground in American football
  and not a football player or place on the line.
examples:
- The crew checked the tackle before the ship left port.
- Old tackle held the mast steady in the storm.
