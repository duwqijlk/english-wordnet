senseId: 'serigraph%1:06:00::'
synsetId: 04226785-n
simpleMeaning: A picture printed by laying a cut-out shape over a fine net, then pushing ink through the
  open parts onto the surface below.
scope: 'Also called silkscreen and silk screen print: a picture printed through a fine net, not a picture
  drawn by hand.'
examples:
- The artist made a serigraph by pushing ink through a fine net.
- Her serigraph hung beside the other prints.
