schema: oewn-learning-gloss-v2
senseId: 'insinuation%1:10:00::'
synsetId: 07253115-n
simpleMeaning: a remark that suggests something bad but does not say it in a direct way, usually in an
  unkind way
scope: Also called innuendo, this sense is a remark that suggests something bad without saying it directly,
  not the act of slowly winning liking with kind, soft words.
examples:
- His insinuation that she had stolen the money made her angry.
- I do not like your insinuation that I was lying.
