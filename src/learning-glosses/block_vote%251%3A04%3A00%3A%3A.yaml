simpleMeaning: a choice that counts as much as the number of people the person casting it speaks for
scope: A choice that counts as much as the number of people the person casting it speaks for, not a vote
  where each person counts as one and not a vote taken by a show of hands.
examples:
- Under a block vote, the delegate's choice counted for all fifty members she spoke for.
- The union used a block vote, so each delegate's vote stood for the whole group he spoke for.
