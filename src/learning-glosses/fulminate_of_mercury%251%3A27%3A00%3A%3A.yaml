senseId: 'fulminate_of_mercury%1:27:00::'
synsetId: 14822985-n
simpleMeaning: a chemical that, when dry, blows up with great force if hit or heated, used to set off
  explosives in small caps
scope: 'Also called fulminating mercury and mercury fulminate: a chemical that blows up when dry and is
  hit or heated, not a slow-burning powder and not a liquid explosive.'
examples:
- Fulminate of mercury was once used in the caps that set off old guns.
- A tiny pinch of fulminate of mercury can blow up if it is struck while dry.
