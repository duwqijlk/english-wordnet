simpleMeaning: using changes in the rise and fall of the voice to tell apart words that are otherwise
  alike
scope: This is about word meaning in a language like Chinese, not a sweet fizzy drink, not the first note
  of a musical scale, and not a muscle that stays firm.
examples:
- Chinese is a tonic language, where a change in pitch can change what a word means.
- The tonic sounds in her speech told the two words apart.
