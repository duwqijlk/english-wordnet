simpleMeaning: a woman whose work is to stay with a mother and help her through the birth of her baby
scope: A woman who helps at the birth of babies, not a doctor and not a nurse who looks after the sick.
examples:
- The midwife stayed with her through the whole birth.
- Our midwife showed us how to hold the new baby.
