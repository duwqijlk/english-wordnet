simpleMeaning: A very varied green-all-year tree, often low and bushy, of the coast lands of the far west
  of North America, with small thick dark-green leaves, usually with spiny teeth.
scope: A very varied green-all-year tree of the far west coast, often low and bushy, with small thick
  dark-green leaves; coast live oak and Quercus agrifolia are other names for this sense.
examples:
- The California live oak keeps its leaves all year.
- A California live oak grew near the coast.
