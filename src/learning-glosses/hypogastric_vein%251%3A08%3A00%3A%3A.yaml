simpleMeaning: Where the blood tube from the outer hip meets this one, the two join and become the larger
  tube known as the common iliac vein.
scope: This blood tube is also called the internal iliac vein, and it joins the blood tube from the outer
  hip rather than being that tube itself.
examples:
- The hypogastric vein joins the external iliac vein in the lower belly.
- Blood flows through the hypogastric vein toward the common iliac vein.
