simpleMeaning: having parts that match and fit each other well, or two or more things that match and fit
  each other well
scope: 'Also called symmetrical and proportionate: this is about parts or things matching each other,
  not about people getting on well together.'
examples:
- The front of the house is harmonious, with both sides the same in shape and size.
- He drew a harmonious pattern where every part matched the others.
