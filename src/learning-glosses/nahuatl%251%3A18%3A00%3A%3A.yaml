simpleMeaning: Any one of the many Indian peoples of central Mexico has this person as one of its own.
scope: This person belongs to one of the Indian peoples of central Mexico, not a speaker of the Nahuatl
  tongue and not a person from another part of Mexico.
examples:
- He is a Nahuatl from central Mexico.
- A Nahuatl from one of the peoples of central Mexico told us the old stories.
