simpleMeaning: A tool for measuring how fast a liquid or gas moves, made of a tube bent at a right angle
  with one open end facing into the flow.
scope: Also called a Pitot tube; a tool that measures the speed of a liquid or gas by a tube bent at a
  right angle, its open end facing into the flow.
examples:
- The engineer held a Pitot in the stream to check the speed of the water.
- A Pitot showed how fast the air was moving through the pipe.
