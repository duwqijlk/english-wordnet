simpleMeaning: a deep bending of the body with one foot pulled back, done to show too much of the feeling
  that you are less important than another person
scope: 'This sense is also called scrape: a deep bending of the body to show you feel less important,
  not bits pulled off a surface and not a harsh sound made by rubbing.'
examples:
- All that bowing and scraping did not impress the king.
- He came in with much scraping and smiling, hoping for a favour.
