senseId: 'heat-absorbing%3:00:00::'
synsetId: 00875818-a
simpleMeaning: While a change in chemicals goes on, or a new stuff is made by it, warmth is taken in
scope: 'Also called endothermal and endothermic: a change that takes in warmth, not one that gives out
  warmth and not a change in the warmth of the air.'
examples:
- The heat-absorbing reaction took in warmth from the water around it.
- This heat-absorbing salt cools the mixture as it dissolves.
