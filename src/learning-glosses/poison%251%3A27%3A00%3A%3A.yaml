simpleMeaning: any material that can hurt a living thing, make it ill, or kill it
scope: A material that can hurt or kill a living thing, not the act of giving such a material to a person
  and not spoiling something.
examples:
- The bottle was marked as poison, so he kept it away from the children.
- Some mushrooms contain a poison that can kill you.
