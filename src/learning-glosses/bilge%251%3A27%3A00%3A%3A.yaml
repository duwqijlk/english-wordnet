simpleMeaning: water that has gathered in the lowest part inside a ship
scope: Water gathered at the bottom inside a ship; not the ship's lowest part itself, and not the verb
  sense of a ship taking in water there.
examples:
- The crew pumped out the bilge that had gathered in the ship overnight.
- Smelly bilge had to be cleaned from the bottom of the old ship.
