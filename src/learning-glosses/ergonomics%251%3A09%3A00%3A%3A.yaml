simpleMeaning: the study of how people and the places where they work fit each other, using what is known
  about the body
scope: 'Also called bioengineering and biotechnology: the study of how workers and their workplaces fit
  each other, not the design of machines alone and not the study of the body on its own.'
examples:
- Ergonomics helps factories set up chairs and desks that fit the workers.
- She studied ergonomics to make the office safer for the staff.
