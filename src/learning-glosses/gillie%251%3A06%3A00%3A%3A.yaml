simpleMeaning: a shoe with no tongue and pretty laces that tie up over the top of the foot
scope: A shoe with no tongue and pretty laces up the front; ghillie is another name for this sense, not
  a boot and not a shoe with a tongue.
examples:
- He wore gillies with his kilt.
- The dancer laced up her gillie before the show.
