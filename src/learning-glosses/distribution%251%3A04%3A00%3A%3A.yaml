simpleMeaning: The act of giving things out, spreading them, or sharing them between people.
scope: This is the act of giving things out or sharing them between people, not a set of values in numbers,
  not the moving and selling of goods, and not the way things are spread over a place.
examples:
- The distribution of food began at noon.
- Fair distribution of the money pleased everyone.
