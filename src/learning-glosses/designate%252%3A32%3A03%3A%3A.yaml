simpleMeaning: to draw attention to a place, a way to go, a person, or a thing, whether you mean a real
  place or only an idea of one
scope: 'Also called point, show, or indicate: to draw attention to something, not to give a person a job
  or a task and not to decide a thing before it happens.'
examples:
- The guide designated the meeting point on the map for us.
- She designated the empty seat beside her with a wave of her hand.
