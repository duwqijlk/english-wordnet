senseId: 'monotonic%3:00:00::'
synsetId: 01551387-a
simpleMeaning: Of a list of numbers, or a rule that gives numbers, always going up and never down, or
  always going down and never up
scope: Of a list of numbers, or a rule that gives numbers, always going up and never down, or always going
  down and never up; monotone is another name for this, not a voice held at one pitch.
examples:
- The list 1, 2, 3 is monotonic, always going up.
- A monotonic rule gives numbers that never go down.
