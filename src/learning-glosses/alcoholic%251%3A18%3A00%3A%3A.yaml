simpleMeaning: a person who drinks far too much alcohol, again and again
scope: A person who drinks far too much alcohol, time after time; lush is another name for this sense,
  and it is not a drink with alcohol in it or simply a person who cannot stop drinking.
examples:
- The alcoholic drank every day, even at work.
- He became an alcoholic after years of drinking too much.
