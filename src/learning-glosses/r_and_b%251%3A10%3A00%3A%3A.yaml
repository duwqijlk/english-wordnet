simpleMeaning: A mix of blues and jazz made in the United States by Black players, which came before rock
  'n' roll
scope: This is a mix of blues and jazz made in the United States by Black players, which came before rock
  'n' roll; rhythm and blues is another name for this sense, and it is one of the kinds of American music,
  close to the blues, jazz and rock 'n' roll.
examples:
- R and B came before rock 'n' roll.
- Black players in the United States made R and B from blues and jazz.
