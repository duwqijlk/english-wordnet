simpleMeaning: to spread out over a surface the way a cloak covers a person's shoulders
scope: To spread over a surface like a cloak, not the cloak itself, not the skin layer of a shell animal,
  and not to cover something up.
examples:
- Snow mantled the hills in a smooth white coat.
- Vines mantled the old stone wall.
