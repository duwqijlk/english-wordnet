simpleMeaning: A male person who writes reports of what has happened for the daily press or for radio
  and television, as a paid job
scope: A male person who writes reports of what has happened for the daily press or for radio and television,
  as a paid job; pressman is another name for this sense, not a woman doing the same job and not a writer
  of books.
examples:
- The newspaperman filed his story before the deadline.
- A veteran newspaperman covered the trial for the daily paper.
