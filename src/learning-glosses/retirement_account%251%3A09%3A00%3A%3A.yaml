simpleMeaning: A plan for putting money by before work ends, so it can be used after work has ended.
scope: This is a savings scheme for later life, not a monthly sum paid out after work ends; it is also
  called retirement plan, retirement program, retirement savings account, and retirement savings plan.
examples:
- She opened a retirement account when she started her first job.
- Money in his retirement account will help him after he stops working.
