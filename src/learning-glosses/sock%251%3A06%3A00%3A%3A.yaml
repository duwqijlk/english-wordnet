simpleMeaning: a cloth cover for the foot, worn inside a shoe, reaching up to somewhere between the ankle
  and the knee
scope: A cloth cover for the foot worn inside a shoe, not the cloth cone that shows wind direction.
examples:
- He pulled on a clean pair of socks before his shoes.
- One sock had a hole in the toe.
