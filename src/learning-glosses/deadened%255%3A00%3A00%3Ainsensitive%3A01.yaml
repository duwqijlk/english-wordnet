simpleMeaning: having no feeling in the body or in a part of the body
scope: 'Also called dead: having no feeling in a part of the body, not being less strong or less clear
  in sound or in the mind.'
examples:
- His deadened tooth felt nothing when the dentist touched it.
- After the medicine, her deadened gums felt no pain.
