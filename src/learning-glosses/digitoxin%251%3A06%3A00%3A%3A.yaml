simpleMeaning: A drug made from the foxglove plant, used to treat a heart too weak to pump blood well
  or a heart that beats out of time.
scope: A heart drug made from foxglove, not a drug that lowers blood pressure and not a drug for chest
  pain.
examples:
- The doctor gave him digitoxin for his weak heart.
- Digitoxin can steady a heart that beats out of time.
