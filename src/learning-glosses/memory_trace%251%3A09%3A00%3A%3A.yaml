simpleMeaning: a change in body chemistry, thought to happen in nerve tissue, that holds what a person
  has learned and can call back
scope: A change in the body, thought to happen in nerve tissue, that holds a memory; engram is another
  name for this sense, not the memory itself, and not a scar on the brain.
examples:
- Scientists look for the memory trace left in the brain by what we learn.
- Each memory trace is thought to be a small change in the nerves.
