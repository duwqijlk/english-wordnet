simpleMeaning: a part of the body, such as an organ, a muscle, or a gland, made active by nerves or by
  a flow of power
scope: A body part made active by nerves or by a flow of power, not anger, not sore skin, and not a feeling
  of annoyance.
examples:
- Irritation of the nerve made his arm twitch.
- The test caused irritation of the muscle.
