simpleMeaning: A long, flat worm shaped like a ribbon that lives inside the gut of people and other animals
  with backbones, feeding off them.
scope: Also called cestode; ribbonlike flatworms that live as parasites in the intestines of humans and
  other vertebrates.
examples:
- The tapeworm in the dog's gut was several feet long.
- Doctors treated the child for tapeworm.
