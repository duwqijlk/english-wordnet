simpleMeaning: A group of ways of speaking within the Uto-Aztecan family, not of the usual kind, spoken
  most of all in the south-west of the United States.
scope: Also called Shoshonean, Shoshonean language, or Shoshonian, it is a non-standard subfamily of Uto-Aztecan
  languages spoken mainly in the south-western United States.
examples:
- Shoshonian language is a group of languages within the Uto-Aztecan family.
- People speak the Shoshonian language in the south-west of the United States.
