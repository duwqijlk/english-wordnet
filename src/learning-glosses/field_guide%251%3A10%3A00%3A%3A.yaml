simpleMeaning: when you are out of doors and meet a wild thing, this book tells you about its kind
scope: A book that tells you about the kind of a wild thing you meet out of doors, not a travel book and
  not a book about one animal kept at home.
examples:
- She took a field guide to mushrooms on the walk.
- A good field guide shows pictures of each bird you may see.
