scope: This is an edible American clam whose heavy shells were once used as money; quahog, hard-shell
  clam, hard clam, quahaug, round clam and Venus mercenaria are other names for this sense.
examples:
- We dug Mercenaria mercenaria at low tide and cooked the clams for supper.
- The heavy shells of Mercenaria mercenaria were once used as money.
