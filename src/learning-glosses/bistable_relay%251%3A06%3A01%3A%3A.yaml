simpleMeaning: a switch that holds one of its two on-or-off states on its own for as long as needed, with
  no power going to its coil
scope: 'Also called an impulse relay, a keep relay and a latching relay: a switch that holds one of its
  two states with no power, not a switch that needs power to stay on.'
examples:
- The bistable relay stayed in place after the power was cut.
- He fitted a bistable relay so the light would stay on without power.
