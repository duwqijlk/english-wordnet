simpleMeaning: One of a people who live in south Benin and Togo and in south-east Ghana.
scope: This is a member of the people of south Benin, Togo and south-east Ghana, not a speaker of the
  language alone or a person of a nearby people.
examples:
- An Ewe farmer lives near the coast of Togo.
- The Ewe celebrate festivals in Ghana and Benin.
