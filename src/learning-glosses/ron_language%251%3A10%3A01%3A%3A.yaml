simpleMeaning: A Chadic tongue spoken in north Nigeria, above all in Plateau State, in the Bokkos, Barakin-Ladi
  and Mangu areas
scope: Also called Ron, Bokkos, Bokkos language, Daffo and Daffo language; a Chadic tongue of Plateau
  State, close to other Chadic tongues of northern Nigeria.
examples:
- Ron language is spoken in Plateau State.
- She grew up speaking Ron language at home.
