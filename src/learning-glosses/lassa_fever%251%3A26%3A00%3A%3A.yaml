simpleMeaning: A sudden catching illness caused by a virus in central western Africa, marked by heat,
  swelling, aching muscles and hard swallowing, which can be used as a weapon of war.
scope: A contagious viral disease of central western Africa, notable for its possible use as a bioweapon.
examples:
- Lassa fever broke out in villages of central western Africa.
- Patients with Lassa fever had high heat, aching muscles and hard swallowing.
