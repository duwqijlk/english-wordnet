scope: Another name for antipsychotic, antipsychotic agent, antipsychotic drug, neuroleptic, neuroleptic
  agent, neuroleptic drug, major tranquilizer and major tranquillizer, this drug calms a person whose
  mind has lost touch with what is real, not a sleeping drug and not a drug for worry alone.
examples:
