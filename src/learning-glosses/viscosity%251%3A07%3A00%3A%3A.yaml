simpleMeaning: how strongly a liquid holds back when its parts slide past each other, and so how slowly
  it can flow
scope: This names how slowly a liquid flows because its parts hold back; it is not a word for the liquid
  itself or for how thick a solid thing is.
examples:
- Honey has a high viscosity and pours very slowly.
- Heat lowers the viscosity of the oil, so it flows more easily.
