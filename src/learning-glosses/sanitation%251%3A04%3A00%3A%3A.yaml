simpleMeaning: making something free of germs, as by killing all the germs on it
scope: The act of making a thing free of germs, not just washing dirt off it and not a system for taking
  away waste.
examples:
- Sanitation of the medical tools left them free of germs and safe to use.
- The workers did the sanitation by heating the jars to kill all germs.
