simpleMeaning: A British place of higher learning that takes in people without set school passes, and
  teaches by post, by radio and television, or in summer school
scope: This is a British place of higher learning that takes in people without set school passes and teaches
  by post, by radio and television, or in summer school; a school that takes in only people with set school
  passes is a different kind.
examples:
- She studied history through the Open University while working full time.
- The Open University sends its lessons by post and by radio.
