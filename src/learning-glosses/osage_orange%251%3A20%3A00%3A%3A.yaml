simpleMeaning: A thorny south-central US shrub with glossy leaves and inedible citrus-like fruit; its
  amber wood was prized for bows, and it is planted as a boundary hedge.
scope: The familiar hedge tree with inedible citrus-like fruit and dense thorny branches, not the unrelated
  fragrant white-flowered shrub.
examples:
- Osage orange makes a hedge so dense that cattle cannot push through it.
- He carved a longbow from a branch of osage orange.
