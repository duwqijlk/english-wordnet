simpleMeaning: a person people see as dishonest, hiding what they do, and not worth respect
scope: A name for a person people think is dishonest and not worth respect; not the noun for a person
  who moves about in secret to break the law, and not the word for a quiet, secret act.
examples:
- Nobody trusted him after he told lies about his friend; he was a real sneak.
- She called him a sneak for reading her letters in secret.
