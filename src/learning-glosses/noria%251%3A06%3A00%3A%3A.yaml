simpleMeaning: A wheel with buckets fixed round its edge that lifts water up so it can flow into a channel
  for watering crops
scope: A wheel that lifts water into a channel for watering crops; not a mill wheel that grinds grain,
  and not a pump worked by hand.
examples:
- The farmer used a noria to lift water from the river.
- A noria turned slowly, carrying water up to the fields.
