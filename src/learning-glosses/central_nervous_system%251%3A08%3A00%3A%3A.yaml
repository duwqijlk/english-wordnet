simpleMeaning: the part of the body's nerves in animals with backbones, made up of the brain and the spinal
  cord
scope: The part of the body's nerves in animals with backbones, made up of the brain and the spinal cord;
  systema nervosum centrale is another name for this sense, not the nerves in the arms and legs and not
  the brain alone.
examples:
- The central nervous system is made up of the brain and the spinal cord.
- Injury to the central nervous system can affect the whole body.
