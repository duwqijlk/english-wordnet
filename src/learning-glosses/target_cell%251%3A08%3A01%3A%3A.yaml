simpleMeaning: With a set spot that takes in an antigen, antibody, hormone or drug, this tiny living unit
  is touched by a virus, germ-eating unit, nerve fiber, or the like.
scope: Any tiny living unit with a set spot that takes in an antigen, antibody, hormone or drug, or that
  a virus, germ-eating unit or nerve fiber makes contact with; not a unit with no such spot.
examples:
- The target cell took in the hormone through its set spot.
- A virus made contact with the target cell.
