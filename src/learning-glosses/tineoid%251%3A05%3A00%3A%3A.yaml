simpleMeaning: a small dull moth that chews with the parts of its mouth
scope: Also called tineoid moth, this is a small dull-colored moth with mouth parts made for chewing;
  not the pale yellow moth whose young eat wool or fur, and not a large bright moth.
examples:
- The small dull tineoid sat on the grey wall where it was hard to see.
- The tineoid chewed at the edge of the cloth.
