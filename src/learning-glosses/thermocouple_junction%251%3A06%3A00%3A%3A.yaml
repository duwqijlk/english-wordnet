simpleMeaning: A gauge of two unlike-metal wires, end-joined, one join where the heat is read, the other
  kept at a fixed lower heat, current matching the gap in heat.
scope: Also called thermocouple, this is a gauge of two unlike-metal wires, end-joined, one join where
