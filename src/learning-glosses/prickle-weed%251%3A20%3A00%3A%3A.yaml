simpleMeaning: A plant that lives for years, of the grasslands of North America, with thick heads of small
  white flowers
scope: This is a plant that lives for years, of the grasslands of North America, with thick heads of small
  white flowers; prairie mimosa is another name for it, not a tree and not a garden flower.
examples:
- The prickle-weed bloomed white in June.
- Prickle-weed grows on the open grassland.
