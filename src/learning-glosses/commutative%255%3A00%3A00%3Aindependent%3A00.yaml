simpleMeaning: 'A times b gives the same answer as b times a: that is what this word says of a way of
  joining two numbers, where the order makes no difference.'
scope: This word is said of a way of joining two numbers when swapping them leaves the answer the same.
examples:
- Addition is commutative because two plus three equals three plus two.
- The teacher showed that multiplication is commutative by swapping the two numbers.
