senseId: 'shock%1:26:00::'
synsetId: 14090558-n
simpleMeaning: In pathology, the body shutting down, or nearly shutting down, because cells lack oxygen;
  the heart pumps too little blood and races, and the skin goes pale.
scope: This is the medical emergency in which the body's circulation fails, not the feeling of surprise
  or a jolt of electricity.
examples:
- The patient went into shock after losing a lot of blood.
- Doctors treated the injured man for shock.
