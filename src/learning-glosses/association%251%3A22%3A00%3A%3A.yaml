schema: oewn-learning-gloss-v2
senseId: 'association%1:22:00::'
synsetId: 13456325-n
simpleMeaning: In chemistry, the process by which substances come together, especially in a solution,
  held together by weak bonds rather than strong ones.
scope: This is a chemical joining of substances, not a club or other formal organization, not the act
  of spending time with people, not a social or business connection, not a general relation that results
  from interaction or dependence, not a link between ideas in the mind, not a group of plants and animals
  living in one region, and not the state of being connected in memory or imagination.
examples:
- The two molecules form a stable association through hydrogen bonding.
- This kind of weak association in solution breaks apart when the mixture is heated.
