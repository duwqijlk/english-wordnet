simpleMeaning: to put a long handle or long rod on something
scope: To fit something with a long handle or rod, not the middle part of a feather, not a tall narrow
  space in a building, and not cheating someone.
examples:
- He shafted the spear by fitting a long wooden handle to its metal point.
- The worker shafted each tool with a new handle before the men used it.
