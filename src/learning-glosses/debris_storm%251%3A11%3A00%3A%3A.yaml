simpleMeaning: dust and broken bits of a building that fly out fast when the building falls down
scope: This is dust and broken bits flying out fast from a falling building, also called a debris surge;
  not a storm of wind and rain and not dust from a fire.
examples:
- The debris storm filled the street with dust as the old tower came down.
- People ran from the debris storm when the wall gave way.
