senseId: 'remainder%1:23:00::'
synsetId: 13751346-n
simpleMeaning: the number left after one number is taken from another, which, added to the number taken
  away, gives the first number
scope: The number left after a subtraction, also called difference, not the part left over in a division.
examples:
- If you take 3 from 10, the remainder is 7.
- The remainder after subtracting 5 from 12 is 7.
