simpleMeaning: Made from sulfur dioxide, this strong biting liquid, H2SO4, is used far and wide in the
  chemical trade.
scope: Vitriol, oil of vitriol, and sulphuric acid are other names for this H2SO4 liquid.
examples:
- A drop of sulfuric acid burns the skin on contact.
- The factory used sulfuric acid in its work.
