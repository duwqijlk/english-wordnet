simpleMeaning: A Russian officer and leader loved by Catherine the Second, who in 1762 helped her take
  power and in 1787 had sham villages built for her visit to Crimea (1739-1791)
scope: A Russian officer and leader of Catherine the Second's time, not a ruler in his own right or a
  general of a later age; also called Grigori Aleksandrovich Potemkin, Grigori Potyokin, Potemkin and
  Potyokin.
examples:
- Grigori Potemkin helped Catherine the Second take power in 1762.
- Grigori Potemkin had sham villages built for her visit to the Crimea.
