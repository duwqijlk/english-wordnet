simpleMeaning: a plant whose young leaves are widely eaten as green food and whose seeds are used as grain
scope: 'Also called love-lies-bleeding and velvet flower: a plant grown for its young leaves as food and
  its seeds as grain, not the scarlet-flowered tassel flower plants of Asia and Africa.'
examples:
- She picked tassel flower leaves for the evening meal.
- Farmers grew tassel flower for its seeds as well as its leaves.
