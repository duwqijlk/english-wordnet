simpleMeaning: Blood pressure that stays high or rises and falls because a blood-vessel growth on the
  gland above the kidney makes too much of the chemical that speeds the heart.
scope: Also called pheochromocytoma; a blood-vessel growth on the gland above the kidney, not a growth
  in the kidney itself.
examples:
- The phaeochromocytoma made her blood pressure jump up and down.
- Doctors found a phaeochromocytoma on the gland above her kidney.
