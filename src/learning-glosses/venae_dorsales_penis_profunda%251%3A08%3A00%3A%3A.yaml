simpleMeaning: The deep blood tube on the top of the male sex organ, a branch of the network of tubes
  round the prostate gland.
scope: The deep blood tube on the top of the male sex organ; not a blood tube of the bladder and not one
  of the leg.
examples:
- The venae dorsales penis profunda runs along the top of the male sex organ.
- The surgeon avoided the venae dorsales penis profunda during the operation.
