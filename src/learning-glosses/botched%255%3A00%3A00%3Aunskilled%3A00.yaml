senseId: botched%5:00:00:unskilled:00
synsetId: 02236946-s
simpleMeaning: spoiled because the person who did it did not have the skill, or did it in a clumsy way
scope: This word describes work that is spoiled, also called bungled; it does not name the act of spoiling
  work, and it is not work that is just slow or hard.
examples:
- It was a botched repair, and the door still would not close.
- The botched haircut left one side much shorter than the other.
