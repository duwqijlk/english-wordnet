simpleMeaning: The last name that marks a whole family, apart from first names.
scope: This sense is also called a surname, for the last name that marks a whole family, apart from first
  names, where a surname is the family name held by all its members, rather than each person's first name,
  unlike the sense for a homely name for a person, often cut short from their first name.
examples:
- The cognomen marked the whole family.
- Cognomens are family names, not first names.
