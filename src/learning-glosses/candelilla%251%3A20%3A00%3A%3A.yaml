simpleMeaning: A shrub with a wax coat, found in northern Mexico and the south-west of the United States.
scope: A wax-coated shrub of Mexico and the south-western United States, not the wax it yields and not
  a desert cactus.
examples:
- The candelilla grows wild in the dry north of Mexico.
- Candelilla shrubs shine with their wax coat in the sun.
