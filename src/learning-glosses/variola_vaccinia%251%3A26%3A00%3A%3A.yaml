simpleMeaning: A localized skin infection that follows inoculation with cowpox virus to make a person
  resistant to smallpox; it normally lasts three weeks and leaves a pitted scar.
scope: Another name for this reaction is variola vaccine, also called vaccinia; it is the sore at the
  injection site after smallpox inoculation, not the smallpox illness itself.
examples:
- The mark on his arm was a variola vaccinia, the sore that appears after smallpox inoculation.
- Doctors once expected a variola vaccinia to form before they counted a smallpox vaccination as successful.
