simpleMeaning: An old musical horn made from a ram's horn, blown long ago by the Israelites to give warning
  or call people together, and blown in synagogues today on solemn occasions.
scope: An old ram's-horn trumpet, also called shophar, blown to warn or to call people together.
examples:
- The shofar sounded at the start of the service.
- He blew the shofar on the holy day.
