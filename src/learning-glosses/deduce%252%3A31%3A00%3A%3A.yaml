simpleMeaning: To work out what is true by thinking it through step by step from what you know.
scope: This is working something out by careful reasoning; derive is another name for this sense, not
  a guess or simply coming to a conclusion in a formal proof.
examples:
- From the mud on his shoes, she deduced that he had walked through the fields.
- The detective deduced the thief's route from the broken window.
