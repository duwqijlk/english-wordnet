simpleMeaning: to make a false call to the police so that an armed team is sent to a place
scope: A false call to the police to send an armed team somewhere, not hitting a person or thing (the
  other swat sense) and not a real emergency call.
examples:
- Someone swatted the school, and armed police arrived within minutes.
- He was arrested for swatting a streamer during a live game.
