simpleMeaning: showing care for others because you understand how they feel, and ready to give and help
scope: 'Also called kindly: kind and ready to help because you feel for others. This is not the body sense
  about the nerves, and not the sense about shaking that spreads from a nearby body.'
examples:
- He was sympathetic to the poor family and gave them food and money.
- Her sympathetic words and kind acts helped the sad boy feel less alone.
