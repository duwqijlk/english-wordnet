simpleMeaning: an area of work or life that seems to be kept for one person or one group only
scope: An area that seems kept for a certain person or group, not fruit cooked with sugar and not the
  act of keeping a thing safe from harm.
examples:
- For years, top jobs in banking were a male preserve.
- Hunting in that forest is no longer the preserve of rich landowners.
