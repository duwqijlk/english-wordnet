simpleMeaning: to put something in in secret, or with no right to do so
scope: This sense is about putting something in in secret or with no right to do so, not about openly
  adding something in the normal way.
examples:
- He foisted a fake coin into the pile when no one was looking.
- She foisted an extra page into the report without asking.
