simpleMeaning: A figure made of cloth, with an empty head, worn over the fingers.
scope: A cloth figure with an empty head worn over the fingers, also called a glove doll and a glove puppet,
  not a string puppet and not a toy doll.
examples:
- The teacher put the hand puppet on her fingers and made it talk.
- Children laughed at the hand puppet in the show.
