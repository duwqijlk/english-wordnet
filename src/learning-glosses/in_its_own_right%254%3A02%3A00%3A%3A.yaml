simpleMeaning: You hold it through a title, or through skills you have earned
scope: A person or thing counts because of a title held or skills earned, not because of someone else's
  name; in her own right, in his own right, and in one's own right are other names for this.
examples:
- The novel is an excellent book in its own right.
- This opera is a fine work in its own right.
