simpleMeaning: A tiny germ shaped like a spindle, most of all one whose middle bulges where it holds a
  hard seed-like part.
scope: This is a tiny germ shaped like a spindle, most of all one whose middle bulges; clostridia is another
  name for this sense, not a germ with no hard seed-like part inside and not a round germ.
examples:
- The clostridium looked like a spindle under the microscope.
- Each clostridium holds a hard seed-like part in its swollen middle.
