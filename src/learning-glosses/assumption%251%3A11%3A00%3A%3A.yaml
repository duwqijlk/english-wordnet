simpleMeaning: In Christian belief, the taking up of the Virgin Mary's body and soul into heaven when
  her life on earth had ended.
scope: Not the feast day that marks it, nor the death of Mary; the taking up of Mary's body and soul into
  heaven.
examples:
- The Assumption tells how Mary was taken up into heaven.
- Artists paint the Assumption with Mary rising to heaven.
