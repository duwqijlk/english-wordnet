simpleMeaning: in a way that leaves no doubt at all, so anyone can see it is true; in everyday talk, the
  short form is often used for this word
scope: In a way that leaves no doubt; also called obviously, apparently, plain, or evidently; not doing
  a thing in a simple way without anything extra.
examples:
- You are plainly wrong.
- She was plainly in pain.
