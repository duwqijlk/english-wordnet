simpleMeaning: in mathematics, a rule that pairs every member of one set with a member of another set
scope: This is the mathematical link between two sets, not a purpose or use, a duty or role, a relation
  in which one thing depends on another, a social gathering, or a computer routine.
examples:
- Students learn to graph a function in algebra class.
- For each input, the function gives exactly one output.
