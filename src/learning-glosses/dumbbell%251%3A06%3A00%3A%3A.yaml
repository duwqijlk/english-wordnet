simpleMeaning: a weight used for exercise, made of two round balls joined by a short bar that you hold
  in your hand
scope: A small weight you hold in one hand for exercise, not a long bar with weights at both ends that
  you lift with two hands.
examples:
- She lifts a heavy dumbbell with each hand every morning.
- He picked up the dumbbell and did ten lifts.
