simpleMeaning: A common North American spring-flowering woodland herb with a purple-and-green hood arched
  over an upright club-shaped spike and bright red berries.
scope: This sense is the American woodland herb with a striped hood, also called wake-robin; it is not
  the European arum that yields arum starch.
examples:
- A jack-in-the-pulpit stood beside the trail, its striped hood arched over the spike.
- We found jack-in-the-pulpit blooming in the damp woods last April.
