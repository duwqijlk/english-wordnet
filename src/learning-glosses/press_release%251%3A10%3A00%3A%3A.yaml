simpleMeaning: A notice sent to news writers to add to or take the place of something said aloud
scope: This is a notice sent to news writers to add to or take the place of something said aloud; release
  and handout are other names for it, not a news story and not a speech.
examples:
- The firm sent out a press release about the new drug.
- A press release took the place of the spoken talk.
