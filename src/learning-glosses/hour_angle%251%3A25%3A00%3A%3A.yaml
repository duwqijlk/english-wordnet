simpleMeaning: The angle of a point in the sky, west along the sky's middle line from overhead, the right
  ascension for one watching at a set place and time of day.
scope: In astronomy, the angle of a point in the sky, west along the sky's middle line from overhead,
  the right ascension for one watching at a set place and time of day, unlike the sense for the angle
  along the sky's middle line from the watcher's noon line to the hour ring of a given body in the sky.
examples:
- The hour angle tells where the star stands.
- They worked out the hour angle for the night.
