simpleMeaning: a hard flat road on the ground at an airport for planes to move slowly along on their way
  to or from the runway
scope: 'Another name for a taxi strip: a road for planes to move slowly on at an airport, not the runway
  itself and not a road for cars.'
examples:
- The plane followed the taxiway to the end of the runway.
- A taxiway links the gates to the runway at the airport.
