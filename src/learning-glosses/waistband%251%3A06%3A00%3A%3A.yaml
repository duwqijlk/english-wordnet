simpleMeaning: A band of material round the waist that makes a skirt or trousers stronger.
scope: A band round the waist that strengthens a skirt or trousers; sash is another name for this sense,
  and it is not a belt worn for show nor the waist itself.
examples:
- The waistband of her skirt was too tight.
- He sewed a new waistband onto the trousers.
