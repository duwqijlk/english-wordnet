simpleMeaning: The study of working out the hidden meaning of codes, ciphers, and secret writings.
scope: Also called cryptanalytics, cryptology, and cryptography; the study of reading secret messages,
  not the writing of ordinary messages or the study of languages.
examples:
- The cryptanalysis team worked for weeks to read the coded message.
- She studied cryptanalysis so she could break enemy codes.
