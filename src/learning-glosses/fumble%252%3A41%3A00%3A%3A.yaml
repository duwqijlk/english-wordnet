simpleMeaning: to do something very badly and ruin it
scope: 'Also called blow, spoil and fluff: to do something badly and ruin it, not to drop a ball and not
  to move in a clumsy way feeling for the way.'
examples:
- She fumbled her lines and ruined the play.
- I fumbled the cooking and burned the dinner.
