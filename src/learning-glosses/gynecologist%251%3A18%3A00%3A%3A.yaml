senseId: 'gynecologist%1:18:00::'
synsetId: 10173582-n
simpleMeaning: a doctor trained to care for the health of women, and to treat problems with the body parts
  used for having babies
scope: This is a doctor for women and the body parts used for having babies, not a doctor for all people
  and not a doctor for children.
examples:
- She saw a gynecologist for a check on her health as a woman.
- The gynecologist treated a problem with the parts of her body used for having babies.
