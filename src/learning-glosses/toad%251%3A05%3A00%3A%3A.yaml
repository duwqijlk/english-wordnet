simpleMeaning: one of many kinds of animal with no tail and a thick body and long back legs for jumping,
  that lives both in water and on land
scope: Also called a frog — another name for this same animal. This names the animal itself, with its
  thick body and long back legs for jumping.
examples:
- A toad sat by the pond, watching for flies.
- The toad jumped away when the dog came near.
