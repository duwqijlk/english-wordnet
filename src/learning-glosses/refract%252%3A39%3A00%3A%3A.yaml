senseId: 'refract%2:39:00::'
synsetId: 02116321-v
simpleMeaning: to make light bend as it goes from one thing, such as air, into another, such as water
scope: This is about making light bend as it goes into a new material; it is not about measuring how much
  a lens bends light to test eyes.
examples:
- The glass prism refracts the light into many colors.
- Water in the pool refracts the sun's light and makes the bottom look closer.
