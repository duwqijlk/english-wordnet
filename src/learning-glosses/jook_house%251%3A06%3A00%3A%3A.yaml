simpleMeaning: Songs played by a jukebox fill this small roadside place in the south-east of the United
  States, where people eat and drink and dance
scope: A small roadside place in the south-east of the United States for eating, drinking and dancing
  to jukebox music, also called jook, jook joint, juke, juke house or juke joint; not a restaurant with
  no dancing and not a dance hall in a town.
examples:
- The jook house on the edge of town had a jukebox in the corner.
- We spent the evening at the jook house, eating and dancing.
