senseId: 'ahimsa%1:10:00::'
synsetId: 06802658-n
simpleMeaning: A teaching that people should not use violence, since every living thing is holy, held
  above all by Jains and also by Buddhists and Hindus.
scope: This teaching holds every living thing holy and turns people away from violence; it is not a teaching
  that allows harm to living things.
examples:
- He lived by ahimsa and would not harm even the smallest creature.
- Under ahimsa, she refused to kill even an insect.
