simpleMeaning: An engineer who works out where the edges of a piece of land lie and how high the ground
  or a building stands.
scope: An engineer who fixes the edges and heights of land and buildings, not a person who carries out
  a survey of opinions or facts.
examples:
- The surveyor marked the edge of the field with pegs.
- A surveyor measured the height of the new tower.
