simpleMeaning: A record of a mix that has been split apart, made on a paper strip or in a tall tube where
  each part is held fast
scope: This record shows the parts of a mix held fast on a paper strip or in a tall tube.
examples:
- He held up the chromatogram to show the parts of the mix.
- She read the chromatogram to see what was in the sample.
