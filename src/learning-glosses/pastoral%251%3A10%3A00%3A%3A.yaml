simpleMeaning: a piece of music that makes a person think of life in the country
scope: Also called idyll. This is a piece of music that brings country life to mind, not a book or poem
  about country life and not a word for describing country life.
examples:
- She wrote a pastoral for piano, with soft sounds of birds and fields.
- The concert ended with a pastoral that made us think of quiet villages.
