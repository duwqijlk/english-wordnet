simpleMeaning: relating to or like animals that eat meat
scope: Relating to animals that eat meat and the way they live, not to animals that eat only plants.
examples:
- Lions and other carnivorous animals hunt other animals for food.
- The wolf has sharp carnivorous teeth made for tearing meat.
