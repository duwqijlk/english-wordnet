simpleMeaning: the length of a straight line from the center of a circle or a round ball to its outer
  edge
scope: This is the length of the line from the center to the outer edge. It is not the line itself, and
  not the bone in the lower arm.
examples:
- The radius of the circle is five centimetres.
- If the radius is three metres, the circle is six metres across.
