senseId: emeritus%5:00:00:old:02
synsetId: 01649932-s
simpleMeaning: Left one's work with honour, but still keeping one's title, with an added word after it
  to mark retirement, as with a retired professor.
scope: Not the noun for a retired professor or minister, this is the word added after a title to show
  the holder has retired with honour but keeps the title.
examples:
- They are now professor emeritus at the university.
- After forty years of teaching, they became emeritus.
