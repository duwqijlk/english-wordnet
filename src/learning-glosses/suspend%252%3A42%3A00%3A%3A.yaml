senseId: 'suspend%2:42:00::'
synsetId: 02649824-v
simpleMeaning: to make something not work or not count for a short time
scope: This is to make a thing, rule or sentence not work or not count for a short time, not to stop a
  thing going on by a hold and not to hold small bits in a liquid.
examples:
- The court suspended his prison sentence, so he did not go to prison then.
- The club suspended her membership for a month after the fight.
