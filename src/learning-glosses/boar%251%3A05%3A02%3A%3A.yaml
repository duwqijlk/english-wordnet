simpleMeaning: A wild pig of the Old World with a slim body and prominent tusks; most farm pigs descend
  from it, and it was brought to the United States.
scope: The wild ancestor of farm pigs, also called wild boar or Sus scrofa, not the uncastrated male hog
  that this same word can name.
examples:
- We heard a boar crashing through the undergrowth.
- The boar lowered its tusks and charged.
