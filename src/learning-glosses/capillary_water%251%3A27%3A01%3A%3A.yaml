simpleMeaning: wetness left in soil after the part pulled down by weight drains away, held as a thin coat
  round soil grains and moved by the pull of narrow spaces
scope: Wetness left in soil after the part pulled down by weight drains away, held as a thin coat round
  soil grains and moved by the pull of narrow spaces; not the water that drains away freely and not rain
  on the surface.
examples:
- Capillary water clings to the grains of soil after rain.
- The roots drew on capillary water in the dry weeks.
