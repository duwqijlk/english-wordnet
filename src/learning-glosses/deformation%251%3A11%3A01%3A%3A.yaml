simpleMeaning: a change in the shape or size of a thing caused by a force put on it
scope: A change in shape or size caused by a force put on a thing. It is not the act of twisting or bending
  something out of shape.
examples:
- A heavy weight left a deformation in the metal bar after it had pressed down on it for days.
- The deformation of the steel plate was clear where the great force had pushed it out of shape.
