simpleMeaning: From the northwestern United States, this tall herb has bunches of white flowers flushed
  with green, and it is sometimes placed in the group Swertia.
scope: This tall herb grows in the northwestern United States, with white flowers flushed with green.
examples:
- We found green gentian in the northwestern United States.
- The green gentian's flowers were white, flushed with green.
