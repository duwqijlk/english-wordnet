simpleMeaning: shared rules and agreed ways of acting that all who belong to one group must follow
scope: These are shared rules and agreed ways of acting that bind all who belong to one group; code of
  conduct is another name for this sense, and they are not a law of the land or one person's own rules.
examples:
- The new members learned the code of behavior for their club.
- Breaking the code of behavior could cost her a place in the group.
