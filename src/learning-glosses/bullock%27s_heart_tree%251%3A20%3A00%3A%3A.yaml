simpleMeaning: Wide at the top and narrow at the bottom, its rough sour fruit grows on a small tree of
  warm America.
scope: Also called bullock's heart and bullock heart, a small tree of warm America, not the fruit it bears.
examples:
- The bullock's heart tree was full of rough sour fruit.
- Under the bullock's heart tree we found fruit wide at the top and narrow below.
