simpleMeaning: A garment that guards a surgeon during an operation
scope: A protective coat for surgery, not a long formal dress for women, not a ceremonial robe, and not
  a loose dress worn in bed.
examples:
- The surgeon put on a clean gown before the operation started.
- Nurses helped the surgeon tie the back of her gown.
