simpleMeaning: A boat needs a certain minimum depth of water under it to float.
scope: 'The nautical sense: how much water a boat needs beneath it to float, not letting air move through
  a room, and not moving along slowly.'
examples:
- The freighter draws too much water to enter the harbour.
- This boat draws only a metre, so it can reach the shallow creek.
