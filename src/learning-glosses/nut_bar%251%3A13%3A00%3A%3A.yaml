simpleMeaning: A sweet food cut into long flat pieces, made from a thick paste of sugar and crushed kernels
  on a pastry base
scope: A sweet food in long flat pieces made from a thick paste of sugar and crushed kernels, not a loaf
  of bread and not a cake.
examples:
- She cut the nut bar into squares for the children.
- He bought a nut bar at the bakery.
