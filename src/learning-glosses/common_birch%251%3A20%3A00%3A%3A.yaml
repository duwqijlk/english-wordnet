simpleMeaning: Its branches droop a lot, and its bark comes off in silvery white strips; this tree grows
  in Europe.
scope: Also called silver birch, it is a tree of Europe whose bark peels off in silvery white strips.
examples:
- The common birch has bark that peels off in silvery white strips.
- The branches of the common birch droop a lot.
