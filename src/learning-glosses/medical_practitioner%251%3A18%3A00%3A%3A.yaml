simpleMeaning: A person who treats sick people and gives them care for their health
scope: A person who treats the sick for a living; not the whole body of healers and not a written account
  of a patient's care.
examples:
- The medical practitioner listened to her chest and wrote a note.
- Our medical practitioner visits the village twice a week.
