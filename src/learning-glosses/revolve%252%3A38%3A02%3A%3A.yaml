simpleMeaning: to make something turn over and over, going round and round as if on a fixed line through
  its middle
scope: 'Also called roll: to make a thing turn over and over round a line through it, not to go round
  and round something else.'
examples:
- She revolved the globe to find Australia.
- The wheel revolved slowly on its axle.
