senseId: 'drop%1:15:00::'
synsetId: 08601320-n
simpleMeaning: A secret spot chosen in advance where illegal goods, such as drugs or stolen property,
  are left and then passed on to others.
scope: This is a secret prearranged site for illegal goods, not an ordinary place where things are left
  or collected, not a small round shape, not a small amount of liquid, not a sudden fall or decrease,
  not a cliff face, not a stage curtain, not the act of letting something fall, and not any verb sense
  such as falling, lowering, leaving out, or giving birth.
examples:
- The couriers left the parcel at a secret drop on the edge of town and never met the buyer.
- Police watched the alley for hours, waiting for someone to collect the money from the drop.
