simpleMeaning: Set out by trade in A-to-Z order, this book lists firms and what they sell, with paid ads,
  most often printed on gold paper.
scope: It is the part of the phone book that lists firms and what they sell, beside the part that lists
  people's names.
examples:
- A plumber's number was listed in the yellow pages by trade.
- For a tyre shop, the yellow pages are the place to look.
