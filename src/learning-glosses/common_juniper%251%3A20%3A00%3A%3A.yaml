simpleMeaning: a shrub or small tree of dense branching whose sharp-smelling blue berries flavor gin;
  it grows throughout the Northern Hemisphere and is the only conifer on Iceland's and Greenland's coasts.
scope: This is the widespread northern juniper whose sharp-smelling blue berries flavor gin, not the ornamental
  junipers planted in gardens.
examples:
- A low, densely branched common juniper grew beside the path, heavy with blue berries.
- Common juniper is the only conifer found on the coasts of Iceland and Greenland.
