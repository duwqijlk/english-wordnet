simpleMeaning: In Judeo-Christian theology, the belief that God made this world out of nothing
scope: The belief that God made the world out of nothing, not the belief that the world was made from
  stuff that was already there.
examples:
- Creatio ex nihilo is the belief that God made the world from nothing.
- The preacher spoke about creatio ex nihilo in his talk on how the world began.
