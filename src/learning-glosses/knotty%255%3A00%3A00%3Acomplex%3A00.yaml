simpleMeaning: very hard to follow because it has many small, linked parts, and sometimes it is tricky
  or dishonest
scope: 'Also called involved, tangled, convoluted, tortuous and labyrinthine: this describes a thing that
  is very hard to follow, not a problem that is hard to solve and not string that is twisted together.'
examples:
- The knotty rules have so many linked parts that even lawyers find them hard to follow.
- The chairman kept his place by knotty, dishonest moves that no one could fully follow.
