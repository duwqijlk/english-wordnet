simpleMeaning: With bunches of rosy purple flowers where leaves meet the stem, this Old World plant lives
  many years, stands up or lies flat, and was brought to the United States.
scope: It is also called cheese, cheeseflower, or tall mallow.
examples:
- We found high mallow in bloom.
- She picked high mallow.
