simpleMeaning: Describes what names, is ruled by, or has to do with a bishop or bishops.
scope: Describes what names, is ruled by, or has to do with a bishop or bishops, not what belongs to a
  priest alone and not what belongs to no church at all.
examples:
- The episcopal church is ruled by bishops.
- She wore episcopal robes for the service.
