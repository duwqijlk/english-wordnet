simpleMeaning: cloth used to make the large pieces of cloth that cover a bed
scope: The cloth itself that bed sheets are made from, not one finished sheet and not a thin flat piece
  of paper or metal.
examples:
- She bought white sheeting to make new bed sheets.
- The shop sells strong cotton sheeting by the metre.
