simpleMeaning: 'In the long story of how living things grew and changed, this part of the brain came last:
  the outer layer of the brain and the parts with it'
scope: The newest part of the brain in the long story of life, also called neoencephalon, not the older
  parts of the brain and not the whole brain.
examples:
- The neencephalon is the newest part of the brain.
- Scientists study the neencephalon to learn how the brain grew.
