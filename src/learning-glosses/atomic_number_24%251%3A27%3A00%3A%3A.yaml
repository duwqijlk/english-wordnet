simpleMeaning: A hard metal that breaks easily and can join with many other atoms; it does not rust or
  lose its shine.
scope: Also called Cr and chromium; a hard metal that breaks easily, can join with many other atoms, and
  does not rust or lose its shine.
examples:
- Atomic number 24 is a hard metal that does not rust.
- The tool was coated with atomic number 24 to keep its shine.
