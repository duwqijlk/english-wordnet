simpleMeaning: about the front part of a mass of air that is moving forward
scope: About the front of moving air; not about the forehead, and not about the front part of a thing
  in general.
examples:
- Frontal rainfall is common when warm air meets cold air.
- A frontal system brought heavy rain to the coast.
