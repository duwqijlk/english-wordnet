simpleMeaning: The sickness of a starchy root crop that turns its plants a pale gold colour and keeps
  them short
scope: This is the sickness of a starchy root crop that turns its plants a pale gold colour and keeps
  them short; yellow dwarf of potato is another name for this sense, not the blight sickness of the same
  crop, and not a sickness of grain.
examples:
- Potato yellow dwarf stunted the plants in the field.
- The crop showed potato yellow dwarf after the dry spring.
