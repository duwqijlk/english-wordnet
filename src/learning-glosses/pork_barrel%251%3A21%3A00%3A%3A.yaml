simpleMeaning: money set aside by lawmakers to win favor with the people they serve
scope: Also called pork, this is money set aside by lawmakers to win favor with the people they serve,
  not a barrel for storing things.
examples:
- Critics said the new road was just pork barrel spending to please voters in that district.
- The senator was accused of using pork barrel projects to win support back home.
