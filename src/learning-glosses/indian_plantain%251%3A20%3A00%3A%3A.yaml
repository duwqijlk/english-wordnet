simpleMeaning: Any of several plants of the genus Cacalia with leaves shaped like those of a common low
  weed.
scope: Any of several plants of the genus Cacalia, with leaves like those of a low weed; not a single
  plant, and not the low weed itself.
examples:
- The Indian plantain grows in the damp wood.
- Indian plantain leaves look like those of a common weed.
