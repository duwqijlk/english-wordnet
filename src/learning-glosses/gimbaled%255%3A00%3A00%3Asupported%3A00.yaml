simpleMeaning: When the base tips, it stays steady and level, held up by supports that turn
scope: Held on turning supports so it stays level when its base tips, not fixed solidly in place and not
  held up by a spring.
examples:
- The gimbaled compass stayed level even as the ship rolled.
- A gimbaled lamp keeps its light steady when the table tips.
