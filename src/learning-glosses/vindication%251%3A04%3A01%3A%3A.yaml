senseId: 'vindication%1:04:01::'
synsetId: 01243896-n
simpleMeaning: the act of showing that a person or idea is right, or of standing up for them against blame
  or hard words against them
scope: 'Also called exoneration: the act of showing someone is right or standing up for them, not just
  the feeling of being proved right.'
examples:
- His friends gave a clear vindication of his position.
- She saw the report as a vindication after months of blame.
