simpleMeaning: Muscles that turn the shoulder blade and lift the rib cage
scope: 'Also called anterior serratus muscle, musculus serratus anterior, or serratus magnus: muscles
  that turn the shoulder blade and lift the rib cage, not the chest muscle that pulls the arm in and not
  a back muscle that only lifts the shoulder.'
examples:
- The serratus anterior turns the shoulder blade.
- Injury to the serratus anterior makes lifting hard.
