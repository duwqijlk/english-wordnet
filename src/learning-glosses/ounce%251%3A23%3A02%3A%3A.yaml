simpleMeaning: a unit of weight used in old medicine, equal to 480 tiny weight units called grains, or
  one twelfth of a troy pound
scope: An old medicine weight, not the common weight of one sixteenth of a pound and not the big wild
  cat; a troy pound is a pound once used for gold and medicine.
examples:
- The old book gave the dose in ounces of apothecary weight.
- One ounce of the powder was weighed on the brass scales.
