simpleMeaning: In philosophy, the view that power is the stuff of all things, and that each change we
  see is one kind of power turning into another
scope: In philosophy, this is the view that power is the stuff of all things and each change is one kind
  of power turning into another; energetism is another name for it, not the view that matter is the stuff
  of all things and not the view that mind is.
examples:
- Energetic monism holds that power is the stuff of all things.
- Ostwald's energetic monism grew from his work in science.
