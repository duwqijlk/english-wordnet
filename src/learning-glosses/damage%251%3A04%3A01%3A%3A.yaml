simpleMeaning: Harm or loss caused by someone breaking a legal right.
scope: Harm that comes from a legal wrong; not physical harm in general, not the act of causing harm,
  not a loss of military equipment, and not the sum of money needed to buy something.
examples:
- The court awarded her compensation for damage caused by the breach of contract.
- He sued the newspaper for damage to his professional reputation.
