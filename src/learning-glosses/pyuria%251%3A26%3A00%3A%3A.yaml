senseId: 'pyuria%1:26:00::'
synsetId: 14340010-n
simpleMeaning: The presence of white blood cells in the urine, a sign of an infection of the parts that
  make and carry urine.
scope: White blood cells in urine that point to an infection of the parts that make, hold and carry urine,
  not blood in urine and not the infection itself.
examples:
- The lab found pyuria in her sample, so the doctor looked for an infection.
- His pyuria was a sign that his urinary tract was infected.
