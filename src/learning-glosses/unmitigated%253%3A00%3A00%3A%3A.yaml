simpleMeaning: not made less strong or less bad in any way; sometimes used to make another word stronger
scope: Full and strong, with nothing made less, not a small harm or feeling that has been partly softened.
examples:
- The storm was an unmitigated disaster for the town.
- His anger was unmitigated, and nothing could calm him.
