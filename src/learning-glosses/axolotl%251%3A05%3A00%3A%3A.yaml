simpleMeaning: A young salamander-like animal of mountain lakes in Mexico that usually stays in its young
  form instead of changing into an adult form
scope: A water animal that usually stays in its young form all its life, not a grown salamander that has
  changed form; mud puppy is another name for it.
examples:
- The axolotl in the tank stayed in its young form in the water.
- The axolotl swam slowly in the mountain lake, still in its young form.
