simpleMeaning: In astronomy, a measure of time set by the Earth's path round the sun; it is mean solar
  time put right for the unevenness of the Earth's movements
scope: This measure of time is also called ephemeris time, terrestrial dynamical time, terrestrial time
  and TDT; it is not ordinary clock time and not Greenwich Mean Time.
examples:
- TT is used by astronomers to track the planets.
- The table gave the time in TT.
