senseId: 'obviation%1:04:00::'
synsetId: 01080966-n
simpleMeaning: Seeing a thing coming and dealing with it well is how it is stopped from happening
scope: Seeing a thing coming and dealing with it well is how it is stopped from happening, also called
  forestalling and preclusion; not stopping a thing after it has happened and not putting a thing off
  for later.
examples:
- Early talks brought about the obviation of the dispute.
- His quick action meant the obviation of a costly delay.
