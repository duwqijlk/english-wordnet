simpleMeaning: a tool that measures amounts of heat
scope: A tool that measures how much heat there is, not a thermometer that measures how hot a thing is
  and not a heater.
examples:
- The calorimeter showed how much heat the burning fuel gave off.
- She put the sample in the calorimeter to measure its heat.
