simpleMeaning: any of several small orchids of warm and cool lands, with spotted or striped leaves and
  spikes of small pale yellow-white flowers in a twisted cluster
scope: Also called helleborine; a small spotted-leaf orchid, not the plantain weed and not a rattlesnake.
examples:
- The rattlesnake plantain grows in the shade of the pine woods.
- We found a rattlesnake plantain with striped leaves beside the path.
