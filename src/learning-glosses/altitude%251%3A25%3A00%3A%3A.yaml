synsetId: 13920350-n
simpleMeaning: In a flat shape, the straight line from its base to the farthest point or side, meeting
  the base at a right angle.
scope: In a flat shape, the straight line from its base to the farthest point or side, not height above
  the sea and not an angle above the horizon.
examples:
- The altitude of the triangle was six inches.
- Draw the altitude from the base to the top corner of the figure.
