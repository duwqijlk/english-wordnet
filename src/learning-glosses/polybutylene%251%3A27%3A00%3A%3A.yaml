scope: Also called polybutene, this is a man-made material made by joining many small parts of butylene,
  a chemical, used in oils that help machines move and in man-made rubber, not a natural rubber.
examples:
- Polybutylene is used in the oil that keeps the machine parts moving.
- They mix polybutylene into man-made rubber to help it bend and last.
