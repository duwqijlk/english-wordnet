simpleMeaning: To make a target stop working and no longer able to be used, shots are aimed at it
scope: Shooting meant to put a target out of action, not shooting that only holds the other side down
  and not shooting that destroys a place outright.
examples:
- The guns laid down neutralization fire on the hill so the enemy could not use it.
- Neutralization fire kept the bridge closed to the other side.
