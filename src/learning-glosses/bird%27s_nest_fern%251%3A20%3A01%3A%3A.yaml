simpleMeaning: In the forks of trees, this warm-climate plant of the Old World or Australia often makes
  bunches, growing on other plants.
scope: This warm-climate plant grows on other plants and makes bunches in tree forks, not rooted in the
  ground.
examples:
- A bird's nest fern formed a bunch in the fork of a tree.
- The bird's nest fern grows on other plants in warm lands.
