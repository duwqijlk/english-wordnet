simpleMeaning: having to do with the care of the soft living part inside a tooth, or with the work of
  a dentist who does that care
scope: Having to do with the care of the soft living part inside a tooth, not with the care of the outside
  of a tooth and not with pulling teeth out.
examples:
- She went to an endodontic specialist for the pain in her tooth.
- His endodontic work fixed the soft living part inside the tooth.
