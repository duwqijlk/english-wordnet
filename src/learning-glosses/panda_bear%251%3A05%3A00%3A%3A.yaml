simpleMeaning: In the bamboo woods of China and Tibet lives a big black-and-white plant-eater that some
  count a bear and others put in a family of its own.
scope: 'It is also called panda, coon bear and giant panda: the black-and-white bamboo eater whose family
  is in dispute.'
examples:
- The panda bear eats bamboo.
- Panda bears live in the bamboo forests of China.
