simpleMeaning: a crop grown mainly for its seeds, which are good to eat, rather than for the pod around
  them
scope: A plant grown for its seeds, which are good to eat, rather than for the pod around them, also called
  shell bean; not a plant grown for its pods, and not a plant grown for its leaves.
examples:
- The shell bean plant in the back garden gives us seeds for soup.
- A shell bean plant grows pods that we open for the seeds.
