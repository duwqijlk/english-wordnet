simpleMeaning: A machine stitch in which the upper thread links with the thread on the bobbin below
scope: A machine stitch in which the upper thread links with the bobbin thread, not a hand stitch and
  not a stitch where the threads do not link.
examples:
- The sewing machine sewed a neat lockstitch.
- A lockstitch holds the seam firm.
