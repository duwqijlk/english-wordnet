simpleMeaning: to wash or wipe something with a cleaning tool that has soft cloth or loose threads fixed
  to a handle, or with something used in the same way
scope: To wash or wipe something with a mop, or with something used in the same way as a mop; not to make
  a sad face with the lower lip pushed out, and not the cleaning tool itself.
examples:
- Mop the hallway now, before the guests come.
- He mopped her forehead with a wet towel.
