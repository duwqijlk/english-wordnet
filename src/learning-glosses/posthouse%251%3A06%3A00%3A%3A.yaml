simpleMeaning: a place where riders could stay the night and change their horses for fresh ones
scope: Also called post house, this is a place for riders to stay and change horses, not a modern hotel
  and not a stable for horses alone.
examples:
- The riders stopped at the posthouse to rest and change horses before they rode on.
- The old posthouse by the road gave travellers food and a bed for the night.
