simpleMeaning: able to be followed or found by following a path, a course, or signs left along the way
scope: 'Also called trackable: able to be followed or found by signs or marks. Not the sense where a thing
  can be linked back to the person or cause it came from.'
examples:
- The old road is still traceable across the hills if you look for the stones along it.
- The river is traceable on the map from the hills down to the sea.
