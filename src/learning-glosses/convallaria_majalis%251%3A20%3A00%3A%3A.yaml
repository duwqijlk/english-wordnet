simpleMeaning: A low plant that lives many years, usually with two big long leaves shaped like spearheads
  and a spray of small sweet-smelling hanging bell-shaped flowers, then scarlet berries.
scope: Also called lily of the valley or May lily; a low plant with two big leaves and hanging bell-shaped
  flowers followed by scarlet berries, kin to other plants with bell-shaped flowers.
examples:
- Convallaria majalis fills the bed with sweet-smelling hanging bells.
- The Convallaria majalis by the fence has two big leaves and scarlet berries.
