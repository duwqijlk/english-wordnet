simpleMeaning: A book that comes out each year with star tables that give where the sky bodies stand through
  the year
scope: This is a book that comes out each year with star tables that give where the sky bodies stand through
  the year, not a star map for one night and not a book of star stories.
examples:
- The ephemeris gave where the sky bodies would stand through the year.
- Today computers calculate the ephemerides.
