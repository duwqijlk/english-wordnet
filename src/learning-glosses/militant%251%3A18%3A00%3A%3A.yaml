simpleMeaning: a person who uses strong, fighting ways to try to bring change and make things better
scope: A person who fights hard to bring change and make things better, not a soldier in a war and not
  a person who only talks about change.
examples:
- The militant led the protest and demanded a new law.
- As a young militant, he worked day and night for change.
