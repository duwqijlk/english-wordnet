simpleMeaning: to make someone act through force, endless urging, pressure they cannot resist, or strong
  encouragement.
scope: Not a mere suggestion or invitation; this sense involves unrelenting pressure or strong motivation.
examples:
- Hunger drove the settlers to eat the last of their seed grain.
- Her coach drove the team through six hours of drills without a single break.
