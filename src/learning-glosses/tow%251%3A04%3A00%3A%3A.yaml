simpleMeaning: the act of pulling something, such as a car, with a rope or with a hitch, a part that joins
  the thing to what pulls it
scope: This is the act of pulling something, such as a car, with a rope or a hitch; it is not the verb
  for doing the pulling.
examples:
- Our car broke down, so a truck gave us a tow to the garage.
- He paid for a tow after his car stopped on the road.
