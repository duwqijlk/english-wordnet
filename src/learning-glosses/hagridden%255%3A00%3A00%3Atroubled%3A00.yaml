simpleMeaning: Troubled again and again by bad dreams or fears that have no good reason.
scope: Troubled again and again by bad dreams or fears that have no good reason; tormented and hag-ridden
  are other names for this sense, not the quality of having no courage and not a passing fright at one
  single thing.
examples:
- She was hagridden by bad dreams night after night.
- He felt hagridden by fears that had no good reason.
