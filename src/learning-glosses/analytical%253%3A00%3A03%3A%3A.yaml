senseId: 'analytical%3:00:03::'
synsetId: 00113042-a
simpleMeaning: using or good at a way of thinking that splits a whole, of the mind or of matter, into
  its basic parts or basic truths
scope: 'Also called analytic: using or good at splitting a whole into its parts to understand it, not
  just being careful or clever in a general way.'
examples:
- She has an analytical mind and breaks each problem into small parts.
- He took an analytical approach to the report, checking each part in turn.
