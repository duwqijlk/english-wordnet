simpleMeaning: in rivers and lakes, a common weed floats with a ring of wedge-shaped leaves, a plant of
  warm lands everywhere
scope: 'Also called pistia and water lettuce: a weed of rivers and lakes in warm lands everywhere; not
  a cabbage grown to eat.'
examples:
- Water cabbage floats on the slow river, its leaves spread in a ring.
- The lake was choked with water cabbage.
