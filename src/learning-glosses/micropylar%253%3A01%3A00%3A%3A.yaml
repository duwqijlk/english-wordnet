simpleMeaning: Of or relating to a micropyle, a very small opening in a seed or egg.
scope: Of or relating to a micropyle, a very small opening in a seed or egg; not the tiny opening itself,
  and not of or relating to seeds in general.
examples:
- The micropylar opening lets the pollen tube enter the seed.
- A micropylar pore can be seen at one end of the egg.
