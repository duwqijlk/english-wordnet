simpleMeaning: A pull on iron, linked with flows of electric charge and with magnets, and marked by fields
  of force
scope: A pull on iron linked with electric flows, magnets and fields of force, not a pull on wood and
  not the magnet itself; magnetism and magnetic force are other names for this sense.
examples:
- The magnetic attraction pulled the iron nail toward the magnet.
- Magnetic attraction grows stronger as the iron comes closer.
