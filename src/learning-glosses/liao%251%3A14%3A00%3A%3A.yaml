simpleMeaning: The ruling family that held much of Manchuria and north-east China from 947 to 1125.
scope: It is a ruling family of Manchuria and north-east China, not a later Chinese ruling family and
  not a tribe; also called Liao dynasty.
examples:
- The Liao ruled Manchuria from 947 to 1125.
- Liao power reached into north-eastern China.
