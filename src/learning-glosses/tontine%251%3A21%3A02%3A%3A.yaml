synsetId: 13368765-n
simpleMeaning: a kind of life insurance in which, when a member dies or fails to pay, that member's share
  goes to the other members
scope: A kind of life insurance, also called tontine insurance, and not the annuity scheme in which living
  members share benefits over a set time.
examples:
- He joined a tontine with his business partners.
- When a member of the tontine died, the survivors divided her share.
