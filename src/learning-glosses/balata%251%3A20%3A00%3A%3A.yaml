simpleMeaning: In warm lands stands a hard-wood tree; it gives a gum, and its wood is heavy and red.
scope: This is a balata tree, also called a beefwood or a bully tree, and it is not the dried gum itself.
examples:
- They tapped the balata for the gum it gives.
- They cut the balata for its heavy red wood.
