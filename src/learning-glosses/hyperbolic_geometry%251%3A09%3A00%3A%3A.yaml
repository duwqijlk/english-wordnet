simpleMeaning: 'In mathematics, this kind of shape study drops the usual rule about parallels: through
  any point on a flat surface, two or more lines never meet a given line.'
scope: It is the kind of shape study that drops the usual rule about parallels.
examples:
- Karl Gauss pioneered hyperbolic geometry.
- In hyperbolic geometry, two lines through one point both miss a third line.
