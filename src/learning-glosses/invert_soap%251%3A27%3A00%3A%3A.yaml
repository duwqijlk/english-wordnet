simpleMeaning: A kind of man-made cleaner whose part that works on surfaces is a tiny bit with a positive
  charge, called a cation
scope: A kind of man-made cleaner whose part that works on surfaces carries a positive charge, also called
  cationic detergent; not an ordinary soap and not a cleaner that works some other way.
examples:
- The lab tested an invert soap on the greasy cloth.
- Invert soap is used where a wash with a positive charge is needed.
