simpleMeaning: not done or said in the straight, right way, and able to lead people to think the wrong
  thing
scope: 'Also called devious: not straight or direct in what is said or done, not a slanting line and not
  the muscle at the side of the body.'
examples:
- He gave oblique answers and never said what he really meant.
- She used oblique words to hide the truth from us.
