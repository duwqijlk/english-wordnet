simpleMeaning: Swelling and soreness of the whole heart, in its outer layer, its muscle, and its inner
  layer
scope: Swelling and soreness of the whole heart, all three of its layers, not of the heart muscle alone
  and not of one layer only.
examples:
- Pancarditis left him weak for weeks after the infection.
- The doctor said the pancarditis had spread through all three layers of her heart.
