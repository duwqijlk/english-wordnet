simpleMeaning: In baseball, the fourth place in the order in which players hit the ball, usually filled
  by the best hitter on the team
scope: In baseball, the fourth hitting place, usually for the best hitter; not the act of making a place
  clean and tidy.
examples:
- Our best player batted cleanup in every game this season.
- The coach moved her to cleanup because she hits with great power.
