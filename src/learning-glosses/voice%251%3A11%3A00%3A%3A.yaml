simpleMeaning: a sound that seems to be speaking or calling, though it does not come from a person.
scope: Not a real person speaking and not an opinion; it is another sound that makes you think of a person's
  voice.
examples:
- The voice of the wind howled through the trees.
- He heard the voice of the sea in the shell.
