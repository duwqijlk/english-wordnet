simpleMeaning: Swelling and soreness of a cord-like part of the body, above all the cord joined to the
  male sex glands.
scope: This is swelling and soreness of a cord-like part of the body, above all the cord joined to the
  male sex glands; not swelling of a joint, and not swelling of the glands themselves.
examples:
- Funiculitis made the cord sore and swollen.
- The doctor said his funiculitis came from an infection in the cord.
