simpleMeaning: In philosophy, the teaching of the Cyrenaics that people should in the end aim at the pleasure
  of the present moment, paying no heed to pain that may follow.
scope: In philosophy, the teaching that people should aim at present pleasure, paying no heed to pain
  that may follow, distinct from teachings that prize duty or future gain.
examples:
- Cyrenaicism teaches that present pleasure is the aim of life.
- A follower of Cyrenaicism would choose the pleasure of the moment over a later gain.
