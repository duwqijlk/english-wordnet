simpleMeaning: Now at home in North America, this one-year plant of Europe bears bunches of greenish flowers,
  then red soft fruit like berries.
scope: 'Also called strawberry pigweed: a one-year plant of Europe with greenish flowers and red soft
  fruit like berries, now at home in North America.'
examples:
- The strawberry blite has bunches of greenish flowers.
- Strawberry blite now grows in North America as well as Europe.
