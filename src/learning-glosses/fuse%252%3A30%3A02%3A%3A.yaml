simpleMeaning: to turn a thing into liquid or soft stuff by heating it
scope: To melt a thing by heating it, not to become liquid by itself, not to fit a safety device, and
  not a device that starts burning.
examples:
- Heat fused the metal into a liquid pool.
- The glassblower fused the ends of the tubes.
