simpleMeaning: The tongue used in the government of the land of that name, built on Tagalog, taking many
  of its words from other tongues of the land
scope: This is the tongue used in the government of the Philippines; Filipino, Filipino language and Philippine
  are other names for this sense, and it is not the word for things of the Philippines.
examples:
- Philippine language is the official language of the Philippines.
- She speaks Philippine language every day.
