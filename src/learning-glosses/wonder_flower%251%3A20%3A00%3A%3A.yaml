simpleMeaning: White blossoms on tall stems, cut for winter and shipped to Europe and America, stay fresh
  a long time; the plant grows in South Africa and lives year after year
scope: Also called chincherinchee, this is a South African plant whose white blossoms are shipped to Europe
  and America for winter use.
examples:
- The wonder flowers in the vase came from South Africa.
- She bought wonder flowers for the winter months.
