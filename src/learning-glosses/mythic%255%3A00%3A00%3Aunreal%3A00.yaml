simpleMeaning: told of in old tales from long ago, or based on them, with no true facts or real past behind
  it
scope: 'Also called mythical, fabulous and mythological: from old tales, with no real facts behind it.
  It is not about a real person or event from the past.'
examples:
- The book tells of a mythic hero who never really lived.
- They spoke of a mythic island that no one has ever found.
