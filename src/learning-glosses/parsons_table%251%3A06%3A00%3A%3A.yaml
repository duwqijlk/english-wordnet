simpleMeaning: A strong four-sided piece of furniture with thick square legs at the corners, its top as
  wide as its legs.
scope: This is a strong four-sided piece of furniture with thick square legs at the corners and a top
  as wide as its legs, not a round piece of furniture and not one with thin legs.
examples:
- We ate dinner at the Parsons table.
- The Parsons table has thick square legs at the corners.
