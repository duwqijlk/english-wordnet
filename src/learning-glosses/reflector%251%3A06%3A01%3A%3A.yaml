simpleMeaning: a tool for looking at far away things that uses a large mirror curved inwards to make a
  picture, which a small glass part for the eye makes bigger
scope: Another name for this is reflecting telescope. It is a tool with a large curved mirror for looking
  at far away things, not a simple device that sends light back.
examples:
- He used a large reflector to look at the moon.
- The reflector in the garden let us see far away stars clearly.
