simpleMeaning: In maths, a way of writing maths so the order of the marks shows how the parts fit together,
  with no round brackets used to mark them off.
scope: Unlike the usual way of writing maths, which uses round brackets to mark the parts off, this way
  lets the order of the marks show how they fit together.
examples:
- The homework was written in parenthesis-free notation, with no round brackets anywhere in it.
- The book writes the maths out in parenthesis-free notation, with no round brackets at all.
