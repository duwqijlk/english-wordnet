simpleMeaning: to get something from a person by force or by frightening them
scope: 'Also called squeeze, rack, wring, and gouge: to get something by force or threats, not to ask
  for it freely or to earn it.'
examples:
- They extorted money from the shop owner by threatening him.
- He tried to extort a payment from her by frightening her.
