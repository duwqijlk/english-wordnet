simpleMeaning: Wood from any of several kinds of tree, used for floors, containers, thin sheets of glued
  wood, and handles for tools
scope: Wood from trees of this name, used for floors and containers, not the tree itself and not wood
  from other trees.
examples:
- The floor was made of beech.
- He carved the tool handle from a piece of beech.
