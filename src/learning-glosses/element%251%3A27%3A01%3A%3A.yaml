simpleMeaning: one of four basic things that people in ancient times and in the middle ages thought made
  up the whole world
scope: One of the four basic things people in ancient times and in the middle ages thought the world was
  made of, not a basic thing in science today and not a part of a machine or system.
examples:
- In old teaching, water was thought to be one of the four elements.
- Long ago, people believed earth, water, air and fire were the elements that made up the world.
