simpleMeaning: In a way that shows a clear aim, done on purpose and with a goal in mind
scope: In a way that shows a clear aim, done on purpose and with a goal in mind; not by chance, and not
  in a slow or lazy way.
examples:
- She walked purposefully to the front of the room and began to speak.
- He purposefully left the door open so the dog could come in.
