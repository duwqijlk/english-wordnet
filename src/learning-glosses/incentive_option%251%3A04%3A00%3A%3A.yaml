senseId: 'incentive_option%1:04:00::'
synsetId: 00082215-n
simpleMeaning: A choice given to a company's top bosses when the company meets certain money goals.
scope: A choice given to a firm's top bosses when the firm meets set money goals, with incentive stock
  option as another name for this sense, not a bonus paid in cash and not a choice open to all staff.
examples:
- He was given an incentive option when the firm met its money goals.
- Her incentive option came into play after the firm hit its set money goals.
