simpleMeaning: too careful about small things and easily feeling sick or upset at dirty or unpleasant
  things
scope: 'Also called nice, dainty, and prissy: too fussy and easily upset by dirty things, not just careful
  in a normal way and not ill.'
examples:
- He is too squeamish about his food to eat camp cooking.
- She is so squeamish that she touches the toilet handle only with her elbow.
