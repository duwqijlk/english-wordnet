simpleMeaning: In music, the sharp or flat signs put after the clef (a sign at the start of written music)
  that show which key the piece is in
scope: In music, the sharp or flat signs at the start of a piece, not a tune that stands for a performer
  or programme, and not a printed sheet folded into a book.
examples:
- The signature at the start of the music has two sharps.
- She checked the signature before she played, to see which key the piece was in.
