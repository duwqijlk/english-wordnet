simpleMeaning: A drinking house made of a building with a bar and rooms open to all, which often serves
  light meals
scope: This is a drinking house with a bar and rooms open to all, also called pub, not a single room where
  drinks are served over a counter and not a closed car.
examples:
- The saloon served soup and bread at noon.
- They ate lunch at the saloon by the road.
