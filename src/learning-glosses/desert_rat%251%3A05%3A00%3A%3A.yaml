simpleMeaning: The biggest of their family, these jumping gnawing animals live in the dry lands of North
  America and Mexico, one of many kinds.
scope: This is also called a kangaroo rat, and is one of many kinds of jumping gnawing animal from the
  dry lands of North America and Mexico, the biggest of their family.
examples:
- A desert rat leapt over the dry sand.
- The desert rat leapt away when we came near.
