simpleMeaning: a person whose job is to find people or goods that are missing
scope: This is a person hired to find missing people or goods, not a substance put into the body for medical
  study and not special bullets that leave a trail of smoke.
examples:
- The family hired a tracer to find their missing son.
- A tracer helped the company find the goods that had been lost in shipping.
