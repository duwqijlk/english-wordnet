senseId: 'parasitism%1:24:00::'
synsetId: 13864614-n
simpleMeaning: the way two different kinds of living things live together, where one gains from the other
  while harming it, usually without killing it
scope: Not the friendly living together of two kinds of living things, and not a creature that lives on
  another; this is the harmful one-sided link itself.
examples:
- The parasitism between the wasp and the caterpillar harmed the caterpillar without killing it.
- In this parasitism, one kind of living thing gains while the other loses.
