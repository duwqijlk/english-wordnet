simpleMeaning: The leaving out of sounds or words when people speak.
scope: The leaving out of sounds or words when people speak; also called omission; not the leaving out
  that shortens a written passage when it is changed, the loss of one or more tiny parts from a chromosome,
  or the act of deleting something written or printed.
examples:
- The deletion of the vowel changed the word.
- Their deletion made the line hard to follow.
