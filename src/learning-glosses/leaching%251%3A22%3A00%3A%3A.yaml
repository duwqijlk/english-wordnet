simpleMeaning: the process in which a liquid passes slowly through soil or other material and carries
  some parts of it away
scope: 'Also called leach: a process in which liquid moves through material and takes parts away, not
  the material itself and not the liquid alone.'
examples:
- Leaching removed much of the salt from the soil after years of rain.
- Farmers worry about leaching when rain washes food for plants out of the soil.
