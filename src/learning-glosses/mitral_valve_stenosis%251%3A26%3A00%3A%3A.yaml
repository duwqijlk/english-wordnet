simpleMeaning: The flap between the two left rooms of the heart is blocked or narrowed, as when scarring
  from rheumatic fever stiffens it.
scope: Also called mitral stenosis, it names the flap between the two left rooms of the heart when scarring
  from rheumatic fever has blocked or narrowed it.
examples:
- The scan showed mitral valve stenosis.
- She was treated for mitral valve stenosis.
