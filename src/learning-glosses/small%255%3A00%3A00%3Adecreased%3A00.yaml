simpleMeaning: made to appear less big or less valuable than it really is.
scope: This sense is not about actual size, age, or a modest amount; it describes something that has been
  made to look less important by comparison or by someone's words.
examples:
- Her kind words made his fear seem small.
- The report made the team's gains look small by comparison.
