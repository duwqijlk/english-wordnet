simpleMeaning: a funny remark or short tale told to get a laugh from the people who hear it
scope: 'Also called laugh, joke, jest, and jape: a funny remark told for a laugh, not the thing put in
  a mouth to stop speech and not the act of struggling to breathe.'
examples:
- He told a gag about the teacher and the whole class laughed.
- She knows a million gags and tells one at every party.
