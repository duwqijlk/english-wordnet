simpleMeaning: To get old paint and mould off, clean before you paint
scope: 'Another name for a powerwash: cleaning before painting to take off old paint and mould, not washing
  clothes and not cleaning after painting is done.'
examples:
- We need to pressure-wash the house before painting it.
- He pressure-washed the deck so the new paint would stick.
