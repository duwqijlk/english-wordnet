simpleMeaning: a loud, harsh cry made by a bird, or a sound like it
scope: The harsh cry of a bird, or a sound like it; not the act of crying out harshly.
examples:
- The squawk of the chickens woke us at dawn.
- We heard the loud squawk of a crow in the tree.
