simpleMeaning: to cry or whine while breathing in through the nose in short, noisy breaths
scope: 'Also called snuffle: to cry or whine with noisy breaths through the nose, not simply to breathe
  in through the nose and not to cry quietly.'
examples:
- Stop sniffling — you got yourself into this mess!
- The little girl kept sniffling after she lost her toy.
