simpleMeaning: a blood illness passed down in families, caused when the body makes faulty hemoglobin,
  the red part of blood that carries oxygen
scope: 'Also called thalassemia: a blood illness passed down in families, not a blood illness caused by
  a lack of iron and not one caused by blood loss.'
examples:
- The doctor told her the thalassaemia came from her parents.
- He learned to live with thalassaemia from a young age.
