simpleMeaning: A wild bird of the woods of south-east Asia, thought to be the forebear of the tame farm
  bird.
scope: A wild wood bird of south-east Asia, thought to be the forebear of the farm chicken; not the tame
  bird itself.
examples:
- The red jungle fowl scratched in the dust at the edge of the woods.
- A red jungle fowl called from the trees at dawn.
