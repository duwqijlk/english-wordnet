simpleMeaning: very lucky and shown special kindness and help, for example by God
scope: Lucky through God's special help; not holy as named by the Roman Catholic Church, not just happy
  in daily life, and not in heaven after death.
examples:
- She counted herself blessed by God with good health and a loving family.
- They thanked God for the rain and felt truly blessed.
