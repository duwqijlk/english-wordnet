simpleMeaning: a tiny sac made by people that can hold the acids carrying a living thing's building plans,
  used in the study of living parts to carry those acids into cells
scope: A tiny man-made sac that carries gene material into cells, not a living cell and not a drop of
  medicine.
examples:
- The scientist put the new gene into a liposome.
- Liposomes can carry new genes into cells.
