simpleMeaning: Blood tubes from the outer lips of the female sex organs to the blood tube on the outside
  of the groin.
scope: Blood tubes from the outer lips to the outer groin tube; anterior labial veins is another name
  for this sense; not blood tubes of the inner lips and not ones of the leg.
examples:
- The venae labiales anteriores carry blood from the outer lips to the groin.
- The venae labiales anteriores join the outer groin tube.
