simpleMeaning: A kind of violet from the Pacific coast of North America with white petals touched with
  yellow and deep purple
scope: This is a kind of violet from the Pacific coast of North America with white petals touched with
  yellow and deep purple, also called two-eyed violet, and not the common Old World kind or the European
  herb from which garden pansies come.
examples:
- Heartsease grows along the Pacific coast.
- The heartsease had white petals touched with yellow.
