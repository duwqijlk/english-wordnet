simpleMeaning: the colorless watery part of blood and lymph (a clear fluid in the body), with no cells
  of its own; blood cells float in it
scope: Also called blood plasma, and also called plasm. This is the liquid part of blood that carries
  the blood cells; not the green stone used as a jewel.
examples:
- The nurse separated the plasma from the red blood cells.
- Plasma makes up more than half of your blood.
