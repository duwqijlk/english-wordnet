senseId: whatever%5:00:00:some:00
synsetId: 02275443-s
simpleMeaning: used to talk about any one thing, any amount, or all of something, without saying which.
scope: This sense means any one or any amount; it is not the question word that asks which thing is meant.
examples:
- You can wear whatever you like to the party.
- He ate whatever was left on the plate.
