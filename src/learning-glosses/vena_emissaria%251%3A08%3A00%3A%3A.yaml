simpleMeaning: In the scalp and head, one of several blood tubes joins hollow spaces in the tough cover
  of the brain to tubes outside the skull, draining blood from them.
scope: 'Also called an emissary vein: one of several blood tubes in the scalp and head that drain blood
  from hollow spaces in the tough cover of the brain to tubes outside the skull.'
examples:
- The vena emissaria connects a sinus in the dura mater to a vein outside the skull.
- Blood drains through the vena emissaria from the brain's cover.
