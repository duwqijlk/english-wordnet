simpleMeaning: hinting at or leading to behaviour about sex that goes against common ideas of what is
  right
scope: 'Also called obscene, lewd, and raunchy: about sex in a way that goes against common ideas of what
  is right; not just rude in a general way with no link to sex.'
examples:
- The newspaper was fined for its salacious stories about the singer's private life.
- He told a salacious joke and several guests left the room.
