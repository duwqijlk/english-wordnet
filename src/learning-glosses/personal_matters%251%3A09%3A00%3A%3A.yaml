simpleMeaning: Affairs that belong to one person's own life
scope: These are affairs that belong to one person's own life; personal business is another name for this
  sense, and not the affairs of a whole town or the trade of a firm.
examples:
- Her personal matters are her own affair.
- Do not ask him about his personal matters.
