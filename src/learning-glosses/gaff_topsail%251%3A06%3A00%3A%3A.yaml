simpleMeaning: 'Its front edge is fixed to the upper mast and its lower edge runs along a slanted spar:
  a three-sided cloth that catches the wind on a boat.'
scope: Also called a fore-and-aft topsail, this is a sail set along a slanted spar, with its front edge
  on the upper mast.
examples:
- The gaff topsail filled with wind.
- They raised the gaff topsail to catch the wind.
