simpleMeaning: the temperature at which a liquid starts to make bubbles and turn to gas at sea level
scope: This noun is the temperature itself. It is not putting food in hot liquid to cook it, and not a
  painful sore on the skin.
examples:
- Bring the soup to a boil and then turn down the heat.
- At sea level, water comes to a boil at a set temperature.
