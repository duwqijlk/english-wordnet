simpleMeaning: a line that shows the level that water has reached
scope: This is a line showing where water reached, not the faint mark put in paper when it is made and
  seen when the paper is held up to the light.
examples:
- The watermark on the wall showed how high the flood water had risen.
- After the river fell, a dark watermark was left on the side of the bridge.
