simpleMeaning: A mechanical, electrical, or electronic device used to join, cut, or change the links in
  a circuit (a closed path that electricity can go round)
scope: This is a part for turning power on or off, not a move in basketball and not a part of a train
  track or false hair.
examples:
- She pressed the switch to turn on the light.
- The switch on the wall controls the fan.
