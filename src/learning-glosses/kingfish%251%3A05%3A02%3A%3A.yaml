simpleMeaning: a large mackerel (a sea fish) that people can eat, living in not very hot or cold seas
  near the Atlantic coast of the United States
scope: 'Also called cero and pintado: a large mackerel that people can eat, living in not very hot or
  cold Atlantic waters near the United States coast. Not the drum-family kingfish, not the small fish
  from seas near California, and not the flesh of a fish sold as food.'
examples:
- A kingfish, a large mackerel, was caught off the coast of North Carolina.
- Kingfish swim in the mild Atlantic waters near the United States coast.
