simpleMeaning: A fighting weight class for boxers and other fighters who are heavier than middleweights
  and lighter than super heavyweights
scope: This is a weight class between middleweight and super heavyweight; light heavyweight is another
  name for this sense.
examples:
- He fights at cruiserweight.
- The cruiserweight title bout lasted twelve rounds.
