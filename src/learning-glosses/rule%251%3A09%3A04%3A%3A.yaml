scope: A math-problem procedure only; not a behavior principle, a normative example, a conduct guide,
  a language convention, an accepted general truth, a natural law, a game's directions, a religious order's
  regulations, a reign, legal authority, a measuring stick, or any verb use (holding power, deciding,
  prevailing, declaring, matching zodiac signs, drawing lines, keeping in check, excelling).
examples:
- Descartes gave a famous rule for counting the positive roots of a polynomial.
- The teacher showed us a simple rule for multiplying fractions.
