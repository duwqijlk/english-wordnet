simpleMeaning: A famine in Ireland from potato blight; between 1846 and 1851 a million people starved
  to death and 1.6 million left, most for America.
scope: 'Also called the Great Calamity, the Great Hunger and the Irish Famine: a famine in Ireland from
  potato blight, in which a million people starved and 1.6 million left between 1846 and 1851, not a war
  and not a famine in another land.'
examples:
- The Great Starvation drove 1.6 million people from Ireland.
- During the Great Starvation, potato blight left Ireland hungry.
