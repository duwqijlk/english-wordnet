simpleMeaning: tiny living things of a very old kind found where there is no air, like animal guts, sediment,
  or sewage, that make a burning gas; a source of natural gas
scope: Tiny living things that make a burning gas where there is no air; not ordinary bacteria and not
  natural gas itself.
examples:
- Methanogens live in the guts of animals, where there is no air.
- Methanogens in sewage make a gas that can be burned for heat.
