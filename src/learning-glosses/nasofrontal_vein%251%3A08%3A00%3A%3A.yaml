simpleMeaning: In the front middle part of the eye socket, this vein joins the vein above the eye to the
  vein at the corner of the eye.
scope: 'Also called vena nasofrontalis: a vein in the front middle part of the eye socket that joins the
  vein above the eye to the vein at the corner of the eye.'
examples:
- The nasofrontal vein lies in the front middle part of the eye socket.
- The nasofrontal vein joins the vein above the eye to the vein at the corner of the eye.
