simpleMeaning: a state in which the blood has less carbon dioxide than normal, a gas breathed out by the
  lungs, and it can come from deep or fast breathing
scope: This is a state where the blood has too little carbon dioxide, also called hypocapnia; not a state
  with too much carbon dioxide and not low oxygen in the blood.
examples:
- Deep, fast breathing left her with acapnia after the test.
- The doctor said his acapnia came from breathing too fast.
