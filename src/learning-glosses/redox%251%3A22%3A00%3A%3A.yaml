simpleMeaning: a chemical change that can run forward and back, with one part giving up tiny bits of charge
  and the other part taking them in
scope: 'Also called oxidation-reduction and oxidoreduction: a chemical change that runs forward and back,
  not a change that runs only one way and not the burning of a fuel.'
examples:
- The redox in the battery lets it give power and then take a charge again.
- In the lab, the students watched a redox go forward and then back.
