simpleMeaning: Flies are the prey of this warbler of the east of North America, whose male shows bright
  orange on its sides, wings, and tail.
scope: This warbler of the east of North America catches flies, not the European songbird of the same
  name.
examples:
- A redstart darted after flies.
- We watched a redstart in the east of North America.
