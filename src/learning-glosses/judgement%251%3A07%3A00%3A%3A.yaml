simpleMeaning: the power to look at a situation clearly and come to a wise choice about it
scope: The power to size up a situation and decide well, and judgment is another name for this sense;
  not a court's decision and not the act of thinking something through.
examples:
- She showed good judgement in choosing her friends.
- His judgement of the man proved right.
