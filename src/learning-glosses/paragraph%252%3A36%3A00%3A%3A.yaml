simpleMeaning: to write in separate parts, each with its own idea; to work as a writer of such parts
scope: To write in separate parts, each with its own idea, and to work as a writer of such parts; not
  the part itself, not splitting a text, and not writing about someone in a short part of a paper.
examples:
- He paragraphs the news for the local paper.
- She paragraphed the report before lunch.
