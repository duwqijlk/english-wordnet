simpleMeaning: to spend time among people poorer than yourself, out of curiosity or for a thrill, in a
  way people see as rude and unkind
scope: Spending time among poorer people out of curiosity or for a thrill, a use people see as rude and
  unkind; not a poor district of a city, which is the noun sense of slum.
examples:
- Attending a motion picture show was considered slumming in the early 20th century.
- Rich young men went slumming in the poor parts of town.
