simpleMeaning: a farm tool with one or more heavy blades that break up the soil and cut lines in it before
  seeds are put in
scope: This farm tool is also called a plow. It is not the action of moving through soil or water in the
  way this tool moves.
examples:
- The farmer pulled the plough through the field before planting.
- A plough with two heavy blades stood by the barn.
