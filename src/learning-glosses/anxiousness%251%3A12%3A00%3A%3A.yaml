simpleMeaning: a light feeling of worry about things that may happen
scope: 'Also called disquiet: a light worry about what may happen; not the long-lasting state of worry
  and fear linked to illness of the mind in the other sense of this word.'
examples:
- His anxiousness grew as he waited to hear if the road would stay open.
- She felt a quiet anxiousness about what the next day might bring.
