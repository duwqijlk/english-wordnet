simpleMeaning: With rough sour fruit, wide at the top and narrow at the bottom, this small tree grows
  in warm America.
scope: Also called bullock's heart and bullock's heart tree, a small tree of warm America, not the fruit
  it bears.
examples:
- A bullock heart bore rough sour fruit, wide at the top and narrow at the bottom.
- The bullock heart dropped its fruit wide at the top and narrow at the bottom.
