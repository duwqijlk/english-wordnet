simpleMeaning: to think in a clear way, using reason and letting each step follow from the step before
  it
scope: 'Also called rationalise: to think with clear reasons. Not to take out unwanted things, and not
  to give reasons to defend something.'
examples:
- She sat down to rationalize, working through the facts one by one.
- He would not guess; he rationalized until each step followed from the last.
