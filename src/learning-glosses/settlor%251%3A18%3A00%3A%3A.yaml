simpleMeaning: In law, a person who puts land or other property in the care of a trustee, for the good
  of a named person
scope: In law, a person who puts property in a trustee's care for someone else, also called a trustor;
  not the trustee who holds the property and not the person who gains from it.
examples:
- The settlor put her house in trust for her grandchildren.
- As settlor, he named a trustee to look after the money.
