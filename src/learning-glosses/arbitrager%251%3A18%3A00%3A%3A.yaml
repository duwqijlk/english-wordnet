senseId: 'arbitrager%1:18:00::'
synsetId: 09823223-n
simpleMeaning: Selling right away in another market what was bought in one, this person earns money from
  the gap in price
scope: Also called arbitrageur and arb, it names a person who buys in one market and sells right away
  in another, not a person who holds shares for a long time.
examples:
- The arbitrager bought stocks and bonds in one market and sold them at once in another.
- An arbitrager earns money from the gap in price between markets.
