simpleMeaning: As if looking down on someone, treating them as less than oneself.
scope: As if looking down on someone, treating them as less; also called patronizingly or patronisingly.
examples:
- She answered him condescendingly, as if he were a child.
- The manager condescendingly told them how to do their jobs.
