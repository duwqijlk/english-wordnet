simpleMeaning: A picture or shape of a lamb that stands for Christ
scope: 'Also called Paschal Lamb: a picture or shape of a lamb that stands for Christ, not a real lamb
  and not the prayer of the same name.'
examples:
- An Agnus Dei hangs above the altar in the old church.
- She lit a candle before the Agnus Dei, the lamb that stands for Christ.
