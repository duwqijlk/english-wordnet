simpleMeaning: a speech part that does not change form and does a job in a sentence but has little meaning
  of its own
scope: Also called a function word, this is a speech part that does a job in a sentence but has little
  meaning of its own, not a word that names a thing and not a word that changes form.
examples:
- The closed-class word 'the' does a job in the sentence but has little meaning on its own.
- In the list, 'and' is a closed-class word that links parts of the sentence.
