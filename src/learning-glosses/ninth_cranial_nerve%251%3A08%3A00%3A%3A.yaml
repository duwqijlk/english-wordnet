synsetId: 05487438-n
simpleMeaning: A nerve carrying feeling from the throat and back of the tongue, moving throat and voice-box
  muscles, and sending rest-and-digest fibres to a cluster near the ear.
scope: This is the pair serving the throat and back of the tongue, not the vagus, which also reaches the
  chest and belly, or the facial, which moves the face.
examples:
- The ninth cranial nerve controls muscles used in swallowing.
- Taste from the back of the tongue travels along the ninth cranial nerve.
