simpleMeaning: Words in a line above a part of writing, put there to show what that part is about
scope: A line of words above a passage, also called head and heading. It is not a brick at the top of
  a wall, nor a beam over a door or window.
examples:
- The header above the story told readers what it was about.
- She wrote a short header for each new part of the report.
