simpleMeaning: A way to record and play back sound from four separate paths, so the sound comes from more
  than one speaker
scope: 'Also called quadraphony and quadriphonic system: a way of recording and playing sound over four
  separate paths, not a two-speaker setup.'
examples:
- The concert was recorded with a quadraphonic system.
- A quadraphonic system sends the music through four speakers.
