  flowers in early spring that are deep violet or pale purple.
scope: This short, hairy plant from North America and Siberia is also called lion's beard, prairie anemone,
  and wild crocus.
examples:
- The blue tulip blooms in early spring.
- Blue tulips grow in North America and Siberia.
