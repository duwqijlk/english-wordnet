scope: 'Also called thread-fish or threadfish: a fish with very long front rays on its back and belly
  fins, set apart from other long-finned fish by the great length of its front rays.'
examples:
- Alectis ciliaris swam past with its long front rays trailing.
- The Alectis ciliaris flashed its long fins in the clear water.
