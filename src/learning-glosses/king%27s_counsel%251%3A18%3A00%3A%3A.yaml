simpleMeaning: A lawyer who advises the Crown when Britain's ruler is a man
scope: This is a lawyer who advises the Crown when Britain's ruler is a man, not the same lawyer when
  the ruler is a woman and not an ordinary lawyer.
examples:
- The King's Counsel advised the Crown in the case.
- She was made a King's Counsel after years at the bar.
