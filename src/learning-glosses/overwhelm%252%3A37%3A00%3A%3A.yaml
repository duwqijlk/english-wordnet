simpleMeaning: to fill a person with strong feelings or with things seen and heard until they take over
scope: To take a person over with feelings or with things seen and heard, not to beat them in a fight.
examples:
- The noise of the crowd overwhelmed her.
- He was overwhelmed by grief when he heard the news.
