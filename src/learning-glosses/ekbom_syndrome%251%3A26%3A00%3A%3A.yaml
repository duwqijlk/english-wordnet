simpleMeaning: A feeling of unease and restless legs after going to bed, at times keeping one awake, that
  can be eased for a while by walking or moving the legs
scope: A feeling of unease and restless legs after going to bed; restless legs and restless legs syndrome
  are other names for this sense.
examples:
- Ekbom syndrome kept her legs moving half the night.
- Walking eased his Ekbom syndrome for a while.
