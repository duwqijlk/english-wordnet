simpleMeaning: a small tree of the Transvaal that loses its leaves and has spikes of yellow flowers
scope: A small tree of the Transvaal that loses its leaves and has spikes of yellow flowers, not the small
  South African tree with creamy yellow sweet-smelling flowers that grows by streams.
examples:
- The bush willow stood alone on the dry grassland.
- In spring the bush willow is covered with spikes of yellow flowers.
