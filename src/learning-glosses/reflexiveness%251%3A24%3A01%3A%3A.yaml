simpleMeaning: In logic and mathematics, a link that a thing has with itself
scope: In logic and mathematics, a link a thing has with itself; also called reflexivity; not the grammar
  link between 'myself' and the word it stands for, and not a link between two different things.
examples:
- Equality shows reflexiveness, since a number is equal to itself.
- The reflexiveness of 'is the same age as' holds because each person is the same age as themselves.
