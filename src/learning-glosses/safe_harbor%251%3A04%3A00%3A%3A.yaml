senseId: 'safe_harbor%1:04:00::'
synsetId: 00177615-n
simpleMeaning: a company under threat of takeover protects itself by buying a firm so heavily controlled
  by rules that it puts off buyers
scope: A way for a company facing a takeover to make itself less appealing, not a shelter for ships and
  not a legal rule that protects a company.
examples:
- Faced with a takeover bid, the firm found a safe harbor by buying a heavily regulated rival.
- The board used a safe harbor to make the company less attractive to buyers.
