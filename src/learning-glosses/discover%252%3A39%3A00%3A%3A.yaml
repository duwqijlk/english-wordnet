senseId: 'discover%2:39:00::'
synsetId: 02132531-v
simpleMeaning: to be the first to see something, or to find something new that nobody knew of before.
scope: This is about first sight of a place or thing, not about noticing that something is already present,
  not a new scientific finding, and not identifying a plant or animal in a guide.
examples:
- Explorers discovered the island in the seventeenth century.
- She discovered a hidden cave behind the waterfall.
