simpleMeaning: Able to kill germs that cause disease or to stop them from growing.
scope: This describes something that kills disease germs or stops them growing; antimicrobic is another
  name for it, and it is not a cure for one illness only.
examples:
- The soap has antimicrobial power against germs.
- Doctors use an antimicrobial wash before surgery.
