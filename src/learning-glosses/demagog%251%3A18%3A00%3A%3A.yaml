schema: oewn-learning-gloss-v2
senseId: 'demagog%1:18:00::'
synsetId: 10021074-n
simpleMeaning: a leader in politics who tries to win support by playing on the strong feelings and unfair
  views a crowd holds in advance
scope: This is a political leader who stirs up a crowd's feelings and unfair views to win support; demagogue
  and rabble-rouser are other names for this sense, not an honest leader who wins support with facts and
  plans.
examples:
- The demagog promised easy answers to every fear the crowd felt.
- Voters cheered the demagog even when his claims made no sense.
