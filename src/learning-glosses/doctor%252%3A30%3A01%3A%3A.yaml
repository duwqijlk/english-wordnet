simpleMeaning: to make something work again by fitting a new part in place of a damaged one or by joining
  together pieces that have been torn or broken.
scope: This is not the medical sense of treating a sick person, and not the sense of changing a document
  or record to deceive people; it is about mending a damaged object.
examples:
- He managed to doctor the torn tent with a patch and strong thread.
- The old clock was doctored so carefully that it ran like new.
