simpleMeaning: what happens when material that catches fire easily burns, giving off heat, light, and
  often smoke.
scope: The burning process itself — another name for fire in this sense — not the verb meaning to burn
  or the one meaning to shine suddenly.
examples:
- Ancient people used flame to keep warm and cook their food.
- The flame spread quickly through the dry grass.
