simpleMeaning: In angling, any bright fake bait made of plastic or metal, with hooks fixed on it and feathers
  set round its edges
scope: A bright man-made bait used in angling; fish lure is another name for this sense. Not live bait,
  and not a bare hook.
examples:
- The fisherman's lure, bright red and silver, drew the trout close.
- She chose a fisherman's lure with feathers for the morning's fishing.
