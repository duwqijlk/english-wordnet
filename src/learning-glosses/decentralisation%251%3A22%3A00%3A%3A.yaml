simpleMeaning: The social process in which people and work move from towns and cities out to the districts
  around them.
scope: The social process in which people and work move from towns and cities to the districts around
  them; decentralization is another name for it, not a move to the country and not a fall in numbers.
examples:
- Decentralisation moves people and work out of the cities.
- The decentralisation of industry spread jobs to outlying districts.
