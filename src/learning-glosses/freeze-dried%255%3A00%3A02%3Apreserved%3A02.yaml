simpleMeaning: In a space with almost no air, body tissue, blood, serum, and other such matter are turned
  to ice, which takes out their water and keeps them.
scope: Also called lyophilised or lyophilized, this word is used of body tissue, blood, serum, and other
  such matter that has lost its water by being turned to ice in a space with almost no air.
examples:
- The freeze-dried blood stayed good for months.
- They kept freeze-dried serum in the cupboard.
