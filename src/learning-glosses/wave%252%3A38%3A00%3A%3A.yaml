simpleMeaning: move along a curving path, or travel with a motion that rises and falls
scope: A movement in a series of curves that rise and fall, as of curtains; roll is another name for this
  same sense, not the ridge on a liquid surface, the hairstyle, or the act of curling hair.
examples:
- The curtains waved gently at the open window.
- Tall reeds waved in the wind along the river.
