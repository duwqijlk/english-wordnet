scope: To make something linear, for example by arranging it in a line or expressing a relationship in
  linear form; linearise is another name for this sense, not to draw a line and not to cut something straight.
examples:
- The catalyst linearized the polyethylene.
- He linearized the figures so the trend showed as a straight line.
