simpleMeaning: hard scar tissue in the lungs caused by iron dust, found in welders and other people who
  work with metal
scope: Lung harm from iron dust; not an infection of the lungs and not harm from coal dust.
examples:
- Years of welding left him with siderosis.
- Siderosis is a risk for welders who breathe in iron dust.
