simpleMeaning: To do with a thing's three dimensions or its sides, or with seeming depth.
scope: Also called third-dimensional, three-d, and three-dimensional, this word fits things with three
  dimensions or sides, and things that only seem to have depth.
examples:
- The film showed lifelike 3-dimensional characters.
- They shot the movie in 3-dimensional form.
