simpleMeaning: Do two jobs at once; be useful for two aims or work in two ways.
scope: This is one thing serving two roles, not making something twice as big or hiding a second meaning.
examples:
- The sofa doubles as a bed when guests stay.
- The garage doubles as a workshop in winter.
