simpleMeaning: In chemistry, a line of atoms joined together, typically within a carbon-based molecule.
scope: This is a chemistry term for atoms joined in a row, not metal loops or a group of shops under one
  owner; chemical chain is another name for this sense.
examples:
- Fatty acids have a long chain of carbon atoms.
- The protein chain folds into a complex shape.
