simpleMeaning: an old Norse word for one form of magic that was used in the north during the late Iron
  Age
scope: This is an old Norse word for a kind of magic in the late Iron Age; seithr, seid, seidh, seidhr
  and seidr are other names for this sense, not modern stage magic and not a Norse god.
examples:
- Seith was an old Norse form of magic.
- The old tales tell of people who used seith.
