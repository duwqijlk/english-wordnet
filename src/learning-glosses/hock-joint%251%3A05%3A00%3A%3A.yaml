simpleMeaning: the bend in the back leg of a hoofed animal, matching the ankle in a person
scope: The bend in the back leg of a hoofed animal, matching the human ankle; hock is another name for
  this sense, not the knee and not a bone.
examples:
- The horse's hock-joint swelled after the long ride.
- A vet checked the hock-joint of the lame cow.
