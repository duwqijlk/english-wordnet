synsetId: 00355168-n
simpleMeaning: The gutting of a thing, as a law or a claim, so it is worth less.
scope: This sense is the gutting of a thing, as a law or a claim, so it is worth less, unlike the sense
  for removing the bowels or viscera, cutting till the viscera stick out, and unlike the sense for the
  surgical taking of an organ, or the contents of an organ, from a patient.
examples:
- The evisceration gutted the law.
- Evisceration guts a claim so it is worth less.
