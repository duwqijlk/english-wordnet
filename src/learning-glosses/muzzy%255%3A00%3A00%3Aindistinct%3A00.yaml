simpleMeaning: Dim or misty in shape.
scope: This sense is also called blurred, fuzzy, hazy, blurry, foggy, and bleary, for being dim or misty
  in shape, where blurred is not clear at the edges, so you cannot see the shape well.
examples:
- The line was muzzy, dim in shape.
- The shape was muzzy, misty in shape.
