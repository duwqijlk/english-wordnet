simpleMeaning: to put the thick white part of milk into a drink such as coffee
scope: To put this milk part into coffee or a like drink; not the thick liquid for skin, not beating food
  until it is soft and smooth, and not putting it on skin.
examples:
- She creamed her coffee before she sat down.
- He always creams his coffee, but drinks his tea plain.
