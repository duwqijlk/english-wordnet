simpleMeaning: From a stream or pond, the liquid is lifted up by a big ring with cups round its edge.
scope: Also called waterwheel, it lifts liquid up from a stream or pond with cups round its edge.
examples:
- The water wheel lifted liquid from the pond.
- Cups round the edge of the water wheel dipped into the stream and lifted the liquid up.
