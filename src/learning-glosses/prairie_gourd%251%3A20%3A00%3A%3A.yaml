simpleMeaning: Small hard green fruit with pale marks that cannot be eaten grows on a vine living for
  years in dry parts of the middle and southwest United States and Mexico.
scope: Also called buffalo gourd, calabazilla, prairie gourd vine, and wild pumpkin, this is a vine of
  dry lands, not the small hard green fruit it bears.
examples:
- The prairie gourd spread across the dry field.
- A prairie gourd with small green fruit grew in the dry field.
