simpleMeaning: The passage in the throat, behind the nose and mouth, that carries food toward the stomach
  and air toward the lungs.
scope: The pharynx is shared by the respiratory and digestive systems.
examples:
- Air passes through the pharynx on its way to the lungs.
- Food moves from the pharynx into the esophagus.
