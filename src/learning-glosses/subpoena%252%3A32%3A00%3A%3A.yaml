simpleMeaning: to give someone a court paper that orders them to come to court, or to call them to court
  in this way
scope: This is the act of ordering someone to court with such a paper. It is not the court paper itself.
examples:
- The court subpoenaed the witness to tell what she had seen.
- He was subpoenaed to appear before the judge next week.
