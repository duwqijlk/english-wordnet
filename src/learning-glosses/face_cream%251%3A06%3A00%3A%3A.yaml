simpleMeaning: Mostly women put this soft stuff on the skin to make it soft and clean
scope: 'Also called cold cream and coldcream: a soft stuff mostly put on the skin by women to make it
  soft and clean, not a medicine and not a soap.'
examples:
- She put face cream on before bed to keep her skin soft.
- This face cream cleans the skin and leaves it feeling smooth.
