simpleMeaning: a verb form that shows an action as done and over
scope: 'Also called perfect, perfect tense and perfective: a verb form showing an action as done and over,
  not a form for an action still going on and not a form for a future action.'
examples:
- The perfective tense marks the action as complete.
- He wrote the sentence in the perfective tense.
