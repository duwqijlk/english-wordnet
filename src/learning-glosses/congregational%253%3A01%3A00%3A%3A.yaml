simpleMeaning: having to do with a congregation, or with what a congregation does together
scope: This describes what belongs to or is done by a congregation, not what one person does alone and
  not what a whole town does.
examples:
- Congregational singing filled the church each Sunday.
- She joined in the congregational prayer with the others.
