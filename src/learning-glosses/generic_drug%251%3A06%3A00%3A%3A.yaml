simpleMeaning: A copy of a named medicine that may be sold once the first maker's patent ends, if the
  FDA agrees
scope: This is a copy of a named medicine that may be sold once the first maker's patent ends; not the
  first named medicine itself and not a new medicine still under patent.
examples:
- A generic drug often costs less than the brand-name one.
- The doctor said a generic drug would work just as well.
