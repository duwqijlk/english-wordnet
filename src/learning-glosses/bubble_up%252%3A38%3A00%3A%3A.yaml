simpleMeaning: to rise in small balls of air, as when heat makes something move, and also used for ideas
  or feelings that slowly come to the surface
scope: 'Also called intumesce: to rise in small balls of air, or used for an idea that slowly comes to
  the surface, not to sink and not to burst out all at once.'
examples:
- The gas bubbled up through the warm water.
- Her anger slowly bubbled up during the long meeting.
