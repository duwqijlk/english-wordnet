simpleMeaning: A member of the armed forces who takes no part in fighting, as a chaplain or surgeon.
scope: A member of the armed forces who takes no part in fighting, as a chaplain or surgeon; not a member
  of the armed forces whose work does not cover fighting, as a chaplain or surgeon.
examples:
- Their noncombatant served at dawn.
- The noncombatant was sent at noon.
