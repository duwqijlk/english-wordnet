simpleMeaning: giving or getting care like a parent gives, though the person is not a parent by birth
  or by law
scope: 'Also called foster: giving or getting parent-like care without a link by birth or by law, not
  a person who acts or speaks for others.'
examples:
- He grew up with a surrogate father who cared for him like his own child.
- She was a surrogate parent to the children she took into her home.
