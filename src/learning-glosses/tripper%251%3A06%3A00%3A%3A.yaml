simpleMeaning: A catch that works as a switch.
scope: A catch that works as a switch; also called trip; not a walker or runner who trips and nearly falls,
  nor one who has taken a drug that makes them see things, nor a traveller out to see the sights.
examples:
- Their tripper clicked and the water ran.
- The tripper was pressed at noon.
