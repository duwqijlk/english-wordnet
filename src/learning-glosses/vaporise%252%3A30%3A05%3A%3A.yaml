senseId: 'vaporise%2:30:05::'
synsetId: 00577047-v
simpleMeaning: to make something change into a gas
scope: A person, heat, or a machine makes a thing change into a gas. It is not the sense where the thing
  changes by itself, and not the sense where a liquid dries away and leaves a stronger part behind.
examples:
- The heat of the fire vaporised the water in the pan.
- The chemist used strong heat to vaporise the liquid.
