simpleMeaning: The act of polluting something by putting unwanted substances or other unwanted things
  in it, on purpose or by chance
scope: Also called pollution; this is the act of making something dirty or unsafe, not the unwanted substance
  itself and not the dirty state that follows.
examples:
- Contamination of the river killed many fish.
- Food contamination made several people ill.
