simpleMeaning: Used as a glue, as a protective coat, and to keep eggs fresh, this thick glassy liquid
  is a chemical compound held in solution.
scope: Also called soluble glass and water glass, it is a thick glassy liquid used as a glue, as a protective
  coat, and to keep eggs fresh.
examples:
- He used sodium silicate as a glue.
- Sodium silicate was used to keep eggs fresh.
