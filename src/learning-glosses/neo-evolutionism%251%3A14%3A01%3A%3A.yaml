senseId: 'neo-evolutionism%1:14:01::'
synsetId: 92445463-n
simpleMeaning: In the study of peoples, a school about long-term change in ways of life and like growth
  patterns that may be seen in peoples far apart and not linked.
scope: A school of thought in the study of peoples about long-term change in ways of life, also called
  neoevolutionism; not a theory of how living things change and not a study of one people alone.
examples:
- Neo-evolutionism was the first in a series of modern multi-lineal evolution theories.
- The class discussed neo-evolutionism and its view of change in far-apart peoples.
