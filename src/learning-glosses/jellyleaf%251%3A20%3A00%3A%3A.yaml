simpleMeaning: Its fine, soft inner fibres are stronger than jute; people in warm regions grow the plant
  for animal feed and soothing medicine, and it is sometimes an aggressive weed.
scope: A fibrous tropical plant used as feed and soothing medicine; not a jellyfish, despite the similar
  name.
examples:
- Farmers in the tropics cut jellyleaf for cattle feed.
- Jellyleaf can take over a field if it is not controlled.
