simpleMeaning: the full distance that a moving machine part can travel when pushed by a rotating or sliding
  part.
scope: This is not the act of sending something through the air; it is a measure of how far a machine
  part can move.
examples:
- The engineer measured the throw of the cam before adjusting the valve.
- A longer throw gives the piston more travel.
