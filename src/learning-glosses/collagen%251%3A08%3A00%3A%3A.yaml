simpleMeaning: a tough, stringy protein found in bone, gristle, tendon, and other tissue that joins parts
  of the body, which turns into gelatin when boiled
scope: A protein that holds body tissue together, not the jelly it turns into when boiled and not a bone
  itself.
examples:
- Collagen gives strength to skin, bone, and tendons.
- When collagen is boiled, it turns into gelatin used in food.
