simpleMeaning: a try by people who buy and sell for gain to cheat people who put money into companies
  or other things that may grow in value
scope: This is a plan to cheat people over money, not going into other people's land to take things and
  not a sudden police or army attack.
examples:
- Investors lost their money in a raid planned by a group of speculators.
- Police uncovered a raid meant to cheat people who had bought shares.
