simpleMeaning: Held up by two side bars, many flat sheets and rims set one after another make a machine
  that strains liquid.
scope: Also called plate and frame filter press and plate filter press, it is a machine that strains liquid
  with many flat sheets and rims on two side bars.
examples:
- The plate-and-frame filter press strained the maple syrup in Canada.
- Workers set the plates and frames of the plate-and-frame filter press on the rails.
