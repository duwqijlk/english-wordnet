simpleMeaning: relating to or forming the central core of a living cell
scope: This is about the core of a living cell, not the core of an atom, not weapons that release destructive
  atomic energy, and not the general sense meaning central or nucleus-like.
examples:
- The nuclear membrane surrounds the cell's genetic material.
- During nuclear division, the cell's chromosomes are separated.
