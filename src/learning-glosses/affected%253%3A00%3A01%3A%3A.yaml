simpleMeaning: speaking or acting in a way that is not natural, in order to impress other people
scope: 'Also called unnatural: speaking or acting in a false, not natural way to impress people, not feeling
  strong emotion that you want to show.'
examples:
- She put on an affected voice when she spoke to the rich guests.
- His affected way of walking and talking made him look silly.
