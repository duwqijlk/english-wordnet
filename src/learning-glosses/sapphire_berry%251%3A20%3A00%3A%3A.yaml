simpleMeaning: Bright blue fruit for show grows on a bush from the east of Asia that drops its leaves
  each year.
scope: The name points to its bright blue fruit, borne for show on a bush from the east of Asia that drops
  its leaves each year, not a tree that keeps its leaves all year.
examples:
- Bright blue fruit hangs on the sapphire berry.
- They grow a sapphire berry for its bright blue fruit.
