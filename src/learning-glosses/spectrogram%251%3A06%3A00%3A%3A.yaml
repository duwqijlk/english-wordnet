simpleMeaning: a photo made to record a spectrum (light split into the separate colours and waves that
  make it up)
scope: Also called spectrograph. This is the photo record itself, not the light that is split and not
  a general photo of something.
examples:
- The scientist studied the spectrogram to see what the star's light was made of.
- A spectrogram of sunlight showed dark lines across its colours.
