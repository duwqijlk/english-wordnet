simpleMeaning: A shaker with a top full of small holes, for sprinkling ground spice over food
scope: 'Also called pepper pot and pepper shaker: a shaker with holes in its top for sprinkling ground
  spice over food, not a box for keeping spice and not a mill that grinds it.'
examples:
- She shook the pepper box over her eggs.
- The pepper box sat next to the salt shaker on the table.
