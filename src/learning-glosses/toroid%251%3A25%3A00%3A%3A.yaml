simpleMeaning: In mathematics, a circle turned round a line it never meets sweeps out a ring-shaped surface.
scope: This ring-shaped surface is also called a torus.
examples:
- Spinning a circle round a line that never met it made a toroid.
- The toroid was drawn by turning a circle round an axis.
