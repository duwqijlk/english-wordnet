senseId: 'nasal_aspirator%1:06:01::'
synsetId: 92449870-n
simpleMeaning: A syringe with a soft rubber bulb that does the work of a plunger, used to rinse an opening
  like the ear canal or clear a stuffy nose.
scope: Another name for this rinsing device with a rubber bulb, also called bulb syringe and nasal syringe;
  not a regular plunger syringe used for injections.
examples:
- The nasal aspirator drew the mucus gently from the baby's nose.
- Rinse the nasal aspirator with warm soapy water after each use.
