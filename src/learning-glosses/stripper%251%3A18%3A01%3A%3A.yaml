scope: The tobacco worker, also called sprigger and stemmer; not a performer who takes clothes off to
  music, and not a chemical used to take off paint.
examples:
- The stripper took the stems off the wet tobacco leaves all day.
- As a stripper, he tied the tobacco leaves together into books.
