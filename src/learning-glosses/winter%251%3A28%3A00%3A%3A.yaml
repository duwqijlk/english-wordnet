simpleMeaning: The coldest season of the year, which in the northern half of the world runs from the shortest
  day to the start of spring.
scope: This is not the verb for passing the cold season somewhere; it is the name of the season itself.
examples:
- The lake freezes over every winter.
- They spent the winter in a small cottage by the sea.
