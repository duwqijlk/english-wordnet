simpleMeaning: a group of animals that breathe air, with plain eyes and four pairs of legs, such as spiders
  and scorpions
scope: 'Also called arachnid: air-breathing animals with four pairs of legs, not insects with six legs
  and not sea animals with gills.'
examples:
- Spiders are arachnoids, with four pairs of legs.
- A scorpion is an arachnoid, not an insect.
