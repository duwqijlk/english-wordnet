simpleMeaning: something that you work out or take to be true from what is said or known
scope: 'Also called implication and deduction: a thing you work out from what is known, not a thing said
  in plain words directly.'
examples:
- A clear entailment of his words was that he planned to leave.
- 'One entailment is easy to see: if all dogs are animals, then this dog is an animal.'
