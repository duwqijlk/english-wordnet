simpleMeaning: the state of being like most others, which means it is normal but also not very good
scope: It is a state of being like most others, not the middle number in a set of figures and not a low
  mark.
examples:
- His averageness in class meant no one picked him first or last.
- The averageness of the meal left her with little to praise or blame.
