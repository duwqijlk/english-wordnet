simpleMeaning: a person who is not important but speaks and acts in a rude, too bold way as if they were
  important
scope: A person who is not important but is rude and too bold, also called a lightweight and a whippersnapper;
  not a boxer in a light weight group.
examples:
- The young jackanapes interrupted the mayor and spoke as if he ran the town.
- No one listened to the jackanapes boasting at the back of the room.
