simpleMeaning: a wingless fly that lives on the outside of cattle and woolly farm animals, taking food
  from them
scope: A wingless fly that lives on the outside of cattle and woolly farm animals and takes food from
  them, also called sheep-tick and sheep ked; not a winged fly, and not a pest that lives inside an animal.
examples:
- The farmer found a sheep tick on the back of one of the ewes.
- Sheep ticks cling to the wool of the flock and feed on the animals.
