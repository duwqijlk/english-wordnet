simpleMeaning: a thing that joins to something or keeps something in its place
scope: 'Also called fixing, holdfast, and fastening: a thing that joins to something or keeps it in place,
  not a person who joins things.'
examples:
- The bag closes with a metal fastener.
- She undid the fastener on her coat.
