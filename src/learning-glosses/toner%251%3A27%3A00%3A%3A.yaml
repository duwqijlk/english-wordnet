simpleMeaning: a black or colored powder used in a printer to make an image appear on paper
scope: This is the powder for a printer, not a lotion for cleaning the skin and not a liquid used to change
  the color of a photo.
examples:
- The printer stopped working because it had run out of toner.
- She put a new black toner cartridge in the office printer.
