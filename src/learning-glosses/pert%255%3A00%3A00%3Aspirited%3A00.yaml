simpleMeaning: lively and full of happy energy, and a little bold or not fully respectful in a light,
  easy way
scope: 'Also called impertinent, saucy and irreverent: lively and a little bold in a light, happy way,
  not quiet and serious and not strongly rude.'
examples:
- She gave a pert smile and answered with a joke.
- With a pert toss of her head, she laughed and walked on.
