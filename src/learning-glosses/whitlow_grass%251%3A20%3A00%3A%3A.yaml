simpleMeaning: in Europe and North America, a weed that lives one year bears tiny flowers, then long oval
  seed cases, above a ring of leaves at its base
scope: 'Also called shad-flower and shadflower: a one-year weed of Europe and North America, its tiny
  flowers giving way to long oval seed cases above a ring of leaves at its base, not a true grass and
  not a tall garden flower.'
examples:
- Whitlow grass grows in the cracks of the pavement, its tiny flowers barely seen.
- The whitlow grass by the wall has a ring of leaves at its base.
