simpleMeaning: something that takes away a sour burning feeling in the body, most often in the stomach
scope: 'Also called antacid, alkaliser, alkalizer, and gastric antacid: something that calms acid in the
  stomach, not a painkiller and not a medicine for sickness.'
examples:
- She took an antiacid after the spicy meal.
- The antiacid eased the burning in his stomach.
