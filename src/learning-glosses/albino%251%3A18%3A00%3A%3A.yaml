simpleMeaning: a person born with a body condition that gives them white hair and pale skin, and eyes
  that are usually pink
scope: This is a person born with this condition, not an animal born with it and not the word for having
  the condition.
examples:
- The albino in our class has white hair and very pale skin.
- An albino often has pink eyes and must take care in strong sun.
