simpleMeaning: to make something hard to bend or move, or harder to bend or move than before
scope: Making something else hard to bend or move, not becoming hard on its own, and not limiting something
  tightly.
examples:
- She used starch to stiffen the shirt collar.
- Add a little gel to stiffen the cream.
