simpleMeaning: so clearly bad that everyone can see it, and so bad that it shocks people and should be
  blamed
scope: Also called crying, rank, glaring, gross and egregious, this means clearly and shockingly bad;
  it is not bad in a small or hidden way.
examples:
- His flagrant lie shocked the whole court.
- There was a flagrant waste of money in the plan.
