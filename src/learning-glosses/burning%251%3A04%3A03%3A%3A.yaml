simpleMeaning: a torture method in which cigarettes, cigars or other hot objects are used to scorch a
  victim's skin
scope: This is torture with hot objects applied to a person's skin, not the act of setting something on
  fire and not death by fire as a punishment.
examples:
- The tribunal heard how burning was used to make prisoners confess.
- He still has scars from the burning he suffered in prison.
