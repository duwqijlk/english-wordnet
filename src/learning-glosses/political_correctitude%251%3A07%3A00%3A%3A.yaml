simpleMeaning: Words and acts that shut out, push aside, or insult people already pushed down or treated
  unfairly are held back.
scope: 'Also called political correctness: holding back words and acts that might insult people who are
  pushed down or treated unfairly.'
examples:
- His political correctitude kept him from using words that might insult the group.
- Political correctitude shaped how the office spoke about its clients.
