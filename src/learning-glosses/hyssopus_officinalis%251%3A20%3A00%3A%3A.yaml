simpleMeaning: A European mint with sweet-smelling and sharp leaves used in perfume and as a seasoning
  in cooking, often grown as a cure for bruises, and yielding hyssop oil.
scope: Also called hyssop; a mint used in cooking and perfume, not a sage.
examples:
- Hyssopus officinalis grew by the kitchen door.
- We use Hyssopus officinalis in cooking.
