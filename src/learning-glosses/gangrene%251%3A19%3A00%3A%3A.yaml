simpleMeaning: the death of living cells in one part of the body, as from an infection or when blood stops
  reaching that part
scope: Also called mortification, this is the death of cells in one part of the body, not the dead piece
  of body tissue itself and not a simple wound with no cell death.
examples:
- Gangrene set in after blood stopped reaching his foot.
- The doctor said the gangrene came from a bad infection.
