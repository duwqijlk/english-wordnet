simpleMeaning: Words added to a film or TV show, usually in the plural, to list who worked on it, show
  spoken words, or describe what is happening.
scope: This sense is not the name of a film or program, nor a word of rank.
examples:
- The opening titles rolled over a shot of the empty city.
- Foreign films often add titles at the bottom to translate the dialogue.
