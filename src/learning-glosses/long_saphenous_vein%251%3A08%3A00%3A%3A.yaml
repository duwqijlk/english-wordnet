simpleMeaning: The blood tube in the body that runs the greatest distance, from the foot to the groin,
  where it joins the blood tube of the thigh.
scope: This is the blood tube that runs the greatest distance in the body, from foot to groin, not a short
  vein of the leg and not an artery; great saphenous vein is another name for this sense.
examples:
- The long saphenous vein runs from the foot to the groin.
- Surgeons sometimes use the long saphenous vein for a bypass.
