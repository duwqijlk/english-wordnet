simpleMeaning: Any of several ways of measuring how two things are linked without supposing a set pattern
  in the numbers, used when the usual ways do not fit
scope: This is any of several ways of measuring how two things are linked without supposing a set pattern,
  used when the usual ways do not fit, not a single set way and not a way that supposes a set pattern.
examples:
- The Kendall test showed a link between the two sets of numbers.
- They ran a Kendall test on the survey results.
