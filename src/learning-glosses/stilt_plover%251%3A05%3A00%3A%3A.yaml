simpleMeaning: By inland ponds, marshes, or salty lagoons lives this black-and-white wading bird, with
  three toes and long thin legs.
scope: Also called stilt, longlegs, long-legs, and stiltbird; a black-and-white wading bird of inland
  ponds and marshes or salty lagoons.
examples:
- A stilt plover waded through the marsh on its long legs.
- The stilt plover stood on three toes in the pond.
