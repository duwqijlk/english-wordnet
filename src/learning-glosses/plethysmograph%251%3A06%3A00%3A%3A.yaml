simpleMeaning: An instrument that measures changes in the size of a body part, an organ or the whole body,
  usually as the blood in it goes up and down
scope: An instrument that measures changes in the size of a body part, an organ or the whole body as the
  blood in it changes; not a device that measures weight or heat.
examples:
- The plethysmograph measured the change in the size of his arm.
- A plethysmograph showed the blood going up and down in the organ.
