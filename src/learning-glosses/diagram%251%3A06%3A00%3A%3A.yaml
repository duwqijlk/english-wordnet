simpleMeaning: a drawing that shows how something works, or how its parts fit together
scope: Not a photograph and not the act of making such a drawing; this is the drawing itself, showing
  how a thing works or how its parts fit together.
examples:
- The diagram in the book showed how a pump moves water.
- She drew a diagram of the parts of the flower.
