simpleMeaning: a weighing tool with a beam, made to weigh things with very great care, used in tests that
  find how much of each substance is in a mixture
scope: 'Also called a chemical balance: a weighing tool for exact tests of mixtures, not an ordinary kitchen
  scale and not a test of the body.'
examples:
- The lab used an analytical balance to weigh the powder.
- She put the sample on the analytical balance to check its weight.
