simpleMeaning: Going toward a particular place, or intending to; often joined to another word that names
  the destination.
scope: 'Another name for destined: this is about the direction someone or something is travelling or intends
  to travel, not being tied by an oath or contract, not having a cover, and not being joined chemically.'
examples:
- The ferry is bound for the island.
- He boarded a train bound for the north.
