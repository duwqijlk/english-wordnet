simpleMeaning: Any of a group of green plants that stay green all year, of the group Abies, growing most
  of all on high ground.
scope: Any of a group of green plants that stay green all year, of the group Abies, growing most of all
  on high ground; also called fir, not a pine and not a low bush.
examples:
- Fir trees grow on the high ground behind the village.
- The fir tree in the yard stays green all winter.
