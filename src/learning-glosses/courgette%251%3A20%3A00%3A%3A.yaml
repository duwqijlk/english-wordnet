simpleMeaning: a plant of the squash kind whose fruit people eat while the fruit are still small
scope: This is a plant of the squash kind whose fruit people eat while the fruit are still small, also
  called zucchini; not the fruit itself and not a plant whose fruit are left to grow big.
examples:
- She grew courgettes in the garden and picked them young.
- The courgettes in his garden were ready to pick while still small.
