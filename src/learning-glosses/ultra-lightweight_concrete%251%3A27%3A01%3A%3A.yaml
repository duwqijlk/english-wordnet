simpleMeaning: A type of air-filled concrete with an air-catching add-in, or a light fill such as blown-up
  clay fill, cork bits, and vermiculite.
scope: This sense is also called cellular concrete, foamed concrete, lightweight aerated concrete, lightweight
  concrete, and variable density concrete.
