simpleMeaning: to make a thing dirty or full of spots by being left in the air; also used in a wider way,
  not about real dirt
scope: 'Also called stain, tarnish, defile and maculate: this is making a thing dirty in the air, or spoiling
  a good name in a wider way, not saying untrue things about a person to hurt them.'
examples:
- The air sullied the silver spoons and left them dull and spotted.
- The scandal sullied her good name.
