simpleMeaning: of a voice or sound, clear and pleasant, like the ring of a pale metal
scope: This is about a clear, pleasant voice or sound. Not a pale grey colour and not a bright white shine.
examples:
- She sang in soft, silvery tones.
- His silvery voice was clear and pleasant to hear.
