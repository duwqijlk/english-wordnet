simpleMeaning: Someone with a long history of losing, who comes out worse again and again.
scope: This is a person who keeps losing, not a lack of success in general, and not the state of being
  unable to pay what you owe.
examples:
- The coach called him a failure after his fourth straight defeat.
- In the novel, the older brother is a failure who gambles away every paycheck.
