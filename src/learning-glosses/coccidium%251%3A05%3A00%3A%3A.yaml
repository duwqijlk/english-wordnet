simpleMeaning: A living thing that lives off the gut lining of animals with backbones and of higher animals
  without backbones.
scope: This is a tiny living thing that lives off the gut lining of animals with backbones and of higher
  animals without backbones; eimeria is another name for it, not a germ that lives free in soil and not
  a worm in the gut.
examples:
- The coccidium feeds on the gut lining of the animal it lives in.
- A coccidium spends its life inside the gut of a vertebrate.
