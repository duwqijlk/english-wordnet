simpleMeaning: a thin, flat piece of hard-baked clay laid on top of a house to keep the rain out
scope: 'Also called a tile: a thin piece of baked clay on a roof, not a floor tile and not a wall tile.'
examples:
- A roofing tile slipped off the roof in the storm.
- They replaced the cracked roofing tiles before winter.
