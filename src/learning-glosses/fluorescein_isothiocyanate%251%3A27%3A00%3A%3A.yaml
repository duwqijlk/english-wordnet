simpleMeaning: A glowing dye often joined to germ-fighting proteins for use in a test that lights up under
  a microscope.
scope: This is a glowing dye joined to germ-fighting proteins for use in a test that lights up, not a
  plain stain or a drug, and it is also called fluorescein isocyanate.
examples:
- The lab used fluorescein isothiocyanate to mark the antibodies.
- Fluorescein isothiocyanate made the sample glow.
