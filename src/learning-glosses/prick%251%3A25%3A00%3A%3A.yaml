simpleMeaning: a hollow made by scratching or cutting into a surface
scope: A hollow made by scratching or cutting into a surface, also called a scratch, a dent or a slit;
  it is not the rude name for a person and not an act of stabbing.
examples:
- The knife left a tiny prick in the wooden table.
- There was a small prick in the leather where the point had gone in.
