simpleMeaning: printed words that are not true and are meant to harm the good name of a person who is
  still living
scope: This sense is printed words that are not true and meant to hurt a living person's good name, not
  the court paper a person brings to start a case and not the act of printing such words.
examples:
- The newspaper printed a libel about the singer, with claims that were not true.
- He sued the magazine because the article was a libel that hurt his good name.
