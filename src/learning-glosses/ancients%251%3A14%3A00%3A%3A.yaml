simpleMeaning: people who lived long ago, especially before the fall of the Roman Empire in western Europe
scope: People who lived long ago as a group, especially in the time before the Roman Empire fell in western
  Europe. Not one old thing, and not people who are just old today.
examples:
- The ancients built roads that people still use today.
- We read stories that the ancients told about the stars.
