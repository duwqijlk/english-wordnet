simpleMeaning: a first degree given to a person who has finished their first course of study at a college
  or university
scope: 'Also called bachelor''s degree: a first degree given after finishing a first course of study at
  a college or university, not the farewell talk given to a class at the end of their studies and not
  a higher degree.'
examples:
- She received her baccalaureate in June after four years of study.
- His baccalaureate was in history.
