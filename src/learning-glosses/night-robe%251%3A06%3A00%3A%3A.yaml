simpleMeaning: A woman wears this loose dress in bed, as a piece of lingerie
scope: This loose dress for a woman to wear in bed is also called a gown, a nightdress, a nightgown or
  a nightie, not a day dress and not a coat.
examples:
- She put on her night-robe before getting into bed.
- Her night-robe was a loose white dress.
