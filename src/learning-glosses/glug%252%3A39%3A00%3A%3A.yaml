simpleMeaning: to make a bubbling sound like liquid coming out of a bottle
scope: To make a bubbling sound when liquid comes out of a bottle, not to drink the liquid and not the
  liquid itself.
examples:
- The wine glugged as it poured from the bottle.
- Water glugged out of the jug when he tipped it.
