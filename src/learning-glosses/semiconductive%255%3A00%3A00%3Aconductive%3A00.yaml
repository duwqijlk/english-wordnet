senseId: semiconductive%5:00:00:conductive:00
synsetId: 00560245-s
simpleMeaning: Having the traits of a material that lets power through better than a non-conductor but
  worse than a good conductor
scope: 'Also called semiconducting: letting power through worse than a good conductor but better than
  a non-conductor, not a metal wire and not a non-conductor.'
examples:
- The semiconductive plate lets a little power through, more than a non-conductor but less than a metal
  wire.
- This semiconductive part lets power through slowly, so it is not a good wire and not a non-conductor.
