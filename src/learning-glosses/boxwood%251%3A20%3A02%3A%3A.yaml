simpleMeaning: Very hard, tough, close-grained wood, pale yellow, from the box tree, most of all the common
  box, used for fine work such as musical instruments, inlays, and blocks for engraving.
scope: Wood from the box tree, used for fine work such as musical instruments and inlays, not the tree
  itself.
examples:
- The craftsman carved the flute from boxwood.
- Boxwood blocks were used for the fine engraving.
