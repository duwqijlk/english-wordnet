simpleMeaning: the act of settling a row by giving a final say that all sides must take
scope: 'Also called arbitrament and arbitration: the act of settling a row by a final say, not a court
  case and not a plain talk between the sides.'
examples:
- The two sides agreed to accept the arbitrement of the retired judge.
- After weeks of talks, the arbitrement ended the row.
