simpleMeaning: a plate of armour that guards the foot, made of mail with a hard toe and heel
scope: 'Also called a solleret: a plate of armour guarding the foot, not a boot and not a leg guard.'
examples:
- The knight's sabaton guarded his foot.
- Each sabaton was made of mail with a solid toe.
