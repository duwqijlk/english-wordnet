simpleMeaning: A smell so foul you notice it at once and want to move away from it
scope: Also called stink and stench; a foul smell you can pick out at once, not the act of giving off
  smoke or steam and not the act of smelling bad.
examples:
- A reek of rotten fish hung over the market.
- The reek from the drain made us step back.
