simpleMeaning: A machine that makes a scintigram, an image showing where a radioactive tracer is in the
  body.
scope: 'Also called scintiscanner: the machine that makes a scintigram, an image showing where a radioactive
  tracer is in the body, not the picture itself and not a machine that takes ordinary photographs.'
examples:
- The scintigraph made a picture showing where the tracer was in her chest.
- The doctor used the scintigraph to see where the tracer had gone in the patient's body.
