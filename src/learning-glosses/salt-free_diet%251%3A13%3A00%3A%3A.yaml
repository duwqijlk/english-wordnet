simpleMeaning: a way of eating that cuts down sodium chloride, often used to treat high blood pressure,
  swelling, or certain other health problems
scope: Also called a low-salt diet and a low-sodium diet; a way of eating that limits salt, not a fast
  with no food at all.
examples:
- Her doctor put her on a salt-free diet for her blood pressure.
- A salt-free diet means cooking without added salt.
