simpleMeaning: the act of noticing that something has happened or that a certain state of things exists
scope: Also called sensing; noticing that something has happened, not the act of catching sight of it,
  and not the noticing of a signal being received.
examples:
- Early detection can often lead to a cure.
- Her quick detection of the leak saved the house from serious damage.
