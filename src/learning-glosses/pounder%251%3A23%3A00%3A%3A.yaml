simpleMeaning: used only with another word, a thing that weighs a given number of pounds
scope: This sense is used only with another word to say how many pounds a thing weighs; it is not a heavy
  tool used to crush and mix things.
examples:
- The fisherman caught a 10-pounder.
- All their linemen are 300-pounders.
