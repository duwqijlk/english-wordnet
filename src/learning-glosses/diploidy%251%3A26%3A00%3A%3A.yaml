simpleMeaning: the state of having two full sets of chromosomes, the parts of a cell that carry genes,
  with one set from each parent
scope: The state of having two full sets of chromosomes, not one set and not many sets.
examples:
- Diploidy is normal in most animals.
- In diploidy, each cell holds two sets of chromosomes.
