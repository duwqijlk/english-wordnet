simpleMeaning: a fast-moving, often deadly form of plague that passes through the air between people,
  with the lungs affected and with chills, coughing up blood and high fever.
scope: A form of plague that attacks the lungs; pneumonic plague and pulmonic plague are other names,
  while bubonic plague forms swellings in the armpits and groin and septicemic plague invades the blood.
examples:
- The man's high fever, chills and bloody cough made the doctors suspect plague pneumonia.
- Plague pneumonia spreads from person to person through the air.
