simpleMeaning: An evergreen shrub or small tree from Eurasia, often grown in gardens for its showy white
  flower clusters and glossy leaves; its oil resembles bitter almond oil.
scope: 'Another name for laurel cherry in the garden-plant sense: an evergreen grown for white flower
  clusters and glossy leaves; not the small wild tree of the southern United States.'
examples:
- The cherry laurel along the fence keeps its glossy leaves all winter.
- Gardeners cut the cherry laurel back hard in spring to keep it dense.
