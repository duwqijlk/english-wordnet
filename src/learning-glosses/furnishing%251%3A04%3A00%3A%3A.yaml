simpleMeaning: The act of putting furniture and other things that can be moved, such as shelves, carpets,
  and machines, into a house or room
scope: The act of putting furniture and movable things into a house or room, not the furniture and things
  themselves.
examples:
- The furnishing of the new house took several weeks.
- They spent a lot on the furnishing of the flat.
