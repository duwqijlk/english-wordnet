simpleMeaning: likely to shake or move from side to side because it is weak or not well made
scope: 'Also called shaky, rickety and wobbly: weak and likely to shake, not steady and firm.'
examples:
- The table is wonky, so put a book under one leg.
- He sat down slowly on the wonky chair.
