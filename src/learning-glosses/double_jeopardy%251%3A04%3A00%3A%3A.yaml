simpleMeaning: The trial of a person a second time for a crime already tried, barred by the fifth part
  of the United States set of basic laws
scope: The trial of a person a second time for a crime already tried, barred by the fifth part of the
  United States set of basic laws; not a first trial and not a civil case.
examples:
- Double jeopardy barred a second trial for the same crime.
- His lawyer raised double jeopardy to stop the new case.
