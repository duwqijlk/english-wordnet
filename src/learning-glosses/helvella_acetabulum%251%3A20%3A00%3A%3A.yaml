simpleMeaning: A fungus with a cup-shaped fertile body with a brown inside; the stalk is creamy white
  and strongly ribbed.
scope: A fungus with a cup-shaped fertile body with a brown inside, set apart from other cup fungi by
  its creamy white and strongly ribbed stalk.
examples:
- Helvella acetabulum grew on the forest floor, its cup-shaped body open.
- The Helvella acetabulum stalk was creamy white and strongly ribbed.
