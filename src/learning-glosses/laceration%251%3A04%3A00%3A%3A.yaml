simpleMeaning: the act of cutting or tearing skin or flesh in a rough way
scope: This is the act of cutting or tearing skin or flesh, not the torn, rough wound that is left after
  it happens.
examples:
- The sharp metal caused the laceration of his skin as it tore across his arm.
- The laceration of the flesh happened when she fell on broken glass.
