simpleMeaning: A skin illness that comes on late after the skin touches one thing that sets it off, such
  as poison ivy
scope: A skin illness that comes on late after the skin touches one thing that sets it off, not a burn
  and not a skin illness caught from another person.
examples:
- Contact dermatitis flared after she touched poison ivy.
- His contact dermatitis came on hours after the touch.
