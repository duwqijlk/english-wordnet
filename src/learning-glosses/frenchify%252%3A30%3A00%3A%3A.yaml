senseId: 'frenchify%2:30:00::'
synsetId: 00411574-v
simpleMeaning: To grow to look or be like the people of France.
scope: This word is for a thing that grows French in look or in the way it is, not for a person who makes
  a thing French.
examples:
- After the new owners took over, the restaurant has Frenchified.
- The little café Frenchified over the years as it added French dishes to the menu.
