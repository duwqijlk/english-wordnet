simpleMeaning: a mild lack of the power to learn and think as most people do
scope: A mild, lasting lack of power to learn and think; not a short spell of unclear thinking, and not
  a troubled, mixed-up state of mind.
examples:
- The boy's mental deficiency was mild, and he learned slowly.
- Mental deficiency can make school work hard.
