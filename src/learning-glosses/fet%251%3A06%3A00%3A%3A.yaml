simpleMeaning: A switch in a circuit where most of the flow runs through a path whose push-back can be
  changed by an electric field across it.
scope: A switch in a circuit, also called a field-effect transistor; not a big power switch and not a
  wire.
examples:
- The FET controls the flow in the radio.
- A FET sits in the amp.
