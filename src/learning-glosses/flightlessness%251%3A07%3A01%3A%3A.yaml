simpleMeaning: The state of being unable to fly, usually said of birds such as the penguin, the ostrich,
  and the emu.
scope: The state of being unable to fly, usually said of birds; not the act of flying and not a bird that
  can fly.
examples:
- Flightlessness in the penguin is made up for by strong swimming.
- The ostrich is known for its flightlessness.
