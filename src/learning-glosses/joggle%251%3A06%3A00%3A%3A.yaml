simpleMeaning: A small peg that fits into holes in two pieces set side by side, holding them fast together.
scope: 'Also called a dowel or a dowel pin: a small peg that fits into holes in two pieces set side by
  side and holds them fast; not a slight shaking motion, and not the act of fastening pieces in this way.'
examples:
- He joined the boards with a joggle fitted into holes in each piece.
- The joggle held the two pieces together.
