simpleMeaning: a hat for a man, with a tall top part, usually covered with silk or with fur from a beaver
scope: This sense is a tall hat for a man, also called beaver, topper, dress hat, high hat, opera hat,
  silk hat and top hat. It is not the wide metal pipe for a stove.
examples:
- He wore a black stovepipe hat covered with silk.
- The tall stovepipe hat made the man look even taller.
