senseId: 'pre-columbian%3:01:00::'
synsetId: 03041610-a
simpleMeaning: Of the Americas before Columbus came, or having to do with that time
scope: It is used of peoples, arts, objects and ways of life in the Americas from the time before Columbus
  came, not of anything from the Americas after his arrival.
examples:
- Pre-Columbian art shows the life of the early Americas.
- The museum holds many pre-Columbian pots.
