senseId: 'neutrophile%1:08:00::'
synsetId: 05461233-n
simpleMeaning: The main white blood cell that eats up germs and dirt, and takes colour from both kinds
  of dye, one that is basic and one that is acid.
scope: The main white blood cell that eats up germs and dirt, taking colour from both kinds of dye, with
  neutrophil as another name for this sense, not other white blood cells that do not eat up germs and
  not a red blood cell.
examples:
- A neutrophile is the first white blood cell to reach an infection.
- The neutrophile eats up germs in the wound.
