simpleMeaning: In medicine, a small hammer with a rubber head, tapped on the chest to test it and used
  to test reflexes
scope: 'Also called a plessor or a plexor: in medicine, a small hammer with a rubber head for tapping
  the chest and testing reflexes, not a carpenter''s hammer and not a stethoscope.'
examples:
- The doctor tapped his chest with a percussor.
- She tested his knee reflex with a percussor.
