simpleMeaning: moving in a way that is not controlled, not regular, and hard to know where it will go
  next
scope: About movement that is not controlled and does not follow a steady path; not about a person who
  leaves the right way or travels in search of adventure.
examples:
- An errant gust of wind blew the papers off the table.
- The errant flight of the leaf made it hard to catch.
