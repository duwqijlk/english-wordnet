simpleMeaning: In British use, the sweet part of a meal, eaten at the end; this short word is used in
  an informal way
scope: 'Also called pudding: in British use, the sweet food at the end of a meal, not the main part of
  the meal.'
examples:
- For pud, we had apple pie and cream.
- Would you like some pud after dinner?
