simpleMeaning: a plant that makes its own food from simple organic stuff
scope: 'Also called autophytic plant, autotroph and autotrophic organism: a plant that makes its own food,
  not a plant that lives off other plants or animals.'
examples:
- An autophyte makes its own food and needs no other plant to feed it.
- The green autophyte grew well in plain soil and light.
