simpleMeaning: made from ammonia and carbon dioxide, this is the main solid part of the urine of mammals,
  spread as fertilizer and put in animal feed and plastics
scope: 'Also called urea: the main solid part of urine, not the urine itself.'
examples:
- Carbamide is made from ammonia and carbon dioxide.
- Farmers spread carbamide on the fields as fertilizer.
