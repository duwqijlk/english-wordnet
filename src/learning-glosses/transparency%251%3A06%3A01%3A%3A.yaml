senseId: 'transparency%1:06:01::'
synsetId: 03380802-n
simpleMeaning: a picture on a clear base, made from a photograph or drawing that shows things as they
  really look, and shown with a projector
scope: A picture on a clear base shown with a projector; foil is another name for this sense, not the
  quality of being easy to see through and not openness in the way things are done.
examples:
- The teacher showed a transparency of the diagram on the projector.
- She put the transparency on the overhead projector.
