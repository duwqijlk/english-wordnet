simpleMeaning: A church song sung at the end of a service, while the priests and singers walk out.
scope: A church song sung at the end of a service; not the leaving of the priests and singers itself.
examples:
- The choir sang the recessional as the priests walked out.
- We stood for the recessional at the end of the service.
