simpleMeaning: Its spiked tail most likely served as a weapon, and a row of bony plates runs down the
  back of this plant-eating, bird-hipped dinosaur.
scope: Also called stegosaurus; a plant-eating dinosaur with plates on its back, not a meat-eating one.
examples:
- The stegosaur model has plates along its back.
- A stegosaur swung its spiked tail to drive off an attacker.
