simpleMeaning: the back or top part of the raised seating area in a theatre, with the cheapest seats
scope: 'Also called family circle, peanut gallery and second balcony: the back or top part of the raised
  seating with the cheapest seats, not the seats on the main floor and not the lower balcony.'
examples:
- We sat in the upper balcony because the tickets were cheap.
- The upper balcony is the highest seating in the theatre.
