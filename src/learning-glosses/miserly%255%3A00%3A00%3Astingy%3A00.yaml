simpleMeaning: 'used of a person or behavior: showing that the person is not willing to give or share'
scope: Also called mean, tight and mingy. It is about a person or behavior that will not give or share,
  not about being poor or having little to give.
examples:
- He left a miserly tip and kept the rest of his money.
- Her miserly brother would not share even a small piece of cake.
