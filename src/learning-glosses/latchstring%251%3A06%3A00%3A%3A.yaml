simpleMeaning: A cord that opens a door, passed through a hole in the door so the catch can be lifted
  from outside.
scope: A cord that opens a door, passed through a hole in the door so the catch can be lifted from outside;
  not a key, and not a handle fixed to the door.
examples:
- He pulled the latchstring to open the cabin door.
- The latchstring hung through a hole in the wooden door.
