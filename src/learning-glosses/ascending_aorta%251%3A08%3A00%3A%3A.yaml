simpleMeaning: the first part of the main blood vessel that leaves the heart, rising up from its left
  lower chamber
scope: The first, rising part of the main blood vessel from the heart, not the part that runs down through
  the body and not a vein.
examples:
- The ascending aorta carries blood up from the heart.
- A scan showed a widening of his ascending aorta.
