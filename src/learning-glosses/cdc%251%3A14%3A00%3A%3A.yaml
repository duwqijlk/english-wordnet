simpleMeaning: A federal agency in the Department of Health and Human Services in Atlanta, looking into
  and diagnosing diseases and trying to control or prevent them, especially new and unusual ones.
scope: Also called Center for Disease Control and Prevention, it is the US federal health agency in Atlanta
  that follows and tries to stop diseases across the country, work that differs from a hospital, a drug
  maker or a local clinic.
examples:
- The CDC looks into new and unusual diseases.
- The CDC is based in Atlanta.
