simpleMeaning: the act of tying up a ship or boat with ropes when it arrives
scope: 'Also called moorage: the act of tying up an arriving ship with ropes, not joining a spacecraft
  to another, and not cutting money from pay.'
examples:
- Docking took a long time because the wind pushed the ship from the shore.
- The crew handled the docking carefully and tied the boat with strong ropes.
