senseId: 'flux%1:26:00::'
synsetId: 14068074-n
simpleMeaning: too much liquid flowing out from a space or part inside the body, as when loose, watery
  waste leaves the body again and again
scope: This is liquid leaving the body in a health problem, not a substance used with hot metal and not
  the lines of force around a magnet.
examples:
- The sick child had a flux, with watery waste leaving her body again and again.
- This flux comes from the gut and can make a person lose too much water.
