simpleMeaning: phrases used again and again so much that they no longer make sense
scope: 'Also called cant: a phrase used again and again until it no longer makes sense. Not a new and
  useful word, and not a sound made by bees.'
examples:
- The manager kept using buzzwords like 'fresh thinking' in every talk.
- That buzzword was in every ad last year, but no one knew what it meant.
