simpleMeaning: The down feathers of a young bird, which stay on some grown birds
scope: The down feathers of a young bird, which may stay on some grown birds, not the stiff feathers used
  for flight and not the outer coat of a grown bird.
examples:
- The chick was still covered in plumule.
- Some grown birds keep a patch of plumule under their wing feathers.
