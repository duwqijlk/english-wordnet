simpleMeaning: A shift in the skin's electrical traits under strain or worry, which can be gauged by noting
  the skin's electrical drag or the faint currents the body makes.
scope: This sense is also called electrical skin response, electrodermal response, and psychogalvanic
  response, for a shift in the skin's electrical traits under strain or worry, which can be gauged by
  noting the skin's electrical drag or the faint currents the body makes.
examples:
- The galvanic skin response rose under stress.
- Galvanic skin responses were noted.
