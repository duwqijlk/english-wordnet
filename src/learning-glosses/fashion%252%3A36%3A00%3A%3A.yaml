simpleMeaning: to make something from various parts, often in a quick, inventive way without a fixed plan.
scope: This is not the popular style of clothes or behavior, and not professional dressmaking; it is putting
  parts together to make something.
examples:
- She fashioned a shelter from branches and leaves.
- He fashioned a toy boat out of a piece of wood.
