simpleMeaning: the fear a person feels when they know that something is dangerous
scope: 'Alarm and dismay are other names for this sense: fear felt because danger is known, not a sudden
  start at a loud noise.'
examples:
- There was consternation in the crowd when the alarm sounded.
- To everyone's consternation, the bridge had been washed away.
