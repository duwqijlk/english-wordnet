simpleMeaning: Tunes for dancing, with a clear tune and a steady low beat, loved most of all in the late
  1970s and made mainly for dancing in clubs
scope: Dance tunes with a steady low beat, loved most of all in the late 1970s, not slow tunes and not
  live band tunes; disco is another name for this sense.
examples:
- Disco music filled the club with its steady low beat.
- They danced all night to disco music from the late 1970s.
