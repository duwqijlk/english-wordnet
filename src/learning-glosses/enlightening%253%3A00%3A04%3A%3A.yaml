simpleMeaning: That encourages a person to learn more and think better, and to get better in what they
  think is right and in how they act
scope: 'Also called edifying: this helps both the mind and a person''s sense of right and wrong, not only
  giving knowledge or taking away lack of knowledge.'
examples:
- The talk was enlightening, and it made the students think hard about how to live well.
- Reading the old letters was an enlightening hour that taught her more and made her want to do right.
