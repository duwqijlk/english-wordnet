simpleMeaning: To give your full attention and effort to a task.
scope: This is putting effort and attention into a task, not making use of an opportunity and not putting
  a substance onto a surface.
examples:
- If you apply yourself to the piano, you will improve quickly.
- He applied himself to the problem for the whole afternoon.
