simpleMeaning: A blood tube on each side that drains the upper part of the gland in the front of the neck
  into the large blood tube of the neck.
scope: A blood tube on each side that drains the upper part of the gland in the front of the neck; not
  a blood tube that brings blood to the gland and not a blood tube of the lower neck.
examples:
- The superior thyroid vein drains blood from the upper thyroid gland.
- Blood leaves the gland through the superior thyroid vein.
