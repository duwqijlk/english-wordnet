simpleMeaning: A careful account, set out in good order, that makes one set subject clear, usually in
  writing.
scope: Also called an exposition, a careful account that makes one set subject clear, usually in writing.
examples:
- His expounding of the poem took up a whole chapter.
- The expounding made the hard idea easy to follow.
