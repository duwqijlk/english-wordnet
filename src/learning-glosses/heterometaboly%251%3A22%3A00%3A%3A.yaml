simpleMeaning: Growth of insects by a change that is not full, in which no resting stage comes before
  they grow up
scope: This is growth of insects by a change that is not full, in which no resting stage comes before
  they grow up, also called heterometabolism, and not growth by a full change with a resting stage.
examples:
- Heterometaboly skips the resting stage.
- The insect shows heterometaboly in its growth.
