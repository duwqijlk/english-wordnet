simpleMeaning: The twists in its seed cases tell this bush or small tree of the south-western United States
  and north-western Mexico apart.
scope: This bush or small tree of the south-western United States and north-western Mexico is also called
  a screw bean, a screwbean, or a screwbean mesquite.
examples:
- A tornillo grew in the south-western United States.
- The tornillo bore pods twisted round like screws.
