simpleMeaning: The brain's thin cover and its outer layer have a web of tiny blood tubes between them.
scope: This web of tiny blood tubes in the brain is also called tomentum.
examples:
- Blood runs through the tomentum cerebri on its way through the brain.
- Blood moves through the tomentum cerebri on the surface of the brain.
