simpleMeaning: a person whose job is to plan how pictures and words should look on a page or screen
scope: This person plans pictures and words for pages or screens, not a person who plans clothes, not
  a person who plans the inside of rooms, and not a person who makes secret plans.
examples:
- A graphic designer made the cover for the new book.
- The graphic designer chose the pictures and letters for the website.
