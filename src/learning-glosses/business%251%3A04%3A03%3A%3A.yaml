simpleMeaning: a small action an actor performs while playing a scene for effect, rather than something
  essential to the story.
scope: This sense is not commerce, a company, or a matter needing attention; it means only the minor stage
  actions an actor adds for effect.
examples:
- The director added some comic business to the scene.
- She was praised for her subtle stage business during the long speech.
