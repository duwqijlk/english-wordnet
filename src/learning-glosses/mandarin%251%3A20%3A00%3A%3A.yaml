simpleMeaning: a small citrus tree or shrub with flattened round fruit, very sweet fragrant flesh and
  thin loose yellow-orange peel that comes off easily; native to southeastern Asia.
scope: Another name for mandarin orange and mandarin orange tree; this is the small tree that bears the
  fruit, not the fruit itself, and not a high official or a member of an elite group.
examples:
- The mandarin grows well in warm, humid climates.
- Bees pollinate the mandarin's small white flowers.
