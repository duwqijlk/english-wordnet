simpleMeaning: Breaking rock into small bits and sorting what is worth keeping from what is thrown away,
  by any of many ways of doing it
scope: 'Also called beneficiation, mineral dressing, mineral extraction, mineral processing or ore processing:
  breaking and sorting rock to keep what is worth keeping, not digging the rock out and not melting it
  down.'
examples:
- Ore dressing turns rough rock into useful stuff and waste.
- The plant does ore dressing before the metal is taken out.
