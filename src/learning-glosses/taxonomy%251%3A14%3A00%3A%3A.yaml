simpleMeaning: a way of putting living things into groups by how alike they are in their body form or
  in where they came from
scope: A way of grouping living things by how alike they are, not the study of the rules for doing this
  grouping.
examples:
- The taxonomy of plants puts roses and apples in the same family group.
- This book gives a new taxonomy of insects based on their body shape.
