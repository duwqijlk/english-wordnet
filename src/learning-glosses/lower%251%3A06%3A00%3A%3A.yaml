simpleMeaning: the bottom bed in a pair of beds, one above the other.
scope: This is only the bottom bed of a bunk pair; it is not the top bed, and not the verb or adjective
  uses of the word.
examples:
- He took the lower and let his brother climb up to the top bunk.
- The lower was already made up with clean sheets when we arrived.
