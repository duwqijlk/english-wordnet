simpleMeaning: a rock made of bits of rock and stone of many different sizes joined together
scope: This is a kind of rock made of small pieces. It is not the describing word for a group made of
  many different kinds of things gathered together.
examples:
- The cliff was made of conglomerate with pieces of different sizes.
- He found a piece of conglomerate on the river bank.
