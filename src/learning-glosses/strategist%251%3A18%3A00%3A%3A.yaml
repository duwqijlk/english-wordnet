simpleMeaning: a person who is very good at planning, most of all at planning war
scope: A person very good at planning, most of all at planning war; not a general who leads an army and
  not any person who makes plans.
examples:
- The old strategist had planned every battle of the war.
- As a strategist, she was known for thinking three moves ahead.
