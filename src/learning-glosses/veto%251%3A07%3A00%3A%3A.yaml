senseId: 'veto%1:07:00::'
synsetId: 05206196-n
simpleMeaning: the power or right to stop a planned act, most of all the power of a head of government
  to stop a planned law passed by the law-making group
scope: The power or right itself, not the verb sense that means to use that power and vote against something.
examples:
- The president used his veto to stop the new law.
- The veto stopped the plan from going ahead.
