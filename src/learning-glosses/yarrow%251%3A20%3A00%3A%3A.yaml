simpleMeaning: A common strong-smelling Eurasian herb that forms mats, with narrow toothed leaves and
  small usually white flower heads; now widespread across North America.
scope: The common meadow and roadside herb also called milfoil, not the water plant of the same name.
examples:
- Yarrow spread through the pasture and along the roadside.
- She picked a few stems of yarrow for the kitchen table.
