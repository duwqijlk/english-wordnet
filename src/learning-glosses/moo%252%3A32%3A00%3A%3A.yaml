simpleMeaning: to make a low, deep sound, as a cow or a bull does
scope: Also called low. This is the sound a cow or a bull makes, not the cry of a sheep or the short sound
  of a pig.
examples:
- The cows mooed when they saw the farmer coming with food.
- A bull mooed loudly across the field.
