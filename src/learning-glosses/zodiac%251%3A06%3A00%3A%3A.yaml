simpleMeaning: In astrology, a round picture that shows the 12 groups of stars and their signs
scope: This is the round picture showing the 12 groups of stars and their signs, not the belt-shaped area
  of sky itself that holds those groups.
examples:
- She drew a zodiac on the page, with all twelve signs around the circle.
- The book's zodiac shows which sign sits in each part of the circle.
