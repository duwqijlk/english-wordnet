simpleMeaning: The power to see things or events in the mind.
scope: The power to see things or events in the mind, also called imagery; not a dream and not a picture
  on paper.
examples:
- Her mental imagery of the sea was so clear she could smell the salt.
- His mental imagery helped him learn the route.
