simpleMeaning: The concerns of life in this world, seen as separate from heaven and from what comes after
  death.
scope: This is the world of daily life as opposed to heaven, not the planet, and not soil.
examples:
- The monk gave up the goods of earth and devoted himself to prayer.
- Her sermon asked the congregation to look beyond the cares of earth to the life to come.
