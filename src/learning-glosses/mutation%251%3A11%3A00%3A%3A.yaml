simpleMeaning: In genetics, any change in the inherited material of a living thing, the stuff that is
  passed on from parents to their young and that makes them what they are
scope: This is about a change in the inherited material itself, not about an organism that has been changed
  by it.
examples:
- A mutation in the gene changed the colour of the flower.
- Scientists study mutations to see how new traits appear.
