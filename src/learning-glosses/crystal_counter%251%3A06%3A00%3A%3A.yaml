simpleMeaning: A tube in which a charged particle makes electric current flow more easily, so the particle
  can be counted.
scope: A tube that counts charged particles, not a plain glass tube and not a device that counts light.
examples:
- The crystal counter clicked each time a charged particle passed through it.
- Scientists use a crystal counter to track bursts of radiation.
