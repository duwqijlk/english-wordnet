simpleMeaning: A rope used by a hangman to kill people who have been ordered to die by hanging
scope: This is a rope used by a hangman to kill people who have been ordered to die by hanging, also called
  halter, hemp, hangman's halter, and hangman's rope, and not a rope used to tie up goods or a scarf worn
  round the neck.
examples:
- The hempen necktie was the hangman's tool.
- In old tales, the hempen necktie ended the prisoner's life.
