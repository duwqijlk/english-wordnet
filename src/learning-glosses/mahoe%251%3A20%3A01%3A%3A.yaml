simpleMeaning: A shrubby tree found widely on tropical coasts, often grown for ornament; its light, tough
  wood is used in canoe outriggers and its fiber in rope and caulking.
scope: This sense is the shrubby tree of tropical coasts, grown for ornament and cut for light wood and
  fiber; balibago and mahagua are other names for it, while the other mahoe, the upright forest tree of
  Cuba and Jamaica, has dense cabinet timber.
examples:
- Mahoe grew thick along the edge of the lagoon.
- Canoe builders shaped outriggers from mahoe.
