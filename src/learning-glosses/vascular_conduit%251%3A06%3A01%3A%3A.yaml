simpleMeaning: a man-made tube that carries blood, put in by a surgeon to send the flow of blood a new
  way in one part of the body
scope: 'Also called a vascular prosthesis: a man-made tube put in by a surgeon to send blood a new way
  in one part of the body, not a blood vessel the body grew itself and not a tube that takes blood out
  of the body.'
examples:
- The surgeon fitted a vascular conduit to carry blood around the blocked part of the artery.
- After the operation, blood flowed through the vascular conduit to the leg.
