simpleMeaning: a shrub or small tree with feather-like leaves that poison farm animals, and thick clusters
  of strongly sweet-smelling blue flowers and red beans
scope: 'Also called coral bean, frijolito and mescal bean: a shrub or small tree with blue flowers and
  red beans, not a bean plant grown for food and not a shade tree.'
examples:
- The frijolillo blooms with blue flowers, but its leaves can poison farm animals.
- We kept the goats away from the frijolillo and its red beans.
