simpleMeaning: the act of limiting how much of something people are allowed to have or use
scope: The act of limiting how much people can have or use, not the limited amount itself and not a single
  share given to one person.
examples:
- During the war, the government brought in rationing of food and fuel.
- Rationing ended when there was enough food for everyone again.
