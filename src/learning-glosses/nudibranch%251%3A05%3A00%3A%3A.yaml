simpleMeaning: Any of the sea snails of the suborder it belongs to, with a shell-less, and often richly
  coloured, body.
scope: Any of the sea snails of the suborder it belongs to — the suborder Nudibranchia —, with a shell-less,
  and often richly coloured, body; also called sea slug.
examples:
- Their nudibranch drifted at dusk.
- The nudibranch was seen at noon.
