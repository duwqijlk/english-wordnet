scope: These are light-like waves of very short length made when fast-moving electrons hit a hard target,
  also called a roentgen ray, X-radiation and an X ray, not a picture made with such waves.
examples:
- An X-ray passes through soft parts of the body.
- Doctors use X-ray to look inside the body.
