simpleMeaning: an open part of a truck, or a trailer with no sides, used to carry large heavy things
scope: This is the road truck or trailer sense, not the open train car for goods that has the same name.
examples:
- The flatbed carried a large machine to the building site.
- They loaded the heavy boxes onto the flatbed.
