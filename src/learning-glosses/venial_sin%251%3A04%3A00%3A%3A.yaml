simpleMeaning: A wrong act that can be forgiven and costs only some of God's favour.
scope: A forgivable wrong act that costs only some grace; not a grave wrong act and not a mere mistake.
examples:
- A venial sin can be forgiven and costs only some grace.
- The priest said a venial sin is not a grave wrong.
