simpleMeaning: showing good sense in what you think and do, and based on good reasons
scope: This sense is about a person, choice, or idea that uses good sense and has good reasons behind
  it; it is close to the other reasonable sense, but this one stresses having a good reason.
examples:
- She had a reasonable fear that the road was unsafe at night.
- His reasonable plan was based on clear facts, not guesswork.
