simpleMeaning: to say openly that you believe in something, or that you are loyal to a person, group,
  or cause
scope: To say openly what you believe in or are loyal to; not to work in a job, teach a subject, or claim
  to know about it.
examples:
- She professed her faith in God in front of the whole church.
- The men professed allegiance to their country.
