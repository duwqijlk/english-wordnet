simpleMeaning: A person whose one parent is one-quarter black and whose other parent is white, and so
  one-eighth black
scope: A person who is one-eighth black, with one parent one-quarter black and the other white; not a
  quadroon, who is one-quarter black, and not a person who is half black.
examples:
- Her grandmother was an octoroon, with one white parent and one parent who was a quadroon.
- As an octoroon, he was one-eighth black.
