simpleMeaning: Saving someone from a wrong path and bringing them back to the right one.
scope: 'Also called reclamation: saving someone from a wrong path and bringing them back to the right
  one, not improving the existing form of a law, a custom, or an established way of doing things to make
  a striking change for the better in social, political, or religious life.'
examples:
- The reformation of the young thief took years of patient work.
- Their reformation began when they left the gang behind.
