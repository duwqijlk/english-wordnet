simpleMeaning: Any set of letter shapes held in a small case that can be pushed into a printer.
scope: Any set of letter shapes held in a small case that can be pushed into a printer, also called a
  cartridge font; not letter shapes built into a printer and not a case of ink.
examples:
- The font cartridge gave the printer a new set of letter shapes.
- She pushed the font cartridge into the printer.
