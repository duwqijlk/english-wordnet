simpleMeaning: A unit of electrical energy, the work done when a flow of one ampere goes through one ohm
  for one second.
scope: Not the tenth letter of the Roman set of signs; also called a joule and a watt second.
examples:
- One J is the work of one ampere through one ohm for a second.
- The heater gave off 100 J of heat.
