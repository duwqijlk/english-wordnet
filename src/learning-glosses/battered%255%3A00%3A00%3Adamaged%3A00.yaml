simpleMeaning: not in good condition, after being hit or used in a hard way
scope: This is about a thing damaged by hits or hard use, not about a person harmed again and again in
  body and feelings.
examples:
- He drove a battered old car with a bent door.
- The battered suitcase still held together after many trips.
