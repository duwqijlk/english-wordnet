simpleMeaning: a boat with sails and two tall poles for them; its small back pole and sail sit behind
  the post that holds the part used to steer
scope: 'Another name for a yawl: this is a sailing boat with two masts; it is not a man who takes great
  care with his clothes, and not the word for something very good.'
examples:
- They sailed along the coast in a small dandy with two masts.
- The dandy's small back sail sat behind the steering post, just as the boat builder planned.
