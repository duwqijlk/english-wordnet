simpleMeaning: A covering for things made of baked clay, metal, and other materials
scope: A coating for pots, metal, and other things, not a thin coating put on food and not the act of
  putting such a coat on.
examples:
- The glaze on the old pot had cracked in fine lines.
- A clear glaze covered the metal bowl and kept it from rusting.
