schema: oewn-learning-gloss-v2
senseId: 'feather%2:35:01::'
synsetId: 01275479-v
simpleMeaning: In carpentry, to join pieces of wood by fitting a thin edge that sticks out on one piece
  into a long cut in the other
scope: This sense is about joining pieces of wood, not the light growth on a bird and not the act of turning
  an oar.
examples:
- The carpenter feathered the two boards so their edges fitted tightly.
- He feathered each joint to join the wooden panels without gaps.
