senseId: 'foreclose%2:40:00::'
synsetId: 02281413-v
simpleMeaning: to go through steps set by law to take away a borrower's right to keep their property by
  paying back their loan in full
scope: To take property through the law when a loan is not paid back; not a normal sale of a house and
  not the act of lending the money in the first place.
examples:
- The bank moved to foreclose on the house after the loan had not been paid for a year.
- The bank foreclosed on the farm when its owners could not pay back the loan.
