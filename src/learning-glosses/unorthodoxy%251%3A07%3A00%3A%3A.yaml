senseId: 'unorthodoxy%1:07:00::'
synsetId: 04807978-n
simpleMeaning: The quality of not following the beliefs most people hold to be right.
scope: The quality of not following accepted beliefs, not any set of opinions against the official position,
  and not a belief that turns away from the teachings of a religion.
examples:
- His unorthodoxy shocked the older members.
- The writer was known for her unorthodoxy.
