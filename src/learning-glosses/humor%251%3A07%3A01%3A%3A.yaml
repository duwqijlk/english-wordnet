simpleMeaning: the part of a person's way of being that lets them enjoy what is funny and say or do funny
  things
scope: 'Also called humour: the part of a person that lets them enjoy funny things, not a joke or message
  that makes people laugh and not a state of feeling.'
examples:
- She has a warm sense of humor and can laugh at her own mistakes.
- You need a good sense of humor to enjoy his teasing.
