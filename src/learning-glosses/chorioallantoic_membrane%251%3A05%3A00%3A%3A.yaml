simpleMeaning: The outer skin joins the near wall of the sac that holds the young one to make a skin full
  of blood tubes round an unborn young one.
scope: Also called chorioallantois, it is a blood-rich skin round an unborn young one, made of two joined
  skins.
examples:
- The chorioallantoic membrane was full of blood tubes.
- The chorioallantoic membrane joined two skins round the young one.
