simpleMeaning: In physics and chemistry, the smallest part of an element or compound that still is that
  element or compound
scope: In physics and chemistry, the smallest part of an element or compound, not a tiny bit of any thing
  in everyday talk.
examples:
- A molecule of water holds two bits of hydrogen and one of oxygen.
- Each molecule of the gas moves on its own.
