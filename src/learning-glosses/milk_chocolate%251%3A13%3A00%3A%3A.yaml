simpleMeaning: An eating chocolate blended from cocoa mass (ground roasted cocoa), sugar, cocoa butter,
  milk powder, vanilla and, usually, lecithin; the commonest kind, used in candy, baking and coatings.
scope: The everyday eating chocolate that contains milk; not dark chocolate, which has no milk solids,
  nor white chocolate, which has no cocoa solids.
examples:
- She keeps a bar of milk chocolate in her desk drawer for emergencies.
- Two squares of milk chocolate melted slowly in the warm pan.
