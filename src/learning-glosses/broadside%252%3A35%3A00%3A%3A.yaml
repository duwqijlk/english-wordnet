simpleMeaning: to crash into the side of something
scope: This is crashing into the side of something, not firing all the guns on one side of a warship,
  not a printed notice, and not the side of a ship itself.
examples:
- Her car broadsided mine at the crossroads.
- The truck broadsided the van as it crossed the road.
