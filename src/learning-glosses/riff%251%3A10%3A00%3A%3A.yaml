senseId: 'riff%1:10:00::'
synsetId: 07059846-n
simpleMeaning: In jazz, a short set of notes played again and again, which usually gives a background
  for one player to make up music alone as they play
scope: A short repeated part in jazz that supports a solo, not the solo itself and not a whole song.
examples:
- The band played the same riff while the sax player made up a solo.
- He kept playing a short riff behind the singer's solo.
