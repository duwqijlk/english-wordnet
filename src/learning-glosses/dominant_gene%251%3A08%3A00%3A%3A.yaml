senseId: 'dominant_gene%1:08:00::'
synsetId: 05445176-n
simpleMeaning: A unit of heredity that gives the same outward effect in the living thing whether or not
  its pair matches
scope: A unit of heredity that gives the same outward effect whether or not its pair matches, not a unit
  whose effect hides when paired.
examples:
- The dominant gene for brown eyes passed to the child.
- A dominant gene shows its effect even with one copy.
