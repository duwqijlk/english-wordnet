simpleMeaning: A set form of words in speech that cries out a strong feeling
scope: A set form of words in speech that cries out feeling, not a loud complaint, protest, or reproach.
examples:
- His speech ended with the exclamation 'O times! O customs!'
- The teacher showed how an exclamation can lift a plain sentence into strong feeling.
