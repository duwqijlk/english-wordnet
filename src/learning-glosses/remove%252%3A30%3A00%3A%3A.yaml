simpleMeaning: to take something away from where it is, by lifting, pushing or taking it off, whether
  the thing is physical or abstract
scope: This is not about forcing someone out of a job; it is about taking a thing away.
examples:
- She removed the lid from the jar.
- The new evidence removed any doubt about his guilt.
