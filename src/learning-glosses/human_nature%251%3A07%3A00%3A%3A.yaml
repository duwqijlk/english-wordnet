simpleMeaning: The ways of thinking and feeling that all people are thought to have in common.
scope: The ways of thinking and feeling that all people are thought to have in common, not one person's
  character and not learned culture.
examples:
- It is only human nature to want to be liked.
- She is a great observer of human nature.
