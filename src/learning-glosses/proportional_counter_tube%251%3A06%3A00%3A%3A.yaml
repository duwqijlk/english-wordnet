simpleMeaning: a pipe that counts tiny charged bits, giving out a pulse that grows with the number of
  bits made
scope: A pipe that counts tiny charged bits, giving out a pulse that grows with the number made; also
  called proportional counter; not a tube that only says yes or no, and not a meter that shows a steady
  number.
examples:
- The proportional counter tube gave a bigger pulse when more ions were made.
- We read the output of the proportional counter tube after each test.
