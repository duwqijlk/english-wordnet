simpleMeaning: carbon-based substances that join with water to make a sour substance
scope: 'Another name for acid anhydrides: carbon-based substances that join with water to make a sour
  substance, not acids themselves and not substances that do not change in water.'
examples:
- The acyl anhydrides in the flask joined with water and made an acid.
- When acyl anhydrides meet water, a sour substance forms.
