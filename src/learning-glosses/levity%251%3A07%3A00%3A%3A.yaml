simpleMeaning: a way of acting or speaking that is not serious
scope: This sense is a light, joking way of behaving when a serious way is needed. It is not light in
  weight, and it is not simple happiness or fun.
examples:
- His levity at the funeral upset the family.
- The judge warned him that levity had no place in court.
