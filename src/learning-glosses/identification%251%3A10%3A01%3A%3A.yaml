simpleMeaning: A paper, mark, or other thing that shows who a person is or what a thing is.
scope: A paper, mark, or other thing that shows who a person is or what a thing is, not the act of naming
  it, and not the state of having been named.
examples:
- He showed his identification at the gate.
- The ring served as identification of the body.
