simpleMeaning: without honesty or good character, and worthy of shame for doing wrong
scope: 'Also called dishonourable: without honesty or good character and worthy of shame. It is not the
  narrower sense of cheating or tricking people.'
examples:
- His dishonorable lies ended his career in public life.
- Stealing from the poor was a dishonorable act that everyone condemned.
