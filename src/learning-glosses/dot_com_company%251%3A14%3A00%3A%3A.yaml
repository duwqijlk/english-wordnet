simpleMeaning: a firm that does most of its trade on the web, with a web name ending in the letters c,
  o and m
scope: A firm that does most of its trade on the web, with a web name ending in the letters c, o and m,
  also called dot-com and dot com; not a shop on a high street and not a firm that only puts adverts on
  the web.
examples:
- The dot com company sold books only on the web.
- Many dot com companies failed in 2001.
