simpleMeaning: a thick root you can eat, from plants in the Dioscorea group, grown for food in hot lands
  all over the world
scope: This is the root itself, eaten as food, not the climbing plant that grows it and not a sweet potato
  with deep orange flesh inside.
examples:
- She cooked yam with rice for supper.
- Yams from hot countries are sold in the market as food.
