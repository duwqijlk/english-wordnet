simpleMeaning: steady and free from trembling, especially in a person's voice, hands, or step
scope: This describes a voice, hand, or step that does not shake or tremble, not tissue that is springy
  and healthy, and not a determination that cannot be shaken.
examples:
- Despite the cold, his voice stayed firm and calm.
- His hand was firm as he signed the document.
