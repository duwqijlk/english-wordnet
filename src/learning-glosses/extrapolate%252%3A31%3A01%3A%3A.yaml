simpleMeaning: to learn about an area you do not know or have not been in, by using what you do know to
  work out what is there
scope: This means learning about an unknown area from known facts, not learning by going there yourself
  and not a guess made with no facts.
examples:
- From the few reports they had, scientists extrapolated what life was like in the valley no one had visited.
- She used old maps to extrapolate what the land she had never seen was like.
