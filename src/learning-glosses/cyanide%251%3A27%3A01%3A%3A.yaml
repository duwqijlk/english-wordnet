senseId: 'cyanide%1:27:01::'
synsetId: 14851516-n
simpleMeaning: any of a group of carbon-based chemicals that contain -CN (one carbon atom joined to one
  nitrogen atom)
scope: Also called nitrile. This is the wider group of chemicals with -CN, not the very poisonous salt
  sense of the same word.
examples:
- Acetonitrile is a cyanide used in the lab as a liquid for mixing other chemicals.
- The chemist made a new cyanide by joining a -CN group to a carbon chain.
