simpleMeaning: In computing, a stored set of ready-made code, with small bits that each do one job, ready
  to use at once
scope: In computing, a stored set of ready-made code for use at once, also called library, and not a set
  of books on shelves.
examples:
- The program library gave her a ready-made sort routine.
- He added the new code to the program library.
