simpleMeaning: flat animals that live on or in another animal and hold on to it with small cups on the
  outside of their bodies
scope: These are flat animals that live on another animal; fluke and trematode are other names for this
  sense. Not a round worm and not a free-living flat worm.
examples:
- The vet found a trematode worm in the sheep's liver.
- Trematode worms use suckers to stay fixed to their host.
