simpleMeaning: a short note in a book, a piece of music, or on a photograph, giving it to someone or something
scope: A short note giving a book, a piece of music, or a photograph to someone, not the act of giving
  yourself to a course of action and not a ceremony that gives a building a purpose.
examples:
- The dedication in the front of the book reads 'To my mother'.
- She wrote a dedication on the photograph before giving it to him.
