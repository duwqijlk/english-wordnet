simpleMeaning: wood piled high so a dead body can be burned on it during the last rites for the dead
scope: 'Another name for a pyre: wood piled high to burn a dead body at the last rites, not a fire for
  warmth and not a grave in the ground.'
examples:
- The funeral pyre was built on the riverbank at dawn.
- Mourners placed flowers beside the funeral pyre.
