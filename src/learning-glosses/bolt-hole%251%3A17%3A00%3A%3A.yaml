senseId: 'bolt-hole%1:17:00::'
synsetId: 09249274-n
simpleMeaning: a way out through which an animal can run fast to get away when it is chased into its home
scope: A way out for a chased animal to run through, not the animal's home itself and not a door in a
  house.
examples:
- The rabbit dashed through a bolt-hole in the fence.
- A bolt-hole at the back of the burrow let the fox escape.
