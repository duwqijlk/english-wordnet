simpleMeaning: a judgement, based on past dealings, of how reliably a person or organization can pay what
  it owes
scope: This is an assessment of someone's ability to repay, not a loan arrangement, an academic unit,
  or a note naming a source.
examples:
- The bank refused the loan because the company's credit was poor.
- Suppliers check a new customer's credit before agreeing to monthly payments.
