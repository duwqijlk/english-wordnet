simpleMeaning: a person in charge of the pictures and the way the pages are set out in books and other
  printed work
scope: The person who plans pictures and page design in a book or paper, not the person who fixes the
  words and not a designer of the cover alone.
examples:
- The art editor chose the pictures for the new book.
- Our art editor planned the page layout for the magazine.
