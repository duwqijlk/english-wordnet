simpleMeaning: A yearly state in which males of some large animals, above all elephants, feel strong sexual
  excitement, and fluid runs from a gland between the eye and the ear.
scope: This is the yearly state in male elephants and some other large animals, with strong sexual excitement
  and fluid from a gland by the eye — not just any time of mating or a sickness.
examples:
- The elephant was in musth and hard to handle.
- During musth, fluid runs from a gland by the elephant's eye.
