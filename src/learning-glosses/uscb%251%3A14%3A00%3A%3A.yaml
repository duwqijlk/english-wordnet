simpleMeaning: The part of the Treasury Department that makes people pay the taxes on goods brought in
  from other countries.
scope: The part of the Treasury Department that collects taxes on goods from other countries, also called
  Bureau of Customs, Customs Bureau, and Customs Service; not the parts of the Treasury that deal with
  money at home.
examples:
- The USCB checked the goods at the port.
- The USCB collects import tariffs.
