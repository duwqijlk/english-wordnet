simpleMeaning: Of or having to do with the pull that draws things toward one another, or caused by that
  pull
scope: 'Gravitational is another name for this sense: about the pull that draws things toward one another,
  not about weight alone and not about falling.'
examples:
- Gravitative forces hold the planets in their paths.
- The gravitative pull of the moon moves the tides.
