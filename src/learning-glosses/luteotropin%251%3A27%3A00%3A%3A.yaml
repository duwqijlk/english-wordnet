senseId: 'luteotropin%1:27:00::'
synsetId: 14773722-n
simpleMeaning: A hormone of the sex glands, from the front pituitary; in females it makes the glands that
  make milk grow and starts milk flow after birth.
scope: Also called lactogenic hormone and prolactin, a hormone of the sex glands, from the front pituitary;
  in females it makes the glands that make milk grow and starts milk flow after birth, where lactogenic
  hormone means a hormone of the sex glands made by the pituitary at the front, that in females spurs
  the milk-making glands to grow and starts milk flow after birth.
examples:
- Luteotropin spurs milk-making.
- Luteotropin acts after birth.
