simpleMeaning: A huge tree of hot lands, with deep ridges down its great trunk and large pods of seeds
  in silky floss, the tree the silky fibre comes from.
scope: Also called ceiba tree, silk-cotton tree, and white silk-cotton tree, this is a huge tree of hot
  lands, not the silky fibre that comes from it.
examples:
- Kapok trees lined the road.
- The kapok towered over the other trees.
