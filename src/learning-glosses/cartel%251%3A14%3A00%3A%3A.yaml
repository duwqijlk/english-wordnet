simpleMeaning: a group of separate firms that join together to cut down competition by fixing how much
  of a thing or a service is made and supplied
scope: A group of separate firms that join together to cut down competition by fixing how much of a thing
  or a service is made and supplied; trust and combine are other names for this sense, not a single big
  firm, and not a trade union.
examples:
- The oil cartel kept prices high by limiting how much oil was sold.
- A cartel of sugar firms agreed to hold back supply.
