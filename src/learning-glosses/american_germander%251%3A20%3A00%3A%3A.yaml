simpleMeaning: A low bush with toothed leaves and cream-coloured to pink or purple flowers in spike-like
  bunches, from North America.
scope: A low bush with toothed leaves and cream-coloured to pink or purple flowers, also called wood sage
  and Teucrium canadense; its nearest kin are other low bushes with toothed leaves.
examples:
- American germander grew low by the path with pink flowers.
- We saw American germander in flower on the dry hillside.
