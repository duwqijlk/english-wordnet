simpleMeaning: To change a thing so it works at its best, using the least room, time, or cost
scope: To change a thing to work at its best, not to look on the bright side and not simply to get the
  most out of it.
examples:
- They optimized the program to run faster.
- She optimized the store room to hold more boxes.
