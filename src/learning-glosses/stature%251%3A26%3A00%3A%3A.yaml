simpleMeaning: The great respect that comes from fine growth or from doing great things
scope: The great respect that comes from fine growth or from doing great things; not tallness of body,
  and not fame that comes from wealth alone.
examples:
- His stature in the town grew after he built the new school.
- She won stature among her fellow scientists for her long years of work.
