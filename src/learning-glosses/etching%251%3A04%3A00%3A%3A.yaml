simpleMeaning: the work of making plates with designs cut into them and printing designs from those plates
scope: 'Also called engraving: the work of making plates and printing from them, not the plate itself
  and not one printed picture.'
examples:
- She learned etching at art school and printed pictures from metal plates.
- Etching takes time because each plate must be cut and printed by hand.
