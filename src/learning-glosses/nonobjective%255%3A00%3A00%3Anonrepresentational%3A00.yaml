simpleMeaning: Copying nothing in nature, it shows no real thing from the world outside
scope: 'Abstract, abstractionist and nonfigurative are other names for this sense: art that shows no real
  thing, not a picture of something real.'
examples:
- The gallery hung a large nonobjective painting full of bright blocks of colour.
- Her nonobjective work shows no faces or places, only shapes and lines.
