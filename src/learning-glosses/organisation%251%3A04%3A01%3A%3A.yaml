simpleMeaning: the work, or what comes from it, of putting people or things in the right places in a careful,
  planned way
scope: 'Also called organization: the work, or what comes from it, of putting people or things in place
  in a planned way, not a neat way of working in general and not the group of people who run something.'
examples:
- Good organisation of the workers helped the factory run well.
- The organisation of the books on the shelves took all morning.
