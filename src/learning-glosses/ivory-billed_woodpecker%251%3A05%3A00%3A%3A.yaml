simpleMeaning: In the southern United States and Cuba lives a big black-and-white bird that pecks at trees,
  with a pale bill, and it is almost gone
scope: A big black-and-white bird that pecks at trees, with a pale bill, also called ivorybill; not a
  small tree-pecking bird and not a bird with a dark bill.
examples:
- The ivory-billed woodpecker was once seen in the swamps of the southern United States.
- A lone ivory-billed woodpecker tapped at the dead tree.
