senseId: 'estate%1:14:00::'
synsetId: 08184264-n
simpleMeaning: one of the main social groups in a country, seen as a whole in its political life and once
  having its own political rights, especially in Britain.
scope: This is not land or property, and not the total wealth a person leaves when they die.
examples:
- In old England, the clergy, the nobility and the common people were the three estates of the realm.
- The first estate was the clergy, and it held great influence in the kingdom.
