simpleMeaning: a person who feels deep sadness, as when someone they love has died
scope: This is a person who feels deep sadness after a death, not the person who has died and not a helper
  at a funeral.
examples:
- The griever sat quietly by the grave.
- Grievers often need time and kind support after a death.
