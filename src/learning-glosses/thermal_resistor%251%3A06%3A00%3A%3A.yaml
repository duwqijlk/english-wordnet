simpleMeaning: A small part of stuff that only partly lets power through, whose hold on power shifts with
  heat, so it can steady other parts when the heat shifts.
scope: A part whose push-back shifts with heat, also called thermistor; it steadies other parts in a set
  of wires.
examples:
- The thermal resistor kept the radio steady as the room grew hot.
- A thermal resistor changes its push-back when the heat changes.
