simpleMeaning: The power of the mind to reason, draw conclusions and tell things apart.
scope: This is the mental power to reason, not the state of having grasped a particular thing and not
  a sympathetic agreement with an opinion.
examples:
- Reason and understanding are what allow us to weigh evidence and reach conclusions.
- The philosopher treated understanding as a power of the mind rather than a store of facts.
