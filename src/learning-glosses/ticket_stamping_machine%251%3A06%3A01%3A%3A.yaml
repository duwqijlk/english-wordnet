simpleMeaning: a self-working device that prints where and when on a travel card to make it good for use
scope: This is a device that marks a ticket to make it good for travel, adding where and when it was used;
  ticket-stamping machine is another name for this sense. Not a machine that sells tickets and not a hand
  stamp.
examples:
- He held his ticket under the ticket stamping machine at the gate.
- The ticket stamping machine marked her ticket with the time and place.
