schema: oewn-learning-gloss-v2
senseId: 'disprover%1:18:00::'
synsetId: 10530139-n
simpleMeaning: A person in a debate who shows a claim is wrong by giving facts or reasons against it
scope: A debater who shows a claim is wrong with facts or reasons, not a person who merely disagrees;
  confuter, rebutter and refuter are other names for this sense.
examples:
- The disprover showed the claim was wrong with new facts.
- A good disprover answers with reasons, not shouts.
