simpleMeaning: to pour out money, gifts, or praise in large amounts, without holding back, even for things
  you cannot touch
scope: 'Also called shower: to give or spend a lot in a free and open way, not to save carefully and not
  to give only a little.'
examples:
- He lavished praise on the young singer.
- They lavished money on the new house.
