simpleMeaning: The ruler of a Muslim country, above all the ruler of the old Ottoman Empire.
scope: Also called a sultan; the ruler of a Muslim country, above all the ruler of the old Ottoman Empire,
  set beside the caliph and the sheikh, other Muslim rulers.
examples:
- The grand Turk ruled the Ottoman Empire from his palace.
- A grand Turk held power over a great Muslim land.
