senseId: 'sensationalism%1:10:00::'
synsetId: 07102245-n
simpleMeaning: In newspapers, using shocking stories to please readers with coarse tastes.
scope: The news habit of using shocking stories to please coarse tastes, not the stories themselves, not
  the philosophy belief about feeling, and not the belief that all knowledge comes from experience.
examples:
- The tabloids relied on sensationalism to keep their readers.
- Critics blamed sensationalism for the paper's low tone.
