senseId: 'fogginess%1:26:00::'
synsetId: 14545250-n
simpleMeaning: A cloud of some stuff hanging in the air, so that one cannot see far.
scope: Also called fog, murk, or murkiness, air in which one cannot see far because of a cloud of some
  stuff in it; not the quality of being unclear and without sharp edges.
examples:
- The fogginess over the river hid the far bank.
- Morning fogginess slowed the traffic on the road.
