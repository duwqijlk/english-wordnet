simpleMeaning: The arm of the United States government that sets up and runs the nation's plans for moving
  people and goods; set up in 1966.
scope: Not the arm that deals with farms or with trade; also called DoT and the Department of Transportation.
examples:
- Transportation plans the nation's highways.
- She works for Transportation in Washington.
