simpleMeaning: One of the scales that go down note by note in the music of old Greece
scope: One of the old Greek scale patterns, a set of notes that steps down one note at a time, distinct
  from other old Greek patterns and from modern major and minor scales.
examples:
- The Greek mode fell step by step through the notes.
- She played a Greek mode on the lyre.
