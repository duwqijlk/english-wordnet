simpleMeaning: The part of healing that deals with finding and treating illnesses found most often in
  hot regions
scope: The part of healing that deals with illnesses found most often in hot regions, not the study of
  cold-climate illnesses and not surgery.
examples:
- She studied tropical medicine before working in Africa.
- Tropical medicine covers illnesses such as malaria and dengue.
