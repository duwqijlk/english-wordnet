simpleMeaning: a long dress for a woman, usually with a tight top and a wide skirt that spreads out, often
  worn at formal events
scope: A long dress for a woman, often worn at formal events, not a long loose robe for a ceremony and
  not a loose dress worn in bed.
examples:
- She wore a beautiful gown to the dance, with a tight top and a wide skirt.
- The bride chose a long white gown for her wedding.
