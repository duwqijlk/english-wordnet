simpleMeaning: The part of the United States flying force that is the main source of fighting planes and
  arms; it runs fighter, bomber, spy, battle-control and rescue planes
scope: The main source of fighting planes and arms for the United States flying force; ACC is another
  name for this sense, not other parts of the flying force that train pilots or move supplies.
examples:
- Air Combat Command runs the fighter planes.
- The Air Combat Command sent rescue planes to the coast.
