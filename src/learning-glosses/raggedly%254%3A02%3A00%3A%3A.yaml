simpleMeaning: in a way that looks rough, untidy, and not even
scope: This is about how something looks, rough and not even, not about an action done in an irregular
  or uneven way.
examples:
- A long beard, raggedly cut, made his face look rough and uneven.
- The cloth was raggedly cut, so its edge looked rough and not straight.
