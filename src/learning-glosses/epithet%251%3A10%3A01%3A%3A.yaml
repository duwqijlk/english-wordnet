simpleMeaning: a word or phrase that says untrue things about a person to harm how others think of them,
  or is used to be rude and hurt them
scope: 'Another name for this sense is name: this is a hurtful word or phrase used against a person, not
  a kind word added to a person''s name to describe them.'
examples:
- He shouted a rude epithet at the driver.
- The article was full of epithets against the mayor, calling him a thief and a liar.
