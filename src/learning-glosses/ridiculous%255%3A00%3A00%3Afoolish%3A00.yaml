simpleMeaning: so silly and wrong-headed that people laugh at it in scorn
scope: So silly that people laugh at it in scorn, not wildly funny like a stage play and not a thing that
  makes people feel scornful pity.
examples:
- His excuse was so ridiculous that no one believed it.
- That plan is ridiculous; it could never work.
