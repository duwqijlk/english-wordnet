simpleMeaning: The old wood at the middle of a tree or woody plant, no longer at work, usually darker
  and more closely packed than the live wood round it.
scope: The old wood at the middle of a tree or woody plant, also called duramen, no longer at work, usually
  darker and more closely packed than the live wood round it.
examples:
- The heartwood of the oak was dark and hard.
- They cut through the pale sapwood to the heartwood within.
