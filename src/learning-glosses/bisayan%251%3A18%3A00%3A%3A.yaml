simpleMeaning: In the Philippines, this is a person of the native people there, the largest group in the
  land
scope: Also called Visayan, this is one person of that people, not the whole people and not a person from
  any other group in the Philippines.
examples:
- He is a Bisayan from the central Philippines.
- Many Bisayan families live on the islands.
