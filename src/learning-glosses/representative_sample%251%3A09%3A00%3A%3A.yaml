schema: oewn-learning-gloss-v2
senseId: 'representative_sample%1:09:00::'
synsetId: 06036477-n
simpleMeaning: a group of people or things is split into smaller groups and a few are picked by chance
  from each group
scope: 'Also called a proportional sample and a stratified sample: a fair pick that takes some from each
  part of a group, not a pick from one part only and not a pick by choice.'
examples:
- A representative sample of the town's voters was asked about the new plan.
- Researchers took a representative sample from every age group.
