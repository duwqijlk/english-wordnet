simpleMeaning: a punctuation mark (-) used between parts of a joined word, or between parts of a word
  split at the end of a line of writing
scope: 'Also called dash: this is the small mark that joins parts of a word or splits a word at the end
  of a line, not the act of joining or splitting a word with it.'
examples:
- Use a hyphen in 'mother-in-law'.
- The hyphen at the end of the line shows that the word goes on.
