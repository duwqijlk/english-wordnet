simpleMeaning: in old times, a suit of flat iron or steel pieces that covered a person's whole body
scope: 'Also called full plate armour: an old suit of metal that covers the whole body, not a single breastplate
  and not modern battle gear.'
examples:
- The knight wore his full plate armor into battle.
- His full plate armor covered him from head to foot.
