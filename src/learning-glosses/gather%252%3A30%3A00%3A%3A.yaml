simpleMeaning: To grow in quantity as more of something is collected and added.
scope: This is about amounts piling up over time, also called 'accumulate', not people or things coming
  together in one place or a conclusion drawn from evidence.
examples:
- Rainwater gathered in the low corner of the yard.
- Debt can gather quickly when only the interest is paid.
