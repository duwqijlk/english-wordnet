simpleMeaning: One of the first sheets of cells in a new life, it becomes the soft wet skin inside the
  food pipe and the breathing tubes.
scope: This inner sheet of cells is also called endoblast, endoderm, entoblast, and entoderm, and it is
  not the outer sheet of cells.
examples:
- The hypoblast grows into the lining of the gut.
- The hypoblast becomes the lining of the airways as the young life grows.
