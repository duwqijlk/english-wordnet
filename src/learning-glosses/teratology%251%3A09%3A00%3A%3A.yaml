simpleMeaning: In biology, the study of how a living thing can grow wrongly, far from the usual form
scope: The study of wrong growth in living things, not the treatment of such growth and not the study
  of normal growth.
examples:
- She studied teratology to learn why some babies are born with missing limbs.
- Teratology looks at how living things can grow in a wrong way.
