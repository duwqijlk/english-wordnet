simpleMeaning: a nerve that carries signals from receptors, parts of the body that pick up touch, heat
  and other things, in toward the brain and spine
scope: A nerve that carries signals from the sense organs in toward the brain and spine; afferent nerve
  is another name for this sense, not a nerve that carries orders out to the body, and not the word used
  to describe such nerves.
examples:
- The afferent carried the touch signal to her brain.
- Damage to an afferent can block feeling from the skin.
