simpleMeaning: A step taken to cut costs, or the money saved by spending less.
scope: One step taken to cut costs, or the money saved, rather than the whole production-and-trade system,
  the general efficient use of resources, or the habit of being thrifty.
examples:
- Buying in bulk turned out to be a real economy for the family.
- The factory made several economies by reusing its packaging.
