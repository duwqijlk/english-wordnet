simpleMeaning: Either a salt or an ester, this chemical comes from oxalacetic acid
scope: 'Also called oxalacetate: this is a salt or an ester that comes from one acid, not the acid itself
  and not a compound made from a different acid.'
examples:
- The oxaloacetate in the mixture was a salt of oxalacetic acid.
- Oxaloacetate also turns up as an ester of the same acid.
