simpleMeaning: Those who own shares will protest if the heads of a firm turn down this offer to buy the
  firm, because the offer is so good
scope: The offer to buy a firm in this sense is one its heads must say yes to, because it is so good.
examples:
- A bear hug left the heads of the firm with no choice but to say yes.
- The heads of the firm said yes to the bear hug.
