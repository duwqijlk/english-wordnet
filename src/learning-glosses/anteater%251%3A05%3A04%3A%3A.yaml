simpleMeaning: A mammal with no teeth, from southern Africa and Asia, whose body is covered in hard scales,
  with a long snout for eating ants and termites.
scope: Also called a pangolin or a scaly anteater; a toothless mammal with hard scales, not the African
  night kind or the spiny kinds.
examples:
- The anteater pushed its long snout into the termite mound.
- An anteater in southern Africa feeds on ants and termites.
