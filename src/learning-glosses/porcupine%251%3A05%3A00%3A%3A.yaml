simpleMeaning: A fairly large rodent (an animal with strong front teeth, like a rat), with sharp stiff
  hairs among its fur that can stand up
scope: This is the animal itself, also called a hedgehog; it is not a pig, and not the sharp hairs alone.
examples:
- A porcupine raised its sharp hairs when the dog came close.
- We saw a porcupine slowly crossing the forest path at night.
