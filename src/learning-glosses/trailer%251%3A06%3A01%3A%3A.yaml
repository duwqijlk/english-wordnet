simpleMeaning: a large vehicle for carrying loads, made to be pulled by a truck or tractor
scope: This sense is a thing for carrying loads behind a truck or tractor, not a wheeled home that people
  can live in and not a short film that shows parts of a coming film.
examples:
- The truck pulled a trailer full of heavy boxes.
- They loaded the wood onto the trailer behind the tractor.
