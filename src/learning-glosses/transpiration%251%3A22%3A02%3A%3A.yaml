simpleMeaning: The act of giving off water vapour through the skin or the moist linings of the body.
scope: This sense is the act of giving off water vapour through the skin or the moist linings of the body,
  unlike the sense for the passing of gases through fine tubes, from gaps in push or heat.
examples:
- Transpiration lets water vapour escape through the skin.
- Sweat is one form of transpiration through the skin.
