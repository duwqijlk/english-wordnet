simpleMeaning: the middle part of a car wheel, or of a fan, propeller, or similar thing, through which
  the turning bar passes
scope: The middle part of a wheel, fan or propeller that the turning bar passes through; not a busy centre
  where things meet.
examples:
- The hub of the wheel was cracked.
- Grease the hub before you put the wheel back on.
