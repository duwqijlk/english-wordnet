simpleMeaning: Having the mental tools and knowledge needed for a task.
scope: This describes a person's mental readiness and knowledge, not the fact that practical preparations
  have been made for an event.
examples:
- Only a prepared mind could follow that lecture.
- Years of study left her prepared for the hardest questions.
