simpleMeaning: Putting plant food or dung on the land so that plants can grow well there
scope: 'Also called dressing, fertilization, or fertilisation: putting plant food or dung on land so plants
  grow well, not joining male and female cells and not watering the land.'
examples:
- The farmer's fecundation of the field made the wheat grow tall.
- Fecundation with manure each spring kept the garden rich.
