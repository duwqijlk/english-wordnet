simpleMeaning: having parts that fit together in a neat, clear way that also looks or feels pleasing as
  a whole
scope: Parts fitting together neatly and pleasingly, also called ordered, consistent and logical, and
  not clear thinking or waves in step.
examples:
- She gave a coherent account of what happened.
- The essay was coherent, with each part fitting the next.
