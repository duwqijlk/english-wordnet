simpleMeaning: A plant that loses its leaves, grown widely in the southern United States for show, for
  its fine maple-like leaves and long clusters of yellow-green flowers, then odd leaf-like pods.
scope: Also called phoenix tree, Chinese parasol, Firmiana simplex, and Japanese varnish tree; a leaf-losing
  plant of the southern United States grown for show for its maple-like leaves and yellow-green flowers.
examples:
- The Chinese parasol tree shades the garden.
- A Chinese parasol tree grows in the southern United States.
