simpleMeaning: A mushroom that joins its stalk only at the very top, with a spore-making top shaped like
  a small cup hanging down.
scope: This mushroom is known by its cup-shaped top, which joins its stalk only at the very top.
examples:
- We found a bell morel, its cup-shaped top hanging down from the stalk.
- The bell morel's top joined the stalk only at the very top.
