simpleMeaning: In Judaism, Jews' day count from 3761 BC, assumed date of the Creation of the world, with
  a 354-day moon year fitted to the sun year by regular leap years.
scope: Also called the Jewish calendar; the Jews' count of days and years, not the Christian count.
examples:
- The Hebrew calendar counts years from 3761 BC.
- Passover falls on a date set by the Hebrew calendar.
