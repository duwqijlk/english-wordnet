simpleMeaning: to do with, or caused by, a living thing that lives on or in another living thing and takes
  food from it
scope: 'Also called parasitical: this sense is about or caused by a living thing that lives off another
  living thing, not the wider sense used for a person or plant that depends on others.'
examples:
- Ticks can spread a parasitic infection to dogs.
- The fish was weak from a parasitic worm living inside it.
