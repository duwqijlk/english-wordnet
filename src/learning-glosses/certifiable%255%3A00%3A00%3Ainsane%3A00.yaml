simpleMeaning: Fit to be formally judged out of one's mind, and treated as such.
scope: Fit to be formally judged out of one's mind, and treated as such; also called certified; not able
  to be promised as true or formally stated to be so.
examples:
- The patient was certifiable under the old law.
- Their state was certifiable and called for care, not jail.
