simpleMeaning: The masts, sails, and ropes that hold up and work the three-cornered sails of a sailing
  boat.
scope: The masts, sails, and ropes that hold up and work the three-cornered sails of a sailing boat; not
  the boat's wooden body, and not the sails of a square-sailed ship.
examples:
- The lateen-rig of the old boat was in fine shape.
- Sailors checked the lateen-rig before setting out.
