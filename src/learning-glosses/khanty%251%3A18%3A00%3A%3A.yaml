simpleMeaning: A member of a wandering Ugrian people who live in the north-west of Siberia, to the east
  of the Urals.
scope: One of the wandering Ugrian people of north-west Siberia, east of the Urals; also called Ostyak;
  the people, not the tongue of the same name.
examples:
- Khanty families live in the north-west of Siberia.
- A Khanty elder spoke of life east of the Urals.
