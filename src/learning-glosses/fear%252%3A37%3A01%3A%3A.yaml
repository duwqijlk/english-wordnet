simpleMeaning: To hold someone or something in deep respect and awe, as holy or far above ordinary things.
scope: This is the sense of honouring someone or something as sacred, not the noun for the emotion felt
  when danger threatens, not the noun for a feeling of worry, not the noun for deep respect as a feeling,
  not the verb sense for being afraid of a possible event, not the verb sense for being frightened of
  something, not the verb sense used to announce bad news politely, and not the verb sense for feeling
  uneasy about something.
examples:
- The monks fear the mountain as a sacred place and never climb it without prayer.
- They fear the old king as a god, bowing whenever his name is spoken.
