simpleMeaning: a tree that stays green all year, grown by people in the Mediterranean since old times
  and now in other places; it has shiny black fruit people can eat
scope: This is the tree itself, not the small fruit people eat, not the wood of the tree, and not the
  yellow-green color.
examples:
- The olive grows well in hot, dry summers.
- They planted an olive in the yard, and after some years it gave shiny black fruit.
