simpleMeaning: It has its name because its poison swells the soft part inside the mouth and the throat,
  and it is an evergreen with large showy dark green leaves.
scope: It is also called mother-in-law's tongue and dumb cane, and it is a plant with big showy dark green
  leaves and a poison that swells the mouth and throat.
examples:
- The mother-in-law plant keeps its leaves through the winter.
- The mother-in-law plant got its name from the poison that swells the tongue.
