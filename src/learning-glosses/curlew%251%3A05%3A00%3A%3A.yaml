simpleMeaning: A big shore bird that moves from place to place, of the sandpiper kind, close kin to the
  woodcock but with a bill that bends down
scope: This is a large shore bird with a down-bent bill, close kin to the woodcock, not a gull and not
  a heron.
examples:
- A curlew called over the mud flats.
- The curlew probed the sand with its long bill.
