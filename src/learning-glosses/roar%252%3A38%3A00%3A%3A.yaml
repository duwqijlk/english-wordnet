simpleMeaning: to behave or move in a wild, unruly and uncontrolled way
scope: Wild, disorderly conduct by a crowd or gang, not the loud noise of wind or water and not a person
  shouting words loudly.
examples:
- Bands of drunken soldiers roared through the village, looting as they went.
- The mob roared into the square and tore down the fences.
