simpleMeaning: A rod of wood, steel or glass fibre, used to hold out the cord.
scope: A rod of wood, steel or glass fibre that holds out the cord; fishing rod is another name for this
  sense, not the cord itself, and not a short hand line.
examples:
- She held the fishing pole over the water.
- The fishing pole bent as the fish pulled.
