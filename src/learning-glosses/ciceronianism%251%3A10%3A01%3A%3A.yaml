simpleMeaning: Copying or looking like the speaking and writing style of Cicero, above all as the Ciceronians
  of the early Renaissance did it.
scope: A way of writing and speaking after Cicero, not a plain direct style of one's own.
examples:
- His Ciceronianism shows in every long balanced sentence.
- The essay's Ciceronianism pleased the old scholars.
