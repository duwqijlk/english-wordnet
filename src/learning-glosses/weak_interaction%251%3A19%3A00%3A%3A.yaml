simpleMeaning: In physics, a basic force between particles that makes some atoms break down and release
  energy; it involves tiny particles called neutrinos and is carried by heavy particles.
scope: In physics this is one of the fundamental forces of nature, not a weak or ineffective exchange
  between people; weak force is another name for the same thing.
examples:
- The weak interaction is responsible for certain kinds of radioactive decay.
- Physicists study the weak interaction through particles called neutrinos.
