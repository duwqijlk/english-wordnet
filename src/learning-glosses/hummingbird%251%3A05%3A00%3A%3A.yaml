simpleMeaning: A very small bird from the Americas, with bright feathers that shine and change colour
  and a long thin beak; its wings move very fast as it flies
scope: A very small bird from the Americas with shining feathers; not a songbird and not a bird of prey.
examples:
- A hummingbird hovered at the red flowers.
- We watched a hummingbird drink from the feeder.
