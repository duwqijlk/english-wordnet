simpleMeaning: a flat metal plate with lines cut in by acid, made to print a picture
scope: This is the metal plate itself, not the printed picture made from it and not the act of making
  plates and printing from them.
examples:
- The artist wiped ink over the etching before pressing paper onto it.
- The etching is a heavy metal plate, not a sheet of paper.
