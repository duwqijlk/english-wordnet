simpleMeaning: without belief in the God of Christianity, Judaism and Islam
scope: Also called ethnic and pagan. This is the adjective use, for a person or thing that does not believe
  in the God of Christianity, Judaism and Islam; not the noun use that names a person.
examples:
- Their heathen customs did not accept the God of Christianity.
- The old heathen rites gave honour to other gods, not to the God of Judaism, Christianity and Islam.
