simpleMeaning: Rays other than light, above all X-rays or gamma rays, make a picture on a surface that
  reacts to rays.
scope: Also called radiogram, radiograph, skiagram and skiagraph, it is a picture made by rays other than
  ordinary light.
examples:
- They took a shadowgraph with X-rays instead of ordinary light.
- They made a shadowgraph with gamma rays.
