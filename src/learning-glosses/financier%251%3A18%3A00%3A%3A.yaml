simpleMeaning: a person who is good at handling very large amounts of money and big money deals
scope: This is the person who handles big money deals; it is not the verb sense of the same word, which
  means to carry out money work.
examples:
- The financier paid for the new railway with money raised from several banks.
- As a young financier, she learned to handle deals worth many millions.
