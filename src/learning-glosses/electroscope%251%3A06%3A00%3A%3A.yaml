simpleMeaning: a tool that finds power in a thing, in which two thin gold leaves move apart because like
  charges push each other away
scope: A tool that finds power with two gold leaves that move apart, not a meter for flow of power and
  not a compass.
examples:
- The electroscope showed the rod was charged.
- Its gold leaves moved apart in the electroscope.
