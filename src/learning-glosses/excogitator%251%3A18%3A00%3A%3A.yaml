simpleMeaning: a person who thinks about a thing with great care and looks at it from every side
scope: A person who thinks a matter through with great care, not someone who decides in haste and not
  a person who merely dreams.
examples:
- The committee chose an excogitator to study the proposal in full before any vote.
- As an excogitator, she read every report twice before she gave her view.
