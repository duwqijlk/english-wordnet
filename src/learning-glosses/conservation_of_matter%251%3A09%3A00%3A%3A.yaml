senseId: 'conservation_of_matter%1:09:00::'
synsetId: 06114451-n
simpleMeaning: 'A basic rule from old-style physics: in a closed set-up, stuff is never made and never
  wiped out'
scope: A first rule that stuff is never made and never wiped out in a closed set-up, also called conservation
  of mass, the law of conservation of mass, and the law of conservation of matter, not a rule about heat
  and not a rule about new stuff appearing.
examples:
- Conservation of matter holds even when ice melts.
- She used conservation of matter to check her sums.
