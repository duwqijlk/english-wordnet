simpleMeaning: In architecture, a jutting ledge that sticks out from a cornice or sill to keep rainwater
  off the wall below, as over a window or doorway
scope: In architecture, a jutting ledge that throws rainwater clear of the wall below, also called drip
  and drip mould; not a flat sill and not a gutter that carries water away.
examples:
- The drip mold over the window kept rain off the wall.
- Stone drip molds ran along the top of the doorway.
