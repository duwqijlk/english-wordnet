simpleMeaning: A common poplar of the east and centre of the United States, grown there for its fast growth
  and mass of leaves, and in Europe for wood.
scope: A common poplar of the east and centre of the United States, also called the necklace poplar and
  Populus deltoides; not a pine and not a tree grown only for fruit.
examples:
- Eastern cottonwood grew fast along the river bank.
- The Eastern cottonwood was planted in Europe for its timber.
