simpleMeaning: a round straight part that forms a long thin part of a thing
scope: A round straight part that forms a long thin part of a thing, also called a stem; not the like
  part of a bolt, and not the like part of a drill bit.
examples:
- The shank of the tool bent under the strain.
- A long shank joined the handle to the head.
