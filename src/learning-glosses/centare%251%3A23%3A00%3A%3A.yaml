simpleMeaning: A unit for measuring area, the area of a square with sides exactly one metre long; a centiare
  is one hundredth of an are, which is 100 square metres.
scope: A unit of area equal to one square metre, not a unit of length and not a unit of weight.
examples:
- The garden measured fifty centares in all.
- A centare is the same as one square metre.
