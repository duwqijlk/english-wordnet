simpleMeaning: In optics, rays from one point of light do not come together at a single point of focus
  in a system with this flaw
scope: Also called astigmatism, this is a flaw in an optical system where light from one point fails to
  meet at one focus, not poor eyesight from a misshapen cornea.
examples:
- The astigmia in the old projector blurred the edges of every slide.
- Engineers checked the new lens for astigmia before they shipped it.
