simpleMeaning: A faithful Muslim woman who covers her face and hands in public or near any man outside
  her close family.
scope: A Muslim woman who covers her face and hands when she is out, not a woman who covers only her hair,
  and not a man.
examples:
- The niqaabi covered her face before she went out.
- As a niqaabi, she wears a veil in public.
