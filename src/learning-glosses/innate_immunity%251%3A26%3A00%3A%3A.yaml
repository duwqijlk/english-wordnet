simpleMeaning: Protection from sickness that a person is born with, as part of how their body is made.
scope: Protection from sickness a person is born with, not protection gained from a jab and not protection
  after having the sickness; natural immunity is another name for this sense.
examples:
- Innate immunity guards the baby from birth.
- Her innate immunity fought off the cold.
