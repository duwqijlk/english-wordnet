simpleMeaning: In the part you look through of a tool for looking, fine lines, dots, cross hairs, or wires
  form a set where the view comes clear.
scope: Also called a reticle or a reticule, this names the set of fine lines, dots, cross hairs, or wires
  in the part you look through of a tool for looking, where the view comes clear.
examples:
- The graticule showed in the eyepiece.
- The graticule in the microscope was easy to see.
