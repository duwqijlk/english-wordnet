simpleMeaning: a moving belt that carries things from one place to another, used in places such as a factory
scope: Also called transporter. This sense is a moving belt that carries things, used in places such as
  a factory, not a person who carries or sends things.
examples:
- Boxes moved along the conveyor to the packing area.
- Workers placed bottles on the conveyor as it carried them through the factory.
