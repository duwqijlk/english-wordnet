simpleMeaning: the sound a horse makes when its hoofs (the hard parts on its feet) hit a hard surface
scope: 'Also called clop, clopping and clumping: the sound of a horse''s feet on a hard surface, not a
  horse walking on soft ground and not a heavy metal sound.'
examples:
- The clunking of hoofs woke us early in the morning.
- I could hear the clunking as the horse crossed the yard.
