simpleMeaning: A shaking of the ground, set off by rock moving deep below or by a volcano.
scope: 'Also called an earthquake: a shaking of the ground, set off by rock moving deep below or by a
  volcano, not a person shaking with fear or cold.'
examples:
- The quake shook buildings across the city.
- A strong quake struck the coast at dawn.
