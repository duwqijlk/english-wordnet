simpleMeaning: a small carriage pulled by a horse, with two wheels, two seats and a hood that folds down
scope: A small carriage pulled by a horse, with two wheels, two seats and a hood that folds down, also
  called cab, and not a four-wheeled coach or a carriage with a fixed roof.
examples:
- The cabriolet waited at the station for passengers.
- She rode to the house in a cabriolet.
