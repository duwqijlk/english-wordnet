simpleMeaning: a tool like an octant, a smaller tool of the same kind, that measures the angle between
  things in the sky
scope: A tool that measures the angle between things in the sky and looks like an octant, a smaller tool
  of the same kind.
examples:
- The sailor used a sextant to measure angles in the sky.
- With his sextant, he measured the angle between two bright points in the sky.
