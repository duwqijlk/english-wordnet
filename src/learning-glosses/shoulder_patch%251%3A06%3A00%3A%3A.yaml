simpleMeaning: a badge worn high on the sleeve of a soldier's uniform to show rank
scope: A badge that shows rank on a soldier's uniform, not a medal pinned on the chest and not a stripe
  sewn on a sleeve.
examples:
- The new shoulder patch on his coat showed his rank.
- Her shoulder patch told the others she was a sergeant.
