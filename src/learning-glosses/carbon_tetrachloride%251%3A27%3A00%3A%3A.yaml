simpleMeaning: A colourless liquid that will not burn, used to dissolve fats and oils, whose use as a
  cleaning fluid or fire extinguisher has fallen away because it poisons.
scope: A colourless liquid that will not burn, used to dissolve fats and oils, also called carbon tet,
  perchloromethane, and tetrachloromethane.
examples:
- Carbon tetrachloride dissolves fats.
- Workers once used carbon tetrachloride as a cleaning fluid.
