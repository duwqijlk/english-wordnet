senseId: 'stress%1:26:01::'
synsetId: 14399593-n
simpleMeaning: in psychology, a condition in which the mind or emotions are under strain or held in suspense
scope: This is the mental or emotional condition, not the emphasis on a syllable or musical note, not
  special importance given to something, not a difficult situation that causes worry, and not the physical
  force that strains a body.
examples:
- She has been under a lot of stress since the exam.
- Too much stress can affect your sleep and health.
