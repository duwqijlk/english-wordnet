simpleMeaning: very harsh in tone; said or written in a strong and unkind way
scope: 'Also called bitter, acid, acrid, blistering, sulfurous, caustic, acerbic, sulphurous, and vitriolic:
  this is about harsh words or tone, not about a poison or a disease that harms the body.'
examples:
- He wrote a virulent attack on the mayor in the paper.
- Her virulent words about her rival shocked the room.
