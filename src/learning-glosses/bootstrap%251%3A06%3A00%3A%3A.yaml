simpleMeaning: a strap in the shape of a loop, sewn to the top of a boot, used for pulling the boot on
scope: This is a real strap on a boot, used for pulling the boot on, not the boot itself.
examples:
- He tugged the bootstrap to pull his foot into the boot.
- The bootstrap at the back of her boot tore when she pulled it.
