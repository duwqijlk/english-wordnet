simpleMeaning: to put or press a person or thing tightly in between two other people or things
scope: To put or press a person or thing tightly in the middle, not the food made with bread and not the
  act of making that food.
examples:
- She was sandwiched between two tall men on the bus.
- He sandwiched himself between his two friends for the photo.
