synsetId: 03528297-n
simpleMeaning: So a horse will stay put, it is tied to a rail that runs sideways and is fixed in place
scope: Also called a hitchrack, this is a fixed rail for tying up a horse, not a fence for a field and
  not a post for one animal.
examples:
- He tied his horse to the hitching bar outside the store.
- The hitching bar by the inn was full of horses on market day.
