simpleMeaning: Used to add or change colour in cloth, hair, and other materials, this is a substance that
  usually dissolves in liquid.
scope: Also called dye, it usually dissolves and is used to colour cloth, hair, and other such things.
examples:
- She bought dyestuff to colour the cloth.
- The dyestuff dissolved in the liquid and stained the hair.
