simpleMeaning: A curved top with a gap at its highest point, a gap usually filled with some ornament.
scope: A curved top with a gap at its highest point, usually filled with ornament; not a whole unbroken
  arch and not a keystone.
examples:
- A broken arch crowns the doorway, with a carved flower in the gap.
- The broken arch above the gate has a small statue in its gap.
