simpleMeaning: A fine broad-topped plant that sheds its leaves, with dark green leaves made of many small
  parts and many clusters of sweet-smelling creamy-white flowers; it grows in China and Japan
scope: Also called Chinese scholar tree, Chinese scholartree, Sophora japonica, or Sophora sinensis; a
  broad-topped leaf-shedding plant of China and Japan with clusters of creamy-white flowers.
examples:
- The Japanese pagoda tree stood by the gate, its creamy-white flowers sweet in the air.
- We planted a Japanese pagoda tree in the yard for shade.
