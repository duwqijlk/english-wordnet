simpleMeaning: The ring of a church bell in Roman Catholic churches that tells people it is time to say
  a set prayer.
scope: 'Also called angelus bell: the sound of a church bell that tells people it is time to say a set
  prayer, not the prayer itself.'
examples:
- The angelus rang out from the church tower.
- She stopped to listen when the angelus sounded.
