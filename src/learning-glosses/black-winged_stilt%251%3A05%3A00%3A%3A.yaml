simpleMeaning: Dark wings set off mostly white feathers on this long-legged bird of Europe, Africa and
  Asia.
scope: This long-legged bird of Europe, Africa and Asia has mostly white feathers and dark wings, not
  the black-necked stilt of the Americas.
examples:
- The black-winged stilt flew off on dark wings.
- A black-winged stilt was seen in Europe.
