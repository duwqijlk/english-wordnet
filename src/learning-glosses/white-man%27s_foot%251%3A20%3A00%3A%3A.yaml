simpleMeaning: A common plant of Europe that lives for years and now grows all over the world, a weed
  that is hard to get rid of.
scope: A common plant of Europe now found all over the world; broad-leaved plantain, cart-track plant,
  common plantain and whiteman's foot are other names for this sense, not a garden flower and not a grass.
examples:
- White-man's foot grows along the path and is hard to get rid of.
- The white-man's foot is a common weed in gardens all over the world.
