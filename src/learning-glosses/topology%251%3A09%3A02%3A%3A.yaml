simpleMeaning: the study of a place and its land, especially how its past can be seen in the shape of
  its land
scope: This is the study of a place from the shape of its land. It is not the part of maths about shapes,
  and not the study of parts of the body in one area.
examples:
- She studies the topology of the valley to learn how people lived there long ago.
- His book on the topology of Greenland looks at how ice shaped the land over time.
