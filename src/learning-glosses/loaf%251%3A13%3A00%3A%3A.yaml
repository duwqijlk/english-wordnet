simpleMeaning: a piece of baked bread in one joined shape, usually cut into slices before it is eaten
scope: This is one whole baked bread in a single shape, usually cut into slices; it is not a single slice
  and not the act of doing nothing.
examples:
- She bought a loaf at the bakery for breakfast.
- He cut two thick slices from the loaf.
