simpleMeaning: Mostly photosynthetic single-celled organisms without a nucleus, carrying a blue pigment
  besides chlorophyll; they live alone or in colonies in many habitats and are important as plankton.
scope: These are the blue-pigmented, nucleus-free organisms also called cyanobacteria; they are not green
  algae, which have a nucleus and no blue pigment.
examples:
- Blue-green algae formed a slick on the surface of the pond.
- Some kinds of blue-green algae release toxins that make water unsafe to drink.
