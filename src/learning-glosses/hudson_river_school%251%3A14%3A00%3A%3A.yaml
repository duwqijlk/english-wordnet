simpleMeaning: The first joined group of American painters, at work from 1825 to 1870, who painted wild
  land views of a north-eastern valley and the land around it in New England
scope: This is the first joined group of American painters, active 1825 to 1870 and known for wild land
  views; also called romantic realism.
examples:
- The Hudson River school painted the wild valleys of the north-east.
- A Hudson River school canvas shows a wide valley under a big sky.
