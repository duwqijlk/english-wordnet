simpleMeaning: the state of being comfortable, or feeling at rest, especially after great worry or suffering
  has ended
scope: 'Also called relief: this is the state of being comfortable, or of feeling at rest after worry
  or suffering. Not the verb sense of making pain or discomfort less, and not the verb sense of making
  something calmer or less strong.'
examples:
- After the pain stopped, he felt a great sense of ease.
- Getting the bad news off her mind gave her some ease at last.
