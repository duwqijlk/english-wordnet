simpleMeaning: Its young feed on a plant with white sap, and the big American insect flies far on deep
  orange wings marked in black and white.
scope: This is a big orange-winged insect of America; monarch and monarch butterfly are other names for
  this sense.
examples:
- A milkweed butterfly flew far, its deep orange wings marked in black and white.
- The milkweed butterfly lays its eggs where its young can feed on the milky plant.
