simpleMeaning: a place where people buy and sell goods for later delivery, at prices set now
scope: 'Also called a futures exchange and a futures market: a place where deals for later delivery are
  made, not a shop selling goods now and not a stock exchange.'
examples:
- Wheat prices on the forward market rose after the dry summer.
- Traders watch the forward market to fix prices for next year's crop.
