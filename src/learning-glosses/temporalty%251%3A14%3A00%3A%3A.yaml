simpleMeaning: In Christianity, the members of a religious group who are not ordained priests and do not
  have a priest's duties
scope: 'Also called the laity: the ordinary members of a Christian community, not the ordained priests
  and not the clergy of another faith.'
examples:
- The temporalty sang hymns while the priest led the service.
- In the parish, the temporalty helped to run the church hall.
