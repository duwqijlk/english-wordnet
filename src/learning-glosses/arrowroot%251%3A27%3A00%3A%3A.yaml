simpleMeaning: A feeding starch got from the root of its namesake plant.
scope: A feeding starch got from the root of its namesake plant; not a white-flowered West Indian plant
  whose root yields the starch it is named for, nor a canna grown, especially, for its eatable rootstock,
  from which the starch it is named for is got.
examples:
- Their arrowroot thickened the sauce.
- The arrowroot was used at noon.
