simpleMeaning: to join things by sewing with a needle and thread, or to do sewing work with a needle and
  thread
scope: Also called sew, this is joining or making things with a needle and thread, not a loop made in
  sewing and not pain in the side from running.
examples:
- She stitched the torn sleeve back onto the shirt.
- He learned to stitch a button onto his coat.
