senseId: 'entasis%1:25:00::'
synsetId: 13887163-n
simpleMeaning: A very slight outward swell in the shaft of a pillar, which makes the pillar look straight
  to people who see it, although truly straight sides would look hollow.
scope: This is the slight swell of a pillar, not the grooves cut into it and not a curve built into the
  base.
examples:
- The entasis of the temple columns is so slight you can barely see it.
- Builders gave the shaft an entasis so it would not look hollow.
