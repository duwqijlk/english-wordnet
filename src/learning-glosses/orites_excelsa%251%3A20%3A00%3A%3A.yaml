simpleMeaning: An Australian tree with single leaves set one by one (when young, feathery with sharp-toothed
  edges) and thin side spikes of white flowers.
scope: Also called prickly ash, it names the Australian tree with single leaves set one by one, feathery
  with sharp-toothed edges when young, and thin side spikes of white flowers.
examples:
- Orites excelsa grew in the Australian forest with its white flower spikes.
- The young leaves of Orites excelsa were feathery with sharp teeth.
