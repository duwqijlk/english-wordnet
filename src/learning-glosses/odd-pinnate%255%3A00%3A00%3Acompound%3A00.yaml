simpleMeaning: Said of a leaf shape, with small leaves set along a stem and one small leaf at the tip
scope: Said of a leaf shape with small leaves along a stem and one at the tip, also called imparipinnate;
  not the leaf itself and not a leaf with no small leaf at the tip.
examples:
- This odd-pinnate leaf shows the shape well, with one leaflet at the tip.
- An odd-pinnate leaf ends in a single leaflet.
