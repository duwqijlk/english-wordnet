simpleMeaning: Thick bunches of green or red flowers mark one of many kinds of plant, often grown to eat.
scope: Among plants grown for food, this one is known by its thick bunches of green or red flowers.
examples:
- In the garden, amaranth grew with red flowers in thick bunches.
- The farmer grew amaranth for food and let its green flowers stand in thick bunches.
