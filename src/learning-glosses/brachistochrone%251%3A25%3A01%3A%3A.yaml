simpleMeaning: a bent line between two points along which a thing can move under its own weight in less
  time than on any other line
scope: A bent line between two points along which a thing can move fastest under its own weight, not a
  straight line between the two points and not a line that takes longer to move along.
examples:
- The brachistochrone between the two points was a cycloid.
- A bead slides down the brachistochrone faster than down a straight wire.
