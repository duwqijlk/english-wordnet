simpleMeaning: A stem that holds a group of flowers, or one flower on its own.
scope: The stem that holds flowers, not the main stem of the plant and not the stalk that holds a single
  leaf.
examples:
- The peduncle of the tulip held the flower high above the leaves.
- A long peduncle lifts the cluster of tiny blooms.
