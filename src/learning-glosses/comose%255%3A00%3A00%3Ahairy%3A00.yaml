simpleMeaning: having a small bunch of fine hairs, as some seeds such as cotton seeds do
scope: This is about seeds with a small bunch of fine hairs; comal and comate are other names for this
  sense, not the crowned sense of bearing leaves or branches on top.
examples:
- The comose seeds had soft tufts of hair that helped them drift on the wind.
- Cotton has comose seeds with a soft tuft of hair.
