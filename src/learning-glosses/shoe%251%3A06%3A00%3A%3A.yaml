simpleMeaning: An item worn below the ankle that is shaped to fit the foot, with a bendable leather or
  plastic top and a heavier sole and heel.
scope: This is ordinary footwear, not the metal plate nailed to a horse's hoof or the part a brake presses
  against.
examples:
- These shoes are too tight across the toes.
- He polished his shoes before the interview.
