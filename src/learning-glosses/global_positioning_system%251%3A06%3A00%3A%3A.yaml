simpleMeaning: Satellites and computers that find where a receiver on Earth is by working out its latitude
  and longitude from the times signals from different satellites take to reach it.
scope: Also called GPS; a satellite way of finding where you are, not a paper map.
examples:
- The Global Positioning System guided us home.
- Our car uses the Global Positioning System.
