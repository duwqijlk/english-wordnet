simpleMeaning: The antiparticle of a muon, which breaks down into a positron, a neutrino and an antineutrino
scope: Also called positive muon, this bit is the matching opposite of a tiny bit of matter, breaking
  down into a plus-charged bit, a neutrino, and an antineutrino.
examples:
- The antimuon broke down into a plus-charged bit, a neutrino, and an antineutrino.
- When an antimuon breaks down, a plus-charged bit, a neutrino, and an antineutrino come out.
