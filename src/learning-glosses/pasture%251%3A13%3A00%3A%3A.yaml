simpleMeaning: Large amounts of grass or hay eaten by horses or cattle that feed on plants
scope: 'Also called grass and forage: food for horses or cattle that feed on plants, not the grassy field
  itself and not the act of feeding animals there.'
examples:
- The farmer stacked pasture in the barn for the horses.
- The cattle ate pasture all afternoon in the lower field.
