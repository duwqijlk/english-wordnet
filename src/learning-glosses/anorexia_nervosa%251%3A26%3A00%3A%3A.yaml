simpleMeaning: A very thin person who wrongly believes they are too fat is said, in psychiatry, to have
  this trouble of the mind
scope: This is a trouble of the mind in which a very thin person holds a false belief about being too
  fat, not a true state of being fat.
examples:
- She was very thin, yet her anorexia nervosa made her feel too fat.
- His anorexia nervosa kept him sure he was too fat, though he was very thin.
