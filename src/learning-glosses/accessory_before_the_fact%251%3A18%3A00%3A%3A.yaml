senseId: 'accessory_before_the_fact%1:18:00::'
synsetId: 09779621-n
simpleMeaning: A person who arranges, suggests, or orders a grave crime but is not present while it is
  done.
scope: This is a person who arranges, suggests, or orders a grave crime but is not present while it is
  done, not a person who helps a criminal after the crime and not a person who commits the crime.
examples:
- He was tried as an accessory before the fact for planning the robbery.
- An accessory before the fact need not be present at the crime.
