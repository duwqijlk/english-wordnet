simpleMeaning: The act of taking dirt and dust off a thing or a place to make it clean
scope: Also called cleaning, and another name for it is cleanup; this is making a thing or a place free
  of dirt, not washing the body as a religious act.
examples:
- The cleansing of the kitchen took all morning.
- She gave the dirty floor a good cleansing.
