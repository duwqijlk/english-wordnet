simpleMeaning: a person who ruled a district or province in the Ottoman Empire
scope: The ruler of a district or province in the old Ottoman Empire, not the sultan who ruled the whole
  empire and not a ruler in a modern country.
examples:
- The bey of the province collected the taxes from the towns.
- The bey received the travellers in his palace.
