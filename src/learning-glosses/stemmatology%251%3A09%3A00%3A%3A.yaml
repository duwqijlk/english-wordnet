simpleMeaning: By setting surviving copies of a hand-written text side by side, this study in the humanities
  works out how it passed down, at times sorting them into family trees.
scope: Also called stemmatics; it works out how a hand-written text passed down from the copies that still
  exist.
examples:
- In stemmatology, the surviving copies are set side by side to trace the text.
- She used stemmatology to sort the old copies into a family tree.
