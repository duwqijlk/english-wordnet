simpleMeaning: In psychophysics, the idea that how strong a feeling seems grows in step with the logarithm
  of how strong the signal is, from early work by E. H. Weber.
scope: Also called Fechner's law; an idea in psychophysics about how strong a feeling seems as the signal
  grows, while Stevens' power law gives a different rule for the same question.
examples:
- The Weber-Fechner law says a feeling grows slowly as the signal grows fast.
- Under the Weber-Fechner law, doubling a light does not double how bright it seems.
