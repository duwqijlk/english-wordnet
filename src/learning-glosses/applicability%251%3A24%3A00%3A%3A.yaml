simpleMeaning: the fact that something fits the case in front of you, so it is linked to that case and
  matters for it
scope: This is about something fitting the case in front of you, so it is linked to that case and matters
  for it; not about whether the thing is true, and not about whether it is easy to use.
examples:
- The teacher questioned the applicability of the old rule to new cases.
- We must check the applicability of this law to small shops.
