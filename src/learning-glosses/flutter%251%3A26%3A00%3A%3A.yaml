simpleMeaning: a beating of the upper rooms of the heart that is too fast, especially in a steady beat,
  and that can lead to a block in the heart
scope: A too-fast beating of the upper rooms of the heart, not wings moving fast and not a thing moving
  fast and lightly.
examples:
- The doctor found a flutter in her heart.
- A flutter showed on the heart trace.
