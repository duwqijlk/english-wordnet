simpleMeaning: Scarring from rheumatic fever can leave the flap between the two left rooms of the heart
  blocked or narrowed.
scope: Also called mitral valve stenosis, this block or narrowing of the flap between the two left rooms
  of the heart can follow scarring from rheumatic fever.
examples:
- He was told he had mitral stenosis.
- The scan showed mitral stenosis.
