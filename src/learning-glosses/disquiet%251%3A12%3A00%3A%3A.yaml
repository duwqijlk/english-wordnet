simpleMeaning: A light, uneasy worry about what might happen next.
scope: Not the trait of seeming ill at ease, and not the act of making someone uneasy.
examples:
- A disquiet grew in her as the storm drew closer.
- He felt a disquiet about the road ahead, though nothing had gone wrong yet.
