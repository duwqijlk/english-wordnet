simpleMeaning: a small metal weapon, used in the plural, that covers the finger joints on the back of
  the hand
scope: 'Also called brass knuckles, knuckle duster, knuckles and knucks: a small metal weapon that covers
  the finger joints on the back of the hand, not a ring and not a glove.'
examples:
- He slipped the brass knucks over his fingers.
- The brass knucks were made of steel.
