simpleMeaning: The putting of seed into the birth tract of a female.
scope: The putting of seed into the birth tract of a female; not the act of sowing, of seeds in the ground
  or, by figure, of germs in the body or thoughts in the mind, or the like.
examples:
- Their insemination came at dawn.
- The insemination was done at noon.
