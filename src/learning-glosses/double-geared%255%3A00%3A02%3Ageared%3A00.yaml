simpleMeaning: Of a lathe, fitted with wheels that slow the turning rod down from the speed of the drive
  wheel
scope: Of a lathe, fitted with wheels that slow the turning rod down from the speed of the drive wheel;
  back-geared is another name for it, not a lathe with compound wheels for more force.
examples:
- The double-geared lathe turned slowly at a low speed.
- He set the double-geared lathe to a low speed.
