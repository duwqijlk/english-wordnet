simpleMeaning: any of several sticky plants of the group Madia, found in the west of North and South America
scope: A sticky plant of the group Madia from the west of the Americas, not the other tarweed plants of
  the genus Grindelia and not any plant that gives tar.
examples:
- Tarweed grew along the dry hillsides in California.
- The tarweed plants were covered in sticky sap.
