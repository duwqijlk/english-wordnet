simpleMeaning: Most times made of bone, this old wind instrument is no longer played, and one thin piece
  in it shakes to make its sound
scope: 'Also called a hornpipe: an old wind instrument that is no longer played, not a modern flute and
  not a horn blown with the lips.'
examples:
- The old pibgorn hung on the wall of the small museum.
- The pibgorn in the museum case was made of bone.
