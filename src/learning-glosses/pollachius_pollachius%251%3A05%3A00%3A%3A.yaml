simpleMeaning: This much-used fish is one people eat and catch for sport in the northern seas, most of
  all in the north of the Atlantic, and a kin of the cod.
scope: Also called pollack and pollock; a much-used fish of the northern seas, not a fish of warm southern
  seas and not the cod itself.
examples:
- The fishermen caught a Pollachius pollachius in the cold northern sea.
- Pollachius pollachius is good to eat, and anglers catch it for sport.
