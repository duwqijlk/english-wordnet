simpleMeaning: a real thing you can touch that shows people approve of someone or think they are special
scope: 'Also called honor, award, honour and accolade: a real object that shows people approve of someone,
  not the feeling of respect itself.'
examples:
- She won laurels for bravery and kept the medal in a box.
- The laurels he received for his work were placed on the shelf for all to see.
