simpleMeaning: Salted or smoked as food, this shad-like fish runs up rivers to lay its eggs and is sometimes
  put in the group Pomolobus
scope: This is the whole shad-like food fish that runs up rivers to lay its eggs, not just its flesh sold
  as food.
examples:
- We watched the alewives run up the river to lay their eggs.
- The alewife is often salted or smoked before it is sold.
