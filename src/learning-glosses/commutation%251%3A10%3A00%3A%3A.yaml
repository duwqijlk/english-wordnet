simpleMeaning: a written order that swaps a lighter punishment for a heavier one
scope: This is a written order that swaps a lighter punishment for a heavier one; not the act of making
  a punishment less harsh, and not a pardon.
examples:
- The judge signed a commutation that changed the death sentence to life in prison.
- A commutation arrived that replaced his long sentence with a shorter one.
