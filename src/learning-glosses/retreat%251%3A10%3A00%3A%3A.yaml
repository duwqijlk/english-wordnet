simpleMeaning: In war, a horn call that tells soldiers the flag is to be put down at the end of the day
scope: In war, a horn call at the end of the day for putting the flag down, not a move back by soldiers
  and not a quiet place.
examples:
- The retreat sounded at sunset over the camp.
- Soldiers stood still as the retreat was played.
