simpleMeaning: Describing food or drink that tastes like vinegar or lemons, one of the four main tastes
scope: This is the word for food or drink that has the taste of vinegar or lemons, not the taste felt
  in the mouth itself and not a bad smell from food gone stale.
examples:
- The sour apples made her mouth water.
- She likes sour sweets that taste of lemon.
