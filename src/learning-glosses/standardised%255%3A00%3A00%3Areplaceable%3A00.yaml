simpleMeaning: able to take the place of another thing, or swap places with it, with no loss of how well
  it works or how fit it is
scope: Able to take the place of another thing, or swap places with it, with no loss of how well it works
  or how fit it is; similar, standardized, interchangeable and exchangeable are other names for this sense,
  not a thing made to one fixed size and not a thing that fits only one place.
examples:
- Standardised plugs fit any socket in the house.
- The standardised parts swap without trouble.
