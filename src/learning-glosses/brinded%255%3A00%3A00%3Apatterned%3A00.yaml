simpleMeaning: The marked fur of cats, above all, shows a gray or brown streak, a pattern, or blotches
  of colour.
scope: 'Also called brindle, brindled, and tabby: a gray or brown streak, a pattern, or blotches of colour,
  above all in the marked fur of cats, not a plain coat of one colour.'
examples:
- The brinded cat had a gray streak in its fur.
- Her brinded cat showed blotches of colour.
