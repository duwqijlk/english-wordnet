simpleMeaning: to praise a person or thing by writing a poem of 14 lines for them
scope: This is writing a poem of 14 lines to praise someone. It is not just writing such a poem with no
  praise in it, and it is not the poem itself.
examples:
- The poet sonneted the queen, praising her kindness in fourteen lines.
- She sonneted her hero, telling of his brave deeds in a short poem.
