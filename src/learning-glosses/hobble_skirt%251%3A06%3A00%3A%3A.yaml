simpleMeaning: Between 1910 and 1914, a long garment very tight below the knees was worn
scope: A long, tight garment of 1910 to 1914, not a loose dress and not a skirt of any other time.
examples:
- She wore a hobble skirt to the party in 1912.
- The hobble skirt was so narrow below the knees that she took small steps.
