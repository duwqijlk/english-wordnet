simpleMeaning: the full amount that a pot for boiling water can hold
scope: The amount that one such pot holds, not the pot itself, not a big drum, and not a hollow in the
  ground left by ice that melted.
examples:
- She poured a kettle of water into the big pot.
- He used two kettles of water to fill the bath.
