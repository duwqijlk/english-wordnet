simpleMeaning: A parasite that causes a disease of cereal crops and grasses, attacking leaves and stems,
  forming chains of spore cases inside the plant that later burst and release black powder.
scope: This is the parasite that blackens cereal leaves and stems, not the smuts that attack the grain
  head.
examples:
- Flag smut fungus can wipe out a field of wheat.
- The leaves were covered with the black spores of flag smut fungus.
