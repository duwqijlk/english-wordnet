simpleMeaning: Inside its pouch, the male sex gland hangs from this rope-like band, which carries the
  tube that bears seed, with tubes and nerves beside it.
scope: It is a band that holds up the male sex gland inside its pouch.
examples:
- The spermatic cord holds up the testis inside the scrotum.
- The spermatic cord carries the tube that bears seed.
