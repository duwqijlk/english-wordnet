senseId: 'staccato%3:00:00::'
synsetId: 02301588-a
simpleMeaning: In music, made of separate parts or sounds, each one cut short in a sharp, clear way
scope: 'Also called disconnected: this is music made of separate sounds, each one cut short in a sharp,
  clear way, not smooth music where the notes run into each other.'
examples:
- The piano played short, staccato notes that stood out one by one.
- She gave a staccato command, each word short and sharp.
