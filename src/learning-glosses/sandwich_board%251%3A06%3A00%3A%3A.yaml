simpleMeaning: A person who walks about wears this pair of flat signs hung from the shoulders, one in
  front and one behind, to show ads.
scope: A pair of signs worn front and back by a walker to show ads.
examples:
- The sandwich board hung from his shoulders, with an ad on the front and one on the back.
- She wore a sandwich board to show ads as she walked.
