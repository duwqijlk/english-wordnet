simpleMeaning: Illness from too little niacin (B vitamin) or tryptophan, or trouble making niacin; stomach
  upset, red skin, nerve or mental problems; may come from poor diet, alcohol or poor nutrition.
scope: This is the Italian name for pellagra, the same illness as maidism and mal de la rosa, not a separate
  disease and not a red rash by itself.
examples:
- In northern Italy pellagra was known as mal rosso.
- Mal rosso appeared in villages where families ate little but corn.
