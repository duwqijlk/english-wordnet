senseId: 'hydrostatic_head%1:19:00::'
synsetId: 11516696-n
simpleMeaning: The push at one point in a liquid, measured by the height of a column of the same liquid
  that would give the same push
scope: This is the push at one point in a liquid, measured by the height of a column of the same liquid,
  not the push of air and not the depth of the liquid on its own.
examples:
- The hydrostatic head was measured at the base of the tank.
- Engineers used the hydrostatic head to find the pressure.
