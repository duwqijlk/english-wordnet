simpleMeaning: a bright curved line made when light bounces off a curved surface
scope: A bright curve made by light bouncing off a curved surface, not a straight ray of light and not
  a shadow.
examples:
- The catacaustic shone as a bright curve on the wall where light bounced off the bowl.
- She traced the catacaustic formed by light reflecting from the curved mirror.
