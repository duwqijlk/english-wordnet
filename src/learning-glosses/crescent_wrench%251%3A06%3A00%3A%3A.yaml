simpleMeaning: One side of this tool slides to meet nuts of many sizes, moved by a screw set in the tool's
  head
scope: This tool is one that slides to fit six-sided nuts of many sizes.
examples:
- He used a crescent wrench to tighten the nut on the pipe.
- She turned the small screw on her crescent wrench to make it fit the bolt.
