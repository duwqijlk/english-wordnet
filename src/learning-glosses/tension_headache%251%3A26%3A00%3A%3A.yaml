simpleMeaning: a pain at the back of the head, most often brought on by tight muscles from too much work
  or worry
scope: A pain at the back of the head that most often comes from tight muscles and worry, not a pain from
  a blow to the head and not a sick feeling that comes with a cold.
examples:
- After a long week at her desk, she had a tension headache.
- His tension headache eased once he rested and the tight feeling in his neck went away.
