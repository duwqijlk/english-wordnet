simpleMeaning: People cook and eat the thick underground stems of this warm-climate American plant of
  the aroid kind, much like yams or potatoes.
scope: A warm-climate plant whose thick underground stems are cooked and eaten like yams; malanga, tannia
  and yautia are other names for it, not the yam itself.
examples:
- They cooked the thick underground stems of the spoonflower like yams.
- The spoonflower grows in warm parts of America.
