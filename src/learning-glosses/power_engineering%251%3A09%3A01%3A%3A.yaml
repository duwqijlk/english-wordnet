simpleMeaning: the branch of work on making, moving, sharing, and using electric power, and the machines
  that make and use it, such as generators, motors, and transformers
scope: The study of electric power systems, not the study of heat alone and not the repair of single machines.
examples:
- She chose power engineering because she wanted to work on the grid that carries power to homes.
- The power engineering course covers how generators and transformers work.
