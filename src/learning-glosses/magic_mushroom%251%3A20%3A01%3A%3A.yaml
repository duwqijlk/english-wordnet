senseId: 'magic_mushroom%1:20:01::'
synsetId: 88952530-n
simpleMeaning: People take this fungus for the drug in it, psilocybin, which makes them see and hear things
  that are not there
scope: Also called shroom, psilocybin mushroom and psychedlic mushroom, this is a fungus taken as a drug
  that changes what a person sees and hears, not a plain food mushroom and not a medicine.
examples:
- He ate a magic mushroom and saw bright shapes that were not there.
- Magic mushrooms are against the law in many places because of the drug in them.
