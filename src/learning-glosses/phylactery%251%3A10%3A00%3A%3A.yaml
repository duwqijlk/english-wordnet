simpleMeaning: In Judaism, men traditionally wear two little leather boxes, each holding verses from Hebrew
  scripture, strapped to the forehead and left arm for morning prayer.
scope: Another name for tefillin, the same pair of leather prayer boxes, not a different ritual object
  or a good-luck charm.
examples:
- He wound the strap of his phylactery around his forearm before the morning service.
- The phylacteries were kept in a velvet pouch between prayers.
