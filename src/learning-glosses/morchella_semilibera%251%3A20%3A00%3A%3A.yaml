senseId: 'morchella_semilibera%1:20:00::'
synsetId: 13054822-n
simpleMeaning: A morel whose top part with ridges and pits is joined to the stalk for about half its length
scope: Also called a cow's head and a half-free morel; a morel with its top joined to the stalk for about
  half its length, not a morel with its top free along its whole length and not a morel with its top joined
  all the way down.
examples:
- Morchella semilibera has its top joined to the stalk for about half its length.
- The Morchella semilibera top is ridged and pitted.
