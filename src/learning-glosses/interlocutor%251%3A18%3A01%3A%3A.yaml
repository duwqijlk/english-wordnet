simpleMeaning: a performer in the middle of a line in a minstrel show (an old singing and talking show),
  who talks with the others in the line
scope: This is the person in the middle in an old singing show, not just any person taking part in a talk.
examples:
- The interlocutor in the middle asked each singer a funny question.
- As interlocutor, he kept the talk going between the songs.
