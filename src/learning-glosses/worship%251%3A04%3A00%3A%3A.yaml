simpleMeaning: the act of showing love and respect for a god
scope: This noun names the act itself, the showing of love and respect to a god; not the verb sense of
  loving a person too much, as if that person were a god.
examples:
- Sunday worship begins at ten in the morning.
- The whole village came together for worship at the small church.
