simpleMeaning: a gland that sends out its fluid to the outside of the body through a small tube
scope: 'Also called a duct gland and an exocrine gland: a gland that sends fluid out through a tube, not
  a gland that sends its fluid straight into the blood and not the adjective sense of things to do with
  such glands.'
examples:
- The tear gland is an exocrine that sends its fluid out through a duct.
- The sweat glands are exocrine glands that cool the skin.
