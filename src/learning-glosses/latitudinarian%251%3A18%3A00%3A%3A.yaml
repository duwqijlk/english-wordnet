simpleMeaning: This person keeps an open mind and lets others hold faith and ways of life that are not
  their own, most of all in faith and right living.
scope: This person keeps an open mind and lets others hold faith and ways of life that are not their own,
  most of all in faith and right living; not a person who holds one strict set of beliefs, and not a person
  who cares nothing for faith.
examples:
- The latitudinarian welcomed people of every faith.
- As a latitudinarian, she never forced her views on others.
