simpleMeaning: A clear hard stuff, the same all through, that bends light by a known amount and is used
  to make lenses
scope: A clear hard stuff of known bend used to make lenses, not the low-bend kind and not the high-bend
  kind and not plain glass for windows.
examples:
- Optical glass is used to make the lenses in this camera.
- The lens maker cut a piece of optical glass.
