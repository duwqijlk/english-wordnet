simpleMeaning: one of the two marks < and >, used in computer code and at times to mark off words
scope: One of the marks < and > in computer code, not the square marks [ and ] used to mark off words.
examples:
- The code uses the bracket < to open the tag.
- She closed the bracket with > at the end of the line.
