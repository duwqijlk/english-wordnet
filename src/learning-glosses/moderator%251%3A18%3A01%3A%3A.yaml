simpleMeaning: a person who leads a debate or a forum (a meeting where people talk about a subject)
scope: A person who leads a debate or forum. It is not a person who helps people settle a dispute, and
  not a substance used in a nuclear reactor.
examples:
- The moderator asked each speaker a question in turn.
- As moderator of the debate, she kept the talk fair and on time.
