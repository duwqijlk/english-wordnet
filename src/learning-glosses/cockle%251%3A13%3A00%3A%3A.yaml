simpleMeaning: a common sea animal from Europe that people can eat, with a shell in two parts (a bivalve)
scope: This is the sea animal people eat. Not the verb sense of pulling something into small folds, and
  not the other noun sense that adds that this animal digs and has a strong, round shell.
examples:
- We ate cockles at the small shop by the sea.
- Cockles are common in food markets in parts of Europe.
