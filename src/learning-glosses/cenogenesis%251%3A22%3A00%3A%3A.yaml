simpleMeaning: As an embryo grows, traits or body parts can appear that its kind never had before, with
  the placenta in mammals as one case.
scope: This is also called caenogenesis, cainogenesis, kainogenesis, or kenogenesis.
examples:
- Cenogenesis explains how the placenta first appeared in mammals.
- The placenta is one case of cenogenesis in mammalian evolution.
