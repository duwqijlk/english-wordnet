simpleMeaning: A female theatre worker who gets the objects the actors use ready and keeps them in order
scope: A woman on a stage crew who looks after the props; not the man doing the same job, and not the
  head of the crew.
examples:
- The property woman laid out the dishes for the dinner scene.
- She worked as property woman for the touring company.
