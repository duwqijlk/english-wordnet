simpleMeaning: the quality of showing what a person aims or plans to do
scope: About showing a clear aim or plan, not about something that happens by chance with no aim behind
  it.
examples:
- The intentionality in his voice made it clear that he meant every word.
- 'Her letter had a clear intentionality: she wanted the team to change its plan.'
