simpleMeaning: choose which performers will play each part in a film or stage production
scope: This concerns deciding which performers take each role in a production, not a performer being picked
  for one particular part, and not shaping metal in a mould.
examples:
- She cast the film with unknown actors from her home town.
- The director cast the play in a single afternoon.
