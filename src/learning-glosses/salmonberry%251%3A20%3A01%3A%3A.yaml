simpleMeaning: Red flowers and big fruit of a pinkish-orange shade grow on this tall, straight plant of
  western North America, of the soft-fruit kind.
scope: Unlike the creeping kind with yellow or orange berries, this tall, straight plant of western North
  America has red flowers and big pinkish-orange fruit.
examples:
- Pinkish-orange fruit hung on the salmonberry bushes.
- The salmonberry grew tall in western North America.
