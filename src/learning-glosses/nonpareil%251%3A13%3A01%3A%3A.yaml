simpleMeaning: Coloured beads of sugar, used as a topping on candies and cookies, and the like.
scope: Coloured beads of sugar, used as a topping on candies and cookies, and the like; not a flat disk
  of chocolate covered with beads of coloured sugar, nor a model of excellence or perfection of a kind,
  one with no equal.
examples:
- Their nonpareil topped the cake.
- The nonpareil was strewn at dawn.
