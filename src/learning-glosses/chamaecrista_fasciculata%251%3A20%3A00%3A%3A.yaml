simpleMeaning: A plant of tropical America with small leaves that fold a little when touched, sometimes
  put in the genus Cassia.
scope: A plant of tropical America with leaves that fold when touched, not a tall tree or a plant with
  leaves that stay still; also called partridge pea, sensitive pea, wild sensitive plant and Cassia fasciculata.
examples:
- The Chamaecrista fasciculata leaves folded when I touched them.
- Chamaecrista fasciculata grows in tropical fields in America.
