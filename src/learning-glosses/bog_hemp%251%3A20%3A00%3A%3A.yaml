simpleMeaning: With no hairs that sting, this is one of several kinds of flowering weed of a plant group
  called Boehmeria.
scope: Also called false nettle, this flowering weed of a plant group called Boehmeria has no hairs that
  sting, not a nettle that stings.
examples:
- We found bog hemp with flowers and no hairs that sting.
- Bog hemp bears flowers but has no hairs that sting.
