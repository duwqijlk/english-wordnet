simpleMeaning: Red berries that turn black grow on this strong-growing bush of Europe that grows like
  a tree, drops its leaves each year, and is common beside roads and paths.
scope: Also called twistwood and wayfaring tree, it is a strong-growing bush of Europe that grows like
  a tree and bears red berries that turn black.
examples:
- Beside roads and paths, twist wood grows like a tree.
- Red berries that turn black mark the twist wood.
