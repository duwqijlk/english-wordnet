simpleMeaning: With help from another person, someone with an illness that cannot be cured dies as free
  of pain and as worthy as possible
scope: This is a death another person helps to bring about for someone with an illness that cannot be
  cured, not a death a person brings about alone.
examples:
- The law on assisted suicide is still a matter of fierce debate in many countries.
- He chose assisted suicide so that his last days would be free of pain.
