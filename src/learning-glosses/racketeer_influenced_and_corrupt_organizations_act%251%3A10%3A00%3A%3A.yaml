simpleMeaning: A law meant to end crime by organized groups, by setting strong penalties and taking their
  property
scope: Also called anti-racketeering law, RICO and RICO Act, it is a law aimed at organized crime as a
  whole, with strong penalties and loss of property, among the laws that fight crime groups.
examples:
- The Racketeer Influenced and Corrupt Organizations Act sets strong penalties for organized crime.
- Under the Racketeer Influenced and Corrupt Organizations Act, the property of organized crime groups
  can be taken.
