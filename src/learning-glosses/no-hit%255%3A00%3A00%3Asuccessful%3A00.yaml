simpleMeaning: Said of a game, or of the pitching in it, where the side that throws the ball lets not
  one batter reach a base off a ball struck
scope: A game or pitching in which the other side gets not one batter on base from a batted ball; not
  a shutout, where the other side scores nothing but may still get batters on base, and not a perfect
  game, where not one batter reaches base at all.
examples:
- The visiting pitcher threw a no-hit game today.
- Our pitcher no-hit the home team last week.
