simpleMeaning: From the middle and east of Australia comes a big, bushy shrub with pointed leaves and
  flowers the colour of cream.
scope: This large, bushy shrub is also called needle-wood and needle wood, and it is not a tree.
examples:
- The needlewood had creamy white flowers.
- A needlewood grew in central and eastern Australia.
