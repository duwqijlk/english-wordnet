simpleMeaning: In grammar, the changes to a verb form that show how the speaker sees the action or state
scope: 'Also called mood and mode: in grammar, this is about verb forms, not a way to treat illness and
  not a grouping of statements about what must be or may be.'
examples:
- In English, modality can show whether a speaker thinks something must happen or may happen, through
  changes in verb forms.
- Teachers explain modality by showing how verb forms change when a speaker gives an order or makes a
  guess.
