simpleMeaning: to move about wildly, swinging the arms or body in all directions
scope: Also called flail, this means moving about wildly; it is not separating grain from its plant, and
  not hitting a person again and again.
examples:
- The fish threshed in the net, trying to get free.
- He threshed about in his sleep and kicked off the covers.
