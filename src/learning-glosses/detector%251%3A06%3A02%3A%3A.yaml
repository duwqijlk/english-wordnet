simpleMeaning: a part in a radio that pulls the sound signal out of the wave that carries it
scope: This is a part in a radio that pulls the sound signal out of the wave that carries it, not a device
  that picks up any kind of signal, and not a machine that finds radio signals in the air.
examples:
- The detector in the old radio pulled the music from the carrier wave.
- The engineer replaced the faulty detector in the set.
