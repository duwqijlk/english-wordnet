simpleMeaning: a level stretch of land built up by earth left behind again and again by water that flows
scope: A level stretch of land built up by earth left behind again and again by flowing water; alluvial
  plain is another name for this sense, and it is not a hill and not land built up by wind.
examples:
- The river built an alluvial flat beside its banks over many years.
- Crops grow well on the alluvial flat left by the old river.
