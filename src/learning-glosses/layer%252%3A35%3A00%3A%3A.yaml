simpleMeaning: to put something down in one flat thickness over another
scope: To put something down in one flat thickness over another, not a thin flat stretch itself and not
  a hen that lays eggs.
examples:
- Layer the coloured sands in the glass jar.
- She layered the potatoes with cheese in the dish.
