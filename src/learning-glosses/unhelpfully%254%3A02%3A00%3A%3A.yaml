simpleMeaning: in a way that gives no help when help is needed
scope: Doing a thing in a way that gives no help, not in a way that helps and not just refusing to do
  the thing at all.
examples:
- He answered unhelpfully and walked away when I asked for directions.
- She stood by unhelpfully while we tried to lift the heavy box.
