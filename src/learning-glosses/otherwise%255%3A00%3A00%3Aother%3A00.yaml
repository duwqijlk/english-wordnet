senseId: otherwise%5:00:00:other:00
synsetId: 02078705-s
simpleMeaning: Different from what people believe or expect.
scope: This is not the adverb meaning 'in other respects'; it describes a situation that differs from
  what was thought or expected.
examples:
- Everyone expected the vote to be close, but the result was otherwise.
- He looked calm, but the truth was otherwise.
