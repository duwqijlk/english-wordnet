simpleMeaning: In law, a person who sets up a legal gift plan by giving land or other things to a person
  who looks after them for someone else
scope: In law, a person who gives land or other things to someone who looks after them for another person;
  settlor is another name for this sense. Not the person who looks after the gift and not the person who
  gains from it.
examples:
- The trustor signed the papers that set up the gift plan.
- As trustor, she gave the house to be looked after for her son.
