simpleMeaning: A shrub of Japan and Korea that stays green all year, with small dark leaves and flowers
  in loose bunches, smaller than its Chinese kin
scope: An evergreen shrub of Japan and Korea with small dark leaves; Ligustrum japonicum is another name
  for this sense, not a tall tree or a deciduous shrub that loses its leaves.
examples:
- Japanese privet made a neat hedge along the path.
- The Japanese privet flowered in loose white bunches.
