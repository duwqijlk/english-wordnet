simpleMeaning: People often cook these large round sea animals with tough outer cases, caught off the
  Atlantic coast, in thick soups and other dishes.
scope: These large round sea animals with tough outer cases are also called quahog, quahaug and round
  clam.
examples:
- We cooked the hard-shell clams in a thick soup.
- We bought hard-shell clams for the chowder.
