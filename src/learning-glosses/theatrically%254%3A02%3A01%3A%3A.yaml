simpleMeaning: in a way that is like acting in a play on a stage
scope: In a way like acting in a play on a stage, not in a showy and unnatural way in daily life.
examples:
- She spread her arms theatrically as she spoke to the crowd.
- He was theatrically dressed in a long red coat for the party.
