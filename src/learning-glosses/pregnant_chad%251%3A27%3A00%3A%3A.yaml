simpleMeaning: a small piece that has been punched or pressed in, but is still joined to the card at all
  four corners
scope: 'Also called dimple and dimpled chad: a small piece punched or pressed in but still joined at all
  four corners, not a piece that has come off and not a hole left behind.'
examples:
- The machine left a pregnant chad hanging by its four corners.
- Workers counted the pregnant chad on the ballot card because it had not come off cleanly.
