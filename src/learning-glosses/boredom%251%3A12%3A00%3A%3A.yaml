simpleMeaning: the dull feeling that comes when nothing holds your interest
scope: The dull feeling that comes when nothing holds your interest, not being tired from work and not
  a lack of sleep.
examples:
- The boredom of the long wait made her yawn again and again.
- He felt boredom set in during the slow, dull talk.
