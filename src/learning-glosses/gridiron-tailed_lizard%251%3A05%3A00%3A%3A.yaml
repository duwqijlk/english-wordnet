simpleMeaning: A fast desert animal with a long tail marked with black bands and long legs, found in the
  dry lands of the United States and Mexico
scope: This is a fast desert animal with a long banded tail and long legs; zebra-tailed lizard is another
  name for this sense, not a slow desert animal and not an animal of wet lands.
examples:
- A gridiron-tailed lizard darted across the sand.
- The gridiron-tailed lizard lifted its long tail as it ran.
