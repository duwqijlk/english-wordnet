simpleMeaning: People copy files from their own computer to any computer they can reach on the network,
  and this set of rules lets them do it.
scope: Also called file transfer protocol; a set of rules for copying files over a network, not the files
  themselves and not a program for writing files.
examples:
- Use FTP to copy the file to the server.
- She sent the photos by FTP.
