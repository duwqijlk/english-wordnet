senseId: 'nature%1:07:02::'
synsetId: 04733982-n
simpleMeaning: The basic qualities that make something what it is and how people know it.
scope: This is not the physical world of plants and animals, and not a power that rules the universe;
  it is the basic character of a thing or person.
examples:
- It is in the nature of cats to sleep a lot.
- The nature of the problem became clear after the meeting.
