simpleMeaning: Smooth bark marks this North American hickory, whose leaves have seven to nine leaflets
  and whose hard-shelled nuts can be eaten.
scope: Also called big-bud hickory, black hickory, mockernut, and white-heart hickory; a smooth-barked
  North American hickory with a hard-shelled nut that can be eaten.
examples:
- The mockernut hickory by the road had smooth bark and seven leaflets on each leaf.
- A mockernut hickory nut is hard to crack but good to eat.
