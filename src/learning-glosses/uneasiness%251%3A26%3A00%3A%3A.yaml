simpleMeaning: a not-quite-well feeling in the body, like being a little sick or low in spirits
scope: 'Also called unease: a bodily feeling of being not quite well, not the trait of seeming ill at
  ease and not worry that makes you tense.'
examples:
- A wave of uneasiness came over her after the meal.
- His uneasiness grew as the fever rose.
