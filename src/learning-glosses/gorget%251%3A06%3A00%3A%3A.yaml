simpleMeaning: a plate worn as part of armor to keep the neck safe
scope: A neck plate in armor, not a helmet for the head and not a plate that covers the chest.
examples:
- The knight's gorget covered his throat below his helmet.
- A steel gorget protected the soldier's neck from a sword cut.
