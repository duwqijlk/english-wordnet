simpleMeaning: one of a row of round cuts in the front edge of a book that show where each part starts
scope: This is a round cut in the edge of a book that marks a part, not a list at the back of a book and
  not a mark made with the thumb.
examples:
- She found the chapter fast by using the thumb index.
- The thumb index on the dictionary helps me find words quickly.
