simpleMeaning: a group of cells or living things that are all exactly the same, made from one single cell
  or living thing in a way that needs no second parent
scope: 'Also called clone: this sense names the whole group made from one cell or living thing, not the
  act of making such a group.'
examples:
- The laboratory grew a clon from a single cell.
- Each clon in the dish came from one parent cell.
