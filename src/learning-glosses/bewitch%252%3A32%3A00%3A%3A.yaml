simpleMeaning: to pull a person towards you with great force, as if a magnet were pulling them
scope: To pull a person towards you with great force, as if by a magnet, also called mesmerize; not to
  use real magic and not merely to please someone a little.
examples:
- She bewitched the audience with her singing.
- The old house bewitched him, and he could not leave it alone.
