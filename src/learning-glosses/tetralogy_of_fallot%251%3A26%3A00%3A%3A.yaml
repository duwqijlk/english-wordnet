senseId: 'tetralogy_of_fallot%1:26:00::'
synsetId: 14493350-n
simpleMeaning: 'A heart defect from birth turning skin blue, signs: a narrowed lung artery, a hole between
  the lower chambers, the main artery over both chambers, and a thick right chamber.'
scope: Also called Fallot's syndrome and Fallot's tetralogy; a heart defect present at birth with four
  signs, not a heart defect from illness in later life and not a single hole in the heart.
examples:
- Tetralogy of Fallot is found in newborn babies.
- The baby with tetralogy of Fallot needed an operation on her heart.
