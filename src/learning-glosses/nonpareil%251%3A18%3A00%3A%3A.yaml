synsetId: 10344909-n
simpleMeaning: A model of the finest of its sort, with no peer.
scope: This sense is also called ideal, saint, paragon, and apotheosis, for a model of the finest of its
  sort, with no peer, where ideal is a person or thing that is the best example of its kind, so good that
  no other is as good as it, unlike the sense for coloured beads of sugar, used as a topping on candies
  and cookies, and the like, and unlike the sense for a flat round of chocolate spread with beads of bright
  sugar.
examples:
- The nonpareil was a model of the best of its kind.
- Nonpareils are models with no peer.
