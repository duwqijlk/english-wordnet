senseId: 'wryneck%1:26:00::'
synsetId: 14581311-n
simpleMeaning: a state of the body that is not normal, in which the head leans to one side because the
  neck muscles on that side have tightened
scope: This is a neck condition in which the head leans to one side, and torticollis is another name for
  this sense, not the bird that twists its neck.
examples:
- His wryneck made his head lean to one side.
- The doctor treated her wryneck with exercises for the tight neck muscles.
