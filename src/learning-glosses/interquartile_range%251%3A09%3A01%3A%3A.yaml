simpleMeaning: In statistics, a measure of how spread out a set of numbers is, found by taking the gap
  between the top quarter mark and the bottom quarter mark
scope: In statistics, a measure of how spread out a set of numbers is, found from the gap between the
  top and bottom quarter marks, also called the middle fifty or midspread; not the gap between the largest
  and smallest numbers and not the average.
examples:
- The interquartile range of the test scores was 3.5.
- A small interquartile range means the middle half of the numbers sit close together.
