simpleMeaning: a person who is very cruel and very bad, and has no human kindness
scope: 'Also called monster, devil, demon and fiend: a real person who is very cruel and bad, not a very
  big person in old stories who eats people.'
examples:
- He was an ogre to the children who worked for him, shouting at them and beating them.
- The workers called their boss an ogre because he never showed them any kindness.
