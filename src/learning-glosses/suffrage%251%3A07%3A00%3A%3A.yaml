simpleMeaning: the legal right to vote, given by the 15th change to the United States Constitution and
  given to women by the 19th change
scope: Also called vote and right to vote, this is the legal right itself, not a single act of voting
  or one vote cast.
examples:
- Women fought for suffrage for many years before they won it in 1920.
- Suffrage was written into the Constitution as a right for all men, and later for women.
