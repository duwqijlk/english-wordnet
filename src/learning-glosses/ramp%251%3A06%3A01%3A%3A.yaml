simpleMeaning: a set of steps that can be moved, used by passengers to get on or off a plane
scope: Steps for getting on or off a plane, not a sloping path, not a wild plant with white flowers, and
  not behaving in a wild, angry way.
examples:
- Passengers walked down the ramp from the plane.
- Workers moved the ramp to the door of the aircraft.
