simpleMeaning: where the sea meets the land, the edge of the land bends in, making a curve bigger than
  a cove but smaller than a gulf
scope: 'Also called bay: where the sea meets the land, the edge of the land bends in, making a curve bigger
  than a cove but smaller than a gulf, not a small cove and not a large gulf.'
examples:
- The embayment gave the fishing boats shelter from the wind.
- They built the town beside a wide embayment.
