simpleMeaning: The set of rules for which beats in words are made strong, in one language
scope: The set of rules for which beats in words are made strong, in one language, not the whole sound
  system and not the grammar.
examples:
- English has a different accentual system from French.
- The accentual system of the language puts the beat on the first part of a word.
