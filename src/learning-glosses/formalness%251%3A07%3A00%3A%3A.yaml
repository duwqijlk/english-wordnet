simpleMeaning: acting in a way that follows all the set rules and rites
scope: 'Another name for formality: acting in a way that follows every set rule and rite, not a casual
  manner and not a single polite act.'
examples:
- His formalness at the ceremony made everyone sit up straight.
- The formalness of her greeting showed she took the meeting very seriously.
