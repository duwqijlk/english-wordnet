synsetId: 00596011-a
simpleMeaning: happening again and again in separate places or at separate times, in a way that is not
  regular or cannot be known in advance
scope: Happening again and again in separate places or at separate times, not happening all the time and
  not happening in a regular pattern.
examples:
- Sporadic rain fell over the hills all afternoon.
- The village had sporadic power cuts through the winter.
