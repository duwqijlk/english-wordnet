simpleMeaning: A measure of how much a thing holds, used by makers of medicines, equal to one eighth of
  a liquid ounce.
scope: A measure of how much a thing holds, used by makers of medicines, equal to one eighth of a liquid
  ounce, also called a drachm, a fluid drachm, or a fluid dram; not the British measure of 60 minims and
  not a measure of weight.
examples:
- The recipe called for two fluidrams of the medicine.
- A fluidram is a small measure of liquid.
