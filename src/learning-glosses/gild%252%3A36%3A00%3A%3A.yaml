simpleMeaning: to cover something with very thin gold, or with a gold liquid, or with something that looks
  like gold, to make it beautiful
scope: This sense means covering a thing with thin gold or gold-like material to make it beautiful, not
  just making a thing yellow or bright with ordinary paint.
examples:
- Workers gilded the frame with thin sheets of gold.
- She learned to gild the edges of the book cover.
