simpleMeaning: A moon count for followers of Islam, from 622 AD, the year of the Hegira; the year start
  moves back through the sun year, finishing the round every 32 years.
scope: 'Also called Islamic calendar, Mohammedan calendar, Moslem calendar and Muslim calendar: a moon
  count for followers of Islam, from 622 AD, the year of the Hegira, whose year start moves back through
  the sun year, not a sun count.'
examples:
- The Muhammadan calendar counts its years from 622 AD.
- The new year of the Muhammadan calendar falls earlier each solar year.
