simpleMeaning: make something possible or create the chance for it, and allow it to be reached or to stay
  or continue
scope: This is about leaving room for an outcome, not about handing someone a thing they need.
examples:
- The agreement provides for two extra weeks of leave.
- Their savings provide for unexpected repairs.
