simpleMeaning: waste that comes out of the body, like sweat or urine, but especially the solid waste that
  the body passes
scope: 'Also called excreta and excretion: waste that leaves the body. It is not food waste or rubbish
  from a house.'
examples:
- The field was dirty with animal excrement.
- Workers must wash their hands well after touching excrement.
