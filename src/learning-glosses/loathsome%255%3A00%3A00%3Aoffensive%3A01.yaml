simpleMeaning: very bad and hateful in a way that makes people feel strong dislike and want to turn away
scope: 'Also called wicked, foul, disgusting, revolting, distasteful, repellent, yucky, repelling, skanky
  and repellant: very hateful and making people turn away, not just a little unpleasant.'
examples:
- The room had a loathsome smell that made everyone leave.
- He told a loathsome lie that no one could forgive.
