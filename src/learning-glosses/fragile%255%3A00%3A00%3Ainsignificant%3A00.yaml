simpleMeaning: not solid or important enough to matter
scope: Also called slight, thin, and flimsy. This means not solid or important enough to matter, not easy
  to break.
examples:
- He gave only a fragile reason for being late, and no one believed it.
- Their fragile claim to fame was soon forgotten by everyone.
