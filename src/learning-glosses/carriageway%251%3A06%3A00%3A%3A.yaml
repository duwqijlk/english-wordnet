simpleMeaning: The part of a motorway that is made for traffic going one way only. A motorway has two
  such parts, and each one usually has two or three lanes.
scope: This is one side of a motorway for traffic going in one way only, not the whole road and not a
  single lane on its own.
examples:
- Cars on this carriageway all travel north.
- A lorry broke down on the south carriageway.
