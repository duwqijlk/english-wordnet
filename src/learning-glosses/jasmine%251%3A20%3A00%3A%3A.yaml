simpleMeaning: Any of several bushes or climbing plants of the plant group called Jasminum, mostly from
  Asia
scope: Any of several bushes or vines of the Jasminum group, mostly from Asia; not a single garden flower
  and not a scent on its own.
examples:
- Jasmine climbed over the garden wall, white and sweet.
- They planted jasmine by the door for its scent.
