simpleMeaning: to say a thing is not true, or to say the opposite of it
scope: To say a thing is not true, or to say the opposite of it, not to hold back a pleasure from yourself
  and not to say no to knowing a person.
examples:
- He will deny the claim that he took the money.
- She must deny that she was there that night.
