simpleMeaning: A common bird of Europe and Asia that lives in fields of grain.
scope: A common bird of Europe and Asia that lives in fields of grain; corncrake is another name for this
  sense, not a bird that lives by water, and not a bird of North America.
examples:
- A land rail called from the wheat field at dusk.
- We heard the land rail in the tall grass.
