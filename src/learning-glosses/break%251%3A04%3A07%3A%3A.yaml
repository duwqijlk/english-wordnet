simpleMeaning: In tennis, this is the score gained by winning a game in which the other player served.
scope: This is the tennis score, not a pause from work, not the act of shattering something, not a bone
  injury, not a jail escape, not a sudden dash, and not a lucky chance.
examples:
- A single break was enough to decide the opening set.
- She secured the only break of the match in the fifth game.
