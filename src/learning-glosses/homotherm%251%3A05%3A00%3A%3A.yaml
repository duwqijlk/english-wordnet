senseId: 'homotherm%1:05:00::'
synsetId: 01317821-n
simpleMeaning: The heat of this animal's body holds steady, barely moving even when the air or water around
  it turns hot or cold
scope: This is an animal whose body heat stays nearly the same, also called a homeotherm or a homoiotherm;
  it is not an animal whose body heat goes up and down with the heat of the place around it.
examples:
- Birds and mammals are homotherms.
- A homotherm keeps its body temperature steady even in cold weather.
