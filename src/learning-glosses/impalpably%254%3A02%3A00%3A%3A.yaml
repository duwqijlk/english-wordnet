simpleMeaning: In a way that is weak, without strength or fullness.
scope: Done weakly, without strength or fullness, not in a strong, full way; insubstantially is another
  name for this sense.
examples:
- He spoke impalpably, so few in the room heard him.
- The music played impalpably in the background.
