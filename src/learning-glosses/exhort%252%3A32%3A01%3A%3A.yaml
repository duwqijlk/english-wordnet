simpleMeaning: to push someone to go on or make them feel brave, especially by cheering and shouting for
  them
scope: 'Also called cheer, urge, inspire and barrack: this is pushing someone on with cheers and shouts,
  not giving strong advice in a quiet, serious way.'
examples:
- Fans exhorted the team with loud cheers to keep playing hard.
- The crowd exhorted the runners by shouting for them all the way.
