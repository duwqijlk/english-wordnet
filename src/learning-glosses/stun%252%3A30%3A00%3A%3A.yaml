simpleMeaning: to make a person unable to think or feel, or dizzy, by a blow or as if by a blow
scope: 'Also called stupefy: to make a person unable to think or feel, or dizzy, by a blow or as if by
  a blow; not the other sense in this batch of being overcome by great surprise or by not believing something.'
examples:
- The fall from the ladder stunned him, and he sat down feeling dizzy.
- A hard blow to the head can stun a person for a few minutes.
