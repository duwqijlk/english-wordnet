simpleMeaning: in a court case, everything used to prove or disprove a disputed fact under examination
scope: This is the material used in a court trial, not the general basis for a person's belief or a sign
  that makes something obvious.
examples:
- The prosecution presented new evidence at the trial.
- The jury weighed the evidence before reaching a verdict.
