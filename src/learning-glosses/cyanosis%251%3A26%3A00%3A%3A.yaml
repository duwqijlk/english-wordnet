simpleMeaning: a change that makes the skin and the soft wet skin inside the body look blue
scope: A blue look to the skin and the soft wet skin inside the body, not a bruise and not a rash.
examples:
- Her lips showed cyanosis after the cold swim.
- The doctor noted cyanosis in the baby's skin and mouth.
