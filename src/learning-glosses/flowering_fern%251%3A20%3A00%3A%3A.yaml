simpleMeaning: a large fern of the genus Osmunda with creeping underground stems; its exposed spore cases
  grow on specialized leaves that look like flower clusters.
scope: This is the large Osmunda fern whose spore cases form flower-like clusters; 'osmund' is another
  name for it, while the other flowering fern is an Australasian species.
examples:
- Flowering fern thrives in the damp shade beside the stream.
- In spring the flowering fern's spore clusters look like small flowers.
