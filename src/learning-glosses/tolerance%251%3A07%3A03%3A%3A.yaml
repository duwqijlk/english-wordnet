simpleMeaning: how well a living thing can bear hard conditions in the place where it lives
scope: How well a living thing can bear harsh conditions, not a small allowed difference in size and not
  putting up with other people's beliefs.
examples:
- The plant's tolerance for drought helps it live in dry soil.
- Some fish have a high tolerance for cold water.
