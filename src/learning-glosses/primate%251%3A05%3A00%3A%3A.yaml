simpleMeaning: a mammal whose young grow inside the mother before birth, in the group that includes monkeys,
  apes and people; it sees well and has hands and feet that bend easily
scope: This sense is the animal group that includes monkeys, apes and people, not a top church leader.
examples:
- A monkey is a primate, but a dog is not.
- Primates such as chimps use their hands and feet to hold branches.
