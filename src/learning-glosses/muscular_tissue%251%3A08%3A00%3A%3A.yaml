simpleMeaning: Cells that can tighten and pull make up most of this stuff in an animal's body
scope: 'Also called muscle: the stuff in an animal''s body made for the most part of cells that can tighten
  and pull, not bone, skin or fat.'
examples:
- Muscular tissue lets the arm bend and straighten.
- The doctor took a small piece of muscular tissue to look at under a lens.
