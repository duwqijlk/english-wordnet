simpleMeaning: A tool used in taking pictures that tells how strong the light is.
scope: This is a tool used in taking pictures that tells how strong the light is, also called a light
  meter; it is not a tool that takes the picture, and not a tool that weighs light from a lamp against
  a set lamp.
examples:
- The photometer showed that the light was too weak.
- He held the photometer up to check the light.
