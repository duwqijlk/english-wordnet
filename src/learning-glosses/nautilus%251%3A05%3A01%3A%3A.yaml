simpleMeaning: a sea animal like the octopus and the squid (a cephalopod), of the Indian and Pacific oceans,
  with a shell that curls round and has pale, shiny walls inside
scope: Also called chambered nautilus and pearly nautilus. This one has pale, shiny walls inside its shell,
  not the kind whose females have thin, paper-like shells.
examples:
- A nautilus floated in the warm water near the reef.
- The shell of the nautilus is divided by pale, shiny walls.
