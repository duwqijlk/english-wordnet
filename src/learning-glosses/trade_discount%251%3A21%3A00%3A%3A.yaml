senseId: 'trade_discount%1:21:00::'
synsetId: 13295755-n
simpleMeaning: a cut in the price shown in a list, given by a maker or a seller of goods in large amounts
  to a shopkeeper
scope: A lower price on goods that a maker or a large seller gives to a shopkeeper; not a price cut for
  shoppers, and not a tax or a fee.
examples:
- The trade discount let the shop buy stock for less than the list price.
- The wholesaler offered her a trade discount on the whole order.
