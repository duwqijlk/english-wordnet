simpleMeaning: A sea creature with feathery gills in a row down each side of its back, often used as bait
  for fish.
scope: Also called lug and lobworm, it is a sea creature whose back carries a row of feathery gills on
  each side, often used as bait for fish.
examples:
- The angler threaded a lugworm onto the hook.
- The lugworm on the hook drew the fish.
