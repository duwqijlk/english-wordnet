simpleMeaning: a picture of where an antenna's signal goes and how strong it is at each angle, set out
  on round or square grids
scope: This picture of an antenna's signal spread is also called a pattern and a radiation diagram; it
  is not a map of the antenna itself.
examples:
- The radiation pattern shows a dead spot behind the tower.
- We plotted the radiation pattern at every angle.
