simpleMeaning: How prisons are run and how prisoners are helped to live well after prison is what this
  part of the study of crime looks at
scope: 'Also called poenology: the study of how prisons are run and prisoners helped back to normal life,
  not the whole study of crime and not the running of a prison itself.'
examples:
- She took a course in penology as part of her law degree.
- Penology covers both prison management and the care of prisoners after release.
