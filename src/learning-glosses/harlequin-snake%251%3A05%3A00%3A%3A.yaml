simpleMeaning: Bright bands of red and black and yellow or white mark these poisonous long thin animals
  of the Americas, found widely across South and Central America, one of several kinds.
scope: It is also called coral snake, and it is one of the poisonous banded snakes found widely across
  South and Central America.
examples:
- A harlequin-snake lay coiled, its bright bands clear to see.
- The harlequin-snake's bright bands warned that it was poisonous.
