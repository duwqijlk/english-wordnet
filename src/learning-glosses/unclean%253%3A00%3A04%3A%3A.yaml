simpleMeaning: covered with dirt or grime, or likely to make other things dirty with dirt or grime
scope: Also called dirty and also called soiled. This is about dirt on a thing, not about being impure
  under food or religion rules.
examples:
- He wore an unclean shirt covered in dirt.
- The unclean floor left dark marks on her shoes.
