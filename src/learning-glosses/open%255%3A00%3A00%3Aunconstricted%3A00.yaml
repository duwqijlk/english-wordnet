simpleMeaning: not held tight by tension or shyness, so that the body or manner is free and loose.
scope: This is not about being honest or hiding nothing, and not about something being unclosed; it describes
  a body or manner that is loose and not held in by tension or shyness.
examples:
- Her open laugh soon put the whole room at ease.
- He stood with an open posture, shoulders loose and hands unclenched.
