simpleMeaning: any of many small harmless North American animals with a yellow or orange band round the
  neck
scope: Any of many small harmless North American animals with a yellow or orange band round the neck;
  ring-necked snake and ring snake are other names for it, not the European ringed snake and not a coral
  snake.
examples:
- A ringneck snake hid under the flat stone.
- Ringneck snakes are small and harmless to people.
