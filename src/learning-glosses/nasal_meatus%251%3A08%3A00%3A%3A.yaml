simpleMeaning: The gaps inside the nose, formed by the curved bones that stick out inside it.
scope: The gaps inside the nose formed by the curved bones that stick out inside it, not the nostrils
  and not the passage at the back of the throat.
examples:
- Air flows through the nasal meatus on its way to the lungs.
- The nasal meatus is narrow where the bones stick out.
