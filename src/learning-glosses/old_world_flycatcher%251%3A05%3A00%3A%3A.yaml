simpleMeaning: These small songbirds, one of a large group, live in the lands of Europe, Asia and Africa,
  and feed on insects that they catch while flying.
scope: Also called flycatcher and true flycatcher; this names any one of a large group of small songbirds,
  not one bird on its own.
examples:
- The old world flycatcher caught a fly while flying.
- We saw an old world flycatcher take an insect on the wing.
