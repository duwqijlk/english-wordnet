senseId: 'tapestry%1:07:00::'
synsetId: 04774278-n
simpleMeaning: something that has many small parts joined together in a detailed way, like a woven wall
  picture
scope: This sense is for something that is like a woven wall picture because it has many linked parts;
  it is not the real cloth hanging on a wall and not the heavy cloth used for curtains.
examples:
- The tapestry of their family history stretched back for three hundred years.
- She described the tapestry of city life, with its many different people and stories.
