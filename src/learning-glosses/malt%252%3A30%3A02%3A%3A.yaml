simpleMeaning: to change grain into a form that is dried after being soaked in water and left to start
  growing
scope: This is the act of changing grain itself, not putting that grain into a drink or food, and not
  the grain or the drink as a thing.
examples:
- The workers malt the barley before it is sent to the brewery.
- They malt grain in large, warm rooms before drying it.
