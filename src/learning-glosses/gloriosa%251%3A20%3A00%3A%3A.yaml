simpleMeaning: 'Any plant of a tropical African and Asian genus: a long-lived climbing herb with tendrils
  at its leaf tips, striking yellow, red or purple flowers, and entirely poisonous parts.'
scope: This is the climbing, poisonous tropical plant also called creeping lily and glory lily; it is
  not a garden lily grown for cut flowers.
examples:
- The gloriosa climbed the fence, its tendrils curled tightly around the wire.
- Her gloriosa was the brightest thing on the wall, but the whole plant is poisonous.
