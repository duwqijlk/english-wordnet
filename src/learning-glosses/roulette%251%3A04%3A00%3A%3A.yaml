simpleMeaning: a game for money where players bet on which small space in a turning wheel a small ball
  will stop in
scope: This sense is the game where people bet money on where a ball will stop. It is not the small wheel
  with sharp points used to make holes.
examples:
- They played roulette and bet on the red spaces.
- In roulette, you wait to see where the small ball stops.
