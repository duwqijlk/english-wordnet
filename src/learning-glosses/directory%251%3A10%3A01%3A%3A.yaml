simpleMeaning: In computer science, a list of the files kept in a computer's memory, usually on a hard
  disk
scope: In computer science, a list of files kept in memory, usually on a hard disk, not a book that lists
  people's names, addresses or phone numbers.
examples:
- I opened the computer directory to see the files on the hard disk.
- She checked the directory for a list of the stored files.
