simpleMeaning: to move around through a place, a round path, or a whole set of connected parts and come
  back to where it started
scope: This is about something moving around through a place, a round path, or a set of connected parts
  and coming back to where it started, not about making something else move around.
examples:
- Blood circulates in my veins.
- The air here does not circulate.
