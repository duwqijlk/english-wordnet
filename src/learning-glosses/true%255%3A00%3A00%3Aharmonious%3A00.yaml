simpleMeaning: sounding at the right musical note, in tune and with accurate pitch
scope: This is about musical notes and singing or playing, not about a statement being correct or a person
  being honest.
examples:
- The piano sounded true even in the highest register.
- Her voice was true on every note of the song.
