simpleMeaning: Any one of several plants with fine divided leaves and no flowers, of the Lygodium group,
  that wind round things as they grow.
scope: Any one of several plants with fine divided leaves and no flowers, of the Lygodium group, that
  wind round things as they grow; not a plant that stands on its own and not a vine with flowers.
examples:
- The climbing fern wound itself round the tree trunk.
- A climbing fern covered the old fence in green.
