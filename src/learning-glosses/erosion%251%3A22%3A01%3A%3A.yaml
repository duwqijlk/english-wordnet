simpleMeaning: the wearing away of rock, soil or other material by chemicals
scope: This is wearing away done by chemicals, not the wearing away of land or rock done by water, wind
  or small pieces rubbing over it.
examples:
- Acid rain caused erosion of the stone front of the old church.
- Erosion by chemicals in the water slowly made holes in the metal pipes.
