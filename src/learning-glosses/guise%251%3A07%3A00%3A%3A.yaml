simpleMeaning: a false show, put on with skill to look like something it is not
scope: A skilled false show made to look like something else; pretense, pretext and pretence are other
  names for this sense, and it is not an honest look or a real change of form.
examples:
- Under the guise of friendship, he betrayed them.
- She came in the guise of a nurse to see the patient.
