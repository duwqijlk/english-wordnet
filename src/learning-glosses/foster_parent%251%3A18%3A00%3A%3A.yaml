senseId: 'foster_parent%1:18:00::'
synsetId: 10126521-n
simpleMeaning: a grown-up who cares for another person's child as its mother or father would, without
  taking the child as their own by law
scope: This is a grown-up who cares for a child in place of its birth parents, without adopting it by
  law; foster-parent is another name for it, not a birth parent or a legal adopter.
examples:
- The foster parent read the children a bedtime story.
- He works as a foster parent for teenagers.
