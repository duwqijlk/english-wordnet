simpleMeaning: A group of states made up of the United Kingdom and a few once-British lands that are now
  free but still owe loyalty to the British Crown.
scope: Also called British Commonwealth, this is a group of states that still owe loyalty to the British
  Crown, not the United Nations.
examples:
- The Commonwealth of Nations meets every two years.
- Canada belongs to the Commonwealth of Nations.
