simpleMeaning: a court order giving a person owed money a claim on what the debtor owns, which can be
  carried out by the sheriff taking it and selling it
scope: A claim on a debtor's property given by a court, not a loan and not a claim made without a court
  order.
examples:
- After the judgment lien was granted, the creditor could ask the sheriff to seize the debtor's car.
- The judgment lien meant the house could not be sold until the debt was paid.
