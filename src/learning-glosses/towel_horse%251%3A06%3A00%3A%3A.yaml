simpleMeaning: a rack with one or more bars for hanging cloths used to dry the body
scope: A rack with bars for hanging cloths used to dry the body; towel rack is another name for this sense.
  Not a single hook and not a rack for coats.
examples:
- She hung the wet towels on the towel horse after her shower.
- The towel horse by the bath has two bars for towels.
