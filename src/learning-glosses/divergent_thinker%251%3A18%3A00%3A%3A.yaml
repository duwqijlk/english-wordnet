simpleMeaning: a person whose mind moves away from a problem as it is put to them and often finds fresh
  ideas and answers
scope: A person whose mind moves away from a problem as it is put to them and often finds fresh ideas
  and answers, and not a person who follows the problem step by step or one who has no new ideas.
examples:
- As a divergent thinker, she found a fresh way round the puzzle.
- The divergent thinker left the set question behind and came up with a new plan.
