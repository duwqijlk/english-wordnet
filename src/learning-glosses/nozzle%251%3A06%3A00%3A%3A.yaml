simpleMeaning: a part that sticks out and lets liquid or gas flow out through it
scope: 'Also called nose: this is an end part that liquid or gas flows out of, not the part of the face
  used for smelling and not a pipe as a whole.'
examples:
- Water sprayed out through the nozzle of the garden hose.
- He fitted a narrow nozzle to the pump so the air came out in a strong stream.
