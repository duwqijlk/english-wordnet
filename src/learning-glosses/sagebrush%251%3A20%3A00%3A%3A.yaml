simpleMeaning: Any of a group of low, bushy North American plants, of the groups called Artemis or Seriphidium,
  whose flower heads are made of many small parts.
scope: Also called sage brush; of low, bushy North American plants of the groups called Artemis or Seriphidium,
  not the herb sage itself.
examples:
- Sagebrush covered the dry hillside as far as we could see.
- The smell of sagebrush filled the air after the rain.
