scope: This is a mix of hard grain dust and a binding stuff that can be shaped into blocks used to grind
  things; emery rock is another name for it, not loose dust and not a natural stone.
examples:
- The emery stone was molded into a grindstone.
- Workers shaped the emery stone into stones for grinding.
