simpleMeaning: a feeling of fear when going to places or doing things that are new and not known to you
scope: This is fear of new and unknown places or activities, not fear of a known danger and not just being
  quiet with other people.
examples:
- Her timidity stopped her from joining the trip to a new city.
- His timidity made him slow to try a new sport.
