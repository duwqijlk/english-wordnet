simpleMeaning: The written text of words that were spoken or recorded, typically typed out from the recording.
scope: This is a typed-out record of speech, not a reproduced document such as a school or court record,
  and not the recording itself.
examples:
- The court reporter prepared a transcript of the witness's testimony.
- She ordered a transcript of the interview to check his exact words.
