simpleMeaning: Ice gathers on it at the first cold, which is why this long-lived plant of America's east
  bears single yellow flowers early and later ones with no petals.
scope: Also called frostweed or frostwort, this long-lived plant of America's east bears single yellow
  flowers early and later ones with no petals, not the tall plant with clusters of white flowers.
examples:
- The frost-weed in the garden had single yellow flowers.
- By the first frost, ice crystals had formed on the frost-weed.
