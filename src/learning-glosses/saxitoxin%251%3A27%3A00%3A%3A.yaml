simpleMeaning: Made by some tiny sea creatures in red tides, it is a strong nerve poison that can build
  up in shellfish that eat them and poison people who eat them.
scope: It is a strong nerve poison from tiny sea creatures in red tides, and it reaches people through
  shellfish, not through the water itself.
examples:
- Saxitoxin built up in the shellfish after the red tide.
- People who ate the shellfish got food poisoning from saxitoxin.
