simpleMeaning: to cry or whine while breathing in hard through a blocked nose
scope: To cry or whine while breathing noisily through a blocked nose, also called sniffle; not to draw
  mucus up the nose, and not to sniff at a smell.
examples:
- The child snuffled through her tears and would not stop crying.
- He snuffled and whined about the lost game all evening.
