simpleMeaning: This machine breathes for a person over a long time, moving air in and out for them
scope: A machine that breathes for a person over a long time, also called a respirator; not a small hand-held
  inhaler for a blocked nose and not a mask that only gives extra air.
examples:
- The patient was kept on an inhalator through the night.
- An inhalator in the ward helped him breathe while he slept.
