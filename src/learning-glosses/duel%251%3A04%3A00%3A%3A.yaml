simpleMeaning: A fight planned before it happens between two people, each with a helper, using weapons
  that can kill, to settle an argument over a point of honour
scope: This is a real planned fight with weapons that can kill, not just a hard struggle or contest between
  two skilled people or groups.
examples:
- The two men met at dawn for a duel with swords.
- He lost his brother in a duel over a point of honour.
