simpleMeaning: Writ in the flowing hand of old Egypt.
scope: This sense is writ in the flowing hand of old Egypt, unlike the sense for a flowing form of Egyptian
  picture-writing, used especially by the priests, and unlike the sense for holding to set types and ways,
  stiff and formal.
examples:
- The script was hieratic, writ in the flowing hand.
- The text was hieratic, in the flowing hand.
