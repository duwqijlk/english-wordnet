simpleMeaning: A member of a Siouan people who formed one part of the Teton Sioux.
scope: This name is for a member of one division of the Teton Sioux, a Siouan people, not for members
  of the Sioux as a whole.
examples:
- A Two Kettle man lived with the Teton Sioux.
- A Two Kettle elder spoke of the old days.
