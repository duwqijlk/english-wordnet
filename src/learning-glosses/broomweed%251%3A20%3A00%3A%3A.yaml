simpleMeaning: This plant of the southwestern United States lives for one year, bearing yellow flowers
  and sticky leaves on stiff wood-like branches.
scope: Also called broom-weed, this plant lives for one year in the southwestern United States and has
  stiff branches, sticky leaves, and yellow flowers, not a plant that lives for many years.
examples:
- Broomweed grows in the southwestern United States.
- The broomweed has yellow flowers and sticky leaves.
