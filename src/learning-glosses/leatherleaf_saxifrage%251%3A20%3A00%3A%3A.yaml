simpleMeaning: a damp-ground plant from northwestern North America to Oregon and Idaho, with thick oval
  leaves at the base and bare upright stems bearing dense round clusters of tiny white flowers
scope: This is the damp-ground saxifrage with thick leaves at the base and white flower heads, not another
  saxifrage species and not the separate bog shrub called leatherleaf.
examples:
- Leatherleaf saxifrage grows in wet ground among moss and low shrubs.
- In July the leatherleaf saxifrage lifts bare stalks topped with tiny white flowers.
