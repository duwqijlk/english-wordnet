simpleMeaning: a picture or idea of a thing that is not clear, so you cannot make out its shape
scope: 'Also called blur: a picture or idea that is not clear, not the soft short hair on skin or cloth.'
examples:
- The whole evening was a fuzz in his mind.
- He tried to clear the fuzz from his head after the long night.
