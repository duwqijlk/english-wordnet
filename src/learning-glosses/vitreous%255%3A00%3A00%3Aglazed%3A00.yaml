simpleMeaning: of clay ware, with a shiny skin that lets no water through, made by melting a clear coat
  on it
scope: 'Another name for glassy, also called vitrified: clay ware with a shiny surface that lets no water
  through, not the clear jelly in the eye and not ordinary glass.'
examples:
- The vitreous glaze on the bowl keeps water from soaking through.
- This vitreous china is smooth and shiny to the touch.
