simpleMeaning: White blooms cut deep into fine strips mark this low plant of Central America, which creeps
  along the ground and lives for years, at times put in the group Episcia.
scope: This low plant of Central America creeps along the ground, lives for years, and bears white blooms
  cut deep into fine strips.
examples:
- The lace-flower vine spread low across the ground and showed its white blooms.
- A lace-flower vine crept along the ground with its fringed white blooms.
