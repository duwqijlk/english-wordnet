scope: A small green-brown fly-catching bird of eastern North American forests, also called peewit, peewee,
  pewee and pewit; not a larger forest bird that hunts other animals and not a bright garden bird.
examples:
- A wood pewee called from a branch in the forest.
- We watched the wood pewee catch flies over the clearing.
