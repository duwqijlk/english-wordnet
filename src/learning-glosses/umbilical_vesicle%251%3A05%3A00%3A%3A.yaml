simpleMeaning: A thin-walled bag that works as the blood system in the young of animals with wombs, until
  the heart starts to work.
scope: This is a thin-walled bag that works as the blood system in the young of animals with wombs, also
  called vesicula umbilicus, vitelline sac and yolk sac; not the cord itself and not the bag round the
  whole young.
examples:
- The umbilical vesicle feeds the young before the heart works.
- Doctors study the umbilical vesicle in early growth.
