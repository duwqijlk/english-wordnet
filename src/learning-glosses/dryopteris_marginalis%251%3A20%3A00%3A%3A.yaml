simpleMeaning: A North American fern that keeps its green leaves all year.
scope: Also called the evergreen wood fern, the leatherleaf wood fern and the marginal wood fern; a North
  American fern with leaves that stay green all year, unlike ferns that lose their leaves in winter.
examples:
- The Dryopteris marginalis in the wood kept its green leaves through the winter.
- We planted Dryopteris marginalis under the trees because it stays green all year.
