senseId: 'mifepristone%1:06:00::'
synsetId: 02670723-n
simpleMeaning: a drug, RU 486, made in France, that in the first five weeks of a pregnancy blocks progesterone,
  the chemical that keeps a pregnancy going, so the embryo is shed
scope: 'Also called abortion pill: a drug that ends a pregnancy in its first five weeks, not a drug that
  stops pain or treats a sickness.'
examples:
- Her doctor told her that mifepristone must be taken in the first five weeks of pregnancy.
- Mifepristone works by blocking the action of progesterone.
