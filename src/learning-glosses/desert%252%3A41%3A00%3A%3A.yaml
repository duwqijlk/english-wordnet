simpleMeaning: to leave a cause, country, or army, often to join the opposing side
scope: To abandon a cause, country, or army, often to join the other side; the verb defect is another
  name for this sense. Not simply leaving a person who depends on you, and not the noun sense of what
  someone deserves.
examples:
- Many soldiers deserted the army when the war turned against them.
- He was accused of deserting his country to fight for the enemy.
