simpleMeaning: An earthball fungus, dingy brownish yellow outside with a dark purplish inside; its outer
  skin is covered with a pattern of small warts
scope: Also called Scleroderma aurantium; a round earthball fungus, yellow-brown outside and dark purple
  inside, not the smooth earthball with a firm dry skin.
examples:
- Scleroderma citrinum is common in woods on sandy soil.
- We picked up a Scleroderma citrinum and saw its dark purple centre.
