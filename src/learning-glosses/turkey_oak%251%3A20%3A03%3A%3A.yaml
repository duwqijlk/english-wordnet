simpleMeaning: A bushy little tree of the south-east United States keeps part of its leaves over winter;
  its young twigs are hairy, and its leaves taper to a stiff tip.
scope: Also called bluejack oak, this small south-eastern tree keeps some leaves through winter, not the
  large deciduous turkey oak of Europe and Asia Minor.
examples:
- The turkey oak still held some leaves in January.
- She brushed the hairy young shoots of the turkey oak as she passed.
