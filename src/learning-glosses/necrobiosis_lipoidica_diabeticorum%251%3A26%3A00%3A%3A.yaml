simpleMeaning: A skin illness marked by thin shiny patches, found above all on the legs, and often found
  with diabetes.
scope: A skin illness marked by thin shiny patches, found above all on the legs, and often found with
  diabetes, also called necrobiosis lipoidica; not a burn and not a rash that comes and goes.
examples:
- Necrobiosis lipoidica diabeticorum left shiny patches on her legs.
- The doctor saw necrobiosis lipoidica diabeticorum on the patient's shin.
