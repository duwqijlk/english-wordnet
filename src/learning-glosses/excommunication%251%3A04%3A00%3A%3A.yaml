senseId: 'excommunication%1:04:00::'
synsetId: 00209126-n
simpleMeaning: The act of throwing a member out of a church, cutting that person off from its fellowship
  and its rights.
scope: The act of throwing a church member out and cutting that person off from its fellowship; also called
  excision, not a punishment by the state and not a mere quarrel.
examples:
- Excommunication cut him off from his church community.
- The bishop pronounced excommunication on the rebel priest.
