simpleMeaning: A very hard kind of food with no salt in it, once the main food kept on ships.
scope: This is a very hard food with no salt in it, once the main food kept on ships; hardtack and pilot
  biscuit are other names for this sense, not soft fresh bread and not a sweet cake.
examples:
- Pilot bread kept well on long sea trips.
- They ate pilot bread with their soup.
