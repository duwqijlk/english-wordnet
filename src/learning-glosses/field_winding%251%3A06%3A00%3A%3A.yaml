simpleMeaning: A ring of wire round a magnet in a machine, which makes the push that sets up the flow
  of power in the machine
scope: A ring of wire round a magnet in a machine, which makes the push that sets up the flow of power
  in the machine, also called a field coil; not the magnet itself and not the wire that carries power
  out of the machine.
examples:
- The field winding sits round the magnet.
- A burnt field winding stopped the machine.
