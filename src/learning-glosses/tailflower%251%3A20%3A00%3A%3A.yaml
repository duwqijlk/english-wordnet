simpleMeaning: One of many kinds of plant from the warm parts of America, grown for its large bright leaves
  and blooms.
scope: This is a tropical American plant grown for showy leaves and blooms, also called anthurium or tail-flower,
  and not a wild orchid or a garden rose.
examples:
- The tailflower brightened the greenhouse with its leaves.
- Gardeners grow tailflower for its showy foliage.
