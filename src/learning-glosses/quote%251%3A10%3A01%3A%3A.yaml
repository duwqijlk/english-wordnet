simpleMeaning: words that are taken from something a person said or wrote, and are used again by someone
  else
scope: Words taken from what someone said or wrote and used again. Not the mark that goes around such
  words, and not the act of putting marks around words.
examples:
- She started her essay with a quote from a famous writer.
- The article ends with a short quote from the mayor's speech.
