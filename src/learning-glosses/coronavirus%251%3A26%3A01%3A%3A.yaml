simpleMeaning: a disease caused by a virus (a very small thing that lives in the body and makes people
  ill) called SARS-CoV-2, which spread all over the world in 2020
scope: 'Also called corona: this is the disease that spread all over the world in 2020, not a general
  name for any such virus on its own.'
examples:
- Coronavirus made her ill for two weeks in 2020.
- Many schools closed because coronavirus spread so fast.
