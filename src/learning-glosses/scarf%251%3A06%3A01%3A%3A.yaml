simpleMeaning: a joint made by cutting the ends of two pieces of wood or metal so that the ends lock together
  end to end
scope: This is a joint in wood or metal, not the long piece of cloth worn round the neck and not the verb
  that means joining pieces this way.
examples:
- The builder made a scarf to join the two long pieces of wood end to end.
- A strong scarf held the two metal bars together.
