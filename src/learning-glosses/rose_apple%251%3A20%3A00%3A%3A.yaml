simpleMeaning: a plant with a woody stem that grows in the hot East Indies and is kept for the fruit people
  eat
scope: 'Also called a rose-apple tree and jambosa: a plant of the East Indies grown for its fruit, not
  the fruit itself and not a plant of cooler lands.'
examples:
- A rose apple grew in the garden, and we picked its fruit.
- Farmers in the East Indies grow rose apple for the fruit people eat.
