simpleMeaning: a machine that weaves cloth with a pattern worked into the cloth
scope: 'Also called a figure loom: a machine that weaves cloth with a pattern worked into it, not a machine
  that makes plain cloth and not a machine that sews cloth.'
examples:
- The old figured-fabric loom still weaves cloth with patterns in it.
- She learned to work a figured-fabric loom at the mill.
