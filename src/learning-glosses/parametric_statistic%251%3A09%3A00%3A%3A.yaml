simpleMeaning: any figure worked out by ways that take it as given that the facts came from one set pattern
scope: Any figure worked out by ways that take it as given that the facts came from one set pattern; not
  a figure worked out without such a guess and not the raw facts themselves.
examples:
- The researchers chose a parametric statistic because the data came from one set pattern.
- A parametric statistic takes it as given that the facts follow one set pattern.
