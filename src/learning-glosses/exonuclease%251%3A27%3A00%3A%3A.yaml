simpleMeaning: an enzyme that frees one building block at a time, in order, from one end of a strand of
  DNA or RNA
scope: This is an enzyme that trims a DNA or RNA strand one unit at a time; not an enzyme that cuts inside
  a strand and not the strand itself.
examples:
- The exonuclease removed one nucleotide at a time from the end of the strand.
- Scientists used an exonuclease to trim the DNA strand.
