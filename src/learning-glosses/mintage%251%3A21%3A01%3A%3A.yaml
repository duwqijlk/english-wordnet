simpleMeaning: For making a coin, the place that makes coins gets a sum from the government
scope: A sum the government pays for making a coin, not the cost of the metal and not the coin itself.
examples:
- The mintage on the new coins was paid from the treasury.
- The government set the mintage for each gold coin.
