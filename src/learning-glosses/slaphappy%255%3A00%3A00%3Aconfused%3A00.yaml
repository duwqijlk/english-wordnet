simpleMeaning: Dazed from blows over and over, or as from blows.
scope: This sense is also called silly, for being dazed from blows over and over, or as from blows, where
  silly is not able to think clearly because of being hit again and again, or as if you had been hit again
  and again.
examples:
- He was slaphappy, dazed from blows.
- She was slaphappy, as from blows.
