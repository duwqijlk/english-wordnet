simpleMeaning: An upright shrub or small tree of Australia and northern New Guinea, with leaves that spread
  like fingers from one point and stay green all year.
scope: 'Also called umbrella tree or Brassaia actinophylla: an upright evergreen shrub or small tree with
  leaves that spread like fingers from one point, not a tall forest tree and not a plant with single plain
  leaves.'
examples:
- Schefflera actinophylla grows in the north of Australia.
- The leaves of Schefflera actinophylla spread like fingers from one point.
