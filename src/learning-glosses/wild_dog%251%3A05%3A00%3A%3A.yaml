simpleMeaning: Thought to look like the tame kind kept at home, this untamed mammal of the Canidae group
  is one of many kinds, set apart from jackals and wolves.
scope: This untamed mammal of the Canidae group looks like the tame kind kept at home, yet it is neither
  a jackal nor a wolf.
examples:
- The wild dog looked like the tame kind kept at home, but it was not a jackal or a wolf.
- These wild dogs live untamed, though they look like the tame kind kept at home.
