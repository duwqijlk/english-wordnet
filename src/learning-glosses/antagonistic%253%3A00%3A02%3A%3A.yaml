simpleMeaning: especially of drugs or muscles, working against each other so that one stops or weakens
  what the other does
scope: 'Also called incompatible: this is about drugs or muscles that work against each other. It is not
  about a person who feels hate or shows strong dislike.'
examples:
- The two drugs have an antagonistic effect, so they should not be taken together.
- These muscles work in an antagonistic way, with one pulling against the other.
