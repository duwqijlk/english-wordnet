simpleMeaning: A level tube with small holes bored along its whole length so that it gives out a fine
  spray of water
scope: A level tube with small holes along its whole length that gives out a fine spray of water, not
  a solid rod and not a tube that pours out a single stream.
examples:
- The sparge pipe runs along the tank, spraying water through its small holes.
- We fitted a sparge pipe to spread the water in a fine spray.
