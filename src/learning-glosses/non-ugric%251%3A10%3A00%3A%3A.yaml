simpleMeaning: One of two arms of a family of northern tongues; a family of tongues covering Finnish and
  Estonian, but leaving out Hungarian
scope: 'Also called Baltic-Finnic, Fennic, and Finnic: this is one arm of a family of northern tongues,
  the arm that covers Finnish and Estonian, not the arm that covers Hungarian or a single tongue such
  as Finnish alone.'
examples:
- Non-Ugric tongues cover Finnish and Estonian, but not Hungarian.
- Finnish is a Non-Ugric tongue of the north.
