simpleMeaning: A big evergreen tree of tropical America that gives a chewing gum base and fruit good to
  eat, sometimes put in its own genus.
scope: A big evergreen tree of tropical America, also called sapodilla, sapodilla tree and Manilkara zapota;
  its nearest kin are other tropical trees that give fruit good to eat.
examples:
- Achras zapota grew tall behind the house and bore sweet fruit.
- We tapped Achras zapota for the gum base used in chewing gum.
