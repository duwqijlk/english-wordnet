simpleMeaning: A blood test that finds syphilis, using a test that fixes a blood part to the germ to find
  antibodies; a positive result means the infection is there.
scope: A blood test for syphilis, also called Wasserman reaction and Wassermann test; not other blood
  tests and not a test for other infections.
examples:
- Doctors once relied on the Wassermann to find syphilis.
- A positive Wassermann meant the patient needed treatment.
