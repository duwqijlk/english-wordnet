simpleMeaning: The healing process in which the edges of a wound grow together, or the ends of a broken
  bone knit back together.
scope: Not a trade association or political alliance, and not a design on a flag.
examples:
- The X-ray showed complete union of the broken bone after eight weeks.
- Doctors watched the wound for signs of union along its edges.
