simpleMeaning: to say no to something completely, in a plain and blunt way
scope: Saying no completely, in a plain and blunt way, not driving a person off by force and not filling
  someone with disgust.
examples:
- She repelled his offer flatly, without a soft word.
- He repelled the suggestion bluntly, leaving no room for doubt.
