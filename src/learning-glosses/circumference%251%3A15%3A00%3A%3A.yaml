simpleMeaning: A line that goes all the way around an area or a thing, and marks its edge
scope: The line around the edge of an area or thing, also called circuit; not the area inside it and not
  a straight line across it.
examples:
- He walked around the whole circumference of the field.
- We measured the circumference of the tree with a string.
