simpleMeaning: a bush from South America that stays green through the year, with showy orange flowers
  like trumpets; grown for its looks, in gardens or indoors
scope: A South American evergreen bush with bright orange trumpet-shaped flowers, also called fire-bush
  or marmalade bush, not the Eurasian plant whose leaves turn purple-red in autumn.
examples:
- A fire bush in the garden was covered in orange flowers.
- They grow a fire bush indoors for its bright flowers.
