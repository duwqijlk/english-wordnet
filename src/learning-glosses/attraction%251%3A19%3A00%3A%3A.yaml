simpleMeaning: the pull that makes one thing draw another thing toward it
scope: The pull that makes one thing draw another toward it, not the power of a thing to catch people's
  interest and not a performer who pulls in crowds.
examples:
- The attraction between the magnet and the iron was strong.
- Gravity is the attraction that holds the moon near the earth.
