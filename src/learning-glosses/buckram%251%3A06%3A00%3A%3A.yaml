simpleMeaning: Made stiff with glue, this rough cotton cloth binds books and gives clothes a firm shape.
scope: This rough cotton cloth is used to bind books and to give clothes a firm shape, and it is not the
  glue that stiffens it.
examples:
- The binder covered the book in buckram to keep its spine firm.
- She sewed a strip of buckram inside the collar to stiffen it.
