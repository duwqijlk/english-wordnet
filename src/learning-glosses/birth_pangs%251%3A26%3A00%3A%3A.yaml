simpleMeaning: Pains that come again and again at even times while a baby is being born.
scope: Pains that come again and again at even times while a baby is being born; labor pains and labour
  pains are other names for this sense, not a single sharp pain and not pain after the baby is born.
examples:
- Her birth pangs came every five minutes.
- The birth pangs grew stronger through the night.
