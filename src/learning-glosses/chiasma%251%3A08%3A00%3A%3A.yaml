simpleMeaning: two paths that meet and cross each other in the shape of the letter X
scope: 'Also called chiasm and decussation: two paths that meet and cross in the shape of the letter X,
  not a road crossing and not a crossing of two lines on a page.'
examples:
- The chiasma sits at the base of the brain.
- At the chiasma, the nerve tracts cross over each other.
