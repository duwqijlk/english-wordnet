simpleMeaning: a person who acts and reacts in a fixed way, with no thought, feeling, or interest
scope: Also called zombie or zombi, this is a person who acts without thought or feeling, not a machine
  that moves on its own.
examples:
- After months of the same dull work, he worked like an automaton, doing each task without thinking.
- She answered every question like an automaton, in the same flat voice with no feeling.
