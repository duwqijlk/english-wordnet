simpleMeaning: In chemistry, the study of how drink is made by fermentation, the change that turns sugar
  into wine, beer, or spirits
scope: This is the study of how drink is made by fermentation, also called zymology; not the making of
  wine itself and not the study of all chemistry.
examples:
- The old zymurgy manual describes the brewing of ale step by step.
- He studied zymurgy before opening his own small distillery.
