simpleMeaning: The fifth and top stuff after air and earth and fire and water, once held to be the stuff
  making all sky bodies.
scope: The fifth and top stuff after air and earth and fire and water, once held to be the stuff making
  all sky bodies; also called ether; not the cleanest and most packed heart of a thing.
examples:
- Their quintessence shone at dawn.
- The quintessence was taught at noon.
