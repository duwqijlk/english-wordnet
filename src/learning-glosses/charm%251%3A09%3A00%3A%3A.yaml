simpleMeaning: In physics, one of the six kinds of quark (a very small part inside matter), the third
  heaviest kind of them all
scope: This physics sense is about a tiny part of matter. It is not about a person's power to please people,
  and not about magic words.
examples:
- In physics lessons, charm is listed as one of the six kinds of quark.
- Charm is the third heaviest quark, heavier than three of the other kinds.
