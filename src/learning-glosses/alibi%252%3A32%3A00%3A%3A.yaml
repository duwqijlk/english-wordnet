simpleMeaning: to show that a person could not have done a crime, by proving where they were when it happened
scope: To clear a person of blame by showing where they were, not the excuse itself.
examples:
- His friends could alibi him for the night of the robbery.
- The ticket stub helped to alibi her at the time of the crime.
