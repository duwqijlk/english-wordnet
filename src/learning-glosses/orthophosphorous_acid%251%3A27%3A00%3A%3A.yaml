simpleMeaning: A clear or yellow sour liquid (H3PO2) with one part that can join with a base
scope: This sour liquid, also called hypophosphorous acid and phosphorous acid, is clear or yellow with
  one part that joins with a base, not a sour liquid with two such parts and not one that eats away at
  skin.
examples:
- The lab stored orthophosphorous acid in a sealed glass bottle.
- Orthophosphorous acid can be clear or pale yellow in colour.
