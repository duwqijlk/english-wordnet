simpleMeaning: Blood tubes that serve the air tubes of the lungs and empty into the unpaired blood tube
  of the chest.
scope: Blood tubes that serve the air tubes of the lungs; bronchial vein is another name for this sense;
  not blood tubes of the heart and not tubes of the throat.
examples:
- The vena bronchialis serves the air tubes of the lungs.
- Blood from the vena bronchialis flows into the unpaired chest tube.
