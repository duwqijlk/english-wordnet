simpleMeaning: how much the heat of a place changes as you move from one spot to another, in particular
  as you go higher
scope: How heat changes over distance, in particular with height; not the heat of one place at one time.
examples:
- The temperature gradient is steepest near the top of the hill.
- Pilots watch the temperature gradient as they climb.
