simpleMeaning: a green part of a plant that has small parts set like feathers along a stem, as in ferns
scope: A green part of a plant with small parts set like feathers along a stem, as in ferns, not a plain
  part with one flat blade and not a part with small parts set in pairs.
examples:
- The fern's bipinnate leaf splits into small parts set like feathers.
- A bipinnate leaf has its small parts set along a stem, as in ferns.
