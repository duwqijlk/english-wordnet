simpleMeaning: A night animal of the grasslands of Africa that digs burrows and eats termites, the only
  living kind of its group.
scope: Also called an aardvark or an ant bear; a night animal of African grasslands, not the spiny Australian
  kind, the New Guinea kind, or the scaly kind.
examples:
- The anteater dug for termites after dark.
- An anteater can eat thousands of termites in one night.
