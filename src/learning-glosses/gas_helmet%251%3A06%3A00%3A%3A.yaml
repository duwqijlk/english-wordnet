simpleMeaning: Poison fumes cannot reach the lungs when this mask with a filter covers the face.
scope: Also called a respirator or a gasmask, this mask with a filter guards the face and lungs against
  poison fumes.
examples:
- He put on his gas helmet before going into the smoke.
- The gas helmet kept the bad air from her lungs.
