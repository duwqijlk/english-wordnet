simpleMeaning: in a way that shines or gives off much light
scope: 'Another name for bright: in a way that shines with much light. It is not in a happy, cheerful
  way, and not in a clever way.'
examples:
- The sun shone brightly over the sea.
- The room was brightly lit by large windows.
