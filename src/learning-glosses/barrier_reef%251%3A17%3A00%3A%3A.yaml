simpleMeaning: a long wall of coral in the sea, lying close to the land and running the same way as the
  shore
scope: A long coral ridge in the sea near the shore, not a ring of coral round a lagoon and not a reef
  that joins the land.
examples:
- The barrier reef shelters the coast from big waves.
- We sailed along the barrier reef for miles.
