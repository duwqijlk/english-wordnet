simpleMeaning: good enough to be chosen, especially as a husband or wife
scope: 'Also called suitable and also called desirable: good enough to be chosen, especially as a husband
  or wife; not the wider sense of being valuable and deserving respect in general.'
examples:
- Her parents saw him as a worthy husband for their daughter.
- The family thought the young woman worthy and a good wife for their son.
