simpleMeaning: In anatomy, a word for things belonging to the chin or the middle of the lower jaw, such
  as the nerve and opening found there.
scope: About the chin and lower jaw in people, not about the mind, and not about the similar part in insects
  or mollusks.
examples:
- The mental nerve supplies feeling to the skin of the chin.
- Surgeons marked the mental foramen before inserting the implants.
