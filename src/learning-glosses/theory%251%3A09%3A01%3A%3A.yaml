simpleMeaning: A first, unproven idea about how something in nature works, which has not been checked
  but could explain certain facts if it proved true.
scope: This is not an accepted, well-tested framework; it is still only a possible explanation.
examples:
- His theory that the marks were made by children has not been proved.
- Scientists have a working theory about why the bees are disappearing, but the evidence is still thin.
