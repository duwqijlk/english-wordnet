simpleMeaning: A sonogram, a picture of a body part made by bouncing high sounds off it, often used to
  watch a baby before birth or to study the body's parts.
scope: Also called echography, sonography, or ultrasonography; a picture made from sound, not very high
  sounds themselves.
examples:
- The doctor ordered an ultrasound to check the baby's growth.
- An ultrasound showed the stone in her kidney.
