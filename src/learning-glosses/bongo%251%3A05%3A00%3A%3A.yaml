simpleMeaning: a large forest animal of central Africa, a kind of antelope, with a reddish-brown coat,
  white stripes, and horns that turn in a spiral
scope: This is the large forest animal with white lines and horns that turn in a spiral; it is not a small
  drum played with the hands.
examples:
- A bongo stood among the trees, its white stripes clear against its brown coat.
- We saw a bongo with long spiral horns in the forest.
