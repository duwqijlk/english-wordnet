simpleMeaning: What happens when liquid is thrown and lands on a surface
scope: The act of throwing liquid onto something; not making something dirty with liquid, not a small
  amount of liquid, and not the sound liquid makes when it hits something.
examples:
- One big splash sent water all over the kitchen floor.
- His splash with the bucket left the whole step wet.
