simpleMeaning: Rock from deep down pushes up and breaks through the brittle layers above it, making a
  rounded mound
scope: Geologists give this name to the dome that forms when rock from below pushes up and breaks through
  the brittle layers above it.
examples:
- The diapir pushed up through the brittle layers above it.
- Geologists studied the diapir to see how the rock had moved upward.
