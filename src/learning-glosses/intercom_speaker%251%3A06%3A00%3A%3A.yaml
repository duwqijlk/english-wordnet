simpleMeaning: the part of a two-way talking system or public address system that gives out sound so people
  can hear a voice
scope: The part of a two-way talking system or public address system that gives out sound; not the whole
  system and not the part that picks up sound.
examples:
- The intercom speaker in the hall crackled when the office called.
- The nurse's voice came through the intercom speaker by the bed.
