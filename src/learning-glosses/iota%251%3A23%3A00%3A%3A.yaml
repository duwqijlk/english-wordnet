simpleMeaning: a very small amount, so small you can hardly see it or find it
scope: 'Also called whit, shred, smidge, smidgen, smidgeon, tittle and smidgin: this is a very small amount,
  not a large amount or a whole thing.'
examples:
- There is not an iota of truth in what he said.
- She did not show an iota of fear.
