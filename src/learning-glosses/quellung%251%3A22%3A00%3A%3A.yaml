simpleMeaning: After a germ-fighting stuff made by the body meets it, the coat round a tiny living thing
  swells, and that swelling lets tests tell one living thing from another.
scope: Quellung reaction is another name for this swelling, used in tests that tell one tiny living thing
  from another.
examples:
- The test called quellung helped name the germ.
- Pneumococcus quellung showed the swollen coat round the germ.
