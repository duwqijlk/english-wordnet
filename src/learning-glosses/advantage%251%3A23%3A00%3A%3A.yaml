simpleMeaning: in tennis, the point won immediately after the score is tied at 40-40, which puts the winner
  one point away from winning the game
scope: This is the tennis scoring position after deuce, not a general benefit or a better chance in life.
examples:
- At 40-40, she won the next point and took the advantage.
- He lost the advantage when he double-faulted.
