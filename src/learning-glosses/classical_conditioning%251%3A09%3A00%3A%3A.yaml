simpleMeaning: A learning process where a meaningless signal is repeatedly paired with one that triggers
  a reflex, whether or not that response appears, until the signal alone brings it.
scope: This is the reflex-based pairing made famous by Pavlov, not the reward-and-punishment learning
  called operant training.
examples:
- Pavlov's dogs showed classical conditioning when they began salivating at the sound of a bell.
- Through classical conditioning, the smell of the clinic alone could make her anxious.
