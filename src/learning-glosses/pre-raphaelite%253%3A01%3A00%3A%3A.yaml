simpleMeaning: To do with the painters and writers of the group named for Raphael, or like their work.
scope: This word is used for things of that group of painters and writers, not for a member of the group.
examples:
- The Pre-Raphaelite painters are well known.
- She loves Pre-Raphaelite art.
