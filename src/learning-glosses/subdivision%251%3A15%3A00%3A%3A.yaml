simpleMeaning: an area of land made up of smaller pieces of land, each split off from one larger piece
scope: This is an area of land split into smaller pieces of land. It is not a part of a book or piece
  of music, and not the act of splitting something up.
examples:
- The new subdivision has fifty houses on small pieces of land.
- They built a subdivision on the old farm land outside town.
