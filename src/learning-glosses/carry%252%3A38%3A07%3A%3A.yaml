simpleMeaning: Follow a scent trail, or act as the one that retrieves and brings things back.
scope: A hunting animal following a scent trail or doing the retrieving; not a person moving a load, not
  a bill passing, not arithmetic columns, not covering for a teammate, and not fitting a sail.
examples:
- The dog was taught to fetch and carry.
- The old hound carried the scent across the field.
