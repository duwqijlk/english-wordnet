scope: 'Also called earth wax, mineral wax, ozocerite, and ozokerite: a waxy mineral found with petroleum,
  not beeswax and not a man-made wax.'
examples:
- Ader wax was once used to make candles.
- Miners dug ader wax from beds near the oil wells.
