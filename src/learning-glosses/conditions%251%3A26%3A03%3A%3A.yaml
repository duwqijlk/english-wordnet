simpleMeaning: The situation and surroundings that affect how well someone lives or feels.
scope: This is not the setting that affects how a process or experiment turns out; it is about the things
  that affect a person's life and well-being.
examples:
- Many families are living in poor conditions.
- The workers demanded better working conditions.
