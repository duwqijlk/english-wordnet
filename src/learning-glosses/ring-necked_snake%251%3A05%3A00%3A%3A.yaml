simpleMeaning: any of many small harmless North American legless creatures with a yellow or orange band
  round the neck
scope: Not a large North American snake, and not a snake with no neck band; also called ring snake and
  ringneck snake.
examples:
- A ring-necked snake slipped under the log.
- The ring-necked snake showed a bright yellow band.
