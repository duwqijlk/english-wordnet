simpleMeaning: In Judaism, the honor of being called up to the desk in a synagogue to read from the Torah,
  the Jewish holy book
scope: The honor of being called up to read in a synagogue, not the move of Jewish people to live in Israel.
examples:
- He was called on for an aliyah at his son's bar mitzvah.
- She received an aliyah and read from the Torah.
