simpleMeaning: what makes one person different from others, seen as staying the same over time
scope: What makes a person who they are over time, not a thing in maths that leaves a number unchanged.
examples:
- Losing his job shook his sense of identity.
- Her identity grew from her family, her work, and her beliefs.
