simpleMeaning: In astronomy, how bright a star would look if it were seen from a set distance of about
  thirty-three light years from the earth
scope: This is how bright a star would look from a set distance, not how bright it looks from the earth
  and not its real size.
examples:
- The absolute magnitude of the star was worked out from its distance.
- Two stars can look the same from here but have a very different absolute magnitude.
