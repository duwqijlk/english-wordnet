simpleMeaning: very bad in a way that goes against what is right; so bad that it makes people feel great
  fear
scope: 'Also called horrid, horrific and outrageous: very bad and against what is right, making people
  feel great fear; not just very ugly to look at.'
examples:
- The hideous cruelty to children shocked the whole town.
- They kept people in hideous conditions in the prison camp.
