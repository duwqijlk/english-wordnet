simpleMeaning: A yellow salt made when salts of uranium meet nitric acid.
scope: A yellow salt made from uranium salts and nitric acid, not a white salt and not a salt made with
  oxalic acid.
examples:
- Uranyl nitrate is a yellow salt made from uranium salts and nitric acid.
- They made more uranyl nitrate by mixing uranium salts with nitric acid.
