simpleMeaning: A socket, often used for modems, mice, and some printers, that sends data one bit at a
  time
scope: A socket that sends data one bit at a time, not a socket that sends many bits at once and not a
  socket for power.
examples:
- The modem plugs into the serial port.
- An old serial port sends data one bit at a time.
