senseId: 'intermittency%1:07:00::'
synsetId: 04777959-n
simpleMeaning: The quality of a thing that keeps stopping for a time and then starting again, over and
  over.
scope: When a thing stops and starts again over and over, also called intermittence; not something that
  goes on without a break.
examples:
- The intermittency of her headaches meant good days and bad days.
- The intermittency of the power supply forced us to keep candles ready.
