simpleMeaning: A member of a dead North American Indian people who lived in north California, on lands
  by the Yuba and Feather rivers
scope: A member of a dead North American Indian people who lived in north California, on lands by the
  Yuba and Feather rivers; a person of that people, not the people as a whole.
examples:
- He was a Yana who lived by the Feather River.
- The old Yana man remembered the lands by the Yuba River.
