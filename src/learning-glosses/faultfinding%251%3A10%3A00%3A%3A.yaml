simpleMeaning: Criticism that goes on and on, over small things, without good reason.
scope: Criticism that goes on and on over small things without good reason, also called carping; not the
  habit of judging others by one's own views, and not the habit of picking out faults.
examples:
- His faultfinding wore down everyone in the office.
- The review was little more than faultfinding.
