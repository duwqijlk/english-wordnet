simpleMeaning: A tall upright post shaped like a tube that stands on its own and holds up nothing, as
  a monument does
scope: 'Also called column: a free-standing post, not one that holds up a building and not a tall shape
  like a tower of smoke.'
examples:
- A tall pillar of stone marks the place where the battle was fought.
- The pillar stands alone in the middle of the square.
