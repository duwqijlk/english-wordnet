simpleMeaning: Any weapon that can be used in warfare with germs or other living things.
scope: For a germ or virus feared as a weapon of war, banned by treaty.
examples:
- They feared the smallpox virus might be used as a bioweapon.
- The treaty bans the making of any bioweapon.
