simpleMeaning: People can eat the small lumps under the ground of this long-lived plant found in many
  places, lumps shaped like the hard fruit it is named for.
scope: Also called nut grass, a nut sedge or nutsedge, this long-lived plant is found in many places and
  has small lumps under the ground, shaped like the hard fruit it is named for, that people can eat.
examples:
- The nutgrass had small lumps under the ground.
- The small lumps of nutgrass were good to eat.
