simpleMeaning: One of several kinds of long-legged hawk in South and Central America that eats dead animals.
scope: One of several kinds of long-legged hawk in South and Central America that eats dead animals, not
  a falcon and not a vulture.
examples:
- A caracara walked on long legs across the field, looking for dead animals.
- Caracaras eat dead animals left in the fields.
