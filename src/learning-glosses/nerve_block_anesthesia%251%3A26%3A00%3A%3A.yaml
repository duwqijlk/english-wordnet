simpleMeaning: Loss of feeling in a part of the body fed by one cord that carries signals, brought on
  by a numbing drug put on that cord.
scope: Loss of feeling in a part of the body fed by one cord that carries signals, brought on by a numbing
  drug put on that cord; also called block anaesthesia, block anesthesia, conduction anaesthesia, conduction
  anesthesia, and nerve block anaesthesia.
examples:
- The surgeon chose nerve block anesthesia for the hand operation.
- With nerve block anesthesia, the leg felt nothing at all.
