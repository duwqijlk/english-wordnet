simpleMeaning: Fuel turned to gas runs through these pipes from the mixing part to the round chambers
  of an engine.
scope: This is the set of pipes that takes fuel turned to gas from the mixing part to an engine's round
  chambers, not the mixing part itself.
examples:
- Fuel turned to gas passed through the inlet manifold.
- The inlet manifold joins the mixing part to the engine.
