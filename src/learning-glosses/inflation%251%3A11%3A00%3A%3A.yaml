simpleMeaning: In cosmology, a short growth of the universe that gets faster and faster, faster than light,
  thought to have happened just after the big bang
scope: In cosmology, a short, very fast growth of the universe just after the big bang; not a rise in
  prices, and not a thing made vain and puffed up.
examples:
- Inflation in the early universe lasted only a tiny part of a second.
- Scientists use inflation to explain why the universe looks so even.
