simpleMeaning: a song sung by the men who row the long flat boats of Venice while out on the water
scope: 'Also called a barcarolle: a song sung on a boat, not a song sung on land and not a boat itself.'
examples:
- The gondolier sang a soft barcarole as the boat moved through the canals.
- We heard a barcarole drift over the water from a passing boat.
