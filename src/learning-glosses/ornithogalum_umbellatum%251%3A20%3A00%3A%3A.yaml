simpleMeaning: A common herb of the Old World with grass-like leaves and bunches of star-shaped white
  blooms with green stripes, now at home in the east of the United States.
scope: Also called starflower, sleepy dick and summer snowflake; this common Old World herb is told apart
  by grass-like leaves and bunches of star-shaped white blooms with green stripes, and it now grows wild
  in the east of the United States.
examples:
- Ornithogalum umbellatum opened its white star-shaped flowers in the morning.
- Ornithogalum umbellatum now grows wild in the east of the United States.
