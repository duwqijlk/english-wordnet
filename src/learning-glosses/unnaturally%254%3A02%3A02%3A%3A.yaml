simpleMeaning: in a way that goes against what is natural
scope: In a way that goes against what is natural, not in the ordinary way things happen.
examples:
- His other arm lay across his chest, unnaturally, as if placed there deliberately, for a purpose.
- She smiled unnaturally at the camera.
