simpleMeaning: Two teams of six skaters each chase a flat round puck on ice, trying to knock it into the
  goal at the other end with bent sticks.
scope: Also called hockey and ice hockey, this is a game on ice with six skaters a side, not field hockey
  and not a race on ice.
examples:
- The hockey game went into overtime after a late goal.
- We watched the hockey game from seats behind the goal.
