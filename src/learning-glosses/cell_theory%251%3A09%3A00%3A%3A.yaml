simpleMeaning: The claim that all living things are built from cells, each cell doing work of its own,
  first put forward in 1838 by Matthias Schleiden and Theodor Schwann.
scope: Also called cell doctrine; the idea that cells are the basic parts of all living things, not a
  theory about how new cells are made.
examples:
- The cell theory holds that every living thing is made of cells.
- Under the cell theory, a cell is the smallest unit of life.
