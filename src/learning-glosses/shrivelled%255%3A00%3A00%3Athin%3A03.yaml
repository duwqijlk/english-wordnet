simpleMeaning: thin and with skin in lines, after the body has grown smaller, as from age or illness
scope: 'Also called shriveled, shrunken, withered, wizen and wizened: thin and lined from age or illness,
  not the sense of having grown weaker or less in power or effect.'
examples:
- The old man's shrivelled hands were thin and lined.
- Her shrivelled skin showed her age and long illness.
