simpleMeaning: A group of the tongues of the first peoples of America, a name made up by an American man
  who studied peoples, Edward Sapir.
scope: Also called Athabaskan, Athapascan, Athapaskan, and Athapaskan language; a group of tongues, not
  the people who speak them.
examples:
- Athabascan is a group of tongues of the first peoples of America.
- Edward Sapir gave the name Athabascan to the group of tongues.
