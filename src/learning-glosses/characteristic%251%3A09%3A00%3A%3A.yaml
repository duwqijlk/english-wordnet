simpleMeaning: A clear mark or quality that stands out in a thing or person and helps you tell it apart.
scope: A clear mark or quality that stands out in a thing or person; also called a feature, not the whole-number
  part of a logarithm and not a measured property of a device.
examples:
- Her quick laugh is one of her best characteristics.
- Patience is a characteristic he shows every day.
