simpleMeaning: a machine part that a person moves to join gears together or take them apart
scope: Also called shifter and gearstick, this is the part used to join or separate gears; it is not the
  gears themselves and not the change of speed itself.
examples:
- She moved the gearshift into second gear.
- His hand rested on the gearshift as he waited to drive off.
