simpleMeaning: ground that farmers have plowed and sown to grow crops on
scope: 'Also called farmland, ploughland, cultivated land, plowland, tillage and tilled land: ground farmers
  have plowed and sown for crops, not land left wild.'
examples:
- The tilth was dark and rich after the spring plowing.
- Good tilth makes sowing much easier.
