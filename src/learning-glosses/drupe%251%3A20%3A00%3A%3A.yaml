simpleMeaning: A fruit with soft flesh around one hard seed that does not split open when ripe, such as
  a peach, plum, cherry, elderberry, olive, almond or jujube.
scope: This is the fruit type with soft flesh and one hard seed inside; stone fruit is another name for
  it, and it is not a berry or a dry fruit that splits open.
examples:
- 'A peach is a drupe: its soft flesh surrounds a single hard pit.'
- The garden produced a fine crop of drupes, from plums to olives.
