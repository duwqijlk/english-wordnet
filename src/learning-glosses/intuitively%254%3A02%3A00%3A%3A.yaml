simpleMeaning: in a way that comes from a quick feeling about what is true or what to do, without thinking
  about it step by step
scope: This is about knowing or choosing by a quick feeling, not by thinking step by step, by proof, or
  by learned rules.
examples:
- She knew intuitively that her friend was upset, even before he spoke.
- He intuitively chose the right path without looking at the map.
