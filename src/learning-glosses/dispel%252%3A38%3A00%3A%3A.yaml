simpleMeaning: to force something to go away, whether it is a real thing or an idea or feeling
scope: This is about making a person, thing, idea or feeling go away; it is not about scattering things
  in many directions, and not about proving an idea false.
examples:
- The police dispelled the crowd outside the gate.
- Her kind words dispelled his fears.
