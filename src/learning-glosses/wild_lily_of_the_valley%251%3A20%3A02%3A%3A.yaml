simpleMeaning: Found widely in the northern parts of the Old and New Worlds, this evergreen bears round
  leaves and very sweet-smelling pale cream flowers.
scope: This evergreen, found widely in the northern parts of the Old and New Worlds, bears round leaves
  and very sweet-smelling pale cream flowers, not the North American kind with small pink bell-shaped
  flowers and oblong leaves.
examples:
- Wild lily of the valley grew in the northern parts of the Old and New Worlds.
- Wild lily of the valley bore pale cream flowers.
