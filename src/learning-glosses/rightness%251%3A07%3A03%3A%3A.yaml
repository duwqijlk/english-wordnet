senseId: 'rightness%1:07:03::'
synsetId: 04721129-n
simpleMeaning: the quality of being correct and fitting well when judged by ideas of beauty and good taste
scope: This sense, also called nicety, is about being correct in beauty and taste. It is not the sense
  that means doing what is right in how you act.
examples:
- She chose each word for its rightness in the poem.
- The rightness of the colours made the painting feel calm and complete.
