simpleMeaning: the thing hit in badminton, a small ball of cork or rubber with feathers on top
scope: Also called a bird, a shuttle, or a shuttlecock, this is the feathered thing hit in badminton,
  not a score in golf that is one under the usual score for a hole.
examples:
- She hit the birdie over the net with a light touch.
- The birdie landed just inside the back line.
