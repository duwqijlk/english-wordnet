simpleMeaning: the act of making things follow one fixed set of rules
scope: The act of making things follow one fixed set of rules; standardization is another name for this
  sense; not the checking of a measuring tool, and not a state where a rule is already in place.
examples:
- Standardisation of the forms made the work much easier.
- The standardisation of weights and measures took years.
