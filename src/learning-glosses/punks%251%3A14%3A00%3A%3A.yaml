simpleMeaning: A late-1970s youth movement built around raw, fast rock music, reacting against the hippy
  scene, with deliberately shocking clothes and brightly dyed hair, sometimes spiked.
scope: This is the 1970s youth subculture as a whole, not one rebellious young person.
examples:
- The punks who filled the clubs in 1977 wore bin bags and safety pins.
- Punks dyed their hair bright pink and cut it into spikes.
