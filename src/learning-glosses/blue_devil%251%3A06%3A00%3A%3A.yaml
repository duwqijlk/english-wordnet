simpleMeaning: A drug made by joining amobarbital with sodium that quiets the nerves and brings on sleep,
  given to people who cannot rest.
scope: This drug is also called blue, amobarbital sodium, and blue angel, and it is not the prickly weed
  of the same name.
examples:
- The doctor gave a blue devil to help the patient sleep.
- A blue devil can help a restless patient drift off to sleep.
