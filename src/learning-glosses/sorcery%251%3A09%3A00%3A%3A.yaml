simpleMeaning: the belief that words or acts of magic can call on hidden powers or bad spirits to make
  strange things happen
scope: Belief in magic that calls on hidden powers, not the magic acts themselves and not a trick done
  for show.
examples:
- In old stories, sorcery could turn a man into a beast.
- The villagers feared sorcery and blamed it for the bad harvest.
