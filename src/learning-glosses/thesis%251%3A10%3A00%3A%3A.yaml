simpleMeaning: a claim not yet shown to be true, put forward as the starting point of an argument
scope: A starting claim for an argument, not a finished research paper and not a belief held for its own
  sake.
examples:
- His thesis was that cities grow because trade grows.
- She began her talk with a thesis no one had yet proved.
