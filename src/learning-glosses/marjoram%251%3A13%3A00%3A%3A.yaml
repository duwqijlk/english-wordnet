simpleMeaning: For meat, birds, stews, soups, and omelets, a herb gives sharp-tasting leaves to season
  the dish.
scope: Also called oregano, it is the herb whose sharp-tasting leaves season meat, birds, stews, soups,
  and omelets.
examples:
- Marjoram went into the stew for a sharper taste.
- Marjoram leaves went into the omelet.
