simpleMeaning: A slow wearing away of the smooth pads in the joints, the most common kind of joint disease,
  most often starting after middle age
scope: 'Also called degenerative arthritis or degenerative joint disease: a slow wearing away of the smooth
  pads in the joints, most often after middle age, not a sudden injury and not a swelling caused by germs.'
examples:
- Osteoarthritis made her knees ache after middle age.
- His osteoarthritis has worn away the smooth pads in his knees.
