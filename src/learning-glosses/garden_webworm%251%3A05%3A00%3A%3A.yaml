simpleMeaning: A kind of small moth caterpillar, Loxostege similalis, that spins webs on plants.
scope: This is a kind of small moth caterpillar that spins webs on plants; not other web-spinning caterpillars,
  and not a cutworm that cuts stems at the ground.
examples:
- The garden webworm spun webs over the beet leaves.
- Garden webworms ate holes in the young plants.
