senseId: cursory%5:00:00:careless:00
synsetId: 00313032-s
simpleMeaning: done too quickly and without care for small points, so it is not done fully and carefully
scope: Also called passing, casual, superficial and perfunctory; this means done quickly without full
  care, not done slowly and with care for every small point.
examples:
- He gave the report only a cursory look and missed the main error.
- Her cursory check of the house missed the broken roof.
