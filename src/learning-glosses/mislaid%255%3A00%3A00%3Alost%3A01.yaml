simpleMeaning: lost for a short time, especially when put in a place that is not usual or that you have
  forgotten
scope: 'Also called misplaced: lost for a short time after being put in an odd or forgotten place, not
  lost for good.'
examples:
- I could not find my mislaid keys, but they turned up in my coat.
- The mislaid letter was later found under a pile of books.
