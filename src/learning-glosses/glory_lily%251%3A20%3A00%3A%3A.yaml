simpleMeaning: 'Any plant of a tropical African and Asian genus: a long-lived climbing herb with tendrils
  at its leaf tips, striking yellow, red or purple flowers, and entirely poisonous parts.'
scope: This is the climbing, poisonous tropical plant also called gloriosa and creeping lily; it is not
  a garden lily grown for cut flowers.
examples:
- A glory lily in full bloom covered the garden wall with red and yellow.
- Keep children away from the glory lily, because all of it is poisonous.
