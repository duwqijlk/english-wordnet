simpleMeaning: very great in size, amount or degree, and especially in how much it covers or how far it
  reaches
scope: 'Also called huge and vast: very great in size, amount or degree, not just big in a usual way.'
examples:
- The house stands in an immense garden that goes on for miles.
- They spent an immense amount of money on the new road.
