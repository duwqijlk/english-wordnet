simpleMeaning: a rude way of behaving that shows no respect for others
scope: Also called rudeness, this is a rude way of behaving in general, not one single act that is not
  polite and hurts someone's feelings.
examples:
- His discourtesy in the meeting shocked everyone; he cut in and spoke to her with no respect.
- He answered with cold discourtesy and turned away.
