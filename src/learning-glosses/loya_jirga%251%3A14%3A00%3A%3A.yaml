simpleMeaning: A big meeting of leaders that settles fights over how the country is run, or other problems
  of the whole country.
scope: A big meeting of leaders that settles fights over how the country is run or other problems of the
  whole country, not a standing parliament.
examples:
- The president called a Loya Jirga to settle the dispute.
- A Loya Jirga met to resolve the country's problems.
