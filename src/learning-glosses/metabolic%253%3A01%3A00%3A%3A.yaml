simpleMeaning: to do with the way a living thing turns food and other things into energy and the parts
  it needs to live
scope: This describes a link to the inner changes that keep a living thing alive and make energy, not
  eating or breathing on their own.
examples:
- Your metabolic rate is how fast your body uses energy.
- Exercise can raise your metabolic rate for a short time.
