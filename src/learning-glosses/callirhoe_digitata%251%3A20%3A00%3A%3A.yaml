simpleMeaning: A poppy mallow that lives for many years, from the southern plains states of the United
  States, with rose-red or rose-purple flowers.
scope: This is a poppy mallow of the southern plains states that lives many years and has rose-red or
  rose-purple flowers; fringed poppy mallow is another name for it, not other poppy mallows from other
  parts of the country.
examples:
- Callirhoe digitata bloomed rose-red across the dry plains.
