simpleMeaning: a place where people buy and sell deals to hand over goods at a set later time
scope: 'Also called a futures market and a forward market: a place where deals for goods to be handed
  over later are bought and sold, not a shop selling goods and not a place where goods are made.'
examples:
- Traders met at the futures exchange to buy and sell deals for wheat to be sent in the spring.
- The futures exchange opened early so deals could be traded before the harvest.
