simpleMeaning: a person who takes great joy in fine food and drink and other pleasures of the senses
scope: Also called a bon vivant, epicure, epicurean, foodie, or gourmet, this is a person who loves fine
  eating and drinking, not a cook and not a person who simply eats a lot.
examples:
- The gastronome spent the evening tasting each dish with great care.
- As a true gastronome, she plans her trips around fine restaurants.
