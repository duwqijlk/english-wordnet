simpleMeaning: In law, a person, usually named by a court, who turns the things a person or company owns
  into money, or keeps them safe, for the people affected
scope: 'Also called a receiver: a court-named person who sells or keeps safe what a person or company
  owns, not a hired killer.'
examples:
- The court named a liquidator to sell the shop's stock.
- As liquidator, she kept the company's money safe for the people it owed.
