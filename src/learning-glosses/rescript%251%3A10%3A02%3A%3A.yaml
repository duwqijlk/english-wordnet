simpleMeaning: an answer from the Pope to a question about a point of law or right and wrong
scope: An answer from the Pope on law or right and wrong, not a letter from another church leader and
  not a public statement of church teaching.
examples:
- The priest asked for a rescript to settle the question of church law.
- A rescript from the Pope answered the bishop's inquiry.
