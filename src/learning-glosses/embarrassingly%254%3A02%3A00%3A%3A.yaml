simpleMeaning: in a way that makes a person feel shy, uncomfortable, or ashamed
scope: This is about a way of doing something that makes a person feel shy or ashamed. It is not a name
  for the feeling itself.
examples:
- He tripped on stage and landed embarrassingly in front of the crowd.
- Her dress tore embarrassingly just as she stood up to speak.
