simpleMeaning: In the eastern United States grows a common birch whose spicy brown bark gives off an oil
  that flies off easily, and whose hard dark wood serves for furniture.
scope: Also called cherry birch and sweet birch, this common birch grows in the eastern United States,
  not in swamps and river bottoms.
examples:
- The black birch gave off a spicy smell from its brown bark.
- Black birch wood made the top of the table.
