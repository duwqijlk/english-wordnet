simpleMeaning: Small slow-growing western US evergreen, bristlecone-like, with plated chocolate-brown
  bark, short needles in fives, twisted conical crown, the oldest plant in the world, living 5000 years
  on semidesert mountain tops.
scope: A small long-lived pine, also called ancient pine; not a bristlecone pine and not a fir.
examples:
- Pinus longaeva grows on the cold mountain tops.
- Some Pinus longaeva trees are 5000 years old.
