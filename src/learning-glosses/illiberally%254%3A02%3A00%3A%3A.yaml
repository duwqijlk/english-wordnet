simpleMeaning: in a way that shows a closed mind, refusing to hear views that differ from one's own
scope: In a closed-minded way, also called intolerantly; not holding such views as a person and not doing
  something out of spite.
examples:
- He spoke illiberally about the new arrivals.
- She judged the proposal illiberally, without hearing it out.
