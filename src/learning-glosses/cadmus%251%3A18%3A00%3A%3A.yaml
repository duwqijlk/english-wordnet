simpleMeaning: In Greek myth, the brother of Europa who is said to have founded the city of Thebes in
  Boeotia.
scope: This is the brother of Europa in Greek myth who founded Thebes; not other heroes of Greek myth,
  and not a founder of other cities.
examples:
- Cadmus was said to have founded Thebes in Boeotia.
- In the old tale, Cadmus was the brother of Europa.
