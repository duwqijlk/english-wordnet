simpleMeaning: A change that turns things held in private hands into things owned by the whole community.
scope: 'Also called communization: a change from things held in private hands to things owned by the whole
  community, not the setting up of a whole country on shared ownership.'
examples:
- The communisation of the land took years.
- After the war, the communisation of the mills began.
