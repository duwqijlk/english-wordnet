simpleMeaning: of high worth in thought and in what is right, and raised in character or in the way something
  is said or done
scope: Also called grand, elevated, lofty, idealistic, sublime, and rarefied. This sense is about high
  worth in thought, character, or style, not about a high place or a high rank.
examples:
- She held an exalted ideal of helping others before herself.
- His exalted ideas about honour guided all his work.
