simpleMeaning: A person who backed the Southern states that broke away in the Civil War.
scope: A backer of the Southern side in the Civil War, not a soldier of that side alone and not a backer
  of the Union.
examples:
- A Confederate from Georgia joined the cause in 1861.
- The Confederate believed the Southern states should rule themselves.
