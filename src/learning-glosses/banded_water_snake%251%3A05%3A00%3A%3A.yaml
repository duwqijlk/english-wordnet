simpleMeaning: In the western United States, a snake that stays near wet places is placed by some books
  in the group Nerodia.
scope: This snake of the western United States that stays near wet places is also called the common water
  snake.
examples:
- A banded water snake lay on the bank, never far from the water.
- We saw a banded water snake slip into the water.
