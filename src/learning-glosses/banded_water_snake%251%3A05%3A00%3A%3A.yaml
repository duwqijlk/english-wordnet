simpleMeaning: A North American water snake, placed in the genus Nerodia in some classifications, that
  seldom goes far from water.
scope: Also called the common water snake; a snake that stays near rivers, lakes and marshes.
examples:
- A banded water snake lay on the bank, never far from the water.
- We saw a banded water snake slip into the water.
