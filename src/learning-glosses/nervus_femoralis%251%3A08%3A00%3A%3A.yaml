simpleMeaning: From the nerves of the lower back start a pair of nerves, and one of them feeds the muscles
  and skin of the front of the thigh.
scope: The anterior crural nerve and the femoral nerve are also names for one of a pair of nerves from
  the lower back that feed the muscles and skin of the front of the thigh.
examples:
- The nervus femoralis feeds the muscles at the front of the thigh.
- The nervus femoralis feeds the skin at the front of the thigh.
