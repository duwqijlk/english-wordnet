simpleMeaning: A group of German thinkers about money and law in the 1800s who tried to explain present-day
  money systems by how they had grown and changed over time.
scope: A group of German thinkers about money and law in the 1800s, not the classical thinkers who sought
  timeless laws and not a school of art.
examples:
- The historical school tried to explain money systems by their past.
- He wrote about the historical school of German thinkers.
