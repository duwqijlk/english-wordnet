simpleMeaning: Pain and weakness in the arms and legs, at times with no power to move them, mark a nerve
  sickness outside the brain and spine, for no known reason.
scope: It is one kind of nerve sickness of the arms and legs, set apart from sicknesses of the brain and
  spine by its place outside them and by its unknown cause.
examples:
- The weakness in their arms came from infectious polyneuritis.
- Infectious polyneuritis took away all power to move their legs.
