simpleMeaning: A way of looking inside the body with a machine that takes pictures of how living parts
  use power, most of all in the brain.
scope: This is a machine way of picturing how living parts use power, also called positron emission tomography,
  not a tame animal and not a gentle touch.
examples:
- PET showed how her brain used power.
- The doctor used PET to look inside his body.
