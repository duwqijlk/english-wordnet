simpleMeaning: a substance in the blood that helps it form clots, sold as Hemofil, and people without
  it have the blood illness called haemophilia A
scope: 'Also called antihaemophilic factor, antihaemophilic globulin and antihemophilic factor: a substance
  in the blood that helps it form clots, not a drug that thins the blood and not a drug that breaks up
  clots.'
examples:
- Antihemophilic globulin helps the blood form a clot when a vessel is cut.
- He receives antihemophilic globulin each week to keep his blood clotting well.
