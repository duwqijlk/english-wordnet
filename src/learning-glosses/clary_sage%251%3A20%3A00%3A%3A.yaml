simpleMeaning: an oil for flavouring food and scenting perfume comes from this thick-stemmed plant of
  the Mediterranean, with white, pink, or violet flowers
scope: A thick-stemmed Mediterranean plant with white, pink, or violet flowers, that yields a scented
  oil, not common garden sage.
examples:
- Clary sage grew beside the wall, its white flowers open in June.
- She crushed clary sage leaves to smell the oil used in perfume.
