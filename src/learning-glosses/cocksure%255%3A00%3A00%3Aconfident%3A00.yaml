simpleMeaning: having too much belief in oneself and in what one thinks or does
scope: 'Also called positive and overconfident: having too much belief in oneself, not just being sure
  in a normal, good way.'
examples:
- He was cocksure that his plan could not fail, but it did.
- The cocksure young man would not listen to any advice.
