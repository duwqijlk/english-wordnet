simpleMeaning: not held back or tied down; free to move
scope: This means a person or thing is not tied down or held back. Not a book whose pages are loose, with
  nothing holding them together.
examples:
- With the rope cut, the horse stood unbound in the yard.
- The prisoner sat unbound after the guards took off the chains.
