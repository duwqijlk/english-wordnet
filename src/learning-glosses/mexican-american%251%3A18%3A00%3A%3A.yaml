simpleMeaning: This person is a Mexican, or one whose family came from Mexico, and lives in the United
  States.
scope: Also called Mexicano, this is a person from Mexico living in the United States, not a person living
  in Mexico.
examples:
- My neighbour is a Mexican-American who moved here from Texas.
- The Mexican-American family has lived in the United States for years.
