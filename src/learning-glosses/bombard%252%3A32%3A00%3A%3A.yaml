simpleMeaning: to keep sending many questions, requests, or words to someone, again and again, with no
  stop
scope: 'Also called barrage: to keep asking or sending things to a person, not to throw things at a place
  and not the old musical instrument.'
examples:
- Reporters bombarded the mayor with questions about the fire.
- Fans bombarded her with messages asking for a new song.
