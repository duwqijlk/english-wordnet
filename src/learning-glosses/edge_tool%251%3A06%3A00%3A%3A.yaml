simpleMeaning: 'A chisel, a knife, a plane or a gouge is one of these: a thing made for cutting, with
  a sharp side.'
scope: Any cutting thing with a sharp side goes by this name, such as a chisel, a knife, a plane or a
  gouge.
examples:
- He picked up an edge tool to cut with.
- She put the edge tool back in its place.
