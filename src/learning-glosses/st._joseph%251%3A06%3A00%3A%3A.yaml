simpleMeaning: A changed form of salicylic acid, used as a drug for pain and swelling, usually taken as
  tablets, also lowering fever, and slowing the clotting of blood by harming platelets.
scope: Also called aspirin, acetylsalicylic acid, Bayer and Empirin; a drug that eases pain and swelling
  and lowers fever, not acetaminophen, which eases pain and fever but not swelling, and not a drug for
  sleep.
examples:
- St. Joseph is often taken for a headache.
- The doctor told her to take St. Joseph after the operation.
