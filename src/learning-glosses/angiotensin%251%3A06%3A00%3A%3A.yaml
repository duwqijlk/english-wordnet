simpleMeaning: Any of several body stuffs, sold as Hypertensin, that make blood tubes narrow
scope: Any of several body stuffs that narrow blood tubes; angiotonin is another name for this sense,
  not a medicine that widens blood tubes and not high blood pressure itself.
examples:
- Angiotensin helps the body raise blood pressure by narrowing blood vessels.
- Doctors measure angiotensin when they study blood pressure.
