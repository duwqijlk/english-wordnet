simpleMeaning: a cloth for making clothes, woven in a pattern of crossing coloured lines
scope: This is the cloth itself, with its pattern of crossing lines, not a shirt or dress made from it.
examples:
- She wore a dress made of blue and white gingham.
- He bought some gingham to make a summer shirt.
