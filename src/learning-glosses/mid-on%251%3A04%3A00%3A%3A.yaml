simpleMeaning: In cricket, on the side of the field by the batsman's legs, a fielder stands in the place
  nearest the bowler
scope: The fielding place nearest the bowler on the leg side, not the matching place on the side away
  from the batsman's legs and not a place far from the bowler.
examples:
- The captain moved a fielder to mid-on to stop the flick.
- She fielded at mid-on, close in on the leg side.
