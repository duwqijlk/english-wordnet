simpleMeaning: Found only in Illinois, this rare mallow looks like the common flower of its kind and bears
  pale rose-mauve flowers; it is sometimes placed in the genus Sphaeralcea.
scope: A rare mallow found only in Illinois, with pale rose-mauve flowers, not the purple-flowered wild
  mallow of western North America.
examples:
- Wild hollyhock grew only in Illinois.
- The wild hollyhock had pale rose-mauve flowers.
