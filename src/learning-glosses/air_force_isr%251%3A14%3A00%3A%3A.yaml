simpleMeaning: A United States military office that works to give its side better knowledge than others
  have, using ground stations around the world and flying craft that watch from the sky.
scope: Also called AFISR and Air Force Intelligence Surveillance and Reconnaissance; a United States military
  office for gaining knowledge, working through ground stations around the world and flying craft that
  watch from the sky.
examples:
- The Air Force ISR office passed its findings to commanders in the field.
- Air Force ISR planes flew over the area night after night.
