simpleMeaning: A person who is whipped, or who whips themself, for sexual pleasure.
scope: A person who is whipped, or who whips themself, for sexual pleasure; not a person whipped as a
  punishment, and not a person who fasts for faith.
examples:
- The flagellant paid to be whipped for sexual pleasure.
- The flagellant asked a partner to whip him for sexual pleasure.
