simpleMeaning: Of high worth in morals or in thought, and high in nature or in style
scope: 'Also called grand, elevated, lofty, exalted, sublime and rarefied: having high worth or a raised
  style, not the philosophy sense about ideas being real.'
examples:
- She held idealistic aims of truth and kindness above all else.
- The poem has an idealistic style, full of grand thoughts about honour.
