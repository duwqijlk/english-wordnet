simpleMeaning: For the weather to be very windy with heavy rain, hail or snow, often with thunder or lightning.
scope: This is weather that brings heavy rain, hail or snow with strong wind, not just wind blowing hard,
  a person raging, or an attack on a place.
examples:
- It stormed all night, so we stayed indoors.
- By midday the sky had darkened and it was storming.
