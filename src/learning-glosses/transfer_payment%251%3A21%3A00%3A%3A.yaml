simpleMeaning: money a government spends on people, such as money for those with no job or for those who
  served in the armed forces, not to buy goods or services
scope: This is money a government spends on people, not to buy goods or services; not a payment for work
  done and not money a person pays in tax.
examples:
- The transfer payment helped him while he looked for work.
- Veterans' benefits are a form of transfer payment.
