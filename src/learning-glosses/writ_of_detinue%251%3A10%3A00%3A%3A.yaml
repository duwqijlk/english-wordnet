simpleMeaning: a written order that goods kept back against the law must be given back
scope: This is an order to give back goods that were kept back against the law, not an order asking a
  lower court for a case record and not a court order of any other kind.
examples:
- The judge gave a writ of detinue so the goods would be given back.
- She won a writ of detinue for the tools that had been kept from her.
