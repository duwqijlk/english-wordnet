  hold pus.
scope: This is a rare condition passed down in families, marked by dark crusted patches that at times
  hold pus, not the skin disease with dark wartlike patches in the body folds.
examples:
- Keratosis follicularis runs in families and causes dark crusted patches.
- His keratosis follicularis left dark crusted patches on his skin.
