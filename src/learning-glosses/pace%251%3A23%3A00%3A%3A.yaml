simpleMeaning: A unit of length of three feet, now fixed at 91.44 centimeters and first based on an average
  stride.
scope: A fixed unit of length equal to three feet — another name for a yard — not the distance covered
  by a step, the act of stepping, or the speed of progress.
examples:
- The old map marked distances in paces of three feet.
- The room measured ten paces across, or thirty feet.
