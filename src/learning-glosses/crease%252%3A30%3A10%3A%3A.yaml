simpleMeaning: to get small lines and folds, or to get crushed into folds, so it is no longer smooth
scope: This is about a thing itself getting lines and folds, also called wrinkle, crumple, crinkle and
  rumple. It is not making lines in something else, and not a fold as a thing.
examples:
- This thin shirt creases easily, so pack it with care.
- Her dress creased after she sat on it for a long time.
