simpleMeaning: A rabbit of woodland and wet coastal ground in the south-east of the United States, from
  North Carolina to Florida
scope: A rabbit of woodland and wet coastal ground in the south-east of the United States, from North
  Carolina to Florida; not a jackrabbit of dry open land and not a snowshoe hare of the cold north.
examples:
- A marsh hare darted through the wet grass at dawn.
- We saw a marsh hare near the creek in Florida.
