simpleMeaning: A swelling of the tube that carries urine out of the body, passed on through sex and usually
  caused by chlamydia.
scope: This is a swelling of the tube that carries urine out of the body, passed on through sex, also
  called nongonococcal urethritis; not gonorrhoea and not other infections passed on through sex.
examples:
- NGU is usually caused by chlamydia.
- The doctor treated him for NGU.
