simpleMeaning: a plane with a propeller on the outside, turned by a jet engine
scope: 'Also called a turboprop or a turbo-propeller plane: a plane with an outside propeller turned by
  a jet engine, not a plane with a propeller turned by a piston engine and not a jet plane with no propeller.'
examples:
- The propjet's outside propeller is turned by a jet engine.
- We watched the propjet take off, its propeller spinning fast.
