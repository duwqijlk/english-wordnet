simpleMeaning: To put an idea before people so they can think about it, look at it closely, say what is
  wrong with it, or do other such things
scope: 'Also called project: to put an idea before people for them to judge, not to plan to do something
  and not to declare a plan.'
examples:
- He proposed a new plan for dealing with the problem, so the group could think it over.
- She proposed a new theory, and the others looked at it closely before they said what was wrong with
  it.
