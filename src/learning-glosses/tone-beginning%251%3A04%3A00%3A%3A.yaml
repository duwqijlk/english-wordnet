simpleMeaning: a firm, clear way of starting a note or a few notes played together
scope: The firm, clear way a player starts a note or phrase; attack is another name for this. Not the
  way a note ends, and not how loud a note is.
examples:
- Her tone-beginning on the first note was firm and clear.
- The teacher praised his tone-beginning at the start of the phrase.
