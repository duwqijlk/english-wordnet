simpleMeaning: The study of the smallest bits of matter and how they act on each other.
scope: The study of the smallest bits of matter and how they act on each other, not physics in general;
  also called high-energy physics and particle physics.
examples:
- He studied high energy physics at university.
- High energy physics deals with the smallest bits of matter.
