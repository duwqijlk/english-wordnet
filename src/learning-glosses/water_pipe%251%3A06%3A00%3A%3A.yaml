simpleMeaning: Smoke cools as it passes through liquid in a pot joined by a long bendy tube to a smoking
  tool from the East, made for tobacco.
scope: Also called a hookah, a shisha, a calean, a chicha, a hubble-bubble, a hubbly-bubbly, a kalian,
  a narghile, a nargileh and a sheesha, this is the name for a smoking tool from the East.
examples:
- He filled the water pipe and drew the smoke through the long tube.
- The water pipe's smoke cooled in the pot.
