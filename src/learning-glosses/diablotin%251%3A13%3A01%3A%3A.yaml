simpleMeaning: A thin round piece of bread, most often put in soup, and most of all in consomme
scope: This is a thin round slice of bread, usually served with soup, not a thick slice of bread and not
  a cracker served with cheese.
examples:
- She floated a diablotin on top of the soup.
- The recipe called for a diablotin of French bread with the consomme.
