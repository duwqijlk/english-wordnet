simpleMeaning: a group of people joined together to stand against a thing
scope: A group of people joined to stand against a thing, not the act of standing against a thing and
  not an armed person on the other side.
examples:
- The opposition in parliament voted against the bill.
- A strong opposition formed against the new road.
