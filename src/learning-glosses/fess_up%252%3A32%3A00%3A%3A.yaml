simpleMeaning: After doing something wrong, you say that you did it
scope: 'Also called to own up and to make a clean breast of: saying that you did something wrong or made
  a mistake, not denying it and not blaming someone else.'
examples:
- He finally fessed up about breaking the window.
- She fessed up to the mistake before anyone asked.
