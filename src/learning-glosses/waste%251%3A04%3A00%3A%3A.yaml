simpleMeaning: an activity that achieves nothing useful, or the thoughtless use or consumption of time,
  money or other resources.
scope: This is pointless activity or careless use, not unwanted materials and not empty land.
examples:
- The whole exercise was a waste of time and effort.
- Buying that broken machine was a waste of money.
