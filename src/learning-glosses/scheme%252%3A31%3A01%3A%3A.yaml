simpleMeaning: to plan how something will be done, by making a system or a set of steps for it
scope: 'The verb sense: to make a plan or system, not to plot in secret in a dishonest way and not the
  noun sense of an early plan itself.'
examples:
- The teachers schemed a timetable that gave every class time in the hall.
- He schemed a system for sorting the letters by town.
