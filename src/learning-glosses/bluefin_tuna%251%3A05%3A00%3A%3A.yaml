simpleMeaning: It feeds in cold polar waters and breeds in warm tropical ones, the biggest fish of its
  kind at 1500 pounds, living for the most part in mild seas.
scope: The biggest fish of its kind, reaching 1500 pounds; bluefin and horse mackerel are other names
  for this sense, not a fish that stays in warm seas and not one that breeds in cold waters.
examples:
- The bluefin tuna can reach 1500 pounds.
- Bluefin tuna feed in polar waters but breed in the tropics.
