simpleMeaning: A Muslim or Hindu holy man who begs for his living.
scope: A Muslim or Hindu holy man who begs for his living, also called a fakir, a faqir or a faquir; not
  a priest and not a monk with a home.
examples:
- The fakeer sat by the road asking for alms.
- A fakeer is a holy man who lives by begging.
