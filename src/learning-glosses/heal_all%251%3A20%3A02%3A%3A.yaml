simpleMeaning: A low plant of Europe that lives for years, with blue flowers, lying flat along the ground,
  thought to help sick people get better; now wild throughout North America.
scope: Also called self-heal, this is a low blue-flowered plant thought to heal, not the heal all of North
  American woods with yellow flowers and small round blue fruits.
examples:
- Heal all grew flat along the woodland path.
- Old books say heal all can cure a wound.
