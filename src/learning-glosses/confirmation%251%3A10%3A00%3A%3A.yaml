simpleMeaning: News or facts that show a thing is true.
scope: News or facts that show a thing is true, not a Jewish coming-of-age rite, not a church sacrament,
  and not the act of making a thing valid by a formal act.
examples:
- We are still waiting for confirmation of the booking.
- His words gave us confirmation that the story was true.
