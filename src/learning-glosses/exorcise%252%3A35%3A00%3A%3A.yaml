simpleMeaning: to drive out an evil spirit by prayers or by words said as a strong order
scope: Also called exorcize, this means driving out an evil spirit with prayers, not healing a sick person
  with medicine and not driving a person out of a place.
examples:
- The priest tried to exorcise the evil spirit from the house.
- They called a priest to exorcise the spirit that they believed was in the man.
