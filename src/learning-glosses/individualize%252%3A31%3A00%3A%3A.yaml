simpleMeaning: to make, mark, or treat a person or thing as one on its own, different from others
scope: 'Also called individualise: this means making or treating something as one on its own, not treating
  a whole group in the same way.'
examples:
- Each key was individualized with a different colour mark.
- The sounds were individualized by their sharpness and tone.
