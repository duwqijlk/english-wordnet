simpleMeaning: to hunt a kind of wild bird that people hunt for sport and food
scope: To hunt this bird; not the bird itself, and not its meat eaten as food.
examples:
- They go to Scotland each autumn to grouse, walking the hills to hunt the birds.
- He groused with friends on the open hills and shot two birds before lunch.
