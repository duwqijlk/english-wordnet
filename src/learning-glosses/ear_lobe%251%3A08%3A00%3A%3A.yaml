simpleMeaning: the soft piece of flesh that hangs down at the bottom of the outer part of a person's head
  that takes in sound
scope: 'Also called earlobe: the soft piece of flesh that hangs down at the bottom of the outer part of
  a person''s head that takes in sound, not the whole outer part of a person''s head and not the small
  bones inside.'
examples:
- She wore a small gold ring in her ear lobe.
- He pinched his ear lobe while he was thinking.
