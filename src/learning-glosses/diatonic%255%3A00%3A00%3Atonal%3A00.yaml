simpleMeaning: Built on, or using, the five tones and two half-tones of the big or small scales of western
  music.
scope: Built on, or using, the five tones and two half-tones of the big or small scales of western music;
  not built on the plain big or small scales of five tones and two half-tones, with no shift by sharps
  or flats.
examples:
- Their scale was diatonic at dawn.
- The tune was diatonic by nature.
