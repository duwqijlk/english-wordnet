simpleMeaning: a soft thick pad filled with cotton, used for sleeping on the floor or on a raised frame
scope: A pad for sleeping on the floor or on a raised frame, not a thick bed with springs and not a sofa
  that folds out into a bed.
examples:
- He slept on a futon on the floor of the small room.
- They put the futon on a wooden frame to use as a bed.
