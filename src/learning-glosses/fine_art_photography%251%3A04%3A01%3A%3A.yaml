simpleMeaning: pictures made to match the way the person who took them sees the world
scope: 'Also called fine-art photography: pictures made to match the way the person who took them sees
  the world, not pictures made to show facts and not pictures made to sell a thing.'
examples:
- Her show was all fine art photography of the coast.
- He turned to fine art photography after years of taking pictures for newspapers.
