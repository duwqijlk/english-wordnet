simpleMeaning: To leave a person alone in a place with no way to get help, so they have little hope of
  being saved
scope: To leave someone alone with little hope of rescue, not to tie threads together and not a shore.
examples:
- The storm stranded the travellers on the island.
- They were stranded far from help after the car broke down.
