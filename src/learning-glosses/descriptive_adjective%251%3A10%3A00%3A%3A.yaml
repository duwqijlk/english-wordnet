senseId: 'descriptive_adjective%1:10:00::'
synsetId: 06332925-n
simpleMeaning: an adjective that says what its noun is like, naming a quality of the thing or person,
  as in 'a nervous person' or 'a musical speaking voice'
scope: 'Also called a qualifying adjective: an adjective that names a quality of its noun, not a word
  that points to which one is meant, and not an adjective that merely counts or orders.'
examples:
- In 'a nervous person', 'nervous' is a descriptive adjective.
- The descriptive adjective 'musical' tells us what the speaking voice is like.
