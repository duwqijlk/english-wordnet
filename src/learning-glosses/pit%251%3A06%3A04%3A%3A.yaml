simpleMeaning: In auto racing, an area at the side of a race track where race cars are checked, fixed
  and given fuel
scope: In auto racing, the place beside the track for fixing cars and giving them fuel, not the low area
  in front of a stage for musicians and not a place dug to get stone.
examples:
- The car stopped in the pit for new tires and fuel.
- Workers in the pit changed the car's tires in a few seconds.
