simpleMeaning: Someone who is trusted with another person's secret.
scope: This is an old, literary use for a confidant, the one person trusted with a secret. It is not the
  modern office secretary who types and files, which is by far the commoner sense today. The word survives
  mainly in older writing.
examples:
- In the old chronicle, the king's secretary alone knew where the treasure was buried.
- The old duke's secretary took his master's secrets to the grave.
