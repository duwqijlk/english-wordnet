simpleMeaning: Bits of the stuff in cells that carries the body's building plans, joined from different
  living things, make this lab-made piece.
scope: It is the cell stuff that carries the body's building plans, joined from bits of different living
  things, not a copy of one living thing's plans alone.
examples:
- Bits of DNA from different living things were joined to make recombinant deoxyribonucleic acid.
- The team used recombinant deoxyribonucleic acid in its work.
