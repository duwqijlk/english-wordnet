simpleMeaning: Something fun to do that takes your mind off work or worry and wakes you up.
scope: Not a change of direction or a detour; this is a pastime that amuses and refreshes you.
examples:
- Scuba diving is provided as a diversion for tourists.
- For a diversion after work, she played the piano and read.
