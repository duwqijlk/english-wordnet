simpleMeaning: A simple water plant from one large group whose fresh-grass colour is hidden by a gold
  colour
scope: A simple water plant whose gold colour hides its fresh-grass colour, not a plant with flowers and
  not one that grows on dry land.
examples:
- The pond was full of yellow-green algae after the warm week.
- Yellow-green algae gave the shallow water a gold tint.
