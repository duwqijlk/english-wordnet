simpleMeaning: A tree found widely in the east of Australia, giving a tough lasting fibre and soft light
  wood with a fine grain; its leaves are cattle food in hard times.
scope: 'Also called currajong and kurrajong: a tree found widely in the east of Australia giving a tough
  lasting fibre and soft light wood, whose leaves feed cattle in hard times, not a low shrub.'
