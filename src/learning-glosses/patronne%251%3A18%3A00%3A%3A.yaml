simpleMeaning: a woman who gives support to a person or cause, or the wife of a man who does so
scope: patroness is another name for this sense; a woman who gives support, or the wife of a man who does
  so, not a woman who receives support.
examples:
- The patronne of the theatre hosted the opening night.
- As patronne, she gave money to the young painter.
