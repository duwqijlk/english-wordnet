simpleMeaning: A physics idea that explains, with the rules of both relativity and quantum theory, how
  light bits, electrons and muons push and pull on each other.
scope: Also called quantum electrodynamics; a physics idea about how light bits, electrons and muons push
  and pull on each other, not a physics idea about gravity and not a set of lab tools.
examples:
- QED explains how light and matter push and pull on each other.
- The student used QED to work out how an electron moves.
