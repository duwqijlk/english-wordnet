simpleMeaning: No longer active, with the fire or life in a thing gone out for good.
scope: A thing no longer active, like a dead volcano, not the fading of light, not the loss of a learned
  habit, and not the act of putting out a fire.
examples:
- The extinction of the volcano left the mountain cold and still.
- After the extinction of the old mine, the town fell quiet.
