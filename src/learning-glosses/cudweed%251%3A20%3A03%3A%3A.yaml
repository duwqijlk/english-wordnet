simpleMeaning: a plant that lives for many years, with soft white hairs, that grows in the southwest of
  the United States
scope: 'Also called prairie sage: a long-lived plant with soft white hairs from the southwest of the United
  States, not any plant of the genus Filago or Gnaphalium.'
examples:
- Cudweed grows in the dry southwest of the United States.
- The cudweed in the field was covered with soft white hairs.
