simpleMeaning: To experience an injury or an illness.
scope: This is about experiencing an injury or an illness — have, get and sustain are other names for
  this sense — not enduring an unpleasant situation and not simply being in pain.
examples:
- She suffered a broken wrist in the fall.
- He suffered serious burns in the fire.
