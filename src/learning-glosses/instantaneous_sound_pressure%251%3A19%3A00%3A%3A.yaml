senseId: 'instantaneous_sound_pressure%1:19:00::'
synsetId: 11517778-n
simpleMeaning: how much the push at one spot, at one moment, is above or below the usual push there while
  noise is passing
scope: This is the push at one moment at one spot in a place where noise moves; sound pressure is another
  name for it; not the steady push with no noise.
examples:
- The instantaneous sound pressure near the speaker was far above the usual level.
- They measured the instantaneous sound pressure at several points in the hall.
