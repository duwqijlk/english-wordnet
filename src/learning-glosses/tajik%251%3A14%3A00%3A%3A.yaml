simpleMeaning: A group of people, mostly Muslim, who live in the land of that name and nearby parts of
  Uzbekistan, Afghanistan and China.
scope: 'Also called Tadzhik: a group of people, mostly Muslim, who live in Tajikistan and nearby lands,
  not the language of the same name and not one single person from Tajikistan.'
