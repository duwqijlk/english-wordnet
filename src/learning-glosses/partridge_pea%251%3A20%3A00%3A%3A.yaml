simpleMeaning: Touch the small leaves of this plant from warm parts of America and they move a little;
  it is sometimes put in the plant group Cassia.
scope: This plant from warm parts of America, also called a sensitive pea and a wild sensitive plant,
  has small leaves that move a little when touched and is sometimes put in the plant group Cassia.
examples:
- The small leaves of the partridge pea moved a little when I touched them.
- The partridge pea had small leaves that moved a little when touched.
