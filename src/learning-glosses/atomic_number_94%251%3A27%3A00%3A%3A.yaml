simpleMeaning: A solid silvery grey metal beyond uranium that gives off rays; atoms split by neutrons;
  tiny amounts in uranium ores, usually made in nuclear reactors; 13 forms, chiefly plutonium 239.
scope: Also called Pu and plutonium; a metal that gives off rays, not the shiny metal tin and not the
  soft grey metal thallium.
examples:
- Atomic number 94 is plutonium, a metal that gives off rays.
- Scientists made atomic number 94 in a nuclear reactor.
