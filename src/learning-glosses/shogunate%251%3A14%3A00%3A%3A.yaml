simpleMeaning: No written set of rules, no laws, and no opposition can hold back the one person who rules
  with all power
scope: Tyranny, authoritarianism, dictatorship, totalitarianism, despotism, absolutism, monocracy, and
  one-man rule are other names for this way of ruling, in which one person holds all power.
examples:
- The shogunate ruled the land through one man's word alone.
- Under the shogunate, the people had no laws to turn to.
