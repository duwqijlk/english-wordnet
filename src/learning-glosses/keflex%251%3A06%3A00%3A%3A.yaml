simpleMeaning: A cephalosporin antibiotic, a drug that kills germs, often given for mild to fairly severe
  infections of the skin, ears, throat, lungs or urinary tract.
scope: Also called cephalexin, Keflin and Keftab; a germ-killing drug, not a pain drug and not a drug
  for the heart.
examples:
- The doctor gave her Keflex for a throat infection.
- Keflex is often given for mild skin infections.
