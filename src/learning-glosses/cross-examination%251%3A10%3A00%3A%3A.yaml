simpleMeaning: In law, close questioning of a hostile witness in court to cast doubt on what they said
  at first, or to bring out new light on it.
scope: This is close questioning of a hostile witness, not the first questioning of a witness or a police
  interview.
examples:
- The lawyer began the cross-examination of the witness.
- Under cross-examination, his story fell apart.
