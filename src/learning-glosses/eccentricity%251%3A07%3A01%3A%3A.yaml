schema: oewn-learning-gloss-v2
senseId: 'eccentricity%1:07:01::'
synsetId: 05081057-n
simpleMeaning: a shape that is round, but whose center is in a different place, or whose path moves away
  from a round path
scope: This is about a round shape whose center is in a different place or whose path moves away from
  a round path, not about a person acting in a strange way, and not the number used in geometry to show
  the shape of a curved line.
examples:
- The eccentricity of the ring means its center is not in the middle.
- Because of its eccentricity, the wheel does not turn in a true round path.
