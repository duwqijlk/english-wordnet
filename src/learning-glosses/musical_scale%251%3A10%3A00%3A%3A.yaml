simpleMeaning: In music, a set order of notes moves by steps of high and low sound, most often inside
  one octave
scope: 'Also called a scale: in music, a set of notes in a fixed order of pitch, not a single note and
  not a tune.'
examples:
- She sang the musical scale up and down to warm up her voice.
- The musical scale he practised ran from low to high and back again.
