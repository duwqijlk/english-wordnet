simpleMeaning: in a way, or to a degree, that goes against what is right and honest
scope: 'Also called disgracefully, dishonorably and ignominiously: this means in a way, or to a degree,
  that goes against what is right and honest. It does not just mean in a way that shows a person feels
  ashamed.'
examples:
- He behaved shamefully and lied to his own friends.
- The team played shamefully badly in the last game.
