simpleMeaning: to work for a time as a trainee, learning a job by doing it under a skilled person
scope: To work for a time as a trainee learning a job by doing it, not to keep a person shut up in a place.
examples:
- The young doctor is interning at the Medical Center this year.
- She will intern at a law firm this summer.
