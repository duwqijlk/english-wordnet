simpleMeaning: A condition upsetting salt-and-water balance, with weakness, cramps, twitching, fits, and
  sometimes paralysis, usually from a harmless growth in the adrenal gland's outer part making too much
  aldosterone.
scope: Not other disorders of the adrenal gland, nor other upsets of salt balance; this is the one caused
  by too much aldosterone.
examples:
- Conn's syndrome upsets salt balance.
- Doctors treat Conn's syndrome with medicine.
