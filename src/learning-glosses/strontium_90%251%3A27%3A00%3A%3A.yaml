simpleMeaning: A kind of metal that gives off rays, with mass number ninety, found in dust falling after
  nuclear blasts; the body can take it into bones like calcium.
scope: A ray-giving form of the metal with mass number ninety, found in dust that falls after nuclear
  explosions and taken into bones like calcium, not the steady form of the metal.
examples:
- Strontium 90 was found in dust after the nuclear tests.
- Bones can take in strontium 90 as they take in calcium.
