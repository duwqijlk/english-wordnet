simpleMeaning: Marked out in blocks and spots of unlike colours, usually bright.
scope: Also called painted, multicolor, multicolored, motley, piebald, pied, multicolour, multicoloured,
  multi-color, multi-colored, multi-colour, multi-coloured, particolored, and particoloured; marked out
  in blocks and spots of unlike colours, usually bright, not the coarse printed cloth and not the adjective
  sense of being made of that cloth.
examples:
- The calico horse stood out in the field with its patches of black and white.
- Her calico dress was bright with patches of red and blue.
