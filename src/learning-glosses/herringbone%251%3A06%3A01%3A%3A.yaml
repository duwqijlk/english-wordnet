senseId: 'herringbone%1:06:01::'
synsetId: 03521530-n
simpleMeaning: A design of short parallel strokes set in strips, each strip slanting one way and the next
  the opposite, used in weaving, masonry, patterned wood floors and embroidery.
scope: A design of short slanted strokes in alternating strips, not a single zigzag line and not one kind
  of embroidery stitch; herringbone pattern is another name for the same design.
examples:
- The bricks were laid in herringbone, each one turned against its neighbor.
- You can see the herringbone clearly where the parquet blocks meet.
