simpleMeaning: Things that are like the things of Egypt, or that have to do with its people and the tongue
  they speak, are what this word is about.
scope: This word is used of things of Egypt, not of the old tongue itself and not of a person from that
  land.
examples:
- Egyptian art from the time of the Pharaohs fills the museum.
- She studies Egyptian writing from long ago.
