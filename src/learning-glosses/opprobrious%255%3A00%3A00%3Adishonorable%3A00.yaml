simpleMeaning: Said of acts or a person's nature that earn scorn and loss of respect
scope: Said of acts or a person's nature that earn scorn and loss of respect, also called black, shameful,
  disgraceful, ignominious and inglorious; not a small fault and not a crime.
examples:
- The opprobrious monument to human greed stood in the town square.
- His opprobrious words shamed the whole team.
