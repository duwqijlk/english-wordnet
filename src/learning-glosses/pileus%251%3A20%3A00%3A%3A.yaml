simpleMeaning: Where a stalked soft fungus such as a mushroom makes its spores, a wide top that spreads
  out like an open umbrella or a pointed cone.
scope: It is also called cap, the spore-bearing top of a stalked soft fungus such as a mushroom, shaped
  like an open umbrella or a pointed cone, not the stalk that holds it up.
examples:
- We found the mushroom by its wide pileus, spread like an open umbrella.
- The pileus rose on its stalk, wide as an open umbrella.
