simpleMeaning: the whole total of a person's achievements as others recognize them
scope: This is the overall total of what someone has achieved, not a single best or worst result or a
  list of crimes.
examples:
- Judges reviewed her record of public service before appointing her.
- His school record includes a prize for science and two years as captain.
