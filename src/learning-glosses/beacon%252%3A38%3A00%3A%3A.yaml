simpleMeaning: to guide someone by a bright light set up to mark the way
scope: To show the way with a light, not the radio signal or the warning tower, and not shining like one.
examples:
- The guide beacons the ships home through the fog.
- She beaconed the way for the walkers with a lamp on the hill.
