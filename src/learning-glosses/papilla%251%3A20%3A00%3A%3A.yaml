simpleMeaning: In botany, a very small bump on the face of a petal or a leaf.
scope: A tiny bump on a petal or leaf, not a thorn and not a hair on the plant.
examples:
- A papilla rose from the petal's surface.
- Under the lens, papillae dotted the leaf.
