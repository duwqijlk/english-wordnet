simpleMeaning: Cancer there is most often treated by taking out part or all of the voice box in an operation
scope: An operation that takes out the voice box, not an operation on the throat that leaves it in place
  and not treatment by drugs alone.
examples:
- After the laryngectomy, he had to learn to speak in a new way.
- The surgeon said a laryngectomy was the best way to treat the cancer in her voice box.
