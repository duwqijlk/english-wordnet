senseId: 'atonement%1:04:00::'
synsetId: 00095941-n
simpleMeaning: the act of doing something to make right a sin or wrongdoing, especially to please a god
scope: 'Also called expiation: this is the act of making something right, not the sin itself and not forgiveness
  given by another person.'
examples:
- He prayed for hours as an act of atonement for his lies.
- She gave money to the poor in atonement for the harm she had done.
