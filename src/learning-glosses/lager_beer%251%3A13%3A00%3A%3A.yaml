simpleMeaning: A general name for a drink made with bottom-working yeast, usually by heating part of the
  mash, first brewed in March or April and ripened until September
scope: This is a general name for a drink made with bottom-working yeast, also called lager, not a top-fermented
  drink and not a dark stout.
examples:
- Lager beer is kept cold and served in a tall glass.
- The brewery makes a lager beer with bottom-working yeast.
