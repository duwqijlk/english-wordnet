simpleMeaning: To use a computer to control what something does, a process, or the making of a thing
scope: 'Also called computerise: using a computer to control how something works, not giving a place computers
  and not putting information into a computer to keep it.'
examples:
- They computerized the heating system in the factory.
- We computerized the process so a computer now controls each step.
