simpleMeaning: With two leaves close to the ground, this small land plant of eastern North America and
  Europe bears dull yellow-green flowers in a bunch along a stem
scope: Also called fen orchid, this small land plant differs from other orchids by its two leaves near
  the ground and its dull yellow-green flowers.
examples:
- The fen orchis had dull yellow-green flowers in a bunch along its stem.
- A fen orchis grew with two leaves close to the ground.
