simpleMeaning: wanting a thing very strongly, often said with 'for' before the thing wanted
scope: Wanting a thing very strongly, often said with 'for', not merely wanting too much food or drink,
  and not wanting to take too much wealth.
examples:
- The young singer was greedy for fame.
- He was greedy for adventure and praise.
