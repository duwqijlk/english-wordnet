simpleMeaning: a stand that holds a dead body or a box for a dead body before the body is put in the ground
scope: A stand used before a body is put in the ground, not the box for the body itself and not a bed
  or a table.
examples:
- The coffin rested on a bier in the small church.
- Four men carried the bier slowly to the burial ground.
