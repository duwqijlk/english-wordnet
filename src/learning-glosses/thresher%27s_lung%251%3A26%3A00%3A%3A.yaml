simpleMeaning: Breathing in dust from mouldy hay can set off this swelling of the air sacs in the chest,
  the body's over-strong answer to mould spores in the dust.
scope: Also called farmer's lung, this swelling of the air sacs in the chest comes from dust breathed
  in from mouldy hay.
examples:
- Thresher's lung set in after breathing in dust from the mouldy hay.
- Mouldy hay brought on his thresher's lung.
