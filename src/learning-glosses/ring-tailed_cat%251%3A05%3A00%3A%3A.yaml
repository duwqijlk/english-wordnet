simpleMeaning: With a long bushy part at the back in black and white bands, this mammal of Mexico and
  the southwestern United States eats anything, like a raccoon.
scope: Also called bassarisk, cacomistle, cacomixle, civet cat, coon cat, miner's cat, raccoon fox, and
  ringtail, this mammal of Mexico and the southwest eats all kinds of food and carries black and white
  bands on its long bushy tail.
examples:
- We saw a ring-tailed cat moving through the brush.
- The ring-tailed cat came out looking for food.
