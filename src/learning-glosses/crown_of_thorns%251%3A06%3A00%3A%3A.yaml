simpleMeaning: Before he was put to death on a cross, Roman soldiers put a false ring of branches with
  sharp points on the head of Jesus
scope: This false ring of branches with sharp points was put on the head of Jesus by Roman soldiers before
  the Crucifixion, and it is not the climbing bushy plant of the same name.
examples:
- The crown of thorns was placed on Jesus before the Crucifixion.
- In the painting, soldiers set the crown of thorns on his head.
