simpleMeaning: the young form of a butterfly or moth, like a worm, often bright in colour and covered
  with hairs or sharp points
scope: The young form of a butterfly or moth, like a small worm; not a worm, and not the grown butterfly
  or moth.
examples:
- A caterpillar was eating the cabbage leaves.
- The caterpillar will turn into a butterfly.
