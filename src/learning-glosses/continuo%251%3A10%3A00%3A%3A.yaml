simpleMeaning: a low part written out in full with numbers that show which notes to play together
scope: A low musical part with numbers that show the chords, also called basso continuo and figured bass;
  not the melody and not a single bass line without numbers.
examples:
- The continuo player followed the numbers to fill in the chords.
- In the Baroque piece, the continuo kept the bass line going.
