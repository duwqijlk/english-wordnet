simpleMeaning: The restriction of waves of light or other rays to shaking in one direction only
scope: What happens when waves of light or other rays are made to shake in one direction only; also called
  polarization; not light that shakes in all directions and not the bending of light.
examples:
- Polarisation cuts the glare from the lake.
- The polarisation of the light changed the view.
