simpleMeaning: A fish that breathes air, with a long body and paired fins made of flesh; some kinds build
  mud cocoons lined with slime to survive dry spells.
scope: The air-breathing fish with fleshy paired fins, not the coelacanth, a similar fleshy-finned fish
  that does not breathe air.
examples:
- The lungfish has a long body and fleshy paired fins.
- Some lungfish survive drought inside mud cocoons lined with slime.
