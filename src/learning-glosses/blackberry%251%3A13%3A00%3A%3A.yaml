simpleMeaning: A large sweet black or very dark purple fruit that you can eat, made of many small parts,
  from bushes of the group called Rubus.
scope: A large sweet dark fruit made of many small parts, not the bush it grows on and not the act of
  picking them.
examples:
- He filled a basket with blackberries for jam.
- She ate a ripe blackberry straight from the bush.
