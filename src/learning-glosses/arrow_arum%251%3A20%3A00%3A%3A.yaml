simpleMeaning: a water plant from North America, one of a group of plants called Peltandra that grow in
  wet places
scope: A North American water plant, not the arrowhead plant and not a garden arum grown for its flowers.
examples:
- Arrow arum grows in the shallow water at the edge of the pond.
- We saw arrow arum along the river bank in Virginia.
