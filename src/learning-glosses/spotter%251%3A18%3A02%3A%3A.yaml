simpleMeaning: a worker at a place that cleans clothes whose job is to take spots off the clothes
scope: This worker at a dry cleaner takes spots out of clothes; this is not the worker who puts spots
  or marks on things.
examples:
- The spotter at the dry cleaner got the dark spot out of my coat.
- She works as a spotter and cleans marks off suits all day.
