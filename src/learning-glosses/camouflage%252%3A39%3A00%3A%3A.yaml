senseId: 'camouflage%2:39:00::'
synsetId: 02163326-v
simpleMeaning: to hide something by changing how it looks, and to use the natural things around it to
  hide it
scope: This is the act of hiding something in this way, not the cloth with green and brown marks and not
  a thing or plan used to trick people.
examples:
- The troops camouflaged their tents with leaves and branches.
- He camouflaged his hiding place with branches and leaves.
