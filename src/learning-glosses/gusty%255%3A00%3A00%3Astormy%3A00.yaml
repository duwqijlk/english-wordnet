simpleMeaning: blowing in short bursts, with quiet times in between
scope: Also called puffy; this is wind that blows in short bursts, not wind that blows strong and steady
  all the time.
examples:
- Gusty winds shook the trees, then stopped, then shook them again.
- It was a gusty day, and leaves blew across the road in short bursts.
