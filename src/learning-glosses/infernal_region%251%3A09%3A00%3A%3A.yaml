simpleMeaning: People who have done wrong suffer punishment that never ends in the place where Satan and
  the powers of evil live, in Christian belief.
scope: Also called the pit, the nether region, and perdition, this is the Christian name for the home
  of Satan and the powers of evil, where people who have done wrong are punished for ever.
examples:
- They said the infernal region was where the powers of evil lived.
- Sinners were sent to the infernal region to suffer for ever.
