simpleMeaning: a sharp pain that hits all at once, much like the hurt you feel from a bug
scope: This is a sharp pain that hits all at once, not a sore mark left by a bug and not a trick to get
  money.
examples:
- She felt the sting of the cold water on her cut, a sharp pain that hit all at once.
- He felt the sting of the nettle on his hand, a sharp pain that came all at once.
