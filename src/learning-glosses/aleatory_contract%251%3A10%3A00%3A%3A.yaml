simpleMeaning: If it turns on a bet, this deal cannot be made to stand in law; if not, one side must act
  only when some unsure thing happens.
scope: A deal in which one side must act only if some unsure thing happens, not a deal where both sides
  must act no matter what.
examples:
- The aleatory contract bound one side to act only if the unsure thing happened.
- An aleatory contract cannot be made to stand in law if it turns on a bet.
