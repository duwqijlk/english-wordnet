simpleMeaning: an agave (a plant with thick, pointed leaves) that is often grown for its good-looking
  leaves
scope: This is a plant often grown for its leaves, not a plant grown mainly for flowers or fruit.
examples:
- A dracaena stood by the window in a large pot.
- She watered the dracaena and wiped dust from its long leaves.
