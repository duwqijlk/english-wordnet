simpleMeaning: People go to this small roadside place in the south-east of the United States to eat and
  drink and dance to music from a jukebox
scope: A small roadside place in the south-east of the United States where people eat, drink and dance
  to jukebox music, also called jook, jook house, juke, juke house or juke joint; not a restaurant with
  no dancing and not a bar with no food.
examples:
- The jook joint down the road was busy every Friday night.
- They met friends at the jook joint to eat and dance.
