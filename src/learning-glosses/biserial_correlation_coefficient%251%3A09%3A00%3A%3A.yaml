senseId: 'biserial_correlation_coefficient%1:09:00::'
synsetId: 06043419-n
simpleMeaning: A number that shows how two things change together, where one thing can take many values
  and the other can take only two.
scope: A number showing how two things change together, one with many values and the other with only two;
  biserial correlation is another name for this sense, not a number for two things that both take many
  values and not a simple count.
examples:
- The biserial correlation coefficient was 0.42.
- She reported the biserial correlation coefficient in her paper.
