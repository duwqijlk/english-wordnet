simpleMeaning: Both the moon and the sun are followed by this way of counting days and months
scope: A system for marking days that follows the moon and the sun, not one that follows only the moon
  or only the sun.
examples:
- The lunisolar calendar sets the date of the New Year.
- Farmers used the lunisolar calendar to plan their planting.
