senseId: 'direct%2:31:00::'
synsetId: 00711834-v
simpleMeaning: To organize and run a complicated project.
scope: This is organizing and running one complicated project; it is not taking somebody somewhere, not
  causing something to go somewhere, not steering a ship, aircraft or vehicle along its path, not aiming
  a weapon, camera or blow at a target, not intending something towards a goal, not telling someone which
  way to go, not simply holding authority over an organization or system, not commanding with authority,
  not guiding actors or conducting a musical performance, not designing something for a particular audience,
  not writing an address on an envelope, not the adjective senses (straight path, no go-between, plain
  or frank manner, unbroken family line, eastward sky motion, proportional relation, one-way current,
  immediate result, exact words, total and unmitigated), and not the adverb meaning without swerving.
examples:
- She directed the rescue effort from a tent at the base of the mountain.
- He directed the merger for six months before stepping down.
