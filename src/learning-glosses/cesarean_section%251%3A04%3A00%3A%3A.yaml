simpleMeaning: The womb is opened by a cut through the belly, and the baby is taken out, a birth once
  thought to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, abdominal delivery, caesarean, caesarean delivery, caesarean section,
  caesarian delivery, caesarian section, cesarean delivery, cesarian, and cesarian section; a birth by
  surgery, not a birth the usual way.
examples:
- The doctors chose a cesarean section to bring the baby out safely.
- She had a cesarean section for her first child.
