simpleMeaning: Milk or a milk-like fluid fills this lump, found most often in the breasts.
scope: This word names a lump in the breasts that holds milk or a milk-like fluid.
examples:
- The galactocele in her breast held milk-like fluid.
- She felt a galactocele in her breast.
