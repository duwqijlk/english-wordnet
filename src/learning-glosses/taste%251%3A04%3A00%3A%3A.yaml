simpleMeaning: The act of sensing what a substance is like, using the small organs on your tongue that
  detect flavour.
scope: This is the act of sensing flavours with your tongue, not the natural ability to do so, and not
  the flavour you actually notice.
examples:
- We did a blind tasting of six red wines.
- The tasting showed that the cheaper bottle was the favourite.
