simpleMeaning: In astronomy, a mark on Mars that is hard to see clearly, once thought to be joined channels,
  but now thought to be something seen that is not really there
scope: This is a mark people thought they saw on Mars, not a tube inside the body and not a long water
  way made for boats.
examples:
- Early maps showed a canal on Mars, but later photos showed no such line.
- He drew each canal he thought he saw on the surface of Mars.
