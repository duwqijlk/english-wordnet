simpleMeaning: A chain of carbon atoms in a fat-based stuff can take in more hydrogen atoms.
scope: This names a fat-based stuff whose carbon chain can take in more hydrogen, not one whose chain
  is already full.
examples:
- The unsaturated fatty acid took in more hydrogen atoms.
- An unsaturated fatty acid can take in more hydrogen.
