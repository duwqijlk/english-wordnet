simpleMeaning: In a narrow place where a river meets the sea, or where two flows of sea water hit each
  other, the tide can raise a great wave, often dangerous.
scope: Also called bore, eager, aegir, and tidal bore, it is a great wave the tide raises where flows
  meet or a river mouth narrows.
examples:
- The eagre rushed up the narrow river mouth.
- The eagre rose where the tides met in the narrow estuary.
