simpleMeaning: A treatment in which a strong shock is sent through the brain to bring on fits and a deep
  loss of waking
scope: A brain treatment using a strong shock, also called electroshock, electroconvulsive therapy and
  electroshock therapy; not a drug treatment and not surgery on the brain.
examples:
- The doctors gave him ECT when the drugs did not help.
- ECT sends a strong current through the brain.
