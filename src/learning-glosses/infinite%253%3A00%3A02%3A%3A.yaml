senseId: 'infinite%3:00:02::'
synsetId: 01012335-a
simpleMeaning: of a verb form that does not show when an action happens, who does it, or one or many,
  like to forms, -ing forms and -ed forms
scope: In grammar, this is about a verb form with no mark for time, person, or number. It is not about
  something with no end or no limit in size or time.
examples:
- In 'to go', the verb is in an infinite form because it shows no time or person.
- An infinite verb form like 'going' does not tell you who is going.
