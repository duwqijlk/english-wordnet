simpleMeaning: a bird of Madagascar that lives on the ground and is active at twilight, eating things
  such as insects and worms
scope: A ground-living bird of Madagascar, active at twilight; not a roller that lives in trees.
examples:
- The ground roller ran across the forest floor instead of flying.
- At dusk, the ground roller hunted insects among the dry leaves.
