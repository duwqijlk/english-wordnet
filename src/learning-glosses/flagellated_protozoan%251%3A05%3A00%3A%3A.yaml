simpleMeaning: A tiny free-living one-celled living thing, mostly not making food from light, with whip-like
  tails; some make people and beasts sick
scope: This is a tiny free-living one-celled living thing with whip-like tails; flagellate, flagellate
  protozoan, mastigophoran and mastigophore are other names for this sense, not a green one-celled thing
  that makes food from light and not a germ with no tail.
examples:
- The flagellated protozoan swam with its whip-like tail.
- A flagellated protozoan can make people sick.
