simpleMeaning: of thoughts, pictures, depictions or wording, matching fact or truth perfectly, and so
  precisely right
scope: This is about thoughts, pictures or wording that are fully true; not the use for a copy or measurement
  that agrees with the original in every detail, nor the absolute use meaning with nothing softened.
examples:
- Her account of the meeting was exact, naming every speaker and every decision.
- The diagram was exact, down to the smallest screw.
