senseId: 'aspergillosis%1:26:01::'
synsetId: 14095041-n
simpleMeaning: a disease, above all in farm workers, from breathing in the spores of a fungus, which make
  lumps in the skin, the ears, and the breathing organs
scope: A disease of farm workers who breathe in fungus spores, not the bird disease of the same name and
  not a general lung infection.
examples:
- The farm worker's aspergillosis came from breathing in mouldy grain dust.
- Aspergillosis left lumps on his skin and in his ears.
