simpleMeaning: to sing or play music with quick wavering notes, going back and forth with the note a half
  step above or below
scope: To sing or play with quick wavering notes, not the single wavering note itself and not the rolling
  of the r sound in speech.
examples:
- The nightingale trilled its song from the top of the tree.
- She trilled the high notes with ease.
