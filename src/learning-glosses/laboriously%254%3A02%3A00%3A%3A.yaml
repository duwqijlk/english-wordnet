simpleMeaning: in a way that takes much time and hard work
scope: This is about doing something with much time and hard work, not about doing it quickly or with
  little effort.
examples:
- She laboriously copied out the whole long list by hand.
- They climbed laboriously up the steep hill with heavy bags.
