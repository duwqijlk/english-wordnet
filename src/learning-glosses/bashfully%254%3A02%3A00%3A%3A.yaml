simpleMeaning: in a shy way, holding back because you feel nervous or not sure of yourself
scope: Also called timidly and shyly, this is doing something in a shy way, not in a brave or sure way.
examples:
- He smiled bashfully and looked down at his shoes.
- She bashfully said her name in a small, quiet voice.
