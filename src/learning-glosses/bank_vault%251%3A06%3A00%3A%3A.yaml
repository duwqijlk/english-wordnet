simpleMeaning: a very strong room or safe box, often made of steel, where money and things of great worth
  are kept safe
scope: 'Also called a vault: a strong locked room or box in a bank for keeping money and valuables safe,
  not a room where money is counted and not a tomb with a curved roof.'
examples:
- The bank vault stood open during the day but was locked at night.
- The jewels were stored in the bank vault behind the thick steel door.
