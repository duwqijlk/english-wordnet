senseId: 'cautery%1:04:00::'
synsetId: 00669355-n
simpleMeaning: The act of making blood clot and killing tissue with a hot iron, a burning chemical, or
  by freezing.
scope: The act of sealing blood and killing tissue with heat, chemicals or cold, not the tool used to
  burn tissue; cauterisation and cauterization are other names for this sense.
examples:
- Cautery stopped the bleeding from the small wound.
- The doctor used cautery to seal the cut and close the wound.
