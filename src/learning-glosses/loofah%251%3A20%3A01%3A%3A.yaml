simpleMeaning: The dried stringy part of the fruit of a plant of the group called Luffa, used as a sponge
  for washing or as a strainer.
scope: The dried stringy fruit part used as a washing sponge or strainer, also called a loofa, loufah
  sponge, or luffa, not the climbing plant itself.
examples:
- She scrubbed her back with a loofah.
- The loofah hung drying beside the bath.
