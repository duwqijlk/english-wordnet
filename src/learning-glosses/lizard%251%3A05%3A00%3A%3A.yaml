simpleMeaning: a reptile (an animal with dry skin and cold blood) with a fairly long body, usually four
  legs, and a tail that gets thin at the end
scope: This is an animal with a fairly long body, usually four legs and a tail that gets thin at the end;
  not a man who spends his time in hotels and bars looking for women who will support him.
examples:
- A small lizard ran across the warm rock.
- The lizard sat in the sun, its long tail lying still.
