senseId: 'impertinence%1:07:01::'
synsetId: 04923043-n
simpleMeaning: the way of being rude and not showing respect, and being ready to do things you have no
  right to do
scope: 'Also called crust, gall, freshness, insolence, impudence and cheekiness: being rude and doing
  what you have no right to do, not being polite or kind.'
examples:
- His impertinence shocked the teacher when he talked back and took her book without asking.
- She showed impertinence by cutting in and telling the old man to move.
