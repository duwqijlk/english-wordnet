simpleMeaning: a way of holding back from letting people do as they like, and of keeping what they do
  inside set limits
scope: Not a fair set of rules, and not simple care about safety; also called unpermissiveness.
examples:
- The restrictiveness of the new rules surprised the staff.
- Her parents' restrictiveness kept her home most evenings.
