simpleMeaning: A rite of staying awake to pray, above all on the night before a religious festival
scope: A rite of staying awake to pray, above all before a religious festival, with watch as another name
  for this sense; not a watch kept to guard a place.
examples:
- They kept vigil through the night before the feast.
- The vigil began at dusk and ended at dawn.
