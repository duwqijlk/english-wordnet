senseId: 'emulous%3:01:00::'
synsetId: 02730939-a
simpleMeaning: showing a wish to match or outdo others, by copying what they do
scope: A wish to match or outdo others by copying them, not mere admiration of them and not copying without
  the wish to match them.
examples:
- His emulous spirit drove him to copy the older painter's best work.
- She looked at her rival with emulous eyes, keen to match her best work.
