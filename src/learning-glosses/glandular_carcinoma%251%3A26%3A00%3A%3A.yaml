simpleMeaning: a harmful growth that starts in the thin skin-like layer of a gland
scope: A harmful growth that starts in the thin skin-like layer of a gland; adenocarcinoma and glandular
  cancer are other names for this sense, not a harmless growth and not a growth in muscle.
examples:
- The doctors found glandular carcinoma in his throat.
- Glandular carcinoma starts in the lining of a gland.
