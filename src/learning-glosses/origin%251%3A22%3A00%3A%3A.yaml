simpleMeaning: the place or thing from which something comes and where it first begins to be
scope: The starting point of something, where it comes from; not the centre point in maths where the lines
  cross, and not a person's family background.
examples:
- The origin of the river is high in the mountains.
- Doctors are still looking for the origin of the illness.
