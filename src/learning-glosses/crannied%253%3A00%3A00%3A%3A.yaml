simpleMeaning: having small cracks or narrow gaps, most often in or between rocks or stones
scope: A surface full of small cracks or narrow gaps, most often in or between rocks or stones, not a
  smooth wall and not a wall with one wide crack.
examples:
- The crannied wall held small plants in its cracks.
- She pressed seeds into the crannied rocks along the path.
