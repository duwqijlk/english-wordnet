simpleMeaning: very good at something because you have done it many times
scope: Very good at a thing after doing it many times; practiced is another name for this sense, and this
  is not merely being trained once or being naturally gifted without work.
examples:
- She was a practised pianist by the age of twelve.
- The practised surgeon worked fast and sure.
