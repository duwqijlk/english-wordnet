simpleMeaning: the act of putting the red liquid that flows in the body, or the clear part of it, into
  one of the tubes that carry it round the body
scope: Also called transfusion, this is the act of putting blood or its clear part into a vein or artery,
  not the act of taking blood out and not a test of the blood.
examples:
- The patient needed a blood transfusion after the operation.
- Doctors gave her a blood transfusion to replace the blood she had lost.
