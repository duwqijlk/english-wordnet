simpleMeaning: likely to stop something from happening or to make it harder to do
scope: Another name for this sense is preventive. It describes something that stops or slows a thing,
  not a medicine that stops illness and not a block in the way.
examples:
- They put preventative locks on the doors to stop thieves from entering.
- The new rules are preventative and make cheating much harder.
