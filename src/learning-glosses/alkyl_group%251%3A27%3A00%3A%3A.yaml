simpleMeaning: One set of atoms from plain chain-like hydrocarbons, with the form CnH2n+1 and able to
  join to just one other set
scope: This group is also called alkyl or an alkyl radical.
examples:
- The alkyl group links to one other part of the molecule.
- The alkyl group came from a plain chain-like hydrocarbon.
