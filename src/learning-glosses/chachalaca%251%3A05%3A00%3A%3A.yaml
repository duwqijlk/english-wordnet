simpleMeaning: People in Central America and Mexico prize as game this slim tree-living guan, a bird that
  looks like a wild turkey.
scope: A slim bird that lives in trees, like a wild turkey; not a turkey itself and not a ground bird.
examples:
- A chachalaca called from the trees at dawn.
- The chachalaca lives in the trees of Central America.
