simpleMeaning: 'To judge a thing or a person with care: what it is like, how good it is, what it can do,
  how far it goes, and how much it matters'
scope: To work out what a thing or a person is like, how good it is, what it can do, how far it goes,
  and how much it matters, also called value, measure, and assess, not to guess without looking.
examples:
- The teacher will evaluate each pupil's work at the end of term.
- We need to evaluate the risks before we sign the contract.
