simpleMeaning: A tree with hand-shaped leaves and large bunches of white to red flowers, followed by brown
  shiny seeds that cannot be eaten.
scope: Also called a horse chestnut; a tree with hand-shaped leaves and bunches of white to red flowers,
  followed by brown shiny seeds that cannot be eaten, not the seed on its own.
examples:
- A buckeye shaded the yard, its white flowers in large bunches.
- The buckeye dropped its brown shiny seeds on the path.
