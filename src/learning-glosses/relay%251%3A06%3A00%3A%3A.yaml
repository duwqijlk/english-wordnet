simpleMeaning: An electric device in which power flowing through it in one wire can turn power in a second
  wire on and off.
scope: An electric device that lets power in one wire switch power in a second wire, not a fresh team
  and not the act of working one.
examples:
- The relay clicked and the lights came on.
- A faulty relay stopped the motor from starting.
