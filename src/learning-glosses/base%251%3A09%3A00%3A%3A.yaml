simpleMeaning: the underlying things accepted as true without proof on which something is started, developed,
  calculated, or explained.
scope: This is not a physical bottom, a chemical, or a main ingredient; it is the set of accepted ideas
  that an argument or system rests on.
examples:
- The new policy was built on a base of old assumptions about family life.
- Before you calculate anything, agree on the base of facts you are working from.
