simpleMeaning: A kind of tiny germ found in soil and in rotting plant and animal matter; some kinds of
  it make drugs that kill germs.
scope: This is a kind of tiny germ of soil and rotting plant and animal matter; grass bacillus, hay bacillus
  and Bacillus subtilis are other names for it; it is a tiny germ, not a virus, and not a plant or an
  animal.
examples:
- Bacillus globigii lives in soil and rotting plant matter.
- Some strains of Bacillus globigii make drugs that kill germs.
