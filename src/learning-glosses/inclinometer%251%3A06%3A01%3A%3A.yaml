simpleMeaning: a tool on a plane that shows how far the plane tilts from level flight
scope: A tool that shows a plane's tilt from the horizon, not a compass and not a tool for measuring magnetic
  dip or land slopes.
examples:
- The pilot checked the inclinometer before the turn.
- The inclinometer showed the plane was tilted ten degrees.
