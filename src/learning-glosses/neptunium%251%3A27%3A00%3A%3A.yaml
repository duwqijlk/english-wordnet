simpleMeaning: A radioactive metal heavier than uranium, found in tiny amounts in uranium ores; it comes
  as a side product of making plutonium.
scope: This is a radioactive metal found in tiny amounts in uranium ores, not uranium itself; also called
  atomic number 93 and Np.
examples:
- Neptunium is found in tiny amounts in uranium ores.
- Neptunium comes as a side product of making plutonium.
