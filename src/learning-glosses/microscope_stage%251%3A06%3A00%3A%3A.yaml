simpleMeaning: The sample is set on this small flat shelf under the lens to be looked at
scope: Also called a stage, this is the flat shelf that holds the sample in place for a close look, not
  the glass piece the sample sits on and not a raised floor for acting.
examples:
- He moved the microscope stage to bring the sample into focus.
- The microscope stage holds the slide steady under the lens.
