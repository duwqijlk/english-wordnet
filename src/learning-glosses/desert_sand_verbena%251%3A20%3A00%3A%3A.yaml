simpleMeaning: A sticky, soft-haired plant with pink trumpet-shaped flowers; it grows in loose, dry ground
  and after heavy rain carpets miles with pink from the southwestern United States to northern Mexico.
scope: This is the low sticky plant that turns sandy western deserts pink after rain, not a garden verbena
  or another sand verbena species.
examples:
- Desert sand verbena covered the dunes with pink after a wet winter.
- The sticky leaves of desert sand verbena trap blowing sand.
