simpleMeaning: a unit of pressure equal to the pressure that holds up a column of mercury (a silver liquid
  metal) 760 mm high at sea level and 0 degrees centigrade
scope: A unit for measuring pressure, not the gases around a planet or star, and not the feeling or mood
  of a place.
examples:
- The pressure inside the tank was measured at two atmospheres.
- Normal air pressure at sea level is one atmosphere.
