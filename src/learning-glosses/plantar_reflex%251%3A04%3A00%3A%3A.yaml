simpleMeaning: the curling of the toes when the sole's outer edge is stroked firmly from heel to front
  in people over 2, while under 2 children should straighten (the Babinski reflex).
scope: The toe response to stroking the sole, with results that differ by age; the Babinski reflex is
  a separate sense for the upward toe movement that warns of brain or spinal injury, and the ankle jerk
  is a different leg reflex.
examples:
- The nurse tested the plantar reflex by stroking the outer edge of the sole.
- In children under two, the plantar reflex normally straightens the toes.
