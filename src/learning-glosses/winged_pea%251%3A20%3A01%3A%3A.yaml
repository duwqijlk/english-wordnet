simpleMeaning: a plant that lies flat along the ground, from Europe, that lives for one year and has a
  pod with four thin flat sides you can eat
scope: This is a low-growing European plant with a pod you can eat; asparagus pea is another name for
  this sense, and it is not the climbing vine with purplish flowers.
examples:
- The winged pea spread across the garden bed.
- We picked the winged pea pods while they were still young.
