simpleMeaning: shaped like a tube or an egg, with swollen parts and narrow parts that follow one after
  the other
scope: This is a shape like a tube or an egg, swollen in places and narrow in others; not smooth all along
  and not round like a ball.
examples:
- The torulose stem swelled and narrowed along its length.
- The torulose seed pod had swollen parts with narrow parts between them.
