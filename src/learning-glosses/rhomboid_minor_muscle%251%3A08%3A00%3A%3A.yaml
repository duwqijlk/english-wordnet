simpleMeaning: The shoulder blade is pulled toward the backbone and a little upward by this band of flesh,
  shaped like a slanted square.
scope: Lesser rhomboid muscle and musculus rhomboideus minor are other names for this band of flesh, which
  pulls the shoulder blade toward the backbone and a little upward.
examples:
- The rhomboid minor muscle pulled the shoulder blade toward the backbone.
- The rhomboid minor muscle drew the shoulder blade a little upward.
