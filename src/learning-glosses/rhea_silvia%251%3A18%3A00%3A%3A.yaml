simpleMeaning: In Roman myth, a virgin priestess who became the mother of the twins Romulus and Remus
  by Mars.
scope: Also called Rea Silvia; in Roman myth, the priestess who bore Romulus and Remus, not a mortal queen
  and not a goddess.
examples:
- Rhea Silvia was the mother of Romulus and Remus.
- In the old tale, Rhea Silvia bore twins fathered by Mars.
