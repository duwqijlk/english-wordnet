simpleMeaning: In chemistry, the face where two things meet, such as two liquids, two solids, or two states
  of a substance
scope: In chemistry, the face where two things meet, not a computer link and not a program you use on
  a screen.
examples:
- The oil and water meet at an interface in the jar.
- Chemists study what happens at the interface between the two liquids.
