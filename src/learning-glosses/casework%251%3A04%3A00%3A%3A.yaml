simpleMeaning: Close study of a person or family and their life with other people, when they are not fitting
  in, to find what is wrong and how to help them.
scope: This is close study of how a troubled person or family live with others around them, to find what
  is wrong and how to help; not a study of a group in general, and not medical treatment on its own.
examples:
- The social worker began casework with the family after the court order.
- Casework helped the team understand why the boy kept running away.
