simpleMeaning: A tall leafy European plant that lives two years or more and bears bunches of tube-shaped
  pink-purple blooms; its foliage provides the heart drug digitalis but poisons livestock.
scope: The European foxglove, the same poisonous plant that finger-flower and fingerroot name; not a bellflower
  or another plant with hanging bell-shaped blooms.
examples:
- A row of fairy bells along the hedge sent up tall spikes of purple bloom.
- He admired the fairy bell in the meadow without knowing that its leaves are poisonous.
