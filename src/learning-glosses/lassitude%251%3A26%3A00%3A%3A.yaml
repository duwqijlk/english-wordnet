senseId: 'lassitude%1:26:00::'
synsetId: 14038461-n
simpleMeaning: A state in which a person lies still and cannot move or wake up, as in sleeping sickness.
scope: Also called lethargy; a still, unmoving state, as in sleeping sickness, not a general lack of energy
  or drive.
examples:
- The lassitude of sleeping sickness left him lying still for hours.
- She sank into a lassitude from which nothing could rouse her.
