simpleMeaning: a person who twists thin strands of silk or rayon into a thread or yarn
scope: 'Also called throwster: this is the worker who twists silk or rayon into thread, not a person who
  shapes clay pots on a wheel and not someone who throws a ball.'
examples:
- The thrower twisted silk strands into strong thread.
- In the old mill, each thrower worked with fine rayon yarn.
