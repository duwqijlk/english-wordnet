simpleMeaning: too much carotene, the yellow-orange colour in some foods, in the blood, which can turn
  the skin pale yellow or red
scope: Too much carotene in the blood, which can turn the skin pale yellow or red, not a lack of carotene
  and not a skin colour a person is born with.
examples:
- Her carotenemia turned her palms a pale yellow.
- The doctor said his carotenemia came from too much carotene in his blood.
