simpleMeaning: a sickness spread by a virus, SARS-CoV-2, that spread round the world in 2020
scope: A sickness from the SARS-CoV-2 virus, also called corona, coronavirus and novel coronavirus pneumonia;
  not the virus itself and not a common cold.
examples:
- She caught coronavirus disease 2019 in the spring of 2020.
- Coronavirus disease 2019 kept many schools closed for months.
