simpleMeaning: A picture held as a flat grid of brightness numbers for tiny dots.
scope: A picture held as a grid of brightness numbers, also called a bitmap; not a picture on paper and
  not a moving film.
examples:
- The electronic image on the screen was made of tiny dots of light.
- She saved the electronic image as a file on her computer.
