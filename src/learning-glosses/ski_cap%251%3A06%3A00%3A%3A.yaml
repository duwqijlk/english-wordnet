simpleMeaning: A snug woollen head covering, often with a long thin tail ending in a tuft of threads
scope: A snug woollen head covering, often with a long thin tail ending in a tuft of threads, also called
  stocking cap or toboggan cap; not a wide-brimmed hat and not a hood.
examples:
- She pulled her ski cap low over her ears.
- His ski cap had a tail with a tassel that swung as he walked.
