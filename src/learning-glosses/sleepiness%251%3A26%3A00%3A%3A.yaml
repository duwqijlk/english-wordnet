simpleMeaning: the state of feeling very tired and wanting to close your eyes and rest
scope: The feeling of being very tired and ready to rest; not tiredness from hard work alone, and not
  the act of resting itself.
examples:
- His sleepiness made it hard to keep his eyes open while driving.
- After lunch, a feeling of sleepiness came over the whole class.
