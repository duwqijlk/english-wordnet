simpleMeaning: In the manner of a stage show that mocks serious things with broad, earthy humour.
scope: In the manner of a stage show that mocks serious things with broad, earthy humour; not the show
  itself, and not a piece that copies someone's style.
examples:
- The show had a burlesque edge, mocking the old plays.
- Her burlesque turn brought the house down.
