simpleMeaning: using force to take money or things from a person or vehicle on a journey, or taking control
  of a vehicle by force
scope: Stealing from people on a journey or taking a vehicle by force, not a theft from a house or shop.
examples:
- The hijacking of the bus frightened all the passengers on board.
- Police stopped a hijacking at the airport and freed the travellers.
