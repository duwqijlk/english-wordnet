simpleMeaning: a low bush with green leaves all year, from the far north of Europe, Asia, and America,
  that bears red fruit you can eat
scope: A low evergreen bush of the far north with red fruit you can eat, also called cowberry, foxberry,
  lingenberry, lingonberry, and mountain cranberry; not a cranberry bush and not a blueberry bush.
examples:
- Lingberry bushes grow low across the far north of Europe.
- We picked red lingberry fruit and ate it on the walk.
