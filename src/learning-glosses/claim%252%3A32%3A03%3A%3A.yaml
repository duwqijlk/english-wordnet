senseId: 'claim%2:32:03::'
synsetId: 00760378-v
simpleMeaning: To present an idea as your own, especially when you want credit for it.
scope: This is the sense of taking credit for an idea, not the noun senses for a stated right to money
  or property, a statement that something is true, a demand for something due or a plain demand, an informal
  right, or an established right, not the verb sense for stating something strongly as true, not the verb
  sense for demanding something as your due or property, not the verb sense for asking for something legally,
  and not the verb sense for taking something as an unwanted result of an event.
examples:
- He tried to claim credit for a design that his colleague had drawn.
- The director was happy to claim the idea as her own in front of the board.
