simpleMeaning: A cord in the body that carries signals to the muscles or glands, telling them to work.
scope: Also called efferent and efferent nerve; a cord that carries signals to muscles or glands, not
  a cord that carries signals from the senses to the brain.
examples:
- The motor nerve tells the muscle to tighten.
- Damage to a motor nerve weakens the arm.
