simpleMeaning: A light, highly flammable blend made from crude oil, used mainly to power the engines of
  cars and other vehicles.
scope: The British name for the fuel North Americans call gasoline; not diesel, a heavier fuel for different
  engines.
examples:
- We filled the car with petrol before leaving London.
- Petrol prices have gone up sharply this month.
