simpleMeaning: having a lot of rich detail for show, with the same shapes on both sides
scope: This word describes a thing that has rich, even detail for show; it does not name the old European
  art style itself, and it is not limited to art and buildings from 1600 to 1750.
examples:
- The hall had a baroque mirror with gold curls the same on each side.
- She chose a baroque frame covered in rich, even detail.
