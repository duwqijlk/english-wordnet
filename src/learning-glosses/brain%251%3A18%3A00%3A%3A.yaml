simpleMeaning: A person with outstanding intelligence and a talent for original ideas.
scope: This is the noun for a very clever and original person, not the organ inside the skull, not mental
  ability in general, not the mind or seat of reason, not meat taken from an animal's head, not the verb
  sense for hitting someone on the head, and not the verb sense for killing by smashing the skull.
examples:
- She was the brain behind the company's most successful product.
- They hired him because he is a real brain in mathematics.
