simpleMeaning: a low plant that comes back year after year, with leaves that are pale grey underneath,
  found in the north of the United States, Europe and Asia
scope: A low plant that comes back year after year, with pale grey leaf undersides, also called goose-tansy
  and goose grass; not a tall shrub and not a twining shrub with purple flowers.
examples:
- Silverweed spread low across the damp ground.
- We found silverweed growing near the path in the north of the country.
