simpleMeaning: the bone-linked muscle of the upper arm, starting from three places, that straightens the
  lower arm when it tightens
scope: 'Also called the triceps brachii: the bone-linked muscle of the upper arm, starting from three
  places, that straightens the lower arm when it tightens; not the biceps and not a leg muscle.'
examples:
- The musculus triceps brachii straightens the arm.
- When the musculus triceps brachii tightens, the lower arm moves back.
