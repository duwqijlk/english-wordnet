simpleMeaning: A piece of writing that judges a book, play, or other work, saying what is good and bad
  in it.
scope: A written judgment of a book or play; not the act of judging itself.
examples:
- Her critique of the new play appeared in the paper.
- I read a long critique of his latest novel.
