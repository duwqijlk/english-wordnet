senseId: 'cheek_muscle%1:08:00::'
synsetId: 05301567-n
simpleMeaning: a band of flesh in the face that flattens the side of the face and pulls the corner of
  the mouth back
scope: A band of flesh in the face that flattens the side of the face and pulls the corner of the mouth
  back; buccinator muscle and musculus buccinator are other names for this sense, not a jaw muscle and
  not a lip muscle.
examples:
- The cheek muscle pulled the corner of his mouth back as he smiled.
- A sore cheek muscle made it hard for her to chew.
