simpleMeaning: made neat and orderly because its edges or ends have been shortened.
scope: This describes a tidy result after the edges are trimmed, not the act of slicing something into
  pieces.
examples:
- The hedge looked crisp and neatly cut after the gardener finished.
- He arrived with freshly cut hair and a pressed shirt.
