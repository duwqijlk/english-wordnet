simpleMeaning: any illness that causes pain in the joints, the muscles, or the tissues that join parts
  of the body together
scope: Any painful illness of the joints, muscles, or joining tissues, not a single named illness and
  not pain from a hurt or a wound.
examples:
- His rheumatism made his knees hurt on cold days.
- She could not bend her fingers well because of her rheumatism.
