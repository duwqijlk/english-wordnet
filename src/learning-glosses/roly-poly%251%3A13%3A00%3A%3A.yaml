simpleMeaning: Baked or steamed, jam or fruit spread on hard fat pastry and folded into a long tube makes
  a sweet dish.
scope: Roly-poly pudding is another name for this sweet dish, made of hard fat pastry spread with jam
  or fruit, folded into a long tube and baked or steamed.
examples:
- We had roly-poly for pudding.
- She made a roly-poly with jam.
