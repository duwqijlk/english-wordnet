simpleMeaning: to make a sound less strong, especially by wrapping something around the thing that makes
  it
scope: 'Also called dull, damp, muffle and dampen: this is making a sound less strong, especially by wrapping,
  not the thing put on an instrument to soften its sound and not being unable to speak.'
examples:
- He muted the bell by wrapping it in cloth.
- They muted the noise by wrapping the machine in thick cloth.
