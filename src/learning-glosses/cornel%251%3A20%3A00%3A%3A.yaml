simpleMeaning: On a tree or shrub of one group, leaf-like parts often open out, bright and showy, like
  flowers.
scope: This tree or shrub of one group, often with showy leaf-like parts like flowers, is also called
  a dogwood or a dogwood tree.
examples:
- The cornel's bracts looked like flowers.
- We planted a cornel for its showy bracts.
