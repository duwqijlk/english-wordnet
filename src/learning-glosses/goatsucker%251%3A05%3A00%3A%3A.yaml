simpleMeaning: Big eyes and speckled grey-brown feathers mark birds that are out mostly at dusk or night,
  not among the songbirds, and that eat insects.
scope: Also called nightjar and caprimulgid, this is a dusk or night bird with big eyes that eats insects,
  not a daytime songbird.
examples:
- The goatsucker flew out at dusk to catch insects.
- A goatsucker sat still on a branch all day.
