simpleMeaning: A plant with soft, non-woody stems grown for a part eaten as food, such as a beet root,
  spinach leaf, bean seed, or broccoli head.
scope: This is the plant grown for an edible part, not the edible parts themselves when sold or cooked;
  it is a food crop, not a herb used only for flavour.
examples:
- Spinach is a vegetable grown for its leaves, while beet is grown for its root.
- The farmer chose a vegetable that thrives in cool weather and planted broccoli for its flower buds.
