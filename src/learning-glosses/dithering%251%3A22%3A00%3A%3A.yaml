synsetId: 13489989-n
simpleMeaning: a way of showing colors that lie between other colors, by using patterns of tiny colored
  dots, so it looks like the color you want
scope: This is a way of making colors in a picture or on a screen with tiny dots, not waiting for a long
  time because you cannot decide what to do.
examples:
- The dithering in the photo made the grey sky look smooth.
- The program uses dithering to show colors the screen cannot make on its own.
