simpleMeaning: Many things in the body, such as epinephrine, norepinephrine, and serotonin, gain oxygen
  faster with the help of this body chemical.
scope: A body chemical that speeds up the adding of oxygen to many things in the body, such as epinephrine,
  norepinephrine, and serotonin.
examples:
- Monoamine oxidase acts on epinephrine in the body.
- Scientists study monoamine oxidase to learn how it works on serotonin.
