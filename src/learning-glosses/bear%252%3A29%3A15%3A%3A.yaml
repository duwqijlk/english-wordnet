simpleMeaning: Do things in a certain way, so that others can see it in how you carry yourself.
scope: This is about the way a person acts, not about enduring something painful or physically supporting
  a weight.
examples:
- He bore himself with dignity throughout the questioning.
- She bears herself with the confidence of someone twice her age.
