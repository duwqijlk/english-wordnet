simpleMeaning: to manage to catch or hold a person or thing, especially after chasing them
scope: 'Also called get and catch: to catch a person or thing, especially after a chase, not catching
  an animal in a trap and not making a body in space change its path.'
examples:
- The police captured the thief after a long chase through the streets.
- After running for an hour, the guards finally captured the escaped prisoner.
