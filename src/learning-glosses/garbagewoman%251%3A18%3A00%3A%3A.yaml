simpleMeaning: for pay, a female worker takes away the waste people throw away and throws it out
scope: A woman paid to take away and get rid of waste, also called a dustwoman or a garbage woman, not
  a man who does the same work and not a woman who makes waste.
examples:
- The garbagewoman loaded the bins onto the back of the truck.
- A garbagewoman came down our road early this morning.
