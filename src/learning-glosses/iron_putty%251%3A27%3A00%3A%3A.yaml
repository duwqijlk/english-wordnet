simpleMeaning: a paste that sets hard like putty, made by mixing iron oxide and boiled linseed oil, that
  acid does not harm
scope: A paste that sets hard like putty and stands up to acid, not soft putty for windows and not a glue.
examples:
- He sealed the pipe joint with iron putty before the acid test.
- The iron putty had set hard by morning and the acid left no mark.
