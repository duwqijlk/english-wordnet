simpleMeaning: a favour or advantage given to one side over another, especially to a country in trade,
  such as by setting lower taxes on what it sends in
scope: A favour or advantage given to one side over another, especially to a country in trade, not a person's
  liking for one thing over another.
examples:
- The treaty gave our goods a preference in their ports.
- A preference for goods from the old colonies shaped the trade.
