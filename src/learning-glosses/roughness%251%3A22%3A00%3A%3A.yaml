simpleMeaning: small holes that form in a surface when chemicals or rust slowly damage it
scope: 'Also called pitting and indentation: small holes formed in a surface by slow chemical damage;
  not an uneven feel across a whole surface and not a harsh quality for the senses.'
examples:
- Close up, the roughness on the old pipe was made of tiny pits in the metal.
- The roughness on the bridge steel turned out to be small pits from rust.
