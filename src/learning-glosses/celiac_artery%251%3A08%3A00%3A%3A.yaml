simpleMeaning: 'An artery that leaves the abdominal aorta just below the diaphragm and splits into three:
  the left gastric, common hepatic and splenic arteries.'
scope: The artery that carries blood from the abdominal aorta to the stomach, liver and spleen; the same
  vessel is also called the celiac trunk. It is not the aorta itself, nor the mesenteric arteries, which
  supply the intestines. The term belongs to anatomy.
examples:
- The celiac artery was clamped during the operation on the stomach.
- A narrowing of the celiac artery can cause pain after meals.
