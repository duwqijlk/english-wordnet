simpleMeaning: one time when something springs back or bounces back
scope: This is one single act of springing back, not the general quality in a material that lets it return
  to its shape after being bent or pressed.
examples:
- 'There was a quick resilience in the branch: it sprang back as soon as he let go of it.'
- We saw the ball's resilience when it bounced straight back off the wall.
