simpleMeaning: A drug bringing on abortion, sold as RU 486, made in France, which, taken in the first
  five weeks of pregnancy, stops progesterone, so the womb sheds the young.
scope: This sense is also called mifepristone.
examples:
- An abortion pill stops progesterone.
- Abortion pills are made in France.
