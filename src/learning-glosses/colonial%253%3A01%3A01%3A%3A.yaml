senseId: 'colonial%3:01:01::'
synsetId: 02710935-a
simpleMeaning: about animals, such as ants, that live together in a group
scope: This sense is about animals that live together in a group, like ants; it is not about a colony
  in general or a person who lives in a colony, and it is not about many small living things joined together
  to make one whole.
examples:
- Ants are colonial animals that live and work together in one large group.
- The bees in this hive are colonial, and hundreds of them share one home.
