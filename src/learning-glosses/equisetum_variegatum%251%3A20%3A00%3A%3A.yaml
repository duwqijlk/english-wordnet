simpleMeaning: Greenland, the north of North America, and the north and middle of Europe are the lands
  where it grows.
scope: Also called variegated horsetail and variegated scouring rush; it is one of the horsetails, the
  one that grows in the north of North America, in Greenland, and in the north and middle of Europe.
examples:
- Equisetum variegatum grows in the north of North America.
- In Greenland, Equisetum variegatum grows in the wild.
