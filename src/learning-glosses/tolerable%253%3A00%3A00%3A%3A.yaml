simpleMeaning: Able to be lived through or lived with, even if it is not pleasant
scope: Able to be lived through or lived with, even if it is not pleasant; not so bad that a person cannot
  go through it.
examples:
- The heat in the small room was tolerable, so we stayed there all afternoon.
- The pain after the run was tolerable and soon passed.
