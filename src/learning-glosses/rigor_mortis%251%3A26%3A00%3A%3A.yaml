simpleMeaning: a short-lived stiffening of the joints and muscles that sets in after death
scope: Not the stiffening of a live limb, and not the cold of a dead body; a short-lived stiffening after
  death.
examples:
- Rigor mortis had set in by morning.
- The doctor noted rigor mortis in the arms.
