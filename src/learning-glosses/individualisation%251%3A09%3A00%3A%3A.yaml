simpleMeaning: telling one thing apart from the general group or kind it belongs to
scope: Telling one thing apart from the general group or kind it belongs to; individuation and individualization
  are other names for this sense, not sorting things into groups and not judging one person.
examples:
- The individualisation of each case took the court hours.
- His individualisation of the plants helped the class tell them apart.
