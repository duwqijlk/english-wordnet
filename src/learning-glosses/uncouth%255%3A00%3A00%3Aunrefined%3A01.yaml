simpleMeaning: rough and rude in behaviour, with no good manners or good taste
scope: 'Also called common, coarse, and vulgar in this sense: rough in manners and lacking good taste,
  not unkind in a planned way and not just badly dressed.'
examples:
- His uncouth behaviour at the table shocked the other guests.
- She thought his loud, uncouth jokes were rude and in bad taste.
