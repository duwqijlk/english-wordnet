simpleMeaning: The personal quality of moving or behaving with speed and energy.
scope: This is a lasting personal quality of energetic movement, not the temporary condition of being
  busy or doing things, and not the chemical ability of a substance to react.
examples:
- His constant activity kept the whole team moving.
- The doctor was surprised by the old man's activity at ninety.
