simpleMeaning: to do with work on the body done by cutting it open, or with the tools and acts used in
  that work
scope: To do with cutting into the body for treatment, not the narrower sense of treatment by cutting
  rather than by drugs alone, and not medical care that uses no cutting.
examples:
- The surgeon laid out the surgical instruments on a tray.
- The patient needed surgical treatment for the broken leg.
