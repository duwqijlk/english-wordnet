simpleMeaning: In genetics, something happens to the inherited material of a living thing, changing the
  chain that parents pass on and that shapes the young
scope: 'Also called mutation and genetic mutation: a change in the inherited genes, not a change in the
  body caused by injury.'
examples:
- A chromosomal mutation changed the plant's genes.
- The test can spot a chromosomal mutation in the baby's cells.
