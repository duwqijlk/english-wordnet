simpleMeaning: a place on the coast in China, Korea or Japan where ships once came to trade, because of
  a deal between countries
scope: This is a coastal trading place in China, Korea or Japan that was once open to foreign ships under
  a deal; not any port, and not the deal itself.
examples:
- Shanghai was a treaty port where foreign ships could trade.
- The treaty port opened its docks to ships from many countries.
