simpleMeaning: In geology, a split in the earth's hard outer layer, with the rock on one side slipped
  past the rock on the other side
scope: This is a split in the earth's hard outer layer, with the rock on one side slipped past the rock
  on the other side; break, shift, fault, fracture and faulting are other names for this sense, not a
  crack from drying and not a mistake.
examples:
- They built the house right over a geological fault.
- He studied the faulting of the earth's crust.
