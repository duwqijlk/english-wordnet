simpleMeaning: Cleaning the blood to remove toxic substances and body waste from the bloodstream, used
  when the kidneys have failed.
scope: Also called haemodialysis.
examples:
- The patient went for hemodialysis when the kidneys failed.
- Hemodialysis takes poisons out of the blood.
