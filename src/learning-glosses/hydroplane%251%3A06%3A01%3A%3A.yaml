simpleMeaning: At great speed, this motor boat rises on wing-shaped parts below it and skims along the
  top of the water.
scope: Also called a hydrofoil, this motor boat rises on wing-shaped parts below it and skims along the
  top of the water.
examples:
- The hydroplane lifted out of the water as it gathered speed.
- A hydroplane passed us, skimming the top of the waves.
