simpleMeaning: to give a piece of metal the power to pull iron or steel toward it
scope: This sense is about giving metal this pulling power. It is not about drawing a person's interest
  strongly, as a story or a person can do.
examples:
- The strong magnet magnetized the iron shavings.
- He magnetized the nail by rubbing it on a magnet.
