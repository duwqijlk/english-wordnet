simpleMeaning: The making of a whole idea; the act of joining ideas into one clear thing to think about
scope: The making of a whole idea by joining ideas into one clear thing; construction is another name
  for this, not the breaking apart of ideas and not a single idea on its own.
examples:
- Mental synthesis joins ideas into one clear thought.
- The essay showed mental synthesis at its best.
