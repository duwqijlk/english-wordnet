simpleMeaning: small fish that live on the sea floor, with eyes that have narrow slits, found on the steep
  sides of the sea floor near land
scope: Small fish that live on the sea floor, not large open-water fish and not a fish that swims near
  the top of the sea.
examples:
- The cat shark rested on the sea floor, its narrow eyes watching the sand.
- We saw a cat shark on the steep slope below the shelf.
