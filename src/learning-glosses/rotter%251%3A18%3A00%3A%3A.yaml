simpleMeaning: Someone others judge to be so bad that people hate them and give them no respect.
scope: Also called a rat, a crumb, a git, a skunk, a puke, a bum, a scumbag, a stinker, a lowlife, or
  a stinkpot, this is a person others judge to be so bad that people hate them and give them no respect.
examples:
- Only a rotter would leave their friends to pay the bill.
- The neighbours called the newcomer a rotter after the lies came out.
