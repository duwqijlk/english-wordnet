simpleMeaning: A person who sells goods the law does not allow to be sold.
scope: A seller of goods the law forbids, not a person who keeps goods to sell and not a person who buys
  and sells shares for their own account.
examples:
- The police arrested the dealer who sold stolen radios.
- A dealer in stolen goods was caught by the police.
