simpleMeaning: not easy to notice because it does not stand out
scope: Not easy to notice because it does not stand out, not the sense of a thing that cannot be seen
  at all.
examples:
- He sat quietly in the corner, almost invisible, and nobody noticed him during the meeting.
- The small print at the bottom of the page is nearly invisible if you do not look for it.
