senseId: 'conceptualism%1:09:00::'
synsetId: 05978404-n
simpleMeaning: The view that using one general word for many things shows there is a thought in the mind
  that links the word to the things
scope: The view that one general word for many things shows a thought in the mind linking word and things,
  not the view that the things share a real form and not the view that only the word exists.
examples:
- Conceptualism holds that general words point to thoughts in the mind.
- The philosopher defended conceptualism against those who denied it.
