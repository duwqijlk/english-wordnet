simpleMeaning: Your mind is held with pleasure and kept from worries and vexations by this entertainment.
scope: Also called a distraction, this entertainment holds your mind with pleasure and keeps it from worries
  and vexations.
examples:
- The beguilement held their interest with pleasure and kept worries away.
- A beguilement took our minds off our worries and vexations.
