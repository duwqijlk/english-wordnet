simpleMeaning: A fat-like chemical with a bad smell, found above all in butter
scope: A fat-like chemical with a bad smell, found above all in butter; butyric acid is another name for
  this sense, not a sweet-smelling chemical and not a fat itself.
examples:
- Butanoic acid gives old butter its bad smell.
- The smell of butanoic acid is sharp and foul.
