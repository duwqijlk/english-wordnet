senseId: 'spark_advance%1:07:00::'
synsetId: 05058239-n
simpleMeaning: when the flash that lights the fuel comes, compared with where the piston (the part that
  moves up and down) is in an engine that burns its fuel inside
scope: The time of the flash that lights the fuel, compared with where the piston is in the engine, also
  called lead; not the flash itself, and not the speed of the engine.
examples:
- The mechanic adjusted the spark advance to get the engine to run smoothly.
- Too much spark advance can make the engine knock.
