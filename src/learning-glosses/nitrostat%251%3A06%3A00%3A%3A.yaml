simpleMeaning: Trade names for nitroglycerin, used to widen the blood vessels of the heart in the treatment
  of angina (chest pain caused by too little blood reaching the heart muscle)
scope: Also called Nitrospan; trade names for nitroglycerin, used to widen the blood vessels of the heart
  in the treatment of angina (chest pain caused by too little blood reaching the heart muscle), unlike
  the drug itself and unlike other heart drugs.
examples:
- The doctor gave him Nitrostat for his angina.
- Nitrostat widens the blood vessels of the heart.
