simpleMeaning: In Japan, people wear this foot covering with the big toe kept apart, slipping it on under
  sandals held by a strap between the toes.
scope: Tabi is another name for this foot covering, with a separate place for the big toe, that people
  in Japan slip on under sandals held by a strap between the toes.
examples:
- Before putting on sandals, tabis are pulled on.
- The tabis kept the big toe separate while walking.
