simpleMeaning: people meeting in a formal or official way for a party or a ceremony
scope: 'Also called function and affair: a formal social meeting or rite, not a reason for doing a thing
  and not the act of causing a thing.'
examples:
- The wedding was a grand occasion for the whole town.
- An occasion was held to honour the president.
