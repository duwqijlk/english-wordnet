simpleMeaning: 'Parts on each side of its head give off strong electric shocks: this slow ray of the group
  Torpediniformes lives on the sea floor with a round body.'
scope: 'Also called torpedo, crampfish, and electric ray: a slow ray on the sea floor that gives off strong
  electric shocks, not a ray with no electric parts.'
examples:
- The numbfish gave off a strong electric shock when touched.
- A numbfish rests on the sea floor with its round body flat.
