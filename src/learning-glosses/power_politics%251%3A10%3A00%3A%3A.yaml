simpleMeaning: Countries say they will use armed strength in talks, to get what they want
scope: 'Another name for gunboat diplomacy: talks between countries backed by threats of armed strength,
  not the daily work of running a country and not a fight itself.'
examples:
- The two sides used power politics to force a deal.
- Power politics shaped the talks, with each side threatening war.
