simpleMeaning: Hard moral questions are settled by broad rules of good conduct, in the study of right
  and wrong
scope: This is the study of right and wrong that uses broad rules of good conduct to settle hard moral
  questions, not clever talk meant to mislead.
examples:
- They turned to casuistry when the hard moral question arose.
- The priest used casuistry to work out what was right in the hard case.
