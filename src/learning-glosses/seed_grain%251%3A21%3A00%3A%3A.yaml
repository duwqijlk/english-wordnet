simpleMeaning: good quality kernels kept aside to be sown, such as the kernels of corn
scope: Good quality kernels kept aside for planting, also called seed corn; not kernels meant for eating
  and not poor kernels used for feed.
examples:
- The farmer saved the seed grain for planting.
- She stored the seed grain in a dry bin.
