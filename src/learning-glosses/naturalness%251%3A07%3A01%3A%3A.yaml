simpleMeaning: how closely a picture, sound, or copy looks or sounds like the real thing it shows
scope: This sense is about how much a picture or recording is like the real thing it shows, not about
  the quality of being simple and not made by people, which is another sense of the same word.
examples:
- Engineers worked to improve the naturalness of the recorded music.
- The naturalness of the painting made the fruit look real.
