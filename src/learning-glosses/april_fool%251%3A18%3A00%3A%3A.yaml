senseId: 'april_fool%1:18:00::'
synsetId: 09820698-n
simpleMeaning: A person who is the target of a joke played on the first day of the fourth month
scope: The person a joke is played on, not the joke itself, and not a person tricked at any other time.
examples:
- He was the April fool when his friends hid his shoes on April 1st.
- She laughed at herself after becoming the April fool of the office.
