simpleMeaning: A measure for dry goods in the United States, holding as much as 2 pints or 67.2 cubic
  inches
scope: A United States dry measure of 2 pints, not the United States liquid measure of 32 fluid ounces
  and not the British measure.
examples:
- She bought a quart of dry beans at the market.
- He filled a quart with fresh blueberries.
