simpleMeaning: The largest living thing, this very tall tree keeps its leaves all year at the south end
  of the low hills west of the Sierra Nevada in California.
scope: The giant sequoia is another name for this largest living thing, a very tall tree of the Sierra
  Nevada in California, not just any tall tree of the west.
examples:
- The big tree at the south end of the hills is the largest living thing.
- Visitors come to see the big tree, a very tall evergreen of California.
