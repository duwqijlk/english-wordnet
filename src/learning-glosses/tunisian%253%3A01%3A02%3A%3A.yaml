simpleMeaning: The city of Tunis is what this word is about, or the people who live there.
scope: To do with the city of Tunis or the people who live there, not with the whole country of Tunisia,
  and not a person from Tunisia.
examples:
- The Tunisian markets in the old city are full of spices.
- Tunisian shopkeepers in the city open early.
