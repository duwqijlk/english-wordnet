simpleMeaning: 'A high woodwind instrument (played by blowing): a thin tube shut at one end, with finger
  holes on one end and a hole near the shut end you blow across'
scope: This is the musical instrument you blow across. It is not a groove in cloth or on a column, and
  not a tall thin wine glass.
examples:
- The girl plays the flute in the school band.
- He picked up his flute and played a high, clear tune.
