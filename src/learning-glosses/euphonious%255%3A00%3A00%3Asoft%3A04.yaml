senseId: euphonious%5:00:00:soft:04
synsetId: 01458000-s
simpleMeaning: A sound that is nice to hear, with nothing rough or sharp in it, said of speech or a way
  of speaking
scope: Of speech or a dialect, nice to hear, not a rough voice and not a voice that hurts the ear.
examples:
- Her euphonious voice made the long story easy to hear.
- The actor's euphonious speech won praise from the crowd.
