simpleMeaning: In baseball, the team job of the player who throws the ball for a player from the other
  team to try to hit
scope: 'Also called pitcher: this is the job of the player who throws the ball in baseball, not the small
  raised place of earth where that player stands, and not a heap of earth or stones.'
examples:
- They have a new left-handed player on the mound today.
- He took the mound and threw the first ball of the game.
