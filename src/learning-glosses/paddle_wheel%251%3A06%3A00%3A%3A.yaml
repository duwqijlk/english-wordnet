simpleMeaning: A big turning ring with flat blades, driven by an engine to push a boat along
scope: A big turning ring with flat blades that pushes a boat along; paddlewheel is another name for it,
  not the wheel that steers the boat.
examples:
- The paddle wheel churned the river water white.
- Each paddle wheel was driven by the steam engine.
