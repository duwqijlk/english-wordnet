simpleMeaning: A secret group in Sicily that used terror; it first fought cruel rule, then became a criminal
  band in the middle of the 1800s.
scope: This is a secret group in Sicily that used terror, first against cruel rule and then as a criminal
  band in the middle of the 1800s; Mafia and Sicilian Mafia are other names for this sense, and it is
  not the crime group of the United States.
examples:
- The Maffia began in Sicily as a secret group against cruel rule.
- By the middle of the 1800s, the Maffia had become a criminal band.
