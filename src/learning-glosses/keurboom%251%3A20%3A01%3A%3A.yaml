simpleMeaning: A tree with leaves in pairs along a stem, one leaf at the end, and loose bunches of sweet-smelling
  flowers from pink to purple.
scope: This is the tree with pink to purple flowers, not the fast-growing round-headed kind with white
  to deep rose flowers.
examples:
- The keurboom bore loose bunches of pink flowers.
- The keurboom's flowers smelled sweet.
