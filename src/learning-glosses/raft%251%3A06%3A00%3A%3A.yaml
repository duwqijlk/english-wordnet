simpleMeaning: a flat thing that floats on water, usually made of logs or flat pieces of wood, used to
  carry people or things or for swimmers to stand on
scope: This is the flat thing used on water to carry people or for swimmers to stand on. It is not the
  flat layer of concrete that forms the base of a building on soft ground.
examples:
- They crossed the river on a raft made of logs.
- The children stood on the raft and then jumped into the water.
