simpleMeaning: The width and height of a set of letters for print, counted in the small units used for
  print
scope: This is the width and height of a set of letters for print, counted in small units, not the size
  of the letters on a screen and not the shape of the letters themselves.
examples:
- The point size of the heading is 18, so the letters stand tall on the page.
- She set the point size to 12 for the body of the letter.
