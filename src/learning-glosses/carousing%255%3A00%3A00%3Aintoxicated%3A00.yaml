simpleMeaning: used to describe a wild, noisy time when people drink too much alcohol and have loud fun
  together
scope: 'Also called orgiastic and bacchanal: this describes a wild, noisy time of drinking and having
  fun in a group. Not a quiet time with no alcohol, and not one drunk person on his own.'
examples:
- A carousing crowd sang and shouted in the bar all night.
- The carousing group drank and laughed loudly until morning.
