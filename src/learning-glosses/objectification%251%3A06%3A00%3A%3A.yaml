simpleMeaning: Making an idea or a rule into a real thing you can see or touch
scope: Giving an idea or a rule a real form you can see or touch, not the idea itself and not the use
  of a thing for a job.
examples:
- The statue was an objectification of the idea of freedom.
- His objectification of the rule gave it a shape everyone could point to.
