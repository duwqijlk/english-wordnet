simpleMeaning: The part of the foot of an animal with a backbone, between the middle bones of the foot
  and the leg; in people, the ankle and heel bones together.
scope: The part of the foot between the middle foot bones and the leg, in people the ankle and heel bones
  together.
examples:
- The tarsus joins the leg to the rest of the foot.
- An injury to the tarsus left his ankle swollen.
