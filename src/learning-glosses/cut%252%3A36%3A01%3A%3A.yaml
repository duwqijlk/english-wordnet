simpleMeaning: make a shape or opening by digging into something, pushing a tool into it, or making a
  hole through it.
scope: This is not slicing something apart with a blade, as in preparing food, but forming a shape or
  passage by digging into material.
examples:
- The miners cut a tunnel deep into the hillside.
- Using a narrow spade, she cut a channel through the clay for the new pipe.
