simpleMeaning: The word or words that name a person or a thing, and show what group it belongs to and
  how it differs from others.
scope: The word or words that name a person or a thing and show what group it belongs to and how it differs
  from others, also called designation or denomination; not the geographical mark that tells where the
  grapes for a wine were grown.
examples:
- The appellation 'the Iron Lady' stuck to the prime minister for years.
- An appellation can tell you what a thing is called and what sets it apart.
