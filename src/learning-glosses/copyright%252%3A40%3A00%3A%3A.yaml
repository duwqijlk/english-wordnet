simpleMeaning: To get the sole right to publish and sell a written work
scope: To get the sole right to publish and sell a written work, not the paper that gives that right.
examples:
- Did you copyright your manuscript before you sent it to the publisher?
- She copyrighted her book so no one else could print it.
