simpleMeaning: white fur from an animal that lives in the north and has a white coat in winter, and this
  fur costs a lot of money
scope: This is the fur itself, sold at a high price; not the living animal of the same name.
examples:
- The queen's winter cloak was lined with ermine.
- Ermine was used to trim the edge of the royal robe.
