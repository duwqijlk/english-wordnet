simpleMeaning: An eating sickness where one moves between strong hunger and hatred of food, seen in gorging,
  then fasts or forcing oneself to throw up.
scope: This sense is also called binge-purge syndrome, binge-vomit syndrome, and bulimia nervosa, an eating
  sickness where one moves between strong hunger and hatred of food, seen in gorging, then fasts or forcing
  oneself to throw up.
examples:
- Bulimarexia moves between hunger and hatred.
- The bulimarexia brings times of fasting.
