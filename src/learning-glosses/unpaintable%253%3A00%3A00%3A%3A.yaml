senseId: 'unpaintable%3:00:00::'
synsetId: 01720487-a
simpleMeaning: not fit to be shown in a picture, most of all not fit to be drawn in a work of art on cloth
scope: Something that cannot be shown well in a picture, not something that is easy to draw and not a
  picture itself.
examples:
- The strange dream seemed unpaintable, too hard to show in a picture.
- Some sights are unpaintable, and no artist can show them on canvas.
