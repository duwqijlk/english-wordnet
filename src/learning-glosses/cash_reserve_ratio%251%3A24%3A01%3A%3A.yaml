simpleMeaning: the share of a bank's total deposits kept by, so it can pay an unusually high number of
  withdrawals from accounts that pay on demand
scope: A share of deposits a bank must keep by, also called required reserve ratio and reserve ratio;
  not the bank's profit and not its total deposits.
examples:
- The cash reserve ratio rose after the new banking rule.
- Banks must hold the cash reserve ratio in ready money.
