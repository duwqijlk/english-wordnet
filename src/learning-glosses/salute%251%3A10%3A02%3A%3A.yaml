simpleMeaning: A friendly greeting made with words and a movement of the body, such as bending forward
  or lifting a hat
scope: A friendly act of greeting with words and a movement of the body; not the formal military greeting
  that soldiers make to an officer.
examples:
- He greeted us with a friendly salute, lifting his hat and bowing slightly.
- The children gave their teacher a cheerful salute and said good morning.
