senseId: 'roadblock%1:06:00::'
synsetId: 04103942-n
simpleMeaning: a thing put across a street or road by police to stop traffic, to catch a person who ran
  away from the law or to check traffic
scope: Also called barricade. This is the thing police put across a street or road to stop traffic, not
  a problem or delay that stops work or travel.
examples:
- Police set up a roadblock at the edge of town to check every car.
- The roadblock stopped all cars while police looked for the man who had run away.
