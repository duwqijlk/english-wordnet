simpleMeaning: linked by a change that keeps the lengths between points the same
scope: It is about figures matched by a move that keeps every length the same, not a muscle held tight
  without moving, not a shape with equal measures, and not a crystal with three equal axes at right angles.
examples:
- The two shapes are isometric under the turn.
- The figures stayed isometric after the move.
