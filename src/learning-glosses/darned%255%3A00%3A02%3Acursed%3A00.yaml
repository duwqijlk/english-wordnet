simpleMeaning: swear words used in speech that is not formal, to make other words stronger
scope: Also called damn, blame, damned, blessed, goddamn, blasted, blamed, goddamned, infernal, goddam,
  and deuced. It shows strong feeling in speech that is not formal, and does not mean sewn or fixed.
examples:
- I can't find the darned key anywhere.
- That darned dog ran off again.
