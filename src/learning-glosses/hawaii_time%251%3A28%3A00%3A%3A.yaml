simpleMeaning: The set clock reading in the 10th zone west of Greenwich, reckoned at the 150th line west;
  used in the island state and the western Aleutian Islands.
scope: Also called Hawaii Standard Time; the set clock reading in the 10th zone west of Greenwich, reckoned
  at the 150th line west, used in the island state and the western Aleutian Islands.
examples:
- Hawaii Time is ten hours behind Greenwich.
- The meeting was set for noon, Hawaii Time.
