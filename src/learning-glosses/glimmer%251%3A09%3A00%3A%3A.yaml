simpleMeaning: a small sign of something, or a weak idea that is not clear
scope: 'Also called glimmering: a small sign or a weak, not clear idea, not full or clear knowledge of
  a thing.'
examples:
- She had only a glimmer of hope that he was still alive.
- At first he had no glimmer of what the words meant.
