simpleMeaning: a set of wires and equipment that works together to send television
scope: This is the wires and equipment that send television to homes, not the television programs themselves
  and not a single thick rope or power wire.
examples:
- They paid to have cable put in at their new house.
- When the cable broke down, the whole street lost its television.
