simpleMeaning: of or about the study of the earth, its rocks and how it was made, or based on that study
scope: 'Also called geologic: this is about the study of the earth, its rocks and how it changed, not
  about the weather or about where places and people are on maps.'
examples:
- Geological maps show the different rocks under the town.
- The geological history of the hills goes back millions of years.
