simpleMeaning: a video system that sends pictures by wire to chosen screens in one place, not out to the
  public
scope: A wired system for chosen screens in one building, not a broadcast service and not a home set for
  public shows.
examples:
- The factory uses closed-circuit television to watch the gates.
- Guards check the closed-circuit television screens every hour.
