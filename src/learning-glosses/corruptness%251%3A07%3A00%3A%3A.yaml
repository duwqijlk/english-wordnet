simpleMeaning: Not being honest or straight, above all being open to bribes, and using a trusted job to
  gain money by dishonest means.
scope: This is not being honest or straight, above all being open to bribes, and using a trusted job to
  gain money by dishonest means; corruption is another name for this sense, not a single dishonest act
  and not a mistake made in good faith.
examples:
- The corruptness of the officials shocked the town.
- Corruptness had spread through the whole department.
