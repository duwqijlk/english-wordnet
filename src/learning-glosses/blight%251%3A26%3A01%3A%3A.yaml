simpleMeaning: A sickness of plants that makes them dry up without making them rot.
scope: This is a plant sickness that dries plants up without rotting them; not the act of causing such
  harm, and not the state of being harmed in this way.
examples:
- The potato blight ruined the whole crop that year.
- Gardeners watch for blight on their tomato plants in wet summers.
