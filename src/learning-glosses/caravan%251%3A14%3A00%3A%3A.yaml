simpleMeaning: Wagons or pack animals travelling together in a line, one behind the next
scope: A long line of wagons or pack animals on the move together, also called train, not a small home
  on wheels and not the act of travelling in such a line.
examples:
- The caravan of camels crossed the desert in single file.
- They joined the caravan for safety on the long road.
