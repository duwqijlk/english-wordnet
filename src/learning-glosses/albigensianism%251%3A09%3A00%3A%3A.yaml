simpleMeaning: A Christian movement in southern France in the 1100s and 1200s, from Manichaeism, teaching
  two opposed powers, one good and one evil, coexist; wiped out as heresy in the Inquisition.
scope: Not Manichaeism itself, nor other medieval Christian movements; also called Catharism.
examples:
- Albigensianism spread in southern France.
- The Inquisition wiped out Albigensianism.
