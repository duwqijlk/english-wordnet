simpleMeaning: Water plants and blue-green germs that live on or with fine grains.
scope: Water plants and blue-green germs that live on or with fine grains, not plants that float free
  and not germs that live on land.
examples:
- The epipelon grew on the fine grains at the bottom of the pond.
- Epipelon lives on the mud under shallow water.
