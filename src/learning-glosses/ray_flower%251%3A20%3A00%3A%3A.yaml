simpleMeaning: At the edge of a daisy-like bloom, small blooms usually sit in rings, each with a long
  flat strip-like part.
scope: 'Also called a ray floret: one of the small flat blooms at the edge of a daisy-like bloom, not
  the small blooms in the middle.'
examples:
- The ray flowers at the edge of the daisy opened in the sun.
- Bees moved over the ray flowers ringing the yellow centre.
