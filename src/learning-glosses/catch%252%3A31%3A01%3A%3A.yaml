simpleMeaning: To come across someone or something by chance, especially to see a person in the middle
  of doing something or in a particular state.
scope: This is not a brief act of seeing or hearing something; it is finding a person or thing out unexpectedly.
examples:
- The teacher caught two students passing notes during the test.
- She caught the dog asleep on the new sofa.
