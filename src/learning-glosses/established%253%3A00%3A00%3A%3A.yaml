senseId: 'established%3:00:00::'
synsetId: 01639189-a
simpleMeaning: having been created, set up, or accepted by people, and often having existed in that way
  for a long time.
scope: This is not the sense of being fixed beyond doubt and without conditions; it is about something
  that has been set up, accepted, and often long in existence.
examples:
- They sent their son to a well-established school in the city.
- It is an established custom here to share the first harvest.
