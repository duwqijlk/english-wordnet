simpleMeaning: The orderly work of giving reasons to prove that a claim is true or false.
scope: It is also called line, argument, line of reasoning, and logical argument, and it names the orderly
  work of giving reasons to prove a claim true or false, not the claim itself.
examples:
- I can't follow your argumentation; the reasons jump about too much.
- Her argumentation showed step by step that the claim was false.
