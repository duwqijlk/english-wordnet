simpleMeaning: usually, in everyday speech, bringing bad luck, or having bad luck come with it
scope: 'Also called hexed: bringing bad luck or followed by bad luck, usually in everyday speech; not
  a serious curse and not just one small piece of bad luck.'
examples:
- The team felt jinxed after losing three games in strange ways.
- Every time we plan a picnic, the jinxed weather turns to rain.
