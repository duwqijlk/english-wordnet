simpleMeaning: a way to treat pain or sickness by putting thin needle ends into the skin at set places
  on the body
scope: A treatment that puts needle ends into set places on the skin to help pain or sickness, not a medicine
  and not an operation.
examples:
- He tried acupuncture to help the pain in his back.
- Acupuncture helped her feel better after weeks of neck pain.
