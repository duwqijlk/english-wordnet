simpleMeaning: showing a clear grasp of what is really going on, together with care for other people's
  feelings.
scope: This is not the noun for the state of knowing something, and not mere agreement; it describes a
  person or response that combines clear insight with empathy.
examples:
- She gave me an understanding smile when I explained the problem.
- Her understanding parents let her explain before they judged.
