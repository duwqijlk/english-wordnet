simpleMeaning: the earliest animals that give milk to their young and whose young hatch from shells, and
  the only living members of an early group called the Prototheria
scope: The earliest animals that give milk and whose young hatch from shells, also called monotreme; not
  a bird and not an animal that gives milk and bears live young.
examples:
- The platypus is an egg-laying mammal.
- An egg-laying mammal suckles its young after they hatch.
