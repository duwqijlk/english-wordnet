simpleMeaning: an animal with no bones in its back, a soft body not made of separate parts, and usually
  a shell (a hard outer covering) around it
scope: 'Also called mollusk, and also called mollusc: this is the living animal itself, not its meat used
  as food.'
examples:
- A shellfish lives in the sea inside its hard shell.
- This shellfish has a soft body and no bones in its back.
