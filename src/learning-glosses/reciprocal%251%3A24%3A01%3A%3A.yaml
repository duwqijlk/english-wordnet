simpleMeaning: a word, phrase, or idea linked to another in an opposite way, with the same opposite link
  from the other one to it
scope: A word, phrase, or idea linked in an opposite way to another; not the number sense in maths, where
  two numbers make 1 when multiplied, and not a breeding cross that reverses the sexes.
examples:
- In this pair, risk is the reciprocal of safety.
- '''Parent'' and ''child'' are reciprocals: each word gets its meaning from its link to the other.'
