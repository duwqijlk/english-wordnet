senseId: 'subordination%1:24:01::'
synsetId: 13822887-n
simpleMeaning: In grammar, the link between a word or group of words that changes the meaning of another
  word and the main word it goes with.
scope: In grammar, the link between a word that adds meaning and the main word it goes with, not the act
  of putting a person under another's rule, not the state of being under another, and not the sense of
  one thing belonging to a lower rank than another.
examples:
- In the phrase 'the tall tree', subordination links 'tall' to 'tree'.
- Subordination shows how 'quickly' goes with the verb it changes.
