simpleMeaning: a piece of wood or metal put inside footwear to keep its shape while no one is wearing
  it
scope: A piece of wood or metal put inside a shoe to keep its shape while unworn; not a shoehorn and not
  a shoe rack.
examples:
- He slipped a shoetree into each shoe before he put them away.
- A shoetree keeps the leather from creasing while the shoes sit in the closet.
