simpleMeaning: A fungus with a cap creamy grey when young, turning brown with age, and a whitish stalk
  that stains yellow when touched.
scope: A fungus whose cap turns brown with age, not the flat-capped mushroom with pale gills.
examples:
- The Clitocybe inornata turns brown as it ages.
- Clitocybe inornata stains yellow when touched.
