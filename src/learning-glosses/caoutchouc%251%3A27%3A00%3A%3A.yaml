simpleMeaning: From the milky sap of trees, most of all Hevea and Ficus, comes this springy stuff, which
  heat can harden into many kinds of things
scope: 'Also called rubber, gum elastic and natural rubber: a springy stuff got from the milky sap of
  trees, most of all Hevea and Ficus.'
examples:
- Caoutchouc came from the milky sap of Hevea trees.
- The caoutchouc was heated and made into many kinds of things.
