simpleMeaning: The world shows no colour at all to a person with this, and one shade can be told from
  another only by how light or dark it is
scope: 'Also called monochromacy, monochromasy, monochromatic vision and monochromatism: a person sees
  no color at all and tells shades apart only by brightness, not a loss of sight and not a weakness for
  one color.'
examples:
- His monochromia means he sees the world in shades of grey, never in color.
- The test for monochromia showed he could tell the dots apart only by how bright they were.
