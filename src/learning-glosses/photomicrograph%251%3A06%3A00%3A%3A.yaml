simpleMeaning: A picture taken through a tool that makes tiny things look big.
scope: This is a picture taken through a tool that makes tiny things look big, not a picture taken with
  a plain camera, and not a drawing of a tiny thing.
examples:
- The photomicrograph showed the tiny cells.
- She looked at a photomicrograph of the leaf.
