simpleMeaning: a long, steep slope or high rock face at the edge of high flat land or a line of hills,
  usually made as the land is slowly worn away
scope: 'Also called escarpment: a natural long steep slope at the edge of high land, not a steep slope
  built by people in front of a fort.'
examples:
- The path followed the scarp above the valley.
- From the top of the scarp, we could see the flat land below.
