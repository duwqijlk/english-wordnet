simpleMeaning: Going against the slope of the rock layers around it, a valley or river runs the opposite
  way.
scope: This is said of a valley or river whose course runs against the slope of the rock layers around
  it, and not of one that runs with that slope.
examples:
- The anaclinal river cut across the tilted rock layers.
- An anaclinal valley runs against the slope of the rocks.
