simpleMeaning: The body's largest blood tube takes in blood tubes that run beside the blood tubes feeding
  the kidneys, at the level of the second bone of the lower back.
scope: These are blood tubes that run beside the blood tubes feeding the kidneys, also called vena renalis,
  not the blood tubes that carry blood to the kidneys.
examples:
- The renal vein joins the body's largest blood tube near the lower back.
- Blood leaves the kidney through the renal vein.
