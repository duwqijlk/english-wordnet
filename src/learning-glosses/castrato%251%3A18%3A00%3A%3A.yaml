simpleMeaning: a male singer who had an operation before puberty that stopped his voice from changing,
  so he keeps a high soprano or alto voice
scope: A man singer with a high voice from before manhood, not a boy singer and not a countertenor.
examples:
- The castrato sang the high part in the opera.
- A castrato kept his boy's voice into adult life.
