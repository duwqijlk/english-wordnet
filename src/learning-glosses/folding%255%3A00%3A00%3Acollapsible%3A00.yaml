simpleMeaning: That can be made smaller by bending its parts together, so it can be put away
scope: This describes a thing that can be bent and put away, not the act of bending something, not the
  way a protein (a substance in living things) takes shape, and not a bend in rock.
examples:
- She bought a folding chair that she could put away after the guests left.
- They slept on a folding bed in the small room.
