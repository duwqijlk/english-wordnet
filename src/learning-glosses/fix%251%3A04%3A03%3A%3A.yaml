simpleMeaning: something someone strongly wants, especially a dose of an addictive drug injected into
  a vein.
scope: This is not a repair and not a difficult situation; it names the drug dose that an addicted person
  craves.
examples:
- The addict was desperate for a fix.
- He went out to get his next fix.
