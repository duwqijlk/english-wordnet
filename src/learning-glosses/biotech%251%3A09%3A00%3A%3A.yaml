simpleMeaning: a part of the study of living things at their smallest level, about using very tiny living
  things for particular processes in industry
scope: Also called biotechnology; this is the study of using tiny living things for work in industry,
  not the study of living things in general.
examples:
- She studies biotech at university.
- Biotech uses tiny living things to help make medicines in factories.
