simpleMeaning: Under the law, one firm holding all the selling, or a deal, plan or plot meant to hold
  back buying and selling, which United States laws against trusts forbid
scope: In law, a deal or plot meant to hold back buying and selling, not fair trade between sellers and
  not a single sale.
examples:
- The combination in restraint of trade kept prices high for years.
- The court struck down the combination in restraint of trade.
