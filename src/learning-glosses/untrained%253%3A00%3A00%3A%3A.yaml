simpleMeaning: not taught to be skilled, not made to follow rules, and not made ready by practice
scope: For a person, animal or voice that has had no teaching or practice to make it skilled or controlled;
  not describing someone who has been fully taught for a job.
examples:
- The untrained troops did not know how to march together.
- She sang with a clear but untrained voice.
