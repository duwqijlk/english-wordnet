senseId: 'fair_hearing%1:04:00::'
synsetId: 01202992-n
simpleMeaning: A special hearing when normal court steps cannot secure due process, because harm or loss
  of rights comes before a remedy, as in deportation or loss of welfare benefits.
scope: This is a hearing that can be granted when the ordinary legal process would be too slow to protect
  someone's rights, not an ordinary trial or a routine appeal. It is a legal term, and its examples are
  deportation and the loss of welfare benefits.
examples:
- The court held that the immigrant was entitled to a fair hearing before removal.
- Welfare claimants argued that cutting benefits without a fair hearing violated due process.
