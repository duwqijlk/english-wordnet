simpleMeaning: without a tail or anything shaped like one
scope: This describes a thing with no tail and no tail-like part, also called acaudal; not a short tail
  and not a tail that has been cut off.
examples:
- The acaudate animal moved slowly, with no tail to help it balance.
- An acaudate frog has no tail-like part at all.
