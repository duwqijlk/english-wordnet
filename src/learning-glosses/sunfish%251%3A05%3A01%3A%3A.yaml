simpleMeaning: a small flesh-eating North American freshwater fish, usually with a flattened, shiny body,
  such as a crappie, black bass, bluegill or pumpkinseed
scope: The freshwater fish-family sense; not the huge ocean sunfish and not the flesh of these fish eaten
  as food.
examples:
- We caught several sunfish in the shallow water near the dock.
- The pond is full of sunfish such as bluegills and crappies.
