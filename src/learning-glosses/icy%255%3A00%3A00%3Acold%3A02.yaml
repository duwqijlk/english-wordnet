simpleMeaning: Shows no warm welcome and no friendly feeling, and shows dislike and scorn for others
scope: Also called frozen, this is a cold, unfriendly manner, not a shiny, slick surface covered in frozen
  water.
examples:
- She gave him an icy stare and said nothing.
- His icy greeting made it clear he was not welcome.
