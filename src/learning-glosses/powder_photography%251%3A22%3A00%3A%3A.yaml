simpleMeaning: 'A method for identifying minerals or crystals: a rod carries a finely ground sample, modified
  X-rays hit it, and rings of scattered rays reveal the substance.'
scope: A laboratory identification procedure for minerals and crystals, not a camera-based imaging method
  or an artistic style; its other names describe the same process.
examples:
- The mineralogist used powder photography to confirm the identity of the unknown crystal.
- Powder photography produced a clear ring pattern from the tiny sample.
