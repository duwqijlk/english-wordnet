simpleMeaning: A lung infection caught by breathing in dust carrying the bacterium that causes a serious
  illness in animals; it begins with chills, cough and breathlessness, then the circulation collapses.
scope: This is one of several names for the lung form of anthrax caught from dust, not the skin form that
  starts with a sore.
examples:
- Ragsorter's disease began with chills and a hard cough in dusty sorting rooms.
- The outbreak of ragsorter's disease was traced to contaminated rags.
