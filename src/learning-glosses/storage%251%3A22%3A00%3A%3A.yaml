simpleMeaning: In computer science, the act of keeping information in a computer memory or on a magnetic
  tape or disk
scope: In computers, keeping information in memory or on tape or a disk, not a business that keeps goods
  and materials for other people.
examples:
- The storage of the backup files on tape took an hour.
- This program handles the storage of information in computer memory.
