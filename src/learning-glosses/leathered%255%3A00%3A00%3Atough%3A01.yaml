simpleMeaning: looking or made to look like leather, and tough but easy to bend
scope: 'Also called leathery: a thing that looks like leather and is tough but easy to bend, not a piece
  of leather itself.'
examples:
- The leathered cover of the old book felt tough but still bent a little.
- He wore leathered boots that looked like real leather.
