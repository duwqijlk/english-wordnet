simpleMeaning: Lying farther to the top of the map than any other place
scope: This is the place farthest to the top of the map; northernmost is another name for this sense;
  not the place farthest south and not merely a place in the north.
examples:
- The northmost town in the land is small.
- Alaska is our northmost state.
