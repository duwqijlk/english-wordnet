simpleMeaning: a prisoner held by one side so that another side will do what it agreed to do
scope: 'Also called hostage: a person held as a prisoner to make another side keep an agreement, not property
  that a lender can take if a debt is not paid.'
examples:
- He was held as a surety until the other side kept its promise.
- The king gave his son as a surety for the peace deal.
