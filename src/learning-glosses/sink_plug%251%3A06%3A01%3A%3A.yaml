simpleMeaning: a piece that fits into the hole of a washbasin, bath or other water holder to stop the
  water from running out
scope: A piece that blocks the hole of a washbasin, bath or other water holder, also called a basin plug,
  a bath plug and a tub stopper; not a tap and not a drain cover.
examples:
- She pulled out the sink plug and the bath water ran away.
- The sink plug stopped the water in the washbasin.
