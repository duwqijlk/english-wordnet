simpleMeaning: People grate or grind this part of a plant to add taste to food
scope: The grated or ground part of a plant used to add taste to food, also called horseradish; not the
  creamy sauce made with it and not the plant's leaves.
examples:
- She dug up a horseradish root and grated it for the roast.
- Fresh horseradish root is much stronger than the stuff in a jar.
