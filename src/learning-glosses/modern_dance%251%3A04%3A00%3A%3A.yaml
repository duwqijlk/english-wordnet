simpleMeaning: On stage, people move with fewer set rules than in classical ballet, and the moves themselves
  show feelings.
scope: This stage movement keeps fewer set rules than classical ballet, and its moves show feelings rather
  than following a fixed pattern.
examples:
- The modern dance piece had moves that showed feeling, with no set steps to follow.
- They watched a modern dance in which the moves showed feeling.
