senseId: 'subpoena_duces_tecum%1:10:00::'
synsetId: 06569308-n
simpleMeaning: a court order, asked for by one side, that makes a witness bring papers that matter and
  are in their hands to court or to a sworn talk
scope: A court order that makes a witness bring papers that matter; not an order to appear without papers
  and not a ruling that ends a case.
examples:
- The lawyer asked for a subpoena duces tecum to get the letters.
- A subpoena duces tecum made the witness bring the papers to court.
