senseId: loony%5:00:00:insane:00
synsetId: 02082059-s
simpleMeaning: in informal or slang talk, describes a person whose mind does not work in a normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, bonkers, haywire, barmy, loco and kooky: this is loose talk for a mind not working in a normal
  way, not a formal word doctors use.'
examples:
- Everyone thought the old man was loony, talking to himself all day.
- She acted loony and kept shouting at people who were not there.
