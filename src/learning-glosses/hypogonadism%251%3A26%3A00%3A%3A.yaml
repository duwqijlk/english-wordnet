synsetId: 14098840-n
simpleMeaning: the sex glands do not work, above all in men with low testosterone; adult sex traits do
  not grow, and boys before puberty grow long legs and a short trunk
scope: Sex glands that do not work, above all in men with low testosterone, not glands that work too hard
  and not a growth problem of the bones.
examples:
- Hypogonadism meant he never grew a beard or a deep voice.
- The boy's hypogonadism gave him long legs and a short trunk.
