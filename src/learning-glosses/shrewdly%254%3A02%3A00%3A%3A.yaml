simpleMeaning: in a way that shows you understand things well and make good decisions
scope: This means acting with clear understanding and good sense when you decide; it is not acting in
  a sly way to trick people.
examples:
- She shrewdly invested her money before prices rose.
- He shrewdly noticed the small change in the contract.
