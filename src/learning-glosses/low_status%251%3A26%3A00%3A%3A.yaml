simpleMeaning: A person is below others in rank, wealth, standing and how people think of you
scope: Also called lowliness and lowness, this is a place in life below others in rank or wealth, not
  a high place and not a short spell of bad luck.
examples:
- His low status in the firm kept him from the best jobs.
- She knew her low status meant few people listened to her.
