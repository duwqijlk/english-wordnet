simpleMeaning: A drug that blocks the body's over-strong reaction to outside things, sold as Dimetane,
  and used to treat over-sensitivity such as a runny nose.
scope: A drug sold as Dimetane for over-sensitivity such as a runny nose; not any antihistamine and not
  a decongestant.
examples:
- The doctor gave her brompheniramine maleate for her hay fever.
- Brompheniramine maleate helped stop his sneezing.
