simpleMeaning: a very dark, sweet drink made from roasted barley that has not begun to sprout
scope: Also called porter, this is a dark, sweet drink made from roasted barley that has not begun to
  sprout, not a light drink and not a drink made from malted barley.
examples:
- He ordered a glass of porter's beer with his meal.
- The porter's beer was dark and sweet.
