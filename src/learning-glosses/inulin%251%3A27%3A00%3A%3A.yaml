simpleMeaning: Something used to make fruit sugar and to test how well the kidneys work
scope: A thing used to make fruit sugar and to test how well the kidneys work, not fruit sugar itself
  and not a test of the liver.
examples:
- Doctors use inulin to test how well the kidneys work.
- Inulin is used in factories to make fructose.
