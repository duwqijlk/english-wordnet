simpleMeaning: something put on shoes or boots to make the outside shine and to keep it safe
scope: A thing put on shoes or boots, not the colour black and not the act of making something black.
examples:
- He rubbed blacking on his boots until they shone.
- A tin of blacking sat by the door for his shoes.
