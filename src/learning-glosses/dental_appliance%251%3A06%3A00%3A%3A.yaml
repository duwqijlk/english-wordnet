simpleMeaning: a thing made to fix teeth or take the place of teeth that are gone
scope: A made thing that mends teeth or stands in for teeth that are gone; not a brush or thread used
  to clean teeth.
examples:
- The dentist fitted a dental appliance to replace the tooth she had lost.
- Her dental appliance holds the false teeth in place.
