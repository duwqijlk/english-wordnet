simpleMeaning: a word or words used as a name for a person or thing, which show what kind it is and set
  it apart from others
scope: Also called appellation and denomination. This is the name itself, not the act of choosing or giving
  a name to something.
examples:
- '''Teacher'' is the designation for her job at the school.'
- The designation 'Zone B' sets this area apart from the others.
