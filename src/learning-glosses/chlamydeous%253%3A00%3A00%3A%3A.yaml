simpleMeaning: having a flower covering made of an outer ring, an inner ring, or both rings of leaves
scope: Describing a flower that has an outer ring of leaves, an inner ring, or both; not a flower with
  no covering at all.
examples:
- The chlamydeous bloom had an outer ring of leaves but no inner ring.
- Botanists call a flower chlamydeous when it has an outer ring, an inner ring, or both.
