simpleMeaning: Its finely cut leaves, often curled, are the reason this sweet-smelling one-year Old World
  herb is grown, used above all in soups and salads.
scope: 'Also called beaked parsley: a sweet-smelling one-year herb grown for its leaves, not the fresh
  leaves alone used as a garnish.'
examples:
- They grew chervil for its finely cut leaves.
- Chervil went into the soup.
