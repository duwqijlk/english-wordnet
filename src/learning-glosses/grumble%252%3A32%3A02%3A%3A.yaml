simpleMeaning: To give out a sound that rolls on and on, low and flat
scope: Also called growl and rumble, this is making a low dull sound, not saying words of complaint and
  not showing unhappiness.
examples:
- Stones grumbled down the cliff as the ground shook.
- The old engine grumbled as it started up.
