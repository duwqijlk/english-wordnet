simpleMeaning: A tall coarse perennial American plant with small white flowers followed by blackish-red
  berries on long hanging clusters; young fleshy stems are edible; berries and root are poisonous.
scope: Also called poke, garget, pigeon berry and scoke; a tall plant with white flowers and dark berries,
  not a plant grown for food and not a berry bush.
examples:
- Phytolacca americana grows tall by the fence.
- The berries of Phytolacca americana are poisonous.
