simpleMeaning: the small piece that joins the two lenses of a pair of glasses and sits on the nose
scope: The piece on eyeglasses that joins the lenses and rests on the nose, not the wooden piece that
  lifts a violin's strings or a dental fitting of false teeth.
examples:
- The bridge on my glasses snapped, so the lenses kept slipping down my nose.
- He had the bridge of his spectacles repaired at the optician's.
