simpleMeaning: A severe muscle-wasting illness with weakness in face, feet, hands, neck; speech and hand
  trouble spread to arms, shoulders, legs, hips; onset birth to middle age, slow, autosomal dominant inheritance.
scope: Not other forms of muscle wasting, nor other illnesses that weaken the muscles; also called myotonia
  atrophica, myotonic dystrophy, and myotonic muscular dystrophy.
examples:
- Steinert's disease causes muscle wasting.
- People with Steinert's disease may have trouble speaking.
