simpleMeaning: a known set of moves played at the start of a game with kings and queens on a board
scope: 'Also called opening: a known set of moves at the start of a game, not a move made later in the
  game.'
examples:
- He memorized all the important chess openings.
- She played a chess opening she had learned from a book.
