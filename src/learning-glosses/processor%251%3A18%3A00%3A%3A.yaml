simpleMeaning: a person who works on things and gets them ready, such as foods, photographs, or people
  who apply for something
scope: A person who does this work, not a business that gets farm goods ready for sale and not the main
  chip in a computer.
examples:
- He is a processor who checks forms from people applying for loans.
- The processor asked for more papers before she could approve the application.
