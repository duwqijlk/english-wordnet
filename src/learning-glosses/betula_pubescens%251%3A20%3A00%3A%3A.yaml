simpleMeaning: A European birch with bark from dull white to pale brown and branches that hang down a
  little and are hairy.
scope: A European birch with dull white to pale brown bark, also called downy birch and white birch; set
  apart from other European birches and from other birches with hairy branches.
examples:
- Betula pubescens grows across northern Europe.
- The branches of Betula pubescens hang down and feel hairy.
