simpleMeaning: to make someone feel sudden wonder or shock by doing or saying something unexpected.
scope: This is causing a feeling of sudden wonder or shock, not the noun for an unexpected event or the
  act of catching someone off guard.
examples:
- The news surprised everyone at the table.
- It would not surprise me if she won.
