simpleMeaning: Two body chemicals, estrogen and progestin, are given to women whose monthly periods have
  stopped, in the belief that they guard against heart trouble and weak bones
scope: Two body chemicals, estrogen and progestin, given to women whose monthly periods have stopped,
  in the belief that they guard against heart trouble and weak bones, also called hormone replacement
  therapy; not a treatment for women still having periods, and not a cure for heart trouble itself.
examples:
- Hormone-replacement therapy can ease the effects of the change of life.
- Her doctor spoke of hormone-replacement therapy to guard her bones.
