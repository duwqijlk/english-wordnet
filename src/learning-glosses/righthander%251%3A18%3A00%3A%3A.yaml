simpleMeaning: a person whose right hand is the hand they use best, better than the left
scope: A person whose right hand is the hand they use best; right-hander and right hander are other names
  for this sense, not a pitcher in baseball and not a person who uses both hands well.
examples:
- She is a righthander, so she writes with her right hand.
- The righthander eats and writes best with his right hand.
