simpleMeaning: a person who kills animals that cause trouble, especially a person whose job is to kill
  rodents (small animals like rats and mice) and insects
scope: 'Also called an eradicator or a terminator: a person whose job is killing troublesome animals,
  not a machine and not a person who kills people.'
examples:
- The exterminator came to clear the rats from the kitchen.
- We called an exterminator to get rid of the insects in the roof.
