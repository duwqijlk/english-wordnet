senseId: absolute%5:00:01:complete:00
synsetId: 00522835-s
simpleMeaning: total and free of any limits or conditions, or, in casual speech, sometimes used to add
  emphasis
scope: This is total and unconditional, sometimes added for emphasis; rank, sheer, downright, out-and-out
  and right-down are other words for it, unlike the noun for a thing that stands alone, the sense of pure
  or perfect, or the legal sense of unlimited by law.
examples:
- The general demanded absolute loyalty from his troops.
- That film was an absolute disaster.
