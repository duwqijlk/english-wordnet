simpleMeaning: having to do with very small living things you cannot see, made up of them, or caused by
  them
scope: About very small living things you cannot see, or caused by them; this is not about big plants
  or animals and not about things that are not alive.
examples:
- Microbial growth in the water made it unsafe to drink.
- The doctor tested for a microbial cause of the illness.
