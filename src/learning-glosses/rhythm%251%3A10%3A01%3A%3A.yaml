synsetId: 07100710-n
simpleMeaning: In music, one beat, taken by itself as the basic unit in a piece
scope: This is the basic beat unit in music; it is not the pattern of strong and weak sounds in spoken
  words, and not a regular cycle of events in time.
examples:
- The song's rhythm is made of short, regular beats.
- She tapped her foot to the rhythm of the music.
