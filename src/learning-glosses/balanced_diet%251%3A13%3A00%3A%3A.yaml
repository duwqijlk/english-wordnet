simpleMeaning: food eaten each day that has enough of all the things the body needs to grow well and stay
  active
scope: Food eaten each day that has enough of all the things the body needs, not a plan to lose weight
  and not one kind of food on its own.
examples:
- A balanced diet keeps children strong and full of energy.
- She plans a balanced diet with fruit, vegetables, and meat each week.
