simpleMeaning: a short piece of music that sounds as if it were made up on the spot, with no plan made
  before
scope: A short piece of music that sounds as if it were made up on the spot, with no plan made before;
  not a speech or act done without preparation.
examples:
- The pianist played a lovely impromptu after the concert.
- She ended the evening with an impromptu on the piano.
