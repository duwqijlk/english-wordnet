simpleMeaning: Very young children whose minds work in a way that brings great trouble in daily life were
  once given this name for their condition.
scope: This is also called autistic disorder, classic autism, classical autism, infantile autism and infantile
  psychosis.
examples:
- Doctors once used childhood autism for a state that began in very young children.
- He read about childhood autism in an old book on the mind.
