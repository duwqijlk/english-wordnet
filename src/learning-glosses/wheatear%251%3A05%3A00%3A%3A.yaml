simpleMeaning: a small bird that sings, found in the north of America and of Europe and Asia, with a white
  patch that stands out at the back of its body
scope: A small bird that sings, not a bird of prey and not a small bird with no white patch at the back.
examples:
- We saw a wheatear on the rocks, its white rump bright in the sun.
- The wheatear sang from the top of a stone wall.
