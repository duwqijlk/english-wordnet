senseId: 'configurational_isomer%1:27:01::'
synsetId: 92429526-n
simpleMeaning: In chemistry, a form of a substance that can change into another form only if the strong
  links around one atom are broken.
scope: In chemistry, one form of a substance that changes into another only by breaking links, not a form
  that changes by turning in space and not a different substance.
examples:
- The configurational isomer changes only when its bonds break.
- Chemists study each configurational isomer on its own.
