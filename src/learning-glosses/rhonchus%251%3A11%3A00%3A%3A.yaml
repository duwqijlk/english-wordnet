simpleMeaning: When a person breathes out and air moves through narrowed tubes, a sound like whistling
  or snoring is heard through a listening tool pressed to the chest.
scope: It is a sound like whistling or snoring, heard with a listening tool on the chest as a person breathes
  out and air moves through narrowed tubes.
examples:
- A rhonchus was heard when the person breathed out.
- A rhonchus sounded like whistling as air passed through the narrowed tubes.
