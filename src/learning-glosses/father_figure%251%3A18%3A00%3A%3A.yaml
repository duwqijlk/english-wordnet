simpleMeaning: A male person who does all the things a true male parent does.
scope: A male person who does all the things a true male parent does; father surrogate is another name
  for this sense, not a true male parent and not a person who merely looks like one.
examples:
- His teacher became a father figure to him.
- The old coach was a father figure for the whole team.
