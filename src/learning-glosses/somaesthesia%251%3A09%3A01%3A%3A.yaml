senseId: 'somaesthesia%1:09:01::'
synsetId: 05729127-n
simpleMeaning: knowing what you feel through touch, through the sense of where your body is, or through
  feelings inside your body
scope: Noticing touch, body position, or feelings inside the body, also called somatesthesia, somatic
  sensation and somesthesia; not the body's whole sense system and not sight or hearing.
examples:
- He used somaesthesia to sense the change in pressure.
- The blind man relied on somaesthesia to feel the ground under his feet.
