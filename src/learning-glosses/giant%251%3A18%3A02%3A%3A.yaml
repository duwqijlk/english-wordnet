simpleMeaning: a made-up being of far greater size and strength than a person, found in folk tales and
  fairy tales
scope: A huge being from old stories, not a very large star or a celebrated person.
examples:
- The story tells of a giant who guarded the mountain.
- In the fairy tale, a giant lived at the top of the beanstalk.
