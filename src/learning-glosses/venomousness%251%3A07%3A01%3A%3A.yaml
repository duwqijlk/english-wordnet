schema: oewn-learning-gloss-v2
senseId: 'venomousness%1:07:01::'
synsetId: 92434865-n
simpleMeaning: the quality of being able to poison, or of being poisoned by a bite or sting, or of having
  a part of the body that makes poison
scope: How able a thing is to poison, or whether it has a part that makes poison, not the poison itself
  and not a wound from a bite.
examples:
- The venomousness of the snake made the prairie dogs keep their distance.
- The doctor asked about the venomousness of the spider that had bitten the child.
