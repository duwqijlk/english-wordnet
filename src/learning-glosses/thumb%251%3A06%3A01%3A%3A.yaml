simpleMeaning: A strip with a curved, outward shape; when cut across, its shape is a quarter of a circle
  or a long round shape (an ellipse)
scope: This is a shaped strip on wood or stone, not the short thick finger on a hand and not the part
  of a glove that covers that finger.
examples:
- The carpenter cut a thumb molding for the edge of the shelf.
- A thumb runs around the top edge of the old chest, round in shape.
