simpleMeaning: A drug that wakes up the brain and nerves, used to treat sudden sleep attacks in grown-ups
  and lack of focus in children.
scope: A drug that wakes the brain and nerves, used for sleep attacks in adults and lack of focus in children,
  not a sleeping pill or a painkiller, also called methylphenidate.
examples:
- The doctor gave him Ritalin for his lack of focus.
- Ritalin helped her stay awake in class.
