schema: oewn-learning-gloss-v2
senseId: 'approach%1:10:00::'
synsetId: 07179000-n
simpleMeaning: A hesitant proposal made to find out how others react.
scope: A tentative proposal to someone; not a plan for handling a problem, not the act of drawing physically
  closer or one object coming nearer another, not a way in or out, not an aircraft's landing path, not
  the approach of a time, not a close approximation or resemblance, not a golf shot, and not the verbs
  for moving towards, coming near in time or quality, beginning to deal with something, or making advances
  with a proposal.
examples:
- She made an approach to the company about a possible partnership.
- His approach to the editor was met with polite interest.
