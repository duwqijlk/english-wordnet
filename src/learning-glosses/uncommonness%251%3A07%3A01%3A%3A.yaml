schema: oewn-learning-gloss-v2
senseId: 'uncommonness%1:07:01::'
synsetId: 04804379-n
simpleMeaning: How far a thing stands out because it has a rare or top quality
scope: How far a thing stands out because it has a rare or top quality; not plain rareness of a thing,
  and not how good a thing is in itself.
examples:
- The uncommonness of her voice made her stand out from the rest.
- People talked about the uncommonness of the old house, with its fine carved wood.
