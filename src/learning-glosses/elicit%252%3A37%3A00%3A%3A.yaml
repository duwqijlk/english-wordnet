simpleMeaning: to bring out a feeling or a reaction in someone
scope: Bringing out a feeling or reaction in someone, also called fire, raise, provoke, evoke, arouse
  and kindle, not working out a rule or meaning, which is a different sense of the word.
examples:
- The sad story elicited pity from the crowd.
- Her words elicited a smile from the tired man.
