simpleMeaning: To do with old Chaldea, its people, their tongue, or their way of life.
scope: The adjective for things of old Chaldea, also called Chaldean or Chaldee, not the noun for a person
  from Chaldea and not for a wise man skilled in hidden learning.
examples:
- The Chaldaean tongue was spoken in old Chaldea.
- We read about Chaldaean ways of life.
