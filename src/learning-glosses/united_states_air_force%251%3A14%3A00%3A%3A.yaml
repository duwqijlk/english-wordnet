simpleMeaning: The flying arm of the country's armed services, which guards the country by command and
  use of the skies and space.
scope: The flying arm of the country's armed services, also called Air Force, U. S. Air Force, US Air
  Force, and USAF; not the army, the navy, or other armed services.
examples:
- He joined the United States Air Force.
- The United States Air Force guards the skies.
