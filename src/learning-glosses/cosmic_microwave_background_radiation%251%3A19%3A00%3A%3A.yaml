simpleMeaning: The cooled remnant of the hot big bang, filling the whole universe and observable today,
  with an average temperature of about 2.725 kelvin.
scope: Also called cosmic background radiation and cosmic microwave background, it is the cooled remains
  of the big bang, not light from stars.
examples:
- The cosmic microwave background radiation can be picked up by radio telescopes.
- The cosmic microwave background radiation is the cooled remains of the big bang.
