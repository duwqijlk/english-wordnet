simpleMeaning: A straight plant from Europe that lives one year and is often grown for salads, to be picked
  young and soft.
scope: Also called rocket, arugula, garden rocket, rocket salad and roquette, and also Eruca sativa; a
  straight one-year plant from Europe, grown for salads and picked when young and soft.
examples:
- Eruca vesicaria sativa grows straight and is picked young for salads.
- We planted Eruca vesicaria sativa in the salad bed.
