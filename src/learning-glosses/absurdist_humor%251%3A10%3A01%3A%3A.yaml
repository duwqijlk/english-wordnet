simpleMeaning: funny stuff built on breaking the rules of cause and effect on purpose, so things happen
  in ways that make no sense at all
scope: 'Also called absurdist humour, surreal humor, and surreal humour: jokes that break the rules of
  cause and effect, not plain slapstick or wordplay.'
examples:
- The play's absurdist humor made the audience laugh at events that made no sense.
- His absurdist humor turns cause and effect upside down.
