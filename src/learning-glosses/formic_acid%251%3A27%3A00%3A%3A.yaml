simpleMeaning: A colourless, sharp-smelling, fuming, blistering acid, found in ants and plants or made
  from carbon monoxide and steam, used to finish cloth and paper and make pest sprays and gases.
scope: This is the chemical itself, not the ants that make it, not vinegar, and not the salts or other
  compounds produced from it.
examples:
- Formic acid in an ant's sting is what makes the bite burn.
- The factory uses formic acid in finishing cloth and in making pest sprays.
