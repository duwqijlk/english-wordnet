simpleMeaning: the outer shape made when rays of light are sent back or bent by a curved surface or thing
scope: In the study of light, the shape made by sent-back or bent rays, not a chemical that can burn skin,
  and not a word for harsh or unkind speech.
examples:
- The curved glass made a bright caustic on the table.
- A caustic formed where the light passed through the curved bottle and met the wall.
