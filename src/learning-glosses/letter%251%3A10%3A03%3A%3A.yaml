scope: This is the sense of the exact wording, not the noun for a written message to a person, not the
  noun for the characters of the alphabet, not the noun for a landlord who rents out property, not the
  noun for a school sports award, not the verb sense for earning a sports award, not the verb sense for
  printing characters, and not the verb sense for marking characters on something.
examples:
