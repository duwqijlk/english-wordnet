schema: oewn-learning-gloss-v2
senseId: 'unconvincingly%4:02:00::'
synsetId: 00194346-r
simpleMeaning: in a way that does not make people believe that something is true
scope: This word says how an action is done when it does not make people believe; it does not mean in
  a false way or in an unsure way.
examples:
- She explained unconvincingly why she was late, and no one believed her.
- He argued unconvincingly, so the judge did not accept his reasons.
