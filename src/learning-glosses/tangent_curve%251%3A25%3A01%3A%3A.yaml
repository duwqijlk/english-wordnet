simpleMeaning: Where x stands for an angle, the flat bent line on a graph shows y = tan x.
scope: In maths, this is the flat bent line that graphs y = tan x, where x stands for an angle, and its
  shape repeats with each full turn of the angle.
examples:
- The tangent curve rose and fell with each turn of the angle.
- She drew the tangent curve on the board.
