simpleMeaning: A person who winds threads together, or makes something by winding or weaving strands.
scope: This is a person who winds threads together or makes things by winding strands, not a weaver of
  cloth and not a rope-maker.
examples:
- The twiner wound the threads into a cord.
- A skilled twiner made the basket rim.
