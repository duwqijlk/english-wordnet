simpleMeaning: to make a person take on a bad or unfair load that they did not ask for
scope: Also called stick, this is making a person take on a bad or unfair load, not causing a sharp pain
  and not a trick to get money.
examples:
- The tax office will sting us with a huge bill we did not ask for.
- The new rules sting small shops with high fees they did not ask for.
