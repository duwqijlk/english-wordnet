simpleMeaning: not calm or peaceful, but full of trouble and lacking order
scope: Marked by trouble and lack of order in a place or time, not the sense of a person causing, feeling
  or showing worry.
examples:
- The city had unquiet days after the riots began.
- They spent an unquiet night while crowds shouted in the streets.
