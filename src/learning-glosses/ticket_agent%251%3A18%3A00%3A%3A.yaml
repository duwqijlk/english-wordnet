simpleMeaning: Passes for seats at a show or for places on a trip are sold by a person whose job is selling
  them.
scope: This person, also called a booking clerk, sells passes for seats at a show or for places on a trip.
examples:
- The ticket agent sold us passes for seats at the show.
- Ask the ticket agent for a place on the trip.
