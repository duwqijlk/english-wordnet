simpleMeaning: with short needles and egg-shaped cones, this very tall fir tree grows in the north-west
  of North America
scope: Also called douglas hemlock, douglas pine, and green douglas fir, this is a fir of the north-west,
  not a true spruce.
examples:
- The douglas spruce towered over the other trees in the valley.
- They planted a douglas spruce at the edge of the wood.
