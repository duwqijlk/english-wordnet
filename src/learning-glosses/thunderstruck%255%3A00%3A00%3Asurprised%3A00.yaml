simpleMeaning: surprised so much that a person cannot speak
scope: 'Also called dumbfounded, flabbergasted, stupefied, dumbstruck and dumfounded: so surprised you
  cannot speak, not hit by a storm and not just a little surprised.'
examples:
- She was thunderstruck by the news of her promotion.
- He stood thunderstruck when he saw the surprise party.
