simpleMeaning: A worker who threads things on a string.
scope: A worker who threads things on a string; not a brace of a long piece that stiffens the body of
  a plane or a ship, nor a long flat beam that joins uprights.
examples:
- Their stringer of beads worked at noon.
- The stringer threaded the pearls.
