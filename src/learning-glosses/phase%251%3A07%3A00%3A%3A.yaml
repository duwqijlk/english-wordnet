simpleMeaning: In astronomy, the shape a body shows as light falls on it, especially the returning shapes
  of the part of Earth's moon lit by the sun
scope: This is how the moon or another body looks in light, not a state of matter in chemistry and not
  a point in a repeating cycle.
examples:
- Tonight we can see the full phase of the moon.
- The phase of the moon changes each night as more of it catches the sun's light.
