simpleMeaning: Bright yellow flowers and leaves with hairs and rounded parts grow on a handsome shrub
  from California and the north of Mexico, one of a few kinds, green all year.
scope: Also called flannelbush, this is a shrub with bright yellow flowers from California and northern
  Mexico, not a tree and not a flower grown for cloth.
examples:
- The flannel bush in the yard has bright yellow flowers.
- A flannel bush grew by the front gate.
