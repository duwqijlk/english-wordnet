simpleMeaning: a change in which voters stop backing any one party, and so the parties grow weak
scope: This is a shift of voters away from party loyalty, not a move toward a new party and not a change
  in how people vote on one day.
examples:
- Dealignment has left many voters with no firm party loyalty.
- The rise in dealignment weakened the old party system.
