simpleMeaning: the state of being made bigger or of having grown bigger
scope: The state of being bigger. It is not a big photo print made from a smaller photo, which is a different
  sense of the same word.
examples:
- The doctor found an enlargement of the heart.
- The swelling caused an enlargement of her ankle.
