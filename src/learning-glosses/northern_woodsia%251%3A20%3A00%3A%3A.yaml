simpleMeaning: A slender North American fern from the north of the continent, whose shiny chestnut-brown
  leaf stalks carry twice-divided fronds, with spores in usually separate clusters along the edges.
scope: Another name for the fern called flower-cup fern; both are the same slender northern North American
  species, not a distinct fern.
examples:
- Northern woodsia is a slender fern with shiny chestnut-brown stalks.
- The northern woodsia's fronds are divided twice, with spore clusters near the edges.
