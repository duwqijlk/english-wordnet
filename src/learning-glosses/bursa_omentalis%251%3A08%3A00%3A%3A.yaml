simpleMeaning: A closed-off part of the space inside the belly, lying at the back of the stomach
scope: A closed-off part of the space inside the belly, at the back of the stomach; lesser peritoneal
  cavity and omental bursa are other names for this sense, not the stomach itself and not the whole belly
  space.
examples:
- The bursa omentalis lies behind the stomach.
- Fluid can collect in the bursa omentalis.
