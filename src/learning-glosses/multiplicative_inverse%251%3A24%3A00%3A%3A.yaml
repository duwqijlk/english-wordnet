senseId: 'multiplicative_inverse%1:24:00::'
synsetId: 13865372-n
simpleMeaning: In mathematics, one of two numbers that make 1 when one is times the other, such as 3/2
  for 2/3 and 1/7 for 7
scope: 'Also called a reciprocal: in mathematics, one of two numbers that make 1 when one is times the
  other, not the number that makes 0 when added and not a number on its own.'
examples:
- The multiplicative inverse of 7 is 1/7.
- To find the multiplicative inverse of 2/3, turn the top and bottom numbers round to get 3/2.
