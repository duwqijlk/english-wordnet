senseId: 'wet_lung%1:26:00::'
synsetId: 14078534-n
simpleMeaning: 'Acute damage to the breathing organs with coughing and crackling sounds: tissue swells,
  stiffens, turns fibrous and cannot take in oxygen; strikes people breathing harsh chemical vapors, ammonia
  or chlorine.'
scope: 'This is a distinct condition: the acute injury to the breathing organs from harsh chemical irritants,
  related to but not identical with adult respiratory distress syndrome and white lung; not the newborn
  disease that stops the lungs expanding.'
examples:
- The firefighters were treated for wet lung after breathing the chemical smoke.
- Wet lung is a risk for anyone breathing corrosive vapors.
