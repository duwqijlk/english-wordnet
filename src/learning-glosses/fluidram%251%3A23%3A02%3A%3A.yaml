simpleMeaning: 'Sixty minims, tiny measures of liquid, or 3.5516 cubic centimetres: that is how much liquid
  or dry stuff this British measure of the old empire holds'
scope: Drachm, fluid drachm and fluid dram are also names for this British measure of the old empire for
  how much liquid or dry stuff fills, the same as 60 minims or 3.5516 cubic centimetres, unlike the apothecary
  measure of one eighth of a fluid ounce.
examples:
- One fluidram is the same as 60 minims.
- A fluidram is a British measure for liquid or dry stuff.
