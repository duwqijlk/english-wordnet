simpleMeaning: in a way that has to do with faith, God, or the inner life of a person
scope: In a way linked to faith or the inner life, not in a way linked to the body or to money and things.
examples:
- She felt spiritually calm after a morning of prayer.
- The monks live with very little, but they feel spiritually rich.
