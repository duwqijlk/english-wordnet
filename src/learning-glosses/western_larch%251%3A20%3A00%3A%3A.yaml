simpleMeaning: Pale green sharply pointed leaves and oblong cones mark this tall larch of the west of
  North America, a tree prized for its timber.
scope: Also called western tamarack, this tall larch of the west of North America is valued for its timber.
examples:
- Western larch grows tall in the west of North America.
- In the west, the larch cones were oblong, and its leaves a pale green.
