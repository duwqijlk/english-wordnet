simpleMeaning: A long-term condition in which the immune system attacks the joint lining, causing inflammation
  and lasting deformity; a virus may start it, and it can destroy the whole joint.
scope: This sense is the autoimmune joint disease also called rheumatoid arthritis; it is not the older
  broad use of rheumatism for any joint or muscle pain.
examples:
- The doctor explained that her rheumatism was an autoimmune disease attacking her joints.
- In her case, rheumatism had deformed the joints of both hands.
