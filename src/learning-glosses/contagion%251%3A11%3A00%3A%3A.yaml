simpleMeaning: One time when a disease that can spread moves from one person or thing to another
scope: A single time when a disease that can spread is passed on, and infection and transmission are other
  names for this sense, not the disease itself, which is a different sense of the same word.
examples:
- The contagion began when one sick child passed the illness to the whole class.
- Doctors traced the contagion to a single meal shared by the guests.
