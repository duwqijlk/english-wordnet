simpleMeaning: a marriage for a set time, with terms the pair set themselves, in a Shiite custom allowed
  in Iran, lasting from a few minutes to 99 years
scope: A short-term marriage in the Shiite faith, allowed in Iran, in which the pair set the terms; not
  a marriage for life and not a marriage with no set terms.
examples:
- They entered into sigeh for one year.
- Sigeh lets the couple agree the terms of their marriage.
