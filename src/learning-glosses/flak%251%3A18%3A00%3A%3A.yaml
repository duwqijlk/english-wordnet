simpleMeaning: a smooth-talking person who speaks for an employer and can turn bad things said about the
  employer into something good for them
scope: This is a person who speaks for a company or employer; not the guns that shoot up at planes, and
  not strong criticism.
examples:
- The company's flak answered every hard question with a smile.
- As the firm's flak, he made the bad news sound like a win.
