simpleMeaning: A combat support group in the Defense Department that builds, runs and helps keep computer
  systems going for the President, the Defense Secretary and the top military chiefs.
scope: Also called Defense Information Systems Agency; a military support group for computer systems,
  not a fighting unit and not a civilian office.
examples:
- DISA runs the computer systems for the top chiefs.
- DISA serves the President and the Defense Secretary.
