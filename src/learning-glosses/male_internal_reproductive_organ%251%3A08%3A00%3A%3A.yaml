simpleMeaning: The ampullary, vesicular, prostate, bulbourethral, and urethral glands together make up
  the glands of a man that work in making young.
scope: The glands inside a man that take part in making young, not the glands on the outside of the body.
examples:
- The male internal reproductive organ includes the prostate gland.
- Doctors learn the parts of the male internal reproductive organ in training.
