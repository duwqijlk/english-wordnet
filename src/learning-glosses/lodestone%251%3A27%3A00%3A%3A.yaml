simpleMeaning: magnetite (a dark rock with iron in it) that is always a magnet, with north and south ends;
  it pulls iron to it and iron pulls it
scope: This rock, also called loadstone, is a magnet from nature; it is not a magnet made by people and
  not just any rock with iron in it.
examples:
- The lodestone pulled the iron nails across the table toward it.
- Sailors once used a lodestone to help them find their way at sea.
