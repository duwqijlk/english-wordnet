simpleMeaning: a room that can be filled with hot mist where people wash; in Britain it has a name with
  the word vapour in it
scope: 'Also called steam room, vapor bath and vapour bath: a room filled with hot mist for washing in,
  not a hot tub and not a shower.'
examples:
- We relaxed in the steam bath after our swim.
- The hotel's steam bath was full of hot mist.
