simpleMeaning: A prickly shrub with yellow flowers that grows on the open moorland of New England and
  Europe.
scope: A prickly yellow-flowered shrub of the moors, also called broom tree and petty whin; not a rose
  bush and not a gorse bush.
examples:
- The needle furze bloomed yellow across the moor.
- She pricked her hand on a needle furze while walking the moors.
