simpleMeaning: the stale feel of air in a shut-up place, with little fresh air coming in
scope: The stale, airless feel of a shut-up place, not nearness in space and not warm friendship.
examples:
- The closeness of the small, shut-up room made her feel faint.
- He opened a window to let out the closeness of the stuffy office.
