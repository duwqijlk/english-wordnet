simpleMeaning: a little ill, or likely to become ill often or easily
scope: 'Also called unwell, sickly, poorly, ailing, seedy and indisposed: a little ill, not having a high
  pointed top and not having reached the highest point.'
examples:
- You look a little peaked today, so you should rest at home.
- The child has looked peaked all week and will stay in bed.
