senseId: 'discernment%1:07:00::'
synsetId: 04898205-n
simpleMeaning: the quality of being able to judge things wisely and in a fair way that is not changed
  by your own feelings
scope: 'Another name for this sense is discretion: the quality of judging wisely and fairly. It is not
  a fine sense of taste in art or beauty.'
examples:
- A man of discernment, he chose the honest plan over the popular one.
- Her discernment helped the court reach a fair decision.
