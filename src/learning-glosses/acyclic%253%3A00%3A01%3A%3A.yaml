simpleMeaning: not in a ring shape, especially with parts set in spirals rather than in rings
scope: A shape or plant part that does not form a ring, especially one with parts in spirals, not a ring-shaped
  thing and not one with parts set in round rings around a stem.
examples:
- The acyclic flower had its parts set in spirals, not in rings.
- Botanists call the arrangement acyclic because the parts do not form a ring.
