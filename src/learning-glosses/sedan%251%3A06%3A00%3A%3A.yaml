simpleMeaning: A closed car with seats at the front and back, and two or four doors.
scope: This is a closed car with front and back seats; saloon is another name for this sense, not an open
  car or a car with only one row of seats.
examples:
- They bought a comfortable sedan for the long drive south.
- The sedan had four doors and room for five people.
