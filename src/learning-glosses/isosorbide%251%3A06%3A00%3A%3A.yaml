simpleMeaning: Chest pain from the heart and a heart that cannot pump blood well enough are treated with
  this drug, sold under the name Isordil
scope: A drug for chest pain from the heart and a heart that cannot pump well, not a drug for pain in
  general and not a drug that makes the heart beat faster.
examples:
- The doctor gave her isosorbide for her chest pain.
- He takes isosorbide each day to help his failing heart.
