simpleMeaning: the kind of movement that liquids and gases make as they run or drift.
scope: This is the movement of a liquid or gas itself, not the act of something moving along without a
  break and not a steady supply of something.
examples:
- The flow of water through the pipe was blocked by leaves.
- Engineers measured the flow of gas through the valve.
