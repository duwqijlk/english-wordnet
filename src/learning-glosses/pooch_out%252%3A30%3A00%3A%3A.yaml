simpleMeaning: As if to kiss, a person pushes the lips into a round shape
scope: To push the lips into a round shape as if about to kiss; pooch is another name for this sense,
  not the act of sticking out the tongue.
examples:
- She pooched out her lips for the camera.
- He pooched out his lips as if to kiss her.
