simpleMeaning: A plant in the Aquilegia group with bright, uneven flowers with long thin points; it grows
  in mild areas in the north, especially in mountains
scope: Also called aquilege and aquilegia, this is a plant with bright flowers that have long thin points,
  growing in mild northern areas, especially mountains.
examples:
- Purple columbines grew along the mountain path.
- She planted columbine in her garden for its bright, pointed flowers.
