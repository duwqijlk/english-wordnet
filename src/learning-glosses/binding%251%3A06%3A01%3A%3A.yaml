simpleMeaning: a strip sewn over or along an edge to make it stronger or to make it look good
scope: A strip sewn over or along an edge to make it stronger or to make it look good, not a ski clip,
  and not the cover of a book.
examples:
- The binding along the hem had come loose.
- She sewed a binding over the edge of the quilt.
