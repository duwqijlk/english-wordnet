simpleMeaning: the act of freeing a person from sin or guilt, so their soul and their way of living become
  clean
scope: This sense is about freeing a person from sin or guilt, not a ceremony to clean a person, not taking
  bad parts out of things like oil, and not cleaning in general.
examples:
- He sought purification through repentance after what he had done.
- For her, purification meant letting go of guilt and starting a clean life.
