simpleMeaning: a person who has little belief in himself or herself and finds it hard to make and keep
  to a clear choice
scope: This is a word for a person who is unsure and keeps changing his or her mind, not the farm bird
  and not its meat.
examples:
- He changed his mind three times about which course to take, and his friends teased him for being a chicken.
- Make up your mind and stick to it — don't be such a chicken, she told him.
