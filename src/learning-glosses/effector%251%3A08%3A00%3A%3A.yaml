senseId: 'effector%1:08:00::'
synsetId: 05305920-n
simpleMeaning: a part of the body, a gland or a muscle, that starts to work when it gets a signal from
  a nerve
scope: This is the gland or muscle that does the work, not the nerve thread that carries the signal to
  it.
examples:
- When the nerve signal reaches the effector, the muscle tightens.
- A sweat gland is an effector that starts working when nerves tell it to make sweat.
