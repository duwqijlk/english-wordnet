simpleMeaning: a tube or passage inside the body, with walls of surface cells, that carries a liquid the
  body makes or some other thing
scope: 'Also called channel: a tube inside the body that carries a liquid, not a long water way made for
  boats and not a mark on Mars.'
examples:
- The canal that carries tears from the eye was blocked.
- Food moves through a long canal inside the body.
