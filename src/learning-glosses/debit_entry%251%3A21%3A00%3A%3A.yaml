simpleMeaning: In accounting, a written record that says money is owed
scope: This is a written record in a set of books saying money is owed, also called a debit; not a payment
  made and not a credit entry.
examples:
- The debit entry showed the amount the shop still owed its supplier.
- She checked the debit entry before she closed the books for the month.
