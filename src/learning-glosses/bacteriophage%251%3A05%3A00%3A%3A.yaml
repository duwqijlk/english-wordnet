simpleMeaning: a tiny thing that lives in bacteria and makes copies of itself inside them
scope: 'Also called a phage: a tiny thing that lives and makes copies of itself in bacteria, not a germ
  that attacks people and not a germ that lives on its own.'
examples:
- The bacteriophage broke open the bacterium and set free many more copies of itself.
- Scientists use a bacteriophage to study how a tiny thing can take over a bacterium.
