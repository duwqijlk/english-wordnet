simpleMeaning: A middle-sized evergreen tree with an even shape and red flowers, grown widely in hot lands
  for its flower buds, which give the spice cloves.
scope: Also called a clove, a clove tree, Eugenia caryophyllatum, or Syzygium aromaticum; a middle-sized
  evergreen tree with an even shape and red flowers, grown in hot lands for its flower buds, kin to other
  spice trees.
examples:
- Eugenia aromaticum grows in the tropics, its red flowers bright among the leaves.
- The flower buds of Eugenia aromaticum give the spice cloves.
