simpleMeaning: the study of the shape of the land above sea level, with a focus on measuring how high
  land is compared with the sea
scope: The study of the shape of land above sea level, with a focus on measuring heights, not the study
  of the sea floor and not the making of maps in general.
examples:
- He used hypsography to map the heights of the hills above the sea.
- He studied hypsography to learn how high the plateau stood.
