senseId: 'absolutist%1:18:00::'
synsetId: 09774729-n
simpleMeaning: a person who supports a system in which one ruler or government has full power with no
  limits
scope: A person who supports rule by one person or government with full power and no limits. Not the adjective
  sense that describes something linked to that kind of rule.
examples:
- As an absolutist, he believed the king should hold all power.
- The absolutist spoke in favour of a government with no limits on its power.
