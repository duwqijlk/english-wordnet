senseId: 'devices%1:09:00::'
synsetId: 06208611-n
simpleMeaning: a want or wish to do something, used in the plural in the fixed saying that means left
  to choose and act on your own
scope: This is what someone wants to do, as in being left to your own devices, not tools or machines used
  for a job.
examples:
- Left to his own devices, he spent the day reading.
- The children were left to their own devices and built a camp in the garden.
