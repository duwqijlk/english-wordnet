simpleMeaning: A shrub that poisons farm animals, found on the low coastal land of the eastern United
  States, that loses its leaves in winter and bears hanging pinkish-white flowers.
scope: Stagger bush is another name for this shrub of the eastern coastal plain that poisons farm animals.
examples:
- Staggerbush grows along the flat coastal plain.
- The staggerbush poisoned the farmer's cattle.
