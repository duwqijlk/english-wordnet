simpleMeaning: lenses in frames that grow dark when the sun shines on them
scope: Lenses in frames that grow dark when the sun shines on them; photochromic eyewear and photochromic
  glasses are other names for this sense, not plain dark glasses and not lenses that only shield the eyes
  from glare.
examples:
- His photochromic eyeglasses darkened as soon as he stepped into the sun.
- She wears photochromic eyeglasses that grow dark in the sun.
