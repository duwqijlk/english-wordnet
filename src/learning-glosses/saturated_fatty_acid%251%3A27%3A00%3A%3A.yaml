simpleMeaning: No more hydrogen can be taken in by the chain of carbon in this fat-like substance, found
  mostly in animal fat.
scope: A fat-like substance whose carbon chain cannot take in any more hydrogen, not an unsaturated one.
examples:
- This saturated fatty acid cannot take in any more hydrogen.
- Saturated fatty acid is found mostly in animal fat.
