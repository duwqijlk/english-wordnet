simpleMeaning: The part of a ship's body that sits open to the moving air, which pushes against it and
  slows it down
scope: This is the part of a ship's body that sits open to the moving air; windage is another name for
  this sense, and it is not the whole ship or the moving air itself.
examples:
- The wind exposure of the old hull made the ship slow in a gale.
- They painted the wind exposure to protect it from the sea.
