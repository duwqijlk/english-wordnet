simpleMeaning: A tool for pressing something down tight, as tobacco into a pipe, powder into a hole, or
  other such things
scope: A tool for pressing things down tight; tamper is another name for this sense, not the act of pressing
  down itself.
examples:
- He used a tamp to press the tobacco into his pipe.
- The worker packed the hole with a tamp.
