simpleMeaning: a design or picture shown on a shield in heraldry, the old system of family coats of arms
scope: This is an emblem drawn on a shield, not an amount of electricity and not a claim of guilt.
examples:
- The lion is a common charge on medieval shields.
- Each charge on the family's coat of arms had a special meaning.
