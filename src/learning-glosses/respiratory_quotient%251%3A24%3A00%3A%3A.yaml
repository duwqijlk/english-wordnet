simpleMeaning: Over a set time, a living thing or a cell breathes out carbon dioxide and takes in oxygen,
  and this number is the first amount divided by the second.
scope: Of all the numbers that describe breathing, this is the one got by dividing the carbon dioxide
  breathed out by the oxygen taken in.
examples:
- The respiratory quotient rose when more carbon dioxide was breathed out for the oxygen taken in.
- The respiratory quotient showed how the cells used oxygen over an hour.
