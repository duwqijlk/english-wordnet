senseId: 'multiple_voting%1:04:00::'
synsetId: 00185651-n
simpleMeaning: One person casting a ballot in more than one place at the same election, which is against
  the law in the United States
scope: One person casting a ballot in more than one place at the same election, against the law in the
  United States; not one person casting a ballot once and not different people casting ballots in different
  places.
examples:
- He was caught multiple voting in two towns at the same election.
- The clerk found that one man had been multiple voting at three polling places.
