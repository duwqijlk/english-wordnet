simpleMeaning: having starch in it or made of it, the white stuff found in foods like potatoes and rice
scope: This sense is about food or other things that have starch in them; it is not about a person being
  stiff and formal in the way they act.
examples:
- Potatoes and bread are starchy foods that fill you up.
- She cut down on starchy foods like rice and pasta.
