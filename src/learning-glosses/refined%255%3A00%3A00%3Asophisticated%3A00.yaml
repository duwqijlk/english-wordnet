simpleMeaning: Showing very good taste and calm sureness that come from a lot of wide experience among
  people in society.
scope: Good manners and taste from wide social experience, not simply being well made or pure.
examples:
- His refined manners impressed everyone at dinner.
- She spoke in a refined way that showed years of travel.
