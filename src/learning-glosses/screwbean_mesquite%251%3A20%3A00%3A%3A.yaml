simpleMeaning: This bush or small tree of the southwest of the United States and the northwest of Mexico
  is known by its seed cases, twisted round in a curl.
scope: People also call it screw bean, screwbean, or tornillo, and it is the bush or tree itself, not
  the sweet pod it bears.
examples:
- The screwbean mesquite bore seed cases twisted round in a curl.
- The screwbean mesquite grew in the northwest of Mexico.
