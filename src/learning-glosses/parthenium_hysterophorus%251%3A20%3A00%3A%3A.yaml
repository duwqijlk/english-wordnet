simpleMeaning: A weed of tropical America that lives for one year, with small star-like heads of white
  flowers, now also found in the south of the United States
scope: This is a weed of tropical America that lives for one year, with small star-like heads of white
  flowers, now also found in the south of the United States; bastard feverfew is another name for this
  sense, and a weed of tropical America that lives for many years is a different kind.
examples:
- Parthenium hysterophorus grows along the roads of the south.
- The Parthenium hysterophorus had small heads of white flowers.
