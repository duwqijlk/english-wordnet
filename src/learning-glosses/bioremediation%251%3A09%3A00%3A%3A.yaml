simpleMeaning: a part of the use of living things in science to fix harm done to the land, air, or water
scope: This is a field of study that uses living things to fix harm to the land, air, or water, not the
  act of treating waste with tiny living things and not cleaning up harm with chemicals.
examples:
- The lab studies bioremediation to clean up oil in the soil.
- Bioremediation may help bring life back to a dead river.
