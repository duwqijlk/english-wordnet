simpleMeaning: A huge group of star groups in the way of Centaurus and Hydra, whose pull is thought to
  bend the paths of other star groups
scope: A huge group of star groups whose pull is thought to bend the paths of others, not a single star
  or a black hole.
examples:
- The Great Attractor pulls on the star groups round it.
- Other star groups move off their paths near the Great Attractor.
