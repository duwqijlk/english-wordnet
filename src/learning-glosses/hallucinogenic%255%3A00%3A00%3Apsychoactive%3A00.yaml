senseId: hallucinogenic%5:00:00:psychoactive:00
synsetId: 01781757-s
simpleMeaning: able to make a person see or hear things that are not really there
scope: This describes something, such as a drug, that makes a person see or hear things that are not real,
  not a drug that only calms a person or keeps a person awake.
examples:
- LSD is a strong hallucinogenic drug.
- The plant has hallucinogenic effects and can make people see strange shapes.
