simpleMeaning: A person from a group of people who live mainly in Kanara, in the south of India, and speak
  Kannada
scope: This is a person from a Kannada-speaking group living mainly in Kanara in southern India; Canarese
  is another name for this sense, not the Kannada tongue itself and not other peoples of southern India.
examples:
- The Kanarese farmer spoke Kannada at home.
- Many Kanarese live in the towns of Kanara.
