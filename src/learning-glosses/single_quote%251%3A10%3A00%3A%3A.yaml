simpleMeaning: A small mark used to show where a quotation starts or ends
scope: One small mark showing where a quotation starts or ends; not the double mark used for the same
  job, and not the words quoted themselves.
examples:
- Put a single quote at the start of the quoted words.
- The single quote marks the end of the quotation.
