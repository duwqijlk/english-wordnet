simpleMeaning: A plant of eastern North America with a bunch of small white flowers at the top and parts
  below ground used as medicine
scope: 'Also called senega root or senga root: a North American plant with small white flowers and parts
  below ground used as medicine, not a plant grown for food and not a plant grown only for its flowers.'
examples:
