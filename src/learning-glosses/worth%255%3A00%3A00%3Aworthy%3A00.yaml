simpleMeaning: Good enough to deserve a stated treatment, such as being considered or visited, often said
  with irony.
scope: It is not the noun for the value of something, and not an amount equal to a sum of money.
examples:
- The museum is worth a visit.
- It is not worth getting upset about.
