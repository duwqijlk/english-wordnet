simpleMeaning: A voice or sound held at one steady pitch, with no rise or fall at any point.
scope: A voice or sound that keeps one steady pitch all the way through, not a note shifted down by a
  half step, and not a picture with weak light and dark contrast.
examples:
- He answered in a flat voice, the same pitch from first word to last.
- The teacher's flat tone made it hard to tell whether she was asking or telling.
