simpleMeaning: the money left when what comes in during a set time is more than what goes out, not counting
  costs that are not paid in money
scope: The money left when what comes in during a set time is more than what goes out, not the total money
  taken in and not the firm's profit.
examples:
- The cash flow was strong because sales brought in more money than the firm spent.
- Good cash flow kept the small shop open through the slow month.
