simpleMeaning: This name covers insect hormones that tell them when to shed their skin and how their sex
  takes shape, such as ecdysone and other close kin like 20-hydroxyecdysone
scope: A name for a group of insect hormones, not for one single hormone and not for the shedding of skin
  itself.
examples:
- Ecdysteroids tell the caterpillar when to shed its skin.
- The lab measured ecdysteroid levels in the young insects.
