simpleMeaning: Writing on a top sheet comes out again on the sheet below, thanks to a dark waxy coat on
  one side, often with black stuff in it.
scope: Also called carbon, it is the thin sheet whose dark waxy coat copies writing onto the sheet below.
examples:
- She put a sheet of carbon paper under the letter to make a copy.
- The carbon paper left dark marks on my fingers.
