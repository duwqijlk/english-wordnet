simpleMeaning: A wide area of tracks and side lines where train cars and engines are kept and repaired
scope: A place where train cars and engines are kept and repaired, also called a yard or a railyard; not
  a single track and not a station platform.
examples:
- The railway yard was full of freight cars waiting for repair.
- Workers in the railway yard checked the engines before dawn.
