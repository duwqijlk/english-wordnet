simpleMeaning: a collection made up of things of many different kinds.
scope: This is not the state of differing, not one kind or type, and not a music-hall show; it names a
  mixed collection of different kinds of things.
examples:
- The stall offered a variety of fresh vegetables.
- The museum displays a variety of tools from the period.
