simpleMeaning: a machine joined to a garden hose that throws water over grass or a garden
scope: This is the machine on the end of a hose that throws water over grass, not the hose on its own
  and not a can for watering by hand.
examples:
- He turned on the sprinkler to water the grass.
- The sprinkler threw water all over the garden.
