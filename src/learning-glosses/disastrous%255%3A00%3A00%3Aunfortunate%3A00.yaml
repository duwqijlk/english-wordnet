simpleMeaning: describing events that lead to very bad results and bring ruin
scope: Describing events with very bad results, also called black and fatal; not merely unlucky and not
  a bad thing done on purpose.
examples:
- The disastrous storm ruined the harvest for the whole valley.
- A disastrous fire destroyed the mill in a single night.
