simpleMeaning: a substance made by some germs that stops penicillin from working and so makes the germs
  hard to kill with that drug
scope: 'Also called beta-lactamase: a germ-made substance that stops penicillin working, not the drug
  itself and not a germ that the drug can still kill.'
examples:
- The penicillinase made the infection hard to treat.
- Tests showed penicillinase in the sample, so the doctors chose another drug.
