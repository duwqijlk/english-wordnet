simpleMeaning: A dead person is taken up by the Roman Catholic or Eastern Orthodox Church as one of its
  holy people
scope: This act is also called canonisation, and it is the church's own way of naming a dead person a
  saint.
examples:
- The canonization of the missionary was celebrated.
- The church announced the canonization of the bishop.
