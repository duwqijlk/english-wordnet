simpleMeaning: wanting far too much, and trying hard to get and keep more and more things
scope: 'Also called ravening and rapacious: wanting far too much of things like money or power, not eating
  or wanting a lot of food.'
examples:
- The voracious company kept buying smaller firms and still wanted more.
- Voracious collectors will pay any price to get one more rare coin.
