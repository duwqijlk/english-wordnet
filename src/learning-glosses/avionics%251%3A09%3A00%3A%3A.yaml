simpleMeaning: the study and use of electronic tools and systems for flying planes and for space travel
scope: It is the science of the electronic systems used in flight, not the building of planes and not
  the electronics in cars or homes.
examples:
- Avionics has become even more important with the growth of the space program.
- She studied avionics so she could work on the control systems of planes.
