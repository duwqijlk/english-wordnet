simpleMeaning: a period of fifteen minutes, one fourth of an hour
scope: This is a span of fifteen minutes used in telling time, not a three-month period, a school term
  or a part of a game.
examples:
- We'll meet at a quarter past six.
- The train leaves in a quarter of an hour.
