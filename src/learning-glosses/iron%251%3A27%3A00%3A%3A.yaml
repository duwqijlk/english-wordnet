simpleMeaning: A heavy metal that bends and pulls to a magnet; white-silver when pure but rusts easily;
  used to build things, make tools and arms, and move oxygen in the blood.
scope: A metal, also called Fe or atomic number 26; not a tool for pressing cloth, and not any other metal.
examples:
- Iron rusts in the rain.
- The bridge is made of iron.
