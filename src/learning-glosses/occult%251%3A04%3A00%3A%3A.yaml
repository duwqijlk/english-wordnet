simpleMeaning: practices and ways linked to strange powers that are not part of the normal world
scope: This sense is the practices and ways themselves. It is not the strange powers and beings taken
  together, and not the verb about hiding a star or moon.
examples:
- He studies the occult and learns old magic practices.
- Books on the occult describe ways people try to reach spirits.
