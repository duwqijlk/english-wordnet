simpleMeaning: a long collared robe reaching the feet, sleeves tapering to the hand, worn under other
  robes by all clergy, monks and nuns, and often by men training to be priests
scope: 'Also called an inner rason: a long robe worn under other church robes, not the outer robe worn
  over it.'
examples:
- The priest wore his inner cassock under his outer robe.
- The young seminarian put on his inner cassock before the service.
