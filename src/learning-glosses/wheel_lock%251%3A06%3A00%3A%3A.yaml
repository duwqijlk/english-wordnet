simpleMeaning: an old part of a gun, no longer used, that sets off the shot with a piece of hard stone
  and a small round part that turns
scope: An old part of a gun, no longer used, that sets off the shot with hard stone and a small turning
  part, not a modern gun part and not a lock on a door.
examples:
- The old pistol had a wheel lock that sparked when the wheel turned.
- Collectors look for guns with a wheel lock in good shape.
