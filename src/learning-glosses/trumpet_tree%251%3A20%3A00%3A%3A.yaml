simpleMeaning: a plant from warm parts of America, with big leaves shaped like shields and stems that
  are hollow inside
scope: A tree from warm parts of America, with big shield-shaped leaves and hollow stems; trumpet-wood,
  trumpetwood, imbauba and snake wood are other names for this sense, not a trumpet flower vine.
examples:
- A trumpet tree shaded the path with its large leaves.
- The trumpet tree had hollow stems and leaves shaped like shields.
