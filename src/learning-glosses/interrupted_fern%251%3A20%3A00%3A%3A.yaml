simpleMeaning: a tall North American plant with straight feather-like leaves; on the leaves that make
  spores, a few spore-making leaf parts sit at or near the middle
scope: A North American plant with tall, straight, feather-like leaves whose spore-making parts sit near
  the middle, not other ferns whose spore-making parts run all along the leaf.
examples:
- The interrupted fern grows tall along the shaded stream bank.
- On the interrupted fern, the dark spore-making parts sit near the middle of a few leaves.
