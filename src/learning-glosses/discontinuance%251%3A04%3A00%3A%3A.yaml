simpleMeaning: the act of stopping something or breaking it off, so there is a gap that may last a short
  time or for good
scope: The act of stopping something or breaking it off, also called discontinuation, and not a short
  rest that is part of the plan.
examples:
- The discontinuance of the payments left the family without help.
- After a long discontinuance, the classes started again in the spring.
