simpleMeaning: having a small bag-like part that can hold things
scope: This describes something that has a pouch, as some animals do, not the bag itself and not something
  with no such part.
examples:
- A pouched mouse keeps its young in a pouch on its belly.
- The pouched rats of Africa have large pockets in their cheeks for food.
