simpleMeaning: The national tongue of the island state of Malta, a Semitic tongue that comes from Arabic
  but has many words taken from Italian, Spanish and Norman-French.
scope: 'Also called Maltese, Maltese language and Malti language: the national tongue of Malta, not the
  toy dog breed or the cat of the same name, and not the word for things from Malta.'
examples:
- Malti is the national tongue of Malta.
- She spoke Malti with her grandmother in Malta.
