simpleMeaning: Tiny sea life and small fish feed this huge flat sea animal of the warm open seas, most
  times harmless but a danger when harpooned, because of its size.
scope: 'People also call it a devilfish or a manta: it is the huge flat sea animal of the warm open seas.'
examples:
- A manta ray glided in the warm water.
- The manta ray turned dangerous after it had been harpooned.
