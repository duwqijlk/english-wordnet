simpleMeaning: A drug taken by mouth that kills fungus, used for nail disease caused by fungus.
scope: Also called itraconazole, this is a medicine taken by mouth for nail disease caused by fungus,
  not a cream rubbed on the skin.
examples:
- The doctor gave her Sporanox for the fungus in her toenails.
- He took Sporanox each day until the nail grew clear.
