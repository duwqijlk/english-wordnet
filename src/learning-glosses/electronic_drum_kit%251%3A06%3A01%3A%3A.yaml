simpleMeaning: Pads and cymbal-like parts that a player strikes with sticks, hands or brushes, sending
  signals to a unit that turns them into percussion and other sounds.
scope: A complete playable instrument, not a single strike pad and not an acoustic drum kit; 'electronic
  drum set' is another name for it.
examples:
- He bought an electronic drum kit for his son's birthday.
- The band's electronic drum kit can imitate dozens of percussion sounds.
