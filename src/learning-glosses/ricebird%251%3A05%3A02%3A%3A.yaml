simpleMeaning: a small finch-like winged creature from Indonesia that weaves nests and often visits fields
  of the white grain
scope: Not a big hunting creature, and not a water creature; a small nest-weaving creature of grain fields.
examples:
- A ricebird perched on the fence by the field.
- Ricebirds flocked over the grain fields at dusk.
