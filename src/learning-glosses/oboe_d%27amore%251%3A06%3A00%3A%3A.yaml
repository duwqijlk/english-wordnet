simpleMeaning: a woodwind pipe that sounds a small third lower than the usual one of its kind, played
  in baroque music
scope: A woodwind pipe that sounds a small third lower than the usual one of its kind, played in baroque
  music; not the usual higher pipe of its kind and not a clarinet.
examples:
- The oboe d'amore sounds lower than the usual oboe in the baroque piece.
- She played the oboe d'amore in the baroque piece because its lower sound suited the old music.
