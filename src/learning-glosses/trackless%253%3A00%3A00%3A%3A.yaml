simpleMeaning: with no marks left by anything that has passed, or with no rails to run on
scope: This describes a place with no marks left by anything passing, or a vehicle that runs on a road
  with no rails. It is not a path itself, and it is not the act of following someone.
examples:
- They walked across the trackless snowy meadow, with no foot marks anywhere.
- A trackless trolley runs on the road and takes its power from wires above.
