simpleMeaning: A poor, crowded part of a city where a small group of people of one kind live, held together
  by lack of money and rules that keep them apart
scope: A poor, crowded city district where a small group lives, held together by hardship and rules; not
  the old Jewish quarter of a European city and not any poor part of a city.
examples:
- Families in the ghetto shared one tap for water.
- The ghetto grew crowded as more people moved in.
