simpleMeaning: a chemical that can lose two hydrogen atoms, found only when mixed in liquid and in salts
  made from it
scope: A chemical that can lose two hydrogen atoms; not the salts made from it and not a chemical that
  loses only one hydrogen atom.
examples:
- Manganic acid exists only in solution.
- The manganic acid was kept in liquid form.
