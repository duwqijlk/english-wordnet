simpleMeaning: the light outer covering of a bird, made of hard material that keeps water out
scope: 'Also called plume: this is all of a bird''s outer covering, not one single feather and not a bird''s
  skin.'
examples:
- The peacock's bright plumage shone in the sun.
- The duck shook the water off its plumage after its swim.
