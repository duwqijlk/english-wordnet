simpleMeaning: having a light, lively beat that moves along with ease
scope: Also called swinging and tripping. It describes music or movement with a light, lively beat, not
  music or movement that is slow and heavy.
examples:
- She sang in a lilting voice that rose and fell with the tune.
- He walked with a lilting step to the music.
