simpleMeaning: On a sudden urge, a thing is done at once, with no warning and no thought first, when it
  is not expected
scope: A thing done at once, with no warning and no plan made first, also called dead, suddenly, short,
  abruptly, all of a sudden and of a sudden; not a thing done after a plan and not a thing done slowly.
examples:
- He decided on the spur of the moment to drive to Chicago.
- On the spur of the moment, she bought the red coat without thinking it through.
