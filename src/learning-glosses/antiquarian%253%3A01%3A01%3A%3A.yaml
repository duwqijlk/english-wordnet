simpleMeaning: To do with people who study or trade in old and rare things.
scope: To do with people who study or deal in antiques, not with the antiques themselves and not a person
  who collects them.
examples:
- Their interests were antiquarian, centred on old books.
- The society was antiquarian in its aims.
