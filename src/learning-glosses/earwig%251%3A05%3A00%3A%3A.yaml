simpleMeaning: one of many insects in the group called Dermaptera, with a long thin body, thin feelers
  with many joints, and two large pinching parts at the end of its belly
scope: This sense is the insect with two pinching parts at its back, not a worm or any other small garden
  animal.
examples:
- An earwig ran out from under the wet leaves in the garden.
- Earwigs often hide in dark, damp places during the day.
