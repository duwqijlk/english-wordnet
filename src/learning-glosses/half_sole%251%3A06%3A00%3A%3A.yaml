simpleMeaning: The front part of the bottom of a shoe, reaching from the middle to the toe
scope: The front part of a shoe bottom, not the whole bottom and not the heel.
examples:
- The cobbler fitted a new half sole to my shoe.
- A half sole covers only the front of the shoe bottom.
