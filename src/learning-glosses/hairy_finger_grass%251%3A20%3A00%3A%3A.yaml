simpleMeaning: A plant from Europe grown to feed farm animals and cut for dried feed, now growing wild
  in the United States as a weed.
scope: This is a European plant grown to feed farm animals and cut for dried feed, not a garden plant;
  also called large crabgrass.
examples:
- Hairy finger grass grows along the roadside.
- Farmers cut hairy finger grass for hay.
