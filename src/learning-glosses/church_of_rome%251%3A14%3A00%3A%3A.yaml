simpleMeaning: The Christian faith group based in the Vatican, led by a pope and by bishops in rank order.
scope: This is the Christian faith group based in the Vatican, led by a pope and by bishops in rank order,
  also called the Roman Catholic, the Roman Catholic Church, the Roman Church or the Western Church; it
  is not the Church of England and not a church led by a king or queen.
examples:
