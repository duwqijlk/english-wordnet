simpleMeaning: a long piece of spoken or written words that sets out ideas in full
scope: A long stretch of speech or writing, not a talk back and forth between people on one topic.
examples:
- His discourse on the history of the town filled the whole evening.
- The discourse in her letter set out her views at length.
