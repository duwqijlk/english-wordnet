synsetId: 00382827-r
simpleMeaning: in a way that shows no wish to accept beliefs or ways unlike one's own
scope: In a way that shows no wish to accept beliefs or ways unlike one's own; not in a way that is merely
  narrow in outlook, and not in a way that is cruel.
examples:
- He spoke intolerantly about the customs of his neighbours.
- The group acted intolerantly toward anyone who disagreed.
