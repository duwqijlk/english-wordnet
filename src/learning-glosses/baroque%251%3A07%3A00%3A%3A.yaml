simpleMeaning: Rich decoration with much detail, covering large areas, in art made to decorate things
  and in building, in a style that did very well in Europe in the 1600s
scope: 'Also called baroqueness: the rich decoration itself in art and building, not the word for describing
  a building or a work of art as being in that style.'
examples:
- They studied the baroque in old churches across Europe.
- The hall's baroque includes heavy gold decoration around the doors.
