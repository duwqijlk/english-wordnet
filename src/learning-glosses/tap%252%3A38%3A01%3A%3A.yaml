simpleMeaning: to dance and make clicking sounds that follow the beat, using metal plates fixed under
  the bottom of dance shoes
scope: To dance in shoes with metal plates, not the metal plate itself, not a part for letting water out,
  and not asking hard for something.
examples:
- She tap-danced across the stage, her shoes clicking in time with the music.
- The children learned to tap dance at their Saturday class.
