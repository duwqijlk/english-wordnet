simpleMeaning: Where tapping gives a flat sound at the front of the chest, that three-sided patch matches
  the part of the heart the lungs do not cover.
scope: Tapping at the front of the chest finds this three-sided patch, which matches only the part of
  the heart the lungs do not cover.
examples:
- Tapping the front of the chest showed the area of cardiac dullness.
- The area of cardiac dullness lay over the part of the heart the lungs did not cover.
