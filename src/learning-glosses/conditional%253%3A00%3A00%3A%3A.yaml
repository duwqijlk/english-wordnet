schema: oewn-learning-gloss-v2
senseId: 'conditional%3:00:00::'
synsetId: 00557545-a
simpleMeaning: needing something else to happen or be true first, or setting that need
scope: This is about something that only holds if something else happens or is true first, or about setting
  that need for others. It is not about something that holds in all cases, with nothing needed first.
examples:
- 'Their support was conditional: they would help only if we shared the cost.'
- She gave a conditional yes, which depended on how the weather changed.
