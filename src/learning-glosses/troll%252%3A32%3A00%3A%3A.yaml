simpleMeaning: to sing in a loud voice and in a free way, with no holding back
scope: To sing loudly and freely, not to speak fast in a rolling voice and not to fish with a pulled line.
examples:
- He trolled the old song at the top of his voice.
- The men trolled a drinking song as they walked home.
