simpleMeaning: The ability to hold up under pressure or force without breaking or wearing out.
scope: The durability of an object or material under pressure, not physical energy or intensity and not
  general bodily or mental power.
examples:
- Engineers tested the strength of the bridge before opening it to traffic.
- Repeated stress tests showed the strength of the new alloy.
