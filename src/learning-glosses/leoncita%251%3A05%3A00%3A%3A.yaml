simpleMeaning: a small South American monkey with smooth soft fur and a long tail that cannot grip things
scope: A small South American monkey with smooth soft fur and a long tail that cannot grip things, also
  called a tamarin, a lion marmoset or a lion monkey, not a lion and not a monkey with a tail that can
  grip.
examples:
- The leoncita sat in the tree, its long tail hanging down.
- A leoncita is a small South American marmoset with soft fur.
