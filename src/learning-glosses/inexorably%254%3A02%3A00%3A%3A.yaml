senseId: 'inexorably%4:02:00::'
synsetId: 00219849-r
simpleMeaning: in a way that cannot be stopped or changed, and that keeps going
scope: Going on in a way that nothing can stop or change; not in a fast way, not in a sudden way, and
  not in a way that can be turned back.
examples:
- Time moves inexorably, and no one can hold it back.
- The sea rose inexorably, covering more of the beach each hour.
