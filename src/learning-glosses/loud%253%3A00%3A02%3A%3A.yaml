simpleMeaning: In music, chiefly a direction or marking showing that a passage should be performed at
  high volume.
scope: This is the written musical instruction to perform at high volume, not the everyday description
  of a sound as strong or noisy and not the noun for the volume itself.
examples:
- The composer wrote 'loud' above the staff.
- In the score, that section is marked loud.
