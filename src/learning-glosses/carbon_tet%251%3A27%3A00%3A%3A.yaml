simpleMeaning: A clear liquid that will not catch fire, used to dissolve fats and oils, whose use as a
  cleaner or fire-quencher has fallen off because it is deadly.
scope: This sense is also called carbon tetrachloride, perchloromethane, and tetrachloromethane.
examples:
- Carbon tet dissolves fats and oils.
- They used carbon tet as a cleaning fluid.
