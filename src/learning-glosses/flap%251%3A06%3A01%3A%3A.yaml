simpleMeaning: a moving part of a plane wing, used to make the plane lift more or to slow it down more
scope: This is a moving part on a plane wing, also called flaps; it is not a loose covering on an envelope
  and not a piece of body tissue.
examples:
- The pilot lowered the flaps before landing.
- A flap on each wing helps the plane slow down.
