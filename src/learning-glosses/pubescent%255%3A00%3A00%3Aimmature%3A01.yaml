simpleMeaning: of animals, especially people, at the start of the change into an adult, when the sex glands
  (parts that make sex cells) begin to work, but not yet fully grown
scope: This means just starting to grow into an adult; it is not a fully grown adult and not a young child
  with none of these changes.
examples:
- The pubescent boy's voice began to change.
- A pubescent girl may start to grow breasts.
