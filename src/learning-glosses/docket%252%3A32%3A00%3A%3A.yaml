simpleMeaning: To write a short summary of a legal paper and put it in a list.
scope: To sum up a legal paper and enter it in a list, not the court's list of cases to be tried and not
  the plan of matters to be dealt with.
examples:
- The clerk docketed the will the day it arrived.
- She docketed the contract before filing it away.
