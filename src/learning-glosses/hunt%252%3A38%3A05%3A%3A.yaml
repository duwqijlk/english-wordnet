simpleMeaning: to keep swinging past a target speed, position, or condition instead of settling at it
scope: This is a mechanism overshooting a setting, not an aircraft yawing off its flight path and not
  chasing a person or animal.
examples:
- The engine began to hunt between two speeds on the motorway.
- With a faulty sensor, the control system hunted around the target temperature.
