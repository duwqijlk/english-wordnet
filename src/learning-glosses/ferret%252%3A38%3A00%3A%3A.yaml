simpleMeaning: to chase and press someone again and again, giving them no rest
scope: To hunt someone down without letting up; not the tame white animal and not the wild prairie animal.
examples:
- The reporters ferreted the minister for days, asking the same questions.
- He ferreted his rival with letters and calls until the man gave in.
