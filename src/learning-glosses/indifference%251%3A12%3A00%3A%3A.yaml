simpleMeaning: A lack of care that takes no side, fair to all and moved by none
scope: A fair lack of care that takes no side, not staying calm while seeming not to care, not a lack
  of all feeling, and not a lack of interest.
examples:
- The judge listened with indifference, favouring neither side.
- His indifference in the matter was fair to both sides.
