simpleMeaning: A speech sound made with the lips and the teeth.
scope: A speech sound made with the lips and the teeth; labiodental is another name for this sense, not
  a sound made with the tongue and not a vowel.
examples:
- F is a labiodental consonant in English.
- The labiodental consonant v is made with the lower lip and the upper teeth.
