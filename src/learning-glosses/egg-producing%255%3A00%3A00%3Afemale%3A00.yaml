simpleMeaning: Describes a female able to form the shells that hold her young before they hatch, and then
  bear young.
scope: Describes a female able to form the shells that hold her young before they hatch, and then bear
  young, not a male and not a female that cannot bear young.
examples:
- The egg-producing female laid her eggs in spring.
- Egg-producing females lay eggs that later hatch.
