simpleMeaning: A clever bomb that looks for the laser light bounced off its mark and uses it to steer
  its fall.
scope: It is a bomb guided by laser light, not a plain falling bomb and not a missile; also called laser-guided
  bomb.
examples:
- The LGB followed the laser light to its target.
- LGB bombs cannot be used in cloudy weather.
