simpleMeaning: a close-fitting wool cap that covers all of the head but the face
scope: 'Also called a balaclava: a close-fitting wool cap that covers the head but leaves the face bare,
  not a hat that covers only the top of the head and not a hood worn over a coat.'
examples:
- He pulled on a balaclava helmet before going out in the snow.
- Her balaclava helmet kept her head warm but left her face bare.
