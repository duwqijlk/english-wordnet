simpleMeaning: asking a lot of the mind; hard to understand, to work out, or to believe
scope: 'Also called tough, elusive, problematic and knotty: hard for the mind to understand or work out,
  not hard to do or hard to touch.'
examples:
- The instructions were so baffling that no one knew where to start.
- He gave a baffling answer that made the problem even harder to understand.
