senseId: 'scratch%1:11:00::'
synsetId: 07407582-n
simpleMeaning: The harsh, grating noise of something being dragged across a surface.
scope: The unpleasant sound itself — another name for a scrape, a scraping or a scratching — not the mark
  or groove left on a surface or the act of rubbing to ease an itch.
examples:
- The scratch of chalk on the board made her wince.
- I heard a loud scratch at the door.
