simpleMeaning: A church leader who also holds worldly power, or a ruler of a part of an empire, as in
  the old Roman and Byzantine empires.
scope: 'This covers two kinds of ruler: a church leader with worldly power, and a ruler of a part of an
  empire.'
examples:
- The ethnarch of Cyprus ruled the island with both church and worldly power.
- After his election as archbishop, Makarios became the ethnarch of Cyprus.
