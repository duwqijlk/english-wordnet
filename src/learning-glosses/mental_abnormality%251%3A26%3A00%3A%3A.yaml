simpleMeaning: Any way in which the mind does not work in the usual healthy way
scope: Any way the mind fails to work as it should; not a hurt to the body and not a passing low mood.
examples:
- The doctor looked for any mental abnormality in the patient.
- A mental abnormality can change how a person thinks and acts.
