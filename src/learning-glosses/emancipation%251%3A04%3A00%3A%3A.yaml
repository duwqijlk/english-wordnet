senseId: 'emancipation%1:04:00::'
synsetId: 01249960-n
simpleMeaning: the act of setting a person free from another person's control, especially when a parent
  gives up control over a young child
scope: This is the act of setting someone free from another person's control, especially a parent's control
  over a young child; it is not just feeling free or being free in a general way.
examples:
- The emancipation of the child meant her parents no longer controlled her money.
- He asked a court for emancipation so he could live on his own at sixteen.
