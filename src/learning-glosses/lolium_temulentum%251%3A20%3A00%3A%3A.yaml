simpleMeaning: A grass weed that lives for one year and is often found in fields of grain and other farmed
  land, with seeds that people sometimes think are poison.
scope: A one-year grass weed of grain fields, also called cheat, tare, bearded darnel and darnel; not
  a crop grass and not a garden lawn grass.
examples:
- Lolium temulentum grows among the wheat in the field.
- Farmers pull out Lolium temulentum before it seeds.
