simpleMeaning: a fresh-water fish of the Nile and warm middle Africa that can give shocks
scope: A fresh-water fish of the Nile that can give shocks, not a plain catfish and not an eel.
examples:
- The electric catfish stunned its prey with a shock.
- An electric catfish lives in the Nile and in warm central Africa.
