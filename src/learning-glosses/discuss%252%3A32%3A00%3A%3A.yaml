simpleMeaning: To talk something over with other people in detail, sharing views in a conversation about
  it.
scope: This means talking something over with other people, not merely mentioning it in passing and not
  thinking it over alone.
examples:
- We discussed the budget for an hour before voting.
- The class discussed the poem in small groups.
