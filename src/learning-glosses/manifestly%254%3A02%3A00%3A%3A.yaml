senseId: 'manifestly%4:02:00::'
synsetId: 00039730-r
simpleMeaning: In a way that cannot be missed, so plain that no one can doubt it; the word 'plain' is
  often used in everyday talk for 'plainly'.
scope: 'Also called obviously, apparently, plain, evidently, plainly, or patently: in a way that cannot
  be missed, not in a doubtful way.'
examples:
- She was manifestly the best singer in the room.
- The plan was manifestly wrong from the start.
