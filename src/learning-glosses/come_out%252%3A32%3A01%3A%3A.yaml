simpleMeaning: to tell other people openly that you are gay
scope: To say openly that one is gay; come out of the closet and out are other names for this sense, and
  it is not simply telling a secret in private.
examples:
- She decided to come out to her family last spring.
- He came out at work after years of keeping it quiet.
