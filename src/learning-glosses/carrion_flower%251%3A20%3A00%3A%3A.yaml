simpleMeaning: A group of plants in the genus Stapelia, with thick, leafless, toothed stems like a cactus
  and big, bad-smelling flowers that are often star-shaped.
scope: Another name for stapelia and starfish flower, the cactus-like plant with bad-smelling blooms;
  not a true cactus.
examples:
- A carrion flower opened in the greenhouse, filling the air with the smell of rotting meat.
- Carrion flowers have thick, toothed stems and no leaves.
