simpleMeaning: A small Arctic whale; the male has a long spiral tusk of ivory.
scope: A small Arctic whale whose male has a long spiral ivory tusk; narwhal and narwal are other names
  for this, and it is not a beluga whale or a dolphin.
examples:
- The narwhale swam under the ice.
- A male narwhale grows a long spiral tusk.
