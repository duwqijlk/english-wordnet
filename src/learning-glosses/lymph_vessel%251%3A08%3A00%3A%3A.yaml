simpleMeaning: A thin tube in the body that carries a clear fluid and at last adds it to the blood in
  the veins.
scope: A thin tube that carries a clear fluid into the veins, also called lymphatic vessel; not a blood
  vessel and not a nerve.
examples:
- The lymph vessel carried fluid from the leg toward the chest.
- A blocked lymph vessel can make the arm swell.
