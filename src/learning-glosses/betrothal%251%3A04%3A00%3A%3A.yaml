simpleMeaning: the act of two people promising to marry each other
scope: This is the act of promising to marry, not the wedding itself and not the married life that comes
  after it.
examples:
- Their betrothal took place at a small meeting where they promised to marry each other.
- After their betrothal, the couple began to plan the wedding.
