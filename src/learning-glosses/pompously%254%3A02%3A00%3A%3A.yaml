senseId: 'pompously%4:02:00::'
synsetId: 00234475-r
simpleMeaning: in a way that shows too much pride in how important you think you are
scope: Done or said in a way that shows too much pride in your own importance; not just being proud of
  something you did well, and not being grand in a happy way.
examples:
- He pompously told us all about his great new job.
- She marched in pompously and started telling everyone what to do.
