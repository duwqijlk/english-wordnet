simpleMeaning: A hollow in the body holding fluid, above all the fluid of the lymph vessels or the fluid
  ringing the brain and running down beside the cord in the back
scope: This hollow is also called a cistern; it holds fluid in the body, above all lymph or the fluid
  around the brain and the cord down the back.
examples:
- The doctor pointed to the cisterna where the fluid had gathered.
- A cisterna near the brain holds the fluid that runs around it.
