simpleMeaning: The act of cutting or splitting a thing, or of making a wall that cuts a thing off and
  keeps its parts apart
scope: The act of cutting or splitting a thing, or of making a wall that cuts a thing off and keeps its
  parts apart, also called division, partition, segmentation, partitioning or sectionalisation; not a
  natural crack and not a group breaking up.
examples:
- Sectionalization of the land made small fields.
- The sectionalization kept the two sides apart.
