simpleMeaning: In the southwestern United States and Mexico, any of several kinds of plant of the group
  called Calochortus grows cup shaped flowers of three outer leaves and three inner leaves
scope: Also called mariposa and mariposa lily; a plant of the southwestern United States and Mexico with
  cup shaped flowers of three outer leaves and three inner leaves.
examples:
- The mariposa tulip bloomed beside the trail.
- She drew a mariposa tulip with its cup shaped flowers.
