simpleMeaning: A low plant of southern Europe to Great Britain that lives many years and smells strongly,
  now growing wild in the United States
scope: Field balm, lesser calamint, Calamintha nepeta, Calamintha nepeta glantulosa and Satureja nepeta
  are other names for this sense, and it is set apart from other strong-smelling plants by its low growth
  and its range.
examples:
- Satureja calamintha glandulosa smells strongly when its leaves are crushed.
