simpleMeaning: This day marks when the United States first took up its flag, in seventeen seventy-seven.
scope: Also called Flag Day, this day marks the adoption of the United States flag, not the flag itself.
examples:
- June 14 marks the day the flag was first adopted.
- On June 14, we raise the flag to mark its adoption.
