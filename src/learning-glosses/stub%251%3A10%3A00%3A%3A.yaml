simpleMeaning: a piece torn off a ticket and handed back to the person who paid, as proof that they paid
scope: The torn-off part of a ticket kept as a receipt, not a short piece left on a tree trunk and not
  the act of hitting your toe.
examples:
- Keep your ticket stub to get back into the theatre.
- The usher tore off the stub and handed it back to her.
