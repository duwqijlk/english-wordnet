simpleMeaning: to burn a mark into an animal's skin with a hot iron to show who owns it.
scope: This is about burning an ownership mark into an animal, not about naming goods or condemning someone.
examples:
- The rancher branded each calf in the spring.
- They branded the horses before releasing them onto the range.
