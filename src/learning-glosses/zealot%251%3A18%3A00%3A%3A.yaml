simpleMeaning: a person who supports something with very strong feeling and is ready to fight for it
scope: 'Also called partisan: a strong supporter who is ready to fight for a cause or idea. Not a calm,
  mild supporter, and not a person who is against something.'
examples:
- He is a zealot for free speech and argues for it at every meeting.
- The group's zealots would not listen to any other view at all.
