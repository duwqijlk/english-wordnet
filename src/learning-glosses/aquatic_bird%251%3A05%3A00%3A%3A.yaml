simpleMeaning: A water creature with feathers that wades, swims, and dives, living in fresh water or in
  the sea.
scope: A feathered water creature that wades, swims, and dives in fresh water or the sea, not a land-living
  flyer and not a fish.
examples:
- The aquatic bird dived for fish in the lake.
- Aquatic birds nest near the water.
