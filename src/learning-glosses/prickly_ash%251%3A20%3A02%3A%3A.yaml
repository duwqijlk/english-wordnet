simpleMeaning: an Australian tree with plain leaves taking turns on the stem; young leaves split into
  leaflets with sharp toothed edges, and white flowers in thin spikes at leaf joints
scope: A tree of Australia with prickly-edged leaves, not a shrub and not the ash tree of Europe.
examples:
- The prickly ash by the fence had white flowers in thin spikes.
- Young leaves of the prickly ash are split into leaflets with toothed edges.
