simpleMeaning: one of several kinds of sea fish of one family, in size and other ways between mackerels
  and tunas
scope: This is the whole live fish, not its flesh used as food and not the dried fish flakes used in Japanese
  cooking.
examples:
- Fishermen caught bonito in warm seas off the coast.
- A bonito is smaller than a tuna but larger than a mackerel.
