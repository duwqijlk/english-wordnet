simpleMeaning: An extra piece you wear or carry with your clothes, outside the main things you wear.
scope: 'Also called an accessory: an extra piece worn or carried with your clothes, not one of the main
  pieces of clothing.'
examples:
- Her accoutrements included a scarf, gloves, and a handbag.
- The soldier's accoutrements hung from his belt.
