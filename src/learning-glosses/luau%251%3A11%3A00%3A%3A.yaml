simpleMeaning: a Hawaiian meal or party done in a rich, grand way, especially one with food and shows
  in the old Hawaiian way
scope: This is a Hawaiian meal or party done in a rich, grand way, especially with old-style food and
  shows; it is not an everyday meal and not a plain party.
examples:
- At the luau, guests ate roast pig and watched Hawaiian dancers.
- They held a luau on the beach for her birthday.
