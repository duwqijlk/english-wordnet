simpleMeaning: a board of paper or fiberboard sheets fixed round a core of gypsum, a white mineral, used
  to make inside walls in place of the wet mix or wallboard
scope: Also called gypsum board; not a sheet of plywood and not a wall built of bricks.
examples:
- The workers fixed plasterboard to the inside walls.
- Plasterboard is quicker to put up than wet plaster.
