senseId: 'parody%1:04:00::'
synsetId: 00550647-n
simpleMeaning: a funny copy of the way a person speaks or acts, made to make fun of that person
scope: 'Also called mockery and takeoff: a funny copy in speech or action, not a written work that copies
  a writer''s style and not the act of making such a copy.'
examples:
- His parody of the teacher's voice made the whole class laugh.
- The show did a short parody of the famous singer's way of dancing.
