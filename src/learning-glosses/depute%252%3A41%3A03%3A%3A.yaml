senseId: 'depute%2:41:03::'
synsetId: 02396945-v
simpleMeaning: To place someone in a job, or give them work to do.
scope: This sense is also called assign, designate, and delegate, for placing someone in a job, or giving
  them work to do, where assigning is giving a person a job to do, or putting a person in a post to do
  it, and designating is naming a person to take up a post, or setting them a task to do.
examples:
- They deputed him to the post.
- Deputing places someone in a job.
