simpleMeaning: a piece of saved information used to pick out one item in a system that stores information
  and finds it again
scope: This is saved information that picks out an item in a storage system, not the sound or look of
  a word.
examples:
- Each file has a descriptor that the computer uses to find it.
- The librarian checked the descriptor to find the right book in the system.
