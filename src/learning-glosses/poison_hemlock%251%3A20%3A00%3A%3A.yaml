simpleMeaning: A large, branching two-year plant native to Eurasia and Africa and introduced to North
  America, with big fern-like leaves and white flowers; usually in damp places, all parts extremely toxic.
scope: Poison parsley and hemlock are other names for this same plant; this is not the evergreen hemlock
  tree or the parsley used in cooking.
examples:
- Poison hemlock grows in damp places and has large, fern-like leaves.
- Every part of the poison hemlock is extremely toxic.
