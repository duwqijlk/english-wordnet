simpleMeaning: The number that comes from adding twenty-three and one.
scope: Also called 24, twenty-four and two dozen; the number after twenty-three, not twenty-three and
  not twenty-five.
examples:
- XXIV in Roman numerals means twenty-four.
- There were XXIV chairs in the hall.
