simpleMeaning: to dry up and lose strength, or to grow but not reach full growth in the right way
scope: This is what a plant or fruit does when it dries up or does not ripen well. It is not a loud noise,
  not strong words against someone, and not speaking against someone in a harsh way.
examples:
- The young corn blasted in the hot, dry summer.
- Many of the buds blasted before they could open.
