simpleMeaning: Having a spine (the row of bones down the back) that bends out too much, or showing this
  problem
scope: 'Also called humpbacked, hunchbacked, crookback, gibbous, crookbacked and kyphotic: having a back
  that bends out too much, not just sitting bent over for a short time.'
examples:
- The old man's humped back made it hard for him to stand straight.
- She was humped from birth because her spine grew in a curve.
