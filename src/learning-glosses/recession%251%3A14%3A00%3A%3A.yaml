simpleMeaning: the act of the church leaders and singers leaving the front part of the church for the
  small room where robes are kept, at the end of a service
scope: The leaving of the church leaders and singers at the end of a service, not a fall in business or
  trade.
examples:
- The recession began as the organ played the last hymn.
- After the recession, the vestry door closed behind the choir.
