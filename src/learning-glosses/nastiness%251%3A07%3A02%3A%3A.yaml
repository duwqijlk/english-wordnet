simpleMeaning: a strong wish to hurt or upset other people, shown by being mean and unkind on purpose
scope: 'Also called spite, spitefulness, cattiness and bitchiness: a mean wish to hurt other people. Not
  the sense about very bad dirt and waste.'
examples:
- Her nastiness showed when she spread lies just to hurt her coworker.
- There was real nastiness in the way he mocked the new student.
