simpleMeaning: People often use its water-living young as bait, while the grown males of this big, soft-bodied
  insect are known for long, thin jaws.
scope: This big, soft-bodied insect is also called dobson and dobsonfly; the name covers the grown insect,
  not just its water-living young.
examples:
- A dobson fly rested on the rock by the stream.
- The fisherman kept dobson fly larvae in a tin for bait.
