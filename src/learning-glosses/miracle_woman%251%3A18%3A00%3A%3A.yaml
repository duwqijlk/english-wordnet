simpleMeaning: A female person who says she can do wonderful things that cannot be explained by natural
  laws, or is said to be able to do them.
scope: A female person who says she can do wonderful things that cannot be explained by natural laws,
  or is said to be able to do them; not a male person who does this, and not the general word for any
  person who does this.
examples:
- The miracle woman said she could heal the sick with a touch, and many people believed her.
- People said the miracle woman had made a blind man see again.
