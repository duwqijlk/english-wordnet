simpleMeaning: to wrap something up so it is closed in on all sides, to keep it safe
scope: To wrap something up to keep it safe, not the silky case itself and not hiding away from people.
examples:
- She cocooned the baby in a warm blanket.
- They cocooned the statue in cloth before moving it.
