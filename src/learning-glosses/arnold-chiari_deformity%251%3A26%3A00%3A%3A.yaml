simpleMeaning: Part of the brain pushes out through the skull, a change in the shape of the body
scope: A fault in the shape of the body where part of the brain pushes through the skull, not a break
  in the skull and not a disease of the brain.
examples:
- The doctors found that part of his brain had pushed through his skull, a sign of the Arnold-Chiari deformity.
- An Arnold-Chiari deformity can press on the brain where it leaves the skull.
