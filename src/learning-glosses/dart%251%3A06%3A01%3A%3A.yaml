simpleMeaning: a small, thin thing with a sharp point, that a person throws or shoots
scope: This is a small, thin thing with a sharp point that a person throws or shoots; not moving fast
  and lightly, and not a short, pointed fold sewn into clothes.
examples:
- He threw a dart and hit the centre of the board.
- The hunter shot a poison dart from a long pipe.
