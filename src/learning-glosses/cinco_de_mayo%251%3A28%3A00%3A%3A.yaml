simpleMeaning: The fifth of May, kept in Mexico and in Mexican-American groups in the United States to
  mark the Mexican win over the French in the Battle of Puebla in 1862.
scope: A May holiday kept in Mexico and the United States, not Mexican Independence Day in September.
examples:
- We dance in the streets on Cinco de Mayo.
- Cinco de Mayo marks the victory at Puebla in 1862.
