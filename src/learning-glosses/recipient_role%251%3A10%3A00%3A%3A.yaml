senseId: 'recipient_role%1:10:00::'
synsetId: 06344088-n
simpleMeaning: In what the verb says happens, the living thing that has something done to it, not the
  one that does it, plays this part.
scope: Also called a recipient, it is the part played by the living thing that has something done to it,
  rather than the one that does it.
examples:
- In 'John gave Mary a book', Mary takes the recipient role.
- In 'The dog was fed', the dog takes the recipient role.
