simpleMeaning: To serve as the official in charge of a court trial.
scope: This is the sense of presiding over a trial, not the noun for a public official who decides court
  questions, not the noun for an authority who assesses worth or quality, not the verb sense for deciding
  who wins a competition, not the verb sense for forming a critical opinion, not the verb sense for estimating
  an amount or time, and not the verb sense for announcing a ruling.
examples:
- A retired justice will judge the case in the county court next month.
- She was asked to judge the murder trial after the original official fell ill.
