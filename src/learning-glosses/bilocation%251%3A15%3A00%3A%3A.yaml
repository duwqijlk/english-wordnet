simpleMeaning: The power, said of some Roman Catholic holy people, to be in two places at the same time.
scope: The power to be in two places at once, said of some Roman Catholic saints; not a dream and not
  a trick of the eye.
examples:
- Bilocation was said of the saint, who seemed to be in two places at once.
- The story told of bilocation in the life of the saint.
