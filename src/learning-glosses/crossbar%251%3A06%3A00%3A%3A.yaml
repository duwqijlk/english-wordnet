simpleMeaning: a long, thin bar that goes from side to side between two upright posts
scope: A bar from side to side between two upright posts in a frame or structure, not the bar used as
  game equipment that a person must jump or leap over.
examples:
- The crossbar between the two posts held the gate in place.
- He fixed a new crossbar across the top of the wooden frame.
