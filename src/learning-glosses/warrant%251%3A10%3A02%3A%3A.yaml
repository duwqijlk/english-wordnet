simpleMeaning: the open, formal act of saying yes to a thing
scope: 'Also called an endorsement, a sanction, or a countenance: the open, formal act of saying yes to
  a thing, not a paper from a court and not the paper that lets a person buy shares.'
examples:
- The committee gave its warrant to the new rules.
- His warrant for the trip came from the head of the firm.
