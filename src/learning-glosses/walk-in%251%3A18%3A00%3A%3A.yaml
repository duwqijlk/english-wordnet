simpleMeaning: a secret agent who leaves their own country on their own and asks for safety in another
  country, most often one hostile to their own
scope: A secret agent who leaves their own country on their own and asks another country for safety, not
  a deep closet or fridge and not an agent brought over by the other side.
examples:
- The walk-in gave himself up at the embassy and asked for asylum.
- A walk-in crossed the border alone and offered secrets in return for a safe home.
