simpleMeaning: a protein (a building block in the blood) that does nothing until the body turns it into
  thrombin, the stuff that helps blood clot
scope: A blood protein that waits until the body turns it into thrombin, not thrombin itself and not a
  blood cell.
examples:
- The lab test measured prothrombin in her blood.
- Prothrombin stays inactive until the body needs to form a clot.
