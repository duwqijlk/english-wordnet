simpleMeaning: In physics, the idea that some sides of matter and energy rays like light are best understood
  as waves, and other sides as small bits of matter
scope: 'Also called wave-particle duality: in physics, the idea that matter and energy rays can be understood
  in two ways, as waves and as small bits of matter. Not the geometry sense where points and planes can
  swap places, and not just being in two parts.'
examples:
- Wave-particle duality means light can act as a wave in one test.
- In class we learned how duality lets one test show light as waves and another show it as small bits.
