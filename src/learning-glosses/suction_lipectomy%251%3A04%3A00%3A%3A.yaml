simpleMeaning: Extra fat is drawn out from under the skin with a vacuum, most often to change how the
  body looks.
scope: Liposuction is another name for this taking away of extra fat from under the skin, most often to
  change how the body looks.
examples:
- By suction lipectomy, the surgeon drew out extra fat from under the skin.
- The patient had a suction lipectomy to change how the body looks.
