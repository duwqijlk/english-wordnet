simpleMeaning: In a way that watches and notices things with care.
scope: In a way that watches and notices things with care; observantly is another name for this; not in
  a careless way, and not merely looking without seeing.
examples:
- She watched the birds observingly, noting every move.
- He listened observingly to the whole debate.
