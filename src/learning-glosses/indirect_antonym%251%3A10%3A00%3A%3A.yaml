senseId: 'indirect_antonym%1:10:00::'
synsetId: 06316828-n
simpleMeaning: Word pairs whose clash is bridged, as the clash of wet and parched is bridged by the likeness
  of parched to dry.
scope: 'In word study: a pair of opposites linked through a third word, like wet and parched.'
examples:
- Wet and parched are indirect antonyms.
- An indirect antonym pair is bridged by a third word.
