simpleMeaning: sweet-smelling sap and prickly round bunches of fruit mark this North American tree of
  the Liquidambar group
scope: Also called red gum, sweet gum, and sweet gum tree; a North American tree with prickly round fruit
  clusters, not the black gum tree of Australia.
examples:
- The bilsted in our yard drops prickly round fruit clusters every autumn.
- We tapped the bilsted for its sweet-smelling sap.
