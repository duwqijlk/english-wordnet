senseId: 'blockade%2:35:00::'
synsetId: 01480632-v
simpleMeaning: To make a way or opening impossible to pass through
scope: Bar, block, stop and barricade are other names for this sense; this is about making a way impassable,
  not a war move that cuts off a whole place.
examples:
- Protesters blockaded the busy road with old cars.
- Fallen trees blockaded the way into the valley.
