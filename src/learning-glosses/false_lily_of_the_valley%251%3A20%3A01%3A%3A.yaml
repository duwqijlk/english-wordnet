simpleMeaning: a small plant with two leaves, from the northern United States and parts of Canada, with
  bunches of small sweet-smelling white flowers
scope: This is a small two-leaved plant with bunches of white flowers; not the true lily of the valley
  and not a tall garden plant.
examples:
- False lily of the valley grew under the pine trees.
- The false lily of the valley had small white flowers.
