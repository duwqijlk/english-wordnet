simpleMeaning: For making things slide easily and for working leather, this is the runny part of the fat
  found inside the body's hard frame.
scope: The runny part of the fat from inside the body's hard frame, used to make things slide easily and
  to work leather; it is not the dark ill-smelling oil of the same name.
examples:
- They rubbed bone oil into the leather.
- A little bone oil made the hinge turn.
