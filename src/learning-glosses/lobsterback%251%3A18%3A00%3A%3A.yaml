simpleMeaning: A British soldier, named for the red coat he wore, above all in the time of the American
  Revolution.
scope: This is a British soldier named for his red coat, not a sailor and not a soldier of another country;
  redcoat is another name for this sense.
examples:
- The lobsterbacks marched through the town in their red coats.
- A lobsterback stood guard at the gate during the Revolution.
