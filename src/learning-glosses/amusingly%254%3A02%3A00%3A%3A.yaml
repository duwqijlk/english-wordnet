simpleMeaning: in a way that makes people laugh and enjoy themselves
scope: This says how something is done, in a way that makes people laugh; it is not the funny thing itself.
examples:
- He told the story amusingly, and everyone laughed.
- She amusingly acted out the parts of both sisters.
