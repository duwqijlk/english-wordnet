simpleMeaning: the way things are in general, and all the events and facts together at one time
scope: The way things are in general, with all the events and facts together at one time; not one person's
  state of mind, and not a single event.
examples:
- The state of affairs in the country worried everyone.
- We must look at the whole state of affairs, not just one part.
