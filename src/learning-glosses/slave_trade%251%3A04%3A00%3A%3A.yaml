simpleMeaning: From the 1500s to the 1800s, people held as forced workers — above all Black Africans —
  were bought and sold and shipped to America.
scope: Also called slave traffic, it names the buying and selling of people held as forced workers, above
  all Black Africans shipped to America from the 1500s to the 1800s.
examples:
- The slave trade bought and sold people shipped from Africa to America.
- Many people were bought and sold through the slave trade in the 1700s.
