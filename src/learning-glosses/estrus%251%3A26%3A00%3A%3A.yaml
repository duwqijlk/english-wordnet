simpleMeaning: In mammals other than people, a time of strong sexual excitement and mating action.
scope: In mammals other than people, a time of strong sexual excitement, also called heat, rut, and oestrus;
  not a time of rest and not a sickness.
examples:
- The doe came into estrus in the autumn.
- During estrus, the female seeks a mate.
