simpleMeaning: the state of a thing that is ready to flow, does not spread out much, and is hard to squeeze
  into less space
scope: The state of a thing that is ready to flow, not a thing that is in that state, and not a sound
  in speech.
examples:
- Water stays in a liquid state at room heat.
- The liquid state lets the stuff pour and take the shape of its cup.
