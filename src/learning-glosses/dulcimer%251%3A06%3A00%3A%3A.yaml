simpleMeaning: A four-sided stringed instrument whose metal strings are hit with light hammers
scope: A stringed instrument with four sides, not the folk kind with a curved body and three strings.
examples:
- The dulcimer rang out as she struck its strings with small hammers.
- The dulcimer on the table had four sides and metal strings that he hit with light hammers.
