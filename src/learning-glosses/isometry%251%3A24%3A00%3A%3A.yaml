senseId: 'isometry%1:24:00::'
synsetId: 13808399-n
simpleMeaning: A matching that pairs each point of one set of points with one point of another set, keeping
  the gaps between each pair of points the same
scope: A matching of point sets that keeps every gap the same, not a mere equality of measure and not
  a matching that stretches the gaps.
examples:
- The isometries of the cube keep every gap the same.
- A turn of the shape is an isometry of the plane.
