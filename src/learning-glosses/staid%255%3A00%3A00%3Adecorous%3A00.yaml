simpleMeaning: having dignity and behaving in a proper, correct way
scope: 'Also called sedate: having dignity and behaving in a proper, correct way. Not wild or loose in
  the way a person acts.'
examples:
- The staid judge listened in silence and spoke with dignity.
- Her staid way of acting made the formal meeting feel proper and correct.
