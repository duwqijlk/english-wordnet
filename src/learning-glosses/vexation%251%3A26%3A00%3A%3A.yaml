senseId: 'vexation%1:26:00::'
synsetId: 14429977-n
simpleMeaning: the state of feeling troubled and angry
scope: Also called annoyance, irritation, and botheration, this is the state of mind of feeling troubled
  and angry; it is not the anger itself that something annoying brings, and not the person or thing that
  causes the trouble.
examples:
- His vexation grew as the noise went on all night.
- She tried hard to hide her vexation during the long meeting.
