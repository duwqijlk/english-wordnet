senseId: 'cheval-de-frise%1:06:00::'
synsetId: 03019285-n
simpleMeaning: A movable defensive barrier of barbed wire or spikes fixed to a wooden frame, set up to
  block mounted troops.
scope: The singular name for this movable barrier; chevaux-de-frise is the plural for the same obstacle,
  and neither means a fixed wall or trench.
examples:
- The engineers laid a cheval-de-frise of wire and spikes across the road.
- A cheval-de-frise was dragged into the gap to hold back the cavalry.
