simpleMeaning: In mathematics, an error that comes from cutting numbers short to a handy number of decimal
  places.
scope: In mathematics, an error from cutting numbers short, not a mistake in adding up.
examples:
- The rounding in the tax figures made the total a dollar out.
- Small roundings can add up to a large error.
