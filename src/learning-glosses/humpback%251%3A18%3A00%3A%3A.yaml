senseId: 'humpback%1:18:00::'
synsetId: 10212031-n
simpleMeaning: a person whose upper back is bent in a round shape because the top part of the spine curves
  in a way that is not normal
scope: This person is also called hunchback and crookback. It is not the large whale of the same name,
  and not the curved back itself.
examples:
- The old humpback walked slowly with his back bent.
- She was a kind humpback who worked in the shop.
