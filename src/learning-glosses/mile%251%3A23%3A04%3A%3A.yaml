simpleMeaning: a navigation measure of exactly 1,852 meters, originally tied to one minute of arc in latitude
scope: The international 1,852-meter navigation unit, not Britain's older 6,000-foot sea unit or the 6,080-foot
  Admiralty unit.
examples:
- The lighthouse stands three nautical miles from the harbor.
- The ship was still twenty nautical miles from port when the storm hit.
