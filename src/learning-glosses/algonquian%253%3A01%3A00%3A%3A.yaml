simpleMeaning: To do with the people in a native group, the group itself, or the way they speak
scope: 'Also called Algonkian and Algonquin: it is used for a native group, the people in it or the way
  they speak, not for one person of the group and not for the whole family of such ways of speaking.'
examples:
- The Algonquian peoples lived across a wide part of North America.
- He wrote about Algonquian place names.
