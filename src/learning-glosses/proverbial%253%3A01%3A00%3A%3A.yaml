simpleMeaning: connected with a short well-known saying, like it, or said in it
scope: Connected with or like a short well-known saying, not the saying itself.
examples:
- The proverbial grasshopper wasted the summer while the ant worked.
- She is the proverbial early bird, always the first to arrive.
