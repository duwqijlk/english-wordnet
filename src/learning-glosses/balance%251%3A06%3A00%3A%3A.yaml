simpleMeaning: A device that measures how heavy something is; it works through the downward pull of gravity.
scope: The weighing instrument itself, not a counterweight hung on it or the regulating wheel inside a
  clock.
examples:
- The old balance in the shop weighed grain against brass weights.
- She checked the balance before weighing out the flour.
