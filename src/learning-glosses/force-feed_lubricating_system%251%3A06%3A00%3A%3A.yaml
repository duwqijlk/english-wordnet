simpleMeaning: A set-up that oils the inside of a fuel-burning engine, in which a pump pushes oil into
  the parts that bear the load.
scope: This is a set-up that oils the inside of a fuel-burning engine by a pump pushing oil into the parts
  that bear the load, not a hand oiler, and it is also called a force feed, a lubricating system, a pressure-feed
  lubricating system, and a pressure feed.
examples:
- The force-feed lubricating system kept the bearings oiled.
- A pump drives the force-feed lubricating system.
