simpleMeaning: To keep moving between two states, changing from one to the other and back again.
scope: This describes repeated swinging between two conditions without settling on either, not a single
  abrupt switch from one topic or state to another, and not a sudden rise in an amount.
examples:
- Her mood jumped from delight to despair and back again all afternoon.
- The argument jumped between two positions without either side giving ground.
