simpleMeaning: A small leftover growth from the lower end of the first part of the large gut, looking
  like a small bag.
scope: A small leftover growth at the lower end of the first part of the large gut, not the large gut
  itself and not a swelling; appendix is another name for this sense.
examples:
- The cecal appendage is a small pouch-like growth at the end of the first part of the large gut.
- Doctors removed the swollen cecal appendage during the operation.
