simpleMeaning: a small insect that bores tunnels in the outer skin and wood of trees; kin to weevils
scope: A small tree-boring insect, kin to weevils; not a weevil and not a wood wasp.
examples:
- The bark beetle bored tunnels under the bark of the pine.
- Bark beetles killed several trees in the wood.
