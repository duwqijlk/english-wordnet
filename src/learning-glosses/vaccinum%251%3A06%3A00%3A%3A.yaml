simpleMeaning: A liquid doctors give with a needle, made from germs made weak or killed, that teaches
  the body to make its own guards against the sickness those germs cause.
scope: Also called vaccine, it is a liquid given with a needle so the body is ready to fight a sickness.
examples:
- They gave the child a vaccinum so her body could fight the sickness if it came.
- The nurse gave him a vaccinum with a needle in his arm.
