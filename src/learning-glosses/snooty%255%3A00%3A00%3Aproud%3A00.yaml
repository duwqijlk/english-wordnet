simpleMeaning: in everyday speech, having too high an idea of yourself and acting as if other people are
  not good enough for you
scope: 'Also called snotty and bigheaded: thinking and acting as if you are better than other people,
  not just being proud of one good thing you did.'
examples:
- The snooty customer would not talk to the young waiter.
- She gave us a snooty look and walked away without a word.
