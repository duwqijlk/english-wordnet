simpleMeaning: a thick cloth or flat pad put on the floor to stand on while you dry yourself after washing
scope: A thick cloth or flat pad to stand on while drying after washing, not a towel for drying the body
  and not a rug for the floor.
examples:
- She stepped onto the bath mat as she got out of the bath.
- The bath mat was wet where he had stood to dry himself.
