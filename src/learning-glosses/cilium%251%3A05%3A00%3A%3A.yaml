simpleMeaning: a tiny hair-like part sticking out of a cell, that moves free-swimming one-celled living
  things through water
scope: A tiny hair-like part on a cell that moves it through water; not a tail-like flagellum and not
  a hair on skin.
examples:
- Each cilium beats to push the tiny creature along.
- A cilium on the cell surface helps it swim.
