simpleMeaning: A hard situation or problem that makes you worried and tense.
scope: This is the difficult situation itself, not the tense state it produces, and not physical force
  on an object.
examples:
- Financial stress at home was affecting his sleep.
- The stress of moving house left her exhausted.
