simpleMeaning: in spite of what was said just before, usually placed just ahead of a point that goes against
  it
scope: 'Also called still, however, yet, or nonetheless: in spite of what was said, a word that goes before
  a point against it.'
examples:
- While we disliked each other, nevertheless we agreed.
- He was tired; nevertheless, he finished the work.
