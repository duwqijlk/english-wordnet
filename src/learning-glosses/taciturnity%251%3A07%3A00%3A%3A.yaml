simpleMeaning: The mark of keeping mum, giving nothing beyond need.
scope: This sense is also called reserve and reticence, for the mark of keeping mum, giving nothing beyond
  need, where reserve is the habit of saying little, and giving no more than is needed.
examples:
- Taciturnity is the mark of keeping mum.
- Taciturnity gives nothing beyond need.
