simpleMeaning: Copper that the body cannot handle builds up in the liver, then in red blood cells and
  the brain, in this rare disorder passed down in families.
scope: This is a rare disorder passed down in families in which copper builds up in the liver, then in
  red blood cells and the brain, not in the liver alone.
examples:
- Hepatolenticular degeneration runs in the family.
- In hepatolenticular degeneration, copper builds up in the liver and then in the brain.
