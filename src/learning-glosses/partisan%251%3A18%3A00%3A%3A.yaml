simpleMeaning: A person who backs a cause or idea with strong feeling, and will fight for it
scope: This is a fighter for a cause or idea, not a keen backer of one person and not a long-bladed weapon.
examples:
- The partisan spoke fiercely for the new law.
- Partisans of the old order refused to give way.
