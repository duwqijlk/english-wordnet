simpleMeaning: Wide pale flowers shaped like funnels open on this plant of the eastern Mediterranean and
  the Balkans.
scope: This plant of the eastern Mediterranean and the Balkans bears wide pale funnel flowers, not the
  Egyptian water plant of the same name.
examples:
- A white lily opened its wide pale flower.
- The white lily showed a funnel-shaped flower.
