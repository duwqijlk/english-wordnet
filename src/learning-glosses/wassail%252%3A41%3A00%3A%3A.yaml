simpleMeaning: to have a loud wild party, often with plenty of drink
scope: To have a loud wild party, often with plenty of drink, also called racket, revel, jollify, make
  happy, make merry, make whoopee and whoop it up; not a quiet dinner and not the spiced drink of the
  same name.
examples:
- They wassailed all night after the wedding.
- The wedding guests wassailed until dawn.
