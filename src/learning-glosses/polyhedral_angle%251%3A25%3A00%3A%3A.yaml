simpleMeaning: The space closed in by three or more flat sides that meet at one point
scope: The space closed in by three or more flat sides that meet at one point, not the flat shape made
  by two lines that meet.
examples:
- The polyhedral angle at the corner of the box is formed by three flat faces.
- In the drawing, the polyhedral angle shows where the flat sides meet.
