senseId: 'demur%2:32:02::'
synsetId: 01018635-v
simpleMeaning: In law, to put forward a formal objection to what the other side has said in court.
scope: In law, to put forward a formal objection to the other side's case, not the noun for the objection
  itself.
examples:
- The lawyer demurred, asking the court to throw out the claim.
- He demurred to the charge, saying it had no basis in law.
