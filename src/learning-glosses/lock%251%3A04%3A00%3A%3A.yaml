simpleMeaning: In wrestling, a grip that bends or squeezes part of the opponent's body.
scope: A wrestling grip that bends or squeezes the opponent, not the fastener on a door, the canal water
  enclosure, or the vehicle ignition device.
examples:
- He put his opponent in a lock and forced him to submit.
- The wrestler escaped the lock by twisting free.
