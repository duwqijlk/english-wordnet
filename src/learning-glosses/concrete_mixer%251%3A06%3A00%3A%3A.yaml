simpleMeaning: A machine with a big turning drum, where cement is mixed with other things to make the
  hard stuff used for building
scope: A machine with a big turning drum, where cement is mixed with other things to make the hard stuff
  used for building; cement mixer is another name for this sense, not a hand tool for stirring and not
  a truck that carries the hard stuff used for building.
examples:
- The concrete mixer turned its big drum all morning.
- They poured cement into the concrete mixer with sand and water.
