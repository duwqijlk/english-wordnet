senseId: 'lentic%3:00:00::'
synsetId: 00260299-a
simpleMeaning: Of water that does not move, like the water of lakes and ponds, or of the life in such
  water
scope: Of still water such as lakes and ponds, or of the life in it, not of running water and not of the
  sea.
examples:
- Lentic animals live in the still water of the pond.
- The lentic plants of the lake grow slowly in the calm water.
