simpleMeaning: Sticky hairy leaves and yellow-brown flowers mark this poisonous bad-smelling herb of the
  Old World, the source of the drugs hyoscyamine and scopolamine.
scope: Also called black henbane and henbane, it is a poisonous bad-smelling herb of the Old World that
  yields two drugs.
examples:
- The stinking nightshade had leaves sticky to the touch.
- Do not eat stinking nightshade; it can poison you.
