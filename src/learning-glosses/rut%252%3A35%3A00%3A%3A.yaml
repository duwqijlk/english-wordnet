senseId: 'rut%2:35:00::'
synsetId: 01279995-v
simpleMeaning: to cut out a long narrow hollow
scope: furrow and groove are other names for this sense; this is the act of cutting a long narrow hollow,
  not the hollow itself and not the mating state of a male animal.
examples:
- The heavy cart rutted the soft lane.
- Rain rutted the track across the field.
