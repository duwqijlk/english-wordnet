simpleMeaning: A natural fiber, such as raw cotton, wool, hemp or flax, that can be twisted to form yarn
scope: Also called staple and staple fibre, it is a natural strand from cotton, wool, hemp, or flax, not
  a strand made from chemicals.
examples:
- Staple fibers vary widely in length.
- The staple fiber in the basket was raw cotton.
