simpleMeaning: A tufted evergreen herb that lives for years, with spikes of tiny white flowers and shiny
  green leaves, round or heart-shaped, that turn coppery to maroon or purple in fall.
scope: Also called galaxy, beetleweed, coltsfoot, galax, and wandflower; a low evergreen with leaves that
  colour in fall, not a tall shrub.
examples:
- Galax urceolata spread across the shady bank.
- The Galax urceolata leaves turned coppery in fall.
