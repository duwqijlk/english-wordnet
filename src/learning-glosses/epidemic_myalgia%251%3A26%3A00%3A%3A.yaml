simpleMeaning: Many people at once catch this illness, which brings sudden sharp pains, most often in
  the chest.
scope: This sudden catching illness is also called diaphragmatic pleurisy, epidemic pleurodynia and myosis.
examples:
- Epidemic myalgia swept through the town in a week.
- Her epidemic myalgia brought sharp bursts of pain in her chest.
