simpleMeaning: a person who has a serious illness of the mind and cannot tell what is real from what is
  not
scope: This names a person with this illness; also called a psycho. It is not the illness itself, and
  not the describing word for acts or signs that come from the illness.
examples:
- The hospital cares for psychotics who need help every day.
- A psychotic was brought to the clinic after days without sleep.
