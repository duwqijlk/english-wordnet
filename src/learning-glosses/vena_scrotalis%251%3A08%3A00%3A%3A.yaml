simpleMeaning: blood tubes that run from the bag of skin that holds the male sex glands to the blood tubes
  near the sex organs
scope: Also called the scrotal vein, these are blood tubes that run from the bag of skin that holds the
  male sex glands to the blood tubes near the sex organs, not the deep blood tube of the male sex organ
  itself.
examples:
- The vena scrotalis carries blood from the scrotum toward the pudendal veins.
- The vena scrotalis passes from the scrotum to the pudendal veins.
