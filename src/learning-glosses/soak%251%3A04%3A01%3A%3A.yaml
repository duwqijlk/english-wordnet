simpleMeaning: the act of washing a thing by leaving it in water
scope: The act of washing a thing by leaving it in water, not the act of growing soft in water and not
  the act of filling a thing right through.
examples:
- She gave the dirty shirt a soak in warm water.
- A quick soak in the sink washed the mud off his boots.
