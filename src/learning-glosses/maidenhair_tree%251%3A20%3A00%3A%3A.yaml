simpleMeaning: a Chinese leaf-shedding plant, male and female flowers on separate plants, fan leaves,
  soft yellow seeds, grown almost only by people, above all to line roads for show
scope: 'Also called gingko and ginkgo: a Chinese plant with fan leaves and soft yellow seeds, not a pine
  and not a maple.'
examples:
- A maidenhair tree stood at the end of the street, its fan leaves turning gold.
- The maidenhair tree drops its leaves in fall.
