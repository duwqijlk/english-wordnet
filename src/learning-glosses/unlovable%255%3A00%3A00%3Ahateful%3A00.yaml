simpleMeaning: not able to make anyone feel love or kind care for them
scope: About a person or thing that no one can feel love for; not just a person who is not loved at the
  moment.
examples:
- In the story, the cold and cruel man seemed unlovable to everyone who met him.
- The cold, cruel character in the story seems truly unlovable.
