simpleMeaning: a crystal of aluminum silicate, grey or blue with a touch of green, found in rock changed
  by heat and pressure and used to line things that take great heat
scope: 'Also called cyanite: a grey or green-blue mineral, not a blue gem stone and not an ordinary rock.'
examples:
- The jeweller showed me a piece of kyanite with green-blue streaks.
- Kyanite is used to line ovens that must take great heat.
