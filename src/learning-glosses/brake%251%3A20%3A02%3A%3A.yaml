simpleMeaning: a fern in a group called Pteris, with leaves made of small parts on both sides of a main
  stem; some kinds are well liked as house plants
scope: This is a fern in a group called Pteris, with some kinds kept in a house, not the large rough weed
  fern and not a part used to stop a car.
examples:
- This brake grows well indoors as a house plant.
- He bought a small brake for the living room because he liked its divided leaves.
