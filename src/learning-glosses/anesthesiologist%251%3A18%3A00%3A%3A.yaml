simpleMeaning: A doctor who gives a patient a drug that takes away feeling before treatment.
scope: 'Also called an anaesthetist or anesthetist: a doctor who gives a drug that takes away feeling
  before treatment, not the surgeon who does the treatment.'
examples:
- The anesthesiologist spoke to the patient before the operation.
- An anesthesiologist must watch the patient all through the operation.
