senseId: 'gaseous_state%1:26:00::'
synsetId: 14504664-n
simpleMeaning: 'A form of matter unlike solids and liquids: it has low density and viscosity, expands
  and contracts greatly with pressure and temperature, spreads out readily, and fills any container evenly.'
scope: This is the physical form that gases take, not a solid or a liquid, and not one particular gas
  or fuel.
examples:
- Water exists in the gaseous state as steam when it boils.
- The gaseous state fills the whole flask rather than settling at the bottom.
