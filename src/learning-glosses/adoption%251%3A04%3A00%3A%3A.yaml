simpleMeaning: the act of taking something up and approving of it, so that people welcome it
scope: 'Also called acceptance: taking up an idea with approval, not the legal act of becoming a parent
  to a child.'
examples:
- The adoption of the new plan was quick once people saw how well it worked.
- Her proposal found wide adoption among the town's shopkeepers.
