simpleMeaning: made to feel angry or to have little patience
scope: Also called annoyed, irritated, stung, pissed, steamed, riled, roiled, peeved and nettled. It is
  a feeling of anger or of having little patience, not a calm or happy feeling.
examples:
- He was miffed when his friends left without him.
- She felt miffed by the rude reply.
