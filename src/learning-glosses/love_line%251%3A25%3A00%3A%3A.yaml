simpleMeaning: A fold in the skin of the hand shows, people who read hands say, what you feel inside
scope: Also called a heart line, a line of heart or a mensal line, this is the fold in the hand that shows
  what you feel inside, not the fold that shows how long you will live and not the fold that shows how
  well you will do in life.
examples:
- The love line on her palm curved toward her little finger.
- He traced the love line across his palm.
