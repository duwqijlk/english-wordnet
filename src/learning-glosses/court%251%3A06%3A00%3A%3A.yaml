simpleMeaning: an area that has walls or buildings wholly or partly around it
scope: This is an area enclosed by walls or buildings, not a marked playing surface, a roadside hotel,
  or the home of a king or noble.
examples:
- The children were playing in the courtyard behind the apartment building.
- A small court at the back of the house was full of flowers.
