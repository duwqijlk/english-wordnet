simpleMeaning: A person who has newly changed their faith, most often a person who was not Jewish and
  has become Jewish
scope: A person who has newly changed their faith, most often to Judaism; not someone born into the faith,
  and not a person who only studies it.
examples:
- The young proselyte joined the synagogue after a year of study.
- As a proselyte, she kept the festivals for the first time.
