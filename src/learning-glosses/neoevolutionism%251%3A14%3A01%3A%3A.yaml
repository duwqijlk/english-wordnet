simpleMeaning: In the study of peoples, a school of thought about long-term change in ways of life and
  like patterns of growth in peoples far apart and not linked.
scope: A school of thought in the study of peoples about long-term change in ways of life, also called
  neo-evolutionism; not a theory of how living things change and not a study of one people alone.
examples:
- Neoevolutionism was the first in a series of modern multi-lineal evolution theories.
- The class discussed neoevolutionism and its view of change in far-apart peoples.
