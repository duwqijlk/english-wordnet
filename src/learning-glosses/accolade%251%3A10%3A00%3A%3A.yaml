simpleMeaning: an object you can hold or see that shows approval or that someone has done something special
scope: 'Also called honor, award, honour, and laurels: an object given as a sign of approval, not spoken
  praise alone and not pay for work.'
examples:
- She was given an accolade for her brave work as a nurse.
- The team held up the accolade so the crowd could see it.
