simpleMeaning: a kitchen tool with a thin, narrow part that bends, used for turning food over
scope: A kitchen tool for turning food over, not the hand tool with a thin part that bends, used to mix
  or spread soft things.
examples:
- She slid the spatula under the egg and turned it over.
- Use a narrow spatula to lift the thin pancakes without breaking them.
