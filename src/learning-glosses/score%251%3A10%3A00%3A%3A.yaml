simpleMeaning: a written version of a piece of music in which the parts for each instrument appear on
  separate sets of lines, usually across large pages.
scope: This is not the number of points in a game, nor a group of twenty, nor a cut mark; it is the written
  music itself.
examples:
- The conductor studied the full score before rehearsal.
- Each musician received a copy of the score.
