simpleMeaning: Shaped like a pear, this part of the brain, made of nerve cells, lies on both sides of
  the brain in the part that deals with smell
scope: 'Also called piriform area, piriform lobe and pyriform lobe: a pear-shaped part of the brain made
  of nerve cells, on both sides of the brain in the part that deals with smell, not a part of the brain
  that deals with sight or movement.'
examples:
- Signals from the nose pass through the pyriform area.
- The pyriform area lies on both sides of the brain.
