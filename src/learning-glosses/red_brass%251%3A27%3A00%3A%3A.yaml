simpleMeaning: Water pipes, other metal fittings, and low-cost jewelry are made from a yellow metal mix
  holding so much copper that it takes on a faint rusty colour.
scope: 'Also called guinea gold: a yellow metal mix with so much copper that it takes on a faint rusty
  colour, used for water pipes, other metal fittings, and low-cost jewelry, not the yellow metal mix with
  less copper and no rusty colour.'
examples:
- The red brass pipes had a faint rusty colour.
- She chose a red brass ring because it cost so little.
