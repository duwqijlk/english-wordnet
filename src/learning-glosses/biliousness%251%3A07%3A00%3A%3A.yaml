simpleMeaning: a way of being in which a person is quick to show anger that is not held back
scope: 'Also called temper, irritability, peevishness, pettishness and surliness: a way of being quick
  to show anger that is not held back, not a short burst of anger and not pain in the stomach from a liver
  problem.'
examples:
- His biliousness was well known to all his employees.
- Her biliousness showed in sharp words at the smallest delay.
