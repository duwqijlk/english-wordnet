simpleMeaning: a person whose job is to plan how clothes should look and be made
scope: This person plans clothes, not a person who plans the inside of rooms, not a person who plans pictures
  and words for pages or screens, and not a person who makes secret plans.
examples:
- A famous designer showed his new coats and dresses in Paris.
- The designer made a long red dress for the film star.
