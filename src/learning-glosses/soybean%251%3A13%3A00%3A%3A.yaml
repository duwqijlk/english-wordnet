simpleMeaning: a plant food with more protein than any other vegetable known, eaten by people and fed
  to animals in place of meat
scope: A food plant rich in protein, not the oil got from it and not just any bean.
examples:
- Soybean milk is a good drink for people who cannot drink cow's milk.
- Farmers grow soybeans to feed their animals.
