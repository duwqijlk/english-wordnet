simpleMeaning: When a machine fails in some way, a mistake appears in something printed
scope: 'Also called literal, typo, misprint and literal error: a mistake in something printed that comes
  from a machine failing, not a mistake made by the writer and not a wrong idea in the text.'
examples:
- The erratum in the book was a wrong letter in a name.
- She found an erratum on page ten, where a word had been printed twice.
