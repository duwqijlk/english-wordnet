simpleMeaning: A drug that numbs one part of the body, put on the skin or on wet inner surfaces, also
  sold as Lidocaine.
scope: Also called Lidocaine; a drug that numbs one part of the body when put on the skin, not a drug
  that puts the whole body to sleep.
examples:
- The dentist used Xylocaine before the filling.
- Xylocaine numbed the skin around the cut.
