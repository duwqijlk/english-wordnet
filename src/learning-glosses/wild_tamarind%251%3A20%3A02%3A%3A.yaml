simpleMeaning: A thorny tropical American tree with clusters of yellow flowers and curved edible pods;
  it also gives useful wood, yellow dye and sticky gum.
scope: This sense is the thorny tropical American tree grown for its pods, timber and dye, not the West
  Indian tree with long flat pods that merely resembles true tamarind.
examples:
- The wild tamarind in the park has yellow flowers and long edible pods.
- Farmers value the wild tamarind for its timber and the yellow dye from its wood.
