simpleMeaning: The soft pulp inside a tooth sits in a hollow ringed by hard bone.
scope: This is also called dentin, and is the hard layer round a tooth's hollow centre, not the hard stuff
  that makes up most of the tooth.
examples:
- The dentine round the pulp protects the soft centre.
- The dentine round the pulp was easy to see.
