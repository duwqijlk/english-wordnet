simpleMeaning: Tough bendy branches, soft bark and small yellow blooms mark this bush of the east of North
  America, which loses its leaves in the cold months.
scope: 'It is also called leatherwood, moosewood, ropebark and wicopy: a bush of eastern North America
  with tough bendy branches, not the maple of the same name.'
examples:
- The moose-wood loses its leaves in the cold months.
- Moose-wood bark bends without breaking.
