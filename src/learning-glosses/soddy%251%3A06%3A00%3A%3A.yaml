simpleMeaning: a house built of blocks of cut grass and earth or of sun-dried mud bricks, laid in flat
  rows
scope: A house built of grass blocks or mud bricks laid in flat rows, also called a sod house and an adobe
  house; not a wooden house and not a stone house.
examples:
- The settlers built a soddy on the flat plains.
- Their soddy kept them warm through the long winter.
