simpleMeaning: Orange to orange-red flowers marked with purple spots grow on a plant of the east of North
  America.
scope: This plant of the east of North America bears orange to orange-red flowers marked with purple spots,
  not the kind with three leaves in a ring and one flower with three petals.
examples:
- The orange flowers of wood lily are marked with purple spots.
- In the east of North America, wood lily grows.
