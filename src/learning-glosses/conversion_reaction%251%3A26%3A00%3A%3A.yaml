simpleMeaning: Inner conflict in the mind shows itself as bodily trouble — a limb that will not move,
  or feeling lost from part of the body — for no clear reason.
scope: This is the bodily answer to inner conflict in the mind, also called conversion disorder or conversion
  hysteria, and not a sickness of the body itself.
examples:
- Her conversion reaction left one arm without feeling.
- His conversion reaction showed itself as a leg that would not move.
