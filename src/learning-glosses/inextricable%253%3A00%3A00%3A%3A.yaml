senseId: 'inextricable%3:00:00::'
synsetId: 00948414-a
simpleMeaning: So tangled or tied that it cannot be pulled apart or undone.
scope: Said of a knot, a tie, or lives bound together, that cannot be pulled apart or undone.
examples:
- The ropes formed an inextricable knot that no one could undo.
- Their lives were inextricable, bound together by years of work.
