simpleMeaning: a hurt bad enough for an English soldier serving abroad to be sent home
scope: A hurt that gets an English soldier serving abroad sent home, not a small cut and not a wound that
  keeps a soldier at the front.
examples:
- His blighty wound meant a trip home instead of another month at the front.
- A blighty wound was the one injury every soldier hoped for and feared.
