simpleMeaning: to make something have four equal sides and right angles.
scope: This is not about multiplying a number by itself or settling a debt; it means making something
  square in shape.
examples:
- Use a ruler to square the corners of the card.
- The carpenter squared the ends of the boards before joining them.
