scope: 'Another name for a calash top and a caleche: a cover that folds back over the top of a carriage
  pulled by horses, not a fixed roof and not a woman''s hooded head covering.'
examples:
- The driver raised the calash against the rain.
- With the calash folded back, the passengers could see the sky.
