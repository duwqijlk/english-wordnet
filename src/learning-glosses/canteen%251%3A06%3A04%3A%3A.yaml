simpleMeaning: a shop in a school, camp, or other place that sells food and personal things to the people
  there
scope: A shop that sells food and personal things to people at a school or camp, not a flask for carrying
  water.
examples:
- The canteen sells sandwiches and drinks to the pupils.
- He bought a pen at the camp canteen.
