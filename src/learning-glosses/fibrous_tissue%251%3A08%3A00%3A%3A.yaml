simpleMeaning: body or plant stuff that is made of thin threads or holds thin threads
scope: Stuff in animals and plants made of thin threads, not a single thread and not a hard bone.
examples:
- Fibrous tissue holds the muscle to the bone.
- The stem had fibrous tissue that gave it strength.
