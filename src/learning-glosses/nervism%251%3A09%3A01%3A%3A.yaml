simpleMeaning: All behavior and all the body's workings answer to its network of nerves, in the view Pavlov
  put forward.
scope: The view Pavlov put forward, that the network of nerves runs all behavior and all the body's workings.
examples:
- In nervism, Pavlov held that the nerves run all behavior.
- Under nervism, the nerves run even the body's inner workings.
