simpleMeaning: a control on an organ that brings in pipes whose sound comes from air blown across a sharp
  edge
scope: A control on an organ that brings in a set of pipes, not a reed control and not a key on the keyboard.
examples:
- The organist pulled the flue stop for the quiet hymn.
- A flue stop gives the organ a soft, flute-like voice in the slow passage.
