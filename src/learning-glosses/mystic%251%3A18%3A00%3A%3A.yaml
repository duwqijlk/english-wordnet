simpleMeaning: a person who holds that there are real things beyond what people can grasp with the mind
scope: A person who believes in things beyond human understanding; not a thing that is hard to understand,
  and not the adjective for things to do with that belief.
examples:
- The mystic spent years in prayer and quiet thought.
- She spoke like a mystic, of truths no one could fully grasp.
