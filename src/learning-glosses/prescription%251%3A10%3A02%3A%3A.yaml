simpleMeaning: a written note for the person who makes glasses, saying what lenses a person needs
scope: Written instructions about the lenses a person needs for glasses, not a doctor's order for medicine
  and not a set of rules laid down beforehand.
examples:
- The optician read her prescription before making her new glasses.
- His prescription for new lenses was ready at the shop.
