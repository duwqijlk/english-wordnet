simpleMeaning: A soft pad of tough gristle cushions the bones of the back, sitting between every two bones
  but the top two
scope: This pad of tough gristle, also called the intervertebral disc, sits between the bones of the back,
  all but the top two.
examples:
- Between two bones of the back lies an intervertebral disk.
- Each intervertebral disk takes the shock between the bones of the back.
