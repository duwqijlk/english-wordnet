simpleMeaning: Six carbon atoms joined in a closed ring, with hydrogen atoms joined to them, are what
  this written form stands for.
scope: Also called benzene nucleus or benzene ring, this is the written form that shows how the six carbon
  atoms are joined.
examples:
- The benzene formula shows six carbon atoms in a closed ring.
- The benzene formula was written on the board.
