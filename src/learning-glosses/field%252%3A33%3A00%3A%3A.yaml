simpleMeaning: to take the role of a player who catches and returns the ball on the defensive side of
  the game
scope: This is not catching or picking up a ball, answering questions successfully, or choosing a player,
  but taking a defensive role in the game.
examples:
- He fielded cleanly at third base all afternoon.
- She fields in the deep outfield for the county team.
