simpleMeaning: made of fibres that carry orders to move, this root leaves the front of the cord down the
  back; it is one of two roots of a spinal nerve
scope: 'Also called ventral root, anterior horn, and anterior root: one of the two roots of a nerve of
  the spine, carrying orders out to move; not the back root, which brings feeling in.'
examples:
- The ventral horn sends out the fibres that move the arm.
- Damage to the ventral horn can leave a muscle weak.
