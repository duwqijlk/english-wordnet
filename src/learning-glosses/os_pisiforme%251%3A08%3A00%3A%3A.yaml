simpleMeaning: A small bone in the wrist that joins to just one other bone in the wrist
scope: A small bone in the wrist that joins to just one other bone in the wrist, also called pisiform
  and pisiform bone, not a bone of the fingers and not a bone that joins to many others.
examples:
- The doctor felt the os pisiforme in the patient's wrist.
- The os pisiforme is one of the small bones of the wrist.
