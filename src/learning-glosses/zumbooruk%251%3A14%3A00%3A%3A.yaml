simpleMeaning: Early modern Arab, Afghan, Persian, and Indian armies kept soldiers on camels as their
  fighting force.
scope: Also called camel cavalry, zamboorak, zamburak, zamburek, and zumbooruck, this was the soldiers-on-camels
  fighting force of early modern Arab, Afghan, Persian, and Indian armies.
examples:
- The zumbooruk served the Persian army in the early modern era.
- Arab armies of the early modern era fought with zumbooruk on camels.
