simpleMeaning: Something whose meaning is not fixed in itself, and that is not laid out in a set pattern.
scope: Something whose meaning is not fixed in itself and that is not laid out in a set pattern, not something
  open to two readings.
examples:
- The test used ambiguous inkblots with no clear meaning.
- The artist showed an ambiguous pattern of shapes and colors.
