simpleMeaning: a person that other people think is very bad and not worth any respect
scope: Also called rat, crumb, git, skunk, puke, bum, stinker, lowlife, rotter, and stinkpot. This is
  a bad person people look down on, not a dirty bag.
examples:
- Only a scumbag would steal money from his own mother.
- People called the cheating boss a scumbag.
