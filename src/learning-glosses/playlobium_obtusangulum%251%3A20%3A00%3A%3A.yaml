simpleMeaning: A low spreading evergreen shrub of southern Australia with triangular to somewhat heart-shaped
  leaves and orange-yellow flowers followed by flat winged pods.
scope: Also called common flat pea and native holly; not a tree and not a shrub with red flowers.
examples:
- The Playlobium obtusangulum spread low across the dry garden.
- We saw Playlobium obtusangulum with orange-yellow flowers.
