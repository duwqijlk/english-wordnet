simpleMeaning: an American fern whose early-spring spore-bearing fronds are woolly and brown, later circled
  by green leaves; the young fronds are eaten while still uncurling
scope: Another name for the cinnamon fern and fiddlehead, with edible young fronds; not the ostrich fern,
  a taller plant also called fiddlehead.
examples:
- Fiddlehead fern grows in damp woodland.
- We cooked the young tips of fiddlehead fern.
