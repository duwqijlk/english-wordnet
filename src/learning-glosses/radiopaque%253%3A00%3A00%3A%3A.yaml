simpleMeaning: Blocking rays used to see inside the body and other rays, so they cannot pass through
scope: 'Also called radio-opaque: blocking rays used to see inside the body and other rays, not letting
  them pass almost fully as radiolucent things do.'
examples:
- Barium sulfate is radiopaque, so it shows up on the picture.
- The radiopaque dye blocked the rays and made the blood vessels easy to see.
