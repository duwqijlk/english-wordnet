simpleMeaning: a blood particle that carries cholesterol, made of some protein and much cholesterol; high
  levels are thought to raise the risk of heart disease and hardening of the arteries
scope: Also called low-density lipoprotein; a cholesterol-carrying particle in the blood, not cholesterol
  itself and not a blood cell.
examples:
- High beta-lipoprotein levels worried the doctor.
- The lab measured her beta-lipoprotein after the blood test.
