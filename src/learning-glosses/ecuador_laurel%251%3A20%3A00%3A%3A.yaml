scope: A flowering timber tree, not a small garden tree and not a fruit tree; also called cypre, princewood,
  salmwood, Cordia alliodora and Spanish elm.
examples:
- The Ecuador laurel stood tall with creamy white flowers.
- Builders prize the Ecuador laurel for its fine wood.
