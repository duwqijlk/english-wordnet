simpleMeaning: carry out an action with physical power, or put physical power to work
scope: This sense is about applying bodily strength to do something, not about squeezing an object into
  a gap, not about taking something away from someone, and not about making a person act.
examples:
- Burglars forced the lock on the side gate.
- She forced the door open with her shoulder.
