simpleMeaning: The muscles of the forearm, wrist, and hand are fed by a large blood tube that branches
  off the main tube of the upper arm
scope: This large blood tube that branches off the main tube of the upper arm is also called the ulnar
  artery.
examples:
- The arteria ulnaris brings blood to the muscles of the forearm, wrist, and hand.
- The arteria ulnaris runs down the forearm to the wrist and hand.
