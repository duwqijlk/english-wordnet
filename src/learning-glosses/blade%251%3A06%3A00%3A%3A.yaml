simpleMeaning: The flat piece of a tool or weapon, usually with a cutting edge.
scope: The flat working part itself, not the whole sword-like weapon nor the leaf of a grass.
examples:
- The blade of the knife was chipped near the tip.
- He sharpened the blade of his axe before chopping wood.
