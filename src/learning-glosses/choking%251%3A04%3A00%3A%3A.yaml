simpleMeaning: the act of stopping someone from breathing by pressing on the windpipe (the tube in the
  throat that air goes through)
scope: The act of pressing someone's throat to stop them breathing, not the state when food blocks the
  way for air, and not hot air that makes breathing hard.
examples:
- The police found no proof that the choking was done by the man they questioned.
- The choking left clear marks on her throat.
