simpleMeaning: to come undone, or to make something come undone, by pulling its thin parts or threads
  apart
scope: Also called untangle, unravel, unpick, and unscramble, this is for threads or thin parts that come
  undone; it is not about cutting thread or taking cloth apart.
examples:
- As she pulled the loose threads, the ball of yarn began to unknot.
- He unknotted the twisted thread until its thin strands lay apart.
