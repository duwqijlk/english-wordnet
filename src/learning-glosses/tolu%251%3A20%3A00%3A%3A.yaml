simpleMeaning: Yellow-brown in colour and strong in smell, this sticky stuff comes from the tree it is
  named for and is used above all in syrups for coughs.
scope: Balsam of tolu and tolu balsam are other names for this yellow-brown sticky stuff with a strong
  smell, got from a tree and used above all in syrups for coughs.
examples:
- The cough syrup held tolu from the tree.
- The syrup got its strong smell from tolu.
