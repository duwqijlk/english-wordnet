simpleMeaning: To do with a muscle tightening in which the pull grows stronger while the muscle stays
  the same length.
scope: To do with a muscle tightening while staying the same length, not a muscle shortening as it pulls
  and not the crystal sense of the word.
examples:
- Isometric exercise tightens the muscle without moving the joint.
- She held an isometric pose, her muscles tense but still.
