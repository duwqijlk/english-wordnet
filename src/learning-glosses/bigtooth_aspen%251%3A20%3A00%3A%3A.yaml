simpleMeaning: a tree with a narrow top that grows in the east of North America
scope: 'Also called big-toothed aspen, bigtoothed aspen, large tooth aspen and large-toothed aspen: a
  tree with a narrow top in the east of North America, not a wide-spreading poplar and not a western aspen.'
examples:
- A bigtooth aspen stood at the edge of the wood, its top rising straight and thin.
- Bigtooth aspens grow through the hills of eastern North America.
