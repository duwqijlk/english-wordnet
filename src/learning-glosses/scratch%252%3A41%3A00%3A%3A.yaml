simpleMeaning: To cancel or put off a planned event with no new date.
scope: Withdrawing a scheduled event for good, with cancel, scrub and call off as other names for it,
  not erasing written words or cutting a surface.
examples:
- We scratched our holiday plans when the money ran out.
- The meeting was scratched because the chair was ill.
