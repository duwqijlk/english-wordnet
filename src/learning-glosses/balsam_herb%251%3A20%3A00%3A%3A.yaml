simpleMeaning: A perennial Eurasian herb smelling of tansy, with button-like yellow flowers; eaten as
  a cooked green or salad, sometimes used for potpourri, tea or flavoring, and sometimes placed in Chrysanthemum.
scope: Another name for the aromatic herb called alecost and bible leaf; not tansy itself, though it smells
  like it.
examples:
- The balsam herb has small yellow flowers and a strong scent.
- Balsam herb grows wild in parts of Europe and Asia.
