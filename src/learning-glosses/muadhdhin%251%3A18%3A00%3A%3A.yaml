simpleMeaning: the Muslim officer of a mosque who calls people to prayer from a tall tower five times
  a day
scope: 'Also called a muezzin or a muazzin: the Muslim officer of a mosque who calls people to prayer
  from a tall tower five times a day; not the prayer leader inside the mosque.'
examples:
- The muadhdhin called the faithful to prayer at dawn.
- Each day the muadhdhin climbs the minaret five times.
