simpleMeaning: a set of linked metal rings put round a wheel to help it grip on ice or snow
scope: 'Also called a snow chain: linked metal rings put round a wheel for grip on ice or snow, not a
  spare wheel and not a snow tyre.'
examples:
- We fitted tire chains before driving up the icy hill.
- The tire chain helped the car grip the snow-covered road.
