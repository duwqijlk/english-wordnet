simpleMeaning: used by a speaker to stress that what they say is truly the case
scope: 'Also called honestly: a word a speaker adds to stress that a statement is truly meant, not a way
  of speaking in a direct and open way.'
examples:
- Frankly, I do not think this plan will work.
- Frankly, she was not ready for the test.
