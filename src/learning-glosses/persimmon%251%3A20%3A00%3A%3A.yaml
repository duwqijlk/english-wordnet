simpleMeaning: one of several kinds of tree that grow in warm places, of the group called Diospyros in
  plant science
scope: The tree itself, not its orange fruit that looks like a plum and can be eaten when fully ripe.
examples:
- The persimmon tree in their garden grows tall in the warm weather.
- He planted a young persimmon near the fence and watered it each day.
