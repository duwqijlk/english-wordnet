simpleMeaning: so bad that a person or thing should get no respect and be looked down on
scope: About a person, act or thing that should get no respect, not just bad in a small way and not a
  person who has no respect for others.
examples:
- Stealing money from old people is a contemptible act.
- He told a contemptible lie to hurt his friend.
