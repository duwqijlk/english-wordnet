simpleMeaning: a kind of plastic made from the tough stuff that makes up plant walls, or from a thing
  made from that stuff
scope: A kind of plastic made from plant stuff, not wood itself and not a soft cloth.
examples:
- The old radio case was made of cellulosic, a hard plastic from plant stuff.
- Cellulosic was used for film and combs before newer plastics came along.
