simpleMeaning: an American plant with tall thin bunches of blue flowers, growing in the shallow water
  of streams and ponds
scope: An American plant with tall thin bunches of blue flowers, also called pickerel weed and pickerelweed;
  not a pond weed with white flowers and not a grass.
examples:
- The wampee grows in the shallow water of the pond.
- Blue flowers covered the wampee by the stream.
