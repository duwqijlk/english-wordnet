simpleMeaning: An operation to make the belly look better, taking away wrinkles and pulling the skin tight
  over the stomach.
scope: This is an operation to make the belly look better, also called abdominoplasty; not a diet and
  not a cure for illness.
examples:
- She had a tummy tuck after losing a lot of weight.
- A tummy tuck tightened the skin over his stomach.
