simpleMeaning: a strong chemical put in small caps to start a blast; when dry, a knock or heat makes it
  blow up with great force
scope: 'Also called fulminate of mercury and mercury fulminate: a chemical in small caps that starts a
  blast, not gunpowder and not a slow fuse.'
examples:
- Fulminating mercury filled the tiny cap that set off the charge.
- Workers handled fulminating mercury with care because it blows up when dry.
