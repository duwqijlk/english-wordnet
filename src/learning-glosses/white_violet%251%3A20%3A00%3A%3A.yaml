simpleMeaning: Sweet-smelling pale blooms marked with purple lines grow on short stems of this plant of
  the east of North America.
scope: Also called a sweet white violet and a woodland white violet, it is a short-stemmed plant of the
  east of North America with sweet-smelling pale blooms, not the tall kind with heart-shaped leaves.
examples:
- The white violet bloomed low to the ground.
- A white violet opened its pale blooms.
