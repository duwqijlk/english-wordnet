simpleMeaning: One of many African plants with thick leaves that look like rocks and single yellow or
  white blooms.
scope: Also called flowering stone, lithops, stone-face, stone life face, stone plant, and stoneface,
  it is not a true rock but a plant with rock-like leaves.
examples:
- Living stone grows in Africa with yellow blooms.
- A living stone can be taken for a rock.
