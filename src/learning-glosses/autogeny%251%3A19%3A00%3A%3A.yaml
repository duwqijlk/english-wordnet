simpleMeaning: A guessed-at natural happening in which living things are made from matter that was never
  alive
scope: This is a guessed-at natural happening in which living things are made from matter that was never
  alive; abiogenesis and autogenesis are other names for it, not change over long ages and not making
  by a god.
examples:
- Autogeny is the guessed-at idea that living things were made from matter that was never alive.
- Scientists no longer hold to autogeny as a way life began.
