senseId: 'ship_broker%1:18:00::'
synsetId: 10609193-n
simpleMeaning: a person who works for the owner of a vessel, finds loads for it, and may set up the loading
  or unloading
scope: A person who works for a vessel's owner to find loads and set up loading or unloading; not the
  owner and not a dock worker who moves the loads.
examples:
- The ship broker found a full load of grain for the vessel.
- Our ship broker arranged for the cargo to be unloaded at dawn.
