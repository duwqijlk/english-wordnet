simpleMeaning: A plane drops fast and steeply, with its front end pointing down
scope: A steep fall by a plane, with its front end pointing down; dive and nosedive are other names for
  this sense, not a slow fall and not a plane climbing.
examples:
- The plane went into a nose dive over the field.
- After the engine failed, the pilot pulled out of the nose dive.
