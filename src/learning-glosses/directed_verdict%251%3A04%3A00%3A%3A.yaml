senseId: 'directed_verdict%1:04:00::'
synsetId: 01195304-n
simpleMeaning: a decision in a court case with a jury that the judge makes and gives without asking the
  jury to decide
scope: A court decision made by the judge in a trial with a jury, not a decision made by the jury and
  not a ruling on a point of law alone.
examples:
- The judge gave a directed verdict after the evidence failed to prove the case.
- The court entered a directed verdict and sent the jury home.
