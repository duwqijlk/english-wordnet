simpleMeaning: a container that liquid is poured into so that it takes a certain shape as it hardens.
scope: This is the shaped container, not the group of actors in a play or film.
examples:
- The molten bronze was poured into a sand cast.
- She poured plaster into the cast and left it to harden.
