simpleMeaning: This line marks where the bone at the back of the skull meets the bone at the side, running
  on from the seam across the back of the skull.
scope: This is the line between the bone at the back of the head and the bone at the side, and it runs
  on from the seam across the back of the skull.
examples:
- The occipitomastoid suture showed on the back of the skull.
- The occipitomastoid suture runs on from the lamboid suture.
