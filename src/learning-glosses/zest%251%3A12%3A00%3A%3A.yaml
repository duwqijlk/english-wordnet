simpleMeaning: a feeling of great enjoyment and eagerness when you do something
scope: Also called relish and gusto, this is strong, lively enjoyment of something, not the sharp taste
  of food and not the outer peel of a lemon or orange.
examples:
- She joined the game with great zest.
- He reads old stories with zest and real joy.
