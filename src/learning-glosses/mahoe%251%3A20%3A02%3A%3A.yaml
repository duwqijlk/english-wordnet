simpleMeaning: An upright forest tree from Cuba and Jamaica with leaves of variable hairiness and orange-yellow
  to orange-red flowers. Its moderately dense wood is used for cabinets and gunstocks.
scope: 'Another name for blue mahoe, mahagua and majagua: the upright forest tree of Cuba and Jamaica,
  not the shrubby tropical-shore tree grown as an ornamental and cut for light wood.'
examples:
- The mahoe flowers were orange-yellow, and its leaves felt rough and hairy.
- Cabinetmakers value mahoe for its moderately dense timber.
