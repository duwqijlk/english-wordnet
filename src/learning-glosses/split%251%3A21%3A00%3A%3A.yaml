simpleMeaning: a share of stolen goods or money that someone was promised or says is theirs
scope: This is a person's share of stolen goods or money. It is not a bottle with half the usual amount,
  and not the act of cutting something apart.
examples:
- He demanded his split before the group broke up.
- She waited for her split of the money they had taken.
