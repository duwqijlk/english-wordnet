simpleMeaning: to do the work that belongs to a set job, place, or role
scope: This means doing the work of a job or role, also called function, not leading a wedding or other
  ceremony.
examples:
- She officiated as head of the meeting while the chair was away.
- He officiated in the office for a month when the manager was ill.
