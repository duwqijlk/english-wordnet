simpleMeaning: In law, acting with no care for safety and putting another person at risk of harm or death,
  or failing to act with the same result
scope: In law, acting without care and putting another person at risk, also called culpable negligence;
  not a deliberate attack and not a simple accident.
examples:
- The driver faced a charge of criminal negligence.
- Leaving the gate open was called criminal negligence.
