simpleMeaning: Of a volcano, the pouring out of smoke or hot melted rock, or the rock left behind after
  it
scope: Of a volcano, the pouring out of smoke or hot melted rock; eruption and extravasation are other
  names for this sense, not a slow leak of gas and not a burp.
examples:
- The eructation of the volcano buried the fields in ash.
- After the eructation, a crust of new rock covered the slope.
