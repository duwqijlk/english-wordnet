simpleMeaning: To bring up the names of well-known people you think others look up to, so that people
  think more of you.
scope: To bring up the names of well-known people you think others look up to, so that people think more
  of you; not to praise a friend and not to introduce someone by name.
examples:
- He namedropped the film star to impress the room.
- She namedrops famous authors whenever she meets new people.
