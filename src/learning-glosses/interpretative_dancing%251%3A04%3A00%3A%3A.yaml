simpleMeaning: A story is told, or a feeling is shown, by the way a person moves, in a new kind of movement
scope: A form of modern movement in which a story is told or a feeling is shown by the way a person moves,
  also called interpretative dance, interpretive dance or interpretive dancing; not a set folk dance and
  not a ballet.
examples:
- Her interpretative dancing showed the joy of spring.
- The class learned interpretative dancing to tell stories without words.
