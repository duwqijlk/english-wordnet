simpleMeaning: A surface gets this coat of paint, plaster, varnish, or some other such stuff last of all.
scope: Also called finishing coat, this names the coat put on a surface last of all, of paint, plaster,
  varnish, or some other such stuff.
examples:
- The finish coat went on last, over the earlier coats.
- A finish coat of varnish covered the wood.
