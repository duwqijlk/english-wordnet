simpleMeaning: A place, run by the state or by private people, that takes in money from people or other
  such places and puts it into things that earn money.
scope: A place, run by the state or by private people, that takes in money from people or other such places
  and puts it into things that earn money; also called financial institution and financial organization,
  not a shop and not a state office that only takes taxes.
examples:
- Banks are the best-known financial organisations.
- The financial organisation lent money to small firms.
