simpleMeaning: The act of naming or pointing out what a thing is.
scope: The act of naming or pointing out what a thing is, not the paper or mark that proves who someone
  is, not the state of having been named, and not taking on another person's ways as your own.
examples:
- The identification of the plant took the botanist an hour.
- Quick identification of the fault saved the day.
