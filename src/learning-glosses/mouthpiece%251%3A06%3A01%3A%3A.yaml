simpleMeaning: When you smoke a pipe or a cigarette in a holder, this is the tube you put in your mouth
scope: The tube of a smoking pipe or cigarette holder held in the mouth; not the opening of a wind instrument,
  not the part of a telephone you speak into, and not a guard that protects the mouth.
examples:
- He took the mouthpiece of his pipe between his teeth.
- The mouthpiece of the cigarette holder was made of ivory.
