simpleMeaning: A tooth with no cap put on it, said most of all of the back teeth
scope: A tooth with no cap put on it, most of all a back tooth; not a tooth with no top at all, and not
  a broken tooth.
examples:
- The dentist noted two uncrowned teeth in need of care.
- Her uncrowned molars were still sound.
