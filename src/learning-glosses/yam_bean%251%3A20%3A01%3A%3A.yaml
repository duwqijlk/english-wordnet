simpleMeaning: a climbing Central American plant with edible roots and pods; big tubers are eaten raw
  or cooked, young pods need thorough cooking, and seeds yield rotenone, a pesticide, and oils
scope: The Central American plant eaten for roots and pods; the other yam bean is the Amazonian kind grown
  only for its large roots.
examples:
- Farmers grow yam bean for its roots and its pods.
- The young pods of yam bean must be cooked well before you eat them.
