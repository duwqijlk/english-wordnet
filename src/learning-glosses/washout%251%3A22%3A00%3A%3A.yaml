simpleMeaning: Water wearing away earth or stones, as from a road, and carrying them off.
scope: Also called wash, water wearing away earth or stones, as from a road, and carrying them off; not
  the hollow or break left behind by such wearing away.
examples:
- The washout took the top off the road after the storm.
- From the house they watched the washout of their newly seeded lawn by the water.
