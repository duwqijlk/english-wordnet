simpleMeaning: The deck of a ship open to the weather, usually in the plural, the part of the hull that
  stands above the water.
scope: The deck of a ship open to the weather, usually in the plural, the part of the hull above the waterline,
  not the part below the water.
examples:
- The crew gathered on the topside to watch the harbour.
- Rain washed over the topside as the ship rolled.
