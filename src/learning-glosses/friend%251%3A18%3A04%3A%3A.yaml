simpleMeaning: A person who gives support to a politician, a team or a similar group.
scope: This is not a close personal companion but someone who gives support to a politician, a team or
  a similar group.
examples:
- He is a friend of the local football club and attends every home game.
- Several friends of the candidate paid for the campaign posters.
