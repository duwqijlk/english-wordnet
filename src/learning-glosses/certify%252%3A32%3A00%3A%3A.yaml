simpleMeaning: To give proof of something by what you do, your way of thinking, or how you look.
scope: To be proof of something through actions or looks; evidence, demonstrate and manifest are other
  names for this sense, and it is not the legal sense of declaring someone insane.
examples:
- Her calm manner certified her sense of fairness.
- The old buildings certify a high level of skill in building.
