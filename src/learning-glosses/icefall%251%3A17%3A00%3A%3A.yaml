senseId: 'icefall%1:17:00::'
synsetId: 09331824-n
simpleMeaning: A steep part of a slow-moving mass of frozen water that looks like water frozen as it pours
  down a cliff.
scope: A steep part of a slow-moving mass of frozen water that looks like water frozen as it pours down,
  not a fall of water itself and not a crack in the frozen mass.
examples:
- The climbers crossed the icefall before dawn.
- The icefall looked like a frozen waterfall from below.
