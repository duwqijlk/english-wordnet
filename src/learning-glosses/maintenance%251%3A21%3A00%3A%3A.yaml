simpleMeaning: The money or other help that keeps a family or group going
scope: The money or help that keeps a family or group going, not the work of keeping a machine in good
  order and not the legal meddling in a court case.
examples:
- The maintenance of his family fell to his eldest son.
- She paid maintenance for her children after the divorce.
