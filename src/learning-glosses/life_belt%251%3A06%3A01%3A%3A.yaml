simpleMeaning: To hold you back and keep you from harm, this strap ties you to a thing
scope: A strap that ties you to a thing to hold you back and keep you from harm, not a ring thrown to
  a swimmer and not a vest that keeps you afloat.
examples:
- He clipped the life belt to the rail before he climbed the mast.
- The worker wore a life belt while fixing the roof.
