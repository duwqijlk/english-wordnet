simpleMeaning: A spiny thistle with white woolly leaves and drooping crimson musky blooms; it came from
  Eurasia, lives for years, and grows across eastern North America, where bees prize its nectar.
scope: Another name for the musk thistle — the same spiny Eurasian plant, not a separate species.
