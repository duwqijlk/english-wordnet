simpleMeaning: One of several kinds of sour cherry tree, grown by people, with pale red fruit whose juice
  has no colour.
scope: This is a sour cherry tree with pale red fruit, not the pale red fruit itself.
examples:
- The amarelle bears pale red fruit with colorless juice.
- The amarelle is one of several kinds of sour cherry tree grown by people.
