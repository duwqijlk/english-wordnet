simpleMeaning: a secret matter about hidden things, like the old Jewish teaching on the hidden sense of
  holy books, kept secret by those who know it
scope: Also called cabala, cabbala, cabbalah, kabala, kabbala, kabbalah, and qabala; a secret matter like
  the Kabbalah, not the Kabbalah itself and not a teaching shared in public.
examples:
- The book described the qabalah as a secret teaching passed down in whispers.
- Only a few students were trusted with the qabalah and its hidden meanings.
