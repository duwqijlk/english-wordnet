senseId: 'provide%2:32:00::'
synsetId: 01065210-v
simpleMeaning: to state as a condition in a law or agreement what must happen in a particular case.
scope: It is not supplying something that someone needs; it sets out a rule or condition.
examples:
- The contract provides that the rent will rise each year.
- The new law provides for free school meals.
