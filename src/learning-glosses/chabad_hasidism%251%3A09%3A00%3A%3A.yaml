simpleMeaning: A form of the Jewish movement of joyful worship practised by Jews from Lithuania and Russia
  under communist rule; the beliefs and practices of the Lubavitch movement.
scope: A form of the Jewish movement of joyful worship practised by Jews from Lithuania and Russia under
  communist rule; Chabad is another name for this sense, not the large missionary movement of the same
  name known for hospitality and religious study.
examples:
- Chabad Hasidism is practised by Jews from Lithuania and Russia.
- The Chabad Hasidism movement grew under communist rule.
