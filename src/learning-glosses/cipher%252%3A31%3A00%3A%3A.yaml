simpleMeaning: to work out an answer with numbers, by adding, taking away, multiplying, dividing, or other
  number work
scope: 'Also called calculate, figure, reckon, compute, and cypher: to work out an answer with numbers.
  Not the noun cipher, the number that changes nothing when added, and not cipher for a thing of no importance.'
examples:
- She ciphered the cost of the trip in her head.
- The clerk ciphered the day's sales before closing the shop.
