simpleMeaning: the hard, stone-like body frame of a sea animal from the Mediterranean, in a soft red or
  pink color, used for jewelry
scope: This is the hard red or pink material used for jewelry, not the living sea animal itself, not its
  deep pink color, and not lobster eggs used in food.
examples:
- She wore a necklace made of red coral.
- The ring was set with pink coral from the Mediterranean.
