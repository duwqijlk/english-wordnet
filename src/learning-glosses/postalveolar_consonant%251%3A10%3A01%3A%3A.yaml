simpleMeaning: In phonetics, any speech sound made with the tongue near or touching the back of the ridge
  behind the upper teeth
scope: In phonetics, any speech sound made with the tongue near or touching the back of the ridge behind
  the upper teeth; post-alveolar, post-alveolar consonant and postalveolar are other names for this sense,
  not a sound made with the lips and not a sound made at the front of the teeth.
examples:
- The 'sh' sound is a postalveolar consonant.
- A postalveolar consonant uses the tongue near the ridge.
