simpleMeaning: with huge leaves cut deep like a hand and big long yellow fruit, a shrub or small tree
  of warm America
scope: It bears big long yellow fruit, and it is also called papaya, pawpaw, papaia and a papaya tree.
examples:
- A melon tree grows in warm America.
- The melon tree is a shrub or small tree.
