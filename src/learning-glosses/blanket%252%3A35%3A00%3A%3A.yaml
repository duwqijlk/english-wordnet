simpleMeaning: To spread across something in a thick layer, the way a large cloth would.
scope: Covering something all over as a cloth does, not the warm bed cover, not the reactor's lead shielding,
  and not merely forming a layer that lies across it.
examples:
- Snow blanketed the fields overnight.
- Fog blanketed the valley by dawn.
