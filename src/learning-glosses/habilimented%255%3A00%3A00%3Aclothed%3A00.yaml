simpleMeaning: Most of all, this word means wearing fine clothes, and it often comes with another word
  in front
scope: Wearing fine clothes, also called appareled, attired, dressed, garbed, garmented and robed, not
  bare and not dressed in plain work clothes.
examples:
- The habilimented guests arrived in silk and lace.
- Monks walked by, habilimented in hooded robes.
