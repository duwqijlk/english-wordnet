simpleMeaning: Shut inside the skull and joined to the cord down the back, it is the part of the central
  nerve system that holds all the higher centres of control.
scope: It is also called brain, and it joins the cord down the back without being that cord itself.
examples:
- The encephalon lies inside the skull and joins the cord down the back.
- All the higher centres of the nerve system sit in the encephalon.
