synsetId: 13751538-n
simpleMeaning: 'In mathematics, a number with two parts: a plain number, and a second plain number times
  i, where i gives -1 when multiplied by itself'
scope: In mathematics, a number made of two parts, not a plain number on its own and not a whole number;
  complex number, imaginary and imaginary number are other names for this sense.
examples:
- The complex quantity 3 + 4i has a plain part of 3 and a second part of 4i.
- Her maths class learned how to add two complex quantities.
