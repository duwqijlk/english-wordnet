synsetId: 01475829-n
simpleMeaning: To make the afterbirth, the mother's womb joins with tiny finger-like growths that stick
  out of the bag round the unborn baby
scope: One of the tiny growths that help form the afterbirth, not the afterbirth itself and not the cord.
examples:
- A chorionic villus reaches out from the bag round the baby.
- Chorionic villi join the mother's womb to form the afterbirth.
