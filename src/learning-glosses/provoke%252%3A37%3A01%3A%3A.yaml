simpleMeaning: to annoy someone again and again over a long time
scope: 'Also called plague and harass: to annoy someone again and again over a long time, not to cause
  an event and not to bring out a feeling.'
examples:
- The older boys provoked him every day with teasing and threats.
- He provoked his workers day after day with constant complaints.
