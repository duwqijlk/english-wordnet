simpleMeaning: The spy agency guarding past and present presidents, vice presidents, and their close families,
  and important guests from abroad; it catches counterfeiters and stops faking of state papers and bonds.
scope: Not the FBI or the CIA, other American spy agencies; also called SS, the Secret Service, the United
  States Secret Service, and the US Secret Service.
examples:
- The USSS guards the president.
- A USSS agent stood by the door.
