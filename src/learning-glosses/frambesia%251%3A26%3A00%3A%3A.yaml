simpleMeaning: Red, sore patches of skin that turn into open sores show a catching sickness of warm lands,
  much like early syphilis
scope: Also called yaws and framboesia, this catching sickness of warm lands looks like early syphilis,
  not syphilis itself.
examples:
- The doctor said the frambesia had left sores on the child's legs.
- Frambesia spread quickly through the village in the hot season.
