simpleMeaning: to push something hard and suddenly, as if with a hit from a closed hand
scope: This is the verb for pushing something with force, not the cold drink, not a hit with the hand,
  and not the tool for holes.
examples:
- The nail punched through the thin wood.
- The sharp spike punched through the wall when he hit it hard.
