simpleMeaning: A United States armed-forces award of bronze or silver shapes of tree leaves and acorns,
  given to a person who has won the same medal before.
scope: It marks a second award of the same medal, given in bronze or silver to members of the United States
  armed forces.
examples:
- She wore an Oak Leaf Cluster on her ribbon for her second award of the medal.
- He earned an Oak Leaf Cluster after winning the same medal a second time.
