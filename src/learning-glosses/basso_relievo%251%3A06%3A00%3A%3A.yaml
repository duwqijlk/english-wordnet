senseId: 'basso_relievo%1:06:00::'
synsetId: 02806295-n
simpleMeaning: a carving in which the shapes stick out only a little from the flat back, and no shape
  is cut away underneath
scope: 'Also called bas relief, basso rilievo or low relief: a carving with shapes that stick out only
  a little, not a carving that stands out far and not a flat picture.'
examples:
- The basso relievo on the old church showed faces that rose only a little from the stone.
- The basso relievo on the wall felt almost flat when she ran her hand over it.
