simpleMeaning: with no life, energy, or feeling in it
scope: Also called desiccate and desiccated, this means dull and without life or feeling; it is not about
  dry land that gets too little rain.
examples:
- His arid speech gave facts but no feeling, and people soon stopped listening.
- She gave an arid talk that was correct but dull and hard to enjoy.
