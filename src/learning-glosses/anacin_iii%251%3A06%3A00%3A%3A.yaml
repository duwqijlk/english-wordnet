simpleMeaning: A drug that eases mild pain but not swelling, also used to bring down fever; one brand
  name of acetaminophen tablets, along with Datril, Tylenol, Panadol, Phenaphen and Tempra.
scope: Also called acetaminophen, Datril, Panadol, Phenaphen, Tempra and Tylenol; a drug that eases mild
  pain but not swelling and brings down fever, not aspirin, which also eases swelling, and not a drug
  for strong pain.
examples:
