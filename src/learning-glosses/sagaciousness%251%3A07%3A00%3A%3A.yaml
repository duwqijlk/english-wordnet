simpleMeaning: the quality of forming opinions by telling things apart and weighing them
scope: 'Also called sagacity or judiciousness: the quality of forming opinions by telling things apart
  and weighing them, not quick guessing and not book learning.'
examples:
- Her sagaciousness showed in the way she weighed both sides before deciding.
- His sagaciousness helped the town avoid a costly mistake.
