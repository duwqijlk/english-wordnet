senseId: 'nauseate%2:37:00::'
synsetId: 01812341-v
simpleMeaning: when something seems so wrong and bad to people that it puts them off it and makes them
  feel sick
scope: To turn people against something because it seems wrong and bad to them, also called disgust, sicken,
  and revolt; not the sick feeling in the stomach itself.
examples:
- The cruel pictures nauseated the visitors, who turned away in disgust.
- His lies nauseated everyone who heard them.
