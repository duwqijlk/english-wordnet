simpleMeaning: A bush or small tree with thorns, from warm America, whose yellow flowers smell sweet and
  go into scents.
scope: This is the thorny bush or small tree of warm America known for its sweet-smelling yellow flowers,
  also called cassie, flame tree, mimosa bush, scented wattle, sweet acacia and sweet wattle.
examples:
- The huisache was covered in yellow flowers.
- The scent of huisache flowers goes into perfumes.
