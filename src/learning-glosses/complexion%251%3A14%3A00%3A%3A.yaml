simpleMeaning: a thing made by joining two or more things together
scope: A thing made by joining parts together, not the colour of a person's skin and not the old idea
  of the body's humours.
examples:
- Diphthongs are complexions of vowels.
- The complexion of the two metals made a strong new alloy.
