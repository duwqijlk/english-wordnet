simpleMeaning: A fluid that X-rays cannot pass, given so a picture reader can see the organ or tissue
  it fills.
scope: This sense is also called contrast material, a fluid that X-rays cannot pass, given so a picture
  reader can see the organ or tissue it fills.
examples:
- Contrast mediums block X-rays.
- The contrast medium lets a picture reader see.
