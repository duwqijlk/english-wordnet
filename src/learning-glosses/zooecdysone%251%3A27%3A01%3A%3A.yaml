simpleMeaning: the body chemicals that make insects shed their old outer skin as they grow
scope: This is the name for the body chemicals that make insects shed their old skin as they grow; not
  the shed skin itself and not a hormone of other animals.
examples:
- The zooecdysone level rose just before the caterpillar shed its skin.
- Scientists study zooecdysone to learn how insects grow.
