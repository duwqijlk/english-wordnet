simpleMeaning: a stone people prize, costly or less costly, set in a ring or other thing worn to look
  good
scope: A prized stone set in a ring or other worn thing, also called a jewel; not a sweet bread, not a
  fine person, and not a rock cut for rings.
examples:
- The ring held a bright gem.
- She wore a gem in a gold ring.
