simpleMeaning: a tall piece of furniture for keeping clothes, with a door and rails or hooks to hang clothes
  on
scope: 'Also called press or closet: a tall piece of furniture for keeping clothes, not a collection of
  clothes or costumes owned by a person or a theatre group.'
examples:
- She hung her dresses in the wardrobe.
- He opened the wardrobe to choose a clean shirt.
