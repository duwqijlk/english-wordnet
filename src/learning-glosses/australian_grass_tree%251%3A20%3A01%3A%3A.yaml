simpleMeaning: Any of several evergreen plants from Australia that live many years, with short thick woody
  stems crowned by a tuft of thin blade-like leaves, yielding a resin.
scope: 'Also called grass tree: an evergreen plant with a tuft of leaves, not a grass, and not the stout
  shrub kind of the same name.'
examples:
- Australian grass tree crowned its short stem with a tuft of leaves.
- We saw an Australian grass tree on the dry plain.
