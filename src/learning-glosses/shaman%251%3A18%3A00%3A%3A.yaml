simpleMeaning: in groups that follow this practice, a person who links the seen world and the spirit world,
  and uses magic to heal or tell what will happen
scope: This person is also called priest-doctor; it is not a regular doctor and not a priest in a church.
examples:
- The shaman used songs and magic to try to heal the sick child.
- People asked the shaman to tell them what would happen in the next year.
