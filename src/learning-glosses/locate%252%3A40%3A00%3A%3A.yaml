simpleMeaning: to find where a person or thing is by looking for it or checking
scope: To find where something is by looking for it, not to mark out its place or edges with a tool, and
  not to give something a place.
examples:
- Can you locate my cousins in this big crowd?
- She searched the map to locate the small village.
