simpleMeaning: From the warm parts of Asia, Polynesia, and America comes a fern that grows on other plants,
  its long narrow fronds often twisted.
scope: A fern that grows on other plants, with long narrow fronds often twisted, from the warm parts of
  Asia, Polynesia, and America; not the lowland-forest fern of tropical America.
examples:
- The ribbon fern grows on the trunk of a tree in the warm forest.
- Her ribbon fern has long narrow fronds that often twist.
