simpleMeaning: any of many short-stemmed plants with leaves in a tuft low at the base and bright flowers
  grouped in flat-topped clusters or round heads
scope: Also called a primrose; a low garden plant with clustered flowers, not a tall plant with single
  flowers.
examples:
- The primula by the path had bright yellow flowers.
- She planted primula in the shade where their leaves form a low tuft.
