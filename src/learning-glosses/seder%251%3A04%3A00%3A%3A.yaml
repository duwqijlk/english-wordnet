simpleMeaning: In Judaism, the special meal on the first night of Passover, or on both nights.
scope: Passover supper is another name for this sense; this is the meal that opens Passover, on the first
  night or on both nights, not an everyday family meal.
examples:
- The family sat down to the Seder on the first night of Passover.
- Our Seder lasted long into the night, with songs and stories.
