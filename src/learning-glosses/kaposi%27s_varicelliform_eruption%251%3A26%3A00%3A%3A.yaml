simpleMeaning: A rare skin problem that now seldom happens, when the smallpox vaccine virus brings on
  a high fever and wide-spread blisters on skin already sore with eczema
scope: Also called eczema vaccinatum; this is a rare rash after a smallpox vaccination on skin already
  sore, not the cancer that starts with purple spots.
examples:
- Kaposi's varicelliform eruption is rare now.
- The child had Kaposi's varicelliform eruption after the vaccination.
