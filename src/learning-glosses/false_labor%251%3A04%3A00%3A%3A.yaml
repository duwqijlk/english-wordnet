simpleMeaning: painless tightenings of the womb that go on through pregnancy and come more and more often
scope: These are painless tightenings of the womb during pregnancy; not real labour that leads to birth
  and not a single cramp.
examples:
- Her false labor came and went for weeks before the birth.
- False labor contractions grew more frequent as pregnancy went on.
