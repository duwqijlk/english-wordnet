simpleMeaning: In Judaism, the set dinner on the first night, or both nights, of the spring feast.
scope: Also called Seder, this is, in Judaism, the set dinner on the first night, or both nights, of the
  spring feast; it is the dinner, not the feast itself.
examples:
- The family sat down to the Passover supper on the first night.
- They sang songs at the Passover supper.
