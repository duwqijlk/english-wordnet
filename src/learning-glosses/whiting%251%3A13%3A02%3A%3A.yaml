simpleMeaning: the flesh of a fish like cod, from the Atlantic waters of Europe, eaten as food
scope: This is the flesh of a cod-like fish from European Atlantic waters, eaten as food; not the live
  fish itself, and not flesh from North American fish.
examples:
- We ate whiting for dinner, with bread and vegetables.
- She cooked the whiting in a pan with a little butter.
