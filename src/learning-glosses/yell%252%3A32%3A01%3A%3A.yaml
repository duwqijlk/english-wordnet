simpleMeaning: to let out a sudden loud shout
scope: This is a sudden burst of sound - also called call, cry, shout or scream in this sense - not the
  other yell verb sense of saying something at full volume.
examples:
- He yelled for help when the boat drifted away.
- The children yelled with delight as the waves hit them.
