simpleMeaning: with feather-like leaves and slim spikes of blue flowers, this tall bushy plant from Europe
  lives for years and is at times used as a cure
scope: 'Also called goat''s rue: a tall bushy European plant with slim spikes of blue flowers, not the
  North American plant of the same name that gives rotenone.'
examples:
- Goat rue grew in a thick bush by the garden wall.
- The goat rue was in flower, its blue spikes bright against the green leaves.
