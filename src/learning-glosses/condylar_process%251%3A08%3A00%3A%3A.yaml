senseId: 'condylar_process%1:08:00::'
synsetId: 05479489-n
simpleMeaning: The rounded end of the upright part of the lower jaw bone, where it meets and moves against
  the skull.
scope: Also called condyloid process and mandibular condyle; the rounded joint at the top of the lower
  jaw, not the chin and not a tooth.
examples:
- The condylar process moves in its socket when you open your mouth.
- An X-ray showed damage to the condylar process after the fall.
