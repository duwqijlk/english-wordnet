simpleMeaning: A medium-sized to large, fast-growing cone-shaped oak of the northeastern United States
  and southeastern Canada whose deeply cut leaves turn bright red in autumn before falling; it likes damp
  ground.
scope: The northern pin oak, the fast-growing cone-shaped tree of the Northeast with red autumn leaves;
  swamp oak names the same tree in this sense, while the other pin oak is a nearly evergreen oak of the
  southeastern United States.
examples:
- Pin oak is planted along many streets in the Northeast because it grows fast and keeps a neat cone shape.
- In October the pin oak's deeply cut leaves turn bright red, then drop to the damp ground below.
