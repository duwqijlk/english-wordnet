simpleMeaning: A fast-growing tree of South America that stays green all year, with a wide soft trunk
  full of water and dark green egg-shaped leaves
scope: This is a fast-growing South American tree with a wide water-filled trunk and dark green egg-shaped
  leaves; bella sombra and ombu are other names for this sense, and it is not a tree that loses its leaves
  in winter.
examples:
- Phytolacca dioica grows fast in South America.
- The wide trunk of Phytolacca dioica holds much water.
