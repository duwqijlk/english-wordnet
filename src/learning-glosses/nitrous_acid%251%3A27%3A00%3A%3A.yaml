simpleMeaning: A chemical that breaks down fast and is found only when mixed in water or in salts made
  from it.
scope: A chemical that breaks down fast and is found only when mixed in water or in salts made from it,
  not nitric acid and not a strong acid that keeps.
examples:
- Nitrous acid breaks down fast and is known only in solution.
- The chemist made nitrous acid fresh because it does not keep.
