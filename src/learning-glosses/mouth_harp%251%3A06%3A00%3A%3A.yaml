simpleMeaning: 'Blow into one of its air holes to play it: a small box-shaped thing with a row of thin
  strips that shake free, set back inside the holes.'
scope: It is also called a harp, a harmonica and a mouth organ, and it is the small box-shaped one you
  play by blowing into one of its air holes.
examples:
- She blew into the mouth harp and a tune came out.
- He played a sad song on the mouth harp.
