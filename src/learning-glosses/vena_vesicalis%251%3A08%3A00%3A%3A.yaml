simpleMeaning: Blood tubes that drain the network of tubes of the bladder and join the blood tubes inside
  the hip.
scope: Blood tubes draining the bladder network and joining the hip tubes; vesical vein is another name
  for this sense; not blood tubes of the kidney and not ones of the legs.
examples:
- The vena vesicalis drains the network of tubes round the bladder.
- The vena vesicalis joins the blood tubes inside the hip.
