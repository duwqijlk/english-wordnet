simpleMeaning: A union of North American Indian peoples, set up by the Muskogee, that ruled the south-east
  of the United States before being moved to Oklahoma.
scope: A Muskogee-led union of North American Indian peoples that ruled the south-east until its peoples
  were moved to Oklahoma; not a single tribe.
examples:
- The Creek Confederacy dominated the south-east.
- The Creek Confederacy was moved to Oklahoma.
