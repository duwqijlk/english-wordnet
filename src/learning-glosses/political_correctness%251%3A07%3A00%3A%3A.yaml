senseId: 'political_correctness%1:07:00::'
synsetId: 04906890-n
simpleMeaning: People who face unfair treatment or social disadvantage should not hear words and deeds
  that shut them out, sideline them, or insult them.
scope: 'Also called political correctitude: leaving out words and deeds that could insult people who face
  unfair treatment.'
examples:
- Political correctness guides what the school says in its letters home.
- He followed political correctness and avoided words that might insult the new pupils.
