simpleMeaning: a sore caused by one kind of virus, herpes simplex virus type 1 (HSV-1)
scope: 'Also called a cold sore, herpes labialis, and oral herpes: a sore caused by a virus, not a sore
  from a burn and not a rash from an allergy.'
examples:
- A fever blister appeared on her lip after she caught a cold.
- He put cream on his fever blister to help it heal.
