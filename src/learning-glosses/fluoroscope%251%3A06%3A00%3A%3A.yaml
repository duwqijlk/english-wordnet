simpleMeaning: A machine that lets you watch while things move, joining a source of X-rays with a screen
  that lights up when the rays hit it.
scope: This machine is also called a roentgenoscope, and it gives a moving view, not a still picture.
examples:
- The fluoroscope showed the heart beating inside the chest.
- The fluoroscope showed the bones of the hand as the fingers moved.
