simpleMeaning: a child with no home, above all one left alone by its parents or with no parents at all
scope: A child with no home and no one to care for it, not an adult without a home and not a child who
  simply runs away from home.
examples:
- The little waif slept in doorways and begged for bread.
- Waifs wandered the streets of the city, with no home and no one to care for them.
