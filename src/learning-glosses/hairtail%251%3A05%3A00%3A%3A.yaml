simpleMeaning: a long sea fish with a long thin body like a whip, no scales, and sharp teeth, close kin
  of the snake mackerel
scope: 'Also called cutlassfish and frost fish: a long thin sea fish with sharp teeth, not an eel and
  not a mackerel.'
examples:
- The hairtail in the net was long and thin, with sharp teeth and no scales.
- The hairtail's long thin body and sharp teeth make it easy to spot in the catch.
