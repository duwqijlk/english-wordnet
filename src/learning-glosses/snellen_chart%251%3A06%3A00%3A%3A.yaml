senseId: 'snellen_chart%1:06:00::'
synsetId: 04256815-n
simpleMeaning: A printed card with rows of letters and numbers that get smaller and smaller, used to test
  how well a person can see
scope: A display chart read line by line in an eye test, from the largest letters and numbers at the top
  down to the smallest line the person can still read.
examples:
- The nurse asked him to read the Snellen chart from six metres away.
- She covered one eye and read the smallest line on the Snellen chart.
