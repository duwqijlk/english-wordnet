simpleMeaning: a wrong act so bad that it cannot be forgiven and takes away all of God's favour
scope: A sin so bad it cannot be forgiven and takes away all of God's favour, also called a mortal sin;
  not a small fault and not a crime under the law.
examples:
- The priest warned that a deadly sin could cost a person all of God's grace.
- In the old teaching, a deadly sin was one that could not be forgiven.
