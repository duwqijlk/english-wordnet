simpleMeaning: In a hospital, this is the part where staff and the things they need are ready to give
  intensive care.
scope: 'Also called intensive care unit: the part of a hospital that gives intensive care, not a normal
  ward for patients who are getting better.'
examples:
- The baby was moved to the ICU for round-the-clock care.
- After the operation, he spent two days in the ICU.
