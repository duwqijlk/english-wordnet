simpleMeaning: a sudden catching illness caused by the herpes varicella zoster virus (a tiny germ); it
  gives a rash of small blisters on the face and body
scope: Also called varicella, this is a catching illness with small blisters, not measles with its flat
  red spots, and not a sickness of chickens.
examples:
- My daughter caught chickenpox and stayed home with itchy blisters all over her body.
- Most children get chickenpox once and then do not get it again.
