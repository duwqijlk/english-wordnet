simpleMeaning: a long wool or linen scarf worn over the head and shoulders, also used as a sling to carry
  a baby, worn in the old way by Latin-American women
scope: A long scarf for head and shoulders that can also carry a baby, not a shawl and not a head covering
  worn by men.
examples:
- She wrapped a rebozo around her head and shoulders.
- The mother carried her baby in a rebozo.
