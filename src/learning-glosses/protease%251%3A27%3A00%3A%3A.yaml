simpleMeaning: Proteins end up as smaller bits of protein and single building blocks when any body chemical
  of this kind cuts them apart in a breaking-down process called proteolysis.
scope: 'Also called peptidase, proteinase, and proteolytic enzyme: a body chemical that cuts proteins
  into smaller bits of protein and single building blocks.'
examples:
- The protease cut the protein into smaller bits and single building blocks.
- Proteases work by proteolysis, breaking proteins down.
