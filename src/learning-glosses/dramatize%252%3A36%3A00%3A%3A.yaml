simpleMeaning: to turn a story or event into a play, a film, or another show for people to watch
scope: 'Also called dramatise: this means turning a story or event into a play, a film, or another show,
  not just making something sound bigger or more exciting in the telling.'
examples:
- The writer dramatized the old story as a play for the school.
- They will dramatize the book as a film next month.
