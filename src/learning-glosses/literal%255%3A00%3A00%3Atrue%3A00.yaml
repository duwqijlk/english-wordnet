simpleMeaning: being true to the real, basic nature of something, or showing that nature
scope: This is being true to what something really is in its basic nature; actual, real and genuine are
  other names for this sense. Not the sense about using words with nothing added, and not a mistake in
  printed text.
examples:
- The book gives a literal picture of village life, showing how people really lived.
- His literal solitude in the hills was real and complete, not just a feeling.
