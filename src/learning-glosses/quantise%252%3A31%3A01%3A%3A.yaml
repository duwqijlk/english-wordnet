simpleMeaning: To turn a smooth signal into one that moves in set steps, each step holding one of a fixed
  list of values.
scope: Also called quantize; it turns a signal into set steps, not the use of quantum theory on a quantity.
examples:
- The engineer will quantise the voice signal before sending it.
- They quantise the smooth wave into a set of fixed levels.
