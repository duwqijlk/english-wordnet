senseId: 'galley%1:06:03::'
synsetId: 03417584-n
simpleMeaning: A large, single-decked medieval ship driven by sails and oars, with guns at each end; said
  to carry 1,000 men, it served mainly in the Mediterranean for war and trade.
scope: This is the large medieval vessel driven by sail and oar, not the ship's kitchen or the printer's
  proof that also carry this name. The guns at both ends belong to this ship, and the 1,000-strong crew
  is the figure the definition reports, not a standard size for every galley.
examples:
- The Venetian galley rowed out to meet the enemy, its oars beating the water.
- Pirates chased the trading galley across the Mediterranean.
