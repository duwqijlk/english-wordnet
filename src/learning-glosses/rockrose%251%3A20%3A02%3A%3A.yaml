simpleMeaning: any of many kinds of a plant with small, wide-open flowers, yellow, white or reddish in
  colour
scope: 'Also called a rock rose: any of many kinds of a plant with small, wide-open flowers, not a wild
  rose bush and not a garden rose.'
examples:
- Rockrose covered the dry bank with yellow flowers.
- The rockrose on the bank had small white flowers.
