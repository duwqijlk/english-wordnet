simpleMeaning: Wild or mean behaviour that makes other people uneasy or annoyed
scope: This is wild or mean behaviour that makes other people uneasy or annoyed; mischief, shenanigan,
  devilry, devilment, roguery, roguishness, mischief-making and mischievousness are other names for it,
  not a harmless joke and not an accident.
examples:
- The boys were sent home for their deviltry in the hall.
- His deviltry left the neighbours annoyed for days.
