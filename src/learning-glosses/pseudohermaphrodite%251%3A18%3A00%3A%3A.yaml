simpleMeaning: A person whose inner reproductive organs belong to the other sex, while the outer sex organs
  show one sex clearly at birth, is not a true hermaphrodite.
scope: A dated clinical label for a person with mismatched outer and inner sex organs, no longer the usual
  medical wording and not the same as a true hermaphrodite; the adjective sense describes the condition,
  not a person.
examples:
- Older medical texts described such patients as a pseudohermaphrodite.
- The term pseudohermaphrodite appears in case reports from the 1950s.
