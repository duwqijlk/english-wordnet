simpleMeaning: Using a plane's dials and gauges alone, because cloud or mist blocks the view.
scope: Using a plane's dials and gauges alone, because cloud or mist blocks the view; blind flying is
  another name for this sense, not flying in clear air and not flying with no dials at all.
examples:
- The pilot made a blind landing in thick cloud.
- Blind landing uses dials when cloud blocks the view.
