simpleMeaning: a rough raised part left on a piece after it has been cut or after a hole has been made
  in it
scope: A small rough raised part left after cutting or drilling, not the turning tool for smoothing rough
  edges and not a seed case with hooks or sharp points.
examples:
- He felt a sharp burr on the edge of the cut metal.
- She used sandpaper to take the burr off the drilled hole.
