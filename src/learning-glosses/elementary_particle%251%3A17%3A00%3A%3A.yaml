simpleMeaning: In physics, a bit of matter simpler than an atom, thought to be a building block of all
  matter.
scope: In physics, a bit simpler than an atom, also called a fundamental particle; not an atom and not
  a molecule.
examples:
- An elementary particle is simpler than an atom.
- Physicists study elementary particles to learn what matter is made of.
