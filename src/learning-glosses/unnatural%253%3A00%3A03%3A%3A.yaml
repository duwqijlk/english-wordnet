simpleMeaning: not normal, and not the way a thing usually is or the way things usually happen
scope: This means not normal or usual; not the sense about a thing that goes against nature, and not the
  sense about acting in a false way to make people notice you.
examples:
- An unnatural silence filled the house after midnight.
- She felt an unnatural tiredness that did not go away after rest.
