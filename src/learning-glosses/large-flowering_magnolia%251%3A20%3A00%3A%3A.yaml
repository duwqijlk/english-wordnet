simpleMeaning: A tree of the southern United States that keeps its leaves all year, with big stiff shiny
  leaves and huge white blooms that smell sweet.
scope: A tree of the southern United States that keeps its leaves all year, with big stiff shiny leaves
  and huge white blooms that smell sweet; bull bay and evergreen magnolia are other names for this sense,
  not a tree that loses its leaves in winter, and not a small shrub.
examples:
- A large-flowering magnolia stood by the old house.
- The large-flowering magnolia filled the garden with sweet scent.
