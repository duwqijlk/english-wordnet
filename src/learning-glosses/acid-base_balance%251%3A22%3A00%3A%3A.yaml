senseId: 'acid-base_balance%1:22:00::'
synsetId: 13447153-n
simpleMeaning: In physiology, the normal even state in the body between substances that make things sour
  and substances that take the sourness away
scope: Also called acid-base equilibrium; this is the normal even state between sour substances and their
  opposites in the body, not a test of the blood and not a loss of that even state.
examples:
- With a normal acid-base balance, her blood stayed slightly alkaline.
- The doctor checked his acid-base balance after the long illness.
