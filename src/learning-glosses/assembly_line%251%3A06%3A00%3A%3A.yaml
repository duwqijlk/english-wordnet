simpleMeaning: A moving system in a factory in which a product is carried past work points where one job
  after another is done on it
scope: A factory system in which a product moves past work points, also called a line; not a single workbench
  and not a warehouse.
examples:
- The car moved down the assembly line as workers fitted each part.
- On the assembly line, each worker does one job on the passing product.
