senseId: 'cosmography%1:09:00::'
synsetId: 06132733-n
simpleMeaning: Covering sky and earth both, and keeping clear of land study and star study, this study
  draws the broad shape of the universe
scope: This is a study of the whole universe in broad outline, taking in sky and earth, but it does not
  step into land study or star study.
examples:
- In his cosmography, he set out the broad shape of the universe.
- The old cosmography described both sky and earth.
