simpleMeaning: not following the law, what is right and wrong, or the way people usually act and expect
  others to act
scope: 'Also called unlawful and improper: this is about a person, act or way of living that does not
  follow the law, what is right, or the usual ways of people around them, not just a new or odd style.'
examples:
- Their unconventional marriage broke the rules of their church and town.
- He was fined for his unconventional way of running the bank.
