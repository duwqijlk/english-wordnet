simpleMeaning: A sea fish eaten as food, caught for sport, with dark stripes along its body, that swims
  upriver to spawn and is at times put in the fish group Morone.
scope: Also called rockfish, striped bass and striper; a sea fish with dark stripes that swims upriver
  to spawn, not a fish that lives only in fresh water.
examples:
- The Roccus saxatilis swims upriver to spawn.
- Roccus saxatilis is a food fish with dark stripes.
