simpleMeaning: made to come out or happen by something acting on it, after being hidden or not yet active
scope: 'Also called evoked: made to come out after being hidden or not yet active, not made by itself
  and not there in full from the start.'
examples:
- The elicited response came only after the doctor tapped the knee.
- An elicited change in the cells appeared after the light was turned on.
