simpleMeaning: In computer science, a device that sends small pieces of data between computer networks
scope: A device that sends data between computer networks, not a power tool for cutting wood and not a
  worker who sends goods on their way.
examples:
- The router in our home sends the internet to all our computers.
- If the router stops working, no computer in the office can get online.
