simpleMeaning: with a path around the sun that is farther from the sun than the path of the Earth
scope: About a planet whose path lies farther from the sun than Earth's; not about high rank, not about
  better quality, and not a person who beats others.
examples:
- Mars is a superior planet because its path lies beyond Earth's.
- Jupiter and Saturn are superior planets, farther from the sun than Earth.
