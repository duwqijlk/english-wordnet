simpleMeaning: The scientific study of plants and animals by watching them rather than by testing them,
  usually written up in popular magazines rather than in journals for experts.
scope: The study of plants and animals by watching them, not the study of rocks and earth, and not lab
  tests on living things.
examples:
- She reads natural history in popular magazines, not in academic journals.
- His natural history book describes plants and animals he watched.
