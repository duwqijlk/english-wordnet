simpleMeaning: France has the rich and powerful families, and Britain has the titled families, and this
  name marks them both.
scope: Also called the second estate, these are the rich and powerful families of France and the titled
  families of Britain, not the clergy who sit in the House of Lords.
examples:
- The Lords Temporal sat on one side of the chamber.
- Only the Lords Temporal could vote on that bill.
