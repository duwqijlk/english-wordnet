simpleMeaning: Burnt gases leave an engine's tube through this moving part and pass into the pipe that
  carries them away
scope: In an engine, this moving part controls when burnt gases pass from a tube into the pipe that carries
  them away.
examples:
- When the exhaust valve opens, burnt gases leave the cylinder and pass into the exhaust pipe.
- A stuck exhaust valve can keep burnt gases trapped inside the engine.
