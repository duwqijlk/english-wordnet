simpleMeaning: the way a person is, in that they do not keep things neat and in place and leave things
  in a mess
scope: 'Also called messiness: this is a person''s way of not keeping things neat, not just the state
  of a room or a place that is not neat at one time.'
examples:
- His untidiness drives his sister mad; he leaves clothes all over the floor.
- Her untidiness is well known, and her desk is always in a mess.
