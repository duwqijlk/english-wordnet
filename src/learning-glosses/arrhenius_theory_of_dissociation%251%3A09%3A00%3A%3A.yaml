simpleMeaning: 'In chemistry, an idea about acids and bases in water: acids split into hydrogen bits,
  bases into hydroxyl bits, and an acid and a base make salt and water.'
scope: Also called the theory of dissociation and the theory of electrolytic dissociation; it is about
  acids and bases in water, and about the salt and water they make together.
examples:
- The Arrhenius theory of dissociation explains how acids split in water.
- Students learn the Arrhenius theory of dissociation in chemistry class.
