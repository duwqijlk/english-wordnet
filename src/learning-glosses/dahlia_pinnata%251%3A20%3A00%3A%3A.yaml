simpleMeaning: Any of several plants of or bred from one kind, with swollen roots and showy rayed flower
  heads of many colours; from the mountains of Mexico, Central America, and Colombia.
scope: 'Also called dahlia: a garden plant, not a wild flower of Europe, and not a shrub.'
examples:
- Dahlia pinnata showed many-coloured heads in the garden.
- We grew Dahlia pinnata from swollen roots.
