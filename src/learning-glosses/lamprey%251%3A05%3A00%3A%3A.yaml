simpleMeaning: a simple kind of fish like an eel, living in fresh water or coming from the sea, with a
  round mouth that sucks and a rough tongue
scope: 'Also called lamper eel and lamprey eel: this fish is not a true eel.'
examples:
- A lamprey used its round mouth to hold onto a rock in the river.
- We saw a lamprey in the river, holding onto a stone with its mouth.
