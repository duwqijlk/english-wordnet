simpleMeaning: 'the right and left veins that drain the egg-making organs end in different places: the
  right in the belly''s main vein, the left in the left kidney vein'
scope: 'Also called ovarian vein: a vein that drains the egg-making organs, with the right and left sides
  ending in different veins, not an artery and not a vein of the leg.'
examples:
- Blood from the ovaries drains through the vena ovarica.
- The left vena ovarica joins the left renal vein.
