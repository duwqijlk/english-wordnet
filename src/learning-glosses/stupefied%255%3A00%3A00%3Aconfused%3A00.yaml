simpleMeaning: unable to think or feel clearly, with the mind dull and numb, especially after a shock
scope: 'Also called stupid, stunned, and dazed: unable to think clearly after a shock, not just struck
  without words by great surprise.'
examples:
- After the bad news, he sat stupefied and could not think at all.
- She was stupefied by the blow and stared without moving.
