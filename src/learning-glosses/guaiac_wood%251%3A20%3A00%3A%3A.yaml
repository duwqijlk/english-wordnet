simpleMeaning: The hard inner part of a palo santo tree, which gives a sweet-smelling oil used in scents
scope: This is the hard inner part of a palo santo tree that gives a sweet-smelling oil; guaiacum wood
  is another name for this sense, not the bark of the tree and not the whole tree.
examples:
- Guaiac wood gives an oil used in fine perfumes.
- The carpenter kept a piece of guaiac wood for its sweet smell.
