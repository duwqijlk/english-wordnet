simpleMeaning: post that is shut tight against being opened and read, made up of letters, picture cards,
  and parcels
scope: 'Also called first-class mail, 1st class, and 1st-class mail: post made up of letters, cards, and
  sealed packs, not the slower cheap post and not a parcel service.'
examples:
- He paid for first class so the birthday card would arrive quickly.
- First class post cannot be opened to check what is inside.
