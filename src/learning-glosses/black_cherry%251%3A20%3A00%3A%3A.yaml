scope: A large wild North American tree with round dark sour fruit that can be eaten; black cherry tree
  is another name for this sense, not a small garden tree with sweet fruit and not a tree with red fruit.
examples:
- Black cherry trees lined the old road.
- Birds ate the black cherry fruit before it ripened.
