simpleMeaning: a form of the sugar glucose, found in honey and in sweet fruit
scope: This is a kind of sugar found in honey and sweet fruit; dextrose and grape sugar are other names
  for this sense, not table sugar and not the sugar found in milk.
examples:
- Dextroglucose gives honey much of its sweetness.
- The ripe grapes were full of dextroglucose.
