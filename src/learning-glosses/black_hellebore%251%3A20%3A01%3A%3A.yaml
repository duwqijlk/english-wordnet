simpleMeaning: A European plant that keeps its leaves all year, with white or purplish flowers like roses
  that bloom in winter.
scope: A European plant that keeps its leaves all year, with white or purplish flowers like roses that
  bloom in winter; not the slightly hairy plant with deep green leathery leaves and flowers that turn
  purplish-green, and not a plant that blooms in summer.
examples:
- Black hellebore flowers in the snow of January.
- She planted black hellebore under the beech tree.
