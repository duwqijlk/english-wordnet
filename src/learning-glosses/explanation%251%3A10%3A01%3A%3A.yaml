simpleMeaning: the act of making a thing plain and easy to take in by telling about it
scope: The act of making a thing plain and easy to take in by telling about it, not the words themselves
  but the act of telling.
examples:
- Her explanation of the rule took only a minute.
- His explanation of the plan won them over.
