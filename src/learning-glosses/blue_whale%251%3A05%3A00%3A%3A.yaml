simpleMeaning: The biggest mammal ever known, a steel-grey whale that travels far and strains food through
  long plates in its mouth, mostly of the Southern Hemisphere.
scope: This biggest mammal ever known, a steel-grey whale that travels far, is also called sulfur bottom.
examples:
- A blue whale crossed the Southern Ocean on its long journey south.
- We watched a blue whale strain food through the long plates in its mouth.
