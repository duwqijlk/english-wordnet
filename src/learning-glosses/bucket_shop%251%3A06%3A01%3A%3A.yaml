simpleMeaning: in former times, a cheap drinking place that sold strong drink by the pail
scope: A cheap drinking place of former times that sold strong drink by the pail, not a firm that sells
  shares and not an ordinary bar.
examples:
- The old bucket shop sold whisky by the bucket to thirsty workers.
- He spent the evening in a bucket shop near the docks.
