simpleMeaning: paint with a water base, applied in one light layer
scope: This is the thin layer of water-based paint itself, not the verb of applying such a layer, not
  a watercolour picture built from many layers, and not a load of clothes for cleaning.
examples:
- A quick wash of white paint hid the old graffiti.
- The wall needs a second wash of pale blue.
