simpleMeaning: a person who walks with long, stiff steps
scope: A person who walks with long, stiff steps; not a person who follows someone in secret to harm them,
  and not a hunter who follows game.
examples:
- The tall stalker crossed the yard in a few strides.
- He walked like a stalker, stiff and straight, through the hall.
