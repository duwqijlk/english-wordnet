simpleMeaning: so clearly bad that everyone can see it, and bad in a way that shocks people and should
  bring strong blame
scope: 'Also called crying, rank, and gross: very clearly bad and deserving strong blame; it is not bright
  light that hurts the eyes, and not looking at someone angrily.'
examples:
- Leaving the child alone was a glaring mistake.
- There was a glaring error in the report that anyone could see.
