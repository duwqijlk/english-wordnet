simpleMeaning: a search for a different choice that fits the needs and ideas a person has in mind
scope: 'Also called quest: this is a search for a different choice that fits the needs and ideas a person
  has in mind; quest is another name for this sense. Not chasing someone to catch them and not a pleasant
  activity that fills your time.'
examples:
- His pursuit of love led him to change his life.
- Her pursuit of a better job took many months.
