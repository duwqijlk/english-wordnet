simpleMeaning: A formal decision passed by both houses of Congress, which becomes law when signed by the
  head of the country, or when passed again over the head's refusal to sign.
scope: A formal decision passed by both houses of Congress that becomes law when signed by the head of
  the country, not a decision of one house only and not a law made by a court.
examples:
- Congress passed a joint resolution to fund the project.
- The joint resolution became law after the President signed it.
