simpleMeaning: A low, spreading shrub of eastern North America. It has white bell-shaped flowers, shiny
  fragrant leaves, and a spicy red fruit, and is the source of a fragrant oil.
scope: Another name for the low eastern North American wintergreen shrub, not the spicy red berry it bears.
  It is also not the separate small shrub with scarlet flowers and cranberry-like fruit that is likewise
  called ground-berry. Checkerberry, creeping wintergreen and mountain tea are other names for this plant.
examples:
- Ground-berry spread over the mossy ground beneath the trees.
- The white bell-shaped flowers of ground-berry are easy to spot in spring.
