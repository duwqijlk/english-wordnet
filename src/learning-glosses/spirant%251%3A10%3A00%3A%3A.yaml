simpleMeaning: In speech, a sound made by breath moving past a narrow place in the throat and mouth
scope: In speech, a sound made by breath moving past a narrow place in the throat and mouth; fricative
  and fricative consonant are other names for this sense, not a sound made by stopping the breath and
  not a vowel.
examples:
- The spirant sound is made by breath moving past a narrow place.
- A spirant like 'f' comes from breath pushed through a narrow gap.
