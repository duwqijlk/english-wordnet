simpleMeaning: The other side looks for small signs that give things away; these moves wipe them out,
  or put false signs in their place.
scope: Also called electronic manipulative deception, these are moves that keep the other side from reading
  true signs, or feed it false ones.
examples:
- Manipulative electronic deception hides the signs that would give a force away.
- They used manipulative electronic deception to make the enemy look the wrong way.
