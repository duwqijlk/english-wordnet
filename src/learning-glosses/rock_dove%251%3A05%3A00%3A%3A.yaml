simpleMeaning: Wings marked with black stripes set apart this pale grey pigeon from Europe and Asia, the
  bird from which most tame kinds come.
scope: Also called rock pigeon, this pale grey pigeon from Europe and Asia has wings marked with black
  stripes, and most tame kinds come from it.
examples:
- We saw a rock dove on the cliff path.
- The rock dove flew off when we came near.
