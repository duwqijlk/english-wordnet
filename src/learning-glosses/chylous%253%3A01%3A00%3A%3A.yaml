simpleMeaning: made of chyle, the milky fluid made in the gut when food is digested, or like that fluid
scope: This is a word for something made of or like chyle, the milky fluid made in the gut when food is
  digested; chylaceous is another name for this sense, not the fluid itself and not blood.
examples:
- The chylous fluid in the tube looked milky.
- A chylous leak after surgery meant the milky fluid had escaped.
