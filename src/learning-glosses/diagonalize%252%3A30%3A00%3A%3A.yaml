simpleMeaning: to change a table of numbers so that values sit only on the line from the top left to the
  bottom right
scope: To change a table of numbers into that form, also called diagonalise; not merely to be able to
  change it, and not to work with a table that already has that form.
examples:
- He diagonalized the matrix to make the sums easy.
- The program can diagonalize a large table of numbers in seconds.
