senseId: 'hypothrombinemia%1:26:00::'
synsetId: 14218172-n
simpleMeaning: Too little prothrombin, factor II, in the flowing blood, giving slow clotting and weak
  clot making and sometimes too much bleeding, which can come from too little vitamin K.
scope: 'A blood condition in medicine: low prothrombin, often from too little vitamin K.'
examples:
- Hypothrombinemia gives slow clotting.
- Hypothrombinemia can come from too little vitamin K.
