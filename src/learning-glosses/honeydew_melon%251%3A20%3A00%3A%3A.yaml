simpleMeaning: With no strong musky smell, this smooth pale-skinned fruit has white or pale green flesh
  inside, one of many kinds of vine fruit
scope: Also called winter melon and winter melon vine, this is a vine with smooth pale-skinned fruit,
  not a muskmelon with a strong smell.
examples:
- He cut the honeydew melon into cubes for the fruit salad.
- The honeydew melon had pale green flesh and a smooth white rind.
