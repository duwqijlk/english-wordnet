simpleMeaning: a piece of real or made hair worn on the head to hide who you are or to make you look nice
scope: Also called hairpiece and false hair, this is a piece of hair worn to hide who you are or to look
  nice, not your own hair and not a hat.
examples:
- She wore a postiche to hide her short hair at the fancy dress party.
- The actor put on a postiche to look older for the play.
