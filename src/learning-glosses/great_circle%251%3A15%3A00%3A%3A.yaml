simpleMeaning: A line that runs round a ball, made where a flat cut through the middle of the ball meets
  its outside
scope: A line round a ball made by a cut through its middle, not a small ring on the ball and not a straight
  line across it.
examples:
- The equator is a great circle of the earth.
- Pilots fly along a great circle to take the shortest route.
