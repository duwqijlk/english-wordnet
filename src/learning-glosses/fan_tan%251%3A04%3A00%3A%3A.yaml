simpleMeaning: In this Chinese gambling game, players bet on how many pieces are left, 0, 1, 2, or 3,
  after any number are put under a bowl and counted in fours.
scope: Also called fantan, this Chinese gambling game puts any number of pieces under a bowl, and players
  bet on how many are left after counting in fours.
examples:
- In fan tan, the players bet on how many counters are left under the bowl.
- At fan tan, she bet that two counters would be left after the count in fours.
