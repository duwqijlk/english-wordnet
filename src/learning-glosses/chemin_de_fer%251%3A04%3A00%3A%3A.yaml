simpleMeaning: a card game played in casinos where two or more people bet against the banker, and the
  one who holds two or three cards adding up closest to nine wins
scope: A card game played in casinos where people bet against the banker; baccarat is another name for
  this sense, not a game played against other players and not a slot machine.
examples:
- They played chemin de fer at the casino.
- Chemin de fer needs a banker and two or more players.
