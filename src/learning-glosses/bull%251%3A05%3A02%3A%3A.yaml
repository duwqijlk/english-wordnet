simpleMeaning: a fully grown male of some kinds of mammals whose female is called a cow, such as whales
  or elephants, and especially cattle
scope: A fully grown male animal, not the pope's formal paper and not a person who buys hoping prices
  will rise.
examples:
- The farmer kept a large bull in the field with the cows.
- A male elephant is called a bull.
