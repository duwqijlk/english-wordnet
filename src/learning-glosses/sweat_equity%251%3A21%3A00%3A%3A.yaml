schema: oewn-learning-gloss-v2
senseId: 'sweat_equity%1:21:00::'
synsetId: 13354561-n
simpleMeaning: a share in a building that a person who rents it earns by helping to fix it up or keep
  it in good shape
scope: This is a share in a building earned by a tenant's work on it, not money paid to buy it and not
  wages for work done elsewhere.
examples:
- He earned sweat equity by repainting the flats he rented.
- Her sweat equity gave her a small share in the old house.
