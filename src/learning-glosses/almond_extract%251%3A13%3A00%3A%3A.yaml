simpleMeaning: a liquid made by soaking nuts in strong drink, used to give food the taste of those nuts
scope: This is a liquid used to give food the taste of nuts, and not the nuts themselves or a drink to
  be drunk on its own.
examples:
- Add a few drops of almond extract to the cake batter.
- The almond extract gave the cookies a warm, nutty taste.
