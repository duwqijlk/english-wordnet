scope: 'Also called Phoradendron flavescens or Phoradendron serotinum: the Christmas plant of America,
  growing on trees that lose their leaves and able to badly weaken the tree it grows on, set apart from
  the small herb of the same name by its Christmas use and its tree home.'
examples:
- American mistletoe hung above the doorway at Christmas.
- We hung American mistletoe in the hall.
