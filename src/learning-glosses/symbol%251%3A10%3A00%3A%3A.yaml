simpleMeaning: A written or printed mark that stands for something only because people have agreed that
  it does, not because it looks like it
scope: A written or printed mark agreed to stand for something, not a visible thing that stands for an
  unseen idea.
examples:
- In maths, the sign + is a symbol that stands for adding.
- The symbol $ stands for dollars because people have agreed that it does.
