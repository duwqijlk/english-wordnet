simpleMeaning: A heart defect from birth causing blue skin, with a narrowed lung valve, a hole between
  the lower heart chambers, the aorta over both chambers, and a thickened right chamber.
scope: Also called Fallot's syndrome and tetralogy of Fallot; a heart defect from birth, not a heart defect
  from infection and not a heart defect of old age.
examples:
- Fallot's tetralogy was found in the newborn baby.
- Children with Fallot's tetralogy often have blue skin.
