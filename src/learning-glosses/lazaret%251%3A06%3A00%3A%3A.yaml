simpleMeaning: Care is given here to people with a sickness that can spread to others, most often leprosy
scope: 'Also called lazar house, lazarette, lazaretto and pesthouse: a place where sick people are kept
  apart, not an ordinary hospital and not a place for people who are hurt.'
examples:
- The sick man was sent to the lazaret on the edge of town.
- No one could leave the lazaret until the fever had passed.
