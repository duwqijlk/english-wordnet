simpleMeaning: finding where something is by measuring how long a sound takes to reach it and come back
scope: This is finding where a thing is by a sound that comes back, not by looking at it and not by using
  light.
examples:
- Bats use echolocation to find insects in the dark.
- Dolphins find fish by echolocation, sending out sounds and listening for them to come back.
