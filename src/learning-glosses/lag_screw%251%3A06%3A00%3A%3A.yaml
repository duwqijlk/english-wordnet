simpleMeaning: With a square or six-sided head, this heavy fastener for wood is turned in with a wrench
scope: Also called lag bolt, this is a heavy fastener for wood with a square or six-sided head, turned
  in with a wrench, not a nail and not a light screw for thin wood.
examples:
- She tightened the lag screw with a wrench.
- Use a lag screw where a nail would pull out.
