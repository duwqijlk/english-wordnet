simpleMeaning: a work, above all a film, play, recording or book, that does very well, is liked by very
  many people, and sells in very large numbers
scope: A work, above all a film, play, recording or book, that does very well and is liked by very many
  people, also called blockbuster and megahit; not a small success, and not a work that only a few people
  like.
examples:
- The new film was a smash hit and sold out for weeks.
- Her first novel became a smash hit around the world.
