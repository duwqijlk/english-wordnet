simpleMeaning: a sharp, loud cry from a person that cuts through other sounds
scope: A person's own sharp, piercing cry; scream, shriek, screech, shrieking and screeching are other
  names for this sense. Not the high noise of brakes, wind or machinery that only resembles a person's
  voice.
examples:
- Her screaming brought the neighbours running.
- The screaming from the next room told us something was badly wrong.
