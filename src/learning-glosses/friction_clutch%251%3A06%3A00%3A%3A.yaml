simpleMeaning: A device where one part makes another part turn by rubbing against it
scope: This is a device where parts turn each other by rubbing, not a device where toothed parts lock
  together and not a brake.
examples:
- The mechanic replaced the worn friction clutch.
- A slipping friction clutch makes the car lose power.
