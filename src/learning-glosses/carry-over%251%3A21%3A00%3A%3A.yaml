simpleMeaning: A firm keeps some of its built-up gains whole after setting money aside for payouts to
  its owners and for reserves
scope: Also called carry-forward, this is the money a firm keeps whole after setting some aside for payouts
  to its owners and for reserves, not money already paid out to them.
examples:
- The carry-over stayed in the firm's accounts.
- The firm kept the carry-over in its accounts.
