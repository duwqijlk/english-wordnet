simpleMeaning: A single number that stands for a set of numbers, got by taking the n-th root of the numbers
  times each other.
scope: This is a single number that stands for a set of numbers, got by taking the n-th root of the numbers
  times each other, not the sum of the numbers cut by how many there are and not the number in the middle
  of a list.
examples:
- The geometric mean of 4 and 9 is 6.
- Use a geometric mean when numbers grow by multiplying.
