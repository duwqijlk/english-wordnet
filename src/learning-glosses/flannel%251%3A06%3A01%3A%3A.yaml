simpleMeaning: a piece of cloth used in the bath to wash the face and body
scope: A washcloth for the face and body; not the soft wool cloth itself and not the trousers called flannels.
examples:
- She wrung out the flannel and wiped the baby's face.
- He hung the damp flannel over the side of the bath.
