simpleMeaning: A runny fat from some plant oils, with many loose links in its chain, one the body needs
  and must get from food.
scope: A plant-oil fat the body must get from food, not a fat the body can make itself.
examples:
- Flaxseed oil is rich in linolenic acid.
- The body cannot make linolenic acid, so we must get it from food.
