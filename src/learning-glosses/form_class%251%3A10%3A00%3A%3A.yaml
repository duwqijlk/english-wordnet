simpleMeaning: One of the old groups of words, such as nouns or verbs, that show what job a word does
  in a sentence.
scope: One of the old word groups, such as nouns or verbs; part of speech is another name for this sense,
  not a single word and not a rule about word order.
examples:
- Nouns make up one form class in English grammar.
- In her lesson, she asked the pupils to name each form class.
