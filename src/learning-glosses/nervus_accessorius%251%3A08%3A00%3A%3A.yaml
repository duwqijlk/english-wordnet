simpleMeaning: A cord that starts as two sets of roots, one from the head and one from the spine, which
  join to form it.
scope: A cord that starts as two sets of roots, one from the head and one from the spine, also called
  accessory nerve, eleventh cranial nerve and spinal accessory; not a cord that starts from one root alone
  and not a cord of the arm.
examples:
- The nervus accessorius forms when its head and spine roots join.
- The doctor traced the nervus accessorius back to its two sets of roots.
