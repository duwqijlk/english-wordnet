simpleMeaning: the work of talking with others to reach an agreement, and reaching that agreement in the
  end
scope: Talks between sides to reach an agreement, not a fight and not a choice made by one side alone.
examples:
- The negotiation between the workers and the company lasted for weeks.
- After long negotiation, the two sides reached an agreement.
