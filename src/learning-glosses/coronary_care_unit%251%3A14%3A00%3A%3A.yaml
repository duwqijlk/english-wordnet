simpleMeaning: a part of a hospital with special staff and tools to look after people with bad heart trouble
scope: A part of a hospital, not the heart trouble itself and not a general ward.
examples:
- After the heart attack, he was moved to the coronary care unit.
- The coronary care unit has nurses on watch all day and night.
