simpleMeaning: a part that can swing and fits into a gap on a toothed wheel to push it forward or stop
  it moving back
scope: Also called dog. This swinging part on a toothed wheel is not the press on a mouse button and not
  a speech sound.
examples:
- The metal click fitted into the notch and held the wheel so it could not turn back.
- He lifted the click so the wheel could move backwards again.
