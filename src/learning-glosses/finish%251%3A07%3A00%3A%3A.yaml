simpleMeaning: the decorative look or feel of a surface, or the material that gives a surface that look
  or feel.
scope: This is not the end of an activity, and it is not great quality of work; it is the surface's look
  or feel.
examples:
- The table has a glossy finish.
- The paint gives the wall a smooth finish.
