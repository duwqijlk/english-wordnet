simpleMeaning: The clothes worn by soldiers of the American Army, made from cloth of a dull green-brown
  colour
scope: The clothes worn by soldiers of the American Army, also called olive drab; not the colour itself
  and not the clothes of another army.
examples:
- He wore his olive-drab uniform to the parade.
- The olive-drab uniform was made from dull green-brown cloth.
