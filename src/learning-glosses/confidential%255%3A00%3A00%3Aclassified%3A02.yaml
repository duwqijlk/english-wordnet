simpleMeaning: the middle grade given to official papers, above restricted and below secret, that only
  people allowed to see such papers may read
scope: A grade for official papers kept from most people, not a private secret shared in trust and not
  a close personal matter.
examples:
- The confidential papers stayed in the locked drawer.
- Only senior staff may read confidential reports.
