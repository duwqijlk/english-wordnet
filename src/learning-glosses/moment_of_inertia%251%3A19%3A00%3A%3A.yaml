simpleMeaning: How much a thing holds back from a change in how fast it turns
scope: How much a thing holds back from a change in how fast it turns, not its weight and not how fast
  it is already turning.
examples:
- The moment of inertia of the flywheel keeps it turning steadily.
- A heavy wheel has a large moment of inertia.
