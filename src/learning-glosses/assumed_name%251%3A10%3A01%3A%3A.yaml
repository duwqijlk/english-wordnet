simpleMeaning: In law, the words a company uses in its business that are not the words on its legal papers
scope: 'Also called fictitious name: the trading words of a company, not the words on its legal papers
  and not a made-up name used by a person.'
examples:
- The firm traded under an assumed name that was shorter than its legal title.
- The assumed name was on the shop front, while the legal words were on the papers.
