simpleMeaning: In genetics, the cell with two sets of genes formed when a male sex cell joins a female
  egg cell, including the living thing that grows from that cell.
scope: Also called a fertilized ovum, it is the cell with two sets of genes formed when a male sex cell
  joins a female egg cell.
examples:
- The zygote divides again and again as it grows.
- A zygote forms when a sperm cell joins an egg cell.
