simpleMeaning: a person who seeks to undo the changes made by an earlier revolution
scope: A person who seeks to undo the changes made by an earlier revolution, also called counter-revolutionist
  and counterrevolutionary, not a person who made the first revolution and not a person who defends it.
examples:
- The counterrevolutionist worked to bring back the old order.
- Counterrevolutionists plotted to undo the reforms of the revolution.
