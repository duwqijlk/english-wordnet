senseId: 'decree_nisi%1:10:00::'
synsetId: 06552693-n
simpleMeaning: a court order given after a first request for divorce, which later becomes final
scope: A court order that starts a divorce and later becomes final, not the final divorce order itself
  and not a court order about money.
examples:
- The judge granted a decree nisi after hearing the first divorce petition.
- Their decree nisi will become absolute in six weeks.
