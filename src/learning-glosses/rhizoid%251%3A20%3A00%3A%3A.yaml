simpleMeaning: In mosses, ferns, and fungi, and the like, thin threads of many kinds do the work of roots.
scope: These thin threads do the work of roots in mosses, ferns, and fungi, and the like, but they are
  not roots themselves.
examples:
- The rhizoid worked like a root for the moss.
- These rhizoids worked like roots for the fern.
