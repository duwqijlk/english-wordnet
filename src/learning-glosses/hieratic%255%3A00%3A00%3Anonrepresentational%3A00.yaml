simpleMeaning: Holding to set types and ways, stiff and formal.
scope: This sense is holding to set types and ways, stiff and formal, unlike the sense for a flowing form
  of Egyptian picture-writing, used especially by the priests, and unlike the sense for being writ in
  the flowing hand of old Egypt.
examples:
- The art was hieratic, holding to set types.
- The style was hieratic, stiff and formal.
