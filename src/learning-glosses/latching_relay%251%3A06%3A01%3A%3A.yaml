senseId: 'latching_relay%1:06:01::'
synsetId: 92463799-n
simpleMeaning: Either of its two settings is held by this switch, even when the wire that moves it gets
  no power
scope: 'Also called bistable relay, impulse relay and keep relay: a switch that holds either position
  on its own, not a switch that needs power to stay in place.'
examples:
- The latching relay kept the lights on after the power to the coil was cut.
- A latching relay lets the lights be switched from far away without a constant hum.
