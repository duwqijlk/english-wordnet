simpleMeaning: a young person who helps at formal events such as weddings or government ceremonies.
scope: It is not a sheet in a book or a call over a loudspeaker; it means the young helper at a ceremony.
examples:
- The bride's nephew was a page and carried the rings.
- A page showed the guests to their seats at the official dinner.
