simpleMeaning: a man who has had his testicles (the two small round parts that help a man make children)
  cut off, so he cannot have children
scope: 'Also called eunuch: this word names the man himself, not the act of cutting off those parts and
  not the act of cutting parts from a book or film.'
examples:
- In the old court, a castrate was trusted to guard the women's rooms.
- The story tells of a castrate who served the king for many years.
