senseId: 'mature-onset_diabetes%1:26:00::'
synsetId: 14142418-n
simpleMeaning: A mild blood-sugar disease that develops slowly in adults; obesity, stress, menopause or
  other factors can trigger it; diet and blood-sugar-lowering drugs (hypoglycemic agents) usually control
  it without insulin.
scope: This is an old name for type 2 diabetes, once seen as a mild disease of later life; it is not type
  1 diabetes, which can start at any age and needs insulin, nor the form tied to pregnancy.
examples:
- Grandma called her condition mature-onset diabetes and said she could manage it with diet.
- Mature-onset diabetes was once described as a mild ailment of later life.
