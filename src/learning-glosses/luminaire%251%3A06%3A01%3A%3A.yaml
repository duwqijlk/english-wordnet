simpleMeaning: With a body and a socket that holds its bulb so the bulb can be changed, this mains-powered
  fitting makes man-made light.
scope: Also called a light fitting and a light fixture, it is a mains-powered fitting with a body and
  a socket for its bulb.
examples:
- The luminaire lit the room.
- She changed the bulb in the luminaire.
