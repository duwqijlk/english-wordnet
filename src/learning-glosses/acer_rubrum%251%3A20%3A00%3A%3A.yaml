simpleMeaning: A maple tree of eastern and central America, its five-part leaves turning scarlet and yellow
  in autumn.
scope: 'Also called red maple, scarlet maple and swamp maple: a maple of eastern and central America with
  five-part leaves that turn scarlet and yellow in autumn, not a maple of western America.'
examples:
- Acer rubrum turns scarlet in the fall.
- The five-part leaves of Acer rubrum glow yellow and scarlet in autumn.
