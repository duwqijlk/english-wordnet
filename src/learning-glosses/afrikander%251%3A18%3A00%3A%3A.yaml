simpleMeaning: A white person born in Cape Province, come down from Dutch settlers, who speaks the tongue
  that grew from Dutch
scope: A Cape Province person of Dutch settler stock who speaks Afrikaans, also called Afrikaner and Boer;
  not a white person of another land.
examples:
- An Afrikander from Cape Province spoke Afrikaans.
- The Afrikander traced his family back to Dutch settlers.
