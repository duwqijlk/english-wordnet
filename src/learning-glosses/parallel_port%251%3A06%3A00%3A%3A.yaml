simpleMeaning: a link between a computer and a printer through which the computer sends many bits of data
  to the printer at the same time
scope: A link between a computer and a printer through which the computer sends many bits of data to the
  printer at the same time; parallel interface is another name for this sense, and it is not a link that
  sends bits one by one or a link between two computers.
examples:
- The printer was joined to the computer by a parallel port.
- A parallel port sends many bits at once.
