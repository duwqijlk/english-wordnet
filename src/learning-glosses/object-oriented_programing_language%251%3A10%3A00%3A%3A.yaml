simpleMeaning: In computer science, a way of writing programs that lets the writer join a set of steps
  to each kind of store of facts
scope: In computer science, a way of writing programs that lets the writer join a set of steps to each
  kind of store of facts, with object-oriented programming language as another name for this sense; not
  a way of writing plain lists of steps, and not a machine code.
examples:
- C++ is an object-oriented programing language used for big programs.
- She learned an object-oriented programing language at school.
