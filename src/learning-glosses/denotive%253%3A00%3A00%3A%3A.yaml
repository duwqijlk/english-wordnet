simpleMeaning: Says a thing by its name in words so plain and direct that the thing is clear at once
scope: A word or sign that names a thing straight out, also called denotative; not a word that only hints
  at a thing or only says what it is like.
examples:
- The word 'dog' is denotive when it names the animal straight out.
- A denotive label on the jar names what is inside in plain words.
