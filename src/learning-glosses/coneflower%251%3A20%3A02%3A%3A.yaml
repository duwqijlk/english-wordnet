simpleMeaning: Any of several plants of the group Rudbeckia, grown for their large, mostly yellow blooms
  with a high middle that rises to a point
scope: Any of several plants of the group Rudbeckia grown for large yellow blooms, not a daisy with a
  flat middle and not a plant grown for its leaves.
examples:
- Coneflowers filled the border with yellow blooms.
- She planted coneflower beside the path for its tall yellow heads.
