simpleMeaning: known as the juniper of the Old Testament, this desert shrub of Syria and Arabia bears
  small white flowers and is sometimes put in the plant group Genista
scope: Also called juniper, a juniper bush, and raetam; not the common juniper of cold lands.
examples:
- The retem grows in the dry lands of Syria and Arabia.
- Old Testament writers knew the retem as a desert shrub.
