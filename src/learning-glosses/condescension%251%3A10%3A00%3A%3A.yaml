schema: oewn-learning-gloss-v2
senseId: 'condescension%1:10:00::'
synsetId: 06732153-n
simpleMeaning: a message from one person to another that shows no respect, because it treats the other
  person as less clever or less important
scope: 'Also called disdain and patronage: a message that shows no respect, not a lasting proud way of
  acting and not kind talk to people below you.'
examples:
- His words were full of condescension, as if I knew nothing at all.
- She spoke with condescension when she explained the easy job very slowly.
