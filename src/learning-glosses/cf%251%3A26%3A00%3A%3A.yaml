simpleMeaning: 'The most common illness passed down in families: a child''s lungs, gut and pancreas get
  blocked with thick mucus, from a fault in one gene, and no cure is known'
scope: This illness is also called cystic fibrosis, fibrocystic disease of the pancreas, mucoviscidosis
  and pancreatic fibrosis; it is not asthma and not another illness of the lungs.
examples:
- CF affects the lungs and the gut.
- Children with CF need daily care for their breathing.
