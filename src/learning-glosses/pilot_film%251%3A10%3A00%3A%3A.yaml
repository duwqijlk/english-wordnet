simpleMeaning: To win backing for a planned set of shows, one show is made first as a sample of the rest
scope: 'Also called a pilot or a pilot program: one show made first as a sample of a planned set, not
  one show in a set already on the air.'
examples:
- The network made a pilot film to see if people liked the new show.
- A pilot film was shown to sponsors before the series was made.
