simpleMeaning: Under metal tooth caps and fillings, dentists spread this old, widely used sticky mix to
  hold them fast for good and to make a firm base.
scope: 'Another name for this sense is zinc phosphate cement: the old sticky mix that fixes metal tooth
  caps and fillings and serves as a base under tooth work.'
examples:
- The dentist mixed zinc phosphate dental cement before seating the crown.
- Zinc phosphate dental cement is still used as a base under metal fillings.
