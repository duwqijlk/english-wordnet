simpleMeaning: the act of taking armed forces away from one place and moving them to other places to try
  to use them in a better way
scope: This is about moving armed forces to new places so they can be used in a better way, not taking
  them out of service for good and not sending them out for the first time.
examples:
- The army's redeployment moved the soldiers to the border.
- After the redeployment, the troops were in places where they were needed more.
