simpleMeaning: clothes usually worn by a person who rides a horse, especially clothes worn by a woman
scope: These are clothes for riding a horse, not a way of acting and not the special clothes worn in a
  religious group.
examples:
- She wore a dark riding habit for the horse show.
- The woman's habit had a long skirt made for riding.
