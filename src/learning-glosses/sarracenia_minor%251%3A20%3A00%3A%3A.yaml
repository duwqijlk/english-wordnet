simpleMeaning: A yellow-flowered pitcher plant of the south-eastern United States with trumpet-shaped
  leaves whose opening is covered by an arched hood.
scope: Also called a hooded pitcher plant; a yellow-flowered plant of the south-eastern United States,
  not a plant with open cup leaves and not a flower of the north.
examples:
- The Sarracenia minor grows in the south-eastern United States.
- Sarracenia minor has trumpet-shaped leaves with a hooded opening.
