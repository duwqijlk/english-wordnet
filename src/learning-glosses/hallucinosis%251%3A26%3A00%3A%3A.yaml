simpleMeaning: A state of mind in which a person keeps seeing or hearing things that are not there
scope: This is a state of mind with things seen or heard that are not there, not a dream and not a short
  moment of confusion.
examples:
- Hallucinosis left him hearing voices through the night.
- The doctor said the hallucinosis would pass with rest.
