simpleMeaning: One yellow flower with brown or purple marks and spots inside grows on this dogtooth of
  eastern North America.
scope: Also called amberbell and yellow adder's tongue, this is the dogtooth of eastern North America
  with one yellow flower.
examples:
- We picked out the trout lily by its one yellow flower.
- Its yellow flower, marked with purple, made the trout lily easy to spot.
