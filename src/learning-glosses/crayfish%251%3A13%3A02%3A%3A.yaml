simpleMeaning: Lobsters without claws that live in warm water; the ones from Australia and South Africa
  are usually sold as frozen tails, and they are also caught in Florida and California.
scope: Warm-water lobsters without claws, also called langouste, rock lobster, or spiny lobster, not the
  large spiny-shelled sea kind, nor the small freshwater kind, nor the tiny kind boiled briefly.
examples:
- Crayfish tails were on the menu that night.
- The fishermen brought in crayfish from the warm bay.
