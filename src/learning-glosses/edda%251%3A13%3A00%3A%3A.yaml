simpleMeaning: a thick, starchy root that grows underground in warm lands
scope: 'Also called cocoyam, dasheen and taro: a thick, starchy root that grows underground in warm lands,
  not a potato and not a root from cold lands.'
examples:
- She dug an edda out of the soft ground and carried it home in a basket.
- The edda grew thick and starchy in the warm, wet soil.
