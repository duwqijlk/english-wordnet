simpleMeaning: The people of Greece in old times who lived in Achaea
scope: 'Another name for this sense is Arcado-Cyprians: the ancient Greek people who lived in Achaea,
  not the word used to describe things from Achaea, and not a member of one of the four language groups
  of the prehistoric Greeks.'
examples:
- The Achaeans lived in the north-west of Greece in old times.
- An Achaean lived in a town on the coast of Achaea.
