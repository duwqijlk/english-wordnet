senseId: 'xerophthalmia%1:26:00::'
synsetId: 14561715-n
simpleMeaning: The eyes grow unusually dry in their thin cover and clear front, which may come from too
  little vitamin A in the whole body
scope: Also called conjunctivitis arida, xeroma and xerophthalmus, this is the unusual dryness of the
  thin cover and the clear front of the eyes, which may come from too little vitamin A in the whole body.
examples:
- The eyes grow unusually dry in xerophthalmia.
- The thin cover of the eyes grows dry in xerophthalmia.
