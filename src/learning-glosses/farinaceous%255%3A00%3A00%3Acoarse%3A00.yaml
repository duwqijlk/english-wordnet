senseId: farinaceous%5:00:00:coarse:00
synsetId: 02239247-s
simpleMeaning: made of, or covered with, small bits that feel like ground grain
scope: This describes a thing made of or covered with grain-like bits; gritty, grainy, granular, mealy,
  coarse-grained and granulose are other names for this sense; not smooth and not made of one solid piece.
examples:
- The farinaceous powder felt like fine meal between the fingers.
- Its farinaceous coating left a grainy feel on the skin.
