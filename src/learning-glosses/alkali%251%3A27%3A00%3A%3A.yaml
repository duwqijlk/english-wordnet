simpleMeaning: With an acid, one of these water-soluble chemicals makes a salt and water, and it turns
  litmus dye blue
scope: This chemical is also called a base, and it is not the salts found in dry soils and water that
  harm crops.
examples:
- The alkali turned the litmus dye blue.
- They added an alkali to the acid to make a salt and water.
