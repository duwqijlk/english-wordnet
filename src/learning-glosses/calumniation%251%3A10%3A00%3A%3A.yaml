simpleMeaning: a false charge that someone did wrong, or a mean and untrue account of what someone said
  or did
scope: A false charge that someone did wrong, or a mean and untrue account of what someone said or did;
  calumny, defamation, hatchet job, obloquy and traducement are other names for this sense, not a true
  charge and not fair criticism.
examples:
- His calumniation of the mayor was proved false in court.
- The newspaper refused to print such a calumniation.
