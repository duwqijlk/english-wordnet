senseId: lightheaded%5:00:00:frivolous:00
synsetId: 02128108-s
simpleMeaning: Not serious, and too ready to laugh and play instead of thinking in a careful way
scope: Silly, dizzy and giddy are other names for this sense; this is about a person who will not take
  things seriously, not about feeling faint or unsteady in the head.
examples:
- Lightheaded teenagers laughed through the whole lesson.
- She gave a lightheaded giggle and waved the question away.
