simpleMeaning: A plant of southern California that lives for one year, with stems that branch again and
  again and loose bunches of sweet-smelling deep blue flowers shaped like bells.
scope: 'Also called Phacelia campanularia: a one-year plant with loose bunches of deep blue bell-shaped
  flowers, not the desert plant of the same name with tube-shaped flowers in bunches at the ends of stems.'
examples:
- California bluebells grew along the path in spring.
- The California bluebell opened its deep blue flowers in the sun.
