simpleMeaning: A plant of which every part is highly deadly, whose bulb is crushed and used to kill small
  winged bugs, at times put in the Melanthiaceae group.
scope: This is a plant of which every part is highly deadly, not a safe garden plant or a drug, and its
  crushed bulb is used to kill small winged bugs.
examples:
- Fly poison grows in the damp field.
- The crushed bulb was used as fly poison.
