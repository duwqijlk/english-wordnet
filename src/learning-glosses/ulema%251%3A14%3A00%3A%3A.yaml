simpleMeaning: the group of Muslim scholars trained in Islam and Islamic law, who interpret Islamic teachings
  and laws and preserve the community's spiritual and intellectual tradition.
scope: Another name for the body of Muslim scholars also called ulama, not a single cleric or ruler.
examples:
- The ulema issued a ruling on the matter.
- Delegates met with local ulema to discuss the new curriculum.
