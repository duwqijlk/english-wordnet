simpleMeaning: A match of sounds at the ends of lines in which only one stressed beat is the same, as
  in disdain and complain
scope: A match of sounds at the ends of lines in which only one stressed beat is the same; not a feminine
  rhyme, in which two beats match.
examples:
- The masculine rhyme in 'disdain' and 'complain' rests on a single stressed beat.
- In serious verse, most masculine rhymes have just one stressed beat.
