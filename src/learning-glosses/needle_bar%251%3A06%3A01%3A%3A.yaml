simpleMeaning: The part of a sewing machine that makes stitches is held by this straight piece, which
  moves back and forth
scope: The moving part of a sewing machine that carries the part that makes stitches, not the stitching
  part itself and not a moving part in another machine.
examples:
- The needle bar jammed and the machine stopped sewing.
- Oil the needle bar so it moves back and forth smoothly.
