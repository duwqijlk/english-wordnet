simpleMeaning: the work of a tailor, a person who makes and changes clothes so they fit a person well
scope: This is the job of making and changing clothes to fit people, not one single piece of work on clothes
  and not the clothes themselves.
examples:
- He learned tailoring as a young man and opened his own shop.
- Tailoring kept her busy all week, with jackets to change and dresses to make.
