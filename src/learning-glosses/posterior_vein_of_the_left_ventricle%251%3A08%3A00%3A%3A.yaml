simpleMeaning: a blood tube that starts near the tip of the heart and drains into a large blood tube that
  takes blood from the heart
scope: 'Also called a vena posterior ventriculi sinistri: a blood tube that starts near the tip of the
  heart and drains into a large blood tube, not the large blood tube it drains into.'
examples:
- The posterior vein of the left ventricle starts near the tip of the heart.
- Blood from the posterior vein of the left ventricle drains into the coronary sinus.
