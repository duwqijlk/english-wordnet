simpleMeaning: wild cats with short tails and ears that usually have small bunches of hair, valued for
  their fur
scope: A wild cat of this kind, also called catamount, with a short tail and usually hair bunches on its
  ears; it is not a house cat and not a lion or tiger.
examples:
- A lynx hunted in the snow, its short tail and tufted ears easy to see.
- Lynxes are hunted by some people for their fur.
