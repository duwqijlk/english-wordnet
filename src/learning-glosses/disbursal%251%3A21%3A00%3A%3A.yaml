senseId: 'disbursal%1:21:00::'
synsetId: 13296518-n
simpleMeaning: Money paid out for goods and services, which may be taken off this year's tax bill, unlike
  money spent on lasting things.
scope: Money paid for goods and services that may be taken off tax, also called disbursement and expense;
  not money spent on lasting things and not money still owed.
examples:
- The disbursal covered the office goods and services.
- Each disbursal may be taken off this year's tax.
