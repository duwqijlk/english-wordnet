senseId: 'adopter%1:18:00::'
synsetId: 09791871-n
simpleMeaning: someone who becomes the parent of a child born to other people, by taking that child as
  his or her own
scope: This is a person who becomes a parent to a child born to other people; it is not the child who
  gets a new parent, and not taking up a new idea or way of doing things.
examples:
- The adopter gave the child her family name.
- As an adopter, he signed the papers that made the boy his son.
