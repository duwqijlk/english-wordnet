senseId: 'fruition%1:07:00::'
synsetId: 05221642-n
simpleMeaning: the pleasure you get from using or having something
scope: This is pleasure from using or having a thing, not a plant bearing fruit and not a plan or hope
  coming true.
examples:
- She found fruition in the daily use of the garden she owned.
- The fruition he felt in using his new workshop lasted for years.
