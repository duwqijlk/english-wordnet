simpleMeaning: Many kinds of big bird-hipped dinosaur walk on two legs and have a hard bill like a duck's
  and webbed feet, and may have lived partly in water.
scope: Also called duck-billed dinosaur and hadrosaur, this is a big two-legged dinosaur with a bill like
  a duck's and webbed feet, not a small one.
examples:
- The hadrosaurus left footprints in the mud as it walked on two legs.
- A hadrosaurus skeleton shows a bill shaped like a duck's.
