simpleMeaning: In mathematics, a rule that pairs each member of one set, the domain, with a member of
  another set, the range
scope: In mathematics, a rule pairing each member of one set with a member of another; map, function,
  mapping and single-valued function are other names for this sense, not a rule that pairs one member
  with many and not a list of numbers.
examples:
- A mathematical function pairs each input with one output.
- The mathematical function maps every number in the first set to a number in the second.
