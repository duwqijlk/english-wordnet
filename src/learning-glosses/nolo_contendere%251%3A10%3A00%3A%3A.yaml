senseId: 'nolo_contendere%1:10:00::'
synsetId: 06572930-n
simpleMeaning: In law, a 'no contest' plea by a person charged with a crime, who does not say they are
  guilty but still takes the punishment of a guilty finding
scope: In law, a 'no contest' plea that still brings a guilty finding; non vult is another name for this,
  not a plea of guilty and not a plea of not guilty.
examples:
- He entered a plea of nolo contendere to avoid a long trial.
- Nolo contendere means she did not admit guilt but took the sentence.
