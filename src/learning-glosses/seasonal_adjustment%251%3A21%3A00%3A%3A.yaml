senseId: 'seasonal_adjustment%1:21:00::'
synsetId: 13295915-n
simpleMeaning: a change made to numbers to allow for the ups and downs that happen at the same time each
  year
scope: A change to numbers that allows for ups and downs that repeat each year; not a real change in sales
  and not a guess about the future.
examples:
- The seasonal adjustment for housing starts must be made in mid-winter.
- After the seasonal adjustment, the sales figures looked much steadier.
