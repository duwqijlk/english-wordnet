simpleMeaning: A person paid by a shop to go and buy in a rival shop, so the shop can see how its prices
  and goods match up against the rival's
scope: A person paid by a shop to check a rival shop's prices and goods, not someone buying things for
  their own home.
examples:
- The shopper noted the rival's prices and took them back to her own store.
- As a shopper for the chain, he spent his days in other stores.
