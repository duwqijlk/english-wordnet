simpleMeaning: A tropical American aroid with underground stems good to eat, cooked and eaten like yams
  or potatoes
scope: Also called malanga, spoonflower, tannia, yautia and Xanthosoma sagittifolium; the name for one
  kind of food plant, not for yams or potatoes themselves.
examples:
- Xanthosoma atrovirens grows in warm wet ground.
- We cooked Xanthosoma atrovirens tubers like potatoes.
