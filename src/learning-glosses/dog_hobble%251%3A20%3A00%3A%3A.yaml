simpleMeaning: A bush of the south-east United States that stays green all year, grows fast, and has bending,
  tangled branches with bunches of white flowers
scope: This bush is also called dog laurel and switch-ivy.
examples:
- The dog hobble grew fast and stayed green all year.
- White flowers hung from the dog hobble in bunches.
