simpleMeaning: A court order about the state of one object or piece of property, not an order about a
  person.
scope: A court order about the state of an object or piece of property; judgment in rem is another name
  for it, not an order about a person.
examples:
- The judgement in rem settled who owned the ship.
- A judgement in rem decides the standing of the thing itself.
