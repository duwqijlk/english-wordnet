senseId: 'spud%2:30:00::'
synsetId: 00357986-v
simpleMeaning: To send out buds, boughs, or sprout.
scope: This sense is also called shoot, sprout, and germinate, for sending out buds, boughs, or sprouting,
  where shoot is to put out new growth, such as buds or small branches, or to begin growing from a seed,
  and sprout is to make buds or branches, or to start to grow from a seed, unlike the sense for a sharp
  hand spade for digging out roots and weeds, unlike the sense for an eatable tuber of South American
  birth, a staple food of the Irish, and unlike the sense for starting drilling work, as for oil.
examples:
- They spud, sending out buds.
- They spud, sending out boughs.
