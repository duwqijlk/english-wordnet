simpleMeaning: the part of the science of movement and forces that studies how gases, especially air,
  move, and what they do to things in their path
scope: Also called aeromechanics, this studies how air and other gases move and what they do to things
  in their path; it is not the study of how water moves and not the study of how solid things move on
  their own.
examples:
- Aerodynamics helps engineers design planes that use less fuel.
- They studied the aerodynamics of the new car in a wind tunnel.
