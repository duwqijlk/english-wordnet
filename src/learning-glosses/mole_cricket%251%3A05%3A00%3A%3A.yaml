simpleMeaning: a burrowing insect that digs in wet earth and eats the roots of plants
scope: A burrowing insect that digs in wet earth and eats the roots of plants; not a true mole, which
  is a burrowing animal, and not a field cricket, which lives above ground.
examples:
- The mole cricket dug tunnels through the damp soil of the lawn.
- Mole crickets ate the roots and the grass turned brown.
