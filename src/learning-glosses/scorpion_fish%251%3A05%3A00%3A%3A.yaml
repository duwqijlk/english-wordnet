simpleMeaning: Sea animals with a body that gets narrower toward the tail, a head covered in hard plates
  and stings that carry poison
scope: Sea animals with a body that gets narrower toward the tail, a head covered in hard plates and stings
  that carry poison, also called scorpionfish or sea scorpion; not a lionfish and not a harmless reef
  dweller.
examples:
- The scorpion fish hid among the rocks with its venomous spines.
- A scorpion fish can sting with the spines on its back.
