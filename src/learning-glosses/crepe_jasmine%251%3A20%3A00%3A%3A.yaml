simpleMeaning: From northern India to Thailand, a tropical shrub bears glossy leaves and blooms with crimped,
  night-scented petals.
scope: The spelling variant of crape jasmine, a night-blooming tropical shrub also called coffee rose;
  not a true jasmine.
examples:
- Crepe jasmine grows quickly in a warm greenhouse.
- The nursery sells crepe jasmine as a night-scented patio shrub.
