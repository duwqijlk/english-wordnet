simpleMeaning: One person or company must pay money as damages under a court ruling
scope: 'Another name for a personal judgment, also called a judgement in personam: one person or company
  must pay money as damages under a court ruling, not a ruling that orders a person to do or stop something.'
examples:
- The court issued a personal judgement ordering the firm to pay £50,000 in damages.
- After the personal judgement, the company had to pay the injured worker a large sum.
