simpleMeaning: to set, plant, or bury something in a long, narrow, deep hole dug in the ground
scope: To set, plant, or bury something in a long, narrow hole in the ground. It is not digging the hole
  itself, and not digging holes all around a place to protect it.
examples:
- She trenched the vegetables in a neat row in the garden.
- They trenched the dead soldiers in the ground near the camp.
