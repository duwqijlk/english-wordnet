senseId: 'intoxication%1:26:00::'
synsetId: 14042038-n
simpleMeaning: the state a person is in for a short time after drinking too much alcohol
scope: This is the state after drinking too much alcohol, also called drunkenness, inebriation, inebriety
  and insobriety; it is not strong happy excitement, and not the state caused by a poison.
examples:
- His intoxication was clear from the way he spoke and walked.
- She was taken home because her intoxication made it unsafe for her to drive.
