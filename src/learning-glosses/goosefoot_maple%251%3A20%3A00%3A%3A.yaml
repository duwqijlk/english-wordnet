simpleMeaning: A tree of eastern North America with striped bark and large leaves with two lobes, bright
  yellow in autumn
scope: A tree of eastern North America with striped bark and large two-lobed leaves, bright yellow in
  autumn; also called moose-wood, moosewood, striped dogwood and striped maple, not an oak and not a pine.
examples:
- The goosefoot maple had striped bark and yellow autumn leaves.
- A goosefoot maple grew at the edge of the eastern wood.
