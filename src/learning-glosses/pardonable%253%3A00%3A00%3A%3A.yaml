simpleMeaning: able to be forgiven
scope: This says a wrong act can be forgiven; it is not for an act that is too bad to forgive, and it
  does not mean the act was right.
examples:
- Forgetting her birthday was a pardonable mistake.
- His pardonable error caused a short delay but no harm.
