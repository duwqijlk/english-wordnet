simpleMeaning: A small tree with many branches, from the south-east of the United States, with thick bunches
  of white flowers
scope: A small white-flowered tree of the south-east United States, not a fringe tree of the genus Chionanthus
  and not a dogwood.
examples:
- A fringe bush bloomed white in the garden.
- Fringe bushes grow in the south-east of the United States.
