simpleMeaning: In the study of word sounds, the different forms of one small word part are made up of
  sounds, or sets of sounds.
scope: In the study of word sounds, it is the sounds that make up the different forms of one small word
  part, and it is not the word part itself.
examples:
- The morphophoneme of the word changes with its form.
- One morphophoneme can cover several sounds of the same word part.
