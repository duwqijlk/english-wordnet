senseId: 'debunk%2:32:00::'
synsetId: 00854877-v
simpleMeaning: to show that a claim or idea is wrong while making fun of it, especially if it is false
  or tries to look important
scope: 'Also called expose: showing a false or grand claim is wrong while making fun of it, not just showing
  something that was hidden.'
examples:
- He debunked the healer's grand claims, laughing as he showed why they were false.
- She debunked the proud man's grand story, laughing at it as she showed it was not true.
