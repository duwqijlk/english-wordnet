senseId: 'siphon%1:06:00::'
synsetId: 04231230-n
simpleMeaning: a tube that carries liquid from a container down to a lower place outside it, so the pull
  of the earth moves the liquid through
scope: A tube that moves liquid from a container down to a lower place outside it; not a body part in
  sea animals, and not the act of moving liquid this way, which are other senses of siphon.
examples:
- He used a siphon to drain the petrol from the tank.
- The siphon carried the water down into the bucket.
