simpleMeaning: To put someone to trouble or make them uneasy.
scope: To put someone to trouble or make them uneasy, not the hard thing that causes worry, and not the
  discomfort that gets in your way.
examples:
- I hope I don't inconvenience you by arriving early.
- The roadworks inconvenienced everyone in the street.
