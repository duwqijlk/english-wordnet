simpleMeaning: of wine, spoiled in taste by a stopper holding too much tannin, a bitter plant stuff
scope: Of wine, spoiled in taste by a stopper holding too much tannin; corked is another name for this
  sense, not wine that is simply sour or flat, and not wine spoiled by air.
examples:
- The corky wine tasted of wet cardboard.
- She sent back the corky bottle because the wine tasted spoiled.
