senseId: durable%5:00:00:serviceable:00
synsetId: 02131477-s
simpleMeaning: able to last through much use over a long time without wearing out or rotting
scope: This describes a thing that lasts through much use without wearing out or rotting; it does not
  mean a feeling or an action that lasts a long time.
examples:
- These durable boots lasted through three winters of daily work.
- She chose a durable coat that would not wear out quickly.
