simpleMeaning: the idea that life on earth changed in quick bursts with long quiet times between them,
  not bit by bit, as old bones and stones in the ground show
scope: 'Also called punctuated equilibrium: it says life on earth changed in bursts, not bit by bit in
  a slow steady way.'
examples:
- The theory of punctuated equilibrium says that new kinds of life can appear quite fast.
- In class we learned about the theory of punctuated equilibrium and how it differs from slow, steady
  change.
