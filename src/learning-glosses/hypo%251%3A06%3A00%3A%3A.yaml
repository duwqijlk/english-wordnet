simpleMeaning: A small pump with a thin needle, used to give shots of medicine under the skin
scope: This is a small pump with a thin needle used to give shots of medicine under the skin; hypodermic
  and hypodermic syringe are other names for this sense, not a pill and not a tube that takes blood.
examples:
- The nurse filled the hypo with medicine.
- He gave the shot with a hypo.
