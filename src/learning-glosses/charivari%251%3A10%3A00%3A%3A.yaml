senseId: 'charivari%1:10:00::'
synsetId: 07068162-n
simpleMeaning: For a couple who have just married, neighbours bang pots and kettles in a loud teasing
  song
scope: Also called belling, a callathump, a callithump, a chivaree, or a shivaree, this loud teasing song
  is made for a couple who have just married, not sung in earnest.
examples:
- The neighbours gave the newly married couple a charivari.
- Pots and kettles rang out in the charivari for the bride and groom.
