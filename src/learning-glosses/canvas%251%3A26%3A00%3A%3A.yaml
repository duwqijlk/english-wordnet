simpleMeaning: the place, time and world around the events in a story, a play, a film or another made-up
  account
scope: This is the place, time and world around the events in a story, a play, a film or another made-up
  account; not the heavy cloth, not a tent and not a painting.
examples:
- The novel uses wartime London as its canvas.
- History gave the writer a wide canvas for his story.
