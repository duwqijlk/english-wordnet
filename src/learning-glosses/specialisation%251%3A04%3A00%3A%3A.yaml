senseId: 'specialisation%1:04:00::'
synsetId: 00584498-n
simpleMeaning: the one kind of work you have chosen to do for your living
scope: The one kind of work you have chosen to do for your living; specialty, speciality, specialization
  and specialism are other names for this sense, not a change in the body of a living thing and not the
  act of making something fit one use.
examples:
- His specialisation is gastroenterology.
- Her specialisation is the care of young children.
