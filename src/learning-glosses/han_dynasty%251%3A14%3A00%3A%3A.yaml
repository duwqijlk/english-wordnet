simpleMeaning: A line of emperors ruling China, mostly from 206 BC to AD 220, widening its lands and building
  its government, recalled as one of the great ages of Chinese civilization.
scope: Also called Han; a long line of rulers in old China, not a later ruling house.
examples:
- The Han dynasty built the Silk Road.
- Art flowered under the Han dynasty.
