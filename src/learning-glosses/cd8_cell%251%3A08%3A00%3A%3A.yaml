simpleMeaning: A white blood unit with a special marker that spots germ bits on the outside of a virus-hit
  unit, sticks to it, and kills it.
scope: A white blood unit with a special marker that spots germ bits on the outside of a virus-hit unit,
  sticks to it, and kills it; killer cell, CD8 T cell, cytotoxic T cell and killer T cell are other names
  for this sense.
examples:
- The CD8 cell stuck to the virus-hit unit and killed it.
- CD8 cells spot germ bits on infected units.
