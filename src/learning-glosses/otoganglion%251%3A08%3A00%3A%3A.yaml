simpleMeaning: Threads from a knot of nerve cells that work on their own run to the spit-making gland
  beside the ear.
scope: This knot of nerve cells is also called otic ganglion, and threads from it run to the spit-making
  gland beside the ear.
examples:
- The otoganglion sends threads to the parotid gland.
- Threads from the otoganglion reach the spit-making gland beside the ear.
