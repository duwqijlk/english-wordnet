simpleMeaning: any of several plants of the genus Gutierrezia with tiny flower heads that look like match
  heads
scope: Any of several plants of the genus Gutierrezia; matchbush is another name for this sense, not a
  plant with large flowers and not a bush grown for its wood.
examples:
- Matchweed grows on the dry plains.
- The matchweed in bloom is covered with tiny flower heads.
