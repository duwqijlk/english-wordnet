simpleMeaning: any of several small ferns that grow on stone in hot and warm lands
scope: 'Also called cliff-brake or cliff brake: a small fern that grows on stone, not a fern that grows
  on trees and not a fern that grows in soil.'
examples:
- We found a rock brake growing on the stone wall behind the house.
- The rock brake clung to the stones on the hillside.
