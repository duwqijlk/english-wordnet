simpleMeaning: Counted by how often the waves repeat, this is the part of the range of electric and magnetic
  waves that lies below what the eye can see.
scope: Also called infrared, it is the part of the wave range below what the eye can see, counted by how
  often the waves repeat, not the part the eye can see.
examples:
- The infrared frequency of the beam lay below the visible range.
- They measured the infrared frequency of the waves.
