simpleMeaning: A thin tube that moves a clear fluid through the body and at last pours it into the blood
  flowing in the veins.
scope: A thin tube that carries a clear fluid into the veins, also called lymph vessel; not a blood vessel
  and not a nerve.
examples:
- The lymphatic vessel runs beside the vein in the arm.
- Doctors traced the swelling to a blocked lymphatic vessel.
