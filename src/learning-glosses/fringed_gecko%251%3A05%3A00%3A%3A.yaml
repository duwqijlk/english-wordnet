simpleMeaning: Short glides are made by this gecko on thin flaps of skin along the sides of its body,
  legs and tail.
scope: Also called a flying gecko, this gecko glides short ways on thin flaps of skin, not one without
  flaps.
examples:
- The fringed gecko spread its flaps and glided a short way.
- The fringed gecko used its side flaps to glide a short way through the air.
