simpleMeaning: Used as a living room, this roofed space is open to the air and often has furniture in
  it
scope: A roofed open-sided space used as a living room, not an inside room and not an open yard with no
  roof.
examples:
- We ate breakfast on the lanai as the sun came up.
- They put a sofa and two chairs on the lanai.
