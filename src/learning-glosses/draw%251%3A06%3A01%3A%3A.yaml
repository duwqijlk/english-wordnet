simpleMeaning: Any object, such as a straw or pebble, picked out or selected at random.
scope: Something chosen by pure chance, not a playing card dealt from the pack, and not the poker game
  in which players swap cards.
examples:
- The luck of the draw put her in the group with the hardest questions.
- Whether you get a good seat is mostly the luck of the draw.
