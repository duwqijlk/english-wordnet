simpleMeaning: Where snow turns to ice, at the high end of a slow river of ice past the line where snow
  stays all year
scope: The high end of a slow river of ice where snow turns to ice, not the lower end and not a field
  of snow that stays all year.
examples:
- The climbers crossed the neve before the sun rose.
- Fresh snow on the neve will slowly turn to ice.
