simpleMeaning: One word keeps coming into a person's mind, or they keep saying it, and the thought will
  not go away
scope: A fixed thought about one word that keeps coming back, not a love of new words and not a fear of
  speaking.
examples:
- His onomatomania made him repeat the same word all day.
- Her onomatomania kept the word turning over in her mind.
