simpleMeaning: a substance that speeds up the release of growth hormone from the front part of the pituitary
  gland
scope: 'Also called growth hormone-releasing factor: a substance that speeds up the release of growth
  hormone from the front part of the pituitary gland, not a substance that slows that release.'
examples:
- GHRF tells the pituitary to release growth hormone.
- Doctors gave GHRF and then measured the growth hormone released by the pituitary gland.
