simpleMeaning: 'a mental health problem: a person forgets who they are, leaves home for a new life, cannot
  remember the old life then, and cannot remember that time after getting well'
scope: Also called psychogenic fugue. This is the health problem where a person forgets who they are and
  leaves home; it is not a piece of music and not just a dream-like state.
examples:
- During his fugue, he left home and started a new life with a new name.
- After the fugue ended, she could not remember where she had lived during those months.
