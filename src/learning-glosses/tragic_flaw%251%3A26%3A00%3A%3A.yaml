senseId: 'tragic_flaw%1:26:00::'
synsetId: 14486915-n
simpleMeaning: a fault or mistake in the nature of a hero in a sad play, which brings about the hero's
  ruin
scope: A fault in a sad play's hero that causes the hero's fall; hamartia is another name for this sense,
  not a mistake by any person and not bad luck.
examples:
- Pride was the tragic flaw that brought the hero down.
- The play shows how a tragic flaw leads to ruin.
