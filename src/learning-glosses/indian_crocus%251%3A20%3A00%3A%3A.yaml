simpleMeaning: Any of several dwarf orchids of the group Pleione bearing one or two single white or pink
  to magenta or now and then yellow flowers on slender stalks.
scope: A dwarf orchid with one or two flowers on thin stalks, not a true crocus of the garden.
examples:
- The Indian crocus bloomed white in spring.
- We grow Indian crocus in pots.
