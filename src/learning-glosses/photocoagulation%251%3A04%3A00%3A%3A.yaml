simpleMeaning: An eye operation in which a laser burns away diseased tissue, or scars a detached retina
  so it stays in place.
scope: A laser operation on the retina, not eye surgery with a scalpel or a drug treatment; it either
  destroys damaged tissue or scars a detached retina back into place.
examples:
- The surgeon used photocoagulation to seal the leaking blood vessels in her eye.
- Photocoagulation can hold a detached retina in place by leaving tiny scars.
