simpleMeaning: In grammar, a verb form with no special mark that shows an act or a state as a real fact
scope: Also called indicative, common mood, declarative mood, fact mood and indicative mood. This noun
  names a verb form that shows an act or state as a fact, not the describing word for such a form and
  not a general promise or order.
examples:
- In grammar class we learned that 'she runs' is in the declarative.
- The teacher said the declarative shows things as facts, unlike a question form.
