simpleMeaning: A person who treats someone far too gently and gives them all they want
scope: 'Also called a coddler, a pamperer and a spoiler: a person who treats someone far too gently, not
  a strict parent and not a kind friend.'
examples:
- Her grandmother was a mollycoddler who gave her sweets every day.
- As a mollycoddler, he never let his son do hard chores.
