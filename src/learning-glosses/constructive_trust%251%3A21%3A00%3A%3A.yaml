senseId: 'constructive_trust%1:21:00::'
synsetId: 13383135-n
simpleMeaning: a court-made plan to hold what a person owns for the good of a person wrongly kept from
  what is theirs, no matter what those in the case had meant
scope: 'Involuntary trust is another name for this sense: a court-made plan that holds what a person owns
  for the good of a person wrongly kept from what is theirs, not a plan the owners chose and not a gift.'
examples:
- The judge set up a constructive trust to give the money back to the family it had been taken from.
- A constructive trust can help a person who lost land through fraud.
