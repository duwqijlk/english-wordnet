simpleMeaning: A male hormone drug used to treat too little male sex hormone, breast cancer or weak bones.
scope: A male hormone drug for low male hormone, breast cancer or weak bones, also called nandrolone and
  Kabolin; not a female hormone drug.
examples:
- The doctor gave him Durabolin for his low hormone level.
