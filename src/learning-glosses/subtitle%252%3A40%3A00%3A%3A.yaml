simpleMeaning: to add written words to a film that show in another language what the people in it say
scope: This is the verb for adding those words to a film. It is not the words themselves that you read
  at the bottom of the screen.
examples:
- They subtitled the French film for English viewers.
- The studio will subtitle the movie before it is shown in other countries.
