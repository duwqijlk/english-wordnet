simpleMeaning: A set of signs showing the share of each kind of bit in something, not the full count of
  bits.
scope: A set of signs showing shares of kinds, not the full count of bits and not a word list.
examples:
- The empirical formula shows the ratio of elements in the compound.
- Water's empirical formula shows two parts hydrogen to one of oxygen.
