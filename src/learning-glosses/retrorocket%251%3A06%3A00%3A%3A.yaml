simpleMeaning: a small engine on a large craft that flies in space, fired to slow it down or change its
  path
scope: A small engine that slows or turns a craft in space, not the main engine that lifts it off the
  ground and not a part that steers a plane.
examples:
- The retrorocket fired to slow the craft as it came in to land.
- Engineers tested the retrorocket before the flight.
