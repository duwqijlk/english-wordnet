senseId: 'pump_action%1:06:00::'
synsetId: 04028828-n
simpleMeaning: 'A modern rifle or shotgun mechanism: working a sliding lever back and forward throws out
  the spent case, readies the gun, and feeds in the next round.'
scope: A firearm's sliding loading mechanism, not a bolt-action or lever-action one, and not a water pump.
examples:
- He worked the pump action to load the next round.
- The shotgun's pump action slid back with a loud click.
