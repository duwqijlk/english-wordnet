simpleMeaning: A person skilled at using memory tricks, able to recall things few others can
scope: A person with great skill at remembering, not a memory trick itself and not an ordinary good memory.
examples:
- The mnemonist could recall the order of fifty cards after one look.
- As a mnemonist, she amazed the crowd by naming every guest's birthday.
