simpleMeaning: a tool that works with light and follows a thing in the sky, sending its light into a viewing
  tube; it has one moving mirror and one still mirror
scope: A tool that works with light and follows a thing in the sky, sending its light into a viewing tube,
  with one moving mirror and one still mirror; not a viewing tube itself, and not a plain mirror.
examples:
- The coelostat followed the planet across the sky.
- Astronomers use a coelostat to feed light into the telescope.
