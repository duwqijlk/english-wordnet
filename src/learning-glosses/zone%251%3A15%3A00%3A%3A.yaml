simpleMeaning: a small area of ground that is set apart because of the features found there
scope: This is a small bounded patch with its own character, not a wide band of the globe, and not a whole
  region defined only by how it differs from the areas around it.
examples:
- A small zone of dead grass marks where the old path ran.
- The wet zone around the pond is full of frogs.
