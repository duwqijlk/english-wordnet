simpleMeaning: A one-year plant from Europe and Africa that grows wild in America as a weed, once dried
  and used to clear the bowels, make more urine, or fight syphilis.
scope: This is the plant sense, not a metal or a drug name; also called boys-and-girls, herb mercury and
  herbs mercury.
examples:
- Mercurialis annua grows wild along the field edge.
- They once dried Mercurialis annua for use as a drug.
