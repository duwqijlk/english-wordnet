simpleMeaning: This plant of America's east lives for years; single yellow flowers come early, later ones
  have no petals, and ice on it at the first cold gives it its name.
scope: Also called frost-weed or frostwort, this plant of America's east lives for years, bears single
  yellow flowers early and later ones with no petals, and is named for the ice that gathers on it at the
  first cold, not the tall plant with clusters of white flowers.
examples:
- The frostweed by the fence bore single yellow flowers.
- Ice crystals formed on the frostweed at the first frost.
