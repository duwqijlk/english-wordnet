simpleMeaning: A drug, sold under a trade name, that lowers the amount of triglyceride, a fat in the blood.
scope: Also called gemfibrozil, this is a drug that lowers a fat in the blood, not a drug that cuts down
  pain.
examples:
- The doctor gave him Lopid to lower his triglyceride levels.
- Lopid brought the fat in her blood down.
