simpleMeaning: a very thin tube with a narrow space inside that holds liquid by the natural pull you get
  in narrow spaces
scope: This is a very thin tube for liquid, also called capillary tube and capillary tubing. It is not
  the tiny blood vessel in the body that joins other small blood vessels.
examples:
- The liquid rose slowly up the capillary and stayed there.
- He used a thin capillary to draw up a drop of water.
