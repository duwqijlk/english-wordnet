simpleMeaning: Much used by power companies, this strong gas that warms the earth has no colour and dissolves
  in alcohol and ether.
scope: Sulphur hexafluoride is another name for this gas with no colour, which dissolves in alcohol and
  ether and warms the earth.
examples:
- The power firm uses sulfur hexafluoride in its work.
- The chemist mixed sulfur hexafluoride into alcohol in the lab.
