simpleMeaning: a large tree from the western United States that keeps its leaves all year, with wood much
  harder than that of the Canadian tree of the same kind
scope: 'Also called a mountain hemlock: a large tree from the western United States that keeps its leaves
  all year, not the Canadian tree with softer wood and not other large trees of the west.'
examples:
- A black hemlock grew tall on the western slope.
- The black hemlock gave hard wood for the builders.
