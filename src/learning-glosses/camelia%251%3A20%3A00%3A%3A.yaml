simpleMeaning: any of several bushes or small trees that keep their leaves all year, with single white,
  pink, or red flowers
scope: Any of several bushes or small trees that keep their leaves all year, with single white, pink,
  or red flowers; camellia is another name for this sense, not a rose and not a tree that loses its leaves
  in winter.
examples:
- The camelia in the pot bore pink flowers.
- She planted a camelia near the front door.
