simpleMeaning: a thing in a camera or other tool that makes the picture sharp by itself
scope: A thing in a camera or other tool that sets the picture sharp by itself, not a focus you set by
  hand.
examples:
- The autofocus on my camera locked onto her face.
- With autofocus on, the camera made the bird sharp without my help.
