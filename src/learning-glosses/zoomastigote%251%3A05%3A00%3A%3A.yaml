simpleMeaning: a tiny one-celled animal that moves by waving a thin tail and cannot make food from light
  like a plant
scope: This is a tiny one-celled animal that moves with a thin tail and has no plant traits, also called
  zooflagellate; not a plant and not a one-celled animal that makes food from light.
examples:
- The zoomastigote swam by waving its thin tail.
- The zoomastigote moved through the pond water in search of food.
