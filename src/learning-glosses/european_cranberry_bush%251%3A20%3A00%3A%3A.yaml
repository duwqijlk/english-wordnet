simpleMeaning: A shrub that loses its leaves in winter, grows in thick groups in the Old World, and bears
  bunches of white flowers and small bright red berries.
scope: Also called crampbark, cranberry tree, guelder rose, European cranberrybush, and Viburnum opulus;
  a thicket-forming shrub of the Old World, with bunches of white flowers and small bright red berries.
examples:
- The European cranberry bush was covered in red berries.
- She planted a European cranberry bush by the fence.
