simpleMeaning: A banana tree from the Philippines whose leaf stalks give a fibre used for rope, paper
  and other things.
scope: This is the Philippine banana tree whose leaf stalks yield the fibre; abaca and Musa textilis are
  other names for this sense, not the fibre itself.
examples:
- The Manila hemp trees grew in rows across the Philippine farm.
- Workers cut the Manila hemp stalks to make paper.
