simpleMeaning: A hot oven where a dead body is burned until only ash is left
scope: A furnace for burning a dead body to ash, also called a crematory and a crematorium; not a room
  for burial and not a place for keeping bodies.
examples:
- The cremation chamber was heated before the service.
- After the cremation chamber cooled, the ashes were gathered.
