simpleMeaning: Fixed ahead of the plough, this sharp steel wedge cuts straight down through the soil
scope: Also called colter, this sharp steel wedge is fixed ahead of the plough and cuts straight down
  through the soil, not the plough itself.
examples:
- The coulter cut a clean line through the soil ahead of the plough.
- He fitted a new coulter to the front of the plough.
