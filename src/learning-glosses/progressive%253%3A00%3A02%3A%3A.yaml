simpleMeaning: In taxes, a rate set so that people who earn more pay a bigger share of what they earn
scope: Of taxes, a rate that rises with income, not a person who backs political reform and not a verb
  tense.
examples:
- The country uses a progressive tax, so higher earners pay a bigger share.
- Under a progressive system, the tax rate goes up as income goes up.
