simpleMeaning: A male sex gland that did not move down into the bag of skin below while the baby boy was
  still in the womb
scope: 'Also called an undescended testis: a male sex gland that did not move down before birth; not a
  gland that moved down and then went back up, and not a gland that was taken out.'
examples:
- An undescended testicle may need an operation.
- The doctor found an undescended testicle in the newborn boy.
