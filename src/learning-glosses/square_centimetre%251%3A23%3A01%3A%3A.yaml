simpleMeaning: To measure an area, take a shape with four equal sides, each a hundredth of a metre long;
  a hundredth of a metre is 0.3937 inch.
scope: A measure of area, taken from a shape with four equal sides of one hundredth of a metre; square
  centimeter is another name for it, not a measure of length.
examples:
- A square centimetre is the space inside a shape with four equal sides of one centimetre.
- The stamp covered about four square centimetres.
