simpleMeaning: a hard, smooth food made from milk, first made in the town it is named for in southwestern
  England
scope: A hard, smooth food made from milk; cheddar is another name for this sense, not a soft spread and
  not a blue-veined kind.
examples:
- We grated cheddar cheese over the pasta.
- The cheddar cheese had a sharp taste.
