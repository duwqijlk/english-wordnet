simpleMeaning: drops put in the eye that treat glaucoma, a disease of high pressure inside the eye, by
  making less clear fluid and helping it drain away through a side path
scope: Drops for the eye that lower pressure in glaucoma, not ordinary eye drops for dry eyes and not
  a pill.
examples:
- The doctor gave her an adrenergic agonist eyedrop for the pressure in her eye.
- He puts the adrenergic agonist eyedrop in each morning.
