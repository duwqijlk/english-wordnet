simpleMeaning: A shorebird with a large head and large eyes, out at dusk or at night, from the Old World
  and tropical America, with a thick knee joint.
scope: A large-headed shorebird out at dusk or at night, also called stone curlew and thick-knee; set
  apart from other shorebirds and from other night birds with thick knees.
examples:
- Burhinus oedicnemus hunts along the shore at dusk.
- You can see Burhinus oedicnemus by its large eyes at night.
