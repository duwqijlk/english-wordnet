simpleMeaning: a tool for pressing something down firmly, such as tobacco into a pipe or a charge into
  a drilled hole
scope: A tool for pressing things down firmly, also called a tamp, not the verb sense of secretly changing
  something and not a tool for hammering.
examples:
- He used a tamper to pack the tobacco into his pipe.
- The miner pressed the charge down with a tamper.
