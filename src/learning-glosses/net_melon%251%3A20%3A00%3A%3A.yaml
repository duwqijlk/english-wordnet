simpleMeaning: Sweet green flesh lies inside fruit with a thin skin marked like a fine mesh, borne on
  a vine.
scope: The netted melon and the nutmeg melon are also names for a vine that bears sweet fruit, not the
  fruit itself.
examples:
- The net melon bears fruit with sweet green flesh.
- The fruit of the net melon has a thin skin marked like a fine mesh.
