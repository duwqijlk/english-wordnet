simpleMeaning: People bang pans and kettles to tease a newly married couple with a false song.
scope: Also called belling, callithump, charivari, chivaree, and shivaree, this is a noisy teasing for
  a newly married couple, not a song played in earnest.
examples:
- The neighbours made a callathump for the newly married couple with pots and pans.
- A callathump greeted the newly married couple.
