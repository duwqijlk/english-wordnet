simpleMeaning: wood from any of several kinds of trees, that does not rot easily under water, and is used
  for bridges and other things
scope: This sense is wood taken from the tree, not the living tree or shrub itself.
examples:
- They built the small bridge from alder because it lasts well in water.
- Alder stays strong under water, so workers use it for bridge parts.
