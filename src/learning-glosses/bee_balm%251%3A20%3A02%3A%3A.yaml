simpleMeaning: A long-lived sweet-smelling herb of east North America, with tube-shaped blooms of many
  hues in thick bright heads.
scope: This sense is also called beebalm, bergamot mint, and oswego tea, a long-lived sweet-smelling herb
  of east North America, with tube-shaped blooms of many hues in thick bright heads, unlike the sense
  for a bushy long-lived Old World mint having small white or yellowish flowers and fragrant lemon-flavored
  leaves, a garden escapee in northern Europe and North America.
examples:
- Bee balm smells sweet in the garden.
- The bee balm bears tube-shaped blooms.
