simpleMeaning: A pregnancy in which the baby grows somewhere other than in the womb.
scope: A pregnancy in which the baby grows somewhere other than in the womb; also called eccyesis, ectopic
  gestation, ectopic pregnancy, extrauterine pregnancy, or metacyesis, not a pregnancy in the womb and
  not a false pregnancy.
examples:
- Extrauterine gestation is rare and needs urgent care.
- The doctor found an extrauterine gestation outside the womb.
