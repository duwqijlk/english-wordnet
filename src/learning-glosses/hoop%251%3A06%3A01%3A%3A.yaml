simpleMeaning: A light frame of curved bands, worn to hold a skirt out in a wide shape.
scope: A light frame of curved bands that holds a skirt out wide, not a stiff band for holding or tying
  things, not the ring for basketball, and not the act of fixing one on.
examples:
- Her hoop held the wide skirt out as she danced.
- Ladies once wore a hoop under their skirts.
