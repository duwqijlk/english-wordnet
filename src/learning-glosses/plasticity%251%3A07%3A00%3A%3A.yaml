simpleMeaning: the quality that lets a thing be pressed, hammered, and made into a new shape without breaking
scope: 'Also called malleability: the quality that lets a thing be shaped without breaking, not the quality
  of being stretchy or of bending and springing back.'
examples:
- The clay's plasticity made it easy to shape into a pot.
- Metal workers value the plasticity of soft copper.
