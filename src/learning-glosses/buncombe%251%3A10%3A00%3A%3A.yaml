simpleMeaning: bad acts or talk that people should not put up with, most of all silly claims that are
  plainly untrue
scope: 'Also called bunk, rot, hogwash, guff and bunkum: bad acts or talk that people should not put up
  with, most of all silly claims that are plainly untrue, not honest talk and not a small mistake.'
examples:
- His speech was pure buncombe, full of claims no one could believe.
- She called the whole story buncombe and walked out.
