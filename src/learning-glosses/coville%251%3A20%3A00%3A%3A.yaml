simpleMeaning: Small yellow flowers grow on this desert shrub of the southwestern United States and New
  Mexico, whose sticky, sweet-smelling leaves stay on all year.
scope: 'Also called creosote bush and hediondilla: a desert shrub with small yellow flowers, not a cactus
  of the same dry lands.'
examples:
- Coville grows in the deserts of New Mexico.
- The coville bush had small yellow flowers.
