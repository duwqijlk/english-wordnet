schema: oewn-learning-gloss-v2
senseId: 'exocentric_compound%1:10:01::'
synsetId: 92462683-n
simpleMeaning: In grammar, a word made of two or more parts whose job in a sentence is not the job of
  any one part alone
scope: This is a word built from parts that acts in a new way in a sentence; not an endocentric compound,
  whose parts share its job, and not a simple word made of one part.
examples:
- Bittersweet is an exocentric compound because it is a noun made of two adjectives.
- The teacher gave an exocentric compound as an example of a word with a new job in a sentence.
