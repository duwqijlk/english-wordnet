simpleMeaning: a shaking of the body that you cannot stop, as if it came from illness or fear
scope: A shaking of the body that you cannot stop; not the feeling of fear that you almost like, and not
  the verb for shaking in this way.
examples:
- A shudder went through her body when the fever rose.
- He felt a cold shudder run down his back.
