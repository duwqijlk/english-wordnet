senseId: 'monopoly%1:26:01::'
synsetId: 14467792-n
simpleMeaning: In economics, a place for buying and selling where many people buy but only one person
  or company sells
scope: In economics, this is a market with many buyers and only one seller, not a market where many people
  or companies sell the same things.
examples:
- The company holds a monopoly in a market where it is the only seller.
- When there is a monopoly, many buyers have to buy from the one seller.
