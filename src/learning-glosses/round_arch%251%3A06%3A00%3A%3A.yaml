simpleMeaning: a curved opening shaped as one unbroken half-circle, the mark of Roman building
scope: A curved opening shaped as one unbroken half-circle; not a pointed arch, and not a flat beam over
  a door.
examples:
- A round arch framed the church door.
- Round arches mark the old Roman bridge.
