simpleMeaning: a computer program that puts labels on the parts of a text, such as its words, to show
  what job each part does in grammar
scope: This is a computer program that labels parts of a text; not the person who does the same labeling
  job.
examples:
- The tagger labeled each noun and verb in the sentence.
- Our class used a tagger to mark the parts of each text.
