simpleMeaning: A one-season plant from South America with creeping underground stems ending in edible
  starchy swellings, widely grown as a garden vegetable; its vines are poisonous.
scope: Also called a potato, a white potato, and a white potato vine; a garden plant with poisonous vines
  and edible underground swellings, distinct from the sweet potato plant and the yam plant.
examples:
- Farmers plant Solanum tuberosum in spring for its edible underground swellings.
- The vines of Solanum tuberosum are poisonous, so animals should not eat them.
