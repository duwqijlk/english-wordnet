simpleMeaning: a grey or white bird that wades in shallow water, with a long neck, long legs, and usually
  a long beak
scope: A grey or white bird that wades in shallow water, with a long neck, long legs, and usually a long
  beak; not a stork, and not a crane.
examples:
- A grey heron stood still in the shallow water, waiting for fish.
- The heron spread its wings and flew off across the marsh.
