simpleMeaning: A unit that measures how strong a magnetic field is, equal to one maxwell for each square
  centimetre
scope: This is a unit for magnetic field strength, not the field itself and not a unit of electric current.
examples:
- The field measured about fifty gauss near the magnet.
- Scientists still quote small fields in gauss.
