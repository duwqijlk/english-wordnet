simpleMeaning: taking a hard stone out of the gallbladder through a cut in it
scope: Taking a hard stone out of the gallbladder through a cut in it, not taking out the gallbladder
  itself and not breaking up a stone without a cut.
examples:
- The surgeon did a cholelithotomy to take the stone from her gallbladder.
- After the cholelithotomy, the patient stayed in the hospital for two days.
