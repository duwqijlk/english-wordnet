simpleMeaning: one mixed nerve links the brain with the throat, voice box, lungs, heart, food pipe, stomach,
  and most of the belly organs
scope: 'Also called nervus vagus, pneumogastric, pneumogastric nerve, tenth cranial nerve, vagus, and
  vagus nerve: one mixed nerve serving the throat, voice box, lungs, heart, food pipe, stomach, and most
  of the belly organs; not a nerve serving one part only.'
examples:
- The wandering nerve serves the throat, lungs, heart, and stomach.
- Signals travel along the wandering nerve to most of the belly organs.
