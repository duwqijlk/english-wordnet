simpleMeaning: the part of algebra that works with equations in which a number is multiplied by itself
scope: The part of algebra about equations with a number times itself, not algebra as a whole and not
  the study of straight-line equations.
examples:
- She found quadratics hard until she learned to work with equations that use squares.
- In quadratics, we worked out how far a ball would go from an equation.
