scope: 'Also called queenfish or white croaker: a silver and blue fish of the drum kind from the shallow
  sea waters by the coast of California, not a fish of deep water and not a fish of fresh water.'
examples:
- Seriphus politus swims in the shallow waters by the coast of California.
- The silver and blue Seriphus politus is a fish of the drum kind.
