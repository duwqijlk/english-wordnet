simpleMeaning: a curved band of colored light in the sky, made when rain bends light from the sun
scope: This is the band of colored light seen in the sky when sun and rain meet; it is not just any set
  of bright colors on a thing.
examples:
- After the rain, a rainbow spread across the sky.
- We saw a bright rainbow over the fields.
