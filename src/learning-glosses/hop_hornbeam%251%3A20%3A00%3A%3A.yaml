simpleMeaning: any of several trees that look like a broad-leaf tree, with fruit clusters shaped like
  small cones
scope: Any of several trees that look like a broad-leaf tree, with fruit clusters shaped like small cones,
  not a true hornbeam and not a hop plant.
examples:
- Hop hornbeam grows in the woods along the river.
- The hop hornbeam bore clusters of small, cone-like fruit.
