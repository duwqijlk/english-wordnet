simpleMeaning: At the back of a hall, above the main seats, a floor sticks out where people sit to watch
  a show.
scope: High seats at the back of a hall, not a flat floor sticking out from the outside wall of a building.
examples:
- We sat in the balcony to watch the play.
- The balcony runs along the back of the hall above the main seats.
