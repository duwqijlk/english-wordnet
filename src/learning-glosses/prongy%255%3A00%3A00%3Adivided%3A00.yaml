simpleMeaning: shaped like a fork, with one part split into two ends that point in two ways
scope: 'Also called forked, branched, pronged, bifurcate, biramous, forficate, and fork-like: shaped like
  a fork and split in two, not a single straight point and not a thing with many small teeth.'
examples:
- The tree had prongy roots that split into two parts.
- Horseradish grown in poor soil may develop prongy roots.
