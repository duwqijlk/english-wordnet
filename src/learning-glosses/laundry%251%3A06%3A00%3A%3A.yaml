simpleMeaning: a place of work where clothes are washed and made flat and smooth with a hot iron
scope: A place where clothes are washed and made smooth with an iron, not the clothes and cloth things
  themselves, such as sheets and towels, that are to be washed.
examples:
- He took the hotel sheets to the laundry across the street.
- She works at a laundry where shirts are washed and ironed all day.
