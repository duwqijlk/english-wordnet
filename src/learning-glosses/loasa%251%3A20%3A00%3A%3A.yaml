simpleMeaning: one of several kinds of plant from South America that live for many years, with hairs that
  sting and large bright white, yellow, or reddish-orange flowers
scope: A South American plant with stinging hairs and bright white, yellow, or reddish-orange flowers,
  not a tree and not a plant grown for food.
examples:
- The loasa in the garden has hairs that sting if you touch them.
- We saw a loasa with large white flowers on the walk in the hills.
