simpleMeaning: a machine for the home in which pants can be hung so the folds are smoothed out
scope: This is a home machine for smoothing pants, also called a pants presser; not an iron and not a
  machine for washing clothes.
examples:
- He hung his trousers in the trouser press overnight.
- The trouser press took the folds out of my suit pants.
