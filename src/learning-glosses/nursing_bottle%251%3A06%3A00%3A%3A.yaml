simpleMeaning: A baby drinks milk or formula from this bottle, which has a soft tip and takes the place
  of feeding at the breast.
scope: 'Also called bottle and feeding bottle: a bottle with a soft tip for feeding babies, not a bottle
  for older children to drink from.'
examples:
- She filled the nursing bottle with warm milk for the baby.
- The nursing bottle has a soft tip the baby can suck.
