simpleMeaning: ready to believe other people and to share private thoughts with them, with a strong belief
  that they will not lie or harm you
scope: This describes a person who believes others easily and shares private thoughts, not a person who
  is careful or slow to believe others.
examples:
- She is a trusting child who believes everyone she meets.
- He was so trusting that he told the new worker all his private plans.
