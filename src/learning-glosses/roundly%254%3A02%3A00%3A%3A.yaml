simpleMeaning: in a way that has a curved shape like a circle
scope: This sense is about a shape like a circle, not the sense that means fully, and not the sense for
  speaking in a strong, sharp way.
examples:
- The stone was roundly shaped, with no sharp edges.
- The pot was roundly curved at the sides.
