simpleMeaning: an old word for a man who knows that his wife has been unfaithful to him and puts up with
  it
scope: An old word for a man who knows about his wife's unfaithfulness and puts up with it, not a man
  who does not know and not a word still in common use.
examples:
- The play's wittol knew of his wife's lover and said nothing.
- In old books a wittol is a husband who tolerates his wife's unfaithfulness.
