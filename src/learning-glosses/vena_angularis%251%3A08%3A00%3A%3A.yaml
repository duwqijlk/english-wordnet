simpleMeaning: Near the eye, two small veins join to make a short vein that goes on as the vein of the
  face.
scope: Also called angular vein, this short vein near the eye goes on as the vein of the face.
examples:
- The vena angularis joins the two small veins above the eye to the vein of the face.
- Blood from above the eye drains through the vena angularis into the facial vein.
