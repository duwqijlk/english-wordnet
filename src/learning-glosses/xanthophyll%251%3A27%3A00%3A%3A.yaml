simpleMeaning: yellow colouring from carotenoids, a group of plant colours, in plants, animal fats and
  egg yolks
scope: This is a yellow colour in plants, animal fats and egg yolks, also called lutein and xanthophyl;
  not the tiny living things that make yellow colour, and not a green colour in leaves.
examples:
- The xanthophyll in autumn leaves gives them their yellow colour.
- Xanthophyll is the yellow colouring found in egg yolks.
