senseId: 'intelligible%3:00:00::'
synsetId: 01339879-a
simpleMeaning: spoken clearly and loudly enough so that each word can be heard on its own
scope: About speech that is clear and loud enough to hear word by word, not only about words or ideas
  that can be understood.
examples:
- His voice was intelligible even at the back of the noisy hall.
- She gave an intelligible reading, loud and clear enough for every word to be heard.
