senseId: 'inertia%1:19:00::'
synsetId: 11489163-n
simpleMeaning: In physics, the way a thing stays still or keeps moving at the same speed in the same direction
  unless a force from outside acts on it
scope: In physics, this is about a thing staying still or moving in the same way until a force from outside
  acts on it; it is not a person's wish to stay still and do nothing.
examples:
- Because of inertia, the ball kept rolling until the wall stopped it.
- Inertia kept the parked car still until we pushed it hard.
