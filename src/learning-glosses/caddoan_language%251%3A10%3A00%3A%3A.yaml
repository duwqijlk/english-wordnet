simpleMeaning: A group of related tongues of the native peoples of North America, spoken widely in the
  middle west by the people of the same name.
scope: 'Also called Caddo and Caddoan: this is a whole family of related tongues, not one tongue on its
  own and not the Caddo people who speak them.'
examples:
- The Caddoan language covers a family of related tongues.
- Linguists study the Caddoan language and its sister tongues.
