simpleMeaning: In old drug weights, a weight of 480 grains, or one twelfth of a pound of the same old
  system
scope: In old drug weights, a weight of 480 grains, also called ounce and apothecaries' ounce; not a modern
  ounce and not a pound weight.
examples:
- The old recipe called for a troy ounce of the powder.
- A troy ounce is heavier than the ounce used for food.
