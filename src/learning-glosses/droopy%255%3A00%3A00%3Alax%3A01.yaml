simpleMeaning: Hanging low, as when something is tired out or weak
scope: Hanging low from tiredness or weakness, with drooping and sagging as other names for this sense,
  not hanging down by design and not falling by its own weight alone.
examples:
- After the long walk, her droopy shoulders showed how tired she was.
- The droopy flowers needed water badly.
