simpleMeaning: an event that breaks or ruins something fully, so that it no longer exists
scope: An event that ends something by ruining it fully, not the act of causing so much damage that something
  ends or cannot be fixed.
examples:
- The fire caused great destruction in the town.
- The destruction left by the storm took months to clear.
