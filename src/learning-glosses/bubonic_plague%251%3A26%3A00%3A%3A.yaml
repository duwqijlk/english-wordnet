simpleMeaning: The most common plague in folk, marked by chills, collapse, wild talk, and swellings in
  armpits and groin, and it does not pass from one person to the next.
scope: This sense is also called glandular plague and pestis bubonica, the most common plague in folk,
  marked by chills, collapse, wild talk, and swellings in armpits and groin, and it does not pass from
  one person to the next.
examples:
- Bubonic plague brings chills and collapse.
- The bubonic plague does not pass from person to person.
