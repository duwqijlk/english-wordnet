simpleMeaning: a bird that lives in dry, broken land and flat-topped hill country in the west of the United
  States and Mexico
scope: A bird of dry, broken land and flat-topped hill country in the west of the United States and Mexico,
  not a garden bird and not a bird of wet woods.
examples:
- A rock wren sang from the top of a flat-topped hill.
- We watched a rock wren hopping among the dry stones.
