simpleMeaning: a plan with many parts, made to trick people or to avoid something
scope: A plan made to trick people or to avoid something, not the verb sense of avoiding a duty or question,
  and not a clever statement that avoids a question.
examples:
- The tax dodge saved the rich company a lot of money.
- The whole story was a dodge to keep us from finding the truth.
