simpleMeaning: To drive a person or animal on, as if by poking them with a sharp stick
scope: To drive a person or animal on as if by poking them with a sharp stick; prick is another name for
  this sense; not to annoy someone with constant criticism, and not the pointed stick itself.
examples:
- Hunger goaded him to keep walking through the night.
- The rider goaded the horse on with a sharp stick.
