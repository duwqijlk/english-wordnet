simpleMeaning: A Chadic tongue spoken in northern Nigeria, above all in Plateau State, in the areas of
  Barakin-Ladi, Mangu and the town that shares its name.
scope: A Chadic tongue of northern Nigeria, also called Ron, Bokkos language, Daffo, Daffo language and
  Ron language; set apart from other Chadic tongues and from other tongues of northern Nigeria.
examples:
- Bokkos is spoken in Plateau State in northern Nigeria.
- Children in Bokkos learn Bokkos at home.
