simpleMeaning: the rank or standing of a person, or less often of a thing, compared with others in society
scope: This is rank or standing compared with others in a society, not a job, an opinion in an argument,
  or the situation someone happens to be in.
examples:
- Her family's position in society gave her access to the best schools.
- The award raised the young scientist's position among his peers.
