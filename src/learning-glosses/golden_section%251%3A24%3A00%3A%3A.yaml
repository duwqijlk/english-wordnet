simpleMeaning: Cut a line or a flat shape in two so the short part stands to the long part as the long
  part stands to the whole
scope: A set share when a line or flat shape is cut in two, also called golden mean, not a half and not
  a cut at any place.
examples:
- The golden section sets the short part against the long part in a fixed way.
- Builders have used the golden section to plan the front of a house.
