simpleMeaning: A mixture in which two or more substances are spread evenly through each other so you cannot
  see the separate parts; it is usually, though not always, a liquid.
scope: This is not an answer to a problem; it is a mixture of substances.
examples:
- Stir the salt until it forms a clear solution.
- The chemist added a few drops of the solution to the test tube.
