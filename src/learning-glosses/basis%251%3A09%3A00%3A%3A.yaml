simpleMeaning: the core ideas or beliefs on which something is started, built, worked out, or explained.
scope: This is not the physical bottom of an object and not the main reason for something; it is the set
  of ideas or beliefs that support how something is begun, developed, calculated, or explained.
examples:
- The forecast was calculated on the basis of last year's figures.
- The theory has a solid basis in careful observation.
