simpleMeaning: A strip of cloth wound round the leg to make a legging, as soldiers wore in the First World
  War.
scope: A cloth strip wound round the leg as soldiers wore in the First World War, not a boot and not a
  sock.
examples:
- The soldier wound his puttee round his calf.
- Puttees kept the mud out of their boots.
