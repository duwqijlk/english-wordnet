simpleMeaning: a substance made from histidine, a part of protein, that makes the stomach give off juice
  and widens blood tubes; the body's defence system frees it in allergic reactions
scope: A substance the body makes that makes the stomach give off juice and widens blood tubes, not a
  drug and not a food.
examples:
- Histamine is set free in the body during an allergic reaction.
- The drug blocks histamine so the patient's nose stops running.
