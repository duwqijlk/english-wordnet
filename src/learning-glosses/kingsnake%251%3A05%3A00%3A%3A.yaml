simpleMeaning: Any of many harmless North American animals that kill prey by squeezing it, feeding on
  other legless reptiles and small mammals.
scope: This is one of many harmless North American animals that kill prey by squeezing it, feeding on
  other legless reptiles and small mammals; king snake is another name for it, not a venomous snake and
  not a large python.
examples:
- The kingsnake squeezed its prey before swallowing it.
- Kingsnakes feed on other snakes and small mammals.
