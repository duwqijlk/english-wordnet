simpleMeaning: Swimmers in shallow water on both sides of the Atlantic may meet this fish, whose sharp,
  uneven teeth can be a danger at times.
scope: Sand tiger is another name for this fish of shallow water with sharp, uneven teeth, which can be
  a danger to swimmers at times but not always.
examples:
- A sand shark moved through the shallow water.
- Swimmers kept clear of the sand shark in the shallow water.
