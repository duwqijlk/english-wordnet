simpleMeaning: a legal process for a company that cannot pay its debts, meant to treat all the people
  it owes money to fairly
scope: This is the legal process for a company that cannot pay, not simply being unable to pay one's debts.
examples:
- The firm filed for bankruptcy after years of losses.
- Bankruptcy proceedings began when the company could not pay its suppliers.
