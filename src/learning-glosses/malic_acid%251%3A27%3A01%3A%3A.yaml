senseId: 'malic_acid%1:27:01::'
synsetId: 92406116-n
simpleMeaning: A compound made by all living things, with the chemical formula HO2CCH2CHOHCO2H, which
  gives many fruits their pleasantly sharp taste and is added to food.
scope: The sour-tasting fruit compound also used in foods; it is not citric acid from citrus fruit, nor
  tartaric acid.
examples:
- Malic acid gives green apples their sharp taste.
- The drink label lists malic acid as an additive.
