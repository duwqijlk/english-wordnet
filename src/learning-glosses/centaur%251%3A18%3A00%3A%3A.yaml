simpleMeaning: In the very old stories of Greece and Rome (classical mythology), a being that is not real
  and is half man and half horse
scope: A being from old stories that is half man and half horse; not a real animal and not a man riding
  a horse.
examples:
- The old story tells of a centaur who lived deep in the forest.
- A centaur has the head and upper body of a man and the body of a horse.
