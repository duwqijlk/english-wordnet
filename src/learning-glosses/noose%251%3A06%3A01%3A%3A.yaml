simpleMeaning: A loop made in a cord or rope with a slipknot, which pulls tighter as the cord is pulled.
scope: A loop in a cord or rope that pulls tighter when pulled, not a trap for birds or small animals,
  and not the act of tying one.
examples:
- He tied a noose in the end of the rope.
- The noose tightened as he pulled the cord.
