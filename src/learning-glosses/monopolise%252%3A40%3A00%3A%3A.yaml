senseId: 'monopolise%2:40:00::'
synsetId: 02209024-v
simpleMeaning: to be the only one in control of something, and to use that control to one's own gain
scope: To be the only one in control of something and use that control for gain, also called monopolize;
  not to share a market and not to compete on equal terms.
examples:
- The firm tried to monopolise the supply of coal in the region.
- OPEC wants to monopolise oil.
