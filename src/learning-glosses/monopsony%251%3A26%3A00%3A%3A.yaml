schema: oewn-learning-gloss-v2
senseId: 'monopsony%1:26:00::'
synsetId: 14468110-n
simpleMeaning: In economics, one buyer faces many sellers in a market for goods or services
scope: A market with one buyer and many sellers, not a market with one seller and not a market with many
  buyers.
examples:
- With only one mill in town, the farmers faced a monopsony when they sold their grain.
- The monopsony let the single buyer set the price for the wool.
