senseId: 'piperocaine_hydrochloride%1:06:00::'
synsetId: 03953209-n
simpleMeaning: Feeling is taken away in one small part of the body, or in the lower half, by this stuff
  in its salt form
scope: Also called piperocaine, this stuff takes away feeling in one small part of the body or in the
  lower half, not a drug that puts the whole body to sleep and not a painkiller swallowed as a pill.
examples:
- The nurse gave piperocaine hydrochloride to take away feeling in one small part of the leg.
- Piperocaine hydrochloride left the lower half of his body without feeling.
