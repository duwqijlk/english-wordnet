simpleMeaning: Stones are thrown at a person to punish them, and the blows can go on until the person
  dies.
scope: People also call it stoning, the punishment in which stones are thrown at a person, even until
  death.
examples:
- They punished him by lapidation.
- The victim died under lapidation.
