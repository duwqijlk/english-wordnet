simpleMeaning: A carrying-on from the left rising low-back vein, crossing the mid-line at the eighth spine
  bone and emptying into the azygos vein.
scope: This sense is also called hemizygos vein and hemizygous vein.
examples:
- A vena hemizygos emptied into the azygos vein.
- The vena hemizygos crosses the mid-line and empties into the azygos vein.
