simpleMeaning: a wild party or meeting where people drink too much and have sex with many different people
scope: 'Also called riot, orgy, debauch, saturnalia, bacchanal and bacchanalia: a wild gathering with
  too much drinking and sex with many people, not a quiet party with a little drinking.'
examples:
- The party turned into debauchery, with guests drinking bottle after bottle and having sex with people
  they had just met.
- He spent the weekend in debauchery at a wild house party full of drink and sex with many different people.
