simpleMeaning: In physics, the thought that space and time are not fixed and set, but change with how
  they are seen
scope: 'Also called relativity and theory of relativity: in physics, the thought that space and time are
  not fixed, not the old thought that space and time never change and not a rule for how things move.'
examples:
- Relativity theory says time runs at a different rate for a fast-moving clock.
- Relativity theory says space and time are not the same for everyone.
