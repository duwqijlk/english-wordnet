simpleMeaning: In finance, not owning the shares, bonds or commodities one has sold because one expects
  their price to fall.
scope: This is a financial position, not small in length, not low in height, not brief in time, not lacking
  enough of something, not a brief speech sound, not a poor memory, not a lack of foresight, not rude
  in manner, not a baseball fielding position, and not an electrical fault.
examples:
- The trader is short in cotton, betting that prices will fall.
- Investors who are short in a commodity profit when its price drops.
