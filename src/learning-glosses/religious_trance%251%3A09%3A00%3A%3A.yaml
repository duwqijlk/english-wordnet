simpleMeaning: Unlike other such states, the body keeps working as usual in this deep, dream-like state,
  which strong worship brings on.
scope: This is a deep, dream-like state brought on by strong worship, also called ecstatic state, not
  a state in which the body slows down.
examples:
- In a religious trance, she stood still with her eyes closed, lost in prayer.
- His religious trance came on during the long hours of worship.
