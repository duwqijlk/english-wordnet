simpleMeaning: Feather-like leaves crown this palm of tropical America, whose trunk swells out and bears
  sharp points, and whose nuts people can eat.
scope: Also called gri-gri, grugru, and a grugru palm; a feather palm of tropical America with a swollen
  spiny trunk and nuts that people can eat.
examples:
- The macamba had a swollen trunk ringed with spines.
- We cracked open the nuts of a macamba and ate them.
