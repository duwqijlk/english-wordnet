simpleMeaning: An eye surgery that changes the shape of the clear front of the eye so it bends light better,
  making a flap with a hinge in its thin top layer
scope: LASEK and laser-assisted subepithelial keratomileusis are other names for this sense, a surgery
  that works on the clear front surface of the eye and lifts a hinged flap from its thin top layer.
examples:
- E-LASIK changed the shape of her cornea.
- He had E-LASIK to see better.
