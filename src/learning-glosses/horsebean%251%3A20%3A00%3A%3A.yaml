simpleMeaning: Spiny shrub or tree with tiny leaflets and fragrant yellow-orange flower clusters; used
  in gardens or hedges, or as emergency livestock feed; from tropical America, common in the southern
  US.
scope: The spiny tropical American shrub grown as a hedge or fodder plant; not the horsebean seed, which
  is the broad bean eaten as food.
examples:
- They planted horsebean along the boundary as a living fence.
- The horsebean's yellow-orange flowers were visited by bees all afternoon.
