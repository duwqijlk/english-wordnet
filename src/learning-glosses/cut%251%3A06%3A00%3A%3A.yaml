simpleMeaning: a long, narrow ditch made in the ground by digging or by water wearing it away.
scope: This is not an injury from a knife or a lower price; it is a long, narrow ditch in the ground.
examples:
- The railway runs through a deep cut in the hillside.
- Water had worn a cut through the soft earth.
