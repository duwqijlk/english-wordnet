simpleMeaning: a cut in the number of a firm's shares that are out in the world, while what each owner
  holds in worth stays the same
scope: Not a rise in share price, and not a cut in what owners are owed; also called reverse stock split
  and split down.
examples:
- The firm did a reverse split to lift its share price.
- After the reverse split, each holder owned fewer shares.
