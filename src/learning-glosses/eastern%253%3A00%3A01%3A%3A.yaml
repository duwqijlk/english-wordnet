simpleMeaning: of or typical of regions in the part of the world where the sun rises
scope: This is about the eastern regions of the world and their cultures, as in Eastern Europe or Asian
  religions, not about something lying to the east of a place, coming from the east as a wind, or belonging
  to the eastern United States.
examples:
- Eastern Europe has changed greatly since the fall of communism.
- She studied Eastern religions and philosophy at university.
