simpleMeaning: needed because a duty, strong force, or a usual custom makes you do it
scope: A thing that must be done because of duty, force or custom, not the sense that only says a moral
  or legal duty binds a person.
examples:
- Attendance at the safety class is obligatory for all new workers.
- He gave the obligatory smile and shook hands with each guest.
