simpleMeaning: To put out new growth, such as buds or small branches, or to begin growing from a seed.
scope: This is about a plant putting out new buds or branches, not the noun for a new branch and not sending
  something out in a sudden burst.
examples:
- The roses will shoot again in spring if you prune them now.
- The potatoes had already begun to shoot before we planted them.
