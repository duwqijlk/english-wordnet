simpleMeaning: How an act or a piece of writing makes plain what its maker thinks and takes for granted.
scope: The attitude an act or piece of writing conveys, not the atmosphere of a place or situation, the
  character of a voice or sound, or a shade of color.
examples:
- I could tell from the tone of her email that she was annoyed.
- The report's tone was cautious and noncommittal.
