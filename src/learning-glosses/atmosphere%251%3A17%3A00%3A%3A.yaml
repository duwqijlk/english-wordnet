simpleMeaning: the layer of gases that surrounds a planet, a star, or any other body in space
scope: The gases around a body in space, not a unit of pressure and not the feeling or mood that surrounds
  a person or place.
examples:
- The Earth has an atmosphere that we can breathe.
- Mars has a very thin atmosphere.
