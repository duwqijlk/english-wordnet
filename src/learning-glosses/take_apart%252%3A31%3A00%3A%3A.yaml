simpleMeaning: to study a thing in maths, chemistry, or grammar by breaking it into its parts and main
  features
scope: This is to study a thing by breaking it into its parts and main features; analyze, dissect, analyse
  and break down are other names for this sense, and it is not pulling a machine to pieces or feeling
  upset.
examples:
- The teacher asked us to take apart the long sentence into its parts.
- We took apart the chemical sample to see what it was made of.
