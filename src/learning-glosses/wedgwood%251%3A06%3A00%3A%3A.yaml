simpleMeaning: Pottery made by the man whose name it bears and those who came after him, often with white
  figures in the old Greek and Roman style on blue.
scope: This pottery is set apart by its maker and his successors, and often by white figures in the old
  Greek and Roman style on blue.
examples:
- The vase was fine Wedgwood.
- She collected Wedgwood plates.
