simpleMeaning: a person kept by one group so that another group will do what the first group asks
scope: This is a person held so others will meet set terms, not a prisoner kept as a punishment for a
  crime.
examples:
- The bank robbers took one hostage and asked for a car to escape.
- Police talked for hours to free the hostage held in the shop.
