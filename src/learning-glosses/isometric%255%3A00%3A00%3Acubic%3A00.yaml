simpleMeaning: Of a crystal built on three lines of the same length that meet squarely
scope: A crystal built on three equal lines meeting squarely, not a muscle that holds its length and not
  a crystal built on unequal lines.
examples:
- Salt forms isometric crystals with three equal axes.
- The isometric system has three axes at right angles.
