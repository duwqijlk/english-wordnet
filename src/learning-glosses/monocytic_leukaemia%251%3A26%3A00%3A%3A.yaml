simpleMeaning: A sickness of the blood in which one kind of white blood cell, and its young form, grow
  in number in the blood
scope: A sickness of the blood in which one kind of white blood cell and its young form grow in number;
  histiocytic leukaemia, histiocytic leukemia, monoblastic leukaemia, monoblastic leukemia and monocytic
  leukemia are other names for this, not a blood sickness with too few white cells.
examples:
- The blood test showed monocytic leukaemia.
- Monocytic leukaemia fills the blood with young white cells.
