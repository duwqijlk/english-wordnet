simpleMeaning: A sign that a part of the body has pus in it or is making pus
scope: A sign that a part of the body has pus in it; also called purulence. Not the pus itself and not
  a clean wound with no pus.
examples:
- The purulency of the sore worried the nurse.
- He cleaned the wound when he saw purulency in it.
