simpleMeaning: the quality of living at home and caring for home life, or of an animal that lives with
  people and is not wild
scope: This is the quality of living at home or, for an animal, living with people and not being wild,
  not the home activities and home life themselves.
examples:
- After years of travel, she enjoyed the quiet domesticity of her small home.
- The dog showed its domesticity by living calmly in the house with the family.
