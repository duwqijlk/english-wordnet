simpleMeaning: In physics, the idea that space and time are not fixed and the same for all, but differ
  for different people
scope: 'Also called relativity and relativity theory: the idea that space and time are not fixed, not
  the special form about fast-moving things and not the general form about gravity.'
examples:
- Einstein's theory of relativity changed how scientists think about space and time.
- The theory of relativity says that time can pass at different rates for different people.
