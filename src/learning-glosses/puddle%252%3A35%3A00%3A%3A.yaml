simpleMeaning: to play about in a liquid or a thick, soft mix, with no serious purpose
scope: This is playing about in a liquid or a thick mix, not working wet concrete or mud for a job, not
  dipping plants in mud, and not the clay and sand pond mix.
examples:
- The children puddled in the paint, getting it all over their hands.
- She puddled in the wet clay just for fun.
