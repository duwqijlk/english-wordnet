senseId: 'hysterics%1:26:00::'
synsetId: 14106466-n
simpleMeaning: a sudden time when a person cries, shouts or laughs and cannot stop, because their feelings
  are too strong
scope: A sudden loss of control over strong feelings; not just feeling very sad for a long time, and not
  laughing in a normal, happy way.
examples:
- When she heard the bad news, she went into hysterics.
- The child fell into hysterics and could not stop crying.
