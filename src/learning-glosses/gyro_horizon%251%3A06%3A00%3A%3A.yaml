senseId: 'gyro_horizon%1:06:00::'
synsetId: 02748616-n
simpleMeaning: The pilot sees a false line where sky meets land, made by a tool built round a fast-spinning
  wheel that stays steady.
scope: Also called an artificial horizon and a flight indicator, this tool gives the pilot a false line
  where sky meets land, not the real line.
examples:
- The gyro horizon showed a level line.
- The pilot checked the gyro horizon and saw a false line where sky meets land.
