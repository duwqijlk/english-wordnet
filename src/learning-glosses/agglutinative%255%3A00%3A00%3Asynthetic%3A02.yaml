simpleMeaning: In some languages, words grow by sticking small parts together, each part keeping one clear
  meaning of its own.
scope: This way of building words, also called polysynthetic, joins small parts so that each one keeps
  a single clear meaning of its own.
examples:
- Turkish is often called an agglutinative language.
- The class studied agglutinative words built from small parts.
