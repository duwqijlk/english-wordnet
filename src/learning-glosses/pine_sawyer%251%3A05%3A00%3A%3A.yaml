simpleMeaning: A large beetle whose young bore holes in the wood of evergreen trees with needles.
scope: This is a large beetle whose young bore holes in the wood of evergreen trees with needles; not
  a small beetle, and not a beetle whose young eat leaves.
examples:
- The pine sawyer laid eggs in the dead tree.
- Pine sawyers bore holes in the logs.
