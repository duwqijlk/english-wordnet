simpleMeaning: One of the five main kinds of protein that fights sickness, this kind is the main guard
  against bacteria.
scope: Also called IgG, this is the kind of protein that fights sickness that guards most of all against
  bacteria, not the kind found only in a small amount in the blood and not any other of the five kinds.
examples:
- Immunoglobulin G is the body's main defense against bacteria.
- After the infection, her levels of immunoglobulin G rose sharply.
