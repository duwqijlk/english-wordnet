simpleMeaning: the act of loosening the ties that hold something in place
scope: 'Also called undoing and unfastening: the act of loosening the ties that hold something in place,
  not the act of tying them or cutting them.'
examples:
- Untying the knots took longer than she expected.
- The untying of his shoes was slow because the laces were wet.
