simpleMeaning: A cloth dressing that covers the head or the end of a cut-off limb, shaped like a cap.
scope: A cloth dressing that covers the head or a cut-off limb like a cap, not an ordinary wound dressing
  and not a hat.
examples:
- The nurse fixed a capeline bandage over the patient's head.
- A capeline bandage covered the stump after the operation.
