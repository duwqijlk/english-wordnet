simpleMeaning: the number written as a one followed by twelve zeros; in Britain the American use is often
  seen
scope: The number written as a one followed by twelve zeros, also called a billion and one million million;
  not a million and not a hundred thousand.
examples:
- 1000000000000 is a one followed by twelve zeros.
- The sum was put at 1000000000000 dollars.
