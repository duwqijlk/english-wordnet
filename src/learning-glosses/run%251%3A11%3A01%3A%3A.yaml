simpleMeaning: A row of stitches that have come undone in knitted fabric or a stocking.
scope: This is a ladder of undone stitches in fabric, not a flow of liquid or a series of events.
examples:
- A run in her tights spread up her leg.
- She stopped the run in her stocking with clear nail polish.
