simpleMeaning: A stiff-branched plant of the Old World that lives for one year, with pale yellow flowers;
  it now grows wild across North America and was once used as medicine
scope: This is a stiff plant that now grows wild in North America, not a mustard grown for its seeds.
examples:
- Hedge mustard grows along the roadside with pale yellow flowers.
- Hedge mustard was once used as medicine.
