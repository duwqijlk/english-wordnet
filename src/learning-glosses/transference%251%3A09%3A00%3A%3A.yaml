simpleMeaning: In psychoanalysis (talking treatment for the mind), the way feelings for one person, usually
  a parent, come to be felt for the person giving the treatment instead
scope: 'This is the psychoanalysis sense: feelings meant for someone else are felt for the person giving
  the treatment. It is not about handing over ownership of something, and not about changing something
  from one form to another.'
examples:
- After a few weeks of treatment, transference set in and she felt toward her analyst the anger she felt
  toward her father.
- The analyst explained that the patient's strong feelings for her were transference, not real love.
