simpleMeaning: A box where coins fresh from the mint are kept until they are tested for weight and purity.
scope: A box where coins fresh from the mint are kept until they are tested for weight and purity; pix
  is another name for this sense, not a strongbox and not an ordinary money box.
examples:
- The pix chest held the new coins until the assay.
- They locked the pix chest and waited for the test.
