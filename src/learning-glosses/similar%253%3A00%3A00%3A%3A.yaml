simpleMeaning: almost the same as another thing, but not exactly.
scope: Not the use where two things are said to be alike with 'in'; this sense compares one thing with
  another, usually with 'to'.
examples:
- Her new job is similar to her old one.
- We found a house similar to the one we sold.
