simpleMeaning: From warm and mild lands, a plant of the water with large leaves and showy, sweet-smelling
  flowers that float on the water
scope: Also called fragrant water lily and water nymph, this is a water plant with large leaves and showy,
  sweet-smelling floating flowers, from warm and mild lands, not a lily of dry ground.
examples:
- The pond lily floated on the water with large leaves and showy flowers.
- The pond lily grows in warm and mild lands.
