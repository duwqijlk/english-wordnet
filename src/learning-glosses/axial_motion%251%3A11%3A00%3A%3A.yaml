simpleMeaning: the turning of a thing around a line through its own middle
scope: 'Also called axial rotation and roll: a thing turning around its own middle line, not a thing moving
  in a straight line and not a thing shaking from side to side.'
examples:
- The axial motion of the wheels kept the car moving forward.
- You can see the axial motion of the top as it spins.
