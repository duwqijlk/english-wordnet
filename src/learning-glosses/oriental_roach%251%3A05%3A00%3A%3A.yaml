simpleMeaning: This bug first lived in the east; it is dark brown and now found in most parts of the world
scope: A dark brown bug first from the east and now found in most parts of the world, also called blackbeetle
  and oriental cockroach; not a light brown bug and not a bug found only in one place.
examples:
- An oriental roach scuttled across the kitchen floor at night.
- The oriental roach now lives in houses in most parts of the world.
