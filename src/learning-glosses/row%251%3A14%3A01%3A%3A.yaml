simpleMeaning: numbers, letters, or symbols set out in a straight line, one beside the next.
scope: This is a line of figures or characters, not objects or people arranged side by side, not a stretch
  of consecutive time, and not a long thin strip of material.
examples:
- Each row in the table holds the scores for one student.
- Write the numbers in the first row of the grid.
