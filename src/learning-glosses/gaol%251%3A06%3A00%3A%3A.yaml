senseId: 'gaol%1:06:00::'
synsetId: 03597432-n
simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: The British spelling of jail, another name for the same place; not the verb meaning to put someone
  in prison.
examples:
- The thief was sent to gaol for six months.
- Conditions in the town gaol were damp and overcrowded.
