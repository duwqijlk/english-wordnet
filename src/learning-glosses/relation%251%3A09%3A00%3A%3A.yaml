simpleMeaning: In law, the rule that an act done later is counted as if it was done at an earlier time
scope: In law, this is the rule about an act counting from an earlier time, not a person in your family
  and not the link between two things.
examples:
- His lawyer argued for relation back, so the new complaint counted from the date of the first one.
- The court allowed relation back of the amended claim to the day it was first filed.
