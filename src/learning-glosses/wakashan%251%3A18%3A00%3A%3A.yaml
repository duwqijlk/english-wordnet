simpleMeaning: A member of one of the peoples of British Columbia and Washington who speak the language
  of that name.
scope: A member of one of the peoples of British Columbia and Washington who speak the language of that
  name; this is the people sense, not the name of the family of languages.
examples:
- He is a Wakashan from British Columbia.
- The Wakashan peoples live in British Columbia and Washington.
