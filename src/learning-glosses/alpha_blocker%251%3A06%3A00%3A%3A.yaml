simpleMeaning: One of various drugs that stop alpha-adrenergic receptors from working, given for a swollen
  prostate to loosen the muscles around the bladder and prostate.
scope: Also called alpha-blocker, alpha-adrenergic blocker, and alpha-adrenergic blocking agent, one of
  various drugs that stop alpha-adrenergic receptors from working, given for a swollen prostate to loosen
  the muscles around the bladder and prostate.
examples:
- Alpha blockers ease the prostate.
- The doctor gave alpha blockers.
