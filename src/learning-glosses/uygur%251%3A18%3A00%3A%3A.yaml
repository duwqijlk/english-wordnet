simpleMeaning: In Xinjiang and the lands near it live a people who speak Uighur; one of them is this.
scope: Also called Uighur and Uigur, this is one of a people who speak Uighur and live in Xinjiang and
  nearby lands, not the tongue they speak and not the writing they use.
examples:
- The Uygur farmer spoke Uighur with his neighbours.
- Many Uygur families live in Xinjiang and the lands near it.
