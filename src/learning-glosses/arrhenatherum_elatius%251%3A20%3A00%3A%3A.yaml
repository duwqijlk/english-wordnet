simpleMeaning: A rough long-lived grass from Europe and Asia that looks like oat; it grows on road edges,
  rough grassland, and hay fields, brought to North America to feed farm animals.
scope: Also called evergreen grass, false oat, tall meadow grass, tall oat grass, and French rye; a rough
  grass that looks like oat, not a soft lawn grass and not a grain crop grown for food.
examples:
- Arrhenatherum elatius grows along the roadside in summer.
- The farmer cut Arrhenatherum elatius for hay.
