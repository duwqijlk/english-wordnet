simpleMeaning: The government may keep secret the name of a person who gives it secret news
scope: The government's right to keep an informer's name secret; not the right to stay silent in court
  and not the protection of a witness.
examples:
- The informer's privilege kept the police source's name out of the trial.
- Because of informer's privilege, the court never learned who had tipped off the police.
