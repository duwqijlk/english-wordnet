simpleMeaning: 'a memory trouble in people of middle age and older: a spell of forgetting and confusion
  lasting some hours, while the person stays awake and thinks clearly'
scope: A short spell of forgetting in older people, not lasting memory loss and not confusion from a stroke.
examples:
- Transient global amnesia left him unable to recall the morning.
- She had transient global amnesia for a few hours, then her memory came back.
