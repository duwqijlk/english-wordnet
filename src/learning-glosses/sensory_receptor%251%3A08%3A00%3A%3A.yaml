simpleMeaning: Nerve ends in the skin, the inner parts, or the eye, ear, nose, or mouth let this body
  part answer when something touches or stirs it.
scope: Also called sense organ and receptor, this body part answers through nerve ends in the skin, the
  inner parts, or the eye, ear, nose, or mouth when something touches or stirs it.
examples:
- A sensory receptor in the skin felt the touch.
- Sensory receptors in the nose caught the smell.
