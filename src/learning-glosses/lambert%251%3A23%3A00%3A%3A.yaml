simpleMeaning: A cgs unit of brightness, equal to the brightness of a surface that spreads light evenly
  and gives off or throws back one lumen for each square centimeter.
scope: A unit for measuring brightness, not a kind of lamp or light.
examples:
- The brightness was given as two lamberts.
- Engineers still quote the lambert in some old tables.
