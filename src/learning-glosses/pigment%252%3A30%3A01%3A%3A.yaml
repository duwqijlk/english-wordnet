simpleMeaning: to come to have coloring substance and become colored, filled with color
scope: This sense is about a thing itself coming to have color and becoming colored, not a coloring substance
  itself and not putting color on something else.
examples:
- The skin around the scar began to pigment over time.
- As the fruit ripens, its skin pigments and turns dark.
