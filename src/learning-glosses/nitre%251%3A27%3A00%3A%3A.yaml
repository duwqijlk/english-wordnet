simpleMeaning: a chemical (KNO3) used especially for helping plants grow and for making explosions
scope: Also called niter. This is one named chemical used especially to help plants grow and to make explosions,
  not any plant food and not any substance that blows up.
examples:
- Farmers once used nitre to help their crops grow well.
- Nitre was also used in making gunpowder.
