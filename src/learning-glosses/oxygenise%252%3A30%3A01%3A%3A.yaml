simpleMeaning: To take hydrogen away from a substance by using oxygen
scope: To take hydrogen away from a substance by using oxygen; oxygenize is another name for this sense,
  not to add oxygen to a substance and not to take oxygen away.
examples:
- The chemist will oxygenise the compound in the lab.
- They oxygenise the gas to remove its hydrogen.
