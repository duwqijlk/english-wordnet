senseId: 'parity%1:24:00::'
synsetId: 13812345-n
simpleMeaning: 'In mathematics, a link between two whole numbers: both odd or both even means they match;
  one odd and one even means they do not'
scope: This is the mathematics sense, about two whole numbers matching as odd or even, not the physics
  sense and not the sense that counts how many live babies a woman has had.
examples:
- In maths, 4 and 6 have the same parity because both are even.
- 7 and 8 have different parity because one is odd and the other is even.
