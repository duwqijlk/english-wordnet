simpleMeaning: In business, done in a way that is not fair or honest and not within the rules
scope: This is about business done outside the rules in an unfair or dishonest way, not the wild animal
  like a small cat, and not a mine or oil well dug to test an unknown area.
examples:
- The wildcat insurance plans took people's money and paid out nothing.
- Banks ran wildcat schemes that were outside the law.
