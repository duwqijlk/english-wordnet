simpleMeaning: a small animal from the west of North America that lives near water and has a part like
  a tail used for mating
scope: This is a small animal from the west of North America with a tail-like part used for mating; bell
  toad, ribbed toad and tailed toad are other names for this sense, not an ordinary frog without such
  a part.
examples:
- The tailed frog lives in cold streams in the west.
- A tailed frog has a small part like a tail.
