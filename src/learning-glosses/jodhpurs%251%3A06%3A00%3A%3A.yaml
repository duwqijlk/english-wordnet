simpleMeaning: Trousers that flare out and end at the calves, worn with riding boots, and used in the
  plural.
scope: Also called jodhpur breeches and riding breeches, these are flared trousers ending at the calves,
  worn with riding boots.
examples:
- She pulled on her jodhpurs and riding boots.
- The jodhpurs flared at the thigh and ended at the calf.
