simpleMeaning: When babies lose their mother and no good one takes her place, a deep low state of mind
  grows worse and worse in them.
scope: It is the deep low state of mind that grows worse in babies who lose their mother and get no good
  one in her place.
examples:
- The baby showed anaclitic depression after losing its mother.
- For babies who had lost their mothers and found no good one in their place, anaclitic depression set
  in.
