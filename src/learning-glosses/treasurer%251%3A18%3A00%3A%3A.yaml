simpleMeaning: a person in a group or office whose job is to take in money and pay it out
scope: The person who looks after a group's money, taking it in and paying it out, not the place where
  money is kept and not a person who only counts money.
examples:
- The club treasurer paid the bills and kept a record of the money.
- She was chosen as treasurer because she was good with money.
