simpleMeaning: in a way that does not bend or move easily
scope: 'Also called stiff: done in a way that does not bend or move easily, not in a loose or free way.'
examples:
- His hands lay stiffly on the table and did not move.
- He walked stiffly after the long run, his legs hard to move.
