simpleMeaning: Bitter and angry feelings when someone else does well, shown as a person and counted as
  one of the deadly sins
scope: Bitter, angry feelings at another person's success, shown as a person; envy is another name for
  this sense, not simple jealousy and not anger in general.
examples:
- Seeing her rival win the prize filled him with invidia.
- The old tale shows Invidia as one of the deadly sins.
