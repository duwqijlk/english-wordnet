simpleMeaning: A male person who stands in for a true male parent and does all his tasks.
scope: A male person who stands in for a true male parent and does all his tasks; father figure is another
  name for this sense, not a true male parent and not a person who merely looks like one.
examples:
- After his father died, his uncle became a father surrogate.
- The priest acted as a father surrogate for the boys.
