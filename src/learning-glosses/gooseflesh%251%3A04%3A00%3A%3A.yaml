simpleMeaning: a change in the skin that happens by itself, when its hairs stand up because of cold, fear
  or strong feelings, or skin that is sore, itchy, or rubbed
scope: 'Also called goosebump: the standing up of the small hairs on a person''s skin, not the skin of
  a real goose and not just the feeling of being cold.'
examples:
- The cold wind gave her gooseflesh on her arms.
- The scary story gave me gooseflesh all over.
