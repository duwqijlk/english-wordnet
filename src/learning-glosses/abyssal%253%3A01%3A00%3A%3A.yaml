simpleMeaning: Of the sea depths between 2,000 and 5,000 metres down.
scope: This sense is of the sea depths between 2,000 and 5,000 metres down, unlike the sense for what
  is like an abyss in depth, so deep as to be past measuring.
examples:
- The zone was abyssal, lying 3,000 metres down.
- The depths were abyssal, from 2,000 to 5,000 metres down.
