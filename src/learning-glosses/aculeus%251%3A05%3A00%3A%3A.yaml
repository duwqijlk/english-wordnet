simpleMeaning: A sharp point on a living thing, above all the sting of a bee, wasp, or ant.
scope: A sharp point on an animal, above all an insect sting, not a thorn on a plant and not a tooth or
  claw.
examples:
- The bee drove its aculeus into the skin.
- Some plants carry sharp points, but an aculeus belongs to an animal.
