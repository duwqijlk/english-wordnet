simpleMeaning: The part of the chess board set out before the game that a piece which started the game
  must reach to be made into a stronger piece
scope: The part of the board a piece must reach to be made stronger; not the whole board and not the square
  where the piece starts.
examples:
- The pawn crossed into the promotion zone on the last rank.
- Once a pawn enters the promotion zone, it can become a queen.
