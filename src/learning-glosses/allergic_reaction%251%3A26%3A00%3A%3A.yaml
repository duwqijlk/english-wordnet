simpleMeaning: One thing sets the body off and its answer comes back over-strong, slight one time and
  hard the next.
scope: Also called allergy, the name marks the body's over-strong answer itself, not the thing that sets
  it off.
examples:
- The allergic reaction to pollen was mild.
- Another allergic reaction to the same thing hit much harder.
