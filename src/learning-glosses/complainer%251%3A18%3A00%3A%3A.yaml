simpleMeaning: A person who goes on and on with complaints, crying and whining far too much.
scope: Also called a crybaby, a whiner, a grumbler, and a moaner; a person given to endless complaints,
  crying, and whining.
examples:
- The complainer moaned about the food all evening.
- No one likes a complainer who whines over every small thing.
