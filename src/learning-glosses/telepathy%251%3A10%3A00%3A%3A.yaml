simpleMeaning: what seems to be thoughts passing from one mind to another, without the use of the senses
scope: What seems to be thoughts passing from mind to mind without the senses, not a spoken message and
  not a guess about what someone thinks.
examples:
- She claimed a kind of telepathy with her twin, knowing what he thought.
- He said the answer came to him by telepathy, with no words spoken and nothing seen or heard.
