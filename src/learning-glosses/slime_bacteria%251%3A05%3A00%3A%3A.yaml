simpleMeaning: In damp earth, rotting plants, or animal dung live tiny living things that group together
  in a sticky wet coat of their own making.
scope: Also called gliding bacteria, myxobacter, myxobacteria, and myxobacterium, they live in damp earth,
  rotting plants, or animal dung, grouped in a sticky wet coat of their own making.
examples:
- In damp earth, slime bacteria group together in a sticky wet coat.
- Colonies of slime bacteria grow in the sticky coat they make themselves.
