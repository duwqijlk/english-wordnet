simpleMeaning: words or a saying whose meaning cannot be worked out from what is around it
scope: This is words or a saying whose meaning cannot be worked out from what is around it; it is not
  just a hard word, and not unclearness because a word has more than one meaning.
examples:
- The ambiguity in that short sentence made it impossible to know who did it.
- Because of its ambiguity, the note could not be understood from the rest of the letter.
