simpleMeaning: a storm that comes when air rises in strong streams, bringing hard rain or hail, thunder,
  and flashes of lightning
scope: A storm with thunder and lightning and heavy rain or hail, not a plain rain shower and not a storm
  of wind alone.
examples:
- The thunderstorm brought heavy rain and loud thunder.
- We stayed inside while the thunderstorm passed over the town.
