simpleMeaning: The main and official tongue of Ethiopia; a Semitic tongue much shaped by the Cushitic
  tongue with which the Amhara have been in close touch.
scope: 'Also called Amharic language or Ethiopian language: the main and official tongue of Ethiopia,
  a Semitic tongue much shaped by the Cushitic tongue, set apart from the adjective sense of the same
  word by its use as a tongue.'
examples:
- Amharic is the official language of Ethiopia.
- She speaks Amharic with her family.
