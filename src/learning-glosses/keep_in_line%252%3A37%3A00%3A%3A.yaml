simpleMeaning: Usually for your own gain, to control in a clever way what other people do or what you
  do yourself
scope: 'Also called control or manipulate: to steer what others or you yourself do in a clever way, usually
  for your own gain, not to remember something and not to hold a switch in place.'
examples:
- The teacher knew how to keep the class in line.
- She keeps her children in line by setting clear rules.
