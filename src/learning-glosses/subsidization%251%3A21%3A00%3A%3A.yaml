simpleMeaning: money, or help of another kind, received as a payment that supports the one who gets it
scope: Money, or help of another kind, received as a payment that supports a person or business; subsidisation
  is another name for this sense, not the act of giving such a payment.
examples:
- The theatre welcomed the subsidization it received from the city.
- The airline relied on subsidization to stay open.
