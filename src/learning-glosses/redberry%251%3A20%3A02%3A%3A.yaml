simpleMeaning: A herb from North America that lives for years, turn-set leaves of leaflets, small white
  blooms in sprays, oval berries, bright red, able to poison.
scope: Also called red-berry, red baneberry, and snakeberry, it is a herb from North America that lives
  for years, turn-set leaves of leaflets, small white blooms in sprays, oval berries, bright red, able
  to poison, unlike the sense for a small spiny evergreen shrub of the western United States and Mexico
  with tiny flowers and bright red berries.
examples:
- Redberry bears oval berries, bright red, able to poison.
- Redberry lives for years.
