simpleMeaning: a wheel with sharp points around its edge, used to make a row of holes in something
scope: This sense is the small wheel with sharp points used to make a row of holes. It is not the game
  where people bet money on where a ball will stop.
examples:
- She used a roulette to make a row of holes in the paper.
- The roulette's small teeth cut neat holes along the line.
