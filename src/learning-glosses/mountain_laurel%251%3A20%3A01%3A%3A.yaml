simpleMeaning: a North American shrub that stays green all year, with shiny leaves and white or pink flowers
scope: 'Also called a calico bush or a wood laurel: a North American shrub that stays green all year,
  with shiny leaves and white or pink flowers; not the Pacific coast tree of the same name.'
examples:
- The mountain laurel bloomed white in the spring.
- Mountain laurel keeps its shiny leaves through the winter.
