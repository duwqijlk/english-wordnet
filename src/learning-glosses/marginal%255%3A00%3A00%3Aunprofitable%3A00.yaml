simpleMeaning: making or growing things at a speed or amount that only just pays for the cost of making
  or growing them
scope: About making or growing just enough to cover costs; not at the edge of a page or of land, and not
  small or unimportant.
examples:
- Marginal farms in the dry hills barely earn enough to cover what it costs to run them.
- The small factory was only marginal, making just enough to pay for its workers and materials.
