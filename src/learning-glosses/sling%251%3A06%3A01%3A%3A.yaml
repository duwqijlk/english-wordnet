simpleMeaning: a toy made from a Y-shaped stick with stretchy bands between its two top ends, used to
  shoot small stones
scope: 'Also called a catapult: a Y-shaped toy stick used to shoot small stones, not the cloth for a hurt
  arm and not the strap weapon.'
examples:
- The boy used a sling to shoot small stones at the tin cans.
- He made a sling from a forked stick and stretchy bands.
