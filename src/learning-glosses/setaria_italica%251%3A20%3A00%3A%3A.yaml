simpleMeaning: A coarse grass that resists drought and lives one year, grown for grain, hay, and fodder
  in Europe and Asia and chiefly for fodder and hay in the United States.
scope: Also called foxtail millet, Hungarian grass, and Italian millet; not a lawn grass and not a grain
  grown only for bread.
examples:
- The Setaria italica stood coarse and dry in the field.
- Farmers grew Setaria italica for hay and fodder.
