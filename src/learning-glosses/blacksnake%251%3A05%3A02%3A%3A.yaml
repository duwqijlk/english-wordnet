simpleMeaning: a large harmless shiny dark North American animal with a long body and no legs
scope: Also called the black rat snake, the mountain blacksnake and the pilot blacksnake, a large harmless
  shiny dark North American animal with a long body and no legs, not a poisonous snake and not a small
  dark snake from another place.
examples:
- A blacksnake slid across the path and into the tall grass.
- The blacksnake lay in the sun on the warm rock.
