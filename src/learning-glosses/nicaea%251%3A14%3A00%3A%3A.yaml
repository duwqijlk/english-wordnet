simpleMeaning: The first church-wide meeting in 325, which wrote the words of the Nicene Creed and spoke
  against the false teaching of Arius.
scope: The first church-wide meeting in 325, also called First Council of Nicaea; not the later church-wide
  meeting in 787, which dealt with holy images.
examples:
- Nicaea met in 325.
- The creed was written at Nicaea.
