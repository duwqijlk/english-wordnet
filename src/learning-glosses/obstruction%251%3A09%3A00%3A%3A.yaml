simpleMeaning: something that is not a thing you can touch, but stops progress and must be gone around
  or got over
scope: 'Also called obstacle: a difficulty that is not a thing you can touch and blocks progress, not
  a block in a passage and not the act of blocking something.'
examples:
- Lack of money was a major obstruction to the success of their plan.
- His fear was an obstruction to his progress at work.
