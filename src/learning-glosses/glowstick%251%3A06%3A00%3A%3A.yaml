simpleMeaning: When the tube is broken, the stuff inside it gives off light; the tube is small and made
  of plastic
scope: A small plastic tube that lights up when broken, also called a lightstick, not a torch and not
  a tube that lights up with power from a wire.
examples:
- She cracked the glowstick and it gave off a green light at the party.
- The children waved their glowsticks in the dark.
