senseId: 'suppresser%1:08:00::'
synsetId: 05449044-n
simpleMeaning: If another gene has changed from its usual form, this gene above all stops it from showing
  what it would do.
scope: Suppresser gene, suppressor, and suppressor gene are other names for this gene that above all stops
  a changed gene from showing what it would do.
examples:
- The suppresser kept the changed gene from showing its effect.
- A suppresser can hide what a mutant gene would do.
