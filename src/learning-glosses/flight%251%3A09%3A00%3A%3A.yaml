simpleMeaning: A leap far past the ordinary limits, as in imagination or speech.
scope: This is a figurative going beyond ordinary limits, as in imagination or speech, not a scheduled
  plane trip and not the physical path of a moving object.
examples:
- The essay is full of flights of fancy that no editor could fact-check.
- His speech rose into flights of rhetoric that stirred the crowd.
