simpleMeaning: A machine part on a record player that puts on new records by itself, with no need for
  a person to do it
scope: This is a machine part on a record player that puts on new records by itself; changer is another
  name for it, not the record player itself and not a part that only starts or stops the music.
examples:
- The auto-changer put on the next record by itself.
- With an auto-changer, no one needs to change the record by hand.
