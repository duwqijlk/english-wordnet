simpleMeaning: A turning part inside the spark sender that touches each plug lead in turn, in the right
  order
scope: A turning part inside the spark sender that meets each plug lead in turn, not the sender itself
  and not a plug.
examples:
- The distributor cam was worn, so the sparks came at the wrong time.
- He replaced the distributor cam to restore the firing order.
