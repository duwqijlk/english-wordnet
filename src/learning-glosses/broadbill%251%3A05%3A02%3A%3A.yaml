simpleMeaning: A fresh-water duck of the north half of the world, with a broad flat bill.
scope: A fresh-water duck of the north half of the world, with a broad flat bill; also called shoveler;
  not small birds of the Old World tropics with bright feathers and short wide bills, nor diving ducks
  of North America with a blue-grey bill, nor a warm-clime American heron kin to night herons.
examples:
- Their broadbill swam at dawn.
- The broadbill was seen at noon.
