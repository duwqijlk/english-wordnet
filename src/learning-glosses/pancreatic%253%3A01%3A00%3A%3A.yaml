simpleMeaning: of or to do with the pancreas (a part inside the body that helps break down food and controls
  sugar in the blood)
scope: About the pancreas, a part inside the body; not about the stomach, the heart or other parts of
  the body.
examples:
- He is in hospital with pancreatic cancer.
- The pancreatic juices help break down food in the body.
