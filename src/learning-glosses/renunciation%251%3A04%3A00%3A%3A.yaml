senseId: 'renunciation%1:04:00::'
synsetId: 00205928-n
simpleMeaning: Giving up or handing over a thing one owns, a right, a title, or a special favour, or the
  like.
scope: Giving up or handing over a thing one owns, a right, a title, or a special favour, also called
  forgoing or forswearing; not having given up one's faith for a party or a cause, often to take up beliefs
  or causes that stand against it, not saying in words or in writing that a thing is given up or is not
  one's own, and not calling a thing not true or not one's own.
examples:
- His renunciation of the throne shocked the court.
- Her renunciation of the family house left her with nothing.
