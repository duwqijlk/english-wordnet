simpleMeaning: a large sheep dog with a long, thick, rough blue-grey and white coat and a short tail;
  it is thought to come from the time when Romans ruled Britain
scope: This is a kind of large sheep dog with a blue-grey and white coat, not any dog that just has a
  short tail.
examples:
- Their bobtail follows the sheep all day and sleeps by the gate at night.
- The bobtail's thick blue-grey and white coat keeps it warm in winter.
