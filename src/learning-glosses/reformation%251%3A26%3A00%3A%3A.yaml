simpleMeaning: Making groups, ways, or the like better in their present form or state, or planning to,
  for a big change for the better in social, political, or religious life.
scope: Making groups, ways, or the like better in their present form or state, or planning to, for a big
  change for the better in social, political, or religious life; not bringing a person back from error
  to the right course.
examples:
- The reformation of the schools brought a big change for the better in how children were taught.
- They called for a reformation of the old laws.
