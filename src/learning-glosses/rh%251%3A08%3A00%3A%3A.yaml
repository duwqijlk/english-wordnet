simpleMeaning: Any of several body chemicals made in the hypothalamus and sent by a vein to the front
  of the pituitary gland, where each makes it give out one set chemical
scope: Any of these body chemicals is also called a hypothalamic releasing factor, a hypothalamic releasing
  hormone, a releasing factor or a releasing hormone; it is not a hormone made by the pituitary gland
  itself.
examples:
- RH acts on the pituitary gland.
- The RH level was measured in the blood sample.
