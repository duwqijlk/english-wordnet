simpleMeaning: 'plain and with nothing added: no limits or soft words, nothing hidden, and nothing put
  on to make it look better'
scope: 'Also called crude and stark: this is about something plain, with nothing added to soften or hide
  it, not about speaking in a direct, open way and not about a knife that is not sharp.'
examples:
- She faced the blunt truth that she had no money left.
- He gave us the blunt facts, with nothing left out.
