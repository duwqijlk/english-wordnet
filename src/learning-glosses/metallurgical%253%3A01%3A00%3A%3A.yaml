simpleMeaning: having to do with metallurgy, the work of getting metal out of rock and shaping it
scope: Of the work of getting metal from rock and shaping it; metallurgic is another name for this, not
  of digging rock out of the ground.
examples:
- He took a metallurgical course on getting hard stuff from rock.
- She studied metallurgical ways of shaping hard stuff.
