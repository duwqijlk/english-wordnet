simpleMeaning: when people who share roots and customs join together, they often form one nation
scope: People joined by shared roots and customs who often form a nation, not the legal status of belonging
  to one country.
examples:
- Immigrants of the same nationality often seek each other out.
- Their shared songs and food show a nationality that goes back many generations.
