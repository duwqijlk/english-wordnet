simpleMeaning: Inside a host cell, the genes of a virus are a copy made from the RNA of a retrovirus,
  and copy themselves along with the genes of the cell.
scope: A virus's genes in copy form inside a host cell, not the free virus itself and not the cell's own
  genes.
examples:
- The provirus sat inside the host cell and copied itself with the cell's genes.
- Once the provirus was in place, it copied itself each time the host cell copied its genes.
