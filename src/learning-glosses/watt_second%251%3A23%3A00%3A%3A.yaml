simpleMeaning: 'A unit of electric energy: the work done when a flow of one set amount passes through
  a resistance of one set amount for one unit of time.'
scope: A unit of electric energy; joule is another name for this sense, not a unit of force and not a
  unit of time.
examples:
- One watt second is the work done by a flow of one set amount in one unit of time.
- The meter showed that the lamp had used two watt seconds.
