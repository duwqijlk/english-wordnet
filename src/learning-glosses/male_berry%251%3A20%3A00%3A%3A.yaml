simpleMeaning: In winter this bush drops its leaves; in flower it wears thick soft clusters of small white
  bells on its many branches.
scope: 'Also called maleberry, he-huckleberry, and privet andromeda: a bush with dense clusters of small
  white bell-shaped flowers.'
examples:
- The male berry dropped its leaves in the autumn.
- White bell-shaped flowers hung in thick clusters on the male berry.
