simpleMeaning: A gland that makes silk in insects, above all in a silkworm, or in spiders
scope: 'Also called sericterium or a silk gland: a gland that makes silk in insects or spiders, not a
  gland that makes poison and not a gland that makes wax.'
examples:
- The serictery is the gland that makes silk.
- In the caterpillar, the serictery fills with silk.
