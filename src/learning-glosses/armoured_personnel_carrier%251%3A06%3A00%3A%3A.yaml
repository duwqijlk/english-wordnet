simpleMeaning: In war, a steel vehicle, usually on wide tracks, that carries foot soldiers.
scope: 'Also called armored personnel carrier: in war, a steel vehicle on wide tracks that carries foot
  soldiers, not a tank and not an ordinary truck.'
examples:
- The armoured personnel carrier brought the foot soldiers to the front.
- An armoured personnel carrier rolled past on its wide tracks.
