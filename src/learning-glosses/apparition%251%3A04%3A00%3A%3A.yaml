simpleMeaning: the act of showing up or coming into sight all of a sudden, when no one expects it
scope: A sudden appearance no one expects, not a ghost and not a thing that was there all along.
examples:
- The villagers were amazed at the apparition of the white stranger in their town.
- Her sudden apparition at the door made everyone turn and stare.
