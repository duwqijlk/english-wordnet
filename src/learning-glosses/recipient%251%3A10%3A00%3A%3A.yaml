senseId: 'recipient%1:10:00::'
synsetId: 06344088-n
simpleMeaning: In grammar, the living thing in a sentence that a verb's action happens to, without doing
  anything itself
scope: In grammar, the living thing in a sentence that a verb's action happens to, without doing anything
  itself; not the doer of the action, and not the thing acted on.
examples:
- In 'She gave him the book', him is the recipient of the gift.
- The recipient in the sentence gets the thing without acting.
