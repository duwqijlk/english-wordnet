synsetId: 04152121-n
simpleMeaning: Painted boards and other structures on a stage, meant to make it look like a certain place.
scope: These are physical painted pieces built on a stage to stand for a place, not a drawn or photographed
  picture of a place (the other sense of this word), not the real place where an action happens, not an
  incident real or imagined, not the sight of a region itself, not a film's run of shots forming one unit
  of action, not a situation treated as an observable object, not one section of a play or performance,
  not a burst of bad temper, and not the abstract context or environment in which an event is set.
examples:
- The painted scene at the back of the stage showed a row of city buildings.
- Workers changed the scene between acts while the audience waited.
