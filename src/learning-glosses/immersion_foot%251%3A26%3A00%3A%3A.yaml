simpleMeaning: an injury to the end of the leg like frostbite but without freezing, caused by cold and
  wet
scope: A foot injury like frostbite without freezing, from cold and wet; trench foot is another name for
  this sense, not true frostbite and not a burn.
examples:
- His immersion foot came from days in cold wet trenches.
- The soldier's immersion foot was treated with warm dry cloths.
