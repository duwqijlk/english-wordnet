simpleMeaning: a form of a chemical element that gives off rays, made in nature or made by people
scope: A form of an element that gives off rays, not a form that gives off no rays and not the rays themselves.
examples:
- The lab uses a radioisotope to follow a drug as it moves through the body.
- This radioisotope gives off rays that doctors can track.
