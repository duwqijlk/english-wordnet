senseId: 'ravehook%1:06:00::'
synsetId: 04063711-n
simpleMeaning: a hand tool with a bent end used to get the gaps in a boat's boards ready before they are
  filled with oakum, loose rope stuff that stops leaks
scope: A tool for getting a boat's seams ready for oakum, not a hammer and not a tool for making holes
  in wood.
examples:
- He used the ravehook to clean out the seam before he put in the oakum.
- The boat builder reached for a ravehook to get the old oakum out of the gap.
