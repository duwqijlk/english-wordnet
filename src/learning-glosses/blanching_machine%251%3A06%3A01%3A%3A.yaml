simpleMeaning: A device used to heat fruit and vegetables briefly in hot water, or to boil or clean them
  of germs.
scope: A device used to heat fruit and vegetables briefly in hot water, or to boil or clean them of germs,
  not a cooker for meals and not a machine that packs food.
examples:
- The factory uses a blanching machine for the peas.
- The blanching machine heats the beans before they are frozen.
