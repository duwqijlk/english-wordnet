simpleMeaning: The place where a nerve fibre meets the muscle it serves.
scope: The place where a nerve fibre meets the muscle it serves, with myoneural junction as another name
  for this sense, not the tip of a nerve on its own and not the muscle on its own.
examples:
- The signal crosses the neuromuscular junction to reach the muscle.
- At the neuromuscular junction, the nerve tells the muscle to move.
