simpleMeaning: A unit of information, one thousand exabits.
scope: Also called Zbit or a zettabit, this is a unit of one thousand exabits, not the ZB, which counts
  bytes, not bits.
examples:
- One Zb is one thousand exabits.
- The test file was two Zb, each one thousand exabits, in size.
