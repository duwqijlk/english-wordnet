simpleMeaning: a thick plant with white blooms that comes back year after year, growing wild in shallow
  fresh marshes, ponds and streams in the north of the United States and Asia
scope: A thick plant with white blooms that grows wild in shallow fresh marshes, ponds and streams in
  the north of the United States and Asia, not a garden plant and not the plant grown for a root to eat.
examples:
- A water parsnip stood in the shallow edge of the marsh.
- We found a water parsnip growing wild beside the slow stream.
