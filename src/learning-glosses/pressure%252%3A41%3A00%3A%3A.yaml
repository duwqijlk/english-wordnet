simpleMeaning: to make someone do something using physical force, moral duty or clever argument, or because
  they have no other choice
scope: This is not the scientific measure of force and not the act of pushing; it means making a person
  act.
examples:
- The coach pressured the team to train harder.
- Her friends pressured her into changing her mind.
