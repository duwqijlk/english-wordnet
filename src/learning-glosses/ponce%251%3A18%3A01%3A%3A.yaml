simpleMeaning: A man who acts womanish and is fussy about dress.
scope: A man who acts womanish and is fussy about dress; not one who finds customers for whores — in England
  they call a pimp a ponce.
examples:
- Their ponce minced down the street.
- The ponce fussed over every cuff.
