simpleMeaning: In the Roman Catholic Church, a person in charge of a church area, working under the top
  head of a religious order
scope: In the Roman Catholic Church, a church officer in charge of an area. It is not the describing word
  for things or people that belong to a province.
examples:
- The head of the Jesuits gets a report each month from each provincial.
- A new provincial was chosen to be in charge of the order in that area.
