simpleMeaning: a dish of ground beef with hot peppers or hot pepper powder, often with tomatoes and kidney
  beans
scope: A dish of ground beef with hot peppers, often with tomatoes and beans; not the hot pepper itself,
  and not a dish without beef.
examples:
- She made a big pot of chili for the party.
- His chili had tomatoes and kidney beans in it.
