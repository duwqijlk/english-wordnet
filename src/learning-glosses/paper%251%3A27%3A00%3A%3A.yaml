simpleMeaning: a thin material made from soft wood fibre, cloth scraps or plant stems, used for writing,
  printing or wrapping.
scope: Not a newspaper, an essay or an official document; it is only the thin material itself.
examples:
- We need more paper for the printer.
- He wrapped the fish in paper.
