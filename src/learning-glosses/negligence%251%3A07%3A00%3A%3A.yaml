schema: oewn-learning-gloss-v2
senseId: 'negligence%1:07:00::'
synsetId: 04673170-n
simpleMeaning: a way of being in which a person does not do the things they should do and does not care
  about them
scope: 'Also called neglect: a way of being in which a person does not do what they should and does not
  care, not a single act in law that fails to take fair care.'
examples:
- His negligence showed in the way he left important work undone and did not care.
- Years of negligence had left his papers in a mess and his bills unpaid.
