simpleMeaning: the most common computer store, where programs work while it runs; a chip that keeps or
  finds any bit in any order, each spot as easy as the next
scope: Also called random access memory, random memory, and read/write memory; the main short-term store
  in a computer, not the disk that keeps files after the machine is off.
examples:
- Random-access memory lets the program work fast.
- The computer's random-access memory holds data while it runs.
