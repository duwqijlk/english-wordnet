simpleMeaning: an amino acid, one of the small parts that make up protein, with a ring-shaped part, from
  which thyroxine is made
scope: An amino acid with a ring-shaped part that thyroxine comes from; not thyroxine itself and not another
  amino acid such as tyrosine.
examples:
- Thyronine is the base from which the body makes thyroxine.
- The chemist studied thyronine to see how it turns into thyroxine.
