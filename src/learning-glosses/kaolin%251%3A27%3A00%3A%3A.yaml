simpleMeaning: a fine clay, usually white, made when minerals rich in aluminium, like feldspar, break
  down in weather; used in pottery, to soak up wetness, and as filler, as in paper
scope: 'Also called china clay, china stone, kaoline, porcelain clay, or terra alba: a fine white clay
  used in pottery and paper, not ordinary brown garden clay, and not chalk.'
examples:
- The potter mixed kaolin into the clay to make the cups whiter.
- Kaolin is used in paper to give it a smooth, white finish.
