simpleMeaning: Without going out on the ropes, a sailor can climb up through a gap in a flat place on
  a mast
scope: This is a gap in a mast platform for a sailor to climb through, not a hole in the ship's side and
  not a door.
examples:
- He climbed through the lubber's hole to reach the top.
- The lubber's hole saved him a climb out on the ropes.
