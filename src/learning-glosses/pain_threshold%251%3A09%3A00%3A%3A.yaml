simpleMeaning: Hurt is first felt when something acts on the body at its smallest amount
scope: The least amount of something that acts on the body at which hurt is first felt, not the most hurt
  a person can bear and not the hurt itself.
examples:
- Some people have much higher pain thresholds than others.
- Her pain threshold is low, so even a light touch hurts.
