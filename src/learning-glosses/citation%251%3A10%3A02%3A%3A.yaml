simpleMeaning: an official order in writing that tells a person they must appear at a legal case or hearing
scope: A legal order to appear, not the short note that names a source and not the quoted words themselves.
examples:
- He got a citation that told him to appear in court next week.
- The court sent her a citation for the hearing.
