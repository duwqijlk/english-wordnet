simpleMeaning: In genetics, a change in a living thing's make-up caused by outside gene stuff put into
  its set of genes.
scope: In genetics, a change in a living thing's make-up caused by outside gene stuff put into its set
  of genes; not a change from heat or light and not a change passed down from parents.
examples:
- Insertional mutagenesis changed the plant's genes.
- The lab used insertional mutagenesis to study the gene.
