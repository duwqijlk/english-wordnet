simpleMeaning: A knot that holds a rope to something for a short time, and it is usually tied twice.
scope: This is a knot that holds a rope to something for a short time, not a lasting join in the rope.
examples:
- He tied a half hitch round the post.
- A half hitch held the rope for the night.
