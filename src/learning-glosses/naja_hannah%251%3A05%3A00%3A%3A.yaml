simpleMeaning: A large cobra of south-east Asia and the East Indies, the largest snake whose bite can
  kill, at times put in the genus that shares its name.
scope: This is a large cobra of south-east Asia and the East Indies, the largest snake whose bite can
  kill, at times put in the genus that shares its name; hamadryad, king cobra and Ophiophagus hannah are
  other names for this sense, not a small cobra and not a snake with a bite that cannot kill.
examples:
- The Naja hannah is the largest venomous snake in Asia.
- We saw a Naja hannah in the forests of south-east Asia.
