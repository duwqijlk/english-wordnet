scope: A common long-lived climber of the cool lands of Eurasia and North America, close to other vetches
  with bunched blooms; also called bird vetch, tufted vetch and Calnada pea.
examples:
- Vicia cracca tangled through the hedge in June.
- The Vicia cracca had dense purple flower clusters.
