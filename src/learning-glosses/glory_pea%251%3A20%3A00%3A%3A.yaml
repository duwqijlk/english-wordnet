simpleMeaning: Red flowers shaped like bean flowers hang down in long bunches on any of many shrubs or
  vines of the plant group Clianthus, with leaves made of small leaflets.
scope: Also called clianthus, this is any of many shrubs or vines with red flowers in hanging bunches,
  not a single garden pea plant.
examples:
- The glory pea in the garden had bright red flowers.
- Glory pea vines hung over the wall in long bunches.
