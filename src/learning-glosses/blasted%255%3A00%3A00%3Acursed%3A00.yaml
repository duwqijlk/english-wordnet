simpleMeaning: a swear word used in informal speech to make another word stronger and show strong feeling
scope: 'Also called damn, blame, damned, blessed, goddamn, and blamed: a swear word used in informal speech
  to show anger or strong feeling, not a word for something hit or destroyed by a blast.'
examples:
- That blasted car will not start again this morning.
- I cannot find my blasted keys anywhere in the house.
