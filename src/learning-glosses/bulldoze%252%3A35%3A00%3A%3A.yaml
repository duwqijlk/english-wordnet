simpleMeaning: To make something flat, using a heavy machine that pushes earth aside, or in a way like
  using such a machine
scope: Making ground or other things flat with a heavy machine; not pushing your way through a crowd,
  and not forcing people to accept a plan.
examples:
- The workers bulldozed the rough ground flat before building the road.
- They bulldozed the small hill to make a flat place for houses.
