simpleMeaning: with a sharp smell like liquorice, this essential oil is taken from the seeds of the plant
  Pimpinella anisum
scope: 'Also called aniseed oil and oil of anise: an oil taken from aniseed, with a sharp smell like liquorice,
  not a cooking oil.'
examples:
- A few drops of anise oil give the cake its liquorice smell.
- The anise oil smells sharp, like liquorice.
