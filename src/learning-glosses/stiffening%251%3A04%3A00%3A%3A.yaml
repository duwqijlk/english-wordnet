simpleMeaning: the act of becoming hard and not easy to bend or move
scope: The act of something becoming hard and not easy to bend or move; not the process of becoming hard
  and stiff.
examples:
- The stiffening of the wet cloth in the cold made it hard to fold.
- He felt a stiffening in his knee after the long run.
