synsetId: 06776392-n
simpleMeaning: a short note that names where a piece of information or a quotation came from
scope: 'Also called mention, reference, credit, or cite: a short note naming where information or a quotation
  came from, not a statement that something is true and not the state of being recognised.'
examples:
- The acknowledgments are usually printed at the front of a book.
- Her acknowledgment named the library where she had found the letter.
