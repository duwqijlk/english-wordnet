simpleMeaning: the official helper who looks after a contestant in a duel or boxing match.
scope: This sense is not a unit of time or a place in a series, not a gear, not flawed merchandise, and
  not a speech supporting a motion; it is a person who assists a fighter.
examples:
- His second handed him a towel between rounds.
- In the duel, each man's second checked the pistols before the signal.
