simpleMeaning: the angle between where a gun is aimed and where a moving target will be when the shot
  reaches it, allowing for flight time
scope: This is about aiming ahead of a moving target, not the rope for an animal or the timing of a spark
  in an engine.
examples:
- The shooter judged the lead and fired slightly ahead of the running target.
- At that distance the bullet takes almost a second to arrive, so the hunter must allow plenty of lead.
