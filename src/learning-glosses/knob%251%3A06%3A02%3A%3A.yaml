simpleMeaning: a ball-shaped ornament at the end of the handle of a sword or dagger
scope: A ball-shaped ornament at the end of the handle of a sword or dagger, also called pommel; not any
  round lump that sticks out from a surface.
examples:
- The knob on the hilt of his sword was made of gold.
- She gripped the sword by its knob and raised it high.
