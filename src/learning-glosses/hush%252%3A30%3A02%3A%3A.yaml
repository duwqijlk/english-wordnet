simpleMeaning: To run water over the ground so that it wears the soil away and shows the layers of rock
  below, and the useful metals and stones in them
scope: Running water over ground to wear soil away and show what lies below, not washing bits out of a
  thing and not a quiet stillness.
examples:
- The miners hushed the hillside to find the gold.
- They hushed the ground to show the rock below.
