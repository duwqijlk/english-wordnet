simpleMeaning: to make someone feel worried, uneasy, or upset
scope: This is about disturbing someone's peace of mind, not about causing them practical difficulty or
  bothering them with a request.
examples:
- The strange phone call troubled her all evening.
- What troubles me most is the lack of a clear plan.
