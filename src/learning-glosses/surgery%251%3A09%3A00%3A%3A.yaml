simpleMeaning: the part of medical science that treats illness or harm to the body by cutting the body
  open to fix it
scope: The study and work of treating illness by cutting the body open to fix it, not one single operation
  on a person.
examples:
- She studied surgery at medical school for many years.
- He teaches surgery to young doctors at the hospital.
