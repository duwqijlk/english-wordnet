senseId: 'spatiotemporal%3:01:00::'
synsetId: 02822020-a
simpleMeaning: To do with space and time together, having length in space and lasting for a time.
scope: To do with space and time together, not the use for a thing that exists in both space and time.
examples:
- The study was spatiotemporal, covering both place and time.
- Their account of the event was spatiotemporal in scope.
