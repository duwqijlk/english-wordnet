simpleMeaning: with heat and wet air that feel heavy and hard to bear
scope: 'Also called stifling, sultry, and sulphurous: for air that is hot and wet and feels heavy. Not
  about sulfur in a thing, and not about harsh words.'
examples:
- The sulfurous air before the storm made it hard to breathe.
- On that sulfurous summer day, the wet heat felt heavy all afternoon.
