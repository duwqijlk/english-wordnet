simpleMeaning: a wild plant from Europe and Asia that often grows as a weed in fields of grain
scope: A weedy plant that harms grain crops; chadlock and field mustard are other names for this sense,
  not a garden plant and not a crop plant itself.
examples:
- Charlock stood tall among the wheat in June.
- The field was full of charlock among the grain.
