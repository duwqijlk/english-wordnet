simpleMeaning: a word or sentence that does not follow the rules for putting words together, or that people
  do not accept as right
scope: A word or sentence that breaks the rules of grammar, also called ungrammatical; not a badly built
  thing and not a word spelled wrong.
examples:
- The phrase 'me and him went' is ill-formed.
- She crossed out the ill-formed sentence and wrote it again.
