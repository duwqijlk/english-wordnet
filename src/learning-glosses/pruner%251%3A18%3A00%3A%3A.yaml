simpleMeaning: A worker who cuts back trees and bushes to thin them out and shape them.
scope: A worker who cuts back trees and bushes to thin them out and shape them, also called trimmer; not
  the long-handled saw with a curved blade at the end, sometimes with a clipper, used to cut back small
  trees.
examples:
- The pruner spent the morning thinning out the old apple trees.
- They hired a pruner to trim the bushes along the drive.
