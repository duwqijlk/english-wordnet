simpleMeaning: In baking powders and fizzy drinks, this white powder (NaHCO3) that comes apart in water
  is also taken to calm a sour stomach.
scope: Its other names are saleratus, baking soda, bicarbonate of soda, and sodium bicarbonate, and it
  is a white powder for fizzy drinks, baking powders, and a sour stomach.
examples:
- Sodium hydrogen carbonate made the cake rise.
- Sodium hydrogen carbonate calmed her sour stomach.
