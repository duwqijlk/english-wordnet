simpleMeaning: These frogs live up in branches across Europe, Asia, and Africa, and the sticky pads on
  their toes set them apart from true frogs.
scope: Also called tree-frog, this is one of many kinds of frog from Europe, Asia, and Africa that lives
  up in branches, not the kind from southeast Asia, Australia, and America.
examples:
- The tree frog clung to the branch with its sticky pads.
- Up in the branches sat a tree frog.
