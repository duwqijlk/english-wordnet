simpleMeaning: having to do with the very earliest part of the Stone Age, when people used rough stone
  tools
scope: Of the earliest part of the Stone Age, not of later Stone Age times and not of the Bronze Age.
examples:
- The eolithic tools were little more than chipped stones.
- Eolithic remains show how early people shaped stone.
