simpleMeaning: An eel-like jawless sea beast, its tongue bearing hard teeth inside a round opening with
  eight feelers round it, feeding on dead or trapped fish, boring into them.
scope: This sense is also called hag and hagfish, a sea beast with no jaw, shaped like an eel, with hard
  teeth on its tongue inside a round mouth ringed with eight feelers, which feeds on dead or caught fish
  by boring into them.
examples:
- Slime eels bored into the dead fish.
- Slime eels feed on dead fish.
