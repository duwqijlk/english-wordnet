simpleMeaning: A page as it comes off the printing machine, before it is folded
scope: A page as printed and not yet folded; not a finished page in a book and not a single loose sheet
  of blank paper.
examples:
- The printer checked the press sheet before the pages were folded.
- Collectors buy uncut press sheets from the post office.
