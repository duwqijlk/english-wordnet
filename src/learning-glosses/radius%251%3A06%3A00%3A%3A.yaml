simpleMeaning: one of the bars in a wheel that give it support and join the center to the outer edge
scope: This wheel bar is also called a spoke or a wheel spoke; it is not the line from the center of a
  circle to its edge and not the bone in the lower arm.
examples:
- A broken radius on the bicycle wheel made it bend to one side.
- Each radius runs from the center of the wheel to its outer edge.
