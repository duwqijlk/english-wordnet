simpleMeaning: not having the qualities that people think fit a man
scope: Not having the qualities thought fit for a man in general; not only the narrower sense of being
  afraid and lacking courage.
examples:
- In the old story, crying was called unmanly, though the hero cried openly at the end.
- They said his soft voice and gentle ways were unmanly, but he did not agree.
