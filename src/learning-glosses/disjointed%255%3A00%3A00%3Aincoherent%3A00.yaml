schema: oewn-learning-gloss-v2
senseId: disjointed%5:00:00:incoherent:00
synsetId: 00467212-s
simpleMeaning: with parts that do not follow each other in a clear order, so the whole thing is hard to
  follow
scope: Also called confused, scattered, disconnected, illogical, garbled, unconnected and disordered;
  this is about parts with no clear order, not about a person who cannot think clearly.
examples:
- His disjointed speech jumped from one idea to the next with no clear link.
- She wrote a disjointed story, and I could not follow how the parts joined.
