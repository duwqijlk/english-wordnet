simpleMeaning: the way the sound of a word or part of a word changes when another word follows it at once,
  especially in smooth, natural speech
scope: This is a change in the sound of a word when another word follows it at once, not a change in what
  a word means and not a pause between words.
examples:
- In sandhi, the last sound of one word can change before the next word.
- Sandhi explains why 'ten bikes' can sound like 'tem bikes'.
