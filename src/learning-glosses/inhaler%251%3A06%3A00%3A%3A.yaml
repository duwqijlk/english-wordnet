simpleMeaning: a device that makes a chemical gas that a person breathes in to ease a blocked nose
scope: Also called inhalator. This device makes a gas you breathe in to clear a blocked nose, not a medicine
  for breathing trouble in the chest.
examples:
- He used an inhaler to clear his blocked nose.
- She kept an inhaler in her bag for when her nose felt blocked.
