simpleMeaning: A hairy long-lived plant of Europe and Asia with deep yellow daisies on loose bending stems;
  found wild in open woods and on rocky slopes.
scope: 'Also called woodland oxeye: a hairy long-lived plant of Europe and Asia with deep yellow daisies
  on loose bending stems, not a garden daisy grown in beds and not a tall shrub.'
examples:
- Buphthalmum salicifolium grew wild on the rocky slope above the wood.
- The deep yellow daisies of Buphthalmum salicifolium nodded on their bending stems.
