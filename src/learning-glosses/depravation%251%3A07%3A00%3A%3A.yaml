simpleMeaning: A turning away from what is right; harm to good character and right rules of life
scope: A turning away from what is right that harms good character; also called corruption, depravity,
  degeneracy and putrefaction, not a single bad act and not a mistake.
examples:
- The depravation of the court shocked the honest citizens.
- Depravation spread as the rulers grew rich and careless.
