simpleMeaning: A sound from the heart that is not normal, which can sometimes point to faulty heart valves.
scope: 'Also called a ''heart murmur'' or ''cardiac murmur'': an unusual heart sound that may warn of
  valve trouble, not the low continuous sound, the quiet complaint, or the phonetics vowel.'
examples:
- The doctor listened and heard a murmur.
- An echocardiogram can show what causes a murmur.
