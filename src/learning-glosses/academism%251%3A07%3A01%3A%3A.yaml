simpleMeaning: painting and statues made in the style of the art schools of Europe
scope: This is painting and statues made in the style of the art schools of Europe, also called academic
  art and academicism; not art that breaks with those schools and not folk art.
examples:
- The academism of his portraits pleased the art schools of his day.
- Her academism showed in every carefully posed figure she painted.
