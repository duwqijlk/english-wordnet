simpleMeaning: The unusually big naked mole rat that is the only one in a colony to produce young, fathered
  by just a few males.
scope: This is the breeding female of a naked mole rat colony, not the egg-laying female of a bee or ant
  colony, not a female ruler, and not the top female competitor.
examples:
- The queen stayed in the nest chamber while the workers dug new tunnels.
- Only one queen in the colony produces all the pups.
