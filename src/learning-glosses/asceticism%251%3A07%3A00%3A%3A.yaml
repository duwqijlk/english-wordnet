senseId: 'asceticism%1:07:00::'
synsetId: 04889193-n
simpleMeaning: The quality of giving up much for oneself, especially of holding back from the pleasures
  of the world.
scope: 'Also called austerity or nonindulgence: the trait of great self-denial, not the doctrine that
  such denial leads to a high spiritual state, and not the act of self-restraint itself.'
examples:
- His asceticism meant he owned almost nothing.
- Her asceticism surprised friends who knew her love of good food.
