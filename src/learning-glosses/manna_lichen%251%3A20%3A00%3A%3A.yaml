simpleMeaning: People and animals eat this crusty, bushy growth, one of several Old World kinds that curls
  up and blows over the African and Arabian dry lands.
scope: This is the Old World growth that curls up and blows over dry lands, eaten by people and animals.
examples:
- The wind rolled the manna lichen across the desert.
- Animals ate the manna lichen the wind had blown over the desert.
