simpleMeaning: a chemical compound, a substance made of two parts joined together, used a great deal to
  wear down and smooth other things
scope: A substance used to wear down and smooth other things, not a soft cloth and not a tool that cuts.
examples:
- Workers use cubic boron nitride to smooth the steel parts.
- Cubic boron nitride can wear down steel and smooth its surface.
