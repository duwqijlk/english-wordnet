simpleMeaning: The clear watery liquid inside the eyeball, between the front window of the eye and the
  lens.
scope: The clear watery liquid inside the eyeball between the front window of the eye and the lens; aqueous
  humor is another name for it, and it is not tears and not the jelly at the back of the eye.
examples:
- The aqueous humour keeps the front of the eye firm.
- Doctors checked the aqueous humour for signs of pressure.
