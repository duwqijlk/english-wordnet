simpleMeaning: the study of a set of written works to learn about people, their lives and their ideas
scope: This sense is studying a set of written works to learn about people. It is not the written works
  themselves.
examples:
- He took a course in Russian literature at university.
- She studies literature to learn how people lived and thought in the past.
