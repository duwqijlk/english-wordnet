simpleMeaning: A member of the people of the land of that name who speak its tongue, kin to the Tungus;
  these people took China in the 17th century
scope: A member of the people of the land of that name who speak its tongue, kin to the Tungus; these
  people took China in the 17th century, and the word is not used here for the ruling house that once
  held China, or for the tongue as a language on its own.
examples:
- He is a Manchu whose family came from Manchuria.
- The Manchu took China in the 17th century.
