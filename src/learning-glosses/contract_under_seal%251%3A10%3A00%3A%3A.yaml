simpleMeaning: a written deal that is signed and has the signer's wax mark fixed to it
scope: A signed written deal with the signer's wax mark fixed to it, not an unsigned deal and not a plain
  spoken promise.
examples:
- The contract under seal was kept in the family safe.
- He signed the contract under seal before two witnesses.
