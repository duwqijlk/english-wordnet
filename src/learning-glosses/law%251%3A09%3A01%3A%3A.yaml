simpleMeaning: a general statement that describes facts or events that keep happening in the natural world.
scope: This is a pattern observed in the natural world, not a rule made by a government and not the study
  of court decisions.
examples:
- Newton's law of gravity explains why apples fall.
- Scientists framed a law to describe how a gas expands when heated.
