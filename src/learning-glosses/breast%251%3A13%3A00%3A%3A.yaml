simpleMeaning: meat cut from the chest of a bird such as a chicken
scope: This is meat for eating, cut from a bird's chest, not a woman's chest part, not the chest part
  of a living animal, and not the front of a person's chest.
examples:
- We ate roast chicken breast with potatoes.
- She ordered turkey breast at the shop.
