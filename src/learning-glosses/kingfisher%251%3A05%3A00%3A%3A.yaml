simpleMeaning: A bird with a large head, short tail and long sharp bill, not a perching bird; usually
  bright in color, with feathers up on its head, eating mostly fish
scope: This bird eats mostly fish and has a long sharp bill; it is not a fish and not a small song bird
  that sits on branches.
examples:
- A kingfisher sat by the river, then flew down to catch a fish.
- We saw a bright kingfisher with a long sharp bill near the water.
