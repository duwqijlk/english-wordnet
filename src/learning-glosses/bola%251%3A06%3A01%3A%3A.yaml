simpleMeaning: A pretty clasp holds this neck cord in place, and it is worn as a tie.
scope: A bola is also called a bola tie, a bolo tie, or a bolo, and is not the rope thrown to catch animals.
examples:
- He wore a bola with a clasp at his throat.
- He chose a bola instead of an ordinary tie.
