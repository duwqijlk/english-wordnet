simpleMeaning: gone red, most of all in the face, as if blood had rushed into it, from strong feeling
  or hard work
scope: Gone red, most of all in the face, as if blood had rushed into it, also called red, flushed, and
  crimson; not a red colour of cloth or paint.
examples:
- His face was reddened with fury.
- She came back from the run with reddened cheeks.
