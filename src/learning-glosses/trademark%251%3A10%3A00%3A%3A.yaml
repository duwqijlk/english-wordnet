simpleMeaning: a sign, recorded in an official list, that shows which company makes or sells a product
scope: The sign a company records to show a product is theirs; not a special quality a person or thing
  is known for, and not the act of recording or marking.
examples:
- The company's logo is a registered trademark.
- The small sign next to the name shows it is a trademark, not just a word anyone can use.
