simpleMeaning: about an embryo, a young plant or animal, growing without a male cell and a female cell
  joining
scope: 'Also called apogametic and apogamous: about growth without a male cell joining a female cell,
  not growth after such a joining and not ordinary growth from a seed.'
examples:
- Apogamic growth lets the plant make a new plant without male cells.
- The apogamic embryo grew from the mother plant alone.
