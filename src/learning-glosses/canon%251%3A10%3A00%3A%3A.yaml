simpleMeaning: In art or philosophy, one basic rule, or especially a whole set of basic rules and ideas,
  that people generally accept as true
scope: Basic rules or ideas in art or philosophy; not a list of saints, not a set of holy books, and not
  a piece of music.
examples:
- The canons of polite society were strict in those days.
- Students study the canon of basic rules for classical art.
