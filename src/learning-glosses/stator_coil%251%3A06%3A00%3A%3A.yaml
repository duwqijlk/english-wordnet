simpleMeaning: The stationary part of a motor or generator, in or around which the rotor revolves.
scope: 'Stator is another name for it: the fixed piece of a motor, set against the moving piece that turns
  in it.'
examples:
- The stator coil sits in the motor, and the rotor turns round it.
- Inside the motor, the stator coil never moves.
