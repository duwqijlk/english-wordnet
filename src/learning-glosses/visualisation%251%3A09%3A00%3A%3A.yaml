simpleMeaning: a picture in the mind that is like something seen with the eyes
scope: A picture held in the mind, also called a visualization and a visual image; not the way a person
  sees real things around them.
examples:
- Her visualisation of the room helped her plan the new layout.
- He closed his eyes and formed a clear visualisation of the beach.
