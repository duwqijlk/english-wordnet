simpleMeaning: Any of a genus of brilliantly coloured birds that mostly live on the ground, with short
  wings and tail and thick, strong bills.
scope: A brilliantly coloured ground bird of the pitta genus, not the flat bread that is also spelled
  pita.
examples:
- A pitta's bright colours stood out against the dark forest floor.
- We watched a pitta pick its way through the fallen leaves.
