simpleMeaning: Made hard by cold after much of its water was taken out, this drink comes from a round
  fruit with a thick peel
scope: A drink made from fruit, with its water taken out and then frozen, also called frozen orange juice;
  not fresh juice and not a drink that has only been chilled.
examples:
- She mixed the orange-juice concentrate with water to make juice.
- A can of orange-juice concentrate keeps in the freezer for months.
