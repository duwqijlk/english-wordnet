simpleMeaning: Often used to keep down mosquitoes, these small fish, usually bright in colour, feed at
  the surface of warm fresh or part-salt waters and give birth to live young.
scope: People also call them live-bearer, poeciliid, or poeciliid fish, small fish that feed at the surface
  of warm fresh or part-salt waters and give birth to live young, often used to keep down mosquitoes.
examples:
- The topminnows fed at the surface of the warm water.
- Topminnows were put in the water to keep down mosquitoes.
