simpleMeaning: a poor man who farms land in the Scottish Highlands
scope: A poor farmer in the hills of Scotland, also called a cottar; not a farm owner and not a wedge
  or pin used to hold parts together.
examples:
- The cotter tended his crops on the hillside.
- Each cotter paid rent for the land he farmed.
