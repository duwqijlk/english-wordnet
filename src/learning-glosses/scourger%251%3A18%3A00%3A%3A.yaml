simpleMeaning: a person who hurts others by beating them with a whip, especially a worker whose job is
  to whip people who break the law
scope: A person who beats others with a whip, especially an official who whips offenders; also called
  a flogger, not a soldier and not a judge who only hands down a sentence.
examples:
- The scourger raised his whip over the prisoner.
- In the old prison, the scourger carried out the punishment.
