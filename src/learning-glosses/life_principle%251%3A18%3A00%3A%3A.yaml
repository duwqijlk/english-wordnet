simpleMeaning: A supposed force said to give living things the powers and traits that belong to them alone
scope: A supposed force said to lie behind the powers of living things, not the soul and not a force studied
  in physics.
examples:
- The old book spoke of a life principle behind all growth.
- He believed a life principle moved through every living thing.
