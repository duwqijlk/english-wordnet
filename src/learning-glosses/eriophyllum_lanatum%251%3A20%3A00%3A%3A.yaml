simpleMeaning: A grey woolly leafy plant living many years, its branched stems ending in bare stalks with
  golden-yellow flower heads; it grows in dry lands in the west of North America.
scope: Also called golden yarrow; a grey woolly leafy plant living many years, its branched stems ending
  in bare stalks with golden-yellow flower heads, growing in dry lands in the west of North America, kin
  to other woolly plants of dry lands.
examples:
- Eriophyllum lanatum grows in the dry hills, its golden-yellow flower heads bright in summer.
- The Eriophyllum lanatum by the trail has woolly grey leaves.
