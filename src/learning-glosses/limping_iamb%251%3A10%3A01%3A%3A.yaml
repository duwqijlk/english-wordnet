schema: oewn-learning-gloss-v2
senseId: 'limping_iamb%1:10:01::'
synsetId: 92413267-n
simpleMeaning: A line of verse in a two-beat pattern whose last foot is a spondee or trochee instead of
  the usual foot
scope: A line of verse in a two-beat pattern whose last foot breaks the pattern, not a regular line in
  the same pattern and not free verse.
examples:
- The limping iamb ends with a heavy foot.
- Poets use the limping iamb for a halting effect.
