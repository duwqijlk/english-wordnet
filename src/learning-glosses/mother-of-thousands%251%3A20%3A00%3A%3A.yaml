simpleMeaning: By many runners that creep along the ground, this plant of eastern Asia spreads, and its
  small red-and-white blooms are borne in bunches.
scope: It is also called strawberry geranium and strawberry saxifrage, and among the saxifrages of eastern
  Asia it is the one that spreads by creeping runners and bears small red-and-white blooms in bunches.
examples:
- The mother-of-thousands spreads by runners that creep along the ground.
- Mother-of-thousands bears small red-and-white flowers.
