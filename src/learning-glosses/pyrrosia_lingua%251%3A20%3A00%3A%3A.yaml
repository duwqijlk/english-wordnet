simpleMeaning: A fern from east Asia with leaves shaped like tongues, that some put in the Cyclophorus
  group.
scope: Also called felt fern, tongue fern and Cyclophorus lingua; a fern from east Asia with leaves shaped
  like tongues, not a fern with round leaves.
examples:
- Pyrrosia lingua grows on the old wall, its tongue-shaped leaves hanging down.
- The Pyrrosia lingua in the glasshouse has leaves like tongues.
