simpleMeaning: A chemical stuff added to a mix of chemicals to undo the bad effects of the unwanted bits
  in the mix
scope: A chemical added to a mix to undo the harm of unwanted bits, not an animal that feeds on dead things.
examples:
- The scavenger was added to the mix to remove the impurities.
- A scavenger keeps the mixture clean by fighting off impurities.
