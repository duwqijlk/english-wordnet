simpleMeaning: A substance that takes oxygen from another substance and changes it, while oxygen changes
  it; in photography it lightens a negative or a print by taking away some loose silver.
scope: Also called reducing agent or reductant, a substance that takes oxygen from another substance and
  changes it, while oxygen changes it; not a pipe fitting that joins pipes of different widths.
examples:
- The photographer added reducer to lighten the dark negative.
- A little reducer in the tray made the print less dense.
