simpleMeaning: a growth in the body made of young cells that have not yet grown into one set kind of cell
scope: Also called blastocytoma and embryonal carcinosarcoma, this is a growth of young cells that have
  not yet grown into one set kind of cell, not a growth of grown cells and not a lump caused by hurt.
examples:
- The doctor found a blastoma in the child's eye.
- A blastoma is made of cells that have not yet grown into a set form.
