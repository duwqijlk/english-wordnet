simpleMeaning: One of a set of scales used in plain songs up to the year 1600, drawn in the past from
  the Greek scale.
scope: Also called church mode, ecclesiastical mode, or medieval mode; one of a set of scales used in
  plain songs up to the year 1600, drawn in the past from the Greek scale.
examples:
- The Gregorian mode was one of the scales used in plain songs up to 1600.
- We sang in a Gregorian mode drawn from the Greek scale.
