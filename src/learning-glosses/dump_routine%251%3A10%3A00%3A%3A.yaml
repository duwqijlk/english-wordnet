simpleMeaning: things from an inner store are written onto a thing outside by a set of steps
scope: A set of steps that writes things from an inner store onto a thing outside, not a step that reads
  things in and not a step that works on the numbers.
examples:
- The dump routine moved the old files onto a tape.
- After the crash, they ran the dump routine to save the work.
