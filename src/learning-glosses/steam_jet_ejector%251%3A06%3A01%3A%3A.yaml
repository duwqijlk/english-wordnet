simpleMeaning: In the box where used vapour is cooled to water, any gas that may be there and will not
  turn back to liquid is pushed out by hot vapour.
scope: Its job is in the cooling box, driving out gas that the cooling leaves behind.
examples:
- The steam jet ejector cleared the gas from the condenser.
- Gas that would not turn back to liquid left the condenser through the steam jet ejector.
