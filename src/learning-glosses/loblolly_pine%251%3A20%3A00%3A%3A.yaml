simpleMeaning: In the southeast United States grows a tall wide tree with needles in threes, red-brown
  bark split with deep cracks, and a thick mass of branches at the top.
scope: 'Also called frankincense pine: a tall tree of the southeast United States with needles in threes,
  not a pine of the north.'
examples:
- The loblolly pine at the field's edge had bark split with deep cracks.
- Loblolly pines grow in the southeast of the United States.
