simpleMeaning: said of a thing that means its opposite
scope: 'Another name for antitypic: it is about a thing that means its opposite, not a thing that copies
  it and not a thing that stands for a like thing.'
examples:
- The antitypical villain in the story stands for everything the hero stands against.
- Her antitypical role in the play is the opposite of the kind queen.
