simpleMeaning: Fitted with a radio that lets them talk to the main office, a motor vehicle takes police
  officers round the streets.
scope: Also called a cruiser, a patrol car, a police car, a police cruiser, or a squad car, it is the
  motor vehicle police officers cruise the streets in, with a radio link to the main office.
examples:
- The prowl car cruised down the street.
- A prowl car radioed the main office.
