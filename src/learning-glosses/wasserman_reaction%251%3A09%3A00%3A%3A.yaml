simpleMeaning: 'A blood test for syphilis: a test that fixes a blood part to the germ to find antibodies;
  a positive result shows antibodies are there, so the infection is too.'
scope: A blood test for syphilis, also called Wassermann and Wassermann test; not other blood tests and
  not a test for other infections.
examples:
- The Wasserman reaction was once the standard test for syphilis.
- A positive Wasserman reaction showed the patient had syphilis.
