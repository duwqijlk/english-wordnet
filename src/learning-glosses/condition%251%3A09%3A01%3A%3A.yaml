schema: oewn-learning-gloss-v2
senseId: 'condition%1:09:01::'
synsetId: 05806871-n
simpleMeaning: In an experiment, the step or treatment that is deliberately changed so that its effect
  on a variable can be judged against a control.
scope: A research-design term for the factor an experimenter deliberately alters and compares with a control;
  it is not the state or circumstances something is in, not a level of fitness, not a requirement in a
  contract, and not the verb for putting a smoothing product on something.
examples:
- In the first condition, participants read the same text in silence.
- The researchers changed only one condition between the two groups.
