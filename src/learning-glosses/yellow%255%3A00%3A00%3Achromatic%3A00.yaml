simpleMeaning: having the color halfway between green and orange, like an egg yolk.
scope: This describes something colored that way, not something that has dulled with age, and not the
  name of the color itself.
examples:
- She wore a yellow dress to the party.
- The fields were yellow with ripe wheat.
