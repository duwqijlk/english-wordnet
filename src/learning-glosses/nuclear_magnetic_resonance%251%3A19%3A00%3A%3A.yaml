simpleMeaning: Tiny bits inside atoms, called protons, shake in time with waves of energy when they sit
  in the pull of a magnet
scope: This is the shaking of protons in time with waves of energy in the pull of a magnet, also called
  proton magnetic resonance; not the scan that uses it, and not the pull of the magnet on its own.
examples:
- In nuclear magnetic resonance, the protons in a sample shake in time with waves of energy.
- The team used nuclear magnetic resonance to study the sample.
