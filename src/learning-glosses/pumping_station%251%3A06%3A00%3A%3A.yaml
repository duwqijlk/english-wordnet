simpleMeaning: A building where water-moving machines are set up and worked, as for watering fields.
scope: A building for water-moving machines, also called pump house; not a home for people and not a store
  for tools.
examples:
- The pumping station stands beside the river and sends water to the fields.
- Water for the farm comes from the old pumping station.
