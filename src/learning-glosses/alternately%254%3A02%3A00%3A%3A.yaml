senseId: 'alternately%4:02:00::'
synsetId: 00138372-r
simpleMeaning: in a pattern where one thing comes, then a different one, then the first again, in order
  or in place
scope: This means one, then the other, then the first again; it is not about picking one thing as a new
  choice instead of another.
examples:
- He planted fir and pine trees alternately along the road.
- The lights flashed alternately, red, then blue, then red again.
