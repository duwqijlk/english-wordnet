simpleMeaning: the turning of something, such as a piece of prose, into verse with a fixed beat
scope: The turning of something into verse with a fixed beat, not the writing of new poems and not the
  study of verse.
examples:
- His versification of the old story gave it a steady beat.
- The versification turned the plain prose into lines of verse.
