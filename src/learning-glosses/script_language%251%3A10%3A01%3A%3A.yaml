simpleMeaning: A coding language backing scripts, programs for a special runtime setting that can read,
  not compile, and run tasks by itself that a person could otherwise do one by one.
scope: This sense is also called scripting language, for a coding language backing scripts, programs for
  a special runtime setting.
examples:
- Script languages read programs instead of compiling them.
- Script languages run tasks a person could do one by one.
