simpleMeaning: a well-known woman who sings in opera (a play where the words are sung) and is a star
scope: This is a top woman singer in opera, not a singer of pop songs and not a woman who acts on stage
  without singing.
examples:
- The diva sang the main part in the opera and the crowd stood to clap.
- Everyone waited for the famous diva to come on stage and sing.
