simpleMeaning: A deciduous oak of the eastern United States and southeastern Canada, medium-to-large,
  with dark outer bark, yellow inner bark used for tanning, and broad leaves with five bristle-tipped
  lobes.
scope: This is another name for the black oak tree, distinct from the dye sense of quercitron and not
  a different species from yellow oak.
examples:
- A lone quercitron oak stood at the edge of the field.
- The quercitron oak's inner bark gives a bright yellow dye.
