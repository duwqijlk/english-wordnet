simpleMeaning: a number picked by hand in the maths of general relativity, a theory of how gravity works
scope: A number picked by hand in the maths of general relativity, not a number that the theory itself
  fixes.
examples:
- The cosmological constant is a number in the maths of general relativity that the theory does not fix.
- The cosmological constant is a number that scientists pick by hand, since the theory does not say what
  it must be.
