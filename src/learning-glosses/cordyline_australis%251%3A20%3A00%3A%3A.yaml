simpleMeaning: An elegant tree with one trunk or a branching trunk, each top holding bunched long narrow
  leaves and large sprays of sweet-smelling white, yellow or red flowers, from New Zealand.
scope: Also called a cabbage tree or a grass tree; a New Zealand tree with bunched narrow leaves and sprays
  of sweet-smelling flowers, kin to other trees with bunched leaves.
examples:
- Cordyline australis stands by the gate, its top a bunch of long narrow leaves.
- The Cordyline australis in the garden has sprays of sweet-smelling white flowers.
