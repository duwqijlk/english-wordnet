simpleMeaning: In some lists put in the group Nerodia; a snake of the western United States that seldom
  goes far from water
scope: Also called banded water snake, common water snake and Nerodia sipedon; not a snake of dry land
  far from water.
examples:
- A Natrix sipedon slipped into the pond as we came near.
- The Natrix sipedon lay on a warm rock by the water.
