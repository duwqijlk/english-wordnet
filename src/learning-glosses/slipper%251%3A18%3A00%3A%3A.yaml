synsetId: 10624496-n
simpleMeaning: a person who cannot keep a firm hold with their feet and slides on a surface
scope: A person who slides because their feet lose hold, not the soft low shoe worn indoors that you put
  on and take off easily.
examples:
- On the wet floor he was a slipper, falling again and again.
- On the ice, she became a slipper and could not stay standing.
