simpleMeaning: A long-term disease that steadily worsens, with lasting tiredness and muscle weakness,
  especially in the face and neck; caused by too little of a chemical messenger where nerves meet muscles.
scope: Another name for myasthenia gravis, a long-term disease of tiredness and muscle weakness; not muscular
  dystrophy or ordinary fatigue.
examples:
- Myasthenia is a long-term disease that steadily worsens.
- Myasthenia comes with lasting tiredness and muscle weakness, especially in the face and neck.
