simpleMeaning: A substance like germanium or silicon that carries electricity less than a metal, more
  than one that carries none, and better when hot or when other substances are added
scope: 'Also called semiconducting material: this is the substance itself, not a part or device made from
  it.'
examples:
- Silicon is a common semiconductor used in computer chips.
- The semiconductor carried electricity better as it got hotter.
