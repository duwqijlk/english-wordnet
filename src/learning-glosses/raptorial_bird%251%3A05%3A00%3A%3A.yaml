simpleMeaning: A meat-eating hunter that seeks out and kills other animals
scope: A meat-eating hunter that seeks out and kills other animals; raptor and bird of prey are other
  names for it, not a hunter that eats plants and not a hunting animal that lives in the sea.
examples:
- The eagle is a raptorial bird that hunts in the mountains.
- A raptorial bird circled above the field, looking for mice.
