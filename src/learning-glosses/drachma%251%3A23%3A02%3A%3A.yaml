simpleMeaning: In pharmacy, a unit of weight equal to an eighth of an ounce, or 60 grains
scope: A small old unit of weight, not a coin and not a modern measure.
examples:
- The old recipe called for two drachmas of the powder.
- A drachma was an eighth of an ounce in the old weight system.
