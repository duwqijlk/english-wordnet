simpleMeaning: a plant grown mainly for the seeds you can eat, not for the pod that holds them
scope: A plant grown mainly for the seeds you can eat, not for the pod, also called shell bean plant;
  not a plant grown for its pods, and not a plant grown for its leaves.
examples:
- We grow shell beans for the seeds inside the pods.
- The shell bean in the garden had pods full of large seeds.
