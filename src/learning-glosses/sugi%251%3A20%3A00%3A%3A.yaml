simpleMeaning: A tall green tree that stays green all year, from Japan and China, and gives soft wood
  that people value.
scope: A tall tree from Japan and China that gives soft wood, not a pine and not a tree grown only for
  shade.
examples:
- Sugi trees line the road to the temple in Japan.
- The carpenter chose sugi for the soft wood panels.
