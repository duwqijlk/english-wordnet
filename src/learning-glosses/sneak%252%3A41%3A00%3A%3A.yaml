simpleMeaning: to put, bring, or take something in a secret way, so no one sees
scope: To put, bring or take a thing secretly; not the word for a quiet, secret act, and not a person
  who moves about in secret.
examples:
- She sneaked a look at the letter while he was out.
- He sneaked a cake from the kitchen and ate it upstairs.
