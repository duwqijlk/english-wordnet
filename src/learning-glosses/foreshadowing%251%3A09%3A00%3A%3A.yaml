simpleMeaning: the act of showing, early and in an unclear way, what will happen later, before it happens
scope: 'Also called adumbration: this is giving early, unclear signs of what will come, not a clear statement
  of what will happen and not the later event itself.'
examples:
- The dark clouds in the first chapter are a foreshadowing of the storm at the end of the story.
- The writer uses the broken mirror as foreshadowing of the family's bad luck.
