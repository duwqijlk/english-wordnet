simpleMeaning: clear glass with no colour, made almost all from silica, a hard white stuff found in sand
scope: Clear glass with no colour, made almost all from silica, not a hard stone from the ground, not
  a part inside machines that run on power, and not a solid made from a chemical with tiny parts in a
  set order.
examples:
- The crystal glasses on the table were clear and had no colour.
- She drank water from a crystal cup made of clear glass.
