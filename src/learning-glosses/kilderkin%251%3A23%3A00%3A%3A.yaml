simpleMeaning: An old British measure of how much a container holds, equal to 18 Imperial gallons
scope: This is an old British measure of how much a container holds, equal to 18 Imperial gallons, not
  a firkin and not a modern litre measure.
examples:
- A kilderkin holds 18 Imperial gallons.
- The old brewery measured beer in kilderkins.
