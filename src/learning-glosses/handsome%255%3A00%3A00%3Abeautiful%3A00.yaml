simpleMeaning: good to look at, especially because the shape and the size of the parts are as people think
  they should be
scope: This describes someone or something that is good to look at, not a large amount of money and not
  a kind or generous act.
examples:
- The handsome man had a strong, well-shaped face.
- She thought the handsome actor was good to look at.
