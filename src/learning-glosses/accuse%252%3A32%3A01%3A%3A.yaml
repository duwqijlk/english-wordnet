simpleMeaning: to say a person did a wrong thing, or acted in a bad way, and to put the fault on that
  person
scope: To say a person did a wrong thing and put the fault on them, also called charge, not a formal charge
  made in a court case.
examples:
- They accused him of taking the money.
- She accused her brother of breaking the vase on purpose.
