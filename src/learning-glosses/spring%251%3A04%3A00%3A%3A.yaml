simpleMeaning: A light jump upward or forward powered by the mover's own body.
scope: This is the act of a light upward or forward leap by a person or animal, not the season, a coiled
  metal device, a water source, elastic stretchiness, the verb for leaping or bouncing, or the verb senses
  about appearing, developing, or producing something suddenly.
examples:
- With a spring, she cleared the low fence and landed on the grass.
- The cat made a spring for the bird but missed.
