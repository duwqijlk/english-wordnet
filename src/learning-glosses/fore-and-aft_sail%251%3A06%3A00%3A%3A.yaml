simpleMeaning: a cloth that catches the wind on a ship and runs along the ship from front to back, not
  held across the ship on a long bar
scope: A cloth for catching wind that runs along a ship from front to back, not a square sail set on a
  yard across the ship.
examples:
- The crew raised the fore-and-aft sail as the wind came from behind.
- This fore-and-aft sail runs along the ship, not across it.
