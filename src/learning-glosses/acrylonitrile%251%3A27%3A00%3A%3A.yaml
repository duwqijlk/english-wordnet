simpleMeaning: A clear liquid chemical made from propene, with one double link between its parts and a
  nitrile part in which carbon and nitrogen are joined by three links.
scope: Not a solid plastic and not propene itself.
examples:
- Acrylonitrile is a clear liquid made from propene.
- The workers stored the acrylonitrile in sealed drums.
