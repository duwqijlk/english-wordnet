simpleMeaning: A metal of the rare-earth group, used to make beams of strong light; it is found in the
  minerals apatite, monazite, xenotime and ytterbite.
scope: 'Also called terbium and atomic number 65: a metal of the rare-earth group, used to make beams
  of strong light and found in four stony minerals, not a common metal like iron and not the unit of computer
  memory of the same short name.'
examples:
- Tb is used to make beams of strong light.
- Tb is found in the mineral monazite.
