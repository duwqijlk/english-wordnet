simpleMeaning: In games, a loss or setback put on a player or a team for breaking a rule
scope: In games, a loss put on a player or team for breaking a rule, not the act of punishing itself and
  not the bad ends of an act.
examples:
- The referee gave a penalty for the foul.
- A penalty cost the team its lead in the last minutes.
