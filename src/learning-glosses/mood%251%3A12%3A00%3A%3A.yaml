simpleMeaning: the way a person feels at a time, or the way they often feel, such as happy or angry
scope: Another name for this sense is temper. It is the feeling a person has at a time or often has, not
  the grammar sense of the same word, which is about the forms of a verb.
examples:
- She was in a happy mood all morning.
- His mood changed at once when he heard the bad news.
