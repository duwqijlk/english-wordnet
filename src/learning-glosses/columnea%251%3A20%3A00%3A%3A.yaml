simpleMeaning: a tropical plant whose thick, hairy, slightly toothed leaves set off single or clustered
  flowers from yellow to scarlet; many are grown for their blooms and ornamental foliage.
scope: This is the tropical plant with thick, hairy, slightly toothed leaves and yellow-to-scarlet flowers,
  grown for its blooms and foliage. Not the African violet, another houseplant with flat leaves in a low
  rosette.
examples:
- A columnea hung from the greenhouse roof, its scarlet flowers opening among thick, hairy leaves.
- Growers choose columnea for its yellow-to-scarlet blooms and ornamental foliage.
