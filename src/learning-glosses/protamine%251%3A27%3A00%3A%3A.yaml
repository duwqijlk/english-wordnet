simpleMeaning: a plain protein from fish sperm, rich in arginine, a building block of protein, simpler
  than globulin or albumin, able to undo heparin's power to keep blood from clotting
scope: A simple protein from fish sperm that blocks heparin, not a complex protein and not a drug that
  thins blood.
examples:
- Protamine from fish sperm can undo the effect of heparin.
- The lab used protamine to stop the blood from staying thin.
