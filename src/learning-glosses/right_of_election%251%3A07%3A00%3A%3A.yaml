simpleMeaning: In probate law, after one of a married pair dies, the one living may take either what the
  will leaves them or the share of the goods the law gives.
scope: In probate law, this is the choice left to a wife or husband who outlives the other, between what
  the will gives and the share the law sets.
examples:
- After her husband died, she used her right of election to take the share the law sets.
- The right of election lets a living husband choose between the will and the share set by law.
