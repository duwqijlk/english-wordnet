simpleMeaning: any device in a shell or rocket that starts the stuff inside burning, so the burning stuff
  pushes it forward
scope: 'Also called a fuse, a fusee, a fuzee, a primer and a priming: a part that starts the burning of
  the stuff that pushes a rocket or shell, not the burning stuff itself and not a match used to light
  a fire.'
examples:
- The gunner checked the fuze before loading the shell.
- A faulty fuze failed to set fire to the propellant.
