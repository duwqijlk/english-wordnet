schema: oewn-learning-gloss-v2
senseId: 'fulsomeness%1:10:00::'
synsetId: 06709053-n
simpleMeaning: Too much praise that sounds warm and kind but is not deep or true, given with charm that
  is put on.
scope: This is too much praise that is not deep or true, also called smarm or unction; not honest praise,
  and not plain flattery that makes no show of charm.
examples:
- Her fulsomeness made the old actor smile, though he knew it was not real praise.
- He tired of their fulsomeness and asked for plain words instead.
