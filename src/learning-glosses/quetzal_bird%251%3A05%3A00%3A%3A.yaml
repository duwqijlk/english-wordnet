simpleMeaning: a large trogon, a bright forest creature of Central and South America, with green-gold
  and deep red feathers
scope: 'Also called quetzal: a large bright forest creature of Central and South America, not a parrot
  and not a crow.'
examples:
- We saw a quetzal bird flash green and red through the trees.
- The quetzal bird nests in the cloud forest of Costa Rica.
