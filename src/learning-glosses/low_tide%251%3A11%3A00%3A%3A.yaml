simpleMeaning: The sea at its farthest point out, when the water has gone back the most
scope: Also called low water, this is the sea at its farthest point out, not the sea at its highest point
  and not a river running dry.
examples:
- At low tide we could walk far out across the wet sand.
- The boats sat on the mud at low tide.
