simpleMeaning: to please a person by flattering them a lot, hoping to get their good will
scope: 'Also called court favor, court favour and curry favor: it is pleasing a person with a lot of flattery
  to win their good will, not honest praise and not a plain request for help.'
examples:
- He was currying favour with the manager by flattering her at every meeting.
- They curry favour with the new head by praising all her plans.
