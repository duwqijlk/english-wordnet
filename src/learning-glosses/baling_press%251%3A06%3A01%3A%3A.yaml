simpleMeaning: A machine used mostly to squeeze waste, card, plastic and other things that can be used
  again into tight blocks
scope: A machine that squeezes waste and things that can be used again into tight blocks, not a machine
  that cuts waste and not a machine that burns it.
examples:
- The baling press squeezed the cardboard into a block.
- Workers fed the plastic into the baling press.
