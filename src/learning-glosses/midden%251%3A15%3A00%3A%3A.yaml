simpleMeaning: In archeology, a heap of old home waste, with shells and animal bones, that shows where
  people lived long ago
scope: This old waste heap is also called eitchen midden and kitchen midden; it is not just any heap of
  dung or waste.
examples:
- Digging in the midden, they found shells and old animal bones.
- The midden showed where the first people in the village had lived.
