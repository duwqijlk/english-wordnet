simpleMeaning: A Eurasian plant with drooping, bell-shaped blossoms, usually marked with purple or maroon
  on a pale background; widely planted in gardens as an ornamental.
scope: This is a flower named for the bells once carried by people with leprosy, not the disease itself.
examples:
- Leper lilies were blooming in the damp meadow.
- A single leper lily stood at the edge of the ditch.
