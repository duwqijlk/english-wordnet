simpleMeaning: a funny play put on after the main play in a theater of ancient Rome
scope: A funny play that came after the main play in a Roman theater, not the main play itself and not
  a serious play.
examples:
- The exode made the crowd laugh after the long tragedy.
- An exode closed the evening with jokes and silly acts.
