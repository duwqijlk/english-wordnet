simpleMeaning: Baked in muffin tins over honey or sugar and butter, these sweet rolls come from dough
  spread with sugar and nuts, rolled up and cut into slices.
scope: Also called caramel bun, honey bun, and sticky bun, these are sweet rolls baked in muffin tins
  over honey or sugar and butter.
examples:
- We ate the schnecken straight from the muffin tins.
- She cut the schnecken into slices before serving them.
