simpleMeaning: a joint that moves freely but only lets the bones slide past each other
scope: 'Also called a gliding joint: a joint that slides but does not turn, not a ball-and-socket joint
  and not a joint that does not move.'
examples:
- The articulatio plana in the wrist lets the small bones slide.
- Bones in an articulatio plana glide over each other when you move.
