simpleMeaning: around a town or city, a ring of parks and open country land
scope: A ring of parks and open country land around a town or city, also called greenbelt, not a road
  through a town and not a single park.
examples:
- We walked along the greenway that rings the city.
- The greenway joins the parks on the edge of town.
