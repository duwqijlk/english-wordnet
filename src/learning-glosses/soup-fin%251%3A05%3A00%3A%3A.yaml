simpleMeaning: People in China put the thin flat parts that help this Pacific shark swim into a broth
  dish, and its liver, rich in vitamin A, is prized as well
scope: Soupfin and soupfin shark are other names for this Pacific shark, prized for fins that go into
  a broth dish in China and for a liver rich in vitamin A.
examples:
- The soup-fin lives in the Pacific.
- Chinese cooks use the fins of the soup-fin in soup.
