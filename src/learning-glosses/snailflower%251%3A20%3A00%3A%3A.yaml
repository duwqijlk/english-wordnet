simpleMeaning: Tropical American perennial vine with hanging sprays of yellow and purple flowers; its
  lowest petal coils like a shell, and some botanists group it in the bean genus.
scope: The ornamental tropical vine itself, not the edible bean crop nor the shell its blooms resemble;
  snail bean and snail flower are other spellings of the same plant.
examples:
- Snailflower vines need a strong trellis and plenty of sun.
- The snailflower's curled petal gives the plant its common name.
