simpleMeaning: the act of speaking to a god, especially to ask for something, to show love, to say sorry,
  or to give thanks
scope: 'Also called prayer: speaking to a god to ask, show love, say sorry or give thanks, not a general
  request to a person.'
examples:
- She knelt in supplication and asked God for help.
- Their supplication included thanks for the food they had received.
