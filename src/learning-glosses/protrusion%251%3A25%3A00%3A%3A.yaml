senseId: 'protrusion%1:25:00::'
synsetId: 13917127-n
simpleMeaning: a part that sticks out from the surface or area around it
scope: 'Also called bump, bulge, swelling, hump, jut, prominence, protuberance, excrescence and extrusion:
  a part that sticks out from what is around it. It is the thing itself, not the act of sticking out.'
examples:
- A small protrusion on the rock made it hard to sit on.
- The doctor felt a protrusion on the back of his head.
