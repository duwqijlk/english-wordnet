simpleMeaning: The older parts of the brain in its long history, that is, nearly all of it except the
  outer layer
scope: The older parts of the brain in its long history; paleencephalon and paleoencephalon are other
  names for it, not the outer layer itself and not the whole brain.
examples:
- The palaeencephalon includes the brain stem and other old parts.
- In the palaeencephalon, the oldest brain parts do the basic work.
