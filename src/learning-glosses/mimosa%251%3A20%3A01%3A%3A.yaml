simpleMeaning: any of several bushes or trees that grow in hot places, with leaves made of many small
  parts and flowers that are usually yellow
scope: This is a bush or tree with leaves made of many small parts, not the drink made with champagne
  and orange juice and not the Australian tree with white or silvery bark.
examples:
- A mimosa grew by the gate, its yellow flowers open in the hot sun.
- She planted a mimosa for its soft leaves, each made of many small parts.
