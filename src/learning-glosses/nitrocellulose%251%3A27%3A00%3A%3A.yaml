simpleMeaning: A chemical made from nitric acid, used in quick-drying paint and in explosives.
scope: A chemical made from nitric acid, used in quick-drying paint and in explosives, with cellulose
  nitrate, guncotton and nitrocotton as other names for this sense, not gunpowder and not plain cotton.
examples:
- Nitrocellulose is used in lacquers and explosives.
- The film was made with nitrocellulose, which burns fast.
