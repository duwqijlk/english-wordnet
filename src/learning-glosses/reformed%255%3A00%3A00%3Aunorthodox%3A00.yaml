simpleMeaning: Linked to the Protestant churches that grew out of the Reformation, above all Calvinist
  churches rather than Lutheran ones.
scope: This word describes a church or belief of the Protestant tradition from the Reformation, not a
  Lutheran church nor any Protestant group in general.
examples:
- They attend a Reformed church in town.
- Her Reformed faith shapes her Sundays.
