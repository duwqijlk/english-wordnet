senseId: 'metacenter%1:09:00::'
synsetId: 05875406-n
simpleMeaning: In shipbuilding, the point where vertical lines through a hull's center of buoyancy, upright
  or tilted, cross; its height above the center of gravity shows the ship's stability.
scope: 'This is the shipbuilding sense: the crossing point used to judge a vessel''s steadiness; metacentre
  is the British spelling of the same term, and it is not the center of buoyancy or the center of gravity
  themselves.'
examples:
- The metacenter lay above the center of gravity, so the design was considered stable.
- Naval architects calculate the metacenter to check a hull's stability.
