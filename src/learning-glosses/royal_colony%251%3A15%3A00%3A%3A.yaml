simpleMeaning: Land that the British crown rules through a person it sends to look after it.
scope: This is land the British crown rules through a person it sends to govern it, not land that rules
  itself.
examples:
- The governor sent from Britain ruled the royal colony.
- A royal colony was run by a governor sent from Britain.
