simpleMeaning: a piece of metal or leather that sticks out from the bottom of a shoe and stops the wearer
  from slipping
scope: This is the part that sticks out under a shoe to stop slipping; it is not the fastener that a rope
  is tied around, and not a strip of wood or metal used to make something stronger.
examples:
- His football boots have metal cleats that dig into the wet grass.
- The cleats on her shoes kept her from slipping on the icy path.
