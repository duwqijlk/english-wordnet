simpleMeaning: to hit someone again and again, especially as a punishment or in a violent attack.
scope: This means hitting a person or animal again and again, not winning a game, making a sound, or stirring
  food quickly.
examples:
- The guards beat the prisoner.
- He was beaten by a group of men outside the bar.
