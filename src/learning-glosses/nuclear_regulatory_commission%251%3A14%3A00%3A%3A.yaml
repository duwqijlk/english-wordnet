senseId: 'nuclear_regulatory_commission%1:14:00::'
synsetId: 08139571-n
simpleMeaning: In nineteen seventy-four, the government set up a body on its own that says which places
  that make power from atoms may run and keeps watch on them.
scope: Also called NRC; a body of the government that gives leave to run places that make power from atoms,
  not a body that makes the power itself.
examples:
- The Nuclear Regulatory Commission gave the plant leave to run for ten more years.
- The Nuclear Regulatory Commission watches over every plant that makes power from atoms.
