simpleMeaning: 'A piece of stage scenery: painted canvas stretched over a wooden frame, forming part of
  the stage set.'
scope: A painted screen standing on a theatre stage, not an apartment to live in, and not a tyre that
  has lost its air.
examples:
- The crew painted the flat to look like a brick wall.
- Behind the flats, the stage was a maze of ropes and pulleys.
