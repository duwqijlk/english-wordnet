simpleMeaning: Inside a thin thread of muscle, the stuff that tightens is held by a thin cover that can
  stretch.
scope: The name is for the thin cover that can stretch round the stuff that tightens inside a thin thread
  of muscle, not the stuff itself.
examples:
- Each thin thread of muscle has its own sarcolemma.
- The sarcolemma keeps the stuff that tightens in place.
