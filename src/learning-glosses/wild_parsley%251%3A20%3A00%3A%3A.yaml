simpleMeaning: Any of several kinds of plant not grown by people, of the carrot family, with leaves like
  those of carrots or of a garden herb
scope: Any of several kinds of plant of the carrot family not grown by people; not a garden herb grown
  for food and not a carrot grown for its root.
examples:
- Wild parsley grows in the hedgerow.
- The wild parsley leaves looked like carrot tops.
