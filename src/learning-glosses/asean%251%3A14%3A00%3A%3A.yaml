simpleMeaning: A group of nations in southeastern Asia that work together on trade, money and politics,
  and joined the United States to fight terror around the world
scope: Also called the Association of Southeast Asian Nations; a group of nations in southeastern Asia
  that work together on trade and politics, not a world-wide body and not one country alone.
examples:
- ASEAN brings together nations of southeastern Asia.
- ASEAN joined the United States to fight global terrorism.
