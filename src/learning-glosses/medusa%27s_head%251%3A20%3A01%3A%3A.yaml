simpleMeaning: Many thin branches hang down from this tiny African shrub, which lives for many years and
  holds water in soft thick leaves
scope: A tiny African shrub with many thin hanging branches, not the weedy rye grass of the same name.
examples:
- Medusa's head sat in a small pot, its thin branches hanging down.
- The medusa's head in the dry garden held water in its thick leaves.
