simpleMeaning: a curve that swells out or dips along a wavy edge, found on leaves, cloth, shell rims,
  or on a red blood cell shrunk in salt water
scope: Another name for the crenelle sense, a bump or dip along a wavy edge; not the shellfish, its edible
  muscle, or a thin slice of meat.
examples:
- The edge of the tablecloth was cut into scallops.
- Each scallop along the shell's rim caught the light.
