simpleMeaning: one of a group of hard, glass-like minerals, called silicates (hard earth material made
  with different metals), used in jewellery and for rubbing things smooth
scope: This sense covers the hard mineral itself, both when it is cut for jewellery and when it is used
  for rubbing things smooth.
examples:
- She wore a ring set with a deep red garnet.
- Workers use crushed garnet to smooth the metal surface.
