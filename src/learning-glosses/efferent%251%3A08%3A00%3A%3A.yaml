simpleMeaning: A nerve that carries signals out to muscles or glands.
scope: 'Also called efferent nerve and motor nerve: a nerve that carries signals out to muscles or glands,
  not a nerve that carries signals in and not a muscle.'
examples:
- The efferent carries signals to the muscle.
- An efferent fires when the muscle must move.
