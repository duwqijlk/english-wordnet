simpleMeaning: In American football, the role of the player who opens each play by sending the ball backward.
scope: This is the role on the team, not the player who fills it, and not a cluster of nerve cells, not
  a group of politically moderate people, not the key part of an idea or experience. It is also not the
  adjective sense of holding neither left-wing nor right-wing views, an area near the middle of a region,
  the exact middle point of a line, a place where an activity is concentrated, the filling inside a chocolate,
  the thing attention is fixed on, a building for an activity, the basketball or hockey role, the middle
  of a military formation, a basketball or hockey player, the outfield ground ahead of the catcher, a
  shopping complex, the adjective meaning equally far from both ends, or any verb sense about moving to
  the middle, focusing attention, or having something as the main subject.
examples:
- He was listed at centre when the starting lineup was announced.
- The centre position was the only one still open at training camp.
