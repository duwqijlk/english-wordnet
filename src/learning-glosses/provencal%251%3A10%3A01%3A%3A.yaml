simpleMeaning: The language of the Romance group that people speak in southern France, and also in Monaco,
  Spain and Italy
scope: This is the Romance language of southern France; Provençal, lenga d'oc, lenga d'òc and Occitan
  are other names for this sense, and it is the living speech of the south, close to French and Spanish
  and to the older medieval speech of the same lands.
examples:
- They speak Provencal at home in the south of France.
- Provencal is also heard in Monaco, Spain and Italy.
