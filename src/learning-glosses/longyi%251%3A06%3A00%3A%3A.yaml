simpleMeaning: In India, Pakistan and Burma, a bright fabric wrap, cotton or silk, worn as a skirt, loincloth
  or sash.
scope: Another name, alongside lungi and lungyi, for the long South Asian wrap; it is not a different
  garment.
examples:
- He wore a longyi to the market in Yangon.
- She wrapped the longyi around her waist before leaving the house.
