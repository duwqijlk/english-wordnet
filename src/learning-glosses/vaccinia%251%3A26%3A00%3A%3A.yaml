simpleMeaning: a mild skin sickness of cows that hits the udder, caused by a virus; doctors once used
  it to give people shots against smallpox
scope: 'Also called cowpox: a mild viral skin sickness of cows, not smallpox itself and not a sickness
  of the lungs.'
examples:
- The vaccinia rash on the cow's udder was mild and soon cleared.
- Doctors once used vaccinia to guard people against smallpox.
