simpleMeaning: made or used to help someone understand something
scope: This sense describes words or notes that help a reader understand something. It is not a story
  or talk that only gives news or fun.
examples:
- The book has explanatory notes at the end of each chapter.
- She wrote an explanatory paragraph to help new students understand the rule.
