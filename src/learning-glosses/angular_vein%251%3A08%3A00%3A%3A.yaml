simpleMeaning: A short blood tube near the eye, made where two smaller blood tubes join, that runs on
  as the blood tube of the face.
scope: 'Also called vena angularis: the short blood tube near the eye that two smaller tubes join to make,
  not one of the two smaller tubes on their own and not the blood tube of the face it runs on as.'
examples:
- The angular vein is made where two smaller blood tubes join near the eye.
- The angular vein runs on as the blood tube of the face.
