simpleMeaning: In the smell part of the brain, on both sides, lies a part made of nerve cells, shaped
  like a pear
scope: A pear-shaped part made of nerve cells on both sides of the brain in the smell part, also called
  a piriform area, a pyriform area or a pyriform lobe; it is not a part that moves the body.
examples:
- The piriform lobe sits on either side of the brain.
- The piriform lobe is shaped like a pear and helps with smell.
