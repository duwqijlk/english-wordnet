simpleMeaning: Men who fought in public in ancient Rome, their fights, or things like them
scope: Used of the fighting men of ancient Rome and their fights, not of a modern sport and not of a war.
examples:
- The crowd cheered the gladiatorial contest in the arena.
- His gladiatorial skill won him fame in Rome.
