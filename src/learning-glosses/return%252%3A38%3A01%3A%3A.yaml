simpleMeaning: go back to an earlier position, as when a mathematical operation moves a point or value
  to where it was before
scope: This is not handing something back to its owner; it is moving back to an earlier position, often
  in a mathematical setting.
examples:
- After reaching its peak, the curve returns to its earlier position.
- In this model, the value returns to its starting point after each cycle.
