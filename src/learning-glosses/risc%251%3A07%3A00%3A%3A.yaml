simpleMeaning: In computer science, the way a computer is built, with few orders it can carry out.
scope: 'Also called reduced instruction set computer and reduced instruction set computing: a way of building
  a computer with few orders it can carry out, not a computer with many orders.'
examples:
- The engineer chose RISC for the new machine.
- This computer uses RISC, so it has few orders to carry out.
