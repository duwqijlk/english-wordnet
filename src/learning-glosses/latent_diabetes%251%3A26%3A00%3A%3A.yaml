simpleMeaning: Tests used to find it give odd results, though the person shows no clear signs of this
  mild form of the illness in which blood holds too much sugar.
scope: 'Also called chemical diabetes: a mild form of the illness in which the blood holds too much sugar,
  with no clear signs.'
examples:
- The doctor said his latent diabetes gave no signs, though the test came back odd.
- Her latent diabetes was found only by a test, as she felt quite well.
