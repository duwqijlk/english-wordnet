simpleMeaning: Unmoved by tender feelings, holding firm against pity or love.
scope: Hard and unmoved by tender feeling, also called stony, flint, or flinty; not the sense of sticking
  to wrongdoing.
examples:
- His obdurate heart would not soften at the child's tears.
- Her obdurate manner hid any pity she might have felt.
