simpleMeaning: in the way of a creature that lives on or in another living thing and takes food from it
scope: In the way of a creature that lives on or in another living thing and takes food from it, not in
  the way of a creature that lives alone and not in the way of a hunter.
examples:
- The fungus grew parasitically on the tree.
- Some plants live parasitically on other plants.
