simpleMeaning: like an uncle in being kind, or in letting others do what they want
scope: This is about being like an uncle in kindness or in letting others do what they want, not just
  being an uncle or being related to an uncle.
examples:
- He is an avuncular man who is kind to all the young people in the office.
- She gave them an avuncular smile and let them stay a little longer.
