simpleMeaning: made to have little patience and to feel angry
scope: 'Also called annoyed, irritated, pissed and steamed: having little patience and feeling angry,
  not hurt in the body by a sharp bite or sting.'
examples:
- Stung by her rude words, he answered in a sharp voice.
- She felt stung at being left out and spoke crossly to us.
