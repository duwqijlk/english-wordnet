simpleMeaning: to help someone learn to tell fine differences in taste and judgment, so they judge what
  is good more carefully
scope: 'Also called school, train, educate, and cultivate: teaching a person to judge taste and quality
  well, not lifting a people out of a wild state.'
examples:
- Her teachers worked to civilize her taste in poetry.
- The school hoped to civilize its pupils' taste in art and music.
