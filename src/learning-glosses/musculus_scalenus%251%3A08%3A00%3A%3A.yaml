simpleMeaning: Moving the neck and helping us breathe is the work of one of four pairs of muscles running
  from the neck bones to the second rib.
scope: Scalene muscle and scalenus are other names for these neck muscles, which run to the second rib
  and help us breathe.
examples:
- The musculus scalenus runs from the neck bones to the second rib.
- Each musculus scalenus helps move the neck when we breathe.
