simpleMeaning: In architecture, a strip along the top edge of a wall, with a wavy edge like the letter
  S, half hollow and half bulging
scope: In architecture, a wavy S-shaped strip along the top of a wall; also called cymatium, not a flat
  strip or a round bead.
examples:
- The cyma runs along the top of the old wall.
- The builder carved a cyma into the stone cornice.
