simpleMeaning: In biology, the chain of changes by which a kind of living thing grows and changes over
  time
scope: In biology, the chain of changes in a kind of living thing over time, not the slow change of an
  idea or a skill.
examples:
- The evolution of the horse took millions of years.
- Darwin wrote about the evolution of species.
