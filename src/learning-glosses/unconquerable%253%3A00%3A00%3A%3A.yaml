simpleMeaning: that cannot be beaten, won against, or got over
scope: This means a person, army, or problem cannot be beaten or got over; it is not the sense of a thing
  that cannot be passed or done better than.
examples:
- The small army faced an unconquerable enemy.
- She had an unconquerable will and never gave up.
