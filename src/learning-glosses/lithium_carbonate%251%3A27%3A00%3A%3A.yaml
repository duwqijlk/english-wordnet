simpleMeaning: A white powder used to make glass and ceramics and, as a medicine, to treat some kinds
  of depression and the high moods of bipolar disorder.
scope: The white powder used in glass, ceramics and medicine, not the metal element itself or another
  salt of it.
examples:
- The factory uses lithium carbonate to make heat-resistant glass.
- Lithium carbonate is prescribed to steady the mood of people with bipolar disorder.
