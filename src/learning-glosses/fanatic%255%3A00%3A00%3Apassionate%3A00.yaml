simpleMeaning: with far too much strong interest in a cause or idea and far too much strong care for it
scope: 'Also called rabid, fanatical, or overzealous: showing too much love for a cause or idea, not the
  noun for a person who holds such love.'
examples:
- She has a fanatic love of the team and never misses a game.
- His fanatic support for the cause made him work day and night.
