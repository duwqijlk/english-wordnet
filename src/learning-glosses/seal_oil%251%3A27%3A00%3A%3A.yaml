simpleMeaning: People use this pale yellow to red-brown fatty liquid for soap, for treating leather, and
  for greasing moving parts; it comes from the thick fat of a sea mammal.
scope: This fatty liquid from a sea mammal is used to make soap, treat leather, and grease moving parts.
examples:
- Seal oil is used to treat leather and to make soap.
- A little seal oil greased the moving parts of the machine.
