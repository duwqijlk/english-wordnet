simpleMeaning: A sound made by an engine; it is low and not clear, with short bursts in it
scope: The low, heavy sound an engine makes; not the engine itself and not a fast, high sound.
examples:
- We heard the slow chug of the old train as it left.
- The boat's engine made a steady chug all the way across the lake.
