senseId: 'measuring_rod%1:06:00::'
synsetId: 03741128-n
simpleMeaning: a tool marked at even spaces along its length, used as a guide when judging the size of
  something
scope: A tool with marks at even spaces, used as a guide in finding sizes; measure and measuring stick
  are other names for this sense, not a ruler for drawing lines, and not a tool that weighs things.
examples:
- The builder held the measuring rod against the wall to check its height.
- She laid the measuring rod along the cloth to mark where to cut.
