simpleMeaning: to stay unsure what to do, and keep moving between two ways of acting
scope: To stay unsure between two ways of acting, not to float in the air and not to hang over like a
  threat.
examples:
- He hovered between taking the job and staying where he was.
- They hovered between two plans and picked neither.
