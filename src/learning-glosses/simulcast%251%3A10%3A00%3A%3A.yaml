simpleMeaning: A show sent out at the same time on radio and television, or on two kinds of radio.
scope: Of a show that goes out at once on radio and on television, or on two kinds of radio.
examples:
- The royal wedding was a simulcast on radio and television.
- The station planned a simulcast of the game for radio and TV.
