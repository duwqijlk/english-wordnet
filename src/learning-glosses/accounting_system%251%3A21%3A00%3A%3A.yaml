senseId: 'accounting_system%1:21:00::'
synsetId: 13427135-n
simpleMeaning: A list kept by a bookkeeper, in time order, of what a firm owes and is owed, forming part
  of its main book of records.
scope: Accounting and method of accounting are other names for this sense, not a single list of sales
  and not a bank statement.
examples:
- The firm's accounting system lists every debit and credit in order.
- Our accounting system forms part of the ledger.
