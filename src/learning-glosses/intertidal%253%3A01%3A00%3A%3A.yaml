simpleMeaning: having to do with the shore ground above the low-tide mark, the part of the shore the sea
  leaves bare when the tide is out
scope: Of the shore ground above the low-tide mark; not the sea floor below it and not the dry land beyond
  the shore.
examples:
- Mussels cling to the rocks in the intertidal zone.
- The intertidal flats were covered in seaweed after the tide went out.
