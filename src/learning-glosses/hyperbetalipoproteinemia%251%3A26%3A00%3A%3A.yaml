simpleMeaning: Young people with this inherited condition can find their arteries hardening, because their
  blood carries too much cholesterol and fat-carrying protein bits.
scope: Blood with too much cholesterol and fat-carrying bits marks this inherited condition, not blood
  with too little of them.
examples:
- Too much cholesterol in the blood can point to hyperbetalipoproteinemia.
- Hyperbetalipoproteinemia runs in families, and it can harden the arteries early in life.
