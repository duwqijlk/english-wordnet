simpleMeaning: to change the way you live or act so that you fit in with new or different things around
  you
scope: 'Also called adjust and adapt: to change how you live or act so that you fit in with new things
  around you. Not just to be like something else, or to be in line with a rule, without changing yourself.'
examples:
- After moving to a new town, he conformed to the new way of life there.
- She conformed herself to the new conditions at work and soon felt at home.
