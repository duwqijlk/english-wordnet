simpleMeaning: a kind of large, strong dog first bred in Europe, with a very good sense of smell, used
  for following people or animals by their smell
scope: Also called a sleuthhound. This is the large dog that follows people or animals by smell; not just
  any hunting dog.
examples:
- The police used a bloodhound to follow the missing child's smell.
- A bloodhound can follow a smell that is already days old.
