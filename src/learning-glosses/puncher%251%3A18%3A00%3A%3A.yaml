simpleMeaning: A paid worker who looks after cattle and does other jobs from the back of a horse.
scope: A paid worker who tends cattle on horseback, also called cowherd, cowhand, cowpoke and cowpuncher;
  not a farm owner and not a worker who walks.
examples:
- The puncher rode out each day to look after the cattle.
- A good puncher can rope a calf from the back of a horse.
