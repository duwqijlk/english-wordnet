simpleMeaning: Blood tubes that take in blood from the small tubes between the lobes of the kidney and
  from the small tubes of the rectum.
scope: Blood tubes of the kidney that take blood from smaller tubes; arcuate vein of the kidney is another
  name for this sense; not the main kidney blood tube and not a tube of the liver.
examples:
- The vena arcuata renis takes blood from the small tubes of the kidney.
- A blockage in the vena arcuata renis can harm the kidney.
