simpleMeaning: To make a sound softer and weaker, most of all by wrapping a thing round it
scope: 'Also called dull and damp: making a sound softer, most of all by wrapping, not holding back a
  feeling so no one knows it is there.'
examples:
- She muffled the drum with a thick cloth.
- They muffled the bell so it would not ring so loud.
