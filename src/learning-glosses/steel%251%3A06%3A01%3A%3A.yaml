simpleMeaning: A sword or blade, named for the metal it is made of.
scope: A literary name for the weapon, not the metal itself; it is commonest in phrases such as cold steel.
examples:
- The two men crossed steel in the courtyard.
- He drew the cold steel from its sheath.
