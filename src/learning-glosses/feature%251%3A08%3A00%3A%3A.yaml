simpleMeaning: the parts of a face, such as the eyes, nose, mouth and chin, that give it its shape and
  look.
scope: This is not an important part of something in general, and not a special article or film.
examples:
- She has delicate features and a warm smile.
- His features were hard to see in the photograph.
