simpleMeaning: to work out which kind of plant or animal something is, as is done in the study of plants
  and other living things
scope: Key, name, discover, describe and identify are other names for this sense. This is working out
  which kind of plant or animal something is, as in the study of plants and living things; it is not being
  a mark or quality that makes something different from others.
examples:
- The student distinguished the plant as a type of mint.
- In biology, she distinguished the frog and gave it its correct name.
