simpleMeaning: Points get the curve that leaves the smallest total of each gap times itself by this way
  of fitting.
scope: Also called least squares, it is the way of finding the curve, not the curve itself.
examples:
- They fitted a curve to the points by the method of least squares.
- The method of least squares made the gaps between the points and the curve as small as could be.
