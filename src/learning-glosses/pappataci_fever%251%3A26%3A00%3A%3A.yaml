simpleMeaning: When a sand fly of the kind called Phlebotomus papatasii bites a person, it passes on a
  mild sickness caused by a virus.
scope: Also called sandfly fever and phlebotomus, this is one of the mild fevers spread by the bite of
  a sand fly.
examples:
- He came down with pappataci fever after a sand fly bit him.
- A sand fly bite gave them pappataci fever.
