senseId: 'privilege_against_self_incrimination%1:07:00::'
synsetId: 05192078-n
simpleMeaning: In the United States, the right in the Fifth Amendment to stay quiet rather than answer
  questions that could show you did wrong
scope: 'Also called freedom from self-incrimination: the right to stay quiet when the law asks questions
  that could harm you, not the right to a lawyer and not the right to a fair trial.'
examples:
- She used her privilege against self incrimination and said nothing when the lawyer asked about the money.
- The witness claimed the privilege against self incrimination before he answered any more questions.
