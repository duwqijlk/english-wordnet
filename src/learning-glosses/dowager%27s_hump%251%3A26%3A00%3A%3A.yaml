simpleMeaning: Most often in old women, weak, thinning bones let the spine sink down and bend the back.
scope: It is a bent back that comes when weak bones let the spine sink down, most often in old women.
examples:
- Years of weak bones had left her with a dowager's hump.
- Her dowager's hump came from her thinning bones.
