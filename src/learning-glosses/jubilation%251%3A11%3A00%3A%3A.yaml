simpleMeaning: a happy time with special parties and events to mark something good that has happened
scope: 'Also called celebration: a happy time with special events to mark something good, not the sounds
  or shouts people make when they feel great joy.'
examples:
- The town held a day of jubilation, with music and dancing in the streets, to mark the team's win.
- The jubilation lasted all day as families sang and danced in the streets.
