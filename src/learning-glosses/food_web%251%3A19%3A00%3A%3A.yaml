simpleMeaning: In ecology, many eating chains that cross and join each other link a group of living things
  together
scope: 'Also called a food cycle: in nature, a group of living things joined by the ways they eat each
  other, not one single eating chain and not a list of what one animal eats.'
examples:
- The food web of the lake links plants, small fish, and herons.
- A drought can break links in the food web and change what each animal eats.
