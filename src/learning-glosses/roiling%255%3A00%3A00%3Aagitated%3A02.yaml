simpleMeaning: 'Of water or another liquid: moving hard and fast, churning and turning over and over'
scope: This is water or another liquid moving hard and fast in a wild, turning way; churning and turbulent
  are other names for this sense, not a person who is upset or angry.
examples:
- The roiling river carried logs downstream.
- We watched the roiling water below the falls.
