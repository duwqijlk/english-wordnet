simpleMeaning: approval given by a person or group acting in an official role
scope: This sense is only official approval; the nearest other sense of the same word also covers being
  accepted and noticed in an official way, and neither sense means simple everyday praise.
examples:
- The plan won the approbation of the city council.
- The new rules received official approbation from the board.
