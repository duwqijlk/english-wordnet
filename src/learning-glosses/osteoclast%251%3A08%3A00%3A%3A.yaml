simpleMeaning: A cell in bone that breaks bone tissue down and takes it back in.
scope: A cell in bone that breaks bone tissue down; not a cell that builds bone and not a blood cell.
examples:
- The osteoclast breaks down old bone tissue.
- Osteoclasts clear away bone so new bone can grow.
