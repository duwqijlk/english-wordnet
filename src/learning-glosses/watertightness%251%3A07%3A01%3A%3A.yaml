simpleMeaning: the state of being made so closely joined that water cannot get in or out
scope: The state of being made so closely joined that water cannot get in or out; waterproofness is another
  name for this sense, and it is not merely keeping most water out.
examples:
- The watertightness of the concrete was tested before the tank was filled.
- Good watertightness keeps the cellar dry in a storm.
