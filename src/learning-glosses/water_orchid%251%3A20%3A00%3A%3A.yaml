simpleMeaning: Spikes of large blue blooms rise on a floating plant of warm lands that blocks rivers and
  canals, especially in the southern United States.
scope: Also called water hyacinth, it is the floating plant of warm lands with spikes of large blue blooms,
  unlike a plant that stays rooted in the ground.
examples:
- The water orchid floated with spikes of large blue blooms.
- Water orchids blocked rivers and canals, especially in the southern United States.
