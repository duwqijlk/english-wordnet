simpleMeaning: A bit added to a father's name, like -son in English or O'- in Irish, gives a family its
  name from him or from a father before him.
scope: 'Also called a patronymic: a family name made from your father''s name, not your own first name.'
examples:
- Johnson is a patronym made from the name John.
- Many Irish patronyms begin with O', like O'Brien.
