simpleMeaning: In electronics, the sending of a signal by using it to change a carrier wave, shifting
  its size, rate, or phase.
scope: In electronics, the sending of a signal by using it to change a carrier wave, shifting its size,
  rate, or phase; not the act of changing or fitting a thing to due measure, as in art, nor a way of speaking
  in which the loudness, pitch, or tone of the voice is changed.
examples:
- Their modulation carried the song.
- The modulation was plain on the dial.
