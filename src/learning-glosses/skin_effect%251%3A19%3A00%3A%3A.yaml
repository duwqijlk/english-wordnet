simpleMeaning: In electricity, the way fast-changing current stays near the surface of a wire
scope: In electricity, fast-changing current stays near the surface of a wire; not a change in the wire's
  size and not a loss of power.
examples:
- The skin effect makes current flow near the outside of the wire.
- Engineers allow for the skin effect when they choose wires for fast signals.
