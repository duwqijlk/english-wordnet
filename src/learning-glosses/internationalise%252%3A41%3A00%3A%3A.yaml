simpleMeaning: To place something under the joint control of many nations.
scope: Placing a thing under the joint control of many nations, also called internationalize; not giving
  it the ways of many nations.
examples:
- They moved to internationalise trade in certain drugs.
- The treaty would internationalise the port.
