simpleMeaning: The most common passed-down disease, in which a child's lungs, gut, and pancreas clog with
  thick mucus, from a fault in one gene, with no known cure.
scope: The most common passed-down disease, in which a child's lungs, gut, and pancreas clog with thick
  mucus, from a fault in one gene, with no known cure, also called cystic fibrosis, mucoviscidosis, and
  pancreatic fibrosis.
