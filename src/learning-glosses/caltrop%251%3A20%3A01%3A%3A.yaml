simpleMeaning: A ring of spine-tipped scales surrounds the pinkish to purple flowers of this Mediterranean
  plant, which lives one or two years and now grows wild in America.
scope: The Mediterranean plant also called star-thistle, with purple flowers ringed by spiny scales; not
  the creeping poisonous tropical pasture weed or the water plant with four-pronged nuts.
examples:
- Caltrop's purple blooms sit inside rings of spiny scales.
- Caltrop now grows wild in America as well as around the Mediterranean.
