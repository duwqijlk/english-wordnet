senseId: 'badly%4:02:10::'
synsetId: 00014476-r
simpleMeaning: in a way that works against someone and makes things worse for them
scope: This sense is about a result that is bad for someone; it is not about how much a person feels a
  thing, and not about doing a thing with no skill.
examples:
- The deal turned out badly for the small shop.
- The case ended badly for the family.
