simpleMeaning: in a way that shows sad longing for something that is gone or cannot be had
scope: In a sad, longing way, not in a cheerful way and not in a bitter or angry way.
examples:
- His sister would have looked beautiful in that dress, he thought wistfully, just like an angel.
- She looked wistfully at the old house where she grew up.
