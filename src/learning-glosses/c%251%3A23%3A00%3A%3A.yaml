simpleMeaning: A unit for the amount moved by one ampere in one moment.
scope: This is a unit for the amount of electric charge, also called ampere-second and coulomb, not the
  element, not the vitamin, and not a letter.
examples:
- One C is the charge moved by one ampere in one second.
- The wire held two C of charge.
