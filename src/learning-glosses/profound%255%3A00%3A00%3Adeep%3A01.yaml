simpleMeaning: at or reaching down to a great depth; so deep that no one has been able to measure how
  deep it is
scope: About how deep a place is in the ground or sea, not about deep thought or strong feeling.
examples:
- No rope was long enough to reach the bottom of the profound well.
- Divers cannot go down to the profound depths of the sea.
