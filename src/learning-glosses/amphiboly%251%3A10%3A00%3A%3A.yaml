simpleMeaning: A set of words that can be read in two ways, as in 'they are flying planes', which can
  mean someone flying planes or planes flying on their own.
scope: This is a case where the way words are put together leaves two readings open, also called amphibology.
examples:
- 'The sentence is an amphiboly: ''they are flying planes'' can mean two different things.'
- An amphiboly can leave the listener unsure which meaning is meant.
