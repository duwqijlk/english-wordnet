simpleMeaning: cloth made by people from a chemical called polyacrylonitrile, not from plants or animals
scope: This is cloth made from a chemical. Not the hard, clear material used in paints and glue, and not
  a paint made from that material.
examples:
- She wore a warm acrylic sweater in winter.
- This acrylic fabric is soft and easy to wash.
