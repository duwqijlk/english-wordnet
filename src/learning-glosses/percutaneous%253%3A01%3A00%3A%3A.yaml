simpleMeaning: through unbroken skin, of medicines put straight onto the skin as creams or ointments or
  in patches that release them over time
scope: 'Also called transcutaneous, transdermal and transdermic: through unbroken skin, of medicines put
  straight onto the skin, not a medicine taken by mouth and not an injection.'
examples:
- The percutaneous patch released the drug slowly.
- Percutaneous absorption lets the cream work through the skin.
