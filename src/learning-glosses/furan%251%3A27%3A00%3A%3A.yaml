simpleMeaning: A clear liquid with no colour that can catch fire and is poisonous, used to make nylon
scope: This is a clear liquid with no colour that can catch fire and is poisonous, used to make nylon;
  furane and furfuran are other names for this sense, not water and not oil.
examples:
- Furan is used to make nylon.
- Workers keep furan away from flames because it can catch fire.
