simpleMeaning: a tropical fruit with deep ridges and yellow-brown skin, eaten uncooked in salads or as
  a vegetable, and served as a sweet dish once fully ripe
scope: 'Also called star fruit: a ridged tropical fruit, not the tree that bears it.'
examples:
- She sliced a carambola and put the star-shaped pieces in the salad.
- A ripe carambola makes a sweet dessert.
