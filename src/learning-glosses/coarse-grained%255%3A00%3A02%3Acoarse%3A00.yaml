simpleMeaning: made of, or covered with, rough bits that feel like ground meal
scope: Made of, or covered with, rough bits that feel like ground meal; gritty, grainy, granular, mealy,
  farinaceous and granulose are other names for this, not a smooth surface and not fine powder.
examples:
- The coarse-grained sugar felt rough between my fingers.
- Coarse-grained sand covered the path.
