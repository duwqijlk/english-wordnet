simpleMeaning: a stand on wheels that a camera sits on
scope: A wheeled stand for a camera; not the flat frame on wheels used for moving heavy things, and not
  a toy doll for a child.
examples:
- The camera sat on a dolly for the long moving shot.
- They pushed the dolly slowly as the actor walked down the street.
