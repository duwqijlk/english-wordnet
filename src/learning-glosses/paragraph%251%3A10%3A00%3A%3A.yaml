simpleMeaning: one of the separate parts of a piece of writing, each with its own idea, usually starting
  on a new line set in from the edge
scope: One of the separate parts of a piece of writing, each with its own idea; not the act of writing
  such parts, not the act of splitting a text into them, and not writing about someone in a short part
  of a paper.
examples:
- Each paragraph of the essay makes one point.
- Start a new paragraph when the idea changes.
