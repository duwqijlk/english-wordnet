simpleMeaning: The whole universe still holds the cooled remains of the hot big bang, and we can see them
  today with an average temperature of about 2.725 kelvin.
scope: Also called cosmic background radiation and cosmic microwave background radiation, it is the cooled
  remains of the big bang, not light from stars.
examples:
- The cosmic microwave background was first picked up by radio telescopes.
- The cosmic microwave background still fills the universe today.
