simpleMeaning: A state in which one part of a person's life comes apart from the rest and goes on working
  by itself.
scope: 'Also called disassociation: a state in which part of a person''s life comes apart from the rest
  and works on its own, not the breaking apart of a molecule in chemistry.'
examples:
- Dissociation left part of her life cut off from the rest.
- The doctor spoke of dissociation when memories came back on their own.
