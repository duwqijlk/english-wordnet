simpleMeaning: With seams from the armhole to the neck, this arm cover runs in one piece up to the neck
  of a coat or jumper.
scope: This one-piece arm cover runs to the neck, unlike a sleeve sewn on at the shoulder.
examples:
- Her coat had raglan sleeves.
- Her new jumper had raglan sleeves.
