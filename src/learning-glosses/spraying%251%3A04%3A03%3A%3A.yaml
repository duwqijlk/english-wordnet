simpleMeaning: the spreading of chemicals that kill fungi and insects, or of plant food, over growing
  crops, often from a plane flying low
scope: The spreading of farm chemicals over crops, not the general use of a sprayer to throw out small
  drops of liquid, and not a spray of water.
examples:
- The farmer is spraying the wheat fields with insecticide this morning.
- Spraying from a low plane can cover a whole field in minutes.
