simpleMeaning: a state of mind that is like schizophrenia, a serious illness of the mind, but stays within
  normal bounds
scope: A way of being that is close to a serious mental illness but still normal; not full schizophrenia
  and not just being shy or odd.
examples:
- Her schizothymia showed in odd, quiet ways, but she still lived a normal life.
- His schizothymia made him seem strange at times, yet he stayed within the bounds of normal life.
