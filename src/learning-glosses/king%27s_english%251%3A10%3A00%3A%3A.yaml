simpleMeaning: The approved way to speak in Britain, first based on how people spoke at public schools
  and at Oxford and Cambridge, and until lately used in British broadcasting.
scope: Also called Queen's English, Received Pronunciation and Received Pronunciation language; the approved
  way of speaking British English, not the speech of the regions and not the speech of America.
examples:
- The King's English was once the voice of British broadcasting.
- She spoke the King's English she had learned at school.
