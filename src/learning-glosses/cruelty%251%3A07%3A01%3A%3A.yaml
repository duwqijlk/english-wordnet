simpleMeaning: the quality of being very unkind in a way that makes people feel uneasy or annoyed
scope: This is the quality of being very unkind and making people uneasy or annoyed, not one single unkind
  act done on purpose to cause pain.
examples:
- There was a cruelty in the way he laughed at their mistakes.
- His cruelty made the children feel tense and annoyed whenever he was near.
