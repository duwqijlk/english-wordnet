simpleMeaning: Inside a tank, a boiler, or a reservoir, this tool shows how high the liquid stands.
scope: Also called water gauge and water glass, this is the tool that tells how high liquid stands inside
  a tank, a boiler, or a reservoir.
examples:
- We read the water gage before opening the boiler.
- The water gage told us the tank was nearly full.
