simpleMeaning: An evergreen plant of tropical America with pulpy fruit holding a soap-like substance that
  Native Americans used as soap.
scope: Also called a false dogwood or a jaboncillo; an evergreen of tropical America whose pulpy fruit
  was used as soap, not the tree of northern India and China with purple blossoms and small yellow fruit.
examples:
- The chinaberry grew green all year in the warm valley.
- Native Americans used chinaberry fruit as soap.
