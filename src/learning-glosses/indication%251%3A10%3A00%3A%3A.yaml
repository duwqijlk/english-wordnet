simpleMeaning: a thing that shows or hints at something, like a sign of what is happening
scope: A sign or hint of something, not the act of naming something and not a course of action that is
  needed.
examples:
- An indication of foul play led the police to look more closely.
- The doctor saw indications of strain in the patient's voice.
