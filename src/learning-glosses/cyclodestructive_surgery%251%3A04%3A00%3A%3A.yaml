simpleMeaning: an eye operation that treats a build-up of pressure in the eye by killing the part that
  makes eye fluid with a beam of light
scope: An eye operation that treats pressure build-up by killing the part that makes eye fluid; not one
  to take out a clouded lens and not eye drops.
examples:
- The cyclodestructive surgery eased the pressure in her eye.
- He had cyclodestructive surgery for his glaucoma.
