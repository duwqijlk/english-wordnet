simpleMeaning: The sound people make when something amuses them.
scope: This is the noise alone, and laugh is another name for the same sense; it is not the act of laughing
  or the amused look on someone's face.
examples:
- Her laughter filled the quiet house.
- I could hear laughter coming from the garden.
