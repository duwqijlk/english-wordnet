simpleMeaning: The old sports meeting of all Greece at Olympia in honour of Zeus, held every four years
  from 776 BC.
scope: Also called Olympic Games; the old sports meeting of all Greece at Olympia in honour of Zeus, held
  every four years from 776 BC, not the modern games and not any other Greek games.
examples:
- The Olympian Games honoured Zeus at Olympia.
- Athletes came from all Greece to the Olympian Games.
