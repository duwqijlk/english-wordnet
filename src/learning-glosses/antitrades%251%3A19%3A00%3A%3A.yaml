simpleMeaning: a wind high up in the sky that blows the other way from the trade winds
scope: High winds that blow against the trade winds, not the trade winds themselves and not a wind near
  the ground.
examples:
- The antitrades blow high in the sky, above the trade winds and in the other direction.
- Weather maps show the antitrades moving high above the trade winds.
