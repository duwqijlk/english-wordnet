simpleMeaning: Any of various orchids of the genus Phalaenopsis, with broad oval or egg-shaped glossy
  leaves that often droop, usually dark green with purple tinges or grey and silver mottling.
scope: An orchid of the genus Phalaenopsis with broad glossy leaves, not an orchid of another genus; moth
  plant is another name for the same plant.
examples:
- The moth orchid has broad, glossy leaves that often droop.
- A moth orchid's leaves are usually dark green, sometimes flushed with purple.
