schema: oewn-learning-gloss-v2
senseId: 'correlate%2:31:00::'
synsetId: 00715901-v
simpleMeaning: to link two or more things so that they are joined to each other, complete each other,
  or act on each other in return
scope: This is making things be linked to each other, not the other sense of simply being linked or going
  together on its own.
examples:
- She correlated the weather records from both towns in one table.
- The teacher correlated the test scores with the marks from the earlier tests.
