simpleMeaning: a steep fall of river water from a high place to a lower place
scope: This is a steep fall of river water from a high place to a lower place. It is not a small stream
  on flat ground and not water falling as rain.
examples:
- We stood near the waterfall and got wet from the spray.
- The trail leads to a high waterfall between the cliffs.
