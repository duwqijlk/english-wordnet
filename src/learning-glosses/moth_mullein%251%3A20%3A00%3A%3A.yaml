simpleMeaning: Now a weed in North America, this plant from Europe has smooth leaves and big blooms, yellow
  or purplish in colour.
scope: Among the mulleins of Europe, this one stands out for its smooth leaves and big yellow or purplish
  blooms, and for growing wild in North America as a weed.
examples:
- Moth mullein grows wild in North America.
- The moth mullein had smooth leaves and big purplish flowers.
