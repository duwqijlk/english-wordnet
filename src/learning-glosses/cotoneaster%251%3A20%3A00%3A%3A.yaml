simpleMeaning: Any of a group of shrubs, upright or creeping, with bright autumn leaves and many small
  white to pink flowers followed by tiny red or black fruits.
scope: A shrub grown for its autumn colour and small red or black fruits; not the thorny firethorn, which
  looks similar but has sharp spines.
examples:
- Cotoneaster has spread along the wall, its leaves turning deep red in October.
- She planted cotoneaster at the back of the border for its autumn colour.
