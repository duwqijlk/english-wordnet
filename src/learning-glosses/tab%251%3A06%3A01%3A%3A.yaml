simpleMeaning: a short strip of stuff fixed to a thing, or sticking out from it, that you pull or hold
  to open it, find it, or pick it up
scope: A short strip fixed to a thing or sticking out from it, to help you open it, find it, or hold it,
  not the key on a typewriter or word processor that moves the print along.
examples:
- Pull the tab to open the can.
- Files with a red tab will be stored separately.
