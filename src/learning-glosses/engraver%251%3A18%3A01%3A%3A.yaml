simpleMeaning: A person with special skill whose job is to put designs or writing on a surface by cutting
  into the surface or by using acid on it
scope: A person who puts designs or writing on a surface by cutting into it or by using acid on it, not
  a person who prints from a plate with a design cut into it.
examples:
- The engraver cut the name into the silver plate.
- She worked as an engraver, making fine designs on glass.
