senseId: 'stop%1:10:00::'
synsetId: 07130622-n
simpleMeaning: A consonant sound made by blocking the flow of air at some point and then suddenly releasing
  it.
scope: This is a kind of speech sound, not a written punctuation mark.
examples:
- The /p/ in 'pin' is a stop made by closing the lips and releasing air.
- The first sound in 'dog' briefly blocks the air before letting it out.
