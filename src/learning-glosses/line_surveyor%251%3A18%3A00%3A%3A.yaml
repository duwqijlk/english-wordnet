simpleMeaning: Where things are is marked out by this person with a long pole
scope: Where things are is marked out by this person with a long pole, not a man who puts up wires and
  not a person who draws maps.
examples:
- The line surveyor set out the new road with a range pole.
- A line surveyor was called in to mark the field corners.
