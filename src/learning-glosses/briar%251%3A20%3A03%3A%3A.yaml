simpleMeaning: a rose plant from Europe and Asia, with stems that have sharp points, leaves with a sweet
  smell, bright pink flowers, and then bright red fruit
scope: Also called brier, sweetbriar, eglantine, and sweetbrier. This is the plant, not a pipe made from
  the root of the tree heath.
examples:
- A briar grew by the path, full of pink flowers.
- The sweet smell of the briar leaves filled the garden.
