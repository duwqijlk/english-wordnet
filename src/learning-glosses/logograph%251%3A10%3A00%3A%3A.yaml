simpleMeaning: One written mark that stands for a whole word or phrase, without showing how it is said
scope: 'Also called a logogram: one written mark that stands for a whole word or phrase, without showing
  how it is said, not a letter that stands for a sound and not a picture of the thing itself.'
examples:
- The number '7' is a logograph in English.
- A logograph stands for a whole word at once.
