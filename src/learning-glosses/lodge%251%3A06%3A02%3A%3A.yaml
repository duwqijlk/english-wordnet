simpleMeaning: a small house in a simple country style, used as a place to stay for a short time
scope: A small house in a simple country style, used for a short stay. It is not a hotel for people travelling,
  and not the small house at the gate of a large country house.
examples:
- They slept in a wooden lodge in the forest during their trip.
- The small lodge by the lake was their place to stay for the weekend.
