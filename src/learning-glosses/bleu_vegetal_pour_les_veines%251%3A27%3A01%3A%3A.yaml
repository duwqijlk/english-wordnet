simpleMeaning: Blue make-up used from old times to the 1900s to draw blue lines on the head and neck,
  to look like blue veins and bring out a pale face.
scope: A blue make-up from old times to the 1900s, used to draw blue lines on the skin to look like veins
  and bring out a pale face, not a red make-up and not a cream for healing the skin.
examples:
- Bleu Vegetal Pour Les Veines came in sticks or pencils made from chalk, gum and blue pigment.
- Women used Bleu Vegetal Pour Les Veines to draw blue lines on their temples.
