simpleMeaning: A handsome South American shrub or small tree with bright scarlet flowers and valuable
  fine-grained yellowish wood; it yields a bitter drug from its wood and bark.
scope: Also called bitterwood and quassia; a handsome South American shrub with scarlet flowers, not a
  rose and not a timber tree.
examples:
- Quassia amara bears bright scarlet flowers in the South American forest.
- The bitter drug from Quassia amara comes from its wood and bark.
