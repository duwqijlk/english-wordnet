simpleMeaning: The leaves of this tough cabbage curl and stay loose, so they never pack into a head
scope: 'Also called kale, cole, borecole, and colewort: a tough leafy cabbage whose leaves never form
  a head, not the plain curly-leafed cabbage sense of the same word.'
examples:
- We grow kail in the garden because it stands up to cold weather.
- She cut some kail and put the curly leaves in the soup.
