simpleMeaning: to watch over and lead people in your care, as a teacher does with their pupils
scope: This is looking after people and leading them, as a teacher does, not a person who keeps sheep
  and not looking after sheep or goats.
examples:
- The teacher shepherded her pupils safely across the busy street.
- He shepherded the new pupils from class to class all day.
