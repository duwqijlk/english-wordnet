senseId: 'vaccinate%2:29:00::'
synsetId: 00086587-v
simpleMeaning: to put something into a person's body so the body can fight a disease and not get ill from
  it
scope: Also called inoculate, immunize, and immunise. It is putting something into the body to stop a
  disease, not treating a disease a person already has.
examples:
- The nurse will vaccinate the children at school this week.
- We vaccinate against flu every winter.
