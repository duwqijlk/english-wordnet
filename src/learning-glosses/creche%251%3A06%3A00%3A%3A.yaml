simpleMeaning: a hospital where babies whose parents are not known are taken in and looked after
scope: A hospital for babies whose parents are not known, also called a foundling hospital; not a day
  nursery and not a model of the birth of Christ in the stable.
examples:
- The baby was left at the creche and the nurses cared for her.
- The creche took in foundlings and gave them a home.
