simpleMeaning: the quality of being such that, once done, it cannot be undone or changed
scope: The quality of being such that, once done, it cannot be undone or changed; not the quality of being
  hard to undo, and not the quality of being done in haste.
examples:
- The irreversibility of the choice weighed on her.
- He warned them about the irreversibility of burning the papers.
