simpleMeaning: The way a person behaves or speaks after something happens, showing what they feel or think.
scope: What a person shows in reply to an event, revealing their feelings; not a physical force pushing
  back and not an automatic bodily change.
examples:
- Her reaction to the news was to laugh out loud.
- The audience's reaction told the comedian that the joke had landed.
