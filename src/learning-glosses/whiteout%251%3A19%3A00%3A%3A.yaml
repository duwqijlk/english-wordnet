simpleMeaning: In the far north, cloud over snow makes all things one white, so things are hard to see,
  when light off the snow matches light through the cloud.
scope: In the far north, cloud over snow makes all things one white, not losing sight of things in fog,
  snow, or rain, and not covering a thing with white correction fluid.
examples:
- A whiteout closed in over the camp.
- They were caught in a whiteout on the ice.
