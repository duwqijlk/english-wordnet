simpleMeaning: Drop by drop, a liquid is brought in by pouring or by a shot from a needle
scope: Bringing a liquid in a drop at a time, also called instillation or instilment; not the tool that
  does it and not pouring it all in at once.
examples:
- The instillment of the drug took several minutes, drop by drop.
- Each instillment of the liquid was done slowly, with a small tube.
