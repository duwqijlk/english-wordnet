simpleMeaning: To make someone feel cross, or to trouble them, most of all with small things that keep
  coming
scope: To make someone cross, also called bother, annoy and rag; not to make a body part sore, and not
  to stir a living part into action.
examples:
- It irritates me that she never closes the door after she leaves.
- The dripping tap irritated him all night.
