senseId: admonishing%5:00:00:unfavorable:02
synsetId: 01000283-s
simpleMeaning: Blaming a person for a fault, especially to put the fault right.
scope: Also called reproachful, reproving, or admonitory; blaming a person for a fault, especially to
  put the fault right, not praise.
examples:
- She gave him an admonishing look when he spoke out of turn.
- His tone was admonishing, meant to set the boy right.
