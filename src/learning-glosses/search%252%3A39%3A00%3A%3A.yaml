simpleMeaning: To look carefully through a place, container or person, trying to find someone or something.
scope: This is not just wanting to find one lost thing; it means going through a place or container carefully,
  part by part.
examples:
- We searched the whole house for the keys.
- Volunteers searched the woods for the missing child.
