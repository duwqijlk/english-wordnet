simpleMeaning: In philosophy, the view that everything that happens can be explained by natural causes
  in bodies and living things
scope: In philosophy, the view that everything that happens can be explained by natural causes in bodies
  and living things, not the steps of atoms in a chemical change.
examples:
- Mechanism holds that the mind, too, works like a machine.
- He argued for mechanism against those who saw a spirit in all things.
