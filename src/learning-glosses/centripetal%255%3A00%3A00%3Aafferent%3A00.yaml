simpleMeaning: of a nerve fiber or signal that starts outside and moves toward the brain and spinal cord
scope: Of a nerve fiber or signal that starts outside and moves toward the brain and spinal cord; sensory
  and receptive are other names for this sense, not a signal moving away from the brain and not a muscle
  fiber.
examples:
- Centripetal signals travel from the skin toward the brain.
- A centripetal nerve fiber carries messages inward to the spinal cord.
