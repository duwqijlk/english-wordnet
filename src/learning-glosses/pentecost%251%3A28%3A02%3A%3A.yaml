simpleMeaning: In Judaism, a holy day on the sixth of Sivan, kept to mark Moses receiving the Ten Commandments
scope: In Judaism, this is a holy day on the sixth of Sivan; Feast of Weeks, Shabuoth, Shavous, Shavuot
  and Shavuoth are other names for it, not the Christian holy day of the same name.
examples:
- Pentecost is celebrated on the sixth of Sivan.
- Jews keep Pentecost to mark Moses receiving the Ten Commandments.
