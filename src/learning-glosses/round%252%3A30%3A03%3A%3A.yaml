simpleMeaning: to give a number as a nearby simpler figure, often ending in zero
scope: Not an exact calculation and not a shape becoming curved; it means stating a figure in a simpler
  approximate form.
examples:
- The bill came to $47.80, so we rounded it to $48.
- Officials rounded the population figure to the nearest thousand.
