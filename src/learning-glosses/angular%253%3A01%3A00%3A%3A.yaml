simpleMeaning: judged by an angle, or by how fast an angle changes over time
scope: A way of judging something by an angle, not a thing that has sharp corners or an angular shape.
examples:
- The angular speed of the wheel rose as the motor ran faster.
- Angular momentum stays the same unless something acts on the spinning body.
