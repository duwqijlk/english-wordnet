simpleMeaning: a round shape made of rings, one inside another, as leaves or flower petals make when they
  grow round a centre
scope: 'Also called roll, curl, scroll, coil, ringlet, curlicue, and gyre: a round shape of rings one
  inside another, not a thing wound in one long set of loops and not a lock of hair.'
examples:
- The leaves grew in a whorl around the stem of the plant.
- A whorl of white petals opened at the top of the flower.
