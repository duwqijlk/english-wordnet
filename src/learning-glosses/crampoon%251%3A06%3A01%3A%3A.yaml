simpleMeaning: a pair of iron bars that bend at a joint, used to pick up and lift heavy loads
scope: A pair of iron bars that bend at a joint, used to pick up and lift heavy loads; crampon is another
  name for this sense, not the spiked shoe for ice and not a single hook.
examples:
- The crane's crampoon gripped the heavy crate and raised it.
- He used a crampoon to lift the iron beam onto the truck.
