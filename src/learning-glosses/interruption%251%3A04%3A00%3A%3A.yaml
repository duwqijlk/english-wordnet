simpleMeaning: The act of holding up or breaking into something so it does not go on smoothly.
scope: Also called a break, a gap, and a disruption, this is the act of holding a thing up, not a stretch
  of time when a thing has stopped and not a sudden event that breaks into what you are doing.
examples:
- His interruption of the speaker broke the flow of the talk.
- The interruption in his account left the story unclear.
