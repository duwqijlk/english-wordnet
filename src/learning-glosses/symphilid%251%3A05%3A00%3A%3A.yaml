simpleMeaning: A tiny arthropod, a small creature with jointed legs, that often lives in large numbers
  in the underground parts of market-garden and greenhouse crops.
scope: This is a tiny creature of the soil that lives in large numbers in the underground parts of crops,
  also called garden centipede or garden symphilid, and not a true centipede or a worm.
examples:
- The symphilid damaged the roots of the lettuce.
- Symphilids infested the greenhouse beds.
