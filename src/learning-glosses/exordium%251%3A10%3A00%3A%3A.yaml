simpleMeaning: In rhetoric, a speech or talk starts with this first part
scope: In rhetoric, the opening part of a speech or talk, not the main part of the speech and not the
  end.
examples:
- The exordium of her speech won the crowd before she made her case.
- He kept his exordium short and then moved to his main points.
