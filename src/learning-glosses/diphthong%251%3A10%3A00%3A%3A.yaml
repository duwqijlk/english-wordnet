simpleMeaning: a vowel sound that starts like one vowel and moves toward the sound of another vowel
scope: A vowel sound that starts like one vowel and moves toward another, not a single steady vowel sound.
examples:
- The word 'coin' has a diphthong in the middle.
- In 'house', the diphthong starts like 'a' and moves toward 'oo'.
