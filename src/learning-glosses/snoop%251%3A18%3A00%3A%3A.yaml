simpleMeaning: a person who spies on others, poking into private matters without being asked
scope: This is a person who spies on the private matters of others, not a detective on a case and not
  the act of watching in secret.
examples:
- The old snoop watched the neighbours from behind her curtains.
- Every street has a snoop who knows all the gossip.
