simpleMeaning: Love of Greece and of Grecian things is what this word marks.
scope: Also called philhellene, philhellenic, and Graecophilic; this word marks a love of Greece and Grecian
  things, not a person who loves Greece.
examples:
- Her Graecophile tastes showed in the Greek statues she bought.
- The Graecophile club met to read Greek plays together.
