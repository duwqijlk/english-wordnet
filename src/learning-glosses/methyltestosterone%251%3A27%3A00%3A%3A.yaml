simpleMeaning: Drugs that treat a lack of the male sex chemical and breast cancer in women, and help the
  body grow and gain weight, hold a chemical like it.
scope: This chemical is like the male sex chemical but is not it, and it is found in drugs that treat
  a lack of it and breast cancer in women and help the body grow and gain weight.
examples:
- The drug with methyltestosterone treated the lack of the male sex chemical.
- Methyltestosterone was given to help the body grow and gain weight.
