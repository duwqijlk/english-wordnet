simpleMeaning: Of metals and the like, not made bright and smooth by rubbing.
scope: Metal that has not been rubbed bright, not polished metal and not painted metal.
examples:
- The unburnished copper pot had a dull, dark surface.
- He liked the unburnished look of the old brass lamp.
