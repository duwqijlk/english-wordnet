simpleMeaning: Show or mark something by tapping, for example with your fingers or drumsticks.
scope: This is marking or signalling with taps, not striking your own body in strong feeling or driving
  game from cover.
examples:
- The conductor beat time so the orchestra stayed together.
- He beat a tattoo on the table with his fingers.
