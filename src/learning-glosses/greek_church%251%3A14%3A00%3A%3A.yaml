simpleMeaning: As a part of the Eastern branch, the faith that Greece keeps as its own runs itself.
scope: Also called Greek Orthodox Church; the faith Greece keeps as its own, which runs itself as part
  of the Eastern branch, not the state faith of another land.
examples:
- The Greek Church is the state faith of Greece.
- The Greek Church runs its own affairs as part of the Eastern branch.
