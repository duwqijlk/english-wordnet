senseId: 'poise%1:23:00::'
synsetId: 13737345-n
simpleMeaning: 'A unit of the centimetre-gram-second system: one dyne-second per square centimetre, the
  flow resistance of a fluid dragged at one centimetre a second by one dyne per square centimetre.'
scope: The viscosity unit, a measure of how thickly a fluid resists flow, not the calm composure sense
  of poise or the sense of being balanced.
examples:
- Water's viscosity is about one hundredth of a poise at room temperature.
- Honey is so thick that its viscosity is measured in many poise.
