simpleMeaning: a tall tree of Africa, India, and Malaysia, with fan leaves and hard wood; its sweet sap
  is made into wine and sugar; its leaves serve for thatch and weaving
scope: 'Also called longar palm, lontar, palmyra, toddy palm, and wine palm: a tall fan palm whose sap
  gives palm wine and sugar, not a palm grown only for its fruit.'
examples:
- The palmyra palm grows tall along the dry roads of India.
- Farmers tap the palmyra palm for sweet sap to make sugar.
