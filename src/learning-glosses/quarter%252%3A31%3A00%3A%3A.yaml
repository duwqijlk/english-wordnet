simpleMeaning: to split something into four equal pieces, or to find one fourth of a number
scope: This is the arithmetic verb meaning to split into four or take a fourth, not the military verb
  meaning to house soldiers.
examples:
- Quarter the potatoes and put them in a pan of salted water.
- Take the total cost and quarter it to find what each of you owes.
