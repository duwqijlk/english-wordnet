simpleMeaning: Making a chance choice by throwing or drawing straws, pebbles, or like things.
scope: Making a chance choice by throwing or drawing straws, pebbles, or like things, also called drawing
  lots; not a choice made by voting, and not a choice made by one person alone.
examples:
- They settled it by casting lots.
- Casting lots gave each man an equal chance.
