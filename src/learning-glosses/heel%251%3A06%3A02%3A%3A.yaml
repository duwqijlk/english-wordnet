simpleMeaning: In golf, the part of the head of a club where it joins the shaft, the long part that you
  hold
scope: In golf, this is a part of a club, not the back bottom part of a shoe or boot and not an end of
  a loaf of bread.
examples:
- The ball hit the heel of his golf club and flew to the side.
- The heel of the club is the part near where the shaft starts.
