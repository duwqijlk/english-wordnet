simpleMeaning: the act of giving in and letting another person's wish stand
scope: Also called concession, and another name for it is yielding. This is the act of giving in, not
  the thing a person gives up when they give in.
examples:
- Conceding the point, she agreed to change the plan.
- His conceding of the match surprised all his fans.
