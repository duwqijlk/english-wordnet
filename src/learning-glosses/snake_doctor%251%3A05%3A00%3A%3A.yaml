simpleMeaning: A slim-bodied bug that never stings, with bright wings held out wide while resting, eating
  gnats and midges, young and old alike.
scope: This sense is also called dragonfly, darning needle, devil's darning needle, mosquito hawk, sewing
  needle, skeeter hawk, and snake feeder.
examples:
- A snake doctor hovered over the pond.
- Snake doctors eat gnats.
