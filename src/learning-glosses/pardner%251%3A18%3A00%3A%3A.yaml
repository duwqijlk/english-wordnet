simpleMeaning: a person who joins with someone else in work or an activity that both of them care about
scope: 'Also called partner, and also called collaborator: a person who works with another person in a
  shared activity. It is not a husband, wife, or lover.'
examples:
- He and his pardner ran the ranch together for twenty years.
- She trusted her pardner to watch the cattle while she went for supplies.
