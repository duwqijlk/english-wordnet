simpleMeaning: to act in a greedy, dishonest way and use tricks to cheat others
scope: To cheat others with tricks; not hunting the large sea fish, and not the fish itself or a greedy
  person as a noun.
examples:
- He sharked his way through the card game and took everyone's money.
- She was known to shark in business deals, always hiding the true price.
