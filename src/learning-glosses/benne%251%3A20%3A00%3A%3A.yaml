simpleMeaning: From East India, this herb stands tall for one year and gives sesame seed, or benniseed,
  and sesame oil.
scope: Sesame, benni and benny are other names for this East Indian herb, which stands tall for one year.
examples:
- Farmers grew benne for its seed, which they pressed for oil.
- They grew benne and pressed its seed for sesame oil.
