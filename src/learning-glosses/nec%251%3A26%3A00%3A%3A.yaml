simpleMeaning: a sudden, sore swelling of the gut in a baby born too soon; bits of the gut may die
scope: A sudden gut disease of babies born too soon; necrotizing enterocolitis is another name for this
  sense; not a grown-up gut disease and not a simple stomach upset.
examples:
- The baby in the next cot has NEC and is very ill.
- Doctors watch premature babies closely for signs of NEC.
