simpleMeaning: Draining into the great vein of the brain, a large vein runs along the inner side of the
  part of the brain by the ear.
scope: Also called basal vein, this large vein runs along the inner side of the brain by the ear and drains
  into the great vein of the brain.
examples:
- The vena basalis runs along the inner side of the brain by the ear.
- Blood from the vena basalis drains into the great vein of the brain.
