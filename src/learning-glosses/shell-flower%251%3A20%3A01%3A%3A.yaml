simpleMeaning: A bright marsh plant from eastern and middle North America, its leaves waxy and spear-shaped,
  and a bloom creamy white below and pale pink to deep purple above.
scope: This sense is also called turtlehead, shellflower, snake-head, and snakehead.
examples:
- Shell-flowers grow in the marsh.
- A shell-flower bloomed pink and white.
