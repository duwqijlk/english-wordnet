simpleMeaning: 'A 1960s British youth movement that grew out of the teddy boys: black leather jackets,
  jeans and boots, greased hair, motorcycles, rock''n''roll, and mostly unskilled manual work.'
scope: The 1960s British motorcycle-and-rock'n'roll youth movement also known as bikers; it is not the
  rocking chair, not a rock musician, and not a present-day motorcycle gang.
examples:
- In the 1960s the rockers hung around cafes on their motorcycles.
- He dressed like one of the rockers, with greased hair and a black leather jacket.
