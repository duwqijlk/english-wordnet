simpleMeaning: the state of needing something that is missing or cannot be got
scope: The state of needing something that is missing or cannot be got; also called want or lack, and
  not a fault in a person's character, and not a small amount.
examples:
- The deficiency of rain left the fields dry.
- A deficiency of iron in the diet can make a person feel weak.
