simpleMeaning: the strong and tight feel of healthy muscle and other parts of the body
scope: 'Also called soundness: the strong feel of healthy muscle, not being fixed steady in place.'
examples:
- His muscular firmness showed he was fit and healthy.
- The doctor felt the firmness of the muscle in her arm.
