simpleMeaning: The joint where the rounded head of the upper arm bone fits into a cup-like hollow in the
  scapula, the flat bone of the upper back.
scope: This is the body joint, not the clothing part that covers it, and not the act of lifting or pushing
  with it.
examples:
- He dislocated his shoulder in the accident.
- She felt a dull ache in her shoulder after the long drive.
