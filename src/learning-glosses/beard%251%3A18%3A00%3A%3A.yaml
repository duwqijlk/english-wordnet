simpleMeaning: Someone used to draw suspicion away from another person, most often a woman who goes about
  with a gay man to hide his sexuality.
scope: A decoy person, not the hair on a man's face, the growth on an animal or the tuft on a plant.
examples:
- He asked an old friend to act as his beard at the family dinner.
- She served as his beard at the office party, smiling for the cameras.
