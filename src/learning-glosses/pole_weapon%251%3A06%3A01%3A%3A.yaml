simpleMeaning: A fighter holds a long, usually wooden shaft with its fighting end fixed at the tip, so
  the fighter can strike from farther off in close combat.
scope: 'Also called polearm: a close combat weapon with its fighting end fixed to a long shaft.'
examples:
- The pole weapon let the foot soldier strike from farther off.
- Pole weapons were cheap to make, so peasant levies favoured them.
