simpleMeaning: a professional person who is licensed to practice law and who handles lawsuits or gives
  legal advice
scope: This is the licensed legal professional who handles lawsuits or gives legal advice, not a judge
  and not someone who gives legal advice without a license.
examples:
- She hired a lawyer to review the contract.
- The lawyer argued the case before the judge.
