simpleMeaning: A pair of light loose trousers, tight round the ankles, worn by women of the Indian subcontinent,
  usually with a kameez, a long loose top.
scope: Also called a shalwar; light loose trousers, tight round the ankles, worn by women of the Indian
  subcontinent.
examples:
- She wore a salwar with a bright kameez.
- The salwar was loose at the top and tight at the ankles.
