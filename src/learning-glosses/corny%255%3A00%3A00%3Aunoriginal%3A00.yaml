simpleMeaning: dull and tiring, but trying to seem important or new
scope: 'Also called bromidic, platitudinal, and platitudinous: dull and tiring while trying to seem important
  or new, not a fresh or truly important idea.'
examples:
- The speaker gave a corny speech full of old sayings.
- Her corny poem tried to sound important but said nothing new.
