simpleMeaning: in a way that shows you think you are better or more important than other people
scope: Done in a way that shows you think you are better than other people, not just in a proud or sure
  way.
examples:
- He arrogantly told the waiter that people like him did not matter.
- She arrogantly refused to listen to anyone else's ideas.
