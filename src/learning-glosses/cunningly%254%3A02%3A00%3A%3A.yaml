senseId: 'cunningly%4:02:00::'
synsetId: 00295240-r
simpleMeaning: in a clever and quiet way, so that other people do not notice what is happening
scope: Done in a clever, hidden way; slyly, artfully and craftily are other names for this sense. Not
  done openly or in a plain, direct way.
examples:
- He cunningly arranged to be there when the decision was announced.
- She cunningly hid the letter where no one would think to look.
