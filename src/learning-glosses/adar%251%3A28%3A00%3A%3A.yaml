simpleMeaning: The sixth month of the civil year and the twelfth month of the church year in the Jewish
  calendar, in February and March.
scope: The sixth month of the civil year and the twelfth month of the church year in the Jewish calendar,
  in February and March, not a month of another calendar and not the first month of the year.
examples:
- Adar falls in February and March.
- The fast was held in Adar, the twelfth month of the church year.
