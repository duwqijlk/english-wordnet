simpleMeaning: A breed of medium-sized dogs bred in Tibet, looking like Old English sheepdogs with fluffy
  curled tails.
scope: Also called a chrysanthemum dog; a medium-sized dog bred in Tibet that looks like an Old English
  sheepdog, not a Lhasa apso and not a Shih Tzu.
examples:
- Our Tibetan terrier has a fluffy tail that curls over her back.
- The Tibetan terrier looks like a small Old English sheepdog.
