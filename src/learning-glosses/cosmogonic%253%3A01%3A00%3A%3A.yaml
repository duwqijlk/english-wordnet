simpleMeaning: Of the branch of star study that looks into where the universe came from, what has happened
  to it, its shape and how it moves
scope: This word is used about the branch of star study that looks at where the universe came from, its
  past, its shape and the way it moves; cosmogenic, cosmogonical, cosmologic and cosmological are other
  names for this sense.
examples:
- The cosmogonic theories try to explain how the universe began.
- His cosmogonic ideas dealt with the birth of the stars.
