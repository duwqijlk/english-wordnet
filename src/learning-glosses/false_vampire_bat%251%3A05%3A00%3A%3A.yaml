simpleMeaning: any meat-eating flying mammal from the New or Old World, wrongly thought to drink blood,
  that in fact feeds on insects
scope: This is a meat-eating bat wrongly thought to drink blood; false vampire is another name for this
  sense; not a true blood-drinking bat and not a fruit-eating bat.
examples:
- The false vampire bat hunts insects at night.
- Some people wrongly fear the false vampire bat drinks blood, but it eats insects.
