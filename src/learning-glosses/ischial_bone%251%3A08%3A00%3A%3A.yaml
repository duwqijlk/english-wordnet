simpleMeaning: This is the lowest of the three parts of the hip, sitting below the big upper part of it
scope: The hip is made of three parts, and this is the bottom one, also called ischium or os ischii; not
  the part above it and not the part in front of it.
examples:
- A break in the ischial bone showed up on the X-ray.
- The ischial bone is one of the three parts of the hip bone.
