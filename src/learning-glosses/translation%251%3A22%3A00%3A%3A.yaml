simpleMeaning: In genetics, the way a copy of cell instructions, called messenger RNA, tells a tiny cell
  part to make one kind of protein in the cell fluid
scope: In genetics, this is the cell making a protein by following messenger RNA, not changing words into
  another language and not moving a starting point in mathematics.
examples:
- During translation, the cell uses messenger RNA to build a protein.
- Translation takes place at a tiny part inside the cell fluid.
