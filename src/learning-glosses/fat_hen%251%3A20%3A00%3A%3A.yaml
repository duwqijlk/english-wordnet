simpleMeaning: A plant of Europe that now grows wild in North America and is often picked from the wild
  to cook as a vegetable.
scope: A plant of Europe that now grows wild in North America and is often picked from the wild to cook
  as a vegetable, also called allgood and good-king-henry; not a garden herb grown for the kitchen and
  not a common weed.
examples:
- Fat hen grows along the edge of the field.
- She picked fat hen to cook with the potatoes.
