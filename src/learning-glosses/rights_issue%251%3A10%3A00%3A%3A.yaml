simpleMeaning: New ordinary shares are first put up for sale to people who already own shares in the firm,
  for less than the price the public will pay later.
scope: 'Also called a rights offering: new shares first put up for sale to people who already own shares,
  not a sale of shares to the public.'
examples:
- People who already own shares can buy new shares cheaply in a rights issue.
- A rights issue lets current shareholders buy new shares before the public can.
