simpleMeaning: to throw up what is in the stomach out through the mouth
scope: 'Also called sick, cat, cast, vomit, spew, puke, chuck, purge, retch, honk, barf, disgorge and
  upchuck: to throw up. It is not feeding young birds by bringing food back up.'
examples:
- After the bad food, he regurgitated everything he had eaten.
- The patient regurgitated the medicine a few minutes after taking it.
