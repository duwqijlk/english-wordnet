simpleMeaning: a long stick of wood or metal that fits under the arm and reaches the ground, used by a
  person who cannot walk well
scope: A real stick that a person puts under the arm to help them walk; not a help or support that someone
  depends on too much for other things.
examples:
- After his leg injury, he walked with a crutch under one arm.
- She used crutches to get across the room.
