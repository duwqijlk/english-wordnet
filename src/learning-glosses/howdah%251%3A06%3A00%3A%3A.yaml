simpleMeaning: On the back of a camel or an elephant, people sit in this seat, which is usually covered
  by a roof of cloth
scope: 'Another name for this sense is houdah: a seat, usually with a cloth roof over it, for riding on
  a camel or an elephant, not a saddle for a horse and not a chair for a room.'
examples:
- The howdah swayed gently as the elephant walked along the path.
- She climbed into the howdah on the camel's back.
