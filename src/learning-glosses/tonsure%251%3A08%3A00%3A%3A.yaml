simpleMeaning: the top of a monk's or priest's head, where the hair has been shaved off
scope: The shaved top itself, not the act of shaving it and not the verb for shaving a new monk's head.
examples:
- His tonsure showed as a round, shaved patch on top of his head.
- The old monk's tonsure was clearly visible.
