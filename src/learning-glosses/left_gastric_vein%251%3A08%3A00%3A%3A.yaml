simpleMeaning: The vein that leads to the liver takes blood from this tube, which runs through the fold
  by the stomach from tubes meeting at the top of the stomach.
scope: 'Also called vena gastrica sinistra: a blood tube that runs through the fold by the stomach to
  the vein that leads to the liver.'
examples:
- The left gastric vein empties into the vein that leads to the liver.
- The left gastric vein runs through the fold by the stomach.
