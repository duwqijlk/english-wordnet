simpleMeaning: a kind and caring way of feeling and acting toward other people
scope: A kind, caring attitude toward others, with grace as another name for this sense; not a business
  asset and not a friendly greeting.
examples:
- She showed goodwill to the strangers by sharing her food.
- The two sides met in a spirit of goodwill.
