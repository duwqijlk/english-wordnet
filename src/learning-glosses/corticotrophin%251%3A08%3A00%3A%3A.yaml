senseId: 'corticotrophin%1:08:00::'
synsetId: 05415456-n
simpleMeaning: From the front part of the small gland at the base of the brain comes a chemical that wakes
  the outer layer of the small glands above the kidneys.
scope: Made by the front part of the small gland at the base of the brain, this chemical wakes the outer
  layer of the small glands above the kidneys and is also called corticotropin, adrenocorticotrophin,
  adrenocorticotropin, adrenocorticotrophic hormone or adrenocorticotropic hormone.
examples:
- Corticotrophin prompts the glands above the kidneys to work.
- Corticotrophin was found in her blood.
