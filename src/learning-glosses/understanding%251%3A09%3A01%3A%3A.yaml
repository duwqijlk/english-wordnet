simpleMeaning: the mental state of knowing what something means or how it works.
scope: This is not an agreement between people, not a sympathetic attitude, and not the adjective for
  a kind person; it is the state of grasping meaning.
examples:
- Her understanding of the rules improved after a week of practice.
- The lesson gave students a deeper understanding of the water cycle.
