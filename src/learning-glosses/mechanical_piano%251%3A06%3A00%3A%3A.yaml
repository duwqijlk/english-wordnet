senseId: 'mechanical_piano%1:06:00::'
synsetId: 03743557-n
simpleMeaning: a keyboard instrument that plays by itself, worked by a roll of paper with holes in it
  that move the keys
scope: A piano that plays itself from a roll of paper with holes; player piano is another name for this
  sense, not a piano played by hand, and not a music box.
examples:
- The old mechanical piano in the bar played tunes from a roll of paper.
- A mechanical piano needs no player, as the holed paper roll works its keys.
