simpleMeaning: A drug that fights the AIDS virus by latching onto a key virus part and ending the making
  of more virus; often used with other drugs.
scope: This is a drug that fights the AIDS virus, also called protease inhibitor, not a hired detective
  and not a Greek letter.
examples:
- The doctor gave him a PI with other drugs.
- PI stops the virus from making more of itself.
