simpleMeaning: Plants of Europe, Asia and North America with small prickly seed cases that cling to clothes
scope: Plants of Europe, Asia and North America with small prickly seed cases that cling to clothes, also
  called beggar's lice, not the tropical plants of the same name and not a garden weed.
examples:
- Beggar lice covered his trousers after the walk through the field.
- The beggar lice stuck to her coat with their small prickly seed cases.
