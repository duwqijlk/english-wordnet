simpleMeaning: the salted eggs of a sturgeon or other large fish, usually served as a small first dish
  before a meal
scope: 'Also called caviare: the salted eggs of a large fish, eaten as food; it is not the fish itself,
  and not fish eggs that have had no salt put on them.'
examples:
- They served caviar on small pieces of toast before dinner.
- He spread caviar on the bread and ate it slowly.
