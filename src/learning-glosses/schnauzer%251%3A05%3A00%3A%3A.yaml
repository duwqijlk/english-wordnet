simpleMeaning: An old German breed of sturdy, rough-coated black or greyish terriers with a blunt muzzle,
  quite small to very large; used for catching rats or as guard and police dogs.
scope: A German terrier breed, not a smooth-coated terrier or a poodle.
examples:
- Their schnauzer patrols the yard and barks at every delivery van.
- A schnauzer with a blunt muzzle and wiry coat won the breed class.
