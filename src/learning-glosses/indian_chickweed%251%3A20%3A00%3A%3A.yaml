simpleMeaning: A one-year weed that lies flat and forms a mat, with leaves in rings round the stem and
  small greenish-white flowers, found all over North America
scope: A low mat-forming weed with small greenish-white flowers found all over North America; carpetweed
  and Molluga verticillata are other names for this sense.
examples:
- Indian chickweed covered the bare patch by the path.
- The Indian chickweed formed a flat green mat across the bed.
