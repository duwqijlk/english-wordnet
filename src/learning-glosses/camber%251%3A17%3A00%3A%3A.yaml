simpleMeaning: A slope in the bend of a track or road, the outer side higher to cut the push of turning.
scope: This sense is also called bank and cant, for a slope in the bend of a track or road, the outer
  side higher to cut the push of turning, where bank is a slope across a curved road or track, with the
  outer edge raised to reduce the outward pull of turning, unlike the sense for the set of a car's wheels,
  nearer at the bottom than the top.
examples:
- The camber is a slope in the bend of a track.
- Cambers tilt the outer side higher.
