simpleMeaning: This European butterfly shows reddish-brown wings, and on each wing sits a purple spot
  that looks like an eye.
scope: Also called peacock, it is the European butterfly whose reddish-brown wings each bear a purple
  spot that looks like an eye.
examples:
- A peacock butterfly showed its reddish-brown wings.
- The peacock butterfly's wings each had a purple spot like an eye.
