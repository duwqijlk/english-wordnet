senseId: 'absorption%1:22:02::'
synsetId: 13445356-n
simpleMeaning: In physics, the process by which energy sent out in waves, like light, hits a material
  and stays there, not sent back out and not passed through
scope: This is the physics sense, about energy kept in a material; it is not the chemistry sense where
  one thing soaks into another, and not the body taking in food.
examples:
- Absorption of light by the dark surface turned the light into heat.
- The absorption of the sun's energy by the black roof made the roof hot.
