simpleMeaning: a lack of grace that comes from showing off and thinking too much of yourself
scope: Also called inflation, puffiness, ostentation, ostentatiousness, pompousness, pretentiousness,
  and splashiness, this is a lack of grace that comes from showing off and thinking too much of yourself.
examples:
- His pomposity showed in the way he spoke down to everyone at the table.
- People grew tired of the pomposity in his long, showy speeches.
