simpleMeaning: to change how high or low your voice sounds while you speak
scope: 'Also called tone, and another name is modulate: this is about changing the sound of your voice
  when speaking, not about changing the form of a word to show grammar.'
examples:
- She inflected her voice to make the question sound friendly.
- A good reader inflects his speech so that each character sounds different.
