simpleMeaning: a set of religious acts and beliefs used mainly in Caribbean lands, especially Haiti, with
  magic and with gods and spirits in nature
scope: This sense is the religion itself, also called hoodooism, vodoun, and voodooism. It is not the
  people who follow it, not a small magic object, and not the act of putting magic on someone.
examples:
- Voodoo is practiced mainly in Haiti and other Caribbean lands.
- She studied voodoo and its beliefs about spirits in nature.
