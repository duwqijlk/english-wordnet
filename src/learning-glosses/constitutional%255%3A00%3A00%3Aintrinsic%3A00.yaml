simpleMeaning: being a basic part of something, or a basic quality that something has by its nature
scope: A basic part or quality of something, also called inherent, integral, or inbuilt; not about the
  laws that rule a country.
examples:
- She has a constitutional inability to tell the truth, as if not telling the truth is part of her nature.
- A love of freedom is a constitutional part of his character.
