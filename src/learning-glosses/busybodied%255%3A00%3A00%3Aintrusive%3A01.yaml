simpleMeaning: pushing into other people's affairs in a way that annoys or offends them
scope: 'Also called busy, interfering, meddlesome, meddling and officious: pushing into other people''s
  affairs in a way that annoys them, not just being active and not being merely curious.'
examples:
- The busybodied neighbour kept asking about our plans.
- Don't be so busybodied; let them sort it out themselves.
