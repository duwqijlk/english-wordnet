simpleMeaning: On steep slopes, such as stonework and cliffs in Eurasia and North America, grows this
  small, fine fern of the spleenwort kind.
scope: Also called wall rue spleenwort, it is a small, fine fern of the spleenwort kind found on steep
  slopes in Eurasia and North America.
examples:
- The wall rue grew on a steep slope of stonework.
- We saw wall rue on a cliff in North America.
