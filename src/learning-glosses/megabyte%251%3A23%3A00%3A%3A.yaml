schema: oewn-learning-gloss-v2
senseId: 'megabyte%1:23:00::'
synsetId: 13649517-n
simpleMeaning: a unit for measuring information in computers, equal to 1024 kibibytes (units of 1024 bytes)
  or 1,048,576 bytes
scope: This unit is 1,048,576 bytes, counted with 1024 kibibytes. It is not the other unit with the same
  name that is 1,000,000 bytes, counted with 1000 kilobytes.
examples:
- The program needs 20 megabytes of space, where each unit is 1,048,576 bytes.
- He saved a photo of two megabytes, using the 1024-kibibyte count.
