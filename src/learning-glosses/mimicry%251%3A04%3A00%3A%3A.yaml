senseId: 'mimicry%1:04:00::'
synsetId: 00550509-n
simpleMeaning: The act of copying what someone else does or says.
scope: The act of copying what someone else does or says, not the likeness of one kind of animal to another
  kind or to things in nature, which hides it from animals that hunt it.
examples:
- The child's mimicry of the teacher made the class laugh.
- His mimicry of bird calls was so exact that real birds answered.
