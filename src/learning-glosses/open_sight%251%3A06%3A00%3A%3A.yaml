simpleMeaning: The back aiming piece of a gun, with a cut-out notch in place of a small hole or a scope.
scope: The back aiming piece of a gun, with a cut-out notch in place of a small hole or a scope; not the
  front aiming piece and not a scope fixed to the gun.
examples:
- He aimed through the open sight.
- The open sight has a notch, not a small hole.
