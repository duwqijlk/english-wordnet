simpleMeaning: a set of rules about right and wrong that is held to one group more strictly than to another
scope: A set of rules about right and wrong applied more strictly to one group than to another, not one
  rule for all and not a law.
examples:
- It was a double standard to praise the men and blame the women for the same act.
- The new double standard let one team break rules the other team had to keep.
