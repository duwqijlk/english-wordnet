simpleMeaning: an explanation that helps a person understand something that was hard to understand
scope: 'Also called illumination and elucidation: an explanation that makes a hard idea easier to understand.
  Not taking solid bits out of a liquid.'
examples:
- The teacher's clarification made the rule easy for the class to understand.
- He asked for clarification of the last point in the talk.
