simpleMeaning: A performer placed among the audience who has practised a role but appears to the crowd
  to be reacting naturally.
scope: This is not the word for a living green thing or a factory; it means a hidden performer in a crowd.
examples:
- The comedian's question was answered by a plant in the front row.
- The debate looked spontaneous, but one speaker was a plant.
