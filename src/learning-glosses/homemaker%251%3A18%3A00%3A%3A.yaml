simpleMeaning: a wife who looks after the home and family while her husband earns money for them
scope: This sense, also called housewife, is a wife who runs the home while her husband earns the money;
  it is not a person paid to clean or look after a house.
examples:
- She stayed at home as a homemaker while her husband worked in an office.
- As a homemaker, she cooked, cleaned, and cared for the children each day.
