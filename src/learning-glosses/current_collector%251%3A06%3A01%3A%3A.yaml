simpleMeaning: a roof fitting on a tram, trolleybus or electric train that draws power from overhead wires
  or a third rail to power the vehicle's electrical equipment
scope: The device on a tram or electric train roof that draws power from an overhead wire or third rail;
  not a person who gathers things, and not the wire or rail itself.
examples:
- The current collector on the tram roof pressed against the overhead wire.
- Engineers inspected the current collector for wear.
