simpleMeaning: A lying cheat of a scoundrel, beyond all trust.
scope: A lying cheat of a scoundrel, beyond all trust; also called rogue, rascal, knave, or scalawag;
  not a white man of the South who took the side of the new order after the war, usually for his own gain.
examples:
- Their scallywag sold them out twice.
- The scallywag vanished with the money.
