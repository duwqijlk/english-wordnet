simpleMeaning: A herb from South America with sticky leaves that have small glands, the source of a liquid
  fat.
scope: A South American herb with sticky leaves, the source of a liquid fat, also called melosa; not a
  tree and not a herb grown only for its flowers.
examples:
- The madia oil plant grew in the dry field.
- Farmers grew the madia oil plant for its oil.
