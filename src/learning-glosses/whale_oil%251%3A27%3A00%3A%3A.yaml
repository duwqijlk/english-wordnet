simpleMeaning: a white to brown liquid got from the thick fat under the skin of a huge sea animal, once
  used to give light
scope: 'Also called train oil: a white to brown liquid from the fat of a huge sea animal, once used to
  give light, not a cooking oil and not lamp oil from plants.'
examples:
- Whale oil once lit the lamps of many homes.
- The old lamp burned whale oil through the long winter night.
