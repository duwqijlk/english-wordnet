simpleMeaning: Split the length a thing covers by the time it took, with the length counted in thousands
  of metres and the time in sixty minutes
scope: A measure of speed, also called kilometers per hour, kilometres per hour and kph; not a distance
  and not a time.
examples:
- The car was doing 90 km/h on the motorway.
- The speed limit here is 50 km/h.
