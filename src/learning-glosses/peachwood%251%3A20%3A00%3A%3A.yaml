simpleMeaning: a hot-climate tree with a prickly trunk, whose heavy red timber gives a red dye and is
  used for making cabinets
scope: A hot-climate tree with a prickly trunk, whose heavy red timber gives a red dye and is used for
  making cabinets; peach-wood, brazilwood and pernambuco wood are other names for this sense.
examples:
- The peachwood gives a rich red dye.
- Cabinet makers prize peachwood for its heavy red timber.
