senseId: 'suppose%2:31:06::'
synsetId: 00718436-v
simpleMeaning: to accept something as true in advance, without question or proof
scope: Something accepted as a starting point without question; not a belief held on weak evidence, and
  not a condition required by logic.
examples:
- The plan supposes that funding will continue.
- We supposed the readers already knew the background.
