simpleMeaning: A sham to fool folk, for a gain to its maker.
scope: This sense is also called fraud, hoax, humbug, and fraudulence, for a sham to fool folk, for a
  gain to its maker, where a fraud is a thing made to fool folk, or a planned trick meant to win a gain
  for the one behind it.
examples:
- The dupery fooled folk.
- Dupery is a sham to fool folk.
