senseId: 'commentary%1:10:00::'
synsetId: 06775422-n
simpleMeaning: notes added to a book or other piece of writing, that judge its hard parts, make them clear,
  or show them with examples
scope: 'Also called comment: written notes that explain or judge part of a book or other text, not spoken
  remarks during a game or show.'
examples:
- The commentary at the foot of the page explains the old poem line by line.
- She read the commentary before she tried the hard chapter.
