simpleMeaning: A civilian reserve part of the United States Air Force that can be called up fast in war
  and that helps in a crisis at home
scope: A reserve air force, also called the Air National Guard; not the regular Air Force and not the
  Army.
examples:
- He serves in the ANG on weekends.
- The ANG was called up during the flood.
