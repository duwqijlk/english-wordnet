simpleMeaning: A blood check that finds syphilis, using a check that fixes a blood part to the germ to
  find antibodies; a positive result means the infection is there.
scope: A blood check for syphilis, also called Wasserman reaction and Wassermann; not other blood checks
  and not a check for other infections.
examples:
- The Wassermann test was once the standard check for syphilis.
- A positive Wassermann test showed the patient had syphilis.
