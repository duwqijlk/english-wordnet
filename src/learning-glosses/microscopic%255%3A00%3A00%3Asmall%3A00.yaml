simpleMeaning: so small that you cannot see it without a microscope (a tool that makes very small things
  look big)
scope: Also called microscopical. This means too small to see with the eyes alone, not the sense that
  means seen with a microscope, and not the sense about using a microscope.
examples:
- The tiny bugs were microscopic, so we needed a microscope to see them.
- She found a microscopic piece of dust on the glass.
