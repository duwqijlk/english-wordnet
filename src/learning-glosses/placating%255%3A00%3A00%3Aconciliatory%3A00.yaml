simpleMeaning: meant to make someone less angry by giving them what they ask for or by giving up part
  of what you want
scope: 'Also called appeasing, placatory, and placative: meant to calm anger by giving in, not just kind
  or friendly in a general way.'
examples:
- She gave a placating smile and offered him the larger share.
- His placating words helped, because he agreed to meet most of their demands.
