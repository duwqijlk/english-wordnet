simpleMeaning: A thick, sticky molecule made of sugars in the spaces of connective tissue, the fluid of
  movable joints and the eye's fluids, binding tissue together and protecting it.
scope: This is the natural substance in the body, not the cosmetic gel or injection or the dietary supplement
  sold under the same name.
examples:
- Hyaluronic acid gives the fluid in joints its slippery thickness.
- The eye's clear fluid contains hyaluronic acid.
