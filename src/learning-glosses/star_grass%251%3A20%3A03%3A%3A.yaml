simpleMeaning: The bitter roots of these long-lived Aletris plants, with leaves like thin blades, are
  said to cure belly pain, and there are several kinds of the plant.
scope: 'Also called colic root, colicroot, crow corn, and unicorn root: a long-lived Aletris plant with
  bitter roots said to cure belly pain, not the star grass of the Hypoxis group with yellow flowers.'
examples:
- The star grass had bitter roots that people said cured colic.
- They dug up star grass for its bitter roots.
