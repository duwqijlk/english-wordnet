simpleMeaning: a plant that lives for many years, found in the northern half of the world, with thin stems
  and blue flowers shaped like bells
scope: Also called harebell, this is a long-lived plant with thin stems and blue flowers shaped like bells,
  not a plant that lives for only one year.
examples:
- Bluebells grew under the trees, their blue flowers hanging like small bells.
- She picked a bunch of bluebells with thin stems in the spring wood.
