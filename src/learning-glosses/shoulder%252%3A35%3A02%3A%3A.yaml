simpleMeaning: Lift someone or something onto the top of your upper body.
scope: This is lifting a person or load to carry it, not pushing your way forward with the body.
examples:
- She shouldered her small son so he could see the parade.
- He shouldered the heavy sack and carried it to the barn.
