simpleMeaning: In a way that spreads untrue and harmful claims about a person, so as to damage their good
  name
scope: Done by spreading untrue and harmful claims about a person, also called calumniously; not honest
  criticism and not a plain mistake in what is said.
examples:
- He spoke slanderously of his rival to ruin her name.
- The letter attacked him slanderously, with claims that were never proved.
