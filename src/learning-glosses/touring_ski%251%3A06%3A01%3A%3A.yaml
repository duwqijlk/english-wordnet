simpleMeaning: A board worn on each foot for snow travel, whose special binding (the fitting that holds
  the boot) frees the heel for walking uphill and locks it for the descent.
scope: This is the board built for both climbing and downhill runs, not a downhill-only board with a fixed
  heel, and not a snowboard.
examples:
- She clipped into her touring skis at the foot of the ridge.
- Touring skis let him walk uphill and then ride the slope down.
