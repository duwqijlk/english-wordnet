simpleMeaning: any long thin thing that looks like a fine line
scope: 'Also called ribbon: any long thin thing that looks like a fine line, not a fine cord used to sew
  and not the links that join the parts of a tale.'
examples:
- From the air, the road was a thin thread across the land.
- A thread of smoke rose up from the chimney.
