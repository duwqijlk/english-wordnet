simpleMeaning: a person who checks insurance claims or claims for loss or harm and advises how much should
  be paid
scope: A person who checks insurance claims or claims for loss or harm and advises how much should be
  paid, also called an adjuster, a claim agent, a claims adjuster or a claims adjustor; not an insurance
  seller and not a judge.
examples:
- The adjustor visited the shop after the fire.
- The adjustor advised the firm to settle the claim in full.
