simpleMeaning: A vowel with these two dots over it is sounded on its own, not joined with the vowel next
  to it
scope: Dieresis is another name for these two dots over a vowel, which show it stands alone.
examples:
- The diaeresis over the second vowel shows it is sounded apart.
- Use a diaeresis to keep two vowels from joining.
