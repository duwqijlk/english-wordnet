simpleMeaning: A phone, a toilet, or some other place is taken by someone else and shows it is not free;
  'engaged' is the British word for a busy phone line
scope: It is also called busy and engaged.
examples:
- The lavatory is in use, so she waited outside.
- Her line is in use; I kept getting a busy signal.
