senseId: 'despotic%3:01:00::'
synsetId: 02722028-a
simpleMeaning: of or like a ruler who has all the power and uses it in a cruel and unfair way
scope: Of or like a ruler who has all the power and uses it in a cruel, unfair way, not a place that is
  ruled by such a ruler and not the sense that means having complete power with no limits.
examples:
- The king's despotic rule left no one free to speak against him.
- He gave orders in a despotic way and never listened to anyone else.
