simpleMeaning: A white solid natural stuff, found in the earth as it is, that gives magnesium.
scope: A white solid natural stuff found in the earth as it is, that gives magnesium, also called magnesia
  and magnesium oxide, not a soft clay and not a dark rock that gives iron.
examples:
- Periclase is dug out as a white stone.
- The works used periclase as a source of magnesium.
