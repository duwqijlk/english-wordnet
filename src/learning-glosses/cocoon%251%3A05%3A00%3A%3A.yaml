simpleMeaning: a silky case spun by the young of many insects to guard them while they change shape, and
  by spiders to guard their eggs
scope: A silky case spun to guard young insects or spiders' eggs, not a hiding place a person withdraws
  into and not the act of wrapping something up for safety.
examples:
- The caterpillar spun a cocoon on the branch.
- Inside the cocoon, the pupa slowly changes into a moth.
