simpleMeaning: Paper or cloth comes out smooth and shiny from this machine, which presses it between plates
  or passes it through rollers.
scope: This machine, not the act of pressing, makes paper or cloth smooth and shiny by pressing it between
  plates or passing it through rollers.
examples:
- The calender pressed the paper until it shone.
- They ran the cloth through the calender to glaze it.
