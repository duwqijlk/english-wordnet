simpleMeaning: First made by troops from Japan shouting their cheer, a mass rush of soldiers at the enemy,
  heedless of how many die.
scope: This rush by many soldiers is also called a banzai charge, and it is not a careful move that spares
  lives.
examples:
- The banzai attack came with the soldiers shouting 'banzai' as they ran.
- The banzai attack cost many lives, yet the troops pressed on.
