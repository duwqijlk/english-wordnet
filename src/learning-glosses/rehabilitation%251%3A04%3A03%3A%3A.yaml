simpleMeaning: the act of showing that a person is good and honest, and bringing back the good opinion
  people had of them
scope: This sense is about a person's good name, not treatment to help the body get well again, and not
  making waste land fit for use.
examples:
- His rehabilitation took years, but at last people saw he had done no wrong.
- After the false charge was dropped, her rehabilitation helped people trust her again.
