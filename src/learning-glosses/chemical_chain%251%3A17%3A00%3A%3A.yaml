simpleMeaning: In chemistry, a row of atoms joined one to the next, most often inside a molecule built
  on carbon
scope: In chemistry, a row of atoms joined one to the next; chain is another name for this sense, not
  a metal chain and not a chain of shops.
examples:
- The chemical chain runs through the whole molecule.
- In the chemical chain each atom joins the next.
