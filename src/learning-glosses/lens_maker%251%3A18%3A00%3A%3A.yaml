simpleMeaning: A worker who makes glasses to put right faults in people's sight
scope: A worker who makes glasses for faulty sight; optician is another name for this sense, not the doctor
  who tests the eyes and not a shop that only sells glasses.
examples:
- The lens maker ground the glass to match her prescription.
- A lens maker fitted the new glasses to his face.
