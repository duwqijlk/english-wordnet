simpleMeaning: 'Everything used in one field or job: skills, natural abilities and tools of all kinds'
scope: Also called repertory. This is all the skills, natural abilities and tools for a field or job,
  not the set of plays and songs a performer can perform.
examples:
- Teaching young children needs a wide repertoire of skills and ways to help them learn.
- His repertoire of repair methods lets him fix many kinds of machines.
