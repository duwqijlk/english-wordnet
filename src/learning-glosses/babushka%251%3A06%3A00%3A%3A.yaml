simpleMeaning: a woman's headscarf folded into a three-sided shape and tied under the chin, worn by Russian
  peasant women
scope: A scarf worn folded and tied under the chin in this way, not a hat and not a scarf worn loose around
  the neck.
examples:
- She wore a babushka tied firmly under her chin.
- The old woman covered her hair with a babushka before going to the market.
