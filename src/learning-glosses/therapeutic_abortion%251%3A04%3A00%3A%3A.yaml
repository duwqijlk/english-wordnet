senseId: 'therapeutic_abortion%1:04:00::'
synsetId: 00232279-n
simpleMeaning: an end to a pregnancy brought about with the law's leave for health reasons, as when the
  mother's life is at risk
scope: An end to a pregnancy for health reasons with the law's leave, not a pregnancy ended by choice
  for other reasons and not a natural loss of a pregnancy.
examples:
- The doctors said a therapeutic abortion was needed to save the mother's life.
- She had a therapeutic abortion after the doctors found a serious risk to her health.
