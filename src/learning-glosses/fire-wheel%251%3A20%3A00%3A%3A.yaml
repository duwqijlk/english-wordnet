simpleMeaning: A one-year plant of the middle United States, with showy long-stalked yellow flower heads
  marked with scarlet or purple in the middle
scope: This is a one-year plant of the middle United States with showy yellow flower heads; blanket flower
  and fire wheel are other names for this sense, not a lasting plant and not a plain yellow flower.
examples:
- The fire-wheel bloomed in the field.
- Fire-wheel flowers stood tall in the sun.
