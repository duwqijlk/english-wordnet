simpleMeaning: a thing set up in sport for a person who shoots guns or arrows to aim at
scope: 'Also called target: a thing set up to aim at when shooting, not the end of a cigarette, not a
  large barrel for liquid, and not a person that others laugh at.'
examples:
- The archers aimed at the butt at the far end of the field.
- He set up a butt for shooting practice.
