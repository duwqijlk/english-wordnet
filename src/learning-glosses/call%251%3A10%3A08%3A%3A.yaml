simpleMeaning: a demand from a broker that a customer put in more money to bring the amount in their account
  up to the required minimum
scope: This is not a phone conversation, a shout or a sports decision; it is a financial demand about
  money in a trading account.
examples:
- The broker issued a call after the share price fell.
- She had to deposit more money to meet the call from her broker.
