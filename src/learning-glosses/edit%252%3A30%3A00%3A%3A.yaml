simpleMeaning: To get a text ready to be published or shown by fixing and changing it.
scope: This is improving a text so it can be published, not supervising a publication or cutting parts
  out.
examples:
- It took him three days to edit the translation.
- She edits each chapter carefully before sending it to the publisher.
