simpleMeaning: having done things that are bad and break what people know is right and good
scope: 'Also called wicked, and also called unholy: it is about a person who has done bad things, not
  about an act said to be very bad in itself.'
examples:
- He led a sinful life and later felt sorry for the bad things he had done.
- She thought her sinful past would stop her from being forgiven for what she had done.
