simpleMeaning: the thread that is woven across the long threads (the warp, the threads that run from end
  to end) when cloth is made
scope: Also called pick, filling and weft, this is the thread that goes across in weaving, not the long
  threads that it goes across.
examples:
- The woof is made of red thread, while the long threads are white.
- The weaver passed the woof back and forth across the loom.
