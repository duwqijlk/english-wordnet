simpleMeaning: With pink flowers and a sickening smell, this low soft-stemmed plant grows in Europe.
scope: People also call it danewort; it is a low soft-stemmed plant of Europe with pink flowers and a
  sickening smell, not the North American dwarf elder with black fruit and bark used as medicine.
examples:
- The dwarf elder bears pink flowers and gives off a sickening smell.
- You can tell the dwarf elder by its pink flowers and sickening smell.
