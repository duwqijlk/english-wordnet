simpleMeaning: To hide a mark on paper with a liquid that dries over it.
scope: To hide a mark on paper with a liquid that dries over it; not the far-northern state in which cloud
  over snow turns all things one white so nothing can be seen, when light off the snow matches light through
  the cloud, and not losing sight of things in daylight in heavy fog, snow, or rain.
examples:
- She used whiteout on the letter to hide a wrong word.
- He painted whiteout over the mistake and let it dry.
