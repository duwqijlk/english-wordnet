simpleMeaning: A fern that grows in mats on rock or ground, with creeping roots and large divided fronds,
  found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern shared with common polypody, not the tropical fern with brown
  scaly rhizomes.
examples:
- Golden polypody crept along the ground under the oak trees.
- The fronds of golden polypody formed a thick mat on the shaded bank.
