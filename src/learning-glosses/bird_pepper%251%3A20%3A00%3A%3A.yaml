simpleMeaning: Thought to be the forebears of the sweet kind and many hot kinds, this plant bears very
  small, very hot, long red fruit, with wild kinds from warm America.
scope: This is the plant thought to be the forebear of the sweet kind and many hot kinds, not one of those
  kinds itself.
examples:
- The bird pepper bore very small red fruit.
- A bird pepper grew wild in warm America, its fruit very hot.
