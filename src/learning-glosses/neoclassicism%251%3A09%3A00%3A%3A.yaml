simpleMeaning: A return to an old Greek and Roman style in art, books, buildings or music, but seen in
  a new way or for a new reason.
scope: A return to an old Greek and Roman style with a new view, not a plain copy of old work and not
  the romantic style.
examples:
- Neoclassicism shaped the clean lines of the new library.
- The painter's neoclassicism brought back the calm forms of ancient Rome.
