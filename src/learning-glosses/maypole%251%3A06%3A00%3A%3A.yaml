simpleMeaning: An upright post dressed with long ribbons, which dancers hold as they dance round it on
  the first day of May.
scope: An upright post dressed with ribbons for dancers to hold on the first day of May; not a flagpole
  or a bare post.
examples:
- Children danced round the maypole with ribbons in their hands.
- They raised the maypole in the village green for May Day.
