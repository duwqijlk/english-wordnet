simpleMeaning: a plain kind of body stuff found in hard outer parts, in gristle, and in the lens of the
  eye
scope: A plain body stuff found in hard outer parts, in gristle, and in the lens of the eye; albuminoid
  is another name for this sense. Not a muscle and not a bone.
examples:
- The lens of the eye holds scleroprotein.
- Scleroprotein is found in the hard outer parts of the body.
