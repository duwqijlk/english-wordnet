simpleMeaning: trying too hard to please people in what you say or how you act, in a smooth way that is
  too much and not pleasant
scope: Too much, smooth praise or talk that tries to please and feels false, also called oily, buttery,
  soapy, unctuous, smarmy and oleaginous; not honest, kind praise given in a normal way.
examples:
- He gave her a fulsome welcome that sounded false.
- The fulsome praise in the speech made people feel uneasy.
