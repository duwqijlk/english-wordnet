simpleMeaning: Mainly watching whether the ball goes out of bounds or a player is offside, a second official
  in a ball game helps the main official
scope: This second official, also called a lines umpire, helps the main official in a game rather than
  running the game itself.
examples:
- The assistant referee raised his flag when the ball went out of bounds.
- In soccer, the assistant referee runs along the side of the field and watches for offside.
