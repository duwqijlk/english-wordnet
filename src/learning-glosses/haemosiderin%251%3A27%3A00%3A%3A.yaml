synsetId: 15051530-n
simpleMeaning: A sign that the body's handling of iron has gone wrong can be this grainy brown stuff,
  made of iron oxide and left behind when haemoglobin breaks down.
scope: Also called hemosiderin, this is a grainy brown stuff left when haemoglobin breaks down, not haemoglobin
  itself.
examples:
- The doctor found haemosiderin in the tissue where old blood had broken down.
- Haemosiderin in the liver can point to trouble with iron.
