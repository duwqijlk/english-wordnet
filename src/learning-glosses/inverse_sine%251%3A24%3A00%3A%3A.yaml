senseId: 'inverse_sine%1:24:00::'
synsetId: 13809763-n
simpleMeaning: in maths, the angle that goes with a given number, found by undoing the ratio of the far
  side to the longest side of a right-angled triangle
scope: In maths, the angle that goes with a given number, found by undoing the sine, also called arc sine,
  arcsin or arcsine; not the sine itself and not the inverse cosine.
examples:
- The inverse sine of 0.5 is 30 degrees.
- Use the inverse sine to find the angle.
