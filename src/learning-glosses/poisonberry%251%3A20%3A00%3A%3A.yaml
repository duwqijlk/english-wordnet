simpleMeaning: A white-flowered herb from Eurasia that now grows wild in America; its hairy leaves are
  toxic, while its black berries may be safe to eat or may be harmful.
scope: Another name for common nightshade and poison-berry, also called black nightshade; the whole white-flowered
  plant, not its berries alone.
examples:
- Poisonberry bears white flowers above toxic, hairy leaves.
- Birds eat poisonberry's black berries, though people cannot be sure they are safe.
