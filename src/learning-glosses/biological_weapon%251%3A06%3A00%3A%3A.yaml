simpleMeaning: any thing that can be used in war to harm people and animals or spoil food with germs,
  viruses, or poisons
scope: 'Also called a bioweapon and a bioarm: any thing that can be used in war to harm people and animals
  or spoil food with germs, viruses, or poisons, not the act of using it and not a chemical weapon.'
examples:
- The smallpox virus was feared as a biological weapon.
- A biological weapon can spread sickness without a gun or a bomb.
