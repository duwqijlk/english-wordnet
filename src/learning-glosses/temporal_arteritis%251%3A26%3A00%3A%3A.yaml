simpleMeaning: Headaches and trouble chewing can come with sight that sometimes fails, when the blood
  tubes at the sides of the head swell.
scope: 'Headaches are only one mark of it: chewing grows hard, and sight can sometimes fail.'
examples:
- Her temporal arteritis gave her headaches and made chewing hard.
- Temporal arteritis can sometimes harm sight.
