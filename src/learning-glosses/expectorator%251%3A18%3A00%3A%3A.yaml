simpleMeaning: Spit or the thick wet stuff from the lungs comes out of this person's mouth
scope: This is a person whose spit or the thick wet stuff from the lungs comes out of the mouth, not a
  person who coughs and not a bowl made for spitting into.
examples:
- The expectorator cleared his throat and spat on the ground.
- The old expectorator sat on the bench and spat into the dust.
