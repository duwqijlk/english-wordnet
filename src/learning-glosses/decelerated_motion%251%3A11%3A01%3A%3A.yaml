simpleMeaning: In mechanics, movement that keeps getting slower and slower.
scope: In mechanics, movement that keeps getting slower; not speeding up and not steady movement.
examples:
- Decelerated motion means the car keeps slowing down.
- The ball showed decelerated motion as it rolled uphill.
