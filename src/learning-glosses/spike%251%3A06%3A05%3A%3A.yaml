simpleMeaning: the part under the back of a woman's shoe that is very tall and thin
scope: A very high thin heel on a woman's shoe, not a point on the bottom of a sports shoe and not a sharp
  tool.
examples:
- She wobbled on her spikes as she crossed the room.
- Her spikes clicked on the hard floor.
