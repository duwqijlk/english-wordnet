simpleMeaning: In Christian teaching, the free good help and love God gives to people, though they have
  not earned it
scope: In Christian teaching, God's free help and love that people have not earned; not the state of living
  under God's help, and not extra time to pay or do something late.
examples:
- People thanked God for his grace in their lives.
- She said that grace, not her own work, had saved her.
