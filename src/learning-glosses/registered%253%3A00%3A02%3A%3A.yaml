synsetId: 01965708-a
simpleMeaning: Of animals, put on a list by its official group for that kind, and said by that group to
  be truly of its kind, especially in the group's book
scope: This sense is about animals on an official list for their kind, especially in that book; it is
  not the sense for a boat or ship with official papers.
examples:
- The farm sells only registered horses with papers for their kind.
- A registered dog can be shown at the big show.
