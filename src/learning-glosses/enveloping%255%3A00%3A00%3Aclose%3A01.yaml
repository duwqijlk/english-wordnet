simpleMeaning: going all around something and closing in on it, so it is shut in on all sides
scope: About a thing that goes all around and shuts another thing in; not just near a thing or next to
  it.
examples:
- The enveloping fog shut in the town on all sides.
- The army used an enveloping move to close in on the town.
