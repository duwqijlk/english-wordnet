simpleMeaning: The first electric battery, built by Volta from a row of simple chemical cells connected
  one after another.
scope: The old electric battery, not a heap of things, a nuclear reactor, or a post driven into the ground;
  voltaic pile and galvanic pile are other names for this sense.
examples:
- Volta's pile gave scientists the first steady electric current.
- The class built a small pile from copper and zinc discs to light a bulb.
