senseId: 'crenel%1:25:00::'
synsetId: 13897197-n
simpleMeaning: A rounded bump in a row along a curving border, or the dip beside it, seen on leaves, cloth,
  shells and red blood cells shriveled in salty water.
scope: The botanical and medical sense shared with crenation and crenature; not the crenel of a castle
  wall, the gap between two battlements.
examples:
- A crenel in the leaf's edge held a drop of dew.
- The shell's lip was marked by one crenel after another.
