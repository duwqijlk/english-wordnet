simpleMeaning: Dark purple flowers shaped like small cups and marked with green grow on this plant of
  the southwestern United States.
scope: Also called black fritillary, it is the southwestern plant with dark purple cup-shaped flowers
  marked with green, not the northwestern plant with green-and-purple flowers.
examples:
- She could tell the mission bells by their dark purple flowers.
- The mission bells had opened their dark purple flowers.
