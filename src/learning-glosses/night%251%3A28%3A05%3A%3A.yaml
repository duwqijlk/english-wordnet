simpleMeaning: a short way of saying the time when daylight fades and darkness comes.
scope: This sense is not the whole dark period between sunset and sunrise, and not the word for a difficult
  or sad time; it refers to the moment when daylight ends.
examples:
- The farmers hurried to bring in the hay before night.
- Night was falling fast as we reached the village.
