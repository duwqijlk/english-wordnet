simpleMeaning: used of old people or old trees, with a rough shape full of hard lumps and twists
scope: 'Also called knotted, gnarled, knotty and knobbed: describes old people or old trees with hard
  lumps and twists, not young, smooth or straight things.'
examples:
- The gnarly old tree stood by the road.
- His gnarly hands were full of lumps and twists.
