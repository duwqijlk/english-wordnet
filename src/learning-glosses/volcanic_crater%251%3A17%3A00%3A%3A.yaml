simpleMeaning: a bowl-shaped hollow in the ground at the top of a mountain that throws out melted rock
  and ash
scope: 'Also called a crater: a bowl-shaped hollow at the top of a volcano, not a hollow made by a meteorite
  and not the side of the mountain.'
examples:
- Lava bubbled in the volcanic crater at the summit.
- The climbers peered into the volcanic crater from the rim.
