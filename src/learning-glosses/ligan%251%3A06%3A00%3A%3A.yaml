simpleMeaning: Goods, or broken remains, lying on the sea floor and tied to a floating marker so they
  can be got back.
scope: Goods, or broken remains, lying on the sea floor and tied to a floating marker so they can be got
  back; lagan and lagend are other names for this sense, not goods floating on the sea and not goods sunk
  with no marker.
examples:
- The ligan was marked with a buoy for recovery.
- Divers found the ligan on the sea bed.
