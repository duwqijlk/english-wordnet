simpleMeaning: An air way from a device that pulls back, holding pipes that take air in and let it out,
  letting a sea boat stay under water for a long time.
scope: This sense is also called snorkel, breather, schnorchel, and schnorkel.
examples:
- A snorkel breather lets the boat stay under water.
- Snorkel breathers feed air to the boat.
