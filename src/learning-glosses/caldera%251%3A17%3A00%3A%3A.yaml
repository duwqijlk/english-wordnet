simpleMeaning: a big hollow in the ground left when a volcano blows up with great force and falls in on
  itself
scope: A big hollow in the ground left when a volcano blows up with great force and falls in on itself,
  not a small pit made by a meteor and not the cone of a volcano.
examples:
- The caldera filled with a deep blue lake.
- A caldera formed when the volcano collapsed.
