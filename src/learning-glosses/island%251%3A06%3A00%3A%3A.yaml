senseId: 'island%1:06:00::'
synsetId: 03592487-n
simpleMeaning: a small area that stands apart from everything around it, like a patch of land with water
  on every side
scope: This is not a piece of land with water all around it; it is any area that is set apart from what
  surrounds it.
examples:
- The children sat on a small island of dry ground in the flooded field.
- A bright island of light showed where the campfire was burning in the dark.
