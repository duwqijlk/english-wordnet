simpleMeaning: a band of flesh that runs at a slant across the belly, on either side of the body
scope: A band of flesh that runs at a slant across the belly, also called oblique, external oblique muscle
  and musculus obliquus externus abdominis; not a back band of flesh and not a straight band down the
  middle.
examples:
- The abdominal external oblique muscle runs at a slant across the belly.
- He strained an abdominal external oblique muscle lifting the box.
