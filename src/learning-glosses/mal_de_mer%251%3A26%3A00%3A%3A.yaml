senseId: 'mal_de_mer%1:26:00::'
synsetId: 14227424-n
simpleMeaning: On water, the motion of travel can make a person feel sick
scope: Also called seasickness and naupathia, this is sickness from moving on water, not sickness from
  moving in a car and not sickness from bad food.
examples:
- She felt mal de mer as the ferry crossed the bay.
- Mal de mer kept him below deck for most of the trip.
