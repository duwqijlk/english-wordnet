synsetId: 01132595-v
simpleMeaning: To keep a person or thing from danger or harm, or to hide it.
scope: This is keeping a person or thing safe from harm or out of sight, not a covering that hides or
  shelters something, not the mesh guard fitted in a frame, and not the act of stopping something from
  getting in.
examples:
- Tall walls screened the courtyard from the road.
- A row of aides screened the senator from the crowd.
