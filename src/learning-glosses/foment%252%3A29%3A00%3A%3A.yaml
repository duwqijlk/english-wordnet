simpleMeaning: to wash or soak a part of the body with warm water or with lotions that have medicine in
  them
scope: 'This is the body-care sense: washing a body part with warm water or medicine, not stirring up
  trouble or anger in a group.'
examples:
- The nurse fomented his sore legs with warm water.
- She fomented the swollen ankle with a warm lotion that had medicine in it.
