simpleMeaning: In logic, a way of sorting claims by whether they say a thing must be, may be, or cannot
  be.
scope: In logic, a way of sorting claims by whether they say a thing must be, may be, or cannot be, not
  the forms of a verb and not the most common value in a set of numbers.
examples:
- In logic, the mode of a claim tells whether it speaks of what must be or what may be.
- Students learned to sort each mode by what the claim said was needed or possible.
