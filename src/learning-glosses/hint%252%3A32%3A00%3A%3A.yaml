simpleMeaning: to say something in a roundabout way, so the other person has to guess what you mean
scope: 'Also called suggest: to say something in a roundabout way, not to say it plainly.'
examples:
- She hinted that she wanted to leave early.
- He hinted at the news without saying it out loud.
