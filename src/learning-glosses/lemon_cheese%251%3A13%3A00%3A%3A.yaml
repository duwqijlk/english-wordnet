simpleMeaning: a thick spread made with the sour yellow fruit, butter, eggs and sugar
scope: A thick spread made with the sour yellow fruit, butter, eggs and sugar, also called lemon curd,
  not a cheese made from milk and not a jam made from berries.
examples:
- She spread lemon cheese on her toast at breakfast.
- The lemon cheese was thick and yellow, made with butter and eggs.
