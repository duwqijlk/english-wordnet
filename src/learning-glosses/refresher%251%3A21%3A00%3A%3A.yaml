simpleMeaning: An extra fee, on top of the one written on the brief, paid to a lawyer in a case that runs
  for more than a day.
scope: In law, an extra fee paid to a lawyer in a long case, not a course that reviews a topic and not
  a drink.
examples:
- The barrister charged a refresher for the second day of the trial.
- A refresher was added to the bill when the case ran on.
