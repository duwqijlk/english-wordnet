simpleMeaning: In psychology, a wrong belief a person keeps even when the facts show it is not true
scope: In psychology, a wrong belief held against the facts, not the act of tricking someone.
examples:
- His delusion that he was being followed would not leave him.
- The patient held a delusion despite all the evidence.
