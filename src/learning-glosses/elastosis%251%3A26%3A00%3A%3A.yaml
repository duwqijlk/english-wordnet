simpleMeaning: 'When the tissue that joins the skin together wears away, old people''s skin loses its
  spring: stretchy body tissue breaks down.'
scope: This is a state in which stretchy body tissue breaks down, above all the skin of old people losing
  its spring.
examples:
- Elastosis had taken the spring from her old skin.
- The elastosis in his skin came from the wearing away of the tissue beneath it.
