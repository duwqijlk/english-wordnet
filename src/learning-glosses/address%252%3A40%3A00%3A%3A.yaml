simpleMeaning: To reach or find stored data by using its coded location.
scope: This is the computing action of reaching stored data through its coded location, not the code itself
  as a noun, postal delivery details, the place where someone can be reached, a house sign, a formal speech,
  a way of speaking, tact, a golfer's stance or aim, speaking to or greeting someone, giving a speech,
  writing mail details, directing a question, applying oneself to a task, or treating a subject in speech,
  writing, or art.
examples:
- The old software could address only the first 64 kilobytes of memory.
- Each drive on the bus is addressed by a unique number.
