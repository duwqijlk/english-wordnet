simpleMeaning: a hard time that weighs on a person and is not wanted
scope: A hard time that weighs on a person and is not wanted, not a slow, solemn way of speaking or moving.
examples:
- The heaviness of the debt weighed on him for years.
- She felt the heaviness of caring for her sick mother alone.
