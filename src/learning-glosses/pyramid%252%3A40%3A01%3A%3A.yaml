simpleMeaning: to use or deal in shares or goods in a set of linked deals, each one built on the deal
  before it
scope: This is about using or dealing in shares or goods through a set of linked deals built one on another;
  not building things in a stack, not the hard shape itself, and not simply growing the shares you hold
  as their price rises.
examples:
- He pyramided the shares through a chain of linked deals.
- The firm pyramided its goods in a set of deals, each one built on the last.
