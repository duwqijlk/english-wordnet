simpleMeaning: Say words aloud in a singing voice, as when a prayer or psalm is chanted in worship.
scope: To say words aloud in a singing voice; chant, intone and cantillate are other names for this sense,
  not speaking in a plain voice and not singing a song.
examples:
- The rabbi intonated a prayer in a slow, singing voice.
- The choir intonated the psalm before the service began.
