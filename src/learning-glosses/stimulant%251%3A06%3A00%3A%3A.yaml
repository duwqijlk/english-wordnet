simpleMeaning: a drug that, for a short time, makes a body process needed for life work faster
scope: A drug, also called excitant; not information or an event that pushes a person to act, and not
  the adjective use for a thing that has this effect.
examples:
- Caffeine is a stimulant that can make your heart beat faster.
- The doctor gave him a stimulant to help his breathing.
