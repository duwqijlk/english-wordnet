simpleMeaning: On a vine grows fruit with sweet green flesh inside a thin skin marked like a fine mesh.
scope: The net melon and the nutmeg melon are also names for a vine that bears sweet fruit, not the fruit
  itself.
examples:
- The netted melon bears fruit with sweet green flesh.
- The fruit of the netted melon has a thin skin marked like a fine mesh.
