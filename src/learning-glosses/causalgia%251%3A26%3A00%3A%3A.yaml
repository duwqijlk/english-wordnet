simpleMeaning: a burning pain in an arm or a leg that follows the path of a nerve outside the brain and
  spine, most often with changes in the skin
scope: A burning pain in a limb that follows the path of a nerve outside the brain and spine, most often
  with skin changes, not a short sharp pain and not a pain from a wound.
examples:
- After the injury, causalgia left her arm with a burning pain that would not ease.
- His causalgia made the skin on his leg burn and change colour.
