schema: oewn-learning-gloss-v2
senseId: 'compulsion%1:16:01::'
synsetId: 09204227-n
simpleMeaning: a strong feeling that you want to do or say something, but it might be better not to do
  or say it
scope: A strong feeling that you want to do or say something, but it might be better not to; not a strong
  need to keep doing small actions again and again even when you do not want to.
examples:
- He felt a compulsion to tell her the secret, though he knew he should stay quiet.
- She had a compulsion to speak out, even though silence would have been wiser.
