simpleMeaning: a device that cuts off the flow of power, like a switch, when too much power runs through
  it
scope: A device that cuts off power when too much runs through it, not a worker who splits stone and not
  a wave breaking on the shore.
examples:
- The breaker cut the power when the circuit was overloaded.
- Reset the breaker after you unplug the heater.
