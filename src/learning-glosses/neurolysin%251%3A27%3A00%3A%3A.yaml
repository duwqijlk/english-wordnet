simpleMeaning: This is any poison that works on the nerves
scope: This is any poison that works on the nerves, also called a neurotoxin, not a poison that harms
  the stomach and not a drug that heals the nerves.
examples:
- The neurolysin in the snake's bite attacked the nerves.
- Doctors found a neurolysin that stops the nerves from sending signs.
