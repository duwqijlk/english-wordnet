simpleMeaning: that may not be true or honest, so people may not trust it
scope: About a person, past, or record that people may not trust, not about a result or fact that is not
  sure to happen or be true.
examples:
- His doubtful past made voters slow to trust him.
- The company has a doubtful record on safety.
