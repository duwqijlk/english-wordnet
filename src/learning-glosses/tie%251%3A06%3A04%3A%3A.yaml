simpleMeaning: An object or piece used to hold two things together or connect them.
scope: This is any item whose purpose is joining or connecting, not a cord used to fasten things by knotting
  and not the beam that supports railway rails.
examples:
- He used a plastic tie to bundle the cables.
- A metal tie held the two beams together.
