simpleMeaning: This white powder of calcium hydroxide, hypochlorite and a chlorine salt makes things white
  and kills germs.
scope: Also called bleaching powder and chloride of lime, it is a white powder used to bleach and to kill
  germs.
examples:
- He used chlorinated lime to bleach.
- The chlorinated lime made things white.
