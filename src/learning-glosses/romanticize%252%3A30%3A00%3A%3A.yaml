simpleMeaning: to make something have a style that is about love and strong feeling
scope: This is making a thing have a style about love and strong feeling. It is not acting yourself in
  a loving way, and not thinking about a thing as part of a love story.
examples:
- The designer romanticized the little black dress with soft lace and flowers.
- She romanticized her wedding dress by adding lace and a long train.
