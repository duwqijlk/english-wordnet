simpleMeaning: not having a father who is known, or a father who the law says is responsible for the child
scope: This sense is about having no father who is known, or no father the law says is responsible for
  the child. It is not the sense of having a father who has died.
examples:
- The child was listed as fatherless because no father was named on the form.
- A fatherless child in those days had no father the law could make pay for his care.
