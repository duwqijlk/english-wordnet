simpleMeaning: One plant of the Trapa group bears prickly fruits with four points, shaped like nuts and
  good to eat.
scope: Also called caltrop and water chestnut, this Trapa plant is known for its prickly four-pointed
  fruits like nuts, unlike the Chinese sedge with bulb-shaped tubers that can be eaten.
examples:
- The water chestnut plant bore prickly fruits like nuts.
- A water chestnut plant of the Trapa group grew prickly four-pointed fruits.
