simpleMeaning: a person who speaks for and supports the idea that society should have no government and
  no rulers
scope: A person who supports having no government or rulers, not just a person who breaks rules or causes
  disorder.
examples:
- The anarchist spoke at the meeting about living without rulers.
- She called herself an anarchist and opposed all forms of government.
