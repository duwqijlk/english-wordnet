simpleMeaning: A shrub or small tree of hot America, with huge leaves cut deep like the fingers of a hand,
  and large long yellow fruit.
scope: Also called a papaya, a melon tree, a papaia, and a papaya tree; the shrub or small tree of hot
  America, not the fruit itself and not the small tree of the eastern United States.
examples:
- A pawpaw grew beside the garden wall.
- The pawpaw's huge leaves shaded the path.
