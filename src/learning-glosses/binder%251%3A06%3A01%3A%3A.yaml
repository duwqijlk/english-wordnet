simpleMeaning: a cover for keeping loose papers or magazines together in one place
scope: Not the farm machine that ties up cut grain and not the sticky stuff that holds things together;
  this is the cover that holds loose papers.
examples:
- She put her notes in a binder.
- The binder held all his magazines in one place.
