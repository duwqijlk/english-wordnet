simpleMeaning: Birds with a ridge down the front of the chest bone, where the wing muscles join.
scope: Birds with a ridge down the front of the chest bone, where the wing muscles join; carinate bird
  and flying bird are other names for this sense, not birds with flat chest bones and not the word for
  a ridged shape.
examples:
- Carinate birds have a ridge down the chest bone.
- The carinate group includes most flying birds.
