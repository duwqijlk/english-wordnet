simpleMeaning: forming an X, with one thing crossing over another
scope: Crossed in the shape of an X, like two lines crossing each other; not straight lines that never
  meet, and not lines that run side by side.
examples:
- The two intersecting roads formed an X at the village centre.
- She drew two intersecting lines on the paper.
