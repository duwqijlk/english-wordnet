simpleMeaning: Only with difficulty or inconvenience, or almost not at all.
scope: This means hardly or with difficulty; it is not the sense meaning badly or wrongly, and it is not
  the noun for a sickness.
examples:
- We can ill afford another delay.
- She could ill hide her annoyance.
