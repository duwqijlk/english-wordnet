simpleMeaning: Large heads of yellow flowers crown this plant of the Mediterranean as far as Portugal,
  which lives one year and has hairy stems and leaves with tiny sharp teeth.
scope: Also called blessed thistle, this is the yearly plant of the Mediterranean to Portugal with large
  heads of yellow flowers, not the Asian plant grown far and wide for pink flowers and not the plant of
  the mountains of Iran and Iraq.
examples:
- The sweet sultan's yellow flowers stood in large heads.
- A sweet sultan lived for one year only.
