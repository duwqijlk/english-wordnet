simpleMeaning: a person in your family who you come from, usually further back than a grandparent
scope: 'Also called ancestor: this is a person in your family that you come from, not the part of a plant
  that grows under the ground and not the base form that other words come from.'
examples:
- She found the name of a root of her family, a woman who lived long before her grandparents.
- He spoke about a root in his family line who lived more than 200 years ago.
