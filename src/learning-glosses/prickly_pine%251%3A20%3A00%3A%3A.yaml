simpleMeaning: a small two-needled pine of the high land in the Appalachians, with dark brown bark that
  peels in flakes and cone scales tipped with thorns
scope: Also called hickory pine and table-mountain pine; a small upland pine, not a tall lowland pine.
examples:
- The prickly pine on the ridge had dark brown bark that peeled in flakes.
- We found a prickly pine with cones whose scales ended in sharp thorns.
