senseId: 'meltdown%1:11:00::'
synsetId: 07331003-n
simpleMeaning: a very bad event that is as bad as the hot centre of a nuclear power plant melting because
  of too much heat
scope: A very bad event compared to a nuclear accident, not the accident itself at a nuclear power plant
  where the centre melts.
examples:
- The bank failure was a meltdown for the whole town.
- After the company lost all its money, the meltdown spread to other businesses.
