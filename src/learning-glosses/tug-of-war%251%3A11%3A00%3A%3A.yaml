simpleMeaning: a game where two teams pull at the two ends of a rope, and the team pulled past a line
  in the middle loses
scope: A game where two teams pull at the two ends of a rope and the team pulled past a line in the middle
  loses; not a struggle for power and not a one-sided pull.
examples:
- The children played tug-of-war on the field.
- Our team won the tug-of-war when the other team was pulled past the line.
