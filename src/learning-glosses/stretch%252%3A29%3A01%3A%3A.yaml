simpleMeaning: To reach out with your limbs, extend your muscles, or straighten your whole body.
scope: This is the action of extending your limbs, muscles, or whole body, as when you stretch your legs;
  it is not the general warm-up stretch done without naming a part, a stretching exercise, or making an
  object longer.
examples:
- She stretched her arms above her head.
- Stretch your legs after the long flight.
