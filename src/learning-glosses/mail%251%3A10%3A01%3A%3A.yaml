simpleMeaning: the letters and parcels that a postal service collects and delivers to people
scope: These are the letters and parcels themselves, not the postal system, and not the train, ship or
  aircraft that carries them.
examples:
- The mail arrives before noon on most days.
- She sorted the mail into piles for each department.
