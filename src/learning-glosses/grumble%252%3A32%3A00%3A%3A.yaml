simpleMeaning: to say unhappy words or make unhappy sounds in a low voice that others can barely hear
scope: 'Also called mutter and murmur, and another name for it is croak: to complain in a low voice, not
  the loud low noise of a machine and not merely showing that you are unhappy.'
examples:
- She grumbles when she feels overworked.
- He grumbled under his breath about the long wait.
