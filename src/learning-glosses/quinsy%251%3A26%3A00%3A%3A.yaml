simpleMeaning: With pus inside it, a sore swelling of the throat glands and the flesh round them usually
  follows a throat infection.
scope: This throat-gland swelling, also called peritonsillar abscess, is a trouble that usually comes
  after a throat infection rather than the infection itself.
examples:
- The swelling in his throat turned out to be quinsy.
- He knew the quinsy by the ache when he swallowed.
