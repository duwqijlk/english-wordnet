simpleMeaning: Any of several plants of the genus Centaurea with purple flowers like those of a thistle.
scope: Any of several plants of the genus Centaurea with purple thistle-like flowers, not a true thistle
  and not a garden flower with plain round blooms.
examples:
- Knapweed grew in thick clumps along the roadside.
- The knapweed in the field had purple flowers like a thistle.
