simpleMeaning: liquid coming out of a jelly-like mass as the mass shrinks, as when cheese is made
scope: Liquid coming out of a jelly-like mass as it shrinks; synaeresis is another name for this sense.
  Not liquid added to a mass and not the shrinking of a solid.
examples:
- Syneresis left a pool of whey on top of the curd.
- Cheese makers watch syneresis as the curd firms up.
