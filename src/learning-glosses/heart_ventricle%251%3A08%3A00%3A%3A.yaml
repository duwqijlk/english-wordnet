simpleMeaning: A room of the blood-pumping organ that takes in blood from an upper room and pushes it
  out to the blood tubes.
scope: A room of the blood-pumping organ that takes in blood from an upper room and pushes it to the blood
  tubes, also called ventricle; not an upper room of the organ and not a blood tube.
examples:
- Blood flows from the atrium into the heart ventricle.
- The heart ventricle pumps blood out to the arteries.
