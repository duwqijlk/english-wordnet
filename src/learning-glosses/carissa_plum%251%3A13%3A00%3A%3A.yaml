simpleMeaning: A red fruit that can be eaten, from a South African plant.
scope: A red fruit that can be eaten, from a South African plant, also called natal plum; not a red fruit
  from an Asian plant, and not a fruit that cannot be eaten.
examples:
- The carissa plum is red and sweet.
- She picked a carissa plum from the bush.
