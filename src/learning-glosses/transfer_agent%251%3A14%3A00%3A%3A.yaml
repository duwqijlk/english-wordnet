simpleMeaning: A firm, most often a bank, named by a company to keep the lists of its share and bond owners
  and to sort out problems with ownership papers
scope: A firm named by a company to keep the lists of its share and bond owners; not a bank that lends
  money and not a stockbroker.
examples:
- The transfer agent kept the list of shareholders.
- She called the transfer agent about her lost certificate.
