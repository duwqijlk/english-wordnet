synsetId: 13368765-n
simpleMeaning: a life plan where, if a member dies or stops paying, the member's share is split among
  the members left
scope: A life plan for members, also called tontine, and not the annuity scheme in which living members
  share benefits over a set time.
examples:
- They took out tontine insurance as part of their savings plan.
- Her share of the tontine insurance went to the other members when she died.
