simpleMeaning: With forked bright green sharp points and shiny leaves, this very large South African bush
  is thick with close-set branches.
scope: It is also called amatungulu, and unlike the kind grown as hedging, it is a very large South African
  bush with forked bright green sharp points.
examples:
- The natal plum bore forked bright green spines and shiny leaves.
- A natal plum grew thick with close-set branches.
