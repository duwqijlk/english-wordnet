simpleMeaning: in a calm way, without showing pain, sadness, or other strong feelings
scope: Doing something calmly and without showing pain or strong feelings, even in trouble; not acting
  in a cold way with no care for others.
examples:
- She stoically sat through the long, painful treatment and did not cry.
- He stoically listened to the bad news and stayed calm.
