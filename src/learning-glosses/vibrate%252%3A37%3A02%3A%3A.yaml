simpleMeaning: to feel a sudden, very strong feeling in the body or mind
scope: 'Also called thrill, and another name for this sense is tickle: to feel a sudden strong feeling,
  not to shake quickly back and forth and not to be unsure between two choices.'
examples:
- She vibrated with excitement when she heard the good news.
- He vibrated with joy as the loud music played.
