simpleMeaning: The way a new living thing grows from an egg that has not been joined with male seed, seen
  often in insects and some other creatures with jointed legs.
scope: 'Also called parthenogeny: the way a new living thing grows from an egg that has not been joined
  with male seed, seen often in insects and some other creatures with jointed legs.'
examples:
- Parthenogenesis lets some insects have young without mating.
- The bees showed parthenogenesis, with eggs growing into young on their own.
