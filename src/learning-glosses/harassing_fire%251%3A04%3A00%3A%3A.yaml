simpleMeaning: Enemy soldiers get no rest, cannot move freely, and lose heart when shots are aimed at
  them to wear them down
scope: Shots meant to wear down enemy soldiers, not aimed shots meant to kill and not a single blast.
examples:
- Harassing fire kept the enemy awake all night.
- They kept up harassing fire through the night to wear the enemy down.
