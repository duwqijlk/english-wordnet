simpleMeaning: Make something move along a chosen path by pushing or pulling, whether the force is real
  or figurative.
scope: 'The broad force sense: moving something along a path by pushing or pulling, not tugging it toward
  you, and not leading a person into a state.'
examples:
- The current drew the small boat toward the rocks.
- Her argument drew the conversation back to the main issue.
