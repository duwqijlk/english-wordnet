simpleMeaning: The basic form of an adjective or adverb, used when nothing is being compared.
scope: It is not the form used for comparing two things, and not a hopeful attitude; it is the plain base
  form of a word.
examples:
- In 'tall, taller, tallest', 'tall' is the positive.
- Students first learn the positive before the comparative.
