simpleMeaning: A heavy metal that breaks easily, one of the platinum group; it is used in alloys and found
  in natural alloys with platinum or osmium
scope: This metal is also called Ir and atomic number 77; it is not platinum and not osmium.
examples:
- Iridium is found with platinum.
- The alloy contained iridium.
