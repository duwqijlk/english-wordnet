simpleMeaning: A ruler who stood in for the emperor and governed a large province of the Roman Empire.
scope: A ruler who stood in for the emperor in the Roman Empire; not a bishop in the eastern church.
examples:
- The exarch governed the province from Ravenna.
- An exarch ruled in the emperor's name.
