simpleMeaning: Pay got for holding a post or having a job, usually as wages or fees.
scope: Pay got for holding a post or a job, not a gift and not pay for a single piece of work.
examples:
- A clause in the constitution stops sitting lawmakers from taking emoluments from their own votes.
- The emolument for the post was paid each month.
