simpleMeaning: A fair marsh herb from the east and middle of North American marsh, with waxy spear leaves,
  its flower cream-white below and rose-pink through dark purple on top.
scope: This sense is also called turtlehead, shell-flower, shellflower, and snake-head.
examples:
- Snakeheads grow in the marsh.
- A snakehead bloomed pink and white.
