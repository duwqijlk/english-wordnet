simpleMeaning: Driven by strong feelings rather than by careful reasoning.
scope: This describes a decision or reaction that comes from feeling instead of thought; it is not about
  someone who shows unusually strong feelings and not about matters that merely involve feelings.
examples:
- It was an emotional decision, and he later admitted that reason had played no part.
- The committee's emotional judgment ignored the figures entirely.
