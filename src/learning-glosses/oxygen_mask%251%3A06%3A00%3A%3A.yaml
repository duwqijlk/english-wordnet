simpleMeaning: From a tank joined to it, the gas we breathe reaches the mouth and nose through this breathing
  aid worn over the face.
scope: This breathing aid covers the mouth and nose and is fed from a tank joined to it.
examples:
- The nurse fitted the oxygen mask over the patient's mouth and nose.
- They wore an oxygen mask on the ward while the tank fed them the gas they needed.
