simpleMeaning: To top an opponent's bid with a higher one, while one's partner has not bid or doubled.
scope: In a card game, a higher bid than an opponent's, when one's partner has not bid or doubled.
examples:
- He outbid his opponent, though his partner had not bid.
- She outbid the other side while her partner stayed silent.
