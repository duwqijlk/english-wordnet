simpleMeaning: A ladder that can be folded and moved, with steps for climbing and two parts joined at
  the top
scope: A folding set of steps you can move and stand on, not a long ladder that leans on a wall and not
  fixed stairs in a building.
examples:
- He climbed a stepladder to change the light.
- Please bring the stepladder so I can reach the top shelf.
