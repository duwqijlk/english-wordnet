synsetId: 07894259-n
simpleMeaning: A cabbage partly boiled, hollowed out and packed with chopped meat such as beef or ham,
  then baked, and served with tomato or cheese sauce.
scope: A baked cabbage dish made from a whole hollowed head packed with chopped meat. It is not a cabbage
  roll, where separate leaves are wrapped around the filling, nor sauerkraut, which is pickled cabbage.
examples:
- Grandma's stuffed cabbage came out of the oven under a layer of melted cheese.
- The diner serves stuffed cabbage with tomato sauce and mashed potatoes.
