simpleMeaning: A belief that fetishes hold magic power, or the worship of a fetish.
scope: A belief that fetishes hold magic power, or the worship of a fetish, also called fetichism; not
  the worship of many gods and not a mere lucky charm.
examples:
- Fetishism gave the carved figure a magic power in their eyes.
- The tribe's fetishism centred on a small wooden fetish.
