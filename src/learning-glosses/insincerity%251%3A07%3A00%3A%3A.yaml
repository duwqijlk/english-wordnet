schema: oewn-learning-gloss-v2
senseId: 'insincerity%1:07:00::'
synsetId: 04875102-n
simpleMeaning: the state of not being open or honest, and of pretending to have feelings or beliefs you
  do not really have
scope: 'Also called hollowness and falseness: this is about not being honest in what you say or show,
  not about one single lie and not about a false object.'
examples:
- Her kind words were full of insincerity, and she did not mean them.
- He spoke with insincerity, praising beliefs he did not really hold.
