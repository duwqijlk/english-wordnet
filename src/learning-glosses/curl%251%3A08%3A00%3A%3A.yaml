simpleMeaning: a section of hair that winds around on itself like a spiral
scope: A lock of hair, not the round shape that leaves or petals form, nor the act of winding hair into
  spirals; ringlet and whorl are other names for this sense.
examples:
- She tucked a stray curl behind her ear.
- His dark curls were still wet from the shower.
