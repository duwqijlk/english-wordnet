simpleMeaning: a worker whose job is finishing the borders of a piece of clothing
scope: A worker whose job is finishing the borders of a piece of clothing, not a person who cuts cloth
  and not a tool that trims grass round a yard.
examples:
- The edger finished the hem of the coat before it went to the shop.
- She worked as an edger, putting the finished borders on dresses all day.
