simpleMeaning: a machine like a crane, most often one of a pair, used to hang or lower things such as
  a lifeboat
scope: A machine like a crane, most often one of a pair, that hangs or lowers things such as a lifeboat,
  not a big dock crane and not a rope on its own.
examples:
- The davit swung the lifeboat out over the water.
- Two davits held the small boat ready to be lowered.
