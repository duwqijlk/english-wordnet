simpleMeaning: hold something in place with pins or nails, or with something used the same way
scope: Holding something in place with pins or nails rather than with glue; it is also not the case of
  pushing an object's own end into a surface.
examples:
- She stuck the notice to the board with a single nail.
- He stuck the photos on the wall with drawing pins.
