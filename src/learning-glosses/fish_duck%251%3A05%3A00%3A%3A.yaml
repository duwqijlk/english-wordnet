simpleMeaning: With a thin hooked bill with tooth-like edges, this large diving duck with a crest feeds
  on small water animals.
scope: Also called a merganser, a sawbill, or a sheldrake, this is the large diving duck with a crest
  and a thin hooked bill with tooth-like edges.
examples:
- A fish duck dived beneath the lake and surfaced with a fish in its hooked bill.
- The fish duck dived and came up with a small water animal in its bill.
