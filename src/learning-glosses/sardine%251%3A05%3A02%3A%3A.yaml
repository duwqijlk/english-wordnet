simpleMeaning: A small fish from the coasts of Europe that lives in very large groups, smaller and rounder
  than a herring.
scope: Small fish that swim in huge groups near the coasts of Europe, smaller and rounder than herring;
  not the canned food fish.
examples:
- Sardines move along the coast in great schools.
- The sardine is smaller and rounder than a herring.
