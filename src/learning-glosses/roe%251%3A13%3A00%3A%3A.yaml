simpleMeaning: the eggs of a fish, or the part of a fish that holds the eggs, and feels made up of many
  small grains
scope: 'Also called hard roe: this is fish eggs, or the part of a fish that holds them, with a feel of
  many small grains; it is not the egg mass of a lobster or other sea animal with a shell.'
examples:
- We fried the roe and ate it on toast.
- The market sells cod roe in small tins.
