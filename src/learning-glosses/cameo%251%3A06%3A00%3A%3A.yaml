simpleMeaning: a picture in stone that stands out a little, made by cutting away the stone around it,
  as on a brooch or a ring
scope: A picture in stone that stands out a little, used on jewellery such as a brooch or a ring; not
  a short part played by a famous actor in a film or play.
examples:
- She wore a cameo with a woman's face cut in white stone.
- The old cameo on her ring stood out against the dark stone.
