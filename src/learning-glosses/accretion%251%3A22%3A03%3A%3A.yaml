simpleMeaning: In astronomy, the making of a heavenly body as gravity pulls nearby things and gases together.
scope: In astronomy, the making of a heavenly body by gravity pulling things together; not a gain in a
  share of an estate under law, not new land built up by water, and not growth in living things by parts
  sticking together.
examples:
- Accretion slowly built the young planet from dust and gas.
- The star grew by accretion, pulling in nearby matter.
