simpleMeaning: the act of setting a limit on what people may do, as a rule or law may do
scope: 'Also called a limitation: an act of setting a limit, not a rule that sets how far something may
  go.'
examples:
- The new restriction limits how late the shops may stay open.
- The restriction on parking came from the city council.
