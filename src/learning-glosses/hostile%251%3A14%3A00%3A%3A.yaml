simpleMeaning: soldiers who belong to the forces of the enemy
scope: These are enemy soldiers as a group; not the word for forces that are not your own or an ally's,
  and not a business attempt to take control that the company's leaders do not want.
examples:
- The soldiers met a group of hostiles near the river.
- A pack of hostiles was seen moving toward the camp.
