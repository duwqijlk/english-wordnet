simpleMeaning: Some hydrogen atoms in a chain of carbon and hydrogen have been swapped for atoms of a
  kind that forms salts, making a compound built from carbon.
scope: Also called alkyl halide, it is a carbon compound with some hydrogen atoms swapped for salt-forming
  atoms.
examples:
- The chemist tested a haloalkane for its halogen atoms.
- A haloalkane forms when hydrogen atoms are swapped for other atoms.
