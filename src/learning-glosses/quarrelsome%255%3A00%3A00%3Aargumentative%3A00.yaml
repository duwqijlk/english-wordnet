simpleMeaning: often ready to argue or fight with words with other people
scope: It describes a person who often argues, not a single short argument and not a person who is angry
  for a short time.
examples:
- The quarrelsome old man argued with his neighbours every day.
- She became quarrelsome when she was tired and hungry.
