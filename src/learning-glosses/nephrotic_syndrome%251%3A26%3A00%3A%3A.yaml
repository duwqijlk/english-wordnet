simpleMeaning: A sickness shown by swelling, with protein-rich urine, and usually higher cholesterol,
  usually going with kidney-ball sickness or after-ills of various body-wide sickness.
scope: This sense is also called nephrosis, for a sickness shown by swelling, with protein-rich urine,
  and usually higher cholesterol, usually going with kidney-ball sickness or after-ills of various body-wide
  sickness.
examples:
- Nephrotic syndrome swells the body.
- Nephrotic syndrome puts protein in the urine.
