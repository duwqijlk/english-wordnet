simpleMeaning: a loose jacket that people first wore in India
scope: A loose jacket, also called banian. It is not the tree from India whose high parts grow down to
  the ground and form new trunks.
examples:
- He wore a loose banyan over his shirt in the hot weather.
- The banyan was light and did not fit close to his body.
