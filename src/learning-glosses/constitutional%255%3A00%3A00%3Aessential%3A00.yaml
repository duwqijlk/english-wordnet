simpleMeaning: built into the way something is made, especially the way a person's body is made
scope: Another name for this sense is constituent. It is about how a thing or a body is built, not about
  the set of laws that a government must follow.
examples:
- His weak lungs are a constitutional problem he was born with.
- She has a constitutional lack of strength and gets tired very fast.
