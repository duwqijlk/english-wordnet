simpleMeaning: A way of painting shaped by the work of Caravaggio, the Italian Baroque painter of the
  1500s.
scope: A way of painting shaped by the work of Caravaggio; not Baroque painting as a whole, and not the
  work of Caravaggio himself.
examples:
- Caravaggism grew out of Caravaggio’s way of painting.
- The show traced Caravaggism across Europe.
