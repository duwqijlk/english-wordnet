senseId: 'fingerbreadth%1:23:00::'
synsetId: 13675079-n
simpleMeaning: Used as a way to measure length, this is how long or wide one of the small parts at the
  end of the hand is
scope: 'Also called a digit, a finger, and a finger''s breadth: a way to measure length by the size of
  one of the small parts at the end of the hand, not a measure of weight and not a measure of time.'
examples:
- The old book said the board was two fingerbreadths wide.
- He measured the gap in fingerbreadths.
