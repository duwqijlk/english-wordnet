simpleMeaning: a worker whose job is to plan where packages and goods are sent and how they get there
scope: This sense is a person who plans where goods are sent; it is not a power tool used to cut wood,
  and not a device that sends data between computer networks.
examples:
- The router at the warehouse decided which trucks would take each load.
- As a router, Maria plans the delivery paths for all the company's shipments.
