senseId: 'sheet_bend%1:06:00::'
synsetId: 04196135-n
simpleMeaning: a knot used to join a rope for a short time to the middle of a second rope, or to a loop
scope: A knot that joins a rope for a short time to the middle of another rope or to a loop, also called
  becket bend, weaver's hitch and weaver's knot; not a knot that joins two rope ends, and not a knot meant
  to hold for good.
examples:
- He tied a sheet bend to join the thin line to the thick rope.
- Use a sheet bend when you need to fasten a rope to an eye for a while.
