simpleMeaning: A tiny grey woolly tufted plant that lives one year, with small golden-yellow flower heads;
  from southeastern California to northwestern Arizona and southwestern Utah, sometimes put in the genus
  Eriophyllum.
scope: 'Also called dwarf daisy, woolly daisy, and Eriophyllum wallacei: a small annual, not a shrub,
  and not a true daisy.'
