simpleMeaning: A special hard building mix that forms part of a building itself or carries weight.
scope: This special building mix forms part of a building itself or carries weight, which sets it apart
  from a mix that cannot bear weight.
examples:
- The bridge piers were poured with structural concrete to carry the load.
- The walls that form part of the frame were poured with structural concrete.
