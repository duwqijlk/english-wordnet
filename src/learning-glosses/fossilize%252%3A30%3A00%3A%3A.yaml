senseId: 'fossilize%2:30:00::'
synsetId: 00508745-v
simpleMeaning: to change into hard remains that stay in rock for a very long time, or to make a dead plant
  or animal change in this way
scope: To turn into hard remains in rock over a very long time; not living, and not a fresh dead body.
examples:
- Over a very long time, the dead fish fossilized and turned to hard remains in the rock.
- Heat and time can fossilize dead plants that fall into mud.
