simpleMeaning: Written OH, this part with a negative charge is one oxygen atom joined to one hydrogen
  atom
scope: The charged OH part, also called hydroxyl ion; not the whole chemical that holds it and not a plain
  water molecule.
examples:
- A hydroxide ion forms when water splits into charged parts.
- The hydroxide ion in the mix made the liquid basic.
