simpleMeaning: Powdered, the long grey-green leaves of this Eurasian herb bring on a sudden burst from
  the nose; it bears loose heads of white button-like flowers.
scope: Also called sneezewort, it is a Eurasian herb whose leaves bring on a sudden burst from the nose
  when powdered.
examples:
- The sneezeweed yarrow had loose heads of white flowers and long grey-green leaves.
- She powdered the leaves of the sneezeweed yarrow and felt a sudden burst from her nose.
