scope: A bathroom sink fixed in place and joined to pipes, also called basin, lavatory, washbasin and
  washstand; not a free-standing tub and not a jug of water.
examples:
- He washed his hands in the washbowl.
- The washbowl in the bathroom is joined to the water pipes.
