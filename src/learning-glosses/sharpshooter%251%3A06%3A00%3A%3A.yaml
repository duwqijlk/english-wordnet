simpleMeaning: a fast sailing boat (a schooner) once used by fishermen from New England to fish where
  the law did not allow it, in Canadian waters
scope: This is a fast sailing boat once used for fishing where the law did not allow it, not a person
  who is very good at aiming in sport.
examples:
- The sharpshooter slipped out at night to fish in Canadian waters.
- Fishermen used a sharpshooter because it was fast and could get away quickly.
