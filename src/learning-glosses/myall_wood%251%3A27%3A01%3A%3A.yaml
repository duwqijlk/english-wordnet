simpleMeaning: The first peoples of Australia made spears from this hard, sweet-smelling, dark timber,
  which comes from a small tree called Acacia homolophylla.
scope: A hard, sweet-smelling, dark kind of timber from Australia, used to make spears.
examples:
- The spear was made of myall wood.
- Myall wood has a dark colour and a sweet smell.
