simpleMeaning: work done together by different firms on one oil field that runs under land owned by more
  than one of them
scope: 'Also called unitization: firms working together on one oil field that crosses their land, not
  one firm working alone and not the search for new oil.'
examples:
- The two firms agreed on the unitisation of the field that crossed their land.
- Unitisation let the companies share the cost of the oil field.
