simpleMeaning: a place where apples are pressed to get their juice, which is used to make a drink from
  apples
scope: A place that presses apples for their juice; not a mill that grinds grain, and not a sawmill that
  cuts wood.
examples:
- The old cider mill still presses apples every autumn.
- They took a cart of apples to the cider mill.
