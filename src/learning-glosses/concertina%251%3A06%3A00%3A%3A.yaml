senseId: 'concertina%1:06:00::'
synsetId: 03090712-n
simpleMeaning: A small musical instrument like an accordion, with reeds that sound as air is forced through
  them when its two ends are pushed together.
scope: A small musical instrument like an accordion, not coiled barbed wire used as a barrier, and not
  the act of collapsing like one.
examples:
- She played a tune on the concertina.
- The concertina player squeezed the ends together.
