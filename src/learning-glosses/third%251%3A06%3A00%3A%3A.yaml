simpleMeaning: the forward gear that comes after the second one when you count up from the lowest in the
  gearbox of a car or other motor vehicle
scope: This sense is a gear position in a vehicle, not a fraction of a whole or a person who comes after
  two others.
examples:
- Shift into third before the bend, then brake gently.
- The old car laboured in third on the steep hill.
