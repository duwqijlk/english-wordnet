simpleMeaning: A power part with two or three pins that you push into a socket to join something to power
scope: A power part with two or three pins that you push into a socket to join something to power, not
  the socket itself and not a wire; plug is another name for this sense.
examples:
- The male plug on the lamp fits the wall socket.
- He pushed the male plug into the socket and the radio came on.
