simpleMeaning: The hollow spaces beside the nose drain through blood tubes that empty into the large blood
  tube above the eye.
scope: Also called vena ethmoidalis, it is a blood tube that drains the hollow spaces beside the nose
  into the large blood tube above the eye.
examples:
- The hollow spaces beside the nose drain through the ethmoidal vein.
- Blood from the hollow spaces beside the nose flows through the ethmoidal vein to the large blood tube
  above the eye.
