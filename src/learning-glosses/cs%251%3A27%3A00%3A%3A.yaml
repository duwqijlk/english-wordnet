simpleMeaning: A soft, silver-white metal that bends and draws out, a liquid at usual warmth, the keenest
  to give up its outer bits and the most soap-like of metals.
scope: A soft, silver-white metal, also called caesium, cesium, and atomic number 55; not a hard metal
  and not a gas.
examples:
- Cs melts in the hand.
- A drop of Cs shone silver-white.
