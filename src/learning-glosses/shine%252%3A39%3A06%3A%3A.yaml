simpleMeaning: Have a face that shows a strong, bright color such as red or pink.
scope: To have a face with a strong, bright color, with glow, beam and radiate as other names for it;
  not feeling happy inside or giving out light.
examples:
- Her skin shone with a healthy pink after the swim.
- His cheeks shone red in the winter air.
