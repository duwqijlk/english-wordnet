simpleMeaning: a form of eye illness in which the coloured part of the eye blocks the flow of the clear
  liquid inside the eye
scope: A form of eye illness in which the coloured part of the eye blocks the flow of the clear liquid
  inside the eye; acute glaucoma and angle-closure glaucoma are other names for this sense, not the form
  in which the drain stays open and not any other illness of the eye.
examples:
- Closed-angle glaucoma can damage sight in a few days.
- The doctor treated her closed-angle glaucoma at once.
