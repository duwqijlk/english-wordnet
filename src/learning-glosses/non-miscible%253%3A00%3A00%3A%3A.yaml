simpleMeaning: In chemistry and physics, said of things that cannot mix together
scope: Said of things that cannot mix at all; immiscible is another name for this sense, not things that
  mix well or mix only a little.
examples:
- Oil and water are non-miscible, so they stay in separate layers.
- These two non-miscible liquids will not blend no matter how hard you stir.
