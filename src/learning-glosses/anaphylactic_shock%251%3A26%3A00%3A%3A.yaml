simpleMeaning: a sudden, severe allergic reaction, sometimes fatal, when the body overreacts to a substance
  it was exposed to earlier, such as insect venom, shellfish, penicillin or a vaccine.
scope: This is the severe whole-body allergic reaction, not a mild local reaction such as a rash or sneezing.
examples:
- She carries medication because a wasp sting once sent her into anaphylactic shock.
- The doctor warned that penicillin can cause anaphylactic shock in people who are allergic to it.
