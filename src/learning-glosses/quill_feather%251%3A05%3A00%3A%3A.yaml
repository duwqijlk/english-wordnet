simpleMeaning: One of the big ones on the wings or tail of a bird
scope: 'Another name for a quill, a pinion, or a flight feather: one of the big wing or tail feathers
  of a bird, not a small down feather and not a feather used as a pen.'
examples:
- The owl lost a quill feather during the night.
- She found a quill feather on the path.
