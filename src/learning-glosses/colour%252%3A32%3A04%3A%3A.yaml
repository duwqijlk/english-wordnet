simpleMeaning: to give a false reason for a thing to hide what is really true
scope: 'Also called color: to give a false reason to hide the truth, not to put a shade on a thing and
  not to give a thing a false show to mislead.'
examples:
- He coloured his lie with kind words to make it seem true.
- Do not colour the facts to hide your mistake.
