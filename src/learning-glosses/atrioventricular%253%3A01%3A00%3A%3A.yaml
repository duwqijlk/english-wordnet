simpleMeaning: said of something that has to do with the upper and lower rooms of the heart
scope: 'Also called auriculoventricular: said of something that has to do with the upper and lower rooms
  of the heart, not of the heart valves and not of the heart muscle alone.'
examples:
- Atrioventricular disease affects both the upper and lower chambers of the heart.
- The atrioventricular node sends signals between the heart's upper and lower rooms.
