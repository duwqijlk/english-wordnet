simpleMeaning: In fine writing, a kind and open wish to give to others without holding back.
scope: Generous giving, in fine writing, not a reward paid for catching a criminal.
examples:
- The poet praised his bounty, for he gave freely to all who came to his door.
- She gave with a bounty that surprised her friends.
