simpleMeaning: all the people who run companies, taken together as a group
scope: This is all the people who run companies as one group; it is not one such person on his own, and
  it is not a company itself.
examples:
- Local businessmen met to talk about new shops in the town.
- The businessmen asked the town for lower taxes on their companies.
