simpleMeaning: A sea robin with hard bony plates on its body and feelers under its chin, found mostly
  on the sea-floor slope at the edge of the land.
scope: Also called armored sea robin and armored searobin; a sea robin of the deep sea-floor slope, set
  apart from shore sea robins by its bony plates and its chin feelers.
examples:
- Peristedion miniatum lives on the slope far below the surface.
- The Peristedion miniatum in the net had bony plates along its sides.
