simpleMeaning: a kind of ship first made and used by the Vikings in their age for trade, business, exploring,
  and war
scope: A ship first made and used by the Vikings, not a modern warship or a ship built for carrying planes.
examples:
- The longship moved by oars and sail.
- Viking longships carried traders across the sea.
