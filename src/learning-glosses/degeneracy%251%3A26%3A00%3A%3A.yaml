simpleMeaning: The state of being sunk low in mind or morals.
scope: This sense is also called decadence and degeneration, for the state of being sunk low in mind or
  morals, unlike the sense for moral perversion, a harming of virtue and moral rules.
examples:
- Degeneracy sank him low in mind and morals.
- Degeneracy is the state of being sunk low.
