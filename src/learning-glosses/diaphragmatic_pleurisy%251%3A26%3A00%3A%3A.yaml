simpleMeaning: Sharp bursts of pain, most often in the chest, strike many people at once in this sudden
  catching illness
scope: This sudden catching illness that spreads through many people at once is also called epidemic myalgia,
  epidemic pleurodynia and myosis.
examples:
- Diaphragmatic pleurisy spread quickly through the town.
- He had diaphragmatic pleurisy and felt sharp bursts of pain in his chest.
