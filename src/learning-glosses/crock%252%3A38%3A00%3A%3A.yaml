simpleMeaning: to let color come off when rubbed, of cloth that was dyed badly
scope: The verb for color coming off cloth when rubbed; not the clay jar, and not putting soil on something.
examples:
- The cheap red shirt crocked onto my white socks when they rubbed in the wash.
- This badly dyed cloth will crock if you rub it hard.
