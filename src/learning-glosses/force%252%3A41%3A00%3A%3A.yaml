simpleMeaning: to make someone do something they do not want to do, whether by pressure, threats, physical
  strength, clever talk, or a situation with no other choice.
scope: This is outside pressure that leaves someone little choice, not a passing need or feeling that
  urges them.
examples:
- The guards forced the prisoners to work in the cold.
- She was forced to sign the contract.
