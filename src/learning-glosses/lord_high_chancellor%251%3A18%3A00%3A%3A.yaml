simpleMeaning: This person leads the courts and chairs the upper house of Parliament, as the top officer
  of the king or queen
scope: Also called lord chancellor, this is the person at the head of the courts in Britain, not a judge
  in a lower court and not a lawmaker in the lower house.
examples:
- The lord high chancellor took his seat at the head of the upper house.
- As lord high chancellor, he led the courts of the land.
