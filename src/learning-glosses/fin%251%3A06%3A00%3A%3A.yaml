simpleMeaning: a flat blade on a ship that keeps it steady, shaped like a fish's side paddle
scope: A steadying blade on a ship's hull; not the swimming shoe, nor a fish's balance organ.
examples:
- A steel fin on the hull helps keep the ship from rolling.
- One fin on the hull was damaged when the ship hit the dock.
