simpleMeaning: a leaning against a person or a group, so you will not give them your approval
scope: A leaning against a person or a group, so you will not give them your approval, also called dislike,
  not the act of saying a thing is wrong and not the words that show it.
examples:
- Her disapproval of the plan was plain to see.
- He felt a quiet disapproval of his son's friends.
