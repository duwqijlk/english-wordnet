senseId: 'genuflect%2:38:00::'
synsetId: 02044779-v
simpleMeaning: To bend the knees and bow in church, or before a holy image or a person of higher rank
  in the church.
scope: To bend the knees and bow in church or before a person of higher rank in the church or a holy image,
  not the same bow made in a servile way before a person of power.
examples:
- The old man genuflected before the altar.
- Visitors genuflect as they pass the shrine.
