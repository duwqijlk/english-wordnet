simpleMeaning: A horse wears this rope or cloth band on its head, and a rope joined to it lets a person
  lead the horse
scope: 'Another name for a halter: a rope or cloth band worn on a horse''s head for leading, not a bridle
  with a bit and not a saddle.'
examples:
- He slipped the hackamore over the horse's head before leading it to the field.
- The trainer used a hackamore instead of a bridle while the young horse was learning.
