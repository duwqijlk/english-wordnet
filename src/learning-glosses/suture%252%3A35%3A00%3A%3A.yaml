simpleMeaning: to join the two sides of a cut in the body by sewing them with thread
scope: This is the verb for sewing a cut in the body closed; it is not the thread itself and not the fixed
  joint between bones in the head.
examples:
- The doctor will suture the wound after surgery.
- She learned how to suture a deep cut on the leg.
