synsetId: 03720653-n
simpleMeaning: A mirror tool for looking at faraway things, in which a curved lens cuts down the blurring
  made by its hollow mirror.
scope: A mirror tool for looking at faraway things, with a curved lens that cuts down blurring; not a
  tool with lenses only and not a tool for looking at near things.
examples:
- The Maksutov telescope showed the rings of Saturn clearly.
- We used a Maksutov telescope to watch the moon.
