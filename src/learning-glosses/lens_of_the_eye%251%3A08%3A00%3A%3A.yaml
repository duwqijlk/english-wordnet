simpleMeaning: a clear body behind the coloured part of the organ of sight, curved out on both sides,
  that with the front of that organ helps focus light at the back
scope: A clear body behind the coloured part of the organ of sight that helps focus light at the back,
  also called a lens or a crystalline lens, not the coloured part itself and not the front of the organ.
examples:
- The lens of the eye focuses light on the back of the eye.
- With age, the lens of the eye can grow cloudy.
