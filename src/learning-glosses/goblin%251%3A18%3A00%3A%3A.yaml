simpleMeaning: In folklore, a small ugly creature with powers beyond nature that makes trouble for people
scope: This is a small ugly creature in old stories that makes trouble for people, not a kind or helpful
  spirit and not a real animal.
examples:
- In the story, a goblin hid under the bridge and scared travellers.
- The children dressed as a goblin for the party.
