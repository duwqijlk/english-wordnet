senseId: 'delayed_action%1:06:00::'
synsetId: 03177404-n
simpleMeaning: A camera device that by itself holds back the shutter for a set time so the person taking
  the picture can get into it
scope: A camera device that waits a set time before taking the picture so the photographer can join it;
  not a remote control and not a fast shutter speed.
examples:
- She set the delayed action so she could join the group photo.
- The delayed action gave him ten seconds to get into the picture.
