simpleMeaning: Fourteen Old Testament books of the Vulgate, left out of Jewish and Protestant Bibles;
  eastern churches hold them canonical, but the Russian church takes them as inspired, of lesser standing.
scope: Not the books all churches take as canonical, nor other collections of sacred writings; these fourteen
  books are the ones some churches leave out of the Bible.
examples:
- The Apocrypha contains fourteen books.
- Some Bibles print the Apocrypha between the Old and New Testaments.
