simpleMeaning: A plant from Europe that comes back each year, with yellow blooms in spring, now growing
  on its own in many places, above all in the east of North America.
scope: Also called meadow buttercup, tall crowfoot, and tall field buttercup, this European plant lives
  more than one year, bears yellow flowers in spring, and now grows wild in many places, above all in
  the east of North America.
examples:
- In spring the tall buttercup shows yellow flowers.
- In the east of North America tall buttercup now grows wild.
