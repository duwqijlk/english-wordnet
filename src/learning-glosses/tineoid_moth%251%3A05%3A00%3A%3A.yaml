simpleMeaning: a small winged insect with dull colors and mouth parts that chew
scope: Another name for tineoid, this is a small winged insect with dull colors and mouth parts that chew;
  not the pale yellow moth whose young eat wool or fur.
examples:
- A dull tineoid moth sat on the dark curtain, hard to spot.
- The tineoid moth chewed a small hole in the cloth.
