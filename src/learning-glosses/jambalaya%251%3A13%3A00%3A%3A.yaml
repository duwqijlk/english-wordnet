simpleMeaning: A spicy rice dish in Creole cooking, combining ham, sausage, chicken or shellfish with
  tomatoes, peppers, onions and celery.
scope: A particular Creole rice dish, not gumbo or another Creole stew, and not rice by itself.
examples:
- She made jambalaya with chicken, sausage, peppers and celery.
- The jambalaya was spicy, with tomatoes and onions mixed through the rice.
