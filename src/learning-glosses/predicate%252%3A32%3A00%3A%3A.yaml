senseId: 'predicate%2:32:00::'
synsetId: 01019010-v
simpleMeaning: To say that a thing has a certain quality, as one of its marks.
scope: 'Also called proclaim: to say that a thing has a certain quality, as one of its marks, not the
  part of a sentence or a claim that says something about its subject, and not the act of making such
  a part, and not the use in which one thing follows from another.'
examples:
- The report predicated honesty of the new clerk.
- He predicated great skill of the young painter.
