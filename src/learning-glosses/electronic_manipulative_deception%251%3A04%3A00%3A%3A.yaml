simpleMeaning: The enemy is kept from true signs, and fed signs that point the wrong way, by steps that
  wipe out what would give things away
scope: These steps, also called manipulative electronic deception, hide true signs from the enemy or put
  out false ones.
examples:
- Electronic manipulative deception hid the unit's real movements from the enemy.
- The command used electronic manipulative deception to send false signals.
