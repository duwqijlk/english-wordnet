simpleMeaning: The last point of a chain of reasoning is about one thing, and that thing sits in this
  starting point as the small term
scope: 'Also called a minor premise and subsumption: the starting point of a chain of reasoning that holds
  the small term, not the major premise and not the last point itself.'
examples:
- The minor premiss stated that Socrates is a man.
- Her minor premiss gave the subject for the conclusion.
