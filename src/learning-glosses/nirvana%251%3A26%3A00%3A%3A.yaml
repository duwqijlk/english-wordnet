simpleMeaning: In Hinduism and Buddhism, a state of perfect peace beyond being born again and again, marked
  by the end of wanting, pain, and the sense of being a separate self
scope: Also called enlightenment, this is the highest state of peace in Hinduism and Buddhism, not heaven
  and not just feeling calm for a short time.
examples:
- In Buddhism, a person who reaches nirvana is free from wanting and pain.
- He hoped that years of prayer and good acts would lead him to nirvana.
