simpleMeaning: an office that gathers and reads facts about the air and sky, to study the skies and to
  tell what the skies will do next
scope: An office that gathers facts about the air and sky to study them and to tell what will come next,
  not a place that makes rain and not a radio station that reads out the news.
examples:
- The weather bureau said rain would reach the coast by night.
- She called the weather bureau before the boat left the bay.
