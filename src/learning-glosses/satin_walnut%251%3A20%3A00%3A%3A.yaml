simpleMeaning: wood from the middle of a sweet gum tree, with a red-brown colour, cut into boards to make
  furniture
scope: This is the red-brown wood from the middle of a sweet gum tree, also called hazelwood, red gum,
  and sweet gum; not the nut that grows on a walnut tree and not a different kind of wood for building.
examples:
- The table was made from satin walnut.
- They chose satin walnut for the new chairs.
