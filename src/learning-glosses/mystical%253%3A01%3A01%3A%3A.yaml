simpleMeaning: like seeking deep truth about God and the spirit through quiet thought
scope: 'Also called mystic: this is about a way of thinking that is like the search for deep truth about
  God and the spirit through quiet thought. It is not that search itself, and not a hidden meaning that
  is hard to understand.'
examples:
- She trusted her mystical intuition when she chose which path to take.
- He offered mystical theories about the stock market that no facts could support.
