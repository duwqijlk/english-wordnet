simpleMeaning: A blood tube that starts in the knee and runs up to become the blood tube of the thigh.
scope: A blood tube that starts in the knee and runs up to the thigh tube; popliteal vein is another name
  for this sense; not a blood tube of the lower leg and not one of the hip.
examples:
- The vena poplitea starts in the knee and runs up the leg.
- The surgeon tied off the vena poplitea to stop the bleeding.
