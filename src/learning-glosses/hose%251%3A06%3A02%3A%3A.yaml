simpleMeaning: tight clothing for a man in the 1500s and 1600s, covering his legs up to the waist and
  worn with a doublet (a tight jacket of that time)
scope: This is one tight piece of clothing for a man's legs from long ago; it is not socks, stockings
  and tights as a group, and not a pipe for water.
examples:
- In the play, the actor wore hose under his short coat, as men did in the 1600s.
- His hose reached up to his waist and were worn with a doublet.
