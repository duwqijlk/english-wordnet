simpleMeaning: A close outfit worn by pilots and space crew to hold back the pull of the earth and the
  pull of a swift shift in speed or course
scope: 'Also called the anti-G suit: a close outfit that holds back the pull of the earth and of swift
  shifts in speed or course, to be told apart from ordinary flight clothes and other close clothes worn
  in planes.'
examples:
- The pilot pulled on his G suit before takeoff.
- The astronaut wore a G suit for the launch.
