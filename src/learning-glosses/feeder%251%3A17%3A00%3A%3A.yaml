simpleMeaning: a stream that flows into the main stream
scope: A stream that flows into the main stream, also called affluent and also called tributary; not an
  animal being made fat, and not the thing that holds food for wild birds.
examples:
- A small feeder joins the river just below the town.
- This stream is only a feeder, but it grows wide after heavy rain.
