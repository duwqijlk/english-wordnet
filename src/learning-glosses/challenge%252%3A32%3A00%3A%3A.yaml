simpleMeaning: To invite someone to compete against you or to dare them to do something difficult.
scope: This is not a demand that a statement be explained; it is an invitation to compete or to attempt
  something difficult.
examples:
- The champion challenged the young boxer to a rematch.
- The teacher challenged the class to solve the puzzle in ten minutes.
