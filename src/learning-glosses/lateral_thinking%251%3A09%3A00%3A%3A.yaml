simpleMeaning: a way to work out problems by looking at them from many sides, not by going straight at
  them
scope: A way to work out problems by looking at them from many sides, not by going straight at them and
  not by working through them step by step.
examples:
- Lateral thinking helped her solve the puzzle by looking at it in a new way.
- The team used lateral thinking to find a fresh answer to the old problem.
