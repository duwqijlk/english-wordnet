simpleMeaning: In medicine, very small living things that cause disease enter the body and grow in number;
  this can damage the body and make a person ill
scope: In medicine, this is the entering and growing of disease-causing tiny living things in the body;
  it is not the ill state that follows, and not a bad effect on a person's morals.
examples:
- Doctors said the infection began when tiny living things entered the cut and grew.
- Without clean water, infection can enter through a wound and spread through the body.
