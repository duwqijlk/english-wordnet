simpleMeaning: A clover native to Ireland with yellowish flowers, often thought to be the true or first
  shamrock.
scope: Also called shamrock, hop clover and lesser yellow trefoil, this is a clover native to Ireland
  with yellowish flowers, often thought to be the true or first shamrock, not a clover of another land.
examples:
- Trifolium dubium grows wild in the fields of Ireland.
- Many call Trifolium dubium the true shamrock.
