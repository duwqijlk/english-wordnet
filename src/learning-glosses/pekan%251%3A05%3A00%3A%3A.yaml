simpleMeaning: An animal that eats meat and lives in trees in North America, big and dark brown in colour
scope: Also called a fisher, a fisher cat or a black cat, this is a meat-eating animal that lives in trees
  in North America, not a pet cat and not a weasel.
examples:
- The pekan climbed high into the pine tree to hunt.
- A pekan slipped through the dark woods of Canada at dusk.
