simpleMeaning: to mix a tiny bit of another stuff into the stuff computer chips are made of, to change
  how it works or give it new powers
scope: This is adding stuff to chip material to change how it works; it is not the fizzy drink.
examples:
- The resistors have been doped to change how they work.
- Engineers dope the silicon to make the chip faster.
