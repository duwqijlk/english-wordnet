simpleMeaning: To carry out the tasks that your job or official position requires of you.
scope: This is not performing a part on stage, behaving in a put-on way or taking any action at all; it
  is doing what a job or post requires.
examples:
- He acted as head of the firm for a year while the owner was ill.
- The mayor acted in his official capacity, opening the new bridge and greeting the crowd.
