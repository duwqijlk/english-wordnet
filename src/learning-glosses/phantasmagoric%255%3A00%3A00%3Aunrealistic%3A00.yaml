senseId: phantasmagoric%5:00:00:unrealistic:00
synsetId: 01949684-s
simpleMeaning: Said of pictures or scenes full of strange dream-like images, with things put together
  that do not belong together
scope: Also called phantasmagorical or surreal, this word is said of strange dream-like pictures and odd
  mixtures of things, not of plain true-to-life pictures.
examples:
- The phantasmagoric shadows moved across the wall like a dream.
- Her phantasmagoric painting mixed clocks, birds and staircases that led nowhere.
