simpleMeaning: An illegal seizure of power, done swiftly and by force, that puts a new government in place.
scope: Also called a coup and a takeover, an illegal seizure of power, done swiftly and by force, that
  puts a new government in place.
examples:
- The generals staged a putsch and seized the capital overnight.
- The putsch failed when the army refused to follow the plotters.
