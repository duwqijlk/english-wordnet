senseId: 'loutishness%1:07:01::'
synsetId: 92435293-n
simpleMeaning: The way a rude, rough person acts when making trouble, often with violence, as a yob does.
scope: This is the way of acting like a troublemaker who is often violent, not mere bad manners and not
  a single rude act.
examples:
- His loutishness got him thrown out of the pub.
- The crowd's loutishness shocked the older fans.
