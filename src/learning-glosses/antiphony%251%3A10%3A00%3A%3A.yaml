simpleMeaning: singing in which a choir in two parts takes turns, one part answering the other
scope: Singing in which a choir in two parts takes turns, one answering the other, not a single short
  chant and not all the singers singing the same words together.
examples:
- The antiphony of the two choirs filled the church.
- They sang the psalm in antiphony, one side answering the other.
