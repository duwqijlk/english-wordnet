simpleMeaning: a bird of Arab stories that burns to death and rises new from its ashes, with only one
  alive at a time, made new every 500 years
scope: A bird of Arab stories that burns to death and rises new from its ashes, not a real bird that lives
  in the world.
examples:
- The phoenix rose from its ashes, young and bright again.
- In the old tale, only one phoenix lived at a time.
