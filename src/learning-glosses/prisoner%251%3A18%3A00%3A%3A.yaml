simpleMeaning: a person who is kept in a place and not allowed to leave, especially a soldier caught by
  the enemy in a war
scope: This is a person kept in a place and not allowed to leave, especially a soldier caught in war;
  it is not a free person or a person who works in a prison.
examples:
- The prisoner was kept in a small room and could not leave.
- After the war, each prisoner was sent back home.
