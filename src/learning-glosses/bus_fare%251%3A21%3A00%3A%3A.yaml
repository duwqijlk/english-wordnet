simpleMeaning: the money charged to ride on a public road vehicle or a street car
scope: The money charged to ride on a public road vehicle or a street car, also called carfare, not the
  cost of the vehicle itself and not a train ticket.
examples:
- She paid the bus fare with coins when she got on.
- The bus fare went up by fifty cents this year.
