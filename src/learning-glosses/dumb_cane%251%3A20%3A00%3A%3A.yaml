simpleMeaning: Its poison swells the tongue and throat till a person cannot speak, and this plant, green
  all year, bears big showy dark green leaves
scope: Mother-in-law's tongue and mother-in-law plant are other names for this plant, whose poison swells
  the tongue and throat till a person cannot speak.
examples:
- The dumb cane stood in the corner with its big dark green leaves.
- She warned the children not to chew a dumb cane leaf.
