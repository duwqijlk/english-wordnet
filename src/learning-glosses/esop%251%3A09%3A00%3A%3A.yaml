simpleMeaning: A plan by which workers build up shares in their firm over time and may in the end take
  control of it.
scope: Also called an employee stock ownership plan, this plan lets workers build up shares in their firm
  and in the end take control of it, not any other plan for workers to buy shares.
examples:
- The workers joined the ESOP to buy shares in the firm.
- Under the ESOP, staff may one day take control of the company.
