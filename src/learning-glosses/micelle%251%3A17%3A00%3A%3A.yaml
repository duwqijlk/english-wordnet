senseId: 'micelle%1:17:00::'
synsetId: 09376500-n
simpleMeaning: An electrically charged particle formed when long-chain molecules or ions (charged atoms
  or molecules) cluster in some liquids holding tiny particles and carrying current, such as soap and
  detergent solutions.
scope: A charged cluster in certain liquids, not a single molecule or ion and not the whole solution.
examples:
- When the soap dissolved, its molecules gathered into micelles.
- Each micelle in the detergent solution carried an electric charge.
