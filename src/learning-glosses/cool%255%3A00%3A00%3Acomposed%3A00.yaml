simpleMeaning: Calm and in control of your feelings in a hard situation, and not showing strong emotion.
scope: It is not low in temperature, and not a color such as blue or green.
examples:
- She stayed cool during the emergency and gave clear orders.
- He was cool under pressure, even when the crowd shouted.
