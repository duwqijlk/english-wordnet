simpleMeaning: A one-year spurge of the west of the United States, with bright groups of flowers set off
  by white leaf-like parts and a very poisonous milk
scope: This is a one-year spurge of the west of the United States with bright groups of flowers set off
  by white leaf-like parts and a very poisonous milk; snow-in-summer and snow-on-the-mountain are other
  names for this sense, not a garden weed and not any other spurge.
examples:
- Ghost weed grew along the dry ditch.
- Do not touch ghost weed, as its milk is very poisonous.
