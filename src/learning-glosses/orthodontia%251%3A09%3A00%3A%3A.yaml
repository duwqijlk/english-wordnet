simpleMeaning: The part of tooth care that works to stop or fix teeth that do not sit straight.
scope: This is also called dental orthopaedics, dental orthopedics, orthodontics, and orthodonture, and
  it is the part of tooth care that works to stop or fix teeth that do not sit straight.
examples:
- Teeth that do not sit straight can be fixed through orthodontia.
- Through orthodontia, teeth that do not sit straight can be put right.
