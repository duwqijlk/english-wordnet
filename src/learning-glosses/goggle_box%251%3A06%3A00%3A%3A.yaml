simpleMeaning: Moving pictures come to a screen through this machine, which picks up the signals that
  carry them
scope: Also called television, telly, tv, boob tube and idiot box; a machine for showing broadcast pictures,
  not a radio and not a computer screen.
examples:
- We watched the news on the goggle box last night.
- The goggle box in the corner has a cracked screen.
