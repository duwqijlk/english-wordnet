simpleMeaning: An extinct kind of horned animal with thick hair that lived in the far north
scope: An extinct thick-haired animal of the far north; not the woolly mammoth and not a living rhinoceros.
examples:
- The woolly rhinoceros died out long ago in the far north.
- The woolly rhinoceros had thick hair and a horn on its nose.
