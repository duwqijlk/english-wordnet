simpleMeaning: Of a claim offered as proof, based on personal feeling, not on facts one can check.
scope: Of evidence or a claim that rests on personal feeling, not on facts that can be checked.
examples:
- The unverifiable story could not be checked against any record.
- Her claim was unverifiable, resting on memory alone.
