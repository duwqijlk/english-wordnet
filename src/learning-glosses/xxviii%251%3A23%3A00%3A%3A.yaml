simpleMeaning: The number that comes from adding twenty-seven and one.
scope: Also called 28 and twenty-eight; the number after twenty-seven, not twenty-seven and not twenty-nine.
examples:
- XXVIII in Roman numerals means twenty-eight.
- There were XXVIII chairs in the hall.
