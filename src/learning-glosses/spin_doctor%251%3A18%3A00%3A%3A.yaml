simpleMeaning: A public relations person who tries to stop bad news by sharing a good view of the words
  or acts of a firm, political party or well-known person
scope: A public relations person who tries to stop bad news by sharing a good view of the words or acts
  of a firm, political party or well-known person; spinmeister is another name for this sense, not a news
  reporter and not a person who makes things up.
examples:
- The spin doctor told the press the firm's side of the story in the best light.
- He is just a spin doctor, paid to stop bad news.
