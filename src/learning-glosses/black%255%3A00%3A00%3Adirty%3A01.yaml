simpleMeaning: made dirty with dirt or with the fine dark powder that burning leaves behind.
scope: This is about being made dirty, not about the colour itself or about cruel humour.
examples:
- His hands were black with coal dust after the shift.
- The kettle was black with soot from the open fire.
