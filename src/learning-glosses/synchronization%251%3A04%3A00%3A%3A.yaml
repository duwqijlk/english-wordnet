simpleMeaning: the act of setting clocks or watches so they all show the same time
scope: 'Also called synchronisation and synchronizing: setting clocks to show the same time, not things
  just happening at the same time, and not a change that makes things happen together again and again.'
examples:
- The synchronization of the clocks made sure every room showed the same time.
- Before the race, synchronization of their watches helped the team start together.
