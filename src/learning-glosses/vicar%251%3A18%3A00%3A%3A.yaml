simpleMeaning: In the Roman Catholic Church, a priest who does the work of a higher priest
scope: In the Roman Catholic Church, a priest who does the work of a higher priest, not the Church of
  England priest in charge of a parish and not the Episcopal priest in charge of a chapel.
examples:
- The vicar acted for the bishop while he was away.
- A vicar said the mass that Sunday.
