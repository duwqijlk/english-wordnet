simpleMeaning: A sore swelling that comes with leprosy, making painful sore spots on the arms, legs and
  face.
scope: Also called erythema nodosum leprosum; a painful skin effect that comes with leprosy, not leprosy
  itself.
examples:
- ENL left painful spots on his arms.
- The doctor treated her ENL with rest and care.
