simpleMeaning: the typical way a particular person, group, or period puts things across in language, art,
  music, or similar fields
scope: This is the expressive manner of a person, group, or period, not the general way something is done,
  not a popular fashion, not elegance of manner, and not the botanical part of a flower.
examples:
- Her writing style is easy to recognize after a few pages.
- The novel is written in the style of the 1920s.
