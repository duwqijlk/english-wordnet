simpleMeaning: In art, the study of beauty and taste, and of the standards used to judge art
scope: In art, the study of beauty, taste and the standards for judging art; not the beauty of a thing
  itself, and not a set of artistic rules.
examples:
- Traditional aesthetics assumed that beauty could be judged by timeless standards.
- She studied aesthetics to learn how people judge art.
