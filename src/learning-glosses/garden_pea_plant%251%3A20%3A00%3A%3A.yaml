simpleMeaning: A green growing thing that makes seeds, and the seeds are usually eaten fresh, not dried.
scope: A plant grown for its seeds, also called common pea and garden pea, not the seed pod itself.
examples:
- The garden pea plant in our yard grew tall this spring.
- We water the garden pea plants every day until the pods are ready.
