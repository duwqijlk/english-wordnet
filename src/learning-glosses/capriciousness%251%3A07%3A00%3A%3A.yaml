senseId: 'capriciousness%1:07:00::'
synsetId: 04679198-n
simpleMeaning: The habit of acting in ways no one can foresee, following a passing fancy rather than reason
  or good sense.
scope: 'Also called whimsy, flightiness, or arbitrariness: acting from a passing fancy rather than reason,
  not simply being driven by sudden urges.'
examples:
- Her capriciousness made it hard to plan anything with her.
- The capriciousness of his choices puzzled his friends.
