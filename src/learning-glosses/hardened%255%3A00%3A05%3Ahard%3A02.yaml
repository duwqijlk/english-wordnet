simpleMeaning: used of people who no longer feel pity, sadness or other feelings in a strong way
scope: This is about a person's feelings becoming less strong, not about a thing that has become hard
  to touch.
examples:
- Years of war left him a hardened man who felt little pity.
- The hardened judge showed no soft feelings for the man.
