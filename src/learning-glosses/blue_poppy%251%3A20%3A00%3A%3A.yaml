simpleMeaning: Flowers from mauve-pink to the bright colour of a clear sky hang in clusters on this plant
  from China that lives for years.
scope: This plant from China lives for years, with flowers from mauve-pink to the bright colour of a clear
  sky, and it is not a poppy of one year only.
examples:
- The blue poppy had flowers from mauve-pink to bright sky blue.
- Blue poppy flowers hung down in clusters.
