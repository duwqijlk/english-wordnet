simpleMeaning: The pushes of the air on a wing shape as it moves through the air or another gas.
scope: The push of the air on a wing shape in motion, not the part of it that lifts against weight and
  not the pull of the earth.
examples:
- The aerodynamic force on the wing grows with speed.
- Pilots must allow for aerodynamic force in a crosswind.
