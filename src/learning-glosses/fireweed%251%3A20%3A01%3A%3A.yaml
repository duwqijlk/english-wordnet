simpleMeaning: Tall North American perennial with creeping underground stems, narrow leaves and spikes
  of pinkish-purple flowers, growing in masses on burned ground and new clearings; a major honey source.
scope: This is the tall pinkish-purple plant that springs up on burned ground and clearings, not the other
  American weed also called fireweed, which has small white or greenish flowers.
examples:
- After the forest fire, fireweed covered the blackened slope within a season.
- Beekeepers value fireweed because its pink spikes yield pale, mild honey.
