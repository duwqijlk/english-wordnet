simpleMeaning: Something said or written that uses words in a clever way, or has a clever and surprising
  idea, and can make people laugh
scope: Clever or surprising words that make people laugh, also called humor and humour; not a person who
  makes jokes.
examples:
- His wit in the speech made the whole room laugh.
- She replied with quick wit that made everyone smile.
