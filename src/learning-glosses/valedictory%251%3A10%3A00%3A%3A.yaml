simpleMeaning: This goodbye speech is given by the best of a class that is leaving school, at the leaving
  ceremony.
scope: Valediction, valedictory address, and valedictory oration are other names for this goodbye speech,
  given by the best of a class that is leaving school.
examples:
- The valedictory was given by the best of the class that was leaving.
- At the end of school, the class listened to the valedictory.
