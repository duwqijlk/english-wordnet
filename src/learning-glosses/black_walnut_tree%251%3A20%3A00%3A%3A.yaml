simpleMeaning: a plant from North America with hard dark wood and nuts that can be eaten
scope: Also called black walnut and black hickory, a North American tree with hard dark wood and nuts
  that can be eaten, not the nut on its own and not a walnut tree from another place.
examples:
- The black walnut tree in the yard gives shade and nuts each year.
- We cut boards from a black walnut tree for the table.
