synsetId: 04924616-n
simpleMeaning: In physics, the quality of a thing that has the same value no matter which way it is measured
scope: The quality of a thing that reads the same in every direction, also called symmetry; not a thing
  that reads the same only in one direction and not a thing with no fixed value.
examples:
- The glass shows isotropy, since light passes through it the same way in all directions.
- Tests proved the isotropy of the metal sample.
