simpleMeaning: A medical device that shines light through the skin to estimate how much oxygen the blood
  is carrying, rather than testing a blood sample directly.
scope: A noninvasive monitor that estimates blood oxygen through the skin; not a blood test and not a
  treatment device.
examples:
- The nurse clipped a pulse oximeter to my finger to check my oxygen level.
- A pulse oximeter uses light to measure oxygen in the blood.
