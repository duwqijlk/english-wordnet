simpleMeaning: an open yard with covered walks around it, as in religious buildings
scope: An open yard with covered walks around it in a religious building; not the home where religious
  people live away from the world, and not the act of shutting someone away.
examples:
- We walked around the cloister in the quiet afternoon.
- The cloister had stone walks on all four sides.
