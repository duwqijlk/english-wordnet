simpleMeaning: an electric lamp with a glass cover, clear or frosted, holding a thin wire, usually tungsten,
  that gives off light when electricity heats it
scope: Also called a bulb, this is an electric lamp with a glass cover and a thin wire inside, not a candle
  and not a lamp shade.
examples:
- The lightbulb in the kitchen burned out.
- She screwed a new lightbulb into the lamp.
