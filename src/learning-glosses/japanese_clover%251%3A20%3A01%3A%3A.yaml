simpleMeaning: It lives for one year, comes from tropical Asia, and now grows in the United States too.
scope: Also called jap clover, Japan clover, and Lespedeza striata, this is a plant that lives for one
  year, from tropical Asia and now grown in the United States too, not a plant that lives for many years.
examples:
- Japanese clover now grows in fields in the United States.
- The farmer cut the Japanese clover after one year of growth.
