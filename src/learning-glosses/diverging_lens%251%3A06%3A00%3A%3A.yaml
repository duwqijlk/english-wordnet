simpleMeaning: a piece of shaped glass through which a straight beam of light spreads out instead of coming
  together
scope: A piece of shaped glass through which a straight beam of light spreads out, also called a concave
  lens; not a glass that brings light together and not a plain window.
examples:
- The diverging lens made the beam wider.
- She held a diverging lens up to the light.
