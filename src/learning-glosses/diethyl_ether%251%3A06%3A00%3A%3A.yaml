simpleMeaning: Once breathed in to put people to sleep, this clear liquid turns to vapour quickly and
  catches fire easily
scope: This clear liquid is also called ether, divinyl ether, ethoxyethane, ethyl ether and vinyl ether.
examples:
- Diethyl ether was once used to put people to sleep.
- The bottle of diethyl ether was kept away from flames.
