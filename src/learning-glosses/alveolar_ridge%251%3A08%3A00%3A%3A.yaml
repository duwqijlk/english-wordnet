simpleMeaning: A raised line of bone that forms the edges of the upper and lower jaws and holds the sockets
  of the teeth.
scope: 'Also called alveolar process and gum ridge: the raised line of bone that forms the edges of the
  upper and lower jaws and holds the tooth sockets, not the teeth themselves and not the whole jawbone.'
examples:
- The alveolar ridge holds the sockets of the teeth.
- After the tooth was pulled, the alveolar ridge slowly changed shape.
