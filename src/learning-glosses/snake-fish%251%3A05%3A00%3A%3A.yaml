simpleMeaning: a warm-sea creature with a big mouth and a head like a lizard's, found all over the world
scope: A warm-sea creature with a big mouth and a head like a lizard's, also called lizardfish and snakefish;
  not a lizard, and not a sea creature with a small mouth.
examples:
- The snake-fish waited on the sea floor with its big mouth open.
- A snake-fish darted out from the rocks to catch its food.
