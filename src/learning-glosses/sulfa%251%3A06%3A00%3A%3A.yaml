simpleMeaning: A drug that fights bacteria, made of any of several man-made carbon-based compounds that
  stop the growth of bacteria needing PABA.
scope: Also called a sulfa drug, a sulfonamide, or a sulpha; a drug that stops the growth of bacteria,
  not an antibiotic made from mould.
examples:
- The doctor gave her sulfa for the infection.
- Sulfa drugs were used before penicillin became common.
