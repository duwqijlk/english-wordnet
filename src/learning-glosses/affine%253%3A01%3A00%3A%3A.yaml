simpleMeaning: In mathematics, to do with the kind of geometry that studies changes of shape in which
  straight lines stay straight
scope: In mathematics, to do with the geometry of changes in which straight lines stay straight, not ordinary
  school geometry about lengths and angles, and not the geometry of curved surfaces.
examples:
- The affine map kept all the straight lines straight.
- Affine geometry does not measure angles.
