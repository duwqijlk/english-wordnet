simpleMeaning: A small waxy white or pale pink woodland plant that lives off dead matter, with scale-like
  leaves and one bent flower; it turns black as it grows old.
scope: This is a small waxy white or pale pink woodland plant that lives off dead matter, with scale-like
  leaves and one bent flower, turning black as it grows old; waxflower and Monotropa uniflora are other
  names for it; not a green plant that feeds by sunlight.
examples:
- Indian pipe grows in the dark woods without green leaves.
- The white flower of Indian pipe nods at the top of its stem.
