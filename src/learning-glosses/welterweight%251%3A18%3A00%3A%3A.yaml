simpleMeaning: A pro boxer who weighs from 141 to 147 pounds.
scope: This sense is a pro boxer who weighs from 141 to 147 pounds, unlike the sense for a weight class
  in fight sports, for fighters heavier than lightweights and lighter than middleweights, unlike the sense
  for an amateur boxer weighing no more than 148 pounds, unlike the sense for a weight of 28 pounds, at
  times set as a handicap in a horse race, as in a steeplechase, and unlike the sense for a wrestler who
  weighs 154 to 172 pounds.
