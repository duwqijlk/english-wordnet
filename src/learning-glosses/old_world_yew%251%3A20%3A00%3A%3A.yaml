simpleMeaning: The commonest yew of Europe, living very long and growing very slowly, and one of the longest-lived
  kinds on earth.
scope: Also called English yew and Taxus baccata; the commonest yew of Europe, living very long and growing
  very slowly, not a yew of the New World.
examples:
- The Old World yew can live for a thousand years.
- Old World yew grows slowly in the churchyard.
