simpleMeaning: the officer on a ship who is in charge of choosing and keeping to the way the ship must
  go
scope: This is the officer on a ship who is in charge of its course, not just any member of the ship's
  crew and not a guide on land.
examples:
- The navigator told the captain that the ship was off course.
- As navigator, she checked the maps and the stars each night.
