simpleMeaning: Watching with care and ready for what may come; on the watch for harm that may be near.
scope: Watching with care and ready for what may come, also called watchful, vigilant, wakeful and argus-eyed;
  not careless and not asleep.
examples:
- She stayed open-eyed through the night.
- An open-eyed guard watched the gate.
