simpleMeaning: a kind of plaster, now made mostly from Portland cement, sand, and lime, put on while soft
  to cover the outside walls or surfaces
scope: The material itself, put on outside walls, not the act of putting it on a wall and not the act
  of making patterns with it.
examples:
- The house has white stucco on its outside walls.
- Workers spread soft stucco over the wall before it dried hard.
