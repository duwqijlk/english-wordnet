simpleMeaning: A seated statue of the chief god of old Greek stories, made for the temple at Olympia,
  40 feet tall on a base 12 feet high
scope: This is a seated statue of the chief Greek god at Olympia, not a standing statue and not a statue
  of another god.
examples:
- The Olympian Zeus was a seated statue 40 feet tall.
- Visitors came to Olympia to see the Olympian Zeus.
