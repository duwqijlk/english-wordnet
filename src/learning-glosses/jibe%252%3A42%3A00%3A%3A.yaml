simpleMeaning: to match or agree with something else, be like it, and have the same main points
scope: 'Also called agree, match, check, fit, correspond, tally and gibe: this is about two things matching,
  not the noun sense of a sharp remark aimed at a person.'
examples:
- His story does not jibe with what the witness said.
- The dates in the two letters jibe in every detail.
