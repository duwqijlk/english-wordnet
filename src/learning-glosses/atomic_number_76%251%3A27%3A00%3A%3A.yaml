simpleMeaning: A hard metal that breaks easily, blue-grey or blue-black, one of the platinum metals; the
  heaviest metal known.
scope: Also called Os and osmium; a hard blue-grey metal of the platinum metals, not a light metal of
  the same group.
examples:
- Atomic number 76 is a hard blue-grey metal, the heaviest metal known.
- The weight of atomic number 76 surprised the workers.
