simpleMeaning: A thick spread of mashed chickpeas with sesame paste, lemon juice, and garlic, used especially
  as a dip for pita bread, first made in the Middle East.
scope: A thick chickpea spread, also called hummus, hommos, hoummos, or humous, not the dark matter in
  soil.
examples:
- She spread humus on the warm pita.
- The humus was made fresh that morning.
