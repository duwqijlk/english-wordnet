simpleMeaning: of a sample for study under a microscope, with no chemical or colour added to it before
  it is looked at
scope: This is about a sample for study under a microscope with nothing added to it; not about an illness
  that gets no care, and not about wood or water with nothing done to make it safe or strong.
examples:
- The untreated specimen was placed under the microscope.
- She compared the treated cells with the untreated ones.
