simpleMeaning: A spike of sweet-smelling blooms and a white or green leaf-like cover mark one of many
  kinds in the group Spathiphyllum, often grown to look at.
scope: A spathe flower and spathiphyllum are other names for this kind, grown for its sweet-smelling blooms.
examples:
- The peace lily has a white leaf-like cover.
- A peace lily bears a spike of sweet-smelling blooms.
