simpleMeaning: A small evergreen European tree or large shrub with scarlet, many-seeded berries that can
  be eaten but taste bland, found from Ireland through southern Europe to Asia Minor.
scope: A shrubby evergreen tree with dull but edible scarlet fruit; not the low herb called strawberry,
  and not the strawberry guava. Native to Ireland, southern Europe and Asia Minor.
examples:
- Strawberry trees lined the path, dropping scarlet berries on the pavement.
- The strawberry tree kept its leaves and red fruit through the winter.
