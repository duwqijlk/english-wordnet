simpleMeaning: a small sea fish, often bright in colour and with no scales, that lives on the sea floor
  in hot and warm waters near Europe and America
scope: A small sea fish with no scales that lives on the sea floor; it is not a young dragon and not a
  dragonfly, though the name sounds like them.
examples:
- A dragonet with bright orange marks lay still on the sand under the water.
- The diver saw a small dragonet near the rocks.
