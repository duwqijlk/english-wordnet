simpleMeaning: A few kinds of small insects feed on plants by sucking their juice, especially the aphid
scope: A small insect that feeds by sucking juice from plants, especially an aphid; not an insect that
  sucks blood from animals or lives on birds, and not a bad person.
examples:
- One louse was sucking juice from the stem of the young plant.
- A louse on the rose plant fed on its juice all day.
