simpleMeaning: standing or walking on the front part of the feet, with the heels up, or as if doing so
scope: This describes standing or walking with the heels up; it is not the name of the front part of the
  foot itself.
examples:
- The children stood tiptoe to see over the fence.
- She stood tiptoe at the window to look out.
