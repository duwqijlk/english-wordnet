simpleMeaning: the part of animal study that looks at eggs, above all birds' eggs and their size, shape,
  colour and number
scope: The part of animal study that looks at eggs, above all birds' eggs and their size, shape, colour
  and number; not the study of birds themselves and not the study of nests.
examples:
- Oology studies the eggs of birds and their colours.
- Her book on oology lists egg sizes and shapes.
