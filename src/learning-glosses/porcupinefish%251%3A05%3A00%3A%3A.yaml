simpleMeaning: a sea animal with sharp points that stand up when its body swells up, found all over the
  world in warm seas
scope: 'Also called a porcupine fish: a sea animal with sharp points that stand up when its body swells,
  not a land animal with sharp points.'
examples:
- The porcupinefish swelled up, and its sharp points stood out all round its body.
- We saw a porcupinefish in the warm sea off the coast.
