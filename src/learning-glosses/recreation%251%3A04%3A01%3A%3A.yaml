simpleMeaning: an activity done for fun and rest that brings back your health and good spirits and helps
  you feel new again
scope: 'Also called refreshment: a fun, restful activity that makes you feel well again, not just any
  fun activity that holds your interest for a time.'
examples:
- Swimming by the pool is her favorite recreation on rest days.
- After a hard week, a day of recreation with his friends left him rested and in good spirits.
