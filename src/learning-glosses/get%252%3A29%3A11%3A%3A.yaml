simpleMeaning: To go through or suffer an injury or an illness.
scope: This is about suffering an injury or illness that happens to you, not about catching an infectious
  disease and not about obtaining something.
examples:
- He got a deep cut on his arm while fixing the roof.
- The goalkeeper got a bruised shoulder in the collision.
