simpleMeaning: Most often with a short focus, this camera glass takes in more than other glass; its pictures
  are squeezed in the middle and bent more at the edges.
scope: Also called fisheye lens, this camera glass takes in more than other glass, most often with a short
  focus, unlike a long lens, which takes in only a narrow view.
examples:
- She fitted a wide-angle lens to take in the whole room.
- The wide-angle lens bent the straight lines at the edges.
