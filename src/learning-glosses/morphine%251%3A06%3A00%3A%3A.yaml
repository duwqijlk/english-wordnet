simpleMeaning: a strong drug taken from opium that takes away pain and can make people need it again and
  again
scope: A strong pain-killing drug from opium that can become a habit; not a drug that puts you to sleep,
  and not opium itself.
examples:
- The doctor gave him morphine for the pain after the operation.
- Morphine can ease pain that nothing else will touch.
