simpleMeaning: a piece of clothing men wear under their clothes to cover the top part of the body, with
  no collar
scope: Also called vest and undershirt, this is clothing men wear under other clothes, not a shirt worn
  on its own.
examples:
- He wore a singlet under his shirt on the cold morning.
- In summer he slept in just a singlet and shorts.
