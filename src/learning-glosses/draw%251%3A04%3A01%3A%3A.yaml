simpleMeaning: A form of poker in which a player may set aside unwanted cards and be given new ones by
  the dealer.
scope: A poker game with card swapping, not the cards themselves dealt from the pack and not the football
  play of the same name.
examples:
- They played draw all evening, trading in their worst cards after each round.
- Draw suits players who like to improve a weak hand.
