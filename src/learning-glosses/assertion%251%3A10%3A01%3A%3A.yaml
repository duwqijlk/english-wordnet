simpleMeaning: the act of saying something firmly, as a true fact
scope: 'Also called statement and affirmation: the act of saying something as true, not the words that
  are said themselves.'
examples:
- His assertion that the plan would work surprised everyone in the room.
- She made a strong assertion about her right to stay.
