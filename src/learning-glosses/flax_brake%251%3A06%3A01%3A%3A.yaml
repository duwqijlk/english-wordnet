simpleMeaning: A machine that takes the woody part of the plant away from its fibres.
scope: A machine that takes the woody part of the plant away from its fibres; not a machine that weaves
  cloth, and not a machine that spins thread.
examples:
- The flax brake stripped the woody stems from the fibres.
- Workers fed the flax into the flax brake.
