senseId: 'industrial_disease%1:26:00::'
synsetId: 14102975-n
simpleMeaning: Sickness or harm usually follows when a person stays long in contact with a harmful stuff
  at work or keeps doing the same acts again and again.
scope: Also called occupational disease, this is sickness or harm that follows from the work a person
  does.
examples:
- The miner's industrial disease came from years of breathing coal dust.
- Her industrial disease was traced to the chemicals she handled at work.
