simpleMeaning: The cord of nerves down the back is ringed by this curved piece of bone, which grows from
  the back of a backbone bone.
scope: Also called a neural arch, this curved bone grows from the back of a backbone bone and rings the
  cord of nerves down the back.
examples:
- The vertebral arch rings the cord of nerves down the back.
- Each vertebral arch grows from the back of a backbone bone.
