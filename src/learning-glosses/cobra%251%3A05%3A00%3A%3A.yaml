simpleMeaning: a poisonous snake from Asia or Africa, of the elapid family of poisonous snakes, that can
  spread out the skin of its neck into a hood
scope: A poisonous snake that spreads its neck into a hood, not any snake and not a snake that crushes
  its prey.
examples:
- The cobra spread its hood and hissed at the keeper.
- A cobra can kill with one bite.
