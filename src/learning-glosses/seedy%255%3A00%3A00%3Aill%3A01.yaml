simpleMeaning: a little sick, or likely to get sick often
scope: Also called unwell, sickly, poorly, peaked, ailing or indisposed; this means a little sick, not
  full of small seeds and not old and dirty in look.
examples:
- He felt a bit seedy, so he stayed home and rested.
- The seedy child often missed school because she was sick again.
