simpleMeaning: A plant of Europe and Asia with spice-scented blooms in pink and purple-red, usually double,
  much grown in scores of kinds and hues.
scope: This sense is also called carnation and gillyflower, a plant of Europe and Asia with spice-scented
  blooms in pink and purple-red, usually double, much grown in scores of kinds and hues, where gillyflower
  is a plant of Europe and of Asia, its flowers spice-scented, pink and purple-red, usually double-petalled,
  grown far and wide in scores of kinds and hues.
examples:
- Clove pinks bloom spice-scented.
- The clove pink is usually double.
