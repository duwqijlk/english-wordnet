simpleMeaning: A right kept safe by the Fourteenth Amendment to the US Constitution and by the fair-process
  part of the Fifth Amendment.
scope: A right kept safe by two parts of the US Constitution, not a law made by one state and not a right
  to the same pay; no other name is listed for this sense.
examples:
- Equal protection of the laws bars the state from treating people in unlike ways for no good reason.
- The court said equal protection of the laws reached the city's new rule.
