simpleMeaning: a liquid made by putting this substance into alcohol, put on wounds to kill germs and stop
  them from growing
scope: 'Also called tincture of iodine: this is the liquid put on wounds, not the plain substance on its
  own.'
examples:
- She put iodine on the small wound to clean it.
- The nurse cleaned the cut with iodine before covering it.
