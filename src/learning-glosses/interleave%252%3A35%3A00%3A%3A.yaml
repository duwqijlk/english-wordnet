simpleMeaning: To guide how a computer disk stores and records data, its parts are spread out across round
  rings of magnetism, one inside another, written on its face.
scope: To spread the parts of a computer disk across its round magnetic rings so it can store and record
  data, not to slip protective covers between the pictures in a book.
examples:
- The drive interleaves the sectors on the disk.
- Interleaving the sectors guides how the disk stores data.
