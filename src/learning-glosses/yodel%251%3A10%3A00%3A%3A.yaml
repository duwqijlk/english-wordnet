simpleMeaning: A cry that sounds like a song, made by moving the voice fast up and down between its normal
  sound and falsetto (a very high voice)
scope: This is the sound itself, a cry or song, not the act of singing in that way.
examples:
- His yodel echoed across the valley.
- She gave a loud yodel from the top of the hill.
