simpleMeaning: Making one dull in mind and body, so one can hardly feel or think.
scope: Making one dull in mind and body, so one can hardly feel or think; not the use for a thing so impressive
  it leaves one stunned.
examples:
- The blow to the head was stupefying, and he could not think straight.
- The heat in the room was stupefying, and they sat still, half asleep.
