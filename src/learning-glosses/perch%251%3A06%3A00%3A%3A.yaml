simpleMeaning: a branch or rod that serves as a resting place, especially for a bird
scope: A branch or rod for resting on, especially for a bird, not a fish and not the act of sitting on
  such a place.
examples:
- The bird flew to its perch on the branch.
- A perch by the window gave the cat a resting place.
