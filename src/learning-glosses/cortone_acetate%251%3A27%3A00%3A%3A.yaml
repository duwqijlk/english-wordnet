senseId: 'cortone_acetate%1:27:00::'
synsetId: 14777131-n
simpleMeaning: A corticosteroid hormone made in the outer layer of the adrenal gland, normally made there
  and changed into hydrocortisone
scope: Among adrenal hormones, this corticosteroid is the one normally made by the adrenal cortex and
  changed into hydrocortisone, and cortisone is another name for it.
examples:
- The patient took Cortone acetate, a hormone made by the adrenal gland.
- Cortone acetate changes into hydrocortisone in the body.
