simpleMeaning: A drug from ergot, less harmful than ergot, that makes the womb squeeze and is given after
  birth or an abortion.
scope: 'Also called ergonovine: a drug from ergot that makes the womb squeeze, not a painkiller and not
  a drug that starts labour.'
examples:
- The nurse gave Ergotrate Maleate after the birth.
- Ergotrate Maleate helps the womb squeeze after delivery.
