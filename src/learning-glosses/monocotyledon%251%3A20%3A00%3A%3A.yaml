simpleMeaning: A flowering plant with one seed leaf, whose stem grows by adding layers on the inside
scope: A flowering plant with one seed leaf, whose stem grows by adding layers on the inside; endogen,
  liliopsid and monocot are other names for this, not a flowering plant with two seed leaves.
examples:
- A lily is a monocotyledon, with one seed leaf.
- The monocotyledon grew from a seed with a single leaf inside.
