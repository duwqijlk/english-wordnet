simpleMeaning: A skin sickness of the head caused by a fungus, marked by bare spots where hair has fallen
  out
scope: A fungus sickness of the head that leaves bare spots, not a cut on the head and not hair loss from
  age.
examples:
- The doctor said the tinea capitis had caused the bald patch.
- He was treated for tinea capitis after bald spots appeared on his scalp.
