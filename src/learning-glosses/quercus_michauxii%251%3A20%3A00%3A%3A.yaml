simpleMeaning: A tree of middling to big size that loses its leaves in winter, of wet ground in the south-east
  of the United States, much like the basket oak
scope: This is a tree of middling to big size, of wet ground in the south-east of the United States, much
  like the basket oak; swamp chestnut oak is another name for this sense, and it is one of the oaks of
  wet ground, close to the pin oak and the water oak.
examples:
- Quercus michauxii grows on wet ground in the south-east of the United States.
- Quercus michauxii is much like the basket oak.
