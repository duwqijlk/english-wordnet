simpleMeaning: A mounted force of soldiers on camels served the Arab, Afghan, Persian, and Indian armies
  in early modern times.
scope: Camel cavalry is another name for this mounted force of soldiers on camels, also called zamboorak,
  zamburak, zumbooruck, and zumbooruk, used by Arab, Afghan, Persian, and Indian armies in early modern
  times.
examples:
- The zamburek held the high ground above the road.
- Messengers reached the zamburek before nightfall.
