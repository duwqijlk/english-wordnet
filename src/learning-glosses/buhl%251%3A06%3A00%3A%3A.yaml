simpleMeaning: a pattern set into furniture, in which tortoiseshell (the shell of a tortoise) and yellow
  and white metal make curling shapes in wooden cabinets
scope: This is a pattern set into furniture, in which tortoiseshell (the shell of a tortoise) and yellow
  and white metal make curling shapes in wooden cabinets; boule and boulle are other names for it, not
  marquetry and not a plain veneer.
examples:
- The buhl on the cabinet caught the light.
- Buhl decorated the front of the old desk.
