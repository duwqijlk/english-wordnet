simpleMeaning: to bend your knees and bow low, in a way that shows you are too ready to serve and please
  another person
scope: This is the act of bending your knees and bowing low to show you are too ready to serve and please.
  It is not the bow as a thing, not a harsh sound, and not a place where skin is torn off.
examples:
- He scraped low, bending his knees and bowing his head.
- They bowed and scraped as the lord passed by.
