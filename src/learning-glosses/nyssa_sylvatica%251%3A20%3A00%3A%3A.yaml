simpleMeaning: A tall straight tree of the east of North America, with flat side limbs and small leaves
  that come out late in spring and turn bright in early fall
scope: Also called black gum, pepperidge and sour gum; a tall straight tree of the east of North America,
  not a low bush and not a tree of the west.
examples:
- Nyssa sylvatica stood tall at the edge of the wood.
- The leaves of Nyssa sylvatica turned bright red in early fall.
