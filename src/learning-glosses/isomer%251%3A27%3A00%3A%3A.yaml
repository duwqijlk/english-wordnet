simpleMeaning: Something made of joined atoms that comes in forms with atoms set out in different ways
  but the same weight for each tiny bit
scope: A joined-atom stuff in forms with different atom patterns but the same weight, not the state of
  being such a stuff and not a stuff with a different weight.
examples:
- Butane and isobutane are isomers of each other.
- The two isomers have the same weight but different shapes.
