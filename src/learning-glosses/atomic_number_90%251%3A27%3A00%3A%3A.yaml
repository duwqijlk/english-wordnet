simpleMeaning: A soft silvery-white metal that joins with four other atoms and gives off rays; kind 232
  of it powers nuclear reactors, and it is found in thorite and monazite sands.
scope: Also called Th and thorium; a soft silvery-white metal that joins with four other atoms and gives
  off rays, distinct from metals that do not give off rays.
examples:
- Atomic number 90 gives off rays and joins with four other atoms.
- Kind 232 of atomic number 90 powers nuclear reactors.
