senseId: 'kyphosis%1:07:01::'
synsetId: 92418486-n
simpleMeaning: The neck or the lower back curves outward more than it should, a wrong bend of the spine.
scope: This is a wrong outward bend of the neck or lower back, not the backward curve of the spine that
  the other sense names.
examples:
- The neck bent too far outward from kyphosis.
- The lower back showed kyphosis and bent too far outward.
