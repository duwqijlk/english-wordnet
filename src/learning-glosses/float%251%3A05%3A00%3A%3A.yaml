simpleMeaning: An air-filled pouch beside the backbone in many fish that helps keep them from sinking.
scope: The air-filled pouch beside the backbone in many fish, also called the swim bladder or air bladder,
  not a thing that stays on the water's surface, a parade platform, or a sweet iced drink.
examples:
- A damaged float left the fish unable to hold its depth.
- Like a built-in balloon, the float keeps the fish from sinking.
