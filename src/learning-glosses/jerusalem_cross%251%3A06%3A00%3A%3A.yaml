simpleMeaning: Two bars of the same length meet to make this shape, and each bar ends with a small bar
  set sideways at its end.
scope: A shape of two bars of the same length that meet, not a plain cross and not a cross with arms of
  different lengths.
examples:
- The Jerusalem cross on the wall had arms of the same length.
- Each arm of the Jerusalem cross ended in a small bar.
