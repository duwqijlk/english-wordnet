scope: A way of using the mind to pull facts together and work out a problem, especially one with just
  one right answer; not open-ended thinking that looks for many answers.
examples:
- Convergent thinking helped her find the one right answer to the puzzle.
- The test called for convergent thinking, not wild guesses.
