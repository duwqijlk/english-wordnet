simpleMeaning: A showy display without grace, made by someone puffed up with pride in themselves.
scope: A showy display without grace; inflation, puffiness and ostentatiousness are other names for this
  sense, not a quiet display and not true pride in good work.
examples:
- His ostentation at the party put everyone off.
- Her ostentation showed in the gold and jewels she wore.
