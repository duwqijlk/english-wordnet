simpleMeaning: A court order that tells officers to take the goods of a person who owes money, so the
  debt can be paid
scope: A court order that tells officers to take the goods of a person who owes money, so the debt can
  be paid; not an order to put a person in prison and not a bill for the debt itself.
examples:
- The fieri facias let officers seize his goods.
- A fieri facias was issued for the unpaid debt.
