senseId: 'subsidize%2:40:00::'
synsetId: 02221492-v
simpleMeaning: to support something by giving it money to help pay its costs
scope: Also called subsidise. This is giving money to help pay the costs of a person, a group or an activity;
  not giving money to a country or an army so that they will help you.
examples:
- The city subsidizes bus travel for older people.
- The government subsidized the arts so theatres could stay open.
