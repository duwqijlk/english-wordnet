simpleMeaning: a way of avoiding pregnancy in which sex is started but the man pulls out on purpose before
  seed is released
scope: A way of avoiding pregnancy in which sex is started but the man pulls out on purpose before seed
  is released; not simply stopping sex, not a formal break with a group, and not the act of taking blood.
examples:
- The couple used withdrawal as their method of birth control.
- He explained withdrawal to the class as a form of birth control.
