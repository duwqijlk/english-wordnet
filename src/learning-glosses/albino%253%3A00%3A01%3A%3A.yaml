simpleMeaning: having a condition called albinism (you are born with it, and it makes skin and hair very
  white and eyes often pink)
scope: Used to describe a person or an animal with this condition, not the noun for a person with it and
  not the noun for an animal with it.
examples:
- The albino rabbit has white fur and pink eyes.
- An albino deer stood out against the dark trees.
