simpleMeaning: a piece of cloth that fits close at the top of a dress, shirt or other clothing
scope: This is the cloth part at the top of clothing, not a wooden frame for carrying buckets and not
  a frame that joins two farm animals at the neck.
examples:
- The dress has a white yoke at the top.
- She sewed a lace yoke onto the shirt.
