senseId: kyphotic%5:00:00:unfit:01
synsetId: 01022592-s
simpleMeaning: Having or showing a back that curves forward too much, a fault in the bones of the back
scope: This describes a back that curves forward too much; humped, humpbacked, hunchbacked, crookback,
  gibbous and crookbacked are other names for this sense, not a straight back.
examples:
- The kyphotic curve of his back made it hard for him to stand straight.
- Her kyphotic back was the result of a fault in the bones of her spine.
