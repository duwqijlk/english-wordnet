simpleMeaning: A person with expert knowledge of the science of growing plants, such as fruit, flowers,
  vegetables, or plants grown for show
scope: This is a person who knows a great deal about growing plants, not a farmer who grows crops for
  food and not a gardener who only tends a small garden.
examples:
- The horticulturist advised us on growing fruit trees.
- A horticulturist planned the new flower beds.
