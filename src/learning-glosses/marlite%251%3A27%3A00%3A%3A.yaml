simpleMeaning: Made of almost the same stuff as marl, this rock has been changed in form
scope: Also called marlstone, this is a rock changed in form with almost the same make-up as marl, not
  a rock of a different make-up and not soft marl itself.
examples:
- The marlite in the quarry looked much like marl.
- Builders cut the marlite into blocks for the wall.
