simpleMeaning: the action of sending something through the air with a quick movement of the arm and wrist.
scope: This is not the distance a machine part can move, and not a light blanket; it is the action of
  sending an object through the air.
examples:
- The child's first throw knocked over the stack of cans.
- Her throw was too short to reach the other bank.
