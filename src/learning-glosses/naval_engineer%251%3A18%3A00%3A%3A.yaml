simpleMeaning: An officer in the navy who keeps a ship's engines working and looks after them
scope: This is an officer in the navy who looks after a ship's engines, with marine engineer as another
  name for this sense, not a soldier on land and not a person who builds ships.
examples:
- The naval engineer kept the engines running through the storm.
- A naval engineer checked the ship's engines before dawn.
