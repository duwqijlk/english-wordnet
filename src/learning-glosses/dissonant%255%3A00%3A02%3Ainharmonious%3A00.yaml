senseId: dissonant%5:00:02:inharmonious:00
synsetId: 01168105-s
simpleMeaning: In music, having notes that do not sound good together and that sound as if they still
  need to move to a settled end
scope: 'In music, also called unresolved: notes that clash and feel unfinished. It is not about sounds
  that fit together in a pleasing way.'
examples:
- The piano and the violin played dissonant notes that hurt our ears.
- The song ends on a dissonant sound, so it feels unfinished.
