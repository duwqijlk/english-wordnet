simpleMeaning: able to reason in a correct way that follows the rules, or showing the power to reason
  in that way
scope: About thinking in a correct way, or showing that kind of thinking; not about parts fitting together
  in a neat order and not just about a person who speaks in a clear, steady way.
examples:
- She has a logical mind and checks each step before she decides.
- His logical way of thinking helped him solve the hard problem.
