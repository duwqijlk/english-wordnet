simpleMeaning: Said of the land of Olympia in Greece, its people, or things to do with them.
scope: Also called Olympian; this word is about Olympia in Greece and its people, not the games of the
  same name.
examples:
- The Olympic plain lies in the region of Olympia in Greece.
- Olympic customs are the customs of the people of Olympia.
