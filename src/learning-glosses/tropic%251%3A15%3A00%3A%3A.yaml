simpleMeaning: one of two lines about 23.5 degrees north or south of the earth's middle line, farthest
  places where the sun can be straight overhead, marking the hot area's edge
scope: One of the two lines described here, not the word for hot and wet weather, and not the word for
  the hot area itself or for things in it.
examples:
- The Tropic of Cancer is a tropic that lies north of the equator.
- The ship crossed the tropic as it sailed far to the south.
