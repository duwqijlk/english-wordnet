simpleMeaning: said of a thing that stands for its opposite
scope: 'Another name for antitypical: it is about a thing that stands for its opposite, not a thing that
  stands for something like it and not a copy of it.'
examples:
- In the poem, the antitypic king stands for the opposite of a good ruler.
- Critics call the dark twin an antitypic double of the hero.
