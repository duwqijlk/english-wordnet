simpleMeaning: Caused by a slow wobble in the spin of the Earth, the two times when day and night are
  equal move slowly westward along the path of the sun
scope: This slow westward move of the two times when day and night are equal along the path of the sun
  comes from a slow wobble in the spin of the Earth.
examples:
- The precession of the equinoxes moves the spring equinox a little each year.
- Over time, the precession of the equinoxes moves the equinoxes westward.
