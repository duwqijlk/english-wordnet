simpleMeaning: A European plant in the bellflower group, with blue-purple to lilac flowers, once used
  to treat a sore throat.
scope: Also called nettle-leaved bellflower and throatwort, this is one European bellflower among other
  bellflowers and other plants with lilac flowers, known for its old use as a remedy for sore throats.
examples:
- The Campanula trachelium in the old garden has blue-purple flowers.
- People once used Campanula trachelium to treat a sore throat.
