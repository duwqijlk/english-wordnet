simpleMeaning: the qualities of a thing, the things that happen with it, and the laws of nature that it
  follows
scope: This sense is about one thing and the laws that act on it, not the whole science of matter and
  energy.
examples:
- The physics of a falling ball is simple to test.
- Engineers must understand the physics of flight before they build a plane.
