simpleMeaning: A pill for an uneven heartbeat, used only when nothing else works, that raises the chance
  of sudden death in people who have had a heart attack
scope: 'Also called flecainide: a pill for an uneven heartbeat used only when nothing else works, set
  apart by its raised chance of sudden death after a heart attack.'
examples:
- The doctor gave him Tambocor only after other drugs had failed.
- Tambocor steadied her uneven heartbeat.
