simpleMeaning: the hottest time of the year, which in the northern half of the world runs from the longest
  day to the start of autumn
scope: The hottest time of the year, which in the northern half of the world runs from the longest day
  to the start of autumn; summer is another name for this sense, not the whole year and not the cold season.
examples:
- They spent a lazy summertime at the shore.
- Summertime brings long days and warm nights.
