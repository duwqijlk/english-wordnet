simpleMeaning: A book that most often comes with a tool or machine and shows, step by step, how to put
  it together and how to make it work
scope: 'Also called instructions, a book of instructions, or an instruction manual: a how-to book for
  a machine, not a plan for spending and not a lens for surgery.'
examples:
- Read the operating instructions before you switch the heater on.
- The operating instructions show how to fit the new blade.
