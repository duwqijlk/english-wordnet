simpleMeaning: To move the body with writhing, bent movements, often while trying to get free.
scope: This describes a body's own writhing movement, not bending an object into a shape or pulling something
  violently; squirm and wriggle are other names.
examples:
- The injured player twisted on the ground in pain.
- She twisted to free herself from his grip.
