simpleMeaning: In hydrostatics, the seeming loss of weight of a thing put into a liquid or a gas is equal
  to the weight of the liquid or gas it pushes aside.
scope: In hydrostatics, this rule tells how much weight any body seems to lose when put into a liquid
  or a gas, also called law of Archimedes.
examples:
- Archimedes' principle explains why the stone felt lighter in water.
- We used Archimedes' principle to find the weight of the water pushed aside.
