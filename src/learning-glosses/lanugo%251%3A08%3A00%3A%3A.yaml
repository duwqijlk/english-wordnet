simpleMeaning: The fine soft hair on an unborn child is most often gone by the ninth month before birth.
scope: Unlike the hair a baby is born with, this fine soft hair on an unborn child is most often gone
  by the ninth month before birth.
examples:
- The lanugo covered the unborn child's skin.
- The lanugo was gone by the time of birth.
