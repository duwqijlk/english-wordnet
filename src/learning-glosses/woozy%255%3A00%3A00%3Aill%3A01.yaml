simpleMeaning: feeling, or making someone feel, as if you or the things round you are turning, and likely
  to fall
scope: Feeling as if all is turning and likely to fall, also called dizzy or giddy, not drunk and not
  merely tired.
examples:
- He felt woozy after the blow to his head.
- The woozy climb up the cliff made her head spin.
