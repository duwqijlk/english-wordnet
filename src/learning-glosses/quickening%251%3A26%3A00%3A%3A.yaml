simpleMeaning: the time in pregnancy when a mother first feels her unborn baby move
scope: The point in pregnancy when a mother first feels her baby move, not a general speeding up of something.
examples:
- At the quickening, she felt a light movement inside her for the first time.
- She wrote down the date of the quickening in her book about the baby.
