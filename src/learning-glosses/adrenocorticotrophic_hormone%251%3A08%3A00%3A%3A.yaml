senseId: 'adrenocorticotrophic_hormone%1:08:00::'
synsetId: 05415456-n
simpleMeaning: Made by the front part of the small gland at the base of the brain, this messenger wakes
  up the outer layer of the gland above the kidney.
scope: This is also called adrenocorticotrophin, adrenocorticotropic hormone, adrenocorticotropin, corticotrophin,
  and corticotropin, and it acts on the gland above the kidney, not on the kidney itself.
examples:
- The doctor measured adrenocorticotrophic hormone in her blood.
- The test found adrenocorticotrophic hormone acting on the gland above the kidney.
