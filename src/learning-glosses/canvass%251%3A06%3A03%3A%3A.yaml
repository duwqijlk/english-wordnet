simpleMeaning: a large piece of cloth, usually canvas cloth, that catches the wind and moves a sailing
  boat forward
scope: 'Also called sail, sheet, and canvas: this is the cloth that catches the wind on a sailing boat,
  not asking people for votes or opinions, and not a heavy cloth in general.'
examples:
- The boat's canvass caught the wind and pushed it forward.
- They raised the canvass before leaving the harbour.
