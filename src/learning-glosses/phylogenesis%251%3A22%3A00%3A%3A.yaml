senseId: 'phylogenesis%1:22:00::'
synsetId: 13498226-n
simpleMeaning: In biology, the series of changes through which a kind of living thing, or a group of kinds,
  has come to be as it is now.
scope: This is the history of how a species or a group of kinds has changed over long ages; evolution,
  organic evolution and phylogeny are other names for this sense, not the growth of one single living
  thing from birth to adult.
examples:
- The phylogenesis of horses took millions of years.
- She studied the phylogenesis of flowering plants.
