simpleMeaning: A tool you can carry, its blade moving back and forth, taking different blades for different
  jobs, most often with a plate that slides on the stuff being cut.
scope: This sense is also called jigsaw and reciprocating saw.
examples:
- The saber saw cut through the board.
- The saber saw cut through the wood.
