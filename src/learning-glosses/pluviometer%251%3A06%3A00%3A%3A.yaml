simpleMeaning: A gauge with an instrument that measures how much water falls from the sky
scope: A gauge with an instrument that measures how much water falls from the sky; rain gage, rain gauge
  and udometer are other names for this sense, and this is not a device that measures wind.
examples:
- The pluviometer measured how much rain had fallen.
- A pluviometer shows the amount of water falling from the sky.
