simpleMeaning: a loose dress of nightwear, made for a woman to wear in bed
scope: 'Also called a gown: a loose dress worn in bed by a woman, not a day dress and not a robe.'
examples:
- She put on her nightgown and got into bed.
- The nightgown was made of soft cotton and reached to her ankles.
