simpleMeaning: Thick spikes of blue flowers grow on a tall upright plant of eastern North America, with
  very many leaves, that lives for years
scope: Also called blue cardinal flower, this is a tall leafy plant of eastern North America with spikes
  of blue flowers, not a low plant with single flowers.
examples:
- The great lobelia stood tall by the stream.
- She planted great lobelia for its dense spikes of blue flowers.
