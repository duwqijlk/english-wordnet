simpleMeaning: that makes a person or thing seem less important or less good than it really is
scope: 'Also called deprecating and slighting: this describes something that makes a person seem less
  important; it is not the noun that names the act or one comment.'
examples:
- His belittling words made his younger sister feel less important.
- She did not like his belittling tone when he talked about her work.
