simpleMeaning: a plant that spreads fast and lives for years in the cool lands of the north, with woolly
  leaves and dull white flowers on a leafy spike
scope: Also called chafeweed, a long-lived plant of cool northern lands with woolly leaves, not a thistle
  and not a daisy.
examples:
- Wood cudweed grows along the path, its woolly leaves easy to spot.
- The wood cudweed's dull white flowers stand in a leafy spike.
