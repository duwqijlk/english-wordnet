simpleMeaning: an insect with no wings, most often flat, that drinks blood and lives on warm-blooded animals
scope: This is a wingless insect that drinks blood, also called louse; not a flea and not a tick.
examples:
- A sucking louse feeds on the blood of warm-blooded animals.
- The sucking louse clung to the dog's skin.
