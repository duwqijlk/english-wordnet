simpleMeaning: a blood clot that forms inside a blood vessel and stays stuck where it first formed
scope: A blood clot that forms in a blood vessel and stays where it first formed, not a clot that has
  broken loose and moved and not the swelling of a vein.
examples:
- A thrombus in his leg blocked the flow of blood.
- The scan showed a thrombus stuck to the wall of the vessel.
