simpleMeaning: a person who steps in with officials to help someone in trouble, usually in secret or dishonest
  ways, or by breaking the law, for pay
scope: This is a person who helps someone in trouble, usually by secret or dishonest ways or by breaking
  the law, for pay; not a worker who mends things, not a drug, and not a chemical.
examples:
- The rich man hired a fixer to make his trouble with the law go away.
- She paid a fixer to speak to the police for her brother.
