simpleMeaning: a person who hides his or her real feelings and reasons for acting by saying he or she
  believes things that are not true for him or her
scope: 'Also called hypocrite, pretender, dissembler, phoney and dissimulator: a person who hides real
  feelings by claiming beliefs he or she does not hold. Not a thing that is fake, and not a person who
  tells only one lie.'
examples:
- 'Everyone saw he was a phony: he praised the plan in public but hated it in private.'
- She called him a phony because he claimed to care about the poor while doing nothing to help them.
