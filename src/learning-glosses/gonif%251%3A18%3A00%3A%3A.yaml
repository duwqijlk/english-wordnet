simpleMeaning: Often used as a general term of abuse, this Yiddish word means a thief, a cheat, or a bad
  person
scope: A Yiddish word for a thief or a cheat, also called ganef, ganof and goniff, not a word for a violent
  robber and not a word for a fool.
examples:
- He called the shopkeeper a gonif after the bill came to twice the price.
- Don't trust that gonif with your money.
