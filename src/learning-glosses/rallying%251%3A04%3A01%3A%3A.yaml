simpleMeaning: the act of finding new strength and making a new effort to go on
scope: 'Another name for rally: finding new strength and trying again, not the adjective sense about calling
  people together to try again.'
examples:
- The rallying of the tired team in the last part of the game won them the match.
- After weeks of loss, the rallying of the town's workers gave everyone hope.
