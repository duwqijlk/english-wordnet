simpleMeaning: a tool that reads how hot or cold a thing is, using power made from heat
scope: A tool that reads heat with power made from heat, not a glass tube with liquid that rises and falls
  and not a tool that reads heat from light.
examples:
- The electric thermometer read 37 degrees in a few seconds.
- She checked the oven with an electric thermometer.
