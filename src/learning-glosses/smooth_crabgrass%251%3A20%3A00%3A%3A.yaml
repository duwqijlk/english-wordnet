simpleMeaning: a low grass weed that lives one summer and spreads by seed and by roots growing from the
  lowest joints of its stems, of the group Digitaria ischaemum
scope: A low summer grass weed, not a tall grass and not a garden weed.
examples:
- Smooth crabgrass spread across the bare patch of lawn.
- He pulled up the smooth crabgrass before it set seed.
