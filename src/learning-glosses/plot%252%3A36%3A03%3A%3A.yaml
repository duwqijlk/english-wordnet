simpleMeaning: to plan the order of events in a story, a play, a film, or a dance show
scope: To plan the events in a story, play, film, or dance show, not to make a drawing that shows how
  things link or are built, and not the drawing that shows movement itself.
examples:
- The writer is plotting a new novel about two brothers.
- She plotted the play carefully before writing it.
