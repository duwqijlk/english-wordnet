simpleMeaning: a large fern of the genus Osmunda with creeping underground stems; its exposed spore cases
  grow on specialized leaves that look like flower clusters.
scope: This is the large Osmunda fern whose spore cases form flower-like clusters; 'flowering fern' is
  another name for it, and the Australasian fern of that name is a different plant.
examples:
- Osmund spreads by creeping underground stems in wet woodland.
- The osmunds in the bog were heavy with spore clusters.
