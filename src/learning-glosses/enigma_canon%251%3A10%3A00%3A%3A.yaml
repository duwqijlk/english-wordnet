simpleMeaning: A canon in which the starts of back-to-back parts were shown by dark signs and tricks,
  in vogue in the 1400s and 1500s.
scope: This sense is also called enigmatic canon, enigmatical canon, and riddle canon, a canon in which
  the starts of back-to-back parts were shown by dark signs and tricks, in vogue in the 1400s and 1500s.
examples:
- Enigma canons show starts by dark signs.
- The enigma canon was in vogue in the 1400s.
