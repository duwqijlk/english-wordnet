simpleMeaning: A group of Gram-negative tiny living things (bacteria) that need air and can make animals,
  including people, sick; they live as germs and as parasites in many animals.
scope: Also called Francisella; this is a group name for air-needing germs that cause sickness in many
  animals, including people.
examples:
- The genus Francisella includes germs that can make animals sick.
- Scientists studied the genus Francisella in the laboratory.
