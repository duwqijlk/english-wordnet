simpleMeaning: The 1962-1965 meeting of the Roman Catholic Church that gave up the Latin service used
  everywhere, accepted the search for Christian unity, and made other changes
scope: This is the 1962-1965 meeting of the Roman Catholic Church; Vatican II is another name for it,
  and its nearest neighbours are the other great meetings of the Roman Catholic Church.
examples:
- The Second Vatican Council changed the Latin service in 1965.
- Many churches still follow the reforms of the Second Vatican Council.
