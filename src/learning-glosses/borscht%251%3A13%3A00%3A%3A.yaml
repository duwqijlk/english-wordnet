simpleMeaning: a soup from Russia or Poland, usually made with beet juice as its main part
scope: This soup, also called borsch, borsh, borshch, borsht and bortsch, is the Russian or Polish soup
  usually made with beet juice, not a plain soup with no beet base.
examples:
- She served hot borscht with sour cream.
- He ate a bowl of borscht for lunch.
