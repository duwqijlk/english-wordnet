simpleMeaning: In physics, based on old ideas from before the new theories about how space and time bend
  and how the smallest bits of matter act
scope: In physics, ideas from before the new theories of motion and tiny matter, not the art of old Greece
  and Rome and not the old high music of Europe.
examples:
- Classical physics cannot explain how the smallest bits act.
- In classical mechanics, time moves the same for all.
