simpleMeaning: The community of people of the faith of Islam, thought of as reaching from Mauritania to
  Pakistan.
scope: Also called Umma, Islam Nation, Islamic Ummah and Ummah; the community of people of the faith of
  Islam, thought of as reaching from Mauritania to Pakistan, not the Muslims of one country and not the
  faith itself.
examples:
- Moderate Muslims urge the Muslim Ummah to reject terrorism.
- The Muslim Ummah stretches from Mauritania to Pakistan.
