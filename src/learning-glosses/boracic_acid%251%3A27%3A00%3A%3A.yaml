simpleMeaning: one of several sour substances that hold boron, a natural chemical found in rocks, and
  oxygen, the gas in air that living things need to breathe
scope: 'Also called boric acid: one of several sour substances that hold boron and oxygen, not a single
  fixed acid and not a salt made from such an acid.'
examples:
- The boracic acid in the bottle must be kept away from children.
- He added a little boracic acid to the mixture.
