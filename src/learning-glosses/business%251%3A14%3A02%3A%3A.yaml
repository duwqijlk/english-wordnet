simpleMeaning: Commercial enterprises considered together as a group.
scope: This is commercial enterprises as a whole, not one company, commercial activity in general, a person's
  occupation, customers, or a matter of rightful concern.
examples:
- Government and business could not agree on the new rules.
- Labor and business are both represented on the council.
