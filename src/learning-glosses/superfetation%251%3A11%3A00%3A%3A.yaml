simpleMeaning: Fertilization of a second ovum after a pregnancy has begun, giving two fetuses of different
  ages in the uterus at the same time
scope: Twins are two babies begun at the same time, but here a second egg is joined after a baby has already
  begun to grow, so the two unborn babies are of different ages.
examples:
- The womb held two unborn babies of different ages after superfetation.
- Two babies of different ages can grow in the womb after superfetation.
