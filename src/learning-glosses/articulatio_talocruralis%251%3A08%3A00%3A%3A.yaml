simpleMeaning: The top bone of the foot sits under the ends of the two leg bones, and the three bones
  glide on one another where leg and foot meet.
scope: The ankle, the ankle joint, and the mortise joint are other names for this gliding joint at the
  top of the foot.
examples:
- The articulatio talocruralis lets the foot move on the lower leg.
- A twist of the articulatio talocruralis made walking hard.
