simpleMeaning: to set out an idea or a theory in fuller detail
scope: To work out an idea or theory in fuller detail; develop is another name for this sense, and it
  is not making something by following a set of amounts and steps.
examples:
- She worked hard to formulate her theory of the tides.
- The scientist formulated his ideas in a long paper.
