simpleMeaning: a light, creamy dish made from fish or meat and made firm with gelatin (a clear thing that
  makes liquids set firm)
scope: A light dish of fish or meat made firm in this way, not the sweet, soft cream dish eaten after
  a meal and not the foam put on hair.
examples:
- For lunch we had a salmon mousse with bread.
- The cook served a chicken mousse that was light and soft.
