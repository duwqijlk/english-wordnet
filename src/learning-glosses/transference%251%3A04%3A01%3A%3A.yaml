simpleMeaning: The act of changing a thing from one form into another.
scope: Also called transfer; a change of form, not feelings passed on in psychoanalysis and not a change
  of owner.
examples:
- The transference of the old films to video took all summer.
- Transference of the story from book to stage changed its ending.
