simpleMeaning: Bunches of bright red blooms cover this woody plant, which grows in south Australia.
scope: Bunches of bright red blooms cover this woody plant, which grows in south Australia; flame durrajong
  is another name for this sense, not the thorny shrub with yellow blooms, and not the western Australian
  shrub with yellow-orange blooms that feeds on grass roots.
examples:
- The flame tree was covered in red blooms.
- A flame tree grew in the garden in Adelaide.
