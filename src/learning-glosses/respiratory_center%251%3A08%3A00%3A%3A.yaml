simpleMeaning: The brain region in the medulla oblongata and pons that merges sensory signals about blood
  oxygen and carbon dioxide levels and decides which messages go to the breathing muscles.
scope: The control area inside the brain stem, not the breathing muscles it signals or the whole medulla.
examples:
- The respiratory center merges sensory signals about the level of oxygen and carbon dioxide in the blood.
- The respiratory center decides which messages are sent to the breathing muscles.
