simpleMeaning: A layer of ore or coal that is thick enough to be dug out at a profit.
scope: Not just any layer of rock, and not a place for sleeping.
examples:
- The company sank a shaft to reach the coal bed beneath the valley.
- Geologists mapped a rich bed of iron ore running under the hills.
