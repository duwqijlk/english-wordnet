simpleMeaning: False teeth and other made parts take the place of teeth and nearby mouth and jaw parts
  in this part of tooth care.
scope: 'Also called prosthodontics: the part of tooth care that puts in false teeth and other made parts
  to take the place of lost teeth and nearby mouth and jaw parts.'
examples:
- She studied prosthodontia to learn how to fit false teeth.
- Prosthodontia deals with made parts that take the place of lost teeth.
