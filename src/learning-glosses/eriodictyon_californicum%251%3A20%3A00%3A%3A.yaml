simpleMeaning: A sticky shrub of the American west that keeps its leaves, with white to deep lilac flowers;
  its sticky scented leaves are used to treat chest and lung sickness.
scope: Also called yerba santa; a sticky shrub of the American west that keeps its leaves, with white
  to deep lilac flowers, whose sticky scented leaves treat chest and lung sickness, kin to other shrubs
  used for chest sickness.
examples:
- Eriodictyon californicum grows in the western hills, its white flowers open in spring.
- People use the leaves of Eriodictyon californicum to treat bronchial illness.
