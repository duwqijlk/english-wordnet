simpleMeaning: A soft rotted spot in a tooth that keeps getting worse and can kill the tooth.
scope: A soft rotted spot in a tooth that keeps getting worse and can kill the tooth; cavity and dental
  caries are other names for this sense, not a chipped tooth and not gum disease.
examples:
- The dentist found caries in her back tooth.
- Caries had rotted a soft spot in the tooth.
