simpleMeaning: the heat lost when one abampere crosses a drop of one abvolt, one ten-millionth of the
  usual unit of power
scope: This is a unit of power, the heat lost when one abampere crosses a drop of one abvolt; it is not
  a measure of the current or of the voltage on their own.
examples:
- The lab meter read the loss in abwatts.
- One abwatt is far too small to light a bulb.
