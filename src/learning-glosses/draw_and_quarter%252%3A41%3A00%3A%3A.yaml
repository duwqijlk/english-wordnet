simpleMeaning: an old way of killing a person, with a horse tied to each arm and leg and the horses pulling
  in different ways until the body comes apart
scope: 'Also called quarter and draw: an old way of killing a person by pulling the body apart with horses,
  not a way of cutting meat and not a punishment of our time.'
examples:
- The rebels were drawn and quartered for treason.
- He was drawn and quartered after the court found him guilty of treason.
