simpleMeaning: A big strong plant with white flowers that comes back year after year and grows wild in
  shallow fresh water in Europe.
scope: Also called greater water parsnip, this plant grows wild in shallow fresh water in Europe, a different
  kind from the water parsnip of the northern United States and Asia.
examples:
- Sium latifolium grows in the shallow water at the edge of the pond.
- The white flowers of Sium latifolium stood above the still water.
