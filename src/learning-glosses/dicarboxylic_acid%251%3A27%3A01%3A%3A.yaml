simpleMeaning: A carbon-based chemical with two matching groups, each made of one carbon, two oxygens,
  and one hydrogen
scope: A carbon chemical with two matching COOH groups, not a chemical with one such group and not a plain
  acid.
examples:
- Adipic acid is the dicarboxylic acid used most in making nylon.
- The dicarboxylic acid in the mix has two carboxyl groups.
