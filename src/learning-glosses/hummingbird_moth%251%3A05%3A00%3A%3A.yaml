simpleMeaning: Any of a group of flying insects with long thin front wings, able to fly fast and stay
  still in the air above flowers while feeding
scope: This is a flying insect with long thin front wings that can stay still in the air above flowers
  while feeding; hawk moth, hawkmoth, sphingid and sphinx moth are other names for this sense, not a butterfly
  and not a bee.
examples:
- A hummingbird moth hovered over the flowers at dusk.
- The hummingbird moth beat its wings fast as it fed.
