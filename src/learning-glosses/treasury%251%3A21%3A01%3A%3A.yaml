simpleMeaning: Papers of debt that can be bought and sold, sold by the United States government, which
  vows to pay the money owed and the gain on it in good time.
scope: Also called Treasury obligations; not the government part that takes in money.
examples:
- Treasury bonds are safe places to put money.
- He bought Treasury notes for his old age.
