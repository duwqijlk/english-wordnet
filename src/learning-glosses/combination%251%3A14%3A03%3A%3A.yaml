simpleMeaning: a group of people, companies, or countries working together for a special aim, once to
  act against society but now for political or money aims
scope: This is a group of people, companies, or countries working together for an aim. It is not the numbers
  or letters that open a lock, and not a set of chess moves.
examples:
- The two parties formed a combination to win more power.
- Several small companies joined in a combination to sell their goods in other countries.
