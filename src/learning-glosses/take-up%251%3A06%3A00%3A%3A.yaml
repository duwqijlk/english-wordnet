senseId: 'take-up%1:06:00::'
synsetId: 04393543-n
simpleMeaning: One of many kinds of part on a machine, such as a sewing machine or a loom, that pulls
  in loose thread or cloth so it stays tight.
scope: This is a device for easing slack or gathering in motion, not a spool and not a reel.
examples:
- The take-up wound the film onto a spool.
- A take-up on the loom gathered in the loose thread.
