synsetId: 14164720-n
simpleMeaning: A sudden illness brought on by rickettsia bacteria, spread when an infected flea bites
  a person, and marked by fever, chills, aching muscles and a rash.
scope: One of four interchangeable names for this flea-borne illness, alongside endemic, murine and rat
  typhus; it is not the louse-borne form or the mite-borne scrub form.
examples:
- Urban typhus appears in cities where rats and their fleas live close to people.
- Doctors treated him for urban typhus after he came in with chills and a rash.
