simpleMeaning: Any of several Australian trees of the Casuarina group that give heavy hard red timber
  used to make furniture
scope: Any of several Australian trees of the Casuarina group giving heavy hard red timber for furniture,
  not the tropical hardwood tree of the same name and not the timber on its own.
examples:
- The beefwood grows in Australia.
- We planted a beefwood in the garden.
