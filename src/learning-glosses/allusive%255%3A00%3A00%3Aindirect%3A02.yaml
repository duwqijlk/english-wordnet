simpleMeaning: that points to something in a way that is not direct, by hinting at it rather than naming
  it plainly
scope: About speech or writing that hints at something without naming it plainly; not a direct, clear
  statement that names the thing itself.
examples:
- His speech was allusive, hinting at old stories without naming them.
- She wrote in an allusive way, so readers had to work out what she meant.
