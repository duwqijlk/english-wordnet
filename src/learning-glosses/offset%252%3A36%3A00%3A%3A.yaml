simpleMeaning: To print by a method in which ink moves from a plate to a rubber sheet and then onto paper
scope: To print by the ink-from-plate method, not to print in the ordinary way and not to make a step
  in a wall.
examples:
- The printer offset the conference papers for the meeting.
- They offset the book in a run of two thousand copies.
