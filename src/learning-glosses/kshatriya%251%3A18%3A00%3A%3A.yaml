simpleMeaning: This person is one of a Hindu group in society, made up of kings or fighters.
scope: A member of the Hindu group in society for kings or fighters, not a member of the group for priests
  or traders.
examples:
- The Kshatriya served as a warrior in the king's army.
- A Kshatriya belonged to the caste of kings and fighters.
