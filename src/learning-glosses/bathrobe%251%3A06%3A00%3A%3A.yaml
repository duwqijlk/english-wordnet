simpleMeaning: A loose robe of thick, soft, water-absorbing cloth, worn after a bath or a swim
scope: A loose robe worn after a bath or a swim, not a coat for going out and not a nightdress worn in
  bed.
examples:
- She put on her bathrobe after her swim.
- He wrapped himself in a bathrobe and sat down to read.
