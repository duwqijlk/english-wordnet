scope: Also called meclizine hydrochloride, this is a drug for travel sickness, not a drug for pain and
  not a drug for sleep.
examples:
- The doctor gave her meclizine before the boat trip to stop motion sickness.
- He took meclizine so the long car journey would not make him sick.
