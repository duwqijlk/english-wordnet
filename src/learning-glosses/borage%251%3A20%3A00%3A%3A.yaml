simpleMeaning: A hairy blue-flowered European herb of one season, long used in herbal medicine and eaten
  raw as salad greens or cooked like spinach.
scope: This sense is also called tailwort, for a hairy blue-flowered European herb of one season, unlike
  the sense for an herb whose leaves are used to flavor sauces and punches, with young leaves that can
  be eaten in salads or cooked.
examples:
- Borage has blue flowers.
- They ate borage raw in salads.
