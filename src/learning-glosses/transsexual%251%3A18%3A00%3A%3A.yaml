simpleMeaning: A person whose inner sense of being male or female lies wholly with the opposite sex.
scope: A person whose sense of self is with the opposite sex, not the adjective use for someone who identifies
  with the opposite gender from the one they were born with.
examples:
- The transsexual speaker said they had always felt they belonged to the opposite sex.
- A transsexual person may seek medical help to live as the sex they feel they are.
