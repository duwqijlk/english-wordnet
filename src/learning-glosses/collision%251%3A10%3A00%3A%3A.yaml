simpleMeaning: a clash between people whose ideas, views, or aims pull in opposite ways
scope: A clash of opposed ideas, views, or aims, not a crash between moving things and not a fight with
  fists.
examples:
- There was a collision of interests over the new road.
- The collision between their plans made agreement hard.
