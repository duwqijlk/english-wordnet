simpleMeaning: Between your teeth you hold a small lyre-shaped instrument and pluck its wire tongue; the
  hollow of your mouth shapes the sound.
scope: 'Also called jew''s harp and jews'' harp: a small lyre-shaped instrument held between your teeth
  and played by plucking a wire tongue, the sound changing with the shape of the hollow of your mouth.'
examples:
- He played a mouth bow between his teeth at the fair.
- The mouth bow twanged as she changed the shape of her mouth.
