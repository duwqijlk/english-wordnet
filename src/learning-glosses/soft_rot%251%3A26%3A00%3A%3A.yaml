simpleMeaning: a mushy or slimy decay of plants, caused by tiny germs or fungi
scope: A wet decay of plants caused by germs or fungi, not a dry decay and not a decay of wood.
examples:
- The soft rot turned the potatoes to mush in the damp store.
- Soft rot spread through the wet leaves after the rain.
