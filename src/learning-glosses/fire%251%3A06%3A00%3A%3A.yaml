simpleMeaning: The opening built into a wall at the base of a chimney, where a small fire is kept burning.
scope: This is not the fire on its own, a large uncontrolled burning or the ancient element; it is the
  built opening together with the small fire inside it.
examples:
- We pulled our chairs up to the fire and watched the logs settle into embers.
- A small fire was burning in the grate when we came in from the snow.
