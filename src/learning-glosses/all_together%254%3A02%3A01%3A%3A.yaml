senseId: 'all_together%4:02:01::'
synsetId: 00064312-r
simpleMeaning: said of a group whose members did a thing, or had a thing done to them, as one group, where
  other words can come between the two words
scope: A way of saying a group did a thing, or had a thing done to them, as one group, not altogether,
  which means fully or completely.
examples:
- They were herded all together into the yard.
- The books lay all together in a heap.
