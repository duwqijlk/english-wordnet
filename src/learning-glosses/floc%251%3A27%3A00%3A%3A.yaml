simpleMeaning: A small soft clump of fine bits that hangs in a liquid or sinks out of it.
scope: This is a small soft clump in a liquid, not a solid lump or a clear liquid, and it is also called
  a floccule.
examples:
- A floc formed in the water.
- The floc sank to the bottom of the jar.
