simpleMeaning: A sharp hurt in a muscle or in the tough bands that join bones, caused by pulling it too
  hard
scope: 'Also called pull and twist: a sharp hurt in a muscle or in the bands that join bones, not the
  hand tool and not the act of twisting something off.'
examples:
- The wrench to his knee occurred as he fell.
- He felt a wrench in his back when he lifted the box.
