simpleMeaning: In old pharmacy, a small weight equal to one eighth of an ounce, or 60 grains.
scope: In old pharmacy, a small weight; drachma and dram are other names for this sense, not a measure
  of liquid and not a modern weight.
examples:
- The recipe called for one drachm of the powder.
- A drachm weighs an eighth of an ounce.
