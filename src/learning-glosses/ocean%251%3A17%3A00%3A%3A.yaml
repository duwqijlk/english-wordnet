simpleMeaning: one of the great bodies of salt water that together form the main part of Earth's water.
scope: This is not a smaller body of water such as a sea, lake, or river, and not a figurative huge amount
  of something.
examples:
- They sailed across the ocean for three weeks.
- Plastic waste is collecting in the ocean.
