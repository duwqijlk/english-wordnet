simpleMeaning: A large canvas tent that shelters the audience at a circus.
scope: This is not a garment for the upper body, not the highest part of something and not a spinning
  toy; it is the tent that covers a circus audience.
examples:
- The circus raised its big top on the edge of town.
- Rain drummed on the canvas top while the clowns performed.
