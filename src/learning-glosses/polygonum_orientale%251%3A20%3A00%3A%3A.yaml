simpleMeaning: A one-year plant with broad oval leaves and slender drooping spikes of crimson flowers,
  from southeastern Asia and Australia and now wild in North America.
scope: Also called kiss-me-over-the-garden-gate, prince's-feather, prince's-plume, and princess feather;
  not a shrub and not a plant with white flowers.
examples:
- The Polygonum orientale bloomed crimson in the summer garden.
- Polygonum orientale now grows wild along the riverbank.
