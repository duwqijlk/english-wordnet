simpleMeaning: To grow crops or breed animals on a farm, often improving them by careful farming methods.
scope: To grow plants or breed animals for use or sale; it is not bringing up a child, not lifting something
  to a higher place, and not making an amount larger.
examples:
- They raise sheep on the hills above the village.
- My grandparents raised corn and beans in the same field for decades.
