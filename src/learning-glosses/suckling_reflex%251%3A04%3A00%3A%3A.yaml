simpleMeaning: 'A newborn mammal does this without being taught: it finds the nipple, takes it in its
  mouth, sucks, and swallows the milk.'
scope: 'Among the things a newborn mammal does, this one needs no teaching: it finds the nipple and drinks
  the milk.'
examples:
- A strong suckling reflex helps the newborn calf find the nipple.
- A weak suckling reflex can make feeding hard for a newborn lamb.
