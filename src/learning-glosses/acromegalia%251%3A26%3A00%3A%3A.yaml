simpleMeaning: Enlarged bones in the hands, feet and face, often with headaches, muscle pain and mood
  changes, caused by a pituitary tumour producing excess growth hormone.
scope: This is the condition of bony overgrowth in the hands, feet and face that appears in adults, not
  gigantism, the similar overgrowth that starts in childhood, and not simple swelling of the soft tissues.
  It is a medical term. 'Acromegaly' is the usual English spelling of the same disorder.
examples:
- Acromegalia is often missed for years because the changes come on slowly.
- The endocrinologist suspected acromegalia when the patient's ring no longer fitted.
