simpleMeaning: to get money from a business deal, or to get money as pay for work you do
scope: 'Also called make, clear, realize, gain, and realise: this sense is about money from work or a
  business deal, not about getting or deserving a prize, a name, or respect through what you do.'
examples:
- She earns a good wage in her new job.
- The shop earned a lot of money from the sale.
