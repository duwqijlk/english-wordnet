simpleMeaning: A bulb herb that flowers in autumn, with white, purple or lavender-and-white flowers; at
  home in west and middle Europe.
scope: Also called autumn crocus, meadow saffron and naked lady, this is a bulb herb that flowers in autumn,
  not the spring crocus of the same gardens.
examples:
- The Colchicum autumnale flowers in autumn.
- Colchicum autumnale blooms white and purple.
