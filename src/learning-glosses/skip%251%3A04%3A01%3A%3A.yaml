simpleMeaning: a way of moving in which a person takes a step, then a small jump, then a step, then a
  small jump
scope: A way of moving with steps and small jumps one after the other; it is not the verb sense of choosing
  not to go to something you should go to.
examples:
- The children moved down the path with a happy skip.
- Her skip, a step and a hop over and over, took her quickly to the gate.
