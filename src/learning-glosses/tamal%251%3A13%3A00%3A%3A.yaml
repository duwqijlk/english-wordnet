simpleMeaning: a food made of dough around a mix of meat, cooked in steam, sometimes with the outer leaves
  of corn wrapped around it
scope: This food is also called tamale. It is a filled food cooked in steam, not plain dough and not meat
  served on its own.
examples:
- For lunch, she ate a hot tamal filled with pork.
- We bought two tamals wrapped in corn leaves.
