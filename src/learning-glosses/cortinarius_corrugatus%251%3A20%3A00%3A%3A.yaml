senseId: 'cortinarius_corrugatus%1:20:00::'
synsetId: 13095780-n
simpleMeaning: A fungus with a sticky wrinkled tawny cap and a stalk whose base bulb shrinks as it grows;
  its gills are dark violet at first but soon turn brown.
scope: A fungus, not a plant, and not other brown-capped fungi.
examples:
- Cortinarius corrugatus grew in the damp wood.
- The cap of Cortinarius corrugatus was tawny and wrinkled.
