simpleMeaning: A West Indian evergreen shrub with clusters of funnel-shaped yellow-white flowers that
  smell sweet by night.
scope: 'Also called night jasmine and night jessamine: a West Indian evergreen shrub whose yellow-white
  flowers smell sweet by night, unlike its close kin whose white flowers smell sweet by day.'
examples:
- Cestrum nocturnum grows in the West Indies.
- The yellow-white flowers of Cestrum nocturnum smell sweet by night.
