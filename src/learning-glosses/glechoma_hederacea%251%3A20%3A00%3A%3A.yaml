simpleMeaning: A creeping sweet-smelling mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets; now wild in North America, sometimes put in the genus Nepeta.
scope: A creeping mint-family plant, also called alehoof, field balm, gill-over-the-ground, ground ivy,
  runaway robin, Glechoma hederaceae, Nepeta hederacea, and Nepeta hederaceae; not a true ivy.
examples:
- Glechoma hederacea crept over the edge of the hanging basket.
- The Glechoma hederacea in the yard smells sweet when crushed.
