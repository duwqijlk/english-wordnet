simpleMeaning: like a flea, a creature that stays on the outside of another living thing and feeds on
  it
scope: 'Also called ectoparasite, ectozoon, epizoan and epizoon: like a flea, a creature that stays on
  the outside of another living thing and feeds on it, not one that lives inside the body and not a creature
  that lives on its own.'
examples:
- Ticks are ectozoans that feed on the blood of deer.
- The ectozoan clung to the outside of the fish.
