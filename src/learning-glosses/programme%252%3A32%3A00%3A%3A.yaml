simpleMeaning: to plan and set the order of events or items for something
scope: 'Also called program: this is planning the order of events for something, not a printed list for
  a play or sports event, not a set of instructions for a computer, and not writing computer code.'
examples:
- She programmes the concerts for the town hall each spring.
- They programme a full day of talks for the school each term.
