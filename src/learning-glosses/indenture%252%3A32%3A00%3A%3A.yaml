simpleMeaning: to bind a person by a formal paper, or in a like way, so they must work for someone, like
  a young person learning a trade or a servant
scope: 'Also called indent: this sense means binding a worker by agreement, not the paper agreement about
  bonds and not the space at the start of a line.'
examples:
- The master indentured the boy for seven years of training.
- In the past, poor children were indentured as servants.
