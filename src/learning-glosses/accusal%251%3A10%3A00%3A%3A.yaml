simpleMeaning: A formal charge that a person did something wrong, and the act of saying that person is
  to blame.
scope: Accusation is another name for this sense, not a casual complaint and not a court verdict.
examples:
- His accusal of theft shocked the village.
- The accusal named her as the thief.
