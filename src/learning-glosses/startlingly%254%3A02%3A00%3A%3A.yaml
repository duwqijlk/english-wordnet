simpleMeaning: in a way that surprises or shocks people a lot
scope: 'This says how something is or is done: in a way that surprises or shocks a lot. It is not just
  new or different, and not just very good or very bad on its own.'
examples:
- The new song was startlingly loud.
- She gave a startlingly honest answer.
