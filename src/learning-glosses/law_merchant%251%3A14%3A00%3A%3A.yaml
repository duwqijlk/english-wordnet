simpleMeaning: The set of rules used in trade, grown from the ways traders work rather than from the study
  of rules.
scope: The set of rules used in trade, grown from the ways traders work rather than from the study of
  rules; commercial law and mercantile law are other names for this sense, not the rules for crimes, and
  not the rules for family matters.
examples:
- Law merchant governed the deal between the two traders.
- Under law merchant, the trader's word carried weight.
