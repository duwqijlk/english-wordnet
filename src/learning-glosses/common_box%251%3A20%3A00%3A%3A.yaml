simpleMeaning: Hedges, edges, and shapes cut from plants come from a big slow-growing shrub or small tree
  with many stems that keeps its leaves all year.
scope: This is a big slow-growing shrub or small tree with many stems, grown a great deal for hedges,
  edges, and shapes cut from plants, and it keeps its leaves all year.
examples:
- The common box was cut into the shape of a ball.
- She planted common box for a hedge.
