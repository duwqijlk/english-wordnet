simpleMeaning: A sudden loud push of air from the lungs that clears the breathing tubes, a common sign
  of upper-airway infection, bronchitis, pneumonia or tuberculosis.
scope: The sudden burst of air that clears the airways; not the verb for forcing air out, and not the
  illness that causes it.
examples:
- A dry cough kept her awake most of the night.
- The doctor listened to his cough and ordered a chest X-ray.
