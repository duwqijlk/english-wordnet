simpleMeaning: Tough bendy branches, bark that bends easily, and small yellow flowers mark this shrub
  of the east of North America that loses its leaves in winter.
scope: Also called leatherwood, moose-wood, moosewood, and ropebark, this shrub of the east of North America
  loses its leaves in winter and bears tough bendy branches, bark that bends easily, and small yellow
  flowers.
examples:
- Wicopy grew in the east of North America.
- Wicopy bore small yellow flowers.
