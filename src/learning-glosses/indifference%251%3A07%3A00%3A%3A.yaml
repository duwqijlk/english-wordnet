simpleMeaning: A way of being in which a person shows little keenness for or care about things in general
scope: 'Also called numbness: showing little keenness for things in general, not staying calm while seeming
  not to care, not a lack of all feeling, and not a fair lack of care.'
examples:
- His indifference to music was plain to all.
- She showed indifference to every game they played.
