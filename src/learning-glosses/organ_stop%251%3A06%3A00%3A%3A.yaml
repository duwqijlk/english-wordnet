simpleMeaning: A set of air tubes of the same kind of sound, set out in steps from low to high
scope: A set of air tubes of one kind of sound in steps from low to high; not a single air tube and not
  the knobs that pick the sound.
examples:
- He pulled an organ stop to add a soft reed voice.
- The organ stop gave the hymn a deeper sound.
