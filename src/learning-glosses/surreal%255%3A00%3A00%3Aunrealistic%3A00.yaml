simpleMeaning: Full of strange pictures, like things from a dream, put together in ways that do not fit.
scope: Full of strange pictures, like things from a dream, put together in ways that do not fit; not simply
  strange, and not unreal in the sense of not existing.
examples:
- The surreal art showed clocks melting over trees.
- It was a surreal scene, with shadows that did not match their shapes.
