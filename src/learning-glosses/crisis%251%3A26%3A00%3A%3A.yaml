simpleMeaning: a time when a situation is not steady and holds great danger or trouble
scope: A shaky time of great danger or trouble, not a single bad event and not a turning point in a life.
examples:
- They went bankrupt during the economic crisis.
- The hospital faced a crisis when the power failed.
