senseId: 'harmonic_progression%1:14:00::'
synsetId: 08478435-n
simpleMeaning: In mathematics, a list of numbers whose one-divided-by values form a list with equal steps
  between them
scope: In mathematics, a list of numbers whose one-divided-by values form a list with equal steps between
  them, not a list with equal steps itself and not a list with equal ratios.
examples:
- The fractions 1, 1/2, 1/3 form a harmonic progression.
- A harmonic progression comes from an arithmetic progression of reciprocals.
