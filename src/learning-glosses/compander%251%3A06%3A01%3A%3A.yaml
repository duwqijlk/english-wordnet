simpleMeaning: A system that narrows a signal's loudness range before sending or recording it, then widens
  it back at the receiving or playback unit, so the signal stands out above noise.
scope: A two-stage signal system that both squeezes and restores the range; not a simple compressor, which
  only squeezes it.
examples:
- Engineers fitted a compander to the wireless link to cut background hiss.
- A compander makes the quiet parts of a recording stand out more clearly.
