simpleMeaning: The belief that people can know God by thinking, without help from holy writings or a message
  from God.
scope: The belief that people can know God by thinking alone, not knowledge of God from holy writings
  or a message from above.
examples:
- In natural theology, he argued that reason alone can show that God exists.
- She studied natural theology to see what reason can say about God.
