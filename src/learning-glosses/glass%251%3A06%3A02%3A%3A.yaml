simpleMeaning: a mirror, usually the kind a woman uses while dressing
scope: This is a looking surface that shows your reflection; it is not the hard material itself, not a
  cup you drink from, and not a group of cups and dishes.
examples:
- She checked her hair in the glass before opening the door.
- An old glass hung above the washstand in the spare room.
