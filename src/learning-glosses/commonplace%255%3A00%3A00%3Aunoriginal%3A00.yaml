senseId: commonplace%5:00:00:unoriginal:00
synsetId: 01693210-s
simpleMeaning: Used so many times that it feels too well known and has lost any fresh feel.
scope: This is about words or ideas worn out by too much use; tired, stock and threadbare are other names
  for this sense, not dull in itself or the noun for a stale remark.
examples:
- His remarks were trite and commonplace, and nobody listened.
- The commonplace phrase 'think outside the box' no longer surprises anyone.
