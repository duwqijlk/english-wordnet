simpleMeaning: heat is taken in while a chemical change happens or a substance is made
scope: 'Also called endothermal and heat-absorbing: in chemistry, heat is taken in while a change happens
  or a substance is made, not heat given out and not a change that needs no heat.'
examples:
- The endothermic change drew heat from the air around it.
- This endothermic compound can form only if heat is supplied.
