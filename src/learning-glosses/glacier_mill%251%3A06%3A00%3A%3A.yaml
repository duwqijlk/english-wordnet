simpleMeaning: A steep hole through which water on top of the ice runs down into the ice, boring to the
  rock below or to the depth where cracks often form.
scope: Also called moulin, this is a hole through which water on top of the ice runs down into the ice,
  not a mill that grinds grain.
examples:
- The glacier mill swallowed the stream where it met the ice.
- Water roared down the glacier mill to the rock below.
