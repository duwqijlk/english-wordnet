simpleMeaning: about one of the small sacs in a gland made of many parts
scope: This is about one of the small sacs in a gland made of many parts, also called acinar, acinose
  and acinous; it is not a whole gland, and not a small part of a fruit.
examples:
- The acinic tissue forms the walls of the small sacs in the gland.
- The acinic cells line the tiny sacs of the gland.
