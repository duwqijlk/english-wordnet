simpleMeaning: an early animal thought to be in the shared line of descent of dinosaurs, crocodiles and
  birds
scope: 'Another name for a thecodont: an early animal in the shared line that gave rise to dinosaurs,
  crocodiles and birds, not a dinosaur, crocodile or bird itself.'
examples:
- The thecodont reptile may have been an ancestor of the first birds.
- Fossils of the thecodont reptile show links to both dinosaurs and crocodiles.
