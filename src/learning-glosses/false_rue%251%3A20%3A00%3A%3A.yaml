simpleMeaning: A thin, upright plant that lives several years and grows in eastern North America, with
  white flowers lightly tinged with pink and tuber-like roots; it looks like meadow rue.
scope: Another name for false rue anemone, the plant described here; the two names are used for the same
  species. It is not meadow rue, which it merely resembles, and it is not a true rue. The name is a plant
  name.
examples:
- False rue is easy to miss among the taller plants of the spring woods.
- The guide pointed out false rue growing beside the trail in eastern Ohio.
