simpleMeaning: Much wider than the Sun and much less tightly packed, this ball of hot gas in the sky shines
  very brightly
scope: Also called a giant, this is a very bright ball of hot gas in the sky, much wider than the Sun
  and less tightly packed, not a small dim star and not a planet.
examples:
- The giant star shines far more brightly than the Sun.
- Astronomers found a giant star with a very low density.
