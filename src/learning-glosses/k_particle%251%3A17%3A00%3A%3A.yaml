simpleMeaning: A short-lived kind of meson (a tiny bit of matter) that forms when two bits of matter smash
  into each other at very high speed
scope: This is a short-lived meson formed in a high-energy collision; k-meson, kaon and kappa-meson are
  other names for it, not other kinds of meson and not a stable bit of matter.
examples:
- A K particle formed when the two beams collided.
- The K particle broke apart almost at once.
