simpleMeaning: a rough plant of eastern North America that lives two years, with yellow flowers that open
  at dusk, now growing wild in Europe
scope: A rough plant with yellow flowers that open at dusk; not a plant with flowers that open by day,
  and not a tree.
examples:
- Common evening primrose opened its yellow flowers at dusk.
- The common evening primrose grows wild along the road in Europe.
