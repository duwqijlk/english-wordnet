simpleMeaning: in a way that shows you do not really want to do something, but do it anyway
scope: Done in a way that shows you do not really want to do it, not done gladly or eagerly.
examples:
- He grudgingly agreed to have a drink in a hotel close by.
- She grudgingly paid the fine and walked away.
