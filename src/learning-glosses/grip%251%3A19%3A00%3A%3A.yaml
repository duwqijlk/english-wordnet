simpleMeaning: the hold between a thing and the ground or surface under it as it moves, such as between
  a car tire and the road
scope: This is the hold that stops sliding when a thing moves, not holding a person tight in a fight,
  not a hair pin, and not a small bag for clothes.
examples:
- The new tires gave the car good grip on the wet road.
- On ice, the shoes lose grip and slide.
