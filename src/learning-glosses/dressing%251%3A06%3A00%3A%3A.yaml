simpleMeaning: a piece of cloth put over a wound or sore to cover it
scope: This is cloth over a wound or sore, not a sauce for salad and not food put inside meat.
examples:
- The nurse changed the dressing on his cut arm.
- She put a clean dressing over the sore on her knee.
