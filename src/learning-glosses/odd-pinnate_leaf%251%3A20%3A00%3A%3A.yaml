simpleMeaning: A green plant part with small green parts set along a stem and one small green part at
  the tip
scope: A green plant part with small green parts along a stem and one at the tip; not the adjective said
  of a leaf shape and not a part with no small part at the tip.
examples:
- She picked an odd-pinnate leaf from the branch and pressed it in a book.
- The odd-pinnate leaf on the table has one leaflet at its tip.
