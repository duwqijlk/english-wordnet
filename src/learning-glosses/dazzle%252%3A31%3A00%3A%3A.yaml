senseId: 'dazzle%2:31:00::'
synsetId: 00727008-v
simpleMeaning: to fill someone with wonder and leave them unable to think clearly, as by clever talk,
  a clever mind, or great skill
scope: To amaze a person in this way, not the bright light that hurts the eyes for a short time.
examples:
- The dancer dazzled the crowd with his fast turns and jumps.
- Her clever answers dazzled the judges.
