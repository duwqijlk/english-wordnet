simpleMeaning: A large deciduous tree from New Jersey to Illinois and southward, with spreading branches,
  a rounded crown, narrow curved leaves with deeply wavy lobes, and wood resembling northern red oak.
scope: This tree is also called swamp red oak and turkey oak, the same thing under other names; it is
  not the northern red oak, though its wood is similar.
examples:
- The southern red oak on the ridge dropped its leaves early.
- Southern red oak timber is sold together with that of other red oaks.
