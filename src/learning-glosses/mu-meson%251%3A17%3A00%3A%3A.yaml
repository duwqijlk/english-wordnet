simpleMeaning: An electron, a neutrino, and an antineutrino are what a tiny bit of matter with a minus
  charge breaks into after only 2 microseconds.
scope: Also called a muon and a negative muon, this tiny charged bit of matter breaks into an electron,
  a neutrino, and an antineutrino after only 2 microseconds.
examples:
- The mu-meson broke into an electron, a neutrino, and an antineutrino.
- After only 2 microseconds, a mu-meson breaks apart.
