simpleMeaning: a fruit shaped like an egg, with brown skin covered in soft hair and green flesh inside
  that tastes a little sharp and sour
scope: 'Also called kiwi fruit: this is the fruit you eat, not the bird from New Zealand that cannot fly
  and not the climbing plant it grows on.'
examples:
- She cut the kiwi in half and ate the green flesh with a spoon.
- He bought three kiwis because he liked their sharp, sour taste.
