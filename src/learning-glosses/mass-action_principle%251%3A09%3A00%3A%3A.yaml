simpleMeaning: In neurology, when the brain does a hard task, large parts of nerve tissue in its outer
  layer all join in and work as one system
scope: 'Also called mass action: a rule about how the brain''s outer layer works as one system, not a
  rule about one small part of the brain.'
examples:
- The mass-action principle says the cortex works as a whole, not in small separate parts.
- Under the mass-action principle, a large mass of nerve tissue joins in every complex task.
