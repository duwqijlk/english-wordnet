simpleMeaning: Marked by the making of a thin skin, or of something like a thin skin
scope: Marked by the making of a thin skin or something like one; membranous is another name for this,
  not a thing that makes a thick wall and not a thing with no skin at all.
examples:
- Membrane-forming cells line the gut.
- The membrane-forming growth spread across the wound.
