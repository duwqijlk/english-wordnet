simpleMeaning: In a Christian church, the table used when bread and wine are shared to remember Jesus
scope: This is the special table in a Christian church for sharing bread and wine, not an ordinary table
  and not a place for offerings in another religion.
examples:
- The priest placed the cup on the altar during the service.
- Candles stood on each side of the altar in the church.
