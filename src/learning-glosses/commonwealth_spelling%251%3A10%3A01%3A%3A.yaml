simpleMeaning: The written word forms of the tongue of England, as used in the UK, Ireland and most of
  the lands once ruled from Britain, marked by 'analyse', 'centre' and 'useable'.
scope: Also called British English orthography, British English spelling, British spelling, Commonwealth
  English orthography, Commonwealth English spelling, Irish English orthography, Irish English spelling,
  Irish spelling, New Zealand English orthography, New Zealand English spelling and New Zealand spelling,
  this is the spelling of the UK, Ireland and most of the old British lands, not the spelling of the United
  States.
examples:
- Commonwealth spelling writes 'centre', not 'center'.
- We use Commonwealth spelling in this book.
