simpleMeaning: This liquid lets soap make a rich foam, holding no salts that stop it foaming.
scope: It is the liquid that lets soap foam well, not the kind with salts that stop soap from foaming.
examples:
- Soap made a rich foam in the soft water.
- The soft water made the soap foam well.
