synsetId: 10703410-n
simpleMeaning: A person who backs no political party and whose hard-to-guess choice can turn the result
  of an election one way or the other.
scope: This is a person who backs no political party and whose choice can turn an election, also called
  floating voter, and not a party member or a loyal supporter.
examples:
- The swing voter had not yet made up her mind.
- Both sides courted the swing voter before the vote.
