simpleMeaning: how loud something is when it sounds as loud and deep as thunder
scope: This is how loud and deep a sound is, not a short sharp noise and not a quiet sound.
examples:
- The thunderousness of the drums shook the hall.
- The thunderousness of the teacher's voice left the class in no doubt.
