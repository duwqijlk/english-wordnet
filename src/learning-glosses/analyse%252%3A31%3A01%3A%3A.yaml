simpleMeaning: to study something in maths, chemistry, or grammar by breaking it into its parts to find
  its main features
scope: 'Also called analyze, dissect, and break down: to study the parts of something in maths, chemistry,
  or grammar, not the wider sense of looking at any subject in detail to find its meaning.'
examples:
- The students analysed a sentence to find its main parts.
- She analysed a chemical compound in the lab.
