simpleMeaning: A thick lumpy yellow stem under the ground and big round leaves mark this herb of the northeastern
  United States that lives year after year.
scope: Also called goldenseal, golden seal, and yellow root, it is a herb of the northeastern United States
  known for its thick lumpy yellow stem under the ground and big round leaves.
examples:
- The thick lumpy yellow stem of turmeric root lies under the ground.
- Big round leaves and a thick lumpy yellow stem under the ground mark the turmeric root.
