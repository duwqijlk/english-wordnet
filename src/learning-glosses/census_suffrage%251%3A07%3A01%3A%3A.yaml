simpleMeaning: Votes weighed by rank on the census roll, not counted the same, so high-pay folk hold extra
  votes over low-pay folk.
scope: Votes weighed by rank on the census roll, not counted the same, also called censitary suffrage.
examples:
- Census suffrage gave the rich more votes.
- Under census suffrage, votes weighed differently.
