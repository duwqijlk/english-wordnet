simpleMeaning: An upright or low-spreading green-all-year bush with hanging groups of white or pink flowers;
  it grows in sphagnum peat bogs and other wet sour ground in northern Europe.
scope: Also called common bog rosemary and marsh andromeda; a low bush with hanging white or pink flowers
  that grows in wet bogs, not a dry-ground garden bush and not a tall tree.
examples:
- Andromeda polifolia grows in the wet peat bog.
- The white flowers of Andromeda polifolia hang in small groups.
