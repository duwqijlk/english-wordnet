simpleMeaning: A small sea snail that people can eat, steamed in wine or baked
scope: This is the small sea snail as food, also called periwinkle; it is not the word for the living
  animal itself, and not the verb sense about light shining on and off.
examples:
- We ate winkles steamed in wine.
- She bought fresh winkles and baked them for dinner.
