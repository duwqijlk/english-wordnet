simpleMeaning: a nut tree from the east of the United States, like the tree with loose peeling bark but
  with a much larger nut
scope: 'Also called big shellbark, big shellbark hickory, king nut and king nut hickory: a nut tree from
  the east of the United States with a much larger nut than the tree with loose peeling bark, not a small-nut
  tree and not a nut tree from the west.'
examples:
- The big shagbark in the yard drops nuts far larger than the ones from the tree with loose bark.
- Farmers in the east of the United States grow the big shagbark for its large nuts.
