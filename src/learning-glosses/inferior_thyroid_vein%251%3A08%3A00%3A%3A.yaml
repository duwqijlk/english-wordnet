simpleMeaning: Through any of several lower veins on each side, a large blood tube in the chest takes
  in blood from the small gland in the front of the neck.
scope: This is a vein that drains the small gland in the front of the neck, set apart from the gland itself
  and from the large blood tube in the chest into which it empties.
examples:
- Blood from the gland drained away through an inferior thyroid vein.
- Each side of the neck has an inferior thyroid vein.
