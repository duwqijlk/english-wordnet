simpleMeaning: A drug of the kind called a glucocorticoid, used to treat illnesses that cause swelling
  and pain.
scope: This is a drug used to treat illnesses that cause swelling, also called prednisolone and Pediapred,
  not a drug for one illness only.
examples:
- The doctor gave him Prelone for the swelling.
- Prelone is used to treat inflammatory conditions.
