scope: A small black bug from Europe, now in North America, that sucks blood from cattle, above all at
  the foot of the hard point on the head; not a house bug, and not a bug that bites people.
examples:
- The horn fly clusters on the backs of the cattle in summer.
- The horn fly sucks blood from cattle, above all near the horns.
