simpleMeaning: A medium-to-large leaf-shedding timber tree in the eastern United States and southeastern
  Canada, with dark outer bark and yellow inner bark for tanning; its broad five-lobed leaves are bristle-tipped.
scope: Also called black oak, quercitron, quercitron oak, and yellow oak; a large timber tree of eastern
  North America, not a pine and not a maple.
examples:
- Quercus velutina grows across the eastern United States and southeastern Canada.
- The yellow inner bark of Quercus velutina is used for tanning.
