simpleMeaning: in south-east Asia, Australia, and America, a toad lives among branches and usually grips
  with sticky pads on the tips of its toes
scope: Also called tree-frog and tree frog; a toad that lives in trees, not a toad that lives on the ground.
examples:
- A tree toad sat on a low branch, its sticky toes holding it fast.
- We spotted a tree toad high in the fig tree after the rain.
