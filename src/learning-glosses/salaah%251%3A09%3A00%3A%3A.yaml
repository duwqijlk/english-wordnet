simpleMeaning: Five times a day, facing Mecca, Muslims say this set form of prayer, the second pillar
  of Islam, best in a mosque.
scope: 'Also called salaat, salah, and salat: the second pillar of Islam, a set form of prayer said five
  times a day, facing Mecca.'
examples:
- Muslims perform salaah five times a day, facing Mecca.
- She said salaah in the mosque, facing Mecca.
