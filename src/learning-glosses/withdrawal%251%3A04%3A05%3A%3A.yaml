simpleMeaning: the act of taking out blood, growths, or other matter from the body
scope: The taking of blood or growths out of the body; not simply leaving a place, and not a formal break
  from a group.
examples:
- The nurse was skilled at the withdrawal of blood.
- The withdrawal of the growth took only an hour.
