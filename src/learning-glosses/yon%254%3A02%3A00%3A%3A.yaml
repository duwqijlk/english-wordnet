simpleMeaning: At or in the place pointed to, usually far away; an old word used in some places.
scope: At or in the place pointed to, usually far away; yonder is another name for this sense, and it
  is not the adjective sense of far away but in sight.
examples:
- The old farmhouse lies over yon, past the river.
- They scattered here and yon across the field.
