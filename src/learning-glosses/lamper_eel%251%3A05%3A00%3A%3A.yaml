simpleMeaning: An early jawless water animal, long and thin, keeps a round sucking mouth and a rough tongue
  as it lives in fresh water or swims up rivers from the sea.
scope: People also call it lamprey and lamprey eel, the jawless water animal with a round sucking mouth
  and a rough tongue.
examples:
- The lamper eel moved up the river from the sea.
- A lamper eel lives in fresh water with a round sucking mouth.
