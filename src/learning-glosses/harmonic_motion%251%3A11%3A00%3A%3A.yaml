simpleMeaning: In physics, a back-and-forth move that repeats, in which the shift is even on both sides
  of a point, or is made up of such moves.
scope: In physics, this is a back-and-forth move that repeats, with the shift even on both sides of a
  point, not a one-way move.
examples:
- A swinging pendulum shows harmonic motion.
- Harmonic motion repeats in a regular way.
