simpleMeaning: a mix of nectar (sweet liquid from flowers) and pollen (fine dust from flowers), made by
  worker bees and fed to larvae (young bees still growing)
scope: 'Also called beebread: food made by bees for their young, not the food and drink of the gods in
  old stories and not a sweet dish of fruit.'
examples:
- Worker bees store ambrosia in the hive to feed their young.
- The ambrosia is made from nectar and pollen that bees collect from flowers.
