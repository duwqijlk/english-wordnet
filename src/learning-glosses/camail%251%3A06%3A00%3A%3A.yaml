simpleMeaning: A hood of linked metal rings worn in the Middle Ages, hung from a helmet to guard the head
  and neck.
scope: 'Also called aventail: a hanging hood of ringed armour, not a cloth hood and not a full helmet.'
examples:
- The knight's camail hung down to cover his neck.
- A camail of linked rings guarded the soldier's throat.
