simpleMeaning: to cause a person to be taken into a hospital, prison, or other such place
scope: 'Also called send, charge, commit and institutionalise: having a person put into a hospital, prison
  or such a place, not making something a regular practice or part of a system.'
examples:
- After his illness grew worse, the family had to institutionalize him.
- The court ordered that she be institutionalized for her own safety.
