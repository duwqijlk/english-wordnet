simpleMeaning: In still muddy waters in the southern United States lives a salamander shaped like a long
  thin fish, with two pairs of very small feet.
scope: This water salamander shaped like a long thin fish is also called an amphiuma, a blind eel, or
  a congo snake, and it is not a true eel.
examples:
- The congo eel swam in the still muddy water.
- We watched a congo eel move through the muddy water.
