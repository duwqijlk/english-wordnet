senseId: 'compensation%1:22:00::'
synsetId: 13471809-n
simpleMeaning: In psychiatry, a way the mind defends itself, hiding your weak points by making too much
  of your strong points
scope: In psychiatry, a way the mind hides weak points by making too much of strong ones, not money paid
  for a loss or injury and not the act of making up for a wrong.
examples:
- His constant boasting was compensation for his fear of failing.
- The patient used compensation to hide how unsure of himself he felt.
