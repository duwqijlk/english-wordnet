simpleMeaning: Thick, nearly impassable clumps grow on sandy shores from a small shrub or tree of the
  south-east of the United States that keeps its leaves all year.
scope: Myrtle oak is another name for this small shrub or tree of the south-east of the United States
  that keeps its leaves all year and often grows in thick clumps on sandy shores.
examples:
- The seaside scrub oak keeps its leaves all year.
- A seaside scrub oak often grows in thick clumps on sandy shores.
