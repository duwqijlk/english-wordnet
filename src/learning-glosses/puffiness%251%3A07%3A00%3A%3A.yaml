simpleMeaning: A lack of grace that comes from being full of one's own importance and showing it off.
scope: Also called inflation, ostentation, or ostentatiousness, a lack of grace that comes from being
  full of one's own importance and showing it off, not a swelling or a lump on the body.
examples:
- His puffiness showed in every speech he gave.
- The puffiness of her manner put people off.
