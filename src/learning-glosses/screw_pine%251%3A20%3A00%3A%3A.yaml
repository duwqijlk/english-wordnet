simpleMeaning: Leaves like a spiky fruit, cone-shaped fruits for eating, and huge roots holding them up
  mark one of many kinds of Old World tropical trees, like palms.
scope: Also called pandanus, this names one of many kinds of tropical Old World trees, like palms, with
  huge roots that hold them up and cone-shaped fruits for eating.
examples:
- The screw pine bore cone-shaped fruits.
- The screw pine stood on huge roots.
