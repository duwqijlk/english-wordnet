simpleMeaning: A build-up of monthly blood inside the birth canal, usually because the thin skin at its
  opening has no hole in it.
scope: A build-up of monthly blood in the birth canal, usually because its opening is closed; haematocolpos
  is another name for this sense, and this is not ordinary monthly bleeding or a build-up of other fluid.
examples:
- The girl's hematocolpos caused pain until a doctor opened the closed skin.
- Hematocolpos can happen when monthly blood has no way out of the body.
