simpleMeaning: A glassy mineral like feldspar, made of aluminum, silicon, oxygen and water, plus calcium,
  sodium or potassium; it forms in holes in lava flows and in rock deep underground.
scope: The mineral itself, not a rock type, a gemstone, or a manufactured glass.
examples:
- The zeolite crystals lined the inside of a cavity in the basalt.
- Water passes through channels in zeolite, which is why it is used to soften water.
