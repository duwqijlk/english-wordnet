simpleMeaning: This low creeper survives winter after winter, showing red fruit and rings of foliage clustered
  where each shoot ends; its range reaches from Greenland to Alaska.
scope: 'Another name for bunchberry, dwarf cornel and pudding berry: the ground-spreading plant that carries
  the red fruit, not the berries alone.'
examples:
- Crackerberry grows in cool northern woods from Greenland to Alaska.
- We found crackerberry with red fruit and rings of leaves beside the trail.
