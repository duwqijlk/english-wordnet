simpleMeaning: Police stop and search vehicles whose drivers belong to certain groups picked out by race,
  a practice called racist and said to be set policy.
scope: Police stopping and searching vehicles by the driver's race, said to be set policy.
examples:
- Racial profiling means the police stopped his car because of his race.
- She said racial profiling had led officers to search the car.
