simpleMeaning: A substance made when a group of three nitrogen atoms joins to one other bit — a single
  element or a group of atoms.
scope: A chemical with the three-nitrogen group joined to something else is what this name stands for.
examples:
- This azide joins the three-nitrogen group to a single metal.
- Another azide joins the three-nitrogen group to a group of atoms.
