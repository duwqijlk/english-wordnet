simpleMeaning: a dry fruit that, when ripe, splits into two or more parts, each with one seed
scope: A dry fruit that splits into two or more parts when ripe, each part holding one seed. Not a soft
  fruit and not a fruit that holds many seeds in one part.
examples:
- The schizocarp split into two parts, each with a single seed.
- We found a dry schizocarp on the plant after it had ripened.
