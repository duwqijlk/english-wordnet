simpleMeaning: A member of a fighting group of Algonquian people living on the northwestern plains.
scope: A member of one Algonquian group of the northwestern plains, not the tongue spoken by the group
  and not other Algonquian peoples.
examples:
- The Blackfoot lived on the northwestern plains.
- A Blackfoot elder told stories of the old days.
