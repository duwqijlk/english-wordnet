simpleMeaning: A vine that lives for one year, with leaves cut into many small parts and with stalks of
  yellow and pink flowers.
scope: A vine that lives for one year, with leaves cut into many small parts and stalks of yellow and
  pink flowers; not a vine that lives for many years and not a rose.
examples:
- The climbing corydalis wound round the fence with yellow and pink flowers.
- In spring the climbing corydalis covered the wall in bloom.
