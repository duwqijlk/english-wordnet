simpleMeaning: The smooth ring muscle that opens and shuts the shared tube carrying bile.
scope: The smooth ring muscle of the shared bile tube; not the ring muscle of the pancreas tube, and not
  a muscle that moves food.
examples:
- The musculus sphincter ductus choledochi relaxed to let bile through.
- Doctors watched the musculus sphincter ductus choledochi open and close.
