simpleMeaning: In golf, the movement of a club through the air to strike the ball, often connecting with
  it.
scope: A golfer's stroke at the ball, with golf shot and golf stroke as other names for it, not a baseball
  batter's attempt or a body's back-and-forth motion.
examples:
- Her swing sent the ball straight down the fairway.
- He spent the winter improving his swing at the driving range.
