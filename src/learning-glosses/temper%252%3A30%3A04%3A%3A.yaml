simpleMeaning: to make a thing the right firmness, feel, or hardness by heating it and then cooling it
  bit by bit
scope: To give a thing the right firmness by heating and cooling it bit by bit, not to make steel hard
  in oil, and not to set the notes of a piano.
examples:
- They tempered the glass slowly.
- The smith tempered the blade by heating and cooling it.
