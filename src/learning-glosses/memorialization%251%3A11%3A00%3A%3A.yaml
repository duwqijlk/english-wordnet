simpleMeaning: A formal gathering held so that people will not forget a person or event of the past
scope: A formal act that honours a person or event of the past, also called memorialisation; not a grave
  itself and not a written account of the past.
examples:
- The memorialization drew a large crowd to the square.
- Each year the town held a memorialization for its founders.
