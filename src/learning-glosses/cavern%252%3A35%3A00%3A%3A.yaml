simpleMeaning: to dig or cut out the inside of something, making an empty space inside it like a large
  cave
scope: To dig out an empty space inside something; not the noun sense, a large cave or a large room inside
  a cave.
examples:
- The river had caverned out the soft rock under the cliff.
- Workers caverned a wide space inside the hill for storage.
