simpleMeaning: A landing place by the water where ships tie up, usually built to run beside the shore.
scope: A landing place by the water for ships; not a beach where boats are pulled up, and not a pier that
  runs out into the water.
examples:
- The ship tied up at the quay before dawn.
- Workers loaded crates along the quay all morning.
