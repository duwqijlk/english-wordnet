simpleMeaning: To do with bringing churches or faiths together as one
scope: Said of work that brings churches or faiths together as one; ecumenic, ecumenical and oecumenical
  are other names for this sense, not work that keeps faiths apart.
examples:
- The oecumenic talks brought leaders of many churches together.
- She joined an oecumenic group that works for unity among faiths.
