simpleMeaning: A very catching sickness of animals, especially cattle and sheep, that can also pass to
  people.
scope: A very catching sickness of animals, especially cattle and sheep, that can also pass to people;
  not the disease of people that cannot be passed on, caught from the germ Bacillus anthracis and followed
  by poisoning of the blood.
examples:
- Anthrax broke out among the cattle on the farm.
- The vet warned that anthrax can pass from sheep to people.
