simpleMeaning: words that go too far in sounding grand, with far too much showy decoration
scope: 'Also called purple and over-embellished: words that go too far in sounding grand, with far too
  much showy decoration, not plain words and not words that are simply long.'
examples:
- His empurpled speech went on and on with grand, showy words.
- The review called her empurpled prose far too grand for a simple tale.
