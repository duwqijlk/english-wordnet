simpleMeaning: to come in and stop at a built place by the shore made for ships
scope: For a ship to come in and stop at such a place; not tying it in place there, not unloading people
  or goods, and not the place itself.
examples:
- The big ship wharfed in the evening as the light faded.
- Our ferry wharfed late because of the fog.
