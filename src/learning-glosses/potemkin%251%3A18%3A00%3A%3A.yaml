simpleMeaning: A Russian officer and politician, Catherine the Second's favourite, who helped her take
  power in 1762 and had sham villages built for her Crimea visit in 1787, 1739 to 1791
scope: Also called Grigori Aleksandrovich Potemkin, Grigori Potemkin, Grigori Potyokin and Potyokin, this
  is the Russian officer who helped Catherine the Second take power in 1762, not a general of a later
  war and not a ruler himself.
examples:
- Potemkin helped Catherine the Second take power.
- The sham villages of Potemkin fooled the visitors.
