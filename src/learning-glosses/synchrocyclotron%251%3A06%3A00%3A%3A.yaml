simpleMeaning: A machine that speeds up tiny bits of matter to near the speed of light by changing the
  rate at which its electric push repeats.
scope: This machine drives tiny bits of matter to near the speed of light by shifting the rate at which
  its electric push repeats, not by holding that rate steady.
examples:
- The synchrocyclotron ran through the night as the particles picked up speed.
- The synchrocyclotron kept its electric field in step with the speeding particles.
