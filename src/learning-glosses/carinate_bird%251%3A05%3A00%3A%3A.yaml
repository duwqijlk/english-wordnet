simpleMeaning: A flying creature with a ridge down the front of the chest bone, where the wing muscles
  join.
scope: A flying creature with a ridge down the front of the chest bone, where the wing muscles join; carinate
  and flying bird are other names for this sense, not a bird with a flat chest bone and not a flightless
  bird.
examples:
- The carinate bird has a ridge down the chest bone.
- A carinate bird uses its wing muscles to fly.
