simpleMeaning: A herb of the southwestern United States and Mexico that spreads by low rooting stems,
  with a sharp-smelling root and small spike-like flowers with white petal-like parts like an anemone.
scope: Also called yerba mansa; a herb of the southwestern United States and Mexico with a sharp-smelling
  root and small spike-like flowers.
examples:
- Anemopsis californica grows in the wet ground of the Southwest.
- We found Anemopsis californica with its white bracts by the stream.
