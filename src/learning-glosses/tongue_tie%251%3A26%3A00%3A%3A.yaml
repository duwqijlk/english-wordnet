simpleMeaning: The thin skin under the moving part of the mouth is too short, keeping that part from moving
  freely, a fault a baby is born with.
scope: People also call it ankyloglossia, a fault a baby is born with in which the thin skin under the
  tongue is too short and keeps the tongue from moving freely.
examples:
- The baby's tongue tie kept his tongue from moving freely.
- A tongue tie can keep the tongue from moving freely.
