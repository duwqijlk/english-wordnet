simpleMeaning: A grown blood cell, shaped like a disc dented on both sides with no nucleus to run it,
  holds the red stuff carrying oxygen to the parts of the body
scope: It is also called a red blood cell, a grown blood cell that carries oxygen to the body.
examples:
- Each erythrocyte carries oxygen to the tissues.
- An erythrocyte is dented on both sides and has no nucleus.
