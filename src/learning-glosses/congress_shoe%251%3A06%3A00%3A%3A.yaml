senseId: 'congress_shoe%1:06:00::'
synsetId: 03095166-n
simpleMeaning: a low boot that comes up to the ankle, with stretchy side parts that let the foot slide
  in
scope: This is a low boot that reaches the ankle and slips on with stretchy side parts; congress boot
  and congress gaiter are other names for this sense, and it is not a tall boot or a shoe with laces.
examples:
- His congress shoes came up to his ankles and stretched at the sides as he put them on.
- Her congress shoes were easy to put on because of the stretchy sides.
