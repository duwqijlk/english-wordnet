senseId: 'skimp%2:41:00::'
synsetId: 02522103-v
simpleMeaning: To rush through work without care, or to handle a thing so lightly that it is done badly.
scope: Also called scant, to rush through work without care or to handle a thing so lightly that it is
  done badly, not to live on very little and not to give out only small amounts.
examples:
- They skimped on the repairs, and the roof leaked again within a month.
- Do not skimp the job just to finish early.
