simpleMeaning: In psychology, a learned response to one thing carried over to a like thing.
scope: In psychology, a learned response to one thing carried over to a like thing, not working out broad
  rules from facts looked at in close detail, not the forming of broad ideas from what cases have in common,
  and not an idea or conclusion with general application.
examples:
- The dog's generalization to the new bell surprised the trainer.
- Generalization in the test showed the child used the old response for a new picture.
