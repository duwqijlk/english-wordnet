simpleMeaning: Being far bigger than usual, in size, in spread, or in number.
scope: Being far bigger than usual in size, spread, or number, not the mark of a person who stands out
  for weight and worth.
examples:
- The greatness of the crowd filled the square.
- They marvelled at the greatness of the old oak.
