simpleMeaning: Into the palm, round the wrist and down the forearm runs this blood tube, leaving the main
  tube of the upper arm below the elbow.
scope: This blood tube, also called arteria radialis, runs from below the elbow to the palm rather than
  being the main tube of the upper arm.
examples:
- Blood reached his hand through the radial artery.
- The radial artery brought blood to the palm of his hand.
