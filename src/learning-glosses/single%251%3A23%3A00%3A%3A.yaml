simpleMeaning: 'The number one: the smallest whole number, or the written figure that stands for it.'
scope: This is the rare noun use of 'single' for the number one itself, mostly met in games, scores and
  old counting talk. It is not the adjective meaning 'not married', and it does not mean a person who
  is unmarried.
examples:
- He pushed the ball into the gap and took an easy single.
- The punt rolled into the end zone for a single.
