simpleMeaning: a task given to one armed group to help one named other armed group and to give help straight
  to that group when it asks for it
scope: A task for one armed group to help one named other armed group, not help given to any group that
  needs it and not a task to fight.
examples:
- The brigade was given direct support to the infantry unit holding the hill.
- Under direct support, the artillery answered the infantry's call for help at once.
