senseId: 'drift%1:22:01::'
synsetId: 13490877-n
simpleMeaning: When outside forces slowly carry a ship or aircraft off the route it was meant to follow.
scope: This is a ship or plane slowly straying off its planned route, not the force that pushes it, not
  snow piled by the wind, and not the level tunnel in a mine.
examples:
- The aircraft's slow drift off course was caused by a strong crosswind.
- Navigators corrected for the ship's drift away from the plotted route.
