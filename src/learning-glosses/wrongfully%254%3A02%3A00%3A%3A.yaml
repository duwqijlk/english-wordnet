simpleMeaning: in a way that is not fair or not right
scope: This word says how an action is done in a way that is not fair; it does not name the action itself,
  and it is not about a simple mistake.
examples:
- She said she was wrongfully dismissed from her job.
- People who were wrongfully put in prison should be set free.
