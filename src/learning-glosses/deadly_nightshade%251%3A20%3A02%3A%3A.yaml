simpleMeaning: A long-lived herb from Eurasia with bell-shaped reddish flowers and shiny black berries.
  It is widely grown in the United States; the drug atropine comes from its roots and leaves.
scope: This is the belladonna herb with reddish bell-shaped flowers, not the woody vine with violet flowers
  and coral-red berries that also goes by deadly nightshade; belladonna and belladonna plant are other
  names for this plant.
examples:
- Deadly nightshade opens its reddish bell-shaped flowers in summer.
- By autumn the deadly nightshade was hung with shining black berries.
