simpleMeaning: a thing put outside that gives food to wild birds
scope: A thing hung or set outside to hold food for wild birds; not an animal being made fat, and not
  a small stream that flows into a bigger one.
examples:
- She filled the feeder with seeds and hung it from a tree.
- Birds come to the feeder in our garden every morning.
