simpleMeaning: A weed that grows in tufts in the southwestern United States, with flowers that are deep
  blue-red, or pink shading to white.
scope: A tufted weed of the southwestern United States, also called purple locoweed; not a tall bush and
  not a plant grown for food.
examples:
- The purple loco grows in tufts in the southwestern United States.
- Purple loco bears flowers of a deep blue-red or pink to white colour.
