simpleMeaning: The fine ornaments and other grand objects worn by a king or queen at formal state events
scope: These are the grand ornaments worn by a ruler at state events, not everyday jewellery and not the
  ruler's clothes.
examples:
- The crown jewels were on show at the Tower.
- She wore the crown jewels for the state opening.
