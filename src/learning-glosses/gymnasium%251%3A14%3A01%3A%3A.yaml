simpleMeaning: a school for young people between the first school and college, most often for grades 9
  to 12
scope: This is a school for young people between the first school and college, not a room for sport and
  not a college itself.
examples:
- He finished his studies at the gymnasium in his home town.
- The gymnasium teaches pupils from grade nine to grade twelve.
