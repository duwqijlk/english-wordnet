simpleMeaning: So strange and out of the usual way as to stand out at once
scope: Also called bizarre and eccentric, this sense means being grossly out of the usual way, not merely
  odd in a small way and not a freak of nature.
examples:
- They wore freakish clothes of bright green and purple.
- His freakish spelling made the letter hard to read.
