simpleMeaning: a big tree of the southern United States with needles that are not long, in groups of two
  or three, and red-brown bark when full grown
scope: A big tree of the southern United States, also called a shortleaf pine and a shortleaf yellow pine;
  not a tall northern pine and not a small garden tree.
examples:
- A short-leaf pine stood at the edge of the field.
- The short-leaf pine grows all over the south.
