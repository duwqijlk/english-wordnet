simpleMeaning: When pressure inside the bladder grows, the ring of muscle at the mouth of the tube that
  carries urine out of the body loosens
scope: The loosening of the muscle that holds urine back when pressure in the bladder grows, not the act
  of passing urine itself and not a learned habit.
examples:
- The micturition reflex lets the bladder empty when it is full.
- Damage to the nerves can weaken the micturition reflex.
