simpleMeaning: In Yiddish, nerve so bold and rude it is hard to believe; shameless daring.
scope: Bold rude nerve beyond belief, not courage and not confidence; chutzpa and chutzpah are other names
  for this sense.
examples:
- It took real hutzpah to ask the boss for a raise on his first day.
- Her hutzpah left the whole room silent.
