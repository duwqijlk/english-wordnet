simpleMeaning: a thick, sticky kind of alcohol that works less well in mammals, animals that feed their
  young with milk, than vitamin A1 does
scope: A thick, sticky kind of alcohol that works less well in mammals than vitamin A1; not vitamin A1
  itself, and not a kind of alcohol that works better than vitamin A1.
examples:
- The sample of dehydroretinol worked less well in the rats than vitamin A1 did.
- The chemist compared dehydroretinol with vitamin A1 in the test on rats.
