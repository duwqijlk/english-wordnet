simpleMeaning: In chess, a move that attacks the other player's king in a way that cannot be escaped or
  stopped
scope: 'Also called mate: in chess, a move that ends the game by trapping the king, not a general win
  or a hard problem in life.'
examples:
- His last move was checkmate, so the game ended at once.
- She won with a checkmate in only ten moves.
