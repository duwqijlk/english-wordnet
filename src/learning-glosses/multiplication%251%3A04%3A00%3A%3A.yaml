simpleMeaning: A way of working with numbers that is the opposite of dividing and that works out what
  you get from two numbers, as when three times four makes twelve
scope: 'Also called times: working out the total made from two numbers, not making new living things,
  and not a rise in amount.'
examples:
- In multiplication, six times two is twelve.
- She used multiplication to work out four times five.
