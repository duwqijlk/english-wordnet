simpleMeaning: In grammar, the link between words or parts that shows a choice between their meanings.
scope: In grammar, a link showing a choice between meanings, not a link joining two things together and
  not a word on its own.
examples:
- In 'tea or coffee', the disjunctive conjunction is 'or'.
- A disjunctive conjunction joins two choices in one phrase.
