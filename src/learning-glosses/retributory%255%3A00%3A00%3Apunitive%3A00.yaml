simpleMeaning: To do with paying back a wrong with like harm, as a fitting payback.
scope: This word is about payback for a wrong, not about pardon or mercy; it is also called retributive.
examples:
- She took a retributory view of the crime.
- The retributory law aimed to match the harm done.
