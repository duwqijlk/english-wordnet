simpleMeaning: For a plant to send up new side shoots from its base, as a cut stem sends up fresh growth
scope: For a plant to send up new side shoots from its base, as a cut stem sends up fresh growth; stool
  is another name for this sense; not a tool for breaking up soil, and not a person who works the land.
examples:
- The wheat began to tiller in the spring, sending up new shoots.
- After the cut, the grass tillered thickly from its base.
