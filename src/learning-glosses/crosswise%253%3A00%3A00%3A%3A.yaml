simpleMeaning: lying or going across a thing from one side to the other, not along its long way
scope: Going across from side to side; not shaped like the flat bar of a cross, and not going along the
  length of a thing.
examples:
- A crosswise street cuts across the main road.
- The crosswise boards lay across the top of the box.
