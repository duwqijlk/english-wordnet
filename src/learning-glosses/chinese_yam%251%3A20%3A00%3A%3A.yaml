simpleMeaning: A hardy vine from China, now wild in the United States, grown for its glossy heart-shaped
  leaves that smell of cinnamon, and in warm lands for its edible underground stems.
scope: Also called cinnamon vine and Dioscorea batata; a vine grown for its sweet-smelling leaves and
  its edible underground stems, not a low ground plant.
examples:
- Chinese yam climbs the fence in the warm garden.
- The leaves of Chinese yam smell of cinnamon.
