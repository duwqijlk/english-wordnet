simpleMeaning: Feeding the middle part of the small gut, this blood tube comes off the main blood tube
  to the gut
scope: Also called the jejunal artery, this tube feeds the middle part of the small gut, not the lower
  part.
examples:
- The intestinal artery carries blood to the middle part of the small gut.
- Blood reached the gut through the intestinal artery.
