simpleMeaning: Sea animals that build hard, chalky frames, which pile up in great masses to form reefs
  and islands.
scope: Sea animals that build hard chalky frames forming reefs and islands, also called madriporian coral
  or stony coral, not soft sea fans and not single shellfish.
examples:
- Madrepore built the reef where the fish sheltered.
- The madrepore colony grew slowly over the rock.
