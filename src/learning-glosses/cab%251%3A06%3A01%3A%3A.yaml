simpleMeaning: This small carriage is pulled along by a horse and has two wheels, two seats, and a hood
  that folds down.
scope: A small horse-drawn carriage, not the driver's compartment at the front of a truck or train.
examples:
- The cab rattled along the cobbled street behind its horse.
- They hired a cab with a folding hood for the ride to town.
