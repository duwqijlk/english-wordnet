simpleMeaning: A small low or rising shrub with scarlet flowers and juicy fruit like cranberries; sometimes
  put in the genus Styphelia.
scope: Also called cranberry heath, ground-berry, groundberry, native cranberry, and Styphelia humifusum;
  a small low shrub with scarlet flowers and juicy fruit like cranberries, distinct from true cranberries,
  whose fruit it only resembles.
examples:
- Astroloma humifusum spreads low with scarlet flowers.
- We tasted the juicy fruit of Astroloma humifusum.
