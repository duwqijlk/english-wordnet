simpleMeaning: the act of making people feel a very strong feeling, one that can lead them to do harm
scope: Inflaming is another name for this sense. This is about making people feel a very strong feeling
  that can lead to harm. Not the body sense, where a hurt part of the body becomes red, hot, sore, and
  swollen.
examples:
- The unfair speech caused inflammation among the workers, and they began to shout in anger.
- His words led to inflammation in the crowd, with people pushing and yelling.
