simpleMeaning: A slender fern of northern North America with shining chestnut-coloured stalks and fronds
  split twice, with spore cases along the edges that are usually separate.
scope: Also called flower-cup fern, northern woodsia, and Alpine woodsia; a slender fern of northern North
  America with shining chestnut-coloured stalks, not the common bracken and not the maidenhair fern.
examples:
- Woodsia alpina grows on the rocks of northern North America.
- The shining stalks of Woodsia alpina stood out among the ferns.
