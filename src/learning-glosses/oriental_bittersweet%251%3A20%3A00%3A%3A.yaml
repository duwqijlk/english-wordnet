simpleMeaning: a pretty climbing plant from Asia with bright orange-yellow fruit and a red coat round
  each seed; it now grows wild in North America
scope: A showy Asian climbing plant with orange-yellow fruit, not the North American bittersweet and not
  a plant grown for food.
examples:
- Oriental bittersweet spread across the old wall, its orange-yellow fruit bright against the leaves.
- Gardeners warn that oriental bittersweet can take over a whole hedge.
