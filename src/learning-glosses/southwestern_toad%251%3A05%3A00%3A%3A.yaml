simpleMeaning: Of the dry washes and streams of the southwest United States, this is a thick toad, warty
  and the same all over
scope: This is a thick, warty toad of the dry washes and streams of the southwest United States, not a
  toad of wet green lands.
examples:
- A southwestern toad sat in a dry wash.
- The southwestern toad lives by streams of the southwest United States.
