simpleMeaning: A tool for killing a person with electric current, made to look like an ordinary seat for
  one person.
scope: A tool for killing a person with electric current, made like an ordinary seat; chair, electric
  chair and hot seat are other names for it, not a prison cell and not a hanging rope.
examples:
- The death chair was used for executions by electrocution.
- He was sentenced to die in the death chair.
