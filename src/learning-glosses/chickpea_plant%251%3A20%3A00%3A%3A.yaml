simpleMeaning: a herb from Asia grown for its short pods, each holding one or two seeds that can be eaten
scope: A herb from Asia grown for its pods of edible seeds, also called a chickpea; not the pea eaten
  fresh from the garden and not a bean plant grown for its leaves.
examples:
- The chickpea plant grows short pods in the dry fields.
- Farmers plant chickpea plants for the seeds inside their pods.
