simpleMeaning: a child's rocking chair with the seat set between two flat sides cut to look like an animal,
  such as a swan or duck
scope: A child's rocking chair with the seat set between two flat sides cut to look like an animal; not
  a plain rocking chair and not a toy animal.
examples:
- The child rocked on the shoofly shaped like a swan.
- A shoofly has its seat between two flat sides.
