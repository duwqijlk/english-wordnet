simpleMeaning: The usual small animal like a mouse that lives in the wide grass lands of the middle United
  States and south Canada
scope: This is the common small animal of the grass lands of the middle United States and south Canada,
  not a mouse kept as a pet and not a larger wild animal.
examples:
- We saw a prairie vole run through the tall grass near the road.
- A prairie vole made its home in the grass land of south Canada.
