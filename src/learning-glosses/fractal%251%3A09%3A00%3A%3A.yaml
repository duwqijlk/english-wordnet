simpleMeaning: In mathematics, a pattern of shapes that repeats at every size, so it cannot be shown by
  the old usual ways used for shapes
scope: This is a pattern that looks the same at every size, not one plain shape that ends after one repeat.
examples:
- A fractal can show the same pattern when you look closer and closer.
- The shape on the screen is a fractal made by a computer.
