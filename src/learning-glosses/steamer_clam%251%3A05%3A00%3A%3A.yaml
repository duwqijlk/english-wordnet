simpleMeaning: This clam has a thin shell long and round at the ends, lives where the sea meets the land
  in the United States and Europe, and people eat it.
scope: 'Also called steamer, long-neck clam, and soft-shell clam: a clam with a thin shell shaped like
  an egg, found on the coasts of the United States and Europe.'
examples:
- Steamer clams live on the coasts of the United States and Europe.
- People eat steamer clams, which have thin shells shaped like eggs.
