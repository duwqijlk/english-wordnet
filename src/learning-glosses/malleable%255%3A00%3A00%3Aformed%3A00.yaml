simpleMeaning: able to be shaped or bent, or pulled to make it longer
scope: 'Also called pliable, pliant and tensile: this is about a thing that can be shaped, bent or pulled
  out, not a thing that stays hard and breaks.'
examples:
- Gold is malleable and can be beaten into thin sheets.
- Warm clay is malleable, so the children shaped it easily.
