schema: oewn-learning-gloss-v2
senseId: 'repel%2:37:00::'
synsetId: 01812736-v
simpleMeaning: to make someone feel strong dislike and want to stay away
scope: This sense is about making someone dislike a thing and want to stay away, not about pushing a thing
  away by force and not about saying no to an idea in a blunt way.
examples:
- The smell of the old fish repelled him.
- Her rude manner repels many people.
