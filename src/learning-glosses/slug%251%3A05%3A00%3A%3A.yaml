simpleMeaning: A land creature with a long, slimy body and no hard shell.
scope: This is a land creature with no shell, not a unit of mass, nor a drink of liquor, nor a hard blow,
  nor the boxing blow.
examples:
- A slug crossed the garden path after the rain.
- Slugs ate the young lettuce leaves.
