simpleMeaning: A way of tracing family lines through the mother and her mother's line
scope: A way of tracing family lines through the mother and her mother's line; not patrilineality, which
  traces them through the father.
examples:
- Matrilineality traces descent through the mother's line.
- In a system of matrilineality, a child's line is traced through the mother.
