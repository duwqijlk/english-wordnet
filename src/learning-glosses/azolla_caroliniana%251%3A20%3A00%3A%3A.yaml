simpleMeaning: A small water fern that floats on the surface, from the east of the United States to tropical
  America; now found in west and south Europe.
scope: This is a small fern that floats on water, not a fern that grows on land; also called floating
  fern, mosquito fern and Carolina pond fern.
examples:
- Azolla caroliniana floated on the still water of the pond.
- We saw Azolla caroliniana covering the top of the slow river.
