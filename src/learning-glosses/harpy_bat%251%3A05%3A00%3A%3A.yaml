  of several kinds of the group called Nyctimene.
scope: Also called harpy, tube-nosed bat and tube-nosed fruit bat, this is a fruit-eating bat with tube-shaped
  nose holes.
examples:
- The harpy bat hung upside down in the tree.
- A harpy bat eats fruit at night.
