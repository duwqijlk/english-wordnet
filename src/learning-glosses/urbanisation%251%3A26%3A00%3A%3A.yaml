simpleMeaning: The state of having become like a city.
scope: The state of having become like a city, with urbanization as another name for this sense; not the
  social process by which cities grow, a different sense of the same word.
examples:
- The urbanisation of the town was clear from the number of people living in built-up areas.
- High urbanisation in the area meant most people lived in towns rather than in the country.
