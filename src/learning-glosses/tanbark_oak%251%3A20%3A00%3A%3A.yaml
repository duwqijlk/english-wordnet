simpleMeaning: a tree that stays green all year, grows on the Pacific coast, has big tough leaves, and
  gives bark used to make leather
scope: This is a tree of the Pacific coast that keeps its leaves all year; not a tree that loses its leaves
  in winter and not a tree grown for its wood.
examples:
- The tanbark oak keeps its leaves through the winter.
- We saw a tanbark oak on the Pacific coast.
