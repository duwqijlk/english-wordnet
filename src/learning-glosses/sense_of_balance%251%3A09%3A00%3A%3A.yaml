simpleMeaning: A feeling system in the inner ear that tells you which way your head is pointing
scope: 'Also called equilibrium, labyrinthine sense, sense of equilibrium, or vestibular sense: the feeling
  system in the inner ear that tells you which way your head points, not hearing and not the sense of
  touch.'
examples:
- His sense of balance kept him upright on the beam.
- A blow to the ear can harm the sense of balance.
