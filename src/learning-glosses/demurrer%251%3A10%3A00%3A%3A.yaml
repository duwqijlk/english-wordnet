simpleMeaning: In law, a court paper that says the other side's written case should not stand
scope: This is a court paper that objects to the other side's written case, also called demur and demurral;
  not a mere disagreement and not a plea of guilty.
examples:
- The demurrer was filed before the trial began.
- Her demurrer asked the judge to throw out the claim.
