simpleMeaning: Dry flakes of skin come off in any of several disorders of the skin
scope: Any of several disorders of the skin in which dry flakes come off, not a single named disease and
  not a skin problem that makes blisters.
examples:
- The doctor said the pityriasis was why dry flakes of skin kept coming off.
- Her pityriasis made dry flakes of skin fall onto her shoulders.
