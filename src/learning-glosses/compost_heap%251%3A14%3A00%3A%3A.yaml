simpleMeaning: Left to break down, animal waste, plant matter, and other rotted things turn into food
  for the soil in this pile.
scope: Also called a compost pile, this is where animal waste, plant matter, and other rotted things are
  left to break down into food for the soil.
examples:
- He threw the grass cuttings on the compost heap.
- They left the fallen leaves on the compost heap to break down.
