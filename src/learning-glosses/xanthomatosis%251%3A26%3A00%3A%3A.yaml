simpleMeaning: The body handles fats in a troubled way in this skin trouble, and raised spots spread over
  much of it, above all on the elbows and knees
scope: Cholesterosis cutis, lipid granulomatosis, lipoid granulomatosis and xanthoma multiplex are other
  names for this skin trouble, in which raised spots spread over much of the body, above all on the elbows
  and knees, and often go with a trouble in how the body handles fats.
examples:
- Raised spots on the elbows and knees mark xanthomatosis.
- Over much of the body, raised spots spread in xanthomatosis.
