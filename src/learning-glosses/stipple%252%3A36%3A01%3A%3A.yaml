senseId: 'stipple%2:36:01::'
synsetId: 01699668-v
simpleMeaning: to make an even dark area, or one that fades slowly, by using many small short touches
  of paint or ink
scope: This sense is about making an even dark area, or one that fades slowly, with many small touches
  of paint or ink. It is not cutting into a surface with dots, and not just putting paint on in small
  dots.
examples:
- She stippled the sky in ink to make a soft grey shadow.
- He stippled the corner of the drawing so the dark part faded slowly.
