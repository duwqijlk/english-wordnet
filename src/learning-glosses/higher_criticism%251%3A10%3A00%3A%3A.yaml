simpleMeaning: The scientific study of the writings of the Bible to work out where they came from and
  what they mean.
scope: It is the careful study of Bible writings for their origin and meaning, not a judgment of a book's
  worth and not the simple reading of the Bible.
examples:
- Her higher criticism of the text traced its origin to two older sources.
- In his course on higher criticism, students asked when each book of the Bible was written.
