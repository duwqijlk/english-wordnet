simpleMeaning: a nose that grows big, with wide skin pores, red skin, and many blood vessels showing;
  often linked to drinking too much alcohol
scope: Also called brandy nose, copper nose, hammer nose, hypertrophic rosacea, potato nose, rum-blossom,
  rum nose, and toper's nose; not a red nose from a cold and not a bruise on the nose.
examples:
- His rhinophyma made his nose look swollen and red.
- The doctor said the rhinophyma came from years of heavy drinking.
