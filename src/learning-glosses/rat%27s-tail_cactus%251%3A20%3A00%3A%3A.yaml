simpleMeaning: A tropical American cactus commonly grown, with slender creeping stems and very large showy
  crimson flowers that last for several days.
scope: Another name for rattail cactus, this same tropical American plant; not another kind of trailing
  cactus.
examples:
- The rat's-tail cactus produced very large crimson flowers that stayed showy for days.
- A rat's-tail cactus hung from the basket, its slender creeping stems reaching the floor.
