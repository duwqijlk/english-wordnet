simpleMeaning: put in a set order by level, from the lowest level to the highest
scope: This means put in order by level, also called ranked and stratified. It is not put in order by
  name, size, or time.
examples:
- The jobs are graded by pay and skill.
- Students were placed in graded groups by level.
