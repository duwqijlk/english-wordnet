simpleMeaning: a person who bites and crushes something again and again with the teeth, especially a person
  who does this with tobacco
scope: A person who uses the teeth in this way, especially with tobacco; not the food or tobacco itself.
examples:
- He was a tobacco chewer for many years.
- The old chewer sat outside and worked a piece of tobacco in his mouth.
