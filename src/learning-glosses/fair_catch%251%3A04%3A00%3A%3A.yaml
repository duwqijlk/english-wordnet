simpleMeaning: In American football, taking a kicked ball out of the air by a defender who has waved that
  they will not run, so they should not be tackled.
scope: In American football, taking a kicked ball out of the air by a defender who has waved that they
  will not run, not an ordinary catch and not a tackle.
examples:
- He called for a fair catch and waved his arm.
- The fair catch gave his team the ball without a tackle.
