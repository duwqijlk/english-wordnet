simpleMeaning: a wheel with many pins, each pin set at a right angle to the outer edge of the wheel
scope: This is the wheel with many pins around its edge, not the round firework and not the paper toy
  that spins in the wind.
examples:
- The game pinwheel turned and stopped with the pointer on the winning number.
- She spun the pinwheel, which has small pins set around its rim.
