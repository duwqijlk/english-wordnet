simpleMeaning: poetry with no rhymes, usually written in lines of ten beats with the stress on every second
  beat
scope: Poetry with no rhymes and a set beat, not rhymed poetry and not free verse with no set beat.
examples:
- Shakespeare wrote most of his plays in blank verse.
- The poem was blank verse, with no rhymes but a steady beat.
