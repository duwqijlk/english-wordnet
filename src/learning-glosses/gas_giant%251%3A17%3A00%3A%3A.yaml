simpleMeaning: One of the four planets farthest from the sun, far bigger than Earth and made of light,
  airy matter, like Jupiter.
scope: This is one of the four farthest planets from the sun, far bigger than Earth and made of light,
  airy matter, not a small rocky planet like Mars and not a star that makes its own light.
examples:
- Jupiter is the largest gas giant in our solar system.
- Scientists study gas giants to learn how planets form.
