simpleMeaning: a system of written signs used by people who plan dances, to show the steps and moves
scope: This is the system of written signs itself, used by people who plan dances to show the steps and
  moves; not a live dance show, and not just one showing of a dance in signs.
examples:
- She read the choreography from the written signs before teaching the dance.
- The old book records the choreography in a system of signs.
