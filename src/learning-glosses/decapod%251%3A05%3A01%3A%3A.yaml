simpleMeaning: As a rule, these shell animals have five pairs of legs for moving, each leg joined to a
  part of the middle of the body
scope: Decapod crustacean is another name for these shell animals, which as a rule have five pairs of
  legs for moving, each joined to a part of the middle of the body.
examples:
- The decapod walked on its ten legs.
- Crabs and lobsters are decapods, with five pairs of legs for moving.
