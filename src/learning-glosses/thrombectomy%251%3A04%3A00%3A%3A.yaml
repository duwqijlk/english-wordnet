simpleMeaning: an operation to take a blood clot out of a blood vessel
scope: An operation that takes a blood clot out of a blood vessel, not the clot itself and not the swelling
  of a vein where a clot has formed.
examples:
- The surgeon did a thrombectomy to take the clot out of her leg.
- After the thrombectomy, blood could flow through the vessel again.
