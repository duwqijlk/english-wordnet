simpleMeaning: a sweet-smelling liquid that a man rubs on his face once he has cut off his beard
scope: Also called after-shave, this is a sweet-smelling liquid a man rubs on his face once he has cut
  off his beard, not shaving cream used while he cuts it and not a face cream for softening skin.
examples:
- She bought him a bottle of after-shave lotion for his birthday.
- He rubbed the after-shave lotion on his face and smiled at the sweet smell.
