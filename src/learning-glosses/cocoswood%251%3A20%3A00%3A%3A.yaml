simpleMeaning: the hard stuff from a granadilla tree, used to make music makers, especially clarinets
scope: This is the hard stuff from a granadilla tree, used to make music makers; cocuswood and granadilla
  wood are other names for this sense, and it is not the tree itself or wood used for building.
examples:
- The clarinet was made from cocoswood, which gave it a warm sound.
- He chose cocoswood for the new clarinet because it holds its shape well.
