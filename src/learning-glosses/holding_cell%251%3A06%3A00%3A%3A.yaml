simpleMeaning: A jail room in a court building where people accused of a crime are kept during their trial.
scope: A jail room in a court building for accused people during trial, not a prison cell for serving
  a sentence and not a police lock-up.
examples:
- They kept him in a holding cell during the trial.
- The holding cell was in the basement of the courthouse.
