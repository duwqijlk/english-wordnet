simpleMeaning: One of a row of sloping beams lying next to each other, that hold up a roof.
scope: One of a row of sloping beams lying next to each other, that hold up a roof; also called a balk
  and a rafter; not something unseen that gets in the way of an act or slows it down.
examples:
- The baulk above the doorway had cracked.
- Carpenters set the baulks in place before laying the roof.
