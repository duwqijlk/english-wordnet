simpleMeaning: Money paid in secret by a seller to a buyer, so the buyer will agree to the deal.
scope: A commercial bribe paid in secret by a seller to a purchasing agent, to win the deal.
examples:
- The agent took a kickback from the supplier for placing the order.
- A kickback of five hundred pounds sealed the contract.
