simpleMeaning: a feeling of being sure and hopeful that things will go well
scope: This is a hopeful feeling that things will go well. It is not a secret that someone tells another
  person, and not trust in your own power to do something well.
examples:
- Public confidence in the economy grew when more people found jobs.
- There is growing confidence that the weather will stay fine for the trip.
