simpleMeaning: the act of taking another person's words or thoughts and passing them off as your own
scope: Taking another person's words or thoughts and passing them off as your own; plagiarism and plagiarization
  are other names for this sense, not honest quoting and not a spelling mistake.
examples:
- His essay was a case of plagiarisation.
- Plagiarisation is taking words that are not yours and passing them off as your own.
