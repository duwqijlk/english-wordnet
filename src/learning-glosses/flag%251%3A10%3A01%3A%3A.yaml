simpleMeaning: a list printed in every issue of a paper or magazine, usually on the page where the editors
  write, that names the paper and its editorial staff
scope: A list printed in every issue of a paper or magazine that names the paper and its editorial staff,
  not a cloth emblem and not a flat stone for paths.
examples:
- The flag of the paper lists the editor and her staff.
- I found his name in the flag on the second page.
