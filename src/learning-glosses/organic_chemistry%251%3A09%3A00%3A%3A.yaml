simpleMeaning: The branch of chemistry that studies carbon-containing compounds; first defined as the
  study of substances made by living things, it now also covers artificially made ones.
scope: The chemistry of carbon compounds, whether natural or artificial; not inorganic chemistry, which
  deals mainly with other elements, nor biochemistry, which focuses on living organisms.
examples:
- She teaches organic chemistry at the university.
- Organic chemistry now covers artificially made carbon compounds as well.
