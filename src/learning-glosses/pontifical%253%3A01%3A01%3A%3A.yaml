simpleMeaning: Coming from, ordered by, or under the pope or his office, seen as the one who follows the
  Apostles
scope: Coming from, ordered by, or under the pope or his office, seen as the one who follows the Apostles;
  papal, apostolic and apostolical are other names for this sense, not a rule made by a king and not a
  rule made by a church meeting.
examples:
- The pontifical order came from Rome.
- A pontifical letter set out the new rule.
