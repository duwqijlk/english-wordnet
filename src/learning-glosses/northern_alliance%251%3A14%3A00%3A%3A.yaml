simpleMeaning: A group of many peoples in Afghanistan who follow a mild form of Islam and stand together
  against the Taliban.
scope: A group of many peoples in Afghanistan, also called United Front; its near kin are the other groups
  in Afghanistan that stand against the Taliban.
examples:
- The Northern Alliance opposed the Taliban.
- The Northern Alliance brought together many peoples.
