simpleMeaning: a mark of the firm that puts out a book, set in the book, usually on the title page
scope: A publisher's mark set in a book, usually on the title page, not the title itself.
examples:
- The colophon was a small mark printed near the front of the book.
- She found the publisher's colophon on the title page.
