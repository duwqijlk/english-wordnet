simpleMeaning: This drug, sold as Pediapred or Prelone, brings down swelling and pain.
scope: A drug that brings down swelling, sold as Pediapred or Prelone; not a drug that kills germs.
examples:
- The doctor gave her prednisolone for the swelling in her knee.
- He took prednisolone, sold as Prelone, for a week.
