simpleMeaning: to hang about in a place, with no clear thing you are trying to do
scope: To hang about in a place with no clear thing you are trying to do; also called lurch, not the act
  of walking about quietly and in secret.
examples:
- He prowled around the square for an hour, with nowhere to go.
- Teenagers prowled the mall all afternoon, buying nothing.
