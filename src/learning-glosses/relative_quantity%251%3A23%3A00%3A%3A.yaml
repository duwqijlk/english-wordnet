simpleMeaning: an amount that is judged against a particular use or aim
scope: An amount judged against a particular use or aim, not a fixed amount and not a count of things.
examples:
- The relative quantity of flour depends on the size of the cake.
- For a small room, the relative quantity of paint needed is low.
