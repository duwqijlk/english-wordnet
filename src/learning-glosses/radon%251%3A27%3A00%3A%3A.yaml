simpleMeaning: A radioactive gas formed from radium, the heaviest of the gases that do not react with
  other things; found in nature, above all over granite, and a danger to health.
scope: Also called Rn and atomic number 86; not a solid metal.
examples:
- Radon can seep into homes built over granite.
- They tested the basement air for radon.
