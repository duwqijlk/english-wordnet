simpleMeaning: The main unit of money in the country it is named for, worth one hundred fils.
scope: A money unit worth one hundred fils, also called dirham; not the fils, its smaller part, and not
  the money of other lands.
examples:
- A United Arab Emirate dirham is worth one hundred fils.
- She paid with a United Arab Emirate dirham.
