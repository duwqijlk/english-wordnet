simpleMeaning: One of a group of round fungi whose ball-shaped body, when ripe, lets out a cloud of tiny
  spores.
scope: Also called a true puffball, a round fungus that lets out a cloud of spores when ripe, not the
  hard-skinned underground fungus that looks like a truffle of the other sense.
examples:
- The puffball burst and sent out a puff of spores.
- We found a puffball growing on the lawn after the rain.
