simpleMeaning: In weapons, getting their power to destroy from energy set free inside atoms.
scope: This is about weapons that get their force from energy inside atoms; nuclear is another name for
  this sense, not simply about atoms themselves or ordinary explosives.
examples:
- The treaty banned the testing of atomic weapons.
- An atomic bomb gets its force from energy freed inside atoms.
