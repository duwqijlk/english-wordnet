simpleMeaning: to carry something from one place to another, or to be the way it travels through
scope: 'Also called carry and channel, and another name for it is convey: this is passing heat, sound,
  or power along. It is not acting in a certain way, and not a person''s way of acting toward others.'
examples:
- Copper wires conduct electricity very well.
- Water conducts sound better than air does.
