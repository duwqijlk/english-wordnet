simpleMeaning: A print made by stone-printing.
scope: This sense is a print made by stone-printing, unlike the sense for a machine that prints from a
  flat face, its face of stone or metal treated to take in or throw off ink in the set pattern, and unlike
  the sense for making by lithography.
examples:
- The lithograph is a print made by stone-printing.
- Lithographs print.
