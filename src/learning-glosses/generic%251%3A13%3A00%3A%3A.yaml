simpleMeaning: Wine that does not qualify for a label naming its region or grape type, so it is labeled
  only with a made-up brand, a color, or a basic table-wine class.
scope: This is the wine sense, not the adjective meaning 'shared by a whole class' and not a no-brand
  product such as a medicine.
examples:
- The wine shop sells generics labeled simply 'red' or 'white', with no region named.
- A generic cannot put a place of origin or a grape variety on its label.
