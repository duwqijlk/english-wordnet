simpleMeaning: the main stalk or middle part of a plant, around which its leaves, flowers, and branches
  grow
scope: The main stalk or middle part of a plant that its leaves and branches grow around, not the neck
  bone that lets the head turn.
examples:
- The axis of the flower held the petals in place.
- New leaves grew along the plant's axis.
