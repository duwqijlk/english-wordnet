simpleMeaning: the row of small bones down the middle of the back that holds the body up and guards the
  cord of nerves inside
scope: back and spine are other names for this sense; the row of bones down the back, not the edge of
  a book's cover.
examples:
- The fall broke his backbone.
- A strong backbone holds the body upright.
