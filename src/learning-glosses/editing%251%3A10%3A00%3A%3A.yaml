simpleMeaning: The work of putting a piece of writing or a bill into a form that is fit to use.
scope: The work of putting a piece of writing or a bill into a form fit to use, not the writing itself.
examples:
- The editing of the novel took six months.
- Editing the bill kept the committee busy all week.
