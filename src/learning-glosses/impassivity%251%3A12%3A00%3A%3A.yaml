simpleMeaning: A lack of feeling, shown by no sign of joy, anger, or the like.
scope: Also called indifference, phlegm, stolidity, impassiveness, or emotionlessness, a lack of feeling
  shown by no sign of joy, anger, or the like.
examples:
- Her impassivity in the face of the news surprised them all.
- He answered with impassivity, his face giving nothing away.
