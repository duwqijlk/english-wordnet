simpleMeaning: all the speech sounds of one language that are not vowels, taken together
scope: All the speech sounds of one language that are not vowels, taken together, also called consonantal
  system; not the vowels of the language and not the sounds of all languages.
examples:
- English has its own consonant system.
- The consonant system of Welsh differs from that of English.
