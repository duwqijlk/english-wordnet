simpleMeaning: The group of people a head of state picks to run the main parts of the government and to
  give official advice
scope: A head of state's top advisers, not a piece of furniture and not a locked store for clothes.
examples:
- The cabinet met to talk about the new law.
- The president chose her cabinet from close advisers.
