simpleMeaning: Meant first of all to amuse people, not to be serious or to deal with deep ideas.
scope: This is not a happy, worry-free mood or a small amount of food; it describes works made mainly
  to amuse.
examples:
- After the tragedy, she chose a light comedy to take her mind off things.
- The magazine is full of light verse and cartoons rather than serious reporting.
