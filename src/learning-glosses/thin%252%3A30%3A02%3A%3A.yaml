simpleMeaning: To make a mixture act or taste less strongly than before.
scope: This is weakening the force or taste of a mixture, not an object growing narrower; cut and reduce
  are other names for the same act.
examples:
- He thinned the lemonade with water so it was less tart.
- The medicine tasted harsh, so she thinned it with a little juice.
