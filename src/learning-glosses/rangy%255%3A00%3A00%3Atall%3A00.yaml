simpleMeaning: tall and thin, with long thin arms and legs
scope: This means tall and thin with long arms and legs, also called lanky, also called gangly and also
  called gangling. It is not about having much room to move, and not about moving from place to place.
examples:
- The rangy boy could reach the top shelf with ease.
- She is a rangy runner with very long legs.
