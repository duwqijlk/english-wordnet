simpleMeaning: A small water egg-layer, thick-furred, from Australia and Tasmania, bearing a wide bill
  and a tail, feet webbed, the only kind from Ornithorhynchidae.
scope: This sense is also called platypus, duck-billed platypus, and duckbilled platypus, a small water
  egg-layer, thick-furred, from Australia and Tasmania, bearing a wide bill and a tail, feet webbed, the
  only kind from Ornithorhynchidae, unlike the sense for a primitive fish of the Mississippi valley with
  a long paddle-shaped snout.
examples:
- Duckbills swim with webbed feet.
- The duckbill lays eggs.
