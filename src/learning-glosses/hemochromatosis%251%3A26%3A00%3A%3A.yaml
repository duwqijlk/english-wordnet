simpleMeaning: When the body stores far too much iron, this condition results, bringing tan or grey skin,
  a large liver, high blood sugar and damage to the pancreas and joints.
scope: Another name for the iron-storage condition also known as bronzed diabetes, iron-storage disease
  or iron overload, not a diet lacking iron or a liver infection.
examples:
- Hemochromatosis is often treated by removing excess iron from the blood.
- Untreated hemochromatosis can damage the pancreas and joints.
