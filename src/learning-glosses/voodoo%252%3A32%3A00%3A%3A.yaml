senseId: 'voodoo%2:32:00::'
synsetId: 00779436-v
simpleMeaning: to put a person under a magic spell, or to seem to do so
scope: This is to use, or seem to use, magic on a person. It is not the religion itself, not the people
  who follow it, and not a small object believed to have magic power.
examples:
- In the story, an old woman voodooed the man, and he could not leave the house.
- He felt as if someone had voodooed him, for bad luck followed him all week.
