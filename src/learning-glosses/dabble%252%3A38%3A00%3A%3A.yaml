simpleMeaning: to put a foot or hand into water or another liquid for a short time only
scope: This sense is putting a foot or hand in liquid for a short time. It is not swimming or washing,
  and not doing a job or hobby a little at a time.
examples:
- She dabbled her toes in the cool water of the stream.
- The children dabbled their hands in the bowl of water.
