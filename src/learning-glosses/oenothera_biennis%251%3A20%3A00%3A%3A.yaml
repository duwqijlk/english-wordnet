simpleMeaning: A rough plant of the east of North America that lives two years, with yellow flowers that
  open in the evening; now at home in Europe
scope: Also called common evening primrose and German rampion; a rough plant with yellow flowers that
  open in the evening, not a plant with flowers that open in the morning.
examples:
- Oenothera biennis opened its yellow flowers as the sun went down.
- We saw Oenothera biennis growing along the road in Europe.
