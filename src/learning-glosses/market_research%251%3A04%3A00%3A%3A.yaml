simpleMeaning: How goods and services get from the people who make them to the people who buy them is
  found out by careful study
scope: Also called marketing research, this is a careful study of how goods and services get from makers
  to buyers, not selling and not a list of prices.
examples:
- Market research showed that buyers wanted smaller packs.
- The firm paid for market research before it opened the new shop.
