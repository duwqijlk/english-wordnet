simpleMeaning: In a way that joins several separate tunes at the same time, so they sound together
scope: This describes music in which several separate tunes sound at the same time; not music with one
  tune only, and not voices singing the same tune together.
examples:
- The piece was polyphonically composed for four voices.
- She sang polyphonically with the choir.
