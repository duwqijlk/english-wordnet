senseId: 'laissez_passer%1:10:00::'
synsetId: 06703153-n
simpleMeaning: A person who holds this paper may do a thing, and nothing in it stops them
scope: Also called a pass, this is a paper that shows a person may do something with no limits, not an
  identity paper and not a ticket for one trip.
examples:
- The reporters showed their laissez passer at the gate.
- With a laissez passer, she could move freely through the zone.
