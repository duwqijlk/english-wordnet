simpleMeaning: A stiff head covering made of straw, with a flat top.
scope: Also called sailor, boater, skimmer, leghorn, straw hat, and Panama, this is a stiff head covering
  made of straw, with a flat top; other straw head coverings have other shapes.
examples:
- He wore a Panama hat in the sun.
- Her Panama hat was made of straw with a flat top.
