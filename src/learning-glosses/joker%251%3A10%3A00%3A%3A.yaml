simpleMeaning: In a document or a planned law, a part that is easy to miss but changes what the whole
  thing means
scope: This sense is a part in a document or a planned law that is easy to miss but changes what the whole
  thing means, not a person who tells jokes and not the extra card in a pack.
examples:
- The joker in the contract meant she had to pay extra money.
- No one saw the joker in the bill until the law was passed.
