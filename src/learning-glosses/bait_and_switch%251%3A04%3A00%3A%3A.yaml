simpleMeaning: Shoppers are drawn in by a very cheap advertised item, then talked into buying a dearer
  one instead.
scope: 'It is a dishonest selling trick: shoppers are drawn in by a very cheap advertised item and then
  talked into buying a dearer one instead.'
examples:
- The bait and switch drew shoppers in with a cheap offer, then sold them something dearer.
- Customers complained about the bait and switch after paying more than the advertised price.
