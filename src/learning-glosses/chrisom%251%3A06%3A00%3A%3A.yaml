simpleMeaning: A holy oil, a mix of oil and sweet-smelling tree sap, blessed for use in church
scope: A holy oil, a mix of oil and sweet-smelling tree sap, blessed for use in church; chrism and holy
  oil are other names for this sense, not plain oil for cooking and not a scent for the body.
examples:
- The chrisom was kept in a small silver box.
- Chrisom is another name for the consecrated oil.
