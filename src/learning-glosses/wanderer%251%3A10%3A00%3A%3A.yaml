simpleMeaning: a computer program that moves through the internet looking for things anyone can see, to
  add them to a database (a store of information) that a search tool can search
scope: 'Also called spider: a program that looks through the internet for things to add to a store of
  information; it is not a person who lives without staying long in one place.'
examples:
- The wanderer searched the internet each night for new pages that anyone could see.
- A search tool used the store of facts built up by the wanderer.
