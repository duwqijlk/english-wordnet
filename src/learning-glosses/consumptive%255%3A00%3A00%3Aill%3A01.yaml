simpleMeaning: Ill with tuberculosis of the lungs, or to do with that illness.
scope: Of a person ill with tuberculosis of the lungs, or of a thing to do with that illness; not the
  use for what tends to use things up, often wastefully.
examples:
- The patient was consumptive and coughed all night.
- Her cough was consumptive, coming from tuberculosis of the lungs.
