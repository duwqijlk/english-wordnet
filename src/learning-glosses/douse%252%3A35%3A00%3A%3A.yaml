senseId: 'douse%2:35:00::'
synsetId: 01579924-v
simpleMeaning: to wet a thing, give it a coat, or soak it, by putting it in liquid only for a moment
scope: 'Also called plunge, dip, or dunk: to dip a thing in liquid for a moment, not to put out a fire
  and not to pour liquid over something.'
examples:
- She doused the garment in the cleaning solution and lifted it out again.
- He doused the brush in the paint before touching the wall.
