simpleMeaning: A slit in a piece of clothing that is shut with a zip or with buttons hid under a fold
  of cloth.
scope: This is a slit in a piece of clothing shut with a zip or hidden buttons, not a pocket or a seam,
  and it is also called a fly.
examples:
- The fly front of his trousers was zipped shut.
- She sewed a fly front into the skirt.
