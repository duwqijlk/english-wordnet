simpleMeaning: Any of a set of drugs against low mood that stop a brain chemical, monoamine oxidase, from
  working, so other brain chemicals, monoamines, build up
scope: Any of a set of drugs against low mood that stop a brain chemical, monoamine oxidase, from working,
  so other brain chemicals, monoamines, build up; monoamine oxidase inhibitor is another name for this
  sense, and its nearest kin are other drugs against low mood.
examples:
- Her doctor gave her an MAOI for her low mood.
- MAOIs stop monoamine oxidase from working in the brain.
