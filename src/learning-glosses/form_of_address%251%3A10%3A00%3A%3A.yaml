simpleMeaning: A name or word put before a person's name, or used in its place, to show their rank or
  job, such as 'Mr.' or 'General'.
scope: A word showing a person's rank or job, put before their name; title is another name for this sense,
  not the person's own name and not a term of praise.
examples:
- His form of address at work was 'Doctor', not his first name.
- She wrote the letter using the form of address 'General'.
