simpleMeaning: A player kept on the bench who joins the game when a starter leaves it
scope: A player kept on the bench who joins the game when a starter leaves it, also called reserve, not
  a player able to fill many spots and not the act of putting one thing in place of another.
examples:
- The substitute scored within minutes of coming on.
- He spent most of the match as a substitute on the bench.
