simpleMeaning: a kind of germ that usually comes in pairs and stays purple when stained with a dye in
  a lab test
scope: A kind of germ that usually comes in pairs, not a germ that lives alone or in long chains.
examples:
- The lab found diplococcus in the sample under the microscope.
- Diplococcus often shows up in pairs when doctors test a throat swab.
