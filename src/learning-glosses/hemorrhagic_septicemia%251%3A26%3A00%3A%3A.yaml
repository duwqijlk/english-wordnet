simpleMeaning: A sudden catching sickness that brings lung sickness and sickness of the blood.
scope: A sudden catching sickness with lung sickness and blood sickness; pasteurellosis is another name
  for this sense, and this is not a long-lasting sickness or one that hits only the lungs.
examples:
- The cattle died of hemorrhagic septicemia within days of catching it.
- Vets worked to stop hemorrhagic septicemia spreading through the herd.
