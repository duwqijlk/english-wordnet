simpleMeaning: The soil gets richer when a crop still growing is turned into it
scope: A crop still growing that is turned under the soil to make it richer, not a crop left to grow and
  not animal waste used on the soil.
examples:
- The farmer planted a green manure crop and plowed it in before spring.
- Green manure feeds the soil as it breaks down.
