simpleMeaning: A set speech of praise.
scope: This sense is also called eulogy, paean, and panegyric, for a set speech of praise, unlike the
  sense for, in old Greece, a song of praise, especially one sung to call on or thank a god.
examples:
- The pean was a set speech of praise.
- Peans are set speeches of praise.
