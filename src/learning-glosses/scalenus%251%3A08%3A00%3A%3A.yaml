simpleMeaning: One of four pairs of muscles in the neck, it runs from the neck bones to the second rib
  and helps move the neck and helps in breathing.
scope: Also called scalene muscle and musculus scalenus, it is one of four pairs of muscles in the neck,
  running down to the second rib and not stopping at the neck.
examples:
- The scalenus moved when she turned her neck.
- The scalenus worked when he breathed.
