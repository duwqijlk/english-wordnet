simpleMeaning: A court paper that lets police seize a law-breaker and bring that person before a judge.
scope: 'Also called bench warrant: a court paper that lets police seize a law-breaker and bring that person
  before a judge, not a search paper and not a fine.'
examples:
- The judge signed an arrest warrant for the thief.
- Police held an arrest warrant when they came to the house.
