simpleMeaning: to make the sound that an owl makes
scope: This is the verb for an owl making its sound. It is not the sound itself as a noun, and not a loud
  shout from people to show they dislike something.
examples:
- An owl hooted in the tree outside my window.
- We heard owls hooting through the night.
