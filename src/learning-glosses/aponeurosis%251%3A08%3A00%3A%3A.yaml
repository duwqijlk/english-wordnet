simpleMeaning: a flat sheet of tough tissue, deeper and thicker than the tissue near the skin, that joins
  a muscle to a bone, shaped like a flattened tendon
scope: A flat sheet of tough tissue that joins muscle to bone; not a tendon itself, though it looks like
  one flattened.
examples:
- The aponeurosis across his belly held the muscle to the bone.
- Surgeons cut through the aponeurosis to reach the muscle below.
