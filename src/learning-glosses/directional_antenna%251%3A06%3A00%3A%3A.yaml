simpleMeaning: A device that sends or takes in signals in only one narrow direction
scope: A device that sends or takes in signals in one narrow direction only, not one that works in all
  directions and not a wire.
examples:
- The directional antenna picks up signals from one narrow direction.
- They aimed the directional antenna at the far tower.
