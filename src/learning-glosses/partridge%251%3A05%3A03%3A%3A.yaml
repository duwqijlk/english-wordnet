simpleMeaning: a bird in the eastern United States and Canada that people value and hunt for sport or
  food
scope: A live bird hunted in the eastern United States and Canada, not the meat sense of partridge and
  not the South American bird sense.
examples:
- In eastern Canada, hunters went out early to hunt partridge.
- The partridge hid in low bushes near the woods in Maine.
