simpleMeaning: Speaking and acting in a straight, open way, with no hints and no holding back.
scope: Speaking and acting in a straight, open way, with no hints and no holding back; blunt, frank, candid,
  forthright, outspoken, free-spoken and point-blank are other names for this sense, not evasive and not
  sly.
examples:
- Her plainspoken answer left no doubt about what she meant.
- He was plainspoken and to the point.
