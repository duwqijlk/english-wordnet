simpleMeaning: In grammar, a form of a word used when there are two of something, not one and not more
  than two
scope: A grammar form for two things, not the singular for one and not the plural for more than two.
examples:
- In ancient Greek, the dual was used when speaking of two people.
- The dual form has merged with the plural in modern Greek.
