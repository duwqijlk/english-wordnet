simpleMeaning: A person who gives their word that they will do a thing
scope: A person who gives their word that a thing will be done, also called a promiser; not the person
  who is given the word and not a person with no part in it.
examples:
- The promisor signed the paper in front of two witnesses.
- If the promisor fails to pay, the deal falls through.
