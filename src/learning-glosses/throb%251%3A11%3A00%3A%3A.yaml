simpleMeaning: A single strong beat of the heart that comes fast and can be felt
scope: 'Also called pounding and throbbing: one fast strong beat of the heart, not a shake from fear or
  excitement and not the steady swelling and shrinking of a beat.'
examples:
- He felt a throb in his chest after the run.
- A throb in her head kept her awake.
