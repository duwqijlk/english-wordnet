simpleMeaning: Made so that danger is kept away by putting things right on its own when something goes
  wrong.
scope: Made so that danger is kept away by putting things right on its own when something goes wrong,
  not a warning light and not a manual shut-off.
examples:
- The lift has a fail-safe brake that stops it if the cable snaps.
- A fail-safe device in a nuclear weapon deactivates it by itself if there is an accident.
