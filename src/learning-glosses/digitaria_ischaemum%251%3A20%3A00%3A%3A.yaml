simpleMeaning: A weed, a low summer grass that lives one year and spreads by seed and by rooting at the
  lowest joints of its stems.
scope: 'Also called smooth crabgrass: a low summer grass that lives one year and spreads by seed, not
  a tall crop grass and not a plant grown for food.'
examples:
- Digitaria ischaemum spread across the lawn by seed.
- Digitaria ischaemum roots at the lowest joints of its stems.
