simpleMeaning: In the Presbyterian church, the person who leads a synod or general assembly, a large meeting
  of church leaders
scope: This is the church officer who leads a large church meeting, not a person who settles arguments
  between people, not a person who leads a debate, and not a substance used to slow down neutrons in a
  nuclear reactor.
examples:
- The moderator opened the general assembly of the Presbyterian church.
- As moderator, she led the synod and kept the church meeting in order.
