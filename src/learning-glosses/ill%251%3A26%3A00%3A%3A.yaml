simpleMeaning: A sickness or bodily disorder, often lasting, that is a reason to complain.
scope: This is a bodily problem; it is not the adverb for doing something badly and not the adjective
  for something harmful.
examples:
- The clinic treats everyday ills such as colds and sore throats.
- He complained of various ills, none of them serious.
