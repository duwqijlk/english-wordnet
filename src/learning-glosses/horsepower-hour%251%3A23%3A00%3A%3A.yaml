simpleMeaning: A unit of work, the amount done by one unit of power in sixty minutes
scope: A unit for measuring work done over time, not a unit of power alone and not a unit of distance.
examples:
- The motor used three horsepower-hours of work in one day.
- Engineers measure the job in horsepower-hours.
