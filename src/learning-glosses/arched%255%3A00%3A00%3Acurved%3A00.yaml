simpleMeaning: having the shape of a curve that goes up and then down, like the top of a door
scope: Also called bowed, and another name for this sense is arching; it is about having that curved shape,
  not about a thing built with such a part.
examples:
- The room had a high, arched ceiling.
- Her arched eyebrows rose when she heard the news.
