simpleMeaning: Rich and costly in a way that pleases the senses
scope: This sense is about rich comfort and pleasure for the senses, also called luxurious, luxuriant
  and epicurean. It is not about a woman's body having a large chest and pleasing curves.
examples:
- They spent the weekend in a voluptuous hotel suite with soft beds and fine food.
- The voluptuous feast pleased every sense, with rich food, music and sweet smells.
