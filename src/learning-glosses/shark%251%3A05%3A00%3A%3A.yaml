simpleMeaning: one of many long fish that live mostly in the sea and eat meat, with hard skin, small tooth-like
  scales, and a tail fin with a larger top part
scope: The sea fish itself, not a greedy and dishonest person, and not the acts of hunting such fish or
  of tricking people.
examples:
- A shark swam close to the boat in deep sea water.
- We saw a large shark with rough, hard skin near the rocks.
