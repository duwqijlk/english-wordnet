simpleMeaning: spread out in many directions, in no neat or even order
scope: 'Also called sprawling, rambling or straggling: spread out in many directions in an untidy way,
  not the sense of growing or spreading thinly and unevenly, with few things in each place.'
examples:
- His straggly hair stuck out in every direction.
- Straggly vines spread across the old fence in all directions.
