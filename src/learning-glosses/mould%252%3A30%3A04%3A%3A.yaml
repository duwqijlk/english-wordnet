simpleMeaning: to go bad in damp air, growing a soft coat
scope: To spoil and grow a soft coat in damp air, not to shape clay and not the rich earth in a garden;
  mold and mildew are other names for this sense.
examples:
- The furniture moulded in the damp old house.
- Bread left in a wet cupboard will mould.
