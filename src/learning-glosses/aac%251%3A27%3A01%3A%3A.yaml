simpleMeaning: A light, ready-made building block of concrete, made in the mid-1920s, that gives a wall
  its shape, keeps heat in or out, and stands up to fire and mould
scope: A light ready-made concrete block for building; autoclaved aerated concrete, autoclaved cellular
  concrete, autoclaved concrete, autoclaved lightweight concrete and porous concrete are other names for
  this sense, not ordinary heavy concrete poured on site.
examples:
- AAC blocks keep the house warm in winter.
- The builders used AAC for the new walls.
