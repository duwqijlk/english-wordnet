simpleMeaning: a band along an edge, made to look nice, with a surface that is sunk in or raised up
scope: 'Also called border, and another name for it is moulding: this is the sunk-in or raised surface
  on an edge itself, not a separate thin strip put on an edge and not a clay or wax model.'
examples:
- The molding along the top edge of the wall has a surface that dips in and out.
- She pointed to the raised molding on the edge of the old wooden door.
