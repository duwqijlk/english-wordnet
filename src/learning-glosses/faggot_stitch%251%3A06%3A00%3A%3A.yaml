simpleMeaning: The join that ties a set of side-by-side threads together in openwork needlework.
scope: The join that ties a set of side-by-side threads together in openwork needlework, also called a
  fagot stitch; not a plain seam and not a hem.
examples:
- She used a faggot stitch to join the two panels.
- The faggot stitch holds the threads in a neat open row.
