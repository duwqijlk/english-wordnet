simpleMeaning: A small or narrow hollow in the side of a steep rock face or a mountain.
scope: A small or narrow hollow in the side of a steep rock face or a mountain, not a bay of the sea and
  not a large cave.
examples:
- The climbers sheltered in a cove in the cliff.
- A cove in the mountain hid the small hut from view.
