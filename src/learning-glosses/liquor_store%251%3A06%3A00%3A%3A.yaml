simpleMeaning: A shop that sells drinks that contain alcohol, to be drunk somewhere else
scope: 'Also called an off-licence and a package store: a shop that sells drinks that contain alcohol
  to be drunk elsewhere, not a bar where people drink on the spot and not a shop that sells other goods.'
examples:
- She bought a bottle of wine at the liquor store.
- The liquor store closes at ten.
