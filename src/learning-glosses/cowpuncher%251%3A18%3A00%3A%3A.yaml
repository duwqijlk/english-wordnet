simpleMeaning: A hired worker who looks after cattle and does other jobs from horseback.
scope: This is a hired worker on horseback who tends cattle, not a farm owner or a herder on foot; also
  called cowherd, cowhand, cowpoke, and puncher.
examples:
- The cowpuncher rode beside the herd all day.
- A cowpuncher helped load the cattle.
