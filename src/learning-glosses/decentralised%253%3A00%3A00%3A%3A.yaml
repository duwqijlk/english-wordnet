senseId: 'decentralised%3:00:00::'
synsetId: 01111666-a
simpleMeaning: taken away from one main place where things were kept close, and, most of all, with power
  and work spread out to smaller local groups that run things
scope: This is about power or work moved away from one main place to smaller local groups; decentralized
  is another name for this sense, not power kept in one main place and not a thing simply moved from one
  place to another.
examples:
- The decentralised school system lets each town run its own schools.
- After the change, the decentralised offices made their own choices.
