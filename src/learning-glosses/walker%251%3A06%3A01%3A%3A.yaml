simpleMeaning: a light frame, called a Zimmer, you stand inside, with small rubber wheels and hand grips,
  that helps people who cannot walk well or old people to walk
scope: A frame that helps grown people who cannot walk well, not the frame that helps a baby learn to
  walk.
examples:
- After her fall, she used a walker to get to the bathroom.
- The nurse brought a walker so the old man could walk down the hall.
