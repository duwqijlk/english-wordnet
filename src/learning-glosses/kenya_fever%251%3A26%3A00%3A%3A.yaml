simpleMeaning: A sickness, common in India and round the Mediterranean Sea, caused by a tiny germ carried
  to people by a red-brown hard tick that lives on dogs and other animals
scope: Also called boutonneuse fever, Indian tick fever, or Marseilles fever; this is the tick-carried
  sickness of India and the Mediterranean lands, not other fevers spread by insects.
examples:
- Kenya fever is spread by ticks.
- He caught Kenya fever while travelling in India.
