simpleMeaning: A man-made kind of matter that gives off rays, past uranium in the list of basic kinds;
  made by firing carbon bits at curium; seven kinds are known.
scope: A man-made kind of matter that gives off rays, also called No and nobelium; set apart from other
  man-made kinds of matter and from natural kinds of matter.
examples:
- Atomic number 102 was made in a laboratory, not found in nature.
- Scientists know seven kinds of atomic number 102.
