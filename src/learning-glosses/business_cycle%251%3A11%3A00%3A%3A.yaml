simpleMeaning: a repeated rise and fall in trade, made up of slump and recovery and growth and fall
scope: A repeated rise and fall in trade, made up of slump and recovery and growth and fall, also called
  trade cycle, and not a single slump or a one-time boom.
examples:
- The business cycle turned from growth to slump.
- Economists watch the business cycle for signs of recovery.
