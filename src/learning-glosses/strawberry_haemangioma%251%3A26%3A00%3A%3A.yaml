simpleMeaning: a bright red raised mark of blood vessels near the skin, present at birth and shaped like
  a small red fruit, that usually gets smaller as the child grows
scope: 'Also called strawberry hemangioma: a red birthmark of blood vessels, not a flat red mark and not
  a cancer.'
examples:
- The baby was born with a strawberry haemangioma on her cheek.
- The doctor said the strawberry haemangioma would shrink as our son grew.
