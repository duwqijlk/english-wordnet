simpleMeaning: a sailing ship with two masts (tall poles that hold sails), with square sails set across
  both of them
scope: This is a whole sailing ship with two masts, not a prison room on a ship.
examples:
- The brig sailed into the harbour with its square sails full of wind.
- From the shore we watched a two-masted brig cross the bay.
