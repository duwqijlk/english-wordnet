simpleMeaning: a piece of false hair made of one long lock of hair, used by women to give shape to the
  way their hair is done
scope: This is a piece of false hair worn by women, not a part for turning power on or off and not a part
  of a train track.
examples:
- She added a switch to make her hair look fuller at the back.
- The switch matched her own hair and gave her style more shape.
