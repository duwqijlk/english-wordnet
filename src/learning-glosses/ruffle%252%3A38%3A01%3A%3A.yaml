senseId: 'ruffle%2:38:01::'
synsetId: 01920627-v
simpleMeaning: to walk with a proud, high step, often to try to show off to others
scope: Also called cock, prance, and swagger. This sense is walking proudly to show off, not folding cloth
  and not the strip of folded cloth used to trim clothes.
examples:
- He ruffled past the crowd, head high and chest out, trying to impress them.
- She ruffled into the yard like a proud bird, wanting everyone to look at her.
