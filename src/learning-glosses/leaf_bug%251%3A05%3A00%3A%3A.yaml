simpleMeaning: A small insect with bright colours that feeds on the juices of plants
scope: A small bright insect that feeds on plant juices; plant bug is another name for this sense, not
  the big leaf-foot bug with flat leg parts.
examples:
- A leaf bug sat on the stem, feeding on the plant's juices.
- The leaf bug's bright colours stood out against the green stem.
