senseId: 'enviousness%1:12:00::'
synsetId: 07565182-n
simpleMeaning: a feeling of wanting what someone else has, thinking well of them for having it yet feeling
  sour and unhappy that you do not have it
scope: 'Also called envy: a feeling of wanting what another person has and thinking well of them for it,
  not delight in their good luck and not greed for money.'
examples:
- Her enviousness showed when she spoke bitterly about her friend's new car.
- He felt a pang of enviousness at his brother's success.
