simpleMeaning: the best thing in a group of things put together for people to look at, and the main one
  among them
scope: The best and main thing in a group of things put together for people to look at; not just any ordinary
  thing in that group.
examples:
- The old gold cup was the showpiece of the whole collection.
- A large painting by the door was the showpiece of the room.
