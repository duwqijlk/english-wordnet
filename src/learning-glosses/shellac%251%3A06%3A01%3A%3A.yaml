simpleMeaning: A thin finish for wood, made by letting lac come apart in alcohol.
scope: A thin finish for wood made by letting lac come apart in alcohol, not the lac itself in flakes
  and not the act of putting it on.
examples:
- He brushed shellac over the table to give it a shine.
- A coat of shellac brought out the grain of the wood.
