senseId: integral%5:00:00:intrinsic:00
synsetId: 01351376-s
simpleMeaning: being a part or quality that a thing has by its own nature and needs to be what it is
scope: Also called inherent, constitutional, and inbuilt. It means part of a thing by its own nature;
  it is not the number result in maths, not whole with nothing missing, and not about whole numbers.
examples:
- A deep sense of fairness was integral to his character.
- Kindness is integral to her nature, not something she learned later.
