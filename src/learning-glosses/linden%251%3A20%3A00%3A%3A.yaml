simpleMeaning: A tree of the genus Tilia that loses its leaves each year, with heart-shaped leaves and
  hanging clusters of yellow, often fragrant flowers; several are valued for their wood.
scope: This sense is the tree itself, not the soft pale wood cut from it; lime tree and basswood are other
  names for the same tree.
examples:
- An old linden stood at the center of the square.
- Bees love the flowers of the linden in early summer.
