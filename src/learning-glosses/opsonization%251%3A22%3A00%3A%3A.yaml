simpleMeaning: a process in which bits in the blood mark a germ so that white blood cells can take it
  in more easily
scope: A process in which bits in the blood mark a germ so that white blood cells can take it in more
  easily; opsonisation is another name for this sense, not the germ itself and not the white blood cells.
examples:
- Opsonization makes germs easier for white cells to take in.
- The lab studied opsonization in the blood sample.
