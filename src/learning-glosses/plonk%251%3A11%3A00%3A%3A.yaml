simpleMeaning: the sound made when something drops, as when it falls into a liquid
scope: This is the sound of a drop, not the act of dropping something or putting it down heavily.
examples:
- The stone fell into the pond with a plonk.
- I heard a plonk as the bottle dropped into the water.
