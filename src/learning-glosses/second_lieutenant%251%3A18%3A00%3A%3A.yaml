simpleMeaning: an officer with the lowest rank in the army, air force or marines
scope: The lowest-ranking officer in the army, air force or marines; 2nd lieutenant is another name for
  this sense. Not a higher officer and not a soldier without a rank.
examples:
- The second lieutenant gave the order to move out at dawn.
- She was made a second lieutenant after she finished her training.
