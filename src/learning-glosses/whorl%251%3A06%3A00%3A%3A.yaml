simpleMeaning: a thing made of something wound round and round in one long set of loops
scope: 'Also called spiral, coil, helix, and volute: a thing wound round in loops, not the round shape
  made of rings one inside another and not a lock of hair.'
examples:
- He wound the rope into a whorl and left it on the floor.
- The wire was stored in a neat whorl inside the box.
