simpleMeaning: a part of a ceiling or dome (a round roof) that is set in and lower than the rest, made
  to look nice
scope: 'Also called caisson and lacunar: this is a sunken panel in a ceiling or dome, not a chest for
  keeping things of value.'
examples:
- Each coffer in the ceiling had a small flower cut into it.
- Light fell across the deep coffer above the hall.
