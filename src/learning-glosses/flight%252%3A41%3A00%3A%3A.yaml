simpleMeaning: To flight a bird is to shoot a bird while it is flying.
scope: 'This is a rare hunting and sporting term: it means to shoot a bird while it is in the air. It
  is not the verb sense ''to fly in a flock'', which describes what birds do, nor the noun for a journey
  by air. Modern English uses ''shoot'' for this action, and the verb survives mainly in older sporting
  writing.'
examples:
- The hunters waited by the marsh to flight the ducks at dusk.
- He flighted a single goose as it crossed the field.
