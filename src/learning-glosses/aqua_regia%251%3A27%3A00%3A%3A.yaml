simpleMeaning: Two acids mixed together make this yellow liquid, which gives off smoke and eats away metal,
  even gold
scope: Also called nitrohydrochloric acid, it is a mix of two acids that eats away metal, not one acid
  on its own.
examples:
- Aqua regia dissolved the gold.
- The metal went into aqua regia and came out eaten away.
