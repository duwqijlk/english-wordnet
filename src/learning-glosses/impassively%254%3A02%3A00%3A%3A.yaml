simpleMeaning: in a way that shows no feeling when something happens
scope: In a way that shows no feeling; not in a way that shows care, anger, or joy, and not just in a
  quiet, calm way.
examples:
- He listened impassively while the judge read the decision.
- She sat impassively and did not react when she heard the bad news.
