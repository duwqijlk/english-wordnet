simpleMeaning: In civil law, the first paper the person who starts a case gives to the court, telling
  the facts and asking the court for help based on those facts
scope: In civil law, this is the first court paper that starts a case; it is not a spoken expression of
  being unhappy, not a health problem, and not the criminal-law paper.
examples:
- The lawyer filed the complaint in court, setting out the facts of the contract case.
- In the complaint, she said the company had not paid her and asked the court for help.
