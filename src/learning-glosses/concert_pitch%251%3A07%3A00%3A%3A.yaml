simpleMeaning: Usually the A above middle C is put at 440 times a second, the set way of fixing how high
  notes sound so instruments play together before listeners.
scope: Also called international pitch and philharmonic pitch, this is the set way of fixing how high
  notes sound for instruments playing together.
examples:
- The concert pitch sets the A above middle C at 440 times a second.
- They tuned the instruments to concert pitch.
