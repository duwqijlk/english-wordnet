simpleMeaning: a way of speaking or writing that sounds grand and uses too many fancy words just for show
scope: 'Also called grandiosity and ornateness: grand, fancy speech or writing, not loud, confused, empty
  talk.'
examples:
- The speech was pure rhetoric, full of grand words and fancy phrases.
- She disliked the rhetoric in his writing and asked him to use plain words.
