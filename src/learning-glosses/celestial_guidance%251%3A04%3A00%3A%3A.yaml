simpleMeaning: A way of steering a missile or a craft in space by the places of the sun, moon and stars.
scope: Steering a missile or craft in space by the sun, moon and stars, not steering by signals from the
  ground and not steering by hand.
examples:
- Celestial guidance kept the spacecraft on course by the stars.
- The missile used celestial guidance to find its way at night.
