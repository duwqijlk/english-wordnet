simpleMeaning: a speech sound that can go on as air moves past a narrow gap in the parts that make voice
  sounds
scope: This is a speech sound made as air moves past a narrow gap; fricative and spirant are other names
  for it, not a vowel or a sound made with the lips closed.
examples:
- A fricative consonant needs a steady stream of air.
- The fricative consonant 's' is common in English.
