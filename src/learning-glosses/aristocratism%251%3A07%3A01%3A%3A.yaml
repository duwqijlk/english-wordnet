simpleMeaning: the ideas, ways of doing things, and marks of rule by the families of the highest rank
scope: The beliefs and ways of rule by the highest-ranking families, not rule by the people and not the
  rich as such.
examples:
- The old hall was built as a show of aristocratism, with its grand stairs and portraits.
- His speech praised aristocratism as the natural order of things.
