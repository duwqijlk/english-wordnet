simpleMeaning: In law, swapping one duty for another when both sides agree, most often swapping one of
  the first people in a deal, with the other side's say-so
scope: In law, swapping one duty for another when both sides agree; not breaking a deal and not a one-sided
  change.
examples:
- The novation let a new firm take over the old firm's duties.
- By novation, the buyer stepped into the seller's place in the deal.
