simpleMeaning: a very catching sickness caused by a virus, with fever, weakness, and a skin rash of pus-filled
  spots that dry into scabs, fall off, and leave scars
scope: 'Also called smallpox and variola major: a very catching viral sickness with a rash of pus-filled
  spots, not chickenpox and not a sickness of the lungs.'
examples:
- Variola spread fast through the town, leaving scars on those who lived.
- The fever and rash of variola kept her in bed for weeks.
