simpleMeaning: a book from the Middle Ages, most often with pictures, that tells of real and made-up animals
  in ways that teach a lesson and make the reader smile
scope: A medieval book about animals, not a modern book about animals and not a book of fables alone.
examples:
- The bestiary showed a unicorn beside a lion.
- Monks copied the bestiary by hand in the abbey.
