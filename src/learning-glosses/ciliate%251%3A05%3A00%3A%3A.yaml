simpleMeaning: a one-celled living thing with tiny bits that stick out from the outside of its cell
scope: A one-celled living thing with tiny bits on the outside of its cell, also called a ciliated protozoan
  or a ciliophoran; not a thing with a hairy edge.
examples:
- The ciliate moved by waving the tiny hairs on its surface.
- Under the microscope, the ciliate showed hairlike bits all over its cell.
