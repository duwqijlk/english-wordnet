simpleMeaning: the art or way of making colour prints on cloth that look like oil paintings
scope: The art or way of making colour prints on cloth that look like oil paintings; not painting in oils
  and not printing on paper.
examples:
- Oleography let printers sell cheap copies of oil paintings.
- The museum shows oleography prints from the last century.
