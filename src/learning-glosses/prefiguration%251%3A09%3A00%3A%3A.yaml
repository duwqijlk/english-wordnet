schema: oewn-learning-gloss-v2
senseId: 'prefiguration%1:09:00::'
synsetId: 05784012-n
simpleMeaning: giving a faint early sign of what will happen later, by showing it in advance in a vague
  way
scope: 'Also called foreshadowing and adumbration: giving a faint early sign of what will happen later,
  not a clear plan and not a full account of the future.'
examples:
- The dark clouds were a prefiguration of the storm to come.
- Her early sketches were a prefiguration of the large painting she would make later.
