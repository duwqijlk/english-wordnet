simpleMeaning: a very large flat fish in warm open seas that eats tiny living things and small fish; usually
  harmless, but its size makes it dangerous if hit with a spear
scope: Also called manta and manta ray, this is the large flat fish, not a grey-black whale and not an
  animal with eight long arms that lives on the sea floor.
examples:
- The devilfish swam slowly near the surface of the warm sea.
- Divers saw a devilfish with very wide fins.
