simpleMeaning: the upright wing-like part at the back of a plane
scope: The upright wing-like part at the back of a plane, not the flat wing-like parts at the back and
  not the wings that lift the plane.
examples:
- The vertical tail stood upright at the very back of the aircraft.
- A dent in the vertical tail had to be fixed before the plane could fly.
