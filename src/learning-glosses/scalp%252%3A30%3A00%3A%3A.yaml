simpleMeaning: to cut off and take away the skin and hair from the top of a person's head
scope: This is cutting off the skin from the top of the head, not the skin itself and not selling tickets
  at a high price.
examples:
- In the old story, the warriors scalped the men they had killed.
- The enemies were scalped after the battle.
