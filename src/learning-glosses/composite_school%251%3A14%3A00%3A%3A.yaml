simpleMeaning: a big British or Canadian place where older children of all levels of skill learn
scope: A big British or Canadian place where older children of all levels of skill learn, not a place
  for children of one level only; comprehensive school is another name for this sense.
examples:
- She went to a composite school in Leeds that took pupils of all abilities.
- His composite school in Toronto had classes for children of every level.
