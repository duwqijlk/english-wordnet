simpleMeaning: the state of feeling unclear in the mind and unsteady when walking, caused by drinking
  alcohol
scope: The mixed-up, unsteady feeling caused by alcohol, not the tired, weak feeling that comes from needing
  rest.
examples:
- After several drinks, his grogginess made him walk unsteadily.
- Her grogginess after the wine left her mind unclear and her steps unsteady.
