simpleMeaning: The idea that eating well, above all whole beans and grains, keeps a person healthy and
  helps them live long
scope: The idea that food, above all whole beans and grains, keeps people healthy and helps them live
  long; not a medical treatment and not a single meal plan.
examples:
- He believed in macrobiotics and ate mostly beans and brown rice.
- Macrobiotics teaches that whole grains and beans support a long, healthy life.
