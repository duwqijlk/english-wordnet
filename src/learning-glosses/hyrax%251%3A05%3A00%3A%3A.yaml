simpleMeaning: One of several small hoofed kinds found in Africa and Asia, with front teeth like a rat's
  and toes like small hooves.
scope: Also called das, coney, cony, and dassie, it is a small hoofed animal of Africa and Asia whose
  front teeth only look like a rat's.
examples:
- We saw a hyrax in Africa.
- The hyrax has front teeth like those of a rat.
