simpleMeaning: A part of the blood that helps it clot, whose lack is linked to a bleeding disease called
  haemophilia B.
scope: One of the parts in blood that help it clot, also called factor IX; its lack is linked to haemophilia
  B, a disease in which blood does not clot as it should.
examples:
- Christmas factor helps the blood to clot.
- People who lack Christmas factor bruise and bleed easily.
