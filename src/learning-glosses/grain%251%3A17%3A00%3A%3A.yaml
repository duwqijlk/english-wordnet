simpleMeaning: a fairly small single piece of a substance, like one piece of sand or sugar
scope: A tiny single piece of something, not the seeds of wheat or corn and not a unit for weighing things.
examples:
- A single grain of sand got into her shoe.
- He found a grain of sugar on the table.
