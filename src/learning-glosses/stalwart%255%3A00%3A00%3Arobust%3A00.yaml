simpleMeaning: having a strong, tough body and used to tiredness and hard times
scope: 'Also called stout, sturdy and hardy: strong in body and used to hard times, not a person who stays
  loyal to a side or leader.'
examples:
- The stalwart farmer could lift heavy sacks all day without rest.
- Stalwart hikers kept walking through cold and hunger.
