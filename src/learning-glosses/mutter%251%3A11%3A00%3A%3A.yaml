simpleMeaning: a low, unbroken sound that is hard to understand, often with the lips moving but no clear
  words spoken.
scope: A low, unclear sound, not the act of complaining under one's breath or a complaint spoken in that
  tone.
examples:
- A low mutter came from the back of the room.
- His mutter was too quiet to make out.
