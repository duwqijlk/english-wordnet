simpleMeaning: driven by lust (a strong wish for sex); thinking about sex a lot and showing a strong wish
  for sex
scope: 'Also called lascivious, lustful, and libidinous: driven by a strong wish for sex. Not the other
  sense of lewd, which means hinting at sex in a way that breaks moral rules.'
examples:
- He gave her a lewd look, full of sexual desire.
- His lewd thoughts kept turning to sex.
