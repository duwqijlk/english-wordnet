simpleMeaning: To keep the members of a group in line, this lawmaker is picked by the group
scope: 'Also called whip: a lawmaker picked by their group to keep its members in line, not the head of
  the group and not a lawmaker who makes the laws.'
examples:
- The party whip made sure every member voted with the group.
- She was named party whip after the election.
