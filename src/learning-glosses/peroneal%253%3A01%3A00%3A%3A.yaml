simpleMeaning: Said of the outside of the leg below the knee, or of the fibula, the thin bone that runs
  down its outside
scope: To do with the outside of the lower leg and its thin bone, not the inside of the leg and not the
  knee itself.
examples:
- The peroneal nerve runs down the outside of his leg.
- She felt pain in the peroneal muscles after the run.
