simpleMeaning: how a person feels and thinks at one time, for a short while only
scope: How a person feels and thinks at one time, for a short while only; not the working of the mind
  in general, and not the way things are in the world.
examples:
- Her state of mind improved after the holiday.
- In his present state of mind, he could not work.
