simpleMeaning: The way things stick together, as glue sticks to wood, or surfaces made of different materials
  join together
scope: This sense is how things stick together, also called bond, adhesion, and adhesiveness, not following
  a rule or plan closely.
examples:
- Good adherence between glue and wood makes the joint strong.
- Heat improved the adherence of the two surfaces.
