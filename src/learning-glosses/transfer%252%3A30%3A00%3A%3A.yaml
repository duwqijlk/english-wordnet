simpleMeaning: Move something so that it is in a different place or time.
scope: This is moving a thing or idea into a new setting or era, not handing over ownership or changing
  trains.
examples:
- The design was transferred from a medieval manuscript to a modern poster.
- The festival was transferred from spring to late summer that year.
