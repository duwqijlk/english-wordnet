simpleMeaning: 'A chemical made of two parts: carbon and another element that gives up its outer parts
  more easily than carbon does.'
scope: A chemical made of carbon and another element, not a pure metal and not a salt.
examples:
- Carbide forms when carbon joins with another element.
- The lamp used carbide to make its gas.
