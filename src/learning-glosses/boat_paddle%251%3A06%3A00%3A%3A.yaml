simpleMeaning: a short light oar used without an oarlock, a fixed holder on a craft, to move a canoe or
  small craft
scope: A short light oar, also called a paddle, used to move a canoe or small craft without a fixed holder;
  not a long oar held by a fixed holder and not a pole for pushing a craft along.
examples:
- She dipped the boat paddle into the still water.
- He steered the canoe with a boat paddle.
