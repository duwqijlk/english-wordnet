simpleMeaning: These plants are sometimes counted with another group; they are one of several kinds whose
  flower petals have edges cut into thin strips
scope: A plant whose petal edges are cut into thin strips, not the fringed pink with sweet smelling flowers.
examples:
- The fringed gentian in the meadow had petals with edges cut into fine strips.
- She grew fringed gentian in her garden for its cut edged petals.
