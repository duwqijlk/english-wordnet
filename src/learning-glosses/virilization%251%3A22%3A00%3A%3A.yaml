senseId: 'virilization%1:22:00::'
synsetId: 13532958-n
simpleMeaning: The marks of a man appear on a woman in a wrong way, most often after hormone treatment
  or when the glands above the kidneys go wrong.
scope: Also called masculinisation, masculinization, and virilisation, it is the same wrong change, giving
  a woman the marks of a man.
examples:
- The virilization began after the hormone treatment started.
- Her virilization came from the glands above the kidneys going wrong.
