simpleMeaning: In psychiatry, a mental reaction outside a person's awareness that works to lessen the
  worry linked to instinctive urges.
scope: A mental reaction outside a person's awareness in psychiatry; not a justification, a spoken rebuttal
  of an accusation, a court reply or legal side, a sports team, military action, a defender group, a barrier,
  or protection from harm.
examples:
- Denial is a common defense against painful feelings.
- The therapist pointed out the defense that shielded him from guilt.
