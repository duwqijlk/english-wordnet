simpleMeaning: In biology, two unlike sex cells join into one to make young, most often unlike in size.
scope: In biology, this is the making of young by two unlike sex cells joining into one, not two like
  ones.
examples:
- The small sex cell and the large one joined in anisogamy to make young.
- When the two unlike sex cells came together, it was anisogamy.
