simpleMeaning: The point on the compass that sits halfway between north and northwest.
scope: Also called nor'-nor'-west and north northwest; this is the point on the compass between north
  and northwest, not the point between north and northeast.
examples:
- The wind came from NNW all through the night.
- On the map, NNW sits between north and northwest.
