simpleMeaning: To bear down hard with the muscles while giving birth so the baby comes out.
scope: This is the effort of labour in childbirth, not moving an object by force and not leaning hard
  against something without moving it.
examples:
- The nurse told her to push with the next contraction.
- She had to push for nearly an hour before the baby arrived.
