simpleMeaning: A sharp sound that a small bird or an insect makes
scope: This is the sound itself made by a small bird or insect, not the bird or insect that makes it.
examples:
- We heard a chirp from the small bird in the tree.
- A loud chirp from the insect broke the quiet of the night.
