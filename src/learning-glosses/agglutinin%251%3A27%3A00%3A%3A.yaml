simpleMeaning: a body chemical that fights illness by making one kind of foreign thing clump together
scope: A body chemical that makes one kind of foreign thing clump together, not any body chemical that
  fights illness and not the clumping itself.
examples:
- The agglutinin in the sample made the germs clump together.
- The agglutinin caused the red cells to clump in the test tube.
