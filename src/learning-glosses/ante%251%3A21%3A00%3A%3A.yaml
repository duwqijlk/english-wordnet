simpleMeaning: In poker, the first money that each player puts into the pot
scope: In poker, the first money put in by each player; not a later bet in the game and not money won
  at the end.
examples:
- Each player put a ten-dollar ante into the pot before the cards were dealt.
- The ante was small, so new players were happy to join the game.
