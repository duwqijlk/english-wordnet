simpleMeaning: Pale flowers mark this herb of Eurasia, grown far and wide to feed farm animals and hold
  the soil in place.
scope: Also called field lupine and wolf bean, this Eurasian herb is grown to feed farm animals and hold
  soil, not a wild flower.
examples:
- Farm animals were fed white lupine.
- The soil was held in place by white lupine.
