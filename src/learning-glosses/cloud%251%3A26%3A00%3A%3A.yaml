simpleMeaning: doubt about someone that damages how others see them.
scope: It is doubt that harms a person's reputation, not a mass of water in the sky or a general cause
  of worry, and not the act of casting doubt on someone.
examples:
- After the scandal, a cloud hung over the minister's reputation.
- The accusation left him under a cloud for years.
