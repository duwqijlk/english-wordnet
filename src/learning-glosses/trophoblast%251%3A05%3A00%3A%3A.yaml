senseId: 'trophoblast%1:05:00::'
synsetId: 01464850-n
simpleMeaning: a thin skin that forms the wall of the blastocyst, a very early form of a baby, and helps
  it fix itself to the wall of the womb
scope: This is the thin skin round the very early baby, not the baby itself and not the placenta it later
  helps to form.
examples:
- The trophoblast forms the outer wall of the blastocyst.
- After the trophoblast helps the blastocyst fix to the womb, it grows into new layers.
