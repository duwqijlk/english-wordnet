simpleMeaning: A truck fitted to lift and pull away crashed vehicles, or to take away vehicles left where
  parking is not allowed
scope: A truck fitted to lift and pull away crashed vehicles; wrecker and tow truck are other names for
  this sense, and not an ordinary truck or a parking attendant.
examples:
- A tow car took the crashed vehicle away.
- The tow car removed the vehicle from the no-parking zone.
