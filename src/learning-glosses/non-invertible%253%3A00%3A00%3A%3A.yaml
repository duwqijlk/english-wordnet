simpleMeaning: Said of a thing with no partner value that undoes it by adding or multiplying
scope: Said of a thing that has no inverse by adding and no inverse by multiplying, not one that has either
  kind.
examples:
- This matrix is non-invertible, so the equation has no single answer.
- A non-invertible number cannot be undone by adding or multiplying.
