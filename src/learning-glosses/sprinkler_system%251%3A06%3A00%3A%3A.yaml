simpleMeaning: When a fire starts, the heat opens small openings in pipes overhead by itself, and the
  water that comes out puts the fire out.
scope: 'No one has to turn this on by hand: when the heat rises, small openings in overhead pipes let
  water out on their own to put out a fire.'
examples:
- The sprinkler system let water out as soon as the heat rose.
- The new hall has a sprinkler system overhead.
