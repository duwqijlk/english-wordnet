simpleMeaning: A strong, hairy bee that lives in groups in mild parts of the world.
scope: A strong, hairy bee that lives in groups in mild parts of the world, not a honeybee and not a wasp;
  bumblebee is another name for this sense.
examples:
- A humblebee buzzed among the clover.
- Humblebees nest in the ground.
