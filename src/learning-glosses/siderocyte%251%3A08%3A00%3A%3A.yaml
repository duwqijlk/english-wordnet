simpleMeaning: a red blood cell that is not normal and holds tiny bits of iron not joined to the red part
  that carries oxygen
scope: A red blood cell that is not normal; not a healthy red blood cell and not a white blood cell.
examples:
- The blood test showed a siderocyte among the red cells.
- Doctors found a siderocyte with iron granules in the sample.
