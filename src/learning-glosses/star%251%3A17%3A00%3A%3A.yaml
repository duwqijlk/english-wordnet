simpleMeaning: In astronomy, a mass of hot gas in space that gives off energy from nuclear fusion in its
  core.
scope: This is a burning body of gas, not any bright point seen in the night sky, a famous actor, a five-pointed
  shape, or the * symbol used in printing.
examples:
- The telescope revealed a faint star near the edge of the galaxy.
- Our sun is the nearest star to Earth.
