simpleMeaning: A wooden stick that lights when rubbed on any rough surface, handy for lighting wood or
  gas stoves
scope: A wooden stick that lights by rubbing on a rough surface, not a match that needs a special strip
  and not a lighter.
examples:
- He struck a kitchen match on the brick wall to light the stove.
- She kept a box of kitchen matches by the gas cooker.
