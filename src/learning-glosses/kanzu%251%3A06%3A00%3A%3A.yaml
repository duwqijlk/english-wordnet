simpleMeaning: In Swahili use, a long robe with long sleeves, usually white, worn by men in East Africa
scope: This is a long sleeved robe worn by men in East Africa, not a short coat and not a woman's dress.
examples:
- He wore a white kanzu to the wedding.
- The shop sells long kanzus for men.
