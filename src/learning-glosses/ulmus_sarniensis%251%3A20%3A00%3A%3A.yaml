simpleMeaning: A kind of English elm with straight-up branches and wider leaves.
scope: 'Also called guernsey elm, wheately elm, Jersey elm, Ulmus campestris sarniensis, and Ulmus campestris
  wheatleyi: a kind of English elm with straight-up branches and wider leaves, different from the common
  English elm and from other elms with drooping branches.'
examples:
- Ulmus sarniensis has straight-up branches and wider leaves.
