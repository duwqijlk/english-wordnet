simpleMeaning: One of the two branches of the language family that joins the Finnic and Hungarian languages,
  spoken in Hungary and north-western Siberia.
scope: This is one of the two branches of the Finno-Ugric family of tongues, spoken in Hungary and north-western
  Siberia, also called Ugrian; the other branch of the same family is a different group of tongues.
examples:
- Ugric is spoken in Hungary and north-western Siberia.
- Ugric is one of the two branches of the Finno-Ugric family.
