simpleMeaning: the underground part of a plant, roasted and ground to take the place of coffee or to mix
  into it
scope: The underground part of a plant, roasted and ground to take the place of coffee or to mix into
  it; chicory is another name for this sense, not coffee itself and not a fresh root.
examples:
- Chicory root can stand in for coffee in the morning cup.
- She ground chicory root and mixed it with coffee.
