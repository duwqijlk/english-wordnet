simpleMeaning: Being ready to notice what the body feels, with only a simple, unformed awareness of it
scope: Being ready to notice what the body feels, with only a simple awareness, not reasoned thought and
  not mere movement with no sense of what is felt.
examples:
- The poem gave sentience to slugs and newts.
- Some ask whether a machine can ever have sentience.
