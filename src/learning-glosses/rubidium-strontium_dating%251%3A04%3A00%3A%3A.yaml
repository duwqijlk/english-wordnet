simpleMeaning: A ray-giving metal halves in 47,000,000,000 years, and in geology the age of rocks is told
  by weighing that metal against what it has become.
scope: This is a way of telling the age of rocks in geology, by weighing a ray-giving metal against what
  it has become, that metal halving in 47,000,000,000 years.
examples:
- Rubidium-strontium dating gave the age of the rocks.
- They dated the rocks by rubidium-strontium dating.
