simpleMeaning: In some ways between a hawk and a large hunting bird, this is one of many kinds of large
  Old World birds of prey.
scope: It is also called short-toed eagle, and it sits between a hawk and an eagle without being a true
  one of either kind.
examples:
- A harrier eagle circled in the sky.
- We watched a harrier eagle as it flew.
