simpleMeaning: a place where planes take off and land, with a tower for directing planes, buildings to
  keep planes in, and places for people and goods
scope: 'Also called airport, airdrome and drome: a full place for planes with a tower and buildings, not
  just a simple field for landing.'
examples:
- The small planes land at the aerodrome outside the town.
- Passengers waited inside the aerodrome while their goods were loaded onto the plane.
