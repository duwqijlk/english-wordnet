senseId: 'replace%2:40:00::'
synsetId: 02262575-v
simpleMeaning: to put a thing that seems the same in the place of another thing
scope: 'This sense is also called exchange: swapping in a thing that seems the same. It is not putting
  a new thing in place of one that is broken, lost, or no longer working.'
examples:
- The thief replaced the real painting with a fake one.
- You can replace butter with oil in this food, and it works the same.
