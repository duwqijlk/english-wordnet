simpleMeaning: to make someone want something by seeming pleasant or appealing
scope: 'Another name for tempt: making something seem so appealing that people want it, not welcoming
  someone into your home and not asking a guest to come over.'
examples:
- The warm fire and soft chairs invited us to linger.
- The bright shop windows invited shoppers to step inside.
