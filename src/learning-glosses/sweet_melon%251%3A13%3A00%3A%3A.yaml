simpleMeaning: the fruit of a vine plant, one of several kinds of fruit close to the cucumber
scope: This is the fruit of a vine, not the vine itself and not a cucumber; muskmelon is another name
  for this sense.
examples:
- She cut a sweet melon in half for lunch.
- The sweet melon from the garden was ripe and soft.
