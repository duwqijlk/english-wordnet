simpleMeaning: In computer science, a part of a machine that keeps a running total, adding each new number
  to the total it already holds.
scope: Also called accumulator register, this is a part of a computer that keeps a running total, not
  a person who collects payments.
examples:
- In the old computer, the accumulator kept a running total as numbers came in.
- Each new number went into the accumulator and was added to the total.
