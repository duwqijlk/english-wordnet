simpleMeaning: the act of joining or uniting one thing with another so they become one
scope: 'Also called appropriation: the act of joining things together into one, not the act of taking
  land by force or taking control of a place.'
examples:
- The annexation of the small firm by the larger one made a single company.
- After the annexation, the two groups worked as one team.
