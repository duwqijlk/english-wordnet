simpleMeaning: In criminal law, talks between the person charged and the prosecutor end with guilt admitted
  to a smaller charge and a heavier one dropped.
scope: Also called plea bargain, it is talks in criminal law between the person charged and the prosecutor,
  ending with guilt admitted to a smaller charge and a heavier one dropped.
examples:
- Plea bargaining helps to stop the courts becoming congested.
- They turned to plea bargaining.
