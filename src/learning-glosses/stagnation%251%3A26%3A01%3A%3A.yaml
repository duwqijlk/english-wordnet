simpleMeaning: the state of a liquid when it does not move or flow and stands still, with no flow going
  through it
scope: This is about a liquid that does not move or flow; it is not about water that is moving, and it
  is not about the slow growth of a business or a country.
examples:
- Stagnation of the pond water made it smell bad in summer.
- Without a stream flowing in, stagnation left the lake water still and dirty.
