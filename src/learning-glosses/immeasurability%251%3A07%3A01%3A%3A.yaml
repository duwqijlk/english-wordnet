senseId: 'immeasurability%1:07:01::'
synsetId: 92420666-n
simpleMeaning: The quality of being such that it cannot be measured.
scope: The quality of being such that it cannot be measured, not the quality of being large yet still
  able to be measured and not the quality of being hard to measure.
examples:
- The immeasurability of what the brain is capable of amazes us.
- He spoke of the immeasurability of the stars.
