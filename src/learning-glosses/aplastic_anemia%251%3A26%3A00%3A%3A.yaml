simpleMeaning: the bone marrow stops working, so the blood runs short of all its kinds of cells; a tumour
  or contact with poison can bring it on
scope: 'Also called aplastic anaemia: a sickness where failing bone marrow leaves the blood short of cells,
  not blood loss and not one low count alone.'
examples:
- Aplastic anemia means the bone marrow has stopped making enough blood cells.
- Exposure to poison can cause aplastic anemia.
