simpleMeaning: the quality of being strong enough to face hard tests of thinking and still be shown to
  be right
scope: The strength of ideas or findings under hard questioning; not the physical strength of a body or
  a machine.
examples:
- The lack of robustness in the findings may be due to the small size of the sample.
- Teachers praised the robustness of her essay when she answered every hard question about it.
