simpleMeaning: Doing well in damp ground, this Eurasian elm is much like the American elm.
scope: It is the Eurasian elm that does well in damp ground and looks much like the American elm, unlike
  the large tree of eastern North America with wide, spreading branches.
examples:
- The water elm did well in damp ground, much like the American elm.
- Water elms are Eurasian elms that do well in damp ground.
