simpleMeaning: a small tube that carries blood from the lower lip and joins the large blood tube of the
  face
scope: Also called the inferior labial vein, it is a blood tube that takes blood away from the lower lip,
  not the one that takes blood away from the upper lip.
examples:
- The vena labialis inferior carries blood away from the lower lip.
- Surgeons take care near the vena labialis inferior when they work on the lower lip.
