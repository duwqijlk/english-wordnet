simpleMeaning: giving a person a good reason to take a matter to court under the law
scope: About something wrong that gives a reason to go to court, not just any unfair act and not a step
  that a person can take in daily life.
examples:
- His false words about her were actionable, so she spoke to a lawyer.
- The company's lies were actionable, and the case went to court.
