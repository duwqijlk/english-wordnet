simpleMeaning: a tall building with many floors, made up of offices or flats
scope: A tall building with many floors of offices or flats; high-rise is another name for this sense.
  Not a single house and not a small office building.
examples:
- The new tower block has twenty floors of flats.
- Offices fill the lower floors of the tower block.
