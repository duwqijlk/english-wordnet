simpleMeaning: to stand against someone or something and refuse to give way
scope: To stand against and refuse to give way, also called hold and also called withstand; it is not
  daring someone to fight or to prove something.
examples:
- Many people defy public opinion and speak out.
- They defy the army and hold the bridge.
