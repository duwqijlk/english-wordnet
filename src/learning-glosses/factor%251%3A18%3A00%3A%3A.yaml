simpleMeaning: A trader who handles buying or selling for someone else and is paid a share of each deal.
scope: A person paid to trade on another's behalf, not a circumstance that helps cause a result, not a
  statistical variable, and not the gene sense.
examples:
- He worked as a factor for a London trading house, buying cotton on their behalf.
- The factor took a commission on every shipment he sold for the estate.
