simpleMeaning: A low-growing yearly plant with yellow flowers dotted red, faintly smelling of pine resin,
  from Europe, the British Isles and North Africa.
scope: A low-growing yearly plant with yellow flowers dotted red, also called ground pine and yellow bugle;
  its nearest kin are other low plants with yellow flowers.
examples:
- Ajuga chamaepitys grew low on the dry bank with yellow flowers dotted red.
- We found Ajuga chamaepitys smelling faintly of pine resin.
