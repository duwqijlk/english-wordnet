simpleMeaning: a white crystal-like chemical, made when oxygen joins with calcium, that is used to make
  calcium hydroxide
scope: 'Also called lime, burnt lime, calcined lime, calcium oxide, fluxing lime and quicklime: a white
  chemical used to make calcium hydroxide, not the green fruit of the same name and not chalk.'
examples:
- The workers mixed calx with water to start making the plaster.
- A sack of calx stood beside the kiln.
