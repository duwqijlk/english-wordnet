simpleMeaning: All the tame animals of the cow kind on a farm, counted together as one group, whatever
  their sex or age
scope: Also called cattle, cows and oxen; tame farm animals taken as a group, not one animal alone and
  not wild animals.
examples:
- The farmer counted his kine before the storm.
- The old poem speaks of seven thin kine in the field.
