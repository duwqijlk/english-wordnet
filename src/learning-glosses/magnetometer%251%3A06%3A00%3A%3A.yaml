simpleMeaning: A tool that measures and compares how strong the pull round magnets is
scope: A tool that measures and compares how strong the pull round magnets is, not a compass and not a
  magnet itself; gaussmeter is another name for this sense.
examples:
- The surveyor used a magnetometer to map the pull of the rocks below.
- A magnetometer showed that the field was stronger near the iron ore.
