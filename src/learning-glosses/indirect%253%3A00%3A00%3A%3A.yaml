simpleMeaning: Not straight in space; not going by a direct line to a place.
scope: Not straight in space; not the sense of working through things in between, and not the sense of
  being indirect in manner.
examples:
- Sometimes taking an indirect path saves time.
- You must take an indirect course in sailing.
