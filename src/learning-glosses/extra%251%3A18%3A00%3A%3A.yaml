simpleMeaning: A person with a small acting part, often standing in a crowd scene.
scope: This is not something added on top of what is usual or needed; it is a person with a small role
  in a film.
examples:
- She worked as an extra in a film about ancient Rome.
- The extras stood silently in the background.
