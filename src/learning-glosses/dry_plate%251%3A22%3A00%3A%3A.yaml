simpleMeaning: an old way of taking photographs, using a glass sheet coated with a light-sensitive jelly-like
  layer
scope: An old way of taking photographs with a glass sheet, also called a dry plate process; not a modern
  film camera and not a way of printing photographs.
examples:
- The photographer developed a dry plate in the darkroom.
- Dry plates were common before film became cheap.
