senseId: 'uncharacteristically%4:02:00::'
synsetId: 00249191-r
simpleMeaning: in a way that is not usual for a person
scope: 'This says how a person acts: in a way that is not usual for that person. It is not about what
  is usual for people in general, and not about an action being strange for everyone.'
examples:
- He was uncharacteristically quiet at dinner.
- She, who usually talks fast, spoke uncharacteristically slowly that morning.
