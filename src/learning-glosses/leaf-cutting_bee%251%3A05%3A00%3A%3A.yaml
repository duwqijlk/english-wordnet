simpleMeaning: An insect that cuts round bits from the green parts of plants and from flowers to line
  its nest
scope: An insect that cuts pieces from plants to line its nest; leaf-cutter and leaf-cutter bee are other
  names for this sense, not a honeybee that gathers nectar.
examples:
- The leaf-cutting bee carried a round piece of petal back to its nest.
- A leaf-cutting bee had lined its nest with neat round pieces of leaf.
