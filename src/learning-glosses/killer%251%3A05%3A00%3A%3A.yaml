simpleMeaning: a sea animal that hunts other sea animals, black and white, with teeth and a tall fin on
  its back, often found in cold seas
scope: This is a sea animal, not a person who takes a life and not a thing that ends something.
examples:
- A killer whale swam beside the boat, its black and white back clear in the cold water.
- The film showed a killer whale hunting seals in the cold sea off the coast.
