simpleMeaning: This drug, sold as Meclomen and not made from steroids, cuts down swelling and pain and
  so treats sore, stiff joints
scope: Also called meclofenamate sodium, this is a drug that treats sore, stiff joints, not a drug for
  travel sickness and not a drug that kills germs.
examples:
- The doctor gave her meclofenamate for her sore knee.
- Meclofenamate eased the swelling in his joints.
