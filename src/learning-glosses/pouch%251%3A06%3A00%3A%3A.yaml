simpleMeaning: a small or middle-sized bag or holder used to hold or carry things
scope: A small or middle-sized holder for carrying things, not the bag-like part in an animal's body and
  not the verb that means to swell out.
examples:
- She kept her keys in a small pouch on her belt.
- He carried loose coins in a leather pouch.
