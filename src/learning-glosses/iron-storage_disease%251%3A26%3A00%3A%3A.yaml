simpleMeaning: a medical problem where excess iron is deposited in the body's tissues, with symptoms including
  dark skin, an enlarged liver, diabetes, and trouble with the pancreas and joints.
scope: Another name for the iron-storage disorder also called hemochromatosis, bronzed diabetes or iron
  overload, not a shortage of iron in the diet.
examples:
- Iron-storage disease may first show as unusual skin color.
- Doctors test the blood for iron-storage disease when the liver is enlarged.
