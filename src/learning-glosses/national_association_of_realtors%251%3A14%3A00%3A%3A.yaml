simpleMeaning: People in the United States who sell houses and land belong to this group, which follows
  a strict set of rules about right and wrong.
scope: A group of people in the United States who sell houses and land and follow a strict set of rules
  about right and wrong, not a group of buyers and not a part of the government.
examples:
- She joined the National Association of Realtors when she started selling houses.
- The National Association of Realtors sets rules for its members.
