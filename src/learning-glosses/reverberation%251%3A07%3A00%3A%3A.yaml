simpleMeaning: a sound that is heard again and again because the sound waves bounce back off a surface
scope: This sound is also called echo and replication; it is the sound itself bouncing back, not a later
  effect or result of an action.
examples:
- The reverberation of her voice filled the empty hall.
- We heard the reverberation of the bell long after it was rung.
