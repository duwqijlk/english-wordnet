simpleMeaning: The muscles and skin at the front of the thigh get their signals from one of a pair of
  cords that start from the nerves of the lower back
scope: Femoral nerve and nervus femoralis are other names for this cord, one of a pair from the lower
  back.
examples:
- The anterior crural nerve carries signals to the muscles at the front of her thigh.
- The anterior crural nerve supplies the skin at the front of his thigh.
