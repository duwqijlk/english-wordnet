simpleMeaning: The back of the tongue touches or comes near the soft roof of the mouth in this sound,
  as in k in cat, g in gun, and ng in sing.
scope: This word belongs with the names for speech sounds, marking those made with the back of the tongue
  touching or near the soft roof of the mouth.
examples:
- The k in cat is a velar sound, made with the back of the tongue.
- In sing, the ng is velar, with the back of the tongue near the soft roof of the mouth.
