simpleMeaning: The officer in charge of ACLANT, a general of the United States Army chosen by the President
  and approved by the North Atlantic Council.
scope: Also called Supreme Allied Commander Atlantic, this is the officer in charge of ACLANT, while the
  SACEUR commands in Europe.
examples:
- The SACLANT was nominated by the President of the United States.
- The SACLANT commanded Allied forces in the Atlantic.
