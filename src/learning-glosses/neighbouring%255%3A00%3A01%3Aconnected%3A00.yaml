simpleMeaning: sharing the same edge or border, lying right against something, and touching it
scope: 'Also called adjacent and neighboring: sharing an edge and touching, not just near or in the same
  area.'
examples:
- The neighbouring fields share a long fence along their common edge.
- Our neighbouring houses touch at one wall.
