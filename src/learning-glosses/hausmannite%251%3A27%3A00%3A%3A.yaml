simpleMeaning: A mineral made of manganese and oxygen, a source of manganese.
scope: A mineral made of manganese and oxygen, not the metal manganese itself and not any other mineral
  that gives manganese.
examples:
- The miners dug up hausmannite from the old pit.
- Hausmannite is one source of the manganese used in steel.
