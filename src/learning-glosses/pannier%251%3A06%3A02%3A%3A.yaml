simpleMeaning: one of a pair of bags or boxes that hang over the back wheel of a vehicle, for example
  a bicycle
scope: This sense is a bag or box on the back wheel of a bicycle or other vehicle; it is not a frame worn
  over the hips to make a skirt wide, and not a large basket carried by an animal or a person.
examples:
- She put her books in a pannier on the back of her bicycle.
- He fixed a pannier on each side of the back wheel.
