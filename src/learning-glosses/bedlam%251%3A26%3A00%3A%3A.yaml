simpleMeaning: a state where everything is very mixed up and nothing is in order
scope: This sense is also called chaos and pandemonium. It is a state of great disorder, not a quiet place
  where things are in order.
examples:
- It was bedlam in the shop when the big sale started.
- When the fire bell rang, the school hall turned into bedlam.
