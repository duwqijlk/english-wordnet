simpleMeaning: Of the years counted as in the Christian count of years, a form some writers who are not
  Christians prefer.
scope: Also called CE and C.E., it counts years the same way as the Christian era and is the form some
  writers who are not Christians use.
examples:
- The book dates the event to 300 Common Era.
- Common Era is used by writers who are not Christians.
