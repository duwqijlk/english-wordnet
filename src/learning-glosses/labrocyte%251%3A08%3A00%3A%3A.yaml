simpleMeaning: In an allergic fit, or when hurt or swollen, this large cell in the tissue that joins body
  parts sets free the histamine, heparin and serotonin it holds.
scope: This cell is also called mast cell and mastocyte, and it sets free the chemicals it holds in an
  allergic fit or when the tissue is hurt or swollen.
examples:
- A labrocyte lets out the chemicals it holds when the body has an allergic fit.
- Labrocytes set free histamine, heparin and serotonin when the tissue is hurt or swollen.
