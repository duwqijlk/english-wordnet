simpleMeaning: a sport with no weapons in which two people hold on to each other and fight to force the
  other down to the ground
scope: 'Also called wrestling: a fighting sport done with bare hands, not a fight with weapons and not
  a shouting match.'
examples:
- He took up grappling at the gym last year.
- The two grappling partners circled each other on the mat.
