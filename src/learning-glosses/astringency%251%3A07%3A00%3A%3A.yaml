senseId: 'astringency%1:07:00::'
synsetId: 05209302-n
simpleMeaning: the power to make soft parts of the body pull tight, so blood flow slows or less fluid
  is given off
scope: The power of a substance to tighten soft body tissue, not the sharp taste that makes the mouth
  pucker.
examples:
- The astringency of the plant extract helped slow the bleeding.
- Doctors value the astringency of the solution for drying up excess fluid.
