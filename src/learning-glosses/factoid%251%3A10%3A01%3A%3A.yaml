senseId: 'factoid%1:10:01::'
synsetId: 06496690-n
simpleMeaning: A thing that looks like a fact but has not been checked, often made up, yet believed because
  it has been printed.
scope: A seeming fact that is unverified, often invented, yet believed because it appeared in print; not
  a brief news item, usually one sentence long and usually trivial.
examples:
- The factoid about goldfish having three-second memories keeps being repeated.
- That factoid sounded true, but no one had ever checked it.
