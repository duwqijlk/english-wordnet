simpleMeaning: a shop-bought mix of ground grain, salt, and a thing that makes dough rise
scope: A shop-bought mix for baking, also called self-rising flour; not plain ground grain, and not a
  mix with yeast.
examples:
- She used self-raising flour for the sponge cake.
- The recipe calls for self-raising flour, not plain flour.
