simpleMeaning: In Judaism, a shawl Jews wear at morning prayer, with a fringe knotted in the set way at
  each corner.
scope: Also called tallis and prayer shawl, this shawl with a knotted fringe at each corner is worn by
  Jews at morning prayer, not at evening prayer.
examples:
- He wore his tallith at morning prayer.
- The tallith covered him as he prayed in the morning.
