simpleMeaning: a dark grey-black bird that flies slowly and looks somewhat like a duck
scope: A water bird that looks somewhat like a duck but is not a duck, and not a goose or other large
  water bird.
examples:
- A coot flew slowly over the lake at dusk.
- The black coot looked like a small duck as it moved across the water.
