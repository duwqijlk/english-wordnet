simpleMeaning: A tree first found in 1994 in Australia, long thought to have died out, whose genus and
  species names were not yet given.
scope: A tree first found in Australia in 1994, long thought to have died out, not a common garden pine
  or a fossil tree.
examples:
- The Wollemi pine was found in Australia in 1994.
- Botanists thought the Wollemi pine had died out long ago.
