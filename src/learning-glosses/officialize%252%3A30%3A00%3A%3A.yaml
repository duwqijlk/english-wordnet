simpleMeaning: To give formal standing to a thing, so that it counts as accepted
scope: This is giving formal standing to a thing; officialise is another name for this sense, and not
  making a new law or simply telling people about a thing.
examples:
- We officialize our relationship with a signed paper.
- The school will officialize the new rules on Monday.
