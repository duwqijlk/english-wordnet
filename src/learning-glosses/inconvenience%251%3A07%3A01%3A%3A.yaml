senseId: 'inconvenience%1:07:01::'
synsetId: 04718711-n
simpleMeaning: A hard thing that leaves you worried and uneasy.
scope: A hard thing that leaves you worried and uneasy, not a discomfort that gets in your way, and not
  the act of troubling someone.
examples:
- The late train was an inconvenience that left her anxious about missing the meeting.
- The power cut was a real inconvenience to the family.
