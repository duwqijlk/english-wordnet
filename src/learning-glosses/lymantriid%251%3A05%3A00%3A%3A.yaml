simpleMeaning: A moth in plain, dull colours whose young have tufts of hair on their bodies and eat the
  leaves of many trees that lose their leaves in winter.
scope: A dull-coloured moth whose hairy young eat the leaves of many trees, also called tussock moth;
  not a butterfly and not a brightly coloured moth.
examples:
- The lymantriid rested on the bark, its dull wings folded.
- Lymantriid young stripped the leaves from the young oak.
