senseId: stereophonic%5:00:00:binaural:00
synsetId: 00242247-s
simpleMeaning: Of sound, made to come through two or more separate paths at once, so it seems to fill
  the space.
scope: This sense is also called stereo, which marks sound sent through two or more separate paths at
  once.
examples:
- The stereophonic set gave the music a wide, room-filling sound.
- The sound was stereophonic, coming through two separate paths at once.
