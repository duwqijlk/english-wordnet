simpleMeaning: A soft silvery metal, ytterbium, a rare earth of the lanthanide group, found in gadolinite,
  monazite and xenotime
scope: This is a soft silvery metal of the lanthanide group, not a hard metal and not another rare earth
  metal such as terbium; Yb and ytterbium are other names for this sense.
examples:
- Atomic number 70 is the metal ytterbium.
- Ytterbium, atomic number 70, is found in gadolinite and monazite.
