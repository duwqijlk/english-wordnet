simpleMeaning: One of four main kinds of this sickness, where bad cells grow in the body parts that make
  the red liquid, and white cells grow far too much
scope: 'Also called leukemia, leukaemia and leucaemia: one of the four main kinds of this sickness, in
  which white cells grow far too much.'
examples:
- The cancer of the blood made his white cells grow far too much.
- She was told she had cancer of the blood.
