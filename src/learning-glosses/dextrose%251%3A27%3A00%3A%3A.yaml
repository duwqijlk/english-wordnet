simpleMeaning: a sugar found in honey and sweet fruit, one form of glucose
scope: This is a kind of sugar found in honey and sweet fruit; dextroglucose and grape sugar are other
  names for this sense, not table sugar and not the sugar found in milk.
examples:
- Dextrose in the honey made it taste very sweet.
- Sweet fruit is full of dextrose.
