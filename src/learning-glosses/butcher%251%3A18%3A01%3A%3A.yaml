simpleMeaning: a person who kills people in a cruel way, with no care about who they are
scope: A cruel person who kills people with no care about who they are. It is not a person who cuts meat
  and sells it.
examples:
- The newspapers called him a butcher after he killed many people in the village.
- He was known as a butcher because he murdered whole families without pity.
