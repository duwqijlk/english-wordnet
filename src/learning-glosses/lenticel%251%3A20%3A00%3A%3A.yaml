simpleMeaning: Air passes in and out of the flesh inside a woody plant through these raised holes on its
  stems, one of many.
scope: One of many raised holes on the stems of woody plants, this lets air pass between the outside air
  and the flesh inside.
examples:
- Lenticels dotted the stem of the woody plant.
- Gas moved in and out through the lenticels on the stem.
