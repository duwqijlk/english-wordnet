simpleMeaning: In philosophy, the view that general ideas, such as justice, exist on their own, apart
  from the words for them
scope: In philosophy, the view that general ideas exist apart from their names, not the view about real
  things existing unseen and not the everyday habit of facing facts.
examples:
- Realism holds that justice exists even if no one speaks of it.
- The debate on realism turned on whether ideas live apart from words.
