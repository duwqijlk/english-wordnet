simpleMeaning: a part that passes on and makes stronger the turning force, often by using liquid under
  pressure
scope: This is a part that passes on and makes a turning force stronger, often by using liquid under pressure;
  not a gear and not a clutch.
examples:
- The torque converter in the car passes the engine's turning force to the wheels.
- A worn torque converter can make the car slow to move off.
