simpleMeaning: having to do with a thousand-year time of peace and happiness, or with the belief in it
scope: 'Also called millenarian: about a thousand-year time of peace and happiness, or about the belief
  in it, not a belief about the end of the world and not a general hope for a better life.'
examples:
- His chiliastic hopes were fixed on a thousand years of peace to come.
- The chiliastic preacher spoke of a time of peace and happiness for all.
