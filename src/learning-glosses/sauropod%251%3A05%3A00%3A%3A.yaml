simpleMeaning: With a small head on a very long neck and tail and five-toed legs, it was a huge plant-eater
  of long ago, the biggest land animal known.
scope: Also called sauropod dinosaur, it was a huge plant-eater of long ago, not one of the meat-eaters
  of long ago.
examples:
- No land animal known was as big as the sauropod.
- The sauropod walked on five-toed legs.
