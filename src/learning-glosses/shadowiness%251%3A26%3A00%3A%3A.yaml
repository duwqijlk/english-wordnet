simpleMeaning: the amount of dark in a place where something solid stops the light from getting through
scope: The amount of dark where something solid stops the light, also called shade and shadiness; not
  full darkness and not a dark colour.
examples:
- The shadowiness under the trees kept the ground cool.
- We moved the lamp because the shadowiness made the page hard to read.
