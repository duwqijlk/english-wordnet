simpleMeaning: A rough cloth spun and woven by hand from cotton, made in India
scope: This is a rough cloth spun and woven by hand from cotton, made in India; khadi is another name
  for this sense, not a fine cloth and not a cloth made by machine.
examples:
- He wore a shirt of coarse khaddar.
- Khaddar is spun and woven by hand in India.
