simpleMeaning: a pipe or open path that water flows out through, especially one that takes rain water
  away from the gutters of a roof
scope: This sense is a pipe or path for water to flow out, especially from a roof. It is not the tall
  spinning column of water and mist over the sea.
examples:
- Rain ran down the waterspout from the roof to the ground.
- The waterspout at the corner of the house was blocked with leaves.
