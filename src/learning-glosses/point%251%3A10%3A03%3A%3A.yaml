simpleMeaning: One separate thing in a group of things that can each be named on a list.
scope: This is not a distinguishing quality of a person or the forceful style of a speech; it is one item
  among others that could be listed.
examples:
- The first point on the agenda is the budget.
- He ticked off each point on the checklist.
