simpleMeaning: one of several kinds of tree in the warm parts of the Americas, with nuts that grow on
  it
scope: One of several kinds of tree in the warm parts of the Americas, with nuts that grow on it; corozo
  is another name for this sense, not the nut that grows on it, and not any other kind of tree.
examples:
- The corozo palm bore nuts again this year.
- They gathered nuts from the ground under the corozo palm.
