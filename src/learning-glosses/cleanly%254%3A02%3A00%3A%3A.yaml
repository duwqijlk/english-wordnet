simpleMeaning: in a smooth way, with no trouble, and in an exact and skilful way
scope: 'Also called flawlessly: done in a smooth and exact way, not in a way that makes little dirt, and
  not about a person who is usually clean.'
examples:
- She played the piano part cleanly, without a single wrong note.
- He caught the ball cleanly in one hand.
