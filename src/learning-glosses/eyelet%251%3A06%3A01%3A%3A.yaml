senseId: 'eyelet%1:06:01::'
synsetId: 03137089-n
simpleMeaning: A metal ring that lines a small hole, so cords or lines can be fastened to it.
scope: A metal ring that lines a small hole, also called a loop, a grommet, a cringle, or a grummet, so
  cords or lines can be fastened to it; not the small hole itself, usually round with neat edges, in cloth
  or leather for a cord, hook, or bar to pass through, and not cloth covered with small holes with finely
  stitched edges that form a pretty pattern.
examples:
- He fitted an eyelet into each hole of the tarp.
- The rope passed through the eyelet and held the sail fast.
