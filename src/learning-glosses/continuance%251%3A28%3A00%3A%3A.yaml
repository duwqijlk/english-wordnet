simpleMeaning: The mark of lasting or keeping on in time.
scope: This sense is the mark of lasting or keeping on in time, unlike the sense for the deed of keeping
  on with a deed, with no break, and unlike the sense for the span of time while a thing keeps on.
examples:
- Continuance is the mark of lasting in time.
- Continuance lasts.
