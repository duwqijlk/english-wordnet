simpleMeaning: In physics, the middle point of the weight of the part of a ship or other thing that floats
  and sits under the water
scope: 'Also called center of buoyancy, centre of buoyancy, or centre of immersion: the middle point of
  the weight of the part of a ship or other thing that floats which sits under the water, not the middle
  point of the whole ship and not the point where its weight hangs in balance.'
examples:
- The center of immersion moves when the ship takes on more cargo below the water.
- Engineers found the center of immersion of the new boat before it was put in the water.
