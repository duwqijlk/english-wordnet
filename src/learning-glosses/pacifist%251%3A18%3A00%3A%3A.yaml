simpleMeaning: a person who is against harming people or fighting as a way to settle disagreements
scope: 'Also called a disarmer: a person who is against harming people or fighting to settle disagreements,
  not a soldier and not a person who wants war.'
examples:
- As a pacifist, he refused to join the army.
- The pacifist spoke against the war at the meeting.
