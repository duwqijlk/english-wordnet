simpleMeaning: A flat guard fixed on a door, a wall or a like place to keep dirty fingers from marking
  it
scope: A flat guard fixed on a door, a wall or a like place to keep dirty fingers from marking it, also
  called escutcheon or finger plate; not a door handle and not a plate that hides a keyhole.
examples:
- A scutcheon kept the wall clean around the light switch.
- He fitted a scutcheon behind the door handle.
