simpleMeaning: The taking away of extra or unwanted hair by passing a current through the hair root.
scope: The taking away of extra or unwanted hair by passing a current through the hair root, not the chemical
  breaking down of a liquid and not shaving.
examples:
- Electrolysis removed the unwanted hair.
- She had electrolysis on her upper lip.
