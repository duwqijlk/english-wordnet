simpleMeaning: A musical note lowered by one half step from its natural pitch.
scope: One note moved down by a half step, not a tune that stays on a single pitch, and not a photo where
  light and dark tones are hard to tell apart.
examples:
- The song is in B flat, so every B is played a half step lower.
- That note should be flat, not natural.
