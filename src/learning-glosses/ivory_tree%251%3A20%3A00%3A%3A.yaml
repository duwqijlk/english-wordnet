simpleMeaning: Hard white wood marks this tree of warm Asia, whose bark was once used to cure gut sickness
  with bloody stools and sickness with watery stools.
scope: Also called conessi, kurchee, and kurchi, it is the tree of warm Asia with hard white wood whose
  bark was once used to treat gut sickness with bloody stools and sickness with watery stools.
examples:
- The ivory tree grows in warm Asia.
- Bark from the ivory tree was once used to treat dysentery.
