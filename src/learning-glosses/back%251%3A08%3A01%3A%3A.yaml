simpleMeaning: The row of bones that runs down the center of the body and protects the spinal cord.
scope: This is the column of bones in the body, not the rear surface of the body and not the cover of
  a book.
examples:
- The fall broke his back, and he never walked properly again.
- Arthritis in her back made bending painful.
