simpleMeaning: A thick-bodied moth with wide wings that are boldly striped or spotted, whose young are
  hairy caterpillars.
scope: This sense means the adult moth, and arctiid moth is another name for it; it is not the hairy caterpillar.
  It is not a general word for any patterned moth, since unrelated families also have striped wings. The
  word is technical, used mainly in entomology.
examples:
- An arctiid settled on the bark, its wings barred in black and white.
- The arctiid lays eggs that become hairy caterpillars.
