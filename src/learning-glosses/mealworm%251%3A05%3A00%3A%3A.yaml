simpleMeaning: the young, worm-like form of beetles in the group called Tenebrionidae, before they become
  adult beetles
scope: This is the young form of a beetle; it is not the adult beetle itself and not a true worm.
examples:
- The bird ate a mealworm from the small dish.
- He keeps mealworms to feed his pet lizard, before they turn into beetles.
