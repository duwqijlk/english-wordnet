simpleMeaning: It will not give in or ease up, and it shows no mercy at all
scope: This is a refusal to give in that shows no mercy; inexorability and relentlessness are other names
  for this sense, and it is not a short burst of anger or a firm stand on one point.
examples:
- The inexorableness of the siege left no room for hope.
- His inexorableness on the point ended the debate.
