simpleMeaning: a piece of furniture that is set out with plates and dishes for a meal.
scope: It is furniture ready for eating, not a plain flat-topped piece used for other things or a chart
  of figures.
examples:
- The table was laid with plates and glasses when the guests arrived.
- They sat down at the table, which was covered with dishes of food.
