simpleMeaning: Whose young eat crops, this thin, long-legged moth is usually found in warm lands.
scope: Also called pyralid moth, this thin, long-legged moth stands apart from other moths by its young,
  which eat crops.
examples:
- The pyralid's young ate the crops.
- The pyralid rested on the crops, a thin, long-legged moth.
