simpleMeaning: a part of a state whose people choose one person to serve in the United States House of
  Representatives
scope: This is a part of a state that elects one person to the House of Representatives; not a whole state
  and not a city ward.
examples:
- Our congressional district elected a new member this year.
- The lines of the congressional district were redrawn after the census.
