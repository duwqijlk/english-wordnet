senseId: 'closure_by_compartment%1:10:00::'
synsetId: 06679772-n
simpleMeaning: a rule that cuts short talk on one part of a proposed law
scope: Also called guillotine, it is a rule that cuts short talk on one part of a proposed law, not a
  vote on the whole law and not free talk with no time limit.
examples:
- Closure by compartment ended the long debate on that part of the bill.
- The speaker used closure by compartment to move the bill along.
