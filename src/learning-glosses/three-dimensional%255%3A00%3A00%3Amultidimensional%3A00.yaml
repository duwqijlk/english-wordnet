scope: This is to do with length, width and height, also called 3-dimensional, third-dimensional and three-d;
  not flat and not a trick of the eye alone.
examples:
- Lifelike three-dimensional characters filled the screen.
- She gave a three-dimensional account of conditions under the new government.
