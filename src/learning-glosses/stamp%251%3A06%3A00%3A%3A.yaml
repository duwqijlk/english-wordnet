simpleMeaning: a tool with a mark cut into it, used to press a mark on a thing, to close something safely,
  or to show a paper is real
scope: 'Also called a seal: a tool with a mark cut into it, not a small paper token for post and not a
  heavy bar for crushing ore.'
examples:
- The clerk used a stamp to mark the paper.
- He pressed the stamp onto the wax to close the letter.
