simpleMeaning: any of a group of compounds that dissolve in water, turn litmus dye blue, and react with
  an acid to form a salt and water.
scope: This is not the molecular unit in DNA, the main ingredient of a mixture, or the groundwork of an
  argument; it is the chemical that neutralises acids.
examples:
- Soap is a mild base that feels slippery on the skin.
- Farmers spread a base such as lime on the field to reduce soil acidity.
