simpleMeaning: Rubbing with the fingers to ease strain, built on the idea that points on the feet, hands
  and head join to every part of the body.
scope: Rubbing with the fingers to ease strain, built on the idea that points on the feet, hands and head
  join to every part of the body; not ordinary rubbing of sore muscles and not needle work.
examples:
- She tried reflexology for the ache in her back.
- Reflexology uses finger pressure on the feet.
