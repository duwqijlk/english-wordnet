simpleMeaning: White flowers hang in bunches, and shiny leaves cover this broad-leaved shrub from Asia,
  green all year.
scope: 'Also called andromeda: an Asian shrub with hanging white flowers, not the low flower called lily
  of the valley.'
examples:
- The lily-of-the-valley tree filled the garden with white flowers.
- We planted a lily-of-the-valley tree beside the wall for its glossy leaves.
