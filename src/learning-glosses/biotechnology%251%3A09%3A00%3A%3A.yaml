simpleMeaning: the part of the science of making and building things that uses the study of living things
  to look at how workers and their work places affect each other
scope: This sense, also called bioengineering, is about how workers and their work places affect each
  other, not about using tiny living things to make things in factories.
examples:
- She studies biotechnology to learn how factory workers and their work rooms affect each other.
- His degree in biotechnology focused on workers and the places where they work.
