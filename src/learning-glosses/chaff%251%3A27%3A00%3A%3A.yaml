simpleMeaning: bits left after seeds are taken out, made of seed coverings and small pieces of stem or
  leaves
scope: 'Also called straw, stalk, shuck, stubble and husk: the bits left after seeds are taken out, not
  the thin metal strips thrown into the air against radar.'
examples:
- After threshing, piles of chaff lay beside the barn.
- The wind blew the light chaff away from the wheat.
