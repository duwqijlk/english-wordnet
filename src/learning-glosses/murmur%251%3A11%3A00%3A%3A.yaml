senseId: 'murmur%1:11:00::'
synsetId: 07401520-n
simpleMeaning: A soft, steady sound that is hard to make out, often with the lips moving but no clear
  words spoken.
scope: A continuous low sound that is hard to make out, also called 'mutter' and 'muttering', not a quiet
  complaint, a heart sound, or clear soft speech.
examples:
- The murmur of the stream helped her fall asleep.
- A murmur ran through the crowd as the doors opened.
