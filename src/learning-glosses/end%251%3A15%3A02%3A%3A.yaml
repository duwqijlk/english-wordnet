simpleMeaning: The outer face at either limit of a solid object, such as the top of a post.
scope: This is not the furthest point of an area such as a road and not an aim; it is the actual face
  at one end of a solid thing.
examples:
- The end of the pipe was sealed with a metal cap.
- The ends of the beam were painted to stop water getting in.
