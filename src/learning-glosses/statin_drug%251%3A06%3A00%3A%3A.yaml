simpleMeaning: A medicine that brings down the fatty stuff in the blood by blocking a body chemical that
  makes that fat
scope: A medicine that brings down the fatty stuff in the blood, also called a statin, a lipid-lowering
  medication, or a lipid-lowering medicine; not a drug that raises blood pressure.
examples:
- Her doctor gave her a statin drug to bring down the fat in her blood.
- He takes a statin drug each morning with breakfast.
