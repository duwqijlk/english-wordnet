simpleMeaning: Thin stalks that grow in a tight bunch hold up orange tops on a big poison mushroom, and
  the thin plates under the tops glow in the dark
scope: Also called jack-a-lantern and jack-o-lantern fungus, this is a poison mushroom whose plates glow
  in the dark, not a mushroom safe to eat.
examples:
- A jack-o-lantern grew at the foot of the old oak.
- The gills of a jack-o-lantern shine in the dark.
