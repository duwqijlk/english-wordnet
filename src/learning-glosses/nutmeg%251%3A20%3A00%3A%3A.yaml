simpleMeaning: a tree from East India, grown widely in hot lands for its seed with a strong, pleasant
  smell; it gives two spices, mace and one made from its seed
scope: Also called nutmeg tree. This is the tree itself, not the hard seed from it, ground and used as
  a spice.
examples:
- Farmers in hot lands grow nutmeg for its seed.
- The nutmeg grows best in hot, wet places.
