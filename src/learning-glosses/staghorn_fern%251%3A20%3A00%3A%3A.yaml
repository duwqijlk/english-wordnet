simpleMeaning: The flat leaves of these warm-climate ferns spread out in lobes, often looking like the
  antlers of a male deer.
scope: A tropical fern with big flat leaves shaped like a male deer's antlers, not the deer itself.
examples:
- The staghorn fern had large flat leaves shaped like antlers.
- This staghorn fern is one of several kinds with lobed leaves.
