simpleMeaning: a toy pistol or rifle that fires small plugs of soft tree bark
scope: A toy pistol or rifle that fires small plugs of soft tree bark; not a toy that fires water, and
  not a real weapon.
examples:
- The boy's cork gun fired a soft plug across the room.
- He aimed his cork gun at the tin cans on the wall.
