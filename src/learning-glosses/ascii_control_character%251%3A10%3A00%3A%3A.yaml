simpleMeaning: Signs in a code that mean going back to the start of a line, moving to a tab stop, or erasing
  a sign, typed with two keys held down.
scope: Also called a control character; a mark in a code that stands for an action, not a letter or a
  number that shows on the screen.
examples:
- Pressing the keys together typed an ASCII control character that moved the cursor back.
- An ASCII control character told the machine to go back to the start of the line.
