simpleMeaning: making a living thing react to a blood fluid, called serum, by giving it a set of shots
scope: This is making a living thing react to a serum by a set of shots, also called sensitising, sensitization
  and sensitizing; not making a thing react to light and not a single shot.
examples:
- The sensitisation of the mice took several weeks of injections.
- Sensitisation made the animals react to the serum.
