simpleMeaning: The act of looking something up in a source, or turning to someone for information.
scope: This is the action of checking a source, not the book or passage you check, and not the meaning
  a word carries.
examples:
- You may use the dictionary for reference during the exam.
- He made a quick reference to his notes before answering the question.
