simpleMeaning: about the work and duties of running a business or group
scope: This sense describes the work and duties of running a business or group. It is not about one worker's
  own tasks, and not about a boss as a person.
examples:
- She has many managerial duties in her new job.
- The course teaches managerial skills for running a small office.
