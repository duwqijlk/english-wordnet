simpleMeaning: The bones joining the legs to the body in animals with a backbone, holding up the lower
  legs in people and the back legs or like parts in others.
scope: A hip, a pelvis and a pelvic arch are other names for these bones, which join the legs to the body.
examples:
- The pelvic girdle joins the legs to the body.
- The pelvic girdle holds up the lower legs in people.
