simpleMeaning: A small thin European fish of fresh water, often used as bait by people who fish with a
  rod.
scope: A small thin European fish of fresh water, often used as bait, not a pin that joins parts of a
  machine and not a sea fish.
examples:
- The angler used a gudgeon as bait for pike.
- Gudgeons swim in the clear streams of Europe.
