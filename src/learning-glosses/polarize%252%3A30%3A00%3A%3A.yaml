simpleMeaning: to split into two opposing sides that no longer agree or work together
scope: To split into two opposing sides on your own, not to push others apart, and not about waves moving
  in one pattern.
examples:
- The town polarized over the new road plan.
- As the debate went on, the crowd polarized into two camps that would not listen to each other.
