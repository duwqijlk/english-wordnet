simpleMeaning: to make someone notice and feel things that they did not notice before
scope: To make someone notice and feel things they did not notice before; sensibilise, sensibilize, sensitise
  and sensitize are other names for this act, not causing a thing to sense light and not making a person
  react to a drug.
examples:
- The course sensified students to local needs.
- Music sensified her to the mood of the place.
