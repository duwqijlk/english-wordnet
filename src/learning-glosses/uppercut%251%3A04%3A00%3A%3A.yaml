simpleMeaning: A hit that swings up from below, aimed especially at the chin of the person you are fighting
scope: This sense is a hit that swings up to the chin, not a straight hit forward and not a hit to the
  side of the head.
examples:
- The boxer hit him with an uppercut to the chin.
- One strong uppercut ended the fight.
