simpleMeaning: With leaves like grass, one of several long-lived plants of the Aletris group has a bitter
  underground part said to cure belly pain
scope: This is a plant said to cure belly pain, not a drug or a garden flower; also called colicroot,
  crow corn, star grass, and unicorn root.
examples:
- She dug up colic root for its bitter roots.
- Colic root was once said to cure belly pain.
