simpleMeaning: a brown bug that lives in and eats grain kept in store, most of all the white grain eaten
  with meals in Asia
scope: 'Also called a black weevil: a brown bug that lives in stored grain, not a bug that eats crops
  in the field and not a bug that eats wood.'
examples:
- The rice weevil had got into the sack of grain in the store.
- We found a rice weevil in the jar of grain in the cupboard.
