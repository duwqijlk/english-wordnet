schema: oewn-learning-gloss-v2
senseId: 'prate%2:32:00::'
synsetId: 01038676-v
simpleMeaning: To go on talking without a pause, fast, about things that do not matter.
scope: 'Also called chatter, and another name for it is clack, and also prattle, and also gibber, and
  also gabble, and also blabber, and also blab, and also tattle, and also piffle, and also twaddle, and
  also palaver, and also maunder: to go on talking without a pause, fast, about things that do not matter,
  not the empty talk itself.'
examples:
- He prated on about his neighbours for an hour.
- The old man prated away, saying nothing of worth.
