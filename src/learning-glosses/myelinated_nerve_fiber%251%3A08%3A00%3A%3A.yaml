simpleMeaning: A thread that carries signals in the body, wrapped in a fatty coat.
scope: A signal thread wrapped in a fatty coat; medullated nerve fiber is another name for this, and it
  is not a bare signal thread or a muscle thread.
examples:
- The myelinated nerve fiber carried the signal quickly.
- Damage to a myelinated nerve fiber slows the signal.
