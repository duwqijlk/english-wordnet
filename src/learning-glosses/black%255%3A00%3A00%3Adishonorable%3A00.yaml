simpleMeaning: so shameful that it deserves or causes loss of respect, said of a person's actions or nature.
scope: This is not about wicked forces behind something and not about an event that brings ruin; it judges
  conduct or character as shameful.
examples:
- It was a black deed that the village remembered for years.
- He earned a black reputation for cheating his partners.
