simpleMeaning: To do the work of someone or something else for a time
scope: To do the work of someone or something else for a time, not to swap one thing for another and not
  just to stand in as a thing.
examples:
- She substituted for the soprano who had a cold.
- He substituted as captain while the captain was hurt.
