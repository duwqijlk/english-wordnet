simpleMeaning: a wild party or meeting where people drink far too much and have sex with many different
  people
scope: 'Also called riot, debauchery, debauch, saturnalia, bacchanal, and bacchanalia: a wild party with
  too much drink and sex with many people; not the old Greek or Roman secret rite with singing, dancing,
  drink, and sex.'
examples:
- The party turned into an orgy, with guests drinking bottle after bottle and pairing off with strangers.
- After the feast, the night ended in an orgy of heavy drinking and sex with many partners.
