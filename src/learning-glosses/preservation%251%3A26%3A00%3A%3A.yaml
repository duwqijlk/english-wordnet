simpleMeaning: how well or badly something has been kept from harm or change
scope: The state of something kept from harm or change, not the act of keeping it safe and not a process
  that stops things from rotting.
examples:
- The preservation of the old letters was poor, and many pages had faded.
- They checked the preservation of the wooden house after the long winter.
