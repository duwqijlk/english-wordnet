simpleMeaning: Money lent by a lender straight to a borrower, with no go-between, which lets the lender
  choose more freely who gets it
scope: Money lent straight from lender to borrower with no go-between, not a loan through a broker and
  not a gift.
examples:
- The bank made a direct loan to the farmer without a broker.
- A direct loan lets the lender decide freely who gets the money.
