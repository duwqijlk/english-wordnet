senseId: 'packed_cell_volume%1:24:00::'
synsetId: 13843978-n
simpleMeaning: The share of the whole blood taken up by the red parts pressed close together, as read
  by a hematocrit test
scope: The share of the whole blood taken up by the red parts; haematocrit and hematocrit are other names
  for this measure, not the whole blood itself.
examples:
- The lab reported his packed cell volume as 45 percent.
- A low packed cell volume can mean too few red cells.
