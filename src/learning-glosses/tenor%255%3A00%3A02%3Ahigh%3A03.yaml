simpleMeaning: For a musical instrument, having a sound range in the middle, between alto (higher) and
  baritone or bass (lower)
scope: This word describes an instrument and its sound range. It is not a male singer with a high voice,
  and not the general way of a person's life.
examples:
- He plays a tenor saxophone in the school band.
- She bought a tenor recorder, lower than the small one but higher than the bass one.
