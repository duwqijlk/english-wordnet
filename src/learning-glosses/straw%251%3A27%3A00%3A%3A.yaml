simpleMeaning: the dry stems of grain plants, used to weave things such as baskets and hats or to feed
  farm animals
scope: This is the dry stems of grain plants used for weaving or animal feed, not a thin tube for drinking
  and not a pale yellow colour.
examples:
- She wove a hat from straw.
- The farmer fed the cows straw after the harvest.
