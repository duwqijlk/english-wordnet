senseId: 'interchange%1:04:01::'
synsetId: 00040890-n
simpleMeaning: people acting with each other and giving and taking things back and forth, especially information
scope: This sense, also called reciprocation, is about people giving and taking with each other, especially
  information; it is not swapping money of equal value and not a place where roads join.
examples:
- There was a lively interchange of ideas between the two teachers.
- The interchange of news helped both groups learn fast.
