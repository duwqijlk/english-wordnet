simpleMeaning: One thousand kilograms of goods moved by one kind of transport over one thousand metres
  counts as one unit of freight work.
scope: Freight work is counted in these units, also called tkm and tonne-kilometre.
examples:
- A transport of 1250 kilograms over 90 kilometers equals 112.5 tonne-kilometers.
- The freight was counted in tonne-kilometers.
