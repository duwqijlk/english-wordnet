simpleMeaning: All the days of the year are set out in this small list, carried in a coat or a wallet
  as a plain plastic card, a booklet, or a notebook.
scope: A pocket calendar and a wallet calendar are other names for this small list of the days of the
  year, made to be carried in a coat or a wallet.
examples:
- They keep a pocket planner in a coat pocket.
- A pocket planner sets out all the days of the year.
