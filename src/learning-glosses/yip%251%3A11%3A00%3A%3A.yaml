simpleMeaning: a sharp cry in a very high voice, especially by a dog
scope: 'Also called yelp and yelping: a short, sharp cry, especially from a dog. Not the verb sense, which
  is the act of making this cry.'
examples:
- The small dog gave a loud yip when the door shut.
- A yip from the puppy woke us in the night.
