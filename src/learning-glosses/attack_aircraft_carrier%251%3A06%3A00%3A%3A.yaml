simpleMeaning: A long flat top for planes to leave from and land on sits on this big warship that carries
  them.
scope: This is a large warship that carries planes, also called carrier, aircraft carrier, and flattop,
  not a small boat.
examples:
- The attack aircraft carrier sailed with planes on its deck.
- Planes took off from the attack aircraft carrier and landed back on it.
