simpleMeaning: a sudden, wild confusion that comes from drinking far too much alcohol
scope: This is sudden wild confusion caused by too much alcohol; not confusion from fever or injury.
examples:
- After days of heavy drinking, he was taken to hospital with delirium tremens.
- Delirium tremens can bring shaking and frightening visions.
