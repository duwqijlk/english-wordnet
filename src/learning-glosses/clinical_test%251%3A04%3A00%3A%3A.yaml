simpleMeaning: Under strict control, people are given a new medicine or a new tool put inside the body,
  with the FDA in America directing it before doctors use it widely.
scope: Also called clinical trial, this test of a new medicine or a new tool put inside the body is run
  under strict control, with the FDA in America directing it before doctors use it widely.
examples:
- Doctors ran a clinical test on the new drug.
- Patients joined a clinical test of the new device.
