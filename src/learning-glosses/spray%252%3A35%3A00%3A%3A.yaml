simpleMeaning: to throw a liquid about in a mass or a stream of tiny drops
scope: To throw a liquid about in a mass or a stream of tiny drops, not to cover a thing by throwing liquid
  on it and not to come out as drops on its own.
examples:
- She sprayed water over the dry plants.
- The children sprayed each other with the hose.
