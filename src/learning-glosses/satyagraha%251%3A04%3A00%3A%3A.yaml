simpleMeaning: A way to resist without using force, started in India by Mahatma Gandhi to oppose British
  rule and to bring political reforms sooner
scope: This is Gandhi's way of nonviolent resistance, not violent revolt and not passive acceptance.
examples:
- Satyagraha was Gandhi's way of fighting British rule without force.
- The marchers used Satyagraha to press for change.
