simpleMeaning: A solid plastic material that does not dissolve, usually small white or yellowish beads,
  used to swap one charged particle for another in a liquid.
scope: This is the solid bead material itself, also sold under the name ion-exchange polymer, not the
  natural sticky substance from trees and not the chemical process of swapping charged particles.
examples:
- The ion-exchange resin in the filter had to be replaced every few months.
- Laboratories use an ion-exchange resin to remove calcium from hard water.
