senseId: 'demanding%3:00:01::'
synsetId: 00713705-a
simpleMeaning: needing more than people usually expect or think is right, especially much patience, much
  effort, and much skill
scope: Needing much patience, work and skill, more than is usual; not asking people in a firm way to do
  things, and not just a short hard job.
examples:
- Caring for three small babies is very demanding work.
- The climb was demanding, but the team had the skill to finish it.
