simpleMeaning: one of the blood tubes that carry blood away from the walls of the stomach
scope: This is one of the blood tubes that carry blood away from the stomach walls, not an artery that
  brings blood to the stomach and not a blood tube in the leg.
examples:
- The surgeon tied off a gastric vein during the operation.
- Blood from the stomach walls flows out through a gastric vein.
