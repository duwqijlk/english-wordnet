simpleMeaning: a plant from the east of North America with bunches of rough blue flowers
scope: This is a kind of flowering plant, also called ague weed, agueweed, and five-flowered gentian,
  not a plant from the west and not a plant with smooth flowers.
examples:
- The stiff gentian grew in bunches along the east coast.
- We saw a stiff gentian with bright blue flowers by the path.
