senseId: 'whisper%1:10:00::'
synsetId: 07145049-n
simpleMeaning: Soft speech made with breath alone, without the vocal cords vibrating.
scope: This is the act of speaking very softly, not the soft rustling sound of silk or leaves.
examples:
- She lowered her voice to a whisper so the children would not hear.
- He answered in a whisper because his throat was sore.
