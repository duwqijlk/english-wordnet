simpleMeaning: A law passed by Congress in 1978 setting out how judges approve foreign spying and creating
  the Foreign Intelligence Surveillance Court, to strengthen US counterintelligence, apart from ordinary
  police spying.
scope: Also called the Foreign Intelligence Surveillance Act; a law about spying on foreign powers, not
  the secret court it created.
examples:
- FISA was passed in 1978.
- The request was made under FISA.
