simpleMeaning: a rod used to clean the inside tube (the barrel) of a gun
scope: A rod used to clean a gun; not a rod for pushing a charge into an old gun, and not a strict person
  who watches over workers.
examples:
- He pushed the ramrod through the barrel to clean the rifle.
- After firing, she cleaned the gun with a ramrod.
