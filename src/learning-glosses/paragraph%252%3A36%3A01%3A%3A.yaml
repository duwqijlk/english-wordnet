simpleMeaning: to write about someone in a short part of a paper
scope: To write about someone in a short part of a paper, not the part itself, not writing in such parts,
  and not splitting a text into them.
examples:
- The paper paragraphed the mayor in its Monday edition.
- He was paragraphed in the town paper last week.
