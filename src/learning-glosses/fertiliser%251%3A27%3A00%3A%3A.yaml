simpleMeaning: Any substance, such as dung or a mix of nitrates, salts that feed plants, that is put on
  soil to make it richer for growing plants.
scope: Any substance, also called fertilizer or plant food, such as dung or a mix of nitrates, salts that
  feed plants, that is put on soil to make it richer for growing plants.
examples:
- The farmer spread fertiliser over the field before sowing.
- This fertiliser will help the tomatoes grow.
