senseId: 'meanly%4:02:01::'
synsetId: 00399514-r
simpleMeaning: in a poor way, or in a way that is not as good as it should be
scope: About doing something in a poor, low way; not in a shameful way and not in an angry, unkind way.
examples:
- The troops were meanly equipped for the cold winter.
- He was meanly paid for such hard and careful work.
