simpleMeaning: The way a particular person sounds when they talk, including their accent and the kind
  of words they use.
scope: This is the personal way someone talks, not a formal address given to an audience and not spoken
  communication in general.
examples:
- I could tell from her speech that she had grown up in the north.
- His speech was slow and deliberate, as if he weighed every word.
