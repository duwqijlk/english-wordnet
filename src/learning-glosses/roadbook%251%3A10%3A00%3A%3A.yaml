simpleMeaning: a guide that shows the routes through a country, with maps and at times a list of place
  names
scope: A guide to the roads of a country, not a map on its own and not a book about one town.
examples:
- We used a roadbook to plan our drive across France.
- The roadbook showed the main roads and the small towns along the way.
