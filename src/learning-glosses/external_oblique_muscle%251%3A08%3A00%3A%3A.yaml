simpleMeaning: A band of flesh in the belly set on a slant on either side of the trunk of the body.
scope: A belly part set on a slant on either side of the trunk; also called an oblique, an abdominal external
  oblique muscle, or musculus obliquus externus abdominis, not a straight belly part and not a part of
  the back.
examples:
- The external oblique muscle helps twist the trunk.
- He felt the external oblique muscle tighten as he turned.
