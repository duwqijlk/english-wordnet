synsetId: 02166868-s
simpleMeaning: not able to tell one or more shades that are not black, white, or grey apart from each
  other
scope: This is not being able to tell some shades that are not black, white, or grey apart, also called
  color-blind; not poor sight in general and not a total loss of sight.
examples:
- He is colour-blind and cannot tell red from green.
- The colour-blind boy mixed up the blue and purple crayons.
