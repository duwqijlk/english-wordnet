simpleMeaning: In mineralogy, a small round lump of mineral, usually harder than the rock or loose earth
  around it
scope: In mineralogy, this is a hard lump in rock or earth, not the small round growth on a plant.
examples:
- He found a small nodule in the rock face.
- This nodule is harder than the soft rock around it.
