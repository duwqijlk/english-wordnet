simpleMeaning: Any of several digging animals of the hare family, with long ears and short tails, some
  kept as pets or raised for food
scope: Any of several digging animals of the hare family, also called rabbit and cony, not a mouse and
  not a squirrel.
examples:
- A coney dug its burrow under the hedge.
- Farmers once raised coneys for food.
