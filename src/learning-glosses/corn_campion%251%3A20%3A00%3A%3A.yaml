simpleMeaning: A European plant that lives for one year, with big trumpet-shaped red-purple flowers and
  poisonous seeds; a common weed of grain fields and roadsides, now growing wild in America.
scope: Another name for corn cockle and crown-of-the-field; this is the poisonous cornfield weed, not
  the blue cornflower.
examples:
- Corn campion once grew so thickly among the wheat that farmers dreaded it.
- Its seeds are poisonous, so corn campion is unwelcome near grazing land.
