simpleMeaning: Either of the two marks < and >, used in computer code and at times to mark off words
scope: Either of the two marks < and > used in computer code; bracket is another name for this sense,
  not a curved mark used in pairs in writing and not a square mark used for lists.
examples:
- Put an angle bracket around the web address in the code.
- The angle bracket shows where the tag starts in the program.
