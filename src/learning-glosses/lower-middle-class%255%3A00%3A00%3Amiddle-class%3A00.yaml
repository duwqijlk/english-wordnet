simpleMeaning: In the bottom half of the in-between range of money and standing in a society
scope: In the bottom half of the in-between range of money and standing, not the top half of that range
  and not the poorest group.
examples:
- They lived in a lower-middle-class street of small neat houses.
- Her lower-middle-class family could pay for school but not for a car.
