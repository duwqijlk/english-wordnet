simpleMeaning: The feel of wonder and thrill that hangs over a time of brave deeds or a bold journey.
scope: Also called romance, this is the exciting, mysterious feel of a heroic time or adventure, not dreamy,
  impractical ideas about love and life.
examples:
- The old castle was full of romanticism.
- He loved the romanticism of sailing to far lands.
