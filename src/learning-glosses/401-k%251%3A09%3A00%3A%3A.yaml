simpleMeaning: A retirement account funded from pre-tax salary, often employer-matched, growing untaxed
  until withdrawal, which can become an individual retirement account, carried between jobs with some
  investment choice.
scope: This is an employer-linked retirement account, not a traditional pension and not the individual
  retirement account it can later become.
examples:
- She puts ten percent of her salary into her 401-k every month.
- The company matches the first three percent of any 401-k contribution.
