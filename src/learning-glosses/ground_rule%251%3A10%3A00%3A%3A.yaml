simpleMeaning: In baseball, a special way of dealing with things that happen because of the nature of
  the playing field
scope: In baseball, a special way of dealing with things that happen because of the field itself, not
  a general law of the game and not a decision by the umpire about a play.
examples:
- The ground rule gave the batter two bases when the ball bounced into the stands.
- A ground rule covers balls lost in the ivy at this ballpark.
