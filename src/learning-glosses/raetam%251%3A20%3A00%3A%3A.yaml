simpleMeaning: a desert bush of Syria and Arabia with small white flowers, the juniper of the Old Testament,
  sometimes put in the plant group Genista
scope: Also called juniper, juniper bush, and retem; a desert bush of Syria and Arabia, not a tall tree
  and not a garden shrub.
examples:
- The raetam grows in the dry lands of Arabia.
- Raetam bushes showed small white flowers in spring.
