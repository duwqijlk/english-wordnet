simpleMeaning: A colourless drug that is not acid and that stops the growth of germs that keep a purple
  dye in a test.
scope: A colourless drug that stops the growth of germs that keep a purple dye in a test, not a drug that
  kills all germs and not a coloured dye.
examples:
- The doctor gave carbomycin for the infection.
- Carbomycin stops the growth of the germs in the test.
