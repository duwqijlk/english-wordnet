simpleMeaning: In biology, the study of what very cold temperatures do to living tissues, parts of the
  body, or whole living things
scope: This is the study of cold on living things, not the study of cold weather and not the freezing
  of bodies after death.
examples:
- She works in cryobiology, testing how frost harms cells.
- Cryobiology helps doctors store living tissue safely.
