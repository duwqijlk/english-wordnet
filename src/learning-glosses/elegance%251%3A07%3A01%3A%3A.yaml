simpleMeaning: the quality of a neat, plain and clever answer to a question, above all in science or work
  with numbers
scope: Not good looks or fine clothes; this is neat, clever simplicity in solving a problem.
examples:
- The elegance of his proof made the whole class smile.
- The simplicity and elegance of his invention won praise.
