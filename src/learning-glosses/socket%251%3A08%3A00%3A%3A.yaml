simpleMeaning: a hollow place in a bone where another part of the body fits into it
scope: A hollow in bone for a body part, not a holder that a pipe or probe is put into.
examples:
- The ball of the thigh bone fits into a socket in the hip bone.
- The doctor showed how the eye sits in its socket.
