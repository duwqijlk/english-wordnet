simpleMeaning: a colourless crystal drug used to make people sleep; it can upset the stomach and can be
  habit-forming
scope: A colourless crystal drug that brings sleep but can upset the stomach and be habit-forming; not
  a painkiller and not a drug that wakes people up.
examples:
- The doctor gave him chloral hydrate to help him sleep.
- Chloral hydrate can upset the stomach if taken often.
