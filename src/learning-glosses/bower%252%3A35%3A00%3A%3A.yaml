simpleMeaning: to cover or close in a place with trees or climbing plants that give shade
scope: The action of covering a place with trees or climbing plants, not the frame that holds climbing
  plants up.
examples:
- Trees bower the small garden path in summer.
- The vines bowered the seat and kept it in shade.
