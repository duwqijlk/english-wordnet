scope: A sport of shooting at clay discs thrown into the air, also called skeet and skeet shooting; not
  hunting live birds and not shooting at fixed targets on the ground.
examples:
- He won a medal in trapshooting at the county fair.
- Trapshooting takes quick aim, since the clay discs fly up fast.
