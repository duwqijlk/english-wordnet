simpleMeaning: an evil spirit or small ugly creature in old stories; when used as a name with a capital
  letter, the Devil
scope: This sense is also called bogie and bogy. It is an evil creature in stories, or the Devil when
  used as a name, not a score in golf.
examples:
- Children in the old tale feared the bogey in the dark wood.
- In that story, Old Bogey is used as a name for the Devil.
