simpleMeaning: With nothing between its two walls, this pot holds what is put inside at a high or low
  heat.
scope: Vacuum flask is another name for this pot, whose two walls with nothing between them hold what
  is put inside hot or cold.
examples:
- The vacuum bottle kept the drink hot.
- Cold milk stayed cold in the vacuum bottle.
