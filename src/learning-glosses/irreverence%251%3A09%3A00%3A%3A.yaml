senseId: 'irreverence%1:09:00::'
synsetId: 06217468-n
simpleMeaning: a way of thinking that shows no respect for things that people treat as serious or holy
scope: A lack of respect in how a person thinks, not deep respect for holy things and not a single rude
  act on its own.
examples:
- His irreverence shocked the priests, as he saw nothing holy in the old rules.
- She spoke of the ceremony with irreverence, though others treated it as sacred.
