simpleMeaning: The group, about eighty-five in a hundred people, whose red cells carry the Rh factor.
scope: The common group, also called Rh positive; the other main group is the one whose red cells lack
  the Rh factor.
examples:
- Her Rh-positive blood type was written on her card.
- The lab checked his Rh-positive blood type before the operation.
