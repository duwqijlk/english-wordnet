simpleMeaning: In everyday talk, a very small bit of anything at all.
scope: 'Also called a speck, a molecule, and an atom: in everyday talk, a very small bit of anything at
  all, not a grammar word, and not a body with mass in physics.'
examples:
- A particle of dust floated in the light.
- Not a particle of food was left on the plate.
