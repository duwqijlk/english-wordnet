simpleMeaning: the amount of something, such as whiskey or oil, that is lost while it is stored or moved
scope: An amount of something lost while stored or moved, not a short stop in the working of a machine.
examples:
- The outage of whiskey in the warehouse was larger than expected.
- The company measured the outage of oil lost on the road.
