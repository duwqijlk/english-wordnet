schema: oewn-learning-gloss-v2
senseId: 'stock%2:29:03::'
synsetId: 00095131-v
simpleMeaning: To send out new growth in the form of shoots.
scope: This sense is a plant pushing out new shoots, not keeping goods on hand, furnishing a place with
  a stock of goods, equipping something with a stock, putting fish or livestock somewhere, gathering goods
  for later sale, or any noun sense (broth, shop merchandise, company shares, a share certificate, a stored
  supply, a gun or tool handle, lumber, a white cravat, farm animals or a breed of them, a family line,
  reputation, a thick perennial stem, a graft rootstock, a Malcolmia plant, an Old World garden plant)
  or adjective sense (overused, routine, standard).
examples:
- The plant stocked early this year, sending up shoots before the last frost.
- Pruned hard in winter, the old lilac stocked and pushed out shoots all along its branches.
