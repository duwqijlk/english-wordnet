senseId: 'greenhood%1:20:00::'
synsetId: 12101716-n
simpleMeaning: Any Pterostylis orchid with leaves in a low base ring and green flowers, often striped
  purple, brown or red, whose top sepal, an outer petal, curls in like a cap.
scope: This is the green-flowered Pterostylis orchid whose top sepal curls like a cap; helmet orchid is
  another name for the same plant, and it is not the Coryanthes helmet orchid with its helmet-shaped lip.
examples:
- A greenhood grew beside the track, its green flower striped with dark red.
- Greenhoods keep their leaves in a flat ring close to the ground.
