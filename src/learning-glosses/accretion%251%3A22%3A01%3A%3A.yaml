simpleMeaning: In geology, new land built up from mud and sand dropped by water.
scope: In geology, new land built up from deposits left by water; not the growth of a heavenly body by
  gravity, not a larger share of an estate, and not growth by bits sticking together.
examples:
- Accretion along the river added new fields to the farm.
- The delta grew by accretion as the river dropped its mud.
