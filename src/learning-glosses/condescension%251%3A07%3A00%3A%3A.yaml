simpleMeaning: the quality of acting as if you are better than other people and treating people you see
  as lower in a way that shows it
scope: The quality of acting as if you are better than people you see as lower, also called superciliousness
  and disdainfulness; not friendly behaviour that sets aside rank for a time, and not one message that
  shows this.
examples:
- He spoke to the workers with condescension, as if they knew nothing.
- Her condescension made the young staff feel small and less important.
