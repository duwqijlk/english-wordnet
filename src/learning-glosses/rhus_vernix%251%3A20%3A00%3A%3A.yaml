simpleMeaning: A smooth shrub of American swamps with leaves of leaflets along a stem and greenish flowers
  followed by greenish-white berries; it gives an oil that stings the skin.
scope: Also called poison ash, poison dogwood, poison sumac and Toxicodendron vernix; a smooth shrub of
  American swamps with leaves of leaflets along a stem, greenish flowers and greenish-white berries, giving
  an oil that stings the skin.
examples:
- Rhus vernix grew in the swamp, its greenish flowers barely noticed.
- Touching Rhus vernix can raise a rash from its irritating oil.
