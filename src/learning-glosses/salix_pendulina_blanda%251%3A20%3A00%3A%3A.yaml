simpleMeaning: A cross-bred willow that usually hangs down only a little.
scope: Also called Salix blanda, Salix pendulina, or Wisconsin weeping willow, this is a cross-bred willow
  that usually hangs down only a little, not a willow that weeps strongly.
examples:
- Salix pendulina blanda hangs down only a little.
- The Salix pendulina blanda by the pond is a cross-bred willow.
