simpleMeaning: worried or troubled again and again, especially by small things that keep bothering you
scope: 'Also called annoyed, harassed, vexed and pestered: troubled again and again by small things, not
  just angry once or very sad.'
examples:
- The harried mother tried to answer all her children at once.
- He looked harried as the phones kept ringing around him.
