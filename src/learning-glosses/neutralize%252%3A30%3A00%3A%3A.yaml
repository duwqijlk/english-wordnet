simpleMeaning: In chemistry, to change an acid or a base so that it is no longer an acid or a base
scope: 'Also called neutralise: in chemistry, to make a thing no longer an acid or a base, not to make
  a place take no side in politics and not to stop the effect of something.'
examples:
- She neutralized the acid by adding a base to it.
- The chemist neutralized the liquid before he poured it away.
