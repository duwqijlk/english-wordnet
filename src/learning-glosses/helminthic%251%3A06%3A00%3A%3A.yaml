simpleMeaning: Worms that live as parasites in the gut are pushed out of the body by this medicine.
scope: Also called a vermifuge, anthelminthic, and anthelmintic, this medicine pushes worms that live
  as parasites in the gut out of the body.
examples:
- She took a helminthic to clear the worms.
- After the helminthic, the worms were gone.
