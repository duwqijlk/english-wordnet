simpleMeaning: In computing, a way to send written notes around the world, each typed at one machine and
  read at another when the reader signs in
scope: In computing, the whole system for sending written notes around the world, not one note sent and
  not a person's address on the system.
examples:
- Email lets people send notes around the world in seconds.
- The firm set up email for all its staff.
