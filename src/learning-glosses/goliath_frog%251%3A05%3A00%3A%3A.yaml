simpleMeaning: The biggest animal of its kind alive today, found in Africa, can grow to a foot long and
  weigh as much as ten pounds
scope: The biggest animal of its kind alive today, found in Africa, not a small one and not one found
  in other lands.
examples:
- The goliath frog can weigh as much as a small dog.
- We saw a goliath frog near the river in Africa.
