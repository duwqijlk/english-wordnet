simpleMeaning: having many turns and bends, again and again
scope: Also called twisting, winding, twisty and tortuous, this sense is about anything with many turns
  and bends, again and again, not about being large in size or amount.
examples:
- The river followed a voluminous path, turning and bending through the hills.
- A voluminous rope lay on the floor, bent round and round in loose coils.
