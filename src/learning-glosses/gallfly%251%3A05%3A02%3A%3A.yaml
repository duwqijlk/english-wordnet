simpleMeaning: A small lone insect that makes round growths on oaks and other plants.
scope: This is a small lone insect that makes round growths on oaks and other plants, also called a cynipid
  gall wasp, a cynipid wasp or a gall wasp; not the wider group of egg-laying insects that make growths
  on plants.
examples:
- The gallfly laid its eggs in the oak leaf.
- A gallfly made the round growth on the oak twig.
