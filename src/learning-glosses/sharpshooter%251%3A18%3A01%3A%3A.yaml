simpleMeaning: a sports person known for aiming very well and hitting the target
scope: This is a sports person known for hitting the target well; it is not the fast boat once used by
  fishermen in New England for fishing where it was not allowed.
examples:
- The young sharpshooter hit the centre of the target ten times in a row.
- As a sharpshooter, she won the shooting contest at the games.
