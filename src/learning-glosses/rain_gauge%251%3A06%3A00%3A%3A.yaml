simpleMeaning: An instrument that tells how much water has fallen from the sky
scope: A tool for measuring how much water falls from the sky, also called a rain gage, a pluviometer
  or an udometer; not a thermometer and not a wind gauge.
examples:
- The rain gauge in the garden read half an inch.
- He checked the rain gauge after the night's storm.
