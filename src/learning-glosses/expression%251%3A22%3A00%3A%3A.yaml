simpleMeaning: In genetics, the process by which the information in a gene is used.
scope: The biological process that puts a gene's instructions to work, not the physical squeezing-out
  of a substance or the look on a face.
examples:
- Researchers measured the expression of the gene in both samples.
- Gene expression changes as the cells mature.
