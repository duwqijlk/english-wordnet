simpleMeaning: a smooth sausage made of beef or pork cut into very small pieces, usually smoked, and often
  served in a bread roll
scope: Also called dog, frank, weenie, wiener, hotdog, hot dog and wienerwurst, this smooth smoked sausage
  is not just any sausage and not the bread roll alone.
examples:
- He ate a frankfurter in a bread roll with mustard.
- The frankfurters were smoked and served hot in rolls.
