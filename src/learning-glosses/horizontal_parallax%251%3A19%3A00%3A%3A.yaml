schema: oewn-learning-gloss-v2
senseId: 'horizontal_parallax%1:19:00::'
synsetId: 11549609-n
simpleMeaning: The greatest shift in where a body in the sky seems to be, seen when it stands at the edge
  of the sky
scope: The greatest shift in where a body in the sky seems to be, seen when it stands at the edge of the
  sky; not the shift seen when it is high up, and not a change in the body itself.
examples:
- The horizontal parallax of the moon is measured at moonrise.
- At the horizon, the horizontal parallax reaches its greatest value.
