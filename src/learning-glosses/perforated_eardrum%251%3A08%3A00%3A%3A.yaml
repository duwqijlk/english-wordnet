simpleMeaning: Hearing can get worse, and other ear troubles can come on, when the thin skin in the ear
  has a hole or tear in it
scope: A hole or tear in the thin skin in the ear that can hurt hearing, not a sore ear on the outside
  and not a blocked ear.
examples:
- A perforated eardrum left him deaf in one ear after the blast.
- The doctor said her perforated eardrum would heal in a few weeks.
