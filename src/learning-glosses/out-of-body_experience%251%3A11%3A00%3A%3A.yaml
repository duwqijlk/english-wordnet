simpleMeaning: The strange feeling of watching yourself from somewhere else, as if your mind or spirit
  had left you and was looking at you.
scope: The strange feeling of watching yourself from somewhere else, as if your mind or spirit had left
  you; not a dream and not fainting.
examples:
- She had an out-of-body experience during the operation and felt she was watching herself from above.
- In his out-of-body experience, he saw himself lying on the bed as if from above.
