simpleMeaning: to pass something along, acting as the way it travels from one place to another
scope: 'Also called carry, channel, and conduct: to pass something along, not to send a message in words
  and not to move a thing yourself.'
examples:
- Sound carries well over water, so the lake conveyed the music to the far shore.
- The metal rod conveyed heat from the fire to the pot.
