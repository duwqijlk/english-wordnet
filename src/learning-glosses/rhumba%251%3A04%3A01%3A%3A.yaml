simpleMeaning: A ballroom dance built on the Cuban folk dance.
scope: This sense is also called rumba, for a ballroom dance built on the Cuban folk dance, unlike the
  sense for a dance of the folk, in two-time, born in Cuba with Spanish and African parts, marked by tricky
  footwork and fierce movement, unlike the sense for off-beat tunes in duple beat for dancing the rumba,
  and unlike the sense for dancing the rhumba.
examples:
- The rhumba is a ballroom dance built on the Cuban folk dance.
- They dance the rhumba in the ballroom.
