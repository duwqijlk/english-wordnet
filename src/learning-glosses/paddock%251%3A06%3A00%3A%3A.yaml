simpleMeaning: a small fenced area where horses for a race have saddles put on and are walked around to
  be seen before the race
scope: This is the area at a race track where horses are readied and shown before a race, not a field
  where horses live and not the race itself.
examples:
- The horses waited in the paddock while their saddles were put on.
- People stood by the paddock to see the horses before the race.
