simpleMeaning: a person who has a mental illness in which strong feelings are hard to control and can
  affect the body
scope: A person with this mental illness, not the word for something caused by or marked by that illness.
examples:
- In the old book, the hysteric could not stop crying.
- They treated the hysteric as a patient who needed calm care.
