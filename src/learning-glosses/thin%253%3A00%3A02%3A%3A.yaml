simpleMeaning: Comparatively runny or light, with little material packed into a given volume, so it flows
  freely.
scope: This describes a runny liquid or a light gas, not a narrow object measured across and not a body
  with little fat.
examples:
- The sauce was still too thin, so she let it simmer a while longer.
- At that altitude the air is thin and hard to breathe.
