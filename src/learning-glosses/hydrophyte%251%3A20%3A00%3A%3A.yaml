simpleMeaning: Rooted in the mud, like a lotus, or floating free, like the water hyacinth, some plants
  live part or all of their lives in water.
scope: Also called aquatic plant, hydrophytic plant, and water plant, this is a plant that lives in water,
  not a plant of dry ground.
examples:
- The hydrophyte spread across the pond, its roots deep in the mud.
- Water hyacinths are hydrophytes that float free in the water.
