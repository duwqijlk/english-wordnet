simpleMeaning: to come together into a close group, or to bring things or people together into a close
  group
scope: 'Also called bunch, bundle and cluster: coming together or bringing things into a close group,
  not moving with a heavy, loud sound.'
examples:
- The sheep clumped together under the big tree.
- He clumped the wet leaves into piles in the yard.
