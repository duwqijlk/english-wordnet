simpleMeaning: Built of plant stuff.
scope: This sense is also called vegetal, for built of plant stuff, unlike the sense for in breeding,
  done by means that need no mate, unlike the sense for to do with bodily acts that happen beyond the
  will, and unlike the sense for of, or to do with, a deed that is still and same.
examples:
- The wall was vegetative, built of plant stuff.
- The roof was vegetative, built of plant stuff.
