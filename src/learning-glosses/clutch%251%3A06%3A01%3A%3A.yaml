simpleMeaning: The part you press with your foot, or pull by hand, to link or cut the drive between a
  spinning shaft and the power source turning it.
scope: The foot pedal or hand lever itself, also called a clutch pedal, not the internal coupling it works
  or the small strapless handbag.
examples:
- Press the clutch before you change gear.
- She released the clutch slowly so the car would not stall.
