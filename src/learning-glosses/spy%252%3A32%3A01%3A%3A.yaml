simpleMeaning: to watch someone or ask about things in secret, without being seen or known
scope: 'Also called stag: to watch or ask about things in secret, not to gather secret facts for a state
  or business and not a person who watches in secret.'
examples:
- He likes to spy on his neighbours from behind the curtain.
- She would spy on the others by listening at the door.
