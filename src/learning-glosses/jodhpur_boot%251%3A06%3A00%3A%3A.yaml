simpleMeaning: A rider wears this short shoe, which fastens at the side with a buckle
scope: A short shoe worn for riding, closed at the side with a buckle, also called a jodhpur or a jodhpur
  shoe; not a tall riding boot and not a shoe with laces.
examples:
- He wore jodhpur boots to ride in the morning.
- The jodhpur boot fastened with a buckle at the side.
