simpleMeaning: a plan built on hopes, not safe facts, that rests on things that keep changing and that
  the planner cannot control
scope: A risky plan sense, not a small ball of gas and not a round glass or plastic cover.
examples:
- The housing bubble burst and many people lost money.
- Investors feared the price bubble would break when sales fell.
