simpleMeaning: 'A widely found material, not a metal, able to join four other bits, in three forms: amorphous
  stuff, graphite, and diamond; it is in every living thing.'
scope: This is the stuff found in all organic compounds, also called carbon and atomic number 6, not the
  vitamin, not the speed of light, and not a letter.
examples:
- C is the stuff that makes up most living things.
- Diamonds are one form of C.
