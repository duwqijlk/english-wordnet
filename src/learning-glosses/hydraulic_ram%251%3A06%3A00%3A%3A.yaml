simpleMeaning: A water-lifting device that uses the moving water's own power to push a small part of that
  water up to a store at a higher level.
scope: A water-lifting device powered by the moving water itself, not an electric pump and not a windmill
  pump; hydraulic pump is another name for this sense.
examples:
- The farm's hydraulic ram lifts water from the stream to the tank on the hill.
- A hydraulic ram lifted water to the hilltop tank.
