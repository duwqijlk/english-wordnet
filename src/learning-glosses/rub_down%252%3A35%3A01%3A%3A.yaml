simpleMeaning: to work over a person's body with the hands, most often to ease pain or help them rest
scope: 'Also called knead or massage: working over a person''s body with the hands, not washing the body
  and not a medical treatment by a doctor.'
examples:
- The trainer rubbed down the runner's legs after the race.
- She rubbed down her mother's sore shoulders to help her rest.
