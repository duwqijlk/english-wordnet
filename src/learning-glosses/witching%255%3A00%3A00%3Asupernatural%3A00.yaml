simpleMeaning: having or using powers that are not part of the natural world, or like such powers, or
  made for such powers
scope: 'Also called magic, wizard, magical, charming, sorcerous and wizardly: having or using powers beyond
  the natural world. Not the noun sense that means the act of doing witchcraft.'
examples:
- The old book told of a witching spell that could make a person sleep for a hundred years.
- She gave a witching smile that seemed to hold a secret power no one could explain.
