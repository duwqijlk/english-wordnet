simpleMeaning: A far-seeing tube set on a bar that runs east and west, used to time a body in the sky
  as it crosses the mid-line of the sky
scope: A far-seeing tube set east and west to time a body in the sky crossing the mid-line of the sky,
  not a hand-held far-seeing tube and not a clock.
examples:
- The transit instrument timed the star's crossing.
- Astronomers used the transit instrument to time the moon's crossing.
