simpleMeaning: any of many kinds of reptile (an animal with dry skin that lays eggs) living in water or
  on land, with a shell of bone and flat limbs for swimming
scope: The animal with a hard shell, not a top with a high neck and not the act of hunting for this animal.
examples:
- A turtle swam slowly across the pond.
- The turtle pulled its head into its shell.
