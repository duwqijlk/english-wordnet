simpleMeaning: A part of the body's plan for life that makes healthy cells likely to turn into cells of
  a deadly growth
scope: A part of the body's plan for life that can turn healthy cells into cells of a deadly growth, not
  a healthy cell itself and not a growth that stays in one place.
examples:
- The oncogene in the sample made the cells grow out of control.
- Doctors found an oncogene that had switched on in the tumour.
