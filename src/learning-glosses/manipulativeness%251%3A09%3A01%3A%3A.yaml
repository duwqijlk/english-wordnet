simpleMeaning: The habit of getting other people to do what you want, done on purpose
scope: A habit of steering other people on purpose, not open persuasion and not a single clever trick.
examples:
- He saw through the manipulativeness of his behaviour at once.
- The manipulativeness of her plan showed in how she kept the facts back.
