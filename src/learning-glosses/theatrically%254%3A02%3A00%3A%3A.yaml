simpleMeaning: in a showy way that is not natural, with words, actions or feelings shown too strongly
  to get attention
scope: The showy, too-strong way of acting, not the plainer sense of in a way to do with the theatre.
examples:
- He waved his arms theatrically and fell to his knees.
- '''Leave this house at once!'' she cried theatrically.'
