simpleMeaning: a slow throw when the batter is waiting for a fast one
scope: A slow throw when the batter is waiting for a fast one; change-of-pace, change-up and off-speed
  pitch are other names for this sense, not a fastball and not a wild pitch.
examples:
- The change-of-pace ball drifted in slowly.
- He hit the change-of-pace ball late and weakly.
