simpleMeaning: showing or made up of rising up against those in charge and refusing their orders, or causing
  people to do this
scope: This sense describes acts, words or thoughts that show a rise against leaders or stir one up. It
  is not the sense of a person who is ready to rise up or is already doing so.
examples:
- His mutinous speech urged the sailors to refuse their captain's orders.
- The men wrote a mutinous letter saying they would no longer obey their officers.
