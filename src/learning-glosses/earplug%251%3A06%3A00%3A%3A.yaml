simpleMeaning: a small piece of cotton, wax, or rubber put into the ear to keep out water or loud sound
scope: This piece goes in the ear to keep out water or loud sound. It is not an earphone for listening
  to music, which is another sense of this word.
examples:
- She wore earplugs all day at the loud factory.
- Put in earplugs before you go swimming.
