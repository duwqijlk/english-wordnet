simpleMeaning: the quality of having many small details joined together, so the whole is not simple
scope: 'Also called elaboration, elaborateness and involution: the quality of having many fine details
  that fit together, not one hard detail on its own.'
examples:
- People admired the intricacy of the lace work.
- The intricacy of the design made it hard to copy.
