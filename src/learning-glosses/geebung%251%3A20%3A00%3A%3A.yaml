simpleMeaning: With hard narrow leaves, one of many shrubs and small trees bears long-lasting yellow or
  white flowers, followed by small fruits that can be eaten but taste of little.
scope: One of many shrubs and small trees, this has hard narrow leaves and flowers that last a long time.
examples:
- The geebung bore small fruits.
- Geebung flowers lasted a long time.
