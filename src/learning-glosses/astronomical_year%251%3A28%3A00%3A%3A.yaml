simpleMeaning: the time the earth takes to go once around the sun, counted from one spring equinox to
  the next
scope: 'Also called an equinoctial year: the time for one full trip of the earth around the sun, not a
  calendar year and not the time of one day.'
examples:
- An astronomical year runs from one spring equinox to the next.
- The astronomical year ends at the next spring equinox.
