simpleMeaning: Rod-shaped germs, some of which live on dead matter and some of which cause disease.
scope: These are rod-shaped germs, also called mycobacterium; not round germs and not one disease.
examples:
- Mycobacteria were found in the patient's sputum sample.
- Some mycobacteria cause disease in humans.
