simpleMeaning: In weather science, a line formed when cold air closes round a mass of warm air and lifts
  it.
scope: A weather line where cold air has closed round warm air and lifted it, also called occluded front;
  not the teeth sense of occlusion and not a warm or cold line.
examples:
- The occlusion brought heavy rain.
- Warm air rose along the occlusion.
