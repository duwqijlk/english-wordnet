simpleMeaning: A small insect with thin wings, whose young feed on crops and harm them
scope: This is a small thin-winged insect whose young harm crops; gelechiid is another name for this sense,
  not a butterfly and not any other small moth.
examples:
- A gelechiid moth laid eggs on the tomato plants, and its young ate the leaves.
- Farmers sprayed the field after gelechiid moth caterpillars began to eat the crop.
