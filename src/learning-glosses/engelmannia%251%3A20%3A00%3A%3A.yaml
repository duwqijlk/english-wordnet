simpleMeaning: A common hairy plant of the plains and grasslands of the south and middle of the United
  States, it stands upright, lives for years, and bears flowers much like sunflowers.
scope: This is a hairy plant of the plains and grasslands of the south and middle of the United States,
  not a sunflower itself.
examples:
- Engelmannia grew on the plains of the south and middle of the United States.
- The engelmannia stood upright among the grasses of the prairie.
