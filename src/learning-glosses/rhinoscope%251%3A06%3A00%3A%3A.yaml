simpleMeaning: a tool for doctors made of a mirror set at an angle on a rod, used to look inside the nose
  through the back of the nose
scope: A tool for looking inside the nose, not a tool for looking down the throat and not an ear tool.
examples:
- The doctor used a rhinoscope to look inside the boy's nose.
- With the rhinoscope she could see the back of his nose.
