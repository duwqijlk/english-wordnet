simpleMeaning: A person who holds that a country should keep out of the affairs of other countries.
scope: A person who backs keeping a country out of other countries' affairs, not the adjective that describes
  such ideas.
examples:
- The isolationist argued that the country should stay out of foreign wars.
- He was called an isolationist for opposing every treaty.
