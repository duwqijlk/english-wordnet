simpleMeaning: A unit of electric potential equal to one quadrillionth of a volt, or one thousandth of
  a picovolt.
scope: A unit of electric potential equal to one quadrillionth of a volt, or one thousandth of a picovolt;
  not a whole volt and not a picovolt.
examples:
- The signal measured only a few femtovolts.
- A femtovolt is far smaller than a millivolt.
