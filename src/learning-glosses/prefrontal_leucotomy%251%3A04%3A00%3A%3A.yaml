simpleMeaning: Nerve paths to and from the front part of the brain are cut through in this operation,
  often leaving a person thinking and acting in clearly changed ways
scope: Also called lobotomy, frontal lobotomy, leucotomy, leukotomy, prefrontal leukotomy, and prefrontal
  lobotomy; an operation on the front of the brain that cuts nerve paths.
examples:
- Prefrontal leucotomy cut the nerve paths to the front of her brain.
- After prefrontal leucotomy, his moods and memory changed a great deal.
