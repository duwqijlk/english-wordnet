simpleMeaning: The slow change by which food or other things go bad.
scope: Also called spoiling, this is food or other things going bad, not the act of harming a thing, and
  not how much of it has gone bad.
examples:
- Spoilage set in within days of the harvest.
- Warm weather speeds spoilage in the store.
