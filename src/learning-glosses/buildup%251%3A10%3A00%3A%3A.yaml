simpleMeaning: praise and public notice that say a person or thing is very good
scope: This is praise and good public attention for a person or thing, not the slow growth of a pile or
  amount over time.
examples:
- The new singer got a huge buildup in the newspapers before her first show.
- All the buildup for the film made everyone want to see it.
