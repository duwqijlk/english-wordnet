senseId: 'partial_derivative%1:09:00::'
synsetId: 06024402-n
simpleMeaning: In maths, how quickly a result changes when only one of its changing amounts changes, with
  all the others held still
scope: 'Also called a partial: in maths, a rate of change worked out for one changing amount at a time,
  not the change of the whole result and not a simple slope.'
examples:
- We worked out the partial derivative of the heat flow with respect to time.
- The partial derivative tells us how the pressure changes when only the temperature moves.
