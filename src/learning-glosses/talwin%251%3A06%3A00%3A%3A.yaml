simpleMeaning: A drug that takes away pain and is less likely to make people depend on it than morphine.
scope: Also called pentazocine; a pain drug less likely to cause dependence than morphine, not morphine
  itself.
examples:
- The doctor gave her Talwin for the pain.
- Talwin is less addictive than morphine.
