senseId: 'carcinomatous_myopathy%1:26:00::'
synsetId: 14102638-n
simpleMeaning: 'A condition seen in people with lung cancer: hip and thigh muscles grow weak and tire
  easily, the back aches, and antibodies attack the junctions where nerves meet muscle.'
scope: Another name for myasthenic syndrome, the condition that weakens hip and thigh muscles in lung
  cancer patients; not myasthenia gravis, a separate disease.
examples:
- The man's aching thighs and tiredness were traced to carcinomatous myopathy.
- Carcinomatous myopathy appeared in a patient already being treated for lung cancer.
