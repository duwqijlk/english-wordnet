senseId: 'contrary%1:24:02::'
synsetId: 13805633-n
simpleMeaning: 'In logic, a link between two statements: they cannot both be true, but they can both be
  false'
scope: 'This is the logic sense: a link between two statements that cannot both be true but can both be
  false, not a person who will not do what they are told.'
examples:
- '''All birds can fly'' and ''No birds can fly'' are contraries, because they cannot both be true but
  can both be false.'
- 'He explained a contrary in class: the two statements could not both be true, yet both could be false.'
