scope: A part that pushes back on the air as it moves, lifting the plane or steering it; surface, aerofoil
  and control surface are other names for this, not a propeller and not a jet engine.
examples:
- The airfoil on the wing gave the plane lift.
- A damaged airfoil can make a plane hard to steer.
