simpleMeaning: A road split down the middle by a barrier that keeps traffic going in different ways apart.
scope: A road split down the middle by a barrier that keeps traffic going in different ways apart; divided
  highway is another name for this sense, not a road with no middle barrier and not a one-way street.
examples:
- The dual carriageway runs from London to the coast.
- We joined the dual carriageway at the next junction.
