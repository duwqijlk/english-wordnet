simpleMeaning: in geometry, a flat rectangle with four sides of equal length and four right angles, that
  is, a regular four-sided polygon
scope: This is the geometric figure with four equal sides and four right angles, not the result of multiplying
  a number by itself, not an open public area, not a tool for checking right angles, and not a person
  with old-fashioned views.
examples:
- Each side of the square is ten centimetres long.
- The children cut a square from the paper.
