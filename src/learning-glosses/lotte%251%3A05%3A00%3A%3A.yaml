simpleMeaning: To draw in prey, this fish holds out a thin thread like a worm from its wide mouth.
scope: Also called anglerfish, angler, monkfish, allmouth, angler fish, and goosefish, this fish draws
  in prey with a thin thread like a worm held out from its wide mouth.
examples:
- A lotte drew in prey with a thin thread like a worm.
- Prey came near the lotte's wormlike thread.
