simpleMeaning: a thing for making music, usually with six strings, played by moving fingers across the
  strings or by picking at them one by one
scope: A music thing held in the hands and played with the fingers, usually with six strings; not a violin
  played with a bow and not a piano.
examples:
- He sat on the steps and played his guitar for his friends.
- She is learning to play the guitar and can now play three songs.
