simpleMeaning: a musician who changes a piece of music so it can be sung or played by different voices
  or instruments, or in a different style
scope: 'Also called arranger: a person who changes music for different voices, instruments, or styles,
  not a device that joins two pieces of equipment.'
examples:
- The adapter changed the song so a children's choir could sing it.
- As an adapter, he wrote the piano piece for a full orchestra.
