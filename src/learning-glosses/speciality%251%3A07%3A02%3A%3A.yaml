simpleMeaning: a thing or quality a person has that is worth a lot and of great use to them
scope: 'This sense is also called specialty: a thing or quality a person has that is worth a lot, not
  the line of work a person chooses as a career.'
examples:
- His sense of humour is a speciality that makes him valuable to the team.
- A good memory is a speciality she brings to the job, and it helps everyone.
