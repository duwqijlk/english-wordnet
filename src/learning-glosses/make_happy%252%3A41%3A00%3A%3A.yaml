simpleMeaning: To have a loud, wild party, often with much drink, and to join in noisy fun with others.
scope: To have a loud, wild party, often with drink, also called racket, revel, jollify, make merry, make
  whoopee, wassail, and whoop it up; not a quiet dinner and not a sad gathering.
examples:
- The wedding guests made happy all night long.
- Let's make happy — the exams are over!
