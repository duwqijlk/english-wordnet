simpleMeaning: made to have little patience or to feel angry
scope: 'Also called annoyed, irritated, stung, pissed, steamed, roiled, miffed, peeved, and nettled: made
  to have little patience or to feel angry, not just sad or tired.'
examples:
- He was riled by the constant delays at the airport.
- She got riled when her brother kept teasing her.
