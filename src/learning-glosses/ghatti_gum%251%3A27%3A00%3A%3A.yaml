simpleMeaning: A sticky sap from India that comes from the dhawa tree and is used in place of arabic sap
scope: This is a sticky sap from India that comes from the dhawa tree and is used in place of arabic sap;
  ghatti is another name for this sense, not arabic sap itself and not any other tree sap.
examples:
- Ghatti gum thickens the ink nicely.
- The cook used ghatti gum where the recipe called for gum arabic.
