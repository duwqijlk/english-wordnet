simpleMeaning: Any of several illnesses of the mind that twist a person's sense of what is real, upset
  thought and speech, and make them pull away from other people.
scope: An illness of the mind that twists a person's sense of what is real, also called schizophrenia,
  dementia praecox, and schizophrenic disorder; not bipolar disorder, with great mood swings, and not
  plain low mood.
examples:
- Schizophrenic psychosis needs care from doctors.
- Schizophrenic psychosis can make a person pull away from friends.
