simpleMeaning: to give a person or group vehicles with motors to use
scope: To give people vehicles with motors to use, not to put a motor in a thing, and not to give them
  armed vehicles for war.
examples:
- The police force was motorized last year and now patrols by car instead of on horseback.
- The delivery company motorized its workers, giving each driver a van.
