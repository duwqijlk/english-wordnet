simpleMeaning: putting up with wrongs or trouble, calmly and without complaint, over a long time
scope: Putting up with wrongs or trouble, calmly and without complaint; not a pain that lasts and not
  a person who never gives up.
examples:
- She showed an enduring disposition through years of hardship.
- His enduring patience wore down his critics.
