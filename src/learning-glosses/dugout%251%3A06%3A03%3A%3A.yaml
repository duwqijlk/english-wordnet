simpleMeaning: 'An earth shelter for people or kept animals: sunk completely under a flat roof covered
  with soil, partly sunken under a wood or sod roof, or built into a hillside.'
scope: The earth-set shelter for people or kept animals, one of several names for this dwelling; it is
  not a hollowed-log boat, a baseball bench area, or a low earth fortification, and this spelling has
  no hyphen.
examples:
- The farmer stored grain in an old dugout beside the barn.
- The family waited out the blizzard in a dugout roofed with sod.
