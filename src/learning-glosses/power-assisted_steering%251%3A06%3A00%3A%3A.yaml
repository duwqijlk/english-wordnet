simpleMeaning: A driver turns the wheel with less strength because a motor in the car adds force to the
  turn.
scope: Also called power steering, this is the help a motor in a car gives the driver in turning the wheel.
examples:
- With power-assisted steering, the driver turns the wheel with less effort.
- Without power-assisted steering, turning the wheel takes much more strength.
