simpleMeaning: In this set of steps, time moves in separate points, and the number that changes can take
  a new value only at those points.
scope: Also called Markoff chain, this is a set of steps in which the number that changes takes only separate
  points in time, not one in which it can change at any time.
examples:
- A Markov chain moves from one state to the next in separate steps.
- The Markov chain changes only at set points in time.
