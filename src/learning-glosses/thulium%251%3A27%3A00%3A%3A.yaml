simpleMeaning: A soft silver-coloured metal of the rare earth group, found in monazite, apatite, and xenotime;
  isotope 170 gives off X-rays and is used in small portable X-ray machines.
scope: Also called Tm and atomic number 69; a soft silver-coloured metal of the rare earth group, not
  a hard steel and not a metal used only in coins.
examples:
- Thulium is one of the rare earth metals.
- The small machine uses thulium to make X-rays.
