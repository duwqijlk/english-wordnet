simpleMeaning: In geology, the way layers like leaves are laid out in a rock
scope: In geology, the way layers lie in rock, not the making of metal foil and not a leaf-shaped decoration
  on a building.
examples:
- The foliation in the rock showed thin, flat layers of minerals.
- The geologist studied the foliation to see how the rock had been squeezed.
