simpleMeaning: 'A throw that bends in the air: sent with a spin, it turns aside as it nears the hitter.'
scope: Curve, bender and breaking ball are other names for this spinning throw.
examples:
- The pitcher threw a curve ball that bent away from the hitter.
- He struck out swinging at a curve ball.
