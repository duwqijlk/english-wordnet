simpleMeaning: An uncomfortable top made of coarse animal fur, worn next to the skin as a self-punishment.
scope: An uncomfortable top made of coarse animal fur, worn next to the skin as a self-punishment; not
  a foam used to style the strands on a person's head and not a flat wire pin used to hold short straight
  strands in place.
examples:
- The monk wore a hair shirt next to his skin as a penance.
- A hair shirt of coarse animal fur made his skin itch.
