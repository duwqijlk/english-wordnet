senseId: 'balk%1:09:00::'
synsetId: 05697054-n
simpleMeaning: something you cannot see or touch that gets in the way of work, so it moves more slowly
  or comes to a stop
scope: 'Also called check: a thing you cannot touch that holds back action or progress, not an illegal
  pitch in baseball and not a beam that holds up a roof.'
examples:
- Lack of money proved a balk to the whole project.
- The balk in their talks was a row over money.
