simpleMeaning: a hormone (a body chemical) made in the outer part of the gland above the kidney, sold
  as Hydrocortone or Cortef, that helps the body use sugars, starches and proteins
scope: Also called hydrocortisone. This is the body chemical itself, sold under the names Hydrocortone
  and Cortef, not a different chemical from the same gland.
examples:
- Cortisol helps the body use sugars and proteins for energy.
- A test showed how much cortisol was in his blood.
