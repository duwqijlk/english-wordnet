simpleMeaning: Stems that run under the ground spread this woody plant of Europe, which has pink flowers,
  leaves of one part each, and long tough roots.
scope: This is a woody plant of Europe with pink flowers, also called restharrow, not the Eurasian plant
  with loose bunches of pink or purple flowers and spiny stems.
examples:
- Rest-harrow spreads by stems that run under the ground.
- The rest-harrow in the field had pink flowers and long tough roots.
