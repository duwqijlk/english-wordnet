senseId: 'death_benefit%1:21:00::'
synsetId: 13318277-n
simpleMeaning: money from life cover or a pension paid to a person named by someone who is no longer alive
scope: This is money paid to a person named by the holder of a life policy or pension after that holder
  is gone, not pay given while the holder is alive and not money left in a will.
examples:
- His widow received a death benefit from his pension.
- The death benefit helped the family pay the bills.
