simpleMeaning: Washing into or around a body part, especially the vagina, with a jet of water or liquid
  with medicine in it, to treat infections or clean away bad-smelling matter
scope: This sense is the washing itself, not the small hand tool used to do it and not the verb for spraying
  water into the body.
examples:
- The doctor advised a douche to help treat the infection.
- She used a warm water douche to clean the area.
