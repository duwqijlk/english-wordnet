simpleMeaning: to let tears fall from the eyes when sad, very angry, or hurt
scope: To let tears fall when sad, very angry, or hurt, also called cry, not just to make a loud sad sound
  and not just to let water fall from the eyes.
examples:
- She weeps when she hears sad news.
- The boy weeps with pain after he falls and cuts his knee.
