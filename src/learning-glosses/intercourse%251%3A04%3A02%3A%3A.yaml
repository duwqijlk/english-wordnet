simpleMeaning: sex between people, especially when a man's penis goes into a woman's vagina until the
  strongest sexual feeling comes and fluid leaves his penis
scope: Also called relation, coitus, carnal knowledge, coition, copulation, sex act, sexual congress,
  sexual intercourse and sexual relation. This is sex between people, not talk or other contact between
  people or groups.
examples:
- They had sexual intercourse for the first time that night.
- The doctor asked when she last had intercourse with her partner.
