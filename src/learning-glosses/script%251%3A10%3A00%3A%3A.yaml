simpleMeaning: the written words of a play or other show, used to get ready for a performance
scope: 'Also called book: the written words of a play or show used by the people who perform it; not a
  style of handwriting, and not the act of writing such a text.'
examples:
- The actors learned their lines from the script before the play.
- She kept a copy of the script on the table during practice.
