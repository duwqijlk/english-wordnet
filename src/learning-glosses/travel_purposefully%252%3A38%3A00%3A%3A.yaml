simpleMeaning: To go somewhere by choice, in one set direction and with a clear aim
scope: To go somewhere by choice, in one set direction and with a clear aim, not to wander with no aim
  and not to be carried along.
examples:
- The birds travel purposefully south each autumn.
- He travelled purposefully towards the town, bent on reaching it by nightfall.
