simpleMeaning: A European plant that lives for one year, with big trumpet-shaped red-purple flowers and
  poisonous seeds; a common weed of grain fields and roadsides, now growing wild in America.
scope: Another name for corn campion and crown-of-the-field; this is the poisonous cornfield weed, not
  the blue cornflower.
examples:
- Corn cockle used to brighten the edges of oat fields with its deep pink flowers.
- Gardeners are warned that corn cockle seed is toxic if eaten.
