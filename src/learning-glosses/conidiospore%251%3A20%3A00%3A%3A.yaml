simpleMeaning: a tiny seed-like cell of a fungus, made without sex, that grows on a small stalk
scope: This is a tiny seed-like cell a fungus makes without sex; conidium is another name for this sense,
  and it is not a plant seed and not a cell made after mating.
examples:
- The conidiospore drifted through the air to a damp log.
- Each conidiospore can grow into a new fungus.
