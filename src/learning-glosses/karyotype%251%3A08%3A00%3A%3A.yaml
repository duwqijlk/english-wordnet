simpleMeaning: How the chromosomes of a body cell look in a person or a species, in number, order, size
  and build
scope: This is how a body cell's chromosomes look in number, order, size and build, not the chromosomes
  themselves and not a test of one gene.
examples:
- A karyotype shows the chromosomes of a body cell.
- Doctors studied the karyotype of the patient.
