senseId: 'i/o_device%1:06:01::'
synsetId: 92461040-n
simpleMeaning: Data sent out, data sent in, or other data that has been worked on can all go into this
  machine.
scope: 'Also called input/output device and IO device: a machine that takes in data of any kind, not a
  machine that only shows data on a screen.'
examples:
- The printer is an I/O device that sends data out of the computer.
- A keyboard is an I/O device because it sends data into the computer.
