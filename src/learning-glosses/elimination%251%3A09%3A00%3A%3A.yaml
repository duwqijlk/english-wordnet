synsetId: 05790242-n
simpleMeaning: Looking at a problem by listing the different ways it could be, then crossing out each
  way that does not work, one by one.
scope: A way of working on a problem by ruling out each bad choice; not the math sense, where number statements
  that must be true are joined to take out an unknown amount.
examples:
- By a process of elimination, she worked out which key opened the door.
- We used elimination to find the right answer, crossing out the wrong ones one by one.
