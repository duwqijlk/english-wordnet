senseId: practical%5:00:01:realistic:00
synsetId: 01947268-s
simpleMeaning: led by what you have learned from seeing and doing things in real life, not by ideas about
  how things work
scope: About a person or a way of thinking that is led by real experience; it is not about a thing having
  a real use, and not just about doing things.
examples:
- She took a practical view of the plan, based on what she had seen work before.
- He is practical in business and trusts what he has learned from doing the job.
