simpleMeaning: A long-dead fish-like animal with a backbone and no jaw and a hard outer covering, from
  the very old age of the earth
scope: A long-dead fish-like animal with a backbone and no jaw and a hard outer covering, from the very
  old age of the earth, not a living fish and not a hard-covered sea animal of today.
examples:
- The ostracoderm swam in seas of the very old age of the earth.
- Fossils of the ostracoderm show a hard outer covering and no jaw.
