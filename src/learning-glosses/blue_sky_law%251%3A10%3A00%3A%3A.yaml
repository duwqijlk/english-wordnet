simpleMeaning: A set of rules from one state for selling shares, to stop shares being sold in firms built
  on fraud.
scope: A set of rules from one state for selling shares, to stop shares being sold in firms built on fraud,
  not a rule of the whole country and not a rule about shares in honest firms.
examples:
- The blue sky law stops fraud in share sales.
- Under the blue sky law, the firm had to show its books.
