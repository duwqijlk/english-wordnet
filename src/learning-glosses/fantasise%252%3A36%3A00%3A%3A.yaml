simpleMeaning: to spend time thinking about things you imagine, things that are not real
scope: This sense is also called fantasy and another name for it is fantasize; it is about thinking of
  imagined things, not about making them real.
examples:
- She often fantasises about living by the sea.
- He fantasised that he could fly to the moon.
