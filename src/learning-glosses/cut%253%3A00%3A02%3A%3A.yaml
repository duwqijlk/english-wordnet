simpleMeaning: (of the pages of a book) having the folded edges of the paper sheets trimmed or slit open
scope: This describes a book's page edges, not a shortened text or a swing at a pitched ball.
examples:
- The rare volume is bound with cut pages, so every fold has been opened.
- This edition has cut edges and can be read without a paper knife.
