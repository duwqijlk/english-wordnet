simpleMeaning: a flower from Europe with a long tube at the back that sticks out more than most
scope: A flower from Europe with a long tube at the back that sticks out more than most; horned violet
  is another name for this sense. Not a common garden pansy and not a wild violet with a short spur.
examples:
- The tufted pansy has a long tube at the back of each flower.
- The tufted pansy in the border had a longer tube at the back than the other pansies.
