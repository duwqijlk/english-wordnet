simpleMeaning: the thick slippery liquid given off by the skin that lines joints and tendon covers and
  the like, so the parts slide easily
scope: Another name for synovia; not blood and not the joint itself.
examples:
- Synovial fluid lets the bones in the knee slide past each other.
- A lack of synovial fluid makes the joint stiff.
