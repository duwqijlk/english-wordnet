simpleMeaning: A piece of land with set edges, marked out so it can be run as one part of a country or
  for some other purpose.
scope: A piece of land marked out for running or for another purpose, also called district, not the whole
  land of a country and not one person's land.
examples:
- The territory was marked off for the new council to run.
- Each territory had its own office and rules.
