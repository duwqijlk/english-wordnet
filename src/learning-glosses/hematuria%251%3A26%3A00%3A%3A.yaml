simpleMeaning: It often means something is wrong in the tubes that carry the water out of the body when
  blood shows up in that water
scope: Blood in the water the body passes, also called haematuria, often a sign of trouble in the tubes
  that carry it out, not blood in the stool and not a wound.
examples:
- Hematuria can be a sign of a kidney problem.
- The test found hematuria after the infection.
