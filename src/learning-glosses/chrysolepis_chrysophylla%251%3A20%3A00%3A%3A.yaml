simpleMeaning: A small showy green-all-year tree of the Pacific Coast, with shiny yellow-green leaves
  that are yellow below; it bears nuts that can be eaten.
scope: Also called giant chinkapin, golden chinkapin, Castanea chrysophylla and Castanopsis chrysophylla,
  this is a small showy tree of the Pacific Coast, not the tall oak of the same coast.
examples:
- The Chrysolepis chrysophylla keeps its leaves all winter.
- We gathered nuts from the Chrysolepis chrysophylla.
