senseId: 'freshet%1:11:00::'
synsetId: 07421737-n
simpleMeaning: Water that flows all at once after sudden rain or after snow melts
scope: A sudden rush of water after rain or melting snow; spate is another name for this sense, not a
  lasting flood and not a spring of water from the ground.
examples:
- A freshet swept down the valley after the storm.
- The freshet raised the stream to the top of its banks.
