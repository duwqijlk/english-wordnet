simpleMeaning: A tool that measures how much water has fallen from the sky, in which a piece on top of
  the gathered water shows how high it has risen.
scope: A tool that measures fallen water with a piece that stays on top of it, also called a float-type
  rain gauge; not a plain cup that catches water and not a tool that measures wind.
examples:
- The float-type rain gage showed two inches after the storm.
- He checked the float-type rain gage each morning.
