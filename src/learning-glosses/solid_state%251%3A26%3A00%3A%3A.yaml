simpleMeaning: A thing in this form holds its own size and shape, will not flow under a fair push, and
  stands up to being squeezed.
scope: Also called solid and solidness, it is the form of a thing that holds its size and shape, not a
  liquid and not a gas.
examples:
- In the solid state, a thing keeps its size and shape.
- A solid state holds its shape when pushed.
