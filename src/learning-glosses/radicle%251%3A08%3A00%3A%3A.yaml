simpleMeaning: In the body, a small part that looks like a tiny root, such as a thin thread of a nerve
scope: In the body, a small root-like part, such as a nerve thread; not a real plant root and not a whole
  nerve.
examples:
- The radicle of the nerve was hard to see.
- A radicle joins the nerve to the rest of the body.
