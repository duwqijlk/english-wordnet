simpleMeaning: Any of the tiny soft pieces found in the joins between the hard parts of the skull.
scope: This is one of the tiny soft pieces in the joins between the hard parts of the skull, also called
  a sutural bone, not one of the large hard parts of the skull.
examples:
- A Wormian bone lay in the suture of the skull.
- Wormian bones are tiny extra bones of the skull.
