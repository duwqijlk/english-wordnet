simpleMeaning: A clover from Ireland with pale gold flowers, often thought to be the true or original
  shamrock
scope: Shamrock and hop clover are other names for this Irish clover with pale gold flowers; it is not
  the white clover and not the red clover.
examples:
- Lesser yellow trefoil grows wild in the meadow.
- The lesser yellow trefoil has small pale flowers.
