simpleMeaning: A person who sticks printed notices and small signs up on walls and on boards meant for
  them
scope: A person who sticks up notices, not a horse kept for hire and not a printed sign put up to tell
  people about a thing.
examples:
- The poster put up notices for the play all over town.
- A poster was paid to stick the new bills on the wall.
