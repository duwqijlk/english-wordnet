simpleMeaning: When a sour liquid breaks apart, one tiny bit of the lightest stuff in it takes on a plus
  charge.
scope: Also called acidic hydrogen, this names the tiny bit of the lightest stuff in a sour liquid that
  takes on a plus charge when the liquid breaks apart.
examples:
- In the lab, acid hydrogen formed ions as the sour liquid split apart.
- The book said acid hydrogen carries a charge after the liquid breaks up.
