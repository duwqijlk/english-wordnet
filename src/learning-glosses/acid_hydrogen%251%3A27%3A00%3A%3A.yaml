simpleMeaning: A hydrogen atom in an acid that forms a positive ion when the acid breaks apart.
scope: Also called acidic hydrogen; a hydrogen atom in an acid, forming a positive ion as the acid breaks
  apart.
examples:
- In the lab, acid hydrogen formed ions as the sour liquid split apart.
- The book said acid hydrogen carries a charge after the liquid breaks up.
