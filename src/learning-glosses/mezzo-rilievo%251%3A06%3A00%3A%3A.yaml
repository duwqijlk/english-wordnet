simpleMeaning: Between the lowest and the highest kinds of carving, this one stands out from its flat
  ground by a middling amount
scope: 'Another name for half-relief and mezzo-relievo: a carving that stands out by a middling amount,
  not a nearly flat carving and not one that stands out far.'
examples:
- The mezzo-rilievo on the church door showed saints in half depth.
- A mezzo-rilievo keeps its figures half tied to the flat ground behind them.
