simpleMeaning: The lasting state of being often intoxicated, caused by ongoing heavy drinking that harms
  health and creates dependence, with severe symptoms when drinking stops.
scope: This is the lasting condition of habitual intoxication, not the temporary state after one drinking
  session or the act of drinking too much.
examples:
- Years of drunkenness had destroyed his health, and he shook badly whenever he tried to stop.
- His drunkenness had become a way of life that he could not break.
