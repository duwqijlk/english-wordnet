simpleMeaning: A South American palm bears a seed shaped like a nut, whose hard white coat rubs to a bright
  shine and is cut into buttons and other things.
scope: 'Also called an apple nut and an ivory nut: a South American palm bears a seed shaped like a nut,
  whose hard white coat rubs to a bright shine and is cut into buttons and other things.'
examples:
- Vegetable ivory buttons shone white on the coat.
- The hard shell of vegetable ivory takes a high polish.
