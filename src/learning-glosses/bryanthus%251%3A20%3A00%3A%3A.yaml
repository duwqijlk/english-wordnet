simpleMeaning: This low shrub of Europe, Asia and Africa bears pinkish-white flowers in bunches, grows
  flat along the ground, forms a mat and keeps its leaves all year.
scope: This is a low shrub of Europe, Asia and Africa that grows flat along the ground, forms a mat and
  keeps its leaves all year; other low shrubs that grow flat along the ground are its nearest rivals.
