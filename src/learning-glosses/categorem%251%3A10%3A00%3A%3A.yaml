simpleMeaning: a word or phrase in logic that can stand on its own as the thing talked about or what is
  said of it
scope: A logic term, also called categoreme; not a word that only works with others and not a whole sentence.
examples:
- The word 'dog' is a categorem in that sentence.
- A categorem can stand alone as the subject of a claim.
