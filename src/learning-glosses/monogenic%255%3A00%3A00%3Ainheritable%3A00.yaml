simpleMeaning: A single pair of genes sets a trait that is passed down from parents
scope: A single pair of genes sets a trait passed down from parents, not a trait set by many genes and
  not a trait picked up in life.
examples:
- Cystic fibrosis is a monogenic condition, passed down through one pair of genes.
- The scientist studied a monogenic trait in the mice to see how it was passed on.
