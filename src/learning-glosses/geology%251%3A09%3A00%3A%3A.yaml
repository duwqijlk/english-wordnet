simpleMeaning: the study of the earth and how it has changed over time, as shown by rocks
scope: This is the study of the earth and its past as shown in rocks, not the study of living things and
  not the study of the weather.
examples:
- She chose to study geology because she wanted to learn how mountains were made.
- Geology can show how this land was once under the sea.
