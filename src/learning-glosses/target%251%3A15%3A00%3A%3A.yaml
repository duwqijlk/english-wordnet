simpleMeaning: the spot that a shot, missile, or throw is aimed at and meant to hit.
scope: This is not the person being attacked and not the thing being aimed with; it is the place or point
  that is meant to be hit.
examples:
- The missile missed its target and fell into the sea.
- The instructor marked the target on the map.
