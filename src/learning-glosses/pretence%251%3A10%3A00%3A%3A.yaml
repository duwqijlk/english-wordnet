simpleMeaning: Acting as if something were true, in order to trick others.
scope: This is acting as if something were true in order to deceive; pretense is another name for this
  sense, not a false show made to seem real or an honest mistake.
examples:
- He kept up the pretence that he had paid, but the money was never sent.
- Her pretence of illness got her out of the meeting.
