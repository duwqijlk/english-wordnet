simpleMeaning: a Mediterranean evergreen that keeps its leaves through the year and bears pods that can
  be eaten, the one named in the Bible
scope: This tree, also called carob bean tree, carob and algarroba; not the powder made from its pods.
examples:
- The carob tree stood by the old stone wall.
- A carob tree drops its pods in late summer.
