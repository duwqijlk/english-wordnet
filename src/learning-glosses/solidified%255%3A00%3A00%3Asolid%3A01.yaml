simpleMeaning: changed into one hard piece that holds its shape and does not flow
scope: This describes a thing that has changed into one hard piece that holds its shape; it is not a liquid
  or a gas that still flows.
examples:
- The solidified lava formed a thick black layer.
- He cut a piece from the solidified fat in the pan.
