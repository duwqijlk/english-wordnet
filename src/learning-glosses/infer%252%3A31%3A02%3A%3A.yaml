simpleMeaning: to give the right answer by forming an idea without being sure, or to work out an answer
  in that way
scope: 'Also called guess: this is getting an answer right without being sure, not working out a truth
  step by step from facts and not reaching a view in logic.'
examples:
- She inferred the number of beans in the jar and won the prize.
- He inferred my age correctly from a lucky guess.
