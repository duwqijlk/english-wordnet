simpleMeaning: This word is about people with wide noses, and about monkeys from the Americas whose nose
  holes lie far apart
scope: Also called broadnosed, platyrhine, platyrhinian, platyrrhine and platyrrhinic, this word is about
  such monkeys or people, not the monkeys themselves.
examples:
- Platyrrhinian monkeys swing through the trees of the New World.
- The platyrrhinian woman had a wide nose with holes far apart.
