simpleMeaning: Hit a part of your own body again and again, as when overwhelmed by feeling or keeping
  time to music.
scope: This is striking your own body, not signalling with taps, driving game from cover, or hitting someone
  else.
examples:
- She beat her chest in grief at the funeral.
- The drummer beat his thighs in time with the song.
