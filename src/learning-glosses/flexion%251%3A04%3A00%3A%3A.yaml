senseId: 'flexion%1:04:00::'
synsetId: 00406181-n
simpleMeaning: The act of bending a joint, above all a joint between the bones of a limb, so that the
  angle between them gets smaller.
scope: The act of bending a joint, above all a joint between the bones of a limb, so that the angle between
  them gets smaller; flexure is another name for this sense, not the act of straightening a joint, and
  not a twist of a joint.
examples:
- Flexion of the knee brings the lower leg back.
- The nurse measured flexion in his elbow.
