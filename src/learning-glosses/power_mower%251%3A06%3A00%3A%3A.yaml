simpleMeaning: a machine for cutting grass, with a motor that runs on gasoline
scope: Also called a motor mower, it is a machine for cutting grass with a motor that runs on gasoline,
  not a machine for cutting grass with no motor.
examples:
- He started the power mower and cut the grass in the front yard.
- The power mower ran out of gas before he finished the back yard.
