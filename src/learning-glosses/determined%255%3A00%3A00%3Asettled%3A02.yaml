simpleMeaning: decided and fixed, as by a person or group in charge
scope: About a time, place, or plan already fixed by a person in charge; not about a strong-willed person
  and not about a fact found out by study.
examples:
- The determined date for the meeting is next Monday.
- Workers must arrive at the determined time set by the boss.
