simpleMeaning: In the Roman Catholic Church, a sung verse (an antiphon), usually from the Book of Psalms,
  sung at Mass after the epistle (a reading from letters in the Bible)
scope: This is a sung verse used at Mass in the Roman Catholic Church. It is not a slope of land that
  is not steep.
examples:
- The choir sang the gradual after the reading.
- The gradual in this Mass comes from the Book of Psalms.
