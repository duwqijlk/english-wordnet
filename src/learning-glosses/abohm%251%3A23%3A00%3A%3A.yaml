senseId: 'abohm%1:23:00::'
synsetId: 13668312-n
simpleMeaning: a tiny unit used to measure how much a thing resists the flow of electricity, equal to
  one thousand-millionth of the usual unit of resistance
scope: A very small unit of electrical resistance; not a large unit and not a measure of current.
examples:
- The abohm is far too small a unit for most everyday circuits.
- Resistance that low is counted in abohms, not in larger units.
