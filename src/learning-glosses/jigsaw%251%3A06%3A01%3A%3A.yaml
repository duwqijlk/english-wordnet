simpleMeaning: a power saw you can carry, its blade moving up and down; different blades fit different
  jobs and cuts; generally, a plate slides on the surface being cut
scope: Also called a reciprocating saw and a saber saw. This power saw is not the similar power saw with
  a thin blade made for cutting curved lines.
examples:
- He used a jigsaw to cut a hole in the board for the sink.
- She changed the blade on the jigsaw before cutting the metal sheet.
