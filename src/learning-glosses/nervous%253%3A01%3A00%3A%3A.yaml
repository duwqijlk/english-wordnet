simpleMeaning: relating to the body's network of nerve cells and the signals they carry
scope: About the body's nerve network, not a feeling of worry, not being easily excited, and not the sense
  of being highly strung; neural is another name for this sense.
examples:
- The doctor treated a nervous disorder that affected her balance.
- Nervous tissue carries signals between the brain and the rest of the body.
