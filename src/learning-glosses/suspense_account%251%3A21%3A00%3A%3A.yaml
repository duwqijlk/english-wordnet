simpleMeaning: unsure money in and out, or sums that do not match, are held in a book-keeping record for
  a short time until checked and put in their lasting place
scope: This record is not a lasting account; it holds unsure sums only until they are checked.
examples:
- The unclear sum sat in a suspense account until it was checked.
- She put the unclear sum in a suspense account.
