senseId: 'zurvanism%1:09:00::'
synsetId: 06261683-n
simpleMeaning: A teaching held to be false by the main Zoroastrian faith, saying Zurvan was the first
  source of all things and that both Ahura Mazda and Ahriman were his children.
scope: A teaching about Zurvan as the first source of all things, held to be false by the main Zoroastrian
  faith; its nearest rival is the other sense of the word, a Zoroastrian sect with the same claim about
  Zurvan.
examples:
- Zurvanism taught that Zurvan was the source of all things.
- The old text sets out Zurvanism as a teaching the main faith held to be false.
