senseId: 'photosensitize%2:39:00::'
synsetId: 02119213-v
simpleMeaning: To make a living thing or a substance quick to feel rays of energy, most of all light
scope: 'Also called photosensitise: this is making a living thing or a substance quick to feel light and
  other rays, not taking a picture of it and not making it give off light.'
examples:
- The lab photosensitized the film so that even weak light would change it.
- The dye photosensitizes the skin, so sunlight burns it more easily.
