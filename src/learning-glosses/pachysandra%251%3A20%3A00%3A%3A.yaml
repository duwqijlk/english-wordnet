simpleMeaning: a low plant with green toothed leaves all year that stays close to the ground and is used
  to cover bare earth
scope: A low plant with green toothed leaves all year that stays close to the ground and is used to cover
  bare earth; not a tall shrub and not a plant that loses its leaves in winter.
examples:
- Pachysandra covers the bare earth under the trees.
- She planted pachysandra as ground cover in the shade.
