simpleMeaning: A man, often a powerful or important one, who stirs the feelings usually felt for one's
  real dad and with whom one feels a close inward likeness.
scope: A man, often a powerful or important one, who stirs the feelings usually felt for one's real dad
  and with whom one feels a close inward likeness; not a kind teacher and not a hero one admires from
  afar.
examples:
- The old teacher became a father-figure to the boy.
- He saw his father-figure in the head of the firm.
