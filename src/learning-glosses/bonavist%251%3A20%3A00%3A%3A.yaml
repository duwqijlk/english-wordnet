simpleMeaning: A long-lived climbing vine of the Old World tropics with purple flowers and edible seeds
  in red pods, grown across South Asia as food and ornament, sometimes classed in Dolichos.
scope: This is the whole climbing plant, grown for its pods or as a garden subject, not the seeds or pods
  by themselves and not another legume.
examples:
- The bonavist vine covered the fence with purple flowers by midsummer.
- Farmers in southern India grow bonavist for its edible seeds.
