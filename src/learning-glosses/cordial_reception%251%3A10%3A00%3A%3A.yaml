simpleMeaning: a warm, kind welcome given to guests or strangers
scope: A kind welcome for guests or strangers; hospitality is another name for this sense. Not a cold
  or unfriendly greeting.
examples:
- We got a cordial reception at the hotel when we arrived.
- The host gave the visitors a cordial reception and showed them to their rooms.
