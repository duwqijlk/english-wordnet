simpleMeaning: Round, dense bunches of big red blooms that stand out top a low, spreading bush with thin
  leaves.
scope: It is the low, spreading bush with thin leaves, not the tall kind of eastern Australia whose leaves
  widen toward the tip.
examples:
- The waratah spread low, its big red blooms standing out among the thin leaves.
- The waratah bore round, dense bunches of big red blooms.
