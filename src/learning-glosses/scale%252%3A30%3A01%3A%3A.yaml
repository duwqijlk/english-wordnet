simpleMeaning: To change or set the size of something in proportion to a chosen standard.
scope: This is resizing a model or drawing to a fixed ratio, not weighing something on a machine and not
  cleaning a fish.
examples:
- The architect scaled the model down so it would fit on the table.
- Engineers scaled the prototype up before building the real machine.
