senseId: 'decibel%1:23:00::'
synsetId: 13735738-n
simpleMeaning: a unit for how strong a sound is, equal to 10 times the logarithm (a special number found
  from comparing amounts) of its strength against a set level
scope: This is a unit for measuring how strong a sound is, not the sound itself and not a unit for other
  kinds of strength or size.
examples:
- The noise from the plane reached 90 decibels.
- A whisper is about 30 decibels.
