simpleMeaning: in a rude way that shows no respect for other people
scope: This means speaking or acting with no respect, not speaking in a polite way and not speaking in
  a shy or quiet way.
examples:
- He answered insolently when the teacher asked him a question.
- She insolently told her boss to be quiet.
