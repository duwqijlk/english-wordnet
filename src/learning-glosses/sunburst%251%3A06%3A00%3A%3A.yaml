simpleMeaning: a pin with jewels on it, worn on clothes, with a pattern that looks like the sun
scope: This is a piece of jewellery worn on clothes; it is not the pattern sense on its own, with a round
  centre and lines coming out of it, and not the sun suddenly coming out from behind clouds.
examples:
- She wore a gold sunburst on her coat at the party.
- The sunburst on her dress was made of small red stones.
