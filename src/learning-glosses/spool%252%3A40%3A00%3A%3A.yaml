simpleMeaning: to move data meant for a device outside the main computer, usually a printer, and keep
  it for a short time before it is used
scope: This is about moving computer data into short-time keeping, not the round tool that thread is wound
  on and not winding thread onto it.
examples:
- The computer spooled the document before sending it to the printer.
- Please spool the print jobs so the printer can work through them slowly.
