simpleMeaning: to fill a person with fear and worry at something bad, so that they are taken by surprise
scope: 'Also called alarm, appall, dismay and horrify: to fill someone with fear and worry, not merely
  to startle them and not to make them feel sad.'
examples:
- The news of the executions appalled us.
- The sight of the ruined town appalled the visitors.
