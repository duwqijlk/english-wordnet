simpleMeaning: With hip bones set like a bird's, this plant-eating animal of long ago eats only plants
scope: A plant-eating animal of long ago with hip bones set like a bird's, also called an ornithischian;
  not a meat-eating animal of long ago and not one with a lizard-like pelvis.
examples:
- The ornithischian dinosaur had a beak for cropping plants.
- An ornithischian dinosaur roamed the fern-covered plains.
