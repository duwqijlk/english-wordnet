simpleMeaning: 'In psychoanalysis, the way a person''s character and sexual behaviour grow up through
  five stages: mouth, bottom, genitals, a quiet time, and then adult sex'
scope: In psychoanalysis, the growth of character and sexual behaviour through set stages, not the growth
  of the body alone and not one single stage.
examples:
- In Freud's account, psychosexual development moves through oral, anal, phallic, latency, and genital
  stages.
- Her psychosexual development reached the genital stage in her teens.
