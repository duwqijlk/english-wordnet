simpleMeaning: It badly harms corn, cotton, and tomato crops above all, as the young of a moth that flies
  at night.
scope: People also call it corn earworm, cotton bollworm, tomato fruitworm, or vetchworm, the young of
  a moth that flies at night and badly harms corn, cotton, and tomato crops.
examples:
- Tobacco budworms ate the cotton crop.
- The tobacco budworm harms corn and tomatoes.
