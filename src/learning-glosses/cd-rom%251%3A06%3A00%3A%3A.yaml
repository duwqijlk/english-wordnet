simpleMeaning: A small flat disk used with a computer, not with a music player, that holds a large amount
  of digital information for reading only, which the user cannot change.
scope: Also called compact disc read-only memory; a small disk for a computer that holds much digital
  information for reading only, among the disks that store digital information.
examples:
- I put the CD-ROM in the computer to read the files.
- The CD-ROM holds a large amount of digital information, but the user cannot change it.
