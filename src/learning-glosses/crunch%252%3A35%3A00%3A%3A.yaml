simpleMeaning: To press a thing or rub it until it breaks up, making the noise of a thing being crushed.
scope: Pressing or rubbing a thing until it breaks with a crushing noise, also called grind, not biting
  it with your teeth and not the sound itself.
examples:
- She crunched the dry leaves under her boots.
- The car crunched over the gravel drive.
