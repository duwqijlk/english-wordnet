senseId: 'sensitize%2:39:00::'
synsetId: 02120261-v
simpleMeaning: To get a person to notice a thing, or to make them able to feel it.
scope: To get a person to notice a thing or to feel it, not to make a material take light by coating it,
  not to make a person react to a drug or something that stirs allergy, and not to make a person aware
  in general.
examples:
- She sensitized me with respect to gender differences in this traditional male-dominated society.
- My tongue became sensitized to good wine.
