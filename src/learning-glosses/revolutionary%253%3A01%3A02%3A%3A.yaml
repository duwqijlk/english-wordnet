simpleMeaning: about, like, or causing a turn around a centre line or around another body in space
scope: This sense is about turning around a line or around another body, not about political change, not
  a person who wants political change, and not a new and very different idea.
examples:
- The wheel makes a revolutionary turn around its centre line once every second.
- The moon's revolutionary path takes it all the way around the earth.
