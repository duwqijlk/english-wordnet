simpleMeaning: A stray half-wild mixed-breed animal often seen near villages in Asia, above all in India.
scope: This is a stray half-wild mixed-breed animal seen near Asian villages; pariah dog is another name
  for this sense, not a pet kept in a home and not a wild animal of the woods.
examples:
- A pie-dog slept by the gate of the village.
- Pie-dogs roam the streets of the town.
