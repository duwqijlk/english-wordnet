simpleMeaning: One of two kinds of large sea animal of the north Atlantic with no outer ears and a nose
  like a trunk.
scope: A large north Atlantic sea animal with a trunk-like nose, not a sea animal with outer ears and
  not a land animal.
examples:
- The elephant seal hauled itself onto the beach.
- Male elephant seals have noses like trunks.
