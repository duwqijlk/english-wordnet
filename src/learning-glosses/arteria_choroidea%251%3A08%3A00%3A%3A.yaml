simpleMeaning: a blood vessel that brings blood to a web of tiny blood vessels in the brain that makes
  the fluid around the brain
scope: Also called choroidal artery; it feeds the web of vessels deep in the brain, not the outer layer
  of the brain and not the middle layer of the eye.
examples:
- The arteria choroidea supplies the choroid plexus deep in the brain.
- Blood from the arteria choroidea reaches the part of the brain that makes the fluid around it.
