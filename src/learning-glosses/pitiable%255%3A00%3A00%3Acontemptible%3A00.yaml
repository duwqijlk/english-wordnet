simpleMeaning: making people feel sorry for a person or thing and also think it is bad and worth very
  little
scope: Also called pathetic and pitiful, this sense makes people feel sorry for someone and think that
  person is bad or weak; it is not the sense that only makes people feel sorry.
examples:
- His pitiable lack of courage made people feel sorry for him and lose respect for him.
- The team gave a pitiable performance that made fans feel sad for them and think poorly of them.
