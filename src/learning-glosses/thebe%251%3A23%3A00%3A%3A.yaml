simpleMeaning: A unit of money in Botswana; 100 of them equal one pula.
scope: A small money unit in Botswana worth one hundredth of a pula, the larger unit there, and like other
  small coins that make up a larger unit of money.
examples:
- He paid twenty thebe for the bus in Botswana.
- One hundred thebe equal one pula in Botswana.
