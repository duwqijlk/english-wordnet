simpleMeaning: Any of a range of glowing things used to colour samples so they show up when looked at
  with light that makes them glow.
scope: This is a glowing thing used to colour samples so they show up, not a plain dye or a lens, and
  it is one of many such glowing things.
examples:
- The fluorochrome stained the cells bright green.
- They added a fluorochrome to the sample.
