simpleMeaning: A gauge, a tool that measures how much water has fallen from the sky.
scope: This is a gauge that measures how much water has fallen from the sky, also called pluviometer,
  rain gage and rain gauge; not a thermometer and not a barometer.
examples:
- The udometer showed two inches of rain.
- He read the udometer each morning.
