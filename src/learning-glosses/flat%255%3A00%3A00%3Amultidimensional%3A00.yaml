senseId: flat%5:00:00:multidimensional:00
synsetId: 00663738-s
simpleMeaning: 'Shallow and limited: it does not offer the variety or depth you would expect, and it does
  nothing to make itself look deep.'
scope: Describes a character, story or painting that feels shallow, not something merely boring, and not
  a level surface.
examples:
- The characters in the film were flat and hard to care about.
- The portrait looked flat, as if the artist had never tried to give it depth.
