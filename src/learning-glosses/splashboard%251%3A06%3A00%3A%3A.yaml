simpleMeaning: It keeps water from splashing over the side of a boat, a wide flat piece of wood set along
  the top edge.
scope: Also called a washboard, it keeps water from splashing over a boat's side, unlike the panel that
  shields people in a vehicle.
examples:
- The splashboard kept the waves from washing over the side.
- The splashboard stopped the spray from coming over the side.
