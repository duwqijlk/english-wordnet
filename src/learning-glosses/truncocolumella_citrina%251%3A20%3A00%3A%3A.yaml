simpleMeaning: A fungus with a round yellow to orange fruiting body found on the ground or partly buried,
  with a clear sterile column reaching into the spore-bearing tissue.
scope: A fungus with a round yellow to orange fruiting body on or under the ground, marked by a sterile
  column reaching into the spore-bearing tissue; the common puffball is a different round fungus, and
  so is the earthball.
examples:
- Truncocolumella citrina pushed its round yellow body through the soil.
- We found Truncocolumella citrina half buried under the leaves.
