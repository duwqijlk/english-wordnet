senseId: 'jumping_orchid%1:20:00::'
synsetId: 12070483-n
simpleMeaning: a plant whose male and female blooms share one stalk; touching a tender bit sticking out
  at the foot of the male bloom's middle sends its pollen flying at once
scope: A flower plant that shoots out its pollen when a tender part is touched, not a plant that simply
  opens its blooms, and not a plant with male and female blooms on separate stalks.
examples:
- The jumping orchid fired its pollen the moment a bee brushed the tender part.
- A jumping orchid in the glasshouse shot pollen across the leaf when I touched it.
