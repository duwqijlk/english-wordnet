simpleMeaning: a hard, see-through solid that breaks easily, whose atoms are not arranged in a regular
  pattern.
scope: This is the material itself, not a drinking container made from it or the amount it holds.
examples:
- The bowl is made of thin glass.
- Glass breaks easily when it is dropped.
