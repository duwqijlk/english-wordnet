simpleMeaning: In geology, the work of tracing where rocks come from, how they take shape, what minerals
  are in them, and how they fall into kinds.
scope: It is also called lithology, the part of geology that studies rocks, their beginnings, their making,
  and their kinds.
examples:
- She studied petrology to learn how rocks form.
- Petrology sorts rocks into kinds by what minerals they hold.
