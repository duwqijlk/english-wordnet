senseId: 'ionic_charge%1:23:00::'
synsetId: 13612177-n
simpleMeaning: The amount of electricity carried by an atom or a small group of atoms, equal to a fixed
  amount, called e, times a whole number from 1 to 15.
scope: The amount of electricity on an atom or a small group of atoms, not the amount of electricity in
  a whole wire and not the strength of a battery.
examples:
- The ionic charge of the particle was twice the fixed amount.
- Each ionic charge in the salt was a whole number times e.
