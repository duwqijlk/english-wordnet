simpleMeaning: A small pine of the high land of the eastern United States, in the Appalachians, with two
  needles, dark brown bark that peels off, and cone scales with sharp points
scope: Also called hickory pine, prickly pine and table-mountain pine, it is a small pine of the high
  land of the eastern United States, in the Appalachians, with two needles, dark brown bark that peels
  off, and cone scales with sharp points, while other small two-needled pines and other pines of the Appalachians
  are different kinds.
examples:
- The Pinus pungens grew on the high slopes of the Appalachians.
- Pinus pungens has dark brown bark that peels off in flakes.
