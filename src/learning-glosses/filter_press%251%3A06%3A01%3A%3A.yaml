simpleMeaning: In this machine for straining liquid, the liquid to be strained is pumped between a set
  of frames covered on both sides with cloth.
scope: A machine that strains liquid by pumping it between cloth-covered frames, not a simple sieve and
  not a pump on its own.
examples:
- The filter press squeezed the water out of the sludge.
- Workers cleaned the cloths of the filter press after each run.
