simpleMeaning: a made-up name for a small missile with a computer on board that follows heat and was planned
  to catch and blow up enemy missiles
scope: This is a code name for a small heat-seeking missile meant to catch and destroy enemy missiles,
  not a missile already in use and not an anti-aircraft gun.
examples:
- Brilliant Pebble was the code name for a small missile meant to stop enemy missiles.
- The Brilliant Pebble plan never put a missile into use.
