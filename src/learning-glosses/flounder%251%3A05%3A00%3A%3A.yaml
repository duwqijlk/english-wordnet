simpleMeaning: any of several kinds of flat fish that live in the sea, from Europe and other parts of
  the world
scope: Any of several kinds of flat fish that live in the sea; not the meat of the fish, and not a person
  who is struggling.
examples:
- We caught a flounder in the bay.
- Flounder is a common flatfish in northern seas.
