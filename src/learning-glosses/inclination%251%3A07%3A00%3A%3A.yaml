simpleMeaning: a natural leaning that makes a person or thing likely to be or do a certain thing
scope: A natural leaning toward a certain way of being or acting; tendency is another name for this sense,
  not a liking for something and not a physical lean.
examples:
- The fabric has an inclination to shrink.
- He had an inclination to speak too quickly.
