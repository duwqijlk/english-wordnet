simpleMeaning: a light jump upward or forward, powered by the mover's own body
scope: 'Other names for this sense are spring, bound, bounce, leaping and saltation: a light upward or
  forward jump, not the verb meaning to jump, and not a sudden increase.'
examples:
- With one leap, the cat cleared the low wall.
- The dancer's leap carried her across the stage.
