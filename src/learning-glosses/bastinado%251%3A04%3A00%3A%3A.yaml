simpleMeaning: a cruel punishment in which the soles of the feet are beaten with whips or sticks
scope: A cruel beating of the soles of the feet, also called falanga; not a whipping and not a caning.
examples:
- The prisoner feared the bastinado more than prison itself.
- In the old tale, the bastinado was used to punish thieves.
