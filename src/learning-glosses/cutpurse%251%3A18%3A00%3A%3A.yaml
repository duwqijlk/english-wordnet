simpleMeaning: a person who steals from the pockets or purses of other people in public places
scope: 'Also called dip and pickpocket: a person who steals from pockets or purses in public, not a thief
  who breaks into houses.'
examples:
- A cutpurse took his coins in the crowded market.
- The cutpurse slipped away before anyone saw her hand in his pocket.
