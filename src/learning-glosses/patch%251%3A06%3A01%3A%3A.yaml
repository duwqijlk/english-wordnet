simpleMeaning: the sewing done to fix a hole that is worn or torn, especially in a piece of clothing
scope: This is the sewing that fixes a hole, not a piece of cloth used to cover a hole, not a cover for
  a hurt eye, and not a cover for a hurt part of the body.
examples:
- You can see the neat patch where she sewed up the torn shirt.
- A neat patch of sewing covered the worn hole in his coat.
