simpleMeaning: Either of the two male sex glands, which make sperm and release male hormones such as testosterone.
scope: This is a male reproductive organ, not a rounded anatomical body or mass such as the ball of the
  thumb, not a round object used in games, not a plaything, not the spherical shape itself, not a musket
  projectile, not a compact mass, not a formal dance, not the game of baseball, not a pitch outside the
  strike zone, and not the verb senses.
examples:
- A hard blow to the balls left him doubled over in pain.
- The scan showed a small, harmless cyst on his left ball.
