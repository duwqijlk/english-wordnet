simpleMeaning: A fairly weak pull between tiny bits of matter with no charge, made when one bit makes
  the other slightly charged.
scope: This weak pull acts between bits of matter with no charge, and it comes from a small charge that
  one bit makes in a bit close to it.
examples:
- Van der Waal's forces hold the tiny bits of matter together weakly.
- The van der Waal's forces between the bits are fairly weak.
