simpleMeaning: To widen the pupil or to treat glaucoma in which the eye's drain is shut, an operation
  cuts the coloured ring of the eye
scope: An operation that cuts the coloured ring of the eye, it widens the pupil or opens the eye's shut
  drain.
examples:
- The surgeon did an iridotomy to widen her pupil.
- The doctor planned an iridotomy to treat his closed-angle glaucoma.
