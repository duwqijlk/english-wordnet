simpleMeaning: a lively dance of people from the Scottish Highlands, with steps that go in circles and
  slide smoothly
scope: This is a Scottish dance with round and sliding steps, not a fishing tool that winds line, not
  an American country dance, and not music made for dancing.
examples:
- At the party in Scotland, they danced a reel in a wide circle.
- The dancers learned the reel and moved round with light, sliding steps.
