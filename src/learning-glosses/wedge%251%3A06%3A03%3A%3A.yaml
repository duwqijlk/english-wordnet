simpleMeaning: a shoe heel that is part of the same piece as the bottom of the shoe, not a separate piece
scope: This is the heel of a shoe that is one piece with its bottom; it is not the wood block that stops
  a heavy thing from moving, and not the V-shaped block pushed between two things.
examples:
- The wedge on her sandal is one piece with the sole.
- He wore shoes with a low wedge that ran the full length of the sole.
