simpleMeaning: In genetics, a living thing born from parents of different kinds, especially one bred from
  plants or animals of different sorts or breeds
scope: 'Another name for a cross: a living thing bred from unlike parents, not a word made of parts from
  different languages and not a car with two power sources.'
examples:
- A mule is a hybrid of a horse and a donkey.
- The farmer grew a new hybrid of wheat in the field.
