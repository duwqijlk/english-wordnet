simpleMeaning: its edge is uneven, with small bites taken out of it here and there, as if gnawed
scope: 'Also called jagged: an edge with uneven notches as if gnawed, not a saw edge with teeth pointing
  to a tip.'
examples:
- The toothed edge of the leaf looked as if insects had nibbled it.
- She ran her finger along the toothed margin of the old coin.
