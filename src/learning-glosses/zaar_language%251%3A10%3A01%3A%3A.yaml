simpleMeaning: A Chadic way of speaking in northern Nigeria, above all in Bauchi State, Tafawa Balewa
  LGA.
scope: A Chadic way of speaking in northern Nigeria, also called Sayanci, Sayanci language and Zaar; its
  home in Bauchi State sets it apart from other Chadic ways of speaking.
examples:
- The Zaar language is spoken in northern Nigeria.
- Children learn the Zaar language at home in Bauchi State.
