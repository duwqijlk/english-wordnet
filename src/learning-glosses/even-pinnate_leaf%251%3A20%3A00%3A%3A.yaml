simpleMeaning: a plant part with small parts set in a row on each side of a stalk, with two of them at
  the tip
scope: 'Also called abruptly-pinnate leaf: a plant part with two small parts at its tip, not one with
  a single small part at its tip and not a plain plant part with no small parts.'
examples:
- The even-pinnate leaf ends in a pair of leaflets.
- This even-pinnate leaf has two small leaflets at the tip of its stalk.
