simpleMeaning: a loud cry or shout from many people that goes on for a long time
scope: Also called clamor, clamoring and clamouring, this is a loud cry from many people that keeps going,
  not the verb sense of shouting noisily to demand something.
examples:
- The clamour from the crowd went on for an hour.
- He could not speak over the clamour of many angry voices.
