simpleMeaning: officially bring people into a group as members
scope: This sense is about bringing people into a group as members, such as a party or club; it is not
  about gathering soldiers for an army, giving a promotion, or making a number larger.
examples:
- The party raised volunteers across the state to knock on doors before the election.
- The charity raised a team of helpers to run the winter shelter.
