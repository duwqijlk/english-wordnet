simpleMeaning: When the top lid of the eye hangs down because the muscle that lifts it is weak or does
  not work
scope: A top eyelid that hangs down because its muscle is weak or does not work, not a droop from being
  tired and not a droop of another part of the body.
examples:
- Her ptosis made it hard to keep her left eye open.
- The doctor said his ptosis came from weak muscles in his eyelid.
