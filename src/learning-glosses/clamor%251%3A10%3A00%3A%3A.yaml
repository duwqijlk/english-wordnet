simpleMeaning: A loud cry that goes on and on, raised by many people at once
scope: A loud cry that goes on and on from many people, not a single loud harsh noise and not the act
  of crying out.
examples:
- The clamor of the crowd rose when the gates stayed shut.
- A clamor went up from the hall as the news spread.
