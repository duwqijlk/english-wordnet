simpleMeaning: having no feeling in the body or a part of it; unable to sense touch or pain
scope: This is about lost feeling in the body, not about a material that will not bounce back or a space
  with no echo.
examples:
- My fingers went dead with cold after ten minutes in the snow.
- The dentist's injection left half my mouth dead for hours.
