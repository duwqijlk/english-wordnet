simpleMeaning: in a way that shows little feeling and stays calm, and does not get excited or upset
scope: This describes how a person acts or speaks with little feeling. It is not how a person acts when
  they show strong feeling or get excited.
examples:
- He said 'no' stolidly and did not change his mind.
- She waited stolidly while the bad news was read out to her.
