simpleMeaning: An animal with a body the same all round, shaped like a sac with one opening and stinging
  arms; it takes the form of a polyp or a medusa
scope: This is an animal with stinging arms, not a fish or a shellfish; also called a cnidarian.
examples:
- A jellyfish is a coelenterate that drifts in the sea.
- The coelenterate's stinging arms caught a small fish.
