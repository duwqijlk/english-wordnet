simpleMeaning: Blood reaches the testicles through a branch of the body's main blood tube
scope: A branch of the main blood tube that feeds the testicles, also called arteria testicularis; not
  a blood tube in the neck and not a tube that carries blood back to the heart.
examples:
- The internal spermatic artery supplies blood to the testicle.
- The internal spermatic artery runs down from the aorta.
