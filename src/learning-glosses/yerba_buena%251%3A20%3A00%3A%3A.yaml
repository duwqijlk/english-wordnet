simpleMeaning: Used as medicine, this herb of the north-western United States creeps along the ground,
  lives year after year, and keeps its leaves and small white flowers through winter.
scope: Among the herbs of the north-western United States, this trailing evergreen kind is the one used
  as medicine.
examples:
- Along the damp ground near the stream, yerba buena trailed in long runners.
- The herbalist gathered yerba buena to make medicine.
