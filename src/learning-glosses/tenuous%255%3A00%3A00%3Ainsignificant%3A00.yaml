simpleMeaning: having so little force or meaning that it hardly counts as anything
scope: slight, thin, fragile and flimsy are other names for this sense; this is having so little force
  or meaning that it hardly counts, not the sense of being very thin in width.
examples:
- His claim rested on tenuous evidence.
- She made a tenuous argument that convinced no one.
