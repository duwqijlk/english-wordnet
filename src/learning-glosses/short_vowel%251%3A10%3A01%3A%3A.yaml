simpleMeaning: In some tongues, long sounds and brief ones are told apart, and this sound is usually the
  brief kind, said in less time than a long one.
scope: In tongues that tell long sounds from brief ones, this brief sound is one of the sounds set against
  long ones.
examples:
- She said a short vowel.
- We heard a short vowel.
