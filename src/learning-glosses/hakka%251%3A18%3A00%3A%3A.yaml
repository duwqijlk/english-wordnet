simpleMeaning: A member of a people of south-eastern China, above all Hong Kong, Canton and Taiwan, who
  moved from the north in the 12th century.
scope: A member of a people of south-eastern China, above all Hong Kong, Canton and Taiwan, who moved
  from the north in the 12th century; this is a person of the people, not the Chinese speech of the south-east.
examples:
- A Hakka farmer worked the fields of south-eastern China.
- The Hakka moved from the north in the 12th century.
