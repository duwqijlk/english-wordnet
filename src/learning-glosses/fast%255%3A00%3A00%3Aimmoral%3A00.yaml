simpleMeaning: Not held back by accepted social customs or by ideas of right and wrong.
scope: This is about a wild, morally loose way of living; it is not about speed, loyalty, or camera lenses.
examples:
- He ran with a fast crowd in his twenties and rarely came home before dawn.
- In those days, a woman who smoked in public was thought fast.
