simpleMeaning: The spot in an orbit that lies closest to the thing being circled, in astronomy
scope: Also called a periapsis, this is the spot in an orbit that lies closest to the thing being circled,
  not the farthest spot, which is the apoapsis.
examples:
- At its point of periapsis, the probe is closest to the planet.
- The point of periapsis of the moon's path is the spot where it comes nearest Earth.
