simpleMeaning: In physiology, the idea that each job of the body is done in a fairly small, set place
  in one part or organ of the body
scope: 'In physiology, also called localisation, localisation of function, localisation principle, localization
  of function, and localization principle: this is the idea that body jobs sit in set places, not making
  a product fit one place or country.'
examples:
- Localization explains why damage to one small part of the brain can stop speech.
- In class, we learned about localization, the idea that each body job has its own place in the body.
