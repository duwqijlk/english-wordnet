simpleMeaning: a cover, most often of rope or cloth, put over a rope or spar to guard it from rubbing
scope: A covering that guards a rope or spar from rubbing, not the rope itself and not a sail.
examples:
- They wrapped chafing gear round the rope where it rubbed the rail.
- Old chafing gear hung on the hook beside the sail locker.
