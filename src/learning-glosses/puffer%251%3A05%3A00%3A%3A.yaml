simpleMeaning: Any of many marine fishes whose long spiny body can swell with water or air into a ball;
  some carry a strong nerve poison; closely related to spiny species.
scope: This is the short everyday name for the fish that puffs into a spiny ball, not the dangerous dish
  made from it and not the related spiny puffers; 'blowfish', 'globefish' and 'pufferfish' are other names
  for the same fish.
examples:
- A puffer hovered beside the rocks, then swelled into a ball.
- The puffer's spines rose as it inflated.
