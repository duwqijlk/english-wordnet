simpleMeaning: Facts are gathered and handled by a machine in one smooth system, with each later step
  joined to the rest.
scope: This is work a machine does, gathering facts and joining each later step into one smooth system,
  not work done by hand in separate steps.
examples:
- With integrated data processing, each step joined the next in one system.
- Integrated data processing gathered the facts and handled them in one system.
