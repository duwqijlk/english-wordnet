simpleMeaning: The biggest earthstar, a round fungus whose spore-bearing part can spread 15 cm wide when
  its rays open out.
scope: A kind of earthstar, a fungus whose fruiting body opens out in rays, and the largest of its kind,
  reaching 15 cm across when the rays are expanded.
examples:
- Astreus pteridis opened its rays after the rain.
- We measured an Astreus pteridis at 15 cm across.
