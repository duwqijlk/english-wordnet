simpleMeaning: A glassy mineral made of sodium aluminum silicate and sodium chloride in crystal form that
  occurs in igneous rocks, those formed from molten material.
scope: This glassy mineral found in igneous rock, not lazurite — the main mineral of lapis lazuli — or
  quartz.
examples:
- Sodalite is a glassy mineral found in igneous rocks.
- They cut and polished a block of sodalite for the display.
