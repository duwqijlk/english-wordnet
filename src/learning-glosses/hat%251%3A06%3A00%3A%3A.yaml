simpleMeaning: A covering worn on the head to protect it from bad weather, with a shaped top and usually
  a projecting edge.
scope: A head covering worn against bad weather, with a shaped top and usually a projecting edge; not
  a close-fitting cap, a hard helmet, or a hood.
examples:
- She pulled her hat down low and stepped out into the rain.
- A straw hat kept the sun off his face all afternoon.
