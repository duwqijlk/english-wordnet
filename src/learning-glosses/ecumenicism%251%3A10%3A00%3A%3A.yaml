simpleMeaning: The teaching, in Christian thought, that the one-church drive backs working together and
  deeper fellow-feeling among church groups unlike each other, aiming for a Christian whole.
scope: This sense is also called ecumenicalism and ecumenism, the teaching, in Christian thought, that
  the one-church drive backs working together and deeper fellow-feeling among church groups unlike each
  other, aiming for a Christian whole.
examples:
- Ecumenicisms back working together.
- The ecumenicism aims at a single Christian whole.
