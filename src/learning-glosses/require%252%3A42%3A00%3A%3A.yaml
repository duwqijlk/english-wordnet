simpleMeaning: to make something necessary because it is needed, fair, or right.
scope: This is about something being needed or called for by what is right or proper, not about asking
  for a favour or begging for something.
examples:
- The job requires patience and a good eye for detail.
- The law requires all drivers to carry a licence.
