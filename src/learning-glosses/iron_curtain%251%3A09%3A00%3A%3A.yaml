senseId: 'iron_curtain%1:09:00::'
synsetId: 05699654-n
simpleMeaning: A barrier that communication and information cannot cross, especially one created by strict
  censorship and secrecy; Churchill used it in 1946 to describe the divide between democratic and communist
  countries.
scope: This is the figurative political barrier to information and ideas, not a real curtain of cloth
  or iron and not a theatre's fireproof screen.
examples:
- Strict censorship and secrecy raised an iron curtain around the country.
- News could not get through the iron curtain that divided the two sides.
