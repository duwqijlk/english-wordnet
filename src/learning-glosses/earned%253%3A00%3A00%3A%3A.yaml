simpleMeaning: got, especially because of a person's good qualities, hard work, or something the person
  did
scope: This is got because of a person's good qualities, hard work, or something the person did; not simply
  given, and not found by chance.
examples:
- She has an earned place on the team after months of hard training.
- His well-earned rest came after a long week of work.
