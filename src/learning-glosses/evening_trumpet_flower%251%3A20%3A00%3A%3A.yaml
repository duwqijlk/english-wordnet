simpleMeaning: A woody vine of the south-east of the United States that keeps its leaves all year, is
  poisonous, and has sweet-smelling yellow blooms shaped like funnels.
scope: A poisonous vine with yellow flowers, not a harmless garden vine; also called yellow jasmine and
  yellow jessamine.
examples:
- The evening trumpet flower grows along the fence in our garden.
- Do not eat the evening trumpet flower, as it is poisonous.
