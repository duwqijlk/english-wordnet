simpleMeaning: a mountain animal of Europe and Asia that feeds its young with milk, with hard hoof feet
  and horns that stand up and bend back at the tips
scope: This is the living mountain animal, not the soft leather made from the skin of this animal or of
  a sheep.
examples:
- A chamois jumped easily over the rocks high in the mountains.
- We saw a chamois with horns that bend back at the tips near the top of the hill.
