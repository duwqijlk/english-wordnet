simpleMeaning: A boxer who is not a paid professional and weighs no more than 132 pounds
scope: An amateur boxer of no more than 132 pounds; not a professional in the same weight class and not
  a light thing.
examples:
- The lightweight won his bout on points.
- At 130 pounds he fought as a lightweight.
