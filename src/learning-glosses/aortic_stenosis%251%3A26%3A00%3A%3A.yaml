simpleMeaning: a bad narrowing of the heart valve through which blood leaves the heart
scope: A bad narrowing of a heart valve, not a valve that leaks and not a healthy valve that opens wide.
examples:
- His aortic stenosis made the heart work hard to push blood out.
- Doctors found her aortic stenosis when they heard a murmur in her chest.
