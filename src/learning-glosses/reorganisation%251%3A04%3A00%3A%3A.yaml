simpleMeaning: The putting in place of a new way of running things, with things set out in a new way,
  often with big and sharp changes.
scope: 'Also called reorganization, shake-up or shakeup: the putting in place of a new way of running
  things, with things set out in a new way, often with big and sharp changes; not a small change in how
  things are done.'
examples:
- The reorganisation of the school shook up every class.
- A committee oversaw the reorganisation of the course.
