simpleMeaning: A mammal like a small house pet that usually gives off a strong-smelling stuff used to
  make perfumes.
scope: A mammal like a small house pet that gives off a strong-smelling stuff used in perfumes, also called
  civet; not the ring-tailed mammal of Mexico and the south-west of the United States.
examples:
- The civet cat marked the tree with its strong smell.
- Perfume makers once prized the civet cat for its musk.
