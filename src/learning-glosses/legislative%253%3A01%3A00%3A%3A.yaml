simpleMeaning: about laws or about making laws, or made by a law
scope: This is about laws or making laws, or made that way, not about the group of people who make laws
  or made up of the members of that group.
examples:
- A legislative proposal to change the voting age was put to a vote.
- New legislative rules set clear limits on factory waste.
