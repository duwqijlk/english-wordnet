simpleMeaning: A sharp tool for making small holes for small nails or small screws
scope: A sharp tool that makes small holes for small nails or screws; bradawl is another name for this
  sense, not the sharp tip on a stem or leaf of the same name.
examples:
- He used a pricker to make small holes for the screws in the wood.
- With a pricker, she made a hole for each nail in the board.
