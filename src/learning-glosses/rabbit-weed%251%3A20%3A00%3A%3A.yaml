simpleMeaning: a low plant of the southwestern United States that sticks to the touch, with narrow straight
  leaves on many thin branches and hundreds of tiny yellow flower heads
scope: This low sticky plant of the southwest is also called rabbitweed, broom snakeroot, broom snakeweed,
  snakeweed, and turpentine weed; it is not a rabbit's food plant or a common weed.
examples:
- Rabbit-weed grows along the dry roadside.
- The rabbit-weed felt sticky when I touched it.
