simpleMeaning: a place or building where things can be left and kept safe
scope: 'Also called a deposit: a place or building for keeping things safe; it is the place itself, not
  the act of leaving something there.'
examples:
- The old warehouse is now a repository for city records.
- They built a large repository to keep the books safe.
