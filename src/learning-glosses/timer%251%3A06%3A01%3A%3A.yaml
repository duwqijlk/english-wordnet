simpleMeaning: a device that switches a machine on or off at times fixed in advance
scope: A device that switches a machine on or off at set times; not a clock that only shows the time or
  measures a stretch of time.
examples:
- Set the timer so the lights come on at dusk.
- The timer switched the heater off at midnight.
