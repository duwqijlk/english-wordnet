simpleMeaning: cannot change in the way you are or in the things you do again and again
scope: Fixed in the way you are and what you always do, not a disease that cannot be cured and not a person
  who has such a disease.
examples:
- He is an incurable optimist who always expects good things to happen.
- My grandfather is an incurable early riser and gets up at five every day.
