simpleMeaning: a large, hairy spider from hot parts of the world, with sharp pointed parts for biting;
  its bite hurts, but the poison in it is not very strong
scope: This is the large hairy spider from hot lands, not the large spider from southern Europe that people
  once thought caused uncontrolled body movement.
examples:
- A tarantula walked slowly across the warm rocks.
- The tarantula's bite hurt, but its poison was not strong.
