simpleMeaning: The cord in the back gives off one of the twelve pairs of cords from the spine in its chest
  part.
scope: This is one of the twelve pairs of cords from the spine, coming out of the chest part of the cord,
  not a cord from the neck or the lower back.
examples:
- The thoracic nerve carries signals from the chest wall.
- The thoracic nerve leaves the spine in the chest.
