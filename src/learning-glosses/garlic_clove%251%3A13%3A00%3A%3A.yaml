simpleMeaning: One of the small round parts that can be split off the centre of a larger bulb.
scope: This is one small round part that can be split off the centre of a larger bulb, also called a clove;
  not the whole bulb, and not an onion, which has layers.
examples:
- She peeled a garlic clove for the sauce.
- One garlic clove was enough for the whole pot.
