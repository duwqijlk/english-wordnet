simpleMeaning: a worker whose job is to put water or another liquid on the material being made, as part
  of the making process
scope: A worker who puts water on the work being made; not a chemical that helps a liquid spread, and
  not a person who wets the bed while asleep.
examples:
- The wetter put water on the cloth at each stage of the work.
- In the factory, the wetter put liquid on every sheet of paper before the next step.
