simpleMeaning: it takes food from a living thing while living on the outside of it, as a flea does
scope: 'Also called ectoparasite, ectozoan, epizoan and epizoon: it takes food from a living thing while
  living on the outside of it, as a flea does, not one that lives inside the body and not a creature that
  lives on its own.'
examples:
- The ectozoon lived on the bird's skin and fed on its blood.
- An ectozoon was found on the horse's coat.
