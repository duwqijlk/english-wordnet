simpleMeaning: Brought to England too by people, this common, fairly large tree animal comes from the
  east of North America
scope: 'Also called cat squirrel and eastern gray squirrel: a fairly large tree animal common in the east
  of North America and brought to England too, not a ground animal and not a red squirrel.'
examples:
- Eastern grey squirrels now live in English parks as well as in North America.
- The eastern grey squirrel is easy to see in the trees of the eastern states.
