simpleMeaning: the fact that something in electricity is marked as positive (+) or negative (-), as at
  the two ends of a battery
scope: 'Also called sign: this is the positive or negative mark in electricity, not the wider idea of
  a link between two opposite qualities or ways of acting.'
examples:
- He joined the wires with the wrong polarity and the motor ran the wrong way.
- Check the polarity of the battery before you put it in.
