synsetId: 05383393-n
simpleMeaning: Round the navel, in the skin, small blood tubes start, and end as extra tubes that join
  the portal blood tubes.
scope: Also called vena paraumbilicalis, these small blood tubes are set apart from other belly veins
  by starting in the skin round the navel and ending as extra tubes that join the portal blood tubes.
examples:
- The paraumbilical vein runs through the skin near the navel.
- A paraumbilical vein joins the portal blood tubes.
