simpleMeaning: coming out with great force, usually in a thin stream
scope: 'Also called spurting, squirting, and spouting: this is about something coming out in a thin stream
  with great force, not about a plane or travel by plane.'
examples:
- Water was jetting from the broken pipe in a thin, strong stream.
- Steam came jetting out of the small crack in the pipe.
