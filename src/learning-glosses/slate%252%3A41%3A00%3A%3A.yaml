simpleMeaning: to put a person's name on a list of people who will try to be chosen in an election
scope: To put a name on a list for an election, not the rock used for roofs, not the noun for that list
  itself, and not covering a roof with rock.
examples:
- The party slated her for the city election.
- He was slated as a candidate for mayor.
