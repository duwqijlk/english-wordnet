simpleMeaning: about how notes sound when played together, not about the main tune or the beat of the
  music
scope: About notes played together in music, not about the study of what musical sounds are made of, and
  not about shaking movements in a nearby thing.
examples:
- The song's harmonic change made the chorus sound rich and full.
- She studied the harmonic parts of the music, not just the tune.
