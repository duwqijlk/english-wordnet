simpleMeaning: Usually given in secret, a sleep-bringing drug mixed with strong drink makes the drinker
  lose consciousness.
scope: This drug mixed with strong drink works in secret to make the drinker lose consciousness.
examples:
- He slipped knockout drops into the man's drink in secret.
- The knockout drops made the drinker lose consciousness.
