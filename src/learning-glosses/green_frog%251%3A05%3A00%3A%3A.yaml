simpleMeaning: The big croaking kind has a close look-alike that lives in or near marshes and ponds of
  the United States and Canada
scope: A water animal of marshes and ponds in the United States and Canada, much like the big croaking
  kind, not a toad and not an animal of dry land.
examples:
- We heard a green frog calling from the marsh.
- A green frog sat at the edge of the pond.
