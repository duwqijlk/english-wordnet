simpleMeaning: small coins of low value, thought of as a group.
scope: This sense is not the money handed back after a purchase and not the act of making something different;
  it is low-value coins as a group.
examples:
- She keeps loose change in a jar.
- I keep some change in my pocket for parking meters.
