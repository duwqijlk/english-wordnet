simpleMeaning: One of several wide-ranging germ-fighting drugs made from fungi and close to penicillin,
  sold under this name; adding side chains has made partly man-made versions with stronger germ-fighting
  power.
scope: 'Also called cephalosporin: a wide-ranging germ-fighting drug made from fungi and close to penicillin,
  not penicillin itself and not a drug for viruses.'
examples:
- The doctor gave her Mefoxin for the wound infection.
- Mefoxin works against many kinds of germs.
