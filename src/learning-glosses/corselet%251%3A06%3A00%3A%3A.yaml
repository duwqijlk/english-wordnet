simpleMeaning: a piece of hard covering worn to keep the middle of the body safe in fighting, usually
  made of a front plate and a back plate
scope: A hard covering for the middle of the body only, usually with front and back plates; not a helmet
  for the head and not a shield held in the hand.
examples:
- The soldier wore a metal corselet over his chest.
- The museum shows a corselet with both front and back plates.
