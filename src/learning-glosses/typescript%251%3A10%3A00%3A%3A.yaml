simpleMeaning: words typed on paper, especially a typed copy of a book or piece of writing before it is
  printed
scope: This is typed words on paper, especially a typed copy of an author's writing, not handwriting and
  not the printed book itself.
examples:
- The author sent the typescript to the publisher.
- She read the whole typescript and made notes in pencil.
