simpleMeaning: a covering, usually made of cloth, that is used as a roof and keeps an area safe from sun,
  rain, or other weather
scope: A cloth roof over an area, not the clear cover over the front part of a plane and not the top part
  of a parachute that fills with air.
examples:
- We sat under a canopy to stay out of the rain.
- A cloth canopy shaded the tables outside the shop.
