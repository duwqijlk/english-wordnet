simpleMeaning: In computing, a way of telling a computer what to do, step by step, with orders that change
  what it holds in its memory.
scope: A way of telling a computer what to do step by step, not a way of stating what the result should
  look like.
examples:
- She learned imperative programming in her first year.
- Imperative programming tells the computer each step in order.
