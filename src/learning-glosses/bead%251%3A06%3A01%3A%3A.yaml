simpleMeaning: A thin strip with a row of small round shapes along it, put on furniture to edge or decorate
  it
scope: A strip with small round shapes along it edging furniture, not a small ball on a string and not
  a drop of liquid.
examples:
- A bead of wood ran along the edge of the drawer.
- The cabinet was finished with a bead around the doors.
