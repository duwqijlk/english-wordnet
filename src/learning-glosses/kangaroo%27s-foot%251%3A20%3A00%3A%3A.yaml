  a sedge, flowering in spring.
scope: People also call it a kangaroo's paw, a kangaroo-foot plant, or a kangaroo paw.
examples:
- The kangaroo's-foot flowers were covered in soft hairs.
- Kangaroo's-foot grew in Australia.
