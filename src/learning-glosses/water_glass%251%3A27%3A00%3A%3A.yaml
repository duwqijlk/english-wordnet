simpleMeaning: A thick runny stuff, a soda salt held in liquid, joins things, coats them, and keeps eggs
  fresh.
scope: Also called sodium silicate and soluble glass, it is a thick stuff used as a glue, as a coating,
  and to keep eggs fresh; the gauge sense of water glass is a different sense.
examples:
- Water glass kept the eggs fresh for months.
- He brushed water glass on the wall as a protective coat.
