simpleMeaning: Like a sextant, it reads the angle of a star or the sun above the horizon, but its scale
  is marked in steps of 45 degrees.
scope: It reads angles to a star or the sun, and its 45-degree markings set it apart from a sextant, its
  nearest kin.
examples:
- The octant gave the angle of the sun above the horizon.
- The octant was used to read the height of a star.
