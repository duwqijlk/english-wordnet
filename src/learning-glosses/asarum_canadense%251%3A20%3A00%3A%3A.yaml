simpleMeaning: A low plant of Canada and the east and middle of the United States that loses its leaves
  in winter and lives for many years
scope: 'Also called black snakeroot and Canada ginger: a low plant of Canada and the east and middle of
  the United States that loses its leaves in winter, not a tall plant and not one that keeps its leaves
  all year.'
examples:
- Asarum canadense grows low on the forest floor.
- In spring, the Asarum canadense sends up new leaves.
