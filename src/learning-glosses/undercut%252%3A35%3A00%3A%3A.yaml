simpleMeaning: to hit a ball down at a slant in golf, tennis, or hockey so the ball spins back or rises
scope: This is the act of hitting a ball in sport, not the stroke as a named thing, not cutting away the
  under part of something, and not a piece of meat.
examples:
- He undercut the ball so it spun back after it landed.
- She undercut her shot in tennis and the ball rose high.
