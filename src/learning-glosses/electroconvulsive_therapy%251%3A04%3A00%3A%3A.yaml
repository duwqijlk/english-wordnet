simpleMeaning: The giving of a strong current through the brain to bring on fits and a long time of not
  waking up.
scope: 'Also called electroshock and electroshock therapy: the giving of a strong current through the
  brain to bring on fits and a long time of not waking up, not a drug cure and not surgery.'
examples:
- Electroconvulsive therapy was used to treat the illness.
- The doctor gave electroconvulsive therapy in the hospital.
