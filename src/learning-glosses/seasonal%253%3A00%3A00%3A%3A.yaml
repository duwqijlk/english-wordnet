simpleMeaning: happening at a certain time of year, or depending on that time of year
scope: This describes something that happens at or depends on one time of year, not a worker who only
  gets work at certain times of year.
examples:
- Seasonal rains come every summer and fill the rivers.
- The shop sells seasonal fruit that grows only in winter.
