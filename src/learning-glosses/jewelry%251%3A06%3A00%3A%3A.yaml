simpleMeaning: a thing worn for beauty, such as a ring, bracelet or necklace, made of costly metal and
  set with gems, or with stones that look like gems
scope: Things worn for beauty and made of costly metal and gems, not loose gems on their own and not ordinary
  clothes.
examples:
- She wore silver jewelry with her dark dress.
- The shop sells gold jewelry in its front window.
