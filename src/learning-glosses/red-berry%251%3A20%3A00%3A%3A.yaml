simpleMeaning: Of the western United States and Mexico, a small, prickly bush that keeps its leaves all
  year, with tiny blooms and bright rose-tinted fruit.
scope: Also called redberry, this names the small, prickly evergreen bush of the western United States
  and Mexico, not the North American herb with white flowers and poisonous fruit.
examples:
- Bright fruit hung on the red-berry.
- The red-berry keeps its leaves through the winter.
