simpleMeaning: English writers of verse who lived in the north-west of England at the start of the 1800s
  and drew ideas from the land there
scope: English writers of verse from the start of the 1800s who lived in the north-west of England, not
  other writers of the same time and not writers from other places.
examples:
- Wordsworth was one of the lake poets.
- The lake poets wrote about the hills and lakes around them.
