simpleMeaning: hard to understand, like the words of an oracle (a person in old times said to tell what
  will happen)
scope: 'Also called oracular: hard to understand in what it means, not simply odd to look at and not just
  kept secret.'
examples:
- Her enigmatic smile left us unsure what she was thinking.
- He gave an enigmatic answer, and no one knew what he meant.
