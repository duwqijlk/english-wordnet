simpleMeaning: a part that turns, made up of a set of turning wing-like blades (flat parts that push air
  as they turn)
scope: This is a turning part made up of a set of blades; it is not the turning part inside a motor or
  generator.
examples:
- The helicopter rose as its rotor turned fast above it.
- Workers checked the rotor on the jet engine before the flight.
