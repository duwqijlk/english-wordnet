simpleMeaning: to say the name of a person or thing, or to tell what makes them different from others
scope: 'Also called name: to give a name or tell what marks a person or thing out, not just to know who
  someone is and not the plant-and-animal sense.'
examples:
- The report identified the causes of the fire.
- He identified the bird by its red wings.
