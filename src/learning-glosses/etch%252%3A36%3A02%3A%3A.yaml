simpleMeaning: To cut a picture or letters into a block for printing, or to print from such a block.
scope: To cut a picture or letters into a block for printing, or to print from such a block, also called
  engrave, not to eat away the top of a chip in making electric parts.
examples:
- She etched a letter into the wood block.
- He etched the plate and printed a hundred copies.
