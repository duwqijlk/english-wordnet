simpleMeaning: the full amount that one large wooden box for carrying goods can hold
scope: This is the amount held in one such box, not the box itself and not the act of putting things into
  a box.
examples:
- The shop sells juice by the crate, not by the single bottle.
- He bought a crate of apples, twenty kilos in all.
