simpleMeaning: having a pattern made by putting color on in wide strokes
scope: Having a pattern from color put on in wide strokes, not having long thin cuts that show cloth underneath.
examples:
- The brown flower was slashed with yellow across its petals.
- Her dark blue dress was slashed with bright red.
