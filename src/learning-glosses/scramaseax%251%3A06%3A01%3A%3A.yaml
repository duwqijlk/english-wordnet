simpleMeaning: A blade with one sharp edge that the Anglo-Saxons used to fight and to hunt
scope: A blade with one sharp edge that the Anglo-Saxons used to fight and to hunt, also called scramasax
  or scramsax; not a double-edged sword and not a small dagger.
examples:
- The warrior drew his scramaseax before the fight.
- A scramaseax was a handy blade for hunting.
