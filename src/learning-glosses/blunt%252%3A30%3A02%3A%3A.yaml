schema: oewn-learning-gloss-v2
senseId: 'blunt%2:30:02::'
synsetId: 00192383-v
simpleMeaning: to make a feeling, activity or sense less lively, less intense and less strong in force
scope: This sense is about making a feeling or action weaker, not about a blade that is not sharp, not
  about speaking in a direct way, and not about making a blade less sharp.
examples:
- Fear blunted her joy that evening.
- The loud noise blunted his hearing for a short time.
