simpleMeaning: A thin, see-through young form of eels and some other fishes
scope: A thin, see-through young form of eels and some other fishes; not a grown eel, and not a young
  form that is thick and cannot be seen through.
examples:
- The leptocephalus drifted in the open sea before it grew into an eel.
- A leptocephalus is so clear you can see through its body.
