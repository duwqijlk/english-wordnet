simpleMeaning: A slow-moving Australian tree-dwelling marsupial without a tail, with grey fur and furry
  ears, that eats eucalyptus leaves and bark.
scope: Another name for the koala and koala bear, an Australian tree-dwelling marsupial; not a wombat,
  a possum or a true bear.
examples:
- A kangaroo bear has grey fur, furry ears and no tail.
- The kangaroo bear feeds on eucalyptus leaves and bark.
