simpleMeaning: A small tree of the West Indies and northeastern Venezuela whose purple flowers grow in
  sprays above big pointed oblong leaflets; its seeds are black or scarlet with black spots.
scope: The small tree from the West Indies and Venezuela with purple flower sprays; jumby bean and jumby
  tree are other names for it, not separate plants.
examples:
- A bead tree shaded one corner of the square.
- Bead tree seeds are black or bright scarlet.
