simpleMeaning: a dress or coat that opens all the way down the front and fits by pulling one side over
  the other around the body
scope: This is a dress or coat that fits by pulling one side over the other around your body; it is not
  a blanket and not clothing you pull on over your head.
examples:
- She wore a wraparound dress that opened all the way down the front.
- He bought a wraparound coat for winter.
