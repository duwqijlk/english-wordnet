simpleMeaning: to burst out suddenly in a fast stream
scope: This is water or liquid bursting out in a sudden fast stream, and gush and spurt are other names
  for this sense; it is not the opening a liquid pours through, and not noisy talk.
examples:
- Water spouted from the broken pipe.
- The fountain spouted jets of water into the air.
