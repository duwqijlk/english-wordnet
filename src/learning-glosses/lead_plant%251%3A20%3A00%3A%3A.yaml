simpleMeaning: Once believed to mark lead ore, a shrub that grows in sandy woods and along stream banks
  in the western US, bearing grey-downy pinnate bloom and clusters of dull-colored flowers.
scope: This is the whole shrub of sandy western US woods and stream banks, not the metal lead; leadplant,
  written as one word, is the same plant.
examples:
- A lead plant grew on the sandy bank, its grey-downy flowers catching the light.
- Old prospectors watched for lead plant because they thought it marked lead ore.
