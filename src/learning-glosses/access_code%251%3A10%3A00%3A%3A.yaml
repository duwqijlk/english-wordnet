simpleMeaning: Before you may use a phone line, a computer, a network, or the like, you must enter this
  set of letters or numbers by typing, dialling, or speaking.
scope: Access is another name for this set of letters or numbers, which you must give before you may use
  a phone line, a computer, a network, or the like.
examples:
- The access code was typed in to get into the computer.
- Without the access code, the phone line could not be used.
