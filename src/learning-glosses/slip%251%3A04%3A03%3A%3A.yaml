senseId: 'slip%1:04:03::'
synsetId: 00060196-n
simpleMeaning: the act of getting away so that no one can catch you, especially by using clever tricks
scope: This is getting away from people who want to catch you, not a rude remark, not a fall, and not
  a piece of clothing.
examples:
- The thief gave the police the slip and ran into the crowd.
- She gave them the slip by hiding until they had gone.
