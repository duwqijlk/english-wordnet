simpleMeaning: The tube inside the front of the neck, under the chin and above the collarbone, through
  which air and food pass to the lungs and stomach.
scope: The human airway and foodway in the neck, not the matching part of an animal, the inside channel
  of a container, or the opening of a shoe.
examples:
- A fish bone stuck in her throat.
- He cleared his throat before he spoke.
