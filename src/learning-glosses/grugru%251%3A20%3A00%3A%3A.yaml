simpleMeaning: People eat the nuts of this palm of warm parts of America, whose leaves are like feathers
  and whose trunk swells out and bears sharp points.
scope: Also called gri-gri, grugru palm, and macamba, this is a feather-leaved palm of warm America with
  edible nuts, not a date palm.
examples:
- The grugru drops nuts that the children gather and eat.
- A grugru stood by the path, its trunk ringed with sharp points.
