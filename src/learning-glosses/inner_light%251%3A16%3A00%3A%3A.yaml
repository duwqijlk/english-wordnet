simpleMeaning: Quakers believe a presence of God is in each soul, and it helps them see what is right
  and leads them.
scope: Also called Light, Christ Within and Light Within, this is the presence of God that Quakers believe
  is in each soul, not the light of the sun.
examples:
- She felt the Inner Light guide her choice.
- The Inner Light helps Quakers find what is right.
