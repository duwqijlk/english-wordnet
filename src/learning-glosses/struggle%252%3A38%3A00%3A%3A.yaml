simpleMeaning: to climb something clumsily, pulling yourself up with your hands and feet.
scope: This is awkward climbing, also called skin, not the sense of making a great effort against resistance,
  and not a fight between people.
examples:
- The children struggled over the stone wall into the orchard.
- She struggled up the muddy bank, clutching at branches.
