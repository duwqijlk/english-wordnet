simpleMeaning: Cutting the nerve paths to and from the front part of the brain is the operation, and it
  often leaves thought and personality clearly changed
scope: Also called lobotomy, frontal lobotomy, leucotomy, leukotomy, prefrontal leucotomy, and prefrontal
  lobotomy; an operation on the front of the brain that cuts nerve paths.
examples:
- The surgeon described prefrontal leukotomy as cutting the paths to the front of the brain.
- Prefrontal leukotomy often changed how patients thought and acted.
