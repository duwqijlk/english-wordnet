simpleMeaning: A timepiece is held in place on the wrist by this band of cloth, leather, or linked metal
  parts.
scope: Also called a bracelet, a wristband, a watchband, and a watchstrap, it is a band of cloth, leather,
  or linked metal parts that holds a timepiece on the wrist.
examples:
- The leather watch bracelet was fastened around the wrist before going out.
- The watch bracelet was changed when the metal links broke.
