simpleMeaning: the part of a person's character that makes them not want to work, so they do nothing
scope: Doing nothing because a person does not want to work; not a short rest when tired, and not being
  without a job.
examples:
- His idleness at work made his boss angry with him.
- Years of idleness had left him with no wish to look for a job.
