senseId: abject%5:00:00:hopeless:00
synsetId: 01232308-s
simpleMeaning: showing that a person has given up and has no hope left
scope: This describes a person who has given up all hope; it is not about being very poor or in a very
  bad state.
examples:
- He made an abject surrender and stopped fighting for his rights.
- With an abject look, she accepted the bad news without hope.
