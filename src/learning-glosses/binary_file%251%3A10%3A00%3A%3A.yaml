simpleMeaning: In computer science, stored facts that only a program can read, where each sign uses all
  8 bits of a byte, a small unit of stored facts
scope: In computer science, stored facts only a program can read, not a plain text file a person can open
  and read.
examples:
- The program could not open the binary file as plain text.
- She sent the picture as a binary file.
