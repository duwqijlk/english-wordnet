simpleMeaning: in a way that is based on facts and not on personal feelings
scope: In a fair way based on facts, not in a way shaped by what you feel or want to be true.
examples:
- We must look at the facts objectively and not let our feelings decide.
- The judge tried to judge the case objectively.
