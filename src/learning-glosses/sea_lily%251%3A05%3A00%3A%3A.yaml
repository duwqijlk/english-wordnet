simpleMeaning: an animal like a flower, with fine arms that spread out and a stalk that holds it to a
  hard surface
scope: This is a flower-like animal fixed to a hard surface; not a true flower, and not a free-swimming
  sea creature.
examples:
- The divers found a sea lily clinging to the reef wall.
- A sea lily waved its fine arms in the current.
