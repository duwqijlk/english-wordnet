simpleMeaning: One of the parts of a glove that covers a hand digit or the thumb.
scope: This is a part of a glove, not the hand digit it covers, a unit of length, or the act of touching.
examples:
- The left finger of the glove had worn through at the tip.
- He checked each finger of the glove for holes.
