simpleMeaning: A health problem in which the body lacks certain enzymes, so it cannot break down and use
  one of the building blocks of protein.
scope: A health problem in which the body cannot break down one building block of protein; not an allergy
  and not a lack of all protein.
examples:
- Her lysine intolerance means she must avoid foods rich in lysine.
- Lysine intolerance was found when the baby failed to grow.
