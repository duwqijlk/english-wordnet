simpleMeaning: The rib cage moves back and down when this body part, joined to bone, tightens.
scope: This is the body part at the back also called musculus serratus posterior or serratus posterior,
  and it draws the rib cage back and down.
examples:
- When the posterior serratus muscle works, the rib cage shifts back and down.
- The posterior serratus muscle lies at the back, joined to the ribs.
