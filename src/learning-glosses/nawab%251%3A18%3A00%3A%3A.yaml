simpleMeaning: A ruler in India in the days of the Mogul emperors
scope: This is a ruler in India in the days of the Mogul emperors, with nabob as another name for this
  sense, not a king of all India and not a ruler of today.
examples:
- The nawab held court in his palace in Lucknow.
- Under the nawab, the province paid taxes to the Mogul court.
