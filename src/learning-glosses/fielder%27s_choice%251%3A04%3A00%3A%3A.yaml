simpleMeaning: In baseball, a play on a ball hit along the ground, in which the player in the field puts
  out a runner moving forward rather than the batter.
scope: In baseball, a play on a ball hit along the ground, in which the player in the field puts out a
  runner moving forward rather than the batter; not a play that puts out the batter and not a fly ball
  caught in the air.
examples:
- With a fielder's choice, the runner was put out at second base.
- The fielder's choice let the batter reach first base safely.
