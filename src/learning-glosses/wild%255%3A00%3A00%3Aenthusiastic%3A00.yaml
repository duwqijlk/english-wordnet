simpleMeaning: Extremely keen on something or unable to stop thinking about it.
scope: Very keen on something or obsessed with it; not a bleak, remote place and not a fanciful, silly
  idea.
examples:
- She was wild about the new band and played their album nonstop.
- He's wild about sailing and spends every weekend on the water.
