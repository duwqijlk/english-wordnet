simpleMeaning: the act of making something, such as a medicine, drink, or soup, by mixing many different
  parts together
scope: The act of mixing things to make something new, not the finished mixture itself and not a simple
  recipe.
examples:
- The concoction of the new soup took all afternoon.
- The concoction of the cough medicine took skill and long, slow mixing.
