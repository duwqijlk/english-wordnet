simpleMeaning: full of very strong feelings or beliefs, and ready to act on them in a forceful way
scope: This is very strong feeling or belief, also called fierce, violent or tearing; not a brief flash
  of anger, and not a calm mood.
examples:
- She was vehement in her dislike of the plan.
- His vehement protest filled the hall.
