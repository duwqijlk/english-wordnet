simpleMeaning: Any of several groups of Orthodox Jews who turn away from modern worldly ways, and many
  of whom do not accept the spiritual authority of the modern state of Israel.
scope: This sense covers only sects of Orthodox Judaism that turn away from modern secular life, many
  of which do not accept the spiritual authority of the modern state of Israel, unlike other Orthodox
  Jews.
examples:
- The Haredi community kept its own schools and stayed apart from modern secular life.
- The Haredi sects do not accept the spiritual authority of the modern state of Israel.
