simpleMeaning: A ship's heading is read from a set mark fixed on its compass
scope: Also called lubber line, lubber's line and lubber's mark, this is a set mark on a ship's compass
  that shows the ship's heading, not a moving needle and not a line drawn on a chart.
examples:
- The helmsman kept the lubber's point steady on north.
- She watched the lubber's point swing as the ship turned.
