simpleMeaning: The quality of being low, mean, and not worthy of respect.
scope: The quality of being low, mean, and not worthy of respect; ignobleness is another name for this
  sense, not the quality of being proud and not the quality of being poor.
examples:
- The ignobility of his plan shocked even his friends.
- She saw the ignobility in the way he treated the poor.
