senseId: 'celestial_horizon%1:15:00::'
synsetId: 08603373-n
simpleMeaning: the great ring on the round sky above us, whose flat side passes through the line where
  sky meets land and through the middle of the Earth
scope: The great ring on the round sky above us whose flat side passes through the line where sky meets
  land and the middle of the Earth; horizon is another name for this sense, not the line where sky meets
  land itself and not the celestial equator.
examples:
- The celestial horizon is the great ring whose flat side cuts through the middle of the Earth.
- The celestial horizon runs through the middle of the Earth and the line where sky meets land.
