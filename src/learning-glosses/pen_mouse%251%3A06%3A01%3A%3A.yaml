simpleMeaning: A cordless hand-held tool, shaped like a writing stick, that moves the pointer on a computer
  screen
scope: A hand-held tool that moves the pointer on a computer screen, not a plain writing pen and not a
  flat mouse that sits on a desk.
examples:
- She uses a pen mouse to draw on her laptop.
- The pen mouse fits in his hand like a thick pen.
