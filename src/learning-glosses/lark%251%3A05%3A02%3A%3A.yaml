simpleMeaning: a bird that sings and lives mostly on the ground in open land, with brown feathers marked
  with streaks
scope: A singing bird that lives on the ground in open land, with brown feathers marked with streaks;
  not the general Old World singing bird and not the North American bird with a yellow chest.
examples:
- A lark sang from the grass in the open field.
- The lark's brown feathers marked with streaks helped it hide on the ground.
