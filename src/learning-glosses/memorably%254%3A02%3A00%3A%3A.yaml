simpleMeaning: in a way that people are likely to remember for a long time
scope: In a way that stays in people's minds for a long time; not just in a good way and not about remembering
  facts yourself.
examples:
- The singer sang the old song memorably, and the crowd talked about it for weeks.
- He played the last piece memorably, in a way no one there would forget.
