simpleMeaning: Red or yellow fruit that can be eaten grows on this small tree from Asia
scope: 'Also called a cherry plum or a myrobalan plum: a small tree from Asia with red or yellow fruit
  that can be eaten, not a tree of Europe and not a tree whose fruit cannot be eaten.'
examples:
- The myrobalan in the garden was full of red fruit.
- We picked the myrobalan fruit and ate it raw.
