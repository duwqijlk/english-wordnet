simpleMeaning: A tube with a lens that makes the skin of the vagina and cervix look bigger, so these parts
  can be seen and studied in the living body
scope: This is a viewing tube for the vagina and cervix, not a camera or a cutting tool; also called a
  vaginoscope.
examples:
- The doctor used a colposcope to look at the cervix.
- With the colposcope, the nurse could see the tissue clearly.
