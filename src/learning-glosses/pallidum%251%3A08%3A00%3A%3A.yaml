simpleMeaning: The pale yellow inner part of a lens-shaped mass of nerve cells deep in the brain
scope: 'Also called globus pallidus and paleostriatum: the pale yellow inner part of a mass deep in the
  brain, not the outer part and not the brain''s outer layer.'
examples:
- The pallidum helps control movement from deep inside the brain.
- Damage to the pallidum can make the body shake or move in a stiff way.
