simpleMeaning: A parasitic disease caused by swallowing tiny worm larvae in undercooked meat, especially
  pork; the larvae move from the gut into muscles and form cysts there.
scope: The worm infection caught from undercooked pork; trichinosis and trichiniasis are other names for
  the same illness. Not the general muscle inflammation that the first word alone might suggest.
examples:
- Doctors in the nineteenth century recorded myositis trichinosa in patients who had eaten undercooked
  pork.
- Myositis trichinosa is an older name that medical texts now usually replace with trichinosis.
