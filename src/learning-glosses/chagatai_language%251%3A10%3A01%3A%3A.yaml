simpleMeaning: A written tongue of Turkic peoples in old central Asia, named for a son of Genghis Khan.
scope: A written tongue of old central Asia, not a spoken tongue of today or a tongue of the far east;
  also called Chagatai, Eastern Turki, Eastern Turki language, Jagatai, Jagatai language, Jaghatai and
  Jaghatai language.
examples:
- The Chagatai language was used in books across central Asia.
- Poets of old central Asia wrote in the Chagatai language.
