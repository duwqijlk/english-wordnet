simpleMeaning: Paying back the main amount owed on a debt or on shares or bonds at or before the due date,
  as when a company buys back its own shares
scope: This is paying back money owed in business, not the sense in religion of being saved from sin or
  evil.
examples:
- The redemption of the bonds took place a month before the due date.
- The company announced the redemption of some of its own shares.
