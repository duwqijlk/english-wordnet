simpleMeaning: the quality of being very grand and beautiful, in a way that makes people admire a thing
scope: 'Also called splendor, grandeur, splendour and grandness: the quality of being very grand and beautiful,
  not plain beauty and not size on its own.'
examples:
- Visitors stood in silence, struck by the magnificence of the old palace.
- The magnificence of the mountains at sunrise took our breath away.
