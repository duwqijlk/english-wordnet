simpleMeaning: 'A flat board with strings stretched across it makes the music here: the player lays it
  flat and plucks the strings with a small pick and with the fingers.'
scope: Also called zither and cither, this is a flat stringed instrument that is laid flat and played
  with a pick and with the fingers.
examples:
- She played a soft tune on the zithern.
- The zithern lay flat on the table as he plucked its strings.
