simpleMeaning: A banker who works most of all on helping firms sell new shares and bonds
scope: 'Also called an investment banker: a banker who works most of all on helping firms sell new shares
  and bonds, not one who lends money and not the person who agrees to cover a risk in insurance.'
examples:
- The underwriter helped the firm sell its new shares.
- She joined a bank as an underwriter of new bonds.
