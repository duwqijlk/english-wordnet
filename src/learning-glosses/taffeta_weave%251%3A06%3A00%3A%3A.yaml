synsetId: 03960288-n
simpleMeaning: 'Over and under, over and under: that is how the threads across and along cross in this
  basic way of making cloth, which leaves small squares on it.'
scope: Also called plain weave, this basic way of making cloth leaves small squares on the cloth, with
  threads going over and under one another in turn.
examples:
- The weaver chose a taffeta weave for the cotton cloth.
- A taffeta weave was used for the plain cotton dress.
