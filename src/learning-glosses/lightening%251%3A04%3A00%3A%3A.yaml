simpleMeaning: the process of a color becoming less dark than it was before
scope: This is about color becoming less dark. It is not the baby moving down in the mother's body late
  in the months before birth.
examples:
- The lightening of her hair in the sun was easy to see.
- After a few washes, the lightening of the cloth was clear.
