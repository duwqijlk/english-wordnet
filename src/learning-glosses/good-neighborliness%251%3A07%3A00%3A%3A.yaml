simpleMeaning: A person with this is ready to be kind and helpful to the people who live near them
scope: 'Also called good-neighbourliness, neighborliness and neighbourliness: a person with this is ready
  to be kind and helpful to the people who live near them, not just being polite to strangers and not
  a friendship with one person.'
examples:
- Her good-neighborliness showed in the meals she cooked for the family next door.
- Good-neighborliness means lending tools and checking on the people beside you.
