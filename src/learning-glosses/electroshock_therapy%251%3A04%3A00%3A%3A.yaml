simpleMeaning: Giving a strong electric current through the brain to bring on fits and a long time of
  not waking up.
scope: A strong current through the brain to bring on fits, also called electroshock and electroconvulsive
  therapy; not a mild current and not surgery.
examples:
- Electroshock therapy was once used to treat deep sadness.
- The doctor ordered electroshock therapy to bring on a fit.
