simpleMeaning: Its young eat rotting plant matter, grain, and other such food, and the grown insect is
  a slow, hard, black land bug of the weevil kind
scope: Also called a darkling ground beetle or a tenebrionid; a slow black land insect, not a flying beetle
  or a ladybird.
examples:
- A darkling beetle crawled slowly across the dry ground.
- The darkling beetle hides under stones during the day.
