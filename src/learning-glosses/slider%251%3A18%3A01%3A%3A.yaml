simpleMeaning: a person who cannot keep a firm hold with their feet, so they slip or slide across a surface
scope: Also called slipper, this names a person who loses their hold with their feet, not a baseball throw
  and not a turtle that lives in fresh water.
examples:
- On the ice, he became a helpless slider, unable to stop his feet.
- The slider on the wet floor grabbed a chair to stop moving.
