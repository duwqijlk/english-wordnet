simpleMeaning: To do with, or of, or like, any worms of the phylum it is named for.
scope: To do with, or of, or like, any worms of the phylum it is named for — the phylum Annelida —; also
  called annelidan; not worms with round bodies, jointed inside and out.
examples:
- Their worm was annelid in form.
- The beast was annelid by kind.
