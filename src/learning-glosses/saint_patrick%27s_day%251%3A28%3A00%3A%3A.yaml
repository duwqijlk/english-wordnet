simpleMeaning: A date each year when people of Ireland honour the holy man who guards their land
scope: March 17 and St Patrick's Day are other names for this sense; it is a day honouring the patron
  saint of Ireland, set apart from other Irish feast days and other saints' days by the holy man it honours.
examples:
- Saint Patrick's Day is kept each year by the Irish.
- On Saint Patrick's Day, crowds gather to honour Ireland's patron.
