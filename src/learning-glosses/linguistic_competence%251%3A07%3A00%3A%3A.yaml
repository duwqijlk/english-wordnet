senseId: 'linguistic_competence%1:07:00::'
synsetId: 05161144-n
simpleMeaning: In language study, the knowledge of the rules of a language that a speaker carries inside,
  without thinking about it, as against the way the speaker really talks
scope: The knowledge of a language's rules that a speaker carries inside; not the way the speaker really
  talks in the moment and not the rules written in a book.
examples:
- Her linguistic competence lets her spot a wrong sentence at once.
- Linguistic competence is the knowledge behind the words we speak.
