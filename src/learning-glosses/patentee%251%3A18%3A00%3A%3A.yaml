simpleMeaning: the maker of a new thing to whom the state gives the sole right to make it
scope: The maker of a new thing to whom the state gives the sole right to make it; not a maker with no
  such right and not a person who only buys that right from another.
examples:
- The patentee owned the sole right to the device.
- As patentee, she could stop others copying it.
