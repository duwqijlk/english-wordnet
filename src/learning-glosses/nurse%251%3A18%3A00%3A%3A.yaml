simpleMeaning: A person trained to look after sick people or young children, usually supervised by a doctor.
scope: This is a trained carer for patients or children, not the woman employed to look after a family's
  children, and not the verb for doing the job.
examples:
- The nurse checked his blood pressure before the doctor arrived.
- She trained as a nurse after years of caring for her younger brothers.
