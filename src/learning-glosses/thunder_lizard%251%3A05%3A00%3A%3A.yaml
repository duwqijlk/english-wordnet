simpleMeaning: a huge four-footed plant-eating dinosaur found in great numbers in North America late in
  the Jurassic time
scope: This is a huge four-footed plant-eating dinosaur; brontosaurus, apatosaurus, apatosaur and brontosaur
  are other names for this sense. Not a meat-eating dinosaur and not a small two-footed one.
examples:
- The thunder lizard stretched its long neck to reach the high leaves.
- A thunder lizard skeleton fills the hall of the museum.
