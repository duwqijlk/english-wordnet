simpleMeaning: A small flea of hot lands; the female that can bear young digs under the skin of the animal
  or person it lives on.
scope: Also called a chigoe or a chigoe flea, a small flea of hot lands, not the young mite of the same
  name that sucks blood.
examples:
- The chigger dug under the skin of her ankle.
- Chiggers left sore spots where they had burrowed.
