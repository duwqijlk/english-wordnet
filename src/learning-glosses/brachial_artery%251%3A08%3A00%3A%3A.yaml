simpleMeaning: carrying on from the armpit tube, the main blood tube of the upper arm parts at the elbow
  into thumb side and little finger side tubes
scope: 'Also called arteria brachialis: the main blood tube of the upper arm, not a vein and not the blood
  tube of the lower arm.'
examples:
- The brachial artery runs down the inside of the upper arm.
- A cut to the brachial artery bleeds heavily.
