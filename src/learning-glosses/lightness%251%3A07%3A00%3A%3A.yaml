simpleMeaning: the habit of treating things as a joke, never serious
scope: A carefree, not-serious way of acting, not the brightness of a picture and not a light colour.
examples:
- Her lightness lifted the mood of the whole room.
- He spoke with a lightness that made the hard news easier to hear.
