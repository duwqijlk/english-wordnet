simpleMeaning: A short collar that stands up and does not fold down, on a warm top
scope: 'Also called a mock turtleneck: a warm top with a short collar that stands up, not a collar that
  folds down and not a plain round neck.'
examples:
- He wore a mock polo neck under his jacket.
- The mock polo neck kept her neck warm without folding over.
