simpleMeaning: a home inside a building, with rooms on two floors joined by stairs inside it
scope: A home with rooms on two floors joined by stairs inside it, not the word for a system that lets
  messages go in both ways at the same time.
examples:
- They rent a duplex with bedrooms upstairs and a kitchen below.
- Her duplex has stairs from the living room up to two bedrooms.
