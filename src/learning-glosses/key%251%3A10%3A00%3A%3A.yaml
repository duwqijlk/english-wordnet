simpleMeaning: Any of the 24 major or minor musical scales, using the standard whole-and-half-step pattern,
  that give a piece its tonal base.
scope: This is the tonal system of a piece of music, not a lever you press or a list explaining symbols.
examples:
- The symphony begins in a minor key but ends in a bright major one.
- She sang the song in a lower key because the high notes strained her voice.
