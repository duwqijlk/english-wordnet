senseId: 'ostrich%1:18:00::'
synsetId: 10405406-n
simpleMeaning: a person who refuses to face what is real or true, from the common idea that the bird hides
  from danger by burying its head in the sand
scope: This sense is about a person who will not face the truth, not the large African bird that cannot
  fly.
examples:
- He is an ostrich about his money problems and will not open his bills.
- Stop being an ostrich and look at what is really happening.
