simpleMeaning: that makes a person unable to move or do things in the usual way
scope: Also called crippling or incapacitating, this describes something that makes a person unable to
  move or do things in the usual way; it is not the sense about taking away a legal right.
examples:
- He suffered a disabling injury that left him unable to walk.
- The disabling illness kept her in bed for months.
