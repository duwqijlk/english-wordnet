simpleMeaning: an illness where germs get into the gut (the tubes inside the body through which food passes)
  and make bad, watery waste pass very often
scope: A serious illness of the gut with bad, watery waste passing very often, not a mild stomach upset
  or one loose stool.
examples:
- Many soldiers fell ill with dysentery after drinking dirty water.
- The doctor treated his dysentery and gave him clean water and salts.
