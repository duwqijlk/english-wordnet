simpleMeaning: A sweet that you have to chew, made by boiling sugar or syrup until thick, then pulling
  it until it shines
scope: This is the chewy sweet made from boiled sugar or syrup, not a hard sweet and not chocolate.
examples:
- She bought some taffy at the seaside shop and chewed it slowly.
- The taffy stuck to his teeth as he chewed it.
