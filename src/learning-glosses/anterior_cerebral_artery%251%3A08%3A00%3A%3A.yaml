simpleMeaning: the thalamus and the brain's front and side outer layer are fed by one of two branches
  of the inner neck artery, which splits in two
scope: A branch of the inner neck artery that feeds the front of the brain, not a vein and not the artery
  at the back of the head.
examples:
- The anterior cerebral artery supplies blood to the front of the brain.
- A block in the anterior cerebral artery can affect the leg.
