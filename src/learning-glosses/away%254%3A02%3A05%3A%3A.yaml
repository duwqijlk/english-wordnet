simpleMeaning: in a way that shows an action is going on without stopping or at a steady pace.
scope: This sense is not about distance, departure, or being absent; it describes an action that keeps
  going.
examples:
- They chatted away while the rain fell outside.
- He sanded away at the old table all afternoon.
