simpleMeaning: A sweet, thick liquid, a kind of alcohol with three parts that each hold oxygen and hydrogen,
  got by breaking down fats and oils with alkali.
scope: A sweet, thick liquid got from fats and oils, also called glycerine or glycerin.
examples:
- Glycerol keeps the cake soft and moist.
- The chemist mixed glycerol into the cream.
