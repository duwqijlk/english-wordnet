simpleMeaning: Any of several games on a cloth-covered, four-sided table with soft edges, played with
  long sticks that thin at one end to push balls of ivory or a man-made mix
scope: These are the stick-and-ball games played on a cloth table as a group; not the table itself, and
  not the long stick used to play.
examples:
- They played billiards at the club every Friday night.
- He is very good at billiards and rarely misses a shot.
