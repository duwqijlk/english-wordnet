simpleMeaning: a set of wheels with a rope or cord running through them
scope: A set of wheels with a rope or cord running through them, not a single wheel on its own and not
  a rope used for tying things down.
examples:
- The sailors used a block and tackle to lift the heavy crate onto the deck.
- With a block and tackle, one person can lift a load that would be too much to lift by hand.
