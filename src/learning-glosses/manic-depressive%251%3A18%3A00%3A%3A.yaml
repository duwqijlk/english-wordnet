simpleMeaning: A person who lives with a sickness of the mind that swings between wild, high moods and
  deep, low moods
scope: This is a person with a sickness of the mind that swings between high and low moods, not the adjective
  for the sickness itself and not a person who is simply sad.
examples:
- The manic-depressive attended a clinic for his illness.
- Her brother, a manic-depressive, had good weeks and bad weeks.
