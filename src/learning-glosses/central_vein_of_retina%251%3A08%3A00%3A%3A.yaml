simpleMeaning: Running beside the main blood tubes in the nerve to the brain, this blood tube is made
  when the small blood tubes at the back of the eye join.
scope: Also called vena centralis retinae, a blood tube at the back of the eye made when small blood tubes
  join; not the main blood tubes it runs beside, and not a blood tube of the liver.
examples:
- The central vein of retina is made when small blood tubes join.
- The central vein of retina runs with the main blood tubes in the nerve to the brain.
