simpleMeaning: A person sent by the central government to work with tribes of Native Americans, most of
  all on their set-aside lands.
scope: This is a person sent by the central government to work with tribes of Native Americans, most of
  all on their set-aside lands; not a tribal chief and not a soldier.
examples:
- The Indian agent worked with the tribe on behalf of the government.
- An Indian agent lived on the reservation with the tribe.
