simpleMeaning: used to say that a thing has a neck, and to say what sort of neck it has
scope: This is having a neck, or having a neck of the kind named; not said of things with no neck at all.
examples:
- The long-necked bird stood in the shallow water.
- He chose a short-necked bottle for the shelf.
