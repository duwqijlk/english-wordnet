simpleMeaning: Wetting one lock of hair and winding it round makes a ring, held in place with a small
  clip or a flat metal hair grip.
scope: It is a ring of hair made by wetting one lock, winding it round, and holding it in place with a
  small clip or a flat metal hair grip, not a ring the hair makes on its own.
examples:
- She wound one damp lock round and held it with a small clip to make a pin curl.
- The pin curl kept its shape after the clip came out.
