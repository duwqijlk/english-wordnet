simpleMeaning: a sleeveless garment that floats or fills with air to keep its wearer from sinking in water
scope: A sleeveless floating garment; also called a life jacket or a cork jacket, not a floating belt
  and not a ring thrown to a swimmer.
examples:
- He wore a life vest while he fished from the small boat.
- The life vest kept her head above the water.
