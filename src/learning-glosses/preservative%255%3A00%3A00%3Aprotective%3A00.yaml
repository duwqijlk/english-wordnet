simpleMeaning: that helps keep something safe and stops it from going bad or being lost
scope: This describes something that keeps things safe. It is not the chemical stuff that is put into
  food or other things to stop them going bad.
examples:
- Use a preservative treatment on the wood to stop it rotting.
- The museum uses preservative methods to keep old papers safe.
