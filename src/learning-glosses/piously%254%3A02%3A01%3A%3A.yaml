simpleMeaning: in a way that shows deep, honest belief in and respect for God and religion
scope: 'Also called devoutly: this means in a way that shows deep, true belief in God; it is not about
  seeming holy while acting in a false or proud way.'
examples:
- She prayed piously every morning before the sun came up.
- He piously closed his eyes and bowed his head in church.
