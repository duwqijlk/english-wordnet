simpleMeaning: A gate of iron or wood bars that hangs at the door of a castle or walled town and can be
  dropped to shut the way.
scope: A gate of iron or wood bars that hangs at a castle or walled town door and can be dropped to shut
  the way, not an ordinary door or a drawbridge.
examples:
- The portcullis crashed down as the riders reached the gate.
- Guards raised the portcullis to let the carts pass.
