simpleMeaning: the act of saying officially that someone or something is as good as it must be, or giving
  someone the right to run a business under a company's name
scope: This is the act of saying officially that someone or something is as good as it must be, or of
  giving a business right; it is not the paper itself that shows the proof.
examples:
- The certification of the new pilots was carried out by the flight office.
- Certification of the shop to sell food under the company's name took three months.
