senseId: 'vowel_rhyme%1:10:00::'
synsetId: 07112012-n
simpleMeaning: the repeat of similar sounds made with the mouth open, in the stressed parts of words that
  come one after another
scope: 'Also called assonance: the repeat of like vowel sounds in the stressed parts of words that follow
  each other, not a full rhyme of word ends and not the same sound at the start of words.'
examples:
- The vowel rhyme in 'fleet' and 'beast' links the two words.
- Poets use vowel rhyme to tie lines together.
