simpleMeaning: In a way that shows one does not trust the person or thing in front of one.
scope: Used for a look or answer given to a stranger one does not trust.
examples:
- She looked at him distrustfully, unsure whether to believe him.
- He answered distrustfully, keeping his distance from the stranger.
