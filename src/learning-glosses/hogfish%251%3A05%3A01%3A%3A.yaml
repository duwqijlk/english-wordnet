simpleMeaning: A big sea animal of the west Atlantic; the male's head looks like a pig's nose.
scope: A big sea animal of the west Atlantic whose males have a head like a pig's nose, not a grouper
  and not a wrasse of another kind; also called a hog snapper.
examples:
- The hogfish swims in the warm west Atlantic.
- The male hogfish has a head like a pig's snout.
