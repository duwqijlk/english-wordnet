simpleMeaning: One of the two main parts of a sentence, the part that holds the verb and what goes with
  it.
scope: One of the two main parts of a sentence, the part holding the verb and what goes with it, not what
  is said of a subject in logic and not the verb senses of stating or making a predicate.
examples:
- In 'the dog barked', the predicate is 'barked'.
- The teacher asked us to find the predicate in each sentence.
