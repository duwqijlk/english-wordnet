simpleMeaning: work made by hand with thread and a needle with a hook at the end, where loops of thread
  lock together
scope: This sense is the work or cloth itself, also called crocheting, not the act of making it.
examples:
- She showed me a piece of crochet she had made as a table cover.
- His grandmother's crochet lay over the back of the chair.
