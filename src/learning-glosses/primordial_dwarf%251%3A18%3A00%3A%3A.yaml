senseId: 'primordial_dwarf%1:18:00::'
synsetId: 10492032-n
simpleMeaning: a very small person whose size comes from a fault in the body passed down in the family,
  while body parts, mind, and sexual development stay as they should be
scope: Also called hypoplastic dwarf, normal dwarf, and true dwarf, this is a very small person whose
  size comes from a fault passed down in the family, not a small person with short limbs and not a small
  person whose mind grows in a different way.
examples:
- The doctor said the primordial dwarf would grow up with a small body but a mind like other children.
- A primordial dwarf may be very small, yet grow into adult life in the usual way.
