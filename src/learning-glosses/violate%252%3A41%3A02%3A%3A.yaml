simpleMeaning: To treat a holy place, or holy words, with disrespect
scope: Treating a holy place or holy words with disrespect, not breaking a law, not ruining a place, and
  not failing to match a pattern.
examples:
- They violated the church by using it as a store.
- He violated the holy name in his angry words.
