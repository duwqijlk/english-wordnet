simpleMeaning: A bag of cloth or leather for carrying birds and other animals killed by a hunter.
scope: This is a bag for carrying birds and other animals killed by a hunter; not a pocket in a hunting
  coat, and not a cart for carrying them.
examples:
- He put the birds in his gamebag and walked home.
- Her gamebag was made of strong leather.
