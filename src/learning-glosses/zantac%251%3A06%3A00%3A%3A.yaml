simpleMeaning: A drug that blocks histamine and calms stomach acid, used to treat peptic ulcers, gastritis
  and the flow of stomach acid back up the food pipe
scope: Also called ranitidine; a stomach-acid drug used for peptic ulcers, gastritis and acid flowing
  back up the food pipe.
examples:
- The doctor gave him Zantac for his ulcer.
- Zantac calmed the acid that flowed back up her food pipe.
