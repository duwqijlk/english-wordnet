simpleMeaning: A rare sickness present from birth, in which the blood has too few cells of all kinds and
  the marrow inside the bones is too small
scope: A rare sickness present from birth, in which the blood has too few cells of all kinds and the marrow
  inside the bones is too small; congenital pancytopenia and Fanconi's anaemia are other names for it,
  not a sickness caught later in life and not a sickness of one kind of blood cell only.
examples:
- Fanconi's anemia is present from birth.
- A child with Fanconi's anemia has too few blood cells.
