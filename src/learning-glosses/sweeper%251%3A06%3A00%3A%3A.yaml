simpleMeaning: A cleaning tool with brushes that turn and pick up dirt as you push it over a carpet
scope: This cleaning tool is also called carpet sweeper; it is not a worker who cleans floors and not
  the small sea fish with the same name.
examples:
- She pushed the sweeper across the carpet to pick up the crumbs.
- The old sweeper's brushes turned as it moved over the rug.
