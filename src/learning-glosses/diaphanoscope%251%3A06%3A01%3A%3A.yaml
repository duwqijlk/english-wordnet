simpleMeaning: The walls of a hollow place in the body are judged by how much light they let through when
  a tool shines light inside it
scope: It lights a hollow place from inside so its walls can be judged.
examples:
- The diaphanoscope lit up the inside of the sinus.
- Doctors used a diaphanoscope to check the walls of the cavity.
