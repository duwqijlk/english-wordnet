simpleMeaning: in a way that is full of unhappiness and suffering
scope: In a way full of unhappiness and suffering; not the use that means very badly, as in failing a
  test.
examples:
- He sat miserably in the rain, wishing he could go home.
- She looked at the empty house and sighed miserably.
