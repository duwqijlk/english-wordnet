simpleMeaning: a state of less excitement or worry, brought about by a drug that makes a person calm
scope: This is the calm state after such a drug is given, not the act of giving the drug itself.
examples:
- Sedation kept the patient calm during the treatment.
- He woke slowly as the sedation wore off and his worry came back.
