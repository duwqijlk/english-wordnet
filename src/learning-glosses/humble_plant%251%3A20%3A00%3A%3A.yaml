simpleMeaning: A spreading or half-upright shrub of tropical America and Australia, armed with many backward-curving
  thorns; its sensitive soft grey-green leaflets fold and droop at night or when touched or cooled.
scope: This is the same thorny, touch-sensitive shrub as action plant, not a different species or a herbal
  remedy.
examples:
- The humble plant droops its leaves at night and when someone brushes against it.
- Children on the island delight in touching the humble plant and watching it fold up.
