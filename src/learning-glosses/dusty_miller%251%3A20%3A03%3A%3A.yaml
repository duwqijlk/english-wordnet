simpleMeaning: a stiff, much-branched plant that lives for years in the Mediterranean, with very white
  woolly stems and leaves
scope: A stiff, much-branched plant of the Mediterranean with very white woolly stems and leaves, not
  the garden plant with showy red flowers and not the Canary Islands plant with white flowers.
examples:
- The dusty miller in the border had silvery white leaves.
- Dusty miller grows well in dry, sunny soil.
