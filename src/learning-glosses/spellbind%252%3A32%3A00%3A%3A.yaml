simpleMeaning: To hold a person fast with a pull like a magnet's.
scope: To hold a person fast with a pull like a magnet's; also called bewitch, mesmerize, magnetize, or
  mesmerise; not to make one still, as with a fixed stare or by fear or wonder.
examples:
- Their voice did spellbind the crowd.
- The singer came to spellbind the hall.
