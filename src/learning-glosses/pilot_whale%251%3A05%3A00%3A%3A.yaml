simpleMeaning: A small dark sea animal of the Atlantic coast of the United States, whose biggest male
  leads the group.
scope: This is a small dark sea animal of the Atlantic coast of the United States, whose biggest male
  leads the group; black whale, blackfish and common blackfish are other names for this sense, not a great
  whale of the open sea and not a sea animal that swims alone.
examples:
- A pilot whale led the school along the coast.
- Pilot whales swam off the Atlantic coast.
