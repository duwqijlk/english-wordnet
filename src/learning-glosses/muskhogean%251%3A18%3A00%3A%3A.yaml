simpleMeaning: A person of any of the peoples who once lived in the south-east of the United States and
  spoke the tongues of that name.
scope: 'Also called Muskogean: a person of any of the peoples who once lived in the south-east of the
  United States and spoke the tongues of that name, not the tongues themselves.'
examples:
- A Muskhogean elder told of the old towns in the south-east.
- The Muskhogean peoples once lived across the south-east.
