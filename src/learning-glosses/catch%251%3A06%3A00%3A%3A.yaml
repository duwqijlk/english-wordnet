senseId: 'catch%1:06:00::'
synsetId: 02986054-n
simpleMeaning: A part attached to a door or window that keeps it shut and secure.
scope: This is the part attached to a door or window that holds it shut; it is not a separate wedge or
  stop that limits how far a moving part travels, not the act of trapping an animal in a snare or trap,
  not catching a fleeing person after a chase, not noticing a mistake or slip, and not grabbing a moving
  object to stop it.
examples:
- He lifted the catch and pushed the window open.
- The gate kept swinging open because the catch was broken.
