schema: oewn-learning-gloss-v2
senseId: 'daunt%2:37:00::'
synsetId: 01789567-v
simpleMeaning: to fill a person with fear at what lies ahead, so they give up the plan they had in mind
  and turn away
scope: 'Also called scare and dash: to make a person lose heart and turn back, not to make them angry
  and not to stop them by force.'
examples:
- She was daunted by the size of the task.
- The steep climb daunted the young walkers.
