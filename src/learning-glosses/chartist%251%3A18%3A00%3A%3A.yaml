simpleMeaning: a person who studies the stock market and tries to guess where prices will go from graphs
  of recent share prices
scope: A person who reads graphs of recent share prices to guess where the market will go; technical analyst
  is another name for this sense, not a person who buys and sells shares for others.
examples:
- The chartist predicted a fall after studying the graphs.
- A chartist looks for patterns in past prices.
