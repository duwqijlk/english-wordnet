simpleMeaning: caused by a mind that is not well, or showing that a mind is not well
scope: About the mind being ill; not about the body being ill with a disease, and not about the study
  of disease.
examples:
- He had a pathological fear of leaving his house.
- She told pathological lies even when the truth would help her.
