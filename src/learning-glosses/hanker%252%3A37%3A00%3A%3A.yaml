senseId: 'hanker%2:37:00::'
synsetId: 01832347-v
simpleMeaning: to want something very much and keep wanting it
scope: Also called long and yearn, this is wanting something strongly and for a long time, not just wanting
  it a little or for a short time.
examples:
- After years in the city, he hankered for a quiet life in the country.
- She still hankers after the job she lost last year.
