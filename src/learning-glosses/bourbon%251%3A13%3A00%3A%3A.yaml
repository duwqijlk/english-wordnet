simpleMeaning: a whiskey made by heating and cooling a mix of corn, malt and rye, then kept for a long
  time in oak barrels that are burned inside
scope: This is the strong drink made from corn, malt and rye and kept in burned oak barrels, not any other
  kind of whiskey.
examples:
- He poured a small glass of bourbon after dinner.
- The bourbon had sat for years in a burned oak barrel.
