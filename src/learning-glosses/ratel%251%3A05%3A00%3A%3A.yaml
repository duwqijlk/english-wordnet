simpleMeaning: In the woods of Africa and southern Asia lives a meat-eating animal much like a badger,
  which comes out at night.
scope: Also called a honey badger, this is the badger-like meat-eater of the woods of Africa and southern
  Asia that comes out at night.
examples:
- The ratel came out of the woods after dark.
- A ratel lives in the woods of southern Asia and comes out at night.
