simpleMeaning: the ruler of a country, most often a king or queen whose place passes down in the family
scope: The ruler of a country, usually by birthright, not a president chosen by vote and not a rich and
  powerful person in general.
examples:
- The sovereign opened the new session of parliament.
- As sovereign, she had the final word on the treaty.
