simpleMeaning: a person who spreads messages that are planned to help a cause or a government
scope: This is a person who spreads such messages; it is not the describing sense for things linked to
  spreading messages to help a cause.
examples:
- He worked as a propagandist for the government.
- The propagandist wrote leaflets to win support for the cause.
