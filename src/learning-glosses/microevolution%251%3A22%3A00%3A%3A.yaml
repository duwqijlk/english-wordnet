simpleMeaning: A new kind of living thing can come about from small, set changes in what parents pass
  to their young
scope: Small changes in living things that can make a new kind, not big changes over long ages and not
  a change in one animal alone.
examples:
- Microevolution in the finches made their beaks fit new seeds over a few years.
- The study of microevolution showed how small gene changes built up in the mice.
