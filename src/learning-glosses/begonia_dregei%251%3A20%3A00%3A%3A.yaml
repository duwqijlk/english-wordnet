simpleMeaning: A South African plant with swollen underground stems, full or half, and egg-shaped leaves
  with shallow cuts and small white flowers.
scope: A South African plant with swollen underground stems, also called grape-leaf begonia and maple-leaf
  begonia; set apart from other plants with swollen underground stems and from other South African plants
  with white flowers.
examples:
- Begonia dregei has small white flowers and egg-shaped leaves.
- She grows Begonia dregei in a pot on the window sill.
