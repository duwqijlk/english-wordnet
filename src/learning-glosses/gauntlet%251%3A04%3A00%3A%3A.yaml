simpleMeaning: a punishment in which a person is made to run between two lines of men facing each other,
  who beat the person with clubs or whips
scope: A punishment of running between two lines of men who beat you, not a glove of armored leather.
examples:
- The soldier was made to run the gauntlet as punishment.
- He survived the gauntlet with bruises all over his back.
