simpleMeaning: showing clear thinking and good sense when you decide or act
scope: About clear thinking and good sense in a person or choice; it is close to the other reasonable
  sense, but this one does not stress having a good reason behind it.
examples:
- A reasonable person thinks clearly before making a choice.
- It was a reasonable decision, made with care and good sense.
