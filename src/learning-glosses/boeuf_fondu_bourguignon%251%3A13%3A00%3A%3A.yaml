simpleMeaning: Dipped in tasty sauces of many kinds, small cubes of meat first cook in hot oil.
scope: This dish of small cubes of meat cooked in hot oil and dipped in sauces is also called beef fondue.
examples:
- They dipped each cube of boeuf fondu bourguignon into a sauce.
- We served boeuf fondu bourguignon with tasty sauces.
