simpleMeaning: a stretch of rough water in a river or the sea, made when one flow of water runs into or
  across another
scope: Rough water where two flows meet, not the act of tearing a thing apart and not strong words of
  blame.
examples:
- The boat crossed a rip where the river met the sea.
- Swimmers were warned about the rip near the rocks.
