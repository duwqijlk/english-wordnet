simpleMeaning: A medium-sized tree of southern Europe with two needles to a bunch and a spreading crown,
  widely grown for its sweet seeds, much like almonds.
scope: Also called stone pine, umbrella pine, and European nut pine; not a shrub.
examples:
- The Pinus pinea shaded the garden with its spreading crown.
- We gathered sweet seeds from the Pinus pinea.
