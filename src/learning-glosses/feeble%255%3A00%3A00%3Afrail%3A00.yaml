simpleMeaning: not strong in the body or in the muscles, and with little life or energy
scope: 'Also called weak, weakly and rickety: not strong in body. This is not the sense about a thing
  that has little force or does not work well.'
examples:
- After the illness, the old man was too feeble to lift the box.
- Her feeble arms could not hold the heavy bag for long.
