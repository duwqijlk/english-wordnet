simpleMeaning: A big piece of white cloth that men and women in northern Africa wear over their clothes.
scope: This is a large white cloth worn as an outer cover in northern Africa, not a coat or a robe; also
  called haick.
examples:
- He wrapped the haik around his shoulders.
- The haik kept the dust off her clothes.
