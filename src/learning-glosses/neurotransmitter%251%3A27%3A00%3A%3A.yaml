senseId: 'neurotransmitter%1:27:00::'
synsetId: 14831728-n
simpleMeaning: a chemical made by the body that carries messages between nerve cells, across the small
  gap where they meet
scope: A body chemical that carries messages between nerve cells, not a nerve cell itself and not a chemical
  that travels through the blood.
examples:
- Serotonin is a neurotransmitter that can affect how a person feels.
- The drug changes the amount of a neurotransmitter in the brain.
