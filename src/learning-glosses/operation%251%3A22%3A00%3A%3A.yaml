simpleMeaning: In computer science, the handling of data where a fixed rule fully determines the outcome,
  such as what one single instruction produces.
scope: Computer-science data handling in which a rule fixes every result - not arithmetic calculation,
  not the practical steps of a job, not the way a machine performs, not a medical procedure, not a military
  action, not a business, not a planned group activity, not a mental act, not the running of a machine,
  and not the state of being in force.
examples:
- Modern processors can carry out billions of operations every second.
- Each operation in the program follows a fixed rule, so the same input always gives the same output.
