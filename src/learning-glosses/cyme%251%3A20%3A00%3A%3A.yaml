simpleMeaning: A bunch of flowers, more or less flat on top, in which the flower at the tip or in the
  middle opens before the rest.
scope: This is a flat-topped bunch of flowers whose middle flower opens first, not a bunch whose flowers
  open from the bottom up or a single flower.
examples:
- The cyme on this plant opens its middle flower first.
- Gardeners know a cyme by its flat top and early middle flower.
