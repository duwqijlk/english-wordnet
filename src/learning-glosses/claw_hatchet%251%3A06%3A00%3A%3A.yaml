simpleMeaning: a small axe with a split end for pulling nails out
scope: A small axe with a split end for pulling nails out; not a plain axe and not a claw hammer, which
  is a tool for hitting nails.
examples:
- He used the claw hatchet to chop the branch and pull out the old nail.
- The claw hatchet's split end pulled the nail out of the old fence post.
