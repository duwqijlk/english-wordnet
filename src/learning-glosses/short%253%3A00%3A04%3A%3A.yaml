simpleMeaning: Sounds or syllables that take relatively little time to say.
scope: This describes a speech sound or syllable, not an event lasting a brief time, not an object of
  little length, not a person of low height, not a financial position, not a shortage, not a rude manner,
  and not a baseball position or electrical fault.
examples:
- Latin marks short vowels with a breve.
- The vowel sound in 'sit' is short.
