simpleMeaning: An old word for the part of sound study that dealt with the right way to say words and
  how saying them fits the way they are spelled
scope: An old word for the part of sound study about the right way to say words and how saying them fits
  the way they are spelled, not the study of word meanings and not a guide to handwriting.
examples:
- Orthoepy was once the name for the study of the right way to say words.
- The old book on orthoepy dealt with speech and spelling both.
