simpleMeaning: the act of giving comfort to someone who is suffering, so their pain feels less
scope: This is the act of giving comfort to someone who suffers, and comfort and solace are other names
  for it, not the good feeling itself and not a prize for losing.
examples:
- Her presence was a consolation to him in his grief.
- He offered words of consolation to the widow.
