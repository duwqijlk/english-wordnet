simpleMeaning: a man who works as a police officer, rides a two-wheeled machine, and checks how fast drivers
  go
scope: A male police officer on a motorcycle who checks drivers' speed; not the general motorcycle cop
  and not a motorcycle policewoman.
examples:
- The motorcycle policeman waved the speeding car to the side of the road.
- A motorcycle policeman stopped the truck and checked its speed.
