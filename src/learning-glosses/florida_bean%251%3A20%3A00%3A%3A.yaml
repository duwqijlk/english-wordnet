simpleMeaning: A one-year woody vine from Asia with long clusters of purple flowers and pods covered in
  thick hairs, grown in the southern United States as green manure and for grazing.
scope: Also called cowage, velvet bean, Bengal bean, Benghal bean, Mucuna aterrima, Mucuna deeringiana,
  Mucuna pruriens utilis, and Stizolobium deeringiana; a vine grown for feed and soil, not a garden bean
  for eating.
examples:
- The Florida bean grows well in warm fields.
- Farmers plant Florida bean to feed the soil.
