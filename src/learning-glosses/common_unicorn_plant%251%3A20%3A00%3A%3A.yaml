simpleMeaning: Large whitish or yellowish flowers marked with purple and a long curving beak grow on a
  plant that lives one year, from the south of the United States to Mexico.
scope: Also called common devil's claw, devil's claw, elephant-tusk, proboscis flower and ram's horn,
  this is the plant of the south of the United States to Mexico with large whitish or yellowish purple-marked
  flowers and a long curving beak.
examples:
- The common unicorn plant had a long curving beak.
- A common unicorn plant grew whitish flowers marked with purple.
