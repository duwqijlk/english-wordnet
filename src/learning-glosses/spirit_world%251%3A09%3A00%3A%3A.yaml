simpleMeaning: Demons, fairies, angels, and the like live in any such made-up place.
scope: It names a place that exists only in stories, where demons, fairies, angels, and the like live.
examples:
- In the story, the spirit world was full of fairies and angels.
- Science has emptied the spirit world of its former inhabitants.
