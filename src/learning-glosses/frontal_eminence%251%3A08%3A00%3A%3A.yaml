simpleMeaning: the bone of the forehead has a raised bump above each eye, one on each side
scope: A raised bump on the bone of the forehead above an eye, not the part of the brain behind the forehead
  and not the whole forehead bone.
examples:
- The frontal eminence forms a slight bump above each eye.
- You can feel the frontal eminence on the forehead just above the eye socket.
