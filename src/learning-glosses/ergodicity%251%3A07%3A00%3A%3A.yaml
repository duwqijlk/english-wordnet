senseId: 'ergodicity%1:07:00::'
synsetId: 04778774-n
simpleMeaning: 'A mark of systems that work by chance: as a rule, such a system tends toward a set end
  state that does not depend on how it started'
scope: A mark of chance-based systems; not a system that keeps its start state, and not a system ruled
  by fixed laws.
examples:
- The ergodicity of the model means its end state does not depend on the start.
- Ergodicity lets the long-run result be worked out without the first steps.
