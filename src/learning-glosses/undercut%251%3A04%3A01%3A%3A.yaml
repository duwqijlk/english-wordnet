simpleMeaning: a cut made under a thing to take away part of it
scope: This is the cut itself, made under a thing. It is not the part taken away by the cut, not a piece
  of meat, and not a hit in sport.
examples:
- The worker made an undercut in the wood so the top part would stand out.
- A deep undercut under the rock face made it hang over the path.
