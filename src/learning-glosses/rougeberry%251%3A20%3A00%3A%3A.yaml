simpleMeaning: a bushy indoor plant with flowers from white to pale pink, followed by clusters of scarlet
  berries; it comes from the warm Americas
scope: Also called a rouge plant, a blood berry, and a bloodberry; a bushy houseplant with pink flowers
  and red berries, not a shrub grown for its fruit and not a rose.
examples:
- The rougeberry grew in a pot by the door.
- Rougeberry berries turned bright red after the flowers faded.
