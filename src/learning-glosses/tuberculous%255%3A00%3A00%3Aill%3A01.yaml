simpleMeaning: made up of, or sick with, or caused by tuberculosis or by the germ that causes it
scope: Made up of, or sick with, or caused by tuberculosis or by the germ that causes it; tubercular is
  another name for this sense, not a word for any illness and not a word for a healthy person.
examples:
- The tuberculous child was sent to a hospital for care.
- Tuberculous patients stayed in the ward for many weeks.
