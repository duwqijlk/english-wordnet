simpleMeaning: An infection usually passed on through sex, caused by a virus called HSV-2; it brings repeated
  bouts of painful sores on the skin and mucous membranes around the sex organs.
scope: Another name for genital herpes, the recurring infection of the sex organs, not the cold-sore form.
examples:
- Herpes genitalis often causes repeated outbreaks of painful sores.
- Doctors treat herpes genitalis with antiviral drugs.
