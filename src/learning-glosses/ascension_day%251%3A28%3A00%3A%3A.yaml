simpleMeaning: In Christianity, the feast that marks Christ rising into heaven, kept on the fortieth day
  after Easter
scope: This is the Christian feast of Christ rising into heaven, not Easter itself and not Christmas;
  Ascension and Ascension of the Lord are other names for this sense.
examples:
- Ascension Day falls forty days after Easter.
- We went to church on Ascension Day.
