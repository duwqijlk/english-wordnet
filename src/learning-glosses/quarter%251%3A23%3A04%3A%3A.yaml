simpleMeaning: a unit of weight equal to 28 pounds, one fourth of a hundredweight
scope: This is the 28-pound British measure of weight, not the 25-pound US one and not a general fourth
  of something.
examples:
- Grain was sold by the quarter in the old markets.
- The merchant weighed out a quarter of wool, twenty-eight pounds exactly.
