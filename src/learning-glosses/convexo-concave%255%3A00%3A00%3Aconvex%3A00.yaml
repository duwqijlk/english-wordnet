simpleMeaning: curved out on one side and curved in on the other, with the outward curve deeper than the
  inward curve
scope: This is a shape curved out on one side and in on the other, not curved the same way on both sides.
examples:
- The lens was convexo-concave, bulging out on one face and dipping in on the other.
- He held up the convexo-concave glass to show its two curves.
