simpleMeaning: To keep teasing or mocking someone with unkind comments.
scope: This is about tormenting someone with constant criticism, not about sitting on a horse or vehicle,
  and not the clutch-pedal sense.
examples:
- The coach kept riding the players about their sloppy passes.
- My boss rides me every time a report is late.
