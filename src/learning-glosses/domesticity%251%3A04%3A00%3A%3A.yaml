simpleMeaning: life at home and the work and other things people do at home
scope: This is life at home and the things done there, not the quality of being tame or of being suited
  to home life.
examples:
- After years of travelling for work, he came to enjoy domesticity and quiet evenings at home.
- Their domesticity centred on cooking together and keeping the house clean and warm.
