simpleMeaning: Tiny germs from animals people keep can bring on a sickness that turns the skin yellow
  and gives a high temperature.
scope: Leptospirosis is another name for it, a sickness caught from animals people keep, marked by yellow
  skin and a high temperature.
examples:
- Animals people keep can pass on swamp fever.
- Yellow skin and a high temperature came with swamp fever.
