senseId: 'light_filter%1:06:00::'
synsetId: 03672386-n
simpleMeaning: A clear thing set in the path of the rays that lets less of them through, or less of some
  of their colours
scope: Diffusing screen is another name for this clear thing that lets less of the rays through; it is
  not a mirror and not a thing that stops the rays wholly.
examples:
- The light filter softened the glare from the window.
- He fitted a light filter over the camera lens.
