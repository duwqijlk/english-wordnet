simpleMeaning: a common fish of the southwest Pacific, of a grey colour tinged with blue, caught for sport
  and eaten as food
scope: 'Also called blue pointed: a common fish of the southwest Pacific, not a big ocean shark and not
  a freshwater fish.'
examples:
- The bonito shark is common in the southwest Pacific.
- Fishermen catch the bonito shark for sport and for food.
