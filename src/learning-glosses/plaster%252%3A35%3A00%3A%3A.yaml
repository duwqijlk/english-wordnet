senseId: 'plaster%2:35:00::'
synsetId: 01363602-v
simpleMeaning: to cover a wall or other surface with a soft mix that gets hard as it dries
scope: This sense is covering a wall with the soft wall mix, not the mix itself, not a cover for a wound,
  and not a hard cover for a broken bone.
examples:
- Workers plastered the kitchen wall before painting it.
- He plastered the old wall to make it smooth.
