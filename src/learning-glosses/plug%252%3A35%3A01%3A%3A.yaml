simpleMeaning: to fill a hole tight or close it tight, with a stopper or as if with one
scope: 'Also called secure: filling or closing a hole tight, not the part that goes into an electrical
  socket, and not praising a product to help sell it.'
examples:
- He plugged the hole in the pipe with a piece of wood.
- She plugged the leak with an old cloth until the plumber came.
