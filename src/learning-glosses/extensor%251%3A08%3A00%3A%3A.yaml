simpleMeaning: A muscle joined to bone whose tightening straightens or stretches a part of the body.
scope: A muscle joined to bone whose tightening straightens a part of the body; also called an extensor
  muscle, not a muscle that bends a joint and not a muscle that moves the whole body.
examples:
- The extensor in his forearm straightened his fingers.
- An extensor pulls the leg straight at the knee.
