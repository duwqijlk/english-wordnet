simpleMeaning: The fatty matter carried in low-density lipoproteins, the 'bad' kind of it, of which a
  high level in the blood is thought to be linked to many illnesses.
scope: It is the 'bad' kind of blood fat, not the 'good' kind and not all blood fat together.
examples:
- Her LDL cholesterol was high.
- LDL cholesterol is called the 'bad' cholesterol.
