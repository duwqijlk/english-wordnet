simpleMeaning: to speak in short, breathless bursts, as when out of breath
scope: Speaking in short, breathless bursts, not the noisy breathing of exhaustion or the noun for one
  quick breath.
examples:
- '"Wait for me," she panted as she ran to catch up.'
- He panted out the news before collapsing into a chair.
