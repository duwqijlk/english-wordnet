simpleMeaning: When a picture is cut down into stone or a gem, it sits below the surface instead of standing
  out like a cameo; that cutting is an art.
scope: Also called diaglyph, this is a picture cut down into stone or a gem, not a raised carving like
  a cameo and not a way of printing.
examples:
- The seal was an intaglio cut deep into the stone.
- She wore a ring with an intaglio of a horse.
