simpleMeaning: extra strong stress put on a word or sound, even when the usual rules of speech would not
  stress it
scope: Extra strong stress on a word or sound for effect, not the stress the rules of speech give and
  not loudness for its own sake.
examples:
- The speaker used a rhetorical accent on the word 'never' to drive it home.
- By putting a rhetorical accent on the last word, she made the question clear.
