simpleMeaning: ground that stays frozen all the time
scope: This is ground that stays frozen all the time, even in summer. It is not snow on top of the ground,
  which melts when the weather gets warm.
examples:
- The road was built on permafrost in the far north.
- Permafrost covers a large part of this cold land.
