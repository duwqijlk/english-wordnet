simpleMeaning: shown in a drawing, in a plan or pattern, or in lines
scope: This is shown in a drawing, a plan or lines, and pictured and portrayed are other names for it,
  not told in words, and not acted out on stage.
examples:
- The map depicted the old town in fine detail.
- The scene depicted in the painting shows a busy market.
