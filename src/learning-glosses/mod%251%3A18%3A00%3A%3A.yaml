simpleMeaning: a British teenager or young adult in the 1960s who cared a lot about clothes and was against
  the rockers, a rival group of young people
scope: This is the young British person of the 1960s who cared a lot about clothes; not a rocker, the
  rival group, and not just any young person who likes new clothes.
examples:
- As a mod, he spent much of his pay on new clothes.
- The mods and the rockers often argued in the streets.
