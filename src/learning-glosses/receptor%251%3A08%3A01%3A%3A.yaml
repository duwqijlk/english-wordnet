simpleMeaning: A tiny part in a cell, thought to be there, that links a chemical acting on nerve tissue
  with the body's answer to it
scope: This sense is the tiny part in a cell that links a chemical to the body's answer, not the body
  part, such as an eye or ear, that picks up light or sound.
examples:
- A drug can block a receptor in a cell and stop the body from answering the chemical.
- Scientists think this receptor is in the cell, linking the chemical that acts on nerve tissue with the
  body's answer.
