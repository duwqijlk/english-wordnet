simpleMeaning: A plant from South America trails along the ground and is grown by many people; its round
  leaves join their stalks at the middle, and its blooms are pink-red.
scope: Also called ivy geranium and ivy-leaved geranium, this plant trails and bears pink-red blooms.
examples:
- The hanging geranium trailed down, its pink-red blooms showing among the leaves.
- She grew a hanging geranium with pink-red blooms.
