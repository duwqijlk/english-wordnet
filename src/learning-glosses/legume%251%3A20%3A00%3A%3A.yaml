simpleMeaning: a bean or pea plant that stands straight up or climbs, in the plant family called Leguminosae
  (the bean and pea family)
scope: 'Also called leguminous plant: this is the whole bean or pea plant, not the case that holds its
  seeds and not the seeds or fruit.'
examples:
- The bean plant in his field is a legume that climbs up a stick.
- A pea legume can stand straight up in the garden without help.
