simpleMeaning: to make someone notice and feel things that they did not notice before
scope: To make someone notice and feel things they did not notice before; sensibilise, sensibilize, sensify
  and sensitize are other names for this act, not causing a thing to sense light and not making a person
  react to a drug.
examples:
- The visit sensitised her to their needs.
- He was not sensitised to her feelings.
