simpleMeaning: a flat food made from thin liquid dough, fried on both sides on a hot plate
scope: A flat food fried on both sides on a hot plate, also called pancake, flapjack, hotcake, flannel-cake,
  flannel cake, flapcake, griddlecake and hot cake; not a waffle and not a crumpet.
examples:
- She flipped the battercake on the griddle.
- We ate battercakes with syrup for breakfast.
