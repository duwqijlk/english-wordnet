simpleMeaning: a sexual relationship that is usually kept hidden or not allowed
scope: 'Also called affair, involvement, intimacy, amour, and affaire: this is a sexual relationship that
  is usually hidden or not allowed, not a link between groups and not a person who helps groups work together.'
examples:
- Their liaison was kept secret for years.
- He had a liaison with a married woman.
