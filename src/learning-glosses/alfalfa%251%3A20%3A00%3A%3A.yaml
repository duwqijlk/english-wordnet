scope: 'Also called lucerne: the plant growing in the field, with leaves in groups of three and blue-purple
  flowers; not just the cut crop used as hay or animal food.'
examples:
- The farmer planted alfalfa in the big field this spring.
- Alfalfa grows well here, and its blue-purple flowers cover the field in summer.
