simpleMeaning: Borrowed money pays for taking over a firm, and the firm's goods most often stand as a
  pledge for the loan
scope: A firm taken over with borrowed money, with its goods as a pledge for the loan, not a buy with
  cash and not a loan for new stock.
examples:
- The leveraged buyout left the firm deep in debt.
- Managers planned a leveraged buyout of the small firm.
