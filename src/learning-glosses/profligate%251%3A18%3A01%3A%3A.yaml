simpleMeaning: One who uses up money and goods without restraint, heedless of what is left.
scope: Also called a prodigal, one who uses up money and goods without restraint; not the adjective use
  for living without regard for rules or morals.
examples:
- The profligate threw money away on parties and horses.
- No one would lend to the profligate after the fortune was gone.
