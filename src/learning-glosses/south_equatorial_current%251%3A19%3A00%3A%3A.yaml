simpleMeaning: A flow of water that moves west across the Pacific just below the middle line of the earth
scope: This is a flow of water across the Pacific just below the middle line of the earth, not other flows
  of the Pacific and not the flow just above the middle line.
examples:
- The South Equatorial Current flows west across the Pacific.
- Ships use the South Equatorial Current to cross the Pacific.
