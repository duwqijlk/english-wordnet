simpleMeaning: A branch of the Department of Transportation that watches over the shores and helps ships
  trade by sea
scope: A branch of the Department of Transportation that watches over the shores, also called the U. S.
  Coast Guard and the US Coast Guard; not the Navy and not a state police force.
examples:
- The United States Coast Guard rescued the sailors from the sinking boat.
- A United States Coast Guard cutter patrols the harbour mouth.
