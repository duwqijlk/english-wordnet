simpleMeaning: A gap that may open between the layers of the peritoneum, the lining of the belly, is the
  space inside the peritoneum
scope: 'Also called the greater peritoneal sac: the space inside the lining of the belly, between its
  layers, not the belly itself and not the gut inside it.'
examples:
- Fluid can collect in the peritoneal cavity.
- The peritoneal cavity lies between the layers of the belly lining.
