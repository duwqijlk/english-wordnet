simpleMeaning: In this clock, fine grains run through a narrow neck from one clear holder to another,
  and their flow shows the time.
scope: This clock shows time by fine grains falling through a narrow neck, where other clocks show it
  by hands moving round a face.
examples:
- She turned the sandglass over to start the grains running again.
- The sandglass showed that half the time had passed.
