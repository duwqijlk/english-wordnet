simpleMeaning: A strong guard wall set round a race track or down the middle of a two-way road, to cut
  the chance of bad crashes.
scope: A strong guard set round a racetrack or down the middle of a dual-lane highway, to cut the chance
  of severe accidents.
examples:
- Crash barriers guard race tracks.
- The crash barrier cuts the chance of crashes.
