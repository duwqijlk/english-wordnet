simpleMeaning: A cross between a plum tree (Prunus domestica) and an apricot tree (Prunus armeniaca)
scope: A cross between a plum tree and an apricot tree; plumcot tree is another name for this sense, and
  this is not a plum alone or an apricot alone.
examples:
- The plumcot is a cross between a plum and an apricot.
- She planted a plumcot in the garden.
