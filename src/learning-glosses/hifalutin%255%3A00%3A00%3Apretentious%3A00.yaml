senseId: hifalutin%5:00:00:pretentious:00
synsetId: 01856216-s
simpleMeaning: acting grand and fine in a put-on way, as if one were better than other people, proud and
  looking down on them
scope: This is proud, put-on fine behaviour; highfalutin, grandiose, highfaluting, hoity-toity and la-di-da
  are other names for this sense, not plain pride and not real good manners.
examples:
- His hifalutin talk about wine bored everyone at the table.
- She gave a hifalutin speech full of grand words nobody understood.
