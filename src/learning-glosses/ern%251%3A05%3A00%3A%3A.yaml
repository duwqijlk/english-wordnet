simpleMeaning: a big, heavy grey-brown eagle with a short white tail in the shape of a wedge, from Europe
  and Greenland
scope: 'Also called erne, gray sea eagle, grey sea eagle, and white-tailed sea eagle: this eagle is not
  other kinds of eagle.'
examples:
- We saw an ern flying over the coast in Greenland.
- The ern has a short white tail and wide wings.
