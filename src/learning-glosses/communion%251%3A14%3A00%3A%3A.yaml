simpleMeaning: In Christianity, a group of Christians who share the same Christian faith and take part
  in the same church acts (rites)
scope: This is a group of Christians with one shared belief and the same church acts, not the church act
  of sharing bread and wine and not a close sharing of thoughts.
examples:
- The two churches belong to the same communion.
- She joined a communion that shares her faith.
