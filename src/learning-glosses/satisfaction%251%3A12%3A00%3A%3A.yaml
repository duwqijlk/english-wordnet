simpleMeaning: The calm, glad feeling a person has when they get what they want or need, or when a thing
  they looked for comes about
scope: The glad feeling after getting what one wanted, needed, or looked for, not the act of meeting a
  need and not just being pleased.
examples:
- The chef tasted the sauce with great satisfaction and smiled.
- She felt deep satisfaction when her hard work paid off.
