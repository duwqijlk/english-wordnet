simpleMeaning: One of the Siouan-speaking people who once lived in eastern Wisconsin south of Green Bay,
  friends of the Menomini and foes of the Fox and Sauk peoples.
scope: One of the Siouan-speaking people of eastern Wisconsin, not the language they speak.
examples:
- The Winnebago lived south of Green Bay.
- A Winnebago elder told the story.
