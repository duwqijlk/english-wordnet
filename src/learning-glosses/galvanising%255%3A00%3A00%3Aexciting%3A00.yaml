simpleMeaning: full of strong feeling, as if a shock of power had run through you, and very exciting
scope: Also called electric, galvanic and galvanizing, this describes a thing that stirs strong feeling,
  not a thing that gives a real electric shock and not a thing that is merely loud.
examples:
- The galvanising speech left the whole crowd on its feet.
- Her galvanising words made the tired team want to start at once.
