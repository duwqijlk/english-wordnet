simpleMeaning: A thick long-lived mint from the Old World with flowers small and white or pale yellow
  and lemon-scented leaves, a garden escapee growing wild in north Europe and North America.
scope: Also called bee balm, garden balm, lemon balm, and sweet balm, a thick long-lived mint from the
  Old World with flowers small and white or pale yellow and lemon-scented leaves, a garden escapee growing
  wild in north Europe and North America, unlike the sense for a perennial aromatic herb of eastern North
  America having variously colored tubular flowers in dense showy heads.
examples:
- Beebalm has lemon-scented leaves.
- Beebalm grows in the north of Europe.
