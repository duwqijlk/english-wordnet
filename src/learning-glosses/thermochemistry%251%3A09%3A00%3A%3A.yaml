simpleMeaning: The part of chemistry that studies how heat is taken in or given out when chemicals act
scope: This is the part of chemistry that joins chemical change with heat; not the study of heat alone
  and not the study of chemical change alone.
examples:
- Thermochemistry studies how heat is taken in or given out in chemical change.
- She took a course in thermochemistry to learn about heat and chemical action.
