senseId: 'diagonal%1:25:01::'
synsetId: 13927331-n
simpleMeaning: In geometry, a straight line that joins two corners of a flat figure with straight sides
  that do not touch each other
scope: A line joining two corners of a shape that do not touch, not a line of squares on a board and not
  a cut across cloth.
examples:
- Draw a diagonal across the square to split it in two.
- The diagonal of the rectangle runs from one corner to the opposite one.
