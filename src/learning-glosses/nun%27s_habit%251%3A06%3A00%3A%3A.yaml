simpleMeaning: A long loose dress worn by women of a religious order in the home where they live as a
  group
scope: A long loose dress worn by women of a religious order in the home where they live as a group; not
  a dress for everyday wear, and not the dress of a priest.
examples:
- She wore a nun's habit in the convent.
- The nun's habit was black and reached to the ground.
