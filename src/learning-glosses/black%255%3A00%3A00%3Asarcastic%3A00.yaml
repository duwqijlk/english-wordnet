simpleMeaning: bitterly mocking, saying the opposite of what is meant, or suggesting something cruel and
  harmful.
scope: It describes words or jokes full of cruel mockery, not the colour or a dirty surface.
examples:
- The novel is a black comedy about death and disaster.
- His black humour made even the war seem absurd.
