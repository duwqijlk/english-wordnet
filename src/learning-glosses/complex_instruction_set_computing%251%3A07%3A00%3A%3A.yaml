scope: In the study of machines that work with numbers, a way of building a machine with very many orders
  built into its main chip; complex instruction set computer is another name for this sense, not a machine
  with few orders and not the chip on its own.
examples:
- Complex instruction set computing puts very many orders into the main chip.
- The firm uses complex instruction set computing in its new machines.
