simpleMeaning: a false outer look that makes something seem different from what it really is
scope: 'Also called camouflage: a false outer look that hides the true nature of a thing, not the act
  of hiding it and not clothes worn to hide who you are.'
examples:
- His kind smile was only a disguise, and inside he was angry.
- The quiet street was a disguise for the busy market behind the wall.
