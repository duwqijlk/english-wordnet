simpleMeaning: The act of baring one's private parts to draw eyes to them, in a way most people find shocking.
scope: Also called exhibitionism, the act of baring one's private parts to draw eyes to them, not the
  trait of being vain and full of oneself.
examples:
- The court heard a charge of immodesty against the man.
- His immodesty shocked the people in the square.
