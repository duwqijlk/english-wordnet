simpleMeaning: the fleshy part inside the mouth of certain animals, eaten as food.
scope: This is the food sense, an animal's mouth part cooked and eaten, not the body organ used for tasting
  and speaking, and not a language or way of speaking.
examples:
- The butcher sliced the tongue thinly for sandwiches.
- She simmered the tongue with onions and served it cold.
