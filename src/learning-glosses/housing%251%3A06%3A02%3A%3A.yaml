simpleMeaning: a decorated cloth covering that a horse wears, especially one worn by a warhorse in the
  past.
scope: This is decorative cloth for a horse, not a cover for a machine part or a building where people
  live.
examples:
- The knights' horses wore red and gold housings at the tournament.
- The tapestry shows a warhorse in embroidered housing.
