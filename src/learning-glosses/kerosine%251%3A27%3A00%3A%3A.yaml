simpleMeaning: An oil made from carbon and hydrogen that catches fire easily and is burned as fuel in
  lamps and heaters
scope: 'Also called kerosene, coal oil, or lamp oil: a fuel oil that burns in lamps and heaters, not petrol
  for cars and not cooking oil.'
examples:
- The lamp ran on kerosine all night.
- They filled the heater with kerosine before winter.
