simpleMeaning: Along the stomach's long curve there are two blood vessels, and this is one of them
scope: Also called a gastroepiploic vein, this is one of two blood vessels serving the long curve of the
  stomach, not the main vessel that feeds the stomach and not a vessel of the small gut.
examples:
- The surgeon tied off the gastroomental vein during the operation.
- Blood from the stomach wall drains through the gastroomental vein.
