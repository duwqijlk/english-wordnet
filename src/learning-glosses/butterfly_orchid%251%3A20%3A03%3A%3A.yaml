simpleMeaning: showy bright flowers grow on this flowering plant of Florida and the Bahamas, at times
  put in the group Epidendrum
scope: A flowering plant of Florida and the Bahamas with showy bright flowers, not the Oncidium orchid
  with small yellow and brown flowers and not the Mediterranean one with purple flowers.
examples:
- The butterfly orchid bloomed with bright flowers in the Florida sun.
- A butterfly orchid from the Bahamas grew in her glasshouse.
