simpleMeaning: The loan that paid for buying a firm with borrowed money is paid back by selling what the
  firm owns.
scope: This is the name for a buyout paid for with borrowed money, where what the firm owns is sold to
  pay back the loan.
examples:
- The bust-up takeover was paid for by selling the firm's assets.
- After the bust-up takeover, the loan was repaid from the sale of assets.
