simpleMeaning: On the high open hills of Great Britain lives this grouse, a wild game bird, reddish-brown
  in colour
scope: A reddish-brown grouse of the high moors of Great Britain, also called moor-bird, moorbird and
  moorgame; not a moorhen, which is a black bird of ponds and lakes.
examples:
- A moorfowl rose from the heather and flew across the moor.
- Hunters watched moorfowl feeding on the high moor.
