simpleMeaning: bad air or gas that is not healthy and rises from the ground or from other sources
scope: Bad, unhealthy air or gas rising from the ground or another source, not clean air and not a sickness
  itself.
examples:
- A miasma rose from the wet marsh.
- The small room was filled with a miasma of cigar smoke.
