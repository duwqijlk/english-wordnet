simpleMeaning: As the rate of the signal goes up or down, a line in electronics shows how much a device
  gives out for what goes in.
scope: This is a line that shows what a device gives out against what goes in as the rate changes, not
  the device itself.
examples:
- The frequency response of the speaker fell off at high notes.
- They drew the frequency response to see how the device behaved at each rate.
