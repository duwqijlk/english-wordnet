simpleMeaning: A moderate political party of France that held power from 1791 to 1793, during the French
  Revolution.
scope: A moderate French party that held power from 1791 to 1793, set beside the Jacobins and the Mountain,
  the more radical parties of the Revolution.
examples:
- The Gironde held power in France from 1791 to 1793.
- Members of the Gironde were the moderate voice in the Revolution.
