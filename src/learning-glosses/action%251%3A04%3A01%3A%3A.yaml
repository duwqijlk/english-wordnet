simpleMeaning: A court case in which one person or group brings a claim against another because of a wrong
  done, to protect a right, or to prevent a wrong.
scope: This is the lawsuit sense, not something done as opposed to something said, not the state of being
  active, not a military engagement, not a natural process, not the events of a plot, not the trait of
  being energetic and forceful, not a mechanism in a machine or gun, not an official act by a government
  body, not the most important or exciting activity in a field, and not the verb meanings.
examples:
- She brought an action against the company for breach of contract.
- The court dismissed the action because the claim was filed too late.
