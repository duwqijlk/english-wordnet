simpleMeaning: create a dividing line or boundary between two things, areas, or groups
scope: This is about creating a dividing line or boundary between things, not about a physical barrier
  that merely stands between two places, not about drawing out the different ingredients of a mixture,
  and not about sharing a whole out into portions.
examples:
- A row of cones separated the two lanes of traffic.
- They separated the storage area from the main office with a glass wall.
