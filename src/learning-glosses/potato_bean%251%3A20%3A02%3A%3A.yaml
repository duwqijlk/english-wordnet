simpleMeaning: a climbing plant from the Amazon area with large roots that people can eat
scope: Also called yam bean, this is a climbing plant from the Amazon area, not the North American vine
  with sweet-smelling flowers and food tubers that is also called potato bean.
examples:
- The potato bean grows in the Amazon basin and has large roots that people eat.
- Farmers in the Amazon grow potato bean for its large edible roots.
