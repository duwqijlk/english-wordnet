simpleMeaning: a black mineral tinged with brown, made of zinc sulfide, a mix of zinc and sulphur
scope: This is a black mineral tinged with brown and made of zinc sulfide, not a metal on its own and
  not any other kind of rock.
examples:
- The wurtzite in the rock was black with a brown tint.
- She found a piece of wurtzite among the stones in the mine.
