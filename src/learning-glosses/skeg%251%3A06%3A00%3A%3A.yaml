simpleMeaning: a bar that runs back from the back of a boat's keel to hold up the post that holds the
  rudder
scope: A bar that holds up the rudder post at the back of a boat; not the rudder itself and not the keel.
examples:
- The skeg was cracked where it joined the rudder post.
- A new skeg was fitted to the boat to hold the rudder in place.
