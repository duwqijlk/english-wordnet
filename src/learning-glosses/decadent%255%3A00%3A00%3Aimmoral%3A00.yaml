senseId: decadent%5:00:00:immoral:00
synsetId: 01554025-s
simpleMeaning: giving yourself far too much of what you enjoy, while your morals grow weak and bad
scope: Also called fin-de-siecle, this word describes a way of life with too much pleasure and weak morals,
  not a person who lives in that way.
examples:
- They lived a decadent life, spending all their money on parties and doing nothing useful.
- His decadent habits showed he did not care about right and wrong.
