simpleMeaning: the lean flesh, much valued as food, of a fish that lives in the sea or in fresh water
scope: Also called gray mullet and grey mullet. This is the flesh eaten as food, not the living fish itself.
examples:
- Mullet is lean and tastes good when cooked over a fire.
- We ate fresh mullet for dinner.
