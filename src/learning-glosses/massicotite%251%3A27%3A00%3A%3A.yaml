simpleMeaning: Paint gets its yellow colour from this powder, made from a lead compound found in rock
scope: 'Also called massicot: a yellow powder from a lead mineral used to colour paint, not a yellow dye
  from plants and not the lead metal itself.'
examples:
- Massicotite gave the old wall paint its yellow tint.
- The restorer found massicotite in the yellow paint of the old door.
