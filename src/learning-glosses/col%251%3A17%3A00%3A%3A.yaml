simpleMeaning: 'A crossing point between mountain peaks: the lowest point on a ridge where two summits
  meet; in the study of landforms, the term for this feature.'
scope: The lowest point on a mountain ridge, a specific kind of pass; not a broad valley or a route through
  an entire range.
examples:
- We crossed the col between the two summits before noon.
- The map marks a col at the lowest point of the ridge.
