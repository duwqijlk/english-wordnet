senseId: 'quantitative%3:00:01::'
synsetId: 02298446-a
simpleMeaning: In verse, having a beat pattern that is based on how long each part of a word takes to
  say, when compared with other parts
scope: For poems, where the beat depends on how long word parts last, not about numbers, amounts, or measuring
  things.
examples:
- Classical Greek quantitative verse was built on long and short syllables.
- Students compared quantitative verse with verse based on stress.
