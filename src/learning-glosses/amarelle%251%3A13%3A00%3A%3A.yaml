simpleMeaning: With juice that has no colour, or almost none, this pale red cherry tastes sour.
scope: This cherry is not the tree that bears it, which is a different sense of the same word.
examples:
- The cook used amarelle for a tart, liking its sour taste and juice with no colour.
- A bowl of amarelle stood on the table, the pale red fruit bright against the white dish.
