simpleMeaning: a written paper or record kept wound in a tube for storage
scope: This sense is a written paper kept wound in a tube; it is not a list of names, and not just any
  object wound into a cylinder.
examples:
- He opened the roll carefully so the old paper would not tear.
- A roll of parchment lay sealed in the wooden chest.
