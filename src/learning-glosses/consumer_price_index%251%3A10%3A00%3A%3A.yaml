simpleMeaning: a number that shows what all things bought and work paid for by an ordinary buyer cost
scope: 'Cost-of-living index is another name for this sense: a number that shows what things bought and
  work paid for cost an ordinary buyer, not the cost of one thing alone and not a list of shop prices.'
examples:
- The consumer price index rose last month as food costs went up.
- Economists watch the consumer price index to see how fast living costs are rising.
