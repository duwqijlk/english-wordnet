simpleMeaning: with several kinds of fighters in it, each one able to fight one kind of antigen, a thing
  the body reacts to
scope: A thing with several fighters in it, each for one kind of antigen, a thing the body reacts to,
  not a thing with only one fighter for one kind of antigen.
examples:
- A polyvalent vaccine can fight more than one kind of antigen.
- Doctors gave her a polyvalent vaccine that works against several antigens at once.
