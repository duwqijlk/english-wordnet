simpleMeaning: A tool that joins two measuring pipes to read both full and still-air pressure, used in
  planes to find air speed.
scope: Also called a Pitot head and a Pitot tube; a tool in planes that reads both full and still-air
  pressure to find air speed.
examples:
- The pilot checked the Pitot-static tube before takeoff.
- A blocked Pitot-static tube can give a wrong airspeed reading.
