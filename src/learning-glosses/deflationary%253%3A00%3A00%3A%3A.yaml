schema: oewn-learning-gloss-v2
senseId: 'deflationary%3:00:00::'
synsetId: 02549547-a
simpleMeaning: Linked with, or tending to cause, a fall in what people pay for goods and a rise in what
  money can buy
scope: Something that tends to bring prices down or make money worth more; not inflationary, which pushes
  prices up, and not deflation itself.
examples:
- Deflationary measures helped bring prices down.
- A deflationary policy can make money buy more.
