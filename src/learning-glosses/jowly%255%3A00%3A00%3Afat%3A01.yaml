simpleMeaning: having loose folds of flesh that hang down under the chin or the lower jaw
scope: 'Also called double-chinned and loose-jowled: having loose folds under the chin, not just being
  fat in the face or body as a whole.'
examples:
- The old man was jowly, with loose skin hanging under his chin.
- His jowly face made him look much older than he was.
