simpleMeaning: The back part of the pituitary body (the small gland at the base of the brain), mostly
  made of gland tissue.
scope: The back part of the pituitary body, mostly made of gland tissue, not the front part and not the
  whole gland; also called pars nervosa.
examples:
- The neurohypophysis is the back part of the small gland at the base of the brain.
- Doctors studied the neurohypophysis, mostly made of gland tissue.
