simpleMeaning: connected with a large group of soldiers that works as one part of an army
scope: This describes something linked to one large group of soldiers in an army, not to the whole army
  and not to a single soldier.
examples:
- The regimental band played at the ceremony.
- He kept his regimental badge from his years of service.
