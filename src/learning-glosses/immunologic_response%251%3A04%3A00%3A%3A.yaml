simpleMeaning: 'The body''s defenses treat something foreign — a virus, fungus, bacterium or transplanted
  organ, for example — as an antigen: they single it out and make antibodies that attach to it.'
scope: One of three interchangeable names for this defense reaction, with immune reaction and immune response
  the other two; it is neither a vaccine nor the antibodies on their own.
examples:
- The doctor measured his immunologic response to the bacteria after treatment.
- An immunologic response to the transplanted organ can lead to rejection.
