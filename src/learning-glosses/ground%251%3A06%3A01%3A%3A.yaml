simpleMeaning: In art, a wall or canvas treated so that its surface will hold paint for a picture.
scope: This is not the electrical link to a large conductor, the football act of throwing the ball down
  to stop play, the first thin coat of paint or size put on a surface, the solid land or soil, a reason
  for belief, or the background area of a picture behind its main figures.
examples:
- The artist chose a rough ground so the paint would grip the canvas.
- She sanded the ground smooth before starting the picture.
