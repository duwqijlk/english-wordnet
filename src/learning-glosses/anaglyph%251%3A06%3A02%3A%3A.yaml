simpleMeaning: pictures that move or stay still, made in two colours that do not match, which look deep
  and solid when laid one on top of the other
scope: Moving or still pictures that look deep only when two are laid together, not an ordinary flat photograph
  and not a picture that is truly solid.
examples:
- The children put on red and blue glasses to watch the anaglyph.
- The museum showed an anaglyph of a dinosaur that seemed to step out of the wall.
