simpleMeaning: A group of nations set up in 1949 by the North Atlantic Treaty to guard one another
scope: A group of nations set up in 1949 by the North Atlantic Treaty to guard one another, also called
  North Atlantic Treaty Organization, not the United Nations and not a single nation's army.
examples:
- NATO was formed in 1949 to guard its members.
- The NATO council met in Brussels.
