simpleMeaning: In computing, a list of jobs or notes kept in order, waiting to be done or sent
scope: In computing, an ordered list of jobs or notes waiting their turn; not a line of people.
examples:
- The printer held the job in its queue all morning.
- Messages wait in a queue before they are sent.
