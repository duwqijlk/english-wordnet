simpleMeaning: to change to fit something, or to get used to something, and so work well with it
scope: This sense is about changing to fit, or getting used to, something so that you work well with it;
  it is not about tuning an instrument to the right notes.
examples:
- She attuned herself to the quiet life in the small village.
- Good teachers attune their lessons to the needs of each class.
