simpleMeaning: a plant of Europe and Asia that lives for years, now settled in North America, with wide
  leaves that have coarse teeth and many hairs that sting
scope: A plant that stings, not a harmless leafy weed and not the dead nettle that does not sting.
examples:
- The stinging nettle brushed her arm and left it red.
- Wear gloves when you pull up stinging nettle.
