simpleMeaning: to become flat and even, with no part higher than another.
scope: This is not to make something flat by acting on it, and not to aim or point something; it is the
  thing itself becoming flat.
examples:
- The driveway rises from the road, then levels in front of the house.
- The lake's surface levelled as the wind dropped.
