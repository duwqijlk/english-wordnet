simpleMeaning: A bushy or tall-growing plant with large flat seeds that can be eaten
scope: Lima bean plant is another name for this bushy or tall-growing plant with large flat seeds that
  can be eaten; it is the plant, not the cooked seeds, and not the southern bush plant of the other sense.
examples:
- The lima bean grew tall against the fence.
- She planted lima bean in the spring garden.
