simpleMeaning: In the cold forests of Canada and the western United States live several kinds of animals
  like voles, at home on the ground or up in the trees.
scope: This is one of several kinds of animals like voles, and it is not a true vole.
examples:
- A phenacomys lives on the ground in the cold forests of Canada.
- The phenacomys climbed into the trees in the western United States.
