simpleMeaning: To keep a person or thing safe or hidden from danger or harm.
scope: Another name for screen, meaning to keep something safe or hidden from danger or harm, not a piece
  of armour or the act of holding back a feeling.
examples:
- The tall trees shielded the house from the wind.
- He shielded his eyes from the bright sun with one hand.
