simpleMeaning: the ground floor front or inside of a building, in the style that brought back old Roman
  building
scope: The ground floor front or inside in old Roman style made new again, not the lowest floor of a building
  under the ground.
examples:
- The basement of the palace was built in the Renaissance style.
- Visitors admired the basement of the old hall.
