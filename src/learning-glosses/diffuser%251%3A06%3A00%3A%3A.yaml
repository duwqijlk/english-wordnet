simpleMeaning: a thing that makes a lamp's light reach every side at the same strength
scope: A thing that makes a lamp's light reach every side at the same strength, also called a diffusor,
  and not a thing that spreads sound or a lamp itself.
examples:
- She fitted a diffuser over the lamp to soften the glare.
- The diffuser on the studio lamp spreads the light evenly across the room.
