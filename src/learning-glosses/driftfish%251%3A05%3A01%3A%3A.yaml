simpleMeaning: a small fish of the butterfish kind, about six inches long, that lives in warm seas all
  over the world
scope: A small warm-sea fish of the butterfish kind, not the larger western Atlantic butterfish of the
  same name.
examples:
- The driftfish darted among the coral in the warm sea.
- A driftfish no longer than six inches swam past the boat.
