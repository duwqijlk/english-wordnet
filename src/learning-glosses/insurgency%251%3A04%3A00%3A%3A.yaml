simpleMeaning: A planned fight by a group to take power from the government in place, by acts to weaken
  it and by fighting with weapons
scope: This planned fight against a government, also called insurgence, is a group act with weapons; it
  is not one person speaking against the government or a normal vote to change it.
examples:
- The insurgency lasted for years as armed groups fought to remove the government.
- Soldiers were sent to the south to stop the insurgency there.
