simpleMeaning: of or like a bard, a singer and teller of old stories, or of the poems such a person makes
scope: Of or like a bard and a bard's poems, not a modern pop song and not a plain story told without
  song.
examples:
- She wrote a bardic poem about the old kings.
- The bardic tradition of the village kept the old tales alive.
