simpleMeaning: A bushy, hairy annual plant with leaves in threes and pink to purple blooms, grown for
  food, feed and soil improvement, chiefly for its nutritious oily seeds; native to Asia.
scope: This is the plant standing in the field, not the harvested bean used as food or the oil extracted
  from it.
examples:
- Each soybean plant carries pods holding two or three seeds.
- The soybean plant has leaves in threes and small purple flowers.
