simpleMeaning: A tiny bit of matter that holds one chemical group built around nitrogen, often a carrier
  of signals between nerve cells
scope: A bit of matter with one nitrogen group, often a signal carrier between nerve cells, not a bit
  of matter with more than one such group and not a hormone.
examples:
- Dopamine is a monoamine that carries signals in the brain.
- The monoamine levels in the sample were low.
