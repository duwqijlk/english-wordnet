simpleMeaning: A kind of group insurance that gives its members care from hospitals, clinics and doctors
  that take part in the plan.
scope: Also called health maintenance organization; a kind of group insurance giving members care from
  hospitals, clinics and doctors that take part in the plan, not other health plans and not a hospital.
examples:
- Her HMO covers her visits to the doctor.
- He joined an HMO that works with many clinics.
