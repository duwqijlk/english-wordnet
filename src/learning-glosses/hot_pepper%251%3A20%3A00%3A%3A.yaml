simpleMeaning: Grown mainly in the Gulf Coast states to make spicy sauce, this plant bears medium-sized,
  long red fruit with a burning taste.
scope: Also called tabasco pepper or tabasco plant; this is the plant grown for its hot fruit, not the
  fruit itself.
examples:
- The hot pepper plants were tall and covered in long red fruit.
- She planted a hot pepper to grow peppers for hot sauce.
