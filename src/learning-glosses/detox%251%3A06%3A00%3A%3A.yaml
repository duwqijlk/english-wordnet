simpleMeaning: a part of a hospital, or a place for care, where people are helped to get drugs or alcohol
  out of their bodies
scope: This is a place for care in a hospital, not the treatment itself and not a place for general care.
examples:
- The detox on the second floor has a quiet room for new patients.
- The detox on the third floor has twenty beds for new patients.
