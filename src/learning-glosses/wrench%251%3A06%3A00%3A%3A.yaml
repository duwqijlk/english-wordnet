simpleMeaning: A tool you hold in your hand for gripping a nut or bolt and turning it
scope: A tool you hold in your hand for gripping a nut or bolt and turning it, not a sharp hurt in a muscle
  and not the act of twisting something off.
examples:
- He reached for a wrench to tighten the bolt.
- She used a wrench to loosen the nut on the wheel.
