simpleMeaning: having to explain what you did, and be blamed if it was wrong
scope: It means having to explain and take the blame for what you did, not just doing a good job, and
  not being free from blame.
examples:
- The government must be accountable to the people it serves.
- She was fully accountable for what she did.
