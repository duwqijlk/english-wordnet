simpleMeaning: the middle part of a building in ancient Roman times, where fights and shows were held,
  especially when this part was covered with sand
scope: This is the middle area in an old Roman building, not a modern sports ground and not a stage for
  plays.
examples:
- The fighters walked into the arena as the crowd shouted.
- Sand covered the floor of the Roman arena.
