simpleMeaning: a harmful growth that starts in the thin skin-like layer of a gland
scope: A harmful growth that starts in the thin skin-like layer of a gland; adenocarcinoma and glandular
  carcinoma are other names for this sense, not a harmless growth and not a growth in muscle.
examples:
- The doctors found glandular cancer in his throat.
- Glandular cancer starts in the lining of a gland.
