simpleMeaning: Grown far and wide in China and Japan, this bushy plant that lives one year gives seeds
  that are ground into flour.
scope: Also called adsuki bean, this bushy plant is grown far and wide in China and Japan, and its seeds
  are ground into flour.
examples:
- In the field, adzuki bean grew in bushy rows.
- The cook ground adzuki bean seeds into flour.
