simpleMeaning: Sent with a small group, this soldier guards the sides of an army group.
scope: Sent with a small group, this soldier guards the sides of an army group; not a soldier who fights
  at the front, and not a guard who stays at the centre.
examples:
- The flanker guarded the side of the marching column.
- Two flankers watched the army's left side.
