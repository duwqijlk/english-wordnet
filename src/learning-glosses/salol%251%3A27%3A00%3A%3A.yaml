simpleMeaning: A white powder of pleasant taste and smell, used to take in light in suntan lotions, or
  as a preservative, antiseptic, or pill coat freeing the drug in the gut.
scope: This sense is also called phenyl salicylate, for a white powder of pleasant taste and smell.
examples:
- Salol coats pills for gut release.
- Salol absorbs light in suntan lotions.
