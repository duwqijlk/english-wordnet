simpleMeaning: Blood low in oxygen comes from the upper room of the heart into this room on one side,
  which pushes it into the lung blood tube.
scope: A room on one side of the heart, filled from the upper room and emptied into the lung blood tube.
examples:
- The right ventricle pumps blood into the pulmonary trunk.
- Blood low in oxygen flows into the right ventricle from the right atrium.
