simpleMeaning: make a hole in something with a sharp point
scope: A sharp point makes a hole in something; it is not the hard thrusting kind of piercing, and it
  does not mean fixing an object by pushing its end in.
examples:
- He stuck a pin through the paper.
- She stuck a fork into the potato to see if it was done.
