simpleMeaning: the act of putting off doing something and leaving it to a later time
scope: This is putting off doing something and leaving it for a later time; it is not a delay caused by
  other people or by things going wrong.
examples:
- His procrastination meant the report was only finished at the last minute.
- Procrastination kept her from starting her homework until late at night.
