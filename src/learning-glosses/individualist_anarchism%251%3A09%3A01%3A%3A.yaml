simpleMeaning: In the anarchist movement, some ways of thinking put one person and what that person wants
  above the group, society, old ways, and fixed ideas.
scope: One of several ways of thinking in the anarchist movement, it sets one person and what that person
  wants above outside forces, not the group or a fixed set of ideas.
examples:
- He wrote about individualist anarchism in his essay on ways of thinking.
- She first met individualist anarchism in a book about the anarchist movement.
