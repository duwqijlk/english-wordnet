simpleMeaning: A dish of rice, onions or celery, and usually poultry, game, or shellfish simmers in well
  seasoned broth, sometimes with tomatoes.
scope: 'Also called pilaf, pilaff, and pilaw: a dish of rice cooked in well seasoned broth, usually with
  poultry, game, or shellfish, and sometimes with tomatoes.'
examples:
- Pilau is a dish of rice cooked in well seasoned broth.
- She served pilau with shellfish and tomatoes.
