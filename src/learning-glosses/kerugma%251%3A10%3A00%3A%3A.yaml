simpleMeaning: The good news about Christ, told in the way the first church told it
scope: 'Also called kerygma: the telling of the good news about Christ as the first church did it, not
  a sermon on other teaching and not the church''s rules.'
examples:
- The kerugma was at the heart of the early church's preaching.
- He studied the kerugma of the first Christians.
