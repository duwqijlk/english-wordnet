senseId: 'mitigating_circumstance%1:09:00::'
synsetId: 05831641-n
simpleMeaning: In law, a fact that does not clear a person but makes the punishment for the offence lighter.
scope: In law, a fact that does not clear a person but makes the punishment for the offence lighter, not
  a full excuse and not a lack of proof.
examples:
- His youth was a mitigating circumstance in the trial.
- The judge weighed every mitigating circumstance.
