simpleMeaning: A count, in communication theory, of how much doubt hangs over what will happen.
scope: 'Also called information: in communication theory, a number measuring how uncertain an outcome
  is, not the thermodynamics sense of energy no longer free to do work.'
examples:
- The entropy of the signal was high, so the outcome was hard to guess.
- Engineers used entropy to measure the doubt in the message.
