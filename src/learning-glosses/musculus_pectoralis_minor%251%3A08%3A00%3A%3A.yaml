simpleMeaning: a bone-linked muscle of the chest that pulls the shoulder blade down or lifts the ribs
scope: 'Also called the pectoralis minor or the smaller pectoral muscle: a bone-linked muscle of the chest
  that pulls the shoulder blade down or lifts the ribs; not the larger chest muscle and not a back muscle.'
examples:
- The musculus pectoralis minor pulls the shoulder blade down.
- When the musculus pectoralis minor works, the ribs lift.
