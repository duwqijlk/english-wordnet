simpleMeaning: a spicy mix put with other food, made of cut-up fruit or vegetables cooked in vinegar and
  sugar with ginger and other spices
scope: This is a spicy, sour-sweet mix eaten with a meal, not a sweet jam for bread and not a plain hot
  sauce.
examples:
- He put mango chutney next to the rice and fish.
- The chutney was hot, sweet and sour at the same time.
