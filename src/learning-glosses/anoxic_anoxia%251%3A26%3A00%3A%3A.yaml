simpleMeaning: Too little oxygen in the body because the blood is badly filled with oxygen in the lungs
scope: Too little oxygen in the body because the blood is badly filled with oxygen in the lungs, not from
  too little red stuff in the blood and not from low oxygen in the arteries.
examples:
- Anoxic anoxia set in when the lungs failed to fill the blood.
- The patient suffered anoxic anoxia after the lung injury.
