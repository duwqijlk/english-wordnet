simpleMeaning: Large heads of yellow flowers crown this plant that lives one year, from the Mediterranean
  lands to Portugal, with hairy stems and leaves edged with tiny spiny teeth.
scope: Also called sweet sultan, this plant lives one year, unlike the other blessed thistle, a tall biennial
  with large clasping white-blotched leaves and purple flower heads.
examples:
- Blessed thistle grew with hairy stems and large heads of yellow flowers.
- The leaves of blessed thistle are edged with tiny spiny teeth.
