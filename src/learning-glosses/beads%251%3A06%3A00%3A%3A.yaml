simpleMeaning: several small round things with holes through them, put together on a string
scope: This is the whole string of small round things, not one small ball on its own and not small drops
  of sweat on skin.
examples:
- She wore beads of blue glass on a thin string around her neck.
- The beads hung in a long line from the string.
