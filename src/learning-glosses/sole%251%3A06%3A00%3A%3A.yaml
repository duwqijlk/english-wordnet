simpleMeaning: The bottom of a shoe or boot, or of a golf club
scope: The bottom of a shoe or golf club, not the flat fish and not the flesh of such a fish.
examples:
- The sole of his shoe had worn thin.
- He cleaned the mud off the sole of his golf club.
