senseId: littler%5:00:00:small:00
synsetId: 01397927-s
simpleMeaning: less in size than another thing it is compared with
scope: Also called smaller. This sense is about size only, when one thing is compared with another; it
  is not about amount or importance.
examples:
- The littler box fits inside the big one.
- She picked the littler puppy of the two.
