simpleMeaning: a story about beings or events from old stories, or about magic beings and happenings that
  break the laws of nature
scope: 'Also called a fable: a story about gods or magic, not the short words that go with a picture.'
examples:
- The legend tells how a god stole fire for humans.
- Children loved the legend of the dragon under the mountain.
