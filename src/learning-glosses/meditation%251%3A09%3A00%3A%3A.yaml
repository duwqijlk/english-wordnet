simpleMeaning: thinking long and deeply about one thing, or about a set of things that are hard and deep
scope: 'Also called speculation: long, deep thought about a hard subject; not the religious sense of thinking
  about holy things.'
examples:
- The habit of meditation is the basis for all real knowledge.
- She sat in meditation for an hour, thinking deeply about the book.
