simpleMeaning: In computer science, making a computer behave just like a screen and keyboard that lets
  a person work on another computer
scope: In computer science, making a computer behave just like a screen and keyboard that lets a person
  work on another computer; not making a computer run faster, and not linking two computers.
examples:
- Terminal emulation lets my laptop act as an old mainframe screen.
- The program offers terminal emulation for remote work.
