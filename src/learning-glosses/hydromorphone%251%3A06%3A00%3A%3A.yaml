simpleMeaning: A drug that dulls pain and brings sleep, sold as Dilaudid, used to treat middling to severe
  pain.
scope: A drug that dulls pain and brings sleep, used to treat middling to severe pain, not morphine and
  not aspirin; hydromorphone hydrochloride is another name for this sense.
examples:
- The doctor gave him hydromorphone after the operation.
- Hydromorphone eased her pain within the hour.
