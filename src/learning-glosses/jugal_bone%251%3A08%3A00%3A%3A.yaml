simpleMeaning: The curved hard part under the eye that makes the raised part of the cheek.
scope: The curved hard part under the eye that makes the raised part of the cheek; cheekbone, malar, malar
  bone and os zygomaticum are other names for it, not the bone of the jaw and not the bone above the eye.
examples:
- The jugal bone forms the high point of the cheek.
- A blow broke his jugal bone.
