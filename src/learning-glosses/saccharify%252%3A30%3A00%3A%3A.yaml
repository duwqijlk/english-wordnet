simpleMeaning: to turn something made from sugar or a complex sugar into a plain sugar that dissolves
  in water and can ferment, by splitting it with water
scope: To turn a substance made from sugar or a complex sugar into a plain sugar that can ferment, not
  to sweeten food and not to ferment sugar.
examples:
- Heat can saccharify the starch in the grain.
- The malt saccharifies the barley starch during brewing.
