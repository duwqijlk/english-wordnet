simpleMeaning: an American water plant with spikes of blue blooms that grows in the shallow water of streams
  and ponds
scope: 'Also called pickerel weed and wampee: an American water plant with blue blooms, not a land plant
  and not a water lily.'
examples:
- Pickerelweed grew thick along the edge of the pond.
- Blue spikes of pickerelweed stood above the stream.
