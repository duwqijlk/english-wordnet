simpleMeaning: A green plant that keeps its leaves all year, found in California and Baja California.
scope: This is a green plant that keeps its leaves all year, found in California and Baja California;
  not a plant that loses its leaves in winter and not a plant of the far north.
examples:
- The coffee fern stays green through the dry summer.
- Coffee fern grows on the shaded slopes of Baja California.
