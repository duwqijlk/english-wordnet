simpleMeaning: to work hard without stopping, with great force, sometimes making people notice you, to
  reach a goal or back a cause or person, and speak up for them
scope: Also called campaign, fight, push, press and agitate. This is working and speaking in public for
  a cause or a person, not going to fight a holy war, and not the noun for a set of actions toward a goal.
examples:
- For years she has crusaded against smoking in schools.
- He crusades for clean water in his town.
