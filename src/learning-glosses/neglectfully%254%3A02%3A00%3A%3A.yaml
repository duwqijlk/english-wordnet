simpleMeaning: In a way that shows little care or respect for people or duties
scope: This is doing something with little care or respect; not doing it badly by mistake and not doing
  it on purpose to harm.
examples:
- She neglectfully left the gate open all night.
- The papers were neglectfully tossed in a corner.
