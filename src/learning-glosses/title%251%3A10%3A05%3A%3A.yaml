simpleMeaning: the name or heading given to a law or a proposed law, which may include a short summary
  of what it deals with.
scope: It is not the name of a book or song and not a person's rank; it is the heading of a law or bill.
examples:
- The bill was introduced under the title 'Clean Water Act'.
- The title of the new law promised lower taxes and simpler rules.
