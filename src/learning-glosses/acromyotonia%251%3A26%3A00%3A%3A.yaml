senseId: 'acromyotonia%1:26:00::'
synsetId: 14569150-n
simpleMeaning: Muscle stiffness in the hands and feet only, which makes the hand or foot stiff and bent
  out of shape.
scope: Not muscle stiffness all over the body and not a hand bent by a break.
examples:
- Acromyotonia stiffened her fingers so she could not open them.
- His acromyotonia bent one foot out of shape.
