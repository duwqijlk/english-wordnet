simpleMeaning: To construct canal enclosures that help vessels travel along a waterway.
scope: To build canal enclosures for vessel travel, not to fasten a door, to pass through such an enclosure,
  or to become rigid.
examples:
- The engineers locked the canal so boats could climb the steep valley.
- Crews locked the upper river to make it passable for freight barges.
