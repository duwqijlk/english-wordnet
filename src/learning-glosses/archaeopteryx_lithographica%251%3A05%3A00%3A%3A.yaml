simpleMeaning: An extinct early toothed bird of the Jurassic period, with a long feathered tail and hollow
  bones, usually held to be the earliest of all birds.
scope: Also called archaeopteryx and archeopteryx; this extinct Jurassic bird had teeth, a long feathered
  tail and hollow bones, and is held to be the earliest of all birds.
examples:
- Archaeopteryx lithographica had teeth and a long feathered tail.
- The fossil of Archaeopteryx lithographica shows hollow bones.
