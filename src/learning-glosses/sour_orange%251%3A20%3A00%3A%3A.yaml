simpleMeaning: Any of several common trees that bear sharp or bitter fruit and are used as stock on which
  other kinds are grafted
scope: Any of several common trees with sharp or bitter fruit; bigarade, bitter orange, bitter orange
  tree and marmalade orange are other names for this sense, not a sweet fruit tree and not a tree grown
  only for its wood.
examples:
- The farmer grows a sour orange to use as grafting stock for sweeter kinds.
- A sour orange bears fruit too sharp to eat fresh.
