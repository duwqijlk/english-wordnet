simpleMeaning: In law, an order from a judge that stops a person from doing a thing, or from going on
  doing it.
scope: 'Also called an enjoinment: a judge''s order that stops someone from doing a thing, not a law itself.'
examples:
- The court granted an injunction against the building work.
- They sought an injunction to stop the paper printing the story.
