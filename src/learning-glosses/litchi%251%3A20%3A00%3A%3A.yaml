simpleMeaning: For its fruit that can be eaten, this tree of China is grown above all in the Philippines
  and India; it is at times put in the group Nephelium.
scope: Also called lichee and litchi tree, it is the tree itself, not the fruit that grows on it.
examples:
- The litchi grows in the Philippines for its fruit.
- Litchi bears fruit that can be eaten.
