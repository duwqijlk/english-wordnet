simpleMeaning: the state of having become bad and weak in mind and in what is right and wrong
scope: 'Also called degeneration and degeneracy: a fall in mind and in sense of right and wrong, not harm
  to the body or to a place.'
examples:
- The book tells of a city that fell into decadence, where leaders no longer cared what was right.
- He saw decadence in a court where no one tried to do good any more.
