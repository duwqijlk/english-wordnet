simpleMeaning: a time when something stops for a while before it starts again
scope: 'Also called break, pause, interruption and suspension: a time when something stops for a while,
  not the end of something for good.'
examples:
- During the intermission, people left the theatre to buy drinks.
- After a short intermission, the play started again.
