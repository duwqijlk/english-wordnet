simpleMeaning: the great cruelty and lack of pity in something, so bad that it shocks people
scope: The quality of being cruel and without pity, so bad it shocks people, not one single cruel act.
examples:
- The atrocity of the prison shocked the whole world.
- People were stunned by the sheer atrocity of the regime.
