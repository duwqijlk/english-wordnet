simpleMeaning: in genetics, the work of combining different species or varieties of animals or plants
  so that hybrid offspring result.
scope: This is the breeding act itself, not the hybrid living thing that results from it, not a wooden
  structure with an upright post and a crosspiece, not a line marking where two lines meet, not a burden
  or trial that causes great suffering, not a crosswise direction, not an annoyed mood, and not a verb
  meaning to travel across, meet, thwart, fold, span, mark a line, or breed animals.
examples:
- The cross of the two wheat varieties took three seasons to complete.
- Geneticists recorded each cross between the wild and cultivated strains.
