simpleMeaning: Two shells joined by a hinge shut in a soft-bodied sea or fresh-water mollusk, its flat
  gills held inside.
scope: People also call it bivalve and pelecypod, the mollusk whose two hinged shells shut its soft body
  inside.
examples:
- The lamellibranch shut its two shells tight.
- A lamellibranch keeps its flat gills inside its two hinged shells.
