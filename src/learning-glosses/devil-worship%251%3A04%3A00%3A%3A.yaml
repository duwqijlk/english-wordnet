simpleMeaning: set acts and forms that give praise to evil spirits
scope: Worship given to evil spirits through set acts and forms, also called demonolatry and diabolatry;
  not a belief in devils and not the worship of God.
examples:
- The old book told of devil-worship in the hills, with rites held at night.
- Devil-worship was banned, and its secret rites were held in dark places.
