simpleMeaning: The chest organ that takes in air has three parts on the right side and two on the left,
  and this is one of them
scope: One of the rounded parts of the lung, three on the right and two on the left, not the whole lung
  and not a lobe of the brain.
examples:
- The doctor found a spot in one lobe of the lung.
- Each lobe of the lung has its own air tube.
