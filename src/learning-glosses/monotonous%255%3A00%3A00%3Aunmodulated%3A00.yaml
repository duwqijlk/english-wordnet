simpleMeaning: heard as a sound that stays at one pitch, never rising or falling
scope: Heard as a sound that stays at one pitch, never rising or falling; flat is another name for this
  sense, and it is not dullness from being the same again and again.
examples:
- The owl's faint monotonous hooting went on all night.
- He read the list in a monotonous voice that never rose or fell.
