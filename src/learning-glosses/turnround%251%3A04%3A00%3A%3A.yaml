simpleMeaning: the work of taking things off a ship or plane, putting new things on, and getting it ready
  to go back
scope: This is the work of getting a ship or plane ready for a return trip, also called turnaround; not
  a ship or plane left at rest and not a change of mind.
examples:
- The turnround of the ferry took less than an hour.
- Crews worked through the night on the turnround of the plane.
