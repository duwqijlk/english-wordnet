senseId: 'intussusception%1:22:01::'
synsetId: 13523144-n
simpleMeaning: A small hollow forms in a surface when its outer layer folds in on itself
scope: The folding in of an outer layer to make a pocket in a surface, also called infolding, introversion
  or invagination; not a cell wall growing in area.
examples:
- The intussusception of the blastula creates a pocket in its surface.
- During intussusception, the outer layer folds inward to form a hollow.
