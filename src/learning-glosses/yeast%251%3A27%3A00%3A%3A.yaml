simpleMeaning: a thing sold to make dough rise, holding the tiny living cells that do the rising; used
  in making bread, and in turning grain drink into beer or whiskey
scope: A thing sold to make dough rise, holding the tiny living cells that do the rising; not the single-celled
  fungus itself, and not baking powder.
examples:
- Add yeast to the warm water and wait for it to bubble.
- The baker weighed out yeast for the morning loaves.
