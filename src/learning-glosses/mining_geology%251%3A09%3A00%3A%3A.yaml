simpleMeaning: the part of rock study that deals with using what is known about rocks to find and dig
  up stuff worth money
scope: The part of rock study that deals with finding and digging up stuff worth money; not the study
  of rocks for its own sake and not digging itself.
examples:
- Mining geology helps find where to dig for ore.
- She studied mining geology to work in the mines.
