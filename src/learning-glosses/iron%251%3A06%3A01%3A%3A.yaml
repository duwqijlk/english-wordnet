simpleMeaning: a golf club with a fairly narrow metal head.
scope: This is not the metal, not a tool for pressing clothes, and not a verb meaning to smooth fabric;
  it names a golf club.
examples:
- She chose a five iron for the shot to the green.
- He switched from a wood to an iron on the narrow fairway.
