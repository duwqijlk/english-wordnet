simpleMeaning: A main point of a compass, at 90, a fourth of a turn from north.
scope: The main point on a compass at 90 degrees, a quarter turn from north; also called east, eastward,
  and due east, and not the letter, and not the metal.
examples:
- The sun rises in the east.
- Walk east to the river.
