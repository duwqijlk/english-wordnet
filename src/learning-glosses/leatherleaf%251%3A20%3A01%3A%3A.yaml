simpleMeaning: A fern of western North America with stiff blades that feel like thick skin, and egg-shaped
  green parts cut to the middle rib.
scope: 'Also called leathery polypody and coast polypody: a stiff fern of western North America, not the
  bog shrub of the same name.'
examples:
- Leatherleaf grows in western North America.
- We found leatherleaf in western North America, its stiff blades easy to spot.
