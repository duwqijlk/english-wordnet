simpleMeaning: A member of an Arctic people — northern Canada, Greenland, Alaska or eastern Siberia; the
  Algonquians named them eaters of raw flesh, but they call themselves the Inuit, meaning the people.
scope: A member of an Arctic people, also called an Esquimau or an Inuit; not the language sense of the
  same word.
examples:
- An Eskimo hunter crossed the sea ice on a dogsled.
- The Eskimo elder told stories of the long Arctic winter.
