simpleMeaning: Rose-tinted or violet twigs and bark rich in tannin, the bitter stuff used to tan leather,
  mark this willow of Europe and Asia.
scope: Also called basket willow, purple osier, purple willow, and red willow, this is the willow of Europe
  and Asia with rose-tinted or violet twigs, not the North American shrub with rose-tinted purple twigs
  and white flowers.
examples:
- The red osier grows in Europe.
- Rose-tinted twigs marked the red osier.
