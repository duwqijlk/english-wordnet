simpleMeaning: a member of a Jewish group who accepted Jesus as the Messiah, took Matthew's Gospel but
  not Paul's letters, kept Jewish law, celebrated Jewish holidays, and was later called heretic
scope: 'Also called Ebionite: a member of a Jewish group that took Jesus as the Messiah, not an inhabitant
  of Nazareth and not a word about the town of Nazareth.'
examples:
- The Nazarene kept Jewish law.
- Nazarene members took Jesus as the Messiah.
