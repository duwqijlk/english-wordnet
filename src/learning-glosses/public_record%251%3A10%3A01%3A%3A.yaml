simpleMeaning: Anything written down that a part of the government must keep, and that any person may
  look at
scope: Anything written down that a part of the government must keep and let people look at, not a private
  paper and not a secret file.
examples:
- The birth certificate is a public record anyone can ask to see.
- She went to the town hall to look at a public record of the meeting.
