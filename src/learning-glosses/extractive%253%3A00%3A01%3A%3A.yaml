simpleMeaning: of a capitalist system (a system where people own most businesses) that puts quick profit
  now before being able to last well over a long time
scope: About a business system that puts quick profit first; not the sense about taking things out of
  the ground.
examples:
- Critics called the extractive system unfair because it chased quick profit and hurt the land for years
  to come.
- An extractive economy may make money fast, but it can leave little for people in the future.
