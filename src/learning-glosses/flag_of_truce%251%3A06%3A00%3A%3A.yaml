simpleMeaning: When one side in a fight wants to talk or give in, it lifts a piece of white cloth as a
  sign.
scope: Also called a white flag, this cloth is lifted when one side wants to talk or give in.
examples:
- The soldiers raised a flag of truce to ask for a halt in the fighting.
- A flag of truce flew above the fort while the two sides talked.
