simpleMeaning: In the Roman Catholic Church, a deputy who helps a bishop.
scope: In the Roman Catholic Church, a deputy who helps a bishop; not the bishop himself and not a parish
  priest.
examples:
- The vicar-general helped the bishop run the diocese.
- As vicar-general, he acted for the bishop at the meeting.
