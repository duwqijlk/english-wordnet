simpleMeaning: very evil or cruel, in a way that shows cruelty or seems fit for hell
scope: 'Also called infernal, hellish, unholy, diabolical, satanic, fiendish and diabolic: very bad and
  cruel, not just unkind or strict, and not about a real devil or hell itself.'
examples:
- The king gave a demonic laugh as he ordered the attack.
- Her demonic cruelty frightened everyone in the village.
