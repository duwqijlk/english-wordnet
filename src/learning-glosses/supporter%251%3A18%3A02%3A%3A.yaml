simpleMeaning: A person who stands up for something and works to help it win.
scope: A person who stands up for something and works to help it win, not a person who backs a politician
  or a team, not a person who gives what is needed for a job, and not a worn band or piece of clothing.
examples:
- She is a strong supporter of free schooling.
- He became a supporter of the new library plan.
