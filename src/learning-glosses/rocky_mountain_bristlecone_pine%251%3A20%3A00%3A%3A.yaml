simpleMeaning: A small slow-growing dense-branched conifer of the western United States with cracked rust-brown
  bark, short five-needle bunches, and thorn-tipped cone scales; among the oldest living things, some
  over 4,500 years.
scope: Also called bristlecone pine and Pinus aristata; a small slow-growing conifer of the western United
  States, not a tall fast-growing conifer of the lowlands and not a low shrub.
examples:
- The Rocky Mountain bristlecone pine grows high in the mountains.
- Some Rocky Mountain bristlecone pines are more than 4,000 years old.
