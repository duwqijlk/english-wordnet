senseId: 'myelomeningocele%1:26:00::'
synsetId: 14490979-n
simpleMeaning: A birth defect in which part of the spinal cord and its coverings push out through a gap
  in the backbone, often with fluid on the brain and intellectual disability.
scope: This is the severe form in which the spinal cord itself pushes out inside a sac, not a simple gap
  in the backbone or the fluid buildup on the brain that often comes with it.
examples:
- The newborn had a myelomeningocele, and surgeons operated to close the opening in her lower back.
- Children with a myelomeningocele often need a shunt to drain extra fluid from the brain.
