simpleMeaning: a part of a hospital, or a set of rooms there, where patients with similar needs are cared
  for
scope: A hospital area for patients, also called a hospital ward, not a voting district and not a prison
  division.
examples:
- They moved her to a quieter ward after surgery.
- The children's ward was decorated with bright paintings.
