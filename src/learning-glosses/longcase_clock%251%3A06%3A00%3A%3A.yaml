simpleMeaning: A timepiece with a swinging weight, kept in a tall thin upright box.
scope: A tall thin upright box holding a swinging-weight timepiece; grandfather clock is another name
  for this sense, not a small table timepiece.
examples:
- The longcase clock in the hall chimed every hour.
- She wound the longcase clock each Sunday morning.
