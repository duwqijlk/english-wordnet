simpleMeaning: A lasting body of the United Nations that gives a land the job of running a place for it.
scope: 'Also called TC: a lasting United Nations body that gives a land the job of running a place, different
  from the Security Council and from the General Assembly.'
examples:
- The Trusteeship Council met to review the work in the territory.
- The Trusteeship Council asked one country to run the territory for it.
