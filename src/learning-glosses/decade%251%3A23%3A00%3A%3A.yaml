simpleMeaning: the number that is nine plus one, and the number that the counting system in tens is built
  on
scope: Another name for this number is ten. It is the number itself, not a period of ten years.
examples:
- One decade is nine plus one, not a period of years.
- In this counting system, a decade is ten units, the number the whole system is built on.
