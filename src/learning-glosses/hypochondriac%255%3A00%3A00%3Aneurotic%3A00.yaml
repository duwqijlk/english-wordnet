senseId: hypochondriac%5:00:00:neurotic:00
synsetId: 01588572-s
simpleMeaning: Worried that one is ill, and feeling unwell, when no illness is really there.
scope: A state of worry that one is ill when no illness is really there, not a person with imaginary symptoms
  and ailments.
examples:
- After reading the medical book, he felt hypochondriac, sure every ache meant something grave.
- She was hypochondriac that winter, calling the doctor about every cough.
