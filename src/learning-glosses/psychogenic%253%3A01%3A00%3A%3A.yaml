simpleMeaning: to do with a health problem that is caused by the mind, not by the body
scope: This sense is about a health problem that starts in the mind, not about a health problem that starts
  in the body.
examples:
- The doctor said her pain was psychogenic, because tests found no harm in her body.
- His psychogenic illness got better when his fear and worry went down.
