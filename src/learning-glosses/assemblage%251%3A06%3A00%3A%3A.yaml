senseId: 'assemblage%1:06:00::'
synsetId: 03538666-n
simpleMeaning: A group of parts joined together so they can work as one thing for a set purpose
scope: A set of parts joined to work as one system for a set job, not the act of bringing people together,
  which is another sense of this word.
examples:
- This assemblage of gears and levers controls the old clock.
- The plant uses an assemblage of pipes, valves, and pumps to move water.
