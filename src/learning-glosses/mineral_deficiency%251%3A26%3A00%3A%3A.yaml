senseId: 'mineral_deficiency%1:26:00::'
synsetId: 14473638-n
simpleMeaning: A lack of a tiny amount of a natural chemical that the body must have for normal feeding
  and body work.
scope: A lack of a tiny amount of a natural chemical that the body must have for normal feeding and body
  work, not hunger in general and not a lack of vitamins.
examples:
- Mineral deficiency left the child weak and slow to grow.
- The doctor tested for mineral deficiency after the poor diet.
