simpleMeaning: A narrow band or strip of ribbon worn round the head
scope: A narrow band or strip of ribbon worn round the head, also called a fillet and a taenia; not a
  hat and not a scarf round the neck.
examples:
- She tied a tenia round her head for the dance.
- The tenia kept her hair back from her face.
