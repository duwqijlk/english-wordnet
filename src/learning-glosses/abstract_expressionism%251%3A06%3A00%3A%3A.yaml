simpleMeaning: A New York way of painting that makes free pictures with no set shapes; the first major
  American way of painting to grow on its own, apart from European ways.
scope: A New York way of painting with free pictures and no set shapes, also called action painting; its
  nearest kin are other modern ways of painting such as Cubism and Surrealism.
examples:
- Abstract Expressionism filled the gallery with big free pictures.
- The show traced Abstract Expressionism from its first New York painters.
