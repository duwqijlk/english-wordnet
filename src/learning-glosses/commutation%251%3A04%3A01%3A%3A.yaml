simpleMeaning: In law, the act of making a punishment set by law less harsh
scope: This is the act of making a punishment set by law less harsh; not a paper that swaps one punishment
  for a lighter one, and not a pardon that ends the punishment.
examples:
- The governor granted a commutation that cut the prisoner's sentence in half.
- Her lawyer asked for a commutation of the ten-year sentence to five years.
