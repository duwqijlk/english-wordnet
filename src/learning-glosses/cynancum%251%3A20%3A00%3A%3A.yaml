simpleMeaning: One of various tropical climbing plants from Africa and Madagascar, mostly very large,
  with greenish or purple flowers and long smooth pods; people once used its roots to cause vomiting.
scope: A group of mostly giant tropical climbing vines from Africa and Madagascar; cynanchum is another
  spelling of the same name.
examples:
- Cynancum vines climbed the fence along the river.
- Long smooth pods hung from the cynancum in the forest canopy.
