simpleMeaning: In insects and some crustaceans (crabs, shrimps, and their kin), a seeing part made of
  many small light-catching pieces, each making part of the picture
scope: A seeing part made of many small light-catching pieces, not a single round seeing part and not
  a simple spot that tells light from dark.
examples:
- A fly sees the world through a compound eye.
- The compound eye of the bee is made of many tiny pieces.
