simpleMeaning: In mathematics, one of two numbers that make zero when put together, as +5 is for -5.
scope: In mathematics, one of a pair of numbers that make zero together, not the number that makes one
  when multiplied and not just any minus number.
examples:
- The additive inverse of -5 is +5.
- To find the additive inverse, change the sign of the number.
