simpleMeaning: a large bird that eats dead animals and is common in South America, Central America, and
  the south of the United States
scope: A large bird in the Americas that eats dead animals, not the common European hawk with short wings.
examples:
- A buzzard circled above the field in Texas, looking for dead animals to eat.
- Buzzards are common in the skies over Central America.
