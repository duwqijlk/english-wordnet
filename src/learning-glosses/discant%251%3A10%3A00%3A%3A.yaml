simpleMeaning: A pretty extra tune, often made up on the spot, played above the main tune.
scope: A pretty extra tune above the main tune, also called a descant; not the main tune itself and not
  a tune played below it.
examples:
- The singer added a discant above the melody.
- Her discant floated over the main tune.
