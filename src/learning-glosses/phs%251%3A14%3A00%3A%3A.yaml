simpleMeaning: This group works as the office of the country's chief doctor, and it takes in groups that
  work to make the health of the public better.
scope: Also called the United States Public Health Service; this is the whole group of offices, not the
  Surgeon General alone and not a health office for one state.
examples:
- The PHS runs health programs across the country.
- Local clinics get help from the PHS.
