simpleMeaning: The state gives money help to people who do not have enough to live on
scope: This is money help from the government for people who do not have enough to live on, not a loan
  and not a gift from a friend; welfare is another name for this sense.
examples:
- After losing her job, she lived on public assistance for a year.
- The family applied for public assistance to pay the rent.
