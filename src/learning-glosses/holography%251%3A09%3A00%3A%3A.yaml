simpleMeaning: A part of light science uses light of one kind from a laser to make a light record, and
  that record makes a picture that seems to have depth.
scope: In light science, this is the work with light of one kind from a laser that makes a picture with
  depth.
examples:
- Holography uses light of one kind from a laser.
- With holography, a light record makes a picture that seems to have depth.
