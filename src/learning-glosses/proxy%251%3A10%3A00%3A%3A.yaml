synsetId: 06543132-n
simpleMeaning: a written paper from people who own parts of a company, giving a person the legal right
  to cast a set vote for them at a company meeting
scope: This is the paper that gives the right to vote for the owners at a company meeting, not the person
  who casts that vote for them.
examples:
- She signed a proxy so her vote would count at the company meeting.
- Each owner sent in a proxy naming the vote to be cast for them.
