simpleMeaning: A check for allergy in which small amounts of things are put on small cuts in the skin
  to see how it reacts
scope: A check for allergy in which small amounts of things are put on small cuts in the skin to see how
  it reacts, not a blood check for allergy and not a patch put on unbroken skin.
examples:
- The scratch test showed she was allergic to nuts.
- The doctor did a scratch test on the boy's arm.
