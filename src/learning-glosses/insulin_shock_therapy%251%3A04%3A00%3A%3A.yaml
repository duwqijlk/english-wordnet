simpleMeaning: Giving a blood-sugar drug in a big enough dose to bring on fits and a sleep from which
  the person cannot be woken.
scope: Giving a blood-sugar drug in a big enough dose to bring on fits and a sleep from which the person
  cannot be woken, also called insulin shock and insulin shock treatment; not low blood sugar by itself
  and not a drug given to wake a person.
examples:
- Insulin shock therapy was used in old asylums.
- The patient went through insulin shock therapy.
