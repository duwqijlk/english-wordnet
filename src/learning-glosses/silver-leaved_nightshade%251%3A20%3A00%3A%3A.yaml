simpleMeaning: A nightshade weed, its leaves silver, its flowers violet or blue or white, its round berry
  turning milk to curds, ranging from the central United States into South America.
scope: This sense is also called prairie berry, purple nightshade, silver-leaved nettle, silverleaf nightshade,
  trompillo, and white horse nettle.
examples:
- A silver-leaved nightshade grew by the fence.
- Silver-leaved nightshades bear roundish berries.
