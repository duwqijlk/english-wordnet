simpleMeaning: Set out against the length of each ray, a graph shows how well rays of energy bring about
  a light-driven change in a substance.
scope: This is a graph of how well rays of energy work at each length, not the rays themselves.
examples:
- The action spectrum showed how well the rays brought about the change.
- The action spectrum was set out against the length of each ray.
