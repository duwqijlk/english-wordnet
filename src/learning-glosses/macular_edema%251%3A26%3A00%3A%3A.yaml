simpleMeaning: A disease of the eye in which the yellow spot swells because fluid leaks out and gathers
  there.
scope: A disease of the eye in which the yellow spot swells with leaked fluid; not a disease of the lens
  and not an injury to the eye.
examples:
- Macular edema blurred the centre of his sight.
- The doctor treated her macular edema with eye drops.
