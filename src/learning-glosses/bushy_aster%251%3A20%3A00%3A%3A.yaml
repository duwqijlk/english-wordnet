simpleMeaning: a stiff plant that lives for years in the east of the United States, with small narrow
  leaves and many tiny white flower heads
scope: A stiff plant that lives for years in the east of the United States, with small narrow leaves and
  many tiny white flower heads, not a soft annual and not any other white-flowered plant of the region.
examples:
- Bushy aster grew along the roadside in the east.
- The bushy aster's tiny white flower heads covered the plant.
