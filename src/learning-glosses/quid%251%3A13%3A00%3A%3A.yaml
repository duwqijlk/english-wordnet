simpleMeaning: A small lump of something a person can chew, such as tobacco
scope: A small lump for chewing, also called chew, wad, plug, cud, and chaw; it is not a big pack of tobacco
  and not a piece you swallow at once.
examples:
- He put a quid of tobacco in his mouth.
- She took the quid out after a few minutes.
