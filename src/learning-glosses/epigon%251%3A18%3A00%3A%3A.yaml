simpleMeaning: After a great writer, artist, or maker of music, comes a follower who copies the work and
  does it less well
scope: 'Also called epigone: a lesser follower who copies a great writer, artist or maker of music, not
  the great maker himself and not a maker with a style of his own.'
examples:
- He was dismissed as an epigon of the great poet, copying his style without his power.
- Critics called the composer an epigon of Mozart.
