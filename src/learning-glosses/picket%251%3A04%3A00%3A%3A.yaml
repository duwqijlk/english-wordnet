simpleMeaning: in Britain in the late 1600s, a soldier could be made to stand on one foot on a sharp stake
  as a punishment
scope: A military punishment of standing on one foot on a pointed stake, not a fence picket and not a
  troop detachment on guard.
examples:
- The picket left the soldier standing on one foot on the stake for hours.
- In the late 1600s, the picket was a dreaded punishment in the British army.
