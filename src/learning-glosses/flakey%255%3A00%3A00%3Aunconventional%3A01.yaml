simpleMeaning: so different from what most people do or expect that it is easy to see
scope: 'Also called bizarre, eccentric, flaky, freakish, freaky, gonzo, off-the-wall, outlandish, and
  outre: behaving or looking very differently from what most people expect, not merely new and not merely
  careless.'
examples:
- His flakey ideas shocked the whole committee.
- The flakey artist painted his house bright pink.
