simpleMeaning: A short burst of busy activity that seems to come without warning.
scope: This is the noun for a brief spell of energetic activity, not the adjective for meeting standards,
  not the adjective for being ready or inclined, not the adjective for being healthy, not the noun for
  a show of bad temper, not the noun for a sudden attack that cannot be controlled, not the noun for the
  way a garment sits on the body, not the verb sense for details agreeing or matching, not the verb sense
  for being acceptable to someone, not the verb sense for being the right size or shape, not the verb
  sense for making something the right size, not the verb sense for putting several things or people into
  a space, not the verb sense for following a particular shape or size, not the verb sense for supplying
  something for a purpose, not the verb sense for meeting a need or condition, and not the verb sense
  for bringing things into harmony.
examples:
- He had a fit of cleaning and scrubbed the whole kitchen in an hour.
- In a sudden fit of generosity, she paid for everyone's coffee.
