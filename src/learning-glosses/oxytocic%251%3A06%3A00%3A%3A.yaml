simpleMeaning: A drug that starts birth by making the womb tighten and push.
scope: A drug that starts birth by making the womb tighten; oxytocic drug is another name for this sense,
  not a drug that stops birth and not a drug for pain.
examples:
- The nurse gave her an oxytocic to start the birth.
- An oxytocic makes the womb tighten in waves.
