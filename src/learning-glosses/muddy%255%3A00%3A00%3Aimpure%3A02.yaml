simpleMeaning: Of a color, made dull by bits of dirt in it, so it is not bright and clear, and the word
  dirty is often put with another word
scope: 'Also called dirty: a color dulled by dirt in it, not mud on boots and not a cloudy drink.'
examples:
- The muddy color of the walls made the room feel dark.
- She picked a muddy green for the kitchen walls.
