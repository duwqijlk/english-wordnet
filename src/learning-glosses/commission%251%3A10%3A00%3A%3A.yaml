simpleMeaning: A government paper that gives its holder the rank of a military officer.
scope: This is a government document granting military officer rank; it is not a fee paid as a share of
  money handled, not a group given a matter to consider, not a group of representatives, not the act of
  granting authority, not the state of being ready for service, not a formal command or order, not the
  act of carrying out a crime, not a special assignment given to someone, and not any verb use (equipping
  a ship for service, ordering goods, or charging someone with a task).
examples:
- He received his commission at a ceremony at the naval academy.
- Her commission arrived in the mail a month after graduation.
