simpleMeaning: The slow passing of something out of view.
scope: The act of passing slowly out of view, not a golf shot that curves right nor the verb for becoming
  less distinct; disappearance is another name for it.
examples:
- The fade of the ship into the fog left us uneasy.
- We sat and watched the fade of the last light from the sky.
