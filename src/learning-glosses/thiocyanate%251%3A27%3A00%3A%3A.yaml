simpleMeaning: Melting cyanides that hold an alkali with sulfur makes this salt, which comes from an acid
  of hydrogen, sulfur, carbon, and nitrogen.
scope: This salt is told from other salts by the acid it comes from and the melting that makes it.
examples:
- A jar of thiocyanate stood among the other salts.
- More thiocyanate was made by melting cyanides with sulfur.
