simpleMeaning: On a ship, this flat bar sits level above the long beam down the middle of the bottom,
  or above the beam that lies on top of that beam.
scope: A flat bar that lies level on a ship, joined to the top of the keel or the keelson.
examples:
- The rider plate ran along the top of the keel.
- The rider plate lay flat on the keel.
