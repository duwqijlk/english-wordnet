simpleMeaning: a mistake that comes back and harms the person who made it
scope: This sense is also called a backfire. It is a mistake that harms the person who made it, not the
  curved piece of wood that flies back to the person who threw it, and not the verb sense of coming back
  to the place you started from.
examples:
- His plan to cheat was a boomerang that cost him his job.
- The lie turned into a boomerang and harmed the man who told it.
