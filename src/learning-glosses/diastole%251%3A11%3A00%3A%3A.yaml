simpleMeaning: The widening of the heart's rooms between two squeezes, when the rooms fill with blood
scope: This is the widening of the heart's rooms between two squeezes, when the rooms fill with blood,
  not the squeeze of the heart and not a pause with no blood moving.
examples:
- During diastole the heart's rooms fill with blood.
- The doctor measured the pressure in diastole.
