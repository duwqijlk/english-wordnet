simpleMeaning: the branch of the study of the mind that deals with how the workings of the body shape
  the workings of the mind
scope: The branch of the study of the mind that deals with how the workings of the body shape the workings
  of the mind; neuropsychology and psychophysiology are other names for this sense, not the study of the
  mind alone and not the study of the body alone.
examples:
- Physiological psychology asks how the workings of the body shape the workings of the mind.
- She read physiological psychology to learn how the brain and the mind work together.
