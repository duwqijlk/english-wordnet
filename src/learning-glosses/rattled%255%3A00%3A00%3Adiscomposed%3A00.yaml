simpleMeaning: in informal use, feeling upset and confused and unable to think clearly
scope: 'Another name for this sense is flustered: upset and unable to think clearly, not calm and in control
  of your thoughts.'
examples:
- The sudden question left him rattled, and he could not think of an answer.
- She felt rattled after the loud crash behind her and needed a minute to calm down.
