simpleMeaning: Brain surgery that cuts amygdaloid fibers carrying limbic system activity, used in cases
  of extreme, uncontrollable violence.
scope: This operation on the brain cuts threads in the feeling part of the brain, and it is used in cases
  of fierce violence that cannot be held back.
examples:
- The amygdalotomy cut the threads in the feeling part of his brain.
- His amygdalotomy was done because his violence could not be held back.
