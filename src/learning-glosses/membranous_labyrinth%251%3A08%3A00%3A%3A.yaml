simpleMeaning: the sense parts of the inner ear, with the spiral part that hears sound and the parts that
  sense balance, held inside the hard bone of the ear
scope: The sense parts of the inner ear, not the hard bone around them and not the outer ear.
examples:
- The membranous labyrinth holds the parts of the ear that sense sound and balance.
- Damage to the membranous labyrinth can upset a person's sense of balance.
