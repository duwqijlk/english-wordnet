simpleMeaning: a drink made by heating a mix of crushed grain and water so the steam is caught and cooled,
  the mix being at least 80 percent maize
scope: A drink made from a grain mix that is at least 80 percent maize, also called corn and corn whisky,
  not a drink made from barley and not a drink made from rye.
examples:
- He poured a glass of corn whiskey distilled from a mash of mostly maize.
- The corn whiskey on the shelf came from a small still.
