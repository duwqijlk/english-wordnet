simpleMeaning: An open floor at the top of a house, just under the roof, often used to keep things
scope: An open floor at the top of a house, often used to keep things, also called an attic; not the big
  open floor over a place of trade, not the golf slant, and not drawing a ship's hull.
examples:
- The loft holds old boxes and winter clothes.
- They stored the trunk in the loft under the roof.
