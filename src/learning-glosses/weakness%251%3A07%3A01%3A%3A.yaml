simpleMeaning: When you cannot act at all, it shows you have no power
scope: Powerlessness shown by not being able to act, not the lack of body or mind strength that makes
  a thing likely to fail under strain.
examples:
- In spite of their weakness the group remains active.
- Their weakness showed when they could not act in time.
