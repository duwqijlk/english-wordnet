simpleMeaning: helping your body or your mind stay well
scope: This sense is about a thing that helps your body or mind stay well; it is not about a person who
  is already well and not ill.
examples:
- Eating vegetables is part of a healthful way of life.
- Regular sleep is healthful for both body and mind.
