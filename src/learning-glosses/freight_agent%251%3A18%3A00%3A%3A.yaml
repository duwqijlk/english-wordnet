simpleMeaning: For a firm that carries goods, this worker takes them in when they arrive and sends them
  on to where they must go.
scope: This names the person in charge of taking in and sending on goods for a firm that carries them.
examples:
- The freight agent signed for the crates when they arrived at the depot.
- Ask the freight agent about the delivery date for your goods.
