simpleMeaning: The set of beliefs held by any of the western Christian churches that broke away from the
  Church of Rome in the days of the Reformation.
scope: The set of beliefs held by the western Christian churches that broke away from the Church of Rome
  in the days of the Reformation, not the beliefs of the Church of Rome and not the beliefs of the eastern
  churches.
examples:
- Protestantism spread through northern Europe after the Reformation.
- He studied the history of Protestantism in his church class.
