simpleMeaning: a case of a thing getting better because loss, harm, or other change was stopped
scope: A thing getting better because loss, harm, or other change was stopped; also called preservation,
  not the physics rule that amounts stay the same.
examples:
- The conservation of the forest kept the valley green.
- Conservation of the old house saved it from ruin.
