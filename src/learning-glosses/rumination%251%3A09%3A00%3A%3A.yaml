simpleMeaning: thinking about something in a calm way for a long time, with close care and attention
scope: 'Also called reflection, contemplation, musing, and thoughtfulness: long calm thinking, not food
  coming back up in babies and not an animal chewing food again.'
examples:
- After long rumination, she finally understood what she wanted to do.
- His rumination on the problem lasted all evening.
