simpleMeaning: Set level in its lock, this flat metal bar holds a door shut when pushed by hand.
scope: Also called a slide bolt, this level metal bar in a lock is pushed by hand to hold a door shut.
examples:
- The sliding bolt slides across to hold the door shut.
- With the sliding bolt pushed across, the door stays shut.
