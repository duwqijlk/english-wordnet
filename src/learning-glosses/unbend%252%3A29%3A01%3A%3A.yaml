senseId: 'unbend%2:29:01::'
synsetId: 00026378-v
simpleMeaning: to become less tight or worried, to rest and feel calm and at ease
scope: Also called relax, unwind and decompress. This is about becoming calm and resting yourself, not
  about freeing the mind from stress or formality, and not about taking a sail off a ship.
examples:
- After work, he unbends with a cup of tea and a quiet book.
- She unbent after the hard exam and rested all afternoon.
