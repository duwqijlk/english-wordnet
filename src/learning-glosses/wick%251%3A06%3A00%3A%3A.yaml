simpleMeaning: a loosely woven cord in a candle or oil lamp that pulls fuel up through tiny tubes into
  the flame
scope: A cord in a candle or lamp that pulls fuel up to the flame, not any cord that moves liquid by itself.
examples:
- Trim the wick before you light the candle.
- The wick drew the oil up into a steady flame.
