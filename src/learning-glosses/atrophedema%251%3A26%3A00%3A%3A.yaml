senseId: 'atrophedema%1:26:00::'
synsetId: 14143792-n
simpleMeaning: big clear-edged patches of swelling under the skin come back in young women, start suddenly,
  fade within a day, often after food or drugs set off an allergy
scope: Also called angioedema, giant hives, and periodic edema; swelling under the skin that comes and
  goes, not a rash and not a swelling that stays.
examples:
- Her atrophedema came on suddenly, and the swelling under her skin was gone by the next day.
- The doctor said the atrophedema would keep coming back in big patches under her skin.
