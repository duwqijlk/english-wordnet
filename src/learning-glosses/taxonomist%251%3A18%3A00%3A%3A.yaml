senseId: 'taxonomist%1:18:00::'
synsetId: 10713320-n
simpleMeaning: a person who works in the study of living things and puts them in groups by their shape,
  their past, and their ways of life
scope: 'Also called a taxonomer and a systematist: a person who puts living things into groups, not a
  person who studies rocks and not a person who keeps a list of books.'
examples:
- The taxonomist put the new fish in a group with its close kin.
- A taxonomist spent the summer naming the beetles of the valley.
