simpleMeaning: a wild, confused uproar, often funny, that feels like a big public show
scope: 'Also called a circus: a wild, confused uproar like a big public show, not a traveling fair and
  not a festival of merrymaking.'
examples:
- It was so funny it was a carnival.
- The whole occasion had a carnival feel to it.
