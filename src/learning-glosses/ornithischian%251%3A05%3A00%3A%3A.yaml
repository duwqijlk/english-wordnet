simpleMeaning: A plant-eating dinosaur whose hip bones are set like a bird's
scope: A plant-eating dinosaur with hip bones set like a bird's, also called an ornithischian dinosaur;
  not a meat-eating dinosaur and not one with a lizard-like pelvis.
examples:
- The ornithischian grazed on low plants in the valley.
- Ornithischians had hip bones shaped like those of a bird.
