simpleMeaning: In speech, the last part of a stop sound, when held-back air is let out with force at the
  end
scope: In speech, not the act of something bursting apart and not the loud noise from it, and not a golf
  shot from sand.
examples:
- In the word 'top', the explosion of the final p is clear.
- The teacher pointed out the explosion after the t in 'cat'.
