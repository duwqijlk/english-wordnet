simpleMeaning: a part that lets electric flow pass very easily, set beside another device to take some
  of the flow away from it
scope: A part that takes some electric flow away from another device, not a road around a town and not
  a tube made in surgery.
examples:
- The bypass takes some of the current away from the main device.
- An engineer fitted a bypass beside the motor.
