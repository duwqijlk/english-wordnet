simpleMeaning: a tendency to not take care and to not care about what you should do
scope: 'Also called delinquency: a tendency to not take care and to not care, not one single act of failing
  to do a duty.'
examples:
- His dereliction grew over time, and he stopped caring about his work.
- Years of dereliction left her bills unpaid and her house in a mess.
