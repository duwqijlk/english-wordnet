simpleMeaning: blocking people who seek a hearing in court, by swaying or scaring a juror, a witness or
  a court officer; it can lead to a finding of contempt of court
scope: Blocking people who seek a hearing in court by swaying or scaring a juror, a witness or a court
  officer; not a fair trial itself and not a charge of lying in court.
examples:
- He was charged with obstruction of justice for scaring a witness.
- Obstruction of justice can lead to a finding of contempt of court.
