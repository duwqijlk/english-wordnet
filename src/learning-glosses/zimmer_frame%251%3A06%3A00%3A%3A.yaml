senseId: 'zimmer_frame%1:06:00::'
synsetId: 04552757-n
simpleMeaning: A light stand you step inside, with small rubber wheels and hand grips, that helps people
  who walk with trouble, or old people, to walk
scope: A light walking aid you stand inside; walker and Zimmer are other names for this sense, not a wheelchair
  you sit in and not a crutch held under the arm.
examples:
- Her Zimmer frame helped her walk to the kitchen.
- He leans on his Zimmer frame when he walks to the door.
