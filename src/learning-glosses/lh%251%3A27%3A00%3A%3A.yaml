simpleMeaning: A body chemical for the sex organs, from the front of a brain gland; it starts egg release
  in female mammals and male sex chemical release in male mammals
scope: Also called interstitial cell-stimulating hormone, luteinizing hormone, or ICSH; a body chemical
  from the front of a brain gland that starts egg release in females.
examples:
- LH starts the release of an egg in female animals.
- The vet tested LH levels in the male dog.
