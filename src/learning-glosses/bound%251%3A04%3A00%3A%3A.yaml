simpleMeaning: A light hop up or forward, powered by the mover's own body.
scope: 'Other names for this sense are spring, leap, bounce, leaping and saltation: a light jump up or
  forward, not the verb meaning to jump forward, and not the verb meaning to form a border.'
examples:
- With one bound, the cat cleared the fence.
- The deer took a bound and vanished into the trees.
