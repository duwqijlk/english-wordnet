simpleMeaning: Loud sounds that mix together in a confusing way and are unpleasant to hear
scope: Loud sounds that mix together in a confusing way and are unpleasant to hear, not a single loud
  harsh noise.
examples:
- The cacophony of voices in the hall made it hard to think.
- A cacophony of car horns rose from the street below.
