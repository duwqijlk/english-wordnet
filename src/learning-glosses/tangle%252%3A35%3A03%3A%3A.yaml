simpleMeaning: to make a thing mixed up and hard to work through
scope: To make a thing mixed up and hard to work through, not to twist things together into a hard mass
  and not to make a thing messy and out of place.
examples:
- The long lies tangled the story until no one could follow it.
- He tangled the plan with too many extra steps.
