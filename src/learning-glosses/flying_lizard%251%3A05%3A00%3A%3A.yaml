simpleMeaning: By opening thin skin flaps on each side of its body, this small lizard of warm Asia can
  glide through the air, one of several kinds.
scope: This lizard is also called a flying dragon and a dragon, and it glides on thin skin flaps on each
  side of its body, not on wings.
examples:
- The flying lizard spread the thin flaps on its sides and glided through the air.
- We watched a flying lizard glide through the air.
