scope: This is a common deer of the mild parts of Europe and Asia; elk, wapiti, red deer and American
  elk are other names for this sense, and it is not a deer of very hot or very cold lands.
examples:
- A Cervus elaphus grazed at the edge of the forest.
- We saw a herd of Cervus elaphus on the hillside.
