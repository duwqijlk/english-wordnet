simpleMeaning: a person who makes up short wise sayings, or who repeats them
scope: A person who makes up or repeats short wise sayings, not a poet and not a writer of long works
  of wisdom.
examples:
- The aphorist filled his notebook with short sayings about life.
- As an aphorist, she was known for lines people loved to quote.
