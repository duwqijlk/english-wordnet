simpleMeaning: 'This holding is not the favoured kind of shares: its owners get a share of the firm''s
  gains and a vote at owner meetings.'
scope: Also called common shares and ordinary shares, this is the part of a firm's shares that is not
  the favoured kind, giving owners a share of its gains and a vote.
examples:
- Over 40 million Americans invest in common stock.
- He held common stock in the firm.
