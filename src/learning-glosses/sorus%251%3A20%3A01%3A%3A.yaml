simpleMeaning: a group of tiny cases, usually on the back of a fern leaf, each case making spores
scope: A group of spore cases under a fern leaf; not a single spore, and not a flower or a seed.
examples:
- The sorus on the fern frond held rows of tiny brown cases.
- She saw a sorus under each leaf of the fern.
