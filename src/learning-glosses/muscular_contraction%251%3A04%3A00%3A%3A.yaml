simpleMeaning: Tightening is what a part or organ does, above all a soft part that moves the body or its
  threads, in the study of the body.
scope: Muscle contraction and contraction are other names for this shortening or tensing of a part or
  organ, above all a soft part that moves the body.
examples:
- A muscular contraction pulled the shoulder tight.
- A muscular contraction in the arm made the muscle grow shorter for a moment.
