simpleMeaning: A kind of daffodil with star-shaped pale blooms, often grown inside so it flowers in the
  cold months.
scope: A daffodil with pale star-shaped blooms, not a tulip and not a spring daffodil grown outdoors.
examples:
- The paper white bloomed on her windowsill in January.
- She planted paper whites in pots for winter.
