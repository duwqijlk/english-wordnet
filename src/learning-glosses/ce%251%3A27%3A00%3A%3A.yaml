simpleMeaning: A soft grey metal that bends and pulls thin, of the rare-earth group, used in the small
  stones that make sparks in lighters; the most common of that group.
scope: Also called cerium, atomic number 58; not the other rare-earth metals.
examples:
- Ce is used in lighter flints.
- Ce is the most abundant rare-earth metal.
