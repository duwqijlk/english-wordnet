simpleMeaning: In photography, the forming of a net of cracks or folds in the thin coat that holds a picture
  on film
scope: Not a crack in glass, and not the grain of the film itself; a net of cracks in the picture coat.
examples:
- Reticulation spoiled the print with a web of fine cracks.
- Heat can cause reticulation in old film.
