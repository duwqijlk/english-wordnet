simpleMeaning: A plain tool with a grooved wheel that a rope runs through, so a pull can change direction
  or act at a new point
scope: 'Block is another name for this sense: a grooved wheel that lets a rope change the direction of
  a pull, not a solid lump of wood or stone.'
examples:
- He rigged a pulley to the beam so he could haul the load up alone.
- The pulley changed the pull from downward to sideways.
