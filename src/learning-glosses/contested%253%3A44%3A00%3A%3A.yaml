simpleMeaning: argued about or fought over, because people do not agree who should have it or who is right
scope: This describes something people argue or compete over; it is not something everyone agrees on,
  and it is not a contest itself.
examples:
- The contested election result was checked again.
- They fought for the contested land for years.
