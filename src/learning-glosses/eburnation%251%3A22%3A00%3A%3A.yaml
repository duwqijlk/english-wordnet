simpleMeaning: In joints worn down by disease, bone turns into hard, smooth stuff much like ivory
scope: A change in a worn joint, not the wearing down itself and not a broken bone.
examples:
- The X-ray showed eburnation in her knee joint.
- Eburnation left the bone surface smooth and hard like ivory.
