simpleMeaning: To turn alike or the same all through, as when things are stirred together.
scope: To turn alike or the same all through, not to make another thing turn alike.
examples:
- Left in the pan, the sauces homogenized into one smooth mix.
- Over the weeks the two groups homogenized, sharing the same songs and jokes.
