simpleMeaning: a small, rough home made in a plain way, where a person lives
scope: 'Also called hut, hovel, shack, and shanty: a small rough home, not a cage for small animals.'
examples:
- They lived in a small hutch at the edge of the field.
- The old hutch had one room and a roof that let in rain.
