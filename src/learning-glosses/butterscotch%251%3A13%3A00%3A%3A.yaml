simpleMeaning: a hard candy that breaks easily, made with butter and brown sugar
scope: This sense is a hard candy made with butter and brown sugar; it is not a soft, sweet sauce and
  not a cake or a drink.
examples:
- She kept a bag of butterscotch in her desk for after lunch.
- He gave each child a piece of butterscotch wrapped in paper.
