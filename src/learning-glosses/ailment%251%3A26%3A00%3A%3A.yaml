senseId: 'ailment%1:26:00::'
synsetId: 14078890-n
simpleMeaning: a sickness of the body that often lasts a long time and gives a person a reason to say
  they are unhappy
scope: This sense is also called ill and complaint. It is a sickness of the body, not a short pain and
  not a hurt from an accident.
examples:
- She went to the doctor for a stomach ailment that had lasted for weeks.
- His back ailment kept him home from work for a long time.
