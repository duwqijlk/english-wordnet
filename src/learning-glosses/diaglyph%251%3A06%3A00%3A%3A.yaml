synsetId: 03581612-n
simpleMeaning: In the art of cutting stone, this is a design cut down into a stone or gem, the opposite
  of a raised design like a cameo
scope: Also called an intaglio; not a cameo, where the design stands out from the stone.
examples:
- The diaglyph was carved deep into the dark stone.
- Unlike a cameo, a diaglyph sinks its design into the gem.
