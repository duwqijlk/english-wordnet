simpleMeaning: Radical reform in China begun by Mao Zedong in 1965, run mostly by the Red Guard to wipe
  out foes in government, purging thinkers and bringing social and money chaos.
scope: 'Also called the Great Proletarian Cultural Revolution: a sweeping change in China in 1965, not
  a war and not a change in farm policy.'
examples:
- The Cultural Revolution began in 1965.
- Her family suffered during the Cultural Revolution.
