simpleMeaning: A system of keeping people apart by race and treating people who are not white unfairly
  in politics, money, work and law; once the official system in South Africa.
scope: This is the system of keeping people apart by race and treating people who are not white unfairly
  in politics, money, work and law, not just one unfair act toward a person.
examples:
- Under apartheid, people who were not white could not vote or use the same schools as white people.
- South Africa ended apartheid after many years and changed its laws.
