simpleMeaning: In mathematics, breaking an expression (a written group of numbers, letters and signs)
  into parts that give the first group when multiplied together
scope: 'Also called factorisation and factorization: this is the act of breaking a group into parts, not
  one of the parts itself and not just multiplying numbers.'
examples:
- Factoring the expression gave two smaller parts that multiply to make it again.
- In maths class, factoring helped them break the long expression into parts.
