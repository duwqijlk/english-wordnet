simpleMeaning: A small bush of southeast Asia that loses its leaves in winter, with leaves of many leaflets
  and bunches of red or purple flowers, used to make blue dye.
scope: A small bush of southeast Asia grown for its blue dye; not the dye itself.
examples:
- Indigo grew in the fields of the south.
- Farmers cut indigo to make the blue dye.
