simpleMeaning: a warm-American tree whose wood is like mahogany and whose fruit is sweet, egg-shaped,
  and good to eat; in some books it sits in the group Calocarpum
scope: A tropical American tree with mahogany-like wood and sweet egg-shaped fruit, not a tree grown only
  for its wood; mammee and marmalade tree are other names for this sense.
examples:
- The sapote in the yard bears sweet fruit every year.
- Carpenters like sapote wood because it looks like mahogany.
