simpleMeaning: the way things are placed so that they sit in a straight line, or in lines that run side
  by side
scope: The way things are set out in straight or side-by-side lines, not the act of moving a machine's
  parts into line and not the meeting of stars or planets in the sky.
examples:
- The alignment of the fence posts made the field look neat.
- They checked the alignment of the tiles before the glue dried.
