simpleMeaning: a clash between two feelings felt at the same time that cannot both be acted on
scope: A clash between two feelings felt at the same time, not a clash in a play or story and not two
  things that do not fit together.
examples:
- He was torn by conflict between love and duty.
- Her conflict left her unable to choose.
