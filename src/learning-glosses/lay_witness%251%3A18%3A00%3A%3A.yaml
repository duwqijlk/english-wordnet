senseId: 'lay_witness%1:18:00::'
synsetId: 10270570-n
simpleMeaning: A person who gives facts in court from what they saw or know, not as a trained specialist
scope: A person who speaks in court about what they saw or know, not a trained specialist called to give
  expert views and not a person who only watches a trial.
examples:
- The lay witness told the court what she had seen that morning.
- As a lay witness, he could only speak about the crash he had watched.
