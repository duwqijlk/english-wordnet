senseId: 'kaffir_boom%1:20:01::'
synsetId: 12548614-n
simpleMeaning: A small tree of eastern South Africa, wide-spreading and leafy most of the year, with orange-scarlet
  flowers and coral-red seeds. Its light soft wood makes fence posts and shingles.
scope: This sense is the broad-spreading South African tree with orange-scarlet flowers and light wood
  for posts (its common name is dated and offensive), not the similar tree with dense clusters of clear
  scarlet flowers.
examples:
- The kaffir boom puts out orange-scarlet flowers in spring.
- Fence posts were cut from the light wood of the kaffir boom.
