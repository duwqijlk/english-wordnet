simpleMeaning: having qualities or skills that deserve to be noticed in some way
scope: This is having qualities or skills that deserve notice in some way; not the general sense of having
  value and being good in character, and not being fit to be chosen as a husband or wife.
examples:
- Her work is worthy of praise.
- He wrote a book worthy of attention.
