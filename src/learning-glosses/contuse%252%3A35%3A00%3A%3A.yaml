simpleMeaning: to hurt the soft flesh or bone under the skin
scope: To hurt the flesh or bone under the skin without breaking the skin; bruise is another name for
  this sense, not a cut that opens the skin.
examples:
- He contused his knee when he fell on the stairs.
- The blow contused her arm, leaving a dark mark under the skin.
