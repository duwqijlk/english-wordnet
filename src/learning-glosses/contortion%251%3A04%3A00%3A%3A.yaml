simpleMeaning: the act of twisting something, or your own body, so that it changes shape in a strange
  way
scope: 'Also called deformation: twisting something out of its normal shape, not a straight cut or break
  and not a normal turn.'
examples:
- Her contortion let her fit through the small opening.
- The contortion of the metal bar took great force.
