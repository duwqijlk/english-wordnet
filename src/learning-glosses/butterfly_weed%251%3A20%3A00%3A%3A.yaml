simpleMeaning: A plant that stands straight up and comes back year after year, from the east and south
  of the United States, with bright orange flowers
scope: A plant that stands straight up and comes back year after year, with bright orange flowers; chigger
  flower, chiggerflower, orange milkweed and pleurisy root are other names for this sense, not a low spreading
  plant and not a plant with pale flowers.
examples:
- Butterfly weed grew along the roadside.
- The butterfly weed had bright orange flowers.
