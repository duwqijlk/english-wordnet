simpleMeaning: A hard, silver-white metal that can be made into a magnet and joins in two or three ways;
  a tiny bit of it is needed in plants and animals.
scope: Also called Co, atomic number 27; not the blue colour or paint of the same name.
examples:
- Cobalt is a hard metal used in magnets.
- Plants need a trace of cobalt to grow.
