senseId: 'retrograde%2:38:02::'
synsetId: 01999129-v
simpleMeaning: To move back in a path, of sky-bodies.
scope: This sense is to move back in a path, of sky-bodies, unlike the sense for, of loss of mind, touching
  the time just before a hurt, unlike the sense for moving from east to west on the sky ball, or, for
  wanderers, round the sun the wrong way to the Earth, and unlike the sense for moving, or set, or tending
  back, or against an old way.
examples:
- The planet retrogrades, moving back in a path.
- Planets retrograde, moving back.
