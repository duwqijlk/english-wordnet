simpleMeaning: A way of thinking, or a study of media, that looks at what lies past the reach of the study
  of being
scope: A way of thinking, or a study of media, that looks at what lies past the reach of the study of
  being, not the study of being itself and not plain science.
examples:
- His essay on pataphysics treated jokes as if they were laws of nature.
- Pataphysics asks what happens past the edge of serious thought.
