simpleMeaning: an old name for a soft-stemmed plant that is used to treat illness.
scope: This is not the usual adjective meaning 'easy' or 'plain'; here it names a kind of plant.
examples:
- In the past, healers made medicines from simples grown in the garden.
- The old herb book lists simples for coughs and fevers.
