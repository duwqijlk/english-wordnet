senseId: 'microscopic%3:01:00::'
synsetId: 02930157-a
simpleMeaning: of or about, or used in, the work of looking at very small things with a tool that makes
  them look much bigger
scope: 'Also called microscopical: about the work or tools for looking at very small things, not about
  a thing being so small that the eye cannot see it, and not about a thing being seen with such a tool.'
examples:
- In microscopic study, scientists use a special tool to look at very small things.
- She learned microscopic methods for checking tiny living things in water.
