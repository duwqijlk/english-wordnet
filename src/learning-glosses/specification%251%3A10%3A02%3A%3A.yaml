simpleMeaning: In patent law, a paper written by a person asking for a patent, giving a full and clear
  account of what the invention is and how it is used
scope: In patent law, a paper that sets out an invention for a patent; not a list of needs for a job,
  and not a rule book.
examples:
- The specification gave every detail of the new engine.
- He read the specification before filing the patent.
