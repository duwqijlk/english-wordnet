simpleMeaning: The shaking back and forth of a thing, over and over again.
scope: The act of shaking back and forth over and over, not a set pattern of values in physics and not
  a feeling sensed in a moment.
examples:
- The vibration of the engine shook the whole car.
- You can feel the vibration of the washing machine through the floor.
