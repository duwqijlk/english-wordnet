simpleMeaning: A short-handled tool with a round ball holding a sponge, used for sprinkling holy water
scope: A short-handled tool with a round ball holding a sponge, also called an aspersorium; not the bowl
  that holds holy water and not a brush for painting.
examples:
- The priest used the aspergill to sprinkle holy water over the crowd.
- An aspergill holds a sponge in a round ball on a short handle.
