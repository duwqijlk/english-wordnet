simpleMeaning: in basketball, the team member who plays the middle position
scope: This is the basketball player, not the football lineman, not the middle point of a line, and not
  a shopping complex.
examples:
- The team's center grabbed the rebound and passed it to the point guard.
- At seven feet tall, he was drafted to play center for a professional basketball team.
