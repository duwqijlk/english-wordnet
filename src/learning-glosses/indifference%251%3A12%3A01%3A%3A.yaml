senseId: 'indifference%1:12:01::'
synsetId: 07498922-n
simpleMeaning: A lack of all feeling, shown by no feeling in anything you say or do
scope: A lack of all feeling that shows in what you do, not staying calm while seeming not to care, not
  a lack of interest, and not a fair lack of care.
examples:
- Her indifference showed in her flat voice and still face.
- He answered with indifference, as if nothing had happened.
