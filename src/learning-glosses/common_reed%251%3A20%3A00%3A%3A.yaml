simpleMeaning: a tall North American reed with fairly broad leaves and large, feather-like flower clusters;
  it grows widely in wet places and is used for mats, screens and arrow shafts.
scope: This is the tall North American wetland grass also called carrizo and ditch reed, not a musical
  reed or bamboo.
examples:
- Common reed spreads quickly through wet ground and roadside ditches.
- They harvested common reed for mats, screens and arrow shafts.
