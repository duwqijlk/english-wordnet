simpleMeaning: In the eastern United States and the hot lands of America, this grass hides its small seed
  heads inside prickly cases.
scope: Field sandbur and sandspur are other names for this grass of the eastern United States and hot
  lands of America, with small seed heads shut inside prickly cases.
examples:
- The sandburs caught on my trousers as I walked through the field.
- In the field, sandbur grew thick.
