senseId: 'strobe_light%1:06:00::'
synsetId: 04347599-n
simpleMeaning: A scientific instrument giving a flashing light in time with an object's regular movement,
  which can make the moving object look still.
scope: Strobe and stroboscope are other names for this tool, which flashes in time with a thing moving
  back and forth.
examples:
- The strobe light flashed in time with the fan, and the blades looked still.
- The strobe light made the spinning wheel look as if it had stopped.
