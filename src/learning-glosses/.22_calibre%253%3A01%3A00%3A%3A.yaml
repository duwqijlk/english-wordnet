simpleMeaning: said of a gun, or the shot it fires, when the hole down the barrel is a little more than
  a fifth of an inch wide
scope: It is also called .22-caliber, .22-calibre, and .22 caliber, and it is said of a gun or its shot
  when the hole down the barrel is a little more than a fifth of an inch wide, not of one with a wider
  bore.
examples:
- She held a .22 calibre pistol.
- He bought a .22 calibre rifle.
