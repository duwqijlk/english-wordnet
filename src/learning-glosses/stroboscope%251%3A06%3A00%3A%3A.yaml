synsetId: 04347599-n
simpleMeaning: Short bright flashes from this tool, timed to the beat of a thing moving back and forth,
  make the thing look still.
scope: Strobe and strobe light are other names for this tool, whose flashes match the beat of a moving
  thing.
examples:
- The stroboscope flashed in time with the wheel, and the spokes looked still.
- The stroboscope made the turning fan look as if it had stopped.
