simpleMeaning: a maths rule whose picture, drawn on plain graph paper with even scales, is a straight
  line
scope: A maths rule whose picture on plain graph paper is a straight line; not a rule whose picture is
  a curve and not a rule with no picture at all.
examples:
- The height of a candle is a linear function of the time it has been burning.
- A linear function of time tells you how far the car has gone.
