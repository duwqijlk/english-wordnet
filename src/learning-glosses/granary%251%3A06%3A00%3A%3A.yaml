simpleMeaning: a building where grain that has been beaten to free the seeds is kept, or where food for
  farm animals is kept
scope: Also called garner, this is a building for keeping grain or animal food, not a field where grain
  grows and not the grain itself.
examples:
- They stored the wheat in the granary after the harvest.
- The old granary still holds feed for the cattle in winter.
