simpleMeaning: a person who keeps a book in which they write down what happens to them each day
scope: A person who writes down their own days in a book, not a person who writes news for a paper or
  a news show.
examples:
- The journalist kept a daily record of his life in a small book.
- As a journalist, she wrote in her diary every night before bed.
