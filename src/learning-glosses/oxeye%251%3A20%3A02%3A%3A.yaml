simpleMeaning: With big yellow blooms like daisies, it is one of many North American bushy herbs that
  live year after year, in the group Heliopsis.
scope: 'It is also called heliopsis: one of many North American bushy herbs with big yellow blooms like
  daisies, not the Eurasian kind with yellow rays and dark centres.'
examples:
- The oxeye bloomed yellow like a daisy.
- Oxeye grows in North America.
