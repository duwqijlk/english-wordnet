simpleMeaning: A tall flat rock set upright on a heap of rocks was the old way to mark a place.
scope: Also called mearstone and merestone, it was an old name for a heap of rocks that marked a place.
examples:
- They set up the meerestone to mark the boundary.
- The old meerestone still marked the place.
