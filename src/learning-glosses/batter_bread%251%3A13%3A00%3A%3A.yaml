simpleMeaning: Served with a spoon, most often in the south, this soft food is made from cornmeal, and
  at times rice or hominy.
scope: This soft food made from cornmeal that must be served with a spoon is also called spoon bread.
examples:
- The batter bread needed a spoon because it was so soft.
- A spoon was the only way to serve the batter bread.
