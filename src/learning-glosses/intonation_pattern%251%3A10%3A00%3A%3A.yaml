simpleMeaning: the ways the voice rises and falls that mark a question, a request, or a statement
scope: The ways the voice rises and falls that mark a question, a request, or a statement; not the words
  themselves and not a single rise or fall of the voice.
examples:
- In English, a rising intonation pattern often marks a question.
- She used a falling intonation pattern to make her words sound like a statement.
