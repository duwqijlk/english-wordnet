simpleMeaning: So the doctor can look inside the eye, this medicine makes the black opening in the middle
  of the eye grow wider
scope: 'Also called a mydriatic: this medicine makes the black opening of the eye grow wider so the doctor
  can look inside it, not a medicine that makes the opening grow smaller.'
examples:
- The doctor used a mydriatic drug before checking her eyes.
- A mydriatic drug was put in his eye so the pupil would grow wider.
