simpleMeaning: a group of plants with two seed leaves, trees and bushes and small green plants, that have
  moved fairly far along in how plants change over time
scope: A group of two-seed-leaf plants, trees and bushes and small green plants, that have moved fairly
  far along in how plants change over time, and not a group of plants with one seed leaf or a group of
  simple plants like mosses.
examples:
- Botanists put the tree in a dilleniid dicot genus.
- The new shrub was placed in a dilleniid dicot genus.
