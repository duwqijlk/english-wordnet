senseId: 'instrumentation%1:04:00::'
synsetId: 00098168-n
simpleMeaning: The act of providing the tools a job needs, or of using them to do it
scope: This is the giving or using of tools for a job. It is not arranging music for players in a large
  group, not the tools named in a piece of music, and not a tool or other thing that someone uses to do
  a job.
examples:
- The instrumentation of the new factory took months, as each test place was given the tools it needed.
- She led the instrumentation of the study, using the tools herself to run each test.
