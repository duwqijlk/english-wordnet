simpleMeaning: With spotted green and silver blades with a broad base and a point, smelling sharp, this
  low evergreen plant lives for years and grows from Virginia to South Carolina
scope: Also called heart-leaf, this is a low plant of Virginia to South Carolina, not the wild ginger
  with the same name.
examples:
- Heartleaf grows from Virginia to South Carolina.
- The heartleaf in the pot has leaves that smell sharp.
