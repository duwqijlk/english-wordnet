simpleMeaning: The young form of the potato moth that eats its way through the leaves and stems of plants
  such as potatoes and tobacco
scope: Also called potato tuberworm, this is the young form of the moth, not the grown moth itself.
examples:
- Phthorimaea operculella larvae tunnelled through the potato leaves.
- The Phthorimaea operculella had mined the tobacco stems.
