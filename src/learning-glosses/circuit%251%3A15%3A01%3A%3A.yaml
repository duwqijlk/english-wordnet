simpleMeaning: the line that runs round the edge of an area or a thing
scope: The line round the edge of an area or thing, not a racetrack, not the law court area, and not the
  act of going round.
examples:
- They walked the full circuit of the lake before dark.
- The wall runs round the whole circuit of the old town.
