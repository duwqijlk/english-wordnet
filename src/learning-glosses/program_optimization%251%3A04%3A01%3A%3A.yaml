simpleMeaning: The work of changing software so that one part of it works better or uses fewer resources
scope: 'Also called program optimisation, software optimisation, and software optimization: the work of
  making a computer system run better, not writing a new system and not testing one.'
examples:
- Program optimization helped the game run at full speed.
- After program optimization, the old laptop used far less memory.
