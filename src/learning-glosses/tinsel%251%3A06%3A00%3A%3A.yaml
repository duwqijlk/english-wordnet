simpleMeaning: a thread with small shiny pieces of thin metal fixed to it
scope: This is the real thread with shiny metal on it, not the sense of a showy thing with almost no real
  worth, and not the act of putting such thread on something.
examples:
- She hung long lines of tinsel on the tree.
- Strands of silver tinsel hung from the branches.
