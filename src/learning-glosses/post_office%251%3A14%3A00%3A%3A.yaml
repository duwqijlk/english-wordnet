simpleMeaning: This branch of the government of the United States runs on its own and brings letters and
  parcels to people and firms, and at times phone calls and messages.
scope: Also called PO, United States Post Office and US Post Office; a branch of the country's government
  that brings mail to people and firms, not a private firm that moves parcels and not a place that only
  sells stamps.
examples:
- I left the parcel at the Post Office for delivery.
- The Post Office brings letters to our house every day.
