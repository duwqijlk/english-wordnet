simpleMeaning: Rushing streams carry this clay, silt, or gravel along, then drop it where the water slows
  down.
scope: 'Also called alluvium, alluvial sediment, and alluvion: clay, silt, or gravel that rushing streams
  carry and drop where the water slows, not clay or gravel left by wind.'
examples:
- The alluvial deposit lay where the stream slowed down.
- The rushing stream left an alluvial deposit of clay and gravel.
