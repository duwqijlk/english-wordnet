simpleMeaning: The push a gas makes, often taken to mean the push of a gas in touch with the liquid it
  sits over.
scope: Also called vapor pressure, this is the push a gas makes, often taken to mean the push of the gas
  in touch with its liquid, not the push of the liquid itself.
examples:
- They measured the vapour pressure of the gas above the liquid.
- The vapour pressure of the gas was the figure they wrote down.
