simpleMeaning: Polite care for what other people feel
scope: Polite care for the feelings of others; respect is another name for this sense, not a readiness
  to give way to their will and not a spoken sign of esteem.
examples:
- In deference to your wishes, we will keep the meeting short.
- She spoke in deference to his privacy and asked no more questions.
