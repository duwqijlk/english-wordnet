simpleMeaning: With small flower heads set in stars of shiny whitish leaf-like parts, this mountain plant
  of Europe lives for years, its leaves covered in whitish down.
scope: This is a mountain plant of Europe with small flower heads in stars, not a plant with large showy
  flowers.
examples:
- Edelweiss grows high in the mountains of Europe.
- You can tell the edelweiss by the stars of whitish leaf-like parts round its small flower heads.
