simpleMeaning: to stop blaming a person for a wrong thing they did, and to let them go free of blame for
  it
scope: To stop blaming a person for a wrong act; it is about letting go of anger and blame, not about
  saying the act was right.
examples:
- She forgave her brother for breaking her bike.
- He asked his friend to forgive him for lying.
