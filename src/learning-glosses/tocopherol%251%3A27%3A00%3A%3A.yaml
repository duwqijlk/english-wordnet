simpleMeaning: The body needs this vitamin, which melts in fat, for young to be made in the normal way,
  and it guards the body by making harmful loose bits harmless.
scope: Among vitamins, this is the one that melts in fat, needed for young to be made in the normal way
  and for guarding the body from harmful loose bits.
examples:
- For young to be made in the normal way, the body needs tocopherol.
- By making harmful bits harmless, tocopherol guards the body.
