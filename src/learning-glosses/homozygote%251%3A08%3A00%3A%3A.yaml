simpleMeaning: A living thing in genetics whose young keep the same mark, because it has two same copies
  of one gene.
scope: In genetics, this is a living thing with two same copies of one gene, not one with two unlike copies.
examples:
- The homozygote bred true.
- Its young kept the same mark, so it was a homozygote.
