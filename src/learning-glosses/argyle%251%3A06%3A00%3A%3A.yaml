simpleMeaning: A sock knitted or woven with a pattern of coloured diamonds.
scope: A sock knitted or woven with a pattern of coloured diamonds; not the diamond pattern itself, and
  not the covered holder for gravy, of silver or another metal, with a cup in the middle that comes out
  and holds hot water to keep the gravy warm.
examples:
- He wore argyle socks with his brogues.
- Her argyle socks had a pattern of red and green diamonds.
