simpleMeaning: To cover a thing with a thin, wet, slippery coating, or to leave such a mark on it.
scope: To cover or mark a thing with a thin, wet, slippery coating.
examples:
- The snail slimed the leaf as it crawled across.
- Algae slimed the stones by the pond.
