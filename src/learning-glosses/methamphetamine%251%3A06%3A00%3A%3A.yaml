simpleMeaning: a drug made from amphetamine (a drug that speeds up the body), sold as Methedrine, in clear
  crystal salt form; it speeds up the nerves and cuts hunger
scope: Also called glass, ice, trash, chalk, meth, crank, shabu, chicken feed, deoxyephedrine and methamphetamine
  hydrochloride. This is the drug itself, not the ordinary glass, ice or chalk senses of those names.
examples:
- The police seized methamphetamine from the car.
- He was arrested for making methamphetamine in his garage.
