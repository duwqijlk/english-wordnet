simpleMeaning: A drug, sold as Azactam, that kills germs in bad infections and has very few unwanted effects
scope: A drug that kills germs in bad infections, not a drug for mild infections and not a drug with many
  unwanted effects.
examples:
- The doctor gave her aztreonam for the severe infection.
- Aztreonam worked well and gave him almost no side effects.
