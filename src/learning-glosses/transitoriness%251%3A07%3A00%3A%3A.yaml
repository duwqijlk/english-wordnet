senseId: 'transitoriness%1:07:00::'
synsetId: 05062429-n
simpleMeaning: The short-lived nature of things, pointing to their sure end or death.
scope: This sense is also called transience, for the short-lived nature of things, pointing to their sure
  end or death, unlike the sense for the mark of being brief or fleeting.
examples:
- He mused on the transitoriness of life.
- Transitoriness means all things must end.
