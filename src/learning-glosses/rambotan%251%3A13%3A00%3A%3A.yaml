simpleMeaning: From Malaya comes this oval fruit, bright red and covered with soft spikes, with a taste
  that is pleasantly sharp.
scope: This bright red oval fruit from Malaya is also called a rambutan, and it is covered with soft spikes
  and tastes pleasantly sharp.
examples:
- The rambotan was bright red, oval, and covered with soft spikes.
- We ate rambotan, and its taste was pleasantly sharp.
