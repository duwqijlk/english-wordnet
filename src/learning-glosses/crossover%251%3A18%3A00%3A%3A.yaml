simpleMeaning: a person listed as a member of one party but who votes in the other party's first vote
  to choose its person for the main vote
scope: A voter from one party who votes in another party's first vote; not a path across a road or railway
  and not a mix of music styles.
examples:
- As a crossover, she voted in the other party's primary.
- The crossover was listed with one party but voted in the other's primary.
