simpleMeaning: a state in which a living thing seems dead during very dry times and comes back to life
  when water returns
scope: A living thing's seeming death in very dry times, not death itself and not sleep.
examples:
- In anabiosis, the tiny creature seemed dead until rain came.
- Anabiosis lets some animals wait out a drought and revive.
