simpleMeaning: one of two flat muscles that turn, bend, or stretch the head and neck, running from the
  upper bones of the back to the base of the skull
scope: Also called splenius muscle, it is one of the two flat muscles of the neck.
examples:
- The splenius helps to turn the head.
- The splenius moves the head and neck.
