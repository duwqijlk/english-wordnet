simpleMeaning: An artery that brings blood to the hip joint and the muscles of the thigh.
scope: 'Also called circumflex artery of the thigh: an artery that brings blood to the hip joint and the
  muscles of the thigh, not the main artery of the leg and not a vein.'
examples:
- The arteria circumflexa femoris feeds the muscles of the thigh.
- Blood reaches the hip joint through the arteria circumflexa femoris.
