simpleMeaning: In grammar, a verb form used for an action that is still going on
scope: 'Also called progressive: in grammar, a verb form for an action still going on, not a flaw in a
  thing and not a verb form for an action already finished.'
examples:
- In French, the imperfect is used to say what was happening.
- The imperfect form shows that the action was still going on.
