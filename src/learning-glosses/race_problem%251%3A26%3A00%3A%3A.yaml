simpleMeaning: trouble in public life caused by fighting between peoples who live in the same place or
  in places next to each other
scope: Trouble in public life caused by fighting between peoples who live near each other, not a private
  quarrel and not a problem about one group alone.
examples:
- The race problem in the town grew worse after the new laws.
- Leaders met to talk about the race problem in their region.
