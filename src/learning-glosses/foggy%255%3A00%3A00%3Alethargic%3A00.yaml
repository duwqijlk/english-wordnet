simpleMeaning: Dazed and slow to react, as if stunned by blows, drink, or tiredness
scope: 'Also called dazed: stunned and slow to react, not full of mist and not hard to see clearly.'
examples:
- He felt foggy after the long night.
- The blow left him foggy and slow.
