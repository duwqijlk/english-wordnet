simpleMeaning: A fragrant, rounded bush of the southwestern US and nearby Mexico, with brittle stems,
  small crowded blue-green leaves and yellow flowers; its resin goes into incense, varnish and folk medicine.
scope: A fragrant shrub of the southwestern US and nearby Mexico, also called brittle bush, brittlebush
  and incienso, with resin used in incense, varnish and folk medicine.
examples:
- Encelia farinosa grows on dry hills in the desert.
- The resin of Encelia farinosa scents incense.
