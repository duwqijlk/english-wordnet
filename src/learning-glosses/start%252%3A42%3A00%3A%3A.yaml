simpleMeaning: to have a first point, whether in time, in place, or in a range of amounts or values.
scope: This sense is not the act of setting something else going, and not a marked line; it describes
  something that itself has a first point.
examples:
- The movie starts at eight.
- Prices start at twenty dollars.
