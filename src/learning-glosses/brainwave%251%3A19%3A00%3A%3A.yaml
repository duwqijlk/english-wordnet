simpleMeaning: Read by a machine that tracks the head's electric signs, these are quick ups and downs
  in power between parts of the outer layer of the thinking organ.
scope: Also called brain wave and cortical potential, these are quick ups and downs in power in the outer
  layer of the thinking organ, read by a machine, not the stillness of brain death.
examples:
- The brainwave showed quick ups and downs in power.
- His brainwave was read by a machine that tracks the head's electric signs.
