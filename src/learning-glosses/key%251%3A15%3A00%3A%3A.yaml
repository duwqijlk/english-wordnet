simpleMeaning: In basketball, the marked lane in front of each basket, running from the basket out to
  the free-throw line, is often painted a different color from the rest of the court.
scope: This is the painted basketball court area by the basket, not the metal device that opens a lock,
  not the lever pressed on a keyboard, not the set of musical notes a piece is built on, not a list of
  test answers, not a legend explaining symbols, not the central stone at the top of an arch, and not
  the adjective meaning essential.
examples:
- The point guard dribbled to the top of the key and called the play.
- The referee caught her staying in the key for more than three seconds.
