simpleMeaning: a mechanical part in a camera that controls the size of the opening in its lens
scope: 'Also called a stop: the part of a camera that controls how wide the lens opening is. Not the muscle
  in the body used for breathing, not the birth-control cup, and not the part that makes sound in a speaker.'
examples:
- The camera's diaphragm opens wide when there is little light.
- She set the diaphragm to let in less light for the photo.
