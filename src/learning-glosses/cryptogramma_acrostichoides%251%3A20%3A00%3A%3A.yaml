simpleMeaning: A rock-loving fern of northern North America that grows in large tufts, with leaves like
  parsley.
scope: 'Also called American parsley fern and American rock brake: a fern of rocks in northern North America,
  growing in large tufts, distinct from ferns of woods and wet ground.'
examples:
- Cryptogramma acrostichoides grows in thick tufts on the rocks above the stream.
- The fronds of Cryptogramma acrostichoides look a little like parsley.
