schema: oewn-learning-gloss-v2
senseId: 'imperfective%1:24:00::'
synsetId: 13827232-n
simpleMeaning: It looks at what a verb does without saying when the action starts or when it ends
scope: This is a way of looking at a verb's action with no thought of its start or end; imperfective aspect
  is another name for this sense, not the perfective way of looking at an action as done.
examples:
- In the imperfective, the verb shows an action still going on.
- The imperfective does not tell us when the action began or finished.
