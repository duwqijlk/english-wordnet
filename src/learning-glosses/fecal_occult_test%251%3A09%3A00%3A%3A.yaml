simpleMeaning: Used to find cancers of the large bowel, this home check has you take bits of stool and
  have them checked for small signs of blood.
scope: Faecal occult test and stool test are other names for this home check.
examples:
- He took the fecal occult test at home.
- The fecal occult test looks for small signs of blood in the stool.
