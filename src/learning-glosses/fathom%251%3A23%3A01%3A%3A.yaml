simpleMeaning: a unit for measuring how deep water is, equal to 6 feet
scope: A unit for measuring water depth, equal to 6 feet, not the mining measure of ore and not the act
  of measuring depth.
examples:
- The water here is only two fathoms deep.
- The sailor called out the depth in fathoms as the ship moved in.
