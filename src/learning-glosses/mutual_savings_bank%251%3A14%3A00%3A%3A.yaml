simpleMeaning: The people who put money in it own this place for saving money, a group of trusted people
  runs it, and the state has given it leave to work
scope: A place for saving money owned by the people who put money in it and run by a group of trusted
  people, not a place owned by outside owners.
examples:
- She opened an account at the mutual savings bank in her town.
- The mutual savings bank is owned by its depositors, not by outside owners.
