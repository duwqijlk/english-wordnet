simpleMeaning: In Islam, an unseen spirit named in the Koran; Muslims believe it lives on earth and can
  appear as a person or an animal and change what people do
scope: 'Also called jinnee, djinn, djinni, djinny, and jinni: an unseen spirit in Islam that can take
  the shape of a person or an animal, not a real person and not an ordinary animal.'
examples:
- In the story, a genie took the shape of a tall man to speak to the people.
- People in the tale believed a genie could appear as an animal and change what happened to them.
