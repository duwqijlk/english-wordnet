simpleMeaning: The act of coming together into woolly, cloud-like lumps.
scope: The act of coming together into woolly, cloud-like lumps; not the act of breaking apart and not
  one lump on its own.
examples:
- Flocculation in the tank made the fine bits gather into soft lumps.
- The chemist watched flocculation turn the cloudy liquid clear.
