simpleMeaning: The distance in degrees between the equator (a line around the middle of a planet or star)
  and an imaginary line around it that runs in the same direction
scope: This is the distance in degrees from the equator, not the line around the Earth itself and not
  freedom to act or think as you choose.
examples:
- The city is at a latitude of 51 degrees north of the equator.
- That island's latitude puts it far south of the equator.
