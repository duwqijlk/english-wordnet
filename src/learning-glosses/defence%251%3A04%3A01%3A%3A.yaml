simpleMeaning: the act of keeping a person or thing safe from attack or harm
scope: 'Also called defense: the act of keeping a person or thing safe from attack or harm, not a group
  that fights off an attack and not a wall or other built thing that holds back an attack.'
examples:
- A good boxer needs a good defence.
- Defence against storms is an urgent problem here.
