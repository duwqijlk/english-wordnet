simpleMeaning: A weapon that steers itself toward the warmth given off by a jet engine or another hot
  target
scope: This is a weapon that finds its target by its heat, not one that follows a set path or one aimed
  by hand.
examples:
- The heat-seeking missile locked onto the jet's hot exhaust.
- A heat-seeking missile can follow the heat of an engine in the dark.
