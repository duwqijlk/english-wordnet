simpleMeaning: A much-loved food from under the ground, one of several fungi of the group called Tuber
  that can be eaten and grow wild in south-west Europe.
scope: Also called truffle and earth-ball; it is a fungus that grows under the ground, not a nut that
  grows on a tree.
examples:
- They dug up an earthnut in the woods.
- Earthnuts are prized by cooks in south-west Europe.
