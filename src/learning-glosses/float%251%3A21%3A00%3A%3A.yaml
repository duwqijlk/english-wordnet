simpleMeaning: The number of a company's shares that are in circulation and can be bought or sold by the
  public.
scope: In finance, the count of a company's shares open to public trading, not an object that stays on
  water, a parade platform, or a sweet iced drink.
examples:
- The company has a large float, so its shares trade easily.
- Analysts watch the float to gauge how many shares are actually available.
