simpleMeaning: Feeding on the blood of animals with backbones, people among them, this young biting creature
  leaves a strong itch.
scope: It is also called jigger, chigger, and redbug, and it is the young biting creature, not the grown
  one.
examples:
- Harvest mites bit her and left a strong itch.
- The harvest mites left him itching badly.
