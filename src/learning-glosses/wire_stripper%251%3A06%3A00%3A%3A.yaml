simpleMeaning: a hand tool used by electricians to take the cover off the cut end of a cable
scope: A hand tool for taking the cover off the end of a cable, not a tool for cutting cable and not a
  tool for joining cables.
examples:
- The electrician reached for his wire stripper to bare the ends of the cable.
- Use a wire stripper, not a knife, to take the cover off the wire.
