simpleMeaning: Send a die rolling across a table or other flat surface.
scope: This is sending a die out to land on a surface to get a number, not hurling any object through
  the air, and not the noun for a single gamble with dice.
examples:
- He threw a six and moved his piece three spaces.
- It is your turn to throw the dice.
