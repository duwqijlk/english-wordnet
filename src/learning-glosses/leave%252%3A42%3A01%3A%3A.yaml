simpleMeaning: make something possible or give someone a chance at it; allow something to be reached or
  let it stay as it is
scope: Not about forgetting to take something by accident, keeping something untouched, or giving property
  after death.
examples:
- The new rules leave room for smaller firms to compete.
- Cancel the meeting now, and that leaves us free to travel on Friday.
