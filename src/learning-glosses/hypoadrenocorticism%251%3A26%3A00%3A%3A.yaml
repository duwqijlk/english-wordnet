simpleMeaning: People with this disorder grow weak and worn out, with too few red blood cells and brownish
  skin, because the outer layer of the gland above the kidney fails.
scope: Also called hypoadrenalism, this is a disorder in which the gland above the kidney stops working,
  not a sickness of the kidney itself.
examples:
- Hypoadrenocorticism left him weak and worn out, his skin turning brownish.
- Her hypoadrenocorticism showed in too few red blood cells and skin gone brown.
