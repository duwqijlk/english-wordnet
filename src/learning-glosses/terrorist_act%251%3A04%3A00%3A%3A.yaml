simpleMeaning: By fear or by making people do as told, force is planned against ordinary people, or the
  threat of it, to reach political, religious, or belief-based ends.
scope: People also call it terrorism or an act of terrorism, and it is the planned use of force, or the
  threat of force, against ordinary people to reach political, religious, or belief-based ends by fear
  or by making people do as told.
examples:
- The blast was blamed on a terrorist act.
- A terrorist act shut the whole city down.
