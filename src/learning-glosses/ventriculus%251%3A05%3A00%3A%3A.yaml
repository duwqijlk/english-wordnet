senseId: 'ventriculus%1:05:00::'
synsetId: 01976870-n
simpleMeaning: Food is ground up in a pouch of muscle with thick walls below the food store in the throat
  of many birds and reptiles.
scope: Also called the gizzard or the gastric mill, this is the thick-walled pouch of muscle below the
  food store in the throat, not the food store itself.
examples:
- The bird's ventriculus ground the food it had swallowed.
- Food passes from the crop into the ventriculus to be ground up.
