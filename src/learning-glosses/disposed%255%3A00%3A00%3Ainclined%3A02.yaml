simpleMeaning: likely by nature to feel or act a certain way, usually with 'to' after it
scope: Likely by nature to feel or act a certain way, usually followed by 'to'; not a choice made on the
  spot and not a passing mood.
examples:
- He is disposed to ignore matters he thinks are unimportant.
- I am not disposed to answer any questions.
