simpleMeaning: With blue-black berries and hard, bending branches, this bush of eastern North America
  loses its leaves each year; its branches were once used for shafts shot from a bow.
scope: It is also called arrow wood, a bush of eastern North America that loses its leaves each year and
  once gave shafts shot from a bow.
examples:
- This southern arrow wood bore blue-black berries and lost its leaves each year.
- Branches of southern arrow wood were once used for shafts shot from a bow.
