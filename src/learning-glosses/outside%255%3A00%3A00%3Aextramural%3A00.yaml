simpleMeaning: Operating beyond the walls or grounds of an organized group such as a school, hospital,
  or company.
scope: This sense is about an organization's activity reaching beyond its own buildings or grounds, not
  about which way a door or road faces.
examples:
- The college's outside tutors travel to village halls to teach adults who cannot come to campus.
- Much of the charity's work happens outside its own offices, in schools and community centres.
