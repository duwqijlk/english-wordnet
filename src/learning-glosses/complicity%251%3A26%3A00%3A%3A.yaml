simpleMeaning: the blame that comes from taking part in a crime or wrong act with someone else
scope: The blame for taking part in a crime with others, not the crime itself and not feeling guilty about
  something you did alone.
examples:
- His complicity in the bank theft came out during the trial.
- She denied any complicity in the plan to steal the money.
