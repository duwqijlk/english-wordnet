simpleMeaning: To give a mark or rank to something after judging how good it is.
scope: This is a judge or teacher giving the mark, not a student getting one, not gaining points in a
  game, and not writing music.
examples:
- Teachers score the essays twice to keep the marking fair.
- The judges scored each performance out of ten.
