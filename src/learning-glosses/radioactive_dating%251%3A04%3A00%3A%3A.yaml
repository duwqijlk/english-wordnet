simpleMeaning: Working out how old a thing is by measuring how much ray-giving matter, usually carbon
  14, it holds
scope: Working out how old a thing is from what it holds; not guessing from its looks, and not counting
  tree rings.
examples:
- Radioactive dating showed the bone was 5,000 years old.
- They used radioactive dating on the wooden tool.
