simpleMeaning: Found in the ground as the minerals sphalerite and wurtzite, this yellow to white crystal-like
  stuff gives off light and is used as a paint colour that shines.
scope: Also called zinc sulphide, this yellow-white crystal-like stuff gives off light and is used as
  a paint colour that shines.
examples:
- The zinc sulfide coating glowed softly.
- Workers added zinc sulfide to the paint to make it shine.
