simpleMeaning: the greatest height at which a plane can still fly level
scope: The greatest height at which a plane can still fly level; not the height a plane can reach in a
  climb and not the height of a cloud.
examples:
- The absolute ceiling of that plane is high.
- At its absolute ceiling the plane can only fly level.
