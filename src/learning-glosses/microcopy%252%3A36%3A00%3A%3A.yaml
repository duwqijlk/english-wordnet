simpleMeaning: To make printed words or pictures smaller with a machine that prints them again
scope: To make printed words or pictures smaller with a machine, not to make them bigger and not to write
  them out by hand.
examples:
- She microcopied the old newspaper pages to save space.
- The library microcopied the rare books so readers could use them.
