simpleMeaning: with no real meaning and no life or lively energy
scope: This sense describes talk or people with no life or interest in them. It is not the sense about
  food or drink with no taste.
examples:
- It was a vapid conversation, and no one said anything of real interest.
- The students gave vapid smiles and did not join in at all.
