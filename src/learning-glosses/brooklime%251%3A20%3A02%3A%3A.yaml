simpleMeaning: a plant of Europe with stems that lie low and blue flowers, now growing thinly in the wild
  in North America
scope: This is a plant of Europe with stems that lie low and blue flowers, now growing thinly in the wild
  in North America, not the western North American kind with pale violet flowers and not a water plant
  of the tropics.
examples:
- Brooklime grew along the edge of the stream.
- The brooklime by the ditch had small blue flowers.
