simpleMeaning: A Chinese bush or small tree with white or pink flowers that turn deep red at night; grown
  widely, and now settled in the south-east United States.
scope: Also called cotton rose, Confederate rose and Hibiscus mutabilis, this is a Chinese bush with flowers
  that redden at night, not a true rose.
examples:
- The Confederate rose mallow opens white and turns red by night.
- We grow the Confederate rose mallow by the wall.
