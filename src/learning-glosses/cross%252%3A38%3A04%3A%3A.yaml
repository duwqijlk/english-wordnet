simpleMeaning: to fold something so its parts lie over each other in the shape of an X
scope: This is folding limbs or objects into an X shape, not moving to the other side of something or
  breeding plants.
examples:
- She crossed her legs and leaned back in the chair.
- He crossed his arms and refused to answer.
