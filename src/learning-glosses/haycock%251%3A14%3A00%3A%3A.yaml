simpleMeaning: A small pile of cut grass, shaped like a cone, left in the field to dry until it can be
  moved to the big stack.
scope: A small cone-shaped pile of cut grass left in the field until it is dry enough to move to the big
  stack, not the big stack itself and not a bale.
examples:
- The farmer left a haycock in the field to dry in the sun.
- We sat beside a haycock while the men loaded the wagon.
