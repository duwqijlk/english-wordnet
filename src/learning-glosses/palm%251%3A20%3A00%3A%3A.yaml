simpleMeaning: Any plant of the Palmae family, with a single branchless stem topped by large leaves shaped
  like feathers or fans.
scope: This is the tree also called a palm tree, not the inner surface of the hand, the old unit of length
  based on the hand, or a championship award.
examples:
- A single palm stood at the center of the courtyard.
- The palm's fronds rustled in the evening breeze.
