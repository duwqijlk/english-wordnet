simpleMeaning: In battle above all, a hero or heroine meets danger with a brave heart that does not give
  way.
scope: Valiance, valorousness, valour, valor, heroism and gallantry are other names for this sense, the
  brave heart of a hero or heroine in danger.
examples:
- His valiancy in battle was praised by all who saw it.
- The heroine showed great valiancy when danger came.
