simpleMeaning: Any of several herbs of the group Doronicum grown for their long stalks of yellow flower
  heads; their leaves take turns along the stem and often hug it.
scope: 'Also called leopard''s-bane: one of several herbs of the group Doronicum, grown for long stalks
  of yellow flower heads.'
examples:
- Leopardbane lines the garden path, its yellow flower heads on long stalks.
- She grew leopardbane for its long stalks of yellow flower heads.
