simpleMeaning: In old Greek and Roman stories, the food and drink of the gods; a human who ate it would
  live for ever
scope: Also called nectar; in old stories this is what the gods ate and drank, not the fruit sweet dish
  and not the food bees make for their young.
examples:
- In the story, the gods ate ambrosia and never grew old.
- A man who stole and ate ambrosia would live for ever, the story says.
