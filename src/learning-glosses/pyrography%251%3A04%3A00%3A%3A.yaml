simpleMeaning: The art of making pictures on wood or leather with heated tools or a fine flame
scope: The art of making pictures with heat; not ordinary drawing with a pen or pencil.
examples:
- She learned pyrography and burned a fine design into a wooden box.
- His pyrography work used a heated tool on leather.
