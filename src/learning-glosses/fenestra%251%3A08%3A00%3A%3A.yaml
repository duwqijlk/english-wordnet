simpleMeaning: a small opening covered with a thin skin, most often the one in the bone between the middle
  and inner parts of the ear
scope: A small opening covered with a thin skin, most often the one in the bone between the middle and
  inner ear, not a hole in a wall and not a break in a bone.
examples:
- The fenestra lets sound pass from the middle ear to the inner ear.
- A thin skin covers the fenestra in the bone of the ear.
