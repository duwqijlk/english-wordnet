simpleMeaning: a rounded shape made of rings set one inside another, as when leaves or petals wind around
  a centre
scope: This is the coiled shape made by leaves or petals; roll, scroll, coil, ringlet, whorl, curlicue
  and gyre are other names for this sense, not rivals, and it is not a lock of hair or a verb meaning
  to bend into coils.
examples:
- The young fern fronds were still in tight curls.
- At the centre of the rose, the petals formed a small curl.
