simpleMeaning: An act that fools the eye and looks like real magic to people who do not know how it works
scope: A magical-seeming act, also called magic, magic trick, conjuring trick, illusion, deception, legerdemain,
  conjuration or thaumaturgy; not a cunning or deceitful action and not a ridiculous act done for fun.
examples:
- The magician's final trick left the audience gasping.
- He showed us a card trick that seemed impossible.
