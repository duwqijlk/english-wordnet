simpleMeaning: A loss of life caused by a wrong act or by carelessness, which can be the ground for a
  court claim for money by the dead person's family or heirs
scope: A loss of life that can ground a court claim for money, not a loss of life from old age and not
  a death by pure chance.
examples:
- The family sued for wrongful death after the crash.
- A wrongful death claim can take years in court.
