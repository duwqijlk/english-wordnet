senseId: 'restlessness%1:12:00::'
synsetId: 07529034-n
simpleMeaning: an uneasy feeling that makes a person keep moving and not be able to stay still
scope: 'Also called fidget: this is the uneasy feeling shown by moving all the time, not a lack of patience
  when something is slow.'
examples:
- His restlessness kept him walking up and down the room all evening.
- Waiting in the small room, her restlessness grew and she kept tapping her foot.
