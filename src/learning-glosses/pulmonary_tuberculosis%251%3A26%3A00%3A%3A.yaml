simpleMeaning: An illness of the lungs that slowly makes the body thinner and weaker
scope: An illness of the lungs that slowly wastes the body, also called consumption and phthisis; not
  the same illness in another part of the body.
examples:
- Pulmonary tuberculosis left him thin and weak after months of illness.
- She was treated for pulmonary tuberculosis in a hospital for lung disease.
