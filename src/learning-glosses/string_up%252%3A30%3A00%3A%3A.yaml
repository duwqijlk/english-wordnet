senseId: 'string_up%2:30:00::'
synsetId: 00190721-v
simpleMeaning: to add one thing after another, as if joining them in a line
scope: Adding things one by one so they form a linked set; string is another name for this sense, not
  tying things with cord and not fitting strings to an instrument.
examples:
- String up these ideas and they make a good talk.
- String up these songs and you'll have a musical.
