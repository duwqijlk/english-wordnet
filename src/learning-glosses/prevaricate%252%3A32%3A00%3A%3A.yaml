senseId: 'prevaricate%2:32:00::'
synsetId: 00837185-v
simpleMeaning: To speak on purpose in a way that is vague and hard to pin down, so as to mislead others
  or keep facts back.
scope: Also called equivocate, palter, or beat around the bush; speaking on purpose in a vague way to
  mislead or to keep facts back, not an honest answer.
examples:
- When asked about the money, he began to prevaricate.
- She would prevaricate rather than admit what she knew.
