simpleMeaning: a harmful plant with gold flowers, at times put in the group called Sisymbrium
scope: This is a harmful plant with gold flowers; rockcress and rocket cress are other names for this
  sense, not a rocket that flies and not a plant you eat.
examples:
- Yellow rocket was growing along the ditch, its gold flowers easy to see.
- The farmer pulled up the yellow rocket before it could spread.
