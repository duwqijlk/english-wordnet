simpleMeaning: A list of phone users in ABC order, with each person's phone number
scope: A list of phone users in ABC order with each person's phone number, also called a phonebook, a
  phone book, and a telephone directory; not a book of addresses and not a yellow pages of firms.
examples:
- She looked up the plumber in the telephone book.
- The telephone book lists every home in the town.
