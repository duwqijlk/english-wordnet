senseId: 'chronic_lymphocytic_leukemia%1:26:00::'
synsetId: 14267485-n
simpleMeaning: a long-term blood cancer in which the blood holds many young cells like the ones that make
  white blood cells, and it is found most often in older men
scope: This is a long-term blood cancer in which the blood holds many young cells like the ones that make
  white blood cells, found most often in older men; not a short-term blood cancer and not one found most
  often in young people.
examples:
- His chronic lymphocytic leukemia was found during a blood test.
- The doctor told him his chronic lymphocytic leukemia would need checks over many years.
