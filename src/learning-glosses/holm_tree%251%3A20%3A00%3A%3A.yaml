simpleMeaning: Its green parts look much like those of the plant it is named for, and this plant of southern
  Europe stays green all year and has hard wood.
scope: This plant of southern Europe, which stays green all year and gives hard wood, is also called evergreen
  oak, holly-leaved oak, or holm oak.
examples:
- A holm tree stays green all year.
- The holm tree has hard wood.
