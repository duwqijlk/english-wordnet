simpleMeaning: how firm a thing is when it keeps its own shape and does not flow
scope: 'Also called solidness: this is about how firm a thing is when it keeps its shape, not about being
  trusted in money, facts, or right and wrong.'
examples:
- The solidity of the ice let them walk across the lake.
- He tested the solidity of the block by pressing it hard.
