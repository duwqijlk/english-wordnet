simpleMeaning: soft, pale wood from the tree of the same name, which does not last long
scope: Soft, pale wood that does not last long, not the tree itself and not the hard wood of other trees.
examples:
- The box was made of poplar, which is soft and light.
- Poplar is too soft to use for a floor that gets hard wear.
