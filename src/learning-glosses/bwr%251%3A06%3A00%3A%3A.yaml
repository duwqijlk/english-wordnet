simpleMeaning: A nuclear reactor in which water cools the core and slows the reaction; the water boils
  and its steam can drive a turbine
scope: Also called boiling water reactor, it is a nuclear reactor in which water cools the core, slows
  the reaction and boils to make steam that can drive a turbine.
examples:
- The BWR uses water as both coolant and moderator.
- Steam from the BWR drives a turbine.
