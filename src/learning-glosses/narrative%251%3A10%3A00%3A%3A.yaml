simpleMeaning: a telling in detail of what happened in an act, event, or set of events, given in writing,
  a play, a film, or a radio or television program
scope: 'Also called a story or a tale: a telling of what happened, in writing, a play, a film, or on radio
  or television; not just a short piece of news or a plain list of facts.'
examples:
- The film's narrative follows a young girl who leaves home.
- His narrative of the journey kept us listening for an hour.
