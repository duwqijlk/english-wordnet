simpleMeaning: extra money you must pay when you give a hired car back in a place that is not the place
  where you got it
scope: Extra money paid for giving a hired car back in a different place from where it was got, not the
  cost of hiring the car and not a fine for late return.
examples:
- The drop-off charge made the one-way hire cost more than the return trip.
- She paid a drop-off charge because she left the car in another town.
