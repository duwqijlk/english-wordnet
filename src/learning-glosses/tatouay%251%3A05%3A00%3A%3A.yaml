simpleMeaning: a kind of armadillo with a bare tail, found in the warm parts of South America
scope: 'Also called cabassous: an armadillo with a bare tail from the warm parts of South America, not
  a common armadillo with a hard tail and not any other animal of the region.'
examples:
- The tatouay dug for insects in the forest floor.
- A tatouay crossed the path, its bare tail trailing behind it.
