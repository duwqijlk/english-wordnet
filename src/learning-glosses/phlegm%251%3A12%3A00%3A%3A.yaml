simpleMeaning: no feeling shown when something happens, even when feeling would be felt
scope: No feeling shown when something happens, even when feeling would be felt; indifference is another
  name for this sense, not the thick stuff coughed up from the chest.
examples:
- His phlegm in the face of bad news surprised his friends.
- She met the insult with a phlegm that hid all feeling.
