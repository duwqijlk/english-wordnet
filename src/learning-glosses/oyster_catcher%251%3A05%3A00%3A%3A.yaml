simpleMeaning: A black-and-white bird of the shore with thick legs and a thick beak, it eats shellfish
  and other sea food
scope: 'Also called oystercatcher: a black-and-white bird of the shore that eats shellfish, not a gull
  and not a bird of inland waters.'
examples:
- An oyster catcher stood on one leg at the edge of the water.
- We watched the oyster catchers prising open shellfish on the beach.
