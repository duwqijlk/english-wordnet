simpleMeaning: a playing card, domino or one of a pair of dice whose top side shows as many spots as there
  are fingers on one hand
scope: This is the marked card, domino, or die itself, not the number five or a group of five things.
examples:
- He laid a five on the table and won the round.
- She threw the dice and a five came up.
