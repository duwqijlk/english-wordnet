simpleMeaning: the passages that air goes through and the controls for the sound on an organ used for
  music
scope: These are parts of an organ used for music, not a tube for smoking tobacco and not a long tube
  for water or gas.
examples:
- The pipe of the church organ, its air passages and sound controls, had not been cleaned for years.
- A fault in the pipe of the organ, in its air passages and sound controls, silenced several notes during
  the service.
