simpleMeaning: a covered carriage with two wheels, pulled by a horse, with the driver's seat high up behind
  the people riding inside
scope: 'Also called hansom cab: a covered two-wheeled carriage pulled by a horse, not a car with a driver
  and not an open carriage.'
examples:
- A hansom waited outside the station, with its driver sitting high at the back.
- They rode through London in a hansom pulled by one horse.
