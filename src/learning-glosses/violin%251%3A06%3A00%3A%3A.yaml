simpleMeaning: an instrument played with a bow, with four strings, a hollow body and a neck with no bars
  across it; it gives the highest sound in its group
scope: 'Also called fiddle: the small instrument with strings that is played with a bow, not a larger
  one with a lower sound, such as a cello.'
examples:
- She plays the violin in the school concert.
- He held the violin under his chin and drew the bow across the strings.
