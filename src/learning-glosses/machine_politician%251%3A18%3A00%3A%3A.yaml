simpleMeaning: For its own gain, not for the good of all, a small group runs a party, and this person
  belongs to that group
scope: Also called hack and political hack, this is a party member in a small group that runs the party
  for its own gain, not a leader who serves the public.
examples:
- The machine politician kept his seat through the party clique.
- Voters grew tired of the machine politician's deals.
