simpleMeaning: A thought-up bit of matter with one pole of pull instead of the usual two
scope: A thought-up bit of matter with one pole of pull instead of the usual two; not a real bit of matter
  found in nature and not a magnet with two poles.
examples:
- Physicists have looked for a magnetic monopole but never found one.
- A magnetic monopole would have a single pole, unlike an ordinary magnet.
