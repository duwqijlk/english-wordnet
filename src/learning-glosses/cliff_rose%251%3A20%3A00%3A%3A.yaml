simpleMeaning: a low plant that grows in tight tufts on sea coasts and mountains of the northern temperate
  lands, sometimes grown to cover the ground
scope: A low, tufted plant of sea coasts and northern mountains, sometimes grown to cover the ground;
  sea pink is another name for this sense, not a garden rose and not any other ground-cover plant.
examples:
- Cliff rose grew in tufts along the sea cliff.
- They planted cliff rose as a ground cover on the bank.
