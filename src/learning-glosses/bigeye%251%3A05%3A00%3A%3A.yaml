simpleMeaning: With very large round parts for seeing and rough scales, this red sea fish lives in the
  warm coastal waters of America.
scope: This is a red sea fish of the warm shores of America, with very large round parts for seeing and
  rough scales, not a fish with small parts for seeing and smooth scales.
examples:
- Fishermen caught a bigeye off the warm coast.
- The bigeye in the net had very large eyes.
