simpleMeaning: When a thing lowers the body's usual defence against sickness, leaving it less able to
  fight back, it is said to be this.
scope: This word is said of a thing that lowers the body's usual defence against sickness, not of one
  that strengthens it.
examples:
- An immunosuppressive drug was part of her treatment.
- They kept him on an immunosuppressive substance.
