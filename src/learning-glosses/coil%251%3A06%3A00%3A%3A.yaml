simpleMeaning: A thing made by winding something round and round in one long set of loops
scope: 'Also called spiral: a thing wound round and round in loops, not a round shape made of rings set
  one inside another and not a tube wound in a spiral.'
examples:
- He carried a coil of rope over his shoulder.
- The coil of hose lay beside the tap.
