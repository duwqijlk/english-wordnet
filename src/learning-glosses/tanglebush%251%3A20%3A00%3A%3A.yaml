simpleMeaning: This leaf-shedding, thorny, branching shrub of the southwestern US has clusters of tiny
  yellow-white blooms that open before the leaves, then showy black berry-like fruits follow.
scope: A name for the thorny southwestern shrub also called desert olive, not a climbing vine.
examples:
- The tanglebush was thick with black fruits.
- Thorns on the tanglebush caught at my sleeve.
