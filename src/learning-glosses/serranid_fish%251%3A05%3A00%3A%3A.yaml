simpleMeaning: sea creatures with fins that people catch for food and sport, living mostly in warm waters
  by the coast
scope: A sea creature caught for food and sport in warm coastal waters, also called serranid; not a fresh-water
  catch and not a creature kept only as a pet.
examples:
- We caught a serranid fish off the warm coast.
- The serranid fish is good to eat and hard to land.
