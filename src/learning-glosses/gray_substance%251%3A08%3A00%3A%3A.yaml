simpleMeaning: greyish nerve tissue that holds nerve cell bodies and fibres, making up the outer layer
  of the brain, built of nerve cells with no fatty coat
scope: Also called gray matter, grey matter, grey substance, and substantia grisea; the greyish nerve
  tissue that makes up the outer layer of the brain, not the white tissue that carries signals.
examples:
- The outer layer of the brain is mostly gray substance.
- Damage to the gray substance can change how a person thinks and moves.
