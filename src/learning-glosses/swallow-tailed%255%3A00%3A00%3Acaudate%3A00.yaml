simpleMeaning: especially of butterflies and birds, having a back end that splits into two points
scope: This is a butterfly or bird whose back end splits into two points, like a swallow's tail; not a
  bird with a straight tail and not one with no tail.
examples:
- The swallow-tailed kite showed its forked tail in flight.
- A swallow-tailed butterfly rested on the flower.
