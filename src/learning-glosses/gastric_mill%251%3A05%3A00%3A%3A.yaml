simpleMeaning: In many birds and reptiles, food is ground in a thick-walled pouch of muscle below the
  crop.
scope: Also called a gizzard and a ventriculus, this is a thick-walled pouch of muscle that grinds food
  in many birds and reptiles.
examples:
- The bird's gastric mill ground its food.
- A gastric mill sits below the crop.
