simpleMeaning: In the Roman Catholic Church, the policy that all power over the church should rest with
  the pope
scope: The policy that all power over the church should rest with the pope; not the view that a council
  of bishops holds the power, and not a rule about the church's daily work.
examples:
- Ultramontanism held that the pope alone should hold full power over the church.
- He wrote in support of ultramontanism and against the bishops who wanted a share of power.
