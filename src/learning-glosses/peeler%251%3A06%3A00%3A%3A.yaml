simpleMeaning: a tool used to take the skin off vegetables or fruit
scope: This is a kitchen tool for taking the skin off food. It is not a worker who takes skins off fruit
  and vegetables, and not a performer who takes clothes off to music.
examples:
- She used a peeler to take the skin off the potatoes.
- He bought a new peeler that works well on apples and carrots.
