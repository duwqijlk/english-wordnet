simpleMeaning: A sticky sap taken from several warm-climate plants; it is used to draw skin and flesh
  tight and to turn animal skins into leather.
scope: This is the sticky sap from warm-climate plants used to tighten skin and tan leather; gum kino
  and kino are other names for this sense, not the dark juice or resin from Pterocarpus trees.
examples:
- The kino gum was used to tan the leather for the saddle.
- She put kino gum on the small cut to draw the skin tight.
