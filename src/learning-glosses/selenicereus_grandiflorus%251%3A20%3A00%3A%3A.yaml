simpleMeaning: A climbing cactus of tropical America with three-sided branches, often grown for its large
  showy flowers that open at night, followed by yellow fruits streaked with red.
scope: Also called queen of the night; not a desert cactus and not a cactus with small flowers.
examples:
- The Selenicereus grandiflorus opened its large flowers at night.
- We watched the Selenicereus grandiflorus bloom after dark.
