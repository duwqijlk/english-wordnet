simpleMeaning: a plan for events, put together in a way meant to have the strongest possible effect
scope: This is a plan of events meant to have the strongest effect. It is not arranging music for an orchestra,
  and not a piece of music arranged for an orchestra or band.
examples:
- The orchestration of the protest brought thousands of people together at the right moment.
- Good orchestration of the events made the campaign have a strong effect on voters.
