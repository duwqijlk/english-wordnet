simpleMeaning: any of several sweet-smelling plants from warm parts of Asia, Europe and Africa, in the
  plant group called Ocimum, that live for one year or for many years
scope: This is the living plant itself, not the leaves of the common kind used fresh or dried as food.
examples:
- Basil grows well in a warm, sunny garden.
- She planted basil next to the tomatoes.
