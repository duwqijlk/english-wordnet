simpleMeaning: a bad, strong want to get more and more things; a never-filled want for wealth, shown as
  a person and counted as one of the deadly sins
scope: 'Also called greed, covetousness, avaritia and rapacity: a never-filled want for wealth counted
  as one of the deadly sins, not just the plain sense of very great greed for things of value.'
examples:
- His avarice grew, and no amount of money was ever enough for him.
- In the old story, avarice is shown as a person who always wants more wealth.
