simpleMeaning: A filler used where things are built or mended, sealing gaps and joints so water cannot
  get in.
scope: In building and repair, a filler that keeps water out, also called caulk.
examples:
- She pressed caulking round the bath to stop the leak.
- Fresh caulking sealed the gaps in the wooden boat.
