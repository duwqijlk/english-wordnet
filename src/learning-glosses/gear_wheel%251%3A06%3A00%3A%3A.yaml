simpleMeaning: To change how fast a thing moves or which way it goes, a round part with teeth round its
  edge fits into another toothed part and turns it.
scope: Also called a gear, a cogwheel, or a geared wheel, this round part with teeth round its edge fits
  into another toothed part to change speed or direction.
examples:
- The gear wheel meshed with the smaller toothed part beside it.
- A broken gear wheel stopped the machine.
