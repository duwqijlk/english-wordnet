  diseases and to bring out photographs.
scope: Also called pyrogallic acid, this poison comes as white, shining crystals of the phenol kind, used
  on some skin diseases and to bring out photographs.
examples:
- The skin disease was treated with pyrogallol.
- The photographs were brought out with pyrogallol.
