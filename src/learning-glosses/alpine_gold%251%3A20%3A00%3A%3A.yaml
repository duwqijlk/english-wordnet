simpleMeaning: A low clump of a plant with hairy stems, each topped by a flower head of short narrow yellow
  rays; it grows in the northwest of the United States.
scope: Also called alpine hulsea, this is a low clump of a plant with yellow-rayed flower heads in the
  northwest of the United States.
examples:
- The alpine gold grows in the northwest of the United States.
- Each alpine gold stem is topped by a flower head with short narrow yellow rays.
