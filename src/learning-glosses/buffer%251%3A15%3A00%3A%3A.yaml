simpleMeaning: a strip of land that neither side holds, between two states that are rivals, made to keep
  them from fighting
scope: A strip of land that neither side holds, between two states that are rivals, made to keep them
  from fighting, not a tool for polishing and not a part of a computer's memory.
examples:
- A buffer zone kept the two armies apart.
- The buffer between the two countries helped keep the peace.
