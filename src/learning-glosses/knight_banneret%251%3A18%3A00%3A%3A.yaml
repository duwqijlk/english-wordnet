simpleMeaning: A fighting man on horseback honoured for bravery, allowed to show a square flag and to
  hold higher command.
scope: This is a fighting man on horseback honoured for bravery, allowed to show a square flag and to
  hold higher command; banneret and knight of the square flag are other names for it, not an ordinary
  knight and not a lord.
examples:
- The knight banneret was honoured for bravery in battle.
- A knight banneret could display a square banner.
