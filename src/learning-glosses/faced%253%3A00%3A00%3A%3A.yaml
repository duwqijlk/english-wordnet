simpleMeaning: having a front or look, especially of a stated kind or number, often used as part of a
  longer word
scope: It tells what kind or number of front or look a person or thing has, often in a longer word; it
  is not meeting or dealing with a problem.
examples:
- The red-faced man laughed after his run.
- A pale-faced child sat quietly by the window.
