simpleMeaning: teaching one pupil at a time, usually by a tutor hired privately
scope: This is teaching one pupil at a time, usually by a tutor hired privately; tuition and tutelage
  are other names for this sense, not teaching a whole class and not a school.
examples:
- Her tutorship helped the boy catch up in maths.
- We paid for tutorship in French every week.
