simpleMeaning: the stronger response of an antenna in one direction, shown as a loop in a pattern that
  shows how strongly it sends out waves in each direction
scope: This is the radio sense, about an antenna and the way it points; it is not the rounded part of
  a body organ and not a part of a leaf.
examples:
- The antenna's main lobe pointed toward the tower, so the signal was strong.
- A side lobe picked up weak signals from the wrong direction.
