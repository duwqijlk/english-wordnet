simpleMeaning: in anatomy, the place where two bones or parts of a skeleton meet, especially where movement
  is possible
scope: This is the place where bones meet, not a disreputable place of entertainment, not a piece of meat
  for roasting, not a marijuana cigarette, not a general junction between objects, and not the adjective
  meaning shared.
examples:
- He injured his knee joint while running.
- The doctor examined the joints in her fingers.
