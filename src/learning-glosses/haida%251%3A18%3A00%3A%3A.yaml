simpleMeaning: A member of a sea-going group of North American Indians who lived on the Pacific coast
  of British Columbia and south-western Alaska.
scope: A member of a sea-going group of North American Indians who lived on the Pacific coast of British
  Columbia and south-western Alaska; this is a person of the group, not the tongue the group speaks.
examples:
- A Haida fisherman mended his nets on the Pacific coast.
- The Haida lived on the Pacific coast of British Columbia.
