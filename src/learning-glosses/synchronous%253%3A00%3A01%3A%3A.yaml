simpleMeaning: In digital communication, about a way of sending data where devices must share one clock
  signal (a signal that gives the timing) so their sending is timed together
scope: This is the digital sending sense, where devices share one timing signal; not the wider sense of
  things just happening at the same time.
examples:
- The two computers use a synchronous link, so both follow the same clock signal.
- In synchronous transmission, the receiver keeps time with the sender's clock.
