simpleMeaning: a grey-brown flying insect whose young form is a worm that lives in and eats the underground
  part of a root plant
scope: Also called potato tuber moth and splitworm, this is a grey-brown flying insect, not the worm that
  is its young form.
examples:
- The potato moth is greyish-brown, and its young eat the tubers.
- Farmers watch for potato moths because their young damage the stored tubers.
