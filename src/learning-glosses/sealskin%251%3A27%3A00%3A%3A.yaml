simpleMeaning: the skin and fur of a seal, especially the soft fur under the outer fur
scope: 'Also called seal: this is the skin and fur itself, not a coat or jacket made from it.'
examples:
- The sealskin was cleaned and kept for its soft fur.
- Hunters dried the sealskin in the sun after the hunt.
