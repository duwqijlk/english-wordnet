simpleMeaning: a farm animal of one of many kinds kept for its wool, meat, or skin
scope: A farm animal of one of many kinds kept for its wool, meat or skin, and not a wild one or a goat.
examples:
- Domestic sheep graze in the fields near the farm.
- The farmer shears his domestic sheep each spring.
