simpleMeaning: In computer science, a machine on a network that shares its files and printers with other
  connected computers.
scope: A computer serving files and printers on a network, not a person who welcomes guests, an animal
  or plant supporting a parasite, or an organization running an event.
examples:
- The files are stored on a host that every workstation can reach.
- Each host on the network shares its printer with the other machines.
