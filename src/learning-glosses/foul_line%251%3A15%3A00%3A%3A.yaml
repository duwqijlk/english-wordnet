simpleMeaning: The marks that run through first and third base and show where the edge of a baseball field
  lies.
scope: Marks through first and third base showing a baseball field's edges, not the marks that show where
  to stand and not the wall round the field.
examples:
- The ball rolled past the foul line and into the stands.
- He stood just inside the foul line as he waited to bat.
