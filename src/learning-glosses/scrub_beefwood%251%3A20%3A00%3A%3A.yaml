simpleMeaning: Sweet-smelling bunches of creamy-white flowers grow on this tree or tall shrub with shiny
  leaves, which gives hard heavy reddish wood.
scope: Also called beefwood, this is a tree or tall shrub with shiny leaves and sweet-smelling creamy-white
  flowers, giving hard heavy reddish wood, not a tree with soft light wood.
examples:
- The scrub beefwood gave hard heavy reddish wood.
- Sweet-smelling creamy-white flowers covered the scrub beefwood.
