simpleMeaning: a liquid with chemicals in it that can change the color of a printed photo
scope: This is the liquid used on printed photos, not the black or colored powder used in a printer and
  not a lotion for cleaning the skin.
examples:
- He used a toner to give the black-and-white photo a warm brown color.
- This toner can change the color of a photographic print.
