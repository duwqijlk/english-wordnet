simpleMeaning: likely to bring shame and to draw blame on someone or something
scope: Likely to bring shame and to draw blame on someone or something, and not a small fault that no
  one minds and not a crime.
examples:
- His marks were not at all discreditable, so his teachers praised his work.
- A discreditable act like cheating would bring shame on the whole team.
