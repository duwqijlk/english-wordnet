simpleMeaning: A kind of European tree with shiny leaves of a deep blue-red or copper colour.
scope: A kind of European tree with shiny deep-coloured leaves, also called copper beech; not a green-leaved
  tree and not a tree grown for fruit.
examples:
- The purple beech stands in the park with shining leaves.
- A purple beech turns deep blue-red in spring.
