simpleMeaning: an army group smaller than a division, usually made up of a few battalions, which are large
  groups of soldiers
scope: An army group smaller than a division, usually made up of a few battalions; not the act of forming
  such a group.
examples:
- The brigade moved into position before dawn.
- A brigade is smaller than a division, the officer explained.
