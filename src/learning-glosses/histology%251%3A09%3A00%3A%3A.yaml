simpleMeaning: How the tiny bits that make up animal or plant flesh are put together is what this study
  is about
scope: The study of the tiny make-up of animal and plant flesh, not the study of whole living things and
  not the study of sick people.
examples:
- She took a course in histology to learn how flesh is built.
- Histology shows the tiny parts that make up a leaf.
