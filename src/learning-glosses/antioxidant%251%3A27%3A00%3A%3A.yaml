senseId: 'antioxidant%1:27:00::'
synsetId: 14748824-n
simpleMeaning: A substance that holds back oxidation, or reactions that oxygen or peroxides set off in
  other things.
scope: It slows the changes that oxygen or peroxides set off in other things, unlike a substance that
  speeds such changes up.
examples:
- The antioxidant held back the changes oxygen set off.
- An antioxidant stops the changes that strong chemicals set off.
