simpleMeaning: a small bird of the Americas with a fine song; the male has a red patch on the top of its
  head
scope: 'Also called a ruby-crowned kinglet: a small bird of the Americas with a fine song, not a golden-crowned
  kinglet and not a wren of another kind.'
examples:
- We heard a ruby-crowned wren singing high in the pine trees.
- The male ruby-crowned wren showed the red patch on the top of his head.
