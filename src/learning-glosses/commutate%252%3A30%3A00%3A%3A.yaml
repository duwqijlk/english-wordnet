senseId: 'commutate%2:30:00::'
synsetId: 00139187-v
simpleMeaning: to turn an electric flow that changes direction back and forth into a flow that goes one
  way only, by switching it at each half turn
scope: This is to switch an electric flow that moves back and forth so it moves one way only; not to change
  the strength of the flow and not to stop it.
examples:
- The device will commutate the alternating current so the motor runs on a steady flow.
- Engineers designed the coil to commutate the current each half cycle.
