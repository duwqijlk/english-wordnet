simpleMeaning: having left a main group, plan or way of thinking, or saying that leaving is the right
  thing to do
scope: Also called separatist and fissiparous, this describes a group that has left or wants to leave,
  not the act of leaving itself.
examples:
- The breakaway group started its own party.
- A breakaway province wanted to become a separate country.
