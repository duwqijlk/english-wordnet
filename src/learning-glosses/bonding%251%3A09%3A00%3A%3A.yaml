simpleMeaning: In dentistry, a way of fixing a tooth by putting a sticky material on its surface, where
  it sticks to the hard outer layer of the tooth
scope: In dentistry, a way of fixing a tooth with a sticky material that clings to its hard outer layer;
  not a way of joining two things in general.
examples:
- The dentist used bonding to fix the chipped tooth.
- Bonding can repair a small crack in a tooth.
