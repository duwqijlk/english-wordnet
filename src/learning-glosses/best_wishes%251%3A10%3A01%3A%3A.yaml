simpleMeaning: words said or written to say you hope a person will be happy and well in the time ahead
scope: Words that say you hope a person will be happy and well, not a gift and not a plain hello.
examples:
- We sent our best wishes for a speedy recovery.
- She signed the card with best wishes for their new home.
