simpleMeaning: Money a firm keeps hidden so it can change its three-month profit reports.
scope: This is money a firm keeps hidden to change its three-month profit reports, not a pot of savings
  for hard times and not money set aside for a known bill.
examples:
- The cookie jar reserve let the firm smooth its quarterly results.
- Auditors found a cookie jar reserve hidden in the accounts.
