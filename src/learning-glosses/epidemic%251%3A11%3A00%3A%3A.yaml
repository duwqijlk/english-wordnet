simpleMeaning: a disease that spreads fast through a place, so that many people catch it at the same time
scope: A widespread outbreak of an infectious disease, not the adjective for something that spreads through
  a whole community.
examples:
- The epidemic spread through the whole town in a week.
- Doctors worked day and night during the epidemic.
