simpleMeaning: During sex the vagina is made smooth by wetness from an organ that opens into its entrance.
scope: This organ opens into the entrance of the vagina and makes it smooth during sex.
examples:
- Wetness from the vestibular gland makes the vagina smooth during sex.
- The vestibular gland opens into the entrance of the vagina.
