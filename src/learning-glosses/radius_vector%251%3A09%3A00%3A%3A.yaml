simpleMeaning: A line that joins a point in space to the starting point of a way of fixing a place with
  a distance and a direction
scope: A line joining a point to the starting point of a way of fixing places, not a line from the middle
  of a circle to its edge.
examples:
- On the graph, the radius vector runs from the starting point to the marked point.
- She drew the radius vector to show where the point lay.
