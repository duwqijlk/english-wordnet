simpleMeaning: A plant kept in the house for its thick leaves with silver stripes, from South America.
scope: A house plant grown for its striped leaves; not a plant grown for its flowers and not a garden
  plant.
examples:
- She keeps a watermelon begonia on the window sill for its striped leaves.
- The watermelon begonia came from South America and likes a warm room.
