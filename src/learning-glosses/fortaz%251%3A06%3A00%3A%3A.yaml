simpleMeaning: A drug of the cephalosporin kind, a group of drugs that kill germs, given by needle and
  also sold as Tazicef, to treat middling infections
scope: Also called ceftazidime and Tazicef; this is the drug given by needle for middling infections,
  not a drug taken by mouth.
examples:
- The doctor gave him Fortaz by injection.
- Fortaz was used to treat the infection.
