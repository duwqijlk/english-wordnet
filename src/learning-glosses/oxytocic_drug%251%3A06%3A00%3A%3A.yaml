simpleMeaning: A medicine that starts birth by making the womb tighten and push.
scope: A medicine that starts birth by making the womb tighten; oxytocic is another name for this sense,
  not a medicine that stops birth and not a medicine for pain.
examples:
- The oxytocic drug started the birth within the hour.
- She was given an oxytocic drug to make the womb tighten.
