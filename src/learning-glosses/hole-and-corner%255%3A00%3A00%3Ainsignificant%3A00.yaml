simpleMeaning: The parts of life that no one thinks matter much are the small things on its far edge
scope: Also called hole-in-corner, this is about the small, unimportant parts of life, not a thing done
  in secret with hidden aims.
examples:
- He lived a hole-and-corner life in a small town far from the city.
- Their hole-and-corner days passed without notice from anyone.
