simpleMeaning: The act of standing in for a person or a group and speaking for them with full power to
  do so.
scope: Standing in for someone and speaking for them with power to act, not the state of being such a
  delegate, not a picture or model of a thing, and not a group of lawmakers.
examples:
- She took on the representation of the workers in the talks.
- The lawyer's representation of his client was strong.
