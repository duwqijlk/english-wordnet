simpleMeaning: A shrub of Europe with white or pink flowers that give way to black berries
scope: Also called the common myrtle; a European shrub with white or pink flowers followed by black berries,
  unlike other flowering shrubs with dark berries.
examples:
- The Myrtus communis in the garden was covered in white flowers.
- Black berries followed the flowers on the Myrtus communis.
