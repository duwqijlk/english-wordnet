simpleMeaning: a person who amuses people who watch by making things seem to happen by magic, as a show
scope: 'Also called magician, and another name for this sense is illusionist: a stage performer who does
  tricks, not a traditional healer who uses magic to cure sickness.'
examples:
- The conjurer pulled a rabbit from his hat to amuse the crowd.
- Children laughed as the conjurer made a coin disappear.
