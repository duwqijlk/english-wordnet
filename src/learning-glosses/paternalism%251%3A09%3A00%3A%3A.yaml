senseId: 'paternalism%1:09:00::'
synsetId: 06205806-n
simpleMeaning: The mind, of one or of a state, that underlings should be ruled in a fatherly way for their
  own good.
scope: The attitude of a person or government that treats those under it like children, for their own
  good.
examples:
- Their paternalism ruled at dawn.
- The paternalism was plain at noon.
