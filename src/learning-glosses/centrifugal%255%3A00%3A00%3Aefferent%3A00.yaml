simpleMeaning: Carrying signals out from the brain and the cord of nerves in the back to the muscles.
scope: Nerves that carry signals from the brain and spine out to the muscles, also called motor; not the
  sense of moving away from a centre of power.
examples:
- The centrifugal nerves carry orders from the brain to the arm muscles.
- Centrifugal signals tell the leg muscles when to move.
