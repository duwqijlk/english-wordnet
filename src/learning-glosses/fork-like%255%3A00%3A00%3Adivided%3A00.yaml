simpleMeaning: Shaped with two points that spread apart, split into two parts that branch off from one
  point.
scope: Shaped with two spread points, split into two parts; forked, branched, pronged, bifurcate, biramous
  and forficate are other names for this sense, not a thing with one point and not a thing split into
  three or more parts.
examples:
- The fork-like tail split into two points at the end.
- A fork-like branch grew out from the main stem.
