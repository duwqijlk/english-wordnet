senseId: 'atrophic_arthritis%1:26:00::'
synsetId: 14210220-n
simpleMeaning: A long-term condition in which the immune system attacks the joint lining, causing inflammation
  and lasting deformity; a virus may start it, and it can destroy the whole joint.
scope: This old name refers to the same autoimmune joint disease as rheumatoid arthritis; it is not osteoarthritis
  or a short-lived joint injury.
examples:
- Doctors once used the term atrophic arthritis for what we now call rheumatoid arthritis.
- Her atrophic arthritis had already caused severe deformity in both hands.
