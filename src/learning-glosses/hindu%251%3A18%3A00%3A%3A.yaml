simpleMeaning: People who live in that land or in India, or were born there, are the people this word
  names.
scope: 'Also called Hindoo and Hindustani: this word names a person from Hindustan or India, not a person
  who follows Hinduism.'
examples:
- The Hindu family had lived in India for many years.
