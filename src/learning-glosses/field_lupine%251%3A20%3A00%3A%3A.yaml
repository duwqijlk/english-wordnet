simpleMeaning: Grown in many places for food for farm animals and to stop the soil from washing away,
  this plant from Europe and Asia has white flowers.
scope: Also called white lupine and wolf bean, this names the plant from Europe and Asia with white flowers,
  grown in many places for food for farm animals and to stop the soil from washing away.
examples:
- The field lupine covered the hillside with white flowers.
- Farmers sow field lupine to feed their animals and hold the soil.
