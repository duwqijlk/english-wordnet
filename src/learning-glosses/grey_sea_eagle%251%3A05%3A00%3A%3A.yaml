simpleMeaning: Living in Europe and Greenland, this big heavy bird of prey has a short white tail shaped
  like a wedge and greyish-brown feathers.
scope: This bird of prey is also called ern, erne, gray sea eagle, and white-tailed sea eagle; its short
  white tail sets it apart from other large eagles.
examples:
- A grey sea eagle circled over the cliffs before dropping to the shore.
- The grey sea eagle's short white tail showed as it flew past.
