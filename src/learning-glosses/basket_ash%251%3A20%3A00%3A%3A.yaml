simpleMeaning: a strong, wide-spreading tree from North America with dark brown heavy wood, whose leaves
  turn gold in autumn
scope: 'Also called black ash, brown ash and hoop ash: a North American tree, not a basket and not any
  other ash tree.'
examples:
- The basket ash in the yard spread its wide crown over the fence.
- In October the basket ash leaves turned gold.
