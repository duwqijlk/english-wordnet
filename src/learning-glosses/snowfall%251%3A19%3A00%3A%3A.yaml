simpleMeaning: frozen water in the form of ice crystals (small, clear shapes of ice) that falls from clouds
scope: 'Also called snow: frozen water falling from clouds, not a pile of snow left on the ground.'
examples:
- Heavy snowfall covered the roads during the night.
- The snowfall lasted for three hours before the sky cleared.
