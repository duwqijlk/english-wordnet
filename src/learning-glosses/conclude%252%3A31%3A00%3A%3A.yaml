simpleMeaning: to work out an answer or make a judgment by thinking in a careful, step-by-step way
scope: 'Also called reason: to reach an answer by thinking it through, not the sense of reaching an answer
  together after talking about it.'
examples:
- From the wet ground, he concluded that it had rained in the night.
- She concluded from the facts that the plan would not work.
