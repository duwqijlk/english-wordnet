simpleMeaning: a hard sharp point that sticks out from an animal's body, such as a porcupine quill, a
  ridge on a bone, or a ray of a fish fin
scope: A hard sharp point on an animal, not the row of bones in the back, not the edge of a book, and
  not a sharp point on a plant.
examples:
- The porcupine raised its spines when the dog came near.
- The spine on the fish's fin is sharp to the touch.
