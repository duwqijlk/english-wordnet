simpleMeaning: A mould that makes a soft coat on the plant with sharp white bulbs.
scope: A mould that makes a soft coat on the plant with sharp white bulbs; not a mould on other plants
  and not a mould that lives in the soil.
examples:
- Onion mildew left a soft coat on the crop.
- The farmer fought onion mildew on his crop.
