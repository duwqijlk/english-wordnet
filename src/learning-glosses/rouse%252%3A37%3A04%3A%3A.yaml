simpleMeaning: to make a person feel restless, excited, or full of strong feeling
scope: This sense is also called excite and also called agitate; it is making someone feel stirred up,
  not waking someone from sleep.
examples:
- The speech roused the crowd to anger.
- His words roused strong feeling among the workers.
