simpleMeaning: to make something less hard to accept by taking out the parts that people would find rude
  or upsetting
scope: To clean up words, a story, or facts by taking out rude or upsetting parts; not to clean a thing
  in order to kill germs.
examples:
- The company sanitized the report before giving it to the newspapers.
- She sanitized the story so young readers would not be upset by it.
