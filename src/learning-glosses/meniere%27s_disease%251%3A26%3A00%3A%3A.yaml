simpleMeaning: A sickness of the inner ear that brings bouts of dizziness and ringing in the ears, with
  hearing that slowly gets worse, most often in one ear.
scope: This is a sickness of the inner ear with bouts of dizziness and ringing in the ears and hearing
  that slowly gets worse, most often in one ear, not a sickness of the outer ear and not a short spell
  of dizziness on its own.
examples:
- Meniere's disease left her dizzy for hours at a time.
- He has Meniere's disease, so his hearing in one ear is slowly getting worse.
