simpleMeaning: A stopping device worked with the fingers, usually by rods and links that join its parts
scope: A stopping device worked with the fingers, usually by rods and links, not a foot pedal; emergency,
  emergency brake and parking brake are other names for this sense.
examples:
- Pull the hand brake before you leave the car.
- The hand brake held the car on the hill.
