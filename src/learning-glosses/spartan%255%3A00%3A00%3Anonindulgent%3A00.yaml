simpleMeaning: very strict, with no soft treatment and no giving in, when people are made to follow rules
  or when they are judged
scope: 'Also called severe: very strict with no soft treatment, not the sense of staying firm and brave
  when facing pain or danger.'
examples:
- The coach kept spartan discipline and never let the team miss training.
- With his spartan judgment, he gave no second chance to anyone who broke the rule.
