simpleMeaning: Showing a lack of care in words and acts, so that they hurt or insult a group of people
scope: This describes words or acts that hurt or insult a group through lack of care; not the opposite,
  showing care not to offend, and not just being rude in general.
examples:
- His politically incorrect joke upset several people in the room.
- She made a politically incorrect remark about the visitors.
