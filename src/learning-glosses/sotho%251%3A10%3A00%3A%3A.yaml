simpleMeaning: Any one of the southern Bantu tongues of the Basuto people that speakers of each can understand,
  spoken in Botswana, South Africa and a small southern land
scope: This is any one of the southern Bantu tongues of the Basuto people; Basuto, Sesotho and Sotho language
  are other names for it, and it is not the Sotho people themselves or the word for things of the Sotho.
examples:
- Sotho is spoken in Lesotho and in parts of South Africa.
- She learned Sotho from her grandmother in Botswana.
