simpleMeaning: Ball-shaped yellow flowers and broad leaves mark this common water plant of eastern and
  central North America, growing in slow fresh or slightly salty water.
scope: Also called spatterdock and yellow pond lily; it is a common water plant with broad leaves and
  yellow flowers, not a flower of dry land.
examples:
- The cow lily grows in slow fresh water.
- The cow lily bears ball-shaped yellow flowers.
