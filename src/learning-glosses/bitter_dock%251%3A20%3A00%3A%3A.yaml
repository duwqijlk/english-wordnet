simpleMeaning: Often found as a weed in North America, this plant of Europe has wide blunt leaves and
  a sharp-tasting root.
scope: Also called broad-leaved dock and yellow dock, this plant of Europe has wide blunt leaves and a
  sharp-tasting root, not a dock with narrow leaves.
examples:
- Bitter dock grew as a weed in North America, its wide leaves blunt at the ends.
- The bitter dock had a sharp-tasting root and wide blunt leaves.
