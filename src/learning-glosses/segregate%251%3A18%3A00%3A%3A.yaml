simpleMeaning: a person who is kept apart from others, or who has been kept apart from others
scope: A person who is or was kept apart from others, not the act of keeping people apart by race or religion.
examples:
- As a segregate, he was made to live apart from the main group.
- The segregates were housed in a separate building away from the others.
