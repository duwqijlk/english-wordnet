simpleMeaning: good at tricking people and at hiding what you really mean or do
scope: Also called slick, sly, tricky, cunning, dodgy, crafty, foxy, and tricksy. This means good at tricking
  people, not open and honest in what you say or do.
examples:
- The wily old lawyer found a way to make the weak case look strong.
- She gave a wily smile and did not tell us her real plan.
