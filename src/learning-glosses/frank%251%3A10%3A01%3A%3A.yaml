simpleMeaning: An official stamp, printed mark or handwritten sign on mail that allows it to be sent through
  the post.
scope: This is the postal mark or privilege that lets mail be sent, not the adjective meaning honest and
  direct, nor the sausage.
examples:
- Members of Congress can send official mail under a frank.
- The senator's frank was stamped in the corner of the envelope.
