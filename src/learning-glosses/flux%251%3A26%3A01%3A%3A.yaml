senseId: 'flux%1:26:01::'
synsetId: 14057399-n
simpleMeaning: a time when people do not know what to do, usually after a big event, before a new way
  of acting is set
scope: This is not knowing what to do after a big event; it is not a flow of liquid from the body, not
  a substance used with hot metal, and not turning liquid when heated.
examples:
- The country was in a state of flux after the emperor died.
- After the leader left, the group stayed in flux for weeks.
