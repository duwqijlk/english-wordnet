simpleMeaning: Moving, or set, or tending back, or against an old way.
scope: Moving, or set, or tending back, or against an old way; not of loss of mind, touching the time
  just before a hurt, nor moving from east to west on the sky ball, or, for wanderers, round the sun the
  wrong way to the Earth, nor to move back in a ring, of sky bodies.
examples:
- Their path was retrograde at dawn.
- The course was retrograde by nature.
