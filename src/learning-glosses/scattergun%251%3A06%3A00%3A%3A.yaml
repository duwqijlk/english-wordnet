simpleMeaning: Two smooth barrels mark this weapon, which is held to the shoulder and fires small pellets
  over short distances.
scope: Also called shotgun, this is a weapon held to the shoulder for firing shot at short ranges, not
  a weapon that fires one bullet at a time.
examples:
- They held the scattergun to the shoulder.
- The scattergun fired over a short distance.
