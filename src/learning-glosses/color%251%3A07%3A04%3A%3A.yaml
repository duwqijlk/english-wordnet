simpleMeaning: A false front or shape given to something on purpose so that it seems different from what
  it is.
scope: A deliberately misleading outward show or form only; not a thing's visible appearance as judged
  by hue, lightness and saturation, not the physical light attribute behind it, not vividness or interest,
  not a musical sound's quality, not a pigment or dye, not the physics property that quarks carry, not
  the adjective meaning able to produce hues, not any other verb use (adding hue, tinting, decorating,
  affecting feeling, biasing, or turning a different shade), and not the verb meaning to explain or excuse
  something deceptively.
examples:
- The report lent the cutbacks a color of careful strategy.
- What looked like open debate was only a color of democracy.
