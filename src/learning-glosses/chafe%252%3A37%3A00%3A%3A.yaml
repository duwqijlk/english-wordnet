simpleMeaning: small troubles, more than big ones, pile up and wear on a person until they feel cross
scope: Also called bother, annoy, rag, irritate, gravel, devil, nettle, or vex, this is about small things
  getting on someone's nerves, not the sore skin from rubbing or the anger itself.
examples:
- The constant noise began to chafe her after an hour.
- His endless questions chafed the whole class.
