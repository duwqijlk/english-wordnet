simpleMeaning: a plant with tiny leaves like small flat flakes, that usually grows on other plants
scope: Also called leafy liverwort, this is a moss-like plant with tiny leaves; not a true moss and not
  a plant that grows in soil.
examples:
- Scale moss covered the damp bark of the old tree trunk.
- The scale moss grows on rocks and on the branches of trees.
