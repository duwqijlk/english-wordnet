simpleMeaning: 'Sun-based day count from Rome, 46 BC, by Julius Caesar, changed slightly by Augustus:
  365 days yearly, 12 months, 366 each 4th year, months 31 or 30 days, February less'
scope: Also called the Old Style calendar; a sun-based count of days from Rome in 46 BC, with 365 days
  a year and 366 each 4th year.
examples:
- The Julian calendar gave Rome a year of 365 days, with 366 each fourth year.
- Under the Julian calendar, February was the short month of the year.
