simpleMeaning: the book a team keeps of the moves it has worked on, with written plans and drawings, most
  often an American football team
scope: A notebook of a team's practiced moves, most often in American football, not a book of play scripts
  and not a plan for a business campaign.
examples:
- The coach opened his playbook to pick the next move.
- Each player studied the playbook before the big game.
