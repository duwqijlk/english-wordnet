senseId: 'flatter%2:32:00::'
synsetId: 00881748-v
simpleMeaning: to praise someone in a way that is not fully honest
scope: This is praising someone in a way that is not fully honest; not honest praise, and not the sense
  in which clothes or a picture make a person look better than they are.
examples:
- She flattered the teacher by saying his lesson was the best she had ever heard.
- He tried to flatter his boss with praise he did not mean.
