senseId: 'trademark%2:32:00::'
synsetId: 01004206-v
simpleMeaning: to put the name or sign for a product on an official list, so that no one else may use
  it
scope: Making a product name or sign official in law, not the sign itself, not putting the sign on goods,
  and not a special quality of a person or thing.
examples:
- The company trademarked its new name before selling the drink.
- She trademarked the sign for her shoes to stop others copying it.
