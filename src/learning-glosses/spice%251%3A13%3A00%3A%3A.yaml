simpleMeaning: one of many kinds of plant parts with a strong smell and taste, used to give food more
  taste
scope: This is the plant part itself, used to give food more taste; not plant matter used to keep food
  from going bad, and not the strong taste that food gets from such parts.
examples:
- Cinnamon is a spice used in sweet dishes.
- He added a new spice to the rice to give it more taste.
