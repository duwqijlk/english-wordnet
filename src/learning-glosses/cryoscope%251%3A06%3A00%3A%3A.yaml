simpleMeaning: A tool that measures the temperatures at which things freeze and melt
scope: A tool for measuring freezing and melting points, not a thermometer for air and not a tool for
  weighing.
examples:
- The cryoscope showed the freezing point of the liquid.
- She used a cryoscope to find when the sample melted.
