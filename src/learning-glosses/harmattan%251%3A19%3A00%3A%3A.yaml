simpleMeaning: In winter, dust fills the air as this wind moves from the Sahara to the west coast of Africa
scope: A dusty wind from the Sahara that blows to the west coast of Africa in winter, not a sea breeze
  and not a summer storm.
examples:
- The harmattan blew dust into every room of the house.
- During the harmattan, the sky turned pale with dust.
