simpleMeaning: A fastening device on a door or drawer that holds it firmly shut.
scope: The fastener that keeps a door or drawer firmly shut, not the ignition device, the canal enclosure,
  or the wrestling hold.
examples:
- She turned the key in the door lock and went inside.
- The drawer lock was broken, so it would not stay closed.
