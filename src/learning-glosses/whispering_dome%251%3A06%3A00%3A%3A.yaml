simpleMeaning: a place under a round roof or arch where sounds made at one spot can be heard plainly at
  a far spot
scope: 'Also called whispering gallery: a place under a round roof or arch where sounds made at one spot
  are heard plainly at a far spot, not a hall built for music and not an open yard.'
examples:
- In the whispering dome, a soft word at one side reached the other side.
- We stood in the whispering dome and heard each murmur from across the room.
