simpleMeaning: The extra force you gain when a lever is in a place where you can use it.
scope: A lever's gain in force, not the act of buying something and not the thing bought.
examples:
- A longer handle gives more purchase, so the same effort lifts a heavier load.
- He shifted the fulcrum to increase the purchase of the bar.
