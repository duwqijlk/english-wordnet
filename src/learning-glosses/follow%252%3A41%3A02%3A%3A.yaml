simpleMeaning: keep watching something with your eyes, or keep track of it in your mind
scope: Not obeying instructions and not physically going after someone; it is watching them or tracking
  them mentally.
examples:
- The child's eyes followed the kite across the sky.
- I tried to follow the argument, but the speaker kept changing topics.
