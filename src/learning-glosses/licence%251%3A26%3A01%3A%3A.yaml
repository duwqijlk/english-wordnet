senseId: 'licence%1:26:01::'
synsetId: 14018291-n
simpleMeaning: freedom to go against the rules or ways that are normally used, on purpose, especially
  in how a person acts or speaks
scope: 'Also called license: freedom to go against the usual rules on purpose, especially in how you act
  or speak; not the paper that gives official permission to do something, such as drive a car.'
examples:
- The poet took licence with the rules of grammar to make the line sound right.
- The writer claimed licence to change parts of the true story.
