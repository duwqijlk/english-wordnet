simpleMeaning: A current-carrying contact between the fixed and spinning parts of a motor or generator.
scope: This is the current-carrying contact inside an electric machine, not the bristle tool used for
  cleaning or grooming, an animal's bushy tail, or a dense growth of bushes.
examples:
- The motor's brushes were worn, so it sparked and stalled.
- Replace the carbon brushes when the generator begins to spark.
