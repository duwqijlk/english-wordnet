simpleMeaning: A soft silver-white metal that bends with ease and stays liquid at room warmth, the most
  ready of all metals to give up its charge and make bases.
scope: A soft metal that stays liquid at room warmth, not a hard metal or a metal that melts only in great
  heat; also called Cs, atomic number 55 and caesium.
examples:
- Cesium melts in the warmth of your hand.
- Scientists use cesium in clocks that keep very exact time.
