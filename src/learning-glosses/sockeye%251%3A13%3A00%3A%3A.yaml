simpleMeaning: the red flesh of a salmon from the Pacific coast and rivers, with a lot of fat in it
scope: 'Also called red salmon and sockeye salmon: the red flesh of a salmon, not the whole live fish,
  and not the flesh of other fish.'
examples:
- We ate sockeye with rice for dinner.
- The sockeye on the plate was rich and red.
