simpleMeaning: A drug that kills germs, made from the soil germ Streptomyces erythreus; it works against
  many germs that stain purple in a dye test and some that do not.
scope: 'Also called erythromycin, E-Mycin, Erythrocin, Ilosone, or Pediamycin: a drug that kills germs,
  not a painkiller and not a drug that kills viruses.'
examples:
- The doctor gave her Ethril for the chest infection.
- Ethril works against many germs.
