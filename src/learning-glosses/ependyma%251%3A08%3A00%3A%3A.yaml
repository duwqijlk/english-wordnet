simpleMeaning: The hollow tube down the back and the hollow spaces of the brain are lined by a thin skin
  of cells.
scope: This is a thin skin of cells that lines hollow spaces, not the brain or the cord down the back
  itself.
examples:
- The ependyma lines the hollow spaces of the brain.
- Ependyma also lines the hollow tube down the back.
