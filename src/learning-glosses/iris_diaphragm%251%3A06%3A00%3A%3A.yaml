simpleMeaning: The round hole at the centre grows wider or narrower as thin plates lying over each other
  in a ring are shifted
scope: Also called iris, it is the ring of thin plates whose shifting makes the round hole at the centre
  wider or narrower.
examples:
- They turned the iris diaphragm to narrow the opening.
- Turn the iris diaphragm and the opening changes size.
