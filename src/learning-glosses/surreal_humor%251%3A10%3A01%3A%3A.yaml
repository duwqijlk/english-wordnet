simpleMeaning: What happens makes no sense at all, because cause and effect are broken on purpose in this
  kind of joke.
scope: This is a kind of joke that breaks the rules of cause and effect; absurdist humor, absurdist humour
  and surreal humour are other names for this sense.
examples:
- The surreal humor in the play made the audience laugh at the nonsense.
- His surreal humor broke every rule of cause and effect.
