simpleMeaning: This cloth tube, its end cut off, set on a tall pole, swings to point the way the air moves,
  such as at airports.
scope: This cone is also called a sock, a drogue, a windsock, an air-sleeve, an air sock, a wind sleeve,
  and a wind sock.
examples:
- The wind cone at the airport turned to show the wind had changed.
- Pilots watched the wind cone before takeoff.
