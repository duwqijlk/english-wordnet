simpleMeaning: In American football, a play where a player tries to take the ball through or past the
  opposing side.
scope: This is the play itself, not racing on foot as a sport, a machine being in operation, or the job
  of managing something.
examples:
- The team relied on running to move the ball down the field.
- Their running gained only twenty yards in the second half.
