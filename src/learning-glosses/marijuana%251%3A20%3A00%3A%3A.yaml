simpleMeaning: a plant with a strong smell; its dried leaves can be smoked to give a pleasant feeling
  or to make pain less
scope: 'Also called ganja and marihuana: the plant itself, with a strong smell and leaves that can be
  dried and smoked. Not the dried leaves used as a drug.'
examples:
- Marijuana is a plant with leaves that people dry and smoke.
- The police found marijuana plants growing behind the house.
