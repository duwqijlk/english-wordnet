simpleMeaning: Together with the nerve that carries sight to the brain, this artery runs into the eyeball,
  having branched off the eye's main artery.
scope: This artery is also called the arteria centralis retinae.
examples:
- The surgeon traced the central artery of the retina into the eyeball.
- The central artery of the retina enters the eyeball with the optic nerve.
