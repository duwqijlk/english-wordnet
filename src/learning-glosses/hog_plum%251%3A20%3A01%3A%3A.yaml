simpleMeaning: a small North American tree, more bush-like in shape, with small yellow to reddish fruit
  that can be eaten
scope: A small North American tree, more bush-like in shape, with small yellow to reddish fruit that can
  be eaten; chickasaw plum and hog plum bush are other names for this sense, not a garden plum and not
  a cherry tree.
examples:
- The hog plum bore small yellow fruit in late summer.
- We picked hog plums from the low tree by the creek.
