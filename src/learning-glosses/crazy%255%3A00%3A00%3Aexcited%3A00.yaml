simpleMeaning: extremely excited about something, in a way that seems wild.
scope: This is not the sense 'mentally ill' and not the everyday sense 'very foolish'; it describes strong
  excitement about an event.
examples:
- The fans went crazy when their team scored.
- The children were crazy with excitement on the last day of school.
