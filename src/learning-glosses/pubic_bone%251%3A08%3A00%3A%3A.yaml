simpleMeaning: One of three parts of the hip; the pair of them together make the front of the hard ring
  at the bottom of the body
scope: This is one of three parts of the hip, and the pair of them make the front of the hard ring at
  the bottom of the body; pubis and os pubis are other names for this sense.
examples:
- She broke her pubic bone in the fall.
- The pubic bone sits at the front of the pelvis.
