simpleMeaning: a big Indian antelope, the male blue-grey with white marks and the female brownish with
  no horns
scope: A big Indian antelope; also called blue bull, nilgai and nylghau, not a deer and not a goat.
examples:
- A nylghai grazed at the edge of the forest.
- The male nylghai showed white marks on its blue-grey coat.
