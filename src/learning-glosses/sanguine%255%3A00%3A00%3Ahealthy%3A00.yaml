simpleMeaning: having a healthy somewhat red color, often seen in people who spend time outdoors
scope: 'Also called ruddy, florid and rubicund: having a healthy somewhat red color, often seen in people
  who spend time outdoors. It is not the cheerful, hopeful sense, and not a red-brown chalk used for drawing.'
examples:
- His sanguine face showed years of work in the fields.
- After a winter indoors, her once sanguine cheeks had turned pale.
