simpleMeaning: In grammar, the plain form of a verb that puts what is said as something true, with no
  special mark.
scope: In grammar, the plain verb form that puts what is said as something true, also called the indicative,
  the declarative, the common mood, the declarative mood or the indicative mood; not a wish form and not
  a command form.
examples:
- In the sentence 'She runs daily,' the verb is in the fact mood.
- The fact mood puts the act as something true.
