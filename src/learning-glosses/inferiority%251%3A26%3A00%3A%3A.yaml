simpleMeaning: the state of being not as good as someone or something else, or of being lower in rank
scope: The condition of being lower or less good than others, not one poor quality in a thing.
examples:
- She had a strong feeling of inferiority next to her older sister.
- The team's inferiority lasted all season, and they lost every game.
