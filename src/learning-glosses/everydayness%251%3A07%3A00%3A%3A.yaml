simpleMeaning: the plain, ordinary feel of a thing because it happens often and is seen everywhere
scope: 'Also called commonness and commonplaceness: the plain, ordinary feel of a thing because it happens
  often and is seen everywhere, not something rare and not something new or strange.'
examples:
- The everydayness of the morning train made the trip feel dull.
- There was a quiet everydayness about the small town market.
