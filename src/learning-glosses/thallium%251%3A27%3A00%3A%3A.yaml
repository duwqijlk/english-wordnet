senseId: 'thallium%1:27:00::'
synsetId: 14681997-n
simpleMeaning: A soft-grey metal easy to shape, like tin but going dull in air; very poisonous, used in
  poisons for rodents and insects; found in zinc blende and some iron ores.
scope: Also called Tl and atomic number 81; a soft grey metal that goes dull in air, not tin, which it
  resembles.
examples:
- Thallium is a very poisonous metal.
- The poison contained thallium.
