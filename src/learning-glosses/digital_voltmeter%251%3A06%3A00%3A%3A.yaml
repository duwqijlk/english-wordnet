simpleMeaning: an electric tool that shows as numbers how strong the push is that drives an electric current
scope: An electric tool that shows as numbers how strong the push is that drives an electric current,
  and not a tool that shows it with a moving needle.
examples:
- He used a digital voltmeter to check the battery.
- The digital voltmeter showed 12 on its screen.
