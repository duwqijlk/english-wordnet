simpleMeaning: leaning toward the side that stands for keeping things as they are
scope: Leaning toward the side that stands for keeping things as they are, not firmly on that side and
  not leaning toward change.
examples:
- His views are rightish, though he votes with the centre.
- The paper took a rightish line on the new tax.
