simpleMeaning: The lowest of the minor Holy Orders (the smaller church ranks) in the Western Church before
  its changes, now ended by the Roman Catholic Church
scope: 'Also called ostiarius and ostiary: this is a church rank, not a person who stands at the door
  of a courtroom or law-making room.'
examples:
- In the old Western Church, a doorkeeper held the lowest of the minor Holy Orders.
- The list of church ranks put the doorkeeper below all the other minor Holy Orders.
