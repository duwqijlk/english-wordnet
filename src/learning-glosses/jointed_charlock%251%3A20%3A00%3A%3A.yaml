simpleMeaning: A weed from Europe and Asia with yellow, mauve or white flowers and fruits like small pods.
scope: A weed from Europe and Asia with yellow, mauve or white flowers and fruits like small pods; runch,
  wild radish and wild rape are other names for this sense, not a garden flower and not a crop plant.
examples:
- Jointed charlock grew along the edge of the field.
- The jointed charlock showed yellow flowers in May.
