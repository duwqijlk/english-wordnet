simpleMeaning: The colour of blood, cherries, tomatoes, or rubies — a red at the end of the colour range,
  right beside orange.
scope: 'Also called red, scarlet, crimson, ruby, cherry, and reddish: the colour of blood, cherries, tomatoes,
  or rubies, not the healthy red of a face that spends time outdoors.'
examples:
- The ruddy glow of the fire lit the room.
- A ruddy sunset filled the western sky.
