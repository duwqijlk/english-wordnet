simpleMeaning: 'Used for firing some kinds of cannon (a large heavy gun): a cord with a hook fixed to
  it'
scope: A cord used to fire a cannon, not a line on a ship for holding the ropes and sails in place, and
  not a cord worn around the neck to hold a knife or whistle.
examples:
- The soldier pulled the lanyard to fire the cannon.
- The lanyard's hook was fixed to the cannon before it was fired.
