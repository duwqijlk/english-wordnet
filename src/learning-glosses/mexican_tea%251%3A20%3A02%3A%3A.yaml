simpleMeaning: A sweet-smelling goosefoot of Europe and Asia with oak-like leaves and many yellow-green
  flowers, now settled in North America.
scope: This is a sweet-smelling goosefoot of Europe and Asia with oak-like leaves and many yellow-green
  flowers, now settled in North America; feather geranium, Atriplex mexicana, Chenopodium botrys and Jerusalem
  oak are other names for this sense, not the rank-smelling pigweed of the Americas.
examples:
- Mexican tea grew wild along the fence.
- The Mexican tea in the garden had many yellow-green flowers.
