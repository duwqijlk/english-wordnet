simpleMeaning: The police sergeant in charge at a police building while on duty
scope: The police sergeant in charge at a police building while on duty, not a guard on the street and
  not the head of the whole police force.
examples:
- The station keeper signed the report at midnight.
- The station keeper was on duty when the call came in.
