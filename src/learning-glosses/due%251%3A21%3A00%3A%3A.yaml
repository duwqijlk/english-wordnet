simpleMeaning: money that a member must pay to belong to a group or club.
scope: This is not a favour owed to someone, and not the adjective meaning 'expected at a certain time';
  it is a regular payment.
examples:
- She paid her dues to the union every month.
- He forgot to pay his dues and lost his membership.
