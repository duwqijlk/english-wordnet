simpleMeaning: A channel that brings water to a mill, a water wheel, or a turbine.
scope: A channel that brings water to a mill or turbine, not the channel that carries water away and not
  a canal for boats.
examples:
- Water flowed down the headrace to turn the mill wheel.
- The headrace fed the turbine that powered the old mill.
