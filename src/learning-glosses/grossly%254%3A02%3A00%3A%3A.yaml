simpleMeaning: to a degree that is far too great
scope: This tells how something is done to a degree that is far too great; not a total amount before parts
  are taken away, and not something that is sickening to see or smell.
examples:
- The price was grossly higher than the shop had promised.
- He was grossly unfair to the new workers and gave them the worst jobs.
