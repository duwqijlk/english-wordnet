simpleMeaning: the basic unit of luminous intensity in the International System, equal to one sixtieth
  of the light per square centimeter from a black body at 2,046 kelvin.
scope: This is the unit of luminous intensity, another name for the candela and cd, not an ordinary wax
  candle.
examples:
- One standard candle equals one candela.
- Before the candela was adopted, the standard candle served as a practical unit of light.
