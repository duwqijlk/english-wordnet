simpleMeaning: to send something flying with great force, or drive it forward hard
scope: This is throwing or pushing something hard, not breaking it, causing a collision, or moving noisily;
  'dash' is another name for this sense.
examples:
- She crashed the plate against the wall in a fit of temper.
- He crashed the heavy box down on the table.
