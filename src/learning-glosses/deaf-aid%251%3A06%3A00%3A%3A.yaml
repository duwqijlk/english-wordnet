simpleMeaning: an electric tool that makes sounds louder and is worn by a person who hears poorly
scope: An electric tool that makes sounds louder for a person who hears poorly, also called a hearing
  aid; not earphones for music and not a cure for poor hearing.
examples:
- She turned up her deaf-aid so she could hear the speaker.
- His deaf-aid made the birdsong loud enough to hear.
