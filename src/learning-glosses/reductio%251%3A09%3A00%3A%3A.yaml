senseId: 'reductio%1:09:00::'
synsetId: 05833309-n
simpleMeaning: a way of proving a claim false by showing that what follows from it makes no sense, or
  of proving it by showing that its denial leads to a clash
scope: Also called reductio ad absurdum; a way of arguing by showing a claim leads to nonsense, not a
  direct proof from facts.
examples:
- He answered the claim with a reductio, showing it led to nonsense.
- The reductio showed that denying the claim ends in a clash.
