simpleMeaning: the act of making lines that show a plan or the shape of a thing
scope: The act of drawing a plan or the shape of a thing, not a drawing made by copying lines through
  thin paper.
examples:
- The tracing of the new road took the whole morning.
- She began the tracing of the house plan before lunch.
