simpleMeaning: A problem in pregnancy in which too much of the fluid around the unborn child builds up
scope: This is a problem in pregnancy in which too much fluid builds up around the unborn child, not a
  normal amount of fluid and not a problem after birth.
examples:
- Too much fluid around the unborn child showed she had hydramnios.
- The scan found hydramnios, with too much fluid around the baby.
