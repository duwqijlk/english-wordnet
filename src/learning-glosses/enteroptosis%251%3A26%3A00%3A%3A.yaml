simpleMeaning: A state in which the gut sits lower than it should inside the belly.
scope: A state in which the gut sits lower than it should inside the belly, not a swelling of the gut
  and not a gut that has slipped out of the body.
examples:
- Enteroptosis means her gut sits lower than it should.
- The doctor found enteroptosis when he felt her belly.
