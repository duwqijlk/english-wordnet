simpleMeaning: A married man who looks after the home while his wife earns the money for the family.
scope: A married man who looks after the home while his wife earns the money; house husband is another
  name for this sense, not a man who works outside the home and not a man who lives alone.
examples:
- He is a househusband while his wife works in the city.
- The househusband takes the children to school each morning.
