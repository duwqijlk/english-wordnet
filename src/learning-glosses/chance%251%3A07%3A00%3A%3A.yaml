simpleMeaning: how likely it is that an event will happen, often shown as a number that compares the results
  that count as a success with all the results that are possible
scope: This sense is not an occasion or opportunity to do something, and not an unplanned or lucky event.
examples:
- The chance of rain is high this afternoon, so take an umbrella.
- Players calculated the chances of drawing a red card from the deck.
