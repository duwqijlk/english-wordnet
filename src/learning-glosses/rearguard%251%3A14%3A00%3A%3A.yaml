simpleMeaning: a small group of soldiers sent to guard the back of an army when it is moving back
scope: A group of soldiers who guard the back of an army that is moving back, not the main army in front
  and not one single guard.
examples:
- The rearguard stayed behind to protect the army as it moved back.
- A small rearguard held the bridge while the rest of the soldiers left.
