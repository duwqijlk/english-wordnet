simpleMeaning: A link that ties an electrical device to a large conductor, like the Earth itself, which
  is treated as having zero voltage.
scope: This is not the prepared painting surface, the football act of throwing the ball down to stop play,
  the solid land or soil, a reason for belief, or the first coat of paint.
examples:
- The electrician checked the ground before touching the metal casing.
- Without a proper ground, the whole circuit can give you a shock.
