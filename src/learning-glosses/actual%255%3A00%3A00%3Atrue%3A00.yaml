senseId: actual%5:00:00:true:00
synsetId: 02470192-s
simpleMeaning: True to the real, essential nature of something, rather than only seeming to be so.
scope: This describes what something truly is at its core, not what exists now as opposed to what is planned,
  and not what only appears to be true.
examples:
- The actual meaning of the poem is much darker than the surface reading.
- Beneath the jokes, the actual point of his speech was serious.
