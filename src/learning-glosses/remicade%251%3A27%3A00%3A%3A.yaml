simpleMeaning: A lab-made antibody used to treat Crohn's disease and rheumatoid arthritis, given by a
  slow drip into a vein; a doctor must decide how much to use and how often.
scope: Also called infliximab; a lab-made antibody used to treat Crohn's disease and rheumatoid arthritis,
  given by a slow drip into a vein, its use and dose decided by a doctor.
examples:
- The doctor gave Remicade by infusion for her Crohn's disease.
- Remicade helped his rheumatoid arthritis after other drugs had failed.
