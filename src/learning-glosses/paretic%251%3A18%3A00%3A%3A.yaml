simpleMeaning: A person with paresis, a weakness that leaves part of the body only partly able to move
scope: A person with a weakness that leaves part of the body only partly able to move, not a person who
  cannot move at all and not a person with a short illness.
examples:
- The paretic needed help to climb the stairs.
- After the stroke, he was paretic on one side.
