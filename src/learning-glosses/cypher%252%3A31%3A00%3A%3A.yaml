synsetId: 00638921-v
simpleMeaning: To find a sum by doing the maths.
scope: This sense is also called a figure, a reckon, a calculate, a compute, and a cipher, for finding
  a sum by doing the maths, where figuring is working out an answer with arithmetic or other mathematical
  work, reckoning is working out an answer by doing sums, and calculating is working out an answer with
  numbers, by adding, taking away, multiplying, dividing, or other math work, unlike the sense for a thing
  of no weight or worth at all, and unlike the sense for a figure that leaves any number it joins unchanged.
examples:
- She cyphered the sum by doing the maths.
- Cyphering finds sums by doing the maths.
