simpleMeaning: A blade that spins at a helicopter's tail, the helicopter having a single main rotor, stopping
  it turning the other way to its main rotor.
scope: Also called anti-torque rotor, this is a blade that spins at a helicopter's tail, the helicopter
  having a single main rotor, stopping it turning the other way to its main rotor, where anti-torque rotor
  is that same tail blade.
examples:
- The tail rotor spins fast.
- A broken tail rotor makes the helicopter spin.
