simpleMeaning: In ecology, the way a plant or animal gets a firm place in a new home in nature, and starts
  to live and grow there
scope: In ecology, a plant or animal settling into a new home in nature, not the act of starting a group
  or a business.
examples:
- The establishment of the fox in the valley took only a few years.
- After the establishment of the new trees, birds began to nest among them.
