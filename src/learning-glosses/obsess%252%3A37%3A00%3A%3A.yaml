simpleMeaning: to keep following someone and not leave them alone, like a spirit that stays near them
scope: 'Also called ghost and haunt: this is about keeping after a person and not leaving them alone,
  not just meeting or seeing someone once.'
examples:
- A strange fear obsessed her, and it followed her day and night.
- The thought of the old house obsessed him, as if it would not leave him.
