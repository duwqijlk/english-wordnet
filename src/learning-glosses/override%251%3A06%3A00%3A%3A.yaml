simpleMeaning: a control you work by hand to put right what a machine does on its own
scope: A hand-worked control that corrects a machine, not the act of making a rule or order void and not
  the act of taking over a gear change.
examples:
- He used the override to stop the lift between floors.
- The override lets a driver take back control from the automatic system.
