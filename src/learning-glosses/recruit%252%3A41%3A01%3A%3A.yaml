simpleMeaning: to sign someone up in an official way so they join a group or take part in something
scope: Also called enter, raise and enroll. This is signing someone up in an official way to join a group,
  not the person who has just joined.
examples:
- The club recruited many new members this year.
- The party recruited young people to join its team.
