simpleMeaning: Strong side fins let this shore fish of the warm coasts of Africa and Asia move on land.
scope: Also called a mudskipper, this fish moves on land on strong side fins and is not one that swims
  only in the sea.
examples:
- A mudspringer left the water and moved on land on its strong side fins.
- The warm coasts of Africa and Asia are home to mudspringers.
