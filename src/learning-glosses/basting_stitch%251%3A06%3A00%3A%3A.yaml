simpleMeaning: Layers of cloth stay together for a short time with these loose loops of thread.
scope: This loose way of holding layers of cloth together with thread for a short time is also called
  baste, tacking and basting.
examples:
- The basting stitch held the layers together before the final sewing.
- The basting stitch came out easily once the seam was sewn.
