simpleMeaning: With a flat board, a surveyor uses this tool to draw a line toward a far thing and to find
  the size of an angle.
scope: 'Also called alidade: a tool a surveyor uses with a flat board to draw lines toward far things
  and find angles, not the moving top part of a theodolite.'
examples:
- The surveyor used the alidad to draw a line toward the far hill.
- With the alidad, she found the size of the angle between the two marks.
