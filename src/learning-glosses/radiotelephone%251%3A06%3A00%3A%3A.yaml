simpleMeaning: Voices travel on waves through the air, not through wires, so people far apart can talk
  to each other with this
scope: 'Another name for a radiophone: a way for people far apart to talk through the air, not a set for
  listening to broadcasts and not a phone joined by wires.'
examples:
- The ship's radiotelephone linked the crew to the port without any wires.
- He answered the radiotelephone and heard the rescue team's voice.
