simpleMeaning: easy to squash, soft, and full of tiny holes, and it can be pressed down easily
scope: Also called squishy, squashy and spongelike; this means soft and easy to press down, not the sense
  about taking in water.
examples:
- The spongy bread was soft and easy to press flat.
- She sat on a spongy seat that sank down under her.
