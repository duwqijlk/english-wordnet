simpleMeaning: feeling touch, where your body is, and what goes on inside it
scope: 'Also called somaesthesia, somatesthesia and somatic sensation: the feel of touch, body position
  and inner feelings, not sight or hearing, and not the wider power to sense the body.'
examples:
- Somesthesia told him the ground was cold under his bare feet.
- She used somesthesia to feel how her hand moved in the dark.
