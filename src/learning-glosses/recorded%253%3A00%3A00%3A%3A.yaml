simpleMeaning: put down in a form that lasts, especially on film or tape, so it can be played or shown
  again
scope: This sense is about sound or pictures kept on film or tape so they can be played again, not about
  shares where the owner's name is put in an official list.
examples:
- She listened to a recorded song from many years ago.
- We watched the recorded show again the next day.
