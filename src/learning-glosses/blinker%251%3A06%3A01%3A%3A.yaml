simpleMeaning: a small piece of leather sewn to a horse's head strap beside its eye, so it cannot see
  things to the side
scope: 'Also called blinder and winker: this is the leather piece for a horse''s eye, not a flashing light
  on a car or a light used as a signal.'
examples:
- The horse wore a blinker on each side so it would not look to the side.
- She sewed a new leather blinker to the horse's strap.
