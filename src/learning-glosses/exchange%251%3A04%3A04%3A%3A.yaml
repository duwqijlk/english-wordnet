senseId: 'exchange%1:04:04::'
synsetId: 00167884-n
simpleMeaning: In chess, a swap, usually on back-to-back moves, in which each player takes a piece of
  the same worth as the one they lost.
scope: This is a trade of pieces of equal worth during play, not the chess gain or loss of a rook in return
  for a knight or bishop, not the general act of swapping one thing for another, and not the building
  or office where telephone lines are joined so that calls can get through.
examples:
- After the exchange of knights, the position opened up for both sides.
- He avoided the exchange because it would leave his king exposed.
