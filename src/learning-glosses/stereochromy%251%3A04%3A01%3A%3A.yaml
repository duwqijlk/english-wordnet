synsetId: 92444316-n
simpleMeaning: 'Paint is made to stay put on walls by a set of changes between lime, fluosilicic acid,
  and water glass: that is this way of painting.'
scope: This way of painting walls fixes the paint by a set of changes, not by letting it dry on its own.
examples:
- The old wall was painted by stereochromy, with lime and water glass fixing the paint.
- Through its set of changes, stereochromy held the paint fast on the wall.
