simpleMeaning: bread from India, made to rise before it is baked in a clay oven, and usually shaped like
  a teardrop
scope: 'Also called nan: this bread from India, baked in a clay oven, not other Indian foods such as rice
  or curry.'
examples:
- We ate warm naan with our curry.
- The naan came from the clay oven shaped like a teardrop.
