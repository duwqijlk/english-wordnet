simpleMeaning: Heat a liquid until it turns to steam and cool the steam back to liquid to get a strong
  liquid with alcohol in it, not a fermented one
scope: Also called booze, hard liquor, liquor and spirits, this is a strong alcoholic drink made by distilling,
  not a fermented drink like beer and not a soft drink.
examples:
- He ordered a hard drink at the bar.
- She prefers a hard drink to beer with her meal.
