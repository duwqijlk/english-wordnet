simpleMeaning: having parts that fit together in a neat way, in a way that makes sense, and in a way that
  looks or feels pleasing
scope: 'Also called ordered and logical: this describes parts that fit together well, not being in agreement
  with something or being the same every time.'
examples:
- The design is consistent, with every part fitting the others in a neat, pleasing way.
- 'His argument was consistent: each part followed in a clear order from the part before.'
