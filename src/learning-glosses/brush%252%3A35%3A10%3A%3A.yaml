simpleMeaning: spread a coat of something over a surface with a bristled tool
scope: This is spreading a layer over a surface, not rubbing or cleaning something with a bristled tool,
  and not removing matter from it.
examples:
- Brush the pastry with beaten egg before it goes into the oven.
- She brushed each bun with melted butter and sprinkled on sesame seeds.
