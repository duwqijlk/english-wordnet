simpleMeaning: In medicine, a bad state of illness that keeps getting worse, fights off treatment, and
  is likely to kill.
scope: 'Also called malignance: in medicine, a bad illness that grows worse, resists treatment, and tends
  to kill, not a passing sickness.'
examples:
- The doctors found a malignancy in her lung.
- The malignancy had spread too far for treatment to help.
