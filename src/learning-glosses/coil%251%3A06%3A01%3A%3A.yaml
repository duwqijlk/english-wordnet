simpleMeaning: In electronics, a spiral of wire with a covering round it, that makes a circuit slow to
  change the power flowing through it
scope: A wound wire in a circuit, not a tube wound in a spiral and not the part that sends strong power
  to spark plugs in a car.
examples:
- The coil in the radio slowed the change in the current.
- He fitted a new coil into the old radio set.
