simpleMeaning: mostly about ideas and what may be true in thought, rather than about what works in real
  life
scope: Mostly about ideas rather than what works in real life, not the closely related sense that sets
  ideas against their practical uses.
examples:
- Theoretical science asks how things work in thought, not how to build them.
- His theoretical work has little use in daily life.
