simpleMeaning: With a frozen layer below, this dark wet earth is found in the cold lands of the far north.
scope: This is the earth of Arctic and subarctic lands, dark and wet above a frozen layer below.
examples:
- The tundra soil felt wet underfoot, with a frozen layer below.
- We dug a hole in tundra soil and found the frozen layer below.
