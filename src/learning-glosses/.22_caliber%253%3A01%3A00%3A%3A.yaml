simpleMeaning: telling the size of a gun, or the shot it fires, by the hole down its barrel, a little
  more than a fifth of an inch wide
scope: It is also called .22-caliber, .22-calibre, and .22 calibre, and it tells the size of a gun or
  its shot by the hole down its barrel, a little more than a fifth of an inch wide, not of one with a
  wider bore.
examples:
- He held a .22 caliber pistol.
- She cleaned a .22 caliber rifle.
