simpleMeaning: a ball in baseball made illegal when the thrower smears it with a wet or greasy substance
  before the throw
scope: An illegal throw in baseball, also called a spitball; not a normal fast ball and not a ball made
  wet by rain.
examples:
- The umpire called the spitter an illegal pitch and threw the pitcher out of the game.
- He was caught throwing a spitter in the third inning.
