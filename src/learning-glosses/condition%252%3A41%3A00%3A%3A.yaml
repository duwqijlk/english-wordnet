simpleMeaning: To train a child or animal through teaching and repeated practice, especially so that they
  learn self-control.
scope: This is about teaching and practice that build self-control in a child or animal, not about setting
  terms in a contract and not about creating an automatic reflex in a laboratory.
examples:
- Parents condition their children to be polite at the table.
- Trainers condition the horses to stand quietly while being groomed.
