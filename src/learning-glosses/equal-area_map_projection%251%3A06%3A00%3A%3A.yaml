simpleMeaning: A way to draw the earth flat so four-sided shapes from lines north to south and east to
  west keep their size in relation to their size on the globe.
scope: A way of drawing the earth flat that keeps the true size of shapes, also called equal-area projection;
  not a drawing that keeps shapes true and not a flat drawing of one small place.
examples:
- The equal-area map projection kept Africa at its true size next to other lands.
- Teachers like the equal-area map projection because it shows land sizes fairly.
