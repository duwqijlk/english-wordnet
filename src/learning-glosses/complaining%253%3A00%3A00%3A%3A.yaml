simpleMeaning: showing pain, or an unhappy, angry feeling about something that seems wrong
scope: Describing a person or voice that shows pain or an unhappy, angry feeling, not quiet and accepting
  without showing any such feeling.
examples:
- He spoke in a complaining voice about the long wait at the hospital.
- The complaining patient kept asking the nurse for help with the pain.
