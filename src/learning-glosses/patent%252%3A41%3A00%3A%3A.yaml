simpleMeaning: to give someone the only right to a new thing, so no one else has any right over it
scope: To give a person the sole right over a new thing, not to ask for such a right and not the paper
  that gives it.
examples:
- The state will patent the new drug for its maker.
- The company patented its new lock last year.
