simpleMeaning: A spleenwort of Europe, Africa and Asia, with feather-like fronds, that gives a substance
  that draws tissues together
scope: This is a spleenwort with feather-like fronds, not a spleenwort with round undivided fronds; black
  spleenwort is another name for this sense.
examples:
- Asplenium adiantum-nigrum grows on old walls in Europe.
- We found Asplenium adiantum-nigrum on the old stone wall.
