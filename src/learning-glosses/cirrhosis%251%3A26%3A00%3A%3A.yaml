simpleMeaning: A long-lasting disease that keeps the liver from working as it should, mainly caused by
  drinking too much alcohol over a long time.
scope: A long-lasting disease of the liver, also called cirrhosis of the liver, that keeps the liver from
  working as it should, mainly caused by drinking too much alcohol over a long time.
examples:
- Years of heavy drinking had left him with cirrhosis.
- The doctor said the cirrhosis was stopping her liver from working as it should.
