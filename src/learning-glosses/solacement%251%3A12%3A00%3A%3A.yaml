simpleMeaning: The ease you feel when comforted in times of letdown.
scope: This sense is also called solace and consolation, for the ease you feel when comforted in times
  of letdown, where solace is the good feeling you get when someone comforts you after a letdown, unlike
  the sense for ease in letdown or woe.
examples:
- Solacement is the ease you feel when comforted.
- Solacement eases letdown.
