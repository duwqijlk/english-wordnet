simpleMeaning: To set a thing to fit a stated size or measure.
scope: To set a thing to fit a stated size or measure, not to work out a size by measuring and figuring,
  not to guess at a size, and not the width of a tube or the space between rails.
examples:
- The workers gauged the pipe to the stated size before fitting it.
- He gauged the new part to fit the old machine.
