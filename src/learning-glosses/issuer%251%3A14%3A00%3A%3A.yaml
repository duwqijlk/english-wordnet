simpleMeaning: A body or group that puts out something, such as shares, books, or money
scope: A body or group that puts out shares, books or money, not a bank that sells shares for others and
  not a writer.
examples:
- The issuer of the bonds is the city council.
- As an issuer of shares, the firm must file reports.
