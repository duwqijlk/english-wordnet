simpleMeaning: any tool used to make an edge cut better, or to make a point finer
scope: This is a tool used to make a blade or a point ready for use, not the blade itself and not a person
  doing this work.
examples:
- He ran the knife through the sharpener before cutting the meat.
- She put the pencil in the sharpener to make a fine point.
