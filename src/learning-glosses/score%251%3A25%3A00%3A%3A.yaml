simpleMeaning: A shallow cut on a surface, such as a notch used to count things.
scope: This is a cut or tally notch in a surface, not the points in a game and not the act of marking
  a surface with cuts.
examples:
- A deep score ran across the tabletop where the knife had slipped.
- The carpenter made a score in the beam to mark the length.
