simpleMeaning: about the sockets that hold the teeth, or the part of the upper jaw that holds them
scope: About the sockets of the teeth or the upper jaw, not about the tiny air sacs in the lungs and not
  about a sound made with the tongue.
examples:
- The dentist pointed to the alveolar bone around the tooth.
- An alveolar process is the ridge that holds the teeth.
