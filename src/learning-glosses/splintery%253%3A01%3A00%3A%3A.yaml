senseId: 'splintery%3:01:00::'
synsetId: 02812172-a
simpleMeaning: like, made of, or set with long thin sharp-pointed pieces, especially pieces of wood
scope: Also called slivery, this describes a thing that is like, made of, or set with long thin sharp
  pieces of wood, not a smooth clean surface.
examples:
- The old fence felt rough and splintery to touch.
- We walked with care on the splintery floor of old boards.
