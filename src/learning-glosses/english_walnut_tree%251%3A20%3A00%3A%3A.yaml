simpleMeaning: A woody plant of Europe and Asia, prized for its large nuts that can be eaten and for its
  hard wood with a rich pattern; grown in many places.
scope: A woody plant of Europe and Asia prized for its large nuts and its hard wood with a rich pattern,
  also called Circassian walnut, English walnut, Juglans regia and Persian walnut; not the nut alone,
  which is the same word in another sense.
examples:
- The English walnut tree in the orchard gives large nuts each year.
- English walnut tree wood has a rich pattern prized by makers of fine boxes.
