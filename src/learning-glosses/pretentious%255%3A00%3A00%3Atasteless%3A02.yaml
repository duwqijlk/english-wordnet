simpleMeaning: of a display, cheap and showy, or in bad taste
scope: 'Also called ostentatious: about a display that looks cheap and showy, or is in bad taste. Not
  about a person trying to look important.'
examples:
- They put on a pretentious display of gold and bright lights that looked cheap.
- Her pretentious display at the party was showy and in bad taste.
