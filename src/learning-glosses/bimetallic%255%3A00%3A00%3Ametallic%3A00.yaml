simpleMeaning: made from two different metals or mixes of metals joined together, especially as thin flat
  layers stuck to each other
scope: 'Also called bimetal: made of two kinds of metal or mixes of metal joined together, not a single
  metal and not two metals merely laid side by side.'
examples:
- The bimetallic strip bends as it warms up.
- A bimetallic coin has two different metals joined in one piece.
