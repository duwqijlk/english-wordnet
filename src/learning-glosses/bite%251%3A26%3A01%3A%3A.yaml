simpleMeaning: A painful injury in the skin made when an insect pushes in its stinger.
scope: An insect-sting wound, also called a sting or insect bite, not a wound from an animal's or person's
  teeth and not the act of biting.
examples:
- The bite on her ankle swelled up within minutes.
- He had a red, itchy bite on his arm from a mosquito.
