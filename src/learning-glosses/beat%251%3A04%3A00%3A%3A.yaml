simpleMeaning: The act of sailing toward the wind by steering as near as possible to where it comes from.
scope: This is a way of sailing toward the wind, not a wave pulse, a rhythm, or a blow.
examples:
- After a hard beat to windward, they finally reached harbour.
- The yacht's beat into the breeze took all morning.
