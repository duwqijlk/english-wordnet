simpleMeaning: One thousand grams, the base unit of mass in the worldwide system of units
scope: This is one thousand grams, the base unit of mass in the worldwide system of units; kilo and kilogram
  are other names for this sense, not a gram itself and not a unit of weight in the old British system.
examples:
- The bag weighs 5 kg.
- Add 2 kg of flour to the mix.
