senseId: 'ecological_niche%1:26:00::'
synsetId: 13947369-n
simpleMeaning: In ecology, whether a kind of living thing lives on depends on how it lives and fits in
  among other living things and the land and water around it
scope: 'Also called niche: in ecology, how a kind of living thing lives and fits in among others and the
  land and water around it, not the place where it lives and not a small hollow in a wall.'
examples:
- The ecological niche of the owl depends on the small animals it hunts and the trees it nests in.
- Two kinds of fish can share one lake if their ecological niches do not match.
