simpleMeaning: a plant part with edges cut almost to the base, so it forms clear separate parts or rounded
  flaps
scope: A plant part with edges cut almost to the base into clear parts, not a whole smooth-edged plant
  part and not a leaf cut only at the edge.
examples:
- The parted leaf had deep cuts that nearly reached its base.
- You can tell a parted leaf by the clear lobes along its edge.
