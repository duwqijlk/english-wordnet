simpleMeaning: fed by a fungus that helps it take food from the forest floor, this wildflower grows from
  a hard clump of stems under the ground
scope: This wildflower grows from a hard clump of stems under the ground and takes food from the forest
  floor with a fungus's help, not through roots of its own.
examples:
- Coral root grows in the forest, fed by the fungus that helps it take food from the ground.
- The coral root had a hard clump of stems under the ground.
