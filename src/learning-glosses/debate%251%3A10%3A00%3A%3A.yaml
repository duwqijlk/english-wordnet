senseId: 'debate%1:10:00::'
synsetId: 07256764-n
simpleMeaning: A planned talk in which one side states a clear idea and the other side speaks against
  it, most of the time ending with a vote
scope: A planned talk for and against a clear idea, most of the time ending with a vote, not a heated
  quarrel and not a casual talk.
examples:
- The debate on the new law lasted two hours.
- They held a debate before the class voted on the plan.
