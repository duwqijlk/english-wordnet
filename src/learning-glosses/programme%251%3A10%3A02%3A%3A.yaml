simpleMeaning: In computing, a set of instructions in order, that a computer can read and carry out
scope: 'Also called program: a set of instructions for a computer; not the printed list of acts or games
  at a show or sports event, and not the act of arranging an event.'
examples:
- This programme checks your spelling as you type.
- He wrote a programme that sorts names from A to Z.
