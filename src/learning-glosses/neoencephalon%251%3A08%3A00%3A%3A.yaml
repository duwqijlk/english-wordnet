simpleMeaning: The outer layer of the brain, with the parts joined to it, is the newest part of the brain
  in the history of life
scope: This is the newest part of the brain in the history of life, also called neencephalon; not the
  older parts of the brain.
examples:
- The neoencephalon includes the cerebral cortex.
- The neoencephalon grew later in the history of life than the rest of the brain.
