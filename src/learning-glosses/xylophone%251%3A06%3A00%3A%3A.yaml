simpleMeaning: A music tool with wooden bars set to make all notes, parts under the bars to make the sound
  stronger, and hit with small sticks
scope: 'Also called marimba: a music tool with wooden bars hit with small sticks, not a drum hit with
  the hands and not a set of metal bells.'
examples:
- She hit the wooden bars of the xylophone with two small sticks.
- The children learned a short song on the xylophone in music class.
