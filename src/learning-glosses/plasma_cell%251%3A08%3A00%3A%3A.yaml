simpleMeaning: A unit that grows from a B lymphocyte (a white blood unit) when a certain marker sets off
  a defence, found in bone marrow and sometimes in the blood
scope: A unit that grows from a B lymphocyte; plasmacyte is another name for this sense, and this is not
  the B lymphocyte itself.
examples:
- The plasma cell grew from a B lymphocyte after a marker set off a defence.
- Plasma cells are found in bone marrow and sometimes in the blood.
