simpleMeaning: A cube-shaped hard part on the outer side of the ankle.
scope: A cube-shaped bone of the ankle, not a bone of the hand and not the heel bone.
examples:
- The cuboid bone sits on the outer side of the foot.
- He broke a cuboid bone in a fall.
