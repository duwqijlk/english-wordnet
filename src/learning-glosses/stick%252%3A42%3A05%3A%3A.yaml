schema: oewn-learning-gloss-v2
senseId: 'stick%2:42:05::'
synsetId: 02644929-v
simpleMeaning: keep giving wholehearted support to a person, cause, or belief
scope: Standing behind a person, cause, or belief as a committed supporter or follower; the related sense
  of being loyal is instead about staying faithful and true to someone or a promise, not about putting
  up with hardship, and it has nothing to do with surfaces clinging.
examples:
- He stuck to his faith even after the family moved away.
- The villagers stuck to their old customs.
