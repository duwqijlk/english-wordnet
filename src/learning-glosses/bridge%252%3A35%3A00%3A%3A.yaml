simpleMeaning: to build a structure that lets people or vehicles get over a river, road, or railway.
scope: This means putting a crossing in place, not travelling across one that is already there.
examples:
- Engineers bridged the river in less than a year.
- The council bridged the railway to link the two halves of the town.
