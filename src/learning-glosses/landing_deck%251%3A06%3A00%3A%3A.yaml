simpleMeaning: Planes take off and come down on the top flat part of a big ship that carries planes
scope: 'Also called a flight deck: the top flat part of a ship that carries planes, where planes take
  off and come down, not a lower deck and not a runway on land.'
examples:
- The plane touched down on the landing deck of the carrier.
- Crew members cleared the landing deck before the next jet arrived.
