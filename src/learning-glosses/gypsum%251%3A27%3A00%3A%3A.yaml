simpleMeaning: To make cement and plaster, above all plaster of Paris, people use a common white or colourless
  mineral, a form of calcium sulphate with water in it.
scope: A common white or colourless mineral used for cement and plaster, not a coloured stone.
examples:
- The gypsum in the quarry was white and soft enough to scratch with a nail.
- Builders mix gypsum with water to make plaster of Paris.
