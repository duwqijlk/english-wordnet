simpleMeaning: The middle point of the brow, just over the eye sockets, used when the skull is measured
scope: The middle point of the brow just over the eye sockets, used when the skull is measured; not the
  top of the head and not the bridge of the nose.
examples:
- The ophryon sits in the middle of the brow, just above the eye sockets.
- The doctor marked the ophryon before measuring the skull.
