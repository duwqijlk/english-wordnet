simpleMeaning: A warm-water fish like a goby that lies still on the bottom in shallow water
scope: A tropical fish like a goby that rests quietly on the bottom in shallow water, not a person asleep,
  not a hidden agent, not a train car, and not a rail beam.
examples:
- A sleeper rested on the sand in the shallows.
- The sleeper lay still on the bottom of the pool.
