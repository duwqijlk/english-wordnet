simpleMeaning: One unit of current through one full loop of wire makes the push that drives magnetism,
  and this measure of that push is equal to 1.257 gilberts.
scope: This measure of the push that drives magnetism through a coil is equal to 1.257 gilberts, not a
  measure of electric current itself.
examples:
- One ampere-turn comes from one ampere through one turn of the coil.
- The ampere-turn of the coil was 1.257 gilberts.
