simpleMeaning: Small white flowers shaped like stars grow on a common plant of North America that lives
  for years, with many branches and leaves like those of a low shrub.
scope: This common plant of North America bears small white star-shaped flowers, and is not the other
  kind of heath aster with small white flower heads.
examples:
- Heath asters opened their small white flowers.
- The heath aster lived for years.
