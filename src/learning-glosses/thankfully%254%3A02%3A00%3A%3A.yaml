simpleMeaning: said to show you are glad that a good thing happened, or that a bad thing did not happen
scope: A way of saying you are glad about how things turned out, not the manner of giving thanks.
examples:
- Thankfully, the rain stopped before we left the house.
- Thankfully he didn't come to the party.
