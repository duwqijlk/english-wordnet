simpleMeaning: the size of a wave at each point, set against its size elsewhere, stays the same over time,
  as with sound in a room or a signal in a wire
scope: Also called a standing wave; not a travelling wave that moves on through a wire or a room.
examples:
- A stationary wave formed in the pipe when the sound bounced back on itself.
- The teacher showed a stationary wave on a rope tied at both ends.
