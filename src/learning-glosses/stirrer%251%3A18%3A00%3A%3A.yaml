simpleMeaning: a person who spreads scary stories passed from person to person, and makes trouble for
  others
scope: This kind of person is also called a scaremonger; it is not a tool used for mixing food or drink.
examples:
- The stirrer told everyone the factory would close, and soon the whole town was afraid.
- People stopped trusting the stirrer after his scary stories caused a fight at work.
