simpleMeaning: Which place made a coin is shown by this sign on the coin
scope: A sign on a coin showing which place made it, not the picture on the coin and not the date it was
  made.
examples:
- The mintmark on this coin shows it was made in Denver.
- Collectors look for the mintmark to tell where a coin came from.
