simpleMeaning: Ordinary sounds feel far too loud to a person whose hearing nerves overreact, so everyday
  noise is hard to bear.
scope: Also called auditory hyperesthesia and hyperacusia, this is hearing grown far too sharp for everyday
  sounds, not a loss of hearing.
examples:
- His hyperacusis made everyday sounds hurt his ears.
- Hyperacusis makes a ringing phone feel like a shout.
