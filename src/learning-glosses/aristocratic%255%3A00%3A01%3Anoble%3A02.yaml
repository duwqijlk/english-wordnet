simpleMeaning: belonging to the highest families in society, or having the qualities of those families
scope: Of the highest families in society, with blue and gentle as other names for this sense, and not
  merely rich or merely well-mannered.
examples:
- She came from an aristocratic family with a long history.
- His aristocratic bearing made him stand out in the crowd.
