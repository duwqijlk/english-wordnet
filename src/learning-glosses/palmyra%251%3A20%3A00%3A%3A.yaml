simpleMeaning: people get hard wood and sweet sap for palm wine and sugar, and leaves for thatch and weaving,
  from a tall fan-leaved tree of Africa, India, and Malaysia
scope: 'Also called longar palm, lontar, palmyra palm, toddy palm, and wine palm: a tall fan palm whose
  sap gives palm wine and sugar, not a palm grown only for its fruit.'
examples:
- The palmyra gives sweet sap that people turn into palm wine.
- Workers cut palmyra leaves to thatch the roofs of their huts.
