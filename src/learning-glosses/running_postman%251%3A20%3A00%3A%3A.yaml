simpleMeaning: Bright red-pink flowers grow on this hairy vine, which creeps along the ground or lies
  flat in western Australia.
scope: 'Also called scarlet runner: a hairy vine of western Australia with bright red-pink flowers.'
examples:
- The running postman trailed along the ground, its bright red-pink flowers open.
- In western Australia, the running postman lies flat on the ground.
