simpleMeaning: a person who makes a business or other work run in an orderly way, by putting people and
  things in the right places
scope: 'Also called organiser: a person who makes a business or other work run in an orderly way; not
  the small electronic device that works as a diary, a phone, or a clock.'
examples:
- The organizer of the school fair asked each teacher to help.
- She is a good organizer and keeps every meeting on time.
