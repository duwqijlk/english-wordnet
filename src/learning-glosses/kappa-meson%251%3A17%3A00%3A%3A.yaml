simpleMeaning: A high-speed crash between tiny bits of matter makes this bit of matter, which soon breaks
  apart
scope: 'Also called k-meson and kaon: a bit of matter made in a high-speed crash that soon breaks apart,
  not a bit of matter that lasts.'
examples:
- A kappa-meson appeared after the high-energy collision.
- The kappa-meson lasted only a very short time before it broke apart.
