simpleMeaning: a way of painting and making statues shaped by the schools of painting in Europe
scope: This is a way of painting and making statues shaped by the schools of painting in Europe; academicism
  and academism are other names for this sense, not folk painting and not modern art that breaks with
  the schools.
examples:
- The academic art of the time followed the rules of the great schools.
- Her academic art shows the clear mark of the European schools.
