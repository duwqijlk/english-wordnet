simpleMeaning: to want something very much, to want what someone else has, or to feel very glad about
  something
scope: 'Also called drool: to want something very much, want what someone else has, or feel very glad
  about it, not to make water in the mouth.'
examples:
- She was salivating over the new job she hoped to get.
- The shop owners were salivating at the thought of so many new buyers.
