simpleMeaning: An annual woody vine from Asia bearing long sprays of purple flowers and pods covered in
  dense hairs, raised in the southern US for feed and to fertilize fields.
scope: Another name for cowage, the hairy-podded Asian vine used as fodder and fertilizer; not the pods
  themselves, a separate worm treatment.
examples:
- Velvet bean smothered the trellis with purple flowers and hairy pods.
- Growers planted velvet bean between rows of corn to enrich the soil.
