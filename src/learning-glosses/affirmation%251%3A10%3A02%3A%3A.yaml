simpleMeaning: The act of saying something firmly, as a claim that you stand by
scope: This is the act of saying something firmly as a claim; statement is another name for this sense,
  not a solemn religious promise made in place of an oath.
examples:
- Her affirmation that she would help gave us hope.
- He nodded in affirmation of the plan.
