simpleMeaning: A sun-and-moon way of marking the year that sets times of worship, with an extra month
  after a month with two new moons, once in three years
scope: This is a sun-and-moon way of marking the year for Hindu worship, with an extra month once in three
  years; near kinds are the Gregorian calendar and the Jewish calendar.
examples:
- The Hindu calendar adds an extra month after a month with two new moons.
- Hindu festivals follow the Hindu calendar, a sun-and-moon way of marking the year.
