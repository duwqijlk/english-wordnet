simpleMeaning: A calming, sleep-inducing drug from the barbiturate group, specifically the sodium salt
  form of amobarbital.
scope: This is the sedative drug, not the color, the laundry whitener, the butterfly, or high social rank.
examples:
- Doctors once handed out blues for anxiety and sleeplessness.
- In the 1960s, blues were sold on the street as downers.
