schema: oewn-learning-gloss-v2
senseId: 'demonstrate%2:31:00::'
synsetId: 00666706-v
simpleMeaning: to show that something is true or right, by giving an example, an explanation, or a test
scope: Also called show, prove and establish; this sense uses an example, an explanation or a test to
  show a thing is true, not proof shown by how a person acts or looks, and not marching in protest.
examples:
- The experiment demonstrated that the plant needs light to grow.
- She demonstrated the truth of her idea with a clear example.
