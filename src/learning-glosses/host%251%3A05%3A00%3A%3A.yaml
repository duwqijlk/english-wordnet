simpleMeaning: an animal or plant that feeds and shelters a parasite, gaining nothing and often being
  harmed by it.
scope: This is a living creature that supports a parasite, not a person who invites guests.
examples:
- The tick's host was a deer.
- Some worms need two hosts to complete their life cycle.
