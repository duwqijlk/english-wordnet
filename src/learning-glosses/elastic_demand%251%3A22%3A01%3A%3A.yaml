senseId: 'elastic_demand%1:22:01::'
synsetId: 92420715-n
simpleMeaning: how much people want to buy goes up when the price falls and goes down when the price rises
scope: How much people want to buy, rising when the price falls and falling when it rises, not a wish
  to buy that stays the same whatever the price.
examples:
- Elastic demand for the tickets fell when the price went up.
- When the shop cut the price, elastic demand for the coats rose sharply.
