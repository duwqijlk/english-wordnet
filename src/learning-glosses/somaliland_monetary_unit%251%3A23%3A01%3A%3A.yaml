senseId: 'somaliland_monetary_unit%1:23:01::'
synsetId: 92438232-n
simpleMeaning: The money used in a land that calls itself free but is known by other lands as a self-ruling
  part of Somalia.
scope: The money of a land that calls itself free, not the money of Somalia itself; other lands count
  the land as a self-ruling part of Somalia.
examples:
- Prices in the market are given in the Somaliland monetary unit.
- Traders count their takings in the Somaliland monetary unit.
