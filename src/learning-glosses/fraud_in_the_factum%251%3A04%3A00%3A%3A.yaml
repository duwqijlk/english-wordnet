simpleMeaning: a trick in law where the paper a person meant to sign is not the paper they did sign, for
  one thing leading them to sign the wrong contract
scope: A trick in law where the paper signed is not the paper meant to be signed.
examples:
- The fraud in the factum came out when the signed paper proved to be a different one.
- He claimed fraud in the factum because he had signed the wrong contract.
