scope: Also called impulse explosive, this is a bursting mix that pushes shot from guns and sends rockets,
  missiles, torpedoes and depth charges on their way.
examples:
- The propellant explosive pushed the shell out of the gun.
- A propellant explosive sent the rocket on its way.
