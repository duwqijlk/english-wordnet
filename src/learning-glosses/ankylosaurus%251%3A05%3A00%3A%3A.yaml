simpleMeaning: Thought to have walked with its legs spread wide like a lizard, a creature with thick hard
  plates covering its back
scope: This is also called an ankylosaur, and it is not a lizard, though its walk is said to have looked
  like a lizard's.
examples:
- The ankylosaurus is thought to have walked with its legs spread wide like a lizard.
- Thick hard plates covered the back of the ankylosaurus.
