simpleMeaning: a wire that connects an antenna to a set that picks up waves, or a sender to a cable that
  carries those waves
scope: A wire that links an antenna to a set or a sender to a line, not the antenna itself and not the
  set that picks up the waves.
examples:
- The lead-in runs from the antenna on the roof to the radio inside.
- 'Check the lead-in: a loose wire there will spoil the sound.'
