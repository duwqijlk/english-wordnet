simpleMeaning: During the first stage of meiosis, the cell division that makes sex cells, matching chromosomes
  that pair up swap parts with each other
scope: This is also called a crossover, and it is the swapping of parts between matching chromosomes that
  pair up during the first stage of meiosis.
examples:
- Crossing over mixes the genes on paired chromosomes.
- During crossing over, the paired chromosomes swap parts.
