simpleMeaning: A sea turtle that roams far and wide, with a bendable shell of tough skin, and the biggest
  turtle alive.
scope: Also called the leatherback turtle and the leathery turtle, this is the biggest turtle alive, a
  sea turtle that roams far and wide with a bendable shell of tough skin.
examples:
- A leatherback roamed far over the open sea.
- The leatherback's bendable shell moved as it swam.
