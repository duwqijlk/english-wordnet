simpleMeaning: to keep things by cooling them fast to a very low temperature and then taking out the water
  in a vacuum
scope: This is keeping things by cold and then taking out the water in a vacuum; not keeping food in a
  fridge or drying it in the sun.
examples:
- We freeze-dry the strawberries to keep them for winter.
- The lab can freeze-dry the samples in a day.
