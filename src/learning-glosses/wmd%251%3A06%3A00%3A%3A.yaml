simpleMeaning: A weapon that kills or harms ordinary people as well as soldiers, such as nuclear, chemical
  and germ weapons.
scope: 'Also called weapon of mass destruction and W.M.D.: a weapon whose harm falls on ordinary people
  as well as soldiers, in forms such as nuclear, chemical and germ weapons.'
examples:
- WMD kill ordinary people as well as soldiers.
- The army feared the use of WMD against its soldiers.
