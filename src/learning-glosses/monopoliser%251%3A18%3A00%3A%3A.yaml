simpleMeaning: a person who takes full control of the making or selling of something
scope: A person who takes full control of making or selling something, also called monopolist and monopolizer;
  not a person who merely sells goods and not a person who buys them.
examples:
- The monopoliser fixed prices because no one else could sell the goods.
- Small traders called him a monopoliser and asked the court to stop him.
