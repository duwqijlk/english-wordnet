simpleMeaning: In astrophysics (the study of stars and space), the part that studies how the universe
  began, changed over time, and is built
scope: This is the science sense, also called cosmogeny and cosmogony, about how the universe began, changed
  and is built. It is not the sense that uses deep ideas to study how the universe began and what it is
  like.
examples:
- She studies cosmology to learn how the universe began.
- New telescopes have changed what cosmology can tell us about the early universe.
