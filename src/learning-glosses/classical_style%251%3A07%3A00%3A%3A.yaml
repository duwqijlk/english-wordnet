simpleMeaning: The way of making art of ancient Greece, which puts weight on balance of parts and pleasing
  fit.
scope: The way of making art of ancient Greece, with weight on balance and pleasing fit; not the art of
  Rome and not a modern way of making art.
examples:
- The temple was built in the classical style of ancient Greece.
- Her paintings show the balance of the classical style.
