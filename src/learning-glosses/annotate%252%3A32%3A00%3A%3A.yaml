simpleMeaning: to add notes between the lines of a text that explain its words or groups of words
scope: 'Also called comment, and another name for this sense is gloss: to add notes that explain a text,
  not just to give a short opinion about something.'
examples:
- She annotated the poem, adding notes beside the hard words.
- He annotated the old letter so readers could understand each line.
