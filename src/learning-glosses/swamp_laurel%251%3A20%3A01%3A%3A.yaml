simpleMeaning: With small purple flowers and pale leaves grey-green beneath, this laurel grows in the
  wet low ground of the northwest United States.
scope: Also called bog kalmia and bog laurel, this is the laurel of bogs, known by its small purple flowers
  and pale leaves grey-green beneath.
examples:
- A swamp laurel grew in a bog in the northwest.
- The swamp laurel's leaves were pale and grey-green beneath.
