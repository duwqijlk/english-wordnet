simpleMeaning: the loss of small bits of outer skin as they peel away or come off in flakes
scope: Skin coming off in small bits, with peeling as another name for this sense, and not hair loss or
  the act of throwing something away.
examples:
- The shedding of dead skin left his shoulders flaky.
- After the sunburn, the shedding of her skin took days.
