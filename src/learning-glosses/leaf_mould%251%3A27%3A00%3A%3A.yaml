simpleMeaning: Soil made up mainly of leaves that are rotting down.
scope: 'Also called leaf mold and leaf soil: earth made mostly of rotted plant parts, not fresh earth
  and not the fuzzy stuff that grows on damp walls.'
examples:
- He dug leaf mould into the flower beds in spring.
- A bag of leaf mould sat by the shed, dark and rich.
