simpleMeaning: smooth when you touch it, or made up of very small grains or bits.
scope: This is not praise for excellence or high quality; it concerns physical texture or the size of
  particles.
examples:
- Sift the flour until it is fine and free of lumps.
- The fabric has a fine, soft weave that feels cool against the skin.
