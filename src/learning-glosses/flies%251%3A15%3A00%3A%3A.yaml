simpleMeaning: In a theatre, the high space above the stage, out of sight of the people watching, where
  scenery is kept
scope: The space above a theatre stage for keeping scenery, not the stage itself and not the seats where
  the people watching sit.
examples:
- The flies were full of old backdrops.
- A worker in the flies lowered the painted curtain.
