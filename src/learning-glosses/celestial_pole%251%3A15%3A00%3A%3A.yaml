simpleMeaning: One of the two points where the line the Earth turns on meets the round sky above.
scope: One of two points where the Earth's turning line meets the sky, not a point on the Earth's surface
  and not the middle of the sky; pole is another name for this sense.
examples:
- The north celestial pole lies almost in line with the Pole Star.
- Stars seem to turn round the celestial pole through the night.
