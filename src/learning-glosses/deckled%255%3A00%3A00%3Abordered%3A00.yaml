simpleMeaning: describes paper made by hand, or paper made to look handmade, that has a rough, uneven
  side
scope: This describes paper with a rough, uneven side, also called deckle-edged or featheredged; not paper
  with a smooth cut side and not plain paper with straight sides.
examples:
- The deckled sheets had rough, uneven sides.
- He liked the deckled look of the old book's pages.
