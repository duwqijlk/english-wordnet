simpleMeaning: a monster that is not real, used to scare children
scope: Also called bogeyman, boogeyman, and bugbear, this is a made-up monster used to scare children,
  not the dry stuff from the nose.
examples:
- The children were afraid a booger was hiding under the bed.
- Dad joked that the booger in the closet would come out at night.
