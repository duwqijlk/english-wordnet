simpleMeaning: In psychophysics, the idea that how strong a feeling seems grows with the logarithm of
  the strength of what is felt; built on early work by E. H. Weber.
scope: Also called the Weber-Fechner law; the psychophysics rule linking how strong a feeling seems to
  the logarithm of what is felt.
examples:
- Fechner's law says that a feeling grows much more slowly than the thing that causes it.
- Our class used Fechner's law to study how people judge brightness.
