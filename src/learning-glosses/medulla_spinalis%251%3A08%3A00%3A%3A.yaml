simpleMeaning: A chief part of the nerve set, a long tube from the brain base through the spine to low-back
  top, carrying sense-move signals to and from the brain.
scope: This sense is also called spinal cord, for a chief part of the nerve set, a long tube from the
  brain base through the spine to low-back top, carrying sense-move signals to and from the brain.
examples:
- The medulla spinalis carries signals to the brain.
- Medulla spinalis runs down the spine.
