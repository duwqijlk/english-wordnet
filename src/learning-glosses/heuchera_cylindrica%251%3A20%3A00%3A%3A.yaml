simpleMeaning: A plant with tough heart-shaped leaf blades bunched at the foot of long stalks, with green-white
  flowers bunched along the upper part; western North America.
scope: 'Also called poker alumroot and poker heuchera: a plant with tough heart-shaped leaf blades bunched
  at the foot of long stalks, with green-white flowers bunched along the upper part; it grows in western
  North America, unlike other plants of the same kind with leaf blades of other shapes or flowers of other
  colours.'
examples:
- Heuchera cylindrica grows in western North America with green-white flowers.
- The tough heart-shaped leaves of Heuchera cylindrica bunch at the foot of long stalks.
