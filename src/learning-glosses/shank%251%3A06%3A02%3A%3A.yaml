simpleMeaning: the round straight part of a bolt, between the screw part and the head
scope: The round straight part of a bolt between the screw part and the head, not the like part of a drill
  bit, and not the long thin part of a thing in general.
examples:
- The shank of the bolt was too short for the hole.
- He held the bolt by its shank.
