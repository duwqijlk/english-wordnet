simpleMeaning: someone who has a clear personal style in the clothes they wear
scope: This is a person and the way that person wears clothes, not a low table with a mirror where a person
  sits to get ready.
examples:
- She is a careful dresser who always wears neat clothes.
- He is known as a smart dresser at work.
