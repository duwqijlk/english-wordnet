simpleMeaning: Taking in the whole earth, and not kept to one country or small part of it
scope: This takes in the whole earth, also called world, global, or planetary, and is not about a thing
  that merely fits everywhere or a spread reaching across the world.
examples:
- The worldwide war touched every land on earth.
- They spoke of worldwide trade between many countries.
