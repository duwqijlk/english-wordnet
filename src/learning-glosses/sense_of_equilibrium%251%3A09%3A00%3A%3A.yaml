simpleMeaning: A feeling system in the inner ear that tells you which way your head is pointing
scope: 'Also called equilibrium, labyrinthine sense, sense of balance, or vestibular sense: the feeling
  system in the inner ear that tells you which way your head points, not hearing and not the sense of
  touch.'
examples:
- Her sense of equilibrium tells her which way is up.
- The sense of equilibrium works with sight to keep us steady.
