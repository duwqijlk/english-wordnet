simpleMeaning: A yellow ore made of iron and sulfur joined with the red-brown metal used in wires.
scope: This is a yellow ore of iron and sulfur joined with the red-brown metal used in wires; chalcopyrite
  is another name for this sense, not a lump of the pure red-brown metal and not a yellow stone with no
  metal in it.
examples:
- Miners dug copper pyrites from the hillside.
- Copper pyrites is the main ore from which the red-brown metal is got.
