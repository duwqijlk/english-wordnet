simpleMeaning: a white powder made by soaking and drying the root of the cassava plant; tapioca comes
  from it, and it is a main food in hot lands
scope: 'Also called cassava, cassava starch, and manioca: the powder food made from the root, not the
  plant itself and not the root as a fresh food.'
examples:
- In many hot countries, manioc is a main food for poor families.
- She bought a bag of manioc to make tapioca for dinner.
