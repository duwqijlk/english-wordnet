simpleMeaning: A medicine given by needle, not by mouth, that kills germs, used for bad infections of
  the lungs, throat, ears, or the tubes that carry urine out of the body.
scope: Also called cefotaxime, this germ-killing medicine is given by needle for severe infections of
  the lungs, throat, ears, or urinary tract.
examples:
- Claforan cleared the lung infection.
- The doctor gave him Claforan for his ear infection.
