simpleMeaning: A Tai language branch spoken in the north, mainly along Red and Black rivers, Lai Chau,
  Dien Bien, Lao Cai, Son La, some in the south, Lam Dong, Tung Nghia.
scope: Not other branches of the same language family, nor the languages of nearby peoples; this branch
  is the one spoken along the Red and Black rivers in the north.
examples:
- White Tai is spoken in the north, along the Red River.
- Some people in the south also speak White Tai.
