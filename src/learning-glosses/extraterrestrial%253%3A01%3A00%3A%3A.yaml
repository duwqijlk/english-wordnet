simpleMeaning: coming from, found in, or happening in the space beyond Earth and the air around it
scope: For things that come from or are in space beyond Earth, not for things that live or happen on Earth.
examples:
- Scientists studied the rock for signs of extraterrestrial dust.
- They searched for extraterrestrial signals from deep space.
