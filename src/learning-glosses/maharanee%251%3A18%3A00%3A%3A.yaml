simpleMeaning: The wife of a king in India, or a princess there, is a great queen
scope: Also called maharani, this is a great queen, a princess in India or the wife of a king, not a common
  woman and not a king himself.
examples:
- The maharanee greeted the guests in the palace.
- She became maharanee when she married the maharaja.
