scope: An Australian tree that gives wood, much like another tree, but with wood far lighter and softer,
  also called dundathu pine or queensland kauri; not the true kauri.
examples:
- Smooth bark kauri is an Australian tree that gives light soft wood.
- The builders chose smooth bark kauri because its wood is light and soft.
