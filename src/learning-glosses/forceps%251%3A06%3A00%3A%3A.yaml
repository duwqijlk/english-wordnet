simpleMeaning: A tool that pulls things out, made of two joined arms that pinch, used in medical care,
  especially to help bring out babies at birth
scope: This is the medical pinching tool, used especially when a baby is born; it is not small tweezers
  for pulling out hairs or tiny pieces in the skin.
examples:
- The doctor used forceps to help the baby come out safely.
- The nurse handed the forceps to the doctor during the birth.
