simpleMeaning: change from a single vowel sound into a different sound, as happened in some older languages
scope: This is a sound change inside a language, not the physical splitting of an object.
examples:
- In Old English, the vowel broke before certain consonants.
- The vowel breaks into two sounds in some northern dialects.
