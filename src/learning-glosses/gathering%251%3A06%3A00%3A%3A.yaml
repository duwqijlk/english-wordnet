simpleMeaning: In sewing, small folds in cloth made by pulling a thread tight along a line of stitches
scope: In sewing, small folds in cloth pulled tight by a thread, also called gather; not the act of bringing
  things together.
examples:
- The gathering on the dress gave it a soft shape.
- She added a gathering to the skirt with a tight thread.
