simpleMeaning: Blood tubes from the hollow of the ear that run into the blood tube behind the jaw.
scope: These are blood tubes from the hollow of the ear that run into the blood tube behind the jaw, not
  the tubes of the neck and not the tubes of the face.
examples:
- The tympanic vein drains the middle ear.
- Blood flows through the tympanic vein to the jaw.
