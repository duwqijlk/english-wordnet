simpleMeaning: A nervous-system disorder with muscle twitching and painful spasms, sometimes seizures;
  it is linked to too little calcium or vitamin D, or to alkalosis, too little acid in the blood.
scope: An older name for the same calcium-linked nerve condition, not the infectious disease tetanus.
examples:
- Tetanilla is an old term for a nerve disorder caused by low calcium.
- Doctors no longer use tetanilla much in modern clinical notes.
