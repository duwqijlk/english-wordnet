simpleMeaning: So striking and good that you notice it at once, and it makes you think of lightning flashing
scope: Striking and good like lightning flashing; dazzling, eye-popping and fulgurous are other names
  for this sense, not merely bright and not merely loud.
examples:
- The fulgurant leaps of the skater drew gasps from the crowd.
- His fulgurant rise to fame surprised everyone.
