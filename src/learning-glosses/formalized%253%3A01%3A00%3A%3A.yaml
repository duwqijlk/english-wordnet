simpleMeaning: following known, set ways very strictly, especially in religion or art
scope: 'Also called formalised: this means following set ways very strictly, especially in religion or
  art, not being made official.'
examples:
- The formalized ceremony followed the same set steps year after year.
- His formalized style of painting followed strict old rules.
