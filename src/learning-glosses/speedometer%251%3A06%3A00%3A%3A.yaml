simpleMeaning: a tool fixed to a vehicle that measures and shows how fast the vehicle is going
scope: This is the tool in a vehicle that shows how fast it is going. It is not a tool that shows how
  far the vehicle has gone.
examples:
- The speedometer showed 60 as we drove down the road.
- He looked at the speedometer to check how fast the car was going.
