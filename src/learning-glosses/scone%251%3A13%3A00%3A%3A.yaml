simpleMeaning: a small, rich biscuit made with cream and eggs, cut into diamond shapes or sticks and baked
  in an oven or, especially at first, on a flat pan over heat
scope: This is one small baked biscuit, rich with cream and eggs; it is not a large loaf of bread or a
  sweet cake.
examples:
- She ate a warm scone with butter for breakfast.
- He baked a tray of scones on a griddle.
