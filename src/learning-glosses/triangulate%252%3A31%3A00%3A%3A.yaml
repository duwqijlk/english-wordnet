senseId: 'triangulate%2:31:00::'
synsetId: 00648565-v
simpleMeaning: To work out where a place is, and how far away it is, by measuring from triangles drawn
  across the land.
scope: To find a place by measuring triangles, not to cut a thing into triangles or shape it like a triangle,
  and not of a thing made up of triangles or with triangles marked on it.
examples:
- The surveyor triangulated the hilltop from two points on the plain.
- They triangulated the island's position before drawing the map.
