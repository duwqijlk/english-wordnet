simpleMeaning: a place open late at night where you can watch singers or dancers, dance, and eat and drink
scope: 'Also called a club: a place open late at night with singers or dancers, dancing, and food and
  drink, not a bar that closes early and not a concert hall.'
examples:
- He played the drums at a jazz nightclub every Friday.
- They spent the evening dancing at a nightclub downtown.
