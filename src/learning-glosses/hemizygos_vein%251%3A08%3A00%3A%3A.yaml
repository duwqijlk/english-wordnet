simpleMeaning: A vein that goes on from the left lower back vein, crosses the middle at the eighth back
  bone, and runs into the azygos vein.
scope: This vein is also called hemizygous vein and vena hemizygos; it goes on from the left lower back
  vein, crosses the middle at the eighth back bone, and runs into the azygos vein.
examples:
- The hemizygos vein carries blood up the back.
- The hemizygos vein joins the azygos vein.
