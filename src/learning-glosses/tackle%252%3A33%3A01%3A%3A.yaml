simpleMeaning: to catch hold of a player from the other team and throw him to the ground; that player
  usually has the ball
scope: This is the verb for bringing a player down, not the ship's ropes and not a place or a player on
  the football line.
examples:
- He tackled the runner before he could score.
- The defender tackled the player with the ball.
