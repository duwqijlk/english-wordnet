simpleMeaning: The tubes of a motor take in the liquid that burns as a fine mist from this set of parts,
  and no carburettor is needed.
scope: Also called fuel injection, this is the set of parts that sends the liquid that burns as a fine
  mist straight into a motor's tubes, with no carburettor needed.
examples:
- The fuel injection system sprays a fine mist into the motor.
- His car has a fuel injection system and no carburettor.
