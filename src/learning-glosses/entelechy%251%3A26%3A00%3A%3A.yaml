simpleMeaning: In Aristotle's thought, the state of a thing that has become fully real, as against what
  it could be.
scope: In Aristotle's thought, the state of a thing fully real, not what it could be and not a thing only
  half made.
examples:
- For Aristotle, entelechy is a thing fully real, not only possible.
- The seed reaches entelechy when it grows into a full plant.
