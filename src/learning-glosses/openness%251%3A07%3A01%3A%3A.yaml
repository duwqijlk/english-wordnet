simpleMeaning: being open and easy to reach, above all about what you do and why, with nothing hidden
  and nothing kept secret
scope: Being open and easy to reach, above all about what you do and why, with nothing hidden; not a readiness
  to take in new ideas and not a door left open.
examples:
- Her openness about the mistake won everyone's trust.
- We admired the openness with which she told us the truth.
