simpleMeaning: The magnetic strip is shifted over the heads that read it or write on it by this moving
  part of a player or recorder.
scope: This is the moving part that shifts the strip over the heads in a player or recorder, also called
  transport and tape transport.
examples:
- The tape drive pulled the strip through at a steady pace.
- A fault in the tape drive stopped the music.
