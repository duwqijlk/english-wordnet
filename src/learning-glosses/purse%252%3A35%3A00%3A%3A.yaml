simpleMeaning: to pull or draw together into small folds
scope: 'Also called wrinkle: to pull or draw together into small folds, not a sum of money, not a bag
  for carrying money, and not pulling only the lips into a round shape.'
examples:
- She pursed her lips in thought.
- The cloth pursed where the string pulled it tight.
