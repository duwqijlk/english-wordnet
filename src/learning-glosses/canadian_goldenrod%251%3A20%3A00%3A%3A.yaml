simpleMeaning: A large North American plant with showy clusters of yellow flowers on arching branches,
  often a weed.
scope: Also called meadow goldenrod and Solidago canadensis, this is one large North American goldenrod
  among other goldenrods and other tall yellow-flowered plants, known for its showy flower clusters on
  arching branches and for often growing as a weed.
examples:
- The Canadian goldenrod along the fence has showy yellow flowers.
- Canadian goldenrod often grows as a weed in open fields.
