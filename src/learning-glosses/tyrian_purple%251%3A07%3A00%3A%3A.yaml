simpleMeaning: A bright red-violet colour; in old Rome and Byzantium, an emperor or high judge wore it.
scope: A bright red-violet colour, in old Rome and Byzantium the colour worn by an emperor or high judge,
  rather than the dye of the same name.
examples:
- In old Rome, an emperor wore Tyrian purple.
- The cloak of Tyrian purple marked the high judge.
