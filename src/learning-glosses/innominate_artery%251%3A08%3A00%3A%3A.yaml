simpleMeaning: The large artery that branches off the aortic arch and splits into the right subclavian
  and right common carotid, supplying the right side of the head, neck, shoulder and arm.
scope: This is the large artery arising from the aortic arch, not the right subclavian or right common
  carotid arteries it divides into.
examples:
- The surgeon clamped the innominate artery during the repair.
- The innominate artery divides into two vessels on the right side.
