simpleMeaning: A condition caused by the chickenpox virus, with dizziness, pain in the ears, loss of movement
  in the face muscles, and at times loss of hearing.
scope: A condition from the chickenpox virus, not shingles and not a simple ear infection; it brings dizziness,
  ear pain and loss of movement in the face.
examples:
- Ramsay Hunt syndrome left her dizzy with pain in one ear.
- He was treated for Ramsay Hunt syndrome after his face went weak on one side.
