simpleMeaning: make an object hold a net amount of electricity, either more or fewer electrons than normal
scope: This is making an object hold electricity, not refilling a battery with power.
examples:
- Friction can charge a balloon so that it attracts small bits of paper.
- The cloud was charged with static electricity before the storm.
