simpleMeaning: Charged with tense emotion and excitement, as if a current were passing through the people
  or the moment.
scope: This describes a mood or atmosphere full of tense excitement; it is not about power from wires,
  and it is not the noun for a battery-driven car.
examples:
- The atmosphere in the stadium was electric as the final whistle approached.
- There was an electric tension in the room before the verdict.
