schema: oewn-learning-gloss-v2
senseId: 'movement%1:04:03::'
synsetId: 00799906-n
simpleMeaning: Actions taken together over time to promote a principle or work toward a goal.
scope: This is a campaign of actions working for a cause or goal, not the optical illusion of motion made
  by rapid still pictures (that is the other abstract sense), not a change of position in place, not a
  real shift from one place to another, not a natural event that shifts something, not a group of people
  sharing an ideology, not a section of a symphony or sonata, not a polite word for defecation, not a
  trend in opinion, not the working parts of a watch or clock, and not the act of moving an object.
examples:
- The movement to end slavery gained strength across the northern states.
- She joined the movement for cleaner air and spent her weekends campaigning.
editorialStatus: reviewed-model-not-student-validated
sourceBatch: 75
reviewVerdict: self-approved
