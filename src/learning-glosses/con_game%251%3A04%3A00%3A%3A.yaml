simpleMeaning: A trick where you cheat at betting, or talk a person into paying for a thing that has no
  worth
scope: A trick where you cheat at betting, or talk a person into paying for a thing that has no worth;
  con, sting, hustle, flimflam, bunco, bunco game, bunko, bunko game, confidence game and confidence trick
  are other names for this sense, not an honest bet and not a fair sale.
examples:
- He lost his money in a con game.
- The con game talked him into paying for a thing with no worth.
