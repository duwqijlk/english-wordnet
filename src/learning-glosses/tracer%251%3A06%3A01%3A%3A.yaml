simpleMeaning: In radiology, a substance that gives off rays, put into the body to study how the body
  changes food into energy and other ways the body works
scope: In radiology, this is a substance put into the body for doctors to watch, not a person who looks
  for lost people or things and not a bullet that leaves smoke behind it.
examples:
- Doctors put a tracer into his body to watch how his heart worked.
- The tracer moved through her body and showed where the problem was.
