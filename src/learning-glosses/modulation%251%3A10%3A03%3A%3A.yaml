simpleMeaning: A way of speaking that shifts the loudness, pitch, or tone of the voice.
scope: A way of speaking that shifts the loudness, pitch, or tone of the voice; also called inflection;
  not, in electronics, the sending of a signal by using it to change a carrier wave, shifting its size,
  rate, or phase, nor the act of shaping or setting to due measure and scale, as with regard to art.
examples:
- Their modulation shaped the talk.
- The modulation was heard at dawn.
