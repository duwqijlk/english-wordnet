simpleMeaning: a strong plant with bright yellow flowers, common along the east coast and the Gulf Coast
  of North America
scope: A strong plant with bright yellow flowers found by the sea; beach goldenrod is another name for
  this sense. Not a garden goldenrod and not a small wild flower.
examples:
- Seaside goldenrod grew thick along the shore path.
- The seaside goldenrod was in full yellow flower in late summer.
