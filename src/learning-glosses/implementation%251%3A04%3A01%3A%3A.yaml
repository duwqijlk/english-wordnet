simpleMeaning: The act of carrying out a plan or an order so that a goal is reached
scope: This is the act of carrying out a plan or an order; execution is another name for this sense, not
  the act of giving someone the means to do something, and not the carrying out of a death sentence.
examples:
- The implementation of the new law took a year.
- The agency was set up for the implementation of the policy.
