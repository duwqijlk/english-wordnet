simpleMeaning: A sticky stuff that turns hard with heat, used most of all to make strong sticking, covering,
  and layered sheets.
scope: A hard-setting sticky stuff used for strong joins and coats, also called epoxy and epoxy glue;
  not a weak paste and not a plain paint.
examples:
- The worker mixed the epoxy resin before spreading it on the joint.
- Once the epoxy resin had set, the panel could not be pulled off.
