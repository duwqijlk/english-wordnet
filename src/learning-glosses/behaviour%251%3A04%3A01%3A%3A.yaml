simpleMeaning: In psychology, all the ways a living thing acts, reacts, and moves in any one situation
scope: 'Also called behavior: in psychology, all a living thing does in a situation, not the way a person
  treats other people and not how a machine or substance acts in set conditions.'
examples:
- In the test, they watched the behaviour of dogs when a bell rang.
- The behaviour of rats in the maze changed after they learned where the food was.
