simpleMeaning: with an edge cut into small sharp points that lean toward the tip, like the teeth on a
  saw
scope: 'Also called toothed, notched, and serrate: this describes an edge with points leaning toward the
  tip, not a smooth edge and not rough in a general way.'
examples:
- She cut the bread with a serrated knife.
- The leaf has a serrated edge that feels sharp to touch.
