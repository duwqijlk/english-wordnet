simpleMeaning: In mathematics, a value written as a+bi, where a and b are values you can place on a line
  and i gives -1 when multiplied by itself
scope: A value of the form a+bi, also called a complex quantity, an imaginary, and an imaginary number;
  not a plain value you can place on a line and not a fraction.
examples:
- The complex number 3+2i has a real part and an imaginary part.
- She plotted the complex number on a graph with two axes.
