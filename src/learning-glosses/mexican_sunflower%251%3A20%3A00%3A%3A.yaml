simpleMeaning: Any plant of the genus Tithonia; tall coarse herbs or shrubs of Mexico to Panama with large
  flower heads, yellow centres and golden-yellow to orange-scarlet rays.
scope: Also called tithonia; a tall plant with large yellow-centred heads, not a true sunflower and not
  a daisy.
examples:
- The Mexican sunflower towered over the garden fence.
- Mexican sunflower heads glow golden-yellow in the sun.
