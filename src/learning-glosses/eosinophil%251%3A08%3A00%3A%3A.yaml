scope: 'Also called eosinophile: a white blood cell that stains pink-red with eosin, not a red blood cell
  and not a white blood cell that stays unstained.'
examples:
- The lab found many eosinophils in the blood sample.
- An eosinophil count rises during some allergic reactions.
