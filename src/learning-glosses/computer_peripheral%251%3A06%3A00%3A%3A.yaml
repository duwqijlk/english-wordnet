simpleMeaning: electronic gear outside the main board that holds the CPU, the part that does the machine's
  thinking
scope: 'Another name for a peripheral or a peripheral device: gear that works with a machine but sits
  outside its main board, not the main board itself and not a program.'
examples:
- Disk drives and printers are common computer peripherals.
- She plugged a new computer peripheral into the machine.
