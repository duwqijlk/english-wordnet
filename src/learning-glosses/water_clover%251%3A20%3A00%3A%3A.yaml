simpleMeaning: In Europe, Asia, and the east of the United States grows a fern whose leaves come in fours,
  each set shaped like the leaves of a small three-leaf plant.
scope: This fern grows in Europe, Asia, and the east of the United States, and its four small leaf parts,
  shaped like the leaves of a small three-leaf plant, tell it from other ferns.
examples:
- The water clover by the pond edge had leaves in sets of four.
- We picked out the water clover from the other ferns by its four-part leaves.
