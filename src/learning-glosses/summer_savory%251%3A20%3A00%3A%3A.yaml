  and now also elsewhere, and used to flavor meat, soups and salads
scope: This is the growing herb plant, not its leaves used as a seasoning.
examples:
- Summer savory grows best in a sunny spot with well-drained soil.
- She planted summer savory beside the beans in her garden.
