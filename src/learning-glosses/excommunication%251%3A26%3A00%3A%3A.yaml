simpleMeaning: Being cut off from a church and from sharing in its life.
scope: Being cut off from a church and from sharing in its life; not the act of cutting someone off, and
  not a short punishment that ends soon.
examples:
- His excommunication left him outside the life of the church.
- After her excommunication, she could no longer take part in church services.
