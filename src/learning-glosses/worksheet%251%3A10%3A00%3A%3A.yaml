simpleMeaning: A paper sheet set out in many columns, where a person whose job is to prepare money accounts
  puts numbers together for the money reports
scope: This is a paper sheet for putting money figures together, not a sheet of school work for pupils
  and not a list of jobs to do.
examples:
- The accountant filled in the worksheet before writing the final report.
- Each column on the worksheet held figures for a different month.
