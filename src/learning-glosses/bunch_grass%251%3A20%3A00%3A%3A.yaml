simpleMeaning: Growing in tufts or clumps, not spreading into a flat mat, any of several kinds of grass
  from many groups grows chiefly in the west of the United States.
scope: Also called bunchgrass, a grass that grows in tufts, not a grass that spreads into a flat mat.
examples:
- Bunch grass grew in tufts instead of a flat mat.
- The bunch grass of the west grows in clumps, not as one flat sheet.
