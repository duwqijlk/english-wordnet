simpleMeaning: The right for each person to have the same chance at work, whatever their race, colour,
  sex, or country of birth.
scope: The right to a fair chance at work for all, not a promise of a job and not a right tied to one
  race or sex; no other name is listed for this sense.
examples:
- Equal opportunity means the firm must judge each person on merit alone.
- The law guards equal opportunity in hiring for every worker.
