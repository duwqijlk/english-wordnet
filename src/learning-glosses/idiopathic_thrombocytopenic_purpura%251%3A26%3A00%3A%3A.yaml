senseId: 'idiopathic_thrombocytopenic_purpura%1:26:00::'
synsetId: 14588998-n
simpleMeaning: Purple marks on the skin that come with too few platelets, the tiny bits in blood that
  stop bleeding, for any of several causes.
scope: Purple marks on the skin that come with too few platelets, for any of several causes, not purple
  marks from a blow and not a lack of red blood cells.
examples:
- Her idiopathic thrombocytopenic purpura showed as purple marks on her arms.
- The doctor treated his idiopathic thrombocytopenic purpura with drugs that raise platelets.
