simpleMeaning: A strong feeling that drives what a person believes or does, even though it makes no sense
  and cannot be fought off
scope: A strong feeling that drives a belief or an action, not the thing or person that someone loves.
examples:
- His passion for the cause made him give up everything else.
- She spoke with a passion that no one could argue against.
