simpleMeaning: In computing, one of the circular bands into which a magnetic disk is divided, with data
  written and read along each band.
scope: This is a data-storage band on a computer disk, not a route or rough path, not a clue or piece
  of evidence, not railway rails, not a course for races, not one song on a recording, not the groove
  of a phonograph record, not the endless belt under a crawler vehicle, not the athletic event of running,
  and not the verb senses such as following something, traveling across, carrying something on foot, or
  leaving marks.
examples:
- The read head moved to the requested track before the data was copied.
- Bad sectors were concentrated on the outermost track of the hard disk.
