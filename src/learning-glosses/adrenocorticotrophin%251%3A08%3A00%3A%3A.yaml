simpleMeaning: The outer layer of the gland above the kidney is woken into work by this messenger from
  the front part of the small gland at the base of the brain.
scope: This is also called adrenocorticotrophic hormone, adrenocorticotropic hormone, adrenocorticotropin,
  corticotrophin, and corticotropin, and it acts on the gland above the kidney, not on the kidney itself.
examples:
- The blood test found adrenocorticotrophin acting on the gland above the kidney.
- Adrenocorticotrophin woke the outer layer of the gland above the kidney into work.
