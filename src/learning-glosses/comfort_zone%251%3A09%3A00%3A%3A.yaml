simpleMeaning: A bare body keeps its heat steady without shivering or sweating when the warmth around
  it is between 28 and 30 degrees Centigrade.
scope: This is the range of warmth, between 28 and 30 degrees Centigrade, in which a bare body keeps its
  heat steady without shivering or sweating.
examples:
- Nobody shivered in the comfort zone of 29 degrees.
- The room was kept at the comfort zone so no one shivered.
