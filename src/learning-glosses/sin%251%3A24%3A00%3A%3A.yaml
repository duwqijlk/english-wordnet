simpleMeaning: a number you get when you divide the length of the side across from an angle by the length
  of the longest side of a triangle with a 90-degree corner
scope: In maths, a number for comparing sides in a triangle; not a bad act against God's law and not the
  act of doing such an act.
examples:
- In this triangle, sin 30 degrees is 0.5.
- We used sin to find the length of the side.
