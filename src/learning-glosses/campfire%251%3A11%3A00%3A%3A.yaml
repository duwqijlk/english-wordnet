simpleMeaning: A small fire built outside, at a camp, to give warmth or to cook food
scope: A small fire built outside at a camp for warmth or cooking, not a fire built inside a house.
examples:
- We sat around the campfire and told stories until late.
- She cooked supper over the campfire while the others pitched tents.
