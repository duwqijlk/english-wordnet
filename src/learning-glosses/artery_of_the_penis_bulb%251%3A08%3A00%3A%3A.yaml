simpleMeaning: The round base of the penis in men gets its blood from a tube that runs off the deep tube
  to the private parts
scope: This blood tube is also called arteria bulbi penis, and it is the one in men, not the one in women.
examples:
- The artery of the penis bulb is marked in the drawing of the male body.
- Blood flows to the bulb through the artery of the penis bulb.
