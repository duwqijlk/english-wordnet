simpleMeaning: rice cooked with broth, a liquid made by cooking meat or vegetables in water, and sprinkled
  with cheese cut into very small bits
scope: A rice dish cooked in broth and finished with cheese, not plain boiled rice served dry on its own.
examples:
- We ate risotto with cheese on top for dinner.
- The risotto was warm and soft, with grated cheese through it.
