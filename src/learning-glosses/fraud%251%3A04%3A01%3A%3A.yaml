simpleMeaning: a thing made to fool people, or a planned trick meant to win something for the person behind
  it
scope: A thing made to fool people, or a planned trick meant to win an advantage, not a trick that harms
  someone and not the act of swindling.
examples:
- The painting was a fraud, painted last year to look old.
- His fraud was meant to win him the prize.
