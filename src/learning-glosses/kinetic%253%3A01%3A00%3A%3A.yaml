simpleMeaning: to do with how real things move, and the pushes and pulls that are linked to that movement
scope: This is a science sense about how things move and the pushes and pulls linked to that movement.
  It is not a word for a person who is active and moves a lot.
examples:
- In class we learned how kinetic energy grows when a ball rolls faster.
- The students measured the kinetic forces acting on the sliding block.
