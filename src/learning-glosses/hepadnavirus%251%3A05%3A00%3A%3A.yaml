simpleMeaning: A set of animal DNA viruses, with the duck, woodchuck and squirrel viruses among them,
  and the virus that gives people hepatitis B.
scope: The group name in virology for animal DNA viruses, including the hepatitis B virus.
examples:
- Hepadnaviruses include the virus that gives people hepatitis B.
- Hepadnavirus is a group of animal DNA viruses.
