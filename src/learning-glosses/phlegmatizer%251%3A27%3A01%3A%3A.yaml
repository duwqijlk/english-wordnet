simpleMeaning: Something mixed into an explosive to make it harder to set off, so it is steadier and safer
  to handle and move.
scope: A substance mixed into an explosive to make it harder to set off, so it is steadier and safer to
  handle and move; not an explosive itself and not a fuse.
examples:
- A phlegmatizer keeps the powder safe in the lorry.
- Workers added phlegmatizer before the powder was shipped.
