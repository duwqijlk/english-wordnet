simpleMeaning: full of complete kindness and goodness, like a saint or a holy being in heaven
scope: Also called saintly, sainted, beatific, angelical, and saintlike. This means very good and kind
  in character, not sweet and lovable in nature, and not simply about angels.
examples:
- His angelic kindness made him help every person in need.
- The angelic nurse cared for the sick with great goodness day and night.
