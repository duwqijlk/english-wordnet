simpleMeaning: The amount of money a person gets that sets the mark of being poor
scope: This is the amount of money a person gets that sets the mark of being poor; poverty level is another
  name for this sense, not a high wage, and not a tax limit.
examples:
- The family lived below the poverty line.
- His pay fell under the poverty line that year.
