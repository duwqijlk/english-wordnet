simpleMeaning: a movement that works to get more protection for the good of people who buy goods and services
scope: This is work to protect people who buy things and what is good for them, not the idea that buying
  more and more goods is good for the economy.
examples:
- Consumerism led to new laws that protect shoppers from unsafe products.
- She joined a consumerism group that fights for clear, fair prices.
