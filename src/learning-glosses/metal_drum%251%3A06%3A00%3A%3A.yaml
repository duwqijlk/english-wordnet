simpleMeaning: a round can made of metal, often used to move or store liquids
scope: A round can made of metal, often used to move or store liquids; drum is another name for this sense,
  not a drum played as music, and not a wooden barrel.
examples:
- The oil came in a metal drum, a round can used for moving liquids.
- They stored rainwater in a metal drum behind the shed.
