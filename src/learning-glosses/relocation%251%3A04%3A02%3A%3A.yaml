simpleMeaning: The act of moving people, such as a family or a group, to a new place to live, as after
  a big sudden change that causes trouble
scope: 'Also called resettlement: the moving of a group of people to a new place to live, not moving things
  and not moving a business to a new place.'
examples:
- The relocation of the whole village took months after the flood.
- The government paid for the relocation of families to a new town.
