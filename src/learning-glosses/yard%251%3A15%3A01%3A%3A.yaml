simpleMeaning: a patch of ground set aside for stacking cut trees.
scope: This is ground where cut timber is piled, not a general work area beside buildings or a rail area
  for engines and cars.
examples:
- Trucks delivered the felled trunks to the yard beside the sawmill.
- The yard was full of stacked logs waiting for the mill.
