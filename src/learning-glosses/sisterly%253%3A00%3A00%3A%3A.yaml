simpleMeaning: like a sister, in the way typical of a sister, or right for a sister
scope: This describes something as like a sister, typical of a sister, or right for a sister; the word
  for a brother is brotherly, and this is not a word for friends in general.
examples:
- She gave her younger brother sisterly advice and care.
- He was grateful for her sisterly kindness after his parents died.
