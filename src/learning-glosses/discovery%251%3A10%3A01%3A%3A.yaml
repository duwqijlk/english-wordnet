simpleMeaning: In law, one side in a case must show the other side the papers that bear on it before the
  trial, so each side can learn facts from the other
scope: In law, the sharing of case papers before a trial, not the act of finding something and not the
  thing found.
examples:
- Discovery forced both sides to hand over their papers before the trial.
- The judge ordered discovery so each side could see the other's papers.
