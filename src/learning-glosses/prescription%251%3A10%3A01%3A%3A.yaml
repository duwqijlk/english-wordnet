simpleMeaning: a written order from a doctor or dentist to a drug seller, saying what drug to give a patient
  and how much
scope: A doctor's written order for a drug, not general rules given beforehand and not the drug itself.
examples:
- The doctor wrote a prescription for the cough medicine.
- She took the prescription to the drugstore to have it filled.
