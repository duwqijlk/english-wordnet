simpleMeaning: Feeling sad or in pain about wrong things you have done, or showing that you feel this
  way
scope: 'Also called rueful and contrite: this means feeling or showing sadness for wrong you have done,
  not just feeling sad in general.'
examples:
- He felt remorseful after lying to his mother and said he was sorry.
- She looked remorseful and said sorry for the wrong she had done.
