simpleMeaning: in a calm way that shows you are not worried or upset
scope: 'Also called coolly: in a calm way that shows no worry or upset. This is not a nervous or worried
  way of acting.'
examples:
- When the glass fell and broke, he nonchalantly picked up another one.
- ‘It is only a small delay,’ she said nonchalantly, and kept reading her book.
