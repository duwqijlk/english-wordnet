simpleMeaning: one of several low plants from Europe and Asia that stay green all year, live for one year
  or for many years, and are grown to cover the ground
scope: 'Also called bugle: one of several low plants from Europe and Asia that stay green all year and
  are grown to cover the ground, not the American herb of the same name and not a tall plant.'
examples:
- Bugleweed spreads fast and covers the bare ground under the trees.
- She planted bugleweed along the path to keep the soil covered.
