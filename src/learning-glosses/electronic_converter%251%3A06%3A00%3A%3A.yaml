simpleMeaning: In telecommunication, a device that changes a signal from one rate of vibration to another.
scope: In telecommunication, a device that changes a signal's rate, not a device that makes signals and
  not a wire.
examples:
- The electronic converter shifted the signal to a higher frequency.
- They fitted an electronic converter to change the signal's rate.
