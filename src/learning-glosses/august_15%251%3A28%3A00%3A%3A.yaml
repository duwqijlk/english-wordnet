simpleMeaning: A Roman Catholic feast for the mother of Jesus being taken up into heaven when her earthly
  life ended; the Eastern Orthodox Church keeps it as the Dormition.
scope: 'Also called the Assumption and Assumption of Mary: a Roman Catholic feast for the mother of Jesus
  being taken up into heaven, not a feast for her birth and not a feast for the birth of Jesus.'
examples:
- August 15 is the feast of the Assumption of Mary in the Roman Catholic Church.
- On August 15, the church marks the end of the earthly life of the mother of Jesus.
