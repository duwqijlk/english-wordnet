simpleMeaning: a way to treat one response by blocking it with another that cannot happen with it; calm,
  say, can be tied to a thing that once caused fear
scope: Also called reciprocal inhibition; a treatment that blocks one response with another that cannot
  happen with it, not a drug treatment and not talk therapy alone.
examples:
- Reciprocal-inhibition therapy helped her stay calm near dogs.
- In reciprocal-inhibition therapy, the patient learns to relax at the sight of spiders.
