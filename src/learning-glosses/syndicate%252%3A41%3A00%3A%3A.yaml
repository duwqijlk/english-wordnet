simpleMeaning: to put people or businesses together into one group that works together, or to make such
  a group
scope: To make a group of people or businesses that work together; not the group itself, not selling stories
  or shows to many papers, and not only joining a group.
examples:
- The owners syndicated their small companies to share costs and work.
- Local farmers syndicated their farms to sell their goods together.
