simpleMeaning: A place where young lawbreakers can be held for a short time, most often watched over by
  a court for young people
scope: A place where young lawbreakers are held for a short time under a court for young people; also
  called detention home, detention house and house of detention, not a prison for adults and not a school.
examples:
- The boy spent two weeks in a detention camp while he waited for court.
- A detention camp held the young offenders until their hearing.
