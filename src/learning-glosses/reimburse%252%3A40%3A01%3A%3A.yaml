simpleMeaning: to pay someone to make up for a loss they have had
scope: Giving money to a person to make up for a loss they have had. It is not a gift, and it is not pay
  for work done.
examples:
- The company will reimburse him for the money he lost in the fire.
- They reimbursed her after the loss of her tools.
