simpleMeaning: A drug, sold under a trade name, that lowers fats in the blood; used to treat some ills
  of the heart and blood vessels.
scope: Also called clofibrate; a drug that lowers fats in the blood.
examples:
- The doctor gave him Atromid-S to lower the fats in his blood.
- Atromid-S is used to treat some ills of the heart.
