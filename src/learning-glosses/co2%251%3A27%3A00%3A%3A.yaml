simpleMeaning: A heavy gas with no smell and no colour, made when things breathe and when dead matter
  rots; plants take it in from the air to make food by sunlight.
scope: Also called carbon dioxide and carbonic acid gas, this is a heavy gas with no smell or colour,
  made when living things breathe and taken in by plants from the air.
examples:
- Plants take in CO2 from the air.
- We breathe out CO2 with every breath.
