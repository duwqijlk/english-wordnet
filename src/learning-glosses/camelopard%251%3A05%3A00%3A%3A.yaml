simpleMeaning: This spotted animal of the hot African grassland stands taller than any other four-legged
  animal alive, on very long legs, with a very long neck and small horns.
scope: 'Also called giraffe: the tallest four-legged animal of the African grassland, not a zebra or an
  antelope, which share the grassland but are not so tall.'
examples:
- A camelopard bent its long neck to drink at the water hole.
- We saw a camelopard standing head and shoulders above the trees.
