simpleMeaning: Training in which a person is told about body workings they would not know on their own,
  like heart speed or blood push, so they can learn to control them.
scope: Training in which a person is told about body workings they would not know on their own, so they
  can learn to control them; not a drug and not an operation.
examples:
- Biofeedback helped her slow her heart when she was tense.
- He learned biofeedback to ease his blood pressure.
