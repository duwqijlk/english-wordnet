simpleMeaning: a plant grown far and wide in many kinds, with thick leaves like moss and a mass of bright
  flowers
scope: Also called a sun plant; a garden plant grown for its bright flowers, not a true moss and not a
  rose.
examples:
- Rose moss covered the edge of the flower bed.
- She planted rose moss along the sunny wall.
