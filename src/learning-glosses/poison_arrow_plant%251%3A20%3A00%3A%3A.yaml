simpleMeaning: A South African tree or large bush whose leathery evergreen leaves and white or pink flowers
  give way to round, dark purple fruits, usually with two seeds inside.
scope: The South African tree also known as winter sweet, with leathery evergreen leaves and purple fruits;
  it is not the Japanese shrub, Eurasian perennial or Cretan dwarf shrub that also go by winter sweet.
examples:
- The poison arrow plant has leathery evergreen leaves and round purple fruits.
- In South Africa, the poison arrow plant grows as a bushy small tree.
