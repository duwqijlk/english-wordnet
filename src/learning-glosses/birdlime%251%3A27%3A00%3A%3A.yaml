simpleMeaning: Small branches smeared with this sticky stuff hold fast the small winged creatures they
  are meant to catch.
scope: This sticky stuff smeared on small branches to catch small winged creatures is also called lime.
examples:
- The branches were smeared with birdlime to catch the birds.
- The birdlime held the small bird fast.
