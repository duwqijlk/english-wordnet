simpleMeaning: From the parts round the knee, blood drains through these tubes into the blood tube behind
  the knee.
scope: Also called vena genus, these tubes drain blood from the parts round the knee into the blood tube
  behind the knee.
examples:
- The genicular vein drains blood from the knee joint.
- Blood in the genicular vein runs into the tube behind the knee.
