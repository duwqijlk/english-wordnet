simpleMeaning: a trip in wagons pulled by oxen, most often an organized move by a group of settlers to
  a new home
scope: A journey by ox wagon, most often an organized move by a group of settlers, not a walk or a hike
  on foot.
examples:
- The settlers made the long trek by ox wagon across the plains.
- Their trek took weeks, with the wagons moving slowly each day.
