senseId: restrictive%5:00:00:protective:00
synsetId: 01895040-s
simpleMeaning: Of a tariff (a tax on goods brought into a country), protecting the country's own interests
  by limiting the goods brought in from other countries
scope: Of a tariff that protects a country's own interests by keeping down goods brought in, not the general
  sense of serving to limit or hold back something.
examples:
- The government set a restrictive tariff to protect local farmers from cheap goods brought in from abroad.
- A restrictive tariff made foreign steel much harder to sell in the country.
