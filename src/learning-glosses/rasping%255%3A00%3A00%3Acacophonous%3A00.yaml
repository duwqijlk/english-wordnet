senseId: rasping%5:00:00:cacophonous:00
synsetId: 00300342-s
simpleMeaning: a sound that is rough and jarring, and not pleasant to hear
scope: A rough, jarring sound; rough, scratchy, raspy and grating are other names for this sense, and
  it is not the act of speaking in a cross voice.
examples:
- She answered in a rasping voice.
- The rasping sound of the old gate made us wince.
