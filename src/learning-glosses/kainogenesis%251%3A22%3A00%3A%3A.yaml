simpleMeaning: While a young life is forming, new traits or body parts appear that its strain or kind
  never had, such as the organ feeding unborn young in milk-giving animals.
scope: Caenogenesis, cainogenesis, cenogenesis, and kenogenesis are other names for the new traits or
  body parts that appear while a young life is forming, though its strain or kind never had them.
examples:
- Kainogenesis gave milk-giving animals the placenta as their young formed.
- The placenta is one case of kainogenesis in the line of milk-giving animals.
