simpleMeaning: The physical world of plants, animals, land, and weather, not made by people.
scope: This is not the basic character of something, and not a ruling power; it is the living, physical
  world around us.
examples:
- We spent the weekend walking in nature.
- The documentary shows the beauty of nature.
