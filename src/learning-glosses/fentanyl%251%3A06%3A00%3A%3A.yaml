simpleMeaning: A strong, addictive opioid painkiller sold under trade names; used in surgery and by vets,
  misused illegally, and a related gas was once used in a hostage crisis.
scope: Fentanyl is the drug’s own name, not just a trade name. The related gas used in a 2002 hostage
  crisis killed many hostages, so it was not harmless.
examples:
- The vet gave the dog Fentanyl before the operation.
- Fentanyl is sometimes misused as a street drug.
