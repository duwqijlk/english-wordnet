simpleMeaning: a trade-name painkilling drug breathed in, acting on nerves and habit-forming, used by
  vets in surgery, as a nonlethal gas to knock out hostages, misused for fun
scope: Also called Sublimaze; a strong drug used in medicine and surgery, not a common painkiller like
  aspirin.
examples:
- The vet gave the dog Fentanyl before the operation.
- Fentanyl is sometimes misused as a street drug.
