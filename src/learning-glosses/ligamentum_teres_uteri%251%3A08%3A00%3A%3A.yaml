synsetId: 05303239-n
simpleMeaning: a tough band fixed to the womb on both sides, in front of and below the egg tube opening,
  running through a narrow belly passage to the outer skin folds
scope: A band of tissue that holds the womb in place, also called round ligament of the uterus; not a
  muscle and not a blood vessel.
examples:
- The ligamentum teres uteri runs from the womb to the outer skin folds.
- Doctors trace the ligamentum teres uteri through a narrow passage in the lower belly.
