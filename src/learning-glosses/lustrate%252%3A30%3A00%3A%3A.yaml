simpleMeaning: To clean by a rite; also, in countries once under Communist rule, to clear out former officials
  for political reasons.
scope: To clean by a rite, and in countries once under Communist rule to clear out former officials for
  political reasons; not ordinary washing and not a court trial.
examples:
- The priest came to lustrate the temple after the fire.
- After the change of rule, the new leaders moved to lustrate the old officials.
