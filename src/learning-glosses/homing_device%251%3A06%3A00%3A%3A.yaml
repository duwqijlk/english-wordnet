simpleMeaning: The part inside a guided missile that steers it toward its mark.
scope: The part inside a guided missile that steers it toward its mark, not a radar that finds the mark
  and not a compass that only points north.
examples:
- The homing device steers the missile to its mark.
- A fault in the homing device sent the missile off course.
