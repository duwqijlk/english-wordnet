simpleMeaning: very clever in a way that is far above the usual and that people notice
scope: About a person, a mind, or an idea that is very clever; it is not about a bright light or a bright
  colour.
examples:
- She has a brilliant mind and solved the hard problem in minutes.
- His brilliant idea saved the company a lot of money.
