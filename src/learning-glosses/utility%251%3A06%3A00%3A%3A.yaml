simpleMeaning: the pipes, wires, and machines in or near a building that bring heat, light, and water,
  or take waste away
scope: The pipes, wires, and machines that serve a building with heat, light, water, or waste removal,
  not the service itself and not a measure in economics.
examples:
- The price of the house included all utilities.
- The storm cut off the utilities for a day.
