simpleMeaning: Give something a coating or treatment that shapes how its surface looks and feels.
scope: Giving a thing its surface coating or treatment only; not a surface's texture, not the point or
  time at which something stops, not top quality, not the place where a race ends, not the race that concludes
  a contest, not someone's downfall, not an event that ends something, not a wine's aftertaste, not the
  noun naming the act of completing something, not ending something in general, not finally doing something,
  not coming to an end, not eating all the food on a plate, and not ending a relationship with someone.
examples:
- The carpenter finished the table beautifully.
- The workshop finishes each cabinet by hand with oil and wax.
