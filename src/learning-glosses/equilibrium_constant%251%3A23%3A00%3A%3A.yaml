simpleMeaning: In chemistry, the ratio of concentrations at equilibrium in a reversible reaction, when
  forward and reverse rates are equal.
scope: This ratio in chemistry compares amounts present when a reversible reaction has settled and its
  forward and reverse rates match.
examples:
- The equilibrium constant tells chemists where the reaction settles.
- They worked out the equilibrium constant for the reaction.
