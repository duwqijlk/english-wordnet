simpleMeaning: The process of changing so as to fit something new, such as the conditions around you.
scope: This is changing to fit something new, such as the conditions around you, not a sense organ like
  the eye adjusting to light.
examples:
- The adaptation of the plant to dry soil took many years.
- Adaptation to the cold helped the animals live through winter.
