simpleMeaning: These small bugs suck the juices from green growing things to feed, and most often they
  are aphids
scope: Also called a louse, this is a small bug that feeds on green growing things, not a bug that bites
  people or animals.
examples:
- A plant louse had settled on the stem and was sucking the juices from the leaf.
- She found a plant louse on the rose and washed it off the leaf.
