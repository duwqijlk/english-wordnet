simpleMeaning: an event in which something moves up to a higher point, as in height, temperature or strength
scope: A rise in a measured level such as height or heat, not the act of going up something and not steady
  upward travel.
examples:
- The climb in summer temperatures has worried farmers.
- Analysts noted a sharp climb in demand for the new phone.
