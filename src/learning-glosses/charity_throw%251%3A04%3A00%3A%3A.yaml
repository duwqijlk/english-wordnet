simpleMeaning: a basketball try from the foul line with no one in the way, given because the other team
  broke a rule
scope: A basketball try from the foul line with no one in the way; charity shot, charity toss, foul shot,
  free throw and penalty free throw are other names for this sense, not a shot taken during open play.
examples:
- She made the charity throw to tie the game.
- The charity throw came after a foul on the guard.
