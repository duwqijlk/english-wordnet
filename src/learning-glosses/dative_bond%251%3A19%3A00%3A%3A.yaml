simpleMeaning: a link in which both of the tiny bits of charge shared by two atoms come from one of the
  atoms
scope: 'Also called a coordinate bond: a link where one atom gives both shared electrons, not a link where
  each atom gives one electron and not a link that joins whole molecules.'
examples:
- In a dative bond, one atom gives both electrons.
- The dative bond holds the two atoms close together.
