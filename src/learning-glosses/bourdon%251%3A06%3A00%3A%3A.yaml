simpleMeaning: A pipe of the bagpipe that is set to sound one long, unchanging note
scope: A pipe of the bagpipe set to sound one long, unchanging note, also called a drone and a drone pipe;
  not a pipe that plays the tune and not a pipe that sounds short notes.
examples:
- The bourdon hummed one long note under the tune.
- He tuned the bourdon before the dancing began.
