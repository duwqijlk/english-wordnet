simpleMeaning: A plant from Europe and Asia with many loose bunches of tiny white flowers, now growing
  wild in North America.
scope: Also called false baby's breath, infant's-breath, white bedstraw, white madder, or wild madder,
  this loose-flowered herb grows across Europe and Asia and now grows wild in North America.
examples:
- Galium mollugo covered the bank with tiny white flowers.
- We found Galium mollugo growing wild beside the path in North America.
