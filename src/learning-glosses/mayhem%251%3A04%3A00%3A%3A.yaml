simpleMeaning: the act of crippling a person or badly damaging part of their body on purpose and against
  the law
scope: The act of crippling a person or badly damaging part of their body on purpose and against the law;
  not wild noise or confusion, and not a fight in general.
examples:
- He was charged with mayhem after the attack.
- The mayhem left the man unable to walk.
