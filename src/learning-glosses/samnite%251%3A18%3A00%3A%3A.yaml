simpleMeaning: A member of an old people of Campania who spoke Oscan and fought the early Romans again
  and again.
scope: This is a member of an old people of Campania who spoke Oscan and fought the early Romans again
  and again, not one of the Romans they fought.
examples:
- The Samnite fought the early Romans in Campania.
- A Samnite spoke Oscan, not Latin.
