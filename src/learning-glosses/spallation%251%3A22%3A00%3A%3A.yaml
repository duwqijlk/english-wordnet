simpleMeaning: In physics, a reaction in which an atom's centre, hit by something, breaks up into many
  small parts
scope: In physics, a reaction in which an atom's centre breaks up into many small parts after being hit;
  not a chemical change, and not the splitting of an atom into two.
examples:
- Some astronomers believe the solar system was formed by spallation when the sun was a very young star.
- In the experiment, spallation broke the nucleus into dozens of tiny particles.
