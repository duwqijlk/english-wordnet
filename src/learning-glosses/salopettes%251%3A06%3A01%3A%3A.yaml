simpleMeaning: Trousers, most often of stretchy cloth held tight by a band under the foot, worn for skiing
  or as a smart outfit.
scope: These trousers are also called ski pants; they are made of stretchy cloth held tight by a band
  under the foot and worn for skiing or as a smart outfit.
examples:
- They wore salopettes for skiing that day.
- The salopettes held tight under the foot all day.
