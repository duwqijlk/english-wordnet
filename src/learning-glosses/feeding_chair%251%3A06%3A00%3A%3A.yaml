simpleMeaning: A very young child sits in this seat at meals, with four long legs under it, a rest for
  the feet, and a tray that can be taken off
scope: 'Also called a highchair: a tall seat for a very young child at meals, not a low seat and not a
  seat for an older child.'
examples:
- The baby sat in her feeding chair while her mother spooned in the soup.
- We wiped the feeding chair clean after lunch.
