senseId: 'agglutination%1:22:01::'
synsetId: 13449781-n
simpleMeaning: the clumping of germs or red blood cells when body chemicals that fight illness hold them
  together
scope: The clumping of germs or red blood cells held together by antibodies, not the building of words
  from parts and not the joining of small bits in a liquid.
examples:
- Agglutination of the red cells showed that the blood types did not match.
- The test used agglutination to show the germs clumping together.
