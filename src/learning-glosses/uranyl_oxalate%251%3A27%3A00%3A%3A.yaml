simpleMeaning: A salt made when salts of uranium meet oxalic acid.
scope: A salt made from uranium salts and oxalic acid, not a yellow salt made with nitric acid and not
  a salt made with plain water.
examples:
- Uranyl oxalate is a salt made from uranium salts and oxalic acid.
- They made uranyl oxalate by mixing uranium salts with oxalic acid.
