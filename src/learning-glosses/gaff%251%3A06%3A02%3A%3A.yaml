simpleMeaning: a sharp metal point or spur tied to the leg of a male chicken used for fighting
scope: This is the sharp point on a fighting chicken's leg, not the long pole on a boat that holds the
  top of a sail.
examples:
- Each bird wore a steel gaff on its leg before the fight.
- The sharp gaff cut the other bird's leg.
