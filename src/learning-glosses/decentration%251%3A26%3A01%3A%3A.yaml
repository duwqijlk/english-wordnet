simpleMeaning: Jean Piaget's idea of how a child's mind grows, as the child moves bit by bit from a self-only
  world to a world shared with other people.
scope: This is Jean Piaget's idea of a child moving from a self-only world to a shared world, also called
  decentering, not a child's first words or a test of how a child plays.
examples:
- Decentration means the child learns to see the world as others see it.
- The teacher watched for decentration as the child grew older.
