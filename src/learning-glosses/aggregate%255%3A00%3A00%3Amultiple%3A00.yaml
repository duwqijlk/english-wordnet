simpleMeaning: Made of many separate parts packed tightly together, such as carpels (seed-holding parts
  of a flower), florets (small flowers), or drupelets (small parts of a fruit)
scope: This describes a thing made of many small parts packed together, as with some fruits and flowers;
  it is not the sand and stones used in building, and not the verb for adding up to a total.
examples:
- Raspberries are aggregate fruits, made of many small parts joined together.
- Blackberries are aggregate fruits with many small round parts.
