simpleMeaning: a person who signs up for a written promise that pays money to make up for loss of property,
  death, ill health, or other loss
scope: This is a person who has such protection, not the describing word for a person or thing that has
  protection of this kind.
examples:
- As the insured, she got money after her car was stolen.
- The insured asked for help after the fire harmed his house.
