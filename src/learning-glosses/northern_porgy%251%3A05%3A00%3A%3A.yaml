simpleMeaning: A fish liked as food for the pan, it lives in the sea along the Atlantic coast of North
  America from South Carolina to Maine.
scope: Northern scup and scup are other names for this fish, liked as food for the pan and found along
  the Atlantic coast from South Carolina to Maine.
examples:
- The northern porgy is caught along the Atlantic coast from South Carolina to Maine.
- We fried a northern porgy for supper.
