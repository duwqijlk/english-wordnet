simpleMeaning: warm weather after a freeze, when snow and ice melt and turn to water
scope: This is warm weather after a freeze, also called warming and thaw. It is not cold, freezing weather.
examples:
- The spring thawing melted the snow on the fields.
- After weeks of ice, the thawing brought water back to the river.
