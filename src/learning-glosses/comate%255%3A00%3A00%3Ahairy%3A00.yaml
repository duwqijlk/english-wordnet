simpleMeaning: used for certain seeds, like cotton seeds, that grow a small bunch or bunches of hair
scope: Used for certain seeds, like cotton seeds, that grow one or more small bunches of hair; also called
  comal and comose, and not a seed crowned with leaves.
examples:
- The comate seeds drifted away on their soft tufts of hair.
- Farmers knew the comate cotton seeds by the small bunches of hair on them.
