simpleMeaning: Not able to move the body in a smooth, controlled way; a mark of a loss of body control,
  or brought on by it
scope: Not able to move the body in a smooth, controlled way, also called atactic; not clumsy from tiredness
  and not weak from illness.
examples:
- His ataxic walk made him stumble on the flat floor.
- The ataxic movements of her hands made writing hard.
