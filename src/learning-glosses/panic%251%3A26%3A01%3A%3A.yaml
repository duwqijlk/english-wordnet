simpleMeaning: sudden fear and worry felt by many people at once about something they think will happen
scope: 'Also called scare: sudden fear and worry among many people, not the verb sense of making someone
  suddenly afraid.'
examples:
- There was panic in the market when prices fell fast.
- Panic spread through the crowd when people thought a bomb was in the building.
