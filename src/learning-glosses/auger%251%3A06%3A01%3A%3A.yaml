simpleMeaning: A long steel coil that bends as you push it through a curved pipe, to shift what is stuck
  inside it.
scope: 'Also called a snake or a plumber''s snake: the long steel coil that clears a blockage in a curved
  pipe, not the hand tool for boring holes.'
examples:
- He used an auger to clear the blocked pipe under the sink.
- The auger bent round the curve and broke up the blockage.
