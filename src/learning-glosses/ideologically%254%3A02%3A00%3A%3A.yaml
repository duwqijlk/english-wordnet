senseId: 'ideologically%4:02:00::'
synsetId: 00363133-r
simpleMeaning: in a way that has to do with a set of beliefs about how people should live and how a country
  should be run
scope: This is about a set of beliefs about how people should live and how a country should be run, not
  about where a place is in the world.
examples:
- Ideologically, the two parties disagree about how the country should be run.
- They are close as friends, but ideologically they hold very different beliefs.
