simpleMeaning: plants whose green stuff, chlorophyll, is covered over by earth-coloured and yellow colouring
  matter
scope: Plants whose green colouring is hidden by earth-coloured and yellow colouring matter; not green
  plants and not red plants.
examples:
- Brown algae grow on the rocks at low tide.
- The brown algae in the tank turned the water dark.
