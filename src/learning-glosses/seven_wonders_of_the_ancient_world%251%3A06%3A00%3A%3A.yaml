simpleMeaning: Great works built long ago, looked on with awe.
scope: Seven Wonders of the World is another name for this sense, a set of seven great works of the old
  world held in awe, not a list of modern wonders and not a single famous building on its own.
examples:
- The Seven Wonders of the Ancient World were great works that people looked on with awe.
- Travellers spoke with awe of the Seven Wonders of the Ancient World.
