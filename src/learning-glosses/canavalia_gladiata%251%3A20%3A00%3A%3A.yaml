simpleMeaning: A twining plant of the tropical Old World, bearing long pods, usually with red or brown
  beans, long grown in the East for food.
scope: Also called sword bean; a twining tropical plant grown for its long pods and beans, among other
  plants grown for their beans.
examples:
- The Canavalia gladiata wound around the poles in the field.
- Farmers have long grown Canavalia gladiata in the East for its beans.
