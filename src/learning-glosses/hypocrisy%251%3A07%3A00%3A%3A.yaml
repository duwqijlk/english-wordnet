schema: oewn-learning-gloss-v2
senseId: 'hypocrisy%1:07:00::'
synsetId: 04875361-n
simpleMeaning: acting in a way that is not honest, as if you have qualities or beliefs that you do not
  really have
scope: This is acting as if you have beliefs or qualities you do not really have; it is not just a simple
  lie or a change of mind.
examples:
- His talk of honesty was pure hypocrisy, because he stole money himself.
- It is hypocrisy to praise hard work and never do any yourself.
