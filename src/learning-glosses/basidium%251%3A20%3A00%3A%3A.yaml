simpleMeaning: On a fungus, one big group alone has this tiny club-shaped part, which most often bears
  four dust-like specks at the tips of small points.
scope: This is the tiny club-shaped part found only in one big group of fungi.
examples:
- Each basidium on the fungus held four dust-like specks.
- The basidium bears its four specks at the tips of small points.
