scope: The art of trimming faces with shapes or pictures, then covering them in varnish, or in lacquer;
  not art made by decking a face with cutouts, then coating it with various layers of varnish or lacquer.
examples:
- Their decoupage decked the box.
- The decoupage was shown at dawn.
