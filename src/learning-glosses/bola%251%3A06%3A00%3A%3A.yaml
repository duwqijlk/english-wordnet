simpleMeaning: 'A hunting tool from South America: a long cord with heavy ends that is thrown to wrap
  round an animal''s legs and hold it fast.'
scope: A hunting tool, not the cord worn round the neck as a tie.
examples:
- He threw the bola and it wrapped round the animal's legs.
- The bola caught the animal by the legs.
