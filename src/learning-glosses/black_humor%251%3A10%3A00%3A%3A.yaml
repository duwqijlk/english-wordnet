senseId: 'black_humor%1:10:00::'
synsetId: 07082173-n
simpleMeaning: in writing or plays, death and silly jokes put side by side to give a troubling feel
scope: Also called black humour, it is dark and silly parts put together in writing or plays to trouble
  the reader, not plain funny writing and not a sad play with no jokes.
examples:
- The black humor in the play made the audience laugh and feel uneasy at once.
- Her novel uses black humor to face death with silly jokes.
