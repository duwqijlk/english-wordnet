simpleMeaning: In Christianity, one of the parts into which a statement of belief is divided
scope: In Christianity, one part of a statement of belief, also called credendum; not a rule of law and
  not an item in a list.
examples:
- The article of faith was read aloud in the service.
- Each article of faith states one part of what the church teaches.
