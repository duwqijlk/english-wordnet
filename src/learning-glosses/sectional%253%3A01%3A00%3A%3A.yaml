simpleMeaning: about a view or drawing that shows the inside of a thing as if a flat surface had cut across
  it
scope: About a cut-through view or drawing, not made of separate parts and not limited to one region or
  group of people.
examples:
- The book gives a sectional view of the engine.
- The sectional drawing shows the pipes inside the building.
