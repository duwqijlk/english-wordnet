simpleMeaning: Well off but not wealthy, with plenty of money for an easy life.
scope: This is about having money, not about a place or object that gives physical ease, and not about
  an amount that is just enough for ease.
examples:
- After years of saving, they were comfortable enough to retire early.
- Her parents were comfortable, though not rich enough to buy a second home.
