simpleMeaning: 'In biology, the largest group that living things are put in, one of five groups: Monera
  or Protoctista or Plantae or Fungi or Animalia'
scope: In biology, the largest group of living things, not a land ruled by a crowned ruler and not a smaller
  group of living things.
examples:
- In class we learned that animals form one kingdom and plants form another kingdom.
- The teacher asked us to name the five kingdoms of living things.
