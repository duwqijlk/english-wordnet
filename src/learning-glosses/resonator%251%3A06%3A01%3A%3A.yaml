simpleMeaning: A regular swing of current grows to its greatest size in an electric loop that joins a
  part that stores charge with a part that resists change
scope: This is an electric loop in which a regular swing of current grows to its greatest size; resonant
  circuit is another name for this sense, not a hollow chamber that rings with sound.
examples:
- The resonator lets the swing of current grow to its greatest size.
- Engineers tuned the resonator until the current swung at its greatest size.
