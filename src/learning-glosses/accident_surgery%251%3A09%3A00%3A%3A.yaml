simpleMeaning: Hurts and wounds from sudden harm are mended in this part of medicine by operating on them.
scope: 'Another name for this sense is traumatology: the part of medicine that mends hurts and wounds
  caused by sudden harm by operating on them.'
examples:
- Accident surgery mended his broken leg after the crash.
- She trained in accident surgery to treat wounds from road crashes.
