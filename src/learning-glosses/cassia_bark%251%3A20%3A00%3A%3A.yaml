simpleMeaning: the sweet-smelling outer skin of a tree, used as a spice but not as good as the bark of
  Ceylon cinnamon
scope: A spice bark, not Ceylon cinnamon bark and not a bark prized above all other spices.
examples:
- The cook added cassia bark to the stew for a warm smell.
- Cassia bark costs less than Ceylon cinnamon bark.
