simpleMeaning: A person cannot feel things with the hand and wrist, because of a problem of the mind
scope: A loss of feeling in the hand and wrist that comes from the mind, not from damage to a nerve and
  not a loss of feeling in the whole arm.
examples:
- Her glove anesthesia meant she felt nothing when she touched the hot cup with her hand.
- The doctor said the glove anesthesia came from the mind, not from a hurt nerve.
