simpleMeaning: A black substance of tiny bits spread through it, made almost all of shapeless carbon,
  used to make colour and ink.
scope: A black substance made almost all of shapeless carbon, also called soot, crock, lampblack, and
  carbon black; not a black paint and not a dirty mark.
examples:
- Smut blackened the lamp glass.
- They used smut to make ink.
