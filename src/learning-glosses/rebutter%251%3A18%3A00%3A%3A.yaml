simpleMeaning: A speaker in a debate who shows that a claim is wrong by giving facts or reasons against
  it
scope: A speaker in a debate who shows a claim is wrong, also called a confuter, a disprover or a refuter;
  not a speaker who agrees and not a judge.
examples:
- The rebutter answered each point with facts.
- As a rebutter, she was hard to beat.
