senseId: 'adverbial_of_condition%1:10:01::'
synsetId: 92464145-n
simpleMeaning: a word or group of words that tells of a thing that may happen, or that did not happen,
  and what follows from it
scope: A word or group of words about a thing that may happen, or that did not happen, and what follows
  from it; not a word that tells where or when something happens.
examples:
- The clause 'if you polish it regularly' is an adverbial of condition.
- She used an adverbial of condition to say what would happen if the rain stopped.
