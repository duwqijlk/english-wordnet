simpleMeaning: In some lands, Muslims are few in number and are treated badly.
scope: These are lands where Muslims are few and treated badly; House of War is another name for this
  sense, not lands where Muslims rule.
examples:
- Dar al-harb is a term for lands where Muslims face persecution.
- He wrote about Dar al-harb and the hard life of Muslims there.
