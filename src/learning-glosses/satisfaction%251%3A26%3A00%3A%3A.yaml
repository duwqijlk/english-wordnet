simpleMeaning: The state of feeling glad and pleased because a want or need has been met
scope: Being in a glad, pleased state after a want is met, not the act of meeting the want and not a short
  burst of joy.
examples:
- To my great satisfaction, he arrived on time.
- She looked back on the day with quiet satisfaction.
