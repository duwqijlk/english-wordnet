senseId: 'acetanilide%1:06:00::'
synsetId: 02677766-n
simpleMeaning: A solid chemical with no smell, appearing as leaf-shaped or flaky crystals, used to make
  rubber accelerators, dyes and camphor; in the body it breaks down into paracetamol.
scope: This spelling names the same compound as 'acetanilid', a chemical used in industry, not the painkiller
  paracetamol that it becomes in the body. It is a technical term in chemistry.
examples:
- Acetanilide is a standard starting material in undergraduate organic synthesis.
- Workers handling acetanilide must avoid breathing in the dust.
