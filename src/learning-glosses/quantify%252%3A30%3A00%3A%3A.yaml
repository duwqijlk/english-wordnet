simpleMeaning: To put something into numbers, so its size or amount is clear
scope: To put something into numbers; measure is another name for this sense, not using a word like 'some'
  and not guessing at a size.
examples:
- Can you quantify your results for the report?
- The study quantified the fall in sales over five years.
