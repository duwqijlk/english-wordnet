simpleMeaning: to say words in a singing voice, as in a chant or a prayer song
scope: chant is another name for this sense; not speaking in a plain voice, and not just speaking slowly
  in one flat tone.
examples:
- The rabbi intoned a prayer before the meal.
- The choir intoned the psalm in a low voice.
