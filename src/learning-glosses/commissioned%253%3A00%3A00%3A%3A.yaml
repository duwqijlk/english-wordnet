simpleMeaning: of an officer in the armed forces, holding a rank of second lieutenant or ensign or above
  by a written order that gives that rank
scope: An officer holding a rank of second lieutenant or higher by written order, not a private soldier
  and not an officer who has left the forces.
examples:
- Only commissioned officers may give that order.
- She became a commissioned officer after training.
