simpleMeaning: an official written note that says you plan to leave your job
scope: An official note saying you plan to leave your job, not the act of leaving itself, and not a feeling
  of quiet acceptance.
examples:
- He submitted his resignation as of next month.
- Her resignation surprised the whole office.
