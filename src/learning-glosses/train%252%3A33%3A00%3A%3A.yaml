simpleMeaning: To aim a blow, weapon, camera or similar object in a certain direction.
scope: To direct a blow, weapon, or camera toward a target, not a railway service, a line of coupled cars,
  or travel by rail; not an ordered series of things or events, a file of pack animals, or a chain of
  consequences; not a gown's trailing cloth or a set of gears; and not any act of teaching, learning,
  coaching, fitness exercise, child or animal discipline, plant shaping, or dragging.
examples:
- The guard trained his flashlight on the dark doorway.
- She trained the camera on the bird and waited for it to move.
