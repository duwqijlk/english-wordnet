simpleMeaning: strings pulled tight across the bottom skin of a drum, which make a rattling noise when
  the drum is hit
scope: The strings on a drum, not the drum itself, not a trap for small animals, not a trick that catches
  you by surprise, and not the surgeon's wire loop.
examples:
- The snares on his drum buzzed each time he struck it.
- He tightened the snares so they would rattle when he hit the drum.
