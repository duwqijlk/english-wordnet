simpleMeaning: To say something out loud so many people hear it, as if with a loud brass horn
scope: This is saying something out loud so many people hear it, not the brass instrument itself and not
  making sounds like that instrument or playing it.
examples:
- The mayor trumpeted the new plan to a large crowd.
- She trumpeted her success to everyone in the office.
