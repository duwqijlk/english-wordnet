synsetId: 02489417-v
simpleMeaning: To punish a person by locking them into a wooden frame in a public place.
scope: To lock a person in the frame as a punishment, not the frame itself, not harsh blame in words,
  and not holding a person up to scorn.
examples:
- The court ordered that the cheat be pilloried in the market square.
- They pilloried him for the theft before a jeering crowd.
