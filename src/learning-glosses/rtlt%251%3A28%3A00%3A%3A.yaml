simpleMeaning: The time it takes for a signal to go from Earth to a ship in space or another thing in
  the sky and back to where it started.
scope: Also called round-trip light time; this is the time a signal takes to go out and come back, not
  the time of a one-way trip and not the speed of the signal.
examples:
- The team worked out the RTLT for the signal to the spacecraft.
- They waited for the signal, knowing the RTLT.
