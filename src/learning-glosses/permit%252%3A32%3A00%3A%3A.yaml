simpleMeaning: to agree to let someone do something
scope: 'Also called let, allow, and countenance: to agree that someone may do something. It is not the
  noun for an official paper that says someone may do something.'
examples:
- Her parents permit her to stay out until ten.
- The teacher permitted the class to leave early.
