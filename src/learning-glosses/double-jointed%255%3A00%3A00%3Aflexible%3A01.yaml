simpleMeaning: Describes a person whose arms, legs and fingers bend far more than most people's.
scope: A person whose arms, legs and fingers bend far more than most people's, not a person with stiff
  limbs and not a person with an injury.
examples:
- She is double-jointed and can bend her fingers right back.
- He is double-jointed, so his elbows bend both ways.
