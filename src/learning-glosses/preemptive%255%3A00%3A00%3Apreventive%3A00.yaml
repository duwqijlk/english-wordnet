simpleMeaning: made to stop a thing that is expected to happen, or able to make it less likely to happen
scope: Made or done before an expected thing happens to stop it or make it less likely, not done after
  it has happened to fix what went wrong.
examples:
- The company made a preemptive offer to stop a rival bid.
- They took preemptive action to stop the problem before it started.
