simpleMeaning: It is a look or feeling that something is made to give, often false or forced rather than
  natural.
scope: Not the result that something causes, and not a special visual trick in a film.
examples:
- The lighting gave the room a warm effect.
- He spoke slowly for effect, not because he was unsure.
