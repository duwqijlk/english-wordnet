simpleMeaning: property or money that passes to you because you were born, especially to the oldest child
  under the rule that the first child gets all
scope: Property or money that passes because you were born, especially to the oldest child; this is not
  the wider sense of any right or special advantage a person has because they were born.
examples:
- The farm was his birthright as the oldest son.
- Under the old law, the land went to the first son as his birthright.
