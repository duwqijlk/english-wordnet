simpleMeaning: It grows in North America, lives for one year or for two years, and has long soft hairs
  on its leaves.
scope: Also called hoary plantain; it grows in North America, lives for one year or for two years, and
  has long soft hairs on its leaves, not a tree.
examples:
- The Plantago virginica in the field had long soft hairs on its leaves.
- We found Plantago virginica growing in North America.
