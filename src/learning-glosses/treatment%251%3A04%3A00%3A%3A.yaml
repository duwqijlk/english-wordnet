simpleMeaning: care given to make a situation better, especially medical help that is meant to ease an
  illness or injury
scope: This is not the way an artist handles a subject and not how you behave toward someone; it means
  help given to heal or improve.
examples:
- She is receiving treatment for a broken arm.
- The new treatment helped him walk again.
