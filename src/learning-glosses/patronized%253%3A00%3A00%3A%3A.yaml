simpleMeaning: having customers, or people who give help or money to a person or a group
scope: About a person, a business or a group that has customers or people who give it help or money; not
  about a person being spoken to as if they know less.
examples:
- The street was full of busy, well-patronized shops.
- The small cafe is well-patronized by students during the week.
