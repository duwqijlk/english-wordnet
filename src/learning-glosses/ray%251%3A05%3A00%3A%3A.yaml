simpleMeaning: A flat-bodied sea fish with a skeleton of cartilage, broad winglike fins and gills underneath;
  most species swim by rippling those fins.
scope: The fish, not a beam of light, and not one of the stiff spines in a fish's fin; it is a close relative
  of the skate.
examples:
- A ray glided over the sand, rippling its wide fins.
- The aquarium's touch pool holds a small ray and several crabs.
