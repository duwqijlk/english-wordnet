  crop.
scope: A European pea plant with strands on it, much grown as food for farm animals and as a cover crop;
  hairy vetch is another name for it, not a hairy plant from Europe and Asia with white two-lipped flowers
  and not a tree that gives a sticky plant stuff.
examples:
- Farmers grew hairy tare as food for their animals.
- Hairy tare covered the field as a cover crop.
