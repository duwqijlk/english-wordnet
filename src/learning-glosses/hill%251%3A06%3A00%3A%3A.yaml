simpleMeaning: The slightly raised area of a baseball field from which the pitcher throws.
scope: This is the spot on a baseball diamond, not 'a natural rise in the landscape,' not 'an artificial
  pile or bank of earth,' and not the verb 'to form into a pile.'
examples:
- He walked out to the hill to talk to the pitcher.
- The pitcher stepped off the hill and threw to first base.
