simpleMeaning: a tube with lenses put on a gun so the shooter can see far things close up and aim well
scope: 'Also called a telescope sight: a sight put on a gun, not a tube held in the hand for looking at
  the sky and not the plain metal marks on a gun barrel.'
examples:
- She adjusted the telescopic sight before she fired.
- The telescopic sight made the far target look close.
