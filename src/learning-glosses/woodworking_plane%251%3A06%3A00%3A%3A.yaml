simpleMeaning: A hand tool used by a person who makes things from timber, with a blade that can be moved
  to smooth or shape the timber
scope: 'Also called plane and carpenter''s plane: a hand tool with a blade that can be moved, not an electric
  sander and not a saw.'
examples:
- The cabinetmaker used a woodworking plane for the finish work.
- He ran the woodworking plane over the board until it was smooth.
