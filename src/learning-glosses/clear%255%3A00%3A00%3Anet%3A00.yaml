simpleMeaning: 'Used about money: with no charges or other amounts taken out of it, so it is the amount
  you actually receive or keep.'
scope: This sense applies to amounts of money with nothing further taken out, not to property rights that
  are free of legal claims.
examples:
- The company reported a clear profit of two million dollars after all costs.
- After the fees were paid, she took home a clear ten thousand pounds.
