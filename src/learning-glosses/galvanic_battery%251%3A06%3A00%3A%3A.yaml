simpleMeaning: A power pack made of a number of power units joined in a line or side by side.
scope: This is a power pack of power units joined in a line or side by side; not a single power unit on
  its own, and not power from the mains.
examples:
- The galvanic battery gave power to the old radio.
- He joined the cells to make a galvanic battery.
