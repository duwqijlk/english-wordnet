simpleMeaning: an idea, a way of acting, or a thing people value that spreads from person to person by
  copying, not by birth
scope: An idea, a way of acting, or a thing people value that spreads by copying from one person to another,
  not a thing passed on by birth.
examples:
- The meme spread quickly from one group of friends to another.
- That meme about the dancing cat passed from person to person online.
