simpleMeaning: China with a shiny coat and a web of thin little cracks over the outside.
scope: Glazed china marked with fine cracks, not the sharp snapping sound and not the act of making such
  cracks.
examples:
- She bought a crackle bowl with a web of fine lines across it.
- The crackle vase on the shelf was covered in fine cracks.
