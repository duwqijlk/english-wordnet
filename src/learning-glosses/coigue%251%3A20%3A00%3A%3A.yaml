simpleMeaning: A Chilean tree that keeps its leaves all year, whose leafy branches are used to cover roofs.
scope: This is a Chilean tree that keeps its leaves all year, whose leafy branches are used to cover roofs;
  not a tree that loses its leaves and not a tree grown for fruit.
examples:
- The coigue kept its leaves through the cold months.
- They cut coigue branches to thatch the roof.
