simpleMeaning: A liquid made by gently simmering meat and vegetables, used as a base for dishes such as
  soups or sauces.
scope: A cooking liquid made by simmering meat and vegetables only; not the goods a shop has on hand,
  a supply kept for future use, corporate equity, a share certificate, a person's ancestry, a breed of
  domesticated animals, a person's reputation, a thick perennial stem, a graft rootstock, a bright-flowered
  Old World plant, a Malcolmia ornamental, lumber, the handle end of a tool, the handle or butt of a gun,
  a white cravat, farm animals, a routine thing, an overused saying, a standard item regularly sold, or
  any verb use (keeping goods on hand, fitting something out, putting fish into a pond, putting livestock
  on land, gathering a store for later, supplying something with goods, putting out sprouts).
examples:
- Let the vegetable stock simmer for an hour before you add the lentils.
- He deglazed the pan with a splash of chicken stock.
