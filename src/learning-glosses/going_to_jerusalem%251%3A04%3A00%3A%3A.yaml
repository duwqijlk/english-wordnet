simpleMeaning: 'A children''s game: players circle chairs, one fewer, to music; when it stops, all try
  to sit, one is out, a chair is taken away, until one is left seated.'
scope: Also called musical chairs; a children's game in which players circle chairs, one fewer than the
  players, while music plays, and the player left without a chair is out.
examples:
- The children played going to Jerusalem at the party.
- When the music stopped in going to Jerusalem, Maya found a chair.
