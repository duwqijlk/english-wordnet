senseId: 'rationalization%1:22:00::'
synsetId: 13567372-n
simpleMeaning: In psychiatry, a way the mind hides your true reason, by explaining what you do and feel
  in a way that does not feel like a danger
scope: 'Also called rationalisation: in psychiatry, hiding a true reason with a safe reason, not making
  maths simpler and not putting things in order by a system.'
examples:
- Saying he missed the class because the bus was late was a rationalization; he had really not wanted
  to go.
- Her rationalization hid her fear of flying behind talk about the cost of the trip.
