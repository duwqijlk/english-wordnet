simpleMeaning: Ceramics and enamels are made with this pale, crystalline mineral, a sodium or potassium
  aluminum silicate.
scope: Another name for nephelite, the same pale silicate mineral; it is not nepheline syenite, the rock
  that contains it, nor nephelinite, the volcanic rock named after it.
examples:
- A thin section of the rock showed grains of nepheline.
- The enamel factory grinds nepheline into a fine powder for its glazes.
