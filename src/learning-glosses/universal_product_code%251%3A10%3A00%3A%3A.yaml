senseId: 'universal_product_code%1:10:00::'
synsetId: 06366181-n
simpleMeaning: Vertical bars of changing width read by a laser, printed on packs of goods to tell a computer
  what it is, so it can price it and keep stock records.
scope: Not a QR code or a book number; also called a bar code.
examples:
- The Universal Product Code on the box gave the price at the till.
- Scan the Universal Product Code to check the stock.
