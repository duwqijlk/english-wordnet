senseId: 'desire%2:37:01::'
synsetId: 01830320-v
simpleMeaning: to say or write that you want something
scope: This is saying or writing that you want something, not just feeling that you want it very much,
  and not the thing you want itself.
examples:
- She told the desk clerk that she desired a quiet room.
- In his letter, he desired a meeting with the manager.
