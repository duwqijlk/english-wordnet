simpleMeaning: The people claiming descent from Abraham and Isaac, above all from Jacob, the nation God
  chose to receive his word and make a covenant with, as in Exodus 19.
scope: 'Also called Hebrews: the people claiming descent from Abraham, Isaac and Jacob, not the modern
  state and not the Jews of a later age.'
examples:
- The Israelites crossed the desert under Moses.
- According to the Bible, the Israelites received God's covenant at Sinai.
