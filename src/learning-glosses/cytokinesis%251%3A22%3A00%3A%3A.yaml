simpleMeaning: a life process in which the soft inside of a cell splits after its core has split, making
  two new cells
scope: A life process in which the soft inside of a cell splits after its core has split; not the splitting
  of the core itself and not the growth of a cell.
examples:
- Cytokinesis splits the cell into two new cells.
- After the core split, cytokinesis divided the cell's soft inside.
