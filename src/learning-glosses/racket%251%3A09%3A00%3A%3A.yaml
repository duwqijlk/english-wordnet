simpleMeaning: the hearing of sounds that have no tune and feel bad to listen to
scope: 'Also called noise: the hearing of unpleasant sound, not a sports bat, not an illegal business,
  and not a wild party.'
examples:
- To her, the loud music from next door was just a racket.
- The children made such a racket that no one could sleep.
