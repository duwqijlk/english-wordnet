simpleMeaning: Small round lumps that grow under the ground are borne by this plant from Europe, eaten
  as food and in Scotland used to give taste to whiskey.
scope: Also called earthnut pea, heath pea, and tuberous vetch, it bears small round lumps under the ground,
  eaten as food and in Scotland used to give taste to whiskey.
examples:
- She dug up earth-nut pea tubers for the evening meal.
- In Scotland, earth-nut pea gives taste to whiskey.
