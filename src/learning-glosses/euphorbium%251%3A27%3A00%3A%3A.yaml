simpleMeaning: A sharp-tasting brown sticky plant stuff, now used mostly in medicine for animals.
scope: A brown sticky plant stuff used mostly to treat animals; also called gum eurphorbium, not a sweet
  gum for chewing and not a medicine for people.
examples:
- The vet mixed euphorbium into the ointment for the horse.
- Euphorbium was once used more widely, but now it is used mainly in veterinary medicine.
