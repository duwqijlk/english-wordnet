simpleMeaning: one kind of body-made substance that fights viruses, made by cells in body tissue and used
  to treat a disease that harms the nerves
scope: One kind of body-made substance that fights viruses, made by cells in body tissue, not another
  kind of interferon and not a cure for the nerve disease it treats.
examples:
- The doctor gave her beta-interferon to slow the disease that harms her nerves.
- Beta-interferon is made by cells in body tissue and helps fight viruses.
