simpleMeaning: The flesh of a fish, with little fat, that is often raised on farms; it can be baked or
  cooked slowly in a covered pan with a little liquid
scope: This is the flesh of the fish eaten as food, not the living fish itself and not the verb that means
  to complain again and again.
examples:
- She baked the carp and served it with rice.
- The carp was cooked slowly in a covered pan and tasted mild.
