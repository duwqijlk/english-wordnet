simpleMeaning: Carrying the kind of electric charge that is the opposite of the negative kind
scope: Carrying the kind of electric charge that is the opposite of the negative kind, also called positive;
  not a thing with a negative charge and not a thing with no charge at all.
examples:
- Protons are positively charged, while electrons carry the opposite charge.
- The positively charged plate drew the dust towards it.
