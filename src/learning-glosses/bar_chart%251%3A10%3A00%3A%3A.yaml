simpleMeaning: A picture of numbers using strips whose lengths match the amounts they stand for
scope: A picture of numbers using strips whose lengths match the amounts, not a picture using slices of
  a circle and not a picture using lines; bar graph is another name for it.
examples:
- The bar chart showed sales for each month.
- She drew a bar chart of the class results.
