simpleMeaning: One of two nets of nerves in a lung, working on its own
scope: One of two nets of nerves in a lung, also called plexus pulmonalis; not a net of nerves elsewhere
  in the body.
examples:
- The pulmonary plexus carries signals that control the airways in the lung.
- Damage to the pulmonary plexus can change how the lung works.
