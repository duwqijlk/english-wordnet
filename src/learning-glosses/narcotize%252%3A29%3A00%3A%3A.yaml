simpleMeaning: to give a drug that brings deep sleep or takes away pain
scope: To give a drug that brings deep sleep or takes away pain; narcotise is another name for this sense,
  not to give a drug that wakes a person up and not to take such a drug oneself.
examples:
- The nurse will narcotize the patient before the test.
- They had to narcotize the bear to move it.
