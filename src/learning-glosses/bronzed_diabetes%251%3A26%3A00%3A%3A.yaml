simpleMeaning: a disease in which iron builds up in body tissue, marked by darkened skin, a swollen liver,
  raised blood sugar, and problems with the pancreas and joints.
scope: Another name for the iron-storage disorder also called hemochromatosis, iron-storage disease or
  iron overload, not ordinary diabetes or a skin condition.
examples:
- Doctors once used the term bronzed diabetes for this iron-storage disorder.
- Bronzed diabetes can damage the liver, pancreas and joints over time.
