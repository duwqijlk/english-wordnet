simpleMeaning: a child conceived when an egg is taken from the mother, fertilized outside her body, and
  then put back in her womb to grow
scope: This is the child born this way, not the laboratory procedure that made the birth possible.
examples:
- Their daughter was one of the first test-tube babies in the country.
- The documentary followed a test-tube baby into adulthood.
