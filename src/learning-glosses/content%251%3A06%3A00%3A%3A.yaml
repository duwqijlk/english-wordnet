simpleMeaning: the person, object, or scene that an artist or photographer chooses to show in a picture
scope: This is the subject chosen for a picture, not the material held inside something or the feeling
  of being satisfied.
examples:
- The content of the photograph is a child sleeping in a doorway.
- The artist changed the content of the picture from a vase to a bowl of fruit.
