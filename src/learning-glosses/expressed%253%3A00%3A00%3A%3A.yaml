simpleMeaning: clear and exact in what is said or shown, or easy to see, with nothing left to be worked
  out from hints
scope: 'Also called explicit: clear and exact in what is said or shown, not unclear and not left for the
  reader to work out from hints.'
examples:
- His expressed wish was to stay at home.
- Her expressed aim was clear to everyone from the start.
