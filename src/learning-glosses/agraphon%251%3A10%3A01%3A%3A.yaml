simpleMeaning: A saying of Jesus found in other New Testament writings or early Christian ones, not in
  the four main books about him, and usually in the plural.
scope: This saying of Jesus comes from other New Testament writings or early Christian ones, not from
  the four gospels themselves, and it is usually in the plural.
examples:
- He quoted an agraphon that is not found in the four gospels.
- Scholars study agrapha found in early Christian writings outside the gospels.
