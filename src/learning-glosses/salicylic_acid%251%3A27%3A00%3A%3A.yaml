simpleMeaning: Used to kill fungus and to make aspirin, dyes, and perfumes, this white stuff comes in
  hard clear bits and leaves a bitter taste.
scope: Its other name is 2-hydroxybenzoic acid, and it is a white stuff that kills fungus and goes into
  aspirin, dyes, and perfumes.
examples:
- Salicylic acid killed the fungus.
- Salicylic acid went into the aspirin.
