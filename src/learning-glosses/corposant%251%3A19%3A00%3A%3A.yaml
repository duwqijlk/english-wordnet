simpleMeaning: a flow of electric power through the air, which charges the air around it
scope: A flow of electric power through the air, which charges the air around it; corona discharge, corona
  and electric glow are other names for this sense, not a flash of lightning, and not a spark from a wire.
examples:
- A corposant glowed at the tip of the mast during the storm.
- The sailors watched the corposant dance along the rigging.
