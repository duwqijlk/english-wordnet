simpleMeaning: fast mail that riders on horseback carry in turns, especially between Missouri and California
  around 1860
scope: Fast mail carried in turns by riders on horseback, especially between Missouri and California around
  1860, not mail carried by train or by plane.
examples:
- The mail sent by pony express reached California in about ten days.
- Riders on the pony express passed the mail from one rider to the next on the way to California.
