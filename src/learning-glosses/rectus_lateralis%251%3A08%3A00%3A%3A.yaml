senseId: 'rectus_lateralis%1:08:00::'
synsetId: 05323957-n
simpleMeaning: In the eye, a small band of flesh that pulls the eye out toward the side of the head
scope: 'Also called abducens muscle, lateral rectus, or lateral rectus muscle: the eye band that pulls
  the eye out to the side, not the one that pulls it down and in and not the one that pulls it only in.'
examples:
- The rectus lateralis turns the eye out when we look to the side.
- When the rectus lateralis pulls, the eye moves away from the nose.
