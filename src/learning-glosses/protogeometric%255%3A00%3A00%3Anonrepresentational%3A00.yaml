simpleMeaning: like the art of the first stage of the Greek style that uses plain shapes, especially in
  Greece
scope: Art from the first stage of the Greek style that uses plain shapes, especially in Greece, not later
  Greek art and not art with people and animals in it.
examples:
- The museum showed protogeometric pots painted with plain lines and circles.
- Protogeometric art came before the later Greek styles with figures.
