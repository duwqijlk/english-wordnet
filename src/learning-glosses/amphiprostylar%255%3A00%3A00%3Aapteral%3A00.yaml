senseId: amphiprostylar%5:00:00:apteral:00
synsetId: 00140760-s
simpleMeaning: a building that has rows of free columns in covered entrance areas at both ends or on both
  sides
scope: This describes a building with open columned entrance areas at both ends or both sides, also called
  amphiprostyle, amphistylar or porticoed, not a building with columns on one side only or with no columns
  at all.
examples:
- The amphiprostylar temple had tall columns at both ends.
- Her notes called the old hall amphiprostylar because it had columns on each side.
