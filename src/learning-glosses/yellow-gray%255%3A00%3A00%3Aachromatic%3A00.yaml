simpleMeaning: Of a colour like ash, with a touch of gold in it
scope: Of a colour like ash, with a touch of gold in it; yellow-grey, yellowish-gray and yellowish-grey
  are other names for this sense, not ash colour with no gold in it and not ash colour with green in it.
examples:
- The sky was yellow-gray before the storm.
- She chose yellow-gray paint for the hall.
