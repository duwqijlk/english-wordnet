simpleMeaning: The way of life of the first peoples of Central and North America, known best for sharp
  grooved stone spearheads made of dark glassy rock or pale hard stone.
scope: The way of life of the first peoples of Central and North America, known for its sharp grooved
  stone spearheads; kin to other early American ways of life.
examples:
- The Clovis culture is known for its sharp fluted stone points.
- Archaeologists study Clovis culture sites across North America.
