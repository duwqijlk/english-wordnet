senseId: 'regeneration%1:04:01::'
synsetId: 00270807-n
simpleMeaning: the act of making something again, especially in a better way or with faults removed, and
  of making it new and whole again
scope: Also called re-formation, this is making something anew in general, not new growth of lost body
  parts and not a feedback effect in machines.
examples:
- The city's regeneration plan rebuilt the harbour and removed broken buildings.
- Regeneration of the old market gave the town a fresh start.
