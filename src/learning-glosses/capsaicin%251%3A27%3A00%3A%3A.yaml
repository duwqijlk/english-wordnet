simpleMeaning: a colorless, sharp-tasting crystalline compound from capsicum plants; the substance that
  makes hot peppers such as chili, cayenne and jalapeno taste hot.
scope: This is the chemical compound responsible for the burning sensation, not the pepper plant or the
  fruit itself.
examples:
- Capsaicin gives chili peppers their burning heat.
- A cream containing capsaicin can ease muscle pain.
