simpleMeaning: The tide is at its farthest back when the sea has gone out as far as it can go
scope: Also called low tide, this is the point when the tide has gone out the farthest, not high tide
  and not the flow of water coming in.
examples:
- The boats sat on the mud at low water.
- We waited for low water before crossing the sand.
