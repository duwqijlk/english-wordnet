simpleMeaning: to hang in a loose way, free to move, and let something swing back and forth
scope: This verb means to hang loose and swing, not the cloth that holds an injured arm, not the weapon
  used to throw stones, and not the act of throwing something.
examples:
- The bags sling loosely from hooks on the wall, swinging when the door opens.
- Ropes sling loosely between the two trees, moving free in the wind.
