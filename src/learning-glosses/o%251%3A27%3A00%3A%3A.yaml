simpleMeaning: A paired gas, valence 2, nonmetal, usually lacking hue, smell, taste, and never burns;
  21 in a hundred of air by volume, the greatest element in the earth's crust.
scope: A gas that makes up much of the air, not nitrogen and not a gas that burns; also called oxygen
  and atomic number 8.
examples:
- O makes up about a fifth of the air we breathe.
- O is the most common element in the earth's crust.
