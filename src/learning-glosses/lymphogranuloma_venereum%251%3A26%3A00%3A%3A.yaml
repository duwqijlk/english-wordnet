simpleMeaning: A sexually transmitted infection caused by a kind of chlamydia bacterium, marked by sores
  on the genitals and swollen lymph nodes in the groin.
scope: Another name for lymphopathia venereum, a sexually spread chlamydial illness, not syphilis or other
  causes of genital sores.
examples:
- Lymphogranuloma venereum is spread through sexual contact.
- Lymphogranuloma venereum can cause sores on the genitals and swollen lymph nodes in the groin.
