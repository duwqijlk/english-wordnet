simpleMeaning: The body's defenders, among them the T and B kinds, grow from young blood-making bits deep
  inside bones.
scope: These young blood-making bits sit in the bone marrow and grow into T and B defenders.
examples:
- A hematopoietic stem cell in the marrow can grow into many kinds of blood bits.
- Hematopoietic stem cells in the marrow give rise to T and B defenders.
