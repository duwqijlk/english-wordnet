simpleMeaning: Any of a group of fungi, some of which cause brown rot in plants
scope: Any fungus of one group, some of which cause brown rot in plants; not a mold that grows on bread
  and not a mildew that coats leaves.
examples:
- Sclerotinia can cause brown rot on the fruit.
- The sclerotinia spread through the orchard plants.
