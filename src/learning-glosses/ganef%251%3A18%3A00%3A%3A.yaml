simpleMeaning: A Yiddish word for a thief or a low, dishonest person, often used as a general insult
scope: A Yiddish word for a thief or scoundrel, also called ganof, gonif, and goniff; not a name for a
  person who makes an honest mistake.
examples:
- He called the cheating shopkeeper a ganef.
- The old man muttered 'ganef' at the thief who had taken his wallet.
