simpleMeaning: In baseball, the batting sequence for a team, naming who hits first, second, and so on.
scope: This is the batting order for a baseball team, not the golf score record, not a playing card, not
  an identity card, not a printed message or greeting, not thin cardboard, not a witty person, not a posted
  advertisement, not a visitor's greeting left behind, not a restaurant menu, not a computer circuit board,
  and not the verb senses.
examples:
- Both managers handed their cards to the umpire at home plate.
- The catcher's name was second on the card, right behind the leadoff hitter.
