simpleMeaning: Joining a phosphorus part to the B vitamin it comes from makes this form of vitamin B6.
scope: Also called pyridoxine 5'-phosphate, this is a vitamin B6 phosphate made by joining a phosphorus
  part to the B vitamin it comes from, not the B vitamin on its own.
examples:
- The B vitamin with a phosphorus part joined to it is pyridoxamine 5'-phosphate.
- Joining a phosphorus part to the B vitamin gives pyridoxamine 5'-phosphate.
