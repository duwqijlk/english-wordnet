simpleMeaning: a clever act that fools the eye and seems like real magic to people who do not know how
  it is done
scope: 'Also called magic, trick, illusion, deception, conjuration, conjuring trick, legerdemain, and
  magic trick: a clever act that seems like magic, not real magic power.'
examples:
- His thaumaturgy made a coin seem to vanish in the air.
- The crowd loved the thaumaturgy, though each act was only a clever trick.
