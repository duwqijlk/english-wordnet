simpleMeaning: An important early teacher of the Christian faith, or one who took that faith to a people.
scope: An important early teacher of Christianity or a Christian missionary to a people, also called an
  Apostolic Father.
examples:
- St Paul is called an Apostle of the Gentiles.
- The Apostle brought the new faith to the people of the far north.
