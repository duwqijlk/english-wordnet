simpleMeaning: Many farmed kinds, such as Concord grapes, began with this wild grape of the north-east
  United States
scope: A wild grape from the north-east United States, the parent of many farmed kinds; not the purplish-black
  wild grape with tough skins of the other fox grape sense.
examples:
- Fox grapes grow wild along the river in the north-east.
- The farmer said his Concord grapes came from the fox grape.
