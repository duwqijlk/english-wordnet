simpleMeaning: The quality of a thing that comes from the world of dreams and strange made-up things,
  and of being playful and odd
scope: The quality of a thing that comes from dreams and strange made-up things, not a true story and
  not a plain fact.
examples:
- The fantasticalness of the film comes from its talking animals and floating cities.
- Readers loved the fantasticalness of her tales of magic and strange lands.
