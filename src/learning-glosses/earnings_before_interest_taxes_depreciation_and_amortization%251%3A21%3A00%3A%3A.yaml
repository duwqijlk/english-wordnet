simpleMeaning: Money made with loan charges, state payments, wear, loss of value to take off; a sign of
  how well a firm does, watched by buyers chiefly in borrowed-money buyouts.
scope: 'Also called EBITDA: money made before interest, taxes, depreciation and amortization are taken
  off, a sign of how well a firm does, not money left after all costs.'
examples:
- Earnings Before Interest Taxes Depreciation and Amortization is watched by buyers in borrowed-money
  buyouts.
- The firm's Earnings Before Interest Taxes Depreciation and Amortization showed how well it did.
