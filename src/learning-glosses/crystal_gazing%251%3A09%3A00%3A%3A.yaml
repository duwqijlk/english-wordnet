simpleMeaning: Looking hard into a fortune teller's globe to bring up sights of things to come or far
  away.
scope: Looking into a fortune teller's globe for sights of the future, not ordinary fortune telling with
  cards and not daydreaming.
examples:
- Crystal gazing was her way of claiming to see the future.
- He tried crystal gazing and said he saw a distant city.
