simpleMeaning: a play thing made of a long flat piece on a middle support, with children at each end taking
  turns to go up and down
scope: 'Also called teeter, seesaw, dandle board, teeter-totter, teeterboard, and tilting board: a board
  that children ride up and down, not a swing and not a slide.'
examples:
- The teetertotter in the playground was the children's favorite toy.
- They took turns on the teetertotter after lunch.
