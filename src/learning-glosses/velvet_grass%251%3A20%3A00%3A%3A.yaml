simpleMeaning: Now growing wild in the United States and cut for animal feed, this tall grass of Europe
  lives for many years and has a soft stem.
scope: This tall grass of Europe has a soft stem, grows wild in the United States now, and is cut for
  animal feed.
examples:
- The velvet grass stood tall, its stems soft to the touch.
- Farmers cut velvet grass for feed.
