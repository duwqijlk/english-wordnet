simpleMeaning: the act of dropping one part of a rocket that is made of two or more parts that fall away
  in turn
scope: This is dropping a part of a rocket, not putting on a play and not a raised platform for work or
  shows.
examples:
- Staging happened two minutes after the rocket left the ground.
- The team planned the staging so the empty part would fall into the sea.
