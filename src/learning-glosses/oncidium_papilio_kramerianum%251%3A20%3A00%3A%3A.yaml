simpleMeaning: An orchid of South and Central America with blooms like those of its near kin but smaller,
  at times put in one group with its close kin.
scope: Also called Psychopsis krameriana; it is the orchid of South and Central America with blooms like
  those of Psychopsis papilio but smaller.
examples:
- Oncidium papilio kramerianum has smaller blooms than its near kin.
- The Oncidium papilio kramerianum in the pot came from Central America.
