simpleMeaning: the act of destroying something fully, so that nothing of it is left
scope: This means something is destroyed fully and nothing is left. It is not just harm or damage to one
  part of a thing.
examples:
- The fire led to the annihilation of the whole forest.
- They feared the annihilation of their city in the war.
