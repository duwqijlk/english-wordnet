simpleMeaning: The part of the stamen, the pollen-making part of a flower, that holds the pollen, usually
  carried on a stalk.
scope: For the pollen-holding part of a flower's stamen, usually carried on a stalk.
examples:
- The anther burst and dusted the bee with pollen.
- Each anther sat on a thin stalk.
