simpleMeaning: A rise in the heat of the body, often a sign of infection
scope: 'Also called fever, febricity, febrility and feverishness: a rise in the heat of the body, often
  a sign of infection, not a rise in the heat of the air around you.'
examples:
- The child had pyrexia after the infection set in.
- Pyrexia is often the first sign that the body is fighting an infection.
