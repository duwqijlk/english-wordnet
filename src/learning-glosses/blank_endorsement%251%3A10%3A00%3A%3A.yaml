simpleMeaning: A signed note on a paper promise to pay that names no one to be paid, so anyone holding
  it can be paid.
scope: A signed note on a paper promise to pay that names no one to be paid; endorsement in blank is another
  name for this sense, not a signed note naming a person to be paid and not a cheque.
examples:
- The blank endorsement made the note payable to whoever held it.
- With a blank endorsement, the paper could pass from hand to hand.
