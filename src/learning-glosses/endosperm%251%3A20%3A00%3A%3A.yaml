simpleMeaning: The food store round the young plant inside the seeds of plants that flower
scope: This is the food store round the young plant inside the seeds of plants that flower, not the young
  plant itself and not the seed coat.
examples:
- The endosperm feeds the young plant inside the seed.
- In wheat, the endosperm is the food store round the young plant.
