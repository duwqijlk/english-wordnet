simpleMeaning: a person whose job is to look after the land and grass of a large house, a park, or a sports
  field
scope: This is a worker who looks after land and grass outside, not a person who looks after a house inside
  and not a guard.
examples:
- The groundskeeper cut the grass before the football game.
- A groundskeeper waters the plants in the park each morning.
