senseId: 'transmission_shaft%1:06:00::'
synsetId: 04479798-n
simpleMeaning: A turning rod that carries turning power from the motor to the part that splits power between
  the driving wheels
scope: A turning rod in a car that passes power from the motor to the wheels, not a rod that lifts the
  car and not a rod that steers it.
examples:
- The mechanic replaced the broken transmission shaft under the car.
- A worn transmission shaft made the car shake when it moved.
