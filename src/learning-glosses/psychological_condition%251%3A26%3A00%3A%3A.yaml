simpleMeaning: In psychology, a set of thoughts and feelings whose main traits stay much the same even
  while they keep changing
scope: A set of thoughts and feelings whose main traits stay much the same even as it changes, also called
  mental condition, mental state, and psychological state; not a passing mood, and not a state of the
  body.
examples:
- Stress is a psychological condition that can stay with a person for weeks even as its strength rises
  and falls.
- The doctor said his psychological condition was steady in its main traits, though his mood shifted day
  to day.
