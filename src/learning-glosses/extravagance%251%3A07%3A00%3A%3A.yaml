simpleMeaning: a habit of spending far more money than you need to spend
scope: A person's habit of spending too much money; not the sense of going too far beyond right limits
  in behaviour, in what is likely, or in what is true.
examples:
- His extravagance left him with no money by the end of each month.
- Her extravagance showed in the costly gifts she bought every week.
