simpleMeaning: A computer network made up of internet sites that offer words, pictures, sound and moving
  pictures through a shared set of rules for sending pages.
scope: Also called the web or WWW; a computer network of internet sites offering words, pictures and sound,
  not the internet itself or a single site.
examples:
- She found the recipe on the World Wide Web.
- The World Wide Web links millions of sites.
