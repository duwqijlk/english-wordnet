simpleMeaning: A bad smell from the body that comes when a person does not wash
scope: Also called body odor and body odour, this is a bad smell from a body that has not been washed,
  not a smell from something a person ate.
examples:
- His B.O. was strong after the long trip without a bath.
- She noticed the B.O. in the crowded room.
