simpleMeaning: In theology, a special power of a god that works on the minds of people
scope: In theology, a god's special power over people's minds; it is not the act of taking air in, and
  not a sudden idea that helps solve a problem.
examples:
- Many believe the holy books were written under divine inspiration.
- In this teaching, inspiration is the way a god guides human minds.
