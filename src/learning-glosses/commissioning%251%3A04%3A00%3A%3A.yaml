simpleMeaning: the act of giving a person the right to do certain jobs
scope: This is giving a person the right to do certain jobs, also called commission; it is not money paid
  for selling something and not a group asked to study a question.
examples:
- The commissioning of the new officer gave him the right to lead the unit.
- Her commissioning by the city let her carry out checks on buildings.
