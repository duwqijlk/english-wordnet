simpleMeaning: a lid or other piece placed over an opening, especially a hole in the top of a container.
scope: This is not the outer board of a book or a natural layer lying over the ground; it is a lid for
  an opening.
examples:
- She put the cover back on the pan so the rice would stay warm.
- The drain cover had worked loose, leaving a hole in the pavement.
