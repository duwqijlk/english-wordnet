simpleMeaning: on a big ship with cloths hung across it, the front cloth that catches the wind and is
  set closest to the front mast, in front of it
scope: 'Also called a fore-topmast staysail: the innermost front jib on a large square-rigged ship, not
  a jib farther out from the mast and not a square sail.'
examples:
- The fore staysail filled with wind just ahead of the foremast.
- They hoisted the fore staysail on the big square-rigged ship.
