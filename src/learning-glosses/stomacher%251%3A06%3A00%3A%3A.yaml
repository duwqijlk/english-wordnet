simpleMeaning: a piece of clothing made of a stiff V-shaped panel worn over the chest and stomach in the
  1500s
scope: A stiff panel worn over the chest, not a corset and not a modern waistcoat.
examples:
- The queen wore a stomacher embroidered with gold thread.
- Her stomacher was stiff and shaped like a V.
