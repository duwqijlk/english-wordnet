simpleMeaning: able to soak up liquids and give them back when squeezed
scope: 'Another name for this sense is spongy: it soaks up liquid and gives it back when squeezed, not
  a thing that is merely soft and easy to squash.'
examples:
- The spongelike pad soaked up the water and gave it back when she squeezed it.
- The spongelike cloth soaked up the spill and gave the water back when it was squeezed.
