simpleMeaning: White or pink flowers that turn deep red at night mark this Chinese bush or small tree,
  grown far and wide, now at home in the southeastern United States.
scope: This is a bush or small tree with flowers that change colour at night, not the woolly plant of
  the same name.
examples:
- The cotton rose turns deep red at night.
- The cotton rose is grown far and wide.
