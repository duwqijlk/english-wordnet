simpleMeaning: to give germs to a living cell that is already sick with germs, or to a cell that already
  holds germs like them
scope: This is giving germs to a cell that already holds germs, not giving germs to a healthy cell and
  not a germ attack on the whole body.
examples:
- The virus can superinfect a cell that already holds a virus like it.
- Doctors watched the germ superinfect cells that were already sick.
