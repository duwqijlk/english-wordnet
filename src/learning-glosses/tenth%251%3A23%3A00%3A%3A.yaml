simpleMeaning: one part of a whole; the whole is split into ten parts and each part is the same size
scope: One of ten equal parts of a whole, not the person or thing in place number ten in a line or list.
examples:
- She gave a tenth of her pay to help her brother.
- A tenth of the cake was left after the party.
