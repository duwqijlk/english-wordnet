simpleMeaning: an evergreen shrub that spreads like a mat over North America and northern Eurasia, with
  small white flowers and red berries; its leaves turn red in autumn
scope: 'Also called common bearberry, creashak, hog cranberry, mealberry, mountain box, red bearberry,
  sand berry, sandberry, and wild cranberry: the evergreen mat-forming shrub with small white flowers
  and red berries whose leaves turn red in autumn.'
examples:
- Bear's grape spreads like a mat across the rocky ground.
- In autumn the bear's grape leaves turn bright red.
