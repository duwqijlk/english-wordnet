simpleMeaning: Round nut-like seeds that can be eaten grow on a lily of eastern North America with pale
  yellow blooms.
scope: Also called yanquapin, this lily of eastern North America bears pale yellow blooms, unlike the
  seeds alone with the taste of a chinquapin.
examples:
- The water chinquapin opened pale yellow blooms.
- Water chinquapins of eastern North America bear round nut-like seeds that can be eaten.
