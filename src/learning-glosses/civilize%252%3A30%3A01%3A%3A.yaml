simpleMeaning: to bring people out of a wild, rough way of life into a settled one with laws, schools,
  and towns
scope: To bring people from a rough, wild way of life to a settled one; not teaching good taste, which
  is the other civilize sense.
examples:
- The wild child found wandering in the forest was gradually civilized.
- The newcomers worked to civilize the remote valley.
