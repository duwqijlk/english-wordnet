senseId: 'negativity%1:07:00::'
synsetId: 05175145-n
simpleMeaning: a way of often doubting things and, in an unpleasant way, saying no to, fighting against,
  or refusing to accept ideas or orders from others
scope: 'Also called negativeness and negativism: a person''s habit of doubting and saying no, not the
  pull of an atom in chemistry and not the character of an electric pole.'
examples:
- His negativity made every new idea seem like a bad one.
- The team's negativity slowed down every plan the manager suggested.
