simpleMeaning: A part of a church round the altar, set apart for the priests and the singers, and often
  shut in by a low fence or rail.
scope: Also called sanctuary or chancel, this is the part of a church round the altar set apart for the
  clergy and choir.
examples:
- The choir stood in the bema during the service.
- A low rail shut off the bema from the rest of the church.
