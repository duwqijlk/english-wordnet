simpleMeaning: a water animal with no tongue that lives almost all its life in water, found in Africa,
  Panama and the north of South America
scope: A water animal with no tongue, found in Africa, Panama and the north of South America; not a land
  animal, and not a water animal that has a tongue.
examples:
- The tongueless frog spends almost its whole life under water.
- We saw a tongueless frog in a pond in Panama.
