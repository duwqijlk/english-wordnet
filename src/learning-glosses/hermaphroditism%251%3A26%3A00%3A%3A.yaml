simpleMeaning: A state present from birth in which the outer sex parts and the inner sex organs have both
  male and female traits
scope: This is a state present from birth in which the outer sex parts and the inner sex organs have both
  male and female traits, also called hermaphrodism, and not a state that comes on later in life or one
  with only male or only female traits.
examples:
- Hermaphroditism affects both the outer and inner sex organs.
- The animal was born with hermaphroditism, having both male and female sex organs.
