simpleMeaning: Relating to bodily comfort and health rather than to the mind or feelings.
scope: This is the adjective for bodily welfare, not the adjective for worldly rather than spiritual interests,
  not the adjective for being made of matter, not the adjective for being directly relevant to a court
  case, not the adjective for having physical form, not the adjective for something real rather than imagined,
  not the noun for a physical substance, not the noun for information used to make something, not the
  noun for woven cloth, not the noun for supplies needed for a task, and not the noun for a suitable candidate.
examples:
- The charity focuses on material needs such as food, shelter, and medical care.
- Her material welfare improved once the family had steady housing.
