simpleMeaning: electronic equipment, a device that lets computers join each other through a telephone
  line
scope: A device that joins computers through a telephone line, not a computer itself and not a telephone.
examples:
- The modem by the phone line let us connect the computer.
- When the modem stopped working, the computers could no longer join each other.
