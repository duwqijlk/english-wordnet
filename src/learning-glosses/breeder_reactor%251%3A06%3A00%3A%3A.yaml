simpleMeaning: a machine that makes power from atoms and makes more new fuel than the fuel it uses up
scope: A machine that makes power from atoms and makes more new fuel than it uses up, not a machine that
  burns up all its fuel and not a coal power plant.
examples:
- The breeder reactor makes more fuel than it burns.
- Engineers built a breeder reactor to make use of the extra fuel.
