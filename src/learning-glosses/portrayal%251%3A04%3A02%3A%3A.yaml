simpleMeaning: acting as a person in a play, showing who that person is by words, actions and movements
  of the body
scope: This is acting a part on stage, also called characterization and enactment; it is not a drawing,
  painting or picture of a person.
examples:
- Her portrayal of the queen held the whole theatre quiet.
- His portrayal of the old king used a slow voice and small hand movements.
