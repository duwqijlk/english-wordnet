simpleMeaning: a tool that takes signals that rise and fall without breaks and turns them into number
  form
scope: A tool that turns signals that rise and fall without breaks into number form, also called an analog-digital
  converter, an analog-to-digital converter or a digitiser, and not a tool that stores music or one that
  prints pictures.
examples:
- The digitizer changed the voice signal into numbers for the computer.
- She plugged the sensor into a digitizer before the test began.
