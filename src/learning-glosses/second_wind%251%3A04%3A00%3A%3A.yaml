simpleMeaning: the point during long hard exercise when breathing gets easy again after being out of breath
scope: The moment in long hard exercise when breathing gets easy again after being out of breath; not
  the first tired feeling and not a rest.
examples:
- She got her second wind halfway through the race and ran faster.
- After ten minutes of swimming, he found his second wind and kept going.
