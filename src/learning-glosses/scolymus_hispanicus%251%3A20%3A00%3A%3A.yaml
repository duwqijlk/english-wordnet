scope: Also called the Spanish oyster plant; a golden thistle grown for its sweet edible roots and stalks,
  whose yellow flowers stand in for saffron.
examples:
- Scolymus hispanicus grew in the kitchen garden for its sweet roots.
- We used the yellow flowers of Scolymus hispanicus in place of saffron.
