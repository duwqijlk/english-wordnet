simpleMeaning: in baseball, a throw that goes very near the batter on purpose
scope: A ball thrown on purpose very near the batter; not a windstorm, and not a cloth for cleaning dust.
examples:
- The pitcher threw a duster at the batter.
- He ducked as the duster flew past his head.
