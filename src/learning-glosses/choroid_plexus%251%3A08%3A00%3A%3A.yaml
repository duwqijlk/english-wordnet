simpleMeaning: a net of blood vessels in the hollow spaces of the brain that keeps the pressure of the
  fluid inside steady
scope: A net of blood vessels in the hollow spaces of the brain that keeps the pressure of the fluid inside
  steady, also called plexus choroideus; not a nerve and not a part of the skull.
examples:
- The choroid plexus keeps the pressure of the fluid in the brain steady.
- Damage to the choroid plexus can change the pressure inside the head.
