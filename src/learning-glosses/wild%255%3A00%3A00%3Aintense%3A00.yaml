simpleMeaning: In colors or sounds, very bright and striking or very loud.
scope: Used of colors and sounds that are strikingly bright or loud, not a person's extreme emotion and
  not a bleak, remote place.
examples:
- The market stalls were painted in wild colors that clashed cheerfully.
- A wild shout came from the back of the crowd.
