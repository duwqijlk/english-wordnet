simpleMeaning: A child's four-wheeled toy cart, sometimes used to roll downhill without being pushed.
scope: This is a child's four-wheeled toy cart, sometimes used to roll downhill without being pushed;
  wagon is another name for this sense, not a baby carriage and not a work cart for carrying loads.
examples:
- The children piled into the coaster wagon and rolled down the hill.
- He pulled his coaster wagon full of toys behind him.
