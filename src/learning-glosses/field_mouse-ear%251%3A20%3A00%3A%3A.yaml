scope: A plant that grows in thick bunches and lives for many seasons in the cool lands of the north;
  also called field chickweed, not a plant that lives for one season only and not a chickweed of warm
  lands.
examples:
- Field mouse-ear spreads in thick bunches across the cool meadow.
- The field mouse-ear comes back year after year in the north garden.
