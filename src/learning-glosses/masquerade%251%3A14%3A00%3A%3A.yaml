senseId: 'masquerade%1:14:00::'
synsetId: 08270371-n
simpleMeaning: a party where guests wear clothes that make them look like other people or characters,
  and coverings over their faces
scope: Also called mask and masque, this is a party where guests wear special clothes and face coverings.
  It is not a set of clothes worn to hide who you are, and not the act of taking part in such a party.
examples:
- They held a masquerade for the New Year, and every guest wore a mask.
- At the masquerade, she danced in a long red dress and a gold mask.
