simpleMeaning: An East Indian tree grown far and wide in the hot lands for its sweet-smelling seed; it
  gives two spices, nutmeg and mace.
scope: This is the tree that gives nutmeg and mace, not the spices themselves; also called nutmeg and
  nutmeg tree.
examples:
- Myristica fragrans gives two spices, nutmeg and mace.
- Myristica fragrans grows far and wide in the hot lands.
