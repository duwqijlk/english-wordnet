simpleMeaning: To set by likeness or agreement.
scope: This sense is to set by likeness or agreement, unlike the sense for a tuneful state of things in
  general, and of their marks, as of colours and sounds, a fitting of parts with each other and with the
  whole, unlike the sense for the fixing of word endings by their ties to other words, and unlike the
  sense for setting the words of a text to make a word-list.
examples:
- They concord the terms, setting them by agreement.
- They concord the parts.
