simpleMeaning: A metal conductor fixed at a high point and leading to the ground, protecting a building
  from destruction by lightning.
scope: Also called a lightning conductor, this metal piece on a tall place gives a flash a path down to
  the ground and guards the building from being smashed.
examples:
- The lightning rod on the church tower carried the flash safely into the ground.
- A lightning rod stands on the roof of the house.
