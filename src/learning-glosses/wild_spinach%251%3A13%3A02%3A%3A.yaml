simpleMeaning: green leaves picked outdoors where they grow on their own and eaten in place of the garden
  leaf used in cooking
scope: Green leaves picked outdoors and eaten in place of the garden leaf, not the plant they come from
  and not the garden leaf itself.
examples:
- She gathered wild spinach along the path and cooked it like the garden leaf.
- The wild spinach we picked made a good dish in place of the leaves from the shop.
