simpleMeaning: not rented out, and with no person living or working in it as a renter
scope: 'Also called untenanted: a house or land that is not rented out and has no renter in it, not a
  seat that is empty for a moment and not a person who is not busy.'
examples:
- The flat stayed unoccupied for a year because no tenant signed a lease.
- They own several unoccupied houses that they hope to rent out.
