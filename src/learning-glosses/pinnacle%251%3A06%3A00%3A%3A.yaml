simpleMeaning: In building, a thin, tall, pointed part standing at the top of a tower or of a buttress
  (a strong part built against a wall to hold it up)
scope: This is the pointed top part of a building; it is not the act of putting such a part on top of
  something, and not the act of lifting something up high.
examples:
- Stone pinnacles rose above the roof of the old church.
- Each tower of the castle ends in a narrow pinnacle.
