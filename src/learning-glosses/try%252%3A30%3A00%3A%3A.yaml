simpleMeaning: to heat fat or lard until it turns liquid so that impurities can be drawn off
scope: This is heating fat or lard to purify it, not making an effort, not testing something's quality,
  not taking a small amount of food to taste it, not putting on a garment to check the fit, not judging
  a court case, and not causing pain or strain.
examples:
- They tried the fat in a large iron pot over the fire.
- The recipe says to try the lard slowly until the impurities can be skimmed off.
