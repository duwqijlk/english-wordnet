simpleMeaning: a harmless European animal with a bright yellow band round its neck, common in England
scope: This is a harmless European animal with a bright yellow band round its neck; grass snake and ring
  snake are other names for it, not the North American ringneck snake and not a venomous adder.
examples:
- A ringed snake slipped through the grass beside the pond.
- We saw a ringed snake basking on the bank in England.
