senseId: 'epoch%1:28:00::'
synsetId: 15273375-n
simpleMeaning: A time counted from one fixed point or event, or known for a character of its own.
scope: 'Also called era: a span of time set apart by its own character or by the point from which it is
  counted, not a fixed date used in astronomy and not a unit of geological time.'
examples:
- The steam age was an epoch of great change.
- His reign marked a new epoch in the country's history.
