simpleMeaning: a way courts decide cases by using past court decisions, not rules written down by a government
scope: This is how courts decide cases from past court decisions; case law and precedent are other names
  for this sense, and it is not a set of written rules passed by a government.
examples:
- Common law grew out of the unwritten laws of England.
- The judge decided the case by common law, looking at earlier decisions.
