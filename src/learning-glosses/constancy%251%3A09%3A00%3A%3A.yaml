simpleMeaning: In psychology, the way things you see still seem much the same to you, even when the light,
  distance, or other seeing conditions change a lot
scope: This sense, also called perceptual constancy, is about seeing things as the same when conditions
  change. It is not faithfulness to a person, which is another sense of this word.
examples:
- Thanks to constancy, a coin still looks round even when you see it from the side.
- Constancy helps you know a white wall is still white in dim light.
