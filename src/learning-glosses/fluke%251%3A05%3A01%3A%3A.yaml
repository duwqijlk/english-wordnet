senseId: 'fluke%1:05:01::'
synsetId: 02161271-n
simpleMeaning: one of the two flat side parts at the end of the tail of a whale, dolphin, or other sea
  animal of that group
scope: This is one part of a sea animal's tail, not the small flat worm that lives inside animals, not
  the flat part of an anchor, and not a sharp part on a weapon.
examples:
- The whale lifted one fluke out of the water as it dived.
- The dolphin's tail ends in two wide flukes.
