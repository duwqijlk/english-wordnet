simpleMeaning: one of the two points where the line the Earth turns on meets the round sky above
scope: One of the two points where the Earth's line of spin meets the sky, not the point where it meets
  the ground and not an end of a magnet.
examples:
- The north pole of the sky stays fixed above the horizon.
- The stars seem to turn round the pole of the sky.
