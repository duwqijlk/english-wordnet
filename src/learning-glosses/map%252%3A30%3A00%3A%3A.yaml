simpleMeaning: To set up a rule pairing each element of one set with an element of another set.
scope: 'This is the mathematics sense: linking the elements of one set to those of another by a rule;
  it is not drawing a geographical map, and not planning something in detail.'
examples:
- The teacher showed how to map each number in one set onto its double in another.
- Mathematicians map points on a plane to points on a sphere.
