simpleMeaning: said of a machine that will not work until money in metal discs is put in first
scope: This is said of a machine that will not work until money in metal discs is put in first; not a
  machine that takes paper money and not one that works for free.
examples:
- The coin-operated telephone needed money in metal discs before it would work.
- She used a coin-operated washer at the laundromat.
