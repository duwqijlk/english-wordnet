simpleMeaning: a door for staff to use, or for bringing in goods and taking out waste
scope: A way into a building for staff and goods, also called a service door and a service entrance; not
  the main door used by guests.
examples:
- The cook came in through the servant's entrance with the morning bread.
- They left the servant's entrance open while the men carried out the rubbish.
