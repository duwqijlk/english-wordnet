simpleMeaning: So the hearer thinks well of you, you bring up people who matter in a light way as you
  talk
scope: Talk that brings up people who matter to impress the hearer, not talk about friends and not a plain
  list of people you know.
examples:
- His name-dropping at dinner bored everyone.
- She went in for name-dropping to win the room over.
