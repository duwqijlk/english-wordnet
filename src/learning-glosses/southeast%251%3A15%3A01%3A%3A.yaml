simpleMeaning: the part of a country, a region, or a city that lies in the corner between south and east
scope: A place in the south-eastern part of a country, region, or city, not the compass point and not
  the direction of travel.
examples:
- The southeast of the country is warmer than the north.
- They live in the southeast of the city.
