simpleMeaning: any plant or flower that belongs to Oxalis, a group of plants that are closely linked to
  each other
scope: Any Oxalis plant or flower; not the sorrel grown for its large sour leaves for salads and sauces,
  and not the coarse weedy sorrel with long deep roots.
examples:
- The sorrel in the garden is an Oxalis, with small leaves like a heart.
- She bought a sorrel plant with yellow flowers for her home.
