simpleMeaning: A bird from Australia, greenish-yellow in colour, that lives in trees and sings, and feeds
  chiefly on the fruit that gives it its name and on other fruits.
scope: This greenish-yellow Australian bird feeds chiefly on figs, and also on other fruits.
examples:
- A fig-bird sang in the tree above the garden.
- We watched a fig-bird eat fruit in the orchard.
