simpleMeaning: to try to win someone's favor by acting too weak before them and praising them too much
scope: Also called fawn, toady, truckle and bootlick. This is acting weak and praising someone too much
  to win their favor, not bending the knees and bowing, and not the old Chinese custom of touching the
  ground with the forehead.
examples:
- He is always kowtowing to his boss to win a better job.
- She refused to kowtow to the manager, even when he was angry.
