simpleMeaning: A Malaysian feather palm whose base is thickly covered in fibers; it gives a sweet sap
  used in wine, and its trunk pith yields sago.
scope: The palm itself; gomuti is another name for the same tree, and this is not the wine or sago made
  from it.
examples:
- The gomuti palm is tapped for sap that is fermented into wine.
- Sago is made from the pith of the gomuti palm.
