simpleMeaning: A drug sold under this trade name that blocks the virus from copying itself, used to treat
  AIDS and HIV.
scope: Also called delavirdine; a drug that blocks the virus from copying itself, used to treat AIDS and
  HIV, not a drug that kills the virus outright and not a drug for pain.
examples:
- Rescriptor is one of the drugs used to treat HIV.
- The doctor added Rescriptor to the patient's AIDS treatment.
