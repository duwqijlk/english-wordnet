simpleMeaning: in law, a proceeding in which a party asks a higher court to examine a lower court's ruling
  and reverse it or order a new trial
scope: This is a legal challenge to a court's decision, not an urgent or earnest request, not the quality
  that makes something attractive, not a request for money, and not the verb for asking earnestly or citing
  an authority.
examples:
- The company filed an appeal against the ruling.
- The appeal was rejected by the higher court.
