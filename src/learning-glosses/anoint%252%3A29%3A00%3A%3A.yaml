simpleMeaning: To rub oil or ointment on a person, often as part of a religious act of blessing
scope: To rub oil on a person, often in a religious blessing; oil is another name for this sense, not
  simply to wash or clean a person.
examples:
- The priest anointed the sick man with oil.
- They anointed the new king in a holy ceremony.
