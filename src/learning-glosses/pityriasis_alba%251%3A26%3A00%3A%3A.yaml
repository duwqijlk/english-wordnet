simpleMeaning: A common skin trouble, most often in children or young adults, that leaves round pale patches
  where the skin has lost its colour.
scope: A common skin trouble, most often in children or young adults, that leaves round pale patches;
  not vitiligo and not eczema.
examples:
- The doctor said the pale patches were pityriasis alba.
- Pityriasis alba often fades on its own in children.
