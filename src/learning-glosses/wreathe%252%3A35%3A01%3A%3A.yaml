simpleMeaning: to put rings of flowers or leaves on a place or thing to make it look nice
scope: To make a place or thing look nice by putting rings of flowers or leaves on it, not to form something
  into a ring shape itself.
examples:
- She wreathed the grave with white flowers.
- Workers wreathed the hall door in green leaves for the ceremony.
