simpleMeaning: a flying move in which a plane climbs steeply while turning to gain height and change course
scope: A steep climbing turn made to gain height while changing course, not a level turn and not a dive.
examples:
- The pilot pulled into a chandelle to gain height and turn back.
- A chandelle lets a plane climb steeply while changing direction.
