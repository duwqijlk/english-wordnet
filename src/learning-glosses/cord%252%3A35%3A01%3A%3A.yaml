simpleMeaning: to tie something up or hold it together with a thin line made of twisted threads
scope: The act of tying with a thin twisted line, not the line itself, not a power wire for the home,
  and not cloth with raised lines down it.
examples:
- Workers corded the boxes together before loading them onto the truck.
- He corded the sticks into one tight bundle.
