  flat along the ground
scope: This sense names a plant that lives for many years and grows flat along the ground on sandy hills
  by the sea, also called railroad vine.
examples:
- Beach morning glory spread flat over the sandy hill.
- We saw beach morning glory growing on the dunes by the sea.
