simpleMeaning: about, like, or bringing to mind a long piece of music for a large group of players
scope: A describing word for music that is about, like, or makes you think of a long piece of music for
  a large group of players; not the name of the piece of music itself.
examples:
- The symphonic music filled the hall with rich, full sound.
- He wrote a symphonic piece for a large orchestra.
