senseId: 'compatibility%1:07:00::'
synsetId: 04720011-n
simpleMeaning: the power to live or work together well, with no bad feeling or trouble between the parts
  or people
scope: This sense is about living or working together well with no trouble; it does not mean being the
  same or being alike.
examples:
- The compatibility of the two programs means they work well together.
- Their compatibility helped them work as a good team.
