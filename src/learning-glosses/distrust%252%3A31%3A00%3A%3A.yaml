simpleMeaning: to see a person as someone you cannot trust, to doubt what they say and do, and to have
  no faith in them
scope: 'Also called suspect and mistrust: a doubt about a person''s honesty, not a fear of danger and
  not a dislike of them.'
examples:
- She distrusts her stepmother and will not tell her anything.
- He distrusts the salesman and checks every word he says.
