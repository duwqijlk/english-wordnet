simpleMeaning: Tunes made to bring pictures or past events to mind for the hearer
scope: 'Also called program music: tunes that bring pictures or events to mind, not tunes made just for
  their sound and not a song with words.'
examples:
- The orchestra played programme music about a river journey.
- Her favourite piece of programme music paints a village fair.
