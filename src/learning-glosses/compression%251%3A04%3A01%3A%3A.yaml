simpleMeaning: putting information into a code so that fewer bits (small pieces of computer data) or less
  bandwidth (how much can be sent at once) are needed
scope: This is about putting computer information into a smaller code to send or keep; it is not pressing
  a thing to make it smaller in size.
examples:
- Data compression lets the video file use far fewer bits.
- With compression, the large file could be sent in seconds.
