simpleMeaning: To lift a person or thing high with praise, as if up to the sky or to heaven
scope: To lift a person or thing high with praise, as if up to the sky or to heaven, not to lift it with
  the hands and not to praise it in a plain way.
examples:
- Poets enskied their kings to the skies.
- The crowd enskied the young singer with praise.
