simpleMeaning: a lasting stretch of abnormal weather across a large area, especially when temperatures
  are far from normal
scope: A spell of abnormal weather over a wide area, not a ridge moving on water, a hand gesture, or a
  surge of people.
examples:
- A heat wave kept the city above forty degrees for a week.
- The cold wave ruined the orange crop.
