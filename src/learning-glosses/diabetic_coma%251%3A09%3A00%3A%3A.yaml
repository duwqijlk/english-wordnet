senseId: 'diabetic_coma%1:09:00::'
synsetId: 05688264-n
simpleMeaning: a deep sleep a person cannot wake from, that can come when the illness that stops the body
  using sugar well is not treated well
scope: This is a deep sleep a person cannot wake from, brought on when the sugar illness is not treated
  well, not a sleep after a blow to the head and not a faint that passes in minutes.
examples:
- A diabetic coma can follow days of high blood sugar without care.
- He fell into a diabetic coma after missing his insulin for a week.
