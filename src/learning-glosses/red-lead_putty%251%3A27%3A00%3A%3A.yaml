simpleMeaning: To seal the joints of pipes, a paste like clay is made by stirring metal powders, one white
  and one rusty brown, into hot oil from flax seed.
scope: A paste for sealing pipe joints, made with metal powders in hot oil, not the soft paste used to
  fix glass in window frames.
examples:
- The red-lead putty had set hard round the fitting.
- The plumber pressed red-lead putty round the pipe joint to seal it.
