simpleMeaning: a roughly triangle-shaped flat space that sits between two side-by-side arches and the
  flat top above them
scope: A roughly triangle-shaped flat space between two arches and the flat top above them, also called
  spandrel; not the arch itself, and not the opening under the arches.
examples:
- The spandril was decorated with a small carved rose.
- Workmen cleaned the spandril between the arches of the old bridge.
