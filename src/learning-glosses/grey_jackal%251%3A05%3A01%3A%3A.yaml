simpleMeaning: A wild dog-like animal that lives in the dry lands of North Africa and is close kin to
  the golden dog-like animal and the pale wolf
scope: This is a wild dog-like animal of the dry lands of North Africa; jackal is another name for this
  sense, not the golden jackal and not the grey wolf.
examples:
- A grey jackal crossed the dry plain at dusk.
- The grey jackal hunts at night in the deserts of North Africa.
