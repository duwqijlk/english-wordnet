simpleMeaning: To avoid work or other things you must do, for example by pretending to be ill when you
  are not
scope: Another name for this sense is skulk. It is about avoiding things you must do, for example by pretending
  to be ill; it is not about being ill in truth and needing rest.
examples:
- He malingered by telling his boss he was ill, though he felt fine, so that he could miss work.
- She spent three days malingering, pretending to be ill to stay away from the duties she had to do.
