simpleMeaning: With pale silky hair and pink plates on its head and neck, this very small armadillo comes
  from Argentina.
scope: Also called chlamyphore, fairy armadillo, and pichiciego, this very small armadillo is the Argentine
  kind with pale silky hair and pink plates on its head and neck.
examples:
- A pichiciago crossed the ground in Argentina.
- Pink plates cover the head and neck of the pichiciago.
