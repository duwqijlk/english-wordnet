simpleMeaning: the branch of the study of rocks that deals with oil and gas fields of money value, where
  they are found and how they are got out
scope: A branch of the study of rocks that deals with oil and gas fields of money value; not the study
  of rocks in general and not the work of drilling for oil.
examples:
- He studied petroleum geology to learn where oil and gas lie under the ground.
- Petroleum geology guides the search for new oil and gas fields.
