simpleMeaning: A spot that breaks out on a wet inner skin, like the inside of the mouth, as a sign of
  a sickness.
scope: A spot that breaks out on a wet inner skin, like the inside of the mouth, as a sign of a sickness,
  also called enanthema; not a spot on outer skin and not a cut.
examples:
- The doctor saw an enanthem inside the child's mouth.
- An enanthem can be a sign of measles.
