simpleMeaning: Only taking in what can be seen on the surface, without going deep into feelings or ideas
scope: Taking in only what shows on the surface, without deep thought or feeling; not the sense of doing
  something in a hasty, careless way.
examples:
- His superficial knowledge of the subject fooled no one.
- She gave only a superficial answer to a deep question.
