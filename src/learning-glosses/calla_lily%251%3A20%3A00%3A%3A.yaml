simpleMeaning: Grown in many places for show, this plant of South Africa has a showy pure white leaf-like
  part round a yellow spike.
scope: Also called a calla and an arum lily, this plant of South Africa is grown in many places for show
  and has a showy pure white leaf-like part round a yellow spike.
examples:
- She planted a calla lily in the garden.
- The calla lily's white spathe opened round its yellow spike.
