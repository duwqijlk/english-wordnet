simpleMeaning: A harmful growth in the womb that starts in the skin of the sac round the unborn child
scope: A harmful growth in the womb that starts in the skin of the sac round the unborn child, not a harmless
  lump and not a growth elsewhere in the body.
examples:
- Trophoblastic cancer starts in the tissue that forms the sac round the unborn child.
- Doctors found trophoblastic cancer in the womb after the pregnancy.
