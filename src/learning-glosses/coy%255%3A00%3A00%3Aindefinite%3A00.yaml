simpleMeaning: Holding back from a clear answer that would bind you, in a marked way, often in play or
  in a way that annoys
scope: Holding back from a clear answer in a marked way, not shy in a sweet way and not simply refusing
  to speak.
examples:
- The politician was coy about his plans for the election.
- She gave a coy smile and would not say where she was going.
