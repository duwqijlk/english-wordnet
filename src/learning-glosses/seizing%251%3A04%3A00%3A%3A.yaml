simpleMeaning: the act of taking hold of something and holding it tight with your hands, or with the long
  thin arms of a sea animal
scope: 'Also called grasping: taking hold of something and holding it tight, not taking something by force
  and not a sudden fit or attack.'
examples:
- His seizing of the branch kept him from slipping off the ledge.
- The seizing of the rope was firm and quick.
