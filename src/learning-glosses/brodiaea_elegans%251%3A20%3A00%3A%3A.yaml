simpleMeaning: A flowering plant with a flat-topped bunch of violet or blue-violet flowers on top of a
  stalk with no leaves; from northern Oregon to southern California.
scope: 'Also called elegant brodiaea: a flowering plant with a flat-topped bunch of violet or blue-violet
  flowers on a stalk with no leaves, not a tall shrub and not a flower with leaves up its stalk.'
examples:
- Brodiaea elegans opened its violet flowers on a bare stalk.
- We found Brodiaea elegans growing from northern Oregon to southern California.
