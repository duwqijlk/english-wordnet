simpleMeaning: to hunt or shoot a small bird with a long straight beak that lives in wet ground
scope: To hunt or shoot this bird, not the bird itself, and not to shoot at people from a hidden place.
examples:
- The hunters snipe in the wet fields in the early morning.
- He learned to snipe with his father near the wet ground by the river.
