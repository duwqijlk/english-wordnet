simpleMeaning: to sing by quickly changing again and again between your normal voice and a very high voice
scope: 'Also called warble and descant: singing that moves up and down in voice range, not the noun sense
  that is the cry or song made in this way.'
examples:
- She yodeled across the valley, her voice rising and falling.
- The singer yodeled a short song in the mountains.
