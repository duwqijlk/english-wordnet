simpleMeaning: The curved pad of gristle in the knee is taken out in this operation
scope: An operation that takes out the curved pad of gristle in the knee, not the removal of the whole
  knee and not a repair of the pad.
examples:
- He had a meniscectomy after the injury to his knee.
- The meniscectomy took out the torn pad in her knee.
