simpleMeaning: 'Change its note by pulling its top skin tighter or leaving it looser: this big half-ball
  drum of brass or copper gives a deep boom.'
scope: Also called kettle, kettledrum, timpani, and tympani, this big half-ball drum of brass or copper
  is tuned by tightening or loosening its top skin.
examples:
- The tympanum sounded low and deep.
- He struck the tympanum softly.
