simpleMeaning: to tighten the muscles in the belly during the birth of a baby, to help the baby come out
scope: 'Another name for bear down: tightening the belly muscles in childbirth to help the baby come out,
  not carrying something heavy or beating someone.'
examples:
- The midwife told her when to overbear during each push.
- She learned how to overbear to help the baby come out.
