simpleMeaning: Something that juts from the face around it.
scope: Something that juts from the face around it; also called bump, bulge, swelling, hump, jut, prominence,
  protrusion, protuberance, or extrusion; not a sick growth or swelling on some part of the body.
examples:
- The excrescence on the wall caught the light.
- Their excrescence showed plainly under the coat.
