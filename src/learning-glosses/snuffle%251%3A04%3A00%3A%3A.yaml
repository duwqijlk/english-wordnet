simpleMeaning: hard breathing through the nose, as when the nose is blocked
scope: 'Also called a sniffle: hard breathing through a blocked nose, not the verb acts of snuffing mucus
  up or crying with a snuffle.'
examples:
- His snuffle filled the quiet room as he tried to sleep with a cold.
- She heard a loud snuffle from the man with the blocked nose.
