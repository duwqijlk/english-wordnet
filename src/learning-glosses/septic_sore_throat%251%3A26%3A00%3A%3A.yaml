simpleMeaning: an infection of the back of the mouth and the small glands there, caused by a germ called
  streptococcus
scope: An infection of the back of the mouth and the small glands there, caused by a germ, also called
  strep throat, streptococcal sore throat, streptococcus tonsilitis and throat infection; not a cold and
  not a sore throat from a virus.
examples:
- The child had septic sore throat and needed medicine to kill the germ.
- Septic sore throat made it hurt to swallow.
