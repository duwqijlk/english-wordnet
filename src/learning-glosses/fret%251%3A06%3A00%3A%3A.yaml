simpleMeaning: A small metal bar across the flat part of a stringed instrument's neck; pressing a string
  down on it gives a note of the wanted pitch
scope: A metal bar on a stringed instrument that sets the pitch of a note; not the ornamental pattern
  called a fret.
examples:
- He pressed the string against the fret to play the note.
- The guitar's frets were worn smooth from years of playing.
