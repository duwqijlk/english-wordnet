simpleMeaning: an illness of the gut caused by tiny living things in dirty food or water, marked by loose
  stools, feeling sick, gas, and pain in the belly
scope: An illness of the gut from tiny living things in dirty food or water, marked by loose stools, sickness,
  gas, and belly pain; not ordinary travel sickness and not a stomach ulcer.
examples:
- Giardiasis spread through the camp after people drank water from the stream.
- She had giardiasis for two weeks, with loose stools and pain in her belly.
