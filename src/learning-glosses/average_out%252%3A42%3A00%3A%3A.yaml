simpleMeaning: To add up to a middle figure in the end, with no gain and no loss
scope: To come to a middle figure in the end, with no gain or loss, with average as another name for this
  sense; not working out the mean of a set of numbers.
examples:
- The number of hours I work per week averages out to 40.
- Gains and losses average out over the year.
