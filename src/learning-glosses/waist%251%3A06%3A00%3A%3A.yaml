simpleMeaning: the narrow part of a shoe that joins the heel to the wide part of its bottom
scope: This is a part of a shoe, not the narrow part of a person's body between the ribs and hips.
examples:
- The waist of this shoe is narrow and sits just in front of the heel.
- The boot has a thin waist between its heel and its wide front part.
