simpleMeaning: A one-year climber of tropical America, with red flowers, at times white, and finely cut
  leaves, now growing wild in the United States and elsewhere.
scope: Also called cypress vine, star-glory, Indian pink, and Ipomoea quamoclit; a one-year climber of
  tropical America with red flowers and finely cut leaves.
examples:
- The Quamoclit pennata climbs the fence with red flowers.
- A Quamoclit pennata grew wild by the road with finely cut leaves.
