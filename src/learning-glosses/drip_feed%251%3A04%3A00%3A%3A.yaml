simpleMeaning: putting a liquid such as blood or salty water or plasma into the body, one drop at a time
scope: A liquid put into the body one drop at a time, not a meal eaten by mouth and not a fast flow from
  a tap.
examples:
- The nurse set up a drip feed for the patient.
- He was kept alive by a drip feed of plasma.
