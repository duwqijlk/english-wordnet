simpleMeaning: one of many trees or low woody plants that shed their leaves each year, of the group called
  Salix
scope: One of many trees or low woody plants of the group called Salix, not the machine that opens and
  cleans raw cloth fibres.
examples:
- A willow grows beside the river.
- The willows by the pond shed their leaves in autumn.
