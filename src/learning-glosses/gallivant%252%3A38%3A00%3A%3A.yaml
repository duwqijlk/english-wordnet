simpleMeaning: to go from place to place with no clear plan, just to have fun
scope: Also called gad, this is going about for fun with no plan, not travelling to a set place for work
  or to do a job.
examples:
- They spent the summer gallivanting around small towns.
- He gallivanted from beach to beach all week, just for fun.
