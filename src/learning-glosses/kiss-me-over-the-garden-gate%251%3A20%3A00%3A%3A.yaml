simpleMeaning: An annual — a plant that lives for one season — with broad oval leaves and slender hanging
  spikes of crimson flowers; from southeast Asia and Australia and naturalized in North America.
scope: Another name for prince's-feather, princess feather, prince's-plume and Polygonum orientale; not
  love-lies-bleeding.
examples:
- Kiss-me-over-the-garden-gate has broad oval leaves and slender crimson flower spikes.
- In parts of North America, kiss-me-over-the-garden-gate now grows wild.
