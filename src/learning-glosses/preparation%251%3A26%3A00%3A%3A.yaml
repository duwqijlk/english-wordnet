simpleMeaning: the state of being ready for use or for action, especially for military action
scope: The state of being ready for use or action, especially military action, not making food ready by
  heating it, not a thing made to a set plan, and not school work done at home.
examples:
- The army's preparation for battle was complete and the men were ready to move.
- Their preparation for the trip was finished, so they were ready to leave at once.
