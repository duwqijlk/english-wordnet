simpleMeaning: A heart drug used to treat deadly out-of-time beats, though it can raise the chance of
  sudden death in people who have had a heart attack
scope: A heart drug for deadly out-of-time beats, also called encainide, and not a drug for high blood
  pressure or a painkiller.
examples:
- Enkaid steadied his heartbeat after the attack.
- The doctor warned that Enkaid can raise the risk of sudden death.
