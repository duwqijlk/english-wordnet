simpleMeaning: A computer on the net that keeps a set of web pages together.
scope: A computer on the net that keeps a set of web pages together, also called site, website and web
  site; not one web page alone and not a computer off the net.
examples:
- The internet site was damaged by hostile hackers.
- Our internet site lists the shop's opening hours.
