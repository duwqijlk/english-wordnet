simpleMeaning: any of several big, mostly warm-country hard-shelled insects with horns on the head, that
  harm coconut trees
scope: Not a small garden bug, and not a horned animal of the wild; a big horned insect that harms coconut
  trees.
examples:
- A rhinoceros beetle clung to the coconut trunk.
- Farmers fight the rhinoceros beetle to save their palms.
