simpleMeaning: In Greek stories, a young female water spirit who was the daughter of Oceanus or Nereus
scope: In Greek stories, a water spirit born to Oceanus or Nereus; not a land spirit, and not a sea god.
examples:
- The sea nymph rose from the waves to greet the sailors.
- In the old tale, a sea nymph was the daughter of Nereus.
