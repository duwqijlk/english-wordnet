simpleMeaning: For this thinker, each person picks their own path and answers for what they pick, even
  though human life in a hostile world stays beyond explaining.
scope: Also called an existential philosopher and an existentialist philosopher, this thinker joins free
  choice with personal answerability in a world that cannot be explained.
examples:
- The existentialist insisted that freedom of choice came with personal responsibility.
- He called himself an existentialist because he believed life in a hostile world could not be explained.
