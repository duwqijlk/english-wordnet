simpleMeaning: Its fruit has a net-like skin, flesh people can eat, and a musky smell; it grows on a climbing
  plant of several kinds.
scope: This is any of several climbing plants whose fruit has a net-like skin and flesh people can eat;
  muskmelon and sweet melon vine are other names for this sense.
examples:
- The sweet melon ripened on the vine.
- She cut the sweet melon and ate the flesh.
