simpleMeaning: What is inside the gut cannot move on to the lower bowel when a block forms, above all
  in its last part
scope: Also called ileus, it is the block that keeps what is inside the gut from moving on to the lower
  bowel.
examples:
- The intestinal obstruction kept the contents of her gut from moving on.
- An intestinal obstruction in the last part of the gut stopped all movement through it.
