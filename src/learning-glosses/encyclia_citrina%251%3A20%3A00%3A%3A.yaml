simpleMeaning: A Mexican orchid that grows on trees, with waxy grey-green leaves and lemon- to golden-yellow
  flowers that open only halfway; it is sometimes put in the Cattleya genus.
scope: Also called a tulip orchid or Cattleya citrina; a Mexican orchid that grows on trees, with waxy
  grey-green leaves and lemon- to golden-yellow flowers that open only halfway, kin to other tree-growing
  orchids.
examples:
- Encyclia citrina grows on the tree trunk, its yellow flowers only half open.
- The Encyclia citrina in the glasshouse has waxy grey-green leaves.
