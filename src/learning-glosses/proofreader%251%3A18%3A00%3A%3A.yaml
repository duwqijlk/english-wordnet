simpleMeaning: One who goes over pages before they are printed, looking for mistakes to mark for fixing.
scope: Also called a reader; one who reads proof to find errors and mark corrections, not one who reads
  books for pleasure.
examples:
- The proofreader caught three errors on the first page.
- She works as a proofreader for a newspaper.
