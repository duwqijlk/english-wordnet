simpleMeaning: One chemical unit made from adenine plus one sugar called deoxyribose plus one phosphate
  group
scope: One chemical unit made from adenine, one sugar called deoxyribose, and one phosphate group; deoxyadenosine
  monophosphate, deoxyadenylate, deoxyadenylic acid and dAMP are other names for this sense, and it is
  not the unit of length, the vitamin, the letter, or the unit of electric current also called A.
examples:
- A is one of the units that make up DNA.
- The cell uses A when it copies its DNA.
