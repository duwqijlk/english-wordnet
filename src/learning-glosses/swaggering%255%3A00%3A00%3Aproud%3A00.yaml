senseId: swaggering%5:00:00:proud:00
synsetId: 01897176-s
simpleMeaning: acting as if you are better than other people and looking down on those you think are not
  good enough
scope: 'Also called haughty, imperious, disdainful, lordly, prideful, supercilious, overbearing and sniffy:
  this is about thinking you stand above others and looking down on them, not just feeling proud or sure
  of yourself.'
examples:
- His swaggering manner made the younger workers feel small.
- She gave them a swaggering look, as if they were not worth her time.
