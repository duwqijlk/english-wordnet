simpleMeaning: about or connected with the spine or the thick cord of nerves that runs inside it
scope: About the spine or its cord of nerves, not the drug that makes the lower half of the body feel
  nothing.
examples:
- He suffered a spinal injury in the fall.
- The spinal cord carries messages between the brain and the body.
