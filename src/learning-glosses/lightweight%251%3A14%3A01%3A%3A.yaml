simpleMeaning: a weight group in fighting sports, for fighters heavier than featherweights and lighter
  than welterweights
scope: A fighting weight group between featherweight and welterweight; not a boxer of that weight, and
  not simply light in weight.
examples:
- He fights at lightweight.
- The lightweight bout drew a big crowd.
