simpleMeaning: A plant with thin green leaves on the plains of South America and western North America,
  where farm animals feed on it.
scope: 'Also called gramma, grama or gramma grass: a plant with thin green leaves on the plains of South
  and western North America where farm animals feed, not a lawn grass and not a tall prairie grass.'
examples:
- Grama grass covered the dry plains in a low green mat.
- Cattle fed on the grama grass of the western plains.
