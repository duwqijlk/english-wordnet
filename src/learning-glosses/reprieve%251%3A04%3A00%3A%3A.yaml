simpleMeaning: a punishment put off to a later time or set aside
scope: A punishment put off to a later time or set aside; respite is another name for this sense, not
  a paper that grants the delay, not a short break from harm, and not the act of doing it.
examples:
- The prisoner was given a reprieve the day before his sentence was due.
- A last-minute reprieve saved him from prison.
