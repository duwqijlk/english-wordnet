simpleMeaning: Said of a pitched ball that passes home plate on the side farthest from the person batting.
scope: This describes where a baseball pitch passes the plate, not the outer side or limit of something,
  not something coming from an external source, not an open-air setting, not a place beyond an organized
  unit, and not an unlikely event.
examples:
- He swung at an outside pitch and missed.
- The batter let the outside pitch go by for a ball.
