simpleMeaning: the process of making something fixed and final, with no limits or conditions
scope: This is the process of making something fixed and final, with absolutization as another name for
  this sense, not a change to something partial or conditional.
examples:
- The absolutisation of power left no room for debate.
- His absolutisation of the rule made every exception disappear.
