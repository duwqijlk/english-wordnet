simpleMeaning: Tiny living things in soil; some feed on dead matter, and some live on plants and animals
  and make them sick.
scope: Not the bacteria called actinomycete and not a mushroom.
examples:
- Actinomyces live in the soil and feed on dead leaves.
- Some actinomyces cause sickness in plants.
