simpleMeaning: money paid to someone who owns a patent, a work under copyright, or a natural resource,
  so that another person may use it
scope: A payment for the right to use someone else's property, not a group of royal persons and not a
  tax.
examples:
- He received royalties on his book.
- The singer earns a royalty every time her song is played on the radio.
