simpleMeaning: Saying that something, such as a law, an agreement, or a decision, no longer counts and
  has no effect
scope: This is saying that something no longer counts, not the act of calling off a plan or other arrangement.
examples:
- The king announced the cancellation of the old law.
- The judge's cancellation of the order took effect as soon as she announced it.
