simpleMeaning: the last part added to a word, such as a suffix or a final unit of meaning.
scope: This concerns the end of a word, not the end of a story or event, and not the act of stopping something.
examples:
- The plural ending of 'boxes' is '-es'.
- Children learn to spot common endings like '-ing'.
