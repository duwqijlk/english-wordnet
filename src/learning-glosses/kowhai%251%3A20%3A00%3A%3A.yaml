simpleMeaning: Its hanging bunches of tube-shaped golden-yellow flowers mark a bush or small tree of New
  Zealand and Chile, and it gives hard strong wood.
scope: People know this bush or small tree of New Zealand and Chile by its hanging bunches of golden-yellow
  flowers and its hard strong wood.
examples:
- The kowhai hung its golden-yellow flowers.
- Kowhai wood is hard and strong.
