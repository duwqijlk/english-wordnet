simpleMeaning: to force someone to do something by threats or by other rough ways
scope: 'Also called railroad and dragoon: to force someone to do something, not a bag filled with sand,
  not hiding how well you can play a game, and not hitting someone.'
examples:
- They sandbagged him to make dinner for everyone.
- The boss sandbagged her into working all weekend by threatening to fire her.
