simpleMeaning: having parts that stick out like wings, said of seeds or insects
scope: 'Another name for it is alate: having winglike parts, said of seeds or insects, not having true
  wings for flight and not being a leaf that is simply broad.'
examples:
- The alated seeds floated away from the tree.
- An alated insect has thin parts on its sides that look like wings.
