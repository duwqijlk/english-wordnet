simpleMeaning: a covered open area along the outside of a building, sometimes partly closed in at the
  sides
scope: This is a porch-like area outside a building, not the long covered way for walking along a wall,
  not a raised area inside, and not a passage in a mine.
examples:
- They sat on the gallery outside the house and watched the street.
- The wide gallery along the front of the building was partly closed in with screens.
