simpleMeaning: when a jet engine stops working because its fuel stops coming or because the fuel does
  not burn right
scope: A jet engine stopping because its fuel stops coming or burns wrong, not a crash and not a pilot
  shutting the engine down.
examples:
- The flame-out forced the pilot to land at once.
- A flame-out can happen if the fuel line is blocked.
