simpleMeaning: Not producing any mucus or watery fluid.
scope: Describes a cough or nose that gives off no mucus or fluid, not something merely lacking surface
  wetness, and not eyes that hold back tears.
examples:
- He had a dry cough that kept him awake all night.
- A dry nose in winter is rare for a small child.
