simpleMeaning: built with or in the shape of a curved top over an opening, like the top of a door or a
  window
scope: This sense is about a thing built with that curved top as part of it, not just any thing whose
  shape looks like such a curve.
examples:
- We walked through the arched passageway into the garden.
- The old church has an arched doorway made of stone.
