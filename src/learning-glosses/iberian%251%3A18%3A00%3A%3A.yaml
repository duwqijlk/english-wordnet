simpleMeaning: This word names a person from that peninsula, whether born there or living there, most
  of all in old times.
scope: A person from that peninsula, most of all in old times, not a person from Iberia in the Caucasus
  and not the adjective for things from that peninsula.
examples:
- An Iberian from that peninsula settled in the town long ago.
- The old Iberian spoke of the days when his people ruled the peninsula.
