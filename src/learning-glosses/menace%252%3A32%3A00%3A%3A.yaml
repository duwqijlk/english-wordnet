simpleMeaning: to make clear that you will harm someone, in words or by a move of your hand or body
scope: To say or show that you may harm someone; not to be a danger to a thing just by being there or
  by what could happen.
examples:
- He menaced the bank manager with a stick and said he would hit him.
- She menaced him with a knife and told him to leave at once.
