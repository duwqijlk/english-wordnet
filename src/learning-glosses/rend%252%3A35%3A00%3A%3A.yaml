simpleMeaning: to split something open with a hard, sudden pull, or to come open that way
scope: To split something open with a hard, sudden pull, also called pull or rip; not a clean cut and
  not a slow wearing away.
examples:
- The curtain rends from top to bottom in the strong wind.
- She rends the old sheet into strips for rags.
