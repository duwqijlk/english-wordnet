simpleMeaning: To a size or amount that stays in the same relation to something else
scope: A size or amount that keeps the same relation to something else; also called proportionally; not
  a fixed change, and not a match among the parts of one thing.
examples:
- Your salary will rise proportionately to your workload.
- The two sums grew proportionately over the year.
