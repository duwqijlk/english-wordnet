senseId: 'attestation_service%1:04:00::'
synsetId: 00579191-n
simpleMeaning: Consulting help from a CPA, a qualified accountant, who gives a view on whether a written
  statement that is the responsibility of someone else can be trusted
scope: This is consulting help from a qualified accountant, who gives a view on whether a written statement
  that is the responsibility of someone else can be trusted; attestation report is another name for it,
  not a full check of a company's books and not legal advice.
examples:
- The firm asked for an attestation service on the charity's accounts.
- An attestation service gives a CPA's view on whether a written statement can be trusted.
