simpleMeaning: In the years counted from the time Christ was said to be born, this word goes before a
  date
scope: 'Also called AD or A.D.: a word put before a date in the Christian era, not a date in the years
  before Christ was born.'
examples:
- The year 200 anno Domini saw the city grow.
- Dates written anno Domini count from the birth of Christ.
