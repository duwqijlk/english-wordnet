simpleMeaning: a statement that is kept weak on purpose, saying less than what could be said, so the gap
  shows the opposite, stronger meaning
scope: A statement that holds back and says less than could be said, so the weak words point to a stronger
  truth; not saying more than the truth, and not a lie.
examples:
- Calling the flood 'a bit of water' was an understatement.
- '''It is a little warm'' was an understatement on the hottest day of the year.'
