simpleMeaning: a case you carry loose papers, drawings, or maps in, big and flat and thin, most often
  made of leather
scope: A flat case for carrying loose papers or drawings, not a set of work shown to win jobs.
examples:
- She carried her drawings in a large portfolio.
- His portfolio lay open on the desk, full of loose maps.
