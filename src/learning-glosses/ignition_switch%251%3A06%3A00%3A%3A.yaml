simpleMeaning: When this switch is worked, a small coil pulls a link shut, closing the path of power so
  the engine can start.
scope: It is the switch that sets the starter going by closing the path of power, not the starter itself.
examples:
- Turn the ignition switch and the engine should start.
- A worn ignition switch would not close the circuit at all.
