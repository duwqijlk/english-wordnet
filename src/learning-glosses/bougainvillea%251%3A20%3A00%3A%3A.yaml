simpleMeaning: One of several woody climbing plants from South America with bright red or purple leaf-like
  parts around the flowers and widely grown in warm places as an ornamental.
scope: The climbing plant grown for its bracts, not the bracts alone and not a single flower.
examples:
- Bougainvillea covered the garden wall in sheets of purple.
- The bougainvillea's red bracts glowed in the afternoon sun.
