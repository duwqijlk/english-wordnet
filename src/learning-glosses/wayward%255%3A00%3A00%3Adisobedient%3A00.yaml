simpleMeaning: not willing to follow rules or advice, and hard to keep in line
scope: Not willing to follow rules or advice; contrary, perverse and obstinate are other names for this
  sense, and this is not merely being naughty for a moment or unable to learn.
examples:
- Her wayward son refused to follow any rules.
- The wayward horse would not stay on the path.
