simpleMeaning: In printing, a tray in which a worker keeps the metal letters, with separate spaces for
  the different letters, gaps, or numbers.
scope: In printing, this is a tray in which a worker keeps the metal letters, also called case and compositor's
  case; not a box for tools and not a drawer for paper.
examples:
- The typesetter's case held the metal letters in rows.
- He reached into the typesetter's case for a capital letter.
