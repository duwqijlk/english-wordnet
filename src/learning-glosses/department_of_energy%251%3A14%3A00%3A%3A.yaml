simpleMeaning: A part of the United States government that keeps the country's plan for power, made in
  nineteen seventy-seven.
scope: Also called Energy and the Energy Department, it deals with the country's power, not the department
  that looks after its safety.
examples:
- The Department of Energy keeps the country's plan for power.
- The Department of Energy was made in nineteen seventy-seven.
