simpleMeaning: A pipe that carries waste gases from the part that quiets the engine to the back of a car.
scope: On a car, the pipe that carries fumes from the muffler to the rear.
examples:
- The tailpipe was rusty and rattled when the engine ran.
- Smoke puffed out of the car's tailpipe.
