simpleMeaning: in a fair way that treats all people as they should be treated
scope: This means in a fair way, where each person gets what is right for them; it is not the same as
  giving everyone exactly the same amount.
examples:
- The money was equitably shared among the children, with more going to the youngest, who had least.
- The teacher equitably gave help to each student who needed it.
