simpleMeaning: holding one mole, a set amount used in chemistry, of a substance
scope: Holding one mole, a set amount used in chemistry, of a substance; not a grinding tooth and not
  a strong solution.
examples:
- The molar weight of water is about 18 grams.
- Chemists use molar weight to work out how much of a substance to take.
