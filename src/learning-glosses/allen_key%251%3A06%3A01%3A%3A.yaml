simpleMeaning: A wrench with a six-sided end, used to turn screws that have a six-sided hole
scope: 'Also called Allen wrench, hex key, zeta key, zeta wrench, Inbus key, Inbus wrench, Unbrako key
  and Unbrako wrench: a tool for turning screws with a six-sided hole, not a screwdriver.'
examples:
- He tightened the bolt with an Allen key.
- The flat-pack furniture came with an Allen key.
