simpleMeaning: Any set of letter shapes held in a small box that can be put into a printer.
scope: A set of letter shapes held in a small box that can be put into a printer, also called font cartridge;
  not a set of letters built into the printer, and not a box of ink.
examples:
- The cartridge font gave the printer a new set of letters.
- She bought a cartridge font for her old printer.
