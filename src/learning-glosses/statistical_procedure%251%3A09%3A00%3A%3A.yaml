simpleMeaning: A way of studying or showing sets of numbers, or a set of steps for working out a number
  from them
scope: A way of studying or showing sets of numbers, also called a statistical method; not a way of counting
  votes and not a single number.
examples:
- The team followed a statistical procedure to work out the result.
- This statistical procedure turns raw numbers into a clear answer.
