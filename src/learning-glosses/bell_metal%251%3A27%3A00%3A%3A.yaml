simpleMeaning: a hard brown mix made from three or four parts copper to one part tin, used to make things
  that ring when struck
scope: A hard brown metal mix used for things that ring, not plain copper and not tin used on its own.
examples:
- The foundry poured bell metal into the mould for the new church bell.
- Bell metal rings clear when it is struck.
