simpleMeaning: what teachers do when they give people knowledge or new skills
scope: 'Also called education, teaching, instruction, pedagogy and didactics: what teachers do when they
  give people knowledge or new skills, not the learning itself and not a school building.'
examples:
- Her educational activity took her to schools all over the country.
- Good educational activity gives children skills they can use.
