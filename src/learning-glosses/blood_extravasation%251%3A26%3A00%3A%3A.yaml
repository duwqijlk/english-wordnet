simpleMeaning: blood that seeps out of a blood tube into the soft parts round it, which can happen after
  a hurt, a burn, or a bad reaction to something
scope: Blood leaking from a blood tube into the soft parts round it, not blood spilled outside the body.
examples:
- The doctor said the blood extravasation under her skin would fade in a few days.
- A bad burn can cause blood extravasation in the skin around it.
