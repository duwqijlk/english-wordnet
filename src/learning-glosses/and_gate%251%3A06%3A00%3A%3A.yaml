simpleMeaning: Only when every one of its inputs switches on does this computer circuit switch on
scope: 'Another name for this sense is AND circuit: a computer circuit that switches on only when every
  one of its inputs switches on, not a circuit that switches on when only one input does.'
examples:
- The AND gate stays off until all its inputs are on.
- We wired an AND gate into the new board.
