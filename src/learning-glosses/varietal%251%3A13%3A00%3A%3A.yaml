simpleMeaning: a wine made mainly from one kind of grape, and named after that grape
scope: This is a wine named after the one grape it is made mainly from, not a wine made from a mix of
  grapes, and not a kind of grape itself.
examples:
- This varietal is made from one kind of grape, and the name of that grape is on the bottle.
- She chose a varietal named after the grape used to make it.
