simpleMeaning: A pale yellow drink made from pale grapes, or from dark grapes with the skins taken off
  before it turns to drink
scope: A pale yellow drink from grapes; not a dark red drink and not a sweet grape juice.
examples:
- We drank white wine with the fish.
- A glass of white wine stood on the table.
