simpleMeaning: to let a person or thing pass without a check, by using an official pass or letter, as
  at customs (where goods coming into a country are checked)
scope: Letting a person or thing pass free from checks with an official pass or letter, not speaking in
  a direct way, not the sausage, and not stamping mail.
examples:
- The letter franked the parcel through customs without a check.
- An official pass franked the traveller past the checks.
