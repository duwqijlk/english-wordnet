simpleMeaning: A book tongue; one of the two official tongues of Norway, close kin to Danish.
scope: Also called Bokmaal, Bokmal, Bokmal language, Dano-Norwegian, and Dano-Norwegian language; a book
  tongue and one of the two official tongues of Norway, not the other official tongue and not Danish itself.
examples:
- Bokmaal language is used in most Norwegian books.
- She speaks Bokmaal language.
