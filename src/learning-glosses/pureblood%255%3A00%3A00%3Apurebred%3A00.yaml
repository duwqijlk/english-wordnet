simpleMeaning: having a written list of parents and earlier family that shows an animal comes only from
  its own breed
scope: Describes an animal whose family line is written down as proof that it comes from one breed only.
  It is not the noun that names such an animal itself.
examples:
- She bought a pureblood horse, and its papers listed its parents and earlier family.
- The pureblood dog's family line was written down for many years back.
