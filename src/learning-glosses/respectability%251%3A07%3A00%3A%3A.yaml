simpleMeaning: the quality of being thought of by people as a good and honest person
scope: This is about people thinking a person is good and honest, not polite behaviour to other people
  and not thinking someone is very good at something.
examples:
- She cared about respectability and always tried to act honestly.
- His respectability grew because people trusted him.
