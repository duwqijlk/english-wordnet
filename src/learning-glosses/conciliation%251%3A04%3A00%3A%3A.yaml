synsetId: 01153902-n
simpleMeaning: The act of calming someone down and winning past distrust and ill will.
scope: Also called placation; the act of calming distrust and ill will, not the settled state of goodwill
  after peace is made and not the mediation that settles a dispute.
examples:
- Her conciliation won over the angry crowd.
- Conciliation between the two sides took months of talks.
