simpleMeaning: A small folded piece of dough filled with fruit or meat, baked or fried.
scope: A small folded piece of dough filled with fruit or meat, baked or fried; piroshki and pirozhki
  are other names for this sense, not a dumpling and not a pasty.
examples:
- She baked pirogi filled with apples for the party.
- The pirogi were fried until golden.
