simpleMeaning: a big tough pink rose with a very strong sweet smell, grown in Asia Minor for the rose
  oil called attar, and the parent of many cross-bred roses
scope: Also called damask rose; a big pink rose grown for rose oil, not a wild rose and not a rose grown
  only to look at.
examples:
- The summer damask rose fills the garden with a sweet smell.
- Growers in Asia Minor cut the summer damask rose for its oil.
