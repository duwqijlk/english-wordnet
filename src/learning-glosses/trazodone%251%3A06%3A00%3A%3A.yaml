senseId: 'trazodone%1:06:00::'
synsetId: 04483868-n
simpleMeaning: a drug taken by mouth that lifts low mood and also makes people sleepy, sold as Desyrel,
  and of a kind other than the tricyclic drugs
scope: This is a drug taken by mouth for low mood that also makes people sleepy; trazodone hydrochloride
  is another name for this sense. Not a drug that only lifts mood without making people sleepy, and not
  a tricyclic drug.
examples:
- Her doctor gave her trazodone to help her sleep and lift her mood.
- He took trazodone each night, and it made him drowsy.
