simpleMeaning: A court order that lets officers of the law seize a law-breaker and bring that person before
  a judge
scope: A court order that lets officers of the law seize a law-breaker and bring that person before a
  judge, also called arrest warrant, not a search order and not a fine.
examples:
- The judge issued a bench warrant when he failed to appear in court.
- Police held a bench warrant for the man who had skipped his trial.
