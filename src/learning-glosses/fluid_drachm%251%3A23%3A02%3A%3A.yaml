simpleMeaning: 'How much liquid or dry stuff fills is what this British measure of the old empire gives:
  60 minims, tiny measures of liquid, or 3.5516 cubic centimetres'
scope: Drachm, fluid dram and fluidram are also names for this British measure of the old empire for how
  much liquid or dry stuff fills, the same as 60 minims or 3.5516 cubic centimetres, unlike the apothecary
  measure of one eighth of a fluid ounce.
examples:
- One fluid drachm is the same as 60 minims.
- A fluid drachm measures liquid or dry things.
