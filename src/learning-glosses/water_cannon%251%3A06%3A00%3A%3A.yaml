simpleMeaning: To scatter crowds, above all crowds of rioters, the clear liquid is shot hard from a hose
  on a truck.
scope: Also called a watercannon, this is a hose on a truck that shoots the clear liquid hard to scatter
  crowds, above all crowds of rioters.
examples:
- A water cannon on a truck shot the clear liquid hard to scatter the crowd.
- The water cannon shot a hard jet of the clear liquid and the crowd of rioters scattered.
