schema: oewn-learning-gloss-v2
senseId: 'loosen_up%2:41:02::'
synsetId: 02608209-v
simpleMeaning: To become less tense, less stiff in manner, or less held back, and to act in a friendlier
  way.
scope: This is becoming less tense and friendlier in manner, not making the body bendy by stretching,
  which is the other sense of loosen up; relax is another name for this sense.
examples:
- He loosened up after a few minutes and began to joke with us.
- Loosen up and enjoy the party.
