scope: Using a plane's dials and gauges alone, because cloud or mist blocks the view; blind landing is
  another name for this sense, not flying in clear air and not flying with no dials at all.
examples:
- The pilot trained in blind flying.
- Blind flying uses dials when cloud blocks the view.
