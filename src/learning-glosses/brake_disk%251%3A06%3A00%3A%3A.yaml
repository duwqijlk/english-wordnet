simpleMeaning: A flat round plate fixed to the wheel, which the pads press to slow the car
scope: A flat round plate fixed to the wheel, which the pads press to slow the car; not the wheel itself
  and not a drum that turns with the wheel.
examples:
- The brake disk was worn thin and had to be changed.
- Rust had eaten into the brake disk.
