simpleMeaning: A sand snake of the southwestern United States living in fine to coarse sand or rich soil,
  moving through it as if swimming; its bands look like a coral snake's.
scope: A sand snake that moves through sand as if swimming, also called a banded sand snake; not a coral
  snake.
examples:
- The Chilomeniscus cinctus slipped through the sand like a swimmer.
- We saw a Chilomeniscus cinctus in the dunes, its bands bright against the sand.
