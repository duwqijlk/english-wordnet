simpleMeaning: in a way that is right and good by the rules of right and wrong
scope: Done in a way that is right and good; not merely done by the rules of a group, and not done with
  respect to moral ideas in the abstract, which is another sense of morally.
examples:
- He acted morally under the circumstances.
- She lived morally all her life.
