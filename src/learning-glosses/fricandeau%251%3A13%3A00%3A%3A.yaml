simpleMeaning: Meat from a young calf, stuck with strips of fat and cooked slowly in its own juices until
  it shines
scope: A dish of calf meat cooked slowly in its own juices, not a plain roast and not a stew cooked in
  water.
examples:
- The cook served fricandeau with boiled potatoes.
- Fricandeau is calf meat cooked slowly until it shines.
