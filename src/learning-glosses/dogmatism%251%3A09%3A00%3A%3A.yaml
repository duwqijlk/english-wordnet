simpleMeaning: the way of saying that one's beliefs are true and cannot be questioned
scope: The habit of saying one's beliefs are true and cannot be questioned, not a person who holds such
  beliefs and not open doubt.
examples:
- Her dogmatism left no room for other views.
- The meeting failed because of his dogmatism, since he would not hear any other view.
