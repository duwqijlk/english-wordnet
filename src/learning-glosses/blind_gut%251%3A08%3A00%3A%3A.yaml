simpleMeaning: The pouch where the large bowel starts and where the last part of the small bowel joins
  it.
scope: The pouch where the large bowel starts and where the last part of the small bowel joins it; caecum
  and cecum are other names for this sense, not the small bowel itself and not the last part of the large
  bowel.
examples:
- The blind gut is the pouch at the start of the large bowel.
- The appendix hangs off the blind gut.
