simpleMeaning: of an eye with a fault that keeps what it sees from coming into clear focus at the back
  of the eye
scope: This is said of an eye with a fault that keeps what it sees from coming into clear focus at the
  back of the eye, and not a healthy eye or an eye that is blind.
examples:
- An ametropic eye needs glasses to bring distant things into focus.
- The doctor found that her left eye was ametropic and gave her a lens for it.
