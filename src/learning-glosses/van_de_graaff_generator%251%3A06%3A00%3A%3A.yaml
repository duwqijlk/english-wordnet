simpleMeaning: A machine that makes a very high voltage by building up a charge of still electricity.
scope: This machine builds up a still electric charge to make a very high voltage; it is also called an
  electrostatic generator, an electrostatic machine and a Wimshurst machine.
examples:
- The Van de Graaff generator made sparks fly in the science class.
- They switched on the Van de Graaff generator to show static electricity.
