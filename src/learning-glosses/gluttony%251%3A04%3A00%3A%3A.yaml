simpleMeaning: the act of eating too much, shown as if it were a person, as one of the deadly sins
scope: Also called overeating. This is eating too much as one of the deadly sins, not just enjoying food
  or feeling hungry.
examples:
- In the old story, gluttony was shown as a man who never stopped eating.
- The priest warned that gluttony, eating far too much, was one of the deadly sins.
