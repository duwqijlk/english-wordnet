simpleMeaning: In tennis, a way of hitting the ball back with a downward movement that makes the ball
  spin backwards
scope: In tennis, a return hit downward so the ball spins backwards; not the rough, uneven movement of
  waves in the sea.
examples:
- She played a chop that made the ball spin back over the net.
- His chop dropped low and spun backwards after it landed.
