simpleMeaning: With no need for paved roads, this light two-wheeler takes on rough open ground on rugged
  tyres and springy mounts.
scope: Also called scrambler and dirt bike, this is a light motorbike built for rough open ground, not
  a road bike.
examples:
- He rode his trail bike over the muddy track.
- A trail bike handles rough ground far better than a road bike.
