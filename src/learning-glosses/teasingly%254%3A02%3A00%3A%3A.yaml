simpleMeaning: in a playful way, making light jokes about someone for fun
scope: Also called tauntingly, this means said or done in a playful, joking way, not in a mean way meant
  to hurt someone.
examples:
- She smiled and said teasingly that I was always late.
- '"You love cake, don''t you?" he said teasingly.'
