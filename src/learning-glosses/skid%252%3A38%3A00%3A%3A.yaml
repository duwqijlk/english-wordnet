simpleMeaning: to veer off to one side at a slant, beyond your control, most of the time
scope: 'Another name for a slide, a slip, or a slew: to veer off to one side at a slant, beyond your control,
  not the boards that make a track for things to roll or slide on.'
examples:
- The wheels skidded against the sidewalk in the rain.
- The car skidded sideways on the wet road.
