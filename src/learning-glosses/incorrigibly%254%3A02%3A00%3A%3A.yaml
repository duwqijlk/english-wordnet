simpleMeaning: in a way that cannot be changed or made better
scope: Doing something in a way that cannot be changed or made better; not merely doing it badly and not
  doing it by mistake.
examples:
- He remained incorrigibly cheerful through the whole ordeal.
- She was incorrigibly late to every meeting.
