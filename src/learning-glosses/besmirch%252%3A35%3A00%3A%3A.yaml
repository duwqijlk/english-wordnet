senseId: 'besmirch%2:35:00::'
synsetId: 01255165-v
simpleMeaning: to spread something over a surface so that it becomes dirty or gets a mark on it
scope: This sense is about making something dirty in a real way, not about harming a person's good name
  by saying bad things about them.
examples:
- Mud besmirched his white shoes.
- She besmirched the clean cloth by rubbing paint over it.
