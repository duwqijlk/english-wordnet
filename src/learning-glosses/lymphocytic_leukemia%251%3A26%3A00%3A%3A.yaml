simpleMeaning: In this blood illness, the body parts that make sickness-fighting cells grow too big, and
  the cells grow too big in the blood that moves round the body.
scope: This blood illness is marked by body parts that make sickness-fighting cells growing too big, and
  by the cells growing too big in the blood that moves round the body.
examples:
- Lymphocytic leukemia made the glands in the neck grow big.
- The blood in lymphocytic leukemia holds sickness-fighting cells grown too big.
