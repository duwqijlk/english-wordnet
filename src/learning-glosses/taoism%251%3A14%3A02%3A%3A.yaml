simpleMeaning: A Chinese group that claims to follow the teaching of Lao-tzu, but that also takes in the
  belief that God is in all things and magic
scope: A Chinese group claiming to follow Lao-tzu's teaching while also taking in the belief that God
  is in all things and magic, not the plain teaching of Lao-tzu and not the religion that follows his
  teaching alone.
examples:
- Taoism in this old sense mixed Lao-tzu's teaching with magic.
- The Taoism she studied mixed Lao-tzu's teaching with magic and the belief that God is in all things.
