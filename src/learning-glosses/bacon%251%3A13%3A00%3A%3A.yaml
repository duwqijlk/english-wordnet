simpleMeaning: meat from the back and sides of a pig, kept with salt and dried or smoked, and usually
  cut thin and fried
scope: This sense is the salted pig meat eaten as food, not the living animal and not any other meat.
examples:
- He fried bacon and eggs for breakfast.
- Thin slices of bacon were cooking in the pan.
