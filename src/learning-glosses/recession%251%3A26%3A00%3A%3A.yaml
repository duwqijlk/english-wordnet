simpleMeaning: a time when a country's trade and jobs fall, with less money being made across the whole
  country, for six months to a year
scope: A long fall in a country's trade and jobs, not the end of a church service and not a time of going
  back.
examples:
- The recession cost many people their jobs.
- During the recession, shops sold far less than before.
