simpleMeaning: A line drawn on a map or chart that joins places where the land has risen by the same amount.
scope: A line on a map or chart joining places where the land has risen by the same amount, not a line
  joining places of the same height and not a line of equal rainfall.
examples:
- The isobase joined towns that had risen by the same amount.
- Geologists drew an isobase across the map of the risen land.
