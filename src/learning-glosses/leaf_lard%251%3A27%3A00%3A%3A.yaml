simpleMeaning: The grease that lines the belly and kidneys of a pig, used to make cooking fat
scope: The fat around a pig's belly and kidneys; leaf fat is another name for this sense, not the lard
  made from it and not fat from another part of the pig.
examples:
- The butcher trimmed the leaf lard from around the pig's kidneys.
- Leaf lard lines the belly and kidneys of the pig.
