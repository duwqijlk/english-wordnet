senseId: 'tension%1:26:02::'
synsetId: 14025966-n
simpleMeaning: A state in which two sides or ideas that do not agree act on each other and are held in
  balance, most of all in art or books
scope: A balance between two sides in a book, play, or work of art, not a pull in a rope and not a worried
  state of mind.
examples:
- There is a tension between the two stories in the film.
- The tension in the play comes from the two sides that will not agree.
