simpleMeaning: so lacking in reason that people laugh at it with scorn
scope: 'Also called ridiculous, absurd, ludicrous, idiotic, preposterous, laughable, cockeyed and derisory:
  so lacking in reason that people laugh at it with scorn, not just slightly wrong or odd.'
examples:
- His plan to build a house from paper was nonsensical, and everyone laughed at it.
- Ask a nonsensical question and you will get an answer with no sense in it.
