simpleMeaning: a metric measure of how much a container holds; once, in normal conditions, the space of
  one kilogram of pure water, now 1,000 cubic centimetres, or about 1.75 pints
scope: This is a metric unit for measuring space or how much a container holds; liter, cubic decimeter
  and cubic decimetre are other names for this sense. Not a measure of weight or length.
examples:
- The bottle holds two litres of water.
- Please buy a litre of milk at the shop.
