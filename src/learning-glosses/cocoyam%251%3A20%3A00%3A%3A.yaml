simpleMeaning: The starchy underground part of the taro plant, eaten as food.
scope: This is the starchy underground part of the taro plant, eaten as food; taro, dasheen and eddo are
  other names for it, not the taro leaf and not a potato.
examples:
- She boiled the cocoyam for supper.
- Cocoyam grows thick and starchy under the soil.
