simpleMeaning: More stuff added to a thing, like pictures or extra words, so it is easier to follow.
scope: Also called amplification, more stuff added to a thing to make it clearer or fuller, not the act
  of working a thing out in detail and not the quality of being full of fine detail.
examples:
- An elaboration of the sketch followed, with notes in the margins.
- A few remarks were added in elaboration of his first speech.
