simpleMeaning: A circle worn on the front of the face to look nice, or on an animal's face to guide it
scope: A circle worn on the front of the face to look nice, or on an animal's face to guide it; not a
  circle worn on a finger or in an ear.
examples:
- She wore a gold nose ring to the party.
- The farmer put a nose ring on the bull to lead it.
