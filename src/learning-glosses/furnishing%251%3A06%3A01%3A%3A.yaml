simpleMeaning: Extra things worn with clothes, usually named in the plural
scope: Extra things worn with clothes, usually in the plural; not the furniture and rugs that make a home
  livable, and not the act of putting furniture in a house.
examples:
- The shop sells furnishings such as hats, belts, and gloves.
- She bought new furnishings to go with her winter coat.
