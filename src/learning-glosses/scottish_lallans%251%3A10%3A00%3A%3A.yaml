simpleMeaning: The form of English spoken in the low flat lands of the south of Scotland.
scope: The form of English of the Lowlands of Scotland, also called Lallans, not the English of the Highlands
  and not the English of England.
examples:
- He spoke Scottish Lallans with his friends.
- Scottish Lallans is still heard in the Lowlands.
