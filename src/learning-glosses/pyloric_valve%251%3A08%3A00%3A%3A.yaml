simpleMeaning: The ring of muscle at the lower end of the stomach that holds food back until it lets it
  through into the first part of the gut
scope: A ring of muscle at the stomach's end, also called the pyloric sphincter and musculus sphincter
  pylori, not the muscle ring at the top of the stomach where food comes in.
examples:
- The pyloric valve opened to let food into the gut.
- When the pyloric valve stays shut, food cannot leave the stomach.
