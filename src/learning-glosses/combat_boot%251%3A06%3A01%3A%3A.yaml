simpleMeaning: A heavy leather boot with laces, worn mainly by heavy metal, punk and goth fans; it comes
  in different colors and heights, counted in eyelets.
scope: The chunky lace-up fashion boot of metal, punk and goth fans; not the military boot that reaches
  mid-calf.
examples:
- He wore combat boots with a studded jacket to the punk show.
- The shop stocks combat boots in red and white, some with twenty eyelets.
