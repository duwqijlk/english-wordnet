simpleMeaning: A radio signal whose length is more than a kilometre, with a rate below 300 kilohertz (300
  thousand beats a second)
scope: A radio signal whose length is more than a kilometre, with a rate below 300 kilohertz, not a short
  radio signal and not a signal that carries pictures.
examples:
- Long wave radio can be heard over great distances.
- The station broadcast on long wave.
