simpleMeaning: Any one of the southern Bantu tongues of the Basuto people that speakers of each can understand,
  spoken in Botswana, South Africa and a small southern land
scope: This is any one of the southern Bantu tongues of the Basuto people; Basuto, Sesotho and Sotho are
  other names for it, and its nearest neighbours are the other southern Bantu tongues.
examples:
- The Sotho language is spoken in Lesotho and in parts of South Africa.
- She learned the Sotho language from her grandmother in Botswana.
