simpleMeaning: a position in space that runs in one direction only, whether real or imagined.
scope: This is not an edge of a flat shape or a unit of advertising space; it is a position in space with
  length in one direction only.
examples:
- The road follows the line of the valley.
- The state line runs along the river.
