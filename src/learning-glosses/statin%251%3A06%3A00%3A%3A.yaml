simpleMeaning: a medicine that lowers the amount of cholesterol (a fatty substance in the blood) by blocking
  a body chemical that helps the body make cholesterol
scope: 'Also called lipid-lowering medication, lipid-lowering medicine, and statin drug: a medicine that
  lowers cholesterol in the blood, not a medicine for pain or infection.'
examples:
- The doctor gave her a statin to lower her cholesterol.
- He takes a statin every evening with his food.
