simpleMeaning: a long, narrow hollow line in cloth and other things, in particular a shallow line that
  curves in on the tall part of a column
scope: This is a long, narrow hollow line, in particular on a column. It is not the musical instrument
  you blow, and not a tall thin wine glass.
examples:
- Each flute on the stone column was shallow and smooth.
- The cloth was folded into soft flutes along the edge.
