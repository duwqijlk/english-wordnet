simpleMeaning: To touch something, or seem to, by reaching it with light or sound.
scope: Light or sound seeming to touch something — another name for shine and fall in this sense — not
  a physical blow or a clock sounding the hour.
examples:
- The light struck the golden necklace.
- A strange sound struck my ears.
