simpleMeaning: a plant stem that lies flat, with shoots above and growths below, from which new plants
  grow
scope: A plant stem that lies flat, with shoots above and growths below; rhizome and rootstock are other
  names for it, not a seed and not the rootstock that gives a joined plant its roots.
examples:
- The rootstalk spread under the soil, sending up new shoots.
- Gardeners divide the rootstalk to make new plants.
