simpleMeaning: Short wings, each with a spur for fighting, and a habit of stealing mark this bird of New
  Zealand that cannot fly.
scope: Also called a maori hen and a wood hen, this flightless bird of New Zealand is known by its short
  wings and its habit of stealing.
examples:
- The weka stole food from the camp.
- A weka ran across the track, its short wings tucked close.
