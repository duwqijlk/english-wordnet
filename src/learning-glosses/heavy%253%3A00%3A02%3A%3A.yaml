simpleMeaning: Burdened in mind or feelings, especially by sorrow, troubles, or tiredness.
scope: This is emotional or mental burden, especially sorrow, worry, or tiredness, not physical weight
  or density, not great degree or number, not military or industrial armaments, not a stout person with
  a large frame, not compact fine-grained soil, not a cloud-darkened sky, not great intensity or force,
  not an isotope of greater atomic mass, not a villain in a play, not opacity to light, not large extent
  or density, not thick fabric, not something prodigious, not loud deep sound, not overindulgence in drink,
  not grave or important matters, not slow laborious movement, not equipment built for rough work, not
  food that upsets digestion, not a steep slope, not being full of or bearing weight, not work requiring
  effort, not exhausting effort, not dullness or lack of liveliness, not deep sleep, not advanced pregnancy,
  not the noun for a villain actor, not the noun for a tragic role, and not the adverb meaning slowly
  under a burden.
examples:
- His heart was heavy as he left the hospital.
- She came home heavy with worry about the unpaid bills.
