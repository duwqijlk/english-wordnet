simpleMeaning: A small tree of South Africa that keeps some of its leaves through the year, with close-packed
  bunches of bright scarlet flowers and red seeds.
scope: This is a small tree of South Africa with close-packed bunches of bright scarlet flowers and red
  seeds, also called kaffir boom or Erythrina lysistemon; other South African trees with red flowers are
  different kinds.
examples:
- The Transvaal kafferboom was covered in bright scarlet flowers.
- Transvaal kafferboom grows in South Africa.
