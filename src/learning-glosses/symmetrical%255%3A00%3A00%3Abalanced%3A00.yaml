senseId: symmetrical%5:00:00:balanced:00
synsetId: 00897322-s
simpleMeaning: having parts that match or are equal to each other, in one thing or between different things,
  in a balanced way
scope: 'Also called harmonious and proportionate: this is about parts of one thing, or different things,
  matching or being equal in a balanced way, not about two sides having the same size, shape, and place.'
examples:
- The agreement was symmetrical, with each country giving up the same number of weapons.
- 'The pay deal is symmetrical: both groups get the same rise and the same new rights.'
