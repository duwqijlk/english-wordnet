simpleMeaning: In chemistry, when one chemical stuff can form more than one kind of crystal
scope: In chemistry, one chemical stuff forming more than one kind of crystal; pleomorphism is another
  name for this sense, not a change in the stuff itself and not different stuffs forming the same crystal.
examples:
- The drug showed polymorphism in the lab.
- Polymorphism means the same stuff can grow as two kinds of crystal.
