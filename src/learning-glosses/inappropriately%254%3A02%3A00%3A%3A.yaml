simpleMeaning: in a way that is not right for the place, time, or situation
scope: This is about a way of acting that does not fit the place, time, or situation, not about a thing
  that is wrong in itself.
examples:
- He was inappropriately dressed for the cold weather, wearing only a thin shirt.
- She laughed inappropriately during the serious meeting.
