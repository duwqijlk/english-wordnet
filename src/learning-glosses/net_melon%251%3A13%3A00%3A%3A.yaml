simpleMeaning: Deep green flesh and marks like a fine mesh on the skin mark the fruit of a vine.
scope: The netted melon and the nutmeg melon are also names for the fruit of a vine, not the vine itself.
examples:
- We cut open a net melon and found deep green flesh inside.
- The net melon had marks like a fine mesh on its skin.
