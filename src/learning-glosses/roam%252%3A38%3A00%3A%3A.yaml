simpleMeaning: to move from place to place with no set place to go to, often looking for food or work
scope: 'Also called range, roll, cast, drift, wander, swan, stray, tramp and ramble: moving with no set
  goal, not staying in one place or going straight to a known place.'
examples:
- The cattle roamed over the wide fields looking for grass.
- He roamed from town to town looking for work.
