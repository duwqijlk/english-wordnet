simpleMeaning: A form of plague that advances quickly, is often deadly, and can pass through the air between
  people; it attacks the lungs, bringing chills, coughing up blood and high fever.
scope: Plague pneumonia and pulmonic plague are other names for this same airborne form, not bubonic or
  septicemic plague.
examples:
- Pneumonic plague can spread from person to person through the air.
- Doctors recognized pneumonic plague from the high fever and bloody cough.
