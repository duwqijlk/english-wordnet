simpleMeaning: a sickness of the lungs and skin, marked by too much thick mucus coughed up and by small
  hard lumps
scope: A sickness of the lungs and skin, marked by too much thick mucus coughed up and by small hard lumps;
  coccidioidomycosis, desert rheumatism and valley fever are other names for this, not a common cold and
  not a skin rash alone.
examples:
- Coccidiomycosis can spread through the lungs and skin.
- Doctors treat coccidiomycosis with drugs that fight the infection.
