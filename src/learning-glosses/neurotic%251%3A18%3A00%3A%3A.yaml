senseId: 'neurotic%1:18:00::'
synsetId: 10374597-n
simpleMeaning: a person who has a problem of the mind that makes them feel strong worry or fear
scope: This names a person who has this problem of the mind; it is not the describing word for a person
  or behaviour that shows this problem.
examples:
- As a neurotic, he often feared that a small pain meant a serious illness.
- The doctor spoke kindly to the neurotic, who could not stop worrying.
