simpleMeaning: a bottle made from the dried shell of a type of fruit with a hard skin
scope: Also called calabash. This is a bottle made from a dried hard shell, not the living vine that grows
  such fruit and not the hard-skinned fruit itself.
examples:
- He carried water in a dried gourd.
- She used a hollow gourd as a bottle for wine.
