simpleMeaning: A sick growth of sticky stuff from citrus trees and many kinds of stone-fruit tree.
scope: A sick growth of sticky stuff from citrus trees and many kinds of stone-fruit tree, not the sticky
  stuff itself and not a healthy flow of sap from a tree.
examples:
- Gummosis left sticky stuff on the bark of the orange tree.
- The farmer cut away the gummosis on the stone-fruit tree.
