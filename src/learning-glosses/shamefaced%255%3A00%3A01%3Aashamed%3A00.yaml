simpleMeaning: having a look or way that shows a feeling of shame
scope: This describes a person whose look shows they feel shame. It is not the feeling of shame on its
  own, and it is not a person who feels no shame at all.
examples:
- He gave a shamefaced smile and said sorry.
- The shamefaced boy looked down and did not speak.
