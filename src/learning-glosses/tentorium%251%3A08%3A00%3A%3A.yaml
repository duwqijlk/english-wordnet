simpleMeaning: In anatomy, a fold of the brain's tough cover over the cerebellum, the small brain at the
  back, holding up the back lobes of the larger brain
scope: A fold of the brain's tough cover, not the cover itself and not a part of the skull.
examples:
- The tentorium covers the cerebellum like a shelf.
- The tentorium holds up the back lobes of the brain.
