simpleMeaning: A strongly emotional label for someone with extreme political views, especially a communist
  or revolutionary.
scope: This is a political label for a person, not the colour or a type of wine.
examples:
- In the 1950s, some politicians called their opponents reds.
- The newspaper described the protesters as reds.
