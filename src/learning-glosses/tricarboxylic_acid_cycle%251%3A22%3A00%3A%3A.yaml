simpleMeaning: In all plants and beasts, a run of body-chemical deeds in the cell's power houses, burning
  sour stuff to make high-power phosphate stuff that gives cells power.
scope: This sense is also called citric acid cycle.
examples:
- A tricarboxylic acid cycle gives cells power.
- Tricarboxylic acid cycles burn sour stuff.
