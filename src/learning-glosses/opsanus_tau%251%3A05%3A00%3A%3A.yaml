simpleMeaning: A fish that lives on the sea floor, with slimy skin without scales and a broad thick head
  with a wide mouth.
scope: Also called toadfish; a fish that lives on the sea floor, with slimy skin without scales and a
  broad thick head with a wide mouth, not a toad and not a fish of open water.
examples:
- Opsanus tau lies on the sea floor.
- The wide mouth of Opsanus tau takes in small fish.
