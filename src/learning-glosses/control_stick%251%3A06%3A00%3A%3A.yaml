simpleMeaning: A hand lever a pilot moves to work the hinged flaps on a plane's wings and tail.
scope: Also called stick and joystick; a hand lever a pilot moves to work the flaps on a plane's wings
  and tail, not the pedals and not the wheel that turns the plane.
examples:
- The pilot pulled back on the control stick to climb.
- He gripped the control stick as the plane banked.
