simpleMeaning: A grading once used to tell how strong a quake was; one found only by quake meters is a
  I, and one that knocks down all buildings is a XII.
scope: A grading once used to tell how strong a quake was, from a I found only by quake meters to a XII
  that knocks down all buildings, not a scale of quake size from wave readings.
examples:
- On the Mercalli scale, the tremor that no one felt was only a I.
- A quake that destroyed the whole town would rank a XII on the Mercalli scale.
