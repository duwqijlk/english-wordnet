simpleMeaning: a slimy mix of yeast and bacteria that turns cider or wine into vinegar.
scope: This is not a female parent; it is the slimy substance used to make vinegar.
examples:
- The vinegar mother floated on top of the liquid.
- She added the mother to the cider so it would turn into vinegar.
