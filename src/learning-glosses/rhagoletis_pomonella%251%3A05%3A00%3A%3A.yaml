simpleMeaning: Its young dig into apples and eat them.
scope: Also called the apple maggot and the railroad worm, this is the kind whose young dig into apples
  and eat them, not one whose young feed on other fruit.
examples:
- Rhagoletis pomonella ruined the apples when its young bored into them.
- The farmer found Rhagoletis pomonella in the orchard, its young feeding on the apples.
