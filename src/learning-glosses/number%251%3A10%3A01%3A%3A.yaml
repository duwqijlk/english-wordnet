simpleMeaning: one of the written signs, such as 0, 5, or 9, that stand for quantities.
scope: This sense is not the quantity itself, not an identification code, and not the grammar category
  of singular and plural; it is the written sign for a quantity.
examples:
- Write the answer as a number, not as a word.
- In this font, the number 1 is just a plain vertical line.
