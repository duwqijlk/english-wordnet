simpleMeaning: From the afterbirth, blood full of food travels back to the baby through this tube in the
  cord joining baby and mother.
scope: Also called an umbilical vein, it is the tube in the cord that carries blood full of food from
  the afterbirth back to the baby.
examples:
- Blood full of food flows back to the baby through the vena umbilicalis.
- The vena umbilicalis runs in the cord that joins the baby to its mother.
