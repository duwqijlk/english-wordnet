simpleMeaning: A rod that picks up signals from all sides, set to the wave bands used for TV broadcasts
scope: A rod that picks up signals from all sides, set to the wave bands used for TV broadcasts, also
  called a tv-antenna; not a dish that points one way and not a radio rod.
examples:
- The television antenna on the roof picks up all the channels.
- He turned the television antenna to get a clear picture.
