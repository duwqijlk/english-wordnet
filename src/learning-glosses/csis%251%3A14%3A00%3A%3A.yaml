scope: Also called the Canadian Security Intelligence Service; the agency that gathers and studies foreign
  facts for the Canadian government's safety, the one that looks outward rather than inward.
examples:
- The CSIS gathers facts about threats from other countries.
- CSIS reports go to the Canadian government.
