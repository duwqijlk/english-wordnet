simpleMeaning: to give something or someone to a god through a serious promise
scope: Also called vow, this means giving a person or thing to a god by a serious promise. It is not putting
  a person into a church job, and not the word for a thing already set apart for a holy use.
examples:
- She consecrated her life to God with a serious promise.
- He consecrated himself to the god by a promise he would never break.
