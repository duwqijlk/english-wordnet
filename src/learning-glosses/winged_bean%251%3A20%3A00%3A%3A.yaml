simpleMeaning: A root-tubered twining one-year vine bearing bunches of purplish blooms and pods with four
  jagged wings, of Old World hot lands.
scope: This sense is also called goa bean, goa bean vine, and winged pea.
examples:
- A winged bean twined up the pole.
- Winged beans bear purplish blooms.
