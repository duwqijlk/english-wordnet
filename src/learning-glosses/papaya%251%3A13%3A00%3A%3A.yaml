simpleMeaning: a large oval fruit, like a melon in shape, that grows in hot places and has yellowish flesh
  inside
scope: This is the fruit you eat, not the plant or small tree of hot places that the fruit grows on, which
  shares the same name.
examples:
- She cut the ripe papaya in half and ate the yellow flesh.
- We bought a large papaya at the market for breakfast.
