simpleMeaning: Said of things that belong to the Jews or show what their culture or religion is like.
scope: Also called Judaical, this is said of things to do with the Jews, their culture or their religion,
  not of things to do with another faith.
examples:
- The Judaic idea of justice shaped the law.
- They studied Judaic art and history.
