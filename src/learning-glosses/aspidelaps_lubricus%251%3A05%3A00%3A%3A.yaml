simpleMeaning: A small snake of southern Africa that lives in trees, is found over a wide area, and is
  marked with black and orange bands.
scope: Also called an African coral snake; a small tree snake of southern Africa, not a large ground snake
  of the same lands.
examples:
- The Aspidelaps lubricus moved through the trees of southern Africa.
- An Aspidelaps lubricus is banded in black and orange.
