simpleMeaning: anything that slows something down, makes it start or happen later, or holds it back
scope: 'Also called retardation: a thing that slows something down, makes it happen later, or holds it
  back. It is not simply the act of being late.'
examples:
- They sprayed a fire retardant on the trees near the houses.
- The retardant slowed the spread of the fire.
