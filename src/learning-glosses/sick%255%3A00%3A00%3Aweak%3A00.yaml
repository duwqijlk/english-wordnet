simpleMeaning: Light that is faint and weak rather than bright.
scope: This describes dim, faint light, not a person who is ill or about to vomit, and not something gruesome
  that shocks and horrifies.
examples:
- A sick light filtered through the curtains and barely reached the far wall.
- The old lamp gave off a sick, dim glow that made the room look gray.
