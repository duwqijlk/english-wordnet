simpleMeaning: The regular casting off of the hard outer coat in creatures with jointed legs, or of the
  outer skin in reptiles.
scope: Also called molt, molting, moulting, and ecdysis; the regular casting off of the hard outer coat
  in creatures with jointed legs, or of the outer skin in reptiles.
examples:
- The crab's moult left its old shell empty on the sand.
- During the moult the snake's old skin came off in one piece.
