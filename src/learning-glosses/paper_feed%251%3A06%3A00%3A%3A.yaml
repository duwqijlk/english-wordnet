simpleMeaning: This part of a machine puts thin sheets used for writing into a printer or a typewriter
scope: A part of a printer or typewriter that moves sheets in, not the tray that holds sheets and not
  the part that prints the words.
examples:
- The job was delayed because the paper feed was clogged.
- She cleared the paper feed after the sheets jammed inside it.
