senseId: labyrinthine%5:00:01:complex:00
synsetId: 02184401-s
simpleMeaning: very complicated, full of many small details, and occasionally tricky or not honest
scope: This sense is also called involved, tangled, convoluted, tortuous and knotty. It means a thing
  is very complicated, full of many small details, and sometimes tricky or not honest; it is not about
  the shape of a place with twisting paths, and not about the inner ear.
examples:
- She held on to power by labyrinthine moves that were hard to follow and not always honest.
- The labyrinthine plot of the book has so many linked secrets that readers get lost.
