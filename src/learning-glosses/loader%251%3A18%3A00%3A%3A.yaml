simpleMeaning: a worker at a port who puts goods onto ships and takes goods off them
scope: 'Also called dockworker: this is a person who moves goods on and off ships at a port, not a machine
  that does this work and not a person who fills a gun.'
examples:
- The loader lifted the last heavy box onto the ship.
- Loaders at the port took the goods off the ship before noon.
