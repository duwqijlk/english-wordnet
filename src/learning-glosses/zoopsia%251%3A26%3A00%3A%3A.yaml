simpleMeaning: seeing animals that are not there, sometimes when a person has a bad shaking illness from
  heavy drinking
scope: This is seeing animals that are not really there, sometimes during a bad shaking illness from heavy
  drinking; not a real animal in the room and not a dream.
examples:
- The doctor said his zoopsia made him see cats that were not in the room.
- During her zoopsia, she cried out about dogs running across the floor.
