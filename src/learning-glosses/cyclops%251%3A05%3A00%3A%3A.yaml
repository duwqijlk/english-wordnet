simpleMeaning: A tiny freshwater crustacean that swims freely, with one large eye, a pear-shaped body,
  and long antennae. It is a food source and can carry worms that infect people.
scope: This is the tiny pear-shaped crustacean with one eye and long antennae, not the round-bodied water
  flea with a clear shell; water flea is also another name for this same animal.
examples:
- A cyclops darted across the microscope slide, its single eye clearly visible.
- Cyclops are a key link in the food chain of a freshwater pond.
