simpleMeaning: Tissue that joins a muscle to a bone, in a cord or band that cannot stretch.
scope: A cord joining muscle to bone, also called a tendon, and not a muscle itself.
examples:
- The sinew in his leg ached after the run.
- The butcher trimmed the sinew from the meat.
