schema: oewn-learning-gloss-v2
senseId: 'coordinating%3:00:00::'
synsetId: 00554535-a
simpleMeaning: used to join two parts of a sentence or phrase that are built in the same way
scope: 'Also called coordinative: this describes a word that joins parts of equal kind and build, not
  a word that joins a main part to a part that depends on it.'
examples:
- In 'John and Mary', 'and' is a coordinating word joining two names.
- '''Or'' is a coordinating word in ''Will you go or stay?'''
