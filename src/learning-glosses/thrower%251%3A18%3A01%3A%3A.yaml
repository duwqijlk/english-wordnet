simpleMeaning: a skilled person who makes things from clay, shaping them on a turning wheel and baking
  them in a hot oven
scope: 'Also called potter, ceramicist, and ceramist: a person who makes clay pots. Not a person who twists
  silk or other threads into yarn.'
examples:
- The thrower shaped a clay bowl on his wheel.
- As a skilled thrower, she baked her pots in a hot oven.
