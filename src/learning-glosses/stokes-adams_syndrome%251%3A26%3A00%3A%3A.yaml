senseId: 'stokes-adams_syndrome%1:26:00::'
synsetId: 14385998-n
simpleMeaning: Repeated sudden spells of fainting, brought on when the signal that sets the heartbeat
  fails to pass as it should.
scope: 'Also called atrioventricular block, heart block and Adams-Stokes syndrome: repeated sudden fainting
  spells from a faulty heartbeat signal, not a single faint.'
examples:
- He had a Stokes-Adams syndrome attack and fell unconscious without warning.
- Doctors traced her Stokes-Adams syndrome to a fault in the heartbeat signal.
