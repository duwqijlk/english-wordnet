simpleMeaning: a mark on the front of the body where the cord that joined a baby to its mother before
  birth was attached
scope: 'Also called a navel, bellybutton, omphalos and omphalus: a mark left where the cord that joined
  a baby to its mother was attached, not a cut on the skin and not the cord itself.'
examples:
- She had a small tattoo just above her belly button.
- The baby's belly button healed a few days after birth.
