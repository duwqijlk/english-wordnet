simpleMeaning: A mark of two short sloping strokes over a letter in Latin writing, used most in written
  Hungarian
scope: A mark of two short sloping strokes over a letter in Latin writing, used most in written Hungarian;
  not a single mark and not a mark under a letter.
examples:
- The double acute accent marks long ő and ű in Hungarian.
- She added the double acute accent to the vowel.
