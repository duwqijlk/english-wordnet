simpleMeaning: a person whose job is to get people to notice a person, a product, or an event, by getting
  news stories about them
scope: A person who works to get notice for a person, product, or event; not a person who writes news
  stories and not a person who prints books.
examples:
- The singer's publicist spoke to the newspapers about the new album.
- She works as a publicist for a film company.
