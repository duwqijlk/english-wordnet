simpleMeaning: People with diseases of the blood go to this doctor, who also treats diseases of the parts
  of the body that make blood
scope: A doctor, also called hematologist, who looks after diseases of the blood and the parts that make
  blood, not a heart doctor and not a doctor who treats bones.
examples:
- The haematologist explained why her blood count kept falling.
- He was sent to a haematologist after the clinic found a problem with his blood.
