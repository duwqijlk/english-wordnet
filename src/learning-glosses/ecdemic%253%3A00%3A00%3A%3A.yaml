simpleMeaning: said of a sickness that starts in a place other than the place where it is found
scope: A sickness that comes from outside the place where it shows up, not one that starts in that place
  and not one that spreads from person to person.
examples:
- The ecdemic fever had come in from a far-off port.
- Doctors called the outbreak ecdemic because the sickness began elsewhere.
