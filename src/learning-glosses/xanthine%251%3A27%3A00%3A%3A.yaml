simpleMeaning: A crystal-like stuff made when nucleoproteins break down with oxygen in the body, coming
  before uric acid, found in many organs and in urine
scope: This crystal-like stuff comes before uric acid; it is not uric acid itself.
examples:
- Xanthine comes before uric acid in the body.
- Xanthine is found in many organs and in urine.
