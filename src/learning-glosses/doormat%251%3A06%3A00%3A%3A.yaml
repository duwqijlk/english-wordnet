simpleMeaning: a mat put outside a door, for people to clean their shoes on before they go in
scope: A mat for cleaning shoes at a door; not the other use of the word for a person who is physically
  weak and not effective.
examples:
- Wipe your feet on the doormat before you come in.
- She left her wet boots beside the doormat.
