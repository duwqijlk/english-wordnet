simpleMeaning: To do with the point in the sky straight above you, or near it
scope: To do with the point in the sky straight above you, or near it, not to do with the horizon and
  not to do with the north.
examples:
- The zenithal point moves as you travel south.
- At noon the sun was near its zenithal height.
