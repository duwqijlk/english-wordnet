simpleMeaning: the part of the study of space that deals with what stars, planets and other bodies in
  space are made of and how they act
scope: This is the part of space study that asks what bodies in space are made of and how they act, not
  the wider study of space as a whole and not telling the future from the stars.
examples:
- She studies astrophysics and wants to know what stars are made of.
- His book on astrophysics explains the heat and light of distant stars.
