simpleMeaning: A bell that a cow wears around its neck so that people can find the cow easily
scope: A bell worn by a cow to help people find it, not a bell rung by hand and not a small bell used
  for music.
examples:
- The cowbell rang as the cow walked through the field.
- We could hear the cowbell from far away and knew where the cow was.
