simpleMeaning: When things change, such as changes in heat, this part put into an electric path keeps
  the flow steady.
scope: This part is also called ballast and barretter.
examples:
- The ballast resistor kept the current steady as the set grew warm.
- A ballast resistor was put into the circuit to make up for the changes in heat.
