simpleMeaning: A body of the United Nations that helps trade by keeping the big currencies steady in value.
scope: Also called the International Monetary Fund, this is a United Nations body that steadies the big
  currencies to help trade, not a bank that lends to one country and not a trade group.
examples:
- The IMF helped the country keep its money steady.
- The IMF works to keep world trade running well.
