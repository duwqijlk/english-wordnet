simpleMeaning: keeping prisoners shut in their cells, most often to get control back during a riot
scope: Prisoners shut in their cells to regain control, not a town shut down and not a door locked at
  night.
examples:
- The prison went into lockdown after the riot broke out.
- A lockdown kept every prisoner in his cell for a week.
