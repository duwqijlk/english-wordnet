simpleMeaning: A body chemical made by the back of the pituitary gland, which makes the womb tighten and
  milk flow out
scope: Also called oxytocin, it is a body chemical from the back of the pituitary gland that brings on
  womb contractions and the flow of milk.
examples:
- The doctor gave her Pitocin to start the contractions.
- Pitocin helps the womb tighten and milk to flow.
