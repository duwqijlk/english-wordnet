simpleMeaning: Handing a person over to the law so that they are held and kept under its control.
scope: Handing a person to the law to be held, not saying you give up and not the act of giving up in
  a fight.
examples:
- The lawyer arranged the surrender of his client to the police.
- After the arrest, the surrender of the prisoner took place at the station.
