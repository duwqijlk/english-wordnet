simpleMeaning: the fact that a shape with straight sides (a polygon) has all sides equal and all angles
  equal
scope: This is about a shape having equal sides and equal angles, not about something happening again
  and again in a steady way.
examples:
- The regularity of this shape comes from its equal sides and equal angles.
- We checked the regularity of the polygon by measuring each side and angle.
