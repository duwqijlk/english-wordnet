simpleMeaning: a tall round tower on a farm, used to keep cut green plants as food for farm animals
scope: This is the farm tower for keeping food for farm animals, not the deep underground place where
  army weapons that fly far are kept and fired.
examples:
- The farmer keeps corn for his cows in the tall silo next to the barn.
- A metal silo stood beside the farm buildings.
