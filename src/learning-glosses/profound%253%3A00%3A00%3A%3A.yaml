simpleMeaning: showing deep thought about ideas, or deep feeling
scope: This sense is about deep thought or deep feeling; it is not about a thing being far down or too
  deep to measure.
examples:
- She wrote a profound book about loss and hope.
- He felt profound regret for what he had done.
