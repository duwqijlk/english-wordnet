simpleMeaning: to make it hard for someone to breathe, or to block the way air moves in
scope: To make it hard for someone to breathe, or to block the way air moves in; also called choke or
  stifle, not to fight for breath yourself, not to take away the air a person needs, and not to hold back
  growth or new ideas.
examples:
- The foul air was slowly suffocating the children.
- Smoke suffocated the miners in the tunnel.
