simpleMeaning: A substance holding living tiny beings, put on seed, plants, or soil, settling at the roots
  or inside the plant to help growth by raising chief food for the host.
scope: This sense is also called bio-fertilizer, for a substance holding living tiny beings that settle
  at plant roots or inside the plant and raise chief food for the host.
examples:
- Farmers spread bio fertilizer on the seed to help growth.
- They put bio fertilizer on the soil.
