senseId: 'logically%4:02:00::'
synsetId: 00365259-r
simpleMeaning: in a way that shows clear thinking and follows good reasons
scope: This means acting or thinking in a clear, well-ordered way; it is not the use that means a result
  follows from the facts by clear thinking.
examples:
- He acted logically under pressure and checked each fact before he chose.
- She spoke logically, giving each reason in a clear order.
