simpleMeaning: Any of many plant-eating creatures with jointed legs and no poison, with a tube-shaped
  body of twenty to a hundred or more parts, most with two pairs of legs.
scope: Also called a millipede and a millepede, this is a plant-eating creature with jointed legs and
  no poison, with a tube-shaped body of many parts.
examples:
- A milliped curled up under the damp log.
- Millipeds feed on dead leaves in the garden.
