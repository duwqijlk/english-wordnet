simpleMeaning: A brake set in which a foot pedal moves a piston in the master cylinder, and brake fluid
  then pushes with great force on the brake pads or shoes.
scope: A brake set in which a foot pedal moves a piston in the master cylinder, and brake fluid then pushes
  with great force on the brake pads or shoes; it is also called hydraulic brakes.
examples:
- The hydraulic brake stopped the car.
- A hydraulic brake uses fluid.
