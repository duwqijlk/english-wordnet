simpleMeaning: The beat pattern of words in verse, or the writing of such words with a set beat
scope: Putting words into verse with a set beat, or the beat pattern itself, not changing units to metric
  and not free verse with no set beat.
examples:
- Her metrification of the old tale gave it a steady beat.
- The metrification of the poem followed a strict pattern.
