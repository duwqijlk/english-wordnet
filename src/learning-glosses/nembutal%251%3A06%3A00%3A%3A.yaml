simpleMeaning: A sleep-making drug of the kind called barbiturates, used to calm people, to bring sleep,
  and to stop muscle cramps
scope: Also called pentobarbital, pentobarbital sodium and yellow jacket; a sleep-making drug of the kind
  called barbiturates, sold under the trade name Nembutal, used to calm people, to bring sleep, and to
  stop muscle cramps, unlike other sleeping drugs.
examples:
- The doctor gave him Nembutal to help him sleep.
- Nembutal calmed the patient before the operation.
