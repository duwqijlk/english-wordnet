simpleMeaning: Used for a person who is ready to cause pain or suffering, and for what such a person does
scope: 'Also called fell: this sense is about people or their actions that cause pain or suffering, not
  about being strict or unkind in a small way.'
examples:
- His cruel beatings left the prisoners in pain.
- It was cruel to keep the dog locked up without food.
