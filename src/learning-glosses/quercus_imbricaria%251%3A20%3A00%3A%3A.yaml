simpleMeaning: A small tree of the eastern and central United States that sheds its leaves, with leaves
  that shine like laurel; its wood is used out west for roof tiles.
scope: A small tree of the eastern and central United States that sheds its leaves, with leaves that shine
  like laurel; laurel oak and shingle oak are other names for it, not other oaks of the east.
examples:
- A Quercus imbricaria stood by the road, its leaves shining in the sun.
- Quercus imbricaria wood is used for roof tiles in the western states.
