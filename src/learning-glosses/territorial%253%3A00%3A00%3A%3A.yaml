senseId: 'territorial%3:00:00::'
synsetId: 02417407-a
simpleMeaning: that belongs to the land of a state or ruler
scope: This means belonging to a state or ruler's land, not just being linked to land in any way, not
  guarding land from others, and not a soldier in a unit for a territory.
examples:
- They argued over the territorial rights to the small island.
- This map shows the territorial waters that belong to the state.
