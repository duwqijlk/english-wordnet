simpleMeaning: Under a roof that shields them from the weather, rows of separate seats rise on raised
  steps at a racecourse or sports ground.
scope: Also called a grandstand; it is a roofed place to sit at a race or game, not an open bank of seats.
examples:
- We sat in the covered stand during the race.
- The covered stand shelters the seats from the weather.
