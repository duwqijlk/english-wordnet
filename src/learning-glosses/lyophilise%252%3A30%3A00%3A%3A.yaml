simpleMeaning: Blood, serum or body tissue is dried by freezing it where there is almost no air
scope: Also called lyophilize, to dry blood, serum or body tissue by freezing it in almost no air, not
  to dry food and not to freeze something to keep it cold.
examples:
- The lab will lyophilise the blood samples before storing them.
- Doctors lyophilise serum so it keeps longer.
