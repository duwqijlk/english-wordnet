simpleMeaning: a kind of clear material for lenses that spreads light into colours very little and bends
  light very little
scope: A kind of clear material for lenses that bends light little; optical crown and optical crown glass
  are other names for this sense, and it is not a flat round of window glass.
examples:
- Crown glass is used in the lenses of this telescope.
- The maker chose crown glass for the camera lens because it bends light so little.
