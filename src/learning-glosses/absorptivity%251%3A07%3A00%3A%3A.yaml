simpleMeaning: In physics, how much of the rays and sound that fall on a body the body takes in or can
  take in, as a share of the whole.
scope: Also called absorption factor, this is in physics the share of rays and sound that a body takes
  in, worked out as a part of all that falls on it.
examples:
- The absorptivity of the dark cloth was high.
- Absorptivity tells how much sound the wall takes in.
