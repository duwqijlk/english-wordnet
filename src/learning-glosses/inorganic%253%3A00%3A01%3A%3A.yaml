simpleMeaning: describing a compound (a substance made by joining two or more other substances) that does
  not have carbon as its base
scope: In chemistry, this is for a compound that does not have carbon as its base, not for a thing that
  is not living and shows no signs of living things.
examples:
- Hydrochloric acid is an inorganic substance studied in chemistry class.
- Salt is an inorganic compound with no carbon base.
