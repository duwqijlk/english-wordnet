senseId: 'speakerphone%1:06:00::'
synsetId: 04277481-n
simpleMeaning: a telephone with a part that picks up voice and a part that makes sound loud; you can use
  it without holding it, and several people can join one call
scope: This is a telephone you can use without holding it, so a group can hear and talk together; it is
  not a normal phone held to one person's ear.
examples:
- We put the call on speakerphone so everyone in the room could hear.
- He used the speakerphone at his desk while he typed.
