simpleMeaning: a way of building from northern France, spread across Europe from the 1100s to the 1500s,
  with tall thin posts, side supports that push back, curved roofs and sharp-topped arches
scope: A medieval way of building with pointed arches; Gothic architecture is another name for this sense;
  not the Gothic language and not the Gothic typeface.
examples:
- The Gothic cathedral has tall pointed arches.
- Gothic churches spread across Europe in the Middle Ages.
