simpleMeaning: A swift of America that makes its nest in chimneys no longer in use.
scope: A swift of America that nests in chimneys, not a swallow that nests in barns or a swift of the
  Old World; also called chimney swallow and chimney swift.
examples:
- A Chateura pelagica nested in our unused chimney.
- Chateura pelagica swifts flew fast over the town at dusk.
