simpleMeaning: Dried leaves of the hemp plant, smoked or chewed to give a lifted, happy feeling, are the
  illicit drug most often used, and one thought mild.
scope: People also call it marijuana, ganja, and cannabis, and the word names the dried leaves, not the
  hemp plant they come from.
examples:
- Marihuana is smoked or chewed for a lifted, happy feeling.
- She smoked marihuana and felt lifted and happy.
