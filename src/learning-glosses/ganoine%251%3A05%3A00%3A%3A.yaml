simpleMeaning: A glossy material much like enamel, produced by the deeper skin of some fishes, particularly
  ganoid fishes, and coats the outside of their scales.
scope: The glossy enamel-like covering on the scales of ganoid fishes; ganoin is another spelling for
  the same substance, not the enamel of teeth.
examples:
- Ganoine gives the scales of gar and other ganoid fishes their glossy surface.
- Under the microscope, the ganoine layer showed fine ridges across the scale.
