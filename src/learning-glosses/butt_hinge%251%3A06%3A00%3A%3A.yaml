senseId: 'butt_hinge%1:06:00::'
synsetId: 02931683-n
simpleMeaning: a joint that lets a door swing, cut into the edge of the door and its frame so it sits
  level with the wood
scope: A joint that lets a door swing, set level into the edge of the door and frame, not a strap on the
  face of the door and not a loose pin.
examples:
- The carpenter fitted a butt hinge into the edge of the door.
- A butt hinge sits level with the wood, so the door closes flat against the frame.
