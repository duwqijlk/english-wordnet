simpleMeaning: to do with treating illness by cutting into the body, rather than by other kinds of care
scope: Illness or care that calls for an operation, not simply anything to do with operations.
examples:
- The doctor said the lump needed surgical care, not drugs.
- He was sent for a surgical opinion on his knee.
