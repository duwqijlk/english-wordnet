simpleMeaning: a tiny cell made when two fungi join, formed inside a sac in the fungus
scope: A spore made inside a sac after two fungi join, not a spore made on the outside of a fungus and
  not the sac itself.
examples:
- Each ascospore forms inside a small sac in the fungus.
- The ascospore was let out of the sac when it was ripe.
