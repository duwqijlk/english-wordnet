simpleMeaning: of or from one group of tiny living things that use light from the sun to make food, or
  caused by them
scope: Of or from one group of tiny living things that use sunlight to make food, also called cyanobacterial;
  not about other germs that do not use sunlight to make food.
examples:
- The cyanophyte growth spread across the pond in the summer sun.
- The scientist studied the cyanophyte film that had formed on the rocks.
