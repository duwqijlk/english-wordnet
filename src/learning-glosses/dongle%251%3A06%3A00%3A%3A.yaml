simpleMeaning: In computer science, an electronic device that must be plugged into a computer before the
  computer can use software kept safe from copying
scope: An electronic device that lets a computer use guarded software when plugged in, not a built-in
  part of the computer and not a program itself.
examples:
- The program would not start until I plugged the dongle into the computer.
- She lost the dongle, so the office computer could not run the design software.
