simpleMeaning: A small bushy deciduous tree from Asia and North Africa, with pretty pink blossoms and
  prized edible nuts in hard green hulls; cultivated in southern Australia and California.
scope: The tree that produces the edible nut, not the nut itself; sweet almond is another name for this
  same tree.
examples:
- Almond trees flower early, before most other fruit trees.
- The orchard was planted with almond trees brought from Asia.
