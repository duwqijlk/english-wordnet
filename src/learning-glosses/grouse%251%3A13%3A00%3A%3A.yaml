simpleMeaning: the meat of any of several kinds of bird in one family (the Tetraonidae, a group of related
  birds), usually roasted, and too dry to cook under direct heat
scope: The meat of this bird for eating, not the living bird itself and not hunting it.
examples:
- We had grouse for dinner, roasted with herbs.
- The cook said the grouse was too dry to cook under direct heat.
