simpleMeaning: having to do with, made of, or holding the seed-making parts of a flower
scope: A word for things to do with the seed-making parts of a flower, not the flower parts that make
  pollen and not the flower as a whole.
examples:
- The carpellary wall of the fruit grows thick as the seeds ripen.
- This carpellary tissue helps hold the seeds in place.
