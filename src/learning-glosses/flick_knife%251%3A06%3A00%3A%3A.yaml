simpleMeaning: press a small button and the sharp edge jumps out of this small cutting tool that fits
  in a pocket
scope: 'Also called a flick-knife and a switchblade: a small cutting tool that fits in a pocket and opens
  at the press of a button, not a fixed cutting tool and not one made for cutting food.'
examples:
- The flick knife snapped open when he pressed the button.
- She kept a flick knife in her coat pocket.
