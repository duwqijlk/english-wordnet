scope: This is a small group of ways of speaking from the Tibet and Burma area, also called Himalayish,
  and it sits inside the larger Tibeto-Burman family rather than being a separate full family.
examples:
- Tibetan and Newari are both part of the Himalayish language group.
- The Himalayish language group is not a standard one, though it holds Tibetan and Newari.
