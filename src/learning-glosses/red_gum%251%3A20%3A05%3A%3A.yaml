simpleMeaning: A sticky stuff, dry and rusty brown, that comes out of any of several trees of the Eucalyptus
  kind, above all Eucalyptus camaldulensis.
scope: This sticky stuff from Eucalyptus trees is also called eucalyptus gum and eucalyptus kino, not
  the sap of the North American Liquidambar tree.
examples:
- Red gum oozed from a cut in the trunk.
- We found red gum dried hard on the bark.
