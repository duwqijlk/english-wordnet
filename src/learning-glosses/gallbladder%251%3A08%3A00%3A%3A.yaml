simpleMeaning: A bag of muscle joined to the liver, holding the fluid the liver makes until it is needed
  to break down food.
scope: Also called a gall bladder, this is a bag of muscle joined to the liver, not the liver itself.
examples:
- The gallbladder stores bile until the body needs it for digestion.
- Her gallbladder was taken out after it kept causing pain.
