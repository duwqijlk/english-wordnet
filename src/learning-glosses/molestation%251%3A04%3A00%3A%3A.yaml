simpleMeaning: the act of making a person suffer again and again, with attacks that keep going and words
  that say bad things about the person
scope: This sense, also called harassment, is about making a person suffer by attacks and bad words that
  keep going. Not unwanted sexual acts toward a person.
examples:
- He complained of molestation by newspapers that kept attacking him in print day after day.
- The worker faced molestation at work, with shouting and blame that went on for months.
