simpleMeaning: This golden fungus often springs up near the roots of trees in late summer and autumn,
  but eat it only after cooking.
scope: It is also called a honey fungus, a golden fungus found at tree roots in late summer and autumn
  that is safe to eat only after cooking.
examples:
- The honey mushroom at the foot of the tree was golden in colour.
- She cooked the honey mushroom well before she ate any of it.
