simpleMeaning: in sports, the share of attempts that succeed, expressed as a ratio or percentage
scope: This is a sports success rate, not the mathematical mean of a set of numbers or the usual level
  on a scale.
examples:
- His batting average fell to .240 this season.
- The team's shooting average improved once the new coach arrived.
