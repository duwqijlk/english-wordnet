simpleMeaning: Served with tomato sauce, this is young beef cut as a slice, fried quickly in a coat of
  crumbs and cheese.
scope: Also called veal parmigiana, this is young beef cut as a slice and fried quickly in crumbs and
  cheese, served with tomato sauce, not plain beef with no coat.
examples:
- We ordered veal parmesan at the restaurant.
- The veal parmesan came with tomato sauce.
