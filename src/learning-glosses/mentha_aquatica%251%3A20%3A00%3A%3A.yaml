simpleMeaning: A mint of Europe that grows well in wet places, with a scent like that of the bergamot
  orange, now at home in the east of North America.
scope: 'Also called water-mint and water mint: a European mint of wet places with a scent like the bergamot
  orange, now at home in eastern North America.'
examples:
- Mentha aquatica grew thick by the wet ditch, its scent like bergamot orange.
- We found Mentha aquatica in the marsh, now at home in North America.
