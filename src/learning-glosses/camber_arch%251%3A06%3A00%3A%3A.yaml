simpleMeaning: A curve with a flat straight top and a lower edge that bends up only a little.
scope: A low curve over an opening, with a flat top and a lower edge that bends up only a little; not
  a half-round arch and not a flat beam.
examples:
- The camber arch over the door has a nearly flat top.
- Builders used a camber arch to span the wide window.
