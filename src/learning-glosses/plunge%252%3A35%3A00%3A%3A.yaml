simpleMeaning: to put a thing into a liquid for a short time, so it gets wet right through or is covered
  with the liquid
scope: To put a thing into a liquid for a short time, not to fall fast and hard and not to push a thing
  deep into something.
examples:
- She plunged the brush into the paint.
- He plunged the cloth into the water and wrung it out.
