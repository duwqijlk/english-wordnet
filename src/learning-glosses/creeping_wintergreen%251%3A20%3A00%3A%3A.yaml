simpleMeaning: A low, spreading shrub of eastern North America. It has white bell-shaped flowers, shiny
  fragrant leaves, and a spicy red fruit, and is the source of a fragrant oil.
scope: Another name for the low eastern North American wintergreen shrub, not the spicy red berry it bears
  and not the unrelated scarlet-flowered shrub sometimes placed in genus Styphelia. Checkerberry, ground-berry
  and teaberry are other names for the same plant.
examples:
- Creeping wintergreen kept its shiny leaves through the coldest months.
- A patch of creeping wintergreen covered the rocky bank.
