simpleMeaning: The falling in of a star under its own pull, leaving a smaller and denser body in the sky
scope: This is a star falling in under its own pull, not a star blowing up and not a star cooling down.
examples:
- The gravitational collapse of the old star left a dense core.
- Astronomers watched the gravitational collapse through their telescopes.
