simpleMeaning: the annoying act of mocking a person or finding fault with them in an unkind way
scope: 'Also called taunt and taunting: unkind mocking as a thing done to a person, not the verb sense
  of doing it again and again.'
examples:
- His twit about her accent was meant to make her feel small.
- The class laughed at the twit aimed at the new boy.
