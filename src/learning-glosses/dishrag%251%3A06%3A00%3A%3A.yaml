simpleMeaning: a cloth used for washing plates, cups and pans
scope: Also called dishcloth, this is a cloth for washing plates and cups, not a cloth for drying them
  and not a cloth for cleaning floors.
examples:
- She washed the plates with a dishrag and warm, soapy water.
- He picked up the dishrag to clean a dirty pan.
