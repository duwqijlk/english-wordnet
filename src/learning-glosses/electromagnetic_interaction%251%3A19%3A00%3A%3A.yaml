simpleMeaning: Photons carry this push or pull between tiny charged bits of matter, a force in strength
  between the strong and weak forces
scope: A push or pull between tiny charged bits of matter, not the strong force, not the weak force, and
  not gravity.
examples:
- The electromagnetic interaction holds electrons round the nucleus.
- Light moves by the electromagnetic interaction between charged bits.
