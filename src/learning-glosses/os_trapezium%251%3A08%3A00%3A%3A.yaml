simpleMeaning: This bone sits in the wrist on the thumb side, where it meets the first and second long
  bones of the hand.
scope: On the thumb side of the wrist, also called trapezium and trapezium bone, this bone joins the first
  and second long bones of the hand.
examples:
- The os trapezium meets the first long bone of the hand.
- The thumb side of the wrist holds the os trapezium.
