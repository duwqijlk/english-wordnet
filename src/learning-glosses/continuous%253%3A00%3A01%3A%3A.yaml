simpleMeaning: going on in time or space with no stops or gaps
scope: Going on in time or space with no stops or gaps, not the maths sense for a function or curve that
  goes on with no break and no uneven part.
examples:
- She lived in continuous fear for many months.
- A continuous row of houses lined the street.
