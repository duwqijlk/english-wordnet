simpleMeaning: In law, the formal ending of a marriage, a contract, a court case or the like
scope: In law, the formal ending of a marriage, a contract, a court case or the like, also called annulment;
  not a divorce by mutual agreement and not a ruling against a person.
examples:
- The invalidation of the marriage took effect at once.
- He sought the invalidation of the contract in court.
