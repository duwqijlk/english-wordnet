simpleMeaning: A point people disagree about, most often left for a jury to settle
scope: 'Also called a matter of fact: a point in dispute left to a jury, not a point of law for a judge.'
examples:
- Whether he was there is a question of fact for the jury.
- The question of fact was left to the jury, not the judge.
