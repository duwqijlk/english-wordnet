schema: oewn-learning-gloss-v2
senseId: 'eulogy%1:10:00::'
synsetId: 06707104-n
simpleMeaning: a formal speech or piece of writing that says good things about a person who has died not
  long ago
scope: This sense is praise for a person who has died not long ago; it is not praise for a living person
  or for a thing in general.
examples:
- She gave a moving eulogy at her father's funeral.
- The eulogy spoke of his kindness and his work for others.
