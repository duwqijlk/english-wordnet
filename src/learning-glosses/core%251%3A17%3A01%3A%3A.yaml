simpleMeaning: a tube of rock or soil that a hollow drill brings up from the ground
scope: This sense is a tube-shaped piece of rock or soil pulled up by a hollow drill; it is not the Earth's
  inner centre, and not an object's middle.
examples:
- The drill brought up a core of rock from two hundred metres down.
- Scientists studied a soil core to learn about past climate.
