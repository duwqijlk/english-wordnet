simpleMeaning: usually a sports tool with a handle and an oval frame strung with tight cords, used to
  hit a ball or a shuttlecock in a game
scope: A sports tool for hitting a ball or shuttlecock in a game, not a loud noise, not a noisy party,
  and not a crooked business.
examples:
- She gripped her racket and served.
- His racket strings broke during the match.
