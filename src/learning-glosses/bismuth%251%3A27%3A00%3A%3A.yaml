simpleMeaning: A heavy brittle metal joining three other atoms, not drawn to a magnet, like arsenic and
  antimony; usually got as a by-product from the ores of other metals.
scope: 'Also called Bi and atomic number 83: a heavy brittle metal that joins with three other atoms and
  resembles arsenic and antimony, usually got as a by-product from the ores of other metals.'
examples:
- Bismuth is usually got from the ores of other metals.
- The bismuth sample was heavy and brittle.
