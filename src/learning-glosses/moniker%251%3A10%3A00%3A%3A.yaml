simpleMeaning: a name people who know a person use for them, often a short form of the person's first
  name
scope: 'Also called nickname, sobriquet, and cognomen: a name people who know a person use for them, not
  the person''s first name by itself.'
examples:
- His moniker was Slim, though his first name was Henry.
- At school she was known by the moniker Jo, short for Josephine.
