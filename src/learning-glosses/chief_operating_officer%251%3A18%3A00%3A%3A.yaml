simpleMeaning: a top manager of a company who runs its day-to-day work, answers to the board, and can
  choose other managers, even a president
scope: 'Also called chief executive officer: the top manager who runs the day-to-day work of a company
  and answers to its board, not a manager who runs only one part of a company and not a president who
  runs the whole company.'
examples:
- As chief operating officer, she runs the daily work of the whole company.
- The chief operating officer told the board that he had chosen a new president.
