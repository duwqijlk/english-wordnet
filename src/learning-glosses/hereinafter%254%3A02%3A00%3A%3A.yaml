simpleMeaning: in a later part of this document, statement, or other matter
scope: 'Also called hereafter: in a later part of this document or statement; not about a later time in
  life or what happens after death.'
examples:
- The company, hereinafter called the Seller, agrees to deliver the goods in May.
- The rules set out hereinafter apply to all members of the group.
