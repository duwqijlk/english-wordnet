simpleMeaning: In the shape of a circle, or moving in a circle
scope: Also called circular and orbital, this describes the shape of a circle or moving in a circle; it
  is not the place where roads meet, and not the wider sense of having to do with turning of any kind.
examples:
- Draw the rotary path of the ball as it goes round the ring.
- Its rotary movement takes it round in a full circle again and again.
