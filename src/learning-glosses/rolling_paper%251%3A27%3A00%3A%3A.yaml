simpleMeaning: Tobacco in a cigarette keeps burning at a steady pace because this strong thin tissue lets
  just enough air through and burns with a steady flame.
scope: Cigarette paper is another name for this strong thin tissue, which keeps the tobacco in a cigarette
  burning at a steady pace.
examples:
- He rolled the tobacco in rolling paper.
- He lit the cigarette rolled in rolling paper.
