simpleMeaning: A black colour for paint made by grinding burnt ivory in oil.
scope: A dark colour for paint, made from burnt elephant tusk ground in oil; not a black stone and not
  a black dye.
examples:
- The artist mixed ivory black into the paint for the shadows.
- A tube of ivory black sat among the oils on her shelf.
