senseId: 'gamelan%1:14:00::'
synsetId: 08265442-n
simpleMeaning: A traditional Indonesian music group, usually with many tuned percussion instruments such
  as bamboo xylophones and wooden or bronze chimes and gongs.
scope: This sense names the whole Indonesian ensemble, not a single instrument or a Western orchestra.
  The tuned percussion such as bamboo xylophones and bronze gongs is typical of it rather than a fixed
  list.
examples:
- The gamelan began to play, and the courtyard fell silent.
- She learned to play the gongs in a village gamelan.
