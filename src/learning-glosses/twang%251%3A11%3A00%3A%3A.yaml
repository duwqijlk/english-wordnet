simpleMeaning: A sharp sound that shakes fast, like the sound of a string that has been plucked.
scope: A sharp sound that shakes fast, like the sound of a string that has been plucked; not a nasal way
  of speaking, and not the act of plucking a string.
examples:
- The twang of the guitar string filled the room.
- He heard the twang of the bow as the arrow flew.
