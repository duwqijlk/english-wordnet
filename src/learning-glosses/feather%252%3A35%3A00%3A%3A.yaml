simpleMeaning: to cover something with, or add to something, the light soft parts that grow on a bird's
  body
scope: About putting feathers on something; not a bird growing its own feathers, and not the feather itself.
examples:
- The maker feathered the arrows with goose feathers.
- Costume makers feathered the hats for the show.
