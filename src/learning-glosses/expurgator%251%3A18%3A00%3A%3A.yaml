simpleMeaning: A person who cleans up a text by taking out rude or offensive words or parts.
scope: A person who cleans up a text by taking out rude or offensive words; also called a bowdleriser
  or a bowdlerizer, not a person who writes a text and not a person who bans a book outright.
examples:
- Thomas Bowdler was a famous expurgator.
- The expurgator removed the coarse passages from the play.
