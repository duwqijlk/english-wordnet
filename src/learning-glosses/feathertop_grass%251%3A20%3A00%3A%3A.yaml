simpleMeaning: A plant of the north-east of tropical Africa with soft, light, branched flower heads.
scope: A plant of the north-east of tropical Africa with soft, light, branched flower heads, also called
  feathertop; not a fern and not a tall palm.
examples:
- Feathertop grass grows in north-east tropical Africa.
- The feathertop grass waved its soft flower heads in the wind.
