simpleMeaning: Either of two yellow-to-red pigments in the eye, made from rhodopsin, a substance in the
  eye that reacts to light, when light falls on it.
scope: One of two pigments in the eye made by light, not the adjective for things of the retina.
examples:
- Retinal helps the eye sense light and dark.
- The lab studied retinal in the eyes of fish.
