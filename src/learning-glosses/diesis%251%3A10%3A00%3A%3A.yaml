simpleMeaning: A mark used in printing to point to a third note or cross reference, after the star and
  the dagger have been used
scope: This is a mark used in printing to point to a third note; double dagger and double obelisk are
  other names for it, not the star that points to the first note and not the dagger that points to the
  second.
examples:
- The editor added a diesis beside the third note.
- A diesis follows the asterisk and the dagger in the list of notes.
