simpleMeaning: The top boss of a company, in charge of its daily running, who answers to a board of directors
  and may choose other managers, including a president
scope: This is the top boss of a company, in charge of its daily running; chief executive officer and
  chief operating officer are other names for this sense.
examples:
- The CEO announced the new plan to the whole company.
- Our CEO meets the board of directors every month.
