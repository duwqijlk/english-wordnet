simpleMeaning: In botany, one of the parts that a leaf is split into
scope: In botany, a part of a leaf, not a rounded part of a body organ and not a part linked to an antenna.
examples:
- Each lobe of the leaf is round and soft.
- This plant has a leaf with one deep lobe in the middle.
