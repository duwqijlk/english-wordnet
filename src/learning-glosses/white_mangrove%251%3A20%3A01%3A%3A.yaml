simpleMeaning: A small to middle-sized tree that grows in salty water, above all along the shores of the
  south-west Pacific
scope: A small to middle-sized tree of salty water; not a tall dry-land tree and not a bush of fresh water.
examples:
- White mangrove roots stand in the salty water at low tide.
- We saw white mangrove along the shore.
