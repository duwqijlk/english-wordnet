scope: A long-term skin illness tied to oily skin, with greasy flakes on the scalp, eyelids or other parts
  of the skin, also called seborrheic dermatitis; not psoriasis and not plain dandruff.
examples:
- Seborrheic eczema left greasy flakes on his scalp.
- She treats her seborrheic eczema with a special shampoo.
