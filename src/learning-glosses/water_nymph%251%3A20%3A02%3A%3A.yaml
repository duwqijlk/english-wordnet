simpleMeaning: Found in warm and cool parts of the world, this lily has big leaves and sweet-smelling
  blooms that catch the eye and float on ponds.
scope: Also called fragrant water lily and pond lily, it is the lily with big leaves and sweet-smelling
  blooms that float on ponds, unlike a lily that grows on dry land.
examples:
- The water nymph floated on the pond, its big leaves and sweet-smelling blooms catching the eye.
- Water nymphs are lilies of warm and cool parts of the world, with big leaves and blooms that float on
  ponds.
