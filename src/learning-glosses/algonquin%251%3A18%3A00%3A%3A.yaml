simpleMeaning: A member of a North American Indian group speaking its language, once in the far north
  of eastern Canada; many moved south into woods from the Mississippi to the Atlantic.
scope: 'Also called Algonquian: a member of one of these Indian groups, not a speaker of the language
  family as a whole and not the adjective for things of these peoples.'
examples:
- An Algonquin elder told stories of the old northern camps.
- Many Algonquin families moved south into the woodlands long ago.
