simpleMeaning: Growing up without a resting stage, the young of such an insect look much like the grown
  one.
scope: Heterometabolous is another name for insects of this kind, whose young look like the grown ones
  and skip the resting stage.
examples:
- The heterometabolic nymph looked almost the same as the adult insect.
- A heterometabolic insect has no pupal stage in its growth.
