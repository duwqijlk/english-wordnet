simpleMeaning: The flower of the state of Maryland, from the middle and south-east of the United States,
  with daisy-like flowers that have dark middles and yellow to orange rays.
scope: 'Also called Rudbeckia hirta and Rudbeckia serotina: the flower of the state of Maryland, from
  the middle and south-east of the United States, with daisy-like flowers that have dark middles and yellow
  to orange rays, not the yearly weed or the climbing plant of the same name.'
examples:
- Black-eyed Susan blooms yellow along the fence.
- Black-eyed Susan is the state flower of Maryland.
