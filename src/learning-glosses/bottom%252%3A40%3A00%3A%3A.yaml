simpleMeaning: to fit something with a base or with a part for sitting
scope: This is fitting an object with a base or sitting part, not the lowest part or underside of something,
  not the body part you sit on, not a half of an inning, not reaching the ground, and not coming to understand
  something.
examples:
- They bottomed the chairs with woven cane.
- The craftsman bottomed each chair with a solid wooden seat.
