simpleMeaning: with a tuft on top, made up of leaves, branches, or leaf-like parts
scope: Having a tuft on top made of leaves or branches; comose is another name for this sense; not a bare
  top, and not a single flower.
examples:
- The comate royal palm had a tuft of leaves at its top.
- Pineapples are comate, with a tuft of stiff leaves on top.
