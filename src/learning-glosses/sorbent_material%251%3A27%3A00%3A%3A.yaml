simpleMeaning: Something that takes in another material, by soaking it up or by holding it on its face
scope: A substance that takes in another substance, by soaking it up or by holding it on its face; also
  called sorbent; not a substance that pushes things away, and not a substance that breaks things down.
examples:
- The sorbent material drew the dye out of the water.
- Workers spread sorbent material over the spill.
