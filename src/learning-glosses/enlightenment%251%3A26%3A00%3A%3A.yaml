simpleMeaning: In Hinduism and Buddhism, a state of great happiness and peace, free from being born again
  and again, with no more wanting, pain, or separate sense of self
scope: 'Also called nirvana: this is a state of great peace in Hinduism and Buddhism, not learning facts
  or coming to understand something in everyday life.'
examples:
- In Buddhism, enlightenment ends the long cycle of being born again.
- She hoped to reach enlightenment and be free from all wanting and pain.
