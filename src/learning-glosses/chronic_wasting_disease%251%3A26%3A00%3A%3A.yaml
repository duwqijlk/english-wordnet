simpleMeaning: Deer and elk grow thin and weak over time from this sickness of wild animals, like the
  mad cow sickness
scope: This sickness of wild animals is like the mad cow sickness and makes deer and elk grow thin and
  weak over time; not the cow sickness itself.
examples:
- The deer had chronic wasting disease and grew thin and weak.
- Chronic wasting disease affects deer and elk.
