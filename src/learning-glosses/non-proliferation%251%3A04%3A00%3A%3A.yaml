simpleMeaning: Stopping a thing from growing or spreading, most of all stopping more countries from getting
  nuclear arms
scope: Stopping a thing from growing or spreading, most of all stopping more countries from getting nuclear
  arms; nonproliferation is another name for this sense, not disarmament, which takes away arms already
  held.
examples:
- The non-proliferation treaty aims to stop more countries from getting nuclear arms.
- She wrote her thesis on non-proliferation and the spread of nuclear arms.
