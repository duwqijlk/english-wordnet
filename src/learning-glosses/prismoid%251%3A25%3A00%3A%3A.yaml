simpleMeaning: a solid shape with two many-sided flat ends with the same number of sides and four-sided
  side faces with one pair or two pairs of sides running the same way
scope: A solid shape with two many-sided flat ends; not a prism, whose ends are the same shape, and not
  a pyramid, which ends in a point.
examples:
- The prismoid has two flat ends with five sides each.
- We drew a prismoid with a square top and a larger four-sided base.
