simpleMeaning: Any time of cruel crushing by those in power, thought to be like the time of fear in France.
scope: Any time of cruel crushing by those in power, thought to be like the time of fear in France; not
  a single act of cruelty and not a war.
examples:
- The reign of terror silenced all who spoke against the rulers.
- A reign of terror gripped the city for months.
