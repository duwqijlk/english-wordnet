simpleMeaning: a performance of a piece of music or of a part in a play
scope: 'Also called rendering: a performance of a piece of music or a part in a play. It is not handing
  over prisoners to another country, and it is not only the way a performer understands a work.'
examples:
- The singer gave a slow rendition of the old song.
- Their rendition of the play's last scene made the crowd cry.
