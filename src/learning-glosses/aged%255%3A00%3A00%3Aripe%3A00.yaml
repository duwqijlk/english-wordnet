simpleMeaning: 'Of wine, fruit, or cheese: ready to use or eat after being kept until it is at its best,
  said in one sound'
scope: Of wine, fruit, or cheese at its best after being kept, not a person of a set age, not an old person,
  and not tobacco kept to stay good.
examples:
- They served mature well-aged cheeses.
- The aged wine tasted at its best after ten years.
