simpleMeaning: A false charge that someone has done wrong, or a spiteful twist put on what they said or
  did.
scope: A false charge or a spiteful twist on what a person said or did, also called calumny, calumniation,
  a hatchet job, obloquy, or traducement.
examples:
- The article was defamation, and she sued the paper.
- He called the rumour defamation and asked for it to be taken down.
