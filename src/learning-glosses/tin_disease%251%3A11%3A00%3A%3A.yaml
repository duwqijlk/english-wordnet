simpleMeaning: The change of ordinary white tin into powdery grey tin at very cold temperatures
scope: Also called tin pest and tin plague, it is what happens to ordinary white metal when the cold grows
  very hard.
examples:
- In very cold weather, tin disease turns white metal grey and powdery.
- The white metal had gone grey and powdery from tin disease.
