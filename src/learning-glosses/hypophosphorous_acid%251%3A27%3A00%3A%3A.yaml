simpleMeaning: A clear or yellow sour chemical, H3PO2, with one hydrogen part that can be swapped for
  a metal
scope: A clear or yellow sour chemical with one hydrogen part that can be swapped, also called orthophosphorous
  acid and phosphorous acid; not a sour chemical with more than one such part.
examples:
- The bottle held hypophosphorous acid, a clear liquid with the formula H3PO2.
- The hypophosphorous acid in the jar was yellow, not clear.
