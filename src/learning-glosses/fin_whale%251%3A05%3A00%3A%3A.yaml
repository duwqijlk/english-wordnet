simpleMeaning: Deep grooves score the throat of this big flat-headed whale of the Atlantic and Pacific,
  whose mouth holds plates.
scope: Also called common rorqual, finback, or finback whale, this is the big flat-headed whale of the
  Atlantic and Pacific whose throat bears deep grooves and whose mouth holds plates.
examples:
- A fin whale rose to the surface, its flat head breaking the water.
- Fin whales live in the Atlantic and Pacific oceans.
