simpleMeaning: a Communist Party official who taught soldiers in a military unit the ideas the Party believed
  in
scope: A Party official who teaches soldiers the Party's ideas, not a general who leads troops in battle
  and not a teacher in a school.
examples:
- The commissar explained the Party's rules to the new soldiers.
- A commissar was sent to the unit to teach party principles.
