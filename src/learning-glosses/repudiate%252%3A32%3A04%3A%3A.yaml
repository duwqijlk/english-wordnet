simpleMeaning: to say that something is not true, is not based on facts, or is not fair, and to refuse
  to accept it
scope: This is saying that a claim is not true, not based on facts, or not fair. It is not the sense of
  refusing to accept that a deal or a decision still holds.
examples:
- She repudiated the accusations made against her.
- He repudiated the claim that he had taken the money.
