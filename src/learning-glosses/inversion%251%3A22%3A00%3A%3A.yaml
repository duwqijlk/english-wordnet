senseId: 'inversion%1:22:00::'
synsetId: 13523408-n
simpleMeaning: In chemistry, a change in which a substance stops turning light to the right and turns
  it to the left instead, or the other way round.
scope: In chemistry, the turning of light by a substance reversed, not the turning of a melody upside
  down, not an organ turned inward, not a change in the order of genes, not taking on the other sex's
  part, and not a layer of warm air over cold.
examples:
- The inversion of the sugar solution changed the way it bent light.
- Chemists watched the inversion as the mixture was heated.
