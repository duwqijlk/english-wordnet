simpleMeaning: A salt of potassium (KCl), sold under names such as K-Dur 20, Kaochlor, K-lyte and Klorvess,
  taken as pills to treat low potassium in the body.
scope: 'Also called potash muriate, potassium chloride, potassium muriate, K-Dur 20, K-lyte, Kaochlor,
  or Klorvess: a salt of potassium taken as pills, not a salt used in cooking and not a drug that lowers
  blood pressure.'
examples:
- The doctor gave her K-lor for low potassium.
- K-lor comes in pill form.
