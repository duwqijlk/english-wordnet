simpleMeaning: In some fungi, most of all those in the group called Tremellales, a special cell forms
  the bottom of the basidium, the part that makes spores
scope: The base part of a spore-making cell in some fungi, not the whole basidium and not the spores it
  makes.
examples:
- The hypobasidium forms the base of the basidium in these fungi.
- In Tremellales, the hypobasidium sits at the base of the basidium.
