simpleMeaning: a gentleman who is brave and has polite manners, of the kind expected at a king's or queen's
  court
scope: This is a brave, polite gentleman; it is not a careless way of treating a problem or other people's
  feelings.
examples:
- The cavalier helped the lady onto her horse with a bow.
- He was a true cavalier, brave in battle and kind to everyone he met.
