simpleMeaning: The work of planning how the inside of a house, office, or other building looks
scope: Planning how the inside of a building looks and is laid out; not the work of planning the building
  itself, and not just picking one piece of furniture.
examples:
- She studied interior design before opening her own firm.
- The interior design of the office made the small rooms feel open.
