simpleMeaning: A plant of the cool north that lives for years, with toothed leaves and round tops of small
  purple-white flowers
scope: 'Also called livelong, live-forever, or orpin: a cool-north plant with toothed leaves, not a garden
  rose and not a weed of warm lands.'
examples:
- Orpine grew by the stone wall with its purple-white flowers.
- The orpine comes back each year from its thick roots.
