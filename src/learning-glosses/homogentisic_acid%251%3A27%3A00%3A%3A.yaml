senseId: 'homogentisic_acid%1:27:00::'
synsetId: 14609228-n
simpleMeaning: A sour chemical made part-way through the body's breaking down of two building blocks of
  protein, tyrosine and phenylalanine
scope: A sour chemical made in the body while it breaks down tyrosine and phenylalanine, also called alcapton
  and alkapton; not the starting chemicals themselves, and not a finished waste product.
examples:
- The test found homogentisic acid in his urine.
- Homogentisic acid builds up when the body cannot break it down further.
