simpleMeaning: a special quality or way of doing things that makes a person or thing easy to know and
  different from others
scope: This is a special quality that marks a person or thing out, not the registered sign that shows
  who made or sells a product.
examples:
- Her warm laugh is her trademark in every film she makes.
- A red hat became his trademark, and people knew him by it.
