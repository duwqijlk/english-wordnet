simpleMeaning: A low, spreading shrub of eastern North America. It has white bell-shaped flowers, shiny
  fragrant leaves, and a spicy red fruit, and is the source of a fragrant oil.
scope: Another name for the low eastern North American wintergreen shrub, not the spicy red berry it bears.
  It is also not the separate small shrub with scarlet flowers and cranberry-like fruit that shares the
  same name. Checkerberry, creeping wintergreen and teaberry are other names for this plant.
examples:
- Groundberry grew thickly along the shaded woodland path.
- The groundberry leaves gave off a spicy scent when crushed.
