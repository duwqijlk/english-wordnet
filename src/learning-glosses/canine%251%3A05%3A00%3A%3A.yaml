simpleMeaning: one of a group of mammals with separate toes, claws that cannot be pulled in, and usually
  a long nose and mouth, such as a dog or a wolf
scope: 'Also called canid: an animal like a dog or a wolf, not a pointed tooth and not a word describing
  a tooth or this group of animals.'
examples:
- The wolf is a wild canine that lives in groups.
- The zoo keeps several canines, such as wolves and foxes.
