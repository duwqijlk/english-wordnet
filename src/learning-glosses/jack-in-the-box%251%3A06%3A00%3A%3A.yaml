simpleMeaning: A toy clown that jumps out of a case when a top lifts.
scope: A plaything made of a toy clown that jumps out when its lid is opened, not a doll that stays still
  and not a toy that only plays music.
examples:
- The jack-in-the-box made the baby laugh when the clown popped up.
- He wound the jack-in-the-box and waited for the lid to fly open.
