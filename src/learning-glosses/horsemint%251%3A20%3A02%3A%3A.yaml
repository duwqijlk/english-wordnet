simpleMeaning: A tall, straight plant living a year or more, with spear-shaped leaves and purple-spotted
  creamy flower heads, in many kinds from east to southwest United States and Mexico.
scope: A tall, straight plant living a year or more, with spear-shaped leaves and purple-spotted creamy
  flower heads, in many kinds from east to southwest United States and Mexico, unlike the sense for a
  coarse Old World wild water mint with long leaves and spikelike flower clusters, growing wild in the
  eastern United States.
examples:
- Horsemint grows from east to southwest United States.
- Horsemint has purple-spotted flowers.
