simpleMeaning: a form of quartz (a hard stone) that is not pure, with bands of chalcedony (another hard
  stone), used as a stone for jewellery and for grinding bowls and tools
scope: A hard stone with bands, used for jewellery and grinding tools, not a plain clear stone with no
  bands.
examples:
- Her ring was set with a polished agate that had white bands.
- The old shop sold bowls made from agate for grinding spices.
