simpleMeaning: in baseball, the first half of an inning, when the visiting team is batting.
scope: This sense is not the highest part or upper surface of something, not a lid or cover, and not the
  later half of an inning when the home team bats.
examples:
- The visitors scored twice in the top of the fifth.
- He struck out swinging in the top of the ninth.
