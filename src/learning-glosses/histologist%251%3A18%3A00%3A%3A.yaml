simpleMeaning: a person who studies tiny bits of animal flesh under a microscope, as their main work
scope: A person who studies animal tissue under a microscope, not a doctor who treats sick people and
  not a person who studies whole bodies.
examples:
- The histologist looked at the thin slice under her microscope.
- A histologist can tell healthy flesh from sick flesh.
