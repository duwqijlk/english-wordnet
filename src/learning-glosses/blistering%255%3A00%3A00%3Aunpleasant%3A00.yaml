simpleMeaning: a harsh tone in speech or writing that hurts the hearer
scope: Harsh, biting words or tone, with bitter, acid and acrid as other names for this sense; not small
  bubbles in the skin and not heat that raises blisters.
examples:
- Her blistering criticism left the whole room silent.
- The review was a blistering attack on the new play.
