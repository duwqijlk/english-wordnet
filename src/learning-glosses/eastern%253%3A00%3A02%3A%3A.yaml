simpleMeaning: of or typical of the eastern part of the United States.
scope: This is specifically about the United States, not about the eastern side of another country and
  not about Asia.
examples:
- The storm brought heavy snow to the Eastern states.
- Eastern cities such as Boston and New York grew quickly in the nineteenth century.
