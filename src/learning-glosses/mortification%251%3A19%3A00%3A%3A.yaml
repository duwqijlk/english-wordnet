simpleMeaning: the death of the small living parts in one area of the body, as from germs getting in or
  blood not reaching that area
scope: 'Also called gangrene: death of living parts in one area of the body, not the Christian act of
  going without things or hurting yourself to control desire.'
examples:
- Mortification set in around the wound when blood stopped reaching the foot.
- The doctor cut away the tissue lost to mortification after the infection spread.
