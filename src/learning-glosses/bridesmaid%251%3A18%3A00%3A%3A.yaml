simpleMeaning: a woman who is not married who stands with the woman getting married during the wedding
scope: A woman who stands with the woman getting married at the wedding, not the woman getting married
  herself and not a man who stands with the groom.
examples:
- She asked her sister to be a bridesmaid at her wedding.
- The bridesmaid carried the flowers for the bride.
