simpleMeaning: a drink with the same amount of strong coffee (espresso) and hot milk, topped with cinnamon
  and nutmeg and usually whipped cream
scope: 'Also called cappuccino coffee and coffee cappuccino: this is the coffee and hot milk drink with
  spices on top, not a plain cup of coffee with no milk.'
examples:
- She ordered a cappuccino with extra cream on top.
- He drinks a cappuccino every morning at the small cafe.
