simpleMeaning: of a bone, especially the bone at the side of the head, hard as a rock
scope: Also called petrous, this is a bone hard as a rock, not a plant with thick leaves and not hard
  clay ware.
examples:
- The stonelike part of the skull protects the inner ear.
- Doctors found the stonelike bone near the ear was very hard.
