simpleMeaning: a stream that leaves the main river and never flows back into it
scope: A stream that leaves the main river and never flows back into it, and not a stream that joins the
  main river or a small river that starts on its own.
examples:
- The distributary carried water away from the main river toward the sea.
- Farmers dug a channel where the distributary left the river.
