simpleMeaning: A salt with sodium in it, made from carbonic acid, used in making soap powders, glass and
  paper
scope: A salt with sodium in it, made from carbonic acid, used in making soap powders, glass and paper;
  also called soda, sal soda, sodium carbonate and washing soda; not table salt for food, and not a cleaning
  powder on its own.
examples:
- Soda ash is used to make glass.
- The factory buys soda ash for its soap powders.
