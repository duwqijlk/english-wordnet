senseId: 'concretion%1:17:00::'
synsetId: 09253675-n
simpleMeaning: A hard lump that grows when salts in the body join into a solid mass, sitting in a hollow
  part or in a tube that carries fluid.
scope: This hard lump is also called a calculus, and it is not the making of stonelike things inside an
  organ.
examples:
- The doctor found a small concretion in the man's kidney.
- A concretion was found in one of the ducts.
