simpleMeaning: a person with medical training who treats the nerves and the problems that affect them
scope: 'Also called neurologist: a medical expert who treats the nerves and the problems that affect them,
  not one who treats the heart and not one who treats the mind.'
examples:
- She saw a brain doctor about the numbness in her hand.
- The brain doctor ordered a scan of his nerves.
