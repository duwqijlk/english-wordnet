simpleMeaning: the making of a new word by adding a small part to the end of a word
scope: The making of a new word by adding a small part to its end, not the making of a word by adding
  a part to its start.
examples:
- Suffixation turned 'kind' into 'kindness'.
- The suffixation of '-ness' makes a noun from an adjective.
