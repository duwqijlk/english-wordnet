scope: A tree with leaves like a hand and big bunches of white to red flowers, also called buckeye and
  horse chestnut; its brown shiny seeds that cannot be eaten set it apart from trees with seeds good to
  eat.
examples:
- Aesculus hippocastanum bears big bunches of white flowers.
- The brown seeds of Aesculus hippocastanum cannot be eaten.
