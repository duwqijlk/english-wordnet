simpleMeaning: Someone who owns people and keeps them as property
scope: Someone who owns people and keeps them as property, also called a slaver or a slave owner; not
  a person who trades in such people, and not a person who employs free workers.
examples:
- The slaveholder owned the land and everyone who worked it.
- As a slaveholder, he feared the coming war.
