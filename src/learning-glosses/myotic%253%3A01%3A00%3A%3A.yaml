senseId: 'myotic%3:01:00::'
synsetId: 02776080-a
simpleMeaning: Said of a thing that makes the black opening in the middle of the eye grow smaller, or
  has to do with it growing smaller
scope: 'Also called miotic: used of a thing that makes the black opening in the middle of the eye grow
  smaller or has to do with it growing smaller, not a medicine itself and not a thing that makes the opening
  grow wider.'
examples:
- The doctor gave him a myotic drug to make his pupils smaller.
- The myotic drops made the black opening in her eye grow smaller.
