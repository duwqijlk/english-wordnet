simpleMeaning: The seeds of this bushy plant that lives one year are ground into flour, and it is grown
  far and wide in China and Japan.
scope: Also called adzuki bean, this bushy plant is known for seeds that are ground into flour, and it
  is grown far and wide in China and Japan.
examples:
- In the field, adsuki bean grew in bushy rows.
- The mill ground adsuki bean seeds into flour.
