simpleMeaning: whole and complete as a full thing, with nothing needed missing, especially not broken
  or harmed
scope: 'Also called entire and intact: this means whole and complete, not the result in maths and not
  a part that a thing must have.'
examples:
- The old set stayed integral, with every piece still in place.
- They kept the building integral, and no part was harmed in the move.
