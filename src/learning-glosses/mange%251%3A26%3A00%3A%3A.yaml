simpleMeaning: A lasting skin disease that spreads from one animal to another, bringing inflammation,
  itching, and loss of hair, found in tame animals and sometimes in people.
scope: Of tame animals, and sometimes of people, with an inflamed, itching skin losing hair.
examples:
- The dog's mange left bald patches on its coat.
- Mange spread through the shelter's dogs.
