simpleMeaning: a painful sudden tightening of a muscle, especially in the neck or back; rick and wrick
  are British words for it
scope: This pain is also called rick, kink, and wrick. It is a painful tightening in the neck or back,
  not a long-lasting back illness.
examples:
- I woke up with a crick in my neck and could not turn my head.
- He got a crick in his back after lifting the heavy box.
