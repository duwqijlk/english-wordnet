simpleMeaning: A tall one-season marsh elder, common in damp rich soil in central North America, that
  can cause skin rash on touch, making much pollen, main cause of hay fever.
scope: This sense is also called false ragweed.
examples:
- Burweed marsh elder causes skin rash on touch.
- Burweed marsh elder makes much pollen.
