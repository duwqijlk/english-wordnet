simpleMeaning: Under the food laws of Judaism, a food with no meat and no milk, or anything made from
  them, may be eaten with meat dishes or with milk dishes.
scope: 'Also called pareve: food with no meat or milk in it, fit to eat with meat dishes or with milk
  dishes.'
examples:
- The parve bread has no milk in it.
- We bought parve margarine to use with the meat meal.
