simpleMeaning: A small part of matter not made of smaller parts, with no charge, about as heavy as a proton,
  and part of the centre of an atom
scope: This is the part of an atom with no charge, not a proton, which has a positive charge, and not
  an electron, which has a negative charge.
examples:
- Each neutron in the atom has no electric charge.
- Scientists counted each neutron in the centre of the atom.
