simpleMeaning: A hard natural stuff made of iron and nickel mixed with sulphur, the main rock from which
  nickel is got.
scope: A hard natural stuff of iron and nickel mixed with sulphur, the main rock from which nickel is
  got, not a soft clay and not a rock that gives iron.
examples:
- Miners dug pentlandite from the deep pit.
- Pentlandite is the chief source of nickel.
