simpleMeaning: the mark on a compass at 45 degrees, halfway round from north toward east
scope: The compass direction halfway between north and east, at 45 degrees, not the direction the wind
  comes from and not a place in the north-east.
examples:
- The town lies to the northeast of the capital, at 45 degrees.
- We walked northeast across the fields until we reached the river.
