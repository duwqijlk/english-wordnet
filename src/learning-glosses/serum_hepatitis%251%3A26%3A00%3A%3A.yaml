senseId: 'serum_hepatitis%1:26:00::'
synsetId: 14154424-n
simpleMeaning: A sudden, severe liver infection, sometimes fatal, caused by a virus that stays in the
  blood and spreads through sex, blood transfusions or contact with infected body fluids.
scope: A blood-borne viral liver infection; it is not the kind spread by contaminated food and water,
  and not liver damage caused by alcohol.
examples:
- Serum hepatitis spreads through contact with infected blood.
- Blood donors are tested for serum hepatitis.
