senseId: 'endocarp%1:20:00::'
synsetId: 11705208-n
simpleMeaning: The hard inside, most often woody, layer of the skin of various fruits, as peaches and
  plums and cherries, olives too, which keeps the seed.
scope: This sense is also called stone and pit, the hard inside, most often woody, layer of the skin of
  various fruits, as peaches and plums and cherries, olives too, which keeps the seed, where stone is
  the hard inside layer, most often woody, in a fruit wall, holding its seed, seen in peaches and plums,
  and pit is the hard inside layer, most often wood-like, in some fruit walls, like peaches and plums
  and cherries, olives too, holding the seed.
examples:
- Endocarps keep seeds in peaches.
- The endocarp is hard inside.
