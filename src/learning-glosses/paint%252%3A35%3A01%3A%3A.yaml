simpleMeaning: To put a liquid onto something, as when coating gutters with linseed oil.
scope: This sense means putting any liquid onto something, not coating a surface with paint specifically
  and not making a picture.
examples:
- They painted the fence with wood preservative to keep it from rotting.
- She painted the rusty hinges with oil so they would move freely.
