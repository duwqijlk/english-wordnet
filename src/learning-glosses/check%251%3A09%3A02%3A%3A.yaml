simpleMeaning: something not physical, such as a rule or a feeling, that gets in the way of action or
  slows progress down
scope: Not the act of limiting someone's power, and not a mark on paper.
examples:
- Lack of money was the main check on the project.
- Her fear of failure became a check on her career.
