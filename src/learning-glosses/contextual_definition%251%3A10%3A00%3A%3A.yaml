simpleMeaning: A way of explaining a word by using it inside a longer phrase that also gives its meaning.
scope: A way of explaining a word by using it inside a longer phrase, not a short direct statement of
  meaning and not an example of use.
examples:
- A contextual definition shows the word at work in a sentence.
- The book gives a contextual definition of 'legal duty'.
