simpleMeaning: In Yiddish, a boldness so great it shocks, with no shame and no fear
scope: In Yiddish, a boldness so great it shocks, with no shame and no fear; chutzpa and hutzpah are other
  names for this sense, not boldness that stays within good manners and not anger.
examples:
- Only chutzpah could explain such a bold demand.
- His chutzpah knew no shame.
