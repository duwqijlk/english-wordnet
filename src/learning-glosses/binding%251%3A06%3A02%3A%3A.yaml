simpleMeaning: one of two clips on a ski that hold a boot tight and let the boot go if the skier falls
scope: One of two clips on a ski that hold a boot tight and let it go in a fall, not a strip sewn along
  an edge, and not the cover of a book.
examples:
- One binding came loose on the steep slope.
- She clicked her bindings into place.
