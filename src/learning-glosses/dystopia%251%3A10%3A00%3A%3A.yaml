senseId: 'dystopia%1:10:00::'
synsetId: 06379147-n
simpleMeaning: a made-up story about a place where life is very bad because people have too little, are
  ruled in a cruel way, or live in fear
scope: This is a work of fiction about such a bad place. It is not the bad state of life itself.
examples:
- The novel is a dystopia about a city where no one has enough food.
- She wrote a dystopia set in a land ruled by fear.
