senseId: 'millimeter%1:23:00::'
synsetId: 13680427-n
simpleMeaning: a unit for measuring length in the metric system (a system for measuring used in most places),
  equal to one of 1,000 equal parts of a meter
scope: 'Also called mm and millimetre: a very small unit of length, not a meter and not a centimeter.'
examples:
- The screw is only five millimeters long.
- Rainfall was measured in millimeters that night.
