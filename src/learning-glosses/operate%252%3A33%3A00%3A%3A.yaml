simpleMeaning: To move troops or ships in war so as to get the better of the other side, in attack or
  in defence
scope: Moving troops or ships in war to get the better of the other side, not working a machine, and not
  doing an operation on a sick person.
examples:
- The army operated along the coast to cut off the enemy.
- The navy operated in the bay to hold the port.
