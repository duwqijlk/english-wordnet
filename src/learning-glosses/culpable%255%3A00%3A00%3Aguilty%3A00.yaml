simpleMeaning: deserving blame or strong criticism for being wrong, evil, or harmful
scope: Also called blameful, and another name for this sense is blameworthy; it means deserving blame
  for wrong or harmful acts, not free from blame.
examples:
- He was culpable for the accident because he drove too fast.
- The report found the company culpable for the unsafe work.
