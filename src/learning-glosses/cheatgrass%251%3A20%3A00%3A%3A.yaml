simpleMeaning: a plant that lives for one year or one winter, with soft hairy leaves, from the lands around
  the Mediterranean Sea
scope: 'Also called downy brome, downy bromegrass, downy cheat, downy chess and drooping brome: a short-lived
  plant from the Mediterranean, not a crop plant such as wheat and not a lawn plant.'
examples:
- The hillside was covered in cheatgrass after the first rains.
- The cheatgrass turned brown and dry by early summer.
