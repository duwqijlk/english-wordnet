simpleMeaning: a pin put through the bar that a wheel turns on, to keep the wheel in place
scope: A pin that keeps a wheel in place, also called lynchpin; this is the wheel pin, not any pin used
  for another job.
examples:
- The linchpin held the cart wheel on the axle.
- He pulled out the linchpin before taking off the wheel.
