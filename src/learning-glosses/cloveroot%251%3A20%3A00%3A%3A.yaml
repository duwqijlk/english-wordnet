simpleMeaning: This hairy plant from Europe and Asia bears small yellow flowers, and its sharp-tasting
  part under the ground was once used as a medicine.
scope: Also called clover-root, herb bennet and wood avens, this is the hairy plant with small yellow
  flowers from Europe and Asia.
examples:
- She found a cloveroot with small yellow flowers.
- He pulled up a cloveroot to look at its root.
