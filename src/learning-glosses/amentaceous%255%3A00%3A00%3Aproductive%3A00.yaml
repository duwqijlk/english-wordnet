simpleMeaning: of a plant, having or marked by catkins, the long soft flower spikes that hang down
scope: This is said of a plant that has or is marked by catkins, with amentiferous as another name for
  this sense, and not a plant with ordinary flowers or a plant with cones.
examples:
- The amentaceous birch hangs its catkins in spring.
- Amentaceous trees like the alder bear their flowers in catkins.
