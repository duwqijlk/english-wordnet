schema: oewn-learning-gloss-v2
senseId: 'quotation%1:10:00::'
synsetId: 06625409-n
simpleMeaning: a part of writing or speech, or a group of words, taken from what someone said or wrote
  and used again
scope: 'Also called quote and citation: this is the words themselves, taken from what someone said or
  wrote, not a short note that names where information came from.'
examples:
- She began her essay with a quotation from a famous speech.
- The book is full of quotations from old letters.
