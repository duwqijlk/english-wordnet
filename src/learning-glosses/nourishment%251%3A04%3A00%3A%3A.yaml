simpleMeaning: the act of giving food that helps a person or thing live and grow
scope: The act of giving food to help someone live and grow, not the food itself that the body takes in.
examples:
- The mother's nourishment of her sick child helped him grow strong again.
- Good nourishment of young plants takes time and care.
