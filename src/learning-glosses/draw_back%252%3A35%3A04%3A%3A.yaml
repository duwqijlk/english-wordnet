simpleMeaning: To use a tool in surgery to keep the edges of a cut or an organ open.
scope: To use a tool in surgery to keep the edges of a cut or an organ open; retract is another name for
  this sense, not to pull away and not to close a cut.
examples:
- The surgeon asked the nurse to draw back the edges of the wound.
- The nurse helped to draw back the tissue during the operation.
