simpleMeaning: something that happens later, or in a roundabout way, because of an action
scope: A far-off or roundabout result of an action, not what happens at once and not a sound bouncing
  back.
examples:
- His words had repercussions he had never foreseen.
- The repercussions of the crash were felt for years.
