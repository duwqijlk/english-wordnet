senseId: 'floodgate%1:06:00::'
synsetId: 04251743-n
simpleMeaning: A valve or gate that can be opened or closed to control how fast water flows through a
  sluice (a narrow channel made for water to flow through).
scope: 'Also called head gate, penstock, sluice valve, sluicegate and water gate: a real gate for water
  in a channel, not something that holds back a flood of people or feelings.'
examples:
- The workers opened the floodgate to let more water into the lower field.
- When the floodgate is closed, the water in the channel rises slowly.
