simpleMeaning: a house to live in, usually a farmhouse, with the land next to it
scope: This sense is the house itself, usually a farmhouse, with the land next to it; it is not the wider
  home and grounds of a family, and not the act of settling on government land.
examples:
- Their homestead had a red barn and fields on all sides.
- We drove past an old homestead with a farmhouse and a large garden.
