simpleMeaning: something made on a surface that shows what a person, thing, scene or idea looks like
scope: 'Also called picture and image: a likeness made on a surface, not a small symbol on a computer
  screen and not a holy painting on wood.'
examples:
- They showed us the icons from their wedding.
- The icon on the wall showed a mountain lake at dawn.
