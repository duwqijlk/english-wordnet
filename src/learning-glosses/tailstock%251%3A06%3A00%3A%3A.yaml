simpleMeaning: To hold up the free end of the work on a turning machine, a piece slides along the base
  in line with the fixed end and locks in place.
scope: This is the moving part of a turning machine that holds the free end of the work, not the fixed
  end it lines up with.
examples:
- The tailstock slid along the bed and locked in place.
- He moved the tailstock to hold the free end of the work.
