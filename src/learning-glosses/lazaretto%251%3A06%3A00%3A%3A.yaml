simpleMeaning: Sickness that spreads from person to person, above all leprosy, is treated in this building
scope: 'Also called a lazar house, a lazaret, a lazarette and a pesthouse: a building for people with
  a sickness that spreads, not an ordinary hospital and not a place for people with broken bones.'
examples:
- The old lazaretto still stands on the island, empty now.
- Travellers with the sickness were kept in the lazaretto for forty days.
