simpleMeaning: A former free-standing United States federal office that watched over and set prices for
  firms carrying goods and people across state lines, and it was shut down in 1995
scope: This is a former free-standing United States federal office that watched over and set prices for
  firms carrying goods and people across state lines, also called Interstate Commerce Commission; near
  rivals are the Federal Trade Commission and the Federal Communications Commission.
examples:
- The ICC was set up in 1887 as the first federal agency to watch over carriers.
- The ICC was shut down in 1995 after years of setting rates for carriers.
