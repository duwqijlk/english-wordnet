simpleMeaning: in a clear and direct way that gets to the point at once
scope: Speaking or judging in a clear and direct way that gets to the point at once; not merely speaking
  harshly and not speaking at length.
examples:
- He was incisively critical of the plan.
- She answered incisively, wasting no words.
