simpleMeaning: A shrub or small tree of two states in the south-west, green for much of the year, with
  acorns in half-round cups
scope: This shrub or small tree of Arizona and New Mexico has acorns in half-round cups and stays green
  for much of the year; Quercus arizonica is another name for this sense.
examples:
- The Arizona white oak grows in Arizona and New Mexico.
- We gathered acorns under an Arizona white oak.
