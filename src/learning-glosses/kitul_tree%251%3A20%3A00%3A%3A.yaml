simpleMeaning: A palm of the fishtail type that grows from India to the Malay Peninsula; its sap yields
  jaggery, a brown sugar, and its trunk pith yields sago.
scope: Another name for kittul, kitul and jaggery palm; not the sago palm or the sugar palm.
examples:
- The kitul tree grows from India to the Malay Peninsula.
- People make sago from the pith of the kitul tree.
