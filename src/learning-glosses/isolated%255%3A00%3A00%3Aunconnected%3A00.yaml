simpleMeaning: far away from other people or places, and separate from them in place or in social life
scope: 'Also called apart and obscure: far away and cut off from others, not kept apart from people for
  health reasons and not about parts split from parts next to them.'
examples:
- The isolated village is many miles from the nearest town.
- He lived an isolated life, with few friends and little contact with other people.
