simpleMeaning: Thick parts under the ground that can be eaten belong to a plant of central North America
  that lives for years and is covered in fine hairs
scope: Also called pomme blanche and pomme de prairie, this plant of central North America lives for years,
  is covered in fine hairs, and has thick parts under the ground that can be eaten.
examples:
- We cooked the thick parts of the breadroot for dinner.
- She dug up a breadroot and cooked its thick underground part.
