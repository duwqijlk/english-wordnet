simpleMeaning: The place of ninety in counting order, coming after eighty-nine.
scope: Of a place in a race of two hundred runners, or a page in a book, after eighty-nine.
examples:
- She finished ninetieth in the race of two hundred runners.
- The ninetieth page of the book held the map.
