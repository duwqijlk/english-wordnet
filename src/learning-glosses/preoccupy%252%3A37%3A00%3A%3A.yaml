senseId: 'preoccupy%2:37:00::'
synsetId: 01787213-v
simpleMeaning: To take up all of someone's thoughts ahead of time, and hold them there
scope: To fill a mind in advance and hold it, not to take and hold a place before others.
examples:
- His work preoccupies him day and night.
- The matter preoccupied her so she could think of nothing else.
