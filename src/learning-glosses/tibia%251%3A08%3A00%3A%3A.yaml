simpleMeaning: the thicker of the two bones in a person's lower leg, on the inner side, between the knee
  and the ankle
scope: 'Also called shin and shinbone: the thick inner leg bone, not the thinner outer bone in the same
  part of the leg.'
examples:
- He broke his tibia just above the ankle.
- The tibia takes much of the weight when you walk.
