simpleMeaning: An insect that usually flies on a single front pair of wings, with the rear pair reduced
  to tiny knobs and a mouth adapted to sucking, lapping or piercing.
scope: Another name for the same group of flies, also called dipteron, dipterous insect and two-winged
  insects; not a four-winged insect such as a bee or dragonfly.
examples:
- Mosquitoes and houseflies are dipterans.
- Each dipteran usually has one pair of wings for flight.
