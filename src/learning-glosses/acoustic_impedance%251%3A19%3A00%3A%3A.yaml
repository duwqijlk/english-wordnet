simpleMeaning: A stand against sound flowing through a face, where sound drag is the true part of the
  stand and sound spring is the not-real part.
scope: This sense is also called acoustic reactance and acoustic resistance.
examples:
- Acoustic impedance slowed the sound.
- An acoustic impedance stood against the flow.
