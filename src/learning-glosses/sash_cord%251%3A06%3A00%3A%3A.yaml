simpleMeaning: a tough rope that joins the weight to a window frame that slides up and down
scope: 'Also called a sash line: a rope that links a weight to a sliding window frame, not a curtain cord
  and not a clothes line.'
examples:
- The old sash cord had snapped, so the window would not stay up.
- He tied the new sash cord to the weight inside the frame.
