simpleMeaning: 'Of a camera lens or light-sensitive film: allowing a picture to be taken in less time.'
scope: This describes camera equipment that shortens exposure time; it is not about speed of movement,
  a smooth surface, or loyalty.
examples:
- The photographer chose a fast lens so she could shoot indoors without a flash.
- For the night game, he loaded fast film to catch the action.
