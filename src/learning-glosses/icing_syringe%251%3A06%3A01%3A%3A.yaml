simpleMeaning: For cakes and pastries, this tool of plastic or metal lays on sweet topping much as a soft
  bag with a small hole would.
scope: Like a pastry bag, it lays sweet topping on cakes and pastries, but it is made of plastic or metal.
examples:
- She used the icing syringe to put sweet topping on the cake.
- The icing syringe lets you draw thin lines of sweet topping on pastries.
