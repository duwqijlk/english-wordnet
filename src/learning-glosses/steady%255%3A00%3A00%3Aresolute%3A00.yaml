senseId: steady%5:00:00:resolute:00
synsetId: 01997735-s
simpleMeaning: strong in purpose, not changing your mind, and not giving way
scope: 'Firm and stiff are other names for this sense: strong in purpose and not giving way, as in a person,
  a belief or loyalty to others. Not the verb sense of holding something so it does not move, and not
  making something still.'
examples:
- She stayed steady in her aim to finish school, even when money was short.
- His steady loyalty to his friends never changed over the years.
