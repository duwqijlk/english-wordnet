simpleMeaning: In chemistry, the process by which a solid forms in a liquid
scope: In chemistry, a solid forming in a liquid, not rain or other water falling, not quick action, and
  not a fall from a high place.
examples:
- Precipitation in the test tube left a white solid at the bottom.
- The teacher showed precipitation by mixing the two clear liquids.
