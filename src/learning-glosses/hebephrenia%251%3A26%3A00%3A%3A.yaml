senseId: 'hebephrenia%1:26:00::'
synsetId: 14422842-n
simpleMeaning: A form of schizophrenia with severe personality breakdown, unpredictable speech, immature
  mannerisms and strange behaviour; usually appears around puberty; the most commonly diagnosed type in
  psychiatric hospitals.
scope: Another name for disorganized schizophrenia (also called hebephrenic schizophrenia or disorganized
  type schizophrenia); not a separate condition, and not the catatonic or paranoid forms.
examples:
- Hebephrenia usually appears around puberty and brings jumbled speech and odd mannerisms.
- The textbook describes hebephrenia as a form of schizophrenia marked by immature behaviour.
