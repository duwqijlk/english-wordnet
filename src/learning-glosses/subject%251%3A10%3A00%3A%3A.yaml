simpleMeaning: The thing that a talk, meeting or piece of writing is about.
scope: This is not what a picture shows, and not a person ruled by someone else; it is only the topic
  being discussed.
examples:
- We changed the subject and talked about the weather.
- The subject of the meeting was next year's budget.
