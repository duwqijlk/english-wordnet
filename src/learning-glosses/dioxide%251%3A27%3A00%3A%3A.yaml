simpleMeaning: A chemical with one other part joined to two parts of oxygen in each tiny unit.
scope: A chemical with two parts of oxygen in each tiny unit, not one part and not three.
examples:
- Carbon dioxide is the gas that plants take in and we breathe out.
- Sulphur dioxide comes from burning coal.
