simpleMeaning: A climbing Asian vine with long finely toothed leaves and bunches of white flowers, followed
  by greenish-yellow fruit good to eat.
scope: A climbing Asian vine with bunches of white flowers and fruit good to eat, also called bower actinidia
  and tara vine; its nearest kin are other climbing vines with white flowers.
examples:
- Actinidia arguta climbed the fence and bore greenish-yellow fruit.
- We planted Actinidia arguta against the wall for its white flowers.
