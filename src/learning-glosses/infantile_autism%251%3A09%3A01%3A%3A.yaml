simpleMeaning: This old label was given to a young child whose serious troubles with other people and
  with words showed up in the first years of life.
scope: Also called autistic disorder, childhood autism, classic autism, classical autism, and infantile
  psychosis, this old label names a serious condition of early childhood, not the rare childhood syndrome
  of withdrawal and little interest in others that shares the name infantile autism.
examples:
- Their notes still used the term infantile autism for the child's condition.
- The term infantile autism appeared in records from long ago.
