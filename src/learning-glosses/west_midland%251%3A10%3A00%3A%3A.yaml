simpleMeaning: A form of Middle English spoken in the half of the Old English speech area called Mercia
  that lies toward the setting sun.
scope: A dialect of Middle English from Mercia, not the West Saxon dialect spoken south of the Thames.
examples:
- West Midland was spoken in Mercia in the Middle Ages.
- The poem was written in West Midland.
