senseId: 'paralyse%2:30:00::'
synsetId: 00269363-v
simpleMeaning: to make someone unable to move their body or a part of it
scope: 'Another name for this sense is paralyze: to make someone unable to move their body or a part of
  it, as poison, a fall or fear can do. Not simply to frighten someone who can still move.'
examples:
- The poison paralysed his legs, so he could not walk.
- A fall paralysed her from the waist down.
