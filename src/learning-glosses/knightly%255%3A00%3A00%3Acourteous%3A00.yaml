simpleMeaning: paying kind care and attention to women, as the best men were once thought to do
scope: This sense, also called gallant and also called chivalrous, is about a man who is kind and polite
  to women. It is not the sense about the time of knights in the Middle Ages.
examples:
- He was knightly, always opening the door and carrying her bag.
- With a knightly bow, he offered the lady his seat.
