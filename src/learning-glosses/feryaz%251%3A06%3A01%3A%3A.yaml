simpleMeaning: In the 1500s and 1600s, Russian nobles wore this wide coat with long sleeves, much like
  a robe.
scope: A long-sleeved robe-like coat worn by Russian nobility in the 16th and 17th centuries, not a modern
  jacket and not a dress.
examples:
- The actor wore a feryaz for the scene set in 16th-century Moscow.
- A feryaz hung on display in the museum of Russian dress.
