synsetId: 11445202-n
simpleMeaning: A false sense of movement produced by viewing still pictures of a moving object shown one
  after another very fast.
scope: It is also called apparent movement, movement, and motion, and it names the false sense that still
  pictures are moving when the thing itself stays still.
examples:
- The cinema relies on apparent motion to make still pictures seem to move.
- The succession of flashing lights gave an apparent motion that made the sign seem to move.
