simpleMeaning: A sore swelling of the layered tissue that joins a horse's hoof to its foot.
scope: A sore swelling of the layered tissue joining a horse's hoof to its foot, also called founder;
  not a swelling of the hoof itself, and not a sore foot from a bad shoe.
examples:
- The vet treated the horse for laminitis.
- Laminitis made the mare walk with care on hard ground.
