simpleMeaning: whole and complete, with nothing missing and nothing broken.
scope: It is not the everyday sense of 'all of' a period or group; it describes one object that is complete
  and undamaged.
examples:
- The ancient cup was found entire, with no cracks.
- The museum's set of first editions is still entire.
