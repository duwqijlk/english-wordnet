simpleMeaning: Without any break in the bone, the end of a long bone comes loose from the bone it normally
  joins
scope: This is the name for a separation where the end of a long bone comes loose from the bone it normally
  joins, with no break in the bone.
examples:
- The doctor pointed to the diastasis on the X-ray.
- Diastasis was clear on the scan of his leg.
