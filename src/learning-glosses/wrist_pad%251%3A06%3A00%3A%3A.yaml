simpleMeaning: a cover worn on the joint at the end of the lower arm by football players to guard it
scope: This is a cover for the joint at the end of the lower arm, worn by football players; not a glove
  and not a cover for the elbow.
examples:
- The wrist pad kept his wrist safe when he fell on the field.
- He put on a wrist pad before the football game started.
