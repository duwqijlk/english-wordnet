simpleMeaning: to attract people very strongly, as if a magnet were pulling them
scope: 'Also called bewitch, mesmerize, magnetize and spellbind: this holds people''s attention very strongly,
  and is not about making metal pull other metal.'
examples:
- She mesmerised the crowd with her singing.
- He was mesmerised by the dancer's slow, smooth movements.
