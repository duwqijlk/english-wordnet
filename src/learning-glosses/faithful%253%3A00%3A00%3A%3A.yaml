simpleMeaning: staying strong in love or loyalty, and not leaving the person or side you support
scope: This word means loyal and true over time; it is not the noun for the group of people who go to
  one church.
examples:
- She stayed faithful to her husband for fifty years.
- He was a faithful friend who never left when times were hard.
