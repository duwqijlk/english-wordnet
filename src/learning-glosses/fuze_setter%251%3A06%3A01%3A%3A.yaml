senseId: 'fuze_setter%1:06:01::'
synsetId: 92450760-n
simpleMeaning: A tool that sets the burst time of shots that carry a clockwork timer, so they burst at
  the right moment.
scope: This is a tool that sets the burst time of shots with clockwork timers, also called a fuse indicator
  regulator or a fuse setter; not the timer itself, and not a sight for aiming a gun.
examples:
- The fuze setter fixed the time at which the shell would burst.
- He turned the fuze setter before the gun was fired.
