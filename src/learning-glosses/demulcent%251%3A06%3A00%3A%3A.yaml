simpleMeaning: A medicine in the form of an oil, a soft cream, or the like, that calms sore or hurt skin
scope: A medicine in the form of an oil or soft cream that calms sore or hurt skin, not a drug taken by
  mouth and not a bandage.
examples:
- She rubbed a demulcent on the burned skin.
- The demulcent eased the red, sore patch.
