simpleMeaning: a place with a bar and rooms open to everyone where people can drink, and which often gives
  light meals
scope: 'Also called saloon: a place with a bar and rooms open to everyone, which often gives light meals,
  not just a bar in a place that mainly serves food.'
examples:
- We had a light lunch at the pub near the station.
- The village pub was full of people drinking and talking.
