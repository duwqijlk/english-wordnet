simpleMeaning: In baseball or softball, the act of hitting the ball lightly by holding the bat still in
  front of it, not by swinging it
scope: A light hit with a held-still bat in baseball or softball, not the wheat disease of the same name
  and not pushing or hitting a person or thing hard.
examples:
- His bunt rolled slowly toward first base.
- She laid down a bunt to move the runner to second base.
