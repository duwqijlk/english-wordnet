simpleMeaning: Said of a shape, one straight cut along its length gives two matching halves, and no other
  cut does.
scope: Also called zygomorphic and zygomorphous, this describes a shape that splits into two matching
  halves by one straight cut along its length.
examples:
- The shape is bilaterally symmetrical, so one straight cut gives two matching halves.
- A bilaterally symmetrical body has two matching halves.
