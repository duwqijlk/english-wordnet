simpleMeaning: any weapon that can be used in war with germs or other living things that cause disease
scope: 'Also called a biological weapon and a bioweapon: a weapon used in war with germs or other living
  things, not a chemical weapon and not a gun.'
examples:
- They feared the smallpox virus would be used as a bioarm.
- The treaty bans the use of any bioarm in war.
