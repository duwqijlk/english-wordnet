simpleMeaning: the view that the world runs like a clock built by God, following the laws of Newton
scope: The view that the world runs like a clock built by God, following the laws of Newton; not the view
  that chance rules the world and not the view that God must keep acting to keep it going.
examples:
- In the clockwork universe, God built the world and let it run.
- The clockwork universe leaves no room for chance.
