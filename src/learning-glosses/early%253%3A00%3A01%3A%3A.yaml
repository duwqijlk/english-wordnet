simpleMeaning: belonging to the opening stage in the development of a language or a body of literature
scope: This is the language-and-literature sense, not the general sense of happening near the beginning
  of a period or before the expected time, not being at an early stage of development in general, not
  belonging to the distant past, not being very young, not expected in the near future, and not any of
  the adverb senses.
examples:
- Early Modern English is represented in documents printed from 1476 to 1700.
- The early literature of the region survives only in fragments.
