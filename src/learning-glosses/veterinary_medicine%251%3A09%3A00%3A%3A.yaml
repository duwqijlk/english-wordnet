simpleMeaning: the work of finding and treating sickness and hurt in animals, most of all tame animals
  kept at home or on farms
scope: The work of finding and treating sickness and hurt in animals, most of all tame animals, not the
  care of sick people and not the study of animal bodies alone.
examples:
- She studied veterinary medicine so she could treat sick farm animals.
- His veterinary medicine practice cares for dogs, cats, and horses.
