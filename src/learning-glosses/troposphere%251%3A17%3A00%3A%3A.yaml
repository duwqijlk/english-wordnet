simpleMeaning: the lowest layer of air round the earth, from 4 to 11 miles high, with the height changing
  with how far north or south you are
scope: This is the lowest layer of air round the earth, not the higher layers above it and not the air
  near the ground alone.
examples:
- Most weather happens in the troposphere.
- Planes fly near the top of the troposphere.
