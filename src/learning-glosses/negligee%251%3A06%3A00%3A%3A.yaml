simpleMeaning: a loose coat that a woman wears at home over her night clothes
scope: 'Also called a wrapper or a housecoat: a loose coat worn at home over night clothes, not the night
  clothes worn under it and not a coat for going out.'
examples:
- She put on a soft negligee over her night dress.
- The negligee hung loose around her shoulders as she made tea.
