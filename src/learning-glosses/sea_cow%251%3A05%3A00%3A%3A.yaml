simpleMeaning: any of two groups of big plant-eating water mammals with flat paddle tails, front limbs
  like flippers, and no back limbs
scope: Also called a sirenian and a sirenian mammal; a big plant-eating water mammal, not a whale or a
  seal.
examples:
- The sea cow grazed on plants in the warm shallow water.
- Sea cows have paddle tails and no back limbs.
