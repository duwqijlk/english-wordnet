senseId: 'hitchhiker%1:18:00::'
synsetId: 10197708-n
simpleMeaning: a person who goes from place to place by getting free rides in passing cars or other vehicles
scope: This is a person who travels by getting free rides from people who pass by, not the driver who
  stops to give such a ride.
examples:
- The hitchhiker waited by the road for a free ride.
- A kind driver stopped and gave the hitchhiker a ride to the next town.
