senseId: 'gastroenteritis%1:26:00::'
synsetId: 14195487-n
simpleMeaning: A sore, swollen state of the stomach and the gut, which can be brought on by a germ called
  Salmonella enteritidis.
scope: This is a sore, swollen state of the stomach and the gut; intestinal flu is another name for this
  sense, not a sore in one spot of the stomach wall and not a short upset after bad food.
examples:
- She had gastroenteritis after eating the bad fish.
- Gastroenteritis left him weak for two days.
