simpleMeaning: bad in a moral way, unfair, or against the law.
scope: This is not about a fact being incorrect, as in a wrong answer; it is about actions and choices
  that are bad or illegal.
examples:
- It is wrong to take things that do not belong to you.
- He knew that cheating was wrong, but he did it anyway.
