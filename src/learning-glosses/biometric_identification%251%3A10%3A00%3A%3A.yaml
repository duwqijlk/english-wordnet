simpleMeaning: The automatic naming of a living person from the way their body is built and the way they
  act.
scope: The automatic naming of a living person from the way their body is built and the way they act,
  also called biometric authentication and identity verification; not a password and not a card.
examples:
- Biometric identification matched his face to the record.
- The gate used biometric identification to let workers in.
