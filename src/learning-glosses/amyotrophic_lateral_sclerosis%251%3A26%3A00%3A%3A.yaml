senseId: 'amyotrophic_lateral_sclerosis%1:26:00::'
synsetId: 14129219-n
simpleMeaning: A disease in which tissue in the spinal cord that carries movement signals thickens, making
  muscles weaken and waste away, starting in the limbs.
scope: The progressive nerve disease also called ALS, not a temporary muscle weakness or an injury to
  a single nerve.
examples:
- Amyotrophic lateral sclerosis attacks the nerve cells that control movement.
- She was diagnosed with amyotrophic lateral sclerosis in her fifties.
