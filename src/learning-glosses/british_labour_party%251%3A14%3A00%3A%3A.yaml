simpleMeaning: A political group set up in Great Britain in 1900 that works for the interests of workers
  and once sought to bring key trades under public control.
scope: This is the political group for workers formed in Great Britain in 1900; Labour, Labor and Labour
  Party are other names for it, not other political groups in Britain that speak for different voters.
examples:
- The British Labour Party won many seats in that election.
- She joined the British Labour Party when she started work in the factory.
