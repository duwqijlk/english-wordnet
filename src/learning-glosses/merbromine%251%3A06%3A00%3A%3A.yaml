simpleMeaning: a compound holding mercury, put on the skin to kill germs; Mercurochrome is its trade name
scope: A compound holding mercury, put on the skin to kill germs; Mercurochrome is its trade name, not
  a drug taken by mouth, and not a wash for deep wounds.
examples:
- The nurse dabbed merbromine on the cut to kill germs.
- He dabbed a little merbromine on the graze to kill germs.
