senseId: 'myotonic_dystrophy%1:26:00::'
synsetId: 14186664-n
simpleMeaning: 'A severe inherited muscle-wasting illness: face, hand, foot and neck weakness, slurred
  speech and spreading hand weakness; onset from birth to middle age, slow decline, dominant inheritance,
  one parent suffices.'
scope: Another accepted name for the same severe muscle-wasting disease as myotonia atrophica; it is not
  a different or milder muscle disorder.
examples:
- Her brother was found to have myotonic dystrophy after years of unexplained hand weakness.
- Because myotonic dystrophy needs only one parent to pass it on, each child has a fifty percent chance
  of developing it.
