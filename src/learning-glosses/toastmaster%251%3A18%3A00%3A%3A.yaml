simpleMeaning: the person who asks people to drink to someone's health and brings in the speakers at a
  big meal
scope: 'Symposiarch is another name for this sense: the person who leads the toasts and brings in the
  speakers at a big meal, not a guest speaker and not the person who serves the food.'
examples:
- The toastmaster rose and asked us to drink to the bride's health.
- Our toastmaster introduced each speaker at the banquet.
