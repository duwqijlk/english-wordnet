simpleMeaning: In the Roman Catholic Church, the official dress of a cardinal (a leading priest), named
  for the colour of the robes, a colour that came from Tyre
scope: The official dress of a cardinal in the Roman Catholic Church; not the colour itself, not grand
  words in writing, and not fit for a king or queen.
examples:
- When he became a cardinal, he was given the purple to wear.
- The cardinal's purple was made of rich, deep-coloured cloth.
