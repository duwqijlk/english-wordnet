simpleMeaning: putting one thing between others, or the fact that one thing is between others
scope: Putting one thing between others, or the fact that one thing is between others; intervention is
  another name for this sense; not the act of breaking in to stop a talk, and not the thing put between.
examples:
- The interposition of a wall between the two gardens ended the quarrel.
- Her interposition saved the talks from breaking down.
