simpleMeaning: The lowest point of anything, or a time of the worst hardship.
scope: The lowest point of anything, or a time of the worst hardship; not the point in the sky straight
  below one, opposite the highest point, on the imagined sphere where stars seem to stand.
examples:
- The team's nadir came with the third straight loss.
- After the scandal, her career hit its nadir.
