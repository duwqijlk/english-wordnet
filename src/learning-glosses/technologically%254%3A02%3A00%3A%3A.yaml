simpleMeaning: by using tools, machines, and ways of working that come from science
scope: This means by using tools, machines, and ways of working that come from science, not by hand alone
  or by nature alone.
examples:
- Technologically, the hospital can now treat patients it could not help before.
- Sending people to the moon is technologically hard, but not impossible.
