simpleMeaning: a knitted garment worn over other clothes, open down the front and done up with buttons
  or a zip
scope: A knitted jacket that fastens up the front, not a pullover and not a coat.
examples:
- She wore a cardigan over her dress on the cool evening.
- He buttoned his cardigan up the front.
