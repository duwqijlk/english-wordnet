simpleMeaning: The group of nouns used to name the person or thing that a verb's action is done for.
scope: This is the group of nouns that act as the indirect object of a verb, also called the dative case,
  not the group that acts as the direct object or the group that shows who owns a thing.
examples:
- In Latin, the dative marks the indirect object of the verb.
- The teacher asked us to find the dative in the sentence.
