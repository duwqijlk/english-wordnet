simpleMeaning: Plates made from a picture formed by light are used in this flat-surface way of printing
scope: A way of printing from flat plates made from a picture formed by light, not from plates with the
  design cut into them and not by offset printing.
examples:
- The poster was printed by photolithography from a flat plate.
- Photolithography lets printers copy a picture formed by light onto paper.
