simpleMeaning: trousers, usually used in the plural, made of flannel, tweed, white cloth, or a firm cloth
  with slanted lines in its weave
scope: These are trousers, also called white, flannel and tweed; not a loose long coat and not the firm
  cloth itself.
examples:
- He wore a pair of cream gabardines with a blue shirt.
- Her tweed gabardines were warm enough for winter walks.
