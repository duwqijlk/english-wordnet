simpleMeaning: Fixed in advance by earlier events, so that it cannot be avoided.
scope: This is not the sense meaning needed for a purpose; it describes something that must happen because
  of what came before.
examples:
- Given the choices made years earlier, the outcome was necessary.
- In that system every result was necessary and could not have been otherwise.
