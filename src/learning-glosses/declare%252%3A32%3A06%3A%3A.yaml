simpleMeaning: to say in public that you support something, feel care for someone, or hold a view for
  or against something
scope: This is saying in public that you support something or hold a view for or against it; it is not
  announcing a fact in an official way and not naming a trump suit in cards.
examples:
- She declared against the plan and said she would not support it.
- He declared for the new law in front of the crowd.
