simpleMeaning: A rare orchid of cool northern bogs with a single white to pink bloom tipped with purple,
  on a straight reddish stem above one leaf at the base.
scope: This is the rare bog orchid with one purple-tinged flower on a reddish stem, not the larger lady's
  slipper orchids with their pouch-shaped blooms, and not other woodland orchids.
examples:
- We found a single fairy-slipper growing in the wet moss beside the boardwalk.
- Fairy-slippers are protected in several northern states, so picking them is illegal.
