simpleMeaning: the beauty, richness, and fine style that belong to a formal ceremony
scope: This is the real beauty and richness of a formal ceremony, not a cheap, empty show that only tries
  to look important.
examples:
- The king entered with great pomp, with music, flags, and fine clothes all around him.
- The wedding had all the pomp of a royal ceremony.
