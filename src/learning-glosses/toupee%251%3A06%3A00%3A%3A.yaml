simpleMeaning: a small piece of false hair worn to cover a part of the head where the hair has fallen
  out
scope: 'Also called a toupe: a small piece of false hair for one part of the head, not a full wig that
  covers the whole head.'
examples:
- He wore a toupee to cover the thin patch on top of his head.
- The toupee matched the color of his own hair well.
