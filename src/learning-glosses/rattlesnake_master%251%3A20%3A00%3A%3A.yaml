simpleMeaning: Thought to heal the bite of the creature it is named for, this rough, prickly plant of
  a kind called eryngo lives on year after year in the United States.
scope: Also called rattlesnake's master and button snakeroot, it is the rough, prickly plant of the United
  States thought to heal a bite.
examples:
- The rough, prickly rattlesnake master lives on year after year.
- It was thought that rattlesnake master could heal a bite.
