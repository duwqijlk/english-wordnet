simpleMeaning: a young woman in the 1920s who showed off her free way of living and her new style of dress,
  which broke the usual rules
scope: A young woman of the 1920s with a free, new style of dress and living, not a flat part that moves
  up and down.
examples:
- The flapper wore a short dress and danced all night.
- In old photos, a flapper often has short hair and bright, loose clothes.
