senseId: 'angle_vise%1:06:01::'
synsetId: 92460298-n
simpleMeaning: a clamp that holds a piece of work at many different slants, most often able to turn it
  through a full quarter turn
scope: A clamp that holds a piece of work at different slants, not a plain clamp that holds things straight
  and not a tool for cutting.
examples:
- He set the angle vise so the metal bar sat at a slant.
- With an angle vise, she could tilt the wood to the exact slant she needed.
