simpleMeaning: A person who finds customers for prostitutes; in England, such a person is called a ponce.
scope: A person who finds customers for prostitutes, called a ponce in England; not a prostitute and not
  a brothel keeper.
examples:
- The police arrested the fancy man for finding customers for the women.
- In the novel, a fancy man arranges meetings between clients and prostitutes.
