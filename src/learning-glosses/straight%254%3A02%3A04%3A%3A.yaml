simpleMeaning: in an open, honest way, saying exactly what you think.
scope: This is not about moving in a line, not about a road, and not about someone's sexual orientation;
  it describes how honestly something is said.
examples:
- He told me straight that my work was not good enough.
- 'I''ll give it to you straight: the company is losing money.'
