simpleMeaning: Something that can be tied up with rope or a cord so it stays put.
scope: Something that can be tied up with rope or a cord so it stays put, also called bondable; not free
  to move and not fixed for good.
examples:
- The bindable bundle was tied tight with rope.
- Bindable loads were tied down before the journey.
