senseId: 'delinquency%1:07:00::'
synsetId: 04673440-n
simpleMeaning: a tendency to not take the care you should with things you must do, and to not care about
  them
scope: 'Also called dereliction: a tendency to be careless and uncaring, not a wrong act against the law
  by a young person.'
examples:
- His delinquency at work meant he often left jobs unfinished and did not care.
- Her delinquency showed in the little care she took of her duties.
