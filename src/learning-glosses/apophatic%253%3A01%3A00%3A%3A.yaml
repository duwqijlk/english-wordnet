schema: oewn-learning-gloss-v2
senseId: 'apophatic%3:01:00::'
synsetId: 02644883-a
simpleMeaning: about the belief that people can know God only by saying what God is not, as in saying
  that God cannot be known
scope: It describes the view that people can know God only by saying what God is not, not the view that
  God can be known by saying what God is.
examples:
- In his apophatic sermons, the priest said only what God is not.
- Her apophatic writing never claims to say what God is, only what God is not.
