simpleMeaning: in a true, real way, and with the power to be believed
scope: This use means in a true way with power to be believed, not just in a sincere or honest way about
  feelings.
examples:
- Experts say the letter is genuinely from the king himself.
- The dish is genuinely from Italy, made there in the true way.
