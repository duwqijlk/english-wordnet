simpleMeaning: Poison in the blood, caused by germs that make pus and spread from a sore full of pus
scope: 'Also called pyaemia: poison in the blood from germs that spread from a sore full of pus, not a
  sore on the skin alone and not a fever with no cause.'
examples:
- The wound gave him pyemia, and he grew very ill.
- Pyemia set in after the abscess burst.
