simpleMeaning: the way the thin thread-like parts in wood, leather, or stone, or in cloth made by weaving,
  are arranged, run, and feel
scope: The pattern of lines in wood, leather, stone, or cloth, not seeds, not food, and not a unit of
  weight.
examples:
- Cut the wood along the grain, not across it.
- You can see the grain clearly in this leather bag.
