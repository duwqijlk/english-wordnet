simpleMeaning: A wild flower with greyish leafy stems and flower heads with narrow pale lavender or violet
  rays; of rocky desert slopes from California to Arizona and Utah.
scope: Also called Machaeranthera tortifoloia; a wild aster of desert slopes, not a garden aster and not
  a daisy of the meadows.
examples:
- The Mojave aster blooms on rocky desert slopes.
- We found Mojave aster in flower near the trail.
