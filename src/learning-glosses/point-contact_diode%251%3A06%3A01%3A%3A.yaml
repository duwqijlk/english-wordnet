simpleMeaning: A device that lets power flow one way, using the wall between a treated surface of something
  that partly carries power and a metal tip
scope: A device that lets power flow one way, using the wall between a treated surface and a metal tip;
  not a junction device, and not a plain metal wire.
examples:
- A point-contact diode lets power flow one way.
- The point-contact diode works on the same rule as the junction device, but is simpler to make.
