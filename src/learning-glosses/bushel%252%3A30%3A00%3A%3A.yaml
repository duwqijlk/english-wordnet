simpleMeaning: to make a broken thing right again by putting in a new part, or by joining torn or broken
  pieces together
scope: 'Also called doctor, fix, repair, restore and mend: to make a broken thing right again, not the
  noun senses for a measure for dry goods.'
examples:
- She asked the tailor to bushel her torn coat by joining the torn pieces back together.
- He busheled the broken chair by putting in a new part.
