simpleMeaning: A part joined so it can swing, dropping into a gap between the teeth of a toothed wheel
  to drive it forward or keep it from turning back.
scope: This sense is not the metal log supports in a fireplace, nor the animal.
examples:
- The dog in the winch clicked as it caught each tooth, holding the load steady.
- He oiled the dog so it would drop cleanly into the ratchet's notches.
