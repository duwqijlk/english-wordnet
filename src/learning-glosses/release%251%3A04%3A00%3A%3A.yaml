simpleMeaning: an activity that lets out or gives voice to creative energy or emotion.
scope: This is an activity that channels energy or feeling, not a press statement, a job ending, or a
  fluid escaping.
examples:
- Painting became a release for the grief she could not put into words.
- Dancing is his main release after a long week at work.
