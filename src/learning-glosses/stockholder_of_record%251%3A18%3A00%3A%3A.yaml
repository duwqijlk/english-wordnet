simpleMeaning: a person named in a company's books as holding shares at one set time
scope: The named owner listed in a company's books at a given time, not any buyer and not a person who
  sold before that time.
examples:
- Only a stockholder of record could vote at the meeting.
- The stockholder of record received the dividend in March.
