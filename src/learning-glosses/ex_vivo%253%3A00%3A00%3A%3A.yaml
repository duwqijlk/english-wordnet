simpleMeaning: In a man-made place outside a living thing, a life process goes on
scope: 'Also called in vitro: a life process going on in a man-made place outside a living thing, not
  a process going on inside the body.'
examples:
- The cells grew ex vivo in a dish in the lab.
- Doctors studied the tissue ex vivo, outside the patient's body.
