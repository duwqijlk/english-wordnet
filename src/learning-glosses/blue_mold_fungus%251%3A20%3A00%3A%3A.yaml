simpleMeaning: Blue-grey mildew on the undersides of leaves marks this growth that brings a bad sickness
  to tobacco plants.
scope: This growth brings a bad sickness to tobacco plants, marked by blue-grey mildew under the leaves;
  it brings no such sickness to other plants.
examples:
- Blue mold fungus brought a bad sickness to the tobacco plants.
- The undersides of the leaves showed blue-grey mildew from blue mold fungus.
