simpleMeaning: People eat these seeds of the cannabis plant raw, or grind them to a meal, or let them
  sprout, or dry the sprouts and grind them to powder.
scope: The seed of the cannabis plant, eaten as food in several ways.
examples:
- She sprinkled hemp seed over her salad.
- The hemp seed can be ground into a meal for baking.
