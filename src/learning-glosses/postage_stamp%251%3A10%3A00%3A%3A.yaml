simpleMeaning: A small sticky slip put on a letter or parcel to show that the mail fee has been paid
scope: A small sticky slip put on a letter or parcel to show that the mail fee has been paid; stamp and
  postage are other names for this sense, not an envelope and not a letter itself.
examples:
- She stuck a postage stamp on the letter.
- The postage stamp showed the fee was paid.
