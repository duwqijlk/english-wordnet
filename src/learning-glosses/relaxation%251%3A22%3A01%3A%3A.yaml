senseId: 'relaxation%1:22:01::'
synsetId: 13570691-n
simpleMeaning: In physiology, the slow growing longer of a muscle that is not working, or of the thin
  threads that make it up
scope: This is what a muscle does when it is not working and grows longer; not the feeling of rest and
  calm, and not a system in physics going back to rest.
examples:
- Relaxation of the heart muscle lets the heart fill with blood again.
- After each squeeze, relaxation of the muscle lets it grow longer again.
