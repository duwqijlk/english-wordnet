simpleMeaning: The great ring in the sky that lies halfway between the two poles of the sky.
scope: The great ring in the sky halfway between the sky's poles, also called celestial equator, equinoctial
  circle, and equinoctial line; not the path of the sun and not a ring around one pole.
examples:
- The equinoctial runs right across the middle of the sky.
- Stars on the equinoctial rise due east and set due west.
