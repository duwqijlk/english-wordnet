simpleMeaning: a stiff white band round the neck with no opening at the front, worn as a mark of the clergy
scope: A stiff white band round the neck with no opening at the front, worn as a mark of the clergy, also
  called a clerical collar; not a tight necklace and not an ordinary shirt band.
examples:
- The dog collar marked him out as a priest.
- He wore a dog collar under his coat.
