simpleMeaning: a smile that shows you think you are better than others, or that you look down on them,
  and not one of joy
scope: A smile of pride or scorn, not a smile of joy and not the act of smiling in that way.
examples:
- He gave a smirk when he heard the news.
- Her smirk made it clear she thought she had won.
