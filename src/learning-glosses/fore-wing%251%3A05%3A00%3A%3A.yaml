simpleMeaning: when an insect has four flying parts, this is one of the two that sit at the front of its
  body
scope: 'Also called a fore wing and a forewing: one of the front pair of wings on a four-winged insect,
  not a back wing and not a wing on a bird.'
examples:
- The bee's fore-wing beats faster than its hind wing.
- Each fore-wing of the dragonfly is joined to the front of its body.
