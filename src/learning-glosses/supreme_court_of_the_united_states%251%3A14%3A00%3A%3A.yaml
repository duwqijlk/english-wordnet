simpleMeaning: The highest federal law bench of the country; it gives the final ruling on appeals and
  stands above every law bench in the nation.
scope: This is the highest federal law bench of the country, giving the final ruling on appeals; Supreme
  Court and United States Supreme Court are other names for it, not a lower federal law bench and not
  a state law bench.
examples:
- The Supreme Court of the United States gave the final ruling on the appeal.
- The Supreme Court of the United States stands above every other court in the nation.
