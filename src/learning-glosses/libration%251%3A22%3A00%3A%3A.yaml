simpleMeaning: In astronomy, a slow back-and-forth sway of a moon or a thing that moves round a planet,
  real or only seeming so
scope: In astronomy, a slow sway of a moon or a thing that moves round a planet, not a fast spin and not
  a change in its path.
examples:
- The libration of the moon lets us see a little more of its far side.
- Astronomers measured the libration of the satellite over several months.
