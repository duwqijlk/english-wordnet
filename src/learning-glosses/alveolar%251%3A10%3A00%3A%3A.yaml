simpleMeaning: With the tip of the tongue held near the ridge behind the front teeth, a speaker makes
  this speech sound.
scope: The name alveolar consonant means the same speech sound.
examples:
- The sound at the start of 'tea' is an alveolar, made with the tongue tip near the gum ridge.
- To say an alveolar, put the tip of the tongue near the ridge behind the front teeth.
