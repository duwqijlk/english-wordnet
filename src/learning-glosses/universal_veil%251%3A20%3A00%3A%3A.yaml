simpleMeaning: A membrane that at first fully covers the young mushroom of various kinds and tears as
  it grows, leaving a cup at the stem base and scales on the cap.
scope: The membrane that covers a young mushroom on all sides at first; as the mushroom grows it tears,
  and what is left is a cup at the stem base and scales on the cap. It is not the partial veil, which
  covers only the gills under the cap. The term belongs to mycology, the study of fungi.
examples:
- Collectors often damage the universal veil while lifting a young specimen out of the leaf litter.
- The photograph shows the universal veil still unbroken over the button mushroom.
