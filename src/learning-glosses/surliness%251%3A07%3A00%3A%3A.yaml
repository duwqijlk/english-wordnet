simpleMeaning: A readiness to burst out in anger, with no check on it.
scope: This sense is also called temper, irritability, and peevishness, for a readiness to burst out in
  anger with no check on it, the temper sense being a nature quick to let anger show, with no hold on
  it.
examples:
- His surliness showed in the way he snapped at everyone.
- Surliness made him hard to work with.
