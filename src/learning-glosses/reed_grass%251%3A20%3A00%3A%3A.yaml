senseId: 'reed_grass%1:20:00::'
synsetId: 12133435-n
simpleMeaning: Any of several tall, long-lived grasses with feathery plumes, native to marshes and wet
  woodlands across the temperate Northern Hemisphere.
scope: This is the wild plume-bearing grass of northern fens and wet woods; it is not the common reed
  of reed beds, whose flower heads are dense brown spikes rather than feathery plumes, and not the reed
  canary grass sown for forage.
examples:
- Reed grass swayed along the edge of the fen.
- Its feathery plumes make reed grass easy to spot in late summer.
