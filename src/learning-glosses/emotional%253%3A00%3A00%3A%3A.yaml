simpleMeaning: Having or showing stronger feelings than most people or situations do.
scope: This means feelings are stronger than usual, not that a decision was based on feeling instead of
  reason, and not simply that something relates to feelings.
examples:
- She gave an emotional speech at the farewell party, and several people cried.
- He gets emotional every time he talks about his old dog.
