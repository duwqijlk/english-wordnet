simpleMeaning: Likely to betray, above all with the false character the Romans said the Carthaginians
  had.
scope: Likely to betray, also called treacherous and perfidious; not merely unkind and not merely careless
  with the truth.
examples:
- Punic faith means a promise made only to be broken.
- The writer called him a punic friend after the betrayal.
