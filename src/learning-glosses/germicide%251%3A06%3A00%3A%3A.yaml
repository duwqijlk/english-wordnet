simpleMeaning: Tiny living things that might carry sickness are killed by this thing, which can be heat,
  rays, or a chemical
scope: 'Also called antimicrobial, antimicrobic and disinfectant: this thing kills tiny living things
  that might carry sickness, not a drug taken inside the body and not a wash that only cleans dirt away.'
examples:
- Heat is a germicide that kills tiny living things on the tools.
- The nurse used a germicide to clean the table.
