senseId: 'immunoglobulin%1:27:00::'
synsetId: 15055048-n
simpleMeaning: a group of proteins made in the lymph tissue of animals with backbones, which act as the
  body's defenders against sickness
scope: A group of body proteins that act as the body's defenders against sickness; immune gamma globulin,
  immune globulin and immune serum globulin are other names for this sense, not a single protein and not
  a drug that kills germs directly.
examples:
- The immunoglobulin in his blood fought the sickness.
- Doctors gave her immunoglobulin after the bite.
