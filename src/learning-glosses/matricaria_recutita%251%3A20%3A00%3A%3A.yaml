simpleMeaning: A one-year Eurasian herb, like chamomile in smell and in its uses as a medicine, though
  its taste is more bitter and its effect is thought to be weaker.
scope: This is a one-year Eurasian herb like chamomile in smell and medicinal use, though more bitter
  and weaker; sweet false chamomile, wild chamomile, German chamomile and Matricaria chamomilla are other
  names for it, not true chamomile itself.
examples:
- Matricaria recutita smells like chamomile.
- The Matricaria recutita in the field is used as a medicine.
