simpleMeaning: a man who has joined the army or marines and holds the lowest rank
scope: This is a man who has joined the army or marines and holds the lowest rank; private and buck private
  are other names for this sense, not an officer and not a man who has left the army.
examples:
- Our prisoner was just a common soldier and knew nothing of value.
- The common soldier stood guard at the gate all night.
