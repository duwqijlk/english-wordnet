simpleMeaning: a bookkeeper's list, in time order, of all the money a business owes and is owed, kept
  as part of its main book of records
scope: A bookkeeper's dated list of debits and credits, not the job of keeping accounts and not an explanation
  of causes.
examples:
- The accounting showed every payment the shop had made that month.
- She checked the accounting to find the missing payment.
