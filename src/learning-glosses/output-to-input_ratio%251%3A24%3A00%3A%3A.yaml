senseId: 'output-to-input_ratio%1:24:00::'
synsetId: 13846180-n
simpleMeaning: Counted against the power that goes in, the power that comes out of a device that turns
  one kind of power into another
scope: A count of how much power comes out of a device that changes power, set against how much goes in;
  not the power itself and not the power used up inside the device.
examples:
- The output-to-input ratio of the new amplifier is close to one.
- Engineers measure the output-to-input ratio to check how well the device works.
