simpleMeaning: that helps to cure sickness or bring a person back to good health
scope: For care or treatment that helps a person get well, also called healing, therapeutic and curative;
  not school help for students who are behind in class.
examples:
- Remedial surgery fixed the damage in his knee and let him walk again.
- Doctors praised the remedial powers of the herb for helping wounds to heal.
