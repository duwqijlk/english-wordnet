simpleMeaning: the act of managing something or of using power over it.
scope: This is not a switch or lever, not a policy that limits prices, and not skillful influence over
  people for advantage; it is the general act of managing something or using power over it.
examples:
- Careful control of the budget kept the project on schedule.
- The control of traffic around the stadium took hours of planning.
