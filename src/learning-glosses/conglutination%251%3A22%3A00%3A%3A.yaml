simpleMeaning: The healing in which the edges of a wound grow back together, or the ends of a broken bone
  knit back together.
scope: Also called union; healing in which the edges of a wound or the ends of a broken bone grow back
  together, not the closing of a wound by stitches.
examples:
- Conglutination closed the wound without a scar.
- The doctor waited for conglutination of the broken bone.
