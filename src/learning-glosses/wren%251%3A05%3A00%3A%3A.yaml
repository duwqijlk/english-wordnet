simpleMeaning: One of several kinds of small, active brown bird from the northern half of the world, with
  a short tail that points up; it eats insects
scope: 'Also called jenny wren: this is the small brown bird with a short tail that points up, not any
  other kind of bird.'
examples:
- A wren hopped through the bush looking for insects.
- The little brown wren sang from the fence with its tail pointing up.
