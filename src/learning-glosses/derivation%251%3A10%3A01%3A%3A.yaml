simpleMeaning: In historical linguistics, an account of where a word or phrase came from in the past.
scope: 'Also called deriving: in historical linguistics, an account of a word''s origins, not the line
  of reasoning, not the drawing of fluid from a sick part of the body, and not the forming of new words
  from old ones.'
examples:
- The derivation of 'window' goes back to Old Norse.
- He gave the derivation of the phrase in his lecture.
