simpleMeaning: From wet ground by the sea and river ground that floods comes wood of a common cypress
  tree of the southeast United States, its trunk wide at its foot.
scope: Also called bald cypress, pond bald cypress, and southern cypress, this is the wood of the tree,
  not the tree itself.
examples:
- This swamp cypress came from wet ground by the sea.
- They used swamp cypress from the southeast United States.
