simpleMeaning: In grammar, the part played by a person or thing that is not the doer, but is caught up
  in or changed by what the doing word says happens
scope: In grammar, the part played by a person or thing that is not the doer but is caught up in what
  happens; patient and affected role are other names for this sense.
examples:
- In 'The window broke', the window has the patient role.
- The patient role is the one that is acted on, not the doer.
