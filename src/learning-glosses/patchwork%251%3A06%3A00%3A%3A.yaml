simpleMeaning: A piece of sewing made by joining bits of different stuff in a set pattern.
scope: Sewing of different pieces joined in a pattern; not a finished quilt and not a mix of ideas.
examples:
- She made a patchwork cushion from old clothes.
- The patchwork skirt was bright with many colours.
