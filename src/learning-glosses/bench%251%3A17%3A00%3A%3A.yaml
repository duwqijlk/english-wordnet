simpleMeaning: a flat, level piece of land on a slope, with steep land above and below it
scope: A flat step of land on a slope; not the judges in a court, and not a strong table for work or a
  long seat.
examples:
- We rested on a wide bench of land halfway down the slope.
- A bench cut across the hill, with steep ground above and below it.
