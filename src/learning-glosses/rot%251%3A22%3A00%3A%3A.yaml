simpleMeaning: In biology, the breaking down of natural material, caused by bacteria (very small living
  things) or by fungi (living things like mold)
scope: 'Also called rotting and breakdown: in biology, the breaking down of natural material caused by
  bacteria or fungi, not silly untrue statements and not the state left by decay, which usually has a
  bad smell.'
examples:
- Warm, wet air speeds up rot in fallen leaves.
- Rot spread through the wet wood as fungi broke it down.
