simpleMeaning: to put a border of hanging threads around something to make it look nicer, or to form a
  border like that around something
scope: To add or form a border around something; not a light or dark band made by light, and not the border
  itself as a thing.
examples:
- She fringed the edge of the scarf with short threads.
- Tall trees fringed the edge of the lake.
