simpleMeaning: to contact a person, often to put an offer or an idea to them
scope: A verb for contacting someone to put an offer or an idea to them; not a noun for a method, a tentative
  suggestion, a near-match, a way in, a spatial or time-based move closer, a golf stroke, or a landing
  path, and not a verb for moving or coming nearer in space or time, resembling or verging on something,
  or starting on a problem.
examples:
- She decided to approach her manager about a raise.
- The company approached several investors with a new proposal.
