simpleMeaning: the act of bringing a male and female together to produce offspring
scope: This is the mating of a male and female, not a labor organization, not a marriage, not a political
  state, not a mathematical set, and not the joining of parts into one.
examples:
- The film shows the union of a male and female during the breeding season.
- Their union produced a single healthy calf.
