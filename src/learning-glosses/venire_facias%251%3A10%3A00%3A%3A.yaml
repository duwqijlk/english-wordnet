simpleMeaning: A court order that tells a sheriff to call people for jury duty.
scope: A court order to call people for jury duty; not a court order to arrest and not a call for witnesses.
examples:
- The court issued a venire facias to summon people for jury duty.
- The sheriff received the venire facias on Monday.
