simpleMeaning: a person who lives a fun, carefree life, above all one who bets on the results of games
scope: A person who lives a fun, carefree life, above all one who bets on the results of games; not a
  player in games and not a person who bets but lives a quiet life.
examples:
- The old sporting man spent his days at the races.
- A sporting man bets on horses and lives well.
