simpleMeaning: Any of several drugs that block alpha-adrenergic receptors, used to treat benign prostatic
  hyperplasia, easing the muscles of the prostate and bladder.
scope: This sense is also called alpha-adrenergic blocking agent, alpha-blocker, and alpha blocker, for
  any of several drugs that block alpha-adrenergic receptors, used to treat benign prostatic hyperplasia,
  easing the muscles of the prostate and bladder.
examples:
- Alpha-adrenergic blockers ease the prostate.
- Alpha-adrenergic blocker relaxes the bladder.
