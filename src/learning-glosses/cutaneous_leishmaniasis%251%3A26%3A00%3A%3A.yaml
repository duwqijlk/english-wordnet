simpleMeaning: a disease of the skin that makes open sores on the skin
scope: A skin disease that makes open sores, also called oriental sore, not a disease of the inner organs
  and not a common rash.
examples:
- The cutaneous leishmaniasis left open sores on her arm.
- He was treated for cutaneous leishmaniasis after sores appeared on his leg.
