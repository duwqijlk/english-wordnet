simpleMeaning: the power to rule an empire (lands ruled by one emperor), shown by a long stick the ruler
  holds
scope: Scepter is another name for this sense; this is the power to rule an empire, not the long stick
  itself that shows that power.
examples:
- When the old emperor died, the sceptre passed to his daughter, and she ruled the empire for thirty years.
- He gave up the sceptre after ten years as ruler and left the palace.
