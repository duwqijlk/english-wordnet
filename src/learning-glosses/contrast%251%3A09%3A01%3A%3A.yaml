simpleMeaning: a clear line in thought that keeps two ideas or things apart
scope: 'Also called line: a clear line in thought that keeps ideas apart, not the look of colors side
  by side and not the act of comparing things.'
examples:
- There is a sharp contrast between love and hate.
- The contrast between town life and country life is clear in his mind.
