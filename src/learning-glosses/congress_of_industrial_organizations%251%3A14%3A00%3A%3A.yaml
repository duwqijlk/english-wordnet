simpleMeaning: A league of North American unions that bring together all workers in one line of work and
  joined with the American Federation of Labor in 1955.
scope: A federation of industrial unions, also called CIO, set apart from the American Federation of Labor
  by its separate start and its 1955 joining.
examples:
- The Congress of Industrial Organizations merged in 1955.
- Workers joined the Congress of Industrial Organizations.
