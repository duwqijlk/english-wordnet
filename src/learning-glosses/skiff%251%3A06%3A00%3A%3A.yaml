simpleMeaning: a small boat of one of several kinds, that can be rowed, sailed, or driven by a motor
scope: A small boat moved by oars, sails or a motor, not a ship and not a canoe.
examples:
- We crossed the lake in a small skiff.
- The fisherman rowed his skiff out to the nets.
