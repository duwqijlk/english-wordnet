simpleMeaning: a rough, unpleasant noise made when one thing is rubbed or moved across another
scope: This noise sense is also called scratch, scrape, and scratching; it is not a low bow and not small
  pieces taken off a thing.
examples:
- We heard the scraping of chairs on the stone floor.
- The scraping of the knife on the plate hurt my ears.
