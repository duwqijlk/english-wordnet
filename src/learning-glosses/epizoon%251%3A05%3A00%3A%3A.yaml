simpleMeaning: a living thing that lives on the outside of another living thing and feeds on it, like
  a flea
scope: 'Also called ectoparasite, ectozoan, ectozoon and epizoan: a living thing that feeds on the outside
  of another living thing, not one that lives inside it and not a creature that merely visits its host.'
examples:
- The epizoon clung to the dog's skin and fed on its blood.
- Fleas are common epizoons on cats and dogs.
