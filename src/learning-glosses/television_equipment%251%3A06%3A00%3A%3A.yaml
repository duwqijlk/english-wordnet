simpleMeaning: Electronic gear that sends out or takes in waves of electric and magnetic force that carry
  pictures and sound
scope: Electronic gear that sends out or takes in waves of electric and magnetic force that carry pictures
  and sound, also called video equipment; not a radio set and not a camera alone.
examples:
- The studio bought new television equipment for the live show.
- Television equipment in the van sent the pictures back to the station.
