simpleMeaning: slowly going into a place or area where it has no right to be or no one has said it can
  go
scope: 'Also called invasive and trespassing: slowly moving into a place without a right to be there,
  not welcome there and not taking the place all at once.'
examples:
- The encroaching sea slowly covered more of the beach.
- They moved back from the encroaching weeds in the garden.
