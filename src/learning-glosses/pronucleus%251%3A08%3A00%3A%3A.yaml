simpleMeaning: Two centres, one from the egg and one from the sperm cell, stay apart after the cells meet,
  then join to make the first cell of a new living thing.
scope: It is the centre of an egg or a sperm cell after the two meet, before they join into one centre.
examples:
- The pronucleus of the egg and the pronucleus of the sperm cell had not yet joined.
- Each pronucleus kept its own centre until the two came together.
