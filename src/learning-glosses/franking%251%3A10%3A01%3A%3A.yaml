simpleMeaning: An official stamp or printed mark on mail that allows it to be sent through the post.
scope: This is the postal mark itself, not the act of stamping mail with a date and not the word meaning
  honest and direct.
examples:
- Franking on official envelopes must be approved by the post office.
- The old letters still show their original franking.
