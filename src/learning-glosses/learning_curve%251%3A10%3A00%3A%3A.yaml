synsetId: 07018078-n
simpleMeaning: A graph that shows how fast a person picks up new things, above all how much they remember
  after each try at remembering
scope: A graph of how fast a person learns; not a list of test scores, and not a measure of how clever
  someone is.
examples:
- The learning curve for the new machine was steep at first.
- Her learning curve showed fast progress in the first weeks.
