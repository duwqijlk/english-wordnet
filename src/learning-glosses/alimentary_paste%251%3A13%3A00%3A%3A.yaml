simpleMeaning: Dough shaped and left to dry, made of flour and water, at times with egg.
scope: Dough shaped and dried for cooking, also called pasta; not fresh soft dough and not baked bread.
examples:
- Alimentary paste keeps for months once it is dried.
- She boiled the alimentary paste until it was soft.
