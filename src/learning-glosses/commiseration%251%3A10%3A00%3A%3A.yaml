senseId: 'commiseration%1:10:00::'
synsetId: 06646199-n
simpleMeaning: Saying or showing that one feels for a person in grief.
scope: Also called condolence, saying or showing that one feels for a person in grief, not the feeling
  of sympathy and sorrow itself.
examples:
- They sent a note of commiseration to the family after the death.
- His commiseration was warm, and it helped her through the first hard days.
