senseId: 'abysm%1:17:00::'
synsetId: 09209256-n
simpleMeaning: A bottomless gulf or pit, or some deep pit past sounding, or seeming so, going down, often
  in words only.
scope: This sense is also called abyss, a hole or pit so deep it has no bottom, or any deep hollow going
  down that seems bottomless, often only in words.
examples:
- An abysm yawned below.
- Abysms go down forever.
