simpleMeaning: in the 1900s, a way of writing tunes that uses one fixed order of notes as the base of
  each piece
scope: In the 1900s, a way of writing tunes built on one fixed order of notes, also called serialism;
  not ordinary tunes built on a key, and not music made by chance.
examples:
- The composer wrote serial music built on a fixed order of notes.
- At the concert we heard serial music from the early 1900s.
