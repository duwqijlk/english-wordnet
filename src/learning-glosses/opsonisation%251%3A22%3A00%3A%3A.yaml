simpleMeaning: a process in which bits in the blood mark a germ so that white blood cells can take it
  in more easily
scope: A process in which bits in the blood mark a germ so that white blood cells can take it in more
  easily; opsonization is another name for this sense, not the germ itself and not the white blood cells.
examples:
- Opsonisation helps white cells swallow the germs.
- Through opsonisation, germs are marked for the white cells.
