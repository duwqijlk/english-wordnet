senseId: 'law_of_constant_proportion%1:09:00::'
synsetId: 05889461-n
simpleMeaning: 'In chemistry, every pure stuff keeps the same make-up: the same kinds of matter are always
  joined in the same amounts by weight.'
scope: 'In chemistry, every pure stuff keeps the same make-up: the same kinds of matter are always joined
  in the same amounts by weight; law of definite proportions is another name for this sense, not a rule
  about mixing things in any amount, and not a rule about impure things.'
examples:
- The law of constant proportion holds for every pure sample.
- By the law of constant proportion, water always has the same make-up.
