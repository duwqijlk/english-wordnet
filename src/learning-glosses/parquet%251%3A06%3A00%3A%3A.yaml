simpleMeaning: seats on the main floor of a theatre, between the orchestra seats and the circle of seats
  behind them
scope: Seats on the main floor of a theatre, not a floor made of small blocks of wood laid in a pattern.
examples:
- We sat in the parquet and had a clear view of the stage.
- The parquet seats cost more than the seats high up at the back.
