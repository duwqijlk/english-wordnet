simpleMeaning: Along the edge of lace or ribbon, small loops form a trim
scope: A trim of small loops along an edge, not a plain straight hem and not a fringe of hanging threads.
examples:
- The picot along the edge of the lace gave it a neat finish.
- She added a picot to the ribbon's edge.
