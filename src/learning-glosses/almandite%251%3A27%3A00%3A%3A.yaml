simpleMeaning: a gem stone with a deep red colour, of the garnet kind, made of iron, aluminium, silicon
  and oxygen
scope: This is a deep red gem stone of the garnet kind, with almandine as another name for this sense,
  and not a ruby or any other red stone.
examples:
- The almandite in the brooch caught the light.
- He polished the almandite until it shone deep red.
