simpleMeaning: A rule that a learner must know some ways of speaking.
scope: A rule that a learner must know some ways of speaking, not a rule about what books to read and
  not a test of one tongue only.
examples:
- The language requirement meant two years of French.
- She met the language requirement before her final year.
