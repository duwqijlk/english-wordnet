simpleMeaning: to make the sharp ringing sound that bits of metal make when they hit each other
scope: 'Also called jingle: to make the ringing sound of metal bits knocking together, not the sound of
  a bell and not a soft musical note.'
examples:
- The keys jangled in his pocket as he walked.
- Her bracelets jangle whenever she moves her arms.
