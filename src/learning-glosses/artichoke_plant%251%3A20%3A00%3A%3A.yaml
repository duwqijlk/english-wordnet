simpleMeaning: People eat the big flower head of this thistle-like kind from the warm lands round the
  great sea, grown in many places.
scope: Also called artichoke and globe artichoke, this thistle-like kind from the warm lands round the
  great sea is grown for its big flower head, which people eat.
examples:
- The artichoke plant was grown for its big flower heads.
- The artichoke plant bore a big flower head that they ate.
