simpleMeaning: A foodstuff made by grinding something coarsely, especially the seeds of cereal plants
  or pulse such as peas and beans.
scope: Coarsely ground foodstuff, not an occasion for eating or a finely milled flour.
examples:
- The recipe calls for a cup of coarse meal.
- They ground the dried corn into meal for porridge.
