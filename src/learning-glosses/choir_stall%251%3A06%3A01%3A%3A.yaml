simpleMeaning: a carved wooden seat with fine patterns, where priests and other church leaders sit, stand,
  or kneel during a service
scope: A carved wooden seat where priests and other church leaders sit, stand, or kneel during a service;
  not a bench for the crowd and not a seat in a theatre.
examples:
- The priest took his place in the choir stall.
- Choir stalls line both sides of the chancel.
