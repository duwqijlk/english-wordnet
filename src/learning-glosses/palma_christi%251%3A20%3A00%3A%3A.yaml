simpleMeaning: Large shrub from tropical Africa and Asia with hand-shaped leaves and spiny capsules whose
  seeds yield a thick oil and the poison ricin; now widely spread through the tropics.
scope: Another name for the same tropical shrub, also called palma christ; not a true palm, despite the
  name, and not the oil from its seeds.
examples:
- The palma christi is not a palm, despite what its name suggests.
- The palma christi now grows wild on warm coasts around the world.
