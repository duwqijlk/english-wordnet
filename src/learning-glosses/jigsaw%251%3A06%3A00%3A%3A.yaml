simpleMeaning: a power saw with a narrow blade that has small, close teeth, used to cut curved lines
scope: 'Also called a fretsaw: a power saw with a narrow blade for curved cuts. It is not the hand-held
  power saw with a blade that moves up and down for many kinds of cuts.'
examples:
- He used a jigsaw to cut a curved edge in the wood.
- The jigsaw's narrow blade made it easy to cut round shapes in the board.
