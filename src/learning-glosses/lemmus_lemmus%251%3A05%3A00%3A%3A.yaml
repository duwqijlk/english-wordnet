simpleMeaning: It is known for large moves from one place to another, even into the sea, where many drown.
scope: Also called a European lemming, it is known for large moves from one place to another that end
  in the sea, not for living in one place all its life.
examples:
- In some years Lemmus lemmus moves in great numbers toward the sea.
- Many Lemmus lemmus drown when the great move reaches the sea.
