simpleMeaning: round germs that stain purple in a lab test and live on or in living things, tending to
  grow in uneven groups; some cause boils, blood poisoning, or infections
scope: 'Also called staph and staphylococcus: round germs that grow in uneven groups, not rod-shaped germs
  and not germs that live free in soil.'
examples:
- Staphylococci in the wound caused a boil on his arm.
- The lab found staphylococci growing in uneven groups.
