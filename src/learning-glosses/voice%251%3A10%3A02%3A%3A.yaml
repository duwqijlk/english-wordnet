simpleMeaning: The tune or melodic line carried by one singer or instrument in music where several independent
  parts sound at once.
scope: This is a melodic part in music, not the sound of a person speaking, and not a right to be heard.
examples:
- The soprano voice enters first, then the alto joins a beat later.
- The cello plays the lower voice in this fugue.
