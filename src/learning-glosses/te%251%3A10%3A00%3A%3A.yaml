simpleMeaning: A sung sound that names the seventh sound of any tune in the do-re-mi set.
scope: The sung sound that names the seventh note of a tune; also called ti and si, and not the metal,
  and not the first note do.
examples:
- Te is the seventh note in solmization.
- Sing do, re, mi, fa, sol, la, te.
