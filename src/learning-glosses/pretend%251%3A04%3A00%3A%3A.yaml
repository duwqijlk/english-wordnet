simpleMeaning: The acting out of an imaginary or false situation.
scope: The activity of make-believe, not the verb for playing a role or the verb for putting on an affected
  manner; make-believe is another name for this sense.
examples:
- The sword fight was only pretend, and the children loved every minute.
- Their tea party was pure pretend, with empty cups and imaginary cakes.
