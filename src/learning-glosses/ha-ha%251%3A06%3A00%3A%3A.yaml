simpleMeaning: A ditch with a wall holding back earth on one side, used to mark off land without spoiling
  the view
scope: This is a ditch with a wall on one side used to mark off land without spoiling the view; haw-haw
  and sunk fence are other names for this sense, not a fence above the ground and not a ditch that holds
  water.
examples:
- The ha-ha kept the sheep out of the garden without a fence in sight.
- We crossed the ha-ha by a small bridge.
