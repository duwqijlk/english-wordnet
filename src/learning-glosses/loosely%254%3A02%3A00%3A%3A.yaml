simpleMeaning: In a calm easy way, with nothing held stiff or tight
scope: In a calm easy way, with nothing held stiff, not the sense of things joined in a loose way.
examples:
- She held the reins loosely as the horse walked on.
- He sat loosely in the chair, half asleep.
