simpleMeaning: The person who has it is allowed to shoot one kind of wild animal, but only in a set time
scope: A paper that allows its holder to shoot one kind of wild animal in a set time, also called game
  license, hunting licence and hunting permit; not a paper for owning a gun and not a paper for fishing.
examples:
- Her hunting license lets her shoot one kind of deer this fall.
- He applied for a hunting license before the season opened.
