simpleMeaning: a small tough plant with sharp points that grows in thick groups in the south of the United
  States
scope: This is a small tough spiny plant of the southern United States; also called saw palmetto, not
  a tall palm tree and not a desert cactus.
examples:
- The scrub palmetto grew in thick clumps along the sandy road.
- He cut back the scrub palmetto that crowded the edge of the yard.
