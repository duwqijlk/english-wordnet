synsetId: 14531553-n
simpleMeaning: the state of a passage being blocked or filled by something that stops things passing through
scope: 'Also called blockage: this is when a passage is blocked or filled, not a difficulty that is not
  a thing you can touch and not the act of blocking a passage.'
examples:
- An obstruction in the pipe stopped the water from flowing.
- The obstruction in her airway made it hard for her to breathe.
