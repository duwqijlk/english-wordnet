senseId: 'larynx%1:08:00::'
synsetId: 05537362-n
simpleMeaning: The part at the top of the tube to the lungs, made of firm springy material; its stretchy
  bands make the sound of the voice in speech
scope: 'Also called voice box: this is the voice-making part at the top of the air tube, not the tube
  itself and not the mouth or nose.'
examples:
- The doctor looked at his larynx because his voice had changed.
- A sore larynx made it hard for her to speak.
