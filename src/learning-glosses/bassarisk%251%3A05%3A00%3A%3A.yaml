simpleMeaning: With a long bushy tail ringed in black and white, this mammal like a raccoon eats both
  plants and animals, of Mexico and the southwest of the United States.
scope: Also called cacomistle, cacomixle, civet cat, coon cat, miner's cat, raccoon fox, ring-tailed cat
  and ringtail, this is a mammal like a raccoon with a long bushy tail ringed in black and white.
examples:
- The bassarisk has a long bushy tail with black and white rings.
- A bassarisk eats both plants and animals.
