simpleMeaning: A set of signs that comes to many women 2 to 14 days before their monthly flow of blood
  starts.
scope: A set of signs many women get 2 to 14 days before their monthly flow of blood starts; not an illness
  by itself.
examples:
- Her premenstrual syndrome starts about a week before her period.
- She tracks her premenstrual syndrome so she knows when it will come.
