senseId: 'chelation%1:22:02::'
synsetId: 13467145-n
simpleMeaning: In medicine, the taking of a heavy metal out of the blood by a drug that binds the metal,
  as in treating lead or mercury poisoning
scope: In medicine, the taking of a heavy metal out of the blood; not a blood transfusion and not a test
  for metals in the blood.
examples:
- Chelation helped clear the lead from his blood.
- Doctors used chelation to treat her mercury poisoning.
