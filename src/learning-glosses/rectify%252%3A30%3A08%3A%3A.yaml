simpleMeaning: To change a person's life from a wrong or bad way of living to a right way, by guiding
  them or by making them change
scope: 'Another name for reform, reclaim, and regenerate: it turns a person from a bad way of living to
  a right one, not the sense about making a thing pure and free from other matter.'
examples:
- The priest tried to rectify the young man and lead him to a better life.
- The program aims to rectify prisoners by leading them away from a life of crime.
