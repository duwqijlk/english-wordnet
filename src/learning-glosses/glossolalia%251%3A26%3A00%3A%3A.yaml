simpleMeaning: Speech that repeats the same sounds again and again but means nothing, most often heard
  when a person is in a trance or full of religious feeling
scope: Speech that repeats sounds without meaning, most often in a trance or in religious feeling, not
  a foreign language and not the talk of a sick mind.
examples:
- During the service, her glossolalia filled the room with repeated sounds.
- The preacher's glossolalia came while he was in a trance.
