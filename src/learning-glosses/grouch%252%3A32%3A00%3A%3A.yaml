simpleMeaning: to speak or act in a way that shows you are unhappy or that you think something is wrong
scope: 'Also called grumble and scold: this is showing you are unhappy or find fault with something, not
  a person who often complains and not a quiet bad mood.'
examples:
- He grouched about the long wait for the bus.
- She grouched all morning about the cold room.
