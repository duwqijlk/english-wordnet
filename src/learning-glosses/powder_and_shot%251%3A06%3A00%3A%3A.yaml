simpleMeaning: the things used to load and fire an old long gun, made of the explosive stuff that fires
  it and small metal balls
scope: This is the load for an old long gun, made of firing stuff and small metal balls, not a modern
  bullet in a case and not a gun itself.
examples:
- The soldiers carried powder and shot in their bags for their muskets.
- He bought powder and shot before he went hunting with the old gun.
