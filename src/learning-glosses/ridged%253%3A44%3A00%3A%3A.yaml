simpleMeaning: having a long raised edge, or shaped like one, or like the long beam along the bottom of
  a ship
scope: Having a long raised edge, or shaped like one; not smooth, and not simply rough or bumpy.
examples:
- The shell had a ridged surface.
- The leaf was ridged along its middle.
