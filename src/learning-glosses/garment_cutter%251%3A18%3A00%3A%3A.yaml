simpleMeaning: A person who cuts cloth and other stuff to size when making clothes.
scope: This is a person who cuts cloth to size when making clothes; not a tailor, who also sews and fits
  clothes, and not a person who sews them.
examples:
- The garment cutter measured the cloth twice before cutting.
- A garment cutter works with cloth all day.
