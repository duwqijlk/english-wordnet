senseId: 'phenylketonuria%1:26:00::'
synsetId: 14530977-n
simpleMeaning: 'A genetic disorder of metabolism: without the enzyme that turns the amino acid phenylalanine
  into tyrosine, phenylalanine builds up in body fluids and causes mental disability to varying degrees.'
scope: A genetic disorder of body chemistry caused by a missing enzyme, not an infection or a food allergy.
examples:
- Phenylketonuria results from a missing enzyme and causes mental disability of varying severity.
- In phenylketonuria, phenylalanine builds up in the body fluids.
