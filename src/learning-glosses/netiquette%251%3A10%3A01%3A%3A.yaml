simpleMeaning: When people write to each other on computers, they keep these rules of polite behaviour,
  or say that others should keep them
scope: Good manners for writing online, not the rules of a workplace and not the law about what may be
  said.
examples:
- Good netiquette means not shouting in capital letters in an email.
- She wrote a guide to netiquette for the new forum.
