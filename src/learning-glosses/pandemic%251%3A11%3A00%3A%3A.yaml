simpleMeaning: an illness that spreads to very many people over a large area, over a whole area or even
  over the whole world
scope: An illness that spreads over a large area or the whole world; not an illness found in only one
  small place.
examples:
- The pandemic spread to almost every country in the world.
- Doctors worked hard to stop the pandemic from reaching more towns.
