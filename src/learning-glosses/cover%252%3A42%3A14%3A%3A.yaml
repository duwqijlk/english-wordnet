simpleMeaning: to balance out a fault or a sense of not being good enough by making one's strengths seem
  greater
scope: Not to take another person's place, and not to include something in a wider group.
examples:
- He covers his insecurity with constant boasting about his success.
- She covered her lack of training by exaggerating her past achievements.
