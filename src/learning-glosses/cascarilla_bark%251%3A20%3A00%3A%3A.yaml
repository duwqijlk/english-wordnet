simpleMeaning: Sweet-smelling outer covering of a plant, used as a tonic and to make incense.
scope: Sweet-smelling outer covering of a plant, used as a tonic and to make incense, also called eleuthera
  bark; not the outer covering of a tree grown for wood, and not a spice for food.
examples:
- Cascarilla bark smells sweet when burned.
- He bought cascarilla bark for incense.
