senseId: 'mucopolysaccharidosis%1:26:00::'
synsetId: 14181009-n
simpleMeaning: In any of a group of illnesses passed down in families, certain sugars build up too much
  in the tissues because the body cannot break them down the right way.
scope: Any of a group of illnesses passed down in families, in which the body cannot break down certain
  sugars the right way, so too much of them builds up in the tissues.
examples:
- Mucopolysaccharidosis runs in families and affects how the body handles certain sugars.
- The doctor said mucopolysaccharidosis had caused too much sugar to build up in his tissues.
