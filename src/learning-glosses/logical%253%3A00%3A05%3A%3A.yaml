simpleMeaning: having parts that all fit together in a clear, neat order and in one pleasing style as
  a whole
scope: Another name for this sense is ordered, and it is also called consistent. It is about parts fitting
  together in a neat, pleasing whole, not about a person thinking clearly or giving good reasons.
examples:
- The house has a logical plan, with each room in the right place and the same calm style throughout.
- 'Her essay is logical in its shape: each part follows the last and the whole piece feels neat and complete.'
