simpleMeaning: to cover a thing with liquid, or to pour liquid onto it
scope: 'Also called soak, douse, drench, souse, and dowse: this is putting liquid over a thing, not the
  noun sense of a thing given to calm someone and not becoming wet yourself.'
examples:
- She sopped his hot face with cold water.
- Sop the dry cloth with water until it is wet all over.
