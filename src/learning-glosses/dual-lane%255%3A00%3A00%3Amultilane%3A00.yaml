simpleMeaning: Describes a road with a strip or island down the middle between traffic moving in opposite
  ways.
scope: Describes a road with a strip or island down the middle between traffic moving in opposite ways;
  divided is another name for this sense, not a road with no middle strip and not a one-way road.
examples:
- The dual-lane road had a grass strip down the middle.
- They widened the dual-lane highway last year.
