simpleMeaning: Fine results put a person in a favourable state
scope: A favourable state that comes from fine results, also called good fortune and luckiness, not a
  lucky charm and not a wish said to someone before a test.
examples:
- Good luck seemed to follow him wherever he went that year.
- She thanked her good luck for the fine weather on her wedding day.
