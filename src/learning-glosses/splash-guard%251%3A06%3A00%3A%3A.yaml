simpleMeaning: it keeps the rider dry by stopping the water and mud a wheel throws up, with a curved cover
  set over the wheel
scope: Also called a mudguard and a splash guard, it keeps the rider dry on a bike or motorbike.
examples:
- The splash-guard stopped the mud thrown up by the wheel.
- A splash-guard over the wheel kept the rider from the mud.
