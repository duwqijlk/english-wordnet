simpleMeaning: a tool that measures how film reacts to light, over many different amounts of light
scope: A tool that measures how film reacts to light over a range of amounts of light; not a camera, and
  not a meter that measures the light in a room.
examples:
- The technician used a sensitometer to test the new film.
- A sensitometer showed how the film behaved at different exposures.
