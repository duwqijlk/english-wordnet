simpleMeaning: The act of making a thing or a way of acting look new and of today
scope: This is the act of making a thing or a way of acting look new and of today; modernization is another
  name for this sense, and not putting a thing back to an old style or leaving it as it is.
examples:
- The modernisation of Nigeria will be a long process.
- The town's modernisation brought new roads and new shops.
