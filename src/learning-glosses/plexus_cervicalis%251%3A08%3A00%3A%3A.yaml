simpleMeaning: A net of nerves lying under the big muscle at the side of the neck
scope: A net of nerves lying under the big muscle at the side of the neck; also called cervical plexus;
  not a net of nerves in the arm.
examples:
- The plexus cervicalis supplies the skin of the neck.
- The surgeon worked just above the plexus cervicalis.
