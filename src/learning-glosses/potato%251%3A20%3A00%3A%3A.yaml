simpleMeaning: Widely grown as a garden vegetable, this plant, native to South America, lives one season,
  with creeping underground stems that end in edible starchy swellings; its vines are poisonous.
scope: The plant grown for its edible tubers, not the tuber itself sold as food or the sweet potato, a
  different vine.
examples:
- The potato is an annual plant that bears edible starchy tubers underground.
- Potato vines are poisonous.
