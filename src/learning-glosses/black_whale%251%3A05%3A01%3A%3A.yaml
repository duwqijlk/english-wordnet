simpleMeaning: A large sea animal with a big hollow in its head that holds a waxy stuff and oil, and people
  get ambergris from it.
scope: A large sea animal with a big hollow in its head; cachalot is another name for this sense, not
  the small dark whale of the Atlantic coast and not a pilot whale.
examples:
- The black whale can dive deep for food.
- Sailors once hunted the black whale for its oil.
