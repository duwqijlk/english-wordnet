simpleMeaning: to hold someone or something in deep respect, and to think of them as holy or far above
  others and feel wonder at them
scope: 'Also called fear, reverence, and revere: to hold someone or something in deep respect and wonder,
  not to be afraid of them as a danger.'
examples:
- People venerate the old teacher for her wisdom and kindness.
- They venerate their first leader and keep his photo in a special place.
