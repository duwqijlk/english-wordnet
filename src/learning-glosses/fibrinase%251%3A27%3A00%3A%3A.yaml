simpleMeaning: During the clotting of blood, factor XIII is turned into its active form by thrombin, a
  substance in blood, and that form makes fibrin set into a firm clot.
scope: A substance made during blood clotting that turns fibrin into a firm clot, not the clot itself
  and not the factor it comes from.
examples:
- The lab measured fibrinase activity in the blood sample.
- Fibrinase helps the fibrin threads lock into a firm clot.
