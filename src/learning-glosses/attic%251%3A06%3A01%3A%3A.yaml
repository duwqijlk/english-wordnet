simpleMeaning: In architecture, a low wall at the top of the part above the columns (the entablature),
  which hides the roof
scope: In architecture, this is the low wall at the top of a building that hides the roof, not the open
  space under a house roof used for keeping things.
examples:
- A low attic runs along the top of the building and hides the roof.
- The attic above the columns was plain, with no writing or pictures on it.
