simpleMeaning: the use of very short radio waves to study how atoms or molecules take in energy at set
  wave lengths
scope: Using very short radio waves to study how atoms or molecules take in energy at set wave lengths;
  not a kitchen oven that heats food and not ordinary light.
examples:
- Microwave spectroscopy showed the set wave lengths at which the molecule takes in energy.
- The lab used microwave spectroscopy to study the gas.
