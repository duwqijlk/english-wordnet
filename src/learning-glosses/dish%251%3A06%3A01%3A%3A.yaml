simpleMeaning: a bowl-shaped piece of equipment with a curved surface that catches and sends radio waves
  and microwaves (very short radio waves) in one direction
scope: This is a curved piece of equipment for catching and sending signals. It is not a plate or bowl
  for holding or serving food.
examples:
- A large dish on the roof picks up signals from far away.
- The radio dish outside the building is shaped like a bowl.
