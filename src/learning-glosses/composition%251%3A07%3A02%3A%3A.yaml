simpleMeaning: the way parts are put together, so that each part fits with the others and with the whole
scope: The way parts fit together in a thing, not what the thing is made of and not its style.
examples:
- The composition of the painting draws your eye to the centre.
- Good composition helps each part of the picture fit with the whole.
