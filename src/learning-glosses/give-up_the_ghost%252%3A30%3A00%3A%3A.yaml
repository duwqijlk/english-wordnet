simpleMeaning: A person leaves this life, and the body loses all the parts and work that kept it alive
scope: To leave this life, the body losing all the parts and work that kept it alive, also called buy
  the farm, cash in one's chips, choke, conk, croak, decease, die, drop dead, exit, expire, go, kick the
  bucket, pass, pass away, perish and pop off, not to fall asleep and not to leave a place.
examples:
- The old man gave up the ghost in his sleep.
- After the long illness, she gave up the ghost at home.
