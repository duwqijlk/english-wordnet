simpleMeaning: Any fungus of the group that bears this name, like the single-celled fungi that make bread
  rise, and with no known sexual form.
scope: A yeast-like fungus of this group, not a mould and not a bacterium.
examples:
- Candida is listed among the yeastlike fungi in the book.
- The sample of candida grew in the dish.
