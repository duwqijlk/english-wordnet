simpleMeaning: the water held inside a chemical compound that has taken in water
scope: The water held inside a chemical compound that has taken in water; water of crystallisation and
  water of crystallization are other names for this sense, and it is not water merely mixed in from outside.
examples:
- The water of hydration stayed bound inside the crystals.
- Water of hydration is driven off by strong heat.
