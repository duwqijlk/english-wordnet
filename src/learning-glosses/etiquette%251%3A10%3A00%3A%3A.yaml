simpleMeaning: the rules for how to behave in a way that other people think is good and polite
scope: The rules for polite behaviour when you are with other people, not the law and not one polite act
  on its own.
examples:
- Good etiquette says you should say thank you after someone helps you.
- He learned the etiquette for formal dinners before his visit.
