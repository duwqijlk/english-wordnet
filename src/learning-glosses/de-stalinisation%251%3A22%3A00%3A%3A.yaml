simpleMeaning: The social process of weakening Joseph Stalin's sway by changing his policies, taking down
  his monuments and renaming places named for him.
scope: Also called destalinisation, destalinization and de-Stalinization; the social process of undoing
  Stalin's influence by revising policies and removing monuments.
examples:
- De-Stalinisation meant renaming places named for Stalin.
- His statue came down during de-Stalinisation.
