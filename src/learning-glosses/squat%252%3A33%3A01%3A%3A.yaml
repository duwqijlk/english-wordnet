simpleMeaning: to do a weight lifting exercise in which you bend your knees, move down low, and stand
  up again
scope: Doing this lifting exercise, not just sitting low on your heels in daily life and not living in
  an empty building without the owner's agreement.
examples:
- He squats with a heavy bar across his shoulders at the gym.
- She squatted ten times with weights as part of her training.
