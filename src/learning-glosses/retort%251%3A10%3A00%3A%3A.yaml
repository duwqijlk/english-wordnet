simpleMeaning: a reply made at once to what someone asks or says, especially a clever one that finds fault
  with them
scope: 'Also called return and counter: a quick answer to what someone asks or says, not a special vessel
  in which things are heated to separate them.'
examples:
- '"Then why is your name on it?" came his sharp retort.'
- The teacher's hard question brought a clever retort from the student.
