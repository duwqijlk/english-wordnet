simpleMeaning: The way the small glands in the skin make and send out a salty liquid
scope: This is the way the small glands in the skin make and send out a salty liquid; sweating, perspiration
  and hidrosis are other names for it, not tears and not the flow of blood.
examples:
- Diaphoresis soaked his shirt during the fever.
- The heat brought on heavy diaphoresis.
