simpleMeaning: looking or feeling unhappy about how things are and wanting something more or different,
  with a wish that will not rest
scope: Looking or feeling unhappy about how things are and wanting something more, not being angry and
  not being sad without a reason.
examples:
- He was discontent with his low pay.
- Discontent faces filled the room.
