simpleMeaning: a hole or opening where liquid or gas can go into a tube or a container
scope: An opening where liquid or gas goes in, also called intake; it is not an opening where liquid or
  gas goes out.
examples:
- Water flows through the inlet into the tank.
- He cleaned the inlet of the pipe so water could go in.
