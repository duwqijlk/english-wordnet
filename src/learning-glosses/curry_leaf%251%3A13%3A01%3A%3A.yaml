simpleMeaning: People in the south and on the west coast of India and in Sri Lanka use a green part of
  a tree to give food a taste.
scope: It is valued as a seasoning in cooking in the south and on the west coast of India and in Sri Lanka,
  not the tree itself.
examples:
- She added a curry leaf to the pot to give the dish its taste.
- The cook picked a curry leaf from the curry tree before cooking.
