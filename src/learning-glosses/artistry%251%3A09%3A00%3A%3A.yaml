simpleMeaning: a very high level of skill, learned through study, practice and watching with care
scope: 'Also called art, and another name for it is prowess: this is a high skill a person learns, not
  a painting, song or other work that a person makes.'
examples:
- Her artistry on the piano came from years of study and practice.
- His artistry as a dancer grew from watching great dancers and practicing each day.
