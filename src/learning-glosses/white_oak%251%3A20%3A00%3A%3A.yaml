simpleMeaning: Any of many Old World and American oaks with 6 to 8 stamens per small flower, acorns ripening
  in one year, and leaf veins never running past the leaf edge.
scope: For an Old World or American oak with acorns ripening in one year.
examples:
- White oaks ripen acorns in a year.
- White oak leaves have short veins.
