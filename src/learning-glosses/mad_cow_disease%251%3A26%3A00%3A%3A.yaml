simpleMeaning: Cattle die from this illness, which harms the brain and spine and leaves the animals staggering
  and restless.
scope: Also called bovine spongiform encephalitis, this fatal illness of cattle harms the brain and spine
  and makes the animals stagger and grow restless.
examples:
- The cattle staggered after mad cow disease took hold.
- Mad cow disease made the animals restless and unsteady.
