senseId: 'square%1:18:00::'
synsetId: 10662243-n
simpleMeaning: A person who is proper and set in old-fashioned ways.
scope: This labels a person as stiff and old-fashioned, not someone who fails to follow what is happening,
  and not the adjective for something rigidly conventional.
examples:
- My grandfather thought anyone who liked that band was a square.
- At the party he felt like a square among all those artists.
