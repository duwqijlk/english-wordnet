simpleMeaning: Golden yellow blooms that smell nice grow on a bush of the south-western United States
  and Mexico, a plant that keeps its leaves all year and is often grown.
scope: Also called bush poppy, this is a bush of the south-western United States and Mexico grown for
  its golden yellow blooms.
examples:
- Golden yellow blooms cover the tree poppy.
- People grow the tree poppy for its nice-smelling blooms.
