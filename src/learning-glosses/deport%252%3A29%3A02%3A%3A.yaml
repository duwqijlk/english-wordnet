simpleMeaning: to act in a certain way and show it in how you carry yourself
scope: To act in a certain way and show it in how you carry yourself, with act, do, carry, bear, behave
  and conduct as other names for this sense, and not to send someone out of a country.
examples:
- She deported herself with calm grace at the ceremony.
- He deported himself badly at the meeting, shouting at everyone.
