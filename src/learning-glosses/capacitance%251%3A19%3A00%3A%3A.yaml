simpleMeaning: In electricity, the way a thing holds an electric charge
scope: 'Also called capacity and electrical capacity: in electricity, how a thing holds an electric charge,
  not the charge itself and not the power a thing uses.'
examples:
- The capacitance of the plate let it hold a charge.
- A larger capacitance stores more charge.
