simpleMeaning: At the very back of a ship, on the lowest back mast, hangs a cloth set along the length
  of the ship, most often on the mizzenmast.
scope: This cloth is set along the length of a ship on the lowest mast at the very back, not hung across
  the ship.
examples:
- The crew raised the spanker.
- The spanker was lowered when they reached port.
