simpleMeaning: money you get without working for it, such as money paid to you for owning shares, for
  lending money, or for letting a house
scope: This is money a person gets without working for it, also called unearned revenue, and not money
  a firm gets before it has done the work.
examples:
- Her unearned income comes from rent on the flat she lets out.
- Dividends from his shares count as unearned income.
