simpleMeaning: Caught for food and sport, this fish with dark lines down its sides leaves the sea to lay
  eggs upriver and is sometimes put with the Morone group.
scope: Also called striped bass and rockfish, this fish with dark lines down its sides leaves the sea
  to lay eggs, not a man who wears stripes to show his rank.
examples:
- A striper took the bait.
- The striper left the sea to lay eggs upriver.
