senseId: infinitesimal%5:00:00:small:00
synsetId: 01396483-s
simpleMeaning: so small that it cannot be measured, with no limit to how small it is
scope: This describes a thing's size as extremely small; it is not the mathematics noun for a variable
  (a changing number) that gets closer and closer to zero.
examples:
- An infinitesimal amount of dust can still spoil the machine.
- The change in temperature was infinitesimal, so we barely noticed it.
