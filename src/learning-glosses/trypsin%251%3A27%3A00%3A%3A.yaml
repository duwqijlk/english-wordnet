simpleMeaning: Proteins in the body are broken down into smaller bits with the help of water by an enzyme
  from the pancreas that speeds up the change.
scope: This is one of the body's own enzymes that speed up changes, this one from the pancreas, breaking
  proteins down into smaller bits.
examples:
- The body uses trypsin to break proteins down into smaller bits.
- Without trypsin, proteins would stay in large pieces.
