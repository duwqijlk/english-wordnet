simpleMeaning: in a quick way, with no warning, when a thing is not expected, done on a sudden urge with
  no plan made first
scope: Also called dead, suddenly, and short, this is doing or happening in a quick way with no warning
  and no plan made first.
examples:
- She stopped abruptly in the middle of the road.
- He left abruptly, without saying goodbye to anyone.
