simpleMeaning: Art, writing and, most of all, building design made in a way that goes against modernism
  (an older, long-used set of ideas and ways in the same fields)
scope: This is a kind of art, writing and building design that works against modernism; it is not modernism
  itself and not just any new art made today.
examples:
- The building's odd shapes and bright colours are a clear example of postmodernism.
- She wrote a book about postmodernism in art and building design.
