simpleMeaning: the group of poor farm workers who live in the country, seen as one class in society
scope: This names the whole group together, not one farm worker on his own and not the rich people who
  own the land.
examples:
- The peasantry worked in the fields around the village.
- New taxes fell hard on the peasantry.
