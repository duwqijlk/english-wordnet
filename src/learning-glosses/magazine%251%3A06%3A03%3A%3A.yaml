simpleMeaning: A metal holder for cartridges (bullets in their cases) that slots into an automatic gun.
scope: This is the detachable holder that feeds ammunition into a gun, not a place where weapons are stored,
  and not the film chamber of a camera.
examples:
- He slapped a fresh magazine into his rifle.
- The magazine was empty after only a few seconds of firing.
