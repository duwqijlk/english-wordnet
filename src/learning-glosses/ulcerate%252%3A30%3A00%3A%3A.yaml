senseId: 'ulcerate%2:30:00::'
synsetId: 00538233-v
simpleMeaning: to form a painful open sore (an ulcer) in or on a part of the body
scope: This sense means a part of the body itself forms such a sore; it is not the sense where something
  else causes a sore to form in it.
examples:
- Her stomach ulcerated after months of pain.
- The skin on his foot ulcerated and was slow to get better.
