simpleMeaning: A sizing tool, a thin strip of cloth, or else metal, marked by inches, and by centimetres,
  to size lengths.
scope: This sense is also called tape and tape measure, a narrow band of cloth or metal marked in inches
  or centimetres, used to size lengths.
examples:
- A tapeline sized the room.
- Tapelines mark inches.
