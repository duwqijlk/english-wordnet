simpleMeaning: A fungus, a tiny living thing, that grows as a thin coat, often white, on natural matter
  such as wood, cloth, or food
scope: A thin growth, often white, on natural matter; not the act of going mouldy, and not the slow change
  of becoming so.
examples:
- Mildew had spread across the damp wall in white patches.
- The old books smelled of mildew after years in the cellar.
