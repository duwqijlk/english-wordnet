simpleMeaning: Lights that people on foot switch on themselves mark a place where they cross the road,
  and its name comes from 'pedestrian light control'.
scope: This road crossing has lights switched on by the people on foot, not lights that change on their
  own.
examples:
- People on foot switched on the lights at the pelican crossing.
- They crossed the road at the pelican crossing.
