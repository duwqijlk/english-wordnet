schema: oewn-learning-gloss-v2
senseId: 'gabble%2:32:00::'
synsetId: 01038676-v
simpleMeaning: to talk fast about small, unimportant things and keep talking without a stop
scope: Also called chatter, clack, prattle, gibber, blabber, blab, tattle, piffle, prate, twaddle, palaver,
  and maunder. It is fast, non-stop talk about small, unimportant things, not a clear talk about an important
  subject.
examples:
- She gabbled about the weather and her shoes for ten minutes.
- He gabbled so fast about small party details that no one could follow him.
