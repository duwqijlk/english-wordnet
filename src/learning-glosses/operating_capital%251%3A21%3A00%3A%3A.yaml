simpleMeaning: A firm keeps money on hand for its work, such as making things or moving goods, as distinct
  from money for deals and long-term work.
scope: This is money a firm keeps on hand for its work, not money for deals or long-term work.
examples:
- The firm set aside operating capital for its work.
- The firm kept running on operating capital.
