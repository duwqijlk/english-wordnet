simpleMeaning: Loose grey peel hangs in strips from this North American nut tree, whose nuts can be eaten.
scope: Also called shagbark, shellbark and shellbark hickory, it is the same nut tree, with loose peel
  that hangs in strips, not a smooth-barked kind.
examples:
- The shagbark hickory gave nuts we could eat.
- Strips of loose grey peel hung from the shagbark hickory.
