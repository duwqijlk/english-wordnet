schema: oewn-learning-gloss-v2
senseId: 'fricativeness%1:07:01::'
synsetId: 92424007-n
simpleMeaning: In phonetics, the quality of a sound made by pushing air through a narrow gap in the mouth,
  often giving a hissing or buzzing effect, as with /f/ and /s/
scope: The hissing quality of certain speech sounds; not a fricative consonant itself, the sound that
  has this quality, and not voicing, which is vocal-cord vibration.
examples:
- The fricativeness of /s/ comes from air squeezed through a narrow channel behind the teeth.
- Phonetics students learn to hear the fricativeness in sounds like /f/ and /v/.
