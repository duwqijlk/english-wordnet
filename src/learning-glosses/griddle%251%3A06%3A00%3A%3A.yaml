simpleMeaning: a cooking tool with a flat, hot surface, such as on top of a stove, where food is cooked
scope: This is the flat cooking surface itself, not the act of cooking food on it and not a deep pan.
examples:
- She cooked pancakes on the griddle.
- The eggs cooked quickly on the hot griddle.
