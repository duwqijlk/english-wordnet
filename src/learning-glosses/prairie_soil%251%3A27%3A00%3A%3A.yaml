simpleMeaning: a kind of ground found under grass in places with mild weather through the year
scope: A kind of ground found under grass in mild places, not ground under trees and not dry sand.
examples:
- This prairie soil lies under grass in a part of the country with mild weather.
- The prairie soil in this mild land has grass growing over it year after year.
