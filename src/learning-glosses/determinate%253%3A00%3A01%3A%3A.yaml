schema: oewn-learning-gloss-v2
senseId: 'determinate%3:00:01::'
synsetId: 00743515-a
simpleMeaning: set in a clear and exact way, and most of all fixed by a rule or by one cause that does
  not change
scope: This is a thing set in a clear and exact way, most of all fixed by a rule or by one cause that
  does not change; not a thing left open and not a thing that can change at will.
examples:
- They measured a determinate distance between the two posts.
- The rules set a determinate number of days for the appeal.
