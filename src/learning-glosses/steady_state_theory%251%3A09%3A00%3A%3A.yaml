simpleMeaning: In cosmology, the idea that the universe stays just as full of matter on average, as new
  matter is made to fill the space left by galaxies moving apart.
scope: 'Also called continuous creation theory: in cosmology, the idea that the universe stays just as
  full of matter on average, not the big bang theory that took its place.'
examples:
- The steady state theory says new matter fills the space left by galaxies moving apart.
- Under the steady state theory, the universe keeps the same average density.
