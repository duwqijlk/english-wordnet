simpleMeaning: One of several Fortunella trees or shrubs, it bears small edible orange fruits with thick
  sweet skin and sour pulp.
scope: Another spelling of kumquat, the Fortunella tree or shrub grown for its small orange fruits; not
  the fruit itself.
examples:
- The cumquat in the garden bore small orange fruit.
- Cumquats grow well in large pots.
