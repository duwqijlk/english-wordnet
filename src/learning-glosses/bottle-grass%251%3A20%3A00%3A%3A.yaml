simpleMeaning: Growing wild in North America now, this plant from Europe carries a soft tail-like head
  and is often a weed that causes trouble.
scope: A plant from Europe now growing wild in North America, also called bottle grass, green bristlegrass,
  green foxtail and rough bristlegrass.
examples:
- The bottle-grass grew thick and had to be pulled up.
- The soft tail-like head marked the bottle-grass among the other plants.
