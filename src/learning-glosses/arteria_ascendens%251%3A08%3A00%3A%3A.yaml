simpleMeaning: Blood reaches the upward-running part of the gut through this side tube from the one that
  feeds the lower gut.
scope: The ascending artery is the name for this side blood tube, which feeds the part of the gut that
  runs upward.
examples:
- The arteria ascendens feeds the ascending colon.
- Blood flows through the arteria ascendens to the upward part of the gut.
