simpleMeaning: The branch of the healing art that uses materials giving off rays, either to make pictures
  of a sick person's body or to kill sick cells
scope: The branch of the healing art that uses materials giving off rays to make pictures of the body
  or kill sick cells; not the branch that uses drugs alone, and not the branch that cuts the body open.
examples:
- Nuclear medicine helped the doctors see the tumour inside her.
- He works in nuclear medicine at the city hospital.
