simpleMeaning: In Mexico and the southwestern United States lives a mammal like a raccoon, eating both
  plants and animals, with a long bushy tail ringed in black and white.
scope: Also called bassarisk, cacomixle, civet cat, coon cat, miner's cat, raccoon fox, ring-tailed cat,
  and ringtail, this is a raccoon-like animal of Mexico and the southwestern United States with a long
  ringed tail, not a true raccoon.
examples:
- We saw a cacomistle, its long tail ringed in black and white.
- We saw a cacomistle eating fruit.
