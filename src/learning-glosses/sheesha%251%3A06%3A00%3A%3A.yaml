simpleMeaning: Smoke passes through water and cools in a jar joined by a long tube that bends to a pipe
  from eastern lands for smoking tobacco.
scope: Also called hookah, shisha, calean, chicha, hubble-bubble, hubbly-bubbly, kalian, narghile, nargileh
  and water pipe, it is a pipe that cools smoke by passing it through water.
examples:
- He drew on the sheesha and the smoke came to him cool from the water.
- The smoke from the sheesha came cool through the water.
