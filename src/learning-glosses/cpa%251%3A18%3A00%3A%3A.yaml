simpleMeaning: An accountant who has passed set exams and met all the legal and licence rules of a United
  States state so that the state certifies them
scope: Also called certified public accountant, this state-certified accountant has met a United States
  state's exam and licensing rules.
examples:
- The CPA prepared the tax returns for the firm.
- She passed her exams and became a CPA.
