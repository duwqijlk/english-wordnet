simpleMeaning: Any of many hybrid begonias, usually with thick underground stems, from an East Indian
  plant. Leaves are rough and patterned silver, bronze, purple and red-brown; flowers are plain, not showy.
scope: This is the begonia kind with leaves patterned in silver, bronze, purple and red-brown, not a small-flowered
  bedding begonia; painted-leaf begonia, rex begonia and beefsteak geranium are other names for the same
  plant.
examples:
- A king begonia filled the shady corner of the greenhouse with patterned foliage.
- He watered the king begonia sparingly through the winter.
