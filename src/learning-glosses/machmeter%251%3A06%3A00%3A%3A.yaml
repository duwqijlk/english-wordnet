simpleMeaning: A gauge that shows how fast an aircraft flies compared with the speed of sound.
scope: A gauge for a plane's speed set against the speed of sound, not a car's speed gauge and not a measure
  of height.
examples:
- The pilot checked the machmeter as the jet neared the speed of sound.
- A faulty machmeter gave the wrong reading during the test flight.
