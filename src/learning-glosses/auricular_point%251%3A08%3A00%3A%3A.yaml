simpleMeaning: a set spot at the middle of the opening of the ear canal, used to measure the skull
scope: 'Also called auriculare: a set spot at the middle of the ear canal opening, not the ear canal itself
  and not the top of the ear.'
examples:
- The auricular point marks the middle of the ear opening.
- Doctors use the auricular point to measure the skull.
