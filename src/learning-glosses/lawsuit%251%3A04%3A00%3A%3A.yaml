simpleMeaning: A general word for any case in a court of law in which a person asks the court to put a
  wrong right.
scope: A general word for any court case in which a person asks for a legal remedy, with case, suit and
  cause as other names for this sense, and not a trial brought by the state.
examples:
- The family brought a lawsuit against the landlord.
- Her lawsuit asks the court to order the firm to pay her.
