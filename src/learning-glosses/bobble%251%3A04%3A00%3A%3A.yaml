schema: oewn-learning-gloss-v2
senseId: 'bobble%1:04:00::'
synsetId: 00072684-n
simpleMeaning: In baseball, a short time when a player does not catch or hold a hit or thrown ball cleanly,
  and the ball moves in his hands
scope: In baseball, this is the short time a player fails to hold a ball cleanly; it is not the verb sense
  that means to make a mess of something.
examples:
- The second baseman made a bobble but still threw the runner out.
- A bobble in the outfield let the runner reach second base.
