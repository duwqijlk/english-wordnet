simpleMeaning: a strong cover over a ship's round window that is shut when the sea is rough
scope: A strong cover shut over a ship's round window in rough seas, not a window itself and not a lamp
  or light.
examples:
- The crew fitted the deadlight over the porthole before the storm.
- He bolted the deadlight shut as the waves grew high.
