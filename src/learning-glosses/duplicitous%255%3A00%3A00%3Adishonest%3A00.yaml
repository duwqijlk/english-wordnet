simpleMeaning: meant to trick people, especially by pretending to have one set of feelings and acting
  from another set
scope: 'Also called deceitful and ambidextrous: tricking people by pretending one set of feelings while
  acting from another, not simply telling one lie.'
examples:
- He was duplicitous, smiling warmly at his boss while secretly working to get him fired.
- She gave a duplicitous smile, acting warm while planning to betray her friend.
