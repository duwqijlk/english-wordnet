simpleMeaning: the lean flesh of a sea animal found in warm waters, most of all in Hawaii
scope: The lean flesh of a sea animal found in warm waters, most of all in Hawaii, also called mahimahi;
  not the whole animal and not the flesh of a river animal.
examples:
- Dolphinfish is served grilled in Hawaii.
- They ordered dolphinfish with rice.
