simpleMeaning: A kitchen box that cooks food by passing a wave of electric and magnetic power through
  it, heating the tiny bits of water in the food.
scope: A kitchen box that cooks food with a wave of electric and magnetic power, not the wave itself and
  not the act of heating food in one.
examples:
- She heated the soup in the microwave.
- The microwave beeped when the rice was done.
