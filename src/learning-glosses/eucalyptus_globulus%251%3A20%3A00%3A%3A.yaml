simpleMeaning: A tall tree that grows fast and gives wood, with leaves that hold a healing oil; its young
  leaves look a little blue.
scope: Also called blue gum and fever tree, this tall fast-growing tree gives wood and has leaves that
  hold a healing oil, not any other tall tree whose leaves hold oil.
examples:
- Eucalyptus globulus grows tall in the garden.
- The young leaves of Eucalyptus globulus look a little blue.
