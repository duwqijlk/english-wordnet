simpleMeaning: 'The part of the cell that sets sex, found in both sexes: one copy in males and two copies
  in females.'
scope: This is the part of the cell that sets sex, with one copy in males and two in females; it differs
  from the Y chromosome, which is found only in males.
examples:
- Human females normally have two X chromosomes.
- A male has one X chromosome and one Y chromosome.
