simpleMeaning: a cut in the total sum on which tax is worked out, which lowers the tax by a set share
  for the earner's pay band
scope: A cut in the sum on which tax is worked out; not a sum taken off pay, and not a conclusion drawn
  from facts.
examples:
- She claimed a deduction for her work clothes.
- The deduction cut the tax he had to pay.
