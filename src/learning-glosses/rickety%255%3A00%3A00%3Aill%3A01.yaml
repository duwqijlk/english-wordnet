simpleMeaning: having or showing the signs of rickets, a disease that makes the bones soft and bent
scope: A person or a part of the body marked by rickets, a disease that makes bones soft and bent, not
  merely weak in body and not a shaky piece of furniture.
examples:
- The rickety child had bowed legs from the disease.
- The doctor saw rickety joints in the young patient.
