simpleMeaning: a bright-coloured North American water bird that makes its nest inside hollow trees
scope: 'Also called a wood duck or a wood widgeon: a bright-coloured North American water bird that nests
  in hollow trees, not a plain brown duck and not a bird that nests on the ground.'
examples:
- A summer duck nested in the hollow tree by the lake.
- We saw a summer duck with bright feathers on the pond.
