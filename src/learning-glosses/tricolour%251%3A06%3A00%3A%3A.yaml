simpleMeaning: a flag with three bands of colour, often the French flag
scope: This is a flag with three coloured bands; tricolor is another name for this sense. Not a flag with
  one colour and not a flag with two or four bands.
examples:
- The tricolour flew above the town hall.
- She waved a small tricolour at the parade.
