schema: oewn-learning-gloss-v2
senseId: 'profane%2:41:01::'
synsetId: 02585532-v
simpleMeaning: to make a person lose their good morals, through too much drink or through giving in too
  much to sex and pleasure
scope: 'Also called corrupt, pervert, demoralize, subvert, debase, misdirect, deprave, debauch, demoralise
  and vitiate: this is the verb sense of making a person bad in morals. It is not the adjective senses,
  about cursing, about not respecting holy things, or about not being holy.'
examples:
- Bad companions profaned the young man, leading him to drink too much and live badly.
- He was accused of profaning the students by pushing them toward drink and sex.
