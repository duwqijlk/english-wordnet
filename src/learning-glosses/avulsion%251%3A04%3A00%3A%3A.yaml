simpleMeaning: a body part torn away from another body part by force or cut away in an operation
scope: A body part torn or cut away from another, not a break inside the body and not a river changing
  course.
examples:
- The avulsion of the tendon left his finger unable to bend.
- The surgeon treated the avulsion after the accident.
