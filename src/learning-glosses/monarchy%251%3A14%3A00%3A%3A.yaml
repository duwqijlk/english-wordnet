senseId: 'monarchy%1:14:00::'
synsetId: 08380739-n
simpleMeaning: a way of ruling a country where one person holds all the power and usually gets that power
  from family
scope: One person ruling a country, with power that usually comes from family; not a country ruled by
  people chosen in votes, and not rule by a small group.
examples:
- In a monarchy, the king got his power from his father.
- The country was a monarchy for hundreds of years.
