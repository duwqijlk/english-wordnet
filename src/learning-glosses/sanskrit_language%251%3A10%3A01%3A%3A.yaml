scope: In Hinduism, an old tongue of India, the tongue of the Vedas and of Hinduism, still an official
  tongue of India though now used only for religion; Sanskrit and Sanskritic language are other names
  for this sense, and it is set apart from other tongues of India by its use in the Vedas and for religion.
