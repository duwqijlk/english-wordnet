simpleMeaning: The study of how rays given off by atoms change living things
scope: The study of how rays from atoms affect living things, not the use of such rays to take pictures
  or to treat illness.
examples:
- She chose radiobiology as her field after a course on how radiation affects cells.
- The radiobiology lab studies how radiation changes the growth of plants.
