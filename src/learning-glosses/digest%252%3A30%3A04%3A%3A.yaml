simpleMeaning: To make a thing soft or make it fall apart with chemicals, heat, or wet
scope: To make a thing soft or make it fall apart with chemicals, heat, or wet, not the sense of a thing
  growing soft on its own after being left in heat or wet, and not the food sense.
examples:
- The acid digested the cloth in a few hours.
- Chemicals digested the waste into a soft pulp.
