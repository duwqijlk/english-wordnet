simpleMeaning: A stretch of low land that stays wet, with grass on it, usually at the edge where dry land
  meets water
scope: 'Also called a fen, a marsh, or marshland: low wet grassy ground, not dry farmland and not open
  water.'
examples:
- Thousands of acres of fenland stretch across eastern England.
- Birds nest in the tall grass of the fenland.
