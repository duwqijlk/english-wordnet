simpleMeaning: Salmon cured in salt water, less salty than most kinds; sugar is sometimes used too.
scope: Also called Nova lox, Nova salmon, Nova Scotia salmon, and Nova style salmon; salmon cured in salt
  water and less salty than most, not smoked salmon and not fresh salmon.
examples:
- Nova Scotia lox tastes milder than most cured salmon.
- The deli sells Nova Scotia lox by the pound.
