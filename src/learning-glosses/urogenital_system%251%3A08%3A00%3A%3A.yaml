simpleMeaning: all the parts of the body that make babies and make and pass urine
scope: 'Also called apparatus urogenitalis, genitourinary apparatus, genitourinary system, systema urogenitale,
  urinary apparatus, urinary system, and urogenital apparatus: the set of body parts for both making babies
  and passing urine, not just the parts that make urine and not just the parts for making babies.'
examples:
- The urogenital system includes the kidneys and the organs used in making babies.
- A doctor who studies the urogenital system looks at both the urine-making parts and the parts used in
  making babies.
