simpleMeaning: Standing upright is helped when a muscle tightens on its own as the cord that joins it
  to a bone is pulled.
scope: It is also called stretch reflex, and it is a muscle tightening on its own when its cord is pulled,
  not a movement a person chooses to make.
examples:
- The myotactic reflex tightened the muscle when the tendon was pulled.
- A myotactic reflex helps a person stand upright.
