simpleMeaning: the making of things that are formed by joining two or more things together, with the help
  of energy that travels in waves, such as light, especially in plants
scope: The making of new things by joining parts together, using energy that travels in waves such as
  light, especially in plants; not the way living things get energy from food and air, and not just growing
  bigger.
examples:
- In photosynthesis, green leaves use sunlight to make food for the plant.
- The teacher explained photosynthesis with a picture of a leaf and the sun.
