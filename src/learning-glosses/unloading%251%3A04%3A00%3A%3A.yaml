simpleMeaning: the work of taking a load off or out of a vehicle, ship, container, or any such thing
scope: The work of taking loads out of vehicles or containers, not putting loads in and not the goods
  themselves.
examples:
- The unloading of the ship took all morning.
- They finished the unloading before noon.
