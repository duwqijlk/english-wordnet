simpleMeaning: willing to help or give support, and not acting against you or as an enemy
scope: This means willing to help and not against you, not just warm and kind in the way a friend is,
  and not about soldiers from your own side in war.
examples:
- A friendly government helped our team and did not try to stop us.
- The group was friendly to the plan, so it gave money to support it.
