simpleMeaning: a machine takes X-ray pictures through the body and joins them into flat slices along one
  line, so doctors can see the organs inside
scope: 'Also called computed axial tomography, computerized axial tomography, and computerized tomography:
  a way of seeing inside the body with X rays, not a single X-ray picture and not an ultrasound scan.'
examples:
- A computed tomography scan found the problem in her lung.
- The computed tomography pictures showed flat slices of his brain.
