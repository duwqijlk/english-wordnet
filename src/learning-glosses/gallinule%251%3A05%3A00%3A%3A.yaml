simpleMeaning: any of several small water birds with a hard plate on the forehead, told apart from rails
  by that plate and by looking like a small farm hen
scope: A small water bird with a plate on its forehead, not a rail and not a duck; also called marsh hen,
  swamphen, and water hen.
examples:
- A gallinule swam among the reeds with a bright plate on its forehead.
- We watched a gallinule pick its way through the marsh like a small hen.
