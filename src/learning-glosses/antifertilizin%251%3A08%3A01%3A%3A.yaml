simpleMeaning: Before the two join, only the matching female egg cell is drawn toward the male seed cells
  of an animal by this substance
scope: This is the substance made by the male seed cells that draws the matching egg cell toward them.
examples:
- Antifertilizin helps the egg cell move toward the sperm.
- The sperm's antifertilizin drew the egg cell close.
