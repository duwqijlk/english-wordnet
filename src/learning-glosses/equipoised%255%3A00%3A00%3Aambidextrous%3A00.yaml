simpleMeaning: Not favouring one side of the body over the other; neither right-handed nor left-handed
scope: Describes a person who favours neither hand; not a person who uses both hands with equal skill,
  and not a person who is left-handed.
examples:
- The equipoised child wrote with either hand.
- Being equipoised means neither hand leads the other.
