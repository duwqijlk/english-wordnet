senseId: 'first_law_of_thermodynamics%1:09:00::'
synsetId: 06114185-n
simpleMeaning: In physics, the basic rule that all the energy in a set of things cut off from everything
  else stays the same, even when things change inside it.
scope: This is the basic rule of physics that all the energy in a set of things cut off from everything
  else stays the same; conservation of energy and law of conservation of energy are other names for this
  sense, not the rule about a body staying still or moving, and not the rule about heat flowing from hot
  to cold.
examples:
- The first law of thermodynamics tells us energy is never lost in a closed system.
- Students learn the first law of thermodynamics in their first physics class.
