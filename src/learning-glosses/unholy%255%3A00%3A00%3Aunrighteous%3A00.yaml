simpleMeaning: having done things that are wrong and bad
scope: 'Also called wicked and sinful: a person who has done wrong things, not the other sense of unholy
  for something very evil or cruel.'
examples:
- The unholy man had lied to and stolen from his own family.
- People in the story saw the unholy priest as a man who had done many wrong things.
