simpleMeaning: to put sloping beams in a ceiling, so they hold up the roof
scope: To put sloping beams in a ceiling, so they hold up the roof, not the beams themselves.
examples:
- They raftered the ceiling of the new hall.
- The builders raftered the roof before winter.
