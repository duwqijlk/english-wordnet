simpleMeaning: a strong, heavy sword whose sharp part curves and whose back edge is thick
scope: 'Also called sabre, also called cavalry sword: a strong curved sword, not the lighter fencing sword
  with a V-shaped blade, and not the verb senses of cutting or killing with one.'
examples:
- The soldier carried a saber at his side.
- He lifted the saber and cut through the rope.
