simpleMeaning: to grow bigger and smaller again and again in a steady beat
scope: 'Also called pulse, and another name for this sense is throb: to grow and shrink in a steady beat;
  not the sense about making short bursts of waves or making a machine send them out.'
examples:
- Her heart pulsated fast under his hand.
- The baby's heart was pulsating in a steady beat.
