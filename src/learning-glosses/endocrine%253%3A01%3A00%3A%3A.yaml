simpleMeaning: of the juices that go straight from a gland into the blood, or of the glands that make
  them
scope: 'Also called endocrinal: of the juices that go straight from a gland into the blood, or of the
  glands that make them, not a gland itself and not a juice that goes through a tube.'
examples:
- Doctors study the endocrine glands that control growth.
- An endocrine gland sends its juices straight into the blood.
