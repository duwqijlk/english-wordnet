simpleMeaning: To draw lines that cross each other on a surface, marking it out in squares.
scope: Also called check and checker; to mark a surface in squares with crossed lines, not to give it
  a mix of colours.
examples:
- He chequered the board with black and white squares.
- She chequered the paper, drawing lines across it both ways.
