simpleMeaning: 'A factory way to make steel: air blown through hot liquid iron in a pot burns off extra
  carbon and dirt; the first working way to make much steel cheaply.'
scope: A factory way of making steel by blowing air through hot liquid iron; set apart from other ways
  of making steel and from other factory ways of working iron.
examples:
- The Bessemer process made steel cheap for the first time.
- In the Bessemer process, air is blown through hot liquid iron.
