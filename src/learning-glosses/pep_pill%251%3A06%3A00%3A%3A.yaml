simpleMeaning: Sudden sleep attacks and some kinds of depression are treated with this drug, which wakes
  up the nerves, gives more energy and less hunger.
scope: An upper, speed, and amphetamine are also names for this drug, which wakes up the nerves and cuts
  hunger and is used to treat sudden sleep attacks and some kinds of depression.
examples:
- A pep pill was used to treat the sudden sleep attacks.
- The pep pill gave more energy and less hunger.
