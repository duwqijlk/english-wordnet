simpleMeaning: a plant from Europe that lives for years, smells strong, and has grey-green leaves that
  taste bitter; it can make skin sore, much like poison ivy
scope: 'Also called rue: a strong-smelling plant with bitter grey-green leaves that can make skin sore,
  not a kitchen herb and not the feeling of regret.'
examples:
- The herb of grace grew in the garden, and its strong smell filled the air.
- She wore gloves when she picked the herb of grace because it can make skin sore.
