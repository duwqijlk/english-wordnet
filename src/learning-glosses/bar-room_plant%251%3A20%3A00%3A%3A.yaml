simpleMeaning: Grown mostly indoors for its leaves, a plant with large good-looking leaves at its base
  that lives for years and keeps its leaves all year.
scope: This house plant is also called aspidistra and a cast-iron plant, and it is not one grown for its
  flowers.
examples:
- They kept a bar-room plant for its leaves.
- The bar-room plant kept its leaves through the winter.
