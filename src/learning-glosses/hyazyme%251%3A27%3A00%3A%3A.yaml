senseId: 'hyazyme%1:27:00::'
synsetId: 14934316-n
simpleMeaning: An enzyme that breaks down hyaluronic acid, a slippery body substance, making it thinner
  so fluids pass more easily into connective tissue and are taken up better.
scope: An enzyme that thins body fluid, also called hyaluronidase and spreading factor.
examples:
- The nurse added Hyazyme to help the fluid spread.
- Hyazyme thins the acid so the drug is taken up faster.
