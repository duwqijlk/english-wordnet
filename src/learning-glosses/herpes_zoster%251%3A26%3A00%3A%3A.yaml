simpleMeaning: Sore spots that break out along a nerve, often with strong nerve pain.
scope: Sore spots breaking out along a nerve, often with strong nerve pain; shingles is another name for
  this sense, and this is not a rash from an allergy or a pain with no spots.
examples:
- Herpes zoster broke out along the nerves of his side.
- The herpes zoster rash came with sharp nerve pain.
