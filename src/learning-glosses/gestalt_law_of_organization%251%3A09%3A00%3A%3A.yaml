simpleMeaning: a rule of a school of mind-study that picks out what makes things look grouped in set ways
scope: 'Also called Gestalt principle of organization: a rule of a school of mind-study that picks out
  what makes things look grouped in set ways, not a rule about things seen one by one and not a rule of
  another school of mind-study.'
examples:
- The Gestalt law of organization explains why we see rows as groups.
- Under the Gestalt law of organization, near dots look like one shape.
