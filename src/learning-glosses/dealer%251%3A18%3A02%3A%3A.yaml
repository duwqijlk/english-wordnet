simpleMeaning: A person who buys goods and keeps a stock of them to sell
scope: A person who buys goods and keeps a stock to sell, also called a trader; not a seller of unlawful
  goods and not the party who buys and sells shares for himself.
examples:
- The dealer kept a large stock of cloth.
- She bought the vase from a dealer in town.
