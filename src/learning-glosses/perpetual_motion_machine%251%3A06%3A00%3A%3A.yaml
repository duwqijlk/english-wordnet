simpleMeaning: 'It cannot exist under the law that energy is never made or lost: a device that keeps working
  for ever, taking no power from outside'
scope: A device that would keep working for ever with no power from outside, which cannot exist; not the
  movement itself, and not an ordinary engine that needs fuel.
examples:
- A perpetual motion machine would need no fuel at all.
- Inventors have long chased the dream of a perpetual motion machine.
