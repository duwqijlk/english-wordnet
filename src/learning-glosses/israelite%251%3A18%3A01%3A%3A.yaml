simpleMeaning: A person who belongs to the worldwide group that claims descent from Jacob, or who has
  joined it, and is joined to it by shared culture or faith.
scope: A person of the worldwide group that claims descent from Jacob, also called Jew and Hebrew; not
  a person of the ancient kingdom of Israel alone or a citizen of the modern state.
examples:
- The Israelite traced his family back to Jacob.
- She was an Israelite by birth and by faith.
