simpleMeaning: a wild sheep of the mountains of western North America, with great curled horns
scope: A wild sheep of the western mountains with great curled horns; bighorn and bighorn sheep are other
  names for this sense, not a tame sheep and not a mountain goat.
examples:
- A cimarron stood on the high rock above the valley.
- The cimarron's horns curl back over its ears.
