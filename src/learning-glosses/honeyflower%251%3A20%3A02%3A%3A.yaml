simpleMeaning: Bees find much sweet juice in the red blooms that crown the stems of this tall bushy plant
  of eastern Australia
scope: Also called honey-flower and mountain devil, this is a bushy eastern Australian shrub with red
  flower clusters, not the other Australian shrub of the same name.
examples:
- The honeyflower was covered in red blooms in spring.
- Bees crowded the honeyflower for its nectar.
