simpleMeaning: a way of tying one rope for a short time to the middle of another rope or to a loop
scope: 'Also called a becket bend, a sheet bend and a weaver''s hitch: a knot that joins a rope to the
  middle of another rope for a short time, not a knot for tying a rope to a post, and not a knot that
  stays tied for good.'
examples:
- He tied the two ropes together with a weaver's knot so he could take them apart later.
- She used a weaver's knot to fasten the line to the middle of the longer rope.
