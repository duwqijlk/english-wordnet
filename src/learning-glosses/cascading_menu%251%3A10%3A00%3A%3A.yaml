simpleMeaning: A second list of choices that shows while you hold the pointer over a thing on the first
  list.
scope: A second list of choices that shows while you hold the pointer over a thing on the first list,
  also called hierarchical menu; not the first list itself, and not a list that shows when you click.
examples:
- The cascading menu appeared when I held the pointer over the item.
- Use the cascading menu to pick a smaller choice.
