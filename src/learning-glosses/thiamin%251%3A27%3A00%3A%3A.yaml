simpleMeaning: A B vitamin that stops beriberi, a disease that weakens the nerves, and keeps appetite
  and growth going
scope: This is a B vitamin that stops beriberi, also called thiamine, aneurin and antiberiberi factor;
  not another B vitamin and not a drug that cures beriberi once it has set in.
examples:
- Thiamin in food keeps appetite and growth going.
- A lack of thiamin can bring on beriberi.
