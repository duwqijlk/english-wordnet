simpleMeaning: A raspberry from the east of North America, with black fruit shaped like a thimble.
scope: Also called a black raspberry, a blackcap, or a blackcap raspberry; a raspberry from eastern North
  America with black thimble-shaped fruit, not the shrub with rose to purple flowers and red or orange
  fruit, and not the white-flowered raspberry of the west.
examples:
- Thimbleberry grows wild along the eastern woods.
- She picked thimbleberry for a pie, its black fruit shaped like a thimble.
