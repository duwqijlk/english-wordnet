simpleMeaning: In yarn, a soft lump or uneven bit, there by mistake or put there on purpose.
scope: In yarn, a soft lump or uneven bit, there by mistake or put there on purpose; also called a knot;
  not a large round lump on the trunk or branch of a tree, and not the wood cut from such a lump, often
  used as a thin facing on other wood.
examples:
- The weaver picked the burl out of the yarn.
- A burl in the wool made the cloth look uneven.
