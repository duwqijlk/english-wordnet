simpleMeaning: a slow walk in which the feet drag along the ground and are not lifted
scope: A slow walk with dragging feet; shuffle and shuffling are other names for this sense, not a brisk
  walk and not a limp.
examples:
- From his shamble I guessed he was very old.
- She crossed the yard with a tired shamble.
