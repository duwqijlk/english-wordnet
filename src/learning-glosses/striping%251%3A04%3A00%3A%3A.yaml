simpleMeaning: the act of making long, narrow lines on something
scope: The act of putting long, narrow lines on something. This is the act itself, not the lines on a
  thing and not taking clothes off or taking something away.
examples:
- The striping of the new road took the workers all morning.
- His job was the striping of banners for the parade.
