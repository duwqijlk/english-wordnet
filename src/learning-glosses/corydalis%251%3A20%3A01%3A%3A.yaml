simpleMeaning: With tube-shaped flowers that carry a small point at the back, and lovely leaves made of
  many small leaflets, this is a plant of one group.
scope: A plant of one group, it has lovely leaves made of many small leaflets and tube-shaped flowers
  with a small point at the back.
examples:
- The corydalis had tube-shaped flowers with a small point at the back.
- Corydalis opened its lovely leaves, made of many small leaflets.
