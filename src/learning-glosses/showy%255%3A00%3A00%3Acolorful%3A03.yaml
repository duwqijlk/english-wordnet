simpleMeaning: used especially of clothes, easy for people to notice
scope: 'Also called flashy, gaudy, sporty, and jazzy: this sense is about clothes that people notice easily,
  not the sense for showing off without good taste and not the sense for a performer''s great skill.'
examples:
- She wore a showy red dress that everyone noticed at the party.
- His showy yellow jacket was easy to notice in the crowd.
