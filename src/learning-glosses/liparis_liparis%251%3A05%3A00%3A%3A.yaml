simpleMeaning: Small cold-water fishes shaped like tadpoles, with belly fins that form a sucker, kin to
  the lumpfish.
scope: 'Also called sea snail, seasnail and snailfish: small cold-water fishes with belly fins forming
  a sucker, not a warm-water fish and not a fish with a plain belly fin.'
examples:
- Liparis liparis clung to the rock with the sucker formed by its fins.
- We saw Liparis liparis in the cold northern water.
