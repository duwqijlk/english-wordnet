simpleMeaning: A group of performers together with the staff who support them, especially one that puts
  on plays.
scope: This is not a business firm, not a group of guests at a social event and not a unit of soldiers;
  it is a performing group with its support staff.
examples:
- She joined a touring theater company after drama school.
- The ballet company rehearsed for weeks before opening night.
