simpleMeaning: To lose sight of things in daylight in thick fog, snow, or rain.
scope: To lose sight of things in daylight in fog, snow, or rain, not the arctic whiteout condition and
  not covering words with correction fluid.
examples:
- The snow made the hills white out until nothing could be seen.
- In heavy rain the road whited out, and drivers had to slow down.
