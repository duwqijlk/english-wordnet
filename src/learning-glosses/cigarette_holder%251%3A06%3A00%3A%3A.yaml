simpleMeaning: a tube into which a roll of tobacco is put so it can be smoked
scope: A tube for smoking a roll of tobacco through, not the roll of tobacco itself and not a case for
  keeping them in.
examples:
- She put her cigarette in the cigarette holder before lighting it.
- He smoked through a long cigarette holder at the party.
