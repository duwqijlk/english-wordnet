simpleMeaning: The United States federal office that runs all federal plans for care of the sick and help
  for people in need, set up in 1979.
scope: Also called Health and Human Services and the Department of Health and Human Services; the United
  States federal office for care and welfare plans, set up in 1979, not a state office and not other federal
  offices.
examples:
- HHS runs the national vaccine plan.
- She works for HHS in Washington.
