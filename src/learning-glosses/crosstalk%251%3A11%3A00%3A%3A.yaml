simpleMeaning: an unwanted signal that comes in by mistake through a chance link to another signal
scope: An unwanted signal that gets in by mistake, not the signal a person wants to hear and not a fault
  in the set itself.
examples:
- Crosstalk on the line made it hard to hear the caller's voice.
- The engineers worked to cut down the crosstalk between the two phone lines.
