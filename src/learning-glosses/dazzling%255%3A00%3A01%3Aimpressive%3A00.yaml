simpleMeaning: so striking and good that you notice it at once, and it makes you think of lightning flashing
scope: This says a thing is so striking and good that you notice it at once and it makes you think of
  lightning flashing; it is not just plain or weak, and not just a bright light on its own.
examples:
- She gave a dazzling show on the ice, with fast, clean jumps.
- The singer's dazzling voice held the whole room still.
