simpleMeaning: in a way that names a thing by a word for something closely tied to it
scope: By naming a thing with a word for something tied to it, not by likeness and not in a plain, word-for-word
  way.
examples:
- He spoke metonymically, calling the king 'the crown'.
- '''The White House said'' is used metonymically for the president''s office.'
