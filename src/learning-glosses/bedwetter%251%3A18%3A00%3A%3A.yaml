simpleMeaning: a person with a health problem that makes them pass water in their sleeping place while
  asleep
scope: 'Also called a bed wetter and a wetter: a person who passes water in their sleep, not a person
  who passes water while awake and not a person who cannot hold water in the day.'
examples:
- The bedwetter was taken to a doctor about passing water in his sleep.
- Her son is a bedwetter, so she puts a pad under his sheets at night.
