simpleMeaning: In law, the rule that the laws of the whole country stand above the laws of a single state
  on the same matter
scope: In law, this is the rule that the laws of the whole country stand above the laws of a single state
  on the same matter; preemption is another name for it, not a rule about who makes the laws.
examples:
- The court used pre-emption to set aside the state law.
- Pre-emption means the whole country's law stands above a state's law.
