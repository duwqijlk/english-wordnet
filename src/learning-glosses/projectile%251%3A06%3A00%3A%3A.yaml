simpleMeaning: a weapon that is thrown or sent out with force at a thing it is aimed at, and that has
  no power of its own to move itself
scope: 'Another name for this sense is missile: a weapon thrown or shot through the air, with no power
  of its own to drive it.'
examples:
- The soldiers threw projectiles at the castle walls.
- A stone used as a projectile can break a window.
