senseId: 'murmur_vowel%1:10:00::'
synsetId: 07128862-n
simpleMeaning: Saying a consonant brings a weak 'uh' sound with it
scope: 'Also called a murmur: a weak ''uh'' sound that comes as part of saying a consonant, not a sound
  said on its own and not a hum.'
examples:
- A murmur vowel is the faint 'uh' heard when a consonant is said.
- The murmur vowel in 'solemn' is the soft sound before the 'm'.
