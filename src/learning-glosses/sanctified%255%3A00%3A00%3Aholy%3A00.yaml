simpleMeaning: made, said, or thought to be holy, and given to a god, for a religious ceremony, or for
  religious use
scope: 'Also called sacred or consecrated: holy or given to a god or religious use, not simply good, important,
  or respected.'
examples:
- They drank the sanctified wine during the ceremony.
- The sanctified bread was kept on the altar.
