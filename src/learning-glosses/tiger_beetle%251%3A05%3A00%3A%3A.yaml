simpleMeaning: a fast insect with a hard shell, most often bright in colour, that hunts and eats other
  insects
scope: A fast insect, most often bright in colour, that hunts other insects; not an insect that eats plants
  and not a slow ground insect.
examples:
- The tiger beetle darted across the sand after a small fly.
- A tiger beetle caught an ant in its jaws.
