simpleMeaning: The basic ideas taken as true from which something is started, built up, worked out, or
  explained
scope: 'Also called basis, base, foundation, cornerstone, and fundament: the basic ideas that something
  starts from. It is not a building''s solid bottom part and not the early work done before a main job.'
examples:
- The groundwork of her argument is the idea that all people want to feel safe.
- Their groundwork is the idea that people learn best by doing, and all their lessons are built on it.
