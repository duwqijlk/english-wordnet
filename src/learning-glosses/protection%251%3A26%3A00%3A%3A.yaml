simpleMeaning: The state of being kept safe from harm.
scope: This is the state of being safe, not the act of shielding someone, not a physical covering, and
  not a patron's backing of an event.
examples:
- The children ran to their mother for protection when the dog barked.
- The witness was given police protection until the trial ended.
