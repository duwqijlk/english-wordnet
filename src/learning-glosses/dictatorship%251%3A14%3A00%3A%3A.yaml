simpleMeaning: A way of running a country in which one person holds all power, and no laws, no basic rules
  of the state, and no opposing group can limit him.
scope: This is rule by one person with no limits, also called tyranny, authoritarianism, totalitarianism,
  despotism, absolutism, monocracy, one-man rule, and shogunate; it is not a government where laws or
  voters limit the ruler.
examples:
- The country lived under a dictatorship for twenty years, with one man holding all power.
- After the army took over, a dictatorship replaced the elected government.
