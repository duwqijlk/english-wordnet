simpleMeaning: Yellow flowers in bunches grow on this showy shrub of the Pacific coast of North America,
  green all year, with dark green feathery foliage; dark blue fruit follows the flowers.
scope: Also called hollygrape and mountain grape, this is a showy shrub with yellow flowers and dark blue
  fruit, not a holly bush and not a grape vine.
examples:
- The holly-leaves barberry in the garden had yellow flowers.
- Holly-leaves barberry keeps its leaves all year.
