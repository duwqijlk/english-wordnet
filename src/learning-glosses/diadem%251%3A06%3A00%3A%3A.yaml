simpleMeaning: A beautiful band set with jewels, worn on the head to show that the wearer rules a country
scope: A jewelled band worn on the head to show rule over a country, also called crown; not an ordinary
  hat or hair band.
examples:
- The queen wore a diadem set with diamonds.
- A golden diadem rested on the young king's head.
