simpleMeaning: In a way that pays no care to duty or to what may go wrong.
scope: For how someone acts when they ignore their duties and the risks.
examples:
- He acted irresponsibly, spending money the family could not spare.
- She drove irresponsibly, with no thought for the children in the car.
