simpleMeaning: A resin that sets hard when heated, used mainly in strong glues, coatings, and layers.
scope: 'Also called epoxy glue or epoxy resin: a resin that sets hard, used most often in strong glues,
  coatings, and layers, not the act of gluing with it.'
examples:
- She fixed the chair with epoxy.
- Epoxy makes a strong glue for wood and metal.
