simpleMeaning: The points of a deal are set out in this short note, most often used between countries
scope: 'Also called aide-memoire: a short note setting out the points of a deal, most often used between
  countries, not a full written deal and not a letter.'
examples:
- The two sides read the position paper before they sat down to talk.
- She wrote a position paper setting out what her country would agree to.
