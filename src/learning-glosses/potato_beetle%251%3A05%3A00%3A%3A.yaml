simpleMeaning: First from the eastern Rocky Mountains and now found worldwide, this black-and-yellow insect
  eats the leaves of the plant it lives on, young and grown.
scope: Also called potato bug, this black-and-yellow insect eats the leaves of the plant it lives on at
  every stage of its life.
examples:
- Potato beetles ate the leaves.
- We saw potato beetles on the plants.
