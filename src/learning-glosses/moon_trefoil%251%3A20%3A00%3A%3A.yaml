simpleMeaning: An evergreen shrub from highland areas of southern Europe, with soft downy leaves, yellow
  flowers that keep opening all summer, and then odd, snail-shaped pods.
scope: A southern European highland shrub with summer flowers and snail-shaped pods, not a clover or an
  ordinary trefoil.
examples:
- The moon trefoil keeps producing yellow flowers through the summer.
- After flowering, the moon trefoil forms curious snail-shaped pods.
