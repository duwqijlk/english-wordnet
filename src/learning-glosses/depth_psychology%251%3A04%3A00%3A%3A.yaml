simpleMeaning: ways of digging into the hidden reasons behind what people do, and of treating mental illness,
  that follow the ideas of Sigmund Freud
scope: 'Also called analysis and psychoanalysis: a Freudian way of digging into hidden motives and treating
  mental illness, not a test of cleverness, and not ordinary talk with a friend.'
examples:
- In depth psychology, the therapist looks for hidden reasons behind a patient's fears.
- She studied depth psychology to learn Freud's way of treating mental illness.
