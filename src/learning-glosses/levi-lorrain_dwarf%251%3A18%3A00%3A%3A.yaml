simpleMeaning: A person of very short height whose shortness comes from too little growth hormone, not
  from genes as in the achondroplastic kind.
scope: A person of very short height from too little growth hormone, also called hypophysial dwarf and
  pituitary dwarf; not a person short from genes and not an achondroplastic dwarf.
examples:
- The Levi-Lorrain dwarf was short because his body made too little growth hormone.
- Doctors told the Levi-Lorrain dwarf that his shortness came from hormones, not genes.
