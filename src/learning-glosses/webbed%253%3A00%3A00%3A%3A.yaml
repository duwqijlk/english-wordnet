simpleMeaning: Thin skin on the feet of some animals joins their toes together.
scope: Toes joined by a fold of skin on the feet of some animals, not free toes and not fins.
examples:
- The duck's webbed feet helped it swim across the pond.
- Frogs have webbed feet for swimming.
