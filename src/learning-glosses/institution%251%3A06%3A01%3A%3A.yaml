simpleMeaning: a hospital for people who cannot think or act in a normal way because their minds are not
  well
scope: Also called asylum, this is a hospital for people whose minds are not well, not a building where
  a group works for a cause.
examples:
- He stayed for months in an institution for people with serious mental illness.
- The old institution on the hill treats people whose minds are very ill.
