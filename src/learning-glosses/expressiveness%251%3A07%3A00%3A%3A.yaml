simpleMeaning: How much something shows thoughts and feelings in the way it looks or sounds.
scope: How much something shows thoughts and feelings in the way it looks or sounds; not the words used
  and not a lack of feeling.
examples:
- The expressiveness of her face told the whole story.
- His playing had great expressiveness.
