simpleMeaning: A person who owns land with no end to that ownership and no rent to pay for its use
scope: This is a person who owns land with no end to that ownership and no rent to pay for its use; it
  is not a person who rents land and not a person who holds land for a set time only.
examples:
- The freeholder sold part of his land to the town.
- As a freeholder, she paid no rent for the field.
