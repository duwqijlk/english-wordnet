simpleMeaning: Part-way through making a group of chemicals from aldehydes or ketones, two kinds of chemicals,
  a chemical built from carbon usually forms.
scope: This is the name for a chemical that usually forms part-way through making a group of chemicals
  from aldehydes or ketones, not the finished chemical itself.
examples:
- The hemiacetal appeared part-way through the change.
- A hemiacetal can appear while aldehydes change into acetals.
