simpleMeaning: 'It stops short of the knee: this footwear comes up only to the middle of the lower leg'
scope: 'Also called buskin, combat boot and desert boot: footwear that rises part of the way up the leg,
  not a shoe and not a boot that reaches the knee.'
examples:
- He pulled on his half boots before walking through the wet field.
- Her half boots reached part of the way up her calves.
