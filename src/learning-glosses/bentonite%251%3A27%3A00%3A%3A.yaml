simpleMeaning: Ash thrown out by volcanoes makes this clay, a substance with aluminium and silicon in
  it that soaks up liquid.
scope: This clay, formed from volcanic ash, is the kind that soaks up liquid.
examples:
- The bentonite in the mix soaked up the water.
- The wet mix held bentonite, which soaked up the water.
