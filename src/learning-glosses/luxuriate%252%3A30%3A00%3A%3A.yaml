simpleMeaning: to grow strongly, spread a lot, and do very well
scope: This means growing or doing very well; it is not about spending a lot on costly pleasures for yourself.
examples:
- The plants luxuriate in the warm, wet soil.
- Vines luxuriated over the whole wall in summer.
