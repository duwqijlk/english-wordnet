simpleMeaning: Some of these rod-shaped gut germs make warm-blooded animals sick, and they can serve as
  a weapon made from germs; they do not keep a purple dye.
scope: Among gut germs, these rod-shaped ones stand out because some make warm-blooded animals sick and
  they can serve as a weapon made from germs.
examples:
- Warm-blooded animals can fall sick from shigella.
- The gut germs called shigella are rod-shaped.
