simpleMeaning: Round, fleshy yellow berries grow on this showy American plant, which lives for one year,
  each berry held in a thin skin like a small bag.
scope: This showy American plant, also called strawberry tomato, lives for one year and bears round, fleshy
  yellow berries in a thin skin.
examples:
- The downy ground cherry bore round yellow berries.
- We picked the downy ground cherry berries from their thin skins.
