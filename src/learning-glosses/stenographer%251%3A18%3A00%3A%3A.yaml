senseId: 'stenographer%1:18:00::'
synsetId: 10673454-n
simpleMeaning: A person who writes down what is said, word for word, as it is spoken, especially speech
  read aloud to be written down.
scope: Also called an amanuensis, a person skilled at writing down speech as it is spoken, especially
  speech read aloud.
examples:
- The stenographer wrote down every word the witness said.
- They worked as a stenographer in the court, taking down each speech.
