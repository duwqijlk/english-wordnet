simpleMeaning: A style of loud guitar music from the 1960s, made to sound like the strange things people
  feel when they take drugs
scope: 'Also called acid rock: loud guitar music of the 1960s shaped by drug trips, not other loud guitar
  music of the time and not dance music.'
examples:
- The band played psychedelic rock with long, swirling guitar solos.
- Psychedelic rock grew out of the drug culture of the 1960s.
