synsetId: 01196465-v
simpleMeaning: to make someone have too much of a thing that was pleasing at first, so they no longer
  want it
scope: 'Also called cloy: this is a pleasing thing becoming too much for someone, not a thing simply seeming
  dull on its own and not the burial cloth.'
examples:
- Too much sweet food palled his appetite.
- The endless rich desserts palled her taste for them.
