senseId: 'tapioca%1:13:00::'
synsetId: 07635490-n
simpleMeaning: People add this to food, especially puddings, to make it thicker. It comes as small grains
  made from cassava starch.
scope: This sense is the dry grains used in cooking, not the finished pudding itself and not the cassava
  plant.
examples:
- She added tapioca to make the pudding thicker.
- Cook the tapioca in milk until the small grains turn clear.
