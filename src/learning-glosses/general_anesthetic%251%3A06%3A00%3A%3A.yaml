simpleMeaning: The person is put into a deep sleep and feels nothing, because a drug has been given that
  works on the whole body.
scope: 'Another name for this is general anaesthetic: a drug that acts on the whole body, not a drug that
  numbs only one part of the body.'
examples:
- The doctor gave her a general anesthetic before the operation.
- Under a general anesthetic, he felt nothing and remembered nothing.
