simpleMeaning: In the way nature works, by the means nature gives, with no help from things made by people.
scope: This is doing a thing in the way nature works, with no help from things made by people, not in
  a normal, easy manner or from what is inborn.
examples:
- The flowers grew naturally in the wild.
- The cut healed naturally, with no drugs to help it.
