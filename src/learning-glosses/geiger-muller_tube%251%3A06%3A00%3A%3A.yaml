simpleMeaning: 'a part of a radiation counter: a chamber in a pipe-like case, where gas turns into an
  electric charge when rays pass through'
scope: 'Also called Geiger tube: a chamber inside a radiation counter where gas turns into an electric
  charge when rays pass through, not the whole counter and not a chamber that works without gas.'
examples:
- The Geiger-Muller tube clicked faster near the old rock.
- He replaced the Geiger-Muller tube in the counter.
