simpleMeaning: the basic ideas or beliefs that something is built on or worked out from
scope: This is the set of underlying ideas a theory or argument rests on; it is not the physical base
  of a building or a piece of clothing.
examples:
- The whole argument rests on a foundation of unproven assumptions.
- Their research was built on a foundation of earlier work in the field.
