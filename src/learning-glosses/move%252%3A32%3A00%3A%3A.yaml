senseId: 'move%2:32:00::'
synsetId: 00880877-v
simpleMeaning: to put forward a formal proposal for others to decide in a debate or a parliamentary meeting.
scope: This is not about changing position or going to another place, and not about stirring feelings
  in someone; it is a formal proposal put to a meeting.
examples:
- The member moved that the committee should meet again next week.
- She moved a motion calling for a full review of the policy.
