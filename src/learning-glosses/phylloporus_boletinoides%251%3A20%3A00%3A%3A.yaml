simpleMeaning: A fungus with a wide, much-rounded brown cap and small holes that run part way down the
  stalk.
scope: A fungus with a brown cap and small holes, set apart from other brown-capped fungi by its much-rounded
  cap and its holes that run down the stalk.
examples:
- Phylloporus boletinoides grew beside the oak in the fall.
- Under the brown cap of Phylloporus boletinoides were small holes, not gills.
