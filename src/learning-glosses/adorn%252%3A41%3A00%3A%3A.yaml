simpleMeaning: To set a king or emperor in place with power and the right to rule
scope: To set a king or emperor in place with power and the right to rule, also called clothe and invest,
  not making a thing look better.
examples:
- They adorned the young prince with the power of the throne.
- The emperor was adorned with full authority over the land.
