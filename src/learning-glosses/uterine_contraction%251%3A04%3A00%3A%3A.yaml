simpleMeaning: The baby moves toward the birth canal as the top muscles of the womb tighten in a steady
  beat during childbirth, making the womb smaller.
scope: This steady beat of tightening in childbirth shrinks the womb and moves the baby toward birth.
examples:
- The nurse timed each uterine contraction during labor.
- A strong uterine contraction pushed the baby lower.
