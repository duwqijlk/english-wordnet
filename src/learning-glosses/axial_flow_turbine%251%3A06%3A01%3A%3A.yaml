simpleMeaning: 'The exact opposite of a machine that squeezes air along its middle line: air moving the
  same way drives this one round instead.'
scope: This machine is also called an axial turbine.
examples:
- Air moving along the middle line drove the axial flow turbine round.
- Moving air along the middle line set the axial flow turbine turning.
