simpleMeaning: By a right passed down in his family, this man of high rank ruled a German castle and the
  land around it.
scope: This is the nobleman who ruled a German castle and its land by family right, not the soldier who
  ran a German town in the 1100s and 1200s.
examples:
- People brought their disputes to the burgrave.
- The burgrave's son would one day rule the castle in his turn.
