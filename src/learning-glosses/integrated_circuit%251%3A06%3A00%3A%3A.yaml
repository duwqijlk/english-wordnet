simpleMeaning: A tiny computer part built into one small chip, holding a whole set of parts rather than
  one part alone.
scope: A tiny computer part built into one small chip, holding a whole set of parts rather than one part
  alone, also called microcircuit; not a single wire and not a big box of separate parts.
examples:
- The integrated circuit runs the whole phone.
- One integrated circuit holds thousands of tiny parts.
