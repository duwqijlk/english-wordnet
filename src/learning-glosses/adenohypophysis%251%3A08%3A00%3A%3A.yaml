simpleMeaning: The front part of the small gland at the base of the brain, made mostly of gland tissue.
scope: The front part of the gland at the base of the brain, also called the anterior pituitary and the
  anterior pituitary gland; not the back part of the same gland and not the whole gland.
examples:
- The adenohypophysis makes several hormones that act on other glands.
- Growth hormone comes from the adenohypophysis.
