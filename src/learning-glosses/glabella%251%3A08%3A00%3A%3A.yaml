simpleMeaning: a smooth raised bit of the forehead bone between and above the eyebrows, the part that
  sticks out furthest in the middle, level with the ridges above the eyes
scope: 'Also called mesophyron: a smooth raised bit of the forehead bone between and above the eyebrows,
  not the bridge of the nose and not the cheekbone.'
examples:
- The glabella is the smooth raised bit of bone between and above the eyebrows.
- She had a small cut on her glabella just above the nose.
