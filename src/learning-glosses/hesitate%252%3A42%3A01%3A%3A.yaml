schema: oewn-learning-gloss-v2
senseId: 'hesitate%2:42:01::'
synsetId: 02647119-v
simpleMeaning: to stop for a moment in the middle of an activity, then carry on
scope: This is the brief stop-and-continue sense; pause is another name for it, and it is not the uncertain
  or unwilling holding back of the other sense nor a full stop.
examples:
- He hesitated mid-sentence, then continued reading.
- She hesitated for a moment at the door, then stepped inside.
