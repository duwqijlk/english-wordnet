simpleMeaning: a medicine that quiets the mind and treats serious mental illness when calm is needed
scope: 'Another name for antipsychotic, antipsychotic drug, major tranquilizer, major tranquilliser, major
  tranquillizer, neuroleptic, neuroleptic agent and neuroleptic drug: a calming medicine for serious mental
  illness, not a sleeping pill and not a drug for low mood.'
examples:
- The nurse gave him an antipsychotic agent to help him settle.
- An antipsychotic agent was added to her treatment for the voices she heard.
