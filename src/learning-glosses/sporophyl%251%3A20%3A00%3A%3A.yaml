simpleMeaning: a leaf on a fern or moss that carries the sporangia, the small cases that hold spores
scope: 'Also called sporophyll: a leaf on a fern or moss that makes spores, not an ordinary green leaf
  and not the stem of the plant.'
examples:
- The sporophyl held the spore cases on its underside.
- In ferns, the sporophyl is the leaf that bears the spores.
