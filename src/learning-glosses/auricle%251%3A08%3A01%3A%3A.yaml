simpleMeaning: A small, cone-shaped pouch jutting from the upper front part of each heart atrium.
scope: A small, cone-shaped pouch jutting from the upper front part of each heart atrium; also called
  atrial auricle or auricula atrii; not the outer part of the hearing organ that can be seen from outside,
  made of the flexible tissue called cartilage.
examples:
- Their auricle pulsed at dawn.
- The auricle was seen in the scan.
