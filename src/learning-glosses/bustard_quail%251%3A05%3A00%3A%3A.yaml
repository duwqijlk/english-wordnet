simpleMeaning: A small, quail-like ground bird of southern Eurasia and northern Africa that lacks a hind
  toe; it is grouped with wading birds but lives on grassy plains.
scope: Another name for the small, quail-like ground bird also called button-quail and button quail; not
  a true quail, and not a bustard, which is a much larger bird.
examples:
- A bustard quail darted through the grass instead of flying.
- Unlike a true quail, the bustard quail has no hind toe.
