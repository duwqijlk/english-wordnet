senseId: 'strangle%2:29:03::'
synsetId: 00077451-v
simpleMeaning: to fight hard to breathe because you are not getting enough oxygen (the gas in air that
  the body needs)
scope: 'Also called choke, suffocate, and gag: this is fighting to breathe because you cannot get enough
  air, not squeezing someone''s throat to stop them breathing, and not keeping something secret so no
  one learns of it.'
examples:
- He swallowed a fish bone and strangled, fighting hard for breath.
- She strangled in the thick smoke, unable to get enough air.
