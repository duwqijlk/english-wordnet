simpleMeaning: Said of wind or weather that tends to work against you, holding you back or standing in
  your way.
scope: 'Also called unfavourable: said of wind or weather that tends to work against you, not a wind that
  is merely not to your liking and not a state of things that harms success.'
examples:
- Unfavorable winds kept the ship in port for a week.
- The sailors waited out the unfavorable weather before setting sail.
