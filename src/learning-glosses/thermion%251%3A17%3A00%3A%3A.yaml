simpleMeaning: Thrown off by a thing when it gets very hot, this tiny bit of stuff carries an electric
  charge and is either a single electron or an ion.
scope: This tiny charged bit is either a single electron or an ion, thrown off by a thing when it gets
  very hot.
examples:
- A thermion flew off the hot wire in the old valve.
- Heat from the filament sends out thermions that carry a charge.
