simpleMeaning: In maths, one line with a set length and direction that stands for two or more such lines
  added together.
scope: In maths, the single line that stands for several lines added together, not a thing that merely
  follows from something else.
examples:
- The resultant of the two forces points straight up.
- Draw the resultant to find where the two pulls lead together.
