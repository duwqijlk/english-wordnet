senseId: 'future_progressive_tense%1:24:00::'
synsetId: 13829615-n
simpleMeaning: A verb form that shows an action going on at a time still to come
scope: This is a verb form for an action going on at a time still to come; future progressive is another
  name for this sense, not the simple form for what will happen and not the form for what is going on
  now.
examples:
- '''I will be running'' is an example of the future progressive tense.'
- In his letter he wrote, 'I will be travelling all next week,' an example of the future progressive tense.
