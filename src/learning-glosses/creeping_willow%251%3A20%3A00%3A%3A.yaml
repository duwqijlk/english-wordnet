simpleMeaning: People grow several kinds of this small bush of Europe and Asia, with soft shiny green
  leaves on loose branches that trail along the ground.
scope: A low bush that trails along the ground, not a tall tree willow that stands upright.
examples:
- The creeping willow spread its branches along the path.
- We planted a creeping willow beside the low wall.
