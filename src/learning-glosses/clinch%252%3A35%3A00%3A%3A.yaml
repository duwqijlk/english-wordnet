senseId: 'clinch%2:35:00::'
synsetId: 01347430-v
simpleMeaning: to make the ends of nails and rivets flat
scope: This is only making the ends of nails and rivets flat. It is not the sense where making the ends
  flat holds a nail or bolt safe and fast in its place, and it is not holding the other fighter in boxing.
examples:
- He clinched the nails by hammering their ends flat.
- She clinched each rivet by hammering its end flat.
