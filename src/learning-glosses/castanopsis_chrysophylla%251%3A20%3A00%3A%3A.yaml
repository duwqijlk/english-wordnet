simpleMeaning: A small ornamental evergreen tree of the Pacific Coast, with glossy yellow-green leaves
  that are yellow beneath, bearing nuts that can be eaten.
scope: 'Also called giant chinkapin, golden chinkapin, Castanea chrysophylla and Chrysolepis chrysophylla:
  a small ornamental evergreen tree of the Pacific Coast, one of several evergreen trees and nut-bearing
  trees of that coast, with glossy yellow-green leaves that are yellow beneath.'
examples:
- Castanopsis chrysophylla is a small ornamental evergreen tree of the Pacific Coast.
- The leaves of Castanopsis chrysophylla are yellow beneath.
