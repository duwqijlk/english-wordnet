simpleMeaning: A learner at school whom others mock and think little of, either for acting in a false,
  showy way or for studying without stop, which others find dull.
scope: A student others mock and think little of for acting in a false, showy way or for studying without
  stop; also called a grind, a nerd, a dweeb, or a wonk.
examples:
- The boys teased the swot for staying in at break to finish their sums.
- She was called a swot because she revised every night and never joined the games.
