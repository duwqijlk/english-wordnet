simpleMeaning: One of the pieces that something is thought of as being divided into, which together make
  up the whole.
scope: This is not the line where hair is divided on the head, not a role played by an actor, and not
  a section of a larger region.
examples:
- The first chapter is the best part of the book.
- Each part of the machine has a specific job.
