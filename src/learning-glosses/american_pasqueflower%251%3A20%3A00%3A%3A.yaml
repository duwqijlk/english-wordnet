simpleMeaning: A low, hairy plant that lives many years and bears blue-violet or lilac flowers early in
  spring; it grows in North America and Siberia.
scope: This is a low, hairy plant with blue-violet or lilac flowers in early spring, also called American
  pulsatilla, Anemone ludoviciana, blue tulip, lion's beard, prairie anemone, wild crocus, Eastern pasque
  flower and Pulsatilla patens; not a tall garden flower and not a tree.
examples:
- The American pasqueflower opened its blue-violet flowers in early spring.
- We found an American pasqueflower growing on the cold northern hillside.
