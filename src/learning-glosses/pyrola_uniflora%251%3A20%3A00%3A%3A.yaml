simpleMeaning: A small, frail green plant of the cool northern lands, green all year, with one white flower
  at the tip of the stem; sometimes put in a different genus.
scope: Also called one-flowered pyrola, one-flowered wintergreen and Moneses uniflora; a small, frail
  green plant of the cool northern lands, green all year, with one white flower at the tip of the stem.
examples:
- Pyrola uniflora grew low in the pine wood, a single white flower on each stem.
- We found Pyrola uniflora in bloom on the cool northern hillside.
