simpleMeaning: In economics, a graph showing how much of a good people are willing and able to buy at
  each price
scope: In economics, a graph of how much of a good buyers will take at each price; not a supply graph
  and not a simple price list.
examples:
- The demand curve slopes down as the price rises.
- A higher price moves buyers along the demand curve.
