simpleMeaning: one of a set of small stiff papers with marks on them, used to play games or tell fortunes.
scope: It belongs to a set used in play, not a message card and not a document that proves who you are.
examples:
- He shuffled the cards and dealt five to each player.
- She turned over a card and found the queen of hearts.
