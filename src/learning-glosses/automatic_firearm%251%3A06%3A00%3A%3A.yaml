simpleMeaning: a gun that loads itself again and keeps shooting until the person lets go of the trigger
scope: 'Also called an automatic gun and an automatic weapon: a gun that loads itself and keeps shooting
  until the trigger is let go, not a gun that fires one shot at a time and must be loaded by hand.'
examples:
- The automatic firearm kept firing until he let go of the trigger.
- Police found an automatic firearm that loads itself after each shot.
