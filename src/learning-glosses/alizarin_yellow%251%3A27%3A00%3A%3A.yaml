senseId: 'alizarin_yellow%1:27:00::'
synsetId: 14778884-n
simpleMeaning: any of a group of dyes that give a gold colour, made in a different way from a dye of a
  similar name but used the same way
scope: One of a group of gold-coloured dyes, not the similarly named dye itself and not any other colour
  of dye.
examples:
- The cloth was dipped in alizarin yellow to give it a warm gold colour.
- The dyer mixed a batch of alizarin yellow for the new fabric.
