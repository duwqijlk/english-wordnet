senseId: 'corpuscular_radiation%1:19:00::'
synsetId: 11519910-n
simpleMeaning: A stream of particles that are atoms themselves or parts of atoms. Their electric charge
  may be positive, negative, or none at all.
scope: This is matter traveling as a stream of particles, not light or other electromagnetic waves; particulate
  radiation is simply another name for the same thing.
examples:
- Instruments on the satellite recorded a pulse of corpuscular radiation from the sun.
- Unlike X-rays, corpuscular radiation is made of particles rather than waves.
