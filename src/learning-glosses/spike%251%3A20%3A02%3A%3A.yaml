simpleMeaning: the part of a cereal plant that holds the grain, especially corn
scope: Also called an ear, the grain-holding head of a cereal plant, especially corn, not a flower head
  on a stem in general and not a sharp point.
examples:
- The spike of corn bent under the weight of its grain.
- Farmers checked the spikes of wheat for ripe grain.
