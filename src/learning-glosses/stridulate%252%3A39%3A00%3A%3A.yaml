simpleMeaning: to make a high thin creaking sound by rubbing special parts of the body together
scope: To make a high thin creaking sound by rubbing parts of the body together, also called clitter;
  not to sing and not to cry out.
examples:
- Male insects such as crickets or grasshoppers stridulate.
- At night the crickets stridulate in the grass.
