simpleMeaning: A climbing plant with feathery leaves and white or pink flowers, at times put in the genus
  Fumaria.
scope: A vine with feathery leaves and white or pinkish flowers, also called climbing fumitory, Allegheny
  vine and Fumaria fungosa; its feathery leaves are what mark it out among vines.
examples:
- Adlumia fungosa climbs over the fence.
- The feathery leaves of Adlumia fungosa are easy to know.
