senseId: 'fahrenheit_scale%1:24:00::'
synsetId: 13875017-n
simpleMeaning: A way of measuring temperature that sets the freezing point of water at 32 degrees and
  its boiling point at 212 degrees.
scope: This temperature scale is fixed by water freezing at 32 degrees and boiling at 212 degrees, and
  is not the Celsius scale.
examples:
- Water freezes at 32 degrees on the Fahrenheit scale.
- On the Fahrenheit scale, water boils at 212 degrees.
