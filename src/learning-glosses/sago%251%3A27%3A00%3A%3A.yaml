simpleMeaning: This fine starch comes from certain palms and, in Asia, is put into food to make it thick
  and into cloth to make it stiff.
scope: It is a starch from certain palms, used in Asia to thicken food and stiffen cloth.
examples:
- Sago thickened the food.
- Sago stiffened the cloth.
