simpleMeaning: A way of being in which a person stays calm and seems not to care, taking things lightly
scope: Staying calm and seeming not to care, not showing no feelings at all, not lacking all interest,
  and not a fair lack of care for either side.
examples:
- His indifference to the news surprised us all.
- She met the charge with cool indifference.
