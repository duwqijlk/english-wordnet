simpleMeaning: strong woody threads taken most often from the soft inner layer under the bark of many
  plants
scope: 'Also called bast: strong threads from plants, not the soft cotton threads from seed pods and not
  the stiff threads from leaves.'
examples:
- The weaver spun bast fiber into coarse cloth for sacks.
- Rope makers still use bast fiber from the hemp plant.
