simpleMeaning: The most famous tree of Mexico, a huge Montezuma cypress more than 2,000 years old, 165
  feet round, at Santa Maria del Tule.
scope: The most famous tree of Mexico, a huge Montezuma cypress at Santa Maria del Tule, also called Tule
  tree; its nearest kin are other giant old cypresses.
examples:
- The Ahuehuete at Santa Maria del Tule is more than 2,000 years old.
- Visitors come from far away to see the Ahuehuete, the most famous tree of Mexico.
