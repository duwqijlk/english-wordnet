simpleMeaning: A name for any of several kinds of stuff that look like metal and are made of sulfur, one
  kind of which is found most often of all
scope: Kinds of stuff that look like metal and are made of sulfur, not real metal itself.
examples:
- The sample of pyrites shone like metal in the light.
- Pyrites is found in many kinds, but one kind turns up most often.
