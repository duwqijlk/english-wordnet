simpleMeaning: tunes that many people like, made for people to move in time to them in a large hall
scope: 'Also called ballroom music and danceroom music: tunes made for dancing in a hall, not tunes made
  for listening only and not tunes for dancing alone.'
examples:
- The band played dance music all evening.
- We asked the DJ for dance music so we could dance together.
