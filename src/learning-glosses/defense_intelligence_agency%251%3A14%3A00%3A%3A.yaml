simpleMeaning: An agency in the United States Department of Defense that provides intelligence for military
  planning and operations and for buying weapons.
scope: Also called DIA; a United States Department of Defense agency that provides military intelligence,
  not a fighting force.
examples:
- The Defense Intelligence Agency shared its report with the commanders.
- The Defense Intelligence Agency gave the generals the news they needed before the operation.
