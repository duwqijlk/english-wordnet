simpleMeaning: A green-all-year shrub of the high lands of southern Europe, with soft downy leaves and
  yellow flowers that keep coming all summer, followed by odd pods shaped like snails.
scope: 'Also called moon trefoil: a green-all-year shrub of southern European high lands with downy leaves
  and yellow flowers, not a tree and not a true trefoil.'
examples:
- Medicago arborea flowered yellow all summer in the garden.
- The Medicago arborea pods curled like tiny snails.
