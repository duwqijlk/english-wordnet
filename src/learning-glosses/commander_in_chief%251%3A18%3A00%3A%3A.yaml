simpleMeaning: The officer at the top who holds the highest command over the armed forces
scope: The officer at the top who holds the highest command over the armed forces; commander-in-chief
  is another name for this sense, not a general who commands only one part of the forces, and not a ruler
  with no command at all.
examples:
- The president is the commander in chief.
- The commander in chief met the generals.
