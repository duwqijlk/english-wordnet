simpleMeaning: written on purpose in this way, put after a printed word or phrase to show it is copied
  exactly as it was
scope: This mark in writing shows a word was copied exactly on purpose; it is not the verb that tells
  a dog to attack.
examples:
- The newspaper printed his words as 'I seen [sic] it yesterday.'
- His letter was printed with 'teh [sic]' so that readers knew the wrong spelling was in the letter itself.
