simpleMeaning: The right of a citizen to get a court order that guards against being held in prison against
  the law.
scope: The right of a citizen to get a court order that guards against being held in prison against the
  law; not the right to a fair trial and not the right to speak freely.
examples:
- He used habeas corpus to ask the court to free him from prison.
- Habeas corpus guards citizens against being held in prison against the law.
