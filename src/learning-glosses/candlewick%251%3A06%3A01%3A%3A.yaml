simpleMeaning: A cloth pattern made by cutting loops of soft thread so they stand up in little tufts.
scope: A tufted cloth pattern made from cut loops of soft thread, not the wick of a candle.
examples:
- The candlewick bedspread had a raised pattern of little tufts.
- She sewed a candlewick cushion with loops of soft yarn.
