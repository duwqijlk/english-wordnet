simpleMeaning: Small red fruit that turns black when ripe grows on this graceful bush or small tree, bare
  in winter, with fine leaves, and the fruit makes a drink from grapes.
scope: Also called makomako, this is the graceful bush or small tree, bare in winter, whose small red
  fruit turn black when ripe and make a drink from grapes, not the Chinese and Japanese raspberry kind
  grown for its pale pink flowers.
examples:
- The wineberry dropped its leaves in winter.
- A drink from grapes comes from the wineberry fruit.
