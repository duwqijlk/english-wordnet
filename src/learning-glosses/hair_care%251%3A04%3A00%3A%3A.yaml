simpleMeaning: You look after the strands on your head by washing them, cutting them, curling them, or
  setting them in place
scope: 'Also called haircare and hairdressing: looking after the hair by washing, cutting, curling, or
  setting it in place, not washing the body and not making a wig.'
examples:
- She spent the morning on hair care, washing and curling her hair.
- Good hair care means washing, cutting, and setting the hair often.
