simpleMeaning: With bright red juice, this fruit you can eat from a kind of cactus is bright in colour
  and often as big as a peach.
scope: This word names the bright-coloured fruit of a kind of cactus, with bright red juice, and not the
  cactus plant itself.
examples:
- The pitahaya had bright red juice.
- He picked a pitahaya as big as a peach.
