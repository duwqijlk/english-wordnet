simpleMeaning: A burglar who breaks into another person's home without right and goes in.
scope: A thief who breaks into another person's home without right, not a pickpocket and not a shoplifter;
  cat burglar is another name for this sense.
examples:
- The housebreaker forced a window and slipped inside.
- Police caught the housebreaker as he left the house.
