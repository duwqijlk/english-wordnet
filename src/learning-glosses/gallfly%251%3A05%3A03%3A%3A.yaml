simpleMeaning: much like a mosquito, a soft weak fly makes a plant grow a round swelling
scope: 'Also called gall gnat and gall midge: weak little flies that make lumps grow on plants, not the
  wasp that makes galls on oaks and not any insect that lays eggs in plants.'
examples:
- A gallfly hovered over the rose leaf.
- The gallflies left round lumps on the rose stems.
