simpleMeaning: A treated plant fibre that burns very fast, used to make clear film, plastics, and shiny
  coatings
scope: 'Also called pyroxyline: a substance that burns fast and is used to make film and plastics, not
  gunpowder and not ordinary cotton.'
examples:
- The factory kept its pyroxylin in a cool store because it can catch fire so fast.
- Workers used pyroxylin to make the clear film for the camera.
