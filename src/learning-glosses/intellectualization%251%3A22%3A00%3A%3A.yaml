simpleMeaning: In psychiatry, a person shuts bad feelings and clashes out of mind by thinking them through
scope: A person shutting bad feelings out of mind by thinking them through, also called intellectualisation;
  not facing the feelings and not talking them out.
examples:
- After the accident, her intellectualization turned fear into a list of facts.
- His intellectualization of the break-up left the hurt untouched.
