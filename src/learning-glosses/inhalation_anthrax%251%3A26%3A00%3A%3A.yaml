simpleMeaning: A lung infection that comes from breathing in dust carrying the bacterium behind a serious
  illness in animals; it starts with chills, cough and breathlessness, then the circulation collapses.
scope: This is the lung form caught from dust, also called pulmonary anthrax or anthrax pneumonia, not
  the skin form that starts with a sore.
examples:
- Inhalation anthrax starts with a cough and chest pain before the collapse.
- Workers who handled infected wool were at risk of inhalation anthrax.
