simpleMeaning: An AC electric motor whose turning part is driven by a current created in it by the magnetic
  field of the fixed coil, a process called electromagnetic induction.
scope: Another name for this AC motor is induction motor; it draws its turning part's current from the
  fixed coil's magnetic field rather than from brushes, and a synchronous motor is a different design.
examples:
- An asynchronous motor drove the pump at the waterworks.
- Engineers chose an asynchronous motor because it has no brushes to wear out.
