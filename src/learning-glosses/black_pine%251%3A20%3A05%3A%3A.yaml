simpleMeaning: A large timber tree of southeastern Europe, with needles in groups of two.
scope: A large timber tree of southeastern Europe, with needles in groups of two; not the New Zealand
  cone-bearing tree used for timber and not the large Japanese tree with long needles in bunches of two.
examples:
- Black pine forests cover the Balkan hills.
- A black pine stood guard over the mountain pass.
