simpleMeaning: The highest state of warning, when an attack by the enemy seems close at hand; more widely,
  a state of warning when danger is near
scope: The highest state of warning when danger is near; not a routine warning and not a state of calm.
examples:
- The base went on red alert as the planes neared.
- A red alert sounded through the whole town.
