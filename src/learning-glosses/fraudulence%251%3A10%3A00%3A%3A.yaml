simpleMeaning: A false account of a thing, made to stand for what it is not.
scope: 'Also called duplicity: a false account of a thing, made to stand for what it is not, not a planned
  trick meant to fool people and win an edge, and not the mere quality of being dishonest in this way.'
examples:
- The fraudulence of the report hid the true figures.
- Voters grew tired of the fraudulence in the campaign leaflets.
