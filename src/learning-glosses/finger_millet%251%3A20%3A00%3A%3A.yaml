simpleMeaning: a grain grass from India whose seeds make a flour that tastes a little bitter, a main food
  in the East
scope: A grain grass from India whose seeds make a slightly bitter flour, also called coracan, corakan,
  kurakkan, ragee or ragi, not wheat and not rice.
examples:
- Finger millet is ground into flour for flat bread.
- In India, finger millet is a main food for many families.
