simpleMeaning: To make a food or drink go through a change that breaks it down into simpler things
scope: To make food or drink go through a change that breaks it down into simpler things, not the stuff
  that starts it and not the change itself as a thing.
examples:
- We ferment the grapes for a very long time to achieve high alcohol content.
- The vintner fermented the wine in big oak vats.
