simpleMeaning: The form of Chinese spoken in Canton and nearby areas, in Hong Kong, and in other places
  outside China
scope: The form of Chinese spoken in Canton, Hong Kong and elsewhere; Cantonese, Cantonese dialect and
  Yue dialect are other names for this sense, not Mandarin, the form of Chinese spoken across the north.
examples:
- Many people in Hong Kong speak Yue.
- She speaks Yue with her family in Canton.
