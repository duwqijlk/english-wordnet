simpleMeaning: feeling very puzzled and unable to understand, because many things you hear or face do
  not agree
scope: 'Also called lost: it is about feeling puzzled when facts do not agree. It is not being unable
  to think at all, and not a thing or plan in no order.'
examples:
- The many different orders left the workers confused about what to do.
- He was confused by the many different stories about the accident.
