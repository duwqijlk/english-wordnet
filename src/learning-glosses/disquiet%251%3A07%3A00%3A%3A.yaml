senseId: 'disquiet%1:07:00::'
synsetId: 04912028-n
simpleMeaning: A lasting look of being ill at ease, as if you cannot settle.
scope: Also called unease and uneasiness; not the feeling of mild worry about what may happen, and not
  the act of making someone uneasy.
examples:
- There was a disquiet about him all evening, as if he could not settle.
- Her disquiet showed in the way she kept glancing at the door.
