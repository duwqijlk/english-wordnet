simpleMeaning: Working in a way that does not block a body substance that breaks down brain chemicals,
  these medicines lift low mood and are not three-ring medicines
scope: Working in a way that does not block a body substance that breaks down brain chemicals, these medicines
  lift low mood and are not three-ring medicines, also called nontricyclic, nontricyclic antidepressant
  and nontricyclic antidepressant drug, and not a three-ring medicine or a medicine that works by blocking
  that body substance.
examples:
- The nontricyclic drug helped lift his low mood.
- Doctors often start with a nontricyclic drug for low mood.
