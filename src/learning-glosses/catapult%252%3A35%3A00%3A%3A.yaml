simpleMeaning: to throw or send a thing far and fast, as if flung from a great war engine
scope: To throw or send a thing far and fast, not the machine that throws planes off a warship, not the
  old war engine, and not the toy that flings stones.
examples:
- The enemy catapulted rocks towards the fort.
- The blast catapulted him across the room.
