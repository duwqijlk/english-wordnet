simpleMeaning: tending to settle a disagreement in a way both sides can accept and to bring peace between
  them
scope: This describes a person, words, or an action that helps people who disagree come to agree, not
  checking that two sets of numbers match.
examples:
- Her reconciling words calmed both sides after the argument.
- He used a reconciling tone and asked them to listen to each other.
