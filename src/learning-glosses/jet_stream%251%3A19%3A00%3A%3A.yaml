simpleMeaning: A fast flow of air high up, blowing from west to east near the top of the lowest layer
  of the sky, with strong effects on how weather fronts form.
scope: A fast flow of air high up, blowing from west to east; not a wind near the ground and not a flow
  of water.
examples:
- The jet stream pushed the plane along faster than usual.
- Pilots watch the jet stream when they plan a long flight.
