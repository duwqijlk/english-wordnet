simpleMeaning: To stop the neck from snapping back, a soft pad is fixed to the top of a car seat's back
scope: A soft pad on top of a car seat's back that stops the neck snapping back, also called headrest,
  not a seat belt and not a pillow.
examples:
- The head restraint kept her neck safe in the crash.
- He set the head restraint to the right height before driving.
