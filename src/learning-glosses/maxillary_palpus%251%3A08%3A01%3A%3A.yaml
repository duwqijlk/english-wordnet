simpleMeaning: Thought to help an insect sense things, a small jointed feeler on the outside of each jaw.
scope: It is a small jointed feeler on the outside of an insect's jaw, and it is thought to help the insect
  sense things.
examples:
- The insect felt the leaf with its maxillary palpus.
- Each maxillary palpus sits on the outside of an insect's jaw.
