simpleMeaning: plates of hard metal worn over a horse's head in the Middle Ages kept the head safe
scope: 'Also called a chamfron, a chanfron or a frontstall: a piece of armor worn on a horse''s head,
  not armor for a rider and not a covering for a horse''s body.'
examples:
- The museum's front-stall was made of steel plates joined to fit a horse's head.
- The knight's front-stall covered the horse's head with plates of steel.
