simpleMeaning: a ketone, a chemical with oxygen in it, that forms the middle part of some natural yellow
  colouring matter, like vitamin B2
scope: A chemical that forms the middle of some natural yellow colouring matter, not the yellow colour
  itself and not a food vitamin.
examples:
- Flavin gives the yellow colour to some natural pigments.
- The chemist studied flavin as the core of riboflavin.
