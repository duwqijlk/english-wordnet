senseId: confusing%5:00:00:unclear:00
synsetId: 00432472-s
simpleMeaning: not clear in meaning, so people find it hard to understand and do not know what to think
  or do
scope: This is about a message or statement whose meaning is not clear; it is not the sense about making
  a person feel lost or unsure where they are.
examples:
- The confusing note said to come on Tuesday, then said Wednesday.
- She read the confusing sentence three times and still did not get its meaning.
