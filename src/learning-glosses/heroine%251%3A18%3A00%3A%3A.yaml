simpleMeaning: A woman who shows great courage, in the way she acts or in brave things she does for others
scope: A woman with brave and noble qualities, or one who has done brave deeds; not a hero, and not an
  ordinary woman.
examples:
- People called her a heroine after she saved the trapped workers.
- The heroine was praised for her brave rescue of the children.
