simpleMeaning: able to take the place of something else or swap places with it, with no loss in how well
  it works or how well it fits the job
scope: This means things can swap places and still work, also called similar, standardized, exchangeable,
  and standardised; it is not the maths or logic sense about swapping parts of a statement.
examples:
- The two parts are interchangeable, so you can use either one in the machine.
- These batteries are interchangeable with the ones in the other camera.
