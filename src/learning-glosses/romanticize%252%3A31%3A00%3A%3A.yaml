schema: oewn-learning-gloss-v2
senseId: 'romanticize%2:31:00::'
synsetId: 00694938-v
simpleMeaning: to think about or talk about something as if it were more beautiful, loving or perfect
  than it really is
scope: This is about how a person thinks about or sees a thing. It is not acting in a loving way, and
  not making something in a loving or beautiful style.
examples:
- Do not romanticize farm work; it is hard and tiring.
- He romanticized his old school days and forgot the hard parts.
