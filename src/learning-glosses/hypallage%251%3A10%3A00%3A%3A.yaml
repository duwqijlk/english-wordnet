simpleMeaning: Two words swap the parts they play in a sentence, as in 'her beauty's face'
scope: A swap of the roles of two words in a sentence, as in 'her beauty's face'; not a change of word
  order and not a mistake in grammar.
examples:
- The line 'her beauty's face' shows hypallage, with the two words swapping roles.
- Her hypallage in the poem swapped the roles of beauty and face.
