simpleMeaning: For every planet, the square of the years it takes to circle the sun, set against the cube
  of its orbit in star units, gives the same number.
scope: This rule ties a planet's year to the size of its path round the sun, and the same number holds
  for every planet.
examples:
- The harmonic law says that a planet far from the sun takes many years to circle it.
- By the harmonic law, the year of Mars stands in a set ratio to the size of its path.
