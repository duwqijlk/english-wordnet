simpleMeaning: the half of the thinking organ on one side of the band of fibres joining the two halves,
  which is in charge of the left half of the body
scope: 'Also called the right hemisphere: one half of the thinking organ, which is in charge of the left
  half of the body, not the left brain and not the whole brain.'
examples:
- The right brain controls the left side of the body.
- Damage to the right brain can weaken the left arm and leg.
