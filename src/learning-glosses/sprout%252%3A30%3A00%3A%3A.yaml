simpleMeaning: to make buds or branches, or to start to grow from a seed
scope: 'Also called shoot: to make buds or branches or start growing from a seed, not just to send out
  small stems and not the new bud itself.'
examples:
- The seeds will sprout if you keep them wet.
- Potatoes left in the dark can sprout in the cupboard.
