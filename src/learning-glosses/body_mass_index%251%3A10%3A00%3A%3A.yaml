synsetId: 06652665-n
simpleMeaning: A number comparing your weight with your height, found by dividing your weight in pounds
  by your height in inches times itself; above 25 means overweight, above 30 means obese.
scope: A screening ratio of weight to height, not a direct measure of body fat or fitness, and not a person's
  target weight.
examples:
- Her body mass index was 27, so her doctor advised her to lose weight.
- Doctors use body mass index as a quick screening tool.
