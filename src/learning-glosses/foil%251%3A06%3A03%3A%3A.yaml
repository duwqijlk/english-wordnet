simpleMeaning: A flat or curved piece, such as a metal plate, whose surface pushes against the water as
  it moves through it
scope: A flat or curved plate that pushes against water as it moves through it, not a fencing sword and
  not a thin sheet of metal.
examples:
- The fins of a fish act as foils in the water.
- The boat rose up on its foils as it picked up speed.
