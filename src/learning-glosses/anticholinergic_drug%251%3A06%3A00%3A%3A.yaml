simpleMeaning: a medicine that stops acetylcholine, a chemical that carries signals between nerves, from
  doing its work
scope: 'Also called anticholinergic: a drug that blocks acetylcholine from acting, not a drug that helps
  acetylcholine work, and not the adjective for such drugs.'
examples:
- The nurse gave him an anticholinergic drug to ease the cramps.
- An anticholinergic drug can dry the mouth by blocking nerve signals.
