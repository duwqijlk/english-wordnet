simpleMeaning: a rough-skinned animal that lives in a great many kinds of places, from southern Alaska
  to Baja California, west of the Rockies
scope: A toad of the far west that lives in many kinds of places, not an eastern toad and not a frog.
examples:
- We saw a western toad hopping along the trail high in the mountains.
- The western toad lives in deserts, forests, and high mountain meadows.
