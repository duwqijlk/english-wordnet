simpleMeaning: a band that goes over the shoulder and holds up a piece of clothing or a bag
scope: A band over the shoulder that holds up clothing or a bag, not a loop to hold on a bus, not a whip,
  and not a strip for tying things.
examples:
- The strap of her dress slipped off her shoulder.
- He carried his bag by its strap over one shoulder.
