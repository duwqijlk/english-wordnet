simpleMeaning: A common mineral found in small crystals, the chief source of its metal, used as a heat-proof
  material when dull and as a jewel when clear.
scope: Also called zirconium silicate; a common mineral in small crystals, the chief source of zirconium,
  not zirconium itself.
examples:
- The zircon glittered in the rock like a small gem.
- Miners dug zircon from the sand for its clear crystals.
