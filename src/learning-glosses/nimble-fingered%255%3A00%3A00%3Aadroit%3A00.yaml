simpleMeaning: quick and neat with the hands, in the true sense or in a loose sense, above all at stealing
  things or taking them from pockets
scope: Quick, neat hands used above all for stealing; light-fingered is another name for this, not slow
  or clumsy hands and not honest skill with tools.
examples:
- The nimble-fingered pickpocket slipped the wallet out of the man's coat.
- She is so nimble-fingered that she can thread a needle in the dark.
