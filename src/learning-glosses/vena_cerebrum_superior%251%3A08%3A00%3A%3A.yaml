simpleMeaning: a wide hollow near the base of the skull takes blood from this brain vein, which drains
  the top curve of each half of the brain
scope: 'Also called superior cerebral vein: a vein that carries blood away from the top curve of the brain,
  not an artery and not a vein of the neck.'
examples:
- The vena cerebrum superior drains the top of the cerebral hemisphere.
- Blood flows from the vena cerebrum superior into the cavernous sinus.
