synsetId: 11538601-n
simpleMeaning: The pull at the surface where two liquids that will not mix meet.
scope: The pull where two liquids that will not mix meet, also called interfacial surface tension; not
  the pull on the top of one liquid alone.
examples:
- The interfacial tension between oil and water keeps the two apart.
- The chemist measured the interfacial tension where the oil met the water.
