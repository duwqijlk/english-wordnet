simpleMeaning: A virus-fighting drug used against HIV; it joins the DNA and stops the building work, leaving
  DNA not whole, unable to make a new virus; often used with other drugs.
scope: 'Also called nucleoside reverse transcriptase inhibitor: a virus-fighting drug used against HIV,
  joining the DNA and stopping the building work, leaving DNA not whole and unable to make a new virus,
  not a drug that fastens onto reverse transcriptase.'
examples:
- The doctor added an NRTI to his HIV treatment.
- An NRTI joins the virus DNA and stops it from building new virus.
