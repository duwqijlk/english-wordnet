simpleMeaning: This craft takes space travellers to the moon and brings them back to the main craft
scope: Also called a lunar excursion module, this is the craft that carries astronauts to the moon and
  back, not the command module itself.
examples:
- The lunar module separated from the command module before landing.
- The crew climbed into the lunar module for the trip to the surface.
