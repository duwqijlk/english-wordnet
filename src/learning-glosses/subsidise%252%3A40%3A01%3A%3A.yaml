simpleMeaning: To get the help of a country or an army by giving it money from the state.
scope: To get the help of a country or an army by giving it money from the state, also called subsidize,
  and not just to back something with money from the state.
examples:
- The government tried to subsidise the neighbouring army with grants of money.
- They hoped to subsidise the small nation so it would stand with them.
