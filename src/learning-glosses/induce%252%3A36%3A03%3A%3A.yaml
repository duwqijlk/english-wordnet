simpleMeaning: to make an electric current start flowing by the pull of magnets or of still electric charges
scope: To make a current start by magnetic or still electric pull, not to work out a fact by reasoning
  from examples.
examples:
- The moving magnet will induce a current in the coil.
- A changing field can induce a current in the wire.
