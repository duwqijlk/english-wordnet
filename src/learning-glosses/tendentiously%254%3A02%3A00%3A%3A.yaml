simpleMeaning: in a way that pushes one side of a question and leaves out the other side
scope: Done in a way that pushes one side and hides the other, not a fair telling of both sides.
examples:
- The paper reported tendentiously on the war, showing only one side.
- He argued tendentiously, leaving out every fact against him.
