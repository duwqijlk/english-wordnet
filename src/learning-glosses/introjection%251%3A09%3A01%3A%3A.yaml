senseId: 'introjection%1:09:01::'
synsetId: 05762194-n
simpleMeaning: In psychology, the unconscious taking in of parts of the world, especially of other people,
  so that the inner copy takes over the mental work of those outside things.
scope: This is the psychology term for unconsciously absorbing others into the self, not conscious learning
  or simple imitation.
examples:
- The therapist described introjection as taking in a parent's voice until it sounds like your own.
- Introjection can leave a person acting on beliefs they never chose.
