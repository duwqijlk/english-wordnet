simpleMeaning: Draining into the vein under the arm, two veins in each arm run beside the main artery
  of the arm
scope: Also called vena brachialis, this is the pair of veins in each arm beside the main artery, draining
  into the vein under the arm.
examples:
- The brachial vein runs beside the main artery of the arm.
- Blood from the brachial vein drains into the vein under the arm.
