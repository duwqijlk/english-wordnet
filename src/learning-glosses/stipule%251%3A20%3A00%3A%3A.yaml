simpleMeaning: At the foot of a leaf or its stem, a small leaf-like part grows, most often in pairs, and
  soon falls off.
scope: This is the small leaf-like part at the foot of a leaf or its stem, most often in pairs and soon
  falling off.
examples:
- A stipule grows at the foot of a leaf, most often with another beside it.
- The stipule at the foot of the leaf soon falls off.
