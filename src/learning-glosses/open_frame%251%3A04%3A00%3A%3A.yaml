simpleMeaning: In bowling, any turn in which a player fails to get a strike or a spare.
scope: In bowling, any turn in which a player fails to get a strike or a spare, also called break; not
  a strike and not a spare.
examples:
- He had an open frame in the eighth.
- An open frame cost him the match.
