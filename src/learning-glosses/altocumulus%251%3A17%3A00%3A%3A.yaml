simpleMeaning: a puffy cloud at a middle height in the sky, about 2 or 3 miles up
scope: A puffy cloud at a middle height in the sky; altocumulus cloud is another name for this sense,
  not a low cloud near the ground and not a high thin cloud.
examples:
- Altocumulus filled the sky in soft white patches.
- We saw altocumulus drifting above the hills.
