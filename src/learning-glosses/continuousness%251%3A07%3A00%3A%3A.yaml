senseId: 'continuousness%1:07:00::'
synsetId: 05059738-n
simpleMeaning: the fact that a thing goes on and on with no break and no end
scope: This is about a thing going on without a break or an end; not about a thing that lasts only for
  a long time, and not about a single unbroken stretch of road or time.
examples:
- The continuousness of the sound made it hard to think.
- He praised the continuousness of her hard work.
