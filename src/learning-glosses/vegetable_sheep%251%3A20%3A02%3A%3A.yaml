simpleMeaning: Leaves thick with tawny hairs cover a New Zealand herb that grows in a low, soft mound.
scope: Also called sheep plant, it is the New Zealand herb of the low, soft mound, told from the flat,
  mat-forming herb of the same name by its leaves thick with tawny hairs.
examples:
- Low on the ground, a vegetable sheep showed leaves thick with tawny hairs.
- Leaves thick with tawny hairs marked the vegetable sheep from other herbs.
