simpleMeaning: a boy baby born with one or both sex glands still inside the body, not yet dropped into
  the pouch of skin below
scope: 'Also called cryptorchidism or cryptorchism: a state in which a boy baby is born with one or both
  sex glands still inside the body, not a wound and not an illness of grown men.'
examples:
- The baby was born with cryptorchidy.
- Cryptorchidy is found when a doctor checks a new baby boy.
