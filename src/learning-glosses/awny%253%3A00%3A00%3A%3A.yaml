simpleMeaning: Of some cereal or grass plants, having hairs like stiff bristles on the parts that bear
  flowers.
scope: Also called awned, this word is used of a cereal or grass plant that has hairs like stiff bristles
  on its flowering parts.
examples:
- The awny wheatgrass had hairs like stiff bristles on its flowering parts.
- Awny grasses bear hairs on the parts that flower.
