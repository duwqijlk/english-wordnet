simpleMeaning: Describes a machine part or device that works by both electricity and moving parts.
scope: Describes a device run by electricity and moving parts, not a purely electrical part and not a
  purely hand-worked tool.
examples:
- The electromechanical lock clicked open when the current ran through it.
- An electromechanical switch moves a metal arm when power is applied.
