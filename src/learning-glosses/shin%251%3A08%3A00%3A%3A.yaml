simpleMeaning: the inner, thicker of the two bones in a person's lower leg, between the knee and the ankle
scope: The noun for the larger bone in the lower leg. Not the verb for climbing in an awkward way.
examples:
- An X-ray showed a crack in his shin, the thicker bone below the knee.
- Doctors put a cast on his broken shin after the fall.
