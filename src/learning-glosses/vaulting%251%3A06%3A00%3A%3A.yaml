simpleMeaning: In architecture, a set of arches that form a curved roof or ceiling over a room
scope: This sense is the arched roof or ceiling parts in a building. It is not the sense that means too
  proud and reaching too high, and not a horse's light jump.
examples:
- The old church is known for its high stone vaulting.
- Arches and vaulting cover the long hall.
