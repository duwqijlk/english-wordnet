simpleMeaning: 'Weak, shaky, and unsteady, and partly unable to move: that is how farm animals are left
  after they eat a poisonous weed'
scope: Also called locoism; it is a sickness of farm animals from a poisonous weed.
examples:
- The rancher lost three calves to loco disease after they ate the weed.
- Loco disease left the horse weak and unsteady on its feet.
