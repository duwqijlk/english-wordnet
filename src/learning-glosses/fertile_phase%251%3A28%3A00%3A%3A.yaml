simpleMeaning: the part of a woman's monthly cycle when a new life is most likely to start, from 7 days
  before to 7 days after the egg is set free
scope: 'Also called a fertile period: the part of a woman''s monthly cycle when a new life is most likely
  to start, not the whole cycle and not the days when a new life cannot start.'
examples:
- The fertile phase falls in the middle of her monthly cycle.
- She knew the fertile phase ran from 7 days before to 7 days after ovulation.
