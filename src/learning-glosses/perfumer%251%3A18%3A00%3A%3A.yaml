simpleMeaning: a person who makes and sells sweet-smelling liquids that people put on their skin to smell
  nice
scope: A person who makes and sells sweet-smelling liquids for the skin, not a person who only wears them
  and not a shop that only sells them without making them.
examples:
- The perfumer spent months mixing oils to make a new scent for the shop.
- A skilled perfumer in Paris sells the scents she makes in her own small shop.
