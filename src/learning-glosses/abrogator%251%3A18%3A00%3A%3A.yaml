simpleMeaning: a person in power who has the right to end a law or rule
scope: This is a person in power with the right to end a law; not a person who makes laws and not a judge
  who applies them.
examples:
- The abrogator signed the order that ended the old tax law.
- Only the abrogator could cancel the rule.
