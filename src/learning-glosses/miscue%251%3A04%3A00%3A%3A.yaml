simpleMeaning: a bad shot in billiards, when the tip of the cue slips off the ball
scope: A bad shot in billiards when the cue tip slips; not a small mistake in speech or writing, which
  is the other sense of the word.
examples:
- His miscue sent the ball wide of the pocket.
- A miscue happens when the cue tip slips off the ball.
