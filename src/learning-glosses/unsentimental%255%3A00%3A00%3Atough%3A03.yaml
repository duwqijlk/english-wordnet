simpleMeaning: facing facts and problems as they really are, and staying firm when things get hard
scope: Facing facts and hard times in a clear, firm way; not soft or guided by feelings, and not cold
  in the sense of showing no love at all.
examples:
- She took an unsentimental look at the costs and cut what the shop could not pay for.
- His unsentimental report faced the hard facts and said the plan would fail.
