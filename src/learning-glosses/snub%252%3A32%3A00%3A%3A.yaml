senseId: 'snub%2:32:00::'
synsetId: 00800201-v
simpleMeaning: to say no to a person or thing at once and in a rude, short way
scope: Also called repel and rebuff, this is a blunt, clear no to a person or offer, not pushing someone
  away by force.
examples:
- She snubbed his offer with a short, rude no.
- He snubbed their plan and refused to talk about it again.
