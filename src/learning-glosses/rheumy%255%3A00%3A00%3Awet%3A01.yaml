simpleMeaning: having water in it and feeling wet, especially used about air
scope: This describes something that is wet and damp, especially air; not something dry, and not the use
  about eyes that are full of water.
examples:
- The rheumy night air felt cold and wet.
- We walked home through the rheumy damp of the evening air.
