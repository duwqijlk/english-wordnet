simpleMeaning: Where a ray hits a surface and bounces back, this gap lies between the ray and a line standing
  straight up from that surface.
scope: This is the gap between a ray that bounces back and a line standing straight up from the surface
  where it hits.
examples:
- A ray bounced back from the surface, and the angle of reflection could be read from it.
- The angle of reflection showed where the ray had struck the surface.
