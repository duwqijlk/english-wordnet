simpleMeaning: In American football, a practice game between two groups of players from the same team
scope: In American football, this is a practice game inside one team, not a real match against another
  team and not a rough fight.
examples:
- The team held a scrimmage on Saturday morning to get ready for the season.
- In the scrimmage, the younger players played against the older players of the same team.
