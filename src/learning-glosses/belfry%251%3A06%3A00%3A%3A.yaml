simpleMeaning: a room, often at the top of a tower, where bells are hung
scope: This is the room where the bells hang, often high in a tower; it is not the bell tower itself when
  that tower stands alone.
examples:
- The old bells still hang in the belfry above the church.
- A narrow stair leads up to the belfry at the top of the tower.
