simpleMeaning: Of or about the old Greek people who lived in Attica and nearby lands, their Ionic way
  of speaking Greek, or their way of life.
scope: This is a word for things of the old Greek people of Attica and nearby lands, their Ionic way of
  speaking Greek, or their way of life; not the name of one of those people and not the name of their
  land.
examples:
- Ionian art shows the style of the old Greeks of Attica.
- The Ionian way of speaking Greek differs from the Doric way.
