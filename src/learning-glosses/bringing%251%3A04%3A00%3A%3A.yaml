synsetId: 00318033-n
simpleMeaning: the work of carrying goods or letters to the people or places they are meant for
scope: This is the act of carrying goods or post to their destination, not the act of giving a gift, and
  not the act of raising a subject for talk.
examples:
- The bringing of mail to remote villages can take days.
- The bringing of supplies to the camp took two days by mule.
