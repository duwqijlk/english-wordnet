simpleMeaning: It hurts when one or both testicles are swollen and sore
scope: A swelling of one or both testicles that hurts, not a swelling of another part of the body and
  not a pain with no swelling.
examples:
- Orchitis left him with a swollen testicle and a dull ache.
- The doctor said the orchitis would ease as the swelling went down.
