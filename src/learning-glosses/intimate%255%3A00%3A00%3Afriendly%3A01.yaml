simpleMeaning: having, or helping to make, a warm and friendly feel, in a way that is not stiff or formal
scope: This sense, also called informal and cozy, is about a place or time that feels warm and friendly;
  it is not about being close friends with someone, and not about the sex parts of the body.
examples:
- The small cafe felt intimate, with soft light and quiet talk.
- They had an intimate dinner in a warm little room.
