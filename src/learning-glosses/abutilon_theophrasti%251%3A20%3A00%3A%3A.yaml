simpleMeaning: A tall one-year herb or low shrub of tropical Asia, with velvety leaves and yellow flowers,
  giving a strong fibre; now wild in southeast Europe and the United States.
scope: A tall herb of tropical Asia, also called butter-print, velvet-leaf, velvetleaf, velvetweed, China
  jute, and Indian mallow; not other mallows and not other fibre plants.
