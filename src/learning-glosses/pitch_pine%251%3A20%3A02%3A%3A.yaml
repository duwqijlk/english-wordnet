simpleMeaning: A big, three-needled pine of the south-east United States, with very long needles and knotty,
  twisted limbs, its bark red-brown and deeply furrowed, a key wood tree.
scope: This sense is also called longleaf pine and southern yellow pine, for a big, three-needled pine
  of the south-east United States, with very long needles and knotty, twisted limbs, its bark red-brown
  and deeply furrowed, a key wood tree, unlike the sense for a big, three-needled pine of the eastern
  United States and south-east Canada, closely kin to the pond pine.
examples:
- Pitch pines grow in the south-east.
- A pitch pine has knotty limbs.
