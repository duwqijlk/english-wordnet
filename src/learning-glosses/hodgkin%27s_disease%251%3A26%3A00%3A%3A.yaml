simpleMeaning: A cancer of the lymph tissue that slowly grows, without pain, then grows in the spleen
  and liver too.
scope: A cancer of the lymph tissue that slowly grows without pain, then grows in the spleen and liver
  too; other cancers of the lymph tissue grow in different ways or cause pain.
examples:
- Hodgkin's disease slowly enlarges the lymph tissue without pain.
- Doctors found Hodgkin's disease when the spleen had grown large.
