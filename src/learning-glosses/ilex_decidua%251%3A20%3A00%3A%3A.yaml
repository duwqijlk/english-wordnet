simpleMeaning: A shrub in the southeast and middle of the United States that loses its leaves each year.
scope: Also called bearberry, possum haw, and winterberry; it is a shrub that loses its leaves each year,
  not an evergreen shrub.
examples:
- Ilex decidua grows along the river in the southeast.
- The leaves of Ilex decidua turn bright red in the fall.
