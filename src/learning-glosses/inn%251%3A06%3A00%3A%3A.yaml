simpleMeaning: a place like a hotel where people travelling can pay to stay and sleep for the night
scope: A place where travellers pay to sleep for the night, not a home where people live for a long time
  and not a place that only serves food.
examples:
- We stayed at a small inn near the road for the night.
- The inn gave travellers a warm room and a bed for the night.
