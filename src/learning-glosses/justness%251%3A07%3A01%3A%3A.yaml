simpleMeaning: A set standard of beauty and of what is right and proper, and how well a thing fits it
scope: 'Also called nicety or rightness: how well a thing fits a set standard of beauty and of what is
  right and proper, not whether it is fair or just.'
examples:
- The actor was praised for the justness of her performance.
- The justness of the design pleased the critics.
