simpleMeaning: how light and fair a person's skin looks, as in the cheeks
scope: The light, fair look of a person's skin, not the white colour itself and not a pure, sinless state.
examples:
- Only the whiteness of her cheeks showed how much strain she was under.
- The whiteness of his face after the shock made his friends worry.
