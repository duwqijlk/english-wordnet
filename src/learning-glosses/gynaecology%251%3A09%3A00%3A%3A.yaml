simpleMeaning: Women's health is looked after by this field of medicine, which treats their illnesses
  and helps them stay well
scope: Also called gynecology, this is the branch of medicine that looks after the health of women and
  treats their illnesses, not the care of men and not the care of children.
examples:
- She studied gynaecology at medical school.
- The clinic offers gynaecology for women of all ages.
