simpleMeaning: a basic state in which a person is conscious (awake and able to feel or notice things),
  with no clear separate thoughts yet
scope: This is the basic state of being conscious itself, not knowing about a subject and not having clear
  thoughts about something.
examples:
- After the accident, his awareness slowly came back.
- In deep sleep there is almost no awareness at all.
