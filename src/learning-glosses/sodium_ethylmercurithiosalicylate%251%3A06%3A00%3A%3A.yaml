simpleMeaning: A pale powder made of tiny hard bits, sold as Merthiolate, used to kill germs on skin before
  an operation
scope: A pale powder made of tiny hard bits, sold as Merthiolate, used to kill germs on skin before an
  operation; also called thimerosal; not a painkiller, and not an ordinary soap for washing hands.
examples:
- The nurse dabbed sodium ethylmercurithiosalicylate on the skin before surgery.
- Sodium ethylmercurithiosalicylate was once a common surgical antiseptic.
