simpleMeaning: a man's head covering with a low flat top and an edge that snaps up or down
scope: Also called a porkpie, this is a man's head covering with a low flat top and an edge that snaps
  up or down, not a tall head covering and not a soft cap.
examples:
- He wore a porkpie hat with a low flat crown and a snapped-up brim.
- The porkpie hat sat low on his head, its flat top and snap brim giving it a neat shape.
