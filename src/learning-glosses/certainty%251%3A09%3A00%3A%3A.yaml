simpleMeaning: the state of being sure about something
scope: The state or feeling of being sure about something; not a thing that is sure to happen, which is
  the other sense of this word.
examples:
- His certainty about the answer calmed the rest of the class.
- She spoke with certainty, sure that she was right.
