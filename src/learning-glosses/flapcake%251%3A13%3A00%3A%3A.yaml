simpleMeaning: A flat round food made from thin batter fried on both sides on a hot plate.
scope: A flat round food made from thin batter fried on both sides on a hot plate, also called pancake,
  flapjack, hotcake, battercake, flannel-cake, flannel cake, griddlecake and hot cake, not a thick cake
  baked in an oven.
examples:
- He flipped a flapcake onto the plate.
- Flapcakes with butter made a quick breakfast.
