schema: oewn-learning-gloss-v2
senseId: 'expressive_aphasia%1:26:00::'
synsetId: 14121940-n
simpleMeaning: trouble with speaking and writing that makes it very hard for a person to get thoughts
  out
scope: This is trouble getting thoughts out in speech or writing, also called ataxic aphasia, motor aphasia,
  and nonfluent aphasia; it is not trouble taking in what others say and not a loss of voice.
examples:
- After the stroke, he had expressive aphasia and could barely form a sentence.
- Her expressive aphasia made writing a letter a slow task.
