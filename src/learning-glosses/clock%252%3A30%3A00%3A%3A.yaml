senseId: 'clock%2:30:00::'
synsetId: 00491904-v
simpleMeaning: to measure how long an event or action takes, or how long a person takes to do an action
  in a set period of time
scope: 'Also called time: this is measuring how long an action takes, not the object on a wall that shows
  the time of day.'
examples:
- She clocked the runners as they crossed the finish line.
- The coach clocked him at ten seconds for the short race.
