simpleMeaning: A small tropical American tree grown for purple dye and a tanning extract; its nuts contain
  a laxative oil that is poisonous in large amounts.
scope: This names the tropical tree, not the nuts it bears or the laxative oil pressed from them.
examples:
- The physic nut is a fast-growing tropical tree that yields purple dye.
- Villagers planted physic nut along the fence, but kept its poisonous seeds away from animals.
