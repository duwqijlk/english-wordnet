simpleMeaning: A fern that grows in mats on rock or ground, with creeping roots and large divided fronds,
  found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern shared with common polypody, not the sweet-scented deciduous
  shrub also called sweet fern.
examples:
- Sweet fern spread across the rocky bank in a low mat of divided fronds.
- We found sweet fern creeping over stones near the waterfall.
