simpleMeaning: a material that can soak up another substance, or that tends to soak it up
scope: This is the material itself that soaks things up, not the describing word for a thing that can
  do this.
examples:
- Cotton wool is used as an absorbent in the clinic.
- This powder works as an absorbent for oil.
