simpleMeaning: The flesh of cold-water shellfish with big soft claws, caught from the coast it is named
  for south to the Carolinas.
scope: This is the flesh of cold-water lobsters with big soft claws, caught from Maine to the Carolinas;
  American lobster and Northern lobster are other names for this sense, and it is not the lobster itself
  as a live animal.
examples:
- Maine lobster is served cold with butter in summer.
- We ordered Maine lobster, caught from Maine to the Carolinas.
