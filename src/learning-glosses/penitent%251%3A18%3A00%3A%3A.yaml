simpleMeaning: In the Roman Catholic Church, a person sorry for doing wrong who may do penance (acts to
  show sorrow) led by a priest who hears their private words
scope: This sense is a person in the Roman Catholic Church who is sorry for wrongdoing; it is not the
  word for feeling sorry itself, and not the priest who hears them.
examples:
- The penitent knelt and told the priest she was sorry for what she had done.
- Each penitent met the priest in private to say he was sorry.
