simpleMeaning: A blood vessel that brings blood to the muscles of the shoulder and of the flat bone at
  the back of the shoulder.
scope: A blood vessel that feeds the muscles of the shoulder and the shoulder blade, also called arteria
  circumflexa scapulae; not the blood vessel that feeds the hip and not a vein.
examples:
- The circumflex scapular artery supplies the muscles around the shoulder blade.
- The surgeon tied off the circumflex scapular artery.
