simpleMeaning: a grand show of scenes from history and such things, usually with a parade and people wearing
  rich, special clothes for the show
scope: 'Also called pageant: this is a grand show of scenes from history, not just any parade and not
  the rich special clothes on their own.'
examples:
- The town's pageantry told the story of its past, with a long parade in fine old clothes.
- Thousands came to watch the pageantry, a grand show of scenes from the town's history.
