senseId: 'tangent%1:24:00::'
synsetId: 13810247-n
simpleMeaning: In maths, a number found by dividing the side across from an angle by the side next to
  it in a triangle with a right angle
scope: In maths this number is also called tan; it is not the straight line that touches a curve at one
  point.
examples:
- In this right triangle, the tangent of 45 degrees is 1.
- We found the tangent by dividing the opposite side by the side next to the angle.
