simpleMeaning: 'One of the largest bony fish: open-ocean swimmer with a round, flattened body, tall fins
  along its back and underside, and a rudder-like tail; found in warm seas worldwide.'
scope: This is the giant ocean sunfish, also called mola or headfish; not the small freshwater sunfish
  of North America (crappies, bluegills and their kin), and not the flesh of those fish eaten as food.
examples:
- A giant sunfish drifted past the boat, its tall fins breaking the surface.
- Sunfish can weigh well over a tonne.
