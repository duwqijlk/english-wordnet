simpleMeaning: In biology, the link between living things or groups of living things that leads to parts
  of them being alike in shape or build
scope: In biology, the link between living things shown by alike body parts, also called phylogenetic
  relation; not the chemistry force, not the attraction in blood tests, and not family links by marriage.
examples:
- Humans show a close affinity with apes in the shape of their hands.
- The affinity between these two fish is clear from their fins, which have the same shape.
