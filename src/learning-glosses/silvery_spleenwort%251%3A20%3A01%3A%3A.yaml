simpleMeaning: a North American fern with thin leaves on yellowish leaf stalks
scope: A North American fern with thin leaves on yellowish leaf stalks, also called glade fern or narrow-leaved
  spleenwort; not a fern with long pale outgrowths that hold its young spores.
examples:
- Silvery spleenwort with thin leaves on yellowish stalks grew in the damp woods.
- The silvery spleenwort had thin leaves on yellowish stalks.
