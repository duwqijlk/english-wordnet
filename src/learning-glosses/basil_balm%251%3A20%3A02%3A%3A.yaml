simpleMeaning: This sweet-smelling mint of Europe bears bunches of small purple and white flowers, and
  now grows at home, above all in the east of North America.
scope: Also called basil thyme and mother of thyme, this is a sweet-smelling mint of Europe with small
  purple and white flowers, now at home, above all in the east of North America.
examples:
- The basil balm smelled sweet.
- Basil balm now grows in the east of North America.
