simpleMeaning: In the Episcopal Church, a priest who looks after a small church building.
scope: In the Episcopal Church, a priest in charge of a chapel, not the Roman Catholic priest who acts
  for a higher priest and not the Church of England priest of a parish.
examples:
- The vicar of the chapel led the Sunday service.
- She was made vicar of the little chapel by the sea.
