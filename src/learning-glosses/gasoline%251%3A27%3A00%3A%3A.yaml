simpleMeaning: A light, highly flammable blend made from crude oil, used mainly to power the engines of
  cars and other vehicles.
scope: The North American name for this petroleum fuel; petrol is the British name for the same thing,
  and diesel is a heavier, different fuel.
examples:
- She stopped at the station to fill the tank with gasoline.
- The price of gasoline rose again before the holiday weekend.
