simpleMeaning: In prosody, the strong sound on one syllable (one sound part of a word) in a small group
  of syllables in a line of poetry
scope: 'Also called beat: the strong sound in a line of poetry, not a tool for measuring size and not
  a pattern of beats in music.'
examples:
- In this line of poetry, the measure falls on the first word part of each small set.
- The teacher showed us where the measure is in each line of the poem.
