simpleMeaning: A herb grown for its various forms that flower heavily, with florets ranging from white
  through pink and red to purple, violet or blue, developed from Pericallis cruenta.
scope: This is the ornamental plant grown for its abundant flowers, developed from Pericallis cruenta;
  it is not the wild species itself, nor the other plants also called cineraria. The full name belongs
  to horticulture.
examples:
- The florist's cineraria on the windowsill was covered in pink and white flowers.
- Growers raise florist's cineraria in many colours, from white and pink to deep blue.
