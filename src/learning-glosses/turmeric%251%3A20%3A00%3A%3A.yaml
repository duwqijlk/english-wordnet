simpleMeaning: a plant from India, grown in many hot lands, with yellow flowers and a large, strong-smelling,
  deep yellow underground root; it gives a spice and a yellow dye
scope: This is the living plant, not the dried, ground underground root used as a spice for food.
examples:
- Turmeric grows well in hot, wet soil in India.
- The turmeric plant has bright yellow flowers.
