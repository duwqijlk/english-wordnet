simpleMeaning: Birth without mating, by one cell splitting into many at once; found in many tiny one-celled
  animals that live on others.
scope: Birth without mating, by one cell splitting into many at once; not birth by mating and not splitting
  into two only.
examples:
- Schizogony lets one cell become many at once.
- The tiny animals spread by schizogony.
