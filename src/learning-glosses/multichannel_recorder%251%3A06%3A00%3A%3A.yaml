senseId: 'multichannel_recorder%1:06:00::'
synsetId: 03803964-n
simpleMeaning: A machine with two or more channels that keeps steady written records of two or more signals
  at the same time.
scope: A machine that writes down two or more signals at once, not a machine that takes in only one signal
  and not a machine that plays sounds back.
examples:
- The lab's multichannel recorder tracked four signals at once.
- The multichannel recorder wrote down the heat and the pressure at the same time.
