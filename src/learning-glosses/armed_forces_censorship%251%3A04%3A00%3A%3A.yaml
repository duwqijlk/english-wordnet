simpleMeaning: the checking of personal letters and messages sent to or from people in the fighting services
scope: The fighting services' checking of their own people's letters and messages, not a ban on news and
  not a check on what the public reads.
examples:
- During the war, armed forces censorship held back some of his letters home.
- Armed forces censorship meant her message to the base took days to arrive.
