simpleMeaning: To turn your attention and effort to a task or problem.
scope: This is about directing your effort at a practical task or question, not about treating a topic
  in speech, writing, or art, speaking to someone, giving a speech, greeting a person, directing a question
  at someone, writing postal details on mail, locating data by a code, aiming a golf club, or any noun
  sense such as a place, a house sign, a speech, a way of speaking, written delivery details on mail,
  tact, a golfer's stance, or storage code.
examples:
- The new manager addressed the backlog of complaints within her first week.
- Before the meeting ends, we must address the question of who will pay.
