simpleMeaning: Hung up to be hit, this ball or sack filled with air helps a boxer learn to box
scope: A ball or sack filled with air, hung up and hit in boxing training; punchball, punch bag and punching
  ball are other names for this sense, not a bowl of drink and not a small tent.
examples:
- He punched the punching bag until his arms ached.
- The gym had a new punching bag hanging from the ceiling.
