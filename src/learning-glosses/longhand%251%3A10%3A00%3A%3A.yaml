simpleMeaning: Quick writing by hand in which the letters are written out in full and joined to each other
  in each word, without taking the pen off the paper.
scope: 'Also called cursive or cursive script: quick writing by hand in which the letters are written
  out in full and joined to each other in each word, without taking the pen off the paper.'
examples:
- She took notes in longhand, her pen never leaving the paper.
- The letter was written in longhand, the letters joined in each word.
