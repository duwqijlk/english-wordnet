simpleMeaning: having trouble understanding written words, usually linked with a problem in the brain
  or the nerves
scope: Describing a person who has trouble taking in written words, usually linked with a problem in the
  brain or the nerves. It is not the noun for such a person, and not the wider sense of anything to do
  with this condition.
examples:
- The dyslexic boy reads slowly but understands stories well when he hears them.
- Bigger print helps dyslexic students read the words on the page.
