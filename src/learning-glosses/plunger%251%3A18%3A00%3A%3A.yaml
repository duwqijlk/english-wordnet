simpleMeaning: a person who risks losing money for the chance of gaining a lot
scope: 'Also called speculator: a person who risks losing money to gain a lot, not the tool with a rubber
  cup for cleaning blocked pipes and not a part that pushes in and out in a machine.'
examples:
- The plunger bet a large sum on the risky shares, hoping for a big gain.
- As a plunger, he often risked all his savings on one deal.
