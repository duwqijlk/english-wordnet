simpleMeaning: Its eggs hatch in the warmth of heaps of sand in Australia, where this bird lays them and
  leaves them to warm on their own.
scope: Also called leipoa and mallee fowl, it is an Australian bird whose eggs hatch in the warmth of
  sandy heaps.
examples:
- The lowan laid her eggs in a heap of warm sand.
- The heat of the lowan's sandy heap hatched the eggs.
