simpleMeaning: about or showing magnetism, the pull of a magnet, when it is made by a moving electric
  charge
scope: It describes magnetism made in this electric way, not magnetism from a plain magnet and not electricity
  on its own.
examples:
- Electromagnetic waves travel through space.
- The lab measured the electromagnetic field around the wire carrying electric current.
