simpleMeaning: The belief that storms, quakes, plants, stones and other things of nature have minds and
  selves of their own.
scope: The belief that storms, quakes, plants and stones have minds and selves of their own, not the worship
  of them.
examples:
- Animatism gives a storm a mind of its own.
- Under animatism, even a stone is thought to have a self.
