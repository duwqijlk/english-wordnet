simpleMeaning: a long seat for more than one person, with no back, usually with pillows put against a
  wall
scope: This is a long seat with no back, usually with pillows by a wall; it is not the book of Persian
  or Arabic poems that has the same name.
examples:
- She lay down on the divan in the sitting room.
- They put a divan along the wall under the window.
