synsetId: 03290017-n
simpleMeaning: A drug, sold as Vasotec, that blocks the enzyme that makes the body chemical angiotensin
  in the kidney so blood vessels widen, given after heart attacks
scope: A drug sold as Vasotec that stops angiotensin forming and widens blood vessels, given after heart
  attacks, not a painkiller and not a drug that slows the heart.
examples:
- The doctor prescribed enalapril after his heart attack.
- Enalapril helped widen her blood vessels.
