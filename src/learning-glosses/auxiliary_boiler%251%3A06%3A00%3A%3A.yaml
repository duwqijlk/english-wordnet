simpleMeaning: In ships, an extra tank that heats water to make steam, used while the ship is in port
scope: 'Also called a donkey boiler: an extra unit on a ship that makes steam while the ship is in port,
  not the ship''s main boiler and not a heater used on land.'
examples:
- The crew fired up the auxiliary boiler while the ship lay in port.
- An auxiliary boiler kept the ship warm overnight in the harbour.
