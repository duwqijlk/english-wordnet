simpleMeaning: a path that is not normal, going from a space in the body with pus (yellow liquid from
  a place that is infected) to the outside of the body
scope: 'Also called fistula: a path that is not normal, from a space with pus inside the body to the outside,
  not a wide path for blood and not an air-filled space in the bones of the head.'
examples:
- A sinus formed from the infected tooth and reached the outside of his cheek.
- The doctor treated the sinus that carried pus from a deep space to the skin.
