simpleMeaning: In religion, the belief that God and what God made can never be alike enough, since what
  sets them apart is always greater, so any likeness between them falls short
scope: A religious belief about God and his creatures, not a comparison made to show a likeness.
examples:
- In his sermon he spoke of the analogy between the creator and his creatures.
- For her, the analogy of God and his creatures always fell short.
