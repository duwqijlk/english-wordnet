simpleMeaning: Dance music many people like, with a tune and a steady low beat, most of all from the late
  1970s, made mainly for dancing at dance clubs
scope: Dance music with a steady beat, not the dance itself and not any kind of pop music.
examples:
- The disco on the radio made everyone get up and dance.
- They played disco all night at the party.
