simpleMeaning: A state in which yellow lumps break out all over the body, above all at the elbows and
  knees, and the body often mishandles fat too.
scope: This state, in which yellow lumps break out all over the body, above all at the elbows and knees,
  and the body often mishandles fat, is also called cholesterosis cutis, lipoid granulomatosis, xanthoma
  multiplex, and xanthomatosis.
examples:
- Yellow lumps on the elbows and knees pointed to lipid granulomatosis.
- The elbows and knees were the worst hit by lipid granulomatosis.
