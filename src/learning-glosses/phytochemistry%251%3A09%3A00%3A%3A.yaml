simpleMeaning: The study of the chemicals in plants, one part of organic chemistry, the science of chemicals
  found in living things.
scope: This is the study of the chemicals in plants; not the study of the chemicals in animals, and not
  the study of how plants grow.
examples:
- She chose phytochemistry as her field of study.
- Phytochemistry looks at the chemicals that make a leaf bitter.
