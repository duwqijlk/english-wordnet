simpleMeaning: the number of people living in a place, either all of them or those of a certain race or
  class
scope: This is the count of people in a place, not the people themselves and not the act of settling them
  there.
examples:
- The town's population has grown by a third in ten years.
- The city has a large population of retired teachers.
