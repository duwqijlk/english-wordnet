simpleMeaning: a hard lump that forms in the gall bladder, the small sac near the liver, or in its tubes
scope: 'Also called gallstone: a hard lump that forms in the gall bladder or its tubes, not a stone in
  the kidney and not a lump in the liver itself.'
examples:
- The doctor found a bilestone in her gall bladder.
- A bilestone can block one of the tubes from the gall bladder and cause pain.
