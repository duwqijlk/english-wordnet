simpleMeaning: A desert shrub of the south-western United States and New Mexico with leaves that stay
  on all year, smell sweet, feel sticky, and small yellow flowers
scope: Also called coville, creosote bush, or hediondilla; this is the desert shrub with sticky sweet-smelling
  leaves, not other desert shrubs.
examples:
- Larrea tridentata grows in the desert.
- The Larrea tridentata was covered in small yellow flowers.
