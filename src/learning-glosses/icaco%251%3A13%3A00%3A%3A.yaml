simpleMeaning: From warm America comes a fruit like a plum, pale to nearly black, that is cooked into
  sweet spreads.
scope: Also called coco plum and cocoa plum, it is the fruit itself, not the tree that bears it.
examples:
- She made icaco jam from the pale fruit.
- The icaco were almost black, so she cooked them into jam.
