simpleMeaning: At the top of the stem, three leaves stand in a ring, and above them sits one flower with
  three petals, on this lily-kind plant of the group Trillium.
scope: Also called trillium and wood lily, this lily-kind plant of the group Trillium has three leaves
  in a ring and one three-petaled flower.
examples:
- The wake-robin had one flower with three petals above its ring of leaves.
- We found wake-robin with three leaves at the top of its stem.
