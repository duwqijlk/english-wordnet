simpleMeaning: for a time with no set end, and to a degree with no set limit
scope: For a time or degree with no set limit, not for a fixed short time and not in a clear, set way.
examples:
- The meeting was put off indefinitely, with no new date set.
- This wet weather could go on indefinitely.
