simpleMeaning: an act that changes something and makes it less good than it was before
scope: The act of making something less good, not the describing word for a thing that is itself becoming
  less good.
examples:
- His harsh words caused a worsening of relations between the two groups.
- The new law led to a worsening of life for poor families.
