simpleMeaning: the act of splitting something into parts by marking off a boundary that keeps the parts
  apart
scope: The act of splitting something into parts by marking off a boundary that keeps the parts apart;
  division is another name for this sense, not a wall itself and not simply cutting something in two.
examples:
- The partition of the land caused years of dispute.
- They agreed on the partition of the estate.
