simpleMeaning: A finger ring made of precious metal, often with jewels set into it.
scope: This sense is a finger ring of precious metal, not a group of people or musicians, not a colored
  stripe or decorative strip, not a strip worn around the body or limb, not a strip or loop that holds
  something, not a machine belt, not a range of frequencies, not a band of tissue, not a bird's leg tag,
  not a restraint, and not the verbs for tying things together or fitting a ring to a bird's foot.
examples:
- He slid a plain gold band onto her finger.
- Her wedding band was set with three small diamonds.
