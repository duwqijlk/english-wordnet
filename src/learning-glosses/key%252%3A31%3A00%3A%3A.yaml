simpleMeaning: to work out which plant or animal something is by checking a guide.
scope: It is not the metal object that opens a lock or the adjective meaning 'most important'; it is the
  biology verb for naming a plant or animal.
examples:
- The students keyed out the wild flowers with the guide.
- The biologist keyed the sample and found it was a rare moss.
