simpleMeaning: So each maker makes only a share of all it could make, how much of something is made or
  handed out, like oil or gas, is held back
scope: This is a limit on how much of something is made or handed out, like oil or gas, holding each maker
  to a share of all it could make.
examples:
- Proration held the makers of oil to a share of all they could make.
- With proration, no maker could make more than its share.
