simpleMeaning: one of several kinds of bushy Old World willow with wide leaves and big soft flower clusters;
  some are key sources of bark for tanning leather and wood for charcoal
scope: A bushy willow with big soft flower clusters, not the pale yellow colour of sick skin and not the
  verb that makes skin that colour.
examples:
- Sallows grew along the river bank, their catkins soft in the spring sun.
- The sallow by the fence was cut for charcoal and tanbark.
