simpleMeaning: Sharks with broad, flat bodies and wing-like side fins, that swim the way sharks do.
scope: Sharks with broad, flat bodies and wing-like side fins, that swim the way sharks do; also called
  angel shark or angelfish; not fishes with broad mouths, with a thread shaped like a worm, fastened on,
  to draw in prey, nor the flesh of a large-headed anglerfish of the Atlantic waters of North America.
examples:
- Their monkfish swam in the bay.
- The monkfish was caught at dawn.
