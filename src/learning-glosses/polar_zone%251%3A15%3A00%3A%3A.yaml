simpleMeaning: The part of the Earth's surface that forms a cap over a pole, known for very cold weather
scope: The part of the Earth's surface forming a cap over a pole, known for very cold weather; frigid
  zone and polar region are other names for this sense, and this is not the warm belt round the middle
  of the Earth.
examples:
- The polar zone is known for very cold weather.
- Ice covers much of the polar zone.
