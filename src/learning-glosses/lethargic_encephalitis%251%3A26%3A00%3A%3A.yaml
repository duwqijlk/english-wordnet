simpleMeaning: From 1915 to 1926 a brain swelling spread widely; it left the eye muscles stuck still and
  the whole body very weak.
scope: 'Also called encephalitis lethargica, epidemic encephalitis, sleeping sickness, and sleepy sickness:
  a brain swelling that spread widely from 1915 to 1926.'
examples:
- Doctors saw many cases of lethargic encephalitis between 1915 and 1926.
- Lethargic encephalitis left him unable to move his eyes and very weak.
