simpleMeaning: the simplest kind of curved roof, one long unbroken arch
scope: The plainest kind of curved roof, one long arch with no break in it, not a dome and not a roof
  with many separate arches.
examples:
- The long hall is covered by a barrel vault.
- A barrel vault runs the whole length of the old cellar.
