senseId: 'boustrophedon%1:10:00::'
synsetId: 06372853-n
simpleMeaning: An old way of writing in which lines run in turn one way and then the other, as an ox ploughs
  a field
scope: An old way of writing in which lines run in turn one way and then the other; not writing that always
  runs one way and not writing in columns.
examples:
- The stone was carved in boustrophedon, with lines running in turn.
- Boustrophedon reads one way on one line and the other way on the next.
