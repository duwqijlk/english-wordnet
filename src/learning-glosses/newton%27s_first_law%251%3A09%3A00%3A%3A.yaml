simpleMeaning: A body stays still or keeps moving at the same speed in the same direction unless some
  outside force acts on it
scope: Also called the first law of motion and Newton's first law of motion; a body stays still or keeps
  moving at the same speed in the same direction unless some outside force acts on it, unlike the second
  and third laws of motion.
examples:
- Newton's first law explains why a ball keeps rolling until something stops it.
- A book on a table stays put, as Newton's first law says it will.
