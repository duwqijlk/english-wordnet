simpleMeaning: a piece of music, or part of one, played a little faster than andante but not as fast as
  allegro
scope: A tempo between andante and allegro; not a fast allegro and not a slow andante.
examples:
- The second movement is marked allegretto, so it moves along briskly.
- She played the allegretto a touch faster than the andante.
