senseId: 'freshness%1:07:02::'
synsetId: 04923043-n
simpleMeaning: the quality of being rude and not showing respect, and of being ready to do things you
  have no right to do
scope: Rudeness that takes liberties, with crust, gall and insolence as other names for this sense, and
  not newness or the freshness of food.
examples:
- The teacher was shocked by the boy's freshness.
- His freshness with strangers made people uncomfortable.
