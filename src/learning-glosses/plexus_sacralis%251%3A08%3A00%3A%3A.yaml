simpleMeaning: A network of nerves serving the pelvic area and the lower limbs, built from the fourth
  and fifth lumbar nerves and the first three sacral nerves.
scope: Another name for the sacral plexus, the nerve network that serves the pelvic area and the legs;
  not the lumbar plexus higher up, and not the sciatic nerve that branches from it.
examples:
- Damage to the plexus sacralis can weaken the muscles of the lower leg.
- The plexus sacralis is formed where the lower lumbar and upper sacral nerves join.
