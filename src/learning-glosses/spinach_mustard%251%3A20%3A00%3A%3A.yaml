simpleMeaning: Grown for leaves that people eat and for the thick top of its root, this plant comes from
  Asia.
scope: Also called tendergreen, this plant from Asia is grown for the thick top of its root and for leaves
  that people eat.
examples:
- We grow spinach mustard for its thick root top and its leaves.
- We ate the leaves of the spinach mustard and its thick root top.
