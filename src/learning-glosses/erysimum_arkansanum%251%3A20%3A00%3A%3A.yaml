simpleMeaning: A prairie plant living two years or a short life, with orange-yellow flowers, from the
  west of North America to Minnesota and Kansas; sometimes put in the Cheiranthus genus.
scope: Also called a western wall flower, Cheiranthus asperus, or Erysimum asperum; a prairie plant living
  two years or a short life, with orange-yellow flowers, from the west of North America to Minnesota and
  Kansas, kin to other prairie wall flowers.
examples:
- Erysimum arkansanum grows on the prairie, its orange-yellow flowers bright in June.
- We saw Erysimum arkansanum from western North America to Kansas.
