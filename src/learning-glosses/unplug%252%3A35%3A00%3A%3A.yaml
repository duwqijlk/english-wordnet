simpleMeaning: to take the end of the power cord of an electric machine out of its socket so the machine
  cannot work
scope: 'Also called disconnect: to take the end of an electric machine''s power cord out of its socket
  so the machine cannot work. It is not just turning the machine off with a switch, and not putting the
  cord in to join it to power.'
examples:
- Please unplug the hair dryer after you use it.
- He unplugged the lamp before he fixed it.
