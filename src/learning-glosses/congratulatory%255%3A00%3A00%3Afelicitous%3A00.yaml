senseId: congratulatory%5:00:00:felicitous:00
synsetId: 01003512-s
simpleMeaning: showing kind pleasure and joy because someone has done well or had good luck
scope: This shows joy for another person's success or good luck, and it is also called gratulatory; it
  is not joy for your own good luck.
examples:
- She sent him a congratulatory message after he passed the exam.
- The team got a congratulatory letter when they won the prize.
