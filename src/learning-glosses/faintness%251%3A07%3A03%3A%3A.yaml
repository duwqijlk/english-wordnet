simpleMeaning: the quality of not being brave; a person with it does not act with courage
scope: This is about not being brave, not about a sound or light being weak and hard to see, and not a
  feeling that you are about to fall down.
examples:
- His faintness of heart stopped him from speaking up.
- Faintness kept her from facing the danger.
