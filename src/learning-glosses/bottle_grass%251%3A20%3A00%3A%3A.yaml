simpleMeaning: This plant from Europe, with a soft tail-like head, now grows wild in North America and
  is often a weed that causes trouble.
scope: A plant from Europe now growing wild in North America, also called bottle-grass, green bristlegrass,
  green foxtail and rough bristlegrass.
examples:
- The bottle grass had spread and had to be pulled up.
- The bottle grass grew thick where it was not wanted.
