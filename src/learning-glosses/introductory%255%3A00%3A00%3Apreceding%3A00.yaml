simpleMeaning: that comes at the very start of something and opens it before the main part begins
scope: This describes something at the very start that opens the main part; it is not the main body itself
  and not the ending.
examples:
- The teacher wrote a short introductory page before the first chapter.
- In his introductory remarks, the speaker thanked everyone for coming.
