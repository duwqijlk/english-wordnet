simpleMeaning: To celebrate in a loud, happy way, often while drinking; to take part in wild, noisy fun
scope: To celebrate in a loud, happy way; racket, revel, jollify, make happy, make merry, make whoopee
  and wassail are other names for this sense, and it is not a quiet toast or a calm dinner.
examples:
- Let's whoop it up tonight — the exams are over!
- They whooped it up at the wedding until dawn.
