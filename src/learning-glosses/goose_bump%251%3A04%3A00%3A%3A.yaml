simpleMeaning: when the small hairs on the skin stand up on their own, after cold, strong feelings, or
  a sore, itchy patch of skin
scope: The small hairs on the skin stand up on their own, also called goose pimple, goose skin, goosebump,
  gooseflesh, horripilation and pilomotor reflex, not a spot on the skin and not a shiver.
examples:
- I got goose bumps all over my arms when I stepped into the cold wind.
- The sad film gave her goose bumps.
