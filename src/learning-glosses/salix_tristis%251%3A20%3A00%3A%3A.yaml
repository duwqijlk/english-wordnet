simpleMeaning: A willow shrub of dry places in the eastern United States with long narrow leaves that
  are grey-white and hairy underneath.
scope: Also called dwarf gray willow, dwarf grey willow, or sage willow, this is a willow shrub of dry
  places in the eastern United States with long narrow leaves, not a willow of wet ground.
examples:
- Salix tristis grows in dry places in the eastern United States.
- The long narrow leaves of Salix tristis are hairy underneath.
