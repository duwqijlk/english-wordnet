senseId: 'endemic%3:00:00::'
synsetId: 01430630-a
simpleMeaning: about a disease, or something like a disease, that is always present in a certain place,
  to a large or small degree
scope: 'Also called endemical: about a disease, or something like one, that stays in a certain place.
  It is not the noun sense that names such a disease itself.'
examples:
- Malaria is endemic in that warm, wet region.
- Poverty has become endemic in parts of the city.
