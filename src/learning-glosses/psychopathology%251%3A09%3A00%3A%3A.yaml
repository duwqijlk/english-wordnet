simpleMeaning: Illnesses of the mind are found out and treated by this part of healing
scope: 'Psychiatry and psychological medicine are other names for this sense: the part of healing that
  deals with illnesses of the mind, not the part that deals with illnesses of the body.'
examples:
- She studied psychopathology to learn how illnesses of the mind are treated.
- Psychopathology covers both finding out what is wrong in the mind and treating it.
