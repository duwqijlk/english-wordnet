simpleMeaning: 'A measure of fuel use for a vehicle: the amount of petrol or diesel it burns to travel
  100 km.'
scope: Also called litres per hundred kilometres, it is a measure of fuel burned over a set distance,
  not over a set time.
examples:
- Liters per hundred kilometers tell us how much fuel the vehicle burns.
- Liters per hundred kilometers is given for each vehicle.
