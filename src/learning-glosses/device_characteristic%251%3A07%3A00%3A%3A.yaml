simpleMeaning: a quality of a machine that can be measured when the test is set up in a fixed way
scope: This is a quality of a machine that can be measured under fixed test conditions; characteristic
  is another name for this sense, not a quality that cannot be measured and not a fault in the machine.
examples:
- The device characteristic they checked first was how much power the motor used.
- Each device characteristic was measured under the same fixed test conditions.
