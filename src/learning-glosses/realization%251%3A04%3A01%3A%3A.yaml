simpleMeaning: a sale made to get money, such as selling shares in a company or things owned by a person
  who cannot pay debts, or the money got
scope: This is a sale made to get money, or the money from it; it is not making something happen in fact
  and not a piece of music finished by another person.
examples:
- The realization of his shares brought in the money he needed.
- Money from the realization of the land was used to pay what was owed.
