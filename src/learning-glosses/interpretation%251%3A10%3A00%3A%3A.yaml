simpleMeaning: an account of what a thing means, worked out by thinking hard about the thing itself
scope: An explanation of what something means, not the act of showing a meaning in an artistic performance.
examples:
- The report included his interpretation of the forensic evidence.
- Her interpretation of the poem surprised the whole class.
