simpleMeaning: the whole living body seen as a set of parts that depend on one another and work together
  as one.
scope: This sense is not one organ or one set of related organs, and not a method or scheme; it is the
  entire body viewed as a working whole.
examples:
- The poison affected his entire system.
- Good sleep keeps the whole system running well.
