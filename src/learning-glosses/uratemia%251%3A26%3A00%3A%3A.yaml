simpleMeaning: In the blood, the salts of uric acid stand above their usual amount, a sign of gout.
scope: This is a blood finding that points to gout, with too much of the salts of uric acid in the blood.
examples:
- The blood test showed uratemia, with too much of the salts of uric acid in the blood.
- Too much of the salts of uric acid in the blood pointed to uratemia.
