senseId: 'absorption_coefficient%1:23:00::'
synsetId: 13607658-n
simpleMeaning: A measure of how fast light's intensity falls as it passes through a substance; the share
  of incoming radiant energy taken in per unit mass or thickness.
scope: Another name for absorptance and coefficient of absorption; it is not the general process of taking
  in light.
examples:
- They calculated the absorption coefficient of the solution at each wavelength.
- A higher absorption coefficient means the material blocks more of the beam.
