simpleMeaning: to drop a planned event or put it back with no new date set
scope: 'Also called cancel, scratch and scrub: to drop a planned event or put it back with no new date,
  not to end a phone call and not to order a dog away.'
examples:
- They had to call off the picnic because of the rain.
- The school decided to call off the trip after the bus broke down.
