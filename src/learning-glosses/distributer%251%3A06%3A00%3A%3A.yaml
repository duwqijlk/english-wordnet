simpleMeaning: One after another, in the order in which they fire, the plugs of a petrol engine get their
  spark-making power from this electric device.
scope: Also called distributor and electrical distributor, this electric device passes spark-making power
  to the plugs of a petrol engine in the order in which they fire, not the plugs themselves.
examples:
- The distributer sends power to the spark plugs in turn.
- The plugs fired in turn because of the distributer.
