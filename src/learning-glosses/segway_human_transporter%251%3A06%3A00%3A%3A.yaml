simpleMeaning: A two-wheeled standing ride that keeps its own balance, made for one person to travel on
  flat paths where people walk.
scope: This is a self-balancing ride that one person stands on to travel along flat paths where people
  walk; Segway and Segway HT are other names for this sense.
examples:
- A Segway Human Transporter carried her smoothly along the promenade.
- He tried a Segway Human Transporter on the flat walkway.
