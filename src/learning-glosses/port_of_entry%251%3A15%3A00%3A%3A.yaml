simpleMeaning: a place in the United States where customs officers check people and goods as they come
  in and go out
scope: Also called a point of entry, this is a place in the United States where customs officers check
  people and goods as they come in and go out, not just any harbour and not a crossing with no customs
  officers there.
examples:
- New York is a busy port of entry, where customs officers check people and goods arriving from abroad.
- Trucks carrying goods must stop at the port of entry for customs checks.
