simpleMeaning: 'A viral illness of babies and young children: sudden high fever, mild sore throat; a few
  days later, a faint pinkish rash lasting a few hours to a few days.'
scope: Another name for exanthema subitum, a viral illness of babies and young children; it is not rubella
  (German measles).
examples:
- The baby's high fever was followed by the faint rash of pseudorubella.
- Pseudorubella begins with a sudden high fever, and the rash appears days later.
