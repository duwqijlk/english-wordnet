simpleMeaning: People think the money a company makes will keep going up, because it has gone up faster
  than most; these are shares in that company
scope: Shares in a company whose money made goes up fast, not shares in a slow company and not a share
  bought for the money it pays out.
examples:
- She put her savings into growth stock.
- The growth stock in his fund had done well for years.
