simpleMeaning: Seats go to each party in line with the share of all votes it won, when voters pick from
  slates of names put up by each party.
scope: Also called list system and scrutin de liste, it is the voting system that shares out seats by
  the share of the vote each party won.
examples:
- Under the scrutin de liste system, the party that won a third of the votes took a third of the seats.
- Under the scrutin de liste system, voters choose between party lists at the polls.
