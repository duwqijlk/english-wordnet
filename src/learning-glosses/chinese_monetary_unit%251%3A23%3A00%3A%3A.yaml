simpleMeaning: The standard amount of money used in the People's Republic of China
scope: This is the unit in which money in the People's Republic of China is counted, used to state prices
  and sums rather than as a coin or banknote itself.
examples:
- Prices in the shops are given in the Chinese monetary unit.
- The Chinese monetary unit is used all over the People's Republic of China.
