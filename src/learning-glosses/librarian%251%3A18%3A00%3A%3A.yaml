simpleMeaning: a person trained in library science (the study of how libraries work), whose job is to
  work in a library
scope: A trained person who works in a library, not the library building itself and not a person who only
  comes there to read.
examples:
- The librarian helped me find the book I needed.
- Our school librarian runs the reading room.
