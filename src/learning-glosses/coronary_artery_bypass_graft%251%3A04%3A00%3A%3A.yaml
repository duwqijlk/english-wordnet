synsetId: 00677051-n
simpleMeaning: Surgery in which the chest is opened and a piece of blood vessel taken from the aorta is
  attached to a narrowed heart artery, so blood reaches the muscle again.
scope: The full open-chest operation, also called coronary bypass or coronary bypass surgery, not a stent
  or surgery on other arteries.
examples:
- His coronary artery bypass graft took six hours.
- After the coronary artery bypass graft, blood flowed freely to his heart again.
