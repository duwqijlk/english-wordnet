simpleMeaning: An ABC-order list of things, with one stiff paper slip for each thing, as for books in
  a library.
scope: An ABC-order list of things, with one stiff paper slip for each thing; card catalog and card index
  are other names for this sense, not a list on a computer screen and not a shelf of books.
examples:
- She found the book through the card catalogue.
- The card catalogue lists every book in the library.
