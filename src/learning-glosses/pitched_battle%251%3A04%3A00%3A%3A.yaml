simpleMeaning: At a set time and place, armed groups in set places fight it out at close quarters.
scope: Armed groups in set places at a set time and place fight this hard fight at close quarters, not
  a chance meeting of fighters and not a fight from far off.
examples:
- The two armies met in a pitched battle.
- They fought a pitched battle.
