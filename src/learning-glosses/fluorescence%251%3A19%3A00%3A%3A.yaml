simpleMeaning: Light given off by a thing while it takes in rays of another kind, which cannot be seen.
scope: For a thing that glows when it takes in rays that cannot be seen, as under an ultraviolet lamp.
examples:
- The mineral showed fluorescence under the ultraviolet lamp.
- Fluorescence makes the poster glow in the dark.
