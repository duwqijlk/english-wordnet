senseId: cold%5:00:00:unoriginal:00
synsetId: 01694033-s
simpleMeaning: Without originality or spontaneity; stale because it is no longer new.
scope: This is the sense of stale material, such as news, jokes, or excuses, that has lost its freshness
  and surprise. It is not the temperature sense, not the sense of showing no enthusiasm, and not the food
  sense of having lost freshness through time. It survives mainly in literary phrases such as 'cold news'.
examples:
- The story was cold by the time it reached the printers.
- His jokes had gone cold after years of retelling.
