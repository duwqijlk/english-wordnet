simpleMeaning: Sky-blue blooms shaped like a funnel open on this plant of the damp open heaths of Europe
  and Asia, which lives year after year.
scope: People also call it calathian violet, and the word names the gentian of damp open heaths, set apart
  by its sky-blue funnel blooms.
examples:
- The marsh gentian grows on damp open heaths and bears sky-blue funnel-shaped flowers.
- Marsh gentian opened its sky-blue blooms on the damp heath.
