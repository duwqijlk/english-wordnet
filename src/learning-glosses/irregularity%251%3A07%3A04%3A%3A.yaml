senseId: 'irregularity%1:07:04::'
synsetId: 05073181-n
simpleMeaning: a shape that is not the same on both sides, or a pattern in space where the parts are not
  set out in an even way
scope: Also called geometrical irregularity. This is an uneven shape or pattern in space, not trouble
  going to the toilet, not breaking a rule, and not a lack of a fixed rate.
examples:
- The irregularity in the shape of the stone made its two sides look quite different.
- An irregularity in the pattern on the floor broke up the even lines.
