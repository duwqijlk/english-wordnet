simpleMeaning: The tongue of the Slavs into which the Bible was put in the 800s.
scope: This is the tongue of the Slavs into which the Bible was put in the 800s; Church Slavic language,
  Old Bulgarian, Old Bulgarian language, Old Church Slavic, Old Church Slavic language, Old Church Slavonic
  and Old Church Slavonic language are other names for it, not a modern Slav tongue and not the tongue
  the Bible was first written in.
