simpleMeaning: a kind of drug that can break up lumps of blood that block the flow of blood to the heart
  muscle
scope: A drug that breaks up blood lumps blocking blood flow to the heart, not a drug that stops blood
  from clotting and not a painkiller.
examples:
- The doctor gave him a clot buster to clear the blockage in his heart.
- A clot buster can break up the clot that is blocking blood to the heart muscle.
