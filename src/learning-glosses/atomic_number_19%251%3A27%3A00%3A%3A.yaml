simpleMeaning: A light soft silver-white metal of the alkali group, dulling fast in air and reacting fiercely
  with water; abundant in nature in mixed forms, in sea water, carnallite, kainite, sylvite.
scope: 'Also called K and potassium: a light soft silver-white metal of the alkali group, not a hard metal.'
examples:
- Atomic number 19 reacts fiercely when it touches water.
- Potassium, atomic number 19, is found in sea water.
