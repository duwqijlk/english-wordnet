simpleMeaning: A cycad of south-eastern India with long feathery leaves.
scope: A cycad of south-eastern India with long feathery leaves, also called false sago; not a true palm
  and not a plant with soft divided leaves.
examples:
- The fern palm grew in the botanic garden.
- A fern palm stood beside the path, its long leaves arching over it.
