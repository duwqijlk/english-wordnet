simpleMeaning: a bush-like plant that grows in salty marsh land of eastern and south-central North America
  and the West Indies; its fruit is ringed with white feathery hairy tufts
scope: Also called consumption weed, cotton-seed tree, and groundsel bush; a shrub of salt marshes, not
  a garden shrub of dry land.
examples:
- A groundsel tree stood at the edge of the salt marsh.
- The fruit of the groundsel tree was ringed with white tufts.
