simpleMeaning: of a leaf with small leaves set in a row on each side of a stalk, with two of them at the
  tip
scope: 'Also called abruptly-pinnate and paripinnate: of a leaf with two small leaves at its tip, not
  of a leaf with one small leaf at its tip and not of a leaf with no small leaves at all.'
examples:
- The even-pinnate leaf has a pair of small leaflets at its tip.
- Botanists call a leaf even-pinnate when two leaflets meet at the very top.
