simpleMeaning: to put things in one after another in turn, as with covers set between the pictures in
  a book to keep them safe
scope: To put things in one after another in turn, as with covers set between the pictures in a book to
  keep them safe; not to shuffle cards and not the computer sense of spacing sectors on a disk.
examples:
- Binders interleave sheets of tissue between the plates.
- Please interleave the blank pages with the printed ones.
