senseId: 'rubber_eraser%1:06:00::'
synsetId: 04123606-n
simpleMeaning: Marks come off with a piece of stretchy stuff, or of man-made stuff much like it, often
  set on the end of a pencil.
scope: Rubber and pencil eraser are other names for this piece of stretchy stuff, or of man-made stuff
  much like it, which rubs out marks and is often set on the end of a pencil.
examples:
- The rubber eraser on the end of her pencil rubbed out the wrong word.
- He used the rubber eraser to rub out the mark.
