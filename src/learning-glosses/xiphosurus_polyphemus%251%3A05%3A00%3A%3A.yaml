simpleMeaning: A large sea animal off North America's Atlantic coast, with a domed shell like a horseshoe
  and a stiff pointed tail; a living fossil kin to the wood louse.
scope: A large sea animal of the Atlantic coast, also called horseshoe crab, king crab, and Limulus polyphemus;
  not a true crab and not other sea animals with tails.
examples:
- Xiphosurus polyphemus crawls on the Atlantic shore in spring.
- The shell of Xiphosurus polyphemus is shaped like a horseshoe.
