simpleMeaning: A liquid made from a paste of ground seeds, thinned with vinegar and plant oil, with sugar
  and spices mixed in.
scope: A liquid served with food, not the plain ground-seed paste it is made from and not a sweet sauce.
examples:
- She mixed the mustard sauce into the potato salad.
- He put a spoonful of mustard sauce on his sandwich.
