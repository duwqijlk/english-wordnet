simpleMeaning: In electronics, of a circuit or a device whose output changes in step with what goes into
  it
scope: In electronics, of a circuit or device whose output follows its input, not of a line and not of
  a first-degree equation.
examples:
- The shop sells a linear amplifier for clear sound.
- A linear device gives out a signal that keeps step with the signal going in.
