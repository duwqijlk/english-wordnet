simpleMeaning: a coat worn over the shoulders by a soldier on horseback
scope: A coat worn over the shoulders by a soldier on horseback, also called a dolman jacket, and not
  a cloak for a woman and not a coat worn in the usual way.
examples:
- The hussar's dolman hung over his shoulders as he rode past.
- He threw his dolman over his shoulders before the parade.
