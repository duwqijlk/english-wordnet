senseId: 'disappointingly%4:02:00::'
synsetId: 00314318-r
simpleMeaning: in a way that leaves people unhappy because something is not as good as they hoped it would
  be
scope: This tells how a thing is done or how it turns out when it is not as good as people hoped. It is
  not the word for the unhappy feeling itself, and not the verb for making someone feel that way.
examples:
- The team played disappointingly in the second half.
- The new phone sold disappointingly in its first month.
