simpleMeaning: To show that you know a person or a thing is there, as by a word or a smile
scope: 'Also called notice: to show you know a person or a thing is there, not to say a thing is true
  and not to take a paper as good in law.'
examples:
- He never acknowledged his colleagues when they met in the hallway.
- She acknowledged his compliment with a smile.
