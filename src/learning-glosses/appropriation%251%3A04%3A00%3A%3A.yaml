simpleMeaning: Taking a thing for oneself on purpose, often with no leave from its owner.
scope: Taking a thing for oneself on purpose, often with no leave from its owner, not the joining of one
  thing to another.
examples:
- The government's appropriation of the land angered the farmers.
- His appropriation of her ideas passed without a word of thanks.
