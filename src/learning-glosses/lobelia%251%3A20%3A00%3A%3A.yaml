simpleMeaning: any plant or flower that belongs to one group of plants that are close to each other in
  kind
scope: Any plant or flower in this one group of plants. It is the plant itself, not a medicine made from
  a plant and not a different kind of garden flower.
examples:
- She planted lobelia along the edge of the garden path.
- The lobelia in the pot has many small flowers.
