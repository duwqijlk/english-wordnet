simpleMeaning: Its thin peel comes off easily, and the fruit inside is small, flat, and red-gold; it comes
  from China.
scope: Also called mandarin, it is the loose-skinned citrus of China, flat in shape with a red-gold skin.
examples:
- She peeled a mandarin orange and ate it in two bites.
- The mandarin oranges in the bowl were flat and easy to peel.
