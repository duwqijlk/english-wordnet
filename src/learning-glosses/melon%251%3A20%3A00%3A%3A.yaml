simpleMeaning: any of several kinds of fruit that grow on a vine of the gourd family, cucumbers among
  them
scope: A kind of vine fruit, not the gourd fruit with a hard rind and sweet juicy flesh.
examples:
- She sliced a melon for the fruit salad.
- This melon came from a vine in the garden.
