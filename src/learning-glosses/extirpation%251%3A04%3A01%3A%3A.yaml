simpleMeaning: to get rid of a thing for good by pulling it up and out by its roots, so that it no longer
  exists
scope: 'Also called excision and deracination: getting rid of a thing for good by pulling it up by its
  roots, not merely trimming it back and not simply moving it to another place.'
examples:
- The extirpation of the weed took hours of digging.
- Extirpation of the disease required removing every last trace of it.
