simpleMeaning: a serving of drink, usually with alcohol in it, drawn from a big barrel
scope: A serving of drink drawn from a keg; draft is another name for this sense. Not how deep a ship
  sits in the water, and not the act of pulling a load.
examples:
- They served beer on draught at the pub.
- He ordered a draught of ale from the keg.
