senseId: 'impaction%1:26:01::'
synsetId: 14084057-n
simpleMeaning: Waste from the body gets stuck and hard in the lower part of the gut, and will not come
  out
scope: A health problem in which body waste stays stuck in the lower gut; not a hard hit between two things
  and not a tooth stuck in its socket.
examples:
- The doctor treated the impaction with medicine to soften the waste.
- Long bed rest can lead to impaction in older patients.
