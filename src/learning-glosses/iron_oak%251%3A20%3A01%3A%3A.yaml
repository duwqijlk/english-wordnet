simpleMeaning: A small leaf-shedding oak of the eastern and central US, with dark green lyre-shaped feather-cut
  leaves and tough waterproof wood for fence posts above all
scope: Also called box white oak, brash oak, and post oak, this leaf-shedding oak is not the evergreen
  iron oak of the southwest.
examples:
- The fence posts were cut from iron oak.
- An iron oak sheds its leaves in the cold months.
