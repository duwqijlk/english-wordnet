simpleMeaning: a measure of how big one amount is compared with another, got by dividing the first by
  the second
scope: This is the dividing sense in maths; it is not the number you get by adding, taking away or multiplying
  amounts.
examples:
- If you divide 10 by 2, the quotient is 5.
- The quotient of 12 and 3 is 4.
