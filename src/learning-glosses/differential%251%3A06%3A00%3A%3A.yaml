simpleMeaning: A cone-shaped gear that lets two shafts turn at different speeds, fitted on a car's rear
  axle so the wheels can turn at different rates around a bend.
scope: The car part, also called a differential gear; not the mathematical derivative and not a quality
  that sets two things apart.
examples:
- The differential lets the rear wheels turn at different speeds as the car rounds a corner.
- He heard a whine from the differential and knew the rear axle needed work.
