simpleMeaning: to put smoke or gas into or over a place or thing, especially to kill germs or to get rid
  of insects and other harmful small animals
scope: 'Also called fume: using smoke or gas on a place or thing to kill germs or get rid of harmful insects
  or animals; not just making smoke in the air.'
examples:
- Workers fumigated the empty rooms to kill the insects living in the walls.
- The farmer fumigated the store room before putting the grain in it.
