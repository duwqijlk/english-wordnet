simpleMeaning: to bake food in a sauce, in milk, or in another liquid like those, often with small pieces
  of bread on top
scope: This is a way of cooking food in the oven; it is not the sea animal of the same name and not a
  thin slice of meat.
examples:
- She scalloped the potatoes in milk, with breadcrumbs on top.
- He scalloped the fish in a white sauce for dinner.
