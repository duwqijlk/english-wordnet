simpleMeaning: An infection usually passed on through sex, caused by a virus called HSV-2; it brings repeated
  bouts of painful sores on the skin and mucous membranes around the sex organs.
scope: An infection of the sex organs that keeps coming back, not the cold-sore form; herpes genitalis
  is another name for it.
examples:
- She was diagnosed with genital herpes after the first outbreak of sores.
- Genital herpes can be managed with antiviral medicines, though it may return.
