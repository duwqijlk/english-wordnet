simpleMeaning: A part of a sentence that tells why something is done, and can start with words such as
  in order that or lest
scope: A part of a sentence that tells why something is done, and can start with words such as in order
  that or lest; not a part that tells when something happens and not a part that names a thing.
examples:
- The final clause showed the purpose of the trip.
- In the sentence, the final clause began with in order that.
