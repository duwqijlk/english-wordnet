simpleMeaning: In a wild, restless way, as if a bad spirit had taken hold of the person.
scope: In a wildly agitated way, as if driven by a bad spirit, not in calm or steady haste.
examples:
- He worked frenetically through the night to finish the report.
- The crowd searched frenetically for the lost child.
