simpleMeaning: A plant of tropical Asia that lives for one year, grown for its small heads of scarlet
  flowers shaped like tassels.
scope: A plant of tropical Asia grown for its scarlet tassel-like flower heads, also called the tassel
  flower; not a tree and not a plant grown for food.
examples:
- Emilia sagitta flowered scarlet in the warm garden.
- We grew Emilia sagitta for its small tassel-shaped heads.
