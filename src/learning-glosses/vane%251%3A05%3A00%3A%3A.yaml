simpleMeaning: The flat part of a feather, made of many thin parts joined together, growing on each side
  of the middle stem
scope: This is the flat part of a feather, also called a web, not a fin on the tail of an arrow and not
  a device that turns to show the direction of the wind.
examples:
- The feather's vane was soft, wide, and bright green.
- A bird's vane is made of many thin parts joined together.
