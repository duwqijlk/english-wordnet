simpleMeaning: any of the kinds of cattle that live free, most of all the kind called Bos and the closely
  related Bibos
scope: 'Another name for ox: a kind of cattle that lives free, not a tame farm animal and not a buffalo.'
examples:
- A wild ox grazed on the far side of the plain.
- The herd of wild ox moved slowly through the tall grass.
