simpleMeaning: to do with the weight of the air, or shown by a barometer, a tool that measures the weight
  of the air
scope: 'Also called barometrical: to do with the weight of the air or what a barometer shows, not a measure
  of heat or of wind.'
examples:
- The barometric pressure fell before the storm.
- She checked the barometric reading on the wall.
