senseId: 'superheterodyne_receiver%1:06:00::'
synsetId: 03522159-n
simpleMeaning: A radio that mixes a wave made close by into the wave that carries it, yielding a wave
  past hearing, which is then split up and raised in sound.
scope: This sense is also called heterodyne receiver and superhet.
examples:
- A superheterodyne receiver mixes two waves.
- Superheterodyne receivers make waves louder.
