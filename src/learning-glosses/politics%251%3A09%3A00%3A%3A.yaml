simpleMeaning: the academic study of how states and other organized communities are governed
scope: This is the academic subject, not the career of governing, not the activities of running a state,
  not a person's opinions on public questions, and not intrigue used to gain power.
examples:
- She studied politics at university.
- His degree in politics led to a job in the civil service.
