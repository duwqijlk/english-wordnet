simpleMeaning: A group within the order Therapsida, from the Triassic period, of small meat-eating four-legged
  reptiles, often with teeth like those of mammals.
scope: Also called division Cynodontia; among Triassic reptiles, this is the small meat-eating four-legged
  group with teeth like those of mammals, beside other Therapsida groups and early mammals.
examples:
- Cynodontia lived in the Triassic period.
- The Cynodontia were small meat-eating reptiles.
