simpleMeaning: A sweet-tasting liquid that can poison, thick like syrup, used to keep engines from freezing
  and to dissolve other things.
scope: Also called ethanediol or ethylene glycol, a sweet-tasting liquid that can poison, thick like syrup,
  used to keep engines from freezing and to dissolve other things; not any alcohol of the class with two
  oxygen-and-hydrogen parts in each molecule.
examples:
- Glycol keeps the car engine from freezing in winter.
- The mechanic poured glycol into the radiator.
