simpleMeaning: a machine or set of parts that picks up radio or television signals so you can hear or
  watch them
scope: A machine that picks up radio or television signals. Not the tennis player who takes the serve,
  and not a person who simply gets something.
examples:
- He bought a new receiver so he could listen to radio stations from far away.
- The receiver on the shelf picks up television signals for the small screen next to it.
