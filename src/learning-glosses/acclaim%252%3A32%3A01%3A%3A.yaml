simpleMeaning: to hit your hands together or call out after a show to show you liked it
scope: To clap and call out after a show to show you liked it, also called spat, clap, and applaud, not
  simply liking something in silence.
examples:
- The crowd rose to acclaim the dancers at the end of the show.
- She was acclaimed by the audience after her fine song.
