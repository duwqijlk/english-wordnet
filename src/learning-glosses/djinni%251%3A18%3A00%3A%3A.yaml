simpleMeaning: In Islam, an unseen being named in the Koran that lives on earth and can take the form
  of a person or an animal to act on people
scope: Muslims also call this unseen spirit of Islam jinnee, genie, djinn, djinny, and jinni.
examples:
- In the story, a djinni appeared as an old man.
- Muslims believe a djinni can take the shape of an animal.
