simpleMeaning: a test that finds the age of once-living things from a rare kind of atom in them, trusted
  back about 40,000 years
scope: A test that finds the age of once-living things from a rare kind of atom in them, trusted back
  about 40,000 years; carbon-14 dating and radiocarbon dating are other names for this sense, not a guess
  from style and not a test of rocks.
examples:
- Carbon dating put the cloth at 2,000 years old.
- Archaeologists used carbon dating to date the burial.
