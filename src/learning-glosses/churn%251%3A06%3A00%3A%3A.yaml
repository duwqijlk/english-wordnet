simpleMeaning: a container in which cream is shaken hard so the fat part comes out to make butter and
  thin milk is left
scope: The container used to make butter, not the act of shaking cream to make butter.
examples:
- She put the cream into the churn and pushed the handle up and down.
- The old wooden churn stood in the corner of the farm kitchen.
