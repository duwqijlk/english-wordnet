simpleMeaning: The act or course of events by which tiny thread-like fibres come into being.
scope: The forming of tiny thread-like fibres, not the twitching of single muscle fibres that act without
  working together.
examples:
- Fibrillation of the protein was seen under the microscope as thin threads formed.
- The lab tracked fibrillation as the solution slowly formed fine fibres.
