simpleMeaning: a plant that grows in America and has yellow flowers
scope: Also called butterweed, this American plant has yellow flowers; it is not the widespread European
  weed kind with yellow flowers like small daisies.
examples:
- Ragwort with bright yellow flowers grew in the wet field in Ohio.
- The farmer found American ragwort growing near the stream.
