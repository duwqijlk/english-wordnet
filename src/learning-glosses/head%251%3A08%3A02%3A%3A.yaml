simpleMeaning: the part of a muscle attached to the skeleton that lies away from the bone the muscle moves
scope: This is not a bone and not the body part above the neck; it is one end of a muscle.
examples:
- The diagram labels the two heads of the biceps muscle.
- A strain near the head of the calf muscle kept him out of the race.
