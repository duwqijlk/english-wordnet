simpleMeaning: a state, or a thing that happens, that we know through what we see, hear, touch, smell,
  or taste, rather than by a hunch or by working it out
scope: A thing or state known through the senses, not a guess from thought and not a thing known only
  by a hunch.
examples:
- Rain is a natural phenomenon we can see and feel.
- Scientists study the phenomenon of lightning to learn how it works.
