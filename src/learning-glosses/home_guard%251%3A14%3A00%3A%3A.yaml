simpleMeaning: While the army fights far away, this group of people who give their time freely keeps its
  own land safe
scope: A group of unpaid helpers who keep their own land safe while the army fights elsewhere, not soldiers
  of the regular army and not a group that fights abroad.
examples:
- He joined the home guard to watch over the town.
- The home guard trained on weekends while the army was away.
