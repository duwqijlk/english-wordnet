simpleMeaning: Any shrub or small tree with leaves in rings and flowers in branching clusters; it yields
  medicines used especially to cause vomiting, loosen the bowels or lower high blood pressure.
scope: Another name for rauwolfia, the same shrub or small tree; the plant itself, not the medicines obtained
  from it.
examples:
- Rauvolfia grows as a shrub or small tree, with leaves set in rings around the stem.
- People have used substances from rauvolfia to cause vomiting or to lower blood pressure.
