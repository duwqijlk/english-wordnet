scope: A big catfish from the middle of the United States, with a flat head and a jaw that sticks out;
  flathead catfish, goujon, mudcat, shovelnose catfish and spoonbill catfish are other names for it, not
  other catfish of the south or the coast.
examples:
- The Pylodictus olivaris lay on the river bed, its flat head just above the mud.
- Anglers catch Pylodictus olivaris in the rivers of the central United States.
