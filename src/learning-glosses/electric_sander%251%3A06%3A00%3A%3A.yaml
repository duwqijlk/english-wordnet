simpleMeaning: a power tool for making wood smooth, in which a ring of rough paper moves fast round and
  round by power from a motor
scope: A power tool for making wood smooth, also called smoother, sander and drum sander; not a hand plane
  and not a saw.
examples:
- He used the electric sander to smooth the table top.
- The electric sander moved its loop of sandpaper at high speed.
