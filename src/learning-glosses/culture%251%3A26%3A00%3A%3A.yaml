simpleMeaning: a very advanced condition of complete excellence, with a quality that has no faults at
  all
scope: This is not the customs, arts or way of life of a group, but a high level of personal refinement.
examples:
- The old professor was a man of great culture and exquisite taste.
- Her prose shows culture and polish rare among young writers.
