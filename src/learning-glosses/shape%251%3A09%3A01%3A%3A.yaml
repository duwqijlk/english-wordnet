simpleMeaning: a physical image or symbol that gives visible form to a vague idea
scope: This is a tangible stand-in for an abstract idea, not the outline or spatial form of an object.
examples:
- The circle was the shape he gave to the idea of eternity.
- For the monks, the mandala was the shape of the divine.
