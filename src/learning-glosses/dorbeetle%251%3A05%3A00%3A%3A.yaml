simpleMeaning: a beetle from Europe, Asia and Africa that feeds on dung and flies with a low humming sound
scope: A beetle from Europe, Asia and Africa that feeds on dung and flies with a low humming sound, and
  not a beetle that eats leaves or one that cannot fly.
examples:
- A dorbeetle flew past with a low droning hum.
- The farmer watched a dorbeetle rolling dung across the field.
