simpleMeaning: Kindness and soft treatment shown to law-breakers by those who hand out punishment
scope: Kindness and soft treatment of law-breakers by those who hand out punishment; mercy and clemency
  are other names for this, not harsh punishment and not letting a law-breaker go free.
examples:
- The judge showed mercifulness to the young offender.
- Her mercifulness saved him from a hard sentence.
