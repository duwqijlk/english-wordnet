simpleMeaning: in a way that does not draw attention to you or get in the way of others
scope: This is about doing something or being somewhere without being noticed much; it is not about being
  loud or standing out so that everyone sees you, and not about staying completely hidden so that no one
  knows you are there.
examples:
- The waiter stood unobtrusively near the wall, ready to help if needed.
- Messengers moved unobtrusively through the crowd, and few people noticed them.
