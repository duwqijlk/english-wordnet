simpleMeaning: The system of law courts that hear cases and decide what is just. Together they form one
  part of government.
scope: 'Also called judicatory, judicature, and judicial system: the whole system of law courts in a country,
  not a single court and not the part of government that makes laws.'
examples:
- The judiciary must stay free from control by the government.
- People trust the judiciary to hear cases in a fair way.
