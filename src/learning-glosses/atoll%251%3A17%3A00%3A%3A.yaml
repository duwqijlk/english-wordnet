simpleMeaning: An island that is a round ring of coral around shallow sea water in the middle
scope: This is an island made in a ring shape from coral, with water in the middle. It is not a single
  high island of rock and not a reef under the sea alone.
examples:
- The small plane landed on an atoll in the Pacific.
- From the air, the atoll looked like a green ring around blue water.
