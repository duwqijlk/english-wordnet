simpleMeaning: In medicine, being too ready to react when a part of the body is touched or stirred
scope: In medicine, a body part too ready to react when touched or stirred, not anger and not a feeling
  of annoyance.
examples:
- The irritation of her skin made her scratch all day.
- Irritation of the stomach followed every meal.
