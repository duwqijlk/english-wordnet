simpleMeaning: A modified form of salicylic acid; a medicine usually taken as tablets that eases pain,
  swelling and fever and slows clotting by blocking platelets, the particles that help blood thicken.
scope: The drug itself, not a particular brand of it or the chemical name acetylsalicylic acid.
examples:
- She took two aspirin and lay down until the headache eased.
- His doctor suggested a daily low dose of aspirin to protect his heart.
