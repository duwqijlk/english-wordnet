simpleMeaning: Thread-like stuff from the leaves of a tree of the same name, used to weave mats and other
  things
scope: Fiber from the leaves of a tree of the same name, used for weaving, not the tree itself and not
  fiber from other plants.
examples:
- The pandanus fiber was woven into a mat for the floor.
- They made baskets from pandanus, dried in the sun.
