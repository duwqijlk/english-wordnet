simpleMeaning: A doctor, above all one still in training, who lives in a hospital and looks after patients
  there, guided by the medical staff.
scope: A doctor who lives in a hospital and cares for patients there under the medical staff, not a visiting
  consultant; resident is another name for this sense.
examples:
- The house physician checked on her patients through the night.
- As a house physician, he lived in a small room near the ward.
