simpleMeaning: the top layer of ground, made of thick grass and the roots of the grass below it
scope: This is the top layer of ground with grass on it, also called sod, turf, and sward; it is not loose
  soil with no grass on it.
examples:
- The greensward in front of the house stayed green all summer.
- She sat on the soft greensward and read a book.
