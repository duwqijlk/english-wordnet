simpleMeaning: To judge or guess the kind, goodness, skill, size, or importance of something or someone
scope: To judge or guess the kind, goodness, skill, size, or importance of something; value, measure,
  assess and evaluate are other names for this sense, not to set a price and not to praise.
examples:
- I will have the family jewels appraised by a professional.
- She appraised the risk before she agreed to the plan.
