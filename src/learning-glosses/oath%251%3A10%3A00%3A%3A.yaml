simpleMeaning: A promise to tell the truth, most of all in a court of law, where a lie can lead to a charge
  of lying in court
scope: A promise to tell the truth, not a solemn promise about future acts and not a rude word said in
  anger.
examples:
- She swore an oath to tell the whole truth in court.
- The witness took an oath before he spoke.
