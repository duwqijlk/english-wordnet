simpleMeaning: too little blood gets to the muscles of the heart, and this can cause angina pectoris,
  a pain in the chest
scope: This is too little blood reaching the heart muscle, also called cardiac insufficiency, and not
  a heart attack and not a blocked vessel.
examples:
- His coronary insufficiency left him short of breath when he climbed the stairs.
- Coronary insufficiency can bring on a sharp pain in the chest.
