simpleMeaning: understood or sensed only in a blurred, uncertain way
scope: About ideas or feelings grasped dimly, not things that look blurred or a loss of consciousness.
examples:
- I haven't the faintest idea where she went.
- She had a faint suspicion that someone had followed her.
