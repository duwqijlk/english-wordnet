simpleMeaning: a fence made of upright pickets (thin boards that stand up straight and have pointed tops)
scope: A fence made of many upright boards, not one board on its own and not a solid wall.
examples:
- The small garden was shut in by a white paling.
- They put up a paling to keep the dog in the yard.
