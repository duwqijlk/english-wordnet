simpleMeaning: Full of sorrow for the wrong things you have done, and showing it in your face or words.
scope: Sorrowful for wrongs done, shown in face or words, not merely sad and not merely sorry for a loss.
examples:
- He gave a rueful smile when he told of his mistake.
- She looked rueful after lying to her friend.
