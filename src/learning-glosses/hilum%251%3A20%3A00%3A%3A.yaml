simpleMeaning: The scar on some seeds showing where the seed was joined to its stalk.
scope: The scar on some seeds where the seed was joined, not the hollow where tubes enter an organ.
examples:
- You can see the hilum as a small mark on the bean.
- The hilum shows where the seed was joined to its stalk.
