simpleMeaning: A quality in a person that wins them a warm welcome, a yes, or a place
scope: 'Also called a passport: a quality in a person that wins them a welcome, not a word that speaks
  well of someone and not a plan put forward as wise.'
examples:
- Her pleasant manner was a recommendation in itself.
- His good name was a recommendation that opened every door.
