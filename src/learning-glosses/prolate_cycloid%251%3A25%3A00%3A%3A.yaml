simpleMeaning: A curve drawn by a point outside a rolling wheel
scope: A curve made by a point outside a rolling wheel; not the curve made by a point on the wheel itself.
examples:
- The point outside the wheel traced a prolate cycloid.
- Her diagram showed a prolate cycloid made by a point beyond the rim.
