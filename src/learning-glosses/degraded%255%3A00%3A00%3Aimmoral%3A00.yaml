simpleMeaning: not held back by the usual rules of society or by ideas of what is right and wrong
scope: Also called fast, dissipated, riotous, degenerate, debauched, profligate, dissolute and libertine.
  This sense is about living with no control from ideas of right and wrong, not about being made worse
  or lower in quality.
examples:
- The book shows a degraded rich man who drinks all day and cares for no one.
- His degraded life of wild parties shocked the town.
