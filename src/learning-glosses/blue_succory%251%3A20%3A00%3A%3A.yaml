simpleMeaning: a plant from southern Europe with flowers whose flat petals are the colour of a clear sky,
  each with a dark centre
scope: 'Also called cupid''s dart: a plant from southern Europe whose flowers have flat sky-coloured petals
  and a dark centre, not a chicory plant grown for its roots and not a bluebell.'
examples:
- Blue succory grows wild on the dry hills of southern Europe.
- The blue succory opened its flat blue flowers in the morning sun.
