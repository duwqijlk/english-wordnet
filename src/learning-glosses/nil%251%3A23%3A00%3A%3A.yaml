simpleMeaning: an amount of no importance, meaning no thing at all and not any one thing exists
scope: Also called nothing, zero, zip, naught, aught, cipher, nix, nada, null, cypher, zilch, goose egg
  and zippo. This means no amount at all, not a small but real amount.
examples:
- The score was nil for both teams after the first half.
- His chances of help were nil, so he did the work alone.
