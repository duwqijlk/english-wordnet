simpleMeaning: a small but clear liking for one side more than the other
scope: This is a small liking for one side more than the other, not a slope away from upright and not
  an angry fight in words.
examples:
- The judge showed a clear tilt toward the rich man in the case.
- Her tilt in favour of her own team showed in every choice she made.
