simpleMeaning: a weak liquid that breaks down easily, found only in a mix or in its salts, used to make
  things white and to change other substances by adding oxygen
scope: A weak liquid found only in a mix or in its salts, used to whiten things and to change other substances
  by adding oxygen, not a strong acid and not a salt on its own.
examples:
- The worker used hypochlorous acid to whiten the cloth.
- Hypochlorous acid breaks down quickly on its own.
