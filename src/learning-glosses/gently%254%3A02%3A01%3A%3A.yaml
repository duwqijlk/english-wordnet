simpleMeaning: in a mild and careful way
scope: This is acting in a mild, careful manner, for which mildly is another name, not doing something
  gradually and not using only slight physical force.
examples:
- She spoke gently to the frightened child.
- He gently reminded her to lock the door before leaving.
