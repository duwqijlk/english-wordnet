simpleMeaning: a machine that turns raw dough into balls of one weight and shape, by cutting it into small
  bits and rolling each bit
scope: Also called a bun rounder, this is the machine that turns raw dough into balls of one weight and
  shape.
examples:
- The bun divider cut the dough into small bits and rolled each one into a ball.
- With the bun divider, the baker made balls of dough that all weighed the same.
