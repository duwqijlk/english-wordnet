simpleMeaning: This vine of the East Indies has no leaves, and people once made a drink that makes them
  drunk from its sour white juice.
scope: People also call it haoma, and it is a leafless vine of the East Indies.
examples:
- They gathered soma for its juice.
- Soma juice was once made into a strong drink.
