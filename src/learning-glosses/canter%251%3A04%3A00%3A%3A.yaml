simpleMeaning: a horse's smooth way of moving in three beats, faster than a trot and slower than a gallop
scope: 'Also called lope: a horse''s smooth three-beat pace between a trot and a gallop, not the act of
  riding at that pace.'
examples:
- The horse broke into a canter across the field.
- She rode at a steady canter along the track.
