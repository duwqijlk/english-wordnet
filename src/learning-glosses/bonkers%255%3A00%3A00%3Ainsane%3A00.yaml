simpleMeaning: in informal or slang talk, describes a person whose mind does not work in a normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, haywire, loony, barmy, loco and kooky: this is a loose word for a mind not working in a normal
  way. It is loose talk, not a doctor''s serious word for an illness of the mind.'
examples:
- He went a bit bonkers after working three nights without sleep.
- Everyone thought he was bonkers to talk to his car all day.
