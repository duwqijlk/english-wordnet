simpleMeaning: Using power one usually has no good right to use, or acting sure of oneself in a rude way
scope: 'Also called autocratic, bossy, dominating, magisterial and peremptory: either rude and sure of
  oneself, or using power one usually has no good right to use, not merely proud and not merely firm in
  giving orders.'
examples:
- His high-and-mighty manner put off everyone in the room.
- She spoke in a high-and-mighty tone, ordering us about.
