senseId: 'canker%1:26:01::'
synsetId: 14302919-n
simpleMeaning: A sickness of trees and other woody plants, brought on by a fungus, that eats away at one
  patch of bark.
scope: Of a sickness of trees and other woody plants, brought on by a fungus, that eats away at one patch
  of bark, not a malign influence that is hard to get rid of, not a sore in the mouth, and not the verb
  senses of infecting or becoming infected.
examples:
- Canker had eaten into the bark of the old apple tree.
- The gardener cut out the canker before it spread.
