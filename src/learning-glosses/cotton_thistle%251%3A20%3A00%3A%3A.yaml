simpleMeaning: Pale purple flowers grow on this white, hairy plant from Europe and Asia, which lives for
  two years and now grows wild in North America.
scope: 'Also called woolly thistle: a white, hairy plant from Europe and Asia with pale purple flowers,
  now growing wild in North America, not a thistle grown in gardens.'
examples:
- The cotton thistle in the field had pale purple flowers.
- Cotton thistles now grow wild across North America.
