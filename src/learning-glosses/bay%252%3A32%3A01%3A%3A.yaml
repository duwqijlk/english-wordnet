simpleMeaning: To call or say something in low, deep sounds that are held for a long time.
scope: This is the general verb for making a deep, drawn-out sound — of a crowd, a person's voice or an
  animal — rather than the commoner verb 'bay', which is used specifically of dogs barking with prolonged
  noises. It is rare and literary, appearing mostly in older writing. It has nothing to do with the coastal
  inlet or the evergreen shrub, which are separate noun senses.
examples:
- The hounds bayed a long, low note that carried across the fields.
- The crowd bayed at the gates until the doors finally opened.
