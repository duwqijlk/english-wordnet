simpleMeaning: Made-up or holy books say this spot is real, but it lives only in the mind
scope: 'Also called a fictitious place or an imaginary place: a spot that lives only in the mind, not
  a real spot and not a spot seen in a dream.'
examples:
- Shangri-La is a mythical place that lives only in stories.
- They searched for the mythical place described in the old book.
