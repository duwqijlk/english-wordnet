simpleMeaning: turned or moving toward the center or toward the inside
scope: This sense is about pointing or moving toward the center, not about moving away from the center
  and not about feelings that stay inside a person and are not shown.
examples:
- The inward pull of the water drew the boat toward the middle.
- The door has an inward swing, so it opens into the small room.
