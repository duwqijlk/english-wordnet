simpleMeaning: from the throat and voice box down through the lungs and heart to the food pipe, stomach,
  and most belly organs, one nerve does two kinds of work
scope: 'Also called nervus vagus, pneumogastric, pneumogastric nerve, tenth cranial nerve, vagus, and
  wandering nerve: a single nerve doing two kinds of work for parts from throat to belly, not a nerve
  of the hand and not a nerve of the spine.'
examples:
- The vagus nerve carries signals between the brain and the stomach.
- Doctors can calm the heart by working on the vagus nerve.
