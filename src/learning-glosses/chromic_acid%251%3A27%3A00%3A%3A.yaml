simpleMeaning: a substance that breaks down fast, known only when mixed in water or in the form of its
  salts
scope: A substance that breaks down fast and is known only when mixed in water or as its salts, not a
  strong acid kept on its own and not a solid salt used by itself.
examples:
- Chromic acid cannot be kept on its own, so the lab made it fresh.
- The chromic acid stayed in its bottle only because it was mixed in water.
