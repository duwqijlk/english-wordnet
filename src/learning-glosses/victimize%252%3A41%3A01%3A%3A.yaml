simpleMeaning: to make someone suffer harm, loss, or unfair treatment
scope: To harm, cheat, or use a person in an unfair way so they suffer; it is not just being unkind in
  words and not a fair punishment.
examples:
- The con man victimized older people by taking their savings.
- She felt victimized by the group that spread lies about her.
