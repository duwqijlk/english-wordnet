simpleMeaning: 'a game of chance played with cards: numbered balls are picked out at random, and players
  mark off the numbers on their cards as they come up'
scope: A game of chance with numbered balls and cards, not a card game like poker and not a lottery draw.
examples:
- We played bingo at the village hall on Friday night.
- She shouted 'Bingo!' when she covered the last number on her card.
