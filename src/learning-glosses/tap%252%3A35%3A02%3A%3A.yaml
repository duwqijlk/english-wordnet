simpleMeaning: to cut a spiral groove inside a hole, so a screw can be turned into it, using a special
  tool made for this
scope: Cutting the groove inside a hole so a screw fits; not the tool itself, not secretly listening to
  a phone line, and not asking someone hard for money.
examples:
- He tapped the hole in the metal plate before fitting the bolt.
- The worker tapped each hole so the screws would go in easily.
