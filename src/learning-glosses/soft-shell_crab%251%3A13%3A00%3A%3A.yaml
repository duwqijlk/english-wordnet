simpleMeaning: A sea creature just out of its old hard cover, with its new cover still tender and bendy
scope: A sea creature just out of its old hard cover, with its new cover still tender and bendy; also
  called soft-shelled crab; not a hard-covered sea creature, and not a sea creature with its old cover
  still on.
examples:
- Soft-shell crabs are eaten whole, cover and all.
- The soft-shell crab had just shed its old cover.
