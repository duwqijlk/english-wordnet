simpleMeaning: a bomb set off in an oil well or a gas well to start oil or gas coming out, or to make
  more come out
scope: This is a bomb used in an oil or gas well, not the underwater weapon of the same name, not the
  warning bomb on a railroad track, and not a large sandwich.
examples:
- The workers set off a torpedo in the oil well to start the flow.
- A torpedo was used in the gas well to make more gas come out.
