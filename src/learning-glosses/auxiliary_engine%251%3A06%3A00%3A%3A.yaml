simpleMeaning: In ships, a small motor on board used to turn a windlass, a wheel that pulls up the anchor
scope: 'Also called a donkey engine: a small motor on a ship that works the anchor wheel, not the ship''s
  main motor and not a motor used on land.'
examples:
- The auxiliary engine turned the windlass and raised the anchor.
- The crew started the auxiliary engine to lift the anchor chain.
