simpleMeaning: In the New Testament, the time at the end of the world, after Armageddon, when God will
  judge each person by the good and evil of their life on earth
scope: The end of the world in the New Testament, also called doomsday, Doomsday, crack of doom, day of
  reckoning, end of the world, eschaton, Day of Judgement, Day of Judgment, Judgement Day, Judgment Day,
  Last Day and Last Judgment; not an ordinary day of judgment by people.
examples:
- At the Last Judgement, God will judge every person.
- The painting shows the Last Judgement at the end of time.
