senseId: 'unvoiced%3:00:00::'
synsetId: 02294026-a
simpleMeaning: Made with no stir of the throat-cords.
scope: This sense is also called hard, voiceless, and surd, for being made with no stir of the throat-cords,
  where hard is a speech sound made without the vocal cords vibrating, and surd is made without shaking
  of the voice-cords.
examples:
- The sound was unvoiced, made with no stir of the throat-cords.
- The letter was unvoiced, made with no stir.
