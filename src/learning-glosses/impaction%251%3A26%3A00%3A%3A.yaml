schema: oewn-learning-gloss-v2
senseId: 'impaction%1:26:00::'
synsetId: 14083899-n
simpleMeaning: a problem in which a biting part is so crowded in its socket that it cannot come through
  in the normal way
scope: A problem where a tooth cannot come through because its socket is too tight; impacted tooth is
  another name for this sense, not a loose tooth and not a broken tooth.
examples:
- The impaction kept the tooth from coming through.
- Impaction of the tooth needed the dentist's care.
