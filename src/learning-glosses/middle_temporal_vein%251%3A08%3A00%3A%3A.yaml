simpleMeaning: Joining the shallow blood tubes at the temple, this blood tube starts near the eye and
  ends as the blood tube behind the jaw.
scope: It runs near the eye and the temple, and joins other blood tubes to form the one behind the jaw.
examples:
- The middle temporal vein starts near the eye.
- The middle temporal vein joins the shallow blood tubes at the temple.
