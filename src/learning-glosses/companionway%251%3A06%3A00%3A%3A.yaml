simpleMeaning: steps or a ladder on a ship that take you from one deck to another
scope: A set of steps or a ladder between decks on a ship, not a ladder on land and not a lift.
examples:
- The sailors climbed the companionway to the upper deck.
- She hurried down the companionway to the lower deck.
