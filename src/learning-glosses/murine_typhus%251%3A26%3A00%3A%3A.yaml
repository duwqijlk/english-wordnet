simpleMeaning: A sudden illness brought on by rickettsia bacteria, spread when an infected flea bites
  a person, and marked by fever, chills, aching muscles and a rash.
scope: One of four interchangeable names for this flea-borne illness, alongside endemic, rat and urban
  typhus; it is not the louse-borne form or the mite-borne scrub form.
examples:
- Murine typhus is carried by fleas that live on rats and other small animals.
- He was treated for murine typhus after being bitten by fleas in the barn.
