simpleMeaning: The long muscle of the thigh and the skin and lower walls of the belly get their blood
  from this blood tube.
scope: This is a blood tube, also called the circumflex iliac artery, that feeds the lower belly wall,
  the skin there, and the long muscle of the thigh.
examples:
- The arteria circumflexa ilium supplies the skin of the lower belly.
- The arteria circumflexa ilium runs to the long muscle of the thigh.
