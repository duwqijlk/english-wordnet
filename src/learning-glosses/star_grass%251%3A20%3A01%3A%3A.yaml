simpleMeaning: Grown for lawns and grazing land, above all in the south of the United States and India,
  this creeping grass from Europe now grows in warm lands everywhere.
scope: Also called devil grass, doob, kweek, and scutch grass, it is a creeping grass from Europe, not
  the Australian kind with long spikes set out like a windmill.
examples:
- They sowed star grass on the lawn.
- Star grass spread across the pasture.
