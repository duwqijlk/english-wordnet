simpleMeaning: a change, often unwanted, in the shape of a sound wave or an analog electric wave, or the
  gap between measures of a signal going in and coming out
scope: A change, often unwanted, in the shape of a sound or an analog electric wave, or the gap between
  measures of a signal going in and coming out; not a bend in a lens, and not a twisting of what words
  mean.
examples:
- Heavy metal players use old tube amps to get extreme distortion.
- The distortion in the recording made the singer's voice sound harsh.
