simpleMeaning: From the thick end of the short loin comes this big cut of beef, with a T-shaped bone and
  a large piece of soft loin meat.
scope: This is a big cut of beef from the thick end of the short loin, also called a porterhouse, not
  a cut from the thin end.
examples:
- A porterhouse steak lay on the plate with its T-shaped bone.
- He cut into the porterhouse steak and found the soft loin meat.
