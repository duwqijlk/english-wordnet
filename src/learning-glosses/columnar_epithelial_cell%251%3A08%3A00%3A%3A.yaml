simpleMeaning: a small living unit in the thin covering layer of the body, made tall and narrow like a
  post, and some carry tiny hairs
scope: A tall, narrow living unit of the body's thin covering layer, also called a columnar cell, and
  not a flat or round cell.
examples:
- The columnar epithelial cells lining the windpipe stood tall and close together.
- A columnar epithelial cell with tiny hairs can sweep mucus out of the airways.
