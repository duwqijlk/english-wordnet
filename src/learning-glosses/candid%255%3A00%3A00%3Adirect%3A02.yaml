simpleMeaning: direct and open in the way you act or speak, without hints and without trying to hide what
  you mean
scope: 'Also called blunt, frank, forthright, outspoken, free-spoken, plainspoken and point-blank: direct
  in how you speak or act, not the sense that only means open and without secrets.'
examples:
- She gave a candid answer and said plainly that the plan was wrong.
- In a candid talk, he told us what he really thought.
