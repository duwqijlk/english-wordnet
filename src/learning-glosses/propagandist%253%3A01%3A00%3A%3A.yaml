simpleMeaning: about or showing ideas that are spread to help a cause or a government
scope: Also called propagandistic. This word describes things that spread ideas for a cause or a government;
  it is not the noun for a person who spreads such ideas.
examples:
- The newspaper ran a propagandist article praising the leader.
- They made a propagandist film to win support for the war.
