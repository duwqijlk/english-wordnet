senseId: liberalistic%5:00:00:liberal:00
synsetId: 00578036-s
simpleMeaning: believing people are good by nature and free to run their lives, and backing free rights,
  law by the people, and safety from rulers who act as they please
scope: A way of thinking that trusts people and backs free rights and rule by law, not a party label and
  not a belief that people are bad.
examples:
- His liberalistic views led him to back free speech and fair votes.
- She took a liberalistic stand, saying the law should guard people from unfair power.
