simpleMeaning: A small group of soldiers placed first in defence, whose clash with an enemy would bring
  in stronger forces
scope: A small group of soldiers placed first in defence, whose clash would bring in stronger forces;
  not a cord on the ground and not a large army on its own.
examples:
- The trip wire force held the border town until help arrived.
- A trip wire unit is small, but its fight would bring in stronger troops.
