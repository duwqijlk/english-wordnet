senseId: 'ceratopsian%1:05:00::'
synsetId: 01706210-n
simpleMeaning: A plant-eating dinosaur on four legs, one of several kinds with huge heads that end in
  a beak, late in the age of dinosaurs in North America and Mongolia.
scope: Also called horned dinosaur; a four-legged plant-eating dinosaur with a beaked head, not a meat-eating
  dinosaur and not a horned animal of today.
examples:
- The ceratopsian walked on four legs and ate plants.
- This ceratopsian lived in North America late in the age of dinosaurs.
