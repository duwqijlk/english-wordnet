scope: 'Also called poor man''s weatherglass and scarlet pimpernel: a small plant whose flowers shut before
  rain, not a blue pimpernel and not a garden rose.'
examples:
- The red pimpernel closed its flowers before the rain came.
- We saw red pimpernel with scarlet flowers along the path.
