simpleMeaning: the upright part of a step, between one flat part you stand on and the next
scope: The upright part of a step in stairs. It is not the flat top part you stand on, and not a person
  who gets up out of bed.
examples:
- The riser of each stair was painted white.
- He hit his toe on the wooden riser.
