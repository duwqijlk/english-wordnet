senseId: 'sound_pressure%1:19:00::'
synsetId: 11517778-n
simpleMeaning: how much the push of the air at one moment at one place in noise is above or below its
  usual level
scope: Also called instantaneous sound pressure; how much the push of air at one spot differs from its
  usual level, not the loudness of a noise as a whole.
examples:
- The sound pressure near the speaker was very high.
- They measured the sound pressure at the back of the hall.
