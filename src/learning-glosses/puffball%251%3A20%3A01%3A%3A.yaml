senseId: 'puffball%1:20:01::'
synsetId: 12989891-n
simpleMeaning: Any of several fungi of the group called Scleroderma, with hard-skinned fruiting bodies
  under the ground that look like truffles.
scope: Also called an earthball, a false truffle, and a hard-skinned puffball; a fungus of the group called
  Scleroderma with hard-skinned fruiting bodies under the ground, not the round fungi whose fruiting body
  gives off a cloud of spores.
examples:
- The puffball grew half-buried in the leaf litter.
- He dug up a puffball that looked like a small truffle.
