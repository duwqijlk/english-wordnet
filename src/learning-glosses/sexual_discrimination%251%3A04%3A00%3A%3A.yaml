simpleMeaning: unfair treatment, usually at work, that keeps one sex, usually women, out so the other
  sex gains
scope: Unfair treatment that keeps one sex out, usually at work, so the other gains; not fair choice by
  skill, and not a dislike of one person.
examples:
- She filed a claim about sexual discrimination at her job.
- The law bans sexual discrimination in hiring.
