simpleMeaning: a drug used to treat HIV, sold under the name Norvir, that stops a protein-cutting part
  of the virus from working
scope: A drug for treating HIV, not a drug that cures HIV and not a drug for other kinds of infection.
examples:
- Her doctor put her on ritonavir as part of her HIV treatment.
- Ritonavir is sold under the trade name Norvir.
