simpleMeaning: A kind of the green seed that grows in pods, from the south of Europe and the north of
  Africa, grown in large amounts, above all to feed farm animals.
scope: This is a kind of the green seed that grows in pods, also called field pea, grown above all to
  feed farm animals; not the sweet kind grown for people to eat.
examples:
- The farmer sowed field-pea plants across the dry ground for winter feed.
- Field-pea plants grow well in the poor soil near the coast.
