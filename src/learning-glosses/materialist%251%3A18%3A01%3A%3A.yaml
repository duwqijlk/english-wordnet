simpleMeaning: a person who cares very much about owning things
scope: A person who cares very much about owning things; not a thinker who holds that only things that
  can be seen and touched are real, and not just a rich person.
examples:
- He is a materialist who loves buying new cars and a big house.
- As a materialist, she cared more about new clothes and phones than about time with friends.
