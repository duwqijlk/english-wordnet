simpleMeaning: an insect or other animal that harms food, crops, farm animals, or other such things and
  is not wanted
scope: An unwanted animal that harms food, crops, or farm animals, not a bothersome person and not a plant
  disease.
examples:
- He sprayed the garden to get rid of pests.
- Many pests have developed resistance to the common pesticides.
