simpleMeaning: In parts of the south Pacific and parts of Africa, people use the shell of a sea snail
  to pay for things
scope: A sea snail whose shell serves as money in parts of the south Pacific and parts of Africa, not
  a snail eaten as food and not a shell kept only for show.
examples:
- Traders paid with money cowries in the island markets.
- She strung money cowries together as payment for the cloth.
