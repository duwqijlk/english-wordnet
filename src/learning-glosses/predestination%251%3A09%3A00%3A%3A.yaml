simpleMeaning: Above all in theology, the teaching, usually tied to Calvin, that God set every event in
  place for all time, even who is saved at last.
scope: 'Also called foreordination, predetermination, and preordination: in theology, the teaching, usually
  tied to Calvin, that God fixed every event for all time, even who is saved at last.'
examples:
- He believed in predestination, holding that God had fixed every event long before.
- Predestination teaches that God fixed every event for all time, even who is saved at last.
