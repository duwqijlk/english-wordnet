simpleMeaning: soft mud rich in dead plant and animal matter that builds up at the bottom of lakes or
  seas
scope: Soft mud rich in dead matter at the bottom of lakes or seas, not the mud on a river bank and not
  living plants.
examples:
- Sapropel lay thick at the bottom of the lake.
- The divers found sapropel covering the floor of the bay.
