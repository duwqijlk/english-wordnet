simpleMeaning: A change in the skin's power to carry a current under strain or worry, found by measuring
  the skin's hold on a current or weak currents the body makes
scope: Also called a Fere phenomenon, an electrical skin response, an electrodermal response, a galvanic
  skin response, a psychogalvanic response, and a Tarchanoff phenomenon, it is found by measuring the
  skin's hold on a current or the weak currents the body makes.
examples:
- The GSR reading rose when the subject grew nervous.
- Doctors use GSR to track stress.
