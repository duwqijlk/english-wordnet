simpleMeaning: an eye disease where the lens (the clear part inside the eye that helps you see) becomes
  cloudy
scope: This sense is the eye disease where the clear part inside the eye becomes cloudy, not the large
  waterfall of the same name.
examples:
- His cataract made it hard for him to see clearly.
- The doctor said the cataract in her left eye should be removed.
