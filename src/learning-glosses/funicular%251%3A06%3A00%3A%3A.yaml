simpleMeaning: A railway that climbs a mountain side, pulled by a moving cable, with cars going up and
  down that balance each other.
scope: Also called a cable railway or a funicular railway, a railway that climbs a mountain side, pulled
  by a moving cable; not the adjective use for things worked by a cable.
examples:
- The funicular carried us up the mountain side.
- We rode the funicular down to the town.
