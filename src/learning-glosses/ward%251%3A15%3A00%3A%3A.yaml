simpleMeaning: an area of a city or town marked off for local government and voting
scope: The local-government and election area of a town or city, not a hospital ward and not the act of
  protecting someone.
examples:
- The city is divided into six wards, each electing its own council member.
- Voters in this ward will choose a new representative next month.
