simpleMeaning: A light tool whose face holds many side-by-side grooves, splitting light beams into the
  tints that make them up.
scope: This sense is also called grating, a light tool whose face holds many side-by-side grooves, splitting
  light beams into the tints that make them up, where grating is a light tool, its face scored with straight
  side-by-side lines in plenty, that splits light beams into its colours.
examples:
- Diffraction gratings split light beams.
- The diffraction grating holds many grooves.
