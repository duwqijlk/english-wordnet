scope: A small wild plant of Arizona, Mexico and Kansas with many small yellow-orange flower heads; little
  golden zinnia is another name for this sense, not a tall garden zinnia with large flowers.
examples:
- Zinnia grandiflora grew along the dry roadside.
- The Zinnia grandiflora flower heads were small and yellow-orange.
