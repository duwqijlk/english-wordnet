simpleMeaning: Make a surface even or less rough, by rubbing or as if rubbing.
scope: This is the action of rubbing a surface until it is even, also called smoothen, not polishing it
  to a shine or clearing obstacles out of the way.
examples:
- She smoothed the crumpled sheet with her hands before folding it.
- He smoothed the rough wood with sandpaper until it felt even.
