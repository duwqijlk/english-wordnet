simpleMeaning: farm animals like cows and bulls, kept by people and taken as a group, male or female,
  young or old
scope: 'Also called cows and oxen: these farm animals taken as a group, not one single cow or bull on
  its own.'
examples:
- The farmer keeps cattle in the fields behind the barn.
- Fifty head of cattle were sold at the market.
