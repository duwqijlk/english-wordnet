simpleMeaning: In billiards, a player holds the cue almost straight up and hits the white ball so it curves
  round another ball before it strikes the ball aimed at
scope: 'Also called masse: a billiards shot with the cue held almost straight up, not an ordinary straight
  shot.'
examples:
- He played a masse shot, holding his cue almost straight up.
- Her masse shot curved the white ball round the red before it hit the target ball.
