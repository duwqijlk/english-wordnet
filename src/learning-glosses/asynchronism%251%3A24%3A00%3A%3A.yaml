simpleMeaning: a state in which things happen at times that have no link to each other
scope: 'Also called asynchrony, desynchronisation, desynchronization and desynchronizing: when things
  happen at times with no link between them, not when they happen at the same time or in step.'
examples:
- The asynchronism of the two clocks meant they never struck at the same moment.
- Doctors noted the asynchronism of the brain waves after the stimulus.
