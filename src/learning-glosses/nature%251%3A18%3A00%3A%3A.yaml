simpleMeaning: A power believed to create and control everything in the world.
scope: This is not the physical world itself, and not the basic character of something; it is a force
  imagined as making and ruling all things.
examples:
- The old stories say that nature decides when the seasons change.
- They gave thanks to nature for a good harvest.
