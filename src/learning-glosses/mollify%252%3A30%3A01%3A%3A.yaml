schema: oewn-learning-gloss-v2
senseId: 'mollify%2:30:01::'
synsetId: 00295646-v
simpleMeaning: To make something less strong or less harsh, easier to accept, and more fit for use by
  adding something else to it
scope: 'Also called season, temper, and moderate: this is making something milder by adding something
  else, not calming an angry person and not making something stronger.'
examples:
- She mollified the sharp sauce by adding a little cream.
- He mollified the strong drink by adding water.
