simpleMeaning: This colicroot, a kind of plant, grows in the south-east of the United States, with white
  flowers whose outer covers are rough and grainy.
scope: Also called ague root, this colicroot grows in the south-east of the United States and bears white
  flowers with rough, grainy outer covers.
