simpleMeaning: A gripping tool fixed to a work table, with two jaws that hold the piece hard in place
scope: A gripping tool fixed to a work table, with two jaws that hold the piece hard in place, also called
  vise, also called vice, not a clamp and not a bench hook.
examples:
- He tightened the bench vise around the metal bar before he cut it.
- The bench vise held the piece firmly while she drilled the hole.
