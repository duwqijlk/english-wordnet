senseId: vicarious%5:00:00:abnormal:00
synsetId: 01602707-s
simpleMeaning: happening in a part of the body that is not the usual place for that body action
scope: This is about a body action happening in a part of the body that is not its usual place. It is
  not about feeling what another person feels by watching them or hearing about them, and not about one
  person doing something in place of another person.
examples:
- The doctor described her bleeding as vicarious menstruation, coming from a place that was not the usual
  one.
- Vicarious bleeding can happen in a part of the body other than the usual place for it.
