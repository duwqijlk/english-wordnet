senseId: 'conditioned_avoidance%1:04:00::'
synsetId: 00866358-n
simpleMeaning: A learned act that comes just before an unpleasant thing happens
scope: A learned act that comes just before an unpleasant thing happens; conditioned avoidance response
  is another name for this sense, not a natural act done without learning and not the unpleasant thing
  itself.
examples:
- The rat showed conditioned avoidance before the shock came.
- Her conditioned avoidance began as soon as she heard the bell.
