simpleMeaning: 'At great heat, the lightest atoms join together to make helium, setting free the power
  locked in them: that is the force of this weapon.'
scope: Also called a fusion bomb and a thermonuclear bomb, this weapon joins the lightest atoms together
  at great heat, not one that splits atoms apart.
examples:
- The hydrogen bomb draws its power from light atoms joining together at great heat.
- They feared the hydrogen bomb more than any other weapon.
