simpleMeaning: Of a thing with two names, especially the two-part Latin name of a living thing.
scope: Of a thing with two names, especially the two-part Latin name of a living thing, not the use in
  mathematics for a quantity of two terms, joined as a sum or a difference.
examples:
- The plant's name was binomial, with a genus name and a species name.
- The wolf's Latin name was binomial, Canis lupus.
