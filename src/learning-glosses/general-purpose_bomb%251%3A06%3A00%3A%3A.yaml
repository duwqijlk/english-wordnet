simpleMeaning: Its metal case breaks into flying bits when this big weapon bursts with a blast; it weighs
  500 to 2,000 pounds and is half explosive.
scope: This is a big weapon that bursts with a blast, not a fragmentation bomb or a small weapon that
  only breaks into bits.
examples:
- The plane dropped a general-purpose bomb on the target.
- A general-purpose bomb weighs between 500 and 2,000 pounds.
