simpleMeaning: In genetics, one of two or more forms of a gene that can sit in the same place on a chromosome
  and that govern the same feature.
scope: Also called an allelomorph, one of two or more forms of a gene that can sit in the same place on
  a chromosome and govern the same feature.
examples:
- The allele for blue eyes sits in the same place as the one for brown.
- Each allele governs the same feature in a different way.
