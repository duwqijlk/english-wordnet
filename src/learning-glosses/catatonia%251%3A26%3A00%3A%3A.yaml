simpleMeaning: a form of schizophrenia in which a person stays still and dull for a long time, then at
  times bursts into wild excitement for a short while
scope: 'Also called catatonic schizophrenia and catatonic type schizophrenia: a form of schizophrenia
  with long still spells and short bursts of excitement, not a brief faint and not ordinary tiredness.'
examples:
- Catatonia left him sitting still for hours.
- Her catatonia gave way to a short burst of wild excitement.
