senseId: 'respite%2:42:01::'
synsetId: 02650119-v
simpleMeaning: when a court has found a person guilty, to set the punishment aside for now, such as an
  execution
scope: To put off the punishment of a person found guilty, not the noun sense of putting off a punishment
  in general and not a short break from harm.
examples:
- The court respited the prisoner the day before his execution.
- The judge respited the sentence until the new evidence could be heard.
