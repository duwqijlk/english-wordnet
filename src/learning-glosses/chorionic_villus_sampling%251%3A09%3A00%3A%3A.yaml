simpleMeaning: Tissue from round the unborn baby is taken and tested before birth to look for faults early
  in the pregnancy
scope: This test takes tissue from round the unborn baby and tests it before birth to look for faults
  early in the pregnancy; also called chorionic villus biopsy, not a test done after the baby is born.
examples:
- The chorionic villus sampling found no faults in the unborn baby.
- Chorionic villus sampling is done early in the pregnancy.
