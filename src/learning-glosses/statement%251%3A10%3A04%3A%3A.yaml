simpleMeaning: in music, the way a theme is first played or introduced
scope: This is a theme being introduced in music, not something said or written, a claim offered as evidence,
  a nonverbal message, a line of computer code, or a financial record.
examples:
- The symphony opens with a quiet statement of the main theme.
- The statement of the theme returns in the final movement.
