simpleMeaning: The timing of the wave that carries a signal is changed
scope: A change in the timing of a wave that carries a signal, not a change in its height and not a change
  in how often it repeats.
examples:
- Phase modulation lets the radio send the voice as small shifts in timing.
- The engineer chose phase modulation for the new link.
