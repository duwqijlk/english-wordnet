simpleMeaning: a person who has suddenly got more money and a higher level in life, but other people at
  that level do not accept this person as one of them
scope: Also called arriviste. This is the noun for a person who has risen fast in money and place but
  is not accepted there; not the gym exercise, and not the adjective for a person who seems too proud
  after rising.
examples:
- The upstart bought the biggest house on the street, but the old rich families would not invite him to
  dinner.
- People called her an upstart because she had become rich very fast and they did not accept her in their
  class.
