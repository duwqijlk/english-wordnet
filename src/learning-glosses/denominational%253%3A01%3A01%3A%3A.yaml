simpleMeaning: having to do with the value printed on a banknote, coin, or stamp
scope: This is about the value marked on money or a stamp; not loyalty to a religious group and not the
  size or weight of the note or coin.
examples:
- The denominational value of the note is fifty pounds.
- A collector checks the denominational value of each stamp.
