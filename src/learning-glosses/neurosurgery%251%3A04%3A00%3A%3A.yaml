simpleMeaning: The brain, the cord of nerves down the back, and the nerves elsewhere in the body are what
  doctors cut into here.
scope: This cutting is done by doctors on the brain, the cord of nerves down the back, or the nerves elsewhere
  in the body, and not on other parts of the body.
examples:
- The patient needed neurosurgery on the brain.
- The neurosurgery dealt with the nerves in the arm.
