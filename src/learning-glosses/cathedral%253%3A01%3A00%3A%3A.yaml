simpleMeaning: linked to a bishop's seat of power or job, having that seat, or coming from that seat or
  job
scope: This word describes a thing linked to a bishop's seat or job; it is not the main church building
  of a bishop's area.
examples:
- A cathedral church holds the bishop's seat.
- The letter carried cathedral authority, as it came from the bishop's office.
