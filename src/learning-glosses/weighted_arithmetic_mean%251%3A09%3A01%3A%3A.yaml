simpleMeaning: An average comes out with some numbers counting more than others, when each number to be
  worked out is given a weight.
scope: Also called weighted average and weighted mean, it is an average where a weight is given to each
  number.
examples:
- The weighted arithmetic mean of the marks gave the exam more weight than the homework.
- The weighted arithmetic mean of the three scores was worked out.
