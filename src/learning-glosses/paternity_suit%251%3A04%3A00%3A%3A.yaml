simpleMeaning: a court case brought to find who the father of a child born outside marriage is, and to
  make sure the child is looked after once that is known
scope: A court case to find who the father of a child born outside marriage is, and to make sure the child
  is looked after; bastardy proceeding is another name for this sense.
examples:
- She filed a paternity suit to find the child's father.
- The paternity suit also asked the court to order support for the child.
