simpleMeaning: able to make seed when pollen from another flower of the same kind reaches the flower
scope: 'Also called endogamic: a flower that can make seed from pollen of another flower of the same kind,
  not a custom of marrying within one group and not a flower that uses its own pollen.'
examples:
- The endogamous flowers set seed after pollen came from other flowers of the same kind.
- Some endogamous plants need pollen from a second flower of their own kind to make seed.
