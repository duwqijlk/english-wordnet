simpleMeaning: The part of a piece of clothing that covers or fits over the place where the arm joins
  the body.
scope: This is the clothing part, not the body joint it covers, and not the action of lifting or pushing
  with the body.
examples:
- Gold braid decorated the shoulder of his uniform.
- The left shoulder of the jacket had a small tear.
