simpleMeaning: for a formal night out, a man wears this white top with a stiff starched front, usually
  with a tuxedo
scope: 'Also called dress shirt: a white top with a stiff starched front for a man to wear at night, not
  a top for work in the day and not a jacket on its own.'
examples:
- He put on his evening shirt and tuxedo for the ball.
- The evening shirt has a stiff front that needs starch.
