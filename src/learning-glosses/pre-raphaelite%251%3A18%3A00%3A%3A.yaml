simpleMeaning: A painter or writer who works to bring back the aims of the early Renaissance
scope: It names the painter or writer, not a painting or book in their manner, and it is the aims of the
  early Renaissance that such a painter or writer works to bring back.
examples:
- The Pre-Raphaelite painted in bright colours.
- He joined the Pre-Raphaelites to paint like the early masters.
