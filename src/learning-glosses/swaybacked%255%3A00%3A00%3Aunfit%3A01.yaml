simpleMeaning: With a spine that sags down in a way that is not normal, especially in horses.
scope: Also called dipped, and also swayback, with a spine that sags in a way that is not normal, especially
  in horses.
examples:
- The old horse was swaybacked after years of hard work.
- The cart horse was swaybacked, its back dipping low in the middle.
