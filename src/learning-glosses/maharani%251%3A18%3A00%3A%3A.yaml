simpleMeaning: a princess in India, or the wife of a king there, who ranks as a great queen
scope: Also called maharanee, this is a princess in India or the wife of a king there, a great queen,
  not a common woman and not a king himself.
examples:
- The maharani wore gold at the festival.
- As maharani, she ruled beside the king.
