simpleMeaning: Going against what is right or lawful, or likely to do so
scope: Going against a rule or a law, not a bad smell, not words that anger people, and not a thing that
  is wrong in itself.
examples:
- The ruling was offensive to the basic rights of citizens.
- He called the tax offensive to the spirit of the law.
