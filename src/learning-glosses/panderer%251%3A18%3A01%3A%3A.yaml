simpleMeaning: A person who helps others carry out their low wants or plans, most of all to make money
scope: A person who serves the low wants and plans of others, most of all for money, not a person who
  spoils someone with too much, and not one who finds customers for prostitutes.
examples:
- The panderer made money by helping rich men carry out their shameful plans.
- He refused to act as a panderer for the corrupt officials.
