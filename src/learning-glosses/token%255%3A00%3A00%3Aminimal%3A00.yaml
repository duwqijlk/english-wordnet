simpleMeaning: very small in amount or importance, and done only in form, not in a real or full way
scope: This describes something very small in amount or importance, done only in form and not in a real
  or full way; it is not the metal or plastic disk used in some machines.
examples:
- The company made a token payment of just one pound.
- She made a token effort to clean the room, then stopped.
