simpleMeaning: A breed of small, compact dog from Asia with a smooth coat, a tightly curled tail, and
  a broad, flat, wrinkled muzzle.
scope: Another name for the pug; it is that small, flat-faced companion breed, not a French bulldog or
  a Boston terrier.
examples:
- Our pug-dog has a broad, flat, wrinkled muzzle.
- She brushed her pug-dog's smooth coat.
