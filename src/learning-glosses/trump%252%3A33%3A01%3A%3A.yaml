simpleMeaning: In a card game, to play a card from the set that has been made strongest for that hand,
  so it can beat other cards
scope: In card games, this is playing a card from the strong set; not the card itself, and not making
  a loud sound or a loud announcement.
examples:
- She trumped his ace with a small card from the strong suit.
- He chose to trump the last trick and win the hand.
