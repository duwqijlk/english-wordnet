simpleMeaning: Not able to think clearly because of being hit again and again, or as if you had been hit
  again and again
scope: This means not able to think clearly after being hit again and again. It is not the common sense
  of not serious or foolish.
examples:
- The boxer was knocked silly and could not stand up.
- Repeated hits in the game left him silly and unable to answer simple questions.
