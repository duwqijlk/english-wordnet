simpleMeaning: In eye care, a cornea with an uneven shape usually brings weak sight, and people who are
  nearsighted often have it.
scope: Weak sight from an uneven cornea, also called astigmatism; not the optics fault in which light
  rays fail to meet at one point.
examples:
- The eye test showed she had astigmia in both eyes.
- His astigmia came from the uneven shape of his cornea.
