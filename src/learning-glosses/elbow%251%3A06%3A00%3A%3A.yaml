simpleMeaning: the part of a sleeve that covers the bend in the middle of a person's arm
scope: The part of a sleeve over the arm bend; not the arm bend itself, not the bend on an animal, and
  not a bent pipe.
examples:
- The elbows of his coat were thin and worn.
- The elbow of his shirt tore when he leaned on the table.
