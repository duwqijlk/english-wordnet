simpleMeaning: a man who is one of the clergy (the leaders who do the holy work of a church) and who leads
  people in the Christian church
scope: This is a man who leads in the Christian church, not a woman church leader and not a church member
  with no leading role.
examples:
- The clergyman spoke to the people in church on Sunday.
- A kind clergyman visited the sick woman at home.
