simpleMeaning: A long-lived plant of Europe and America, with clusters of white or purplish flowers and
  very bitter three-part leaves, often rooting at the water's edge and spreading across the surface.
scope: 'Also called bog myrtle, bogbean, buckbean, marsh trefoil, and water shamrock: a long-lived plant
  of Europe and America with bitter three-part leaves, not a true shamrock and not a myrtle.'
examples:
- Menyanthes trifoliata spread across the pond's surface.
- The Menyanthes trifoliata leaves tasted intensely bitter.
