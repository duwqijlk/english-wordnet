simpleMeaning: like the strange pictures and feelings you have in your mind when you sleep
scope: This means strange and not fully real, like something you see in sleep, not like a normal real
  thing in the day.
examples:
- With mist over the lake, the place had a dreamlike feel and did not seem real.
- The mountains looked dreamlike in the soft, strange light.
