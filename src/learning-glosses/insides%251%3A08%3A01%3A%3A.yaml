simpleMeaning: the parts that are in the body and do its work, all together, especially the parts in the
  belly
scope: All the work-doing parts in the body taken together, especially in the belly; not the inner side
  of a thing and not one such part on its own.
examples:
- After the operation, his insides needed time to heal.
- A scan showed that her insides were all healthy.
