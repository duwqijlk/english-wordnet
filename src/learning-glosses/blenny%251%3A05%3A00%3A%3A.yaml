simpleMeaning: in holes between rocks on rocky shores live small fish, usually without scales, with teeth
  like a comb, that guard their own ground
scope: 'Also called combtooth blenny: a small fish with comb-like teeth on rocky shores, not a long thin
  fish with big side fins.'
examples:
- Blennies hide in holes between rocks on the shore.
- The blenny guards its own ground with comb-like teeth.
