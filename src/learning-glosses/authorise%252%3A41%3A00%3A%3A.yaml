simpleMeaning: To pass power or leave to another person, so they can act in one's place.
scope: Also called authorize, to hand power to another person so they can act in one's place; not saying
  yes to a thing, giving formal leave for it to go forward.
examples:
- She authorised her assistant to sign the papers.
- The board authorised the manager to spend the money.
