simpleMeaning: A Christian heresy of the 5th and 6th centuries that denied two natures, human and divine,
  in Jesus, holding that he had one divine nature only.
scope: A Christian heresy of the 5th and 6th centuries holding that Jesus had one divine nature only,
  not the accepted view of two natures and not a denial of his divinity.
examples:
- Monophysitism spread through the eastern churches in the 5th century.
- The council condemned Monophysitism for denying Christ's two natures.
