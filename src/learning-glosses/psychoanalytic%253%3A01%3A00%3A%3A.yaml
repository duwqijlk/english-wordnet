simpleMeaning: to do with Freud's ideas and way of treating troubled minds
scope: To do with Freud's ideas and way of treating troubled minds; also called psychoanalytical; not
  a way of treating the body, and not a way of testing how clever a person is.
examples:
- The psychoanalytic method looks for hidden causes of worry.
- She studied psychoanalytic theory at the university.
