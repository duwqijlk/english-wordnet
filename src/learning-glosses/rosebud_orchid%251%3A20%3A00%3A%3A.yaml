simpleMeaning: Bunches of one to three large, showy pink flowers grow on an orchid of central and northern
  South America, sometimes put in the genus Pogonia.
scope: An orchid of central and northern South America with bunches of one to three large, showy pink
  flowers.
examples:
- The rosebud orchid bore three large pink flowers on one stem.
- Rosebud orchids grow in central and northern South America.
