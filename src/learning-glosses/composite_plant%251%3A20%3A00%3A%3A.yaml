simpleMeaning: Tiny flowers packed in thick heads that look like one flower mark these plants, held to
  be the most fully developed of the plants whose seeds hold two first leaves.
scope: Also called composite, this is the plant with tiny flowers packed in thick heads that look like
  one flower, not a plant with single true flowers.
examples:
- The composite plant had tiny flowers packed in a thick head.
- A composite plant looks as if it has a single flower.
