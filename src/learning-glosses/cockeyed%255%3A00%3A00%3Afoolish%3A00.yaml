senseId: cockeyed%5:00:00:foolish:00
synsetId: 02581199-s
simpleMeaning: Too foolish to take seriously, and only fit to be laughed at.
scope: Also called ridiculous, absurd, ludicrous, or idiotic, and also called preposterous, laughable,
  nonsensical, or derisory, this is said of an idea too foolish to take seriously.
examples:
- The plan was cockeyed from the start.
- That excuse was cockeyed, and no one believed it.
