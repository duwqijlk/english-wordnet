simpleMeaning: in a way that shows you are easily upset by unpleasant or disgusting things
scope: In a way that shows you are easily upset by unpleasant things; not in a fearful way, and not in
  an angry way.
examples:
- She looked squeamishly at the cut on his knee.
- He squeamishly turned away from the blood on the floor.
