simpleMeaning: A set of computers in one place, joined so they can share messages, above all one joining
  computers and word machines and other office machines to link offices together.
scope: This is a set of computers joined in one place to share messages, not a set joined across a whole
  country and not the internet.
examples:
- The office local area network lets us share files.
- Our local area network went down this morning.
