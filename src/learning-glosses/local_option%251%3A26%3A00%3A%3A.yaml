simpleMeaning: A town or area government has the right to decide by a public vote whether a law that people
  argue about applies in its own area
scope: The right of one town or area government to decide by vote whether a disputed law applies there,
  not a right held by the whole country and not a vote on the law itself.
examples:
- The town used its local option to vote on the new drinking law.
- Under local option, each area decides for itself whether the law applies.
