simpleMeaning: a thing made to do or control one special job, and very useful for that job
scope: This sense is a useful thing for one job, also called a contraption. It is not a plan to trick
  people, not an unnatural arrangement of parts, and not a thing put together for a short time only.
examples:
- This small contrivance opens the heavy gate with one push.
- He built a contrivance to water the plants while he was away.
