senseId: 'erythropoietin%1:27:00::'
synsetId: 14874504-n
simpleMeaning: a kind of protein with sugar parts joined to it, made by the kidneys, that tells the body
  to make more red blood cells
scope: A kind of protein with sugar parts joined to it, made by the kidneys, that starts the making of
  red blood cells, not the red blood cells themselves and not a kidney stone.
examples:
- The kidneys release erythropoietin when the body needs more red blood cells.
- Low erythropoietin can leave a person short of red blood cells.
