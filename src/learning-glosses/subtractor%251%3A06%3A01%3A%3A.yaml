simpleMeaning: an electric circuit that works out the difference between two numbers made of ones and
  noughts
scope: A circuit that finds the difference between two binary numbers, not a circuit that adds numbers
  and not a calculator key.
examples:
- The subtractor in the chip worked out the difference between the two numbers.
- Engineers tested the subtractor with pairs of binary numbers.
