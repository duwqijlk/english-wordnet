senseId: 'first_strike%1:04:00::'
synsetId: 00979637-n
simpleMeaning: The opening use of nuclear arms to hit a country that also holds them, workable only when
  the attacker can wipe out the other's power to hit back.
scope: The opening use of nuclear arms against a country that also holds them, possible only when the
  attacker can wipe out the other's power to hit back; not a reply attack after being hit, and not a threat
  of attack.
examples:
- The president promised no first strike against the neighbouring country.
- A first strike would leave the other side unable to hit back.
