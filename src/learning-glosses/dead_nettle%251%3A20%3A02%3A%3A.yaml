simpleMeaning: From Europe and Asia, this plant lives for many years, smells bad, and sends a green stem
  creeping along under the ground
scope: Hedge nettle is another name for this foul-smelling plant from Europe and Asia, which lives for
  many years and has a green stem that creeps along under the ground, unlike the kinds with small purplish
  flowers or white or reddish flowers.
examples:
- The dead nettle spread by its green creeping stems.
- We pulled up the dead nettle because of its foul smell.
