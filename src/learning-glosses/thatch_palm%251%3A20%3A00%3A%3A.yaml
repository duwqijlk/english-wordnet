simpleMeaning: In southern Florida and the West Indies grows a small palm much like the palmetto with
  a silver top.
scope: Also called broom palm, silver thatch, and thatch tree, it is a small palm of southern Florida
  and the West Indies, much like the palmetto with a silver top.
examples:
- We saw a thatch palm growing in the West Indies.
- That thatch palm looked much like the palmetto with a silver top.
