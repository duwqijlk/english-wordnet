simpleMeaning: Not always the same; it can look or be different at different times or in different cases
scope: This word describes things that show differences and change. It is not a group of living things
  that differ a little from similar groups, and not an amount that changes by chance.
examples:
- The letters in his writing were variant, some big and some small.
- Variant forms of the word appear in books from different times.
