simpleMeaning: For about one part out of two of its length, the stalk of this morel holds the ridged,
  pitted top part that bears its spores.
scope: Also called cow's head, this morel's stalk holds its ridged, pitted top part for about half its
  length.
examples:
- The half-free morel had a ridged, pitted top part on its stalk.
- We picked a half-free morel and saw how its top part joined the stalk.
