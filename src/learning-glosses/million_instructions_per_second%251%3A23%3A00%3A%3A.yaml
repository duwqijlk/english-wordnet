simpleMeaning: In computer science, this unit counts how fast a computer's main chip carries out orders,
  not the whole machine
scope: In computer science, a measure of a computer's main chip alone, not of the whole machine and not
  of how much work it can hold.
examples:
- The old chip ran at only a few million instructions per second.
- Engineers quoted the speed in million instructions per second.
