simpleMeaning: a person who works in a place where people eat, leads the staff who serve food, and shows
  guests where to sit
scope: 'Also called captain: this person leads the staff who serve food and seats guests in a dining room,
  not the captain of a ship or a sports team.'
examples:
- The headwaiter showed us to our table as soon as we arrived.
- As headwaiter, he told the serving staff which tables to look after.
