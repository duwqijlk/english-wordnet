simpleMeaning: a machine for getting water out of wet clothes, with two round bars that the clothes are
  pressed between
scope: This is the clothes machine with two round bars; it squeezes water out of wet clothes, it does
  not dry them with hot air.
examples:
- She put the wet shirt through the wringer to get the water out.
- The old wringer stood next to the sink in the wash room.
