simpleMeaning: By custom, a family honours its dead as still part of itself, believing their spirits can
  step into the lives of the living.
scope: The dead are honoured as still part of the family, and their spirits are believed to act among
  the living.
examples:
- Many families practise ancestor worship to honour those who have died.
- In ancestor worship, the family asks its dead for help.
