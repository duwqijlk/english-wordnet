simpleMeaning: A light wash with water only, with no soap used.
scope: A light wash with water only and no soap, not the wash that takes soap off at the end, not the
  wash of the mouth, and not the liquid that tints hair.
examples:
- Give the shirt a rinse in cold water.
- A quick rinse took the dust off the lettuce.
