simpleMeaning: saying words clearly, or making a sound with the voice such as a cry or shout
scope: Saying words clearly, or making a sound with the voice; express, utter and verbalize are other
  names for this sense, not staying silent and not mumbling.
examples:
- The hound gave tongue to the scent.
- She gave tongue to her anger in a loud cry.
