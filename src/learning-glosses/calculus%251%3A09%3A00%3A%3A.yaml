  get closer and closer to), how fast they change, and joining their parts into a whole'
scope: Also called infinitesimal calculus. This is the mathematics sense, not a hard lump of salts in
  the body and not the hard crust that forms on teeth.
examples:
- She is studying calculus at university this year.
- Calculus helps us work out how fast a moving car is going at one moment.
