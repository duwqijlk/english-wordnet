simpleMeaning: a person who supports a group leaving a larger group to be on its own, such as an old church
  or a national union
scope: A person who supports a group leaving a larger group to be on its own, not the word used to describe
  a group or idea that supports this.
examples:
- The separatists wanted their region to leave the country.
- He was a separatist who led the movement to form a new state.
