simpleMeaning: One who taps a surface, light and usually again and again.
scope: One who taps a surface, light and usually again and again; not one who keeps a tavern and draws
  beer from casks, nor a dancer who beats time with metal taps on shoe toes and heels, nor one who listens
  in on a phone or wire, nor a worker who cuts screw threads with a tap.
examples:
- Their tapper drummed on the table.
- The tapper kept time on the desk.
