simpleMeaning: A company set up with limited liability, so its owners do not have to pay the company's
  debts with their own money.
scope: Also called a limited company or Ltd., it is a company whose owners do not have to pay its debts
  with their own money, not a company whose owners must pay all its debts.
examples:
- The company name ended in Ld., which showed that its owners had limited liability.
- They set up the business as Ld. so that the owners would not have to pay its debts with their own money.
