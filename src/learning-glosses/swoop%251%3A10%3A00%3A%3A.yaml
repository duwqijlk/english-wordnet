simpleMeaning: In music, the notes of a tune sliding quickly up or down a scale
scope: 'Also called slide: in music, notes sliding quickly up or down a scale, not a bird diving down
  to catch something and not a quick move through the air.'
examples:
- The violinist was indulgent with his swoops and slides.
- Her voice made a swoop up to the high note.
