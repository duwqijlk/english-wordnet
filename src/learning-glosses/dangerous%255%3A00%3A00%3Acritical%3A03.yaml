simpleMeaning: very serious and threatening great harm, so that people feel afraid or anxious.
scope: This describes a serious condition or situation that threatens great harm, not an ordinary risk
  of injury.
examples:
- She is in a dangerous condition after the crash.
- The patient's fever took a dangerous turn.
