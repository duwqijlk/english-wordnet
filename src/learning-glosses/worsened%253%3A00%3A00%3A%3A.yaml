simpleMeaning: changed so that health or fitness is now poorer than before
scope: 'Also called worse: poorer in health or fitness than before, not made poorer in other things such
  as money or ties between countries.'
examples:
- His worsened health kept him in bed for a week.
- She was worried by her worsened fitness after the long illness.
