  or someone who may become an enemy
scope: This is going to check an area to learn about an enemy, not fighting the enemy and not a general
  search for a lost thing.
examples:
- The soldiers went out on reconnaissance before dawn.
- Air reconnaissance showed enemy camps near the river.
