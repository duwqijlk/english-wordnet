simpleMeaning: To measure how far something is by walking over it and counting each stride.
scope: To measure a distance by walking and counting steps, another name for the verb step, not to set
  a rate or to walk at a certain speed.
examples:
- They paced out fifty meters along the track.
- She paced out the distance from the gate to the door.
