simpleMeaning: A long-lived plant of the south and south-east of Europe that flowers early, with flower
  heads like those of goldenrod.
scope: Also called goldilocks, a goldilocks aster, and Linosyris vulgaris; an early-flowering plant of
  southern Europe, not a late-flowering plant of the north.
examples:
- Aster linosyris flowered early in the south of Europe.
- The flower heads of Aster linosyris look like those of goldenrod.
