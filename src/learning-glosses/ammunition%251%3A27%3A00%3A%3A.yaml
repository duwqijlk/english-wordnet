simpleMeaning: any material, nuclear, chemical, or made from living things, that can be used to kill huge
  numbers of people at once
scope: Material that can kill huge numbers of people at once, not facts used to attack or defend an argument.
examples:
- The army stored the ammunition in a guarded depot far from the city.
- They feared the ammunition could be used to kill thousands at once.
