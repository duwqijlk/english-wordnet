senseId: 'nominal%3:01:00::'
synsetId: 02779730-a
simpleMeaning: relating to a noun (a word for a person, place or thing) or to a group of words that does
  the same work
scope: About nouns or groups of words that work as nouns; not about money amounts and rising prices, and
  not about names or very small amounts.
examples:
- In 'the big house', the words form a nominal phrase.
- Teachers call this a nominal group because it works as a noun.
