simpleMeaning: a plant of the southern United States that climbs and bears blue-purple flowers
scope: A climbing plant from the southern United States with blue-purple flowers, also called blue jasmine,
  blue jessamine and marsh clematis; not a bushy plant with wavy leaves and not a plant with spiky leaves.
examples:
- The curly clematis climbed the fence and opened blue-purple flowers.
- We planted curly clematis beside the porch for its flowers.
