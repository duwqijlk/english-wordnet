simpleMeaning: The trait of being too pleased with oneself and one's looks; false pride
scope: Being too pleased with oneself and one's looks, not a low table with a mirror and not honest pride
  in good work.
examples:
- His vanity made him spend an hour in front of the mirror.
- Her vanity showed in the way she talked about her own beauty.
