simpleMeaning: A large bird of prey of the mountains of the Northern Hemisphere, with a yellow-brown head
  and neck.
scope: A large bird of prey of northern mountains with a yellow-brown head and neck, not a bald eagle
  and not a smaller hawk.
examples:
- The golden eagle circled high above the mountain valley.
- A golden eagle's head and neck shine yellow-brown in the sun.
