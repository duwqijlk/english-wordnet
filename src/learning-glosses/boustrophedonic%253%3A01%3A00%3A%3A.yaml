simpleMeaning: to do with writing where one line runs one way and the next line runs the other way
scope: To do with writing where lines run in opposite directions, not writing that always runs one way
  and not writing that runs up and down.
examples:
- The old stone was carved in boustrophedonic script.
- In boustrophedonic writing, each line turns back the other way.
