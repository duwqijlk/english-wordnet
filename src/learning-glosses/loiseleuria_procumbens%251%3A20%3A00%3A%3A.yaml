simpleMeaning: A low shrub that creeps in a mat and keeps its leaves, found high in the mountains of the
  northern half of the world and grown for its rose-pink flowers.
scope: 'Also called alpine azalea and mountain azalea: a low mat of green leaves with rose-pink flowers
  on high mountains.'
examples:
- Loiseleuria procumbens spread in a low mat across the high rocks.
- We saw Loiseleuria procumbens in bloom, its rose-pink flowers bright against the green leaves.
