simpleMeaning: A drug given by needle that kills germs, sold as Cefobid, used for bad infections.
scope: A drug given by needle for bad infections, not a pill taken by mouth and not a cream put on the
  skin.
examples:
- The doctor gave her cefoperazone by needle for the severe infection.
- Cefoperazone is used when an infection does not answer to milder drugs.
