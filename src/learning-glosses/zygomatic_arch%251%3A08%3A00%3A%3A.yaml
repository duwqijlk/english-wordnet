simpleMeaning: the bone at the side of the head is joined to the cheekbone by this thin curved bone
scope: Arcus zygomaticus and zygoma are other names for this thin curved bone, which joins the cheekbone
  to the bone at the side of the head and is neither bone itself.
examples:
- The zygomatic arch runs from the cheekbone to the bone at the side of the head.
- The zygomatic arch lies between the cheekbone and the bone at the side of the head.
