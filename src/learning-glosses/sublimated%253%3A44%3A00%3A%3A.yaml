simpleMeaning: Gone, or going, straight from solid to gas, or back again, with no liquid stage in between.
scope: Changed straight from solid to gas, or back, without becoming liquid.
examples:
- The ice was sublimated, passing straight to gas with no liquid stage.
- Dry ice is sublimated when it turns to gas without melting.
