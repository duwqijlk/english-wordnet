simpleMeaning: A weapon that bursts in the air and lets out massive invisible wave energy, enough to stop
  computers and signal gear working, without killing people or wrecking buildings.
scope: Also called a microwave bomb; a weapon that bursts in the air and lets out a burst of wave energy
  that stops computers and signal gear working, not a weapon that kills people or wrecks buildings.
examples:
- An E-bomb bursts in midair and stops computers working without harming people.
- The E-bomb released a burst of energy that disabled the phones.
