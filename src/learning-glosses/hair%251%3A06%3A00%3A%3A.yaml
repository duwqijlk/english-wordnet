simpleMeaning: cloth woven from the long, stiff strands of a horse's or camel's coat, used to pad furniture
  or stiffen clothes.
scope: This is not the strands growing on a person's head or an animal's skin, but the woven cloth made
  from an animal's coat.
examples:
- The antique chair was padded with horsehair.
- Horsehair canvas stiffened the shoulders of the jacket.
