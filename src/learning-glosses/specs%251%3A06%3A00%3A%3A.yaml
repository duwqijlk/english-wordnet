senseId: 'specs%1:06:00::'
synsetId: 04279164-n
simpleMeaning: in the plural, a frame that holds two clear parts over the eyes to help a person with weak
  sight see better
scope: This sense is worn over the eyes to help sight, also called glasses, spectacles, and eyeglasses;
  it is not a written list of details for how a thing is made.
examples:
- She put on her specs so she could read the small print.
- His specs broke when they fell off his face onto the floor.
