senseId: 'freedom_from_cruel_and_unusual_punishment%1:07:00::'
synsetId: 05193020-n
simpleMeaning: 'a right set down in the 8th change to the US Constitution: the state may not act harshly
  or out of the ordinary against a person'
scope: The right that limits how harshly the state may act against a person, not the right against search
  and seizure and not the right to keep and carry weapons.
examples:
- The freedom from cruel and unusual punishment is one of the rights in the US Constitution.
- The court said the freedom from cruel and unusual punishment protects people from harsh treatment.
