simpleMeaning: Though its kind had none of them in its earlier history, new features or parts come in
  while a young animal is forming, such as the placenta in mammals
scope: 'Also called cainogenesis, cenogenesis, kainogenesis, and kenogenesis: new features or parts that
  appear while a young animal is still forming, though its kind had none of them in its earlier history.'
examples:
- Caenogenesis brought a new feature to the young animal before birth.
- The placenta is one case of caenogenesis in mammals.
