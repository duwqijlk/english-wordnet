simpleMeaning: Skin tissue joined to the special sense organs and holding the ends of feeling cords.
scope: Skin tissue joined to the special sense organs and holding feeling cord ends, not plain skin and
  not a sense organ itself.
examples:
- The neuroepithelium in the nose holds the ends of smell cords.
- Taste buds rest on neuroepithelium that holds feeling cord ends.
