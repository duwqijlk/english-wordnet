simpleMeaning: an idea, such as a quality a thing has, by which it can be told apart from others
scope: An idea, such as a quality, by which a thing can be told apart from others; also called a property
  or an attribute; not a size in a direction, not one of the three numbers that fix a place in space,
  and not the verbs that mark sizes on a thing or shape a thing to set sizes.
examples:
- Self-confidence is a dimension of a person's character.
- Honesty is one dimension by which people are judged.
