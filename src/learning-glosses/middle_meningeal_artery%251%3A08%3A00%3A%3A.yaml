simpleMeaning: A blood tube that branches off the jaw blood tube, whose small tubes feed the covers of
  the brain.
scope: A blood tube that branches off the jaw blood tube, whose small tubes feed the covers of the brain;
  not the jaw blood tube itself and not the blood tube that splits into three inside the head.
examples:
- The middle meningeal artery feeds the covers of the brain.
- The middle meningeal artery branches off the jaw blood tube.
