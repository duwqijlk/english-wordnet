simpleMeaning: work a student is given and does during a course, usually marked as part of the student's
  grade for the course
scope: Work done during a course and usually marked for the grade; not a final test on its own and not
  study done outside a course.
examples:
- Her coursework included two essays and a project.
- He spent the weekend finishing his coursework.
