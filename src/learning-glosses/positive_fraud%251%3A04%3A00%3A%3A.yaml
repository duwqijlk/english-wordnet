simpleMeaning: real dishonest dealing, hiding facts or saying what is false, with a bad aim to hurt another
  person
scope: Also called fraud in fact, this is real dishonest dealing meant to hurt another person, not a careless
  mistake or a false claim made with no bad aim.
examples:
- The court found positive fraud because he had hidden the debts to hurt the buyer.
- She was charged with positive fraud after she made false claims that caused him to lose money.
