simpleMeaning: a long, open, flat area of ground by the sea, with a hard surface or grass, for walking
scope: A flat open place for walking by the sea, not the sandy beach itself and not a road for cars by
  the sea.
examples:
- We walked along the esplanade and looked out at the sea.
- Families sat on benches on the esplanade beside the beach.
