simpleMeaning: Both male and female parts in one body, and single hairs along its whole length, mark this
  ringed animal that lives on land or in water.
scope: Also called oligochaete, this ringed animal lives on land or in water, with both male and female
  parts in one body and single hairs along its whole length.
examples:
- The oligochaete worm lived on land.
- An oligochaete worm lived in water.
