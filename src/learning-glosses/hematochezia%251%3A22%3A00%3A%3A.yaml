simpleMeaning: A weak pouch in the gut, cancer of the large gut, or a sore in the gut can leave blood
  in the stools that pass from the body.
scope: Also called haematochezia, this is blood in the stools that pass from the body.
examples:
- Blood in the stools pointed to hematochezia.
- Hematochezia can follow a sore in the gut.
