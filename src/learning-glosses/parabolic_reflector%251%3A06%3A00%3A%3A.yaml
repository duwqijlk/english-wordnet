simpleMeaning: With the source at its one centre point, this curved-in dish sends out a stream in straight
  lines, and gathers a stream coming in to that point.
scope: Also called a paraboloid reflector, this dish is set apart by its one centre point, where a stream
  starts or where one coming in is gathered.
examples:
- The parabolic reflector sent the light out in straight lines.
- A parabolic reflector gathered the light to one point.
