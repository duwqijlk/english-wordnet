simpleMeaning: a North American cicada that shows up in huge numbers only once in a long while, since
  its young take 13 to 17 turns of the seasons to grow up
scope: A cicada that shows up in huge numbers only after many years, also called a periodical cicada;
  not a cicada that comes out every summer and not a grasshopper.
examples:
- The seventeen-year locust came out in great numbers that summer.
- We heard the seventeen-year locust singing in the trees.
