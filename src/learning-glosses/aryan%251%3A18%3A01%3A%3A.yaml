simpleMeaning: In Nazi doctrine, a white person of northern European descent, said not to be a Jew
scope: A Nazi-era label for a white person of northern European descent, said not to be a Jew; not the
  ancient people who spoke Proto-Indo-European.
examples:
- Nazi officials used the word Aryan for people they counted as of northern European descent.
- The law said an Aryan could not be a Jew.
