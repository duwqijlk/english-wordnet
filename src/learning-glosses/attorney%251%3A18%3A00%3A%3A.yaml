senseId: 'attorney%1:18:00::'
synsetId: 10269647-n
simpleMeaning: a professional licensed to advise clients on legal matters and represent them in court
scope: This is the licensed legal professional who advises clients and speaks for them in court, not a
  judge, not a court clerk, and not the written power that lets one person act for another.
examples:
- The attorney advised her client to accept the settlement.
- He hired an attorney to defend him in court.
