simpleMeaning: soft, rough wood that can break into long thin pieces, from a tree of this kind, especially
  the western kind
scope: This is wood from this tree, especially the western kind; not the tree itself and not the poison
  made from a different plant with the same name.
examples:
- The cabin walls were made of western hemlock.
- He chose hemlock for the shelves, liking its rough, light wood.
