simpleMeaning: Care in which water, oxygen or a drug is put into the breathing tubes along with air breathed
  in.
scope: Care that puts water, oxygen or a drug into the breathing tubes with air breathed in, not a drug
  swallowed and not air alone.
examples:
- Inflation therapy helped her breathe in oxygen after the operation.
- Inflation therapy put oxygen into his breathing tubes.
