simpleMeaning: to let a sound come out of you so others can hear it, even if it is not a word
scope: 'Also called utter: making a sound others can hear, not giving off light or heat and not pushing
  gas out of a body.'
examples:
- She emitted a big heavy sigh as she sat down.
- He emitted strange sounds that nobody could make sense of.
