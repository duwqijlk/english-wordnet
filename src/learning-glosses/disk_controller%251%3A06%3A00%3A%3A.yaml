simpleMeaning: In computer science, a chip or set of wires that turns orders into a form that can run
  a hard drive.
scope: In computer science, a chip that turns orders into a form that runs a hard drive, not the drive
  itself and not a program.
examples:
- The disk controller sends the orders to the hard drive.
- A disk controller links the computer to its drive.
