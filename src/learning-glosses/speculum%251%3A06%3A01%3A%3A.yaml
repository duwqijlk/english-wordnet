simpleMeaning: a mirror, especially one made of metal that is rubbed smooth and shiny, for use in a tool
  that works with light
scope: This mirror, especially one made of smooth, shiny metal for a tool that works with light, is not
  the medical tool that opens a body passage so a doctor can look inside.
examples:
- The old telescope used a speculum of polished metal to catch the light.
- He cleaned the speculum before putting it back in the optical instrument.
