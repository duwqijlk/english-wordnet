simpleMeaning: A radio set on a ship that takes in calls and rings a bell when a call for help comes in
scope: This radio set on a ship rings a bell when a call for help comes in, and it is also called auto-alarm.
examples:
- The autoalarm sounded its bell when a call for help came in.
- The autoalarm rang as soon as the distress signal was received.
