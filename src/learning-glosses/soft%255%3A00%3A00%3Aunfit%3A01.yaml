simpleMeaning: Out of shape and physically weak, unable to put out effort or last through hard activity.
scope: This is poor physical condition and lack of strength, not a yielding texture, an easily hurt nature,
  or a gentle manner.
examples:
- After months without training, he had gone soft and could barely finish the run.
- The coach warned that the squad had grown soft over the winter break.
