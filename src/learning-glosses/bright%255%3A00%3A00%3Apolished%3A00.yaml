simpleMeaning: made smooth and glossy by rubbing, or as if by rubbing, so it throws back a shine or glow
scope: Use this for a surface that has been polished or rubbed to a shine, not for something that simply
  gives out light, and not for a light left undimmed.
examples:
- She kept the old silver tray bright by rubbing it with a soft cloth.
- The brass knocker was bright again after an hour of polishing.
