simpleMeaning: the water held inside a chemical compound that has taken in water
scope: The water held inside a chemical compound that has taken in water; water of crystallisation and
  water of hydration are other names for this sense, and it is not water merely mixed in from outside.
examples:
- The water of crystallization left the crystals as they dried.
- He measured the water of crystallization in the blue salt.
