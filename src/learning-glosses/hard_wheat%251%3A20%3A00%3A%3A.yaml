simpleMeaning: Bread and pasta are made from its tough dark grains, rich in gluten, the stretchy part
  of flour; grown chiefly in southern Russia, North Africa and north central North America.
scope: Also called durum, durum wheat and macaroni wheat, this is a grain with tough dark kernels used
  to make bread and pasta.
examples:
- Hard wheat gives bread its firm bite.
- Farmers in North Africa grow hard wheat for pasta.
