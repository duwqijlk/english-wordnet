synsetId: 00100771-n
simpleMeaning: A clever act that fools the eye and seems like real magic to people who do not know how
  it is done.
scope: Also called magic, trick, illusion, deception, thaumaturgy, conjuration, legerdemain, and magic
  trick; a clever act that looks like real magic, not real magic and not a cheating trick.
examples:
- The conjuring trick made the coin vanish from his hand.
- Children gasped at the conjuring trick.
