simpleMeaning: a small hollow or bend that breaks the flat look of a surface
scope: 'Also called a line, a wrinkle, a furrow, a crease, or a crinkle: a small hollow or bend in a smooth
  surface, not a band of rock or coal worth digging out.'
examples:
- A seam crossed the smooth face of the stone.
- His face had many seams from years in the sun.
