simpleMeaning: A mechanical tool that shoe fitters use to measure how long and how wide a foot is
scope: A measuring tool used by shoe fitters to find the length and width of a foot, not a ruler for cloth
  and not a shoehorn for putting shoes on.
examples:
- The fitter slid my foot onto the size stick to check its length.
- She read the size stick and brought a pair one size wider.
