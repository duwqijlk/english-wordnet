simpleMeaning: Tiny air holes are put into this soft, springy padding while it is still soft, before it
  hardens, so it can pad seats and furniture.
scope: In a chair or a sofa, this is the soft, springy padding full of tiny air holes.
examples:
- The foam rubber in the sofa had gone flat with age.
- She cut a piece of foam rubber to pad the chair seat.
