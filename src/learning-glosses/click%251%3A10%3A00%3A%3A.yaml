simpleMeaning: a speech sound (a consonant) made by pulling air into the mouth, as in Bantu, where the
  flow of air is stopped
scope: This is a speech sound made in the mouth, not the press on a mouse button and not the part on a
  wheel.
examples:
- In that language, a click is made by pulling air into the mouth.
- The click in the word is a consonant made with a pull of air in the mouth.
