simpleMeaning: Care for sick people who have little money, paid for by the country and by the states.
scope: This is care for the sick who have little money, paid for by the country and the states, not care
  paid for by one person alone.
examples:
- Medicaid paid for her care when she had no money.
- He got his medicine through Medicaid.
