simpleMeaning: having paranoia, a state of mind in which a person wrongly fears that others want to harm
  them
scope: This is a word that describes a person who suffers from paranoia, not the name for such a person.
examples:
- He grew paranoid and thought everyone was against him.
- After the break-in, she felt paranoid about every noise at night.
