simpleMeaning: With a grey-blue coat, this yellow-flowered herb of Europe and Asia is now at home along
  the sandy shores of eastern North America.
scope: Also called horned poppy, sea poppy, and yellow horned poppy, it is the yellow-flowered herb with
  a grey-blue coat that grows along the sandy shores of eastern North America.
examples:
- Horn poppy grows along the sandy shore.
- The horn poppy showed yellow flowers on the shore.
