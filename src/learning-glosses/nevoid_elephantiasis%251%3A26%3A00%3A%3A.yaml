simpleMeaning: skin that grows thicker, most often on one arm or leg only, because the lymph tubes are
  swollen from birth and blocked
scope: 'Also called pachyderma: skin that grows thicker, most often on one arm or leg only, because the
  lymph tubes are swollen from birth and blocked; not a swelling caused by a cut and not a skin rash.'
examples:
- Nevoid elephantiasis made the skin of his left leg grow thick.
- The doctor said the nevoid elephantiasis came from lymph tubes swollen since birth and blocked.
