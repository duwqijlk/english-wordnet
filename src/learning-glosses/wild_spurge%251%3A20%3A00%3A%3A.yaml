simpleMeaning: a common plant of the United States that lives for many years and has bright white leaves
  like petals
scope: 'Also called flowering spurge and tramp''s spurge: a common plant of the United States with bright
  white leaves like petals, not other plants of the same family and not a garden flower.'
examples:
- Wild spurge grew along the fence, its bright white bracts easy to spot.
- The wild spurge in the meadow comes back year after year.
