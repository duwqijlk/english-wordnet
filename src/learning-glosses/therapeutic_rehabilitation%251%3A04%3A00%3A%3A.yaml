simpleMeaning: help for people with disabilities, given to take away or lessen what keeps them from doing
  things
scope: 'Also called physical rehabilitation and physical restoration: help that takes away or lessens
  disabilities, not care that cures a sickness and not a stay in hospital.'
examples:
- After the accident, therapeutic rehabilitation helped him walk again.
- The hospital offers therapeutic rehabilitation for people with disabilities.
