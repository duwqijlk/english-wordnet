simpleMeaning: At a formal ceremony, bring a young woman into adult society, or formally bring forward
  a country's representative.
scope: Not the military salute and not the giving of a gift; here someone is officially brought forward
  at a ceremony.
examples:
- She was presented at court the year she turned eighteen.
- The new ambassador was presented to the queen at a formal reception.
