simpleMeaning: to speak to or ask someone again and again, with many words, questions, or requests that
  do not stop
scope: 'Also called bombard: to keep speaking to or asking someone without stopping, not the noun sense
  for a fast, non-stop stream of spoken or written words.'
examples:
- Reporters barraged the minister with questions after the speech.
- Fans barraged the office with calls asking for tickets.
