senseId: fossilised%5:00:00:inflexible:02
synsetId: 01029012-s
simpleMeaning: Stuck in a fixed old way of acting, living, or thinking, and not willing to change.
scope: Stuck in a fixed old way of acting or thinking; fossilized and ossified are other names for this
  sense, not a thing made of stone and not a habit that is merely old.
examples:
- His fossilised views on work never changed in forty years.
- The fossilised rules of the club kept new members out.
