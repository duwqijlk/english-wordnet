simpleMeaning: A fragrant shrub of western alkali flats, with upright, flexible, hairy stems and yellow
  flower clusters; hares hide in it and the Navajo get yellow dye from it.
scope: This is the sweet-smelling yellow-flowered shrub of western alkali plains, also called rabbit brush,
  not a garden ornamental or a hare's burrow.
examples:
- In late summer the rabbit bush on the flats is covered in small yellow flowers.
- Hares shelter under rabbit bush out on the open plain.
