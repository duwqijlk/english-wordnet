simpleMeaning: A thousand things counted together, in particular a thousand years
scope: A thousand things counted together, in particular a thousand years; not the number one thousand
  on its own and not a single thousand-year age.
examples:
- The list named a millenary of soldiers who had served.
- A millenary of years had passed since the founding of the kingdom.
