senseId: 'amitosis%1:22:00::'
synsetId: 13451247-n
simpleMeaning: a plain way for a cell to split in two, where its centre divides in two without first forming
  chromosomes, the parts that carry what the cell passes on
scope: A plain way for a cell to divide, not the common way in which chromosomes form first and then split
  apart.
examples:
- During amitosis the nucleus simply splits in two.
- Amitosis lets some cells divide without making chromosomes first.
