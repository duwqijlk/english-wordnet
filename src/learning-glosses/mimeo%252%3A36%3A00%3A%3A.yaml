simpleMeaning: To print more copies from a stencil that is ready to use, with a machine that presses ink
  through it
scope: 'Also called mimeograph: to print copies from a stencil, not the machine that does the printing,
  not to print from a plate and not to copy by hand.'
examples:
- She mimeoed the handouts for the class.
- The teacher mimeoed the test on the old machine.
