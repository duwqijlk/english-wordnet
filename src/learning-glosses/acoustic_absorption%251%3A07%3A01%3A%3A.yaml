simpleMeaning: In acoustics, when sound waves hit it, a thing, a built shape, or an object takes in sound
  energy instead of bouncing the energy back
scope: In acoustics, it is the way a thing, a built shape, or an object takes in sound energy when sound
  waves hit it, not the bouncing back of that energy.
examples:
- The acoustic absorption of the hall kept echoes down.
- Thick curtains raised the acoustic absorption of the room.
