simpleMeaning: be closely connected to and matter for a particular case, so it can be applied to it
scope: This is not about physically gripping something or keeping it in place; it is about a rule, fact,
  or argument applying to a situation.
examples:
- This rule holds for every member of the club, without exception.
- The same reasoning holds for smaller companies.
