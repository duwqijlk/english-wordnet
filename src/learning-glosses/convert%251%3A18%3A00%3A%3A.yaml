simpleMeaning: a person who has changed to a different faith or to different ideas about how a country
  should be run
scope: This is a person who has taken a new faith or new political ideas, not the act of changing faith
  and not scoring extra points in a game after a main score.
examples:
- As a convert, he now goes to the mosque every Friday.
- She is a new convert to the party and speaks for it with great energy.
