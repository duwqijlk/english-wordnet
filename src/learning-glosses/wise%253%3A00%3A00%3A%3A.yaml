simpleMeaning: having, or coming from, deep knowledge and a clear way of seeing what is true and right
scope: This sense is about deep knowledge and seeing clearly what is true. It is broader than the close
  rival sense about making good choices in everyday, practical matters.
examples:
- A wise leader listens to others before he acts.
- She gave a wise and clear comment on the problem.
