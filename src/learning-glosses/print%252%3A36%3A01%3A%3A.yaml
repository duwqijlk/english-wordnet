simpleMeaning: to make a picture on paper from a photographic negative (a piece of film that shows light
  parts dark and dark parts light)
scope: Making a picture on paper from a film negative; not making copies of words or pictures, and not
  writing by hand.
examples:
- Print the negative so we can see the photograph on paper.
- He printed a clear picture from the film negative for the album.
