simpleMeaning: A drug taken by mouth, sold as Mevacor, that lowers the amount of fat-like matter in the
  blood, used when a change of food has not worked.
scope: This is a drug taken by mouth to lower blood cholesterol when food changes have not worked, not
  a drug put on the skin and not food alone.
examples:
- The doctor gave her lovastatin to lower her cholesterol.
- He takes lovastatin each morning with breakfast.
