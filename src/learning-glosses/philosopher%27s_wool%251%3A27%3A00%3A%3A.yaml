simpleMeaning: This white powder colours paints and things put on the skin, and goes into glass, inks,
  and a healing skin cream; it is zinc joined with oxygen.
scope: It is also called flowers of zinc, philosophers' wool, and zinc oxide, and it is a white powder
  of zinc joined with oxygen.
examples:
- The painter mixed philosopher's wool into the white paint.
- Philosopher's wool went into the zinc ointment.
