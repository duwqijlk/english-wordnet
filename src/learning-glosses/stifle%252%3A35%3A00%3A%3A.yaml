senseId: 'stifle%2:35:00::'
synsetId: 01571411-v
simpleMeaning: to stop a feeling or sound from showing, so that it stays hidden from other people
scope: 'This sense is also called muffle, strangle, smother and repress: holding back a feeling or sound
  to hide it, not stopping breathing and not making something weaker.'
examples:
- She stifled a yawn during the meeting.
- He stifled his anger and said nothing.
