simpleMeaning: a machine, usually worked by a computer, that draws lines to make graphs or pictures
scope: This is the drawing machine, not a person who makes a plan for action, and not a clerk who marks
  data on a chart.
examples:
- The plotter drew a detailed map on the wide paper.
- We used a plotter to draw the building plans.
