simpleMeaning: to get the state's sole right over a new thing one has made, so that no one else may make,
  use, or sell it
scope: To get the state's sole right over a new thing, not to show a paper and not to make a thing plain
  to see.
examples:
- Should I patent this invention?
- She patented her new lock before anyone else could copy it.
