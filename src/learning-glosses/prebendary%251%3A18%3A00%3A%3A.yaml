simpleMeaning: Serving a church, this priest is paid money by the church for his work
scope: Serving a church, this priest is paid money by the church for his work, not a priest who works
  for nothing and not a church worker who is not a priest.
examples:
- The prebendary took his seat in the cathedral.
- As a prebendary, he was paid by the church for his service.
