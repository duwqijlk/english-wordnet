simpleMeaning: Into the blood tube at the base of the brain drains a blood tube that runs with the blood
  tube at the front of the brain.
scope: Also called anterior cerebral vein, this blood tube drains into the blood tube at the base of the
  brain, running with the blood tube at the front of the brain rather than being that tube itself.
examples:
- The vena cerebri anterior runs with the anterior cerebral artery.
- Blood from the vena cerebri anterior drains into the basal vein.
