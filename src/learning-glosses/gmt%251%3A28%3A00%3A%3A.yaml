simpleMeaning: The local time at the 0 meridian through Greenwich in England, the same everywhere.
scope: Also called universal time, UT, Greenwich Mean Time, Greenwich Time, and UT1; the local time at
  the 0 meridian through Greenwich, the same everywhere, set beside local clock times that change from
  place to place.
examples:
- The ship set its clocks by GMT, the same everywhere.
- GMT is the local time at the 0 meridian through Greenwich.
