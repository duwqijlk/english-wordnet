simpleMeaning: upsetting people because it goes against what they think is right, and harming how people
  think of a person
scope: 'Also called shocking, shameful and disgraceful: it describes acts or things that upset people
  by going against what is right and harm a person''s good name, not just something surprising or bad.'
examples:
- His scandalous behavior shocked everyone at work.
- The newspaper printed a scandalous story about the mayor's private life.
