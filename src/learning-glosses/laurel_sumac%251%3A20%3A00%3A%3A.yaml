simpleMeaning: a small sweet-smelling shrub from California that keeps its leaves all year, with branched
  leaf clusters and whitish berries; some plant books put it in the Rhus group
scope: A small evergreen shrub from California, not a tree and not another kind of sumac.
examples:
- The laurel sumac by the trail keeps its leaves all winter.
- We picked whitish berries from the laurel sumac near the house.
