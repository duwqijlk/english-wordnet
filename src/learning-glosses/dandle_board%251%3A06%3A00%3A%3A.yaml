simpleMeaning: A toy made of a flat piece set on a middle support, so children at the two ends can ride
  it up and down.
scope: A toy for children to ride up and down; teeter and seesaw are other names for it, not a swing and
  not a slide.
examples:
- The children took turns on the dandle board in the playground.
- She sat at one end of the dandle board while her brother sat at the other.
