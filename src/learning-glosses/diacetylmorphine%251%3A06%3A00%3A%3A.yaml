simpleMeaning: The fastest, strongest rush comes from shooting this drug into a vein; it is a hard drug
  made from morphine, and people get hooked on it fast
scope: Also called heroin; not other drugs made from morphine that act more slowly.
examples:
- Diacetylmorphine gave him the fastest rush he had ever felt.
- She was warned that diacetylmorphine is highly addictive.
