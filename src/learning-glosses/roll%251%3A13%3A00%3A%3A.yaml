simpleMeaning: a small round bun, either plain or sweet
scope: This sense is a small round bread bun, plain or sweet; it is not a tube-shaped object wound from
  paper or film, and not a bundle of banknotes.
examples:
- She bought a warm roll and a coffee on her way to work.
- The bakery makes sweet rolls with cinnamon and icing.
