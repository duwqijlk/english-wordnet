simpleMeaning: Men wear this tall covering for dress; a high crown rises above the head, and silk or beaver
  fur most often covers it.
scope: This tall covering for dress is also called a beaver, a stovepipe, a topper, a dress hat, a high
  hat, an opera hat, or a silk hat.
examples:
- The top hat was brushed and put on.
- The magician pulled a rabbit out of a top hat.
