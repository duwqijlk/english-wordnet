simpleMeaning: 'European weed established in the southwestern United States and Mexico: reddish sprawling
  stems, small fernlike leaves, small deep reddish-lavender flowers, slender upright fruits; often grown
  as fodder.'
scope: This is the low, reddish-stemmed desert weed grown as fodder, also called pin clover and pin grass;
  it is not one of the tall ornamental storksbills of gardens.
examples:
- Redstem storksbill had taken over the edges of the vegetable plot.
- The botanist pointed out redstem storksbill growing among the alfalfa.
