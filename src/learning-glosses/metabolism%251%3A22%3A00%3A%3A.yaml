simpleMeaning: the natural work inside a cell or a living thing that keeps it alive
scope: This is the work that goes on inside a living thing and keeps it alive, not the fast change of
  a young animal into its grown form.
examples:
- Exercise can speed up your metabolism, the work your body does to stay alive.
- Doctors checked her metabolism to see how her body was keeping itself alive.
