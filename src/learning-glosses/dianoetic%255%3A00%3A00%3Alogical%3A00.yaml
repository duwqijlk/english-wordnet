simpleMeaning: coming to an answer by clear thinking and reasons, not by a sudden feeling
scope: This is thinking that works step by step to an answer; discursive is another name for this sense,
  not a sudden guess and not a feeling with no reasons.
examples:
- Her dianoetic approach worked through each fact before she gave her answer.
- The dianoetic case was built on reasons, not on a hunch.
