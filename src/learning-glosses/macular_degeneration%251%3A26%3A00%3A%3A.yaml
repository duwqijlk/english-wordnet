senseId: 'macular_degeneration%1:26:00::'
synsetId: 14280150-n
simpleMeaning: A disease of the eye in which the cells of the yellow spot at the centre of the retina
  break down, so sight grows blurred and can be lost.
scope: A disease of the eye in which the yellow spot breaks down and sight blurs; not a disease of the
  lens and not a sudden loss of sight.
examples:
- Macular degeneration made it hard for her to read.
- His macular degeneration was found at a routine eye test.
