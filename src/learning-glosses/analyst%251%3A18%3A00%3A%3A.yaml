simpleMeaning: a person who is good at looking closely at facts and figures to work out what they mean
scope: A person who studies data to find what it means, not a financial expert who advises on business
  and not a psychoanalyst.
examples:
- The analyst studied the sales figures for the whole year.
- An analyst can spot patterns in the data that others miss.
