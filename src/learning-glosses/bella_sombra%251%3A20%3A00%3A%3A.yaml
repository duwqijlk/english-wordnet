simpleMeaning: Soft stems, a wide trunk full of water, and dark green egg-shaped leaves mark this fast-growing
  tree of South America, green all year.
scope: Also called an ombu, this fast-growing tree of South America stays green all year, with soft stems,
  a wide trunk full of water, and dark green egg-shaped leaves.
examples:
- The bella sombra grew fast and stayed green all year.
- A bella sombra stood with a wide trunk full of water.
