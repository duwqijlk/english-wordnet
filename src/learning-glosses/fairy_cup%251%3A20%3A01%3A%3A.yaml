scope: This sense is a miterwort of north-eastern North America, usually with two facing leaves on upright
  flowering stems ending in upright sprays of white flowers, unlike the sense for a scarlet European fungus
  with a cup-shaped ascocarp.
examples:
- The fairy cup grows in the north-east.
- Fairy cups bear white flowers.
