simpleMeaning: One of several kinds of South African Ixia, grown widely for its grassy leaves and sprays
  of flowers in many bright colours that resemble lilies.
scope: A South African Ixia grown for lily-like flowers, not maize and not a true lily.
examples:
- Corn lily brings vivid colour to garden borders in late spring.
- The corn lily's grassy leaves stay green after its flowers fade.
