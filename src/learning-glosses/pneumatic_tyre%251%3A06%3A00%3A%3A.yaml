simpleMeaning: Round a wheel, a ring of tough rubber pumped up with air carries motor vehicles and bikes
  and the like.
scope: A pneumatic tire is another name for this air-filled ring of tough rubber round a wheel, used on
  motor vehicles and bikes and the like.
examples:
- The pneumatic tyre on the back wheel went flat.
- A pump can put air back into a flat pneumatic tyre.
