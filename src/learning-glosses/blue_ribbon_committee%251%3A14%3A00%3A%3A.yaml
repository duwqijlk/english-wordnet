simpleMeaning: A small group, set up on its own and made of fair-minded public figures and experts, takes
  on a big question of government.
scope: This group is also called blue ribbon commission.
examples:
- The blue ribbon committee took up the question.
- A blue ribbon committee asked hard questions about the issue.
