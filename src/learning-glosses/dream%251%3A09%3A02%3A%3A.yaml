senseId: 'dream%1:09:02::'
synsetId: 05776803-n
simpleMeaning: imaginative thoughts that you let yourself enjoy while you are awake rather than asleep.
scope: This is not the pictures you see during sleep, and it is not a firm hope for the future; it is
  imagining while awake.
examples:
- The lecture faded as he drifted into a dream about mountains.
- She stared out of the window, deep in a dream about flying.
