simpleMeaning: a doctor whose special work is to help people with problems of the mind
scope: This doctor is also called a psychiatrist. It is a doctor for problems of the mind, not a doctor
  for the body in general, and not the act of getting smaller.
examples:
- She went to a shrink to talk about her fears.
- The shrink listened and helped him sleep better.
