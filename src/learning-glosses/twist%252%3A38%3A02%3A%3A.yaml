simpleMeaning: to perform the lively 1960s dance in which the hips and arms swing to the music
scope: This is the verb for performing the 1960s dance, not the dance itself as a noun, not a single turn
  made in place, and not shaping dough into coiled strands.
examples:
- The band struck up an old rock song and the crowd began to twist.
- She twisted across the dance floor with a broad grin.
