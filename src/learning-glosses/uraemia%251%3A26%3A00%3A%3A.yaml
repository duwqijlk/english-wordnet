simpleMeaning: a build-up in the blood of waste made of nitrogen (urea) that is usually passed out in
  the urine
scope: 'Also called azotaemia, azotemia and uremia: a build-up of waste in the blood that is usually passed
  out in the urine, not a build-up of waste in the urine itself and not a kidney stone.'
examples:
- The test showed uraemia in his blood.
- She was treated for uraemia after her kidneys stopped working well.
