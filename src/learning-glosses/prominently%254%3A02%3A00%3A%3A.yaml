simpleMeaning: in a way that is easy to see and notice
scope: Shown so people can see it clearly and notice it at once, not hidden away or placed where it is
  hard to see.
examples:
- The new car was prominently displayed in front of the shop.
- Her name was printed prominently at the top of the page.
