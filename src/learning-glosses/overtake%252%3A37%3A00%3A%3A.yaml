senseId: 'overtake%2:37:00::'
synsetId: 01813288-v
simpleMeaning: to fill a person with strong feelings, or with things seen and heard, until they take hold
  of them
scope: 'Also called overwhelm, overcome, or overpower: feelings or sights and sounds that take hold of
  a person, not catching up with someone on a road.'
examples:
- Grief overtook her when she heard the news.
- The bright lights and loud music overtook him, and he could not think straight.
