simpleMeaning: A broad, spreading tree of Africa and southwest Asia, propped by low branches, whose clusters
  of edible but poor fruit grow on bare twigs; the Bible mentions it.
scope: This names the tree itself, the same tree the Bible calls the sycamore; it is not the plane tree
  with flaking bark, and not the maple with five-lobed leaves.
examples:
- A sycamore fig can grow very wide, with low branches that almost touch the ground.
- The sycamore fig is the tree that the Bible calls the sycamore.
