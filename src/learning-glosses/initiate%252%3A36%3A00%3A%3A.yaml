simpleMeaning: to be the first to start something and take part in the way it develops
scope: This sense is being the first to start something and taking part as it develops. It is not a person
  who has been let into a group for a field of study.
examples:
- This surgeon initiated heart operations that no one had tried before.
- She initiated a new plan for clean water and stayed to help it grow.
