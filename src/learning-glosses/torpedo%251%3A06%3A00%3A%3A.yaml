simpleMeaning: a long, round weapon that moves under water by its own power and blows up when it hits
  the thing it is aimed at
scope: This is the underwater weapon sense, not the small device on a railway track that warns a train
  driver, and not the large sandwich.
examples:
- The ship fired a torpedo at the enemy ship under the water.
- The torpedo hit the side of the ship and blew up.
