simpleMeaning: The male of this big antelope of India is steel-grey with white marks, while the female
  is brownish and has no horns.
scope: Also called nilgai, nylghai, or nylghau, this is a big antelope of India whose males are steel-grey
  with white marks and whose females are brownish and hornless.
examples:
- A blue bull stood close by, steel-grey with white marks.
- We saw a blue bull and a female, brownish and without horns, standing together.
