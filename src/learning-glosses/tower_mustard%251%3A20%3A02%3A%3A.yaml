simpleMeaning: Sometimes put in the group Turritis, this European plant has stiff stems that stand straight
  up.
scope: This European plant with stiff stems that stand straight up is also called tower cress, and it
  is sometimes put in the group Turritis, not the wide-spread plant of the genus Arabis.
examples:
- This tower mustard grew in Europe.
- This tower mustard sometimes goes in the group Turritis.
