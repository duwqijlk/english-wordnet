simpleMeaning: the act of bringing a thing or person in, so it counts as part of the whole
scope: The act of bringing something in, not the state of being in and not a small body inside a cell.
examples:
- The inclusion of her name on the list made her smile.
- His inclusion in the team surprised everyone.
