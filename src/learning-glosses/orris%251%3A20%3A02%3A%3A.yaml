simpleMeaning: A sweet-smelling underground stem of many kinds of iris, most of all the Florentine kind,
  used to scent perfumes and to make drugs.
scope: This is also called orrisroot, and it is a sweet-smelling underground stem of many kinds of iris,
  most of all the Florentine kind, used to scent perfumes and to make drugs, not the German iris plant
  itself.
examples:
- Perfumes take their sweet smell from orris.
- Medicines are made with orris.
