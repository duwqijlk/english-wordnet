simpleMeaning: A block of stretchy stuff, or of man-made stuff much like it, that rubs out pencil marks,
  often fixed to the end of a pencil
scope: A block for rubbing out pencil marks, not a birth-control cover and not the stretchy stuff itself.
examples:
- She rubbed out the wrong word with a rubber.
- The rubber on the end of his pencil was worn down.
