senseId: 'petitio_principii%1:09:00::'
synsetId: 05903421-n
simpleMeaning: a flaw in reasoning where the end point is taken as given from the start, also called begging
  the question
scope: A flaw in reasoning where the end point is taken as given from the start; petitio is another name
  for this sense, not a flaw in the facts and not a weak example.
examples:
- The speaker's petitio principii gave away the debate, since the first claim already held the last one.
- In his paper he used petitio principii, starting from the answer he wanted to reach.
