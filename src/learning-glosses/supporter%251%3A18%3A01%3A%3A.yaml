simpleMeaning: A person who gives what is needed to get a job done or to push a plan forward.
scope: 'Also called help, assistant, or helper: a person who gives what is needed to get a job done or
  push a plan forward, not a person who backs a politician or a team, not a person who stands up for a
  cause, and not a worn band or piece of clothing.'
examples:
- They hired additional supporters to finish the work.
- Her assistant was a true supporter through the long task.
