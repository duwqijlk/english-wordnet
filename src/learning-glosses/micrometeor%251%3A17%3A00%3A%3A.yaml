simpleMeaning: a tiny rock from space that drifts down to earth without getting very hot in the air
scope: A tiny rock from space that drifts down to earth, also called micrometeorite and micrometeoroid;
  not a big rock that burns bright in the sky and not a star.
examples:
- A micrometeor drifted down to earth without burning up.
- The tiny micrometeor landed softly on the roof.
