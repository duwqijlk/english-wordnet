simpleMeaning: any of many shrubs, herbs, or vines in the plant group called Solanum; most are poisonous,
  but many have fruit that people can eat
scope: This names plants in this group as a whole, from small herbs to climbing vines; it is about the
  living plant, not only its poison or its fruit.
examples:
- Nightshade grew wild at the edge of the field, and the farmer warned the children not to eat its berries.
- Some kinds of nightshade have fruit people can eat, but most kinds are poisonous.
