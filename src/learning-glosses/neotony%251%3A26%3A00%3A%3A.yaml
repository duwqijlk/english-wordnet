simpleMeaning: The state in which the grown members of a kind still keep the traits of their young.
scope: The state in which the grown members of a kind still keep the traits of their young, not a sickness
  and not a stage of growth.
examples:
- Neotony leaves the grown members of a kind with the traits of their young.
- In neotony, the adults of a kind keep young features.
