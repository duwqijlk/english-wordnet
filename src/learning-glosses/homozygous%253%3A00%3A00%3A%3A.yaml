senseId: 'homozygous%3:00:00::'
synsetId: 01204248-a
simpleMeaning: Having the same form of a gene at the matching spots on a pair of chromosomes
scope: Having matching gene forms at the same spots on a pair of chromosomes; not having two different
  forms there, and not a mix of the two.
examples:
- These two fruit flies are homozygous for red eye color.
- A homozygous plant passes the same gene form to all its young.
