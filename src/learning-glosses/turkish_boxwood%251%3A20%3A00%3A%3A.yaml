simpleMeaning: A very hard, tough, close-grained, light yellow wood from the box tree, and above all the
  common box; used for fine woodwork such as musical instruments, inlays and engraving blocks.
scope: This is a very hard, tough, close-grained, light yellow wood from the box tree, and above all the
  common box, also called boxwood; other hard woods used for fine woodwork are different kinds.
examples:
- Turkish boxwood is used for engraving blocks.
- Turkish boxwood is used to make musical instruments.
