simpleMeaning: the state of still being alive
scope: This is the state of being alive, not a thing that lives on from the past and not the natural process
  by which the living things best fit for their place stay alive.
examples:
- Survival was hard in the cold winter, but the whole family stayed alive.
- The doctors worked all night for the child's survival.
