simpleMeaning: words spoken or written that come fast and without stopping, in a large amount
scope: 'Also called onslaught, barrage and bombardment: a fast flow of spoken or written words that does
  not stop. Not the sense about a liquid pouring out.'
examples:
- The teacher faced an outpouring of questions as soon as class ended.
- Her letter was an outpouring of angry words about the plan.
