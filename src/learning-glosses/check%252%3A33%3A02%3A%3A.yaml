simpleMeaning: To choose not to be the first to bet.
scope: This is the betting move, not putting a chess king under attack, not a hunting dog changing prey,
  not examining something, not holding back a danger or an enemy, not marking a box, not leaving bags
  for safekeeping, and not blocking a hockey player.
examples:
- He checked rather than bet and saw the next card for free.
- With no bet in front of her, she checked.
