scope: A plant of southern Europe that lives for years, grown to feed farm animals and for the honey its
  flowers give.
examples:
- The farmer grew sulla to feed his cows and for the honey its flowers give.
- Sulla lives for years and bears pink flowers rich in sweet juice.
