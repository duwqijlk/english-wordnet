simpleMeaning: to use up time and get little or nothing done; to spend time doing nothing, or doing things
  in a way that wastes time
scope: Also called trifle and piddle. It means using time and getting nothing done, not acting cruelly
  and not living only for pleasure.
examples:
- He wantoned away the whole morning by the river, doing nothing.
- She wantoned away her afternoon and finished none of her work.
