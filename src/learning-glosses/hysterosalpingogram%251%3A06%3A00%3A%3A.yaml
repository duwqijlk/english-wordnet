senseId: 'hysterosalpingogram%1:06:00::'
synsetId: 03561176-n
simpleMeaning: Usually taken to find a block when a woman cannot get with child, it is an X-ray picture
  of the womb and the tubes that carry eggs.
scope: It is an X-ray picture of the womb and its tubes, not a look inside the womb with a tube.
examples:
- Her hysterosalpingogram showed that one tube was blocked.
- She had a hysterosalpingogram to check why she could not get with child.
