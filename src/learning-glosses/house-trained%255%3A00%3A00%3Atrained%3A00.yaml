simpleMeaning: When it needs to pass waste, this pet goes outside or to one set place, as it has been
  taught
scope: A pet taught to pass waste outside or in one set place, also called housebroken; not a wild animal
  and not a pet that fouls indoors.
examples:
- Our house-trained puppy waits by the door when it needs to go out.
- The house-trained cat uses its litter tray every time.
