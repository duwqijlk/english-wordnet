simpleMeaning: A dish of cooked cracked wheat, made in the place of rice, and usually with no meat
scope: A dish of cooked cracked wheat, usually with no meat; not a rice dish and not a meat dish.
examples:
- She served bulgur pilaf with the roast vegetables.
- The bulgur pilaf had no meat in it.
