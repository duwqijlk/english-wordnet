simpleMeaning: An acute illness with fever and swollen lymph nodes, plus an excess of certain white blood
  cells; it is not very contagious, and some believe kissing can spread it.
scope: Another name for this illness is infectious mononucleosis, often shortened to mono, and it is also
  nicknamed kissing disease; it is not monocytosis, a separate condition with raised monocyte numbers.
examples:
- Mononucleosis made him so tired that he slept twelve hours a day.
- Her mononucleosis was diagnosed after a blood test showed unusual white cells.
