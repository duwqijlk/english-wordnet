simpleMeaning: To take cleaned cocaine by setting it alight and breathing in the smoke.
scope: To take cleaned cocaine by burning it and breathing in the smoke; base is another name for this
  sense, not to take cocaine in other ways and not to smoke tobacco.
examples:
- He learned to free-base at a party and soon could not stop.
- They would free-base the drug in a back room.
