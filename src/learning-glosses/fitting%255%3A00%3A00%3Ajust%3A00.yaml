simpleMeaning: exactly and fully right
scope: This means exactly right for a need or place; it is not the act of changing something, and not
  only right for the feelings of people at an event.
examples:
- It was fitting that the oldest worker should speak first.
- Winning the prize was a fitting reward for years of hard work.
