simpleMeaning: a pain in the head that comes back again and again, tied to histamine, a substance the
  body lets out of its cells
scope: 'Also called a histamine headache: a pain in the head that comes back again and again, not a one-off
  pain in the head and not a migraine.'
examples:
- His cluster headache woke him in the night with a sharp pain behind one eye.
- A cluster headache can come back at the same time each day for weeks.
