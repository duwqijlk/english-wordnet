simpleMeaning: No clear slanting line shows on the smooth, close top of the cloth, because the threads
  that run across it cross those that run down it.
scope: A smooth way of crossing cloth threads with no slanting line, not a twill.
examples:
- This satin weave feels smooth, with no slanting line to be seen.
- The cloth has a satin weave, so its surface is smooth and close.
