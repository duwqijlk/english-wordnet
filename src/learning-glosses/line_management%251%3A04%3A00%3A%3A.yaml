simpleMeaning: The running of the work that adds directly to what an organization produces.
scope: Running the work that makes what a firm puts out, not running the firm's money and not giving advice
  from outside the firm.
examples:
- Line management decided to add a night shift at the plant.
- Good line management keeps the work that makes the goods on track.
