simpleMeaning: Using, or done by, a maths way of working that uses algebra, maths with symbols for numbers,
  and calculus, maths about how things change
scope: This maths sense uses algebra and calculus, not the grammar sense that uses extra words, and not
  the sense that means breaking a whole thing into parts to study it.
examples:
- Analytic geometry uses algebra to study shapes.
- He used analytic methods, with algebra and calculus, to solve the problem.
