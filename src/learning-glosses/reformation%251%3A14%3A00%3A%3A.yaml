simpleMeaning: A church movement of the 1500s that began as a bid to put right the Roman Catholic Church
  and ended with the birth of Protestant churches.
scope: Also called Protestant Reformation; the 1500s movement that tried to reform the Roman Catholic
  Church, not the founding of the Catholic Church.
examples:
- The Reformation split western Europe.
- Luther's ideas set off the Reformation.
