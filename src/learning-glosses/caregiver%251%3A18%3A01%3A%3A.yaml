simpleMeaning: A person who helps find, stop, or treat sickness or a problem that limits what a person
  can do
scope: A person who helps find, stop, or treat sickness or a problem that limits what a person can do,
  not a person who simply looks after a child or a home.
examples:
- The caregiver helped the old man take his medicine.
- As a caregiver, she looked after patients in their homes.
