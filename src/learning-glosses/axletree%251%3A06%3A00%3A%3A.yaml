senseId: 'axletree%1:06:00::'
synsetId: 02768033-n
simpleMeaning: Under a carriage or wagon sits a fixed bar whose short pins at each end let the wheels
  turn round them.
scope: It is the fixed bar under a carriage or wagon whose short end pins carry the wheels, not a bar
  that turns with them.
examples:
- The axletree held the two front wheels of the wagon.
- He greased the axletree so the wheels would turn freely.
