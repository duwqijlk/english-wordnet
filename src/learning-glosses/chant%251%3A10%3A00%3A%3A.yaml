simpleMeaning: A song that goes over the same note again and again, with as many parts of words as are
  needed put on that one note
scope: A song that stays on one note, not the act of saying words aloud and not a tune with many notes.
examples:
- The monks sang a chant at dawn.
- The chant held every word to the same low note.
