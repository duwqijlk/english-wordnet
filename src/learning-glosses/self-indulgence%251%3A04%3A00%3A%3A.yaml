senseId: 'self-indulgence%1:04:00::'
synsetId: 00748969-n
simpleMeaning: Above all in strong feeling or in giving in, going too far in what you do means giving
  in too much to what the body wants.
scope: This is also called intemperance and intemperateness, and it is the going too far in what you do
  and giving in too much to what the body wants.
examples:
- Their self-indulgence showed in what they did.
- Their language showed self-indulgence.
