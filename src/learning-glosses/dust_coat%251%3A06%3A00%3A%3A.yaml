simpleMeaning: a loose outer garment, like a long frock, that reaches down to the ankles
scope: A loose outer garment reaching down to the ankles, also called a smock, a duster, a gabardine,
  and a gaberdine; not a short jacket and not a raincoat that keeps rain out.
examples:
- She wore a dust coat over her dress while cleaning.
- His dust coat reached down to his ankles.
