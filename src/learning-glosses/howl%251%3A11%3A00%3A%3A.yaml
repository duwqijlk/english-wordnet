simpleMeaning: a loud noise that goes on for some time and sounds like the cry of a dog
scope: This is a loud sound that is like a dog's cry, not the real cry of a dog or a wolf itself, and
  not the verb senses about making a loud noise.
examples:
- The howl of the wind kept us awake all night.
- The howl of the storm grew louder and louder.
