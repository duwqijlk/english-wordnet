senseId: 'line_of_longitude%1:15:00::'
synsetId: 08616379-n
simpleMeaning: an unseen great circle on the earth's surface that runs through the north and south poles
  at right angles to the equator
scope: An unseen great circle through the poles at right angles to the equator; meridian is another name
  for this sense, not a circle round the earth parallel to the equator and not a line drawn on a map.
examples:
- All points on the same line of longitude have the same longitude.
- The ship's line of longitude told the captain how far east he had sailed.
