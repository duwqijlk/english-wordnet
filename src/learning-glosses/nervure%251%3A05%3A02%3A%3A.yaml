simpleMeaning: One of the hard thin ribs that stiffen an insect's wing and hold it up.
scope: One of the hard thin ribs that stiffen an insect's wing and hold it up, not a rib in a leaf; also
  called vein.
examples:
- The nervure stiffens the insect's wing.
- Each nervure is a hard thin rib that holds the wing up.
