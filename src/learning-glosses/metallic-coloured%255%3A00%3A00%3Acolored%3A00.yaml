simpleMeaning: Shining with the colour of iron, steel, or a like hard substance
scope: It is a colour that shines like a hard substance such as iron or steel, also called metal-colored,
  metal-coloured and metallic-colored; dull grey and a colour with no shine at all are different.
examples:
- The metallic-coloured car stood out in the car park.
- He chose metallic-coloured tiles for the roof.
