simpleMeaning: a wild duck that feeds at the top of the water and does not dive, and that ducks kept by
  people come from; it is found in many places
scope: A wild duck, found in many places, that feeds at the top of the water and is the kind that ducks
  kept by people come from, not a duck kept by people and not a diving duck.
examples:
- A mallard swam on the pond, dipping its head to feed at the top of the water.
- Mallards live in many places, and ducks kept by people come from this wild kind.
