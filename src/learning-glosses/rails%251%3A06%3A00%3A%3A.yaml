simpleMeaning: a single bar or two bars side by side of rolled steel, laid out so railroad cars or other
  vehicles can roll along them
scope: 'Also called track, rail, or runway: the steel bars trains roll on, not the train itself and not
  a road.'
examples:
- The rails gleamed in the morning sun.
- Workers replaced the old rails along the track.
