simpleMeaning: a band of rock that holds metal, or of coal, in the ground, thick enough for digging it
  out to pay
scope: 'Also called a bed: a band of rock that holds metal, or of coal, worth digging out, not a small
  dip or fold in a smooth surface.'
examples:
- The miners found a rich seam of coal deep underground.
- They worked the seam until it no longer paid to dig.
