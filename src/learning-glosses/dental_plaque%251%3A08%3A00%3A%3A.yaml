simpleMeaning: Slime and germs build up as a coat on teeth, and help tooth decay start.
scope: This is also called bacterial plaque, and is a coat on teeth, not the decay it helps to start.
examples:
- The dentist scraped the dental plaque off her teeth.
- Brushing twice a day keeps dental plaque from building up.
