simpleMeaning: writing such as stories, poems and plays, made as art and known and thought good and of
  real worth
scope: This sense is the written works themselves, made as art. It is not the school or university study
  of such works.
examples:
- Her poems are now read as great literature in many countries.
- This old story is a fine piece of literature, loved for its art.
