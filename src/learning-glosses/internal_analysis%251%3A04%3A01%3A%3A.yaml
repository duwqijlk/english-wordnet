simpleMeaning: A look at what a group does well and badly, looking only at things inside the group itself.
scope: A look at what a group does well and badly, looking only at things inside the group itself; not
  a look at outside rivals and markets, and not a look at one product alone.
examples:
- The internal analysis showed the firm was short of cash.
- An internal analysis lists what the firm does well and badly.
