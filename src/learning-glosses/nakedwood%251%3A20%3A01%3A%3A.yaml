simpleMeaning: With thin scaly bark and a heavy dark centre to the trunk, it is one of several small to
  medium-sized trees of Florida and the West Indies.
scope: It is one of several small to medium-sized trees of Florida and the West Indies, and what marks
  it out is thin scaly bark and a heavy dark centre to the trunk.
examples:
- The nakedwood stood among the trees of Florida.
- The nakedwood's heartwood was heavy and dark.
