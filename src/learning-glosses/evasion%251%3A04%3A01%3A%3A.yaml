senseId: 'evasion%1:04:01::'
synsetId: 00742010-n
simpleMeaning: not doing something you should do that you do not like, for example by cheating or tricking
  people instead
scope: 'Also called escape and dodging: not doing a duty you do not like. This is not running away from
  a person or place, and not words that hide an unpleasant truth.'
examples:
- His evasion of the work he hated was clear when he lied to get out of it.
- Her evasion of her clear duty upset her boss.
