simpleMeaning: a spread of numbers in which each value turns up just as often as any other
scope: A spread of numbers where each value turns up as often as any other, not a spread where some values
  turn up more often and not a single number on its own.
examples:
- The equidistribution of the rolls showed each number came up about the same number of times.
- In an equidistribution, no value is more common than the rest.
