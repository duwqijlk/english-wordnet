simpleMeaning: having the body made of like parts that follow one another, as in earthworms or lobsters
scope: Having the body made of like parts that follow one another, as in earthworms or lobsters; segmented
  and segmental are other names for this sense, not a body in one piece, and not a body with unlike parts.
examples:
- Earthworms are metameric, their bodies made of like parts in a row.
- The metameric body of the lobster is split into like parts.
