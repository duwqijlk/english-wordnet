senseId: 'cornerstone%1:09:00::'
synsetId: 05801562-n
simpleMeaning: the most basic ideas that are taken as true, from which something is started, built, worked
  out, or explained
scope: Also called basis, base, foundation, groundwork, and fundament. This is the basic ideas something
  starts from, not a real stone at a building's corner and not the special stone laid for a new building.
examples:
- Free speech is a cornerstone of the country's system of government.
- Trust is the cornerstone on which the whole team was built.
