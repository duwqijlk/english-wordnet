simpleMeaning: a lichen in which the fungus part makes its tiny seeds on special cells
scope: A lichen with this kind of fungus in it, not the fruiting part of a fungus and not a lichen with
  a different kind of fungus.
examples:
- The basidiolichen grew as a thin crust on the old stone wall.
- This basidiolichen looks like a pale patch on the tree bark.
