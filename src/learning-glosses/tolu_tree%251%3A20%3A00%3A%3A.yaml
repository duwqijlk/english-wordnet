simpleMeaning: a mid-sized tree of warm America whose sticky sap and fragrant hard wood go into fine furniture
  and cabinet work
scope: Also called the tolu balsam tree; a mid-sized tropical American tree, not a pine and not a fruit
  tree.
examples:
- A tolu tree shaded the workshop yard.
- The tolu tree gave wood for the new table.
