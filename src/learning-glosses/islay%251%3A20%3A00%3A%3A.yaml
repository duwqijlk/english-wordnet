simpleMeaning: A wild plum from California that keeps its leaves all year, with prickly tough leaves and
  white flowers.
scope: A wild plum from California that keeps its leaves all year, with prickly tough leaves and white
  flowers; evergreen cherry, holly-leaf cherry and holly-leaved cherry are other names for this sense,
  not a garden plum and not a cherry tree.
examples:
- Islay grows wild along the California coast.
- The islay was covered in white flowers in spring.
