simpleMeaning: Room for the tear tubes to pass is left by this small thin hard piece, easily broken, which
  forms part of the front inner walls of each eye hollow.
scope: This small thin hard piece forms part of the front inner walls of each eye hollow and leaves room
  for the tear tubes to pass.
examples:
- The lacrimal bone leaves room for the tear tubes to pass.
- Each eye hollow has a lacrimal bone in its front inner wall.
