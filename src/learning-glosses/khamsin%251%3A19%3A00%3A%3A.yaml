simpleMeaning: A wind from the south, out of the Sahara, so hot it is hard to bear, that blows across
  Egypt in spring
scope: This is a wind from the south, out of the Sahara, so hot it is hard to bear, that blows across
  Egypt in spring, not a cool wind and not a wind from the sea.
examples:
- The khamsin blew hot dust across Egypt.
- A khamsin comes from the Sahara in spring.
