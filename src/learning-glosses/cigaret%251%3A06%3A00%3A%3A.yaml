simpleMeaning: finely ground tobacco rolled up in paper, made to be smoked
scope: This is finely ground tobacco rolled up in paper, made to be smoked; butt, cigarette, coffin nail
  and fag are other names for this sense, not a pipe and not loose tobacco.
examples:
- He lit a cigaret after dinner.
- She bought a pack of cigarets at the shop.
