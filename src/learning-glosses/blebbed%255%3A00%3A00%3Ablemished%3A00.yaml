simpleMeaning: of glass or a hard stone called quartzite, spoiled by tiny bubbles or tiny bits of other
  stuff
scope: Also called blebby, this is glass or quartzite spoiled by tiny bubbles or tiny bits of other stuff,
  not glass that is clean and smooth and not a stone with large cracks.
examples:
- The blebbed glass had tiny bubbles all through it.
- The blebbed quartzite was spoiled by small bits of other stuff.
