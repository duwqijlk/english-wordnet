simpleMeaning: With a deep body shaped like a flat round disk, this creature of the warm waters off the
  west side of the Atlantic is eaten as food.
scope: It is also called angelfish, a deep, round, flat creature of the warm waters off the west side
  of the Atlantic, eaten as food.
examples:
- The spadefish is found in the warm waters off the west side of the Atlantic.
- The spadefish is eaten as food.
