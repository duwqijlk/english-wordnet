  and for players offside in tennis, soccer, football, and the like
scope: This woman is the helper who backs up the main judge at a match, above all by watching the edge
  of the field and for players offside.
examples:
- The lineswoman called the ball out.
- A lineswoman stands at the edge of the field during the game.
