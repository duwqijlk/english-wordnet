simpleMeaning: the flowers, seeds and leaves of a plant, all used to add taste to food
scope: This is the flowers, seeds and leaves used in food, not the name for the whole plant itself.
examples:
- She put nasturtium leaves in the salad to add a sharp taste.
- He added nasturtium to the soup to give it more taste.
