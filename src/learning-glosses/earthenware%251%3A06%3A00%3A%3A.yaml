simpleMeaning: cups, pots and other things made from clay that has many small holes, baked at a low heat
scope: This is cups, pots and other things baked from clay with many small holes, not hard clay ware baked
  at a high heat and not dishes made of metal or glass.
examples:
- She served the soup in a rough earthenware bowl.
- The shop sells earthenware plates made from local clay.
