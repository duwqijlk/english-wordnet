simpleMeaning: The branch of the study of the shape and build of living things that deals with how animals
  are built
scope: The study of the build of animals; not the build of plants and not a dead body cut open.
examples:
- She studied anatomy before medical school.
- Anatomy tells us how the horse's leg is made.
