simpleMeaning: to walk in a way that is not steady, and to almost fall again and again
scope: To walk and almost fall again and again; not the noun for an unsteady way of walking and not a
  silly mistake.
examples:
- He stumbled down the dark street after drinking too much.
- The old man stumbled as he walked over the rough ground.
