simpleMeaning: A rough, long-lived Eurasian grass that looks like oat; it grows along roadsides, in rough
  grassland and in hay meadows, and was brought to North America for animal feed.
scope: Another name for the same rough Eurasian grass also called evergreen grass, false oat and tall
  meadow grass; it is a wild grass, not the cultivated oat grown for grain.
examples:
- Tall oat grass rippled in the wind along the roadside.
- Cattle grazed the tall oat grass in the lower field.
