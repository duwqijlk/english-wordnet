simpleMeaning: a string of small round things used to keep count while talking to God, especially by Catholics
scope: This is a string of small round things also called a rosary, used to keep count while talking to
  God, not a piece of jewelry worn just for show.
examples:
- She held her prayer beads and moved one for each prayer she said.
- He uses his prayer beads each morning to keep count as he prays.
