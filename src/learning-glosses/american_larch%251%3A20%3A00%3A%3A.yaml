simpleMeaning: A medium-sized cone-bearing tree of Canada and the northern United States including Alaska,
  with a broad cone-shaped crown and rust-brown scaly bark.
scope: Also called tamarack, black larch, and Larix laricina; a medium-sized cone-bearing tree of Canada
  and the northern United States, distinct from other cone-bearing trees with narrow crowns or smooth
  bark.
examples:
- The American larch in the yard has rust-brown scaly bark.
- American larch grows across Canada and Alaska.
