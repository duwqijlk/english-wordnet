scope: 'Bandicoot rat is another name for this sense: a digging animal of India and Ceylon with a scaly
  tail, not the African digging animal of the same name and not a true mole.'
examples:
- The mole rat dug its burrow in the dry earth.
- A mole rat slipped into its hole as we came near.
