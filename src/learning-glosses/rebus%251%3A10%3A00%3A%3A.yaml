simpleMeaning: a puzzle in which you work out a message made of pictures, where each picture stands for
  a part of a word or a whole word
scope: A word puzzle made of pictures, not a crossword and not a picture with no hidden message.
examples:
- The rebus showed a bee next to a leaf, and we worked out the word 'belief'.
- We spent an hour on the rebus, working out what each picture meant.
