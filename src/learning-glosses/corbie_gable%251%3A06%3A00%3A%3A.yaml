simpleMeaning: In architecture, the top end wall of a house with steps built up along its sloping sides
scope: In architecture, a house end wall with steps along its sloping sides; not a flat roof edge, and
  not a plain pointed wall with no steps.
examples:
- The old house has a corbie gable with stone steps along each side.
- We could see the corbie gable rising above the roof of the cottage.
