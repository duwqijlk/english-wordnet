simpleMeaning: A wound length of wire offering little fight to a current and storing much of its push,
  letting a steady current pass but weakening one that keeps changing direction
scope: Also called a choke and a choking coil, it is a wound length of wire in an electric circuit that
  offers little fight to a current and stores much of its push.
examples:
- The choke coil lets the steady current pass through.
- A choke coil weakens the changing current in the circuit.
