simpleMeaning: In the coastal waters of the Philippines lives this sea shellfish with two shells, marked
  by a large thin flat shell that lets light through.
scope: Also called capiz and window oyster, this is a sea shellfish with two shells and a large thin flat
  shell that lets light through, common in the coastal waters of the Philippines.
examples:
- Windowpane oysters live in the coastal waters of the Philippines.
- The windowpane oyster has a large thin flat shell.
