simpleMeaning: showing planned dishonesty, most of all by saying you feel one way while you act on other
  feelings
scope: 'Also called deceitful, duplicitous, ambidextrous, double-faced and double-tongued: a word for
  a person who says one thing and does another, not the noun sense of the cheating itself and not a person
  who simply makes a mistake.'
examples:
- The double-dealing salesman promised one price and charged another.
- Voters grew tired of the double-dealing promises from the candidate.
