simpleMeaning: a youth movement in 1950s America that preferred shared living, hallucinogenic drugs and
  anarchism over possessions and regular jobs, wore unconventional clothes and admired modern jazz such
  as bebop.
scope: Another name for the 1950s US youth subculture also called the beat generation or the beats, not
  an individual jazz musician.
examples:
- The beatniks gathered in coffee houses to read poetry.
- The beatniks rejected regular jobs and conventional dress.
