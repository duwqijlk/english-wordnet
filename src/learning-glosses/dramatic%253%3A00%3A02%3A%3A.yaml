simpleMeaning: used of a singer or a singing voice that is strong and full of feeling, in a style like
  acting on a stage
scope: This is about a singer or singing voice that is strong and full of feeling, not about plays in
  general and not about a thing that fits a play.
examples:
- The dramatic tenor sang with great power and feeling.
- She is a dramatic soprano with a strong, full voice.
