simpleMeaning: a tool that measures very short bits of time with great care
scope: This is a tool that measures very short bits of time with great care, not a clock that shows the
  time of day and not a tool that measures long stretches of time.
examples:
- The scientist used a chronoscope to time the short flash.
- The chronoscope measured the short gap between the two sounds.
