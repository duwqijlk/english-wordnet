simpleMeaning: A kind of antelope that lives in the African bush and has horns that twist in a spiral;
  there are two kinds of it.
scope: Either of two kinds of antelope with spiral horns that live in the African bush; kudu and koudou
  are other names for this sense, not a deer and not a goat.
examples:
- A koodoo stood among the thorn trees at dusk.
- The koodoo's spiral horns curved high above its head.
