simpleMeaning: an advertisement, usually printed on a page or in a leaflet (a small sheet of paper), made
  to reach many people
scope: 'Also called bill, circular, flier, flyer, broadside and broadsheet: a printed advertisement for
  many people, not words said in a light way and not a thing made to be thrown away after use.'
examples:
- A throwaway advertising the sale was put through our door.
- The shop handed out a colorful throwaway to everyone passing by.
