simpleMeaning: The courts of the United States that say what the laws of the country mean and carry them
  out.
scope: The courts of the United States that say what the laws of the country mean and carry them out;
  not the courts of the single states and not the law-makers.
examples:
- The Federal Judiciary decides what the laws of the country mean.
- A case may reach the Federal Judiciary after the lower courts.
