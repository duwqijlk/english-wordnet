simpleMeaning: the way a person acts toward other people
scope: 'Also called behavior, conduct, and demeanor: this is how a person acts toward other people. It
  is not how a machine or substance acts, and not all the acts and moves a living thing makes.'
examples:
- His behaviour toward his classmates was kind and polite.
- Good behaviour at school means listening and helping others.
