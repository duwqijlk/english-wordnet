simpleMeaning: A tree of the East Indies with hanging groups of yellow-white flowers, grown for show.
scope: This is a tree of the East Indies with hanging groups of yellow-white flowers, grown for show;
  coral-wood and peacock flower fence are other names for this sense, not a tree grown for its fruit and
  not a bush with red berries.
