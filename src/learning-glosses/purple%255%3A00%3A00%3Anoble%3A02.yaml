simpleMeaning: Fit for the person who rules over all others, or belonging to that person
scope: Another name for this sense is royal. It means fit for a highest ruler, not the colour purple itself
  and not writing that is too full and showy.
examples:
- She wore the purple robes of a queen.
- A purple tyrant, he ruled the whole land alone.
