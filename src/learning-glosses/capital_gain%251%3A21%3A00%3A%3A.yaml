simpleMeaning: the money got when a thing is sold for more than it was bought for
scope: The money got when a thing is sold for more than it was bought for, not a wage earned by work and
  not money made while the thing is still held.
examples:
- She made a capital gain when she sold the house.
- The capital gain came only after the shares were sold.
