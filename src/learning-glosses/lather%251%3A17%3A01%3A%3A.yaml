simpleMeaning: The foam that comes from too much sweat, as on a horse.
scope: Foam from too much sweat, as on a horse; not the foam from soap, and not the act of rubbing soap
  on.
examples:
- The horse was covered in lather after the race.
- Sweat and lather streaked the horse's neck.
