simpleMeaning: Full of sudden, irregular jolts rather than smooth movement, or producing such motion.
scope: This describes a ride, road or movement full of jolts; bumpy, rocky, jolty, jolting and jumpy are
  other names for the same sense. It is not a surface that feels uneven to the touch, not a stormy sea
  or sky, and not a period that is merely hard to get through.
examples:
- The bus ride was so rough that our heads kept banging against the windows.
- The flight was rough, with the plane jolting through the storm.
