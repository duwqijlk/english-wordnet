simpleMeaning: A small lyre-shaped musical instrument held between the teeth, played by twanging a wire
  tongue while changing the shape of the mouth.
scope: Also called jew's harp and mouth bow, this is a small harp played between the teeth.
examples:
- The jews' harp twanged as he changed the shape of his mouth.
- She learned to play the jews' harp at the fair.
