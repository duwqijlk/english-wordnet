simpleMeaning: a living thing that shows the marks of an older, simpler kind of its own kind
scope: 'Also called a throwback: a living thing that shows the marks of an older kind of its own kind,
  not a new kind and not a thing that has changed for the worse.'
examples:
- The horse was an atavist, with stripes like the wild horses of long ago.
- Scientists called the plant an atavist because its leaves matched those of a much older kind.
