simpleMeaning: While a person is awake but at rest, a brain test shows a steady beat of brain waves, 8
  to 12 times each second
scope: Also called alpha wave, this is the usual steady beat of the brain in a person awake but at rest,
  beating 8 to 12 times each second.
examples:
- The alpha rhythm showed on the test while she sat awake but relaxed.
- His alpha rhythm beat at about ten times each second.
