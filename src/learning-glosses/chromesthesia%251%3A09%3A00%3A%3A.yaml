simpleMeaning: a way of sensing in which sounds or other things not seen make a person see colours
scope: A way of sensing in which sounds or other things not seen make a person see colours; chromaesthesia
  is another name for this sense, and it is not seeing coloured lights that are not there or plain colour
  blindness.
examples:
- Her chromesthesia made a piano note appear as a wash of blue.
- With chromesthesia, the sound of a bell brought a flash of green to his mind.
