simpleMeaning: to take dirt, marks, or harmful substances out of something so that it is pure
scope: This is about making something free of dirt or harmful matter, not about making it bright or easy
  to see through.
examples:
- The plant uses filters to clear the water of heavy metals.
- A good rinse will clear the solution of any grit.
