simpleMeaning: a piece of armor (a hard covering to keep the body safe) carried on the arm to stop blows
scope: 'Also called shield: a hard covering carried on the arm to stop blows, not a general word for any
  kind of protection.'
examples:
- The soldier raised his buckler to stop the sword.
- He held a buckler on his left arm during the fight.
