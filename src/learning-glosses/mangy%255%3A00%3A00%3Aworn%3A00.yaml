senseId: mangy%5:00:00:worn:00
synsetId: 02592707-s
simpleMeaning: having many worn, thin places in the nap (the soft short hairs that stand up on cloth or
  fur)
scope: This sense is about cloth or fur with many worn, thin places in its top layer, not about a thing
  that is still thick and in good shape.
examples:
- A mangy carpet lay in front of the fire, worn thin in many places.
- She kept a mangy old fur coat with thin places all over it.
