simpleMeaning: a flat base, usually on soft ground, made of a wide layer of concrete made strong with
  steel bars inside
scope: Also called mat. This sense is a wide flat base for a building on soft ground, not a flat float
  of wood used on water.
examples:
- The house stands on a concrete raft because the ground is soft.
- They laid a raft of concrete before building the walls.
