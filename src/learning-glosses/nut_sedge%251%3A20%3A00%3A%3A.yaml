simpleMeaning: Under the ground, a long-lived plant found in many places bears small lumps shaped like
  the hard fruit it is named for, and people can eat them.
scope: Also called nut grass, nutgrass or nutsedge, this long-lived plant is found in many places and
  bears small lumps under the ground, shaped like the hard fruit it is named for, that people can eat.
examples:
- The nut sedge had small lumps under the ground.
- The small lumps of nut sedge were good to eat.
