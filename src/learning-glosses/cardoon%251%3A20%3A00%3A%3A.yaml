simpleMeaning: People grow this plant of southern Europe for its leaf stalks and roots, which can be eaten;
  it has prickly leaves and purple flowers.
scope: A plant of southern Europe grown for its leaf stalks and roots, not an artichoke, though the two
  are kin.
examples:
- Cardoon grows in southern Europe and has purple flowers.
- The leaf stalks and roots of the cardoon can be eaten.
