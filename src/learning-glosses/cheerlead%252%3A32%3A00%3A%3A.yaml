simpleMeaning: To lead the crowd in shouts and songs that cheer on a team at a sports game.
scope: Leading cheers for a team at a game, not simply shouting support from the crowd.
examples:
- She cheerleads for the school team every Friday.
- The girls cheerlead at all the home games.
