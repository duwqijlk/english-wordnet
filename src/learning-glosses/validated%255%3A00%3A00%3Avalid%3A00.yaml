simpleMeaning: said to have full force in law, or given full force in law
scope: 'This is the law sense: something is said to have full force in law, or is given that force. Not
  the everyday sense of checking that facts are true.'
examples:
- The court validated the claim, so the money had to be paid.
- Once the will was validated, the house could be sold.
