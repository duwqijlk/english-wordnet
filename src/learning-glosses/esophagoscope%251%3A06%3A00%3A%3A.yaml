simpleMeaning: a tool with a light and a lens that is put down the food pipe to look inside it
scope: 'Also called oesophagoscope: a tool with a light and a lens put down the food pipe to look inside
  it, not a tool for looking at the stomach and not a camera swallowed as a pill.'
examples:
- The esophagoscope showed a small sore in the food pipe.
- She lay still while the doctor passed the esophagoscope down her throat.
