simpleMeaning: The flow of people or vehicles through a particular area at a particular time.
scope: This sense is not the illegal buying and selling of goods, but the movement of people or vehicles
  through an area.
examples:
- Traffic was heavy during the morning rush hour.
- Police directed traffic around the accident.
