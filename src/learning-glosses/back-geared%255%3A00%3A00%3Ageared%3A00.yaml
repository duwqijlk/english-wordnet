simpleMeaning: Said of a lathe, a machine that turns wood or metal, whose turning part runs slower than
  the wheel that drives it, through a set of toothed wheels.
scope: Also called double-geared, this is a lathe whose turning part runs slower than the wheel that drives
  it.
examples:
- The back-geared lathe turned the wood at a slow speed.
- A back-geared lathe shaped the metal rod.
