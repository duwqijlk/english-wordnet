simpleMeaning: a part that sticks out from the surface or area around it
scope: 'Also called bump, bulge, swelling, hump, jut, protrusion, protuberance, excrescence and extrusion:
  a part that sticks out from what is around it. It is not about being important or well known.'
examples:
- He stood on the rocky prominence above the valley.
- The prominence on the bone could be felt under the skin.
