simpleMeaning: In computer science, the flat surface on a display behind the small pictures and open boxes
scope: In computer science, the surface behind the icons and windows; also called background and desktop,
  not a picture on the wall and not a window that opens over other work.
examples:
- She changed her screen background to a photo of the sea.
- The screen background turned dark when he opened the menu.
