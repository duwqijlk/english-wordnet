simpleMeaning: Against the law, against ideas of right and wrong, or against the agreed ways of a group
  of people
scope: 'Also called unlawful and unconventional: this is about not following the law, ideas of right and
  wrong, or what society accepts, not just being rude or doing a small thing badly.'
examples:
- The judge said the improper banking practices had to stop at once.
- Their improper marriage went against what people in their town accepted.
