simpleMeaning: a smooth sausage made of beef or pork cut into very small pieces, usually smoked, and often
  served in a bread roll
scope: Also called dog, frank, frankfurter, wiener, hotdog, hot dog, and wienerwurst. This is the sausage
  itself, not another kind of sausage with a rough feel.
examples:
- He put a weenie on the fire and cooked it until it was hot.
- She ate a weenie in a bread roll with mustard.
