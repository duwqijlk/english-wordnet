simpleMeaning: a right that you pay for, allowing you to buy or sell property at a fixed price before
  a set date; if you do not use it in time, you lose the money you paid
scope: This is a paid right in a business deal, not a simple choice between possibilities.
examples:
- The developer bought an option on the land and decided later whether to build.
- If the price falls, he may let the option expire.
