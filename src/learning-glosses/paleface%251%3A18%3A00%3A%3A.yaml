simpleMeaning: In slang, a rude name for a white person, said to be used by North American Indians
scope: In slang, a rude name for a white person said to be used by North American Indians; not a name
  for a pale face and not a neutral word for a white person.
examples:
- The old film used 'paleface' as an insult for white settlers.
- He was called a paleface in the story, a word meant as an insult.
