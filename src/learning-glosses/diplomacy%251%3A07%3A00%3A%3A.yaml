simpleMeaning: careful and clever handling of a situation, done in a quiet way
scope: Careful and clever handling of a situation, done in a quiet way; also called delicacy, and not
  the work of officials between countries, and not mere politeness.
examples:
- Her diplomacy kept the talks from falling apart.
- It took real diplomacy to settle the quarrel without a fight.
