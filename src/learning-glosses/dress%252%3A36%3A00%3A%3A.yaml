simpleMeaning: To add small decorative touches to a dish, such as a sprig of parsley, so it looks attractive.
scope: This is about making a plate of food look attractive with a garnish; it is not about pouring a
  sauce over salad, and not about decorating objects in general.
examples:
- The chef dressed the plate with a few sprigs of parsley.
- For the photo, they dressed the dessert with mint leaves and berries.
