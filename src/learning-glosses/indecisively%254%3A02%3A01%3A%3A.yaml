synsetId: 00300164-r
simpleMeaning: in a way that shows a person is not firm and cannot settle on a clear choice
scope: Done in a way that is not firm or clear when a choice must be made; not done in a firm way that
  settles a question at once.
examples:
- '''I don''t know,'' he said indecisively, looking at both doors.'
- She answered indecisively and then changed her answer twice.
