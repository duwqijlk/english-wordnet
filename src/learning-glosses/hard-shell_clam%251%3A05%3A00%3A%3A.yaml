simpleMeaning: A sea creature from America that people eat, whose heavy outer covers were once used as
  money by some native peoples.
scope: This is a sea creature from America that people eat, whose thick outer covers were once used as
  money, not a soft sea creature; also called quahog, hard clam, quahaug, and round clam.
examples:
- We dug for hard-shell clams at low tide.
- The hard-shell clam was served in chowder.
