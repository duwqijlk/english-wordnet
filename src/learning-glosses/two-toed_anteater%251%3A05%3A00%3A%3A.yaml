scope: Also called silky anteater, this toothless animal of South America is no bigger than a squirrel
  and has long, smooth, fine, gold-coloured fur.
examples:
- The two-toed anteater showed its long, smooth, gold-coloured fur as it moved.
- A two-toed anteater sat beside a squirrel, no bigger than it.
