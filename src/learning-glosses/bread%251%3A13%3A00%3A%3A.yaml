simpleMeaning: The food you get by baking a dough of flour or meal, often after raising it with yeast
  or baking powder.
scope: This is the baked food, not slang for money or the verb meaning to cover something with crumbs;
  breadstuff and staff of life are other names for this sense.
examples:
- She baked a loaf of bread this morning.
- He buttered his bread and poured some coffee.
