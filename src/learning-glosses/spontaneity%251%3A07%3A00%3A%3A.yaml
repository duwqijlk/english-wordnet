simpleMeaning: the quality of acting or happening freely from natural feelings, without being forced or
  planned ahead
scope: This is the quality of acting or happening freely from natural feelings, without being forced or
  planned ahead; it is not careful planning and not something a person is made to do.
examples:
- We loved the spontaneity of her laughter.
- His speech had a spontaneity that made it feel real and free.
