simpleMeaning: The colour of blood and a blue-purple colour cannot be told apart when the eye catches
  long waves of light poorly, a form of poor colour sight.
scope: 'Also called protanopia: a form of colour blindness in which the eye catches long waves of light
  poorly, so the colour of blood and a blue-purple colour cannot be told apart.'
examples:
- His red-blindness meant the two shirts looked the same to him.
- A test for red-blindness showed she could not tell the two colours apart.
