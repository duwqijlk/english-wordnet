simpleMeaning: breaking the accepted rule for how a thing should be used or how a job should be done
scope: 'Also called wrong: going against the set way of doing or using something, not a word that breaks
  grammar rules and not a thing full of mistakes.'
examples:
- It is incorrect for a policeman to accept gifts from the people he serves.
- The incorrect way to shuck clams can leave bits of shell in the meat.
