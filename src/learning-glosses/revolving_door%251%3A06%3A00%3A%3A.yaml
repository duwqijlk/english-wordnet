simpleMeaning: In tall buildings, this way in keeps the air pressure the same, with four flat parts at
  right angles that turn round a middle post.
scope: Also called revolver, it is a way in made of four flat parts at right angles that turn round a
  middle post, made to keep the air pressure the same in tall buildings.
examples:
- People pushed through the revolving door into the tall building.
- The revolving door turned round its middle post as they passed through.
