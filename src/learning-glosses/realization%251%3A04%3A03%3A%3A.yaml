simpleMeaning: the act of finishing or adding to a piece of music that the person who wrote it left with
  only a few notes written down
scope: This is the act of finishing such music, not the finished piece itself, not a sale for money, and
  not making something real.
examples:
- The musician's realization of the short written music filled in the missing parts.
- His realization of the old piece added parts that the writer had left out.
