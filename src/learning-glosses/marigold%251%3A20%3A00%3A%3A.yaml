simpleMeaning: any of several kinds of plant of the Tagetes group from warm parts of America, grown widely
  for their bright yellow or orange flowers
scope: Any of several kinds of plant of the Tagetes group from warm parts of America, grown for bright
  yellow or orange flowers; not a rose, and not a wild flower of cold lands.
examples:
- Marigolds lined the path with orange and yellow.
- She planted marigold seeds along the fence in spring.
