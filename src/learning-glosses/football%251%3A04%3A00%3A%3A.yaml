simpleMeaning: any of several games between two teams, played with a round or oval ball, in which players
  kick, carry, or push the ball into the other team's goal.
scope: It is not the ball itself; it is the game played with it.
examples:
- The children play football in the park after school.
- He watches football every weekend.
