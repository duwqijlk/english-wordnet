senseId: 'humanist%3:01:00::'
synsetId: 02754319-a
simpleMeaning: about the humanities (subjects such as history, writing, art and languages, which are about
  people and what they make and think)
scope: Also called humane and humanistic, this sense is about subjects that study people and their ideas.
  It is not the sense about a person who holds these ideas, not the sense about a set of ideas on human
  worth and reason, and not the sense about learning long ago in Europe.
examples:
- She chose a humanist course on history and old books.
- He teaches humanist studies, with classes on language and art.
