simpleMeaning: shaped or set out so that liquid or gas moves past with as little push against it as possible
scope: 'Also called flowing, sleek and streamlined: shaped or set out so that liquid or gas moves past
  with little push against it, not the sense that only means to do with the study of how air moves.'
examples:
- The new car has an aerodynamic shape that helps it use less fuel.
- Its aerodynamic body lets the train move fast through the air.
