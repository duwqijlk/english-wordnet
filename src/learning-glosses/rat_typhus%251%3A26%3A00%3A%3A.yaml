simpleMeaning: A sudden illness brought on by rickettsia bacteria, spread when an infected flea bites
  a person, and marked by fever, chills, aching muscles and a rash.
scope: One of four interchangeable names for this flea-borne illness, alongside endemic, murine and urban
  typhus; it is not the louse-borne form or the mite-borne scrub form.
examples:
- Rat typhus reaches humans through the bite of an infected flea.
- The chills and muscle aches she had were later put down to rat typhus.
