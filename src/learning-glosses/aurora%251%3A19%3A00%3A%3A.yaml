simpleMeaning: bands of light in the sky, caused by tiny bits from the sun that carry electric charge
  and follow the earth's magnetic pull
scope: Bands of light in the sky made by bits from the sun; this is not the dawn, though the same word
  can also name the early morning light.
examples:
- We watched the aurora move slowly across the night sky.
- The aurora lit up the sky with bands of green light.
