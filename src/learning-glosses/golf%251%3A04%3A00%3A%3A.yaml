simpleMeaning: a game on a large open course with 9 or 18 holes, where players hit a small ball into each
  hole using as few hits as they can
scope: This is the ball game played on a large open course; not the verb for playing it, and not other
  outdoor ball games such as tennis or football.
examples:
- My father plays golf every Sunday morning.
- She won the golf match by two strokes.
