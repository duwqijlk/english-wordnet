simpleMeaning: an outer look or form that is only a show, made on purpose so people think something false
scope: 'Also called color, colour, and gloss: an outer show made on purpose to make people think something
  that is not true, not a true likeness and not a real sign of a thing.'
examples:
- He put on a semblance of calm to hide his anger from the guests.
- The report gave a semblance of truth to claims that were in fact false.
