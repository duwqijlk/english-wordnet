simpleMeaning: A salt form of a drug that wakes the brain and nerves, used to make a person more alert.
scope: 'Also called amphetamine sulfate: a salt form of a drug that wakes the brain and nerves, used to
  make a person more alert, not a drug that makes a person sleep and not a drug for pain.'
examples:
- The doctor gave him amphetamine sulphate to help him stay awake.
- Amphetamine sulphate wakes the brain and nerves.
