simpleMeaning: 'One hundredth of a metre: a small unit used to measure length in the metric system'
scope: A small metric unit of length, and cm and centimeter are other names for this sense; not an inch
  and not a foot.
examples:
- The ribbon was thirty centimetres long.
- He measured the book in centimetres.
