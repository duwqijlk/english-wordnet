simpleMeaning: A small dip or crease in a surface that is otherwise smooth.
scope: This is a physical crease in a surface, not a mark that sets a boundary, a geometric length, or
  a row of printed words.
examples:
- Deep lines had formed around her mouth.
- The iron left a line across the cloth.
