simpleMeaning: all the small plants and animals, taken together, that float or drift in great numbers
  in fresh water or in salt water
scope: This word names tiny plants and animals as one whole group drifting in water; it does not name
  one single plant or animal, and not large animals that swim on their own.
examples:
- Whales eat huge amounts of plankton from the sea water.
- The water was full of plankton, too small to see one by one.
