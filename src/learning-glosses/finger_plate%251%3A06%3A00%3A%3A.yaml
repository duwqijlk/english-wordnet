simpleMeaning: A flat guard fixed on a door, a wall, or other such places to keep it clean from dirty
  hands
scope: This is a flat guard on a door, a wall, or other such places against dirty hands; escutcheon and
  scutcheon are other names for this sense, not a door handle and not a lock cover.
examples:
- The finger plate on the door was smudged.
- She wiped the finger plate clean.
