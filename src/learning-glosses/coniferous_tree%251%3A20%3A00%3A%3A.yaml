simpleMeaning: a bush or a tall woody plant that bears cones, with seeds that lie bare on the scales of
  the cones
scope: This is a cone-bearing woody plant, also called a conifer, and not a broadleaf plant that bears
  fruit.
examples:
- A tall coniferous tree with cones stood at the edge of the garden.
- The coniferous trees in the park keep their cones through the winter.
