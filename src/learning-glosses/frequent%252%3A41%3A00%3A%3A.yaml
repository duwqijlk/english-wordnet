simpleMeaning: To buy things from a place, or use what it sells, as one of its steady customers
scope: 'Also called shop: to buy from a place again and again as its customer, not to go to a place often
  just to spend time there.'
examples:
- She frequents the little bakery on her street.
- He frequents the same tailor for all his suits.
