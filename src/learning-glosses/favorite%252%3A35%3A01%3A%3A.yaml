simpleMeaning: on social media, to mark a post or other item as one you especially like
scope: To mark an item you like on social media, not the adjective for a preferred or beloved thing, nor
  the noun for a person or thing liked best.
examples:
- She favorited the post so she could find it later.
- He favorited a few recipes from the cooking site.
