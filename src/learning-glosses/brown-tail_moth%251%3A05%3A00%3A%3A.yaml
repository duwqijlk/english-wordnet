simpleMeaning: A small chestnut-coloured and white night-flying insect from Europe, brought to the eastern
  United States, that harms many shade and fruit trees.
scope: A small chestnut-coloured and white night-flying insect from Europe that harms shade and fruit
  trees; browntail is another name for this sense, not a butterfly and not a clothes moth.
examples:
- The brown-tail moth lays its eggs on apple trees.
- Brown-tail moth caterpillars stripped the leaves from the oaks.
