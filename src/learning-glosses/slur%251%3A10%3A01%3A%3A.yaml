senseId: 'slur%1:10:01::'
synsetId: 06879003-n
simpleMeaning: In music, a curved line over notes, showing they are to be played smoothly, one running
  into the next
scope: In music, a curved line over notes to be played smoothly, not a mark that joins words and not an
  insulting word.
examples:
- The slur over the two notes told the player to join them smoothly.
- She drew a slur across the notes in the first bar.
