simpleMeaning: A number written with a point, in which the same set of figures after the point keeps coming
  back again and again without end.
scope: A number whose figures after the point repeat without end, not a number that stops after a few
  figures and not a whole number.
examples:
- In class we learned that one third is a circulating decimal.
- The circulating decimal 0.333... goes on for ever.
