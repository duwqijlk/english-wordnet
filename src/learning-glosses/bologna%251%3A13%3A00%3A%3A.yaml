simpleMeaning: a large sausage with a smooth feel, made from beef, pork and veal (meat from a young cow)
  and then put in smoke
scope: A large, smooth sausage made from beef, pork and veal; not salami and not a hot dog.
examples:
- She made a sandwich with thick slices of bologna.
- He fried the bologna before putting it in the bread roll.
