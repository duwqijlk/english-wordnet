simpleMeaning: On the Pacific coast of North America stands a tall tree with leaves like those of the
  cypress and bark the colour of cinnamon.
scope: Also called incense cedar, this names a tall Pacific coast tree with cypress-like leaves, not the
  small juniper east of the Rocky Mountains.
examples:
- A red cedar stood on the Pacific coast.
- The red cedar has bark the colour of cinnamon.
