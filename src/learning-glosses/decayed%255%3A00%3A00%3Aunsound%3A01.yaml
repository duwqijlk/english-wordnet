simpleMeaning: hurt by breaking down over time, so not strong and not able to be used
scope: 'Also called rotten, and another name for it is rotted: hurt by breaking down over time and no
  longer able to be used, not just old or dirty.'
examples:
- The decayed boards in the floor broke under his foot.
- They had to replace the decayed beams in the old house.
