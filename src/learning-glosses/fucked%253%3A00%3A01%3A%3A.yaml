simpleMeaning: In a very bad state, badly hurt or broken, mixed up, or not right
scope: This describes something that is badly damaged, mixed up or wrong; it does not describe something
  that is fine and in good order.
examples:
- After the crash, the car was completely fucked and could not be driven.
- The files got mixed up, and now the whole list is fucked.
