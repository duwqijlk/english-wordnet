simpleMeaning: going far beyond the usual limits, especially in how good or great something is
scope: 'Also called surpassing: going far beyond the usual, not just very good in a normal way and not
  about God or the world of the spirit.'
examples:
- Her singing had a transcendent beauty that no one could forget.
- Many people see his work as a transcendent act of kindness, far above the usual.
