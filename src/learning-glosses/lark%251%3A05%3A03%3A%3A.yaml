simpleMeaning: a North American bird that sings and has a yellow chest
scope: A North American bird that sings and has a yellow chest; not the Old World singing bird in general,
  and not the ground bird with streaky brown feathers.
examples:
- A lark with a bright yellow chest sang from a fence post in Canada.
- We saw a lark with a bright yellow chest in a field in North America.
