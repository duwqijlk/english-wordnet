simpleMeaning: a part that can be taken out and put back to keep water in a bath or basin
scope: A stopper that holds water in a bath or basin, not a tap and not a hole that lets water out.
examples:
- The drainplug kept the water in the tub while he washed.
- She pushed the drainplug back in before she filled the basin.
