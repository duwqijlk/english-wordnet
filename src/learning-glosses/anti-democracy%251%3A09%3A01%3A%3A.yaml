simpleMeaning: being against rule by the people, most often, though not always, along with opposition
  to equal rights for all
scope: Opposition to rule by the people, not a dislike of voting alone and not opposition to equal rights
  on its own.
examples:
- The anti-democracy of right-wing extremism includes an aversion to the democratic rules of the game.
- His anti-democracy showed in his calls to scrap free elections.
