simpleMeaning: By the road in the south-east of the United States, a small place lets people eat and drink
  and dance to music from a jukebox
scope: A small roadside place in the south-east of the United States for eating, drinking and dancing,
  also called jook house, jook joint, juke, juke house or juke joint; not a restaurant with no dancing
  and not the Chinese rice gruel of the same name.
examples:
- They stopped at a jook on the highway for supper and dancing.
- The jook was full of music from the jukebox on Saturday night.
