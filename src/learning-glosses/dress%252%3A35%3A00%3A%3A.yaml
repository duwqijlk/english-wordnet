simpleMeaning: To add a sauce to food, such as a salad.
scope: This is about adding a sauce to food, as when a salad is dressed; it is not about covering a wound
  with a bandage, and not about decorating a dish with a garnish.
examples:
- She dressed the salad with olive oil and lemon juice.
- Dress the greens just before serving so they do not wilt.
