simpleMeaning: a group of related living things that form one step in the line of descent from parent
  to child.
scope: This is not the length of time between such groups, and not the act of producing something.
examples:
- Each generation of the fish returns to the same river to breed.
- The disease can skip a generation and appear in the grandchildren.
