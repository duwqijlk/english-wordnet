simpleMeaning: with stout blue-green needles and bark that turns grey-brown and breaks into four-sided
  plates as it grows old, this tall pine grows in the west of North America
scope: Also called mountain pine and western white pine; a tall western pine with thick needles, not a
  spruce and not a fir.
examples:
- The silver pine on the ridge has thick blue-green needles.
- Old silver pine bark breaks into flat plates.
