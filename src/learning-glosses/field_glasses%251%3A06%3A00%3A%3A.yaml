scope: 'Also called binoculars and opera glasses: a pair of tools for seeing with both eyes, not a single
  glass for one eye and not a pair of glasses for reading.'
examples:
- He lifted the field glasses to watch the birds in the trees.
- She kept a pair of field glasses by the window.
