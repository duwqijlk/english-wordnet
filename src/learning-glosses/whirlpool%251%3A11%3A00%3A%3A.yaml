simpleMeaning: a strong round and round flow of water, often made where tides meet and push against each
  other
scope: This is a strong round and round flow of water, often made where tides meet and push against each
  other; not a calm pool and not a straight, fast current.
examples:
- The whirlpool pulled the small boat round and round.
- They kept clear of the whirlpool near the rocks.
