simpleMeaning: Sores spread over much of the body in this very bad form of a disease that harms many parts
  of it
scope: A very bad kind of the disease, not a mild kind and not sores from some other cause.
examples:
- The doctor said the lepromatous leprosy had spread over much of his body.
- Lepromatous leprosy can harm many parts of the body.
