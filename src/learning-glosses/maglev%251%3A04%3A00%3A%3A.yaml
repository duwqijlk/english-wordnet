simpleMeaning: A train that floats above its track on a cushion, held up by a pull that lifts metal, so
  it runs fast with no friction.
scope: Also called magnetic levitation, this train floats above its track on a cushion and runs with no
  friction, not on wheels.
examples:
- The maglev floated above its track.
- A maglev train has no wheels touching the track.
