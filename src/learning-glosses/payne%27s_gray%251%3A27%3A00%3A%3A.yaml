simpleMeaning: Any colouring matter that gives a blue that runs from pale slate to dark slate-blue.
scope: This is any colouring matter that gives this slate blue, also called Payne's grey, not a single
  ready-made paint or a blue of another kind.
examples:
- Payne's gray darkened the sky in the painting.
- He mixed Payne's gray for the shadows.
