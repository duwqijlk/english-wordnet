simpleMeaning: A bird of warm waters away from the sea that eats fish, with a long neck that bends and
  a thin sharp beak.
scope: 'Also called darter and snakebird: a fish-eating bird of warm inland waters with a long bending
  neck, not a duck and not a sea bird.'
examples:
- The anhinga dived for fish in the warm river.
- An anhinga held its long neck above the water.
