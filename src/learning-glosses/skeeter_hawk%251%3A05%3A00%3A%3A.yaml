simpleMeaning: A thin-bodied bug that does not sting, with rainbow wings spread flat while at rest, with
  grown ones and young that feed on gnats and such.
scope: This sense is also called dragonfly, darning needle, devil's darning needle, mosquito hawk, sewing
  needle, snake doctor, and snake feeder.
examples:
- A skeeter hawk hovered over the pond.
- Skeeter hawks eat gnats.
