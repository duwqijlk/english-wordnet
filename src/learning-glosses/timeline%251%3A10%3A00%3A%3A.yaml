simpleMeaning: related things that happened, set out in the order they happened, along a line that usually
  runs from left to right or top to bottom
scope: Events set out in the order they happened, not a list of dates and not a plan of work to come.
examples:
- The timeline shows how the city grew over a hundred years.
- She drew a timeline of the war, from the first battle to the last.
