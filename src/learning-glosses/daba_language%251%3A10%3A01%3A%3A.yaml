simpleMeaning: A Chadic tongue spoken south of Lake Chad, especially in North Region, Mayo-Louti division,
  Mayo-Oulo and Guider subdivisions northwest of Guider, Far North Region, Mayo-Tsanaga division, Hina
  and Bourrah subdivisions.
scope: Also called Daba, Kola, Kola language, Musgoi and Musgoi language; one Chadic tongue among many,
  spoken south of Lake Chad in the places named in its gloss.
examples:
- Daba language is spoken south of Lake Chad.
- She learned Daba language from her neighbours in Guider.
