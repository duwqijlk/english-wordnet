senseId: 'ahem%1:10:00::'
synsetId: 07141229-n
simpleMeaning: a sound like clearing your throat, made to get attention, show you are not sure, fill a
  pause, hide embarrassment, warn a friend, and so on
scope: Also called hem, this is a throat-clearing sound made on purpose to get attention or for a like
  reason, not a cough from illness.
examples:
- He gave a quiet ahem to get the teacher's attention.
- Her soft ahem warned her friend to stop talking.
