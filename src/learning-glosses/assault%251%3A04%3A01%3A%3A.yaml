simpleMeaning: when a person threatens to attack someone's body or tries to attack it, and seems able
  to hurt that person if not stopped
scope: A threat or try to hurt someone's body; not the crime of forcing a person to have sex against their
  will.
examples:
- She reported an assault after a man threatened to hit her and lunged at her.
- An assault does not have to cause injury; a real threat to hit someone can be enough.
