simpleMeaning: to join with an ion, a tiny part with an electric charge, and form a new substance that
  stays together and does not easily break apart
scope: This sense is about joining with an ion to make a steady new substance, not about taking property
  by law or keeping a person apart from others.
examples:
- In the test, the cations were sequestered into a steady new substance.
- These chemicals sequester by joining firmly with ions in the water.
