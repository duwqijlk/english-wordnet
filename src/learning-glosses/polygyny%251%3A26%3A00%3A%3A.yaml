simpleMeaning: A kind of marriage in which one man has more than one wife at the same time
scope: This is a marriage in which one man has several wives at once; not a marriage with one wife, and
  not a marriage in which one woman has several husbands.
examples:
- Polygyny was allowed in that old society.
- The chief practised polygyny and had three wives.
