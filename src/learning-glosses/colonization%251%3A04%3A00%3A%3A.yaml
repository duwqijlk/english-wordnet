simpleMeaning: the act of a country taking control of land far away and sending its own people to live
  there and rule it
scope: 'Also called settlement and colonisation: the act of taking land far away and sending people to
  live there and rule it, not the land itself or the new place people build there.'
examples:
- The colonization of the island began in the 1600s.
- Many people suffered under the colonization of their country by a foreign power.
