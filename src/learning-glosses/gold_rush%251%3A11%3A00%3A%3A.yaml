simpleMeaning: When a sudden chance to make money turns up, good luck comes with it all at once
scope: Also called boom, gravy, windfall, godsend, bonanza, bunce and manna from heaven; good luck that
  comes all at once, not a search for the yellow metal and not slow, steady gain.
examples:
- The new testing rules created a gold rush for small labs.
- Their gold rush came when the price of grain shot up.
