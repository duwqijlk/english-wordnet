senseId: 'suspend%2:30:01::'
synsetId: 00148583-v
simpleMeaning: to keep small bits spread out and held up in a liquid or gas, not sinking
scope: This is to keep small bits held up spread out in a liquid or gas, not to stop a thing going on
  by a hold and not to make a rule stop counting for a time.
examples:
- Fine sand particles stay suspended in the water for hours.
- Dust was suspended in the air after the old wall fell.
