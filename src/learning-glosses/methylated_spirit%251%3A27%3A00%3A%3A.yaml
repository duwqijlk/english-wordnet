simpleMeaning: Wood alcohol is mixed into the alcohol people drink so that no one can drink it as a drink.
scope: It starts as the alcohol people drink, but wood alcohol mixed in keeps it from being drunk.
examples:
- No one can drink methylated spirit.
- Methylated spirit is not for drinking.
