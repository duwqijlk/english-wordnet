simpleMeaning: To lose stored power, a magnetic pull, or a flow of electric current.
scope: To lose stored power or a flow of current, also called disintegrate, not to rot and not to fall
  into ruin.
examples:
- The battery decayed overnight and would not start the car.
- The magnet decayed until it could no longer hold the pin.
