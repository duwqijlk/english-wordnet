simpleMeaning: a person or thing that people curse and hate with strong feeling
scope: A person or thing people curse and hate, not the act of cursing itself and not a mild dislike.
examples:
- To the crowd, the traitor became an execration, cursed at every mention of his name.
- The cruel law was an execration to all who lived under it.
