simpleMeaning: 'of a circuit or a device where what comes out changes in a fixed way with what goes in:
  if what goes in doubles, what comes out doubles too'
scope: 'Also called linear and analog: describes a circuit or device where what comes out changes in a
  fixed way with what goes in. Not a thing that is like another thing.'
examples:
- An analogue device gives a signal that rises and falls smoothly with the sound.
- The old radio uses an analogue circuit to control the sound level.
