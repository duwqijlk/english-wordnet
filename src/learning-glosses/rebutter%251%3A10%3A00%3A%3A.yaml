simpleMeaning: In law, a written answer given by the person sued, in reply to the other side's next answer
scope: 'Another name for a rebuttal: a written answer in law from the person sued, not the first claim
  and not a spoken case made by a debater.'
examples:
- The defendant's rebutter came after the plaintiff's surrejoinder.
- The rebutter answered the plaintiff's surrejoinder point by point.
