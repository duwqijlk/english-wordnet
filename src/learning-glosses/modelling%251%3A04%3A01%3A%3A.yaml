simpleMeaning: an early shaped work made in wax or clay, made so that a finished work can be copied from
  it
scope: This early wax or clay work is also called modeling, molding and moulding; it is not the finished
  work itself.
examples:
- The modelling in clay helped the artist plan the large stone figure.
- She kept the wax modelling in her studio until the final work was made.
