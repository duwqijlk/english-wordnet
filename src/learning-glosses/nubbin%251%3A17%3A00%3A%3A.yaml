simpleMeaning: A small lump, in particular a fruit or an ear of corn that has not grown full size
scope: A small lump, in particular an undeveloped fruit or ear of corn; not a full ear of corn, and not
  a stone.
examples:
- Only a nubbin of corn grew on the dry stalk.
- He picked a nubbin from the small apple tree.
