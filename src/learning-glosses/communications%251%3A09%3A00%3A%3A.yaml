simpleMeaning: the field of study that looks at how messages are sent and shared, as in print, radio,
  or television
scope: A field of study about how messages are sent and shared, not the act of talking to someone and
  not a single message.
examples:
- Communications is his major field of study.
- She took a degree in communications to learn how news reaches the public.
