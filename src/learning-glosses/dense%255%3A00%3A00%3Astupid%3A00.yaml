simpleMeaning: slow to learn or understand things and not quick at thinking
scope: Also called slow, dull, dim and dumb. This sense is about a person who is slow to learn, not about
  things packed close together or heavy for their size.
examples:
- He is so dense that he did not get the simple joke.
- I felt dense for not seeing the answer at once.
