simpleMeaning: Any of several common trees that bear sour or bitter oranges, used as a base on which other
  kinds are grown.
scope: An orange tree with sour or bitter fruit, also called bigarade, bitter orange, bitter orange tree,
  marmalade orange, sour orange and Seville orange, set apart from sweet orange trees by its sour fruit.
examples:
- Citrus aurantium grew behind the house.
- The grower used Citrus aurantium as grafting stock.
