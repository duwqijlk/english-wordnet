simpleMeaning: A large bird of the Americas that often catches insects in the air as it flies
scope: This is a large American bird that catches insects while flying; flycatcher and tyrant bird are
  other names for this sense, and it is not a small songbird or a bird that hunts on the ground.
examples:
- The tyrant flycatcher darted out to catch a bee.
- We saw a tyrant flycatcher snatch insects above the meadow.
