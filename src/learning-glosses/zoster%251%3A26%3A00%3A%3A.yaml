simpleMeaning: a painful skin rash with spots and blisters that follows the line of a nerve, often with
  strong pain along the nerve
scope: This is a painful rash along a nerve, also called shingles and herpes zoster; not a rash that spreads
  all over the body and not a simple spot.
examples:
- The zoster rash ran in a band across his chest and hurt to touch.
- Her zoster left her with a burning pain long after the spots had gone.
