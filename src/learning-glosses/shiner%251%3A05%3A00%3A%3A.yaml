simpleMeaning: Any of the many small, silvery, North American carp-like fishes, especially of the group
  Notropis.
scope: Any of the many small, silvery, North American carp-like fishes, especially of the group Notropis;
  not a key food fish of the north Atlantic and Mediterranean, greenish-blue with dark bars and few, if
  any, scales, nor a thing that shines, with light given off or thrown back, nor a swollen bruise from
  a blow to the eye.
examples:
- Their shiner flashed in the stream.
- The shiner was caught at dawn.
