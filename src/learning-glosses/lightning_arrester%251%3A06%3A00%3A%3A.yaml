simpleMeaning: Other gear is kept safe from sudden jumps and falls in the flow of power by this device
  in the power line
scope: A device in a power line that keeps other gear safe from sudden jumps in the flow of power, not
  a fuse and not a switch that cuts power off.
examples:
- The power company fitted a lightning arrester on the line to the mill.
- After the storm, the lightning arrester kept the farm's pumps safe.
