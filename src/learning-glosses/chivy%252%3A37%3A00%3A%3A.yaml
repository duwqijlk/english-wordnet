senseId: 'chivy%2:37:00::'
synsetId: 01793315-v
simpleMeaning: To pester someone without let-up, time and again.
scope: This sense is also called provoke, harass, plague, hassle, harry, molest, beset, and chivvy, for
  pestering someone without let-up, time and again, where provoke is annoying someone over and over, for
  a long time, and harass is keeping on at someone with annoyance, over and over, for a long time.
examples:
- He chivied her without let-up.
- Chivying pestered him time and again.
