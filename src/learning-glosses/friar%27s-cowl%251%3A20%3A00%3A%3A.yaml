simpleMeaning: a plant that lives for years, with a hood-shaped dark red or near-black flower cover, growing
  from a thick stem underground around the Mediterranean, the Canaries and the Azores
scope: A long-lived plant with a hood-shaped dark flower cover, not a monk's hood and not a lily.
examples:
- The friar's-cowl grows wild on the hillside, its dark hood-shaped flower cover standing out.
- We saw a friar's-cowl near the coast, its maroon flower cover shaped like a monk's hood.
