simpleMeaning: Being able to be shown to be true, by clear thinking
scope: Whether a thing can be shown to be true; demonstrability is another name for this sense, not a
  guess about what is true.
examples:
- The provability of the claim mattered more than how bold it sounded.
- Mathematicians argued over the provability of the new rule.
