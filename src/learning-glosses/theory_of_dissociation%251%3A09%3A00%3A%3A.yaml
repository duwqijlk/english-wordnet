simpleMeaning: In chemistry, the idea that acids in water split into hydrogen ions and bases into hydroxyl
  ions, and that an acid plus a base makes a salt and water.
scope: Another name for the theory of electrolytic dissociation, the early account of how acids and bases
  behave in water; not a theory of electrolysis itself, and not the modern proton-transfer view of acids
  and bases.
examples:
- The theory of dissociation explained why salt solutions carry an electric current.
- Chemists in the 1880s used the theory of dissociation to describe acids and bases in water.
