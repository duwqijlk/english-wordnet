simpleMeaning: of a liquid, moved about strongly and in a rough, uneven way
scope: 'Also called churning, turbulent, and roiling: this describes a liquid moving strongly, not a person
  who is angry or upset.'
examples:
- The roiled river ran fast and muddy after the storm.
- The roiled water in the pot swirled and splashed.
