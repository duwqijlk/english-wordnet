simpleMeaning: a liquid you get by leaving a substance in water, usually, so that parts of it mix into
  the water
scope: This is a liquid made by soaking something, not the act of taking something out by pressing, and
  not working out a meaning or a rule from facts.
examples:
- The herbal extract was made by soaking the leaves in water.
- He drank a tea-like extract made from roots left in hot water.
