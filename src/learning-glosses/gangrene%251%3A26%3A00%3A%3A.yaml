simpleMeaning: dead flesh, or a dead part or lump of flesh in the body
scope: Also called slough, this is dead flesh in the body; it is not the dying of living cells itself,
  but the dead part that results.
examples:
- The doctor cut away the gangrene from the patient's foot.
- Gangrene had set in, and the dead flesh had to be removed.
