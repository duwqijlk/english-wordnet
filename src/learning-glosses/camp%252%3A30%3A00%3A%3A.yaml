simpleMeaning: to give something a deliberately cheap, overdone, or sexually suggestive quality.
scope: This is the act of giving something that style, not a place to stay and not the adjective describing
  the style itself.
examples:
- The director camped up the final scene to get a laugh.
- The actor camped up his role as the wicked uncle.
