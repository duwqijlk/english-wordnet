simpleMeaning: in a way that thinks about or judges things as they really are and by what can really happen
scope: This is about looking at a situation in line with real facts and what can happen; it is not about
  a picture or copy looking very like the real thing it shows.
examples:
- Realistically, we cannot finish all this work today.
- She looked at the plan realistically and saw it would cost too much.
