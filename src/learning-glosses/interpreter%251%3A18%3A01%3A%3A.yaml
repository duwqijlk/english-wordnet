simpleMeaning: A person who stands between people who speak different languages and puts what each says
  into the other's language
scope: A person who turns speech from one language to another, also called translator; not a computer
  program and not a person who speaks for another's aims.
examples:
- The interpreter helped the two leaders talk to each other.
- We hired an interpreter for the visit to the foreign court.
