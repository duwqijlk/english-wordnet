simpleMeaning: The parts of a plant that make fruit, above all the parts of ferns and mosses that make
  new plants
scope: The fruit-making parts of a plant, not the fruit itself and not the flower.
examples:
- Fructification in ferns takes place on the underside of the leaves.
- The fructification of the moss was hard to see.
