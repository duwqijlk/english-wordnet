simpleMeaning: One of two small pieces of gristle at the back of the voice box, where the voice cords
  are fixed
scope: One of two small pieces of gristle at the back of the voice box, also called an arytaenoid and
  an arytenoid; not the voice cords themselves and not a bone in the throat.
examples:
- The arytenoid cartilage sits at the back of the voice box.
- Each arytenoid cartilage holds one end of a voice cord.
