simpleMeaning: a black sticky material made from oil, used to pave roads and other ground, usually laid
  over crushed stone
scope: A black paving material, not the road itself and not plain tar.
examples:
- Workers laid fresh blacktop on the road.
- The blacktop on the driveway cracked in the summer heat.
