simpleMeaning: Sharp, uneven teeth mark this fish of shallow water, found on both sides of the Atlantic,
  which at times can be a danger to swimmers.
scope: Sand shark is another name for this fish of shallow water with sharp, uneven teeth, which can be
  a danger to swimmers at times but not always.
examples:
- A sand tiger moved through the shallow water.
- The sand tiger opened its mouth, showing sharp, uneven teeth.
