simpleMeaning: A member of the Mongolian people of central Asia who fought their way into Russia in the
  13th century.
scope: This is a member of the Mongolian people of central Asia who fought their way into Russia in the
  13th century; Tartar and Mongol Tatar are other names for it, not a member of the Turkic-speaking people
  of the Volga and not a speaker of the Tatar language.
examples:
- The Tatar invaded Russia in the 13th century.
- A Tatar of central Asia rode west with the Mongols.
