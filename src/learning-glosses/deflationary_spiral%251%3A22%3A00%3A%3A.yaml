simpleMeaning: A time of falling prices in which prices and pay fall faster and faster and money gains
  in value
scope: A spell of falling prices that speeds up as pay also falls and money gains value; not a one-off
  price cut and not a general economic slump.
examples:
- The country feared a deflationary spiral as prices kept falling.
- In a deflationary spiral, wages fall faster each month.
