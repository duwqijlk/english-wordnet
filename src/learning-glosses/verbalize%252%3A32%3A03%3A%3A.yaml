simpleMeaning: to make a thought or feeling known in words, or with a cry, a shout, or another sound
scope: Making a thought or feeling known in words or with a sound, also called express, utter, and give
  tongue to; not just talking, and not writing something down.
examples:
- She verbalized her anger in a short, clear sentence.
- He verbalized his pain with a loud shout.
