simpleMeaning: Hold something between your fingers and press it firmly
scope: Pressing something hard between the fingers, not pressing separate things together or forcing something
  into a gap; pinch, nip, twitch, twinge and tweet are other names for this sense.
examples:
- He squeezed her cheek playfully.
- She squeezed the bottle to get the last of the lotion out.
