simpleMeaning: A blood tube that feeds the belly and the muscles between the ribs
scope: Also called a musculophrenic artery; not the blood tube that feeds the long bone and not the one
  that feeds the ovaries.
examples:
- The arteria musculophrenica feeds the muscles between the ribs.
- Damage to the arteria musculophrenica can starve the belly muscles of blood.
