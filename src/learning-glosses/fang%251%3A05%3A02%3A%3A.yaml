senseId: 'fang%1:05:02::'
synsetId: 01787875-n
simpleMeaning: a part of an insect that can put poison into another animal, usually one that grew from
  its legs over a long time
scope: This is a poison part of an insect, not a snake's poison tooth and not the long tooth of an animal
  that eats meat.
examples:
- The insect used a fang to put poison into its prey.
- One fang on each side grew from what were once legs.
