simpleMeaning: a duck with a large head that flies fast and dives into water, found in cold far-north
  places
scope: 'Also called goldeneye: a large-headed duck that flies fast and dives in far-north waters; not
  the song bird from Australia and south-east Asia.'
examples:
- A large-headed whistler dived under the icy water in the far north.
- We saw a whistler fly fast and low over the cold Arctic sea.
