simpleMeaning: connected with or belonging to one of the two main political parties in the United States
scope: Of the Republican Party in the United States; not the sense about a form of government where people
  vote for their leaders, and not a person who supports that kind of government.
examples:
- The Republican senator spoke to party members in Ohio.
- Republican party politics filled the news that week.
