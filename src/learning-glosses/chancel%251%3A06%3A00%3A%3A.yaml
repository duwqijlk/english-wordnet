simpleMeaning: the area around the altar of a church for the clergy and choir, often shut off by a screen
  or rail
scope: The area around the altar of a church for the clergy and choir, often shut off by a screen or rail;
  sanctuary and bema are other names for this sense, not the whole church and not the seats for the people.
examples:
- The choir sang from the chancel.
- A rail shut off the chancel from the rest of the church.
