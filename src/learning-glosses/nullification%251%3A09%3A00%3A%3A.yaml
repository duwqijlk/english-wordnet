senseId: 'nullification%1:09:00::'
synsetId: 06195483-n
simpleMeaning: The states'-rights teaching that a state may refuse to heed or enforce a federal law passed
  by the United States Congress.
scope: The states'-rights teaching that a state may refuse to heed or enforce a federal law passed by
  the United States Congress; not the act of making a thing null and void, undoing or overruling its force.
examples:
- Their nullification stirred the state.
- The nullification was argued at dawn.
