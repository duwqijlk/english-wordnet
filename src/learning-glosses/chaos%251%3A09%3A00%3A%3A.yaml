simpleMeaning: In physics, a system in which a tiny change at the start makes a very big change later
scope: In physics, a system where a tiny change at the start makes a big change later, not the state before
  the world was made and not wild confusion.
examples:
- The weather is a chaos system, so a small change can alter the forecast.
- In chaos theory, a tiny change can grow into a big one.
