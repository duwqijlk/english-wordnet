simpleMeaning: A tool that turns Allen screws.
scope: Also called the hex key, zeta key, zeta wrench, Allen key, Allen wrench, Inbus key, Inbus wrench
  and Unbrako wrench, this is a tool that turns Allen screws, not any other tool for screws.
examples:
- He tightened the bolt with his Unbrako key.
- The Unbrako key turned the Allen screw.
