simpleMeaning: about the Renaissance, the time in Europe in the 1400s and 1500s when people took a new
  interest in old Greek and Roman learning and in human ideas
scope: This sense, also called humanistic, is about the Renaissance movement described here; it is not
  about a person who follows that movement, and not about a later way of thinking based on human worth
  and reason.
examples:
- The library holds humanist books written during the Renaissance.
- Scholars gave humanist lectures on old Roman texts in Renaissance Italy.
