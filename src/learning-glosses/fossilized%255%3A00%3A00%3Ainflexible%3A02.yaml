senseId: fossilized%5:00:00:inflexible:02
synsetId: 01029012-s
simpleMeaning: firmly set in a usual pattern of how someone or something acts, what is done again and
  again, and what is believed, and not changing
scope: 'Also called ossified and fossilised: fixed in a set way and not changing, not turned into stone
  or bone like a real fossil and not just old in years.'
examples:
- The office has fossilized ways of working that no one is allowed to change.
- His fossilized beliefs left no room for new ideas.
