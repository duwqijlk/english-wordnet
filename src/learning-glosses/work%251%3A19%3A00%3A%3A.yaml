simpleMeaning: In physics, a form in which energy appears when one system transfers it to another, measured
  as force times the distance an object moves in the force's direction.
scope: This is the physics measure of energy transferred, not a job or occupation, not the activity of
  doing tasks, not something produced by effort, not a place where tasks are done, and not a piece of
  creative output.
examples:
- The work done by the motor equals force times distance.
- In physics class we measured the work needed to lift the block.
