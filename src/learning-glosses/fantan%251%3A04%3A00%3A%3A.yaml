simpleMeaning: 'a Chinese gambling game: players bet on how many of a haphazard heap of pieces under a
  bowl are left, 0, 1, 2, or 3, after counting in fours'
scope: Also called fan tan, this Chinese gambling game has players bet on how many pieces are left under
  a bowl after counting in fours.
examples:
- They played fantan with a pile of counters and a small bowl.
- In fantan, you bet on whether 0, 1, 2, or 3 counters will be left.
