simpleMeaning: showing that you understand what other people feel and are quick to see how things are
  for them
scope: 'Also called empathetic: this means understanding what other people feel, not just feeling sorry
  for them or being kind to them.'
examples:
- An empathic teacher noticed the boy was sad before he said a word.
- She gave an empathic answer that showed she understood his fear.
