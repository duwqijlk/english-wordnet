simpleMeaning: A germ caught through sex causes a disease that leaves small raised spots on the skin around
  the sex organs and the tops of the legs
scope: Also called granuloma venereum, this is a disease caught through sex that shows as small raised
  spots around the sex organs, not a disease of the skin alone.
examples:
- Granuloma inguinale left small raised spots on the skin around his groin.
- The doctor said the granuloma inguinale came from a germ caught through sex.
