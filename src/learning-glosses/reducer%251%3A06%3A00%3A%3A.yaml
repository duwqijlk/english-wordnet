simpleMeaning: A pipe fitting that joins two pipes of different widths.
scope: A pipe fitting that joins two pipes of different widths, not a substance that brings about a chemical
  change in another substance while itself changing in the opposite way, used in photography to make a
  negative or print less dark by taking away some of the loose silver.
examples:
- The plumber fitted a reducer where the wide pipe met the narrow one.
- A reducer joins the two pipes of different widths in the heating system.
