simpleMeaning: to reach the usual state, or to go back to the usual state it was in before
scope: For a thing or a situation to become normal again; not making something normal, and not the heating
  and then slowly cooling of a material to change how hard it is.
examples:
- Relations between the two countries began to normalize after the talks.
- After a few days, his breathing normalized and he felt well.
