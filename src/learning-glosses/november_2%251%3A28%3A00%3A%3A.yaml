simpleMeaning: The second day of that month is a day for praying for all the souls in purgatory, where
  the dead are made clean before they go to heaven.
scope: Also called All Souls' Day; this is a day for praying for the souls of the dead, not a feast day
  for the saints and not any other day in the year.
examples:
- Many people pray for the dead on November 2.
- November 2 is a day of prayer for all the souls in purgatory.
