simpleMeaning: A small unit of money used in Egypt, Lebanon, Sudan and Syria, worth a part of a larger
  unit
scope: A small money unit used in Egypt, Lebanon, Sudan and Syria, also called a piaster; not the Turkish
  unit of the same name, and not a whole pound.
examples:
- The shopkeeper gave me change in piastres.
- A piastre is only a small part of a pound.
