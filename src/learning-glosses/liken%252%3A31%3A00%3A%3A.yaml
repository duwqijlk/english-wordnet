simpleMeaning: to think of one thing as like or the same as another thing, or to say so
scope: 'Also called compare and equate: to think or say that one thing is like another, not to make the
  two things the same in real life.'
examples:
- The teacher likened learning a language to learning to ride a bike.
- He likens his team to a family because they help each other.
