simpleMeaning: To hold back feelings, wants, urges or acts on purpose, and not show them
scope: To hold back feelings, wants, urges or acts on purpose and not show them, also called suppress
  and inhibit; not to show feelings freely and not to forget them.
examples:
- She bottled up her fears and said nothing.
- Do not bottle up your feelings; talk about them.
