simpleMeaning: A plant of Europe that lives for years and spreads along the ground, with red or pinkish-white
  flowers and red roots, sometimes used in place of madder in dyeing.
scope: It is a creeping European plant used in dyeing, not a tall upright garden plant.
examples:
- The dyer's woodruff crept across the bank.
- Dyers once used dyer's woodruff roots for red dye.
