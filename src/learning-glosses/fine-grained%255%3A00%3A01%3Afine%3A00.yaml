simpleMeaning: Describes something that is thick and close in build, with very small parts.
scope: Describes something that is thick and close in build, with very small parts; also called close-grained,
  not a wood with wide open grain and not a loose crumbly stuff.
examples:
- The fine-grained birch felt smooth under the hand.
- Fine-grained rock breaks in neat flat pieces.
