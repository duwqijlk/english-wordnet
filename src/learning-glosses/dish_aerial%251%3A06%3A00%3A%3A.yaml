simpleMeaning: A piece of equipment that sends and catches radio waves and microwaves in one direction,
  using a parabolic reflector shaped like a bowl.
scope: Also called dish antenna, dish and saucer, this parabolic reflector sends and catches radio waves
  and microwaves in one direction only, not in all directions.
examples:
- The dish aerial caught the radio waves.
- The dish aerial sent the microwaves in one direction.
