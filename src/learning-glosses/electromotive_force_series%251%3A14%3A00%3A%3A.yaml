simpleMeaning: An ordered run of metal bits and charged bits, ranked by pole strength under set conditions,
  that shows how ready each metal is for cutting down ions under it.
scope: This sense is also called electrochemical series and electromotive series, an ordered run of metal
  bits and charged bits, ranked by pole strength under set conditions, that shows how ready each metal
  is for cutting down ions under it.
examples:
- Electromotive force series rank metals by pole power.
- The electromotive force series shows which metal cuts ions.
