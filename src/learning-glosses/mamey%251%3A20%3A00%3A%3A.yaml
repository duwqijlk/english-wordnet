simpleMeaning: A tree of warm America with fruit that can be eaten, covered by a tough skin like leather.
scope: A tree of warm America with edible fruit in a tough leathery skin, also called mammee, mammee apple,
  or mammee tree, not a palm and not a tree with fruit that cannot be eaten.
examples:
- The mamey tree shaded the yard.
- A mamey grew tall beside the house.
