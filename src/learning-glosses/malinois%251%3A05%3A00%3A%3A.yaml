simpleMeaning: A dog with short hair and a light brown coat, used to look after sheep
scope: This is a short-haired dog with a light brown coat that works with sheep, not a long-haired dog
  and not a dog kept only as a pet.
examples:
- Their malinois herded the sheep across the field.
- The malinois lay by the gate, its short light brown coat dusty from the yard.
