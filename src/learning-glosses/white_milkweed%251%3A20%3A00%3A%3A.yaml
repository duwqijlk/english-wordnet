simpleMeaning: Bare pale stems coated in wax and pale flowers shaped like stars mark this tall herb of
  the southwest of the United States.
scope: A tall herb of the southwest of the United States with bare pale stems and pale star-shaped flowers,
  unlike common milkweed, which has leaves on its stems.
examples:
- White milkweed stood tall with bare pale stems.
- The white milkweed showed pale flowers shaped like stars.
