simpleMeaning: The main judge is backed up by this helper, who above all watches the edge of the field
  and for players offside in tennis, soccer, football, and the like
scope: Also called an assistant referee, this helper backs up the main judge at a match, above all by
  watching the edge of the field and for players offside.
examples:
- The lines umpire called the ball out.
- A lines umpire watches the edge of the field while the game goes on.
