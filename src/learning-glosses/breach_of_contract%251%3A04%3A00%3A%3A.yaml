simpleMeaning: breaking a legal duty by failing to do what a deal requires
scope: Not doing what a deal requires, so breaking a legal duty; not a breach of duty, which is failing
  to take due care, and not just breaking a promise.
examples:
- The builder's breach of contract left the house half finished.
- She sued the firm for breach of contract after they missed the deadline.
