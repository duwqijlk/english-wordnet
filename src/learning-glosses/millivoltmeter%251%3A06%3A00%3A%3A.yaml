simpleMeaning: A sensitive meter that can measure electric push in thousandths of a volt.
scope: A sensitive meter that can measure electric push in thousandths of a volt, not a plain voltmeter
  and not a meter for current.
examples:
- The millivoltmeter read only a few thousandths of a volt.
- He checked the cell with a millivoltmeter.
