simpleMeaning: In medicine, the state of a living thing that can keep disease away and stay well
scope: In medicine, this is a living thing being able to keep disease away and stay well. It is not the
  wider power to fight harmful things around it, and not germs no longer being stopped by a drug.
examples:
- Good food and rest built up her resistance to colds.
- The child's resistance to infection was low after the illness.
