simpleMeaning: A perennial herb, sometimes with underground stems or tubers, found in damp shade, by streams
  and in grassy ground, with lacy leaves and clusters of small purple or yellow flowers.
scope: A grassland and woodland perennial with frothy flowers; it is not common rue, the strong-smelling
  cooking herb, and not goat's rue.
examples:
- Meadow rue self-seeds freely in damp shade.
- The meadow rue's lacy leaves moved in the breeze.
