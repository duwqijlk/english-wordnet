simpleMeaning: a paper that can be passed to another person, torn off, and handed in when you need it
  to get goods or a service
scope: A paper you hand in to get goods or a service, not money itself and not a ticket for a seat.
examples:
- She handed in a coupon for two pounds off the washing powder.
- He cut a coupon out of the paper before going to the shop.
