simpleMeaning: a part of a whole that has a part of a whole on its top or its bottom line
scope: A part of a whole with a part of a whole on its top or bottom line, not a plain part of a whole;
  complex fraction is another name for this sense.
examples:
- The compound fraction 1/2 over 3/4 has fractions on both its top and bottom lines.
- To work out the compound fraction, start with the fractions inside it.
