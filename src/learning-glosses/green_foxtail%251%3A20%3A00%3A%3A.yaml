simpleMeaning: A European grass with a soft brush-like head, now growing wild in North America, often
  a weed that causes trouble
scope: This European grass is also called bottle-grass, bottle grass, green bristlegrass and rough bristlegrass,
  and is not a garden grass and not a crop grass.
examples:
- Green foxtail grew thick along the fence.
- The farmer weeded out the green foxtail from the cornfield.
