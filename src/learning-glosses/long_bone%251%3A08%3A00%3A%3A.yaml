simpleMeaning: In the arms and legs of animals with a spine, a stretched-out round hard part that holds
  soft tissue inside
scope: 'Also called os longum: in the arms and legs of animals with a spine, a stretched-out round hard
  part that holds soft tissue inside, not a flat hard part and not a short round hard part.'
examples:
- The femur is a long bone in the leg.
- A long bone holds marrow inside.
