simpleMeaning: a blaze in a forest that moves very fast, leaping from the top of one tree to the top of
  the next ahead of the flames on the ground
scope: A very fast blaze in a forest that leaps from tree top to tree top ahead of the flames on the ground;
  not a slow burn on the ground and not a plant with yellow flowers.
examples:
- The crown fire raced through the dry forest in minutes.
- Firefighters could not stop the crown fire as it leapt from tree to tree.
