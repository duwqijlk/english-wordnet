simpleMeaning: When two sets of marks are put in order first, this is the way most often used to find
  how closely they move together.
scope: It is also called a rank-difference correlation coefficient, a rank-order correlation, or a rank-order
  correlation coefficient, and it is the way most often used to find how closely two sets of marks move
  together.
examples:
- The rank-difference correlation showed the two tests moved together.
- They used rank-difference correlation to compare the two sets of marks.
