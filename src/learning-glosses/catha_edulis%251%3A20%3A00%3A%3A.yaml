simpleMeaning: A bush grown by Arabs for its leaves, which people chew or use to make tea.
scope: This is a bush grown by Arabs for its leaves, which people chew or use to make tea, and not one
  of the other bushes grown for tea.
examples:
- Catha edulis grew in the farmer's field in the highlands.
- Men chewed the leaves of Catha edulis in the afternoon.
