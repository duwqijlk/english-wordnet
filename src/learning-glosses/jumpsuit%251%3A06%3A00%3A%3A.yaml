simpleMeaning: a single piece of clothing made like the uniform worn by people who jump from planes with
  a parachute
scope: A single piece of clothing made like the uniform of a person who jumps from a plane with a parachute,
  not two separate pieces of clothing.
examples:
- She wore a jumpsuit to the fancy-dress party.
- The mechanic's jumpsuit kept his clothes clean while he worked.
