simpleMeaning: A perennial herb of the East Indies to Polynesia and Australia, grown for its large edible
  root that yields Otaheite starch.
scope: Also called pia, Tacca leontopetaloides, and Tacca pinnatifida; a herb grown for its starchy root,
  not a potato.
examples:
- Indian arrowroot grew in the garden.
- We dug up Indian arrowroot for its root.
