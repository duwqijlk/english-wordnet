simpleMeaning: a feeling of being sad and low, with no hope and no wish to keep trying
scope: 'Also called heartsickness: a sad feeling with no hope, not a short bad mood after one bad day.'
examples:
- She fell into despondency after losing her job and stopped seeing friends.
- His despondency lifted a little when his friends came to help him.
