simpleMeaning: a silly or strange thing someone does for fun
scope: Also called joke, trick, prank and antic. It is a silly act done for fun, not a playful jump and
  not the plant or the pickled buds used in food.
examples:
- Dressing as a clown for the office party was his latest caper.
- The children planned a caper that left everyone laughing.
