simpleMeaning: a person who reads the set readings aloud in a church service, or who has been given a
  low rank in the Roman Catholic Church
scope: A person who reads the set readings aloud in a church service or holds a low rank in the Roman
  Catholic Church, also called a reader, not the priest who leads the service and not a person who reads
  books for fun.
examples:
- The lector read the lessons aloud during the service.
- He served as lector at the Sunday service.
