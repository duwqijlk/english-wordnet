simpleMeaning: A sum taken from costs or income from time to time to make up for the loss in worth of
  things owned
scope: A sum taken from costs or income to make up for loss in worth of things owned, not a tax and not
  the price of buying them.
examples:
- The depreciation charge lowered the firm's yearly profit.
- Each depreciation charge matched the wear on the machines.
