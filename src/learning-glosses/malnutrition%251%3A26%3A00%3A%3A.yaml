simpleMeaning: a poor state of health when food eaten is too little, too much, or the wrong mix, or the
  body cannot take what it needs from that food
scope: This is a poor state of health caused by the amount or mix of food eaten, or by the body not taking
  what it needs from food; not just feeling hungry after missing one meal.
examples:
- The child was weak because of malnutrition.
- Doctors found signs of malnutrition in many old people in the village.
