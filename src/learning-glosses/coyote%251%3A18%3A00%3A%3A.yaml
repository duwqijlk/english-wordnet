simpleMeaning: a person who fights fierce forest fires in far-off, hard-to-reach places, often for days
  at a time
scope: A firefighter sent to fight fierce, remote forest fires, not the wild dog and not a person who
  smuggles people across a border.
examples:
- The coyote crew hiked in to fight the blaze in the deep woods.
- After days on the fire line, the coyotes were flown out by helicopter.
