simpleMeaning: a small, pouch-like body part with no clear use, that goes out from the lower end of the
  cecum (the start of the large bowel)
scope: 'Also called cecal appendage: this is the small pouch in the body, not the extra pages added at
  the back of a book.'
examples:
- The doctor said her appendix had to come out that night.
- If your appendix bursts, you need care at once.
