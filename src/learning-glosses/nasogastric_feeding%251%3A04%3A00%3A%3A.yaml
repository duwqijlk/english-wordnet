simpleMeaning: Liquid food is given through a tube that goes in through the nose and down into the stomach.
scope: Liquid food given through a tube that goes in through the nose and down into the stomach, not food
  taken by mouth.
examples:
- Nasogastric feeding gives liquid food through a tube in the nose.
- Nasogastric feeding carries liquid food down a tube into the stomach.
