simpleMeaning: a slow-moving outlet of a lake, or a narrow part of a lake in wet land; a word used mainly
  in Mississippi and Louisiana
scope: This is a part of a lake with water going out slowly, or a narrow wet part of a lake; the word
  is used mainly in Mississippi and Louisiana. It is not a fast river and not the whole lake.
examples:
- Alligators live in the quiet bayou near the lake.
- We took a small boat down the bayou in Louisiana.
