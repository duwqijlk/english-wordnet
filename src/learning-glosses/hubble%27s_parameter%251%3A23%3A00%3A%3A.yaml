simpleMeaning: In cosmology, how fast a galaxy moves away, as the universe grows, divided by its distance
  from us; not truly fixed, it measures how fast the universe grows today.
scope: A number in cosmology about the growing universe, also called Hubble's constant, the Hubble constant,
  and the Hubble parameter; not a fixed number in nature and not a speed.
examples:
- Hubble's parameter links a galaxy's speed to its distance from us.
- Astronomers used Hubble's parameter to work out how fast the universe is growing today.
