simpleMeaning: a look inside the lower third of the large bowel, made with a thin tube, to find small
  growths
scope: A look inside the lower third of the large bowel to find small growths, also called flexible sigmoidoscopy;
  not a look at the whole bowel and not a blood test.
examples:
- The doctor ordered a sigmoidoscopy to check the lower bowel.
- Her sigmoidoscopy found no small growths in the bowel.
