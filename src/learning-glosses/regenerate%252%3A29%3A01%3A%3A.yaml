simpleMeaning: to grow again after being lost or hurt, so that a part of the body is made whole once more
scope: To grow again after being lost or hurt, not to replace a lost part by growing new tissue, and not
  to make a machine signal stronger.
examples:
- The lizard's lost tail will regenerate over time.
- Damaged skin can regenerate after an injury.
