simpleMeaning: Reporters from different papers and magazines who all follow the same stories
scope: A group of reporters from different papers who all follow the same stories; not one paper's own
  staff and not reporters who each follow different stories.
examples:
- The White House press corps asked the president about the new law.
- She joined the press corps to report on the election campaign.
