simpleMeaning: when something strong, large, or important quickly becomes weak, small, or unimportant
scope: 'Also called a fall: a sudden loss of power or standing, not water falling from the sky.'
examples:
- The downfall of the old house came swiftly.
- His downfall began when the firm lost its best clients.
