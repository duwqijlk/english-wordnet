simpleMeaning: A full-grown sex cell with one set of single chromosomes, tiny threads that carry what
  parents pass on.
scope: This is a full-grown sex cell with one set of single chromosomes; not a body cell, which has two
  sets, and not a sex organ.
examples:
- A gamete carries one set of chromosomes.
- Two gametes join to start a new living thing.
