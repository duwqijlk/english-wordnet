simpleMeaning: Cloth used to make bath towels and bath robes, usually cotton, made with loops that are
  not cut on either side
scope: 'Also called terrycloth and terry cloth: cloth with loops that are not cut on both sides, not a
  smooth cloth with no loops.'
examples:
- She bought a soft terry towel for the bathroom.
- The bath robe is made of thick terry.
