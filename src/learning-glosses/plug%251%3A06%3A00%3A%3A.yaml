simpleMeaning: a thing made to fill a hole tightly and stop something from passing through
scope: A thing that fills a hole tightly, not the part with pins that joins a machine to power, and not
  the part that starts an engine.
examples:
- He put a plug in the bath before he filled it with water.
- She pushed a wooden plug into the hole to stop the leak.
