senseId: 'pachyderma%1:26:00::'
synsetId: 14391202-n
simpleMeaning: skin that grows thick, most often on one arm or leg, when a tube that carries clear fluid
  is too big from birth and such a tube is blocked
scope: Skin that grows thick on an arm or leg, also called nevoid elephantiasis; not a rash and not a
  swelling that goes away in a few days.
examples:
- Pachyderma made the skin on his leg grow thick.
- The doctor said her pachyderma came from a blocked tube that carries clear fluid.
