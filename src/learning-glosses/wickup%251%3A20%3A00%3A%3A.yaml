simpleMeaning: A tall North American long-lived plant spreading by creeping roots, with narrow leaves
  and pinkish-purple flower spikes that grow thickly in burned areas or recent clearings; an important
  honey plant.
scope: This is the tall, pinkish-purple-flowered plant that springs up thickly on burned ground and clearings,
  not a garden flower or a woody shrub.
examples:
- After the forest fire, wickup covered the slopes in pink.
- Beekeepers value wickup because its flowers produce dark honey.
