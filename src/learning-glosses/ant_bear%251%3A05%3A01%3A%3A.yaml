simpleMeaning: A night burrowing mammal of the grasslands of Africa that feeds on termites, the only living
  member of the order Tubulidentata.
scope: Also called anteater and aardvark, a night burrowing mammal of the grasslands of Africa that feeds
  on termites, the only living member of the order Tubulidentata, unlike the sense for a large shaggy-haired
  toothless anteater with a long tongue and powerful claws, of South America.
examples:
- Ant bears feed on termites.
- An ant bear burrows at night.
