simpleMeaning: In a crystal that splits light in two, the line along which light goes without splitting
scope: A line in a light-splitting crystal, not the line through a lens where light goes straight.
examples:
- Light that runs along the optic axis of this crystal does not split in two.
- The optic axis of the sample showed no double image.
