simpleMeaning: a plant from California that lives one year and has red-brown spots near the foot of its
  yellow flower parts
scope: This is a California plant with red-brown spots at the foot of its yellow flowers, also called
  common madia; not a plant with plain yellow flowers and no spots.
examples:
- The common tarweed grew along the dry roadside in California.
- We saw the common tarweed's red-brown spots at the base of its yellow flowers.
