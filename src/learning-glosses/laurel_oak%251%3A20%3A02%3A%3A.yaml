simpleMeaning: Its leaves shine, and it drops them in the fall; this small tree of the east and middle
  United States gives wood used in the west for roof tiles
scope: A small tree of the east and middle United States with shiny leaves, not the large near-evergreen
  tree of the south-east with the same name and not other trees of its kind.
examples:
- A laurel oak grows at the edge of the yard.
- They cut laurel oak wood for shingles on the roof.
