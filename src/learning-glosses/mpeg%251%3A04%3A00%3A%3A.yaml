simpleMeaning: A set of agreed rules from the moving pictures experts group for shrinking digital picture
  and sound data, or a file of data shrunk by those rules.
scope: A set of agreed rules from the moving pictures experts group for shrinking digital picture and
  sound data, or a file of data shrunk by those rules, not the rules for still pictures.
examples:
- The film was saved as an MPEG file.
- MPEG lets a long video fit on a small disk.
