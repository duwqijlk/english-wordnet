simpleMeaning: The home chord closes a piece of music, coming after the chord before it, a closing often
  heard at the end of church singing.
scope: Amen cadence is another name for this closing, which ends a piece of music with the home chord
  after the chord before it.
examples:
- The choir ended the hymn with a plagal cadence.
- A plagal cadence closed the anthem.
