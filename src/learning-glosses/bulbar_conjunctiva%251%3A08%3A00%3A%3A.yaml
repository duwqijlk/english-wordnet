simpleMeaning: the part of the thin clear skin over the eye that covers the front of the white of the
  eye and the skin over the clear front window
scope: This is the part of the thin clear skin over the eye that covers the front of the white of the
  eye and the skin over the clear front window; conjunctival layer of bulb and tunica conjunctiva bulbi
  are other names for it, not the eyelid and not the tear duct.
examples:
- The bulbar conjunctiva covers the white of the eye.
- Redness of the bulbar conjunctiva made his eye look sore.
