senseId: degenerate%5:00:00:immoral:00
synsetId: 01553629-s
simpleMeaning: not held back by what people usually do or by ideas of right and wrong
scope: This describing sense is also called fast, dissipated, degraded, riotous, debauched, profligate,
  dissolute and libertine. It is not the noun sense, which is a person whose acts go far from what is
  seen as right, especially in sex.
examples:
- He lived a degenerate life, with no thought for right or wrong.
- The book tells of a rich, degenerate group that cared only for drink and sex.
