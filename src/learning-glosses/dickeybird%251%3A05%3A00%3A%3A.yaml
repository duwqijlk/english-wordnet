simpleMeaning: a little flying animal, named by a word grown-ups sometimes use when they speak to small
  children
scope: A little bird, also called dickey-bird, dicky-bird and dickybird, and not a big bird and not the
  plain word bird.
examples:
- A dickeybird sat on the branch and sang.
- The mother said, 'Look, a dickeybird!' to her little girl.
