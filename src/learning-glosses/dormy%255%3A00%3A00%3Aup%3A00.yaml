simpleMeaning: In match play, a side with a lead that matches the number of holes still to be played
scope: In match play, a side whose lead matches the number of holes still to be played, also called dormie,
  and not a side that is behind or one that has already won.
examples:
- He was dormy three and still lost the match.
- They went dormy with three holes left and held on to win.
