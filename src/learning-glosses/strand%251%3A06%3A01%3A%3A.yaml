simpleMeaning: Small things threaded on a line and worn round the neck as jewellery
scope: 'Also called chain and string: a necklace of things threaded together, not a thread and not a shore.'
examples:
- She wore a strand of pearls to the party.
- The strand of beads broke and the beads fell.
