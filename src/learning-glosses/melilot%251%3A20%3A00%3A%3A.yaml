simpleMeaning: a tall straight plant that lives one or two years, grown a great deal, above all for hay
  and to make the soil better
scope: A tall straight plant living one or two years, grown above all for hay and to better the soil;
  melilotus and sweet clover are other names for this sense, not clover grown for seed, and not a wild
  weed of no use.
examples:
- Melilot stood tall in the field, cut for hay before it set seed.
- Farmers sow melilot to feed the soil as well as to make hay.
