simpleMeaning: one of a pair of thin pipes that carry an egg from the place where eggs are made to the
  womb
scope: 'Also called an oviduct: one of the two pipes that carry an egg to the womb, not the hollow space
  inside the womb and not the place where eggs are made.'
examples:
- The egg moved slowly along the uterine tube.
- A block in a uterine tube can stop an egg from reaching the womb.
