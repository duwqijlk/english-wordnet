simpleMeaning: the quality of being hard and unpleasant to hear, see, feel, taste or smell
scope: 'Also called harshness: a hard, unpleasant quality for the senses; not an uneven surface you feel
  with your hand and not small holes in a surface.'
examples:
- The roughness of his voice hurt her ears after a while.
- She disliked the roughness of the cheap wine's taste.
