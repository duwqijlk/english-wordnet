senseId: 'nonconformity%1:07:00::'
synsetId: 04808279-n
simpleMeaning: Holding views or ways that go against the standards and values people expect, because one
  does not follow them.
scope: The state of holding views or ways that go against what people expect of one.
examples:
- Her nonconformity showed in the way she dressed and spoke.
- His nonconformity made him unpopular with the older teachers.
