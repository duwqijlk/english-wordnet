simpleMeaning: stretching or bending under pressure and then at once going back to its first shape
scope: Bending and springing back into shape at once, also called live and lively, not the sense of getting
  better after hard times.
examples:
- The ball is resilient and bounces back into shape.
- This turf is resilient under your feet.
