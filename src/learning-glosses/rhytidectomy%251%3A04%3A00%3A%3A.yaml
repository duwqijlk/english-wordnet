simpleMeaning: 'An operation to smooth the face: a cut near the hair, the skin drawn back, and extra flesh
  cut away to take off wrinkles and other marks of age.'
scope: 'Also called lift, facelift, face lift, face lifting, nip and tuck, cosmetic surgery, and rhytidoplasty:
  an operation to smooth the face by cutting near the hair and drawing the skin back, not surgery on another
  part of the body.'
examples:
- Some actresses have had more than one rhytidectomy.
- After the rhytidectomy, the wrinkles on her face were gone.
