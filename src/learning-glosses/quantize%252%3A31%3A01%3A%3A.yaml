simpleMeaning: A set list of values is used to stand in for a signal that changes without a break, giving
  each part the nearest value on the list.
scope: Also called quantise; it stands a set list of values in for a smooth signal, not the use of quantum
  theory on a quantity.
examples:
- The machine will quantize the sound wave into fixed steps.
- She learned to quantize a signal that rises and falls without a break.
