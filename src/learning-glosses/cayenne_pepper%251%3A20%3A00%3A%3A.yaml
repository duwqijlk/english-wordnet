simpleMeaning: a plant that bears very hot, long, thin fruits that taper to a point, most often red
scope: 'Also called cayenne, chili pepper, chilli pepper, jalapeno, and long pepper: a plant with very
  hot, long, thin, tapering fruits, not the ground spice and not a sweet pepper plant.'
examples:
- The cayenne pepper in her garden bore long red fruits all summer.
- He planted a row of cayenne pepper along the fence.
