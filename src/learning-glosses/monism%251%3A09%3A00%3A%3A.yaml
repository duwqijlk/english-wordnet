simpleMeaning: The view that all that is real is made of one stuff, and one stuff only
scope: The view that all that is real comes from one single stuff, not the view that mind and matter are
  two separate things and not the view that many things are real on their own.
examples:
- Monism holds that mind and matter are one stuff, not two.
- She turned to monism after years of doubt about two separate worlds.
