simpleMeaning: In mathematics, how two halves of a shape, or the parts of a link, match as mirror images
  on either side of a line or flat surface
scope: 'Also called balance: in mathematics, the two sides of a shape match exactly across a line, not
  a likeness between different things and not an exchange of letters.'
examples:
- The correspondence between the two halves of the drawing was perfect.
- In geometry, correspondence means one side mirrors the other across a line.
