simpleMeaning: In genetics, features that tend to be passed down together because their genes are joined,
  so all the genes of one chromosome travel together.
scope: Also called gene linkage; in genetics, features passed down together because their genes are joined,
  not a set of rods and springs that moves power in a machine.
examples:
- Linkage explains why the two traits appear together.
- The genes showed linkage on the same chromosome.
