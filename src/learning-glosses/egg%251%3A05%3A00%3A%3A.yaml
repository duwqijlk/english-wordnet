simpleMeaning: 'The reproductive body of an animal: a female sex cell or embryo with nourishing and protective
  layers around it, especially the thin-shelled kind laid by female birds.'
scope: The biological reproductive body itself, not a hen's egg eaten as food, and not the verbs meaning
  to throw or coat with egg.
examples:
- Each egg carries half the genes needed to form a new animal.
- The female frog releases thousands of eggs into the water.
