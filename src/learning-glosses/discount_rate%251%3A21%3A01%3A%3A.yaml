simpleMeaning: The charge for borrowing set by the Federal Reserve, paid by member banks when they borrow
  through its system
scope: The charge the Federal Reserve sets for member banks that borrow through its system, not the charge
  a shop gives and not a price cut.
examples:
- The discount rate rose, so member banks paid more to borrow.
- Banks watch the discount rate set by the Federal Reserve.
