simpleMeaning: a strong frame made of long pieces joined together, which holds up a roof, a bridge or
  another structure
scope: This sense is the strong frame that holds up a roof or bridge; it is not the medical belt that
  holds a body part in place and not a small triangle-shaped support in a building.
examples:
- The steel truss supports the roof of the hall.
- Workers put up a wooden truss for the new bridge.
