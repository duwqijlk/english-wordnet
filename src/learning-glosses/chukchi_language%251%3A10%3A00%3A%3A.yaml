simpleMeaning: A native tongue of unknown roots, cut off from other tongues, spoken by its own people,
  with men and women saying its sounds in different ways.
scope: Also called Chukchi, this is a tongue of unknown roots, not the Chukchi people themselves.
examples:
- Few people still speak the Chukchi language every day.
- In the Chukchi language, men and women say some sounds differently.
