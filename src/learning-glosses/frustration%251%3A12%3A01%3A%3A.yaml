simpleMeaning: A feeling of being cross because something gets in your way or someone finds fault with
  you
scope: Annoyance at being held back or picked on, not the feeling of being stopped from reaching a goal.
examples:
- Her constant complaints were a source of frustration for him.
- He felt frustration at the long wait and the sharp words.
