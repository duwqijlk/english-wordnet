simpleMeaning: connected with an art and thought style that praised speed, machines and new, strong ideas
  about modern life
scope: 'Also called futurist: this is about that art and thought style, not just about any thing that
  looks very new or modern.'
examples:
- The futuristic paintings showed fast trains and machines in bright, strong lines.
- He wrote futuristic poems that praised speed and modern machines.
