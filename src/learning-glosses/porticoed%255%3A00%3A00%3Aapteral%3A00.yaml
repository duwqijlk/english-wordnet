simpleMeaning: Said of a building with rows of pillars standing free at both ends or both sides
scope: 'Also called amphiprostylar, amphiprostyle and amphistylar: said of a building with rows of pillars
  standing free at both ends or both sides, not of a building with pillars joined to its walls.'
examples:
- The porticoed temple had pillars at both ends.
- They admired the porticoed front of the old hall.
