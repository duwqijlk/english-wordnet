simpleMeaning: one part in a thousand million million of a metre, used as a unit in the metric system
  for very small lengths
scope: 'Also called a femtometer and a fermi: a unit of length in the metric system, not a unit of weight
  and not a unit of time.'
examples:
- The femtometre is a tiny unit of length used in physics.
- A proton is about one femtometre across.
