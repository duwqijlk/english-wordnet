simpleMeaning: a small tough palm tree with sharp spines that grows in groups in the south of the United
  States
scope: A small tough spiny palm from the south of the United States; scrub palmetto is another name for
  this sense. Not a tall palm tree and not a desert cactus.
examples:
- Saw palmetto grows thick along the road in Florida.
- He cut back the saw palmetto near the fence.
