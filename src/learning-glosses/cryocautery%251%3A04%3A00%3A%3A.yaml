simpleMeaning: the use of a substance that kills body tissue by freezing it
scope: The use of a freezing substance to kill body tissue, not the tool itself used to do it.
examples:
- The doctor used cryocautery to freeze off the small growth.
- Cryocautery froze the tissue so it could be removed.
