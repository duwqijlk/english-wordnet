schema: oewn-learning-gloss-v2
senseId: 'overture%1:10:00::'
synsetId: 07179000-n
simpleMeaning: a suggestion made when not yet sure, to see how other people will react
scope: A suggestion made to test how others react, also called approach, also called advance, and also
  called feeler; not music at the start of an opera, and not a first event that leads into what follows.
examples:
- She made an overture to the other side to see if they wanted peace talks.
- His overture about working together was met with silence.
