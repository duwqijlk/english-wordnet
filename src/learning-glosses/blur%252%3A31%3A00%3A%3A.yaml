simpleMeaning: to make something not clear, so it is hard to see or understand well
scope: 'Also called confuse and obscure: to make something not clear; not the noun for a thing that looks
  unclear and not making a dirty mark on something.'
examples:
- Tears blurred her eyes, so she could not read the sign.
- Lack of sleep can blur your thinking and make simple choices hard.
