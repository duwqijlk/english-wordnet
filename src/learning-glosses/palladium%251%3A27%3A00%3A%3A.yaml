simpleMeaning: A silver-white metal of the platinum group, like platinum, found in some copper and nickel
  ores; it stays bright at normal heat and is used, mixed with gold, in jewelry.
scope: Also called Pd and atomic number 46; a silver-white metal of the platinum group, not platinum itself
  and not silver.
examples:
- Her ring is palladium, not gold.
- Palladium keeps its shine for years.
