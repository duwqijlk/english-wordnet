simpleMeaning: A state of very low mood and loss of joy so strong that a person needs care from a doctor
  or clinic.
scope: A state of very low mood and loss of joy so strong that a person needs care from a doctor or clinic,
  also called depression and depressive disorder; not a passing low mood and not grief after a loss.
examples:
- His clinical depression left him unable to enjoy anything.
- She sought help when clinical depression made each day hard to face.
