schema: oewn-learning-gloss-v2
senseId: 'optical_isomer%1:27:01::'
synsetId: 92429524-n
simpleMeaning: One of two forms of the same stuff that are mirror images of each other and cannot be laid
  one on the other to match
scope: One of a pair of forms of the same stuff that mirror each other but do not match when laid one
  on the other; not two forms that are the same in every way and not two different stuffs.
examples:
- This optical isomer is the mirror image of the other one.
- The two optical isomers cannot be laid one on the other to match.
