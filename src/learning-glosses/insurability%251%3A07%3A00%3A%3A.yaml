simpleMeaning: The fact of being able to be covered by insurance, and the terms set by a firm on which
  it will sell such cover to a person who asks
scope: The fact of being able to be covered, and the terms set by a firm on which it will sell cover,
  not the price alone and not a refusal of cover.
examples:
- Her age affects the insurability of her house.
- The firm checked his insurability before naming a price.
