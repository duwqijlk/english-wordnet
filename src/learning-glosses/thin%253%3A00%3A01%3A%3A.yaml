simpleMeaning: Measuring a comparatively short distance through from one surface to the opposite, or when
  cut across.
scope: This measures how little an object has through from side to side, not how runny a liquid is or
  how little fat a body has.
examples:
- She cut the bread into thin, even slices.
- A thin layer of dust covered the shelf.
