simpleMeaning: to hit someone or something hard, again and again
scope: 'Also called batter, and another name for it is baste: hitting a person or thing hard again and
  again, not winning against them in a game.'
examples:
- She clobbered the man who tried to attack her.
- The boxer clobbered his opponent with punch after punch.
