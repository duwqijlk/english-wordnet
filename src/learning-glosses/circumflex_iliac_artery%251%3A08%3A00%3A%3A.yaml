simpleMeaning: a blood tube that carries blood to the lower wall of the belly, the skin there, and the
  long thin muscle at the front of the thigh
scope: A blood tube feeding the lower belly wall, the skin there and the long muscle at the front of the
  thigh; arteria circumflexa ilium is another name for this sense, not the vein of the same name and not
  a blood tube of the arm.
examples:
- The circumflex iliac artery feeds the lower belly wall.
- A cut to the circumflex iliac artery can bleed heavily.
