simpleMeaning: a strong paper or thin card with a smooth light brown surface, made from a plant fibre
  such as hemp
scope: 'Also called manilla, manila paper and manilla paper: this is the strong light brown paper itself,
  not the city of Manila.'
examples:
- She put the papers in a strong manila envelope.
- He wrote the address on a manila folder made of thin card.
