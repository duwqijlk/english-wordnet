simpleMeaning: Of foods low in fat and salt and other things that may bring on sickness of the blood-pumping
  organ in the chest.
scope: Foods low in fat and salt and in other things that may bring on sickness of the blood-pumping organ,
  not foods that are low in fat alone and not foods that are low in salt alone.
examples:
- Oats and fresh fish are heart-healthy foods.
- She chose a heart-healthy meal with little salt and no fried food.
