senseId: 'conventionality%1:07:00::'
synsetId: 04808781-n
simpleMeaning: Accepting the usual beliefs and ways of doing things, simply because they are the accepted
  ones.
scope: Also called convention, holding to accepted beliefs and ways because they are the usual ones; not
  the lack of new ideas that comes from being too conventional, and not merely going along with accepted
  thought and behaviour.
examples:
- Her conventionality showed in every choice she made, from her clothes to her opinions.
- The committee's conventionality kept it from trying anything new.
