simpleMeaning: a stretch of water shut off from the sea by a bank of sand or coral
scope: A stretch of water shut off from the sea by sand or coral, not a lake inland and not the open sea.
examples:
- They swam in the warm waters of the lagoon.
- The lagoon was cut off from the sea by a reef of sand.
