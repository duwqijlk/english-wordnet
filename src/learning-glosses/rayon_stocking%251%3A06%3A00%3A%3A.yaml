simpleMeaning: Women's long leg coverings made of a thin, see-through cloth of man-made fibre or silk
scope: Women's long leg coverings of thin cloth, also called nylons, a nylon stocking, rayons or a silk
  stocking; not men's socks and not tights.
examples:
- She wore a rayon stocking with her best dress.
- A rayon stocking tore on the chair leg.
