simpleMeaning: A paper that the person who pays and the person who is paid agree has value; it is not
  money, but it may be changed into money
scope: A paper with agreed value that may be changed into money, not money itself and not a coin or bank
  note.
examples:
- The workers were paid in scrip that could be used at the company store.
- During the war, people used scrip when normal money was hard to get.
