senseId: activated%5:00:00:reactive:00
synsetId: 01935325-s
simpleMeaning: a bit of matter, such as a molecule, that reacts more readily now, after being changed
  so it can join in a chemical change at all
scope: This is about a bit of matter made able to join in a chemical change, and excited is another name
  for this sense; it is not the sewage sense of activated, and not simply made active in general.
examples:
- The activated molecule can now join in a chemical reaction.
- Heat left the activated gas ready to react with other stuff.
