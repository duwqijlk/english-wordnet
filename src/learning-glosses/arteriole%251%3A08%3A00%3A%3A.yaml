simpleMeaning: a small blood vessel with thin walls that leads into the tiniest blood vessels
scope: 'Also called arteriola and capillary artery: a small, thin-walled blood vessel that leads into
  the tiniest vessels, not a big artery and not a vein.'
examples:
- The arteriole carries blood toward the capillaries.
- The arteriole ends where the capillaries begin.
