simpleMeaning: A mechanical tool for winding the spring of a clock or other spring-driven device so it
  keeps running.
scope: This is a tool for tightening a spring, not a button you press or a device that grants access.
examples:
- He lost the little key that winds the grandfather clock.
- She turned the key in the toy robot's back until the spring was tight.
