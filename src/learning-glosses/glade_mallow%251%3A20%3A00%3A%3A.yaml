simpleMeaning: a tall rough plant with hand-shaped leaves and many small white flowers, male and female
  on separate plants, wild in most river soils of the eastern and central United States
scope: A tall rough plant with hand-shaped leaves and many small white flowers, growing wild in river
  soils of the eastern and central United States; not a garden flower grown in beds.
examples:
- Glade mallow grows wild along the river banks of the eastern United States.
- The glade mallow by the path had hand-shaped leaves and small white flowers.
