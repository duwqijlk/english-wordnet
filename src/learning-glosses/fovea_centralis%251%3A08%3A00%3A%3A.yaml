simpleMeaning: Cones that sense light pack a small hollow at the back of the eye, where what you see is
  clearest.
scope: Also called fovea, this names the hollow at the back of the eye where sight is clearest.
examples:
- The fovea centralis lies in the middle of the retina.
- Damage to the fovea centralis blurs the centre of sight.
