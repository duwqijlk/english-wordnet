simpleMeaning: A soldier who ruled a German town in the 1100s and 1200s
scope: A soldier who ruled a German town in the 1100s and 1200s, not a nobleman who ruled a castle by
  birth and not a town mayor of today.
examples:
- The burgrave kept order in the town with his soldiers.
- In the 1200s the burgrave ruled the town.
