simpleMeaning: a state in which the work of an animal's body stops for a time but can start again
scope: A state in which the work of an animal's body stops for a time but can start again, not death and
  not sleep.
examples:
- The tiny animal entered cryptobiosis when the pond dried up.
- In cryptobiosis, the animal's body work stops until water returns.
