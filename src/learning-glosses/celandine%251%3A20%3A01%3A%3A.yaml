scope: A long-lived herb, with a branched woody stock and bright yellow flowers; also called greater celandine,
  swallow wort, or swallowwort; not a North American one-year plant, with flowers, usually yellow or orange,
  growing chiefly on wet, rather acid ground.
examples:
- Their celandine bloomed at dawn.
- The celandine grew in the yard.
