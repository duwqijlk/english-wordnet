simpleMeaning: a tool that measures how far the direction a compass points is from true north
scope: A tool for measuring the gap between magnetic north and true north, not a compass itself and not
  a tool that measures how strong a magnet is.
examples:
- The surveyor used a declinometer to find how far magnetic north lay from true north.
- With a declinometer, she measured the angle at the field station.
