simpleMeaning: A light jacket that fastens with one row of buttons, often with stripes in the colors of
  a club or school.
scope: A light jacket with one row of buttons, not a heavy coat and not a sports shirt.
examples:
- He wore a navy blazer to the match.
- The school blazer had red and gold stripes.
