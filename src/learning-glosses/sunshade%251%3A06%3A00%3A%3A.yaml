simpleMeaning: a cover made of canvas (strong cloth) hung up to keep rain or sun off people or things
scope: 'Also called an awning: a fixed cloth cover that keeps off sun or rain, not the small shade you
  hold in your hand and can fold up.'
examples:
- A sunshade stretched over the market stall kept the fruit in shadow.
- We sat under the sunshade outside the shop at noon.
