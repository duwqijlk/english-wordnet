simpleMeaning: to enter a place or a person's private life without a right to be there, or to break a
  right or rule that belongs to someone else
scope: This is going into a place or a person's life when you have no right to be there, or breaking a
  right that belongs to them. Not an army entering a country to take it, and not an illness or attack
  that harms the body.
examples:
- This new worker invades my space at work and will not leave me alone.
- Do not invade people's privacy by reading their letters.
