simpleMeaning: In bookkeeping, the two sides of a set of accounts not adding up to the same amount
scope: In bookkeeping, the two sides of a set of accounts not adding up to the same amount; not sick in
  the mind, and not a thing that tips to one side.
examples:
- The unbalanced books showed more money going out than coming in.
- If the ledger stays unbalanced, the clerk must find the missing sum.
