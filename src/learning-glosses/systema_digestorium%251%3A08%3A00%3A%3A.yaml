senseId: 'systema_digestorium%1:08:00::'
synsetId: 05336763-n
simpleMeaning: The parts of the body that break food down so the body can take it in
scope: The parts of the body that break food down; systema alimentarium is another name for this sense,
  not the parts that move the body and not the parts that carry blood.
examples:
- The systema digestorium breaks food down for the body.
- Illness of the systema digestorium can cause pain after meals.
