senseId: 'quarterfinal%1:11:00::'
synsetId: 07482352-n
simpleMeaning: one of four games in a contest where the loser goes out, and the winners go on to play
  in the games just before the final
scope: This is one of the four games at this stage of a contest where the loser goes out; it is not the
  game just before the final, and not the final itself.
examples:
- She won her quarterfinal and moved on to the next round.
- The quarterfinal was close, but our team won by two points.
