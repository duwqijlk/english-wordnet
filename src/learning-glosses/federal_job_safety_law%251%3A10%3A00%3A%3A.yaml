simpleMeaning: Congress in the United States passed this measure, which brought a new agency into being
  to stop workers being hurt or falling ill while at work.
scope: Also called the occupational safety and health act, this is the United States Congress law that
  brought the Occupational Safety and Health Administration into being, to stop workers being hurt or
  falling ill on the job.
examples:
- Congress passed the federal job safety law to protect workers.
- She read the federal job safety law to learn what the new agency was meant to do.
