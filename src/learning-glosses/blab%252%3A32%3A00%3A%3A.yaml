simpleMeaning: to tell other people information that should stay secret
scope: 'This sense is also called talk, sing, peach, babble, and tattle: it means telling a secret, not
  talking fast about small, unimportant things.'
examples:
- Please do not blab about the surprise party.
- He blabbed the secret to everyone at work.
