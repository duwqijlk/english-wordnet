simpleMeaning: A huge four-legged plant-eating dinosaur, common in North America in the late Jurassic
  age.
scope: A huge four-legged plant-eating dinosaur of late Jurassic North America; brontosaurus, apatosaurus,
  and apatosaur are other names for this sense, not a meat-eating dinosaur and not a stegosaur.
examples:
- The brontosaur stretched its long neck to reach the treetops.
- A brontosaur skeleton fills the museum hall.
