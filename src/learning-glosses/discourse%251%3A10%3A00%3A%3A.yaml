simpleMeaning: a long piece of talk or writing, often with people taking turns, that deals with one subject
scope: 'Also called discussion and treatment: a long piece of talk or writing, often with back-and-forth,
  that deals with one subject, not a short remark and not speech in general.'
examples:
- The book's discourse on modal logic runs for three chapters.
- His discourse on the race question was badly biased.
