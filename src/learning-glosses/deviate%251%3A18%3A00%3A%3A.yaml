simpleMeaning: a person whose way of acting is not what people accept, especially in sex
scope: 'Also called pervert, degenerate, deviant and perv: a person whose acts, especially about sex,
  are not accepted; not the verb sense of going away from a path or plan.'
examples:
- In the report, he was described as a deviate whose sexual behavior troubled his neighbors.
- The police file labeled the man a deviate after several complaints about his sexual behavior.
