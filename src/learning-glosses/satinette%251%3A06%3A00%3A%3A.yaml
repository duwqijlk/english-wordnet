simpleMeaning: Its surface looks and feels like satin, though the fabric itself is cotton or a man-made
  fibre, in whole or in part.
scope: Also called satinet, it is a fabric whose surface looks and feels like satin, made wholly or in
  part from cotton or a man-made fibre.
examples:
- The jacket was lined with satinette.
- Her skirt was made of satinette.
