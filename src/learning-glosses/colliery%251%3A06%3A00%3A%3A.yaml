simpleMeaning: a place of work that has a coal mine and all the buildings and tools and machines used
  with it
scope: A coal mine with all its buildings, tools and machines, also called a pit; not just a deep hole
  in the ground.
examples:
- The colliery employed two hundred men from the village.
- After the colliery closed, the mine buildings stood empty.
