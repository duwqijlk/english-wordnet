simpleMeaning: a sore hurt in the skin, made when a small bug pushes its sharp point into you
scope: Also called a bite, this is a sore hurt in the skin made by a bug, not a trick to get money and
  not a sharp pain with no mark on the skin.
examples:
- The bee sting left a red sore mark on her arm where the bug had pushed in its point.
- He put cold water on the wasp sting to ease the sore hurt in his skin.
