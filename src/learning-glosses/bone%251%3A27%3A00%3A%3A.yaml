simpleMeaning: the light material, full of tiny holes and hardened by calcium, that the skeleton is made
  of
scope: The hard substance itself, not the body tissue it makes up or the pale colour sense.
examples:
- The handle of the old knife was carved from bone.
- Beads made of polished bone hung around her neck.
