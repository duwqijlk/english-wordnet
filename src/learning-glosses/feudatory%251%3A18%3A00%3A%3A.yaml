simpleMeaning: In old times, a lord gave this person land to keep, and the person owed the lord loyalty
  and work in return
scope: 'Also called a liege, a liege subject, or a vassal: a person who held land from a lord and owed
  loyalty and work in return, not the lord himself and not a free farmer.'
examples:
- The feudatory swore loyalty to his lord and worked the land he held.
- Each feudatory owed his lord both loyalty and service.
