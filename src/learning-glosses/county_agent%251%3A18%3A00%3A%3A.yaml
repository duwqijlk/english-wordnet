simpleMeaning: A person paid by the government to help people in the countryside learn ways to farm and
  run a home.
scope: This is a government adviser for country people, not a farm worker or a teacher; also called agricultural
  agent and extension agent.
examples:
- The county agent visited our farm to talk about soil.
- She asked the county agent how to preserve vegetables.
