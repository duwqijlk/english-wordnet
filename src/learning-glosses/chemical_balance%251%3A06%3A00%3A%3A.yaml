simpleMeaning: a beam scale made to weigh things with great care, used to find the amounts of stuff in
  a sample when testing it
scope: 'Also called an analytical balance: a very exact weighing scale for lab tests, not a shop scale
  and not a plain beam scale.'
examples:
- The chemist put the powder on the chemical balance to weigh it.
- Our lab uses a chemical balance for work that needs great care.
