senseId: 'angular_momentum%1:07:00::'
synsetId: 05036493-n
simpleMeaning: how much spin a turning thing carries, found by joining its weight and speed of turning
  with how far it lies from the line it turns about
scope: The amount of spin carried by a spinning thing, not the spin itself and not the speed of a thing
  moving in a straight line.
examples:
- Any rotating body has an angular momentum about its center of mass.
- A spinning top keeps its angular momentum until friction slows it down.
