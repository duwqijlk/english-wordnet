simpleMeaning: to hit someone hard again and again with a whip or a thin stick
scope: 'Also called slash, whip, lash, strap, welt, lather and flog: to hit someone hard with a whip or
  rod, not to tell them off in angry words.'
examples:
- In the old school, the teacher trounced boys with a thin rod.
- He was trounced again and again with a whip until he fell down.
