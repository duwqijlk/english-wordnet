senseId: 'stalemate%2:33:00::'
synsetId: 01079596-v
simpleMeaning: to bring something to a point where no side can win or move on and no progress can be made
scope: This verb means to bring something to such a stop; it is not the noun for a chess position where
  a player has no safe move to make.
examples:
- The long talks stalemated both sides, and no one could move forward.
- His last move stalemated the chess game.
