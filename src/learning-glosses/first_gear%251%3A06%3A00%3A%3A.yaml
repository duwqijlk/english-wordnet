simpleMeaning: The lowest forward setting in a vehicle's box of wheels and shafts, used to set a vehicle
  moving.
scope: The lowest forward setting in a vehicle's box of wheels and shafts, used to set a vehicle moving;
  also called low, first and low gear, not a high setting for fast driving and not the reverse setting.
examples:
- Put the car in first gear to pull away from the kerb.
- First gear gives the most pull for starting off.
