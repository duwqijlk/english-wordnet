simpleMeaning: one of a pair of nerves that starts in the neck, runs down through the chest, and works
  the muscle sheet under the lungs that moves air in and out
scope: 'Also called phrenic nerve: one of a pair of nerves that runs down the chest to work the breathing
  muscle, not a nerve of the arm and not a nerve that works the heart.'
examples:
- The nervus phrenicus carries signals from the neck down to the breathing muscle.
- If the nervus phrenicus is hurt, breathing can become hard.
