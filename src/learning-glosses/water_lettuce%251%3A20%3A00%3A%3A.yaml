simpleMeaning: a common weed of rivers and lakes that floats, its wedge-shaped leaves spread in a ring;
  it grows in warm lands everywhere
scope: Also called pistia or water cabbage; a floating plant of warm rivers and lakes, not the lettuce
  eaten in salads.
examples:
- Water lettuce covered the slow river with a green mat of leaves.
- The water lettuce floated in a ring of wedge-shaped leaves.
