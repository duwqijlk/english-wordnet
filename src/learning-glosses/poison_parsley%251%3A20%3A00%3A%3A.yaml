simpleMeaning: A large, branching two-year plant native to Eurasia and Africa and brought to North America,
  with large fern-like leaves and white flowers; usually in damp places, every part extremely toxic.
scope: Poison hemlock and hemlock are other names for this same plant; this is not the parsley used in
  cooking or the evergreen hemlock tree.
examples:
- Poison parsley has white flowers and large, fern-like leaves.
- Every part of poison parsley is extremely toxic.
