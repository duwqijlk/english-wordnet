simpleMeaning: in a bright, cheerful way that shows a smart and fashionable style
scope: This word tells how someone does something or wears something with cheerful, fashionable style,
  not in a plain or sad way.
examples:
- His hat sat jauntily on his head as he walked down the street smiling.
- She jauntily swung her bright scarf over her shoulder and went out.
