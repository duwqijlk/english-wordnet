simpleMeaning: Pestering a person again and again with little annoyances, in fun or in a mean way, above
  all by making fun of them.
scope: This is the act of needling a person again and again, also called tease, teasing, and ribbing.
examples:
- His tantalization went on all afternoon.
- She put up with his tantalization in silence.
