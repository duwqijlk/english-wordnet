simpleMeaning: to shake hard and fast, with no control, because you are very scared or very excited
scope: Also called shiver or shudder, this is shaking of the body, not feeling a sudden strong rush inside
  and not making another person feel that rush.
examples:
- His body thrilled and shook hard when the sudden noise scared him.
- She thrilled with excitement, her hands shaking as she waited for the news.
