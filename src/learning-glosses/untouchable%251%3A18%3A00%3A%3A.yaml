simpleMeaning: a person who belongs to the lowest class in India, in daily life and in religious life
scope: A person in the lowest class in India, not the adjective sense meaning not clean in a religious
  way.
examples:
- As an untouchable, he was kept apart from people in higher classes.
- Untouchables in the village lived and worked apart from others.
