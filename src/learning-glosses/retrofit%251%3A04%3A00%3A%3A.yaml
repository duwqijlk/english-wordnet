simpleMeaning: the act of adding a new part to something, when that part was not there when the thing
  was made
scope: This is the act of adding a new part, not the new part itself that is added.
examples:
- The retrofit of all the school buses took six weeks to finish.
- A retrofit was ordered so that safety belts could be added to the old cars.
