simpleMeaning: A soft name for death, as bed-rest is tomb-rest.
scope: This sense is also called rest and sleep, for a soft name for death, as bed-rest is tomb-rest,
  where rest is a mild or indirect word for death, comparing lying in bed with lying in a grave, and sleep
  is a gentle way of saying death, comparing rest in a bed with rest in a grave.
examples:
- Quietus is a soft name for death.
- Quietus likens bed-rest to tomb-rest.
