senseId: 'mosaicism%1:26:00::'
synsetId: 14594609-n
simpleMeaning: The state of a living thing that has two or more groups of cells in its body, each group
  with different genes.
scope: In genetics, for an organism whose body holds two or more cell groups unlike in their genes.
examples:
- Mosaicism showed in the plant, some of its cells carrying different genes.
- The test found mosaicism, with two groups of cells unlike in their genes.
