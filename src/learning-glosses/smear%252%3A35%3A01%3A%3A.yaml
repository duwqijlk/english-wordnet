simpleMeaning: to make a dirty mark on something by rubbing it, and leave it dirty
scope: 'Also called blur and smudge: to make a dirty mark by rubbing, not to spread a substance over a
  whole surface and not to attack someone''s good name with false claims.'
examples:
- She smeared the wet ink and left a dirty mark across the page.
- The child smeared mud on his shirt and made it dirty.
