simpleMeaning: to make the body loose and bendy by stretching, as if to get ready for hard exercise
scope: To make the body loose and bendy by stretching, as if to get ready for hard exercise; loosen up
  and warm up are other names for this sense, not cooling down after exercise and not a single stretch
  alone.
examples:
- The players limber up before the game with slow stretches.
- She likes to limber up for ten minutes before she runs.
