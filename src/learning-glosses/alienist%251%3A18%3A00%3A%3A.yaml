simpleMeaning: a doctor who treats illnesses of the mind and gives expert help on the law about them
scope: A mind doctor who works with the law, not a doctor who only treats the mind and not a lawyer.
examples:
- The alienist was called to give evidence about the man's state of mind.
- An alienist examined the prisoner before the trial.
