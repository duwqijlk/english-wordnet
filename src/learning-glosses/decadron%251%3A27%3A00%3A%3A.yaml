simpleMeaning: A drug that calms the body's swelling, sold as Dexamethasone Intensol, Dexone, Hexadrol
  or Oradexon, used to treat allergies or swelling
scope: Also called dexamethasone, Dexamethasone Intensol, Dexone, Hexadrol and Oradexon, it is a drug
  that treats allergies and swelling, standing apart from other allergy drugs by calming swelling too.
examples:
- The doctor gave her Decadron for her allergy.
- Decadron reduced the swelling in his knee.
