simpleMeaning: a tube-like part put into the pipe that takes waste gases out of an engine, made to make
  the sound less loud
scope: 'Also called muffler: this part cuts engine sound, not the short tube put on a gun to make its
  shot less loud.'
examples:
- The car's silencer was broken, so the engine sounded very loud.
- He fitted a new silencer to the exhaust pipe.
