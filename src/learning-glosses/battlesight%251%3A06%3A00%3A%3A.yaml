simpleMeaning: Fixed on a gun, these marks let the shooter take quick aim at a near target.
scope: These marks fixed on a gun for quick aiming at a near target are also called the battle sight.
examples:
- The battlesight on the rifle helped the shooter aim fast at a near target.
- The shooter raised the gun and used the battlesight to aim at close range.
