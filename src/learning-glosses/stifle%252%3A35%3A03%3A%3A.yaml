senseId: 'stifle%2:35:03::'
synsetId: 01478810-v
simpleMeaning: to make it hard for someone to breathe, or to block the way air moves in
scope: 'Also called choke, and another name for it is suffocate: this sense is about making breathing
  hard, not holding a feeling back to make it less strong, and not a knee joint in an animal.'
examples:
- The thick smoke stifled the children in the small room.
- Hot, dirty air can stifle a person who is shut in a small place.
