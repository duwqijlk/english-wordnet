simpleMeaning: The number that comes from adding twenty-two and one.
scope: Also called 23 and twenty-three; the number after twenty-two, not twenty-two and not twenty-four.
examples:
- XXIII in Roman numerals means twenty-three.
- There were XXIII chairs in the hall.
