simpleMeaning: to draw a picture like a plan that shows how amounts that change act on each other, or
  how a thing is put together
scope: 'Diagram is another name for this sense: drawing a picture like a plan to show how changing amounts
  act on each other or how a thing is built. Not a chart that shows the movement of a thing, and not planning
  the events in a story or play.'
examples:
- She plotted how the parts of the machine fit together in a clear drawing.
- They plotted the links between the different values before building the model.
