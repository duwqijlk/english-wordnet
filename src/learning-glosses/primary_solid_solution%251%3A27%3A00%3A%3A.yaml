simpleMeaning: Tiny bits of one stuff join the crystals of a metal to form part of a metal mix, a hard
  mix that stays the same over a range of mixes
scope: Also called solid solution; a hard mix that stays the same and forms part of a metal mix.
examples:
- A primary solid solution stays the same over a range of mixes.
- The primary solid solution formed when tiny bits of one stuff joined the crystals of a metal.
