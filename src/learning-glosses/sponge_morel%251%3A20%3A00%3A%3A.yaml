simpleMeaning: pits and ridges in an uneven pattern mark the round or long head of a morel that is good
  to eat and much liked
scope: Also called a common morel and a sponge mushroom, it is a morel known for its pitted head.
examples:
- They ate the sponge morel.
- The sponge morel grew round and pitted.
