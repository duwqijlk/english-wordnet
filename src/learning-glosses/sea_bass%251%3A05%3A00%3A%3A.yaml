simpleMeaning: Any of many food and game fishes of the Atlantic shore of the United States, with a long
  body and a long spiny fin on the back
scope: Any of many food and game fishes of the Atlantic shore of the United States, with a long body and
  a long spiny fin on the back; not a freshwater bass and not a cod.
examples:
- They caught a sea bass off the Atlantic coast.
- The sea bass had a long spiny fin on its back.
