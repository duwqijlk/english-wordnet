simpleMeaning: Made specially to put words and pictures on paper, this thick but soft liquid dries fast
scope: A thick liquid that dries fast and puts words and pictures on paper; printer's ink is another name
  for this sense, not paint and not the liquid in a pen.
examples:
- The printing ink on the newspaper came off on my fingers.
- They ordered more printing ink for the big run of books.
