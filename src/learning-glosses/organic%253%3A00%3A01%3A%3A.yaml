simpleMeaning: In chemistry, made of or based on carbon, the stuff found in living things
scope: A carbon chemical, not food grown with no chemicals, not to do with the body, not to do with living
  things in general, and not a fertilizer.
examples:
- Hydrocarbons are organic compounds.
- This cleaner is organic, not mineral.
