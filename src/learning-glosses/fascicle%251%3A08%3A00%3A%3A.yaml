simpleMeaning: A bunch of thin threads held together, most of all the threads that carry messages in the
  body
scope: 'Also called a fasciculus, a fiber bundle, and a fibre bundle: a bunch of threads, most of all
  nerve threads, not a single thread and not a bunch of hair.'
examples:
- The fascicle of nerve fibers carried signals from the hand to the brain.
- Each fascicle in the muscle held hundreds of thin threads.
