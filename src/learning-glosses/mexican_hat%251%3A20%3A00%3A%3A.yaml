simpleMeaning: A coneflower with flower heads like a sombrero, a tall red-brown disk and drooping yellow
  or yellow and red-brown rays, growing on plains at the foot of the Rocky Mountains.
scope: A coneflower of the plains at the foot of the Rocky Mountains; also called Ratibida columnaris.
examples:
- Mexican hat dots the plains with yellow rays.
- Mexican hat grows tall along the foot of the Rockies.
