simpleMeaning: a long-gone reptile of the Jurassic and Cretaceous, each front leg with a very long fourth
  finger holding up a thin skin wing, and a beak like a bird
scope: 'Also called a flying reptile: a long-gone winged reptile with a bird-like beak, not a bird and
  not a bat.'
examples:
- A pterosaur soared over the Jurassic sea on skin wings.
- The pterosaur's beak was like a bird's, but it was a reptile.
