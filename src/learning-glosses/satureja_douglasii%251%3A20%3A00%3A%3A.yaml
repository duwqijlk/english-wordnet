simpleMeaning: A plant that lives for years, keeps its leaves through winter, and trails along the ground
  in the north-west United States, with small white flowers; used as a medicine.
scope: 'Also called yerba buena, Micromeria chamissonis, or Micromeria douglasii: a trailing herb with
  small white flowers used as a medicine, not a tall garden herb and not a plant used only for cooking.'
examples:
- Satureja douglasii trails along the ground in the north-west.
- The small white flowers of Satureja douglasii bloom in summer.
