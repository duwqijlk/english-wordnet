simpleMeaning: a mix of things, often salt and ice, that makes a cold below the point where water turns
  to ice
scope: This is a mix, often of salt and ice, that makes a cold below the point where water turns to ice;
  not ice alone or a fridge.
examples:
- A freezing mixture of salt and ice kept the cream cold.
- The teacher made a freezing mixture in the lab.
