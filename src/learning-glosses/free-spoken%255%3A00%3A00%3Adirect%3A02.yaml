simpleMeaning: Open and straight in the way one acts or talks, with no hints and no dodging.
scope: Open and straight in acts or talk, with no hints and no dodging; blunt, frank, candid, forthright,
  outspoken, plainspoken and point-blank are other names for this sense, not rude talk and not talk that
  hides what it means.
examples:
- She was free-spoken and said just what she thought.
- His free-spoken way won him both friends and foes.
