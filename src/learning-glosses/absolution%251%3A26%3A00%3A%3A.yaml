simpleMeaning: the state of being formally forgiven by a priest in the church act where a person says
  sorry for sins and asks God for forgiveness
scope: This is the state of having been forgiven by a priest in this church act, not the act of forgiving
  itself and not forgiveness from a friend.
examples:
- After confession, she left the church in a state of absolution.
- His absolution meant the priest had formally forgiven his sins.
