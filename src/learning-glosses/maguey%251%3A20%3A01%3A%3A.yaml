simpleMeaning: A plant from the Philippines that gives a hard fibre used to make rough string
scope: A plant from the Philippines that gives a hard fibre used to make rough string, not the Mexican
  plant used for pulque and not a soft fibre plant; cantala is another name for this sense.
examples:
- Farmers grew maguey for its hard fibre.
- They twisted maguey fibre into rough string.
