simpleMeaning: the water held inside a chemical compound that has taken in water
scope: The water held inside a chemical compound that has taken in water; water of crystallization and
  water of hydration are other names for this sense, and it is not water merely mixed in from outside.
examples:
- The crystals lost their water of crystallisation when heated.
- The chemist weighed the water of crystallisation in the sample.
