simpleMeaning: a learned man at one of the great seats of learning in the Middle Ages, trained in the
  old church teaching of that time
scope: A learned man of the Middle Ages, also called a medieval schoolman; not a present-day teacher and
  not a pupil.
examples:
- The schoolman taught at a great seat of learning in the Middle Ages.
- Each schoolman knew the old church teaching by heart.
