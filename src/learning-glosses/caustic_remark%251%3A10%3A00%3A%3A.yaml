simpleMeaning: clever words used to mock or insult someone
scope: 'Also called irony, sarcasm, and satire: clever words used to mock or insult someone, not a plain
  insult and not a kind joke.'
examples:
- Her caustic remark about his cooking made the whole table fall silent.
- He answered the rude question with a caustic remark that stung.
