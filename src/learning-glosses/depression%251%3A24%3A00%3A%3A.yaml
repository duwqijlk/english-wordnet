simpleMeaning: how far below the line of the horizon something is, measured as an angle, especially a
  star, planet or other object in the sky
scope: This is a measured angle below the horizon, especially for objects in the sky, not a mental illness
  and not a low area of land.
examples:
- The star had a depression of ten degrees below the horizon.
- They measured the depression of the planet below the horizon at sunset.
