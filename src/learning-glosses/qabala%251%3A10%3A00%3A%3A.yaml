simpleMeaning: A secret matter about hidden things, like the old Jewish teaching on the hidden sense of
  holy books, long kept secret by those who know it
scope: A hidden matter of secret teaching; cabala, cabbala, cabbalah, kabala, kabbala, kabbalah and qabalah
  are other names for this sense. Not open teaching and not ordinary magic tricks.
examples:
- He would not speak of the qabala to people outside the group.
- The old book held the qabala that only a few were taught.
