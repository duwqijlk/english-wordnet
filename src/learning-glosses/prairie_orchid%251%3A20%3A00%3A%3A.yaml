simpleMeaning: Very sweet-smelling creamy or greenish white flowers grow in loose bunches on this orchid
  of the boggy or wet lands of the north central United States.
scope: 'Also called the prairie white-fringed orchis: an orchid of the boggy or wet lands of the north
  central United States, not an orchid of dry ground.'
examples:
- The prairie orchid grew in the wet land, its creamy white flowers sweet-smelling in the air.
- We found a prairie orchid in the boggy ground of the north central United States.
