simpleMeaning: easily affected by what other people think and feel, and by what is happening in their
  lives
scope: This is about being easily affected by other people's feelings and needs, not about secret information
  that must be kept from the public because it affects a country's safety.
examples:
- She is sensitive to other people's feelings and always notices when someone is upset.
- A good nurse is sensitive to the needs of the people she cares for.
