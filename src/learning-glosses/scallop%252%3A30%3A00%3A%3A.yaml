simpleMeaning: to make or cut an edge so that it has a line of small curves along it
scope: This is shaping or cutting an edge so it has a row of small curves; not just decorating an edge
  with curves to make it look better, not catching the sea animal with this name, and not making curves
  or dents in a surface.
examples:
- She scalloped the hem of the dress.
- He scalloped the edge of the paper card with small round cuts.
