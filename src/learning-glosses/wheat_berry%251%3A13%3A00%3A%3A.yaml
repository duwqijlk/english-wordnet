simpleMeaning: Seeds of the common grain plant, at times cooked whole or broken as breakfast food, most
  often ground into flour.
scope: Seeds of the common grain plant; wheat is another name for this sense, not the flour itself and
  not the straw of the plant.
examples:
- She cooked wheat berries whole for breakfast.
- Wheat berries are often ground into flour for bread.
