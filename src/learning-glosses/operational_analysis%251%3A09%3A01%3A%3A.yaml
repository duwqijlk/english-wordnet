simpleMeaning: 'In maths, sums with powers of a letter are the usual answer: problems, in particular equations
  about rates of change, are turned into such sums this way.'
scope: 'It is also called operational calculus: in maths, it is a way of turning problems about rates
  of change into sums with letters.'
examples:
- With operational analysis, he turned the equation about rates of change into a sum with letters.
- He used operational analysis to work out the equation.
