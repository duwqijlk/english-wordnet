simpleMeaning: Having corners that slant and are not square.
scope: Having corners that slant rather than meet squarely; not a shape with square corners, and not a
  round shape.
examples:
- The oblique-angled roof met the wall at a slant.
- The oblique-angled shelf had corners that were not square.
