senseId: 'lot%2:40:00::'
synsetId: 02299397-v
simpleMeaning: To give out something in small portions, such as money or remarks, to the people who receive
  it.
scope: This is the verb for handing something out in small shares, like 'dole out' or 'deal out'. Its
  nearest sibling is the verb meaning to divide land into lots, which is about splitting property rather
  than giving portions to people. The verb is rare in modern English and survives mainly in the form 'lot
  out' and in older or dialect writing.
examples:
- He lotted out a few coins to each of the beggars at the gate.
- The supplies were lotted out carefully so that every family got a share.
