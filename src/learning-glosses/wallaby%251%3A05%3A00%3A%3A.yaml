simpleMeaning: any of several kinds of small or middle-sized kangaroo, often with bright colours on its
  fur
scope: 'Also called brush kangaroo: a small or middle-sized kangaroo, not a large kangaroo.'
examples:
- A wallaby hopped across the grass with its young.
- We saw a wallaby with bright colours on its back.
