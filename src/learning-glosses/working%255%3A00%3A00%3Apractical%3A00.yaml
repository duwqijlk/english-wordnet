simpleMeaning: good enough to be used in everyday practice, with enough people, votes or strength to get
  the job done
scope: This describes something good enough to do a job, not a machine that is switched on and running.
examples:
- The two schools have a working agreement to share the pool.
- With a working majority, the government could pass the new law.
