senseId: 'batik%1:06:00::'
synsetId: 02812240-n
simpleMeaning: Cloth coloured with dye, made by covering parts with wax that is taken off after dyeing,
  so the dye does not reach them.
scope: Cloth dyed by a wax method, not cloth dyed in the ordinary way.
examples:
- She wore a dress of bright batik.
- The batik showed white flowers where the wax had kept the dye out.
