simpleMeaning: to untie and take a sail off the pole or rope that holds it on a ship
scope: This is about taking a sail off a ship, not about freeing the mind from stress or formality, and
  not about becoming calm and resting.
examples:
- The sailors unbend the sail when they reach port.
- He unbent the sail from the spar before putting it away.
