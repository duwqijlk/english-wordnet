simpleMeaning: A climbing bush of the south-eastern United States with big red-purple bell-shaped flowers
  and leathery bent-back outer flower parts.
scope: 'Also called leather flower, vase-vine or vase vine: a climbing bush of the south-eastern United
  States with bell-shaped flowers, unlike low ground plants and unlike tall trees.'
examples:
- The Clematis viorna in the garden had bell-shaped flowers of deep red-purple.
- We planted Clematis viorna against the fence, and its leathery outer flower parts curled back.
