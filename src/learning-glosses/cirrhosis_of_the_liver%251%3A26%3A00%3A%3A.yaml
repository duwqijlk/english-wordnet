simpleMeaning: a long-lasting illness that keeps a large organ in the belly from working as it should,
  most often caused by years of heavy drinking
scope: A long-lasting illness that keeps a large organ in the belly from working as it should, most often
  caused by years of heavy drinking; cirrhosis is another name for this sense, not a short illness of
  the same organ and not any other long-lasting illness.
examples:
- Years of heavy drinking led to cirrhosis of the liver.
- Cirrhosis of the liver made his belly swell with fluid.
