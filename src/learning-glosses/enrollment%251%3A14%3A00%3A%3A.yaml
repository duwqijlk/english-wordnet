simpleMeaning: the group of people, such as students, who sign up for something at the same time
scope: 'Also called registration: the group of people who sign up at the same time, not the act of signing
  up itself.'
examples:
- This year's enrollment is made up of students from ten different towns.
- Fall enrollment is mostly children who live near the school.
