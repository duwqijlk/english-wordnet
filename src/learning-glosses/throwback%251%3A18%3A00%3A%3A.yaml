senseId: 'throwback%1:18:00::'
synsetId: 09839265-n
simpleMeaning: a living thing that has the features of an earlier, simpler kind of the same living thing
scope: 'This is the living-thing sense: a plant or animal like an early, simpler form of its own kind,
  not a return to an old style or an old way of doing things.'
examples:
- The small fish is a throwback, with a body like kinds that lived long ago.
- Scientists called the plant a throwback because it looked like the earliest kinds of its group.
