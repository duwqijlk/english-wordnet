simpleMeaning: A cloudy white liquid made by mixing calcium hydroxide with water, used in tanning as a
  basic agent.
scope: A cloudy white liquid of calcium hydroxide in water, used in tanning as a basic agent, not a clear
  liquid of the same stuff and not paint.
examples:
- The tanner stirred the milk of lime before dipping the hides.
- Milk of lime gives the bath its milky look.
