simpleMeaning: A common finch of North America with a white patch on its throat and a black-and-white
  striped top of the head
scope: A common finch with a white throat patch; white-throated sparrow is another name for this sense,
  and it is not a plain brown sparrow or a warbler.
examples:
- A whitethroat sang from the hedge.
- The whitethroat has a clear white throat patch.
