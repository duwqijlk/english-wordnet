simpleMeaning: Usually a sign of the sickness alkaptonuria or of poisoning by phenol, this is a build-up
  of dark colour in the gristle and other tissue that joins body parts.
scope: A build-up of dark colour in the gristle and other tissue that joins body parts.
examples:
- Ochronosis left dark colour in the gristle of his joints.
- The doctor said the ochronosis was a sign of alkaptonuria.
