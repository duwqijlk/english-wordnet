simpleMeaning: A group of flowering plants with two first small leaves in the seed, which usually show
  when the seed starts to grow
scope: This is a group of flowering plants with two first small leaves in the seed; magnoliopsid family
  is another name for it, not a group of plants with one first leaf and not a single plant.
examples:
- The rose belongs to a dicot family.
- A dicot family can hold many kinds of flowering plants.
