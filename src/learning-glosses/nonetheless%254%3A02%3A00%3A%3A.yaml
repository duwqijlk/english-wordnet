simpleMeaning: In spite of anything that goes against it, usually just before you give way a bit.
scope: 'Also called still, however, yet, or nevertheless: said in spite of all that has gone against it,
  usually just before giving way a bit.'
examples:
- It was raining; nonetheless, we went for a walk.
- He was tired, but nonetheless he finished the job.
