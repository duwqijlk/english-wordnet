simpleMeaning: A brownish-yellow color that dissolves in water, made by boiling the black dust from burnt
  wood.
scope: A brownish-yellow color that dissolves in water, made from burnt wood dust; bister is another name
  for this sense, not a color that stays fixed in water and not a color made from earth.
examples:
- She painted the shadows in bistre.
- Bistre was once made from chimney soot.
