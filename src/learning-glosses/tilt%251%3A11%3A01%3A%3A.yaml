simpleMeaning: a fight between two knights (men who fought on horses in strong metal covering) who ride
  at each other with long spears that are not sharp at the end
scope: This is the old fight on horses, not a lean to one side and not the act of bending something so
  that it leans.
examples:
- Crowds came to watch the tilt between the two knights on horses.
- In the tilt, each knight tried to knock the other from his horse.
