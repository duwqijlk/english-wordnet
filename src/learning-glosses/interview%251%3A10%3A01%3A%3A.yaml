simpleMeaning: A conversation in which one person asks another questions to draw out information, often
  for a news report.
scope: This is the questioning event itself, not a job selection meeting and not a written questionnaire.
examples:
- The actor gave a long interview about his new film.
- Police conducted an interview with the witness.
