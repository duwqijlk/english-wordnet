simpleMeaning: Gristle turns to bone and the child stays very short in this state of the bones, passed
  down in families and starting before birth.
scope: 'It is also called achondroplasia, achondroplasty, and chondrodystrophy: the state of the bones
  in which gristle turns to bone before birth and the child stays very short.'
examples:
- Osteosclerosis congenita runs in families.
- In osteosclerosis congenita, gristle turns to bone.
