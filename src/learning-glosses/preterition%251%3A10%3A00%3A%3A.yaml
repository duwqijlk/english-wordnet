senseId: 'preterition%1:10:00::'
synsetId: 07119399-n
simpleMeaning: saying little on purpose to hint that much that matters is left unsaid
scope: Also called paraleipsis, paralepsis, and paralipsis, this is a way of hinting at much more by saying
  little on purpose, not just leaving things out by chance.
examples:
- By preterition, she said only that the plan had flaws and left the worst parts unsaid.
- His preterition hinted at a long list of faults without naming them.
