simpleMeaning: Liquid is put in, a drop at a time, by pouring it or by pushing it in with a needle
scope: Putting a liquid in a drop at a time, also called instillment or instilment; not the tool that
  does it and not a single pour all at once.
examples:
- The nurse used an instillation of drops to put the medicine in the patient's eye.
- The doctor ordered an instillation of the liquid into the wound, a drop at a time.
