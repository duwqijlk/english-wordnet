simpleMeaning: A gap in something that serves as a place to look through.
scope: A gap that looks or works like a viewing hole, as in trees or rock; not the glass pane itself and
  not a built opening for light, air, or serving people.
examples:
- She spotted the fox through a window in the hedge.
- The rock arch formed a natural window framing the sea.
