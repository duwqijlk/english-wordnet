simpleMeaning: joining two pieces of metal together by making them soft with heat and pressing on them
scope: The act of joining metal with heat and pressure, not joining with nails or glue and not cutting
  metal apart.
examples:
- Welding joined the two steel plates into one strong frame.
- The welding held the metal pipes together after they cooled.
