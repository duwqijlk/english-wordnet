simpleMeaning: In art, a late 16th-century style in Europe with space used in odd ways and figures stretched
  too long.
scope: A late 1500s European art style, not the balanced art of the early Renaissance and not a person's
  odd habit.
examples:
- Mannerism favors long, twisting figures over calm balance.
- The painting shows Mannerism in its stretched forms and crowded space.
