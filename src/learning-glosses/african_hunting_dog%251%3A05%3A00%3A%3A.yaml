simpleMeaning: A strong mammal of southern and eastern Africa, built like a hound, that chases prey in
  big packs; now rare where people have settled.
scope: A strong mammal like a dog of southern and eastern Africa, also called hyena dog, Cape hunting
  dog and Lycaon pictus; it chases prey in big packs, which sets it apart from mammals that hunt alone.
examples:
- The African hunting dog chases prey in big packs.
- African hunting dogs are now rare where people have settled.
