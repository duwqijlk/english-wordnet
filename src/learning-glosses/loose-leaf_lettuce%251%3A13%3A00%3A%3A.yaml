simpleMeaning: A salad plant whose curled parts stay apart and do not grow into one tight ball
scope: Also called leaf lettuce, this is a salad plant whose curled parts stay apart and do not form a
  tight head, not a cabbage and not a head of iceberg lettuce.
examples:
- She grew loose-leaf lettuce in the garden.
- The loose-leaf lettuce in the bowl had soft curled leaves.
