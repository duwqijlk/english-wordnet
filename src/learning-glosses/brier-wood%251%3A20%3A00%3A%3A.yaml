simpleMeaning: Made into pipes for smoking tobacco, this hard timber is cut from the thick root of a kind
  of heather
scope: Briarwood and brierwood are other names for this hard timber from the thick root of a kind of heather,
  made into pipes for smoking tobacco.
examples:
- His pipe was made of brier-wood.
- She smoked a brier-wood pipe.
