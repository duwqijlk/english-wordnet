simpleMeaning: A group of insects whose rear wings are reduced to small knobs and that usually flies on
  the front pair alone, with mouthparts made for sucking, lapping or piercing.
scope: Another name for the same fly group, also called dipteran, dipteron and dipterous insect; not a
  bee or dragonfly, which keep two pairs of wings.
examples:
- Flies and mosquitoes are two-winged insects.
- Two-winged insects have small knobs where their hind wings would be.
