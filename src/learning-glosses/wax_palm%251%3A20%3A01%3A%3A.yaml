simpleMeaning: Candles are made by mixing animal fat with a sticky stuff got from a tree of the Andes.
scope: This name covers the palm of the Andes alone, not the Brazilian fan palm with an edible root and
  leaf fibre, nor the South American palm whose wax is like carnauba wax.
examples:
- The wax palm of the Andes gives a sticky wax that is mixed with tallow for candles.
- Candles were made from the wax palm's sticky wax mixed with animal fat.
