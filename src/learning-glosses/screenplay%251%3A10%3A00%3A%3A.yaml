simpleMeaning: the written text for a film, with the words the people in the story say, and notes that
  describe those people and the places built for filming
scope: This is the written text for a film, not the film itself and not a written text for a play on stage.
examples:
- She wrote a screenplay about a family in a small town.
- The actors read the screenplay before filming began.
