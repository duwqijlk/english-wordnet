simpleMeaning: A trick in which you cheat at betting or get a person to pay for a thing with no worth.
scope: Also called con, sting, hustle, flimflam, bunco, bunco game, bunko, bunko game, con game, and confidence
  trick; a cheating trick to get money, not a magic trick and not a fair bet.
examples:
- He lost his savings in a confidence game.
- The confidence game began with a friendly bet.
