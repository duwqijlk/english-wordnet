simpleMeaning: One country of the British Commonwealth sends its own office to another country of the
  group, to speak for it there.
scope: This is an office that speaks for one British Commonwealth country inside another, not a meeting
  and not a court.
examples:
- The High Commission helps people from her country who live here.
- He works at the High Commission of his country.
