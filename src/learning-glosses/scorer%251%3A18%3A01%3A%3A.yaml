simpleMeaning: a person who works cutting trees and marks which trees are to be cut down
scope: A worker who marks trees to be cut down, not a player who gets points in a game and not an official
  who writes down the points.
examples:
- The scorer walked through the forest and marked each tree to be cut down with paint.
- As a scorer, he chose which trees the cutters would take down next.
