simpleMeaning: a popular Mediterranean houseplant grown for its silver-splotched dark green leaves and
  drooping flowers in white, pink or red, whose petals bend backward
scope: A Mediterranean plant kept indoors for its silver-marked leaves and nodding blooms with backward-curving
  petals; not an African violet or a lily.
examples:
- She kept a cyclamen on the kitchen windowsill.
- The cyclamen's pink flowers nodded above silver-marked leaves.
