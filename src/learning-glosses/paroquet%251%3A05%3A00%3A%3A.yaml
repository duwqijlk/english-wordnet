simpleMeaning: A small slim bird, one of many kinds, has a long tail
scope: 'Also called parakeet, paraquet, parrakeet, parroket, or parroquet: a small slim bird with a long
  tail, not a big bird of prey and not a songbird.'
examples:
- A paroquet perched on the branch, its long tail hanging down.
- The pet shop sold paroquets of many kinds.
