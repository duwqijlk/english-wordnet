simpleMeaning: to do with making, fitting and using man-made parts that replace a missing part of the
  body
scope: About making, fitting or using man-made body parts in general, not about one thing that itself
  serves as a man-made body part and not about a natural body part.
examples:
- She works in a prosthetic clinic that fits new legs for patients.
- He studies prosthetic design at university.
