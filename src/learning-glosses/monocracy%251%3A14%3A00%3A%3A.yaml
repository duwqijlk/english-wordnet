senseId: 'monocracy%1:14:00::'
synsetId: 08457622-n
simpleMeaning: Under this way of ruling, one person holds all the power, held back by no law, no written
  rules, and no one who speaks against them.
scope: It is also called tyranny, authoritarianism, dictatorship, totalitarianism, despotism, absolutism,
  one-man rule, and shogunate.
examples:
- Life under the monocracy meant no one could speak against the ruler.
- In a monocracy, the ruler's word stands above every law.
