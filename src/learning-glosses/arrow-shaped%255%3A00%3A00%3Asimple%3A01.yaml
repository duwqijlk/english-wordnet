simpleMeaning: said of a leaf that is wide at the base and narrows to a sharp point, with no wide parts
  at the base that stick out
scope: A leaf shape that is wide at the base and narrows to a point, not a leaf shaped like a heart and
  not a leaf that is just long and narrow.
examples:
- The arrow-shaped leaves of the plant make it easy to spot.
- The pond weed has arrow-shaped leaves with pointed tips.
