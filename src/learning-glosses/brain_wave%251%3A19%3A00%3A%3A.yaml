simpleMeaning: Parts of the outer layer of the thinking organ show quick ups and downs in power that a
  machine tracking the head's electric signs can read.
scope: Also called brainwave and cortical potential, these are quick ups and downs in power in the outer
  layer of the thinking organ, not the stillness of brain death.
examples:
- The brain wave showed quick ups and downs in power.
- Her brain wave was read by a machine that tracks the head's electric signs.
