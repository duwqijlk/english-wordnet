simpleMeaning: A Turkish viceroy, a man who ruled Egypt in place of a king between 1867 and 1914.
scope: This is one of the Turkish rulers who ruled Egypt between 1867 and 1914, not a ruler of Egypt from
  another time and not a Turkish ruler of another land.
examples:
- The Khedive ruled Egypt from Cairo.
- The Khedive's palace stood on the Nile.
