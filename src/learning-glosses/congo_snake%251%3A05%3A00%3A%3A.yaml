simpleMeaning: Two pairs of tiny feet mark this eel-like water salamander, which lives in the still, muddy
  waters of the southern United States.
scope: Amphiuma, blind eel and congo eel are other names for this eel-like water salamander with two pairs
  of tiny feet, which lives in still muddy waters in the south of the United States, not in running water.
examples:
- The congo snake slipped through the muddy water of the still pond.
- We watched a congo snake move through the still, muddy water.
