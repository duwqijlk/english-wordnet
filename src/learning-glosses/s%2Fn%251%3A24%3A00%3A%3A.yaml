simpleMeaning: A number that shows how strong a wanted signal is compared with the strength of the unwanted
  noise
scope: A comparison of a wanted signal with the unwanted noise that comes with it, also called signal-to-noise,
  signal-to-noise ratio, signal/noise and signal/noise ratio.
examples:
- The S/N of the recording was high.
- A low S/N makes the voice hard to hear.
