simpleMeaning: a gate or bar put across a road or bridge where drivers pay to pass, raised once the money
  has been paid
scope: A gate or bar across a road or bridge where drivers pay to pass, raised once the money is paid;
  also called tollgate. Not a barrier on a free road and not a gate that stays shut.
examples:
- The tollbar stayed down until the driver paid.
- The tollbar lifted as soon as we paid.
