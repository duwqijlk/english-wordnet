simpleMeaning: a thing you cannot touch, such as a state of things or a force, that helps bring about
  a result
scope: This is a thing that cannot be touched and helps bring about a result, not a thing you can touch
  and not the result itself.
examples:
- A cognitive factor in the children's scores was the quiet room where they worked.
- A cognitive factor in his choice was the advice of his friends.
