simpleMeaning: the act of throwing a liquid so that it lands on a surface
scope: 'Also called splash, splashing, spatter and splattering: this is liquid thrown onto a surface,
  not the loud noise sense of the same word.'
examples:
- The artist's spattering of paint across the paper made bright spots.
- A spattering of rain hit the window and ran down the glass.
