simpleMeaning: A thin piece of dead skin that peels away from the body's surface.
scope: A flake of dead skin that rubs off the body, not the hard plate covering a fish or snake and not
  a small leaf protecting a plant bud.
examples:
- After the sunburn, the skin on his shoulders came off in scales.
- The cream helps remove the scales caused by dry skin.
