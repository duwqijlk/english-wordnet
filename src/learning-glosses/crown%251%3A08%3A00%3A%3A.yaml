simpleMeaning: The part of a tooth that you can see above the gum. It is covered by enamel, the hard outer
  coat of the tooth
scope: This is the natural top part of a tooth that you can see above the gum. It is not the man-made
  cover a dentist puts on a bad tooth.
examples:
- Only the crown of the tooth shows above the gum.
- The hard crown protects the soft inside of the tooth.
