simpleMeaning: A computer once kept its facts in rows of small rings that hold a pull, now replaced by
  newer chip stores.
scope: Also called core memory, this old computer store was made of small rings that hold a pull and is
  now replaced by newer chip stores.
examples:
- The computer kept its facts in magnetic core memory.
- Magnetic core memory gave way to chip stores.
