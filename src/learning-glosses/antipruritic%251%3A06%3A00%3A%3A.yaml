simpleMeaning: a substance that takes away itching or stops itching before it starts
scope: A substance that eases or stops itching, not a drug that heals the skin and not a painkiller.
examples:
- She rubbed antipruritic cream on the rash to stop the itch.
- The pharmacist gave him an antipruritic for the insect bites.
