simpleMeaning: This sea animal, one of the spiny kind, has a long bendy body like a sausage, mouth feelers
  and small tube feet, and lives free in mud, feeding there.
scope: Also called sea cucumber, this is a soft sea animal with a sausage-like body, not a worm and not
  a shellfish.
examples:
- The holothurian lay half-buried in the mud.
- A holothurian uses its tube feet to crawl along the sea floor.
