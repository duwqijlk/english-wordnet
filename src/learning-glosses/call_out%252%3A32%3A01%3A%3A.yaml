simpleMeaning: to say words aloud, often from surprise, great fear, or joy
scope: 'Also called cry, cry out, exclaim, outcry and shout: to say words aloud, often from surprise,
  great fear, or joy, not to ask a person to come and not to speak against someone in public.'
examples:
- '''Help!'' she called out when she saw the fire.'
- The crowd called out in joy when the team scored.
