simpleMeaning: In chemistry, a kind of atom that gives off rays, put into a mix so the steps of a change
  can be followed
scope: In chemistry, the atom put in a mix to follow a change, not the act of marking atoms and not a
  tag on a thing.
examples:
- The label let the team follow the reaction step by step.
- They added a label to the mix to trace how the change worked.
