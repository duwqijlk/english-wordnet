simpleMeaning: letting people off lightly when you judge them, instead of coming down hard on what they
  did
scope: A readiness to go easy when judging others, not a gentle manner, not a soft look, and not mild
  weather.
examples:
- The softness of the new judge surprised lawyers used to harsh sentences.
- Her softness in judging the young clerk earned her a kind name.
