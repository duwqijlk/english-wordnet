senseId: 'transient_ischemic_attack%1:26:00::'
synsetId: 14190071-n
simpleMeaning: a short time when the brain does not get enough blood, and the signs of it change with
  where the flow is blocked
scope: This is a short time when the brain does not get enough blood; not a stroke and not a long illness
  of the brain.
examples:
- She had a transient ischemic attack and her arm went weak for a few minutes.
- After the transient ischemic attack, the doctor checked where the blood flow was blocked.
