senseId: 'fictionalization%1:04:00::'
synsetId: 00932855-n
simpleMeaning: the act of writing something in the form of a made-up story
scope: The act of writing something in the form of a made-up story; fictionalisation is another name for
  this sense; not the made-up story itself, and not a plain true account.
examples:
- The fictionalization of the story made it read like a novel.
- Fictionalization gave the plain notes the shape of a made-up tale.
