simpleMeaning: In physics, the idea that matter in its air-like form is made of tiny bits moving about
  in no set pattern.
scope: This is the idea that matter in its air-like form is made of tiny bits moving about in no set pattern;
  kinetic theory is another name for it, not a rule about how gases act when heated.
examples:
- Kinetic theory of gases says gases are made of tiny bits in random motion.
- Under the kinetic theory of gases, particles move about with no set pattern.
