simpleMeaning: an artist who belongs to a group that makes art with strange, dream-like pictures and ideas
scope: This is a person who makes art and belongs to this group. It is not the name of the art itself
  or of the group itself.
examples:
- As a surrealist, she painted dream-like scenes with objects floating in the air.
- The museum showed new works by a young surrealist from France.
