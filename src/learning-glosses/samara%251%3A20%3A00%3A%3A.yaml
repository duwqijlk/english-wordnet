simpleMeaning: One seed sits inside a hard case that does not split open, with wings that carry it, as
  in the ash, elm, or maple.
scope: This winged fruit is also called a key or a key fruit; most often it holds one seed inside a hard
  case that does not split open.
examples:
- The samara from the maple fell to the ground.
- The samara of the ash tree has one seed inside.
