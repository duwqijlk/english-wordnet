simpleMeaning: a list made on one day that shows what a bank, firm, or other body owns and what it owes
  to others
scope: A list of what a body owns and owes on one day, not a list of its income and spending over a year
  and not a gap in trade.
examples:
- The balance sheet showed the firm owned more than it owed.
- Investors read the balance sheet before they put money in.
