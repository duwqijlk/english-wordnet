simpleMeaning: In biology, a category in the classification of living things that ranks above a genus
  and contains one or more genera.
scope: This is the biological classification level, not a household, the parents and children in a home,
  people descended from a common ancestor, a collection of things with shared features, or a group of
  criminals.
examples:
- Biologists place wolves and coyotes in the same family.
- The rose family includes apples, pears, and many garden flowers.
