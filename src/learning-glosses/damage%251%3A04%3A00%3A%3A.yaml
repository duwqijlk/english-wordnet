senseId: 'damage%1:04:00::'
synsetId: 00403900-n
simpleMeaning: The act of causing harm to something or someone.
scope: This is the act of harming something, not the harm that results (as in 'damage from the storm')
  nor the informal sense meaning the cost ('What's the damage?'). In modern English the act sense is rare
  and mostly legal or formal, as in 'criminal damage' or 'malicious damage'.
examples:
- He was charged with criminal damage after the protest.
- The men were convicted of malicious damage to the village hall.
