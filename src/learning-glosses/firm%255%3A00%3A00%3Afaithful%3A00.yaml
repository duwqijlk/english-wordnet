simpleMeaning: loyal in support of a friend, a promise, or a cause
scope: This describes loyalty to a person, promise, or cause, not determination to do something, and not
  a voice or body free from trembling.
examples:
- She has been a firm ally of the charity for twenty years.
- They remained firm in their support for the cause.
