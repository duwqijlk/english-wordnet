simpleMeaning: Steered on its own to its mark, this underwater weapon can follow, for example, the sound
  of a ship's engines
scope: An underwater weapon that steers itself to its mark, such as by following a ship's engine sound;
  not an unguided weapon and not a mine.
examples:
- The homing torpedo locked onto the sound of the engines.
- A homing torpedo can follow its target through the water.
