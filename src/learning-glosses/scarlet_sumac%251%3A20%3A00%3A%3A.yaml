simpleMeaning: Red berries follow green flowers in loose clusters on a common shrub of eastern North America
  that does not poison, its waxy leaves made of many small leaflets.
scope: Also called smooth sumac and vinegar tree, this is the common shrub of eastern North America with
  green flowers and red berries, not a poisonous shrub.
examples:
- The scarlet sumac grew in eastern North America.
- The scarlet sumac bore red berries after its green flowers.
