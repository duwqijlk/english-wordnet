simpleMeaning: Used to make drinks fizz, to raise cakes, and to calm a sour stomach, this white chemical
  melts in water.
scope: Also called saleratus, baking soda, sodium bicarbonate and sodium hydrogen carbonate, this white
  chemical melts in water and is used to make drinks fizz, to raise cakes, and to calm a sour stomach.
examples:
- She stirred a spoon of bicarbonate of soda into the cake mix.
- He took bicarbonate of soda to calm his sour stomach.
