simpleMeaning: This side tube leaves the one that feeds the lower gut and runs up to the rising part of
  the large gut.
scope: Arteria ascendens is another name for this side blood tube of the rising large gut.
examples:
- The ascending artery branches off toward the rising gut.
- The ascending artery runs up beside the rising gut.
