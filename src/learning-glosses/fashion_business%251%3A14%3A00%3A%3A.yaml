simpleMeaning: The trade that makes clothes in the latest style and sells them
scope: 'Also called the fashion industry, the apparel industry, the garment industry and the rag trade:
  the trade that makes and sells clothes in the latest style, not one shop and not the clothes themselves.'
examples:
- Her fashion business grew from one small shop into a chain of stores.
- He left his job to start a fashion business of his own.
