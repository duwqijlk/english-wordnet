simpleMeaning: One of the thin threads that join to make the feeding body of a fungus.
scope: One thin thread in the feeding body of a fungus, not the whole feeding body and not the part that
  makes spores.
examples:
- A single hypha is too thin to see without a lens.
- The hypha grew out from the main body of the fungus.
