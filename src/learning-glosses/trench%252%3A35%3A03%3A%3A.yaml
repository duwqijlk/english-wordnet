simpleMeaning: to cut a long, narrow, deep hole in land so that water can run away from it
scope: To cut a long, narrow hole in land so water can run away. It is not just digging such a hole for
  any other reason, and not the low area at the bottom of the ocean.
examples:
- The farmer trenched the wet fields so the water could run off.
- They trenched the land to drain it after the heavy rain.
