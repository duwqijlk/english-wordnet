simpleMeaning: Its fruit is like the spice it is named for, but with a strong taste of turpentine, on
  a tree from California that keeps its leaves all year.
scope: This tree from California keeps its leaves all year, and its fruit is like the spice it is named
  for, not a tree that loses its leaves in winter.
examples:
- The nutmeg-yew kept its leaves all year.
- The fruit of the nutmeg-yew had a strong taste of turpentine.
