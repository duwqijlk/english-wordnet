simpleMeaning: In dry ground of loose soil grows this plant, its scented white flowers shaped like trumpets
  and held in bunches.
scope: Also called snowball, this is the plant of dry sandy ground whose white flowers smell sweet and
  open like trumpets.
examples:
- The sweet sand verbena smelled sweet in the dry air.
- A sweet sand verbena opened its white trumpet flowers.
