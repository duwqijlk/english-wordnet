senseId: 'normalcy%1:26:00::'
synsetId: 14524492-n
simpleMeaning: the state of being within set limits that mark how a person or thing should work in a usual
  way
scope: 'Also called normality: this is the state of working within set limits in a usual way. It is not
  the quality of being what people expect because something is usual, regular or common.'
examples:
- After treatment, her heart returned to normalcy and beat within safe limits.
- Engineers measured the system to confirm its normalcy after the repair.
