simpleMeaning: About a size with no direction, such as mass or speed, that is fully given by its size
  alone.
scope: A size with no direction, fully given by its size alone; not a vector, a size with direction, and
  not a plain counting number.
examples:
- Mass is a scalar quantity.
- Speed is scalar, but velocity is not.
