simpleMeaning: a timekeeper that marks time by the escape of water
scope: A timekeeper that marks time by the escape of water; water glass is another name for this sense,
  and it is not a sand timekeeper and not one that uses the sun.
examples:
- The ancient water clock measured time by the escape of water.
- A water clock in the museum still drips steadily.
