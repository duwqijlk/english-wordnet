simpleMeaning: a drug that makes the body pass more water, used to keep high blood pressure down and to
  ease swelling, and so to help stop heart attacks
scope: A drug that makes the body pass more water, used to keep high blood pressure down and ease swelling;
  not a drug that slows the heart and not a painkiller.
examples:
- Her doctor gave her chlorthalidone to lower her blood pressure.
- Chlorthalidone helps the body pass extra water.
