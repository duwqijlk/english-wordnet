simpleMeaning: the hard cover, made mostly of a chalk-like stone, that guards a soft sea animal
scope: The hard cover of a soft sea animal, not the hard cover of a crab or turtle and not the hard outer
  layer of a nut.
examples:
- She picked up a shell on the beach.
- The shell of the snail was smooth and round.
