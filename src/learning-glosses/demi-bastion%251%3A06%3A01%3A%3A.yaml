senseId: 'demi-bastion%1:06:01::'
synsetId: 92459760-n
simpleMeaning: In military building, a strong wall built to stick out from a fort, made with one front
  side and one side wall
scope: This is a wall of a fort made with one front side and one side wall; half-bastion is another name
  for this sense, not a full wall with two front sides and two side walls and not a tower.
examples:
- The demi-bastion guarded one corner of the old fort.
- Soldiers fired from behind the demi-bastion as the enemy came near.
