simpleMeaning: a pleated skirt of checked cloth that comes to the knee, worn by men as part of the old
  dress of the Scottish Highlands
scope: A pleated skirt of checked cloth that comes to the knee, worn by men as part of the old dress of
  the Scottish Highlands; not a skirt worn by women and not a long coat.
examples:
- He wore a kilt to the wedding in Scotland.
- The dancer's kilt swung as he turned.
