simpleMeaning: A holly of eastern North America that keeps its leaves all year, with long hard shiny leaves
  and small black fruit.
scope: A holly of eastern North America that keeps its leaves all year, also called gall-berry, gallberry,
  and inkberry; not a holly that drops its leaves and not a bush with red fruit.
examples:
- The evergreen winterberry held its black fruit through the cold months.
- Birds ate the small black fruit of the evergreen winterberry.
