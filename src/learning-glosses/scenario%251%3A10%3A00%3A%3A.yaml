simpleMeaning: a short summary that gives the main points of a play, or, in a wider use, of another piece
  of writing
scope: This is a short plan for a play or other writing, not a set of events that might happen in the
  future.
examples:
- The writer first wrote a scenario for the new play.
- The scenario set out each scene of the story in a few lines.
