simpleMeaning: A contest made up of a run of games played one after another between the same two sides
scope: A run of games between the same two sides, not a shoe cover and not the stretchy stuff itself.
examples:
- He won three out of five games to take the rubber.
- The rubber went to the home side after five close games.
