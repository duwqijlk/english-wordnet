simpleMeaning: The angle eastward along the celestial equator from the spring equinox to the hour circle
  of an object, usually in hours, minutes, and seconds, used with declination for its place.
scope: An angle in the sky, not declination and not a place on earth; also called celestial longitude
  and right ascension.
examples:
- The star's RA tells where it sits in the sky.
- RA is given in hours, minutes, and seconds.
