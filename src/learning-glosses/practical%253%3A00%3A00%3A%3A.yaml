simpleMeaning: about real doing and use, not just ideas
scope: This is the wide sense about doing things in real life; it is not only about a thing having a use,
  and not only about being led by experience.
examples:
- He has a practical knowledge of Japanese from living and working there.
- Woodwork is a practical art that you learn by making things.
