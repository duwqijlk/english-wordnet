synsetId: 03101244-n
simpleMeaning: a thing or a tool made to stop a pregnancy from starting
scope: 'Also called preventive: a thing or a tool used to stop a pregnancy from starting, not a medicine
  that stops or slows illness, and not a thing that gets in the way.'
examples:
- She used a preventative so she would not become pregnant.
- The doctor told them about a preventative they could use before having sex.
