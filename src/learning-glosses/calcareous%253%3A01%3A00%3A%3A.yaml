simpleMeaning: Said of a thing that holds calcium carbonate, calcite, or chalk, or is made of them, or
  looks like them.
scope: Also called chalky, this word is said of a thing made of, holding, or looking like calcium carbonate,
  calcite, or chalk.
examples:
- This calcareous stone looks like chalk.
- This calcareous rock holds calcium carbonate.
