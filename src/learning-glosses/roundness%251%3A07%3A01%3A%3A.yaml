synsetId: 05008078-n
simpleMeaning: the quality of a person's body that is full and curved in shape
scope: This is the full, curved shape of a person's body, not the curved shape of a line or surface, and
  not a quality of numbers.
examples:
- The painter liked the soft roundness of her arms and shoulders.
- His roundness came from years of good food and little exercise.
