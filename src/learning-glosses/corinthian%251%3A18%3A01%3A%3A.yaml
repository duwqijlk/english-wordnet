simpleMeaning: A man who spends his life chasing fun and good times
scope: 'Also called playboy and man-about-town: a man who lives for fun and good times, not a man who
  lives in Corinth and not a man known for hard work.'
examples:
- He was a Corinthian, always first at the races and the parties.
- The young Corinthian spent his money on horses and wine.
