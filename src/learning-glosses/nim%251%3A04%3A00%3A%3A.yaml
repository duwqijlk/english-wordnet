simpleMeaning: A game of matchsticks arranged in rows; players take turns removing one or more, aiming
  in some versions to take the last stick and in others to avoid taking it.
scope: The matchstick game; not the nim tree (neem) and not the old verb meaning to steal.
examples:
- We played nim with matchsticks arranged in rows.
- In this version of nim, you lose if you take the last matchstick.
