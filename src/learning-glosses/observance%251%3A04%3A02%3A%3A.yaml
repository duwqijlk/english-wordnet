simpleMeaning: the act of following a law, a custom, or a usual way of doing things
scope: 'Also called honoring or honouring: following a law or custom, not just looking at something with
  care, which is another sense of this word.'
examples:
- Strict observance of the safety rules kept everyone safe.
- Observance of the old custom is still important in the village.
