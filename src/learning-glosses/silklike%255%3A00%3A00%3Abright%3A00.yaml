simpleMeaning: A surface that catches the light and feels soft to the touch, as the cloth it is named
  for.
scope: People also call it slick, silken, sleek, silky, and satiny, and it is the word for a surface that
  catches the light and feels soft.
examples:
- The silklike cloth felt soft to the touch.
- A silklike cloth caught the light.
