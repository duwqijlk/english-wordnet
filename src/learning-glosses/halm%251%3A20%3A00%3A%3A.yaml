simpleMeaning: Taken together for thatch and bedding, the stems of beans, peas, potatoes and grasses are
  used to cover roofs.
scope: Also called haulm, it is the stems of beans, peas, potatoes and grasses, taken together for thatch
  and bedding.
examples:
- The farmer stacked the halm for thatching.
- Halm was spread on the floor as bedding.
