simpleMeaning: Because the holy books neither forbid it nor call for it, each person may judge this church
  rite or act of worship for himself.
scope: This is a church rite or act of worship each person may judge for himself; it is not a church law,
  and not the Stoic sense of a matter with no moral weight.
examples:
- They held the rite to be an adiaphoron, left for each person to judge for himself.
- An adiaphoron is neither forbidden nor called for by the holy books.
