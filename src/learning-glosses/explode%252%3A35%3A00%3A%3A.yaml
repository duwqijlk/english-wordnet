senseId: 'explode%2:35:00::'
synsetId: 01568576-v
simpleMeaning: to break and ruin something by making it burst with great power
scope: This sense is making something else burst in order to ruin it. It is not a thing bursting on its
  own, and not proving an idea false.
examples:
- The soldiers exploded the bridge so the enemy could not cross it.
- Workers exploded the old building with charges set inside it.
