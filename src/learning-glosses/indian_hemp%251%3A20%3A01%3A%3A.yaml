simpleMeaning: A Canadian dogbane that gives a tough fibre used for rope by Native Americans, and used
  in folk medicine for pain or inflammation in the joints
scope: A Canadian dogbane used for rope and folk medicine; rheumatism weed and Apocynum cannabinum are
  other names for this sense, not the plant that gives bhang and hashish and not the fibre plant of the
  East Indies.
examples:
- Indian hemp gave Native Americans a tough fibre for rope.
- Herbalists once used Indian hemp for aching joints.
