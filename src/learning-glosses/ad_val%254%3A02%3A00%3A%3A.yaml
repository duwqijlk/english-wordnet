simpleMeaning: a tax rate that rises or falls with the guessed worth of the goods taxed
scope: This is a tax rate tied to the worth of the goods, also called ad valorem; not a fixed sum per
  item and not a tax on income.
examples:
- The goods were taxed ad val, so the charge rose with their worth.
- Ad val duties change when the value of the goods changes.
