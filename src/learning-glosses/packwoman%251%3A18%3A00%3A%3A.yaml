simpleMeaning: In the street or at a carnival, a female person goes from place to place selling the goods
  she carries
scope: A female person who goes from place to place to sell goods, not a shopkeeper who stays in one place
  and not a person who buys goods.
examples:
- The packwoman went from house to house with her basket of ribbons.
- At the carnival, the packwoman sold small toys to the children.
