simpleMeaning: a flower plant of the north-east of the United States with deep pink flowers whose lower
  petal spreads wide at the end, sometimes put in the group called Pogonia
scope: A north-eastern flower plant with deep pink blooms, not other pink orchids; also called spreading
  pogonia.
examples:
- The funnel-crest rosebud orchid grew in a wet meadow in Maine.
- We found a funnel-crest rosebud orchid with deep pink flowers by the path.
