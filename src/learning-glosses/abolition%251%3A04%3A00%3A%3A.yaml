simpleMeaning: The act of ending a system, a practice, or an institution (a set way of doing things that
  has lasted a long time), especially ending slavery
scope: This is the ending of a system, a practice, or an institution, especially slavery; not the starting
  of one and not a small change to one.
examples:
- The abolition of slavery changed the country forever.
- Many people worked for the abolition of the death penalty.
