simpleMeaning: A paper or receipt that shows a person is free from what was owed
scope: A paper or receipt that shows a person is free from what was owed, not a bill asking for payment
  and not a promise to pay.
examples:
- He kept the quittance as proof that the debt was paid.
- The quittance showed she owed nothing more on the loan.
