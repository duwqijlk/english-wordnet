simpleMeaning: with a look or words that show you think someone is not worth respect, saying bad things
  about them in a mocking way
scope: 'Also called sneeringly and superciliously: with a look or words that show you think someone is
  not worth respect, in a mocking way. Not kind, and not plain and friendly.'
examples:
- '"Nice work," he said snidely, looking at the broken plate.'
- She smiled snidely and asked if he had really passed the test.
