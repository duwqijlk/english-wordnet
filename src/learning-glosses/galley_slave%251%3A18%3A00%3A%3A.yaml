simpleMeaning: a person owned by another, forced by a court to row a ship with oars
scope: A person owned by another and forced to row a ship, not a free sailor and not a prisoner kept on
  land.
examples:
- The galley slave pulled at his oar all day long.
- The galley slave strained at the oar as the ship moved out of the harbour.
