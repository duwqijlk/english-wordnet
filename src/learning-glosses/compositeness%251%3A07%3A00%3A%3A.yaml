simpleMeaning: the fact that a whole number can be split by whole numbers other than one and itself
scope: Whether a whole number can be split by numbers other than one and itself, not whether it is a prime
  number and not how big it is.
examples:
- Nine shows compositeness because it can be split by three.
- The compositeness of twelve is clear from its many parts.
