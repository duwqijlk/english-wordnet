simpleMeaning: A kind of sorghum that grows in the dry lands of Asia and North Africa.
scope: Sorghums of dry lands in Asia and North Africa, also called durra, doura, dourah, Egyptian corn
  and Guinea corn; not the forage grass of dry lands in western North America and not a grain of wet lands.
examples:
- Indian millet grows well in dry fields.
- Farmers sow Indian millet where rain is scarce.
