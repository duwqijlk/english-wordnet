simpleMeaning: In maths, the number got by dividing the longest side of a right-angled triangle by the
  side across from an angle.
scope: In maths, this is the number got by dividing the longest side of a right-angled triangle by the
  side across from an angle; cosecant is another name for this sense, not the number got by dividing the
  side next to an angle and not the angle itself.
examples:
- The cosec of the angle is two.
- We worked out the cosec from the two sides.
