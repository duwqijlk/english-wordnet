simpleMeaning: In written music, one short part ends and the next starts at this straight mark, which
  stands up just before the strong beat.
scope: Written music uses this straight mark, standing just before the strong beat, to mark where one
  short part ends and the next starts.
examples:
- The bar line fell just before the first strong beat.
- The singer waited for the bar line before starting the next part.
