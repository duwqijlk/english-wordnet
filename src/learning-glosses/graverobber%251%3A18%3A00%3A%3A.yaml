simpleMeaning: someone who takes dead bodies from places where they are buried and sells them so they
  can be cut open and studied
scope: 'Also called ghoul: this person takes dead bodies and sells them for study, not someone who steals
  valuable things from graves.'
examples:
- The graverobber sold the body he had dug up to a doctor for study.
- The graverobber dug up a body at night and sold it so it could be cut open and studied.
