simpleMeaning: a pill, sold as Lipitor, that brings down fats called triglycerides in the blood and can
  be given in large doses to cut the bad kind of cholesterol
scope: A pill that lowers blood fats, not a pill for high blood pressure and not a drug rubbed on the
  skin.
examples:
- Her doctor gave her atorvastatin to bring down her cholesterol.
- Atorvastatin, sold as Lipitor, lowers the fats in her blood.
