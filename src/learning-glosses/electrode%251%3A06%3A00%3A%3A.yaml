simpleMeaning: a piece of material that carries electricity and is used to make a link with part of a
  circuit (the path electricity moves along)
scope: A part that carries electricity into or out of a circuit, not the whole circuit itself and not
  a machine that makes electricity.
examples:
- The nurse put an electrode on his chest to check his heart.
- One electrode was joined to each end of the battery.
