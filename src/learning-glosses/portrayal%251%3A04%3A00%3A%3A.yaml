simpleMeaning: the act of showing something by drawing or painting it, or in another like way
scope: 'Also called depiction and delineation: showing something in a drawing or painting, not acting
  a part on stage and not just the finished picture on its own.'
examples:
- Her portrayal of the old house, painted in soft colours, took a full week.
- He made a quick portrayal of the dog by drawing it in pencil.
