senseId: 'gabled%3:00:00::'
synsetId: 01224173-a
simpleMeaning: of a roof, with one slope on each side of the top line, held up at the end by an upright,
  triangle-shaped part of the end wall
scope: This describes the shape of a roof only, not a whole house and not a roof with many slopes on each
  side.
examples:
- They built a small house with a gabled roof.
- The old barn has a steep gabled roof.
