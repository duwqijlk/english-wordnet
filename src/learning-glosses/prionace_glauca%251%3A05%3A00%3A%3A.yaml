simpleMeaning: A slim shark found in open seas all over the world, blue above and fading to a white belly,
  most dangerous when ships are wrecked at sea.
scope: Also called blue shark and great blue shark; a slim open-sea shark, most dangerous around ships
  wrecked at sea.
examples:
- We saw a Prionace glauca circling the boat after the storm.
- Prionace glauca is the blue shark that follows ships in the open sea.
