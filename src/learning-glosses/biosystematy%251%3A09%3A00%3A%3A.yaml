simpleMeaning: To tell how living things are related, look at facts about cells and body chemistry, above
  all in the light of how they came to be over time.
scope: Also called biosystematics, this uses facts to work out how living things are related through their
  past.
examples:
- Biosystematy draws on facts about cells to judge how living things are related.
- Through biosystematy, body chemistry shows how two kinds came to be related over time.
