simpleMeaning: In psychology, the rule that parts of what you sense that are alike tend to be seen as
  one group, when all else is the same
scope: In psychology, the rule that like parts are seen as one group; not the simple quality of being
  alike and not a law of nature.
examples:
- By similarity, the dots of one colour look like a single shape.
- Similarity makes the red squares on the page look like one block.
