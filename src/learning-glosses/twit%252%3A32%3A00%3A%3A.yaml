simpleMeaning: to keep bothering a person by saying unkind things that find fault with them again and
  again
scope: 'Also called ride, rag, tease, rally, cod, bait, taunt, tantalize, razz and tantalise: to keep
  picking on a person with unkind words, not the noun sense of one such act.'
examples:
- The older boys twitted him about his failure all week.
- She twitted her brother about his bad singing every day.
