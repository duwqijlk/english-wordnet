simpleMeaning: A band of changed heart muscle that carries the heart's signal from the node between the
  upper and lower chambers to the lower chambers, making them squeeze.
scope: 'Also called the atrioventricular bundle, the atrioventricular trunk, and truncus atrioventricularis:
  a band of changed heart muscle that carries the heart''s signal to the lower chambers, not the muscle
  of the upper chambers and not a nerve.'
examples:
- The bundle of His carries the heart's signal to the lower chambers.
- If the bundle of His is hurt, the lower chambers may beat out of time.
