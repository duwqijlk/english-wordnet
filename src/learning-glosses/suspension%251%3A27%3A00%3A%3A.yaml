simpleMeaning: a mix of tiny bits held up in a fluid (a liquid or gas), kept afloat by the push of the
  fluid
scope: Tiny bits floating in a fluid, not the act of hanging something up and not a ban from a job or
  privilege.
examples:
- Shake the suspension well before you take the medicine.
- Mud in water forms a suspension that slowly settles.
