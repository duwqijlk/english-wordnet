simpleMeaning: A room, or a place of business, where strong drinks are poured out over a counter
scope: This is a room or place where strong drinks are served over a counter, also called bar, not a whole
  drinking house with rooms open to all and not a closed car.
examples:
- They met at the saloon after work.
- The saloon stayed open late into the night.
