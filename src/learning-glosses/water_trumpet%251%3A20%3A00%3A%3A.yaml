simpleMeaning: In warm Asia, in fresh or a little salty liquid, lives a plant of the group Cryptocoryne
  that keeps its leaves all year.
scope: Also called cryptocoryne, this is a plant of the group Cryptocoryne from warm Asia, living year
  after year in fresh or a little salty liquid.
examples:
- In warm Asia, water trumpet grows in fresh liquid.
- A water trumpet keeps its leaves all year in fresh liquid.
