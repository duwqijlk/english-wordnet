simpleMeaning: A common North American spring-flowering woodland herb with a purple-and-green hood arched
  over an upright club-shaped spike and bright red berries.
scope: This sense is the American woodland herb with a striped hood, also called jack-in-the-pulpit; it
  is not the trillium, a woodland plant with three leaves and one flower.
examples:
- The wake-robin blooms in damp American woods each spring.
- We spotted a wake-robin under the maples, its green and purple hood lifted.
