simpleMeaning: A low creeping shrub of eastern North America, with white bell-shaped flowers, spicy red
  fruit like berries, and shiny sweet-smelling leaves that give wintergreen oil.
scope: A low creeping shrub with spicy red fruit, also called checkerberry, creeping wintergreen, ground-berry,
  groundberry, mountain tea, teaberry, and wintergreen; not a tall shrub and not a true berry bush.
examples:
- Gaultheria procumbens carpeted the shady bank.
- We crushed Gaultheria procumbens leaves to smell the wintergreen.
