simpleMeaning: In Marxist thought, belonging to the class that owns property and uses workers for its
  own gain
scope: In Marxist thought, the owning class that gains from workers' labour; not the noun sense of a business
  owner, and not simply being rich.
examples:
- Critics called the new laws bourgeois and unfair to workers.
- The writer attacked bourgeois values in his essays.
