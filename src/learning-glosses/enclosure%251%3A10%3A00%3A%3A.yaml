simpleMeaning: a paper sent inside an envelope with a letter, most often one that backs up what the letter
  says
scope: This is a paper sent in an envelope with a letter; it is not a fenced-off area, not a closed-in
  space, and not the act of enclosing.
examples:
- I found the enclosure with the letter.
- Please sign the enclosure and send it back.
