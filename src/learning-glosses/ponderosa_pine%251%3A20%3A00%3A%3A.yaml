simpleMeaning: Common throughout western North America, this tall timber pine has dark green needles in
  bundles of two to five and, when mature, thick, dark brown plated bark.
scope: Another name for the tall western pine also called bull pine, ponderosa or western yellow pine,
  not an eastern pine such as the white pine.
examples:
- Ponderosa pine is an important source of softwood lumber.
- The ponderosa pine has thick, plated bark and long dark green needles.
