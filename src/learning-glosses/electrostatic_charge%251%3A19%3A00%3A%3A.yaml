senseId: 'electrostatic_charge%1:19:00::'
synsetId: 11455472-n
simpleMeaning: power held still on the outside of a thing that does not let power pass through it, which
  sets up a field of power next to it
scope: Power held still on the outside of a thing that does not let power pass through it, not power moving
  through a wire and not power held inside a thing.
examples:
- An electrostatic charge built up on the surface of the plastic rod.
- The electrostatic charge on the balloon made it stick to the wall.
