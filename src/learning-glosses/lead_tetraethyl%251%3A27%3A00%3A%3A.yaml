simpleMeaning: A clear, oily liquid that can poison, mixed into gasoline so an engine runs without knocking
scope: A poisonous liquid mixed into fuel to stop knocking; not the fuel itself, and not a cleaner for
  the engine.
examples:
- Lead tetraethyl was once added to gasoline to stop engines knocking.
- The factory stopped using lead tetraethyl when safer fuels appeared.
