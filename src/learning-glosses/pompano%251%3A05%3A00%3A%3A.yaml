simpleMeaning: one of several kinds of food fish with a deep body from the west Atlantic and the Gulf
  of Mexico
scope: One of several kinds of food fish with a deep body from the west Atlantic and the Gulf of Mexico,
  not a food fish from other seas.
examples:
- We caught a pompano off the coast of Florida.
- Pompano from the Gulf of Mexico are sold fresh at the market.
