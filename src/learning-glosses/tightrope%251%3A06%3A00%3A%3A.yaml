simpleMeaning: A rope or wire pulled tight high above the ground, where acrobats do their show.
scope: A rope or wire pulled tight high above the ground for acrobats; not a loose rope and not a wire
  for carrying power.
examples:
- The acrobat walked across the tightrope without a net.
- She balanced on the tightrope high above the crowd.
