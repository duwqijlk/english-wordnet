simpleMeaning: false teeth made to fit in the mouth and take the place of teeth that are missing
scope: 'Also called plate and dental plate: false teeth that a person wears in the mouth; not a person''s
  real teeth, and not a flat dish used for food.'
examples:
- She took her denture out at night and put it in water.
- His new denture let him eat hard food again.
