simpleMeaning: what a thing is like, what happens with it, and the laws it follows
scope: What a thing is like, what happens with it, and the laws it follows; physics is another name for
  this sense, not the nature of living things and not the story of past events.
examples:
- He studied the physical science of radiation in class.
- The physical science of a stone is its weight, its hardness, and how it breaks.
