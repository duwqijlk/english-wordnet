simpleMeaning: a hormone (a chemical made in the body to control how it works) made and sent out by a
  small part in the brain (the pineal gland)
scope: This is the chemical itself, made in the brain; it is not the small part of the brain that makes
  it.
examples:
- Blood tests showed that his melatonin was low.
- Melatonin is made by the pineal gland in the brain.
