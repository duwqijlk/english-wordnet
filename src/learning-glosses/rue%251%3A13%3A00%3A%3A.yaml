scope: Leaves sometimes used to flavour fruit or a wine cup, needing great care, not the strong-smelling
  plant with grey-green leaves that they come from.
examples:
- A little rue went into the fruit cup for flavour.
- Handle rue with care, as it can sting the skin like poison ivy.
