simpleMeaning: A tongue used in South Africa as one of its official tongues, close kin to Dutch and Flemish
scope: Also called Afrikaans, Taal and Taal language; it is the tongue itself, not the word for the people
  who speak it or for things of theirs.
examples:
- The Afrikaans language is close kin to Dutch.
- Children learn the Afrikaans language at school.
