simpleMeaning: Eyes fill with tears from this gas, which does no harm, and crowds break up
scope: 'Also called lachrymator: a gas that fills the eyes with tears without harming them, used to break
  up crowds, not a gas that harms the eyes and not a gas used to kill.'
examples:
- The lacrimator made the crowd's eyes stream with tears.
- Police sprayed a lacrimator to disperse the crowd.
