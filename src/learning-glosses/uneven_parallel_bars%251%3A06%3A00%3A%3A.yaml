simpleMeaning: two long poles that run side by side, set one higher than the other, for use by women in
  gymnastics
scope: 'Another name for uneven bars: two long poles at different heights for women in gymnastics, not
  the men''s bars at the same height and not a single high bar.'
examples:
- She moved with ease between the uneven parallel bars.
- The uneven parallel bars were set at different heights for the women's event.
