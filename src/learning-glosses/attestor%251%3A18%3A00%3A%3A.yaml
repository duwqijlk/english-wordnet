senseId: 'attestor%1:18:00::'
synsetId: 10805946-n
simpleMeaning: In law, a person who signs a paper or a written name to say it is true, adding their own
  signature
scope: In law, this is a person who signs a paper or a written name to say it is true; witness, attestant
  and attestator are other names for this sense, not a person who speaks in court about what they saw
  and not the person who wrote the paper.
examples:
- The attestor signed the will to say the signature on it was true.
- An attestor adds their own signature to show the document is genuine.
