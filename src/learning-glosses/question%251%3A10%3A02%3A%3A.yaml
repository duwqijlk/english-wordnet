simpleMeaning: a formal proposal for action put to a meeting of a group for discussion and a vote.
scope: This is not a sentence that asks for information, and not a doubt about whether something is true;
  it is a formal proposal put to a meeting for discussion and a vote.
examples:
- The question before the council was whether to fund a new library.
- Members debated the question for an hour before voting.
