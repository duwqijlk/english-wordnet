simpleMeaning: A vegetable shaped like an egg, with shiny skin that is usually dark purple but sometimes
  white or yellow
scope: The vegetable itself, also called aubergine and mad apple; this is the food, not a colour or a
  dish made from it.
examples:
- She cut the eggplant into thick slices and fried them.
- The eggplant in the shop had shiny dark purple skin.
