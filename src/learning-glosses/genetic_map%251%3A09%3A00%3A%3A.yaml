simpleMeaning: A drawing that shows where units of heredity sit along the long thread in a cell that holds
  them.
scope: This is a drawing that shows where units of heredity sit along the long thread in a cell that holds
  them, not a drawing of roads and not a list of a family's kin.
examples:
- The genetic map showed where each unit sits on the thread.
- Scientists drew a genetic map of the whole thread.
