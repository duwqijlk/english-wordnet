simpleMeaning: Thorny bush or small tree growing in Central America and the West Indies, with finely divided
  leaves and clusters of yellow flowers. Its hard reddish-brown wood makes black dye.
scope: This is the Central American dye-wood shrub, another name for logwood and bloodwood tree; it is
  not the extracted heartwood that dyers buy.
examples:
- Campeachy grows along the coasts of Central America and the West Indies.
- Early botanists described campeachy as a thorny shrub with clusters of yellow flowers.
