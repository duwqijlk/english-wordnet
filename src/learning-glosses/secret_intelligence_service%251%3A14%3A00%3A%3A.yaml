simpleMeaning: A group of the government of the United Kingdom that keeps the country safe inside and
  works against spies in other lands.
scope: 'Also called MI and Military Intelligence Section 6: the government group in the United Kingdom
  that guards the country from within and works against spies abroad, not the police and not the armed
  forces.'
examples:
- The Secret Intelligence Service works against spies in other lands.
- The Secret Intelligence Service keeps the United Kingdom safe from threats inside the country.
