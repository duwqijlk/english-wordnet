simpleMeaning: A large white garden bloom bred from two chrysanthemum species, with flower heads like
  oxeye daisies; it is often grouped with chrysanthemums.
scope: A garden hybrid with large white heads like an oxeye's, often grouped with chrysanthemums; not
  the wild oxeye daisy or the showy daisy, a mountain wildflower.
examples:
- Shasta daisies line the front border every July.
- Each shasta daisy opens a large white head above a clump of green leaves.
