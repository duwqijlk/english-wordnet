simpleMeaning: The under side of the tongue is fed by a blood tube that starts from the tube running up
  the outside of the neck
scope: This blood tube that feeds the under side of the tongue is also called the lingual artery.
examples:
- The arteria lingualis brings blood to the under side of the tongue.
- The arteria lingualis leaves the tube running up the outside of the neck.
