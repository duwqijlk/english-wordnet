simpleMeaning: A hard kind of steel in which carbon stays mixed through the iron, made when steel is cooled
  so fast that a change inside it is stopped
scope: A hard kind of steel made by cooling fast, not steel left to cool slowly.
examples:
- Martensite makes the blade hard after the steel is cooled in a rush.
- The smith knew martensite had formed when the quenched steel stayed hard.
