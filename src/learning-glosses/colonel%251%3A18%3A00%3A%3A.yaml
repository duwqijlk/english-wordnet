simpleMeaning: a senior officer in the United States Army, Air Force, or Marines, ranked just below a
  brigadier general and just above the next rank down
scope: A senior United States officer, not a general and not a junior officer.
examples:
- The colonel inspected the troops at dawn.
- She was made a colonel after twenty years of service.
