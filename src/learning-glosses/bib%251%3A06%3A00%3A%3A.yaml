simpleMeaning: At meals, a child has this cloth tied under the chin
scope: A cloth tied under a child's chin at meals. Not the top part of an apron, which covers the chest.
examples:
- She tied a bib around the baby's neck before lunch.
- The child's bib caught the soup she spilled.
