simpleMeaning: A machine for making copies, using a flat sheet of jelly-like stuff that holds ink and
  gives it off onto paper.
scope: A copying machine that uses a jelly-like plate holding ink; hectograph is another name for this
  sense, and this is not a printing press or a photocopier.
examples:
- The office used a heliotype to run off copies of the notice.
- She pressed the paper onto the heliotype to take a copy.
