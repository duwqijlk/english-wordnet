simpleMeaning: with no new ideas and nothing fresh, natural or unplanned, and no longer new
scope: 'Also called cold and dusty: about ideas, news or jokes with nothing new in them; not about food
  that is no longer fresh, and not about cattle and horses passing water.'
examples:
- He told the same stale jokes we had heard for years.
- The newspaper printed stale news that everyone already knew.
