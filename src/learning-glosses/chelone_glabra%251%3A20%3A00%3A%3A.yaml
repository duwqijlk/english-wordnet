simpleMeaning: A showy marsh plant living many years, of eastern and central North America, with waxy
  spear-shaped leaves and a flower creamy white below and pale pink to deep purple above.
scope: Also called turtlehead, shell-flower, shellflower, snake-head, and snakehead; a showy marsh plant
  of eastern and central North America with a flower creamy white below and pink to deep purple above.
examples:
- Chelone glabra grows in the marsh.
- The Chelone glabra flower is creamy white below.
