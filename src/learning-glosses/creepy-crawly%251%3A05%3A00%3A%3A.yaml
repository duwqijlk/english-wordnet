simpleMeaning: An animal that moves slowly along the ground or over things, such as a worm, a spider,
  or an insect
scope: A creature that creeps or crawls on the ground, not a flying bird and not a swimming fish.
examples:
- A creepy-crawly moved across the floor under the table.
- She lifted the stone and found a creepy-crawly underneath.
