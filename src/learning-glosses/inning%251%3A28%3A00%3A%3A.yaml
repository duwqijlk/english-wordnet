simpleMeaning: In baseball, one of nine parts of a game, in which each team has a turn to hit the ball
scope: Also called frame. This is one of nine parts of a baseball game when each team has a turn to hit
  the ball, not the whole game and not a long turn to hit in cricket.
examples:
- The home team scored three runs in the last inning.
- In the fifth inning, both teams had a turn to hit.
