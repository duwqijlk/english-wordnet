simpleMeaning: People use this man-made material, made from chemicals built with nitrogen, to stick things
  together and to coat paper and cloth.
scope: Also called amino plastic and aminoplast, this man-made resin is used to stick things together
  and coat paper and cloth, and is not a resin found in nature.
examples:
- The amino resin stuck the label to the box.
- They coated the cloth with amino resin.
