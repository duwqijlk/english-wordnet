simpleMeaning: when a part or a machine suddenly stops working as it should
scope: This sense is a part or machine that suddenly stops working; it is not a big party and not a big,
  easy win in a game.
examples:
- The car had a blowout in the front tire on the way home.
- As a result of the blowout, all the lights in the house went out.
