simpleMeaning: In work with computers, doing the same set of steps a set number of times or until a set
  end is reached
scope: In work with computers, doing the same steps over and over, not a single straight run through them.
examples:
- The looping in the program ran a hundred times before it stopped.
- We fixed the looping so the list would print only once.
