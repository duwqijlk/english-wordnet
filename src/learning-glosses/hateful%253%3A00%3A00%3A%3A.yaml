simpleMeaning: making people feel hatred, or deserving to be hated
scope: Something that stirs hatred or deserves it, not the feeling of hate itself and not a person who
  is merely disliked.
examples:
- The preacher said no vice is as hateful as ingratitude.
- His hateful words made everyone in the room angry.
