simpleMeaning: not following the rules of polite, proper behaviour in dress, words, or acts
scope: About dress, words, or acts that are not proper or polite; not the sense that means a person thinks
  they are more important or better than they really are.
examples:
- Her immodest dress shocked the older guests at the dinner.
- He made an immodest joke that was not fit for children.
