simpleMeaning: 'Its sharp smell stings the nose: this clear liquid is made of carbon, hydrogen, oxygen
  and chlorine.'
scope: This is a clear liquid with a sharp smell, also called ethanoyl chloride, and it is not the sour
  liquid made from wine or cider.
examples:
- The clear liquid was acetyl chloride, and its sharp smell stung the nose.
- Acetyl chloride smells sharp and strong.
