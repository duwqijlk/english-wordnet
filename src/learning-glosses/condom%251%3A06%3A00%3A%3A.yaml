simpleMeaning: a thin rubber or latex cover worn over the penis during sex to stop a woman getting pregnant
scope: 'Also called a safe, a safety, or a rubber: a thin rubber or latex cover worn over the penis during
  sex to stop a woman getting pregnant, not a pill and not a device worn inside the body.'
examples:
- He bought a packet of condoms at the chemist's.
- They used a condom every time they had sex.
