simpleMeaning: In the warm lands of South and Central America lives a small toothless anteater with a
  tail that can grip and front legs with four claws.
scope: 'Also called tamandu and tamandua: a small toothless anteater of tropical South and Central America.'
examples:
- The lesser anteater hung from a branch by its gripping tail.
- We saw a lesser anteater in Central America.
