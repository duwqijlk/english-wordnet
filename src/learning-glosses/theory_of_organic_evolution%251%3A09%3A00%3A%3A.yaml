simpleMeaning: In biology, the tested account of how living kinds arose from earlier living kinds
scope: Also called the theory of evolution; the scientific account of how species came to be, not a guess
  about one animal's life.
examples:
- The theory of organic evolution traces all life to common ancestors.
- Darwin set out the theory of organic evolution in his famous book.
