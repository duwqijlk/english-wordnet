simpleMeaning: The way of writing words in the land across the Atlantic, with forms like 'analyze' and
  'center'.
scope: 'Also called American English orthography, American English spelling, American spelling, US English
  spelling, and US spelling: the way of writing words in the land across the Atlantic, with forms like
  ''analyze'', ''center'', and ''usable'', different from the way of writing words in Britain and from
  the way of writing words in Canada.'
examples:
- US English orthography writes 'analyze' with a z.
- In US English orthography, 'center' ends in -er.
