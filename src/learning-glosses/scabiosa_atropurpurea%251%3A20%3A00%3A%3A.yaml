simpleMeaning: An Old World plant that lives for one year, with sweet-smelling flower heads from purple
  to deep red; now living in the United States.
scope: Also called mournful widow, pincushion flower, or sweet scabious, this is an Old World plant that
  lives for one year, with sweet-smelling flower heads from purple to deep red, now living in the United
  States, not a plant that lives for many years and not a plant of the New World alone.
examples:
- Scabiosa atropurpurea blooms in the garden with purple flower heads.
- The sweet-smelling Scabiosa atropurpurea now grows in the United States.
