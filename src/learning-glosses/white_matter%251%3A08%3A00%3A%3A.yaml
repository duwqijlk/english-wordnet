simpleMeaning: Nerve cells and the pale coats round them make up this pale nerve tissue in the brain and
  the cord down the back.
scope: Also called substantia alba, this pale nerve tissue in the brain and the cord down the back is
  made of nerve cells and the pale coats round them.
examples:
- White matter runs through the brain and the cord down the back.
- White matter is made of nerve cells and the pale coats round them.
