simpleMeaning: With small raised spots topped by blisters and hard itching, this long-lasting skin sickness
  leaves the skin sore and swollen
scope: This is a long-lasting sickness of the skin, sore and swollen, with small raised spots topped by
  blisters and hard itching.
examples:
- Prurigo left his skin sore and swollen, with small raised spots topped by blisters.
- His prurigo itched hard, and the raised spots were topped by blisters.
