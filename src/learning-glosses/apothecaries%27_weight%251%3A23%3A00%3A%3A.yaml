simpleMeaning: Any of the measures for making up drugs, in which an ounce holds 480 grains and a pound
  holds 12 ounces.
scope: It is also called apothecaries' unit, and it names one of the measures for making up drugs, with
  480 grains to the ounce and 12 ounces to the pound.
examples:
- The apothecaries' weight list gave the ounce as 480 grains.
- The pharmacist kept an apothecaries' weight chart on the wall.
