simpleMeaning: a way of thinking where you take the claim you want to prove as true and then work back
  to the facts that support it
scope: This is a way of thinking that works back from an end point taken as true, not the act of going
  back to an earlier or worse state.
examples:
- His proof used a regress, starting from the claim as true and working back to the facts.
- The teacher showed a regress to test whether the facts really support the answer.
