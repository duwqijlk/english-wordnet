simpleMeaning: On the white of the eye sits a raised patch of springy body stuff, which may reach the
  clear front part but does not cover it.
scope: It is the raised patch of springy body stuff on the white of the eye that may reach the clear front
  part without covering it.
examples:
- A pinguecula appeared on the white of the eye.
- The pinguecula stayed clear of the front part of the eye.
