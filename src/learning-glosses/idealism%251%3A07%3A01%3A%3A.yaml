simpleMeaning: thinking about things as perfect, not as they really are, in a way that does not work well
  in real life
scope: This is thinking about things as perfect in a way that does not work in real life, not the sense
  of holding high aims and trying to live by them.
examples:
- His idealism made him plan a town with no crime and no cost.
- Her idealism led her to expect perfect schools in a poor town.
