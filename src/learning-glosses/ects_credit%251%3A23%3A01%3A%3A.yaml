simpleMeaning: Marks that show how much work a course, seminar, or module asks of a student, given when
  the work is done
scope: Marks that show how much work a course asks of a student; ECTS-credit point and credit point are
  other names for this sense, not a grade for how well the work was done and not a fee for the course.
examples:
- One ECTS credit stands for about 25 hours of work.
- She earned ten ECTS credits for the seminar.
