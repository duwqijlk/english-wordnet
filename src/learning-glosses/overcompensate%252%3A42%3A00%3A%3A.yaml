schema: oewn-learning-gloss-v2
senseId: 'overcompensate%2:42:00::'
synsetId: 02678648-v
simpleMeaning: to make up for faults or a feeling of not being good enough by making your good points
  look bigger than they are
scope: Also called cover, and another name for this sense is compensate. This is about making up for faults
  or feeling not good enough, not about making too many corrections because you fear a mistake.
examples:
- He overcompensates for his small size by talking loudly about how strong he is.
- She overcompensated for feeling shy by showing off her prizes again and again.
