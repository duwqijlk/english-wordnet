simpleMeaning: a way of painting and making statues that follows the rules and tastes of the art schools
  of Europe
scope: This is a way of painting and making statues that follows the art schools of Europe, also called
  academic art and academism; not new or modern art and not art made outside those schools.
examples:
- His early work shows the academicism of the old art schools.
- Critics said the academicism of the painting made it look stiff and formal.
