senseId: 'coign%1:06:02::'
synsetId: 04042480-n
simpleMeaning: a wedge of metal or wood that can be made wider, used by printers to hold a set of type
  tight in its frame
scope: A wedge that can be made wider, used by printers; coigne and quoin are other names for this sense;
  not a plain wedge for splitting wood, and not a corner stone.
examples:
- The printer tapped the coign tight with a mallet.
- He slipped a coign under the type to hold it fast.
