simpleMeaning: a kitchen tool made of stuff that stays firm in heat, used to make food
scope: A kitchen tool that stays firm in heat and is used to make food, also called cookware; not a dish
  for serving food and not a tool that melts in heat.
examples:
- A wooden spoon is a cooking utensil that will not melt in the pot.
- Use a metal cooking utensil to stir the hot soup.
