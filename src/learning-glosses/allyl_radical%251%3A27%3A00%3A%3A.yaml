simpleMeaning: From propylene comes a set of carbon and hydrogen atoms, C3H5, that acts as one bit, with
  one free link and one double link.
scope: Also called allyl and allyl group, this is a set of atoms from propylene that acts as one bit.
examples:
- Propylene gives the allyl radical its atoms.
- The allyl radical holds one free link.
