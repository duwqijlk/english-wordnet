simpleMeaning: Full of friendly company, with people enjoying being together.
scope: This describes an occasion or atmosphere of friendly company, not anything about society or public
  welfare, and not a club's membership.
examples:
- They had a social evening with their neighbours.
- The team dinner was a social occasion, with no talk of work.
