simpleMeaning: wearing a surface away by rubbing against it
scope: This describes something that wears a surface away by rubbing; not the name for the substance that
  does the rubbing, and not sharply disagreeable or rude in manner.
examples:
- The abrasive edge slowly wore down the soft stone.
- Sand has an abrasive effect on the painted wall.
