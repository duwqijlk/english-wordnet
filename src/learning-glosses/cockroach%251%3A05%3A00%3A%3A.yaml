simpleMeaning: an insect, one of many kinds, that comes out mostly at night; the kinds that live in houses
  are pests
scope: A night insect that can be a pest in the home, not a beetle and not another household bug.
examples:
- A cockroach ran across the kitchen floor at night.
- We found cockroaches behind the stove.
