simpleMeaning: a single white-and-yellow food cooked on its own in cream or butter in a small dish (a
  ramekin)
scope: A single egg cooked on its own in cream or butter, also called baked egg and shirred egg; not a
  fried egg and not a boiled egg.
examples:
- She served egg en cocotte for breakfast.
- The egg en cocotte was baked in a small ramekin.
