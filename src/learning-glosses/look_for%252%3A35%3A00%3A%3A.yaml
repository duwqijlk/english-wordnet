simpleMeaning: A person works to learn if something is real, or to get hold of a person or a thing
scope: Also called search and seek, this is trying to find a person or thing or to learn if something
  is real, not just waiting for it to turn up and not a quick check of a thing.
examples:
- I will look for my keys in the kitchen.
- They look for signs of life on the far planet.
