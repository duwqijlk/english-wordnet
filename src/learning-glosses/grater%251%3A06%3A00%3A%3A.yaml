simpleMeaning: a kitchen tool with sharp holes, used to cut food such as vegetables or cheese into small
  thin pieces
scope: This is a small kitchen tool you rub food against to cut it into small pieces. It is not a knife
  and not a cutting board.
examples:
- She used a grater to shred the cheese for dinner.
- He rubbed the carrots on a grater to make a salad.
