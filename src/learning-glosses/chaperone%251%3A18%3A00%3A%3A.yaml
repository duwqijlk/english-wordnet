synsetId: 09927731-n
simpleMeaning: a person who goes with a young woman or with groups of young people and watches over them
scope: Also called chaperon. This is the person who goes with and watches over young people, not the act
  of going with them, which is the verb sense.
examples:
- An older sister acted as chaperone for the girls at the dance.
- The school asked a parent to be a chaperone on the trip.
