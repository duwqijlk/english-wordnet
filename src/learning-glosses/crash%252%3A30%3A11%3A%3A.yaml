simpleMeaning: To go through a steep, sudden slump.
scope: This is a market or business falling sharply, not breaking something violently, moving with a loud
  noise, or causing something to collide.
examples:
- The economy crashed after the currency lost half its value.
- Share prices crashed when the news broke.
