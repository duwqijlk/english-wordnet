simpleMeaning: Any of several delicate flowers from Asia, grown above all for their soft leaves with shiny
  white or gold lines like metal.
scope: Any of several delicate flowers from Asia, grown above all for their soft leaves with shiny white
  or gold lines; not a flower grown for its blooms and not a common garden flower.
examples:
- The jewel orchid sat on the windowsill, its leaves veined with gold.
- She grows jewel orchid for its soft, patterned leaves.
