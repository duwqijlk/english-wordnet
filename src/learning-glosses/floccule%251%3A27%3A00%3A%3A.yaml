simpleMeaning: A small soft clump of fine bits that hangs in a liquid or settles out of it.
scope: This is a small soft clump in a liquid, not a solid lump or a clear liquid, and it is also called
  a floc.
examples:
- A floccule floated in the liquid.
- The floccule settled slowly.
