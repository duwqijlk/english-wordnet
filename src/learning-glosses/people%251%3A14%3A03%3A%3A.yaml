simpleMeaning: Ordinary citizens as a group, especially those without special rank, wealth, or power.
scope: This means ordinary citizens as a mass, not a particular ethnic group or nation and not a few named
  individuals.
examples:
- The party claims to speak for the people, not for the wealthy elite.
- The people had little say in the new law.
