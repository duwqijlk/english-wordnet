simpleMeaning: A substance that forms clear hard crystals, found in the sap that comes out of some cone
  trees
scope: A crystal-forming substance from the sap of cone trees, not a common kitchen acid and not the tree's
  wood.
examples:
- Juniperic acid forms in the sap of some conifers.
- The chemist found juniperic acid in the tree's exudation.
