simpleMeaning: Often a weed in Britain and the United States, a small bush from Europe and Asia has bunches
  of yellow flowers that give a dye, sometimes grown for show
scope: This sense is also called whin, dyer's-broom, dyer's greenweed, dyeweed, greenweed, or woadwaxen,
  and it is a small bush whose yellow flowers give a dye.
examples:
- Woodwaxen was a weed in Britain and the United States.
- Woodwaxen flowers gave a dye.
