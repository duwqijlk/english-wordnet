simpleMeaning: to wash with a mop or a similar cleaning tool
scope: The action of washing with a mop or cleaning tool, not the small cotton piece used for medicine
  or a wound, and not the cleaning tool itself.
examples:
- The sailors swab the ship's decks every morning.
- She swabbed the kitchen floor with a mop.
