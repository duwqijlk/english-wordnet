simpleMeaning: able to stretch or be pressed and then go back to its first shape, and able to jump back
  quickly
scope: 'Also called live, lively, resilient, and springy: this describes a thing that springs back after
  being pressed or after hitting something, not a thing that stays flat or stiff.'
examples:
- The bouncy ball jumped back up after it hit the floor.
- Children like the bouncy floor because it springs back under their feet.
