synsetId: 12200149-n
simpleMeaning: A sparsely prickly East Indian plant, an annual herb or a long-lived low shrub, widely
  grown for fleshy flower cups, used in tarts and jelly, and for stem fibre.
scope: In this sense sorrel is the hibiscus grown for its fleshy flower cups; red sorrel, roselle and
  rozelle are other names for the same plant. It is not the weedy green of the same name, nor the wood-sorrel
  of the genus Oxalis.
examples:
- Dried sorrel is steeped with ginger and spice to make a deep red Christmas drink.
- She grew sorrel for its fleshy calyxes rather than for its leaves.
