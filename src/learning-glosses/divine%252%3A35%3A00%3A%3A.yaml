simpleMeaning: to look for a hidden thing by a power you cannot explain, as if with a rod that points
  to it
scope: To search for a hidden thing by a power you cannot explain, not to know a thing at once, and not
  the adjectives for what is holy, heavenly, or splendid.
examples:
- He claimed he could divine underground water.
- They tried to divine where the lost well lay.
