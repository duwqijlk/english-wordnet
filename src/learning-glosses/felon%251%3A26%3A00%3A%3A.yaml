simpleMeaning: a sore, painful swelling with pus at the end of a finger or a toe, around the nail
scope: This is a painful swelling by a nail, also called whitlow; it is not a person who has done a serious
  crime.
examples:
- The doctor said the painful spot by his nail was a felon.
- She could not write because a felon on her finger hurt so much.
