simpleMeaning: Spikes of yellow flowers shaped like tubes and full of sweet juice grow on a low, bushy
  tree with soft, smooth leaves.
scope: Also called honeysuckle, this low, bushy tree is known for its spikes of yellow flowers full of
  sweet juice.
examples:
- The coast banksia's spikes of yellow flowers were full of sweet juice.
- A coast banksia flowered, its spikes of yellow flowers standing out against its soft leaves.
