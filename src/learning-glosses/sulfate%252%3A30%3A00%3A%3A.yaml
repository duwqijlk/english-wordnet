simpleMeaning: to turn something into a substance made from sulfuric acid (a very strong acid that has
  sulfur in it)
scope: This is the action of changing something into a substance made from sulfuric acid; it is not the
  substance itself, which is the noun sense of this word.
examples:
- The factory sulfated the liquid to make a new solid.
- Workers sulfate the material before it is sold as powder.
