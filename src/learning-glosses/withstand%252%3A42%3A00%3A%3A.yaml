simpleMeaning: To meet a force or attack head-on and not be beaten by it
scope: To face a force or attack and refuse to be beaten by it, also called hold or defy; not merely to
  bear pain and not to put up with a person.
examples:
- The bridge withstood the flood.
- The old wall withstood centuries of storms.
