simpleMeaning: the act of dividing into branches or parts that spread out from one main part
scope: 'Also called fork, branching and forking: the act of splitting into parts, not a result or effect
  that follows from an action.'
examples:
- The ramification of the river into small streams made the land wet and green.
- We studied the ramification of the tree's roots under the ground.
