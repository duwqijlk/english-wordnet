simpleMeaning: Beside a main road, a paved strip is set aside for cars that need to stop for a short time
scope: 'Also called a lay-by and a pull-off: a paved strip beside a main road where cars can stop for
  a short time, not a car park and not a bus stop.'
examples:
- We stopped at a layby to let the children stretch their legs.
- A layby near the motorway was full of parked lorries.
