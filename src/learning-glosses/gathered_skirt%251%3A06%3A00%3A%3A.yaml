simpleMeaning: At the waist, the cloth of this piece of clothing for the lower body is pulled together
scope: A piece of clothing for the lower body with its cloth pulled together at the waist, not a straight
  piece of clothing and not a pleated one.
examples:
- She wore a gathered skirt with a wide belt at the waist.
- The gathered skirt bunched softly around her waist.
