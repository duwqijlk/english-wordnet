simpleMeaning: The group of millions of stars that holds our sun, seen as a pale band of light across
  the night sky
scope: Also called the Milky Way and the Milky Way System; the group of stars that holds our sun, not
  a single star and not a group of stars far from our sun.
examples:
- The Milky Way Galaxy holds our sun among millions of stars.
- We live in the Milky Way Galaxy.
