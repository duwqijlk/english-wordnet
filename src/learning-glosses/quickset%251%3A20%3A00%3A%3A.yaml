simpleMeaning: Bits cut from plants, put in the ground to grow as a thorny bush for hedges, or as vines
scope: Cuttings planted to grow into a hedge or vines, not a full-grown hedge and not cuttings grown for
  food.
examples:
- We planted a quickset of hawthorn along the edge of the field.
- The quickset of vine took root in the vineyard.
