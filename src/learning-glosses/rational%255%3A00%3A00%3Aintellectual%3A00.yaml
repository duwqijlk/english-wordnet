simpleMeaning: coming from clear thinking, not from what you have felt or lived through
scope: A thought that comes from clear thinking, not from feeling or from what you have lived through,
  and not a number that can be written as a fraction.
examples:
- She gave a rational account of the accident, based on the facts.
- His rational mind refused to accept the story without proof.
