simpleMeaning: to change how an apartment or house looks, to make it look new again
scope: This is about changing how an apartment or house looks to make it look new again; it is not about
  fixing broken parts of a building, and it is not about cleaning a home.
examples:
- They redecorated their small apartment with light blue paint.
- We plan to redecorate the house before we move in.
