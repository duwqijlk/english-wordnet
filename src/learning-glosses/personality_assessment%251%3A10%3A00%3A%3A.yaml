simpleMeaning: A set of written questions meant to show what a person's character is like.
scope: A set of written questions meant to show what a person's character is like; personality inventory
  is another name for this sense, not a test of skill or knowledge.
examples:
- The job asked her to fill in a personality assessment before the interview.
- His personality assessment showed he was calm under pressure.
