simpleMeaning: to turn one part of something back so it lies over another part
scope: The transitive action of bending one part over another, not mixing an ingredient into food, penning
  sheep, or simply becoming bent.
examples:
- She folded the letter and put it in the envelope.
- He folded the map along its creases.
