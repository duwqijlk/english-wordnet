senseId: 'genotype%1:07:00::'
synsetId: 04941220-n
simpleMeaning: The set of gene forms, at set places in the genes, that a living thing carries.
scope: The gene forms one living thing carries at set places in its genes, not a group of living things
  that share the same gene make-up.
examples:
- The two mice had the same genotype, though one looked quite different.
- Her genotype carries the gene form for blue eyes.
