simpleMeaning: Pain eases and more blood comes to one part of the body when unseen heat rays are used
  on it, from lamps, heating pads, or hot water bottles.
scope: Heat rays that cannot be seen, used on one part of the body to ease pain and bring more blood there.
examples:
- The nurse used infrared therapy on his sore shoulder.
- Infrared therapy eased the pain in her knee.
