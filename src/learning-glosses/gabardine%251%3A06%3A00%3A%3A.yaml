simpleMeaning: a strong cloth that lasts a long time, made with thin lines that run at an angle across
  it
scope: This is the cloth itself, not a long loose coat made from it, and not trousers made from it.
examples:
- He bought gabardine to make a jacket.
- The suit was cut from strong gabardine that kept its shape.
