simpleMeaning: the top boss of a firm who runs its daily work, answers to its board, and may choose other
  top managers
scope: 'Also called chief operating officer: the top boss of a firm who runs its daily work, not the chief
  financial officer and not a board member.'
examples:
- The chief executive officer met the board to plan the new year.
- As chief executive officer, she chose a new president for the firm.
