simpleMeaning: So striking and good that you notice it at once, and it makes you think of lightning flashing
scope: Striking and good like lightning flashing; dazzling, eye-popping and fulgurant are other names
  for this sense, not merely bright and not merely loud.
examples:
- The fulgurous display lit up the whole stage.
- Her fulgurous talent was clear from the first note.
