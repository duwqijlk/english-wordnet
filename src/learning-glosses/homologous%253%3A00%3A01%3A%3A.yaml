senseId: 'homologous%3:00:01::'
synsetId: 01222723-a
simpleMeaning: Above all when they come from a living thing of the same kind, things match in place, build,
  work or looks
scope: This word is used for things that match in place, build, work or looks, not for things that only
  look alike by chance.
examples:
- A homologous tissue graft comes from an animal of the same species.
- The two bones are homologous because they match in place and build.
