simpleMeaning: A very old tongue, never written down, from which all the tongues of Europe and India grew.
scope: This is the unwritten old tongue behind all Indo-European tongues, also called Proto-Indo European
  and Proto-Indo European language, not a baked dish and not a slice of food.
examples:
- PIE is the ancestor of all Indo-European tongues.
- No one wrote PIE down.
