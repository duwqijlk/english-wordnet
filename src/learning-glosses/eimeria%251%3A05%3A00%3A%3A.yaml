simpleMeaning: A living thing that lives as a parasite in the gut lining of animals with backbones and
  of higher animals without backbones.
scope: 'Also called coccidium: a living thing that lives as a parasite in the gut lining of animals, not
  a free-living germ and not a worm.'
examples:
- Eimeria infects the gut of chickens.
- The vet found eimeria in the calf.
