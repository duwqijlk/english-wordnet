simpleMeaning: 'of water: rising on its own in a well to well above the level of water under the ground,
  but not running out of the well'
scope: Of water that rises on its own in a well but does not run out; not water that stays at ground level
  and not water that flows out freely.
examples:
- The subartesian water rose high in the well but did not flow out.
- A subartesian well holds water well above the level under the ground.
