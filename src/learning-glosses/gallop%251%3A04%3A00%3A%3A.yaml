simpleMeaning: A fast way for a horse to move, with two beats in each step and all four feet off the ground
  at once
scope: A fast way for a horse to move, not a slow walk and not the act of riding.
examples:
- The horse broke into a gallop across the field.
- At full gallop, the horse's feet left the ground together.
