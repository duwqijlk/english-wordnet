simpleMeaning: This part of the thin skin over the eye lines the back of the eyelids and joins the thin
  skin over the eyeball.
scope: Also called conjunctival layer of eyelids and palpebra conjunctiva, this is the thin skin over
  the eye where it lines the back of the eyelids and meets the thin skin over the eyeball.
examples:
- The tunica conjunctiva palpebrarum lines the back of the eyelids.
- Where the tunica conjunctiva palpebrarum meets the thin skin over the eyeball, the two join.
