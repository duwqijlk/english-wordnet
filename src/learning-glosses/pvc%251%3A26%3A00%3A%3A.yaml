senseId: 'pvc%1:26:00::'
synsetId: 14386246-n
simpleMeaning: An uneven beat of the heart, which, when it keeps coming back, can come before a wild quivering
  of the lower chambers.
scope: Also called premature ventricular contraction; an uneven beat of the heart, not the plastic called
  PVC used in cables.
examples:
- The doctor said the PVC in her heartbeat should be watched.
- Repeated PVC can come before a wild quivering of the heart.
