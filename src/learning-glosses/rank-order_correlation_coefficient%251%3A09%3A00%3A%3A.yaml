simpleMeaning: Two sets of marks move together more or less closely, and the way most often used to work
  out how closely is to sort each set from first to last.
scope: Also called rank-difference correlation, rank-difference correlation coefficient, and rank-order
  correlation, this method sorts each set of marks from first to last before working out how closely the
  two sets move together.
examples:
- The rank-order correlation coefficient showed how closely the two sets of marks moved together.
- We worked out the rank-order correlation coefficient after sorting both sets of marks.
