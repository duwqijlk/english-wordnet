senseId: 'neo-marxism%1:09:01::'
synsetId: 92438754-n
simpleMeaning: A loose name for any social theory or sociological study building on Marx and Engels but
  changing or adding to them, often taking in parts from other ways of thinking.
scope: A loose name for social views that build on Marx and Engels but change or add to them, not Marxism
  itself and not a view that rejects Marx.
examples:
- Habermas is closer to neo-Marxism than to the Marxism of the Frankfurt School.
- Her book draws on neo-Marxism to study modern work.
