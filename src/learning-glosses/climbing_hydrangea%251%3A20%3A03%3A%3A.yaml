simpleMeaning: A plant that loses its leaves in winter and goes up with roots that grip from the air,
  bearing large flat heads of flowers.
scope: A plant that loses its leaves in winter and goes up with roots that grip from the air, bearing
  large flat heads of flowers; not the kind with white to creamy flowers in fairly flat heads and not
  a plant that keeps its leaves all year.
examples:
- The climbing hydrangea covered the wall with large flat flower heads.
- A climbing hydrangea gripped the tree with its air roots.
