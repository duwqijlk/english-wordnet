simpleMeaning: having fine taste and fine ways of behaving
scope: Having fine taste and fine ways, not doing only the least that social rules ask, and not just showing
  care for others in speech and acts.
examples:
- They moved in polite society, where fine taste and good ways mattered.
- In those days, a polite home had fine books, fine food, and quiet, well-chosen ways.
