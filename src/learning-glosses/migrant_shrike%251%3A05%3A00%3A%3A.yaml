simpleMeaning: A bird of middle North America that spends the winter in Texas and the south of the Mississippi
  valley.
scope: A bird of middle North America that spends the winter in Texas and the south of the Mississippi
  valley; not a bird that stays in the north all winter and not a bird of the far south.
examples:
- The migrant shrike is a bird of central North America.
- In winter the migrant shrike moves to Texas and the southern Mississippi valley.
