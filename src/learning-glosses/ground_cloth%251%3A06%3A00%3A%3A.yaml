simpleMeaning: Under a tent, a flat sheet of fabric keeps water out and stops damp from coming through
scope: A flat sheet of fabric laid under a tent to keep out damp, also called groundsheet, not a blanket
  to keep warm and not a cover for the top of a tent.
examples:
- They laid the ground cloth under the tent before nightfall.
- The ground cloth kept the damp from soaking through their sleeping bags.
