simpleMeaning: The parts of the eye that make tears and carry them away
scope: The parts of the eye that make tears and carry them away, not a single tear duct and not the eye
  itself.
examples:
- The lacrimal apparatus keeps the eye wet by making and draining tears.
- Damage to the lacrimal apparatus can leave the eye dry.
