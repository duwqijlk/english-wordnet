simpleMeaning: a bird often seen near the sea coast and out on the open sea, such as gulls, pelicans,
  gannets, cormorants, albatrosses and petrels
scope: A bird often seen near the sea coast and out on the open sea, such as gulls and albatrosses; not
  a bird of lakes or rivers, and not a bird that lives only on land.
examples:
- Seabirds circled above the fishing boats.
- We watched a seabird dive for fish off the cliff.
