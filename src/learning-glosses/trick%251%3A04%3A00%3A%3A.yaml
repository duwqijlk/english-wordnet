simpleMeaning: a silly or absurd thing someone does for fun
scope: This is a silly act done for fun and amusement; joke, prank, antic, caper and put-on are other
  names for this sense. Not a magic trick and not a cunning or deceitful scheme.
examples:
- Wearing his shirt inside out was just a silly trick to make us laugh.
- For a party trick, she balanced a spoon on her nose.
