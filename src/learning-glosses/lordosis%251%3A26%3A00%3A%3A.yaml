simpleMeaning: An unnatural bend of the spine that curves inwards, towards the front of the body.
scope: An unnatural inward bend of the spine; hollow-back is another name for this sense, not the normal
  curve of the back and not a sideways bend.
examples:
- Lordosis gave her lower back a deep inward curve.
- The doctor noted lordosis in the child's spine.
