simpleMeaning: the head-measurement point farthest forward in the middle line on the low front edge of
  the upper jaw bone
scope: 'Another name for alveolar point and prostheon: the farthest-forward point on the middle line of
  the upper jaw bone, not a tooth and not the whole jaw.'
examples:
- The prosthion is the point the students marked first on the skull.
- She found the prosthion at the front edge of the upper jaw.
