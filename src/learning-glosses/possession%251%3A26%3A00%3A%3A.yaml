simpleMeaning: A strong feeling, or a power from beyond the world we see, that rules what you do
scope: Being ruled by strong feeling or a strange power, not a thing you own and not land ruled by a state.
examples:
- The old tale spoke of possession by an evil spirit.
- His possession by grief left him unable to work.
