senseId: 'consequently%4:02:01::'
synsetId: 00295773-r
simpleMeaning: as a result of what happened or was said before
scope: This word shows that one thing follows as a result of another, not that it happens next in time
  and not that it gives the reason.
examples:
- It rained all night, and consequently the field was wet.
- She missed the train and consequently arrived late.
