simpleMeaning: The clock setting of the fifth zone west of Greenwich, set by the 75th line of longitude,
  used in the east of the United States.
scope: Also called EST and Eastern Standard Time; the clock setting of the fifth zone west of Greenwich,
  used in the east of the United States.
examples:
- Eastern Time is five hours behind Greenwich.
- The show starts at eight Eastern Time.
