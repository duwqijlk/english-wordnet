simpleMeaning: In accounting, a service less thorough than an audit that gives people with an interest
  some assurance that financial figures can be trusted
scope: Review is another name for this service less thorough than an audit; it gives some assurance about
  financial figures, not the full assurance of an audit.
examples:
- The limited review gave the bank some comfort about the figures.
- A limited review costs less than a full audit.
