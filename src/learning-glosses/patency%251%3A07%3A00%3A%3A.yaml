simpleMeaning: How open a tube or passage in the body is, with nothing in the way
scope: How open a tube or passage in the body is, with nothing in the way, not a blockage and not a narrow
  gap.
examples:
- The doctor checked the patency of the airway before the operation.
- Good patency of the blood tube helps the heart work well.
