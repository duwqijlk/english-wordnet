simpleMeaning: taking away a person's right in law, or making a person not allowed in law to do something
scope: 'Also called disqualifying: this is the law sense — a rule or condition that takes away a right
  or bars a person — not the sense about harming the body so someone cannot move or work.'
examples:
- The judge found a disabling clause that took away his right to vote.
- Under the disabling rules of the time, she could not own land in her own name.
