simpleMeaning: One of the veins that goes up the left side of the back, passing over the midline by the
  eighth spine bone to drain to the azygos.
scope: This vein is also called hemizygos vein and vena hemizygos; it goes up the left side of the back,
  passes over the midline by the eighth spine bone, and drains to the azygos.
examples:
- The hemizygous vein carries blood up the back.
- The hemizygous vein joins the azygos vein.
