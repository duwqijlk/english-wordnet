simpleMeaning: Making a punishment lighter, or letting someone off a task, done by judges, parents or
  teachers
scope: Making a punishment lighter or letting someone off a task; leniency is another name for this sense,
  not a full pardon and not kindness in general.
examples:
- The teacher showed lenience and let him finish the work later.
- Lenience from the judge cut the fine in half.
