simpleMeaning: one of the thin, skin-like, breath-filled parts that stick out from the lungs of birds
scope: A thin, breath-filled part that sticks out from a bird's lungs, not the thin-walled parts in an
  insect's breathing tubes and not the tiny breath-holding parts in a person's lungs.
examples:
- The air sac helped the bird breathe during its long flight.
- Birds have air sacs joined to their lungs.
