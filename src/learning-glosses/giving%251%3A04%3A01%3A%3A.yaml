simpleMeaning: The act of handing over money or property to someone as a gift, with nothing received back.
scope: It is not a sale or exchange for payment, and not the act of handing a small object to someone.
examples:
- The giving of the land to the town was recorded in the will.
- Their regular giving keeps the shelter open.
