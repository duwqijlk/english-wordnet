simpleMeaning: a curved piece of wood that comes back to the person who threw it, when it is thrown in
  the right way
scope: The curved wooden throwing thing, not a plan that turns back and harms its maker, and not the act
  of returning to where something started.
examples:
- He threw the boomerang and it came back to his hand.
- She learned to throw a boomerang at the park.
