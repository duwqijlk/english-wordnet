simpleMeaning: A sheet of living stuff that keeps the bundles of tubes apart.
scope: 'Also called medullary ray: a sheet of living stuff that keeps the bundles of tubes apart, not
  a leaf and not a root.'
examples:
- A vascular ray keeps the bundles of tubes apart in the wood.
- The vascular ray is a sheet of living stuff between the bundles.
