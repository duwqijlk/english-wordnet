simpleMeaning: Women's shoes with an extremely thick sole that lifts the wearer high.
scope: A women's shoe with a thick raised sole, not a raised surface to stand on and not a railway station
  area.
examples:
- She wore white platform shoes to the party.
- The dancer's platform shoes added several inches to her height.
