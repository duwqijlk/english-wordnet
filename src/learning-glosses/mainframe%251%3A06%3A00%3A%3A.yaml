simpleMeaning: In computer science, a microprocessor chip, a small part of a computer that does most of
  the work with data
scope: This is the small working part inside a computer, also called processor; it is not a large computer
  that serves many users at once.
examples:
- The computer's mainframe, a small chip, does most of the work with its data.
- When the mainframe broke, the computer could not work with any data at all.
