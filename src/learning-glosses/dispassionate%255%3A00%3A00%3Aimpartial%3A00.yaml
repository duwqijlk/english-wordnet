senseId: dispassionate%5:00:00:impartial:00
synsetId: 01727865-s
simpleMeaning: not changed by strong feelings, and not by liking or disliking a person or thing before
  knowing the facts
scope: Fair and not moved by strong feelings or unfair likes and dislikes; not the same as having no feelings
  at all, and not just quiet or calm.
examples:
- A dispassionate judge listened to both sides before deciding.
- The report gave a dispassionate view of the facts, with no anger or favour.
