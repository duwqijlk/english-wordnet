simpleMeaning: One kind of white blood cell grows too fast in number in this sudden blood sickness, which
  turns up most often in teenagers and young grown-ups.
scope: This is a sudden blood sickness in which one kind of white blood cell grows too fast in number;
  acute myelocytic leukemia is another name for this sense, not a blood sickness that grows slowly in
  older people.
examples:
- Acute myeloid leukemia turned up in a teenager when one kind of white blood cell grew too fast in number.
- The doctors found acute myeloid leukemia after one kind of white blood cell grew too fast in number.
