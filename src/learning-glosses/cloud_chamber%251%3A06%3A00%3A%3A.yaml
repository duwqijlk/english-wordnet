simpleMeaning: 'A physics instrument showing the paths of high-energy particles: crossing a vapor holding
  more than it can carry, each strips charge from molecules and droplets condense into a line.'
scope: A physics instrument that makes a particle's route visible; not a bubble chamber, and not a cloud
  in the sky.
examples:
- The cloud chamber showed a thin white trail where the particle had passed.
- Students watched tracks form in the cloud chamber during the demonstration.
