senseId: 'universal%1:10:01::'
synsetId: 07274652-n
simpleMeaning: In linguistics, a rule of grammar, or another such part of language, that is found in all
  languages
scope: In linguistics, a rule or part of language found in all languages; not a shared way of behaving
  found in all people, and not a joint that links two turning shafts.
examples:
- The fact that every language has words for people and things is a universal.
- Linguists look for universals that appear in every language.
