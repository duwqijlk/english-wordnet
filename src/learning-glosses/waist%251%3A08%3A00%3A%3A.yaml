simpleMeaning: the narrow part of the body between the ribs and the hips
scope: This is the narrow part of a person's body, not the narrow part of a shoe between its heel and
  its wide bottom.
examples:
- She put her hands on her waist and laughed.
- The belt sits around his waist, above his hips.
