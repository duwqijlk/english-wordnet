simpleMeaning: in a wrong way, whether by mistake or by bad luck
scope: Not about a thing that is wrong in itself; this is about doing, speaking, or judging in the wrong
  way.
examples:
- He spoke amiss when he guessed the answer.
- If you think him guilty, you judge amiss.
