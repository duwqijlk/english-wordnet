simpleMeaning: The part of the large gut that rises from the pouch at its start to the gut that runs across
  the belly
scope: The part of the large gut that rises from the pouch at its start to the gut that runs across the
  belly; not the part that runs across the belly and not the part that runs down.
examples:
- The ascending colon rises from the cecum to the transverse colon.
- Food passes through the ascending colon on its way across the belly.
