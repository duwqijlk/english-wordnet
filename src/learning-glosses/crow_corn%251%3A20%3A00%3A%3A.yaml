simpleMeaning: Bitter roots said to cure belly pain grow on any of several long-lived Aletris plants with
  leaves like grass.
scope: Also called colic root, colicroot, star grass, and unicorn root; a plant with grass-like leaves
  and bitter roots said to cure belly pain, not sweet corn grown for food.
examples:
- The herbalist dug up crow corn for its bitter roots.
- Crow corn grew beside the path with leaves like grass.
