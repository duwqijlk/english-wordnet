simpleMeaning: of a baby bird just out of the egg, with no feathers and eyes that cannot see, and needing
  its parents to bring it food
scope: A baby bird just out of the egg that has no feathers, cannot see, and needs its parents to bring
  it food; not a baby bird that can walk and feed itself, and not a grown bird.
examples:
- The altricial chicks lay naked and blind in the nest.
- Altricial young depend on their parents for every meal.
