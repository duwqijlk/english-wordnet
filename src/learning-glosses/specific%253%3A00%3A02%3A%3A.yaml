simpleMeaning: Said of a disease, remedy, or dye for microscope slides that is tied to one particular
  germ, condition, or structure.
scope: This is a medical and laboratory use, not the general sense of applying to one particular thing,
  not something stated explicitly or in detail, not the biological sense of belonging to a taxonomic species,
  not a fact about some part of a matter, and not a medicine that relieves a particular disease.
examples:
- Quinine is specific for malaria, so it attacks that parasite and leaves other germs alone.
- This dye is specific for cell walls, so only those structures stand out under the microscope.
