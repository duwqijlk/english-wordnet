simpleMeaning: Pipes and fittings for water, gas, or waste in a building are put in and mended in the
  work of a plumber.
scope: Plumbing is another name for this work, which is the putting in and mending of pipes and fittings
  for water, gas, or waste in a building.
examples:
- Putting in pipes for water in a building is plumbery.
- Mending fittings for gas or waste is also part of plumbery.
