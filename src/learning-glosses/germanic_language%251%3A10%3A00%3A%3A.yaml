simpleMeaning: One branch of the Indo-European family of ways of speaking; the ones still spoken fall
  into two main groups, the Scandinavian group and the group of the west.
scope: Also called Germanic; one branch of the Indo-European family of ways of speaking, whose members
  still spoken fall into two main groups, the Scandinavian group and the group of the west.
examples:
- Germanic language is one branch of the Indo-European family.
- The Germanic language group has two main groups still spoken today.
