simpleMeaning: A woman whose worth went unnoticed until she won sudden success and notice
scope: A woman whose worth was long missed and then suddenly seen; both the long wait and the sudden change
  are part of it, not success alone.
examples:
- After years in the shadows, she became the Cinderella of the team.
- The young singer was a Cinderella who rose to fame overnight.
