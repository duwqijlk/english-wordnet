simpleMeaning: a person who sees life as perfect, not as it really is, and who is full of feeling or full
  of love
scope: This is a person who is full of feeling or full of love and who sees life as perfect; not an artist
  of the Romantic Movement, and not a word for loving or unreal ideas.
examples:
- He is a romantic who writes love letters and dreams of a perfect life.
- As a romantic, she believed love could change everything.
