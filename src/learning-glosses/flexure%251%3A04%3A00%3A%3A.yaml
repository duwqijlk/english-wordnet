simpleMeaning: The act of bending a joint, above all a joint between the bones of a limb, so that the
  angle between them gets smaller.
scope: The act of bending a joint so the angle gets smaller, also called flexion; not the straightening
  of a joint and not a bend in a road or a wire.
examples:
- The doctor asked him to show flexure of his elbow.
- Flexure of the wrist lets the hand move toward the arm.
