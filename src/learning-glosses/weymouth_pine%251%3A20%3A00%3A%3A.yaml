simpleMeaning: Its bark is brown with long cracks when old, and this tall pine of eastern North America
  is prized as a timber tree.
scope: Also called eastern white pine, this tall pine of eastern North America has brown bark cracked
  in long lines when old and is valued as a timber tree.
examples:
- The Weymouth pine stood tall in the east of North America.
- Weymouth pine bark turns brown and cracks in long lines as the tree grows old.
