simpleMeaning: Said or shown so plainly that nothing is left for the reader to guess at.
scope: 'Also called expressed: said or shown in plain words with nothing left unsaid, not a thing only
  hinted at.'
examples:
- She gave explicit instructions for the journey.
- He made his wishes explicit before he left.
