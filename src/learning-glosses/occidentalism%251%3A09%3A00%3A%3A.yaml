simpleMeaning: What learned people know about the cultures, languages and peoples of the west.
scope: The learning of scholars about the peoples, tongues and ways of life of the west; not the learning
  about the east, and not a love of western things.
examples:
- His Occidentalism showed in everything he wrote about the west.
- She studied Occidentalism at the university.
