senseId: fanatical%5:00:00:passionate:00
synsetId: 01731073-s
simpleMeaning: showing far too much excitement about a cause or idea and far too much deep support for
  it
scope: Also called rabid, fanatic and overzealous, this means showing far too much support for a cause
  or idea, not just a normal strong liking for something.
examples:
- He is fanatical about his political cause and talks of nothing else.
- Her fanatical support for the idea made her unwilling to hear any other view.
