simpleMeaning: A very tall plant with many branches and showy yellow flower heads made of many petals
scope: A very tall plant with many branches and showy yellow flower heads made of many petals; golden
  glow and hortensia are other names for it, not a low plant and not a plain yellow flower.
examples:
- Double gold grew tall at the back of the garden.
- The double gold opened its yellow heads in June.
