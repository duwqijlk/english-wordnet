simpleMeaning: A drug that blocks a body chemical called ACE, given to lower high blood pressure and after
  heart attacks, also sold as Prinivil.
scope: Also called lisinopril or Prinivil; a drug that blocks ACE, given to lower high blood pressure
  and after heart attacks, not a drug that raises blood pressure.
examples:
- The doctor prescribed Zestril for his high blood pressure.
- He took Zestril after his heart attack.
