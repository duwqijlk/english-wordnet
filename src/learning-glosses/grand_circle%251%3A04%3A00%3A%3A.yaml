simpleMeaning: With the body held straight out, a person swings right round the high bar in a gymnastics
  move
scope: In gymnastics, a move on the high bar in which the body swings right round the bar, not a swing
  that stops part-way round and not a move on the rings.
examples:
- She trained for months to do a grand circle on the bar.
- His grand circle ended with a clean landing on the mat.
