simpleMeaning: To push up the pressure on a gas or a liquid.
scope: To raise the pressure on a gas or a liquid, not to keep it steady and not to raise it inside a
  place or a thing.
examples:
- The pump will pressurize the gas for storage.
- They pressurized the liquid before it went into the tank.
