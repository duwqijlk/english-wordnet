simpleMeaning: anything that keeps things apart by blocking what you can see or where you can go
scope: Anything that keeps things apart by blocking sight or entry, not a wall that holds up a roof and
  not a gate that opens and shuts.
examples:
- A thick hedge formed a barrier between the two gardens.
- The fallen tree was a barrier across the road.
