simpleMeaning: when one sense feeling is shut out because another feeling is present at the same time
scope: In hearing and the senses, one feeling blocking another, not hiding a thing from view and not wearing
  a mask.
examples:
- The test showed masking of one tone by another.
- The masking by one loud tone made the soft sound hard to hear.
