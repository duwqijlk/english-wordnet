simpleMeaning: being willing to accept and show respect for what other people believe or do
scope: Being willing to accept and respect what other people believe or do, not a limit on how much something
  can vary, and not the act of putting up with something.
examples:
- Her tolerance of other faiths impressed everyone.
- Tolerance helps neighbours with different beliefs live side by side.
