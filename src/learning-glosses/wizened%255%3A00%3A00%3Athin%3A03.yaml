simpleMeaning: thin and wrinkled, the way skin and flesh shrink and dry out with age or illness
scope: Thin and wrinkled, the way skin and flesh shrink and dry out with age or illness, not merely thin
  or old; shriveled, shrunken, withered and wizen are other names for this sense.
examples:
- A wizened little man with grey hair opened the door.
- Her wizened hands were thin and lined after a long illness.
