simpleMeaning: likely to give someone or something new life and strength
scope: Also called restorative, renewing and revitalizing; this describes a thing that gives new life
  and strength, not a person coming back to life.
examples:
- A reviving cup of tea made her feel strong again.
- The reviving air of the mountains helped him feel full of life.
