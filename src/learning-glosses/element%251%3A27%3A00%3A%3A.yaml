simpleMeaning: one of more than 100 basic things that cannot be split into simpler things and that, alone
  or together, make up everything; 92 of them are found in nature
scope: A basic thing in science that everything is made of, not a part of a machine or system and not
  one of the four old things people once thought the world was made of.
examples:
- Oxygen is an element that we need to breathe.
- Gold is a rare element found in rocks.
