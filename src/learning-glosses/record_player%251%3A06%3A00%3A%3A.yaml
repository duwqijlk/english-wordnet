simpleMeaning: In this machine a small needle shakes as the disc spins, and the shaking is made louder
  by sound or by wires.
scope: Also called a phonograph, it is a machine that plays discs by making a needle shake.
examples:
- Put a record on the record player and the music starts.
- The record player needed a new needle before it would play.
