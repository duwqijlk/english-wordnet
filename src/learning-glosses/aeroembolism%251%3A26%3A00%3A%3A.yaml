simpleMeaning: A blockage in the circulation caused by an air bubble, as can happen by accident during
  surgery or an injection, or as a complication of scuba diving.
scope: A medical term for a blockage of blood flow by a bubble of air, which can follow surgery, an injection
  or a dive. 'Air embolism' is another name for this same condition. It is not a blood clot, which blocks
  a vessel with clotted blood.
examples:
- The diver was treated for aeroembolism after surfacing too quickly from a deep dive.
- A slip during the injection let air into the vein and caused aeroembolism.
