simpleMeaning: A charge the buyer pays without knowing it, as with a charge set by the value of the goods
  bought
scope: A tax the buyer pays without knowing, not a tax paid on purpose and not a tax shown on a bill.
examples:
- The hidden tax on petrol was one drivers paid without knowing it.
- Shoppers paid a hidden tax on every item without knowing it.
