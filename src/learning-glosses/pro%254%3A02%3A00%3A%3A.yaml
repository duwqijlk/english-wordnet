simpleMeaning: in favor of an idea or a view
scope: Used on its own for doing or saying something in favor of an idea or view; not a reason that supports
  something, and not the word used before a noun.
examples:
- Most members voted pro in the meeting.
- He voted pro on the plan for a longer lunch break.
