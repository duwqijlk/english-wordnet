simpleMeaning: Often to back a loan or a promise to pay, a written paper by law hands property over to
  a person who holds it for another.
scope: This written paper is also called trust deed, and it by law hands property to a person who holds
  it for another, often to back a loan or a promise to pay.
examples:
- They signed a deed of trust when they took out the loan.
- The deed of trust hands the property to a person who holds it for another.
