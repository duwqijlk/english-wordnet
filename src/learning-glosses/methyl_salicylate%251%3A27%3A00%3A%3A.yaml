simpleMeaning: Rubbed on the skin for small aches in muscles and joints, this liquid ester, a chemical
  made from an acid and an alcohol, smells strongly of wintergreen.
scope: Also called birch oil and sweet-birch oil, it is rubbed on the skin for small aches, not taken
  as a pill.
examples:
- They rubbed methyl salicylate on the sore knee.
- That rub smells of wintergreen because it holds methyl salicylate.
