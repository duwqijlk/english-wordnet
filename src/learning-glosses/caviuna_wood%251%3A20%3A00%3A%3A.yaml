simpleMeaning: An important Brazilian tree that gives heavy, hard, dark timber streaked with black.
scope: An important Brazilian tree giving dark hard timber, not a small bush and not a softwood tree;
  jacaranda is another name for this sense.
examples:
- Caviuna wood is prized for its dark colour and black streaks.
- The carpenter chose caviuna wood for the table top.
