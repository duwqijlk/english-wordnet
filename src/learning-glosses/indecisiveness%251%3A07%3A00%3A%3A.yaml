senseId: 'indecisiveness%1:07:00::'
synsetId: 04874097-n
simpleMeaning: The quality of never settling one's mind, with no firmness of character or of aim.
scope: Also called indecision, a quality of character with no firmness in mind or aim; not doubt over
  two or more possible courses of action.
examples:
- His indecisiveness meant the choice was never made.
- The court grew restless over the king's indecisiveness.
