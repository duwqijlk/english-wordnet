simpleMeaning: a small hand tool with a handle and a flat metal blade, used for scooping up or spreading
  plaster or other materials like it
scope: This is the hand tool itself, not the act of using it for garden work or plaster work.
examples:
- He used a trowel to spread plaster on the wall.
- She scooped the wet mix onto the board with a trowel.
