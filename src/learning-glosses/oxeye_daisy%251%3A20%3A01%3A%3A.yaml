simpleMeaning: a white-flowered plant with leafy tall stems that lives year after year; from Europe and
  Asia, it now grows wild far and wide and is often classed with Chrysanthemum
scope: A tall white-flowered plant that lives year after year, also called marguerite, moon daisy, ox-eyed
  daisy, and white daisy; not a yellow daisy and not a short garden flower.
examples:
- Oxeye daisies have spread along the roadside near our house.
- An oxeye daisy stood tall among the grass in the meadow.
