simpleMeaning: Very strict and severe about moral rules, allowing no relaxation of standards.
scope: This describes strict moral standards, not the color, the drug, high social rank, or coarse language.
examples:
- The state's blue laws still keep most shops shut on Sunday mornings.
- A blue-nosed headmaster banned dancing and cards at the school.
