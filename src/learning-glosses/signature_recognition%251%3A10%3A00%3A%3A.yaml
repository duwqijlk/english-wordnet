simpleMeaning: A machine reads the way a person signs their name and, by computer, matches it with samples
  it already holds, so it can tell who they are.
scope: A way of checking who someone is from the way they sign their name.
examples:
- The bank uses signature recognition to check who is signing.
- Signature recognition matched the signing with one it already knew.
