simpleMeaning: A large tree of tropical Asia, often kept small as a house plant; it gives a stretchy gum.
scope: Also called a rubber plant, Ficus elastica, an India-rubber fig, an India-rubber plant, and an
  India-rubber tree; a large tree of tropical Asia, not a small bush of dry lands.
examples:
- The Assam rubber in the hall was kept small as a house plant.
- Assam rubber gives a stretchy gum used to make rubber.
