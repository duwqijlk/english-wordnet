simpleMeaning: In tenpin bowling, pins left standing in separate groups after the first ball
scope: In bowling, this is the pins left in two groups, not the sweet dish, not more shares in a company,
  and not the act of tearing something.
examples:
- He got a split in the last frame and could not knock down all the pins.
- A split left two pins far apart after her first ball.
