simpleMeaning: the process by which societies become highly developed and well organized
scope: 'Also called civilization, a different spelling of the same word: the process of a society growing
  well ordered and developed, not the developed society itself.'
examples:
- The civilisation of these farming groups took hundreds of years.
- Trade helped the civilisation of the coastal peoples spread inland.
