simpleMeaning: A homely name for a person, often cut short from their first name.
scope: This sense is also called a nickname, a moniker, and a sobriquet, for a homely name for a person,
  often cut short from their first name, where a nickname is a name folk who know a person use for them,
  often a short form of their given name, unlike the sense for the last name that marks a whole family,
  apart from first names.
examples:
- His cognomen was a short form of his first name.
- Cognomens are homely names friends use.
