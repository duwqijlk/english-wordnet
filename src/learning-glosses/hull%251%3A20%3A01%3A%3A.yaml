simpleMeaning: the dry outer skin of a fruit, seed, or nut
scope: The dry outer skin of a fruit, seed, or nut, not the green leaf-like cup that stays at the base
  of a fruit like a strawberry.
examples:
- He cracked the hull of the walnut to reach the meat inside.
- The hull of the seed came off in her fingers.
