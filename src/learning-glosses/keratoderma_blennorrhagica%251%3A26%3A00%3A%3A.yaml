simpleMeaning: On the palms and the soles of the feet, this skin illness brings a scaly rash, and it goes
  with a joint illness called Reiter's syndrome.
scope: Keratosis blennorrhagica is another name for this skin illness, marked by a scaly rash on the palms
  and soles and going with a joint illness called Reiter's syndrome.
examples:
- Keratoderma blennorrhagica left scaly patches on the palms of the hands.
- Keratoderma blennorrhagica came with a joint illness called Reiter's syndrome.
