simpleMeaning: a mix of metals, usually made of lead and tin, used when melted to join two metal surfaces
scope: A metal mix, usually lead and tin, used melted to join metal, not the act of joining metal with
  it.
examples:
- He melted the solder to join the two metal parts.
- The solder she used was made of lead and tin.
