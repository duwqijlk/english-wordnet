simpleMeaning: A tool for cleaning floors, made of material that soaks up liquid and is fixed to a handle
scope: A floor-cleaning tool, also called mop and swob; not the small piece of cotton used on a wound
  or to take a test sample, and not the act of washing.
examples:
- The sailor pushed a wet swab across the ship's deck to clean it.
- She rinsed the swab after washing the floor.
