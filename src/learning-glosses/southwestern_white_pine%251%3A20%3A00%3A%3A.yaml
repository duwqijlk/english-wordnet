simpleMeaning: Its bark grows dark brown and cut with deep lines as it ages, on this tree of middle size
  in northwestern Mexico.
scope: Of the pines of northwestern Mexico, this one is of middle size, with bark that grows dark brown
  and cut with deep lines as it ages.
examples:
- The southwestern white pine is a tree of middle size in northwestern Mexico.
- As the southwestern white pine ages, its bark grows dark brown and cut with deep lines.
