simpleMeaning: 'Bears and people are of this kind: they walk with the whole flat underside of the foot
  on the ground.'
scope: Plantigrade mammal is another name for this kind of animal, which walks with the whole flat underside
  of its foot on the ground, not only on its toes.
examples:
- Bears are plantigrade.
- People are plantigrade, walking on the whole sole of the foot.
