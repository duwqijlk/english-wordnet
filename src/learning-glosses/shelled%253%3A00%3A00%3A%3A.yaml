simpleMeaning: describing animals or fruits that have a hard outer covering
scope: This says an animal or fruit has a hard outer covering; it does not mean the covering has been
  taken off.
examples:
- The shelled snail moved slowly across the wet leaf.
- A coconut is a shelled fruit with a very hard outside.
