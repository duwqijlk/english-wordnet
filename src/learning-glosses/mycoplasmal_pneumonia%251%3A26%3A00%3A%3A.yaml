  bring on high fever and a cough.'
scope: Also called atypical pneumonia and primary atypical pneumonia, this sudden chest illness comes
  from tiny germs called mycoplasma and strikes children and young adults above all.
examples:
- Mycoplasmal pneumonia gave her a high fever and a cough that would not stop.
- Mycoplasmal pneumonia strikes children and young adults above all.
