simpleMeaning: The act of moving the ownership of a thing from one person to another.
scope: Also called a transfer, this is ownership passing to another person, not feelings moving from one
  person to another, and not a thing changing its form.
examples:
- The transference of the house took weeks to complete.
- Transference of the land was signed in March.
