simpleMeaning: a substance whose use is limited by law, most often taken by young people at dance parties
scope: It is a substance whose use is limited by law, most often taken by young people at dance parties,
  not a medicine a doctor gives for an illness and not a drink served at a bar.
examples:
- The police warned that a club drug was being sold at the party.
- He said a club drug had made the young people ill.
