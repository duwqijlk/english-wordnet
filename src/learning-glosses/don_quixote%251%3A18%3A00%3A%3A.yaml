simpleMeaning: A person with high hopes that cannot come true, like the hero of a book by Cervantes.
scope: A person whose high hopes cannot come true; not a person with a plan that works, and not the hero
  of the book himself.
examples:
- He is a real Don Quixote, always dreaming of things that cannot happen.
- She plays the Don Quixote in our office, full of hopes that go nowhere.
