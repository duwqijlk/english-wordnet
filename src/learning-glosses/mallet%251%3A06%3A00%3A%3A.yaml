simpleMeaning: a usually wooden-headed hammer for driving wedges, tamping paving stones, and pounding,
  flattening or smoothing material; its head is larger than a normal hammer's.
scope: The large, usually wooden-headed hammer, also called a beetle, not the light drumstick or the long-handled
  stick used in polo or croquet.
examples:
- The carpenter tapped the wedge with a mallet.
- A mallet works better than a metal hammer for settling paving stones.
