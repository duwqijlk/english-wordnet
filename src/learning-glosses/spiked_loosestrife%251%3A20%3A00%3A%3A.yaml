simpleMeaning: First from Europe, this plant of wet ground now spreads fast in the east of the United
  States, with a long bunch of purple flowers.
scope: Also called purple loosestrife, this plant of wet ground came first from Europe and now spreads
  fast in the east of the United States.
examples:
- In wet ground, spiked loosestrife shows a long bunch of purple flowers.
- In the east of the United States, spiked loosestrife now grows in wet ground.
