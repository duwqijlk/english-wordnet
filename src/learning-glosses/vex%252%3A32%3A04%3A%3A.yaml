synsetId: 00814544-v
simpleMeaning: to go over a question again and again, talking and thinking about it for a long time
scope: To keep a question under long, careful thought and talk, not to annoy someone and not to make someone
  worry.
examples:
- The committee vexed the subject of the death penalty for weeks.
- They vexed the question of the new tax until every side had been heard.
