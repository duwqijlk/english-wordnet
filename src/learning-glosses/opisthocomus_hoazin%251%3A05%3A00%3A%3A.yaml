simpleMeaning: A South American bird with a crest and a bad smell, whose young have claws on the first
  and second digits of the wings.
scope: Also called hoactzin, hoatzin and stinkbird; it is the crested bad-smelling South American bird
  whose young have claws on the first and second digits of the wings.
examples:
- An Opisthocomus hoazin called from the tree above the river.
- The young Opisthocomus hoazin gripped the branch with the claws on its wings.
