senseId: 'tranylcypromine%1:06:00::'
synsetId: 04481552-n
simpleMeaning: A drug that lifts low mood by stopping a body chemical from breaking down the chemicals
  that set mood; it is given as a sulphur salt
scope: A drug that lifts low mood by blocking a body chemical, not a drug that calms nerves and not a
  drug that helps sleep.
examples:
- The doctor prescribed tranylcypromine for her severe depression.
- Tranylcypromine can lift mood but needs care with food and other drugs.
