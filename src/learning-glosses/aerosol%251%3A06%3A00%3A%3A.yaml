simpleMeaning: a container that holds something under pressure and can let it out as a fine spray, usually
  pushed out by a gas inside
scope: 'Also called aerosol bomb, aerosol can and aerosol container: this is the container that sprays,
  not a cloud of tiny drops or bits in a gas.'
examples:
- She sprayed paint from an aerosol onto the metal gate.
- Keep the aerosol away from heat, because what is inside is under pressure.
