simpleMeaning: a large four-legged animal with solid hooves that eats plants, kept by humans since prehistoric
  times.
scope: This is the animal itself, not the padded gymnastics equipment and not the verb meaning to supply
  a place with horses.
examples:
- She rode her horse along the beach at sunrise.
- The horse grazed quietly in the field.
