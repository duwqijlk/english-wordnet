simpleMeaning: to make someone stop talking and stop making noise
scope: This sense is about making someone else stop talking or making noise. It is not about becoming
  still and silent yourself.
examples:
- The teacher tried to quieten the class before the test.
- Please quieten the children so we can hear the music.
