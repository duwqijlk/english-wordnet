senseId: 'nonconformist%3:00:00::'
synsetId: 00612640-a
simpleMeaning: Not following some rule or way of behaving or thinking that most people accept.
scope: Not following some accepted rule or way of behaving or thinking; not a person who refuses to follow
  accepted standards of conduct, and not the sense of not following set customs or beliefs, especially
  in religion.
examples:
- Their dress was nonconformist, and the neighbours talked about it.
- Her thinking was nonconformist from the start.
