senseId: 'thimbleful%1:23:00::'
synsetId: 13792969-n
simpleMeaning: a very small amount, as much as a small sewing cap for a finger will hold
scope: Another name for this amount is thimble. This sense is about how much fits in that small cap, not
  about sewing with the cap itself.
examples:
- She added a thimbleful of salt to the soup.
- He drank a thimbleful of the strong medicine and stopped.
