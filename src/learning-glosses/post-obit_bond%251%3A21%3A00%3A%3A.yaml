simpleMeaning: a written promise to pay back money borrowed by a person who will get land or money later,
  paid from what that person later gets
scope: This is a promise to pay a loan from money or land a person will get later, not a promise to pay
  now and not a will that gives land away.
examples:
- He signed a post-obit bond to borrow money against the land he would one day get.
- The post-obit bond said the loan would be paid from his later share of the land.
