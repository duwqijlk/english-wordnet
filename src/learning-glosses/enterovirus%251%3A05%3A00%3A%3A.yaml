simpleMeaning: Any of a group of tiny germs that attack the gut and can spread to other parts, above all
  the nerves.
scope: Any of a group of tiny germs that attack the gut and can spread to other parts, above all the nerves,
  not a germ that stays in the gut and not a germ that only attacks the skin.
examples:
- The enterovirus spread from his gut to his nerves.
- Enteroviruses often start in the gut.
