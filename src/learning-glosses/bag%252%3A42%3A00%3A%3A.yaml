simpleMeaning: to swell or stick out in a rounded way, especially because something is so full that it
  pushes outward.
scope: This is about swelling outward because of fullness, not about hanging loosely like an empty container.
examples:
- His trouser pockets bagged with the weight of his keys.
- The filled sack bagged at the bottom.
