simpleMeaning: work done with a serious mind and with care, to reach a goal or finish a task
scope: 'Also called try, effort, attempt, and endeavor: the serious, careful work done to reach a goal.
  Not a planned job or project taken as one whole thing, especially one that needs much work or courage.'
examples:
- Learning the violin was a hard endeavour, but she kept at it each day.
- His endeavour to build the school took years of careful work.
