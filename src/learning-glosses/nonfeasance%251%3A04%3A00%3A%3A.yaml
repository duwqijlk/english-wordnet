schema: oewn-learning-gloss-v2
senseId: 'nonfeasance%1:04:00::'
synsetId: 00740376-n
simpleMeaning: A failure to act when under a duty to do so, or a refusal, with no good excuse, to do what
  the law requires.
scope: This is failing to act when you must, not acting badly and not doing wrong on purpose.
examples:
- The official was charged with nonfeasance for ignoring the complaint.
- Nonfeasance by the board left the safety rules unenforced.
