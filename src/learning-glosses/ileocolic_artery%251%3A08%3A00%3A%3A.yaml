simpleMeaning: A branch of the superior mesenteric artery that supplies the end of the small intestine,
  the pouch where the large intestine begins, the appendix and the ascending colon.
scope: Another name for the arteria ileocolica, the vessel that feeds the end of the small intestine,
  cecum, appendix and ascending colon; not the superior mesenteric artery it branches from, and not the
  right colic artery.
examples:
- The ileocolic artery was clamped during the operation.
- The ileocolic artery supplies the cecum and the first part of the colon.
