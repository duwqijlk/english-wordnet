senseId: 'affricate%1:10:00::'
synsetId: 07133698-n
simpleMeaning: A speech sound like the 'ch' in 'chair' or the 'j' in 'joy', made by first stopping the
  air and then letting it hiss out at the same place.
scope: This sound is also called affricate consonant and affricative; it joins a stop and a hiss into
  one sound, so it is not a stop on its own and not a hiss on its own.
examples:
- The affricate at the start of 'chair' joins a stop and a hiss in one sound.
- In 'joy', the affricate begins with the tongue blocking the air, then lets it hiss out.
