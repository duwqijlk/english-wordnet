senseId: 'deductible%1:21:00::'
synsetId: 13294573-n
simpleMeaning: In taxes, an amount that can be taken off what you earned, especially to work out the income
  tax you must pay
scope: 'This is the tax sense: an amount taken off what you earned before your tax is worked out. It is
  not the first part of a loss that you must pay yourself under an insurance plan, and not the adjective
  for something that can be taken off.'
examples:
- Travel costs for work count as a deductible when she fills in her tax form.
- He claimed the new tools as a deductible and so paid less income tax.
