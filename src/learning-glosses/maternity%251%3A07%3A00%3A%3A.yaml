simpleMeaning: the loving care and warmth that a mother shows, or that suits a mother
scope: The loving care and warmth of a mother, not being pregnant and not the tie between mother and child.
examples:
- Her maternity showed in the gentle way she held the child.
- The nurse's maternity comforted the young patients.
