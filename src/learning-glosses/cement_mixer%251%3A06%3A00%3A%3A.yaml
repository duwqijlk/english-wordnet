simpleMeaning: 'A machine for making concrete: a big drum turns round and round, mixing the grey powder
  used in concrete with other stuff.'
scope: A machine with a turning drum for mixing concrete, not a hand tool and not a truck that carries
  concrete; concrete mixer is another name for this sense.
examples:
- The builder hired a cement mixer for the day.
- Sand and water went into the cement mixer with the grey powder.
