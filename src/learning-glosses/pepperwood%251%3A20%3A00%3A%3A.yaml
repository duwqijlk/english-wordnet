simpleMeaning: Giving hard tough timber, it is a tree of the Pacific coast with sweet-smelling leaves
  and small flowers in umbrella-shaped bunches, followed by fruit like small olives.
scope: Also called mountain laurel, sassafras laurel and spice tree, it is the tree of the Pacific coast
  with sweet-smelling leaves, small flowers in umbrella-shaped bunches and fruit like small olives, giving
  hard tough timber.
examples:
- The pepperwood grew along the Pacific coast.
- The pepperwood bore fruit like small olives.
