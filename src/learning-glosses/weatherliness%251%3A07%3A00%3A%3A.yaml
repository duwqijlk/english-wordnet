simpleMeaning: Of a sailing ship, the power to sail close against the wind with little sideways drift,
  even in a strong wind.
scope: Of a sailing ship, the power to sail close against the wind; not speed and not the size of the
  ship.
examples:
- The Spanish ships had better speed and weatherliness than ours.
- Her weatherliness let her hold her course in the stiff wind.
