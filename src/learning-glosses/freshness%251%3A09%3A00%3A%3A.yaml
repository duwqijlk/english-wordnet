senseId: 'freshness%1:09:00::'
synsetId: 05642900-n
simpleMeaning: The new and surprising feel of something that has not been seen before.
scope: This is the new and surprising feel of something; novelty is another name for this sense, not the
  newness of food or rude boldness.
examples:
- The freshness of her first poems won her many readers.
- His jokes had a freshness that made the old stories feel new.
