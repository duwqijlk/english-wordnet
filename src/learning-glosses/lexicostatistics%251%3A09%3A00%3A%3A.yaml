simpleMeaning: a way of counting words, used in the study of language change over time, to work out how
  long ago different languages split from one shared language
scope: A way of counting words, used in the study of language change over time, to work out how long ago
  different languages split from one shared language, not a way of counting words in one text and not
  a history of one language.
examples:
- Lexicostatistics helps work out when two languages split apart.
- By lexicostatistics, the two languages shared one source long ago.
