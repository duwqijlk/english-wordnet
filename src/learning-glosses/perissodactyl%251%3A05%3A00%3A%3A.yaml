simpleMeaning: Animals whose young grow inside the mother and that have hard feet with an odd number of
  toes on each foot.
scope: Animals whose young grow inside the mother, with hard feet and an odd number of toes on each foot,
  also called an odd-toed ungulate and a perissodactyl mammal, not animals with soft feet and not animals
  with an even number of toes.
examples:
- The horse is a perissodactyl with one toe on each foot.
- A perissodactyl walks on hard feet with an odd count of toes.
