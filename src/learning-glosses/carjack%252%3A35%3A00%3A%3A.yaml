simpleMeaning: to use force to make a person give you their car, usually so that you can steal it
scope: Taking a car by force, usually to steal it; not stealing a car when no one is in it, and not the
  noun name for the act.
examples:
- Two men carjacked a driver at a red light.
- He tried to carjack her car outside the shop.
