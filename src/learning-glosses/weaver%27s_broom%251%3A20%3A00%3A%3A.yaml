simpleMeaning: A tall thornless shrub with pale yellow flowers and thin, flexible twigs used for basketry;
  native to southwestern Europe and the Mediterranean, it now grows wild in California.
scope: This is the southern European shrub grown for basketry twigs, not a sweeping broom or the spiny
  broom shrubs of dry hillsides.
examples:
- Weaver's broom has flexible twigs that basket makers use.
- In California, weaver's broom now grows wild.
