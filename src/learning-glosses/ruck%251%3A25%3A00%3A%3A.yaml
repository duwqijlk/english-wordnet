simpleMeaning: an uneven fold in a surface that is flat in other places, such as in cloth
scope: Also called pucker. This is a fold in a flat surface, not a crowd of common people or things.
examples:
- There was a ruck in the cloth where it had been pulled tight.
- She smoothed out the ruck in the sheet before making the bed.
