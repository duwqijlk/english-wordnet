simpleMeaning: Of eastern North America, this small shrub or tree has thorny branches and pale yellow
  flowers, and it gives off a sweet smell and loses its leaves in winter.
scope: Also called toothache tree, it is a small sweet-smelling shrub or tree with thorny branches and
  pale yellow flowers from eastern North America.
examples:
- The sea ash lost its leaves in winter.
- We smelled the sweet flowers of the sea ash.
