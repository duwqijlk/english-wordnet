senseId: 'pettifogger%1:18:01::'
synsetId: 10520788-n
simpleMeaning: a person who argues over tiny points, raising small objections that annoy others
scope: A person who argues over tiny points; caviler, caviller and quibbler are other names for this sense,
  not a person who argues a strong case and not a lawyer who wins by skill.
examples:
- The pettifogger held up the meeting with small objections to every word.
- No one liked arguing with the pettifogger, who quibbled over each tiny point.
