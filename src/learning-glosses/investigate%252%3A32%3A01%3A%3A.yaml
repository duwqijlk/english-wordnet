simpleMeaning: to ask questions and look closely into something to find out what happened or what is true
scope: Also called inquire, this is looking into a crime, a missing person, or a report to find the facts,
  not studying a subject with the ways of science.
examples:
- Police are investigating the disappearance of the rich old lady.
- The office investigated reports of possible wrongdoing in the accounts.
