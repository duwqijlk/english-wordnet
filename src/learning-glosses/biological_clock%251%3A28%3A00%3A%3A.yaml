simpleMeaning: many body tasks in living things run in a set round again and again, fixed by a timing
  built into them
scope: This is the timing built into living things, which sets the round of their body tasks.
examples:
- Her biological clock keeps her body to the same times each day.
- The biological clock of the mice set their feeding times.
