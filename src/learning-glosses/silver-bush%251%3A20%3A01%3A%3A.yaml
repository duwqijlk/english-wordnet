scope: A North American woody plant that loses its leaves in fall, has no thorns, and bears pale grey
  leaves and fruit, also called silver berry, silverberry, or silverbush; not a hairy European woody plant
  with evergreen leaves and pale yellow flowers.
examples:
- A silver-bush grew by the road in the plains.
- The silver-bush had pale grey leaves and small fruit.
