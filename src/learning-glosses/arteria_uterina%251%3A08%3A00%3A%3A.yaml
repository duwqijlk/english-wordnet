simpleMeaning: The womb and the top of the birth canal get their blood from this tube, which leaves the
  inner hip tube.
scope: Also called uterine artery, it is the inner hip tube's branch that feeds the womb and the top of
  the birth canal.
examples:
- The arteria uterina carries blood to the womb.
- Blood reached the womb through the arteria uterina.
