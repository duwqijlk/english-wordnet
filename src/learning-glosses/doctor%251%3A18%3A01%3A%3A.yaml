simpleMeaning: A person who has earned the highest university degree in a subject.
scope: This is not the sense for a medical professional; it is the academic title for someone with the
  highest university degree.
examples:
- She is a doctor of history at the university.
- The speaker, a doctor of physics, explained the experiment.
