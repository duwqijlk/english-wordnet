simpleMeaning: a very hard dry cake made without salt, once the main food kept on board when at sea
scope: A very hard dry cake once kept as the main food on board when at sea, also called hardtack, pilot
  biscuit, pilot bread and sea biscuit; not a soft fresh loaf and not a sweet cake.
examples:
- The crew ate ship biscuit with salt pork on the long voyage.
- A barrel of ship biscuit stood in the hold of the old sailing vessel.
