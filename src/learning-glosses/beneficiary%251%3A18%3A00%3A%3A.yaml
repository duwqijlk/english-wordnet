simpleMeaning: a person who gets money or other good things that are given to them
scope: This is a person who gets money or other help. Not the use in grammar for the person an action
  is done for, and not the adjective about a church post.
examples:
- She named her son as the beneficiary of her savings.
- Each beneficiary received a share of the money.
