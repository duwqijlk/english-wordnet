simpleMeaning: In Christianity, the Roman Catholic teaching that God kept the Virgin Mary free from any
  mark of first sin from the very start of her life in the womb.
scope: 'Also called Immaculate Conception of the Virgin Mary: in Christianity, the Roman Catholic teaching
  that God kept the Virgin Mary free from any mark of first sin from the very start of her life in the
  womb; this is the teaching, not the holy day of the same name.'
examples:
- The Immaculate Conception is a Roman Catholic teaching about the Virgin Mary.
- The Immaculate Conception teaches that Mary was kept free from first sin from the very start of her
  life.
