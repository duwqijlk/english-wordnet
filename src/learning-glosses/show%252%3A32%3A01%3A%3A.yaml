simpleMeaning: To point out or make clear a place, direction, person or thing, either in physical space
  or in a figurative way.
scope: This is not giving a display or performance and not giving a measurement on a dial; it is about
  pointing out or making clear what or where something is.
examples:
- Let me show you the way to the station.
- The guide showed us where the path begins.
