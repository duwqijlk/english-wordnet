simpleMeaning: able to be made new again, or able to have a new one put in its place
scope: About a thing or supply that can be made new or have a new one put in its place, not about an agreement
  or time that can be made longer.
examples:
- Solar power is a renewable source of energy because the sun keeps shining.
- They chose renewable wood that grows back after it is cut.
