simpleMeaning: The main hollow part of the ear, between the eardrum and the part of the ear that lies
  deeper inside
scope: This is the main hollow part of the ear; middle ear and tympanic cavity are other names for this
  sense, and it is not the drum-like musical instrument or the inner ear.
examples:
- The tympanum lies between the eardrum and the inner ear.
- Doctors check the tympanum when a child has an ear infection.
