simpleMeaning: a person who makes loud breathing sounds through the nose and mouth while asleep
scope: A person who makes loud breathing sounds while asleep; not just any person who sleeps, and not
  a loud breathing sound made while awake.
examples:
- My brother is a loud snorer, so no one wants to share a room with him.
- The snorer kept the whole train car awake.
