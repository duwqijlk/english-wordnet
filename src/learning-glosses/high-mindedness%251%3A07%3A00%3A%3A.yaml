simpleMeaning: holding to noble ideals and acting by them; the belief that ideals are worth working for
scope: This is living by noble ideals; idealism and noble-mindedness are other names for this sense, not
  pride and not daydreaming.
examples:
- His high-mindedness kept him honest when others cut corners.
- Her high-mindedness showed in a life spent helping the poor.
