simpleMeaning: a drink made by mixing strong alcohol, especially whiskey or gin, with lemon or lime juice
  and sugar
scope: No partner name for this sense; this is a drink, not the sharp taste of lemon or vinegar and not
  a smell of old food going bad.
examples:
- He ordered a whiskey sour at the bar.
- She mixed a gin sour with fresh lime juice and sugar.
