simpleMeaning: A hand tool for writing with a small toothed wheel that cuts tiny holes in a thin sheet
  used to make copies.
scope: This is the hand tool that cuts holes in a stencil, not the act of printing with it or an ordinary
  pen.
examples:
- She used a cyclostyle to cut the words into the stencil.
- The old cyclostyle in the drawer still has its small toothed wheel.
