simpleMeaning: To do with bodily acts that happen beyond the will.
scope: This sense is to do with bodily acts that happen beyond the will, unlike the sense for breeding
  done by means that need no mate, unlike the sense for a dull, passive sort of activity, and unlike the
  sense for what is made of plants.
examples:
- The functions were vegetative, beyond the will.
- Breathing is vegetative, happening without thought.
