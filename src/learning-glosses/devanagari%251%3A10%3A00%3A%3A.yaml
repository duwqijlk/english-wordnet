simpleMeaning: A writing system in which each sign stands for a syllable, used for Sanskrit and Hindi
scope: This is a writing system for Sanskrit and Hindi in which each sign stands for a syllable; Devanagari
  script, Nagari and Nagari script are other names for it, and it is not a system in which each sign stands
  for a single sound.
examples:
- Sanskrit is often written in Devanagari.
- She learned to read Devanagari as a child.
