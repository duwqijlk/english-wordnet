simpleMeaning: A warm brown pigment made in part from iron oxide, often used in paints and make-up
scope: This names the colouring matter itself, not the colour it gives or the earth used as body paint;
  near rivals are the colour sense of the same name and the earth used as body paint.
examples:
- The artist mixed Indian red into her paint, a brown pigment made in part from iron oxide.
- Indian red is often used in paints and cosmetics for its warm brown tone.
