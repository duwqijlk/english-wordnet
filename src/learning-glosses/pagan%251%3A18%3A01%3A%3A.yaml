simpleMeaning: A person who follows a faith with many gods, or a faith from before the Christian faith,
  and who is not a Christian, a Muslim or a Jew
scope: This sense is a person who follows a faith with many gods, or a faith from before the Christian
  faith. Not a person who lives only for bodily pleasure, and not the sense for a person who does not
  accept the God of Christians, Jews and Muslims.
examples:
- The pagans built a small temple to their many gods.
- As a pagan, he held a feast for the sun god each spring.
