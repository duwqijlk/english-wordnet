simpleMeaning: A flat stem that looks and works like a leaf.
scope: A flat stem that looks and works like a leaf, also called cladophyll, phylloclad and phylloclade;
  not a true leaf and not a round stem.
examples:
- The cladode of the cactus does the work of a leaf.
- This plant has a broad green cladode instead of leaves.
