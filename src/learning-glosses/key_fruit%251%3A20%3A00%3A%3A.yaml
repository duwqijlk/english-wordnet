simpleMeaning: Most times one seed sits inside a fruit that will not split open, held by a wing-like part,
  as in ash, elm, or maple.
scope: Also called a key and a samara, this is a fruit with one seed inside that stays shut, borne on
  ash, elm, or maple trees.
examples:
- The key fruit of the maple holds one seed.
- We picked up a key fruit from the elm.
