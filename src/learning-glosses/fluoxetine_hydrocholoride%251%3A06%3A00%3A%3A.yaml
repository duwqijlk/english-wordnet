simpleMeaning: a drug sold as Prozac or Sarafem, often given to lift low mood; it is thought to work by
  making serotonin, a brain chemical, work harder
scope: A drug given to lift low mood, also called fluoxetine, not a drug that puts a person to sleep.
examples:
- Fluoxetine hydrocholoride is the full name of the drug sold as Prozac.
- The doctor changed her to fluoxetine hydrocholoride after the first drug failed.
