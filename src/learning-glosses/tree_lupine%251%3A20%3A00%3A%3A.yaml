simpleMeaning: Showy blooms in yellow or blue grow on a bush of the Pacific coast of the United States
  that keeps its leaves all year and now grows wild in Australia.
scope: One of the shrubs of the Pacific coast of the United States that keep their leaves all year, it
  now grows wild in Australia.
examples:
- The tree lupine by the fence keeps its leaves through the winter.
- Yellow blooms mark the tree lupine along the coast path.
