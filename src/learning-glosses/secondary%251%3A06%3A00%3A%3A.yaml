simpleMeaning: a coil of wire in which a flow of electric power starts when power is sent through a first
  coil
scope: In electricity, a coil in which power starts when power runs through a first coil, not the main
  coil and not something of second rank or importance.
examples:
- The secondary coil picked up power from the first coil.
- A break in the secondary stopped the machine.
