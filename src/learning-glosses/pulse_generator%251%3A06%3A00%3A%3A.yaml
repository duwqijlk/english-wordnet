simpleMeaning: A machine that makes one or more short bursts of power, and can usually be set to change
  how often the bursts come
scope: A machine that makes short bursts of power, not one that makes a steady flow of power and not a
  clock that keeps time.
examples:
- The engineer used a pulse generator to test the circuit.
- She set the pulse generator to send one burst each second.
