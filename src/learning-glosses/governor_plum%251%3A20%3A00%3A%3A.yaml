simpleMeaning: a small tree from Madagascar that grows like a shrub, planted in warm lands as a hedge
  and for its small deep red sour fruit with a stone inside
scope: Also called batoko palm, governor's plum, and ramontchi; a small tree from Madagascar grown as
  a hedge and for its sour red fruit, not a plum tree and not another hedge plant.
examples:
- A row of governor plum forms a thick hedge around the garden.
- She picked the deep red fruit from the governor plum and tasted its sour flesh.
