simpleMeaning: Fairly big gnawing animals with sharp stiff hairs that can stand up, mixed in with their
  fur
scope: Fairly big gnawing animals with stiff hairs in their fur, not the small spiny Old World animal
  of the same name.
examples:
- The hedgehog raised its stiff hairs when the dog came near.
- The big hedgehog gnawed at a fallen log in the yard.
