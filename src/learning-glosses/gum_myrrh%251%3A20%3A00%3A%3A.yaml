simpleMeaning: A sweet-smelling sticky stuff that is burned as incense and used in perfume.
scope: A sweet-smelling sticky stuff burned as incense and used in perfume; myrrh is another name for
  it, not the sweet-smelling sticky stuff from trees of the Burseraceae family and not the sticky stuff
  used to thicken food.
examples:
- She burned gum myrrh as incense in the room.
- The maker put gum myrrh in the perfume for its sweet smell.
