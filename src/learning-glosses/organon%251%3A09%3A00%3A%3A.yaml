simpleMeaning: A set of rules for finding out things in thought or in science; a tool for getting knowledge
scope: A set of rules for seeking knowledge, not a theory of life and not a way of eastern lands.
examples:
- Aristotle's organon set out the rules of right thought.
- The organon gave the students a tool for seeking truth.
