simpleMeaning: a place to sleep for the night that travellers pay for
scope: Also called an inn, and also called a lodge; a place to sleep for the night that travellers pay
  for, not cheap supervised lodging for young people on trips.
examples:
- We spent the night in a small hostel near the station.
- The hostel was full of travellers stopping for the night.
