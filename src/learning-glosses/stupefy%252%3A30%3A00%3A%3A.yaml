simpleMeaning: to make a person unable to feel or think, or dizzy, by a hit or as if by a hit
scope: Also called stun, this is making a person unable to think clearly or dizzy as if hit, not making
  them dull or confused by drink or strong love.
examples:
- The hard fall stupefied him, and he could not think clearly for a minute.
- She was stupefied by the blow and felt dizzy.
