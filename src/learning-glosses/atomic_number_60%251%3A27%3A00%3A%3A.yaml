simpleMeaning: A yellow metal that joins with three other atoms, one of the rare earth group; found in
  monazite and bastnasite with cerium, lanthanum and praseodymium.
scope: A yellow metal of the rare earth group, also called Nd and neodymium; set apart from other yellow
  metals and from other metals of the rare earth group.
examples:
- Atomic number 60 is found with cerium and lanthanum.
- Monazite holds atomic number 60 along with praseodymium.
