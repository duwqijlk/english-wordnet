simpleMeaning: a person who gives formal rules and book learning more attention than they are worth
scope: 'Scholastic and pedant are other names for this sense: a person who gives formal rules and book
  learning more attention than they are worth. Not just a person who loves reading books.'
examples:
- The bookworm in the office would not bend a single small rule, even when common sense said to.
- He is such a bookworm that he follows every rule in the book, even when it clearly does not fit the
  case.
