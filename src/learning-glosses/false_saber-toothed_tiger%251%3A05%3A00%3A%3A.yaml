simpleMeaning: a North American wild cat of long ago, from the Miocene and Pliocene times, much earlier
  and less specialised than the cats of the genus Smiledon
scope: This is an early North American wild cat; not a later saber-toothed cat and not a living wild cat.
examples:
- The false saber-toothed tiger lived long before the later saber-toothed cats.
- Fossils of the false saber-toothed tiger come from North America.
