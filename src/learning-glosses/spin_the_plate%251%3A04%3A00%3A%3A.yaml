senseId: 'spin_the_plate%1:04:00::'
synsetId: 00488628-n
simpleMeaning: In a game, when a player's name is called, that player must catch a round dish turning
  on its edge before it falls, or pay a fine
scope: A game where a round dish is spun on its edge and a player's name is called; spin the platter is
  another name for this sense, not a board game and not a game with cards.
examples:
- The children played spin the plate, calling out a name as the dish spun.
- In spin the plate the named player must catch the dish before it falls.
