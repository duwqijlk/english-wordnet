simpleMeaning: A part of a stream where the water is not deep, so you can walk over it
scope: A shallow part of a stream you can walk over, not a marked way over a road and not a place where
  two roads meet.
examples:
- The walkers used the crossing to get over the stream.
- After the rain the crossing was too deep to walk over.
