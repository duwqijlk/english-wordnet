simpleMeaning: a person with no fixed home who keeps moving from place to place
scope: A person with no settled home who moves from place to place, also called roamer and rover; not
  the computer program of the same name that searches the internet for things to add to a list.
examples:
- The wanderer slept in a different town every night.
- After losing her home, she lived as a wanderer for years.
