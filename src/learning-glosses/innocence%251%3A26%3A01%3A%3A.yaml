simpleMeaning: being free from sin or wrong, and not knowing about evil
scope: 'Also called whiteness and purity: the state of being free from wrong and unknowing of evil, not
  the simple lack of worldly knowledge and not freedom from a named crime.'
examples:
- Her innocence showed in a life lived without doing wrong.
- The priest praised her innocence, untouched by sin.
