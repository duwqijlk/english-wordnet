simpleMeaning: A fast-growing climber from eastern Asia with purple flowers and long hairy seed pods,
  grown as animal feed and for root starch, now common across the southern United States.
scope: This names the whole plant, the same plant called kudzu; it is not the starch from its roots, and
  not the pods by themselves.
examples:
- The kudzu vine climbs over trees and fences, smothering whatever stands in its way.
- She pulled a kudzu vine off the wall and found long, hairy pods hanging from it.
