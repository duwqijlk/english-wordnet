simpleMeaning: A sudden fast start or stop, as in a car crash, harms the neck and the bones in the spine.
scope: Also called whiplash, it is harm to the neck and the bones in the spine caused by a sudden fast
  start or stop, as in a car crash.
examples:
- His whiplash injury came from the sudden stop in the car crash.
- After the crash, the doctor treated her whiplash injury.
