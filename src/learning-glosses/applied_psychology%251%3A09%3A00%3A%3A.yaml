simpleMeaning: The parts of the study of the mind whose findings are put to use on real problems of schools,
  of business, of selling, and the like.
scope: It is also called industrial psychology, and it names the parts of the study of the mind whose
  findings are put to use on real problems of schools, of business, of selling, and the like.
examples:
- She studied applied psychology to help schools solve learning problems.
- His work in applied psychology helped the firm sell its goods.
