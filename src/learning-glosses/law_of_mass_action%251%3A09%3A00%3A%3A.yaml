simpleMeaning: In chemistry, the more of each thing that takes part is in the mix, the faster the stuff
  changes.
scope: In chemistry, this rule links how fast a change goes to how much of each thing that takes part
  is present.
examples:
- The law of mass action tells us that adding more of a starting stuff speeds the change.
- By the law of mass action, the change ran twice as fast when the mix was twice as strong.
