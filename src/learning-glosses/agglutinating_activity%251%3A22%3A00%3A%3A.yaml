simpleMeaning: small bits floating in a liquid joining into bigger lumps, which then mostly sink to the
  bottom
scope: Small bits floating in a liquid joining into bigger lumps that then mostly sink; agglutination
  is another name for this, not bits dissolving and not blood clotting.
examples:
- Agglutinating activity made the fine powder settle at the bottom.
- The test showed agglutinating activity in the liquid.
