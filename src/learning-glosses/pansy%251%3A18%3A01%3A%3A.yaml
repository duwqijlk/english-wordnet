simpleMeaning: A man or boy who is shy and easily scared, and thought of as childish and not able to speak
  up for himself
scope: A word used to call a man or boy shy, childish and not able to speak up for himself; not the flower.
examples:
- They called him a pansy when he would not climb the tree.
- The other boys called him a pansy because he would not stand up for himself.
