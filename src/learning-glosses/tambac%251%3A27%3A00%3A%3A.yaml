senseId: 'tambac%1:27:00::'
synsetId: 15100258-n
simpleMeaning: A cheap stand-in for gold in jewellery, made from copper and zinc, at times with arsenic,
  and used to coat things in gold.
scope: This is an alloy made to look like gold, also called tombac and tombak, not gold itself.
examples:
- The brooch was made of tambac, not gold.
- The frame was gilded with tambac.
