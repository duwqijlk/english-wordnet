simpleMeaning: a person who breathes with a loud noise, as when the nose is blocked by mucus
scope: A person who breathes with a loud noise, as when the nose is blocked by mucus; not a person who
  snores and not a person who breathes hard after running.
examples:
- The snuffler in the next seat breathed noisily through the whole film.
- He sounded like a snuffler with his nose blocked by a cold.
