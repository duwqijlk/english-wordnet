simpleMeaning: showing good manners and respect in the way you speak and behave towards others
scope: This is not the fussy, hard-to-please sense; it is about good manners towards other people.
examples:
- It was nice of you to walk the old man to the door.
- The receptionist was nice to everyone, even the people who shouted at her.
