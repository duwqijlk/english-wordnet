simpleMeaning: rain that carries acids formed in the air when gases from factories and works mix with
  water, above all sulfur dioxide and nitrogen oxides
scope: 'Also called acid precipitation: rain carrying acids from the air, not ordinary rain and not snow
  or hail.'
examples:
- Acid rain has stripped the paint from the old roof.
- The acid rain in this valley falls after the wind brings gases from the mills.
