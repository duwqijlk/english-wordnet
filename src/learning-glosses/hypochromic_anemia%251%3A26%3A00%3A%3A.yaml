simpleMeaning: a blood condition in which each red blood cell holds too little of the red matter that
  carries oxygen
scope: A blood condition in which each red cell holds too little of the red matter that carries oxygen;
  hypochromic anaemia is another name for this sense, not a lack of red cells and not a short-term loss
  of blood.
examples:
- His hypochromic anemia was found in a blood test.
- Hypochromic anemia made her feel weak for weeks.
