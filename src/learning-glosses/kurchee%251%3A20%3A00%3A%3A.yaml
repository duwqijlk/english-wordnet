simpleMeaning: the bark of this warm Asian tree with hard white wood was once used to cure two gut sicknesses,
  one with bloody stools and one with loose watery stools
scope: Also called conessi, ivory tree, and kurchi, this is a tree of warm Asia with hard white wood whose
  bark was once used against dysentery and diarrhea.
examples:
- People once stripped bark from the kurchee for medicine.
- The kurchee's bark was once gathered for its healing power.
