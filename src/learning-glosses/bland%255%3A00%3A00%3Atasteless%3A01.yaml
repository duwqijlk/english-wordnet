simpleMeaning: with no taste in it at all, nothing sharp or strong to notice
scope: 'Also called flat: food or drink with no taste in it, not the smooth and polite kind of person
  and not something dull and boring.'
examples:
- The soup was so bland that we added salt and pepper.
- A bland diet of plain rice and boiled potatoes bored him.
