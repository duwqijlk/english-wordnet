simpleMeaning: suffering from or showing anxious unease, trouble, or grief.
scope: A broad state of anxious unease, trouble, or grief — upset and distressed are other names for it
  — not the narrower dread of possible misfortune or danger in the other worried sense.
examples:
- The worried parents waited outside the hospital.
- She gave one last worried glance at the sleeping child.
