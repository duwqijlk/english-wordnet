simpleMeaning: any of many fishes found in the waters of America and Europe
scope: Any of many fishes of America and Europe, not any spiny-finned fish of the wider groups, not the
  narrower fresh-water food fish, and not a branch for resting on.
examples:
- Perch live in the lakes of America and Europe.
- This perch came from a lake in Europe.
