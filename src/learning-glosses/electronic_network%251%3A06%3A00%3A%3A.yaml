simpleMeaning: In the study of electric circuits, a set of linked parts or circuits that work together.
scope: In the study of electric circuits, a set of linked parts, also called a network; not a single part
  and not a power line.
examples:
- The electronic network linked all the sensors in the building.
- A fault in one part can shut down the whole electronic network.
