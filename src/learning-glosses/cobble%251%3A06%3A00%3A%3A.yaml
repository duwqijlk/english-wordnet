simpleMeaning: 'One of the paving stones once used to make roads: a block with four sides that run straight
  and a top that bends upward.'
scope: 'Also called a sett, and also a cobblestone: one of the paving stones once used to make roads,
  a block with four sides that run straight and a top that bends upward, not the act of paving with such
  stones.'
examples:
- A loose cobble tripped the old man.
- The yard was laid with smooth cobbles.
