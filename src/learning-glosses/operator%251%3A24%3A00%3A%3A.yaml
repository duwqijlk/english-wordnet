simpleMeaning: In mathematics, a symbol or function (a special rule for working out a value) that shows
  an action to do, such as adding or taking away
scope: In mathematics, a sign or rule that shows an action to do, not a person who runs a machine and
  not a clever person who gets around problems.
examples:
- The plus sign is an operator that tells you to add the numbers.
- In this sum, the operator shows you to take one number away from the other.
