simpleMeaning: A check of accounts that covers only part of the ground, for a short time or for certain
  accounts only
scope: A check of accounts that covers only part of the ground, not a full check of all the accounts and
  not a review that gives less assurance.
examples:
- The limited audit covered only the spring accounts.
- A limited audit was enough for the small firm.
