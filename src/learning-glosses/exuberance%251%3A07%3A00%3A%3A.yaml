simpleMeaning: a strong happy feeling full of energy, showing that you enjoy something a lot or think
  it is very good
scope: This is a strong happy feeling full of energy, also called enthusiasm; it is not a quiet or calm
  feeling.
examples:
- Her exuberance made the whole class smile on the first day.
- He spoke with exuberance about the new plan he liked so much.
