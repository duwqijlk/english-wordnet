simpleMeaning: Swelling of the inner ear, which can make a person feel dizzy and throw up.
scope: Swelling of the inner ear that can make a person feel dizzy and sick; labyrinthitis is another
  name for this sense, not swelling of the outer ear and not a cold.
examples:
- Otitis interna made her dizzy for days.
- He had otitis interna and felt sick each morning.
