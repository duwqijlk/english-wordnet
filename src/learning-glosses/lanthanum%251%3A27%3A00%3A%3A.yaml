simpleMeaning: A soft white metal that dulls quickly in air; it is found in rare earth minerals and is
  usually counted as a rare earth.
scope: A soft white metal that dulls quickly in air, also called La and atomic number 57; its near kin
  are the other rare earth metals.
examples:
- Lanthanum is a soft white metal.
- Lanthanum is found in rare earth minerals.
