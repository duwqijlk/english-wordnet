simpleMeaning: A stiff magnetic round plate set in place for good inside a drive unit.
scope: A stiff magnetic round plate set in place for good inside a drive unit; hard disc and hard disk
  are other names for this sense, not a bendy disk that can be taken out, and not a disk that spins in
  a case you carry.
examples:
- The fixed disk stores all the files inside the machine.
- A fixed disk stays in its drive unit for good.
