simpleMeaning: The hard bone inside an animal's tail, as against the hair that grows on it
scope: The bony part of an animal's tail, not the hair on it and not a platform for ships or trucks.
examples:
- The vet felt the dock of the horse's tail.
- He trimmed the hair round the dock of the dog's tail.
