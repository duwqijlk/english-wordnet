simpleMeaning: A dark, gloomy light when clouds cover the sky.
scope: The gloomy half-darkness under cloud cover, also called overcast; not the sky being covered by
  clouds, and not the mere quality of being cloudy.
examples:
- The cloudiness of the afternoon made the room hard to read in.
- Cloudiness settled over the town as the storm came in.
