simpleMeaning: Try to gain the goodwill or support of another person.
scope: This is about winning support or goodwill, not the romantic sense of making amorous advances; court
  is another name for this sense.
examples:
- The startup is trying to woo investors with promises of rapid growth.
- The charity wooed wealthy donors with a series of private dinners.
