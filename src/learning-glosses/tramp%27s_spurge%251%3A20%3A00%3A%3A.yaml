simpleMeaning: A common plant in the United States that lives for many years and has bright white leaves
  like petals
scope: A common long-lived plant in the United States with bright white leaves like petals; flowering
  spurge and wild spurge are other names for this sense. Not a garden flower and not a tree.
examples:
- Tramp's spurge grows along the roadside in summer.
- The tramp's spurge in the field had bright white leaves like petals.
