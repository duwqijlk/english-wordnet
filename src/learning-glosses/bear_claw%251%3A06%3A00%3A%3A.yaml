simpleMeaning: A cut-in pattern shaped like the curved nail on an animal's foot, used on pots made by
  Native Americans
scope: A cut-in pattern shaped like an animal's claw, used on Native American pots, not the pastry of
  the same name and not a real animal's claw.
examples:
- The potter cut a bear claw pattern around the rim of the bowl.
- This old bear claw design comes from Native American pottery.
