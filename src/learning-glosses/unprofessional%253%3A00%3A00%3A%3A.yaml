senseId: 'unprofessional%3:00:00::'
synsetId: 01876271-a
simpleMeaning: not fitting the way a person in a skilled paid job should act or do their work
scope: This word says that a person's act or work does not fit a skilled paid job. It is not the same
  as being new to a job, and not the same as work done for no pay.
examples:
- It was unprofessional of him to laugh at the sick man.
- Her unprofessional repairs broke down again in a week.
