simpleMeaning: With words that mean the opposite of what they say, in a hard and cruel way.
scope: With words that mean the opposite of what they say, in a hard and cruel way, also called black
  and grim; not a substance used in dyeing, and not a strong acid.
examples:
- His mordant wit left the room silent.
- She answered with mordant laughter at his fine plans.
