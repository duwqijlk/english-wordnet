simpleMeaning: a tiny hole on the edge or face of a leaf of a higher plant, a plant with tubes that carry
  water, that lets water seep out
scope: A tiny hole on a leaf that lets water seep out, not a hole that takes water in and not a hole in
  the stem.
examples:
- The hydathode on the tip of the leaf gave off a drop of water in the morning.
- Water seeped from the hydathodes along the edge of the leaf.
