simpleMeaning: A place set aside for firing weapons or driving objects through the air, such as bullets,
  arrows, or golf balls.
scope: This is a place for shooting or driving objects, not a set of different amounts or a kitchen stove.
examples:
- The soldiers spent the morning at the rifle range.
- He practises his swing at the driving range every Saturday.
