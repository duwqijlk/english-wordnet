simpleMeaning: In chemistry, two new chemicals come out when two chemicals swap parts with each other,
  as AB+CD=AD+CB.
scope: In chemistry, two chemicals swap parts and make two new ones, also called double decomposition
  and double decomposition reaction.
examples:
- Metathesis turns AB and CD into AD and CB.
- In metathesis, AB and CD give AD and CB.
