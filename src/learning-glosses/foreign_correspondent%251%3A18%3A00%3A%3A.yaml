senseId: 'foreign_correspondent%1:18:00::'
synsetId: 10123084-n
simpleMeaning: A news writer who sends reports and views from another country to be printed or put on
  the air.
scope: A news writer working in another country, not a news writer at home and not a writer of books about
  other lands.
examples:
- The foreign correspondent sent a report from the capital that night.
- As a foreign correspondent, she lived abroad for ten years.
