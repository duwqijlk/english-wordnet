synsetId: 13862430-n
simpleMeaning: the duty of a person who looks after money or property for another person to act for that
  other person's good
scope: The duty a trustee owes a beneficiary, not a gift and not a loan.
examples:
- The trustee-beneficiary relation binds him to act only for her good.
- A trustee-beneficiary relation ends when the trust is wound up.
