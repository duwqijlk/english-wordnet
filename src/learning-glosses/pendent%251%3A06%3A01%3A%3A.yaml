simpleMeaning: A pretty thing that hangs down from a chain round the neck or from an ear ring.
scope: A pretty thing that hangs from a chain round the neck or an ear ring, also called a pendant, not
  a light that hangs from a ceiling and not a brooch pinned to cloth.
examples:
- She wore a gold pendent on a fine chain.
- The pendent swung gently from her earring.
