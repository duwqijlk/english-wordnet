simpleMeaning: soft like a wet crushed mass or like something that is too ripe, and not stiff
scope: 'Also called pulpy: soft like a wet crushed mass, or too ripe and soft, and not stiff; not the
  other sense of soft like a sponge that you can press down.'
examples:
- The bananas had turned brown and squashy, so we used them to make bread.
- Leave the pears too long and they go squashy and wet inside.
