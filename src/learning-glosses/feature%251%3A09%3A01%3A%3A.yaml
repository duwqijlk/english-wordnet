simpleMeaning: In linguistics, a property that lets you tell one language unit from another of the same
  type.
scope: This is the technical linguistics use, a property that tells one language unit from another, not
  a notable quality of a thing in general and not a product given extra advertising.
examples:
- In this analysis, voicing is a feature that tells /b/ apart from /p/.
- Each sound is described by a set of features such as voicing and place of articulation.
