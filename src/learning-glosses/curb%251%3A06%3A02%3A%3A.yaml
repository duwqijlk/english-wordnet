simpleMeaning: a piece put in a horse's mouth (a bit), with a chain or strap joined to it to control the
  horse
scope: This is a piece for a horse's mouth with a chain or strap, not the raised edge of a road and not
  the verb sense of making something less strong.
examples:
- He checked the curb on the horse, making sure its chain was not too tight.
- A curb has a chain that helps the rider control the horse.
