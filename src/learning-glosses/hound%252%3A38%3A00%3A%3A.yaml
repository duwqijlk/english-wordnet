simpleMeaning: to follow and chase someone or something and not stop or give up
scope: Also called hunt and trace. This means to chase and not give up, not a dog used for hunting.
examples:
- The police hounded the man until they caught him at last.
- The dogs hounded the fox through the woods all morning.
