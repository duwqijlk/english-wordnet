simpleMeaning: not having or showing new or own ideas, and not able to think of new things to make or
  do
scope: 'Also called sterile, uninspired, and uninventive: having no new ideas of your own. Not the sense
  that means not acting freely and naturally, and not showing what makes you different from other people.'
examples:
- His unimaginative story used the same old plot as many others.
- The teacher called the plan unimaginative because it had no new ideas.
