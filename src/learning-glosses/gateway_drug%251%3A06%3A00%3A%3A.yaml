simpleMeaning: Using it may lead a person to use other substances that cause addiction, though this substance
  forms a habit and does not cause addiction itself
scope: A habit-forming substance that is not itself addictive but whose use may lead to other addictive
  substances, not a strong drug and not a medicine.
examples:
- Beer is often called a gateway drug for young people.
- He warned that the gateway drug could lead to harder drugs.
