simpleMeaning: An emergency way of keeping a person breathing when they cannot breathe alone
scope: An emergency way to keep a person breathing, not natural breathing and not a cure for lung disease.
examples:
- The nurse kept up artificial respiration until the ambulance came.
- Artificial respiration saved the swimmer after he stopped breathing.
