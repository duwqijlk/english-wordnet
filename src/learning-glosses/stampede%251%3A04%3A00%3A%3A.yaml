simpleMeaning: a wild rush forward by a crowd of people, all moved by the same feeling to hurry somewhere
scope: A rush by people all moved by one feeling, not a wild rush of frightened animals, and not the act
  of making people hurry.
examples:
- When someone shouted 'fire', a stampede to the exits began.
- The stampede through the gate sent everyone running.
