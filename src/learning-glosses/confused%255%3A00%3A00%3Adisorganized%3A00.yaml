simpleMeaning: put into a state with no order, where things are mixed up and not in their right places
scope: About things or groups with no order, also called broken and upset. Not about a person who cannot
  think clearly, and not about talk that does not follow in order.
examples:
- His desk held a confused pile of papers, books and letters.
- The soldiers ran back in a confused group with no order.
