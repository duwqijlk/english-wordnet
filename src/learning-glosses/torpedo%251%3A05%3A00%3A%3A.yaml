simpleMeaning: a slow-moving flat fish that lives on the sea floor, with a round body and parts on each
  side of its head that can give strong electric shocks
scope: 'Also called crampfish, electric ray and numbfish: this is a flat sea fish that can give electric
  shocks, not the underwater weapon, the large sandwich or the small firework with the same name.'
examples:
- A torpedo resting on the sea floor gave the diver a strong shock.
- When touched, the torpedo sent out a strong electric shock.
