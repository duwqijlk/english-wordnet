simpleMeaning: to look at something very carefully and in small detail, to judge it or find what is wrong
scope: 'Also called scrutinize: looking at something closely to judge it or find fault. It is not the
  sense of checking something carefully to see if it is correct.'
examples:
- The teacher scrutinised every line of the student's work.
- She scrutinised his face, looking for any sign that he was lying.
