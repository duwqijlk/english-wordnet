simpleMeaning: A sickness of the crop of a starchy root vegetable, which spoils the plants and their roots
scope: This is a sickness of the crop of a starchy root vegetable; potato blight, potato mildew, potato
  mold and potato murrain are other names for this sense, not a sickness of grain, and not the yellow
  dwarf sickness of the same crop.
examples:
- Potato disease spread through the fields in June.
- The farmer lost his crop to potato disease.
