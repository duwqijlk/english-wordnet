senseId: tyrannic%5:00:00:undemocratic:00
synsetId: 00721128-s
simpleMeaning: Used of a ruler or a way of ruling in which one person has all the power and no one can
  check them.
scope: This means like an absolute ruler, also called authoritarian, autocratic, tyrannical, despotic
  and dictatorial; not democratic and not fair.
examples:
- The tyrannic ruler took all power for himself.
- A tyrannic regime silenced its critics.
