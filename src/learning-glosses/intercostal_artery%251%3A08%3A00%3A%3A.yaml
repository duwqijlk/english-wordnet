simpleMeaning: Blood tubes that feed the gaps between the ribs of the chest.
scope: Blood tubes that feed the gaps between the ribs of the chest, also called arteria intercostalis;
  not blood tubes that feed the ribs themselves and not the veins between the ribs.
examples:
- The intercostal artery feeds the space between the ribs.
- A cut intercostal artery bled between the ribs.
