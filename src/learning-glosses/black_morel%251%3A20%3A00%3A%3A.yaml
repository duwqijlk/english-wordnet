simpleMeaning: Grey when young and dark in old age, the pitted spore-making part of this mushroom joins
  the stalk with little loose rim around it.
scope: Also called conic morel and narrowhead morel, this is a mushroom whose pitted spore-making part
  joins the stalk with little loose rim around it, grey when young and dark in old age; other mushrooms
  with pitted tops are its nearest rivals.
examples:
- The black morel was grey when young.
- A black morel turns dark in old age.
