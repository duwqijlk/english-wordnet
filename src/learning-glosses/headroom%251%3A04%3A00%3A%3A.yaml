simpleMeaning: how loud a sound system can play sounds and still keep them clear, with no bad change in
  the sound
scope: This is about sound and how clear it stays when it is loud, not the empty space above a person's
  head in a car or room.
examples:
- This amplifier has enough headroom to play the loud parts without making them sound harsh.
- Good headroom means the music stays clear even when the drums are very loud.
