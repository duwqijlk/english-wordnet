simpleMeaning: a white powder that does not dissolve in water, does not let X-rays pass through, and is
  used to give colour to paint
scope: 'Also called barium sulfate and barium sulphate: a white powder used to give colour to paint, not
  the mineral form of the same substance and not a powder taken as a medicine.'
examples:
- The painter mixed blanc fixe into the paint to make it white.
- Blanc fixe gives the white paint its strong covering power.
