simpleMeaning: you catch fish with this tool by driving its long handle forward, so the point, with small
  hooks facing back, sticks in the fish and holds it
scope: 'Also called a fizgig, a gig, a lance, and a spear: a long-handled tool with a barbed point for
  catching fish, not a rod for catching fish with a line and not a net.'
examples:
- He caught a carp with a fishgig.
- The fishgig has a long shaft and a sharp barbed point.
