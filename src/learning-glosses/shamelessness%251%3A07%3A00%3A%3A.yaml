simpleMeaning: Open defiance of what is proper in how one behaves, without any shame.
scope: Also called brazenness, behaving with open defiance of what is proper and showing no shame.
examples:
- His shamelessness shocked everyone at the table.
- She faced them with shamelessness, showing no regret.
