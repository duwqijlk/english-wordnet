simpleMeaning: A Mediterranean shrub that stays green all year and grows like a tree, bearing fragrant
  white flower clusters at the branch tips; its hard roots are used for tobacco pipes.
scope: The Mediterranean shrub used for tobacco pipes, also called briar and brier; not the Tasmanian
  tree heath with long narrow leaves.
examples:
- Tree heath can grow as tall as a small tree.
- Pipe makers use the hard roots of tree heath.
