simpleMeaning: A grey salt of a light metal, written CaC, used to make acetylene, a gas that burns with
  a bright flame.
scope: A grey salt of a light metal used to make acetylene gas, not chalk and not a salt for softening
  water.
examples:
- Calcium carbide gives off acetylene when wet.
- Miners once used calcium carbide in their lamps.
