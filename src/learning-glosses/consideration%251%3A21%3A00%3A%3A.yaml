simpleMeaning: a sum of money paid in advance to keep a person's work for later use
scope: A sum paid in advance to keep a person's services, not a kind act and not kind regard for others.
examples:
- He paid a consideration to keep the lawyer's services.
- The firm charged a consideration in advance.
