simpleMeaning: Fungi, insects, or some other upset inside the plant makes a tree or shrub grow a strange
  bunch of small branches.
scope: Hexenbesen, witch broom, and witches' broom are other names for this strange bunch of small branches
  on a tree or shrub.
examples:
- Staghead grew on the tree.
- The shrub had staghead on its branches.
