simpleMeaning: Whiskey made against the law from corn mash (corn crushed and mixed with water, then heated
  to make a strong drink)
scope: This strong drink is also called moonshine and also called corn liquor; it is not whiskey made
  in a way the law allows.
examples:
- He sold bootleg from the back of his truck.
- A bottle of bootleg was found hidden under the floor.
