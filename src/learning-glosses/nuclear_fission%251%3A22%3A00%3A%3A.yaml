simpleMeaning: Energy is set free at the same time as one very heavy centre of an atom breaks into smaller
  centres
scope: This is the splitting of the centre of an atom, also called fission; not the joining of such centres,
  which is fusion.
examples:
- The power station uses nuclear fission to make electricity.
- In nuclear fission, a heavy nucleus splits and gives off energy.
