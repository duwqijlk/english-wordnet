simpleMeaning: A business that buys and sells shares for others and takes a fee for standing between buyer
  and seller.
scope: A business that buys and sells shares for others for a fee; brokerage is another name for this
  sense, not a stock exchange and not a bank.
examples:
- The brokerage firm charged a fee for selling her shares.
- He opened an account with a brokerage firm in the city.
