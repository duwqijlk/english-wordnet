simpleMeaning: to put things on a cord, one after the other, as if on a cord
scope: 'Also called string: to put things on a cord one after the other, not to put a fine cord through
  a hole and not to move in long bends and turns.'
examples:
- She threaded the beads on a cord for a gift.
- The child threaded dry fruit on a cord to hang up.
