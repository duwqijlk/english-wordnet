simpleMeaning: A tree of the East Indies with long pods holding a black pulp that clears the bowels, used
  as a medicine for riding animals
scope: A tree of the East Indies with long pods holding a black pulp that clears the bowels, used as a
  medicine for riding animals; not the tropical American tree of the same name with pink flowers, and
  not a tree grown for its wood.
examples:
- The horse cassia grows in the East Indies.
- Pods of the horse cassia hold a black pulp used as a cure for riding animals.
