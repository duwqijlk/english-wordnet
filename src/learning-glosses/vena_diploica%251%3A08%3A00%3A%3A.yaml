simpleMeaning: one of the blood tubes that serve the soft, spongy part of the bones of the skull
scope: 'Also called a diploic vein: a vein in the spongy part of the skull bones, not a vein under the
  skin and not a vein that runs beside an artery.'
examples:
- The vena diploica runs through the spongy part of the skull bone.
- A vena diploica was seen in the spongy layer of the cranial bone.
