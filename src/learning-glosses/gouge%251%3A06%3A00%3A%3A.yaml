simpleMeaning: A cutting tool with a curved blade, like a trough, for cutting hollows.
scope: This is a cutting tool with a curved blade, not the act of forcing a thing out of someone by threats.
examples:
- He used a gouge to cut the groove in the wood.
- The carpenter's gouge left a smooth hollow.
