simpleMeaning: A frame covered with mats or brush makes this shelter, where people who move from place
  to place in the southwest of the United States live.
scope: Also called a wickiup, this is a shelter of a frame covered with mats or brush, where people who
  move from place to place in the southwest of the United States live.
examples:
- They built a wikiup from poles and brush.
- The wikiup was made of a frame covered with mats.
