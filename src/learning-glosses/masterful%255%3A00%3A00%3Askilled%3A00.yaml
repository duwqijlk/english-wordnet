simpleMeaning: having or showing the very highest skill at something
scope: Showing the highest skill, also called consummate, virtuoso and masterly; not acting like a boss
  and ordering other people about.
examples:
- The pianist gave a masterful performance of the hard piece.
- Her masterful way of handling the talks won praise from everyone.
