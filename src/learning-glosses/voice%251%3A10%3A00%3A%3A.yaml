simpleMeaning: the sound a person makes when speaking or singing, produced by air moving over small folds
  in the throat.
scope: Not a person's opinion and not the special quality that makes speech recognizable; this is the
  physical sound itself.
examples:
- Her voice was hoarse after the concert.
- I could hear voices in the next room.
