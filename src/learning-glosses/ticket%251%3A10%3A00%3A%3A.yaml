senseId: 'ticket%1:10:00::'
synsetId: 06570669-n
simpleMeaning: an official paper given to a person who has broken a rule, telling them what they must
  do, especially for breaking a rule of the road
scope: This is an official paper for a person who has broken a rule, especially on the road; it is not
  the paper that lets you travel or go in somewhere, and not a list of people put up for an election.
examples:
- The police officer gave him a ticket for driving too fast.
- She got a parking ticket while she was in the shop.
