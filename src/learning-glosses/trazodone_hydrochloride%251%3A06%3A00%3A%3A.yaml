simpleMeaning: a drug taken by mouth that lifts low mood and makes people sleepy, sold as Desyrel, and
  not one of the tricyclic drugs
scope: This is a drug taken by mouth for low mood that also makes people sleepy; trazodone is another
  name for this sense. Not a drug that only lifts mood without making people sleepy, and not a tricyclic
  drug.
examples:
- The doctor gave him trazodone hydrochloride to lift his mood and help him sleep.
- She took trazodone hydrochloride each night, and it made her drowsy.
