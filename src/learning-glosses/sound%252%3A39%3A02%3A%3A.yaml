simpleMeaning: use a bell, horn or other noise to tell people that something is happening
scope: This is about a device or instrument giving a signal to announce something, not about a person
  speaking words, not a noise starting by itself, and not simply making an object produce a noise.
examples:
- The guard sounded the alarm as soon as he saw the smoke.
- A bell sounded the end of the lesson.
