simpleMeaning: In mining, a measure of amount, equal to 6 cubic feet, used for amounts of ore
scope: A mining measure of amount equal to 6 cubic feet; fathom is another name for this sense, not a
  single cubic foot and not a measure of weight.
examples:
- The ore was measured in fthm.
- One fthm equals six cubic feet.
