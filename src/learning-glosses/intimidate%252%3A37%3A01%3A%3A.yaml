simpleMeaning: to make someone do something, or stop them from doing it, by using threats or by acting
  as if you will harm them
scope: This means to force a person to act, or to hold them back, by threats, not to hurt a person in
  fact and not just to make them afraid in a general way.
examples:
- The gang tried to intimidate the shop owner into paying them money.
- Witnesses were intimidated into staying silent by threats of harm.
