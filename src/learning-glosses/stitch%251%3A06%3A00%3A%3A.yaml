simpleMeaning: a link, loop or knot made with a tool in sewing, knitting, crocheting, or embroidery
scope: A link, loop or knot made in sewing, knitting, crocheting or embroidery; not a sharp pain in the
  side from running, and not the act of sewing itself.
examples:
- She counted every stitch in the first row of her knitting.
- One loose stitch can make the whole seam come apart.
