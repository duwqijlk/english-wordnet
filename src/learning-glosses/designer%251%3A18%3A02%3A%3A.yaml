simpleMeaning: a person whose job is to plan how the inside of a room or building should look
scope: This person plans the inside of rooms, not a person who plans clothes, not a person who plans pictures
  and words for pages or screens, and not a person who makes secret plans.
examples:
- An interior designer chose the colours and chairs for the hotel rooms.
- The interior designer planned a light, warm living room for the family.
