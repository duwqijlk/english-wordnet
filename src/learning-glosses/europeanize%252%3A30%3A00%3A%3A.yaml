senseId: 'europeanize%2:30:00::'
synsetId: 00410980-v
simpleMeaning: To take a land out of its own nation's hands and put it under the watch of a body set up
  by a group of nations in Europe.
scope: This verb covers taking a territory out of national rule and placing it under a European agency;
  also called Europeanise, not the sense of making a place European in its ways.
examples:
- The treaty would Europeanize the port, placing it under a European agency.
- They planned to Europeanize the territory after the war.
