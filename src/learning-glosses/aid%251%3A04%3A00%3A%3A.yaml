simpleMeaning: the act of giving help that meets a need or moves an effort or purpose forward.
scope: This is not a person or object that gives help, nor money given to a country or group; it names
  the activity of helping itself.
examples:
- He came to the aid of the injured cyclist.
- The project moved forward with the aid of experienced volunteers.
