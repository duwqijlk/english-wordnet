simpleMeaning: a rough, unpleasant noise made when one thing rubs or moves across another
scope: 'Also called scratch, scrape, and scraping: this is the noise itself, not the act that makes the
  noise.'
examples:
- The scratching of the chair legs on the floor hurt my ears.
- We heard a loud scratching from behind the door.
