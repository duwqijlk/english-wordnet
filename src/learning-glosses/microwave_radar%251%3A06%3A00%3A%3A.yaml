simpleMeaning: a tool that finds far-off things by sending out short bursts of a kind of radio wave and
  reading the waves that bounce back
scope: 'Also called radar, radio detection and ranging, and radiolocation: a tool that finds far-off things
  by their echo, not a plain radio set or a light that shines on things.'
examples:
- The ship's microwave radar picked up the small boat in the fog.
- Airports use microwave radar to track planes in bad weather.
