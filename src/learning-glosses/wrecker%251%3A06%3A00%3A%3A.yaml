simpleMeaning: A truck fitted to lift and pull away damaged cars, or to take cars away from places where
  parking is not allowed.
scope: 'Also called a tow car or a tow truck: a truck that lifts and pulls away damaged cars, not a person
  who causes wrecks on purpose.'
examples:
- A wrecker arrived to tow the crashed car away.
- The wrecker lifted the van out of the ditch.
