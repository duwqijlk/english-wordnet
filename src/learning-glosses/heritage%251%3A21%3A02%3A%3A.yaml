simpleMeaning: something that passes by law to an heir when the owner dies, such as a title, land, or
  other property
scope: 'Also called inheritance: what passes by law to an heir at death, not the customs handed down by
  tradition and not a gift given in life.'
examples:
- He received a large heritage when his father died.
- The heritage included a house and a small piece of land.
