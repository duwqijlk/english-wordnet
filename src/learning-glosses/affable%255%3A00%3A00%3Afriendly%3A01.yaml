simpleMeaning: full of warm, friendly feeling that spreads to other people
scope: 'Also called cordial, amiable and genial: this means warm and friendly in a way that makes other
  people feel at ease, not cold or unfriendly.'
examples:
- Our affable host smiled warmly and made every guest feel welcome.
- She is an affable woman who talks kindly to everyone she meets.
