simpleMeaning: the way someone lives or acts when they aim high and do things in a big, showy way
scope: 'Also called grand, and another name for it is heroic: a big, bold way of living or acting, not
  a mood of high spirits and not something that grows larger.'
examples:
- She lived an expansive life, with big parties and grand trips.
- His expansive plans for the new house impressed everyone.
