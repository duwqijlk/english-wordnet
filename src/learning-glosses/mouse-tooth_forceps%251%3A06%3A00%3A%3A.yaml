simpleMeaning: Tongs for dressing wounds, with one or more fine sharp points on the tip of each arm that
  fit between the tooth or teeth on the other arm.
scope: This is the dressing forceps with sharp points that fit between the teeth on the other blade, not
  plain forceps with smooth flat tips.
examples:
- The nurse picked up the mouse-tooth forceps to hold the dressing.
- Mouse-tooth forceps have fine sharp points on each blade.
