simpleMeaning: Able to be officially declared mad, and then treated as a mad person would be.
scope: This is about a person who can be officially declared mad and treated as a mad person would be,
  not someone checked as fit for a job and not someone holding papers that show a skill.
examples:
- The court ruled that he was certified insane and sent him for treatment.
- Once certified insane, she was kept in a hospital for care.
