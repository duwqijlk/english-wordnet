simpleMeaning: a set of beliefs that says people can grow and reach what they can be by using reason,
  and that does not accept religion or things beyond nature
scope: This set of beliefs, also called secular humanism, puts reason first and does not accept religion;
  it is not the belief that people's main duty is to help others live well.
examples:
- Humanism taught him to trust reason and not to look for help from gods.
- She studied humanism because she wanted a way of life based on reason alone.
