simpleMeaning: keeping up keen action over a long time, with energy that does not drop
scope: 'Also called tireless, unflagging, and unwearying: keeping up strong, keen action for a long time;
  not just being busy for a short time or full of energy for a moment.'
examples:
- She was an indefatigable worker for equal rights, and she kept going for years.
- Our indefatigable guide led the walk all day and still had energy at the end.
