simpleMeaning: A wrong build-up of hemosiderin, a form of iron stored in the body, often a sign of thalassemia
  or hemochromatosis
scope: This is a wrong build-up of hemosiderin in the body, also called haemosiderosis, and not a normal
  store of iron or a build-up of fat.
examples:
- Hemosiderosis can follow repeated blood transfusions.
- The scan showed hemosiderosis in the liver.
