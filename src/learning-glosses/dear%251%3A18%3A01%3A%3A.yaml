simpleMeaning: a kind, gentle person who seems free of any badness, especially a child.
scope: This is a warm word for a gentle, likeable person, not a word for someone you love romantically
  or for something expensive.
examples:
- He is such a dear, always helping his neighbours.
- The little girl was a dear and shared her toys with everyone.
