simpleMeaning: A kind of cornbread, usually cooked flat on a hot plate, chiefly in New England.
scope: A kind of cornbread, usually cooked flat on a hot plate, chiefly in New England; johnny cake and
  johnnycake are other names for this sense, not bread baked in an oven and not a sweet cake.
examples:
