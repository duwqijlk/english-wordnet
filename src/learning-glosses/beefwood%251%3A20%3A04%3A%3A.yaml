simpleMeaning: Some of it is used to make cabinets, this heavy, hard, reddish timber, one of several kinds,
  mostly from warm lands, of the plant families Casuarinaceae and Proteaceae
scope: This heavy, hard, reddish timber, one of several kinds of the plant families Casuarinaceae and
  Proteaceae, mostly from warm lands, some of it used to make cabinets, is not the tree that gives the
  timber.
examples:
- They used beefwood to make a cabinet.
- The beefwood came from warm lands.
