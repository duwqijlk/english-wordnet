simpleMeaning: about or causing a loss of feeling in the body
scope: 'Also called anesthetic: about or causing a loss of feeling in the body, not the drug itself that
  causes this loss.'
examples:
- The doctor used an anaesthetic cream so the skin would not feel the cut.
- The gas has an anaesthetic effect and stops patients feeling pain.
