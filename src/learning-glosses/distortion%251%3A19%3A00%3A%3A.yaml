senseId: 'distortion%1:19:00::'
synsetId: 11440253-n
simpleMeaning: A fault in what you see, caused when a lens or a mirror fails to make a clear picture
scope: A fault in what is seen, when a lens or mirror fails to make a clear picture; not a fault in sound,
  not a twisted shape, and not a twisted meaning.
examples:
- The distortion in the old mirror made her face look wide.
- Distortion from the cheap lens bent the straight lines.
