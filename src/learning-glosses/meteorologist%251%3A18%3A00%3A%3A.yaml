simpleMeaning: a person who studies the air around the earth and the changes in it that make the weather,
  as a job
scope: A person whose job is to study what makes the weather, not just a person who tells the weather
  on television and not a person who studies rocks or the land.
examples:
- The meteorologist said rain would come on Friday after studying the air high above us.
- Meteorologists use tools in the sky and on the ground to learn how storms form.
