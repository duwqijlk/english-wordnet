senseId: 'edict%1:10:01::'
synsetId: 06739420-n
simpleMeaning: a public statement made in an official way by a person in power
scope: This is an official public statement by a person in power. Not a court order or a law made by a
  judge, and not a simple request or advice.
examples:
- By an edict, the queen made known to the people that the war was over.
- The king's edict was read out in the square so that everyone could hear his words.
