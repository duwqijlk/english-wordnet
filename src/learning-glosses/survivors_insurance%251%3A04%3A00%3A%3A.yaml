simpleMeaning: payments made to a husband or wife left alive after the other one dies
scope: Payments to a husband or wife left alive after the other dies, not money paid to a person who is
  hurt, and not money paid while both are alive.
examples:
- Survivors insurance helped her pay the rent after her husband died.
- He took out survivors insurance so his wife would be cared for.
