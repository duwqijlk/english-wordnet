simpleMeaning: Leather leg covers, usually in pairs, with no seat, joined by a belt and worn over trousers
  to guard a cowboy's legs, often with wide flaps at the sides
scope: Leather leg covers worn by cowboys over trousers, not a man and not a crack in the skin.
examples:
- The cowboy pulled on his chaps before riding out.
- His chaps kept the thorns from his legs.
