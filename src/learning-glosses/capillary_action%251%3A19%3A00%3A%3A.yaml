simpleMeaning: The pull on the surface of a liquid lifts it or lets it drop in very thin tubes
scope: Also called capillarity, this pull works in very thin tubes, not in wide ones.
examples:
- Capillary action pulls water up into the narrow tube.
- The lamp wick works by capillary action.
