senseId: 'daltonism%1:26:00::'
synsetId: 14177650-n
simpleMeaning: A kind of colour blindness in which green light is seen weakly, so green and purplish-red
  cannot be told apart.
scope: Also called deuteranopia and green-blindness; a kind of colour blindness in which green and purplish-red
  look alike.
examples:
- Daltonism makes green and purplish-red hard to tell apart.
- He has Daltonism, so green looks weak to him.
