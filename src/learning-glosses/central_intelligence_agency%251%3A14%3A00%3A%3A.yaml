simpleMeaning: A free-standing United States government arm gathering and joining up secret news abroad
  and working against spies for America, led by its head under the President and National Security Council.
scope: A free-standing arm of the United States government that works on secret news abroad for the good
  of the country, also called CIA; not the FBI.
examples:
- The Central Intelligence Agency gathers news from abroad.
- The Central Intelligence Agency works abroad for the United States.
