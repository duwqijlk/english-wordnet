simpleMeaning: An imagined thing that takes in all the rays that reach it
scope: This is an imagined thing that takes in all rays that reach it; black body and blackbody are other
  names for this sense, not a real hot body that gives off rays.
examples:
- A full radiator at one heat takes in all the rays that reach it.
- The book calls a black body a full radiator.
