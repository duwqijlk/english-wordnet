simpleMeaning: the feeling of being annoyed and unhappy with someone or something
scope: Being annoyed and unhappy with someone or something, not being pleased, and not full-blown anger.
examples:
- He showed his displeasure by leaving the room without a word.
- Her displeasure with the noisy guests was clear from her face.
