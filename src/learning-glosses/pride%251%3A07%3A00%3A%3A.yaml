senseId: 'pride%1:07:00::'
synsetId: 04893841-n
simpleMeaning: the part of a person that pushes them to keep to the level they set for themselves, because
  they do not like falling below it
scope: The push to keep up your own level; not the happy feeling from what you or another person did well,
  and not thinking too highly of yourself.
examples:
- His pride would not let him hand in poor work.
- Her pride pushed her to train again after she came second.
