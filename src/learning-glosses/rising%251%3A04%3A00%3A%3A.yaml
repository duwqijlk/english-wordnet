simpleMeaning: a struggle between two sides, one trying to seize power from the other, or an organized
  stand against those in power
scope: Another name for rebellion, revolt, uprising and insurrection, not an upward movement or an increase
  in level.
examples:
- The rising was crushed by government troops within days.
- News of the rising spread quickly through the countryside.
