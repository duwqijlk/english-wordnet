simpleMeaning: An eight-legged animal with a row of stiff hairs on each back foot, set close like teeth
scope: An eight-legged animal with rows of stiff hairs on its back feet, not one with smooth feet and
  not one that hunts on the ground.
examples:
- The comb-footed spider hung in the corner of the room.
- A comb-footed spider has stiff hairs on its back feet.
