simpleMeaning: Food experts use this unit of heat to say how much energy food gives, the heat that warms
  one kilogram of water by one degree at normal air pressure.
scope: Calorie, kilocalorie, kilogram calorie, and nutritionist's calorie are other names for this unit
  of heat, the heat that warms one kilogram of water by one degree at normal air pressure.
examples:
- A large calorie warms a kilogram of water by one degree.
- Food experts count large calories to say how much energy food gives.
