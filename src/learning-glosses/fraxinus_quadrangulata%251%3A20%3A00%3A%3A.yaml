simpleMeaning: With bluish-green leaves and hard brown wood, this ash grows in the middle and south of
  the United States.
scope: Also called blue ash, this ash of the middle and south of the United States has bluish-green leaves
  and hard brown wood, not the small ash of the swampy south-east.
examples:
- The Fraxinus quadrangulata in the yard has bluish-green leaves.
- Carpenters prize Fraxinus quadrangulata for its hard brown wood.
