simpleMeaning: in a larger amount or degree, or at a later, more developed point in a thing; for this
  meaning, 'further' is used more often
scope: Also called further. This is about degree or how far a thing has got, not about distance in space
  or time.
examples:
- The talks went farther than we expected, but no deal was reached.
- He went farther in his studies than his brother did.
