simpleMeaning: In law, the act of ruining a paper on purpose or changing it so it can no longer be used
  as proof
scope: In law, ruining a paper on purpose or changing it so it can no longer be used as proof, not an
  honest loss of a paper and not a fake paper made to deceive.
examples:
- The lawyer was accused of spoliation after the missing papers were never found.
- If the spoliation of the files is proved, the court may rule against the company.
