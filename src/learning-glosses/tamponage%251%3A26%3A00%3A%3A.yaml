senseId: 'tamponage%1:26:00::'
synsetId: 14531970-n
simpleMeaning: The blocking or closing of a wound or body hole with a soft cotton plug, or with something
  that acts like one, above all to stop bleeding
scope: The blocking of a wound or body hole with a soft cotton plug to stop bleeding, also called tamponade;
  not the blocking of a pipe and not a bandage on the skin.
examples:
- The nurse used tamponage to stop the bleeding from the deep cut.
- Tamponage closed the wound until the doctor could treat it.
