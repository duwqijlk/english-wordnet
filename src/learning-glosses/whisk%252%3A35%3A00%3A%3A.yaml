senseId: 'whisk%2:35:00::'
synsetId: 01420522-v
simpleMeaning: to beat something fast with a wire kitchen tool, or to beat it in the same way without
  the tool
scope: Whip is another name for this sense. This is beating something fast with a wire tool, or in the
  same way without one; not the wire kitchen tool itself, not the small brush for clothes, and not brushing
  something off lightly.
examples:
- Whisk the eggs until they are light and full of air.
- She whisked the cream quickly before she poured it in.
