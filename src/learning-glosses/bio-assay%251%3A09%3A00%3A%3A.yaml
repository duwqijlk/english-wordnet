simpleMeaning: A test of how a thing acts on living things, judged by its effect on a living thing and
  set against a fixed measure.
scope: A test of how a thing acts on living things, set against a fixed measure, also called bioassay;
  not a chemical test on dead matter and not a guess.
examples:
- The bio-assay showed how strong the drug was.
- Scientists ran a bio-assay on the new medicine.
