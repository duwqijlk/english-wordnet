simpleMeaning: Their green parts look burned when plants catch this sickness
scope: A sickness of plants that makes their green parts look burned, not a real burn from heat and not
  leaves dried out by lack of water.
examples:
- Leaf scorch turned the edges of the maple's leaves brown.
- The gardener blamed leaf scorch for the burned look of the shrubs.
