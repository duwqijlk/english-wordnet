senseId: 'naval_attache%1:18:00::'
synsetId: 10367029-n
simpleMeaning: An officer of the sea forces, of high or low rank, who works for their country's armed
  forces in a foreign land
scope: This is a sea-force officer who works for their country's armed forces abroad; not a land-force
  officer, and not a sea captain in command of a ship.
examples:
- The naval attache met the foreign generals at the embassy.
- As naval attache, she advised the ambassador on sea matters.
