simpleMeaning: A long thin fish of Europe that lives near the top of the water and hunts with long jaws
  full of teeth, common near the coast
scope: A long thin European fish that hunts near the surface, not the North American fish with hard scales
  and needle-like teeth.
examples:
- The gar swam just under the surface, hunting small fish.
- Gars are common in the coastal waters of southern Europe.
