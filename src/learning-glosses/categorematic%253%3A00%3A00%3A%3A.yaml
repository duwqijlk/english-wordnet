simpleMeaning: a word or group of words that can work on its own as a part of a statement, and above all
  as the part that says something
scope: A word or group of words that can work on its own as a part of a statement, not a small word like
  'and' that only joins other words.
examples:
- The phrase 'the old house' is categorematic because it can stand as the subject of a sentence.
- A categorematic term can stand on its own in a statement.
