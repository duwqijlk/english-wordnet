simpleMeaning: to pass water or something in water through a channel with a gate
scope: To pass water through a channel with a gate; not to water land, and not to send things down a channel.
examples:
- The workers sluiced water from the pond through the gate.
- Sluice the water through the channel to clear the ditch.
