simpleMeaning: a mixed set of groups joined against Saddam Hussein's rule in Iraq, formed in 1992 from
  Sunni and Shiite Arabs and Kurds who hope to build a new government
scope: Also called the Iraqi National Congress; a mixed set of groups against Saddam Hussein's rule, not
  a single party and not an army.
examples:
- The INC brought the groups together in 1992.
- Leaders of the INC hoped to form a new government.
