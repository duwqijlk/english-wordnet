simpleMeaning: a radio signal with a length of less than 100 metres and a rate of more than 3 million
  cycles a second
scope: A radio signal less than 100 metres in length; not a long radio signal, and not a medium radio
  signal.
examples:
- The station broadcasts on short wave to reach listeners far away.
- He tuned the radio to a short wave band.
