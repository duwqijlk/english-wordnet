simpleMeaning: A person in charge of homes built and run by the state for people to live in.
scope: A person in charge of homes built and run by the state, not a person who builds homes and not a
  person who rents out private homes.
examples:
- The housing commissioner visited the new estate on Friday.
- She wrote to the housing commissioner about the damp in her flat.
