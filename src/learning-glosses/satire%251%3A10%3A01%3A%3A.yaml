senseId: 'satire%1:10:01::'
synsetId: 85217700-n
simpleMeaning: A kind of writing and stage work in which faults are held up to be laughed at, in the hope
  of shaming others.
scope: A kind of writing and stage work that holds faults up to ridicule, not witty words used to insult
  or scorn.
examples:
- The play was a satire on the rich and powerful.
- Her satire mocked the town's leaders.
