simpleMeaning: damaged because it has broken down over time, so it is not strong and cannot be used
scope: 'Also called rotted: damaged and too weak to use, as with old wood; not the sense for a thing that
  has gone bad and usually smells bad.'
examples:
- The rotten floor boards broke under his feet.
- We had to replace the rotten beams in the roof.
