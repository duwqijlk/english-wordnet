simpleMeaning: the act of cutting into the body or into a part inside the body, especially by a doctor
  who does operations, as part of an operation
scope: 'Also called section: the act of cutting into the body in an operation, not a mark cut or scratched
  into the surface of a thing.'
examples:
- The surgeon made a small incision in her stomach.
- During the operation, the doctor made the incision slowly and with great care.
