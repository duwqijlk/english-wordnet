simpleMeaning: in Europe and America grows a plant of the cress kind whose taste is bitter
scope: Also called cuckoo flower, lady's smock, or meadow cress, this is a plant of the cress kind in
  Europe and America whose taste is bitter, not a garden flower grown for show.
examples:
- Cuckooflower grew along the wet edge of the field, and its leaves tasted bitter.
- The cuckooflower we found had a sharp, bitter taste.
