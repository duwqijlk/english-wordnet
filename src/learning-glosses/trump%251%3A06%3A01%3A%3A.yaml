simpleMeaning: a brass wind instrument with a bright clear sound, a narrow tube and a wide open end, played
  with valves
scope: A brass wind instrument with valves; horn and trumpet are other names for this sense, not the winning
  suit in cards.
examples:
- The trump sounded over the hall.
- She learned to play the trump as a child.
