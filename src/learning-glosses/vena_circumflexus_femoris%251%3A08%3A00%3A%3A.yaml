senseId: 'vena_circumflexus_femoris%1:08:00::'
synsetId: 05371548-n
simpleMeaning: Either of two blood tubes that run with arteries of the same name serving the hip and the
  thigh.
scope: One of two blood tubes that run with same-named arteries serving hip and thigh; circumflex femoral
  vein is another name for this sense; not a blood tube of the lower leg and not one of the arm.
examples:
- The vena circumflexus femoris runs beside the matching artery of the hip.
- The vena circumflexus femoris serves the hip and the thigh.
