simpleMeaning: In American football, an official who works far down the field, behind the back line of
  defenders, on the same edge as the head linesman
scope: An official in American football who works far down the field; not the referee and not the head
  linesman.
examples:
- The side judge raised his flag for pass interference.
- The side judge stood well downfield behind the defence.
