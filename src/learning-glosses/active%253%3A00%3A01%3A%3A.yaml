simpleMeaning: Moving about and doing things with a lot of energy.
scope: A person's own lively movement; not a condition growing more severe or wider in scope, not readiness
  for military or naval operations, not a disposition to act or bring about change, not taking part in
  a group or cause, not a busy place or constant coming and going, not exerting influence or producing
  an effect, not a machine in operation, not the grammatical voice where the subject is the doer or its
  noun, not verbs or participial adjectives expressing action rather than a state, not volcanoes that
  can erupt or are erupting, not full-time work, not the chemical noun, and not a member of an organization.
examples:
- The active toddler ran from one toy to the next all morning.
- She stays active by cycling and swimming every day.
