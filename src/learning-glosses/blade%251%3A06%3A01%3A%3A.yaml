simpleMeaning: a long metal weapon for cutting or stabbing, fitted with a grip and a guard for the hand
scope: The whole hand weapon, also called a sword, brand or steel, not the flat cutting part alone and
  not a grass leaf.
examples:
- He drew the blade from its sheath and held it to the light.
- The museum displays a ceremonial blade with a gold hilt.
