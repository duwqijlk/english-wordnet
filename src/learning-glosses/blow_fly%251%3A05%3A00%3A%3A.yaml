simpleMeaning: An insect that lays its eggs in dead flesh, dung, or open cuts, big and usually with hairs,
  shining blue or green.
scope: Also called a blowfly, this insect is a big one that shines blue or green, not a small dull one,
  and it lays its eggs in dead flesh, dung, or open cuts.
examples:
- A blow fly laid its eggs in the dung.
- A blow fly with a blue-green shine rested on the dead flesh.
