simpleMeaning: a wool cloth with a hard textured surface and no soft raised layer of short threads (nap);
  woven from tightly twisted yarn spun from wool with long fibres
scope: This is the wool cloth made from tightly twisted yarn, not the yarn itself.
examples:
- He wore a worsted suit to work.
- The jacket was made from dark worsted cloth.
