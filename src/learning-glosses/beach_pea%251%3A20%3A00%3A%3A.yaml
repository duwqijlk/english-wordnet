simpleMeaning: With tough roots and purple flowers, this wild plant of the seashores of the north temperate
  zone holds sand in place.
scope: 'Also called sea pea: a wild shore plant with tough roots and purple flowers that holds sand in
  place, not a plant of dry inland ground.'
examples:
- Beach peas grow along the shore where their roots hold the sand.
- The beach pea bears purple flowers.
