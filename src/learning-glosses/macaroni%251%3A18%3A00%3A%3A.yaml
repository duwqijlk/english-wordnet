simpleMeaning: a British man in the 1700s who cared a lot about fine clothes and put on ways of speaking
  and acting that he copied from mainland Europe
scope: This is a man of the 1700s who loved fine clothes and foreign ways; it is not the pasta in short
  tubes that people eat.
examples:
- The young macaroni wore a huge wig and clothes in the newest style from France.
- People laughed at the macaroni for copying foreign ways of dressing and speaking.
