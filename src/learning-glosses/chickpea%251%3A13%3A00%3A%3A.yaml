simpleMeaning: a large, white bean from Asia that is more or less round, usually dried
scope: The dried bean used as food, not the plant it grows on and not the fresh seed in its pod.
examples:
- She soaked the dried chickpeas overnight before cooking them.
- Chickpeas are often sold dried in bags at the market.
