schema: oewn-learning-gloss-v2
senseId: 'heteroecious%3:00:00::'
synsetId: 00182135-a
simpleMeaning: A living thing that lives off others spends each part of its life on a different kind of
  host
scope: Said of a living thing that lives off others and moves from host to host as it grows, not of a
  free-living thing and not of a parasite that stays on one host for its whole life.
examples:
- The heteroecious fungus spends part of its life on one plant and part on another.
- Heteroecious insects move between different hosts as they grow.
