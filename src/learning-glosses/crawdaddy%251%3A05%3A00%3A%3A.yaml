simpleMeaning: A small animal with ten legs that lives in fresh water and looks like a lobster
scope: This is a small animal with ten legs that lives in fresh water and looks like a lobster; crawfish,
  crayfish and crawdad are other names for it; not a lobster, which lives in the sea, and not a shrimp,
  which is much smaller.
examples:
- He caught a crawdaddy in the creek.
- Crawdaddies hide under stones in the stream.
