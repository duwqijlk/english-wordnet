simpleMeaning: On a court order, a law officer offers land or goods to buyers so that a debt left unpaid
  can be settled.
scope: Execution sale, forced sale, and judicial sale are other names for this court-ordered offering
  of land or goods to settle an unpaid debt.
examples:
- A sheriff's sale was held to pay off the unpaid debt.
- The court ordered a sheriff's sale of the property.
