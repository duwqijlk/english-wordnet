simpleMeaning: What a telescope or microscope puts nearest the thing being looked at is a clear disc,
  or a set of them.
scope: Also called objective, object glass, and object lens, this is the clear disc, or set of discs,
  that stands nearest what is being looked at in a telescope or microscope.
examples:
- Light reaches the objective lens before any other part.
- The objective lens faces the thing being looked at.
