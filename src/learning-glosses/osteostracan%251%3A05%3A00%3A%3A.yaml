simpleMeaning: A fish with no jaws and a head with a hard cover, from the Devonian, a time long ago, now
  gone from the earth
scope: A jawless fish whose head has a hard cover, also called cephalaspid, from a time long ago; not
  a fish with jaws and not a fish alive today.
examples:
- The osteostracan swam in seas of the Devonian period.
- Fossils show the osteostracan had a hard head shield.
