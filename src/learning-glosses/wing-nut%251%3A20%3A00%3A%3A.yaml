simpleMeaning: From the Caucasus to the southeast of Asia grows a tree of the group Pterocarya, its small
  fruit edged with thin flat flaps.
scope: This tree is also called a wing nut, not the small metal nut with two flat sides for turning by
  hand.
examples:
- The wing-nut grows in the Caucasus.
- We saw a wing-nut with small fruit.
