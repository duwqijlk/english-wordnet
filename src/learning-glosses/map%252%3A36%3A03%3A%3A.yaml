simpleMeaning: To work out a detailed plan for something, setting out each stage in order.
scope: This is about planning something in detail, such as your future; it is not drawing or surveying
  a map, and not the mathematics sense of pairing set members.
examples:
- The team mapped out every stage of the launch before the deadline.
- She mapped her future carefully, year by year.
