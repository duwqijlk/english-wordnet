simpleMeaning: Spikes that bear new plants mark this green plant, and they are shaped like the long part
  a snake sticks out of its mouth.
scope: Also called adder's tongue, this green plant is known by spikes that bear new plants and are shaped
  like the long part a snake sticks out of its mouth.
examples:
- Along the path, we saw adder's tongue fern with its spikes.
- In spring, adder's tongue fern put up spikes that bear new plants.
