senseId: 'indeterminably%4:02:00::'
synsetId: 00374004-r
simpleMeaning: in a way that cannot be fixed or settled for certain
scope: Doing something in a way that cannot be fixed or settled for certain; not merely doing it vaguely
  and not leaving it unfinished.
examples:
- Their relationship was of an indeterminably vague nature.
- The talks ended indeterminably, with nothing agreed.
