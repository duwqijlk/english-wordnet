simpleMeaning: the raised edge of stones between a path for walking and a road, usually forming part of
  a channel for water at the side of the road
scope: 'Also called curb and curbing: this is the raised stone edge between a walking path and a road.
  It is not the road itself and not the walking path itself.'
examples:
- She stepped up onto the kerb to wait for the bus.
- The car stopped close to the kerb.
