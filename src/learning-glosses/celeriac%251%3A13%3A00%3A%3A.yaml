simpleMeaning: The thick, sweet-smelling root of a kind of celery plant, eaten as food.
scope: The thick sweet-smelling root of a kind of celery plant, not the leafy stalks and not a turnip;
  celery root is another name for this sense.
examples:
- We grated celeriac into the salad for its strong smell.
- Celeriac makes a good soup when it is cooked and mashed.
