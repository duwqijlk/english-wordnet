simpleMeaning: A long-lived plant of Europe and Asia with bunches of red or yellow flowers, common in
  grass fields and pastures; once used as a medicine for kidney trouble.
scope: 'Also called kidney vetch: a long-lived plant of Europe and Asia with bunches of red or yellow
  flowers, common in meadows and pastures, not a tree and not a garden flower.'
examples:
- Anthyllis vulneraria grew in thick bunches along the edge of the meadow.
- In the old days, Anthyllis vulneraria was used as a medicine for kidney trouble.
