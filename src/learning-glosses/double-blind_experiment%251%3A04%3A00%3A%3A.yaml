simpleMeaning: in this kind of test, neither the people taking part nor the people running it know the
  key facts about it
scope: 'Also called double-blind procedure and double-blind study: a test in which neither the people
  taking part nor the people running it know the key facts, not a test in which only one side is kept
  in the dark.'
examples:
- The double-blind experiment kept both patients and doctors from knowing who got the real drug.
- In a double-blind experiment, neither side knows who received the new treatment.
