simpleMeaning: One who belongs to that family of kings.
scope: This word is about a member of the Carolingian dynasty, not a member of the Capetian dynasty and
  not the adjective for things of that family.
examples:
- The young Carolingian grew up among the kings of his family.
- Historians study the Carolingians and the kings of that family.
