simpleMeaning: Spikes of white or mauve blooms rise on this plant of the mild salty wet lands, one of
  various kinds in the group Limonium.
scope: People also call it sea lavender and statice, and the word names one of various kinds in the group
  Limonium, known by its spikes of white or mauve blooms.
examples:
- The marsh rosemary grows in mild salty wet lands and bears spikes of white or mauve flowers.
- Marsh rosemary stood in the salty wet lands with spikes of mauve blooms.
