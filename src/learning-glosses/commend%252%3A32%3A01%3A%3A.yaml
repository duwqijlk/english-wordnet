simpleMeaning: to say someone's name to another person as a greeting, or to show friendship
scope: 'Also called remember: this is about passing on a greeting to show friendship, not about saying
  that a person is good and should be trusted.'
examples:
- Please commend me to your mother when you see her tonight.
- She asked him to commend her to their old friends in the village.
