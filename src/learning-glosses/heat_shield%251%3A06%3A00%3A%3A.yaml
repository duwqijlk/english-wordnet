simpleMeaning: A cover that guards a space craft from getting too hot when it comes back into the air
scope: This is a cover that guards a space craft from getting too hot when it comes back into the air,
  and not a cover that guards against cold or a crash.
examples:
- The heat shield kept the craft cool on reentry.
- A damaged heat shield can put the crew at risk.
