simpleMeaning: Most times this small round bug, bright in colour and marked with spots, eats aphids and
  other small pests that harm plants.
scope: This bug is also called ladybug, ladybird, lady beetle and ladybird beetle, and it eats aphids
  and other small pests that harm plants most times.
examples:
- The ladybeetle ate the aphids.
- Ladybeetles feed on aphids and other small pests.
