simpleMeaning: one of the different kinds of juicy fruit with green or purple skin that grows in groups
  on the plant
scope: The fruit people eat, not the climbing plant it grows on and not a group of small balls shot from
  a cannon.
examples:
- She ate a grape and then took another from the bunch.
- The grapes were sweet and full of juice.
