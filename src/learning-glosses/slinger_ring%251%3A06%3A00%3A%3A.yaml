simpleMeaning: Through a hollow tube set round the centre of the propeller, this device on a plane sends
  a liquid that stops ice from forming over the turning blades.
scope: It is a device on a plane that spreads a liquid over the turning blades, through a hollow tube
  set round the centre of the propeller.
examples:
- The slinger ring fed the liquid through a tube round the propeller hub.
- The slinger ring kept ice off the blades.
