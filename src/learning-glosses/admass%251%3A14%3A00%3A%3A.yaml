simpleMeaning: the part of the public that is easily moved by newspapers, radio and television, chiefly
  in Britain
scope: The part of the public that is easily moved by newspapers, radio and television, chiefly in Britain;
  not the whole public and not people who ignore the news.
examples:
- Admass is the audience advertisers try hardest to reach.
- The paper's stories were aimed at admass, the readers most easily swayed by headlines.
