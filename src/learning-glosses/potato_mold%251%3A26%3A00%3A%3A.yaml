simpleMeaning: A sickness of a starchy root vegetable crop that spoils the plants
scope: This is a sickness of a starchy root vegetable crop; potato blight, potato disease, potato mildew
  and potato murrain are other names for this sense, not a sickness of grain, and not the yellow dwarf
  sickness of the same crop.
examples:
- Potato mold ruined the stored crop.
- They found potato mold on the tubers in the shed.
