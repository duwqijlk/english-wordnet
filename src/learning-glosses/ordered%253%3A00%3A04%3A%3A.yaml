senseId: 'ordered%3:00:04::'
synsetId: 01685687-a
simpleMeaning: Set out in a chosen arrangement of some kind.
scope: This only says that things have been put into some arrangement; it does not say the arrangement
  follows a rule, and it does not judge it as logical or pleasing.
examples:
- The books sat in ordered piles along the wall.
- The chairs were placed in an ordered semicircle for the meeting.
