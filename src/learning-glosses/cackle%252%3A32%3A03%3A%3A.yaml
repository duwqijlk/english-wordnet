simpleMeaning: to make a loud, sharp sound again and again
scope: Making a loud, sharp sound again and again, not the cry of a hen, not the cry of a goose, and not
  a loud laugh.
examples:
- The fire cackled in the small room all night.
- Dry sticks cackled as they burned in the fire.
