simpleMeaning: Water that has no salt in it, as in a river or lake.
scope: Water free of salt, as in a river or lake; not water that tastes of sugar, not wine that still
  holds much sugar, and not something pleasant, kind, or fragrant.
examples:
- The village draws sweet water from a deep well.
- The lake holds sweet water, while the nearby lagoon is salty.
