simpleMeaning: an early kind of mammal with a pouch for its young, found mostly in Australia and the Americas
scope: An early kind of mammal with a pouch for its young, found mostly in Australia and the Americas;
  not a mammal that bears live young without a pouch, and not an egg-laying mammal.
examples:
- The kangaroo is a metatherian, carrying its young in a pouch.
- Metatherians are found mostly in Australia and the Americas.
