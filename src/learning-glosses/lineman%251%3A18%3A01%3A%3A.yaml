simpleMeaning: Wires that carry power or phone calls are what this man puts up or mends
scope: 'Another name for a linesman: a man who puts up or mends wires, not the man who marks out land
  with a pole.'
examples:
- The lineman climbed the pole to mend the broken wire.
- After the storm, a lineman came to fix our power.
