simpleMeaning: any of several kinds of a plant with long thin leaves from the group Andropogon, used to
  make brushes for sweeping
scope: A kind of plant with long thin leaves from the group Andropogon, used to make brushes for sweeping;
  not a plant used for food and not a brush itself.
examples:
- The farmer cut broom grass to make new brushes.
- Broom grass grows tall in the field behind the house.
