simpleMeaning: a coarse plant of Europe and Asia, grown for its thick white root with a sharp taste
scope: A coarse plant of Europe and Asia, grown for its thick white root with a sharp taste; horseradish
  and red cole are other names for this sense, not a carrot and not a turnip.
examples:
- Horse radish grows wild along the old lane.
- We dug up horse radish for the roast beef.
