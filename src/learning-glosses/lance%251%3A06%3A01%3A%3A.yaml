simpleMeaning: a tool with a long handle and a point that has small hooks facing back, used for catching
  fish
scope: 'Also called spear, and another name for it is gig: this is a fishing tool with a hooked point,
  not the long pointed rod used as a weapon and not a doctor''s small knife.'
examples:
- He threw the lance into the water and caught a large fish.
- She caught the fish with a lance that had small hooks on its point.
