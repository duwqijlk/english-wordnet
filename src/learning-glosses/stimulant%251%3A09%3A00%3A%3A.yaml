simpleMeaning: any information or event that pushes a person to act
scope: 'Also called input, stimulus, and stimulation: any information or event that pushes a person to
  act, not a drug that makes the body work faster and not the word for making something more active.'
examples:
- The news was a stimulant that pushed the town to act at once.
- A good question can be a stimulant for new thinking.
