simpleMeaning: Any of a group of viruses with DNA (instructions for growth) in a 20-sided protein shell,
  making dogs and cattle ill but not known to be linked to human illness
scope: This sense, also called parvovirus, is about viruses that make dogs and cattle ill; they are not
  known to be linked to any illness in people.
examples:
- Parvo can make a young dog very ill.
- The farmer asked the vet to test the cattle for parvo.
