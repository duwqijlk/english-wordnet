synsetId: 04612164-n
simpleMeaning: A type of gear made of a screw-threaded shaft that turns a toothed wheel, changing the
  direction of the axis of rotation.
scope: A mechanical drive that pairs a threaded shaft with a toothed wheel; it is not an ordinary spur
  gear or a bevel gear.
examples:
- The lathe's feed mechanism uses a worm gear to turn the drive at a right angle.
- A worm gear transmits motion between shafts that cross at ninety degrees.
