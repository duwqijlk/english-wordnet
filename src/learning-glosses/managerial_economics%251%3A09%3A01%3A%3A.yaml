simpleMeaning: Using ideas about money and trade to help bosses make wise choices
scope: The use of money and trade ideas to guide business choices, not the study of trade on its own and
  not a set of business rules.
examples:
- In managerial economics, the class worked out how a price rise would change sales.
- She used managerial economics to decide how much stock to order.
