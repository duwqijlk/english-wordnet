simpleMeaning: In bright light or after certain drugs, the ring of muscle round the coloured part of the
  eye tightens on its own, so the black hole in the middle shrinks.
scope: It is also called light reflex, miosis and pupillary reflex, and it is the ring round the coloured
  part of the eye tightening in bright light, so the pupil grows smaller, not wider.
examples:
- Myosis made the pupil smaller in the bright light.
- After the drug, myosis narrowed the pupil.
