simpleMeaning: made or changed to keep a person or thing safe from harm of some kind
scope: This sense is about a thing made to keep a person or thing safe from harm, not about a person who
  cares for someone and watches over them with care.
examples:
- She wore protective gloves while she cleaned with strong soap.
- Workers wore protective masks and other safety gear on the site.
