simpleMeaning: Between the two layers of the thin cover holding the gut in place, this blood tube runs
  from the gut and empties into the big blood tube to the liver.
scope: Also called mesenteric vein, this tube runs from the gut, between the two layers of its thin cover,
  to the big blood tube that leads to the liver.
examples:
- The vena mesenterica empties into the big blood tube that leads to the liver.
- Blood from the gut runs through the vena mesenterica between the two layers of the thin cover that holds
  the gut in place.
