simpleMeaning: In statistics, the act of choosing a good set of things or people to study
scope: In statistics, this is choosing a set of people or things to study, not measuring a changing sound
  wave again and again to make it digital.
examples:
- Sampling of voters helped them learn what the town thought.
- Good sampling means choosing people from all parts of the city.
