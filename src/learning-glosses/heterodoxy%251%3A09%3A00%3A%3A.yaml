simpleMeaning: Opinions or teachings that differ from the official or accepted position.
scope: Opinions or teachings that go against the official or orthodox position, also called heresy and
  unorthodoxy, not the accepted views themselves and not a simple difference of taste.
examples:
- His heterodoxy put him at odds with the church.
- The council condemned her heterodoxy.
