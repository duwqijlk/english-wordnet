simpleMeaning: a prickly, bushy plant from Europe and Asia that is a weed causing trouble in the central
  and western United States
scope: This is the prickly, bushy plant from Europe and Asia that causes trouble as a weed in the central
  and western United States, not any plant that rolls in the wind and not the bushy weed of central North
  America.
examples:
- This prickly tumbleweed, first brought from Europe and Asia, now grows as a weed in the western United
  States.
- Tumbleweed covered the dry land in the central United States, where farmers saw it as a troublesome
  weed.
