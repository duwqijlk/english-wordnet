  sound, space, movement and time together in a new kind of art.
scope: What Lucio Fontana began in Milan in 1947, when he set out to join colour, sound, space, movement
  and time into a new kind of art.
examples:
- He was influenced by the spatialism of Fontana.
- The gallery showed work shaped by spatialism.
