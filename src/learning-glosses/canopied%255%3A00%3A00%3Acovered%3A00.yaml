senseId: canopied%5:00:00:covered:00
synsetId: 01699816-s
simpleMeaning: covered by a cloth or other cover held up above, or as if by such a cover
scope: This says a thing has a cover above it, or looks as if it does; not open to the sky and not covered
  at the sides only.
examples:
- They slept in a canopied bed with cloth over the top.
- We walked along streets canopied by tall trees.
