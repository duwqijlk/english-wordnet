simpleMeaning: Approval that comes when people take in a thing or idea and welcome it
scope: 'Also called acceptance, acceptation and adoption: approval that comes when people take in a thing
  or idea and welcome it, not a wedding promise and not a cold formal agreement.'
examples:
- The espousal of the new plan by the town was warm and quick.
- Her espousal of the cause gave it new strength.
