senseId: 'platitude%1:10:00::'
synsetId: 07168754-n
simpleMeaning: something said so often that it is dull, and so clear that it tells people nothing new
scope: 'Also called cliche, commonplace, banality, and bromide: a dull remark said too often, not a new
  or helpful idea.'
examples:
- His speech was full of platitudes about hard work.
- Saying that time heals all wounds can sound like a platitude.
