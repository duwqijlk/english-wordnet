simpleMeaning: Any of the more or less unbroken campaigns in the 11th to 13th centuries, when Christian
  states of Europe tried to win back the Holy Land from Muslims.
scope: These are the medieval campaigns to win back the Holy Land, not any later war nor a modern drive
  for a cause.
examples:
- He joined a Crusade to the Holy Land.
- Richard led a Crusade to the Holy Land.
