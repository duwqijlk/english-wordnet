simpleMeaning: the idea that a thing has a size or amount that can be shown in maths with a fixed number
  or a letter
scope: The idea of size or amount in maths, not how much of a thing there is in plain use.
examples:
- In maths, a quantity can stand for a fixed number or a letter.
- The teacher showed how a quantity is written with a letter in an equation.
