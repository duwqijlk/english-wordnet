simpleMeaning: A saying of Jesus that is believed to be really his own words, even though it is not found
  in the Gospels
scope: A saying of Jesus that is believed to be really his own words, even though it is not found in the
  Gospels, not a saying found in the Gospels and not a saying wrongly claimed to be from Jesus.
examples:
- The logion was quoted by early writers but not by the Gospels.
- Scholars debate whether the logion is genuine.
