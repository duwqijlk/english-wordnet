simpleMeaning: a piece of ground closed off for particular activities; it may be paved and is usually
  near buildings.
scope: This is ground enclosed for particular activities, not the plot where logs are piled, the land
  around a house, the rail area for engines and cars, or the pen for animals.
examples:
- The haulage firm keeps its trucks in a yard beside the warehouse.
- The council fenced off a yard for storing road salt.
