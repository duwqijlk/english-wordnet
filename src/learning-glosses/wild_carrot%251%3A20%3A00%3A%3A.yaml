simpleMeaning: A Eurasian herb that has spread widely and now grows wild elsewhere, with finely divided
  leaves and flat umbrella-like clusters of small white or yellowish flowers above thin yellowish roots.
scope: A Eurasian herb with finely divided leaves and small white or yellowish flowers, now widely naturalized.
  It is not the garden carrot grown for its thick orange root; this plant's roots are thin and yellowish.
examples:
- Wild carrot grew in the dry grass beside the road.
- We pulled up a wild carrot and found a thin, pale root.
