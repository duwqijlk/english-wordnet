simpleMeaning: In maths or logic, a value that can change in an expression (symbols that show a value),
  and its value decides the value that depends on it
scope: 'This is the maths or logic sense: a value that can change in an expression, not a set of reasons,
  not a short telling of a story, and not an angry talk where people disagree.'
examples:
- In f(x) = y, x is the argument.
- The teacher changed the argument, and the answer changed too.
