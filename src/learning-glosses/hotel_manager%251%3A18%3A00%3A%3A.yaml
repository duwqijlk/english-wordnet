simpleMeaning: A person who owns or runs a place where guests pay to stay.
scope: A person who owns or runs a place to stay; hotelkeeper and hotelier are other names for this sense,
  not a worker who greets guests and not a worker who cleans rooms.
examples:
- The hotel manager offered us a better room.
- She wrote to the hotel manager about the noise.
