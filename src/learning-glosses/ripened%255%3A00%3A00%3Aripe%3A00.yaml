simpleMeaning: of wine, fruit, or cheese, having reached the state that is wanted or the final state;
  the word aged for this is said in one sound
scope: 'Also called aged: wine, fruit, or cheese kept until it is at its best, not food that is still
  hard and not yet ready to eat.'
examples:
- They served ripened cheese that had been kept until it was ready.
- She chose a ripened melon that was soft and sweet.
