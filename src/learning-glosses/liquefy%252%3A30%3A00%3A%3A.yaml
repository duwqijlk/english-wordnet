simpleMeaning: to change so that it can flow like water when it is heated
scope: 'Also called flux and liquify: to change so that it can flow like water when heated, not to make
  something else change like that.'
examples:
- The butter liquefied in the hot pan.
- Frozen fat will liquefy when it is heated slowly.
