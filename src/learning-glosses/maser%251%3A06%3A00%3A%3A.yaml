simpleMeaning: A device that amplifies microwaves by making atoms give off radiation in step, like a laser
  does with light; the name stands for microwave amplification by stimulated emission of radiation.
scope: A microwave amplifier that works by stimulated emission, as a laser does with light; not a laser
  itself, and not an ordinary electronic amplifier.
examples:
- Astronomers use a maser to pick up faint microwave signals from space.
- A maser produces a tight beam of microwaves, much like a laser produces a beam of light.
