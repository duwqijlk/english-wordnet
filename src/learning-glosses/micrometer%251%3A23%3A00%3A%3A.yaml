simpleMeaning: One millionth of the main unit of length, this counts how long very small things are
scope: 'Another name for a micrometre or micron: one millionth of the main unit of length, not the screw
  tool that measures small things and not a unit of weight.'
examples:
- A human hair is about 70 micrometers wide.
- The cell was only five micrometers across.
