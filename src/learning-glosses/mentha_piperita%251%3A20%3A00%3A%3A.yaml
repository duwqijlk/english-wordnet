scope: Also called peppermint; a herb that gives a sharp-smelling oil, not a sweet herb and not a plant
  grown only for its leaves.
examples:
- She crushed Mentha piperita leaves to release the sharp smell.
- Mentha piperita is grown for the oil in its leaves.
