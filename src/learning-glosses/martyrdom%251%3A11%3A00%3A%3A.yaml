simpleMeaning: a death put on a person because they keep to their religious belief or to a cause
scope: A real death because a person keeps to their belief or cause; not a painful experience that is
  not a death.
examples:
- His martyrdom came when he was killed for refusing to give up his faith.
- People still remember her martyrdom for the beliefs she would not give up.
