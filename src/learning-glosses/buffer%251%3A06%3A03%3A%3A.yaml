simpleMeaning: In computers, a part of memory holding data briefly while it waits to be sent to a device,
  evening out the different speeds of the parts of the computer
scope: In computers, a part of memory holding data briefly while it waits to be sent to a device, evening
  out the different speeds of the parts of the computer; not a tool for polishing and not a safe space
  between enemies.
examples:
- The computer holds the sound in a buffer before playing it.
- Data waits in a buffer until the printer is ready.
