senseId: 'ion-exchange_polymer%1:27:01::'
synsetId: 92426111-n
simpleMeaning: A material that does not dissolve, normally formed as tiny pale beads from long-chain organic
  molecules, and takes up one kind of charged particle while releasing another.
scope: This is the solid bead material itself, also sold under the name ion-exchange resin, not the process
  of swapping charged particles and not a soluble powder.
examples:
- Engineers packed the column with an ion-exchange polymer to purify the solution.
- The spent ion-exchange polymer was rinsed with acid and reused.
