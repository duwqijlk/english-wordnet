simpleMeaning: To put an opening passage before the main part of a talk or book
scope: 'Also called introduce and premise: to put an opening passage before the main part of a talk or
  book, not to come before in time or in place.'
examples:
- He precedes each chapter with a short note.
- She precedes her talks with a story from her own life.
