simpleMeaning: a person who knows a lot about money and studies facts such as credit, sales, and money
  put into businesses, to tell a business what to do
scope: A person who studies money facts to guide a business, not a person who treats minds by talking,
  and not just anyone who looks at data.
examples:
- The analyst studied the sales figures before the meeting.
- An analyst warned the company that costs were rising.
