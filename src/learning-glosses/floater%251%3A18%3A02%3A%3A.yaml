senseId: 'floater%1:18:02::'
synsetId: 10116494-n
simpleMeaning: A voter who casts a vote more than once, at different polling places in the same election,
  against the law.
scope: A voter who votes against the law at different polling places in the same election, not a debt
  paper with a changing rate of interest, not an insurance policy for things that move, not spots seen
  before the eyes, not a thing that floats, not a wanderer with no home, and not a swimmer who floats
  in the water.
examples:
- The floater cast votes at three polling places in one election.
- Police caught the floater voting twice on the same day.
