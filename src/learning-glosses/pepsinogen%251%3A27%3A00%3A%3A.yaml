simpleMeaning: a stuff kept in the walls of the stomach that comes before pepsin, and is turned into pepsin
  by the strong acid in the stomach
scope: A stuff kept in the stomach walls that turns into pepsin, not pepsin itself and not stomach acid.
examples:
- Pepsinogen is stored in the stomach walls until it is needed.
- Acid in the stomach turns pepsinogen into pepsin.
