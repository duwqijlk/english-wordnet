simpleMeaning: In an operation, stuff that does not belong and dead flesh are cut away from a wound, so
  that infection is stopped and the wound can heal
scope: During an operation, a wound has stuff that does not belong and dead flesh cut away from it, to
  stop infection and help it heal.
examples:
- Debridement cleaned the wound so it could heal.
- Debridement took the dead flesh out of the wound.
