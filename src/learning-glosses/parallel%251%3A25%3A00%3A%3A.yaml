simpleMeaning: In mathematics, one line or flat surface from a set of lines or surfaces that stay the
  same distance apart and never meet
scope: In mathematics, one of a set of lines or flat surfaces that never meet, not an imaginary line round
  the Earth and not the act of making things run side by side.
examples:
- Draw a parallel to this line through the point.
- The two parallels run side by side forever.
