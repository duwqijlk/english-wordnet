senseId: 'operation%1:22:01::'
synsetId: 13546752-n
simpleMeaning: The way something works or behaves.
scope: The way something works or behaves - not the act of running or managing a machine or business,
  not the practical steps of a job, not a calculation, not computer data handling fixed by a rule, not
  a medical procedure, not a military action, not a business, not a planned group activity, not a mental
  act, and not the state of being in force.
examples:
- Engineers monitored the pump's operation throughout the test run.
- Strong winds can affect the operation of a small aircraft.
