simpleMeaning: It acts on the brain and the cord that runs down the back, and so brings down high blood
  pressure; this drug is sold under the name Wytensin
scope: A drug that brings down high blood pressure by acting on the brain and the cord in the back, not
  a drug that works in a different way and not a drug for pain.
examples:
- Her doctor gave her guanabenz for her high blood pressure.
- Guanabenz helped bring his blood pressure down.
