simpleMeaning: a small hard-backed insect that bores through the outer skin of evergreen trees and eats
  the soft layer under it, which in time kills the tree
scope: A small hard-backed insect that bores through the outer skin of evergreen trees and eats the soft
  layer under it, which in time kills the tree; not a woodpecker and not an insect that eats leaves.
examples:
- Spruce bark beetles killed whole stands of spruce.
- The spruce bark beetle bores into the tree's outer skin.
