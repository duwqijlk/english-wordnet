simpleMeaning: Cup-shaped flowers with petals deep yellow to scarlet and bent back grow on this plant
  of the south-east United States.
scope: Also called a leopard lily and a pine lily, this plant of the south-east United States bears cup-shaped
  flowers, not the east Asian kind with large reddish-orange black-spotted flowers.
examples:
- In the south-east United States, tiger lily plants grow.
- You can tell the tiger lily by its cup-shaped flowers and bent-back petals.
