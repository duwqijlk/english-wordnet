simpleMeaning: to make something by looping thread or yarn through itself again and again
scope: This is making something by looping thread or yarn, not the finished needlework made in this way,
  and not the other verb sense, which is about making needlework with a hooked needle.
examples:
- She crocheted a warm blanket for the baby.
- He is learning to crochet a hat from soft yarn.
