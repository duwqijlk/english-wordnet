simpleMeaning: to protect a place by digging long, narrow, deep holes in the ground all around it
scope: To protect a place by digging long, narrow holes all around it. It is not just digging one such
  hole, and not putting things into such a hole.
examples:
- The general trenched his camp to keep the enemy out.
- They trenched the town by digging a deep ditch all around it.
