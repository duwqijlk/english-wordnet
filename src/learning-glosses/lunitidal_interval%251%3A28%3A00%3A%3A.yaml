senseId: 'lunitidal_interval%1:28:00::'
synsetId: 15295683-n
simpleMeaning: The time between the moon crossing a fixed line over one place and the next high water
  there.
scope: This is the time between the moon crossing a fixed line and the next high water there, not the
  time between two high waters and not the whole day of the moon.
examples:
- The lunitidal interval here is about six hours.
- Sailors used the lunitidal interval to foretell the next high tide.
