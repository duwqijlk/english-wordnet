simpleMeaning: about a way of thinking that holds people have worth and can reach a full life by clear
  thought and the methods of science, and that often rejects religion
scope: 'Also called humanist: this is the way of thinking that puts people''s worth, clear thought, and
  science first and often turns away from religion; it is not the sense about care for people''s welfare
  and not the sense about learning in Renaissance times.'
examples:
- 'She holds humanistic ideas: people have worth and can reach a full life by thinking for themselves.'
- The school took a humanistic view and put science and clear thinking before religion.
