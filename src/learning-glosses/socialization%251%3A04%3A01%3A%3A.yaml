simpleMeaning: the act of meeting other people and spending time with them
scope: Also called socializing, socialising, and socialisation. This is meeting people to spend time with
  them, not learning the habits of a group and not putting a country or business on a socialist basis.
examples:
- Most of his socialization happened at weekend dinners with old friends.
- She enjoyed socialization with the other students after class.
