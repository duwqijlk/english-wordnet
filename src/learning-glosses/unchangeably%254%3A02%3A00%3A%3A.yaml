simpleMeaning: In a firm, unchanging way.
scope: This sense is also called unalterably and unassailably, for a firm, unchanging way, unlike the
  sense for a set, unchanging way, and unlike the sense for a fixed, unchanging way.
examples:
- They spoke unchangeably, in a firm way.
- They stood unchangeably, unchanging.
