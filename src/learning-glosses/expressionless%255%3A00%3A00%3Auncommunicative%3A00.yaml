simpleMeaning: showing no feeling on purpose, with a face and manner that give nothing away
scope: 'Also called impassive: a face or manner that shows no feeling on purpose, not a face that is simply
  tired or dull.'
examples:
- His face remained expressionless as the verdict was read.
- She answered in an expressionless voice, giving nothing away.
