simpleMeaning: A cactus from Brazil that grows on trees, widely kept as a houseplant, with jointed flat
  segments and usually rose-purple flowers that bloom in winter.
scope: Also called Christmas cactus and Schlumbergera baridgesii; not a desert cactus and not a plant
  with yellow flowers.
examples:
- The Schlumbergera buckleyi bloomed rose-purple in winter.
- She kept a Schlumbergera buckleyi on the windowsill.
