simpleMeaning: a stone that forms crystals and can be cut and polished to set in jewelry
scope: A stone that forms crystals and can be cut and polished for jewelry, also called stone and gemstone;
  not a stone already set in a ring, not a sweet bread, and not a fine person.
examples:
- The gem was cut and set in a ring.
- They found a gem of rare size in the mine.
