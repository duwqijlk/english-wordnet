senseId: 'act_of_terrorism%1:04:00::'
synsetId: 00761047-n
simpleMeaning: Ordinary people are attacked, or threatened with attack, in a planned way to win political,
  religious, or belief-based ends, by frightening them, forcing them, or filling them with fear.
scope: This is a planned attack, or threat of attack, on ordinary people for political, religious, or
  belief-based ends, also called terrorism and terrorist act.
examples:
- The act of terrorism was meant to frighten ordinary people.
- An act of terrorism uses threats to force a change in the law.
