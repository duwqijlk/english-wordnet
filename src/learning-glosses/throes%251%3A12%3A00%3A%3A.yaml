simpleMeaning: very strong, sharp pains that come with great suffering
scope: Very strong pains that come with suffering, as in death throes; not light pain, and not the effort
  of doing something hard.
examples:
- He lay in the throes of a high fever, shaking with pain.
- The old dog was in its death throes.
