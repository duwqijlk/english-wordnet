simpleMeaning: The rooms, usually spoken of in the plural, where the work of running a business is done
scope: Also called headquarters, central office, home base and home office, this is the place where a
  business is run from, not a small local branch and not a shop floor.
examples:
- The main office moved to New York last year.
- She called the main office to ask about the job.
