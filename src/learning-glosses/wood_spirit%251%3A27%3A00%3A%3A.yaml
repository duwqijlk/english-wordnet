simpleMeaning: a light liquid that poisons, dries into the air fast, and burns easily, used to keep water
  from freezing, dissolve things, burn as fuel, and make liquor unfit to drink
scope: Also called methanol, methyl alcohol, and wood alcohol, a poisonous liquid that dries into the
  air fast, not the alcohol in drinks.
examples:
- Wood spirit was added to the fuel to keep it from freezing.
- A spill of wood spirit can poison, so workers handle it with care.
