simpleMeaning: In law, getting a person to swear to something false in a court case
scope: In law, getting a person to swear to something false in a court case; not the wider act of getting
  someone to do any wrong thing, and not lying under oath yourself.
examples:
- He was found guilty of subornation of perjury for paying a witness to swear to a lie.
- Subornation of perjury means getting a witness to make a false oath in court.
