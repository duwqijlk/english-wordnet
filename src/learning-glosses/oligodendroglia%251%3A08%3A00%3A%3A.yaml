simpleMeaning: Flat parts of support cells in body tissue form the fatty coat round nerve threads.
scope: Also called oligodendria, it is body tissue of support cells that wrap nerve threads in a fatty
  coat.
examples:
- Oligodendroglia build the fatty coat round the nerve fibres.
- Without oligodendroglia, nerve fibres would lose their fatty coat.
