simpleMeaning: a tiny living part, a man's seed or a woman's egg, that hands DNA, the body's plan for
  life, to the next young
scope: A tiny living part that passes the body's plan for life to the next young, not an ordinary part
  of the body that does work and stays in the body.
examples:
- The doctor said the germ cell carries the plan for life to the next child.
- A germ cell from the mother joined one from the father.
