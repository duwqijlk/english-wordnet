simpleMeaning: to cause someone or something to lose the respect of others
scope: To cause someone or something to lose the respect of others, not the painful feeling itself, and
  not making a person act by making them feel that feeling.
examples:
- He shamed his family by stealing from his neighbours.
- The soldier shamed his unit by running away in battle.
