senseId: 'chi-square_statistic%1:09:01::'
synsetId: 92440864-n
simpleMeaning: A number measuring how observed results differ from expected ones, used in tests of fit
  (how well data match a predicted pattern), in checks of independence, and to estimate spread.
scope: This is the calculated number itself, not the chi-square test that produces it or the distribution
  it is compared with.
examples:
- The chi-square statistic was 12.4, far above the critical value for that test.
- Researchers reported a chi-square statistic of 3.1 and found no significant difference between the groups.
