simpleMeaning: A burner where burning fuel vapour comes out of a small opening to make a steady flame.
scope: This is a burner where burning fuel vapour comes out of a small opening to make a steady flame;
  gas burner is another name for this sense, not a candle and not a heater that runs on wires.
examples:
- He lit the gas jet under the kettle.
- The gas jet gave a steady blue flame.
