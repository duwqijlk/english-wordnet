simpleMeaning: a normal court order that tries to make a court decision happen by letting a sheriff (a
  court officer) carry it out for the person who won the case
scope: This is a court order that lets an officer carry out a decision, not signing a contract or deed
  to make it count in law, and not doing a task.
examples:
- The court issued an execution so the sheriff could take the man's goods to pay the debt.
- The judge signed the execution, and the sheriff went to carry out the order.
