simpleMeaning: A belief, or a set of beliefs, that a group or school takes as true and follows.
scope: This is a belief, or a set of beliefs, that a group or school takes as true; philosophy is another
  name for this sense, not a single opinion or a rule or law.
examples:
- The party's doctrine shaped every policy it put forward.
- She studied the doctrine of the early church for her degree.
