simpleMeaning: strongly connected through shared feelings, interests, or relationship.
scope: This is not about being near in distance and not about being shut; it describes a strong personal
  or working connection.
examples:
- She has been a close friend of mine since school.
- The two countries have close ties in trade and culture.
