simpleMeaning: the act of making spots or marks on something
scope: The act of making spots or marks on something, not the use of dye to colour samples for study;
  spotting is another name for this sense.
examples:
- The staining of the cloth spoiled its look.
- Staining the wood darkened it and brought out the grain.
