simpleMeaning: A person whose work is painting the inside or outside of homes and other buildings.
scope: A person who paints homes and other buildings for a living, not a person who paints pictures and
  not a person who builds homes.
examples:
- The house painter finished the front of the cottage in a day.
- We hired a house painter to do the hall and stairs.
