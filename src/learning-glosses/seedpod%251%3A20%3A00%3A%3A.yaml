simpleMeaning: the fruit of a plant such as a pea or bean plant, which holds several seeds and opens when
  ripe to let them out
scope: 'Also called pod: the seed case of a pea or bean type plant that opens when ripe, not a single
  seed on its own.'
examples:
- The seedpod split open and the peas fell out.
- She picked a dry seedpod from the bean plant.
