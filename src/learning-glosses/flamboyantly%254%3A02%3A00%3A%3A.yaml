simpleMeaning: in a bright, showy way, full of colour and decoration
scope: This is doing something in a bright, showy way; showily and flashily are other names for this sense.
  Not in a plain, simple way.
examples:
- He dressed flamboyantly in a bright red coat and a yellow hat.
- She walked flamboyantly across the room in a long purple dress.
