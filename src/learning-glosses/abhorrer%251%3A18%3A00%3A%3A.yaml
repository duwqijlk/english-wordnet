simpleMeaning: those who asked for parliament to meet again were denounced and hated by one of the people
  who signed a 1679 letter to Charles II
scope: It is the name for a signer of the 1679 address to Charles II, one of those who denounced and hated
  the men who asked for parliament to meet again.
examples:
- The abhorrer signed the address of 1679.
- As an abhorrer, he stood against those who wanted parliament called back.
