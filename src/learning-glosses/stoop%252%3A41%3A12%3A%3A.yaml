senseId: 'stoop%2:41:12::'
synsetId: 02523493-v
simpleMeaning: to do something so low and wrong that it brings shame on you and people lose respect for
  you
scope: This is the sense about doing something low and wrong. It is not bending your head and back forward,
  and not bending down from the waist.
examples:
- I won't stoop to cheating just to win the game.
- He stooped to lying about his friend to get the job.
