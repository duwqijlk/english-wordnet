simpleMeaning: the armed forces reading and holding back letters and messages sent to and from the people
  they hold, both fighters they have caught and other people they keep inside
scope: The armed forces' checking of mail to and from the people they hold in war, not the checking of
  news in papers and not the checking of mail in a normal jail.
examples:
- Prisoner of war censorship meant that his letter home was read first.
- Under prisoner of war censorship, no news of the camp could leave.
