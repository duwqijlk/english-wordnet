simpleMeaning: the main part of a person or animal, not counting the head, neck, arms, or legs
scope: 'Also called body: the main middle part of a person or animal, not an elephant''s long nose, not
  the main part of a tree, and not a large travel case.'
examples:
- He kept his arms still and turned only his trunk toward her.
- The doctor checked the man's trunk for cuts after the fall.
