simpleMeaning: This bent piece of wire or plastic holds thin sheets used for writing together
scope: 'Another name for a paperclip or gem clip: a fastener that holds loose sheets together, not a staple
  that pierces the sheets and not a folder that keeps sheets in a case.'
examples:
- She fastened the two pages with a paper clip.
- He took the paper clip off the stack of letters and put it in the drawer.
