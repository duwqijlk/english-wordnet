simpleMeaning: the heart, blood tubes, and other body parts that move blood and lymph, a clear fluid,
  all through the body
scope: The heart, blood tubes and other body parts that move blood and lymph through the body; cardiovascular
  system is another name for this sense, and it is not just the heart alone or just the blood tubes alone.
examples:
- The circulatory system moves blood and lymph to every part of the body.
- Exercise helps the circulatory system work well.
