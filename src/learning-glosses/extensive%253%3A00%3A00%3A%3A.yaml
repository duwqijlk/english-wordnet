simpleMeaning: In farming, getting more out of the land by using big fields with little money and little
  work
scope: In farming, big fields worked with little money and work, not land used in a big way in general.
examples:
- They grew wheat under extensive conditions on the big open plains.
- Extensive farms use large fields and few workers.
