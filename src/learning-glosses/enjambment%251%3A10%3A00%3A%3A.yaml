simpleMeaning: when words that belong together in a poem do not stop at the end of a line but keep going
  into the next line
scope: 'Also called enjambement: when a group of words runs on from one line of a poem into the next,
  not a line that ends with a full stop and not a new thought starting on the next line.'
examples:
- The enjambment makes the reader rush on to the next line to finish the thought.
- His enjambment lets the phrase spill over the line break without a pause.
