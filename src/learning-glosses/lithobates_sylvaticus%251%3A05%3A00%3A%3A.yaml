simpleMeaning: A light brown frog found over a wide area in the damp woods of North America, most of all
  where spruce grows.
scope: This is a frog of damp woods in North America, found most of all where spruce grows; wood-frog,
  wood frog and Rana sylvatica are other names for this sense.
examples:
- We heard a Lithobates sylvaticus calling from the wet woods at dusk.
- A Lithobates sylvaticus sat still on the damp leaves under the spruce trees.
