simpleMeaning: a form or model that stands for a whole kind of thing
scope: A form that stands for a whole kind, not the act of representing by a type and not just any single
  thing of that kind.
examples:
- The old farmhouse was a typification of rural life.
- Her story served as a typification of the town's spirit.
