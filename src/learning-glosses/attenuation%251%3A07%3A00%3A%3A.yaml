simpleMeaning: the state of something that has been made weaker, thinner, or less dense
scope: The state of a thing that has been made weaker or thinner, not the act of making it so and not
  a thing that is weak by nature.
examples:
- The attenuation of the signal made the radio hard to hear.
- Engineers measured the attenuation of the light as it passed through the glass.
