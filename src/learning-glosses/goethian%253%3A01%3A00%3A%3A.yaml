senseId: 'goethian%3:01:00::'
synsetId: 03043733-a
simpleMeaning: Goethe's way of doing things is what this word marks, and also the things that belong to
  him.
scope: Also called Goethean; a word for Goethe's way of doing things and the things that belong to him,
  not for the way of another writer and not for the German tongue.
examples:
- The essay took a Goethian view of the plant world.
- His Goethian manner of writing made the poem calm and clear.
