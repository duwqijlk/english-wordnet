simpleMeaning: Looking like the kawaka, a tree of that land, this tree of New Zealand keeps its leaves
  all year
scope: 'Also called mountain pine: a tree of New Zealand that keeps its leaves all year, not a pine of
  the far north and not a tree that drops its leaves in winter.'
examples:
- The pahautea grows tall in the wet woods of New Zealand.
- We saw a pahautea with dark green leaves beside the track.
