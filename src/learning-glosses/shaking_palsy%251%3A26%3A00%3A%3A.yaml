simpleMeaning: Marked by trembling and by muscles that no longer work smoothly together, it is a sickness
  of the nerves of the brain and spine that slowly gets worse.
scope: Also called paralysis agitans, it is a sickness of the nerves that slowly gets worse, not a short
  shaking that passes.
examples:
- He trembled from the shaking palsy.
- Her shaking palsy grew worse over time.
