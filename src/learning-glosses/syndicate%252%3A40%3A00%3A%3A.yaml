simpleMeaning: to sell written pieces, television shows, or photos to several publications or to separate
  radio and television stations
scope: This is the act of selling written pieces, shows, or photos to several publications or to separate
  radio and television stations; it is not the group of people or businesses that does this, and not the
  act of forming such a group.
examples:
- The newspaper syndicated her weekly column to papers all over the country.
- He syndicates his travel photos to magazines in several countries.
