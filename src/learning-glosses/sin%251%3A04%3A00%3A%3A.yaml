simpleMeaning: an act that people who study religion see as going against what God wants
scope: This is an act that people who study religion see as going against what God wants; not the number
  used in maths for the sides of a triangle, and not doing such an act as a verb.
examples:
- Stealing was counted as a sin in his church.
- She asked for forgiveness for her sins.
