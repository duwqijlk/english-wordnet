simpleMeaning: one of the two roots of a nerve of the spine, coming out of the front of the cord, built
  of fibres that send orders out to the muscles
scope: 'Also called ventral horn, anterior horn, and anterior root: a root of a nerve of the spine, sending
  orders out to the muscles; not the back root, which brings feeling in.'
examples:
- The ventral root leaves the front of the spinal cord.
- Each ventral root carries orders from the cord to the muscles.
