simpleMeaning: Money borrowed that you pay back in the same amount each time, plus a fee for the loan
scope: Money borrowed and paid back in equal amounts over time, also called an installment loan; not a
  loan paid back all at once and not a gift of money.
examples:
- She took out installment credit to buy the car and paid it off over two years.
- The store offers installment credit on large items, with the same payment due each month.
