simpleMeaning: In British informal use, the air in a place that has no fresh air and is full of smoke
  and bad smells
scope: A British informal word for heavy, smoky, bad-smelling air in a place, not fresh clean air and
  not smoke from a fire outside.
examples:
- A thick fug hung in the small, crowded pub.
- She opened the window to clear the fug in the room.
