simpleMeaning: a hard covering on the end of a leg, split in two at its tip, as on cows, deer or pigs
scope: A hard leg-end covering split in two at its tip, as on cows, deer or pigs; cloven hoof is another
  name for this, not a single undivided covering and not a soft paw.
examples:
- The goat's cloven foot showed two clear marks.
- Pigs have a cloven foot with two toes.
