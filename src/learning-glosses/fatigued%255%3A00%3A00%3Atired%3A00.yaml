simpleMeaning: with no energy left to work well, extremely tired, and fully worn out
scope: 'Also called spent, gone, exhausted, and fagged: so tired that no strength is left, not just a
  little tired and not sleepy for a short time.'
examples:
- After the long walk, the children were too fatigued to eat.
- He felt fatigued after working all day without rest.
