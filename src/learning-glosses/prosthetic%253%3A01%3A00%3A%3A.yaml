simpleMeaning: relating to or used as a part made by people to take the place of a missing body part
scope: This describes a part made to take the place of a missing body part, not the study or making of
  such parts as a field of work.
examples:
- She walks well with her prosthetic leg.
- He uses a prosthetic hand to hold a cup.
