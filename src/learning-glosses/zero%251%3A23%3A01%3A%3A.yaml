simpleMeaning: A number that, when added to another number, leaves that number just as it was
scope: The number that leaves any other number unchanged when added to it, not the starting mark on a
  scale and not a gun sight setting.
examples:
- Five plus zero is still five.
- Add zero to the sum and it stays the same.
