simpleMeaning: In physics, the set number that is the same for all, that links force to mass and distance
  in Newton's law of pull.
scope: A set number in physics, not a unit of force and not a letter; also called the constant of gravitation,
  the gravitational constant, and the universal gravitational constant.
examples:
- G links force, mass, and distance in Newton's law.
- Physicists use G to work out the pull between two masses.
