simpleMeaning: A mark on blood cells that some people carry; if a person without it gets blood from one
  with it, it can break down red cells and bring on anaemia
scope: This blood mark is also called the rhesus factor and the Rh factor; it is not the ABO blood group
  and not the Rh metal.
examples:
- The test showed she was Rh positive.
- Rh negative blood was given to the patient.
