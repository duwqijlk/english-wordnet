simpleMeaning: All over Europe in the Middle Ages, this gold coin from the old eastern Roman lands passed
  from hand to hand.
scope: Also called a bezant, a bezzant, or a byzant, this gold coin passed from hand to hand all over
  Europe in the Middle Ages.
examples:
- A solidus of the old eastern Roman lands was once used all over Europe.
- In the Middle Ages, a solidus passed from hand to hand all over Europe.
