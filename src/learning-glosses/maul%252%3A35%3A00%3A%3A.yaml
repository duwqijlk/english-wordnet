simpleMeaning: to attack a person or animal so hard with blows that they are badly hurt
scope: This is hurting someone badly by beating them; mangle is another name for this sense; not the heavy
  hammer, and not splitting wood.
examples:
- The bear mauled the hunter before help arrived.
- He was mauled in the fight and taken to hospital.
