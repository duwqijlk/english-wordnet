simpleMeaning: something showy that is used to make things look good, but has almost no real worth
scope: This is a showy thing with almost no real worth, not the real thread with shiny metal pieces, and
  not the act of putting that thread on something.
examples:
- All the tinsel of fame did not make him happy.
- The show was full of tinsel, with bright lights but no real feeling.
