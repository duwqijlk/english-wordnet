simpleMeaning: The lower jaw is lifted to shut the mouth by a band of flesh that joins the hollow at the
  side of the head to its bony point.
scope: 'Also called musculus temporalis, temporalis, and temporalis muscle: the band of flesh at the side
  of the head that lifts the lower jaw to shut the mouth.'
examples:
- The temporal muscle tightens when you clench your teeth.
- A sore temporal muscle can make chewing hurt.
