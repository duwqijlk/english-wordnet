senseId: 'delphinium%1:20:00::'
synsetId: 11753523-n
simpleMeaning: Any plant of a group with hand-shaped, deeply cut leaves and showy spikes of many-colored
  flowers that have a spur at the back; some kinds are extremely poisonous.
scope: The plant as a whole, not just its flower spike; it covers all kinds in the group rather than one
  named species, and only some of them are poisonous.
examples:
- Tall delphiniums lined the back of the flower bed in shades of blue.
- The gardener warned that some delphiniums are poisonous if eaten.
