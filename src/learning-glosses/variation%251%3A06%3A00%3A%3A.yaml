simpleMeaning: a made thing that is not quite like the usual kind, but is a bit different from it
scope: A made thing that differs a little from the usual kind, not the act of changing something and not
  a change in a planet's path or a musical theme.
examples:
- He patented a variation on the sandal.
- This variation on the old chair has shorter legs.
