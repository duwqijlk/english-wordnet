simpleMeaning: Any of many weedy plants of the genus Ambrosia, mostly from North America, whose pollen
  is highly allergenic and causes much hay fever and asthma.
scope: This is the ragweed group in the genus Ambrosia, not a single species and not other plants that
  share the name bitterweed. Its pollen is a well-known cause of hay fever and asthma.
examples:
- The pasture was thick with bitterweed, and her hay fever began as soon as she went outside.
- Bitterweed pollen fills the air across the plains each autumn.
