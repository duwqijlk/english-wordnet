scope: 'Also called borscht circuit, borsht belt, and borsht circuit: a holiday area in the Catskill Mountains
  once favoured by Jewish guests, not a belt worn round the waist.'
examples:
- Many comedians learned their trade playing the borscht belt.
- Jewish families spent their summers in the borscht belt.
