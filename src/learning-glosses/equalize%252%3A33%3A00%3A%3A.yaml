senseId: 'equalize%2:33:00::'
synsetId: 01117829-v
simpleMeaning: to do something that makes up for a difference, and to make the score of both sides the
  same
scope: This is about making up for a difference and bringing the score of both sides to the same in a
  game; it is not the wider sense of making things the same in size, amount or value.
examples:
- She scored late in the game to equalize for her team.
- The extra pay equalized what the workers had lost in the earlier months.
