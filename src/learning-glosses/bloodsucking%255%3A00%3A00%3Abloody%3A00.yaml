simpleMeaning: Feeding on blood drawn from the body of another creature.
scope: Drawing blood from the body of another creature, not living off another like a parasite or a leech.
examples:
- The insects were bloodsucking, leaving red marks on the skin.
- The leeches were bloodsucking and clung to the horses' legs.
