simpleMeaning: the act of standing against a thing because you think it is wrong or do not agree with
  it
scope: 'Also called resistance: the act of standing against a thing you disapprove of or disagree with,
  not a body of armed enemies and not a group of people joined against a thing.'
examples:
- He faced opposition from the newspapers but went ahead.
- Despite strong opposition, the plan was passed.
