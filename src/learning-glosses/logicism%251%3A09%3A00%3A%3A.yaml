simpleMeaning: In philosophy, the idea that all of mathematics can be worked out from a strict set of
  rules for sound thinking.
scope: In philosophy, this is the idea that all of mathematics comes from formal logic, not the idea that
  it comes from the mind alone and not the idea that it is only a game of signs.
examples:
- Logicism claims that mathematics rests on logic alone.
- Russell defended logicism in his early work.
