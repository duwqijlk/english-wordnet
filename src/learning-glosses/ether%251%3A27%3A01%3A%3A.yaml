simpleMeaning: in old thought, the fifth and highest stuff of the world, after air, earth, fire and water,
  said to make up all the things in the sky
scope: In old thought, the fifth and highest stuff of the world, said to make up all the things in the
  sky; not the liquid used to put people to sleep, not a chemical, and not the stuff once thought to fill
  space.
examples:
- In old stories, the ether was the stuff of the stars.
- The Greeks held that ether made up the heavens.
