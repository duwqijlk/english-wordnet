simpleMeaning: Any of a kind of vine whose fruit has a smooth white skin and white or greenish flesh with
  no musky smell
scope: This is a vine whose fruit has a smooth white skin; honeydew melon, winter melon, winter melon
  vine and Cucumis melo inodorus are other names for it, not the fruit itself and not a vine whose fruit
  smells musky.
examples:
- Persian melon vines bear fruit with white flesh.
- The Persian melon has a smooth white rind and no musky smell.
