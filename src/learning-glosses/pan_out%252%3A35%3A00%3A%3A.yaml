simpleMeaning: To wash dirt in a wide flat dish so the costly bits stay behind
scope: To wash dirt in a wide flat dish so the costly bits stay behind; pan and pan off are other names
  for it, not washing clothes and not sifting flour.
examples:
- They would pan out the river dirt for gold dust.
- She watched him pan out a panful of black sand.
