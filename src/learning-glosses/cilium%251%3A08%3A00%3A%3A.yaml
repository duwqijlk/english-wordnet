simpleMeaning: a short hair that curves and grows from the rim of an eye lid
scope: This is a short hair that curves and grows from the rim of an eye lid; eyelash and lash are other
  names for this sense, and it is not a hair-like part on a tiny one-celled living thing.
examples:
- A cilium fell into her eye and made it water.
- He brushed a loose cilium from his cheek.
