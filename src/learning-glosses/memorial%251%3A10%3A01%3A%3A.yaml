simpleMeaning: A paper that sets out facts and is sent with a plea to those in charge.
scope: This is a written statement of facts sent with a plea to those in charge, not a thing put up to
  keep a person or event in mind.
examples:
- He sent a memorial to the governor asking for help.
- The memorial set out the facts of the case.
