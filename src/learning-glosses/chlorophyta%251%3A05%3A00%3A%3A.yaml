simpleMeaning: A group of mainly fresh-water algae with chlorophyll a and b, storing food as starch, with
  cellulose walls, in classes Chlorophyceae, Ulvophyceae, and Charophyceae, and the ancestor of land plants.
scope: Also called division Chlorophyta; a big group of fresh-water algae, not a single kind of seaweed
  and not a land plant.
examples:
- Chlorophyta includes the green algae of fresh water.
- Most Chlorophyta store food as starch.
