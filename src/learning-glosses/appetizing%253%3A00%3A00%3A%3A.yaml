simpleMeaning: making you want to eat, especially because of how food looks or smells
scope: Also called appetising. This is about food that looks or smells good and makes you want to eat,
  not about food that is good only in taste.
examples:
- The warm bread looked appetizing on the table.
- She put out an appetizing plate of food with bright colors and a good smell.
