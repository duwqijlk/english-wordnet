simpleMeaning: Horses or cattle that browse or graze feed on this bulky plant food, like grass or hay.
scope: Grass, forage, pasture and pasturage are other names for this bulky plant food for horses or cattle
  that browse or graze.
examples:
- The horses ate the eatage put out for them.
- The cattle lived on eatage of hay and grass.
