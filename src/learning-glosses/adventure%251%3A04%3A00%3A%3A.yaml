simpleMeaning: a wild and exciting thing that someone does, which may or may not break the law
scope: This is a wild, exciting act itself; it is not a book or film about such acts, and it is not a
  safe trip that is fully planned before it starts.
examples:
- Climbing the cliff in the storm was an adventure she never forgot.
- Stealing a boat for a night ride was a wild adventure for the boys.
