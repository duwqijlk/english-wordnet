simpleMeaning: Said of things to do with pluralism, the idea that many kinds of things are real
scope: Said of things that belong to the idea that many kinds of things are real, not of things that belong
  to the idea that one thing alone is real.
examples:
- They lived in a pluralistic culture where many faiths stood side by side.
- Her pluralistic outlook welcomed many different ways of seeing the world.
