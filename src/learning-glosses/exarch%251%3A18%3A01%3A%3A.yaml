simpleMeaning: A bishop in the eastern church who ranks below a patriarch and above a metropolitan, a
  bishop who leads a large church area.
scope: A bishop in the eastern church, below a patriarch and above a metropolitan; not a ruler in the
  Roman Empire and not the patriarch himself.
examples:
- The exarch answered to the patriarch in Constantinople.
- As exarch, he oversaw the bishops of his region.
