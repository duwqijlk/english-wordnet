simpleMeaning: the act of cutting something apart or off, or of ending a link between people or groups
scope: This is the act of cutting something apart or off, or ending a link, also called severance; it
  is not joining things together and not a small piece that has been cut off.
examples:
- The severing of the rope left the boat free to drift away.
- After the severing of ties with the company, he started his own business.
