simpleMeaning: a medium-sized dog breed with a blue-black tongue, a thick coat and a fluffy tail that
  curls, thought to have come from northern China
scope: Another name for the chow chow, a dog breed; not the informal word for food, and not the Tibetan
  terrier.
examples:
- The chow has a blue-black tongue and a thick coat.
- Our chow barked at the mail carrier.
