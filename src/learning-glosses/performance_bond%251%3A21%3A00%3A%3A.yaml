simpleMeaning: a promise in writing that guards the person who receives it from loss if a contract is
  not kept, with a surety company taking the risk
scope: 'Also called a surety bond: a written promise guarding the receiver from loss if a contract is
  not kept, not the contract itself and not an insurance policy for goods.'
examples:
- The builder put up a performance bond before starting work.
- A performance bond covered the client if the work was left undone.
