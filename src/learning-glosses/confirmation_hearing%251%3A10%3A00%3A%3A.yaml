  forward for high federal jobs, then says yes or no to them.
scope: This meeting of the United States Senate gathers facts about people put forward for high federal
  jobs, so the Senate can say yes or no to them.
examples:
- The confirmation hearing for the new judge took place in the Senate.
- Senators asked hard questions at the confirmation hearing.
