simpleMeaning: Too much of the dark stuff that gives skin its colour builds up in the body, and the skin
  is where it most often shows
scope: A state where too much dark colouring stuff builds up in the body, most often in the skin, also
  called melanism; not a single dark spot and not a tan.
examples:
- The melanosis on her arm showed as dark patches on the skin.
- Melanosis can cause dark spots where the dark colouring stuff builds up.
