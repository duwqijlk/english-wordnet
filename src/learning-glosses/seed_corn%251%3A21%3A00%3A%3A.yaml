simpleMeaning: good grains kept back for planting, such as the kernels of a grain crop
scope: This is good grains kept back for planting; seed grain is another name for this sense. Not grain
  kept for eating and not grain kept for feeding animals.
examples:
- The farmer saved his best seed corn for next spring.
- She set aside a sack of seed corn to plant when the frost ended.
