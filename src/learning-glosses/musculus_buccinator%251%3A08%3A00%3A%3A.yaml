simpleMeaning: A face muscle that flattens the cheek and pulls back the corner of the mouth.
scope: A face muscle that flattens the cheek and pulls back the mouth corner; buccinator muscle and cheek
  muscle are other names for it, not a muscle that closes the jaw and not the lips.
examples:
- The musculus buccinator lets you blow out your cheeks.
- When she smiled, the musculus buccinator pulled her mouth wide.
