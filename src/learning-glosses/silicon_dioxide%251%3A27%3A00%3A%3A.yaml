simpleMeaning: 'A white or colorless glassy solid, SiO2, that will not dissolve, occurring widely in the
  earth''s crust in several forms: quartz, cristobalite, tridymite and lechatelierite.'
scope: Another name for silica and silicon oxide — a glassy, insoluble substance, not a particular mineral,
  since quartz is only one of its forms.
examples:
- Silicon dioxide occurs widely in the earth's crust as quartz and other forms.
- The powder was silicon dioxide, a white solid that does not dissolve in water.
