simpleMeaning: Birds that cannot fly, with flat breastbones lacking a keel, the ridge that flight muscles
  attach to; this group includes ostriches, cassowaries, emus, moas, rheas, kiwis, and elephant birds.
scope: This is the ratite group of running birds with flat breastbones and no keel, not a penguin or another
  diving bird that cannot fly.
examples:
- The emu is a large ratite that cannot fly.
- Ratites have flat breastbones with no keel for flight muscles.
