simpleMeaning: feeling sorry for bad things you have done, or showing that you feel sorry for them
scope: 'Penitent is another name for this sense: feeling or showing that you are sorry for bad things
  you have done, unlike a person who is not sorry at all.'
examples:
- The repentant thief said sorry and gave back the money.
- She looked truly repentant after hurting her friend's feelings.
