simpleMeaning: In Yiddish, a person who knows they are important and acts that way, boasting too much
  and without limit
scope: In Yiddish, a person who knows they are important and acts that way, boasting too much; not a door
  knocker, and not a breast.
examples:
- The old knocker bragged about his money all night.
- No one liked the knocker who boasted at every party.
