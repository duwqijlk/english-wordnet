simpleMeaning: Short needles in bunches of two grow on a common small tree of the eastern United States,
  low and bushy, with loose branches that often twist.
scope: This low, bushy tree of the eastern United States has short needles in bunches of two and loose
  branches that often twist.
examples:
- The scrub pine grew low and bushy, with loose branches.
- A scrub pine has short needles in bunches of two.
