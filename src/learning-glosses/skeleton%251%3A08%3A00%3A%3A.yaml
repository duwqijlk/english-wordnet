simpleMeaning: the bones and cartilage (a strong material in the body, not as hard as bone) that hold
  up an animal's body and give it shape
scope: 'Also called frame: this is the bones inside a body, not the basic outline of a plan or story,
  and not a very thin person.'
examples:
- The museum has a skeleton of a large whale.
- Doctors studied the skeleton to learn how the animal moved.
