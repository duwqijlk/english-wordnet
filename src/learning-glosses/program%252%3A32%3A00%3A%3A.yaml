simpleMeaning: to plan the order of events or items for something.
scope: It is not writing code for a computer, and not a show that is already on air, but planning the
  order of items.
examples:
- She programmed the whole festival, from the opening speech to the last concert.
- They programmed the conference so that no two talks overlapped.
