simpleMeaning: A gas with no smell that can kill, made when a fuel burns without enough air.
scope: A gas with no smell that can kill, made when a fuel burns without enough air; carbon monoxide gas
  is another name for this sense, not smoke and not the gas that plants take in.
examples:
- Carbon monoxide has no smell and can kill.
- The faulty heater filled the room with carbon monoxide.
