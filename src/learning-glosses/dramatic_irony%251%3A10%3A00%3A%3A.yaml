simpleMeaning: In theater, a moment when the people watching know what is really going on, but the people
  in the play do not
scope: A gap in knowledge between the watchers and the people in the play, not a joke and not a surprise
  twist in the story.
examples:
- The dramatic irony was lost on the hero, who had no idea the letter was a fake.
- She loved the dramatic irony of the scene, where the crowd knew the truth and the king did not.
