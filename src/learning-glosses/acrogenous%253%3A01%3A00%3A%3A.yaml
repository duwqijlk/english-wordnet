simpleMeaning: only the tip of the main stem puts out new growth in these flowerless plants, such as ferns
  or mosses
scope: Acrogenic is another name for this word, which marks flowerless plants, such as ferns or mosses,
  and not plants that put out growth along the stem.
examples:
- The acrogenous moss grows only at the tip of its main stem.
- The acrogenous fern makes no flowers.
