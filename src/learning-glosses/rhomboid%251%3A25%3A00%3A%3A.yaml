simpleMeaning: Only the sides across from each other are equal in this four-sided flat shape with slanted
  corners, whose sides next to each other are of different lengths.
scope: A four-sided flat shape with slanted corners, whose sides next to each other are of different lengths,
  not a square.
examples:
- Draw a rhomboid with two long sides and two short sides.
- The tile was cut in the shape of a rhomboid.
