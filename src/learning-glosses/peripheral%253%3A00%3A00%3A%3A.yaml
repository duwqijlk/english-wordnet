simpleMeaning: At or near an edge, forming the outer edge of a place or thing.
scope: At or near an edge, forming the outer edge of a place or thing; not a piece of computer equipment.
examples:
- Russia's peripheral provinces lie far from the capital.
- New houses spread into the peripheral suburbs.
