simpleMeaning: clothing for the lower body that covers each leg separately from waist to knee or ankle,
  usually used in the plural
scope: The clothing sense, another name for 'trousers' or 'pair of trousers', not the short gasped breath
  or the puff of steam from an engine.
examples:
- These pants are too tight around the waist.
- He folded his pants and put them in the drawer.
