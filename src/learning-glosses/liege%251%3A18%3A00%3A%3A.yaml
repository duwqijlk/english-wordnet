simpleMeaning: in old times, a person who held land from a lord and owed that lord loyalty and work in
  return
scope: A land-holder who serves a lord, not the lord himself and not the adjective for such loyalty.
examples:
- The liege knelt before his lord and swore to serve him.
- Each liege in the valley owed the lord a share of the harvest.
