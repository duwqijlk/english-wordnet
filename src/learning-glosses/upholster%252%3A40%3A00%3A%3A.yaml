simpleMeaning: to fit chairs and other furniture with soft filling, springs, flat bands of strong cloth,
  and covers
scope: To fill and cover a chair or sofa so it is soft to sit on, not to make its wooden frame and not
  just to clean it.
examples:
- He learned to upholster old chairs in his workshop.
- They paid a man to upholster the sofa with new cloth.
