simpleMeaning: A round plate that can be written on again and read by light, used in tools that join light
  with pull
scope: A round plate that can be written on again and read by light; not a plate that can be written on
  only once and not a tape.
examples:
- She saved the files on a magneto-optical disc.
- The magneto-optical disc could be wiped and used again.
