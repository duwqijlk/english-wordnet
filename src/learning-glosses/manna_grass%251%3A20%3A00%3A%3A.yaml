simpleMeaning: The group called Glyceria holds several kinds of plant that love wet ground, and that taste
  or smell sweet.
scope: Also called sweet grass, it is a moisture-loving plant of the group called Glyceria, known for
  its sweet taste or smell.
examples:
- Manna grass grew where the ground stayed wet.
- She picked some manna grass and breathed in its sweet smell.
