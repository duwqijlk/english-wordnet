simpleMeaning: A sugar-like stuff made when the acid that carries the body's plans is partly split by
  water
scope: A sugar-like stuff made when the acid that carries the body's plans is partly split by water; not
  the whole acid, and not a plain sugar.
examples:
- A nucleoside forms when the acid is split by water.
- The lab made a nucleoside from the acid.
