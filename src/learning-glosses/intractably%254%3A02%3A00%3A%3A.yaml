simpleMeaning: in a way that is hard to manage or bring under control
scope: In a way that is hard to manage or bring under control; not in a way that is merely slow, and not
  in a way that is done on purpose.
examples:
- The problem remained intractably hard even after months of work.
- The child behaved intractably all morning.
