senseId: 'basswood%1:20:00::'
synsetId: 12223453-n
simpleMeaning: a tree of the Tilia genus that sheds its leaves every year, with heart-shaped leaves and
  drooping sprays of small yellowish, often fragrant flowers; some kinds yield valuable timber.
scope: The tree itself, not the soft pale wood cut from it; lime, lime tree and linden are other names
  for this sense.
examples:
- The basswood in the park has heart-shaped leaves and smells sweet when it flowers.
- Basswoods line the old avenue, their drooping clusters of pale flowers opening in June.
