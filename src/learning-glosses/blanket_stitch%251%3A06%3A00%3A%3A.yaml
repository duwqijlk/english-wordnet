simpleMeaning: A strong way of sewing that makes the edges of thick stuff hold, much like sewing a buttonhole.
scope: This is the strong way of sewing used on the edges of thick stuff, much like sewing a buttonhole.
examples:
- She used a blanket stitch along the edge of the thick material.
- Use a blanket stitch to make the edge of the thick material hold.
