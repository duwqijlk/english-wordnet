senseId: 'tremolo%1:11:00::'
synsetId: 07413936-n
simpleMeaning: a shaking sound in a singer's voice, most often one that is too strong or not held steady
scope: This is a shaking sound in a singer's voice; not the shaking sound made by an instrument and not
  a steady, well-held note.
examples:
- Her tremolo grew so wide that the note wobbled.
- The coach told him to calm the tremolo in his singing.
