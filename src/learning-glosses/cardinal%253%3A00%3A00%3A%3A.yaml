senseId: 'cardinal%3:00:00::'
synsetId: 02191250-a
simpleMeaning: describing a number that shows how many there are, not the order they come in
scope: This describes a number that shows amount, not order; it is not the noun that names that number
  itself, and not the sense that means most important.
examples:
- In 'three cats', the word 'three' is a cardinal number.
- Cardinal numbers tell us how many, while words like first and second tell us the order.
