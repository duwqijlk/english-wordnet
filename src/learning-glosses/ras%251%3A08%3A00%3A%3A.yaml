simpleMeaning: The net of nerve cells deep in the brain that wakes the brain up and keeps it alert.
scope: The brain net that wakes and alerts us, also called the reticular activating system; not the whole
  brain and not a nerve of the face.
examples:
- The RAS keeps the brain alert during the day.
- Damage to the RAS can leave a person hard to wake.
