simpleMeaning: a passage in a mine that is level, or nearly level, so it does not go up or down
scope: This is a level passage in a mine. It is also called a drift and also called a heading, not a walking
  way or porch at a building and not people watching a match.
examples:
- The miners walked along the gallery to reach the place where they dug.
- A new gallery was cut level through the rock, deep in the mine.
