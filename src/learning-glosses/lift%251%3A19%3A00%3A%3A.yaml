simpleMeaning: The part of the force that moving air produces on a wing or similarly shaped surface and
  that pushes against gravity.
scope: A force produced when air moves over a wing, not the powered carrier that hauls skiers uphill nor
  the machine that moves people between floors.
examples:
- The plane's wings generate enough lift to keep it in the air at low speed.
- Engineers increased the lift by changing the curve of the wing.
