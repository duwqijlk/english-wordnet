simpleMeaning: the whole set of written rules made by the group that has the power to make rules for a
  country
scope: The whole set of written rules made by the group that makes rules for a country; not rules made
  by judges, and not one single written rule.
examples:
- Statutory law covers most of the rules on driving.
- The lawyer studied statutory law for the case.
