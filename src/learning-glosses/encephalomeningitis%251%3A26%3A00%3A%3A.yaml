simpleMeaning: a sore, swollen state of the brain, the cord that runs down the back, and the thin skins
  that cover them
scope: 'Also called cerebromeningitis and meningoencephalitis: a sore, swollen state of the brain, the
  cord that runs down the back, and the thin skins that cover them, not a swelling of the brain alone
  and not a swelling of the thin skins alone.'
examples:
- The child was in hospital with encephalomeningitis, and the doctors watched her closely.
- Encephalomeningitis can start with a bad headache and a stiff neck.
