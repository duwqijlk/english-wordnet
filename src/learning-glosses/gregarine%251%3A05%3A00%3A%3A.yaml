simpleMeaning: Tiny worm-shaped one-celled animals that live in and feed on insects and other animals
  without backbones.
scope: Tiny worm-shaped animals that live inside insects and other animals without backbones, not a worm
  that lives in soil and not a germ that makes people sick.
examples:
- The gregarine lives inside the gut of a beetle.
- Scientists found gregarines in the bodies of the insects.
