simpleMeaning: for a tool or machine, able to pick up very small changes or differences and show them
  just right
scope: For a tool or machine that picks up very small changes, not a fine lovely thing and not work done
  with great skill.
examples:
- Only the most delicate scales could weigh the tiny sample.
- The delicate meter showed a change too small to see.
