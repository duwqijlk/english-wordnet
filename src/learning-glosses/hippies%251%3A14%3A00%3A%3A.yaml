simpleMeaning: Young, mostly middle-class people from 1960s San Francisco who stood for love for all and
  peace, shared homes, had long hair, took soft drugs, and liked acid and progressive rock
scope: This sense is the 1960s youth group and its way of life, also called hipsters and flower people;
  it is not one person alone and not rock music alone.
examples:
- In the 1960s, hippies in San Francisco wore long hair and lived together in shared homes.
- Many hippies said they stood for love and peace and liked acid rock music.
