simpleMeaning: able to be passed down to family members under fixed rules, usually the rules of the law
scope: Something that can pass down a family line under fixed rules, usually the law, not just anything
  that comes from a long-ago family member.
examples:
- The ancestral home passed to the eldest son under the old law.
- Under the old rules, the ancestral estate went to the first-born child.
