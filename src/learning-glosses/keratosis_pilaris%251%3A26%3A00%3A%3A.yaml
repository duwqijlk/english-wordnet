simpleMeaning: Hard cone-shaped bumps rise at the mouths of the oil-making glands of the skin, above all
  on the arms and thighs, in a lasting skin state.
scope: This lasting skin state shows hard cone-shaped bumps at the mouths of the oil glands of the skin.
examples:
- Keratosis pilaris left hard bumps on her arms and thighs.
- His keratosis pilaris showed hard bumps at the openings of the glands.
