simpleMeaning: a card game in which a player gets points toward winning only for the tricks they said
  they would take
scope: A card game where points count only for the tricks promised, also called contract; not plain bridge
  and not a game where every trick won scores.
examples:
- They played contract bridge every Friday night.
- In contract bridge, she bid six tricks and made them all.
