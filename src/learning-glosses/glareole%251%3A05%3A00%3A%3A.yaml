simpleMeaning: a bird with long wings that end in a point and short legs, found by the shore in the Old
  World and a close kin of the coursers
scope: A shore bird of the Old World with long pointed wings and short legs; not a courser and not a gull.
examples:
- A glareole flew low over the mudflats.
- Glareoles nest on open ground near water.
