simpleMeaning: a wheel that is turned by flowing water; a simple turbine (a machine that gets power from
  moving water)
scope: This wheel is turned by water to give power; not the wheel with buckets that lifts water up from
  a stream or pond.
examples:
- The old mill's waterwheel turned slowly in the stream and powered the mill stones.
- A waterwheel by the river gave power to the small factory.
