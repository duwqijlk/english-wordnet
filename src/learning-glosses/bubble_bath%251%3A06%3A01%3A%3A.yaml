simpleMeaning: A crystal, powder or liquid that softens tub water, scents it and fills it with froth.
scope: Also called bath foam, foam bath and foaming bath, this is a crystal, powder or liquid put in tub
  water to fill it with froth, scent it and make it soft; other scented things put in tub water are its
  nearest rivals.
examples:
- She poured bubble bath into the tub and the water filled with bubbles.
- This bubble bath scents the water and makes it soft.
