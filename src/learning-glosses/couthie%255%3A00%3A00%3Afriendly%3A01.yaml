simpleMeaning: Chiefly in Scotland, pleasant and warm in manner, easy to like
scope: Pleasant and warm in manner, easy to like; couthy is another name for this sense, not a formal
  or distant person and not merely polite.
examples:
- She was a couthie host who made every guest feel at home.
- The couthie old man chatted warmly with everyone in the village.
