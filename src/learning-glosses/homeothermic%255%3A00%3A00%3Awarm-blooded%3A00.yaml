simpleMeaning: 'Of birds and mammals: keeping the same warm body heat at all times.'
scope: Of birds and mammals, keeping the same warm body heat at all times, not cold-blooded and not changing
  heat with the air; also called homoiothermic and homothermic.
examples:
- Birds are homeothermic, keeping a steady warm body heat.
- As a homeothermic animal, the dog keeps the same body heat day and night.
