senseId: 'valve%1:05:00::'
synsetId: 01907102-n
simpleMeaning: one of the two joined hard outer covers of a soft sea animal, joined so they can open and
  shut
scope: This is one half of a paired shell, not the flap inside the heart that lets fluid through one way,
  and not a tap or switch that controls flow.
examples:
- Each valve of the clam opened and closed as it fed.
- The two valves of the shell were still joined by a hinge.
