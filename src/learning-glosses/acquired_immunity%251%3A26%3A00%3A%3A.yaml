senseId: 'acquired_immunity%1:26:00::'
synsetId: 14551795-n
simpleMeaning: Protection against a specific disease that develops during life, through antibodies made
  after infection or vaccination, or passed from mother to unborn child.
scope: Protection a person builds up during life, not the immunity present from birth.
examples:
- She developed acquired immunity after catching the virus as a child.
- Vaccines give acquired immunity without the danger of a real infection.
