simpleMeaning: To remove the small hard plates from the skin of a fish.
scope: This is cleaning a fish, not weighing anything and not changing the size of a model.
examples:
- He scaled the trout and laid it on the grill.
- Ask the fishmonger to scale the sea bass for you.
