simpleMeaning: to prick the skin like the stinging plant does, leaving a sharp, burning pain
scope: To sting the skin as the plant does, not merely to annoy someone and not the plant itself.
examples:
- The tall grass nettled her bare legs as she walked through it.
- He was nettled by the sting and rubbed his arm.
