simpleMeaning: To fill skins, or to cook as flat cakes, take flesh of an animal cut up fine and mixed
  with spices.
scope: This is flesh of an animal that has been cut up fine and mixed with spices, not a whole cut served
  on its own.
examples:
- They cooked sausage meat for the meal.
- The sausage meat went into the skins.
