simpleMeaning: To hold the body still in one way so that an artist can make a work of art of you
scope: To hold still for art, not to act to impress others and not to claim to be someone else, and model
  and sit are other names for this sense.
examples:
- She posed for the painter for three hours without moving.
- The artist asked him to pose by the window in the morning light.
