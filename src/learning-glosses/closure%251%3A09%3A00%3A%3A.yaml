synsetId: 06259551-n
simpleMeaning: 'A principle in Gestalt psychology, which studies how people group what they see: the mind
  naturally completes unfinished shapes, fills in gaps, and treats uneven forms as even.'
scope: This is the perceptual rule that the mind completes broken shapes, another name for the law of
  closure; it is not a settled decision or the shutting down of a business.
examples:
- Closure explains why we see a dashed circle as a solid ring.
- Because of closure, the viewer's eye supplies the missing edges of the drawing.
