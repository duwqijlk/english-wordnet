simpleMeaning: the outer skin of a seed of a flowering plant, which keeps the inside of the seed safe
scope: 'Another name for a seed coat or episperm: the outer skin of a seed of a flowering plant, not the
  soft part inside the seed and not the skin of a fruit.'
examples:
- The testa splits open when the seed starts to grow.
- Water must pass through the testa before the seed can sprout.
