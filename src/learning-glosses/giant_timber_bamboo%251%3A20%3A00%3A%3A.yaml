simpleMeaning: Its stems are thick-walled, and it grows tall; this grass comes from China and perhaps
  Japan and is now grown in many other places.
scope: Ku-chiku and madake are other names for this tall grass from China and perhaps Japan.
examples:
- Giant timber bamboo is grown in China and in many other places.
- We cut a stem of giant timber bamboo.
