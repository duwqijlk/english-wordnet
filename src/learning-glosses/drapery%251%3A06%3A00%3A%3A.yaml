simpleMeaning: cloth that hangs down and works as a cover, especially for a window
scope: Cloth that hangs to cover a window, also called curtain, drape, mantle or pall; not cloth set out
  in loose folds for how it looks.
examples:
- The heavy drapery blocked the morning light from the room.
- She pulled the drapery shut over the window at night.
