senseId: 'electrodermal_response%1:04:00::'
synsetId: 00861689-n
simpleMeaning: A change in how the skin bears power when stressed or worried, read either from the skin's
  resistance to power or from weak currents the body gives off.
scope: This sense is also called electrical skin response, galvanic skin response, and psychogalvanic
  response.
examples:
- The electrodermal response shifts under stress.
- They log the electrodermal response.
