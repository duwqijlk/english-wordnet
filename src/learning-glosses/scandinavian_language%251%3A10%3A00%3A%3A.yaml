simpleMeaning: The northern family of Germanic tongues spoken in Scandinavia and Iceland.
scope: Also called Norse, Nordic, North Germanic, North Germanic language, or Scandinavian, this is the
  northern family of Germanic tongues spoken in Scandinavia and Iceland, not the tongues of southern Europe
  and not one tongue alone.
examples:
- Scandinavian language is spoken in Norway, Sweden, and Denmark.
- Icelandic belongs to the Scandinavian language family of tongues.
