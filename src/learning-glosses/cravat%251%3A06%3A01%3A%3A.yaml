simpleMeaning: a piece of cloth worn around the neck, tied in a knot with a loop that can slide, with
  long ends that lie over each other down the front
scope: This is a piece of cloth worn around the neck with long ends down the front; it is not a necktie
  and not a scarf worn to keep warm.
examples:
- He wore a white cravat tied neatly at his neck.
- Her cravat hung in two long ends down the front of her shirt.
