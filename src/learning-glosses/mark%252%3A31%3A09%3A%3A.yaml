simpleMeaning: to be the quality that sets someone or something apart from others, sometimes in a good
  way
scope: Being a quality that sets someone or something apart, sometimes favourably, not physically leaving
  a visible trace and not publicly condemning someone; distinguish and differentiate are other names for
  this sense.
examples:
- Her sharp wit marks every one of her essays.
- What marks this village is its unusual friendliness.
