simpleMeaning: A stretch of time when something stops for a while, then starts again.
scope: Also called a break and a pause, this is a stretch of time when a thing has stopped, not the act
  of holding a thing up and not a sudden event that breaks into what you are doing.
examples:
- After a brief interruption, the music started again.
- The interruption lasted only a few minutes.
