simpleMeaning: used in a calendar or typical of how time is counted
scope: Another name for it is calendric; it is about a calendar and how time is counted, not a date itself
  or a day of the week.
examples:
- The calendrical tables show the dates of the new moon.
- She studied the calendrical system of the old temple.
