simpleMeaning: the egg or young of an insect that lives and feeds on mammals, especially a louse that
  sucks blood, often stuck to a hair or a piece of clothing
scope: This is the egg or young of a louse or a like insect; it is not the unit for how bright light is.
examples:
- She found tiny white nits stuck to her child's hair.
- The nurse checked his hair for nits after lice spread at school.
