simpleMeaning: likely to keep things secret and say little about what they know
scope: Also called close, closemouthed, secretive and tightlipped, it means a person who is likely to
  keep things secret and say little, not a person who talks freely about what they know.
examples:
- She stayed closelipped about the plan.
- He was closelipped when we asked where she had gone.
