simpleMeaning: a thin covering put on the outside of pots, plates and other things made from baked clay
  or from fine white baked clay
scope: 'Also called lustre: a thin covering for things made from baked clay, not the shine a thing gives
  back when light falls on it.'
examples:
- The potter put a gold luster on the clay bowl before firing it.
- The maker brushed luster onto the ceramic plate before the final firing.
