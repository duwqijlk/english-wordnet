simpleMeaning: a small hotel, usually outside a city on a main road, that gives meals and strong drinks,
  with dancing and sometimes games where people risk money
scope: A small hotel on a main road outside a city with food, drink, and dancing, not a plain hotel in
  a city centre and not just a bar.
examples:
- We stopped at a roadhouse outside town for dinner and music.
- They spent the night at a roadhouse where people ate, drank, and danced.
