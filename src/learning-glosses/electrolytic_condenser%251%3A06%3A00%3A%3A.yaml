simpleMeaning: A fixed part that stores electric charge, made of two charge-carrying pieces with a substance
  between them that carries charge.
scope: A fixed charge-storing part, also called an electrolytic capacitor and also called electrolytic;
  not a battery and not a plain wire.
examples:
- The electrolytic condenser in the old set had dried out.
- She replaced the electrolytic condenser with one of the same size.
