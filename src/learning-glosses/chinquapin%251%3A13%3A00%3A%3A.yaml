simpleMeaning: a small nut of either of two small chestnut trees from the south of the United States,
  like a hazelnut
scope: 'Also called chincapin and chinkapin: a small nut, not the tree itself and not a hazelnut.'
examples:
- She gathered chinquapins under the small chestnut trees.
- A chinquapin is a small nut much like a hazelnut.
