senseId: 'monometallism%1:21:01::'
synsetId: 92441053-n
simpleMeaning: using only one metal, such as gold or silver, as the base of a country's coins and notes,
  or as the fixed measure of what things are worth
scope: Using one metal alone as the base of a country's money, not two metals and not paper money with
  no metal base.
examples:
- Under monometallism, the country's coins were all based on silver.
- The debate over monometallism filled the newspapers of the time.
