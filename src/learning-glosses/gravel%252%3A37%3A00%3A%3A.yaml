simpleMeaning: to make someone feel annoyed and trouble them, especially by small things that keep happening
scope: 'Also called bother, annoy, rag, irritate, devil, nettle, vex and chafe: to trouble someone with
  small things; not to cover a road or path with small stones.'
examples:
- The noise from next door gravels him every night.
- Her constant questions gravelled the teacher.
