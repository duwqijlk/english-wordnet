simpleMeaning: Ships and planes roll less from side to side when a heavy spinning wheel on a straight
  up-and-down rod steadies them.
scope: People also call this device gyrostabiliser, and it cuts down the side-to-side roll of a ship or
  plane.
examples:
- The gyrostabilizer kept the ship steady.
- A gyrostabilizer spins on a straight rod to stop rolling.
