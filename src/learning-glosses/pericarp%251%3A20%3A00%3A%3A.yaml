senseId: 'pericarp%1:20:00::'
synsetId: 11704733-n
simpleMeaning: The ripe walls of the seed case of a plant, changed in many ways as they grow.
scope: The ripe walls of the seed case of a plant, changed in many ways as they grow, not the seed itself
  and not the green leaves round the flower.
examples:
- The pericarp of the peach is the soft flesh round the stone.
- A dry pericarp splits to free the seeds.
