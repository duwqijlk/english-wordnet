simpleMeaning: to hang over a place or a person, like a dark and fearful thing
scope: 'Also called loom: to hang over a place or a person like something dark and fearful, not to float
  in the air and not to waver between choices.'
examples:
- A dark cloud hovered over the town.
- A terrible thought hovered over her all day.
