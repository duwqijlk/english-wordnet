simpleMeaning: to hide something or make it hard to see, by covering it or as if covering it
scope: To hide a thing by covering it, not to hide facts or meaning so they cannot be understood, and
  not a cloth or covering itself.
examples:
- Clouds veiled the top of the mountain.
- She veiled her face with a thin cloth before going out.
