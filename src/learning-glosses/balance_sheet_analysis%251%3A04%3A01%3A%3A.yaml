simpleMeaning: A close look at what a firm owns, what it owes, and what is left for its owners, made at
  set times, usually every three months or every year.
scope: This close look at what a firm owns and owes is made at set times, usually every three months or
  every year.
examples:
- The balance sheet analysis should begin with a comparison of total assets and liabilities.
- Each year the balance sheet analysis showed what the firm owned and owed.
