simpleMeaning: Soft green beans with no strings in them; they break easily into pieces
scope: These are soft green beans, not a round ginger cookie, not a part on clothing, and not the sound
  made with the fingers.
examples:
- She cooked snap beans with a little butter for dinner.
- The snap beans in the garden are soft and ready to pick.
