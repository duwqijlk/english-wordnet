senseId: 'abnormality%1:26:00::'
synsetId: 14525310-n
simpleMeaning: a body condition that is not usual, caused by faults in genes (the parts in cells that
  control how we grow) or by problems as the body grows and forms
scope: This is a body condition, also called abnormalcy; it is not behaviour that breaks rules or custom,
  and not the strangeness of a thing that is not usual.
examples:
- The test showed a heart abnormality that the doctor wanted to check.
- Doctors found an abnormality in how the child's spine had formed.
