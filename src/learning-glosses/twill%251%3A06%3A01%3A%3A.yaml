simpleMeaning: a way of making cloth so that it looks as if it has raised lines side by side, running
  at an angle
scope: This is the way of making the cloth, not the cloth itself and not the act of making cloth in this
  way.
examples:
- The weaver used a twill to make the cloth, so its lines ran at an angle.
- This twill makes the cloth look as if it has raised lines running at an angle.
