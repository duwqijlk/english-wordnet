simpleMeaning: A fragrant plant that lives one year, with tall stems of small whitish flowers held inside
  a greatly enlarged saucer-shaped or cup-shaped covering.
scope: 'Also called molucca balm and Molucella laevis: a fragrant annual, not a true bellflower, and not
  a shrub.'
examples:
- Bells of Ireland stood tall in the summer border.
- The bells of Ireland held their small flowers in wide cups.
