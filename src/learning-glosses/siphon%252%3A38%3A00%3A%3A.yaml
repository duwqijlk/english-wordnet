simpleMeaning: to take something out of a place, or empty it, using a tube, or in a way like that
scope: To draw off or empty something with a tube, or as if with one, not the tube itself and not the
  organ in a sea animal.
examples:
- He siphoned the petrol from the tank into a can.
- They siphoned money out of the fund a little at a time.
