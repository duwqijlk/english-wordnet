simpleMeaning: Palestinian Arabs' group seeking a state of Palestine; 1964 terror group under Arafat's
  al-Fatah, led by Arafat from 1968, seen by the UN as a government in exile, largely political.
scope: This is a Palestinian political group, also called Palestine Liberation Organization, not the state
  of Palestine itself nor any other Arab group.
examples:
- The PLO was formed in 1964.
- The PLO gained UN recognition in 1974.
