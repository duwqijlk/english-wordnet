simpleMeaning: A common North American beetle whose young feed on roots and whose adults eat the leaves
  and flowers of plants such as rose bushes, apple trees or grape vines.
scope: Another name for rose chafer, the common North American beetle whose grubs eat roots; not the rose
  aphid or the Japanese beetle.
examples:
- A rose bug was eating the leaves of the apple tree.
- The gardener found rose bugs feeding among the flowers of the grape vines.
