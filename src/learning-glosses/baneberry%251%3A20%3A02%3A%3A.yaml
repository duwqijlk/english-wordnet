simpleMeaning: a small round fruit that can poison a person, borne on a plant called Actaea
scope: A poison fruit, not the plant that bears it and not a fruit safe to eat.
examples:
- Do not eat that baneberry; it can make you very ill.
- She saw a baneberry on the plant and warned the children to leave it alone.
