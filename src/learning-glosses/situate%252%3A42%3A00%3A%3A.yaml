simpleMeaning: to find or show where a thing is, or where its edges run, as if by measuring the land
scope: 'Also called locate: to pin down where something is, not merely to put it somewhere.'
examples:
- Our sense of sight helps us situate objects in space.
- They hired a surveyor to situate the boundaries of the property.
