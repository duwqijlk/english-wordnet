simpleMeaning: A worm that lives off others, found in the guts of pigs, rats, and people, making young
  that form sacs in the muscles that move bones.
scope: Also called trichina; a worm that lives in the guts of pigs, rats, and people and forms sacs in
  their muscles, not the common roundworm of the gut and not a tapeworm.
examples:
- Trichinella spiralis lives in the guts of pigs and can reach people who eat raw pork.
- The young of Trichinella spiralis form sacs in the muscles.
