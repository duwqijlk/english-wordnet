simpleMeaning: A right to buy the best parts of a firm, given to a friendly buyer to stop an unwanted
  takeover.
scope: This is a right to buy a firm's best parts, given to a friendly buyer to stop an unwanted takeover,
  not a plain right to buy shares and not a promise to sell the whole firm.
examples:
- The lock-up option gave the friendly buyer first claim on the best assets.
- Directors offered a lock-up option to stop the hostile bid.
