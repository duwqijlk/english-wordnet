simpleMeaning: From vines of tropical America that are kin to the passionflower comes an egg-shaped fruit
  you can eat.
scope: It names the egg-shaped fruit of vines kin to the passionflower, not the vine itself.
examples:
- She cut open a granadilla and ate it.
- We picked granadillas from the vines.
