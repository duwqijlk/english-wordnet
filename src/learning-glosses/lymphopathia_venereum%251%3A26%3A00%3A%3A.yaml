synsetId: 14161043-n
simpleMeaning: A sexually passed infectious disease caused by a kind of chlamydia germ, with sores on
  the genitals and swollen lymph nodes in the groin.
scope: Another name for lymphogranuloma venereum; a sexually transmitted infection that causes genital
  sores and swollen groin lymph nodes, not gonorrhoea or syphilis.
examples:
- Doctors test for lymphopathia venereum when a patient has genital sores and swollen lymph nodes in the
  groin.
- Lymphopathia venereum passes from one person to another through sexual contact.
