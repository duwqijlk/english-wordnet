simpleMeaning: to cover something with the fine powder that is made by grinding grain
scope: This is about putting the fine powder made from grain on food or a surface, not the powder itself,
  and not making that powder by grinding grain.
examples:
- Flour the board before you roll out the dough.
- She floured the fish before frying it.
