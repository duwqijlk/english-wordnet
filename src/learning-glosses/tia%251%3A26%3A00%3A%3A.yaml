simpleMeaning: A short spell when the brain gets too little blood, with signs that depend on where the
  flow is blocked
scope: 'Also called a transient ischemic attack: a brief spell when the brain gets too little blood, not
  a full stroke and not a faint.'
examples:
- The doctor said she had suffered a TIA.
- A TIA left him weak on one side for an hour.
