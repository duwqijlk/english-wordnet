simpleMeaning: A long bendy limb on the head or near the mouth of some animals, used to feel, grip, or
  move
scope: A long bendy limb near an animal's mouth, not an arm or a leg and not a thing that merely looks
  like one.
examples:
- The octopus wrapped a tentacle around the rock.
- A squid's tentacles reached out for the small fish.
