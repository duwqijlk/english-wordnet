simpleMeaning: To do with the -COOH part of a chemical, or holding that part.
scope: To do with the -COOH part of a chemical, or holding that part; carboxyl is another name for this
  sense, not the -COOH part itself and not an acid that holds that part.
examples:
- The carboxylic group gives the acid its sour taste.
- A carboxylic compound holds the -COOH part.
