simpleMeaning: a hole at a corner or side of a billiard table that balls are hit into
scope: One of the holes cut into a billiard table for the balls, not the pouch sewn in clothing or the
  gap between bowling pins.
examples:
- The white ball rolled toward the corner pocket.
- He sank the eight ball in the side pocket.
