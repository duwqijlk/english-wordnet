simpleMeaning: Sold as Zantac, this drug blocks the body chemical histamine and calms acid, treating stomach
  ulcers, a sore stomach lining, and acid coming back up the food pipe.
scope: A drug that blocks histamine and calms stomach acid, used for ulcers, a sore stomach lining, and
  acid rising from the stomach.
examples:
- The doctor gave her ranitidine for her stomach ulcer.
- He takes ranitidine when acid comes back up his throat.
