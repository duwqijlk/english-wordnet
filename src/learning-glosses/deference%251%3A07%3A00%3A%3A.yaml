senseId: 'deference%1:07:00::'
synsetId: 04648510-n
simpleMeaning: A readiness to give way to what other people want
scope: A readiness to give way to others; compliance is another name for this sense, not polite care for
  feelings and not a spoken sign of esteem.
examples:
- Out of deference to her mother, she agreed to the plan.
- He showed deference to the older members and let them speak first.
