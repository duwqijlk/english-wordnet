senseId: 'antecedent%1:10:00::'
synsetId: 06616004-n
simpleMeaning: The phrase or clause that a pronoun, or another word standing for it, points back to.
scope: The phrase or clause that a pronoun points back to, not a person from whom one is descended, usually
  more remote than a grandparent.
examples:
- In 'Mary said she was tired', 'Mary' is the antecedent of 'she'.
- The antecedent of 'it' in the second sentence is the word 'book'.
