simpleMeaning: Usually two large stones stand upright with one large flat stone laid across the top, making
  a very old stone tomb
scope: This very old stone tomb is also called a dolmen or a portal tomb, and it usually has two large
  upright stones and a flat stone across the top.
examples:
- The cromlech stood on the hill for thousands of years.
- They walked around the cromlech to see the great capstone.
