simpleMeaning: a very strong acid, H2SO4, that can damage things it touches; it is made from sulfur dioxide
  (a gas) and widely used in factories that make chemicals
scope: This sense is also called oil of vitriol, sulfuric acid and sulphuric acid. It is the strong acid
  itself, not bitter, angry speech, and not the act of harming someone with this acid.
examples:
- The factory stores vitriol in strong, safe tanks.
- Vitriol can damage skin, so workers wear gloves and eye covers.
