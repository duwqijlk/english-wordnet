simpleMeaning: Coming loose is what this washer stops a nut from doing
scope: 'Also called lock ring and lock washer: a washer that keeps a nut from coming loose, not a ring
  worn on a finger and not a plain washer with no such job.'
examples:
- A lockring sits under the nut to stop it loosening.
- She fitted a lockring before she tightened the nut.
