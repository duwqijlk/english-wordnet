simpleMeaning: very hard and firm, with strong limits, and holding back from doing too much
scope: This sense means hard, firm and holding back in a general way. It is not the sense that means fully
  exact with no change from a set rule.
examples:
- She follows a strict diet and never eats more than she planned.
- He lived a strict life, with hard rules and very little rest.
