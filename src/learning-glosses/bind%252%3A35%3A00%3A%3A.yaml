simpleMeaning: to tie or hold something in place, with rope or as if with rope
scope: To tie or hold something in place with rope, not to make someone feel they must do something because
  of a promise or duty.
examples:
- Bind the papers together with string to keep them in place.
- He binds the wood with rope so it stays together.
