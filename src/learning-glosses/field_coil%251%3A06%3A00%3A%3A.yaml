simpleMeaning: The ring of wire round a magnet in a machine, which makes the push that sets up the flow
  of power in the machine
scope: The ring of wire round a magnet in a machine, which makes the push that sets up the flow of power
  in the machine, also called a field winding; not the magnet itself and not the wire that carries power
  out of the machine.
examples:
- The field coil sits round the magnet.
- A broken field coil stopped the machine.
