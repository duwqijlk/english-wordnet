simpleMeaning: the bit of your clothes that goes over the thighs
scope: This is the clothing part that covers the thighs, not the top of the legs of a person who is sitting
  down, and not one full turn around a track.
examples:
- The lap of his trousers was covered with food stains.
- She spread a cloth over the lap of her dress to keep it clean.
