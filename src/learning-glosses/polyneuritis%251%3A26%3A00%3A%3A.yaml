simpleMeaning: Many or all of the nerves at the edges of the body swell up, as in leprosy
scope: 'Also called multiple neuritis: swelling of many or all of the nerves at the edges of the body,
  not swelling of one nerve only and not a sickness of the brain.'
examples:
- Polyneuritis made the nerves in her arms and legs swell and hurt.
- Leprosy can bring on polyneuritis.
