simpleMeaning: to stop living, so the body loses all the parts and work it needs to keep living
scope: 'Another name for die, go, pass, choke, exit, croak, decease, expire, perish, conk, buy the farm,
  drop dead, give-up the ghost, kick the bucket, pass away, and pop off: to stop living, not to hand in
  gaming chips for money and not to faint.'
examples:
- After a long illness, the old farmer cashed in his chips at the age of ninety.
- The heroine of the novel cashes in her chips in the final chapter.
