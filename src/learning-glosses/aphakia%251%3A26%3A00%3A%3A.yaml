simpleMeaning: The state of having no natural lens in the eye, usually after cataracts have been taken
  out.
scope: Having no natural lens in the eye, usually after cataract removal; not a clouded lens and not blindness
  from birth.
examples:
- After the operation she had aphakia in one eye.
- Aphakia left him needing strong glasses.
