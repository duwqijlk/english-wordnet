simpleMeaning: Said of things that come from Europe and Asia, or that have to do with those two lands.
scope: Another name for this sense is Eurasiatic; it is about things of Europe and Asia, not a person
  of mixed European and Asian descent.
examples:
- The Eurasian landmass is the largest in the world.
- Her Eurasian roots link her family to both Europe and Asia.
