simpleMeaning: a raised bank of earth built around an area to protect it from attack
scope: This is not a natural rock face or a dividing structure inside a building, but a raised earth barrier
  for defence.
examples:
- The old town was ringed by a high wall of packed earth.
- Soldiers reinforced the earthen wall around their camp.
