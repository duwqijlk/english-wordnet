simpleMeaning: In a way that gives one person or thing more favour than others
scope: This is doing something in a way that gives one person or thing more favour than others, not treating
  everyone the same and not acting by chance.
examples:
- He was treated preferentially by the manager.
- The school admitted local children preferentially.
