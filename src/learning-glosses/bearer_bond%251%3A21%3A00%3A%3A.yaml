simpleMeaning: A loan paper given out with small slips that can be torn off and shown to the one who gave
  it out to get interest paid
scope: A loan paper with tear-off slips shown to the one who gave it out to get interest paid, also called
  coupon bond, not a share and not a bank loan.
examples:
- He kept the bearer bond in a safe and tore off a coupon each year for the interest.
- A bearer bond pays interest to whoever holds it and shows the coupon.
