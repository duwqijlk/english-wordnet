simpleMeaning: Dense hanging bunches of grey-green hairlike wavy strands, fixed to tree trunks and branches
  by few wiry roots; from the southeastern United States and the West Indies to South America.
scope: Also called black moss, long moss, old man's beard and Tillandsia usneoides; hanging grey-green
  strands that grow on trees, not a plant that grows in the ground and not a leafy vine.
examples:
- Spanish moss hung from the oak trees along the road.
- We saw Spanish moss draped over the branches in the garden.
