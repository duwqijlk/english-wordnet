simpleMeaning: Said of events that come one after another with very little time between them
scope: Said of events that follow each other with very little time between them, not one slow event and
  not a thing that breaks apart.
examples:
- The fast-breaking news kept changing all evening.
- A fast-breaking story interrupted the regular broadcast.
