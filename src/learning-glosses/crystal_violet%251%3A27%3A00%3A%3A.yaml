simpleMeaning: To colour things, to kill germs, fungi and worms, and to treat burns, a green bit of mineral
  is used that turns violet in water.
scope: Also called gentian violet, this green mineral bit turns violet in water and is used to colour
  and to kill germs, not a dye that stays green in water.
examples:
- The crystal violet turned the water violet.
- Crystal violet was used to treat the burn.
