simpleMeaning: with a path around the sun that lies inside the path of the Earth
scope: A planet whose path around the sun lies inside the Earth's path, not a thing of low rank and not
  a small printed mark.
examples:
- Mercury and Venus are inferior planets, with paths inside the Earth's.
- An inferior planet never strays far from the sun in the sky.
