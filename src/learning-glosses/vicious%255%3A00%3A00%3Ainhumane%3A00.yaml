simpleMeaning: 'used of people or what they do: able or ready to cause pain or suffering'
scope: 'Also called fell, cruel, savage and brutal: used of a person or an action that causes pain or
  suffering. Not the sense that earns strong blame, and not the sense full of hate and wanting to harm.'
examples:
- He gave the prisoner a vicious kick.
- The vicious beating left the man in hospital.
