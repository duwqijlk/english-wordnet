simpleMeaning: A member of a Bantu people living mostly in the southern African country named for them
  and in western South Africa.
scope: A member of a Bantu people living mostly in Botswana and western South Africa, also called Batswana
  and Bechuana, not the language of that people.
examples:
- The Tswana live in Botswana and South Africa.
