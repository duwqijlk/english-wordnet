simpleMeaning: to walk in a tall, proud way, most often to make others look up to you
scope: To walk in a tall, proud way, most often to impress others; cock, ruffle and prance are other names
  for this sense, and it is not the proud walk itself as a thing or behaving in an arrogant way without
  walking.
examples:
- He swaggers around like a rooster in a hen house.
- She swaggered into the hall, head held high.
