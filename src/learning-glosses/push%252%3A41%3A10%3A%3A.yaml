simpleMeaning: To work hard and keep pressing for a goal, cause, or person, and speak up for them in public.
scope: This is active campaigning for a cause or person, not the general effort to reach a goal, nor urging
  someone to act, nor a light switch.
examples:
- The party pushed for reforms to the tax system.
- She is pushing for her candidate to be chosen.
