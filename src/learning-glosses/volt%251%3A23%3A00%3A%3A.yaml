simpleMeaning: A unit for electrical potential; one is between two points on a conductor when 1 ampere
  flows and 1 watt is lost, or across 1 ohm when 1 ampere flows
scope: This sense is the unit for electrical push, not the ampere, which measures how much current flows,
  and not the watt, which measures power.
examples:
- The small battery gives nine volts.
- This lamp needs 240 volts to work.
