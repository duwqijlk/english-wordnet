simpleMeaning: After bright pink flowers, this rose of Europe and Asia bears scarlet fruit on stems with
  sharp points, and its leaves give off a pleasant smell.
scope: 'Also called briar, brier, sweetbriar, and eglantine: a rose of Europe and Asia with sharp-pointed
  stems, fragrant leaves, and bright pink flowers.'
examples:
- The sweetbrier by the fence was covered in bright pink flowers.
- After the flowers faded, scarlet hips appeared on the sweetbrier.
