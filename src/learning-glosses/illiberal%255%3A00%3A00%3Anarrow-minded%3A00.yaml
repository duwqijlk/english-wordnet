simpleMeaning: not willing to hear or accept views that go against the ones a person holds dear
scope: Unwilling to accept views that go against one's own dearly held ones, also called intolerant; not
  a dislike of strangers and not a refusal to change one's mind about facts.
examples:
- His illiberal views shut out every new idea.
- The illiberal old man would not listen to his daughter's plans.
