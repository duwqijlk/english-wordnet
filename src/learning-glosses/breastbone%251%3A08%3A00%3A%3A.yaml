simpleMeaning: the flat bone in the middle of the chest that joins with the collar bones and with the
  first seven pairs of ribs
scope: 'Also called sternum: the flat bone in the middle of the chest, not a collar bone and not a rib.'
examples:
- The doctor pressed gently on his breastbone.
- A hard hit to the breastbone can hurt a lot.
