simpleMeaning: so far from reason that it makes people laugh at it in scorn
scope: 'Also called ridiculous, absurd, and idiotic: so far from reason that it makes people laugh at
  it in scorn, not a broad joke or farce.'
examples:
- It is ludicrous to call a cottage a mansion.
- The plan was so ludicrous that the whole room burst out laughing.
