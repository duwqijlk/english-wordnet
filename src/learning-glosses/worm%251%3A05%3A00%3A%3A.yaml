simpleMeaning: Any of many kinds of small, long animal with a soft body, and also the young form of some
  insects
scope: A small soft-bodied animal, not the screw thread in a machine, not a computer program, and not
  a nasty person.
examples:
- The bird pulled a worm from the wet ground.
- Worms help to break down dead leaves in the soil.
