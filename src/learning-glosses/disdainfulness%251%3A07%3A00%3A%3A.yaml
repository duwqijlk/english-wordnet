simpleMeaning: The habit of showing pride by talking down to people one thinks are below one.
scope: The habit of showing pride by talking down to others, also called condescension and superciliousness;
  not plain pride and not kindness to others.
examples:
- Her disdainfulness showed in the way she talked down to the staff.
- His disdainfulness made him treat others as below him.
