senseId: 'haustorium%1:20:00::'
synsetId: 11706518-n
simpleMeaning: A root-like part of a plant that lives on another plant, which pushes into the host plant
  and takes food from it.
scope: A plant part that feeds on a host plant, not an ordinary root and not a stem that only holds the
  plant up.
examples:
- The haustorium of the dodder plant pushed into the stem of its host.
- Once the haustorium had taken hold, it drew food from the host plant.
