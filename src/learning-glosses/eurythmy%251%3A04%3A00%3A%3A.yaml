simpleMeaning: Moves of the body that follow the beat of a piece of music in time, so people learn how
  music works
scope: Eurhythmics, eurhythmy, and eurythmics are other names for this way of learning how music works
  through moves of the body.
examples:
- In her eurythmy class, the children moved their arms to the beat of the music.
- Eurythmy helped the pupils feel how the music rose and fell.
