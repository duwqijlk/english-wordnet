senseId: 'cost_accountant%1:18:00::'
synsetId: 09987346-n
simpleMeaning: a person with special skill who keeps neat, ordered records of the money spent in making
  things and works out what the numbers mean
scope: A worker who keeps ordered records of money spent in making things and works out what they mean,
  not a bookkeeper who keeps day-to-day records and not an auditor who checks the books.
examples:
- The cost accountant worked out how much each batch of parts had taken to make.
- Our cost accountant keeps a neat record of every sum spent on the factory floor.
