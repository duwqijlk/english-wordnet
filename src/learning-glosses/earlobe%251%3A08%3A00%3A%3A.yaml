simpleMeaning: the soft, fleshy bit at the bottom of a person's outer ear that hangs down
scope: The soft fleshy bit at the bottom of a person's outer ear that hangs down, not the whole ear and
  not the hole the ear makes.
examples:
- Her earlobe was sore where the earring pulled it.
- He tugged at his earlobe while he thought.
