simpleMeaning: A document made again from an existing record, such as a school or legal record.
scope: copy is another name for this sense; it is a reproduced document such as a school or court record,
  not a typed-out record of spoken words or an original document.
examples:
- Please send a transcript of your college grades with the application.
- The clerk gave him a transcript of the court record for a small fee.
