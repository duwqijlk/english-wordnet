simpleMeaning: One who says a thing again.
scope: This sense is one who says a thing again, unlike the sense for, in electronics, a device that boosts
  a signal before sending it on again, unlike the sense for a gun that can fire many shots with no fresh
  load, and unlike the sense for one oft caught for wrongdoing, especially the same wrongdoing.
examples:
- The repeater says a thing again.
- Repeaters repeat.
