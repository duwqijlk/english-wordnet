simpleMeaning: wood that is easy to cut with a saw, coming from cone-bearing trees such as pine or fir
scope: This sense is the timber itself, not a flat board cut from it or an agreement.
examples:
- The frame was made of deal because it saws easily and costs little.
- Builders often choose deal for cheap shelving and fencing.
