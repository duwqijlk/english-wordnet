simpleMeaning: Showy blooms with thin parts spread out in all directions mark one of many kinds of plant
  from the group Cleome, often with a strong smell.
scope: It is also called cleome, and its showy blooms spread thin parts in all directions while the plant
  often smells strong.
examples:
- The spiderflower opened showy blooms with a strong smell.
- The spiderflower smelled strong as its blooms opened.
