simpleMeaning: a chemical compound formed from an acid that holds manganese, where manganese is the part
  with a negative charge
scope: A chemical compound formed from an acid that holds manganese; not the acid itself and not a compound
  of another metal.
examples:
- The lab stored the manganate in a sealed jar.
- Manganate forms when the acid reacts with a base.
