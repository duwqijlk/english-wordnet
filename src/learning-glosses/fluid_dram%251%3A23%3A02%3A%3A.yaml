synsetId: 13642471-n
simpleMeaning: 'The same as 60 minims, tiny measures of liquid, or 3.5516 cubic centimetres: a British
  measure of the old empire for how much liquid or dry stuff fills'
scope: Drachm, fluid drachm and fluidram are also names for this British measure of the old empire for
  how much liquid or dry stuff fills, the same as 60 minims or 3.5516 cubic centimetres, unlike the apothecary
  measure of one eighth of a fluid ounce.
examples:
- One fluid dram is the same as 60 minims.
- A fluid dram is a British measure for liquid or dry stuff.
