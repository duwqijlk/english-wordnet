simpleMeaning: A written account of a sick person's past illness and care, as told by the sick person
scope: A written account of a patient's past illness, also called a medical history; not a report of test
  findings and not the work of healing itself.
examples:
- The nurse read his medical record before the visit.
- Her medical record shows the illness she had as a child.
