simpleMeaning: a drug that narrows blood vessels, sold as Privine and Sudafed, used in nose sprays to
  ease a blocked nose and in eye drops to ease sore eyes
scope: A drug that narrows blood vessels, used in nose sprays and eye drops; not a drug that widens blood
  vessels and not a painkiller.
examples:
- The doctor told her to use naphazoline spray for her blocked nose.
- A few drops of naphazoline in each eye eased the redness and soreness.
