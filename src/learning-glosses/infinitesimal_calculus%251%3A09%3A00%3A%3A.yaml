simpleMeaning: The part of mathematics that works with limits and with finding rates of change of functions
  and areas under their curves.
scope: The part of mathematics that works with limits and with rates of change and areas, also called
  calculus; not algebra and not geometry.
examples:
- Infinitesimal calculus deals with limits and rates of change.
- She studied infinitesimal calculus to learn how functions change.
