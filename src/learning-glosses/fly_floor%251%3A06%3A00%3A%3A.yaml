simpleMeaning: A thin high walkway at the side of a stage in a playhouse, where stage workers pull ropes
  that move gear hung above.
scope: This is a thin high walkway at the side of a stage, not the stage itself or a seat in the hall,
  and it is also called a fly gallery.
examples:
- The stagehand stood on the fly floor.
- Ropes run from the fly floor above the stage.
