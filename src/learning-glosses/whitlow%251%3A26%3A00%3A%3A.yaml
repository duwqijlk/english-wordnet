simpleMeaning: A sore full of pus at the tip of a finger or toe, in the skin round the nail
scope: A sore full of pus at a finger or toe tip; felon is another name for this sense, and it is not
  a bruise or a cut.
examples:
- A whitlow on her finger throbbed all night.
- He could not write because of the whitlow.
