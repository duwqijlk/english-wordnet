simpleMeaning: the pure liquid that is made when vapor from a boiled liquid cools and turns back into
  liquid
scope: 'Also called distillate: this is the pure liquid that the process makes, not the process itself
  of boiling a liquid and cooling its vapor.'
examples:
- The distillation was collected in a clean bottle after it cooled.
- This distillation is a clear, pure liquid ready for use.
