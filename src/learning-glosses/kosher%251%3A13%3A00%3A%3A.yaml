simpleMeaning: food that follows the rules of Jewish law about what people may eat
scope: Food that follows Jewish rules about eating; it is not the word used to say that food or a place
  follows those rules.
examples:
- For dinner, they served kosher that had been checked by a rabbi.
- The store keeps all its kosher in a separate area.
