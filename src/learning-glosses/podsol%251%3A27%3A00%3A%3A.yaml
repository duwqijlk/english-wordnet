simpleMeaning: A grey, leached soil covered by a mat of organic matter, found in temperate to cold, damp
  climates under conifers or heath.
scope: 'Another name for podzol, also called podzol soil or podsolic soil: a pale, leached soil with an
  organic mat on top, formed under conifers or heath; not ordinary topsoil, and not peat.'
examples:
- Under the pines the podsol showed a dark mat of needles over a pale, grey layer.
- Few crops grow well on podsol without heavy applications of fertilizer.
