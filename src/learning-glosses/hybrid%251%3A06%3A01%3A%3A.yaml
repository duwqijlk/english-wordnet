simpleMeaning: a car that can be driven by two power sources working together, usually one that burns
  fuel and one that runs on stored power
scope: A car that runs on two power sources, not a living thing born of unlike parents, a word built from
  parts of different languages, or a thing made of mixed parts.
examples:
- Her new car is a hybrid that runs on petrol and an electric motor.
- The hybrid uses its petrol engine on the motorway and its electric motor in town.
