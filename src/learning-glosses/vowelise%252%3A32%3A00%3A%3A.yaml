senseId: 'vowelise%2:32:00::'
synsetId: 00985667-v
simpleMeaning: to say a sound as a vowel, a sound made with the mouth open and no block in the throat
scope: To say a sound as a vowel, also called vowelize; not to drop a sound or say it as a consonant.
examples:
- Between two consonants, this liquid is vowelised.
- The sound is vowelised when spoken slowly.
