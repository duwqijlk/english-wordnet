simpleMeaning: A woman planning a family by counting days takes days 10 to 18 as fertile, since the egg
  is thought to leave her body 14 days before her period.
scope: This way of planning a family by counting days is also called rhythm, calendar method, rhythm method,
  and rhythm method of birth control.
examples:
- She used the calendar method of birth control to work out when she might become pregnant.
- The calendar method of birth control counts on an egg leaving the body 14 days before a period.
