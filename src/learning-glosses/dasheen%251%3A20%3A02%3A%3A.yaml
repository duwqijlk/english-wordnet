simpleMeaning: The starchy underground part of taro plants, eaten as food.
scope: The starchy underground part of taro plants, eaten as food; taro, cocoyam and eddo are other names
  for it, not the taro plant itself and not a potato.
examples:
- They boiled the dasheen for dinner.
- She peeled the dasheen and sliced it for the soup.
