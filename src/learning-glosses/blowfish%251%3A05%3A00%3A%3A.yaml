senseId: 'blowfish%1:05:00::'
synsetId: 02657650-n
simpleMeaning: Any of many marine fishes whose long spiny body can swell with water or air into a ball;
  some carry a strong nerve poison; closely related to spiny puffers.
scope: This is the fish that puffs into a spiny ball, not the dangerous dish made from it and not the
  related spiny puffers; 'globefish', 'puffer' and 'pufferfish' are other names for the same fish.
examples:
- A blowfish puffed into a spiny ball when the net touched it.
- A blowfish can double its size in seconds.
