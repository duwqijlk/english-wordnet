simpleMeaning: Where tiles meet on a roof, a carved decoration along the edge hides the joints.
scope: A carved decoration on a tiled roof that hides the joints between tiles, not a tile itself.
examples:
- The antefix hid the joint where two roof tiles met.
- The builder set an antefix over the joint between the tiles.
