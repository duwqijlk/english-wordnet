simpleMeaning: A fine hanging of rich cloth hung behind the altar of a church or at the sides of the chancel
scope: A fine hanging of rich cloth hung behind the altar of a church or at the sides of the chancel;
  dossal is another name for it, not a curtain and not a carpet.
examples:
- The dossel was embroidered with gold thread.
- Candles stood before the dossel at the altar.
