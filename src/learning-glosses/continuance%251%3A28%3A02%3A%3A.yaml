simpleMeaning: The spell while a thing keeps on.
scope: This sense is the spell while a thing keeps on, unlike the sense for the deed of keeping on with
  a deed, with no break, and unlike the sense for the mark of lasting or keeping on in time.
examples:
- Continuance is the spell while a thing keeps on.
- Continuance lasts.
