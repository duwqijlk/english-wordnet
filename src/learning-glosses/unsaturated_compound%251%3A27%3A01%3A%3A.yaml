simpleMeaning: a chemical with carbon bits that join with double or triple links, the double ones like
  those in alkenes and the triple ones like those in alkynes
scope: A chemical with double or triple links between carbon bits, not one with only single links; not
  an alkene or an alkyne itself.
examples:
- This unsaturated compound has double links between its carbon bits.
- The lab tested the unsaturated compound to see whether it held triple links.
