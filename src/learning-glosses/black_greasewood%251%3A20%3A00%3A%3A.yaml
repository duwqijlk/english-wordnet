simpleMeaning: In the soils of western America that are rich in alkali, a harsh chemical in the ground,
  grows this low, tough, much-branched shrub with sharp points.
scope: People also call it greasewood, and it is a low, tough shrub with sharp points that grows in the
  alkaline soils of western America.
examples:
- Black greasewood grows in the alkaline soils of western America.
- Black greasewood is common across western America.
