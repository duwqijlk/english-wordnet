simpleMeaning: a long discussion or piece of writing that deals with a particular subject, often with
  back-and-forth exchange
scope: This is a discussion of a subject, not medical care, not the way someone is handled, and not an
  artist's manner of presenting a subject.
examples:
- Her book offers a detailed treatment of climate policy.
- The panel gave the issue a thorough treatment, with questions from the audience.
