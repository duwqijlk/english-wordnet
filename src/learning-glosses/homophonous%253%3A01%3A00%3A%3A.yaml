schema: oewn-learning-gloss-v2
senseId: 'homophonous%3:01:00::'
synsetId: 03005361-a
simpleMeaning: Two words can sound just the same even when they come from different roots
scope: Words from different roots that sound the same, not words that are spelt the same but said in different
  ways.
examples:
- ‘Horse’ and ‘hoarse’ are homophonous words.
- The words ‘to’ and ‘too’ are homophonous.
