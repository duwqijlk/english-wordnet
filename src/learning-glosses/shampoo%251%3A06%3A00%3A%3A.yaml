simpleMeaning: a cleaning substance made of soap or detergent, used to wash the hair
scope: A cleaning substance for washing hair, not the act of washing hair and not an ordinary body soap.
examples:
- She put some shampoo on her hair and rubbed it in.
- This shampoo leaves my hair soft and clean.
