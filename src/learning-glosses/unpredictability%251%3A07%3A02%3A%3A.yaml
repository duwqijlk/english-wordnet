simpleMeaning: the quality of a person who is led by sudden urges that no one could guess before they
  happen
scope: 'Also called capriciousness: being led by sudden urges; not the sense of being unable to make up
  your mind and keep to a choice.'
examples:
- His unpredictability came from acting on sudden urges no one had guessed.
- 'Her friends knew her unpredictability: a sudden urge could change all her plans for the day.'
