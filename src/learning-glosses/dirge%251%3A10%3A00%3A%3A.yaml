simpleMeaning: a sad song or religious song made or sung to remember a person who has died
scope: Another name for this sense is lament; it is also called requiem and threnody. It is a song sung
  for someone who has died, not just any sad song.
examples:
- They sang a dirge at his funeral.
- A slow dirge was played as the coffin was carried in.
