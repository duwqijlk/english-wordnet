simpleMeaning: a thin sheet that lets some light through, put over stage lights to add color to the light
scope: 'Also called gel: a thin sheet put over stage lights to add color, not the jelly-like food and
  not the clear stuff from animal skin and bone used in foods.'
examples:
- The lighting worker put a red gelatin over the stage light.
- A blue gelatin changed the color of the light on stage.
