senseId: 'pianola%1:06:00::'
synsetId: 03743557-n
simpleMeaning: A piano that plays itself, worked by a roll of paper with holes in it that push the keys
  down
scope: This is a piano that plays itself from a roll of paper with holes; mechanical piano and player
  piano are other names for this sense, and it is not a piano played by hand.
examples:
- The pianola played an old tune by itself.
- She put a new roll in the pianola.
