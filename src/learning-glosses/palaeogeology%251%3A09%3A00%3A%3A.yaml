simpleMeaning: Parts of the earth that once lay on its surface but now lie under rock are what this study
  looks at
scope: 'Also called paleogeology: the study of earth features now buried under rock, not the study of
  living things from long ago and not the study of rocks that are still at the surface.'
examples:
- Her palaeogeology course covered ancient buried shorelines.
- He wrote a paper on palaeogeology and the buried river beds.
