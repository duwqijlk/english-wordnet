simpleMeaning: The quality of numbers with a simple, convenient form, such as 100 or 500.
scope: This concerns the simple form of numbers, whether exact or approximate, not a curved outline or
  a rounded body.
examples:
- He reported the cost as 500 dollars, and the roundness of that number made it easy to remember.
- The roundness of the figures did not change the main point she was making.
