simpleMeaning: the quality of numbers that are made whole and not exact, such as 100 instead of 97
scope: This is about numbers made whole and not exact, not about a line or surface being curved, and not
  about a body being well rounded in shape.
examples:
- He reported the cost as 500 dollars, and the roundness of that number made it easy to remember.
- The roundness of the figures did not change the main point she was making.
