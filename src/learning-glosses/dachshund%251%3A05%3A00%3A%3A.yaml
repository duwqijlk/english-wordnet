simpleMeaning: A small German dog with a long body, short legs, a short smooth coat, and long ears that
  hang down, fit for following hunted animals into their holes
scope: Also called badger dog and dachsie, this is the German dog with a long body and short legs, not
  a dog of any other kind.
examples:
- Their dachshund has a long body and very short legs.
- The dachshund followed the animal down into its hole.
