simpleMeaning: to beat a person, usually not because that person is weak or has done anything wrong
scope: To beat a person, usually through no fault of theirs, not to be taken over by strong feelings or
  by things seen or heard.
examples:
- Heart disease overcame him in the end, through no fault of his own.
- The illness overcame her, though she had taken good care of herself.
