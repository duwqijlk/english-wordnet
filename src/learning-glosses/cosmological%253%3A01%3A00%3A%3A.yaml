simpleMeaning: In the branch of star study, this word is about the beginning of the universe, its past,
  its build and its motion
scope: This word is used about the branch of star study that covers how the universe began, its past,
  its build and the way it moves; cosmogenic, cosmogonic, cosmogonical and cosmologic are other names
  for this sense, not of the branch of thought about space, time and cause.
examples:
- The cosmological redshift shows how fast far-off stars move away.
- She studied the cosmological theories of the early universe.
