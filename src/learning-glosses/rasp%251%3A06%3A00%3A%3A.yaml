simpleMeaning: A file (a tool with a rough surface used to shape hard things by rubbing) with sharp points
  that stand up from it
scope: This is a rough tool with sharp points, not a harsh sound made when someone speaks in an angry
  way.
examples:
- He used a rasp to shape the wood before sanding it smooth.
- The rasp left deep marks because its sharp points cut into the metal.
