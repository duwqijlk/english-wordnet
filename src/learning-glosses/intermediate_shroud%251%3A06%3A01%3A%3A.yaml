simpleMeaning: A wire or rope that holds up a mast, set on a boat whose mast has more than one bar sticking
  out from it
scope: A wire or rope that holds up a mast on a boat with more than one bar on the mast; not the main
  wire that holds the mast, and not a sail.
examples:
- The crew checked the intermediate shroud before the race.
- An intermediate shroud steadied the mast in the strong wind.
