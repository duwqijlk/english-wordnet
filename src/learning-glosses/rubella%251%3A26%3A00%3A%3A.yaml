simpleMeaning: a spreading virus disease like a weaker form of measles, lasting three or four days, that
  can harm an unborn baby in the first three months of pregnancy
scope: This disease, also called epidemic roseola and three-day measles, is like a weaker form of measles;
  it is not measles itself.
examples:
- She caught rubella and stayed home for four days.
- Rubella in early pregnancy can harm the unborn baby.
