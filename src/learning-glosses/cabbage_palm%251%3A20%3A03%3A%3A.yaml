simpleMeaning: A tree of Australia whose young leaf buds can be eaten.
scope: A tree of Australia with young leaf buds that can be eaten, also called cabbage tree; not the West
  Indian tree of the same name and not a food plant grown for its leaves.
examples:
- The cabbage palm grows in the Australian bush.
- Young leaf buds of the cabbage palm can be eaten.
