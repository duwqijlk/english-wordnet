simpleMeaning: The reasoning a court gives to support its decision, as distinct from the decision itself.
scope: 'This is the reasoning-behind-a-ruling sense; distinct from opinion%1:09:00:: (a personal belief
  held without proof), opinion%1:10:01:: (a stated belief held with confidence), opinion%1:09:01:: (a
  view shared by most people), opinion%1:10:00:: (the written legal document giving reasons for a decision),
  and opinion%1:09:02:: (a vague idea held with some confidence).'
examples:
- The court's opinion explained why the earlier ruling was wrong.
- She read the judge's opinion to learn the reasons behind the verdict.
