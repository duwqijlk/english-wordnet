simpleMeaning: of or coming from the first followers of Jesus, or from what they taught
scope: 'Another name for apostolical: it means coming from the Apostles or their teaching, not coming
  from a pope or the papacy.'
examples:
- The apostolic writings are the books left by the first followers of Jesus.
- She studied the apostolic teaching of the early church.
