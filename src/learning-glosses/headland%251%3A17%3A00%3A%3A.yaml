simpleMeaning: a natural high piece of land, most of all a rocky point that sticks out into the sea
scope: 'Also called head: a natural high piece of land sticking out into the sea, not a cliff by itself
  and not a beach.'
examples:
- We walked out to the headland to watch the waves.
- The lighthouse stood on a rocky headland above the sea.
