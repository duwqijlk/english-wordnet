simpleMeaning: changed by putting words in a new way, or by adding words or taking words away
scope: This is for a text that has been changed in its words. It is not the first, unchanged version,
  and not a change of plans or of a person's mind.
examples:
- The revised report is shorter and clearer than the first one.
- Please read the revised letter before you sign it.
