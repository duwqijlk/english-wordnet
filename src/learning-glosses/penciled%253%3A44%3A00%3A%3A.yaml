simpleMeaning: drawn or written with a thin stick of wood with dark material inside it, the tool people
  use for drawing and writing
scope: Also called pencilled. This is about marks drawn or written with this tool, not about marks made
  with a pen or printed by a machine.
examples:
- She kept the penciled sketch in a folder.
- The penciled message on the card was hard to read.
