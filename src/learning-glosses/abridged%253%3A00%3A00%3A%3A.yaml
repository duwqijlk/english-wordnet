senseId: 'abridged%3:00:00::'
synsetId: 00004412-a
simpleMeaning: 'Used of texts: made shorter by cutting parts out or by writing the same ideas in fewer
  words'
scope: This sense is about a text that has been made shorter in this way; it is not the full, long text
  and not a short note about a text.
examples:
- We read an abridged version of the long novel at school.
- The abridged book kept the main story but left out some parts.
