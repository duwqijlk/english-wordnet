simpleMeaning: A tree much grown in the United States, with pale bark and leaves that are pale on the
  underside
scope: A tree much grown in the United States; abele, aspen poplar, silver-leaved poplar and white aspen
  are other names for this sense, and it is not a dark-barked tree or a low bush.
examples:
- White poplar lines the road into town.
- The white poplar leaves shone pale underneath.
