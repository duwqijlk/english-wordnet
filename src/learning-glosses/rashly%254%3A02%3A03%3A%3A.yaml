simpleMeaning: in a way that is too quick, without thinking about danger
scope: 'Also called headlong: in a way that is too quick and does not think about danger, not in a slow
  and careful way.'
examples:
- He rashly crossed the busy road without looking.
- She rashly spent all her money on the first day.
