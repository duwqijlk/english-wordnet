simpleMeaning: A lizard that lives on the ground, liking open ground and low bushes spread apart, in the
  west of the United States between the Rocky and Sierra Nevada Mountains
scope: This is a ground lizard of the west of the United States; sagebrush lizard is another name for
  it, and its nearest neighbours are the other ground lizards of open western ground.
examples:
- The Sceloporus graciosus basked on open ground among the low bushes.
- A Sceloporus graciosus darted across the bare ground between the bushes.
