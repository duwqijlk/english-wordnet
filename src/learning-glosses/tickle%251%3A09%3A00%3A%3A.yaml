senseId: 'tickle%1:09:00::'
synsetId: 05731362-n
simpleMeaning: a feeling on the skin, often caused by a light touch that moves gently across it
scope: This is the feeling on the skin itself, not the act of touching lightly to cause it and not a sudden
  strong feeling in the mind or body.
examples:
- She felt a tickle on the back of her neck as a soft scarf moved lightly across it.
- He felt a tickle on his foot as the feather moved gently across it.
