simpleMeaning: A set of written signs that came from Aramaic, used to write the Uighur language.
scope: The written signs for the Uighur language, also called Uighur and Uygur; not the language itself
  and not a member of the people who speak it.
examples:
- The old book was written in Uigur script.
- She learned to read Uigur as a child.
