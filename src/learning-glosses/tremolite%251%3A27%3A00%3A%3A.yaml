simpleMeaning: Used like asbestos, this white or pale green mineral is made of calcium, magnesium and
  silicon and comes from the amphibole group of stones.
scope: One of the minerals of the amphibole group, white or pale green in colour, it is used like asbestos.
examples:
- The tremolite here is pale green.
- The tremolite here is used as a form of asbestos.
