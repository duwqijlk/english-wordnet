simpleMeaning: having had the qualities that make someone human taken away
scope: Describes a person or group seen as if they are not human, with human qualities taken away. It
  does not describe a machine or an animal, which was never human.
examples:
- The prisoners felt dehumanized by the way the guards treated them.
- Dehumanized workers were spoken to as if they were machines.
