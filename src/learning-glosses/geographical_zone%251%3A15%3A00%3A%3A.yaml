simpleMeaning: One of the broad bands of the earth's surface, split roughly by lines of latitude or longitude.
scope: This is one of the broad bands of the earth's surface, split roughly by lines of latitude or longitude;
  zone is another name for this sense, not a land with its own laws and not a band set by weather alone.
examples:
- The tropics form a geographical zone near the equator.
- Each geographical zone has its own range of heat.
