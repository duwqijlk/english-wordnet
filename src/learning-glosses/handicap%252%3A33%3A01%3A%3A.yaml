simpleMeaning: to try to say who will win before the contest, especially in a horse race, and to set odds
  for or against each one taking part
scope: About trying to say who will win and setting odds, especially for horse races; not giving a weaker
  player an extra chance, and not a thing that makes something harder.
examples:
- He handicaps horse races for a local newspaper.
- She spent the morning handicapping the runners in the big race.
