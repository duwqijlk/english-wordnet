simpleMeaning: Making things cheaper by bringing their cost below what it usually is or what ads show
scope: The act of making things cheaper than their usual cost or the cost shown in ads; price cut is another
  name for this sense, not a sale of old or damaged goods.
examples:
- The store used price cutting to bring the cost of the shoes below the usual cost.
- Price cutting by the shops made the coats cheaper than the prices in the ads.
