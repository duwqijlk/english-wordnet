simpleMeaning: To be in close, deep touch with a person, place, or thing, and to be keenly open to it
scope: A deep sharing of feeling with a person or with nature; not the small town district and not taking
  Communion in church.
examples:
- He liked to commune with nature on long walks in the hills.
- She sat by the lake to commune with the quiet of the place.
