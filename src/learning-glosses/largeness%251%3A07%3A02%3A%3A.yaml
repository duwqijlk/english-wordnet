senseId: 'largeness%1:07:02::'
synsetId: 04796210-n
simpleMeaning: The quality of acting or speaking so as to seem far more important or worthy than one is.
scope: The quality of acting or speaking so as to seem far more important or worthy than one is, also
  called pretension, not the quality of being large or wide-ranging.
examples:
- His largeness showed in the way he boasted of his wealth.
- There was a largeness in her manner that put people off.
