simpleMeaning: a machine in which charged bits of matter are sped up along a straight path by changes
  in electric push on parts along the path
scope: A machine that speeds charged bits of matter along a straight path; linear accelerator is another
  name for this sense, not a machine that speeds them round a ring and not a plain electric motor.
examples:
- The linac sped the ions along a straight path.
- Doctors use a linac to aim beams at a tumour.
