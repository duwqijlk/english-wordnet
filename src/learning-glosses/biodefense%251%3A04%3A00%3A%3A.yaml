simpleMeaning: steps taken to guard against attacks that use germs, viruses or poisons
scope: 'Also called biodefence, biological defence and biological defense: steps taken to guard against
  attacks that use germs, viruses or poisons, not the attack itself and not steps against ordinary weapons.'
examples:
- The government spent more on biodefense after the outbreak.
- New labs were built to help with biodefense against germ attacks.
