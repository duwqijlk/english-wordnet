simpleMeaning: A ribbon or bow worn in the hair to decorate it, as a kind of head covering.
scope: A ribbon or bow worn in the hair, not the showy knot of hair or feathers that shares the same name.
examples:
- She wore a red topknot in her hair for the festival.
- The dancer's topknot matched her dress.
