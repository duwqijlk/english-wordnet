simpleMeaning: Sounds of an everyday kind are hard to bear because the hearing nerves are too easily set
  off, so hearing feels far too sharp.
scope: Also called auditory hyperesthesia and hyperacusis, this is a state in which everyday sounds are
  hard to bear, not a loss of hearing.
examples:
- Her hyperacusia made the clatter of dishes hard to bear.
- With hyperacusia, even a quiet radio sounds too loud.
