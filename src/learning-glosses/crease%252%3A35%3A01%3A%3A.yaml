simpleMeaning: to make small folds or lines appear in something smooth
scope: 'Also called wrinkle: making something get small folds or lines in it; not the fold itself, not
  a shape made by folding, and not becoming folded on its own.'
examples:
- She creased her brow when she was thinking hard.
- He creased his forehead in worry.
