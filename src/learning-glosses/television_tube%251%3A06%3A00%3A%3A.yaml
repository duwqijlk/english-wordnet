simpleMeaning: 'A glowing screen shows the picture this cathode-ray part makes from the received signal:
  a glass part that shoots rays, in a set that takes in broadcast pictures.'
scope: Also called kinescope and picture tube, this glass part makes the picture on the screen from the
  signal it takes in.
examples:
- The television tube lit up the screen.
- The television tube turned the signal into a picture.
