simpleMeaning: make someone take on something unpleasant or unfair that they did not choose
scope: Forcing an unwanted cost or duty on someone; it is not pushing an object into place, and it is
  not leaving someone puzzled.
examples:
- The boss stuck me with the paperwork for the whole weekend.
- They stuck us with a huge bill for the repairs.
