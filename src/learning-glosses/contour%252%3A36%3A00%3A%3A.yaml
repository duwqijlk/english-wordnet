simpleMeaning: to make or follow the outer edge or shape of a thing
scope: To make or follow the outer edge of a thing; not a line on a map and not the shape of a place on
  its own.
examples:
- The road contours the edge of the hill.
- She contoured the clay to the shape of the bowl.
