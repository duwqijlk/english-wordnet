simpleMeaning: A reddish or black juice or resin from certain trees of the genus Pterocarpus, used in
  medicine, in tanning and for other such work.
scope: This is a reddish or black juice or resin from certain Pterocarpus trees, used in medicine and
  tanning; kino gum and East India kino are other names for it.
examples:
- Malabar kino was used in tanning leather.
- The Malabar kino from the tree is reddish or black.
