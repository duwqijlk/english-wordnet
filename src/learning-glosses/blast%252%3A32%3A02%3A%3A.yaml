simpleMeaning: to speak or write about a person or thing in a very strong way, saying they are bad
scope: To speak or write against a person or thing in a strong, angry way. It is not the strong words
  themselves, not a loud sound, and not a plant drying up.
examples:
- The newspaper blasted the mayor for his bad plan.
- Critics blasted the film for its long, dull story.
