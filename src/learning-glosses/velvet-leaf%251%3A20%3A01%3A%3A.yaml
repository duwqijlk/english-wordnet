simpleMeaning: A tall tropical Asian plant that lives a year or turns shrubby, with velvety leaves, yellow
  blossoms and a tough fiber; now wild in southeastern Europe and the United States.
scope: The tall Asian fiber plant with velvety leaves and yellow flowers, also called butter-print; not
  the other velvet-leaf, a southwestern shrub with furry lobed leaves and red-purple blossoms.
examples:
- Velvet-leaf has soft leaves and yellow flowers.
- The velvet-leaf in the field grew nearly two metres tall.
