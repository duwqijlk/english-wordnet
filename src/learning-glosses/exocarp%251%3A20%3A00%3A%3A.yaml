simpleMeaning: the outer skin of a fruit, the layer outside the flesh, as on a peach or a grape
scope: This is the outer skin layer of a fruit; epicarp is another name for this sense; not the flesh
  inside and not the seed.
examples:
- The exocarp of a peach is its thin outer skin.
- Grapes have a soft exocarp that you can peel away.
