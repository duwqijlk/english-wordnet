simpleMeaning: Christians, Jews and Muslims share one God, and a person or belief of this kind does not
  accept that God
scope: Not accepting the one God of Christians, Jews and Muslims, also called ethnic, heathen and pagan,
  not believing in many gods and not following a Christian faith.
examples:
- The old heathenish songs made no mention of the Christian God.
- She studied heathenish beliefs that came before the Christian faith reached the land.
