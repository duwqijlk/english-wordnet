simpleMeaning: A person who cannot see can be led by this large animal, a kind that works with people
  who look after sheep and with people who enforce the law.
scope: Also called alsatian, German police dog, and German shepherd; a large kind of animal that works
  for people, not a small house pet and not a wild animal.
examples:
- The German shepherd dog guided the man through the crowd to his seat.
- A German shepherd dog can learn to work with people who enforce the law.
