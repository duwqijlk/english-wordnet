senseId: 'harmonize%2:36:00::'
synsetId: 01710748-v
simpleMeaning: to sing or play music with notes that sound good together
scope: 'Also called harmonise: to sing or play notes that fit well together, not to write extra notes
  for a song and not to make different things agree with each other.'
examples:
- The sisters harmonized on the last song, singing different notes that fit well together.
- He harmonized with the piano, playing notes that sounded good with the tune.
