simpleMeaning: a share of the winnings, loot or profit taken by the person running the game or by a gangster
scope: 'Also called a rake-off: a share of the winnings, loot or profit taken by the person running the
  game or by a gangster, not a fair fee for a service and not a tax.'
examples:
- The bookmaker took his vigorish from every bet placed that night.
- The gang demanded vigorish from the card game before anyone was paid.
