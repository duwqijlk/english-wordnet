simpleMeaning: In the way of a person who has done something wrong
scope: In the way of a person who has done something wrong; not in the way of a person who is merely shy,
  and not in the way of a person who is afraid.
examples:
- He looked guiltily at the broken window and said nothing.
- She smiled guiltily when her mother asked about the missing cake.
