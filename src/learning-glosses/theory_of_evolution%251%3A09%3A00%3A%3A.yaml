simpleMeaning: In biology, the idea, backed by tests and facts, that kinds of plants and animals change
  over time and come from earlier kinds
scope: Also called the theory of organic evolution; this is the scientific account of how species came
  to be, not a guess about one animal's life.
examples:
- The theory of evolution explains how finches came to have different beaks.
- She studied the theory of evolution in her biology class.
