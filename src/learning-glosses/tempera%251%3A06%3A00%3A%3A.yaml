simpleMeaning: Colour stuff mixed with sticky stuffs that dissolve in water, such as a glue called size
  and egg yolk
scope: Colour stuff mixed with sticky stuffs that dissolve in water, such as a glue called size and egg
  yolk, also called poster color, poster colour, and poster paint; not oil paint and not plain water colour.
examples:
- The artist painted in tempera on the wooden panel.
- Tempera dries fast because its sticky stuffs dissolve in water.
