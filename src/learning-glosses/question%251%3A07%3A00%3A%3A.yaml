simpleMeaning: doubt about whether something is true, is a fact, or really exists.
scope: This is not a sentence that asks for information, and not a formal proposal voted on at a meeting;
  it is doubt about whether something is true or exists.
examples:
- There is no question that the bridge needs repairs.
- There is some question about whether the results can be trusted.
