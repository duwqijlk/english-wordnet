simpleMeaning: The gall bladder and the outside of the liver are fed by a blood tube that comes off the
  liver's blood tube.
scope: Also called arteria cystica, this blood tube comes off the liver's blood tube to feed the gall
  bladder and the outside of the liver.
examples:
- The surgeon tied off the cystic artery first.
- They found the cystic artery during the operation.
