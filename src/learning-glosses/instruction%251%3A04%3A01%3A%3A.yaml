simpleMeaning: The work of teaching people and giving them new things they know and new things they can
  do
scope: Also called education and teaching, this is the work of teaching people, not a single order telling
  a person what to do.
examples:
- Her instruction in music began when she was six.
- Good instruction helps pupils learn to read and write.
