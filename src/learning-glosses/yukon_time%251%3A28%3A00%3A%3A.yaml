simpleMeaning: The set hours kept in the 9th zone west of Greenwich, fixed at the 135th meridian west,
  used in Hawaii and most of Alaska.
scope: The set hours kept in Hawaii and most of Alaska, also called Alaska Standard Time; they are fixed
  at the 135th meridian west, in the 9th zone west of Greenwich.
examples:
- Yukon Time is nine hours behind Greenwich.
- In most of Alaska the clocks keep Yukon Time.
