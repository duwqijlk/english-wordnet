simpleMeaning: A clear crystal stuff that tastes sour, got from tannin, a bitter stuff found in bark and
  leaves.
scope: This is a clear crystal stuff with a sour taste, got from tannin; not tannin itself, and not a
  fruit acid such as the one in lemons.
examples:
- Gallic acid forms clear crystals from tannin.
- The chemist used gallic acid in the ink.
