simpleMeaning: A pretty evergreen shrub like a small tree, of the Pacific coast of the United States,
  with large white flowers and red berry-like fruits; often put in the genus Photinia.
scope: 'Also called toyon, tollon, Christmas berry, Christmasberry and Photinia arbutifolia: a pretty
  evergreen shrub like a small tree, of the Pacific coast of the United States, with large white flowers
  and red berry-like fruits; other shrubs of the same coast have flowers or fruits of other colours.'
examples:
- Heteromeles arbutifolia grows along the Pacific coast with large white flowers.
- The red berry-like fruits of Heteromeles arbutifolia brighten the winter garden.
