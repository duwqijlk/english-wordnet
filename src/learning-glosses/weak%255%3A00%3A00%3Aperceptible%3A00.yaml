simpleMeaning: small in amount or force and hard to notice, and not clear, bright or loud, or the like
scope: About faint light, sound or amount, not bodily frailty, poor skill, or moral failing; faint is
  another name.
examples:
- His voice was weak, and we could barely hear him.
- The lamp gave only a weak light across the room.
