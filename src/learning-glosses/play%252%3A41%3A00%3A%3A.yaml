simpleMeaning: to spend time on enjoyable activities rather than work, as a way to amuse oneself.
scope: This sense is not about children amusing themselves in a childlike way, not about performing music
  or taking a role, and not about careless behavior; it is about spending free time on enjoyable activity
  instead of work.
examples:
- We played cards after dinner.
- After the meeting, the team played a few rounds of darts.
