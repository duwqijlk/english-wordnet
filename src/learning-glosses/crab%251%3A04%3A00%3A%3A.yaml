simpleMeaning: a pull of an oar in rowing that misses the water or goes too deep into it
scope: A bad pull of an oar when rowing; not the animal with claws, not its flesh as food, and not the
  tiny insect that lives on people.
examples:
- He caught a crab when his oar missed the water, and his boat fell behind.
- She caught a crab on the last stroke and nearly dropped her oar.
