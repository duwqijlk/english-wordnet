simpleMeaning: playful in a bad, annoying way
scope: 'Also called arch, wicked, mischievous and puckish: playful in a bad, annoying way. Not truly evil,
  and not playful in a kind, harmless way.'
examples:
- He gave an impish grin before hiding his sister's shoes.
- The impish child laughed as she teased her brother.
