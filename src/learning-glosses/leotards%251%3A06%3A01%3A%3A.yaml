simpleMeaning: Tight knitted wear that covers the body from the waist to the feet, worn by acrobats and
  dancers, and by women and girls in place of stockings.
scope: Also called tights, this is tight knitted wear from the waist to the feet, worn by acrobats and
  dancers and by women and girls in place of stockings.
examples:
- The dancer pulled on her leotards before the show.
- She wore leotards under her skirt in winter.
