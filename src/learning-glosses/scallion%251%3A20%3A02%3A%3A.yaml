simpleMeaning: a plant with a large thin white bulb and flat dark green leaves lying over each other,
  used in cooking and thought to come from a wild plant, Allium ampeloprasum
scope: Also called leek, this is the plant with a large white bulb and flat green leaves, not a young
  onion before its bulb has grown large.
examples:
- He sliced the large scallion, with its thin white bulb and flat green leaves, for the stew.
- The scallions in the garden had grown into big plants with flat leaves lying over each other.
