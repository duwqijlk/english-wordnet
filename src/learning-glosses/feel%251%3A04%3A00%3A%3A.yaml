simpleMeaning: an act of touching someone's sex organs for sexual pleasure.
scope: This is the noun for the act itself, not the verb, and not the general sense of texture or of a
  feeling.
examples:
- He was fired for copping a feel at the office party.
- A passenger complained that a man had copped a feel.
