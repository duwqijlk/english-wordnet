simpleMeaning: Marked to show a few degrees above and below the usual body heat, this mercury tool takes
  a person's temperature.
scope: Also called mercury-in-glass clinical thermometer, this mercury tool is made to take a person's
  body heat and is marked for a few degrees on either side of the usual body heat.
examples:
- The nurse used the clinical thermometer to take his temperature.
- She shook the clinical thermometer down before she used it again.
