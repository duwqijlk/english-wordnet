simpleMeaning: In Yiddish, a person who is easily tricked and not very bright, and who is more to be pitied
  than scorned
scope: In Yiddish, a person easily tricked and not very bright, also called a schnook; more to be pitied
  than scorned, not a clever cheat and not a villain.
examples:
- Don't be such an apologetic shnook.
- He felt like a shnook after he paid twice for the same ticket.
