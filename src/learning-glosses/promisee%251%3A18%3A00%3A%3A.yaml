simpleMeaning: A person who is given someone's word that a thing will be done
scope: A person who is given someone's word that a thing will be done, not the person who gives the word
  and not a person with no part in it.
examples:
- The promisee waited for the money she had been promised.
- As promisee, he had the right to ask for what was agreed.
