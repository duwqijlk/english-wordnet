simpleMeaning: A heavy grey-white metal that can poison and joins with one or two other atoms; the only
  metal that stays liquid at normal temperatures.
scope: A heavy grey-white metal that stays liquid at normal temperatures, also called mercury, quicksilver,
  Hg and hydrargyrum; set apart from other heavy metals and from metals that are solid at normal temperatures.
examples:
- Atomic number 80 is the only metal that stays liquid at normal temperatures.
- Old thermometers held atomic number 80 inside a glass tube.
