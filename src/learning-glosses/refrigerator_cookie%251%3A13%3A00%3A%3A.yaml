scope: A cake made by slicing chilled dough, not a cake baked from a flat sheet of dough and not a cake
  made from drops of dough.
examples:
- She made refrigerator cookies from the roll of dough she had left to chill.
- We sliced the refrigerator cookie dough into rounds and baked them until golden.
