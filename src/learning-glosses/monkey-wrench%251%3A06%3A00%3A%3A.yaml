simpleMeaning: One jaw stays fixed and the other jaw moves, so this tool can be set to more than one width
scope: 'Also called a monkey wrench: a tool with one fixed jaw and one that moves, not a fixed tool and
  not a pair of pliers.'
examples:
- He used a monkey-wrench to loosen the nut.
- She adjusted the monkey-wrench before turning the bolt.
