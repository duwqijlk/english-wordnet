simpleMeaning: An old television camera tube, now unused, that turned light into a picture signal. Light
  hitting a light-sensitive surface freed electrons, focused onto a target that released still more electrons.
scope: Another name for the image orthicon, the same obsolete camera tube. It is not the screen tube that
  shows the picture, and not a modern digital image sensor.
examples:
- The orthicon was sensitive enough to pick up a scene lit only by candles.
- Engineers praised the orthicon for its sharp picture but complained about its size.
