simpleMeaning: A view held in advance, in favour of a person or thing, before the facts are known
scope: A view held in advance, in favour of a person or thing; not a dislike fixed in advance and not
  a judgment made after the facts are known.
examples:
- His prepossession in her favour shaped his view of the case.
- The king's prepossession in my favour proved very valuable.
