simpleMeaning: From plain chain-like hydrocarbons come groups of atoms with the form CnH2n+1, each able
  to join to just one other group
scope: Each of these groups is also called an alkyl group or an alkyl radical.
examples:
- The alkyl group in the molecule has the form CnH2n+1.
- The alkyl joins to one other group in the molecule.
