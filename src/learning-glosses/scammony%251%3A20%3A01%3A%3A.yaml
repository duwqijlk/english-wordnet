simpleMeaning: A climbing plant of Asia Minor with cream to purple flowers and long, thick roots that
  produce a resin used as a laxative.
scope: This is the climbing plant itself, not the cathartic resin taken from its roots, nor the tropical
  American morning glory that also carries the name.
examples:
- Scammony is a climbing plant of Asia Minor with cream to purple flowers.
- The long, thick roots of scammony yield a resin used as a laxative.
