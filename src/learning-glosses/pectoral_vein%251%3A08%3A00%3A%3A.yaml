simpleMeaning: Blood from the chest muscles runs through these blood tubes into the big blood tube under
  the collar bone.
scope: Vena pectoralis is another name for these blood tubes, which drain the chest muscles and are not
  the big tube under the collar bone into which they empty.
examples:
- Blood ran from the chest muscles through the pectoral vein.
- The pectoral vein joined the big blood tube under the collar bone.
