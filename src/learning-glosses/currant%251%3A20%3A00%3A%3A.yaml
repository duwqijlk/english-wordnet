simpleMeaning: one of several bushes in the Ribes group (a group of plants that are close in kind) that
  lose their leaves each year and bear small round fruit
scope: 'Also called currant bush: this is the plant itself, not the fresh berry that grows on it and not
  the small dried fruit used in cooking.'
examples:
- The currant in her garden loses its leaves each winter.
- She planted a currant in spring, and by summer the bush had many berries.
