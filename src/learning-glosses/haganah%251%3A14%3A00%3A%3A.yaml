simpleMeaning: The secret armed wing of the Jewish leaders in Palestine under British rule over the mandate
  from 1920 to 1948, which formed the base of the Israeli defense force.
scope: This is the secret armed group of the Jewish leaders in Palestine under British rule, not the later
  Israeli defense force itself.
examples:
- The Haganah guarded Jewish settlements in Palestine.
- Many Haganah members later joined the Israeli defense force.
