simpleMeaning: looking or feeling happy, amused, or pleased.
scope: This describes someone who looks or feels happy and amused, not the sound or act of laughter, and
  not a lasting cheerful temperament.
examples:
- The laughing children chased each other across the grass.
- A laughing baby can lift the mood of a whole room.
