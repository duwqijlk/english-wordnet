simpleMeaning: to do with or like a member of the group of animals with eight legs
scope: 'Also called spiderlike: this means to do with or like a member of the group of animals with eight
  legs, not just having long, thin parts.'
examples:
- The spidery animal moved on eight thin legs.
- She drew a spidery creature with eight legs in her notebook.
