simpleMeaning: An unseen being of Islam that takes the shape of a person or an animal, named in the Koran
  and said to live on earth and work on people.
scope: Also called jinnee, genie, djinn, djinni and djinny, it is, in Islam, an unseen being named in
  the Koran that can take the shape of a person or an animal.
examples:
- The jinni appeared as a man.
- A jinni can take the shape of an animal.
