simpleMeaning: To put up with something difficult or unpleasant and get used to it.
scope: This is about enduring an unpleasant situation, not about believing a claim, approving of something,
  receiving a gift, or paying someone else's debts.
examples:
- I shall have to accept these unpleasant working conditions.
- After a year, he accepted the long commute as part of the job.
