simpleMeaning: able to react with other things only a little in chemistry; not active in a chemical change
scope: Able to react in chemistry only a little, and not active in a chemical change; also called indifferent,
  not a thing with no special quality and not a thing that takes no side.
examples:
- This gas is neutral and will not react.
- The neutral matter stayed unchanged in the test.
