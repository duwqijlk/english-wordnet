simpleMeaning: a thick, heavy cloth laid on a floor to cover it, usually with a soft, raised top
scope: Also called carpet and rug; this is the cloth itself that covers a floor.
examples:
- The new carpeting covered the whole office floor.
- They chose thick carpeting for the cold rooms.
