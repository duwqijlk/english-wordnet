simpleMeaning: The office in the United States military supply body that lists, checks the worth of, and
  sells used government goods that can be used again.
scope: 'Also called Defense Reutilization and Marketing Service: the office in the United States military
  supply body that lists, checks the worth of, and sells used government goods, covering only goods that
  can be used again.'
examples:
- The DRMS sold the surplus trucks at auction.
- Old office desks went to the DRMS for resale.
