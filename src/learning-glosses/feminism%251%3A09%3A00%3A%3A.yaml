simpleMeaning: The belief that women should have the same rights as men, and the push to make it so
scope: The belief that women should have equal rights; not the belief that women should rule over men,
  and not a single law about women's rights.
examples:
- Feminism changed the law so women could vote.
- She wrote about feminism and the fight for equal pay.
