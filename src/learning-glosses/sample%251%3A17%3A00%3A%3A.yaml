simpleMeaning: Something from nature, or part of it, that people take and keep to show what things of
  its kind are like
scope: This is a thing from nature kept as an example of its kind, not the act of taking or trying a small
  amount.
examples:
- He brought back a rock sample from the mountain.
- The museum keeps a plant sample from the forest.
