simpleMeaning: to make someone lose courage, feel afraid to go on, and turn away in fear
scope: 'Also called scare, dash and daunt: to make a person lose courage, not the noun for hanging cloth
  or for a sudden fear, and not to become boring.'
examples:
- He was palled by the size of the task and turned away from it.
- The steep climb palled the young walkers, and they gave up and went back.
