senseId: 'retaliatory_eviction%1:04:00::'
synsetId: 01197677-n
simpleMeaning: In law, forcing a person who rents a home to leave, done to get back at them for honest
  complaints about the owner, against the law in many states
scope: Forcing a renter out of a home to get back at them for honest complaints, not a move for unpaid
  rent and not a move at the end of a lease.
examples:
- The retaliatory eviction came after she told the city about the broken heating.
- His retaliatory eviction was ruled unlawful because it followed his complaints.
