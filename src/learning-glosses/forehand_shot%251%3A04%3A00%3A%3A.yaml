simpleMeaning: In sports, a return hit made with the palm of the hand turned toward the way the ball is
  going, as in tennis, badminton or squash
scope: This is a hit with the palm facing the way the ball goes; forehand and forehand stroke are other
  names for it, not a backhand hit with the back of the hand facing forward.
examples:
- Her forehand shot won the point.
- He practised his forehand shot every morning.
