synsetId: 14243956-n
simpleMeaning: A long-lasting form of spine illness, mostly in men, that makes the spine hard to move;
  it can end with the spine bones joining together.
scope: 'Also called ankylosing spondylitis and rheumatoid spondylitis: a long-lasting spine illness, mostly
  in men, that stiffens the spine and can end with the bones joining together, not a short back injury
  and not a muscle strain.'
examples:
- His Marie-Strumpell disease made it hard for him to bend his back.
- Marie-Strumpell disease can slowly stiffen the spine over many years.
