senseId: 'taste%1:09:02::'
synsetId: 05723230-n
simpleMeaning: the feeling produced in the mouth when tiny sensors on the tongue and throat detect what
  a dissolved substance is made of.
scope: This is not the ability to judge what is good or beautiful, and not a personal liking for something;
  it is the physical sensation produced in the mouth by a dissolved substance.
examples:
- The medicine left a bitter taste in my mouth.
- The soup had a strong taste of garlic.
