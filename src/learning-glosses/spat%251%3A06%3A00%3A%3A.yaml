simpleMeaning: A piece of cloth worn over the top of the foot and the ankle, like a short leg cover.
scope: This is a cloth cover for the foot and ankle, not a short quarrel or clapping after a show.
examples:
- He wore spats over his shoes to keep them clean.
- Her spats covered the tops of her feet and her ankles.
