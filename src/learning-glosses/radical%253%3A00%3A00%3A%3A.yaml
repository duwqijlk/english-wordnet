simpleMeaning: especially of leaves, at the base of a plant or stem, and especially growing straight from
  the root, the thick underground stem, or a stem like a root
scope: This word is about plants, for leaves and parts at the base or growing from the root. It is not
  about a person with strong new ideas, and not about great or extreme change.
examples:
- The plant has radical leaves that grow in a ring at its base.
- Radical leaves come straight from the root, not from the upper stem.
