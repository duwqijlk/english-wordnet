simpleMeaning: frightened animals, such as horses or cattle, running off all at once in a wild rush
scope: A rush of frightened animals, not a rush of people acting on a sudden urge.
examples:
- The stampede of cattle swept across the plain.
- A loud noise started a stampede among the horses.
