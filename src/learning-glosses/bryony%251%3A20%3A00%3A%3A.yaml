simpleMeaning: A climbing plant of the group called Bryonia, with big leaves and small flowers, giving
  a sharp juice that makes you sick and clears the bowels.
scope: Also called briony; a climbing plant with big leaves and small flowers, not a plant grown for food.
examples:
- The bryony climbed over the fence by the lane.
- She warned the children not to taste the bryony juice.
