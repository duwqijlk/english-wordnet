simpleMeaning: having grey or brown lines, patterns, or patches of colour, used especially for the patterned
  fur of cats
scope: Also called brindle, brindled, and brinded. This describes an animal's grey or brown patterned
  fur, especially a cat's; it is not the noun that names the cat itself.
examples:
- The tabby cat has grey and brown stripes on its fur.
- We have a small tabby kitten with patchy brown fur.
