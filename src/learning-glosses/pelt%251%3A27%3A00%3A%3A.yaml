simpleMeaning: the hairy skin of an animal that feeds its young with milk, made ready to use
scope: 'Also called fur: the hairy skin of such an animal, made ready to use. It is not the verb sense
  of throwing things again and again.'
examples:
- The hunter sold the wolf pelt for a high price.
- Her coat was made from a soft rabbit pelt.
