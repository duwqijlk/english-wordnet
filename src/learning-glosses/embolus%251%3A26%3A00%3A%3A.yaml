simpleMeaning: Moving around in the blood, this bit of matter that should not be there may be a bubble
  of air or a bit of a clot
scope: This bit of matter, such as a bubble of air or a bit of a clot, moves in the blood and is not a
  normal part of it.
examples:
- The scan showed an embolus moving in the blood near his heart.
- A small embolus, a bit of a clot, was found in the blood.
