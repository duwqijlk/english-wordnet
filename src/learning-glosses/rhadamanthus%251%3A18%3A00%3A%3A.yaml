simpleMeaning: In Greek stories, one who judges dead people in the world of the dead.
scope: A judge of the dead in Greek stories, not a judge of the living and not a god of the underworld.
examples:
- In the old stories, Rhadamanthus judged the dead who came to the underworld.
- Rhadamanthus sat as a judge over the souls of the dead.
