simpleMeaning: On land lives a slow black beetle of the weevil kind, hard in body; its young eat such
  things as rotting plant matter and grain.
scope: 'Also called darkling beetle and darkling ground beetle: a slow, hard, black land bug of the weevil
  kind whose young eat such things as rotting plant matter and grain.'
examples:
- A tenebrionid crept slowly across the ground.
- The tenebrionid's young feed on grain.
