simpleMeaning: For a hunting dog to show where an animal or bird being hunted is by standing still with
  its nose aimed at it.
scope: This is not someone indicating a direction with a finger or making a sharp tip; it is a hunting
  dog signalling the presence of prey with its nose and still posture.
examples:
- The setter pointed a pheasant in the tall grass.
- The dog pointed quail near the fence.
