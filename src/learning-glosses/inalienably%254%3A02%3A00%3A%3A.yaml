senseId: 'inalienably%4:02:00::'
synsetId: 00140964-r
simpleMeaning: in a way that cannot be taken away or given away
scope: Holding or keeping something in a way that cannot be taken away or given away; not merely owning
  it for a long time.
examples:
- This property is held inalienably by the family.
- The rights were granted inalienably, never to be sold.
