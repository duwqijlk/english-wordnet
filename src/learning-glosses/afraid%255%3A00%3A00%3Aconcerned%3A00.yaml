simpleMeaning: It describes feeling sorry or worried about something and is often used to make an unpleasant
  statement sound gentler.
scope: This is the sorry-or-worried use that softens bad news, not the sense of being frightened.
examples:
- I'm afraid we won't be able to come to dinner after all.
- I'm afraid the shop is already closed.
