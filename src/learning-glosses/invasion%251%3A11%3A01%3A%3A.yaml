simpleMeaning: In medicine, the spread of germs that cause disease, or of bad cells, to new places in
  the body
scope: In medicine, germs or bad cells spreading to new places in the body, not an army going into a place.
examples:
- The tumor's invasion of nearby tissue worried the doctors.
- Doctors watched the invasion of the germs into the lungs.
