simpleMeaning: A soft silver-white metal of the rare earth group; kind 170 gives off X-rays and is used
  in small X-ray machines you can carry; found in monazite, apatite and xenotime.
scope: Also called thulium and atomic number 69; a soft rare earth metal, not iron and not a metal used
  in building.
examples:
- Tm is used in small X-ray machines.
- The lab keeps Tm sealed from air.
