simpleMeaning: a slow-growing, mid-sized evergreen tree from the east side of the United States, much
  like the American arborvitae
scope: A slow-growing, mid-sized evergreen tree from the east side of the United States, much like the
  American arborvitae; southern white cedar, white cedar and white cypress are other names for this, not
  a fast-growing tree and not a tree from the west of the country.
examples:
- Coast white cedar grows slowly along the east side of the country.
- The coast white cedar in the garden is only a few feet tall.
