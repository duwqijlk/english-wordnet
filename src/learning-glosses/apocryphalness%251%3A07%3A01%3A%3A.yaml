senseId: 'apocryphalness%1:07:01::'
synsetId: 92419947-n
simpleMeaning: The quality of being possibly not genuine, lacking authority, or not counted among the
  accepted works.
scope: The quality of being of doubtful genuineness or authority, not a proven falsehood, and not doubtful
  truthfulness of a tale.
examples:
- Scholars argued about the apocryphalness of the old manuscript.
- The apocryphalness of the letter made experts doubt that it was real.
