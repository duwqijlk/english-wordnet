simpleMeaning: a sign shown as bright light drawn around the head of a holy person
scope: 'Also called glory, halo, aura and aureole: a sign of bright light around a holy person''s head
  in a picture, not a dark rain cloud.'
examples:
- The saint in the old painting has a golden nimbus around her head.
- He painted a bright nimbus behind the saint's head.
