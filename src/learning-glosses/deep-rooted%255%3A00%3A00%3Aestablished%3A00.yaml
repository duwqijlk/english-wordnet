simpleMeaning: of ideas or beliefs above all, set in place and held so firm that they do not change
scope: An idea or belief held so firm that it does not change; deep-seated, implanted, ingrained and planted
  are other names for this sense, not a passing thought and not a fact that is still open to doubt.
examples:
- Her deep-rooted belief in fair play shaped every choice she made.
- The deep-rooted habit of saving a little each week stayed with him for life.
