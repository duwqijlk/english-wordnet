simpleMeaning: One of several drugs given for raised blood pressure and uneven heartbeat, cutting heartbeats
  in strength and speed by stopping beta-adrenergic receptors lying in the body's self-working nerves.
scope: Also called beta-adrenergic blocker, beta-blocking agent, and beta blocker, one of several drugs
  given for raised blood pressure and uneven heartbeat, cutting heartbeats in strength and speed by stopping
  beta-adrenergic receptors lying in the body's self-working nerves.
examples:
- Beta-adrenergic blocking agents treat high blood pressure.
- Beta-adrenergic blocking agent cuts the heartbeat rate.
