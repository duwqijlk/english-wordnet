simpleMeaning: A plant that grows mostly on wet sour soil in North America, living one year, with usually
  yellow or orange flowers.
scope: Also called celandine, jewelweed, lady's earrings and orange balsam, this is a North American plant
  of wet sour soil, not the Mediterranean vine of the same name.
examples:
- The touch-me-not was covered with yellow flowers.
- Touch-me-not keeps to wet sour soil in North America.
