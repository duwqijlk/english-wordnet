simpleMeaning: the way the inside of a home is set out, and its furniture and other things, seen as one
  whole look
scope: 'Also called interior decoration: the whole look of the inside of a home, not a single pretty object
  or pattern put on something.'
examples:
- The decor of the small flat was simple, with white walls and wooden furniture.
- She chose warm colours for the decor in every room of the house.
