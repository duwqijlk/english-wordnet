simpleMeaning: A Chadic tongue spoken south of Lake Chad, notably in North Region, Mayo-Louti division,
  Mayo-Oulo and Guider subdivisions northwest of Guider, Far North Region, Mayo-Tsanaga division, Hina
  and Bourrah subdivisions.
scope: Also called Daba, Daba language, Kola, Kola language and Musgoi; one Chadic tongue among many,
  spoken south of Lake Chad in the places named in its gloss.
examples:
- Musgoi language is spoken in the North Region.
- She grew up speaking Musgoi language.
