simpleMeaning: low in mineral content, or containing little that will burn
scope: The adjective for material low in mineral content or in substances that burn, not the adjective
  for a thin body and not the verb for bending.
examples:
- The ore from that seam is too lean to be worth mining.
- The boiler was designed to burn lean fuel.
