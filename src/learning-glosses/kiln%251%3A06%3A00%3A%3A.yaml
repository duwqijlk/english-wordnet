senseId: 'kiln%1:06:00::'
synsetId: 03622304-n
simpleMeaning: a very hot oven used to bake, burn, or dry things such as porcelain (a hard, white material
  made from clay, used for cups and plates) or bricks
scope: This is a very hot oven for making clay things hard, not a home oven for cooking food and not a
  fire in the open air.
examples:
- The bricks were baked in a kiln for two days.
- She put the clay cups into the kiln to make them hard.
