simpleMeaning: a golfer who strikes the ball with the long club used for long shots from the tee.
scope: This is not a person who guides animals that pull a load, and not someone at the wheel of a car;
  it names a golfer using a particular long club.
examples:
- As a driver, she can reach the green from the tee on most par fours.
- The golf coach says the young player is a natural driver with great power.
