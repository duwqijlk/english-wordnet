simpleMeaning: To make small hollows appear in your cheeks when you smile.
scope: To smile in a way that makes small hollows appear in the cheeks, not to mark a surface with hollows,
  and not the hollow in the cheek itself.
examples:
- The little girl dimpled as she smiled at her grandmother.
- He dimpled with delight when he saw the cake.
