simpleMeaning: A chemical that is found in the body in very small amounts but is still needed for many
  of the body's life processes
scope: A chemical found in the body in very small amounts yet needed for many life processes; not a chemical
  the body needs in large amounts and not a chemical the body can do without.
examples:
- Iron is a trace element the body needs in tiny amounts.
- Without that trace element, many of the body's processes slow down.
