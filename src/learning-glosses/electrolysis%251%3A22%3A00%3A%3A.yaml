simpleMeaning: In chemistry, a change in which a liquid holding charged bits is split by power sent through
  it
scope: In chemistry, a change splitting a liquid with power, not the removal of unwanted hair and not
  the melting of a solid.
examples:
- Electrolysis splits water into hydrogen and oxygen.
- They used electrolysis to get copper out of the liquid.
