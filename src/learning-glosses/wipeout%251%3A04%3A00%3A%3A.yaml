simpleMeaning: a bad fall during a sport, such as falling off a bike, falling while skiing, or being tipped
  over on a surfboard
scope: This is a bad fall while playing a sport; not a fall in everyday life and not a controlled jump.
examples:
- He took a wipeout on the ski slope and lost both poles.
- The surfer's wipeout sent her tumbling into the waves.
