simpleMeaning: Leaves and other plant parts are held up and fed by thin cords or ribs that branch through
  them like a net
scope: 'Also called a vein: any thin cord or rib in the branching net of a leaf or other plant part, not
  the rib that stiffens an insect''s wing.'
examples:
- You can see the nervure running down the middle of the leaf.
- The nervures of the leaf branch out like a net.
