simpleMeaning: Any of the kinds of sheep kept for wool, for meat to eat, or for skin.
scope: Also called domestic sheep, this is any of the kinds of sheep kept for wool, for meat to eat, or
  for skin; other sheep are wild, not kept by people.
examples:
- Ovis aries is kept for its wool.
- Farmers raise Ovis aries for meat and skin.
