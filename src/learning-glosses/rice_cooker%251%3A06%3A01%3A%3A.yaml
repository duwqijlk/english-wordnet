simpleMeaning: a kitchen machine that works by itself to boil or steam the small grain people eat as a
  main food
scope: Not a pot on the stove, and not a machine that fries food; also called rice steamer.
examples:
- She put the grain in the rice cooker and pressed start.
- The rice cooker boiled the grain while she made the curry.
