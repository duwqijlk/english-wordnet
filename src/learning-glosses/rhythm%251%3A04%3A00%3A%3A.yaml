simpleMeaning: 'natural family planning: an egg is thought to leave a woman''s body 14 days before her
  period; days 10 to 18 are thought to be her days for becoming pregnant'
scope: 'The family-planning sense: planning by counting days in a woman''s cycle. Not the beat in music,
  not the pattern of strong and weak sounds in speech, and not a pattern in a building.'
examples:
- They planned their family by rhythm, counting the days of her cycle.
- With the rhythm method, she counted the days of her cycle with care.
