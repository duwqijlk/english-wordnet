senseId: 'promissory%3:01:00::'
synsetId: 03009248-a
simpleMeaning: that is itself a promise or is linked to one
scope: Describes something that is linked to a promise or has the form of one; it is not the act of promising
  and not a person who makes a promise.
examples:
- He signed a promissory note and agreed to pay back the money next month.
- A promissory note is a written promise to pay a set sum of money.
