senseId: 'hypercholesterolemia%1:26:00::'
synsetId: 14292821-n
simpleMeaning: The risk of atherosclerosis, the narrowing of blood vessels, goes up when the blood cells
  and the liquid part of the blood hold too much of a fatty substance
scope: Too much of a fatty substance in the blood, also called hypercholesteremia; not too much potassium
  in the blood and not the fatty substance itself.
examples:
- Her hypercholesterolemia was found in a blood test.
- The clinic treats patients with hypercholesterolemia.
