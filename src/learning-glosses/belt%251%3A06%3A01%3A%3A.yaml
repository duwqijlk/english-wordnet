simpleMeaning: a loop of bendable material with no end, placed between two shafts or pulleys (turning
  bars or wheels in a machine)
scope: A machine part in the form of a loop between turning parts, not a band worn round the waist and
  not a strip of bullets for a gun.
examples:
- The belt runs between the two pulleys and turns the fan.
- When the belt broke, the machine stopped turning.
