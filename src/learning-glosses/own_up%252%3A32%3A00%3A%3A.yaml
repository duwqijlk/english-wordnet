simpleMeaning: To say openly that you did wrong, or made a mistake
scope: To say openly that you did wrong or made a mistake, also called fess up and make a clean breast
  of, not to hide a wrong or blame someone else.
examples:
- She owned up to breaking the vase as soon as her mother asked.
- He finally owned up and said the mistake was his.
