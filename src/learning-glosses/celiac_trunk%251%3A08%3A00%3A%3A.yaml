simpleMeaning: The artery given off by the abdominal aorta immediately below the diaphragm, which divides
  into the left gastric, common hepatic and splenic arteries.
scope: 'The same vessel under a second name: the celiac artery, the upper abdominal artery that feeds
  the stomach, liver and spleen. It is not the aorta itself, nor the mesenteric arteries, which supply
  the intestines. The term belongs to anatomy.'
examples:
- The radiologist measured the diameter of the celiac trunk.
- Damage to the celiac trunk can reduce blood flow to the liver and spleen.
