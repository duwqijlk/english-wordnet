senseId: 'dare%2:41:00::'
synsetId: 02380015-v
simpleMeaning: To go ahead and do something bold that you were never given leave to do.
scope: This is the presumptuous use, as in 'How dare you?', not plain courage to try something or a challenge
  to another person; make bold and presume are other names for this sense.
examples:
- How dare you call my lawyer?
- He dared to walk into the director's office uninvited.
