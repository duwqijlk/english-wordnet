simpleMeaning: Showing cruel or otherwise morally wrong character or behavior.
scope: This is not feeling sorry about something done, having poor skill, or food becoming unfit to eat;
  it describes moral wrongdoing.
examples:
- He was a bad man who took pleasure in hurting others.
- Her bad deeds harmed people who trusted her.
