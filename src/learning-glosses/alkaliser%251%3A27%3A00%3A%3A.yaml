simpleMeaning: a thing that takes away acid, most often the acid in the stomach
scope: 'Also called antacid, alkalizer, antiacid, and gastric antacid: a thing that takes away acid, most
  often in the stomach, not a thing that stops the stomach from making acid, and not a thing that makes
  acid.'
examples:
- He took an alkaliser after meals to calm the burn in his chest.
- The doctor said an alkaliser would help with the acid in her stomach.
