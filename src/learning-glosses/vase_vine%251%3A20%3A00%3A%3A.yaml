simpleMeaning: the tough outer leaves of each flower bend back on this low climbing shrub of the south-east
  United States, whose big red-purple blooms are shaped like bells
scope: 'Also called leather flower and vase-vine: a low climbing shrub of the south-east United States
  with bell-shaped red-purple blooms, not a tall woody vine with purple or blue flowers.'
examples:
- The vase vine in our garden has big red-purple flowers shaped like bells.
- We planted a vase vine along the fence for its bell-shaped blooms.
