simpleMeaning: A maple tree from Europe and Asia, with pale grey bark that comes off in flakes and leaves
  with five egg-shaped parts that turn yellow in autumn
scope: A European and Asian maple with flaking pale grey bark and five-parted leaves, not the North American
  plane tree of the same name and not its wood.
examples:
- A sycamore shades the garden in summer.
- The sycamore's leaves turned yellow in autumn.
