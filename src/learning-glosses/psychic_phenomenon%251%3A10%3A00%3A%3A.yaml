senseId: 'psychic_phenomenon%1:10:00::'
synsetId: 07271043-n
simpleMeaning: Things that happen and seem to break the laws of nature, as if the mind caused them
scope: Things that seem to break the laws of nature and seem to come from the mind, also called parapsychology
  and psychic phenomena; not an ordinary event that follows the laws of nature, and not a magic trick.
examples:
- The psychic phenomenon left the crowd sure that the mind had moved the table.
- She wrote about a psychic phenomenon in which a clock stopped with no known cause.
