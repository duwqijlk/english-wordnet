simpleMeaning: The warmth given out or taken in when one mole, a set amount, of a substance is dissolved
  in a large amount of a liquid that dissolves it
scope: This is the warmth given out or taken in when a substance is dissolved in a large amount of a liquid,
  and not the warmth given out or taken in while a substance is made from its parts.
examples:
- The heat of solution was measured in the lab.
- They worked out the heat of solution for the salt.
