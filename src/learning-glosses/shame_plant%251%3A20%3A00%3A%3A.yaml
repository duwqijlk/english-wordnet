simpleMeaning: A shrub from tropical America and Australia, lying flat or standing half-upright, has backward-curving
  thorns and soft grey-green leaflets that fold and droop when handled, cooled or at night.
scope: A low, flat-growing, thorn-armed tropical shrub, not the other semi-climbing sensitive plant with
  prickles and not the annual touch-me-not of wet ground.
examples:
- The shame plant closed its leaves as soon as the dog brushed through the border.
- Its thorny stems make the shame plant awkward to pull up.
