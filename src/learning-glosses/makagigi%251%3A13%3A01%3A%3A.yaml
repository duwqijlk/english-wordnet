simpleMeaning: Small sweet cakes made with poppy seeds and honey, a sweet treat long eaten at Christmas
  in Poland.
scope: Small sweet cakes of poppy seeds and honey, a Christmas treat in Poland; not a plain biscuit and
  not a cake for Easter.
examples:
- Grandmother baked makagigi for Christmas Eve.
- The makagigi were sweet with honey and poppy seeds.
