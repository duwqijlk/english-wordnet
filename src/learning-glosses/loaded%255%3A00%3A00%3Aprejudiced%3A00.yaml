simpleMeaning: 'of a statement or question: having an extra meaning that makes people think of something
  else, and often meant to trick them or change their minds'
scope: This is about words or a question with an extra hidden meaning, often meant to trick people. It
  is not full or filled, and not about a gun with bullets in it.
examples:
- 'That was a loaded question: it made her sound guilty whatever she said.'
- '''Do you still cheat at cards?'' is a loaded question.'
