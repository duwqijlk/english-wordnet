simpleMeaning: Any machine that makes a drawn record of brain waves by catching the currents the brain
  makes.
scope: A machine that records brain currents, not a brain scan picture and not a heart machine.
examples:
- The encephalograph traced the currents made by the brain.
- An encephalograph was used to record the patient's brain waves.
