simpleMeaning: of or coming from ordinary people, who form the base of a country's political and money
  life
scope: Of or coming from ordinary people at the base of a country's political and money life, not of the
  leaders at the top.
examples:
- The grassroots movement for nuclear disarmament grew in small towns.
- A grassroots group of farm workers asked for fair pay.
