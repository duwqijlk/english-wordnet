simpleMeaning: In this procedure a fresh passage is opened into the inner ear, so that a person can hear
  again after the bone there has hardened and hearing was lost.
scope: This is the procedure that opens a fresh passage into the inner ear, to bring back hearing lost
  when the bone hardens.
examples:
- The surgeon chose fenestration for her ear.
- After the fenestration, he could hear again.
