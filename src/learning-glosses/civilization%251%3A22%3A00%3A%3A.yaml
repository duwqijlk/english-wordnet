simpleMeaning: the change by which a group of people grows into a settled, well-ordered way of life
scope: The change by which peoples grow settled and well ordered, not one settled people itself.
examples:
- Trade helped civilization grow along the river.
- The rise of civilization brought towns, laws, and writing.
