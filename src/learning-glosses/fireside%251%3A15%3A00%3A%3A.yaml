simpleMeaning: the area close to a fire in a room, usually with a hard floor and reaching out into the
  room
scope: 'Also called hearth: the area close to a fire in a room, not the fire itself and not the wall or
  box that holds the fire.'
examples:
- They sat by the fireside and warmed their hands.
- We spent the evening on the rug at the fireside, talking quietly.
