simpleMeaning: said of something that joins ideas or events together in the mind
scope: 'Also called associative: said of what joins ideas or events in the mind, not of what keeps them
  apart and not of a plain memory of one thing.'
examples:
- Associatory learning links a new word with a picture in the mind.
- Her associatory way of thinking joined the smell of rain with her childhood home.
