simpleMeaning: Serving as, or marking, what a verb acts on, or set prepositions govern, and for other
  uses too.
scope: Serving as, or marking, what a verb acts on, or set prepositions govern, and for other uses too;
  also called objective; not the case of nouns serving as the direct object of a verb, nor holding or
  showing blame.
examples:
- Their ending was accusative in form.
- The case was accusative by use.
