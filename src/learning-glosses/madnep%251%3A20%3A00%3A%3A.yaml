simpleMeaning: The wild plant from which the cultivated parsnip was bred, a two-year weed of Europe and
  America with big feathery leaves, yellow blooms and a bitter, mildly toxic root.
scope: Another name for wild parsnip, the two-year weed with yellow flowers and a mildly toxic root; not
  the cultivated parsnip grown as a vegetable.
examples:
- Madnep grows on roadsides and field edges, where its yellow flower heads stand out in summer.
- People sometimes mistake madnep for the cultivated parsnip, but its root is bitter and mildly toxic.
