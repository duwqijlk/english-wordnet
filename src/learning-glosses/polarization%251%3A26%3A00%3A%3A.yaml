simpleMeaning: the state of having or giving two opposite ends, so one end is unlike the other
scope: A split into two opposite ends, not the way light waves are lined up in one direction and not a
  simple difference of opinion.
examples:
- The polarization of the two groups made agreement hard.
- Polarization of opinion grew sharper every day.
