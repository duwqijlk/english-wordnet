simpleMeaning: A tool that measures chemicals, chiefly alcohol, in the air a person breathes out.
scope: A tool that measures chemicals, chiefly alcohol, in air breathed out; breathalyser is another name
  for this sense, not a blood test for alcohol and not a lung test.
examples:
- The breathalyzer reading was over the legal limit.
- She blew into the breathalyzer at the roadside check.
