simpleMeaning: strong and firm in what you plan or believe, and not moved or changed
scope: 'Also called firm, steady, stiff, unwavering, steadfast, unbendable, and unfaltering: strong in
  purpose and not changing. Not weak, and not ready to give up.'
examples:
- His unshakable faith kept him calm in hard times.
- She has an unshakable resolve to finish the race.
