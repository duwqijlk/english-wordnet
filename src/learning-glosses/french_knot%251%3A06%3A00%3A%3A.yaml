simpleMeaning: A stitch made by winding the thread round the needle a few times before pushing it into
  the cloth
scope: A small raised stitch made by winding thread round the needle, to be told apart from other small
  stitches such as a plain running stitch.
examples:
- She made a French knot in the centre of the flower.
- A French knot adds a small raised dot to the cloth.
