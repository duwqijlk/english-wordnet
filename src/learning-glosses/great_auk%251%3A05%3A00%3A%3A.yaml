simpleMeaning: On rocky islands off the coasts of the north Atlantic lived a big auk that could not fly,
  now gone for ever.
scope: Unlike auks that still fly, this big auk could not fly, and it is now gone for ever.
examples:
- The great auk lived on rocky islands off the coasts of the north Atlantic.
- The great auk could not fly, and it is now gone for ever.
