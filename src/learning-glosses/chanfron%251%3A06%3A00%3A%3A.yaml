simpleMeaning: a flat metal cover worn in the Middle Ages to keep a horse's head safe
scope: 'Also called chamfron, front-stall and frontstall: a flat metal cover that guards a horse''s head,
  not a cover for the horse''s body and not a rider''s helmet.'
examples:
- The knight fitted the chanfron over his horse's head before the ride.
- The chanfron in the museum was a flat plate of steel shaped to a horse's face.
