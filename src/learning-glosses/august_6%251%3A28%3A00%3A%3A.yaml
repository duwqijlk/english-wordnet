simpleMeaning: In Christianity, a church feast on the sixth day of the eighth month, held to remember
  the Transfiguration of Jesus
scope: A church feast held to remember the Transfiguration of Jesus; Transfiguration and Transfiguration
  Day are other names for this sense, not a feast for another event in the life of Jesus.
examples:
- August 6 is kept as a church feast.
- On August 6 the church remembers the Transfiguration.
