simpleMeaning: A short, sharp sound made of small quick snaps.
scope: The sharp sound of snapping, not the cracked china and not the verb sense of making such a sound.
examples:
- We heard the crackle of the fire as the logs burned.
- The crackle of dry leaves underfoot filled the quiet wood.
