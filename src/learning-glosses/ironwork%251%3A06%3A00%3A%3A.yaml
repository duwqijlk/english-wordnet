simpleMeaning: things made of iron, such as gratings (frames made of bars with spaces between them), rails,
  and railings, and other such things
scope: This is things made of iron, not the iron itself and not a place where iron is made.
examples:
- The old house has beautiful ironwork on its gate.
- Black ironwork covered the windows of the shop.
