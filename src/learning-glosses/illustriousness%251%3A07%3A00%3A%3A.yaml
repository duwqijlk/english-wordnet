simpleMeaning: People hold a person or a thing in the highest regard because it stands out as great and
  important
scope: High regard for a person or thing that stands out as great and important, also called greatness;
  not mere fame from being talked about and not wealth.
examples:
- The general's illustriousness grew with each victory he won.
- Her illustriousness as a scientist brought her honours from around the world.
