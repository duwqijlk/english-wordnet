simpleMeaning: A flat green part of a plant in one piece, with a round or blunt tip
scope: A flat green part of a plant in one piece, with a round or blunt tip; not a shape with three sides
  and not a leaf with a sharp point.
examples:
- The obtuse leaf she found had a round, blunt tip.
- He drew an obtuse leaf with a rounded end.
