simpleMeaning: A style of African-American music from the 1980s and 1990s in which rhymes are chanted
  over a backing track; several forms have appeared.
scope: This is the music genre — 'rap music' and 'hip-hop' are other names for it — not a sharp knock
  or a criminal charge.
examples:
- She grew up listening to rap in the 1990s.
- His new album mixes rap with jazz.
