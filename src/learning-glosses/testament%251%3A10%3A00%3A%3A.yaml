simpleMeaning: a paper written under the law that says who will get a person's things after that person
  dies
scope: 'Also called a will: a legal paper about what happens to a person''s things after death, not a
  sign or proof of something.'
examples:
- She wrote her testament so her house would go to her son.
- The lawyer read the old testament to the family.
