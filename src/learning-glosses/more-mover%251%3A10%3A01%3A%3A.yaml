simpleMeaning: This chess puzzle gives White four turns or longer to win, whatever Black does to stop
  it.
scope: This chess puzzle asks White to win in four turns or longer, and it is not one that can be won
  in three turns or fewer.
examples:
- This week's problem is a more-mover by a composer better known for his endgame study and theory work.
- White found the win in the more-mover on the fourth turn.
