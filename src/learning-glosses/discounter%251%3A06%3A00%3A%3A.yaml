simpleMeaning: a shop that cuts its prices so buyers pay less than the usual amount
scope: A shop that cuts its prices so buyers pay less than the usual amount, also called a discount house
  or a discount store, and not a shop that sells goods at the full price.
examples:
- The discounter on the corner sells food for less than the big shops.
- She shops at a discounter to save money on clothes.
