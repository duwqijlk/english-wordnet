simpleMeaning: A tiny hard-shelled animal lives in sea or fresh water, usually with six pairs of legs
  on the chest; some crowd in floating sea life, others live off fish
scope: A tiny sea or freshwater animal with a hard shell, also called a copepod crustacean; not a crab
  and not a shrimp.
examples:
- The copepod drifted in the water, its six pairs of legs moving.
- Some copepods live off fish, while others float in the plankton.
