simpleMeaning: a tall grass with spikes like a cattail gives grain in Africa and Asia, is mostly grown
  for feed in the United States, and is sometimes used to make beer
scope: A tall grass grown for grain and feed, not a low grass and not one grown only for show; cattail
  millet and pearl millet are other names for this sense.
examples:
- Farmers grow bulrush millet for grain in Africa.
- Bulrush millet is sometimes used to make beer.
