simpleMeaning: A person others find hard to bear, whose presence sours friendships until those who once
  got on well grow cold or even turn against one another.
scope: It names the person at the centre of friendships gone cold, rather than the quarrel itself.
examples:
- The alienator in the office soon turned warm colleagues cool toward one another.
- Nobody liked working with the alienator, who set friend against friend.
