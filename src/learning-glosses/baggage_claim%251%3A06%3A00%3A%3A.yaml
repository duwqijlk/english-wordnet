simpleMeaning: A place in an airport where people who have just landed pick up the bags carried in the
  lower part of the plane
scope: The place in an airport where arriving people pick up their bags, not the desk where bags are handed
  in and not the place where people wait to board.
examples:
- We waited at the baggage claim for our suitcases.
- The baggage claim was crowded after the flight landed.
