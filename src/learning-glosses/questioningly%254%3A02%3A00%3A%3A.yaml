simpleMeaning: in a way that shows you want to know more about something
scope: 'Also called wonderingly: this means in a curious way, wanting to know more, not in a puzzled way
  that shows you do not understand.'
examples:
- She looked questioningly at the teacher, hoping for more of the story.
- He turned questioningly to his friend, wanting to hear the rest.
