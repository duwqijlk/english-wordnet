simpleMeaning: A dark-skinned person of a people who lived in Australia when people from Europe first
  came there
scope: A dark-skinned person of a people who lived in Australia when Europeans first arrived, not a person
  of another people and not a word for all Australians.
examples:
- The book called the man an Abo.
- The young Abo spoke of his home in Australia.
