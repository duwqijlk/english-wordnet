simpleMeaning: a weak-stemmed plant that lives for one winter, from the Mediterranean lands and long grown
  in the southern United States, planted to cover the ground and feed grazing animals
scope: A weak-stemmed plant that lives for one winter; singletary pea and wild winterpea are other names
  for it, not a garden pea grown for food and not a sweet pea.
examples:
- Rough pea covered the field through the winter.
- They sowed rough pea as a cover crop.
