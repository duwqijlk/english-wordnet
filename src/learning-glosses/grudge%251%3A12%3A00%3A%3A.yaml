simpleMeaning: Wanting to pay someone back for a wrong, and holding anger over it until you do.
scope: Wanting to pay someone back for a wrong and holding anger over it, also called score, not the act
  of bearing ill feelings.
examples:
- He held a grudge against his brother for years.
- She nursed a grudge after the unfair vote.
