simpleMeaning: A loud call or raised voice, often showing disagreement or resistance.
scope: 'Another name for shout and call: a loud public utterance, often of protest or opposition, not
  a wordless sound of strong feeling and not the act of weeping.'
examples:
- A cry of protest went up from the crowd outside the hall.
- Her loud cry interrupted the speaker at the back of the room.
