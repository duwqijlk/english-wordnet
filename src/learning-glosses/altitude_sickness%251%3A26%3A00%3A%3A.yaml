simpleMeaning: High up, too little oxygen in the blood and body tissues brings on ills such as a bleeding
  nose or feeling sick.
scope: The ills that come from too little oxygen in the blood, high up, go by this name.
examples:
- High up, altitude sickness set in, with a bleeding nose and a feeling of sickness.
- They felt sick high up, and altitude sickness was the cause.
