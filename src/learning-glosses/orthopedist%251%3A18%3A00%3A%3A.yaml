simpleMeaning: Most of all for children, this doctor puts right faults in the bones
scope: A doctor who puts right faults in the bones, most of all for children, also called an orthopaedist;
  not a doctor who treats teeth and not one who treats the skin.
examples:
- The orthopedist treated the boy's bowed legs.
- She took her daughter to an orthopedist about her hip.
