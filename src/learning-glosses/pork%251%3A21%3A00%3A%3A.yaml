simpleMeaning: government money set aside by lawmakers, meant to win favour with the voters who elect
  them
scope: Government money spent to please local voters, not meat from a pig.
examples:
- The new bridge was pure pork, built to please the voters back home.
- Critics called the road plan pork for the senator's state.
