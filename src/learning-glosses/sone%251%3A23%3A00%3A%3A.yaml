senseId: 'sone%1:23:00::'
synsetId: 13735922-n
simpleMeaning: a unit for how loud a sound seems to a person, equal to the loudness of a 1000-hertz tone
  at 40 dB above the quietest sound that can be heard
scope: A unit for how loud a sound seems to a person, not a unit for the power of a sound itself and not
  a musical tone.
examples:
- The soft hum measured about two sones.
- A busy office may reach four sones of noise.
