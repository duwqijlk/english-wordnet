simpleMeaning: Having no arms to use in keeping oneself safe.
scope: Also called defenseless, this is being without arms to defend oneself, not the broader use for
  being without defence of any kind.
examples:
- The defenceless villagers had no arms to protect themselves.
- Left defenceless, the town could not hold out against attack.
