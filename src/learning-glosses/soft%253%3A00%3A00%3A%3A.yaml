senseId: 'soft%3:00:00::'
synsetId: 02293817-a
simpleMeaning: Of a speech sound, made with the vocal cords vibrating; voiced.
scope: 'This is a phonetics term: a soft consonant is one pronounced with the vocal cords vibrating, as
  b, d, g, and z are. It is not the sense of yielding to pressure and not the sense of a quiet sound.
  Technical, and dated outside old grammar books.'
examples:
- In old grammars the letters b, d, and g are called soft because the voice buzzes in them.
- The soft 's' in 'roses' is voiced, while the 's' in 'rice' is not.
