simpleMeaning: a lively American dance from the 1930s, liked by many people, probably named for the flyer
  Charles Lindbergh
scope: A lively American dance from the 1930s; lindy is another name for this sense, not a slow dance
  and not a dance from another land.
examples:
- They danced the lindy hop until midnight.
- The lindy hop was the dance of the 1930s.
