simpleMeaning: Through the point straight above your head runs a big ring round the sky, meeting the line
  where sky meets earth at right angles.
scope: Of the great rings drawn round the sky, this one passes through the point straight above your head
  and meets the line where sky meets earth at right angles, not one that runs along the middle of the
  sky.
examples:
- The vertical circle passed through the point straight above the town.
- On the star chart, the vertical circle crossed the horizon at a right angle.
