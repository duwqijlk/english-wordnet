simpleMeaning: using only a small amount of alcohol or other drugs, or using none at all
scope: 'Also called sobriety: this sense is about using little or no alcohol or drugs, not the physical
  sense of being dry with no water.'
examples:
- After he stopped drinking, his dryness lasted for ten years.
- The group praised her dryness, as she had not used alcohol or drugs for months.
