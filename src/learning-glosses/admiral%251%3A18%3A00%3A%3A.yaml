simpleMeaning: The highest officer in charge of a fleet, one rank below the top rank and one above the
  next rank down
scope: The top officer of a fleet, ranked above a vice admiral and below a fleet admiral; not a butterfly
  called an admiral.
examples:
- The admiral commanded the whole fleet.
- She was made an admiral after thirty years at sea.
