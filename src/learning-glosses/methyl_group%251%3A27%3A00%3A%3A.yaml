simpleMeaning: A part of a molecule, CH3-, with one free link, that comes from methane.
scope: A part of a molecule, CH3-, with one free link, that comes from methane, also called methyl or
  a methyl radical; not the whole methane molecule and not a part with two free links.
examples:
- A methyl group is the CH3- part that comes from methane.
- The chemist drew a methyl group with one free link.
