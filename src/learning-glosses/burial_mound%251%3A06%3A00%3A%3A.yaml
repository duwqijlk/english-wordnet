simpleMeaning: In archaeology, a heap of earth piled over very old graves
scope: 'Also called barrow or grave mound: a heap of earth over very old graves, not a natural hill and
  not a modern grave.'
examples:
- The burial mound had stood on the hill for thousands of years.
- Archaeologists dug into the burial mound to find the tomb inside.
