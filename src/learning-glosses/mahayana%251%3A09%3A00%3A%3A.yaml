simpleMeaning: One of two great schools of Buddhist teaching that seek freedom for all beings together,
  most of all through trust alone, the main faith of China, Tibet and Japan.
scope: 'Also called Mahayana Buddhism: one of two great schools seeking freedom for all through trust,
  the main faith of China, Tibet and Japan, not the other school of the same name that stresses social
  concern.'
examples:
- Mahayana teaches that all beings can seek freedom together.
- Mahayana is the main faith of Tibet and Japan.
