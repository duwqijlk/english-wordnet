simpleMeaning: The second-to-last great freeze of the Ice Age in northern Europe, and the earth and rock
  laid down at that time
scope: A great freeze of the Ice Age in northern Europe and what it left behind, not the last freeze of
  the Ice Age and not the Riss freeze of the Alps.
examples:
- The Saale glaciation shaped the plains of northern Europe.
- Deposits from the Saale glaciation still cover parts of northern Europe.
