simpleMeaning: Made or used to make the body look better.
scope: This is about making the body look better; not about healing the body, and not a cream or powder
  used on the skin.
examples:
- She had cosmetic surgery to change the shape of her nose.
- Cosmetic treatments can make skin look smoother for a while.
