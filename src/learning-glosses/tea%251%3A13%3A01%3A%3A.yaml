simpleMeaning: A light meal eaten in the middle of the afternoon, with a hot drink and sandwiches or cakes.
scope: This is the meal; it is not the plant that the drink comes from, and not the drink on its own.
examples:
- We had tea at four o'clock with sandwiches and cake.
- She invited us round for afternoon tea.
