simpleMeaning: the ground seeds and pods of the tree, used in place of chocolate
scope: A powder, not the tree and not the pods themselves; carob is another name for this sense.
examples:
- She baked the cake with carob powder instead of cocoa.
- Carob powder gives the drink a sweet, chocolate-like taste.
