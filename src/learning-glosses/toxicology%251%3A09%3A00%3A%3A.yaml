simpleMeaning: 'The part of the study of drugs that deals with poisons: what they are, what they do, and
  how to treat them.'
scope: The study of poisons, their nature, effects, and treatment; not the study of drugs in general.
examples:
- She studied toxicology to learn how poisons act on the body.
- Toxicology helped the doctors find the right cure.
