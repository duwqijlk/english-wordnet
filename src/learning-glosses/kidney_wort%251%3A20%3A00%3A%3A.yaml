simpleMeaning: Flower heads in leafy branching clusters crown a shrub of the southwestern United States
  that spreads wide and stays green all year.
scope: This widely spreading evergreen shrub of the southwestern United States is also called chaparral
  broom, coyote brush, and coyote bush.
examples:
- Kidney wort spread wide and stayed green.
- We saw the flower heads of the kidney wort among its leaves.
