simpleMeaning: a high law officer of the old Roman Republic, picked by vote each year
scope: Also called pretor, this is a high law officer of the old Roman Republic picked by vote each year,
  not a king and not a modern judge.
examples:
- The praetor heard the case and gave his ruling in the forum.
- The people chose a new praetor each year to serve as a law officer in Rome.
