simpleMeaning: words that say someone did wrong, spoken because of a mistake or a bad act
scope: 'Also called blame: words that say someone did wrong; not a sharp hit or knock, and not the kind
  of music with words spoken to a beat.'
examples:
- He got a rap from his teacher for forgetting his homework again.
- The report gave the company a sharp rap for its careless mistake.
