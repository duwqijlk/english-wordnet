simpleMeaning: Milk is carried to the nipple by small tubes in the breast
scope: Small tubes in the breast that carry milk to the nipple, not blood tubes and not the milk-making
  tissue itself.
examples:
- The lactiferous duct carries milk from the glands to the nipple.
- A blockage in a lactiferous duct can stop the flow of milk.
