simpleMeaning: a group of thin threads, most of all the ones that carry signals in the body
scope: 'Also called a fascicle, a fasciculus, and a fibre bundle: a group of thin threads, most of all
  the ones that carry signals in the body, not a single thread and not a cord of muscle.'
examples:
- The fiber bundle carried signals from the eye to the brain.
- Damage to a fiber bundle can slow the signals in the body.
