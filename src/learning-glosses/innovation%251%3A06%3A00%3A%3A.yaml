simpleMeaning: A new thing or a new way of doing something, made after a person has studied and tried
  things out.
scope: A new device or way of doing things that comes from study and trying things out, not a mere new
  look and not a plan that was never built.
examples:
- The innovation cut the cost of making the shoes in half.
- Her latest innovation was a small pump that runs on sunlight.
