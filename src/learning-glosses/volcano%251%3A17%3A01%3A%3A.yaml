simpleMeaning: a long narrow opening in the outer layer of the earth or in the surface of another planet,
  through which hot melted rock and gases come out
scope: Also called a vent. This is the opening itself, not the mountain made by rock that has come out
  of such an opening.
examples:
- Through the volcano, hot melted rock and gases burst out onto the surface.
- The volcano is an opening in the ground, and steam rose from it all morning.
