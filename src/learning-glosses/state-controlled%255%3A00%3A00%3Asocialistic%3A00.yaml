simpleMeaning: holding the belief that things should be owned by all the people together
scope: 'Also called collectivized, collectivised, collectivist and collectivistic: it holds that things
  are owned by all the people together, not by one person or by a small group.'
examples:
- The state-controlled party wanted all land held in common.
- Her state-controlled views shaped the new plan for shared ownership.
