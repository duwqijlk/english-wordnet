simpleMeaning: In the study of heredity, a change in a unit of heredity that comes from a reshaping of
  the unit inside itself.
scope: This is a change in a unit of heredity that comes from a reshaping of the unit inside itself; point
  mutation is another name for this sense, not a change in a whole set of units and not a trait passed
  on as it is.
examples:
- A gene mutation can change the colour of a flower.
- The gene mutation passed to her children.
