simpleMeaning: A comic at one side of a row of performers in a minstrel show, who trades jokes with the
  host in the middle
scope: This is a comic at one side of a row of performers in a minstrel show, trading jokes with the host
  in the middle; corner man is another name for this sense, not the host in the middle and not a performer
  who only sings.
examples:
- The end man traded jokes with the interlocutor.
- As end man, he sat at one side of the row of performers.
