simpleMeaning: work that is done with a needle, such as sewing or embroidery (making patterns on cloth
  with thread)
scope: The work of sewing and like tasks done with a needle, not the finished piece made by that work.
examples:
- She spends her free time on needlework, sewing dresses for her children.
- His needlework is mostly embroidery on cloth, done with a fine needle.
