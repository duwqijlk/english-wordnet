simpleMeaning: As a ripple moves through a stuff, all the places it reaches at the same moment lie on
  one made-up flat face, in physics.
scope: In physics, wavefront is another name for this made-up flat face that joins every place a ripple
  reaches at the same moment.
examples:
- As the ripple spread, the wave front moved with it through the stuff.
- The wave front marked where the ripple had got to at the same moment.
