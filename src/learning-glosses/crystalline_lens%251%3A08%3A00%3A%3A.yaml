simpleMeaning: A clear body in the eye, curved out on both sides behind the coloured part, that with the
  front of the eye bends light onto the back of the eye
scope: This is the clear body inside the eye that helps bend light; lens and lens of the eye are other
  names for this sense.
examples:
- The crystalline lens hardens with age.
- Surgery can replace a cloudy crystalline lens.
