scope: This is a group of religious workers sent to another land to teach their faith and do religious
  work, also called mission, missionary post and missionary station; it is not a group of diplomats sent
  to another land.
examples:
- The foreign mission built a school in the village.
- She joined a foreign mission to teach children abroad.
