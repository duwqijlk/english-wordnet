senseId: 'color_bar%1:09:00::'
synsetId: 05700199-n
simpleMeaning: A rule or custom that keeps Black people out of jobs, clubs and other parts of life shared
  with white people
scope: A rule or custom that keeps Black people out of shared work and social life; color line, colour
  bar and colour line are other names for this sense, not a wall or a ban on one person.
examples:
- The color bar kept Black workers out of the club.
- She wrote about the color bar in the city's hotels.
