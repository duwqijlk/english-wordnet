simpleMeaning: Used to talk about a bishop, or about something a bishop is in charge of
scope: 'Also called episcopal: about a bishop or bishops, not about a pope or the papacy, and not the
  clothes and items a bishop wears.'
examples:
- The pontifical rules apply to bishops and the work they do.
- A pontifical meeting of bishops was held in the city last week.
