simpleMeaning: To behave in an unnatural way, putting on a manner or style that is not really your own.
scope: This is not performing a character on stage, carrying out the duties of a job or simply doing something;
  it is putting on a false manner in ordinary life.
examples:
- He was acting all evening, laughing at jokes he did not find funny.
- He was only acting when he said he cared.
