simpleMeaning: A weighing tool made of a bar with two arms of the same length, with a dish hung from each
  arm
scope: A weighing tool with two arms and a dish on each, not a spring scale and not a single-pan scale.
examples:
- She weighed the gold on a beam balance in the old shop.
- The beam balance showed the two parcels had the same weight.
