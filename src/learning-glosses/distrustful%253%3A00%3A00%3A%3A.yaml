simpleMeaning: having or showing a feeling that someone or something cannot be trusted
scope: Describes a person who has or shows a feeling that someone or something cannot be trusted. Not
  the feeling of not trusting by itself.
examples:
- She gave him a distrustful look and asked for proof.
- He is distrustful of promises from strangers.
