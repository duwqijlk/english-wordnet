simpleMeaning: A tough grass from Asia whose stems are used to make ropes and baskets.
scope: A tough Asian grass whose stems are used for ropes and baskets; munj is another name for it, not
  a soft garden grass and not a reed used only for thatch.
examples:
- The workers twisted munja into strong ropes.
- Baskets of munja lined the market stall.
