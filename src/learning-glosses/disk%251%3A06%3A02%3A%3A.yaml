simpleMeaning: A sound record made as a round plate with one long groove running round it, giving out
  music as it turns under a needle.
scope: 'Also called record, platter, or disc: a sound record on a round plate with a groove, not the flat
  plate in a computer that keeps facts and not any round flat thing.'
examples:
- He put a disk on the player and the music began.
- She owns a disk of old songs from the 1960s.
