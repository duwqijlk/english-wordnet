senseId: 'bitter_orange_tree%1:20:00::'
synsetId: 12729414-n
simpleMeaning: One of many common kinds that bear fruit sour or sharp in taste, used to carry new growth
  joined onto them.
scope: These common kinds bear sour fruit and carry new growth joined onto them, and bigarade, bitter
  orange, marmalade orange and sour orange are other names for this sense.
examples:
- The bitter orange tree bears sour fruit.
- A cutting was joined onto the bitter orange tree to grow there.
