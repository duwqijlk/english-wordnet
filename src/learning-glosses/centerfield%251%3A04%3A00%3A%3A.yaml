simpleMeaning: the spot on a baseball team where the player stands who is meant to stop or catch balls
  hit to the middle part of the far ground
scope: 'Also called center field: the spot where the baseball player stands who stops or catches balls
  hit to the middle part of the far ground, not the spot at the side of the far ground and not the job
  of throwing the ball.'
examples:
- He played centerfield for the school team all season.
- The centerfield caught the long fly ball near the fence.
