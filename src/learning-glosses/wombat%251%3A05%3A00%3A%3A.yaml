simpleMeaning: an Australian animal that digs holes to live in, eats only plants, carries its young in
  a pouch on its body, and is about as big as a badger
scope: An Australian animal that lives in holes it digs and eats plants; it is about the size of a badger
  but is not a badger, and it carries its young in a pouch.
examples:
- A wombat dug a deep hole under the fence.
- We saw a wombat eating grass near its hole, and it was about as big as a badger.
