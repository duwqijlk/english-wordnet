simpleMeaning: When the parents come from different peoples, above all a white parent and an American
  Indian parent, this insulting word is used for their child.
scope: People use this insulting word for a child whose parents come from different peoples, above all
  a white parent and an American Indian parent.
examples:
- They called him a half-breed because his parents came from different peoples.
- His mother was white and his father was American Indian, so some people called him a half-breed.
