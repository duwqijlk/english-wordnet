senseId: 'informed_consent%1:10:00::'
synsetId: 07190514-n
simpleMeaning: Once they know the dangers it may bring, a sick person agrees to take a medical or surgical
  treatment or to join a test.
scope: This is a sick person's agreement to a treatment or a test, given only once they know the dangers
  it may bring.
examples:
- Informed consent was asked for before the operation.
- Informed consent was given once the risks were made clear.
