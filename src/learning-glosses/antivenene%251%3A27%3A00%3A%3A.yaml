simpleMeaning: An antitoxin that stops the harmful effects of venom from the bite of a snake, insect,
  or other animal.
scope: The cure that stops the harm of poison from a bite goes by this name, and also by antivenin.
examples:
- After the snake bite, antivenene was given.
- They keep antivenene on hand in case of a bite.
