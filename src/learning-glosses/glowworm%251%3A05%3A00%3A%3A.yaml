simpleMeaning: the young form of a firefly, which gives off light, or its adult female, which gives off
  light, has no wings, and looks like a thick worm
scope: This is the young firefly, or the female firefly with no wings, that gives off light. It is not
  an adult male firefly with wings, and not a plain worm.
examples:
- A glowworm shone in the wet grass after dark.
- We saw glowworms giving off small green lights under the leaves.
