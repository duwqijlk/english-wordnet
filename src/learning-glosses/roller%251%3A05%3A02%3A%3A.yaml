simpleMeaning: a pigeon that turns backward over and over in the air or on the ground
scope: A pigeon that turns backward over and over in the air or on the ground, not the bird that turns
  over in flight, a small wheel, or a tube for curling hair.
examples:
- The roller turned over and over in the sky.
- His rollers are known for their fine tumbles.
