simpleMeaning: giving in to a wish and letting yourself, or someone else, enjoy what is wanted
scope: This is giving in to a wish and letting yourself, or someone else, enjoy what is wanted; not the
  church sense of release from punishment and not a readiness to give in to others.
examples:
- A little indulgence now and then does no harm.
- His one indulgence was a fine cigar after dinner.
