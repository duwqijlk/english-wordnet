simpleMeaning: when a person falls down and becomes very ill because of too much heat
scope: This is falling down and becoming very ill from too much heat, not a plain faint from another cause
  and not sunburn.
examples:
- He got heatstroke after working outside on the hottest day of the year.
- Drink water and rest in the shade to avoid heatstroke.
