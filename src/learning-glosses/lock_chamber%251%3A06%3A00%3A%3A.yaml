simpleMeaning: Boats are raised or lowered as they pass through this closed-off part of a canal, shut
  to set the water level
scope: 'Also called a lock: a closed-off part of a canal that sets the water level to raise or lower boats,
  not a room in a building and not the whole canal.'
examples:
- The boat waited in the lock chamber while the water rose.
- They closed the lock chamber gates to lower the boat.
