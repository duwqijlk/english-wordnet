simpleMeaning: Painters in Europe and America in the 1980s made bright, showy pictures with crude lines,
  in a style growing out of an earlier way of painting that shows feelings.
scope: This style of painting from the 1980s grew out of an earlier style that shows feelings, and it
  is not that earlier style itself.
examples:
- Painters of neoexpressionism used crude lines and bright colours.
- The gallery showed neoexpressionism from the 1980s.
