simpleMeaning: A plant that lives for years, from Europe and North Africa, whose leaves turn dark as they
  dry.
scope: A plant that lives for years, from Europe and North Africa, whose leaves turn dark as they dry;
  not a short-lived garden plant and not a plant whose leaves stay green when dried.
examples:
- Black pea sprawls along the dry bank.
- The black pea leaves had turned dark in the press.
