schema: oewn-learning-gloss-v2
senseId: 'deaden%2:30:00::'
synsetId: 00193672-v
simpleMeaning: to become without life, or less lively, less strong and less active; to lose life, force
  and energy
scope: This sense is about a thing itself growing weaker and less lively, not about a person making something
  else weaker and not about cutting a ring around a plant.
examples:
- His excitement soon deadened after the long wait.
- As the night went on, the sounds from the street deadened.
