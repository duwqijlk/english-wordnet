simpleMeaning: A tube that carries fuel from a tank to an engine.
scope: A tube that carries fuel from a tank to an engine; fuel line and gas line are other names for this
  sense, not a water pipe and not the tank itself.
examples:
- Dirt clogged the petrol line and the car would not start.
- The mechanic replaced a cracked petrol line.
