simpleMeaning: A common disease caught through sex, caused by a bacterium (a very small living thing),
  with pain when passing water and pain around the tube for passing water
scope: This disease, also called clap and gonorrhoea, is caught through sex; it is not pain from other
  causes when passing water.
examples:
- He went to the clinic after tests showed he had gonorrhea.
- Gonorrhea can cause pain when you pass water, so treatment should start early.
