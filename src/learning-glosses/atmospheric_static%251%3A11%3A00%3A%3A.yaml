simpleMeaning: A crackling or hissing sound made by electrical disturbance in the air
scope: This is a crackling or hissing sound from electrical disturbance in the air; static and atmospherics
  are other names for it, not a sound made by an instrument and not a voice on the radio.
examples:
- Atmospheric static spoiled the radio broadcast with crackles and hisses.
- We could hear atmospheric static whenever lightning flashed nearby.
