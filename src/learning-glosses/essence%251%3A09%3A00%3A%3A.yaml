simpleMeaning: what matters most in an idea or in something a person goes through
scope: What matters most in an idea or experience, also called heart, center, core, centre, meat, sum,
  substance, and marrow; not a sweet-smelling liquid, and not a strong liquid from a plant.
examples:
- The essence of the story is its ending.
- She got the essence of his argument in a few words.
