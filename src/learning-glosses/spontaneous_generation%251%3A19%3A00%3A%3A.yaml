simpleMeaning: a guess that living things can come from matter that was never alive
scope: 'Also called abiogenesis, autogenesis and autogeny: a guess that living things come from matter
  that was never alive, not life born from other living things and not the slow change of living things
  over time.'
examples:
- People once believed in spontaneous generation, the idea that maggots come from rotting meat.
- Spontaneous generation held that living things could appear from matter that was never alive.
