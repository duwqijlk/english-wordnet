simpleMeaning: to give reasons that try to clear a person or act of blame
scope: 'Also called excuse: to give reasons that try to clear a person of blame, not to say that you did
  wrong.'
examples:
- She apologized for the child's wild acts by saying he was still young.
- The writer apologized for the book's faults by saying he had no time to fix them.
