simpleMeaning: To do with the middle, or placed in the middle, or reaching toward the middle.
scope: Also called median, this is said of a thing to do with the middle, or placed in the middle, or
  reaching toward the middle.
examples:
- The cut was medial, running down the middle of the foot.
- The line was medial, placed right in the middle of the page.
