simpleMeaning: Able to go soft or melt when heated, and to go hard and stiff again when cooled
scope: This is a material that goes soft when heated and hard again when cooled; not a plastic that stays
  hard in heat and not one that can melt only once.
examples:
- Thermoplastic parts can be melted and cooled again and again.
- This thermoplastic sheet goes soft in heat and hard when cool.
