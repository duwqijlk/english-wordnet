simpleMeaning: a small bushy tree of Japan and Taiwan, whose flowers have no smell
scope: A small bushy tree of Japan and Taiwan with flowers that have no smell, not the star-shaped fruit
  used in Asian cooking and not the small tree of China and Vietnam that bears that fruit.
examples:
- The star anise in the garden is a small tree from Japan.
- We saw a star anise with small flowers that had no smell.
