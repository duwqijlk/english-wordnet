simpleMeaning: a perennial Eurasian herb with round yellow flowers and a tansy-like scent, eaten cooked
  or raw in salads and used for tea, scent or seasoning; sometimes classed with chrysanthemums
scope: The whole herb, not its leaves used as a bitter seasoning; mint geranium is another name for this
  same plant.
examples:
- She grows costmary beside the kitchen door for its scented leaves.
- In late summer the costmary is covered in small yellow flowers.
