simpleMeaning: Narrow leaves that smell strongly when crushed and hard-to-see pale green flowers grow
  on this herb of the east of the United States, which lives year after year.
scope: This is a herb of the east of the United States with hard-to-see pale green flowers, not the sweet-smelling
  herb of Europe with purple and white flowers.
examples:
- The basil mint smelled strongly when I crushed a leaf.
- Basil mint lives year after year in the east of the United States.
