simpleMeaning: a person who argues by picking at small points and raising petty objections that annoy
scope: A person who argues by picking at small points; caviller, pettifogger and quibbler are other names
  for this sense, not a fair debater and not someone who raises a real objection.
examples:
- The caviler kept the meeting going for an hour over one word.
- No one likes a caviler who objects to every small detail.
