simpleMeaning: Nerve signals fire and set this body chemical free; norepinephrine and vasopressin are
  two such chemicals.
scope: Norepinephrine and vasopressin are two such body chemicals, each set free when nerve signals fire.
examples:
- The neurohormone was set free when the nerve fired.
- When the nerve fired again, more neurohormone was set free.
