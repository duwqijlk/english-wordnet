simpleMeaning: a letter or sign set lower than another letter or sign, just below it and a little to one
  side
scope: A letter or sign that sits low, just below and to one side of another one, not a thing of low rank
  or a planet's path around the sun.
examples:
- The little 2 in H2O is written as an inferior, low and to the side of the H.
- In the formula, the inferior marks the number of atoms in the group.
