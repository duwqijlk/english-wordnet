simpleMeaning: a person in a ship's crew who does hard work with the hands
scope: A worker on a ship who does hard work with the hands, not the captain or an officer who gives the
  orders.
examples:
- The deckhand cleaned the ship and helped tie it up in port.
- A young deckhand was sent to carry the heavy boxes on board.
