simpleMeaning: having phosphorus (a chemical element) in it, or like that element in its qualities
scope: This word, also called phosphoric, is used for a thing that has phosphorus in it or has its qualities,
  not for the element itself when named as a thing.
examples:
- They added a phosphorous mix, full of phosphorus, to the soil.
- The lab tested the phosphorous material and found phosphorus in it.
