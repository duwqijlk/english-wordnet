simpleMeaning: A stretch of DNA involved in building a chain of amino acids; it may include surrounding
  regions and non-coding parts between coding sections, and counts as a unit of heredity.
scope: This is a stretch of DNA carrying instructions for a protein; gene is another name for it, and
  it is not a whole chromosome or the finished protein.
examples:
- The team identified a cistron that governs resistance to the fungus.
- Each cistron in the operon is copied into a single messenger RNA.
