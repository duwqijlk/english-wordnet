simpleMeaning: Its sticky juice once kept the body from shaking, above all in earlier times, and it comes
  from an American mint.
scope: Also called mad-dog skullcap, blue pimpernel, and blue skullcap, this is a mint from America, known
  for the juice that once kept shaking bodies still.
examples:
- A sticky juice ran from the mad-dog weed.
- Mad-dog weed was once given to someone whose body would not stop shaking.
