simpleMeaning: a unit that measures how hard it is to store an electric charge, equal to one divided by
  a farad
scope: A unit that measures how hard it is to store an electric charge, the opposite of a farad; not a
  unit of length and not a unit of weight.
examples:
- The engineer gave the value in darafs.
- One daraf is the reciprocal of one farad.
