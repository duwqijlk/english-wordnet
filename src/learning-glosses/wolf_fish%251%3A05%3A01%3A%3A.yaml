simpleMeaning: a big fierce sea creature of the deep northern seas, eaten as food, with strong teeth and
  no fins on its belly
scope: Also called a wolffish or a catfish, this is a big fierce deep-sea creature eaten as food; not
  a wolf, and not a common freshwater catfish.
examples:
- The wolf fish caught off Iceland had strong teeth and no fins on its belly.
- Fishermen sell wolf fish as food despite its fierce look.
