simpleMeaning: This word names a woman whose forebears came from more than one people, above all from
  Europe and from the first peoples of the Americas.
scope: It names a woman whose forebears came from more than one people, above all from Europe and from
  the first peoples of the Americas, not a woman of one people only.
examples:
- The mestiza had forebears from Europe and from the first peoples of the Americas.
- A mestiza is a woman of more than one people.
