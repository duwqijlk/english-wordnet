simpleMeaning: From Brazil and Peru comes a palm with no trunk that bears hard white nuts.
scope: Also called ivory palm and ivory plant, it is the palm from Brazil and Peru that bears hard white
  nuts and has no trunk.
examples:
- The ivory-nut palm has no trunk, yet it bears hard white nuts.
- In Peru, the ivory-nut palm bears hard white nuts.
