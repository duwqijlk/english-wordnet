simpleMeaning: In English, made by adding -ing, this form of a verb shows an action happening now
scope: A form of a verb showing an action happening now, made by adding -ing; not the past form of a verb
  and not the verb on its own.
examples:
- The present participle in 'She is walking' is 'walking'.
- To make a present participle, add -ing to the verb.
