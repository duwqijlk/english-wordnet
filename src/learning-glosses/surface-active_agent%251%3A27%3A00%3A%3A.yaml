synsetId: 15121350-n
simpleMeaning: A chemical that can lower the pull at the top of a liquid in which it is mixed.
scope: A chemical that lowers the pull at the top of a liquid it is mixed in; also called wetter, surfactant
  and wetting agent; not a chemical that makes a liquid thicker and not a chemical that changes the colour
  of a liquid.
examples:
- A surface-active agent helps water spread over the cloth.
- Detergents work because they contain a surface-active agent.
