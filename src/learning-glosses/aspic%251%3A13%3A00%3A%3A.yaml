simpleMeaning: A jelly-like food that is not sweet, made from the liquid from cooking fish or meat, used
  to hold meat or vegetables in a shape
scope: This is a food jelly made from the liquid from cooking meat or fish that holds meat or vegetables
  in a shape. It is not a sweet jelly eaten for dessert and not that cooking liquid on its own.
examples:
- The cook put cold chicken in aspic and left it to set.
- She served slices of vegetables in aspic at lunch.
