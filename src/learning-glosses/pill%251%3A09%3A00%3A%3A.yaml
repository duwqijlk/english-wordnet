simpleMeaning: A thing that is hard to bear and cannot be avoided, so you must put up with it
scope: A hard thing you must put up with, not a medicine tablet and not the birth-control tablet.
examples:
- His competitor's success was a bitter pill to take.
- Losing the job was a bitter pill for her.
