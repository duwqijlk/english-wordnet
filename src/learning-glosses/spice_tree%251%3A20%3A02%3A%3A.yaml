simpleMeaning: that gives hard tough wood, a tree of the Pacific coast with sweet-smelling leaves and
  small flowers in round clusters, followed by fruit like olives
scope: Also called a mountain laurel, a pepperwood, and a sassafras laurel, this tree of the Pacific coast
  gives hard tough wood.
examples:
- The spice tree gave hard tough wood.
- A spice tree stood on the Pacific coast with fruit like olives.
