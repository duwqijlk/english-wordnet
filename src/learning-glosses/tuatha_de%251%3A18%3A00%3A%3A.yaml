simpleMeaning: A group of Celtic gods and half-gods who ruled Ireland in the age of gold.
scope: 'Also called Tuatha De Danann: a group of Celtic gods who ruled Ireland in the age of gold, different
  from the gods of Greece and from the later kings of Ireland.'
examples:
- The Tuatha De ruled Ireland in the old stories.
- The Tuatha De are the gods of the old Irish tales.
