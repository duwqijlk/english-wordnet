simpleMeaning: from nitrobenzene comes a poisonous oily liquid, one of the amines, chemicals built round
  nitrogen, used to make dyes, plastics, and medicines
scope: 'Also called aminobenzine, aniline oil, and phenylamine: a poisonous oily liquid used to make dyes,
  not a dye itself and not a medicine.'
examples:
- Aniline is used in making dyes for cloth.
- The worker handled aniline with care because it is poisonous.
