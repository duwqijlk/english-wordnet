simpleMeaning: a bush in the east of North America that loses its leaves each year, has a strong smell,
  and has grey-green berries covered in wax
scope: 'Also called candleberry, swamp candleberry and waxberry: this is the bush itself, not a candle
  and not a berry on its own.'
examples:
- A bayberry grew by the path, full of grey-green berries.
- Bayberries lose their leaves in winter, but their waxy berries stay on the bush.
