simpleMeaning: A row of aerials has a line through it, and a signal coming in or going out turns from
  that line by this much.
scope: In radio work, it is the turn of a signal from the line through a row of aerials, as the signal
  comes in or goes out.
examples:
- The wave angle showed how the signal came in against the aerials.
- The wave angle of the signal was measured as it left the row of aerials.
