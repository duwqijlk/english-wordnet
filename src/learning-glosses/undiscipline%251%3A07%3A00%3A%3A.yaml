senseId: 'undiscipline%1:07:00::'
synsetId: 04891645-n
simpleMeaning: the way a person is when they do not follow rules or control their own actions
scope: 'Also called indiscipline: this is about a person who does not follow rules or control their own
  actions, not good control of your own actions, and not a person who has escaped punishment.'
examples:
- His undiscipline at school meant he often did not do his work.
- The team's undiscipline led to late starts and missed practice.
