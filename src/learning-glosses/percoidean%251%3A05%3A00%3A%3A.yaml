simpleMeaning: Any one of the many water animals with sharp fins that belong to the great group Perciformes.
scope: Any one of the many water animals with sharp fins of the group Perciformes, also called a percoid
  and a percoid fish, not a soft-finned fish and not a fish with no fins at all.
examples:
- The bass is a percoidean with sharp fins.
- Many percoideans live in warm seas.
