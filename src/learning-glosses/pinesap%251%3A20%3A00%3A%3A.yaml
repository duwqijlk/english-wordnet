simpleMeaning: A fleshy, tawny or reddish herb of eastern North American woods that feeds on decaying
  matter and looks like Indian pipe; some classifications place it in genus Hypopitys.
scope: This is the tawny or reddish woodland herb that lives on decaying matter; false beachdrops is another
  name for it, not the white Indian pipe it resembles.
examples:
- Pinesap has no green leaves and lives entirely on decaying matter.
- A stand of pinesap sent up pale reddish stems through the humus.
