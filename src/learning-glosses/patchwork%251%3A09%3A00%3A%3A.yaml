simpleMeaning: a set of ideas put together from many different parts that do not fit well
scope: A set of ideas from many different parts that do not fit well together, with jumble as another
  name for this sense, and not a sewn bed cover or a single clear idea.
examples:
- His speech was a patchwork of old slogans and new promises.
- The plan was a patchwork of ideas from five different reports.
