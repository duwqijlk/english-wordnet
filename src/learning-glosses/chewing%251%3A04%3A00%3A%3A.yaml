simpleMeaning: the act of using your teeth to bite and crush food in your mouth until it is soft enough
  to swallow
scope: 'Also called chew: the act of biting and crushing food with your teeth, not gum or tobacco kept
  in the mouth for taste.'
examples:
- Chewing helps your body take in food more easily.
- All that chewing of the tough meat made his jaw hurt.
