simpleMeaning: A linked set of toothed wheels that turn together and pass on power, or change speed or
  turning force.
scope: A linked set of toothed wheels inside a machine, not a railway service, a line of coupled cars,
  or travel by rail; not an ordered series of things or events, a file of pack animals, or a chain of
  consequences; not a gown's trailing cloth; and not any act of teaching, learning, coaching, fitness
  exercise, child or animal discipline, plant shaping, aiming, or dragging.
examples:
- The clock stopped because one gear in its train had jammed.
- The engineer replaced two worn wheels in the gear train.
