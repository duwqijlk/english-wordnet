simpleMeaning: to get joy from something, enjoying it and taking pleasure in it
scope: To take pleasure in something, also called enjoy and savor; not the strong feeling itself and not
  the spicy sauce.
examples:
- She relished her fame and the praise it brought.
- He relished every bite of the meal.
