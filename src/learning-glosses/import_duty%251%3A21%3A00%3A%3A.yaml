simpleMeaning: A tax that must be paid on goods brought in from another country
scope: A tax on goods brought in from abroad, not a tax on goods made at home and not the price of the
  goods.
examples:
- The import duty on foreign cars is high.
- Traders must pay import duty when the goods arrive.
