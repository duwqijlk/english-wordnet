simpleMeaning: about how good or strong a play is as a play, in its story and action
scope: About how good or strong a play is as a play, in its story and action. Not about doing something
  in a way that shows strong feeling.
examples:
- Dramatically, the play was strong, even though the stage was plain.
- The story is dramatically weak, so the actors could not save it.
