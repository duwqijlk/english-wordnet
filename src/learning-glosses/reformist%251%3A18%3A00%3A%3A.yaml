simpleMeaning: a person who argues for changes in laws or in the way things are run, to make them better
scope: Also called reformer and crusader. This is a person who argues for change, not the describing word
  for ideas or actions that support change.
examples:
- The reformist spoke in the town hall and called for new laws.
- As a reformist, she argued for changes in the voting rules.
