senseId: 'deflator%1:21:00::'
synsetId: 13278691-n
simpleMeaning: A figure used in money maths that takes out the effect of rising prices, so sums are shown
  in dollars of fixed worth
scope: A figure that strips price rises out of money sums, not a price rise itself and not a tax.
examples:
- Economists used a deflator to compare wages across the years.
- The deflator showed that pay had barely risen in real terms.
