simpleMeaning: a test time when a person must show good character and skill to see if they are fit for
  a job or for joining a group
scope: A test time for a new worker or a new member of a group, not the law sense where a person found
  guilty is let go without going to prison, as long as they follow rules set by the court.
examples:
- During her probation, she worked hard to prove she could do the job well.
- He was on probation for his first three months at the company.
