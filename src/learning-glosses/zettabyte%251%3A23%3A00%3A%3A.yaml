senseId: 'zettabyte%1:23:00::'
synsetId: 13652973-n
simpleMeaning: A measure of computer information, equal to 1,024 exbibytes, or 2 to the power of 70 bytes.
scope: A measure of computer information, 1,024 exbibytes, not the 1,000-exabyte measure of the same name.
examples:
- The data centre held several zettabytes of stored files.
- One zettabyte equals 1,024 exbibytes of information.
