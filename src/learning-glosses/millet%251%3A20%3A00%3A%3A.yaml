simpleMeaning: any of several small-seeded grasses that live one year, grown for grain and for animal
  feed, from the plant groups Panicum, Echinochloa, Setaria, Sorghum, and Eleusine
scope: Any of several small-seeded grasses grown for grain or feed, not the small seed itself and not
  wheat or rice.
examples:
- Farmers grow millet for grain and for feed.
- Millet grows fast in dry fields and is cut for animal feed.
