simpleMeaning: The gap, measured round the middle line of the sky, between the line straight above you
  and the ring that runs through a star, top to bottom.
scope: It is counted from the line straight above you, not westward from the top of the sky as the other
  hour angle is.
examples:
- The hour angle of the star was nearly 30 degrees.
- We worked out the hour angle to find where the star would be.
