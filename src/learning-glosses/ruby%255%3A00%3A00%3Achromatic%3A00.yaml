senseId: ruby%5:00:00:chromatic:00
synsetId: 00382159-s
simpleMeaning: of a color at one end of the range of colors, next to orange, like the color of blood or
  cherries or tomatoes
scope: Red, scarlet and crimson are other names for this sense, and cherry, reddish and ruddy are other
  names for it too. This describes a deep red color, not a cut jewel and not the clear deep red stone
  material itself.
examples:
- The sky turned a ruby color as the sun went down.
- She painted her nails a bright ruby red.
