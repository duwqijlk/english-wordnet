senseId: 'immune_gamma_globulin%1:27:00::'
synsetId: 15055048-n
simpleMeaning: a group of proteins made in the lymph tissue, the soft tissue that makes germ-fighting
  cells, in animals with backbones, which act as defenders against sickness
scope: A group of body proteins that act as defenders against sickness; immune globulin, immune serum
  globulin and immunoglobulin are other names for this sense, not a single protein and not a drug that
  kills germs directly.
examples:
- The immune gamma globulin in his blood fought the sickness.
- Doctors gave her immune gamma globulin after the bite.
