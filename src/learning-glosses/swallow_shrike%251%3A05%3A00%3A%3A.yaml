simpleMeaning: A bird from Australia, New Zealand and Asia, close kin to a family of hunting birds, with
  the shape of a fast-flying bird.
scope: A bird from Australia, New Zealand and Asia, kin to the shrikes; also called wood swallow; not
  a shrike itself and not a bird of Europe.
examples:
- A swallow shrike flew over the trees in the Australian bush.
- Swallow shrikes are kin to the shrikes but look like swallows.
