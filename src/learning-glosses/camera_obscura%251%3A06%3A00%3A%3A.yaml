simpleMeaning: Light from things outside comes through a small hole or lens into a dark room or box and
  throws their pictures onto the surface facing it.
scope: This dark room or box takes in light from outside through a small hole or lens and shows the outside
  world as pictures.
examples:
- We looked at the pictures in the camera obscura.
- We watched the trees outside appear as pictures in the camera obscura.
