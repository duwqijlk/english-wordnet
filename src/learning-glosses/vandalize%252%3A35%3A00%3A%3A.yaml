simpleMeaning: to break or damage something for no good reason, in a wild and careless way
scope: Also called vandalise. This is breaking or damaging things for no good reason, not stealing them
  and not breaking them by accident.
examples:
- Someone vandalized the park benches during the night.
- Teenagers vandalized the empty building, breaking its windows for no reason.
