simpleMeaning: Among reeds and wedges in Europe, this small warbler makes its nest, and it spends the
  winter in Africa.
scope: This is also called reedbird, sedge warbler and sedge wren, and all three names mark the same small
  European warbler.
examples:
- The sedge bird sang from the reeds before flying south.
- The sedge bird built its nest among the wedges.
