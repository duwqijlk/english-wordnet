simpleMeaning: to make people feel something strongly, such as love, hate, or pity
scope: To stir up strong feeling in people, not to set a thing on fire; also called wake, heat, and inflame.
examples:
- The news of the verdict ignited anger across the town.
- Her speech ignited hope in the crowd.
