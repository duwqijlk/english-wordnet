simpleMeaning: a person given great honour for great work, as if wearing a crown of leaves on the head
  as a sign of that honour
scope: A person honoured for great work, as if crowned with leaves, not a king crowned for ruling and
  not just any winner of a game.
examples:
- The scientist became a laureate after years of work that helped many people.
- As a laureate, she was honoured in front of a large crowd for her great work.
