simpleMeaning: Crushing the whole wheat grain, bran and all, gives this meal, called whole meal in Britain.
scope: Also called graham, whole meal flour, and whole wheat flour, this is a coarse meal from the whole
  wheat grain, not white flour made from the grain's heart alone.
examples:
- She baked bread with graham flour and honey.
- Graham flour gives the loaf a nutty taste.
