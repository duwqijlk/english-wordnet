simpleMeaning: A sheet that reacts to light, coated with a pure silver salt, that makes neutral black
  or cold blue-black tones in pictures.
scope: This is a sheet that reacts to light for making pictures in neutral black or cold blue-black tones,
  not a sheet that stays unchanged in light.
examples:
- The bromide paper makes black tones in the picture.
- This bromide paper gives cold blue-black tones.
