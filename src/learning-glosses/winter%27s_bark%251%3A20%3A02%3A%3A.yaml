simpleMeaning: the sweet-smelling outer layer of a tree, used as a medicine that makes the body stronger
  and more awake
scope: The sweet-smelling tree covering used as a medicine, not the South American tree that gives it
  and not the wood of that tree.
examples:
- The shop sold winter's bark as a tonic for tired bodies.
- He added a pinch of winter's bark to the medicine.
