simpleMeaning: to control a person cruelly, as a ruler who takes all power and lets no one else decide
scope: 'Also called tyrannize and tyrannise: to control a person cruelly with full power, not to rule
  in a fair or kind way.'
examples:
- He domineered over his workers and never let them speak.
- She would not let her husband domineer over her.
