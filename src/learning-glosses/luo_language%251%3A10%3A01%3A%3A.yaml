simpleMeaning: A Nilotic tongue spoken in the Adamawa Region, in the Mayo-Banyo division, Bankim subdivision,
  a part of Atta.
scope: 'Also called Luo: a Nilotic tongue of the Adamawa Region, not a tongue of another family and not
  a tongue spoken across the whole region.'
examples:
- Luo language is spoken in the Mayo-Banyo division.
- Some people in Bankim speak Luo language.
