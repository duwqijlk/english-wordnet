scope: It is also called dhal, cajan pea, catjang pea, dahl, pigeon-pea plant and red gram, a woody herb
  of warm lands with flat pods and striking yellow blooms, not the small seed it bears.
examples:
- She planted pigeon pea in the warm lands for its flat pods.
- Farmers grow pigeon pea a great deal in the tropics.
