simpleMeaning: A very thorny woody vine of the eastern United States that grows in tangled mats, with
  tough round stems, glossy leathery leaves, small greenish flowers and inedible shiny black berries.
scope: Another name for horse-brier and horse brier; this is the thorny vine of eastern woods, not the
  wild rose or bramble also called brier.
examples:
- Greenbrier formed an almost impassable wall along the creek bank.
- The black berries of greenbrier are not safe to eat.
