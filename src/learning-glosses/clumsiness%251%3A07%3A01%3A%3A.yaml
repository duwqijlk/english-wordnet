simpleMeaning: the way a person holds and moves the body in a way that is not smooth or graceful
scope: 'Also called awkwardness: the way a person''s body moves and is held, when it is not smooth or
  graceful, not the stiff, tense look of a shy person.'
examples:
- His clumsiness showed in the way he walked, with his shoulders hunched and steps uneven.
- Her natural clumsiness made her movements look rough, even when she tried to dance gracefully.
