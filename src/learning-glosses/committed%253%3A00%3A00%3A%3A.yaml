simpleMeaning: Tied by a firm promise to back a cause, a plan of action, or a way of thinking
scope: This is a person held to a promise, not someone merely keen on an idea and not someone forced by
  law.
examples:
- She is a committed member of the group and gives it much of her time.
- He stayed committed to the plan even when the work got hard.
