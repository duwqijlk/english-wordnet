simpleMeaning: This yellow powder, a lead compound found in rock, gives colour to paint
scope: 'Also called massicotite: a yellow powder from a lead mineral used to colour paint, not a yellow
  dye from plants and not the lead metal itself.'
examples:
- The artist mixed massicot into the paint to get a warm yellow.
- Massicot was once a common yellow pigment in old paintings.
