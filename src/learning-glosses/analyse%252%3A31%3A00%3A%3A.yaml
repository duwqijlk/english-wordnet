senseId: 'analyse%2:31:00::'
synsetId: 00646245-v
simpleMeaning: to look at or think about something closely and in detail, to find what is most important
  about it or what it means
scope: 'Also called study, examine, analyze, and canvass: to look at something closely to understand it,
  not the sense that means breaking something down for maths, chemistry, or grammar work.'
examples:
- She analysed the poem line by line to find its main ideas.
- Doctors analysed the test results to understand what was wrong.
