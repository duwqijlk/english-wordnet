simpleMeaning: A wooden frame bent to a U, its top ends fixed to the cross yoke, its loop round the neck
  of an ox.
scope: A wooden frame bent to a U, its top ends fixed to the cross yoke, its loop round the neck of an
  ox; not a U-shaped bend in a stream, nor the land inside an oxbow bend in a river.
examples:
- Their oxbow creaked at dawn.
- The oxbow was fitted at noon.
