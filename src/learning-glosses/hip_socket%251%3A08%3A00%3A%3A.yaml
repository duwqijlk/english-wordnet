simpleMeaning: The hollow in the pelvis where the round top of the thigh bone sits and turns.
scope: The hollow in the pelvis where the thigh bone turns, not the round top of the thigh bone itself
  and not the knee joint.
examples:
- The ball of the thigh bone sits in the hip socket.
- A fall can crack the hip socket.
