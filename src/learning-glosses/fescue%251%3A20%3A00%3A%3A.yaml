simpleMeaning: Wide flat leaves mark this grass, grown in Europe and America for fields where animals
  feed for good, for hay, and for lawns
scope: This grass is also called fescue grass and meadow fescue, and it stands apart from other grasses
  by its wide flat leaves.
examples:
- Fescue grew across the lawn in wide flat leaves.
- The farmer sowed fescue for hay and for the pasture.
