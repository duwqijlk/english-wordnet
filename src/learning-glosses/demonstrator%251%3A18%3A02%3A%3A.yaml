schema: oewn-learning-gloss-v2
senseId: 'demonstrator%1:18:02::'
synsetId: 10022782-n
simpleMeaning: a teacher, or a person who helps a teacher, who shows by doing the basic rules and ideas
  that students are learning
scope: A teacher or a teacher's helper who shows ideas in a lesson, not a person who shows a thing for
  sale to someone who may buy it.
examples:
- The demonstrator showed our class, step by step, how the science work is done.
- Our demonstrator showed us how to use the tools safely in class.
