simpleMeaning: Turning round and round, a big machine with seats for children to ride on for fun.
scope: Also called a carousel or a roundabout; a big turning ride with seats for children, not the spinning
  top that turns on a steel point, and not the verb use for spinning round and round fast.
examples:
- The children rode the whirligig again and again.
- A whirligig turned slowly in the middle of the fair.
