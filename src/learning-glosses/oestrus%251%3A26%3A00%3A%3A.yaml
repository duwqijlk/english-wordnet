simpleMeaning: In mammals other than people, a time of strong mating drive and mating acts
scope: In mammals other than people, a time of strong mating drive and mating acts; heat, rut and estrus
  are other names for this sense, not the mating drive of people and not the act of mating itself.
examples:
- The doe came into oestrus in the spring.
- During oestrus the female seeks a mate.
