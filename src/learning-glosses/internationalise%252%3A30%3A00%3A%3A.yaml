senseId: 'internationalise%2:30:00::'
synsetId: 00410044-v
simpleMeaning: To give a thing the ways of many lands and peoples.
scope: Giving a thing the ways of many nations, also called internationalize; not putting it under the
  joint control of nations.
examples:
- We internationalised the committee by adding members from ten lands.
- The school internationalised its courses to welcome pupils from abroad.
