simpleMeaning: In telecommunication, a coding system that adds extra bits so that mistakes in a message
  can be found.
scope: In telecommunication, a coding system that adds extra bits to find mistakes, also called the error
  correction code; not a code that hides a message and not a code for storing files.
examples:
- ECC adds extra bits to the data it sends.
- The system used ECC to catch errors in the message.
