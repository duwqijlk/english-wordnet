simpleMeaning: A build-up of monthly blood in the birth canal, most often because the thin skin across
  its opening has no hole.
scope: A build-up of monthly blood in the birth canal, most often because the thin skin across its opening
  has no hole; hematocolpos is another name for it, not a harmless swelling made of blood tubes and not
  a measure of red blood cells in the blood.
examples:
- Haematocolpos caused a build-up of monthly blood in the birth canal.
- The doctor found haematocolpos in the young girl.
