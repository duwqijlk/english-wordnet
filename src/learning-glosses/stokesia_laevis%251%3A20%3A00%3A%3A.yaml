simpleMeaning: A plant of the south-east United States that stands upright and comes back year after year,
  with big heads of flowers that are usually blue.
scope: Also called cornflower aster or stokes' aster; an upright plant of the south-east United States
  with big heads of flowers that are usually blue, not other asters with small heads.
examples:
- Stokesia laevis bears big blue flower heads.
- We planted Stokesia laevis by the garden wall.
