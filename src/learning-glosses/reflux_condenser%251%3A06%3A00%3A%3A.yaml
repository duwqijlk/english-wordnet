simpleMeaning: So the pot does not boil dry, steam over the boiling liquid turns back to liquid in this
  device and runs back into the pot
scope: A device in which steam over a boiling liquid turns back to liquid and runs back into the pot,
  so the pot does not boil dry.
examples:
- The chemist fitted a reflux condenser so the flask would not boil dry.
- With the reflux condenser in place, the steam turned back to liquid and ran into the pot.
