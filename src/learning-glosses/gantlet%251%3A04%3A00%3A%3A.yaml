simpleMeaning: A cruel old punishment in which a person had to run between two lines of men who stood
  facing each other and beat the one running with sticks or whips
scope: This is a cruel old punishment in which a person had to run between two lines of men who beat the
  one running; gauntlet is another name for this sense, not the meeting of two rail tracks in a narrow
  place.
examples:
- The men made him run the gantlet between their lines.
- In old times, the gantlet was a cruel punishment.
