simpleMeaning: A plant that lives several years, bearing sharply toothed triangular leaves on leafy stems
  and a cluster of yellow flower heads, in damp places in mountains of western North America.
scope: This is one particular mountain plant, not the whole groundsel group, whose members differ in leaf
  shape and habitat. The name points to its leaf shape rather than its flowers. It is a botanical name
  used in plant guides for western North America.
examples:
- Arrowleaf groundsel grew thickly along the stream bank.
- In late summer the arrowleaf groundsel carried a crown of yellow flower heads.
