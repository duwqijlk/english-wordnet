simpleMeaning: The part of that country's government in the United States that keeps that country safe,
  set up in nineteen forty-seven.
scope: 'Also called the Department of Defense: the part of the government that keeps the country safe,
  not the part that deals with other countries.'
examples:
- The United States Department of Defense keeps the country safe in times of war.
- The United States Department of Defense was set up in nineteen forty-seven.
