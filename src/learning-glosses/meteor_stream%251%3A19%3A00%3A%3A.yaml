simpleMeaning: as a cloud of space rock passes into the air around the earth, it makes a short burst of
  streaks of light
scope: Also called a meteor shower, it is the short burst of light streaks that a swarm of space rock
  makes on meeting the air round the earth.
examples:
- We watched the meteor stream cross the sky.
- The meteor stream gave us a short shower of streaks.
