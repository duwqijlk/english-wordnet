senseId: 'instrumentalism%1:09:00::'
synsetId: 05983918-n
simpleMeaning: In philosophy, the view that ideas are tools to guide what we do, and that an idea is good
  when it works well in practice
scope: In philosophy, the view that ideas are tools judged by how well they work; not the view that ideas
  are real things in themselves and not the view that all knowledge comes from the senses.
examples:
- Instrumentalism judges an idea by whether it works in practice.
- He defended instrumentalism against the charge that it ignores truth.
