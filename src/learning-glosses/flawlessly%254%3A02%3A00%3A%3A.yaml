simpleMeaning: in a smooth way, with no difficulty, and in a careful, exact way with great skill
scope: 'Also called cleanly: doing something smoothly and with great skill, not in a way that is free
  from dirt.'
examples:
- The gymnast landed flawlessly after her last turn.
- She played the whole song flawlessly, with no wrong notes and no stops.
