synsetId: 05032859-n
simpleMeaning: In physics, how much stuff a body has, found from how fast it speeds up when pushed by
  a force other than gravity.
scope: In physics, the amount of matter in a body, found from how it speeds up under a push; not the pull
  of gravity on the body, which is its weight.
examples:
- The inertial mass of the block was found by pushing it.
- Physicists measure inertial mass by watching how a body speeds up.
