simpleMeaning: 'A device with flammable material and two charges: one opens the tank at a set height,
  spreading a cloud that mixes with oxygen; the other ignites it, burning everything below.'
scope: A two-charge weapon that turns fuel into a cloud and then ignites it, producing a wide blast; it
  is not a simple firebomb and not an ordinary warhead packed with metal fragments.
examples:
- The army used a fuel-air explosive to clear the cave complex.
- Fuel-air explosives spread a cloud of fuel before igniting it, creating a powerful pressure wave.
