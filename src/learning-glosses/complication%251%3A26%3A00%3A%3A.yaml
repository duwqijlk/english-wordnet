simpleMeaning: a state of things that is hard to follow because so much is mixed up in it
scope: A hard and mixed-up state of things, not the act of making it hard and not a new event that makes
  it harder.
examples:
- Her coming was a serious complication for the whole family.
- The complication left everyone unsure what to do next.
