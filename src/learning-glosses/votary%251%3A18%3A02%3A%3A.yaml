senseId: 'votary%1:18:02::'
synsetId: 10779488-n
simpleMeaning: A true follower of a cause, a person, or a pursuit, almost as a matter of faith.
scope: A true follower of a cause, a person, or a pursuit, almost as a matter of faith; not a priest or
  priestess, or one set apart to worship, in a faith outside Christianity, nor one tied by vows to a faith,
  or a life of prayer and service.
examples:
- Their votary of science spoke at noon.
- The votary followed the cause for years.
