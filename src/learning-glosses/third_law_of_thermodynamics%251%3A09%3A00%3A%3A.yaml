simpleMeaning: As a thing cools toward the coldest point that can be, its disorder falls to nothing —
  that is the rule.
scope: A rule about heat and the coldest point that can be.
examples:
- The third law of thermodynamics says disorder falls to nothing at the coldest point.
- By the third law of thermodynamics, a thing kept at the coldest point has no disorder left.
