simpleMeaning: The lack of grace in a person who is stiff and not relaxed, as when they feel embarrassed.
scope: The lack of grace in a stiff, tense person, as when they feel embarrassed, also called stiffness,
  and not clumsy movement or trouble from size.
examples:
- His awkwardness showed in his stiff, tense way of standing at the party.
- Her awkwardness grew when embarrassment made her stiff and tense.
