simpleMeaning: A member of the branch of Islam that takes the first four caliphs as the rightful ones
  to follow Muhammad.
scope: 'Also called Sunni and Sunnite: a member of the branch of Islam that follows the first four caliphs,
  not a member of the Shia branch.'
examples:
- He is a Sunni Muslim who follows the first four caliphs.
- Many Sunni Muslims live in Egypt.
