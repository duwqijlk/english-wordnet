simpleMeaning: a chemical that has small amounts of other chemicals in it, so it is not quite pure
scope: 'Also called technical grade: a chemical that is slightly impure, not a pure chemical and not one
  with much of other chemicals in it.'
examples:
- The lab bought technical-grade sulfuric acid for the test.
- Technical-grade chemicals cost less than pure ones.
