synsetId: 00954071-v
simpleMeaning: To say with a puff of breath, of stop sounds.
scope: To say with a puff of breath, of stop sounds; not a speech sound that comes with a clear puff of
  breath, as a stop at the start of a word, or a first /h/ sound, nor a consonant said with a puff of
  breath.
examples:
- They would aspirate the first sound.
- The speaker came to aspirate the stops.
