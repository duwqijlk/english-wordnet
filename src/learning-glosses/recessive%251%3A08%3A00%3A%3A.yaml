senseId: 'recessive%1:08:00::'
synsetId: 05445891-n
simpleMeaning: A form of a gene that shows its own trait only when the gene paired with it is the same.
scope: Also called a recessive allele, this is the gene form itself, not the adjective for a gene that
  works this way, nor a word to do with a recession.
examples:
- The recessive showed only when both parents passed on the same form of the gene.
- A recessive needs a matching pair before its trait can be seen.
