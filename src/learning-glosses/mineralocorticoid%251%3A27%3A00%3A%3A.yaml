simpleMeaning: How the body uses sodium and potassium is guided by one of a group of like chemicals made
  in the outer layer of the glands above the kidneys.
scope: In the body, this chemical from the glands above the kidneys guides how sodium and potassium are
  used.
examples:
- The mineralocorticoid helps the body use sodium.
- The mineralocorticoid helps the body use potassium.
