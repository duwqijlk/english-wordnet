simpleMeaning: A person who carries a message or a thing to someone.
scope: A person who carries a message or a thing to someone, not a person holding a cheque or bond, not
  a coffin carrier, and not a person whose job is carrying things.
examples:
- A bearer of good tidings arrived at dawn.
- The bearer of a letter from the king arrived at noon.
