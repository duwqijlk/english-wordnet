senseId: 'aberration%1:19:00::'
synsetId: 11440253-n
simpleMeaning: a fault in the picture seen through a lens or made by a mirror, when the lens or mirror
  does not make a good picture
scope: 'Also called distortion and optical aberration: a fault in the picture from a lens or mirror, not
  a fault in behaviour and not a change from what is usual.'
examples:
- The lens aberration made the stars look blurred at the edges.
- He cleaned the mirror to reduce the aberration in the image.
