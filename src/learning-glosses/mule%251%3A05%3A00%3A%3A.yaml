simpleMeaning: an animal whose father is a donkey and whose mother is a horse, and which usually cannot
  have young of its own
scope: This is an animal with a donkey father and a horse mother, not a soft shoe with no part around
  the back of the foot.
examples:
- The farmer used a mule to carry bags up the hill.
- A mule can be strong, but it usually cannot have young.
