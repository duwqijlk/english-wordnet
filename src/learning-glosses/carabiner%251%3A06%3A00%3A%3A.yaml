simpleMeaning: A long metal ring with a spring clip that opens and shuts, used by climbers to fasten a
  rope to a metal peg or to join two ropes.
scope: Also called a karabiner or a snap ring; a metal ring with a spring clip used by climbers.
examples:
- She clipped the rope to her harness with a carabiner.
- The carabiner snapped shut once the rope was through it.
