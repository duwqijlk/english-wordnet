simpleMeaning: To play the fielding position behind the batter in baseball.
scope: Playing the baseball position behind the plate; it is not taking a thrown ball in the hands, not
  the game of tossing a ball back and forth, not the thing taken, not a faithful copy, not something snagging,
  or a pursuit gaining ground.
examples:
- Who is catching for our team tonight?
- He caught for the Yankees for six seasons.
