simpleMeaning: If the skin is touched, a limb moves, or something stirs in the parts inside, a person
  knows it without looking or listening.
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatesthesia, somatic sensory system,
  somatosensory system, somesthesia, or somesthesis, it is the sense of the body from within, not sight
  or hearing.
examples:
- The somatic sense tells a person the arms are raised.
- Through the somatic sense, a person knows an ankle is hurt.
