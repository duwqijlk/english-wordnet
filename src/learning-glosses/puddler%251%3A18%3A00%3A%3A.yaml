simpleMeaning: By stirring melted iron, this worker turns rough iron from the furnace into iron worked
  by hand
scope: A worker in an ironworks, not a worker who pours or shapes metal in other ways.
examples:
- The puddler stirred the melted iron for hours.
- In the old ironworks, a puddler turned pig iron into wrought iron.
