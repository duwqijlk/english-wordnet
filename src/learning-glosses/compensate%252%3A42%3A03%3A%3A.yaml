senseId: 'compensate%2:42:03::'
synsetId: 02678648-v
simpleMeaning: To push your strong points too far, so as to make up for a weak point or a feeling of not
  being good enough.
scope: 'Also called cover: to make up for a weak point or a feeling of not being good enough by pushing
  your strong points too far, not to pay for a loss and not to make amends.'
examples:
- She compensated for her shyness by talking a great deal.
- He compensated for his small size by playing with great spirit.
