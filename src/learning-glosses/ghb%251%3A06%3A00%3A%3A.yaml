simpleMeaning: A drug used at clubs, taken by mouth as a liquid or powder, often mixed with drink, to
  make a person unable to fight back during a sex attack
scope: A club drug taken by mouth to leave a person helpless during a sex attack, not a medicine taken
  for sleep or pain; also called gamma hydroxybutyrate.
examples:
- GHB is sometimes mixed into a drink without the person knowing.
- Police warned that GHB can leave a person unable to fight back.
