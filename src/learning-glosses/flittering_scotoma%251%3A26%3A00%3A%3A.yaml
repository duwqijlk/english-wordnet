senseId: 'flittering_scotoma%1:26:00::'
synsetId: 14580471-n
simpleMeaning: a patch of weak sight ringed by bright, flickering coloured lights, which for many people
  means a migraine is about to start
scope: A patch of weak sight ringed by flickering coloured lights, often a sign that a migraine is coming;
  scintillating scotoma is another name for this sense. Not a blind spot that stays, and not the migraine
  pain itself.
examples:
- A flittering scotoma crossed her sight, its coloured lights shimmering at the edge.
- His flittering scotoma told him a migraine would soon begin.
