simpleMeaning: Tall North American perennial with creeping underground stems, narrow leaves and spikes
  of pinkish-purple flowers, growing in masses on burned ground and new clearings; a major honey source.
scope: This is the tall pinkish-purple plant of burned ground and clearings, known in North America as
  fireweed, not the other weed of that name with small white or greenish flowers.
examples:
- Rosebay willowherb lined the railway embankment, a mass of purple-pink from midsummer on.
- We cleared rosebay willowherb from the allotment, but it came back the next year.
