simpleMeaning: A clear device that bends light passing through it together or apart, to make pictures
scope: A clear device that bends light to make pictures; lens and lense are other names for this sense,
  not a mirror that throws light back.
examples:
- The lens system in the camera bends light onto the film.
- A microscope's lens system makes tiny things look big.
