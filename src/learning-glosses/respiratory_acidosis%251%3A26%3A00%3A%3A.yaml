senseId: 'respiratory_acidosis%1:26:00::'
synsetId: 14043742-n
simpleMeaning: Acid build-up in the blood from poor exchange of gases in the lungs, as with emphysema
  or pneumonia; excess carbon dioxide and water form carbonic acid, raising blood acidity.
scope: This is another name for carbon dioxide acidosis, the lung-related form caused by poor breathing;
  it is not metabolic acidosis, which starts elsewhere in the body.
examples:
- Respiratory acidosis may follow a severe attack of pneumonia.
- Doctors confirmed respiratory acidosis after testing the acidity of her blood.
