senseId: 'pigment%2:30:00::'
synsetId: 00288018-v
simpleMeaning: to give something color by putting a coloring substance on or into it
scope: This is the act of putting color on or in something with a coloring substance; it is not the coloring
  substance itself, and not the act of slowly gaining color on its own.
examples:
- The artist pigmented the photograph by hand.
- They pigment the cloth with a deep red dye.
