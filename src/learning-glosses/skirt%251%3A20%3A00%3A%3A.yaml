simpleMeaning: In fungi, a ring around the stem of a grown mushroom, left from a thin covering that was
  there when it was young
scope: In fungi, a ring on a mushroom stem, not a piece of clothing worn from the waist and not the cloth
  below the waist of a garment.
examples:
- This mushroom has a thin skirt forming a ring around its stem.
- Look for a white skirt just below the cap of the mushroom.
