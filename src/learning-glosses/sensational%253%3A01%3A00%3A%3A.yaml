simpleMeaning: to do with feeling things in the body, such as heat, pain, light, and sound
scope: This is about feeling things in the body, not about causing great interest, surprise, or strong
  feelings in many people.
examples:
- The sensational nerves carry feelings of pain and heat to the brain.
- Sensational organs, like the eyes and ears, help us take in the world around us.
