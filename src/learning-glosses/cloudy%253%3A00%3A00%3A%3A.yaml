simpleMeaning: Having many clouds in the sky, or covered over by them
scope: With the sky full of clouds or covered over by them, not a liquid made unclear by bits that have
  settled in it and not a shape with no clear form.
examples:
- It was a cloudy day, with no sun at all.
- Cloudy skies kept us indoors all afternoon.
