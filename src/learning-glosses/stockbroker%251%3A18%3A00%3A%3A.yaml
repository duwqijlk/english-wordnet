simpleMeaning: a person whose job is to buy and sell, for other people, parts of companies (stocks) and
  loans to companies or governments (bonds)
scope: This is a person who buys and sells stocks and bonds for other people, not a person who owns a
  shop or works in a bank in general.
examples:
- Our stockbroker bought the shares for us.
- She asked her stockbroker to sell the bonds for her.
