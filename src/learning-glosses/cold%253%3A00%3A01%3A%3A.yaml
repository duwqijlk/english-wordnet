simpleMeaning: It means having a low temperature, feeling not warm enough, or being made cool by ice or
  a fridge.
scope: Not unfriendly or showing no emotion, and not the noun for an illness.
examples:
- The soup is cold; please heat it up.
- My hands are cold after walking in the snow.
