simpleMeaning: to write the set of instructions that tell a computer what to do
scope: Another name for this sense is program. It is writing instructions for a computer, not a list of
  events, not the instructions themselves, and not putting a plan together.
examples:
- She learned to programme computers at school.
- He programmes the machines that control the factory lights.
