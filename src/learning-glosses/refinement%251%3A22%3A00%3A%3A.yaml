senseId: 'refinement%1:22:00::'
synsetId: 13569308-n
simpleMeaning: the process of taking out dirt and other unwanted things from something such as oil, metal,
  or sugar
scope: This sense, also called purification and refining, is about cleaning a thing such as oil or sugar.
  It is not the sense that means a very high state of being perfect and without faults.
examples:
- The refinement of the oil takes out dirt before it is sold.
- Refinement makes the sugar clean before it is put in bags.
