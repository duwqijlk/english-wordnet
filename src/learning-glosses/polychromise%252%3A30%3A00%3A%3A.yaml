senseId: 'polychromise%2:30:00::'
synsetId: 00285573-v
simpleMeaning: To put many different colours on a thing, so that it shows a mix of shades
scope: This is the act of putting many colours on a thing; polychrome and polychromize are other names
  for this sense, not painting a thing one plain colour.
examples:
- The painter decided to polychromise the wooden screen.
- He polychromised the frame in red, blue and gold.
