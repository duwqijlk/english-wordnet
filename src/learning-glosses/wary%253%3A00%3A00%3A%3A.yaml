simpleMeaning: very careful and watching for danger, and thinking hard before you act
scope: Careful and on watch for danger, not the sense that means openly not trusting people and not willing
  to tell them your thoughts.
examples:
- The hikers were wary as they walked through the dark forest.
- He was wary of the wet, slippery steps and held the rail tight.
