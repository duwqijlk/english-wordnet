simpleMeaning: Several feet across, a big leaf-like wrap shaped like the open flower of a morning glory
  grows on this hot-land plant that smells bad.
scope: Also called krubi, this hot-land plant smells bad and has a big leaf-like wrap several feet across.
examples:
- The titan arum in the glasshouse smelled so bad that visitors kept away.
- A titan arum opened its great wrap in the hot house.
