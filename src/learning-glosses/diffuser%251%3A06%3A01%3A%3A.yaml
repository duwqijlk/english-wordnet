simpleMeaning: a flat board that makes sound waves reach all parts at the same strength
scope: A flat board that makes sound waves reach all parts at the same strength, also called a diffusor,
  and not a thing that spreads light or a loudspeaker itself.
examples:
- The hall hung a diffuser on the wall to spread the music evenly.
- A diffuser behind the stage keeps the sound clear for every seat.
