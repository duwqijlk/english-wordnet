simpleMeaning: A North American perennial with few branches and clusters of bright yellow flowers at the
  ends of its stems, like foxglove flowers, sometimes put in a group of its own.
scope: Also called false foxglove and Aureolaria virginica; a yellow-flowered plant of North America,
  not a true foxglove.
examples:
- Gerardia virginica bloomed yellow in the meadow.
- We found Gerardia virginica along the path.
