simpleMeaning: a muscle that lies at a slant on each side of the belly, in the middle part of the body
scope: Also called abdominal external oblique muscle, external oblique muscle, and musculus obliquus externus
  abdominis. This is the slanted muscle on each side of the belly, not the slanted direction sense and
  not a sense meaning indirect or misleading.
examples:
- He hurt an oblique while lifting the heavy box.
- Strong obliques help you turn your upper body.
