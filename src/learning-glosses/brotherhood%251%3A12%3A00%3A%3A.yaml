simpleMeaning: the feeling that men should treat each other as if they were close family, with care and
  help for each other
scope: A feeling that men should care for each other like close family; not the family relation between
  a man and his brothers and sisters.
examples:
- The soldiers spoke of the brotherhood they felt after the war.
- A feeling of brotherhood grew among the men in the small town.
