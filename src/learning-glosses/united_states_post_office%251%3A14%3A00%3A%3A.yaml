simpleMeaning: A group on its own in the United States government that delivers the mail, and at times
  phone and radio messages, between people and firms in the United States.
scope: Also called PO, Post Office and US Post Office, this is a group on its own in the United States
  government that delivers the mail, and at times phone and radio messages, between people and firms,
  not the Postal Service, which also sorts the mail.
examples:
- She works for the United States Post Office.
- The United States Post Office sometimes carries phone messages as well as letters.
