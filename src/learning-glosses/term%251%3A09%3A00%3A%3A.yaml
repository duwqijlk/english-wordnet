simpleMeaning: one of the separate quantities, such as 3x or 5, that are added together in a polynomial
scope: This sense is one of the added quantities in a mathematical expression, not a word or phrase with
  a fixed meaning, and not a fixed period of time.
examples:
- In 2x + 5, the first term is 2x and the second is 5.
- Combine the like terms before you solve the equation.
