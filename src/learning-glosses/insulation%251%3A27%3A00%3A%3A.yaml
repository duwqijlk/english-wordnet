simpleMeaning: material that keeps heat, sound, or electricity from passing through, or slows how much
  passes through
scope: This is the material itself, also called insulant; it is not the act of putting such material around
  something.
examples:
- The walls are filled with thick insulation to keep the house warm in winter.
- They added insulation around the pipes so less heat would be lost.
