simpleMeaning: Tin, a silvery metal easy to shape that does not rust, used in many metal mixtures and
  to coat other metals against rust, got mostly from cassiterite as tin oxide.
scope: Also called tin and atomic number 50; a silvery metal that does not rust, not iron, which rusts
  easily, and not lead, a heavier soft metal.
examples:
- Sn is the chemical symbol for tin.
- Workers coated the iron sheets with Sn to stop them rusting.
