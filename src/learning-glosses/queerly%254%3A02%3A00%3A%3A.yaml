simpleMeaning: in a strange and unusual way that makes you ask if something is wrong
scope: Done in a strange way that seems not quite right, not simply in a different or new way with nothing
  wrong about it.
examples:
- The money had been queerly come by, and no one could say how he got it.
- He looked at her queerly, as if he did not know her name.
