simpleMeaning: In logic, to rest on a thing as a need that must be met first.
scope: 'Also called connote: in logic, to rest on a thing as a need that must be met first, not to say
  that a thing has a certain quality, and not the part of a sentence that says something about its subject,
  and not the term said of the subject of a claim, and not the act of making such a part.'
examples:
- His success is predicated on hard work.
- The plan is predicated on the rain holding off.
