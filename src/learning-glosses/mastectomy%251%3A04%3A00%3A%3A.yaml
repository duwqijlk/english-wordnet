simpleMeaning: An operation to cut away a breast in order to take out a cancerous growth
scope: An operation to cut away a breast in order to take out a cancerous growth; not a lumpectomy, which
  takes out only the growth, and not a mastopexy, which lifts the breast.
examples:
- She had a mastectomy to take out the cancerous growth.
- After the mastectomy, she began her slow healing.
