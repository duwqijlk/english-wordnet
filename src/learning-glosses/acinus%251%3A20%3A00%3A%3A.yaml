simpleMeaning: one of the small stone fruits that join together to make a fruit like a blackberry
scope: This is one small stone fruit in a fruit made of many such parts, like a blackberry; not a small
  sac in a gland, and not a whole fruit.
examples:
- Each acinus of the blackberry is one small stone fruit.
- The ripe blackberry is made of many tiny acini joined together.
