simpleMeaning: A plant of the desert in southern California, with blue or purple tube-shaped flowers in
  bunches at the ends of its stems.
scope: Also called whitlavia, California bluebell, and Phacelia whitlavia; a desert plant of southern
  California, set apart from other desert plants by its tube-shaped blue or purple flowers.
examples:
- Phacelia minor bloomed blue across the desert floor.
- We found Phacelia minor with its tube-shaped flowers near the wash.
