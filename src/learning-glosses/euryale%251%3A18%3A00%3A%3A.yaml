simpleMeaning: In Greek myth, the middle one of the three Gorgons, women with snakes for hair.
scope: One of the three Gorgon sisters in Greek myth, the one between the eldest and the youngest; not
  Medusa or Stheno, the other two sisters.
examples:
- Euryale was the second eldest of the three Gorgons.
- In the story, Euryale stood beside her sisters Medusa and Stheno.
