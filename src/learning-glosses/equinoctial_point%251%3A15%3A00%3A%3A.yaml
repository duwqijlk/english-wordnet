simpleMeaning: In astronomy, one of the two places in the sky where the ring around the middle of the
  sky meets the path of the sun.
scope: In astronomy, one of two places where the sky's middle ring meets the sun's path, also called equinox;
  not a pole of the sky and not a star.
examples:
- The sun stands at an equinoctial point when day and night are of the same length.
- The two equinoctial points mark where the sun's path crosses the sky's middle ring.
