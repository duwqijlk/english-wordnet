simpleMeaning: A heat-measuring tool made of a row of small pointed shapes that soften and run at different
  heats
scope: A heat-measuring tool of pointed shapes that melt one by one, not a glass heat gauge and not a
  single melting block.
examples:
- The potter put a pyrometric cone in the kiln to check the heat.
- When the pyrometric cone bent over, the kiln had reached the right heat.
