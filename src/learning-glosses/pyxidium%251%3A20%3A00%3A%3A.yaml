simpleMeaning: The fruit of plants like the plantain, a small case whose top comes off when the seeds
  inside are let out
scope: A plantain-like fruit, a case whose top falls off to free the seeds; pyxis is another name for
  this sense. Not a berry and not a fruit that splits open along its sides.
examples:
- The pyxidium of the plantain drops its top to free the seeds.
- When the seeds were ready, the pyxidium opened at the top.
