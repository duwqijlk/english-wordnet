scope: A quiet form of a body chemical that does nothing on its own, the starting point for the active
  form that comes next, not the active form itself and not a drug that lowers blood pressure.
examples:
- Angiotensin I is changed into the active form in the body.
- The doctor measured angiotensin I in the blood sample.
