simpleMeaning: a movement that makes something take the shape of a curve
scope: 'Also called bend: a movement that makes something form a curve, not the act of a person making
  something curved.'
examples:
- The bending of the branch in the wind made it curve more and more.
- We watched the slow bending of the thin strip as it took a round shape.
