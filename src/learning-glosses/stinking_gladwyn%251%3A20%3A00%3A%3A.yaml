simpleMeaning: A bad smell rises from the leaves of this iris, which bears purple blooms in the south
  and west of Europe and North Africa.
scope: Gladdon, gladdon iris, roast beef plant, and stinking iris are other names for this bad-smelling
  iris with purple blooms from the south and west of Europe and North Africa.
examples:
- In the south of Europe, stinking gladwyn grows with purple blooms above leaves that smell bad.
- The leaves of stinking gladwyn smell bad, though its blooms are purple.
