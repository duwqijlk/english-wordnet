simpleMeaning: to make guesses in thought about God and holy things, or to talk about such things in a
  deep way
scope: 'Another name for theologize: to think or talk in a deep way about God and holy things, not to
  preach a sermon and not to pray.'
examples:
- He liked to theologise about the nature of God late into the night.
- In class we theologise about what the old texts mean.
