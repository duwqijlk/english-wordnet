simpleMeaning: Moving the core of a patient's own cell into an egg cell, so cells the body will not fight
  off, above all stem cells, can be grown for transplant.
scope: Also called therapeutic cloning, this moves the core of a patient's own cell into an egg cell,
  so cells the body will not fight off can be grown for transplant.
examples:
- Biomedical cloning moves the core of a patient's own cell into an egg cell.
- In biomedical cloning, cells the body will not fight off can be grown for transplant.
