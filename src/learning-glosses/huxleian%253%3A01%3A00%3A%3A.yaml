simpleMeaning: Said of things that belong to Thomas Huxley or show what he was like.
scope: Said of what belongs to Thomas Huxley or is like him, and also called Huxleyan; not of another
  man's work.
examples:
- The book takes a Huxleian view of science and faith.
- His Huxleian essay praised the power of reason.
