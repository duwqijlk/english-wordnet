simpleMeaning: the hour when a bus, train, plane, or other public transport is due to reach the place
  it is going to
scope: The set hour when public transport is due to reach a stop, not the hour it leaves and not the hour
  a private car is due.
examples:
- The arrival time of the 8.15 train is 10.30.
- Check the arrival time before you head to the station.
