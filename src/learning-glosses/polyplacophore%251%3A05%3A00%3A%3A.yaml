simpleMeaning: Eight hard chalky plates cover the back of this long soft sea creature, the same on both
  sides, an early kind.
scope: 'Also called chiton, coat-of-mail shell, and sea cradle: a long soft sea creature with eight hard
  plates on its back.'
examples:
- We found a polyplacophore with eight hard plates.
- The polyplacophore's eight hard plates covered its back.
