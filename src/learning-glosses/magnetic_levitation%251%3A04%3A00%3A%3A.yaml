simpleMeaning: A pull that lifts metal holds the train above its track on a cushion, so it runs fast with
  no friction.
scope: Also called maglev, this is fast rail travel with a train held up above its track and no wheels
  touching it.
examples:
- The train floated above its track by magnetic levitation.
- Magnetic levitation let the train run with no friction.
