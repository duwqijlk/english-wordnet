simpleMeaning: the space where two lines or flat faces meet, and how much one line leans from the other,
  read in degrees or radians
scope: The space where two lines or flat faces meet, and how much one line leans from the other, read
  in degrees or radians, not a move at a slant and not a lean from straight up.
examples:
- The angle of the roof is 30 degrees.
- Draw an angle of 90 degrees on the page.
