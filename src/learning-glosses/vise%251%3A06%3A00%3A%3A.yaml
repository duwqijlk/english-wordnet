scope: A tool fixed to a workbench, with two jaws that grip a piece of work so it stays firmly in place;
  vice is another name for this sense, and it is not a bad habit or a clamp that moves around.
examples:
- He held the wood in the vise while he sawed it.
- Tighten the vise before you start drilling.
