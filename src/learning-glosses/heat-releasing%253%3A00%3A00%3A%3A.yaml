simpleMeaning: Warmth comes out of a change in chemicals, or out of a new stuff made by such a change,
  as it goes on
scope: 'Also called exothermal and exothermic: a change that gives out warmth, not one that takes in warmth
  and not the warmth of a fire.'
examples:
- The heat-releasing reaction warmed the water around it.
