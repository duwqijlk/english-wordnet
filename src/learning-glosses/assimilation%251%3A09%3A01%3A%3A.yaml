senseId: 'assimilation%1:09:01::'
synsetId: 05765046-n
simpleMeaning: The taking in of new ideas, fitting them into what one already knows and thinks.
scope: The taking in of new ideas into what one already knows and thinks, not the fitting of one case
  to a general pattern in the ideas of Jean Piaget, not how the nourishing parts of food pass into the
  body after eating, and not people of different backgrounds coming to see themselves as part of one nation.
examples:
- Assimilation of the new ideas took weeks of study.
- The assimilation of new facts into her old way of thinking was slow.
