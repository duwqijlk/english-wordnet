simpleMeaning: Running sideways across a thing, at right angles to the way it is longest.
scope: Also called cross, running sideways across a thing, not along its length.
examples:
- The transverse beam ran across the roof from one side to the other.
- The road was transverse to the river, crossing it at a right angle.
