simpleMeaning: Stretched straight and firm, as a rope or fabric under pull.
scope: This means stretched under tension, not squeezed together with no gap or fixed so it cannot move.
examples:
- The rope was pulled tight between the two posts.
- Keep the sail tight as the wind rises.
