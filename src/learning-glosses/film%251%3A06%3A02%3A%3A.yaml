simpleMeaning: a thin sheet of material, usually plastic and usually see-through, used to wrap or cover
  things
scope: This is a sheet used for wrapping or covering, not a thin layer lying on a surface and not a motion
  picture.
examples:
- She wrapped the sandwiches in film and put them in the fridge.
- Stretch film keeps the boxes steady on the pallet.
