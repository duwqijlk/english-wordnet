simpleMeaning: Very strong warmth bursts out in a short, sharp way, as from an atom bomb
scope: A short, sharp burst of very strong warmth, not a slow rise in warmth and not a burst of light.
examples:
- The heat flash from the explosion scorched the ground in a second.
- People felt the heat flash on their skin before they heard the blast.
