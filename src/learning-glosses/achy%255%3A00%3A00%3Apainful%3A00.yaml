simpleMeaning: giving a pain that is not sharp and does not go away
scope: 'Also called aching: it describes a part of the body with a pain that is not sharp and does not
  stop, not a sharp, sudden pain.'
examples:
- My achy knees gave me a dull pain all day after the long walk.
- Her achy shoulders gave her a low, steady pain all evening.
