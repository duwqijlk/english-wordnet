senseId: 'sanctify%2:30:00::'
synsetId: 00476750-v
simpleMeaning: to make someone or something clean and free from sin or guilt
scope: 'Also called purge and purify: to make a person or thing clean and free from sin or guilt. It is
  not the sense of giving religious approval to something, such as through an oath.'
examples:
- He believed that prayer could sanctify his heart and take away his guilt.
- The monks tried to sanctify their lives through prayer and good works.
