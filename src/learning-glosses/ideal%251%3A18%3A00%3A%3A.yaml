simpleMeaning: a person or thing that is the best example of its kind, so good that no other is as good
  as it
scope: 'Also called saint: a person or thing that is the best of its kind, not the sense for being perfect
  and not the sense about ideas in philosophy.'
examples:
- He looked up to his father as his ideal.
- This house is her ideal of a home.
