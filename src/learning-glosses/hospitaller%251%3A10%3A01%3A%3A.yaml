senseId: 'hospitaller%1:10:01::'
synsetId: 92463536-n
simpleMeaning: The title of a member of any of several religious orders that cared for the sick in hospitals
scope: The title of a member of a religious order that cared for the sick, not the head of the order and
  not a modern nurse.
examples:
- The hospitaller was in charge of the hospital staff.
- In the old order, the hospitaller looked after the sick brothers.
