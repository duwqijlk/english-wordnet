simpleMeaning: More than 100 known basic things, 92 of them found in nature, that cannot be split into
  simpler things and that, alone or mixed, make up all matter.
scope: 'Also called element: one of the basic things that make up all matter, not a mixture and not a
  compound.'
examples:
- Oxygen is a chemical element found in the air.
- Gold is a chemical element that cannot be split into simpler things.
