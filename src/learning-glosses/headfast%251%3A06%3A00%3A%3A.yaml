simpleMeaning: To hold a boat or ship still, a rope ties its front to a place beside the water where boats
  stop
scope: A rope that ties the front of a boat or ship to a wharf, not a rope that holds the back and not
  an anchor.
examples:
- They tied the headfast to the wharf before unloading the boat.
- The headfast held the front of the ship against the wharf.
