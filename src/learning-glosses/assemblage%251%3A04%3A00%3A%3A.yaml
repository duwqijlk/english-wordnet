simpleMeaning: the act of people coming together to meet as a group
scope: 'Also called assembly: people coming together to meet as a group. It is not a set of parts put
  together to make a thing, and it is not a group of things collected together.'
examples:
- The law protects peaceful assemblage for a public meeting.
- Their assemblage in the square was a protest against the new tax.
