simpleMeaning: to be in a pose with the top half of the body mostly upright and the weight held by the
  bottom
scope: To rest on the bottom with the top half of the body mostly upright, also called sit; not lying
  down and not standing.
examples:
- Please sit down and make yourself comfortable.
- He was too tired to sit down after the long walk.
