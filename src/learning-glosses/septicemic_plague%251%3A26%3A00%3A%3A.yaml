simpleMeaning: Above all, a most dangerous and mostly deadly form of the disease in which germs get into
  the blood; it does not pass from person to person
scope: Above all a most dangerous and mostly deadly form of the disease, with germs in the blood, not
  the form with swollen glands and not the form that strikes the lungs.
examples:
- Septicemic plague is rare but most often deadly.
- Doctors fear septicemic plague because germs invade the blood.
