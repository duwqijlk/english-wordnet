simpleMeaning: A plant that grows in the northwestern United States and British Columbia, with flowers
  that are yellow, red, or deep blue-red.
scope: A plant of the northwestern United States and British Columbia, not a tree and not a plant of dry
  ground.
examples:
- The purple sanicle grows in the woods of the northwestern United States.
- Purple sanicle bears yellow or red or deep blue-red flowers.
