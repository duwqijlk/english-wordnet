simpleMeaning: A pipe that takes fuel from a tank to a motor that burns it.
scope: This is a pipe that takes fuel from a tank to a motor that burns it; fuel line and petrol line
  are other names for this sense, not a pipe that carries water and not the tank itself.
examples:
- The car wouldn't start because dirt clogged the gas line.
- The mechanic replaced a cracked gas line.
