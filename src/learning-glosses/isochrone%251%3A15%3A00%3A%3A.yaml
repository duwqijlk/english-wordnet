simpleMeaning: Where the same thing happens or is reached at the same time, a line joins those places
scope: A line joining places where the same thing happens or is reached at the same time; not a line joining
  places of the same height and not a line joining places of the same heat.
examples:
- The isochrone on the map joins towns reached within one hour of the city.
- Draw an isochrone to show where the quake was felt at the same time.
