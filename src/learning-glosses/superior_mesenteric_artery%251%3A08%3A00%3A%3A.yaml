simpleMeaning: A blood tube from the upper part of the main blood tube of the body, bringing blood to
  the small gut, the blind gut and the large gut.
scope: A blood tube from the upper part of the main blood tube of the body that brings blood to the small
  gut and the large gut; not a vein and not a blood tube of the kidneys.
examples:
- The superior mesenteric artery carries blood to the small intestine.
- Doctors check the superior mesenteric artery when the gut lacks blood.
