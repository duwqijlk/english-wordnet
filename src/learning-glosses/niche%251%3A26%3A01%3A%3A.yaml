simpleMeaning: In ecology, the place and role of a living thing in its surroundings and among other living
  things, which affects whether its kind lives on
scope: In ecology, the role of a living thing in its surroundings, not a small hollow in a wall and not
  a special market.
examples:
- Each bird finds its own niche in the forest.
- The plant's niche in the desert depends on how little water it needs.
