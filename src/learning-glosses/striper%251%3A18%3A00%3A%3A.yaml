simpleMeaning: stripes worn on a uniform by a man in the armed forces to show his rank or how long he
  has served
scope: A man in the armed forces who wears stripes to show rank or years of service; not a fish with dark
  stripes and not a man who sews stripes on cloth.
examples:
- He's a four-striper.
- The striper's sleeve showed his years of service.
