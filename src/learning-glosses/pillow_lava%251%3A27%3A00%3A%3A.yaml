simpleMeaning: Thought to come from bursts of fire under the sea, this hot melted rock cooled in round
  shapes like cushions.
scope: It is hot melted rock that cooled in round shapes like cushions, thought to come from bursts of
  fire under the sea, not rock that cooled on dry land.
examples:
- The pillow lava lay in round shapes like cushions.
- Scientists think the pillow lava came from eruptions under the sea.
