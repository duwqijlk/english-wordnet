simpleMeaning: A home built of blocks of sun-dried mud or earth, laid in flat rows.
scope: A home built of sun-dried mud blocks in flat rows, not a home of fired brick and not a home of
  wood.
examples:
- The adobe house stayed cool through the hot day.
- They built an adobe house from the mud of the river bank.
