simpleMeaning: to treat a person or a thing with no care and no real interest
scope: 'Also called play: to act with careless disregard for a person or thing, not to move a thing about
  with the hands or turn an idea over in the mind, and not a small pet dog or a copy.'
examples:
- Do not toy with her feelings.
- He toyed with the job offer and never gave a clear answer.
