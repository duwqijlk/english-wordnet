simpleMeaning: a living thing that can have more than one grown-up form, as ants or termites do in their
  different groups
scope: This is a living thing that takes more than one grown-up form, not a living thing with only one
  grown-up form.
examples:
- The polymorph grew up as a worker ant, while its sister grew up as a queen.
- Termites show how a polymorph can take a different grown-up form from others of its kind.
