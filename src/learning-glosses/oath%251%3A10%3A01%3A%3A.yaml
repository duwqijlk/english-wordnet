simpleMeaning: A rude or dirty word or phrase, most often said when you are taken by surprise or feel
  angry
scope: 'Also called curse: a rude word or phrase said in surprise or anger, not a solemn promise and not
  a promise to tell the truth.'
examples:
- He let out an oath when he hit his thumb with the hammer.
- She muttered an oath under her breath when the car would not start.
