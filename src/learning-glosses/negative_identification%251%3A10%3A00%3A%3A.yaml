simpleMeaning: Proof that a person is not who they say they are not, and not one of the people a system
  already knows, so the system turns them away.
scope: Proof that a person is not who they say they are not, and not one of the people a system already
  knows, so the system turns them away; not proof that a person is who they claim to be.
examples:
- The bank's negative identification system stopped one man from opening accounts under two names.
- Negative identification proved she was not among the people the system already knew.
