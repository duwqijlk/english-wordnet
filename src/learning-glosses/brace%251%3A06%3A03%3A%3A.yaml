simpleMeaning: a thing fixed to the teeth to make them straight
scope: A thing worn on the teeth to straighten them, not a tool for wood and not a rope on a ship.
examples:
- She had a brace on her teeth for two years.
- The dentist fitted him with a brace to straighten his front teeth.
