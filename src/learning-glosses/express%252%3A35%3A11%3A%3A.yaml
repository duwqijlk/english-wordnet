simpleMeaning: To get something out of a substance by pressing or squeezing it.
scope: This is pressing something out of a substance, not saying what you feel and not sending a parcel
  by fast service.
examples:
- They express the oil from the seeds by crushing them.
- Some cooks express the juice from grated ginger with a press.
