simpleMeaning: Having two unlike forms of a gene at matching places on a pair of tiny threads in a cell.
scope: Having two unlike forms of a gene at matching places; not having two like forms, and not a word
  for the gene itself.
examples:
- She is heterozygous for eye color, with one brown and one blue form of the gene.
- The plant was heterozygous at that gene, carrying two unlike forms.
