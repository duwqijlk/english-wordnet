simpleMeaning: in a ship with two hulls, the two long bodies of the ship, a closed space between the frames
  on each side
scope: A closed space at each side of a ship with two hulls, not the open deck and not a room for goods.
examples:
- Water collected in the bilges after the rough crossing.
- The bilges of the twin-hulled ship were checked for leaks.
