simpleMeaning: To do with the organ that feeds a baby in the womb, or having it, or happening by means
  of it.
scope: To do with the organ that feeds a baby in the womb, or having it, or happening by means of it,
  not the noun use for mammals that have such an organ, all mammals except those that lay eggs or carry
  their young in a pouch.
examples:
- The dog is placental, and its young grow in the womb.
- These animals are placental, feeding their young through the organ in the womb.
