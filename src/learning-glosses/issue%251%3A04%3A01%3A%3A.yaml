simpleMeaning: the act of giving out something, often in large numbers, so it can be used generally or
  for an official purpose
scope: This sense names the act of handing things out, not the verb for writing and giving out a document,
  and not a subject or problem under discussion.
examples:
- The issue of new passports was delayed by a computer failure.
- The issue of uniforms to new recruits takes place on the first day.
