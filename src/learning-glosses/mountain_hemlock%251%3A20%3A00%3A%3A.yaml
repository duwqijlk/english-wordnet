simpleMeaning: Its wood is much harder than the same kind of tree from Canada, and this big tree of the
  west of the United States keeps its leaves all year
scope: 'Also called black hemlock: a big tree of the west of the United States that keeps its leaves all
  year, not the Canadian hemlock and not a small garden tree.'
examples:
- The mountain hemlock on the slope kept its green leaves through the winter.
- A mountain hemlock stood tall beside the cabin, its leaves green all year.
