simpleMeaning: A mark (%) used to show that the number before it means a part of a hundred.
scope: A mark (%) that shows the number before it means a part of a hundred, also called a percent sign,
  not a mark for money and not a mark for a full stop.
examples:
- Put a percentage sign after the number 50.
- The percentage sign tells us the number is a part of a hundred.
