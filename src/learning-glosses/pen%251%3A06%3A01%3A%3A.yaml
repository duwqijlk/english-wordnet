simpleMeaning: a place with a fence around it, where farm animals are kept
scope: This is a fenced place for farm animals. It is not the tool for writing with ink, not the frame
  where a baby plays, and not a prison.
examples:
- The farmer put the sheep in a pen for the night.
- Ten pigs were kept in a pen beside the barn.
