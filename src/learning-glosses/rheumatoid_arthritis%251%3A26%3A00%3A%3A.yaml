senseId: 'rheumatoid_arthritis%1:26:00::'
synsetId: 14210220-n
simpleMeaning: A long-term condition in which the immune system attacks the joint lining, causing inflammation
  and lasting deformity; a virus may start it, and it can destroy the whole joint.
scope: This sense is the specific autoimmune disease that erodes joints; it is not osteoarthritis or the
  general aches once called rheumatism.
examples:
- Rheumatoid arthritis often affects the same joints on both sides of the body.
- She was diagnosed with rheumatoid arthritis after months of joint pain and stiffness.
