simpleMeaning: Having a strong, solid body build in which bone, muscle and connective tissue — the tissues
  that grow from the embryo's middle layer — are the main structures.
scope: 'Another name for mesomorphic: the body-build sense, meaning a strongly built frame; not the sense
  of muscular that means ''relating to muscles''.'
examples:
- He has the broad, muscular build of a heavyweight rower.
- Her muscular frame comes from a family of farmers.
