simpleMeaning: A place of learning set up and run by its own people, paid for with money given to it and
  money paid by pupils' families
scope: A place of learning run by its own people and paid for by gifts and fees, not a state-run place
  of learning and not a free public one.
examples:
- Her children attend a private school across town.
- The private school charges fees that many families cannot afford.
