simpleMeaning: having to do with a printer that sprays tiny drops of dark liquid
scope: This word describes things that belong to a printer that sprays tiny drops of dark liquid; not
  a laser printer and not a pen that writes by hand.
examples:
- She printed the photo on the ink-jet at home.
- Ink-jet printers are cheaper than laser printers.
