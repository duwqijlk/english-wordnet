simpleMeaning: A man who, in a strong and pushy way, tries to show women that he wants love or sex
scope: This is a man who pushes himself on women, not the wild animal like a dog that hunts in groups.
examples:
- He acted like a wolf at the party, pushing himself on every woman.
- The women called him a wolf because he would not leave them alone.
