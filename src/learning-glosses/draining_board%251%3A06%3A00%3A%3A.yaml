simpleMeaning: a flat slanted surface next to a kitchen sink that lets water drip back into the sink
scope: A flat slanted surface by a kitchen sink, also called a drainboard; not a worktop for cutting food
  and not a shelf for storing dishes.
examples:
- She set the wet plates on the draining board to drip into the sink.
- He wiped the draining board dry after washing the cups.
