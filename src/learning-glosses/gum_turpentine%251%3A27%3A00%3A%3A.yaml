simpleMeaning: a sticky stuff, part thin oil and part thick sap, got from trees that bear cones, most
  often pines
scope: A sticky stuff from cone-bearing trees, most often pines, also called turpentine, not the dried
  sap of the dhak tree and not a sap from a tree with broad leaves.
examples:
- The worker tapped the pine to draw off gum turpentine.
- Gum turpentine oozed from the cut in the bark.
