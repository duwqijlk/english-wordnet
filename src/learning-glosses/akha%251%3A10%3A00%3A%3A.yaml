simpleMeaning: A Loloish language spoken in south Yunnan Province, in Jingdong and Jinggu counties, in
  the Yuanjiang and Lancang (Mekong) river basins, and in the Ailao mountains.
scope: Not Lahu or Lisu, other Loloish tongues; also called the Akha language, Hani, and the Hani language.
examples:
- Akha is spoken in the hills of south Yunnan.
- She learned Akha from her grandmother.
