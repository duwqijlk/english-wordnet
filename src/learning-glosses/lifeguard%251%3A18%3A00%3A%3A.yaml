simpleMeaning: a person whose job is to watch people in the water at a beach or pool and help them stay
  safe
scope: This person watches swimmers to keep them safe, also called lifesaver; this is not a swimmer and
  not a swimming teacher.
examples:
- The lifeguard blew his whistle when a child went too far out.
- A lifeguard helped the tired swimmer get back to the beach.
