simpleMeaning: With no thought and no learning, a living thing's body answers at once to something that
  sets it off
scope: A body's at-once answer to a thing that sets it off, with no thought and no learning; inborn reflex,
  instinctive reflex, physiological reaction and reflex are other names for this sense, not a move made
  on purpose and not a habit learned by practice.
examples:
- Blinking when dust hits your eye is an innate reflex.
- The baby's innate reflex made her grasp the finger.
