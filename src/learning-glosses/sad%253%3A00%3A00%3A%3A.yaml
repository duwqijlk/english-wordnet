simpleMeaning: feeling unhappy, or showing that you feel unhappy.
scope: This is not about a situation being unfortunate or in a bad state; it is about a person's unhappiness
  and how it shows.
examples:
- She felt sad when her best friend moved away.
- The film left him feeling sad for days.
