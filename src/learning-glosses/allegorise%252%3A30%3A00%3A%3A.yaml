senseId: 'allegorise%2:30:00::'
synsetId: 00135093-v
simpleMeaning: to turn a story into an allegory, where its people and events stand for ideas
scope: Also called allegorize; to turn a story into an allegory, not to read a hidden meaning into a story
  already written.
examples:
- The writer chose to allegorise the tale of the journey.
- The author decided to allegorise the old myth, giving its heroes a hidden meaning.
