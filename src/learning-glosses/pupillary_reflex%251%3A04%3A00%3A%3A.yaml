synsetId: 00867486-n
simpleMeaning: when a bright light shines in, or after certain drugs, the ring of muscle around the black
  centre of the eye tightens on its own, so it gets smaller
scope: Also called light reflex, miosis, and myosis, it is the eye's own tightening of the pupil in bright
  light.
examples:
- The bright light set off a pupillary reflex in her eyes.
- The pupillary reflex shrank her pupils in the bright light.
