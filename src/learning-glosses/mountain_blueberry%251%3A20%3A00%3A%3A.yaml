simpleMeaning: Its flowers grow one by one on this upright bush of the west of the United States, and
  its fruit tastes a little sour.
scope: It is also called a bilberry, a mountain blue berry, or a thin-leaved bilberry, and it is an upright
  bush of the west of the United States whose fruit tastes a little sour.
examples:
- The mountain blueberry grows upright in the west of the United States.
- The fruit of the mountain blueberry is a little sour.
