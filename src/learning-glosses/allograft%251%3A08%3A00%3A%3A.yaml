simpleMeaning: Tissue or an organ moved from a giver of the same species but different genes, the taker's
  immune system held down to stop the graft being cast off.
scope: This sense is also called homograft, for tissue or an organ moved from a giver of the same species
  but different genes, the taker's immune system held down to stop the graft being cast off.
examples:
- Allografts come from a donor.
- Allograft takers need immune drugs.
