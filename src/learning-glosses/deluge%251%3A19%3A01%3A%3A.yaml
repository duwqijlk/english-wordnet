simpleMeaning: Water rising and spreading over land that is usually dry.
scope: This is water rising and spreading over dry land; flood is another name for this sense, not rain
  alone or a great rush of things or people.
examples:
- The deluge covered the plains and ruined the harvest.
- After the river broke its banks, the deluge reached the village.
