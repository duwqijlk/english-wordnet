simpleMeaning: any of several herbs of the Medicago kind from Europe, Asia and Africa, with small flowers
  and leaves made of three parts
scope: Any of several Old World plants with small flowers and three-part leaves; medic and trefoil are
  other names for this sense, not alfalfa grown for feed, and not a garden herb grown for food.
examples:
- Medick grows wild on dry banks, with small yellow flowers.
- The farmer cut the medick for hay before it set seed.
