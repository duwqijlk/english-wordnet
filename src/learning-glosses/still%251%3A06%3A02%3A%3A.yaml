simpleMeaning: A factory or set of buildings where strong alcoholic drinks are made by heating and cooling
  liquid to separate and strengthen the alcohol.
scope: This is not the adjective describing a motionless picture; it is a place or set of equipment where
  alcohol is distilled.
examples:
- The old still has been turned into a museum.
- A new still was built beside the river last year.
