simpleMeaning: to give a thing a meaning to do with the soul, or to read such a meaning into it
scope: 'Also called spiritualise: to give a thing a meaning to do with the soul, or to read such a meaning
  into it, not to clean it of worldly things and not to lift it up as holy.'
examples:
- She tried to spiritualize the simple tale.
- He spiritualized the event by finding a soul's lesson in it.
