simpleMeaning: a sticky gum used above all to soothe sore skin
scope: 'Also called asa dulcis, benjamin, gum benjamin and gum benzoin: a sticky gum for sore skin, not
  a gum for chewing and not a cream for wounds.'
examples:
- The nurse spread benzoin on the red skin to calm it.
- Benzoin soothed the rash where the plaster had rubbed.
