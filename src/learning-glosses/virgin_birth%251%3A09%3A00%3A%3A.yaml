simpleMeaning: The belief that Jesus had no human father; Christians hold that his coming fulfilled Old
  Testament prophecies and was attended by miracles, and the Nativity is kept at Christmas.
scope: A belief about Jesus having no human father, also called Nativity; not the Annunciation and not
  other events of Christmas.
examples:
- The Virgin Birth is a central belief for many Christians.
- She spoke of the Virgin Birth at the Christmas service.
