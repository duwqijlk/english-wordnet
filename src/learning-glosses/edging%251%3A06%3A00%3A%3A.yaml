simpleMeaning: a strip of stuff put along the edge of a thing to finish it off, such as a fringe on clothes
  or on a rug
scope: The finished strip along the edge of a thing, not the edge itself and not a hem sewn into the cloth.
examples:
- The rug's edging was frayed after years of use.
- She added a lace edging to the tablecloth.
