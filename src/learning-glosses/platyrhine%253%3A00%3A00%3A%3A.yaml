simpleMeaning: Said of people with wide noses, or of New World monkeys with holes in the nose far apart
scope: 'Also called broadnosed, platyrhinian, platyrrhine, platyrrhinian and platyrrhinic: said of New
  World monkeys with holes in the nose far apart or of people with wide noses, not of monkeys with holes
  in the nose close together.'
examples:
- Platyrhine monkeys have holes in the nose set far apart.
- The platyrhine man had a very broad nose.
