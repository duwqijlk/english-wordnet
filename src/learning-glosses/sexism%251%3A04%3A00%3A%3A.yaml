senseId: 'sexism%1:04:00::'
synsetId: 01158380-n
simpleMeaning: treating men or women unfairly or badly because they are not the same sex as you
scope: This is unfair or bad treatment of people of the other sex, not treatment that is the same for
  men and women, and not bad treatment for another reason such as race.
examples:
- She lost the job to a less skilled man, a clear case of sexism at work.
- The women's team got far less money than the men's team, and the players called it sexism.
