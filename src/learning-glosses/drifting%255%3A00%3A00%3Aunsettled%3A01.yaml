simpleMeaning: always moving from place to place or from job to job, especially with no fixed home or
  work
scope: 'Also called floating and aimless: about a person who keeps changing home or job, not about something
  carried slowly by water or wind.'
examples:
- After years of drifting from town to town, he had no fixed home.
- Her drifting life took her from one short job to the next.
