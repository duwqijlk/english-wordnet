simpleMeaning: the main unit of length in the international system of units, about 1.094 yards
scope: 'Also called metre: this is the unit of length, not a tool for measuring amounts, not the strong
  beat in poetry, and not the act of stamping mail.'
examples:
- The track is 100 meters long.
- She bought two meters of cloth for the dress.
