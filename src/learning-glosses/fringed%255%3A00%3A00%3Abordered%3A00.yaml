simpleMeaning: having something around its edge, like a border or fringe, at times used along with another
  word
scope: Having an edge around it, not a pretty trim added to clothes and not edges cut into fine slashes.
examples:
- The lake was fringed with reeds.
- The town was fringed by fields on every side.
