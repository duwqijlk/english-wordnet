simpleMeaning: A poor kind of sticky stuff made by insects in Madagascar.
scope: A poor kind of the sticky stuff made by insects in Madagascar, not the sticky stuff from a tree
  used to thicken food and not a sweet-smelling resin burned as incense.
examples:
- Traders in Madagascar sold gum-lac made by small insects.
- Workers gathered gum-lac from the insects in Madagascar.
