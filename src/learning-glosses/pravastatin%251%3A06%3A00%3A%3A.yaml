simpleMeaning: A drug taken by mouth, sold as Pravachol, that lowers the fatty stuff in the blood, and
  is advised after a heart attack that does not kill
scope: This is a drug taken by mouth, sold as Pravachol, that lowers the fatty stuff in the blood, and
  is advised after a heart attack that does not kill, not a drug that thins the blood and not a vitamin.
examples:
- The doctor gave her pravastatin after the heart attack.
- Pravastatin lowers the fatty stuff in the blood.
