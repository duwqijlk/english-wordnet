simpleMeaning: a big feather-leaved tree of Africa and Madagascar, with very long leaves cut into narrow
  parts that give a strong fibre from their stalks, sold for trade
scope: A large feather-leaved tree of Africa and Madagascar that gives strong fibre, not a coconut palm
  and not a date palm.
examples:
- Raffia palm leaves give the strong fibre used for baskets.
- The raffia palm grows tall in the wet lands of Madagascar.
