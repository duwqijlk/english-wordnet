simpleMeaning: a substance made by following a set list that says what to use and how much of each thing
scope: 'Also called preparation: this is a substance made to a set list, not the act of thinking up and
  forming an idea in the mind.'
examples:
- The doctor gave her a new formulation of the medicine, made to the same set list.
- This formulation is a cream made by following the set list exactly.
