simpleMeaning: a guess about what will happen next, worked out from what has happened before
scope: A guess about the future worked out from past events, not the forcing out of something and not
  a film image shown on a screen.
examples:
- Sales projections for next year are based on last year's figures.
- Her projection of the costs turned out to be close to the truth.
