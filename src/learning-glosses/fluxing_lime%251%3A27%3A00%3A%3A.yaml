simpleMeaning: a white crystal-like substance made with oxygen, used to make a white powder when water
  is added to it
scope: 'Also called burnt lime, calcined lime, calcium oxide, calx, lime, and quicklime: a white crystal-like
  substance made with oxygen and used to make a white powder with water, not the white powder it is used
  to make and not limestone.'
examples:
- Fluxing lime is added to water to make a white powder.
- The worker shovelled fluxing lime into the tank.
