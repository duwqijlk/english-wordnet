simpleMeaning: an open space that goes straight up through a building, with steps built around it
scope: The open space around which steps are built, not the steps themselves and not a room or a hall.
examples:
- Voices echoed up the stairwell to the top floor.
- He waited in the cold stairwell outside her flat.
