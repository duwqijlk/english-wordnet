simpleMeaning: The jury member who speaks for the whole group and is in charge of it
scope: The jury member who leads the group and speaks for it, not the judge and not an ordinary jury member.
examples:
- The foreperson read out the verdict to the court.
- Jurors chose a foreperson to speak on their behalf.
