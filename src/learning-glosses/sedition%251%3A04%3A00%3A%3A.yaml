senseId: 'sedition%1:04:00::'
synsetId: 00774302-n
simpleMeaning: an action against the law that pushes people to stand against those in lawful power, and
  tends to cause disorder in the government or bring the government down
scope: This is an action that pushes people against those in power, not just saying you do not agree with
  the government.
examples:
- He was charged with sedition after urging people to rise against the government.
- The men were jailed for sedition because they tried to bring the government down.
