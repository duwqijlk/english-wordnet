simpleMeaning: In music, it is played or sung with no gaps between notes, each flowing into the next.
scope: This is the musical term for notes joined without gaps, also called legato, not graceful bodily
  movement or a jolt-free ride.
examples:
- The pianist kept the passage smooth, letting each note blend into the next.
- The strings played the melody with a smooth, unbroken line.
