simpleMeaning: Thrombin acts on blood stuff as blood sets and makes a white, fibrous stuff that will not
  dissolve in water; it traps red cells and platelets in a net.
scope: This is the thread-like stuff that holds a clot together, not the red cells it catches and not
  the blood stuff it is made from.
examples:
- Fibrin held the clot in place.
- The fibrin net caught the red cells as the blood set.
