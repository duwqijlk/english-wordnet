senseId: apomictic%5:00:00:asexual:00
synsetId: 02143570-s
simpleMeaning: In reproduction, not joining male and female sex cells to make new life.
scope: This describes making new life without joining male and female sex cells; agamic, agamogenetic,
  agamous and parthenogenetic are other names for it, and it is not the usual joining of two parents.
examples:
- The plant grows by apomictic means, without seeds from two parents.
- Apomictic reproduction needs only one parent plant.
