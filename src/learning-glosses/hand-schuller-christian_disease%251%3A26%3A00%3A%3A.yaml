simpleMeaning: A histiocytosis tied to a fault in how the body handles cholesterol; it strikes mostly
  young children, making hollow spots in the skull and passing too much water.
scope: A childhood illness of the skull and water balance, also called Schuller-Christian disease; not
  ordinary diabetes.
