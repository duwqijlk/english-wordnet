simpleMeaning: set into levels that follow one after another, by different ways of judging which level
  each thing belongs to
scope: About things or people set in levels one above another; not flat, with everything standing at the
  same level.
examples:
- 'The army is hierarchical: each soldier takes orders from the rank above.'
- In the firm's hierarchical order, the newest workers stand at the lowest level.
