simpleMeaning: A big tree of tropical America, of the genus Cordia, grown for its many creamy white flowers
  and its wood of great worth
scope: This is a big tree of tropical America grown for its creamy white flowers and valuable wood; cypre,
  princewood, salmwood, Cordia alliodora and Ecuador laurel are other names for it, and it is not the
  timber tree of the same name.
examples:
- The Spanish elm in the garden bore creamy white flowers.
- Spanish elm wood is prized for its worth.
