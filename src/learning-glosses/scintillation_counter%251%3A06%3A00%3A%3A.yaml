simpleMeaning: A tube that gives off short flashes of light when rays that can pass through matter hit
  it
scope: A tube that flashes with light under rays that pass through matter, not a click-counting tube and
  not a film badge that darkens.
examples:
- A scintillation counter flashed each time a ray passed through it.
- The lab used a scintillation counter to spot the rays.
