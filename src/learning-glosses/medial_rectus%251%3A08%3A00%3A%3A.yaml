simpleMeaning: The eye muscle that turns the eyeball toward the nose when it tightens
scope: The eye muscle that pulls the eyeball toward the nose; medial rectus muscle is another name for
  this sense, not the muscle that turns the eye outward and not a muscle of the eyelid.
examples:
- The medial rectus pulls the eye toward the nose.
- Damage to the medial rectus makes it hard to look inward.
