simpleMeaning: a look in which the mouth's corners turn up, usually showing pleasure or amusement
scope: Another name for smile, smiling and grinning — the expression itself, usually showing pleasure
  or amusement — not the act of making it, nor the verb grin in this lane.
examples:
- She greeted us with a broad grin.
- A grin spread across his face when he heard the news.
