simpleMeaning: of a person in a written story or play, likely to make people feel dislike for that person
scope: 'Also called unappealing, unlikable and unlikeable: this is about a person in a book or play who
  makes people feel dislike, not about a real person who shows no kindness or care, and not about a thing
  that does not match your taste.'
examples:
- All the people in the play were unsympathetic, so we did not care what happened to them.
- She wrote the brother as an unsympathetic man, and most readers disliked him from the start.
