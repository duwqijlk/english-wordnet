simpleMeaning: A large salmon of the Pacific, prized as food; the grown fish die after laying eggs.
scope: Also called chinook, chinook salmon, king salmon, and quinnat salmon; this is the big Pacific salmon
  whose grown fish die after laying eggs, not one that lives to lay eggs again.
