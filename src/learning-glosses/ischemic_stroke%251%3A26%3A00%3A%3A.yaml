senseId: 'ischemic_stroke%1:26:00::'
synsetId: 14189840-n
simpleMeaning: The most common kind of sudden brain attack, caused when blood stops flowing to the brain,
  as when a clot blocks a blood tube
scope: The most common kind of sudden brain attack from blood stopping, not a brain attack from bleeding;
  ischaemic stroke is another name for this sense.
examples:
- He had an ischemic stroke when a clot blocked blood to his brain.
- An ischemic stroke is the most common kind of stroke.
