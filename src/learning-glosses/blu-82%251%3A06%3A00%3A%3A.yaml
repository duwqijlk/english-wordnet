simpleMeaning: A sure and deadly 15,000-pound bomb that breaks into pieces and blows up just above ground
  over a wide area; the largest ordinary bomb in the world, used in Afghanistan.
scope: Also called Big Blue; a sure and deadly 15,000-pound bomb that blows up just above ground over
  a wide area, distinct from smaller bombs and from bombs that blow up deep underground.
examples:
- BLU-82 was used in Afghanistan.
- The blast of BLU-82 covered a wide area.
