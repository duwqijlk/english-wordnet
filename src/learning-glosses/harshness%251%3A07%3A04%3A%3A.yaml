simpleMeaning: the quality of being cruel and making people feel tense or annoyed
scope: 'Also called cruelty: the cruel quality that makes people feel tense or annoyed, not a rough feel
  or sound, and not the roughness of a thing that rubs skin.'
examples:
- The harshness of his words made everyone in the room feel tense.
- She spoke with a harshness that annoyed even her friends.
