simpleMeaning: swelling of the thin covering inside the tubes that carry air into the lungs
scope: This is a sickness of the tubes that carry air to the lungs, not a cold in the nose and not a sickness
  of the lungs themselves.
examples:
- He stayed home with bronchitis and coughed all week.
- The doctor said her bronchitis would get better with rest.
