simpleMeaning: A yearly honour from the Motion Picture Arts and Sciences body for fine work in making
  films and in acting in them.
scope: 'Also called Oscar: a yearly honour for fine work in making films and in acting, not a prize for
  books and not a prize for music.'
examples:
- She won an Academy Award for her acting.
- The Academy Award goes to the best film of the year.
