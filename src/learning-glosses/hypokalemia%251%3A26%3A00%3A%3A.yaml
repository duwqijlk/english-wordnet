simpleMeaning: The blood holds far too little potassium, so a person grows weak and the heart beats wrongly,
  with tumors of the adrenal gland, starvation, or taking water pills.
scope: This is too little potassium in the blood, not a weak heart on its own.
examples:
- Hypokalemia left her weak, with her heart beating in an odd way.
- The doctor found hypokalemia after the patient had taken water pills for weeks.
