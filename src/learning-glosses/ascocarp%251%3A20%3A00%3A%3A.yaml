simpleMeaning: the full-grown part of a sac fungus that makes and holds the tiny cells from which new
  fungi grow
scope: The full-grown fruiting part of a sac fungus, not the fungus itself and not the tiny cells it makes.
examples:
- A dark ascocarp grew on the dead wood.
- After the rain, the ascocarp split open and let out its tiny cells.
