simpleMeaning: a small tree with green leaves all year, from the Caribbean and southern Central America
  to northern South America, giving the hardest wood sold for use and a healing gum
scope: A small evergreen tree of the Caribbean and Central America known for its very hard wood, not a
  palm tree and not a pine, and not the wood itself.
examples:
- Lignum vitae grows in the Caribbean and keeps its green leaves all year.
- Carpenters prize lignum vitae for its hard wood.
