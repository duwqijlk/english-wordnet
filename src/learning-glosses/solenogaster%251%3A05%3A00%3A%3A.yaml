simpleMeaning: Fine slimy spikes cover the skin of these worm-like soft sea creatures of deep water, which
  have no hard plates on the body.
scope: Also called aplacophoran, it is a soft sea creature of deep water with no hard plates on its body.
examples:
- Solenogasters live in deep water.
- A solenogaster has no hard plates, only fine spikes on its skin.
