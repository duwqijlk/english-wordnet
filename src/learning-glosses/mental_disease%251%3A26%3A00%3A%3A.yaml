simpleMeaning: A sickness of the mind that leaves a person with feeling or behaviour trouble so bad that
  a doctor of the mind must step in
scope: This is any sickness of the mind needing a doctor of the mind to step in, also called mental illness
  and psychopathy, not a passing low mood and not a sickness of the body.
examples:
- His mental disease left him unable to work, and his family sought help from a doctor of the mind.
- The court heard that mental disease, not drink, lay behind his strange behaviour.
