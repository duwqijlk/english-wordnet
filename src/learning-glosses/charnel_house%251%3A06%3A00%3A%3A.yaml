simpleMeaning: a vault or a building where dead bodies or bones are put and kept
scope: 'Also called charnel: a place where dead bodies or bones are kept, not a grave in the ground and
  not a room for a funeral.'
examples:
- The old charnel house stood beside the church, full of bones.
- Workers moved the bones to the charnel house after the grave was cleared.
