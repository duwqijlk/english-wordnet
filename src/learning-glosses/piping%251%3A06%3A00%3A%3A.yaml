simpleMeaning: A way to move water, oil, gas, and like things along, using long metal or plastic tubes
scope: A long hollow tube that carries water, oil, or gas, with pipe as another name for this sense, not
  a thin cord sewn along a hem.
examples:
- The plumber fitted new piping under the sink.
- Gas piping runs through the wall to the cooker.
