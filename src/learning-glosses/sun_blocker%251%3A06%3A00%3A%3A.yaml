simpleMeaning: A cream you rub on the skin, with a chemical in it, such as PABA, that keeps out the strong
  rays that burn the skin.
scope: A cream rubbed on the skin to keep out rays that burn it; also called sunscreen and sunblock; not
  a cream that heals a burn and not a hat worn for shade.
examples:
- She put sun blocker on her shoulders before going out.
- Use sun blocker to keep your skin from burning.
