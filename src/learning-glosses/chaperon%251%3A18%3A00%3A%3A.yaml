simpleMeaning: a person who goes with and watches over a young woman or an event where young people come
  together
scope: 'Also called chaperone: a person who goes with and watches over young people, not the verb sense
  of doing this work.'
examples:
- A chaperon stayed with the young women at the dance.
- The school sent a chaperon with the group of young people on the trip.
