simpleMeaning: not hard to do or understand and needing little work.
scope: It is not about feeling calm or comfortable, and not the command to slow down; it describes work
  or a problem that is not hard.
examples:
- The test was easy, so I finished in ten minutes.
- This recipe is easy enough for a child to follow.
