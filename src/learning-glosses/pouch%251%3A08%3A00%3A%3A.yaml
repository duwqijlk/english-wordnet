simpleMeaning: In anatomy, a bag-like part of the body in some animals, such as a marsupial, a gopher
  or a pelican
scope: 'Also called pocket: a bag-like body part in some animals, not a small bag for carrying things
  and not swelling outwards.'
examples:
- A kangaroo keeps its baby safe in its pouch.
- The pelican holds fish in the large pouch under its bill.
