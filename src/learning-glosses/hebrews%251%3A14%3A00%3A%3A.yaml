simpleMeaning: The people claiming descent from Abraham and Isaac, above all from Isaac's son Jacob, the
  nation God chose for his teaching and covenant, as told in Exodus 19.
scope: Also called Israelites; the people of Abraham and Jacob in the Bible, not the Jews of a later age.
examples:
- The Hebrews left Egypt under Moses.
- God made a covenant with the Hebrews.
