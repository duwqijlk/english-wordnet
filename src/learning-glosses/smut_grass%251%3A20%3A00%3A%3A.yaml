simpleMeaning: In the south of the United States it is common now, a plant from the West Indies whose
  thin stiff stems grow in bunches and often carry a dark fungus
scope: It is also called blackseed and carpet grass, a plant from the West Indies now common in the south
  of the United States.
examples:
- The smut grass had dark fungus on its thin stems.
- Smut grass grew in thick bunches by the fence.
