simpleMeaning: A blue-green herb with sticky stems and bunches of big white blooms that open at night,
  their cups much swollen, sometimes put in the genus Lychnis.
scope: This sense is also called evening lychnis, white campion, and white cockle, a blue-green herb with
  sticky stems and bunches of big white blooms that open at night, their cups much swollen, sometimes
  put in the genus Lychnis, unlike the sense for a long-lived plant of Arctic Europe having large white
  flowers with inflated calyx.
examples:
- Bladder campion blooms open at night.
- The bladder campion has sticky stems.
