senseId: 'restrainer%1:27:00::'
synsetId: 15029441-n
simpleMeaning: a chemical put into the liquid used to bring out a photo, to slow the work down and cut
  down the grey haze on the film
scope: A chemical added to the liquid used to bring out a photo, not a chemical that starts the work and
  not a cleaner for film.
examples:
- The darkroom worker added a restrainer to the developer to slow the process down.
- A restrainer cut down the grey haze on the film.
