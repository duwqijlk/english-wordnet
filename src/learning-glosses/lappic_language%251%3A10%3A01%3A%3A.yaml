simpleMeaning: One of the ways of speaking used by the Lapp people, generally held to be part of the Uralic
  family of tongues
scope: One of the Lapp ways of speaking, also called Lappic, Lappish and Lappish language; not the Lapp
  people themselves and not one single tongue, since it covers several.
examples:
- Lappic language is one of the tongues of the far north.
- He spoke Lappic language with his grandmother.
