simpleMeaning: To do with the queen of England called Elizabeth the First, or with the years when she
  ruled
scope: This word says a thing belongs to the time of the queen called Elizabeth the First; its nearest
  rival is the noun for a person who lived in her time.
examples:
- Elizabethan music filled the great hall.
- The play was set in Elizabethan times.
