simpleMeaning: to work out or show the place or edges of something, as if with a tool or by measuring
  the land
scope: 'Also called situate: to work out or show a place or its edges, not to find a lost thing by looking
  for it, and not to give something a place.'
examples:
- Please locate the north edge of the land on this plan.
- The team located the site of the old house with a measuring tool.
