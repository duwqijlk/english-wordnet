simpleMeaning: The eye muscle whose pull turns the eyeball out to the side.
scope: The eye muscle whose pull turns the eyeball out to the side; abducens muscle and lateral rectus
  muscle are other names for this sense, not a muscle that turns the eye inward, and not a muscle that
  lifts the eye.
examples:
- The lateral rectus turns the eye outward.
- Damage to the lateral rectus makes it hard to look to the side.
