simpleMeaning: Picked for scent and to give tea flavour, the nice-smelling white, yellow, or red blooms
  grow on this climbing jasmine, which drops its leaves each year.
scope: Also called common jasmine and jessamine, this climbing shrub loses its leaves each year and bears
  nice-smelling white, yellow, or red blooms used for scent and for tea.
examples:
- The true jasmine filled the air with its nice smell.
- Tea made with true jasmine tastes of flowers.
