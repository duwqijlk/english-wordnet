simpleMeaning: A fat-like substance in animal and plant tissue, made of three fatty acids joined in one
  large molecule; a key energy source, forming much stored body fat.
scope: Found in animal and vegetable tissue, where it stores energy as body fat.
examples:
- Triglyceride stores energy in the body.
- Triglycerides form much body fat.
