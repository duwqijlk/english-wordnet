senseId: 'electromyograph%1:06:00::'
synsetId: 03281750-n
simpleMeaning: A medical tool that records the electric signals made when the muscles attached to bones
  work.
scope: A medical tool for recording muscle signals, not a heart monitor and not a brain scanner.
examples:
- The doctor used an electromyograph to check the muscle in her arm.
- An electromyograph recorded the signals as he bent his knee.
