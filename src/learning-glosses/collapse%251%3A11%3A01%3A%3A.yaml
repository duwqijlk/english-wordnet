simpleMeaning: A sudden big fall in trade or in the prices of shares, especially one that leads to more
  businesses failing
scope: This sense, also called crash, is a sudden fall in trade or share prices, not a person falling
  down from illness or a building falling in.
examples:
- The collapse of the bank led many small firms to close.
- A stock market collapse wiped out his savings in one day.
