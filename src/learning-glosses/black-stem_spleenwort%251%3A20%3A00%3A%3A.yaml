simpleMeaning: From the south of the United States to the West Indies and from Mexico to Brazil ranges
  this fern of warm America.
scope: This fern of warm America ranges from the south of the United States to Brazil, and black-stemmed
  spleenwort and little ebony spleenwort are other names for this sense.
examples:
- The black-stem spleenwort grows in warm America from Mexico to Brazil.
- A black-stem spleenwort grew in the south of the United States.
