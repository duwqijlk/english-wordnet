simpleMeaning: Young thread-making cells make up the tough stuff in new marks, and strong fibres in old
  ones, where skin has healed.
scope: The tough stuff that forms where skin has healed, not healthy skin and not a fresh cut.
examples:
- Scar tissue formed where the cut had healed.
- Old scar tissue is made of strong collagen fibers.
