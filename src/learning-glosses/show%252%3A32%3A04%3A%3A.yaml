simpleMeaning: To give a particular measurement on a dial, screen or other instrument.
scope: This is not pointing out a place or person and not leading someone to a seat; it is only what an
  instrument displays.
examples:
- The thermometer showed thirty degrees at noon.
- The fuel gauge showed nearly empty.
