simpleMeaning: From coal tar comes a clear oily chemical that goes into man-made resins
scope: A clear oily chemical from coal tar used to make man-made resins; also called benzofuran and coumarone,
  not a resin itself.
examples:
- The lab tested the cumarone taken from coal tar.
- Cumarone goes into the resins used for the new varnish.
