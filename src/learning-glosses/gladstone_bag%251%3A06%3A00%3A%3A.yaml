simpleMeaning: People carry this big case when they travel, and it is made of hard leather.
scope: Also called portmanteau and Gladstone; a big stiff-leather case for travel, not a small handbag
  and not a soft cloth bag.
examples:
- He packed his Gladstone bag for the long train journey.
- The old Gladstone bag stood by the door, full of books.
