simpleMeaning: to write by hand with letters that stand apart and are not joined, as letters look in a
  book
scope: Writing by hand with letters that do not join; not making copies on paper, and not a picture on
  paper.
examples:
- Please print your name clearly at the top of the page.
- The child printed each letter on its own, without joining them.
