simpleMeaning: an amount by which a thing may differ, giving some room to move within set limits
scope: 'Also called a margin, and another name for it is tolerance: an amount by which a thing may differ,
  not money paid to a person and not the act of letting something happen.'
examples:
- The parts were made with an allowance of a few millimetres.
- Builders left an allowance for the wood to swell in the damp.
