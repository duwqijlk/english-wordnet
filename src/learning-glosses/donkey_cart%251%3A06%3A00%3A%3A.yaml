simpleMeaning: a vehicle with a low axle hung under its body and two seats
scope: A vehicle with a low axle and two seats, also called a pony cart or a ponycart, and not a wagon
  pulled by horses and not a vehicle with only one seat.
examples:
- The farmer hitched the donkey to the donkey cart and drove to market.
- Two children sat side by side in the donkey cart.
