simpleMeaning: A showy plant with large flat leaves marked with reddish-purple bars and flowers with a
  bunch of long yellow stamens in a coral-red cup of fleshy bracts, from South Africa.
scope: Also called Cape tulip; a showy South African plant, not a true tulip.
