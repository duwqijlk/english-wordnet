simpleMeaning: In electronics, the middle element of a transistor, lying between the emitter and the collector
  and keeping them apart.
scope: This is the middle part inside a transistor, not a support or foundation or the lowest support
  of a structure, not the bottom or lowest part of a thing, not the flat underside on which an object
  sits, not the lower side of a geometric figure, not a lower limit, not the basic assumptions something
  is developed from, not the most important or necessary part of something, not the attachment end of
  an organ, not a military installation or the place a mission starts from, not a baseball runner's station,
  not a word's root form, not a DNA or RNA unit, not a chemical alkali, not the number a counting system
  is built on, not a country's stock of facilities and equipment, not the main ingredient of a mixture,
  not the verb uses meaning to found something on, to set up a center of operations, or to smoke cocaine,
  and not the adjective senses meaning forming a foundation, of low birth, of inferior metal, morally
  bad, dishonorable, illegitimate, or fake.
examples:
- He measured the voltage between the base and the emitter.
- A small current into the base controls the larger current from the emitter to the collector.
