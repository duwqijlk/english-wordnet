simpleMeaning: one of a pair of flat, three-sided bands of flesh in the shoulder and upper back that help
  move the shoulders and arms
scope: One of a pair of flat three-sided bands of flesh in the shoulder and upper back that help move
  the shoulders and arms; trapezius and musculus trapezius are other names for this sense, and it is not
  the flesh of the chest or leg.
examples:
- He hurt his cowl muscle lifting the heavy box.
- The cowl muscle helps you shrug your shoulders.
