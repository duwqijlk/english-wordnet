simpleMeaning: From the early age of the great lizards comes this huge plant-eater, walking on two legs
  with a long heavy tail, often found in Europe and northern Africa.
scope: From the early age of the great lizards, this huge plant-eater walked on two legs, not a meat-eater
  and not a four-legged animal.
examples:
- The iguanodon skeleton showed a long heavy tail and two back legs.
- Children pointed at the iguanodon and its long heavy tail.
