simpleMeaning: In northern Europe this tough one-season cereal grass is grown for grain that becomes dark
  bread; North American farmers grow it as animal feed and to enrich the soil.
scope: The rye plant itself, not its seed sold as grain nor the whiskey distilled from it.
examples:
- Rye stands taller than wheat and keeps growing through cold springs.
- A field of rye rippled green and gold before the harvest.
