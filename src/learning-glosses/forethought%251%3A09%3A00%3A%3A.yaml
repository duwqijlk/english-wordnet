simpleMeaning: careful thought that shows good sense and keeps a person away from harm or danger
scope: 'Also called care, caution, and precaution: careful thought that keeps a person away from harm
  or danger, not a lack of care or acting without thought.'
examples:
- He showed forethought by wearing a helmet before riding his bike.
- With forethought, she locked the gate so the children could not reach the pool.
