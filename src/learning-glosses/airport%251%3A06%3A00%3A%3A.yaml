simpleMeaning: A place where planes take off and land, with a control tower, buildings where planes are
  kept, and facilities for passengers and goods.
scope: This sense is not just a simple landing strip, but a full facility with a control tower, plane
  storage buildings, and passenger and cargo services.
examples:
- We arrived at the airport two hours before our flight.
- The airport has a new terminal for international passengers.
