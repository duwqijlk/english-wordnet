simpleMeaning: That gives a bad feeling and makes a person feel hurt, upset, or sad
scope: A word for something that gives a bad feeling and makes a person feel hurt or sad, not for something
  that is only hard to do.
examples:
- The unpleasant smell from the bin made us open the windows.
- She had an unpleasant talk with her boss and felt sad all day.
