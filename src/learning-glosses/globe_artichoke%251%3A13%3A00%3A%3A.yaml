simpleMeaning: a flower head like a thistle, with thick leaves and a middle part, all of which people
  eat
scope: A thistle-like flower head with thick leaves and a middle part, all of which people eat, also called
  artichoke, not the plant itself and not a flower grown only for show.
examples:
- She cut a globe artichoke from the garden for dinner.
- The globe artichoke was served with butter.
