simpleMeaning: A nose illness that comes back in one season each year, when flower dust sets off a bad
  reaction in the nose.
scope: A nose illness that comes back each year in pollen season, not a cold and not a flu.
examples:
- His hay fever starts every spring when the grass flowers.
- She takes pills for her hay fever when the pollen count is high.
