simpleMeaning: The United States body that plans and runs special work with secret codes to guard American
  computer systems and to gather secret news from abroad.
scope: This is the United States body that plans and runs special work with secret codes to guard American
  computer systems and to gather secret news from abroad, also called the National Security Agency; not
  other United States spy bodies and not the armed forces.
examples:
- The NSA guards American computer systems.
- The NSA gathers secret news from abroad.
