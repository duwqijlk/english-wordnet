simpleMeaning: A group of Christians in the Middle East who followed the teaching of Nestorius; a small
  group of them still meets in Iraq.
scope: This is the Middle Eastern church that followed Nestorius, not the Eastern Orthodox church and
  not the Roman Catholic church; a small group still meets in Iraq.
examples:
- The Nestorian Church spread across the Middle East in early times.
- A small Nestorian Church still meets in Iraq today.
