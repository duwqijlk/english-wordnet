synsetId: 07272250-n
simpleMeaning: A tall pole carries this cloth tube, its end cut off, and the tube turns with the air to
  show which way it blows, such as at airports.
scope: This sleeve is also called a sock, a drogue, a windsock, an air-sleeve, an air sock, a wind cone,
  and a wind sock.
examples:
- The wind sleeve hung from the mast and pointed east.
- The wind sleeve showed the wind was blowing from the north.
