simpleMeaning: in a way that people find pleasing and like
scope: Done in a way people like, not in a way that begs for help and not in an ugly or dull way.
examples:
- The table was set appealingly, with flowers and clean plates.
- She sang appealingly, and everyone wanted to hear more.
