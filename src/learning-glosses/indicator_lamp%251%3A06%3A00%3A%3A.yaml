simpleMeaning: A light that shows whether the power is on or a motor is running
scope: A light that shows whether power is on, also called a pilot lamp or a pilot light; not a lamp that
  lights a room and not a switch that turns power on.
examples:
- The indicator lamp on the panel glowed green when the motor started.
- If the indicator lamp is dark, the power is off.
