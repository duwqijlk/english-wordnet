simpleMeaning: In a signal sent out by radio or television, the part you hear rather than see.
scope: 'Also called sound: the part of a sent-out signal that you hear, not a recording of sounds and
  not a sound wave itself.'
examples:
- The audio dropped out during the news.
- Turn up the audio so we can hear the speaker.
