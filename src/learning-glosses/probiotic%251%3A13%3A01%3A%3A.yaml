senseId: 'probiotic%1:13:01::'
synsetId: 92466619-n
simpleMeaning: A food extra with live germs in it, usually taken after a course of drugs that kill germs,
  to put back the good germs in the gut.
scope: A food extra with live germs, taken after germ-killing drugs, not the good germ itself that lives
  in the gut.
examples:
- She took a probiotic after her course of antibiotics.
- The doctor gave him a probiotic to settle his stomach.
