simpleMeaning: A low stringed instrument of the viol family, with about the same range of notes as the
  cello.
scope: This is a low stringed instrument of the viol family, also called a bass viol; not a cello, which
  is played in the same range but is a different kind of instrument, and not a violin.
examples:
- She played the gamba in the early music group.
- The gamba sounds lower than the violin.
