simpleMeaning: Blood tubes that carry blood away from the front walls of the belly.
scope: Blood tubes that carry blood away from the front walls of the belly, not tubes that feed the belly
  walls and not tubes that serve the back of the belly.
examples:
- The epigastric vein carries blood away from the belly wall.
- Epigastric veins drain the front of the belly.
