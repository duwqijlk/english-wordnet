simpleMeaning: a traveller who visits a place to look at the interesting things there
scope: 'Also called tripper, excursionist and rubberneck: a person who visits a place to see the interesting
  things there, not someone who lives in that place.'
examples:
- Sightseers filled the old town square, taking photos of the castle.
- The bus dropped the sightseers near the famous tower.
