simpleMeaning: A small South American shrub kept in the house for its many pretty red or yellow fruit,
  each small, round and poisonous.
scope: 'Also called winter cherry, Madeira winter cherry and Solanum pseudocapsicum: a small South American
  shrub kept in the house for its many pretty red or yellow fruit, each small, round and poisonous; other
  house shrubs have fruit that is safe to eat or of other colours.'
examples:
- Jerusalem cherry is kept in the house for its pretty red fruit.
- Do not eat the fruit of Jerusalem cherry; it is poisonous.
