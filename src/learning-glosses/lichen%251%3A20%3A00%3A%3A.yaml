simpleMeaning: any plant with no true roots, stems, or leaves, that grows in crusty patches or bushy tufts
  on tree trunks, rocks, bare ground, and other such places
scope: A plant that grows in crusty patches or bushy tufts on trunks, rocks, or bare ground, not a skin
  disease with hard thick spots.
examples:
- Lichen covered the old stone wall in grey-green patches.
- The lichen on the tree trunk felt dry and crusty to the touch.
