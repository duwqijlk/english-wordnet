simpleMeaning: A Ugric way of speaking, related to Hungarian, used by the people it is named for.
scope: Also called Khanty, Khanty language, and Ostyak, this is a Ugric way of speaking related to Hungarian,
  used by the people it is named for; other Ugric ways of speaking are used by other peoples.
examples:
- He speaks the Ostyak language at home.
- The Ostyak language is related to Hungarian.
