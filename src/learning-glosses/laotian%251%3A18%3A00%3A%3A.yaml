simpleMeaning: A member of a Buddhist people living by the Mekong River in Laos and Thailand and speaking
  the Lao tongue; they are kin to the Thais.
scope: A member of a Buddhist people of the Mekong River in Laos and Thailand, also called Lao; its near
  kin are the Thais, and the Lao tongue of the same name is a different sense.
examples:
- The Laotian people live in Laos and Thailand.
- A Laotian woman spoke the Lao language.
