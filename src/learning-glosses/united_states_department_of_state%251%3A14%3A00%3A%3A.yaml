simpleMeaning: The part of that country's government in the United States that makes and keeps the rules
  for dealing with other countries.
scope: Also called State, the Department of State, or the State Department; the US federal department
  responsible for foreign policy, not the Department of Defense.
examples:
- The United States Department of State makes the rules for dealing with other countries.
- The United States Department of State was created in seventeen eighty-nine.
