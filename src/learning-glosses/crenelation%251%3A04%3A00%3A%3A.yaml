simpleMeaning: The work of building walls with gaps in them, through which guns or arrows can be fired.
scope: Also called crenellation, the work of building walls with gaps for firing, not the walls themselves.
examples:
- Crenelation of the castle walls took many months.
- The men learned crenelation as part of building the fort.
