simpleMeaning: A measuring tool's pointer or pen moving away from the zero mark
scope: Also called deflexion. This is a pointer or pen moving from zero on a measuring tool, not a bent
  wave and not a strange way of judging or acting.
examples:
- The deflection of the needle showed how strong the current was.
- A small deflection of the pen marked a change in pressure.
