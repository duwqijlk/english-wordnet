simpleMeaning: A fine powder or grains used to clean things by taking in what is bad; drunk mixed with
  water, it works against some poisons.
scope: A fine powder or grains that clean by taking in what is bad, also called activated charcoal; its
  nearest kin are other powders used to clean, such as baking soda and chalk.
examples:
- Activated carbon cleaned the water by taking in the bad taste.
- The nurse gave him activated carbon mixed with water after he swallowed poison.
