simpleMeaning: In the ideas of Jean Piaget, fitting a single case into a general pattern one already holds.
scope: In the ideas of Jean Piaget, fitting a single case into a general pattern one already holds, not
  the taking in of food after eating, not the taking in of new ideas into what one already knows, and
  not people coming to see themselves as part of one nation.
examples:
- Assimilation, in Piaget's ideas, is fitting a new case into a pattern the child already holds.
- The child showed assimilation when she used her old pattern for the new toy.
