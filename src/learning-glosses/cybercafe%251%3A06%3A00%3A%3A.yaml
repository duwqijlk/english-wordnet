simpleMeaning: a place to eat and drink where people sit at computers and go on the internet
scope: A cafe where people use computers to go on the internet while they eat and drink, not a plain cafe
  and not a computer shop.
examples:
- We met at the cybercafe and checked our email over coffee.
- The cybercafe was full of students using the computers while they ate lunch.
