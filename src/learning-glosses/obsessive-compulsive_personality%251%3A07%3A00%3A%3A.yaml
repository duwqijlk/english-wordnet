simpleMeaning: A way of being marked by a strong need to do the same acts or set ways of doing things
  over and over
scope: A way of being marked by a strong need to do the same acts or set ways of doing things over and
  over; not a passing habit, and not a wish to keep things neat.
examples:
- His obsessive-compulsive personality made him check the lock ten times.
- An obsessive-compulsive personality often means repeating the same acts.
