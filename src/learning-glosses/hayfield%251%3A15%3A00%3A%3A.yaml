simpleMeaning: Land with grass over all or most of it, used for growing grass or alfalfa (a plant grown
  for animal food) for making hay
scope: 'Also called meadow: a grass field where grass is grown to make hay; not a field for other farm
  plants.'
examples:
- The farmer cut the grass in the hayfield in late summer.
- Alfalfa grew thick in the hayfield, ready to be cut and made into hay.
