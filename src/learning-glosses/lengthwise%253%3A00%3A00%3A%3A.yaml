simpleMeaning: going in the longest direction of a thing
scope: Lengthways is another name for this sense; this describes a thing or line going in its longest
  direction, not the adverb use that tells how a thing is placed or cut.
examples:
- She made a lengthwise cut along the sheet of paper.
- The lengthwise edge of the board is much longer than the short edge.
