simpleMeaning: A small glass that makes things look bigger, often set in a cup that fits round the eye,
  and used by people who work with jewels or clocks
scope: A small glass that makes things look bigger, also called a loupe; not a pair of glasses and not
  a big lens on a stand.
examples:
- The jeweler held the jeweler's loupe to his eye to check the stone.
- She looked through a jeweler's loupe at the tiny marks on the ring.
