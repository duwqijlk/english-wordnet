simpleMeaning: Blinking or winking again and again, above all when it cannot be held back and will not
  stop
scope: Blinking or winking again and again, above all when it cannot be held back and will not stop; not
  a single blink and not a wink meant as a signal.
examples:
- His palpebration grew worse when he was tired.
- The doctor noted the patient's palpebration during the exam.
