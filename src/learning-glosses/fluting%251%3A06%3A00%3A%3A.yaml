simpleMeaning: a long, narrow hollow line cut or made in cloth or other things, in particular a shallow
  line that curves in on the tall part of a column
scope: 'Also called flute: this is a shallow hollow line in cloth or on a column, not the long pipe a
  person plays for music.'
examples:
- The fluting on the old stone column is still clear to see.
- She liked the fine fluting worked into the edge of the cloth.
