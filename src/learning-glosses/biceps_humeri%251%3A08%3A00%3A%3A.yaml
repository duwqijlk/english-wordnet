simpleMeaning: a muscle of the upper arm that bends the lower arm and turns the palm to face up
scope: 'Also called biceps brachii and musculus biceps brachii: a muscle of the upper arm that bends the
  lower arm and turns the palm to face up, not the muscle at the back of the upper arm and not a muscle
  of the leg.'
examples:
- The doctor pressed on her biceps humeri to test its strength.
- His biceps humeri ached after the workout.
