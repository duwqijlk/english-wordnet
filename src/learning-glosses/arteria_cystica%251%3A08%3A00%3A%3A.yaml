simpleMeaning: The gall bladder and the outside of the liver are fed by a side tube off the blood tube
  of the liver
scope: This side tube off the blood tube of the liver is also called the cystic artery.
examples:
- The arteria cystica carries blood to the gall bladder.
- The arteria cystica branches off the blood tube of the liver.
