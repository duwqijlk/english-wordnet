simpleMeaning: A tree of the Tasmanian mountains that stays green all year, with sharp leaves that bend
  inwards.
scope: A Tasmanian mountain evergreen with sharp leaves that bend inwards, also called Athrotaxis selaginoides;
  its near kin are other Tasmanian evergreens of the high mountains.
examples:
- The King William pine grows in the Tasmanian mountains.
- King William pine leaves curve inward at the tips.
