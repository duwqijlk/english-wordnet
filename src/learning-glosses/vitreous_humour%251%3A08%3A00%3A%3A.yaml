simpleMeaning: A jelly with no colour of its own, clear right through, lies at the back of the eyeball
  and fills the back part.
scope: Also called vitreous body and vitreous humor, it is the clear jelly at the back of the eyeball,
  with no colour of its own.
examples:
- The vitreous humour lets light pass through to the back of the eye.
- The vitreous humour is clear, so light passes through it to the back of the eye.
