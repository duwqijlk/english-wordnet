simpleMeaning: 'Buy shares in a firm facing a takeover and sell shares in its would-be buyer together:
  gain if the deal goes through, lose a lot if it fails.'
scope: Also called takeover arbitrage, this is the buying and selling of shares around a takeover, where
  the buyer stands to gain if the deal goes through and lose a lot if it fails.
examples:
- Investors made money from risk arbitrage when the takeover went through.
- Investors lost a great deal on risk arbitrage after the takeover failed.
