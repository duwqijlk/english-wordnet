simpleMeaning: made while the cords in your throat shake as you speak, giving the sound a hum
scope: 'Also called soft: a speech sound made with the throat cords shaking, not a sound made without
  them.'
examples:
- The sounds b, g, and z are voiced, and you can feel your throat hum as you say them.
- Put your hand on your throat and say a voiced sound to feel it shake.
