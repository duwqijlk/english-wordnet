simpleMeaning: A government says these notes and coins must be taken as payment, although they cannot
  be changed for gold or silver
scope: Notes and coins a government says must be taken as payment, not gold or silver coins and not a
  promise to pay later.
examples:
- Fiat money has no gold behind it.
- The shop must take fiat money as payment.
