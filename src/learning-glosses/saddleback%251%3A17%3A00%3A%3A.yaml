simpleMeaning: a pass or a high part of land that slopes gently between two peaks and dips in the middle
scope: 'Also called a saddle: a pass or high part of land dipping between two peaks, not a steep cliff
  and not a flat plain.'
examples:
- We crossed the saddleback between the two peaks.
- The saddleback dipped gently between the mountains.
