simpleMeaning: A lens tool with one or more lenses, used by people who work with jewels, to see small
  marks not clear to the eye alone.
scope: A lens tool used by people who work with jewels, not a large telescope and not a lens for reading.
examples:
- The jeweler's glass showed a tiny flaw in the stone.
- She peered through the jeweler's glass at the ring.
