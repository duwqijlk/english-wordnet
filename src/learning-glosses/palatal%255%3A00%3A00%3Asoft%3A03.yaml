simpleMeaning: Made with the tongue tip near or on the hard roof, as 'y', or with the tongue blade near
  the hard roof, as 'ch' in 'chin' or 'j' in 'gin'.
scope: This sense is also called palatalised and palatalized, for a sound made with the tongue tip near
  or on the hard roof, as 'y', or with the tongue blade near the hard roof, as 'ch' in 'chin' or 'j' in
  'gin'.
examples:
- The sound was palatal, made with the tongue tip.
- The 'y' was palatal, made at the hard roof.
