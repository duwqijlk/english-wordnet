simpleMeaning: a place where harmful waste has been dumped and the Environmental Protection Agency has
  said it must be cleaned up
scope: A place where harmful waste has been dumped and the Environmental Protection Agency has said it
  must be cleaned up; toxic waste area is another name for this sense. Not a clean park and not a place
  for fresh rubbish.
examples:
- The old factory is now a toxic site.
- Workers in protective suits began clearing the toxic site.
