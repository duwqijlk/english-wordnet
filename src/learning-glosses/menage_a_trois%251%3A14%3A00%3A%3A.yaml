simpleMeaning: 'A home for three people: a married pair and a lover of one of them, living together and
  sharing sex'
scope: A home shared by a married pair and a lover of one of them; not a home shared by three friends
  and not a marriage of three people.
examples:
- The menage a trois shocked the village.
- They lived in a menage a trois for years.
