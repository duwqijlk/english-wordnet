simpleMeaning: A low plant that covers the ground, common in the Philippines, and grown in the United
  States too.
scope: Also called Manila grass and Zoysia matrella, this is a low plant that covers the ground, common
  in the Philippines and grown in the United States too, not a tall plant and not a plant of another land.
examples:
- The Japanese carpet grass covered the lawn in the Philippines.
- We planted Japanese carpet grass because it grows well in the United States too.
