simpleMeaning: A weapon that soldiers on foot can carry, which fires small rockets and is used to hit
  and break tanks
scope: This is a weapon carried by a soldier on foot that fires rockets at tanks. It is not a large gun
  fixed in place and not a tank itself.
examples:
- The soldier fired the bazooka at the tank.
- He carried a bazooka on his shoulder through the field.
