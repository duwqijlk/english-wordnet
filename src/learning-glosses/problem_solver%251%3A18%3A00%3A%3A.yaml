simpleMeaning: a person who thinks hard about a question as it is put and puts facts and what they know
  together to find an answer
scope: 'Also called solver or convergent thinker: a person who works on a question as stated to find an
  answer, not someone who changes the question and not someone who only talks about it.'
examples:
- Our team needs a good problem solver for this hard task.
- She is a problem solver who never gives up until she finds an answer.
