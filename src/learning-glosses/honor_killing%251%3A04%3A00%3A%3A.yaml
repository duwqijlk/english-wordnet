simpleMeaning: An old custom, still seen at times, in which a man of the family puts a woman of the family
  to death for shaming the family name
scope: An old custom, still seen at times, in which a man of the family puts a woman relative to death
  for shaming the family name; not a killing in war, and not a killing done in anger on the spot.
examples:
- The honor killing was carried out by her own brother.
- An honor killing is still sometimes observed in some places.
