simpleMeaning: In Christianity, a feast marking Christ rising into heaven, kept forty days after Easter
scope: This is the Christian feast of Christ rising into heaven, not Easter itself; Ascension and Ascension
  Day are other names for this sense.
examples:
- Ascension of the Lord falls forty days after Easter.
- We went to church on Ascension of the Lord.
