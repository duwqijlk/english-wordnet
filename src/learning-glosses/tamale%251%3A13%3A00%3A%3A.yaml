simpleMeaning: Dough filled with a mix of meat. It is sometimes wrapped in corn husks (the outer covering
  of corn) and it is cooked in steam.
scope: This is a food made of dough and meat, also called tamal, not a sweet cake and not a plain piece
  of bread.
examples:
- She cooked a tamale wrapped in corn husks in steam.
- For lunch, he ate a hot tamale filled with meat.
