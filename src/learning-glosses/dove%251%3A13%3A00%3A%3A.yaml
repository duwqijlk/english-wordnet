simpleMeaning: meat from a pigeon, for roasting or cooking slowly in a little liquid; meat from a young
  one of the same kind may be cooked under strong direct heat
scope: This is meat for cooking, not the living bird itself and not a person who wants talks rather than
  fighting between countries.
examples:
- They served roast dove for dinner.
- The menu offered dove cooked slowly in wine.
