simpleMeaning: A long-lasting, worsening lack of red blood in older folk, thought to come from too little
  intrinsic factor, a stomach substance that lets the body take in vitamin B12.
scope: This sense is also called malignant anemia, pernicious anaemia and pernicious anemia, for a long-lasting,
  worsening lack of red blood in older folk, thought to come from too little intrinsic factor, a stomach
  substance that lets the body take in vitamin B12.
examples:
- Malignant anaemia strikes older adults.
- Malignant anaemia comes from a lack of intrinsic factor.
