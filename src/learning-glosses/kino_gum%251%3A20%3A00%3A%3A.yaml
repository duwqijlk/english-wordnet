simpleMeaning: In healing and in making leather, people use a reddish or black gum from some trees of
  the Pterocarpus kind, and for other such uses too.
scope: This reddish or black gum comes from trees of the Pterocarpus kind, not from other warm-land plants,
  and is used in healing and in making leather.
examples:
- The medicine contained kino gum.
- Kino gum helped tan the leather.
