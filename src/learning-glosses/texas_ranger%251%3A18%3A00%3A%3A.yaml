simpleMeaning: A member of the road police of a south-western state; in earlier days a horse rider who
  kept order on the border lands.
scope: 'Also called Ranger: a member of the Texas state highway patrol, once a mounted lawman who kept
  order on the frontier.'
examples:
- The Texas Ranger stopped our car on the highway.
- A Texas Ranger once rode a horse to keep order on the frontier.
