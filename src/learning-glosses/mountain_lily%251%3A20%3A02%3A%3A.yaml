simpleMeaning: A plant of New Zealand that comes back year after year, with bright white flowers
scope: A plant of New Zealand with bright white flowers, not a garden lily and not a lily of another land.
examples:
- The mountain lily opened its white flowers in the spring.
- We saw a mountain lily with bright white flowers on our walk in New Zealand.
