simpleMeaning: Glass for making lenses that spreads light into colours only a little and bends light only
  a little
scope: A kind of glass for lenses that spreads and bends light only a little, also called crown glass
  and optical crown glass; not the kind that spreads and bends light a lot and not plain glass for windows.
examples:
- The lens was made of optical crown, which bends light only a little.
- Optical crown is used in lenses where light must not spread much.
