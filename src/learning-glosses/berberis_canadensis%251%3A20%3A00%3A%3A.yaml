simpleMeaning: A shrub of the east of North America, leafless in winter, whose leaves turn scarlet in
  autumn and which bears bunches of yellow flowers followed by shiny red egg-shaped berries.
scope: 'Also called American barberry: a shrub of the east of North America, leafless in winter, whose
  leaves turn scarlet in autumn, not a tall tree and not a shrub with white berries.'
examples:
- Berberis canadensis stood leafless through the winter months.
- In autumn the leaves of Berberis canadensis turned scarlet.
