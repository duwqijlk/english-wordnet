simpleMeaning: A car headlamp giving bright, centre-heavy light with no check on light aimed at other
  road users' eyes, fit only when alone, its glare blinding other drivers.
scope: This sense is also called driving beam headlamp, high beam headlamp, and main beam headlamp, for
  a car headlamp giving bright, centre-heavy light with no check on light aimed at other road users' eyes,
  fit only when alone, its glare blinding other drivers.
examples:
- The full beam headlamp lit the empty road.
- Full beam headlamps dazzled the driver ahead.
