simpleMeaning: In the Old Testament, the plant that caught fire yet was not burned up, from which God
  spoke to Moses
scope: In the Old Testament, the plant that caught fire yet was not burned up and from which God spoke
  to Moses, not a real shrub and not the plant whose leaves turn red in autumn.
examples:
- The burning bush is told of in the book of Exodus.
- Moses took off his shoes before the burning bush.
