simpleMeaning: Small dark fruit, bitter in the wild but good to eat when grown by people, hangs on this
  big tree of Europe and Asia.
scope: It is the tree people grow for its fruit, not one left wild with fruit too bitter to eat.
examples:
- Dark fruit hung from the sweet cherry.
- They ate the sweet cherries from the tree.
