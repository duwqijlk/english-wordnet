simpleMeaning: Any of several large sea fish with sharp teeth, caught for food and sport, in the Lutjanidae
  family (a group of related fish), found mainly in warm water near land
scope: This is the whole large warm-water fish, not the big turtle with strong jaws, not the Australian
  pink fish with blue spots, and not fish flesh eaten as food.
examples:
- He caught a snapper in the warm water near the shore.
- The boat came back with three large snappers.
