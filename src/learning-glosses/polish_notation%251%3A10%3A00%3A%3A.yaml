simpleMeaning: In maths, a way of writing without brackets, in which each sign for an action comes before
  the numbers it acts on
scope: Also called prefix notation and Lukasiewicz notation; not the usual way with brackets and not a
  code for secret writing.
examples:
- In Polish notation the sign comes before the numbers.
- Polish notation needs no brackets.
