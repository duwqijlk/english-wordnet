simpleMeaning: a way of making court decisions by following what judges decided in earlier court matters,
  not by following written rules
scope: 'Also called common law and precedent: a body of rules built on past court decisions, not a single
  written statute and not rules voted by a parliament.'
examples:
- Case law shaped how the court ruled in the new dispute.
- The lawyer studied case law before she took the matter to court.
