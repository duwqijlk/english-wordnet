simpleMeaning: a long edge of cold air along which short, sharp storms or storms with thunder are likely
  to form
scope: A long edge of cold air where short, sharp storms or storms with thunder are likely to form; not
  a single storm, and not a warm edge of air.
examples:
- A squall line moved in from the west, bringing heavy rain.
- The weather map showed a squall line stretching across the whole state.
