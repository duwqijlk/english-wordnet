simpleMeaning: can be noticed by the mind or by the senses
scope: Something that can be noticed by the mind or the senses, not something that cannot be noticed at
  all and not the act of noticing itself.
examples:
- There was a perceptible change in her voice when she heard the news.
- The sound was weak but still perceptible if you listened closely.
