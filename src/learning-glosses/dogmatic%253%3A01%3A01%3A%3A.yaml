simpleMeaning: about or like a set of beliefs that are taken as true and as something people must accept
scope: This means about a set of beliefs taken as true, not about a person who states ideas as true with
  no proof.
examples:
- The book gives a dogmatic account of the group's set of beliefs.
- The dogmatic rules came from the group's accepted code of beliefs.
