simpleMeaning: A deep sleep from which a person cannot be woken, that can come on when diabetes is not
  treated well enough
scope: Also called a diabetic coma, it is a deep sleep from which a person cannot be woken, that can come
  on when diabetes is not treated well enough, not an ordinary sleep and not a faint.
examples:
- Kussmaul's coma can develop when diabetes is not treated well.
- The patient fell into Kussmaul's coma.
