simpleMeaning: An East Indian fruit tree whose fruit is like the rambutan's but sweeter.
scope: An East Indian fruit tree, also called pulasan and pulasan tree; not the rambutan itself and not
  a tree grown for wood.
examples:
- The pulassan bears sweet fruit much like the rambutan.
- We planted a pulassan in the garden for its sweet fruit.
