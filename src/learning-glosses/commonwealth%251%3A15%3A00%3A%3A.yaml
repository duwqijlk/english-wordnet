simpleMeaning: Massachusetts, Pennsylvania, Virginia, and Kentucky, and the territory of Puerto Rico,
  all use this as their official name.
scope: The official name of four American states and Puerto Rico, not the world group of states joined
  in allegiance to a central power.
examples:
- Kentucky is a commonwealth, not a state in name.
- Puerto Rico is called a commonwealth of the United States.
