simpleMeaning: People talk to each other far away with this, as their voices travel on waves through the
  air, not through wires
scope: 'Also called a radiotelephone: a way to talk to people far away through the air, not a set for
  listening to broadcasts and not a phone joined by wires.'
examples:
- The sailors used a radiophone to call the shore from far out at sea.
- She picked up the radiophone and spoke to the base camp through the air.
