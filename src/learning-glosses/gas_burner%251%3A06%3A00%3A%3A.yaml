simpleMeaning: A fitting from which a burning fuel comes out of a small pipe to make a steady flame.
scope: This is a fitting from which a burning fuel comes out to make a steady flame, also called a gas
  jet; not an electric ring, and not a lamp that burns gas for light.
examples:
- She turned on the gas burner under the pot.
- The gas burner gave a steady blue flame.
