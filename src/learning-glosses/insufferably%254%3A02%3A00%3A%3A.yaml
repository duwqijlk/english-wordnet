simpleMeaning: In a way that shows too much pride in oneself, past what anyone can bear.
scope: In a way that shows too much pride, past what anyone can bear; not merely to a very great degree.
examples:
- He spoke insufferably, as if no one else in the room mattered.
- She insufferably dismissed every idea but her own.
