simpleMeaning: The mark of being spread or scattered.
scope: This sense is the mark of being spread or scattered, unlike the sense for, in physics, the course
  by which a substance moves from a place of high strength of that substance to a place of lower strength,
  and unlike the sense for the deed of scattering or spreading a thing.
examples:
- Diffusion is the mark of being spread.
- Diffusion scatters.
