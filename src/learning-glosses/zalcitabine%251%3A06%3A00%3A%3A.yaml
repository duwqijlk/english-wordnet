simpleMeaning: a drug that fights HIV by acting as a copy of a gene building block, blocking the virus
  from copying itself
scope: 'Also called dideoxycytosine: a drug that fights HIV, not a drug that cures a cold and not a vitamin.'
examples:
- The doctor gave him zalcitabine to fight the HIV infection.
- Zalcitabine blocks the virus from copying itself.
