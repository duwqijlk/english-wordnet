simpleMeaning: to judge how good a piece of work or a performance is, then give it a grade or rank
scope: Judging work or a performance and giving it a grade or rank, not publicly condemning someone as
  shameful, and not the noun senses naming a visible clue or a printed symbol; grade and score are other
  names for this sense.
examples:
- The teacher marked the essays over the weekend.
- She spent the evening marking exam papers.
