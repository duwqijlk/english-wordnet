simpleMeaning: Farmers sometimes grow this plant of Europe to feed farm animals or to feed the soil; it
  lives for years and has spotted flowers of purple and pink.
scope: Also called narrow-leaved everlasting pea, this is a plant of Europe with purple and pink flowers,
  not the Australian shrub of the same name.
examples:
- The flat pea in the field has purple and pink flowers.
- Farmers grow flat pea to feed the soil.
