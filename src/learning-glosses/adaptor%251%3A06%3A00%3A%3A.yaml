simpleMeaning: a thing that lets a tool or machine be used in a new way, or that lets two pieces of equipment
  fit and work together
scope: 'Also called adapter: this is a device that helps equipment fit or be used in a new way, not the
  act of changing something itself.'
examples:
- He used an adaptor to plug the old lamp into the new socket.
- The adaptor let the two machines work together.
