scope: This is an upright plant of the Old World grown above all for its large flat seeds that can be
  eaten; broad-bean, broad-bean plant, broad bean, field bean, European bean and Vicia faba are other
  names for this sense, and its nearest rivals are other kinds of bean plants.
examples:
- English bean is grown for its large flat seeds.
- The farmer grew English bean as fodder for the cattle.
