senseId: 'narrow_escape%1:04:00::'
synsetId: 00061834-n
simpleMeaning: By the smallest of gaps, a thing is won or got away from
scope: 'Also called a close call, a close shave, a squeak or a squeaker: a win or a get-away that only
  just happens, not a win by a wide gap and not a safe get-away with time to spare.'
examples:
- It was a narrow escape when he won the match by a single point.
- Her narrow escape from the fire left her shaken but safe.
