senseId: 'persuasion%1:09:00::'
synsetId: 05954491-n
simpleMeaning: What you think or believe, even when you have no proof and cannot be sure
scope: What you think or believe about something, even without proof, also called opinion, thought, view
  or sentiment; not words used to get someone to believe or do something.
examples:
- I am not of your persuasion on this matter.
- People of every persuasion came to the meeting.
