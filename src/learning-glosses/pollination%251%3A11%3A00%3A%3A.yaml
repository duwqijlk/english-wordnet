simpleMeaning: The carrying of pollen, the fine dust a flower makes, from the part that makes it to the
  part that takes it in.
scope: In flowers, the transfer of pollen from where it is made to where it is received.
examples:
- Bees help pollination by carrying pollen from flower to flower.
- Without pollination, the apple trees would bear no fruit.
