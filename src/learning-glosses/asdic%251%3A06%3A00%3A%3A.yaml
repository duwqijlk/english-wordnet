simpleMeaning: How far away things are under water is worked out by this tool, which sends a sound pulse
  and times its echo.
scope: A tool that finds how far away things are under water by sound, also called sonar and echo sounder.
examples:
- The asdic sent a pulse through the water and timed its echo.
- With the asdic, the crew worked out how far away the sea floor was.
