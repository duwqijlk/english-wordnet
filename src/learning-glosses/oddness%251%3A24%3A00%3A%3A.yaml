simpleMeaning: the fact that a number is odd, so it cannot be split evenly by two
scope: 'This is the maths sense: a number being odd, not even. It is not the common sense of something
  being strange or unlike others.'
examples:
- The oddness of 7 means it cannot be split evenly by two.
- He checked the oddness of each number before adding them.
