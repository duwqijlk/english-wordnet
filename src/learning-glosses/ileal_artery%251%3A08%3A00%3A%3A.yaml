senseId: 'ileal_artery%1:08:00::'
synsetId: 05354262-n
simpleMeaning: a blood vessel that branches off the main vessel to the gut and feeds the lowest part of
  the small bowel
scope: A branch of the main gut blood vessel that feeds the lowest part of the small bowel; arteria ilealis
  and intestinal artery are other names for this sense, not the main vessel itself and not a vein.
examples:
- The ileal artery carries blood to the lowest part of the small bowel.
- The surgeon tied off the ileal artery during the operation.
