simpleMeaning: A thing put forward to be taken up, as a suggested deal or an amount of money to pay
scope: Also called offer, this is a thing put forward as a suggested deal or an amount of money to pay,
  not money given to a religious group and not the act of saying you will give something.
examples:
- Their offering for the house was higher than the other bids.
- The new offerings for investors included several index funds.
