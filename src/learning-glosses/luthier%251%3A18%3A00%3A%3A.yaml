simpleMeaning: A skilled worker who builds instruments with strings, such as a lute, a violin, or a guitar.
scope: A maker of stringed instruments, not a player of them and not a maker of wind or brass instruments.
examples:
- The luthier spent weeks shaping the neck of a new violin.
- A skilled luthier can tell a good violin by its sound.
