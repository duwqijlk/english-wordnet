simpleMeaning: A dark substance shows in the urine and darkens the tissues in this rare condition, a fault
  in the body's chemistry passed on when both parents carry it
scope: Also called alkaptonuria, this is a rare condition passed on when both parents carry it, in which
  a dark substance shows in the urine and darkens the tissues.
examples:
- Alcaptonuria was found when the child's urine turned dark.
- Alcaptonuria darkened her skin and her urine.
