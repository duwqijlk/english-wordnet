simpleMeaning: A kind of animal of western North America that goes into the burrows of small gnawing animals
scope: A kind of animal of western North America that goes into the burrows of small gnawing animals,
  not the big dark-blue animal of southern North America and Mexico and not a rattlesnake.
examples:
- The gopher snake hunted in the rodent burrows of the west.
- A gopher snake of western North America is called a bull snake.
