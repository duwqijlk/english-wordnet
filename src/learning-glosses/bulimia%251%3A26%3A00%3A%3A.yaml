simpleMeaning: Hunger that cannot be filled and comes from sickness, especially from harm to the brain.
scope: Hunger from sickness that cannot be filled, not the eating disorder in which young women eat a
  great deal and then feel guilt, low spirits, and self-blame.
examples:
- Bulimia left him hungry no matter how much he ate.
- The doctor said the bulimia came from harm to the brain.
