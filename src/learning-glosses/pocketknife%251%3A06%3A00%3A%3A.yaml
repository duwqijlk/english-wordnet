simpleMeaning: a knife with a blade that folds into its handle, made small enough to carry in a pocket
scope: 'Also called pocket knife: a small knife with a folding blade that you carry in a pocket, not a
  large knife with a fixed blade and not a table knife.'
examples:
- He opened his pocketknife to cut the string.
- She folded the blade of her pocketknife and put it back in her pocket.
