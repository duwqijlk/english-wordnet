simpleMeaning: a small bottle that holds a drug, especially a sealed clean bottle with no germs, used
  for giving the drug with a needle
scope: 'Also called vial, ampule, ampoule, and ampul: a small bottle for a drug, not a large bottle for
  drinking and not a box for pills.'
examples:
- The doctor took a small phial of medicine from the box.
- Each phial holds one dose for a shot with a needle.
