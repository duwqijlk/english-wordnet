simpleMeaning: What a person owes falls by the share set for their pay band once the whole sum on which
  a charge is worked out has been cut.
scope: People also call it a deduction or a tax deduction, and it works by cutting the whole sum on which
  a charge is worked out.
examples:
- He claimed the new roof as a tax write-off.
- She listed the old van as a tax write-off.
