simpleMeaning: 'One of the largest bony fish: open-ocean swimmer with a round, flattened body, tall fins
  along its back and underside, and a rudder-like tail; found in warm seas worldwide.'
scope: Another name for the ocean sunfish, also called headfish or sunfish; not the small freshwater sunfish
  of North America.
examples:
- A mola can grow to more than three metres across.
- The mola floated on its side, looking like a giant grey disc.
