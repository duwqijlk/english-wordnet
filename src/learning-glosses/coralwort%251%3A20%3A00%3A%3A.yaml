simpleMeaning: a kind of cress that grows in Europe and has a white underground part with knots in it
scope: A kind of cress from Europe with a white underground part with knots in it, also called coral-root
  bittercress and coralroot; not a sea coral, and not a garden cress grown for food.
examples:
- Coralwort grows in damp woods in Europe.
- She found coralwort with a knotted white rootstock under the leaves.
