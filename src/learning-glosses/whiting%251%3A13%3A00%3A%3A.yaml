simpleMeaning: the flesh of any of a number of thin fish that people eat, especially fish from the Atlantic
  coasts of North America
scope: This is the flesh used as food, especially from fish on the Atlantic coasts of North America, not
  the whole live fish and not flesh from the same-named fish of European Atlantic waters.
examples:
- We ate grilled whiting for dinner.
- The shop sold fresh whiting caught off the North American coast.
