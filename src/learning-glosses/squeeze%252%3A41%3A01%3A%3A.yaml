simpleMeaning: make someone do something by physical means, moral pressure or clever argument, or by leaving
  them no choice
scope: Making someone do something under pressure, not getting something from them by threats and not
  a physical press with the hands; force, pressure, hale and coerce are other names for this sense.
examples:
- The union squeezed management into raising wages.
- Her debts squeezed her into selling the house.
