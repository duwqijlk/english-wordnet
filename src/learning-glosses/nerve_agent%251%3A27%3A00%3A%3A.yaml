simpleMeaning: A poisonous gas that is breathed in or taken in through the skin and harms the nervous
  system and the breathing parts of the body.
scope: A poisonous gas breathed in or taken in through the skin that harms the nervous system, also called
  nerve gas; not a tear gas and not a poison taken by mouth.
examples:
- The soldiers feared a nerve agent attack on the camp.
- A nerve agent can harm people who breathe it in.
