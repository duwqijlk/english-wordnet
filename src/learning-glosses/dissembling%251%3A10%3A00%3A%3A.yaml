synsetId: 06772060-n
simpleMeaning: pretending that something is true when it is not, done on purpose to fool other people
scope: Also called pretense, pretence and feigning, this is pretending on purpose to fool people, not
  a mistake and not acting in a play.
examples:
- His dissembling hid the fact that he had taken the money.
- She was tired of his dissembling and asked him to tell the truth.
