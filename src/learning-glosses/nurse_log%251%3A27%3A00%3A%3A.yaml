simpleMeaning: Rotting wood from a big fallen tree trunk, most times in a wood, gives water and food to
  many kinds of bugs and plants.
scope: This big fallen tree trunk lies in a wood, and its rotting wood feeds many kinds of bugs and plants,
  not a tree still standing.
examples:
- Plants grew on the nurse log, fed by its rotting wood.
- Insects lived in the nurse log.
