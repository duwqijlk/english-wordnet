simpleMeaning: A worried feeling, or something that gives you that feeling, or the look or words that
  show it
scope: 'Also called nervous, anxious, and uneasy: full of worry or showing worry, not the sick feeling
  in the stomach that comes before being sick.'
examples:
- He cast queasy glances behind him as he walked home in the dark.
- Those queasy moments before takeoff made her hands shake.
