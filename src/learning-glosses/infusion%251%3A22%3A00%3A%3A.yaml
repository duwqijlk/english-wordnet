senseId: 'infusion%1:22:00::'
synsetId: 13521226-n
simpleMeaning: the act of taking out the parts of something that have an effect, such as a drug from a
  plant, by leaving it in a liquid, usually water
scope: This is the act of soaking to get parts out, not the liquid you get from soaking and not adding
  a new, changing part to something.
examples:
- The infusion of the plant in water took out its healing drug.
- By a slow infusion, the workers got the drug out of the plant.
