scope: A plant of the onion kind that makes small bulbs in place of blooms, found in Russia and Iran;
  not a leek grown for its leaves and not garlic.
examples:
- The few-flowered leek grows wild in Iran.
- The few-flowered leek bore small bulbs where its blooms should have been.
