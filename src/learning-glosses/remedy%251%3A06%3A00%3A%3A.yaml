simpleMeaning: a drug or a way of treating a sick person that makes the person well or takes pain away
scope: This is a medicine or a way of treating a sick person, also called a cure, not the act of putting
  a mistake or a wrong thing right.
examples:
- Herbal tea was the only remedy that helped her cough.
- The doctor gave him a remedy for the pain.
