simpleMeaning: the work of feeding horses and keeping them in a stable (a building for horses), done for
  pay
scope: This is paid care of horses, with food and a place to stay, not a special uniform for male servants
  and drivers and not feeling ill because of your liver.
examples:
- The farm charged ten pounds a week for livery for each horse.
- He paid for full livery, so the stable fed and housed his horse.
