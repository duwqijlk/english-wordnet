simpleMeaning: not fine or smooth in style, and not showing good taste in the way a thing looks or is
  done
scope: It describes something that looks or is done in a rough way with bad taste, not something fine
  and smooth that is done with care.
examples:
- Her inelegant handwriting was hard to read.
- He made an inelegant bow and almost fell over.
