simpleMeaning: Of two rival ideas, pick the plainest one, and bring in no more things than you need.
scope: Also called the principle of parsimony, this guide tells you to pick the plainest of two rival
  ideas and bring in nothing extra.
examples:
- The law of parsimony led her to pick the plainest of the two rival ideas.
- By the law of parsimony, he left out the extra cause his idea did not need.
