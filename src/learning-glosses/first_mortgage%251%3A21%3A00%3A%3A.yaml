simpleMeaning: A loan on a house or land that must be paid before all other loans and claims on it, except
  loans and claims set by law.
scope: A loan on a house or land that must be paid before all other such loans and claims, except loans
  and claims set by law; not a later loan on the same house or land, and not a loan or claim set by law
  itself.
examples:
- The bank holds the first mortgage on our house.
- They paid off the first mortgage before taking a second loan.
