simpleMeaning: With only two rhymes, this French poem runs to ten or thirteen lines, and its first words
  come back as the last lines of the second and third parts
scope: Also called rondel, it runs to ten or thirteen lines on two rhymes, and its opening words come
  back as the refrain of the second and third parts.
examples:
- The rondeau had thirteen lines and only two rhymes.
- The rondeau opened with a line that came back twice more.
