simpleMeaning: exactly right for the time and place, in a way that stands out as well chosen
scope: 'Also called apt and also called apposite: exactly right for the time and place, not just closely
  linked to the subject being talked about.'
examples:
- She gave a pertinent reply that was exactly right for the moment.
- His pertinent remark fit the occasion so well that everyone noticed how well chosen it was.
