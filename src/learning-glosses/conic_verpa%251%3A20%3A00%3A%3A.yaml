simpleMeaning: A morel whose spore-bearing top is fairly smooth, on a stalk that breaks easily.
scope: This is a morel with a fairly smooth spore-bearing top and a stalk that breaks easily, also called
  Verpa conica; its smooth top and breakable stalk set it apart from other morels.
examples:
- The conic Verpa grows in the spring woods.
- A conic Verpa has a smooth top and a stalk that breaks easily.
