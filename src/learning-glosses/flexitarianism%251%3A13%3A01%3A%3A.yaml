senseId: 'flexitarianism%1:13:01::'
synsetId: 92438941-n
simpleMeaning: The way of eating mostly plant food, but at times eating meat or fish for social, useful,
  cultural, or health reasons
scope: This is the way of eating mostly plant food, but at times eating meat or fish for social, useful,
  cultural, or health reasons; semi-vegetarianism is another name for this sense, not eating only plant
  food and not eating meat at every meal.
examples:
- She follows flexitarianism, eating plant food most days but meat at family meals.
- He chose flexitarianism so he could eat fish now and then and plant food the rest of the time.
