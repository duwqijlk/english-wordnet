simpleMeaning: A widely grown American plant grown in tropical and warm regions, with showy yellow flowers
  on stalks that bend to the soil so that seed pods ripen underground.
scope: Also called peanut and peanut vine; a widely grown American plant whose seed pods ripen underground,
  not a bean plant with pods above ground and not a nut tree.
examples:
- Arachis hypogaea is grown in warm regions.
- The pods of Arachis hypogaea ripen underground.
