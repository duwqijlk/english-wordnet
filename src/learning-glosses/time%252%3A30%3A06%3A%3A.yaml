simpleMeaning: To set something so that a push or movement happens at the exact moment wanted.
scope: This is about setting a mechanism or movement to act at the right moment, not about measuring how
  long something takes.
examples:
- A mechanic times the engine so the spark fires at the right moment.
- She timed her kick to land just as the door swung open.
