simpleMeaning: A mains-powered fitting that holds a lamp in a socket, so the lamp can be taken out and
  put back, and gives off man-made glow.
scope: It is also called a light fitting or a luminaire, and its socket lets the lamp be taken out and
  put back.
examples:
- The light fixture above the sink went dark.
- They fitted a new light fixture in the hall.
