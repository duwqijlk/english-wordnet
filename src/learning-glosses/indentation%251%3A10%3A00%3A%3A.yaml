senseId: 'indentation%1:10:00::'
synsetId: 06401396-n
simpleMeaning: The empty space before the first word of a line that starts farther in from the edge of
  the page than the other lines
scope: This is the space at the start of a line, also called indenture, indent and indention; it is not
  the act of cutting into an edge, and not small pits in a surface.
examples:
- The indentation at the start of each new paragraph is five spaces wide.
- Leave a clear indentation before the first line of the next part.
