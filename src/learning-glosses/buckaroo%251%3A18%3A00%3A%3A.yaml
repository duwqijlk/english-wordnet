simpleMeaning: a local word for a cowboy, used above all in California, where 'vaquero' is the word used
  above all in southwestern and central Texas
scope: This is a local word for a cowboy, used above all in California; buckeroo and vaquero are other
  names for it, not a rodeo rider and not a ranch hand who herds sheep.
examples:
- The buckaroo rode out at dawn to check the herd.
- A buckaroo from California joined the drive.
