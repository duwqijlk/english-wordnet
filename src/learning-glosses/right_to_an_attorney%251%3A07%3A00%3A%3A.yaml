simpleMeaning: the right of a defendant, under the 6th change to the US Constitution, to have the state
  give them a lawyer or pay for one if they cannot pay
scope: A right to free legal help in a criminal case, not a right to a lawyer in other kinds of cases
  and not the right to speak for oneself in court.
examples:
- His right to an attorney meant the state had to pay for his lawyer.
- She used her right to an attorney when she could not afford one.
