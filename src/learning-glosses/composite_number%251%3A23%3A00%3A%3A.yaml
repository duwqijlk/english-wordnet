senseId: 'composite_number%1:23:00::'
synsetId: 13615660-n
simpleMeaning: a whole value that can be split into equal parts by a whole value bigger than 1 and smaller
  than itself
scope: A whole number that can be split into equal parts by a smaller whole number; not a prime number
  and not a number that cannot be split evenly.
examples:
- Twelve is a composite number because 3 and 4 go into it with nothing left over.
- Six is a composite number, since 2 goes into it with nothing left over.
