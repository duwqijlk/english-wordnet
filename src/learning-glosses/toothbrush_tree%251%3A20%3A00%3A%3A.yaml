synsetId: 12320157-n
simpleMeaning: Smooth or hairy evergreen shrub or small tree of the genus Salvadora, with fibrous twigs
  bundled and used for brushing teeth, shoots that feed camels, and ash that yields salt.
scope: The same Salvadora shrub that appears here as mustard tree, named for its twig brushes; it is not
  a plant that grows brushes, and not the South American shrub that also carries the mustard tree name.
examples:
- A toothbrush tree can be recognized by the fibrous twigs that people bundle together for cleaning their
  teeth.
- Where the toothbrush tree grows, its ash is gathered as a source of salt.
