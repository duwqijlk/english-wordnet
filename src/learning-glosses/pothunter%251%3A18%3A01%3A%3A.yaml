simpleMeaning: A person who takes part in games where people try to win, in order to gather trophies
scope: A person who joins games where people try to win in order to gather trophies, not a hunter and
  not a player who plays only for fun.
examples:
- He was known as a pothunter, entering every contest for the trophies.
- The pothunter joined three contests in one week to add to his trophies.
