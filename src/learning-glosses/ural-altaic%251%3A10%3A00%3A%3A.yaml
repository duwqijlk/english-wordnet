simpleMeaning: A supposed family of tongues that takes in many of the native tongues of Russia, but not
  Russian itself
scope: A supposed family of tongues taking in many native tongues of Russia, but not Russian itself; not
  a family that all scholars accept and not the family that holds Russian.
examples:
- Ural-Altaic was put forward as a family joining tongues from the Urals to the Altai.
- Some scholars doubt that Ural-Altaic is a real family at all.
