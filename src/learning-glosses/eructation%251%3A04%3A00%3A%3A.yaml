simpleMeaning: without meaning to, a person lets gas out of the stomach through the mouth with a loud
  noise
scope: 'Also called belch, burp, belching and burping: gas let out of the stomach noisily and without
  meaning to, not gas let out on purpose and not gas from a volcano.'
examples:
- His eructation after the meal was loud enough for everyone to hear.
- An eructation escaped from her before she could stop it.
