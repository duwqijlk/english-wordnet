simpleMeaning: Any made stuff that has a part in it with carbon and nitrogen joined, and oxygen and hydrogen
  with them
scope: Any made stuff with that carbon-nitrogen-oxygen-hydrogen part in it, not a made stuff with some
  other part in it.
examples:
- An oxime forms when hydroxylamine meets a ketone.
- The chemist made a new oxime in the lab.
