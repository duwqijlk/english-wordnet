simpleMeaning: make a planet or other body in space leave its expected path, especially because the pull
  of gravity from another body comes between them or is very strong
scope: This is about a planet or other body in space leaving its usual path. It is not about making a
  person worried, and not about changing the path of a very small part of an atom.
examples:
- The passing comet perturbed the planet's orbit.
- Gravity from the large planet perturbed the moon's usual path.
