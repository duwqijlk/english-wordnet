simpleMeaning: Having lost order and been thrown into confusion, as when troops scatter from their ranks.
scope: A group or arrangement that has lost order and fallen into confusion; it is not a machine that
  fails to work, something cracked or incomplete, or an animal trained to obey.
examples:
- Their ranks were broken by the sudden charge, and the line fell into confusion.
- The squadron retreated in broken formation, with soldiers running in all directions.
