simpleMeaning: A hairy, fragrant perennial herb with rings of small white, purple-spotted flowers on a
  spike, once a household remedy and strongly attractive to cats.
scope: This is the plant cats are drawn to, not a culinary mint such as spearmint; catmint is another
  name for it.
examples:
- The cat rolled in the catnip and then fell asleep.
- Dried catnip is often stuffed into toy mice.
