simpleMeaning: a low fan-leaved tree of the south coast of the United States with leaf buds that can be
  eaten
scope: A low fan-leaved tree of the south coast of the United States with leaf buds that can be eaten,
  also called cabbage palmetto, and not a tall palm of the West Indies or a palm whose buds are not eaten.
examples:
- Cabbage palms lined the coastal road.
- The cabbage palm's young leaf buds were cooked like greens.
