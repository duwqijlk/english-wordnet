simpleMeaning: a chemical formed from arsenic acid, either as a salt or as an ester, a compound made from
  an acid and an alcohol
scope: A chemical made from arsenic acid, not arsenic itself and not an arsenite, which comes from a different
  acid.
examples:
- The lab found arsenate in the river water.
- The sample held only a trace of arsenate.
