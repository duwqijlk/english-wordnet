simpleMeaning: Very good in a way that deserves the strongest good words
scope: This describes someone or something that is very good and deserves the strongest good words; not
  someone or something that is only fairly good.
examples:
- Her work to save the old library was truly praiseworthy.
- He made a praiseworthy effort to help his neighbours after the flood.
