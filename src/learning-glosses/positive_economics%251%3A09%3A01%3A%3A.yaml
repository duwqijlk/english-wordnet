simpleMeaning: the part of the study of money, goods, and work that tells what happens and why it happens
scope: This is the part of the study of money and goods that tells what happens and why it happens, not
  advice about what should happen with money.
examples:
- Her course in positive economics looked at what happens to prices when demand rises.
- The book on positive economics described how markets change after a bad harvest.
