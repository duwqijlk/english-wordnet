simpleMeaning: An Asian trailing evergreen honeysuckle with leaves green for part of the year and sweet
  white flowers turning yellow with age, now a weed in some places.
scope: 'Also called Japanese honeysuckle: an Asian trailing honeysuckle with sweet white flowers turning
  yellow, not a shrub honeysuckle and not a honeysuckle with red flowers.'
examples:
- Lonicera japonica trailed over the fence, its white flowers sweet-smelling.
- In some places Lonicera japonica has become a weed.
