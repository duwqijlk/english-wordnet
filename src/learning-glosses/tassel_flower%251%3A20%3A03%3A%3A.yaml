simpleMeaning: Small hanging bunches of scarlet blooms mark this plant from warm parts of Asia, which
  lives for a single year and is grown for its blooms.
scope: This is the warm-Asian plant grown for its scarlet blooms, not the African plant of the same name.
examples:
- The tassel flower showed small scarlet heads.
- The tassel flower's scarlet blooms opened one after another.
