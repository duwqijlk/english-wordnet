simpleMeaning: A big show with much detail, done in a rich and grand way that makes people notice it
scope: A big, grand show put on at great cost, not a foolish mistake that makes you look silly, and not
  just a strange thing that people see.
examples:
- The opening ceremony was a real spectacle, with lights, music, and dancers filling the stage.
- Thousands came to watch the spectacle of fireworks over the river.
