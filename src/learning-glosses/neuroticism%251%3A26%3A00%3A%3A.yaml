simpleMeaning: A trouble of the mind or of a person's way of being, not tied to any known ill of the nerves
  or the body.
scope: A trouble of the mind or of a person's way of being with no known ill of the nerves or body behind
  it, also called neurosis and psychoneurosis; not a trouble caused by a known brain ill and not a passing
  low mood.
examples:
- The test scored high on neuroticism, a lasting trouble of her way of being.
- Neuroticism is a trouble of the mind with no known ill of the nerves behind it.
