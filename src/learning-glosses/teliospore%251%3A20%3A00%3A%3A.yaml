senseId: 'teliospore%1:20:00::'
synsetId: 11570089-n
simpleMeaning: a thick-walled resting spore (a chlamydospore) that forms in the last stage of the life
  of a rust fungus
scope: A resting spore in the last stage of a rust fungus's life, not a spore made at the start of that
  life and not a spore of other fungi.
examples:
- The teliospore forms late in the life cycle of the rust fungus.
- The teliospore develops in the last stage of the rust fungus's life.
