simpleMeaning: Blood from the head, arms, and chest flows into this blood tube, which pours it into the
  right upper room of the heart, made from three smaller blood tubes.
scope: Also called superior vena cava, this is the blood tube that takes blood from the head, arms, and
  chest into the right upper room of the heart.
examples:
- The precava carries blood from the head to the heart.
- Blood from the arms flows into the precava.
