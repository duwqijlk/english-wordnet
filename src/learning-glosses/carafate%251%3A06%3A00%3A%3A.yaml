simpleMeaning: A medicine in tablet form used to treat peptic ulcers, said to stick to the sore spot and
  coat it.
scope: Also called sucralfate, this is one tablet medicine for peptic ulcers among other ulcer medicines
  and other stomach medicines, said to stick to the sore spot and coat it.
examples:
- The doctor gave her Carafate for her ulcer.
- Carafate coats the ulcer site to help it heal.
