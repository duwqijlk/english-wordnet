simpleMeaning: People are kept apart by race, chiefly in public travel, hotels, places to eat, and other
  places open to all.
scope: This is the keeping apart of people by race, enforced chiefly in public travel, hotels, places
  to eat, and other places open to all.
examples:
- Under petty apartheid, people are kept apart by race in hotels and places to eat.
- Petty apartheid keeps people apart by race in public travel and other places open to all.
