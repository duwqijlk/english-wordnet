simpleMeaning: to put someone at a disadvantage because of an unfair view you hold about them
scope: Putting someone at a disadvantage through an unfair view, not the unfair view itself.
examples:
- His accent prejudiced the panel against him.
- The rumour prejudiced her chances of getting the job.
