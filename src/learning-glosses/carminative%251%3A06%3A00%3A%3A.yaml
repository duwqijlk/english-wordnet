simpleMeaning: This drug keeps gas from building up inside the gut, or helps gas that is already there
  move on out
scope: This drug stops gas from forming in the gut or helps it pass, and it is not the adjective that
  says a thing relieves gas.
examples:
- He took a carminative for the gas.
- She took a carminative to ease the gas in her stomach.
