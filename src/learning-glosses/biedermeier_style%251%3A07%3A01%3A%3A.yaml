simpleMeaning: A time of change between Neoclassicism and Romanticism as middle-class people understood
  it, above all in Germany, Austria, northern Italy and the Scandinavian lands.
scope: A middle-class way of seeing the time between Neoclassicism and Romanticism, above all in Germany,
  Austria, northern Italy and the Scandinavian lands; neither Neoclassicism itself nor Romanticism itself.
examples:
- The Biedermeier style shaped furniture in Germany and Austria.
- In the Biedermeier style, plain middle-class taste met Romantic feeling.
