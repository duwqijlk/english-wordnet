simpleMeaning: A middle-sized kind of hop hornbeam that grows in the east of North America
scope: A middle-sized hop hornbeam of eastern North America; ironwood is another name for this sense,
  not a small bush and not a hornbeam from elsewhere.
examples:
- The ironwood tree grows along the river in the east.
- We planted an ironwood tree for its hard wood and shade.
