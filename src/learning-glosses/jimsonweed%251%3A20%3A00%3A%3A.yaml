simpleMeaning: A tall, coarse tropical weed that grows in one season, has foul-smelling leaves, big white
  or violet trumpet-shaped flowers and spiky fruit, and is highly poisonous.
scope: This is the whole tall poisonous weed, not belladonna or other nightshades.
examples:
- Jimsonweed has large trumpet-shaped flowers and spiky seed pods.
- They cleared the jimsonweed before the cattle were moved in.
