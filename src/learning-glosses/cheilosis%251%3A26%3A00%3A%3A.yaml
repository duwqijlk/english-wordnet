simpleMeaning: Too little riboflavin, a vitamin, brings on this sickness of the lips, in which the skin
  peels and cracks at the corners of the mouth.
scope: 'Also called perleche: a sickness of the lips with peeling skin and cracks at the mouth corners,
  not a sore inside the mouth.'
examples:
- Cheilosis made the corners of her mouth crack and peel.
- His cheilosis came from too little riboflavin.
