simpleMeaning: A plastic that hardens when heated, used to keep wires safe from touch and to make dishes,
  phone parts and other ware
scope: This is a hard-set plastic, not soft rubber and not a metal.
examples:
- The old radio case was made of Bakelite.
- Bakelite handles stay cool on a hot pan.
