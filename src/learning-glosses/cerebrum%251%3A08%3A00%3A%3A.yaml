simpleMeaning: the front part of the brain, made of two halves; the main part of the brain in people
scope: The front part of the brain, made of two halves, and the main part of the brain in people, not
  the back of the brain and not the spinal cord.
examples:
- The cerebrum is the largest part of the human brain.
- Damage to the cerebrum can change how a person thinks.
