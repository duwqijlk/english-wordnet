simpleMeaning: to turn round and round fast, again and again, around a fixed line through your own middle
scope: 'Also called spin, whirl, and reel: to turn round and round fast on your own centre, not to move
  in a circle around something else.'
examples:
- The dancer gyrated on stage, turning fast again and again.
- The top gyrated on the table before it fell over.
