simpleMeaning: A bowl, usually in a garden, where birds can wash; it is made to look nice
scope: A bowl in a garden for birds to wash in, not a bowl for giving birds food and not a bath for people.
examples:
- Small birds splashed happily in the birdbath.
- She filled the birdbath with clean water every morning.
