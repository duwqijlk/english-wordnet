simpleMeaning: A body part that makes fluids the body needs and sends them out through tubes or straight
  into the blood
scope: 'Also called a gland, a secreter, and a secretor: a body part that makes fluids the body needs;
  not a part that stores food and not a part that moves blood.'
examples:
- The secretory organ sends its fluid into the blood.
- Each secretory organ makes a fluid the body needs.
