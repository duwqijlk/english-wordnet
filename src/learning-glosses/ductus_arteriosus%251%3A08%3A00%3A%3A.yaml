senseId: 'ductus_arteriosus%1:08:00::'
synsetId: 05425521-n
simpleMeaning: A blood vessel in a fetus that lets blood skip the lungs by joining the pulmonary artery
  straight to the ascending aorta; it normally closes at birth.
scope: A short vessel that joins the pulmonary artery to the aorta in a fetus, letting blood bypass the
  lungs before birth. It is not the foramen ovale, a hole between the heart's upper chambers that also
  lets blood bypass the lungs. The term belongs to anatomy and medicine.
examples:
- Doctors checked the baby's ductus arteriosus when the murmur did not go away.
- The surgeon tied off the ductus arteriosus in the newborn.
