simpleMeaning: In computer science, a small movable mark of light on a screen that you move to point at
  commands or places on the screen
scope: This is about the moving mark on a computer screen, not about a dog that points at game or a mark
  that shows a direction.
examples:
- Move the pointer to the icon and click it.
- The pointer on the screen turned into a small hand over the link.
