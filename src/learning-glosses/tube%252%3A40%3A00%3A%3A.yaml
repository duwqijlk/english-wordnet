simpleMeaning: To put a hollow pipe in something, or to give something a hollow pipe
scope: To put a hollow pipe in something, or to give something a hollow pipe, not to ride on a blown-up
  ring and not the hollow pipe itself.
examples:
- They tubed the patient before the operation so he could breathe.
- The plumber tubed the new sink so the water could drain away.
