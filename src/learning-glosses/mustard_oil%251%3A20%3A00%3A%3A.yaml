simpleMeaning: This thick liquid comes from the seeds of a plant grown for its hot yellow paste, and it
  is used to make soap
scope: Oil from mustard seeds, used to make soap, not oil for cooking and not oil from another seed.
examples:
- They pressed mustard oil from the seeds for the soap maker.
- The soap maker used mustard oil in every batch.
