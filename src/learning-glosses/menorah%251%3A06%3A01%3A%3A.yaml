simpleMeaning: In Judaism, a stand for candles with seven arms, used in ceremonies to stand for the seven
  days of Creation.
scope: In Judaism, a seven-armed candle stand for ceremonies, standing for the seven days of Creation;
  not the nine-armed candle stand used at Hanukkah.
examples:
- The menorah stood on the table with seven candles lit.
- A menorah with seven branches was used in the ceremony.
