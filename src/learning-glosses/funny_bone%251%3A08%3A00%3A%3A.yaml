simpleMeaning: a spot on the elbow where a nerve runs close to the skin; a sharp tingling pain comes when
  that nerve is hit against the hard part of the arm
scope: A tender spot on the elbow, not a real bone and not the elbow joint itself; also called crazy bone.
examples:
- He bumped his funny bone on the door and felt a sharp tingle run down his arm.
- I hit my funny bone and shook my hand until the tingling stopped.
