simpleMeaning: having to do with an odd build-up of blood or other liquid
scope: This describes a state where blood or other liquid has built up in an odd way, not a normal flow
  of blood and not a lack of blood.
examples:
- The congestive swelling in her leg made it hard to walk.
- Congestive heart disease leaves fluid in the lungs.
