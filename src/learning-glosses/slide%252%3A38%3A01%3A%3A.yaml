simpleMeaning: To go off at an angle or to the side, often without being able to control it.
scope: 'Another name for ''skid'', ''slip'', ''slew'', or ''slue'': a sideways or angled move you cannot
  control, not a smooth glide along a surface or an unnoticed exit.'
examples:
- The car slid sideways on the ice.
- Boxes slid across the floor as the ship rolled.
