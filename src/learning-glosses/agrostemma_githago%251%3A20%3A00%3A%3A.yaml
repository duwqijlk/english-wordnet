simpleMeaning: A European plant that lives one year, with large trumpet-shaped red-purple flowers and
  seed that can poison; a common weed in grainfields and beside roads, now growing wild in America.
scope: Also called corn campion, corn cockle, and crown-of-the-field; a weed with red-purple flowers and
  poisonous seed, not a garden flower grown for show and not a food crop.
examples:
- Agrostemma githago grows as a weed in the wheat field.
- The red-purple flowers of Agrostemma githago stand out among the grain.
