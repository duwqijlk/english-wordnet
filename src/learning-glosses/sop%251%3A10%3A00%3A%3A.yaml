senseId: 'sop%1:10:00::'
synsetId: 07231275-n
simpleMeaning: a thing given or allowed to calm a person and make them less angry, as a way of giving
  in a little
scope: This is a thing given to calm someone, not the verb uses of the word for covering something with
  liquid or for becoming very wet.
examples:
- The small pay rise was only a sop to the angry workers.
- He offered an apology as a sop to her feelings.
