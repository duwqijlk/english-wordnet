simpleMeaning: to test a patient or treat them, doctors draw fluid from round the lower spine with a needle
scope: Also called lumbar puncture and a spinal tap; not a blood test, and not an injection into the spine.
examples:
- The doctor did a spinal puncture to test the fluid round her spine.
- A spinal puncture can show why a patient has a fever.
