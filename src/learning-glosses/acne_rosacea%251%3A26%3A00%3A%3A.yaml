simpleMeaning: A skin sickness of grown people, more often women, in which the small blood tubes of the
  face grow wide and the face looks red.
scope: Rosacea is another name for this sense, not spotty acne and not a sunburn rash.
examples:
- Her acne rosacea flared in the cold wind.
- The acne rosacea made his cheeks look red.
