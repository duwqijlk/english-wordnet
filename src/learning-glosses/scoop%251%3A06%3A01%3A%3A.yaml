simpleMeaning: The cup-shaped part of a big digging machine
scope: The digging cup on a big machine, not a hollow dip in the ground and not the amount a cup holds.
examples:
- The scoop of the digger lifted a load of mud.
- The scoop on the backhoe was full of wet earth.
