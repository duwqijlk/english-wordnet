simpleMeaning: Along the sandy shores of eastern North America, this herb of Europe and Asia with a grey-blue
  coat now grows, bearing yellow flowers.
scope: Also called horn poppy, sea poppy, and yellow horned poppy, it is the herb with a grey-blue coat
  and yellow flowers that grows along the sandy shores of eastern North America.
examples:
- The horned poppy stood on the sandy shore.
- Horned poppy bore yellow flowers in the east.
