simpleMeaning: In grammar, the term in a group of terms that fills the same role in a sentence as the
  whole group.
scope: The term in a group of terms that fills the same role as the whole group, also called head; not
  the subject of a sentence and not a word that only adds detail.
examples:
- In 'the big dog', 'dog' is the head word of the phrase.
- The head word of 'a cup of tea' is 'cup'.
