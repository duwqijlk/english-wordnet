simpleMeaning: large leaves that taste sour and have the shape of an arrow head, used in salads and in
  sauces
scope: 'Also called common sorrel: these are the large sour leaves used in food, not the whole weedy plant
  and not a plant or flower of the Oxalis group.'
examples:
- She added fresh sorrel to the salad for its sour taste.
- The cook stirred chopped sorrel into the sauce.
