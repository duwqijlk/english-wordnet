simpleMeaning: In chemistry, the way one thing spreads through another thing by soaking in; a liquid or
  gas spreads through a liquid or solid, or dissolves into it
scope: 'Also called soaking up: in chemistry, one thing spreads into another; this is not the physics
  sense about energy, and not the body taking in food from eating.'
examples:
- Absorption of water by the dry sponge happened in seconds.
- The absorption of the gas into the liquid was slow.
