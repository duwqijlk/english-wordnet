simpleMeaning: A big grey-brown fungus you can eat, growing in a mass of caps piled one over another at
  the foot of a tree, a bit like a farm bird.
scope: Also called hen of the woods, this is a big edible fungus in a mass of caps at the foot of a tree,
  not a small single mushroom.
examples:
- We found hen-of-the-woods at the base of an old oak.
- She cooked the hen-of-the-woods in butter.
