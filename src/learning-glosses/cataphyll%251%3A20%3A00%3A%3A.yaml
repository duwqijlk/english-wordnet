senseId: 'cataphyll%1:20:00::'
synsetId: 11706664-n
simpleMeaning: A seed leaf shows, small and little grown, while a plant's leaves are still forming or
  at the very start of its life.
scope: This is a leaf little grown at the start of a plant's life, not a full leaf of a grown plant.
examples:
- The cataphyll appears before the plant's true leaves open.
- Each cataphyll is small and little grown at the start of the plant's life.
