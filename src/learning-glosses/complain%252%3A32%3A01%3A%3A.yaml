simpleMeaning: to make a formal statement in law that a person has done something wrong
scope: To bring a formal charge in law, not the everyday sense of saying you are unhappy or not pleased
  with something.
examples:
- The woman's lawyer complained to the court that she had been hurt.
- His lawyer complained that the other man had hit his client.
