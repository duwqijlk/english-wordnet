simpleMeaning: Meant to calm someone by giving in to what they ask or by granting favours.
scope: Meant to calm someone by giving in to what they ask or by granting favours; placating, appeasing
  and placatory are other names for this sense, not defiant and not hostile.
examples:
- She made a placative offer to end the quarrel.
- His placative tone softened the angry crowd.
