senseId: 'float%2:41:03::'
synsetId: 02537745-v
simpleMeaning: Suggest an idea or plan to others and discuss it tentatively to find out how they react.
scope: This is offering an idea to see how people respond, not staying on the surface of water, putting
  something into water, or letting a currency's value change.
examples:
- She floated the idea of a longer lunch break at the meeting.
- The company is floating a plan to open a second office.
