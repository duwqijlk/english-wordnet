simpleMeaning: A wedge-shaped flat growth on a plant with its sharp point at the foot.
scope: A wedge-shaped leaf with its point at the base, not a round leaf and not a heart-shaped leaf.
examples:
- The cuneate leaf narrows to a sharp point at its base.
- A cuneate leaf grew beside the round ones.
