senseId: 'settle%2:32:00::'
synsetId: 00765444-v
simpleMeaning: to resolve a matter completely by reaching an agreement
scope: Concluding a disputed matter by mutual agreement, not a judge or referee deciding it, a legal dispute
  ending in a settlement, or two people making up after a quarrel.
examples:
- The two departments settled their dispute over next year's budget.
- They settled the argument over who would pay for dinner.
