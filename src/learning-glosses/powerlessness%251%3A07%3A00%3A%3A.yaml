simpleMeaning: the state of having no strength or control, and of being very weak
scope: 'Also called impotence: this names the state of being weak and having no control, not the state
  of having strength and being able to act.'
examples:
- She felt a deep sense of powerlessness when she could not help her child.
- His illness left him with a feeling of powerlessness.
