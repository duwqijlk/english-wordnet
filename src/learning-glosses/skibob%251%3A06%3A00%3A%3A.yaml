simpleMeaning: wearing short runners to keep balance, a person rides a small vehicle like a bicycle, but
  with runners for snow in place of wheels
scope: It is a small vehicle like a bicycle with runners for snow instead of wheels, not a bicycle.
examples:
- He rode a skibob in the snow.
- A skibob let her keep her balance on the short runners.
