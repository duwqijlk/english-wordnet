senseId: 'plexus%1:08:00::'
synsetId: 05243652-n
simpleMeaning: a set of thin tubes for blood, or thin lines that carry messages, or thin tubes for clear
  body fluid, all crossing each other in the body
scope: This is a crossing set inside the body, also called a rete, not a single blood tube, line for feeling,
  or fluid tube on its own.
examples:
- Damage to the nerve plexus in his shoulder made his arm weak.
- Doctors found a plexus of small blood vessels near the joint.
