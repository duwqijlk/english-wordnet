simpleMeaning: the part of a person that thinks, feels and is aware, and that lets the person reason
scope: 'Also called head, mind, brain and psyche: the part of a person that thinks, feels, is aware and
  reasons. It is not a thing you can touch.'
examples:
- He kept his nous about him and thought through the problem step by step.
- A clear nous helps a person reason when feelings run high.
