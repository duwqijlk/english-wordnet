simpleMeaning: after a substance has soaked up rays of only some kinds, the spread of the rays that have
  passed through it
scope: It is the spectrum left after a medium has taken in radiation of certain wavelengths, not an emission
  spectrum, which shows the wavelengths a substance gives out.
examples:
- The absorption spectrum of the gas showed which rays had passed through.
- They read the absorption spectrum to see which rays the gas had soaked up.
