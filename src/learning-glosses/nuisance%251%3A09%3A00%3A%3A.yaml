senseId: 'nuisance%1:09:00::'
synsetId: 05838851-n
simpleMeaning: In law, a wide idea covering anything that disturbs the fair use of what you own, puts
  life or health at risk, or gives offence
scope: In law, a thing that gets in the way of using what you own, not a small annoyance in everyday talk.
examples:
- The noisy factory next door was ruled a nuisance to the whole street.
- Leaving rubbish that blocks the path can count as a nuisance in law.
