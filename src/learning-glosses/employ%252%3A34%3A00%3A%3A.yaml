schema: oewn-learning-gloss-v2
senseId: 'employ%2:34:00::'
synsetId: 01161188-v
simpleMeaning: to put something into use, or to use it for a set purpose or for the purpose it has by
  nature
scope: This is the verb sense that means to use a thing; it is not the noun sense that means having a
  job, and it is not about giving a person a job.
examples:
- The farmer employs an old tractor to clear the fields.
- We employed a new way to clean the water.
