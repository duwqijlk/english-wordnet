simpleMeaning: a catching disease of animals kept by people that often makes them lose their young before
  birth, and can pass to people
scope: This is a catching disease of animals kept by people that often makes them lose their young before
  birth, and can pass to people; contagious abortion is another name for it, not the fever people catch
  from sick animals or their meat or milk.
examples:
- Brucellosis spread through the herd and caused abortions.
- The farmer was warned that brucellosis can pass to people.
