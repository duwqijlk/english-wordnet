simpleMeaning: to hold eggs against a light so you can see if they are still fresh
scope: This verb is about checking eggs with light; it is not the noun for a wax stick that burns to give
  light.
examples:
- The farmer candles each egg before selling it.
- She candled the eggs to check which ones were still fresh.
