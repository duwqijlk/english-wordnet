senseId: 'opposition%1:14:01::'
synsetId: 08421145-n
simpleMeaning: The biggest party not in power, which stands against the party that governs and is ready
  to take its place if the voters choose it.
scope: Not the party in power, nor a small party with no hope of rule; the biggest party out of power.
examples:
- Her Majesty's loyal opposition spoke against the bill.
- The Opposition called for a vote on the plan.
