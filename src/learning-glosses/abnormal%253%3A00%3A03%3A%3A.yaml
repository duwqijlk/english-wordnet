simpleMeaning: different from what is usual, for example in how clever someone is or how they grow
scope: This is a move away from what is usual, for example in cleverness or growth, not the general sense
  of simply not being normal.
examples:
- The doctors said the child's growth was abnormal and needed care.
- Her abnormal development in speech made her parents ask the doctor for help.
