simpleMeaning: A member of a Jewish group in Judea in the first century who fought the Romans to the death
  and killed or harmed Jews who worked with the Romans.
scope: Not a Pharisee or a Sadducee, and not a modern fanatic; this is the first-century group.
examples:
- The Zealots fought the Romans to the death.
- A Zealot would kill Jews who worked with the Romans.
