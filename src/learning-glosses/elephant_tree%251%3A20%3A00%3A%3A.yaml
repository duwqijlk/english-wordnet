simpleMeaning: Small clusters of white flowers, a spicy smell, and paired leaflets with one at the tip
  mark this small tree or shrub of the southwestern United States.
scope: It is a small tree or shrub of the southwestern United States with a spicy smell, a different plant
  from the one with large showy leaves called elephant's ear.
examples:
- The elephant tree has a spicy smell.
- Small clusters of white flowers grow on the elephant tree.
