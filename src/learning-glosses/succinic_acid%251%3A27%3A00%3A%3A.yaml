simpleMeaning: In the chemical changes that keep the body going, a sour stuff with two sour parts, C4H6O4,
  does its work.
scope: Among the sour stuffs at work in the body, this one, C4H6O4, has two sour parts.
examples:
- The body makes succinic acid as food is broken down for fuel.
- Cells make succinic acid while food is used for fuel.
