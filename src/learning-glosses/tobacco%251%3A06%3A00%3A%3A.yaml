simpleMeaning: leaves from a plant, dried and made ready for smoking or for taking into the body
scope: This means the dried leaves made ready to use, not the living plant that the leaves come from.
examples:
- He put some tobacco in his pipe and lit it.
- The shop sells tobacco for smoking.
