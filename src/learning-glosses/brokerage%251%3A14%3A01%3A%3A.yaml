simpleMeaning: The trade of a broker, who takes payment for arranging a deal between two sides.
scope: This sense is the trade of a broker, who takes payment for arranging a deal between two sides,
  unlike the sense for a stock broker's trade, charging a fee to stand between buyer and seller, and unlike
  the sense for a place where a broker does their trade.
examples:
- The brokerage took a fee for the deal.
- Brokerages arrange deals between two sides.
