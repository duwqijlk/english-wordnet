simpleMeaning: a soldier trained to jump from a plane with a parachute, a large cloth that opens in the
  air and lets a person fall slowly and safely
scope: This is a soldier who jumps from a plane in this way, not a pilot who flies the plane, and not
  the jump or the cloth itself.
examples:
- The paratroopers jumped from the plane and landed behind the enemy lines.
- As a paratrooper, he learned to fold his parachute after every jump.
