senseId: 'systemic_lupus_erythematosus%1:26:00::'
synsetId: 14244793-n
simpleMeaning: a disease that swells the tissue joining parts of the body, with changing signs such as
  fever, weakness, tiring fast, sore joints, and sores on the face, neck, or arms
scope: Also called disseminated lupus erythematosus; not a single skin rash and not a short illness that
  soon passes.
examples:
- Systemic lupus erythematosus can bring fever and sore joints.
- Her systemic lupus erythematosus flares up in the summer.
