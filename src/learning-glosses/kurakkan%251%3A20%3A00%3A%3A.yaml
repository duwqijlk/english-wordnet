simpleMeaning: a grain grass of East India whose seeds give a flour that tastes a little bitter, a main
  food in the East
scope: 'Also called coracan, corakan, finger millet, ragee, or ragi: a grain grass of East India with
  bitter flour, not wheat, and not rice.'
examples:
- Farmers in the hills grow kurakkan for its bitter flour.
- Kurakkan porridge was the main food of the village.
