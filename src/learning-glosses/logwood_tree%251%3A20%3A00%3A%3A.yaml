simpleMeaning: Thorny bush or small tree growing in Central America and the West Indies, with finely divided
  leaves and clusters of yellow flowers. Its hard reddish-brown wood makes black dye.
scope: This is the Central American dye-wood shrub, another name for logwood and campeachy; it is not
  the extracted heartwood used in dyeing.
examples:
- A logwood tree in flower stood at the edge of the plantation.
- The logwood tree has spiny branches and clusters of yellow flowers.
