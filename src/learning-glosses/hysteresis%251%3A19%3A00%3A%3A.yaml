simpleMeaning: When the field around a metal that can be made magnetic changes, the pull inside it follows
  late, as does any effect behind its cause.
scope: Where a cause moves first and its effect follows late, above all the pull inside a metal that can
  be made magnetic, this name marks that lag.
examples:
- As the field changed, hysteresis kept the pull in the metal behind it.
- The effect trailed its cause, a clear case of hysteresis.
