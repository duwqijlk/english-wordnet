simpleMeaning: An effect lagging behind its cause, especially magnetic induction in a ferromagnetic material
  lagging behind the changing magnetic field.
scope: This name marks a lag between a cause and its effect, above all the magnetic lag in a ferromagnetic
  material behind a changing field.
examples:
- As the field changed, hysteresis kept the pull in the metal behind it.
- The effect trailed its cause, a clear case of hysteresis.
