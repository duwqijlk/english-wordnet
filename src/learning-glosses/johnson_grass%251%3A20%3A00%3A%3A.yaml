simpleMeaning: A tall long-lived plant, spreading by creeping stems under the ground and grown for feed;
  settled in the southern United States, where it is a bad pest on farmed land.
scope: 'Also called evergreen millet, means grass, Aleppo grass and Sorghum halepense: a tall long-lived
  plant, spreading by creeping stems under the ground and grown for feed, settled in the southern United
  States, where it is a bad pest on farmed land; other tall plants grown for feed do not spread in this
  way or are no pest.'
examples:
- Johnson grass spreads by creeping stems under the ground.
- Farmers fight Johnson grass as a bad pest on farmed land.
