simpleMeaning: A small spinning wind strong enough to lift earth, leaves and rubbish into the air
scope: A small spinning wind that lifts earth and leaves, not a big storm and not a tornado.
examples:
- A dust devil spun across the dry field, lifting leaves into the air.
- The dust devil was small, but it scattered dust and litter everywhere.
