simpleMeaning: a tiny living thing that lives in the red blood cells of animals with fur or hair, is passed
  on by ticks, and brings sickness to tame animals
scope: A tiny living thing in the red blood cells of animals with fur or hair, passed on by ticks and
  bringing sickness to tame animals, not a worm and not a germ spread by air.
examples:
- Piroplasm in the blood made the cattle weak.
- Ticks spread piroplasm to animals people keep.
