simpleMeaning: a health problem with sleep in which a person suddenly falls into deep sleep and cannot
  stop it happening
scope: A health problem in which a person suddenly falls into deep sleep in the day; not simple tiredness
  and not the problem of being unable to sleep.
examples:
- His narcolepsy meant he could fall asleep in the middle of a talk.
- She takes care when driving because of her narcolepsy.
