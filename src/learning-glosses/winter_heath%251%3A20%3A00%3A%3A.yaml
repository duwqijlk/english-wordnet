simpleMeaning: Very early in the year, bell-shaped red blooms open on this small low shrub of Europe.
scope: Also called spring heath, it belongs with the low European shrubs whose red blooms open very early
  in the year.
examples:
- Bell-shaped red blooms opened on the winter heath very early in the year.
- The winter heath grew low, its red blooms already open.
