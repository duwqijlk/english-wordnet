simpleMeaning: A holy picture painted in oil on a small board of wood, made in the old set way and honoured
  in prayer in the Eastern Church.
scope: A holy picture painted in oil on a small board of wood, made in the old set way and honoured in
  prayer in the Eastern Church; icon is another name for it, not a modern painting and not a photograph.
examples:
- An ikon hung above the altar in the small church.
- She lit a candle before the ikon.
