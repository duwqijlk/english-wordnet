simpleMeaning: To change how you live and act so that you fit in with new or different things around you
scope: This is changing yourself to fit new or different things around you, not changing a thing so it
  is right.
examples:
- We must adjust to the bad times and learn to live with less.
- She adjusted to life in a new town after a few hard months.
