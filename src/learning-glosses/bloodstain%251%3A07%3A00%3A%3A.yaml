simpleMeaning: A mark of changed colour where blood has touched a thing and stayed
scope: This is a mark left by blood on a thing, not a mark left by dirt or paint.
examples:
- A bloodstain showed on the sleeve of his shirt.
- She scrubbed at the bloodstain but it would not come out.
