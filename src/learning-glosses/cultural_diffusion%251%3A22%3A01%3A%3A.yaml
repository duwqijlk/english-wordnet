senseId: 'cultural_diffusion%1:22:01::'
synsetId: 92440974-n
simpleMeaning: The spread of ideas, styles, faiths, tools, tongues, and the like from person to person,
  inside one way of life or from one way of life to another.
scope: The spread of ways of life between people, not the spread of disease and not the mixing of peoples.
examples:
- Cultural diffusion brought new foods to the region.
- Trade helped cultural diffusion spread the new style.
