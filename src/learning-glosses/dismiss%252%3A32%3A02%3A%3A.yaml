simpleMeaning: to stop thinking about something, or for a court to end a case
scope: To stop thinking about an idea, or to end a court case, not to let a person leave and not to end
  a person's job.
examples:
- She dismissed the idea as too costly and did not think about it again.
- The judge dismissed the case because there was not enough proof.
