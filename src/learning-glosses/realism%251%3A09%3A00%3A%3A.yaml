simpleMeaning: In philosophy, the view that real things keep on existing even when no one sees or feels
  them
scope: In philosophy, the view that real things exist unseen, not the view about ideas existing apart
  from names and not the everyday habit of facing facts.
examples:
- Realism in philosophy says the chair is there when no one is in the room.
- He held to realism, that the world goes on when we close our eyes.
