simpleMeaning: a person who is allowed to lead religious worship
scope: 'Also called minister, parson, curate and pastor: this is a person who leads religious worship,
  not the worship itself and not a church building.'
examples:
- The rector led the Sunday service at the small church.
- Our rector visits people in the village each week.
