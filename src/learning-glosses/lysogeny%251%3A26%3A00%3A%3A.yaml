simpleMeaning: a germ takes a virus that attacks germs into the material inside it that passes on how
  it is made, and stays in that state
scope: Also called lysogenicity, this is a germ's state after taking a virus into itself, not the breaking
  open of a cell and not a virus on its own.
examples:
- Lysogeny began when the virus joined the germ's own material.
- In lysogeny, the germ keeps the virus inside it as part of itself.
