simpleMeaning: In computer science, a set of magnetic plates that can be carried and used in a machine
  that stores data
scope: A set of plates that can be carried from one machine to another, also called disc pack; not a single
  plate and not the machine that holds them.
examples:
- The disk pack held the whole payroll file.
- She carried the disk pack to the other computer room.
