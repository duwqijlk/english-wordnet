simpleMeaning: to hold back a feeling or sound so that other people do not see or hear it
scope: 'Also called muffle, stifle, smother and repress: to hold back a feeling or sound to hide it; not
  pressing on someone''s throat, and not dying because no air can get in.'
examples:
- He strangled a laugh when the teacher looked up.
- She strangled a cry of fear and stayed silent.
