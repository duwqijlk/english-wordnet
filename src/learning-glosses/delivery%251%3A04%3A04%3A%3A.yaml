simpleMeaning: the act of taking or handing out something, such as goods or letters, to the people or
  places it is for
scope: This is taking goods or letters to people, also called bringing. It is not a baby being born, not
  throwing a ball in a game, and not the way a person speaks.
examples:
- The shop offers free delivery for orders over fifty pounds.
- The morning delivery brought three letters and a large box.
