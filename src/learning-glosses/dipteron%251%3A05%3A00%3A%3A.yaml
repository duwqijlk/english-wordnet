simpleMeaning: An insect in which normally just the front wing pair works, the rear pair is reduced to
  little knobs, and the mouth is suited to sucking, lapping or piercing.
scope: Another name for the same fly group, also called dipteran, dipterous insect and two-winged insects;
  not a bee, wasp or dragonfly, which have two pairs of wings.
examples:
- A dipteron such as a mosquito usually has just one pair of working wings.
- The rear wings of a dipteron are reduced to tiny knobs.
