simpleMeaning: having no good reason for it, or no permission to do it
scope: Also called unwarranted and unjustified. This means with no good reason or no permission; it is
  not the sense of too much or more than is right.
examples:
- He used his power for undue private profit, with no right to do so.
- The rules gave the police undue power, and no one had allowed it.
