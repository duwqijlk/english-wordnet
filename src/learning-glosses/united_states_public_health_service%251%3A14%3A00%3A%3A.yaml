simpleMeaning: A government group that works as the office of the country's chief doctor, and has within
  it groups whose work is to keep the people well.
scope: Also called PHS, this is a government group that works as the office of the country's chief doctor
  and takes in groups that work to keep the people well, not a hospital.
examples:
- She works for the United States Public Health Service.
- The United States Public Health Service works as the office of the country's chief doctor.
