simpleMeaning: a thing built over a river, a canal, a railway, or some other block in the way, so people
  and vehicles can cross
scope: A thing built over a block in the way so people and vehicles can cross, also called a bridge; not
  a length of time and not the width of a hand.
examples:
- The span crossed the wide river.
- They built a span over the railway.
