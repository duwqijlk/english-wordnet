simpleMeaning: a drug that lowers blood pressure, sold as Catapres, taken by mouth or through a patch
  on the skin
scope: A drug that lowers blood pressure, taken by mouth or through a patch on the skin; not a drug that
  makes the body pass more water and not a drug that slows the heart.
examples:
- The doctor gave her clonidine for her high blood pressure.
- Clonidine can be taken as a pill or worn as a skin patch.
