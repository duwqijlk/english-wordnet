simpleMeaning: a pale green fly with lacy wings and a bad smell, whose young eat other small creatures
scope: A pale green fly with lacy wings and a bad smell, whose young eat other small creatures, also called
  a green lacewing and a stink fly; not a butterfly and not a bee.
examples:
- A chrysopid rested on the leaf, its wings like lace.
- Chrysopids lay eggs whose young eat aphids.
