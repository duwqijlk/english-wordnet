senseId: 'signal-to-noise_ratio%1:24:00::'
synsetId: 13847877-n
simpleMeaning: how much stronger the sound you want is than the sound you do not want
scope: How much stronger the sound you want is than the sound you do not want, also called signal-to-noise,
  signal/noise and signal/noise ratio; not the strength of the wanted sound on its own and not the strength
  of the unwanted sound on its own.
examples:
- The lab measured the signal-to-noise ratio of the new hearing aid.
- A low signal-to-noise ratio makes speech hard to hear.
