simpleMeaning: A short, pretty cloth that hangs down over the edge of a shelf or the top of a window frame
scope: A short cloth that hangs at a shelf edge or a window top, not a scarf worn over a knight's helmet.
examples:
- The lambrequin hid the plain shelf edge behind its pretty cloth.
- She sewed a lambrequin to dress up the top of the window.
