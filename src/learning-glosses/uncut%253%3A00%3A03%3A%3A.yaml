simpleMeaning: not shaped by cutting or by cutting small parts off
scope: 'Also called rough: this is about a thing, such as a stone, that has not been shaped by cutting,
  not about book pages still joined and not about grass that has not been cut down.'
examples:
- The jeweller bought an uncut diamond and planned its shape.
- They sold the stones uncut, just as they came from the ground.
