simpleMeaning: In mathematics, a line or flat surface cuts a shape or link into two halves that are just
  the same.
scope: Balance, correspondence, and symmetry are other names for this matching of halves across a line
  or flat surface.
examples:
- The symmetricalness of the arch pleased the eye.
- In class they drew a shape to show symmetricalness across a line.
