simpleMeaning: feeling anxious about something bad that might happen.
scope: An uneasy feeling about possible trouble ahead — apprehensive is another name for it — not the
  broader troubled or grieving state in the other worried sense, and not mere mild concern.
examples:
- She was worried about small things during her first week in the city.
- He looked worried about the consequences of the decision.
