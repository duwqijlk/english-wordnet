simpleMeaning: a helper, often the father of the coming child, who supports a woman giving birth and urges
  her to use ways learned in classes that prepare her for birth
scope: This is a support person during birth, often the father, not the doctor or nurse who gives medical
  care for the birth.
examples:
- As her doula, he held her hand and reminded her how to breathe.
- The doula stayed with the mother through the long night of labour.
