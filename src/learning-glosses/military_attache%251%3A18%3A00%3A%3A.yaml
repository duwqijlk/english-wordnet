simpleMeaning: A member of a country's staff in another land who is an expert on armed forces and war.
scope: An expert on armed forces and war serving on a country's staff abroad; not a country's chief representative
  abroad, and not a soldier on active duty.
examples:
- The military attache met the generals to talk about the exercise.
- She served as a military attache in Paris for three years.
