simpleMeaning: A herb of the Old World with sweet-smelling leaves and seed that looks like parsley.
scope: Also called coriander, cilantro, coriander plant and Chinese parsley; it is the herb plant itself,
  not parsley, though its seed looks like parsley.
examples:
- Coriandrum sativum grew in the garden with sweet-smelling leaves.
- We picked Coriandrum sativum for its leaves.
