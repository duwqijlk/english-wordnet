senseId: 'stalk%1:04:02::'
synsetId: 00712776-n
simpleMeaning: A hunt for wild animals in which the hunter goes after them in secret or waits in hiding
  for them
scope: This is a hunt done by secret following or waiting in hiding, not a plant stem, and not one stiff,
  menacing walk.
examples:
- The stalk began at dawn, with the hunters moving in secret through the trees.
- A long stalk through the tall grass ended when the deer came into view.
