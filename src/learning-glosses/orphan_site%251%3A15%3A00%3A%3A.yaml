simpleMeaning: A poison waste area where no one can tell who made the mess, or the maker will not clean
  it up or pay for it
scope: A poison waste place whose maker cannot be found or will not clean it up, not a clean building
  site and not a place where waste is safely stored.
examples:
- The old factory ground became an orphan site after the firm that made the mess shut down.
- No one would pay to clean up the orphan site.
