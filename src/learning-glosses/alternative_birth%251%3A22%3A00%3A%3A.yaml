simpleMeaning: Some people choose to have a baby with little high-tech care, in a place that feels natural
  and like home.
scope: Also called alternative birthing, it is the choice to have a baby with little high-tech care, in
  a place that feels natural and like home.
examples:
- They chose alternative birth because they wanted a natural, home-like place for the baby.
- The couple planned an alternative birth with little high-tech care.
