simpleMeaning: The Roman Catholic Church's answer to the Protestant split, restating honour for the saints
  and the Pope's rule, which Protestants rejected; many leaders were Jesuits.
scope: The Roman Catholic Church's answer to the Protestant split, restating honour for the saints and
  the Pope's rule, not the Protestant split itself.
examples:
- The Counter Reformation restated honour for the saints and the Pope's rule.
- Many leaders of the Counter Reformation were Jesuits.
