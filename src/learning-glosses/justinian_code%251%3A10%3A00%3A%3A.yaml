simpleMeaning: The laws of ancient Rome were written down as one set of laws in Justinian's time, and
  many modern systems of civil law rest on them.
scope: Also called civil law, jus civile, and Roman law, this is the set of laws of ancient Rome written
  down in that man's time, not a modern set of laws.
examples:
- The Justinian code shaped the laws of many countries.
- Lawyers still study the Justinian code today.
