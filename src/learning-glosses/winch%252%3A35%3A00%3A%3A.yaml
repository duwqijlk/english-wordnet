simpleMeaning: to pull or lift something up with a machine that winds a rope round a turning drum, or
  as if with such a machine
scope: To pull or lift something up with a rope-winding machine, not the machine itself.
examples:
- They winched the boat up onto the trailer.
- He winched up the slack line until it was tight.
