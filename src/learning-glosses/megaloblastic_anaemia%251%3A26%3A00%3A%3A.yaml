simpleMeaning: A state in which the blood holds many large young red cells that do not work right, made
  inside the bones; it is linked with another illness of the blood
scope: 'Also called megaloblastic anemia: a blood state with many large young red cells that do not work
  right.'
examples:
- Megaloblastic anaemia left her blood with too many large young red cells.
- The doctor found megaloblastic anaemia in the soft stuff inside his bones.
