simpleMeaning: a strong, thin, often easy-to-bend stem of a plant, as with bamboo, reed, rattan, or the
  plant that sugar comes from
scope: This is a plant stem; it is not the stiff stick used to hit students as a punishment and not a
  stick that helps a person walk.
examples:
- The bamboo's cane was thin but strong and bent without breaking.
- He cut a cane from the reed bed to use as a light pole.
