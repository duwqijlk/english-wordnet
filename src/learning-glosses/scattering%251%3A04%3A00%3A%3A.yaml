simpleMeaning: when things are thrown or spread so they fall in many places
scope: 'Also called scatter: things thrown or spread so they fall in many places, not a light shower falling
  here and there and not the way bits of matter bounce off each other.'
examples:
- The scattering of seeds took all morning.
- After the scattering of the crowd, the square was empty.
