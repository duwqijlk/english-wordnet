simpleMeaning: Worn on a hat, a long feather, above all one from an egret, or a jewel made to look like
  such a feather.
scope: Worn on a hat, this long feather — above all one from an egret — or the jewel made in its shape
  is also called aigret.
examples:
- She pinned an aigrette of egret feathers to her hat.
- The aigrette she wore was a jewel shaped like a feather.
