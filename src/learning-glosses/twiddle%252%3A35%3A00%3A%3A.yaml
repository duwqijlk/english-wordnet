simpleMeaning: to move or touch something with your hands in a nervous way or without thinking
scope: This is about moving or touching something with your hands when you are nervous or not thinking,
  not turning something in a twisting or spinning way.
examples:
- He twiddled his thumbs while he waited.
- She twiddled a pen in her fingers during the test.
