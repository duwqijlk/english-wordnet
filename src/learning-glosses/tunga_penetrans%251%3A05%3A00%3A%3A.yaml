simpleMeaning: A small tropical flea, whose egg-laying female digs under the skin of the animal or person
  it lives on.
scope: 'Also called chigger, chigoe, and chigoe flea: a small tropical flea whose egg-laying female digs
  under the skin, different from a common house flea and from a sand fly.'
examples:
- The Tunga penetrans female had burrowed under the skin of his foot.
- Doctors found Tunga penetrans under the skin of the child's toe.
