simpleMeaning: especially of muscles, pulling away from the middle line of the body or away from a part
  next to it
scope: About a muscle pulling away from the middle of the body, not a muscle pulling in toward the middle,
  and not taking a person away by force.
examples:
- The abducting muscle in the hip pulls the leg away from the middle of the body.
- An abducting movement lifts the arm out and away from the body.
