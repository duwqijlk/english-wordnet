simpleMeaning: a trained worker paid to tell whether a young bird is male or female
scope: A trained worker paid to tell whether young birds are male or female, also called a chick sexer;
  not a farmer who raises birds and not a vet who treats sick ones.
examples:
- The chicken sexer checked each chick and put the males in one box.
- A chicken sexer can tell a chick's sex within hours of hatching.
