simpleMeaning: blood vessels that run beside the main artery in the upper part of the belly
scope: 'Also called superior epigastric veins: the blood vessels that run with this artery in the upper
  belly, not other veins of the body and not the artery itself.'
examples:
- The venae epigastricae superiores run beside the superior epigastric artery.
- The surgeon traced the venae epigastricae superiores in the upper belly.
