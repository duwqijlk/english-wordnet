  and jelly-like.
scope: Also called lutefisk, this dish is made from cod fish that is dried, soaked in a harsh wash, and
  boiled until soft and jelly-like.
examples:
- The lutfisk was ready after boiling.
- Lutfisk is a dish of dried cod fish.
