simpleMeaning: being farther toward the south than any other place or thing
scope: This is for the place farther south than any other; it is not just a place in the south, and it
  is not the place farthest north.
examples:
- The southernmost town in the country stands near the sea.
- We drove to the southernmost point of the island.
