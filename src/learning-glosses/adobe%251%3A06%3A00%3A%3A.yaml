simpleMeaning: a brick made from clay dried in the sun, used in places where it stays hot and dry
scope: The sun-dried brick itself, not the clay it is made from.
examples:
- They built the small house from adobe bricks.
- Adobe walls help keep the rooms cool in the hot sun.
