simpleMeaning: A bushy plant that lives many years on the Canary Islands, with white blooms and leaves
  and hairy stems dusted with fine down; sometimes put in the Chrysanthemum group.
scope: A bushy Canary Islands plant with white blooms and downy stems, close to other dusty-leaved plants
  of the islands; also called dusty miller, silver-lace, silver lace and Chrysanthemum ptarmiciflorum.
examples:
- Tanacetum ptarmiciflorum grew in a pot on the sunny sill.
- The white flowers of Tanacetum ptarmiciflorum stood out against its grey leaves.
