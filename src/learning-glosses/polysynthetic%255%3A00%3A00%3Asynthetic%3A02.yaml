simpleMeaning: Making new words by joining parts, where each part on its own has one clear meaning
scope: Making new words by joining parts, where each part on its own has one clear meaning; agglutinative
  is another name for this sense, not making new words from one root alone and not joining words in a
  sentence.
examples:
- Polysynthetic words pack many parts into one word.
- In a polysynthetic language, one word can say a whole sentence.
