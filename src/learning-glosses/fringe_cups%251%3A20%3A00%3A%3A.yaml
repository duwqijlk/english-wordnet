simpleMeaning: A clump-forming plant with leaves mostly at the base and fringed cream or pale pink flowers
  on several long spikes, ranging from Alaska through coastal California to Idaho.
scope: Another name for false alumroot; it is a wild clump-forming plant of the Pacific coast, not a cup-shaped
  flower.
examples:
- Fringe cups lined the shaded bank of the creek.
- The damp corner of the garden suits fringe cups perfectly.
