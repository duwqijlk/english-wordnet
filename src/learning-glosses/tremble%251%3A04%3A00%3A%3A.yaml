simpleMeaning: The shaking your body does on its own when you are cold, afraid or excited.
scope: The shaking itself as a bodily reaction, not the verb for jerking about; shake and shiver are other
  names for it.
examples:
- A tremble ran through her hands as she opened the letter.
- He felt a tremble in his legs after the cold swim.
