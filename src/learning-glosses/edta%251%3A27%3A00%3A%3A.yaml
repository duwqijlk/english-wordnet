simpleMeaning: A molecule with many parts, used in medicine to grip metal bits in the body when someone
  is poisoned by lead or heavy metals.
scope: Also called ethylenediaminetetraacetic acid; a medicine that grips metal bits in the body, used
  when someone is poisoned by lead or heavy metals.
examples:
- The doctor gave her EDTA to clear the lead from her body.
- EDTA grips metal bits in the body.
