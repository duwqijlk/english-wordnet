schema: oewn-learning-gloss-v2
senseId: 'infuse%2:31:00::'
synsetId: 00607995-v
simpleMeaning: to teach something by saying it over and over, or by warning people often, so that it stays
  in their minds
scope: To teach by saying things over and over, with instill as another name for this sense, and not to
  soak a thing in liquid or to put liquid into a vein.
examples:
- Teachers infuse values into the young by repeating them.
- He tried to infuse good habits into his children.
