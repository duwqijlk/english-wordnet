simpleMeaning: A sail with four corners, hung from a long pole set at an angle to the tall main pole of
  a boat
scope: 'Also called lugsail: a four-cornered sail on a boat, not a sea worm used as fishing bait and not
  a part that sticks out on a machine.'
examples:
- The lug was hoisted from the yard at an angle to the mast.
- They raised the lug and set off across the harbour.
