simpleMeaning: A very strong-growing bamboo with thin-walled stems striped green and yellow; grown so
  widely that its home ground is not known.
scope: A very strong-growing bamboo with striped stems, also called common bamboo; set apart from other
  bamboos and from other tall grasses.
examples:
- Bambusa vulgaris grows so widely that no one knows its true home.
- The thin stems of Bambusa vulgaris are striped green and yellow.
