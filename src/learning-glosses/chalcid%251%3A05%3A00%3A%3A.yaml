simpleMeaning: Any of various tiny bugs whose young live off the eggs and young of other bugs, many of
  them good at wiping out harmful bugs.
scope: Any of various tiny bugs whose young live off the eggs and young of other bugs, also called chalcid
  fly, chalcid wasp, and chalcidfly.
examples:
- Chalcids kill harmful bugs.
- A chalcid lives off other bugs' eggs.
