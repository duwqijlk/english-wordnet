simpleMeaning: A fish caught for food and for sport, living in the sea and in fresh water off the north-west
  coast of North America.
scope: Also called white sturgeon, Acipenser transmontanus, and Sacramento sturgeon, this is a fish caught
  for food and for sport, living in the sea and in fresh water off the north-west coast of North America;
  other sturgeon live in other waters.
examples:
- The Pacific sturgeon lives in the sea and in fresh water.
- Fishermen catch Pacific sturgeon for food off the north-west coast.
