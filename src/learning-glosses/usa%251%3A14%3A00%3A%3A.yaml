simpleMeaning: The land arm of the country's armed services, which puts soldiers in order and trains them
  to fight on land.
scope: The land arm of the country's armed services, also called Army, U. S. Army, United States Army,
  and US Army; not the flying arm, the navy, or other armed services.
examples:
- He joined the USA as a soldier.
- The USA trains soldiers for land warfare.
