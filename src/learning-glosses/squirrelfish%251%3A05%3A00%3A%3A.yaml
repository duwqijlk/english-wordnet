simpleMeaning: very small brightly coloured fishes of shallow water or reefs in warm seas, active at night
  and above all red, that make sounds like the bark of a squirrel
scope: Very small bright fishes of shallow warm water, not a squirrel of the trees and not a large reef
  fish of deep water.
examples:
- The squirrelfish hid among the coral by day and came out at night.
- We heard the squirrelfish make sounds like a squirrel's bark.
