senseId: 'radiator_cap%1:06:00::'
synsetId: 04048323-n
simpleMeaning: A liquid that keeps things cool can be added through the opening at the top of the cooling
  part, and this cover closes that opening
scope: A cover for the opening at the top of a cooling part, not the part itself and not a cover for any
  other hole.
examples:
- He took off the radiator cap to check the liquid inside.
- The radiator cap was loose, so liquid leaked out.
