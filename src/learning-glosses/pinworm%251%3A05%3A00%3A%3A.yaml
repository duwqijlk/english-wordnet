simpleMeaning: A tiny thin creature that lives in the gut of a person, most often in a child.
scope: A tiny thin creature that lives in a person's gut, most often in a child; not a roundworm and not
  a tapeworm.
examples:
- The child had pinworms, and the doctor gave medicine to clear them.
- Pinworm infection is common among school children.
