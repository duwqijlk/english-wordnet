simpleMeaning: A group of flowering plants whose seeds hold two first leaves that usually show when the
  seed starts to grow
scope: A group of flowering plants with two first leaves in the seed, not a group with one first leaf;
  magnoliopsid genus is another name for this sense.
examples:
- The dicot genus includes many garden flowers.
- Botanists placed the plant in a dicot genus because its seed held two first leaves.
