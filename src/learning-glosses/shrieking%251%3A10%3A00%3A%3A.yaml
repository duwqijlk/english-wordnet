simpleMeaning: a sharp, loud cry from a person that cuts through other sounds
scope: 'Also called scream, screaming, shriek, screech and screeching: a sharp, loud cry from a person,
  not a high noise like a human cry made by a thing.'
examples:
- The shrieking from the next room made everyone run to see what was wrong.
- Her shrieking could be heard all over the house.
