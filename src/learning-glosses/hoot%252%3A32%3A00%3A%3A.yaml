simpleMeaning: to shout in a loud, noisy way
scope: To shout loudly; it is not a loud cry as a noun, not a cry that shows people are not pleased, and
  not the sound an owl makes.
examples:
- The boys hooted and banged their drums in the street.
- They hooted loudly when the band came on stage.
