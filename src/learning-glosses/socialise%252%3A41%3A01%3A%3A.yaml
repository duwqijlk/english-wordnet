simpleMeaning: To spend time with other people, talking and doing things together.
scope: Also called socialize, this is spending time with others and mixing with them, not getting a person
  ready for social life, not training them for a social setting, and not making them follow socialist
  ideas.
examples:
- He never socialises with his colleagues.
- The old man hates to socialise with neighbours.
