simpleMeaning: A thorny bush or small tree from Europe and Asia, with thick bunches of white to scarlet
  flowers followed by deep red berries; it has escaped in eastern North America.
scope: 'Also called may, whitethorn, Crataegus oxycantha or English hawthorn: a thorny bush or small tree
  with white to scarlet flowers and deep red berries, not a tall tree and not a plant without thorns.'
examples:
- Crataegus laevigata bore thick bunches of white flowers, then deep red berries.
- Crataegus laevigata has escaped in eastern North America.
