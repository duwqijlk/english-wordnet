simpleMeaning: the amount of a crop that can be sold, counted in kilograms for each hectare of land
scope: The amount of a crop that can be sold; not the whole crop grown and not the amount from one plant
  only.
examples:
- The marketable yield of peppers has increased by 5% this year.
- Farmers count the marketable yield in kilograms per hectare.
