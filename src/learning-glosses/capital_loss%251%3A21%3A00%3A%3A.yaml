simpleMeaning: the amount of money by which what a thing was bought for is more than what it is sold for,
  counted when the thing is sold
scope: The money gap between a buying price and a lower selling price, counted only when the thing is
  sold, not a gain and not a fall in value before a sale.
examples:
- She took a capital loss when she sold the shares for less than she had paid for them.
- His capital loss was fixed the day the shop was sold.
