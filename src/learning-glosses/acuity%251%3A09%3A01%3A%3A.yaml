simpleMeaning: how clearly a person can see; the power of the eyes to see small details, usually tested
  with a Snellen chart (a chart with rows of letters)
scope: Also called sharp-sightedness and visual acuity. This is clearness of seeing, not sharpness of
  mind or of hearing.
examples:
- Her acuity is good, so she can read the smallest letters on the chart.
- A test of acuity showed that he needs glasses.
