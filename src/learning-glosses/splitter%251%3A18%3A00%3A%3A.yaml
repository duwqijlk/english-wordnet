simpleMeaning: a person who sorts living things into many small groups on the basis of small differences
scope: A person who sorts living things into many small groups on the basis of small differences; divider
  is another name for this sense, not a worker who cuts logs for fences and not a person who sorts things
  into few broad groups.
examples:
- The splitter put the two moths in separate groups.
- As a splitter, she saw each small difference as a reason for a new group.
