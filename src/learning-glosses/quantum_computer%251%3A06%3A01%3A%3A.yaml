simpleMeaning: A machine that works on data by using small-scale physical effects, such as things being
  in two states at once and linked states
scope: A machine that works on data with small-scale physical effects; not an ordinary machine that works
  on data bit by bit.
examples:
- A quantum computer could solve some problems far faster than an ordinary one.
- Scientists are still building the first useful quantum computer.
