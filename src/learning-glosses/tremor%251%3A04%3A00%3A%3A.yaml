simpleMeaning: when a part of the body shakes on its own, as if from sickness or fear
scope: When a part of the body shakes on its own, as if from sickness or fear, also called shudder; not
  a shaking that usually comes from weakness or strain, and not the shaking of the ground.
examples:
- A tremor ran through her hands as she lifted the cup.
- He felt a tremor in his voice when he began to speak.
