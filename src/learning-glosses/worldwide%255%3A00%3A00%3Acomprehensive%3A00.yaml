simpleMeaning: That fits or applies to the whole world, in every place
scope: This is about a thing that fits or applies everywhere, also called general or universal, not about
  a war or policy that takes in the whole earth or a spread that reaches across the whole world.
examples:
- The book won worldwide praise from readers in every land.
- They hoped for a worldwide answer to the problem.
