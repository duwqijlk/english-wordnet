simpleMeaning: the act of making a person want to do something and giving that person a reason to do it
scope: The act of giving a reason to act, also called motivation; not the reason itself and not the act
  that follows.
examples:
- Motivating is hard when the team is tired and low.
- Good motivating gives workers a clear reason to try harder.
