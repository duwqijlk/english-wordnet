simpleMeaning: a dark oil that smells bad, got by heating bone till it chars, used above all in sheep
  dips and to make alcohol unfit to drink
scope: A dark, bad-smelling oil from heated bone, not the liquid fat from bone used as a lubricant.
examples:
- The farmer used bone oil in the sheep dip.
- Bone oil is added to alcohol to make it unfit to drink.
