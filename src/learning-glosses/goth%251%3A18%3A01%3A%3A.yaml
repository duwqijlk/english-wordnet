simpleMeaning: A rough, rude person with bad manners and no taste or polish.
scope: A rough, rude person with no manners, also called a peasant, a barbarian, a boor, a churl, a tyke
  and a tike; not a member of the old Germanic people.
examples:
- The Goth at the feast ate with his hands and shouted.
- No one called him a Goth to his face.
