simpleMeaning: the act or practice of stopping yourself from having something you want very much
scope: The act or practice of holding back from what you want, not the personal quality sense, which is
  about a person who does this, especially with alcohol.
examples:
- His abstinence from rich food lasted for a whole month.
- Abstinence from drink helped him stay well during his illness.
