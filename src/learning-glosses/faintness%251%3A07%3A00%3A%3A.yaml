simpleMeaning: how dim something looks, or how little clear difference there is between its light and
  dark parts
scope: 'Also called dimness: this is about how dim a light, colour or picture looks, not about lacking
  courage and not about feeling ready to faint.'
examples:
- The faintness of the old photo made the faces hard to see.
- The faintness of the colours made it hard to tell one shape from another.
