simpleMeaning: A group-living bug of neat colonies; as a rule the breeding queen and the males have wings
  at mating time, while females without wings, who cannot breed, do the jobs.
scope: A group-living bug of neat colonies; as a rule the breeding queen and the males have wings at mating
  time, while females without wings, who cannot breed, do the jobs, also called ant and pismire.
examples:
- The emmet lives in a neat colony.
- Emmets do the jobs.
