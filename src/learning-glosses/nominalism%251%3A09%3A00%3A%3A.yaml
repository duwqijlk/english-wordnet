simpleMeaning: In philosophy, the idea is that the word itself is all that things called by the same word
  have in common
scope: In philosophy, the idea that things sharing a word share nothing else, not realism, which holds
  that shared words point to real shared kinds.
examples:
- Nominalism holds that the word 'tree' does not point to one real thing shared by all trees.
- She defended nominalism in her essay on how words work.
