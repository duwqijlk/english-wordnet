simpleMeaning: to do with a group that makes laws for a country or state, or made up of the people in
  that group
scope: This sense is about a law-making group or its members, not about a law itself or a law made by
  that group.
examples:
- She sits on the legislative council for the state.
- The legislative members met to vote today.
