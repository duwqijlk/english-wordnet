simpleMeaning: To make a thing work as well as it can, getting the most from it and using it in the best
  way
scope: Making a thing work as well as it can, getting the most from it, not acting as a hopeful person
  and not changing a thing to make it store more or cost less.
examples:
- We optimized the route to save time and fuel.
- She optimized her study plan to get the most from each hour.
