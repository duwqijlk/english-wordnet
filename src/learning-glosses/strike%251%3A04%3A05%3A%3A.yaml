simpleMeaning: In baseball, a pitch the batter misses, hits into foul ground, or leaves alone when the
  umpire judges it to cross home plate between the knees and shoulders.
scope: A pitch call in baseball, not a refusal to work, a military attack, or a bowling score.
examples:
- The pitcher worked the count to two strikes before throwing a slider off the plate.
- The umpire called a strike on a pitch that looked low and outside.
