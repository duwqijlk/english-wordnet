simpleMeaning: Any of the tests used to find out whether a baby still in the womb has a fault in its body
  from birth
scope: This is any of the tests used to find out whether a baby still in the womb has a fault in its body
  from birth, not a test on a baby after it is born and not a treatment.
examples:
- Prenatal diagnosis showed the baby was well.
- The doctor offered prenatal diagnosis to check for a fault from birth.
