simpleMeaning: Sudden jerks of the thumb and first finger that come on while holding a pen or pencil
scope: 'Also called graphospasm: sudden jerks of the thumb and first finger while holding a pen or pencil,
  not a cramp in the leg and not a shaking hand from drink.'
examples:
- Writer's cramp made it hard for him to finish the letter.
- Her writer's cramp eased when she switched to a thicker pen.
