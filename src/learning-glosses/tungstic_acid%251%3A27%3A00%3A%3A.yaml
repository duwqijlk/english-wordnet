simpleMeaning: An acid of tungsten and oxygen, often made of many parts joined together, formed by making
  a tungsten liquid that is alkaline, the opposite of an acid, neutral.
scope: This acid of tungsten and oxygen is often made of many parts joined together and is formed by making
  an alkaline tungsten liquid neutral.
examples:
- The tungsten liquid that is alkaline was made neutral, and tungstic acid formed.
- A tungsten liquid that is alkaline gave tungstic acid when it was made neutral.
