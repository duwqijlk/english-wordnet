simpleMeaning: Blood liquid holding defence parts that fight certain harmful substances, which protects
  a person from a disease.
scope: A blood liquid that protects against a disease, not ordinary blood and not a drug that kills germs
  in the body.
examples:
- The doctor gave him antiserum after the snake bite.
- Antiserum from a horse protected the child from the disease.
