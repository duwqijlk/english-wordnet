simpleMeaning: Cherries, tomatoes, rubies, and the liquid that runs in the body all show this colour,
  which sits at the far end of the rainbow, next to orange.
scope: This colour is also called red, scarlet, crimson, ruby, cherry, reddish, ruddy, carmine, cerise,
  cherry-red, or ruby-red.
examples:
- The blood-red berries stood out against the green leaves.
- A blood-red scarf hung by the door.
