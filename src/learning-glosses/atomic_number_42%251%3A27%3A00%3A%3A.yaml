simpleMeaning: A kind of metal that joins with many other atoms and acts like chromium and tungsten; used
  to make steel stronger and harder.
scope: A kind of metal that acts like chromium and tungsten, also called Mo and molybdenum; set apart
  from chromium and tungsten themselves and from metals that do not harden steel.
examples:
- Atomic number 42 makes steel stronger and harder.
- In some ways atomic number 42 acts like chromium.
