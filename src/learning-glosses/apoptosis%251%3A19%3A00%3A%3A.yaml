simpleMeaning: A kind of cell death in which the cell kills itself with its special cell workings, letting
  animals check cell numbers and clear cells that threaten the animal's life.
scope: Also called caspase-mediated cell death and programmed cell death, a kind of cell death in which
  the cell kills itself with its special cell workings, letting animals check cell numbers and clear cells
  that threaten the animal's life.
examples:
- Apoptosis lets animals check cell numbers.
- Apoptosis kills the cell itself.
