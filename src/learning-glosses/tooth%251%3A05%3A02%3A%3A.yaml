simpleMeaning: a hard pointed part in animals without a backbone, found in the mouth, in the tube food
  goes through, or on a shell
scope: This is the small hard part in animals without a backbone, not the hard parts in the jaws of animals
  with a backbone used for biting, and not a pointed part on a gear.
examples:
- The snail uses a tiny tooth in its mouth to scrape food from the rock.
- With a microscope, we could see a small tooth on the animal's shell.
