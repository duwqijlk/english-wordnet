simpleMeaning: a person who reads the set passages aloud in a church service, or who holds a low rank
  in the Roman Catholic Church
scope: A church reader of lessons or a low-rank church officer, not a person who judges books or checks
  printed proofs.
examples:
- The reader stood to read the lesson from the Bible.
- He was made a reader in the church when he was young.
