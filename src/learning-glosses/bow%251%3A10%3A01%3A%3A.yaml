simpleMeaning: A sign of respect, submission, shame, or greeting made by bending the head, body, or knee.
scope: This is the bodily gesture, not the performers' return to the stage after a show and not the shoelace
  knot.
examples:
- He gave a deep bow as the queen entered the room.
- She made a small bow of apology after bumping into him.
