  mark this toy dog of the spaniel kind.
scope: Among toy dogs, this spaniel kind is the one with ears that stand up and a black-spotted coat of
  brown to white.
examples:
- The papillon sat with its ears standing up.
- A papillon ran across the room, its spotted coat clear to see.
