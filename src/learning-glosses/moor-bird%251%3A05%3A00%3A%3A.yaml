simpleMeaning: This grouse lives on the high open land of Great Britain, and it is red-brown in colour
scope: 'Also called a moorbird, a moorfowl or moorgame: a red-brown grouse of the high open land of Great
  Britain, not a lowland grouse and not a grouse of another country.'
examples:
- A moor-bird rose from the heather as we crossed the hill.
- They saw a moor-bird among the heather on the hill.
