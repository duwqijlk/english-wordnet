simpleMeaning: In statistics, a link between two or more things that can change, where when one changes,
  the other changes too in a regular way
scope: Also called correlational statistics, this is the link itself between things that change, not the
  number from -1 to +1 that shows how strong the link is.
examples:
- There is a strong correlation between study time and test scores.
- The study found a correlation between heat and ice cream sales.
