simpleMeaning: Putting a person to death by the old way, used far and wide in the ancient world, of fixing
  their hands and feet to a cross.
scope: Putting a person to death on a cross, not the figurative sense of causing great pain or suffering.
examples:
- The crucifixion of the rebels was carried out at dawn.
- Roman law used crucifixion for slaves and rebels.
