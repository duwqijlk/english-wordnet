simpleMeaning: a friendly printed or handwritten message left behind to show that you stopped by
scope: Not the stiff paper itself and not a computer part; this sense is the message left after a call.
examples:
- Nobody was home, so she left a card under the door.
- The visitors left a card on the hall table to show they had called.
