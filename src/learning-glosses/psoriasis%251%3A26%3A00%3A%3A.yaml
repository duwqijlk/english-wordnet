simpleMeaning: A skin illness that lasts a long time, with dry red patches covered in scales, found especially
  on the scalp, ears, genitals, and the skin over bones that stick out.
scope: A long-lasting skin disease; the places named are where the patches most often appear.
examples:
- Psoriasis left dry red patches on his elbows.
- Her psoriasis was worst on her scalp in winter.
