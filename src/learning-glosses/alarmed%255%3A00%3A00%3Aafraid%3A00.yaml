simpleMeaning: feeling suddenly afraid because you think danger is near
scope: This describes a person who feels sudden fear, not a warning sound and not a thing that warns people
  of danger.
examples:
- She felt alarmed when she heard a loud noise in the dark house.
- He was alarmed by the smoke coming from the kitchen.
