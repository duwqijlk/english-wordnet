simpleMeaning: Large or generous enough to let someone live at ease.
scope: This is about an amount being enough for ease, not about a person being wealthy, and not about
  physical or mental ease itself.
examples:
- The job pays a comfortable salary, enough for all their needs.
- They set aside a comfortable amount for the trip.
