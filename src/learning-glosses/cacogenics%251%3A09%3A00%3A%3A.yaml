simpleMeaning: the study of how things work to cause a worsening in the kind of young that are born
scope: 'Also called dysgenics: the study of what makes the kind of young that are born worse, not the
  study of how to make them better and not the study of sickness in grown people.'
examples:
- Her book on cacogenics looks at how bad food and drink can harm the young.
- The class in cacogenics studied the forces that weaken the young born later.
