simpleMeaning: a part in a television camera that turns light into electric signals, made from a surface
  that reacts to light
scope: A light-sensitive part inside a television camera that turns light into electric signals, not a
  picture made of small pieces and not a pattern like one.
examples:
- The mosaic in the camera tube turned the scene into a signal.
- Engineers cleaned the mosaic so the picture stayed sharp.
