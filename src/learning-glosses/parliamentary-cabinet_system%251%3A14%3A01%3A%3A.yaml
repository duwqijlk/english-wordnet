simpleMeaning: a way of running a country in which a small group of top leaders together set what the
  government does, above all in the laws the elected law-makers pass
scope: A way of running a country where a small group of top leaders together set the government's course,
  not rule by one leader and not rule by the law-makers alone.
examples:
- Under a parliamentary-cabinet system, the top leaders decide together.
- The parliamentary-cabinet system gives the small group of leaders the main say.
