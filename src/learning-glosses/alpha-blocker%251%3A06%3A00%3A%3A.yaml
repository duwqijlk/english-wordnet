simpleMeaning: Any of several drugs that block alpha-adrenergic receptors, used to treat a swollen prostate,
  easing the muscles of the prostate and bladder.
scope: Also called alpha blocker, alpha-adrenergic blocker, and alpha-adrenergic blocking agent, any of
  several drugs that block alpha-adrenergic receptors, used to treat a swollen prostate, easing the muscles
  of the prostate and bladder.
examples:
- Alpha-blockers ease the prostate.
- The doctor gave alpha-blockers.
