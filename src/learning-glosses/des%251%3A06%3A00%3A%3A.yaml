simpleMeaning: A man-made drug, not a steroid, like the sex hormone estrogen; once used for period troubles,
  but tied to cancers of the vagina in daughters of women treated while pregnant.
scope: This is the drug also called diethylstilbesterol and stilbesterol, not the strong estrogen used
  in drugs and animal feed.
examples:
- DES was once given to women in pregnancy.
- Doctors stopped using DES when the risks came out.
