simpleMeaning: A meaning that is not clear to the senses and not clear to plain thought, and that goes
  past what most people can grasp
scope: Carrying a hidden meaning beyond plain thought; secret and mysterious are other names for this
  sense, not a person who seeks hidden truths and not to do with the practice of mysticism.
examples:
- The mystic symbols on the wall meant more than they seemed.
- She spoke in mystic words that few could follow.
