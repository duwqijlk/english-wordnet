simpleMeaning: The smallest whole number, or the mark that stands for that number
scope: The smallest whole number, or the mark that stands for that number; one, single, ace, unity and
  1 are other names for this sense, and it is not the smallest part of a thing nor the first of a list.
examples:
- In Roman numerals, I stands for the number one.
- Write I for the first number in the list.
