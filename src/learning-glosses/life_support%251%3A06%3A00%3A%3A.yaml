simpleMeaning: medical machines that take over key body jobs for a very sick person, so the person stays
  alive when they might not live without them
scope: This is medical equipment that keeps a very sick person alive; life-support system is another name
  for it, not a floating jacket and not a machine that only watches the heart.
examples:
- The patient is on life support.
- Doctors kept him on life support until his lungs could work again.
