simpleMeaning: To do with the group of sea animals that includes the octopus and the squid.
scope: Of the group of sea animals that includes the octopus and the squid; not the sea animal itself,
  a soft-bodied creature with a big head and eyes and arms that grip with suckers.
examples:
- The creature was cephalopod, with arms round its head.
- The octopus is cephalopod in kind, not a fish.
