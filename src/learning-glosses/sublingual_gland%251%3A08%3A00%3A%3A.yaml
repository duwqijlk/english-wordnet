simpleMeaning: Mucin, the thick sticky part of spit, is made by a small spit gland that lies under the
  tongue on both sides of a person's mouth.
scope: 'Also called sublingual salivary gland: a small spit gland under the tongue that makes the thick
  sticky part of spit.'
examples:
- The sublingual gland sits under the tongue on each side of the mouth.
- The dentist pointed to the sublingual gland beneath her tongue.
