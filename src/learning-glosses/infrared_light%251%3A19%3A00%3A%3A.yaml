simpleMeaning: Waves of energy longer than what our eyes see but shorter than radio waves.
scope: Waves of energy longer than what our eyes see but shorter than radio waves; also called infrared,
  infrared emission and infrared radiation, not the light our eyes see and not radio waves.
examples:
- Infrared light warms the skin without being seen.
- The remote control sends infrared light to the television.
