simpleMeaning: Of or to do with the region it is named for, its people, their tongues or their ways of
  life.
scope: Also called Mongolian; of or to do with the region it is named for, its people, their tongues or
  their ways of life, not the people themselves and not the sense that means only the modern People's
  Republic.
examples:
- The Mongol invaders rode across the land.
- Mongol customs differ from those of neighbouring lands.
