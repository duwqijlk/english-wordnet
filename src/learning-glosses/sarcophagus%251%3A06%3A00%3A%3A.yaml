simpleMeaning: a box made of stone for a dead body, usually with pictures or words cut into the stone
scope: A stone box for a dead body, usually with pictures or words cut into it; not a coffin made of wood
  and not a whole room where a body is kept.
examples:
- The king's body was placed in a stone sarcophagus.
- In the museum, we saw a sarcophagus with pictures cut into its side.
