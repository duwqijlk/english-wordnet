simpleMeaning: in the best possible way
scope: This means a thing is done in the best way there is; it is not just good enough, and it is not
  done in a poor way.
examples:
- The shelf is placed optimally, so every tool is easy to reach.
- She timed the trip optimally and missed the heavy traffic.
