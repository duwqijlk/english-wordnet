simpleMeaning: A sharp, sudden fall in trade or share prices, often one that drags other things down with
  it.
scope: 'Means the same as collapse: a steep, sudden slump in trade or share values, not a vehicle collision,
  a loud noise, or the verb for a market falling.'
examples:
- The crash wiped billions off share values in a single day.
- Economists warned that a crash in the housing market could spread to the banks.
