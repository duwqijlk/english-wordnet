simpleMeaning: a chief or ruler who rules on his own, most often in Africa or Arabia
scope: This is a chief or ruler who rules on his own, with amir, emeer and emir as other names for this
  sense, and not a king who rules a whole country or a chief who answers to a higher ruler.
examples:
- The ameer welcomed the travellers to his court.
- In the past, an ameer ruled the desert lands of Arabia.
