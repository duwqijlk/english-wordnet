simpleMeaning: A person who studies the brain, the spinal cord, and the nerves, and how they carry messages
  in the body
scope: This is a person who studies the brain, the spinal cord, and the nerves; not a doctor who treats
  them and not a person who studies the brain alone.
examples:
- The neurobiologist studied how the nerves carry signals.
- She became a neurobiologist after years of study.
