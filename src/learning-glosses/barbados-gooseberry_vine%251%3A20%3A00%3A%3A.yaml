simpleMeaning: A woody climber of the West Indies with spiny stems and many sweet-smelling white flowers
  in branched clusters, and then small yellow to orange fruits.
scope: Also called Barbados gooseberry and Pereskia aculeata; a woody climber of the West Indies with
  spiny stems and sweet-smelling white flowers, distinct from other woody climbers with thornless stems
  or single flowers.
examples:
- The Barbados-gooseberry vine climbs over the wall with white flowers.
- We planted a Barbados-gooseberry vine by the fence.
