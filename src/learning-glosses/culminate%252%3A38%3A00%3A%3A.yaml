senseId: 'culminate%2:38:00::'
synsetId: 02025625-v
simpleMeaning: of a body in the sky, to reach its highest point or cross the meridian, the line overhead
  that runs north to south
scope: This is said of a body in the sky, such as the sun, the moon or a star, at its highest point; not
  of an event or a piece of work ending at its best point.
examples:
- The bright star culminates at about midnight tonight.
- At noon the sun culminates over the town.
