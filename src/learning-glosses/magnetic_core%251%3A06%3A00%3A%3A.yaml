simpleMeaning: One bit of data was once held in this tiny ring of iron stuff, in a memory where any bit
  could be reached at once, until chips pushed it out.
scope: Also called core, it is a tiny ring that once held one bit of data in a memory where any bit could
  be reached at once, now pushed out by chips.
examples:
- Each magnetic core had three wires passing through it.
- Each magnetic core held a single bit.
