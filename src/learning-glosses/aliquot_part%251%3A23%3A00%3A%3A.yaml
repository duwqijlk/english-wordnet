simpleMeaning: a whole number that fits into a bigger number an exact number of times
scope: 'Another name for an aliquot: a whole number that divides a bigger number exactly, not an aliquant
  part that does not divide a number exactly.'
examples:
- 4 is an aliquot part of 12.
- An aliquot part of 30 is 6.
