simpleMeaning: a desert shrub of Syria and Arabia with small white flowers; it is the plant of the Old
  Testament, and is sometimes put in the plant group Genista
scope: 'Also called juniper, raetam, or retem: a desert shrub of Syria and Arabia, not a garden juniper
  and not any other desert shrub.'
examples:
- The juniper bush grew low among the rocks, its small white flowers bright in the sun.
- Travellers in the Syrian desert rested in the shade of a juniper bush.
