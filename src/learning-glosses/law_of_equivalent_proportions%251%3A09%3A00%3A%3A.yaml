simpleMeaning: In chemistry, the amounts in which two things join with each other match the amounts in
  which each joins with a third.
scope: People also call it law of reciprocal proportions, the rule that two things join with a third in
  the same amounts as they join with each other.
examples:
- The law of equivalent proportions says the two elements join in the same amounts as each joins with
  the third.
- By the law of equivalent proportions, the two elements combined in the same amounts as with the third.
