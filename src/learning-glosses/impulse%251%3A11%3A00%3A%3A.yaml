senseId: 'impulse%1:11:00::'
synsetId: 07322660-n
simpleMeaning: electric power that flows suddenly along a nerve fiber (a long, thin thread that carries
  electric signals in the body)
scope: The electric signal that moves along a nerve in the body. Not the short wave in an electric circuit,
  and not a sudden wish to do something.
examples:
- An impulse travels along the nerve to the brain.
- The nerve impulse told her brain that her hand was hot.
