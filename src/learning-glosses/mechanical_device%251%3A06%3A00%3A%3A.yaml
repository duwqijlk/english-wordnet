simpleMeaning: Its parts move in a set way, and that movement does the work of this thing
scope: A thing made of moving parts that works by the way they move, not a thing that works by power from
  a wire and not a tool used by hand.
examples:
- The mechanical device in the clock moved the hands.
- She fixed the broken mechanical device on the farm machine.
