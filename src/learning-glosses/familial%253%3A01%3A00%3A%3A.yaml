senseId: 'familial%3:01:00::'
synsetId: 02952096-a
simpleMeaning: relating to or having the traits of parents, children, and other close relations as one
  group
scope: About a family and what its people are like. It is not about a trait or illness that usually passes
  from parents to children among family members.
examples:
- They come from the same familial background and were raised in the same town.
- The house has a warm, familial feel, like a home full of close relations.
