simpleMeaning: a dance in which a dancer slowly takes off clothes to music, meant to excite people in
  a sexual way
scope: 'Also called a strip or a striptease: a dance in which a person slowly takes off clothes to music
  to excite people, not a dance in which the person stays dressed.'
examples:
- The strip show at the club drew a large crowd.
- She watched a strip show in which the dancer slowly took off her clothes to music.
