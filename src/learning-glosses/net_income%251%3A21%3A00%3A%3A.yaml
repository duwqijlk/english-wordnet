simpleMeaning: The money left when all costs for a set time, including wear on equipment and other costs
  not paid in cash, are taken from what a business takes in.
scope: The money left when all costs for a set time are taken from what a business takes in; also called
  net, profit, earnings, profits, lucre, and net profit.
examples:
- The firm's net income rose after costs fell.
- Net income is what is left after every cost for the year is paid.
