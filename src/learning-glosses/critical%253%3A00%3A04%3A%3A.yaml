senseId: 'critical%3:00:04::'
synsetId: 00654957-a
simpleMeaning: Describing the threshold where a property or event changes suddenly, especially the amount
  of material needed to keep a chain reaction going.
scope: This is the physical threshold sense, not 'finding fault,' not 'careful evaluation,' not 'urgently
  needed,' not 'a turning point in events,' not 'close to crisis,' and not 'relating to critics or criticism.'
examples:
- The reactor needs a critical mass of fuel before the chain reaction can sustain itself.
- At a critical temperature, the substance suddenly changes from one state to another.
