simpleMeaning: a place to stay in some eastern countries with a large open yard where travelling groups
  can sleep and rest
scope: 'Also called caravan inn, caravansary and khan: a rest place for travelling groups in eastern lands,
  not an ordinary inn and not a stable for animals alone.'
examples:
- The traders spent the night at a caravanserai on the road east.
- We reached the caravanserai before dark and rested in its large courtyard.
