simpleMeaning: not able to tell one or more shades apart
scope: Not able to tell some shades apart; also called colour-blind, and not a person who cannot see at
  all.
examples:
- He is color-blind and cannot tell red from green.
- The color-blind chart uses dots to test which shades she can see.
