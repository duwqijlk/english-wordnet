simpleMeaning: a long, thin brush with a pointed end, made of sable hair (soft hair from a small animal),
  used by artists
scope: A long, thin, pointed brush used by artists, not a sailing boat or ship with a stated kind of sails
  and ropes.
examples:
- She used a fine rigger to paint the thin lines of the ship.
- The artist picked up a rigger for the long, fine strokes.
