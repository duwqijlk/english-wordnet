simpleMeaning: a kind of music that began in the 1970s, trying to mix in jazz and other kinds of music,
  and meant for listening, not for dancing
scope: A kind of music from the 1970s that tries to mix in jazz and other kinds of music; also called
  art rock; not music meant for dancing, and not jazz on its own.
examples:
- They played progressive rock all evening, and no one danced.
- Progressive rock bands in the 1970s mixed jazz into their long songs.
