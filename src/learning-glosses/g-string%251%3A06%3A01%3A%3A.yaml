simpleMeaning: Tiny clothing worn by people who strip, a narrow strip of cloth that covers the front,
  runs between the legs, and is held up by a band around the waist.
scope: Also called a thong; the smallest item of clothing worn on stage, not a swim suit.
examples:
- The dancer wore a G-string on stage.
- A G-string leaves little covered.
