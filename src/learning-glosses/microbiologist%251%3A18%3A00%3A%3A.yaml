simpleMeaning: a person whose work is to study tiny living things that are too small to see with the eye
  alone
scope: A person who studies tiny living things as a job, not a doctor who treats sick people, and not
  a person who studies large plants or animals.
examples:
- A microbiologist found new bacteria in the soil sample.
- The microbiologist tested the water in the lab for tiny living things.
