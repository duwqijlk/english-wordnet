senseId: 'attention_deficit_hyperactivity_disorder%1:26:00::'
synsetId: 14079762-n
simpleMeaning: a health problem in which a child or adult cannot sit still, acts without thinking, and
  lets strong feelings take over
scope: 'Also called attention deficit disorder, hyperkinetic syndrome, minimal brain damage, or minimal
  brain dysfunction: a health problem marked by restlessness, sudden acts, and feelings that are hard
  to keep in check, not a lack of sleep and not bad behaviour alone.'
examples:
- His attention deficit hyperactivity disorder makes long lessons hard to sit through.
- She was given help for her attention deficit hyperactivity disorder at school.
