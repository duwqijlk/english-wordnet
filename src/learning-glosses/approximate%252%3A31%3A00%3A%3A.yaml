simpleMeaning: to give a rough number or time that you think is probably right but are not sure about
scope: To make a rough guess at a number or a time, also called guess, judge, estimate, and gauge; not
  to measure exactly and not to come close in looks or size.
examples:
- I approximated the chicken at about three pounds.
- She approximated how long the trip would take.
