simpleMeaning: to give what is wanted or needed, or to meet a rule, need, or limit
scope: 'Also called meet, fit, and fill: to give what is wanted or needed, or to meet a rule, need, or
  limit, not to make a person feel glad.'
examples:
- This paper does not satisfy the rules for the degree.
- Her pay does not satisfy what her family needs.
