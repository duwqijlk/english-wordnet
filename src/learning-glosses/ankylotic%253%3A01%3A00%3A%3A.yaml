simpleMeaning: about, or like, the fault in which the bones of a joint stick together and cannot move
scope: Said of a thing about, or like, the fault in which the bones of a joint stick together and cannot
  move, not of a broken joint and not of a stiff muscle.
examples:
- The ankylotic joint could no longer bend.
- An ankylotic change in the knee left the leg stiff.
