simpleMeaning: A star-gazing glass that uses mirrors, in which the image is seen through a side piece
  set at a right angle to the main tube
scope: Also called Newtonian reflector; a star-gazing glass that uses mirrors, not a glass that uses lenses
  and not a pair of field glasses.
examples:
- The Newtonian telescope gave a clear view of the rings of Saturn.
- He set up his Newtonian telescope in the garden at night.
