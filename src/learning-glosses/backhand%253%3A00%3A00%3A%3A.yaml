simpleMeaning: In games like tennis, a hit made by swinging the arm across the body, with the back of
  the hand facing the way the ball goes
scope: Not handwriting that slants backward, and not the act of hitting the ball in this way.
examples:
- She hit a strong backhand down the line.
- His backhand is better than his forehand.
