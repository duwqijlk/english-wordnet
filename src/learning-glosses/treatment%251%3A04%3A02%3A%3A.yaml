simpleMeaning: in medicine, the work of looking after someone, for example by giving drugs or special
  exercises.
scope: This is looking after a person medically, not care provided to improve a situation in general,
  especially medical procedures or applications meant to relieve illness or injury, not the managing of
  someone or something, not an artist's way of handling a subject, and not an extended discussion of a
  topic.
examples:
- She is having treatment for a knee injury at the sports clinic.
- The doctors recommended a course of treatment that included daily exercises.
