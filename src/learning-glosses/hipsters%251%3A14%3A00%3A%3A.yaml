simpleMeaning: Mostly middle-class young people from 1960s San Francisco, speaking for love and peace
  for all, living together, with long hair and mild drugs, liking acid rock and progressive rock
scope: Also called hippies and flower people, this is the 1960s San Francisco youth group described here,
  not young people today who follow the newest fashion.
examples:
- In the 1960s, hipsters in San Francisco lived together and grew their hair long.
- Many hipsters at that time listened to acid rock and sang about peace.
