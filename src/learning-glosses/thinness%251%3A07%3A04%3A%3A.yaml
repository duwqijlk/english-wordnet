simpleMeaning: the quality of being few and spread far apart, with much empty space between
scope: 'Also called spareness: how few and spread out things are, not how narrow something is from one
  side to the other.'
examples:
- The thinness of the crowd made the big hall feel empty.
- She noticed the thinness of his hair at the front.
