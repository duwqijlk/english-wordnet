simpleMeaning: A weaker kind of the germ that causes a serious disease of the skin brings on a mild kind
  of that disease
scope: 'Also called alastrim, pseudosmallpox and pseudovariola: a mild kind of a serious skin disease,
  not the full disease and not a rash from another cause.'
examples:
- The doctor said the milk pox was a mild case.
- He caught milk pox as a boy and soon felt well again.
