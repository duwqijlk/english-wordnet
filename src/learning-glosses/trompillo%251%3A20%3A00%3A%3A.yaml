simpleMeaning: A nightshade weed with silvery leafage and blooms of white, blue, and violet, with a round
  berry used to turn milk, growing from the mid-United States toward South America.
scope: This sense is also called prairie berry, purple nightshade, silver-leaved nettle, silver-leaved
  nightshade, silverleaf nightshade, and white horse nettle.
examples:
- A trompillo grew by the fence.
- Trompillos bear roundish berries.
