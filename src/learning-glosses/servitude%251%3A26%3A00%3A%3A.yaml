simpleMeaning: the state of being controlled by an owner or master, or work a person is forced to do as
  a punishment
scope: Being controlled by an owner or master, or forced work as a punishment; not free work that a person
  chooses and is paid for.
examples:
- He spent ten years in servitude after he was captured.
- The court gave him five years of penal servitude for the crime.
