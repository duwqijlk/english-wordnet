simpleMeaning: So silly and far from good sense that people laugh at it in scorn
scope: So silly and far from good sense that people laugh at it in scorn; ridiculous, absurd, ludicrous
  and idiotic are other names for this sense; not merely wrong, and not merely strange.
examples:
- The idea that the dog had eaten his homework was preposterous.
- She made a preposterous claim that she could fly to the moon.
