simpleMeaning: a piece of jewellery that is fixed onto the clothes a person is wearing
scope: A piece of jewellery fixed onto clothes, not a small thin piece of wood or metal used to hold things
  together and not a wooden thing used in bowling.
examples:
- She wore a gold pin on her coat.
- The pin on her dress was shaped like a flower.
