simpleMeaning: No jaws and no paired limbs mark this long thin animal with a backbone, shaped like an
  eel, and the round-mouthed kinds and some kinds now gone are among them.
scope: 'Also called a jawless fish or a jawless vertebrate: a long thin animal with a backbone and no
  jaws, not a fish with jaws and paired fins.'
examples:
- The agnathan had no jaws and no paired limbs.
- An agnathan swims like an eel but has no jaws.
