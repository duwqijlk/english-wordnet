simpleMeaning: To hold on to big fish or moving things, this sea fish uses a sucking disc on its head,
  and its body is long and flat.
scope: Also called a suckerfish or sucking fish, this sea fish holds on to big fish or moving things with
  a disc on its head.
examples:
- The remora stayed fixed to the big fish.
- A remora used its sucking disc to hold on.
