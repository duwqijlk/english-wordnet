simpleMeaning: A graceful shrub or small tree that loses its leaves each year, with pretty leaves and
  small red berries that turn black when ripe and are used to make wine.
scope: This is a graceful shrub or small tree with pretty leaves, also called makomako, wineberry, Aristotelia
  serrata and New Zealand wine berry; its small red berries turn black when ripe and are used to make
  wine.
examples:
- Aristotelia racemosa bore small red berries.
- We made wine from the berries of Aristotelia racemosa.
