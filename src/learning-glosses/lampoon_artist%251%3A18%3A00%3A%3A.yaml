simpleMeaning: A drawer of cartoons who makes fun of people and events in public life by showing them
  in a silly or biting way
scope: This is a drawer of cartoons who makes fun of people and events in public life, not a maker of
  funny drawings for children and not a writer of jokes.
examples:
- The lampoon artist drew the mayor with an oversized nose.
- A lampoon artist mocked the new law in the morning paper.
