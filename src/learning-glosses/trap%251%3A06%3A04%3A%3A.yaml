simpleMeaning: a drain made of a U-shaped length of pipe that holds liquid and so stops bad smells from
  below from coming back up
scope: A drain made of a U-shaped length of pipe that holds liquid, not a machine that throws clay discs
  and not a thing that catches you when you do not see it coming.
examples:
- The trap under the sink holds water to keep bad smells out.
- A blocked trap can let smells come back up the pipe.
