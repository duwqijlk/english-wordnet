simpleMeaning: any of several woody plants of the group Morus, with fruit that can be eaten and looks
  like a blackberry
scope: 'Also called a mulberry: any of several woody plants of the group Morus, with fruit that can be
  eaten and looks like a blackberry; not a blackberry bush and not a fruit tree of another kind.'
examples:
- The mulberry tree bore dark fruit in June.
- Mulberry trees line the old garden wall.
