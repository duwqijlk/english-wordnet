simpleMeaning: so bad or painful that a person cannot put up with it or live with it
scope: 'Also called unbearable and intolerable: so bad that a person cannot put up with it, not just hard
  or not liked.'
examples:
- The heat in the small room was unendurable, so we went outside.
- He found the long wait unendurable and left early.
