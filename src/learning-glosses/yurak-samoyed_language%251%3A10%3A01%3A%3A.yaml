simpleMeaning: One of the Uralic group of northern ways of speaking in Europe and Asia, this way of speaking
  belongs to the people who live in northern Siberia
scope: Also called Nenets, Nentsi or Nentsy, and Nenets language, Nentsi language, Nentsy language or
  Yurak-Samoyed; it is the way of speaking of the people of northern Siberia, not a different language
  of the north.
examples:
- The Yurak-Samoyed language is taught in a small school in the north.
- He wrote a book about the grammar of the Yurak-Samoyed language.
