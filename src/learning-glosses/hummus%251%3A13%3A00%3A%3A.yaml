simpleMeaning: a thick spread made from mashed chickpeas, tahini (a sesame paste), lemon juice and garlic;
  used especially as a dip for pita; it first came from the Middle East
scope: Also called humus, hommos, hoummos and humous. This is the chickpea food used as a dip; it is not
  a main dish and not a sweet spread.
examples:
- We ate hummus with warm pita for lunch.
- He made hummus from chickpeas, lemon juice and garlic.
