simpleMeaning: a sharp point made when two curved lines meet, as on the inside of a pointed arch
scope: A point where two curves meet, as in an arch; not the small flap in the heart and not the raised
  point on a tooth.
examples:
- The cusp of the arch was sharp and clean.
- They carved a cusp where the two arcs met above the window.
