simpleMeaning: very different or coming so suddenly that it gives a person a short shock or fear
scope: This is for something so different or so sudden that it gives a short shock or fear; not for a
  small surprise and not for a slow, expected change.
examples:
- The startling news made everyone stop and stare.
- A startling change in his face frightened us for a moment.
