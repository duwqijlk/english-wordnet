simpleMeaning: a body chemical that can change back and forth into ADP and ATP, found in muscle cells
  where it helps turn food into power
scope: It is also called adenylic acid, and it is a body chemical found in muscle cells that helps turn
  food into power.
examples:
- The lab found adenosine monophosphate in the muscle cells.
- The muscle cells held adenosine monophosphate that could change into ADP and back again.
