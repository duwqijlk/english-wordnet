simpleMeaning: showing great skill at tricking people, usually while keeping the plan secret.
scope: This is not about distance from top to bottom or strength of feeling; it is about a person being
  secretly clever and tricky.
examples:
- He plays a deep game and never lets anyone see his real plan.
- The novel's villain is deep and patient, hiding his purpose for years.
