simpleMeaning: The Catawba Indians long used the leaves of this thick plant of the eastern United States,
  which lives for years and bears whitish flowers, to treat burns.
scope: 'Also called wild quinine: a thick plant of the eastern United States with whitish flowers, whose
  leaves the Catawba Indians long used to treat burns.'
examples:
- Prairie dock grew along the edge of the field, its whitish flowers open in the sun.
- The Catawba Indians used prairie dock leaves to treat burns.
