simpleMeaning: a fold of fat hanging under the lower part of the face
scope: 'Also called buccula: a fold of fat under the lower part of the face, not a beard and not fat elsewhere
  on the body.'
examples:
- He noticed a double chin in the photograph and stood up straighter.
- A double chin can appear as a person gets older.
