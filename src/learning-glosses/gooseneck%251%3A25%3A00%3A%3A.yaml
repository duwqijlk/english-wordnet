simpleMeaning: A thin thing that bends in a smooth curve, shaped like the curved part of a water bird
  between its head and body
scope: A thing with a thin, curving shape, not a straight bar and not a thick bend.
examples:
- The lamp had a gooseneck that let us point the light down.
- He bent the gooseneck of the hose to reach the far plants.
