simpleMeaning: a place or scene that is very beautiful, or strange and beautiful in a way that makes people
  feel surprise
scope: This is a place or scene that is very beautiful, or strange and beautiful in a way that makes people
  feel surprise; it is not the made-up land of wonders in a story in another batch.
examples:
- After the snow, the forest was a winter wonderland.
- At night, the garden became a wonderland of lights and bright flowers.
