simpleMeaning: To make small changes to a thing, or mark it in set steps, so it measures as well as it
  can
scope: This is work on a thing to make it measure well; graduate and calibrate are other names for this
  sense, not a big repair or a new design.
examples:
- He fine-tuned the gauge before he took the readings.
- He fine-tuned the scales before weighing the samples.
