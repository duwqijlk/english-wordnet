simpleMeaning: the state of needing to be dealt with at once; a strong need that keeps pressing and will
  not wait
scope: This is the state of needing action at once, or a strong need itself, not how important a task
  is for fast action and not repeated asking.
examples:
- There was a real urgency about the flood warning.
- His voice showed the urgency of his need for help.
