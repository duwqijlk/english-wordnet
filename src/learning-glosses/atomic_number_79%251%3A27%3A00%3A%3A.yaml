simpleMeaning: A soft yellow metal, easily shaped, joining three ways or one; found mainly as lumps in
  rocks, untouched by most chemicals, but eaten by chlorine and a strong acid mix.
scope: Not other yellow metals, nor other soft metals; also called gold and Au.
examples:
- Atomic number 79 is gold.
- The element with atomic number 79 does not rust.
