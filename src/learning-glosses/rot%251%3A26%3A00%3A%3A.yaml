simpleMeaning: a state of being broken down and going bad, usually with a bad smell
scope: This is the bad state of a thing that has broken down, usually with a bad smell. It is not silly
  or false talk, and not the act of breaking down itself.
examples:
- The rot in the old wood gave off a bad smell.
- We threw out the fruit because the rot had spread through it.
