simpleMeaning: inside, or belonging only to, the organ or part of the body that it works on
scope: This sense is about a part that sits inside the body and works on it; it is not the wider sense
  of a quality that is a basic, natural part of a thing itself.
examples:
- The small intrinsic muscles of the hand help you move your fingers.
- Intrinsic muscles inside the eye change the shape of the lens.
