simpleMeaning: a liquid chemical with no colour, made of hydrogen and carbon; it catches fire very easily,
  can cause cancer, and is the simplest aromatic compound (one built in a ring)
scope: 'Also called benzine and benzol: this clear liquid made of hydrogen and carbon, which catches fire
  easily and can cause cancer. Not a word for another liquid chemical.'
examples:
- Benzene is kept away from heat because it catches fire easily.
- The lab stored the benzene in a closed metal bottle.
