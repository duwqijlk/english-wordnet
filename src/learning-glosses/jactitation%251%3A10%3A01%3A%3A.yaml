simpleMeaning: In law, a false boast that can harm others, above all a false claim to be married to someone;
  in earlier times, the law could act against it.
scope: In law, a false boast that can harm others, above all a false claim to be married to someone; not
  a harmless boast and not the medical sense of restless tossing.
examples:
- His jactitation that they were married harmed her good name.
- Jactitation was once a matter the courts could punish.
