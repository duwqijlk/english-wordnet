simpleMeaning: breaking or splitting something, considered as an action
scope: The action of breaking or splitting something, another name for the same sense as cracking and
  fracture, not the mark left by a split or the sharp noise it makes.
examples:
- The cracking of the nut took only a moment with the right tool.
- Engineers studied the cracking of the concrete after the earthquake.
