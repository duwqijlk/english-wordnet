simpleMeaning: A stage of sleep that comes round again and again, when we dream and our eyes move fast
  under the lids
scope: paradoxical sleep, rapid eye movement, rapid eye movement sleep and REM sleep are other names for
  this sense; not deep sleep without dreams and not waking.
examples:
- Most dreams happen during REM sleep.
- In REM, her eyes moved fast beneath closed lids.
