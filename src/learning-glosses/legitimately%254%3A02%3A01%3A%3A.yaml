simpleMeaning: in a way that people in general accept as normal and right
scope: 'Also called lawfully: done in a way people in general accept as normal, not in a way the law accepts
  as right.'
examples:
- In this village, you cannot legitimately start eating before the oldest person, as custom demands.
- Students legitimately wear casual clothes on Fridays, as that is the accepted custom at this school.
