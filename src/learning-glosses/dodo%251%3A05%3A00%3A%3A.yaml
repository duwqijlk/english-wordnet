simpleMeaning: a heavy bird of Mauritius that could not fly, is now gone for ever, and was related to
  pigeons
scope: This is the lost bird from Mauritius itself. It is not a pigeon, though it was related to pigeons,
  and not any other heavy bird that cannot fly.
examples:
- The dodo lived on Mauritius and could not fly away from hunters.
- No one has seen a living dodo for hundreds of years.
