simpleMeaning: to give one short, uneven shake that you do not control
scope: 'Also called jerk: to give one short, uneven shake that you do not control, not a sudden shaking
  of one muscle and not a hard pinch between the fingers.'
examples:
- His face began to twitch when he heard the news.
- Her eye twitches when she is nervous.
