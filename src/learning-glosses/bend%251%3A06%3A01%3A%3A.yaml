simpleMeaning: a straight line that goes across a shield at an angle, from the top right corner to the
  bottom left corner
scope: This is a line drawn across a shield. It is not a curved part of a road and not the act of leaning
  forward.
examples:
- The bend on the old shield runs from the top right corner to the bottom left.
- A red bend crosses the shield from the upper right corner to the lower left.
