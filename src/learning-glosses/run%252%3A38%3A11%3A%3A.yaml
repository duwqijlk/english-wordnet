simpleMeaning: To move around freely with no one holding you back, or to behave in a wild, uncontrolled
  way.
scope: This is moving or behaving without restraint, not moving fast in a race or operating equipment.
examples:
- The children ran wild in the garden.
- Dogs are not allowed to run loose here.
