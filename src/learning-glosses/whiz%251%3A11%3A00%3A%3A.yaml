simpleMeaning: a buzzing or hissing sound made when something moves very fast through the air
scope: This is the sound made by fast movement through air, not a person who is very good at something
  and not the movement itself.
examples:
- I heard the whiz of the ball as it passed my ear.
- The whiz of arrows filled the air above them.
