senseId: 'grout%1:27:00::'
synsetId: 14916139-n
simpleMeaning: a thin mix of sand, water and cement (a grey powder that gets hard) that you pour to fill
  cracks between bricks or stones
scope: This is the thin mix itself, not the act of putting it in place to hold bricks or stones together.
examples:
- She poured grout into the cracks between the bricks.
- The grout had dried hard between the stones in the wall.
