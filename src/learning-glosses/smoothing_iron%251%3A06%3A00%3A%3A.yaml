simpleMeaning: a home tool with a flat metal base that is heated and pushed over cloth to take out creases
scope: A home tool with a heated flat metal base pushed over cloth to take out creases, also called iron;
  not a tool for cutting cloth, and not a machine that washes clothes.
examples:
- She pressed her dress with a smoothing iron before the party.
- The smoothing iron hissed as it moved over the shirt.
