simpleMeaning: Hand someone something, such as a bill or a set of charges, often so as to blame them or
  find fault.
scope: Not the giving of a gift; the thing handed over is usually unwelcome, like a bill or an accusation.
examples:
- The landlord presented me with a bill for three months' rent.
- When the audit ended, the inspectors presented the manager with a list of violations.
