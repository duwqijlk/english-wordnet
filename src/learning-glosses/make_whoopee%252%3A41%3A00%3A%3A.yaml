simpleMeaning: To have a loud, wild party, often with much drink, and to join in noisy fun with others.
scope: To have a loud, wild party, often with drink, also called racket, revel, jollify, make happy, make
  merry, wassail, and whoop it up; not a quiet dinner and not a sad gathering.
examples:
- They made whoopee till the small hours.
- Let's make whoopee — the boss is gone!
