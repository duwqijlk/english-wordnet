simpleMeaning: In North America, Europe, and Asia grows a plant that lives one year, its stem covered
  in hooked prickles.
scope: Also called cleavers, catchweed, clivers, and goose grass, this plant of North America, Europe,
  and Asia lives one year, its stem covered in hooked prickles.
examples:
- In the yard, spring cleavers grew.
- The spring cleavers caught on my sleeve.
