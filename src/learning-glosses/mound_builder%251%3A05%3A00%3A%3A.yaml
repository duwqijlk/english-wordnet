simpleMeaning: In Australasia, big-footed birds with short wings build mounds of rotting plants, and the
  heat of the mound hatches their eggs.
scope: 'Also called megapode, mound-bird, mound bird, and scrub fowl: its eggs are warmed by a mound of
  rotting plants.'
examples:
- The mound builder heaps up rotting plants into a mound.
- A mound builder's eggs hatch in the heat of the mound.
