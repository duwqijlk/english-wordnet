simpleMeaning: A person whose job is to look into things with great care to find facts
scope: This is a person who looks into things with care to find facts. It is not just a person watching,
  and not a person who fixes or judges things.
examples:
- The inspector looked carefully at every door and window for signs of a break-in.
- An inspector came to check the school and write a report.
