simpleMeaning: A game where balls with numbers are picked by chance and players mark the same numbers
  on their cards
scope: This is a game where balls with numbers are picked by chance and players mark the same numbers
  on their cards; bingo, lotto and beano are other names for this sense, not a lottery ticket and not
  a raffle.
examples:
- They played keno at the club.
- In keno, players mark numbers on their cards.
