simpleMeaning: A tool, used in the plural, that pushes out a strong blast of air to make a fire burn harder
  or to play an instrument
scope: A tool for blowing a strong blast of air, not a fan and not a pump.
examples:
- He worked the bellows until the fire roared.
- The organ bellows filled the pipes with air.
