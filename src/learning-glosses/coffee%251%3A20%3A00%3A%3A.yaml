simpleMeaning: A small tropical tree or bush, native to Africa and Asia, whose seeds are roasted and crushed
  to make a hot drink.
scope: This is not the drink or the seed; it is the plant that produces the seeds.
examples:
- The farm grows coffee on the hills above the village.
- Coffee trees need shade and steady rain to do well.
