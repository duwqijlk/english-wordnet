simpleMeaning: to make a ringing sound, like a bell
scope: 'Also called ding: to make a bell-like ringing sound. It is not a bell itself, and not a short,
  sharp tap.'
examples:
- The big bell donged across the quiet town.
- The clock donged twelve times at midnight.
