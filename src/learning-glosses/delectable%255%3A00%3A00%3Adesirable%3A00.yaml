simpleMeaning: able to make someone feel sexual desire
scope: This is about a person who makes someone feel sexual desire; not about food that tastes very good,
  and not about wanting or liking a thing in a general way.
examples:
- She called the young actor delectable and said she desired him.
- He looked at the delectable dancer with clear sexual desire.
