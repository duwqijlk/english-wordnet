senseId: 'proprietary%1:21:00::'
synsetId: 13264678-n
simpleMeaning: a business owned by one person and not set up as a company; that person must pay its debts
  and keeps its profits
scope: 'Also called proprietorship: a one-person business; not the adjective sense of goods that only
  one maker has the right to sell.'
examples:
- Her small firm is a proprietary, and all of its profits are hers.
- He runs his shop as a proprietary, so he alone must pay its debts.
