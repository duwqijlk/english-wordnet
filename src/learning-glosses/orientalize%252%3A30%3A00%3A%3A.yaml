simpleMeaning: to give a thing the look and ways of eastern lands
scope: To give a thing the look and ways of eastern lands, also called orientalise; not to move a thing
  east and not to make it western.
examples:
- He orientalized his study with rugs and low tables.
- The designer orientalized the whole restaurant.
