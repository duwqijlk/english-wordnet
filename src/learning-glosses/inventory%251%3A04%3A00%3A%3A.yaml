simpleMeaning: the act of making a list, item by item, of the goods or supplies a place has
scope: The act of listing goods or supplies on hand, item by item, not the worth of those goods.
examples:
- We took an inventory of the store room on Friday.
- The yearly inventory showed nothing missing.
