simpleMeaning: In biology and chemistry, small parts move through a thin layer that lets some pass, from
  where there is more to where there is less, until both sides match
scope: This sense is about small parts moving through a thin layer until both sides are the same. It is
  not just any mixing in a liquid, and not learning ideas without trying.
examples:
- Plants take in water by osmosis through their roots.
- Osmosis moves water into the cells until both sides are the same.
