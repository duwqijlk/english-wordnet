senseId: 'democratically%4:02:00::'
synsetId: 00123311-r
simpleMeaning: in a way where all the people have an equal say in choices, following the idea that the
  people should share in power
scope: This is about how a choice is made or a group is run, with all the people having a say in the choice.
  It is not the describing word for a country or system that works in this way.
examples:
- The new leaders were chosen democratically, with every adult free to vote.
- The club democratically decided how to spend its money.
