simpleMeaning: Inclined to hurt people and make them suffer, in what one does or how one acts.
scope: 'Also called fell, cruel, savage, brutal, vicious, and barbarous: ready to cause pain to others,
  not the horse sense of wearing shoes with nails that stick out.'
examples:
- His roughshod treatment of the workers left many of them hurt and afraid.
- The roughshod rule of the governor brought pain to many families.
