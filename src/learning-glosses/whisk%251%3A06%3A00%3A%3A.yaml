simpleMeaning: a small brush with a short handle, used to clean dust and dirt off clothes
scope: This is the small brush for clothes, not the kitchen tool with wire loops for beating eggs or cream,
  and not the act of beating or brushing something off.
examples:
- He used a whisk to brush the dust from his coat.
- She kept a small whisk in her bag to clean her clothes.
