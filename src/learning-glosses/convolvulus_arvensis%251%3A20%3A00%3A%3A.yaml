simpleMeaning: A weakly climbing European plant that lives many years, with white or pink flowers; it
  has spread in North America, where it is a weed that pushes other plants out.
scope: 'Also called field bindweed or wild morning-glory: a weakly climbing European plant with white
  or pink flowers, now a weed in North America, not a tall tree and not a plant grown for its flowers.'
examples:
- Convolvulus arvensis climbed the fence, its white and pink flowers open.
- In North America Convolvulus arvensis is a weed that pushes other plants out.
