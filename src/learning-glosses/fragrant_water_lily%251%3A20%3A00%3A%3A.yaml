simpleMeaning: Of mild and hot lands, a lily with big leaves and big, bright, sweet-smelling flowers that
  float.
scope: Also called a pond lily and a water nymph, this is the lily of mild and hot lands whose big, sweet-smelling
  flowers float.
examples:
- The fragrant water lily floated on the water with its big leaves.
- We saw the fragrant water lily with its big sweet-smelling flowers.
