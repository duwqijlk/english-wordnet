simpleMeaning: a piece of music with several separate parts, and with no fixed form
scope: A piece of music in several parts with no fixed form, not a song a person sings or plays outside
  the home of the person they love at night.
examples:
- The orchestra played a serenade in four separate parts.
- He wrote a serenade, and each part had a different tune.
