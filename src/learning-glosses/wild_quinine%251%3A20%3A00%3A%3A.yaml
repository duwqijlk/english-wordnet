simpleMeaning: This thick herb of the eastern United States lives for years and bears whitish flowers;
  the Catawba Indians long used its leaves to treat burns.
scope: Also called prairie dock, this is a thick herb of the eastern United States with whitish flowers,
  its leaves long used by the Catawba Indians to treat burns.
examples:
- Wild quinine bore whitish flowers.
- The Catawba Indians used wild quinine leaves to treat burns.
