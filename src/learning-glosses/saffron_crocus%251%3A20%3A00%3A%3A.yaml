simpleMeaning: Used to give food flavour, this Old World flower has purple or white blooms with strong-smelling
  orange threads inside.
scope: This Old World flower has purple or white blooms with orange threads used to flavour food, and
  is also called saffron, not the spice on its own.
examples:
- I can tell a saffron crocus by its purple blooms.
- Look at the orange threads inside this saffron crocus.
