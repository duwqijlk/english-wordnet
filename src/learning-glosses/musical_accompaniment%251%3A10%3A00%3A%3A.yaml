simpleMeaning: A sung or played part in music that backs up or sets the background for other parts.
scope: A sung or played part in music that backs up other parts; support, backup and accompaniment are
  other names for it, not the main tune and not a part played alone.
examples:
- The piano gave a soft musical accompaniment to the singer.
- He wrote the musical accompaniment for the choir.
