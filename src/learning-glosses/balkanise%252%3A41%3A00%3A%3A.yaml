senseId: 'balkanise%2:41:00::'
synsetId: 02475134-v
simpleMeaning: A land is broken into small states that are unfriendly to each other
scope: Also called Balkanize, this is to split a land into small states that are unfriendly to each other,
  not to join lands together.
examples:
- The war served to Balkanise the country into rival states.
- Leaders feared the region would Balkanise after independence.
