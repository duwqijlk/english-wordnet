senseId: 'groyne%1:06:00::'
synsetId: 02897867-n
simpleMeaning: A wall of stone or hard man-made rock that runs from the shore out into the water to stop
  a beach from washing away.
scope: 'Also called a groin, a mole, a jetty, a bulwark, a breakwater, or a seawall: a wall of stone or
  hard rock running from shore into the water to stop a beach from washing away, not a pier for boats
  and not a dam across a river.'
examples:
- The groyne stopped the sand from washing away.
- New groynes were built along the beach after the storm.
