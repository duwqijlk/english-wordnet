simpleMeaning: Often in a religious act asking for God's blessing, oil or a soft cream is put on a person
scope: 'Also called anele, anoint, inunct and oil: putting oil or a soft cream on a person, often in a
  religious act of blessing, not rubbing on medicine to heal a hurt and not washing the skin.'
examples:
- The priest embrocated the sick man's forehead with oil before the blessing.
- She embrocated the child's hands as part of the ceremony.
