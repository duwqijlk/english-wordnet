simpleMeaning: the gap between the two sheets round the heart, full of fluid that oils the surfaces so
  the heart can move freely
scope: 'Also called pericardial cavity: the gap between the two sheets round the heart, full of fluid
  that oils the surfaces, not the heart itself and not the chest space.'
examples:
- The pericardial space holds fluid around the heart.
- A small amount of fluid fills the pericardial space.
