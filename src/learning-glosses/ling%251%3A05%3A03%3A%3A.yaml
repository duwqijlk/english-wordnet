simpleMeaning: a long thin kind of cod that lives in fresh water in northern Europe, Asia and North America,
  with long thin parts around its mouth
scope: This sense is the fresh water fish; it is not the sea fish with the same name and not a plant with
  the same name.
examples:
- Fishermen caught a ling in the cold northern lake.
- The ling lives in fresh water and hides near the bottom.
