schema: oewn-learning-gloss-v2
senseId: 'fungible%1:06:00::'
synsetId: 03408084-n
simpleMeaning: Goods that are all the same as each other, so any of them can freely be used in place of
  another to meet a duty
scope: This is the noun for goods of this kind. It is not the adjective sense that says goods can be swapped
  in this way, and it is not a thing that is the only one of its kind.
examples:
- Fungibles like grain are swapped for others of the same kind when a duty must be met.
- The oil was held as fungibles, so the buyer could take the same amount from a different tank.
