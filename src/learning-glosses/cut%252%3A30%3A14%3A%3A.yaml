simpleMeaning: to make something shorter by taking off its edges or ends, as if slicing them away
scope: This means shortening a physical thing at its edges or ends, not reducing a work's range while
  keeping its core.
examples:
- She cut her hair to shoulder length before the wedding.
- The gardener cut the hedge back along the path.
