simpleMeaning: the number you get by dividing the distance from a camera lens to the point where it brings
  light to a sharp point by the width of the lens
scope: 'Also called f number and speed: a number that tells how the length of a camera lens compares with
  its width, not the length itself and not the width of the picture.'
examples:
- The focal ratio of this lens is written on its side.
- The photographer checked the focal ratio before choosing the lens.
