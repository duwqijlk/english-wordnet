simpleMeaning: A face part that bends down at the end, like the beak of a bird of prey.
scope: A nose that bends down at the tip, not a straight nose and not one that turns up at the end.
examples:
- His hawk nose curved down over his moustache.
- The old sailor's hawk nose gave his face a sharp look.
