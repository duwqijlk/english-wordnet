simpleMeaning: This short person is small because too little of the growth chemicals, not the genes passed
  down in the family, is at work, as in the short-limbed kind.
scope: Also called hypophysial dwarf, this short person's small size comes from too little of the growth
  chemicals, not from the genes passed down in the family.
examples:
- The pituitary dwarf grew slowly.
- The pituitary dwarf stayed short.
