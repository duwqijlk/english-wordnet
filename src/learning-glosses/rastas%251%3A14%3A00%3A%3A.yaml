simpleMeaning: A Black youth group and faith from poor Kingston, Jamaica, that started in the 1950s; its
  men wear long dreadlocks and wool caps, use marijuana, and listen to reggae music.
scope: A Jamaican youth movement and faith, also called Rastafari; not reggae music itself and not other
  Jamaican church groups.
examples:
- The Rastas gather to listen to reggae.
- Some Rastas wear wool caps over their dreadlocks.
