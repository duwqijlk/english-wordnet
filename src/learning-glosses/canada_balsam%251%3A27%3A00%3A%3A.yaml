simpleMeaning: A yellow clear sticky liquid from a fir tree, used as clear glue in tools that work with
  light, above all in microscopes, to hold samples in place.
scope: A yellow clear resin from a fir tree, used as a clear glue in lenses and microscopes, not the fir
  tree itself that gives it.
examples:
- Canada balsam holds the lens in place.
- The slide was fixed with Canada balsam.
