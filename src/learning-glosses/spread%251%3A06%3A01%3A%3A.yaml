simpleMeaning: a large farm with a wide area of land and the buildings and equipment needed to raise cattle
  or other animals.
scope: This is a farm or ranch, not the act of extending something over an area and not a cloth cover
  for a bed.
examples:
- He grew up on a cattle spread in Texas.
- The family sold their spread and moved to town.
