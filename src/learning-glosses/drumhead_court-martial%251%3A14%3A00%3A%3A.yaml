simpleMeaning: a military hearing brought together in haste to judge members of the armed forces charged
  with wrong acts done in battle
scope: A hasty military hearing for members of the armed forces charged with wrong acts in battle, not
  a full trial held in peace time.
examples:
- The drumhead court-martial met at dawn to hear the charges.
- He was tried by a drumhead court-martial after the battle.
