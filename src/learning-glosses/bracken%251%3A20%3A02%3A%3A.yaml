simpleMeaning: a fern from south-east Asia; it is not strong enough to live through cold weather in places
  with mild summers and cold winters
scope: A fern from south-east Asia that does not do well in cold areas, not the large, rough weed fern
  that grows in many parts of the world.
examples:
- This bracken comes from south-east Asia and must be kept inside in winter.
- In a cold garden, this kind of bracken soon dies.
