simpleMeaning: a part of a written deal that says any row about the deal must be settled by a fair outsider
scope: A part of a written deal, not the deal itself and not the settling of the row.
examples:
- The arbitration clause in our deal sends any row to a fair outsider.
- She read the arbitration clause before she signed the deal.
