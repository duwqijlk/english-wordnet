simpleMeaning: the inside of a nuclear reactor where the fuel sits and the nuclear reaction happens
scope: This sense is the fuel-holding interior of a nuclear reactor, where the reaction happens; it is
  not the Earth's centre, and not the metal bar inside a coil.
examples:
- The reactor core contains hundreds of fuel assemblies.
- Operators shut down the reactor after the core overheated.
