simpleMeaning: a medical worker with special training in the hearing part of the head and its sicknesses
scope: 'Also called ear doctor and otologist: a medical worker with special training in the hearing part
  of the head and its sicknesses, not a general medical worker and not a person who treats the eyes.'
examples:
- The ear specialist said the ringing would fade in a few weeks.
- My ear specialist checks my hearing once a year.
