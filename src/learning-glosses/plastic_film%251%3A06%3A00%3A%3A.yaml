simpleMeaning: A thin sheet of stuff, most often of the man-made kind and most often see-through, used
  to wrap or cover things.
scope: A thin sheet of stuff, most often of the man-made kind and most often see-through, used to wrap
  or cover things; film is another name for this sense, not foil and not paper.
examples:
- She covered the bowl with plastic film.
- Plastic film kept the paint from drying out.
