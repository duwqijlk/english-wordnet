simpleMeaning: A building block of protein that the body must get from food, with the same makeup as leucine
  but put together in a different way.
scope: A building block of protein that the body must get from food, with the same makeup as leucine but
  put together in a different way; not leucine itself and not a protein on its own.
examples:
- Isoleucine is one of the building blocks found in meat and beans.
- The body cannot make isoleucine, so it must come from food.
