simpleMeaning: A desert shrub of the southwestern United States and Mexico, with thin bare thorny branches
  that grow leaves and bunches of red flowers after the rains.
scope: A desert shrub with red flowers, also called coachwhip, ocotillo, vine cactus, and Jacob's staff;
  not a true cactus and not a vine.
examples:
- Fouquieria splendens burst into red flower after the rain.
- A Fouquieria splendens stood bare and thorny by the trail.
