simpleMeaning: A sickness that makes the body move without control, found above all in children and linked
  with rheumatic fever.
scope: Also called Saint Vitus dance and Sydenham's chorea, this is a sickness that makes the body move
  without control and is linked with rheumatic fever, found above all in children, not a dance for fun.
examples:
- St. Vitus dance left the child unable to sit still.
- The doctor said the St. Vitus dance would pass with time.
