simpleMeaning: Any of several kinds of plant of the group Calochortus bears cup shaped flowers of three
  outer leaves and three inner leaves, in the southwestern United States and Mexico
scope: Also called mariposa and mariposa tulip; a plant of the southwestern United States and Mexico with
  cup shaped flowers of three outer leaves and three inner leaves.
examples:
- The mariposa lily opened its cup shaped flowers.
- She planted a mariposa lily along the path.
