senseId: 'escape%1:06:00::'
synsetId: 04134734-n
simpleMeaning: a valve in a container such as a steam boiler that opens by itself when pressure builds
  up to a dangerous level
scope: The pressure-relief device itself, not a means or way of getting out, and not the escape of gas
  or fluid from a container.
examples:
- The boiler's escape opened by itself when the pressure climbed too high.
- A faulty escape failed to open, and the pressure kept rising.
