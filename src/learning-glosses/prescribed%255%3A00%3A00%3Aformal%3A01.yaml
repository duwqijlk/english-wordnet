simpleMeaning: set down in a formal way by someone in charge, and to be obeyed
scope: Formally laid down by someone in charge; positive is another name for this sense, and it is not
  simply following a set habit or usual way of doing things.
examples:
- The prescribed rules must be followed by all staff.
- She wore the prescribed uniform for the ceremony.
