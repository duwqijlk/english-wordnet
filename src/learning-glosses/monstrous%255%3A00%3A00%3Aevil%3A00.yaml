simpleMeaning: very cruel and violent, in a way that shocks people
scope: 'Also called grievous: very cruel and violent. This is not the sense of monstrous that means huge,
  ugly, and wrong in shape.'
examples:
- Keeping children locked up for years was a monstrous crime.
- It was monstrous to leave the wounded man alone in the cold.
