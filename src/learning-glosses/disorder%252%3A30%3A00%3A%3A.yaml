simpleMeaning: to make a place, thing or set of things untidy or mixed up
scope: This is making a place or thing untidy or mixed up, not troubling a person's mind or making them
  worried.
examples:
- The wind disordered the papers on his desk.
- A sudden rush of people disordered the neat rows of chairs.
