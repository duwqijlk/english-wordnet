senseId: 'unprofitably%4:02:00::'
synsetId: 00215382-r
simpleMeaning: in a way that gets little done and gives back little for the effort
scope: In a way that gets little done and gives back little for the effort; unproductively is another
  name for this sense, and this is not being lazy or wasteful.
examples:
- The meeting went on unprofitably for hours, with nothing agreed.
- He spent the day unprofitably, with nothing to show for it.
