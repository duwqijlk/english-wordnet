simpleMeaning: An old-fashioned machine that shows a row of things one after another for a person to try
  to remember
scope: An old-fashioned machine that shows a row of things one after another for a person to try to remember;
  memory apparatus is another name for this machine, not a machine that tests how fast you react.
examples:
- The mnemometer showed the cards one by one for the test.
- With the mnemometer, each picture stayed on view for only a few seconds.
