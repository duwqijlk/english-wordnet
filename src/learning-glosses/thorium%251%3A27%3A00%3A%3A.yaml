simpleMeaning: A soft silvery-white metal that gives off rays and joins with four other atoms; kind 232
  makes power in nuclear reactors, found in thorite and in monazite sands.
scope: A soft silvery-white metal that gives off rays, also called Th and atomic number 90, whose kind
  232 makes power in nuclear reactors.
examples:
- Thorium is found in thorite and in monazite sands.
- Kind 232 of thorium makes power in nuclear reactors.
