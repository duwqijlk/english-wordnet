simpleMeaning: Said of the languages spoken by the native peoples of the Americas, their ways of life,
  or the peoples themselves
scope: 'Also called Amerindic, Indian, and Native American: a word used for the native peoples of the
  Americas, their ways of life, or their languages, not a name for one of their languages.'
examples:
- Amerind art shows the ways of life of the native peoples.
- Amerind languages are many and different from one another.
