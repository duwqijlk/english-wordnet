senseId: 'reservation%1:04:01::'
synsetId: 01220817-n
simpleMeaning: the act of arranging to have a place, a seat on a journey, or the work of a person or group
  kept for you
scope: This is the act of arranging a place, a seat, or a person's work for later; it is not a doubt about
  something, not the place or seat itself, and not land kept for a special use.
examples:
- She made a reservation for a table at seven.
- Their reservation of the hall for Saturday took only a phone call.
