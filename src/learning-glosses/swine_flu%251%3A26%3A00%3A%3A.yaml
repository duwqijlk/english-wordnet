simpleMeaning: A germ thought to be the same one that caused the great sickness of 1918 brings this sudden
  sickness of pigs, which spreads fast and hits the breathing tubes.
scope: Also called swine influenza, this is a sickness of pigs, not a sickness of people.
examples:
- The swine flu hit the pigs' breathing tubes.
- Many pigs caught the swine flu.
