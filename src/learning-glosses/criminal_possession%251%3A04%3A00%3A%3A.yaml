simpleMeaning: In law, having something when the law says you may not have it, or may not have it in some
  cases, so you can be punished for it.
scope: This is unlawful holding of something, not theft or use of it.
examples:
- Criminal possession of the weapon led to his arrest.
- She faced a charge of criminal possession.
