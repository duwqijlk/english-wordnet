simpleMeaning: A small spinning swirl of water or air made when a flowing stream turns back on itself
scope: A small spinning swirl of water or air where a stream turns back on itself, also called twist;
  not a full whirlpool or a storm.
examples:
- An eddy spun the leaves round in the stream.
- The eddy in the river pulled the boat sideways.
