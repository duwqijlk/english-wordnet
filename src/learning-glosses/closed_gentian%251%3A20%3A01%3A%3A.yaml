simpleMeaning: a plant from the east of North America with tube-shaped blue or white flowers that open
  little or not at all
scope: Also called blind gentian and bottle gentian, it is a plant from the east of North America with
  tube-shaped blue or white flowers that open little or not at all, not a plant whose flowers open wide.
examples:
- The closed gentian grew beside the wet path.
- We saw a closed gentian with deep blue flowers that stayed nearly shut.
