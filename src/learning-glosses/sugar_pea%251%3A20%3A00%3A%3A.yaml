simpleMeaning: A kind of plant that grows thin flat pods you can eat, with seeds inside the pods.
scope: A plant grown for its thin flat pods, also called snow pea; not a plant grown only for dry seeds,
  and not a green bean.
examples:
- We picked sugar peas from the garden and ate them raw.
- She grows sugar peas along the fence for their sweet pods.
