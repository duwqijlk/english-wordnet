simpleMeaning: a small warship that can turn and move with ease and that goes with other ships to guard
  them, smaller than a destroyer, a larger warship
scope: A small warship that turns with ease and guards other ships; not a large warship and not a ship
  that carries goods.
examples:
- The corvette sailed beside the convoy to guard it.
- A corvette can turn far more quickly than a big warship.
