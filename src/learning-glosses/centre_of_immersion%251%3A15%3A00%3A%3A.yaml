simpleMeaning: In physics, the place where the weight of the part of a ship or other thing that floats
  which sits under water can be said to rest
scope: 'Also called center of buoyancy, center of immersion and centre of buoyancy: the place where the
  weight of the under-water part of a floating thing can be said to rest, not the point where the weight
  of the whole thing acts.'
examples:
- The centre of immersion rose when the hull sank deeper into the water.
- Naval architects mark the centre of immersion on the plans for a new ship.
