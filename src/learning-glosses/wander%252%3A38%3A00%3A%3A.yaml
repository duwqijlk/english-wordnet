simpleMeaning: to move from place to place with no fixed goal or place to go to, often looking for food
  or work
scope: 'Also called range, roll, cast, and drift: moving from place to place with no fixed goal, not moving
  away from a main subject in speech and not being unfaithful in marriage.'
examples:
- The cattle wandered across the open fields looking for food.
- Men wandered from town to town looking for work.
