simpleMeaning: to take the sharp edges off a picture or view, so its shapes are hard to pick out
scope: 'Also called damp: to blur or dim a thing or picture, not to make a sound softer and not to lessen
  the swing of waves.'
examples:
- The fog dampened the view of the hills.
- The dirty glass dampened the image on the screen.
