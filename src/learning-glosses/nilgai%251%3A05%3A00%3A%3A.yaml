simpleMeaning: A large antelope of India, whose males are blue-grey with white marks and whose females
  are brownish and have no horns.
scope: A large antelope of India with blue-grey males and hornless brownish females, also called blue
  bull, nylghai and nylghau; not a deer and not a goat.
examples:
- The nilgai stood tall in the dry grass of India.
- A male nilgai showed blue-grey sides with white marks.
