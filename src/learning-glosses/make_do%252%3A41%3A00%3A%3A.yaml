simpleMeaning: With only the little you have, to get something finished or put together
scope: Also called contend, cope, deal, get by, grapple, manage and make out, this is getting something
  finished with only the little you have, not doing without and not giving up.
examples:
- We made do with one small room for the whole family.
- They made do on half a loaf of bread every day.
