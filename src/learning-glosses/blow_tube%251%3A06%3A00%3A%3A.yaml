simpleMeaning: a hollow pipe that sends a stream of air or gas into a flame to make the heat stronger
  in one spot
scope: 'Also called blowpipe and blowtube: a pipe that sends air or gas into a flame to make the heat
  stronger, not a pipe for drinking, and not a pipe for smoking.'
examples:
- The jeweller used a blow tube to heat the metal until it was soft enough to shape.
- He aimed the blow tube at the flame, and the heat grew strong enough to melt the glass.
