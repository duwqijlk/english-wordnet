simpleMeaning: a thin round piece of bread made without yeast, used in a church service, especially in
  the Eucharist (a Christian service that remembers Christ's last meal)
scope: This is bread used in a church service, especially the Eucharist, not a small thin sweet cake and
  not a small sticky disk used to close a letter.
examples:
- The priest gave each person a wafer during the service.
- She took the wafer and ate it quietly in church.
