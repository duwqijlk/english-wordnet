simpleMeaning: An honoured body in London, set up in 1768 to foster painting, sculpture and building design
  in Britain.
scope: Also called the Royal Academy; an honoured body in London that fosters painting, sculpture and
  building design, not a school that teaches students and not a gallery that shows art.
examples:
- The Royal Academy of Arts was set up in London in 1768.
- The Royal Academy of Arts fosters painting and sculpture in Britain.
