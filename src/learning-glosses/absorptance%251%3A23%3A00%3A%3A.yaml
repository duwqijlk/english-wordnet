senseId: 'absorptance%1:23:00::'
synsetId: 13607658-n
simpleMeaning: A measure of how fast light's intensity falls as it passes through a substance; the share
  of incoming radiant energy taken in per unit mass or thickness.
scope: Another name for the absorption coefficient and coefficient of absorption; it is not the general
  process of taking in light.
examples:
- Absorptance equals one minus transmittance.
- The absorptance of the coating was measured across the visible spectrum.
