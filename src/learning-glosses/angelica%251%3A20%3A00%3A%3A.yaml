simpleMeaning: Any of various tall, stout herbs with leaves made of leaflets set along a stalk, and small
  white or greenish flowers in bunches of bunches.
scope: Also called angelique, any of various tall, stout herbs of the genus Angelica with leaves made
  of leaflets set along a stalk, and small white or greenish flowers in bunches of bunches, unlike the
  sense for the aromatic stems, leaves, or roots of Angelica Archangelica.
examples:
- Angelica grows tall and stout.
- Angelica bears small white flowers.
