simpleMeaning: lasting a fairly long time, so long that it becomes dull and hard to bear
scope: 'Also called extended, lengthy, and prolonged: lasting a long time; it says how long a thing goes
  on, not how long a thing is in size.'
examples:
- The protracted talks finally ended after six months.
- It was a protracted and bitter fight over the land.
