simpleMeaning: Two reeds sound in this wind instrument of the Renaissance, whose tube bends like a crooked
  horn
scope: This wind instrument of the Renaissance is also called a cromorne or a krummhorn, and it has a
  bent tube and two reeds.
examples:
- The crumhorn played a low, buzzing tune.
- He held the crumhorn carefully because its tube bends.
