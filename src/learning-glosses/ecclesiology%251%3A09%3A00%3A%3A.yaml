simpleMeaning: the study of what a church is, how it is put together, and what it does
scope: The study of the nature, make-up and work of a church, not the study of God in general and not
  the rules of one church.
examples:
- She took a course in ecclesiology to learn how churches are run.
- His book on ecclesiology asks what a church is for.
