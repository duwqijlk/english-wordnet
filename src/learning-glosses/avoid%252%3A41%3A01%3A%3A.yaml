simpleMeaning: To stop something unwanted from happening or taking place, to keep anything harmful away,
  and to drive it off before it does damage.
scope: This is not simply keeping away from something yourself; it is acting so that the unwanted thing
  does not happen or does not reach you.
examples:
- We can avoid a lot of trouble by checking the figures now.
- The company changed its safety rules to avoid another accident.
