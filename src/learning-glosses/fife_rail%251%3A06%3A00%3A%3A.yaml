simpleMeaning: A fence around the tall pole that holds the sails of a ship.
scope: A fence around the tall pole that holds the sails of a ship; not the edge of the ship and not a
  rope that holds the sails.
examples:
- The sailor tied the rope to the fife rail.
- A fife rail rings the mast of the old sailing ship.
