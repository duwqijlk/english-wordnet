simpleMeaning: to say words out loud, often because you feel surprise, great fear, or joy
scope: 'Also called cry, shout and exclaim: to say words out loud, often from surprise, fear or joy; not
  the noun sense of a loud shout against something.'
examples:
- When she saw the fire, she outcried for help in fear.
- He outcried with joy when he heard the good news.
