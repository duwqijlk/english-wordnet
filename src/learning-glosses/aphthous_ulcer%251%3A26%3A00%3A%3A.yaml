simpleMeaning: On the soft wet skin inside the lips, mouth, or gut, this blister forms.
scope: This blister forms on the soft wet skin inside the lips, mouth, or gut, not on the outer skin.
examples:
- An aphthous ulcer showed on the inside of the lip.
- An aphthous ulcer also formed inside the mouth.
