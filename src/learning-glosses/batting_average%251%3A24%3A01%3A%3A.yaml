simpleMeaning: how often some work or try succeeds, worked out as a share of all the tries
scope: A share of times some effort works out, taken from the baseball term, not the baseball figure of
  hits over times at bat and not a simple count of wins.
examples:
- The salesman's batting average was 7 out of 12.
- Her batting average with job offers was one in five.
