simpleMeaning: bridges and dentures are made by this worker to fit in a person's mouth
scope: Bridges and dentures are made by this worker, also called a dental technician, and not by a dentist,
  who treats teeth rather than making these things.
examples:
- The denturist fitted her new dentures this morning.
- A denturist made the bridge that replaced his missing tooth.
