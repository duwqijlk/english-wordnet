senseId: 'harmonize%2:36:01::'
synsetId: 01711165-v
simpleMeaning: to write a harmony (other notes that sound good with the main tune) for a piece of music
scope: To write a harmony for a piece of music, also called harmonise; not to sing or play in tune with
  others, and not to make different things fit well together.
examples:
- He harmonized the tune by writing new notes for the singers below the main line.
- For her music class, she harmonized a short song on paper before anyone sang it.
