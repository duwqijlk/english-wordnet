simpleMeaning: One of several Indian cattle breeds, especially a large American breed, heat- and tick-resistant,
  greyish humped, crossed from Indian cattle in the Gulf States and now used chiefly for crossbreeding.
scope: Also called Bos indicus, Brahma and Brahmin; a kind of Indian cattle, not a dairy cow and not a
  wild ox.
examples:
- The Brahman bull is greyish and humped.
- Brahman cattle stand heat and ticks well.
