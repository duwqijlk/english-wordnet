senseId: 'enantiomorph%1:27:00::'
synsetId: 14907917-n
simpleMeaning: One of two bits of matter that are mirror images of each other but are not the same.
scope: One of two bits of matter that are mirror images of each other but differ, also called an enantiomer;
  not the pair itself and not a twin.
examples:
- Each enantiomorph is the mirror image of the other.
- The drug works only as one enantiomorph, not the other.
