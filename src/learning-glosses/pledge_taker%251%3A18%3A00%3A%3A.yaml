simpleMeaning: A person who gives their time for free and writes down, most often by phone, the gifts
  promised in a drive to raise money
scope: A person who gives their time for free to write down the gifts promised in a drive to raise money,
  most often by phone, not a person who gives money and not a person who asks for money on the street.
examples:
- She worked as a pledge taker during the radio fund drive, writing down gifts promised by callers.
- A pledge taker answered the phone and wrote down the amount the caller promised to give.
