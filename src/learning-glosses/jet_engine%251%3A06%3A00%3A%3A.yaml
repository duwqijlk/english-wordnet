simpleMeaning: A machine with spinning blades driven by hot gas, which sends out a stream of hot gas that
  pushes a plane forward.
scope: A machine with spinning blades driven by hot gas that pushes a plane forward, not a propeller that
  pulls a plane and not a rocket that works without air.
examples:
- The jet engine roared as the plane sped down the runway.
- Mechanics checked the jet engine before the flight.
