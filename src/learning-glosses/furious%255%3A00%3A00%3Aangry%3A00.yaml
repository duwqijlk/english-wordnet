simpleMeaning: feeling or showing very strong anger
scope: This means very angry, as in a person or a look on a face. It is not full of strong, violent force,
  as in a battle or a storm.
examples:
- She was furious about the accident and shouted at the driver.
- He gave me a furious look when he read the letter.
