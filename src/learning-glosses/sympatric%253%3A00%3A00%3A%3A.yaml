senseId: 'sympatric%3:00:00::'
synsetId: 02385377-a
simpleMeaning: In biology, living or taking place in the same area or in areas that overlap
scope: This word says that kinds of living things, or the way new kinds form, happen in the same or overlapping
  areas; not kinds that live in separate areas, and not the noun form, sympatry.
examples:
- The two sympatric birds share the same forest.
- Sympatric speciation can happen without a physical barrier.
