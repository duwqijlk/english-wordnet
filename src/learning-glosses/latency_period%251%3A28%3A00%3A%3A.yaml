simpleMeaning: In psychoanalysis, the fourth part of growth, from about age five or six until puberty,
  is said to turn a child's interest in sex into other things to do
scope: 'Also called latency phase and latency stage: in psychoanalysis, the fourth part of a child''s
  growth, not the earlier parts of growth and not the years after puberty.'
examples:
- During the latency period, a child puts most of his energy into school and play.
- The latency period runs from about age five until puberty.
