simpleMeaning: A heavy yellow poisonous oily liquid that can burst, made by treating glycerol with nitrogen
  compounds, used in making explosives and in medicine to widen blood vessels.
scope: 'Also called nitroglycerin, glyceryl trinitrate, nitroglycerine, trinitroglycerin, and Nitrospan:
  a heavy yellow poisonous oily liquid used in explosives and in medicine to widen blood vessels, not
  glycerol itself.'
examples:
- Nitrostat is a heavy yellow oily liquid that can burst.
- Doctors use Nitrostat to widen blood vessels.
