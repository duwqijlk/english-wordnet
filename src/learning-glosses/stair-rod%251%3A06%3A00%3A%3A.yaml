simpleMeaning: a bar that holds a carpet in place in the corner where two steps meet
scope: A bar that holds a stair carpet in place, not a handrail and not a pole for hanging things.
examples:
- The stair-rod kept the carpet flat on the step.
- She polished the stair-rod before the guests arrived.
