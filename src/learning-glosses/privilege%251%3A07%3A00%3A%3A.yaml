simpleMeaning: a right that only one person or group can have, especially a right passed down in a family
  or given with an official job
scope: This is a special right held by only one person or group, not the law right to keep private information
  secret and not the act of giving a right to someone.
examples:
- Voting was once a privilege held only by rich men.
- As king, he kept the privilege of choosing his own advisers.
