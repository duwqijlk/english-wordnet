simpleMeaning: A skin condition present from birth that shows as patches or bands of skin without colour
scope: A skin condition present from birth with patches of skin without colour, not vitiligo, which starts
  later in life, and not albinism, which affects the whole body.
examples:
- Leukoderma left pale patches on her arms.
- The doctor said the leukoderma had been there since birth.
