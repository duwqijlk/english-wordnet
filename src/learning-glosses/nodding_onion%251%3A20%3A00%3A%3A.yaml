simpleMeaning: A wild plant of North America, found in many places, with white to pink flowers.
scope: A wild plant of North America, found in many places, with white to pink flowers, with lady's leek
  and nodding wild onion as other names for this sense, not a garden onion grown for food and not a flower
  grown for show.
examples:
- The nodding onion grows wild across North America.
- White and pink flowers mark the nodding onion in spring.
