simpleMeaning: a bird of the starling family that lives in warm parts of Asia
scope: This is a bird from warm parts of Asia, of the starling family; it is not a name for a bird from
  cold places or for a different family of birds.
examples:
- A mynah sat in the tree and copied the sounds it heard.
- We saw a mynah near the market in the warm south of Asia.
