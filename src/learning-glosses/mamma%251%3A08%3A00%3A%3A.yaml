simpleMeaning: the breast of a female animal that gives milk to feed her young
scope: The milk-making breast of a female animal, not the milk itself and not a breast that does not give
  milk.
examples:
- The mamma of a cow gives milk to her calf.
- A mamma grows larger while a mother is feeding her young.
