simpleMeaning: the usual and needed costs a person who pays tax runs up in their work or trade
scope: The usual and needed costs a person who pays tax runs up in their work or trade, not private costs
  and not costs that are not needed for the work.
examples:
- She kept every receipt so she could claim the business expense at tax time.
- Travel to meet a client counts as a business expense.
