simpleMeaning: a protein (a food part that helps the body grow) that is left when the starch is taken
  out of grain; it helps dough hold together
scope: This is the part of grain that is left after the starch is taken out, and it helps dough hold together;
  it is not the starch itself and not the whole grain.
examples:
- Bread dough holds together well because of the gluten in the flour.
- People who cannot eat gluten must avoid wheat bread.
