simpleMeaning: having a fault in the body or in morals that makes something not clean under rules about
  food or religious acts
scope: 'Also called unclean: this sense is about a fault that makes something not clean under rules about
  food or religious acts. It is not the sense about a person who behaves in a bad or dirty way.'
examples:
- The meat was impure under the food rules, so they did not eat it.
- In the old law, an animal with a mark on its body was impure and could not be used in the ceremony.
