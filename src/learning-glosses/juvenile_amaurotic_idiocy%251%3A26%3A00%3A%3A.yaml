simpleMeaning: 'A child is born with this illness, which gets worse: the body handles fats wrongly, sight
  and mind fail, and the child dies young, starting at age five.'
scope: A born-with illness of childhood that gets worse, not a sickness caught later in life and not one
  that stays the same.
examples:
- The doctor told the parents their child had juvenile amaurotic idiocy.
- Juvenile amaurotic idiocy starts at age five.
