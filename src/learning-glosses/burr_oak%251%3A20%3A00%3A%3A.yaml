simpleMeaning: An oak of central and eastern North America, medium or large, shedding its leaves each
  year, its egg-shaped acorns almost swallowed by large fringed cups, and yielding hard, fine-grained
  wood.
scope: 'Another spelling of bur oak, also called mossy-cup oak: the large North American oak with fringed
  acorn cups; not a burr, the prickly seed case, and not a different oak species.'
examples:
- A burr oak grew beside the creek.
- The burr oak drops its leaves every autumn.
