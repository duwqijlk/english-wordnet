scope: Also called Lente Iletin, this is a drug used to treat diabetes, sold under a trade name, not a
  drug for another sickness.
examples:
- The nurse gave her Lente Insulin before breakfast.
- Lente Insulin helps people with diabetes keep their blood sugar steady.
