simpleMeaning: With a hard bill like a duck's and webbed feet, many kinds of big bird-hipped dinosaur
  walk on two legs, and may have lived partly in water.
scope: Also called duck-billed dinosaur and hadrosaurus, this is a big two-legged dinosaur with a bill
  like a duck's and webbed feet, not a small one.
examples:
- The hadrosaur waded through the shallow water on its webbed feet.
- The hadrosaur walked on two legs across the muddy plain.
