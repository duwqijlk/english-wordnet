simpleMeaning: 'Its tubers can be eaten, and its flowers smell sweet: this North American vine has long
  been an important food of Native Americans.'
scope: This vine is also called groundnut vine, potato bean, and wild bean; it is not the pod of the peanut
  vine.
examples:
- Native Americans dug groundnut tubers for food.
- Groundnut blossoms filled the air with a sweet smell.
