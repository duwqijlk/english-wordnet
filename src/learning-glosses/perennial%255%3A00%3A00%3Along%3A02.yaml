simpleMeaning: lasting for a very long time with no clear end, and seeming to make itself new again
scope: About a feeling or thing that lasts a long time and seems to renew itself, not the plant that lives
  for three or more seasons.
examples:
- They shared a perennial happiness that never seemed to fade.
- His perennial hope returned each year, fresh and strong.
