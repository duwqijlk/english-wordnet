simpleMeaning: A cold flow of sea water that moves north along the Pacific coast of South America and
  then turns west.
scope: Also called the Humboldt current; a cold flow of sea water off South America, not a wind and not
  a warm current.
examples:
- Fishing boats work in the Peruvian current.
- The Peruvian current flows north along the coast of South America.
