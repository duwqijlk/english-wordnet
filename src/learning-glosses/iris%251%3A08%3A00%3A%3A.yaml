simpleMeaning: the ring of muscle in the eye that opens and closes the black hole in the middle to let
  in more or less light, and gives the eye its colour
scope: The coloured ring in the eye, not a flower and not the ring that opens and closes inside a camera.
examples:
- Her brown iris lets in less light when she steps out into the sun.
- The doctor looked at the iris to see how wide the pupil had grown.
