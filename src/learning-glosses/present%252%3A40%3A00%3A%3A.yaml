simpleMeaning: Give a thing to someone as a gift, freely and without payment.
scope: Not handing over a bill or a charge, and not a formal introduction; the thing given here is a gift.
examples:
- They presented her with a silver necklace on her graduation.
- The mayor presented the trophy to the winning team.
