simpleMeaning: Any book in a set of travel guides put out by the German firm started by the man who gave
  the books their name
scope: One of a set of travel guides from a German firm, not a single guidebook by another maker and not
  a map.
examples:
- She carried a baedeker through the streets of Rome.
- His baedeker listed every church in the town.
