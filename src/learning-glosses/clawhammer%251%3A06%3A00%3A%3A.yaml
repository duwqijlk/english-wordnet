simpleMeaning: a tool for hitting nails in and pulling them out with a split end that grips a nail
scope: 'Another name for this sense is carpenter''s hammer, also called claw hammer: a nail tool with
  a split end, not a tool for hitting nails in only and not a hatchet.'
examples:
- He used the clawhammer to pull the bent nail from the board.
- The clawhammer has a split end for pulling out old nails.
