simpleMeaning: a child who, as a baby, was secretly swapped for another child
scope: This is the child put in place of another baby in secret; it is not about swapping things in general.
examples:
- In the old story, the fairies left a changeling in place of the farmer's baby.
- She feared the sick child was a changeling swapped at birth.
