simpleMeaning: Any creature with feathers that is out and about after dark, such as an owl and others
  of the same kind.
scope: Any creature with feathers that is out and about after dark, such as an owl and others of the same
  kind, not a creature with feathers that sings by day and not a bat.
examples:
- The owl is a night bird that hunts after dark.
- A night bird sang from the trees at midnight.
