simpleMeaning: to get on someone's nerves with small, nagging troubles that keep coming
scope: 'Also called bother, annoy, rag, irritate, gravel, devil, vex, and chafe: to get on someone''s
  nerves with small troubles, not to sting the skin like the plant and not to cause real pain.'
examples:
- Mosquitoes buzzing in my ear really nettle me.
- It nettles me that she never closes the door after she leaves.
