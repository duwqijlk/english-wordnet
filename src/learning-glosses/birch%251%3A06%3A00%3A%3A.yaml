simpleMeaning: a thin stick, or a bundle of thin sticks cut from the tree, used to hit people to punish
  them
scope: A stick for hitting people as punishment, not the tree itself, not its wood, and not the act of
  whipping with one.
examples:
- My father never spared the birch when we misbehaved.
- The schoolmaster kept a birch behind his desk.
