simpleMeaning: a person who likes to tease others, by making fun of them or by stirring their interest
scope: A person who teases others for fun; tease and teaser are other names for this sense, not someone
  who hurts others on purpose.
examples:
- The little annoyer kept poking his sister just to make her laugh.
- Every class has an annoyer who loves to stir up curiosity with half-finished stories.
