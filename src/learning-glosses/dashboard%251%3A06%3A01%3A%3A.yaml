simpleMeaning: A flat board that keeps off splashing water, mud, and other such things, so they do not
  reach the people in a vehicle.
scope: A board that keeps off splashing water and mud, not the board with dials in a car or plane.
examples:
- Mud sprayed over the dashboard of the old carriage.
- The dashboard kept the rain off the driver.
