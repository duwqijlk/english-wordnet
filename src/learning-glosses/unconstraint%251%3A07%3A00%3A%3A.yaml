simpleMeaning: A way of acting with no control over yourself, free and careless, without holding back
  or worrying
scope: 'Also called abandon and wantonness: acting with no control over yourself, free and careless; not
  self-control, and not a lack of rules.'
examples:
- She danced with unconstraint, laughing as she spun across the floor.
- His unconstraint in the meeting shocked the older guests.
