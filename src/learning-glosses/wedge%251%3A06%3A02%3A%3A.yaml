synsetId: 03027561-n
simpleMeaning: a block of wood used to stop a heavy thing from sliding or rolling
scope: This is a wood block that holds a heavy thing still; it is not the heel of a shoe, and not the
  act of pushing into a tight space.
examples:
- He put a wedge under the wheel to stop the cart from rolling.
- A wooden wedge kept the heavy box from sliding.
