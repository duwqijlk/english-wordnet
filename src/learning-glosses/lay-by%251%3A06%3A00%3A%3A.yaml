simpleMeaning: Cars can pull in for a short stop on this paved strip set aside beside a main road
scope: 'Also called a layby and a pull-off: a paved strip beside a main road where cars can stop for a
  short time, not a car park and not a bus stop.'
examples:
- We pulled into a lay-by to check the map.
- The lorry waited in the lay-by until the rain eased.
