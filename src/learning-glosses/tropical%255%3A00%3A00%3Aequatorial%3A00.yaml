simpleMeaning: Of the tropics, the warm lands on either side of the line round the middle of the earth,
  or like those lands.
scope: Of, in, or like the warm lands on either side of the equator, not a word used in a changed, picture
  sense, not the plain of-the-tropics sense, and not hot, damp weather.
examples:
- The islands are tropical all year round.
- Tropical fruit grows well in the warm glasshouse.
