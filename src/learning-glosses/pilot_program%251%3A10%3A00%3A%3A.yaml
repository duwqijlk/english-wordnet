simpleMeaning: A planned set of shows is shown by one show made first, to draw in sponsors
scope: Also called a pilot or a pilot film, this is one show made first as a sample of a planned set,
  to win backers, not a full series already running.
examples:
- The network ordered a pilot program to test the new series.
- They filmed a pilot program to win sponsors for the full series.
