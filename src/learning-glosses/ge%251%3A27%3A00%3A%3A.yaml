simpleMeaning: A grey crystal-like element that breaks easily, a half-metal like silicon that can carry
  power in some cases, used in transistors; found in argyrodite and germanite.
scope: This is a grey element used in transistors, also called germanium, not silicon itself nor any other
  metal.
examples:
- Ge is used in some transistors.
- Ge occurs in the mineral argyrodite.
