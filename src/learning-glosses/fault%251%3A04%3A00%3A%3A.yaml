simpleMeaning: An action that is wrong because of poor judgment, not knowing enough, or not paying attention
scope: This is a wrong action; mistake and error are other names for this sense. Not an electrical failure,
  not a crack in rock and not an illegal serve.
examples:
- The teacher pointed out several grammatical faults in his essay.
- She was quick to notice the faults in her own reasoning.
