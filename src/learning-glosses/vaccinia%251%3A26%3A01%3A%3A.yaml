simpleMeaning: A local infection that appears where a person is inoculated with cowpox virus to protect
  against smallpox. It normally lasts three weeks and leaves a pitted scar.
scope: This is the human reaction at the inoculation site; the other sense of vaccinia is a mild skin
  disease of cattle, while vaccina and variola vaccina are other names for this reaction.
examples:
- The nurse checked the vaccinia on his shoulder each week.
- A vaccinia appeared at the injection site and faded after three weeks.
