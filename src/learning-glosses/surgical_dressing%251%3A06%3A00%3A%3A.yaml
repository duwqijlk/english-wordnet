simpleMeaning: A loose cloth of cotton, woven with wide gaps, put over cuts made in an operation.
scope: A loose cloth of cotton put over cuts made in an operation; not a tight bandage and not a cream
  put on a wound.
examples:
- The nurse put a surgical dressing over the cut.
- A surgical dressing covers the wound after the operation.
