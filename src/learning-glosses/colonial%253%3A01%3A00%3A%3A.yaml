synsetId: 02710765-a
simpleMeaning: of or about a land ruled by another country, typical of such a land, or living in such
  a land
scope: This word describes a land ruled by another country or people living there; it is not a person
  who lives in such a land, and not the sense for animals or tiny living things that live together as
  one group.
examples:
- Colonial rule ended when the country became free from the other country.
- They lived in a small colonial town by the sea.
