simpleMeaning: A sore on the lips or mouth, brought on by the type 1 form of the virus that causes cold
  sores
scope: A sore on the lips or mouth, also called a cold sore, a fever blister, or oral herpes, not a sore
  inside the mouth from another cause and not the type 2 infection.
examples:
- Herpes labialis broke out on his lip after a cold.
- She put cream on the herpes labialis at the corner of her mouth.
