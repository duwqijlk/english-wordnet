simpleMeaning: A plain form of the tongue of England, put forward as a help tongue for talk between nations;
  made by C. K. Ogden and I. A. Richards.
scope: A made-simple form of English for talk between nations, not the full English in all its words;
  devised by C. K. Ogden and I. A. Richards.
examples:
- The class learned Basic English to talk with people from other lands.
- He wrote the guide in Basic English so that all could read it.
