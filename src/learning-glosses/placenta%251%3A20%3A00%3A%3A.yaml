simpleMeaning: The part of a flower's seed-case where the young seeds take shape.
scope: The part of a flower's seed-case where the young seeds take shape, not the organ in the womb that
  feeds a baby before birth.
examples:
- The placenta of the flower holds the ovules in place.
- The seeds form on the placenta inside the flower.
