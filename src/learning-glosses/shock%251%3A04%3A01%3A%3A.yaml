simpleMeaning: People or groups clashing fiercely as they go into battle.
scope: This is the battle-clash sense, also called impact, not an earth tremor, a sudden fright, or a
  vehicle part.
examples:
- The armies met in the shock of battle.
- The shock of the cavalry charge scattered the infantry.
