simpleMeaning: leading a person to believe what is not true, by using pleasant or attractive ways
scope: Leading someone to believe what is not true in a pleasant, attractive way; not the sense that means
  only very attractive and hard to say no to.
examples:
- He told a beguiling story about getting rich quick, and many people believed him.
- Her beguiling promise of easy money hid the real cost.
