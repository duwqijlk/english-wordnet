simpleMeaning: a machine for the kitchen that cooks food by covering it in very hot oil, in a size that
  fits what it will be used for
scope: A machine for the kitchen that cooks food by covering it in very hot oil; deep fryer, frier, fryer
  and fryolator are other names for this sense, not a pan for shallow frying and not an oven.
examples:
- She bought a deep fat fryer to make chips at home.
- The deep fat fryer in the cafe cooks the fish fast.
