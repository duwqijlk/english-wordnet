simpleMeaning: Along the grain, a thing like this can be split, cut or divided.
scope: Describes a thing that can be split along the grain; not a thing that splits easily in any direction,
  and not a substance that can split atoms.
examples:
- The fissile wood split cleanly along the grain.
- Fissile crystals break apart along thin lines.
