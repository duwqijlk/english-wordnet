simpleMeaning: to eat with no restraint, taking in far more than you need and going on with no care for
  manners
scope: 'Also called binge, engorge, glut, gorge, gormandise, gormandize, gourmandize, ingurgitate, overeat,
  overgorge, overindulge, pig out, satiate and stuff: to eat with no restraint, taking in far more than
  you need, not to eat a good meal and not to eat a little too much.'
examples:
- He englutted himself at the feast and could hardly move.
- The children englut themselves on sweets whenever they can.
