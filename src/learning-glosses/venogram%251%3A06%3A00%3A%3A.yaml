simpleMeaning: A dye that shows up on X rays is put into a blood tube, and a picture of the tube is then
  made.
scope: Also called a phlebogram, this is an X ray picture of a blood tube taken after dye is put in, not
  a plain picture with no dye.
examples:
- The venogram showed the blood tube clearly after the dye was put in.
- A venogram was taken to look at the blood tube.
