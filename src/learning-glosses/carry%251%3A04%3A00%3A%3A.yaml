simpleMeaning: The act of holding something and moving it from one place to another.
scope: This is not the action of a channel or signal passing something along; it is the plain noun for
  moving an object by holding it.
examples:
- The carrying of water from the well took most of the morning.
- The carrying of the flag at the head of the parade is a great honour.
