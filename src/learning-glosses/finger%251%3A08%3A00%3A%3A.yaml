simpleMeaning: Any of the end parts of a hand, sometimes not counting the thumb.
scope: This is the hand's own end part, not a glove's covering, a unit of length, or the act of touching.
examples:
- Her fingers were long and thin.
- He cut his finger while slicing bread.
