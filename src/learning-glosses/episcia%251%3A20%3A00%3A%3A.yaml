simpleMeaning: Any plant of a group grown for its bright leaves and flowers, it usually creeps along the
  ground, sends out runners, and hangs down in trails.
scope: This is a trailing plant grown for its bright leaves and flowers, not a climbing vine and not a
  plant grown for its fruit.
examples:
- Episcia trails over the edge of its hanging basket.
- She grows episcia for its bright leaves.
