simpleMeaning: A way of teaching by asking questions and getting answers, which Socrates used to draw
  true answers out of his learners.
scope: 'Also called the maieutic method: a way of teaching by asking questions, not a talk and not a set
  of notes.'
examples:
- The teacher used the Socratic method in class today.
- With the Socratic method, he drew the answer out of his students by asking questions.
