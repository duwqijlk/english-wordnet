simpleMeaning: As water flows past, a soft part in a water animal pulls out the gas the animal needs to
  live.
scope: Also called a gill, this soft part of a water animal takes its gas from the water.
examples:
- The branchia of the fish fluttered as water passed over them.
- Water flows over the branchia so the fish can take in gas.
