simpleMeaning: Ways of acting that are put on and not natural, meant to make other people think well of
  you
scope: Pose is another name for this sense; this is about showy manners put on to impress, not about natural
  good manners.
examples:
- Don't put on airs with me.
- She dropped her airs when she was with old friends.
