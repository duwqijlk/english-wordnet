simpleMeaning: A plate of armour that guards the nose.
scope: A plate of armour that guards the nose; not the middle part of glasses that rests on the nose,
  and not a strap of a bridle that goes over the animal's nose.
examples:
- The knight's nosepiece guarded their nose in battle.
- A dented nosepiece hung with the old armour.
