simpleMeaning: A dark material made of char in the form of burnt animal remains, used to give a dark colour
scope: A dark material of char from burnt animal remains, also called animal black, animal charcoal and
  bone char; not a dark dye from plants and not a dark stone.
examples:
- Bone black gives a deep dark colour.
- Artists use bone black as a dark pigment.
