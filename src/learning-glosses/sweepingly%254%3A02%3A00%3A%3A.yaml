simpleMeaning: in a way that covers everything, with no exceptions made
scope: In a way that covers everything with no exceptions, not in a careful way that looks at each part,
  and not in a gentle way.
examples:
- He sweepingly condemned the entire population for the war.
- She sweepingly dismissed all the old rules at once.
