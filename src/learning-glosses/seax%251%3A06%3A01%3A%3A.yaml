simpleMeaning: The Germanic peoples of the Migration period and the Early Middle Ages, above all the Saxons,
  had a sword or a dagger of this kind.
scope: This sword or dagger belongs to the Germanic peoples of the Migration period and the Early Middle
  Ages, above all the Saxons.
examples:
- Seaxes were found beside double-edged swords and were probably carried as side arms.
- The Saxons carried seaxes.
