simpleMeaning: a clear, crystal-like chemical that forms part of some white or yellow colouring matter
  in plants
scope: A clear crystal-like chemical in some white or yellow plant colouring matter, not the colour itself
  and not the plant that makes it.
examples:
- Flavone is found in the white petals of the flower.
- The chemist found flavone in the yellow plant pigment.
