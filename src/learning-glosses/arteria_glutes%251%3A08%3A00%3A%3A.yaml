simpleMeaning: Branches of the inner hip artery that bring blood to the hip joint and the buttock area.
scope: 'Also called arteria glutea and gluteal artery: branches of the inner hip artery that bring blood
  to the hip joint and the buttock area, not the main hip artery and not a vein.'
examples:
- The arteria glutes feeds the hip joint and buttock area.
- Blood reaches the buttocks through the arteria glutes.
