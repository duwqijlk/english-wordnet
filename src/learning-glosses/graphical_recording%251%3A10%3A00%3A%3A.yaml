simpleMeaning: A drawing that shows the links between certain amounts, with points set out against a set
  of marked lines
scope: This drawing of amounts is also called graph and graphical record, and is not a written list of
  facts and not a plain drawing.
examples:
- The graphical recording showed how sales changed over the year.
- He made a graphical recording of the test results.
