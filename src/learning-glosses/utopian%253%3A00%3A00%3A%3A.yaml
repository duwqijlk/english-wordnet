simpleMeaning: having a perfect quality that cannot be reached in real life, or aiming at such perfection
scope: This sense describes hopes or plans that have or aim at a perfect quality that cannot be reached
  in real life. It is not a word for a person who wants to change society, and not a word meaning of or
  like a perfect place.
examples:
- His utopian hopes for a world with no money never came true.
- She had a utopian plan to end all work, but no one thought it could happen.
