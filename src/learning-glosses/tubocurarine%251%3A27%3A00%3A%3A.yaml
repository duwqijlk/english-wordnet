simpleMeaning: The muscles that move the bones go slack when this poison from some trees of warm South
  America takes hold.
scope: Also called curare, it is a poison from some trees of warm South America that loosens the muscles
  that move the bones.
examples:
- This poison, tubocurarine, comes from trees of warm South America and makes muscles go slack.
- The poison tubocurarine acts on the muscles that move the bones.
