simpleMeaning: a sudden pull of the stomach that tries to make you sick but brings nothing up
scope: A sudden pull of the stomach that tries to make you sick but brings nothing up, not the act of
  trying to be sick and not a slow rise and fall.
examples:
- He felt a heave in his stomach after the rough boat ride.
- A bad case of the heaves kept her in bed.
