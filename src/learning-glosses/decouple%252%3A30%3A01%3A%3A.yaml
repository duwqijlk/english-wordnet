simpleMeaning: to take away the shock waves that move through the air from something that bursts with
  great force
scope: This is about taking away shock waves in the air from a bursting thing, not about parting two joined
  circuits or other joined parts.
examples:
- The team tried to decouple the explosive so no shock waves would move through the air.
- A thick cover can decouple an explosive and stop its waves in the air.
