simpleMeaning: In statistics, a value in a list of how often things happen that is free to change
scope: In statistics, a value that can change freely; not a fixed value and not the whole set of data.
examples:
- Each degree of freedom lets one more value vary freely.
- The test used five degrees of freedom.
