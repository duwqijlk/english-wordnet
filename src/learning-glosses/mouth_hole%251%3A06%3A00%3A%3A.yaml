simpleMeaning: an opening, as in a ski mask, made for the part of the face used to eat, speak and breathe
scope: An opening in a face covering made for the part of the face used to eat, speak and breathe, not
  an opening for the eyes and not an opening for the nose.
examples:
- The ski mask had a mouth hole so she could breathe easily.
- He cut a mouth hole in the costume.
