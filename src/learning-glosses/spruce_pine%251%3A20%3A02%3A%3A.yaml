simpleMeaning: with needles in pairs and red to yellow-brown bark split into small squares, a shrubby
  pine grows on the northwest coast of the United States
scope: Also called a lodgepole, a lodgepole pine, and a shore pine, it is the shrubby pine with bark split
  into small squares, not the small spruce of boggy land in the northeast.
examples:
- Spruce pines grow on the northwest coast.
- The spruce pine has bark split into small squares.
