simpleMeaning: The branch of biology that studies how outer space affects living things and looks for
  life beyond Earth.
scope: The branch of biology that studies outer space and living things; also called astrobiology, not
  the study of life on Earth alone and not the study of stars.
examples:
- Exobiology asks whether life exists on other worlds.
- She works in exobiology, studying microbes in space-like conditions.
