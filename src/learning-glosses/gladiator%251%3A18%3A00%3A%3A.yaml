simpleMeaning: In ancient Rome, a paid fighter or a prisoner who fought to the death in front of people
  to amuse them
scope: This is a fighter in ancient Rome who fought to the death for a crowd, not a soldier in a war and
  not a fighter today.
examples:
- The gladiator fought with a sword in front of a large crowd.
- A young gladiator was a prisoner forced to fight to the death.
