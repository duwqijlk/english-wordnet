simpleMeaning: Any of several pink-flowered plants of wet ground in the eastern United States, like a
  true centaury.
scope: Any of several pink-flowered plants of wet ground in the eastern United States, like a true centaury;
  marsh pink is another name for this sense, not a true centaury itself and not a dry-ground plant.
examples:
- Bitter floom blooms pink in the marshes of summer.
- She found bitter floom beside the tidal creek.
