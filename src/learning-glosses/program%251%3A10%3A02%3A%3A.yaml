simpleMeaning: In computing, a series of instructions that a computer can read and carry out.
scope: This is the set of instructions a computer runs, not a plan of steps or goals, not a system of
  projects or services, not a television or radio show, not a political party's statement of aims, not
  a list of events at a show, not a course of study, not a public performance, and not the verb meanings.
examples:
- The program crashed when it tried to open the file.
- She wrote a program that sorts the data by date.
