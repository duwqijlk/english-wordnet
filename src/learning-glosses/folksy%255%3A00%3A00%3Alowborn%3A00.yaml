simpleMeaning: Of the common people, especially in the way one speaks, in how one thinks and feels, and
  in other such ways.
scope: For speech, attitudes, and manners that belong to the common people.
examples:
- His humour was folksy, full of plain talk and homely wisdom.
- Her manner was folksy, warm and plain-spoken.
