senseId: 'minimalist%1:18:01::'
synsetId: 10340012-n
simpleMeaning: a person who wants to keep things as they are and who supports only small changes in government
  or politics
scope: This is a person in politics who supports only small changes, not a person who makes or supports
  art in a very simple style.
examples:
- As a minimalist, he opposed big changes to the tax system and asked for only a small cut.
- The party chose a minimalist who wanted only minor reforms, not a new system.
