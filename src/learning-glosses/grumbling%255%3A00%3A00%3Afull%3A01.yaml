simpleMeaning: Said of a sound that goes on and on, full and low, with a deep beat to it
scope: This is said of a sound that goes on and on, full and low, also called rumbling, not a complaint
  said in a low voice and not a loud low noise itself.
examples:
- The sound from the engine was grumbling and low.
- The thunder sounded grumbling in the distance.
