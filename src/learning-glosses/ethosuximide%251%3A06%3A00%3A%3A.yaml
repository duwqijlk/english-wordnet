simpleMeaning: A drug that stops fits, sold as Emeside and Zarontin, used to treat a mild form of epilepsy.
scope: A drug that stops fits in a mild form of epilepsy, not a drug for pain and not a drug for sleep;
  no other name is listed for this sense.
examples:
- The doctor gave the child ethosuximide for her petit mal fits.
- Ethosuximide kept his fits from coming back.
