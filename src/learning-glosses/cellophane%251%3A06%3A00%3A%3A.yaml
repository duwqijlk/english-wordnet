simpleMeaning: a clear, thin stuff like paper that water cannot pass through, used to wrap sweets, cigarettes,
  and other things
scope: A clear wrapping stuff like thin paper; it is not paper itself and not the sweets or cigarettes
  it is used to wrap.
examples:
- She wrapped the flowers in clear cellophane before giving them away.
- The sweets were sealed in cellophane to keep them dry.
