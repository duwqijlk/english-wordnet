simpleMeaning: the skull bones that form the mouth's frame, let it open, and keep the teeth set
scope: This is the set of skull bones that can open the mouth, not the broader skull structure that frames
  it, nor the gripping part of a tool.
examples:
- He broke his jaw and could barely open his mouth for weeks.
- The jaw hinges just below the ear, letting the mouth swing open.
