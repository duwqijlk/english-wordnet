simpleMeaning: a plant that lives for years in wet ground, with long flat leaves shaped like swords and
  roots that smell nice
scope: This is a marsh plant with sword-shaped leaves, not a garden iris and not a plant grown for food;
  calamus, flagroot, myrtle flag and sweet calamus are other names for this sense.
examples:
- Sweet flag grows thick along the edge of the pond.
- She dug up sweet flag roots for their sweet smell.
