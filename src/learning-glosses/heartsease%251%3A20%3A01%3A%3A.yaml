simpleMeaning: A common flower of the Old World, a kind of viola with cream-coloured flowers often touched
  with purple.
scope: A common Old World viola with cream-coloured flowers often touched with purple, also called field
  pansy; not the long-grown European herb from which garden pansies come.
examples:
- Heartsease grew along the edge of the old garden.
- The heartsease had creamy flowers touched with purple.
