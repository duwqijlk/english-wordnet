simpleMeaning: Showy blooms of yellow to red-orange grow on this warm-climate bush or small tree, at times
  put in the plant group Poinciana.
scope: Also called flamboyant tree and pride of barbados, this warm-climate bush or small tree stands
  out for its showy blooms of yellow to red-orange.
examples:
- The paradise flower bloomed with showy yellow blooms.
- They planted a paradise flower for its showy blooms.
