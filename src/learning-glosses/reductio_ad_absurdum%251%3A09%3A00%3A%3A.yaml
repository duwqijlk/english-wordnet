simpleMeaning: a proof that works by taking a claim and showing that what comes out of it is absurd, or
  that denying the claim ends in a contradiction
scope: Also called reductio; a proof by showing a claim leads to nonsense, not a direct proof from facts.
examples:
- Her reductio ad absurdum showed the claim led to nonsense.
- The proof by reductio ad absurdum ended in a contradiction.
