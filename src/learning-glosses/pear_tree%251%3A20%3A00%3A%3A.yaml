simpleMeaning: In many kinds, people grow this plant widely for sweet fruit full of juice and rough to
  the bite, and it comes from Europe, Asia, and Africa.
scope: Also called pear, it is a plant from Europe, Asia, and Africa that bears sweet fruit full of juice
  and rough to the bite, grown widely in many kinds.
examples:
- The pear tree bore sweet fruit.
- Sweet fruit full of juice grew on the pear tree.
