simpleMeaning: Feeding the muscles inside the hand and the skin on its inner side, a nerve cord runs down
  the inner side of the arm past the elbow.
scope: Also called the ulnar nerve and nervus ulnaris, this nerve cord runs down the inner arm past the
  elbow, not a nerve cord of the outer arm.
examples:
- The cubital nerve runs past the elbow on the inner side of the arm.
- The cubital nerve feeds the muscles inside the hand.
