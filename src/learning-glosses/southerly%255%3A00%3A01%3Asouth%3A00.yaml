simpleMeaning: 'Said especially of wind: coming from the south.'
scope: Also called southern, this is wind coming from the south, not the wind itself as a noun, not the
  use for what lies or faces toward the south, and not the adverb uses for coming from or going toward
  the south.
examples:
- The breeze turned southerly by noon.
- A southerly wind brought the rain.
