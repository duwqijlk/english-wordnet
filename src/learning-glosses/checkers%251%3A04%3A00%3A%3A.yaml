simpleMeaning: a game for two on a board with light and dark squares; each player has 12 pieces, and the
  aim is to take the other's by jumping over them
scope: 'Also called draughts: the board game for two players with 12 pieces each, not a single piece used
  in a board game.'
examples:
- We played checkers at the kitchen table after dinner.
- In checkers, you take a piece by jumping over it.
