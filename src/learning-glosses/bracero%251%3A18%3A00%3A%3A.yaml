simpleMeaning: During World War II, when workers were too few, a worker from Mexico came to the United
  States to work on farms and railroads
scope: This was a Mexican worker in the United States during World War II, working on farms and railroads
  when workers were too few.
examples:
- The bracero worked on a farm during World War II.
- Braceros worked on the railroads when workers were too few.
