simpleMeaning: A high rock face, steep and rough, that rises sharply from the ground
scope: A steep, rough rock face; not a smooth hill, and not a small stone.
examples:
- The climbers made their way up the crag in the rain.
- A lone crag stood above the valley, steep and bare.
