simpleMeaning: A hard mouth that sticks out like a bird's, on an animal that is not a bird
scope: A bird-like mouth on an animal that is not a bird, not a bird's own mouth and not a tip on a plant.
examples:
- The turtle snapped at the leaf with its beak.
- The beak of the turtle closed on the food.
