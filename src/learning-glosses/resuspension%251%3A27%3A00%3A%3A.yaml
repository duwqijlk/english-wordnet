simpleMeaning: the act of mixing tiny bits of solid back into a liquid after they have sunk to the bottom
scope: Tiny bits of solid mixed back into a liquid after they sank, not the first mixing and not the bits
  settling out.
examples:
- After the powder settled, a quick resuspension brought it back into the liquid.
- The nurse shook the bottle to get a resuspension of the medicine.
