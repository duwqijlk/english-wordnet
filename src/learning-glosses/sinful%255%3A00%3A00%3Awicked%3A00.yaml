simpleMeaning: very bad and wrong, because people believe it goes against God's rules
scope: 'Also called ungodly and iniquitous: this describes acts or things thought to be very wrong, not
  a person who has done wrong acts.'
examples:
- He said it was sinful to lie to your parents.
- They thought dancing on that holy day was a sinful act.
