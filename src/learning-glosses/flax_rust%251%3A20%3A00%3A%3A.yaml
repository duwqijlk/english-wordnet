simpleMeaning: a tiny living thing that grows on a crop plant and brings on a brown-red sickness in it
scope: 'Also called flax rust fungus: a tiny living thing that grows on a crop plant and brings on a brown-red
  sickness, not the sickness itself and not a plant disease that spreads in the soil.'
examples:
- Flax rust grew on the stems of the flax plants after the wet spring.
- The farmer looked for flax rust on the leaves of his crop.
