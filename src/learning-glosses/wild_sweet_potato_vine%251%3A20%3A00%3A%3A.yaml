simpleMeaning: with an enormous starchy root, this soft-stemmed plant of tropical America spreads or climbs
  and lives for years; some say the starchy root crop came from it
scope: Also called wild potato vine, man-of-the-earth, manroot, and scammonyroot; a tropical American
  plant with an enormous starchy root, not the food plant grown for its starchy roots, and not the potato
  grown in fields.
examples:
- The wild sweet potato vine lies flat along the ground.
- Farmers say the wild sweet potato vine may be where the sweet potato came from.
