simpleMeaning: making people feel angry or bitter about something, or likely to do so
scope: 'Also called provoking: describes something that makes people angry or bitter, not something that
  stirs a liquid or makes people worried and restless.'
examples:
- His agitating remarks about the pay cut made the workers very angry.
- It was an agitating speech, and many listeners left feeling bitter.
