simpleMeaning: In physics, an account that makes clear a natural event by the way a region of force acts
  on stuff or on other such regions
scope: In physics, an account that makes clear a natural event by the way a region of force acts on stuff
  or on other such regions; not an account that deals only with bits of stuff and not a set of rules for
  doing sums.
examples:
- Field theory explains how a magnet can pull iron without touching it.
- In field theory, the pull of a magnet is explained by the field around it.
