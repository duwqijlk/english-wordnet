senseId: 'myrmecophyte%1:20:00::'
synsetId: 13199954-n
simpleMeaning: Ants live with this plant, which gives them a place to live or food to eat, in a way that
  helps them both
scope: A plant that gives ants food or shelter and lives with them in a way that helps both, not a plant
  that ants merely visit and not a plant that ants eat bare.
examples:
- The ants live in the myrmecophyte and feed on it.
- Ants feed on the myrmecophyte and make their home in its stems.
