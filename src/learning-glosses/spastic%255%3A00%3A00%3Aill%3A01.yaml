simpleMeaning: having a condition where muscles stay very tight and part of the body cannot move in the
  usual way
scope: Used for a person who has this condition; not the noun that names such a person, and not the wider
  sense about a muscle suddenly tightening in a way the person cannot control.
examples:
- A spastic child may need help to walk and to hold things.
- The spastic patient worked with a doctor to help his tight muscles.
