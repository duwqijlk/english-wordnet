simpleMeaning: This word is said of people who keep to their own small group and turn away others they
  think are below them.
scope: Also called snobbish, snobby, clubby and clannish, this word fits people who keep to their own
  small group and turn away others they think are below them.
examples:
- The cliquish girls at school would not let anyone else sit with them.
- His cliquish manner kept new neighbours at a distance.
