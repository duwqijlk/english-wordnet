simpleMeaning: Any of various underwater algae of the genus Chara, whose stems have nodes with whorled,
  threadlike branches and are usually coated with calcium carbonate.
scope: A jointed alga of the genus Chara; not a seaweed, and not a flowering water plant such as pondweed.
  Botanical term; the plants are usually lime-crusted.
examples:
- Stonewort covered the shallows, its stems grey with lime.
- Each node of the stonewort carried a whorl of threadlike branches.
