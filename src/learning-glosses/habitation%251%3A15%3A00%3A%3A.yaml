simpleMeaning: the natural home of an animal or plant, where it lives in the wild
scope: The natural home of an animal or plant, not a house built for people and not the act of living
  in a place.
examples:
- This wet ground is the natural habitation of these frogs.
- The tall grass gives safe habitation to many small birds.
