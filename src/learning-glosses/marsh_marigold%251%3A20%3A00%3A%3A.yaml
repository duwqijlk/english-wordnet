simpleMeaning: Bright yellow flowers like those of a yellow wildflower mark a plant of wet ground in Europe
  and North America.
scope: Also called cowslip, kingcup, meadow bright, and water dragon, it is a plant of wet ground in Europe
  and North America with bright yellow flowers.
examples:
- We saw marsh marigold in the wet field.
- Marsh marigold stood in the wet ground by the stream.
