simpleMeaning: Used of a verb form that speaks about things that will happen or exist later.
scope: This labels a verb form, not the general adjective meaning yet to come, not something effective
  in looking ahead, not an elected officer who has not yet served, not the noun for time still ahead,
  not the noun name of the tense, and not traded commodities bought for later delivery.
examples:
- In 'I will go', 'will' is a future auxiliary.
- The future tense is formed with 'will' in English.
