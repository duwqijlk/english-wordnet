simpleMeaning: In music, a form where one main tune is played, then played again a fifth higher or a fourth
  lower than the first time
scope: 'This is the music sense: one main tune played again higher or lower. It is not the sense where
  a person forgets who they are and leaves home, and not a dreamlike state.'
examples:
- The composer wrote a fugue for the organ.
- He played a short fugue on the piano.
