simpleMeaning: much more than what is usual, very out of the way and worth notice, and of a special kind
scope: Far past what is usual, not just a little out of the way and not just a thing that is new.
examples:
- Her extraordinary gift for music was clear when she was still a small child.
- The storm caused extraordinary harm to the town.
