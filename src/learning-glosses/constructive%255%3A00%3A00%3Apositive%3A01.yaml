simpleMeaning: giving attention to what is good and worth praise, what is hopeful, and what does good
scope: Pointing out the good and hopeful side of things; not about building something or making something
  better by doing work.
examples:
- She gave constructive praise, pointing out all the good points in his work.
- His constructive remarks focused on what was hopeful and good, not on what was wrong.
