simpleMeaning: A tube-shaped wind pipe with eight digit openings and a mouthpiece with a narrow slit
scope: This is a tube-shaped wind pipe with eight digit openings; recorder, fipple pipe and vertical flute
  are other names for this sense, not a side-blown pipe and not a reed pipe.
examples:
- She played a fipple flute at the fair.
- The fipple flute has eight holes.
