simpleMeaning: A well-liked Chinese way of thinking, based on the teachings of Lao-tzu, holding that many
  gods are in all things and using alchemy, fortune-telling and magic.
scope: A well-liked Chinese way of thinking based on the teachings of Lao-tzu, also called Hsuan Chiao,
  and not the Taoism that is only a religion following Lao-tzu.
examples:
- Taoism teaches that many gods are present in all things.
- She studies Taoism and its alchemy, fortune-telling and magic.
