simpleMeaning: a bit of matter — an atom, a molecule, a radical, or an ion — that joins onto a central
  atom and forms a larger whole around it
scope: A bit of matter that joins a central atom and forms a larger whole around it; not the central atom
  itself and not a loose mix of two things.
examples:
- The ligand binds to the metal atom at the centre of the complex.
- In the lab, a ligand joined to the central atom to form a new compound.
