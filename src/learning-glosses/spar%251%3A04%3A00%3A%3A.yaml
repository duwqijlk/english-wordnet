simpleMeaning: moving your fists and arms to attack and to keep yourself safe, done as practice by a boxer
scope: Also called sparring, this is a boxer's practice fighting with the fists and arms; it is not a
  light-coloured hard natural substance from the ground and not a strong round pole that holds ropes on
  a boat.
examples:
- A quick spar with his coach warmed him up before the day's training.
- The morning spar lasted ten minutes and no one was hurt.
