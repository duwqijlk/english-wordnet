simpleMeaning: A person is given a place in a group, with the rights, the work and the duties that go
  with it
scope: 'Another name for include and admit: to give a person a place in a group and the rights that go
  with it, not to keep them out.'
examples:
- The club voted to let in three new members.
- She was let in to the profession after years of study.
