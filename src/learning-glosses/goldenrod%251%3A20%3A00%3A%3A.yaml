simpleMeaning: one of many North American plants that have flowers mostly in summer and fall, especially
  plants of the group called Solidago
scope: This names North American plants that flower mostly in summer and fall, as a group. It is not the
  name of a color or of a metal rod.
examples:
- Goldenrod blooms along the road in late summer.
- Fields of goldenrod turned yellow in the fall.
