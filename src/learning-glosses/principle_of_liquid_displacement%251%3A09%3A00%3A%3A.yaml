senseId: 'principle_of_liquid_displacement%1:09:00::'
synsetId: 06000127-n
simpleMeaning: In hydrostatics, the amount of space a thing takes up in a fluid (water, oil, or air) is
  the same as the amount of fluid it pushes aside
scope: The rule that a thing in a fluid (water, oil, or air) pushes aside as much fluid as the space it
  takes up; not the rule about the push that lifts it, and not a rule about things that float.
examples:
- The principle of liquid displacement tells us the sunken stone pushes aside its own volume of water.
- By the principle of liquid displacement, the ship's hull pushes aside water equal to the part below
  the surface.
