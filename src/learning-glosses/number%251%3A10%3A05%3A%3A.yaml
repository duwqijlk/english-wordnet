synsetId: 06337519-n
simpleMeaning: the grammar category that shows whether a noun, pronoun, or verb form is about one thing,
  two things, or many things.
scope: This sense is not a numeral, a symbol for counting, an identification code, or an item in a series;
  it is the grammar feature of singular, dual, or plural form.
examples:
- The number of a verb must agree with the number of its subject.
- In this language, number is shown by a suffix on the noun.
