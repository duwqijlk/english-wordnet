simpleMeaning: Something that juts out from what is around it, making a lump or a rise on the surface.
scope: A lump or rise that stands out from what is around it, also called a bump, bulge, swelling, hump,
  jut, prominence, protrusion, excrescence, or extrusion; not the state of bulging itself.
examples:
- The gun in his pocket made an obvious protuberance.
- The protuberance on the rock caught his sleeve.
