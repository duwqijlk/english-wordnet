simpleMeaning: Found out and settled by close study of what can be seen and tested in the world
scope: This is a fact found out by close study, not a guess and not a thing merely seen in passing, and
  discovered is another name for this sense.
examples:
- The observed change in heat was found by close study over many weeks.
- No one could explain the observed facts, though they had been found by careful study.
