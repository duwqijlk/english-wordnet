simpleMeaning: Facts come out of this machine as amounts that can change, such as where a needle points
  or how strong a voltage is.
scope: This is the machine that shows facts as amounts that can change, also called an analog computer.
examples:
- The analogue computer showed the heat as a voltage.
- An analogue computer used the place of a needle to show speed.
