simpleMeaning: The sound made when a finger moves quickly across the thumb, from the tip of the thumb
  down to its base, on the same hand
scope: This is the sound made by moving a finger across the thumb, not the action itself and not a sudden
  sharp sound made in any other way.
examples:
- The snap of his fingers was loud in the quiet room.
- I heard a clear snap when she moved her finger across her thumb.
