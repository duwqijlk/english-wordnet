simpleMeaning: one of the thin, three-sided flaps on a valve (a part that opens and shuts) inside the
  heart
scope: 'Also called a leaflet: a thin flap inside the heart. Not the pointed shape made by two curved
  lines, and not the small raised part on a tooth.'
examples:
- The doctor said one cusp of the heart valve was not closing well.
- Each cusp helps stop blood from flowing the wrong way.
