simpleMeaning: the still arm of a sundial whose shadow shows the time
scope: The still arm of a sundial whose shadow shows the time; not the dial face and not a clock hand.
examples:
- The gnomon casts a shadow on the dial.
- The shadow of the gnomon showed that it was three in the afternoon.
