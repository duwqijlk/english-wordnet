senseId: repellent%5:00:00:nonabsorbent:00
synsetId: 00008009-s
simpleMeaning: not able to soak up liquid or to mix with it
scope: This sense means not able to soak up liquid or to mix with it; resistant is another name for this
  sense. Not a chemical that keeps animals away, not a treatment put on cloth to keep water out, and not
  the sense of pushing people away by being unpleasant.
examples:
- The coat is made of a water-repellent cloth that rain cannot soak into.
- This repellent plastic sheet does not mix with water.
