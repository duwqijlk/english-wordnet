senseId: 'molal_concentration%1:07:00::'
synsetId: 05047061-n
simpleMeaning: 'How much of a thing is dissolved in a liquid, counted by weight: the number of moles,
  set amounts, in each kilogram of the liquid'
scope: 'Molality is another name for this sense: the strength of a liquid counted by moles in each kilogram
  of liquid, not the strength counted by volume.'
examples:
- The molal concentration of the mixture was two moles per kilogram.
- She worked out the molal concentration before she mixed the batch.
