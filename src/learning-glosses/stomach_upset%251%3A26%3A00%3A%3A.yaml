simpleMeaning: A trouble with digesting food, marked by discomfort in the belly, burning in the chest,
  or feeling sick
scope: A trouble with digesting food, also called indigestion, dyspepsia, or an upset stomach; not food
  poisoning and not a stomach ulcer.
examples:
- A stomach upset left her feeling sick all day.
- Rich food can cause a stomach upset.
