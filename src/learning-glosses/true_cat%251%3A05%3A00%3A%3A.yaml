simpleMeaning: a furry animal of the same family as lions, usually with thick soft fur and unable to roar
scope: A furry animal of the lion family that cannot roar; cat is another name for this sense, not a lion
  or a tiger that roars.
examples:
- Our true cat slept on the sofa all afternoon.
- The true cat had thick soft fur and purred when I stroked it.
