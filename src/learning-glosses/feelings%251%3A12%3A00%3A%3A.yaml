simpleMeaning: a person's sensitivity about their own dignity or principles, which others can hurt
scope: This is sensitivity about dignity or principles, not physical sensation, and not a passing mood.
examples:
- Her feelings were hurt by the unfair criticism.
- He appealed to their feelings of justice.
