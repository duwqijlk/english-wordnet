simpleMeaning: A thin line made of many fine threads twisted together to form a thread, a rope, or a cable
scope: A thin line of many fine threads twisted together, not a shore by the sea, not a necklace, and
  not a single slender thread on its own.
examples:
- The rope is made of several strands twisted together.
- One strand of the cable had come loose.
