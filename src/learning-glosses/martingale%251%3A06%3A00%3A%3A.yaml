simpleMeaning: So the horse cannot throw its head back, a strap on its harness joins the part over the
  nose to the band round the belly.
scope: This strap on a horse's harness joins the part over the nose to the band round the belly and keeps
  the horse from throwing its head back.
examples:
- The rider fixed the martingale before the horse threw its head back.
- The martingale held the horse's head down.
