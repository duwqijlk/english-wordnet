simpleMeaning: to treat someone unfairly or do something hurtful to them.
scope: This is not about making a mistake or giving an incorrect answer; it is about behaving badly toward
  a person.
examples:
- She felt she had been wronged by her manager and asked for an apology.
- He wronged his friend by telling lies about him.
