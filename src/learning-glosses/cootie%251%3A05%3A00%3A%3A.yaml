simpleMeaning: a small insect that lives on the bodies of people and feeds off them
scope: A real small insect that lives on people's bodies; it is not a word for dirt in general, for germs
  in general, or for an illness.
examples:
- Health workers checked the man's clothes and skin and found a cootie.
- A cootie can bite the skin and make it itch.
