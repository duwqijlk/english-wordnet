simpleMeaning: Large shiny green leaves that turn bronze-red in fall grow on this plant of the southeastern
  United States, with single white flowers shaped like funnels and tinged with pink.
scope: A plant of the southeastern United States with single white flowers tinged with pink, not a plant
  with clusters of flowers.
examples:
- The oconee bells had single white flowers tinged with pink.
- In fall the leaves of the oconee bells turn bronze-red.
