senseId: 'emulate%2:33:00::'
synsetId: 01124831-v
simpleMeaning: To do as well as someone or something, or to come close to matching them.
scope: This is matching or nearly matching a rival; not trying to be like them by copying their ways,
  and not a machine copying how another machine works.
examples:
- This artist's drawings cannot emulate his water colours.
- No later singer could emulate her voice.
