simpleMeaning: A body chemical made by the front part of the small gland at the base of the brain, which
  makes people grow
scope: A body chemical made by the front part of the small gland at the base of the brain, which makes
  people grow; also called growth hormone, human growth hormone, somatotrophic hormone, somatotropic hormone
  and somatotropin; not a chemical that makes bones hard, and not a chemical from the back of that gland.
examples:
- Somatotrophin is made in the pituitary gland.
- A lack of somatotrophin slows a child's growth.
