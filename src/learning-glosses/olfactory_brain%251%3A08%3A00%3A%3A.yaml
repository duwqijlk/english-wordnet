simpleMeaning: a part of the head that runs the sense of smell in lower animals; in people it seems to
  shape complex emotional behavior
scope: A part of the head that runs the sense of smell in lower animals; rhinencephalon is another name
  for this sense, not the part of the head that runs sight and not the part that runs hearing.
examples:
- The olfactory brain runs the sense of smell in lower animals.
- In the olfactory brain, smell links to strong feelings.
