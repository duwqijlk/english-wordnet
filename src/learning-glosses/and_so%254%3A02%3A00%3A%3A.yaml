simpleMeaning: after that, or soon after that, often used to link one thing said to the next
scope: This means after that or soon after that, often linking one thing said to the next; then and so
  are other names for this sense, not a word that gives a reason.
examples:
- And so home and to bed.
- He finished his work, and so left for the station.
