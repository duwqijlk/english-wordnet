simpleMeaning: A person knows what goes on in the body by the skin, by the feel of the limbs, and by the
  parts inside.
scope: Also called somaesthesia, somataesthesis, somatesthesia, somatic sense, somatic sensory system,
  somatosensory system, somesthesia, or somesthesis, it is how a person knows what goes on in the body.
examples:
- By somaesthesis, a person knew that a foot had gone numb.
- Through somaesthesis, a person feels the strain in the back.
