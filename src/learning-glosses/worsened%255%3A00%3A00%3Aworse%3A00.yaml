simpleMeaning: made or having become poorer in quality or state, and harmed or weakened in some way
scope: Made or become poorer in quality or state in any way, not only poorer in health or fitness.
examples:
- The worsened roads made travel slow and hard.
- Workers were troubled by the worsened pay and hours.
