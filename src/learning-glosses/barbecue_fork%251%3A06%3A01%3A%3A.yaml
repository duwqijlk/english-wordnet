simpleMeaning: Food cooking over an open fire is picked up and turned with this long tool, which has two
  points.
scope: This long tool with two points lifts and turns food as it cooks over an open fire.
examples:
- A barbecue fork lifted the steak off the hot grill.
- The barbecue fork turned the meat as it cooked.
