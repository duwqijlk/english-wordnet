simpleMeaning: Where a fungus, an insect, or some other upset strikes a tree or bush, small shoots sprout
  close together in a thick tangle.
scope: This growth is also called staghead, witch broom, or witches' broom.
examples:
- The old oak had a hexenbesen.
- The gardener cut the hexenbesen from the shrub.
