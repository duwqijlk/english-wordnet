schema: oewn-learning-gloss-v2
senseId: 'constipation%1:04:00::'
synsetId: 00273722-n
simpleMeaning: the act of making something useless and without good result, as when work is done in the
  same set way again and again
scope: 'Also called impairment and deadening: making something useless, not the health sense where the
  body cannot easily pass waste.'
examples:
- Years of doing every task the same set way led to constipation in the department, and its work became
  useless.
- He spoke of the constipation of the system, where set habit had made new ideas have no effect.
