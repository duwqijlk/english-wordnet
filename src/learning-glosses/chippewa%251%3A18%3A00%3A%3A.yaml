simpleMeaning: A member of an Algonquian people, a Native American group, who live from present-day Ontario
  in eastern Canada all the way into Montana, above and around Lake Superior.
scope: Also called an Ojibwa or an Ojibway; it is the people, not the Algonquian language they speak.
examples:
- The Chippewa elder told stories of the people around Lake Superior.
- Many Chippewa live in Ontario and Montana today.
