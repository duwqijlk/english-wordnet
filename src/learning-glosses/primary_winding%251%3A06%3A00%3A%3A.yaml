senseId: 'primary_winding%1:06:00::'
synsetId: 04008987-n
simpleMeaning: Power that changes as it flows through this loop of wire sets off a flow in the circuit
  next to it.
scope: Primary coil and primary are other names for it, and it is the loop whose changing power starts
  the new flow, not the loop that receives it.
examples:
- Current through the primary winding sets off current in the secondary winding.
- When the power in the primary winding changed, a current appeared in the circuit beside it.
