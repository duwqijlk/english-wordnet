senseId: 'tritely%4:02:00::'
synsetId: 00483330-r
simpleMeaning: in a dull way, using words or ideas that have been used so often they have lost their force
scope: In a stale, overused way, not in a fresh or new way.
examples:
- She spoke tritely about love, as if reading from a cheap novel.
- He tritely expressed emotions he did not really feel.
