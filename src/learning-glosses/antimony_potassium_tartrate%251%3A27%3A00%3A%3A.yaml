simpleMeaning: a poisonous salt with no colour, used to help dye stay in cloth and as a medicine
scope: A poisonous salt with no colour used in dyeing and in medicine, not table salt, and not a dye itself.
examples:
- The dyer added antimony potassium tartrate so the colour would stay in the cloth.
- Doctors once used antimony potassium tartrate as a medicine, though it is poisonous.
