simpleMeaning: All Muslims taken together as one people, seen as reaching from Mauritania to Pakistan.
scope: The whole Muslim people, also called Umma, Islam Nation, Islamic Ummah and Muslim Ummah; not one
  country or one local group of Muslims.
examples:
- The Ummah spans many countries.
- He spoke of the unity of the Ummah.
