schema: oewn-learning-gloss-v2
senseId: 'banality%1:10:00::'
synsetId: 07168754-n
simpleMeaning: a remark that says what is already clear and has been said too often
scope: 'Also called cliche, commonplace, platitude, and bromide: this is one remark that is not new, not
  the dull quality of a whole talk or book.'
examples:
- His speech was full of banalities, and the listeners soon grew bored.
- '''Hard work brings success'' is a banality that everyone has heard many times.'
