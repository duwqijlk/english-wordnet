simpleMeaning: a clear, glass-like stuff 500 times sweeter than sugar, used to sweeten food and drink
  without adding calories
scope: A sweetener with no calories, not sugar and not honey.
examples:
- She put saccharin in her tea instead of sugar.
- The saccharin in the diet drink made it taste sweet without calories.
