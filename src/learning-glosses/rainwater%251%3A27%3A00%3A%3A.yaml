simpleMeaning: Water from clouds that falls to the ground in drops, fresh water and not sea water.
scope: This is the fresh water that falls from clouds, and rain is another name for this sense; not tap
  water and not sea water.
examples:
- Rainwater dripped from the roof into the barrel.
- They saved rainwater in tanks for the dry months.
