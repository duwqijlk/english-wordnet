simpleMeaning: In chess, this happens when a player takes the other player's piece off the board
scope: In chess, this is taking the other player's piece off the board. It is not catching a person or
  animal, and not a very small part of matter taking in another part.
examples:
- His capture of the queen changed the chess game at once.
- With that capture, she took his bishop and took control of the board.
