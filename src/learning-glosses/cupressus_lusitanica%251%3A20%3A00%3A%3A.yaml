simpleMeaning: A tall, spreading evergreen tree of Mexico with drooping branches, believed to have been
  brought to Portugal from Goa.
scope: Also called cedar of Goa, Mexican cypress and Portuguese cypress; a tall Mexican evergreen with
  drooping branches, not the tall Eurasian cypress with thin grey bark.
examples:
- Cupressus lusitanica grows tall in Mexico.
- They planted Cupressus lusitanica for its drooping branches.
