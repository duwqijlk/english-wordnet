simpleMeaning: to stab or go through something with a pointed growth on an animal's head or with a tusk
  (a long pointed tooth)
scope: The verb for stabbing with a horn or tusk; not any noun sense, such as the growth itself or a thing
  that makes a loud sound.
examples:
- The bull horned the man's leg.
- The rhino horned the explorer as he ran past.
