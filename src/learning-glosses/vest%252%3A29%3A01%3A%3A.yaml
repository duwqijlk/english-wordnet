simpleMeaning: to put on the long special clothes worn for church services
scope: This is putting church clothes on yourself, not dressing someone else in them, and not the sleeveless
  piece of clothing worn under a coat.
examples:
- The priest vested in the small room before the service.
- Before the ceremony, the bishop vested in white and gold.
