senseId: 'autochthony%1:07:00::'
synsetId: 04807401-n
simpleMeaning: Being native to a place because it started or is found there by nature
scope: This is being native to a place because it started or is found there by nature; endemism and indigenousness
  are other names for it, not having moved to a place from elsewhere and not having been brought there
  by people.
examples:
- Autochthony means a plant or animal is native to the place where it is found.
- The autochthony of the species shows it started there by nature.
