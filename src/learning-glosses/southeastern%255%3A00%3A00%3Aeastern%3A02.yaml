simpleMeaning: about the part of the United States that generally includes Alabama, Georgia, Florida,
  Tennessee, South Carolina and North Carolina
scope: This names a set of states as one part of the United States, not just any place that lies in or
  faces toward the southeast.
examples:
- The southeastern region includes Florida, Georgia and Alabama.
- She travelled through the southeastern states, from Tennessee to North Carolina.
