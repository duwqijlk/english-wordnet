simpleMeaning: of or about a normal bag-like part of the body, such as the bag that holds bile or the
  bag that holds urine
scope: Of or about a normal bag-like part of the body; not of a diseased swelling and not of the kidneys.
examples:
- The cystic duct drains the gallbladder.
- Cystic tissue lines the urinary bladder.
