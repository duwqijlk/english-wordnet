simpleMeaning: To scrape skin off, or rub it sore.
scope: This sense is also called chafe, for scraping skin off, or rubbing it sore, where chafing is tearing
  skin off, rubbing it away, or making it sore by scraping over it.
examples:
- The fall excoriated his knee.
- Excoriating scrapes skin off.
