simpleMeaning: Parts of a firm whose owners are promised to be paid first out of the profits, but who
  have no say in how the firm is run
scope: These are parts of a firm whose owners are promised to be paid first out of the profits, but who
  have no say in how the firm is run; preference shares and preferred shares are other names for them,
  not ordinary parts of a firm with a vote.
examples:
- She holds preferred stock in the firm.
- Preferred stock is paid first out of the profits.
