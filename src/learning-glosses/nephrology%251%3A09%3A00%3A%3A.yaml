simpleMeaning: The branch of medicine that deals with the kidney, how it is built, grows, and works, and
  its sicknesses.
scope: The branch of medicine that deals with the kidney, not the study of the heart and not the study
  of the liver.
examples:
- She chose nephrology to study the kidney and its sicknesses.
- Nephrology covers how the kidney is built, grows, and works.
