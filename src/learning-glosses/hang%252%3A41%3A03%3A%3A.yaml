senseId: 'hang%2:41:03::'
synsetId: 02563616-v
simpleMeaning: Of a jury, to remain unable to agree, so that no verdict can be reached.
scope: This is about a jury that cannot agree and so blocks a verdict, not about killing someone by rope,
  suspending an object, or a presence that feels oppressive.
examples:
- After two days of deadlock, the jury hung, and a new trial was ordered.
- One stubborn juror hung the jury by refusing to change her mind.
