simpleMeaning: The front lobe and the back lobe of the brain are set apart by this groove, which climbs
  the outer side of each half.
scope: 'Also called central sulcus: a groove on the outer side of each half of the brain, between the
  front lobe and the back lobe.'
examples:
- The sulcus centralis runs up the side of each half of the brain.
- The sulcus centralis sets the front lobe apart from the back lobe.
