simpleMeaning: To hit, the hitter must stand in this marked space on either side of home plate.
scope: In baseball, this is the marked space beside home plate where the hitter must stand to hit.
examples:
- The batter stepped into the batter's box and waited for the pitch.
- The hitter stood in the batter's box, ready to hit.
