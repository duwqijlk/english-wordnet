simpleMeaning: An object that remains at the top of the water instead of going under.
scope: This is any object that stays on the water's surface, not the ice-cream drink, the fish's air-filled
  sac, or the decorated display in a parade.
examples:
- A red float bobbed on the water near the fishing line.
- The lifeguard threw a float to the struggling swimmer.
