simpleMeaning: A jewel that hangs on a chain worn round the neck.
scope: A jewel that hangs on a chain worn round the neck; lavaliere and lavalliere are other names for
  this sense, not a jewel set in a ring, and not a chain worn with no jewel.
examples:
- She wore a lavalier that her grandmother had given her.
- The lavalier sparkled against her dress.
