simpleMeaning: the high level of skill that a person trained for a job shows in their work
scope: This is the skill a trained worker shows in a job. It is not the job itself, and not a person who
  does the job.
examples:
- Her professionalism showed in the careful way she handled every client.
- The team praised his professionalism during the hard project.
