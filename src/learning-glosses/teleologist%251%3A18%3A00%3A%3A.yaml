simpleMeaning: a person who speaks for the idea that things have a purpose
scope: A person who speaks for the idea that things have a purpose, not a person who holds that things
  happen by chance and not a person who studies causes.
examples:
- The teleologist argued that the eye was made to see.
- As a teleologist, he saw design in all living things.
