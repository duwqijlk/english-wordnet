simpleMeaning: a device that picks up sound and is built to take in sound from one side
scope: 'Also called directional mike: a sound device built to take in sound from one side, not a device
  that picks up sound from all sides and not a loudspeaker.'
examples:
- The reporter used a directional microphone to catch the speaker's words.
- A directional microphone cuts out noise from behind.
