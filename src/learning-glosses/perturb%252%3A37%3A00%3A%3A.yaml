simpleMeaning: to trouble a person's mind and make them feel uneasy, worried, or scared
scope: 'Also called trouble, distract, disorder, disquiet, and unhinge: making a person worried or uneasy
  in mind, not moving a planet off its path and not changing the path of an electron or an atom.'
examples:
- The bad news perturbed him all evening.
- Do not let a small problem perturb you so much.
