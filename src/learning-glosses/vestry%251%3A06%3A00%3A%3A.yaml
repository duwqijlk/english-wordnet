simpleMeaning: A room in a church. Holy objects and the special clothes worn in services are kept there,
  and meetings may be held there too
scope: 'Also called sacristy: a room in a church, not the group of people chosen to help run a church.'
examples:
- The holy cups were kept in the vestry after the service.
- They held the small meeting in the vestry.
