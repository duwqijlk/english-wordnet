simpleMeaning: The back part of the gland at the base of the brain has a thin piece of flesh joined to
  it
scope: A thin piece of flesh joined to the back part of the gland at the base of the brain, not a part
  of the front of the gland and not a whole gland on its own.
examples:
- The pars intermedia has joined the back part of the pituitary gland.
- A thin slice of the pars intermedia was seen under the microscope.
