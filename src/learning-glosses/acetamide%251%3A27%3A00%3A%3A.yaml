simpleMeaning: Used to dissolve other things and to help build substances that hold carbon, this solid
  with no colour of its own comes from the acid found in vinegar.
scope: This is a colourless solid used to dissolve things and to build carbon-holding substances, also
  called ethanamide, not the acid in vinegar itself.
examples:
- Acetamide dissolved the solid so the two could mix.
- Acetamide helps build new substances that hold carbon.
