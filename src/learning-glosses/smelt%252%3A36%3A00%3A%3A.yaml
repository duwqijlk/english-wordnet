simpleMeaning: to get metal out of ore by heating it until the metal comes free
scope: To take metal from ore by heating, not the small silvery fish of the same name, and not simply
  melting something down.
examples:
- The workers smelted the iron ore in a hot furnace.
- The old works smelted tin from ore brought down from the hills.
