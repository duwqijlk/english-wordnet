simpleMeaning: In criminal law, a claim in court that a person is not guilty because their mind was not
  sound at the time
scope: In criminal law, a claim in court that a person is not guilty because their mind was not sound
  at the time; a plea of insanity is another name for this sense, not a claim of innocence for another
  reason and not a request for mercy.
examples:
- His lawyer entered an insanity plea at the trial.
- The insanity plea rested on her state of mind that night.
