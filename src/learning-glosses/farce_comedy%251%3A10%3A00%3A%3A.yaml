scope: This is a funny play with unlikely events; farce and travesty are other names for this sense; not
  a serious play and not a gentle joke.
examples:
- The farce comedy had the audience laughing at its wild mix-ups.
- They staged a farce comedy full of slamming doors and mistaken identities.
