simpleMeaning: all the feelings that come from a strong need in the body, and the wish to meet that need
  in the way linked to making new life
scope: 'Also called sex: all the feelings that come from a strong bodily need; not love, and not the act
  itself.'
examples:
- He felt a strong sexual urge he could not ignore.
- The sexual urge drove her to seek a partner.
