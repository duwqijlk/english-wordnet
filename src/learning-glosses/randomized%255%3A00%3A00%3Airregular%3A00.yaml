senseId: randomized%5:00:00:irregular:00
synsetId: 01968492-s
simpleMeaning: arranged or given out by chance on purpose, so no person chooses the order or who gets
  what
scope: This describes a thing set up by chance on purpose; it is not a thing that just happens by chance,
  and not a thing set in a planned order.
examples:
- The names were placed in a randomized order for the test.
- Each player got a randomized set of cards.
