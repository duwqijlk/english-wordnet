simpleMeaning: a part that curves, such as a part of a road, a river, or a railroad track
scope: 'Also called curve: a curved part of a road, river, or track, not the act of making something curve
  and not a shape made by folding something.'
examples:
- The car slowed at the bend in the road.
- There is a sharp bend in the river near the village.
