simpleMeaning: made up of particles that are very fine or very small.
scope: 'This is about how fine the particles are, not about overall size or amount: ''a small rain'' means
  rain of tiny droplets, not a light shower. It is archaic and survives mainly in older writing and poetry,
  and modern English normally says ''fine''. It is not the everyday sense ''little in size''.'
examples:
- A small rain fell all morning, so fine that it was more mist than drops.
- The stove was fed with small coal, which caught quickly and burned hot.
