simpleMeaning: A kind of Christian belief that is strongly Protestant and keeps the Sabbath at the end
  of the week.
scope: A kind of Christian belief, strongly Protestant, that keeps the Sabbath at the end of the week,
  not a form of Adventism that keeps Sunday and not a Catholic belief.
examples:
- Seventh-Day Adventism keeps the Sabbath at the end of the week.
- She rests on the Sabbath as a member of Seventh-Day Adventism.
