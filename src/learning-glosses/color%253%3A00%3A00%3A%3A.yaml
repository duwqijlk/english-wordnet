simpleMeaning: capable of showing or producing hues
scope: This describes something that can show or produce hues, not the noun for the visual attribute,
  a pigment, or musical timbre, and not the verbs meaning to add color or distort something.
examples:
- This is a color photograph, not a black-and-white one.
- The printer produces color pages as well as monochrome ones.
