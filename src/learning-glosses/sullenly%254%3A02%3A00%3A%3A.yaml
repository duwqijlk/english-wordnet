simpleMeaning: in a dark, cross way, showing that you are in a bad mood and will not talk or smile
scope: In a gloomy, cross way that shows a bad mood, not in a cheerful or open way.
examples:
- He sat in his chair sullenly, saying nothing.
- She sullenly stared out of the window all afternoon.
