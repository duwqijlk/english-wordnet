simpleMeaning: This round record is one you can write on only once, and after that you can only read what
  is on it
scope: This is a round record you can write on only once, also called CD-WO, compact disc recordable and
  compact disc write-once; not a record you can write on again and again.
examples:
- I burned the photos onto a CD-R.
- This CD-R holds only one recording session.
