simpleMeaning: The American spy agency guarding past and present presidents, vice presidents, and their
  families, and important guests from abroad; it catches counterfeiters and stops faking of government
  papers and bonds.
scope: Not the FBI or the CIA, other American spy agencies; also called SS, the Secret Service, the US
  Secret Service, and USSS.
examples:
- The United States Secret Service guards the president.
- A United States Secret Service agent stood by the door.
