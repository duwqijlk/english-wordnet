simpleMeaning: a common European plant grown for a long time, from which most of the common garden flowers
  of its kind come
scope: 'Also called heartsease and love-in-idleness: the old European plant from which most garden pansies
  come, not a weed and not a flower of another kind.'
examples:
- The wild pansy grew along the edge of the field.
- Gardeners have grown the wild pansy for hundreds of years.
