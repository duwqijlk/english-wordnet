simpleMeaning: Through a weak spot in the belly wall near the belly button, part of the gut and its fatty
  cover push out, most often closing on its own after birth.
scope: Also called umbilical hernia, this bulge near a baby's belly button most often closes on its own
  after birth.
examples:
- The baby was born with an omphalocele near the navel.
- The omphalocele closed on its own after birth.
