senseId: 'foreshorten%2:30:00::'
synsetId: 00244786-v
simpleMeaning: To cut down the range of a thing, keeping only what it cannot do without.
scope: 'Also called cut, reduce, contract, shorten, abbreviate or abridge: to narrow the range of a thing
  while keeping its essential parts, not to shorten lines in a drawing to show depth.'
examples:
- The editor foreshortened the long report to two pages.
- They foreshortened the course, keeping only its core lessons.
