simpleMeaning: the best, most needed and most important part of an idea or of something a person lives
  through
scope: 'Also called heart, center, core, centre, meat, substance, essence and marrow: the most important
  part of an idea or experience, not a total amount of money or of numbers added up.'
examples:
- The sum of his argument was that the town needs a new school.
- She gave us the sum of her years of travel in one short talk.
