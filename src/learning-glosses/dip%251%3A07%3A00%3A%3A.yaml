simpleMeaning: a sudden sharp fall in an amount or number
scope: 'Also called drop, and another name for fall: a sudden sharp fall in an amount; not a candle, not
  a sauce for food, and not a thief who steals from pockets.'
examples:
- There was a dip in prices last month.
- A dip in temperature made the night feel cold.
