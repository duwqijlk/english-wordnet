simpleMeaning: A showy meadow wildflower with large upright bell-shaped flowers in a blue shade, growing
  in damp ground from eastern Colorado and Nebraska south to New Mexico and Texas.
scope: The tall meadow wildflower also called bluebell or tulip gentian, not the woodland bluebell with
  slender stems.
examples:
- Prairie gentians stood in the damp field beside the road.
- The prairie gentian opens its large blue bells in late summer.
