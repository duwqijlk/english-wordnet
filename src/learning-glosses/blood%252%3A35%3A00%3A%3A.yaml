simpleMeaning: to smear a person's face with the red liquid from a killed animal, as an old hunting ceremony.
scope: This is a ceremonial marking with an animal's red liquid, not the liquid itself and not injuring
  someone.
examples:
- The older hunters blooded the young man after his first kill.
- In the old ceremony, the boy's face was blooded before the feast.
