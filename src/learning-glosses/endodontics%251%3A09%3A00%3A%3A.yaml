simpleMeaning: The branch of tooth care that deals with illness of the soft inner part of a tooth
scope: This is the branch of tooth care that deals with illness of the soft inner part of a tooth; endodontia
  is another name for it, not tooth care in general and not the care of gums.
examples:
- He studied endodontics to treat illness of the tooth pulp.
- Endodontics deals with the soft inner part of a tooth.
