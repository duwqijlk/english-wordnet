simpleMeaning: In sports, the action of trying to hit a ball using a club, racket, bat, cue, or the hand.
scope: This is the act of striking a ball in a sport, not the firing of a gun, a photograph, an injection,
  a small drink, or an aggressive remark.
examples:
- His first shot from the tee landed in the rough.
- She spent the afternoon practising shots on the tennis court.
