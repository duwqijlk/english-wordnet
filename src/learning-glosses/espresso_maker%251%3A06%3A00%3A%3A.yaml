simpleMeaning: This machine makes coffee by pushing hot steam under pressure through dark roasted coffee
  grounds
scope: A machine for making coffee with hot steam under pressure, not a pot for plain boiled coffee and
  not a kettle for hot water.
examples:
- The espresso maker forced hot steam through the dark grounds and filled the cup with strong coffee.
- The espresso maker hissed as hot steam pushed through the dark grounds.
