senseId: cloudy%5:00:00:opaque:00
synsetId: 00435243-s
simpleMeaning: A liquid you cannot see through clearly, because small bits have sunk and settled in it
scope: 'Also called muddy and murky: a drink or other liquid made unclear by bits that have settled in
  it, not a sky full of clouds and not a shape with no clear form.'
examples:
- The water in the jug was cloudy after the rain stirred up the mud.
- The coffee was cloudy, with dark bits settled at the bottom of the cup.
