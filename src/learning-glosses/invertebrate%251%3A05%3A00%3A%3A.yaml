simpleMeaning: any animal with no backbone or notochord (a stiff cord along the back before birth); people
  do not use this word as a science group name
scope: A noun for an animal with no backbone; not the adjective that describes such an animal, and not
  a science group name.
examples:
- A worm is an invertebrate because it has no backbone.
- She found several invertebrates, including a snail and an insect, in the garden pond.
