simpleMeaning: In computer science, the word given to a computer record to tell it apart from other records;
  it may end with a short part that shows its kind.
scope: In computer science, the word given to a computer record to tell it apart from other records; also
  called filename, computer file name and computer filename, not the words inside the record.
examples:
- Save the letter under a file name you will remember.
- Each file name on the disk is different from the others.
