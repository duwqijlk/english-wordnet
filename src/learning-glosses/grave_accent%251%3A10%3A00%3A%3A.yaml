simpleMeaning: 'It shows how to say a vowel: a small sign put over the letter'
scope: A small sign over a vowel that shows how to say it, also called grave, not a mark over a consonant
  and not a sign of stress.
examples:
- The grave accent over the e tells you how to say it.
- In French, a grave accent can change how a vowel sounds.
