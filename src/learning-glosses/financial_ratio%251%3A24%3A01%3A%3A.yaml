simpleMeaning: A number that shows how big one chosen money figure from a firm's books is beside another.
scope: A number that shows how big one chosen money figure from a firm's books is beside another; also
  called accounting ratio, not a single money figure and not a firm's whole set of books.
examples:
- The financial ratio showed the firm's debt beside its income.
- A financial ratio can be given as a decimal, such as 0.10.
