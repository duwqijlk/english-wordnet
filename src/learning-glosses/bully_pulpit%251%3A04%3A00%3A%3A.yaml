simpleMeaning: a high public job that gives the person who holds it a chance to speak on any matter and
  be heard
scope: A high public job that lets its holder speak and be heard on any matter, not a low public job and
  not a private stage for one person's views.
examples:
- The presidency is a bully pulpit for speaking to the whole country.
- From that bully pulpit, she spoke out on matters that touched many lives.
