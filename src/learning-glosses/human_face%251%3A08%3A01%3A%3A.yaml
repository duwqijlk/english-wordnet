simpleMeaning: The front of a person's head, from the forehead to the chin and from ear to ear.
scope: 'Another name for this is face: the front of a person''s head, not the back of the head and not
  an animal''s muzzle.'
examples:
- The human face in the photo smiled at the camera.
- His human face showed every sign of joy.
