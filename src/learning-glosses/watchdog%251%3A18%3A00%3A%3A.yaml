simpleMeaning: a person or group that guards against stealing, acts that break the law, and the waste
  of money or things
scope: This is a person or group that guards against wrong acts and waste, not a dog kept to guard a building.
examples:
- The newspaper acts as a watchdog over the city government and reports waste of public money.
- She is a well-known watchdog for human rights and speaks out against abuse.
