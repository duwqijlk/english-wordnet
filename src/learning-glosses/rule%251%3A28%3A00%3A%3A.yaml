simpleMeaning: The period during which a king, queen, or governing body holds authority.
scope: This is the length of time a ruler or government is in power, not the abstract right to command,
  not a guideline or standard example, not an accepted principle, not a rule of a game, religion, language,
  science, or mathematics, not a measuring stick, and not the verb senses of exercising authority, deciding,
  predominating, declaring, matching zodiac signs, drawing with a ruler, restraining, or excelling.
examples:
- Trade with distant lands expanded quickly under the rule of Elizabeth.
- The country changed greatly over the long rule of its last king.
