simpleMeaning: Some people hold that God and everything that exists are one and the same thing, and that
  the world around us shows God.
scope: The belief that God and the whole world are one thing, not the belief in a God who stands apart
  from the world and not the belief in many gods.
examples:
- Pantheism holds that God is present in every part of nature.
- She turned to pantheism after years of seeking God in the world around her.
