senseId: 'gasp%1:04:00::'
synsetId: 00838759-n
simpleMeaning: the short, strained breath someone draws in through an open mouth
scope: A single short, strained breath taken through an open mouth, also called a pant; not the verb for
  breathing noisily when exhausted, and not a long sigh or ordinary breathing.
examples:
- She gave a gasp when the cold water hit her.
- A gasp ran through the crowd as the acrobat slipped.
