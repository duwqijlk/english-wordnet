simpleMeaning: At the start of each set stretch of time, a near-equal sum is paid out, one after another.
scope: Here, near-equal sums are paid at the start of each set stretch of time, not at the end.
examples:
- The rent, paid at the start of each month, counts as an annuity in advance for the landlord.
- The club paid the coach through an annuity in advance, with each sum due at the start of the season.
