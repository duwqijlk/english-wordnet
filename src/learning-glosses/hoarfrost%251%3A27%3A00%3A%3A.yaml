simpleMeaning: small pieces of ice that form a white layer, especially on things outside
scope: 'Also called frost, hoar and rime: a white layer of ice, especially outside, not falling snow and
  not thick ice on a road.'
examples:
- In the morning, hoarfrost covered the grass and the fence.
- The trees were white with hoarfrost after the cold night.
