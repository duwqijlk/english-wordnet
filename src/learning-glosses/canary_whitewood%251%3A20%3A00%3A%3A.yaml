simpleMeaning: A tall North American tree that sheds its leaves, with big greenish-yellow cup-shaped flowers
  and cone-like fruit; its soft white wood is mainly used for making cabinets.
scope: This is the tall flowering tree, another name for the tulip tree; it is not the pale timber or
  the wood cut from it.
examples:
- The canary whitewood at the corner of the park is the tallest tree around.
- Canary whitewoods lose their leaves in autumn and grow new ones in spring.
