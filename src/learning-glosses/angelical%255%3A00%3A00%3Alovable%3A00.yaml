simpleMeaning: Sweet-natured and gentle, as an angel or a cherub would be.
scope: Sweet-natured and gentle, as an angel or a cherub would be — also called sweet, and other names
  for it are angelic, cherubic, and seraphic; not the sense of being wholly good like a saint, and not
  the sense of having to do with angels.
examples:
- Their smile was angelical.
- The child looked angelical asleep in bed.
