simpleMeaning: greedy for money in a low, selfish way, and ready to do things only for money
scope: This describes a person who wants money in a low, selfish way, not a dirty, poor place and not
  a shameful act.
examples:
- His sordid greed for money made him cheat his own friends.
- The boss had sordid money interests and paid the workers almost nothing.
