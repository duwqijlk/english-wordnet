simpleMeaning: a device that puts metal pins in place to hold parts together
scope: A device that puts metal pins in place to hold parts together; riveting machine and riveter are
  other names for this sense, not a worker who puts pins in by hand and not a device for taking pins out.
examples:
- The rivetter hummed as it drove pin after pin into the hull.
- They switched the rivetter on and it drove the last pin into the beam.
