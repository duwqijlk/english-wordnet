simpleMeaning: that hurts or damages someone so badly that they cannot move, work, or live as before
scope: 'Also called disabling and incapacitating: hurting someone so badly they cannot do things as before,
  not just making them a little weak or tired.'
examples:
- A crippling injury left him unable to walk.
- The crippling illness kept her in bed for months.
