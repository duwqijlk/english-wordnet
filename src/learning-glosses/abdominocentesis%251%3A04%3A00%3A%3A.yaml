simpleMeaning: a test in which a needle is put through the belly wall to take out fluid for testing
scope: A test in which fluid is taken from the belly with a needle to find out what is wrong, also called
  paracentesis; not a cut to remove a growth and not a test of the blood.
examples:
- The doctor ordered an abdominocentesis to test the fluid in her belly.
- Abdominocentesis helped the doctors find the cause of the swelling.
