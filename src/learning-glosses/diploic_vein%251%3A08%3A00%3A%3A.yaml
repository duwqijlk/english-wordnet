simpleMeaning: One of the blood tubes that serve the soft, spongy part of the bones of the skull.
scope: A blood tube serving the spongy part of the skull bones, not a blood tube in the brain and not
  a blood tube in the face.
examples:
- A diploic vein runs through the spongy bone of the skull.
- The diploic vein carries blood from the skull bone.
