simpleMeaning: The place of a crank when it lines up with the rod that joins it and puts no turning force
  on it.
scope: The place of a crank in line with its joining rod, putting no turning force on it; dead center
  is another name for it, not a fault in the crank and not a stop.
examples:
- The dead centre is where the crank stops pushing.
- At dead centre the crank puts no turning force on the rod.
