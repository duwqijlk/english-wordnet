simpleMeaning: A poisonous mushroom whose top is smooth at first, then grows wavy and wrinkled but never
  truly pitted; its colour runs from dull yellow to brown.
scope: 'Also called beefsteak morel and brain mushroom: a poisonous mushroom with a wavy, wrinkled top
  that is never truly pitted, coloured dull yellow to brown; true morels have truly pitted tops.'
examples:
- Gyromitra esculenta is poisonous, so do not pick it for the table.
- The wrinkled top of Gyromitra esculenta turns from dull yellow to brown.
