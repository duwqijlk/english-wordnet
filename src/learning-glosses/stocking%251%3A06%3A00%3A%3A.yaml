simpleMeaning: a piece of clothing that fits close and covers the foot and leg; they come in pairs that
  match, usually used in the plural
scope: Clothing for the foot and leg that fits close, in pairs that match and usually used in the plural;
  not the act of supplying a stock of something.
examples:
- She wore black stockings with her dress.
- He pulled on a pair of warm stockings before going out.
