simpleMeaning: A cactus usually without branches and usually without spines, with warty bumps, magenta
  flowers and white or green fruit; it resembles mescal and grows in northeastern Mexico and southwestern
  US.
scope: The flowering cactus of northeastern Mexico and the southwestern US, not the South African stemless
  succulent that shares this name.
examples:
- The living rock blooms with magenta flowers in spring.
- Living rock grows in the dry hills of northeastern Mexico.
