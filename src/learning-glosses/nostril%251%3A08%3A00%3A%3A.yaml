simpleMeaning: One of the two holes at the front of the nose, where air goes in and out
scope: One of the two holes in the nose, not the nose as a whole and not the hollow space inside it.
examples:
- She pinched one nostril shut and breathed through the other.
- Dust made his nostrils itch.
