simpleMeaning: a tall narrow tree of eastern North America with flat side branches and small leaves that
  come out late in spring and turn bright in early autumn
scope: 'Also called black gum and sour gum: a tall narrow tree with flat side branches and small late
  leaves that turn bright in autumn, not a broad spreading tree and not a shrub.'
examples:
- The pepperidge turned scarlet in October.
- A pepperidge stood at the edge of the wood.
