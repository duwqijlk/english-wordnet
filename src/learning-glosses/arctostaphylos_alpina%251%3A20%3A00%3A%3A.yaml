senseId: 'arctostaphylos_alpina%1:20:00::'
synsetId: 12252226-n
simpleMeaning: A low spreading shrub that loses its leaves each year, turns bright red in autumn, and
  bears black or blue-black berries, of high cold lands around the north
scope: This is a low shrub with black berries that turns red in autumn, not a shrub with red berries;
  alpine bearberry and black bearberry are other names for this sense.
examples:
- Arctostaphylos alpina creeps over the rocks in the far north.
- In autumn Arctostaphylos alpina turns bright red.
