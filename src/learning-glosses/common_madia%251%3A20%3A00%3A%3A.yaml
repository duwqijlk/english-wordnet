simpleMeaning: a one-year plant from California whose yellow flowers have red-brown spots near the base
  of their long thin petals
scope: This is a one-year California plant with yellow flowers marked with red-brown spots; common tarweed
  is another name for this sense, and it is not a garden flower grown for show.
examples:
- Common madia grows along the dry hills of California.
- The common madia in the field had yellow flowers with red-brown spots at their bases.
