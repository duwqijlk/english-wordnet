simpleMeaning: a link between two people or things where each one needs the other, or acts on the other,
  or changes the other
scope: A two-way link where each side needs or acts on the other, not a link that goes only one way.
examples:
- 'There is reciprocity between bees and flowers: each helps the other live.'
- The reciprocity between the two towns means each one depends on the other.
