simpleMeaning: may be changed by luck, may go wrong by accident, and may not stay the same
scope: This sense is about luck and change making a result unsure, not mainly about danger and risk.
examples:
- The plan is chancy because the weather keeps changing from day to day.
- It was a chancy time to sell, as prices rose and fell each week.
