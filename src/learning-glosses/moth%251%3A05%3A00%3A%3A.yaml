simpleMeaning: Typically an insect active at dusk or in the night, with a thick body and antennae that
  are feathery or like fine hair.
scope: A moth is a thick-bodied insect with feathery or hair-like antennae that is active at dusk or at
  night, unlike a butterfly, which flies by day and has slim, club-tipped feelers, and not a caterpillar,
  which is its young stage.
examples:
- A pale moth rested on the window, its thick body and feathery antennae easy to see.
- Moths came to the garden at dusk and settled on the warm stones.
