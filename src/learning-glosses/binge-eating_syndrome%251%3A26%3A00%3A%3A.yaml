simpleMeaning: A sickness of food habits seen in young women who take in far too much food at one time
  and then feel shame, low spirits and blame of themselves.
scope: A sickness of food habits seen in young women who take in far too much food at one time and then
  feel shame, also called bulimia; not hunger and not a sickness of the stomach.
examples:
- Her binge-eating syndrome began when she was sixteen.
- The doctor treated a girl with binge-eating syndrome.
