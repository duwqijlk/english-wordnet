simpleMeaning: A seat with a soft pad that Indian princes use in place of a throne
scope: A seat with a soft pad used by Indian princes in place of a throne, not an ordinary chair and not
  a seat for a king of another land.
examples:
- The musnud stood at the far end of the hall, covered in silk.
- The prince took his place on the musnud before his court.
