simpleMeaning: needing a thing that forms habits, above all drink or drugs, and being able to take more
  and more of it
scope: Needing a thing that forms habits, above all drink or drugs, and being able to take more and more
  of it; addiction is another name for this sense, not a normal need for a thing and not simply liking
  it.
examples:
- His dependence on drink cost him his job.
- The doctor warned her about dependence on the sleeping pills.
