simpleMeaning: a strong focus on meeting the needs and strong wants of the body
scope: 'Also called animalism: a strong focus on the needs and wants of the body, not bodily strength,
  exercise, or how fit a person is.'
examples:
- The story is full of physicality, with its focus on hunger, sex, and other body wants.
- His writing shows a physicality that keeps coming back to eating and desire.
