simpleMeaning: An antibody drawn to cell kinds, in addition to and apart from its pull to the waking germ-spot,
  through the make of the Fc bit of the weighty chain.
scope: This sense is also called cytotropic antibody and anaphylactic antibody, for an antibody drawn
  to cell kinds, in addition to and apart from its pull to the waking germ-spot, through the make of the
  Fc bit of the weighty chain.
examples:
- The cytophilic antibody drew to the cells.
- The cytophilic antibody bound the cells.
