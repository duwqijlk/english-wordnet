simpleMeaning: a loud burst of protest or complaint
scope: A loud public protest or complaint, not meaningless information, unwanted sound, or electrical
  interference.
examples:
- The plan to close the library caused a lot of noise in the town.
- The staff made a lot of noise about the sudden change in policy.
