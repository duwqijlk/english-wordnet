simpleMeaning: the fact that something is about to happen very soon
scope: This names the fact that something is about to happen very soon, not the event itself and not a
  far-off chance.
examples:
- The imminence of the storm made everyone leave the beach.
- They worked fast because of the imminence of the deadline.
