simpleMeaning: to change over a long time so that a living thing becomes a new kind, or fits its surroundings
  better
scope: In biology, a living thing changing over time to become a new kind or fit its surroundings better,
  not a person choosing one kind of work and not making something fit one use.
examples:
- Over many ages, the birds specialized to live only on these islands.
- The fish specialized over time to fit the cold, dark water.
