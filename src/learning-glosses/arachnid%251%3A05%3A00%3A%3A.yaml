senseId: 'arachnid%1:05:00::'
synsetId: 01771988-n
simpleMeaning: A creature with jointed legs and a hard outer skin, that breathes air and has simple eyes
  and four pairs of legs.
scope: For a spider or similar creature with four pairs of legs.
examples:
- A spider is an arachnid, with four pairs of legs.
- The arachnid sat still, its four pairs of legs folded under it.
