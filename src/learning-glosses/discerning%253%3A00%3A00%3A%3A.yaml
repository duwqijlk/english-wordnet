senseId: 'discerning%3:00:00::'
synsetId: 00774932-a
simpleMeaning: having or showing a deep understanding of things and good sense in judging them
scope: This means having deep understanding and good judgment, not just noticing very small differences
  and not just being kind and careful with other people's feelings.
examples:
- A discerning reader can see why the writer chose those words.
- She is a discerning judge of art and picks only the best work.
