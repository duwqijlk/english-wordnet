simpleMeaning: Only ever found mixed in water or as salts, this made-up acid, H2Cr2O7, is the one the
  chromium salts come from
scope: A made-up acid known only in water or as salts, not a real acid found on its own.
examples:
- Dichromic acid is only known in solution, never on its own.
- The book said dichromic acid gives rise to dichromate salts.
