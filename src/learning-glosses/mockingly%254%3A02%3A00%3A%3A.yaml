simpleMeaning: in a way that laughs at someone and shows you think they are not worth respect
scope: 'Also called derisively: speaking or acting in a way that laughs at someone with no respect. This
  is not the louder, shouting sense of mockingly.'
examples:
- ‘You call that singing?’ he said mockingly.
- She smiled mockingly when he said he could run faster than anyone.
