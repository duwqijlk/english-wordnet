simpleMeaning: a man from a town who knows little of country life, often a smooth and showy man from a
  city
scope: A man from a town who knows little of country life, often a smooth and showy man from a city. Not
  a farmer and not a man who lives in the country.
examples:
- The townee had never milked a cow.
- As a townee, he was lost on the country lanes.
