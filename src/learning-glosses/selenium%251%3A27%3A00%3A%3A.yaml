simpleMeaning: A poisonous nonmetal, kin to sulfur and tellurium, in several forms; one form carries current
  better in light than dark, for light cells, found in ores such as pyrite.
scope: Not sulfur or tellurium, nor other poisonous nonmetals; also called Se and atomic number 34.
examples:
- Selenium is used in light cells.
- Selenium in a light cell carries more current in bright light.
