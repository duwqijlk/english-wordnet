simpleMeaning: Mammals whose young grow inside the mother, fed through the afterbirth; all mammals but
  the egg-laying ones and the pouched ones.
scope: Also called a eutherian, a eutherian mammal, or a placental mammal, mammals whose young grow inside
  the mother, fed through the afterbirth, not the adjective use for what has to do with the afterbirth.
examples:
- Dogs and cats are placentals, unlike kangaroos.
- The placental gives birth to live young.
