senseId: 'lobotomy%1:04:00::'
synsetId: 00685381-n
simpleMeaning: An operation that cuts the nerve paths to and from the front part of the brain, often changing
  how a person thinks and acts in a marked way.
scope: Also called a frontal lobotomy, a leucotomy, a leukotomy, a prefrontal leucotomy, a prefrontal
  leukotomy, or a prefrontal lobotomy; an operation cutting nerve paths to the front of the brain, not
  a treatment for a broken bone.
examples:
- The lobotomy changed his manner in marked ways.
- Doctors no longer perform a lobotomy as they once did.
