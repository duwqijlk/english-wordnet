simpleMeaning: The thin, thread-like leaves of a herb plant, with a strong smell, used to flavour food.
scope: The scented, thread-like leaves of the herb plant, also called dill; not the seeds of the plant
  and not parsley.
examples:
- She sprinkled dill weed over the potatoes.
- Dill weed gives the sauce its fresh smell.
