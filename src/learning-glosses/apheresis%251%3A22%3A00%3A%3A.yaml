simpleMeaning: In language study, the loss of a sound or sounds from the start of a word, as when 'till'
  stands for 'until' or 'coon' for 'raccoon'
scope: 'Also called aphaeresis: the loss of a sound or sounds from the start of a word, not a loss at
  the end and not the blood treatment of the same name.'
examples:
- Apheresis made 'raccoon' into 'coon' by cutting off the first sound.
- '''Till'' is a case of apheresis, short for ''until''.'
