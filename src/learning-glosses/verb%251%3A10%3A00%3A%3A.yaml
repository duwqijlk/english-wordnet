simpleMeaning: a word with a full sense of its own that says what a person or thing does, what takes place,
  or how a person or thing is
scope: A word with a full sense of its own that says what a person or thing does, what takes place, or
  how a person or thing is, not the whole word class that does the main job in a sentence.
examples:
- In the sentence 'She runs fast', 'runs' is the verb.
- '''Is'' is the verb in ''He is tall'', as it says how he is.'
