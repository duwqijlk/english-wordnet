simpleMeaning: a square board with a handle under it, used by a builder to hold or carry mortar (a wet
  mix used to join bricks)
scope: This is a builder's board for carrying mortar, not a bird that hunts other animals and not the
  act of clearing your throat.
examples:
- The builder put the mortar on his hawk.
- He held the hawk in one hand and worked with the other.
