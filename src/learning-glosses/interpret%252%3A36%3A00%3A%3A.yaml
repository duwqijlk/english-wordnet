simpleMeaning: to perform a work, such as a piece of music or a part in a play, in your own way, as you
  understand it
scope: To perform a work, such as music or a part in a play, in your own way; not to explain what words,
  signs, or actions mean.
examples:
- The singer interpreted the old song in a slow, sad way.
- She interpreted the part of the queen with great feeling.
