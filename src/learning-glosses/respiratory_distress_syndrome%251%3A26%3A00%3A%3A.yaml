simpleMeaning: Acute lung illness of newborns, mainly premature babies, where lungs cannot expand without
  a slippery coating, causing fast shallow breathing, blue skin and a glassy film in the air sacs.
scope: This is the lung problem of babies born too early, also known by the longer name 'respiratory distress
  syndrome of the newborn'; it is not the adult lung injury caused by breathing chemical fumes.
examples:
- The premature baby was treated for respiratory distress syndrome in the neonatal unit.
- Respiratory distress syndrome can appear within hours of birth, so the nurses watched his breathing
  closely.
