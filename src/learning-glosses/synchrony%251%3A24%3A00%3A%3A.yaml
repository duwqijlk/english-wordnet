simpleMeaning: the fact that things happen at the same time
scope: 'Also called synchronization, synchronicity, synchronisation, and synchronizing: this is about
  things happening at the same time, not about making things happen at the same time.'
examples:
- The synchrony of their steps made the dancers look like one person.
- The drug increased the synchrony of the brain waves.
