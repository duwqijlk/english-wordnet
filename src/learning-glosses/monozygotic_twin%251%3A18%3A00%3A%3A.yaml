scope: 'Also called an identical twin or a monozygous twin: one of two babies from one egg, not two babies
  from two eggs and not babies who merely look alike.'
examples:
- Each monozygotic twin shared the same genes as her sister.
- He is a monozygotic twin, born with his brother from one egg.
