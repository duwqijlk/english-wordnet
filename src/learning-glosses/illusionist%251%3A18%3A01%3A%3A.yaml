simpleMeaning: a person who does tricks that look like magic to make the people who watch happy
scope: 'Also called magician and conjurer: a person who does tricks that look like magic for people who
  watch to enjoy, not someone with real magic powers.'
examples:
- The illusionist made a coin seem to disappear in front of the crowd.
- Everyone clapped when the illusionist pulled a rabbit from an empty hat.
