simpleMeaning: a material that cuts down or stops heat, sound or electric power passing through it
scope: A material that cuts down or stops heat, sound or electric power passing through it, also called
  insulation; not a material that lets heat or power pass and not a mere cover.
examples:
- Foam is a good insulant for the walls of a cold house.
- The builders put an insulant around the hot pipes.
