simpleMeaning: A pain-killing drug, sold as Pyridium, used for infections of the tubes that carry urine
  out of the body.
scope: A pain-killing drug, sold as Pyridium, used for infections of the tubes that carry urine out of
  the body; not an antibiotic and not a drug for coughs.
examples:
- The doctor gave her phenazopyridine for the burning pain.
- Phenazopyridine eased his urinary infection.
