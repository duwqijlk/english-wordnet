simpleMeaning: To keep safe and show off fine things, to cover lab tools, or to hold gases, people use
  a domed see-through cover.
scope: This is a domed see-through cover used to keep safe and show off fine things, to cover lab tools,
  or to hold gases; bell jar is another name for this sense.
examples:
- She put a bell glass over the wax flowers to keep them safe.
- The bell glass kept the gas inside.
