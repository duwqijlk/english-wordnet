simpleMeaning: a person whose way of acting does not follow what people accept, especially in sex
scope: This is a person, also called pervert, deviate, deviant and perv. It is not the describing sense
  of the same word, for a person or way of living that is not held back by what people usually do or by
  ideas of right and wrong.
examples:
- The old degenerate was known in the town for his bad acts with young people.
- People called him a degenerate because of the way he acted around sex.
