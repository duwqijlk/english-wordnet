simpleMeaning: The hollow sound a doctor hears when listening to the chest, like the sound of blowing
  across the mouth of a bottle.
scope: The hollow sound a doctor hears when listening to the chest, like the sound of blowing across the
  mouth of a bottle, not a crackling sound in the chest and not a normal breath sound.
examples:
- The doctor heard amphoric breathing in the patient's chest.
- Amphoric sounds can point to a hole in the lung.
