simpleMeaning: A white-flowered plant of the Balkan area with feather-like leaves that are white and silky-haired
  underneath; it gives a bug killer and is sometimes put in the Chrysanthemum genus
scope: This is a white-flowered Balkan plant whose leaves are white and silky-haired underneath; pyrethrum,
  Chrysanthemum cinerariifolium, Dalmatian pyrethrum and Tanacetum cinerariifolium are other names for
  this sense, and it stands apart from other white-flowered plants by giving a bug killer.
examples:
- Dalmatia pyrethrum grows in the Balkan area.
- Farmers use Dalmatia pyrethrum to kill bugs.
