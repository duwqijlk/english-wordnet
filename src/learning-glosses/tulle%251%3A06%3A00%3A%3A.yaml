simpleMeaning: a thin, fine net, often made stiff, used for veils, short dance skirts or long dresses
scope: A thin net cloth used for veils, short dance skirts and long dresses, not a thick net and not a
  hard covering.
examples:
- Her veil was made of soft white tulle.
- The dancer's skirt was made from layers of pink tulle.
