simpleMeaning: Flesh of an animal that looks dark before it is cooked, such as beef, deer flesh, lamb
  or mutton.
scope: Flesh that is dark before cooking, such as beef or lamb; not the pale flesh of chicken or fish.
examples:
- Red meat should be cooked through before you eat it.
- He ordered red meat with potatoes for dinner.
