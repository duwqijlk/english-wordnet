simpleMeaning: An agency in the health and human services department that uses science to seek knowledge
  and improve human health, and is the main medical research agency of the federal government
scope: Also called the National Institutes of Health; the main medical research agency of the United States
  government, whose nearest rivals are the National Academy of Sciences and other federal research bodies.
examples:
- The NIH gave money for a study of heart disease.
- A scientist at the NIH studies how the body fights infection.
