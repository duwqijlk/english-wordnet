simpleMeaning: one of several kinds of fish, of the drum family, found in the coastal waters of North
  America
scope: One of several kinds of fish found in the coastal waters of North America; not the silvery brown
  fish that swims into fresh water to lay eggs, and not the flesh of the fish.
examples:
- A sea trout swam through the shallow water near the shore.
- The fishermen pulled a sea trout from the coastal waters.
