senseId: 'deadening%1:04:00::'
synsetId: 00273722-n
simpleMeaning: Making a thing useless, so it comes to nothing, as when it is done the same way again and
  again.
scope: 'Also called an impairment or a constipation: making a thing useless, so it comes to nothing.'
examples:
- The deadening of his hopes came from years of dull routine.
- Endless routine brought a deadening of her interest in the work.
