simpleMeaning: A drive that began in Austria-Hungary about 1908 and did not last long, reaching the Slav
  states close by in the Balkans and Russia too.
scope: One of the short-lived drives of the early 1900s that began in Austria-Hungary and reached the
  Slav states of the Balkans and Russia.
examples:
- The drive that became Neo-Slavism began in Austria-Hungary about 1908.
- Neo-Slavism reached the Slav states of the Balkans and Russia, but it did not last long.
