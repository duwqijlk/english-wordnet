senseId: 'kleptomania%1:16:00::'
synsetId: 09205170-n
simpleMeaning: A strong urge to steal that cannot be held back, even when there is nothing to gain from
  stealing.
scope: A strong urge to steal that cannot be held back, not ordinary theft for gain and not taking things
  because of need.
examples:
- His kleptomania led him to take things he did not need.
- Kleptomania made her steal small items even though she had money.
