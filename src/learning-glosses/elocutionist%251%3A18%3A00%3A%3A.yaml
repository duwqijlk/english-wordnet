simpleMeaning: Someone who has learned to speak to a crowd, and to use the voice and the body in giving
  a talk
scope: A person taught to speak well in public, not someone who just reads words aloud and not a singer.
examples:
- The elocutionist held the crowd with her clear voice.
- He trained as an elocutionist before he took the stage.
