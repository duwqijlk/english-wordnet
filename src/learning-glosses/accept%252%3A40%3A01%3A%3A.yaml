simpleMeaning: To take responsibility for paying another person's costs or debts.
scope: This is about shouldering someone else's bill, not about getting a gift, joining a group, using
  something for a purpose, or putting up with a nuisance.
examples:
- When his brother could not pay, he accepted the charges.
- The buyer accepted the outstanding debts as part of the deal.
