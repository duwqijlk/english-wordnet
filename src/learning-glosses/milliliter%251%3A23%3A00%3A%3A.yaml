simpleMeaning: A metric unit for counting how much room a thing takes up, one thousandth of the main unit
scope: A metric unit for counting how much room a thing takes up, one thousandth of the main unit, also
  called cc, a cubic centimeter, mil, millilitre and ml; not the main unit itself and not a measure of
  weight.
examples:
- Add 250 milliliters of water to the bowl.
- The bottle holds 500 milliliters.
