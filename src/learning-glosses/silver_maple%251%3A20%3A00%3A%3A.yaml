simpleMeaning: Its leaves have five lobes, light green above and pale white beneath, and this common North
  American tree gives hard, fine-grained wood that is light brown but breaks easily.
scope: Among North American trees, this common one is set apart by leaves with five lobes and by hard
  wood that breaks easily.
examples:
- The silver maple has leaves with five lobes, light green above and pale white beneath.
- The silver maple gives hard wood that is light brown but breaks easily.
