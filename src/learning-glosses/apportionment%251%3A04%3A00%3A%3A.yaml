simpleMeaning: the act of sharing things out among people or groups, each getting a part set out by a
  plan
scope: 'Also called allocation, allotment, apportioning, assignation, parceling, and parcelling: the sharing
  out of things by a set plan, not a gift given freely and not a sale.'
examples:
- The apportionment of seats in the House of Representatives is based on the relative population of each
  state.
- The apportionment of the money followed the plan agreed by the committee.
