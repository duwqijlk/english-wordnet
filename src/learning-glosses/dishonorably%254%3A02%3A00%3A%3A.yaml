simpleMeaning: In a shameful way, or to a shameful degree.
scope: In a shameful way, or to a shameful degree; also called shamefully, disgracefully, or ignominiously;
  not in a shameful way alone, nor merely with shame.
examples:
- They behaved dishonorably at the hearing.
- Their grades were dishonorably low that year.
