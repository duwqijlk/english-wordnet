simpleMeaning: In company law, the approval and giving out of shares for sale to the public, or the shares
  given out at one time
scope: This is the approval and giving out of shares for sale, or the shares given out at one time, not
  the act of buying shares back and not a paper that proves ownership.
examples:
- The new stock issue raised money for the firm.
- Investors bought into the stock issue on its first day.
