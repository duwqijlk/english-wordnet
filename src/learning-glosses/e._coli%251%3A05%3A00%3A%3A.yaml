simpleMeaning: A kind of germ often found in the gut of people and other animals, at times harmful and
  a risk to food safety.
scope: A gut germ that can at times cause illness, also called Escherichia coli; not a virus and not a
  germ that lives only in soil.
examples:
- E. coli lives in the gut of most people.
- The food was tested for E. coli before it was sold.
