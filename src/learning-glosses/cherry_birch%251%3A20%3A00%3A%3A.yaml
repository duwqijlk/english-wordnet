simpleMeaning: a common tree of the eastern United States with spicy brown bark that gives an oil that
  goes into the air fast, and hard dark wood used for furniture
scope: A common tree of the eastern United States with spicy brown bark and hard dark wood; black birch
  and sweet birch are other names for this sense, not a white-barked kind and not a shrub.
examples:
- The cherry birch grew behind the house.
- Cherry birch wood makes fine furniture.
