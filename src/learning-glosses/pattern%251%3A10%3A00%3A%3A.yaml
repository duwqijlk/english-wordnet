simpleMeaning: A drawing that shows how the power sent out by an antenna spreads at each angle. It marks
  places by angle and distance, or by side and height numbers.
scope: A drawing of how waves spread from an antenna, not the set path a plane follows when it comes in
  to land, and not a design or shape that repeats.
examples:
- The pattern shows that the antenna sends most of its waves forward.
- Engineers drew the pattern to check the signal at each angle.
