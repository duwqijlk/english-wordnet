simpleMeaning: After a dye that blocks the rays is put into the blood, X-rays make a picture of the kidneys
  and the tubes that carry urine from them
scope: This X-ray picture shows the kidneys and the tubes that carry urine from them, once a dye that
  blocks the rays has gone into the blood.
examples:
- An intravenous pyelogram gives a picture of the kidneys after the dye is put in.
- The intravenous pyelogram took pictures of the patient's kidneys.
