simpleMeaning: The metal comes mostly from this rock, dug from the ground, which is made up mostly of
  that metal joined with sulfur in crystal form.
scope: Blende and sphalerite are other names for this rock, the chief source of its metal.
examples:
- Miners dug zinc blende from the hillside.
- The mill crushed zinc blende to get the metal out.
