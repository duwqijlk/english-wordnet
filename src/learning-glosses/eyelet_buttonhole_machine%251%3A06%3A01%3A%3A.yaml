simpleMeaning: A stitching device that makes every kind of small slit for a fastener, with or without
  the stiff cord that edges it.
scope: A stitching device that makes every kind of fastener slit, also called a buttonhole machine; not
  a hand needle and not an ordinary stitching device.
examples:
- The tailor bought an eyelet buttonhole machine for the workshop.
- This eyelet buttonhole machine can sew the slit with or without the cord.
