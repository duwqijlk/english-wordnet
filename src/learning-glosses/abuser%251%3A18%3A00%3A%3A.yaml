simpleMeaning: a person who treats another person, an animal, or a thing in a wrong and harmful way
scope: The person who does the harm; not the person who is harmed, and not the harmful act itself.
examples:
- The children were taken to a safe home, away from their abuser.
- He was known as an abuser who hurt people weaker than himself.
