simpleMeaning: A person who takes on the clothes, ways, or sexual role of the other sex
scope: A person who takes on the clothes, manner, or sexual role of the other sex, also called a transvestite;
  not an actor in a play and not a person who changes sex.
examples:
- The cross-dresser wore a gown to the party.
- As a cross-dresser, he kept a second wardrobe.
