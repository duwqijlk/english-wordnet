simpleMeaning: at once and with no warning, when a thing is not expected, done on a quick urge with no
  plan made first
scope: Dead, suddenly, short, abruptly, of a sudden and on the spur of the moment are other names for
  this sense; it is about a thing that happens fast and with no plan, not a thing done slowly after much
  thought.
examples:
- All of a sudden, she felt a sharp pain in her side.
- He made up his mind all of a sudden and left for Chicago.
