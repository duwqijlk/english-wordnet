simpleMeaning: In printing, a mark that points to a third note or cross reference, used after the star
  mark and the single cross mark.
scope: A printing mark for a third note or cross reference; diesis and double obelisk are other names
  for this sense, not the star mark and not the single cross mark.
examples:
- The editor added a double dagger to mark the third footnote.
- A double dagger follows the asterisk and the dagger in the notes.
