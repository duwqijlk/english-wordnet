simpleMeaning: a strong closed container used to find how much heat comes off when a thing burns
scope: 'Also called bomb: a strong closed container for measuring the heat of burning, not an explosive
  weapon and not a small lab beaker.'
examples:
- The lab used a bomb calorimeter to measure the heat from the sample.
- They put the coal in the bomb calorimeter to see how much heat it gave off when it burned.
