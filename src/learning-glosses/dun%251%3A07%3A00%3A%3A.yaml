simpleMeaning: a light grey-brown colour, or a paint or dye of that colour, that can be a little more
  grey or more brown
scope: The colour itself, also a paint or dye of that colour; not the horse of that colour and not the
  word used to say a thing has that colour.
examples:
- She wore dun to the meeting.
- The walls were painted dun.
