senseId: 'extrusion%1:25:00::'
synsetId: 13917127-n
simpleMeaning: A thing that juts out from its neighbours.
scope: This sense is also called a bump, a bulge, a swelling, a hump, a jut, a prominence, a protrusion,
  a protuberance, and an excrescence, for a thing that juts out from its neighbours, where a bump is a
  raised part sticking out from the surface round it, a bulge is a part sticking out from the surface
  round it, a swelling is a part sticking out from the surface round it, and a hump is a rounded rise
  on a surface, standing out from what is round it.
examples:
- The extrusion jutted out.
- Extrusions jut out from what is round them.
