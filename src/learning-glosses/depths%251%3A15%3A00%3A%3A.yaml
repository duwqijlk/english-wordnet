simpleMeaning: the part farthest from the top or the edge and hardest to reach, used in the plural
scope: The far, hard-to-reach inner part of a place, in the plural; not a measure of how far down a thing
  goes.
examples:
- Signals came to us from the depths of space.
- They walked far into the depths of the forest.
