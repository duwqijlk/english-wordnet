simpleMeaning: One thousandth of a milliradian, a larger unit of angle, is how big this unit of angle
  is
scope: A tiny unit of angle, one thousandth of a milliradian, not a milliradian itself and not a unit
  of length.
examples:
- The telescope shifted by a few microradians.
- A microradian is far too small an angle to see.
