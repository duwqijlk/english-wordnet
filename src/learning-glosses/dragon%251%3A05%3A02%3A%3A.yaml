simpleMeaning: Any of a group of small tropical Asian lizards that can glide by spreading wing-like skin
  flaps on both sides of the body.
scope: This is the small gliding Asian lizard, not the fire-breathing monster of myth or a fierce, unpleasant
  woman.
examples:
- A dragon glided from one branch to the next.
- The guide pointed out a small dragon resting on a trunk.
