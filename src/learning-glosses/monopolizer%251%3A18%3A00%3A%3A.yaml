simpleMeaning: a person who takes full control of the making or selling of something
scope: A person who takes full control of making or selling something, also called monopolist and monopoliser;
  not a person who merely sells goods and not a person who buys them.
examples:
- The monopolizer fixed prices because no one else could sell the goods.
- Small traders called him a monopolizer and asked the court to stop him.
