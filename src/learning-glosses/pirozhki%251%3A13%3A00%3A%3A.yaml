simpleMeaning: A small folded piece of dough filled with fruit or meat, baked or fried.
scope: A small folded piece of dough filled with fruit or meat, baked or fried; pirogi and piroshki are
  other names for this sense, not a dumpling and not a pasty.
examples:
- She baked pirozhki filled with apples for the party.
- The pirozhki were fried until golden.
