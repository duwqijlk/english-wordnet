simpleMeaning: An acute illness with fever and swollen lymph nodes, plus an excess of certain white blood
  cells; it is not very contagious, and some believe kissing can spread it.
scope: Another name for this illness is mononucleosis, often shortened to mono; it is also nicknamed kissing
  disease, and it is not a highly contagious infection spread by ordinary contact.
examples:
- Infectious mononucleosis kept her out of school for three weeks.
- The blood test confirmed infectious mononucleosis after his fever and swollen glands persisted.
