simpleMeaning: a tool used to move things around in a liquid or in a soft mix, so that all the parts mix
  together
scope: This is a tool for mixing things together; it is not the person who spreads frightening stories
  and makes trouble for others.
examples:
- He used a wooden stirrer to mix the soup.
- She put the stirrer into the paint and moved it around.
