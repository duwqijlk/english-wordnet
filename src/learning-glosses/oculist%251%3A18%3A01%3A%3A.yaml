simpleMeaning: A person skilled at testing sight for faults, so as to order glasses that put the sight
  right.
scope: Also called optometrist; a person skilled at testing sight for faults in order to order glasses
  that put it right, not a doctor who finds out about and treats diseases of the eye.
examples:
- The oculist tested her sight and ordered new glasses.
- He went to the oculist when reading grew hard for him.
