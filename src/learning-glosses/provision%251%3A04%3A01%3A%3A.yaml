simpleMeaning: the job of giving people the things they need
scope: 'Also called supply: the job of giving people the things they need, not the things themselves and
  not the act of stocking a place with food.'
examples:
- The provision of clean water to the village took many months.
- The army arranged the provision of food for the camp.
