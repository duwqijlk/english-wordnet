simpleMeaning: a person who believes that what is true or right depends on what a person thinks or feels
scope: A person who believes truth and rightness depend on what people think and feel, not a person who
  merely has strong opinions.
examples:
- The subjectivist argued that beauty lies in the eye of the beholder.
- As a subjectivist, she trusted feelings over facts.
