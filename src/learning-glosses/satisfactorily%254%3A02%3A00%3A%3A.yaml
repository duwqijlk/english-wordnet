simpleMeaning: in a way that is good enough and meets what is needed
scope: In a good-enough way that meets what is needed; not in a perfect way, and not in a way that falls
  short of what is needed.
examples:
- She answered all the questions satisfactorily.
- The machine worked satisfactorily after the repair.
