simpleMeaning: the arrival of a person or thing that people have waited for, especially something of very
  great importance
scope: 'Another name for this is coming: it is the arrival of a person or thing people have waited for,
  especially something important, not just any arrival that no one waited for.'
examples:
- The advent of the computer changed how people work.
- The advent of the new medicine gave hope to many sick people.
