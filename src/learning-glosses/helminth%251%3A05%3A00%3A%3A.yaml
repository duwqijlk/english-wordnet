simpleMeaning: Above all roundworms, tapeworms, and flukes, it is a worm that lives inside the gut of
  a creature with a backbone.
scope: Also called a parasitic worm, it is a worm that lives inside the gut of a creature with a backbone,
  above all roundworms, tapeworms, and flukes.
examples:
- A helminth was found in the gut.
- The helminth fed inside the gut of its host.
