simpleMeaning: People drink from this jug of hard baked clay, whose neck runs far out and bears a drawn
  face that makes fun of Cardinal Bellarmine, from the 1600s.
scope: Also called greybeard, bellarmine, and long-beard, people drink from this stoneware jug, whose
  long neck bears a drawn face that makes fun of Cardinal Bellarmine.
examples:
- He drank water from the longbeard.
- The longbeard's neck bore the drawn face of a cardinal.
