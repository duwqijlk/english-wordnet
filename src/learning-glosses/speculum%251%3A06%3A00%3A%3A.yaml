simpleMeaning: In medicine, a tool used to open a passage or space inside the body wider so a doctor can
  look inside it
scope: This is a medical tool that opens a passage inside the body wider so a doctor can look inside it;
  it is not a mirror, especially one made of polished metal, for use in an instrument for looking at things.
examples:
- The doctor used a speculum so she could look inside the passage.
- A speculum held the passage open during the check.
