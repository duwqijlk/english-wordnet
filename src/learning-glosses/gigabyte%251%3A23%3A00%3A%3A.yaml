simpleMeaning: a unit of information equal to 1,024 mebibytes (each one 1,048,576 bytes) or 1,073,741,824
  bytes in total
scope: This is the gigabyte unit equal to 1,073,741,824 bytes, not the other gigabyte unit equal to 1,000,000,000
  bytes and not a smaller unit such as a megabyte.
examples:
- This computer has eight gigabytes of memory.
- The file is too big because it is over two gigabytes.
