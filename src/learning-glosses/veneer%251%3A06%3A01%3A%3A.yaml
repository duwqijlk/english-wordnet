senseId: 'veneer%1:06:01::'
synsetId: 04532712-n
simpleMeaning: a thin layer of better wood that is glued onto a base of wood that is not as good
scope: This is the thin wood layer itself, also called veneering, not the act of covering something with
  such a layer.
examples:
- The table has a thin veneer of dark wood over cheaper wood.
- A piece of veneer had lifted from the edge of the cupboard.
