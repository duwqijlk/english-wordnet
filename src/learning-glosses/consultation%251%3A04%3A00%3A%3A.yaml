simpleMeaning: The act of turning to a book or a person for facts or advice
scope: The act of turning to a source for facts or advice; reference is another name for this sense, not
  a meeting to talk things over and not the advice itself.
examples:
- After consultation with her doctor, she changed her diet.
- The plan was drawn up in consultation with the local people.
