simpleMeaning: A soft word for getting rid of a threat by killing it or destroying it, above all in a
  secret or military operation.
scope: A soft word for getting rid of a threat by killing it or destroying it, above all in secret or
  military work, with neutralization as another name for this sense, not the chemistry sense in which
  an acid and a base cancel each other out and not simply removing a danger without killing.
examples:
- The report used neutralisation as a soft word for killing.
- In the operation, neutralisation meant removing the threat for good.
