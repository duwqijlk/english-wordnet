  from Africa near the equator.
scope: Also called African gray and African grey; a grey pet parrot from Africa near the equator, known
  by its red-and-black tail and white face.
examples:
- Our Psittacus erithacus says hello each morning from its cage.
- Psittacus erithacus in the wild lives in the forests of Africa near the equator.
