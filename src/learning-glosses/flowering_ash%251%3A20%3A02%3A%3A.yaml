simpleMeaning: A low bushy tree of the southwestern United States with sweet-smelling white blooms.
scope: A low bushy tree of the southwestern United States with sweet-smelling white blooms; not the California
  tree with showy off-white blooms and not the southern Mediterranean tree that gives manna.
examples:
- The flowering ash filled the garden with the sweet smell of its white blooms.
- Flowering ash grows wild in the southwestern United States.
