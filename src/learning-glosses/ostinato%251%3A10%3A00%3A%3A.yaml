senseId: 'ostinato%1:10:00::'
synsetId: 07059695-n
simpleMeaning: In a piece of music, the same short tune comes back again and again all the way through
scope: The same short tune that comes back again and again through a piece of music, not a tune heard
  only once and not a tune that changes each time it comes back.
examples:
- The ostinato in the bass kept the same four notes going.
- She played the ostinato again and again while the melody changed above it.
