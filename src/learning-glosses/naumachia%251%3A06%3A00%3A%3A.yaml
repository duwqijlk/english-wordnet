simpleMeaning: 'A grand show on water: a sea fight that is not real, put on by the people of ancient Rome'
scope: This is a staged sea fight put on as a grand show, with naumachy as another name for this sense,
  not a real sea battle and not a show on land.
examples:
- The naumachia filled the great pool with ships and cheering crowds.
- Thousands came to watch the naumachia, a staged sea battle from the days of ancient Rome.
