simpleMeaning: a bad event that stops or slows your progress, something that gets in the way and is frustrating
scope: A bad event that holds back your plans, also called a blow or a setback. It is not the back side
  of a coin and not the gear that makes a car go backwards.
examples:
- Losing their best player was a serious reverse for the team.
- The company suffered a reverse when its main shop burned down.
