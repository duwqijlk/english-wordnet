simpleMeaning: a deep new understanding of spiritual things (things to do with God, the soul and how to
  live) that makes a person start a new life
scope: 'Also called rebirth: a person starting a new life through faith, not swapping the parts of a statement
  and not a change of feelings into signs of illness in the body.'
examples:
- After his conversion, he gave up drinking and helped the poor.
- Her conversion changed her whole way of life.
