simpleMeaning: a long flat part of a plant, shaped like a sword, such as the one an iris has
scope: A leaf shaped like a sword, such as an iris leaf, not any leaf and not a real sword.
examples:
- The iris has a tall ensiform leaf that rises beside its flower.
- Each ensiform leaf on the plant is long and pointed at the end.
