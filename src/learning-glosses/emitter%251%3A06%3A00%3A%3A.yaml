simpleMeaning: The electrode (a part that takes electricity in or out) in a transistor (a small part that
  controls electricity) where electrons (tiny parts that carry electricity) start
scope: The part of a transistor where electrons start, not any thing that sends out light, heat or gas.
examples:
- The engineer checked the emitter in the transistor for damage.
- Electrons flow from the emitter to the other parts of the transistor.
