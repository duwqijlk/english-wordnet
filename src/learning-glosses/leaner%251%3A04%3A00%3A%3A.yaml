simpleMeaning: In horseshoes, a throw that leaves the shoe resting against the post but not around it
scope: In the game of horseshoes, a throw that rests against the post; not a throw that lands around the
  post, and not a person or thing that rests against something.
examples:
- His last throw was a leaner, resting against the stake.
- She scored a point for a leaner that stopped against the post.
