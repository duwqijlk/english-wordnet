simpleMeaning: The line on the head where hair is combed in opposite directions, showing a narrow strip
  of skin.
scope: This is not a piece of a whole, not a role in a play, and not a region of a country.
examples:
- She wears her hair with a center part.
- The hairdresser made a sharp part on the left.
