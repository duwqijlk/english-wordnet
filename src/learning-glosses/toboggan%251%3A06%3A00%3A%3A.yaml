simpleMeaning: a long, thin sled for sliding over snow, with no runners underneath, and with the front
  of its boards curving up
scope: This is the snow sled itself, with no runners and a front that curves up; not the act of riding
  on one, and not a sled with runners.
examples:
- They pulled the toboggan up the snowy hill.
- The children sat on the toboggan and slid down together.
