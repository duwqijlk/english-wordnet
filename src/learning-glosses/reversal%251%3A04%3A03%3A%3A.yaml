simpleMeaning: the act of putting things in the opposite order, or of swapping their places
scope: Putting things in the opposite order or swapping their places. It is not a decision that undoes
  an earlier decision, and not a bad event that blocks progress.
examples:
- A reversal of the order of the names on the list caused confusion.
- The reversal of their places on the shelf made the books easier to reach.
