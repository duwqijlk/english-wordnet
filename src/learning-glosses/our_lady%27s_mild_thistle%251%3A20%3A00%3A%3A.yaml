simpleMeaning: A tall two-year prickly plant of the Old World, with big clasping leaves marked with white
  and purple flower heads; now at home in California and South America.
scope: 'Also called blessed thistle, holy thistle, lady''s thistle, milk thistle and Silybum marianum:
  a tall two-year prickly plant of the Old World, with big clasping leaves marked with white and purple
  flower heads, now at home in California and South America, not a low creeping thistle and not a garden
  thistle.'
examples:
