simpleMeaning: a common deer that lives in the parts of Europe and Asia where the weather is not very
  hot or very cold
scope: This is the common deer of Europe and Asia, where the weather is mild. It is not the large North
  American deer with big spreading antlers on the male, and not the very large northern deer called a
  moose in North America.
examples:
- An elk grazed in a forest in northern Europe.
- We saw an elk in the hills of Asia.
