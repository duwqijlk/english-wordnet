simpleMeaning: like the loud sound of something being torn apart by force, or of a tree being broken apart
  by lightning
scope: 'Also called splitting: a loud sound like tearing, not a quiet or soft sound.'
examples:
- A ripping sound came from the sky as lightning hit the tree.
- We heard a loud ripping noise when the cloth tore apart.
