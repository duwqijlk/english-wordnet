simpleMeaning: The form of a body-made substance that turns to one side, used as a drug to treat Parkinson's
  disease
scope: The form of a body-made substance that turns to one side, used as a drug to treat Parkinson's disease;
  levodopa, Bendopa, Brocadopa and Larodopa are other names for this sense; not the form that turns the
  other way, and not a drug for another illness.
examples:
- The doctor gave him L-dopa for Parkinson's disease.
- L-dopa is used to treat Parkinson's disease.
