simpleMeaning: Having a raised line, or shaped like a raised line, or like the raised line along the bottom
  of a ship
scope: 'Also called ridged, carinate and carinated: having a raised line, not flat and not smooth.'
examples:
- The plant has keeled leaves with a sharp raised line underneath.
- The keeled shell of the snail has a clear line along its back.
