senseId: 'cross_infection%1:26:00::'
synsetId: 14201808-n
simpleMeaning: a sickness caught in a hospital or other place that gives medical care
scope: A sickness a person picks up while in a hospital or another place that gives medical care; nonsocial
  infection is another name for this sense, and this is not a sickness caught at home or in the street
  or one a patient already had before going in.
examples:
- He got a cross infection after his operation in the hospital.
- The ward was closed because of a cross infection among the patients.
