  consonants.
scope: In speech sounds, a way of making sounds, usually consonants, with the tip of the tongue blocking
  the flow of air.
examples:
- Apicalization blocks the flow of air with the tip of the tongue.
- In apicalization, the tip of the tongue blocks the air to make the sound.
