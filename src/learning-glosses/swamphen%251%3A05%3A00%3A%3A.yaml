simpleMeaning: a small water bird with a flat plate on its forehead and the look of a farm hen, one of
  several of the group Gallinula, told apart from rails
scope: Also called a gallinule, a marsh hen, and a water hen; a small water bird of the group Gallinula,
  not a rail and not a farm hen.
examples:
- A swamphen swam among the reeds with its bright forehead plate showing.
- We saw a swamphen that looked much like a small farm hen.
