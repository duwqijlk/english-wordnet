simpleMeaning: to make a knife or tool sharp by rubbing its edge on a stone made for this job
scope: Making a knife or tool sharp by rubbing it on a stone, not cutting with it and not making it wet.
examples:
- He whetted the knife before cutting the meat.
- The farmer whets his blade on a stone each morning.
