simpleMeaning: The main one of the small building blocks that make up proteins in sugar cane, and the
  simplest of those blocks.
scope: Among the small building blocks of proteins, this one is the simplest, and in sugar cane it is
  the main one.
examples:
- Glycine is the smallest building block found in proteins.
- Sugar cane holds more glycine than any other of its building blocks.
