simpleMeaning: Under this money system, the basic unit of money is fixed by set amounts of two kinds,
  usually gold and silver, at a set rate between them.
scope: This money system fixes the basic unit of money by set amounts of two kinds, usually gold and silver,
  not a system based on one kind alone.
examples:
- Under bimetallism, the basic unit of money was fixed by set amounts of gold and silver.
- Under bimetallism, the worth of gold and silver stood at a fixed rate.
