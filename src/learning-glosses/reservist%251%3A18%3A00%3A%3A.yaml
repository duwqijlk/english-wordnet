simpleMeaning: a person who belongs to a part of the military that is not on full-time duty but can be
  called when needed
scope: This is a person who belongs to the back-up part of the military. It is not a full-time soldier,
  and it is not a person who has left the military for good.
examples:
- The reservist was called back to duty when the war began.
- As a reservist, she trains with the army one weekend each month.
