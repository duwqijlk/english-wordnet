simpleMeaning: a plant from Europe and Asia that lives for one year, is grown in North America, and has
  bright blue, purple, pink or white flowers
scope: 'Also called bluebottle and bachelor''s button: a one-year plant with blue, purple, pink or white
  flowers, not the yellow-flowered plant grown in the south and south-east of the United States.'
examples:
- Cornflowers opened in bright blue and pink all along the garden bed.
- She picked a cornflower with white flowers for the vase.
