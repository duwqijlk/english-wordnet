simpleMeaning: A device that makes power from atoms, kept cool and slowed by the liquid under high force,
  whose steam can turn a wheel that makes power
scope: This is a device that makes power from atoms, kept cool and slowed by the liquid under high force,
  whose steam can turn a wheel that makes power, not a device that burns coal and not a device that makes
  power from the sun.
examples:
- The pressurized water reactor makes power for the town.
- A pressurized water reactor uses steam to turn a wheel.
