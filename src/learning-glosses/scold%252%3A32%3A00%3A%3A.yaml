simpleMeaning: to tell someone off in a hard and angry way
scope: 'Also called jaw, rag, lecture, chide, rebuke, berate and reprimand: this is telling a person off
  in anger, not the person who keeps finding fault and not just showing you are unhappy.'
examples:
- The mother scolded the child for crossing the road alone.
- The teacher scolded him angrily for lying.
