simpleMeaning: An oxide of iron that a magnet pulls strongly.
scope: Also called magnetic iron-ore, this is a stuff a magnet pulls hard, made from a metal and air,
  not a plain piece of metal and not a man-made magnet.
examples:
- The magnetite sticks hard to a magnet.
- The magnetite in the rock made the compass needle swing.
