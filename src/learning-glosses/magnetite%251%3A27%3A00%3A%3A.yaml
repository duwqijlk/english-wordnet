simpleMeaning: An oxide of iron that a magnet pulls strongly.
scope: Also called magnetic iron-ore, this is an oxide of iron that magnets pull strongly, not a plain
  piece of iron and not a man-made magnet.
examples:
- The magnetite sticks hard to a magnet.
- The magnetite in the rock made the compass needle swing.
