simpleMeaning: One of two or more whole numbers that divide another whole number exactly, leaving no remainder.
scope: This is a number that divides another exactly, not a circumstance that helps cause a result.
examples:
- Three and four are factors of twelve.
- List all the factors of twenty-four.
