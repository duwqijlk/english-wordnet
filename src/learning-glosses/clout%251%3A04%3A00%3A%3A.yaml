simpleMeaning: In boxing, a hard hit with the hand closed tight
scope: In boxing, a hit with the fist, also called a punch, a poke, a lick, a slug, and a biff; not the
  short nail sense of this word.
examples:
- The boxer gave him a clout on the nose during the fight.
- One hard clout to the chin knocked the fighter down.
