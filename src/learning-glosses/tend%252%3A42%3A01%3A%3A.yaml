senseId: 'tend%2:42:01::'
synsetId: 02725274-v
simpleMeaning: to be likely to do or be something because that is your nature, and to lean toward doing
  or being it
scope: To be likely to do or be something by nature; run and lean are other names for this sense, and
  it is not looking after a person or a garden.
examples:
- He tends to talk too much when he is nervous.
- These plants tend to grow well in dry places.
