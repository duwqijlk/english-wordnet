simpleMeaning: to leave small pit-like marks on a thing, as if made by spots
scope: To leave small pit-like marks on a thing, not the marks themselves and not a cut or a bruise.
examples:
- Her face was pockmarked by the disease.
- The illness pockmarked his cheeks for life.
