senseId: 'conjunction%1:10:00::'
synsetId: 06336819-n
simpleMeaning: A joining word that does not change its form, used to join words, phrases, parts of a sentence,
  or whole sentences
scope: 'Also called connective, conjunctive, and continuative: this is the joining word itself, not the
  link it makes, and not stars or planets seeming to meet in the sky.'
examples:
- In 'bread and butter', 'and' is a conjunction.
- The conjunction 'but' joins the two parts of the sentence.
