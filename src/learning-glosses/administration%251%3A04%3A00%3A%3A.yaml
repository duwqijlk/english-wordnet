simpleMeaning: The work of running a group and taking care of what it does and spends, most of all its
  business work and money
scope: The way a group is run, also called disposal; not the people who run it, and not the act of giving
  medicine to someone.
examples:
- Good administration kept the school running well.
- The company's administration of its funds was careful.
