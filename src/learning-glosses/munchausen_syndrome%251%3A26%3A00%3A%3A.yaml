simpleMeaning: A sickness in which a person pretends to have a sudden serious illness, though no sign
  of it is ever found
scope: Also called Munchausen's syndrome; a sickness of pretending to be ill, not a real sudden illness
  and not a sickness with clear signs.
examples:
- Munchausen syndrome means pretending to have an illness with no sign of it.
- Doctors found no sign of illness in the Munchausen syndrome case.
