simpleMeaning: A drug that is not a steroid, used to cut swelling, sold under the name Feldene, used to
  treat sore joints and other swollen parts of the body.
scope: A drug that is not a steroid, used to cut swelling, sold under the name Feldene; not ibuprofen
  and not aspirin.
examples:
- The doctor gave her piroxicam for her arthritis.
- Piroxicam eased the swelling in his knee.
