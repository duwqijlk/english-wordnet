simpleMeaning: Helps to show that an idea is true, or to make you believe a claim that something is true
scope: What tends to prove a claim or win you over to it; probatory is another name for this sense, not
  what only makes something seem likely.
examples:
- The judge ruled that the DNA results had strong probative value.
- The letter was probative evidence, showing that she had been at the meeting.
