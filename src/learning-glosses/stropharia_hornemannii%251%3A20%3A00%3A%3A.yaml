simpleMeaning: A gilled fungus with a large slimy purple or olive cap; its gills turn purple with age,
  and white sheath bits thickly spread on its long stalk reach a ring.
scope: A gilled fungus with a slimy cap, not other gilled fungi with dry caps and not the edible field
  mushroom.
examples:
- Stropharia hornemannii grows in damp woods after rain.
- The cap of Stropharia hornemannii was slimy to the touch.
