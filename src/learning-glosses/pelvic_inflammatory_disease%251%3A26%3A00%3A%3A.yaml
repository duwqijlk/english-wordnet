simpleMeaning: An infection-caused swelling of a woman's reproductive organs inside the hips, mainly the
  egg-carrying tubes, often from gonorrhea or chlamydia; it brings belly pain, fever and bad-smelling
  vaginal discharge.
scope: This is an infection of the inner reproductive organs, mainly the tubes, not a bladder infection
  or a yeast infection.
examples:
- Untreated chlamydia can spread and cause pelvic inflammatory disease.
- She was given antibiotics for pelvic inflammatory disease and told to return for a check-up.
