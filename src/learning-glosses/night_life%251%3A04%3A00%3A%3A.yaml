simpleMeaning: What people do when they go out after dark for fun, as at a show, a dance club, and so
  on.
scope: What people do when they go out after dark for fun, also called nightlife; not a day out and not
  staying at home in the evening.
examples:
- In the summer the night life shifts to the dance clubs.
- The city's night life keeps its clubs open till late.
