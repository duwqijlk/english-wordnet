senseId: stereotypical%5:00:00:conventional:01
synsetId: 00610354-s
simpleMeaning: not done freely in the moment, with no new ideas and nothing that shows a person's own
  character
scope: This sense, also called unimaginative and stereotyped, means not new or personal in ideas or ways;
  it is not about holding a fixed idea about a group of people.
examples:
- His speech was stereotypical, with the same old phrases and no new ideas.
- She gave a stereotypical answer that sounded like everyone else's.
