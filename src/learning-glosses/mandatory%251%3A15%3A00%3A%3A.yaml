simpleMeaning: land given up by Turkey or Germany after the First World War and run by another European
  country until its people could rule themselves
scope: A piece of land run for a time by another European country after the First World War, with mandate
  as another name for this sense, and not a colony or a free state.
examples:
- After the war, the territory became a mandatory under British rule.
- The mandatory was governed from abroad until its people could rule themselves.
