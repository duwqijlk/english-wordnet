simpleMeaning: tell in words what someone or something is like
scope: 'Another name for draw and depict here: telling what something is like in words, not the scientific
  sense of identifying a plant or animal, not the close sense of giving an account in words, and not making
  marks on a surface.'
examples:
- She described the garden to her friend.
- He described the accident in detail.
