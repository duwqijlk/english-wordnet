simpleMeaning: the act of moving from side to side in small, quick movements
scope: This names the small side-to-side movement itself, as a noun; it is not a big, slow or smooth movement.
examples:
- The baby gave a happy wiggle in her mother's arms.
- With a quick wiggle, he freed his hand from the tight glove.
