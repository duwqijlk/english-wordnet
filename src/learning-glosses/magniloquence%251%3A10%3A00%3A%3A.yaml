simpleMeaning: Far too many fancy words fill a grand way of speaking or writing
scope: Also called grandiloquence, grandiosity, ornateness and rhetoric, this is a grand way of speaking
  or writing that piles on fancy words, not plain speech and not a single fine phrase.
examples:
- His magniloquence made the short speech feel twice as long.
- The magniloquence of her letter hid a simple request under fancy words.
