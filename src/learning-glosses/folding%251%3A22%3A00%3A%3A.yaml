simpleMeaning: the process by which a protein molecule (a very small part found in living things) takes
  on its detailed shape with length, width and height
scope: This is about the shape a protein takes; it is not a bend in layers of rock, not the act of bending
  something, and not a thing that can be bent and put away.
examples:
- Scientists study protein folding to learn how the body works.
- Mistakes in protein folding can cause illness.
