simpleMeaning: A drug taken by mouth that kills bacteria; a man-made kind of penicillin, a drug that fights
  infection, sold under the names Larotid, Polymox, Trimox, and Augmentin.
scope: Also called amoxicillin, Augmentin, Larotid, Polymox, and Trimox; a drug taken by mouth that kills
  bacteria, not a drug rubbed on the skin and not a drug that kills viruses.
examples:
- The doctor gave her Amoxil for the bacterial infection.
- Amoxil is taken by mouth to fight a bacterial infection.
