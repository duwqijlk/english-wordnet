simpleMeaning: a musical instrument you blow, made of a long metal tube, usually with parts that change
  its length, and a mouth part shaped like a cup or a funnel
scope: One instrument you blow, not the yellow metal it is made of, not the group of such instruments
  in a band, and not the leaders of a group.
examples:
- The brass in her hands had a long metal tube and a cup-shaped mouthpiece, and she blew a clear note.
- This brass is blown through a funnel-shaped mouthpiece.
