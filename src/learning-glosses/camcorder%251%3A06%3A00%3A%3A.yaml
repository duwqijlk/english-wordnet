simpleMeaning: a television camera that you can carry, and that also records video on tape
scope: This is a camera you carry that records moving pictures on tape, not a camera for still photos
  and not a large studio camera.
examples:
- He filmed the birthday party with a camcorder.
- She carried her camcorder to record the school play.
