simpleMeaning: a careful, step-by-step way of thinking with reasons to show that something is true or
  not true
scope: 'Also called line: a careful set of reasons to show something is true or false, not an angry talk
  where people disagree and not a value in maths.'
examples:
- Her argument was clear, and no one could find a weak point in it.
- I could not follow his argument about why the plan would work.
