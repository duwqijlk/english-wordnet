simpleMeaning: the act of taking out parts from things people write or publish, from letters, or from
  plays
scope: 'Also called censoring: this is taking out parts of published writing, letters or plays, not the
  army work of stopping information that could help an enemy.'
examples:
- Censorship removed several pages from the book before it was sold.
- The play faced censorship, and three scenes were cut from it.
