simpleMeaning: A tall plant living many years, of tropical Asia, with dark green leaves, grown for the
  fibre from its woody stems, which is like flax.
scope: Also called ramee, ramie, Boehmeria nivea, and Chinese silk plant; a tall plant of tropical Asia
  grown for the fibre from its woody stems, like flax.
examples:
- China grass grows in the field.
- They make cloth from China grass fibre.
