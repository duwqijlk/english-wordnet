senseId: 'moralize%2:32:00::'
synsetId: 00830035-v
simpleMeaning: to speak like a person giving a talk in church, and to give your views on what is right
  and wrong
scope: 'Also called sermonize and sermonise: this is speaking like a church talk and giving views on right
  and wrong. It is not explaining the moral meaning of a story, and not trying to make people behave better.'
examples:
- He moralized about young people wasting their time.
- Stop moralizing and just tell me what happened.
