simpleMeaning: a very small dog of a kind kept only as a pet
scope: A very small pet dog, not a copy that does not work, not a much smaller copy of a person or thing,
  and not to play with a thing or an idea.
examples:
- Her toy poodle fits in a small basket.
- The toy dog sat on her lap all evening.
