simpleMeaning: to let a prisoner out of prison early, on set terms, before the full time is served
scope: This is letting a prisoner out of prison early, on set terms, before the full time is served; not
  freeing someone outright and not the noun sense of the release itself.
examples:
- The prisoner was paroled after serving 10 years in prison.
- The board agreed to parole him at the end of the year.
