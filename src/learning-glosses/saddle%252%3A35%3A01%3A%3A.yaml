simpleMeaning: to put the seat used when riding an animal on that animal's back
scope: To put the seat used for riding on an animal's back, not to put something heavy or hard to bear
  on a person, and not simply to give a person a task to do.
examples:
- He saddled the horse before the morning ride.
- She saddled her horse and rode out to the fields.
