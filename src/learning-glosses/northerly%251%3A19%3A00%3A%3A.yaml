simpleMeaning: a wind that comes from the north
scope: Also called a norther, this noun names a wind that comes from the north; it is not the word for
  facing north or for moving toward the north.
examples:
- A cold northerly blew across the flat land all night.
- The northerly brought cold air and clear skies.
