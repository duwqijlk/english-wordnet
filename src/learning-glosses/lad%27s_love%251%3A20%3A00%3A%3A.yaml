simpleMeaning: Used to make the drink absinthe, this sweet-smelling herb of the mild lands of Europe and
  Asia and of North Africa has a bitter taste.
scope: This herb is also called absinthe, common wormwood and old man, and its bitter taste goes into
  the drink absinthe.
examples:
- Lad's love smells sweet but tastes bitter.
- The drink absinthe is made with lad's love.
