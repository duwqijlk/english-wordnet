simpleMeaning: A thing made when part of the body is swollen and sore, found in the blood in some cases
  when the swelling is sharp and new.
scope: Also called CRP; a thing made when part of the body is swollen and sore, found in the blood in
  some cases when the swelling is sharp and new.
examples:
- C-reactive protein was high in his blood test.
- The doctor checked C-reactive protein to see if the swelling was still there.
