simpleMeaning: hold a position so that an artist can paint, draw, or photograph you
scope: This is holding a pose for an artist, not shaping clay or wax, wearing clothes to show them, or
  planning something from an existing pattern.
examples:
- She modelled for a portrait class every Tuesday.
- He agreed to model for the magazine's cover photo.
