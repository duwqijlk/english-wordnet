simpleMeaning: In anatomy, tubes that carry fluids, nerves, or ducts pass into an organ through a hollow
  or crack in it.
scope: It is also called hilum.
examples:
- The hilus of the kidney is where the tubes enter.
- The hilus of the lung is where the nerves go in.
