simpleMeaning: a woman who owns a house or rooms and lets people live there for money
scope: A woman who lets a house or rooms for money; not a tenant, who pays to live there, and not a woman
  who runs a pub.
examples:
- Our landlady lives upstairs and collects the rent each month.
- The landlady fixed the broken heater in our flat.
