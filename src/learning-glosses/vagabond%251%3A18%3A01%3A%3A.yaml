simpleMeaning: a person who moves from place to place, with no fixed home, and with no way to live that
  other people can see
scope: 'Also called vagrant, drifter, and floater: this is a person with no fixed home who moves from
  place to place, not the verb sense of moving about with no aim and not a thing with no fixed place.'
examples:
- A vagabond slept under the bridge with all he owned in one bag.
- The vagabond walked from town to town looking for work.
