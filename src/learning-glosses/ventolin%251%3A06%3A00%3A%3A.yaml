simpleMeaning: A drug that widens the airways, used for asthma, emphysema and lung ills; taken as pills
  or a spray to breathe in, it can speed the heart and cause shaking.
scope: A drug that widens the airways for asthma and other lung ills, close to other airway-widening drugs;
  also called albuterol and Proventil.
examples:
- She used her Ventolin inhaler before the run.
- Ventolin eased his wheezing within minutes.
