senseId: 'structuralism%1:09:01::'
synsetId: 06191000-n
simpleMeaning: the study of how a text or talk is built from its parts and the rules that hold them together
scope: 'Another name for structural linguistics: the study of how language is put together in texts and
  talk, not the study of what words mean, and not the anthropological idea of hidden social rules.'
examples:
- Structuralism looks at how a story is built from its parts and the rules that hold them together.
- He used structuralism to study the shape of the poem, not what its words meant.
