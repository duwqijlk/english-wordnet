simpleMeaning: Growth of the right lower room of the heart, caused by sickness of the lungs or of the
  blood tubes of the lungs.
scope: This is growth of the right lower room of the heart caused by sickness of the lungs, not a weak
  heart that cannot pump and not sickness of the lungs alone.
examples:
- Long lung sickness had led to cor pulmonale.
- The doctor found cor pulmonale in the patient with bad lungs.
