simpleMeaning: A flat plate lined with tiny hairs that a small sea animal uses to swim.
scope: A hair-lined swimming plate of a small sea animal, not the red crest on a hen's head and not the
  tool for hair.
examples:
- Each comb on the tiny sea animal rippled as it moved through the water.
- The comb helped the little sea creature swim in a straight line.
