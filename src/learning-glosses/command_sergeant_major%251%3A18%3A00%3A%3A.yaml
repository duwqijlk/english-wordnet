simpleMeaning: the most senior soldier below officer rank who runs the office work of an army headquarters
  unit
scope: The top soldier below officer rank who runs the office work of an army headquarters unit, not an
  officer and not an ordinary sergeant.
examples:
- The command sergeant major met the new soldiers at the gate.
- She asked the command sergeant major about her leave papers.
