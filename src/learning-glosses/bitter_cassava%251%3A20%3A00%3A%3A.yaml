simpleMeaning: cassiri, a strong drink, and tapioca are made above all from this sharp-tasting cassava,
  whose long swollen roots are good to eat and whose soft stems break easily
scope: Also called gari, manioc, mandioc, mandioca, and tapioca plant; a sharp-tasting cassava used above
  all for cassiri and tapioca, not the sweet cassava eaten as a plain root.
examples:
- Farmers grow bitter cassava for its long roots.
- Bitter cassava is used to make tapioca.
