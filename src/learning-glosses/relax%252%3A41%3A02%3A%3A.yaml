simpleMeaning: to become less nervous, less formal, and less careful to hold back what you feel, and to
  act in a friendlier way
scope: This is about a person becoming friendlier and less formal with other people, not about resting
  and not about making something loose.
examples:
- Our new teacher relaxed when she saw that the class was friendly.
- After a few minutes, he relaxed and began to talk and smile with the group.
