simpleMeaning: a health problem in the way the body handles fats, so that too much of some fats builds
  up in the body
scope: A health problem in the way the body handles fats, so that too much of some fats builds up; not
  a problem with sugar in the blood and not a single fatty meal.
examples:
- Lipidosis meant that too much fat was building up in his body.
- The child with lipidosis had too much fat building up in her body.
