schema: oewn-learning-gloss-v2
senseId: 'separatrix%1:10:00::'
synsetId: 06857953-n
simpleMeaning: a punctuation mark (/) used to keep two related pieces of information apart
scope: The slash mark between two related pieces of information, not a mark that ends a sentence and not
  a sign for division in sums.
examples:
- Use a separatrix between the two dates.
- The separatrix between the day and the month kept the two numbers apart.
