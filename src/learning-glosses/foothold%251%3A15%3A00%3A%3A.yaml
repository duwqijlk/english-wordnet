simpleMeaning: a place in enemy land that soldiers have taken and hold while they wait for more soldiers
  and things they need
scope: A place in enemy land taken and held by soldiers; not a first small success that opens the way.
examples:
- The only foothold left for British troops in Europe was Gibraltar.
- The soldiers fought to keep their foothold on the beach.
