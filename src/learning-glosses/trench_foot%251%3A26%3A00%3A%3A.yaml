simpleMeaning: An injury like frostbite but without freezing, caused by being out in the cold and wet
scope: An injury like frostbite but without freezing, also called immersion foot, caused by cold and wet;
  not frostbite itself and not a blister from walking.
examples:
- Soldiers in the wet trenches often got trench foot.
- His trench foot came from standing in cold water all day.
