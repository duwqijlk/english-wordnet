simpleMeaning: A great change in farming in the 1960s and 1970s, when new sprays, high-yield grain, and
  better ways of running farms greatly raised how much food farms grew
scope: A great change in farming in the 1960s and 1970s that greatly raised how much food farms grew,
  not a change in government and not a new kind of farm machine.
examples:
- The green revolution raised how much food farms grew.
- Farmers felt the green revolution in the 1960s and 1970s.
