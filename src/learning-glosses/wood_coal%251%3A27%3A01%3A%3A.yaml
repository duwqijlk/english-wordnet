simpleMeaning: A material made mostly of carbon, got by heating timber or other matter from living things
  with no air.
scope: This is a material made mostly of carbon, got by heating timber or other matter from living things
  with no air, also called charcoal, not the coal-like material that lies between peat and bituminous
  coal.
examples:
- They made wood coal by heating timber with no air.
- Wood coal burns hot in the forge.
