simpleMeaning: a slow way of moving on hands and knees, or by pulling the body along the ground
scope: 'Also called crawl and crawling: a slow way of moving on hands and knees or by pulling the body
  along, not a fenced pen for young animals and not a strange, unpleasant person.'
examples:
- The injured man could only manage a creep to the door.
- Traffic moved at a creep through the town.
