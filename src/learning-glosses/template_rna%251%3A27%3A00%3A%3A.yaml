simpleMeaning: The pattern for making proteins; the acid in cells that carries the instructions from DNA
  in the cell's control centre to the spots where proteins are made.
scope: A kind of cell acid that carries the instructions from DNA to the making spots, while other cell
  acids do other work; also called mRNA, informational RNA and messenger RNA.
examples:
- Template RNA carries the code from DNA to the place where proteins are made.
- Without template RNA the cell could not build new proteins.
