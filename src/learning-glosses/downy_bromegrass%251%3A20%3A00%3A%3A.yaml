simpleMeaning: with soft, fine hairs on its leaves, a plant from the lands around the Mediterranean Sea
  that lives for one year, or through one cold season
scope: 'Also called cheatgrass, downy brome, downy cheat, downy chess, and drooping brome: a grass that
  lives for one year, or one cold season, with soft-haired leaves from the Mediterranean, not a grass
  that lives for many years and not a grass with smooth leaves.'
examples:
- The downy bromegrass grew thick along the dry path.
- She pulled up a clump of downy bromegrass from the field.
