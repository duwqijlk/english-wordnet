simpleMeaning: A light garment worn to keep clothes safe from the stuff used while working in a place
  for science tests.
scope: A light garment worn to keep clothes safe from the stuff used while working in a place for science
  tests; lab coat is another name for this sense, not an apron and not an ordinary outdoor coat.
examples:
- She put on her laboratory coat before starting the test.
- The laboratory coat kept his shirt clean.
