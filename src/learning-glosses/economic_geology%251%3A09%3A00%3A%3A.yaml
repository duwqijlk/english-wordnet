simpleMeaning: the part of the study of rocks and the earth that deals with rocks and other matter that
  has worth in money
scope: The study of rocks and matter worth money, not the study of rocks for its own sake and not the
  buying and selling of land.
examples:
- She studied economic geology to find where to mine for ore.
- Economic geology helps miners find rocks worth money.
