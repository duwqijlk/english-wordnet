simpleMeaning: A tropical plant of the Americas bearing a large fleshy fruit to eat, with a tuft of stiff
  leaves at the top; widely grown in the tropics.
scope: 'Also called the pineapple and the pineapple plant: a tropical plant bearing a large fleshy fruit,
  not a palm and not a small berry bush.'
examples:
- Ananas comosus grew in rows across the warm field.
- The Ananas comosus fruit was heavy and sweet when ripe.
