simpleMeaning: The changing of the strength of a radio wave to carry sound
scope: The changing of the strength of a radio wave to carry sound; amplitude modulation is another name
  for this sense, and it is not a change in the wave's speed nor a change in its pitch.
examples:
- AM radio carries sound by changing the strength of its waves.
- The station broadcasts in AM.
