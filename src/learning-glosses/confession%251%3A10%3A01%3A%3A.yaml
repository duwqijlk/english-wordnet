simpleMeaning: a written paper that says a person did a wrong act, with that person's name signed on it
scope: This is the signed written paper itself, not the act of telling a priest about your sins in church
  and not a paper that sets out what a church believes.
examples:
- The police kept his signed confession in the case file.
- She signed a confession that said she had taken the money.
