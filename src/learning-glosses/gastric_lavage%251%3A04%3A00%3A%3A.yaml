simpleMeaning: Washing out the inside of the stomach with germ-free water or salt water, to take out blood
  or poison
scope: This is washing out the stomach to clear out blood or poison, not a test that looks inside the
  stomach and not a drug that makes a person sick.
examples:
- The doctor ordered a gastric lavage after the child swallowed the pills.
- A gastric lavage cleared the poison from her stomach.
