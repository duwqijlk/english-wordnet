simpleMeaning: A hardy sheep with no horns, from hills on the English-Scottish border, known for its short
  thick wool.
scope: A hardy sheep with no horns and short thick wool, not a goat or a sheep with long fine wool.
examples:
- Cheviot sheep graze on the high hills.
- The farmer sheared his Cheviots for their short thick wool.
