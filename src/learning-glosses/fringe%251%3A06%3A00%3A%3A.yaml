simpleMeaning: a border made to look nice, made of short pieces of thread hanging down, or of small bunches
  of thread tied at the top
scope: This is the hanging thread border on cloth or clothing; it is not a band of light or dark made
  by light, and not the act of putting such a border on something.
examples:
- The edge of her shawl had a long fringe that moved as she walked.
- He bought a rug with a short fringe at each end.
