simpleMeaning: very hard to follow, full of many small parts, and sometimes not honest or direct
scope: 'Also called involved, tangled, convoluted, labyrinthine and knotty: very hard to follow, not a
  road or path with many turns and bends.'
examples:
- The tortuous talks went on for months, with each new point adding more small details.
- She gave a tortuous answer that was hard to follow and not fully honest.
