simpleMeaning: a helpful tiny living thing in the gut of healthy animals with fur, often thought of as
  a plant
scope: 'Also called probiotic, probiotic bacterium, and probiotic microflora: a helpful tiny living thing
  in the gut of healthy animals, not a germ that makes you ill and not a plant.'
examples:
- The doctor said probiotic flora in the gut helps keep animals healthy.
- Probiotic flora are tiny living things that live in the gut of healthy mammals.
