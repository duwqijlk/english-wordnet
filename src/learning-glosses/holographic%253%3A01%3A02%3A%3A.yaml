simpleMeaning: connected with holography (a way of making pictures that look real and solid) or with the
  pictures made in this way
scope: This sense is about pictures that look real and solid and the way of making them, not about a paper
  written in full by the person who signs it.
examples:
- A holographic image of the building stood above the table.
- The museum showed a holographic picture of a ship that looked solid.
