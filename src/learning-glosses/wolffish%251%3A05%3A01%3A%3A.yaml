simpleMeaning: a large fierce sea creature from the deep seas of the north, caught for food, with strong
  teeth and no belly fins
scope: Also called a wolf fish or a catfish, this is a large fierce deep-sea creature caught for food;
  not a wolf, and not the long sail-finned fish of the same name in another sense.
examples:
- The wolffish snapped at the bait with its strong teeth.
- Cooks value the wolffish as food from the cold northern seas.
