simpleMeaning: the blood vessels of the upper arm are formed when these shallow veins, running up the
  thumb side of the forearm, meet the veins on the little-finger side
scope: 'Also called radial vein: shallow veins on the thumb side of the forearm, not the veins on the
  little-finger side and not veins of the leg.'
examples:
- The vena radialis runs up the thumb side of the forearm.
- The surgeon followed the vena radialis to where it joins the ulnar veins.
