simpleMeaning: very much; very strongly; people also say 'bad' for this meaning, but that use is not standard
  English
scope: Another name for this sense is bad. It means very much or with great force, not in a poor way and
  not in a way that works against someone.
examples:
- The injury hurt badly for days.
- We need water badly after the long walk in the sun.
