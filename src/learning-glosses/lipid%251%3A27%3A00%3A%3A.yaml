simpleMeaning: An oily organic compound that does not dissolve in water but dissolves in organic solvents,
  and is an essential structural part of living cells, together with proteins and carbohydrates.
scope: '''Lipide'' and ''lipoid'' are other names for this same broad class, not one narrower kind such
  as a fat or a wax.'
examples:
- Lipids do not dissolve in water but do dissolve in organic solvents.
- Proteins, carbohydrates and lipids are essential structural parts of living cells.
