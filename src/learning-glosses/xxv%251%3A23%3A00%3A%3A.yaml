simpleMeaning: The number that comes from adding twenty-four and one.
scope: Also called 25 and twenty-five; the number after twenty-four, not twenty-four and not twenty-six.
examples:
- XXV in Roman numerals means twenty-five.
- There were XXV chairs in the hall.
