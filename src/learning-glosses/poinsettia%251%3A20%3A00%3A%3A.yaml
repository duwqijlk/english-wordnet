simpleMeaning: A plant of warm America with poisonous milky sap and bright, tapering, usually deep-red
  leaves like petals round small yellow flowers.
scope: Also called a lobster plant or a painted leaf, this is a plant of warm America with poisonous milky
  sap and bright, petal-like leaves.
examples:
- A poinsettia stood by the door, its red leaves bright against the green.
- She watered the poinsettia and kept it away from the cat.
