simpleMeaning: a stringed instrument that you play by plucking, with a pear-shaped body, a neck that is
  often bent, and a flat part under the strings with raised strips
scope: A plucked stringed instrument with a pear-shaped body and a neck that is often bent, not a violin
  played with a bow and not a guitar.
examples:
- He played a soft tune on the lute.
- The lute hung on the wall beside the harp.
