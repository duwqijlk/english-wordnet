simpleMeaning: an animal whose body is covered, in whole or in part, by thin plates of horn-like material,
  as in some fish and reptiles
scope: 'Also called scaled: having the body covered with thin plates, not skin that is rough to the touch.'
examples:
- The scaly skin of the lizard felt dry and hard.
- Most fish have scaly bodies that shine in the sun.
