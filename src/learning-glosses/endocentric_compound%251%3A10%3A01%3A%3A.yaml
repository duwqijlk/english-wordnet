simpleMeaning: a word made of two parts that works in a sentence in the same way as one of its parts
scope: A word made of two parts that works in a sentence just as one of its parts does, not a word made
  of two parts that works in a different way and not a word that cannot be split into parts.
examples:
- '''Greenhouse'' is an endocentric compound because it works as a noun, just like ''house''.'
- The teacher showed how the endocentric compound 'blackbird' works like the word 'bird' in a sentence.
