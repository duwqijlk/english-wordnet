simpleMeaning: to spread outward and move loosely, as if the wind were carrying it
scope: This is the verb for hair, a flag or cloth spreading and moving loosely, not the verb for flowing
  freely like water and not the noun for a steady flow of liquid.
examples:
- Her hair streamed out behind her as she rode.
- The flags streamed in the wind above the square.
