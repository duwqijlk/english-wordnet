senseId: 'verbalisation%1:10:01::'
synsetId: 07095235-n
simpleMeaning: the words that are said when someone turns thoughts into speech
scope: The words said when thoughts are put into speech, and verbalization is another name for this sense;
  not the act of speaking itself.
examples:
- The verbalisation of her thoughts took a long time.
- His verbalisation was clear and easy to follow.
