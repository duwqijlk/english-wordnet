simpleMeaning: To move on in a broken, uneven stream and make a bubbling noise as it goes
scope: This is a flow moving in a broken stream with a bubbling sound; bubble, ripple, gurgle and babble
  are other names for this sense, and it is not a steady flow or a loud rush.
examples:
- The burble of the brook filled the quiet valley.
- We sat and listened to the stream burble over the stones.
