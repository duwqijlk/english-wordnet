simpleMeaning: having too few workers or helpers for the work that must be done
scope: 'Also called undermanned: this is about a workplace or team having too few workers, not about a
  place having few people in it in general.'
examples:
- The hospital was understaffed, so the nurses had to work long hours.
- Our small office is understaffed at the busiest times of the year.
