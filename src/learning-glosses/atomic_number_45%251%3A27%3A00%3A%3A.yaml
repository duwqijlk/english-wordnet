simpleMeaning: A white hard metal, one of the platinum group, found in platinum ores; used in mixes with
  platinum.
scope: Also called Rh and rhodium; a white hard metal of the platinum group, not a white soft metal of
  the same group.
examples:
- Atomic number 45 is a white hard metal of the platinum group.
- The ring was made with atomic number 45 mixed with platinum.
