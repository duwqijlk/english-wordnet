simpleMeaning: The way gases spread out to fill the whole of the space that holds them.
scope: The way gases spread out to fill the space that holds them; not the way a liquid fills a space
  and not the way a solid keeps its shape.
examples:
- Expandability lets a gas fill any container.
- Because of expandability, the gas spread through the whole room.
