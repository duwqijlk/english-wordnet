simpleMeaning: A part that opens and shuts to let a liquid or gas in, and to hold back how much gets in
scope: A part that opens and shuts to let a liquid or gas in, and to hold back how much gets in; not the
  part that lets it out and not a pipe with no moving part.
examples:
- The intake valve stuck shut, so no fuel reached the engine.
- A worn intake valve let too much air into the chamber.
