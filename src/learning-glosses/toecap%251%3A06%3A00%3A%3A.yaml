simpleMeaning: A boot or shoe gets a hard cover of leather or steel on its front end, making it stronger
  or prettier.
scope: Among covers for shoes, this is the hard leather or steel one that guards the front end of a boot
  or shoe.
examples:
- The toecap on the boot was made of steel.
- The toecap made the shoe look prettier.
