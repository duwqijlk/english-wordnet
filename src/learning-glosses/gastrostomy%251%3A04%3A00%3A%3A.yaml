simpleMeaning: An operation that makes an opening through the wall of the belly into the stomach, as for
  feeding through a tube.
scope: This is an operation that makes an opening through the wall of the belly into the stomach, not
  one that joins the stomach to the gut and not one that takes out part of the stomach.
examples:
- She had a gastrostomy so food could go straight into her stomach.
- The gastrostomy tube stayed in place for weeks.
