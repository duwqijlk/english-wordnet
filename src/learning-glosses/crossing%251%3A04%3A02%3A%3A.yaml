simpleMeaning: In genetics, the act of joining two different kinds or sorts of animals or plants so their
  young are a mix of both
scope: 'Also called cross: joining animals or plants in genetics to make mixed young, not a place where
  paths meet and not a place where roads meet.'
examples:
- The breeder planned a crossing between two kinds of rose.
- The crossing of the two kinds of wheat gave a new plant that grew well.
