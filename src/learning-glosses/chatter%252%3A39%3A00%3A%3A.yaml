senseId: 'chatter%2:39:00::'
synsetId: 02190307-v
simpleMeaning: to make short sharp sounds again and again, when you can not stop them
scope: Also called click, this is making short sharp sounds again and again, not fast talk about small
  things and not the high noise made by birds or monkeys.
examples:
- Her teeth chattered all night in the cold, and she could not make them stop.
- The old machine chattered as it shook, making short sharp sounds again and again.
