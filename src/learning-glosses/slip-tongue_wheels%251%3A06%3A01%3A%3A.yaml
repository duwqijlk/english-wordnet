simpleMeaning: Hanging tongs between its rollers lifted one end of a felled tree off the ground on this
  timber-dragging machine of the 1800s and early 1900s.
scope: 'Also called slip-tongue log skidder and slip tongue log skidder: a timber-dragging machine of
  the 1800s and early 1900s with hanging tongs between its rollers.'
examples:
- The slip-tongue wheels lifted the end of the log off the ground.
- The slip-tongue wheels were used in the early 1900s.
