simpleMeaning: A shell kept as stone, split inside into small rooms and coiled round in a spiral, left
  by a long-dead soft-bodied animal.
scope: This shell kept as stone is also called ammonoid, and it comes from a long-dead animal, not a living
  one.
examples:
- The ammonite in the rock showed a spiral split into small rooms.
- Turning the ammonite over showed the small rooms inside.
