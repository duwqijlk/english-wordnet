simpleMeaning: Violet-purple hairs cover the fine soft leaves of this leafy growth from Java, grown for
  the look of its leaves.
scope: Also called purple velvet plant and royal velvet plant, this is the Javanese kind grown for soft
  leaves with violet-purple hairs, not the mullein kind of the same name with woolly leaves and spikes
  of yellow, white, or purplish flowers.
examples:
- The soft leaves of the velvet plant were covered in violet-purple hairs.
- People grow the velvet plant for its fine soft leaves.
