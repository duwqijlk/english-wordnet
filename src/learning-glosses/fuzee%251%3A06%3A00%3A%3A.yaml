senseId: 'fuzee%1:06:00::'
synsetId: 03412032-n
simpleMeaning: a part that starts a shell or rocket moving by lighting the stuff inside that burns to
  push it
scope: 'Also called a fuse, a fusee, a fuze, a primer and a priming: a part that starts the burning of
  the stuff that pushes a shell or rocket, not the burning stuff itself and not the colored flare used
  as a warning signal.'
examples:
- The soldier fitted a new fuzee to the shell.
- The fuzee failed, so the propellant never caught fire.
