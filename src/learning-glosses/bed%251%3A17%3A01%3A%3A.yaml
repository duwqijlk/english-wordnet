simpleMeaning: In geology, a layer of rock, most often one built up from sediment.
scope: This is a rock layer studied in geology, not a piece of furniture for sleeping, not a garden plot,
  not the ground beneath a body of water, not a seam of ore or coal thick enough to mine for profit, not
  a single thickness of some material, not the flat surface of a printing press, not the earth or rock
  foundation under a road or railway, and not the verb senses meaning to furnish with a bed, plant in
  a bed, put to bed, have sex with, or get ready for sleep.
examples:
- The cliff face showed a thick bed of sandstone above the shale.
- Geologists sampled the limestone bed for fossils.
