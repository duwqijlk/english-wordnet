simpleMeaning: a thin thread of a nerve that carries signals toward the brain and spine
scope: A thin thread of a nerve that carries signals toward the brain and spine, not the whole nerve and
  not a thread that carries orders out from the brain.
examples:
- The afferent fiber carried the signal from her fingertip to her brain.
- Each afferent fiber ends in the spine or brain.
