simpleMeaning: A powder, one to three spoonfuls of which mixed in a glass of warm water at home makes
  a person bring up what is in the stomach.
scope: A powder, one to three spoonfuls of which mixed in a glass of warm water at home makes a person
  bring up what is in the stomach, not a sauce and not a medicine from a chemist.
examples:
- Dry mustard mixed with warm water was used as a home remedy.
- She stirred dry mustard into a glass of warm water.
