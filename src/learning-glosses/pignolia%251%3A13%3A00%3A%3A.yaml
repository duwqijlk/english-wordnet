simpleMeaning: Above all from some pinons of southwestern North America, though from any of several nut
  pines, come the seeds people eat.
scope: This seed, also called a pine nut or a pinon nut, is eaten from nut pines.
examples:
- The seeds called pignolia come from pinon pines in the southwest.
- We shelled pignolia and ate the seeds.
