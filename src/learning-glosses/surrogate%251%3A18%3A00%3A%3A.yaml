simpleMeaning: a person chosen to speak or act for other people in their place
scope: 'Also called deputy: a person chosen to act for others; not the word for a person who cares for
  a child like a parent but is not a parent by blood or law.'
examples:
- The leader sent a surrogate to speak for him at the talks.
- As his surrogate, she signed the papers for him.
