simpleMeaning: Move along smoothly and without effort, with a broad, flowing motion.
scope: The smooth, gliding kind of movement, not travelling by boat on water and not the cloth that drives
  a boat; sweep is another name for this sense.
examples:
- The eagle sailed in wide circles above the cliffs.
- She sailed across the dance floor in a long red dress.
