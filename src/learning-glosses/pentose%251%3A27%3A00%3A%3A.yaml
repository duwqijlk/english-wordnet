simpleMeaning: Any one-part sweet stuff with five bits of carbon in each tiny piece of it.
scope: Any one-part sweet stuff with five bits of carbon in each tiny piece, not a sweet stuff with six
  bits of carbon and not a sweet stuff made of two parts.
examples:
- Ribose is a pentose found in living cells.
- A pentose has five carbon bits in each tiny piece.
