simpleMeaning: to cover something with a thin coating of a shiny white metal or of a blend of that metal
  with mercury.
scope: This is not about making something change colour, and not about an object made of the metal; it
  is about putting a coating on a surface.
examples:
- The jeweler silvered the pendant to give it a bright finish.
- Workers silvered the back of the mirror so that it would reflect clearly.
