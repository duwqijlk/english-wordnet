simpleMeaning: Church song up to the year 1600 used one of a set of note patterns, which came in time
  from an old Greek pattern.
scope: Also called church mode and ecclesiastical mode, it is one of the old note patterns used in church
  song up to the year 1600.
examples:
- The chant was sung in a medieval mode.
- The medieval mode was heard in the old chant.
