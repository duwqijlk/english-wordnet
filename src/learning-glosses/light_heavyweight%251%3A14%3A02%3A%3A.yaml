simpleMeaning: a fighting weight group between the middleweight group and the group above the top weight
  group
scope: A fighting weight group above the middleweight group and below the group above the top weight group;
  cruiserweight is another name for this sense, not the narrower group that stops at the top weight group.
examples:
- He won the light heavyweight belt in his third pro fight.
- The light heavyweight division sits between middleweight and the class above it.
