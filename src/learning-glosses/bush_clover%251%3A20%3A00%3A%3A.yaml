simpleMeaning: Plants that grow like shrubs or herbs, widely used in the southern United States for hay
  above all, and also to feed farm animals and to make the soil better.
scope: These plants are also called lespedeza, and they are grown in the southern United States for hay,
  feed, and better soil.
examples:
- The bush clover fed the cattle and made the soil better.
- The bush clover will be cut for hay.
