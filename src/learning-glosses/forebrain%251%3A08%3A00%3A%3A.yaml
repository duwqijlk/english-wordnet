simpleMeaning: the front part of the brain, which grows from the front part of the early tube that forms
  the brain
scope: This is the front part of the brain; prosencephalon is another name for it, not the back part of
  the brain or the spinal cord.
examples:
- The forebrain controls thinking and memory.
- Damage to the forebrain can change how a person thinks.
