simpleMeaning: so famous that people tell the story as if it were a legend
scope: Of a real person or deed grown so famous that it has become a legend, not a figure known only from
  old tales.
examples:
- The legendary exploits of the arctic trailblazers are still told today.
- She became a legendary singer in her own lifetime.
