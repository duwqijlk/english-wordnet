simpleMeaning: any skin problem that makes the skin red in a way that is not normal
scope: A skin problem that turns the skin red, not a short-lived rash and not a burn.
examples:
- The erythroderma left large red patches across her arms.
- His erythroderma made his skin red and sore for weeks.
