simpleMeaning: Hardly able to wait, full of eager excitement about what comes next or the like.
scope: Used of a person waiting eagerly to know or see what comes next.
examples:
- They were agog all afternoon, waiting for the next part of the story.
- The children were agog to hear how it ended.
