simpleMeaning: close to the typical, average, or expected level in a set of figures
scope: This describes a value near the average, not the noun for a calculated average, and not the senses
  meaning cruel, poor, stingy, or very good.
examples:
- The mean rainfall in April is about 40 millimetres.
- The mean price of a house here is lower than in the city.
