senseId: 'reversioner%1:18:00::'
synsetId: 10546370-n
simpleMeaning: In law, a person who has the right to take back land or a house when a set use of it ends.
scope: This is a person with a future right to take back land, not a tenant or a person who owns it outright
  now.
examples:
- The reversioner waited for the lease to end.
- As reversioner, she would get the house back one day.
