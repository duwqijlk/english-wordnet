simpleMeaning: In acoustics, the push of a sound wave on a flat face set at a right angle to the way the
  wave moves
scope: In acoustics, this is the push of a sound wave on a flat face set at a right angle to the way the
  wave moves, not the force of still air and not how loud a sound is.
examples:
- The acoustic radiation pressure pushed the thin plate as the sound wave passed.
- They measured the acoustic radiation pressure on the wall facing the speaker.
