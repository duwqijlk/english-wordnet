simpleMeaning: A sunken ocean plant with very long thin leaves, found in great numbers along North Atlantic
  shores
scope: A sunken ocean plant with very long thin leaves, found in great numbers along North Atlantic shores,
  also called eelgrass or grass wrack; not a floating seaweed and not kelp.
examples:
- Sea wrack swayed under the water along the Atlantic coast.
- The bay was thick with sea wrack after the storm.
