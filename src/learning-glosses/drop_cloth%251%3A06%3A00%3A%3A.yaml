simpleMeaning: from above the stage, a curtain comes down and goes back up, often showing the scene behind
  the actors
scope: 'Also called drop and drop curtain: a curtain that comes down from above the stage and goes back
  up, not the cloth laid over furniture while a room is painted.'
examples:
- The drop cloth came down slowly to show a night scene behind the actors.
- They raised the drop cloth back above the stage after the last scene.
