simpleMeaning: A strong sweet drink is made from the juice of the bitter fruit of this wild cherry tree
  of Dalmatia.
scope: 'People also call it a marasca cherry or a maraschino cherry: it is the wild cherry tree of Dalmatia,
  not the fruit itself.'
examples:
- The marasca grew in Dalmatia.
- Juice from the marasca fruit went into the sweet drink.
