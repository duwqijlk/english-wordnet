simpleMeaning: a canvas flap on a tent that can be pulled back to make an entrance.
scope: This is the canvas flap that forms a tent's entrance, not the opening in trousers and not the insect.
examples:
- He tied back the tent fly to let in the morning air.
- She pulled the fly aside and stepped into the tent.
