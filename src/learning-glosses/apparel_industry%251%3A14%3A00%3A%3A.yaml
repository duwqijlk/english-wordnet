simpleMeaning: the people and firms that make and sell clothes in the latest styles
scope: 'Also called the fashion business, the fashion industry, the garment industry and the rag trade:
  the trade that makes and sells fashionable clothes, not the makers of cloth and not a single shop.'
examples:
- The apparel industry hires thousands of workers in the city.
- New styles spread fast through the apparel industry.
