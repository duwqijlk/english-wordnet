simpleMeaning: careful, unhurried thought about a subject, including quiet inner reflection
scope: This is the act of turning a subject over in the mind, not a room, a drawing, or a piece of music.
examples:
- The question deserves serious study before we commit any money.
- Her study of the problem led her to a surprising conclusion.
