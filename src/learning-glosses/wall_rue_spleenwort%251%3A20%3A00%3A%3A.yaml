simpleMeaning: Steep slopes, cliffs, and the sides of buildings across Eurasia and North America are where
  this small fern with fine leaves grows.
scope: Also called wall rue, this small fern with fine leaves grows on steep slopes, cliffs, or the sides
  of buildings across Eurasia and North America.
examples:
- In a crack of the stone wall, wall rue spleenwort grew.
- A patch of wall rue spleenwort covered the steep face of the cliff.
