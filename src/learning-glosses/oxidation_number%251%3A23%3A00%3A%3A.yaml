simpleMeaning: A number that gives the charge an atom, a charged bit, or a group of atoms would seem to
  have; for a plain one it is its true charge.
scope: Oxidation state is another name for this sense, which gives the charge an atom, a charged bit,
  or a group of atoms would seem to have.
examples:
- The oxidation number of hydrogen is +1 and of oxygen is -2.
- She worked out the oxidation number of the atom.
