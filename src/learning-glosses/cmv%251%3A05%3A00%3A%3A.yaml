simpleMeaning: Any of a group of herpes viruses that make surface-lining cells grow bigger and can cause
  harm to babies before birth, and can affect people whose body defences are weak
scope: Any of a group of herpes viruses, also called cytomegalovirus, that make surface-lining cells grow
  bigger, can cause harm to babies before birth, and can affect people whose body defences are weak.
examples:
- Doctors test for CMV in newborn babies.
- CMV can affect people with weak body defences.
