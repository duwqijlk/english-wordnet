simpleMeaning: A plant that floats on water in tropical lands everywhere, forming a round ring of leaves
  shaped like wedges, a common weed in rivers and lakes
scope: Also called pistia, water cabbage, water lettuce and Pistia stratiotes, it is a tropical plant
  that floats on the surface in a ring of wedge-shaped leaves and grows as a weed in rivers and lakes.
examples:
- The Pistia stratoites floated on the river in a ring of wedge-shaped leaves.
- Pistia stratoites is a common weed in the lake.
