simpleMeaning: a brass musical instrument with a bright, clear sound, with a thin tube and a wide flared
  end, played by pressing valves that change the air path
scope: Also called horn; this is the brass instrument itself, not the act of playing it and not the act
  of saying something loudly for all to hear.
examples:
- She plays the trumpet in the school band.
- The trumpet sounded bright and clear over the crowd.
