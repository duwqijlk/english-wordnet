simpleMeaning: a great beauty and fine look that a place or thing has
scope: Great beauty and fine look in a place or thing; splendor is another name for this sense, and it
  is not a noble mind or character, which is another sense of grandeur.
examples:
- The grandeur of the mountains took our breath away.
- They dined in a hall of great grandeur.
