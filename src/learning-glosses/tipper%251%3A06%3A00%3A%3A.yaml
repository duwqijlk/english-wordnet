simpleMeaning: A truck whose load can be emptied without being handled, by lifting the front of its platform
  with air pressure so the load slides off by its own weight.
scope: Also called a dump truck, a dumper, a tip truck, a tipper lorry, or a tipper truck, it is a truck
  whose load is emptied by lifting the front of its platform.
examples:
- The tipper raised its platform and the gravel slid off.
- A tipper delivered a load of sand to the building site.
