simpleMeaning: Any of various North American trees or shrubs with showy white flowers and edible blue-black
  or purplish fruit.
scope: Shadbush, service tree, serviceberry, and shadblow are other names for this North American tree
  or bush with showy white flowers and blue-black or purplish fruit you can eat.
examples:
- The juneberry was covered in white flowers.
- We picked juneberries and ate the dark fruit.
