simpleMeaning: A fine mist of tiny drops is what comes out of this thing when it is filled with a liquid,
  such as perfume
scope: Also called nebulizer, spray, sprayer and atomizer, this turns a liquid into a fine mist, not a
  bottle for pouring and not a pump for water.
examples:
- She used the nebuliser to spray perfume on her wrists.
- The doctor's nebuliser turned the medicine into a fine mist for the child to breathe in.
