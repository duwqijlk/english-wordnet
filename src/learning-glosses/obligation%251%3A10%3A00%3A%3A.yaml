simpleMeaning: an agreement made under the law that says what must be paid or done, and the cost or punishment
  for not doing it
scope: This is an agreement made under the law that sets what must be paid or done and a cost for not
  doing it; not the general feeling of duty and not owing thanks to a person for a favor.
examples:
- Under the agreement, his main obligation was to pay the rent each month.
- The firm failed to meet its legal obligations and had to pay a fine.
