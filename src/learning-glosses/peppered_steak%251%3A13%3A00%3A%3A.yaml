simpleMeaning: Covered with crushed spicy seeds, the thick slice of meat is fried in a pan and served
  with a sauce of brandy and butter.
scope: Also called pepper steak and steak au poivre, it is the thick slice of meat covered with crushed
  spicy seeds, fried in a pan and served with a sauce of brandy and butter.
examples:
- A peppered steak arrived with brandy-and-butter sauce.
- She cut into the peppered steak, fried in a pan.
