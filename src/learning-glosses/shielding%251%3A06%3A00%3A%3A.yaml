simpleMeaning: a wall of lead or concrete that blocks rays given off as atoms break apart
scope: A lead or concrete wall that blocks rays from atoms breaking apart, not a metal mesh that guards
  machines from stray signals and not the act of keeping someone safe from harm.
examples:
- The workers put up shielding to block the rays from the reactor.
- Thick shielding around the machine keeps the rays from getting out.
