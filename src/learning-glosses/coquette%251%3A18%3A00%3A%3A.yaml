synsetId: 09984664-n
simpleMeaning: A tempting woman, working her charms to use men.
scope: This sense is also called a tease, a flirt, a minx, and a vamp, for a tempting woman, working her
  charms to use men, where a tease is a woman who draws men in with her looks and charm, using them for
  her own gain, and a flirt is a woman who draws men in with her sexual charm, using them for her own
  gain, unlike the sense for speaking or acting fondly, with no serious aim.
examples:
- The coquette used her charms on the men.
- Coquettes tempt men and use them.
