simpleMeaning: A branch of maths that works out the biggest and smallest values of sums taken over a fixed
  range.
scope: The maths of the biggest and smallest values of set sums, not the general study of change and not
  the study of chance.
examples:
- The calculus of variations helps engineers find the best shape for a bridge.
- She used the calculus of variations to work out the lowest cost route.
