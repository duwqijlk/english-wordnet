synsetId: 10208897-n
simpleMeaning: a doctor, often one still in early training (an intern), who lives in a hospital and looks
  after patients there, guided by the hospital's medical staff
scope: 'Also called a resident and a house physician: a doctor who lives in a hospital and looks after
  patients there, not a doctor who visits from outside and not a nurse.'
examples:
- The resident physician checked on the patient during the night.
- Our resident physician lives at the hospital and sees patients on the ward.
