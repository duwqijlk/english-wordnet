simpleMeaning: Served with a sauce of brandy and butter, it is a thick slice of meat covered with crushed
  spicy seeds and fried in a pan.
scope: Also called peppered steak and steak au poivre, it is the thick slice of meat covered with crushed
  spicy seeds, fried in a pan and served with a sauce of brandy and butter, not the strips sauteed with
  green peppers and onions.
examples:
- The pepper steak came with a brandy-and-butter sauce.
- He ordered pepper steak fried in a pan.
