simpleMeaning: In the middle of the ear, this small bone sits between the hammer bone and the stirrup
  bone
scope: This is a small bone in the middle of the ear, also called anvil, and not one of the two small
  bones on either side of it.
examples:
- The incus passes sound from the malleus to the stapes.
- Damage to the incus can make hearing worse.
