simpleMeaning: the layer of outer skin just below the hard outer layer, in the skin of the palms and the
  soles of the feet
scope: A layer of outer skin just below the hard outer layer; not the top layer of skin and not the deep
  inner skin.
examples:
- The stratum lucidum is clearest in the skin of the palms.
- Doctors look at the stratum lucidum under the hard outer layer.
