schema: oewn-learning-gloss-v2
senseId: 'dickie%1:06:00::'
synsetId: 03196245-n
simpleMeaning: A piece a man can take off and put on to look like the front of a shirt, usually made stiff
  with starch
scope: A false shirt front worn by a man, not a real shirt and not a tie; shirtfront, dicky and dickey
  are other names for this sense.
examples:
- His dickie showed white above his waistcoat.
- The waiter wore a dickie with his black jacket.
