simpleMeaning: A field and pasture plant in Europe, most of all in the middle United States, with tall
  stems and thin bright green leaves; a main part of lawn seed mixes.
scope: A field and pasture plant with tall stems and thin bright green leaves, a main part of lawn seed
  mixes; also called June grass, Kentucky blue, Kentucky bluegrass, and Kentucy blue grass.
examples:
- Poa pratensis is the Latin name for the grass in our lawn.
- Poa pratensis makes a chief part of lawn seed mixes.
