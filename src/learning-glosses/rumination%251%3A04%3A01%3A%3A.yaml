simpleMeaning: the act of chewing food again after bringing it back up from the stomach, done by animals
  such as cows and sheep
scope: This is an animal chewing food it brought back up from its stomach; it is not long, calm thinking,
  and not a baby bringing up small amounts of food after a feed.
examples:
- Rumination helps cows break down the grass they eat.
- The sheep's rumination went on for a long time after eating.
