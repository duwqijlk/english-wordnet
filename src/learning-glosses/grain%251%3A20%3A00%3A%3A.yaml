simpleMeaning: a dry seed-like part that comes from grasses grown for food, such as wheat, barley, and
  Indian corn
scope: The dry seeds of plants like wheat, not the pattern in wood, not food made from seeds, and not
  a unit of weight.
examples:
- The grain in the field was ready to cut in late summer.
- Wheat grain is stored in large bins after it is cut.
