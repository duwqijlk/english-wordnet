simpleMeaning: A hormone from the front of the pituitary gland that makes egg sacs grow in female mammals
  and switches on the cells in male mammals that make sperm.
scope: Also called follicle-stimulating hormone; a sex-gland hormone, not the growth hormone.
examples:
- FSH levels rise before ovulation.
- The doctor measured his FSH level.
