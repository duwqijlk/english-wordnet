simpleMeaning: so unpleasant that people find it hard to bear, and very strict in what it demands
scope: This is a very unpleasant and strict sense; harsh is another name for this sense. Not a material
  that rubs or wears things down, and not the rubbing that wears a surface away.
examples:
- Her abrasive manner made new workers afraid to ask her questions.
- The abrasive tone of his letters upset everyone in the office.
