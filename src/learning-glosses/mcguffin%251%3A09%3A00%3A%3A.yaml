simpleMeaning: In film, a part of the story that holds the watchers' attention or pushes the story on
scope: In film, a part of the story that holds the watchers' attention or pushes the story on; MacGuffin
  is another name for this sense, and it is not a part of the story that does nothing for the plot.
examples:
- The McGuffin was a key element of Alfred Hitchcock's films.
- The stolen papers were the McGuffin that drove the plot.
