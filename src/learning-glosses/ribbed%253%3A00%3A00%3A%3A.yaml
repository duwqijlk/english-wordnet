simpleMeaning: provided with strips that give support, or made stronger by such strips
scope: This is about strips added to something to give it support or make it stronger; it is not about
  a surface that feels rough with raised lines.
examples:
- The ribbed metal sheet was much stronger than the flat one.
- The boat's ribbed frame kept its shape in rough water.
