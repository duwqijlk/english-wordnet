  and small water-and-land animals.
scope: Also called massasauga rattler, it is a small rattlesnake of wet places, found from the Great Lakes
  to Mexico and feeding on mice and small water-and-land animals.
examples:
- A massasauga lay in the wet grass.
- The massasauga hunts mice in the wet places from the Great Lakes to Mexico.
