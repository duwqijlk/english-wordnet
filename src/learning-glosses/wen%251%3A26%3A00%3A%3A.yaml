simpleMeaning: A common cyst (a closed bag) in the skin, full of sebum (a fatty oil) made by a skin gland
  that has become blocked
scope: A bag of fatty oil in the skin, also called a pilar cyst, a sebaceous cyst, and a steatocystoma;
  it is not a painful infection in the skin.
examples:
- The doctor said the small lump on his head was a wen and did not need treatment.
- She had a wen removed from her back because it kept growing.
