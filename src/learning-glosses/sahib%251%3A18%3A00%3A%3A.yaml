simpleMeaning: in the past, a word of respect used for an important white European in India when it was
  ruled by Britain, put after the name
scope: This is a past word of respect put after a name in India, not a general word for a boss or ruler
  and not a name itself.
examples:
- People in the town called him Walker sahib.
- In old stories from India, a British officer was often called sahib after his name.
