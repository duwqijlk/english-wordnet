simpleMeaning: In the east of North America grows a tree whose top is narrow
scope: Also called big-toothed aspen, bigtooth aspen, bigtoothed aspen, and large-toothed aspen, this
  is a tree whose top is narrow in the east of North America, not a different kind of aspen with a wide
  top.
examples:
- A large tooth aspen grew beside the lake, its narrow top easy to pick out.
- The large tooth aspen is one of the trees of the east of North America.
