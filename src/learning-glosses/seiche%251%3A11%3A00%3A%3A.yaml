simpleMeaning: a wave that moves across the top of a lake or a bay closed off from the sea, made by shifts
  in the air or shaking of the ground
scope: This is a wave on a lake or a bay closed off from the sea, not a wave on the open sea and not a
  tide.
examples:
- After the storm, a seiche moved back and forth across the lake.
- The seiche pushed water against the shore of the landlocked bay.
