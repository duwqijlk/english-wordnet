simpleMeaning: At branch ends, big leaves spread like small parasols on a small tree of the east of North
  America that sheds its leaves each year and bears creamy white flowers.
scope: Also called elk-wood, elkwood, and umbrella magnolia, it is the small tree of eastern North America
  that sheds its leaves each year, unlike the evergreen shrub or small tree of Australia.
examples:
- The umbrella tree in the park loses its leaves each year.
- Creamy white flowers covered the umbrella tree.
