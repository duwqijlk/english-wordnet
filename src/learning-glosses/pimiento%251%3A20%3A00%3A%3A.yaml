scope: Also called paprika, pimento, bell pepper, sweet pepper, or sweet pepper plant, a plant that bears
  large, mild, thick-walled fruits, usually shaped like bells; not the ripe red pepper that is usually
  cooked.
examples:
- Pimiento grew in neat rows in the garden.
- The pimiento plants bore large mild fruits.
