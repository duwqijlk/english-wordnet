simpleMeaning: The number got by working out how fast one quantity changes at one moment as another changes,
  written as df(x)/dx.
scope: Also called derivative, differential, derived function and first derivative; it is the number that
  says how fast one quantity changes as another changes, not the quantity itself.
examples:
- The differential coefficient tells how fast the quantity changes.
- He worked out the differential coefficient of the function.
