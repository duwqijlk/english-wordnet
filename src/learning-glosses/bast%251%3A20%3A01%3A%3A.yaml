simpleMeaning: In botany, the plant tissue that carries food made in the leaves to parts that need it;
  it is made mostly of sieve tubes (thin tubes with small holes)
scope: 'Also called phloem: this is the living tissue that carries food in a plant, not the strong woody
  fibers taken from it.'
examples:
- Bast carries food from the leaves down to the roots of the plant.
- The plant's bast lies just under its outer covering.
