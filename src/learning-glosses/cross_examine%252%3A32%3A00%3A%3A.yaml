simpleMeaning: to ask a witness hard, close questions, or to ask again a witness the other side has already
  asked
scope: To ask a witness close, hard questions, or to ask again a witness the other side has already asked;
  cross question is another name for this sense, and this is not simply asking a person about something
  or putting a witness on the stand for the first time.
examples:
- The lawyer will cross examine the witness tomorrow.
- She was cross examined for two hours about what she had seen.
