simpleMeaning: a worker who helps keep railroad tracks in good shape, as part of a track repair crew
scope: A worker on a railroad repair crew, not a train driver and not a dancer who performs on a stage.
examples:
- The gandy dancer lifted the rail back into place.
- A crew of gandy dancers worked on the track all morning.
