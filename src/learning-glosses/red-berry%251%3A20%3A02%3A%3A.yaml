simpleMeaning: A North American herb living year after year, with leaves set by turns and made of leaflets,
  and sprays of small white flowers, then bright red oval berries that poison.
scope: Also called red baneberry, redberry, and snakeberry, it is a North American herb living year after
  year, with leaves set by turns and made of leaflets, and sprays of small white flowers, then bright
  red oval berries that poison, unlike the sense for a small spiny evergreen shrub of the western United
  States and Mexico with tiny flowers and bright red berries.
examples:
- Red-berry bears bright red oval berries that poison.
- Red-berry flowers are small and white.
