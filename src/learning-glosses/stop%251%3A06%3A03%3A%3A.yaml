simpleMeaning: in music, a knob pulled to alter the tone of an organ's pipes
scope: This is the knob on a pipe organ, not a punctuation mark, not a consonant, not a device that limits
  a camera's aperture, not an obstruction in a pipe, and not the act or event of ending something.
examples:
- The organist pulled out several stops for the final hymn.
- He adjusted a stop to make the pipes sound softer.
