simpleMeaning: to cause a sharp feeling, like a sting or many small pricks
scope: 'This verb is also called prickle: to make the skin feel small sharp pricks. It is not the noun
  for that body feeling, and not the noun for a feeling of fear.'
examples:
- The cold wind made her cheeks tingle.
- The hot sauce made his mouth tingle.
