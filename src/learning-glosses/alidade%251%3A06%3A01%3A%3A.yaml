simpleMeaning: For surveying, the telescope and its fittings sit on the moving top part of a theodolite,
  an instrument for measuring angles
scope: Also called an alidad, this is the telescope and its fittings on the moving top of a theodolite,
  not the part used with a plane table.
examples:
- The alidade swung round as she aimed the telescope at the distant mark.
- The surveyor turned the alidade to sight the far hill.
