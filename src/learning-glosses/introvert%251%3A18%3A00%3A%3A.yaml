simpleMeaning: In psychology, a person who pulls back from meeting people and spends much time lost in
  their own thoughts
scope: A person who pulls back from other people and lives in their own thoughts, not someone who loves
  company.
examples:
- The introvert slipped away from the party to read alone.
- As an introvert, she liked long walks by herself to think.
