simpleMeaning: A crooked plan to get rich works by talking others into buying shares, then selling one's
  own as soon as the price climbs.
scope: It is a crooked plan to make money by pushing share prices up.
examples:
- The pump-and-dump scheme pushed the share price up, and then the planner sold.
- Many people bought shares because of the pump-and-dump scheme, and the planner sold soon after.
