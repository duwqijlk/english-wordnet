simpleMeaning: A picture made by the rays given off by the thing being photographed
scope: This is a picture made by the rays given off by the thing being photographed, not a picture made
  by light and not a picture made by rays sent through the thing.
examples:
- The autoradiograph showed where the rays came from in the sample.
- She made an autoradiograph of the leaf to trace the rays it gave off.
