simpleMeaning: Smooth, flowing beats mark this kind of jazz of the large bands of the 1930s, less involved
  than the jazz that came later.
scope: Swing and jive are other names for it, the jazz of the large bands of the 1930s.
examples:
- The band played swing music from the 1930s all night.
- The radio played swing music with its smooth, flowing beats.
