simpleMeaning: The owners of this company do not have to pay its debts with their own money, as it is
  set up with limited liability.
scope: Also called limited company and Ld., this is a company whose owners do not pay its debts with their
  own money, not a company where owners risk all they own.
examples:
- She set up her business as an Ltd. so her own money was safe from its debts.
- His company became an Ltd. last year.
