simpleMeaning: In psychology, an idea held as true and kept even when the facts show it is not true
scope: 'Delusion is another name for this sense: a wrong idea kept even when the facts show it is not
  true, not a mistake that is put right once the facts are seen.'
examples:
- His psychotic belief that the radio was talking to him stayed even when friends showed him it was not.
- A psychotic belief is kept even when the facts prove it wrong.
