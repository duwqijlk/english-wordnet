simpleMeaning: While people are on the move, thieves rob them or their vehicle, or take over the vehicle
  by force
scope: Also called hijacking, it is robbing people or a vehicle on the move, or taking over a vehicle
  by force, not ordinary theft from a shop and not a car crash.
examples:
- The highjacking of the bus left the passengers shaken.
- Police warned drivers about a highjacking on the road that night.
