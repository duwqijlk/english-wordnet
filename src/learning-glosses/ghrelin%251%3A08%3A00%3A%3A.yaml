simpleMeaning: A hormone made by cells lining the upper stomach that seems to boost appetite and eating,
  and also strongly triggers the release of growth hormone from the pituitary gland.
scope: A hunger hormone from the stomach, not gastrin, which mainly drives acid release.
examples:
- Ghrelin levels rise before meals and fall after eating.
- Scientists study ghrelin as a possible target for weight-loss drugs.
