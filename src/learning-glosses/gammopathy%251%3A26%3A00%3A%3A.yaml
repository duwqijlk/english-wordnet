simpleMeaning: A fault in how the body makes the proteins that fight germs, so those proteins grow far
  too many in the blood
scope: This is a fault in how the body makes the proteins that fight germs, so those proteins grow far
  too many in the blood; not a fault in red blood cells and not a germ itself.
examples:
- Gammopathy means the body makes too many of the proteins that fight germs.
- The blood test showed gammopathy.
