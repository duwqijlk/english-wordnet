simpleMeaning: The creed that reason is the right ground for guiding deeds.
scope: This sense is also called freethinking, for the creed that reason is the right ground for guiding
  deeds, unlike the sense for the godly teaching that human reason, not god-given showing, sets out holy
  truth, and unlike the sense for, in thought-lore, the teaching that knowing comes by ground, with no
  call on trial.
examples:
- Rationalism is the creed that reason is the right ground for guiding deeds.
- Rationalism puts reason first.
