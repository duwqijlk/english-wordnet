senseId: 'contradictoriness%1:24:00::'
synsetId: 13879683-n
simpleMeaning: the way two things cannot both be true at the same time
scope: A clash between two things that cannot both hold; not a small difference and not a choice between
  two good things.
examples:
- The contradictoriness of his two claims left the jury unsure which to believe.
- The contradictoriness in the report made it hard to trust either part.
