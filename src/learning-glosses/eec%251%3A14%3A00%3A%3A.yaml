simpleMeaning: A group of European countries set up after the Second World War to cut trade walls and
  work together.
scope: Also called the Common Market, the European Community, the European Economic Community, the European
  Union, the EC, the EU and Europe; a group of European countries that work together on trade, not a single
  country.
examples:
- The EEC cut trade barriers between its members.
- Britain joined the EEC in 1973.
