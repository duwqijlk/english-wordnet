senseId: 'crenation%1:25:00::'
synsetId: 13897197-n
simpleMeaning: One of a series of rounded bumps or the notches between them along a curving edge, as on
  a leaf, cloth, shell rim or red blood cell shriveled in brine.
scope: 'The botanical and medical sense shared with crenature and crenel: a rounded scallop or the notch
  beside it; not crenel, the gap in a castle battlement.'
examples:
- Under the microscope, the red cell showed crenations along its rim.
- Each crenation on the leaf's edge was soft and rounded.
