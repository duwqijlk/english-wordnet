senseId: 'cosigner%1:18:00::'
synsetId: 09636720-n
simpleMeaning: a person who, with one or more others, puts their name to the same paper, such as a treaty
  or a declaration
scope: One of two or more people who put their names to the same paper; cosignatory is another name for
  this sense, not a person who signs only to back up the main signer's name.
examples:
- Each cosigner put a name to the same treaty as the others.
- The cosigner signed the declaration along with two other leaders.
