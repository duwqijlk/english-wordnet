senseId: 'allegory%1:10:02::'
synsetId: 06893714-n
simpleMeaning: a thing you can see that stands for an idea that you cannot see or touch
scope: 'Also called emblem: a thing you can see that stands for an idea, not a story that stands for an
  idea in a hidden way.'
examples:
- In the picture, the broken chain is an allegory for freedom.
- The dove in the painting is an allegory for peace.
