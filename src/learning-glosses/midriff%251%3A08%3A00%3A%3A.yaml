simpleMeaning: In anatomy, a sheet of muscle that divides the inside of the body between the belly and
  the chest, and helps with breathing
scope: Also called diaphragm, this is the sheet of muscle inside the body between the belly and the chest,
  not the outside middle part of the body.
examples:
- The midriff moves up and down as you breathe.
- Doctors say the midriff is the main muscle used for breathing.
