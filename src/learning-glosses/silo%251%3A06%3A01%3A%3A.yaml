simpleMeaning: an army place under the ground where ballistic missiles (missiles sent high into the air,
  then falling on their target) are kept and can be fired
scope: An army place under the ground for keeping and firing missiles; it is not the tall farm tower used
  to keep food for animals.
examples:
- The missile waited in its silo deep under the ground.
- Guards watched the silo where the army kept a missile ready to fire.
