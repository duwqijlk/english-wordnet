simpleMeaning: In physics, a measure of the field set up by a loop of flowing electric current, like the
  field of a bar with a north and a south pole.
scope: In physics, a measure of the field set up by a loop of flowing current; not the current itself
  and not the field of a single pole.
examples:
- An orbiting electron in an atom has a magnetic dipole moment.
- The coil's magnetic dipole moment tells how strong its field is.
