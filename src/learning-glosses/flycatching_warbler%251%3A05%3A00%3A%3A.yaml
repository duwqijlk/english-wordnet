simpleMeaning: Any of many American wood birds that eat insects they catch while the insects are in the
  air.
scope: Any of many American wood birds that eat insects they catch while the insects are in the air; not
  a bird that eats insects on the ground and not a bird that eats seeds.
examples:
- The flycatching warbler darted out to catch an insect in the air.
- Flycatching warblers feed on insects caught on the wing.
