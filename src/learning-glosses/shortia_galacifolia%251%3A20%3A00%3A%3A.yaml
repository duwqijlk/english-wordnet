simpleMeaning: A plant of the south-east of the United States with single white flowers shaped like funnels
  and flushed with pink, and large shiny green leaves that turn bronze-red in autumn
scope: Also called oconee bells; a plant of the south-east United States with single white funnel-shaped
  flowers flushed with pink, its near kin being other woodland flowers of the south-east such as the trailing
  arbutus and the galax.
examples:
- We found Shortia galacifolia in flower under the trees.
- The leaves of Shortia galacifolia turn bronze-red in autumn.
