simpleMeaning: A very hard mix of cobalt and chromium, mostly cobalt, used to make cutting tools and for
  surfaces that wear down fast
scope: One of the hard alloys used for cutting tools and surfaces that take heavy wear, set apart by its
  cobalt base and its hardness.
examples:
- The blade was tipped with Stellite to keep its edge.
- Stellite coats the parts that rub together and wear down fast.
