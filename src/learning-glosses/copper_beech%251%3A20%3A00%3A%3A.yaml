simpleMeaning: a kind of European tree with shiny purple or reddish-brown leaves
scope: A kind of European tree with shiny purple or reddish-brown leaves; purple beech is another name
  for this sense, not the common green-leaved tree, and not any other tree with red leaves.
examples:
- The copper beech in the park turns deep purple in spring.
- We sat under the copper beech while the leaves shone in the sun.
