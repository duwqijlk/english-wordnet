simpleMeaning: a plant that lives many years but is grown for one year, in many kinds, for its long pointed
  orange roots people eat; it grows in mild and hot places
scope: This is the whole plant grown for its roots, not just the orange root as food and not a promised
  reward used to make someone act.
examples:
- The carrot is grown in many gardens for its sweet orange roots.
- Farmers plant carrots in spring and pull them up later in the year.
