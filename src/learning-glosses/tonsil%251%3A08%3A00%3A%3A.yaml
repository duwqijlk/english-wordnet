simpleMeaning: one of two masses of lymph tissue (soft body material that helps fight sickness), one on
  each side of the throat at the back of the mouth
scope: 'Also called faucial tonsil and palatine tonsil: one of two masses at the back of the mouth, not
  the pair taken as a single thing.'
examples:
- Her left tonsil was swollen and sore.
- The doctor looked at his right tonsil with a small light.
