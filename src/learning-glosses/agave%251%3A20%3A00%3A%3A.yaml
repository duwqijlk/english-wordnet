simpleMeaning: A tropical American plant with a rosette of fibrous, sword-shaped leaves at its base and
  flowers on tall spikes; some kinds are grown as ornamentals or for fiber.
scope: Another name for the same plant called century plant; not a cactus or an aloe.
examples:
- Agave grows on dry, rocky hillsides in Mexico.
- Gardeners plant agave for its bold, sword-shaped leaves.
