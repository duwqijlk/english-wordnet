simpleMeaning: The field of engineering that uses computers and message links to find, keep and send facts.
scope: The field of engineering that uses computers and message links to find, keep and send facts; not
  the science of how computers are built, and not the work of using one computer.
examples:
- She works in information technology, setting up computer systems.
- Information technology helps firms store and send facts.
