simpleMeaning: A first practice of a play, done without much care, where the actors read their lines from
  the script and do their moves as told
scope: A first practice of a play, done without much care, with lines read from the script; not a full
  show and not a dress rehearsal.
examples:
- The cast did a walk-through of the play on Monday.
- In the walk-through, the actors read from the script and moved as told.
