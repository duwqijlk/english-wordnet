simpleMeaning: the set of colours that mark the work of one painter, one picture or one school of art
scope: 'Pallet is another name for this sense: the set of colours that mark one painter''s work, not the
  board a painter mixes paint on and not a plate of armour.'
examples:
- Her palette of soft blues and greens marks all her later paintings.
- The painter's palette of warm reds and golds runs through all his later work.
