simpleMeaning: words used to avoid answering a question, in a clever way that tricks people
scope: This is words that avoid a question in a clever, tricky way, also called scheme and dodging; it
  is not the verb sense of avoiding a duty or a question, and not a detailed plan made to trick people.
examples:
- His short answer was just a dodge, not a true reply.
- She saw through the dodge and asked the question again.
