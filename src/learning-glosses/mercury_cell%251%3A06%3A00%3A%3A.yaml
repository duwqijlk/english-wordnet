simpleMeaning: A liquid made of potash sits between a zinc end and an end of a silver metal joined with
  oxygen; the cell makes power and cannot be charged again
scope: A cell that makes power and cannot be charged again, not a cell that you charge and use again.
examples:
- The old camera ran on a mercury cell.
- He took the dead mercury cell out of the hearing aid.
