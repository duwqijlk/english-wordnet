simpleMeaning: to talk fast about small, unimportant things, and to keep on talking without a break
scope: 'Also called chatter, clack, prattle, gibber, gabble, blabber, blab, piffle, prate, twaddle, palaver,
  and maunder: this is fast, endless talk about small things, not telling a secret.'
examples:
- He tattled for an hour about the weather and his shoes, never pausing for breath.
- They sat in the corner tattling about dresses and parties.
