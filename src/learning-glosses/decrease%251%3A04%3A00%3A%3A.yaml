simpleMeaning: The act of making something less.
scope: Also called a reduction, this is the act of making a thing less, not a thing getting less on its
  own and not the amount by which a thing gets less.
examples:
- A decrease in sales worried the shop owners.
- The decrease in rain left the fields dry.
