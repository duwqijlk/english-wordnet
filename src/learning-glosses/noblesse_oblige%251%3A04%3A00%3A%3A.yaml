simpleMeaning: People of high rank have a duty to act with honour and give freely
scope: The duty that comes with high rank to act with honour and give freely; not a law that forces it,
  and not mere good manners.
examples:
- The old lord took noblesse oblige seriously and gave money to the village school.
- She felt noblesse oblige when she used her wealth to help the poor.
