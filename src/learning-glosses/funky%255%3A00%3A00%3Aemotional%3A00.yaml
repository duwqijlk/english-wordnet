simpleMeaning: In jazz, having the deep feeling of early blues, an old kind of music that shows strong
  feelings about life
scope: In jazz, this means music with the deep feeling of early blues, not jazz that is light or has no
  such feeling.
examples:
- The band played a funky jazz song with a deep blues feel.
- She loves funky jazz that sounds like early blues.
