simpleMeaning: The path, usually a circle, that a plane keeps to while it waits for leave to land.
scope: The path, usually a circle, that a plane keeps to while waiting for leave to land, not the landing
  run itself and not a take-off climb.
examples:
- The plane circled in a holding pattern above the airport.
- Air traffic control kept us in a holding pattern for twenty minutes.
