simpleMeaning: In astrology, any of the twelve equal sections into which the zodiac is divided.
scope: This is one of the twelve divisions of the zodiac, not a building people live in, not a family
  line, not a theater audience, not a law-making assembly, and not a children's game of pretending to
  be a family.
examples:
- In her birth chart, the sun falls in the seventh house.
- Each house of the zodiac governs a different area of life.
