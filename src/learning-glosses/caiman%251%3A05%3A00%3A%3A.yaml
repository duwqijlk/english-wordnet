simpleMeaning: A reptile of Central and South America that lives partly in water and partly on land, like
  an alligator but with a belly covered in thicker hard plates.
scope: Also called cayman, this is a reptile of Central and South America that lives partly in water and
  looks like an alligator, not an alligator itself.
examples:
- A caiman floated in the river.
- The caiman lay still on the bank.
