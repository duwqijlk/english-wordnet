simpleMeaning: Carrying the type of electric charge that is the opposite of the negative kind.
scope: This describes the sign of an electric charge, not optimism, firm confidence, an imposed rule,
  or a direction of increase.
examples:
- Protons carry a positive charge, while electrons carry the opposite one.
- The glass rod became positively charged after being rubbed with silk.
