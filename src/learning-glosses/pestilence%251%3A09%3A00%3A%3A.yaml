simpleMeaning: a bad influence that does great harm and is hard to get rid of
scope: This is a bad influence that does great harm and is hard to get rid of, also called canker. It
  is not a sickness in the body, and not a small or short problem that is easy to fix.
examples:
- Racism is a pestilence that harms the whole country.
- He said hate was a pestilence in their town, and it was hard to end.
