simpleMeaning: the quality of a person who holds back from things they want, especially from alcohol
scope: This is the personal quality of holding back, especially from alcohol, not the act or practice
  sense that names doing it.
examples:
- Her lifelong abstinence from alcohol was well known to her friends.
- His abstinence showed in the way he never touched a drink.
