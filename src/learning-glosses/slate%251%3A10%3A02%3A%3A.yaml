simpleMeaning: The names of the people that one political party puts forward to stand in an election for
  public jobs
scope: 'Also called ticket: a list of people a party chooses for an election, not the dark rock, not a
  board for writing, and not thin rock used on roofs.'
examples:
- The party put forward a full slate of candidates for the city election.
- Her name was added to the slate for the school board vote.
