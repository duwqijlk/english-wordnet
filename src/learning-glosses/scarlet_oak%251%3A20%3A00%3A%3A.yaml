simpleMeaning: a medium-large tree of eastern America and southern Canada that sheds its leaves, with
  a thick trunk, close-grained wood, and deeply seven-lobed leaves turning scarlet in autumn
scope: A tree that loses its leaves, with seven-lobed leaves that turn scarlet in autumn; not an evergreen
  and not a maple.
examples:
- The scarlet oak in our yard turns bright red every autumn.
- They cut scarlet oak for its close-grained wood.
