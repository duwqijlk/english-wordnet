simpleMeaning: A tall woody plant grown for wood in central and southern Europe, with an even crown and
  grey bark.
scope: This is a tall woody plant grown for wood in central and southern Europe, with an even crown and
  grey bark, also called Abies alba or the European silver fir; it is the European timber tree, not the
  fir of western North America and not the decorated tree in a house.
examples:
- A Christmas tree grew in the forest of central Europe, its crown even and its bark grey.
- The Christmas tree in the park was planted for its timber.
