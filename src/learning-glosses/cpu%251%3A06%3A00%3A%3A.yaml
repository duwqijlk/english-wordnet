simpleMeaning: In computer science, this chip does most of the work with data in a computer
scope: Also called processor, mainframe, central processing unit, central processor, and C.P.U., this
  is the chip in a computer that does most of the work with data, not the memory and not another part
  of the machine.
examples:
- The CPU does most of the work with data in this computer.
- A faster CPU makes the whole computer run better.
