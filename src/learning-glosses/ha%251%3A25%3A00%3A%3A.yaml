simpleMeaning: In astronomy, a measure of a point in the sky west on a line around its middle from top
  crossing, for a viewer at a place and time of day
scope: In astronomy, this is a measure of a point in the sky counted west on a line around the sky's middle,
  not a measure of how high a star stands above the horizon or how far away it is, and it is also called
  hour angle.
examples:
- The HA of the star was 3 hours.
- Astronomers measured the HA from the zenith crossing.
