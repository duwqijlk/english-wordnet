simpleMeaning: a piece of music where one tune is sung or played, and then other parts copy that same
  tune in the exact same way
scope: This is a piece of music where parts copy the same tune, not a church priest, not a set of rules,
  and not a list of holy books.
examples:
- The singers performed a canon, with each voice copying the tune that came before it.
- In this canon, the piano plays the tune first and the violins copy it exactly.
