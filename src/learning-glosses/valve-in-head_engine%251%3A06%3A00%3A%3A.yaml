synsetId: 04527023-n
simpleMeaning: a motor that burns fuel inside it, with doors in its top part that let air in and let burnt
  gas out
scope: A motor that burns fuel inside it, with its air-in and air-out doors in the top part, not a motor
  with the doors in the side and not a motor that burns fuel outside it.
examples:
- The valve-in-head engine in the old car had both sets of valves in the top.
- His valve-in-head engine ran well after the top was cleaned.
