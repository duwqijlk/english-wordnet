simpleMeaning: Money spent to make sure the other side keeps the terms of a deal, often taking action
  through the courts if it does not
scope: The money spent to make sure the other side keeps a deal, with court action if it does not; not
  the money spent to make the deal, and not a fine for breaking it.
examples:
- The policing and enforcement cost of the deal was high.
- They added the policing and enforcement cost to the budget.
