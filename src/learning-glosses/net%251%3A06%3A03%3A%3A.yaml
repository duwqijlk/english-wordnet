simpleMeaning: A long band of mesh stretched across a tennis or badminton court to split the playing area
  in two.
scope: The band stretched across a tennis or badminton court, not the goal used in soccer or hockey and
  not the woven material itself.
examples:
- Her serve clipped the top of the net and dropped over.
- The shuttlecock cleared the net and landed just inside the line.
