simpleMeaning: so cruel and violent that it shocks people
scope: 'Also called monstrous and grievous: very cruel and violent in a way that shocks people, not just
  very bad or poor in quality.'
examples:
- Murder is an atrocious crime that shocks everyone.
- They spoke of the atrocious attacks on people who could not fight back.
