simpleMeaning: Blood from the top of the stomach gathers into this tube, which passes through the small
  fold beside the stomach on its way to the liver.
scope: 'Also called the left gastric vein: blood from the top of the stomach gathers into this tube, which
  passes through the small fold beside the stomach on its way to the liver.'
examples:
- The vena gastrica sinistra runs in the lesser omentum.
- The vena gastrica sinistra empties into the portal vein.
