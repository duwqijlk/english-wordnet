simpleMeaning: a planned spread of mean tales meant to make people think badly of a person standing for
  office
scope: A planned spread of mean tales meant to harm a person standing for office, not open criticism in
  public and not a single careless remark.
examples:
- A whispering campaign spread mean tales about the mayor before the vote.
- The whispering campaign ruined her good name without a single open charge.
