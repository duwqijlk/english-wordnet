simpleMeaning: A dental tool that holds discs, cups or cutting bits, used to prepare a tooth for a repair
  or to shape, clean or polish a tooth or repair.
scope: The held tool that grips the rotating disc, cup or bit, not the bit itself; it works both on teeth
  and on an existing repair.
examples:
- The dentist changed the bur in the dental handpiece before polishing the filling.
- A dental handpiece whirred as she cleaned the plaque from my back teeth.
