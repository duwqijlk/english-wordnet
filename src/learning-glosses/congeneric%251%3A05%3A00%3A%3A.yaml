simpleMeaning: an animal or plant joined by kinship to another, because they have the same line of birth
  or are members of the same group of living things
scope: This is an animal or plant kin to another through shared birth or shared group; congenator, congener
  and relative are other names for this sense, and it is not a chemical in wine or liquor.
examples:
- The congeneric was found in the same group of living things as the common weed.
- A congeneric of the orchid grows wild on the hillside.
