simpleMeaning: A flat wire pin with two thin parts that press tightly together, used to hold short straight
  strands in place.
scope: A flat wire pin with two thin parts that press tightly together, used to hold short straight strands
  in place; grip and bobby pin are other names for it, not a foam used to style the strands on a person's
  head and not an electric tool that bends the strands into waves.
examples:
- She fixed her hairgrip in her bobbed hair to hold it in place.
- In Britain, a hairgrip is what they call a bobby pin.
