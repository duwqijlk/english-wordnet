synsetId: 06564461-n
simpleMeaning: In law, the view that most of the judges on a court share, and the one most people mean
  when they speak of the court's view.
scope: In law, the view that most of the judges on a court share, not the view of one judge and not the
  court's ruling itself.
examples:
- The majority opinion was read aloud in court.
- A majority opinion needs most of the judges to agree.
