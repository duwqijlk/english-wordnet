simpleMeaning: A way to look inside body organs with X rays and a computer, which builds a set of thin
  crosswise pictures along one line.
scope: A body scan, also called computed axial tomography, computed tomography, computerized axial tomography,
  computerized tomography, or CT; not a small pet animal, and not any other test.
examples:
- The CAT scan showed the tumor.
- Doctors use a CAT to look inside the body.
