simpleMeaning: a substance made inside the body that has an effect on how the body works, especially one
  whose kind is not known
scope: 'Also called autocoid: a substance made inside the body that acts on the body, not a drug taken
  from outside and not a fluid that leaves the body.'
examples:
- The autacoid was released into the blood and changed how the heart beat.
- Doctors study each autacoid to learn what it does in the body.
