simpleMeaning: how well a material lets electricity pass through it, worked out as one divided by how
  much the material holds electricity back
scope: This is how easily electricity passes through a material; it is not how much the material holds
  electricity back.
examples:
- Copper has a high conductance, so wires are often made of it.
- The conductance of the wire was measured in the lab.
