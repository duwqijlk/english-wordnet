simpleMeaning: Going onto someone else's property without right, meaning to commit a crime there.
scope: Going onto someone else's property without right, meaning to commit a crime there, not mere trespass
  with no criminal aim; break-in and breaking and entering are other names for this sense.
examples:
- He was charged with housebreaking after forcing the back door.
- Housebreaking is a crime even if nothing is stolen.
