simpleMeaning: Steam boilers and other closed tanks carry this tap, which opens on its own to let out
  steam once the push inside gets too strong.
scope: This tap is also called escape, escape cock, relief valve, and safety valve.
examples:
- The escape valve on the boiler opened with a hiss.
- A new escape valve was fitted to the tank.
