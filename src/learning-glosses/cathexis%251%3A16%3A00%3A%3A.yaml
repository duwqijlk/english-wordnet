senseId: 'cathexis%1:16:00::'
synsetId: 09208509-n
simpleMeaning: In psychoanalysis, the sexual or life energy a person puts into an idea, a person, or a
  thing
scope: 'Also called charge: in psychoanalysis, the sexual or life energy a person puts into an idea, a
  person, or a thing, not a feeling of like or dislike and not a fixed habit.'
examples:
- In his notes, Freud described the cathexis the patient had put into the lost toy.
- Her strong cathexis for the old house showed in how much she talked about it.
