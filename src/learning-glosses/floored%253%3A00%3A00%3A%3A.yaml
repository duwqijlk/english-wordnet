simpleMeaning: having a surface at the bottom of a room or building to walk on
scope: This describes a room or building that has a walking surface at its bottom; it is not about a person
  being knocked to the ground.
examples:
- The old barn was floored with wide wooden boards.
- Their kitchen is floored in stone tiles.
