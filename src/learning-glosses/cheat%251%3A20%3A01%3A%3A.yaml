simpleMeaning: A grass weed that grows for one year and is often found in fields of grain and other farmed
  land, with seeds that people sometimes think are poison
scope: A grass weed, not a person who cheats and not the other grass weed from Europe that grows most
  of all in wheat.
examples:
- Cheat was growing among the wheat in the field.
- The farmer pulled the cheat out of the grainfield.
