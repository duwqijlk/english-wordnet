simpleMeaning: the furniture, machines, curtains, rugs, and other loose things, usually more than one,
  that make a home or other place fit to live in
scope: The furniture, machines, curtains, rugs, and other loose things that make a home or other place
  fit to live in, usually more than one; not the building itself, and not the act of putting things in
  a room.
examples:
- The house came with all its furnishing, even the curtains.
- They sold the furnishing along with the house.
