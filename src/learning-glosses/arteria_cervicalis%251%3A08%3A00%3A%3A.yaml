simpleMeaning: a blood vessel that brings blood to the muscles of the neck
scope: Also called cervical artery; it feeds the muscles of the neck, not the outer layer of the brain
  and not the legs and feet.
examples:
- The arteria cervicalis feeds the muscles that turn the neck.
- The surgeon traced the arteria cervicalis to the neck muscles it supplies.
