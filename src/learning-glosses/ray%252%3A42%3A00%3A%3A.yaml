simpleMeaning: to go out in lines from a center point, or to come in lines towards a center point
scope: 'Also called radiate: to spread out from one point or come in towards one point; not the noun senses
  — not a fish-fin bone, a flower stem, or a line of energy.'
examples:
- Roads ray out from the city center in all directions.
- The cracks rayed out from the point where the stone hit.
