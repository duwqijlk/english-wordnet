simpleMeaning: to get food ready to cook by cutting it open and making it flat
scope: To cut something open and press it flat so it can be cooked, not the sound of something hitting
  hard and wet.
examples:
- Splat the fish open and lay it flat over the fire.
- He splat the chicken flat before grilling it.
