simpleMeaning: one side of a sheet in a book, magazine, newspaper, or letter, or the writing or picture
  on it.
scope: It is not the young helper at a wedding or the act of calling someone; it is the flat side of a
  sheet that you read.
examples:
- She turned the page and kept reading.
- The story was on the first page of the newspaper.
