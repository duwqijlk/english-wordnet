senseId: 'imaginative_comparison%1:24:00::'
synsetId: 13876144-n
simpleMeaning: A likening made in the mind that is put into words as a simile, a metaphor or an allegory.
scope: A likening made in the mind that is put into words as a simile, a metaphor or an allegory, not
  a plain statement of fact and not a likening made only by measuring.
examples:
- The poem's imaginative comparison likened her smile to the dawn.
- An imaginative comparison can make a plain thought feel fresh.
