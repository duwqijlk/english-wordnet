synsetId: 13810902-n
simpleMeaning: In maths, a number from dividing the long side (the hypotenuse) of a right-angled triangle
  by the side next to the angle
scope: This is the maths number for a triangle, not the short unit of time that is one sixtieth of a minute.
examples:
- In this triangle, the sec of the angle is 2.
- We used sec to work out the length of the side.
