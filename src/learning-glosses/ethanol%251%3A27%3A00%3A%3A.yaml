simpleMeaning: The substance in beer, wine and spirits that makes people drunk; also a solvent, fuel and
  medicine ingredient, and a renewable additive to gasoline.
scope: The chemical itself, whatever its source; not a particular drink, and not the strong neutral spirit
  used for blending whisky.
examples:
- Most gasoline in Brazil contains a large share of ethanol.
- The lab used ethanol to clean the glass slides.
