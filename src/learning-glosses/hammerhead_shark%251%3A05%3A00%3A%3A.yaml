simpleMeaning: In warm seas everywhere swims a shark of middle size that bears live young; its wide flat
  front has eyes far apart at its ends, and it can be dangerous.
scope: Also called hammerhead, this is a shark with a wide flat front and eyes set far apart.
examples:
- The hammerhead shark swam slowly past the reef.
- A hammerhead shark can be dangerous to swimmers.
