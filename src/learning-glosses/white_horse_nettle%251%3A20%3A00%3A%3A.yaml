simpleMeaning: A nightshade kin weed of silvery leaves, violet, blue, and white blooms, with round fruit
  setting milk, of mid-United States southward.
scope: This sense is also called prairie berry, purple nightshade, silver-leaved nettle, silver-leaved
  nightshade, silverleaf nightshade, and trompillo.
examples:
- A white horse nettle grew by the fence.
- White horse nettles bear roundish berries.
