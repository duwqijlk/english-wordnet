simpleMeaning: a long piece of writing that puts forward a new idea found by study, usually needed for
  a higher degree
scope: A long piece of writing for a higher degree, not an unproved statement put forward in an argument.
examples:
- She wrote her thesis on the history of the city.
- His thesis took three years of research to finish.
