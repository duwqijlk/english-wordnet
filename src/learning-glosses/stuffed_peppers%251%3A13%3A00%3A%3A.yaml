simpleMeaning: Filled most often with rice and meat, these green pods are boiled briefly in water, then
  baked for a short time.
scope: Unlike raw green pods, these are boiled briefly in water, filled most often with rice and meat,
  and baked for a short time.
examples:
- The stuffed peppers came out of the oven filled with rice and meat.
- The stuffed peppers filled with rice and meat were baked for a short time.
