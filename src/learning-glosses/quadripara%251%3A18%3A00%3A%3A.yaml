senseId: 'quadripara%1:18:00::'
synsetId: 10516958-n
simpleMeaning: In childbirth care, a woman who has given birth to a baby able to live in each of four
  times she was with child
scope: A woman who has had a baby able to live in each of four times she was with child, not a woman who
  has had fewer than four.
examples:
- The quadripara in the next bed had already had three children before this one.
- As a quadripara, she knew what to expect in the delivery room.
