simpleMeaning: A small, sturdy dog breed from Asia with a smooth coat, a tightly curled tail and a wide,
  flat, wrinkled snout.
scope: Another name for the pug-dog; it is not a bulldog or a French bulldog, which have different builds
  and faces.
examples:
- The little pug wagged its tightly curled tail.
- She brushed the pug's smooth coat every morning.
