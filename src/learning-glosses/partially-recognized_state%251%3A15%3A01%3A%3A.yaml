senseId: 'partially-recognized_state%1:15:01::'
synsetId: 84015070-n
simpleMeaning: a land with real control of itself that other lands have not yet agreed to treat as a country
scope: A land that rules itself in fact but is not yet agreed to be a country; disputed state, state with
  limited recognition and unrecognized state are other names for this sense.
examples:
- The partially-recognized state runs its own affairs but lacks wide agreement.
- Few other lands treat the partially-recognized state as a country.
