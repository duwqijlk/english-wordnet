simpleMeaning: To talk idly about people and tell secrets or private matters
scope: To gossip and tell other people's secrets, not to tell the truth in court and not to chat about
  the weather; gossip is another name for this sense.
examples:
- She won't dish the dirt about her friends.
- At lunch they dished the dirt about the new neighbours.
