simpleMeaning: a business that buys and sells shares for other people and takes a fee for bringing a buyer
  and a seller together
scope: This is a business that buys and sells shares for other people; brokerage and brokerage firm are
  other names for this sense. Not a bank and not a shop that sells shares for itself.
examples:
- The securities firm charged a fee for handling the sale of her shares.
- He called his securities firm to buy shares in the company.
