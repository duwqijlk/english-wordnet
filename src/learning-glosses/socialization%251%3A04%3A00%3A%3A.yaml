simpleMeaning: the way a person learns to act like the people around them, taking on their ways and their
  way of life
scope: 'Also called enculturation and socialisation: learning the ways of the group around you. Not setting
  up a system where the state owns land and business, and not meeting people just to be together.'
examples:
- Socialization helps children learn how to act with other people.
- Through socialization, new workers learn the ways of the office.
