simpleMeaning: a barrier built to hold back the flow of water or to keep out the sea
scope: This is the wall that holds back water; it is not the measure of length of ten meters with the
  same name.
examples:
- The new dam held back the river and made a lake behind it.
- Workers built a dam to keep the sea out of the low fields.
