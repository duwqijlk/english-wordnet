simpleMeaning: the clear, colorless, odorless, tasteless liquid made of hydrogen and oxygen at room temperature,
  which freezes into ice below 0°C, boils above 100°C, and is widely used as a solvent
scope: Freezes at 0°C and boils at 100°C; not the old philosophical element.
examples:
- Drink plenty of water.
- Ice is frozen water.
