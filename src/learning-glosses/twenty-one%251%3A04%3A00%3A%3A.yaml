simpleMeaning: a card game for bets where you try to hold cards worth more than the banker's, but no more
  than 21
scope: This is a card game for bets; blackjack and vingt-et-un are other names for this sense, not a game
  of pure luck with no cards and not poker.
examples:
- They played twenty-one late into the night.
- At twenty-one, she stopped at eighteen and hoped the banker would go over.
