simpleMeaning: Hard yellowish wood from a tree of the same name, with a smooth shine, used to make fine
  cupboards and tools.
scope: A hard yellowish wood with a smooth shine, used for fine cupboards; not the wood of the satin-leaf
  tree and not mahogany, a dark red wood.
examples:
- The box was made of satinwood.
- Satinwood shines like silk when it is polished.
