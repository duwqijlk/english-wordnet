simpleMeaning: A way of building that took its ideas from the building of the Middle Ages and stood against
  the new classical-style revivals in the United States and Great Britain
scope: 'Also called Gothic revival, Gothic revival architecture, and neo-Gothic architecture: a way of
  building that took its ideas from the building of the Middle Ages and stood against the new classical
  style, not the building of the Middle Ages itself.'
examples:
- The chapel was built in the neo-Gothic style, with tall pointed windows.
- Neo-Gothic halls rose across the town in the 1800s.
