simpleMeaning: To make the force inside a thing or on a thing stronger
scope: To raise the pressure in or on a thing, also called pressurize; not to lower the pressure and not
  simply to keep it steady.
examples:
- The captain will pressurise the cabin for the passengers' comfort.
- The crew had to pressurise the tank before the test.
