simpleMeaning: To bring into straits or woe, especially money woe.
scope: This sense is also called distress, for bringing into straits or woe, especially money woe, where
  distress is to bring a person or group into hard times, especially hard times with money.
examples:
- Debts straiten them, bringing them into straits.
- Losses straiten them, bringing money woe.
