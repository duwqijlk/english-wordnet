senseId: 'palpation%1:04:00::'
synsetId: 00144705-n
simpleMeaning: Checking by touch how big a thing is, its shape, how firm it is and where it is; a health
  worker does it to a part of the body
scope: Checking a thing by touch to learn its size, shape, firmness and place; not looking at it with
  the eyes and not a test done with a machine.
examples:
- The doctor used palpation to feel the size of the lump.
- Palpation of the belly showed the liver was swollen.
