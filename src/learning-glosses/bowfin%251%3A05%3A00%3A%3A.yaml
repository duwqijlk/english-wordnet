simpleMeaning: an old kind of long fresh-water fish that eats flesh, with a very long fin on its back,
  lives in the slow waters of North America
scope: 'Also called dogfish and grindle: a long flesh-eating fresh-water fish of North America, not a
  shark and not a trout.'
examples:
- The bowfin swam slowly through the weedy creek.
- Bowfin live in the slow waters of North America.
