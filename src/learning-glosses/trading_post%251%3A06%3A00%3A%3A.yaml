simpleMeaning: A shop that serves a thinly settled area, most often stocked with many kinds of goods
scope: A shop serving a thinly settled area, most often stocked with many kinds of goods; country store
  and general store are other names for this sense, and not a city shop or a market stall.
examples:
- The trading post sold goods to the settlers.
- They bought supplies at the trading post.
