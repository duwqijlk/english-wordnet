simpleMeaning: a seaweed, one of several kinds, that grows in thick patches under the water in places
  where the sea is not deep
scope: This is a plant that grows in the sea; it is not grass that grows on land.
examples:
- Seagrass grows in shallow water near the shore.
- Young fish hide among the seagrass.
