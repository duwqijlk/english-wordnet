simpleMeaning: a muscle in the body joined to the bone at two points, above all the one that bends the
  arm at the elbow
scope: Any muscle joined to a bone at two points, above all the one at the front of the upper arm that
  bends it, not the muscle at the back that straightens it.
examples:
- He flexed his biceps to show how strong he was.
- The biceps ache after lifting heavy boxes.
