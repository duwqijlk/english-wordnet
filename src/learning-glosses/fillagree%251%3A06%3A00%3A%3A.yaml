simpleMeaning: Delicate work with many small fine parts, often in gold, silver, or other fine twisted
  wire, made to add beauty.
scope: Delicate work with many small fine parts, often in gold, silver, or other fine twisted wire, made
  to add beauty; also called filigree and filagree, not plain metal work with no pattern.
examples:
- The box was edged with fine fillagree in gold.
- She wore a ring of silver fillagree.
