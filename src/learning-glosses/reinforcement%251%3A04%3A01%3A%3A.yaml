simpleMeaning: a military move, often bringing in fresh troops and new supplies, to make an army stronger
  or help it do its job
scope: A military move that brings fresh troops and supplies to make a force stronger, also called support,
  not a reward that shapes behaviour and not new men alone.
examples:
- They called for reinforcement when the front line began to break.
- The reinforcement of fresh troops arrived before dawn.
