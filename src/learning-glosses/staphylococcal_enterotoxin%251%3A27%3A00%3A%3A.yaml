simpleMeaning: a poison that can dissolve in water, made by some kinds of a germ, and a cause of food
  poisoning
scope: A poison made by some kinds of a germ that causes food poisoning, not the germ itself and not food
  poisoning from eating food that has gone bad.
examples:
- The staphylococcal enterotoxin in the cream made several people ill.
- Tests found staphylococcal enterotoxin in the left-over food.
