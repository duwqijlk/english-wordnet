simpleMeaning: In physiology, the normal state in which sour substances and substances that take away
  sourness stay in the right amounts in the body
scope: Also called acid-base balance; this is the normal state in which sour substances and their opposites
  stay in the right amounts, not a test of the blood and not a loss of that state.
examples:
- The acid-base equilibrium in her body kept her blood slightly alkaline.
- After the treatment, his acid-base equilibrium was back to normal.
