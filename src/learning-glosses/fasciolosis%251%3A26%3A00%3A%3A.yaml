senseId: 'fasciolosis%1:26:00::'
synsetId: 14199209-n
simpleMeaning: the liver can be harmed when a small flat worm, the liver fluke, settles in it; the harm
  comes sometimes, and the illness is linked to liver rot
scope: Also called fascioliasis, this is liver harm from a small flat worm, not a wound to the liver and
  not a disease of the gut.
examples:
- The vet treated the flock for fasciolosis.
- Fasciolosis in the herd was linked to liver rot.
