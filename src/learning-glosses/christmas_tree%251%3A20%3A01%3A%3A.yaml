simpleMeaning: A medium to tall fir of western North America, with a cone-shaped top and branches in layers,
  whose leaves smell of orange when crushed.
scope: Also called amabilis fir, red silver fir, white fir, Abies amabilis, and Pacific silver fir; a
  medium to tall fir of western North America with a cone-shaped top, not the decorated evergreen used
  at Christmas.
examples:
- The Christmas tree in the forest has a cone-shaped top.
- A Christmas tree grows in western North America.
