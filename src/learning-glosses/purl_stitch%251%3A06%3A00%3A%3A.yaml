simpleMeaning: A plain way of looping yarn in knitting, made by pushing the needle through the front of
  the loop from the right
scope: A plain knitting loop made by pushing the needle through the front from the right, not a knit loop
  made by pushing the needle through the back; purl is another name for this sense.
examples:
- She learned the purl stitch on her first scarf.
- A row of purl stitch makes a soft ridge in the cloth.
