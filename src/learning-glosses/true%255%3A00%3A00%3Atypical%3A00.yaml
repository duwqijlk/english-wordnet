simpleMeaning: matching every fixed standard that defines what a particular kind of thing is
scope: This means a proper example of its kind, not a statement that is correct or a feeling that is honest.
examples:
- He is a true gentleman, courteous to everyone he meets.
- The little car is a true classic of 1960s design.
