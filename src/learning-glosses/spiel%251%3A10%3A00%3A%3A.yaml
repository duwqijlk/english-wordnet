simpleMeaning: smooth talk that sounds true and is easy to believe, especially useful to a person who
  sells things
scope: 'Also called patter: smooth sales talk that sounds true, not plain honest talk about facts and
  not a short formal speech.'
examples:
- The salesman gave us a long spiel about why this car was the best.
- I did not believe his spiel, even though it sounded smooth and true.
