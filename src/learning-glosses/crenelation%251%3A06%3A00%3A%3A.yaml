senseId: 'crenelation%1:06:00::'
synsetId: 02815071-n
simpleMeaning: A wall built round the top of a castle, with gaps set at even spaces for firing arrows
  or guns.
scope: Also called a battlement or crenellation, a wall round the top of a castle with gaps for firing,
  not the work of building such walls.
examples:
- Archers stood behind the crenelation and fired down.
- The crenelation ran all round the top of the tower.
