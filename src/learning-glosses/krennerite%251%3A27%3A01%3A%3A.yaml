simpleMeaning: A mineral of gold and tellurium with crystals shaped like right-angled blocks, and which
  can hold a fairly small amount of silver inside.
scope: A mineral of gold and tellurium with crystals shaped like right-angled blocks, not calaverite and
  not sylvanite, whose crystals form a different shape.
examples:
- Krennerite was found in the gold mine alongside other telluride minerals.
- The krennerite sample held a small amount of silver.
