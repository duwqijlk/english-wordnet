simpleMeaning: a soft leather like suede (a soft leather with a slightly rough, soft top), once made from
  the skin of an antelope, now made from sheep skin
scope: This soft leather, also called chammy, chammy leather, chamois leather, shammy and shammy leather,
  is a material for cleaning or clothes; it is not the mountain animal itself.
examples:
- He cleaned the car windows with a piece of chamois.
- She used a chamois to dry the wet glass.
