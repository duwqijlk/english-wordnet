simpleMeaning: not giving up or getting tired when following or chasing something, or as if following
  or chasing it
scope: 'Also called dogging: never giving up or tiring in a chase, or seeming to chase; not just lasting
  for a long time in general.'
examples:
- Persisting fears followed him wherever he went.
- A persisting hunter kept after the animal all day without rest.
