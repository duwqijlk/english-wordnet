simpleMeaning: To try hard to be as good as someone, above all by copying what they do.
scope: This is trying to match someone, above all by copying them; not simply doing as well as a rival,
  and not a machine copying how another machine works.
examples:
- He is emulating the skating skills of his older sister.
- Young players emulated the star's way of holding the bat.
