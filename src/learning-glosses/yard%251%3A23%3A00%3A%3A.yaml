simpleMeaning: a standard distance of three feet; the metric definition of 91.44 centimeters fixed it,
  replacing an old estimate based on an ordinary step.
scope: This is a length of three feet, not the volume measure for sand or gravel, the animal pen, or the
  fenced ground used for work.
examples:
- The garden is about twenty yards long and ten wide.
- He stood a few yards away from the edge.
