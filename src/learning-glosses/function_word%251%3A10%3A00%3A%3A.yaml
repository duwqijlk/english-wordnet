synsetId: 06302098-n
simpleMeaning: a small piece of speech that does not change its form and helps show how parts of a sentence
  fit together, but adds little meaning of its own
scope: 'Another name for a closed-class word: a piece of speech that helps a sentence fit together, not
  one with a clear meaning of its own and not one that changes its form.'
examples:
- In the sentence 'the cat sat', 'the' is a function word.
- Function words like 'and' and 'of' hold a sentence together.
