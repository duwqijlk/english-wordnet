simpleMeaning: How fast prices rise or fall over a month or a year, worked out from a list of prices
scope: How fast prices change over a month or a year; not one price going up and not the cost of living.
examples:
- The inflation rate fell to two percent last month.
- A high inflation rate means your money buys less each year.
