simpleMeaning: the act of pulling a load so that it moves along
scope: 'Also called drawing and draft: the act of pulling a load along, not the depth of a ship under
  water and not a drink drawn from a keg.'
examples:
- The draught of the cart up the hill took two strong horses.
- The oxen did the draught of the wagon across the field.
