simpleMeaning: Dressed only halfway, with clothes loose and put on without care.
scope: Only halfway dressed, with clothes loose and careless, not fully dressed and not naked; en deshabille
  is another name for this sense.
examples:
- She came downstairs in dishabille.
- He answered the door in dishabille, his shirt half buttoned.
