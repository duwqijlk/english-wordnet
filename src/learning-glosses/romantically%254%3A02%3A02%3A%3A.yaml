simpleMeaning: in a way that sees things as better than they really are and not as they are in real life
scope: This means seeing things in a too hopeful and not real way, not in a way that shows love.
examples:
- He spoke romantically about a simple life in the country, with no thought of money.
- She dreamed romantically about becoming famous overnight.
