simpleMeaning: to pull people in very strongly, as if a magnet were pulling them
scope: 'Also called bewitch, mesmerize, mesmerise, and spellbind: to pull people in very strongly, not
  to make something able to pull metal as a magnet does.'
examples:
- She magnetized the crowd with her singing.
- He magnetized listeners from the first minute of his talk.
