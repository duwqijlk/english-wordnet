senseId: humpbacked%5:00:00:unfit:01
synsetId: 01022592-s
simpleMeaning: having or showing kyphosis (a health problem where the spine, the bones down the middle
  of the back, bends too much and makes a round back)
scope: Also called humped, hunchbacked, crookback, gibbous, crookbacked and kyphotic. This means a back
  is bent into a round shape by this health problem; it is not just poor sitting or a heavy load on the
  back.
examples:
- The humpbacked old man walked slowly with a stick.
- She treated humpbacked patients whose spines had bent over time.
