simpleMeaning: A woody climbing plant that lives for years, with big decorative seed pods that look like
  balloons; native to the tropics of India, Africa and America.
scope: The climbing plant itself, also called heart pea, not the balloon-shaped pods alone.
examples:
- Balloon vines scramble over fences and walls.
- The balloon vine's pods dry to papery shells.
