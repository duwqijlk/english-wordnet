simpleMeaning: As the main spring unwinds in a clock, this rod with a spiral groove keeps the power steady.
scope: Also called a fusee drive, this grooved rod in a clock is not the flare used as a warning signal.
examples:
- A fusee keeps the power steady in an old clock.
- Without a working fusee, the old clock lost power as its spring unwound.
