simpleMeaning: 'A large roll: a long crusty roll cut open along its length and filled with meat and cheese,
  tomato, onion, lettuce and sauces; its name changes across the United States.'
scope: Also called a hero, a wedge, a sub, a bomber, a submarine, a grinder, a torpedo, a hero sandwich,
  a hoagie, a hoagy, a poor boy, a submarine sandwich, a zep, or an Italian sandwich; a big filled roll
  whose name changes across the United States.
examples:
- We shared a Cuban sandwich, its long crusty roll filled with meat and cheese.
- A Cuban sandwich is called a hoagie in some parts of the United States.
