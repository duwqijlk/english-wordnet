senseId: 'growth_hormone-releasing_factor%1:27:00::'
synsetId: 15048104-n
simpleMeaning: A body chemical that makes a small gland at the base of the brain send out more of the
  body chemical that helps humans grow
scope: This is a body chemical that speeds up the release of the growth chemical; not the growth chemical
  itself and not a body chemical that slows growth.
examples:
- Growth hormone-releasing factor triggers the release of growth hormone.
- The growth hormone-releasing factor acts on the pituitary gland.
