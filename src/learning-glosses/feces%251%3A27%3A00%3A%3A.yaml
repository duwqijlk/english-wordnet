simpleMeaning: solid waste that passes out of the body from the bowels (the long tube inside the body
  that carries food waste out)
scope: 'Also called stool, dejection, and faeces: solid waste from the body, not liquid waste from the
  body and not waste water from a house.'
examples:
- The doctor asked for a small sample of feces for a test.
- Dog feces had been left on the path.
