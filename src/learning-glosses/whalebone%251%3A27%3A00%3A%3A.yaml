simpleMeaning: a hard, horn-like material from the upper jaw of some whales, used for fan ribs or for
  stiff strips in a corset (tight under-clothing)
scope: 'Also called baleen: this is the hard, horn-like material from a whale''s upper jaw, not a true
  bone and not horn from a land animal.'
examples:
- Old fans were made with thin ribs of whalebone.
- The dress stays stiff because of strips of whalebone in the corset.
