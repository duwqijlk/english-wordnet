simpleMeaning: any plant that belongs to one group of closely related plants
scope: This is any plant in that group of related plants; it is not just one flower taken from such a
  plant, and it is not a plant from another group.
examples:
- She planted a hibiscus by the fence and watered it each day.
- A hibiscus in the garden opened a large red flower.
