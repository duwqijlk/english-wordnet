simpleMeaning: the art and skill of printing with small separate pieces that can be moved and set in place
scope: 'Also called composition: this is the art and skill of printing with pieces that can be moved;
  it is not the other typography sense, the craft of putting those pieces together and printing from them.'
examples:
- She studied typography and learned how letters were set for old printed books.
- Good typography makes a printed page clear and easy to read.
