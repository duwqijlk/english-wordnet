simpleMeaning: 'The unit that says how much gold is in a mixture of metals: 18 units means three parts
  gold in four, and 24 units means all gold'
scope: This is the unit that measures how much gold is in a mixture of metals, also called carat and karat,
  not a weight and not a coin.
examples:
- The ring was marked 18 kt, so it was three parts gold.
- Pure gold is 24 kt, with no other metal mixed in.
