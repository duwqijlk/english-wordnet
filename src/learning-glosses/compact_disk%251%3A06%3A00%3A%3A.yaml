simpleMeaning: Smaller than an old record, this round plate keeps its sounds as a code of numbers until
  a beam of light plays them back.
scope: Also called a compact disc, this round plate is smaller than an old record and is read by a beam
  of light.
examples:
- He put the compact disk in the player and the song began.
- She bought a compact disk of her favourite singer.
