simpleMeaning: Said of sounds or voices that are deep, with a pitch near the bottom of the range or a
  slow rate of vibration.
scope: This is not about height, rank or amount; it describes a deep sound or voice.
examples:
- The cello plays the low notes while the violins carry the melody.
- The engine settled into a low rumble as the car climbed the hill.
