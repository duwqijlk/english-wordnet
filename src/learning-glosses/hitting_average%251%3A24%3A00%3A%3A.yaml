simpleMeaning: 'In baseball, a mark of how well a batter does: the count of safe hits split by the count
  of official turns at bat'
scope: In baseball, a mark of a batter's skill, worked out from hits and turns at bat; batting average
  is another name for this sense, not a count of runs and not a fielding mark.
examples:
- His hitting average rose to .320 by the end of the season.
- A hitting average above .300 marks a fine season at the plate.
