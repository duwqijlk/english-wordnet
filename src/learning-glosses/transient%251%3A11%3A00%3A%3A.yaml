simpleMeaning: In physics, a short change in a system that moves back and forth, caused by a sudden change
  in voltage, current, or load
scope: In physics, this is a short change in a system that moves back and forth, caused by a sudden change
  in voltage, current, or load. It is not a person who stays in a place for a short time, and not the
  word for lasting a short time.
examples:
- A sudden transient passed through the machine when the power came back on.
- The man saw a short transient on the screen after the voltage changed.
