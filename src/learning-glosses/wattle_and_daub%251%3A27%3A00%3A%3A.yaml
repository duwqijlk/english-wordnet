simpleMeaning: a building material made of sticks and twigs woven together and then coated with clay
scope: A building material of woven sticks coated with clay, not brick and not plain mud.
examples:
- The old cottage walls were made of wattle and daub.
- Builders used wattle and daub for the walls of the hut.
