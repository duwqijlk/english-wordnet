simpleMeaning: the outer layer of a very young living thing that grows into skin and nerve tissue
scope: The outer layer of a very young living thing, also called ectoblast and exoderm; not the inner
  layer and not the middle layer.
examples:
- The ectoderm forms the skin and the nerves.
- In the early embryo, the ectoderm lies on the outside.
