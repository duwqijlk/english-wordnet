simpleMeaning: to leave a person without the honours, goods, and traits they once had
scope: To leave a person without the honours, goods, or traits they once had, also called deplume, and
  not to take away feathers or clothes.
examples:
- The court displumed the disgraced lord of his titles and lands.
- War displumed the old king, leaving him with neither crown nor wealth.
