simpleMeaning: A grass with straight stiff hairs at the ends of the covers around its flowers
scope: A grass with straight stiff hairs at the ends of the covers around its flowers, not a wheat plant
  and not a soft lawn grass.
examples:
- The bearded wheatgrass had straight stiff hairs at the ends of the covers around its flowers.
- We looked at bearded wheatgrass and saw the stiff hairs on its flower heads.
