simpleMeaning: a liquid fuel made from oil that evaporates quickly, burns easily and is used to power
  car engines.
scope: This is the fuel for engines, not the air-like substance that spreads through a room.
examples:
- We stopped at the gas station to fill up the car.
- The price of gas has gone up again.
