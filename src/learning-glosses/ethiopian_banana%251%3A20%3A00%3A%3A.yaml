simpleMeaning: A large evergreen tree-like plant with huge paddle-shaped leaves and fruit like the yellow
  fruit, inedible though its young flower shoots can be eaten; sometimes put in that fruit's genus.
scope: A big fruit plant, also called Abyssinian banana, Ensete ventricosum and Musa ensete, with inedible
  banana-like fruit and edible young flower shoots.
examples:
- Ethiopian banana grows in the highlands of East Africa.
- Farmers eat the young shoots of Ethiopian banana.
