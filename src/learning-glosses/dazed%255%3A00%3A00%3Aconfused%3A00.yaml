simpleMeaning: unable to think or feel clearly, especially after a shock that leaves the mind numb
scope: 'Also called stupid and stunned: unable to think clearly after a shock, not just slow to react
  from tiredness, drink, or a blow.'
examples:
- After the accident, he sat dazed and could not answer their questions.
- She looked dazed when she heard the sudden bad news.
