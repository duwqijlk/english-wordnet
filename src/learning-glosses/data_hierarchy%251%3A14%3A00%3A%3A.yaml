simpleMeaning: An arrangement of facts in groups and smaller groups, in which every smaller group sits
  below the group it belongs to.
scope: An arrangement of facts in groups and smaller groups by rank; not a list and not a pile of facts.
examples:
- The data hierarchy puts each smaller group below its larger group.
- She drew the data hierarchy as a set of boxes.
