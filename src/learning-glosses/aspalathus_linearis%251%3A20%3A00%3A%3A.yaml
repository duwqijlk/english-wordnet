simpleMeaning: A bush of South Africa with flat leaves that end in a point and yellow flowers; its leaves
  smell sweet when dry and are used to make an herbal tea.
scope: Also called rooibos and Aspalathus cedcarbergensis; a bush of South Africa with flat leaves that
  end in a point and yellow flowers, whose dried leaves make an herbal tea.
examples:
- Aspalathus linearis grows as a bush with flat leaves and yellow flowers.
- The dried leaves of Aspalathus linearis make a sweet-smelling tea.
