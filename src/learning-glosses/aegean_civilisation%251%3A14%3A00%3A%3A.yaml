simpleMeaning: The very old peoples who lived on the islands in the sea east of Greece and in the lands
  around it.
scope: 'Also called Aegean civilization and Aegean culture: the very old peoples on the islands in the
  sea east of Greece and in the lands around it, not the peoples of today and not the sea itself.'
examples:
- Aegean civilisation left fine pots and wall paintings.
- The Aegean civilisation spread across the islands.
