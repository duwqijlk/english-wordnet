simpleMeaning: a green living thing that takes water and food from the rain and the sky around it, often
  growing on another green thing without feeding on it
scope: A green living thing that takes water and food from the rain and sky, often growing on another
  green thing without feeding on it; aerophyte, epiphyte and epiphytic plant are other names for this,
  not a parasite that feeds on its host and not a green thing that grows in soil.
examples:
- The air plant clung to the tree branch, taking water from the rain.
- Air plants need no soil to grow.
