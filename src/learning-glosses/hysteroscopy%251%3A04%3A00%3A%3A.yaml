simpleMeaning: Through the birth canal a thin viewing tube is put in, so the womb and its lining can be
  looked at from inside.
scope: A look inside the womb with a thin tube, not a picture of the womb made with X rays.
examples:
- Her hysteroscopy showed the lining of her womb.
- She had a hysteroscopy to look inside her womb.
