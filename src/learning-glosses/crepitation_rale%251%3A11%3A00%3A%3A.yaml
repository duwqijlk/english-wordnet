simpleMeaning: A crackling sound a doctor hears through the stethoscope when a person with a chest illness
  breathes in, often with tuberculosis, pneumonia or heart failure
scope: A sign heard in the chest, not a normal breath sound; it points to a chest illness or heart trouble.
examples:
- The doctor heard a crepitation rale as the patient breathed in.
- A crepitation rale sounded when she breathed in.
