simpleMeaning: Care for outward things and stuff, over mind and spirit.
scope: This sense is care for outward things and stuff, over mind and spirit, unlike the sense for a care
  for, or answering to, outward things, especially stuff as against ideal thoughts, and unlike the sense
  for the mark of being outside, or turned to the outside.
examples:
- Outwardness cares for outward things and stuff.
- Outwardness puts stuff over mind and spirit.
