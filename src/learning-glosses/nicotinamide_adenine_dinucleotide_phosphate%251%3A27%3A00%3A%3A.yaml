simpleMeaning: A helper substance like the one called NAD, found in most living cells, that hands on tiny
  charged bits in other body processes.
scope: A helper substance like NAD, found in most living cells, that hands on tiny charged bits; not NAD
  itself and not a vitamin.
examples:
- Nicotinamide adenine dinucleotide phosphate helps cells pass on tiny charged bits.
- The cell uses nicotinamide adenine dinucleotide phosphate in other body processes than NAD.
