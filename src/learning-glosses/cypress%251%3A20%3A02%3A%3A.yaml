simpleMeaning: wood from any of several kinds of trees that stay green all year, have dark leaves like
  scales and round cones, especially from the Cupressus group of such trees
scope: This is the wood from the tree, not the living tree itself.
examples:
- The table was made from dark cypress.
- They built the chest from cypress because it does not rot easily.
