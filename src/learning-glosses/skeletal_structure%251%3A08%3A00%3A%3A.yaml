simpleMeaning: Any part of a living thing that is built from its bones
scope: Any part of a living thing that is built from its bones; not a part built from muscle, and not
  a part built from skin.
examples:
- The skeletal structure of the bird was light but strong.
- Each skeletal structure in the body has its own shape.
