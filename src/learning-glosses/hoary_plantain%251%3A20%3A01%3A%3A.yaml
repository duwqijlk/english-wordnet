simpleMeaning: a plant from the Old World that lives for years, now found widely in North America, with
  finely hairy leaves and white sweet-smelling blooms that are hard to see
scope: A plant from the Old World that lives for years and now grows widely in North America, not the
  banana-like fruit called plantain and not a garden flower.
examples:
- The hoary plantain grew along the path, its leaves covered in fine hairs.
- We found hoary plantain with small white blooms that were hard to see.
