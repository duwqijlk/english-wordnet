simpleMeaning: the act of making ground smooth and flat, or nearly flat with only a gentle slope
scope: 'Also called grading: this is making ground smooth and flat, not giving marks to school work and
  not making people or things equal.'
examples:
- The leveling of the field took two days before the builders could start work.
- After the leveling, the ground sloped only a little, so rain ran off slowly.
