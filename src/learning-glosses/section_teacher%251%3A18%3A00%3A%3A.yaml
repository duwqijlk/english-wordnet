simpleMeaning: one of the people who teach the small-group meetings of a big college class
scope: A person who teaches one small part of a big college class; section instructor is another name
  for this job, not a teacher of a whole course and not a school teacher.
examples:
- Our section teacher explained the reading.
- The section teacher marked our essays.
