simpleMeaning: a small leftover hard part of the front or back foot, on either side of the long middle
  part of a horse's leg or a like animal's leg
scope: A small leftover hard part beside the long middle part of a horse's leg; not the main long part
  itself and not a full working foot part.
examples:
- The vet found a break in the splint bone.
- A splint bone lies on each side of the cannon bone.
