simpleMeaning: one of two pairs of folds of the wet lining that stick out into the voice box
scope: One of two pairs of folds of the wet lining in the voice box, also called vocal band, vocal fold
  and plica vocalis; not the throat itself and not the tongue.
examples:
- The singer's vocal cords moved as she held the high note.
- A cold can make the vocal cords swell and the voice go hoarse.
