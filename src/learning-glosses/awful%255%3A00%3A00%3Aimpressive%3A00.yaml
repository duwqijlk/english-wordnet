simpleMeaning: so grand or remarkable that it fills you with wonder and respect
scope: Another name for amazing and awesome; describes the thing that inspires awe, not someone filled
  with awe, the 'very bad' sense or the 'causing fear' sense.
examples:
- The awful vastness of the desert made them feel small.
- Beneath the awful height of the cathedral, she felt humbled.
