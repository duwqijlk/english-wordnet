simpleMeaning: Growing well in a place that is more base than acid, most of all plants that need a pH
  above 7.
scope: Growing well where the ground is more base than acid, most of all plants needing a pH above 7;
  not a plant that likes acid soil and not one that needs wet ground.
examples:
- This alkaline-loving plant does best in chalky soil.
- The alkaline-loving moss spread over the lime-rich bank.
