simpleMeaning: What animals in a lab show about a new drug or a new device put inside the body is the
  proof that a test on people is worth doing.
scope: It is also called a preclinical phase or a preclinical test, and it is done on animals in a lab
  before people are involved.
examples:
- The preclinical trial was run on animals in a lab.
- Before the preclinical trial, no people had tried the drug.
