simpleMeaning: having already made up your mind for or against something, so you cannot judge the facts
  fairly
scope: 'Also called bias: a fixed leaning that stops fair judging, not an act of harming someone because
  of it.'
examples:
- Prejudice kept him from giving the new worker a fair chance.
- She tried to set her prejudice aside and listen.
