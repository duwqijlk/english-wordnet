simpleMeaning: a wall built to hold back water or to keep out the sea
scope: 'Also called dam and dyke: a wall to hold back water or keep out the sea, not the rude slang name
  for a lesbian.'
examples:
- They built a high dike to keep the sea out of the town.
- The dike held the river back during the flood.
