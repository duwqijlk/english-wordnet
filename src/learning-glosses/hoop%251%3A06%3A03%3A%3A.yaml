simpleMeaning: In basketball, the flat round metal ring with a net below it that a player tries to throw
  the ball through.
scope: A flat metal ring set level with a net below it for basketball, also called basket, not a band
  for holding or tying things, not the frame that spreads a skirt, and not the act of fixing one on.
examples:
- He shot the ball through the hoop from far out.
- The hoop shook as the ball dropped through the net.
