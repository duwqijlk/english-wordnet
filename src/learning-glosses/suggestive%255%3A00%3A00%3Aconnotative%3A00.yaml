simpleMeaning: likely to bring an idea to mind, or to hint at it
scope: This hints at an idea or brings it to mind; not the sense that brings rude or improper ideas to
  mind.
examples:
- The old photos were suggestive of a grander past.
- Her words were suggestive of trouble ahead.
