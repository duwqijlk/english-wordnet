simpleMeaning: When workers take on special tasks or do more work than their normal job asks, this is
  the pay they get for it
scope: 'Also called an extra duty allowance: pay for workers given special tasks or doing more work than
  usual, not their normal pay and not a bonus for good work.'
examples:
- Her extraneous duty allowance covered the extra shifts she took on.
- He got an extraneous duty allowance for the special project.
