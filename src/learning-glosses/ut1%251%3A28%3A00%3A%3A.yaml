simpleMeaning: The time at the line through Greenwich, England, from which time is counted; it stays the
  same all over the world.
scope: The time at the line through Greenwich, the same all over the world, also called universal time,
  UT, GMT, Greenwich Mean Time, and Greenwich Time; not the local time of another place and not a time
  zone.
examples:
- UT1 is the same everywhere.
- Sailors once set their clocks by UT1.
