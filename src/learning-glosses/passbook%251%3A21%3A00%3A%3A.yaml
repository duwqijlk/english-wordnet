simpleMeaning: a record kept by a person with money in some banks, that shows money put in, money taken
  out, and extra money paid by the bank
scope: 'Also called bankbook: a bank record of money put in and taken out, not a book for travel and not
  a card used to pay.'
examples:
- She took her passbook to the bank to see how much money she had put in.
- The bank marked the new payment in his passbook.
