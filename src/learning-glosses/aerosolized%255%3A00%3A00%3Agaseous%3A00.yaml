simpleMeaning: made of very tiny bits of solid or liquid spread through the air or a gas, so small they
  cannot be seen
scope: Something made of tiny solid or liquid bits floating in air or gas; aerosolised is another name
  for this, not a gas on its own and not a liquid poured out.
examples:
- The aerosolized spray filled the room with tiny drops.
- Doctors give some drugs in aerosolized form.
