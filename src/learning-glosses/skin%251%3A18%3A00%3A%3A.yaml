simpleMeaning: A young person in a British or American group of mostly shaven-headed youths; some are
  racist and anti-immigrant, so all are seen as racist and violent.
scope: A young member of a British or American group of mostly shaven-headed youths, though some such
  groups hold racist and anti-immigrant views; not the body's protective covering or sense organ, not
  a thin outer layer, not an animal's hide, not a person's life, not just any bald or shaven-headed person,
  not a fruit or vegetable peel, not a hide bag for holding liquid, and not any verb use (climbing awkwardly,
  grazing or injuring a surface, stripping tree bark, or removing a hide).
examples:
- A crowd of skins stood at the back of the hall, heads shaved to the scalp.
- The documentary followed a former skin who had turned his back on the movement.
