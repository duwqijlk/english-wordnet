simpleMeaning: the deep gloom you feel when you have given up all hope of comfort or success
scope: The deep gloom of having given up all hope of comfort or success, not sadness over one lost chance,
  and not fear of what comes next.
examples:
- Hopelessness settled over the town after the mine closed.
- He fought off hopelessness by holding on to small plans.
