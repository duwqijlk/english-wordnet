simpleMeaning: to take away a person's honours, things they own, or traits
scope: To take away someone's honours, things, or traits, also called displume, and not to take away feathers
  or clothes.
examples:
- The scandal deplumed the once-famous mayor of every honour he had won.
- The invaders deplumed the conquered king, taking his crown and lands.
