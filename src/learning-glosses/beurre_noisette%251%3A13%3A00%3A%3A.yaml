simpleMeaning: clear butter heated slowly until brown, then flavoured with vinegar or lemon juice and
  capers
scope: Also called brown butter; clear butter browned slowly and seasoned, not plain melted butter and
  not a sauce made with flour.
examples:
- She spooned beurre noisette over the fish.
- The chef made beurre noisette with lemon juice and capers.
