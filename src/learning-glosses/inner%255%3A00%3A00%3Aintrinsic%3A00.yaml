simpleMeaning: the deepest part inside a thing, or the most basic part of what it is
scope: The deepest or most basic part of a thing, not its outer face and not a part near the edge.
examples:
- The inner logic of her plan was clear once she explained each step.
- She tried to understand the inner sense of the poem, not just its words.
