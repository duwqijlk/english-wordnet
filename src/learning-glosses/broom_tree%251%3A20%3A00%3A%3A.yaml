simpleMeaning: a prickly shrub with yellow flowers, growing on the open moors of New England and Europe
scope: This is a prickly shrub with yellow flowers, growing on the open moors of New England and Europe;
  needle furze and petty whin are other names for it, not gorse and not a garden shrub.
examples:
- The broom tree flowered yellow across the moor.
- A broom tree stood prickly and bare beside the track.
