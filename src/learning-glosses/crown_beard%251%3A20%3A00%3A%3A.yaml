simpleMeaning: any of the plants in the group Verbesina, with flower heads in bunches that are white or
  yellow
scope: Any plant of the group Verbesina with flower heads in bunches of white or yellow, also called crown-beard
  and crownbeard; not other plants with white or yellow flowers.
examples:
- Crown beard grew along the edge of the field.
- The crown beard had bunches of yellow flowers.
