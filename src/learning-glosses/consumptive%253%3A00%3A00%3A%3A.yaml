simpleMeaning: Likely to use things up, often in a wasteful way.
scope: Of a thing or person likely to use things up, often in a wasteful way; not the use for a person
  ill with tuberculosis of the lungs, or for a cough from that illness.
examples:
- The factory was consumptive, using up fuel at a great rate.
- Their habits were consumptive of time and money.
