simpleMeaning: to form a shape like the top of a door or bridge, or a smooth bend
scope: To form an arch or a smooth bend, as a back does. Not to form a tight ring or sharp twist, and
  not to go onward in bends along a way.
examples:
- Her back curved as she leaned over the table.
- The roof curved up in a high arch over the door.
