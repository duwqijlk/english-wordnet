simpleMeaning: The act of making a thing cold or frozen so it keeps longer.
scope: The act of making a thing cold or frozen so it keeps longer, also called refrigeration; not cooking
  and not drying a thing to keep it.
examples:
- Infrigidation keeps the meat fresh for weeks.
- The cook used infrigidation to store the fish.
