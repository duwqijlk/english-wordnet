synsetId: 00693132-n
simpleMeaning: A surgeon's act in which a stitch closes the neck of the womb in a woman with child, done
  when that neck has failed to hold earlier babies in place
scope: This is a surgeon's act that closes the neck of the womb with a stitch; purse-string operation
  is another name for it, and its nearest neighbours are the other surgical acts done to hold a baby in
  place.
examples:
- The Shirodkar's operation closed the cervix with a stitch.
- Her doctor chose a Shirodkar's operation after two lost pregnancies.
