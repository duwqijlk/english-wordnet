simpleMeaning: Complaints made by ordinary people against the government are looked into by a man picked
  by the government
scope: A man picked by the government to look into complaints by ordinary people against it, not the same
  job held by a woman and not a judge who tries cases in court.
examples:
- The ombudsman looked into her complaint about the tax office.
- He wrote to the ombudsman when the council ignored him.
