simpleMeaning: making very hard demands all the time and never letting up
scope: This sense describes a person or rule that makes hard demands all the time, also called stern and
  also called strict. It is not about a task that needs great care to be right, and not about living things
  that need special food.
examples:
- Our exacting teacher expected every student to hand in work on time, every time.
- An exacting boss checked every report and asked for changes again and again.
