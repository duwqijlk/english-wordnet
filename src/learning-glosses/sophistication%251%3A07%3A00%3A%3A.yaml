simpleMeaning: the quality of knowing much about the world and thinking in a deep, learned way, gained
  through learning, life, or loss of simple beliefs
scope: 'Also called worldliness, mundanity, and mundaneness: knowing the world well and thinking in a
  learned way, not tricking people with clever but false reasons.'
examples:
- Her sophistication showed in the way she spoke about art, books, and travel.
- Years spent living abroad gave him a sophistication his friends admired.
