simpleMeaning: A part of the blood that the body has on its own and that fights tissue from another person
  of the same kind
scope: A part of the blood that fights tissue from another person of the same kind, also called alloantibody;
  not a defence the body builds after a jab and not a part of the blood that fights germs.
examples:
- The patient's blood held an isoantibody that would attack a donor kidney.
- Doctors test for an isoantibody before a transplant.
