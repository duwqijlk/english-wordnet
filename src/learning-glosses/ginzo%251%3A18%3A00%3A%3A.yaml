simpleMeaning: an offensive word for a person whose family comes from Italy
scope: An offensive word for a person of Italian family; wop, dago and greaseball are other names for
  this sense, not the plain word Italian and not a slur for another group.
examples:
- The old film used ginzo as an insult for Italians.
- He was hurt when a stranger called him a ginzo.
