simpleMeaning: a sudden loss of being awake when a blood vessel in the brain breaks or is blocked, so
  the brain does not get enough oxygen, the gas the body needs
scope: A serious illness in the brain, not one movement of the arms and body in swimming or rowing and
  not a swing at a ball in sport.
examples:
- He had a stroke and could not speak for days.
- After her stroke, she needed care in hospital.
