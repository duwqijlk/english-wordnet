simpleMeaning: A sea snail of shore waters with a short coiled shell and a lid that closes it.
scope: A sea snail of shore waters with a short coiled shell, also called neritid gastropod; not a land
  snail and not a clam.
examples:
- The neritid clung to the rock with its shell shut tight.
- We found a neritid with a short spiral shell on the beach.
