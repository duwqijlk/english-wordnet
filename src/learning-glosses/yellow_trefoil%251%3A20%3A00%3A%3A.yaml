simpleMeaning: with small golden blooms and curved black pods, this low herb from Europe lies flat on
  the ground and now grows wild in North America
scope: This low herb, also called black medick, hop clover and nonesuch clover, lies flat on the ground
  with small golden blooms.
examples:
- The yellow trefoil lies flat on the ground, with small golden blooms.
- Yellow trefoil now grows wild in North America, far from Europe.
