senseId: 'therefore%4:02:00::'
synsetId: 00043413-r
simpleMeaning: As a result of that fact or reason; used to introduce a logical conclusion.
scope: This is not a casual way of adding a new point; it marks a conclusion that follows from what came
  before.
examples:
- The road was flooded, and therefore the school closed for the day.
- She had not slept and therefore made several mistakes.
