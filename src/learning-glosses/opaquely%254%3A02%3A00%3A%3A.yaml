simpleMeaning: in a way that is hard to see through or hard to follow
scope: In an opaque manner, so the meaning is hard to follow, not in a clear way that is easy to follow.
examples:
- He referred opaquely to her recent past.
- She answered opaquely, and no one knew what she meant.
