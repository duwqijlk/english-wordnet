simpleMeaning: The thick white fluid that a man's sex organs push out, holding the small cells that can
  join with an egg to make a baby
scope: Also called come, seed, semen, ejaculate and seminal fluid, this is the fluid itself, not the act
  of sex and not a single cell in the fluid.
examples:
- The doctor tested a small sample of cum in the lab.
- Cum is the fluid that carries sperm from a man's body.
