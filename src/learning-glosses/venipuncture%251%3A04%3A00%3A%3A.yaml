senseId: 'venipuncture%1:04:00::'
synsetId: 00946781-n
simpleMeaning: A blood tube is pricked through the skin to take blood for tests, start a drip there, or
  put in a drug or dye that shows on X-rays.
scope: A prick through the skin into a blood tube to take blood for tests or put something in, not a prick
  into the skin alone.
examples:
- The nurse did a venipuncture to take blood for the test.
- A venipuncture lets the doctor start a drip into a vein.
