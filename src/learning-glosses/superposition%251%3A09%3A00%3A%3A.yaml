simpleMeaning: the lowest layer in a stack of laid-down rock is the oldest one, by a rule of geology
scope: In geology, this rule is also called the principle of superposition and the superposition principle.
examples:
- The geologist used superposition to order the layers.
- Superposition puts the oldest layer at the bottom of the cliff.
