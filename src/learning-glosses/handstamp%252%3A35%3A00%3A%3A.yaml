simpleMeaning: To mark with a rubber stamp, most often to show that a paper has been passed by those in
  charge.
scope: This means to mark with a rubber stamp, most often to show a paper has been passed, not to sign
  by hand; also called rubberstamp.
examples:
- The clerk will handstamp your ticket at the door.
- They handstamp each pass before the show.
