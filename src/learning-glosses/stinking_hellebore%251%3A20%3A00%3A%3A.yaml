simpleMeaning: With a foul smell that hurts inside when swallowed, a plant with finger-like leaves.
scope: This is also called bear's foot and setterwort, a plant with finger-like leaves and a foul smell
  that hurts inside when swallowed, not a sweet-smelling garden plant.
examples:
- Stinking hellebore has finger-like leaves.
- Stinking hellebore smells foul.
