simpleMeaning: Several kinds of fish and shellfish are cooked with tomatoes, onions or leeks and strongly
  seasoned with saffron, garlic and herbs to make a Mediterranean soup or stew.
scope: This is the Provencal fish soup-stew; it is not a plain fish broth or a stew of other meats.
examples:
- We ordered bouillabaisse at a small harbour restaurant in Marseille.
- The bouillabaisse was rich with saffron and chunks of white fish.
