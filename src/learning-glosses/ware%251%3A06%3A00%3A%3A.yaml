simpleMeaning: Things of the same kind or make, usually joined to another word to name a set of things,
  such as table goods or computer programs
scope: Things of one kind or make named as part of a longer word, not one single thing and not a shop's
  stock.
examples:
- The shop sells kitchen ware in sets of plates and bowls.
- They packed the glass ware carefully before the move.
