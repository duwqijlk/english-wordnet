simpleMeaning: in a way that moves with sudden, short, sharp movements, again and again
scope: This is about moving with sudden, short, sharp movements, not about moving in a smooth and steady
  way.
examples:
- The old car moved jerkily up the hill, stopping and starting all the way.
- He nodded jerkily, his head moving in short, sudden stops and starts.
