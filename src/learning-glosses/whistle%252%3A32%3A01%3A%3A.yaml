simpleMeaning: to make a high sound that goes on and on, like a thin cry or a ringing bell
scope: 'Also called sing: a thing makes this high, long sound, not a person playing a tune and not a person
  giving a sign to someone.'
examples:
- The kettle whistled loudly as the water came to a boil.
- The bullet whistled past his head with a thin, high sound.
