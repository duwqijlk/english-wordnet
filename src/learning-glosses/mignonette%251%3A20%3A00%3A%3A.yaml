simpleMeaning: A woody Mediterranean plant that lives one year, widely grown for its dense, spike-like
  clusters of pale greenish or yellowish flowers at stem tips, with an intense spicy scent.
scope: Another name for sweet reseda; this is the scented Mediterranean plant, not the pale green colour
  or the sauce also called mignonette.
examples:
- Mignonette grew in pots along the sunny wall, filling the evening air with its spicy scent.
- A low border of mignonette edged the old garden path.
