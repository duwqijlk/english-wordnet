simpleMeaning: A shrub from India that stays green all year, with bright yellow flowers and bark used
  to tan leather; sometimes put in the group that shares its name.
scope: This sense covers only the evergreen Indian shrub with bright yellow flowers and bark used to tan
  leather; avaram, tanner's cassia and Senna auriculata are other names for this sense.
examples:
- Cassia auriculata has bright yellow flowers.
- The bark of Cassia auriculata is used to tan leather.
