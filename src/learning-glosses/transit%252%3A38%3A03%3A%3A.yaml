simpleMeaning: to move across a sign or house of the zodiac, or across the face of a star or planet, or
  across a line marking a place
scope: To move across a sign or house of the zodiac or the face of a star or planet, not to travel on
  a bus or train and not to turn a telescope.
examples:
- The comet will transit across a sign of the zodiac on September 11.
- The planet will transit across the face of the sun.
