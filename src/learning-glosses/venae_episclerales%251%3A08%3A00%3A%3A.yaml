simpleMeaning: The veins at the front of the eye take blood from small veins in the white of the eye near
  the edge of the clear front part.
scope: Also called the episcleral veins, these small veins lie in the white of the eye near the edge of
  the clear front part.
examples:
- Blood from the white of the eye drains through the venae episclerales.
- The venae episclerales empty into the veins at the front of the eye.
