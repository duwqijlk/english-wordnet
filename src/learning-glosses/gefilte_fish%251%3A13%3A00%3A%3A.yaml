simpleMeaning: Well-spiced balls made of ground flesh, eggs and crushed crumbs, cooked slowly in stock
scope: This is a dish of spiced balls made of ground flesh, eggs and crumbs cooked in stock; fish ball
  is another name for this sense, not a plain fried fillet and not fish soup.
examples:
- She served gefilte fish with horseradish at the holiday meal.
- My grandmother makes gefilte fish every spring.
