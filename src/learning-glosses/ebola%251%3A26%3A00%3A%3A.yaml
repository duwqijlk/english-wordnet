simpleMeaning: A severe illness, often deadly, in people, monkeys and chimpanzees, caused by a virus;
  it brings high fever and severe inner bleeding, spreads between people, and occurs mostly in Africa.
scope: A deadly viral illness, also called Ebola fever and Ebola hemorrhagic fever, found mostly in Africa
  and spread between people.
examples:
- Ebola killed many people in the outbreak.
- Doctors in protective suits treated Ebola patients.
