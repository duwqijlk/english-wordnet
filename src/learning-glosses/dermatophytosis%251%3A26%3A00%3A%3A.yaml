simpleMeaning: A fungus can give the skin an infection, most of all where the skin stays wet under clothes
scope: This is an infection of the skin from a fungus, most of all where the skin stays wet under clothes;
  dermatomycosis is another name for this sense. Not an infection caused by germs and not a rash from
  heat.
examples:
- Dermatophytosis spread across the skin where his shirt stayed damp.
- The doctor said the dermatophytosis came from a fungus growing on his skin.
