simpleMeaning: the sound of a drum, above all a snare drum, hit fast and without stopping
scope: The sound of a drum, above all a snare drum, hit fast and without stopping; roll and drum roll
  are other names for this sense, and it is not a single beat of a drum or the sound of a drum played
  slowly.
examples:
- The drummer played a paradiddle on the snare drum.
- A paradiddle rattled from the drum.
