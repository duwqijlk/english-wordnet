simpleMeaning: In genes, a form whose outward effect stays the same, no matter if the gene form paired
  with it matches it or not
scope: An adjective for a gene form, not the noun sense of the gene form itself.
examples:
- The dominant gene shows its effect even when paired with a different gene.
- Brown eyes come from a dominant gene.
