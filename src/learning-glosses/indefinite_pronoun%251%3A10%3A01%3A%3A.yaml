simpleMeaning: In grammar, a word that stands in place of a noun but points to no one thing in particular,
  like someone, anybody, or nothing
scope: A grammar word that points to no one thing in particular; not a word that names one set person
  or thing, and not a word that counts or measures.
examples:
- The word 'someone' in that sentence is an indefinite pronoun.
- An indefinite pronoun like 'anybody' points to no one person in particular.
