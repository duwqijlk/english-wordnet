simpleMeaning: two living things that breed together and share more traits than would happen by chance
  alone
scope: Breeding between like kinds, not breeding at random and not the breeding of unlike kinds.
examples:
- Birds of the same colour show assortative mating when they pair up.
- Assortative mating means like pairs with like more often than chance would give.
