simpleMeaning: In sewing, small folds pulled into cloth by tightening a thread along a stitched line.
scope: This is the sewn fold itself, also called a 'gathering', not the general act of collecting things
  or the verb for drawing fabric into folds.
examples:
- She stitched a gather along the waist of the skirt.
- The gathers at the shoulder give the blouse a soft shape.
