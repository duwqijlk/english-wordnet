simpleMeaning: Shares that buyers can sell back are given out by paid experts under set rules, each share
  standing for part of a wide mix of money papers.
scope: This firm is also called unit investment trust, and its paid experts give out shares that buyers
  can sell back.
examples:
- He bought into a unit trust.
- The unit trust spread his money over a wide mix of money papers.
