simpleMeaning: a person who breaks the law by making someone pay money, with the threat of telling others
  something shameful about them
scope: 'Also called a blackmailer and an extortioner: a person who breaks the law by making someone pay
  money under threat of telling a shameful secret, not a thief who steals openly and not a person who
  asks for money honestly.'
examples:
- The extortionist sent a letter saying he would reveal the secret unless he was paid.
- She refused to give in to the extortionist and went to the police instead.
