simpleMeaning: a medicine that brings down the heat of the body to stop or ease a fever
scope: 'Also called febrifuge: a medicine that lowers body heat to fight a fever, not a medicine that
  kills germs and not one that eases pain.'
examples:
- The nurse gave the child an antipyretic to bring down her fever.
- He took an antipyretic before bed so the fever would ease by morning.
