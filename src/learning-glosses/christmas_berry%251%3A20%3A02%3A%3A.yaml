simpleMeaning: A spiny shrub from the south-east of the United States that stays green all year, with
  spreading branches, usually blue or mauve flowers and red fruit
scope: This is a spiny shrub from the south-east of the United States with usually blue or mauve flowers
  and red fruit, also called Christmasberry and Lycium carolinianum; it is not the Pacific coast shrub
  of the same name or a different spiny shrub.
examples:
- The Christmas berry in the yard has red fruit in winter.
- We planted a Christmas berry for its blue flowers.
