simpleMeaning: In psychology, a short-lived readiness to react in a particular way.
scope: This is a passing mental readiness, not a permanent inclination, a group of things, a collection
  of numbers, the scenery for a play, or a unit of play in tennis or squash.
examples:
- The first puzzle created a mental set that made the second one harder to solve.
- The experiment created a temporary mental set to respond quickly to the signal.
