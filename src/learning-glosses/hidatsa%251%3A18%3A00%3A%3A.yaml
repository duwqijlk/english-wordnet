simpleMeaning: One person of the Sioux people who once lived along the Missouri river in western North
  Dakota.
scope: Also called Gros Ventre; one member of the Sioux people once living along the Missouri river in
  western North Dakota, not the whole people and not their tongue.
examples:
- A Hidatsa hunter lived along the Missouri river.
- The Hidatsa elder spoke of his people's old ways.
