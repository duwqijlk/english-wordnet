scope: In biochemistry, a straight chain of many small parts that makes up a stretch of a nucleic acid,
  not a single nucleotide and not a whole cell.
examples:
- A polynucleotide is a long chain built from many nucleotide units.
- DNA is made of polynucleotide chains.
