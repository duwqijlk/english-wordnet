simpleMeaning: This rope or chain on a boat holds the sail so the wind meets it at the right slant.
scope: Among the ropes and chains that work a sail, also called sheet, tack, shroud, and mainsheet, this
  is the one that holds the sail at the right slant to the wind.
examples:
- Pull in the weather sheet to set the sail.
- The weather sheet was eased as the wind changed.
