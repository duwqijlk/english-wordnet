simpleMeaning: An old, puffed-up person who holds to the old ways and puts their own country above all
  others, named for a cartoon figure.
scope: An old pompous reactionary, also called Blimp, set apart from an ordinary old person by its hold
  on the old ways and fierce love of country.
examples:
- Colonel Blimp opposed every change.
- He was a Colonel Blimp in his views.
