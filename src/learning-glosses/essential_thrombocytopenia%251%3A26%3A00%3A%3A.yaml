senseId: 'essential_thrombocytopenia%1:26:00::'
synsetId: 14221262-n
simpleMeaning: A low platelet count in the blood that stands on its own, not one brought on by something
  else, such as tuberculosis or drugs that hold back the marrow.
scope: This is a low platelet count with no outside cause, not a low count caused by illness or drugs
  and not a low count of red cells.
examples:
- Essential thrombocytopenia means her platelet count is low for no clear reason.
- His essential thrombocytopenia is watched, not treated with drugs.
