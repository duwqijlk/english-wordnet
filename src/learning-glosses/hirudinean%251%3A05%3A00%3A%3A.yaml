simpleMeaning: A sucker at each end marks this worm, most times, which lives in water or on land and feeds
  on meat or blood.
scope: Also called a leech or a bloodsucker, it is a worm that feeds on meat or blood in water or on land.
examples:
- The hirudinean moved through the water with a sucker at each end.
- A hirudinean sucks blood from the skin of its host.
