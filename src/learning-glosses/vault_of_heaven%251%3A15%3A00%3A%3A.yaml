senseId: 'vault_of_heaven%1:15:00::'
synsetId: 08538450-n
simpleMeaning: the sky as it looks, like the inside of a great ball on which the sun, moon and stars seem
  to lie
scope: 'Also called the heavens, sphere, firmament, empyrean, celestial sphere and welkin: the sky as
  it looks, like the inside of a great ball on which the sun, moon and stars seem to lie, not the real
  sky and not a picture of the stars.'
examples:
- In old poems the vault of heaven was said to turn above the earth.
- The stars seemed fixed on the vault of heaven as the night went on.
