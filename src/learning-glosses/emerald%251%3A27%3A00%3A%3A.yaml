simpleMeaning: a green, clear kind of beryl (a hard, clear stone) that people value very much as a precious
  stone
scope: This is the green stone as a kind of stone found in nature, not a cut and polished piece ready
  to wear and not just the green color.
examples:
- Emerald is a green form of beryl that miners find in rocks.
- She studied a rough emerald before it was cut for any ring.
