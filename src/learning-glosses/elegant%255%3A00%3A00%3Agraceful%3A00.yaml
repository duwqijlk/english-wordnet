simpleMeaning: showing beauty in a simple way and seeming to need no effort, in the way someone moves
  or in the way a thing is done
scope: This is about beauty and ease in movement or in how a thing is done, not about showing good taste,
  ease and wealth.
examples:
- She is an elegant dancer who moves with great ease.
- He found an elegant way to solve the hard sum.
