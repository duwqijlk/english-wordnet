simpleMeaning: a cut of beef that is made to cook slowly in liquid with the lid on
scope: A cut of beef for slow cooking in liquid with the lid on, not a finished dish of cooked meat and
  not a cut made for fast frying.
examples:
- She bought a pot roast to cook slowly in liquid all afternoon.
- The pot roast cooked for hours in liquid with the lid on.
