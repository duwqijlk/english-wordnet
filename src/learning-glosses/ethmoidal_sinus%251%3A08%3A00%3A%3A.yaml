simpleMeaning: A hollow space in the passages of the nose, behind the bridge of the nose
scope: A hollow space in the passages of the nose; ethmoid sinus is another name for this sense, not the
  main nose passage and not a hollow in the cheek bone.
examples:
- The ethmoidal sinus sits behind the bridge of the nose.
- A cold can block the ethmoidal sinus.
