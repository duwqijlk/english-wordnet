simpleMeaning: to stop being drunk after drinking too much alcohol
scope: This is the act of stopping being drunk after drinking too much; not the state of not being drunk,
  and not making someone else stop being drunk.
examples:
- After drinking too much, he slept until he sobered up.
- She needed a few hours to sober up after the party.
