simpleMeaning: a helper, often the father of the child to be born, who supports a woman in labour and
  urges her to use techniques learned in childbirth classes
scope: 'Also called a doula, a labor coach and a monitrice: a helper who stays with a woman in labour,
  not a doctor and not a nurse who gives medical care.'
examples:
- Her birthing coach stayed beside her through the long night.
- The birthing coach reminded her to breathe slowly between pains.
