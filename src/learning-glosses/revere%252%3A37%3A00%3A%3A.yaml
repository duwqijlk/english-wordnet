simpleMeaning: To look on someone or something with deep respect and wonder, as holy or set far above
  everyday things
scope: To hold someone in deep respect and awe, with fear and reverence as other names for this sense;
  not to love without question as one would a god.
examples:
- We revere the old teacher for her wisdom.
- They revere the mountain as a holy place.
