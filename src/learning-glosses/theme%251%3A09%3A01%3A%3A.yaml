simpleMeaning: an idea that links a book, play, film or work of art together and comes back again and
  again in it
scope: The main idea that links a story or work of art and keeps coming back. Not a main tune in music,
  and not giving something a subject or design.
examples:
- Love is the main theme of the novel.
- The theme of loss runs through all her paintings.
