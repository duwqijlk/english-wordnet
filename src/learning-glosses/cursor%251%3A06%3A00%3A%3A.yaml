simpleMeaning: In computer science, a small moving spot of light on a screen; you move it to point to
  commands or to places on the screen
scope: This mark on a screen is also called pointer. It is not the mouse in your hand and not a printed
  mark on paper.
examples:
- Move the cursor to the save button and click.
- The cursor was at the top of the screen.
