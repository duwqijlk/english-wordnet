simpleMeaning: soft, smooth strands from a plant, still in their raw state and not yet made into cloth
  or thread
scope: Soft, smooth strands from a plant in their raw state, also called cotton and cotton fiber, not
  cloth or thread made from them and not wool from a sheep.
examples:
- She used cotton wool to clean the cut.
- The box was packed with cotton wool to keep the glass safe.
