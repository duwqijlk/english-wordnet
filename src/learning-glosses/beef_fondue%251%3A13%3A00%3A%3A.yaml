simpleMeaning: Dipped in tasty sauces of many kinds, small square pieces of meat are first cooked in hot
  oil.
scope: Also called boeuf fondu bourguignon, this dish brings small square pieces of meat first cooked
  in hot oil, then dipped in tasty sauces of many kinds.
examples:
- The beef fondue was dipped in tasty sauces of many kinds.
- They ate the beef fondue with tasty sauces of many kinds.
