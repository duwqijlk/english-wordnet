senseId: 'flight_indicator%1:06:00::'
synsetId: 02748616-n
simpleMeaning: Using a fast-spinning wheel that holds steady, this plane tool gives the pilot a made-up
  level line to steer by as the plane moves.
scope: Also called an artificial horizon or a gyro horizon, this is the tool that gives a pilot a made-up
  level line, not the real line where sky meets earth.
examples:
- The pilot checked the flight indicator before turning the plane in the clouds.
- When the flight indicator showed the plane level, she eased the controls forward.
