simpleMeaning: A device that takes one still picture after another so that, played back fast, the pictures
  look as if they were moving
scope: This device is also called a motion-picture camera and a movie camera, and it works by taking a
  run of still pictures.
examples:
- The school bought a new cine-camera to film the play.
- He loaded the cine-camera and filmed the children playing in the garden.
