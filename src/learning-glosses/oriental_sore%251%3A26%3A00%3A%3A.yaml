simpleMeaning: A sickness of the skin that makes open wounds that eat away at the skin
scope: A skin sickness that makes open wounds, also called cutaneous leishmaniasis; not a wound from a
  cut and not a sickness of the inside of the body.
examples:
- The traveller's oriental sore took weeks to heal.
- An oriental sore left a mark on her arm.
