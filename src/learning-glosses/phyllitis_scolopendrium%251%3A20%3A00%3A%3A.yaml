simpleMeaning: A fern of Europe and Asia with plain leaves shaped like a long narrow spearhead.
scope: This is the Eurasian fern with plain spear-shaped leaves, also called hart's-tongue, hart's-tongue
  fern, and Asplenium scolopendrium; other ferns with divided leaves and ferns of other lands are other
  senses.
examples:
- Phyllitis scolopendrium grows in the damp shade of the old wall.
- The Phyllitis scolopendrium in the garden has plain green leaves.
