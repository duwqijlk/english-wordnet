simpleMeaning: the act of bringing in or starting something new for the first time
scope: This is about starting something new, not the opening part of a book or speech and not meeting
  a new person for the first time.
examples:
- The introduction of the new law changed life for many families.
- Her introduction of a new way of working helped the whole team.
