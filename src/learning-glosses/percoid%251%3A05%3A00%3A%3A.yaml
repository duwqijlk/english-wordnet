simpleMeaning: Any one of the many fish with sharp fins that belong to the group Perciformes.
scope: Any one of the many fish with sharp fins of the group Perciformes, also called a percoid fish and
  a percoidean, not a soft-finned fish and not a fish with no fins at all.
examples:
- The bass is a percoid with sharp fins.
- Many percoids live in warm seas.
