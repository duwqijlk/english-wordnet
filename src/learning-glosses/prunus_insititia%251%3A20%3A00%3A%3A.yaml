simpleMeaning: A small wild or half-tame plum tree from Europe and Asia that bears small egg-shaped fruit
  in bunches.
scope: Also called bullace; a wild or half-tame plum tree, not a big tree with sweet fruit grown by farmers
  and not a bush grown for red, pink or white flowers.
examples:
- Prunus insititia grows wild along the old lane, its small fruit hanging in bunches.
- We picked the egg-shaped fruit of the Prunus insititia for jam.
