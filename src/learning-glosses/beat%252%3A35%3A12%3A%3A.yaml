simpleMeaning: Hit water or bushes over and over so that hidden animals are startled out for hunters.
scope: This is driving animals from cover by striking plants or water, not striking your own body or keeping
  time to music.
examples:
- The hunters beat the reeds to drive the ducks into the open.
- The dogs waited while the men beat the undergrowth.
