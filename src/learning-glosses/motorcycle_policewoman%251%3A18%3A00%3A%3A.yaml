  drivers go
scope: A female police officer on a motorcycle who checks drivers' speed; not the general motorcycle cop
  and not a motorcycle policeman.
examples:
- The motorcycle policewoman waved the speeding car to the side of the road.
- A motorcycle policewoman stopped the truck and checked its speed.
