simpleMeaning: A small, thin, shell-covered animal that mostly lives in the sea, with ten legs, a long
  tail and one pair of claws, of a kind people eat.
scope: A small sea animal people eat, not a fish and not a crab.
examples:
- He ordered shrimp in garlic sauce.
- The shrimp in the net were still alive.
