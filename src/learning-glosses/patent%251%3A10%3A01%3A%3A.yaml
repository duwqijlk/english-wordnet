simpleMeaning: a paper from the state that gives one maker alone every right over a new thing they made
scope: A paper giving one maker alone every right over a new thing they made, not an open tube in the
  body and not the act of getting such a paper.
examples:
- She holds a patent for a new kind of lock.
- The company took out a patent on its new drug.
