simpleMeaning: In computer science, the written programs, steps, rules and papers for how a computer system
  works, kept in memory that can be read and changed
scope: 'Also called package: these are the programs and papers that make a computer work, not the computer
  machine itself.'
examples:
- She bought new software for her computer.
- The software is kept in the computer's memory and tells it how to work.
