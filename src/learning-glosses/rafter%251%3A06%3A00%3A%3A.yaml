simpleMeaning: one of a row of sloping beams that run side by side and hold up a roof
scope: 'Also called a balk: one of a row of sloping beams that run side by side and hold up a roof, not
  the act of putting such beams in a ceiling.'
examples:
- The rafters of the old barn were made of oak.
- Rain dripped through the gap between two rafters.
