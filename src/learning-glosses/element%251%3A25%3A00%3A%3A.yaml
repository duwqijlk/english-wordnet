simpleMeaning: a straight line that, when it moves, makes a cylinder (a round tube shape) or a cone (a
  round shape that comes to a point)
scope: A straight line that makes a round shape in this way, not a simple substance such as oxygen and
  not a single part of a whole thing.
examples:
- The teacher drew the element of the cone as a straight line on the board.
- Each element of the cylinder is a straight line from top to bottom.
