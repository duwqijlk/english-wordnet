simpleMeaning: Made or fitted to serve a set use.
scope: This is being made or fitted to serve a set use, not the sense of a machine that works, nor the
  sense of how a thing works rather than the body, nor the sense of being based on use rather than shape,
  nor the sense of being made able to do a set job.
examples:
- Her functional dress was plain but useful.
- Functional architecture puts use before show.
