simpleMeaning: Not working at the moment or not scheduled to work.
scope: This is not about a machine being switched off, not about being away from a place, and not about
  food that has gone bad; it means not scheduled to work.
examples:
- I am off tomorrow, so we can meet for lunch.
- The guard was off duty when the alarm sounded.
