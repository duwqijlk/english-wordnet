simpleMeaning: A small tree from Europe and Asia that loses its leaves in winter, grown for its fruit,
  which look like small crab apples.
scope: A small tree grown for fruit like small crab apples, also called a medlar tree, not the South African
  fruit, not the southern African tree, and not the crabapple-like fruit used for preserves.
examples:
- A medlar stood in the corner of the orchard.
- The medlar bore fruit that looked like small crab apples.
