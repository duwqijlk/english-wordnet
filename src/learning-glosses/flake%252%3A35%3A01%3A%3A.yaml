simpleMeaning: to cover something with thin small pieces, or with something like them
scope: To cover something with thin small pieces, not to come off in thin small pieces, not to become
  thin small pieces, and not a person with an odd way of acting.
examples:
- The roof was flaked with snow after the storm.
- He flaked the top of the pie with small pieces of pastry.
