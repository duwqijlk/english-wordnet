simpleMeaning: With a spiny shell on its back and no big claws like a true lobster has, this big sea creature
  is good to eat.
scope: Also called crawfish, crayfish, langouste, sea crawfish, and spiny lobster, this is a big sea creature
  good to eat, with a spiny shell but no big claws.
examples:
- We ate rock lobster for dinner.
- Fishermen caught rock lobsters in their traps.
