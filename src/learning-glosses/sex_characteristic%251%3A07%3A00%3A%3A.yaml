simpleMeaning: those traits of body and mind that go with one gender far more than with the other
scope: Traits of body and mind that go with one gender far more than the other, also called a sex character
  and a sexual characteristic; not a sex change and not a single body part.
examples:
- Facial hair is a sex characteristic that goes with men more than women.
- Doctors study how sex characteristics grow at puberty.
