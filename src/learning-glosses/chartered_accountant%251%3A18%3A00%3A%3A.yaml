simpleMeaning: a British or Canadian worker who keeps money records and belongs to a work group with a
  royal charter
scope: A British or Canadian money-records worker in a royally chartered work group, not a tax clerk and
  not a bank worker.
examples:
- She passed her exams and became a chartered accountant in London.
- The firm hired a chartered accountant to check its books.
