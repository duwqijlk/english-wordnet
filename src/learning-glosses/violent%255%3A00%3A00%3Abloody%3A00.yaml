simpleMeaning: marked by acts that hurt or kill people or by blood being lost
scope: This sense is about acts that hurt or kill people and cause loss of blood, not about strong feelings
  or force, and not about very bright or loud colors or sounds.
examples:
- The film showed a violent attack in which many people were hurt and blood covered the street.
- It was a violent night, with people shot and left bleeding in the road.
