simpleMeaning: A small Chinese kind of dog with short legs, a long soft shiny coat, and a wide flat face.
scope: Also called Pekinese and Pekingese; a small short-legged Chinese dog, set apart from long-legged
  dogs by its flat face and its long soft coat.
examples:
- Our Peke trots after us on his short legs.
- The Peke curled up on the rug, her long coat spread around her.
