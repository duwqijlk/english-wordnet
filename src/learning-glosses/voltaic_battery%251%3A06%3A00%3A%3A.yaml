simpleMeaning: a set of small power cells joined in a line or side by side to make electric power
scope: 'Also called a galvanic battery: a set of cells joined together to make electric power, not a single
  cell and not a battery that stores power made elsewhere.'
examples:
- The old voltaic battery powered the telegraph for hours.
- He built a voltaic battery from copper and zinc plates in jars of acid.
