simpleMeaning: low and rough in sound, like a voice after much shouting, or when ill or full of strong
  feeling
scope: 'Also called gruff and husky: low and rough in sound, not soft, clear and smooth in sound.'
examples:
- After shouting all day, his voice was hoarse and hard to hear.
- She sounded hoarse because she was ill.
