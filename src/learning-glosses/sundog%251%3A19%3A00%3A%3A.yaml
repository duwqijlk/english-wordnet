simpleMeaning: a bright spot in the sky on the ring that runs round the sky, made when light bends as
  it passes through tiny ice crystals
scope: This is a bright spot in the sky made by light bending through ice crystals, also called a mock
  sun and parhelion, not the sun itself and not a rainbow.
examples:
- A sundog glowed beside the sun on the cold morning.
- Two sundogs appeared in the winter sky.
