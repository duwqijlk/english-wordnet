scope: A small clamp used to hold tiny pieces while making rings and other things worn on the body, also
  called jeweler's vise; not a large clamp for wood and not a tool for cutting.
examples:
- The jeweller's vise held the ring steady while she set the stone.
- He tightened the jeweller's vise before filing the band.
