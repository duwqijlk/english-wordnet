simpleMeaning: a flat cake made of thin batter, a wet mix of flour and liquid, fried on both sides on
  a flat hot pan
scope: 'Also called pancake, hotcake, battercake, flannel-cake, flannel cake, flapcake, griddlecake and
  hot cake: a flat fried cake. It is not a sweet cake baked in an oven.'
examples:
- We ate flapjacks with butter and honey for breakfast.
- She flipped each flapjack when the top was full of small bubbles.
