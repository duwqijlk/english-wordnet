simpleMeaning: The planned moment or event where a competition ends, such as a race.
scope: The fixed event that closes a competition, such as the end of a race, only; not the taste left
  by wine, not the time when something ends, not a state of flawless quality, not the place where a race
  or journey ends, not a person's downfall, not any other event that ends something, not the act of completing
  something, and not any verb use (ending something, finally doing something, coming to an end, coating
  a surface, eating all the food, or ending a relationship).
examples:
- Excitement grew as the finish neared.
- The winner is the team with the most points at the finish.
