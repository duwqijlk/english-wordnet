simpleMeaning: a crocus from the Old World, with purple or white flowers and sweet-smelling, sharp orange
  stigmas, the threads used to flavour food
scope: A crocus whose orange threads flavour food, not the dried threads themselves and not a yellow-orange
  colour.
examples:
- Saffron grew in the old garden.
- The saffron plants in the field had purple flowers.
