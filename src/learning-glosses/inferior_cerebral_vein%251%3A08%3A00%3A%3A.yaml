simpleMeaning: Blood leaves the underside of the brain's two halves through lower veins, which run into
  the hollow spaces called the cavernous and transverse sinuses.
scope: Also called venae cerebrum inferior, these are the lower veins that drain the underside of the
  brain, not the veins that drain its top.
examples:
- The inferior cerebral vein drains the underside of the brain.
- Blood from the inferior cerebral vein flows into the transverse sinus.
