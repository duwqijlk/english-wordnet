simpleMeaning: Worship, rarely found, that takes in or puts up with every god
scope: Worship that takes in every god, not worship of one god only and not the belief that God is the
  whole world.
examples:
- His pantheism welcomed every god of the old stories.
- The old shrine showed a pantheism that honoured many gods.
