simpleMeaning: made of, having in it, or like calcite (calcium carbonate, a white mineral) or chalk
scope: 'Also called calcareous: this is about what a thing is made of or is like, not about the sense
  that means white in colour like chalk.'
examples:
- The chalky soil in this field is full of white stones.
- The cliffs here are chalky and break into soft white pieces.
