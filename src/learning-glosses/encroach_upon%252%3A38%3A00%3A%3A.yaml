simpleMeaning: to take for yourself land, room, or rights that belong to someone else, moving in where
  you have no right to be
scope: 'Also called intrude on, invade and obtrude upon: to take for yourself land, room, or rights that
  belong to someone else, moving in where you have no right to be, not a visit made with leave, and not
  an attack made in the open.'
examples:
- The new fence began to encroach upon our garden.
- He warned them not to encroach upon his land.
