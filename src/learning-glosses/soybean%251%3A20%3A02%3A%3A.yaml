simpleMeaning: a crop grown for its oil, which also feeds farm animals, enriches the soil, and serves
  as food
scope: A plant used for its oil, for animal feed, for improving soil, and as food; not the sense of the
  soybean as a high-protein food plant.
examples:
- Farmers grow soybean to press for oil.
- The soybean crop was plowed back into the field to feed the soil.
