simpleMeaning: An action carried out by armed forces or sea forces, such as a planned move or a long run
  of linked acts.
scope: An action carried out by armed forces or sea forces, such as a planned move or a long run of linked
  acts; not a single fight, and not a planned move into another country to reach one aim.
examples:
- The military operation took three weeks to finish.
- It was a joint military operation of the navy and air force.
