simpleMeaning: The deed of sharing things out into kinds of one sort.
scope: This sense is also called classification, for the deed of sharing things out into kinds of one
  sort, unlike the sense for the mind's basic way of sorting things into kinds, and unlike the sense for
  a set of folk or things set by kind or class.
examples:
- Categorization is the deed of sharing things out into kinds.
- Categorizations share things out.
