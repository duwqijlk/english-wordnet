simpleMeaning: Acts done with no thought or thinking over, above all the aimless acts seen in psychomotor
  epilepsy, a kind of fit
scope: Automatism is a reaction done with no thought behind it, above all the aimless acts seen in psychomotor
  epilepsy, not a move made on purpose.
examples:
- Automatism can make a person act without thinking.
- Automatism showed itself in aimless acts.
