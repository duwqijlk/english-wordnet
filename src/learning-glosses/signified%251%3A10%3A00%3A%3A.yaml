simpleMeaning: the meaning of a word or phrase, or one way of understanding a word, phrase or situation
scope: 'Also called sense: the meaning of a word or phrase, or a way of understanding it, not the word
  or sign itself that carries the meaning.'
examples:
- In this poem, the signified of 'home' is safety and love, not just a house.
- The signified can change when a word is used in a new situation.
