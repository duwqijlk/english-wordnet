simpleMeaning: A person who studies the mind by looking at how the brain and nerves work.
scope: This is a person who studies the mind by looking at how the brain and nerves work; not a doctor
  who treats the mind and not a thinker who ignores the brain.
examples:
- The cognitive neuroscientist traced the thought to a part of the brain.
- A cognitive neuroscientist studies memory in the lab.
