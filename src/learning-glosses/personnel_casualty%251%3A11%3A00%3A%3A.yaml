simpleMeaning: A member of the armed forces who is killed or taken prisoner.
scope: This is about a service member lost by death or being taken prisoner, not a hurt person in general
  and not a soldier who is only missing from duty.
examples:
- The unit reported one personnel casualty after the attack.
- Each personnel casualty was listed by name in the report.
