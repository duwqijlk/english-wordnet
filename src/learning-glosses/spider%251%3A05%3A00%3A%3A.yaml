simpleMeaning: An eight-legged hunting arachnid with two venom fangs, two feelers and usually two silk
  glands at its rear; it spins silk for egg cases or to trap prey.
scope: This is the eight-legged arachnid that spins webs and egg cases; it is not the cast-iron frying
  pan, the billiards rest, or the internet program that crawls the web.
examples:
- A spider spun its web between the fence posts to catch flies.
- The spider wrapped its eggs in a silk cocoon.
