simpleMeaning: Purple spots on the skin that appear when the blood has too few of the tiny bits that help
  it clot, for many different reasons
scope: A purple-spot skin condition caused by too few of the tiny blood bits that help blood clot, also
  called thrombocytopenic purpura and idiopathic thrombocytopenic purpura; not a purple rash from an allergy
  and not bleeding from a cut.
examples:
- The doctor said the purpura hemorrhagica came from a low platelet count.
- The purpura hemorrhagica showed up as small purple spots on her legs.
