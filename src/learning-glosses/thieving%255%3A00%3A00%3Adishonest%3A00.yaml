simpleMeaning: likely to steal things from other people
scope: This describes a person who is likely to steal things; it is not the act of stealing itself, and
  it is not a person who has had things stolen.
examples:
- The thieving clerk took money from the shop till.
- Keep your bag where thieving hands cannot reach it.
