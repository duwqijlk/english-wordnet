senseId: 'pamperer%1:18:00::'
synsetId: 10415089-n
simpleMeaning: A person who spoils someone by giving them far too much of what they want
scope: 'Also called a spoiler, a coddler or a mollycoddler: a person who spoils someone with too much
  of what they want, not a person who simply treats someone kindly, and not a panderer, who serves the
  low wants of others for money.'
examples:
- The old pamperer gave her grandson everything he asked for.
- The pamperer bought the child every toy she pointed at.
