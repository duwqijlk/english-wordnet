simpleMeaning: A bright green cloth with a soft surface like felt (a thick, soft cloth), used to cover
  tables for games
scope: This is the bright green cloth that covers tables used for games. It is not the thick cloth it
  looks like, and not a cloth for clothes or curtains in general.
examples:
- The cards slid easily over the green baize.
- He cleaned the baize on the pool table before the game.
