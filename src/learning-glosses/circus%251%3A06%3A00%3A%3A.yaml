simpleMeaning: A round or oval open space with rows of seats round it, usually under a tent, where shows
  are given.
scope: A round or oval showground with rows of seats round it, usually under a tent, not the travelling
  show itself, not the old open-air stadium, and not a wild, confused scene.
examples:
- The crowd filled the circus to watch the acrobats.
- They built a circus with seats rising in tiers.
