simpleMeaning: Above all the wall in the nose or between the heart's upper rooms, this operation takes
  away all or part of a thin wall in the body.
scope: It is the taking away of all or part of a thin wall in the body, above all the wall in the nose
  or between the heart's upper rooms.
examples:
- Part of the wall in the nose was taken away in a septectomy.
- The wall between the heart's upper rooms was taken away in a septectomy.
