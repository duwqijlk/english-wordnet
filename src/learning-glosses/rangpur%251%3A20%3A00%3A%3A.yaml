simpleMeaning: A very sour fruit with orange peel, a cross of a mandarin orange and a lemon.
scope: Also called rangpur lime and lemanderin, this is the sour fruit of a cross between a mandarin orange
  and a lemon, rather than either fruit on its own.
examples:
- The rangpur tasted very sour.
- She peeled a rangpur and ate the fruit.
