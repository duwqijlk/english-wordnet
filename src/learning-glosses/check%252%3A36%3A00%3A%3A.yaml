simpleMeaning: To mark a surface with squares, or to draw crossed lines on it.
scope: 'This is a rare craft and printing use: cloth or paper is checked into a pattern of squares or
  crossed lines. It is not the noun ''check'', which names the pattern itself; not the sense of putting
  a tick beside an item; not the sense of training a child or animal; not the sense of writing a bank
  check; and not the everyday sense of inspecting. The verb is dated; the pattern now usually appears
  in the adjective ''checked''.'
examples:
- The printer checked the sheet into small squares as a guide for the drawing.
- She checked the cloth with pale blue lines before cutting it.
