senseId: 'plasmacyte%1:08:00::'
synsetId: 05460421-n
simpleMeaning: A unit grown from a B lymphocyte (a white blood unit) when a certain marker sets off a
  defence, found in bone marrow and sometimes in the blood
scope: A unit grown from a B lymphocyte; plasma cell is another name for this sense, and this is not the
  B lymphocyte itself.
examples:
- The plasmacyte grew from a B lymphocyte after a marker set off a defence.
- Plasmacytes are found in bone marrow and sometimes in the blood.
