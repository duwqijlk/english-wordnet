simpleMeaning: A gate in a computer that turns on only when just one of its inputs is on.
scope: This is a gate in a computer that turns on only when just one of its inputs is on, also called
  an X-OR circuit and an XOR gate, not a gate that turns on when more than one input is on.
examples:
- The XOR circuit fires when one input is high.
- An XOR circuit passes a signal only if one input is on.
