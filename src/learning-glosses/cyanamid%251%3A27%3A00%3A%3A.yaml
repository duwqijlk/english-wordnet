simpleMeaning: The first acid from which a family of salts is made, it is a weak one that can be dissolved
  in water and can give up two bits of hydrogen.
scope: 'Also called cyanamide: a weak acid, not a strong acid and not one of its salts.'
examples:
- The chemist dissolved cyanamid in water.
- Cyanamid can give up two bits of hydrogen.
