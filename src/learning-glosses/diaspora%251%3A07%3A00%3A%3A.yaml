simpleMeaning: the spreading out of a people, a language, or a way of life from the one place where it
  first was
scope: The spreading out of a people, a language, or a way of life from the place where it first was;
  not the body of Jewish people or communities living outside Palestine or modern Israel.
examples:
- Trade led to a diaspora of the language far beyond its home island.
- War caused a diaspora of the people, who carried their way of life to new lands.
