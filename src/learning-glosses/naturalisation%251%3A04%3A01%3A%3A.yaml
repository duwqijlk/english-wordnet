simpleMeaning: A word from another language starts to sound like the words of the language that takes
  it in
scope: This is how a word from another language starts to sound like the language that takes it in, with
  naturalization as another name for this sense, not the granting of citizenship to a person from another
  country.
examples:
- The naturalisation of the Italian word in English changed how it sounds.
- Through naturalisation, a word borrowed from French now sounds like an English word.
