simpleMeaning: Flowers that run from rose through red to purple crown this herb of warm American lands,
  and they hold their colour when dried.
scope: Also called globe amaranth, this herb of warm American lands is not the Eurasian annual with blue,
  purple, pink, or white flower heads.
examples:
- Dried bachelor's buttons kept their colour on the shelf.
- A bachelor's button grew beside the path.
