simpleMeaning: The way an unborn baby lies when its bottom is at the opening of its mother's birth canal.
scope: An unborn baby lying with its bottom at the birth opening; frank breech delivery is another name
  for this sense, not a baby lying head down and not a baby lying sideways.
examples:
- The scan showed a frank breech, with the baby's bottom first.
- A frank breech can make the birth harder.
