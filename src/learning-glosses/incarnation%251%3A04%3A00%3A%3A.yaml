simpleMeaning: the act of giving human qualities to ideas and other things you cannot see or touch, like
  love or death
scope: This sense is the act of giving human qualities to an idea, not a god coming to earth as a person
  and not a person who is a perfect example of something.
examples:
- In the poem, the incarnation of Death as a kind old man gives a human form to an idea.
- The story uses the incarnation of Justice as a blind woman holding scales to make the idea seem human.
