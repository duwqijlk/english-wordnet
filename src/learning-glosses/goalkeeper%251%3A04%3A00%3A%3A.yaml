simpleMeaning: the job on a soccer, ice hockey or lacrosse team of standing in front of the goal and trying
  to stop the other team from scoring
scope: 'Also called goalie, goaltender and netkeeper: this is the defensive job in front of the goal,
  not the play of the other team members. The same word elsewhere names the player who does this job.'
examples:
- The goalkeeper position suits her because she is quick to block shots.
- In ice hockey, the goalkeeper position is the hardest job on the team.
