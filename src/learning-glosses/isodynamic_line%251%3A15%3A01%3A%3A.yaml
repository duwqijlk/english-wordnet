senseId: 'isodynamic_line%1:15:01::'
synsetId: 92419366-n
simpleMeaning: A mark on a map that joins places where a magnet's pull has the same strength
scope: A mark on a map joining places of equal magnetic strength; not a mark joining places of equal heat
  and not a mark joining places of equal height.
examples:
- The isodynamic line on the chart joins places with equal magnetic force.
- The map shows an isodynamic line running across the ocean.
