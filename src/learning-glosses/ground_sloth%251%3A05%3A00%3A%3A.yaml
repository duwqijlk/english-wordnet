simpleMeaning: A huge mammal like a sloth that lived on land in America during the Pliocene and Pleistocene,
  and is now extinct.
scope: This huge extinct mammal is also called a megathere; it lived on land in America during the Pliocene
  and Pleistocene.
examples:
- The ground sloth was far bigger than any sloth alive today.
- The ground sloth died out long ago.
