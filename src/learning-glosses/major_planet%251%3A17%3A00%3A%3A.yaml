simpleMeaning: In astronomy, any of the nine large sun-orbiting bodies that shine by reflected light,
  from Mercury outward to Pluto, moving counterclockwise around the sun as seen from the constellation
  Hercules.
scope: One of the sun's nine large orbiting bodies, not a moon circling one of them, and not a small object
  such as an asteroid.
examples:
- Jupiter is the largest major planet in the solar system.
- Astronomers once counted Pluto as a major planet.
