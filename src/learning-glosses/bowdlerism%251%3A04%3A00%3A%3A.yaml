simpleMeaning: The cutting out of rude or shocking parts, done out of strict shame about such things
scope: The cutting out of rude or shocking parts, not the banning of a work and not a law about what may
  be said.
examples:
- The bowdlerism of the old play left out the rude jokes.
- Critics called the bowdlerism of the novel a loss for readers.
