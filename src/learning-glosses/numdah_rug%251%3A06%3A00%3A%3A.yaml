simpleMeaning: Rough felt from India is the stuff of this floor covering, stitched with thread
scope: This is a floor covering made from rough felt from India, also called nammad and numdah; not a
  fine woven carpet and not a plain blanket.
examples:
- The numdah rug on the floor was stitched with bright flowers.
- We laid the numdah rug by the fire to keep our feet warm.
