simpleMeaning: The tongue of one branch of the Austro-Asiatic family, spoken by the people it is named
  for.
scope: Also called Mon; the tongue of one branch of the Austro-Asiatic family, spoken by the people it
  is named for, not the people themselves and not other tongues of the same branch.
examples:
- Mon language is spoken by the Mon people.
- Mon language belongs to the Mon-Khmer group.
