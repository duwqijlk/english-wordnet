senseId: 'adulterator%1:18:00::'
synsetId: 09792029-n
simpleMeaning: A person who makes something less pure or less good at its job.
scope: A person who makes a substance less pure or less good, not the substance itself that does the harm
  and not a person who makes a substance stronger.
examples:
- The adulterator mixed chalk into the flour to make it go further.
- An adulterator of wine was fined by the town.
