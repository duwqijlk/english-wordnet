simpleMeaning: A person ruled by a strong feeling, such as love or fear, and unable to break free of it
scope: A person ruled by a strong feeling, not a person held in a prison and not a person kept as a prize.
examples:
- He was a captive of his own anger.
- She lived as a captive to her fear of the dark.
