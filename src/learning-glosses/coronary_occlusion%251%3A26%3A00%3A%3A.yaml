simpleMeaning: a block in one of the blood tubes that feed the heart, caused by a slow build-up of fatty
  stuff or by a clot of blood
scope: A block in one of the blood tubes that feed the heart, caused by a slow build-up of fatty stuff
  or by a clot of blood; not the chest pain itself, and not a heart attack.
examples:
- The doctor said a coronary occlusion had blocked the artery to his heart.
- A coronary occlusion can follow years of fatty build-up in the arteries.
