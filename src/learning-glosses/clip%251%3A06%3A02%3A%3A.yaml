simpleMeaning: Jewelry worn on a hat or a dress; it has a part at the back that fastens and holds it there
scope: This is a piece of jewelry you fasten to clothing, not a quick hit and not a metal frame that holds
  bullets for a gun.
examples:
- She wore a gold clip on her hat for the party.
- She bought a silver clip shaped like a flower to wear on her dress.
