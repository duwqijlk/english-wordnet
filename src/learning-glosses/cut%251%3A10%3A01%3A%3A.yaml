simpleMeaning: the part left out when an editor's change makes a written passage shorter
scope: This is text left out during editing, not a track of recorded music or a remark that hurts someone.
examples:
- Several cuts were made to the article before it went to press.
- The editor marked the longest cut in red so the author could restore it.
