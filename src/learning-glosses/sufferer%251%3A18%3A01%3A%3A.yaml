simpleMeaning: a person who goes through pain or hard times for a strong belief about what is right
scope: Also called a martyr; this is a person who is hurt for a belief, not a person who is ill.
examples:
- The sufferer refused to change his beliefs even in prison.
- She was known as a sufferer for the cause, losing her home but keeping her faith.
