simpleMeaning: not worked out in a clear, exact way, and not fixed or known before
scope: 'Also called indeterminate: not exact, fixed, or known before; not a thing that is already set
  and known.'
examples:
- The date of the meeting is still undetermined, so no one knows when it will be.
- They left the price undetermined until they knew the full cost.
