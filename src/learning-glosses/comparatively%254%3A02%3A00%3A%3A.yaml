senseId: 'comparatively%4:02:00::'
synsetId: 00162033-r
simpleMeaning: in a way that shows how much or how good something is when it is set beside something else
scope: 'Also called relatively: judged only beside something else, not on its own in a complete way.'
examples:
- The town is comparatively quiet this week, when set beside last week.
- It was comparatively easy to finish the work once we had help.
