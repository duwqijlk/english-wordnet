simpleMeaning: the post held by a person who advises and helps others
scope: This is the post of a person who advises and helps others; counsellorship is another name for this
  sense; not the post of a lawyer, and not the post of a teacher.
examples:
- He held the counselorship for ten years.
- The counselorship brought him into touch with many troubled pupils.
