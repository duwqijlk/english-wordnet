simpleMeaning: Holding fast to what you think or want, and refusing to give in
scope: Holding fast and refusing to give in, not a firm stand taken for a good reason and not a refusal
  that comes from fear.
examples:
- The stubborn child refused to eat his dinner.
- She was too stubborn to admit she was wrong.
