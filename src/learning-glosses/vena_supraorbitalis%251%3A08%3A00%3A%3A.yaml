synsetId: 05389122-n
simpleMeaning: 'Two tubes become one at the corner of the eye: this one brings blood from the front of
  the scalp and meets the one near the middle of the forehead.'
scope: Also called a supraorbital vein, this tube meets the one near the middle of the forehead to form
  the one at the corner of the eye, draining the front of the scalp.
examples:
- Blood from the front of the scalp drains through the vena supraorbitalis.
- The vena supraorbitalis joins the blood tube near the middle of the forehead.
