simpleMeaning: a soft baked dish made from ground corn, sometimes with rice or hominy, served soft to
  be eaten with a scoop, chiefly in the south
scope: A soft baked dish made from ground corn, sometimes with rice or hominy, served soft to be eaten
  with a scoop, chiefly in the south; batter bread is another name for this sense, not a firm loaf cut
  in slices and not corn pudding.
examples:
- Spoon bread is soft, so you eat it with a spoon.
- Grandma's spoon bread came hot from the oven.
