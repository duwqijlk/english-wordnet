simpleMeaning: a serving of one or more slices of bread with a filling, and small side foods
scope: A serving of one or more filled bread slices with small side foods, not a sandwich on its own with
  no side foods and not a main hot meal.
examples:
- The café served a sandwich plate with pickles and salad on the side.
- He ordered a sandwich plate for lunch, with two sandwiches and garnish.
