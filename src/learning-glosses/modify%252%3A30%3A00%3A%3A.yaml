simpleMeaning: To make a thing less strong, less rough, or less great than it was
scope: This is to make a thing less strong or less great than it was, not to put a word next to another
  word to say more about it.
examples:
- Please modify this letter to make it more polite.
- He modified his views and spoke in a softer way.
