senseId: 'bill_of_goods%1:10:01::'
synsetId: 06622910-n
simpleMeaning: words, written or spoken, that get someone to take something that is not true or not wanted
scope: Talk that gets a person to take what is untrue or not wanted, not a list of goods for sale and
  not a sales receipt.
examples:
- The dealer sold me a bill of goods about the car's low miles.
- She saw through his bill of goods and walked away.
