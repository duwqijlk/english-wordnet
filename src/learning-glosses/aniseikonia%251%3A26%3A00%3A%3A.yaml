simpleMeaning: a fault of sight in which a thing looks a different shape or size in each eye
scope: A fault of sight where the two eyes see different shapes or sizes, not poor sight in general and
  not a fault in one eye only.
examples:
- Because of his aniseikonia, the words on the page looked bigger in one eye than in the other.
- The doctor found that her aniseikonia made a circle look like an oval in one eye.
