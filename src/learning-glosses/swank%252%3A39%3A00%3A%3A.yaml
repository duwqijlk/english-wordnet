simpleMeaning: To show something off with pride and to act in a showy way, trying to look grander than
  one is.
scope: To show something off with pride and act in a showy way, also called flash and flaunt, and not
  the smart look of being fashionable or the grand, fashionable and elegant way a thing looks.
examples:
- They liked to swank about in their new sports car.
- They would swank around the room in their best clothes.
