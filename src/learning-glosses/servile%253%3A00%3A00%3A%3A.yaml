simpleMeaning: too ready to obey others and too eager to please them, in how a person speaks or acts
scope: Too ready to obey and to please others in how a person speaks or acts; not the sense about slaves
  or work for servants.
examples:
- He spoke in a servile tone, agreeing with everything his boss said.
- The servile waiter kept bowing and asking if he could do more to help.
