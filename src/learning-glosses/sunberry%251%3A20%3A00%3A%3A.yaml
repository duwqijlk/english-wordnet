simpleMeaning: a kind of black nightshade bred to grow in a garden, with small orange or black berries
  that can be eaten
scope: This is a garden kind of black nightshade with small berries that can be eaten, also called garden
  huckleberry and wonderberry, not wild black nightshade and not a berry that cannot be eaten.
examples:
- The sunberry bushes in her garden bore small orange berries.
- She picked a sunberry and ate it straight from the plant.
