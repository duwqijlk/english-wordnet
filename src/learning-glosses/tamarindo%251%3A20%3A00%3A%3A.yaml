simpleMeaning: An evergreen tropical tree that lives for many years, with a wide leafy crown, fragrant
  blossoms, hard yellowish wood and long pods of tart edible pulp.
scope: The tree itself; in markets tamarindo usually means the sour pods, not the plant that bears them.
examples:
- A tamarindo grows beside the church, and the children gather its pods in summer.
- We ate lunch in the shade of an old tamarindo.
