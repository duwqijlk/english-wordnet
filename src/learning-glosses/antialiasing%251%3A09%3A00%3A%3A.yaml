simpleMeaning: Curves and slanting lines that look rough and stepped are made to look smooth by this way
  of working in computer graphics.
scope: In computer graphics, a way of making bent and slanting lines look smooth, not a way of drawing
  the lines themselves.
examples:
- Antialiasing made the curved edge look smooth on the screen.
- With antialiasing, the diagonal lines no longer looked jagged.
