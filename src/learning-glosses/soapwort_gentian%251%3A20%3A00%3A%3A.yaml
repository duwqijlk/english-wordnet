simpleMeaning: Its leaves and flower buds look like those of a plant used to wash with, and this tall
  plant of the wet woods of North America lives for years.
scope: A tall plant that lives for years in the wet woods of North America, with leaves and flower buds
  like those of a plant used to wash with.
examples:
- The soapwort gentian stood tall in the wet woods of North America.
- The soapwort gentian had leaves and flower buds like those of a plant used to wash with.
