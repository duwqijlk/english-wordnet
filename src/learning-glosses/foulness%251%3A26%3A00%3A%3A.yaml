simpleMeaning: the state of being full of dirt and thrown-away waste that is sickening
scope: 'Also called filth, nastiness and filthiness: a state of being full of dirt and waste. It is not
  the sense of a strong bad smell alone, and not the sense of great wickedness.'
examples:
- The foulness of the empty house made it hard to stay inside.
- Workers were shocked by the foulness of the old kitchen.
