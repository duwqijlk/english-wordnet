simpleMeaning: the ability to judge people in a fair way, without treating anyone unfairly because of
  who they are, and without being dishonest
scope: Also called fairness and candour, this is judging people fairly with no dishonesty, not the sense
  of speaking openly about what you think.
examples:
- His candor as a judge meant that rich and poor alike got a fair hearing.
- With candor, the panel judged every application in the same way, whoever had sent it in.
