simpleMeaning: a sea animal people can eat, with a two-part shell like a fan with folds, that swims by
  pushing water out of its shell in a set of snapping moves
scope: 'Also called escallop and scollop: the live sea animal with a fan-like shell, not its meat served
  as food and not a thin slice of meat.'
examples:
- A scallop swims by opening and closing its shell.
- We watched a scallop push water out and move through the sea.
