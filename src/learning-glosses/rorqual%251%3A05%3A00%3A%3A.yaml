simpleMeaning: A small pointed fin on the back and long grooves down the throat mark any of several baleen
  whales of the family Balaenopteridae.
scope: 'Also called razorback: any of several baleen whales with long grooves down the throat and a small
  pointed fin on the back.'
examples:
- A rorqual shows long grooves down its throat.
- The small pointed fin on the back marked it as a rorqual.
