simpleMeaning: A clear liquid that will not burn, used to melt fats and oils, whose use as a cleaner or
  fire-quencher has faded because it poisons.
scope: This sense is also called carbon tet, carbon tetrachloride, and perchloromethane.
examples:
- Tetrachloromethane melts fats.
- A tetrachloromethane cleaned the oil.
