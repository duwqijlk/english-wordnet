simpleMeaning: In law, a point a lawyer puts to a judge or jury as part of the case
scope: In law, a point a lawyer puts to a judge or jury, not an agreement to accept a ruling and not the
  act of giving in.
examples:
- The lawyer's submission asked the jury to doubt the witness.
- In her submission, the lawyer said the proof was too weak.
