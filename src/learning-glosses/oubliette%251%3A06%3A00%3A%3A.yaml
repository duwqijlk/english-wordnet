simpleMeaning: A prison cell below ground whose only way in or out is a trap door in the ceiling.
scope: For a dungeon below ground with no door, reached only through a trap in the ceiling.
examples:
- The prisoner was thrown into the oubliette and left there.
- The oubliette had no door, only a trap in the ceiling.
