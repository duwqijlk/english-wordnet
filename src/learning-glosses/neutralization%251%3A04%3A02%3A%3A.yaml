simpleMeaning: In soft words, the taking out of a threat by killing or wrecking it, especially in a secret
  task or war task.
scope: In soft words, the taking out of a threat by killing or wrecking it, especially in a secret task
  or war task; also called neutralisation; not an act meant to keep a land politically neutral or shut
  it out of a possible war.
examples:
- Their neutralization ended the threat.
- The neutralization was done at dawn.
