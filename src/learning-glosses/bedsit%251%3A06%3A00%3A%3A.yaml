simpleMeaning: a sitting room with furniture, with a place to sleep and some basic pipes and taps for
  water and washing
scope: One room used for both sitting and sleeping, not a home with a separate living room and bedroom,
  and not a plain bedroom with no place to sit.
examples:
- She rented a small bedsit near the station for her first year at college.
- His bedsit had a bed, two chairs, and a small sink in the corner.
