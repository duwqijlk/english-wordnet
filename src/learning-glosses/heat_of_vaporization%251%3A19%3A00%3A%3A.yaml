simpleMeaning: A fixed weight of stuff needs to take in warmth before it can turn into gas, and the change
  takes place at the warmth where it boils
scope: The warmth a fixed weight of stuff takes in to turn into gas as it boils, also called heat of vaporisation,
  not the warmth given off when a liquid turns solid and not the warmth taken in when a liquid splits
  apart.
examples:
- The heat of vaporization of alcohol is lower than that of water.
- Engineers use the heat of vaporization to design cooling systems.
