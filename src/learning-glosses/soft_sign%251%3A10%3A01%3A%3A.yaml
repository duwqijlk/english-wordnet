senseId: 'soft_sign%1:10:01::'
synsetId: 92462515-n
simpleMeaning: the Cyrillic letter Ь that shows a consonant is said with the tongue near the roof of the
  mouth; in Old Church Slavonic it stood for a short reduced front vowel
scope: Also called a front yer; not the hard sign, which marks a hard consonant.
examples:
- In Russian, the soft sign after a consonant shows it is said with the tongue near the roof of the mouth.
- She added a soft sign after the letter to show the sound is soft.
