simpleMeaning: A stretch of days that runs from December twenty-four to January six.
scope: Also called Christmas, Christmastide, Christmastime, Yule and Yuletide; this is a stretch of days
  from December twenty-four to January six, not one day only and not the weeks before it.
examples:
- Noel runs from December twenty-four to January six, and the family sang each night.
- They lit candles every night of Noel.
