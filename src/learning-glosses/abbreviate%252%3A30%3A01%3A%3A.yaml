simpleMeaning: to make something cover less while keeping its most important parts
scope: 'Also called cut, reduce, contract, shorten, abridge and foreshorten: to make something cover less
  while keeping its main parts; not to cut out the main parts or to end something sooner.'
examples:
- We need to abbreviate the report by taking out the less important parts.
- They abbreviated the course so it covers fewer topics but keeps the key ideas.
