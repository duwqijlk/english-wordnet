simpleMeaning: to single something out as important when speaking or writing.
scope: This is not to pronounce a syllable or note with extra force, and not to feel mental pressure;
  it means to single something out as important.
examples:
- The report stressed the need for more teachers.
- She stressed that safety comes first.
