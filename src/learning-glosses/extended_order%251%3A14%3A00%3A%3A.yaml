simpleMeaning: a way soldiers spread out in a loose line for small fights, as far apart as the battle
  plan allows
scope: This is a spread-out line of soldiers ready to fight; not soldiers standing close together and
  not a march in step.
examples:
- The troops advanced in extended order across the open ground.
- Their extended order kept the soldiers widely separated.
