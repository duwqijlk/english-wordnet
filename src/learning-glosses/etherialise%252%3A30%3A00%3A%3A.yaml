simpleMeaning: to give a thing a light, airy feel, as if it came from another world
scope: To give a thing a light, airy feel; etherealize is another name for this sense, not to make a thing
  holy and not to make it thin.
examples:
- The painter tried to etherialise the faces in her work.
- Soft light will etherialise the garden at dawn.
