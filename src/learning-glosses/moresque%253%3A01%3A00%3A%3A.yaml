simpleMeaning: The Moors have ways of their own, and this word is about things of theirs, or things like
  them.
scope: Another name for this is Moorish; it is about things of the Moors, or things like them, not about
  the people themselves.
examples:
- The hall had Moresque arches and bright tiles.
- She loved the Moresque style of the old palace.
