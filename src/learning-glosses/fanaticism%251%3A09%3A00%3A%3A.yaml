simpleMeaning: a way of thinking that refuses to accept views against your own at all, in a way that is
  far too strong
scope: 'Also called zealotry: this is about refusing to accept other views, not just about liking or supporting
  something a lot.'
examples:
- His fanaticism meant he would not listen to anyone who disagreed with him.
- Fanaticism can turn a simple argument about politics into hate.
