simpleMeaning: The broad way in which living things change.
scope: The broad way living things change; not a short-lived fashion and not one single change in one
  kind of animal.
examples:
- The evolutionary trend toward larger brains took millions of years.
- Scientists traced the evolutionary trend in the fossil record.
