simpleMeaning: a fish with sharp fins and strong teeth, found in warm seas and eaten as food
scope: A fish with sharp fins and strong teeth from warm seas, also called sparid fish; not a fish with
  soft fins, and not a cold-water fish.
examples:
- The market sold sparid caught in the warm waters off the coast.
- The sparid's strong teeth showed clearly when it opened its mouth.
