senseId: sardonic%5:00:00:sarcastic:00
synsetId: 02086960-s
simpleMeaning: laughing at someone in a funny way that says the opposite of what you mean, mocking them
  with scorn as if they are worth little
scope: 'Also called snarky: laughing at someone with scorn, not friendly joking and not plain funny talk
  with no mocking in it.'
examples:
- He gave a sardonic smile and said, 'Well, that went well.'
- Her sardonic laugh made it clear she thought the plan was foolish.
