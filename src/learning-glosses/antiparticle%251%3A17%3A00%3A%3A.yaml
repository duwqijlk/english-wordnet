simpleMeaning: A piece of matter with the same mass as another but opposite values for all other qualities;
  when they meet, both are destroyed and energy such as light is made
scope: This is the opposite partner of a small piece of matter, not the ordinary piece itself and not
  a whole atom.
examples:
- When a particle meets its antiparticle, both disappear and energy is released.
- The positron is the antiparticle of the electron.
