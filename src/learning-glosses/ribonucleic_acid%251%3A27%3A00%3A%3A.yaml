simpleMeaning: In biochemistry, RNA is a long nucleotide chain, present in the nucleus but mostly in the
  cytoplasm, that carries DNA's instructions and directs certain chemical reactions in the cell.
scope: This is RNA, the cell's working copy of genetic instructions; it is not DNA, which stores them,
  and it is not a protein.
examples:
- Some viruses carry their genes as ribonucleic acid rather than DNA.
- The vaccine delivers a strand of ribonucleic acid that tells cells to build a harmless viral protein.
