simpleMeaning: Things move down because they are drawn by a pull toward the earth
scope: Things moving down because a pull draws them toward the earth, not the pull itself and not water
  pushed by pumps.
examples:
- The water reached the fields by gravitation, with no pumps at all.
- The loose stones slid down the slope by gravitation.
