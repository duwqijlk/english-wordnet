senseId: 'sexual_characteristic%1:07:00::'
synsetId: 05014464-n
simpleMeaning: those traits of body and mind that go with one sex far more than with the other
scope: Traits of body and mind that go with one sex far more than the other, also called a sex character
  and a sex characteristic; not a sex change and not a single body part.
examples:
- A high voice can be a sexual characteristic that goes with women more than men.
- Sexual characteristics grow and change at puberty.
