simpleMeaning: A shrub spreads like a mat in North America and northern Eurasia, stays green all year,
  bears small white flowers and red berries, and its leaves turn red in autumn.
scope: 'Also called bear''s grape, common bearberry, creashak, hog cranberry, mealberry, red bearberry,
  sand berry, sandberry, and wild cranberry: a shrub that spreads like a mat, green all year, with small
  white flowers and red berries, its leaves turning red in autumn.'
examples:
- Mountain box spreads like a mat across the ground.
- The mountain box had small white flowers and red berries.
