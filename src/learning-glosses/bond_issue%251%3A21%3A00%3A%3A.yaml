simpleMeaning: loans sold by a firm or a state body at one time, known by the date when they must be paid
  back
scope: Loans sold by a firm or a state body at one time, known by the date when they must be paid back,
  not a single loan and not a share in a firm.
examples:
- The city sold a bond issue to pay for the new bridge.
- Investors bought the bond issue because it would be paid back in ten years.
