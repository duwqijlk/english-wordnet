simpleMeaning: To give a thing the form of skilled work done by trained workers
scope: To give a thing the form of skilled work, also called professionalize; not the sense of becoming
  skilled oneself and not simply doing a thing for pay.
examples:
- Philosophy has not always been professionalised and used to be a subject pursued only by amateurs.
- They plan to professionalise the way the charity is run.
