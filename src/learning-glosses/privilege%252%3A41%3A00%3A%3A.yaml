simpleMeaning: to give a special right to a person or group
scope: This is the act of giving a special right, not the right itself held by one person or group and
  not the law right to keep private information secret.
examples:
- The law privileges landowners by giving them extra rights.
- The king privileged his friends by giving them land and titles.
