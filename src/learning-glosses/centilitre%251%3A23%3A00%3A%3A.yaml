simpleMeaning: a unit in the metric set for the amount of room a thing takes up, worth one hundredth of
  a bigger unit of the same kind
scope: 'Also called centiliter or cl: a unit in the metric set for the amount of room a thing takes up,
  worth one hundredth of a bigger unit of the same kind, not a unit of weight and not a unit of length.'
examples:
- Pour five centilitres of milk into the bowl.
- The bottle holds fifty centilitres of oil.
