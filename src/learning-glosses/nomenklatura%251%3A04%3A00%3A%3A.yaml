simpleMeaning: In a country run by a Communist Party, a system for giving jobs to people the party picks;
  groups in the party control the system
scope: A system for giving jobs to people the party picks, in a country run by a Communist Party; not
  the Communist Party itself and not normal hiring for any job.
examples:
- Under the nomenklatura, party groups chose who got the top jobs.
- The nomenklatura gave party leaders control over key posts in the country.
