simpleMeaning: the body of a simple plant, with no true stems, roots or leaves and no tubes to carry water
  and food, the kind of body thallophytes have
scope: The body of a simple plant with no true stems or roots, not a plant with stems and leaves and not
  a plant with tubes to carry water.
examples:
- The thallus of the seaweed had no stems or leaves.
- The lichen's thallus spread flat across the rock.
