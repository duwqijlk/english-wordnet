simpleMeaning: the sound of a consonant, most of all 'r', made by a quick flutter of the tongue against
  the roof of the mouth or the soft flesh at its back
scope: The rolling sound of a consonant like 'r', not the fast shaking of a musical note and not the verb
  sense of singing with trills.
examples:
- He pronounced his R's with a distinct trill.
- Her Spanish trill rolled off her tongue.
