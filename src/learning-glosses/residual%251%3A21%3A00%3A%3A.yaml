senseId: 'residual%1:21:00::'
synsetId: 13314012-n
simpleMeaning: 'often in the plural: money paid to a performer, writer or director each time a television
  show or a commercial (a piece that tries to sell things) is shown again'
scope: This is money paid each time a show is shown again, not a thing that is left over and not the sense
  that means relating to what is left.
examples:
- The actor still gets residuals when his old show is shown again.
- She gets residuals from a television commercial made many years ago.
