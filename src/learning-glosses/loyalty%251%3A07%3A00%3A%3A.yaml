simpleMeaning: the quality of supporting a person, group, or cause and staying with them
scope: The quality of staying with a person, group, or cause; not the act of promising yourself to a course
  of action.
examples:
- Her loyalty to her friends never changed, even in hard times.
- His loyalty to the team lasted for many years.
