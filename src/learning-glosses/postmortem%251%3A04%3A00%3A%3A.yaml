simpleMeaning: An examination of a dead body, cut open to find why the person died or what illness did
  to the body.
scope: Also called autopsy or necropsy, an examination of a dead body, cut open to find why the person
  died or what illness did to the body.
examples:
- The postmortem showed the man had died of a bad heart.
- Doctors ordered a postmortem to learn what had killed the child.
