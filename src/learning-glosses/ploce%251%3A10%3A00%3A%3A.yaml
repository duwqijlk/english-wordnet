simpleMeaning: In rhetoric, to make a word stand out or to add to what it means, the same word is said
  again
scope: In rhetoric this is saying the same word again for force or for a wider sense, not just any repeat
  of a sound and not a word used twice by mistake.
examples:
- The poet used ploce, saying the word 'free' a second time to make it stand out.
- In her speech, ploce gave the word 'hope' more weight when she said it again.
