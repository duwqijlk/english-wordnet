simpleMeaning: A plant of South America that gives something much like carnauba.
scope: A South American plant that gives a stuff much like carnauba; caranda, caranda palm and caranday
  are other names for this sense, not the Brazilian fan palm with an edible root and not the Andean palm
  whose wax is mixed with tallow.
examples:
- The wax palm grows in South America and gives a stuff like carnauba.
- Farmers cut the wax palm for the stuff it gives.
