simpleMeaning: In geometry, putting one shape in the place of another in the mind to show that the two
  match exactly
scope: This is the geometry act of laying one shape over another to show they match, not the geology rule
  about the oldest rock layer at the bottom and not just putting things on top of each other.
examples:
- By superposition, the teacher showed the two triangles were the same size.
- Superposition lets us test if one shape fits exactly over another.
