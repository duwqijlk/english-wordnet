simpleMeaning: in music, played at a very fast speed, faster than allegro (a word for a fast speed in
  music)
scope: A music direction that tells players to play very fast, faster than allegro; it is about the speed
  of music, not about speed in everyday life.
examples:
- The last part of the piece is marked presto, so the players went very fast.
- She played the short piece presto, with her fingers moving quickly over the keys.
