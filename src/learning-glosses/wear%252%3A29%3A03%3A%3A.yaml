simpleMeaning: To make someone very tired, or to become very tired, through too much effort, strain, or
  pressure.
scope: This is about becoming or making someone exhausted through effort or pressure, not about an item
  of clothing, putting on or being dressed in clothes, carrying something, showing an expression or appearance,
  gradual damage from use, staying usable, or falling apart.
examples:
- The steep climb wore the hikers out before they reached the summit.
- She wore herself out trying to finish the report on time.
