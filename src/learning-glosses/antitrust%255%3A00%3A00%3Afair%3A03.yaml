simpleMeaning: said of laws and rules that keep trade fair by stopping firms from unfair business tricks
scope: 'Also called antimonopoly: it is about laws that keep trade fair, not a single firm that rules
  a market and not a law about tax.'
examples:
- The antitrust laws stopped the two firms from joining into one giant company.
- The court used antitrust rules to fine the firm for unfair trade.
