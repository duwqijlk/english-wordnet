simpleMeaning: Stolen by the Persians in 1739 and then lost, this gold seat was made for the kings of
  Delhi long ago, a mark of the past Shah of Iran.
scope: The gold seat of the old kings of Delhi, stolen in 1739 and then lost, not a king's seat still
  in use today.
examples:
- The peacock-throne was the golden seat of the kings of Delhi.
- The Persians stole the peacock-throne in 1739, and it was never found again.
