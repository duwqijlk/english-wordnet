simpleMeaning: In genetics, a one-letter change in the DNA code that is common enough to recur in a large
  share of a species; usually counted as a successful point mutation.
scope: This is a one-letter DNA difference that is widespread in a species, not a rare one-off mutation
  in a single person, and not a whole-gene duplication or other large rearrangement.
examples:
- The researchers found a single nucleotide polymorphism that appears in about a third of the population.
- Each single nucleotide polymorphism marks one letter where DNA differs between people.
