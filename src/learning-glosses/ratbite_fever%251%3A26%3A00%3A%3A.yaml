simpleMeaning: Either of two infectious illnesses people catch from the bite of a rat or mouse, marked
  by fever, headache, nausea and a skin rash.
scope: A single name covering two infections caught from a rodent bite, not other rat-borne illnesses.
examples:
- Ratbite fever can follow a bite from an infected rat or mouse.
- Fever, headache, nausea and a skin rash are signs of ratbite fever.
