simpleMeaning: A drug, sold as Cuprimine, used to treat poisoning by heavy metals, Wilson's disease and
  severe pain and swelling in the joints.
scope: A drug sold as Cuprimine that treats poisoning by heavy metals, Wilson's disease and severe pain
  and swelling in the joints, not a drug for a cold and not a drug that kills germs.
examples:
- The doctor gave her penicillamine for the metal poisoning.
- Penicillamine helped ease his stiff joints.
