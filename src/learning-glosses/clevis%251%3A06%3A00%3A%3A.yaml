simpleMeaning: A U-shaped metal fastening with holes through its prongs, joined to another part by a pin
  or bolt; used to hitch a drawbar to a plow or trailer.
scope: The U-shaped hitching piece itself, not the pin or bolt that passes through it.
examples:
- The clevis on the tractor's drawbar was worn smooth.
- He slid a pin through the clevis to lock the trailer to the wagon.
