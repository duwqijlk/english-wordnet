simpleMeaning: Soon after they come out of the egg, young birds of this kind leave the nest
scope: Soon after they come out of the egg, young birds of this kind leave the nest, not birds that stay
  in the nest for a while.
examples:
- Ducklings are nidifugous and leave the nest within a day of hatching.
- The nidifugous goslings followed their mother away from the nest at once.
