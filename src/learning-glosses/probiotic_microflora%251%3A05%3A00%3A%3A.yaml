simpleMeaning: a helpful tiny living thing that lives in the gut of a healthy mammal, often thought of
  as a plant
scope: 'Also called probiotic, probiotic bacterium, or probiotic flora: a helpful germ in the gut, not
  a germ that makes a person ill and not a true plant.'
examples:
- The doctor said the probiotic microflora in her gut help her stay well.
- Yogurt can add probiotic microflora to the gut.
