simpleMeaning: In psychology, a way of acting that happens on its own when a thing happens, and that may
  come from birth or be learned by doing it many times
scope: Also called use. This is a way of acting, not the special clothes worn by a rider or by a person
  in a religious group.
examples:
- She has a habit of biting her nails when she feels nervous.
- His habit of checking the door three times started when he was a child.
