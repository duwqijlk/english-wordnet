simpleMeaning: A person of an old Germanic people that spread from the Rhine into the Roman Empire in
  the 4th century.
scope: A member of one of the old Germanic peoples, not a Roman and not a member of another Germanic people.
examples:
- The Franks spread from the Rhine into the Roman Empire.
- A Frank lived in Gaul in the 4th century.
