simpleMeaning: On a course that heads for the south.
scope: Also called southward and southwards, this is heading for the south, not the wind itself, not the
  use for coming from the south, and not the adjective uses for what comes from or lies toward the south.
examples:
- The birds flew southerly for the winter.
- The road runs southerly to the coast.
