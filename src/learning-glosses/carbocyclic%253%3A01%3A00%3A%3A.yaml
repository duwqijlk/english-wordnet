simpleMeaning: Describing a ring made only of carbon atoms.
scope: Describing a ring made only of carbon atoms, not a chain of carbon atoms and not a ring that holds
  other kinds of atoms.
examples:
- The carbocyclic ring in this molecule is made only of carbon atoms.
- Chemists call this shape carbocyclic because its ring holds carbon alone.
