simpleMeaning: To make darker with a touch of brown, as the wings of an insect may be.
scope: To make darker with a touch of brown, not to make fully black and not to paint a colour on.
examples:
- Time will infuscate the pale wings.
- The moth's wings infuscate near the edges.
