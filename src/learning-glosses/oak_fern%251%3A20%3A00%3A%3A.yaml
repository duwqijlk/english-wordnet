simpleMeaning: Damp sour woods of the cool northern half of the world hold this bright blue-green fern
  more than any other place, though it grows in many places.
scope: A bright blue-green fern found in many places, above all in damp sour woods of the cool north.
examples:
- The oak fern grew in the damp sour woods.
- Oak ferns spread widely across the cool northern woods.
