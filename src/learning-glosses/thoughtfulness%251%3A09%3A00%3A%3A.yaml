senseId: 'thoughtfulness%1:09:00::'
synsetId: 05793513-n
simpleMeaning: thinking about something in a calm way, for a long time, with full care and attention
scope: This is deep, quiet thinking, also called reflection, contemplation, musing and rumination; it
  is not the kind, caring act sense of the same word.
examples:
- After long thoughtfulness, she finally understood what she had to do.
- He sat in thoughtfulness, turning the problem over in his mind.
