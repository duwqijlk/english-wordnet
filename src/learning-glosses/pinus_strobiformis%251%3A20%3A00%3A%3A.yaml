simpleMeaning: A pine of middling size from north-west Mexico, whose bark turns dark brown and grooved
  with age.
scope: A pine of middling size from north-west Mexico with dark brown grooved bark when old, also called
  southwestern white pine, not a pine of the United States and not the white pine of the east.
examples:
- Pinus strobiformis grows in the mountains of north-west Mexico.
- The bark of Pinus strobiformis is dark brown and deeply grooved.
