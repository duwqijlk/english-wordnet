simpleMeaning: A signal sent out by the front part of the small gland at the base of the brain, which
  switches on the outer layer of the gland above the kidney.
scope: This is also called adrenocorticotrophic hormone, adrenocorticotrophin, adrenocorticotropic hormone,
  corticotrophin, and corticotropin, and it acts on the gland above the kidney, not on the kidney itself.
examples:
- Adrenocorticotropin from the small gland woke the outer layer of the gland above the kidney.
- The blood test showed adrenocorticotropin was working as it should.
