simpleMeaning: A calming drug used to treat worry, sleeplessness and the effects of stopping drink.
scope: This is a calming drug for worry, sleeplessness and the effects of stopping drink; oxazepam is
  another name for this sense, and Serax is its trade name.
examples:
- The doctor gave her Serax to help her sleep.
- He took Serax for a short time while he stopped drinking.
