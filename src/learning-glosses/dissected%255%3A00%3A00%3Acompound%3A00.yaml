simpleMeaning: having one or more deep cuts that go almost to the main vein down the middle of a leaf
scope: 'Also called cleft: this describes a leaf with deep cuts in its edge, not a body or plant cut open
  to be studied.'
examples:
- The plant has dissected leaves, each cut in almost to the middle vein.
- She picked a dissected leaf with three deep cuts in its edge.
