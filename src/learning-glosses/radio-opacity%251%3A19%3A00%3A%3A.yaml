simpleMeaning: The way a thing stops rays used to see inside the body or other rays from passing through
scope: 'Also called radiopacity: the way a thing stops rays used to see inside the body or other rays,
  not the way it lets them through.'
examples:
- The radio-opacity of the bone made it show up white on the picture.
- Doctors check radio-opacity to see how much the rays are blocked.
