simpleMeaning: a picture in the mind like one seen with the eyes
scope: A picture in the mind like one seen with the eyes, and visualization and visualisation are other
  names for this sense; not a thing actually seen and not a dream.
examples:
- The visual image of the house stayed in her mind.
- He formed a clear visual image of the map.
