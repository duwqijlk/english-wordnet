simpleMeaning: A heater that warms a car window, a fridge, or the wings of a plane until the ice or frost
  on them is gone
scope: This heater is also called a defroster, and it clears ice or frost from car windows, fridges, and
  plane wings.
examples:
- The deicer cleared the ice from the car window.
- She switched on the deicer before driving off.
