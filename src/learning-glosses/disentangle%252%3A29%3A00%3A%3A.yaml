simpleMeaning: to make something smooth and neat, using a comb or in the way a comb does
scope: 'Also called comb: smoothing and tidying something with a comb or as if with a comb, not freeing
  a thing from a tangle and not sorting out a confused matter.'
examples:
- He disentangled his hair before going out.
- She disentangled the wool before she began to spin.
