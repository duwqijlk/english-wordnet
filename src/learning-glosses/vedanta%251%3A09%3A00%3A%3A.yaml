simpleMeaning: From the Sanskrit for 'end of the Veda', one of six accepted schools of thought rooted
  in the Upanishads, set against Mimamsa, which rests on the Vedas and Brahmanas.
scope: One of six accepted schools of thought rooted in the Upanishads; Mimamsa is a different school
  that rests on the Vedas and Brahmanas, and so is Samkhya.
examples:
- Vedanta is one of the six accepted schools of thought in Hindu philosophy.
- She studied Vedanta and its roots in the Upanishads.
