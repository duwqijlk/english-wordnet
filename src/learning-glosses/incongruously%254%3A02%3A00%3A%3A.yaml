simpleMeaning: in a way that does not fit with what is around it or what is right for the place
scope: This says how a thing looks or acts in a way that does not fit its place. It is not about a thing
  that fits well, and not about two things that are the same.
examples:
- His shirt tails stuck out incongruously from his fine party pants.
- A big red hat sat incongruously on the quiet old man's head.
