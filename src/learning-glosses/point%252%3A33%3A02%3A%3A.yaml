simpleMeaning: To be able to be positioned or aimed in a particular way.
scope: This is not to aim something deliberately, to show a direction with a finger, or to signal game;
  it describes how a thing can be positioned or aimed.
examples:
- The rifle points easily despite its long barrel.
- The telescope points smoothly in any direction.
