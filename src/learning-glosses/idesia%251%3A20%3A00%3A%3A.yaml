simpleMeaning: An Asian tree with a round crown and heart-shaped leaves that fall each year, fragrant
  greenish flowers and hanging orange-red berries, widely grown in mild climates as an ornamental.
scope: This is the Asian ornamental tree grown for its heart-shaped leaves and red berry clusters; it
  is not a tree grown for edible fruit, and not a low garden shrub.
examples:
- The idesia in the courtyard keeps its berries long after its leaves have fallen.
- Nurseries sell the idesia as an ornamental tree for mild coastal gardens.
