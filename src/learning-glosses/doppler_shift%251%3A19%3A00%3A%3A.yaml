simpleMeaning: A change in how often a wave seems to repeat as the watcher and the source move nearer
  or farther apart
scope: This is a change in how often a wave seems to repeat as the watcher and the source move nearer
  or farther apart; Doppler effect is another name for it, and it is not a change in the wave itself.
examples:
- The Doppler shift makes a siren sound higher as it nears.
- Astronomers use the Doppler shift to track moving stars.
