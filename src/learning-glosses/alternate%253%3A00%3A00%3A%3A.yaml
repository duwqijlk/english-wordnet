simpleMeaning: of leaves, branches, or other such parts, growing one at a time, first on one side of a
  stem and then on the other, never in pairs
scope: Growing one at a time on each side of a stem, never in pairs; not moving back and forth between
  two states, not taking turns at jobs, and not standing in for an actor.
examples:
- The stems have alternate leaves.
- Alternate leaves grow on each side of the stem.
