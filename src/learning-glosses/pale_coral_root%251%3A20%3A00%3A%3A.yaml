simpleMeaning: A clump-forming plant with almost leafless yellowish-green stems and matching flowers,
  each with a white lower lip, from the north of New Mexico through the Dakotas and Washington to Alaska.
scope: This is the almost leafless woodland orchid with yellowish-green stems and white-lipped flowers
  from the northern Rockies to Alaska, not the spotted coralroots with striped stems and purple markings,
  and not green-leaved orchids.
examples:
- Pale coral root grows in deep pine litter where almost no light reaches the ground.
- We counted a dozen pale coral root stems along the shaded trail.
