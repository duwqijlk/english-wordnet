simpleMeaning: a drug that speeds up the nervous system, gives more energy and makes a person less hungry;
  used to treat narcolepsy (sudden attacks of sleep) and some kinds of depression
scope: 'Also called upper, speed and pep pill: a drug that speeds up the brain and body and gives more
  energy, not the act of moving fast.'
examples:
- The doctor gave her amphetamine to treat her narcolepsy.
- He took amphetamine to stay awake, and it also made him less hungry.
