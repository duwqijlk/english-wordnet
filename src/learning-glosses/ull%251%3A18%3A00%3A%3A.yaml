simpleMeaning: In Norse myth, one of the Aesir gods, famed for his looks and his skill with bow and skis;
  the son of Sif and the stepson of Thor
scope: This god is also called Ullr; he is not Thor and not another god of the Aesir.
examples:
- Ull was famed for his skill with bow and skis.
- In the old tales, Ull was the son of Sif.
