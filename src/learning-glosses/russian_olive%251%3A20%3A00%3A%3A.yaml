simpleMeaning: A shrubby tree of Europe and western Asia that loses its leaves in winter, with grey leaves
  and small yellow fruits covered in silvery scales; at times spiny
scope: Also called silver berry and Elaeagnus augustifolia; a shrubby tree with grey leaves and yellow
  fruits, close to other silver-leaved shrubs such as the autumn olive.
examples:
- Russian olive grows well in dry soil.
- The Russian olive had grey leaves and yellow fruits.
