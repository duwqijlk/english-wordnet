simpleMeaning: the quality of being careful and wise, and of thinking well before you act
scope: A person's careful, wise way of acting; close to, but not the same as, watching out for possible
  danger or the good sense that keeps a person away from harm.
examples:
- She spoke with caution and thought about each word before she said it.
- His caution made him check the plan twice before he signed.
