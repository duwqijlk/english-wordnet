senseId: 'allegiance%1:04:00::'
synsetId: 01208643-n
simpleMeaning: The act of tying yourself, in mind or in feeling, to a way of acting.
scope: Also called loyalty, commitment, and dedication, this is tying yourself to a way of acting, not
  the faithfulness owed to one's own land or ruler.
examples:
- His allegiance to public service lasted all his life.
- They felt no allegiance to a losing team.
