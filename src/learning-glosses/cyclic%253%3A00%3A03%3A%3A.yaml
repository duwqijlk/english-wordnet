simpleMeaning: Forming a ring shape, or having its parts set out in a ring.
scope: Forming a ring or with parts set out in a ring, not the sense of a ring-shaped compound, not the
  Carnot cycle, and not the sense of repeated cycles.
examples:
- The cyclic petals formed a ring round the flower.
- Cyclic flowers open with their parts in a ring.
