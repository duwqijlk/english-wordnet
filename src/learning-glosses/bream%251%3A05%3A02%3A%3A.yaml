simpleMeaning: Any of many sea fishes of the perch-like kind, most of all those of the family called Sparidae,
  though not only those.
scope: Also called sea bream, a sea fish of the perch-like kind, most of all of the Sparidae family; not
  the freshwater fishes of the same name and not the flesh of such fishes.
examples:
- The fishermen brought in a catch of bream.
- Bream swim in the warm coastal waters.
