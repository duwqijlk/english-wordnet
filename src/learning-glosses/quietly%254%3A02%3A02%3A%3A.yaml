simpleMeaning: In a way that shows little or no action, movement or disturbance.
scope: Another name for this sense is quiet; it describes doing something with little or no action or
  disturbance, not speaking in a soft voice or resting peacefully.
examples:
- The harbour town lived quietly through the long winter months.
- After the storm, the lake lay quietly under a grey sky.
