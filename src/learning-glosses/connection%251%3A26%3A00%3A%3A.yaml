simpleMeaning: the condition of being joined or linked to something
scope: This is not the wire or plug itself and not a link of cause or shared features between things or
  events; it is the condition of being joined to a system or line.
examples:
- My phone keeps losing its connection to the network.
- The video call failed because the connection was poor.
