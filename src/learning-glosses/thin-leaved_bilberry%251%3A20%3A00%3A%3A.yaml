simpleMeaning: On this upright blueberry of the western United States, the flowers stand alone and the
  berries taste a little sour.
scope: People also call this bilberry, mountain blue berry, and mountain blueberry.
examples:
- We picked thin-leaved bilberry berries from the bush.
- The thin-leaved bilberry stood upright and bore single flowers.
