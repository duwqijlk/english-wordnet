simpleMeaning: A drug that calms the mind, sold under a trade name, used to treat schizophrenia, a sickness
  of the mind.
scope: Also called molindone, this is a drug that calms the mind, not a drug that puts a person to sleep.
examples:
- The doctor gave him Moban for his schizophrenia.
- Moban helped calm her mind.
