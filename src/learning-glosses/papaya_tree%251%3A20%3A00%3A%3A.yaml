simpleMeaning: With huge leaves cut deep like fingers, this warm-American shrub or small tree bears big
  long yellow fruit.
scope: 'It is also called papaya, pawpaw, melon tree and papaia: the warm-American shrub or small tree
  with huge finger-cut leaves and big long yellow fruit.'
examples:
- The papaya tree bears big long yellow fruit.
- Papaya tree leaves are cut deep like fingers.
