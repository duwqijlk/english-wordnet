senseId: 'acute_renal_failure%1:26:00::'
synsetId: 14138368-n
simpleMeaning: Burns, an injury, a sudden infection, or a block in the tubes that carry urine can make
  the organs that clean the blood stop working.
scope: This is when the organs that clean the blood stop working after burns, injury, sudden infection
  or a block in the urine tubes; acute kidney failure is another name for this sense, not a slow loss
  of the same organs' work over years.
examples:
- Acute renal failure followed the burns, and the organs that clean the blood stopped working.
- A block in the tubes that carry urine brought on acute renal failure.
