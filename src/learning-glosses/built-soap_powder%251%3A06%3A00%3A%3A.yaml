simpleMeaning: A cleaning stuff in the form of fine dry grains, mixed with a chemical that helps it clean
  better
scope: Cleaning stuff in grain form with a cleaning chemical added, not a liquid for washing and not plain
  grains with nothing added.
examples:
- She used built-soap powder to wash the greasy overalls.
- Built-soap powder cleans better than plain soap in hard water.
