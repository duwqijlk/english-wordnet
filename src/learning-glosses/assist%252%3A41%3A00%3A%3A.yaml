simpleMeaning: to work in a lower role under someone else and help them do their job
scope: This sense is working under a person in a lower role and helping them. It is not just giving help
  at any time, and it is not the act of helping as a thing.
examples:
- She assists the head teacher by taking notes and keeping the class lists.
- Tom assisted the senior nurse during her morning rounds.
