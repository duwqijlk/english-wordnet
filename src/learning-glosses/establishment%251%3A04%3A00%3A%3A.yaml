simpleMeaning: The act of starting something new, such as a group or a way of working, and putting it
  in place so it can go on
scope: The act of starting something, not the group of people who run it, and not a building or place
  where work is done.
examples:
- The establishment of the new library brought books to the whole town.
- He still remembers the establishment of the club.
