simpleMeaning: One person of an Amerindian people living in the north of Idaho, round the lake of the
  same name.
scope: This is one person of an Amerindian people living in the north of Idaho, round the lake of the
  same name, not the whole people and not a person of another Idaho people.
examples:
- He is a Coeur d'Alene from northern Idaho.
- A Coeur d'Alene elder spoke at the gathering.
