simpleMeaning: a drink made with a few kinds of rum and fruit juice, and usually a sweet apricot drink
  with alcohol in it
scope: A mixed drink made with rum and fruit juice, also called zombi. It is not the god sense of this
  word and not a dead body brought back to life.
examples:
- He ordered a zombie at the bar and drank it slowly.
- The zombie was sweet, with rum and pineapple juice in it.
