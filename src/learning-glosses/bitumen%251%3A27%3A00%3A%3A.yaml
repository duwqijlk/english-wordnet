simpleMeaning: one of a number of different mixtures found in nature that are not pure and are made of
  hydrocarbons (substances made only of hydrogen and carbon)
scope: This is a natural, not pure mixture found in the ground, not a finished road surface or roof covering
  made from it.
examples:
- Bitumen was found in the ground near the oil field.
- The workers heated the bitumen until it became soft and sticky.
