simpleMeaning: A tall Algerian evergreen of the Atlas mountains, with blue-green leaves, widely planted
  as an ornamental.
scope: Also called Atlas cedar, this tall North African evergreen has blue-green leaves and is planted
  widely for show; other cedars, pines and firs are near evergreen trees with their own names.
examples:
- Cedrus atlantica grows in the Atlas mountains of Algeria.
- Cedrus atlantica is widely planted as an ornamental tree.
