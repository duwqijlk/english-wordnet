simpleMeaning: a small metal ring set into a hole so that ropes or cords can be tied to it
scope: A metal ring that lines a hole for tying cords, not a round shape and not a flying trick.
examples:
- He passed the cord through the loop in the sail.
- The loop on the tent held the guy rope.
