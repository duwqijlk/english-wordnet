simpleMeaning: In open flat country, above all in the great grasslands of North America, lives a female
  person
scope: A female person who lives in a flat open land, above all in the Great Plains, not a person who
  lives in the hills or in a town.
examples:
- The plainswoman kept a small farm on the edge of the grassland.
- A plainswoman who had grown up there knew every road across the flat land.
