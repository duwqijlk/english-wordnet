senseId: 'quotation%1:10:01::'
synsetId: 06776392-n
simpleMeaning: a short note that says where a piece of information or a copied passage came from
scope: 'Also called mention, reference, credit, cite, acknowledgment and citation: this is the short note
  that says where words or facts came from, not the copied words themselves.'
examples:
- The quotation at the foot of the page names the book where she found the facts.
- He wrote a short quotation after the copied lines to show where they came from.
