simpleMeaning: a being with power beyond nature that people worship, said to control part of the world
  or part of life, or to stand for a force
scope: 'Also called god, immortal and divinity: a being people worship for its control over part of the
  world or life, not a human ruler and not a spirit that no one worships.'
examples:
- In the old story, the sea deity could raise or calm the waves.
- People built a temple to honour the deity of the harvest.
