simpleMeaning: The oil made by glands in the skin; with sweat it makes the skin a little wet and keeps
  it safe
scope: This is oil made by the skin itself, not sweat on its own and not oil put on the skin from a bottle.
examples:
- Too much sebum can make the skin on your face look oily.
- Sebum helps protect the skin, but too much of it can block the small holes in the skin.
