simpleMeaning: the point in the sky that is the opposite of the point the sun moves toward, and the point
  the sun and planets move away from
scope: The point in the sky opposite to the point the sun moves toward, not the point the sun moves toward
  itself and not a star or planet.
examples:
- The antapex lies in the opposite part of the sky from the solar apex.
- Stars near the antapex seem to drift away as the sun moves on.
