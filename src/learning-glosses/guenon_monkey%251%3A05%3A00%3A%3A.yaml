simpleMeaning: A small slim animal of Africa, with long back legs and a long tail and long hair round
  its face
scope: This is a small slim African monkey with long back legs and tail and long hair round its face;
  guenon is another name for this sense, not a large African monkey and not a monkey with a short tail.
examples:
- A guenon monkey swung through the trees.
- The guenon monkey's long tail helped it balance.
