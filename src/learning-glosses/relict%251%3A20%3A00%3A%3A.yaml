senseId: 'relict%1:20:00::'
synsetId: 13105393-n
simpleMeaning: In a place much changed since it first lived there, a living thing or kind still alive
  is a leftover of plants or animals that have died out.
scope: It is a living thing or kind that has outlived the plants or animals it came from, in a place much
  changed since it first lived there.
examples:
- This fern is a relict, still alive long after its kind died out elsewhere.
- This fish is a relict, a leftover of a kind that has died out.
