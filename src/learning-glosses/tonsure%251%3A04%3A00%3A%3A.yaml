simpleMeaning: the act of shaving the top of the head, done by priests or by members of a religious group
  who live together
scope: The act of shaving the top of the head in a religious custom, not the shaved top itself and not
  the verb for shaving a new monk's head.
examples:
- The tonsure of the new monks took place in the chapel.
- Tonsure was part of the rite when men joined the order.
