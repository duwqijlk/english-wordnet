simpleMeaning: those traits of body and mind that go with one gender far more than with the other
scope: Traits of body and mind that go with one gender far more than the other, also called a sex characteristic
  and a sexual characteristic; not a sex change and not a single body part.
examples:
- A deep voice is one sex character that goes with men more than women.
- Some sex characters show up at puberty.
