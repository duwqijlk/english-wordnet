simpleMeaning: To turn into a substance that has oxygen in it, or to join with oxygen
scope: 'Also called oxidize and oxidate: to join with oxygen, not to take oxygen away from a thing.'
examples:
- This metal oxidises easily in damp air.
- The iron gate oxidised after years in the rain.
