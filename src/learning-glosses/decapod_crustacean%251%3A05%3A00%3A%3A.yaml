simpleMeaning: Each leg is joined to one part of the middle of the body in these hard-shelled animals,
  which as a rule have five pairs of legs for moving
scope: Decapod is another name for these hard-shelled animals, which as a rule have five pairs of legs
  for moving, each joined to one part of the middle of the body.
examples:
- The decapod crustacean moved on its ten legs.
- Shrimps are decapod crustaceans, with five pairs of legs for moving.
