simpleMeaning: One of many bats of the Hipposideridae family, from north-west Africa or the Philippines
  or Australia, with a horseshoe-shaped leaf on the nose.
scope: One of many bats of the Hipposideridae family, from north-west Africa or the Philippines or Australia,
  with a horseshoe-shaped leaf on the nose, unlike the sense for a bat of the Rhinolophidae family with
  a horseshoe-shaped leaf on the nose.
examples:
- A horseshoe bat has a horseshoe-shaped leaf on its nose.
- Horseshoe bats live in north-west Africa.
