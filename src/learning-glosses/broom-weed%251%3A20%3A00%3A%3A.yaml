simpleMeaning: With stiff wood-like branches, sticky leaves, and yellow flowers, this plant of the southwestern
  United States lives for one year.
scope: Also called broomweed, this plant of the southwestern United States lives for one year and has
  stiff branches, sticky leaves, and yellow flowers, not a plant that lives for many years.
examples:
- The broom-weed has sticky leaves and yellow flowers.
- Broom-weed grows in the southwestern United States.
