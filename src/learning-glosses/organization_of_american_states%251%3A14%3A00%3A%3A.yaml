simpleMeaning: Most countries of the western half of the world belong to this group, set up in nineteen
  forty-eight so they work together on defense, money, society, and the arts.
scope: Also called OAS; a group of most countries in the western half of the world, not one country on
  its own and not a group for trade alone.
examples:
- Leaders from many countries met at the Organization of American States.
- The Organization of American States was set up to help countries work together.
