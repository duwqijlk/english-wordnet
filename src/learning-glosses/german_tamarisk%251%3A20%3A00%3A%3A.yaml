simpleMeaning: A shrub of Europe and Asia that looks like a similar shrub.
scope: Also called false tamarisk and Myricaria germanica; a shrub of Europe and Asia, set beside the
  tamarisk, the shrub it resembles.
examples:
- The German tamarisk by the river looks much like a tamarisk.
- A German tamarisk shrub stood beside a tamarisk, and the two looked much alike.
