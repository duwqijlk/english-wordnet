simpleMeaning: A strong ale, very dark and thick, made with hops, pale malt, roasted barley that has not
  been made into malt, and often caramel malt
scope: This is a strong dark beer. It is not the describing word for a person who is strong in body and
  used to hard work.
examples:
- He ordered a pint of stout at the bar.
- The stout had a rich, dark taste and a thick top.
