simpleMeaning: A thin bit of body tissue or blood spread on a small glass plate and given color, so doctors
  can look at its cells under a microscope to find disease
scope: A sample for a medical test, not a dirty mark on a surface and not a false attack on someone's
  good name.
examples:
- The nurse took a smear and sent it to the lab to check for disease.
- His blood smear was looked at closely under a microscope.
