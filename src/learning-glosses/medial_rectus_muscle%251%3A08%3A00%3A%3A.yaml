simpleMeaning: A cord of flesh in the eye that turns the eyeball toward the nose when it tightens
scope: A cord of flesh in the eye that pulls the eyeball toward the nose; medial rectus is another name
  for this sense, not the cord that turns the eye outward and not a cord of the eyelid.
examples:
- The medial rectus muscle pulls the eye toward the nose.
- When the medial rectus muscle tightens, the eye turns inward.
