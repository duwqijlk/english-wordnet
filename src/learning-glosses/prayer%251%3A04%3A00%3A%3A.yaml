simpleMeaning: the act of speaking to God, especially to ask for a thing, to show love, to say sorry,
  or to give thanks
scope: The act of speaking to God, especially to ask, to show love, to say sorry, or to give thanks, not
  one single spoken request to God.
examples:
- The priest sank to his knees in prayer.
- She spent an hour in prayer before bed.
