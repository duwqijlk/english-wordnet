simpleMeaning: A bushy Old World mint that lives many years, with small white or yellowish flowers and
  sweet-smelling lemon leaves, growing wild in northern Europe and North America from gardens.
scope: Also called bee balm, beebalm, garden balm, and sweet balm, a bushy Old World mint that lives many
  years, with small white or yellowish flowers and sweet-smelling lemon leaves, growing wild in northern
  Europe and North America from gardens, unlike the sense for lemony leaves used for a tisane or in soups
  or fruit punches.
examples:
- Lemon balm smells of lemon.
- They grow lemon balm.
