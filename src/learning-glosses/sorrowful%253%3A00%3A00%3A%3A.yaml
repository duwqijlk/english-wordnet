simpleMeaning: feeling, showing, or marked by deep sadness, especially the sadness of a loss that cannot
  be put right
scope: Feeling or showing deep sadness, especially for a loss that cannot be put right, not mere unhappiness
  over a small setback.
examples:
- Sorrowful widows gathered at the service.
- She told a sorrowful tale of death and despair.
