simpleMeaning: the way a boxer or fencer holds the body to protect against attacks
scope: This sense is the defensive stance of a boxer or fencer; it is not a precaution taken against harm,
  and not a device that prevents injury.
examples:
- She kept her guard high while circling her opponent.
- He dropped his guard for a second, and she scored a touch.
