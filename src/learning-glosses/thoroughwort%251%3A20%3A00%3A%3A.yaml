simpleMeaning: Once used in folk medicine, this herb of the south-east of the United States lives year
  after year and bears heads of white-rayed flowers.
scope: Also called agueweed and boneset, it is a herb of the south-east of the United States once used
  as a folk cure.
examples:
- The thoroughwort came back year after year with white flower heads.
- People once used thoroughwort in folk medicine.
