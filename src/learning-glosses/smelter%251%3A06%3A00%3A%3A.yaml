simpleMeaning: a large place with machines where rock is heated at a very high heat to get metal out of
  it
scope: This is a place where rock is heated to get metal out. It is not the person who does this work,
  and it is not the metal itself.
examples:
- The smelter outside the town runs day and night.
- Smoke rose from the smelter where copper is made from rock.
