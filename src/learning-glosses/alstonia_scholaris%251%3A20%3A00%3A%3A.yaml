simpleMeaning: An evergreen tree of eastern Asia and the Philippines with big leathery leaves and small
  green-white flowers in tight bunches; its bark was once used as medicine.
scope: An evergreen tree of eastern Asia and the Philippines, also called devil tree, dita and dita bark;
  its nearest kin are other evergreen trees with leathery leaves.
examples:
- Alstonia scholaris stood tall in the forest with big leathery leaves.
- The bark of Alstonia scholaris was once used as medicine.
