simpleMeaning: a mark (;) used to join two parts that could each be a full sentence; it shows the parts
  are linked more closely than a full stop shows
scope: This is the mark ;, used to join two parts that could each stand as a sentence, not a comma and
  not a full stop that ends a sentence.
examples:
- Use a semicolon here; the two parts are closely linked.
- She put a semicolon in her sentence; the second part added a closely linked idea.
