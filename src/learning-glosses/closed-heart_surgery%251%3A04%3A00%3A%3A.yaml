simpleMeaning: an operation on the organ that pumps blood, done through a small cut while the chest stays
  shut
scope: An operation on the blood-pumping organ done through a small cut with the chest left shut, not
  an operation in which the chest is opened.
examples:
- The baby needed closed-heart surgery to fix a small hole.
- Closed-heart surgery left only a small scar on her chest.
