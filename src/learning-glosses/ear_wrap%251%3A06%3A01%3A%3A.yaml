simpleMeaning: An earring you wear without a piercing, in many sizes, made as a small wrap or hook that
  fits over the whole ear and dangles at its rim.
scope: This is a piece of ear jewellery that needs no piercing and sits over the rim of the ear. It is
  not a stud or hoop that passes through a hole. 'Ear cuff', 'ear hook earring' and 'earcuff' are other
  names for the same item; the term is current, not dated or technical.
examples:
- He gave his sister an ear wrap for her birthday.
- The ear wrap kept slipping because it was too big.
