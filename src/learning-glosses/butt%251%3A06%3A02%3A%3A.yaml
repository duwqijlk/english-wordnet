simpleMeaning: a large barrel, especially one that holds 126 gallons, the same as 2 hogsheads (a hogshead
  is an old measure for liquid)
scope: A very large barrel for liquid, not the bottom part of a plant and not the small end left of a
  cigarette.
examples:
- The wine was kept in a large butt in the cellar.
- One butt of water held 126 gallons.
