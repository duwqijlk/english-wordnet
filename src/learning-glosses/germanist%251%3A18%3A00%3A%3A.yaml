simpleMeaning: A person who knows a great deal about the Germanic tongue, the ways of life, or the books
  of that people.
scope: A person who studies the Germanic tongue, ways of life, or books, not a person from Germany and
  not a speaker of the tongue.
examples:
- The Germanist spent years reading old books in the Germanic tongue.
- The Germanist wrote a book about Germanic culture.
