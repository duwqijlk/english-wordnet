simpleMeaning: in the direction where south and west meet, or toward that side
scope: A move or look toward the side where south and west meet, not a place in that part of a land and
  not a wind coming from there.
examples:
- The birds flew southwest for the winter.
- We drove southwest until we reached the coast.
