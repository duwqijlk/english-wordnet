simpleMeaning: In business, a company paper, usually a bond or a preferred share, that can be changed
  for another kind of company paper, usually an ordinary share
scope: In business, a company paper that can be changed for another kind, usually an ordinary share; not
  something that can be changed for an equal thing in general, and not a sofa that turns into a bed.
examples:
- The company issued convertibles to raise money.
- He bought a convertible that can be changed into ordinary shares.
