simpleMeaning: A hard plain way of religious life, usually lived with others under one rule, marked by
  giving up marriage, owning little, and obeying
scope: A hard plain way of religious life lived with others under one rule, not the life of a lone hermit
  and not ordinary church life.
examples:
- Monasticism shaped the daily life of the abbey.
- He wrote about monasticism and its rule of poverty and obedience.
