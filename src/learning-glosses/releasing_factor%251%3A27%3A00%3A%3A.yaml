simpleMeaning: One body chemical leaves a gland at the base of the brain faster because a substance made
  in a small part of the brain speeds it up.
scope: This is a substance from a small part of the brain that speeds up a gland giving out a body chemical,
  also called releasing hormone, not the body chemical itself.
examples:
- A releasing factor from the brain speeds up the gland's work.
- The releasing factor made the gland give out more of the body chemical.
