simpleMeaning: An operation that makes a new opening between the wall of the stomach and the small gut,
  done when the usual opening has gone.
scope: This is an operation that makes a new opening between the stomach wall and the small gut, not one
  that joins the stomach to the skin and not one that closes a hole.
examples:
- The surgeon did a gastroenterostomy after the blockage.
- A gastroenterostomy lets food pass into the gut.
