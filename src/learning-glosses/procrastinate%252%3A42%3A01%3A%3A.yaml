schema: oewn-learning-gloss-v2
senseId: 'procrastinate%2:42:01::'
synsetId: 02648694-v
simpleMeaning: to put off doing something until later when there is no need to wait
scope: This means putting a thing off for no good reason, not stopping it for good and not waiting when
  waiting is needed.
examples:
- He keeps procrastinating and leaves his work until the last day.
- Do not procrastinate; start the letter now, as there is no reason to wait.
