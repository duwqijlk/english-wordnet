simpleMeaning: A common spring plant of American woods, with leaves that wrap the stem and an upright
  club-shaped spike with a green and purple hood over it, making scarlet berries.
scope: 'Also called jack-in-the-pulpit, wake-robin, Arisaema atrorubens, or Arisaema triphyllum: a common
  spring plant of American woods, not a turnip and not a garden lily.'
examples:
- The Indian turnip blooms in the spring woods.
- We found an Indian turnip with scarlet berries.
