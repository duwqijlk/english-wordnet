simpleMeaning: The teaching, held as wrong by the church and tied to the Gnostics, that Jesus had no human
  body and his pain and death on the cross only seemed real.
scope: This is the teaching, tied to the Gnostics and held as wrong by the church, that Jesus had no human
  body and his pain and death on the cross only seemed real, set against the teaching that Jesus truly
  had a human body and truly suffered and died on the cross.
examples:
- Docetism taught that Christ's sufferings only seemed real.
- The early church called Docetism a heresy.
