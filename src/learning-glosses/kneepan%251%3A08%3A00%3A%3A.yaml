senseId: 'kneepan%1:08:00::'
synsetId: 05285894-n
simpleMeaning: A small flat three-sided bone in front of the knee that shields the joint where the leg
  bends.
scope: A small flat three-sided bone in front of the knee that shields the joint; kneecap and patella
  are other names for this sense, not the shin bone and not the thigh bone.
examples:
- The kneepan protects the knee joint when you fall.
- She bruised her kneepan on the hard floor.
