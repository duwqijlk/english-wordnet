simpleMeaning: May change without warning, and no one can tell what it will do next
scope: Likely to change suddenly in ways no one can guess; fickle is another name for this sense; not
  steady and regular, and not changing only once.
examples:
- His erratic behaviour worried his friends, who never knew what he would do next.
- The erratic weather changed from sun to rain in an hour.
