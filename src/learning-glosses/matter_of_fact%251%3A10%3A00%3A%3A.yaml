senseId: 'matter_of_fact%1:10:00::'
synsetId: 06797174-n
simpleMeaning: A jury is left to settle a point about what happened, in most cases, when it is in dispute
scope: 'Also called question of fact: a point about what happened, in dispute and left for a jury to settle,
  not a point about what the rules say and not a point no one disputes.'
examples:
- Whether he was at the scene was a matter of fact for the jury.
- The judge left that matter of fact to the jury to decide.
