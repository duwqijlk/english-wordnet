simpleMeaning: a row of split logs laid across each other at a slant, usually put up to mark off land
scope: 'Also called a split-rail fence: a row of crossed split logs that marks off land, not a fence of
  wire and not a solid wooden wall.'
examples:
- They built a rail fence along the edge of the field.
- The old rail fence was made of split logs crossed at an angle.
