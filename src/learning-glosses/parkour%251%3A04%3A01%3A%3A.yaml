simpleMeaning: An athletic discipline in which people move through any setting as efficiently as possible
  using their bodies, commonly by running, jumping, vaulting, rolling and other similar physical movements.
scope: This names the whole athletic discipline, not one of its individual techniques such as a vault
  or a roll.
examples:
- She practises parkour in the city every weekend.
- Parkour involves running, jumping and vaulting through the city.
