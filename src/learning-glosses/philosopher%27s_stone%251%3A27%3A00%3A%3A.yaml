simpleMeaning: A made-up stuff that old seekers of gold thought could turn cheap metals into gold.
scope: A made-up stuff that old seekers of gold thought could turn cheap metals into gold; elixir and
  philosophers' stone are other names for this sense, not a real metal and not a jewel.
examples:
- The alchemist spent his life hunting the philosopher's stone.
- Legends say the philosopher's stone could make gold from lead.
