simpleMeaning: a student near the end of training to be a doctor, or a new doctor, who learns by doing
  real work while a senior doctor watches over them
scope: This person, also called intern and also called houseman, is learning to be a doctor by doing real
  work with help; it is not a fully trained doctor working alone and not a student in another subject.
examples:
- The interne checked the patient while the senior doctor watched.
- As an interne, she worked long hours in the hospital.
