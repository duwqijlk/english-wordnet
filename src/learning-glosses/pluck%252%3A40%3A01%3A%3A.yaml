simpleMeaning: To sell things to people, or get things from them, by putting a lot of energy into it and
  most of all by dishonest dealing
scope: 'Also called roll: to sell to people or get things from them by energetic, dishonest dealing, not
  pulling a string and not showing courage.'
examples:
- He plucked money from careless buyers with his quick talk.
- They plucked goods from the crowd by sly dealing.
