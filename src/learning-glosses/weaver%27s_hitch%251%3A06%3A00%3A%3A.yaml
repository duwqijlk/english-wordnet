simpleMeaning: a knot used for a short time to tie a rope to the middle of a second rope, or to a ring
scope: 'Also called becket bend, sheet bend and weaver''s knot: a knot used for a short time to tie a
  rope to the middle of a second rope, not a knot meant to hold fast for good and not a knot tied at the
  end of a rope.'
examples:
- He used a weaver's hitch to tie the line to the middle of the long rope.
- The weaver's hitch held the small rope to the ring until the work was done.
