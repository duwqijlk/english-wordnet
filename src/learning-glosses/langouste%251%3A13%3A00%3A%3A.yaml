simpleMeaning: From warm seas, this clawless lobster reaches the shops most often as frozen tails from
  Australia and South Africa, though fishermen catch it too in Florida and California.
scope: Also called crayfish, rock lobster, and spiny lobster, this is a clawless warm-water lobster, not
  a true lobster with claws and not the large spiny crustacean that shares its name.
examples:
- The langouste on the menu came as a frozen tail from Australia.
- Fishermen catch langouste off the Florida coast.
