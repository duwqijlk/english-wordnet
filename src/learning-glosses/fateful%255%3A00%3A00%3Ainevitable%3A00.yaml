simpleMeaning: set or decided beforehand by a power that people cannot change, so it must happen
scope: 'Also called fatal: fixed beforehand and sure to happen, not just very important and not bringing
  ruin.'
examples:
- Their fateful meeting seemed set by fate long before they were born.
- He believed his fateful path in life was already set and could not be changed.
