simpleMeaning: Lines of six beats or of five beats, written for great deeds and lofty themes.
scope: Also called heroic and heroic verse, this is a verse form for great deeds, not free verse with
  no set beat.
examples:
- The poet wrote the epic in heroic meter.
- Heroic meter suits the telling of great deeds.
