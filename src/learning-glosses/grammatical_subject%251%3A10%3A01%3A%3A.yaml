simpleMeaning: a noun or pronoun that stands first in a plain English sentence and points ahead to later
  words that give the real thing the sentence is about
scope: The word that stands first in a plain sentence and points ahead to the real thing the sentence
  is about, not the doer of the action in meaning and not the object of the sentence.
examples:
- In the sentence 'the bear was killed by the hunter', 'the bear' is the grammatical subject.
- The teacher asked us to find the grammatical subject of each sentence.
