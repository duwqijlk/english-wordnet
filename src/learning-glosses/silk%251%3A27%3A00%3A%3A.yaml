simpleMeaning: thin threads made by the young of one kind of moth, by other young insects that make cases
  to live and grow in, and by most spiders
scope: The thin threads themselves, made by insects and spiders; not the cloth made from such threads.
examples:
- A spider's web is made of fine silk.
- The small worm makes silk to build a case around itself.
