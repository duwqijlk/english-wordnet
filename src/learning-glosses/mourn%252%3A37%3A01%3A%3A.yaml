simpleMeaning: to follow the usual ways of showing great sadness after someone you love has died
scope: This is about following the usual ways of showing sadness after a death, not just feeling sad inside.
examples:
- They mourned by wearing black and staying at home for forty days.
- The family mourned in the way their people had always done after a death.
