simpleMeaning: the clear, fast change of a larva, a young form of an animal, into a full adult, as happens
  in some animals
scope: 'Also called metamorphosis: the fast change from a young form to an adult in some animals, not
  the body processes that keep a living thing alive.'
examples:
- Butterflies go through metabolism as they change from a caterpillar into an adult.
- In this kind of metabolism, a tadpole quickly changes into a frog.
