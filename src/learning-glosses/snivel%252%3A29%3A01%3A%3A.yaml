simpleMeaning: to cry or complain in a weak voice while breathing in through the nose in short, noisy
  breaths
scope: 'Also called sniffle, also called snuffle, also called blubber, and also called blub: crying or
  complaining with noisy breaths through the nose, not just pulling liquid up through the nose.'
examples:
- The child snivelled in the corner, crying and complaining in a weak voice.
- '''Stop snivelling and tell me what is wrong,'' she said to the crying boy.'
