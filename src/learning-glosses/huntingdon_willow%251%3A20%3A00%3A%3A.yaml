simpleMeaning: A big tree of Europe, Asia and North Africa, with pale grey-white leaves and grey bark.
scope: This is a big tree of Europe, Asia and North Africa with pale grey-white leaves and grey bark;
  white willow and Salix alba are other names for it; not a small garden willow and not a weeping willow.
examples:
- A Huntingdon willow shades the far end of the garden.
- The Huntingdon willow has grey bark and pale leaves.
