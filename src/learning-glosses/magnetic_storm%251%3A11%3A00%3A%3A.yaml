simpleMeaning: A sudden upset in the earth's field of force, caused when the sun throws out a stream of
  tiny bits of matter.
scope: A sudden upset in the earth's field caused by bits of matter thrown out by the sun; not a storm
  of wind and rain and not a solar flare itself.
examples:
- A magnetic storm made compass needles swing wildly.
- The magnetic storm upset radio signals for a day.
