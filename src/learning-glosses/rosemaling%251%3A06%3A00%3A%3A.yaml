simpleMeaning: a style of carved or painted decoration from Scandinavia, made of flower shapes and used
  on furniture, walls, and dishes
scope: A Scandinavian style of flower decoration, not a plain paint job and not a carved pattern of animals.
examples:
- Rosemaling covered the wooden chest with flowers.
- She learned rosemaling from her grandmother in Norway.
