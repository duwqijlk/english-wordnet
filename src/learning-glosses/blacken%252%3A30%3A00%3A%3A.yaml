simpleMeaning: to make something the darkest colour, or to become the darkest colour
scope: Also called black. This sense is making or becoming the darkest colour in any way, not burning
  something a little on the outside.
examples:
- Smoke blackened the white walls over the winter.
- The old silver blackened with age.
