simpleMeaning: A metal that joins with many other atoms, like chromium and tungsten in what it does; it
  makes steel stronger and harder.
scope: This is a metal, not a steel itself; also called Mo and atomic number 42.
examples:
- Molybdenum makes steel stronger and harder.
- Molybdenum joins with many other atoms.
