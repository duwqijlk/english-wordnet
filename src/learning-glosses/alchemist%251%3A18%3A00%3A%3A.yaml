simpleMeaning: Someone in the past skilled in a practice who sought a drink for long life, a cure for
  all illness, a liquid that dissolves all things, and a magic stone
scope: This is a person from the past who did this work and sought those things, not a present-day scientist
  or doctor.
examples:
- The alchemist spent years searching for a stone that could change metal into gold.
- An old alchemist tried to make a drink that would let people live for a long time.
