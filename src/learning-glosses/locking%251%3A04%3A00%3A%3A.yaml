simpleMeaning: the act of shutting a thing away with a lock to keep it safe
scope: The act of shutting a thing away with a lock to keep it safe, not the act of opening it.
examples:
- The locking of the gates at night kept the yard safe.
- Locking the chest protected the papers inside.
