simpleMeaning: A low plant of the American west that lives for many years, with many branches and silver
  leaves; a key plant for animals to eat and hide in
scope: This is a low plant of the American west with silver leaves; grey sage is another name for it,
  not a tall plant and not a plant of the east.
examples:
- Gray sage grows across the dry plains.
- Deer eat gray sage and hide among its branches.
