simpleMeaning: Attack an enemy, an opponent or a target as part of a planned operation.
scope: This is another name for the attack sense of hit — a planned assault on an enemy or target — not
  a blow with the hand or a sudden illness.
examples:
- The rebels struck the garrison at dawn.
- Our forces struck the enemy's supply lines.
