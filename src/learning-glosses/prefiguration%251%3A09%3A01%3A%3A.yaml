senseId: 'prefiguration%1:09:01::'
synsetId: 05947827-n
simpleMeaning: Something that comes first and points to what is still to come
scope: This is something that comes first and points to what is still to come, not the act of giving vague
  hints beforehand and not a plain warning.
examples:
- The small protest was a prefiguration of the larger strike to come.
- His early success was a prefiguration of his later fame.
