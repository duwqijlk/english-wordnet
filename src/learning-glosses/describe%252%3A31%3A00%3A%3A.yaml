simpleMeaning: work out which kind of living thing something is, as is done in botany or biology
scope: Another name for identify, key, key out, name, discover and distinguish in this scientific sense.
  It is not the everyday sense of telling what something is like, and not the sense of making marks on
  a surface.
examples:
- The botanist described the specimen as a kind of fern.
- In the guide, each bird is described by its family and species.
