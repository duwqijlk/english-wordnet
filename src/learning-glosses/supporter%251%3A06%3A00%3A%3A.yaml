simpleMeaning: A band, usually stretchy, worn round the leg to hold up a stocking, or round the arm to
  hold up a sleeve
scope: A band worn to hold up a stocking or a sleeve, not a person who backs a team and not a band worn
  to support the body during hard exercise.
examples:
- She wore supporters to keep her stockings up.
- The supporter held his sleeve in place.
