simpleMeaning: a way made for extra water to go over or around a dam or other thing that blocks it
scope: A way for extra water to pass a dam. It is not the liquid that has run out, and not the act of
  letting a liquid run out.
examples:
- The spill by the dam took the extra water away after the rain.
- Workers checked the spill to make sure extra water could pass the dam.
