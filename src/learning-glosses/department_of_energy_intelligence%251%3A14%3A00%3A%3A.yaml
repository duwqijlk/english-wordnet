simpleMeaning: A part of the government that gathers facts about politics, money, and how power is made
  and used, and shares the power office's know-how with other secret services
scope: Also called DOEI; the part of the government that gathers facts about energy matters for the Department
  of Energy and shares its know-how with other members of the Intelligence Community.
examples:
- The Department of Energy Intelligence shares know-how with other secret services.
- Department of Energy Intelligence officers gather facts about power.
