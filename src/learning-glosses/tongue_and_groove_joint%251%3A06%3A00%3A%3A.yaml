simpleMeaning: a way of fixing two boards together by fitting a raised strip on the edge of one board
  into a cut slot on the edge of a second board
scope: A way of fixing two boards together, with a raised strip that fits into a cut slot; not boards
  fixed with nails or glue, and not boards simply laid edge to edge.
examples:
- The tongue and groove joint held the floor boards tight with no gaps.
- He cut a tongue and groove joint so the two boards would lock together.
