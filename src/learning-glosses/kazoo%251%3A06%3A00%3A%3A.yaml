simpleMeaning: A toy you blow into that makes a sound when you hum into its mouthpiece, through a thin
  skin inside it
scope: This is a toy you blow into that makes a sound when you hum into its mouthpiece, not a flute or
  a trumpet and not a toy that you hit or shake.
examples:
- The child played a tune on the kazoo.
- He hummed into the kazoo and it buzzed.
