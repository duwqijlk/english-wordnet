synsetId: 05502269-n
simpleMeaning: the back part of the brain, the main place where sight signals arrive by nerve threads
  from the lateral geniculate body, a small deep part of the brain
scope: The main place in the back of the brain where sight signals first arrive; striate area and striate
  cortex are other names for this sense. Not the eye itself, and not other parts of the brain that handle
  what is seen later.
examples:
- Damage to the first visual area left him unable to see things on one side.
- Signals from the eyes reach the first visual area before they go on to other parts of the brain.
