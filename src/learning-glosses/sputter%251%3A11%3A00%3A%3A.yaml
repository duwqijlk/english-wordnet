simpleMeaning: the sound made when something bursts out in drops
scope: 'Also called splatter, spatter, and splutter: the sound of something bursting out in drops, not
  words spoken in anger and not the act of spitting something out.'
examples:
- From the kitchen came the sputter of hot oil in the pan.
- He heard the sputter of gunfire in the distance.
