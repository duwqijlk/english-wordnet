simpleMeaning: Holding the sharp part of vinegar, wood alcohol, acetone, wood oils, and tars, this red-brown
  liquid is made by heating wood until it gives off steam.
scope: 'Also called wood vinegar, this red-brown liquid stands apart from other liquids made from wood
  by what it holds: the sharp part of vinegar, wood alcohol, acetone, wood oils, and tars.'
examples:
- The pyroligneous acid held acetone, wood oils, and tars.
- Pyroligneous acid came from heating wood until it gave off steam.
