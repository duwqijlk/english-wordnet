simpleMeaning: Shown in a plain, simple way that uses marks or shapes to stand for the real thing.
scope: Shown in a plain, made-up way, not a thing done by set rules, not a set piece of language, and
  not a grand dance.
examples:
- The formal drawing showed the machine in simple lines and marks.
- The formal map used small signs to stand for roads and rivers.
