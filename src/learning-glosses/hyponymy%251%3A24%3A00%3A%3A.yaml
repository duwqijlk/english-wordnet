senseId: 'hyponymy%1:24:00::'
synsetId: 13830065-n
simpleMeaning: In the study of word meanings, the link in which one word names a narrower group that sits
  under another word.
scope: The word-meaning link in which one word stands below another as the narrower term; subordination
  is another name for it, not the link in which a word stands above as the wider term.
examples:
- In class we learned that hyponymy links 'dog' to 'animal'.
- Hyponymy is the link between a narrow word and a wider one.
