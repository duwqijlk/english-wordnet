simpleMeaning: a flower making seed when its own dust moves from the parts that make the dust to the part
  that takes it in
scope: A flower making seed with its own dust, not seed made with dust from another flower, and not seed
  made by hand.
examples:
- Self-pollination lets the plant make seed without help from bees.
- The tomato plant used self-pollination to set fruit.
