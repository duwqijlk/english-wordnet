simpleMeaning: A star shape with five points, drawn by five straight lines joining the corners of a five-sided
  figure, with a smaller five-sided figure inside.
scope: Also called a pentacle, a five-pointed star drawn with five straight lines joining the corners
  of a five-sided figure.
examples:
- The pentagram was chalked on the floor of the old hall.
- He wore a silver pentagram on a chain round his neck.
