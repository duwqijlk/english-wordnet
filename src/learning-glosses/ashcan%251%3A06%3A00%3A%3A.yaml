simpleMeaning: a container that holds rubbish until it is taken away
scope: 'Also called ash bin, ash-bin, ashbin, dustbin or garbage can: a container that holds rubbish until
  it is taken away, not a small indoor wastebasket and not a rubbish bag.'
examples:
- He dragged the ashcan to the curb on collection day.
- The ashcan was full of old papers and kitchen rubbish.
