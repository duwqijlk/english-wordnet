simpleMeaning: a business project that people start even though it may lose money, because they hope it
  will make money
scope: A business plan that may lose money but is meant to make money. Not any bold try with an unknown
  end, and not money put in at great risk for a big gain.
examples:
- The new shop was a venture that lost money in its first year.
- Their food truck venture made a good profit after a slow start.
