simpleMeaning: Its eggs are kept warm on their own till they hatch in a heap of sand, and it is a bird
  of Australia.
scope: It is also called lowan and mallee fowl, and its eggs hatch in a heap of sand.
examples:
- The leipoa laid its eggs in a heap of sand.
- Leipoa eggs hatch in the warmth of the sandy heap.
