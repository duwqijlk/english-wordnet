simpleMeaning: the open space between the small inner lips of the birth canal, holding the hole where
  urine leaves the body
scope: The open space between the small inner lips of the birth canal, holding the hole where urine leaves
  the body, not the birth canal itself and not the outer lips.
examples:
- The vestibule of the vagina is the space between the small inner lips.
- Urine leaves the body through the hole in the vestibule of the vagina.
