simpleMeaning: having to do with notes played together, or made up of them, or with them made to stand
  out
scope: A word for music made of notes played together; not a word for music in which one tune is played
  after another.
examples:
- The piece is chordal, with rich groups of notes in every bar.
- She liked the chordal sound of the music more than the thin single line.
