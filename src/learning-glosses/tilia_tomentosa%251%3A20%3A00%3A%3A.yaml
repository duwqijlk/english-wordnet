scope: A large tree of east Europe and Asia Minor, also called silver lime and silver linden, with white
  woolly hair on the underside of its leaves.
examples:
- Tilia tomentosa lines the avenue with its broad leaves.
- We planted Tilia tomentosa in the park because its leaves are white underneath.
