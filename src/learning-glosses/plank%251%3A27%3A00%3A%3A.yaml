simpleMeaning: a long, thick, flat piece of cut wood; it comes in many sizes and is used for many jobs
scope: 'Also called board: a long piece of cut wood used for building and other jobs; not the verb uses,
  to cook and serve food on wood or to cover something with wood.'
examples:
- He laid a thick plank across the stream to walk over.
- Workers carried each heavy plank to the new floor.
