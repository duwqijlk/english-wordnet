simpleMeaning: With narrow wings like feathers when it has any, this tiny bug, one of many kinds, sucks
  sap from plants, and many of its kind do them harm.
scope: Also called thrip and thrips, this is one of the tiny bugs that suck sap from plants.
examples:
- The thripid on the leaf was hard to see, it was so tiny.
- On the plant, thripids fed on the sap and did it harm.
