simpleMeaning: a unit for measuring weight, used in East Asia, equal to about 1.3 ounces
scope: A unit for weight used in East Asia, about 1.3 ounces; it is not a unit for length, time, or how
  much liquid a thing holds.
examples:
- The shop weighed out two taels of tea for her.
- He paid for one tael of silver by weight.
