simpleMeaning: Any one of a group of Indic tongues spoken in Kashmir and eastern Afghanistan and northern
  Pakistan.
scope: 'Also called Dard and Dardic language: any one of a group of Indic tongues spoken in Kashmir, eastern
  Afghanistan and northern Pakistan, set apart from other Indic tongues by its place.'
examples:
- Dardic covers several tongues spoken in the high valleys of Kashmir.
- She studies Dardic and its sister tongues.
