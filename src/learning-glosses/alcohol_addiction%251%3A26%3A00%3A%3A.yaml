senseId: 'alcohol_addiction%1:26:00::'
synsetId: 14088126-n
simpleMeaning: A lasting condition in which someone is regularly intoxicated and keeps drinking heavily,
  so health breaks down and the body depends on drink, with severe symptoms on stopping.
scope: This is the long-term condition with dependence and withdrawal, not a single episode of being drunk
  or a mere craving for drink.
examples:
- His alcohol addiction cost him his job and his family.
- Treatment for alcohol addiction often starts with managing the withdrawal symptoms.
