simpleMeaning: to add the white, crystal-like food substance to something so that it tastes sweet.
scope: This is the act of adding it, not the substance itself and not the biological class of energy-giving
  substances.
examples:
- The recipe tells you to sugar the fruit before baking.
- He sugared his coffee generously.
