simpleMeaning: In the wrist, on the thumb side of the hand, the first and second long bones of the palm
  meet this bone at a joint.
scope: Also called os trapezium and trapezium bone, it is the wrist bone on the thumb side of the hand,
  not one on the little-finger side.
examples:
- The trapezium sits at the base of the thumb, where the wrist meets the hand.
- On the thumb side of the wrist lies the trapezium.
