simpleMeaning: a sweet drink made from grapes dried in part in the sun on the vine or on mats of dried
  stalks
scope: A sweet drink made from grapes dried in part in the sun; not a dry drink and not a drink made from
  fresh grapes.
examples:
- Straw wine is sweet because the grapes dry in the sun.
- They served straw wine with the fruit at the end of the meal.
