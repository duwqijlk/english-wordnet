simpleMeaning: a youth circle in 1950s America that dropped property, ordinary jobs and conventional dress
  for shared homes, psychedelic drugs and anarchism, and took to modern jazz such as bebop.
scope: Another name for the 1950s US youth subculture also called the beat generation or beatniks, not
  drum strokes or a musical pulse.
examples:
- The beats shared cheap flats and avoided steady work.
- The beats admired bebop and wrote experimental poetry.
