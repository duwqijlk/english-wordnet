simpleMeaning: How the parts of a thing fit each other in a design, each part in a good size next to the
  rest
scope: 'Also called balance: how the parts of a whole fit each other in a pleasing way in a design, not
  the number you get by dividing a part by the whole and not the verb sense of shaping parts to fit.'
examples:
- The architect praised the proportion of the tall windows to the low roof.
- Good proportion makes the whole building look right.
