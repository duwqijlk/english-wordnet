simpleMeaning: the act of going into a place or area, often in large numbers
scope: This is going into a place or area, often in large numbers, not a mistake that brings blame or
  a duty to pay.
examples:
- The incursion of television into family life changed how people spent their evenings.
- An incursion by hundreds of fans onto the field stopped the game.
