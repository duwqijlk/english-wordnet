simpleMeaning: 'Of a competition or its sides: neither is better than the other.'
scope: This is about a contest or its sides being evenly matched; close is another name for this sense,
  not clothing that fits closely or a rope pulled straight.
examples:
- The final was tight, and neither team led by more than two points.
- With three games left, the race for second place is tight.
