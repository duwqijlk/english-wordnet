simpleMeaning: likely to spread, especially into good, healthy parts of the body
scope: This sense is about a disease or growth spreading into healthy parts of the body; it is not a medical
  way of entering the body, and not an attack by an army.
examples:
- The invasive cancer spread into healthy tissue around it.
- Doctors were worried about the invasive disease spreading to healthy parts of the body.
