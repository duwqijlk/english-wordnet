simpleMeaning: Even when loss or hurt may follow, a person shows brave, firm purpose and does not back
  down
scope: The trait of staying brave and firm, also called pluck and pluckiness, even when you may lose or
  be hurt, not a quick temper and not a lack of care.
examples:
- Her gutsiness showed when she kept climbing after the fall.
- It takes gutsiness to speak up when you might lose your job.
