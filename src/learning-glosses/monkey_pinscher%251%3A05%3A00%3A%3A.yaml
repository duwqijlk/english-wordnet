simpleMeaning: Like a terrier in looks, this small European dog has dark stiff hair and a tuft like a
  beard round its mouth.
scope: It is also called affenpinscher and monkey dog, and it is a small European breed of dog.
examples:
- She brushed the monkey pinscher's dark wiry hair before the show.
- The monkey pinscher trotted after her, its tufted muzzle sniffing the air.
