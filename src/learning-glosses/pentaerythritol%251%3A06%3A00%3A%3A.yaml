senseId: 'pentaerythritol%1:06:00::'
synsetId: 03918447-n
simpleMeaning: A drug, sold as Peritrate, that opens up the blood tubes of the heart, used to treat pain
  in the chest from the heart.
scope: A drug sold as Peritrate that opens up the heart's blood tubes to treat chest pain, not a drug
  for a headache and not a drug that lowers the heat of a fever.
examples:
- The doctor gave him pentaerythritol for his chest pain.
- Pentaerythritol eased the tight pain when he walked.
