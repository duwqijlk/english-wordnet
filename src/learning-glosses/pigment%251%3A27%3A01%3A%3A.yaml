senseId: 'pigment%1:27:01::'
synsetId: 15015290-n
simpleMeaning: any substance in plant or animal tissues (the material their bodies are made of) that gives
  them their color
scope: This sense is the coloring substance found in a plant or an animal body, not dry coloring material
  made to mix for paint and not the action of becoming colored.
examples:
- The green pigment in leaves helps them use sunlight.
- A pigment in her skin gives it its brown color.
