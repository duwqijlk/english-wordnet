simpleMeaning: a person who shows scorn for others by what they say or by the look on their face
scope: A person who shows scorn by words or looks, also called scorner; not a person who laughs and not
  a person who simply disagrees.
examples:
- The sneerer curled his lip at the young singer's effort.
- The sneerer mocked the plan with a cold smile.
