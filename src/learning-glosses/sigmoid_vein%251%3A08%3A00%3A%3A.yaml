simpleMeaning: Blood from the lower part of the large gut flows out through small tubes that join the
  lower of the large blood tubes in the belly.
scope: Doctors also call it vena sigmoideus, and it is one of the small tubes that feed into a larger
  blood tube in the belly rather than the large tube itself.
examples:
- Blood leaves the lower gut through the sigmoid vein.
- The sigmoid vein joins the lower of the large blood tubes in the belly.
