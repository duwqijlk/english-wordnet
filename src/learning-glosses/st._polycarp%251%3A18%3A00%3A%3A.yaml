simpleMeaning: A Greek bishop of Smyrna who would not give up his Christian faith and was burned to death
  by pagans (about 69-155)
scope: Also called Polycarp and Saint Polycarp; a Greek bishop of Smyrna who would not give up his Christian
  faith and was burned to death by pagans, its near kin being other early Christian bishops such as Ignatius
  of Antioch and Clement of Rome.
examples:
- St. Polycarp refused to give up his Christian faith.
- St. Polycarp was burned to death by pagans in Smyrna.
