simpleMeaning: The act of making a thing less wide than it was.
scope: The act of making a thing less wide, not one time when a thing grows narrow by itself and not a
  state of affairs that shuts in freedom.
examples:
- The narrowing of the channel was done to speed the flow.
- Narrowing the sleeves changed the look of the coat.
