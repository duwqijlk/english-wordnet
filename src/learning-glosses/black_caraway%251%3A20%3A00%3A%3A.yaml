simpleMeaning: A herb of the lands round the Mediterranean Sea, with sharp-tasting seeds used like the
  seeds of a related spice plant.
scope: A herb of the lands round the Mediterranean Sea, with sharp-tasting seeds used like the seeds of
  a related spice plant; nutmeg flower is another name for this sense, not a herb of northern Europe and
  not a plant grown for its leaves.
examples:
- Black caraway seeds flavor the bread.
- She grew black caraway for its pungent seeds.
