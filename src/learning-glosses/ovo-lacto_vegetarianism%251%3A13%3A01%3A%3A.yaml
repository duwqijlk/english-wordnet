senseId: 'ovo-lacto_vegetarianism%1:13:01::'
synsetId: 92442104-n
simpleMeaning: A mainly plant-based eating pattern that also allows some animal products, such as eggs
  (ovo), milk and cheese (lacto), but no meat, fish or poultry.
scope: Another name for lacto-ovo vegetarianism; unlike veganism it allows eggs and dairy, and it is not
  the dairy-only or egg-only version.
examples:
- She follows ovo-lacto vegetarianism, so she eats eggs and cheese but no meat or fish.
- Ovo-lacto vegetarianism allows milk and eggs while leaving out poultry and fish.
