simpleMeaning: a chemical made by the yellow body in the ovary in the last days of pregnancy; it loosens
  bands that hold the pelvis and gets the womb ready for birth
scope: A chemical made late in pregnancy that loosens the pelvis, not a drug that calms the nerves.
examples:
- Relaxin loosens the pelvic ligaments late in pregnancy.
- The doctor said relaxin helps get the womb ready for birth.
