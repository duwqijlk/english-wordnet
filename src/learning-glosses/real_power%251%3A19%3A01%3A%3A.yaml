simpleMeaning: The part of the flow of energy that, over one full wave, ends up moving in one direction
scope: 'Also called active power: the part of the flow that does work over a full wave, not reactive power,
  which flows back and forth with no net gain.'
examples:
- The meter showed how much real power the factory was using.
- Only part of the current counts as real power; the rest flows back to the source.
