simpleMeaning: A return that is in step with what goes in and adds to it.
scope: 'Also called regeneration: what comes back adds to what went in, in step with it, not the kind
  of feedback that cuts the input down.'
examples:
- The microphone's squeal was caused by positive feedback from the speaker.
- Positive feedback made the small rise in heat grow larger and larger.
