simpleMeaning: Wound in a spiral and marked with bright colours, the shell of this sea snail comes from
  warm seas.
scope: It is a sea snail of warm seas, told from the small salamander of the same name by its bright spiral
  shell.
examples:
- The triton's shell was wound in a bright spiral.
- The triton in the warm sea had a shell wound in a spiral.
