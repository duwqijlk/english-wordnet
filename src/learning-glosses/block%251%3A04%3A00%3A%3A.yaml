simpleMeaning: the act of getting in the way of someone who is moving, or making them turn aside
scope: This is the act of getting in someone's way while they move or making them turn aside, not a grooved
  wheel for a rope, not the metal casing of an engine, and not an object that plugs a pipe.
examples:
- His block at the goal line saved the game.
- The referee penalized the player for an illegal block.
