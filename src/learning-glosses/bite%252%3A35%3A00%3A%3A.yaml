senseId: 'bite%2:35:00::'
synsetId: 01448551-v
simpleMeaning: To use the teeth or jaws to hold, cut off, or tear something, or to do so as if using them.
scope: The tooth-and-jaw action of gripping or tearing, also called seizing with teeth, not causing a
  sharp sting and not the noun for the act.
examples:
- The child bit into the peach and juice ran down her chin.
- The dog bit through the rope and ran off.
