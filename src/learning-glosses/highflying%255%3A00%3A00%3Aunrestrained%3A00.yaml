simpleMeaning: Wild and over-bold in aims or views, going far past what is usual.
scope: Wild and over-bold in aims or views, not modest in aim and not sober in judgment.
examples:
- The highflying young manager promised to double sales in a year.
- After the crash, the once highflying firm went bust.
