simpleMeaning: The giving off of tiny charged bits as matter breaks down on its own.
scope: The giving off of tiny charged bits as matter breaks down on its own, also called alpha radiation;
  not the giving off of fast electrons and not the giving off of light waves.
examples:
- An alpha ray came from the old rock.
- The meter caught an alpha ray in the cave.
