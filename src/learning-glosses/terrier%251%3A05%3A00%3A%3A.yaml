simpleMeaning: one of several kinds of dog, usually small with a short body; people first trained them
  to hunt animals that live under the ground
scope: One of a group of usually small dog kinds first kept for hunting animals under the ground, not
  one single kind of dog on its own.
examples:
- She keeps a small terrier that loves to dig in the garden.
- Terriers were first used to hunt animals that live under the ground.
