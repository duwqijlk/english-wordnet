simpleMeaning: Big, eye-catching pale lavender or blue-violet flowers grow in tight bunches at the tips
  of the stems of this low, bushy plant.
scope: This low, bushy plant with big pale lavender or blue-violet flowers is also called lowbush penstemon,
  and is not a tall plant.
examples:
- The shrubby penstemon had big pale purple flowers in tight bunches.
- We planted a shrubby penstemon for its showy flowers.
