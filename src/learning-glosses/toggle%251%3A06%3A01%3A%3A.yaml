simpleMeaning: a switch with a part that is fixed at one point so it can move, and that can be in either
  of two positions
scope: A switch that can stay in either of two positions, not the act of fastening something and not an
  instruction that turns something on first and off the next time.
examples:
- He flipped the toggle to turn on the light.
- The toggle on the board can be set up or down.
