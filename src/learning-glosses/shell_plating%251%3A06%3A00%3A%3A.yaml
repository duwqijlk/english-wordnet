simpleMeaning: the plates that cover the frame of a steel ship, like the boards on a wooden ship
scope: The plates that cover the frame of a steel ship, like the boards on a wooden ship; not the deck
  and not the inner frame.
examples:
- The shell plating of the ship was dented in the storm.
- Workers riveted new shell plating to the frame.
