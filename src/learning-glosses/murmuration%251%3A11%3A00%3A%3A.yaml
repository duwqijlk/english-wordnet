simpleMeaning: Often with lips moving but no clear words coming out, a low sound that keeps going and
  cannot be made out.
scope: Also called a mutter, a murmur, muttering, murmuring, or mussitation, a low sound that keeps going
  and cannot be made out, often with lips moving but no clear words coming out.
examples:
- A murmuration rose from the crowd as they waited.
- His murmuration was hard to follow.
