simpleMeaning: a kind of everlasting flower, mostly planted widely, with flowers that are usually purple,
  from southern Europe to Iran and now also growing wild in other lands
scope: A kind of everlasting flower, usually purple, from southern Europe to Iran, not a fresh flower
  that soon fades.
examples:
- The gardener planted immortelle along the wall for its purple flowers.
- Dried immortelle keeps its colour for months in a vase.
