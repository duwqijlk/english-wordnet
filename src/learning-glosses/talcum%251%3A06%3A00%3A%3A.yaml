simpleMeaning: a powder for the body, made of cleaned, pure talc (a soft mineral) and usually with a smell
  added; it takes in extra wetness from the skin
scope: 'Also called talcum powder: this is the powder made for use on the body, not the soft mineral itself
  that it is made from.'
examples:
- She put talcum on the baby after the bath.
- He shook some talcum onto his feet to keep them dry.
