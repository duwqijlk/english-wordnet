simpleMeaning: to mark a paper with a hand-held stamp, most often to show official approval
scope: 'Also called handstamp: marking a paper with a stamp to show approval, not signing by hand and
  not printing a whole page.'
examples:
- The clerk rubberstamped the form without reading it.
- He rubberstamped the letter to show it was approved.
