simpleMeaning: To turn someone against another person, or make them stop caring, when they used to love
  that person or be friendly.
scope: To turn someone against another person or make them stop caring, also called alienate or estrange.
examples:
- Her harsh words disaffected her oldest friends.
- The new rules disaffected workers who had once loved their jobs.
