simpleMeaning: To walk in a tall proud way, most often to impress others
scope: To walk tall and proud to show off; cock, ruffle, prance and swagger are other names for this sense,
  not the stiff walk itself as a thing and not a bar that holds a thing up.
examples:
- He struts around like a rooster in a hen house.
- She strutted across the stage to take her bow.
