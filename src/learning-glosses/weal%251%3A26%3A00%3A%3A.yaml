simpleMeaning: A raised mark on the skin, as made by a whip hit, and a mark of this kind is common in
  many allergic reactions
scope: A raised mark on the skin, also called welt, wale, and wheal; not a cut in the skin and not a dark
  bruise.
examples:
- The whip left a red weal on his back.
- Weals rose on her skin after she ate the nuts.
