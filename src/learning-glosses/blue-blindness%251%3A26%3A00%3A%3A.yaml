simpleMeaning: A person with this rare trouble with colour sight cannot tell sky-coloured light from yellow,
  because they sense it less well.
scope: Also called tritanopia, this rare trouble with colour sight makes sky-coloured light and yellow
  look the same to the person who has it.
examples:
- His blue-blindness made it hard to tell the blue book from the yellow one.
- She has blue-blindness, so the blue and yellow threads looked the same to her.
