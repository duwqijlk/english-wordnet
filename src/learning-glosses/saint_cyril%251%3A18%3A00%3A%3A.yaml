simpleMeaning: A Greek man who spread the Christian faith, said to have made the writing system that bears
  his name, who lived from 826 to 869
scope: Cyril and St. Cyril are other names for this sense; this Greek missionary is set apart from other
  missionaries and other saints by the writing system said to have been made by him.
examples:
- Saint Cyril is said to have made the writing system that bears his name.
- The church honours Saint Cyril as a missionary of the ninth century.
