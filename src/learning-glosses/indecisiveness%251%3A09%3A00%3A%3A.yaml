simpleMeaning: Doubt over which of two or more ways to go.
scope: Also called indecision, doubt over which of two or more ways to go; not the trait of having no
  firmness of character or purpose.
examples:
- His indecisiveness was only momentary, but the chance was lost.
- Her indecisiveness over the two offers cost her the job.
