simpleMeaning: a simple machine for lifting things, made of a flat surface that slopes up at a sharp angle
  to the ground
scope: A flat sloping surface used as a simple machine for lifting, not a flat road and not a lever.
examples:
- A ramp is an inclined plane used to lift heavy loads.
- The workers rolled the stone up the inclined plane.
