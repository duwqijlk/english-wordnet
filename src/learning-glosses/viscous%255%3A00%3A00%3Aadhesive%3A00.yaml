simpleMeaning: sticky, like glue, and able to stick to other things
scope: Sticky like glue, also called sticky, pasty, gummy, gluey, glutinous, and viscid; this is the sticking
  sense, not the sense of a thick liquid that flows slowly.
examples:
- The viscous glue held the two pieces of wood together.
- She spread the viscous paste on the paper so the photo would stay in place.
