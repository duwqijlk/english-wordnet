simpleMeaning: Once held by Henri Bergson to drive the growth and change of living things, this supposed
  power of biology is neither of body nor of chemistry.
scope: Vitality, elan vital, and vital force are other names for a supposed power of biology, once held
  by Henri Bergson to drive the growth and change of living things.
examples:
- Bergson held that a life force drove the growth of living things.
- The life force appears in Bergson's account of how living things grow.
