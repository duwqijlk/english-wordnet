senseId: 'arteria_celiaca%1:08:00::'
synsetId: 05347865-n
simpleMeaning: 'An artery that starts from the abdominal aorta just under the diaphragm and divides into
  three branches: the left gastric, common hepatic and splenic arteries.'
scope: This is the artery that leaves the abdominal aorta just below the diaphragm, not the aorta itself
  and not the mesenteric artery that leaves the same vessel. It is also not the three arteries it splits
  into. The name is Latin, used in anatomy and medicine.
examples:
- The scan showed a widening where the arteria celiaca meets the aorta.
- Blood flow through the arteria celiaca was measured before surgery.
