simpleMeaning: In breeding, not bringing together the male and female seed cells.
scope: In breeding, not bringing male and female seed cells together, also called agamic, agamogenetic,
  agamous and apomictic; not breeding with a mate and not breeding by splitting in two.
examples:
- Parthenogenetic bees grow from eggs that were never joined.
- Some lizards show parthenogenetic birth.
