simpleMeaning: Bought back to scrap or sell again, a firm's own shares count as given out but not held,
  with no vote and no payouts.
scope: Also called reacquired stock and treasury shares, these are a firm's own shares bought back to
  scrap or sell again, given out but not held, with no vote and no payouts.
examples:
- The firm held treasury stock it had bought back for a later sale.
- That treasury stock paid no money and carried no vote.
