senseId: 'lethargy%1:07:00::'
synsetId: 05049292-n
simpleMeaning: a weak state with very little energy and liveliness
scope: Also called lassitude and slackness. This is a general weak feeling with very little energy, not
  the deep sleep-like state linked to sleeping sickness.
examples:
- A heavy lethargy made it hard for him to get up and work.
- After weeks of illness, she felt a deep lethargy all day.
