simpleMeaning: Describes an insect whose head, middle part, and tail end are cut apart by deep narrow
  waists.
scope: Describes an insect with deep narrow waists between head, middle, and tail end, not an insect with
  a smooth body and not a spider.
examples:
- The disjunct ant has deep waists between its body parts.
- A disjunct insect shows clear gaps between head and tail.
