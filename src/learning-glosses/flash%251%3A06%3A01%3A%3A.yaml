simpleMeaning: a bright coloured piece added to something to decorate it or to show what it is or which
  group it belongs to
scope: A bright patch of colour used to decorate or identify something, not a showy display meant to impress,
  and not a burst of light used as a signal.
examples:
- The red flashes on the wings made the plane easy to identify.
- She sewed a flash onto the sleeve of her uniform.
