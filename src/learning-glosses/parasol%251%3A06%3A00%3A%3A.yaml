simpleMeaning: A cover held in the hand that can be opened up and folded shut to keep off the sun
scope: A hand-held cover opened to keep off the sun, not an umbrella for rain and not a hat.
examples:
- She opened her parasol against the noon sun.
- The old lady walked with a parasol in the summer heat.
