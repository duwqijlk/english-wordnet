senseId: 'menstruum%1:22:00::'
synsetId: 13534950-n
simpleMeaning: the blood that flows each month from the womb of a woman who is not pregnant, from puberty
  until menopause
scope: The monthly blood from the womb of a woman who is not pregnant; flow, period, menstruation, menses
  and catamenia are other names for this sense, not bleeding from an injury, and not the blood after childbirth.
examples:
- The menstruum is the monthly blood from the womb of a woman who is not pregnant.
- Doctors asked about her menstruum when she spoke of monthly pain.
