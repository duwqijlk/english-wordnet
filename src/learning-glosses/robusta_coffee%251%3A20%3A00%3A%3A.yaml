simpleMeaning: a kind of plant from West Africa, now grown in Java and other places, that stands up to
  a disease that harms the crop
scope: A kind of coffee plant from West Africa, not the arabica plant and not a cup of coffee.
examples:
- Farmers grow robusta coffee in the low hot lands.
- Robusta coffee stands up well to disease.
