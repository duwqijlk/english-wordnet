simpleMeaning: the act of forcing a person from another country who is not wanted to leave that country
scope: This is the act of making a person from another country leave a country because they are not wanted
  there. It is not a person leaving by choice, and not a move from one place to another inside the same
  country.
examples:
- After the court case, his deportation back to his own country was set for next week.
- She lived in fear of deportation because her papers were not in order.
