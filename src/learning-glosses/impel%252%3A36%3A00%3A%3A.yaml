simpleMeaning: To push a person to act, or drive them on.
scope: This sense is also called force, for pushing a person to act, or driving them on, where force is
  to make a person feel they must act, because of a strong need, feeling, or situation.
examples:
- Fear impelled him to act.
- Shame impels them on.
