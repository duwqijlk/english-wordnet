simpleMeaning: a heartbeat that comes too early and briefly upsets the heart's steady beat
scope: This is an early heartbeat that briefly breaks the heart's rhythm; not a steady heartbeat and not
  a lasting change in the heart's rhythm.
examples:
- The extrasystole made her heart skip a beat for a moment.
- His extrasystole showed up as an early beat on the heart trace.
