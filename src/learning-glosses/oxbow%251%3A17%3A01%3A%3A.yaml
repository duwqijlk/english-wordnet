simpleMeaning: The land inside a river's curve.
scope: This sense is the land inside a river's curve, unlike the sense for a wooden frame bent to a U,
  its top ends fixed to the cross yoke, its loop round the neck of an ox, and unlike the sense for a U-shaped
  bend in a stream.
examples:
- The oxbow is the land inside a river's curve.
- Oxbows lie inside curves.
