simpleMeaning: the least steep slant at which light hits a surface and is sent back in full instead of
  passing through
scope: This is the least steep slant at which light hitting a surface is sent back in full, not a slant
  at which light passes through and not any slant of a ray.
examples:
- Light striking at less than the critical angle passes through the glass.
- Beyond the critical angle, the light is totally reflected back into the water.
