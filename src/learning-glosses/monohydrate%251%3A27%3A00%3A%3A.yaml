simpleMeaning: a compound that holds one molecule of water for each molecule of the compound itself
scope: A compound with one molecule of water for each molecule of the compound, not a compound with no
  water in it and not one with two molecules of water per molecule.
examples:
- The chemist weighed the monohydrate before heating it to drive off the water.
- The label said the powder was a monohydrate, so each grain held water inside.
