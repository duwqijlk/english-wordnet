simpleMeaning: to repair something by replacing a damaged part or putting the pieces back together.
scope: This is restoring something damaged to working order, not attaching something firmly in place,
  arranging a time, or preparing a meal.
examples:
- He fixed the broken chair with glue and a new leg.
- Can you fix the leak in the roof before winter?
