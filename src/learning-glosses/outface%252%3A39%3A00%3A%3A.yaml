senseId: 'outface%2:39:00::'
synsetId: 02137454-v
simpleMeaning: To win over someone by staring, or as if by staring, till they waver or give in
scope: To beat someone by staring them down, also called outstare; not to beat someone by fighting and
  not to win someone over by talking.
examples:
- She outfaced the bully until he looked away.
- He outfaced his rival in a long staring match.
