simpleMeaning: a device that turns the flow of liquid from a tank on and off, or makes it stronger or
  weaker
scope: A device that controls liquid coming from a tank, not the tank itself and not the pipe it flows
  through.
examples:
- She turned off the faucet to stop the water.
- The faucet in the kitchen drips all night.
