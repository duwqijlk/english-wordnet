senseId: 'literalize%2:31:00::'
synsetId: 00625484-v
simpleMeaning: to take words in their plain, exact sense, not as a picture
scope: To read words by what they plainly say, also called literalise, and not to read them as a picture.
examples:
- Do not literalize the saying; it is a picture, not a fact.
- She literalized the old saying and missed its point.
