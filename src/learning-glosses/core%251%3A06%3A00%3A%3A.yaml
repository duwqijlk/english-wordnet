simpleMeaning: a bar of magnetic metal, such as soft iron, fitted inside a coil so the coil can store
  more magnetic energy
scope: This sense is a bar of magnetic metal placed inside a coil so the coil stores more magnetic energy;
  it is not the small magnetic ring once used in computer memory, and not an object's inner centre.
examples:
- A soft iron core inside the coil increases its inductance.
- The transformer's core is made of soft iron to strengthen the magnetic field.
