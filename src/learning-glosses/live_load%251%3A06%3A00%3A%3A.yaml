simpleMeaning: A weight on a bridge or other structure that keeps changing, like moving traffic
scope: A weight on a bridge or other structure that keeps changing, like moving traffic, not the fixed
  weight of the structure itself.
examples:
- The live load on the bridge grows when rush-hour traffic crosses it.
- Engineers must plan for the live load of cars and trucks on the new bridge.
