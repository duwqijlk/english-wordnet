simpleMeaning: the act of upsetting someone or something, and so setting it in motion
scope: The act of troubling a person or thing and setting it moving, not a mental illness, not a noisy
  outburst, and not a fault in a signal.
examples:
- The noise caused a disturbance in the hall.
- A slight disturbance set the papers in motion.
