simpleMeaning: A disc that can be written on only once, and after that only read.
scope: A disc for writing on once, also called CD-R, compact disc recordable and compact disc write-once;
  it is not a disc you can write on more than once.
examples:
- He saved the file on a CD-WO.
- A CD-WO lets you write once and then only read.
