simpleMeaning: Made on purpose to dodge the law, this mind-changing stuff copies the effects of a banned
  one; the law changed in 1986 to ban such stuff too
scope: This mind-changing stuff is made on purpose to dodge the law.
examples:
- The designer drug was banned after the law changed in 1986.
- He took a designer drug that had been made to dodge the law.
