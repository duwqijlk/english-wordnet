simpleMeaning: A big wagon with a curved cloth top and wide wheels, used in the 19th century by United
  States pioneers to cross the open grasslands
scope: Also called prairie schooner and covered wagon, this big wagon with a curved cloth top and wide
  wheels was used by pioneers to cross the open grasslands in the 19th century.
examples:
- Pioneers crossed the prairies in a prairie wagon.
- A prairie wagon carried the settlers across the plains.
