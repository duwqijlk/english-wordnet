simpleMeaning: A fold of the thin skin inside the belly, joined to the stomach and to the large gut and
  lying over the guts
scope: This fold inside the belly is also called caul and gastrocolic omentum, and is not a muscle and
  not the stomach itself.
examples:
- The greater omentum covers the intestines inside the belly.
- Surgeons lifted the greater omentum to reach the stomach.
