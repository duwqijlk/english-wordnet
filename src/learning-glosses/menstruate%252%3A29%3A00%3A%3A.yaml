simpleMeaning: to have blood flow out of the body each month as part of a woman's usual cycle
scope: This is about a woman's monthly flow of blood, not about having a baby and not about the time of
  life when this flow stops for good.
examples:
- She began to menstruate when she was eleven years old.
- Some women menstruate every twenty-eight days.
