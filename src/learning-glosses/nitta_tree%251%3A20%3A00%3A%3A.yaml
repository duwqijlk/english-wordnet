simpleMeaning: Red or yellow flower heads grow on these Old World tropical trees of the group Parkia,
  and pods follow, usually holding seeds and pulp to eat.
scope: A tropical tree of the Old World with flower heads and pods, not a tree of the Americas and not
  a shrub.
examples:
- The nitta tree in the park had heads of red flowers.
- They gathered pods from the nitta tree and ate the seeds inside.
