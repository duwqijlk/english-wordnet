simpleMeaning: A long-lasting infectious illness of tropical and subtropical regions, marked by swollen
  lumps under the skin and the wasting away of body parts, caused by a germ called Mycobacterium leprae.
scope: A long-lasting infectious illness, also called leprosy, not a short fever, marked by lumps under
  the skin and wasting of body parts.
examples:
- Hansen's disease is treated with long courses of drugs.
- People with Hansen's disease once faced great stigma.
