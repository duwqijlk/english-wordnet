simpleMeaning: In ethics, the view that nothing is good or bad in itself, by its own nature.
scope: Also called ethical nihilism, this is the view in ethics that nothing is good or bad in itself,
  not the view that some acts are right or wrong by their nature.
examples:
- His moral nihilism left him with no ground to praise or blame anyone.
- Moral nihilism says that no act is good or bad in itself.
