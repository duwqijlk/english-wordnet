senseId: consequent%5:00:00:subsequent:00
synsetId: 00123654-s
simpleMeaning: happening with something or coming after it as a result
scope: Coming after something as its result, not the thing that causes it and not something that happened
  before it.
examples:
- The flood and the consequent damage closed the road for weeks.
- His fall and the consequent break in his arm kept him off work.
