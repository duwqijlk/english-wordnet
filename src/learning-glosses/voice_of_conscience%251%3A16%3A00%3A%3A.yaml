senseId: 'voice_of_conscience%1:16:00::'
synsetId: 09207302-n
simpleMeaning: the inner feeling that judges how a person acts
scope: The inner sense that judges a person's own acts as right or wrong, not a real sound heard from
  outside and not a set of written rules.
examples:
- His voice of conscience told him to return the lost wallet.
- She listened to her voice of conscience before she spoke.
