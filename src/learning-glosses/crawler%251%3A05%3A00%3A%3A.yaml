simpleMeaning: A worm living in soil that digs and lets air in, often comes up when ground is cool or
  wet, and is used as bait by people fishing
scope: Also called earthworm, wiggler, nightcrawler, nightwalker, angleworm, dew worm, fishing worm, fishworm
  and red worm, this is a worm that lives in soil, not a person who moves along the ground.
examples:
- After the rain, a crawler came up onto the wet path.
- He dug up crawlers to use as bait when he went fishing.
