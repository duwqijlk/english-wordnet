simpleMeaning: In computing, an ASCII mark for going back to the start of a line, a tab, or a backspace,
  typed by pressing a key with the special key.
scope: In computing, this ASCII mark stands for going back to the start of a line, a tab, or a backspace,
  and is typed by pressing a key with the special key.
examples:
- A control character moves the cursor back to the start of the line.
- She typed a control character by pressing the special key and the letter key together.
