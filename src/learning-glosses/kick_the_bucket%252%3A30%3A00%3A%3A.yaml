senseId: 'kick_the_bucket%2:30:00::'
synsetId: 00359085-v
simpleMeaning: When a person's body can no longer do the work that keeps it alive, the person stops living
scope: To stop living and lose all bodily work needed to stay alive; also called die, go, pass, choke,
  exit, croak, decease, expire, perish, conk, buy the farm, cash in one's chips, drop dead, give-up the
  ghost, pass away and pop off, not to faint and not to leave a place.
examples:
- The old guy kicked the bucket at the age of 102.
- When she kicked the bucket, her family mourned her for weeks.
