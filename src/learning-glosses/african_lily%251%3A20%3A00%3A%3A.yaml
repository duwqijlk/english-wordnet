simpleMeaning: A plant of Africa with bright green leaves that stay green all year and bunches of many
  flowers, usually deep violet-blue.
scope: A plant of Africa with bright green leaves and bunches of deep violet-blue flowers, also called
  African tulip, Agapanthus africanus and blue African lily; its leaves that stay green all year set it
  apart from plants that lose their leaves.
examples:
- The African lily bears bunches of violet-blue flowers.
- African lily plants keep their green leaves all year.
