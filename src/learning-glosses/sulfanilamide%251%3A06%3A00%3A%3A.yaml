simpleMeaning: A white drug with no smell, in the form of small hard bits, and the parent stuff from which
  most sulfa drugs are made.
scope: A white drug with no smell, the parent stuff of most sulfa drugs; not a finished medicine for one
  illness and not a painkiller.
examples:
- Sulfanilamide was the first of its kind of drug.
- The chemist made sulfanilamide in the laboratory.
