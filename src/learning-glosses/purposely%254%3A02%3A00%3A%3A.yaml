simpleMeaning: in a way that shows you mean to do it and do not do it by chance
scope: Done in a way that shows you mean to do it, also called deliberately, intentionally, and advisedly;
  it is not done by chance or by mistake.
examples:
- He purposely left the door open so the cat could get in.
- She purposely spoke slowly so everyone could follow her.
