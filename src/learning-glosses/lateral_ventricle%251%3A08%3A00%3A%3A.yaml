simpleMeaning: Either of two hollow spaces in the brain, one in each half and shaped like a horseshoe,
  that join the third hollow space through a small hole.
scope: One of two horseshoe-shaped hollow spaces in the brain, not the third hollow space that they join.
examples:
- Fluid fills the lateral ventricle on each side of the brain.
- The scan showed the lateral ventricle was larger than usual.
