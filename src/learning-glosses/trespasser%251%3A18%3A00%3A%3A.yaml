simpleMeaning: a person who goes onto another person's land or into their building, or into their private
  life, without permission
scope: 'Also called intruder and interloper: a person who enters without permission, not a guest who was
  invited and not an owner going onto their own land.'
examples:
- The farmer found a trespasser walking across his field.
- Trespassers were warned that dogs guarded the house at night.
