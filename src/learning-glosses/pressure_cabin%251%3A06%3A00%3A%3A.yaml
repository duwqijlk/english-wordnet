simpleMeaning: the room in a plane or space ship where air is held at a level that lets people breathe
scope: The room inside a plane or space ship where people travel and breathe, not the plane itself and
  not the outside air.
examples:
- The pressure cabin kept the air at a safe level during the flight.
- Passengers sat in the pressure cabin while the plane flew high above the clouds.
