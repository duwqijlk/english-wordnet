simpleMeaning: to cover a surface with long flat pieces of wood
scope: To cover something with flat wood boards, not a single flat piece of wood itself and not cooking
  and serving food on a wood board.
examples:
- They planked the floor of the barn with new wood.
- The workers planked the muddy path so people could walk on it.
