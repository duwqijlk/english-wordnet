simpleMeaning: A large whip-scorpion of Mexico and the southern United States that gives off a vinegary
  odor when alarmed.
scope: Of the large scorpion-like creatures of Mexico and the southern United States, this one has a long
  thin tail and gives off a sharp sour smell when frightened, not a true scorpion.
examples:
- The vinegarroon raised its long tail in alarm.
- A vinegarroon gives off a sharp sour smell when it is frightened.
