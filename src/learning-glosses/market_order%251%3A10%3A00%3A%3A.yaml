simpleMeaning: At the price that is current now, a broker is told to buy or sell shares or goods
scope: An instruction to a broker to buy or sell at the price that is current now, not a fixed-price order
  and not a deal made face to face.
examples:
- She put in a market order to sell her shares at once.
- The market order was filled at the price the shares were trading at.
