simpleMeaning: In genetics, new young are made by joining two different kinds of animal or plant, and
  they are a mix of both kinds
scope: In genetics, the making of mixed young by joining different kinds of animal or plant, also called
  cross, crossbreeding, crossing, hybridisation, hybridization and interbreeding; not the young themselves
  and not a cross within one kind.
examples:
- Hybridizing the two kinds of apple gave fruit that was sweet and firm.
- She spent years hybridizing roses to get new colours.
