simpleMeaning: 'In physics, the base of quantum theory: electromagnetic wave energy comes in whole bits,
  given out or taken in; its size grows with frequency, the rate fixed by one constant.'
scope: A law of physics about wave energy, not a law about heat and not a law about falling bodies.
examples:
- Planck's law explains how wave energy comes in bits.
- The class studied Planck's law and its constant.
