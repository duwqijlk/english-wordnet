simpleMeaning: a covering that keeps the wrist or arm safe, used in archery and fencing and other sports
scope: 'Also called armguard: a covering that keeps the wrist or arm safe in sport, not a strong drink
  that makes a person feel better.'
examples:
- The archer wore a bracer to protect her forearm from the bowstring.
- He put on a bracer before his fencing lesson.
