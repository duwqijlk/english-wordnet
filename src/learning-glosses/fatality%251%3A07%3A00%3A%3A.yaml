senseId: 'fatality%1:07:00::'
synsetId: 04798531-n
simpleMeaning: A thing's power to cause death, or to cause very bad events in which people die
scope: This is the power to cause death or very bad events in which people die, not one death itself and
  not the number of deaths after an event.
examples:
- The fatality of the poison was clear, so the bottle was kept locked away.
- No one doubted the fatality of a fall from that high cliff.
