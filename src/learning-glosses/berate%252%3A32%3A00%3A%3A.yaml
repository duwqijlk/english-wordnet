simpleMeaning: to blame a person in an angry voice for what they did, with words that are hard and sharp
scope: 'Also called jaw, rag, lecture, scold, chide, rebuke, and reprimand: a hard, angry telling-off,
  not a calm talk about what went wrong.'
examples:
- He berated the driver for running the red light.
- The coach berated the team after the careless loss.
