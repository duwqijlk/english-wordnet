simpleMeaning: 'A ship or plane that keeps one compass course follows this path: a line on a globe that
  cuts every north-south line at the same angle.'
scope: Also called rhumb and rhumb line, this line on a globe cuts every north-south line at the same
  angle, and a ship or plane keeping one compass course follows it.
examples:
- They sailed by the loxodrome.
- A ship holding one compass course follows a loxodrome.
