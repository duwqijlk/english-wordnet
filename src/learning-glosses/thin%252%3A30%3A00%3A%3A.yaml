simpleMeaning: To narrow, so the distance between opposite sides or faces becomes smaller.
scope: This is an object or layer getting narrower, not a mixture being weakened and not a body becoming
  lean.
examples:
- The ice on the pond had thinned near the edge.
- The steel beam thinned where water had dripped on it for years.
