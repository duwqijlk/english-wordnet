simpleMeaning: long green pods with a thick, sticky juice; they may be cooked slowly in water or fried
  quickly, but are used especially in soups and stews
scope: The long green pods themselves, also called okra; not the soup or stew made with them and not a
  sticky kind of soil that turns to mud.
examples:
- She cut the gumbo into small pieces and added it to the soup.
- Fresh gumbo may be fried quickly for dinner.
