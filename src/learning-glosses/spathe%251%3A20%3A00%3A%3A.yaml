simpleMeaning: A large leaf-like part that stands out round a flower spike or other flower head, or sits
  just below it
scope: A large leaf-like part that stands out round a flower spike or other flower head, or sits just
  below it, not a petal and not a plain green leaf.
examples:
- The spathe stands out round the flower spike like a large leaf.
- A spathe wraps the flower head of the plant.
