simpleMeaning: A tiny part of a plant that holds the female cell, and grows into a seed after it is fertilised
scope: A tiny part of a plant that holds the female cell and grows into a seed, not the seed itself and
  not the flower that holds it.
examples:
- Each ovule in the flower may grow into a seed.
- After the bee brought pollen, the ovule began to grow into a seed.
