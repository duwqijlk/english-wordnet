simpleMeaning: Dark brown and dense, the long-lasting wood of this East Indian tree builds ships and railway
  ties, while its leaves feed farm animals.
scope: 'Also called sisham and sissoo: an East Indian tree whose leaves feed farm animals and whose wood
  is used for ships and railway ties.'
examples:
- Shipbuilders chose sissu wood for their ships.
- Farmers fed sissu leaves to their cattle.
