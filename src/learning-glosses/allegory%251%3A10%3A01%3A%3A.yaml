schema: oewn-learning-gloss-v2
senseId: 'allegory%1:10:01::'
synsetId: 06378026-n
simpleMeaning: a way of writing that uses made-up people and events to show a subject by likeness to it;
  a metaphor, a comparison in words, carried through the whole work
scope: This is the writing style that tells a made-up story to stand for an idea, not a single visible
  sign or picture that stands for an idea.
examples:
- The book is an allegory about power, with farm animals standing for real leaders.
- He read the story as an allegory, where each person stood for a good or bad quality.
