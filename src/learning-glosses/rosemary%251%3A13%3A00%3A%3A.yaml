simpleMeaning: leaves with a very strong taste and smell, used fresh or dried to give food more taste,
  especially meat
scope: The leaves used to give food, especially meat, a strong taste; not the garden plant itself that
  the leaves come from.
examples:
- She added fresh rosemary to the meat before cooking it.
- Dried rosemary gave the potatoes a strong taste.
