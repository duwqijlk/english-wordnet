simpleMeaning: A watchful wild animal that eats meat, has a pointed face and ears and a thick bushy tail,
  and hunts alone rather than in a group.
scope: This is the living animal, not its fur, not a sly person, and not any of the actions described
  by the verb.
examples:
- A fox crossed the road just before dawn.
- Foxes usually hunt alone at night.
