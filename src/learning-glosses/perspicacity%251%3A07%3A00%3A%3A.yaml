simpleMeaning: Knowing how to judge a state of things well, and reaching a sound answer about it.
scope: Also called judgment and judgement; knowing how to judge a state of things well, and reaching a
  sound answer about it, not cleverness shown in dealings.
examples:
- Her perspicacity let her see through the plan at once.
- It took perspicacity to read the mood of the room and act wisely.
