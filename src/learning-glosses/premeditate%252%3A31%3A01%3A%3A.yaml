simpleMeaning: to think about a thing before it happens
scope: Thinking ahead before something happens; not fixing or deciding the result in advance, and not
  acting without thinking first.
examples:
- He premeditated his reply before the meeting began.
- I rarely premeditate; I usually speak as thoughts come.
