senseId: 'fertility%1:26:00::'
synsetId: 14074976-n
simpleMeaning: the state of being able to have babies or other young living things
scope: This sense, also called fecundity, is about being able to have young; it is not about land growing
  plants well in large amounts, and not a count of births in a place each year.
examples:
- Good food can help a woman's fertility when she wants a baby.
- The doctor tested their fertility because they had no children yet.
