simpleMeaning: a clever, tangled plan to get what you want, usually in a bad way
scope: A clever, tangled plan, usually for a bad end; not the act of making such plans.
examples:
- The intrigue at court ended with the minister in prison.
- She found herself caught in an intrigue she did not start.
