senseId: 'offside%4:02:00::'
synsetId: 00415483-r
simpleMeaning: in a way that breaks the rules, by being ahead of the ball or puck
scope: This word tells how a player moves, ahead of the ball or puck in a way the rules do not allow;
  it is not the word for the place itself, and not the noun sense for the mistake.
examples:
- He ran offside before his team mate passed the ball.
- The player skated offside, ahead of the puck, so the play was stopped.
