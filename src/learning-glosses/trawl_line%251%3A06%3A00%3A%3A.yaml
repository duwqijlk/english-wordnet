simpleMeaning: A long cord used in fishing, with many shorter cords and hooks hung from it, usually held
  up between floating markers
scope: A long fishing cord with many shorter cords and hooks, also called trotline, trawl, spiller and
  setline; not a single rod and hook and not a net dragged through the water.
examples:
- The fishermen set a trawl line across the bay overnight.
- A trawl line can hold hundreds of hooks at once.
