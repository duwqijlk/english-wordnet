simpleMeaning: a sudden, small shock or short break that means little and soon passes
scope: A sudden small shock or short break that means little; not the mark on a radar screen that shows
  where something is.
examples:
- One bad day in the market was only a blip, and prices rose again the next week.
- A small blip in sales worried no one for long.
