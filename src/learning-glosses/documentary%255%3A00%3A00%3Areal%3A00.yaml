simpleMeaning: 'Of film, television, radio, or photography: showing a real event through pictures or talks
  with people who took part in it'
scope: A film, television, radio, or photography piece that shows a real event, not one that is about
  documents themselves.
examples:
- Her latest film is a documentary about the men who built the dam.
- They made a documentary series from talks with the people who lived through the flood.
