simpleMeaning: a substance in the blood that helps it clot, made in the kidney with the help of vitamin
  K
scope: A substance in the blood that helps it clot, made in the kidney with the help of vitamin K, not
  a substance made in the liver and not a drug that stops clotting; proconvertin is another name for this
  sense.
examples:
- Cothromboplastin helps the blood form a clot after an injury.
- Doctors measured the level of cothromboplastin in her blood.
