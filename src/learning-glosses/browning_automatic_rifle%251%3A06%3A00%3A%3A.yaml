simpleMeaning: A hand-carried gun firing .30-size bullets on its own, gas-worked and fed from a box of
  cartridges; used by United States troops in two World Wars and the Korean War.
scope: 'Also called BAR: a hand-carried gun firing 30-size bullets on its own, worked by gas pressure,
  not a heavy gun fixed in one place and not a gun fired one shot at a time.'
examples:
- The Browning automatic rifle was carried by United States troops in the Korean War.
- A soldier fired the Browning automatic rifle in short bursts.
