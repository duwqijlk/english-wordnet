simpleMeaning: A job that needs long study after a first degree at a school for those who work in the
  courts, and that runs the courts
scope: This is the job of working in the courts after long study, also called law, not the job of making
  laws or judging cases.
examples:
- She went into the practice of law after finishing her degree.
- The practice of law kept him busy in the courts all week.
