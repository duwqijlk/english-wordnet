simpleMeaning: A wispy white cloud, usually made of tiny bits of ice, high up, four to eight miles above
  the ground.
scope: A wispy white cloud high in the sky, usually of fine ice, not the slender, bendy part of a barnacle,
  sea lily, or insect, often used for feeling things.
examples:
- Thin cirrus clouds crossed the blue sky.
- Cirrus formed high above the mountains.
