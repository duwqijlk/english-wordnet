simpleMeaning: Ground fit for crops that is worked by digging, sowing seed, and growing crops.
scope: Also called farmland, ploughland, and plowland; ground worked for crops, not wild ground and not
  pasture.
examples:
- The cultivated land around the village grew wheat and barley.
- Farmers turned the wild field into cultivated land.
