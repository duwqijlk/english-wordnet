senseId: 'hive_off%2:40:00::'
synsetId: 02316994-v
simpleMeaning: Often, people who mean to cheat take money away in secret and move it to a new place
scope: Also called divert, this is taking money away in secret to move it elsewhere with dishonest intent,
  not spending it openly and not stealing it by force.
examples:
- The clerk hived off the firm's money into a bank account abroad.
- They hived off the cash before anyone saw what had happened.
