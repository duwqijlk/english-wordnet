senseId: 'garter%2:35:00::'
synsetId: 01290284-v
simpleMeaning: to hold something up or in place with a band worn around the leg, or as if with such a
  band
scope: This is the act of holding something with a leg band, not the band itself, which is another sense
  of the same word.
examples:
- She gartered her stocking to keep it from slipping down.
- The dancer gartered the ribbons firmly around her legs.
