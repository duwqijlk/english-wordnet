senseId: 'piffle%2:32:00::'
synsetId: 01038676-v
simpleMeaning: To talk on and on, fast, about things that do not matter.
scope: To talk fast and without stopping about small, unimportant things, also called chatter, clack,
  prattle, gibber, gabble, blabber, blab, tattle, prate, twaddle, palaver, or maunder.
examples:
- He piffled away the whole afternoon.
- Stop piffling and get to the point.
