simpleMeaning: Owned by or suitable for a highest-ranking ruler.
scope: This means suitable for or owned by a supreme ruler, not a ruler given power and crowned, and not
  merely having a monarch's rank.
examples:
- They gave the visiting queen a royal welcome.
- The palace was furnished in royal style.
