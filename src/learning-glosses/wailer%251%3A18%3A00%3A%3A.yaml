simpleMeaning: a person grieving for someone who has died, who cries out in long loud high sounds
scope: A person grieving for someone who has died who cries out in loud grief, not a singer and not a
  person weeping quietly.
examples:
- The wailer stood beside the coffin and cried out in grief.
- Hired wailers raised their voices in long, loud cries at the funeral.
