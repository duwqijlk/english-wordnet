simpleMeaning: a tree from the east and middle of America, with leaves that have five points and turn
  scarlet and yellow in autumn
scope: 'Also called scarlet maple and swamp maple: a tree whose leaves turn scarlet and yellow in autumn,
  not a sugar maple and not the wood it gives.'
examples:
- The red maple in our yard turns bright colours in autumn.
- We planted a red maple because its leaves go scarlet and yellow in the fall.
