simpleMeaning: In computer science, a part inside a computer that turns facts held in its memory into
  pictures shown on a screen
scope: A part inside a computer that turns facts in memory into pictures on a screen, also called a display
  adaptor, and not the screen itself or the computer's memory.
examples:
- The new display adapter lets the old computer show sharp pictures.
- He fitted a display adapter so the screen could show the game.
