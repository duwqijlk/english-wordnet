simpleMeaning: A person who finds customers for women who sell sex; in England such a person is called
  a ponce
scope: A person who finds customers for women who sell sex; pimp, pander, ponce, procurer and panderer
  are other names for this person, not a customer and not a brothel keeper.
examples:
- The novel's pandar arranged meetings for the rich men.
- The pandar found customers for the women who worked in the house.
