simpleMeaning: Strong jaws for crushing snails and mussels belong to a lizard of South America like a
  crocodile
scope: This South American lizard, like a crocodile, has strong jaws for crushing snails and mussels,
  but it is not a true crocodile.
examples:
- The caiman lizard crushed a snail with its strong jaws.
- The caiman lizard used its strong jaws on a mussel.
