simpleMeaning: to get in the way so that one body in the sky hides another
scope: To come between two bodies in the sky so one hides the other, not the darkening itself and not
  simply passing in front of a light.
examples:
- The Moon will eclipse the Sun today.
- The planet eclipsed the distant star for a few minutes.
