simpleMeaning: the smoke and hot melted rock a volcano pours out, or the rock left behind after it
scope: What a volcano pours out, not a sudden bad event like a fight breaking out and not a tooth coming
  through the gum.
examples:
- Lava from the eruption flowed down the mountain.
- The eruption covered the village in ash.
