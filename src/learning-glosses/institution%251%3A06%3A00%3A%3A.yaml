simpleMeaning: a building or group of buildings that is the home of an organization working to help a
  cause
scope: A building or group of buildings where an organization works for a cause; not a hospital for people
  with a serious illness of the mind.
examples:
- The institution is a large stone building with a library and offices for the charity.
- They built the institution in 1900 to give the society a lasting home.
