simpleMeaning: Any of many weedy plants, mostly from North America, whose pollen is a strong allergen
  and causes much hay fever and asthma.
scope: The weedy plant sense of the word, a group of plants whose pollen is a strong allergen and a major
  cause of hay fever and asthma; it is a botanical name. It is not the food of the gods in Greek myth,
  nor the fruit-and-cream dessert of that name.
examples:
- Her eyes water every August when ambrosia releases its pollen.
- Ambrosia grows tall along roadsides and in empty lots.
