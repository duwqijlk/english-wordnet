simpleMeaning: the act of getting a lot of something and keeping it stored for use later when it may be
  needed
scope: This is the act of building up a store for later use, not using something up now and not throwing
  it away.
examples:
- The stockpiling of food before winter helped the village survive.
- Stockpiling of medicine began as soon as the shortage was feared.
