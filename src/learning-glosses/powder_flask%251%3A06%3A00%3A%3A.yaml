simpleMeaning: a holder for carrying the stuff that fires a gun, made from the hollow horn of an animal
scope: Also called a powder horn, this is a holder for carrying the stuff that fires a gun, made from
  a hollow animal horn, not a bottle for drink and not a bag for carrying balls.
examples:
- He filled his powder flask with gunpowder before he loaded the musket.
- The old powder flask was made from a hollow horn and hung from his belt.
