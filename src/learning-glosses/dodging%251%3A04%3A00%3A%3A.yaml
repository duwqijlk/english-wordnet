synsetId: 00742010-n
simpleMeaning: Not doing an unpleasant thing you are meant to do, getting out of it by a trick or a lie
scope: This is not doing an unpleasant thing you are meant to do, also called escape, not merely staying
  away from a thing and not a clever answer to a question.
examples:
- His dodging of the chores left the work to his sister.
- Dodging the bill was not an option for long.
