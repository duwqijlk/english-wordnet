simpleMeaning: In physics, energy passing between very small bits of matter, or a bit and a field (an
  area of force), or fields, carried by small bits called gauge bosons
scope: In physics, energy passing between tiny bits of matter and fields (areas of force); not the general
  sense of people or things acting on each other.
examples:
- The interaction between the two particles passed energy from one to the other.
- Scientists studied the interaction between the particle and the field.
