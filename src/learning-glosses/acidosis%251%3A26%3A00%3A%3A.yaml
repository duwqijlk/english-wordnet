simpleMeaning: the blood and other body tissues hold far too many hydrogen ions in this state
scope: It is the state in which the blood and other body tissues hold far too many hydrogen ions, not
  a disorder of the blood alone.
examples:
- Acidosis set in as the hydrogen ions built up in his tissues.
- The doctor treated the acidosis that had spread through his blood and tissues.
