senseId: 'hilum%1:08:00::'
synsetId: 05232048-n
simpleMeaning: In anatomy, the place where tubes that carry fluids, nerves, or ducts go into a body part
  is a dip or split in it.
scope: It is also called hilus, and it is not the scar on a seed.
examples:
- The hilum of the kidney is where the blood tubes go in.
- The hilum of the liver is where the tubes go in.
