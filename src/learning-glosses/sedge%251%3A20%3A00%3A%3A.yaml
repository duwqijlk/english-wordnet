simpleMeaning: A plant like grass or like a rush that grows in wet places, with solid stems, narrow leaves
  like grass, and small groups of flowers that are hard to see
scope: A wet-place plant like grass, not true grass and not a rush, with solid stems and small flowers
  that are hard to see.
examples:
- Sedge grew thickly around the edge of the pond.
- The sedge by the river had narrow leaves and solid stems.
