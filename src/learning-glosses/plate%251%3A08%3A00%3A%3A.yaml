simpleMeaning: a part or structure in the body that is flat and thin
scope: A flat structure in the body, not a dental fitting, a photographic sheet, or a piece of armor.
examples:
- The skull contains several flat plates of bone.
- The surgeon repaired the bony plate above the eye.
