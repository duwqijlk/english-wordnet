simpleMeaning: The person who by rule must get the goods of one who dies with no will made.
scope: The person who by rule must get the goods of one who dies with no will made, not one named in a
  will and not an heir whose right cannot be lost.
examples:
- He was the heir-at-law of his father, who died with no will made.
- The heir-at-law took the house when his uncle died with no will made.
