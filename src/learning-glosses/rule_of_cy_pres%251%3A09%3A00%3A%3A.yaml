senseId: 'rule_of_cy_pres%1:09:00::'
synsetId: 05857218-n
simpleMeaning: In law, when a gift cannot be used as the giver or will-maker asked, it should be used
  as close to the wish as can be done
scope: 'Also called cy pres and the cy pres doctrine: in law, a gift is used as close to the giver''s
  wish as can be done when it cannot be used as asked, not a gift used just as asked, and not a gift used
  with no regard to the wish.'
examples:
- The court used the rule of cy pres to put the gift to a use close to what the giver had wanted.
- Under the rule of cy pres, the old gift was used for a purpose near to the one named in the will.
