simpleMeaning: Any of several kinds of swallow, small birds with a tail that is square or slightly split
  and with long, sharp wings, which move to warmer places in late autumn
scope: This is a kind of swallow with a square or slightly split tail, not other small birds with a deeply
  split tail or short wings.
examples:
- A martin flew over the field on long, pointed wings.
- The martins left in late autumn and came back in spring.
