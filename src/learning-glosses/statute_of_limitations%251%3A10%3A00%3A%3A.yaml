simpleMeaning: a written law that sets the time within which a case may be brought to court
scope: A written law that sets the time within which a case may be brought to court; not a law that names
  a crime, and not a date set by a judge.
examples:
- The statute of limitations had run out, so no case could be brought.
- A statute of limitations gives victims only a few years to act.
