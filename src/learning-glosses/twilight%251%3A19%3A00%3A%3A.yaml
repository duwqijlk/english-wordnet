simpleMeaning: The soft light in the sky when the sun is below the horizon (the line where earth and sky
  meet) and air above the earth bends its light
scope: This is the soft light itself when the sun is below the line where earth and sky meet. It is not
  the darkness of full night, and not the word for a place or thing lit by this light.
examples:
- We could still see the road in the twilight after sunset.
- Birds sang again in the faint twilight before sunrise.
