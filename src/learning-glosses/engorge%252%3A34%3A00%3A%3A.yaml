simpleMeaning: to eat far more than you need, in a greedy way and with no care for good manners
scope: About eating far too much, also called stuff, gorge, binge, glut, overeat, satiate and overindulge,
  not just eating a normal meal.
examples:
- He engorged himself on cake at the party.
- The children engorged on sweets until they felt sick.
