simpleMeaning: A measuring line on which the real gaps from the start grow in step with the logarithms
  of the numbers marked on it
scope: A measuring line on which the real gaps from the start grow in step with the logarithms of the
  numbers marked on it, not a line marked in equal steps and not a line that shows time.
examples:
- The graph used a logarithmic scale for the big range of values.
- On a logarithmic scale, a small move along the line can stand for a very large change in the number.
