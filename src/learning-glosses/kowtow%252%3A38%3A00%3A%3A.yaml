senseId: 'kowtow%2:38:00::'
synsetId: 02044554-v
simpleMeaning: to bend the knees and bow low in a way that shows too much readiness to serve another person
scope: 'Also called scrape and genuflect: to bend the knees and bow low to serve another person, not the
  old Chinese custom of touching the ground with the forehead and not the verb sense of trying to win
  help by praising someone too much.'
examples:
- The servant kowtowed before his master, knees bent and head low.
- He refused to kowtow to the king in such a low, serving way.
