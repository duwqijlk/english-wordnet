simpleMeaning: a plant with thick fleshy parts that hold water, mostly from dry lands in the Americas,
  usually with sharp spines
scope: A water-storing plant of dry lands, not a leafy green plant and not a thorny bush grown for its
  flowers.
examples:
- The cactus on the window sill had not been watered for weeks.
- A cactus stores water in its thick stem to live through dry months.
