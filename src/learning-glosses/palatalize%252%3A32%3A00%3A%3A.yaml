simpleMeaning: With the tongue against the roof of the mouth, make a sound by closing off the air
scope: 'Another name for palatalise: to say a sound with the tongue against the roof of the mouth, not
  to say a vowel and not to say a sound with the tongue down.'
examples:
- She learned to palatalize the consonant in the Russian word.
- To palatalize the sound, press your tongue to the roof of your mouth.
