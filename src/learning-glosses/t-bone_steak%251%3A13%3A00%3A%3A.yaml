simpleMeaning: A small cut of beef from the thin end of the short loin, with a T-shaped bone and a small
  piece of tenderloin in it.
scope: A small cut of beef from the thin end of the short loin, with a T-shaped bone and a small piece
  of tenderloin, not a large cut from the thick end and not a cut without bone.
examples:
- We grilled a T-bone steak for dinner.
- The T-bone steak had a T-shaped bone in the middle.
