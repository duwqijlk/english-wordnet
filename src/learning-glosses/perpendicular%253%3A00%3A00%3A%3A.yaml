simpleMeaning: meeting or forming a right angle (a corner that measures 90 degrees)
scope: About lines that meet at a right angle, not the old building style with tall straight lines and
  not the cord with a weight used to find straight up and down.
examples:
- The two walls are perpendicular to each other.
- Draw a line perpendicular to the base of the triangle.
