simpleMeaning: a common non-metal element with no taste or smell that joins many atoms, best known as
  yellow crystals, found in sulphide and sulphate minerals and alone, above all near volcanoes
scope: Also called sulphur or S, atomic number 16; a yellow element found in minerals, not a metal and
  not a salt.
examples:
- Sulfur is a non-metal element with no taste or smell.
- The yellow sulfur crystals came from a volcano.
