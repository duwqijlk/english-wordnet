simpleMeaning: one of several blood vessels that bring blood to the dark middle layer of the eye
scope: Also called ciliary artery; it feeds the dark middle layer of the eye, not the outer layer of the
  brain and not the muscles of the neck.
examples:
- An arteria ciliaris brings blood to the middle layer of the eye.
- The arteria ciliaris runs to the dark coat that lies under the white of the eye.
