simpleMeaning: a plant from Egypt, now grown widely for its seeds with a strong smell and taste and for
  their oil, used in medicine and to give taste to food
scope: 'Also called anise plant: this is the plant itself, not just its seeds used in cooking and medicine.'
examples:
- Anise grows well in warm gardens and gives seeds with a sweet smell.
- She planted anise so she could use its oil and seeds.
