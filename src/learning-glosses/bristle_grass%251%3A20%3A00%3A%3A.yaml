scope: 'Also called bristlegrass: plants of open land and woods with big curving seed heads and long stiff
  hairs under each small head, not a grain crop grown for food.'
examples:
- Bristle grass grows in the open woods, its seed heads curving in the wind.
- The farmer cut the bristle grass before its stiff hairs could spread.
