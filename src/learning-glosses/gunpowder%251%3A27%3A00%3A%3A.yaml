simpleMeaning: a mix of potassium nitrate, charcoal, and sulfur in parts 75 to 15 to 10, used in guns,
  timed fuses, and fireworks
scope: Also called powder, this is the mix used in guns, timed fuses, and fireworks; it is not loose dust
  in general and not a powder for the skin.
examples:
- Old guns used gunpowder to fire their shots.
- The fireworks were filled with gunpowder.
