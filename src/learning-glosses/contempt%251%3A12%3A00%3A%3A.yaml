simpleMeaning: a strong feeling of dislike for someone, with no respect for them
scope: 'Also called despite, scorn, and disdain: a feeling of strong dislike with no respect, not breaking
  a court''s rules on purpose and not a rude way of acting.'
examples:
- She looked at the thieves with contempt and would not speak to them.
- His voice was full of contempt for people who lie to get money.
