simpleMeaning: to give something a slight amount of color, or leave a light color on it
scope: This is the act of giving a light color to something, not the medicine made with alcohol and not
  a substance used to color things.
examples:
- The sky was tinctured red at sunset.
- She tinctured the water pale blue with a drop of color.
