simpleMeaning: A boat driven by steam, moved by flat blades turning in the water
scope: A steam boat moved by flat blades turning in the water; paddle steamer is another name for it,
  not a boat moved by a screw under the water.
examples:
- The old paddle-wheeler still runs trips on the river.
- We watched the paddle-wheeler churn past the dock.
