simpleMeaning: to drive a person's mind out of its right state, so that they can no longer think clearly
  and go mad
scope: To upset a person's mind so badly they go mad, not to upset their feelings and not to make them
  merely confused.
examples:
- The death of his parents unbalanced him.
- Years of grief unbalanced the old man, and his friends feared he had lost his mind.
