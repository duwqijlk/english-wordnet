simpleMeaning: Lariam and Mephaquine are trade names for this drug against fever illness; it works when
  chloroquine fails, though it is said to harm mind and nerves in some people.
scope: Also called mefloquine, it is a drug against the fever illness that works when chloroquine fails.
examples:
- Mefloquine hydrochloride worked when chloroquine had failed.
- Mefloquine hydrochloride helped against the fever illness.
