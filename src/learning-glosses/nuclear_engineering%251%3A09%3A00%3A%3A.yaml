simpleMeaning: The work of planning, building, and running machines that make power by splitting atoms.
scope: The work of planning, building, and running machines that make power by splitting atoms; not the
  planning of bridges or roads, and not the study of atoms for its own sake.
examples:
- She studied nuclear engineering before joining the power company.
- Nuclear engineering covers both the building and the running of reactors.
