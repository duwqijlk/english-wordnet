simpleMeaning: a fish of warm seas whose teeth have grown together into a beak, with thick skin set with
  bony plates or spines
scope: Also called a plectognath; not a shark and not an ordinary fish with separate teeth.
examples:
- The plectognath fish hid in the warm shallow water.
- We saw a plectognath fish with thick skin and a beak.
