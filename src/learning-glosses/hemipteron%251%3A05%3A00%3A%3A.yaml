simpleMeaning: Their front wings are thick like hide at the base, and these small creatures drink through
  a tube-like mouth and usually grow up without a full change of shape.
scope: People also call these small creatures bug, hemipteran, and hemipterous insect, and they drink
  through a tube-like mouth and grow up without a full change of shape.
examples:
- The hemipteron sucked sap through its tube-like mouth.
- The hemipteron had front wings thick like hide at the base.
