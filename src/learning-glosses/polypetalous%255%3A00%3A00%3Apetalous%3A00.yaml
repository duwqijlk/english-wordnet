simpleMeaning: having many petals that are not joined, forming a ring round the middle of a flower
scope: A flower whose ring is made of many petals that are not joined, not a flower whose ring is made
  of one joined piece.
examples:
- This polypetalous flower has five petals that fall off one by one.
- Gardeners like polypetalous blooms because each petal can be picked on its own.
