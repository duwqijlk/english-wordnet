simpleMeaning: a tube of thin skin-like material with rings of strong, bendable tissue round it, that
  takes air you breathe in from the voice box to tubes leading into the lungs
scope: This is the tube in your throat that carries air to the lungs, also called trachea. It is not the
  tube that carries food to the stomach.
examples:
- Air passes down the windpipe into the lungs.
- He hurt his windpipe and found it hard to breathe.
