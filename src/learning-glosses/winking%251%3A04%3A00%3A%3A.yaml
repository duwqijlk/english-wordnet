simpleMeaning: eyes closing and opening again very fast, on their own
scope: 'Also called a blink, a wink, or blinking: the eyes closing and opening fast on their own, not
  a deliberate wink at someone.'
examples:
- The bright light set off a fit of winking.
- Her winking eased once she put on her glasses.
