simpleMeaning: A calming medicine used to ease worry and to lower strain and quick temper
scope: A calming medicine used to ease worry and to lower strain and quick temper; anxiolytic, anxiolytic
  drug, minor tranquilizer, minor tranquilliser and minor tranquillizer are other names for this sense,
  not a sleeping pill and not a medicine for low mood.
examples:
- The doctor gave her an antianxiety drug for her nerves.
- An antianxiety drug helped him stay calm before the flight.
