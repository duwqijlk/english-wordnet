simpleMeaning: Thinking about something in a quiet, slow, careful way, for a long time
scope: Slow, careful thinking about a thing, not a quick remark about it and not the image in a mirror.
examples:
- After long reflection, she decided to leave the job.
- His reflection on the war filled many pages.
