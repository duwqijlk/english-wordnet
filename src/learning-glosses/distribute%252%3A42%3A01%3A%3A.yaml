simpleMeaning: to be spread out, as numbers are in a statistical analysis (a careful study of numbers)
scope: This is about numbers being spread out in a study, not about giving things out to people or making
  things spread widely.
examples:
- The test scores distribute evenly across the whole range.
- In this study, the values distribute around the middle number.
