simpleMeaning: So bad it puts people off, this smell stands out from other smells
scope: Also called malodour, stink, stench, reek, fetor, foetor and mephitis, this is a smell that stands
  out because it is so bad, not a faint smell and not a pleasant one.
examples:
- The malodor from the drain filled the whole house.
- She held her nose against the malodor of the rotting food.
