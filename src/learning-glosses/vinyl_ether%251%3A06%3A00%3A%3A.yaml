simpleMeaning: Once breathed in to put people to sleep, this clear liquid turns to gas fast and catches
  fire with ease.
scope: Also called ether, diethyl ether, divinyl ether, ethoxyethane, and ethyl ether, it is one of the
  clear liquids once breathed in to put people to sleep, that turns to gas fast and catches fire with
  ease.
examples:
- The vinyl ether caught fire with ease when it met a flame.
- Vinyl ether was breathed in to put a person to sleep.
