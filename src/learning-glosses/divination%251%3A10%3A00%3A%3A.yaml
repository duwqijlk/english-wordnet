simpleMeaning: words that say what will happen, spoken as if they come from God
scope: 'Also called prophecy: the words themselves, spoken about what will happen. It is not the art or
  gift of telling the future, and not a lucky guess that turns out right.'
examples:
- His divination warned that the city would fall.
- The priest wrote down the divination for the king.
