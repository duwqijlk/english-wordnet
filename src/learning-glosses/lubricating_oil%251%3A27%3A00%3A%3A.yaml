simpleMeaning: Most often put on machine parts, this thick, fatty stuff helps them move freely
scope: Also called grease, this is a thick fatty oil used to help machine parts move freely, not oil used
  as fuel and not oil for cooking.
examples:
- He put lubricating oil on the gears before he started the engine.
- The lubricating oil had leaked out of the old machine.
