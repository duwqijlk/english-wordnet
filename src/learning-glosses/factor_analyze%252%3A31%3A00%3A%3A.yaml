synsetId: 00738434-v
simpleMeaning: To work through numbers that rise and fall together, to find the hidden groups behind them.
scope: It is the act of working with scores that change together to bring out the hidden groups in them,
  and factor analyse is another name for this sense, while a plain look at how two scores move together
  and any study of scores in general are different things.
examples:
- They plan to factor analyze the test scores.
- The researchers will factor analyze the survey data.
