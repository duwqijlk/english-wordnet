simpleMeaning: hundreds of tiny yellow flower heads on many thin branches of a low sticky plant of the
  southwestern United States, its leaves narrow and straight
scope: This low sticky plant of the southwest is also called rabbit-weed, broom snakeroot, broom snakeweed,
  snakeweed, and turpentine weed; it is not a rabbit's food plant or a common weed.
examples:
- Rabbitweed covered the dry slope with yellow heads.
- We brushed past rabbitweed on the trail.
