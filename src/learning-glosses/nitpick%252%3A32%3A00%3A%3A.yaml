senseId: 'nitpick%2:32:00::'
synsetId: 00847897-v
simpleMeaning: To keep finding fault over small things that do not matter, criticizing far more than is
  fair.
scope: Finding fault over small things that do not matter; not fair criticism of real faults.
examples:
- She nitpicked every line of the report until the meeting ran late.
- He nitpicked the plan until no one wanted to hear more.
