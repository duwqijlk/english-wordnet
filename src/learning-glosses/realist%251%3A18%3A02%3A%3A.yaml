simpleMeaning: A person who sees the world as it truly is and acts on that
scope: This is a person who deals with things as they are, not a painter of plain scenes and not a thinker
  about what is real.
examples:
- A realist, she planned for the worst and hoped for the best.
- The realist in the group said the plan would cost far more than they thought.
