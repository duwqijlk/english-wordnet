simpleMeaning: Immediate payment for goods or services, made either with coins and notes or with a written
  order to a bank.
scope: It is not money kept in a wallet or bank account; it is the act of paying at once.
examples:
- The seller wanted payment on the spot, not a promise to pay later.
- They offered a lower price to customers who paid immediately.
