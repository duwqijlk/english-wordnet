simpleMeaning: The amount you get when units or individuals are counted or added up, whether the total
  is exact or only approximate.
scope: Not a digit or symbol on a page, not the geometric shape made of points and lines, and not the
  outline of a body.
examples:
- Sales figures for the quarter were higher than anyone expected.
- The unemployment figure fell to its lowest level in five years.
