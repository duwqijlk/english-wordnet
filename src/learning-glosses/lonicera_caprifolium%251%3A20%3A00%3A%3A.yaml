simpleMeaning: A climbing shrub that drops its leaves each year, with sweet-smelling yellow-white flowers
  in rings where the leaves join the stem.
scope: A climbing shrub with sweet-smelling yellow-white flowers, also called Italian honeysuckle and
  Italian woodbine; not a garden rose and not a wild clematis.
examples:
- Lonicera caprifolium climbs over the garden wall.
- The sweet smell of Lonicera caprifolium fills the air in June.
