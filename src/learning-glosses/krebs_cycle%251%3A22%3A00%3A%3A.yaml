simpleMeaning: In all plants and animals, a set of steps in the cell's energy-making parts, in which oxygen
  breaks down chemicals to make chemicals rich in energy for cells
scope: Also called citric acid cycle, tricarboxylic acid cycle, or Krebs citric acid cycle; a set of steps
  in the cell's energy-making parts that gives cells their energy.
examples:
- The Krebs cycle runs in the energy-making parts of every cell.
- Biology class taught us how the Krebs cycle makes energy for cells.
