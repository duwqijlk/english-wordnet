simpleMeaning: All the parts of the organ of hearing, taking in the outer, middle and inner ears
scope: This is all the parts of the organ of hearing, taking in the outer, middle and inner ears, not
  just the outer ear and not a device that helps a person hear.
examples:
- The auditory apparatus takes in the outer, middle and inner ears.
- Damage to any part of the auditory apparatus can affect hearing.
