simpleMeaning: The weight of an element or compound that reacts with or replaces 8 grams of oxygen or
  1.00797 grams of hydrogen; atomic weight divided by valence, or combining power.
scope: A technical chemistry measure of reacting weight, not the mass of one mole or a count of atoms;
  'valence' is glossed here as combining power.
examples:
- The lab reported the gram equivalent of the metal.
- The gram equivalent of an element is its atomic weight divided by its valence.
