simpleMeaning: Not going along with the usual ways of acting or thinking that most people accept
scope: Not going along with the usual ways of acting or thinking that most people accept, also called
  nonconformist, not a person who breaks the law and not a person who just likes new things.
examples:
- His unconformist views set him apart from his neighbours.
- She took an unconformist stand and refused to follow the old rules.
