simpleMeaning: In Greek tales, the boatman who took the souls of the dead over the river Styx or the river
  Acheron to the land of the dead.
scope: In Greek tales, a boatman who takes the dead over a river, not a god who rules the dead or a hero
  who fights monsters.
examples:
- Charon rowed the dead souls across the dark river.
- In the old tale, Charon carried the souls of the dead to Hades.
