simpleMeaning: to put parts in the right place or order so they work well together
scope: This sense, also called coordinate, is about putting parts in the right place so they work well
  together. It is not the sense about joining a group or following its way of thinking.
examples:
- Please align the wheels of the car.
- He aligned the two parts so the holes matched.
