simpleMeaning: likely to move from side to side because it is weak or not well made
scope: 'Also called wobbly and rickety: weak or badly made and likely to move from side to side, not moving
  lightly with fear or cold, and not unsafe or full of problems.'
examples:
- The shaky table fell over when I put the heavy box on it.
- She sat down slowly on the shaky chair with one weak leg.
