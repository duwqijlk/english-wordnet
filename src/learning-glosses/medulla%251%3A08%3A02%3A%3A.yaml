simpleMeaning: At the back of the head, below the rest of the brain, sits the part that runs on into the
  cord; people once called it the bulb.
scope: Also called medulla oblongata and bulb, it is the lowest back part of the brain, joined to the
  cord down the back.
examples:
- The medulla joins the brain to the cord down the back.
- The medulla was once called the bulb.
