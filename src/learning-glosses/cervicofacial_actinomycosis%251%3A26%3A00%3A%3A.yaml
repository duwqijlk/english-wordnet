scope: The most common and mildest form of a germ disease, affecting the face and neck; lumpy jaw is another
  name for this sense, not a disease of the chest and not a bad cut on the face.
examples:
- Cervicofacial actinomycosis left a swelling on his jaw.
- The doctor said cervicofacial actinomycosis was the mildest form of the disease.
