synsetId: 14081051-n
simpleMeaning: A painful condition of the hand and fingers with tingling, burning or numbness and weakness,
  caused by pressure on a nerve in a narrow passage at the wrist.
scope: A nerve problem in the wrist that causes tingling, numbness and weakness in the hand, not arthritis
  or a sprain.
examples:
- Years of typing left her with carpal tunnel syndrome in both wrists.
- The tingling in his fingers turned out to be carpal tunnel syndrome.
