simpleMeaning: love from one person for another that puts the other person first and has nothing to do
  with sex, especially love about the spirit
scope: This is love between people, especially about the spirit, not the love of God or Christ for people
  in Christian teaching.
examples:
- Her agape for her neighbours led her to help them every day with no thought for herself.
- He felt a pure agape for all people, with no wish for sex.
