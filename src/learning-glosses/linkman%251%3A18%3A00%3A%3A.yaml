simpleMeaning: in former times, a helper paid to carry a flaming torch for people walking in dark streets
scope: In former times, a helper paid to carry a flaming torch for people walking in dark streets; linkboy
  is another name for this sense, not a person who lights street lamps and not a guide who shows the way.
examples:
- The linkman led the way with his torch through the dark lane.
- A linkman waited outside the theatre with a burning torch.
