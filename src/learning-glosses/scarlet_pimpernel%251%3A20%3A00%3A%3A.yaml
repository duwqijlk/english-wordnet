simpleMeaning: a low plant with red, white, or purple flowers that shut when rain is near
scope: This is a low plant with red, white, or purple flowers that shut when rain is near; poor man's
  weatherglass and red pimpernel are other names for this sense, not a rose and not a daisy.
examples:
- The scarlet pimpernel closed its flowers before the rain came.
- We saw scarlet pimpernel with red blossoms along the path.
