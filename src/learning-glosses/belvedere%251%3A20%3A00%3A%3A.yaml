simpleMeaning: Leaves that turn purple-red in the fall mark this thickly branched plant of Europe and
  Asia.
scope: Also called burning bush, fire-bush, fire bush, or summer cypress, this bushy plant stands among
  the kinds whose leaves turn purple-red in autumn.
examples:
- The belvedere in the garden turned purple-red when autumn came.
- The belvedere showed purple-red leaves once autumn came.
