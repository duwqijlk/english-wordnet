simpleMeaning: To keep doing well and getting better, or to be at the top point in your work or become
  very important in history
scope: 'Also called thrive: doing well and growing, or being at your best point; not the short lively
  tune played on brass instruments in music.'
examples:
- Her small shop began to flourish after she moved to the busier street.
- He flourished as a teacher in his later years.
