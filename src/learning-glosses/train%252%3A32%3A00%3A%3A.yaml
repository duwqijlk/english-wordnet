simpleMeaning: To teach and watch over a person or team, guiding their practice the way a sports coach
  does.
scope: This is a coach's work of instructing and watching over people, not a railway service or its cars,
  not travelling by railway, not an ordered series of things, events, or ideas, not a line of wagons or
  animals in single file, not a chain of consequences from an event, not a gown's trailing back panel,
  not a set of connected gears, not producing something by instruction and teaching, not the learner's
  own course of preparation, not shaping a child's or animal's behaviour, not preparing someone for a
  career, not refining taste or judgment, not aiming a weapon or camera, not one's own athletic exercise
  for a competition, not pruning a plant into a shape, and not dragging something along the ground.
examples:
- She agreed to train the young swimmers before school each morning.
- For three seasons he trained the village football team.
