simpleMeaning: Of breeding, marked by processes with no mating.
scope: This sense is also called vegetative, for what is, of breeding, marked by processes with no mating,
  unlike the sense for what is made of plants.
examples:
- The growth was vegetal, with no mating involved.
- The breeding was vegetal, needing no mate.
