simpleMeaning: in botany, a plant that finishes its whole life within one year
scope: A plant that lives out its whole life in one year, not a book published once a year, nor the adjective
  for something happening each year.
examples:
- Marigolds are annuals that must be replanted every year.
- The garden is full of annuals that die when the cold arrives.
