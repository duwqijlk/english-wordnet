simpleMeaning: A stage play that goes against the set rules for making plays, and turns away from lifelike,
  old, usual, and accepted ways of doing them
scope: This is a stage play that breaks the set rules for making plays, not one that follows them.
examples:
- The new anti-theatre piece broke every rule the crowd knew for a play.
- The anti-theatre show left the old rules behind.
