simpleMeaning: The blood tube behind the knee takes in blood from the parts around the knee, through these
  tubes.
scope: Also called genicular vein, these tubes serve the knee, carrying its blood to the tube behind the
  knee.
examples:
- Blood around the knee leaves through the vena genus.
- The vena genus carries blood from the knee to the tube behind it.
