simpleMeaning: A round pad on the head lets these flat, long sea animals hold on to big sea animals or
  things that move.
scope: Also called remora and sucking fish, this sea animal holds on to big sea animals or things that
  move.
examples:
- A suckerfish held on to the shark with the disk on its head.
- We saw a suckerfish riding on the side of a big ray.
