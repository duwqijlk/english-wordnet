simpleMeaning: to behave in a wild and violent way, like a person who is very angry
scope: 'Also called storm: a person acts in a wild, forceful way with great anger; it is not a fire or
  a weather storm burning or moving with great force.'
examples:
- He raged around the room, shouting and throwing chairs.
- She raged and threw papers across the room.
