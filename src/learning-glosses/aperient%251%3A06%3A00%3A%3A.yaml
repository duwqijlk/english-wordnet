simpleMeaning: a medicine that makes a person empty their bowels
scope: 'Also called cathartic, physic and purgative: a medicine that clears the bowels, not a medicine
  that settles the stomach and not a painkiller.'
examples:
- The doctor gave him an aperient to clear his bowels before the test.
- She took an aperient when days passed with no bowel movement.
