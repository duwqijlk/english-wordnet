schema: oewn-learning-gloss-v2
senseId: 'put_off%2:32:03::'
synsetId: 00811316-v
simpleMeaning: To keep from doing a duty, giving an answer, or dealing with a problem, or to try to keep
  from it
scope: Also called duck, skirt, hedge, dodge, parry, elude, evade, sidestep, fudge and circumvent, this
  is avoiding a duty, a question or a problem, not pushing a thing away from you and not delaying a meeting
  to a later date.
examples:
- He put off the question by changing the subject.
- She put off her duties by finding excuses.
