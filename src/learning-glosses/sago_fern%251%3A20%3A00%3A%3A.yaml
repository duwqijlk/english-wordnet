simpleMeaning: Whitish underneath, the feathery leaves form a crown on this showy tree fern of New Zealand
  and Australia.
scope: 'Also called black tree fern and silver tree fern: a showy tree fern of New Zealand and Australia
  with a crown of feathery leaves.'
examples:
- The sago fern had a crown of feathery leaves, whitish underneath.
- Sago ferns grow in New Zealand and Australia.
