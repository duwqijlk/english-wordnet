simpleMeaning: a liquid or gas that keeps moving along in an unbroken run, most often from a natural cause
scope: 'Another name for current in this sense: liquid or gas moving steadily, not a natural body of water
  such as a river and not the main course of events or ideas.'
examples:
- A stream of cold air came under the door.
- Water ran in a stream down the hillside.
