simpleMeaning: a short tube fixed to the end of a gun barrel that makes the sound of a shot much quieter
scope: A short tube on a gun that makes a shot quieter, not a device in a car's exhaust pipe that cuts
  the noise of its engine.
examples:
- He fitted a silencer to the gun before the test shot.
- With a silencer in place, the shot made only a soft click.
