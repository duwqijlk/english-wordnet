simpleMeaning: a piece of jewelry worn on the ear, usually held on the soft lower part of the ear or put
  through a hole in it
scope: A piece of jewelry worn on the ear; not a ring worn on a finger, and not a chain worn around the
  neck.
examples:
- She wore gold earrings to the party.
- He bought one earring after having his ear pierced.
