simpleMeaning: A celebration in the Eastern Orthodox Church of the Virgin Mary being taken into heaven
  when her earthly life ended, matching the Assumption in the Catholic Church on August 15th.
scope: Also called Dormition; the Eastern Orthodox feast on August 15th for Mary being taken into heaven.
examples:
- The Feast of Dormition falls on August 15th.
- We went to church for the Feast of Dormition.
