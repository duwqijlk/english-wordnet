simpleMeaning: This tool measures how much ground a flat shape with uneven sides covers
scope: 'Also called an integrator: a tool that measures the size of a flat shape with uneven sides, not
  a ruler for straight lines and not a tool for measuring length.'
examples:
- The surveyor used a planimeter to work out the size of the field.
- With a planimeter, she traced round the shape and read off its size.
