simpleMeaning: three times as great or as many in number
scope: This describes a thing that is three times as great or as many; it is not the word for how a change
  happens by three times, and not the sense about having unlike parts.
examples:
- The town saw a threefold increase in visitors last year.
- He asked for threefold damages for the harm done to his land.
