simpleMeaning: In genetics, a change in a gene caused by a shift inside the gene itself
scope: In genetics, a change in a gene caused by a shift inside the gene itself; also called gene mutation;
  not a change that adds or drops a whole gene and not a change in a whole set of genes.
examples:
- A point mutation changed one letter of the gene.
- The point mutation made the gene give a new signal.
