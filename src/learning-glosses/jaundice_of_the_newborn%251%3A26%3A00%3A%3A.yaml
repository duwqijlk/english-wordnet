simpleMeaning: A yellowish look in a baby just born, which usually fades away on its own.
scope: A yellowish look in a baby just born; icterus neonatorum and physiological jaundice of the newborn
  are other names for it, not the yellowish look of an older child or adult.
examples:
- The doctor said the jaundice of the newborn would fade in a few days.
- Jaundice of the newborn is common in the first week of life.
