simpleMeaning: An upright plant that lives one year, with egg-shaped leaves and pink flowers, used to
  add taste to meats, soups, and salads; from southeastern Europe, now growing wild elsewhere.
scope: Also called summer savory and Satureja hortensis; a kitchen herb used to add taste to food, not
  a plant grown only for its looks.
examples:
- Satureia hortensis grows in a pot on my kitchen shelf.
- I add Satureia hortensis to the soup for extra taste.
