simpleMeaning: the act of putting one person or thing in the place of another, in particular one thought
  to be better
scope: The act of putting one person or thing in the place of another; supersession is another name for
  this sense, not merely following after a thing in time.
examples:
- The supersedure of the old manager took a week.
- The new law brought the supersedure of the old rule.
