simpleMeaning: unwilling to accept or listen to views that go against beliefs held dear
scope: About a person who will not listen to views against beliefs they hold dear, not about a body that
  cannot take a food or a medicine.
examples:
- He is intolerant of any view that goes against his dearest beliefs.
- The intolerant leader refused to hear views that differed from his own faith.
