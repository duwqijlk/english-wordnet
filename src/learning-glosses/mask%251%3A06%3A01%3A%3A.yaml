simpleMeaning: something worn over the face to keep a person safe from harm
scope: A covering worn to keep the face safe; not a covering worn to hide who you are, and not a party
  where guests wear such coverings.
examples:
- Workers wear a mask to keep dust out of their lungs.
- He put on a gas mask before going into the smoky room.
