simpleMeaning: The voice rises and falls, or takes a set tone, when a person says words with care
scope: To say words with care, letting the voice rise and fall or take a set tone, also called intone;
  not to chant or sing words and not to speak in a flat voice.
examples:
- The actor learned to intonate each line so the audience could feel the mood.
- She asked him to intonate the question with a rising voice.
