simpleMeaning: a thing that closes something, made of resin (a sticky substance from trees), soft and
  easy to shape when warm, used to close documents, parcels and letters
scope: The warm, soft substance used to close letters and parcels. Not the sea animal, not the tool that
  presses a mark, and not a mark on paper.
examples:
- He melted the seal and let it drop onto the envelope to close it.
- The parcel was closed with a dark red seal.
