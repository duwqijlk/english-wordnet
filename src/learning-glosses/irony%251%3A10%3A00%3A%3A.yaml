simpleMeaning: a way of speaking in which what happens does not match what was expected
scope: A way of speaking where what happens does not match what was expected, not clever words meant to
  mock or insult.
examples:
- The irony was that the fire station burned down.
- It was pure irony that the rain came on the day of the water festival.
