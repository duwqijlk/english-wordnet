simpleMeaning: A wrestling grip where one fighter slips an arm under the other fighter's arm and presses
  on the back of the neck.
scope: This is a wrestling grip that presses on the back of the neck, not a grip around the waist.
examples:
- He pinned his rival with a half nelson.
- The half nelson ended the bout.
