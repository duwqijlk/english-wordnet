simpleMeaning: A wild lily of dry northwestern North America with one to three pale purple blooms in loose
  umbrella-like clusters on thick upright stems.
scope: This is a wild lily of the dry Northwest, not a garden tulip and not the sagebrush plant.
examples:
- Sagebrush mariposa tulips opened their pale purple flowers along the dry ridge.
- The sagebrush mariposa tulip grows east of the Cascades in open, arid country.
