simpleMeaning: to arrange the parts of something in an organized way so they form a whole.
scope: This is about arranging the parts of something into an organized pattern, not about building something
  or about the shape a finished thing already has.
examples:
- She structured her essay around three main arguments.
- The committee structured the program to allow time for questions.
