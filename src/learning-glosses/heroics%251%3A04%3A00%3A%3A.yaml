senseId: 'heroics%1:04:00::'
synsetId: 00552751-n
simpleMeaning: acting in a showy way that is too much and too full of strong feeling, as if trying to
  win praise from other people
scope: This is showy, overdone acting done to win praise; it is not truly brave deeds and not brave help
  in real danger.
examples:
- His heroics in the meeting annoyed everyone, as he spoke loudly as if he alone were saving the firm.
- She was tired of his heroics and asked him to talk in a plain, calm way.
