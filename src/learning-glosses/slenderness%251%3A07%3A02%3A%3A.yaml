simpleMeaning: how thin a thing is from one side to the other, as against how long or wide it is
scope: 'Also called thinness and tenuity: how thin a thing is through, as against how long or wide it
  is; not the length of a thing and not its width.'
examples:
- The slenderness of the rope made it hard to grip.
- We admired the slenderness of the wire.
