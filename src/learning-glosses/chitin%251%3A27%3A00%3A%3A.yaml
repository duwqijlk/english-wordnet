simpleMeaning: The hard outer cover of jointed animals, and the walls of some fungi cells, are made of
  this hard, clear, horn-like stuff
scope: A hard substance in the outer covers of jointed animals, not bone and not horn.
examples:
- Chitin gives a crab shell its hard cover.
- Fungi use chitin in the walls of their cells.
