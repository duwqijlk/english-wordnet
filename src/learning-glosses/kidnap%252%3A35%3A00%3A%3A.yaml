simpleMeaning: to seize a person against their will and hold them hidden, usually to force their family
  to pay money before they are set free
scope: 'Also called snatch and abduct: taking a person away by force to a hidden place, usually for money,
  not simply taking something away and not a lawful arrest.'
examples:
- The industrialist's son was kidnapped.
- The gang kidnapped the child and hid him in an old farmhouse.
