simpleMeaning: A way of defending oneself with no weapons, worked out in China and Japan, where holds
  and blows are helped by clever use of the attacker's own weight and strength.
scope: Also called jiujitsu and jujutsu, this is the weaponless way of defending oneself worked out in
  China and Japan.
examples:
- She learned jujitsu to defend herself.
- Jujitsu uses the attacker's own weight against them.
