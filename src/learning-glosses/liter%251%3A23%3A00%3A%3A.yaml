simpleMeaning: a metric unit for how much a container holds, once the space filled by a kilogram of pure
  water under standard conditions, now 1,000 cubic centimetres, about 1.75 pints
scope: A unit for how much a container holds; not a pint and not a measure of weight.
examples:
- Pour two liters of water into the pot.
- A liter of milk costs more now.
