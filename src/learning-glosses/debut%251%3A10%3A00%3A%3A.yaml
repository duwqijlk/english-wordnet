simpleMeaning: the first time a young woman is formally brought into the social world of rich and well-known
  people
scope: The first formal showing of a young woman in high society, not the first show or act of a singer
  or actor.
examples:
- Her debut was the talk of the town that season.
- The family planned a grand debut for their daughter.
