simpleMeaning: Tough wings in front and thin wings behind mark a bug of many kinds that bites its food.
scope: 'It is also called orthopteran and orthopteron: a bug of many kinds with tough front wings, thin
  back wings, and mouth parts made for biting.'
examples:
- The orthopterous insect chewed with its mouth parts.
- An orthopterous insect showed tough front wings and thin back wings.
