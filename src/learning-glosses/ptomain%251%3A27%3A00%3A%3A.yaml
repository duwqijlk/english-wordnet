simpleMeaning: One of many chemicals made when tiny living things rot dead matter
scope: One of the things made as dead matter rots, and ptomaine is another name for this sense, not the
  rot itself and not the tiny living things that do the rotting.
examples:
- The old meat was full of ptomain from the rot.
- Doctors once blamed ptomain in spoiled food for making people ill.
