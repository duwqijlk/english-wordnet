simpleMeaning: In physics, the study that foretells how big systems will act, using laws of chance that
  rule the tiny bits that make them up.
scope: In physics, the study that foretells how big systems will act from laws of chance, not a study
  that tracks each tiny bit on its own.
examples:
- Statistical mechanics uses laws of chance to foretell how big systems will act.
- In statistical mechanics, the acts of big systems rest on laws of chance.
