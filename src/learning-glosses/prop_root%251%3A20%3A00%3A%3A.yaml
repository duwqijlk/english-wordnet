simpleMeaning: a part of a plant that grows out of the stem above the ground and holds the plant up, as
  in mangroves
scope: A part of a plant that comes from the stem above the ground and holds the plant up, not a part
  that stays under the ground and not a branch.
examples:
- The mangrove's prop roots held it up in the soft mud.
- Prop roots grew from the stem above the ground.
