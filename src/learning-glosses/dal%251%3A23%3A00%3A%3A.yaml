simpleMeaning: In the metric system, a unit for measuring how much space a thing takes up or can hold,
  equal to 10 liters
scope: This is a unit for measuring size or how much something can hold, equal to 10 liters; it is not
  a unit of weight or of length.
examples:
- The small tank holds 5 dal of water.
- She measured out 2 dal of milk for the large pot.
