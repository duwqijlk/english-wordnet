simpleMeaning: To treat someone far too kindly, letting them have what they want.
scope: To treat someone far too kindly, letting them have what they want, not merely to be kind in a fair
  way.
examples:
- Do not indulge the child with sweets every day.
- Grandparents often indulge their grandchildren.
