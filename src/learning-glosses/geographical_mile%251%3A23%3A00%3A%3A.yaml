simpleMeaning: An old British length unit of 6,080 feet (1,853.184 meters), 800 feet longer than the usual
  land unit.
scope: This is an old British length unit of 6,080 feet; mile, mi, naut mi and nautical mile are other
  names for this sense, not a unit of 1,000 meters and not a short unit of 3 feet.
examples:
- A geographical mile is 800 feet longer than a land mile.
- Old charts used the geographical mile.
