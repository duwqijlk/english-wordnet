simpleMeaning: A woman paid to clean and look after bedrooms, now most of all in hotels.
scope: A woman paid to clean and look after bedrooms, now most of all in hotels; also called chambermaid,
  not a cook and not a woman who looks after children.
examples:
- The fille de chambre made the bed and cleaned the room.
- A fille de chambre knocked and asked if she could clean the bedroom.
