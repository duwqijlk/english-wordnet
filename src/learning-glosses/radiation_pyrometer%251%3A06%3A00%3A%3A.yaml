simpleMeaning: Heat from far away is caught and bent onto a heat-to-electric joint wired to a meter, giving
  a read of how hot the far source is.
scope: A tool that reads how hot a far source of heat is from the heat it sends out.
examples:
- The radiation pyrometer read the heat of the distant furnace.
- With a radiation pyrometer, she measured the hot metal from far away.
