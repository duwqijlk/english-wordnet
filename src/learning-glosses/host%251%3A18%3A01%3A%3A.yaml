simpleMeaning: a person who introduces the speakers and gives the opening speech at a formal event
scope: The person who introduces the speakers at a formal event, not someone who invites guests to a party
  in their own home.
examples:
- The host welcomed the audience and introduced each of the evening's speakers.
- As host of the awards ceremony, she gave a short opening speech.
