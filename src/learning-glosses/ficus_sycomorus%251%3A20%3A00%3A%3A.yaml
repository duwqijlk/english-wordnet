simpleMeaning: A thick-branched tree of Africa and southwest Asia, propped by branches; it bears clusters
  of edible but poor figs on bare twigs, and it is the sycamore of the Bible.
scope: Not other fig trees, nor the sycamore of North America; also called sycamore, mulberry fig, and
  sycamore fig.
examples:
- Ficus sycomorus grows across Africa.
- The shade of a Ficus sycomorus is wide.
