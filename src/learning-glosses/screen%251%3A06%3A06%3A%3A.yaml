simpleMeaning: A white or shiny surface on which films or slides are shown.
scope: This sense is not a cover that blocks sight or an electronic display, but a surface on which projected
  images are shown.
examples:
- The teacher pulled down the screen and started the film.
- They projected the wedding photos onto a large screen.
