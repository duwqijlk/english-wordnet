simpleMeaning: any of a large group of long thin reptiles with poison fangs that live in warm parts of
  both halves of the world
scope: Any of a large group of snakes with poison fangs, also called elapid; not a snake with no poison
  and not a snake that squeezes its prey.
examples:
- The elapid snake raised its head and showed its fangs.
- That elapid snake is one of the venomous kinds.
