simpleMeaning: In grammar, this word form shows the tool, way or place of an action, and the doer when
  the sentence is passive.
scope: This word form, also called ablative, marks the doer, tool, way or place of an action in a sentence.
examples:
- The ablative case marks where the action took place.
- The ablative case in the sentence marks the tool used.
