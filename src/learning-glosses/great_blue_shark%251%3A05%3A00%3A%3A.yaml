simpleMeaning: Above all when ships are lost at sea, this slim fish of the open seas all over the world
  is dangerous, blue on top and white below.
scope: This fish, blue on top and white below, is also called blue shark.
examples:
- We saw a great blue shark in the open sea.
- The great blue shark's back was blue and its belly white.
