simpleMeaning: a loose dress that falls straight from the shoulders and has no waist
scope: A loose outer dress, not a woman's sleeveless undergarment, and not a work period.
examples:
- She wore a plain white shift to the summer party.
- The shift fell straight from her shoulders to her knees.
