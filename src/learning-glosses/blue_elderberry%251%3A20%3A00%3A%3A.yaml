simpleMeaning: People in the west of the United States pick the sky-coloured fruit of this bush or small
  tree, with its white blooms, for wine and jelly.
scope: This bush is also called blue elder.
examples:
- The blue elderberry bush bore white blooms.
- We made wine from blue elderberries.
