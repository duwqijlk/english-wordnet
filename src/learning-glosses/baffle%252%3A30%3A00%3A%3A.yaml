simpleMeaning: To hold back the flow of sound, liquid, or anything else that comes out
scope: To hold back the flow of sound, liquid, or anything else that comes out, also called regulate,
  not the flat plate that guides flow.
examples:
- The walls were built to baffle the sound from the road.
- He used a thick cover to baffle the noise of the machine.
