simpleMeaning: A body chemical used to mark the things in body tissue that set off the body's defences,
  and the body-made proteins that join to them
scope: A body chemical used to mark the things in body tissue that set off the body's defences, and the
  body-made proteins that join to them; not a dye itself, and not a chemical that kills germs.
examples:
- Horseradish peroxidase is used to label antigens in the sample.
- The lab used horseradish peroxidase to mark the antibodies.
