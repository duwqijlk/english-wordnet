simpleMeaning: the crime of killing a person, when the killer held no wish to harm them before the act
scope: This is the crime of killing another person without a wish to harm them formed before the act.
  It is not murder, where that wish is there before the killing, and not killing yourself.
examples:
- He was charged with manslaughter after the man he pushed fell and died.
- The driver was found guilty of manslaughter for killing a cyclist while driving carelessly.
