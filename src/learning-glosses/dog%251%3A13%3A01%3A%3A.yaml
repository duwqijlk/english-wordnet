simpleMeaning: a smooth sausage made of finely chopped beef or pork, usually smoked, and often served
  in a bread roll
scope: This is the sausage served in a roll, not the four-legged animal kept as a pet.
examples:
- He bought a hot dog and a drink at the ballpark.
- The diner serves chili dogs with onions and cheese.
