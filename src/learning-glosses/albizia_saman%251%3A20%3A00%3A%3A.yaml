simpleMeaning: A large tropical American tree grown for show, with leaves split twice into small leaflets
  and round groups of flowers with deep red stamens, and seed pods eaten by cattle.
scope: Not a mango or a flame tree, other tropical trees; also called a monkey pod, a monkeypod, a rain
  tree, saman, zaman, and zamang.
examples:
- Albizia saman shades the village square.
- Cattle eat the pods of Albizia saman.
