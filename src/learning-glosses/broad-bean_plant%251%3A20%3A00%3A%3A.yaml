simpleMeaning: a thing that grows from the Old World, standing straight up, grown most of all for its
  big flat seeds people eat, and also grown to feed farm animals
scope: 'Also called broad-bean, broad bean and field bean: a plant that stands straight up and is grown
  for its big flat seeds, not a low spreading plant and not a kind of pea.'
examples:
- A broad-bean plant grew beside the fence.
- The broad-bean plant gives large flat seeds.
