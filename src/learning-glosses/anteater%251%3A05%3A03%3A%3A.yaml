simpleMeaning: A burrowing egg-laying mammal covered in spines, with a long snout and claws for hunting
  ants and termites, native to New Guinea.
scope: Also called an echidna or a spiny anteater; a spiny egg-laying burrower of New Guinea, not the
  African night kind, the Australian kind, or the scaly kind.
examples:
- The anteater lives in the highlands of New Guinea.
- An anteater in New Guinea digs for ants with its strong claws.
