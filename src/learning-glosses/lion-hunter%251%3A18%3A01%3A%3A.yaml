simpleMeaning: Well-known people are the ones this person tries to bring in as guests
scope: A person who courts famous guests, not someone who chases wild animals and not a host who invites
  close friends.
examples:
- He became known as a lion-hunter after his parties filled with famous actors.
- The lion-hunter sent notes to every star in town, hoping they would come.
