simpleMeaning: Something spoken, written, or put together on the spot, with no time to get it ready first.
scope: A thing made up on the spot with no planning, not a work planned out in advance.
examples:
- His improvisation on the piano thrilled the crowd.
- The speech was pure improvisation, made up as he went.
