simpleMeaning: in a way that is not smooth or natural, and is hard to do well
scope: This describes how an action is done, in a way that lacks ease; it is not a word for a person or
  a thing.
examples:
- He walked awkwardly after hurting his foot.
- She held the big box awkwardly in both arms.
