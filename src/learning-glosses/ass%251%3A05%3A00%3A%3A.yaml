simpleMeaning: a strong animal like a horse but smaller, with longer ears, that does not fall easily on
  rough ground
scope: This is the strong animal like a horse but smaller, with longer ears. It is not the slang word
  for sex.
examples:
- The ass carried the bags up the steep path.
- An ass can walk safely on narrow mountain paths.
