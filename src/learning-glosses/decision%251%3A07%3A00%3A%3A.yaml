simpleMeaning: the quality of being determined and not changing your mind, shown in your character or
  purpose.
scope: This is a personal quality of firmness, not a choice you make about what to do.
examples:
- She spoke with quiet decision, and no one dared interrupt.
- The nurse acted with decision when the patient collapsed.
