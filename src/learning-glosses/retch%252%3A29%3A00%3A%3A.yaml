simpleMeaning: To push what is in your stomach back out through your mouth.
scope: 'Also called sick, cat, cast, vomit, puke, chuck, purge, honk, and spew: to push what is in your
  stomach back out through your mouth, not the failed effort to do so, and not the spasm itself.'
examples:
- The smell made him retch into the sink.
- After the rough sea crossing, she retched over the side of the boat.
