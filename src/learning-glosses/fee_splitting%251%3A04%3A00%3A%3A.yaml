simpleMeaning: usually by a doctor or lawyer, paying part of the money they got to the person who sent
  a client to them
scope: Paying part of the money received to the person who sent a client, usually by a doctor or lawyer,
  not a gift and not a charge for the work itself.
examples:
- Fee splitting is banned in many states.
- The doctor was fined for fee splitting after he paid a clinic for sending patients to him.
