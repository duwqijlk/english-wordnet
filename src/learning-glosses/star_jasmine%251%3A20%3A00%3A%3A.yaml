simpleMeaning: White flowers with a strong sweet smell open on this climbing plant from China, which keeps
  its leaves all year and has woody stems and shining dark green leaves.
scope: Also called confederate jasmine, it is a climbing plant from China with white flowers, not a jasmine
  that loses its leaves in winter.
examples:
- Star jasmine covered the wall with white flowers.
- The star jasmine climbed over the fence.
