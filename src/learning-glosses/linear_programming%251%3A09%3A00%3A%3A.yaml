simpleMeaning: In maths for money matters, a way to find the biggest or smallest answer from straight-line
  sums with many unknowns, kept inside set limits.
scope: A maths method for best answers under limits, not a computer program.
examples:
- The firm used linear programming to work out the cheapest way to ship its goods.
- Linear programming helped the shop find the most it could earn within its budget.
