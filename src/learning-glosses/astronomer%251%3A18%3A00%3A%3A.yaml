simpleMeaning: a physicist (a person who studies how nature works) who studies stars, planets and space
scope: A person whose work is studying stars, planets and space, not a person who only looks at stars
  for fun and not a person who studies the earth.
examples:
- The astronomer spent the night studying a far planet.
- As an astronomer, she writes about stars and space.
