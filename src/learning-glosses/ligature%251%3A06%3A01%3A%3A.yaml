simpleMeaning: A thread that a surgeon uses to tie off a blood vessel, so as to narrow or stop the flow
  of blood.
scope: A thread that a surgeon uses to tie off a blood vessel, so as to narrow or stop the flow of blood;
  not the metal band that holds a reed to the mouthpiece of a clarinet or a saxophone.
examples:
- The surgeon tied the ligature round the vessel to stop the bleeding.
- A ligature held the small blood vessel closed.
