simpleMeaning: a place where train cars and engines are stored and repaired, with many tracks and side
  lines.
scope: A railway depot, not the ground around a house, a place where logs are piled, or the unit of length.
examples:
- Dozens of freight cars waited in the yard for repairs.
- He worked the night shift moving trains around the yard.
