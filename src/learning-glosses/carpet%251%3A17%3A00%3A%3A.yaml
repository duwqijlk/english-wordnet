simpleMeaning: a thing in nature that looks like a thick cloth spread on the ground
scope: A thing in nature that looks like a thick cloth spread on the ground, not a cloth made to lay on
  a floor.
examples:
- A carpet of blue flowers covered the whole hill.
- Spring left a carpet of fallen leaves on the path.
