simpleMeaning: led by sudden wishes and sudden ideas
scope: This is for a person who is led by sudden wishes and sudden ideas; flighty and scatterbrained are
  other names for this sense. Not the sense for loose hair or clothes.
examples:
- The flyaway young girls changed their plans every hour.
- He has a flyaway way of making choices without thinking first.
