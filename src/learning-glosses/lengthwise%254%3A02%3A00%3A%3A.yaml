simpleMeaning: in the direction from one end of something to the other end
scope: 'Also called lengthways: going from one end of a thing to the other. It is not the adjective sense
  that describes a thing as running in that direction.'
examples:
- Fold the cloth lengthwise before you cut it.
- She sliced the cucumber lengthwise.
