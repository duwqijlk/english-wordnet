simpleMeaning: a small North American rabbit with grey or brown fur and a white underside to its tail,
  and ticks that spread Lyme disease live on it
scope: The North American rabbit with a white tail underside, not a hare or jackrabbit; cottontail rabbit
  and wood rabbit are other names for it, and those synonym rows sit in lane 6.
examples:
- A cottontail bolted from the hedge and vanished into the field.
- Cottontails are common in the meadows around the farm.
