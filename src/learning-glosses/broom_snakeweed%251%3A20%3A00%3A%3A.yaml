simpleMeaning: A sticky low half-shrub from the southwest of the United States, its slim twigs in plenty
  bearing straight thin leaves and yellow blooms by the hundred.
scope: This sense is also called broom snakeroot, rabbit-weed, rabbitweed, snakeweed, and turpentine weed,
