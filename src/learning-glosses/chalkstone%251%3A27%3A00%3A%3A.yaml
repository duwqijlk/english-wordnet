simpleMeaning: Salts left around a joint or in the outer ear show gout that is far gone or has lasted
  a long time
scope: This lump of salts is also called tophus; it shows gout that is far gone or has lasted a long time.
examples:
- The doctor found a chalkstone near the man's ear.
- A chalkstone had formed around one of her joints.
