simpleMeaning: a cloth worn over the head, also as a veil or shawl, by Muslim and Hindu women
scope: A cloth worn over the head, also as a veil or shawl, by Muslim and Hindu women; chador, chadar
  and chaddar are other names for it, not a hat and not a dress.
examples:
- She draped a chuddar over her head before going out.
- The chuddar served her as both veil and shawl.
