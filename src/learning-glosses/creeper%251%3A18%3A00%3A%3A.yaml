simpleMeaning: a person who moves along the ground on their hands and knees or with their body close to
  the ground
scope: 'Also called a crawler: a person who moves along the ground, not a small bird that climbs up trees
  and not a plant that grows along the ground.'
examples:
- The baby was a happy creeper, moving across the floor on all fours.
- The soldier was a quiet creeper, staying low as he crossed the field.
