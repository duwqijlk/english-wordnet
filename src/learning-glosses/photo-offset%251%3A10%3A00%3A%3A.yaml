simpleMeaning: In this way of printing, the ink goes first onto a roller and then onto the paper, from
  plates made by light
scope: 'Also called photo-offset printing: a way of printing from plates made by light, not ordinary letterpress
  printing and not copying by hand.'
examples:
- The photo-offset press printed the posters quickly.
- Our brochure was made by photo-offset.
