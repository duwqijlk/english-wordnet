simpleMeaning: A support made of a set of joined frames, used under a bridge, a pier, or a scaffold
scope: A support made of joined frames under a bridge, pier, or scaffold, not a single beam and not the
  bridge deck itself.
examples:
- The trestlework held up the old railway bridge.
- Builders raised the trestlework before laying the pier.
