simpleMeaning: a monkey that lives in the hot forests of South America and makes a very loud cry
scope: 'Also called howler monkey: a monkey of the South American forests known for its very loud cry,
  not a person or animal that just makes a loud noise.'
examples:
- A howler woke us with its loud cry at dawn.
- The howler sat in a tall tree and called loudly to the others.
