simpleMeaning: to climb in an awkward way, as when you use your hands and feet to pull yourself up
scope: 'Also called skin, struggle, shin, scramble and clamber: to climb in an awkward way, not to spit
  out liquid and not to say words in anger.'
examples:
- He sputtered up the steep bank, slipping twice on the wet grass.
- The boys sputtered over the high wall and dropped down on the other side.
