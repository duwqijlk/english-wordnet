simpleMeaning: The closing of a business in which what it owns is sold to pay what it owes.
scope: 'Another name for a settlement: a firm is shut down and what it owns is sold to pay what it owes,
  not a firm that closes and keeps what it owns.'
examples:
- The court ordered the liquidation of the firm after it failed to pay its debts.
- After the liquidation, the firm's goods were sold and the money went to its creditors.
