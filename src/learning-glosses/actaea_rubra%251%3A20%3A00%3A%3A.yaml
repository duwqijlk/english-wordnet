simpleMeaning: A long-lived North American herb with leaves in turns made of leaflets, and clusters of
  small white flowers followed by bright red oval poisonous berries.
scope: Also called red-berry, red baneberry, redberry, and snakeberry; a long-lived North American herb
  with small white flowers and bright red poisonous berries, not the white baneberry and not the black
  cohosh.
examples:
- Actaea rubra bears bright red berries that are poisonous.
- The small white flowers of Actaea rubra grow in clusters.
