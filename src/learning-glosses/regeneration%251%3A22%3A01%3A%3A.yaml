simpleMeaning: a signal sent back to the input (feedback) that rises and falls at the same time as the
  input and makes the input stronger
scope: This is the signal sense, not forming something again in a better form and not the growth of new
  body tissue after loss.
examples:
- Regeneration in the circuit made the weak input signal stronger.
- The engineer used regeneration to build up the signal from the feedback.
