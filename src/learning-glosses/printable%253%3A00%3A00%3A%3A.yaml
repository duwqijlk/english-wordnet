simpleMeaning: Good enough to be put in a book or paper, with nothing wrong or against the law in it
scope: Words or pictures fit to go in a book or paper, with nothing wrong or against the law in them;
  not words fit only for private use.
examples:
- The editor said the story was printable and could go in the paper.
- His language was not printable, so the paper left those words out.
