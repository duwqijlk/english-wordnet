simpleMeaning: A weapon of war that lets loose great power from atoms by joining the light parts of hydrogen
  atoms at high heat to form helium.
scope: Also called a fusion bomb, a hydrogen bomb, or a thermonuclear bomb; a weapon of war made by joining
  tiny bits of gas in a furnace to make a new gas, letting loose great power from atoms.
examples:
- The H-bomb lets loose great power by joining the light parts of hydrogen atoms at high heat.
- An H-bomb forms helium when the light parts of hydrogen atoms join at high heat.
