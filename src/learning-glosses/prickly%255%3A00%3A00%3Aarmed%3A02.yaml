simpleMeaning: Covered with sharp points such as spines, thorns, or stiff hairs that keep animals away.
scope: Covered with sharp points, also called barbed and bristled, not smooth and soft to the touch.
examples:
- The prickly shrub tore at her sleeves.
- Be careful of the prickly leaves of the cactus.
