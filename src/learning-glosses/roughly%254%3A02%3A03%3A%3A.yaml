simpleMeaning: in a hard, violent way, without being gentle; in informal speech a shorter form is used
  for this
scope: 'Also called rough in informal speech: in a hard, violent way, not about a number or amount, and
  not moving over an uneven surface.'
examples:
- He pushed her roughly aside.
- They treated him roughly and left him hurt.
