simpleMeaning: From the warm lands of the Old World comes a rough plant that lives one year, with spikes
  of flowers shaped like fingers, now a weed that grows wild elsewhere
scope: Also called goose grass, wire grass, and yard grass, this rough plant of the warm lands of the
  Old World lives one year and is now a weed that grows wild elsewhere.
examples:
- Yardgrass has spikes of flowers shaped like fingers.
- Yardgrass now grows wild far from the Old World.
