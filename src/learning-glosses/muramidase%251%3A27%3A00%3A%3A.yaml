simpleMeaning: Some germs have walls this helper chemical breaks down, and spit, sweat, and tears all
  carry it.
scope: This helper chemical in spit, sweat, and tears is also called lysozyme, and it works by breaking
  down the walls of some germs.
examples:
- A drop of muramidase in tears breaks down the walls of germs that land there.
- Muramidase in sweat attacks the walls of some germs on the skin.
