simpleMeaning: Syphilis that affects the spinal cord, damaging sensory nerves and causing stabbing pains
  in the trunk and legs, an unsteady walk, incontinence and erectile dysfunction.
scope: This is the spinal-cord form of syphilis, not a hereditary or cerebellar ataxia; tabes dorsalis
  is another name for the same condition.
examples:
- Locomotor ataxia was once a common late result of untreated syphilis.
- Locomotor ataxia can cause stabbing pains in the legs and difficulty walking.
