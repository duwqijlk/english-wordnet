simpleMeaning: speech that people argue over, or a dispute where people strongly disagree with each other
scope: 'Also called argument and arguing: speech people argue over, or a dispute with strong disagreement,
  not a small liking for one side and not leaning away from upright.'
examples:
- He got into a tilt with his brother about the money, and both men shouted.
- Their tilt over the new law was loud, with each side strongly against the other.
