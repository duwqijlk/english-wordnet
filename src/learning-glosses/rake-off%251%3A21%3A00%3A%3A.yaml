simpleMeaning: a share of the money won or gained, taken by the person who runs the game or by a crook
scope: 'Also called vigorish: a share taken by the one who runs the game, not a fair fee and not a tip.'
examples:
- The gangster took a rake-off from every card game.
- He paid a rake-off to the man who ran the club.
