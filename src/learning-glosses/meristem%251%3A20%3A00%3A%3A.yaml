simpleMeaning: Plant tissue not yet made into a special kind, from which new cells grow, as at the tip
  of a stem or root
scope: Plant tissue not yet made into a special kind, from which new cells grow; not old hard wood and
  not a leaf.
examples:
- The meristem at the shoot tip makes new cells.
- New leaves grow from the meristem.
