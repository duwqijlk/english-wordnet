senseId: 'elastic%1:06:00::'
synsetId: 03272607-n
simpleMeaning: cloth made from threads that contain a stretchy material, so the cloth pulls back after
  it is stretched
scope: Cloth that stretches and pulls back, not a thin band used to hold papers together and not a thing
  that just springs back to shape.
examples:
- Her skirt was made of elastic that stretched as she moved.
- The elastic fabric in the gloves kept them snug on her hands.
