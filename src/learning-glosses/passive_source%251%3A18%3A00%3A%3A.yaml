simpleMeaning: A person who gives news to spies without being told to get it, and who just passes on what
  they happen to know
scope: A person who gives news to spies without being told to get it, just passing on what they happen
  to know, not a spy sent out to steal secrets and not a paid liar.
examples:
- The passive source passed the story to the agent over coffee.
- A passive source is useful because the news comes without asking.
