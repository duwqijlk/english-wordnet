simpleMeaning: This body of the government works on its own; set up in nineteen seventy-four, it gives
  leave to run places that make power from atoms and watches over them.
scope: Also called Nuclear Regulatory Commission; this is a body of the government that deals with power
  from atoms, not a body that makes power and not a court of law.
examples:
- The NRC gives leave to run a new power plant.
- The NRC watches over the power plants in the country.
