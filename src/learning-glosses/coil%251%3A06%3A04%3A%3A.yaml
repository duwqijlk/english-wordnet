simpleMeaning: A part in a petrol engine that makes strong power and sends it to the small parts that
  make the spark to set the fuel alight
scope: The part that sends strong power to the spark plugs in a petrol engine, not a spiral of wire in
  a circuit and not a tube wound in a spiral.
examples:
- The coil failed, so the spark plugs got no power.
- A new coil sent strong power to the spark plugs in his car.
