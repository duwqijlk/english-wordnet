simpleMeaning: a thing or person of no special kind that makes something move
scope: A general thing or person that makes something move, not the machine that turns power into movement
  and not nerves linked to muscles.
examples:
- His wish to help others was the motor of all his actions.
- Money is often the motor that drives change in a town.
