simpleMeaning: a strainer that sits in a sink outlet; it catches bits of waste yet lets water flow through
scope: A strainer for a sink outlet, not a plug that stops water and not a pipe that carries waste away.
examples:
- She lifted the drain basket out of the sink to empty the bits of food it had caught.
- Water ran slowly because the drain basket was full of leaves.
