simpleMeaning: In electronics, a device that boosts a signal before sending it on again.
scope: In electronics, a device that boosts a signal before sending it on again; not a gun that can fire
  several shots without reloading, nor one who is caught again and again for lawbreaking, especially for
  the same lawbreaking.
examples:
- Their repeater boosted the call.
- The repeater was built at dawn.
