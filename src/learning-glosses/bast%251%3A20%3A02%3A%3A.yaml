simpleMeaning: strong hard plant fibres got especially from the phloem (the part inside a plant that carries
  food) of various plants
scope: This is the strong fibres taken from plants, not the living plant tissue that carries food inside
  a plant.
examples:
- Bast was used to make rope and cloth.
- They took bast from the stems to weave baskets.
