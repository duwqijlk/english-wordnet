simpleMeaning: A fern that forms mats on rock or on the ground, with creeping rootstocks and large divided
  fronds, found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern also called common polypody and adder's fern, not a tree
  fern.
examples:
- Wall fern grew in thick mats over the shaded rocks.
- She found wall fern clinging to the old stone wall.
