simpleMeaning: in a way that shows worry or fear about what may happen
scope: This describes how a person does a thing while worried about what may come next, not in a calm
  way and not in a sure way.
examples:
- She looked apprehensively at the dark road ahead.
- He waited apprehensively for the doctor to speak.
