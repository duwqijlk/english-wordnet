senseId: 'rhinestone%1:27:00::'
synsetId: 14718614-n
simpleMeaning: A stone that is not a real diamond but is made to look like one, made from rock crystal,
  glass, or paste (a glass-like material)
scope: This is a stone made to look like a diamond, not a real diamond and not another kind of real stone.
examples:
- Her dress was covered with small rhinestones that shone like diamonds.
- He bought a ring with a rhinestone instead of a real diamond.
