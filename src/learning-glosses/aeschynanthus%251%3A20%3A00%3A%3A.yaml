simpleMeaning: a plant with somewhat red or orange flowers, whose seeds carry hairs that stand out at
  the base and at the tip
scope: A plant with red or orange flowers and hairy seeds; not a plant with plain seeds.
examples:
- The aeschynanthus hangs from a basket by the window.
- Her aeschynanthus opened its first red flowers this spring.
