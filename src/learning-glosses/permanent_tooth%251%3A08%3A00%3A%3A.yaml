synsetId: 05314207-n
simpleMeaning: Any of the 32 hard white bits in the mouth that take the place of the first set of childhood,
  and with luck can last until old age.
scope: Any of the 32 hard white bits in the mouth that take the place of the first set of childhood, also
  called an adult tooth, not a first tooth of childhood and not a false tooth.
examples:
- A permanent tooth grows in place of a baby tooth.
- Her permanent tooth came through when she was six.
