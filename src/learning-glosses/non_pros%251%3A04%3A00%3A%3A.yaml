simpleMeaning: In law, a ruling for the person sued when the person who sued stops going on with the case,
  as by not coming to court
scope: In law, a ruling for the person sued when the claimant stops going on with the case; non prosequitur
  is another name for this, not a ruling after a trial and not a ruling for the claimant.
examples:
- The judge entered a non pros when the plaintiff failed to appear.
- A non pros ended the case because the claimant stopped coming to court.
