simpleMeaning: A tall timber pine, common and widespread across western North America, bears dark green
  needles two to five per clump; its bark thickens into dark brown plates with age.
scope: Another name for the tall western pine also called bull pine, ponderosa pine or western yellow
  pine, not a different pine such as the lodgepole.
examples:
- Ponderosa grows from British Columbia south into Mexico.
- The ponderosa's thick bark helps it survive forest fires.
