senseId: 'ureterocele%1:26:00::'
synsetId: 14596182-n
simpleMeaning: a bulge where the end of the tube that carries urine drops into the bladder, which may
  block the flow of urine
scope: A bulge of the urine tube into the bladder, not a stone in the bladder and not a block in the tube
  from outside.
examples:
- The ureterocele blocked the flow of urine from her kidney.
- Doctors found a ureterocele where the tube dropped into the bladder.
