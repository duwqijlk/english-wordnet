simpleMeaning: Sweet nuts to eat grow on this small bushy oak of the northeast and centre of the United
  States, which drops its leaves yearly and often grows in thick groups.
scope: People also call it dwarf chinkapin oak and dwarf chinquapin oak; it is a small bushy oak, not
  a tall one, that drops its leaves yearly and bears sweet nuts to eat.
examples:
- The dwarf oak bears sweet nuts to eat.
- Dwarf oak often grows in thick groups.
