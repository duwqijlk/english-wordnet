senseId: 'temporary_injunction%1:10:00::'
synsetId: 06555527-n
simpleMeaning: a court order made during a trial that keeps things as they are and keeps the thing at
  issue safe until the trial ends
scope: 'Also called an interlocutory injunction: a court order that holds things still during a trial,
  not a final ruling and not a lasting ban.'
examples:
- The judge gave a temporary injunction to stop the sale until the case ended.
- They asked for a temporary injunction while the trial went on.
