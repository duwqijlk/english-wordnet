senseId: 'essential_tremor%1:26:00::'
synsetId: 14028787-n
simpleMeaning: A shake of unknown cause, most often in hands and head, in older people; often taken for
  Parkinson's disease, it is not life-threatening and can often be kept in check.
scope: A shake of unknown cause in older people, not a shake from drink and not Parkinson's disease itself;
  no other name is listed for this sense.
examples:
- His essential tremor made his hands shake when he held a cup.
- Her essential tremor was often taken for Parkinson's disease at first.
