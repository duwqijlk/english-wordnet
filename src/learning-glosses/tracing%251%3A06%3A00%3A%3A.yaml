simpleMeaning: a copy of the lines of a first picture, made by laying thin see-through paper over it and
  drawing its lines onto the paper
scope: 'Also called a trace: a copy made by drawing over a first picture, not the act of drawing a plan
  or diagram.'
examples:
- She made a tracing of the old map to keep the lines clear.
- His tracing of the flower helped him learn its shape.
