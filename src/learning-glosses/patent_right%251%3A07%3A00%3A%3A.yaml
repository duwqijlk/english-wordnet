senseId: 'patent_right%1:07:00::'
synsetId: 05195914-n
simpleMeaning: A claim that no one else may hold, most of all the claim to make, use and sell a new thing
scope: A sole claim that no one else may hold, most of all the claim to make, use and sell a new thing,
  not a claim anyone may hold and not a claim to use a thing only.
examples:
- The inventor held the patent right to his new pump.
- She sold her patent right to a big firm.
