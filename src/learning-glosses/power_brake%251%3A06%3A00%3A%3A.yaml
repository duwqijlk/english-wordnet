simpleMeaning: A device on a car that turns a small push on the foot pedal into a much bigger push that
  slows or stops the car
scope: This is a device on a car that turns a small push on the foot pedal into a much bigger push that
  slows or stops the car, not a hand lever and not the foot pedal itself.
examples:
- The power brake made stopping easy.
- Her car has a power brake that needs only a light push.
