simpleMeaning: 'a theory of human ways of life: unseen patterns in a group bring about the things that
  can be seen in how people act together'
scope: This is a theory of human ways of life about unseen patterns, also called structural anthropology;
  not a study of bones or tools and not a list of customs.
examples:
- Structuralism looks for unseen patterns behind what people do.
- In structuralism, the things we see in a group come from unseen patterns.
