simpleMeaning: the skill and work of making furniture, especially furniture of high quality
scope: This is the craft of making furniture, especially fine furniture; it is not the finished furniture
  itself.
examples:
- He learned cabinetry from his father and now makes fine tables.
- Her cabinetry is known for strong, beautiful wooden chairs.
