simpleMeaning: A stretch of time that seems to go on forever, as when you are waiting
scope: A stretch of time that only seems to go on forever, as when waiting, not the life after death some
  religions teach.
examples:
- The wait for the bus felt like an eternity.
- An eternity passed before the doctor finally came out.
