simpleMeaning: A yucca of the south-east of the United States, like the bayonet plants but with a shorter
  trunk and smoother leaves.
scope: Also called Yucca gloriosa; unlike the other Spanish dagger of the south-west, with its sword-like
  leaves, this one grows in the south-east and is like the bayonet plants, but with a shorter trunk and
  smoother leaves.
examples:
- Spanish dagger grows by the coast in the south-east.
- The smoother leaves of Spanish dagger set it apart from the bayonet plants.
