simpleMeaning: A holder that shapes a small cake into a round hollow shape, made from a sheet of paper,
  foil, or silicone, a soft bendy stuff, with wavy pressed edges.
scope: Also called a muffin cup, this holder of paper, foil, or silicone shapes a small cake into a round
  hollow shape and is not the cake itself.
examples:
- A variety of sizes for muffin cases are available.
- The muffin cases held their round cup shape.
