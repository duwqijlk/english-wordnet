simpleMeaning: Now growing wild in the United States, this rough, prickly European weed bears spikes of
  sky-coloured flowers.
scope: Also called blue thistle, blueweed, and viper's bugloss, this rough, prickly weed of Europe bears
  spikes of sky-coloured flowers, not the drug that shares its name.
examples:
- We found blue devils growing wild in the United States.
- The blue devil's spikes of sky-coloured flowers pricked my hand.
