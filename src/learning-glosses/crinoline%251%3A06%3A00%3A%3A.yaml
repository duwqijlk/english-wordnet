simpleMeaning: A stiff, rough cloth used to make hats or clothes hold their shape.
scope: A stiff, rough cloth used to make hats or clothes hold their shape; not a full stiff petticoat
  made of this cloth, and not a skirt stiffened with hoops.
examples:
- The milliner lined the hat with crinoline to keep its brim firm.
- Crinoline gave the collar the stiffness it needed.
