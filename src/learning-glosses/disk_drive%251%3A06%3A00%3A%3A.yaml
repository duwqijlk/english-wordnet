simpleMeaning: This piece of computer hardware reads information from a round flat store worked by magnet
  or by light and writes information to it, holding it and turning it round.
scope: Also called disc drive and hard drive, this piece of computer hardware reads information from a
  round flat store and writes information to it, not the store itself.
examples:
- The disk drive spun the disk and wrote the file.
- He saved his work on the disk drive.
