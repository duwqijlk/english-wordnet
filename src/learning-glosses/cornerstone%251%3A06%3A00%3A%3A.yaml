simpleMeaning: a stone placed where two stone or brick walls meet at their outer edge
scope: This is a real stone where two walls meet, not the special stone put in a large building with a
  date on it, and not the basic ideas something is built on.
examples:
- The builders set the cornerstone where the two brick walls met.
- A heavy cornerstone joined the front wall to the side wall.
