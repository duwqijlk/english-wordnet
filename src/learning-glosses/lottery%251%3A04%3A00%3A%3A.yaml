simpleMeaning: a game where players buy a chance to win, or are given one free, and the winners are picked
  by chance to get prizes
scope: Also called drawing. A game in which prizes are won by pure chance when winners are picked, not
  a game of skill or a race.
examples:
- He won a car in the lottery.
- She buys a lottery ticket every week and hopes for the top prize.
