simpleMeaning: a way of acting that is bold, sure, and full of good taste
scope: 'Also called style: a bold and sure elegance in how a person acts, not a mark between parts of
  a word and not a long signal in Morse code.'
examples:
- He wooed her with the confident dash of a cavalry officer.
- She entered the room with great dash.
