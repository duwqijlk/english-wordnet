simpleMeaning: a rubber disc, three inches across, made hard by heat, used in place of a ball in games
  on ice
scope: A hard rubber disc, three inches across, used in place of a ball in games on ice; puck is another
  name for this sense, not a ball and not a skate.
examples:
- The hockey puck slid across the ice into the goal.
- He shot the hockey puck hard at the net.
