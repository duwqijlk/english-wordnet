senseId: 'effervesce%2:30:00::'
synsetId: 00520443-v
simpleMeaning: To bubble up, frothy with foam.
scope: This sense is also called sparkle, foam, froth, and fizz, for bubbling up, frothy with foam, where
  sparkling is filling with small bubbles and foam, foaming is getting covered with a mass of small bubbles,
  and frothing is turning full of small bubbles.
examples:
- The drink effervesced, bubbling up.
- Effervescing drinks bubble up with foam.
