simpleMeaning: about the acts of a religion, or like those acts
scope: This word is about the acts of religion, not about acts of social custom and not the set way of
  doing a ceremony itself.
examples:
- They performed a ritual dance as part of the temple ceremony.
- Ritual prayers were said every morning in the church.
