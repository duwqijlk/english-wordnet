simpleMeaning: a thick spread made from crushed chickpeas mixed with sesame paste, lemon juice, and garlic,
  above all eaten as a dip with pita, first made in the Middle East
scope: 'Also called hummus, humus, hommos, or hoummos: a thick chickpea dip from the Middle East, not
  a sweet spread and not a cheese dip.'
examples:
- She spread humous on warm pita bread for lunch.
- The humous at the market is made fresh each morning.
