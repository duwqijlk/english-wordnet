simpleMeaning: The part of AI, the study of machines that can think and learn, that works on putting robots
  to real use
scope: The part of AI, the study of machines that can think and learn, that works on putting robots to
  real use; not the building of robots themselves, and not the study of computers in general.
examples:
- She studied robotics at college and now builds machines that help in hospitals.
- Robotics has made it possible for machines to do dangerous work in factories.
