simpleMeaning: a ceremony at a school or university where students get the papers that show they have
  finished their studies
scope: 'Also called graduation: a ceremony where students get their papers for finishing their studies.
  It is not the start or beginning of something in general.'
examples:
- The university held its commencement in June, and each student walked across the stage to get a diploma.
- At her commencement, Maria wore a black gown and smiled as her name was called.
