senseId: congenital%5:00:00:noninheritable:00
synsetId: 01318798-s
simpleMeaning: Picked up in the womb, so it is there when the baby is born, though parents do not always
  pass it on to their children.
scope: Also called innate and inborn; had from birth, taken on before birth, but not always passed down
  in the family.
examples:
- The baby had a congenital heart problem.
- Her congenital deafness was present from birth.
