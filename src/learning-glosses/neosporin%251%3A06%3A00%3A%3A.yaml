simpleMeaning: A skin drug sold under this trade name, made of several germ-killing drugs and used as
  a cream for sore skin and as drops for small eye infections
scope: A skin drug sold under this trade name, made of several germ-killing drugs and used as a cream
  for sore skin and as drops for small eye infections, not the gut drug used in surgery.
examples:
- She put Neosporin on the cut to keep it clean.
- The doctor gave him Neosporin drops for his sore eye.
