simpleMeaning: a large, strong case used to carry things when you travel or to keep things stored away
scope: A large case you carry, not the space in a car for bags and not the main part of a tree.
examples:
- She packed her clothes into a heavy trunk for the long trip.
- He kept old letters in a trunk in the attic.
