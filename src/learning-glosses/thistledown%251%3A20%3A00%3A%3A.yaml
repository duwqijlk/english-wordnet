simpleMeaning: the soft silky hairs, like tiny feathers, that are fixed to the seed-like fruit of a thistle
scope: The soft hairs on a thistle's seed-like fruit, not the thistle plant itself and not its sharp parts.
examples:
- Soft thistledown floated slowly through the summer air.
- She blew the thistledown off the seed head and watched it drift away.
