simpleMeaning: In Greek myth, a group of three to seven nymphs who kept watch over the gold apples that
  Gaea gave Hera as a gift for her wedding.
scope: Also called the Hesperides; in Greek myth, this group of three to seven nymphs kept watch over
  the gold apples Gaea gave Hera for her wedding.
examples:
- The Atlantides kept watch over the gold apples of Hera.
- In the old tale, the Atlantides were nymphs who guarded the golden apples.
