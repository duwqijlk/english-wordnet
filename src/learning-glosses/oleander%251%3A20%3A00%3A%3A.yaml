simpleMeaning: A poisonous shrub grown for ornament, with narrow evergreen leaves and fragrant clusters
  of white, pink or red flowers; native to the East Indies, widely cultivated in warm regions.
scope: The fragrant pink-flowered garden shrub that is poisonous in every part; not a harmless ornamental
  and not a tree.
examples:
- Oleander blooms all summer in hot, dry gardens, but every part of it is poisonous.
- Gardeners grow oleander as a hedge and warn children never to chew its leaves.
