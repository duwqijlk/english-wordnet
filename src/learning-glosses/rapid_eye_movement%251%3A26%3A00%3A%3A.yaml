senseId: 'rapid_eye_movement%1:26:00::'
synsetId: 14049226-n
simpleMeaning: A sleep state that comes back again and again, in which a person dreams and the sight organs
  move quickly from side to side
scope: A sleep state in which a person dreams, also called paradoxical sleep or rapid eye movement sleep;
  not deep dreamless sleep and not the waking state.
examples:
- During rapid eye movement, her eyes moved quickly under their lids.
- Rapid eye movement comes several times each night.
