simpleMeaning: a cover for a bed, made of two layers of cloth with soft filling between them, sewn together
scope: A bed cover with filling sewn between two layers of cloth, also called a comfort and another name
  for it is a puff; it is not a thin sheet with no filling.
examples:
- She pulled the warm quilt over her feet on the cold night.
- My grandmother made a quilt from two layers of cloth and soft filling.
