simpleMeaning: A drug that kills germs, sold under a trade name, used most of all to treat sicknesses
  of the parts that pass water and make children.
scope: Also called nalidixic acid, this drug kills germs, and it is not a drug that treats other kinds
  of sickness.
examples:
- The doctor gave her NegGram for the infection.
- NegGram helped clear up the infection in a few days.
