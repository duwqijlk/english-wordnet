simpleMeaning: To keep each person's freedoms safe, this person wants society to move ahead and change
  for the better
scope: 'Also called a liberal and a progressive: a person who backs change for the better and the rights
  of each person, not a person who wants things to stay as they are.'
examples:
- The liberalist argued for new laws to protect free speech.
- As a liberalist, she pushed for reforms in the voting system.
