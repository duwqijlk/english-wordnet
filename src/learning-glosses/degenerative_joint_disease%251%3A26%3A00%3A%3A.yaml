simpleMeaning: A long-term wearing down of the smooth pads where bones meet, the most common kind of illness
  there, found usually after middle age
scope: A long-term wearing down of the smooth pads where bones meet after middle age; also called degenerative
  arthritis and osteoarthritis, not a sudden injury and not a short bout of pain.
examples:
- Degenerative joint disease stiffened her fingers over the years.
- His degenerative joint disease made walking hard each day.
