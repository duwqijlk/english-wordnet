simpleMeaning: The base unit of absolute temperature, set by the worldwide system of units
scope: This is the base unit of absolute temperature, set by the worldwide system of units, not a degree
  on the Celsius or Fahrenheit scale and not a unit of heat energy.
examples:
- Water freezes at 273 kelvin.
- The kelvin is the base unit of absolute temperature.
