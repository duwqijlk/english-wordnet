simpleMeaning: the fourth part of the stomach of a cud-chewing animal, where food is broken down
scope: This is the fourth stomach part of a cud-chewing animal, also called fourth stomach; not the first
  stomach part and not the whole stomach.
examples:
- Food passes into the abomasum after the other stomach parts.
- The abomasum is where the cow's food is broken down.
