simpleMeaning: Thick spikes of tiny white blooms rise from this plant, whose bulb is used as a medicine.
scope: Sea onion and squill are other names for this plant, whose bulb is used as a medicine and which
  bears thick spikes of tiny white blooms.
examples:
- The sea squill bears thick spikes of tiny white blooms.
- The bulb of the sea squill is used as a medicine.
