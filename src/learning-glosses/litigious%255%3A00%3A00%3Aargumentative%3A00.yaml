simpleMeaning: ready to argue or disagree, and even to take a quarrel to court
scope: Ready to argue or disagree, and even to take a quarrel to court; combative, contentious, disputatious
  and disputative are other names for this sense, not ready to make peace and not merely fond of talk.
examples:
- The litigious neighbour took every small quarrel to court.
- His litigious spirit made every meeting a fight.
