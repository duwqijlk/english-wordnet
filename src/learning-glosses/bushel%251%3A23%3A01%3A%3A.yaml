simpleMeaning: In the British imperial system, a measure of how much something can hold, for liquids or
  dry goods, equal to 4 pecks (smaller measures)
scope: A British measure of how much something can hold, equal to 4 pecks; not the United States dry measure
  with the same name and not the verb sense that means to repair.
examples:
- In Britain, the old imperial bushel held four pecks.
- The shop measured the apples in British bushels.
