simpleMeaning: a state in which the womb's lining is found outside the womb, so pain comes before a period
  and periods hurt
scope: It is also called endometriosis, and it is a state in which the womb's lining is found outside
  the womb.
examples:
- Her adenomyosis brought pain in the days before each period.
- The adenomyosis made her periods painful.
