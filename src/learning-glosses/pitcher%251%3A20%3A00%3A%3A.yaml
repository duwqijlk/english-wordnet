simpleMeaning: In plants, a leaf changed in shape so that it looks like a jug with a spout for pouring
scope: In plants, a leaf shaped like a jug with a spout, not the player who throws the ball in baseball,
  not a jug for pouring, and not the amount a jug holds.
examples:
- The pitcher leaf of the plant traps insects.
- Each pitcher on the plant holds rain water.
