simpleMeaning: A long-lived herb from Europe but now found elsewhere, with heart-shaped leaves and yellow
  buttercup-like flowers; its tuberous roots have been used as a poultice to ease piles.
scope: Also called lesser celandine and pilewort; a long-lived herb of Europe with yellow flowers, not
  a buttercup itself and not a tall plant.
examples:
- Ranunculus ficaria spreads across damp ground with yellow flowers in spring.
- The tuberous roots of Ranunculus ficaria were once used as a poultice for piles.
