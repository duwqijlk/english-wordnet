simpleMeaning: Something thick and heavy that lies on a floor, most often with a soft, raised top
scope: 'Also called a carpet: a thick floor covering, not a wall hanging and not a mat for wiping feet.'
examples:
- The rug covered most of the living room floor.
- She shook the rug out on the line.
