simpleMeaning: Any of many low, cushion-shaped plants with leaves in a ring at the base and a spike of
  small flowers. Its fruit is a narrow pod that splits open.
scope: This covers any plant in a whole genus of low, cushion-forming species, not one particular named
  plant.
examples:
- Drabas grow in rocky alpine soil where few other plants survive.
- A draba in the rock garden opened its tiny flowers in early spring.
