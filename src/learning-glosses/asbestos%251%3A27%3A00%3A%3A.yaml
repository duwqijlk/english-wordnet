simpleMeaning: a stone that breaks into thin threads, used to make things that do not burn. Breathing
  in the threads can cause lung sickness or lung cancer
scope: This is the thread-like stone material itself, used against fire; it is not the lung sickness that
  breathing it can cause.
examples:
- Old houses sometimes have asbestos in their roofs.
- Workers must not breathe in asbestos dust.
