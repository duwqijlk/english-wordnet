senseId: 'equalize%2:30:00::'
synsetId: 00417926-v
simpleMeaning: to make things the same as each other, or to make them match each other well
scope: 'Also called match, equal and equate: this is making things the same or well matched, not making
  the score the same in a game.'
examples:
- The boss tried to equalize the duties among all the workers in the office.
- A new rule helped equalize pay for men and women doing the same job.
