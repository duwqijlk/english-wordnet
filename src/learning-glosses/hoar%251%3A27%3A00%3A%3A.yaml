simpleMeaning: Tiny ice crystals that form a white layer, especially on things outside.
scope: A white layer of ice crystals, especially on things outside; frost is another name for this sense,
  and it is not snow nor ice on a road.
examples:
- Hoar covered the grass in the early morning.
- The fence was white with hoar after the cold night.
