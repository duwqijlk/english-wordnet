simpleMeaning: The state of being stuck or fixed in one place, even for a short time
scope: Being stuck or fixed in one place for a time, even a short time; not a place to stay and not the
  act of putting something in place.
examples:
- The lodgement of the balloon in the tree kept it there for days.
- The lodgement of the stone in the pipe blocked the water.
