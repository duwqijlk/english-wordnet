simpleMeaning: With stems that are hollow and jointed and leaves that are long and narrow, these plants
  turn up in every land, green and soft or woody in build.
scope: Also called a graminaceous plant, this is the name for plants of every land that have hollow jointed
  stems and long narrow leaves.
examples:
- The gramineous plant grew beside the path.
- A gramineous plant has hollow stems made of joints.
