simpleMeaning: being quick to notice and feel the feelings of yourself and of other people
scope: This is about noticing feelings, not about the body sensing touch or other small changes.
examples:
- Her sensitivity to other people's feelings made her a good friend.
- His sensitivity to his own feelings helped him to say when he was hurt.
