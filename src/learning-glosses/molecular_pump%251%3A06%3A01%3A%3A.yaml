simpleMeaning: a tool that makes a vacuum, a space with almost no air, using fast jets of thick fluid
  or fast turning blades to knock gas bits out of the space
scope: A tool that makes a vacuum by knocking gas out of a space, not a water pump and not a fan that
  moves air.
examples:
- The lab used a molecular pump to clear gas from the chamber.
- A molecular pump spun its blades fast to knock the last gas bits out.
