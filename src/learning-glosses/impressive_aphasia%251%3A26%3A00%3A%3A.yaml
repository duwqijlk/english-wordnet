simpleMeaning: In this kind of aphasia, speech comes out smooth yet empty of sense, while words heard
  or read can hardly be taken in.
scope: Also called fluent aphasia, receptive aphasia, and sensory aphasia, this kind of aphasia leaves
  speech smooth but senseless, and words heard or read hard to take in.
examples:
- Their impressive aphasia made their words flow but carry no sense.
- With impressive aphasia, they could hardly take in words they heard or read.
