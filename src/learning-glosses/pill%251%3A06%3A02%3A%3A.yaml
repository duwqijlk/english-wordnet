simpleMeaning: A tablet with estrogen and progestin, two female hormones, that stops an egg from being
  set free so a woman does not become pregnant
scope: The tablet a woman takes so she does not become pregnant, not a bitter thing to bear and not any
  other medicine tablet.
examples:
- She takes the pill every morning.
- The doctor gave her the pill to stop her getting pregnant.
