simpleMeaning: a way of studying the mind that looks only at what people do, things that can be seen and
  measured
scope: 'Also called behaviorism, behaviourism and behaviouristic psychology: a way of studying the mind
  that looks only at what people do, not at thoughts or feelings and not at the brain itself.'
examples:
- Her behavioristic psychology course taught her to watch what children do rather than ask what they think.
- The professor of behavioristic psychology measured how fast the rats learned the maze.
