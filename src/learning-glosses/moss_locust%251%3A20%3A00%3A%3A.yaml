simpleMeaning: A big shrub or small tree of the eastern United States, with bristly stems and big bunches
  of pink flowers
scope: 'Bristly locust and rose acacia are other names for this sense: a big shrub or small tree of the
  eastern United States with bristly stems and pink flowers, not a honey locust and not a black locust.'
examples:
- The moss locust showed pink flowers in spring.
- The moss locust by the fence had bristly stems and pink flowers.
