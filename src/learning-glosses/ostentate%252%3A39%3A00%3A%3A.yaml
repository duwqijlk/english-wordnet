simpleMeaning: To act in a showy and self-important way, or to show off a thing with pride
scope: Showing off a thing with pride or acting in a showy, self-important way, also called flash, flaunt
  and swank; not showing a thing plainly and not hiding it away.
examples:
- He ostentated his new sports car to impress his friends.
- She ostentated her wealth at every party.
