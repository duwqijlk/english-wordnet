simpleMeaning: To push down a feeling, sound, or cry, so it stays hidden from others.
scope: To push down a feeling, sound, or cry so it stays hidden, also called muffle, strangle, stifle,
  and repress, not to take away a person's air and not to put out a fire.
examples:
- She smothered a yawn during the long speech.
- He smothered his anger and said nothing.
