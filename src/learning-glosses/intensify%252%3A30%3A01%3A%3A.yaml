simpleMeaning: To make a thing stronger, deeper, or easier to notice.
scope: Also called compound, deepen, and heighten, this is making a thing stronger or more marked, not
  a thing growing stronger on its own and not making a photo negative darker.
examples:
- Her rudeness intensified his dislike for her.
- The efforts were intensified after the first failure.
