simpleMeaning: A comb-shaped part that lets certain mollusks, soft-bodied animals, breathe, doing the
  work of a gill.
scope: A comb-shaped breathing part of certain mollusks, not a lung and not a fin.
examples:
- The ctenidium of the snail works like a gill.
- Water flows over the ctenidium as the mollusk breathes.
