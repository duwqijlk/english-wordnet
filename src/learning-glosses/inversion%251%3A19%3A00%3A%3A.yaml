simpleMeaning: In weather, a layer of air near the ground that is colder than the layer above it.
scope: In weather, cold air near the ground under a warmer layer, not a change of tune in music, a change
  in the way a chemical turns light, an organ turned inward, a change in the order of genes, or the old
  word for taking on the gender role of the other sex.
examples:
- An inversion trapped smoke close to the ground.
- The inversion kept the cold air low over the fields.
