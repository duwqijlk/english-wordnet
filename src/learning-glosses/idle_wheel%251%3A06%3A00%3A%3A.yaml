simpleMeaning: A round part on a rod that pushes on a moving band to steer it or keep it tight.
scope: A round part on a rod that pushes on a moving band to steer it or keep it tight; idle pulley and
  idler pulley are other names for it, not a part that drives a machine and not a part that carries a
  load.
examples:
- The idle wheel keeps the belt tight on the shaft.
- A worn idle wheel made the belt slip.
