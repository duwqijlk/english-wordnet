simpleMeaning: In law, the state of a living person who has lost the rights and privileges of a citizen
  or member of society, as when given life in prison.
scope: In law, the state of a living person stripped of the rights of a citizen, not the end of life and
  not a short stay in prison.
examples:
- The judge's ruling left him in a state of civil death.
- Under civil death, she lost the right to vote.
