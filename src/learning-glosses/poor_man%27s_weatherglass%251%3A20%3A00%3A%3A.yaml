simpleMeaning: a plant with red or white or purple flowers that shut when rain is near
scope: 'Also called red pimpernel and scarlet pimpernel: a plant with red, white, or purple flowers that
  shut when rain is near, not a plant whose flowers stay open in rain.'
examples:
- The poor man's weatherglass in the garden closed its flowers before the rain came.
- When the poor man's weatherglass shut, we knew rain was on its way.
