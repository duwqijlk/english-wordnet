simpleMeaning: the use of germs or poisons to kill people and animals or to spoil food
scope: 'Also called a biologic attack, a biological attack and biological warfare: an attack with germs
  or poisons, not a bomb attack and not a sickness that spreads on its own.'
examples:
- The city feared a bioattack on its water supply.
- A bioattack could destroy crops and farm animals.
