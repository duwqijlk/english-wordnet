senseId: 'suppression%1:04:01::'
synsetId: 01150463-n
simpleMeaning: the act of keeping a book or other writing from being printed or shared, or taking it back
  so people cannot get it
scope: This is about stopping a book or writing from being printed or shared, not about pushing unwanted
  thoughts out of your mind.
examples:
- The suppression of the newspaper stopped people from reading the story.
- Writers protested against the suppression of the book.
