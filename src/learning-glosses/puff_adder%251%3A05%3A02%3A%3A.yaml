simpleMeaning: Scared, it may spread its head and neck or lie still as if dead, this harmless snake of
  North America with its nose turned up.
scope: It is also called hognose snake and sand viper, and it is a harmless snake with an upturned nose.
examples:
- The puff adder spread its head and neck when something came too close.
- When touched, the puff adder lay still and played dead.
