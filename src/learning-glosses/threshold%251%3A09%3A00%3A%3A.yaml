simpleMeaning: the smallest sensation (a feeling through the senses) that a person can notice
scope: The smallest feeling a person can notice, not the piece of wood or stone at the bottom of a door.
examples:
- The sound was below her hearing threshold, so she could not hear it.
- The light was just above the threshold, so he could see it at last.
