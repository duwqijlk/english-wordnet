simpleMeaning: 'In computer science, a unit that tells how fast a computer system works: one septillion,
  a 1 followed by 24 zeros, maths sums a second'
scope: 'Also called yottaflop: a unit of computer speed, not a unit of size or of time.'
examples:
- The new machine runs at ten YFLOPS.
- Engineers measure the system in YFLOPS.
