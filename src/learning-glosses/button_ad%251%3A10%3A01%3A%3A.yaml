simpleMeaning: A small round, square, or rectangular notice that usually appears at the foot of a web
  page.
scope: A small paid notice on a web page, not a banner that runs across the top and not a pop-up that
  opens on its own.
examples:
- The site put a button ad at the foot of its home page.
- She clicked the button ad instead of the usual link.
