simpleMeaning: any of several kinds of fish that people eat, found in the sea near the coast of North
  America
scope: A fish that people eat, living in sea water near the North American coast; not the flesh of such
  a fish as food, and not the similar fish from Europe.
examples:
- Fishers caught whiting in the sea near the North American coast.
- Several kinds of whiting live along the coast of North America.
