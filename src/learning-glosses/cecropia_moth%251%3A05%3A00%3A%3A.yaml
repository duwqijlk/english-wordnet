simpleMeaning: a North American flying insect of the silk-making kind, whose young eat the leaves of forest
  trees
scope: Also called cecropia, this is a North American flying insect whose young eat tree leaves, not a
  butterfly and not a small moth that eats cloth.
examples:
- A cecropia moth rested on the porch light with its wings spread wide.
- We found a cecropia moth caterpillar eating the leaves of an oak tree.
