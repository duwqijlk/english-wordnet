simpleMeaning: a person whose work is planning how the inside of a home or building looks
scope: A person whose work is the inside look of rooms, not a person who in general puts things on something
  to make it look nice.
examples:
- We hired a decorator to plan the colours and furniture for our living room.
- The decorator chose light walls to make the small flat look bigger.
