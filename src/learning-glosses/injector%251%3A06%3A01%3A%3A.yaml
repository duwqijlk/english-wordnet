simpleMeaning: A pump that drives a liquid or gas along with a jet of steam or water.
scope: A pump that drives a liquid or gas along with a jet of steam or water, also called ejector, eductor-jet
  pump, steam ejector, steam injector, or thermocompressor, not a device for forcing water into the boiler
  of a steam engine, or bits of matter into a machine that speeds them up.
examples:
- The injector moved the liquid along with a jet of steam.
- An injector kept the mixture flowing through the pipes.
