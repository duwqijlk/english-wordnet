simpleMeaning: A holy rite of the Christian church that recalls the last meal of Jesus with his followers,
  in which bread and wine are made holy.
scope: This is a Christian rite that recalls the last meal of Jesus with his followers, marked by bread
  and wine made holy; Liturgy, Eucharist, Eucharistic liturgy, Holy Eucharist, Holy Sacrament and sacrament
  of the Eucharist are other names for this sense, and it is not the Passover meal itself.
examples:
- The Lord's Supper is shared in church on Sunday mornings.
- At the Lord's Supper, the priest lifts the bread and the wine.
