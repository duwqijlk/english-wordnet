simpleMeaning: to do small jobs or tasks with no clear plan, or to spend time doing very little
scope: 'Also called monkey, tinker and potter: to do small jobs with no plan or spend time doing little,
  not to do planned or serious work.'
examples:
- He spent the morning puttering around the garden, fixing small things here and there.
- She puttered in the kitchen all afternoon without starting any real job.
