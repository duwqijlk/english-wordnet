simpleMeaning: a person whose job is to speak for a business and sell its goods to customers in a shop
  or to customers they visit
scope: A worker who sells goods for a business, in a shop or by visiting customers; not the business owner
  and not the customer who buys.
examples:
- A salesperson in the shop helped us choose a coat.
- The salesperson visited local shops to sell the company's goods.
