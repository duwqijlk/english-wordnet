simpleMeaning: Able to be pictured or thought of in the mind
scope: Able to be pictured or thought of in the mind; not real and present, and not too strange to think
  of at all.
examples:
- Every imaginable kind of food was laid out on the table.
- She feared the worst imaginable news from the hospital.
