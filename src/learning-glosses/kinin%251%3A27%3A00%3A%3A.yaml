simpleMeaning: A plant chemical that slows the aging of leaves and makes cells split
scope: 'Also called cytokinin: a plant chemical that helps cells divide and slows leaf aging, not a chemical
  that feeds a plant and not an animal hormone.'
examples:
- Farmers sprayed the leaves with kinin to keep them fresh longer.
- The kinin in the solution helped the plant cells divide.
