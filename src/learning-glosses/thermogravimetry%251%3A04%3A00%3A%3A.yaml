senseId: 'thermogravimetry%1:04:00::'
synsetId: 01118787-n
simpleMeaning: A way of finding out what a substance is by weighing it to see how its weight changes while
  its heat goes up or down
scope: This is a way of finding out what a substance is by weighing it as its heat changes; not a single
  weighing and not a measure of heat alone.
examples:
- Thermogravimetry told them what the powder was by weighing it as it heated.
- The lab used thermogravimetry to study how the sample lost weight with heat.
