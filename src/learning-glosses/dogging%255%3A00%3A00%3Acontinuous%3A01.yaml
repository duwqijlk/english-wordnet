simpleMeaning: not stopping and never getting tired in following or chasing something, or seeming to do
  so
scope: 'Also called persisting: keeping on and never stopping or getting tired, as if chasing something;
  not a short feeling that soon goes away.'
examples:
- He could not escape his dogging fears about the test.
- A dogging pain in her leg followed her all day.
