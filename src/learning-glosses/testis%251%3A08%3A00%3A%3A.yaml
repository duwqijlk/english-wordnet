simpleMeaning: one of the two glands in a man that make sperm and give off male sex hormones
scope: 'Also called a testicle, ball, egg, nut, ballock, bollock, or orchis: one of the two glands in
  a man that make sperm and give off male hormones, not a gland in a woman and not a part of the outer
  body.'
examples:
- The doctor said the testis was swollen after the injury.
- Each testis makes sperm and male hormones.
