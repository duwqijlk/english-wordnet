simpleMeaning: A pastime in which players race to name some thing that is only hinted at in a puzzling
  way.
scope: A pastime in which players race to name some thing only hinted at in a puzzling way, not a game
  of chance with dice and not a quiz with clear questions.
examples:
- The children played a guessing game on the long car ride.
- In this guessing game, you must work out the word from three clues.
