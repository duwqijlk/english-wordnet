simpleMeaning: with the back and shoulders bent forward in a round shape, so the body does not stand up
  straight
scope: 'Also called crooked, another name for this sense is stooped: with the back and shoulders bent
  forward, not standing up straight.'
examples:
- The old man sat hunched over the table.
- She walked in hunched, with her shoulders round and her head low.
