simpleMeaning: not speaking or saying anything when people expect you to speak
scope: 'Also called silent: not speaking when an answer is expected; not the word for a mother.'
examples:
- She stayed mum when the teacher asked who had broken the window.
- He kept mum about the surprise party so that nobody would find out.
