simpleMeaning: the skin and fur, especially the soft fur under the outer fur, of the sea animal that lives
  in cold seas
scope: The skin and fur of the sea animal, not the animal itself and not a thing that closes something
  tight or a stamp on a paper.
examples:
- Her warm coat was made of seal.
- Seal is soft and thick, so it was once much used for coats and hats.
