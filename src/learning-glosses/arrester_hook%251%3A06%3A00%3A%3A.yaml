simpleMeaning: This device sits on the flat top of a warship that carries planes and snags each plane
  as it lands, slowing it down.
scope: Also called arrester, this device is the one that sits on the flat top of a warship that carries
  planes and snags each plane as it lands.
examples:
- The arrester hook snagged the plane's tail as it touched down.
- An arrester hook held the jet fast on the deck.
