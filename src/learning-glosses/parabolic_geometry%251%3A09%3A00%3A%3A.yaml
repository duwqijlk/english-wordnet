simpleMeaning: In mathematics, the study of shapes and space that rests on the basic rules set out by
  Euclid
scope: The study of shapes and space built on Euclid's rules, also called elementary geometry; not the
  study of shapes on a curved surface, and not the study of numbers.
examples:
- Parabolic geometry starts from the rules Euclid set out long ago.
- In parabolic geometry, the angles of a triangle add up to two right angles.
