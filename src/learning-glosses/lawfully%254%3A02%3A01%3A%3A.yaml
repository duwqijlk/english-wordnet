senseId: 'lawfully%4:02:01::'
synsetId: 00365014-r
simpleMeaning: in a way that people accept, because it follows their shared, usual way of doing things
scope: 'Also called legitimately: done in a way that people accept because it follows their shared, usual
  way of doing things, not just in a way the rules of a country allow.'
examples:
- By their old custom, the eldest son lawfully speaks first at the meeting.
- She lawfully took her place at the table in the way their people have always done.
