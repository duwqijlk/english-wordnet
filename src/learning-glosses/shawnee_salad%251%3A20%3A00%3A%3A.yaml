simpleMeaning: A bright plant that lives for years, with white flowers; its leaves are at times eaten
  as green food in the south-east of the United States.
scope: Also called shawny, Hydrophyllum virginianum, Indian salad, John's cabbage, or Virginia waterleaf,
  it is a showy perennial herb of the south-eastern United States, known by its white flowers and by leaves
  sometimes used as edible greens.
examples:
- Shawnee salad is a bright plant with white flowers.
- The leaves of Shawnee salad are at times eaten as green food.
