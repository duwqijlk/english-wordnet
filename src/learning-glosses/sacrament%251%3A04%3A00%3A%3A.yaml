simpleMeaning: 'A formal ceremony giving grace; Protestants have two, baptism and the Lord''s Supper;
  Catholics and Orthodox have seven, instituted by Jesus: baptism, confirmation, Eucharist, penance, holy
  orders, matrimony, extreme unction.'
scope: A formal church rite, not a sermon, a private prayer, or an ordinary religious gathering.
examples:
- Baptism is the first sacrament that a Catholic child receives.
- In the Catholic Church, marriage is one of the seven sacraments.
