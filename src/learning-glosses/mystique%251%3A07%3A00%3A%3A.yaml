simpleMeaning: a special quality around a person or thing that gives it more value, more interest or more
  meaning
scope: A feeling of special value and interest around a person or thing, not a secret and not a magic
  power.
examples:
- The old artist's mystique grew as he rarely spoke in public.
- The mystique around the singer made fans want to know more about her.
