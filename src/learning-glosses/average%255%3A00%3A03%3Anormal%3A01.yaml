senseId: average%5:00:03:normal:01
synsetId: 01599393-s
simpleMeaning: Of or being the value that appears most often in a set of data.
scope: This is the most frequent value in a set of data, not the middle value of an ordered set, not the
  value close to the statistical norm, not the everyday sense of ordinary or unremarkable, and not a noun
  or verb use.
examples:
- The average value in this set is simply the one that turns up most often.
- In a frequency table, the average entry is the one with the highest count.
