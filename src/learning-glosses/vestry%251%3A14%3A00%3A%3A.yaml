simpleMeaning: In the Protestant Episcopal Church, a group chosen by its members to work with its churchwardens
  (people who help look after the church) in running its money and daily business
scope: This is the group of people chosen to help run one church in the Protestant Episcopal Church, not
  a room in a church where holy things are kept or meetings are held.
examples:
- The vestry met to decide how to pay for repairs to the church roof.
- The vestry works with the churchwardens to look after the church's money.
