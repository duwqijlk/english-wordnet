simpleMeaning: Docking points on nerve cells of the sympathetic (fight-or-flight) system, proposed to
  explain why certain substances affect only some of its actions, such as narrowing blood vessels.
scope: A docking point on fight-or-flight nerve cells, not the chemical messenger that fits into it and
  not the muscle that responds.
examples:
- The drug works on the alpha-adrenergic receptor to narrow blood vessels.
- Researchers mapped the alpha-adrenergic receptor on the surface of sympathetic nerve cells.
