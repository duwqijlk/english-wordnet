simpleMeaning: The part of the nerve web in backboned animals that runs the work of smooth muscle, heart,
  and glands without thought.
scope: This is the nerve web that runs smooth muscle, heart and glands without thought, also called the
  autonomic nervous system, not the nerves that move the limbs by will.
examples:
- The ANS controls the heart without thought.
- When she blushed, her ANS had sped her heart.
