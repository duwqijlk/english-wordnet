simpleMeaning: the quality of being easy to bend or shape
scope: The quality of being easy to bend or shape, not the ease of changing plans or ideas.
examples:
- The flexibility of the thin branch let it bend in the wind.
- Rubber has great flexibility; it bends and then springs back.
