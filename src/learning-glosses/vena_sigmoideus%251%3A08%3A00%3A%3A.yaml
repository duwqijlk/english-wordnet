simpleMeaning: Blood tubes that drain the curved lower part of the large gut feed into the blood tube
  draining the lower gut.
scope: Also called sigmoid vein, these tubes drain the curved lower part of the large gut and feed the
  tube that drains the lower gut.
examples:
- Blood from the curved lower part of the large gut leaves through the vena sigmoideus.
- Blood from the lower gut flows out through the vena sigmoideus into the blood tube draining the lower
  gut.
