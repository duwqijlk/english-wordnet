simpleMeaning: A protein made only by the prostate gland; it thins the semen so sperm can swim, and high
  levels in the blood are linked with prostate swelling and cancer.
scope: Not other proteins made by the body, nor other signs of prostate trouble; also called prostate
  specific antigen.
examples:
- PSA levels are checked in a blood test.
- High PSA can point to prostate trouble.
