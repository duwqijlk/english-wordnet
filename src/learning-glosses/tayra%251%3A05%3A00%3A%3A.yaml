simpleMeaning: an animal with a long tail that lives in trees and belongs to the weasel family, found
  in Central America and South America
scope: 'Also called a taira: a long-tailed animal of the weasel family that lives in trees in Central
  and South America, not a monkey and not a cat.'
examples:
- The tayra ran along a branch high in the trees.
- We saw a tayra hunting in the forest of Central America.
