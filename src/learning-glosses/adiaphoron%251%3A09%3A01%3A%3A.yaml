simpleMeaning: In Stoic thought, a thing that is neither good nor bad in itself.
scope: In Stoic thought, a thing with no good or bad in itself, not a church rite left to each person's
  conscience and not a matter of right and wrong.
examples:
- Esteem was for Stoics an adiaphoron, neither good nor bad in itself.
- Fame counts as an adiaphoron in Stoic thought.
