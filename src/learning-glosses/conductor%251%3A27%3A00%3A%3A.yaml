simpleMeaning: a material that lets things such as heat and electricity pass through it easily
scope: This sense is a material itself, not a device made to carry heat or electricity, and not the person
  who collects fares on a bus or train.
examples:
- Copper is a good conductor of heat and electricity.
- Wood is a poor conductor, so the pan handle stays cool.
