simpleMeaning: Worn down by long time spent outside in wind, rain, sun, and other such things
scope: Something worn down by long time outside in wind and rain, not something worn down by use alone.
examples:
- The house was built of weathered shingles.
- The weathered wood of the old fence felt rough to the touch.
