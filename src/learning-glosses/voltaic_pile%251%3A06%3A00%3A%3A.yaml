simpleMeaning: Simple chemical cells joined in a row make the first electric battery, devised by Volta.
scope: Also called pile and galvanic pile, it is a battery of simple chemical cells joined in a row, the
  first electric battery made by Volta.
examples:
- The voltaic pile in the museum was Volta's first electric battery.
- A voltaic pile joins simple chemical cells in a row to make power.
