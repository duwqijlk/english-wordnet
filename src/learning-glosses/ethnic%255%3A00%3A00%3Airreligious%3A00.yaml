simpleMeaning: not accepting the God of Christians, Jews and Muslims
scope: 'Also called pagan and heathen: about not believing in the God of Christians, Jews and Muslims;
  not about the way of life of a group of people, and not a person in such a group.'
examples:
- In old books, ethnic gods were gods other than the God of Christians, Jews and Muslims.
- The writer called the old temples ethnic, because the people there did not believe in the God of the
  Bible.
