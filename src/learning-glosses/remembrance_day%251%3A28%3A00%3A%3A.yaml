simpleMeaning: People remember those who died in the first World War and the second World War on the Sunday
  nearest the eleventh of November.
scope: 'Also called Poppy Day and Remembrance Sunday: the Sunday nearest the eleventh of November when
  people remember those who died in the first World War and the second World War, not a day for celebrating
  a victory.'
examples:
- On Remembrance Day, people remember those who died in the first World War and the second World War.
- Remembrance Day falls on the Sunday nearest the eleventh of November.
