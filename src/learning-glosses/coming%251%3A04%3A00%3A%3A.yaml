simpleMeaning: the peak of sexual pleasure reached during intercourse
scope: This is the sexual sense, not the act of moving closer to something, not an arrival that has been
  awaited, not the fact of approaching in time, and not the adjective meaning soon to happen.
examples:
- For many people the coming is the most intense moment of intercourse.
- The guide describes the coming as a brief peak of sexual pleasure.
