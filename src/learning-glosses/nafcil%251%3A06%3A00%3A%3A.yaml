simpleMeaning: A form of penicillin that resists the enzyme that breaks penicillin down, used, usually
  as its sodium salt, to treat infections from penicillin-resistant germs called staphylococci
scope: Also called nafcillin; a form of penicillin that resists the enzyme that breaks penicillin down,
  used for infections from penicillin-resistant germs.
examples:
- The doctor gave him Nafcil for the infection.
- Nafcil worked where plain penicillin had failed.
