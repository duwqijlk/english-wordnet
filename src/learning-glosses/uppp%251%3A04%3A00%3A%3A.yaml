simpleMeaning: An operation that cuts away extra mouth and throat tissue to open the air path, meant to
  cure very bad snoring, with or without pauses in breathing in sleep.
scope: An operation that cuts away extra mouth and throat tissue to open the air path, also called palatopharyngoplasty,
  uvulopalatopharyngoplasty and PPP, meant to cure very bad snoring.
examples:
- UPPP cuts away extra mouth and throat tissue to open the air path.
- The doctor said UPPP could cure his very bad snoring.
