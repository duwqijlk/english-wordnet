simpleMeaning: A thick stew of rice, chicken and small hunted animals, from the southern United States.
scope: A thick stew of rice and chicken, also called poilu and chicken purloo; not a thin soup and not
  a stew of beef alone.
examples:
- They served purloo with rice and chicken at the southern table.
- A pot of purloo simmered on the stove all afternoon.
