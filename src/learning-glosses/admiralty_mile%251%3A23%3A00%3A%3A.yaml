simpleMeaning: A former British length unit of 6,080 feet (1,853.184 meters), 800 feet longer than the
  usual land unit of 5,280 feet.
scope: 'Also called mile, mi, geographical mile, naut mi and nautical mile: a former British length unit
  of 6,080 feet, 800 feet longer than the usual land unit, not a land unit of today and not a unit of
  weight.'
examples:
- The Admiralty mile was 6,080 feet long.
- Sailors once used the Admiralty mile at sea.
