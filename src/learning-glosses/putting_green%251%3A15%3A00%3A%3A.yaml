simpleMeaning: The short, smooth grass that rings the hole on a golf course
scope: This is the short grass round the hole on a golf course; green and putting surface are other names
  for this sense. Not the long grass of the fairway and not the hole itself.
examples:
- She sank the ball on the putting green with one soft stroke.
- The putting green was smooth and fast after the morning cut.
