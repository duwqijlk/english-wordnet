scope: Also called ramee, ramie, China grass, and Chinese silk plant; a tall long-lived herb of tropical
  Asia grown for the fibre from its woody stems, distinct from other tall herbs grown for food.
examples:
- Boehmeria nivea grows tall in tropical Asia.
- Farmers grow Boehmeria nivea for its fibre.
