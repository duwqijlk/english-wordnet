simpleMeaning: a funny five-line poem with beats of two short sounds then one long sound, where the first,
  second and last lines end alike, and the middle two end alike
scope: This is a short funny poem of five lines with a set beat and end sounds, not a long story poem
  or a song.
examples:
- She read us a funny limerick with five short lines.
- The children laughed at the limerick he made up at school.
