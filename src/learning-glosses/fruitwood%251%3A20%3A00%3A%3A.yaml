simpleMeaning: The hard stuff of trees that bear sweet plant flesh, such as apple, cherry or pear, used
  above all for making fine furniture
scope: The hard stuff of fruit-bearing trees for fine furniture, not pine and not oak.
examples:
- The table was made of fruitwood.
- Fruitwood comes from apple, cherry and pear trees.
