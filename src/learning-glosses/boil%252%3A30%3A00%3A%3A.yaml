simpleMeaning: to put something in very hot liquid that is making bubbles, or be in it, often to cook
  it
scope: This verb is about putting food or other things in very hot liquid, often to cook them. It is not
  the painful sore on the skin, and not the heat point where a liquid turns to gas.
examples:
- Boil the potatoes in water for twenty minutes.
- She boiled the eggs for breakfast.
