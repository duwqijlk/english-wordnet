schema: oewn-learning-gloss-v2
senseId: 'characterization%1:10:01::'
synsetId: 07216222-n
simpleMeaning: the act of describing a person or thing by naming its most important qualities and what
  makes it different from others
scope: This is the act of describing a person or thing in this way; not acting a part on a stage, and
  not a strong, clear description itself, whether spoken or written.
examples:
- The newspaper's characterization of the mayor as lazy angered many readers.
- Her characterization of the town focused on its quiet streets and kind people.
