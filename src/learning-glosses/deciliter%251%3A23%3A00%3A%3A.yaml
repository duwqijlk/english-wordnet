simpleMeaning: a unit for how much a thing holds, the same as one tenth of a liter
scope: This is a unit for a tenth of a liter; decilitre and dl are other names for this sense, not a liter
  itself and not a unit for weight.
examples:
- Add one deciliter of milk to the mix.
- The cup holds about two deciliters of water.
