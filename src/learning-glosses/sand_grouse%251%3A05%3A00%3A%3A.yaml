simpleMeaning: Long pointed wings and tail mark a pigeon-like bird of the dry lands of Europe, Asia, and
  Africa, whose downy young can move about soon after hatching
scope: A pigeon-like bird of dry lands, with long pointed wings and tail and downy young that can move
  about soon after hatching, also called sandgrouse; not a pigeon and not a true grouse.
examples:
- Sand grouse flew over the dry land.
- The sand grouse young were downy and able to move about.
