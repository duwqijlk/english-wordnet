simpleMeaning: Music for bassoons, cellos, and horns of the middle range is written with this sign, which
  puts middle C on the fourth line of five lines.
scope: Of the signs that mark pitch in written music, this is the one that puts middle C on the fourth
  line.
examples:
- The cello part is written in tenor clef.
- The bassoon part is written in tenor clef.
