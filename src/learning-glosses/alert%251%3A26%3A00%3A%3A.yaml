simpleMeaning: A state of being fully awake and watchful, and ready to act at once
scope: A state of being watchful and ready to act, not a warning, not a sign that goes off by itself,
  and not the act of warning someone.
examples:
- Bombers were put on alert during the crisis.
- The guards stayed on alert all night.
