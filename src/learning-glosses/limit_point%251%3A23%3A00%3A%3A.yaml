simpleMeaning: In mathematics, as the input to a rule grows without end, the rule gets closer and closer
  to this number
scope: 'Another name for limit and point of accumulation: in mathematics, the number a rule gets closer
  and closer to, not the number where the rule starts and not the highest number it can reach.'
examples:
- The limit point of the function is 3.
- As x grows, the values draw near to the limit point.
