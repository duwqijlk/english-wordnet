simpleMeaning: A setting for a vehicle's front light that gives enough light ahead and to the sides without
  dazzling drivers coming the other way, used whenever other vehicles are ahead.
scope: This is the downward-aimed low setting of a vehicle's front light, not the full main beam used
  on empty roads.
examples:
- On a busy road at night, switch to your dipped-beam headlamps.
- The dipped-beam headlamp lit the road without dazzling the car in front.
