simpleMeaning: the act of taking out or changing every part of a book or text that is thought rude or
  unfit to read
scope: 'Also called bowdlerization: the act of taking out or changing every rude part of a text, not a
  ban on the whole book and not a small cut made for length.'
examples:
- The bowdlerisation of the play took out all the coarse jokes.
- Her bowdlerisation of the novel made it fit for young readers.
