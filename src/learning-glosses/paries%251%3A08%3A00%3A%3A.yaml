simpleMeaning: In the body, a sheet or lining that wraps round a part.
scope: In the body, a sheet or lining that wraps round a part, also called wall; not the skin outside
  the body and not a hard shell.
examples:
- The paries of the stomach kept the food inside.
- A thin paries lined the hollow organ.
