simpleMeaning: Usually held to honour a holy person who guards the place, a fair or festival in Spanish-speaking
  places
scope: A local fair or party in Spanish-speaking places, usually honouring a patron saint, not a market
  for buying and selling and not a church service.
examples:
- The whole town turned out for the feria in the main square.
- Dancers and music filled the streets during the feria.
