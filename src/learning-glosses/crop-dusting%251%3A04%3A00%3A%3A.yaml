simpleMeaning: The spreading of chemicals that kill fungi and insects, or of plant food, on growing plants,
  often from a plane flying low.
scope: This is the spreading of chemicals over growing plants, not watering or harvesting; also called
  spraying.
examples:
- Crop-dusting began at dawn over the fields.
- The farmer hired a plane for crop-dusting.
