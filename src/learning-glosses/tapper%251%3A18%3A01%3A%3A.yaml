senseId: 'tapper%1:18:01::'
synsetId: 10711260-n
simpleMeaning: A person who keeps a tavern and draws drink from kegs or casks.
scope: A person who keeps a tavern and draws drink from kegs or casks; not a dancer who sounds out rhythms
  with metal taps on the shoes, not someone who listens in on telephone wires, not a worker who cuts screw
  threads with a tap, and not a person who strikes a surface lightly again and again.
examples:
- The tapper pulled a pint from the keg behind the bar.
- Old Tom was the tapper at the village inn for forty years.
