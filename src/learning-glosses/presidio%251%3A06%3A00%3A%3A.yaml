simpleMeaning: a strong fort built in the south-west of the United States by Spain to guard its missions
  and other lands
scope: A Spanish fort in the south-west of the United States built to guard missions and other lands,
  not a town and not a fort built by another country.
examples:
- Tucson was first settled as a walled presidio.
- The Spanish built the presidio to guard their missions in the south-west.
