simpleMeaning: Leading toward or coming from the open air, as a door, stair, or passage does.
scope: This sense describes a door, stair, or passage that opens to the open air, not an organization's
  work beyond its own buildings.
examples:
- The outside door swelled in the rain and would not shut properly.
- An outside staircase runs from the kitchen down to the garden.
