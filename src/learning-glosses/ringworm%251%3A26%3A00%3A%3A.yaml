simpleMeaning: an illness of the skin or nails caused by fungi (tiny living things that grow on the body),
  seen as round, itchy spots
scope: 'Also called tinea: a skin illness that makes round, itchy spots, not an illness caused by a real
  worm and not a simple dry skin rash.'
examples:
- The doctor gave her cream for the ringworm on her arm.
- His ringworm showed as a round, itchy patch on his skin.
