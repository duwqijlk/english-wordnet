simpleMeaning: set apart or given in a serious way for a high purpose or a holy purpose
scope: Set apart or given for a high or holy purpose; dedicated and consecrate are other names for this
  sense. Not the sense of being made, said or believed to be holy.
examples:
- He lived a life consecrated to science.
- They prayed in the consecrated chapel.
