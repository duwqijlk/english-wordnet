simpleMeaning: Under the orange tops of this big poison mushroom, thin plates glow in the dark, and the
  tops stand on thin stalks that grow close together
scope: Also called jack-a-lantern and jack-o-lantern, this is a poison mushroom whose plates glow in the
  dark, not a mushroom safe to eat.
examples:
