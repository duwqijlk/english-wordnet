simpleMeaning: In slang, an act that makes someone feel big and important, done just for the joy of having
  control over other people
scope: An act done just to enjoy having control over people, not a trip or journey and not honest work
  as a boss.
examples:
- He kept changing the rules just to show he was in charge; it was a power trip.
- Refusing every request for no reason was part of his power trip.
