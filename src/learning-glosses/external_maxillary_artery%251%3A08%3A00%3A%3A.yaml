simpleMeaning: a blood vessel that starts in the neck vessel feeding the face and sends out smaller vessels
  to the neck and face
scope: This is a blood vessel branching off the face-feeding neck vessel; arteria facialis and facial
  artery are other names for this sense; not the neck vessel itself and not a vessel feeding the brain.
examples:
- The external maxillary artery supplies the neck and face.
- Branches of the external maxillary artery reach the jaw and cheek.
