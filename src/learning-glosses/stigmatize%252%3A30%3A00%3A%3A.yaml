simpleMeaning: to mark a person with a stigma (a mark on the body) or with stigmata (more than one such
  mark)
scope: To mark a body, in this body-mark sense; not to speak against a person and treat them as bad in
  the eyes of others.
examples:
- In the story, they stigmatize him by burning a mark on his skin.
- The priest's hands were stigmatized with marks like wounds.
