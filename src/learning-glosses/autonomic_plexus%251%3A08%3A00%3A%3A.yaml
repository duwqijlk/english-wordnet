simpleMeaning: A net of threads that carry body signals, made up of the ones that speed the body up and
  the ones that slow it down
scope: This is a net of threads that carry body signals, made up of the ones that speed the body up and
  the ones that slow it down; plexus autonomici is another name for it, not a single thread and not the
  cord that runs down the back.
examples:
- The autonomic plexus joins the threads that speed the body up and slow it down.
- Signals pass through the autonomic plexus without our thinking about them.
