simpleMeaning: Dead bodies or bones are placed and kept in a vault or a building made to hold them.
scope: A vault or building where dead bodies or bones are kept, not a grave and not a church.
examples:
- The charnel held the bones of the dead.
- They stored old bones in the charnel beneath the chapel.
