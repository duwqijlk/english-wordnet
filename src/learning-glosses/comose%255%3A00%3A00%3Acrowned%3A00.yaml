simpleMeaning: Having a tuft on top; crowned with a mass of branches, leaves, or small leaf-like parts
scope: Having a tuft on top, also called comate, not bare at the top and not having a single flower.
examples:
- The comose palm wore a crown of long leaves.
- Pineapples are comose, with a tuft of stiff leaves on top.
