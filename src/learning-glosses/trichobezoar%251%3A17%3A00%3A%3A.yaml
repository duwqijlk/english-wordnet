simpleMeaning: A tight ball of hair that forms in the food pipe and gut, above all in the stomach of animals
  that lick their fur
scope: A tight ball of hair that forms in the food pipe and gut, also called hairball and hair ball; not
  a stone in the gut and not a clump of swallowed grass.
examples:
- The vet removed a trichobezoar from the cat's stomach.
- Cats that lick their fur often develop a trichobezoar.
