simpleMeaning: The state of a substance with no urge to flow under fair pressure, standing up to squeezing
  and bending, and holding its set size and form.
scope: The state of a substance with no urge to flow under fair pressure, standing up to squeezing and
  bending, and holding its set size and form; also called solid state; not the quality of being solid
  and sound in money, fact, or morals, nor the mere consistency of a solid.
examples:
- Their solidness held the shape.
- The solidness was plain in the test.
