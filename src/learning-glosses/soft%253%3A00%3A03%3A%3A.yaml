simpleMeaning: A speech sound in which the back of the tongue rises toward the hard roof of the mouth,
  giving a hissing or hushing sound like s or sh.
scope: It names a class of speech sounds made with the back of the tongue raised toward the hard roof
  of the mouth, not a quiet sound, a gentle manner, or a musical marking.
examples:
- Russian distinguishes hard consonants from soft ones.
- The soft s at the end of the word sounds almost like sh.
