simpleMeaning: long pods usually cut into pieces about half an inch long, a favorite in Britain
scope: 'Also called a scarlet runner or a scarlet runner bean: long pods cut into short pieces and liked
  in Britain, not the plant that bears the pods and not a dried pulse kept in a jar.'
examples:
- She sliced the runner beans for supper.
- Runner beans are a favorite in Britain.
