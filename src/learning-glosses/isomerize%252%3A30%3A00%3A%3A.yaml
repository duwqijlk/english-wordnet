simpleMeaning: to change into a new form of the same stuff, with the same parts set out in a new way
scope: To change into a new form of the same stuff, with the same parts set out in a new way; isomerise
  is another name for this sense, not causing something else to change.
examples:
- Under heat, the stuff will isomerize into a new form.
- The compound can isomerize when left in the light.
