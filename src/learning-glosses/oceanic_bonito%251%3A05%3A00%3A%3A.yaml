simpleMeaning: For cooking in Japan, the flesh of this sea fish is dried and broken into flakes, and it
  is perhaps the same kind as the skipjack tuna.
scope: Also called bonito, this is the fish whose flesh is dried and flaked for Japanese cooking, and
  which may be the same kind as the skipjack tuna.
examples:
- The oceanic bonito is dried before it is flaked.
- Some say the oceanic bonito is the same kind as the skipjack tuna.
