simpleMeaning: One thousandth of the main unit used to count how much a thing gives off rays
scope: A small unit for counting how much a thing gives off rays, one thousandth of the larger unit; not
  the larger unit itself and not the becquerel, another unit for the same thing.
examples:
- The sample gave off ten millicuries of radiation.
- Doctors measure the dose in millicuries.
