simpleMeaning: A unit of radioactive activity equal to one thousandth of a curie.
scope: A unit for measuring radioactivity, one thousandth of a curie; not a whole curie itself and not
  the becquerel, another unit for the same thing.
examples:
- The sample had an activity of ten millicuries.
- The laboratory reported the sample's radioactive activity in millicuries.
