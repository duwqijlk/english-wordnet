simpleMeaning: A European herb much like vetch, now at home in the east of the United States, with flat-topped
  bunches of pink-and-white flowers and sharp-edged pods.
scope: Also called axseed or crown vetch; a European herb like vetch, now at home in the eastern United
  States, with pink-and-white flowers and sharp-edged pods, kin to other vetch-like herbs.
examples:
- Coronilla varia grows along the roadside, its pink-and-white flowers in flat bunches.
- We found Coronilla varia, now at home in the eastern United States, by the field.
