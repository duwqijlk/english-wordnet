simpleMeaning: a sound made by forcing air out through a narrow opening, especially to show that you do
  not like something
scope: 'Also called hiss, hissing, and hushing: a sound made with air through a narrow opening, especially
  to show dislike, not clapping to show you like something.'
examples:
- A fizzle of dislike rose from the unhappy crowd.
- The singer heard a loud fizzle from the back of the hall.
