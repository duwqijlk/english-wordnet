simpleMeaning: A sugar-based nutrient stored in seeds, fruits, tubers, roots and stem cores, especially
  corn, potatoes, wheat and rice; a staple food, used in glues and to stiffen paper and cloth.
scope: The natural nutrient found in plant foods, not the commercial laundry product made from it and
  not the process of stiffening cloth with it.
examples:
- Older pharmacy books still use amylum as the name for this nutrient.
- The label lists amylum among the inactive ingredients in the tablets.
