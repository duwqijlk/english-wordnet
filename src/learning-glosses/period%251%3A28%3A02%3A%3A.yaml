simpleMeaning: the time it takes for one complete round of something that repeats.
scope: Not a punctuation mark, a lesson hour or a stretch of history; here it means the time for one full
  cycle of a repeated process.
examples:
- The period of the pendulum is exactly two seconds.
- The satellite circles the earth with a period of about 90 minutes.
