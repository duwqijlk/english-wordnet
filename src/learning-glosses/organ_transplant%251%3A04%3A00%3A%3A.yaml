simpleMeaning: A body part is taken from one living being, the giver, and put into another, the one who
  gets it, in an act done by a doctor
scope: Moving a body part from one living being to another, also called transplant; not a gift of blood
  and not the healing of a body part in place.
examples:
- She had an organ transplant last year.
- The organ transplant gave him a new kidney.
