simpleMeaning: 'Planning a family by counting days: the egg is thought to leave her body 14 days before
  her period, and days 10 to 18 are thought to be fertile.'
scope: This way of planning a family by counting days is also called rhythm, calendar method of birth
  control, rhythm method, and rhythm method of birth control.
examples:
- They used the calendar method to work out the days when she might become pregnant.
- The calendar method counts on an egg leaving the body 14 days before a period.
