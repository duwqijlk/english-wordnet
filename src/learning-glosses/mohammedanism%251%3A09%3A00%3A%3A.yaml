simpleMeaning: The one-God faith of Muslims, begun in Arabia in the 7th century, built on the teachings
  of Muhammad set out in the Koran.
scope: This is the faith itself, not its people or its holy book alone; also called Islam, Islamism, Muhammadanism
  and Muslimism.
