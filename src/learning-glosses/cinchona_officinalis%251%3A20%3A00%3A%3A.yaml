simpleMeaning: A shrub or small tree from Peru with large, shiny leaves and groups of sweet-smelling yellow
  to green or red flowers, grown for its bark, used as a medicine
scope: Among Peruvian shrubs grown for bark, this shrub or small tree has large, shiny leaves and sweet-smelling
  yellow to green or red flowers, and is grown for bark used as medicine; calisaya, Cinchona calisaya
  and Cinchona ledgeriana are other names for it.
examples:
- Cinchona officinalis grows on the hills of Peru.
- Workers cut the bark of Cinchona officinalis for medicine.
