simpleMeaning: A long-lived plant of southern Europe with sweet-smelling flower bunches of all colors,
  most yellow and orange; often wild on old walls or cliffs, sometimes put in its own genus.
scope: A long-lived plant with sweet-smelling flower bunches, also called a wallflower or Cheiranthus
  cheiri.
examples:
- The Erysimum cheiri on the old wall was covered in yellow flowers.
- We planted Erysimum cheiri along the cliff path for its sweet smell.
