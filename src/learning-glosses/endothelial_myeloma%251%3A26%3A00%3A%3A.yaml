simpleMeaning: A harmful growth in bone marrow, often in the hip bones or in long bones
scope: This is a harmful growth in bone marrow, often in the hip bones or in long bones, not a harmless
  growth and not a growth in soft tissue.
examples:
- The endothelial myeloma grew in the bone marrow of his hip.
- Doctors found an endothelial myeloma in one of her long bones.
