simpleMeaning: said of a plant whose buds are just opening into flowers
scope: This is a plant with buds just opening into flowers, also called efflorescent; not a plant in full
  flower and not a plant with buds still shut.
examples:
- The hawthorn tree was abloom in late spring.
- By May the whole garden was abloom with new flowers.
