simpleMeaning: the idea that God has already chosen some people to be saved by his kindness, especially
  as Calvinists teach it
scope: A religious idea about God choosing some people to be saved, especially as Calvinists teach it;
  not choosing leaders by voting, and not the state of having been chosen for a job.
examples:
- In Calvinist teaching, election means that God has already chosen some people to be saved.
- He wrote about election as God's choice to show kindness to some people.
