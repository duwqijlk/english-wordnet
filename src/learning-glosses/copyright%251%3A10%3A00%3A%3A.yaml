simpleMeaning: A paper that says only the holder may publish and sell a book, song, or work of art
scope: A paper that says only the holder may publish and sell a work, not the act of getting that right
  for a written work.
examples:
- The author holds the copyright to her novel and no one else may print it.
- He bought the copyright for the song so he could sell copies of it.
