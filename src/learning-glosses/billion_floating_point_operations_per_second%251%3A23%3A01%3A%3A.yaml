simpleMeaning: a measure of how fast a computer works out sums, equal to one thousand million sums with
  fractions every time a clock ticks once
scope: 'Also called gigaflop: a measure of a computer''s speed, not a count of all the work it does and
  not a measure of its memory.'
examples:
- The new machine runs at five billion floating point operations per second.
- Engineers rate the chip in billion floating point operations per second.
