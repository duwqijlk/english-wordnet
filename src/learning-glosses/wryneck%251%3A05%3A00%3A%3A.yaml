simpleMeaning: a bird of Europe, Asia and Africa, like a woodpecker, that often twists its neck in a strange
  way
scope: This is a bird that twists its neck, not the neck condition in which the head leans to one side.
examples:
- A wryneck twisted its neck as it sat on the tree.
- We saw a wryneck in the woods, moving its neck from side to side.
