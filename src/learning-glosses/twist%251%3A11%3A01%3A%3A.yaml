simpleMeaning: A small spinning swirl of water or air, formed where a flowing current curls back on itself.
scope: This is a small swirling current of water or air (eddy is another name), not an unexpected turn
  of events or a bend in a line.
examples:
- A small twist of wind sent the dry leaves spinning upward.
- The boat rocked when it crossed a twist in the current.
