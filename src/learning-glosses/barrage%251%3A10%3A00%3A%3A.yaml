simpleMeaning: a fast flow of words that keeps coming, in speech or in writing, with no breaks
scope: 'Also called onslaught, bombardment and outpouring: this is a fast flow of spoken or written words
  that keeps coming, not heavy gun fire and not the verb sense of sending such a flow at someone.'
examples:
- She faced a barrage of questions after her speech.
- He sent a barrage of letters complaining about the plan.
