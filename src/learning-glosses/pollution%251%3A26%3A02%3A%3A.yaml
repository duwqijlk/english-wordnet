simpleMeaning: The state of a place or thing that has been made dirty or harmful
scope: The state of a place or thing made dirty or harmful, not the act of making it dirty and not the
  spoiled state of the land around us.
examples:
- The pollution in the river killed the fish.
- Pollution from the factory made the air hard to breathe.
