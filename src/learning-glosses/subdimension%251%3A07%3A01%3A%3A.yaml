simpleMeaning: one part of a size that on its own is the whole size of a thing
scope: One part of a size that is the whole size of a thing, not a small piece of a larger size and not
  a full list of sizes.
examples:
- In the model, one subdimension gave the whole size of the block.
- The subdimension they measured was the full height of the object.
