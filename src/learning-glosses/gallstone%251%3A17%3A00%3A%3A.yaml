simpleMeaning: a hard lump that forms inside the small bag near the liver that holds bile, or in the tubes
  that lead from it
scope: Also called a bilestone, this is a hard lump inside the body, not a stone found in the ground and
  not a swelling caused by a wound.
examples:
- The doctor said a gallstone was blocking the duct.
- She had surgery to remove a gallstone from her gall bladder.
