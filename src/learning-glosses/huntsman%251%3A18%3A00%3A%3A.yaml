simpleMeaning: a man who goes after wild animals or birds to catch or kill them for food or for sport
scope: A man who hunts wild animals or birds, not the wild animal or bird itself and not a man who kills
  farm animals as his job.
examples:
- The huntsman set out at dawn with his dog to look for deer.
- An old huntsman taught the boy how to follow birds in the woods.
