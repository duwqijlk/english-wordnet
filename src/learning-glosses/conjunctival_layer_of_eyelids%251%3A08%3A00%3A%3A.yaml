simpleMeaning: Joined to the part that covers the eyeball, this clear skin of the eye lines the back of
  the lids.
scope: Palpebra conjunctiva and tunica conjunctiva palpebrarum are other names for this part of the clear
  skin of the eye, the part that lines the back of the lids and joins the part over the eyeball.
examples:
- The conjunctival layer of eyelids joined the skin over the eyeball.
- Swelling of the conjunctival layer of eyelids made her eyelids feel sore.
