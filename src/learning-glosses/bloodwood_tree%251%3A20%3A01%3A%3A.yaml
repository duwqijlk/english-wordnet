simpleMeaning: Thorny bush or small tree growing in Central America and the West Indies, with finely divided
  leaves and clusters of yellow flowers. Its hard reddish-brown wood makes black dye.
scope: This is the Central American shrub whose wood yields a black dye, also called campeachy, logwood
  and logwood tree; it is not the South African tree of the same name, which has orange-yellow flowers
  and heavy timber.
examples:
- A bloodwood tree stood at the edge of the clearing, covered in small yellow flowers.
- The hard reddish-brown wood of the bloodwood tree was once used to make a black dye.
