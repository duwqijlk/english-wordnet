simpleMeaning: fish of the sea that people eat and catch for sport, found mostly in warm waters near the
  shore
scope: Sea fish caught for food and sport in warm coastal waters, also called serranid fish; not a fresh-water
  fish and not a fish kept only as a pet.
examples:
- The serranid fought hard on the line.
- Local cooks prize the serranid as food.
