simpleMeaning: a cushion worn by football and hockey players to keep the body safe from hard hits
scope: A cushion worn over the hip by football and hockey players, not a seat cushion and not a bandage.
examples:
- He wore a hip pad under his uniform for the game.
- The hip pad took the force of the tackle and kept him playing.
