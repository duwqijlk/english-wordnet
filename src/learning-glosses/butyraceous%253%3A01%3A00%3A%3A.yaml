simpleMeaning: having the nature of soft yellow fat, or giving or holding something much like it
scope: Having the nature of soft yellow fat, or giving or holding a stuff much like it, not tasting of
  milk and not made of oil.
examples:
- The butyraceous paste spread like soft fat.
- Its butyraceous feel came from the rich oils in it.
