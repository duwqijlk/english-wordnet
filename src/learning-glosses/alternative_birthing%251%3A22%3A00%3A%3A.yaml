simpleMeaning: The baby is born in a natural, home-like place, with high-tech care that gets in the way
  left out.
scope: Also called alternative birth, this is the baby's arrival in a natural, home-like place, with high-tech
  care that gets in the way left out.
examples:
- They planned alternative birthing in a home-like place with little high-tech care.
- For them, alternative birthing meant a natural place and little high-tech care.
