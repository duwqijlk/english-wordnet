simpleMeaning: keeping something at the temperature that is best for it to develop
scope: Keeping something at the best temperature for it to develop. It is not a bird sitting on eggs,
  and not the time before the first signs of an illness appear.
examples:
- Incubation of the eggs in a warm box helped them develop well.
- The lab kept the cells at a steady heat during incubation.
