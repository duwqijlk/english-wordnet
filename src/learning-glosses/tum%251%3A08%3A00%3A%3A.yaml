simpleMeaning: a large, strong, bag-like organ in the tube that food travels through, and the main organ
  for breaking food down
scope: 'Also called stomach, tummy and breadbasket: the main bag-like organ inside the body that breaks
  food down, not the outside of the belly.'
examples:
- My tum felt full after the big meal.
- He held his tum and said the food had not gone down well.
