simpleMeaning: to put spots or patches of another colour on a thing, as if it had been stained
scope: 'Also called a streak and another name for a blotch: to put spots or patches of another colour
  on a thing, not the noun sense of a pattern of patches.'
examples:
- The damp mottled the wall with dark patches.
- Autumn mottled the leaves with spots of red and gold.
