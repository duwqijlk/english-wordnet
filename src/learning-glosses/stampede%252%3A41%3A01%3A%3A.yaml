schema: oewn-learning-gloss-v2
senseId: 'stampede%2:41:01::'
synsetId: 02600625-v
simpleMeaning: to push a large group of people to do something at once, moved by a sudden feeling, without
  waiting to think
scope: Making people act in a hurry on a sudden feeling, not the rush itself, and not people rushing off
  on their own.
examples:
- The tavern owners stampeded us into overeating.
- The speaker stampeded the crowd into voting at once.
