simpleMeaning: Any of various mostly deciduous ornamental shrubs, losing their leaves each year, with
  white, sweet-smelling flowers borne singly or in clusters; widely grown in temperate regions.
scope: A mostly deciduous garden shrub with white, fragrant flowers, not an evergreen shrub or a climbing
  vine such as jasmine.
examples:
- The philadelphus in the garden bears clusters of white, sweet-smelling flowers.
- Philadelphus shrubs are widely grown in temperate regions.
