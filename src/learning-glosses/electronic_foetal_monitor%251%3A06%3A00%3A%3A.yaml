senseId: 'electronic_foetal_monitor%1:06:00::'
synsetId: 03283825-n
simpleMeaning: While a woman gives birth, this machine keeps track of her unborn child's heartbeat and
  the squeezes of her womb
scope: 'Also called electronic fetal monitor, fetal monitor, and foetal monitor: a machine that follows
  a baby''s heartbeat and its mother''s womb during birth, not a machine that watches an adult''s heartbeat.'
examples:
- The doctor read the electronic foetal monitor as the contractions grew stronger.
- An electronic foetal monitor was set up beside the bed.
