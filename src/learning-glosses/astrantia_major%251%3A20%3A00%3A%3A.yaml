simpleMeaning: A herb of Europe with sweet-smelling roots and leaves in a bunch at the base, and showy
  branched umbrella-like clusters of white to rosy flowers.
scope: Also called greater masterwort; a European herb known by sweet-smelling roots, leaves in a bunch
  at the base, and showy branched clusters of white to rosy flowers.
examples:
- Astrantia major grows in the shady border with rosy flowers.
- We planted Astrantia major for its showy flower clusters.
