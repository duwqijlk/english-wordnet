simpleMeaning: a long, formal piece of writing done by a person seeking the highest award for learning
  from a university
scope: A long formal piece of writing by a person seeking the highest university award, and not a short
  essay or a book written for the public.
examples:
- Her doctoral dissertation on medieval poetry took four years to write.
- He defended his doctoral dissertation before a panel of teachers.
