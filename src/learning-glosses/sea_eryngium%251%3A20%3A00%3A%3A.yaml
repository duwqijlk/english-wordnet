simpleMeaning: Twisted spiny leaves mark this evergreen plant of Europe, now at home on the east coast
  of the United States, its roots once used to stir desire.
scope: Also called sea holly and sea holm, this is a European evergreen plant with twisted spiny leaves,
  now at home on the east coast of the United States, its roots once used to stir desire.
examples:
- The sea eryngium grew on the east coast with twisted spiny leaves.
- People once used sea eryngium roots to stir desire.
