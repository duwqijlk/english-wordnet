simpleMeaning: A group of closely related flowering plants with two young leaves in the seed, which usually
  show when the seed starts to grow.
scope: A group of closely related flowering plants with two young leaves in the seed, also called dicot
  genus, not a group of pines and not a single kind of plant.
examples:
- The magnoliopsid genus holds plants with two seed leaves.
- Botanists put the bean in a magnoliopsid genus.
