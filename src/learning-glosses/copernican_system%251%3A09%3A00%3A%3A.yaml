simpleMeaning: In astronomy, the model of Copernicus in which the Earth moves around the sun
scope: In astronomy, the model of Copernicus in which the Earth moves around the sun, not the older model
  with the Earth at the centre and not a model of the stars alone.
examples:
- The Copernican system put the sun at the centre.
- In the Copernican system, the Earth moves around the sun.
