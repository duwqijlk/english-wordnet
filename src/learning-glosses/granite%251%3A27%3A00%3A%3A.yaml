simpleMeaning: a rock from hot melted stone deep down, with a grain you can see, usually made of feldspar,
  mica, and quartz
scope: The rock itself, not a person or thing that is firm like it.
examples:
- The steps were cut from solid granite.
- Granite blocks formed the base of the old bridge.
