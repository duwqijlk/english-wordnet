simpleMeaning: Long-lasting worry, beyond what is normal, about signs of sickness that are only imagined.
scope: Also called hypochondria, long-lasting worry beyond what is normal about signs of sickness that
  are only imagined.
examples:
- His hypochondriasis made him visit the doctor every week.
- Hypochondriasis kept her sure she was ill, though the tests were clear.
