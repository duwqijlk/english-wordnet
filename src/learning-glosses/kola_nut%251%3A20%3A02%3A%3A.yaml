simpleMeaning: A bitter brown seed that holds caffeine, the source of the flavouring used in cola drinks
scope: This is a bitter brown seed holding caffeine, also called cola nut, not the tree that bears it
  and not a coffee bean.
examples:
- He chewed a kola nut for its bitter taste.
- Kola nuts are ground to make the flavouring for cola drinks.
