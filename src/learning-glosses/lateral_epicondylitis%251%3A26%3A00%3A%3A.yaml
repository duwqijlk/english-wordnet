simpleMeaning: The elbow hurts where the cord at its outer edge swells, after the lower arm muscles have
  been used too much, as in twisting the hand.
scope: 'Also called lateral humeral epicondylitis and tennis elbow: a sore swelling of the elbow cord
  from overuse.'
examples:
- His lateral epicondylitis flared up after a long day of twisting screws.
- Lateral epicondylitis made it hurt to lift the kettle with her right hand.
