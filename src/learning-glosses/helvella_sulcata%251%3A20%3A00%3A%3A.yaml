senseId: 'helvella_sulcata%1:20:00::'
synsetId: 13057072-n
simpleMeaning: A fungus with an irregular folded cap, dark brown when young and dull grey with age; lower
  side smooth and pale grey, and stalk thick and deeply grooved.
scope: A fungus with a folded dark cap, not a mushroom with a flat cap and not a toadstool.
examples:
- The Helvella sulcata has a folded dark cap.
- We found a Helvella sulcata with a thick grooved stalk.
