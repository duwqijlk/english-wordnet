simpleMeaning: the strength with which a material holds back power flowing through it, counted in units
  called ohms
scope: 'Also called electric resistance, impedance, ohmic resistance and resistance: the strength with
  which a material holds back power flowing through it, counted in units called ohms, not the power itself
  and not a part that stops power on purpose.'
examples:
- Copper has low electrical resistance, so power flows through it with ease.
- The electrical resistance of the wire was high, so little power got through.
