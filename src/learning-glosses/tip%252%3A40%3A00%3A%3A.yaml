simpleMeaning: give someone extra money for a service, beyond the amount already agreed
scope: This is the act of paying the extra money, not the gratuity itself or a piece of insider advice;
  fee and bung are other names for the same act.
examples:
- She tipped the driver generously for carrying her bags.
- We always tip the waiter at that restaurant.
