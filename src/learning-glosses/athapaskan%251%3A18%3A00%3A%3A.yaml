simpleMeaning: A person from one of the first peoples of North America who speak a tongue, living in the
  cold north of western Canada and middle Alaska.
scope: Also called Athabascan, Athabaskan, and Athapascan; a person from one of the first peoples of North
  America, not the group of tongues they speak.
examples:
- She is an Athapaskan from the far north of western Canada.
- The Athapaskan lives in the cold north and speaks a tongue of the first peoples.
