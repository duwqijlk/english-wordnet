simpleMeaning: A boa of the grasslands and woods of western North America that looks and feels like rubber,
  with its tail and head much the same shape.
scope: This is a boa of the grasslands and woods of western North America, also called the rubber boa
  or the tow-headed snake; its tail and head are much the same shape.
examples:
- The Charina bottae lay still in the grass, its head hard to tell from its tail.
- A Charina bottae feels smooth and springy, almost like rubber, in the hand.
