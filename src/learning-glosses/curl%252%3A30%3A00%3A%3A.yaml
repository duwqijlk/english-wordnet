simpleMeaning: to take on a bent, twisted or sharply turned shape
scope: What something does when it bends or twists out of line, not the act of winding hair into coils
  or bending your body into a ball; curve and kink are other names for this sense.
examples:
- The pages of the old book had curled at the corners.
- A ribbon of smoke curled up toward the ceiling.
