simpleMeaning: about the study of big questions about life, knowledge, and right and wrong, or about the
  people who do that study
scope: 'Also called philosophical: this sense is about the study of big questions or the people who do
  it, not about staying calm and not letting feelings rule you when trouble comes.'
examples:
- He wrote a philosophic book about knowledge and right and wrong.
- She joined a philosophic group that talks about life and knowledge.
