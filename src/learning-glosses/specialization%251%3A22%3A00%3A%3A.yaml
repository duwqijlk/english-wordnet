simpleMeaning: In biology, a body part fitted by its shape to do one special job.
scope: 'Also called differentiation: in biology, a body part shaped to do one special job, not the act
  of making a thing fit for a special purpose and not the line of work one takes up as a career.'
examples:
- The specialization of cells lets each part do its own job.
- Specialization in the embryo gives each cell a set task.
