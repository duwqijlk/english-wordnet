simpleMeaning: a mineral made of titanium dioxide in crystal form, found in rocks changed by heat and
  pressure and in rocks formed deep underground; a main source of titanium
scope: A mineral, not a metal itself; a source of titanium, not a gemstone.
examples:
- Rutile is dug up as a main source of titanium.
- This rock holds shiny grains of rutile.
