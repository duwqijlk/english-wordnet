simpleMeaning: The Turkic group of tongues has this one, which that people speak.
scope: Also called Turcoman or Turkoman, Turcoman language, Turkmen and Turkmen language, this is the
  tongue of that people, not the people themselves and not the word for their things.
examples:
- He speaks the Turkoman language at home.
- The Turkoman language is spoken by that people.
