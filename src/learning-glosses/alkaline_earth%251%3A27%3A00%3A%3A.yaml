simpleMeaning: Any of the group II elements of the table of elements that join with two other atoms (calcium,
  strontium, barium, magnesium or beryllium)
scope: Any of the group II elements that join with two other atoms; alkaline-earth metal is another name
  for this sense, not the group I elements, which join with only one other atom.
examples:
- Calcium is an alkaline earth.
- Magnesium is one of the alkaline earths.
