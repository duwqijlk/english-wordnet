simpleMeaning: A rough, grey-green plant that lives for one year, with yellow flowers, found from the
  southwest of the United States to Mexico.
scope: Also called butter daisy, cowpen daisy, golden crown beard, golden crownbeard or Verbesina encelioides;
  a rough grey-green plant with yellow flowers, not a tall shrub or a garden flower.
examples:
- Ximenesia encelioides grows in dry fields.
- The Ximenesia encelioides had bright yellow flowers.
