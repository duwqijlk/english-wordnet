simpleMeaning: a drug that opens up the blood vessels far from the heart to ease sudden tight cramps in
  them, as in acrocyanosis, when hands and feet turn blue
scope: A drug that opens blood vessels far from the heart to ease sudden cramps in them; not a drug that
  narrows blood vessels and not a drug for the heart itself.
examples:
- The doctor gave her tolazoline for the cramps in her hands.
- Tolazoline helped the blood flow back into his cold blue fingers.
