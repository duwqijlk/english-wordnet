simpleMeaning: a solid in hard bits, with no colour, used in perfume, to keep dead bodies and samples
  from rotting, and as a medicine that kills fungus and germs
scope: 'Also called thymic acid and thymol: a colourless solid used in perfume and medicine, not a liquid
  scent and not a spice.'
examples:
- Thyme camphor gives the perfume its sharp clean smell.
- The lab used thyme camphor to keep the specimen from rotting.
