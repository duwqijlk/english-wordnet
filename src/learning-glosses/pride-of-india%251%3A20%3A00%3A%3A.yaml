simpleMeaning: A tree of northern South Asia and China with purple flowers and small yellow fruit that
  cannot be eaten, wild in the south of the US as a shade tree.
scope: Also called chinaberry, azedarach, azederach, chinaberry tree, China tree, Melia azedarach, Melia
  azederach, and Persian lilac; not the same-named tree of Asia, Australia and the East Indies grown for
  timber called pyinma.
examples:
- The pride-of-India in our garden has purple flowers in spring.
- People plant pride-of-India trees along the street for shade.
