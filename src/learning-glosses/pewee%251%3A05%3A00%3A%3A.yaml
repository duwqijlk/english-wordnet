simpleMeaning: A small woodland bird of eastern North America, olive in colour, that catches flies.
scope: A small woodland bird of eastern North America, olive in colour, that catches flies; peewit, peewee
  and pewit are other names for this sense, not a larger songbird and not a bird of the west.
examples:
- A pewee sang from a branch above the path.
- We saw a pewee dart out to catch a fly.
