simpleMeaning: Flames aimed at the top and walls warm the stuff inside a big heated box, without the fire
  itself touching it.
scope: A heater that warms what is put inside it with heat bounced off its roof and walls, not a fire
  that touches the stuff itself.
examples:
- The reverberatory furnace was hot, but the flames never touched what was inside it.
- Heat from the roof and walls of the reverberatory furnace warmed the stuff inside.
