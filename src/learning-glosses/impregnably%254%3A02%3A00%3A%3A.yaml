simpleMeaning: in a way that cannot be broken into or taken over
scope: Doing something so that it cannot be broken into or taken over; not merely doing it firmly or safely.
examples:
- The castle stood impregnably on the cliff, and no army could take it.
- She held the fort impregnably through the long siege.
