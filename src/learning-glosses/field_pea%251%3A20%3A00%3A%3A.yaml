simpleMeaning: A kind of plant with green seeds in pods, from lands around the Mediterranean Sea and the
  north of Africa, grown in large amounts, above all to feed farm animals.
scope: This is a kind of plant with green seeds in pods, also called field-pea plant, grown above all
  to feed farm animals; not the sweet kind grown for people to eat and not the sweet-smelling kind grown
  for its flowers.
examples:
- The farmer sowed field peas across the dry ground for winter feed.
- Field peas grow well in the poor soil near the coast.
