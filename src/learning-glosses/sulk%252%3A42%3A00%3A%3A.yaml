simpleMeaning: To be in a bad mood and show it, without hiding how unhappy you are.
scope: This verb means to be in a bad mood and show it, also called brood or pout, not the noun for a
  long, cold, silent mood.
examples:
- She is sulking because she didn't get what she wanted.
- He sulked all evening after losing the game.
