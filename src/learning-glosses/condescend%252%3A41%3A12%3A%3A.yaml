simpleMeaning: To lower oneself by doing something shameful and unworthy of respect.
scope: Lowering oneself by a shameful act, also called stoop, and not merely speaking down to someone.
examples:
- I won't condescend to reading other people's mail.
- He refused to condescend to such low tricks.
