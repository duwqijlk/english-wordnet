simpleMeaning: At the back of a plane, a flat wing that never moves holds the hinged flap that steers
  the tail up or down.
scope: It is also called a tailplane and a horizontal stabilizer, and it is the still, flat wing on a
  plane's tail that carries the hinged flap.
examples:
- The horizontal stabiliser keeps the plane steady in flight.
- Damage to the horizontal stabiliser forced the plane to land.
