simpleMeaning: A person who was born in that place or lives there.
scope: Also called bluenose; this is a person from that place, not a person from any other place and not
  the place itself.
examples:
- He is a Nova Scotian, born in that place and still living there.
- She became a Nova Scotian when she moved to that place years ago.
