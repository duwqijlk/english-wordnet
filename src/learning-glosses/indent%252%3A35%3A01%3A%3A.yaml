simpleMeaning: to cut or tear something along a rough, uneven line so the parts can later be put together
  to prove they are real
scope: Cutting or tearing along a rough line so the parts can later be matched, not tying a servant to
  a master, not an order for goods, and not the space at the start of a line.
examples:
- Indent the documents along a wavy line before you file them.
- He indented the paper so the two halves could be matched later.
