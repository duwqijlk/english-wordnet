simpleMeaning: One of twelve spine bones in the human spine, the chest spine bones running from the seventh
  neck bone down to the first low-back bone.
scope: This sense is also called dorsal vertebra.
examples:
- A thoracic vertebra sits in the chest.
- Thoracic vertebrae run down the spine.
