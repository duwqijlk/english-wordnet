simpleMeaning: A North American willow with greyish, silky, hairy leaves that most often turn black as
  they dry.
scope: A North American willow with greyish silky hairy leaves that usually blacken in drying, not a white
  willow or a black willow, also called silky willow, silver willow and Salix alba sericea.
examples:
- Salix sericea grows by the cold stream.
- The leaves of Salix sericea blackened as they dried.
