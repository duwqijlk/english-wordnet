simpleMeaning: Any of the oldest holy writings of Hinduism, in early Sanskrit, from a Sanskrit word for
  'knowledge'; they are held to be made up of Samhitas, Brahmanas, Aranyakas and Upanishads.
scope: Any of the oldest holy writings of Hinduism, in early Sanskrit, also called Veda.
examples:
- Vedic literature is among the oldest holy writings of Hinduism.
- He studies Vedic literature written in early Sanskrit.
