simpleMeaning: A poison found in the body fluids of some creatures that sets off the same kind of body
  defence as the poisons made by germs
scope: This is also called a zootoxin, and it is not one made by germs.
examples:
- The animal toxin in the fluid set off the same kind of body defence as a germ poison.
- She studied the animal toxin that the creature carried in its body fluids.
