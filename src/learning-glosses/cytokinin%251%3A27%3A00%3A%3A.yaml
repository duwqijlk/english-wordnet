simpleMeaning: one of a group of plant chemicals that make cells split and keep leaves from getting old
scope: Also called kinin, it is a plant chemical, not a food that feeds the plant and not a part of the
  plant itself.
examples:
- The farmer sprayed cytokinin on the cuttings to help new cells form.
- Cytokinin kept the picked leaves green for days longer.
