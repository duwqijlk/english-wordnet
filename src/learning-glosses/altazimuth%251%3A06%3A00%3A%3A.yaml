simpleMeaning: A tool that finds how high and in what direction a thing in the sky sits, used to find
  one's way when travelling.
scope: A tool that finds how high and in what direction a thing in the sky sits, used to find one's way
  when travelling; not a compass and not a star map.
examples:
- The sailor used the altazimuth to fix the ship's place.
- An altazimuth showed the star's height above the sea.
