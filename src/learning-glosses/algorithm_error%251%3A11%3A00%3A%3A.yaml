simpleMeaning: a mistake that comes from picking the wrong set of steps or way of working to get the result
  you want
scope: A mistake from a wrong choice of steps, not a typing slip and not a fault in the machine itself.
examples:
- The program gave a wrong answer because of an algorithm error in the code.
- They traced the algorithm error to a poor choice of method for sorting the data.
