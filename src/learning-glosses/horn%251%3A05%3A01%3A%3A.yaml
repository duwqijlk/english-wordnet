simpleMeaning: one of the bony growths on the head of some animals with hooves
scope: One true bony horn on the head of a hoofed animal; not a hard part on another living thing that
  only looks like a horn, and not the stuff a horn is made of.
examples:
- The cow's horns were long and curved.
- The goat broke one of its horns on the gate.
