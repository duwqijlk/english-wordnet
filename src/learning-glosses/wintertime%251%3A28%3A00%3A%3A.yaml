simpleMeaning: the coldest season of the year; in the northern half of the world, it runs from the shortest
  day of the year to the start of spring
scope: 'Also called winter: this is the coldest season of the year, not cold weather on a single day and
  not another season such as summer.'
examples:
- In wintertime, the lake freezes and the days are very short.
- Wintertime is the best time for skiing in these mountains.
