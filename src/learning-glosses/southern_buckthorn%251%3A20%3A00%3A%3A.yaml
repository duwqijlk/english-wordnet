simpleMeaning: White flowers and small black fruit with a stone inside grow on this low, bushy, thorny
  tree of the south-east United States, which loses its leaves each year.
scope: It is also called mock orange, shittim, and shittimwood, a low, bushy, thorny tree of the south-east
  United States with white flowers and small black fruit with a stone inside.
examples:
- White flowers and small black fruit grew on the southern buckthorn.
- The southern buckthorn loses its leaves each year and bears small black fruit with a stone inside.
