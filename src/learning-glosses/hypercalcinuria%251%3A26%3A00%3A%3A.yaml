simpleMeaning: Usually, too much bone is broken down when the glands that set calcium levels work too
  hard or bones grow thin and weak, leaving too much calcium in the urine.
scope: It names the state where too much calcium shows up in the urine, also called hypercalciuria.
examples:
- Hypercalcinuria showed up in her urine test.
- His hypercalcinuria came from bones breaking down too fast.
