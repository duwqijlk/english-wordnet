simpleMeaning: in a way that sounds pleasant and has a sweet tune
scope: This is about how singing or playing sounds when it is pleasant and has a sweet tune, not about
  a person's knowledge of songs and how they are made.
examples:
- She sang very musically, with a clear and sweet tune.
- The children played musically together and kept the beat well.
