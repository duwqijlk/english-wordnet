simpleMeaning: A banana tree from the Philippines whose leaf stalks give a fibre used for rope, paper
  and other things.
scope: This is the Philippine banana tree whose leaf stalks give the fibre, also called abaca and Manila
  hemp, not the fibre itself and not other banana trees.
examples:
- Musa textilis leaf stalks were cut for rope fibre.
- The Musa textilis trees grew tall in the Philippine fields.
