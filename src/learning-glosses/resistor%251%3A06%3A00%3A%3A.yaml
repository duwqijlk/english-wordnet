simpleMeaning: a part in an electric circuit (a closed path that electricity moves around) that slows
  the flow of electricity
scope: 'Also called resistance: a part that slows electricity as it moves in a circuit; it is not the
  general act of fighting against something, and not a person who fights a change.'
examples:
- The resistor in the radio got hot when the power was too high.
- He put a new resistor into the circuit to slow the flow of electricity.
