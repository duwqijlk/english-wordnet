simpleMeaning: a secret group inside a terror group that plans and moves supplies, usually big and less
  split into small closed parts than other such groups
scope: A secret support group inside a terror group, not the fighters who carry out attacks and not a
  group that works alone.
examples:
- The auxiliary cell arranged safe houses and transport for the network.
- Police said the auxiliary cell handled supplies rather than attacks.
