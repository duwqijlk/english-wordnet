senseId: 'restless_legs_syndrome%1:26:00::'
synsetId: 14332821-n
simpleMeaning: an uneasy feeling in the lower limbs at bedtime, and an urge to move them, that can stop
  sleep and is eased for a while by walking or moving them
scope: Not a cramp in the lower limbs, and not plain lack of sleep; also called restless legs.
examples:
- The doctor said her restless legs syndrome often flares up at night.
- His restless legs syndrome eased when he walked about the room.
