simpleMeaning: A long-lived North American woodland plant with a red root and red sap, a lobed leaf and
  white early-spring flower, that causes vomiting; root used as stimulant and chest remedy.
scope: Also called bloodroot, puccoon, redroot and tetterwort; a woodland plant of North America with
  a red root, not a tree and not a garden flower.
examples:
- Sanguinaria canadensis blooms in early spring in the woods.
- The root of Sanguinaria canadensis was used as a stimulant.
