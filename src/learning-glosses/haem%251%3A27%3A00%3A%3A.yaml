simpleMeaning: A red colouring stuff made of iron and other tiny bits, to which oxygen sticks
scope: This is a red colouring stuff, made of iron and other tiny bits, to which oxygen sticks; haematin,
  hematin, heme and protoheme are other names for this sense, not the red cells themselves and not iron
  on its own.
examples:
- Haem gives blood its red colour.
- Oxygen binds to haem in the blood.
