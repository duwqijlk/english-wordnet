simpleMeaning: A part that glows on its own when power runs through it, with no need for a lamp behind
  it or for sheets that spread the glow.
scope: This part glows on its own when power runs through it, so it works with no lamp behind it and no
  sheets that spread the glow.
examples:
- The organic light-emitting diode glows when power runs through it.
- An organic light-emitting diode needs no lamp behind it.
