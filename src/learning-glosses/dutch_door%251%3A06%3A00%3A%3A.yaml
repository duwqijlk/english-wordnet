simpleMeaning: An outside entrance split in two across the middle, so each half can shut or open on its
  own.
scope: Also called a half door; an outside entrance split across the middle, not a plain door that opens
  in one piece.
examples:
- She opened only the top half of the Dutch door.
- The Dutch door let in air while keeping the dog inside.
