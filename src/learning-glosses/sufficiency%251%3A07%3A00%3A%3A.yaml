senseId: 'sufficiency%1:07:00::'
synsetId: 05119909-n
simpleMeaning: The quality something has when it is enough for the purpose it is meant for
scope: This is the quality of being enough for a purpose; it is not an amount that is enough, and not
  enough money and things to live in comfort and pay what you owe.
examples:
- He questioned the sufficiency of the plan to meet the town's needs.
- We checked the sufficiency of the food for the whole trip.
