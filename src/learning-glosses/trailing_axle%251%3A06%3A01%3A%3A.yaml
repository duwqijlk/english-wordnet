simpleMeaning: A pair of wheels joined together with no power of their own, set behind the driving wheels,
  is joined by this rod on a steam engine.
scope: This is the rod on a steam engine that joins the pair of wheels behind the driving wheels, not
  the rod that joins the driving wheels.
examples:
- Engineers fitted a trailing axle behind the driving wheels.
- The trailing axle carried no power to the wheels.
