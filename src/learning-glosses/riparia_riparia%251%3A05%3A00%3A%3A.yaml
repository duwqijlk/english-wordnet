simpleMeaning: A swallow of the Northern Hemisphere that nests in holes dug in banks of clay or sand.
scope: A swallow of the Northern Hemisphere nesting in tunnels in clay or sand banks, not a barn swallow
  or a house martin, also called bank martin, bank swallow and sand martin.
examples:
- Riparia riparia nested in the sand bank by the river.
- We watched Riparia riparia dart over the water.
