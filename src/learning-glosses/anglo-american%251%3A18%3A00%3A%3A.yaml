simpleMeaning: A person from the United States who was born in Britain, or whose earlier family members
  were British
scope: A person from the United States with British birth or British family, not a person from the United
  States of other family, and not a British person.
examples:
- Her father was an Anglo-American who was born in London.
- The Anglo-American writer had grandparents from Manchester.
