simpleMeaning: A drug against viruses used to fight HIV, one of a kind that stops the virus from copying
  itself (a NARTI drug).
scope: 'Also called dideoxycytosine, zalcitabine or DDC: a drug against viruses used to fight HIV, not
  a drug that kills bacteria and not a vaccine.'
examples:
- ddC is a drug against viruses used to fight HIV.
- Doctors gave ddC to stop the virus from copying itself.
