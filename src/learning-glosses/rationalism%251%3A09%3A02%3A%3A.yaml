simpleMeaning: In thought-lore, the teaching that knowing comes by ground, with no call on trial.
scope: In thought-lore, the teaching that knowing comes by ground, with no call on trial; not the god-lore
  teaching that man's ground, rather than god's showing, sets holy truth, nor the teaching that ground
  is the right ground for ruling deeds.
examples:
- Their rationalism ruled at dawn.
- The rationalism was taught at noon.
