simpleMeaning: a place where people live away from the world for religious reasons, such as a monastery
scope: A home for religious life away from the world, such as a monastery; not the open yard with covered
  walks in such a place, and not the act of shutting someone away.
examples:
- He left the city to live in a quiet cloister.
- The sisters spent their lives in the cloister.
