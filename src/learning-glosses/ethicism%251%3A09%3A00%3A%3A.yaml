simpleMeaning: the belief that ideas about right and wrong are true and matter
scope: The belief that ideas about right and wrong are true and matter, not a set of rules for one job
  and not the study of right and wrong itself.
examples:
- His ethicism often led him to moralize.
- Her ethicism made her judge every choice by what was right.
