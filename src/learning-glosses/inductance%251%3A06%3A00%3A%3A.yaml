simpleMeaning: Most often a coil of wire, this small electric part adds to a circuit the power to make
  a push when the flow of current changes.
scope: Also called an inductor, this small electric part is most often a coil of wire, and it is not the
  happening in which a push is made in a closed wire loop when the flow of current changes.
examples:
- They took out the old inductance and put in a new one.
- We wound a new inductance for the set.
