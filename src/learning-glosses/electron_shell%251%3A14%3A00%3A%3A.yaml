simpleMeaning: A set of tiny charged bits that circle the middle of an atom.
scope: A set of charged bits circling an atom's middle, not the middle itself and not a single charged
  bit.
examples:
- The chemical properties of an atom are fixed by its outermost electron shell.
- Two electrons filled the inner electron shell of the atom.
