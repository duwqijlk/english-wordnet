simpleMeaning: the way liquid comes out of a jelly-like mass when it shrinks, as in making cheese
scope: This is liquid coming out of a jelly-like mass as it shrinks, also called syneresis. Not liquid
  added to a mix and not the shrinking of a solid.
examples:
- Synaeresis drew the liquid out of the cheese as it set.
- In synaeresis, the gel shrinks and gives off liquid.
