simpleMeaning: When you reach a hotel or an airport, you tell the people there that you have arrived.
scope: It is also called check in, and it is what you do to let a hotel or an airport know you have arrived.
examples:
- Guests sign in when they reach the hotel.
- At the airport, you sign in when you get there.
