simpleMeaning: In music, describing a scale or mode in which there is a half step between the third and
  fourth notes and between the seventh and eighth notes.
scope: This is the musical scale sense, not greater in number or size, not greater in importance or rank,
  not greater in scope or effect, not more serious or dangerous, not of full legal age, not the elder
  of two boys with the same family name, and not the noun or verb senses about a military officer, a student's
  main subject, or studying that subject.
examples:
- The concerto is written in D major.
- A major scale has half steps between its third and fourth notes and between its seventh and eighth notes.
