senseId: 'abatable_nuisance%1:09:00::'
synsetId: 05839156-n
simpleMeaning: Something troubling that can be brought to an end by stopping it, wiping it out, or making
  it harmless.
scope: A troubling thing counts as one of this kind when it can be stopped, wiped out, or made harmless.
examples:
- The continued existence of an abatable nuisance is not allowed under the law.
- An abatable nuisance can be made harmless.
