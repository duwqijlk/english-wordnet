simpleMeaning: to put a person or object in a place on purpose so they can watch without being noticed,
  or to trick someone
scope: This is the act of secretly putting a spy or hidden device somewhere, not the thing left for someone
  to find, and not the ordinary act of setting seeds or objects firmly in soil.
examples:
- Agents were planted in the company to report on its dealings.
- She suspected someone had planted a listening device in the room.
