simpleMeaning: In genetics, a living thing born to parents or stock not alike in their genes, especially
  one bred from plants or animals of different sorts, breeds or species
scope: Also called cross and hybrid; this is the living thing itself, not the act of breeding plants or
  animals from parents of different kinds.
examples:
- A mule is a crossbreed, born to a horse and a donkey.
- The farmer kept a crossbreed that came from two different breeds of cattle.
