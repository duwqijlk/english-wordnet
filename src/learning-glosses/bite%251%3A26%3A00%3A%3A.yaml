simpleMeaning: a sore or torn place on the skin left when an animal or person sinks its teeth into it
scope: A skin wound made by teeth, not the act of tearing with the teeth and not the small wound an insect's
  stinger makes.
examples:
- The dog left a deep bite on her forearm.
- He cleaned the bite on his leg before bandaging it.
