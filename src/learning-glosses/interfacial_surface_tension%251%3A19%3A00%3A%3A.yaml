simpleMeaning: At the line where two liquids that will not mix touch, there is a pull
scope: The pull where two liquids that will not mix meet, also called interfacial tension; not the pull
  inside one liquid and not the pull between a liquid and air.
examples:
- Oil and water show interfacial surface tension where they meet.
- The interfacial surface tension kept the two liquids from mixing.
