simpleMeaning: a general book of word meanings kept in a form a computer can read, with its words listed
  from A to Z
scope: 'Also called machine readable dictionary: a general book of word meanings kept in a form a computer
  can read, with its words listed from A to Z, not a printed book of word meanings and not a list of words
  with no meanings.'
examples:
- She looked up the word in her electronic dictionary.
- The electronic dictionary on his computer gave the meaning in seconds.
