simpleMeaning: A part or mark built to steer how something moves or where it rests.
scope: A fixed part or painted mark that controls how something moves or where it sits; it is not a book
  of instructions, not a person who finds the way, and not the act of steering by a light or landmark.
examples:
- The plastic guide keeps the drawer sliding in a straight line.
- Thread the line through the guides on the fishing rod.
