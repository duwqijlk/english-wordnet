simpleMeaning: a low shoe with laces tied over the top middle part of the foot
scope: A low shoe tied with laces, not a boot that covers the leg above the foot and not a shoe with no
  laces.
examples:
- He wore brown oxfords with his dark suit.
- She tied the laces of her black oxford and stood up.
