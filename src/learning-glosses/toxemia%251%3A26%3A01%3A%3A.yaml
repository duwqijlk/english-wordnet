simpleMeaning: This sickness comes with carrying a baby and shows itself in blood pressure that runs too
  high, swelling, and protein in the urine.
scope: Toxaemia, toxaemia of pregnancy, and toxemia of pregnancy are other names for this sickness of
  a woman carrying a baby.
examples:
- The toxemia showed up as high blood pressure and protein in the urine.
- With toxemia, swelling and protein in the urine come with the high blood pressure.
