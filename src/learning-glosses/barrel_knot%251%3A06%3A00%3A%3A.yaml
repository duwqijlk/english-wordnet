simpleMeaning: a way of tying two fishing lines together, with the ends of the two lines wound round each
  other two or three times
scope: 'Also called a blood knot: a way of joining two fishing lines, not a knot that joins a line to
  a hook and not a knot in a rope.'
examples:
- He tied the two leaders with a barrel knot before he cast his line.
- She used a barrel knot to join the two fishing leaders.
