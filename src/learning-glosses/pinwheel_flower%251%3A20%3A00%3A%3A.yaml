simpleMeaning: A tropical shrub whose leaves gleam and whose perfumed blooms, opening at night, have petals
  curled like a child's windmill; it ranges from northern India to Thailand.
scope: Another name for the night-blooming tropical shrub also called crape jasmine and coffee rose; not
  the toy windmill.
examples:
- A pinwheel flower opened its curled white petals after dusk.
- He trained the pinwheel flower against a sunny wall.
