simpleMeaning: to meet something at the height of the front of your body
scope: This verb means to meet something at chest height; it is not the noun for the front of the body
  and not a woman's two soft parts that make milk.
examples:
- The runner breasted the tape at the end of the race.
- He breasted the line just ahead of the other runners.
