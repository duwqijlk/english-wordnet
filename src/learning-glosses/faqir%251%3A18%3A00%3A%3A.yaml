simpleMeaning: A Muslim or Hindu monk who lives by begging and is seen as a holy man.
scope: A Muslim or Hindu monk who lives by begging and is seen as a holy man, also called fakir, fakeer
  and faquir; not an ordinary beggar and not a priest who serves in a temple.
examples:
- The faqir sat by the road, asking passers-by for food.
- People came to the faqir for his blessing.
