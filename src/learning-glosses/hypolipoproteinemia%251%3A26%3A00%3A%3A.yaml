simpleMeaning: Blood with too little of the fatty stuff and cholesterol in it points to one of several
  health problems in how the body deals with those fats.
scope: The name covers any of several health problems in which the blood holds too little of the fatty
  stuff and cholesterol, and it does not cover a case of too much of them.
examples:
- Hypolipoproteinemia left too little cholesterol moving in the blood.
- Low levels of the fatty stuff in the blood can point to hypolipoproteinemia.
