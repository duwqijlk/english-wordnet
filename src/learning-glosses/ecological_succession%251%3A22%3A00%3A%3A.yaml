synsetId: 13584065-n
simpleMeaning: In ecology, a living place reaches a steady state only after one group of living things
  gives way to the next, again and again, in a slow, orderly change.
scope: Also called succession, it is the slow, orderly change that takes a living place from one group
  of living things to the next, not a sudden change in it.
examples:
- Ecological succession takes place slowly, one group of living things replacing another.
- Ecological succession ends only when the living place reaches a steady state.
