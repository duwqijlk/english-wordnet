simpleMeaning: one of the stems in an umbel (a group of flowers whose stems all start from one point)
  or in a flower group shaped like one
scope: One stem in an umbel or in a flower group shaped like an umbel; not a bone in a fish's fin and
  not a line of light or energy.
examples:
- Each ray of the flower head carries one small flower at its end.
- The short rays spread out from the top of the main stem.
