simpleMeaning: 'the state of not being able to have children: in a woman, not being able to become pregnant;
  in a man, not being able to make a woman pregnant'
scope: 'Also called sterility: the state of not being able to have children, in a woman or in a man, not
  a free choice to have no children.'
examples:
- They went to a doctor for help with infertility.
- Infertility can come from a problem in the man, in the woman, or in both.
