simpleMeaning: the top of a car with a panel that slides back or lifts up
scope: This is the top of a car with a panel that slides back or lifts up, also called a sunroof, not
  a fixed top and not a window in the side of a car.
examples:
- He opened the sunshine-roof on the warm drive home.
- Rain came through the sunshine-roof when she left the panel open.
