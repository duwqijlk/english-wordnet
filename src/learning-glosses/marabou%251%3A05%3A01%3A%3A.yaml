simpleMeaning: Soft feathers under its wings are used to edge clothes, and this big African bird eats
  dead flesh, black and white in colour.
scope: 'People also call it a marabou stork or a marabout: it is the big African bird that eats dead flesh,
  not the soft feathers taken from it.'
examples:
- A marabou stood picking at dead flesh.
- The marabou's wings were black and white.
