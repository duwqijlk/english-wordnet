simpleMeaning: A system spread through the body, made of all the cells that can swallow bacteria or tiny
  floating bits, except for certain white blood cells.
scope: This is a body-wide set of cells that swallow germs, also called reticuloendothelial system, not
  the blood itself nor a single organ.
examples:
- The RES clears bacteria from the blood.
- RES cells swallow tiny bits in the body.
