senseId: 'balanced_budget%1:21:00::'
synsetId: 13442875-n
simpleMeaning: a spending plan in which the money spent now is the same as the money taken in
scope: A spending plan in which money spent and money taken in are the same, not a plan that spends more
  than it takes in and not a list of what a body owns and owes.
examples:
- The town passed a balanced budget for the coming year.
- A balanced budget leaves no new debt to pay off.
