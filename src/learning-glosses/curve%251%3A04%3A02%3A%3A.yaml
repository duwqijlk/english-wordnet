simpleMeaning: In baseball, a throw that spins as it flies, so the ball bends in the air as it nears the
  person with the bat
scope: This is a kind of throw in baseball, not a bend in a road or river and not the act of bending.
examples:
- His last curve spun away from the batter at the last moment.
- She is learning to throw a curve in baseball practice.
