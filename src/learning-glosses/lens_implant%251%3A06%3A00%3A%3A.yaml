senseId: 'lens_implant%1:06:00::'
synsetId: 03662565-n
simpleMeaning: A clear plastic piece put into the eye in place of the eye's own clear part, usually after
  it was taken out in an operation for a clouded sight
scope: A clear plastic piece put into the eye; interocular lens implant is another name for this sense,
  not glasses worn outside the eye and not a lens that sits on its surface.
examples:
- The lens implant gave her clear sight again after the operation.
- He received a lens implant when his own lens was removed.
