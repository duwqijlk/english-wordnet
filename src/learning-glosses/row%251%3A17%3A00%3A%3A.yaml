simpleMeaning: a long, unbroken band, usually running across rather than up and down.
scope: This is a band of cloud, wire, or similar material, not a line of figures or symbols, not objects
  or people placed side by side, and not a stretch of consecutive time.
examples:
- A row of barbed wire ran along the top of the wall.
- A row of dark cloud stretched across the horizon.
