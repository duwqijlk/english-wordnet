simpleMeaning: speaking to a group in a formal way; usually a long speech that tries to move people with
  words, and often sounding too grand and proud
scope: Formal speaking to a group, usually long and often grand in style; not normal talk and not a short,
  plain speech.
examples:
- His oratory held the crowd quiet for a full hour.
- She used fine oratory to win support for the plan.
