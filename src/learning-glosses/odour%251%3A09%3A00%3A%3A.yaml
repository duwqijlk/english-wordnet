simpleMeaning: what you sense in your nose when tiny bits of something in the air touch the parts inside
  the nose that pick up smells
scope: What you sense in your nose when tiny bits of something in the air touch the parts inside the nose
  that pick up smells; smell and odor are other names for this sense, not a taste and not simply a bad
  smell.
examples:
- She loved the odour of roses in the garden.
- A strange odour came from the kitchen.
