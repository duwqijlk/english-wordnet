simpleMeaning: In speaking, a set speech from a person in charge that gives advice or urges people to
  act.
scope: In speaking, a set speech from a person in charge that gives advice or urges people to act; not
  a chat and not a lesson.
examples:
- The judge gave a short allocution before the sentence.
- His allocution urged the crowd to keep the peace.
