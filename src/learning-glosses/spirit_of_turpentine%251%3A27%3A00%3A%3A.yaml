simpleMeaning: As a medicine and a paint thinner, this liquid takes other stuff into itself; it turns
  to gas fast and is drawn off from a sticky plant stuff.
scope: Also called turpentine, turps, and oil of turpentine, it is a liquid drawn off from a sticky plant
  stuff, not the sticky stuff itself.
examples:
- He thinned the paint with spirit of turpentine.
- Spirit of turpentine turns to gas fast.
