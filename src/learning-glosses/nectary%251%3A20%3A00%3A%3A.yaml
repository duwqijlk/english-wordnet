simpleMeaning: A small part, often a bump or a hollow, that makes nectar, the sweet liquid bees drink.
scope: A small part that makes nectar, not a petal and not a leaf; also called honey gland.
examples:
- The nectary at the base of the flower makes sweet nectar.
- Bees visit the flower because its nectary gives them nectar.
