simpleMeaning: Of, to do with, or made of very small parts that work by electricity.
scope: Of, to do with, or made of very small parts that work by electricity; not made of large parts and
  not the branch of study itself.
examples:
- The microelectronic parts in the phone are very small.
- Microelectronic circuits use parts that work by electricity.
