simpleMeaning: Urinary incontinence that is generally caused by the bladder muscle contracting on its
  own, giving an urgent need to urinate and a sudden loss of urine; most common over 60.
scope: The kind of urinary leakage in which the bladder muscle contracts on its own, producing an urgent
  need to urinate and a sudden loss of urine. It is not stress incontinence, which leaks on coughing,
  sneezing or effort. It is most often seen in people over 60.
examples:
- Her doctor asked whether the leakage was urge incontinence or a problem with coughing.
- Urge incontinence made him reluctant to take long bus rides.
