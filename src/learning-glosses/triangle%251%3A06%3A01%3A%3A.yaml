simpleMeaning: any of the three-sided tools used in drawing to make straight lines at set angles
scope: Any of the three-sided tools used in drawing to make straight lines at set angles, not a music
  instrument and not a thing shaped like a triangle.
examples:
- He used a triangle to draw the roof line.
- The triangle helped her draw a line at forty-five degrees.
