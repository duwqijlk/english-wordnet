senseId: 'beta-lactamase%1:27:00::'
synsetId: 15003103-n
simpleMeaning: Some germs make this body chemical, which stops penicillin from working, so the germs are
  no longer killed by that drug.
scope: Also called penicillinase, this chemical made by some germs stops penicillin from working.
examples:
- The beta-lactamase in the germs stopped the penicillin from working.
- The beta-lactamase let the germs live through the penicillin.
