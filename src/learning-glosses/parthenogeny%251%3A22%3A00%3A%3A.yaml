simpleMeaning: The way an egg with no male seed grows into a new living thing, common in insects and some
  other jointed-legged creatures.
scope: The way an egg with no male seed grows into a new living thing, also called parthenogenesis; not
  birth from a joined egg and not growth by splitting.
examples:
- Parthenogeny lets some aphids breed without males.
- In parthenogeny, the young grow from eggs never joined.
