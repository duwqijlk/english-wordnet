simpleMeaning: Ionizing, the forming of ions by splitting atoms, molecules and radicals apart, or by giving
  electrons to atoms or taking them away, under mighty electric forces in gas.
scope: Ionizing, the forming of ions by splitting atoms, molecules and radicals apart, or by giving electrons
  to atoms or taking them away, under mighty electric forces in gas; it is also called ionisation, unlike
  the sense for the state of being split into ions, as by heat or radiation or a chemical change or an
  electric discharge.
examples:
- Ionization makes ions in a gas.
- Ionization splits atoms apart.
