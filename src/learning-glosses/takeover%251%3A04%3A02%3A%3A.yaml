simpleMeaning: a sudden change of government that is clear and final, done against the law or by force
scope: 'Also called a coup and a putsch: a sudden change of government by force or against the law, not
  a change in who controls a company.'
examples:
- The general led a takeover of the government and put the president in prison.
- A takeover by force left the country with a new leader in a single night.
