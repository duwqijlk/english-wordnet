simpleMeaning: These large sea animals live along North America's Atlantic coast, each with a domed horseshoe-shaped
  shell and a stiff, pointed tail. They are living fossils related to the wood louse.
scope: Another name for the horseshoe crab; not the large edible king crab of the northern Pacific, nor
  its meat.
examples:
- The domed shell of the Atlantic king crab looks like a curved shoe.
- Biologists still call the Atlantic king crab a living fossil.
