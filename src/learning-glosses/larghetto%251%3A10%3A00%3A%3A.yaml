simpleMeaning: A slow pace, a little faster than largo and a little slower than adagio, marks a piece
  or part of a piece in music.
scope: In music, this is a piece or part of a piece played at a slow pace, a little faster than largo
  and a little slower than adagio, not as slow as largo.
examples:
- The orchestra played the larghetto.
- The larghetto moved at a slow pace.
