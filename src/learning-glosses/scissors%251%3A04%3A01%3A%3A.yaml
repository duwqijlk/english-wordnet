simpleMeaning: a move on the pommel horse in which the gymnast swings the legs past each other like the
  two blades of a cutting tool
scope: A move on the pommel horse with the legs swinging past each other; not a wrestling hold and not
  the cutting tool.
examples:
- The gymnast did scissors on the pommel horse.
- His scissors on the pommel horse won the judges' praise.
