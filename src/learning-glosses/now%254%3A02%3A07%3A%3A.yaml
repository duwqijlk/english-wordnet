simpleMeaning: Used at the start of a remark to show that the speaker is turning to a different subject
  or activity.
scope: This marks a change of subject or activity; it does not mean at this moment and does not introduce
  a logical conclusion.
examples:
- Now, let's move on to the second question.
- Now then, who wants more coffee?
