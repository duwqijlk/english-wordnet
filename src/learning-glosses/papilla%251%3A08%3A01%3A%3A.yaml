simpleMeaning: A tiny bump shaped like a nipple, which helps with taste, touch, or smell
scope: A tiny bump on the tongue or skin that helps with taste, touch, or smell; not the bit of flesh
  at the root of a hair, tooth or feather, and not a tiny growth on a petal or leaf.
examples:
- The papillae of the tongue let us taste sweet and sour.
- Tiny papillae on the skin help us feel the surface.
