senseId: 'testimonial%1:10:00::'
synsetId: 06707285-n
simpleMeaning: A thing or words that speak in favour of a person or a thing, saying it is good and worth
  having.
scope: A thing or words that speak in favour of a person or a thing, saying it is good and worth having;
  also called a recommendation or a good word; not a word that has to do with giving evidence, and not
  a word that shows admiration or thanks.
examples:
- Her old boss wrote a glowing testimonial for her new job.
- The testimonial on the firm's site praised their work.
