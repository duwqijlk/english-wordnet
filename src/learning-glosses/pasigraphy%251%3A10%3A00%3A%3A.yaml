scope: A made-up language for people in any land, using signs instead of words; not a tongue that grew
  up in one place, and not a code for hiding what is said.
examples:
- She wrote the note in Pasigraphy so a friend in another land could read it.
- Pasigraphy uses signs instead of words to show ideas.
