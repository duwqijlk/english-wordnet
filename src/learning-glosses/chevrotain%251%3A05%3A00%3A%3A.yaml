simpleMeaning: a very small hornless animal like a deer that chews its food twice, from tropical Asia
  and west Africa
scope: A very small hornless animal like a deer that chews its food twice; mouse deer is another name
  for this sense, not a true deer and not a rabbit.
examples:
- The chevrotain hid in the tall grass.
- A chevrotain is smaller than a deer.
