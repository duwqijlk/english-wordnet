  a dish of clams with a tasty top.
scope: 'Also called cherrystone clam: a small clam eaten raw or cooked, not a large clam and not one eaten
  only in soup.'
examples:
- We ate cherrystones raw with lemon.
- The cherrystone was bigger than the littleneck on the plate.
