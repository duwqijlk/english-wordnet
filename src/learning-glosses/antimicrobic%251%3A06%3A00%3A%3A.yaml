simpleMeaning: something that kills tiny living things too small to see that might carry disease, such
  as heat, rays, or a chemical
scope: 'Also called antimicrobial, disinfectant, or germicide: something that kills germs that could bring
  sickness, not the adjective use that describes a substance as able to kill germs, and not a plain cleaner
  that only washes dirt away.'
examples:
- The lab used an antimicrobic to kill germs on the work tops.
- An antimicrobic spray kept the sickroom free of germs that carry disease.
