simpleMeaning: Any plant of this group with thick soft leaves and flowers that usually make sweet juice.
scope: A plant of this group with thick soft leaves and flowers that usually make sweet juice, not a cactus
  and not an orchid.
examples:
- Her hoya hung in a basket by the window.
- The hoya opened its star-shaped flowers in summer.
