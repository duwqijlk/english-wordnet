senseId: 'restriction_endonuclease%1:27:00::'
synsetId: 15029638-n
simpleMeaning: An enzyme that snips genetic material at chosen spots, leaving short pieces; it comes from
  bacteria, where it disables invading viruses, and is a basic tool of genetic engineering.
scope: One of three names for the same cutting enzyme, alongside restriction enzyme and restriction nuclease;
  it is not a general nuclease that cuts anywhere, nor the ligase that joins pieces back together.
examples:
- The researchers used a restriction endonuclease to cut the plasmid at one site.
- Each restriction endonuclease recognises a different short sequence.
