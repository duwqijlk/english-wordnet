simpleMeaning: very hard to follow or sort out, full of fine detail, and occasionally tricky or dishonest
scope: 'Also called involved: very hard to follow and full of detail, not tied up in knots like string
  or hair.'
examples:
- The rules were so tangled that no one could follow them.
- He got caught in a tangled plan full of lies and tricks.
