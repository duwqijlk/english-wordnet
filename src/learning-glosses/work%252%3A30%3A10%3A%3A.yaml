simpleMeaning: To reach a certain state slowly through repeated movement or pressure.
scope: This is not about doing a job or about a machine functioning; it describes something slowly reaching
  a state through repeated movement.
examples:
- The screw had worked loose during the long drive.
- The knot worked free as the rope was pulled.
