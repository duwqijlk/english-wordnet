simpleMeaning: a second result of something, and one that is sometimes not expected
scope: A second, sometimes not expected result of an action or event, not the main result and not a thing
  that is made while making another thing.
examples:
- A byproduct of the long meeting was that everyone felt tired.
- More traffic was a byproduct of building the new road.
