simpleMeaning: a covered way for walking, especially one that runs along the wall of a building and is
  held up by curved supports or tall posts
scope: This is a covered walking way along a building wall, not a porch outside a building, not a narrow
  raised area inside on an upper floor, and not a passage in a mine.
examples:
- Rain ran off the roof as we walked through the covered gallery along the church wall.
- The old gallery, held up by stone arches, runs the full length of the building.
