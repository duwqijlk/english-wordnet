simpleMeaning: the way of treating rubber, or stuff like rubber, with sulphur in great heat to make it
  springier and stronger or to make it hard
scope: The way of treating rubber with sulphur in great heat, also called vulcanization; not the making
  of rubber itself and not the shaping of a tyre.
examples:
- Vulcanisation makes rubber springier and stronger.
- The factory uses vulcanisation to harden rubber for tyres.
