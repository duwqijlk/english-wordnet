simpleMeaning: The stuff tapioca comes from, this powder is got by soaking and drying the root of a tropical
  plant, and it is a main food in warm lands
scope: Also called manioc, cassava and manioca, this powder comes from the root of a tropical plant and
  is the stuff tapioca comes from, unlike the root itself and unlike flour.
examples:
- Cassava starch thickened the soup.
- In warm lands, cassava starch is dried from the plant's roots.
