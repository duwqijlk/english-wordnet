senseId: 'systole%1:11:00::'
synsetId: 07416009-n
simpleMeaning: The squeezing together of the chambers of the heart, above all the ventricles, to push
  blood into the aorta and the lung artery.
scope: This is the squeezing together of the heart's chambers to push blood out, not the resting phase
  of the heartbeat and not a heart murmur.
examples:
- Systole pushed blood out of the heart.
- The doctor measured the pressure during systole.
