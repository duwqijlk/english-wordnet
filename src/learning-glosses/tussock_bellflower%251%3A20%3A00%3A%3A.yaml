simpleMeaning: A plant from Europe that lives for many years and bears blue or white blooms, growing in
  thick groups on stems that spread out.
scope: Also called a spreading bellflower, this European plant grows in thick groups with stems that spread
  out and bears blue or white blooms.
examples:
- Tussock bellflower grows in thick groups.
- The tussock bellflower bears blue blooms.
