simpleMeaning: The skill of putting thinking parts together into a machine that works with numbers, and
  the plan that shows how the parts of such a machine fit together
scope: The skill of putting thinking parts together into a machine that works with numbers, and the plan
  that shows how its parts fit together; not the machine itself and not a plan for a building.
examples:
- She studied computer architecture to learn how the parts fit together.
- Good computer architecture puts thinking parts together well.
