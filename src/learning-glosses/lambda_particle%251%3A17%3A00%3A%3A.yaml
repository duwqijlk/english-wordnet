simpleMeaning: A tiny bit of matter with no electric charge and a spin of 1, of the kind called isotopic
  spin.
scope: A tiny bit of matter with no electric charge and a spin of 1, of the kind called isotopic spin;
  lambda hyperon is another name for this sense, not a charged bit of matter and not a bit of light.
examples:
- The lambda particle has no electric charge.
- Physicists found a lambda particle in the cloud chamber.
