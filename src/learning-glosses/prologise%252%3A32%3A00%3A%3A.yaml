senseId: 'prologise%2:32:00::'
synsetId: 00904052-v
simpleMeaning: To write or say the short opening piece of a play or book
scope: To write or say the short opening piece of a play or book, also called prologize or prologuize;
  not to write the main part of a play and not to sum up a book at its end.
examples:
- He will prologise the new play on Friday.
- She agreed to prologise the poet's book.
