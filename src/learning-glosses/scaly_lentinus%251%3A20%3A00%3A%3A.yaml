simpleMeaning: It smells like licorice, this fungus with a ring on its stalk, more flakes below the ring,
  white flesh, and a cap covered in small flat flakes.
scope: A fungus with a flaky cap and a ring on its stalk, smelling of licorice, not a smooth-capped mushroom.
examples:
- The scaly lentinus had a ring on its stalk and flakes below it.
- This scaly lentinus smells like licorice.
