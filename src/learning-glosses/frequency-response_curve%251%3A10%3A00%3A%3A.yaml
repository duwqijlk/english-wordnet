simpleMeaning: How strong a signal stays at each pitch is shown by this line on paper from electronics,
  its strength set out against the pitch.
scope: Also called a frequency-response characteristic, this names the line on paper in electronics that
  shows how strong a signal stays at each pitch.
examples:
- The technician checked the frequency-response curve before the test.
- This frequency-response curve shows the speaker is weak at low pitch.
