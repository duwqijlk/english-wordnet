simpleMeaning: a plug made to block the hole in a washbasin, a bath or a similar water holder
scope: A plug that blocks the hole in a washbasin, bath or similar water holder; basin plug, bath plug
  and sink plug are other names for this sense. Not a tap and not a plug for a bottle.
examples:
- The tub stopper kept the water in the bath while she washed her hair.
- He pushed the tub stopper into the hole in the washbasin.
