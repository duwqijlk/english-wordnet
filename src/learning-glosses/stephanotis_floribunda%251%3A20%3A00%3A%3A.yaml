simpleMeaning: A twining woody climber from Madagascar, with thick dark waxy leaves that stay all year
  and big sweet-smelling waxy white flower groups on its stems, grown widely in warm places.
scope: Also called waxflower and Madagascar jasmine; a twining climber with sweet-smelling white flowers,
  not a low bush and not a flower grown only for cut stems.
examples:
- Stephanotis floribunda climbs the wall of the warm glasshouse.
- The white flowers of Stephanotis floribunda fill the room with a sweet smell.
