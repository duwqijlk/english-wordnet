simpleMeaning: a match between two things in how big they are, or how much there is of each
scope: A match in size, amount or degree between two things, not likeness in looks and not the mathematical
  mirror-image sense.
examples:
- There was a close correspondence between the size of the gift and the size of the favour.
- The correspondence in amount between what we paid and what we got was exact.
