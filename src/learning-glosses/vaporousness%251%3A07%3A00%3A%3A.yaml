simpleMeaning: cloudy air, thick with haze, mist or steam
scope: 'Also called haziness, mistiness, steaminess and vapourousness: cloud in the air from haze or mist,
  not the dark of night and not smoke from a fire.'
examples:
- The vaporousness over the lake made the far shore hard to see.
- We waited for the vaporousness to clear before we drove on.
