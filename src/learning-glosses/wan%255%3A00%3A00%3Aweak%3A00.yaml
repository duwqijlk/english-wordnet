simpleMeaning: 'Said of light: faint and not bright, giving only a weak glow.'
scope: Faint light, not a colour made lighter with white and not a person short of energy; sick and pale
  are other names for this sense.
examples:
- A wan glow came through the curtains and left the room in half-light.
- The lantern cast a wan circle on the wet stones.
