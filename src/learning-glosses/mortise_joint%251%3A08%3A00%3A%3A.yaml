simpleMeaning: A sliding join where the lower ends of the two bones of the lower leg meet the top bone
  of the foot
scope: 'Ankle, ankle joint and articulatio talocruralis are other names for this sense: a sliding join
  where the two bones of the lower leg meet the top bone of the foot, not a hinge in the knee and not
  a ball joint.'
examples:
- The mortise joint lets the foot slide as we walk.
- A sprain can hurt the mortise joint of the ankle.
