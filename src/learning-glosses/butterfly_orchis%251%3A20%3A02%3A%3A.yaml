simpleMeaning: A white lip lined with purple veins tops pale green or yellow-green flowers on this plant
  of Mexico, which grows on other plants
scope: This plant of Mexico has pale green or yellow-green flowers and a white lip lined with purple veins
  and grows on other plants; it is also called butterfly orchid, not the Mediterranean kind with usually
  purple flowers.
examples:
- The butterfly orchis grew on a tree branch.
- Pale green butterfly orchis grew on trees.
