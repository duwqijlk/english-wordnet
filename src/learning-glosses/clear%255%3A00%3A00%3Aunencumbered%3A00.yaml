simpleMeaning: 'Used especially of the legal right to own property: having no claims, charges, or restrictions
  attached that could be disputed in a court.'
scope: This is a legal word about ownership rights having no claims or restrictions that could be disputed,
  not about physical cleanliness or being easy to see.
examples:
- The lawyer confirmed that the land had a clear title before the sale went through.
- The dealer refused the trade-in until the truck's title was clear, with no outstanding loan attached.
