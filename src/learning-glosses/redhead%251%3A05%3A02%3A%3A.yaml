simpleMeaning: a North American duck that dives under water, with a grey-and-black body and a reddish-brown
  head
scope: A diving duck with a reddish-brown head, not a woodpecker and not a person with red hair.
examples:
- A redhead surfaced on the lake with a fish in its bill.
- We saw several redheads diving for food in the bay.
