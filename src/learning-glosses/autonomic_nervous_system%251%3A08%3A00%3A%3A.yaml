simpleMeaning: In animals with backbones, the part of the body's control network that runs the heart,
  the glands, and the smooth muscles, which work on their own without orders
scope: This part of the body's control network runs the heart, the glands, and the smooth muscles in animals
  with backbones, not the part a person moves on purpose.
examples:
- The autonomic nervous system keeps the heart beating without orders.
- The autonomic nervous system keeps the glands working even when he is not thinking about them.
