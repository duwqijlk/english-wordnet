simpleMeaning: The human leg joint that bends like a hinge, joining the thigh bone to the two lower leg
  bones, with a small flat bone in front to keep it safe
scope: 'Also called knee, articulatio genus, human knee, and knee joint: the bending joint in a human
  leg, not the joint in the middle of the arm and not a bend in a pipe.'
examples:
- A blow to the genu can make it hard to walk.
