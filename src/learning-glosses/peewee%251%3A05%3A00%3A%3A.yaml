simpleMeaning: Small green-brown birds of the woods in east North America that catch flies.
scope: Small green-brown woodland birds that catch flies, also called peewit, pewee and pewit, not large
  birds of open fields and not birds that hunt at night.
examples:
- A peewee sang from a high branch in the woods.
- We saw a peewee dart out to catch a fly.
