simpleMeaning: the idea that all we know comes from what we can sense, not from inner feeling or a holy
  message
scope: This is the idea that all we know comes from what we can sense, also called logical positivism,
  not a firm, sure, and dogmatic state of mind about a belief.
examples:
- She studied positivism to learn how we know things from what we can sense.
- In positivism, a claim counts as known only if it comes from what we can sense.
