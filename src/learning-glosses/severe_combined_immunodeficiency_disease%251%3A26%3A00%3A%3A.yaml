senseId: 'severe_combined_immunodeficiency_disease%1:26:00::'
synsetId: 14152294-n
simpleMeaning: A child born with this sickness has weak defence cells after a fault in one of several
  genes, catches sickness easily, and dies within a year or two unless treated.
scope: 'Also called severe combined immunodeficiency: a sickness from birth that leaves a child with weak
  defence cells, not a sickness caught later in life.'
examples:
- The baby with severe combined immunodeficiency disease caught one sickness after another.
- Severe combined immunodeficiency disease can come from a fault in a single gene.
