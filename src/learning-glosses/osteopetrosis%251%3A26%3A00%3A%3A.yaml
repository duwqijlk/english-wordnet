simpleMeaning: bones that grow too thick and hard in a family illness; in its worst form the space inside
  a bone where blood cells are made can close up
scope: 'Also called marble bones disease: an illness in which bones grow too thick, not a break or a loss
  of bone.'
examples:
- Osteopetrosis runs in her family, and her bones are far denser than normal.
- In severe osteopetrosis, the marrow space inside the bone can close up.
