simpleMeaning: a group of soldiers who ride horses, about the same size as a group of soldiers who fight
  on foot
scope: This is a set group of soldiers who ride horses, with about as many soldiers as a group of soldiers
  who fight on foot. It is not soldiers in general, and not any group of people or animals.
examples:
- The captain led his troop, a group of horse soldiers the size of a company of foot soldiers, across
  the plain.
- Each troop in the regiment had about as many horse soldiers as a company had foot soldiers.
