simpleMeaning: one of two blood tubes that run beside arteries of the same name carrying blood to the
  hip and upper leg
scope: One of two blood tubes running beside arteries of the same name that serve the hip and thigh; vena
  circumflexus femoris is another name for this sense, not the artery of the same name and not a blood
  tube of the lower leg.
examples:
- The circumflex femoral vein carries blood from the thigh.
- The surgeon tied off a circumflex femoral vein during the operation.
