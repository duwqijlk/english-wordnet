simpleMeaning: Water that flows over flat land by a river or in the bed of a river lays down this rich,
  fine ground.
scope: Water flowing over flat land by a river or in a river bed lays down this rich, fine ground; it
  is not ground laid down by wind.
examples:
- The river left alluvial soil over the flat land.
- The alluvial soil felt fine and rich underfoot.
