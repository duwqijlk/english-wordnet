simpleMeaning: To sink or hang downward under a weight or when it has gone loose
scope: Also called flag and droop; to fall or settle lower under pressure or slackness, not to stand firm.
examples:
- The old mattress began to sag in the middle.
- Her shoulders sagged with tiredness after the long walk.
