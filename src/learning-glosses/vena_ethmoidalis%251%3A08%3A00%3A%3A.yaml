simpleMeaning: Emptying into the vein above the eye, veins drain the small air spaces in the bone between
  the eyes.
scope: Also called ethmoidal vein, these veins drain the small air spaces in the bone between the eyes
  and empty into the vein above the eye.
examples:
- The vena ethmoidalis drains the air spaces between the eyes.
- Blood from the ethmoid sinuses leaves through the vena ethmoidalis.
