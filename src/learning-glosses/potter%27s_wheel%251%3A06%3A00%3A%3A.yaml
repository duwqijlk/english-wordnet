simpleMeaning: A flat round plate that turns round and round, holding the clay that a pot maker is shaping
scope: This is a flat round plate that turns round and round, holding the clay a pot maker is shaping,
  not a wheel for moving things and not a grinding wheel.
examples:
- The potter's wheel spun fast as she shaped the bowl.
- He learned to centre the clay on the potter's wheel.
