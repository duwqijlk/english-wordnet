simpleMeaning: The raised threads on the surface of a fabric such as a rug, velvet, or corduroy.
scope: The raised thread surface of a woven fabric, not a heap of things and not the soft short hair of
  an animal; nap is another name for this sense.
examples:
- The pile of the velvet was flattened where the book had rested.
- She brushed the rug's pile in one direction so the color looked even.
