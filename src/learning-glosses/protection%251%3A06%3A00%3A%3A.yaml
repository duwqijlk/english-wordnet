simpleMeaning: A cover or shield that keeps something safe from damage or injury.
scope: This sense is not the act of keeping someone or something safe, but the physical cover or shield
  itself.
examples:
- Always wear eye protection when you use the drill.
- The hikers applied sun protection before setting out.
