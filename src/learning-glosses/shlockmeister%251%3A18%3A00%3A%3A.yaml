simpleMeaning: In slang, a seller who deals in poor or low-grade goods
scope: In slang, a seller who deals in poor or low-grade goods, also called a schlockmeister; not an honest
  trader and not a maker of goods.
examples:
- The shlockmeister sold cheap coats that fell apart.
- People called him a shlockmeister for his shoddy goods.
