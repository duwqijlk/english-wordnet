simpleMeaning: a clear part in the eye, curved out on both sides, behind the coloured part, that with
  the front of the eye helps focus light at the back
scope: This is the clear part inside the eye, not a glass piece used in a camera or glasses, and not equipment
  that focuses a beam of electrons.
examples:
- The lens in her eye helps to focus light.
- A problem with the lens can make a person's sight less clear.
