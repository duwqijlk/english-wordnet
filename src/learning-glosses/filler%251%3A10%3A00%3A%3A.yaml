simpleMeaning: written pieces put in the empty space between more important pieces in a magazine or newspaper
scope: Writing put in the empty space between more important pieces in a magazine or newspaper; not the
  material used to fill cracks or holes in a surface.
examples:
- The editor used a short filler to fill the empty space on the page.
- This filler is a short piece about cooking, placed between two long news stories.
