simpleMeaning: a sudden taking of power from a government by force or against the law
scope: A sudden change of government by force or against the law, not a clever move that wins something
  and not a battle between armies.
examples:
- The generals staged a coup and took over the country.
- After the coup, the old leaders were sent to prison.
