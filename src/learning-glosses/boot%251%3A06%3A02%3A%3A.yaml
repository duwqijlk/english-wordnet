simpleMeaning: An instrument for torturing a person, in which the foot and leg are held and then crushed
  or heated.
scope: This is the torture device itself (iron boot and iron heel are other names), not the act of foot
  torture or a boot worn on the foot.
examples:
- The museum has an iron boot that was once used to crush a prisoner's foot.
- Guards tightened the boot around his leg until he could not move.
