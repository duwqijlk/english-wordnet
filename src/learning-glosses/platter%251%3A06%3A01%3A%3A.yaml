simpleMeaning: a round disk with one long groove that plays music when a needle runs in it as it turns
scope: 'Also called a record, a disk, or a disc: a grooved disk that plays music under a needle, not a
  large dish for serving food.'
examples:
- He put a platter on the turntable.
- The old platter crackled as the needle moved through the groove.
