simpleMeaning: In the marines, this rank is one step up from the next rank below it, and the person who
  holds it is not a commissioned officer
scope: A marine rank one step above staff sergeant, not a commissioned officer and not an army rank.
examples:
- The gunnery sergeant inspected the new recruits at dawn.
- After ten years of service, she was promoted to gunnery sergeant.
