simpleMeaning: An enemy's powered tools and set-ups stop working when waves of energy are sent out or
  thrown back on purpose to block them
scope: This action, also called jam and jamming, blocks an enemy's use of powered tools and set-ups by
  sending out or throwing back waves of energy.
examples:
- Electronic jamming stopped the enemy's radios from working.
- The army used electronic jamming to block the other side's signals.
