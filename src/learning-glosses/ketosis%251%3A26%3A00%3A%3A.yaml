senseId: 'ketosis%1:26:00::'
synsetId: 14290707-n
simpleMeaning: As in diabetes, too many ketone bodies, small parts made from fat, can build up in the
  blood
scope: A rise in the level of ketone bodies in the blood, also called acetonemia and ketonemia, not a
  normal change in blood sugar and not the illness diabetes itself.
examples:
- The doctor found ketosis in her blood tests after her diabetes got out of control.
- Ketosis can make a person feel sick when too many ketone bodies build up in the blood.
