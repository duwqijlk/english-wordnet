simpleMeaning: sticky hairy leaves and yellow-brown flowers mark this poisonous bad-smelling herb of the
  Old World, which yields the chemicals hyoscyamine and scopolamine
scope: Also called henbane and stinking nightshade; a poisonous bad-smelling herb with sticky leaves and
  yellow-brown flowers, not the harmless nightshades grown for food.
examples:
- Black henbane grows by the old wall, its leaves sticky and hairy.
- Do not eat black henbane; it is poisonous.
