simpleMeaning: money borrowed for one's own use that sets up credit for the buyer, most often with no
  security and resting on the borrower's honesty and power to pay
scope: 'Also called a consumer loan: money borrowed for one''s own use, most often with no security and
  resting on the borrower''s honesty and power to pay, not a loan for a business and not a loan against
  a house.'
examples:
- She took out a personal loan to buy a car.
- The bank granted him a personal loan on his good record.
