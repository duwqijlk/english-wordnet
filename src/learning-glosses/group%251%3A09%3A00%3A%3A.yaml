simpleMeaning: In mathematics, a collection whose combining rule never takes you outside it, works the
  same however items are bracketed, has a do-nothing item, and lets each item be undone.
scope: Unlike the everyday noun for any collection, the chemistry noun for atoms joined in a molecule,
  and the two verbs for arranging or gathering things, this is the mathematical structure fixed by its
  combining rule.
examples:
- In algebra class we showed that the integers under addition form a group.
- The teacher asked whether the rotations of a square form a group.
