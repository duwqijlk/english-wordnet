simpleMeaning: A tiny one-celled living thing, without a shell, living in fresh water, the sea, or inside
  other living things, pushing out short arms for a time to feed and move.
scope: A tiny one-celled living thing, also called ameba, that pushes out short arms to feed and move.
examples:
- An amoeba moves by pushing out part of its body.
- The pond water was full of amoebas.
