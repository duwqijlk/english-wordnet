simpleMeaning: having something laid over it, spread on it, placed on top of it, or closed in around it,
  and sometimes used as part of a compound word.
scope: This describes a thing that has something over it, not the act of putting that thing there.
examples:
- The walls were covered in posters.
- Keep the food covered until dinner.
