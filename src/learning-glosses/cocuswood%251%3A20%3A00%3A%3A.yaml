simpleMeaning: the hard stuff of the granadilla tree, used for music makers, above all clarinets
scope: This is the hard stuff of a granadilla tree, used for music makers; cocoswood and granadilla wood
  are other names for this sense, and it is not the tree itself or wood used for building.
examples:
- The maker shaped the cocuswood into a clarinet body.
- Cocuswood gives the clarinet a clear, steady tone.
