simpleMeaning: to become greater in power or force
scope: About a person, body or thing getting more power on its own, not about making another person or
  thing stronger, and not about making a feeling firmer.
examples:
- His body strengthened after weeks of rest and good food.
- The wind strengthened through the night and shook the trees.
