simpleMeaning: made to work with no liquid inside it, or made to work without using liquid at all
scope: This is about a device that works with no liquid in it, not one that uses water or another liquid
  to work.
examples:
- The aneroid barometer measures air pressure without any liquid inside.
- An aneroid gauge works by metal parts, not by liquid.
