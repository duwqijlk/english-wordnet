simpleMeaning: A make-believe air-like stuff whose tiny pieces are so small they hardly count and push
  or pull each other not at all.
scope: A make-believe air-like stuff whose tiny pieces hardly count and push or pull each other not at
  all, also called an ideal gas, not a real air-like stuff and not a liquid.
examples:
- In the lesson a perfect gas helped us work out the sums.
- A perfect gas is only a model, not a real stuff.
