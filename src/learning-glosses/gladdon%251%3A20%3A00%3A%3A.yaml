simpleMeaning: In the south and west of Europe and in North Africa grows a plant of the iris kind with
  purple flowers and leaves that smell bad.
scope: Also called a gladdon iris, a roast beef plant, a stinking gladwyn, or a stinking iris, this iris
  grows in the south and west of Europe and in North Africa.
examples:
- Purple flowers opened on the gladdon.
- The gladdon smelled bad when we brushed past its leaves.
