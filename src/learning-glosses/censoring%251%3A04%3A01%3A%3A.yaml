simpleMeaning: work to stop an enemy getting useful facts, done by banning or taking out any information
  that could help the enemy
scope: 'Also called censorship: stopping an enemy from getting useful information by banning it or taking
  it out. Not the other sense of taking parts out of printed things, letters, or stage plays.'
examples:
- Wartime censoring kept ship times out of the papers to hide them from the enemy.
- The army used censoring to stop letters giving away secret plans to the enemy.
