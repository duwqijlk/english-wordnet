simpleMeaning: At times on purpose, as in treating some kinds of cancer, the body's heat rises far above
  what is normal
scope: A body far too hot, also called hyperthermia, not a fever from illness and not warmth from a hot
  day.
examples:
- Hyperthermy set in after hours in the sun.
- The clinic used hyperthermy as part of the cancer treatment.
