simpleMeaning: a health problem in which part of the body does not have a normal shape
scope: Also called deformity, this is a part of the body in a wrong shape, not a cut or a hurt in a part
  that has a normal shape.
examples:
- The baby was born with a malformation in one foot.
- Doctors can fix some malformations with an operation.
