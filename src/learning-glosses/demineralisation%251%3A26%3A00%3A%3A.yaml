simpleMeaning: an unhealthy loss of the salt-like minerals in the body, most of all from the bones
scope: This is an unhealthy loss of salt-like minerals from the body, most of all from the bones; demineralization
  is another name for this sense, not the removal of minerals from water and not a healthy loss of weight.
examples:
- Her demineralisation made her bones weak and easy to break.
- The doctor said his demineralisation came from a lack of key minerals in his food.
