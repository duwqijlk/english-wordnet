simpleMeaning: a cart that you push along on one or more wheels, holding its handles, to move small loads
  from place to place
scope: 'Also called a wheelbarrow: a cart you push by hand, not a heap of earth over a grave and not the
  amount a cart holds.'
examples:
- He pushed the barrow full of soil across the garden.
- She loaded the barrow with bricks and wheeled it to the wall.
