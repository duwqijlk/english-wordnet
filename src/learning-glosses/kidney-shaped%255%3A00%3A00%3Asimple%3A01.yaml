simpleMeaning: A leaf or a bean with a round form that curves in at one side, like the organ that cleans
  the blood
scope: A leaf or bean whose outline curves in at one side, not a round leaf and not a long thin leaf.
examples:
- The kidney-shaped leaves grew in pairs along the stem.
- She picked kidney-shaped beans from the garden.
