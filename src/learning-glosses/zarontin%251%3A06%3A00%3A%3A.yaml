simpleMeaning: A drug that stops fits, used to treat petit mal epilepsy, a form of epilepsy with brief
  spells of not noticing things, also sold as Emeside.
scope: Also called ethosuximide or Emeside; a drug that stops fits, used to treat petit mal epilepsy,
  not a drug for grand mal fits or for pain.
examples:
- The doctor prescribed Zarontin for her petit mal epilepsy.
- Zarontin stopped the brief spells.
