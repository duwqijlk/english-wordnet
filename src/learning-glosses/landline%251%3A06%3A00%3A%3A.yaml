simpleMeaning: a telephone line that sends calls over land, through a wire or another fixed link
scope: This is the line that sends calls over land through a wire or another fixed link, not a mobile
  phone and not the phone set itself.
examples:
- The workers cut the landline while they were digging up the road.
- The landline went dead during the storm, so she used her mobile phone.
