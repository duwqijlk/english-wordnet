simpleMeaning: A fried round piece made from flaked sea food and mashed potatoes.
scope: A fried round piece of flaked sea food and mashed potato; fish cake is another name for this sense,
  not the seasoned balls of ground fish simmered in stock, and not a plain potato cake.
examples:
- We fried fish balls with mashed potatoes for supper.
- The fish ball was crisp outside and soft inside.
