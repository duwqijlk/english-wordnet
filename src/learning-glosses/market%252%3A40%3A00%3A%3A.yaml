simpleMeaning: to take part in promoting, selling, or distributing a product as a business
scope: This is not trading goods at a public market, buying household supplies, or making something commercial,
  but actively promoting and selling a product.
examples:
- They market the app to schools across Europe.
- The brand markets its snacks as a healthy choice.
