simpleMeaning: a low-lying South African plant that lives for years, with short stems thick with leaves
  and orange flower rays marked with black eye-like spots at the base
scope: A low South African plant with orange flower rays, not a daisy grown for cutting and not a sunflower.
examples:
- The treasure flower opened its orange rays in the sun.
- Treasure flowers spread low across the rock garden.
