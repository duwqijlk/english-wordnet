simpleMeaning: A sour thing with only one hydrogen part in each tiny bit of it that can be swapped for
  something else
scope: A sour thing with only one hydrogen part in each tiny bit that can be swapped, not an acid with
  two such parts.
examples:
- Hydrochloric acid is a monobasic acid.
- In the test, the monobasic acid gave up only one hydrogen part.
