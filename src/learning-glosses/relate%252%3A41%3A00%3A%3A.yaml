simpleMeaning: to have a link with a person or thing, or to make such a link
scope: This is having or making a link with a person or thing, not the sense where two things are simply
  linked to each other.
examples:
- She relates well to the other students in her class.
- He finds it hard to relate to people who are much older than him.
