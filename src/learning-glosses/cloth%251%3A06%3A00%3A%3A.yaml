simpleMeaning: a human-made sheet of fibers, formed by weaving, matting, knitting or crocheting natural
  or man-made strands
scope: The textile substance itself, another name for 'material'; not clothing, nor a single piece cut
  for wiping.
examples:
- Cloth was sold by the metre in the old market.
- This cloth is too thin for a winter coat.
