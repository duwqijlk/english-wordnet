simpleMeaning: Often grown as a hedge, this South African bush bears forked sharp points and round soft
  fruit.
scope: It is also called hedge thorn, and unlike the very large kind with bright green spines, it is a
  South African bush often grown as a hedge.
examples:
- The natal plum was grown as hedging.
- The natal plum bore round soft fruit.
