simpleMeaning: steps taken in advance to guard against stealing, spying, or deliberate damage, and similar
  threats
scope: This is not an alarm device or a financial document; these are the precautions themselves.
examples:
- The embassy tightened security after the protest outside its gates.
- Good security means locking the server room and checking who enters.
