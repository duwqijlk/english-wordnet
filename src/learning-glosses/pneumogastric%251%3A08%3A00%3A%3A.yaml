simpleMeaning: A nerve running from the head down to the belly, joining the stomach, food pipe, heart,
  lungs, voice box, throat, and most belly organs, with signals moving both ways
scope: 'Also called nervus vagus, pneumogastric nerve, tenth cranial nerve, vagus, vagus nerve, and wandering
  nerve: a nerve that runs from the head down to the belly organs, not a nerve of the arm and not one
  that works only one part.'
examples:
- The pneumogastric nerve reaches from the throat down to the stomach.
- Damage to the pneumogastric can slow the heart and upset the stomach.
