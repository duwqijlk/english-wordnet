simpleMeaning: the look or feel of a surface, made to look good, or the material put on a surface to give
  it that look or feel
scope: 'Also called finish: the look or feel of a surface, or the material that gives it, not the act
  of ending or completing something.'
examples:
- The finishing on the table felt smooth and looked shiny.
- He put a clear finishing on the wood to give it a pleasing look.
