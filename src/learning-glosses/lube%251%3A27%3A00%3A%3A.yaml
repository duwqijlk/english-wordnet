senseId: 'lube%1:27:00::'
synsetId: 14914810-n
simpleMeaning: something you put on parts that rub together, so they move smoothly and do not rub hard
  against each other
scope: 'Also called lubricant, lubricating substance, and lubricator: a thing put on moving parts so they
  slide easily; it is not a fuel and not a glue.'
examples:
- He put some lube on the bike chain so it would run smoothly.
- A little lube stopped the metal parts from rubbing hard against each other.
