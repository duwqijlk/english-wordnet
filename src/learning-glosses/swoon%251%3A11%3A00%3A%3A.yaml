senseId: 'swoon%1:11:00::'
synsetId: 07493458-n
simpleMeaning: a sudden time when a person stops knowing what is around them, because too little blood
  reaches the brain
scope: 'Also called a faint: a sudden passing out because too little blood reaches the brain, not a feeling
  of great love or joy.'
examples:
- The heat caused her to fall in a swoon at the door.
- He dropped to the floor in a swoon and woke a minute later.
