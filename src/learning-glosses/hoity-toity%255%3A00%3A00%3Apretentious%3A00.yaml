simpleMeaning: putting on grand, fine manners to look important, in a proud and scornful way
scope: This is proud, put-on fine behaviour; hifalutin, highfalutin, grandiose, highfaluting and la-di-da
  are other names for this sense, not plain pride and not real good manners.
examples:
- Her hoity-toity airs put off the other guests.
- He spoke in a hoity-toity voice about his grand house.
