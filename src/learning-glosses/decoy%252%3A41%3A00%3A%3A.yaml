senseId: 'decoy%2:41:00::'
synsetId: 02583840-v
simpleMeaning: to draw a person or animal into danger or a trap, with a thing used for drawing them in
  or in a way like using one
scope: The act of drawing a person or animal into a trap. It is not the thing used to draw them, and not
  a person who leads someone into danger.
examples:
- They decoyed the ducks into the net with food.
- He decoyed the fox toward the trap.
