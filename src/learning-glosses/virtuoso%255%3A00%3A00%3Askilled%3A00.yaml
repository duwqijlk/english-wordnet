simpleMeaning: having, or showing, the highest level of skill and control
scope: 'Also called consummate, masterful and masterly: this describes someone or something that shows
  the highest skill. It is not the noun that names a musician with great skill and art.'
examples:
- She gave a virtuoso performance on the piano.
- His virtuoso playing made the hard piece look easy.
