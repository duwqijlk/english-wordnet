simpleMeaning: With one's forehead wrinkled, to wear an angry, gloomy look, as if to show disapproval.
scope: Also called lower, frown, or glower, to look angry and gloomy with a wrinkled forehead, as if to
  show disapproval.
examples:
- He loured at the news.
- She loured, her forehead wrinkled in disapproval.
