simpleMeaning: An honorary American group of scientists set up by President Lincoln while the American
  Civil War was being fought
scope: An honorary American group of scientists set up by President Lincoln in the Civil War; its nearest
  rivals are the National Institutes of Health and other learned societies of the United States.
examples:
- The National Academy of Sciences chose her as a member for her work in chemistry.
- He was elected to the National Academy of Sciences after years of research.
