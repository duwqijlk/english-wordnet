simpleMeaning: Thrown at full speed, the fastest ball a pitcher can send to the batter in baseball.
scope: In baseball, the fastest ball a pitcher can throw, also called smoke, a bullet, a heater, or a
  fastball, not a singer who hums a tune.
examples:
- The pitcher threw a hummer past the batter.
- He could not catch up with the hummer and struck out.
