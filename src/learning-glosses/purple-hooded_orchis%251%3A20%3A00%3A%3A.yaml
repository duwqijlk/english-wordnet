simpleMeaning: a North American plant with a spike of violet-purple flowers mixed with white, whose outer
  flower parts join to make a hood
scope: 'Also called purple orchis and showy orchis: a North American orchid with violet-purple flowers
  in a spike and a hood over them, not a common garden orchid and not a wildflower with single blooms.'
examples:
- The purple-hooded orchis grew in the damp woods of the north.
- Its purple-hooded orchis flowers were violet and white, with a hood over each bloom.
