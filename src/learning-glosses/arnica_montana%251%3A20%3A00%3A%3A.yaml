simpleMeaning: A herb of pasture and open woods in most of Europe and western Asia, with orange-yellow
  daisylike flower heads used when dried to stimulate and treat bruises and swellings.
scope: A herb of pasture and open woods in most of Europe and western Asia, whose dried orange-yellow
  daisy-like heads are used as a stimulant and for bruises and swellings.
examples:
- Arnica montana grew in the open pasture above the village.
- Dried Arnica montana heads were used on the bruise.
