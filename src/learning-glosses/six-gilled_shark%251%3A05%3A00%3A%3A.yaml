simpleMeaning: a big, old kind of fish found in warm seas in many parts of the world
scope: A big, old kind of fish found in warm seas in many parts of the world, also called a cow shark;
  not a small reef fish and not a deep-sea fish.
examples:
- The divers saw a six-gilled shark gliding past the reef.
- A six-gilled shark can grow very large in warm seas.
