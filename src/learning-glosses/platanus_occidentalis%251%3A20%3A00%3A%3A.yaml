simpleMeaning: A very big plane tree with wide branches, growing in the east and middle of North America
  as far as Mexico.
scope: Also called buttonwood, American plane, and American sycamore; a very big plane tree of the east
  and middle of North America, not a small tree and not a tree of Europe.
examples:
- A Platanus occidentalis shades the whole yard with its wide branches.
- Platanus occidentalis grows from the east of North America down to Mexico.
