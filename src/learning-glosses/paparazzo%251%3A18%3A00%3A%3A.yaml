senseId: 'paparazzo%1:18:00::'
synsetId: 10416426-n
simpleMeaning: A photographer working on their own who chases famous people to take natural, unposed pictures
  of them to sell to papers or magazines.
scope: A photographer working on their own who chases famous people for unposed pictures to sell, not
  a photographer hired by a paper.
examples:
- A paparazzo waited outside the hotel for the star.
- The paparazzo snapped pictures as she left the car.
