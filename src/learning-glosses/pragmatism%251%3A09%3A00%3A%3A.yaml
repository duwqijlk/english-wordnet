simpleMeaning: In philosophy, the idea that meaning, knowledge, and value are judged by the real results
  of using an idea in practice
scope: This is a set of ideas in philosophy about judging truth and value by real results, not just the
  everyday sense of taking life as it is and being practical.
examples:
- He studied pragmatism in his philosophy class and liked its focus on real results.
- Pragmatism teaches that an idea should be judged by what happens when people use it.
