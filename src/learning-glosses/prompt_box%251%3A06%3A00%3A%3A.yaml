simpleMeaning: a small room that sticks up from the floor at the front of a stage, where the person who
  whispers forgotten lines sits, and that opens toward the actors
scope: A small room at the front of a stage where the person who whispers forgotten lines sits; also called
  prompter's box; not the place where the band sits, and not a seat in the front row.
examples:
- The prompt box stuck up from the floor at the front of the stage.
- From the prompt box she whispered the next line to the actor.
