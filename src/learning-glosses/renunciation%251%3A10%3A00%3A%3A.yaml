senseId: 'renunciation%1:10:00::'
synsetId: 07269262-n
simpleMeaning: An act, in words or in writing, that declares something is given up or no longer owned.
scope: An act, in words or in writing, that declares something is given up or no longer owned, not the
  giving up of a possession, a right, a title, a privilege, or the like, not the state of having left
  one's faith for a party or a cause, often for beliefs one once opposed, and not rejecting, disowning,
  or saying a thing is not valid.
examples:
- Their renunciation of the throne shocked the whole country.
- They made a public renunciation of their claim to the estate.
