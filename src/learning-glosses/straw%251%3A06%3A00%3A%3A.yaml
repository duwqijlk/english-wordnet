simpleMeaning: a thin tube of paper or plastic, used to draw a drink up into the mouth
scope: This is a thin tube for drinking, not dry plant stems used for weaving or feed and not a pale yellow
  colour.
examples:
- She drank her milkshake through a straw.
- The child sipped juice with a straw.
