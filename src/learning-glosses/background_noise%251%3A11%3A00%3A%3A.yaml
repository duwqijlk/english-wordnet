simpleMeaning: Extra noise that spoils sound measurements and cannot be separated from the desired signal.
scope: Also called ground noise, this is the extra sound that gets into a sound reading and cannot be
  kept apart from the sound you want to hear.
examples:
- Background noise spoilt the sound reading, and it could not be kept apart from the wanted sound.
- They could not take the background noise out of the tape.
