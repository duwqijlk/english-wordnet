simpleMeaning: pleasing because it is old in style, but not always truly from the past
scope: Old in style in a pleasing way, not the other sense of very strange or odd to look at.
examples:
- They stayed in a quaint village with small stone houses and narrow streets.
- She wore a quaint dress in the style of a hundred years ago.
