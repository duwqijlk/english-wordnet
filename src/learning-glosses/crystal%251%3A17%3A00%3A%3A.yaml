simpleMeaning: a hard stone that forms when a stuff turns solid, with the same small pattern all through
  it and flat sides on the outside
scope: A hard stone with flat sides and a set pattern all through it, not a small part used in radios
  and other machines, not clear glass, and not just any hard solid made from a chemical.
examples:
- The crystal in the cave had flat sides and a set pattern all through it.
- A large crystal with flat sides sat on the shelf in the rock shop.
