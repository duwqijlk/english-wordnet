simpleMeaning: the act of cutting into body tissue or an organ, especially by a surgeon during an operation
scope: A surgical cut into tissue, not a part of a whole, a fruit segment, or a group of instruments.
examples:
- The surgeon made a section through the tissue to reach the growth.
- The operation involved a section through the abdominal wall.
