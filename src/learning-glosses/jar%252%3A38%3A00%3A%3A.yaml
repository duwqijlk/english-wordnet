simpleMeaning: to move, or to make a thing move, with a sudden hard shake
scope: 'Also called jolt: to move, or to make a thing move, with a sudden hard shake, not a round pot
  used to keep food in and not the amount that fills such a pot.'
examples:
- The bus jarred over the rough road.
- The sudden stop jarred the passengers.
