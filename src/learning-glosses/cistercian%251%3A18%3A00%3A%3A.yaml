simpleMeaning: A monk of an order known for plain living and a vow of silence.
scope: This is a monk of an order known for plain living and a vow of silence; Trappist is another name
  for this kind of monk, not a monk of an order that talks freely and not a monk known for rich living.
examples:
- The Cistercian monks keep silence for much of the day.
- A young Cistercian joined the abbey last year.
