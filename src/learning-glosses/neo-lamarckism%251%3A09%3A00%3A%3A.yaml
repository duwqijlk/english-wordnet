senseId: 'neo-lamarckism%1:09:00::'
synsetId: 06120205-n
simpleMeaning: A new form of Lamarck's theory that gives weight to the world around living things in changes
  passed down, keeping the thought that traits gained in life are passed on.
scope: This is a theory of how life changes, not the old Lamarck theory itself; it has no other name in
  this set.
examples:
- Neo-Lamarckism gives weight to the world around living things.
- Neo-Lamarckism keeps the thought that traits gained in life are passed on.
