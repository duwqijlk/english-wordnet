simpleMeaning: working against something to weaken it or make its effect less strong
scope: Working against something to weaken it or make its effect less strong, not something that helps
  it and not something that has no effect at all.
examples:
- The counteractive drug reduced the poison's effect.
- Her counteractive measures softened the blow of the new tax.
