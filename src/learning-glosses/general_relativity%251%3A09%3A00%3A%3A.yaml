simpleMeaning: A wider form of the earlier theory of fast-moving things that also takes in gravity, built
  on the idea that being pulled down feels the same as speeding up.
scope: This is a wider form of the earlier theory of fast-moving things that also takes in gravity; general
  relativity theory and general theory of relativity are other names for this sense, not the narrower
  theory that leaves gravity out and not Newton's old law of gravity.
examples:
- General relativity says gravity bends time and space.
- Einstein's general relativity changed how we see gravity.
