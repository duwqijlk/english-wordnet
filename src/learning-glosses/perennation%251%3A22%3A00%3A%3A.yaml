simpleMeaning: the way a plant lives on through a number of years
scope: The way a plant lives on through a number of years; not a plant that lives for one year only and
  not a plant that must be sown again each year.
examples:
- Perennation lets the plant flower again each year.
- The perennation of the shrub surprised the gardener.
