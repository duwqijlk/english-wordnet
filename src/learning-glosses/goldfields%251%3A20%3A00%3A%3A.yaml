simpleMeaning: A small slender woolly plant that lives one year, with very narrow paired leaves and single
  yellow flower heads; native from southwestern Oregon to Baja California and Arizona, often cultivated.
scope: The low woolly plant with golden flower heads; not a gold-mining area or anything made of the metal.
examples:
- Goldfields turn the spring grassland bright yellow.
- Gardeners sow goldfields for a splash of colour in dry borders.
