simpleMeaning: A food stuff found in fresh fruit, above all in sour fruit like oranges, and in vegetables;
  it keeps people free of a sore-mouth illness.
scope: This is the vitamin in fresh fruit that stops scurvy, also called ascorbic acid and vitamin C,
  not the element, not the speed of light, and not a letter.
examples:
- Eat fruit rich in C to stay free of scurvy.
- Oranges give you plenty of C.
