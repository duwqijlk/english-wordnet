simpleMeaning: A local infection that appears where a person is inoculated with cowpox virus to protect
  against smallpox. It normally lasts three weeks and leaves a pitted scar.
scope: This is the reaction a person gets at the inoculation site; vaccina and vaccinia are other names
  for it, and it is not the mild skin disease of cattle.
examples:
- The case notes describe a variola vaccina that took three weeks to heal.
- A pitted scar showed where the variola vaccina had formed.
