simpleMeaning: Two places to sit and an axle set low are what this small open vehicle has
scope: 'Also called ponycart and donkey cart: a small open vehicle with an axle set low and two places
  to sit, not a wagon for carrying goods and not a carriage with a roof.'
examples:
- The farmer drove his pony cart to market.
- Two children rode in the pony cart.
