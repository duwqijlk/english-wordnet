simpleMeaning: a small mass of cells shaped like a thimble, covering and guarding the growing tip of a
  plant's underground part
scope: A small mass of cells shaped like a thimble, covering the growing tip of a plant's underground
  part; not the tip itself, and not the hairs that take in water.
examples:
- The root cap shields the tip as it pushes through the soil.
- Damage to the root cap slows the plant's growth.
