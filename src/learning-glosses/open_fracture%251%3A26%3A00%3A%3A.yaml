simpleMeaning: A break in a bone where the soft flesh is torn or the skin is cut through.
scope: A break in a bone where the soft flesh is torn or the skin is cut through, also called compound
  fracture; not a break where the skin stays whole and not a break in soft flesh alone.
examples:
- The fall left him with an open fracture.
- An open fracture needs care at once.
