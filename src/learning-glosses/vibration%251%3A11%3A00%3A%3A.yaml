simpleMeaning: In physics, a value that moves up and down in a set pattern around a middle point, over
  and over.
scope: In physics, a value moving up and down in a set pattern around a middle point, not the act of shaking
  and not a feeling sensed in a moment.
examples:
- The vibration of the string stays steady around its middle point.
- Scientists measured the vibration of the air in the tube.
