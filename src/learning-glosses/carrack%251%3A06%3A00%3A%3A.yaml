simpleMeaning: A large ship with sails, called a galleon, used in the Mediterranean Sea to carry goods
  for buying and selling
scope: This is a large ship with sails used for trade in the Mediterranean Sea, not a warship and not
  a ship that carries only people.
examples:
- The carrack carried spices and cloth across the Mediterranean Sea.
- A carrack was a large ship with high sides and many sails.
