simpleMeaning: used for a happy event that marks a special day or a success
scope: This says a thing is for a happy event for a special day or success; not sad, not for work as usual,
  and not the event itself.
examples:
- They opened a celebratory bottle after the win.
- A celebratory cake was brought out for her birthday.
