simpleMeaning: a small whale that lives in the Arctic sea; the male has a long tooth, twisted round and
  round, made of ivory (a hard white material)
scope: 'Also called narwal and narwhale: this small whale with one long twisted tooth, not any other kind
  of whale.'
examples:
- A narwhal swam under the ice in the far north.
- The male narwhal has a very long tooth.
