simpleMeaning: A tool that measures how dense a thing is, or its weight compared with water
scope: A tool that measures how dense a thing is, also called densitometer; not a scale that only weighs
  things and not a tool for measuring size.
examples:
- The densimeter showed the liquid was denser than water.
- She used a densimeter to check the acid.
