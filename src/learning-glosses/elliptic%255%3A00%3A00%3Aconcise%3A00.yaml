simpleMeaning: Describes speech or writing that leaves out much, saying a lot in very few words.
scope: Describes speech or writing that leaves out much, also called elliptical; not plain long speech
  and not confused speech.
examples:
- The dialogue is elliptic and full of dark hints.
- The explanation was elliptic, even to the verge of obscurity.
