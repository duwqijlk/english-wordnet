simpleMeaning: a fighting weight group between the middleweight group and the top weight group
scope: A fighting weight group above the middleweight group and below the top weight group; not the wider
  group that runs up to the super heavyweight group and not the middleweight group itself.
examples:
- He moved up to light heavyweight after two years at middleweight.
- The light heavyweight title fight drew a huge crowd.
