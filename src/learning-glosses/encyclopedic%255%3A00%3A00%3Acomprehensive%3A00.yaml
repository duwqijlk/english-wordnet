senseId: encyclopedic%5:00:00:comprehensive:00
synsetId: 00529920-s
simpleMeaning: covering a very wide range, or covering all the main parts of a subject
scope: 'Also called encyclopaedic: this describes something that covers a very wide range, not a book
  of facts itself and not knowledge of only one narrow subject.'
examples:
- She has encyclopedic knowledge of birds from all over the world.
- The book gives an encyclopedic account of life in the old town, covering art, work, food and history.
