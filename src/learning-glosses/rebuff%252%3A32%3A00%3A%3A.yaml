simpleMeaning: to say no to someone or something fully and in a sharp, direct way
scope: 'Also called repel and snub: to say no in a sharp, direct way, not the noun sense of a rude act
  that shows anger or a lack of respect.'
examples:
- She rebuffed his offer to help and told him to leave.
- The mayor rebuffed the plan in a short, sharp reply.
