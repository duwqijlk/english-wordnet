simpleMeaning: a written list that shows, item by item, the money owed for goods sent or work done
scope: A written list of money owed, also called a bill or an account, not a receipt and not a price list.
examples:
- Please send me the invoice so I can pay what I owe.
- The invoice lists each box that was sent and its price.
