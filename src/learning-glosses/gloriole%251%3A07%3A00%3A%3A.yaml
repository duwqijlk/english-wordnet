simpleMeaning: In a picture, bright light is shown as a ring around the head of a holy person
scope: A ring of bright light drawn around a saint's head, also called aura, aureole, glory, halo and
  nimbus, not a crown and not light from the sun.
examples:
- The gloriole around the saint's head glowed gold in the painting.
- The artist painted a gloriole above the saint.
