simpleMeaning: Half of one hundredth of the modern one away, this length is as long as a free seconds
  pendulum, set out by Tito Livio Burattini in 1675.
scope: Also called catholic meter, metro cattolico, universal meter and universal metre, this length sits
  half of one hundredth of the modern one away, not the modern metre itself.
examples:
- The catholic metre was as long as a free seconds pendulum.
- Burattini set out the catholic metre in 1675.
