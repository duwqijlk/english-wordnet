simpleMeaning: the outer skin that guards what will grow inside the small hard part of a flowering plant
scope: This is the outer skin that guards what will grow inside; episperm and testa are other names for
  this sense. Not the soft white part inside and not the fruit that holds the seed.
examples:
- The seed coat split open when the young plant began to grow.
- Soak the seeds first to soften the seed coat.
