simpleMeaning: Yellow or pink to deep red flowers that look like those of the hibiscus are why people
  grow this bushy plant of warm Asia.
scope: Also called abelmosk, it is a bushy plant of warm Asia grown for its yellow or pink to deep red
  flowers, not the Old World plant with white or pink flowers.
examples:
- The musk mallow in the garden bore bright pink blooms.
- Gardeners grow musk mallow for its flowers that look like hibiscus.
