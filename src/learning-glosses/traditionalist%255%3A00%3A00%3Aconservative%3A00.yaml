simpleMeaning: Holding fast to old ways and unwilling to accept new ideas.
scope: Also called hidebound; holding fast to old ways and shut to new ideas, not a person who follows
  old views.
examples:
- The traditionalist council refused to change the old rules.
- Her traditionalist views made her wary of any reform.
