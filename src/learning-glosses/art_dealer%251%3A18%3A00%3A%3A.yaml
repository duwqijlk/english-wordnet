simpleMeaning: a person who buys and sells works made to be looked at for their beauty, and judges what
  each is worth
scope: A person who buys and sells fine works, not a collector who keeps them and not a maker of the works.
examples:
- The art dealer bought the painting at auction and sold it the next month.
- She asked an art dealer to put a price on her grandfather's statue.
