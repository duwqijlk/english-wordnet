simpleMeaning: Wine that tastes bad because its stopper has too much tannin, a bitter thing found in bark
scope: 'Also called corky: this is wine with a bad taste from its stopper, not wine that tastes bad for
  another reason.'
examples:
- The wine tasted bad because it was corked, so we sent it back.
- He opened a corked bottle and noticed the bad taste at once.
