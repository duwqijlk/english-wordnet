simpleMeaning: a short bit of a branch left on a tree trunk or plant stem after the rest of it has gone
scope: A short piece left on a trunk or stem after a branch is lost, not a torn-off part of a ticket and
  not hitting your toe.
examples:
- He tripped over the stub of the broken branch.
- A stub of the old apple tree still showed where the limb had been cut.
