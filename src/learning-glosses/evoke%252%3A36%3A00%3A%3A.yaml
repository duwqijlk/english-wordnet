simpleMeaning: to bring something out so it shows itself or starts to happen
scope: Another name for this is provoke; to bring something out or start it off, not to work out a meaning
  from facts and not to stir up feelings.
examples:
- Her behavior evoked a quarrel between the couple.
- Her words evoked a long silence in the room.
