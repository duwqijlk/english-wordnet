simpleMeaning: a copy of a real thing that does not work like the real thing, often used to describe another
  thing
scope: A copy that does not work, often placed before another word, not a small pet dog, not a much smaller
  copy of a person or thing, and not to play with a thing or an idea.
examples:
- She bought a toy stove for her daughter's play kitchen.
- The toy phone lit up but could not make real calls.
