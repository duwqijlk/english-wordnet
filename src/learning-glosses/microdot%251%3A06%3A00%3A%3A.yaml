simpleMeaning: Most often made to keep things safe, a photo shrunk to a tiny round speck
scope: A photo shrunk to the size of a dot, not a full-size photo and not a small mark on paper.
examples:
- The spy hid a microdot in the letter, a photo shrunk to a dot.
- They read the microdot under a lens to see the secret message.
