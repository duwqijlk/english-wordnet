simpleMeaning: A swelling of the veins around the opening at the end of the bowel, inside the body or
  sticking out of it.
scope: A swelling of the veins around the opening at the end of the bowel, also called piles or haemorrhoid.
examples:
- Sitting for hours made his hemorrhoid worse.
- The doctor said the hemorrhoid would heal on its own.
