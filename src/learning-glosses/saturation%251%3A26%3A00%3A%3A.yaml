senseId: 'saturation%1:26:00::'
synsetId: 13948221-n
simpleMeaning: a state in which an amount no longer changes, even when something from outside acts on
  it
scope: A state in which an amount no longer changes under outside action, not the act of soaking something
  through with a liquid, and not how pure a color is.
examples:
- The iron reached saturation, so a stronger magnet did not make it stronger.
- Saturation was reached when the amount stopped rising, even though more heat was added.
