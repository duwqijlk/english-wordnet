senseId: 'fictitiously%4:02:00::'
synsetId: 00102808-r
simpleMeaning: in a made-up way, as if from a story that came out of someone's mind
scope: In a made-up way, as in a story, not in a false way meant to trick someone.
examples:
- In the story, the city was named fictitiously, and none of its streets were real.
- He wrote fictitiously about a country he had only dreamed of.
