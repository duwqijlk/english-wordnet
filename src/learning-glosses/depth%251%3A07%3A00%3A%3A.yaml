simpleMeaning: how far something goes down from the top, back from the front, or in from the outside
scope: This is a size in space, not how strong a thought or feeling is and not a person's skill at thinking
  hard about ideas.
examples:
- The depth of the pool was two metres, so the children stayed in the shallow end.
- She measured the depth of the shelf before she bought the books to fit on it.
