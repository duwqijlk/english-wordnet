simpleMeaning: A big woody plant of warm lands that keeps its leaves all year, whose sweet-smelling wood
  gives a strong-smelling white solid.
scope: A tall green-leaved plant of warm lands, not a pine and not a palm.
examples:
- The camphor tree grows in the warm south.
- Camphor trees give wood with a strong, clean smell.
