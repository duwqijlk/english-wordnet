simpleMeaning: any thing that makes the body make a protein that makes small bits clump together
scope: A thing that starts the body making such a protein, not the protein itself and not a drug that
  fights germs.
examples:
- The agglutinogen in the blood sample made the body make the clumping protein.
- Doctors studied how the agglutinogen caused the body to make the protein.
