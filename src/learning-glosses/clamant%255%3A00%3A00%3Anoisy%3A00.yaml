simpleMeaning: Loud in a way that stands out and offends, and quick to cry out with force.
scope: Loud in a way that stands out and offends, and quick to cry out with force, also called blatant,
  strident, vociferous and clamorous; not merely loud and not silent.
examples:
- The clamant crowd shouted down every speaker.
- His clamant demands filled the whole hall.
