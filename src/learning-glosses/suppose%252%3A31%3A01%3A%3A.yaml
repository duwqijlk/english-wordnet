senseId: 'suppose%2:31:01::'
synsetId: 00635105-v
simpleMeaning: to think that something is true, especially without firm proof
scope: A belief held without firm proof; not the general sense of thinking or expecting, and not assuming
  something in advance.
examples:
- The researchers supposed the marks were made by tools, though they could not prove it.
- I supposed she had missed the train, but I was only guessing.
