senseId: 'affinity%1:19:01::'
synsetId: 11442936-n
simpleMeaning: the force that pulls atoms to each other and keeps them joined together in a molecule
scope: In chemistry, the pull that holds atoms together in a molecule. It is not likeness between things,
  not family ties by marriage, and not the pull between two parts in the body's fight against illness.
examples:
- The affinity between the atoms holds the molecule together.
- Strong affinity pulls these atoms together into a stable molecule.
