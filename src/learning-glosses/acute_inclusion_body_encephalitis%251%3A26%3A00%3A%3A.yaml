simpleMeaning: A common kind of sudden brain swelling brought by the herpes simplex 1 virus, which usually
  strikes the side and front parts of the brain.
scope: This is a common sudden brain swelling brought by the herpes simplex 1 virus; herpes encephalitis
  and herpes simplex encephalitis are other names for this sense.
examples:
- Acute inclusion body encephalitis struck the side and front parts of his brain.
- The doctors found acute inclusion body encephalitis after the herpes simplex 1 virus reached her brain.
