simpleMeaning: Of or to do with the branch of the Shinto faith that Japan made its state religion.
scope: To do with the branch of Shinto that was the state religion of Japan; the adjective, not the branch
  itself.
examples:
- Kokka rites were part of the state religion of Japan.
- The Kokka branch of Shinto held a high place in old Japan.
