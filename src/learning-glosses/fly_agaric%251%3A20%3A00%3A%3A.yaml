synsetId: 13023821-n
simpleMeaning: a woodland mushroom that can poison people but rarely kills them, with a bright red cap
  marked with white bumps and white folds underneath
scope: This is a poisonous woodland mushroom, not an edible mushroom and not a mould that grows on food.
examples:
- The children were told not to touch the fly agaric in the woods.
- A fly agaric stood out with its red cap among the fallen leaves.
