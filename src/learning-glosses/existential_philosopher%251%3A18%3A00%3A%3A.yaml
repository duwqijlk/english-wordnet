simpleMeaning: No one can explain life in a hostile world, yet this thinker insists that people pick their
  own course and must answer for it.
scope: This thinker is also called an existentialist and an existentialist philosopher, and the shared
  name marks one who ties free choice to answering for it in a world that cannot be explained.
examples:
- The existential philosopher argued that each person must choose freely and take the blame for the choice.
- As an existential philosopher, she held that life in a hostile world could not be explained.
