simpleMeaning: A Spanish explorer who went with Columbus on his second trip in 1493 and in 1513 found
  Florida while looking for the fabled Fountain of Youth (1460-1521)
scope: 'Also called Juan Ponce de Leon: a Spanish explorer who went with Columbus in 1493 and found Florida
  in 1513, not a later settler of Florida and not a king.'
examples:
- Ponce de Leon went with Columbus in 1493.
- Ponce de Leon found Florida in 1513.
