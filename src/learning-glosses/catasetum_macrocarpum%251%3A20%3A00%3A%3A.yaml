simpleMeaning: An orchid with male and female flowers in one bunch; when a tender point at the base of
  the middle of a male flower is touched, the pollen shoots out.
scope: 'Also called jumping orchid: an orchid with male and female flowers in one bunch, whose pollen
  shoots out when a tender point on a male flower is touched.'
examples:
- Catasetum macrocarpum shot its pollen when touched.
- The Catasetum macrocarpum had male and female flowers in one bunch.
