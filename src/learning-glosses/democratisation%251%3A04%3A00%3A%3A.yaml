simpleMeaning: the act of making a country, group, or other thing give its people a say in how it is run
scope: Also called democratization; it can apply to a country, a group, or any other thing, not only to
  a government.
examples:
- Democratisation swept the country in the 1990s.
- The democratisation of the state took many years.
