simpleMeaning: A rod-shaped bacterium that causes anthrax in people and in animals such as cattle, pigs,
  sheep, rabbits, mice and guinea pigs, and can serve as a biological weapon.
scope: This is the bacterium itself, not the disease anthrax it causes and not the weapon made from it.
  It is one rod-shaped species among many harmless relatives. The name is technical, used in medicine
  and microbiology.
examples:
- The anthrax bacillus forms spores that can survive in soil for decades.
- Laboratory staff handle the anthrax bacillus under strict containment.
