simpleMeaning: A broad term for any way in statistics of working with facts from more than one thing at
  a time.
scope: A broad term for any way in statistics of working with facts from more than one thing; not one
  set method, and not a way that uses one thing only.
examples:
- Multivariate analysis let them study age, income and health together.
- The team used multivariate analysis on the survey facts.
