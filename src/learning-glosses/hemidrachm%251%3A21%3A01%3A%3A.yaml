simpleMeaning: An old Greek silver coin worth half a drachm, or three obols.
scope: An old Greek silver coin worth half a drachm; not a drachm itself, and not a coin of Rome or of
  later Greece.
examples:
- A hemidrachm was worth half a drachm in ancient Greece.
- The museum case held a silver hemidrachm from ancient Athens.
