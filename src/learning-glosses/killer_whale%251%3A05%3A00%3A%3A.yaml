simpleMeaning: A black-and-white sea animal with teeth that hunts other sea animals, with a large fin
  on its back, often found in cold seas.
scope: This is a black-and-white sea animal with teeth that hunts other sea animals, with a large fin
  on its back, often found in cold seas; killer, orca, grampus and sea wolf are other names for it, not
  a blue whale and not a dolphin.
examples:
- A killer whale hunted seals in the cold sea.
- Killer whales are black and white, with a large fin on the back.
