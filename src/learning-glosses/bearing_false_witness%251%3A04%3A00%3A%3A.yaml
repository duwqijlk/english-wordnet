simpleMeaning: the crime of saying untrue things after swearing to tell the truth
scope: 'Also called perjury and lying under oath: the crime of saying untrue things after swearing to
  tell the truth, not a lie told outside a court and not a mistake in what someone says.'
examples:
- He was charged with bearing false witness after his story changed under oath.
- Bearing false witness in court can send a person to prison.
