simpleMeaning: a sign on a set of five lines that shows the F below middle C on the fourth line
scope: A sign that marks low notes on a set of five lines, not the treble clef for high notes and not
  a note itself.
examples:
- The bass clef told him the note was low.
- She read the bass clef at the start of the music.
