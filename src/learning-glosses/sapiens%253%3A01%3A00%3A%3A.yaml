simpleMeaning: of or about human beings, or having the qualities that human beings have
scope: It describes human beings and what is typical of them; it does not name a person or an animal of
  another kind.
examples:
- Homo sapiens spread across the world thousands of years ago.
- The study compared Homo sapiens bones with those of older human kinds.
