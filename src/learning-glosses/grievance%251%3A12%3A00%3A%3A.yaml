simpleMeaning: anger over a wrong, strong enough to make payback seem right
scope: 'Also called score and grudge: anger over a wrong that makes payback seem right, not a mere complaint
  and not a claim in law.'
examples:
- He nursed a grievance against the man who had cheated him.
- His grievance was so strong that he felt payback was only fair.
