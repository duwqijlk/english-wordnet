simpleMeaning: A crowd of people pressed close in a tight group with no clear order
scope: A tight crowd pressed close with no clear order, not a neat line of people and not a small group
  in a team talk.
examples:
- A huddle of frightened women stood close by the door.
- The huddle of fans pressed close to the gate to see the team.
