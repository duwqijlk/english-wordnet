simpleMeaning: swelling and soreness of the brain and the cord of nerves down the back, with the thin
  covers around them
scope: 'Also called encephalomeningitis or meningoencephalitis: a swelling of the brain and the nerve
  cord with their covers, not a swelling of the brain alone and not a pain in the back.'
examples:
- The doctors said the cerebromeningitis had spread to both the brain and the spinal cord.
- After the fever, tests showed cerebromeningitis in the tissue around her brain.
