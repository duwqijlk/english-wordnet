simpleMeaning: Cut into slices from rolled dough spread with sugar and nuts, this sweet roll bakes in
  a muffin tin with honey or sugar and butter underneath.
scope: Also called caramel bun, honey bun, and schnecken, it is a sweet roll baked in a muffin tin with
  honey or sugar and butter underneath.
examples:
- The sticky bun stuck to the tin.
- She cut the sticky bun into slices and shared it.
