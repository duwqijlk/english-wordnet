senseId: 'ineffaceability%1:07:01::'
synsetId: 92427410-n
simpleMeaning: How hard it is to get rid of a mark or a memory, however hard you try to wipe it away
scope: The quality of being hard to get rid of, also called indelibility; not something that fades or
  washes away easily.
examples:
- The ineffaceability of the ink stain annoyed the printer.
- The ineffaceability of her first love stayed with her for years.
