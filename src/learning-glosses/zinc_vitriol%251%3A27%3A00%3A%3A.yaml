simpleMeaning: Dyes are fixed, wood is kept from rotting, and metal is laid on things with an electric
  current, all with this powder with no colour that melts in water.
scope: White vitriol, zinc sulfate, and zinc sulphate are other names for this powder, used to fix dyes,
  to keep wood from rotting, or to lay metal on things with an electric current.
examples:
- The worker stirred zinc vitriol into the bath.
- Old books list zinc vitriol as a mordant for dyes.
