senseId: 'shucks%1:10:00::'
synsetId: 06618035-n
simpleMeaning: Words a person says to show they are sad because something did not go as they hoped, or
  a little angry
scope: Words a person says when unhappy or a little angry, not the outer covering of corn and not the
  act of taking that covering off.
examples:
- '"Shucks, I missed the bus again," he said.'
- She said, "Shucks!" when she dropped her keys in the mud.
