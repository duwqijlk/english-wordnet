simpleMeaning: Eaten raw or cooked, as in a dish of clams with a tasty top, this small hard-shell clam
  is bigger than a littleneck.
scope: 'Also called cherrystone: a small clam eaten raw or cooked, not a large clam and not one eaten
  only in soup.'
examples:
- The cherrystone clam was served raw on ice.
- We bought cherrystone clams for the baked dish.
