simpleMeaning: to paint a picture on a wall while its plaster is still wet
scope: Painting on wet plaster on a wall, not painting on a dry wall and not the finished picture itself.
examples:
- The artist frescoed the whole chapel wall in a single summer.
- They hired a painter to fresco the dining room wall.
