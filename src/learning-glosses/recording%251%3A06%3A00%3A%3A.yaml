simpleMeaning: A signal that carries something that has been saved, such as a picture or sound, in a coded
  form
scope: This is the signal that holds the picture or sound, not the device that stores it and not the act
  of saving it.
examples:
- She played an old recording of her grandfather singing.
- The recording of the concert sounds clear on these speakers.
