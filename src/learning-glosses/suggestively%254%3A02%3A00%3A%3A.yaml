simpleMeaning: in a way that points to an idea or feeling without saying it in clear words
scope: In a way that hints at an idea or feeling without clear words; not in a way that says a plan openly
  or gives clear proof.
examples:
- She smiled suggestively, as if she had a secret plan.
- He looked at the cake suggestively, hoping someone would offer him a piece.
