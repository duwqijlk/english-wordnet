simpleMeaning: to feel sad and low, have no interest in things, or be unable to think clearly
scope: Feeling sad and low, having no interest in things, or being unable to think clearly; not simply
  being tired or ill, and not moving slowly with no purpose.
examples:
- After losing his job, he moped around the house all day, speaking to no one.
- Do not mope in your room all evening; come and talk to us about what is wrong.
