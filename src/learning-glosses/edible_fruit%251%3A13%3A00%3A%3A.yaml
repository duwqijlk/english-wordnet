simpleMeaning: the part of a plant that holds its seeds and can be eaten, often with sweet flesh
scope: The part of a plant that holds seeds and can be eaten, not the plant itself and not a vegetable.
examples:
- She picked an edible fruit from the tree and ate it.
- The edible fruit was sweet and full of juice.
