simpleMeaning: A student near the end of medical training, or a new doctor, who learns by doing real work
  while a senior doctor watches over them
scope: 'Also called intern and interne: a student or new doctor who learns through real work while a senior
  doctor watches, not someone who learns only from books in a classroom.'
examples:
- The houseman checked the patient while the senior doctor watched.
- As a houseman, he worked long hours in the hospital, learning from real cases.
