simpleMeaning: A way of printing that uses a plate cut or scratched with lines, smeared with ink and wiped
  clean, so the ink left in the hollows makes the print.
scope: A way of printing that uses a plate cut or scratched with lines, smeared with ink and wiped clean,
  so the ink left in the hollows makes the print; it is also called gravure and intaglio printing, unlike
  the sense for sunken carving on a stone or gem, the opposite of cameo.
examples:
- Intaglio uses an etched plate.
- The print was made by intaglio.
