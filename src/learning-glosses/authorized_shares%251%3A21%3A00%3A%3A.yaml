simpleMeaning: The most parts of a company that people can own, as allowed by the papers that set up the
  company
scope: This is the most parts of a company that people can own, as allowed by the papers that set up the
  company; authorized stock and capital stock are other names for it, not the parts already sold and not
  the parts people hold now.
examples:
- The authorized shares set the most parts of the company that people can own.
- Under its founding papers, the company may not sell more than its authorized shares.
