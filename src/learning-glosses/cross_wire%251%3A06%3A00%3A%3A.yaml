simpleMeaning: A thin straight mark, one of a pair set at right angles inside a sighting tool, used for
  aiming or for setting the tool
scope: This is one of a pair of fine marks used for aiming, not a single line and not a mark on a map;
  cross hair is another name for this sense.
examples:
- He had the target in his cross wires.
- She set the cross wire on the centre of the target.
