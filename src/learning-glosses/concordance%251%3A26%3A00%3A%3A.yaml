senseId: 'concordance%1:26:00::'
synsetId: 13992690-n
simpleMeaning: A state in which things fit well together, their parts agreeing with each other and with
  the whole, as colours and sounds can.
scope: Also called harmony and concord, a state in which things fit well together, not a list of the main
  words in a book with their places in it.
examples:
- The concordance of colours in the room made it feel calm and warm.
- There was a concordance between the music and the words of the song.
