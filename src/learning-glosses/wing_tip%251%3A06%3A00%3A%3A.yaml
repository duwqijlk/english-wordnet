simpleMeaning: a fancy cover for the front of a shoe, shaped to a point that runs back toward the opening
  for the foot
scope: A fancy toe cover on a shoe, not a pointed end of an aircraft wing and not the pointed end of a
  bird's wing.
examples:
- His shoes had a wing tip with a point that reached back toward the laces.
- She chose brown shoes with a wing tip on each toe.
