simpleMeaning: A red-brown metal that bends and flattens, does not rust, and is pushed away by magnets;
  the only metal in big lumps in rocks, it carries heat and power well.
scope: This is a soft red-brown metal that carries heat and power, also called Cu and atomic number 29,
  not a police officer and not a coin.
examples:
- Copper wires carry power.
- The pot is made of copper.
