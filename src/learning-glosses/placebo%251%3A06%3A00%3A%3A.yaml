simpleMeaning: A harmless pill or treatment with nothing active in it, given to calm a patient, or to
  one group in a drug trial to set against the real drug.
scope: Of a harmless pill or treatment with nothing active in it, given to calm a patient, or to one group
  in a drug trial to set against the real drug, not the vespers of the office for the dead in the Roman
  Catholic Church.
examples:
- Half the patients got the real drug and half got a placebo.
- The placebo had no effect beyond calming her nerves.
