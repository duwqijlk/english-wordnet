simpleMeaning: to make the -er or -est form of a word that says what a thing is like or how an act is
  done
scope: To make the -er or -est form of a word that says what a thing is like or how an act is done, not
  to look at two things side by side.
examples:
- The teacher asked us to compare the word 'hot' and say hotter and hottest.
- She had to compare the word good to make better and best.
