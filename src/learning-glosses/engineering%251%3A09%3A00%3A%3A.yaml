simpleMeaning: the study and practice of using scientific knowledge to solve practical problems, such
  as designing machines, buildings, or systems
scope: This is the field of study and its methods, not a single machine or structure and not the hands-on
  work of building one.
examples:
- She studied engineering at university and later designed bridges.
- Modern engineering has made air travel much safer.
