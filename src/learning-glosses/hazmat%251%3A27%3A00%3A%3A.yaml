simpleMeaning: a short form of the words hazardous material (material that can harm people or places),
  used on warning signs
scope: The short name put on a warning sign for material that can harm people, not the harmful material
  itself.
examples:
- The sign on the gate says, 'No hazmat in this tunnel.'
- A hazmat sign on the truck warns people that the load may be harmful.
