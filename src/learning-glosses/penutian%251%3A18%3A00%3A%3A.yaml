simpleMeaning: A person of a first people of North America who speaks one of the tongues of the group.
scope: This is a person of a first people of North America who speaks one of the tongues of the group,
  not the group of tongues itself and not a person of another people.
examples:
- The Penutian told stories in his own tongue.
- Penutian families lived along the river.
