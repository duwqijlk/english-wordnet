simpleMeaning: Held back by rules that limit what can be done with it or who can use it.
scope: Held within limits set by rules; not the least secret mark on official papers, and not a word used
  with a narrowed sense.
examples:
- The area is restricted to staff only.
- They kept the papers under restricted access.
