simpleMeaning: A warm-clime American heron, kin to night herons.
scope: A warm-clime American heron, kin to night herons; not small birds of the Old World tropics with
  bright feathers and short wide bills, nor diving ducks of North America with a blue-grey bill, nor a
  fresh-water duck of the north half of the world, with a broad flat bill.
examples:
- Their broadbill waded at dawn.
- The broadbill was seen at noon.
