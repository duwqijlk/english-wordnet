simpleMeaning: A test people fill in about themselves, made by Raymond B. Cattell to measure sixteen sides
  of character found in his study of a wide set of traits.
scope: A test people fill in about themselves, also called the Sixteen Personality Factor Questionnaire;
  its nearest kin are other tests of character made from lists of questions.
examples:
- The 16 PF test asks about sixteen sides of character.
- She took the 16 PF as part of the job screening.
