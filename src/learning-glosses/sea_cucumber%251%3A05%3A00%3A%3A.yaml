simpleMeaning: Free in mud, this spiny-skinned salt-water animal feeds there, its mouth ringed with feelers
  and tube feet below a long bendy body like a sausage.
scope: Also called holothurian, this is a spiny-skinned salt-water animal with a long bendy body like
  a sausage, feelers round its mouth and tube feet, living free in mud and feeding there.
examples:
- The sea cucumber lay free in the mud, feeding there.
- We saw a sea cucumber with feelers round its mouth and tube feet.
