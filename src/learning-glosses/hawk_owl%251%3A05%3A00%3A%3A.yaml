simpleMeaning: A grey-and-white bird of the far north that hunts by day and looks and acts like a bird
  of prey.
scope: A grey-and-white owl of the far north that hunts by day, not a night owl and not a true hawk.
examples:
- A hawk owl perched on the dead spruce, watching the snow.
- We saw a hawk owl hunting voles in the bright northern daylight.
