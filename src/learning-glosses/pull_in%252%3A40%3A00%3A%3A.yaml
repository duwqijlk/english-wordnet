simpleMeaning: to get money from a sale or a business deal, or as pay for work
scope: To get money from a sale or a business deal, or as pay for work; make, clear, realize, gain, earn,
  realise, bring in and take in are other names for this sense, not to arrive somewhere or to draw people
  in.
examples:
- She hopes to pull in a good wage in her new job.
- The merger helped the firm pull in a lot of money.
