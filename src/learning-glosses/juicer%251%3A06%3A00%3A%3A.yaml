simpleMeaning: a tool for pressing juice from oranges, lemons and other such fruit, with a middle part
  shaped like a cone and raised lines on it
scope: 'Also called juice reamer and reamer: this is a hand tool for pressing juice from oranges and lemons,
  not a person who drinks too much alcohol and not a big electric machine.'
examples:
- She pressed half an orange on the juicer to get the liquid out.
- He turned the lemon half round and round on the juicer.
