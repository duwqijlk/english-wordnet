simpleMeaning: a feeling in the mind that is painful or full of worry and trouble, and is not comfortable
  to bear
scope: 'Also called discomfort and irritation: a bad feeling in the mind, not pain in a part of the body.'
examples:
- He felt a deep soreness after his friend spoke to him in such a cold way.
- The soreness from those harsh words stayed with her for days.
