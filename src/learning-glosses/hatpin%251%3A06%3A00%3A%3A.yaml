simpleMeaning: A long, strong pin that a woman pushes through her hat and hair to hold the hat on.
scope: A pin for fixing a woman's hat to her hair, not a pin for sewing or fastening clothes.
examples:
- She fixed her hat with a long hatpin before going out.
- The hatpin kept her wide hat from blowing off in the wind.
