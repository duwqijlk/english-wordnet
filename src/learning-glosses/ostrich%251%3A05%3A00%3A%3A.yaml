simpleMeaning: a bird from Africa that runs fast and cannot fly, with two toes on each foot, and is the
  largest bird now living
scope: This is the real large bird from Africa, not a person who will not face the truth or see what is
  real.
examples:
- An ostrich ran across the plain, too big and heavy to fly.
- We saw an ostrich at the zoo, the largest bird there, with two toes on each foot.
