simpleMeaning: A low plant that lives one year, from the south-west United States and Texas, with soft
  silky leaves and blue flowers, a chief cause of farm animals being poisoned there.
scope: 'Also called bluebonnet, buffalo clover and Texas bluebonnet: a low yearly plant with silky leaves
  and blue flowers, a chief cause of farm animals being poisoned in the south-west United States.'
examples:
- Lupinus subcarnosus grew low on the dry Texas plain, its blue flowers bright.
- Ranchers watch for Lupinus subcarnosus, since it can poison their cattle.
