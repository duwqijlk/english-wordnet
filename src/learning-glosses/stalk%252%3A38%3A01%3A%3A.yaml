senseId: 'stalk%2:38:01::'
synsetId: 02008023-v
simpleMeaning: To go after someone in secret, or to keep coming back to a person on its own, again and
  again
scope: Also called haunt, this is secret following or a thought that keeps coming back, not a plant stem
  and not a hunt for wild animals.
examples:
- The man stalked her home each night without her knowing.
- The memory stalked him for years, coming back when he least wanted it.
