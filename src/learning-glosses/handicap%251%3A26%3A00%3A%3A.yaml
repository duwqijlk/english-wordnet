senseId: 'handicap%1:26:00::'
synsetId: 14571935-n
simpleMeaning: the state of not being able to do things because the body or the mind is not fit enough
scope: 'Also called disability and impairment: the state of not being able to do things because the body
  or the mind is not fit. It is not an advantage given in a contest to make chances equal, and not a thing
  that slows or holds back progress.'
examples:
- Because of his handicap, he needs large print to read a book.
- Her handicap affects her hearing, so she watches the lips of the person who is speaking.
