simpleMeaning: Leather that is soft and comes from the skin of a deer or a lamb
scope: This is the soft leather made from deer skin or lamb skin, not the fine wool cloth with the same
  name.
examples:
- His doeskin gloves were made from deer skin.
- The shop sold doeskin for making soft leather gloves.
