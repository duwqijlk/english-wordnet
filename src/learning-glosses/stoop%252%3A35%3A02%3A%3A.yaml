simpleMeaning: to walk or stand, often as a habit, with your head, shoulders and top of your back bent
  forward
scope: This is walking or standing with the head and back bent forward, often as a habit. It is not bending
  down for a short time, and not doing something low and wrong.
examples:
- The old man stooped as he walked, but he did not need a stick.
- After years at a low desk, he now stoops when he stands.
