simpleMeaning: saying or doing something to give someone back their confidence
scope: The act of giving someone back their confidence, not the feeling of confidence itself and not a
  promise that things will be all right.
examples:
- Her reassurance helped him walk into the exam room calmly.
- The nurse's reassurance gave the child back her confidence.
