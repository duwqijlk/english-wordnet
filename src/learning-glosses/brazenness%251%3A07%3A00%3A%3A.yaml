simpleMeaning: Behaving with bold scorn for what is proper, and with no shame at all.
scope: Also called shamelessness, behaving with bold scorn for what is proper, and with no shame at all.
examples:
- His brazenness shocked the room; he showed no shame at all.
- She answered with a brazenness that ignored every rule of good manners.
