simpleMeaning: Having to do with how the body works and with its organs
scope: To do with the body and its organs, not food grown with no chemicals, not a carbon chemical, not
  to do with living things in general, and not a fertilizer.
examples:
- The doctor said the illness was organic, not in the mind.
- An organic disease comes from the body itself.
