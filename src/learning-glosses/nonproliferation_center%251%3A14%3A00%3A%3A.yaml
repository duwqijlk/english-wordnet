simpleMeaning: An office that stands at the heart of all the work of the spy services on stopping the
  spread of arms of mass harm and the rockets that carry them
scope: Also called NPC; an office at the heart of the spy services' work on stopping the spread of arms
  of mass harm, not an office that makes arms and not an office that runs the armed forces.
examples:
- The Nonproliferation Center shares its findings with other spy services.
- Analysts at the Nonproliferation Center watch the spread of arms of mass harm.
