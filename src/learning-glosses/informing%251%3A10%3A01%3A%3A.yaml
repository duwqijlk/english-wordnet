simpleMeaning: what you give a police officer that shows someone did wrong, most often in the hope of
  a favour in return
scope: Giving the police proof that points the blame at someone, not just passing on news or facts in
  general.
examples:
- His informing gave the police the proof they needed to charge the thief.
- She risked informing the police in the hope they would go easy on her.
