simpleMeaning: Holding fast to what you think is true, with no humour and no doubt.
scope: Firm and humourless in what you believe, not calm and serious in manner and true to promises.
examples:
- He gave a solemn speech about what he believed was right.
- The film had a solemn message about how people should live.
