simpleMeaning: Freight is carried on this river boat, moved by rowing, punting, or towing, which sits
  high in the water with a long beam along its bottom but no sails.
scope: What sets this river boat apart is that it carries freight with no sails, moved only by rowing,
  punting, or towing.
examples:
- The keelboat carried freight down the river.
- The keelboat moved by rowing down the river.
