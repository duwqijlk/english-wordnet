simpleMeaning: A bath cloth, wetted and rubbed over the skin to wash the face and body.
scope: A cloth for washing the face and body in the bath, also called a flannel, a washcloth, or a face
  cloth; not a towel for drying.
examples:
- She wrung out the washrag and wiped the child's face.
- A clean washrag hung beside the bath.
