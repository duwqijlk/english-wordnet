simpleMeaning: A member of the Malay people who live in the north of the Malay Peninsula, in Malaysia,
  and in parts of the western Malay Archipelago
scope: A member of the Malay people of the northern Malay Peninsula, Malaysia, and parts of the western
  Malay Archipelago; Malay is another name for this sense, and it is not a word for the land of Malaysia
  or for the tongue the people speak.
examples:
- He is a Malayan who grew up in Malaysia.
- Many Malayans live in the north of the Malay Peninsula.
