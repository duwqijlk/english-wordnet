simpleMeaning: a powerful lamp whose narrow beam lights one small area, used to focus attention on a performer
  on stage
scope: This is a lighting device with a tight beam, not a mark or stain on a surface, and not a short
  turn in a show.
examples:
- The follow spot tracked the dancer across the stage.
- He climbed the ladder to change the bulb in the spot above the stage.
