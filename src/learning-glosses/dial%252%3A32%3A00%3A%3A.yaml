simpleMeaning: to use the round control on a telephone to choose the number you want to call
scope: This is the act of choosing a phone number with a round control, not the round disc itself on a
  phone and not the round face that shows numbers on a measuring tool.
examples:
- She dialed her sister's number on the old phone.
- He dialled the wrong number and said sorry at once.
