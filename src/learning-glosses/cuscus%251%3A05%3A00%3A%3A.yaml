simpleMeaning: 'From New Guinea and northern Australia: a furry, monkey-like animal that lives in trees
  and keeps its young in a pouch.'
scope: This tree-living animal looks like a monkey but is not one, and it does not live on the ground.
examples:
- We saw a cuscus in the trees of New Guinea.
- The cuscus carried its baby in its pouch.
