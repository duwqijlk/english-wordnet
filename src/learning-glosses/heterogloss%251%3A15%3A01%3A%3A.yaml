simpleMeaning: A line on a map marking where a certain way of speaking ends, such as how a vowel is said,
  what a word means, or how words are joined
scope: This is a line on a map marking where a certain way of speaking ends, also called isogloss, and
  not a line marking a border between countries or a line on a map of land heights.
examples:
- The heterogloss runs through the middle of the state.
- A heterogloss marks where the vowel sound changes.
