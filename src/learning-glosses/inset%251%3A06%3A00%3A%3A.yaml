simpleMeaning: A piece of material set into a piece of clothing to make it stronger or larger.
scope: A piece of material set into clothing to make it stronger or larger, also called a gusset; not
  a thing put into a book or a box.
examples:
- The tailor added an inset to widen the skirt.
- An inset in the sleeve gave her more room to move.
