simpleMeaning: a firm promise to do, give, or hold back from something
scope: A firm promise to do, give, or hold back, also called assurance; not the act of promising and not
  a gift of money.
examples:
- She signed a pledge never to tell the secret.
- His pledge of help came when it was most needed.
