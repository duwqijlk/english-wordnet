simpleMeaning: A device for measuring changes in size, made as a closed room that holds the whole person,
  used to study breathing
scope: A closed room that holds a whole person, used to measure changes in size when studying breathing;
  not a small hand-held meter and not a room for treating illness.
examples:
- The patient sat in the body plethysmograph while the doctor studied his breathing.
- A body plethysmograph measures how the chest moves as a person breathes.
