simpleMeaning: a red blood cell that is not normal in shape and has sharp points of the soft stuff inside
  a cell sticking out
scope: This is a red blood cell of the wrong shape with sharp points sticking out, not a healthy red blood
  cell and not a white blood cell.
examples:
- The blood test showed an acanthocyte among the normal cells.
- Doctors look for acanthocytes when they check a blood sample.
