simpleMeaning: the throat, voice box, heart, lungs, food pipe, stomach, and most of the belly's organs
  all take their nerve supply from the brain through one nerve carrying messages both ways
scope: 'Also called nervus vagus, pneumogastric, pneumogastric nerve, vagus, vagus nerve, and wandering
  nerve: one nerve serving the throat, heart, lungs, and belly, not a nerve of the arm and not one that
  stays in the head.'
examples:
- The tenth cranial nerve carries signals from the brain to the heart and stomach.
- Damage to the tenth cranial nerve can slow the heart and upset the stomach.
