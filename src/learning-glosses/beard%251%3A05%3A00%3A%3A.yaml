simpleMeaning: A cluster of tough threads that let a mussel, for example, cling to a fixed surface.
scope: The anchoring threads of a shellfish, not the hair on a man's face nor the growth on a plant; byssus
  is another name for it.
examples:
- Mussels use a beard of fine threads to anchor themselves to the rocks.
- He pulled the beard off the mussel before cooking it.
