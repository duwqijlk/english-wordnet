simpleMeaning: A poisonous, clear liquid that catches fire easily (CS2), used to make rayon and cellophane,
  to make carbon tetrachloride, and to dissolve rubber.
scope: The industrial solvent CS2, a poisonous flammable liquid; not carbon dioxide or carbon monoxide,
  which are gases.
examples:
- Carbon disulfide dissolves rubber and many other materials.
- The factory stores carbon disulfide well away from any flame.
