simpleMeaning: A fancy stand that holds candles, and it often has a glass that shows your face
scope: 'Also called a girandole: a fancy stand that holds candles, often with a glass that shows your
  face, not a plain stick that holds one candle and not a wall lamp.'
examples:
- A girandola stood on the side table, its candles lit.
- The girandola's mirror caught the candlelight.
