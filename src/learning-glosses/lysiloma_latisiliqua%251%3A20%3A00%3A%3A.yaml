simpleMeaning: A tree of the West Indies, Florida and Mexico, like the tamarind, with long flat pods.
scope: This is a tree of the West Indies, Florida and Mexico, like the tamarind, with long flat pods;
  wild tamarind and Lysiloma bahamensis are other names for this sense, and it is not the tamarind itself.
examples:
- Lysiloma latisiliqua grew beside the road in the West Indies.
- The long flat pods of Lysiloma latisiliqua hung from its branches.
