simpleMeaning: Relating to Aesculapius, the classical god of healing, or to the healing art.
scope: This is an archaic, learned relational adjective tied to the proper name Aesculapius, the classical
  god of medicine, and to 'the healing art'. It is not the everyday adjective meaning 'of or relating
  to medicine as practised today', the sense in 'medical school' or 'medical advice'.
examples:
- In old poems the medical art is traced back to Aesculapius.
- Doctors once swore their oath by Aesculapius, patron of the medical art.
