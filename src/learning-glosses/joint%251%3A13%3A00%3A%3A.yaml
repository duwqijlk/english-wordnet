simpleMeaning: A cut of meat, roasted or ready to roast, big enough to be sliced into several servings.
scope: A large roasting cut served in slices, not the marijuana cigarette and not the act of cutting meat
  apart at a bone.
examples:
- We roasted a joint of beef for Sunday lunch.
- The butcher recommended a joint that would serve eight people.
