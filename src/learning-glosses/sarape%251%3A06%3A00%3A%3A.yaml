simpleMeaning: A long, bright-coloured shawl worn mostly by men in Mexico.
scope: A long bright shawl worn mostly by Mexican men, also called serape; not a poncho, a cloth with
  a hole for the head, and not a blanket.
examples:
- He threw a sarape over his shoulders against the cold.
- The sarape was woven in bright reds and blues.
