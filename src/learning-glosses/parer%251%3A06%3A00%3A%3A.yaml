simpleMeaning: A small sharp knife for taking the skin off fruit or vegetables.
scope: A small sharp knife for taking the skin off fruit or vegetables, also called paring knife; not
  a table knife and not a peeler with a slot.
examples:
- She used a parer to skin the apple.
- The parer took the peel off in one strip.
