simpleMeaning: a measure of how much dissolved matter is in each litre, in gram equivalents (amounts that
  react)
scope: This is a measure of a mix's strength, not the gas in the air, the measure of push, the 14th letter,
  or the compass point, and it is also called normality.
examples:
- The N of the mix was 0.5.
- Chemists state the strength of a mix as its N.
