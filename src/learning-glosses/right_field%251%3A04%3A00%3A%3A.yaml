simpleMeaning: the spot where the player stands to catch balls hit to the side of the outfield past first
  base, as seen from home plate
scope: 'Also called rightfield: the place of the player who catches balls hit to the side past first base,
  not the place of the player in the middle of the outfield and not the place of the player on the side
  past third base.'
examples:
- The coach put a fast runner in right field.
- She played right field for the home team all season.
