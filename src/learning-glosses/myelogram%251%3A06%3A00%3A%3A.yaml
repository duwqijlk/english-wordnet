senseId: 'myelogram%1:06:00::'
synsetId: 03809320-n
simpleMeaning: X-rays make a picture of the cord in the back, the roots of the nerves that leave it, and
  the fluid-filled space round them.
scope: It is an X-ray picture of the cord in the back and the fluid-filled space round it, not of the
  bones of the back.
examples:
- The myelogram showed the cord in her back and the nerves leaving it.
- A myelogram was taken to look at the fluid-filled space round the cord.
