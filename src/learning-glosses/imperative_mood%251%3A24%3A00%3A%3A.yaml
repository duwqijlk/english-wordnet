simpleMeaning: It tells the listener what to do, and shows the speaker means to change what the listener
  does
scope: This is a verb way of speaking used to tell the listener what to do; imperative, imperative form
  and jussive mood are other names for this sense, not a way of speaking that asks a question or states
  a fact.
examples:
- The imperative mood is used to give a direct command.
- She spoke in the imperative mood when she told him to sit down.
