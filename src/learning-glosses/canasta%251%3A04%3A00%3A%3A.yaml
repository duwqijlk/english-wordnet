simpleMeaning: A game like rummy, played with two packs and four jokers, where jokers and twos count as
  any card and the aim is to make sets of the same rank.
scope: Also called meld and basket rummy, this is the card game played with two packs and four jokers,
  not any other card game.
examples:
- They played canasta late into the night.
- She won the canasta game by making a set of kings.
