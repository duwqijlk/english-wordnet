simpleMeaning: something extra you put on or take with you, worn with your clothes but not one of the
  main pieces
scope: Clothing worn or carried along with the main clothes, not a part that makes a machine work better.
examples:
- Her only accessory was a small silver necklace.
- He chose a leather belt as the accessory for his new suit.
