simpleMeaning: the act of turning photos into a digital form, a form that a computer can read
scope: The act of turning photos into a form a computer can read, not the act of moving a thin beam of
  light over a surface to make an image of it.
examples:
- Scanning of the old photos took an hour, and now the computer can read them.
- She used scanning to turn the paper photos into files on the computer.
