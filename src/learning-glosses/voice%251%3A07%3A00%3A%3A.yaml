simpleMeaning: the special sound of a person's speech that lets you know who is talking and how they feel.
scope: Not the plain physical sound, not a sound that only seems human, and not an opinion; it is what
  makes one person's speech recognizable.
examples:
- I knew it was Dad on the phone from his deep voice.
- Her voice shook as she read the letter.
