simpleMeaning: Soldiers of a friendly country get help with plans and choices from this officer of the
  armed forces
scope: 'Also called a military advisor: an officer who helps the soldiers of a friendly country, not a
  commander who gives orders and not a soldier who fights.'
examples:
- The military adviser helped the allied troops plan their next move.
- A military adviser from Britain worked with the local soldiers for six months.
