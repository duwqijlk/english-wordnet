simpleMeaning: the set of clothes that soldiers wear when they do work such as cleaning or carrying things
scope: These are the clothes soldiers wear for everyday work jobs; not tiredness, and not a soldier's
  clothes for fighting.
examples:
- The soldiers changed into their fatigues before cleaning the yard.
- He wore his fatigues while painting the wall of the building where the soldiers lived.
