simpleMeaning: the part of a gun that hits the small cap that sets off the shot when the trigger is pulled
scope: The part of a gun that hits the small cap that sets off the shot, also called a hammer; not a tap,
  not pulling the striking part back to fire and not a proud walk.
examples:
- The cock of the old rifle clicked back with a sharp sound.
- He lowered the cock of the pistol before putting it away.
