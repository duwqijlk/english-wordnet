simpleMeaning: A way of fixing places in space where a thing left alone stays still or keeps moving in
  a straight line at the same speed
scope: A way of fixing places in space where a thing left alone stays still or moves in a straight line
  at the same speed, also called an inertial reference frame; not a frame that speeds up or turns.
examples:
- Physicists chose an inertial frame in which the rocket moved in a straight line.
- In an inertial frame, a ball left alone does not change its speed or direction.
