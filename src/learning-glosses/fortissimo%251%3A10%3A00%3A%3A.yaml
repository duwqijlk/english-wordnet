simpleMeaning: A piece of music, or a part of one, that must be played very loudly.
scope: Music to be played very loudly, not music played softly and not a loud noise of any kind.
examples:
- The fortissimo at the end of the piece shook the hall.
- He marked the last bars fortissimo so the band would play them loudly.
