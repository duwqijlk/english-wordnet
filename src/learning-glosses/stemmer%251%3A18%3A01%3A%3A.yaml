simpleMeaning: A worker who takes the stiff middles out of wet tobacco leaves and ties the leaves into
  packs
scope: A worker who takes the stiff middles out of wet tobacco leaves, also called a stripper or a sprigger;
  not the set of steps that cuts word endings.
examples:
- The stemmer stripped the middles from the wet tobacco leaves.
- Each stemmer tied the leaves into packs.
