simpleMeaning: the state of a man being able to have sex with another person
scope: This sense is about a man being able to have sex, not about the strength or power of a drug or
  of something else.
examples:
- After the treatment, his potency returned and his sex life improved.
- The doctor asked about his potency and whether he had problems having sex.
