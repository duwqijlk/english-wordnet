simpleMeaning: Describes a person who follows the usual customs, rules, or styles of a group.
scope: Describes someone who follows usual customs and rules, not a rebel and not someone who breaks with
  the group.
examples:
- The teenagers looked wild but were surprisingly conformist underneath.
- He was too conformist to question the school rules.
