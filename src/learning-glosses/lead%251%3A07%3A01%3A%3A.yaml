simpleMeaning: the timing of the spark in an engine that burns fuel inside it, compared with where the
  piston is
scope: This is about when the spark fires in an engine, not the rope for an animal, not the short connecting
  wire, and not the angle used when aiming at a moving target.
examples:
- The mechanic adjusted the lead so the spark came earlier in the stroke.
- A longer lead makes the spark fire sooner as the piston rises.
