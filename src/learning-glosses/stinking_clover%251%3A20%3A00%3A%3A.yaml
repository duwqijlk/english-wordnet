simpleMeaning: At times grown to look at, this western North American plant has leaves in threes and white
  or pink blooms whose thin parts spread out like spider legs.
scope: Of the plants of western North America, this one has leaves in threes and white or pink blooms
  whose thin parts spread out like spider legs, and people at times grow it to look at.
examples:
- White blooms with thin parts spread out like spider legs opened on the stinking clover.
- People at times grow stinking clover to look at, for its leaves in threes.
