simpleMeaning: At a heat high enough to carry the yeast to the surface of the liquid, this strong, fast
  kind of brewing makes ale.
scope: This is a strong, fast kind of brewing in which the yeast is carried to the surface of the liquid
  by the heat, used to make ale, not the slow kind in which the yeast sinks.
examples:
- Top fermentation uses a yeast that works at higher temperatures than the yeast for bottom fermentation.
- Ale is made by top fermentation.
