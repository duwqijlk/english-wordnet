simpleMeaning: A stand or base that looks like the end of a leg.
scope: A stand or other support shaped like a leg ending, not a real body part on any animal and not the
  metrical unit of poetry.
examples:
- One foot of the chair was on the carpet.
- The sofa rested on four small wooden feet.
