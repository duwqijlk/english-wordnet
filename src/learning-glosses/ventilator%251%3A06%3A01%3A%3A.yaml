simpleMeaning: a machine that helps a person breathe when their lungs cannot do the work on their own
scope: A machine that helps a person breathe when their lungs cannot do the work on their own; not the
  machine, such as a fan, that brings fresh air in or pushes bad air out.
examples:
- After the accident, he needed a ventilator to help him breathe.
- The doctors put her on a ventilator until her lungs grew stronger.
