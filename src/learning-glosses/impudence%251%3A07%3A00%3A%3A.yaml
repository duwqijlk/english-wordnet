senseId: 'impudence%1:07:00::'
synsetId: 04923043-n
simpleMeaning: the way a person is rude and shows no respect, and is ready to do things they have no right
  to do
scope: This is the quality of being rude with no respect, also called crust, gall, freshness, insolence,
  impertinence and cheekiness; it is not a single rude thing that a person says.
examples:
- His impudence shocked the teacher, and he was sent out of the room.
- She had the impudence to take his seat and refuse to move.
