simpleMeaning: a rule or set way that usually guides how people act
scope: Also called rule. This is a rule that guides how people usually act, not the sense that means set
  by a rule and not the act of making things the same.
examples:
- Short haircuts were the regulation at that school.
- In this army, getting up early is the regulation for everyone.
