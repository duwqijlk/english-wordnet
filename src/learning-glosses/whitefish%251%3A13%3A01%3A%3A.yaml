simpleMeaning: the flesh, eaten as food, of a fish like a salmon or a trout, that lives in cold lakes
  in the northern half of the world
scope: The flesh eaten as food, not the living fish itself and not a saltwater fish sold for food.
examples:
- We ate whitefish with bread for dinner.
- The whitefish on her plate was soft and white.
