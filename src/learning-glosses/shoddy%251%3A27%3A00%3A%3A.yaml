simpleMeaning: thin strands of wool taken from old cloth and used again
scope: This is the wool material itself, not the common use of the word for something badly made or of
  poor quality.
examples:
- The factory turned old coats into shoddy for new blankets.
- This cloth is made from shoddy, not from new wool.
