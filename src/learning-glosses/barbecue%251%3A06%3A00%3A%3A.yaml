simpleMeaning: a frame to hold meat for cooking over hot coals, usually out in the open
scope: A frame to hold meat over hot coals out in the open, not the cookout itself, not the cooked meat,
  and not the act of cooking.
examples:
- He set the meat on the barbecue over the glowing coals.
- The barbecue stood ready in the back garden.
