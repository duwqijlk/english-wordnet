simpleMeaning: the ability of an argument or plea to persuade people to act or believe something
scope: This is how convincing an argument or appeal is, not the power of a sound or light signal, not
  bodily power, and not the capacity of a drug or chemical.
examples:
- The strength of her argument convinced the committee to change the rule.
- No one doubted the strength of the case he presented to the jury.
