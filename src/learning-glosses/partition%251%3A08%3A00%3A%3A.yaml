simpleMeaning: In the body, a wall that keeps two areas apart
scope: In the body, a wall keeping two areas apart; not the act of dividing a thing and not a part of
  a hard disk.
examples:
- A thin partition divides the two sides of the nose.
- The partition between the heart's chambers keeps blood apart.
