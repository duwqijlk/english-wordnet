simpleMeaning: Heat makes tiny charged bits fly off things, and the part of electronics that deals with
  this works most of all in empty glass tubes.
scope: This is the part of electronics that deals with the bits heat throws off, not the bits themselves.
examples:
- He studied thermionics to learn how old radio valves worked.
- Thermionics explains why the hot filament gives off a stream of charged bits.
