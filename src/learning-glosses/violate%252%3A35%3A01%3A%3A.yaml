simpleMeaning: To strip a place of all it owns and leave it broken and bare
scope: 'Also called rape, spoil, and plunder: stripping a place of all it owns and leaving it broken and
  bare, not breaking a law and not going against a rule or a holy place.'
examples:
- The army violated the rich valley, leaving it bare.
- Invaders violated the town, taking all its goods.
