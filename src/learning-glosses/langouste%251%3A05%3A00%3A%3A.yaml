simpleMeaning: With no big front claws like a true lobster, this big sea animal, good to eat, has a hard
  spiny shell.
scope: People also call it crawfish, crayfish, rock lobster, sea crawfish, and spiny lobster, the big
  sea animal that has no big front claws.
examples:
- The langouste has a hard spiny shell and no big front claws.
- A langouste is good to eat.
