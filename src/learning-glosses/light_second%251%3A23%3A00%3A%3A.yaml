simpleMeaning: The rays that make things seen go about 300,000 kilometres before a clock ticks once, in
  empty space
scope: The distance the rays that make things seen go before a clock ticks once, not the distance they
  go in sixty seconds and not a way to measure such rays.
examples:
- A light second is about 300,000 kilometres.
- The moon is just over one light second away from Earth.
