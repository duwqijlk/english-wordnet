simpleMeaning: A white blood cell that spots germ markers on an infected cell and releases chemical signals
  that spur other defender cells into action; HIV kills these cells.
scope: This is the immune cell that calls other defenders into action, not the killer cell that destroys
  infected cells itself, and not the B cell that makes antibodies.
examples:
- HIV infects and destroys helper cells, which is why the immune system collapses.
- The vaccine prompts helper cells to call other immune defenders into action.
