senseId: 'psychotic_depression%1:26:00::'
synsetId: 14414517-n
simpleMeaning: A very deep low mood in which a person loses touch with what is real and can no longer
  do everyday things well.
scope: A deep low mood with loss of touch with what is real, not ordinary sadness and not a passing low
  mood.
examples:
- His psychotic depression made him believe things that were not real.
- She was treated for psychotic depression after she stopped eating and sleeping.
