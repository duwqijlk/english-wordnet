simpleMeaning: times at the start and end of the work day when many people travel to and from work; the
  busiest time of day for travel from one place to another
scope: The busiest times for travel to and from work; not one single hour, and not a quiet time of day.
examples:
- Traffic is slow during the rush hour.
- She leaves early to miss the rush hour.
