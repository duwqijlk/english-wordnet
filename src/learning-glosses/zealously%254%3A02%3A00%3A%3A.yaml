simpleMeaning: in a way that shows great energy and strong, eager interest in what you are doing
scope: Done with great energy and strong interest, not done with little care or in a slow, calm way.
examples:
- She worked zealously to raise money for the reading project.
- He spoke zealously about protecting the park and asked everyone to help.
