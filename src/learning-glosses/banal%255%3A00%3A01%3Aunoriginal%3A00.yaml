senseId: banal%5:00:01:unoriginal:00
synsetId: 01693210-s
simpleMeaning: said or used so often that it is too well known and no longer feels new
scope: 'Also called tired, stock, threadbare, commonplace, trite, timeworn and hackneyed: words or ideas
  used so often that they feel old, not new or fresh ideas.'
examples:
- His speech was full of banal remarks that we had all heard before.
- The film had a banal ending that surprised no one.
