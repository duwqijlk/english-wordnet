simpleMeaning: full of many small holes and small empty spaces side by side
scope: This sense, also called pitted, means full of small holes and spaces; it is not about being sweet
  or made by bees.
examples:
- The old wood was honeycombed with tiny holes.
- The rock looked honeycombed, full of small round spaces.
