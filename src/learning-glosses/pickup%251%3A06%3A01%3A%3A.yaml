simpleMeaning: the part that can be taken off the arm of a record player, holds the needle, and turns
  the movement of the needle into electric signals
scope: This is the part that can be taken off and holds the needle, not the whole arm that carries it,
  not collecting passengers or goods, and not quick speed-up in a vehicle.
examples:
- He replaced the pickup on his old record player.
- The pickup holds the needle and can be lifted off the arm.
