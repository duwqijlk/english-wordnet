simpleMeaning: Not able to work in real life, or not the sort of person who thinks about what works
scope: Not workable in real life, or not given to practical matters; not a plan that is merely based on
  guesses, and not a thing that is hard but still possible.
examples:
- Refloating the ship proved impractical because of the expense.
- He is clever but too impractical for business work.
