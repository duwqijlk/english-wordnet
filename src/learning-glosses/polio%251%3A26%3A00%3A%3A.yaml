simpleMeaning: a sudden, serious disease caused by a virus that makes nerve cells in the brain stem and
  spinal cord sore and swollen
scope: 'Also called acute anterior poliomyelitis, infantile paralysis, and poliomyelitis: this is the
  disease itself, a sickness caused by a virus, not a sickness of the stomach or lungs.'
examples:
- Many children caught polio before a vaccine was widely used.
- Polio left some people unable to walk without help.
