simpleMeaning: at times joined to another word to make a new word, and with an edge whose kind is named
scope: Having an edge of a named kind, at times joined to another word, not merely decorated at the edge.
examples:
- She wore a black-bordered handkerchief.
- The bordered rug had a deep blue edge around it.
