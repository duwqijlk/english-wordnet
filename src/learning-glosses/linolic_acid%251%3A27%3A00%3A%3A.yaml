simpleMeaning: A liquid fatty acid whose molecules have several double bonds, abundant in plant fats and
  oils, essential for nutrition, and used in making soap.
scope: Linoleic acid is another name for this same fatty acid, not a different one such as linolenic acid.
examples:
- Linolic acid is found in large amounts in plant fats and oils.
- Soap is made with linolic acid and other fatty acids.
