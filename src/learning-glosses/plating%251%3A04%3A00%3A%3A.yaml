simpleMeaning: the act of putting a thin coat of metal onto a surface, such as by using an electric current
  to lay the metal down
scope: This is the act of putting the metal coat on, not the thin metal coat itself that stays on the
  surface.
examples:
- The plating of the spoons took two hours in the workshop.
- Gold plating needs care so that the thin coat spreads in an even way.
