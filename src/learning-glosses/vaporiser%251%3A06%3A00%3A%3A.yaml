simpleMeaning: a machine that sends out a fine mist of a substance, most of all a medicine to breathe
  in
scope: 'Also called a vaporizer: a machine that makes a fine mist of a substance, not a bottle that sprays
  water and not a pot that boils water to make steam.'
examples:
- She switched on the vaporiser so the baby could breathe in the medicine.
- The doctor told him to use the vaporiser for his sore chest.
