senseId: 'poultice%1:06:00::'
synsetId: 03999761-n
simpleMeaning: For medical use, a soft, warm mass of meal or clay, spread on cloth and put on the skin
  to help sore, swollen places or blood flow
scope: Also called plaster and cataplasm; this is the soft mass put on the skin, not the act of putting
  such a dressing on someone.
examples:
- She put a warm poultice on his swollen ankle.
- The nurse made a poultice of clay and laid it on the sore place.
