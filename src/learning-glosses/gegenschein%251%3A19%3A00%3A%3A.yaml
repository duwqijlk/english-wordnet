senseId: 'gegenschein%1:19:00::'
synsetId: 11462394-n
simpleMeaning: A faint patch of light in the night sky, straight across from where the sun is, made by
  sunlight bouncing off tiny bits of matter in space.
scope: This is a faint patch of light in the night sky, straight across from where the sun is; counterglow
  is another name for this sense, not a band of stars across the sky and not one bright star.
examples:
- On a dark night we saw the gegenschein opposite the sun.
- The gegenschein is hard to spot without a clear sky.
