simpleMeaning: a person who looks around in a relaxed way, not looking for any one thing in particular
scope: A person who looks around without a set aim, not someone looking for one set thing and not the
  computer program used to go on the internet.
examples:
- In the bookshop, a browser picked up a book, looked at a few pages, and put it back.
- Most browsers in the market were just looking, not buying anything.
