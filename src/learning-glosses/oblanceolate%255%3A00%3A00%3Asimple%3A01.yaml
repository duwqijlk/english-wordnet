simpleMeaning: Of a leaf shape, wide and round at the tip and narrow at the foot
scope: Of a leaf shape, wide and round at the tip and narrow at the foot; not a leaf wide at the foot,
  and not a leaf with a sharp tip.
examples:
- The oblanceolate leaf was wide at the tip.
- Oblanceolate leaves taper to a narrow base.
