simpleMeaning: seated skiers or sightseers ride this ski lift up or down a mountain, with seats hanging
  from a continuous overhead cable
scope: Another name for the chairlift, a lift with open seats on a moving cable; not an enclosed cable
  car or a surface tow that pulls skiers along the ground.
examples:
- We rode the chair lift to the top of the mountain.
- The chair lift was closed because of high winds.
