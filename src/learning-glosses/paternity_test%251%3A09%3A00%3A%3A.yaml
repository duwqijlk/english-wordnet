simpleMeaning: a blood-group check on whether a given man might be a child's birth father; a no proves
  he is not, while a yes shows only that he could be
scope: A blood-group check on whether a given man might be a child's birth father, where a no proves he
  is not while a yes shows only that he could be; not a check that proves a man is the father and not
  a check of the child's health.
examples:
- The paternity test used blood groups.
- They asked for a paternity test to settle the question.
