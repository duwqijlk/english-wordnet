simpleMeaning: Harming a thing so that it is spoiled.
scope: Harming a thing so that it is spoiled, also called spoil and spoiling, not the going-bad of a thing
  itself and not the amount that has gone bad.
examples:
- The spoilage of the painting was plain to see.
- Careless handling led to the spoilage of the goods.
