simpleMeaning: A copier that copies print by light falling on a charged surface that conducts power only
  where lit, where the hidden image is brought out with a sticky powder.
scope: Also called a xerographic copier and Xerox; a copier that copies print by light on a charged surface,
  not a plain printer and not a scanner.
examples:
- The Xerox machine copied the letter in seconds.
- She put the page on the Xerox machine and pressed the button.
