simpleMeaning: about the lines that run from north to south around the earth and show how far east or
  west a place is
scope: About the north-to-south lines that show how far east or west a place is, not the east-to-west
  lines that show how far north or south a place is, and not about the length of a thing.
examples:
- The navigator made a longitudinal reckoning to find the ship's position.
- Longitudinal lines on the globe help sailors know how far east they are.
