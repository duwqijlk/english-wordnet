simpleMeaning: showing very deep sadness or regret
scope: This describes words or tears that show deep sadness or regret, not great hate, not anger about
  unfair treatment, and not a sharp taste or cold that hurts.
examples:
- She shed bitter tears after her friend died.
- He let out a bitter cry when he heard the sad news.
