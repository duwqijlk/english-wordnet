simpleMeaning: a strong cotton strand that is twisted tight, usually made from long-fibre cotton
scope: A strong cotton strand twisted tight, usually made from long-fibre cotton; lisle is another name
  for this sense, not a silk strand and not a loose strand of wool.
examples:
- The socks were knitted from fine lisle thread.
- Lisle thread is strong enough for hard-wearing stockings.
