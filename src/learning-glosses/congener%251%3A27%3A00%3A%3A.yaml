simpleMeaning: In chemistry, a small part of a wine or strong drink that gives it its own special taste
  and smell.
scope: In chemistry, a small part of wine or strong drink that gives it its own taste, not the alcohol
  itself and not a flavour added later.
examples:
- The congener gives the whisky its smoky note.
- Each congener adds something to the wine's character.
