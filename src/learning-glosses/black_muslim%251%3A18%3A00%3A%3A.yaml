simpleMeaning: A person who works for change as a member of a mostly American group of dark-skinned people
  called the Nation of Islam.
scope: A person who works for change as a member of a mostly American group of dark-skinned people called
  the Nation of Islam, set apart from other members of the group by working for change.
examples:
- The Black Muslim spoke at the meeting.
- Black Muslims formed the Nation of Islam.
