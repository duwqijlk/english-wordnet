simpleMeaning: To teach someone the skills for a job so that they become able to do it.
scope: This is not about you learning a skill yourself, and not about teaching an animal to behave; it
  means teaching a person the skills for a job.
examples:
- The company trains new staff for six weeks.
- He was trained as an electrician by his uncle.
