simpleMeaning: in a way that makes you feel sad and without hope, or to a level that makes you feel sad
  and without hope
scope: In a way, or to a level, that makes you feel sad and without hope; it tells how something is or
  happens, not what a person or thing is.
examples:
- The house was depressingly dark and cold all winter.
- Prices stayed depressingly high, even after the harvest.
