simpleMeaning: Shaped like a chin, this small part sticks out below the mouth of some mollusks, soft animals
  with no bones
scope: A chin-like part under the mouth of some mollusks, not a real chin and not the chin-like part of
  an orchid.
examples:
- The mentum of the snail stuck out below its mouth like a small chin.
- Under the mouth of the shellfish, the mentum looked like a tiny chin.
