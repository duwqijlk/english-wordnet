simpleMeaning: A red-brown salt of heme, made from hemoglobin in lab tests that look for blood.
scope: A red-brown salt of heme made from hemoglobin in lab tests for blood; not hemoglobin itself, and
  not a test for other body fluids.
examples:
- Hemin formed in the lab test showed that blood was in the sample.
- Hemin crystals formed when the blood sample was treated in the lab.
