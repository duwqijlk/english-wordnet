simpleMeaning: A United Nations body set up to help countries that are still growing, by loans backed
  by member states.
scope: A United Nations body that lends to growing nations, also called International Bank for Reconstruction
  and Development and World Bank; not a body that gives gifts and not a body of one nation alone.
examples:
- The IBRD lent money to build the new road.
- The IBRD loan helped the country build schools.
