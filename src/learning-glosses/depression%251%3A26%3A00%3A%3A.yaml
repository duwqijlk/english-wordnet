simpleMeaning: a state of mind where a person feels not good enough and expects bad things, feels sad
  with little hope, and does very little
scope: This is a sad state of mind where a person does very little, not the very bad form that needs a
  doctor's care, not low ground, and not a measure of how far below a flat line a thing in the sky is.
examples:
- After losing his job, he fell into a depression and stopped going out.
- Her depression made even small daily tasks feel too hard to start.
