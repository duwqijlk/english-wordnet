simpleMeaning: a heap of fine loose grains, or a box full of them, for children to play in
scope: A plaything for children; sandbox and sandpit are other names for this sense, not a mound of sand
  used in building work.
examples:
- The children built a tall sandpile in the back garden.
- She filled the sandpile with buckets of fresh sand.
