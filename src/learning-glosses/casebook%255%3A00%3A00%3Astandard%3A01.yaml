simpleMeaning: like what is usual in a set of real records or a set used for study; a typical example
  of its kind
scope: 'Also called textbook: like a typical example from a set of records, not a new or strange one and
  not a set of rules.'
examples:
- His illness was a casebook example of the disease.
- The teacher called it a casebook case of the illness.
