simpleMeaning: Either by ending its smaller parts for good or by moving their powers to the central government,
  this backing in politics joins a state made of smaller parts into one.
scope: This is backing in politics for one central government over a state made of smaller parts, not
  for letting those parts keep their powers.
examples:
- Unitarism won support among those who wanted one central government.
- The unitarism debate turned on whether the small regions should keep any power.
