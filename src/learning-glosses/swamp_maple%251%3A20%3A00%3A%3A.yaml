simpleMeaning: a tree of the east and middle of America whose leaves have five parts and turn bright red
  and yellow in the fall
scope: This is a tree of eastern and central America with five-part leaves that turn red and yellow in
  autumn, also called red maple and scarlet maple, not a maple of the far west and not a tree whose leaves
  stay green.
examples:
- The swamp maple by the pond turned scarlet in October.
- Swamp maples line the wet ground along the river.
