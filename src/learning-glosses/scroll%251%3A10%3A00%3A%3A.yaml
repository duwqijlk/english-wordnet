simpleMeaning: a written paper that you can roll up into a tube, as a way to keep it
scope: A written paper you roll up to keep, also called roll. Not a round shape of rings, as in leaves
  or flower petals.
examples:
- The king's words were written on a scroll and kept in a box.
- She opened the old scroll and read the names aloud.
