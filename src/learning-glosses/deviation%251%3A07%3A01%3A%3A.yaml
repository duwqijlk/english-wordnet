senseId: 'deviation%1:07:01::'
synsetId: 04810025-n
simpleMeaning: a wrong reading on a compass, caused by a change in magnetism near it (the pull that makes
  a compass point the way it does)
scope: For a compass reading only; not a general move away from what is usual, and not behavior that is
  different from what most people do.
examples:
- The ship's compass showed a deviation because of the iron near it.
- Local magnetic rock can cause deviation in a compass, so sailors allow for it.
