simpleMeaning: To make electricity flow the wrong way through a device, so that it stops working or a
  fuse blows.
scope: This is about an electrical fault, not about time or height.
examples:
- Water got into the wires and shorted the machine.
- The old lamp shorted and blew a fuse.
