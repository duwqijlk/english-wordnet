simpleMeaning: Relating to the people who judge and comment on books, art and similar works, or to their
  judgments.
scope: Relates to reviewers and their judgments, not to the habit of finding faults, and not to something
  being urgently necessary.
examples:
- The film won critical acclaim across Europe.
- Her critical essays were collected in a single volume.
