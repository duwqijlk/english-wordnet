simpleMeaning: To put things into a list, each with its own place, and to sort them into kinds.
scope: Also called catalogue, this is making a list of things and sorting them into kinds, not a book
  that lists things and not just making a list with no sorting.
examples:
- He is cataloging his photographic negatives for the show.
- She cataloged every book on the shelf before the move.
