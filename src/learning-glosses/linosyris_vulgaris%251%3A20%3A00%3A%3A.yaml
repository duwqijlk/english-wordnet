simpleMeaning: A long-lived plant of southern and south-east Europe that flowers early, with flower heads
  much like those of goldenrod.
scope: An early-flowering plant of southern Europe with goldenrod-like flower heads, also called goldilocks,
  goldilocks aster and Aster linosyris; not a true goldenrod and not a garden daisy.
examples:
- Linosyris vulgaris flowers early in the spring in southern Europe.
- The flower heads of Linosyris vulgaris look much like goldenrod.
