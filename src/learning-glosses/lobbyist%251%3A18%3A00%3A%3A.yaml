senseId: 'lobbyist%1:18:00::'
synsetId: 10288326-n
simpleMeaning: a person whose job is to try to talk lawmakers into voting for laws that help the person
  or group who pays them
scope: This is a paid person who tries to change how lawmakers vote. It is not a lawmaker, and not a person
  who only votes in an election.
examples:
- A lobbyist for the train companies met with lawmakers all week.
- The lobbyist tried to get support for a law that would help her company.
