simpleMeaning: A wheel on a rod that pushes on a moving band to steer it or keep it tight.
scope: A wheel on a rod that pushes on a moving band to steer it or keep it tight; idle pulley and idle
  wheel are other names for it, not a wheel that drives a machine and not a wheel that carries a load.
examples:
- The idler pulley keeps the belt pulled tight on the shaft.
- A worn idler pulley made the belt slip.
