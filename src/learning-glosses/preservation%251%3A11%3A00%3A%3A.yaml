simpleMeaning: a case of something getting better because it is kept safe from loss, harm, or other change
scope: 'Also called conservation: a gain that comes from keeping a thing safe, not the work of keeping
  food or bodies from rotting.'
examples:
- The preservation of the old bridge kept it standing for another hundred years.
- Careful preservation of the painting stopped the colours from fading.
