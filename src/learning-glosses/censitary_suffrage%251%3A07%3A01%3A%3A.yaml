simpleMeaning: A way of voting where votes do not count the same, but are weighed by the voter's place
  in the census, so rich folk have more votes than poor folk.
scope: A way of voting where votes do not count the same, also called census suffrage.
examples:
- Censitary suffrage gave the rich more votes.
- Under censitary suffrage, votes weighed differently.
