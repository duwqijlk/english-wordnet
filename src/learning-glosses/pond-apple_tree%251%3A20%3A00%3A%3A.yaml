simpleMeaning: Grown most of all to join other plants onto, this small plant from warm parts of America
  keeps its leaves all year and bears fruit people can eat.
scope: Also called a pond apple, this small plant from warm parts of America is grown most of all to join
  other plants onto, rather than for its fruit alone.
examples:
- The pond-apple tree kept its leaves all year.
- They joined another plant onto the pond-apple tree.
