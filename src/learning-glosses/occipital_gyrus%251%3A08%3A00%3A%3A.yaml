simpleMeaning: Any of the folds on the outer face of the back part of the brain.
scope: A fold on the outer face of the back part of the brain, not a fold on the front part and not the
  deep lines between the two halves.
examples:
- The scan showed a fold in the occipital gyrus.
- Each occipital gyrus is one of the folds on the back part of the brain.
