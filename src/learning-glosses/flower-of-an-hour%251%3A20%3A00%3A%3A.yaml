simpleMeaning: a one-year weedy plant with short-lived yellow blooms with purple centres, from the warm
  Old World lands and now wild as a weed in North America
scope: A one-year weedy plant with short-lived yellow blooms with purple centres; bladder ketmia and flowers-of-an-hour
  are other names for this sense. Not a plant with long-lasting flowers, and not a garden plant grown
  on purpose.
examples:
- The flower-of-an-hour opened its yellow blooms in the morning and they were gone by evening.
- A flower-of-an-hour had spread along the edge of the field.
