simpleMeaning: A plant with a weak stem that holds itself up by climbing, winding, or spreading flat along
  a surface
scope: A climbing plant with a weak stem, not a tree or bush that stands up on its own.
examples:
- The vine climbed up the wall of the house.
- Vines covered the fence in thick green leaves.
