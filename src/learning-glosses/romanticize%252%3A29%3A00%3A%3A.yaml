simpleMeaning: to act in a way that shows love or strong feeling, as a lover would
scope: This is about how a person acts, in a way that shows love. It is not making a thing have a love
  style, and not thinking about a thing as part of a love story.
examples:
- He likes to romanticize on a first date, with flowers, music, and kind words about love.
- They romanticized together under the stars, holding hands and talking about their future.
