simpleMeaning: to upset a person's mind and make them feel uneasy, worried, or afraid
scope: Also called trouble, distract, disorder, disquiet, unhinge, and perturb, it means to upset a person's
  mind with worry or fear, not to upset their body and not to stop them from doing a task.
examples:
- The bad news carked her all night, and she could not sleep.
- Money worries cark him every day.
