simpleMeaning: The stirring of a body part, muscle or gland into action by nerves or by electric signals.
scope: The stirring of a body part, muscle or gland into action by nerves or by electric signals, also
  called irritation and excitation; not the cutting off of feeling and not the resting of a muscle.
examples:
- Innervation made the muscle tighten.
- The doctor checked the innervation of the gland.
