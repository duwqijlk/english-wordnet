simpleMeaning: the one choice that settles a tie, made by the person who leads the meeting
scope: The deciding choice made by the person who leads a meeting to settle a tie, not a first choice
  by any member and not a choice to pick a winner outright.
examples:
- The chairman's casting vote broke the tie.
- With the votes tied, her casting vote decided the matter.
