simpleMeaning: In Norse stories, the wife of Loki, who held a cup over him while he was punished, to keep
  drops of poison from hurting him.
scope: In Norse stories, the wife of Loki, set apart from other wives of the gods by the cup she held
  over him while he was punished.
examples:
- Sigyn held the cup over Loki as the poison dripped down.
- In the old tale, Sigyn stayed beside Loki through his punishment.
