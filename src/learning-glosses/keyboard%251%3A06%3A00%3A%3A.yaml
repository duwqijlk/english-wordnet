simpleMeaning: A board with hooks on it, where keys or locks can be hung
scope: A board with hooks where keys or locks can be hung, not the set of keys on a piano or a computer.
examples:
- He hung his keys on the keyboard by the door.
- The keyboard held a dozen sets of keys on its hooks.
