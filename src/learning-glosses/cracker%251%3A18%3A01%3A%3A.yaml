simpleMeaning: a person who writes computer programs and breaks into computers without leave, usually
  to do harm
scope: A person who writes computer programs and breaks into computers without leave, usually to do harm;
  not the flat cake, not the party gift, and not the firework.
examples:
- The cracker broke into the bank's computers.
- Crackers are often wrongly called hackers.
