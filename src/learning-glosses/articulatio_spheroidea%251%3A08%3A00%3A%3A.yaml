senseId: 'articulatio_spheroidea%1:08:00::'
synsetId: 05603286-n
simpleMeaning: A round ball at the end of one bone sits in a cup-like hollow in the next bone, so the
  joint moves freely
scope: This joint is also called a ball-and-socket joint, cotyloid joint, enarthrodial joint, enarthrosis,
  and spheroid joint, and it moves freely, not a joint that only bends one way.
examples:
- The articulatio spheroidea lets the arm swing in all ways.
- An articulatio spheroidea in the shoulder lets the arm move in all ways.
