simpleMeaning: striking and attention-grabbing, in the way a loud cry is
scope: Something whose bold, startling effect works like a cry, such as sensational headlines or glaring
  colours; not something so intense it makes a person want to cry out, and not the wildly funny sense.
examples:
- The paper ran screaming headlines about the scandal.
- The walls were painted in screaming colours that hurt the eyes.
