simpleMeaning: A unit for how loud a sound is, on a scale that compares a sound with a set quiet level,
  where 10 more means ten times as strong
scope: decibel is another name for this sense; not a unit of pitch and not a unit of power.
examples:
- The noise reached 90 dB near the road.
- A whisper measures about 30 dB.
