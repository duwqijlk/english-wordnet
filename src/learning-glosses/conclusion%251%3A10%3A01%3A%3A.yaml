schema: oewn-learning-gloss-v2
senseId: 'conclusion%1:10:01::'
synsetId: 06765744-n
simpleMeaning: the idea you reach by thinking in a clear, step-by-step way, such as the idea that must
  follow from the two starting ideas given before it
scope: This is the idea reached at the end of clear thinking, not the time when something ends.
examples:
- From those two facts, the only conclusion is that the door was locked from inside.
- His conclusion followed step by step from the facts he had set out at the start.
