simpleMeaning: body waste passed often and in a watery way; it can be a sign of infection, food poisoning,
  a swollen large gut, or a growth in the stomach or gut
scope: 'Also called diarrhoea, looseness, and looseness of the bowels: a health problem of watery waste
  passed often, not a single normal visit to the toilet.'
examples:
- The stomach flu gave him diarrhea for two days.
- She saw a doctor because the diarrhea would not stop.
