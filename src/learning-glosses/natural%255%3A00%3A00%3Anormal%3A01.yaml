schema: oewn-learning-gloss-v2
senseId: natural%5:00:00:normal:01
synsetId: 01599632-s
simpleMeaning: working or happening in the usual way, with nothing abnormal, faulty or missing.
scope: This describes something working or occurring as it usually does, not something that follows the
  course of nature, not something produced by the natural world rather than by people, not what is neither
  magical nor supernatural, not a musical note left neither sharp nor flat, not a relative by blood, not
  an action done on instinct, not goods left unprocessed, not inborn talent, and not behaviour free of
  pretence.
examples:
- The doctor said the child's development was natural in every respect.
- The vet found the horse's gait natural, with no sign of injury.
