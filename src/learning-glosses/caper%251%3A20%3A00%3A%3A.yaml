simpleMeaning: any one of many plants in the Capparis group, a genus (a set of plant kinds that are close
  to each other)
scope: This is the plant itself, not its pickled buds used in food, not a playful jump, and not a silly
  act done for fun.
examples:
- A caper grows wild on the dry hills near the sea.
- This caper has small pink flowers and thick leaves.
