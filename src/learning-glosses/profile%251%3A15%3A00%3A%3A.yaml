simpleMeaning: A vertical slice through the ground showing its different layers.
scope: This is a geological cross-section of the ground, not an outline of a face seen from the side and
  not a graph of someone's characteristics.
examples:
- The geologists studied a soil profile exposed by the road cut.
- The map shows a profile of the rock layers beneath the valley.
