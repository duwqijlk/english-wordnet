senseId: 'hyperbolism%1:10:01::'
synsetId: 92448530-n
simpleMeaning: Saying a thing in a much bigger way than the truth, to make it sound strong.
scope: Saying a thing in a much bigger way than the truth, not a plain lie told to deceive and not a true
  account of what happened.
examples:
- His hyperbolism turned a small cut into a near-fatal wound.
- The writer's hyperbolism made the little town sound like a great city.
