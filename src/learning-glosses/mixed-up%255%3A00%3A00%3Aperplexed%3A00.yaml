schema: oewn-learning-gloss-v2
senseId: mixed-up%5:00:00:perplexed:00
synsetId: 01770645-s
simpleMeaning: Left puzzled and unable to think straight by many things that clash with each other, so
  your mind feels full of muddle
scope: This is feeling puzzled and unable to think clearly when many things you face or hear do not agree;
  lost, confused, bewildered, baffled, bemused, confounded, befuddled, at sea and mazed are other names
  for this feeling.
examples:
- After the long talk she felt mixed-up and could not say what she thought.
- The mixed-up boy stared at the two notes that said opposite things.
