simpleMeaning: Used above all in earlier times as a drug that eases sudden cramps, this American mint
  gives off a sticky juice.
scope: Also called blue skullcap, mad-dog skullcap, and mad-dog weed, this mint of America is the one
  whose sticky juice was used above all in earlier times as a drug that eases sudden cramps.
examples:
- We found blue pimpernel growing in America.
- The blue pimpernel's sticky juice was once used as a drug that eases sudden cramps.
