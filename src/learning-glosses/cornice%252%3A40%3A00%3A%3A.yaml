senseId: 'cornice%2:40:00::'
synsetId: 02357942-v
simpleMeaning: to put a long, sticking-out top part, made to look good, on a building or a wall
scope: This is the act of putting such a top part on, not the top part itself and not the frame that hides
  the top of curtains at a window.
examples:
- The builders corniced the top of the hall with a wide stone band.
- They corniced each room before painting the walls.
