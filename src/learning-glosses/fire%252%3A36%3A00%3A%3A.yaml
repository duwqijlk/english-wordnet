simpleMeaning: To produce a short burst of electricity, as when a nerve cell sends a signal.
scope: This is the electrical-signal sense in a nerve or muscle, not shooting a weapon, not causing a
  gun to go off, not a gun going off or discharging on its own, not setting something alight or destroying
  it by fire, not baking pottery in a kiln, not dismissing someone from a job, not driving someone out,
  not stirring up feelings, not supplying fuel, not igniting or tending a fire, and not the noun senses
  of a burning event, flames, a hearth, the element, warm feeling, cooking fuel, a severe trial, or criticism.
examples:
- The neurons fired rapidly when the signal reached the brain.
- A muscle fires when an electrical signal from a nerve reaches it.
