simpleMeaning: A loose outer garment with a hood, worn in the Middle East and in northern Africa.
scope: A loose hooded garment from the Middle East and northern Africa, not a close-fitting coat and not
  a head covering worn alone.
examples:
- She wore a jellaba over her dress in the market.
- The jellaba hung loose around his shoulders.
