simpleMeaning: to make a high thin creaking or squeaking sound, as a door, a mouse, or a bird does
scope: To make a high thin sound like a door, a mouse, or a bird; not a loud cry and not a low hum.
examples:
- The old gate would chirk each time it moved.
- A mouse chirked somewhere behind the wall.
