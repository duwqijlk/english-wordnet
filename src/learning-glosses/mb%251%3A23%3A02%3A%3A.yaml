simpleMeaning: A measure of how much data, equal to one thousand kilobits, or one million bits.
scope: Also called Mbit and megabit, this is a measure of how much data in bits, not in bytes.
examples:
- The download speed was ten Mb a second.
- A video stream can use several Mb each minute.
