simpleMeaning: a moving part in an electric sound device that shakes to pick up sound waves or to send
  them out
scope: This is the shaking part used for sound. It is not the muscle in the body that helps with breathing,
  not a birth-control cup, and not the camera part that controls light.
examples:
- The diaphragm in the microphone shook as she sang.
- A torn diaphragm in the speaker made the music sound weak.
