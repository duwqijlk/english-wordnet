simpleMeaning: To publicly label someone as shameful or notorious.
scope: This is holding someone up publicly as shameful, rather than formally accusing or condemning them,
  burning an owner's mark into an animal, or stamping goods with a trademark.
examples:
- The newspapers branded him a traitor before any trial took place.
- She was branded a liar after the emails came out.
