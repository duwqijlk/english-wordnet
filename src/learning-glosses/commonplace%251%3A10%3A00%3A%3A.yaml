simpleMeaning: A remark so often heard that it sounds flat and says nothing new.
scope: This is a stale remark; cliche is another name for this sense, not an ordinary remark or the adjective
  for something repeated too often.
examples:
- His speech was full of commonplaces about hard work and honesty.
- '''Nice weather we''re having'' is a commonplace people use to start a chat.'
