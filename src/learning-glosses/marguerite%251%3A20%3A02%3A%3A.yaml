simpleMeaning: A low woody plant of the Canary Islands that lives for years, with flowers like daisies,
  usually pale yellow, often put in the group called Chrysanthemum.
scope: Also called a marguerite daisy; a low woody plant of the Canary Islands with usually pale yellow
  daisy-like flowers, not the tall Eurasian plant with white flowers.
examples:
- A marguerite bloomed pale yellow on the terrace.
- The marguerite from the Canary Islands likes warm sun.
