simpleMeaning: A silvery-haired bush of the middle and south of the United States and Mexico, and a weed
  that gives trouble on open grazing land.
scope: A silvery shrub, also called silvery wormwood; not sagebrush and not a garden herb.
examples:
- Sand sage grows wild across the dry plains of the south-west.
- Sand sage spread across the dry field and crowded out the grass.
