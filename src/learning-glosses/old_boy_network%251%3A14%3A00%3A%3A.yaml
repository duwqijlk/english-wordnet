simpleMeaning: a closed, informal set of ties among people from the same class, job or club, used to pass
  on contacts, news and favours, above all in business or politics
scope: A closed, informal set of ties among people from the same class, job or club, used to pass on contacts,
  news and favours; not a work team and not a public club.
examples:
- The old boy network helped him find a job in the City.
- She got the post through the old boy network of her old school.
