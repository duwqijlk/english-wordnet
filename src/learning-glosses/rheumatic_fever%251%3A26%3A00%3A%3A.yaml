simpleMeaning: Sore, swollen joints and often harm to the valves of the heart mark a bad sickness that
  hits children most of all.
scope: A bad sickness of children with sore, swollen joints and often harm to the valves of the heart,
  not sore joints on their own.
examples:
- Rheumatic fever left her joints sore and swollen.
- Rheumatic fever had harmed the valves of her heart.
