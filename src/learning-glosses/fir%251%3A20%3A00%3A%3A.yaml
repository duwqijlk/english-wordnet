simpleMeaning: a kind of tree that stays green all year and belongs to the group Abies, growing mainly
  on higher ground
scope: The living tree itself, also called fir tree or true fir, not the wood cut from it.
examples:
- A tall fir stood at the edge of the field.
- The firs on the hillside stayed green through the winter.
