simpleMeaning: A dress worn mostly by Hindu women, made of several yards of light cloth wrapped round
  the body.
scope: A long cloth dress worn mostly by Hindu women, also called sari; not a Western dress and not a
  shawl worn over the shoulders.
examples:
- She wore a bright red saree to the wedding.
- Her saree was wrapped round her in soft folds.
