simpleMeaning: the way heat moves through a liquid or a gas as its tiny parts move
scope: The way heat moves through a liquid or gas as its tiny parts move; not the rising of warm air in
  the sky, and not heat moving through a solid.
examples:
- Convection carries heat through the water as it warms up in the pot.
- The room warmed by convection as the hot air rose and cool air sank.
