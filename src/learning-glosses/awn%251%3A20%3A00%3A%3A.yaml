simpleMeaning: A thin stiff hair-like part that grows on the small leaves around the seeds of grasses.
scope: A thin hair-like part on grass seed leaves, not a thorn and not a grain itself.
examples:
- The awns of the barley caught on her sleeve.
- Each grain of wheat has a slender awn at its tip.
