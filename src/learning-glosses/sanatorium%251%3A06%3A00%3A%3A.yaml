simpleMeaning: a hospital where people rest and get better, or get care for diseases that last a long
  time
scope: This is a hospital for rest and care for long-lasting diseases, not the rude name for a hospital
  for people with mental illness.
examples:
- After his long illness, he stayed at a sanatorium to rest and get better.
- The sanatorium cared for people with diseases that lasted for many years.
