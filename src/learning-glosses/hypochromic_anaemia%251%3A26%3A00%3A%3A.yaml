simpleMeaning: a blood condition where each red blood cell holds too little of the red matter that carries
  oxygen
scope: A blood condition in which each red cell holds too little of the red matter that carries oxygen;
  hypochromic anemia is another name for this sense, not a lack of red cells and not a short-term loss
  of blood.
examples:
- Her hypochromic anaemia left her tired after climbing the stairs.
- The doctor found hypochromic anaemia in his blood test.
