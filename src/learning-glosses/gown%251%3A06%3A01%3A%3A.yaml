simpleMeaning: a long loose outer garment that flows down, worn for official events or ceremonies
scope: Also called robe, a long loose outer garment for official events or ceremonies, not a woman's long
  dress for a dance and not a loose dress worn in bed.
examples:
- The judge wore a black gown as she took her seat in court.
- Graduates walked in long gowns at the ceremony.
