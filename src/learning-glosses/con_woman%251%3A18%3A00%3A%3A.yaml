simpleMeaning: a female cheat who wins the trust of the person she cheats and then takes their money
scope: A female cheat who wins a victim's trust first, and confidence woman is another name for this sense,
  not a male cheat and not a plain thief.
examples:
- The con woman charmed the shopkeeper before taking his cash.
- Police said the con woman had tricked several people out of their savings.
