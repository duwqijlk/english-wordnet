simpleMeaning: A meter that says if two beats keeping time are together, especially a meter helping a
  pilot line up a twin-engined plane's airscrews.
scope: This sense is also called synchroniser, synchronizer, and synchronoscope.
examples:
- A synchroscope said the beats were together.
- Synchroscopes help pilots.
