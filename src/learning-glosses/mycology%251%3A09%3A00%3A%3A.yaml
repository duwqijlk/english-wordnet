simpleMeaning: The part of plant study that looks at fungi and the sicknesses fungi cause.
scope: The study of fungi and the sicknesses they cause, not the study of plants as a whole and not the
  study of germs.
examples:
- She studied mycology at university.
- His mycology course covered the fungi that rot wood.
