simpleMeaning: A European shrub that loses its leaves in autumn, turning a deep wine colour, and has dull
  white flowers
scope: A European shrub that loses its leaves in autumn and has dull white flowers, also called blood-twig
  or pedwood; not the North American shrub with white flowers and dark twigs.
examples:
- Red dogwood turns colour in the autumn garden.
- The red dogwood by the gate has dull white flowers.
