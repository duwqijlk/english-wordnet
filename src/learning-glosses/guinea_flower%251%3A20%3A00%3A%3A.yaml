simpleMeaning: Warm lands grow this evergreen climber from Australia and nearby lands far and wide, one
  of several kinds with big bright yellow single blooms.
scope: People also call this climber guinea gold vine, and it is one of several kinds grown in warm lands
  for its big bright yellow blooms.
examples:
- The guinea flower shows big yellow blooms.
- Guinea flowers are grown in warm lands for their bright blooms.
