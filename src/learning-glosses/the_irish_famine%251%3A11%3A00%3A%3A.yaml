simpleMeaning: A time of great hunger in Ireland from potato blight; between 1846 and 1851 a million people
  starved to death and 1.6 million left, most for America.
scope: 'Also called the Great Calamity, the Great Hunger and the Great Starvation: a famine in Ireland
  from potato blight, in which a million people starved and 1.6 million left between 1846 and 1851, not
  a war and not a famine in another land.'
examples:
- The Irish Famine drove 1.6 million people from Ireland.
- During the Irish Famine, potato blight left Ireland hungry.
