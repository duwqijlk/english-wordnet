senseId: 'immunochemical_assay%1:09:00::'
synsetId: 05748505-n
simpleMeaning: A test that finds what a substance is, most of all a protein, by how it sets off the body's
  defence
scope: A test that finds what a substance is by how it sets off the body's defence, also called immunoassay;
  not a test that measures how much of it there is and not a test done on blood alone.
examples:
- PSA in the blood can be measured with an immunochemical assay.
- The doctor ordered an immunochemical assay to find the protein.
