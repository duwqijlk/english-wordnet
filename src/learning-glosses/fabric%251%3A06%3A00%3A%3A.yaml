simpleMeaning: Material made when threads are woven, knitted, felted, or crocheted together, from plant,
  animal, or man-made fibres
scope: Also called material and cloth, it is made by joining threads, not a single thread and not a finished
  garment.
examples:
- She chose a soft blue fabric for the dress.
- The fabric in the curtains was light and let in the sun.
