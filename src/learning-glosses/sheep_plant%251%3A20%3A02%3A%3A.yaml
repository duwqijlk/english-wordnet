simpleMeaning: Its leaves are thickly covered in yellow-brown hairs, and the whole herb from New Zealand
  lies low and thick, like a pad pressed to the ground.
scope: This New Zealand herb is also called vegetable sheep, and it lies low and thick, unlike its same-name
  kin whose pale, woolly leaves lie flat on the ground.
examples:
- The sheep plant grows low and thick in New Zealand.
- The sheep plant looked like a soft pad, its leaves thick with yellow-brown hairs.
