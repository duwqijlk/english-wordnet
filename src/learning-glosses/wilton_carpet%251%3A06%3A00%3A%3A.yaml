simpleMeaning: A floor covering woven on a Jacquard loom, a loom that weaves patterns, with loops like
  a Brussels floor covering but cut to make a close soft pile.
scope: A floor covering woven on a Jacquard loom, with cut loops making a close soft pile, close to the
  Brussels floor covering with uncut loops; also called Wilton.
examples:
- The Wilton carpet in the hall had a close velvety pile.
- We chose a Wilton carpet for the stairs because it wears well.
