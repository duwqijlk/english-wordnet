simpleMeaning: Pink, blue, or white blooms in bunches along a stem grow on this plant from Europe, Asia,
  and Africa, with narrow leaves at the base.
scope: People also call it squill.
examples:
- The scilla had blue blooms in bunches along a stem.
- The scilla had narrow leaves at the base.
