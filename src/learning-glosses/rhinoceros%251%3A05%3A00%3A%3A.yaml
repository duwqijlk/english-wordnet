simpleMeaning: a very large, strong plant-eating animal of south-east Asia and Africa, with hooves, an
  odd number of toes, very thick skin, and one or two horns on its nose
scope: 'Also called rhino: this very large plant-eating animal with thick skin and a horn on its nose,
  not any other large animal of Africa or Asia.'
examples:
- A rhinoceros with two horns walked across the dry grass.
- The rhinoceros at the zoo has very thick skin and eats only plants.
