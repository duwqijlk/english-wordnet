senseId: 'merchandising%1:06:01::'
synsetId: 80664327-n
simpleMeaning: Goods for sale that carry the name or sign of another product, especially a film or a pop
  group, to make that product better known
scope: This sense is the goods themselves, also called merchandise; it is not the work of showing and
  selling goods in a shop.
examples:
- The film's merchandising includes shirts and toys with its hero's picture on them.
- Fans bought a lot of merchandising for the pop group, such as hats with its name on them.
