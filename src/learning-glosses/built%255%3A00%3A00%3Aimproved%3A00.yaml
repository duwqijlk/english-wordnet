simpleMeaning: having an extra substance added to a soap or cleaner so that it works better.
scope: This is not the usual meaning 'made or constructed'; it describes only soap and cleaning products
  with added ingredients.
examples:
- This built soap cuts through grease faster than plain soap.
- The label says the cleaning powder is built with minerals for extra strength.
