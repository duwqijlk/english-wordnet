senseId: 'measured_rhythm%1:10:01::'
synsetId: 92416667-n
simpleMeaning: a kind of beat in which each sound lasts a whole or a part of a set length, but no strong
  beat comes back at set times
scope: A beat whose sounds are set lengths with no strong beat coming back at set times; not free rhythm,
  and not a march beat.
examples:
- The measured rhythm of the piece gave each note a set length without a regular accent.
- Composers use measured rhythm when they want sounds of set length and no strong beat.
