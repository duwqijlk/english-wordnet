simpleMeaning: A tree with a narrow top, found in the east of North America
scope: Also called big-toothed aspen, bigtooth aspen, bigtoothed aspen, and large tooth aspen, this is
  a tree with a narrow top in the east of North America, not a different kind of aspen with a wide top.
examples:
- The large-toothed aspen stood at the edge of the wood, its top a thin point against the sky.
- We found a large-toothed aspen growing near the road in the east.
