simpleMeaning: the way of doing a thing that takes the smallest amount of work
scope: The way of doing a thing that takes the smallest amount of work, with least effort as another name
  for this sense; not the hardest way, and not the quickest way.
examples:
- Water finds the least resistance downhill.
- He took the least resistance and let the others decide.
