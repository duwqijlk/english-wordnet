simpleMeaning: A lamp where a flame points at a long round piece of lime and a lens brings the light together;
  it was used in the past to light a stage
scope: Also called calcium light, this is a real lamp once used on stage; it is not the common use of
  the word for being the centre of public attention.
examples:
- The old theatre lit its stage with a limelight.
- A limelight burned brightly at the front of the stage.
