simpleMeaning: having to do with cerium, a metal, above all when it joins with other things four at a
  time
scope: Having to do with cerium, a metal, above all when it joins with other things four at a time, not
  with cerium that joins three at a time and not with a different metal.
examples:
- The ceric salt held cerium in its four-way form.
- Chemists chose a ceric compound because the metal joined with other things four at a time.
