simpleMeaning: A porcupine of the north-east of North America, its barbed quills hidden in coarse fur;
  it often chews buildings for salt and fat.
scope: Also called a Canada porcupine; a porcupine of the north-east of North America with barbed quills
  hidden in coarse fur, known for chewing buildings for salt and fat, kin to other porcupines.
examples:
- Erethizon dorsatum gnawed the cabin wall for salt and grease.
- The Erethizon dorsatum in the woods has barbed quills hidden in coarse fur.
