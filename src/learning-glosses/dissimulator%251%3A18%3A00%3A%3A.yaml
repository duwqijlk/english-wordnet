senseId: 'dissimulator%1:18:00::'
synsetId: 10215212-n
simpleMeaning: a person who says they believe things they do not believe, in order to hide what they really
  feel or want
scope: A person who says they hold views they do not hold, to hide their real feelings or aims, also called
  a phony, a hypocrite, a pretender, a dissembler and a phoney; not a person who merely lies about facts.
examples:
- The dissimulator praised the plan while working against it.
- She saw through the dissimulator at once.
