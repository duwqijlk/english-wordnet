simpleMeaning: A mark on the skin that was there from before a baby was born
scope: A mark on the skin present from before birth, not a cut or bruise and not a spot that comes later.
examples:
- She has a small birthmark on her left cheek.
- The birthmark on his arm has been there since he was born.
