simpleMeaning: A device with a flap or gate that sets how fast water runs through a channel
scope: A device with a flap or gate that sets how fast water runs through a channel, also called sluicegate,
  floodgate, head gate, penstock or water gate; not a tap on a pipe and not a dam wall.
examples:
- The sluice valve let more water into the mill race.
- He shut the sluice valve to stop the flow.
