simpleMeaning: the sick breaking down of cells when their outer skin is destroyed
scope: The sick breaking down of cells when their outer skin is destroyed; not the normal splitting of
  a cell and not the death of whole tissue.
examples:
- Cytolysis destroyed the cells' outer skin.
- The drug caused cytolysis in the sick cells.
