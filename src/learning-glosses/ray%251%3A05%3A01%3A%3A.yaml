simpleMeaning: one of the stiff thin bones in the flat fin of a fish
scope: A thin stiff bone inside a fish's fin; not a line of light or energy, not a small flower stem,
  and not the verb sense of spreading out from a center.
examples:
- He counted the rays in the fish's fin.
- The rays give the flat fin of the fish its shape.
