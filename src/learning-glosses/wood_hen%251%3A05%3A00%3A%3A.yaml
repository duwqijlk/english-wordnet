simpleMeaning: This bird of New Zealand cannot fly, has short wings each with a sharp point for fighting,
  and is given to stealing.
scope: Also called maori hen and weka, this is the flightless bird of New Zealand with short wings each
  with a sharp point for fighting and a habit of stealing.
examples:
- In New Zealand, wood hen cannot fly, but it can fight with the sharp points on its short wings.
- Short wings with sharp points let wood hen fight, though it cannot fly.
