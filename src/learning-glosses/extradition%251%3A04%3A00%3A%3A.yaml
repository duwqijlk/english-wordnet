synsetId: 00214349-n
simpleMeaning: the act of handing over a person accused or found guilty of a crime from one state or country
  to another, usually under a law or agreement
scope: This is handing a suspect or convict over to another state or country; not a trial and not sending
  a person home on their own.
examples:
- The extradition took months to arrange under the treaty.
- He faced extradition to the country where the crime took place.
