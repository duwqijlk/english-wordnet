simpleMeaning: A substance made in the kidney, with the help of vitamin K, that helps blood clot
scope: A substance made in the kidney that helps blood clot; cothromboplastin is another name for this
  sense, not a substance made elsewhere in the body.
examples:
- Proconvertin is made in the kidney.
- Without vitamin K, the body cannot make proconvertin.
