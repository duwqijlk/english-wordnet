senseId: narrowing%5:00:00:narrow:00
synsetId: 02572965-s
simpleMeaning: Said of a state of affairs that tends to shut in a person's freedom and leave less room
  to act.
scope: Said of circumstances that press in on a person's freedom, not a thing growing narrower by itself
  and not the act of making a thing narrower.
examples:
- The narrowing rules left the workers with almost no freedom to choose.
- Life under the narrowing laws felt shut in on every side.
