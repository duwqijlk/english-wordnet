simpleMeaning: Broad leaves folded along their length and white, yellow, or rose-coloured flowers mark
  any of several showy orchids of this kind.
scope: Showy orchids with broad leaves folded along their length, not a small wild orchid or a tree orchid.
examples:
- The calanthe in the pot has white flowers.
- Calanthe leaves fold along their length.
