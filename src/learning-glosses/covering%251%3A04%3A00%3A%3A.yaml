senseId: 'covering%1:04:00::'
synsetId: 00829743-n
simpleMeaning: The act of keeping a thing safe by putting something over it
scope: This is the act of keeping a thing safe by putting something over it, not a made thing that lies
  over something, and not the act of hiding a thing by blocking the view of it.
examples:
- The covering of the plants kept them safe from the frost.
- Covering the food kept the flies off it.
