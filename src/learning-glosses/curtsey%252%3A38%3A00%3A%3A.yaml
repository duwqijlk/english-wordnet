simpleMeaning: to bend the knees as a sign of respect when saying hello to someone
scope: 'Also called curtsy: to bend the knees to show respect when you greet someone, not the noun name
  for that bending movement itself.'
examples:
- She curtseyed when she met the queen.
- The young girl curtseyed to her teacher as a sign of respect.
