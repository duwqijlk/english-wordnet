simpleMeaning: Year after year, a climbing growth in the dry lands of central and southwestern United
  States and Mexico bears small hard spotted green fruit no one eats.
scope: Also called buffalo gourd, calabazilla, prairie gourd, and prairie gourd vine, this dry-ground
  vine of central and southwestern United States and Mexico is known by its small hard spotted green fruit
  that no one eats.
examples:
- The wild pumpkin came back year after year in the dry ground.
- No one eats the wild pumpkin fruit, hard and spotted green as it is.
