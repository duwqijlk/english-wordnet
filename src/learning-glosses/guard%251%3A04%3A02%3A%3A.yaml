simpleMeaning: In American football, one of the two slots on the attacking line, each beside the center
  and inside a tackle.
scope: This is the football role itself, not the player who fills it, and not a basketball position.
examples:
- He switched from center to guard this season.
- The coach rotated him between guard and tackle.
