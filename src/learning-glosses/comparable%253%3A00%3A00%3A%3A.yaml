simpleMeaning: able to be looked at side by side with another thing to see how they are alike and different,
  or worth looking at in that way
scope: Able to be put side by side and checked, or worth that check; this does not by itself say the two
  things are alike in size or quality.
examples:
- The two phones are comparable, so we can check them side by side before we choose one.
- These two sets of results are comparable and worth studying together.
