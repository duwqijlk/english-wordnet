simpleMeaning: In accounting, the worth of a business from the advantage and good name it has built up,
  beyond the worth of the things it owns
scope: In accounting, the worth of a business from the advantage and good name it has built up, beyond
  the worth of the things it owns; not a kind feeling toward others.
examples:
- The sale price included a large sum for goodwill.
- Goodwill can be worth more than the shop itself.
