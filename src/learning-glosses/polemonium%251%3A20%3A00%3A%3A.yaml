simpleMeaning: One of a large group of plants, most of which grow low and often smell bad, from mild lands
  to the far north.
scope: Other low-growing plants of mild lands and the far north are its nearest kin, but most of these
  often smell bad.
examples:
- This polemonium grows low and smells bad.
- In the far north, polemonium grows low.
