simpleMeaning: In maths, the angle that has a given number as the ratio of the side next to it to the
  side across from it in a right-angled triangle.
scope: 'Also called arccotangent and inverse cotangent: the angle worked out from a given number, not
  the cotangent itself and not the angle from a different triangle ratio.'
examples:
- The arc cotangent of 1 is 45 degrees.
- Use the arc cotangent to find the angle from the ratio.
