simpleMeaning: a tool that a person uses to copy the sounds a bird makes
scope: A tool for copying a bird's sounds. It is not the sound itself that a bird makes on its own.
examples:
- He used a birdcall to copy the robin's song.
- She blew into the birdcall and it sounded like a duck.
