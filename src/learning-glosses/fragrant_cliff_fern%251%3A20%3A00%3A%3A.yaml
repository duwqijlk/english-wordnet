simpleMeaning: A leafy plant of northern Eurasia and North America with sweet-smelling leaves.
scope: A sweet-smelling leafy plant of the far north; fragrant shield fern and fragrant wood fern are
  other names for this sense, not a sweet-smelling flower and not a leafy plant of the warm south.
examples:
- The fragrant cliff fern grew on the cool north slope.
- We found a fragrant cliff fern with sweet-smelling leaves by the path.
