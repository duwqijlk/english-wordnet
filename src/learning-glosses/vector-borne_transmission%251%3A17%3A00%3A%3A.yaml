simpleMeaning: A sickness germ reaches a person not straight from another sick person but when a small
  carrier, such as a biting insect, bites or touches them.
scope: This is one way a sickness germ passes from place to place, through a small carrier that bites
  or touches a person rather than straight from one sick person to another.
examples:
- The sickness germ reached new people by vector-borne transmission when a biting insect bit them.
- A biting insect can pass the sickness germ on by vector-borne transmission.
