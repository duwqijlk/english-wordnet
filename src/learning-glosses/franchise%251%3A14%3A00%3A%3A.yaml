simpleMeaning: a business set up or run with permission from a company to sell or supply its goods or
  services in one set area
scope: This sense is the business itself, also called a dealership, not the right to vote given by law
  and not the permission to sell on its own.
examples:
- She opened a coffee franchise in our town.
- The fast-food franchise near the station is run by a local family.
