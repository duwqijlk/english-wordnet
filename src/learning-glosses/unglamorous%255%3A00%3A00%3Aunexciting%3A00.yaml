simpleMeaning: not hard or testing, and dull with no excitement
scope: Also called commonplace, prosaic, and humdrum, this describes something that is dull and not testing,
  not something that is exciting or hard to do.
examples:
- He had an unglamorous job cleaning the factory floors.
- Sorting letters is unglamorous work, but someone has to do it.
