simpleMeaning: a small sea fish with a short flat-sided body and weak sharp points
scope: A small sea fish with a short flat body and weak sharp points, not the slippery food fish of the
  northern Atlantic coast, and not a large deep-sea fish.
examples:
- The fisherman pulled a small butterfish from the net.
- A butterfish swam past the rocks, its short body flashing in the clear water.
