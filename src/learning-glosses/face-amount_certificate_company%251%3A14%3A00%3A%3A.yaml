simpleMeaning: An investment firm watched over by the rules that pays a set sum to holders of its paper
  on the set day it comes due.
scope: A rules-watched firm that pays a set sum to paper holders on the set due day, not an ordinary bank
  and not a firm that sells shares.
examples:
- She put her savings in a face-amount certificate company.
- The face-amount certificate company paid the set sum on the due date.
