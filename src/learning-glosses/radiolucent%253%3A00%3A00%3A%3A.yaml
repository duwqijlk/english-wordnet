simpleMeaning: Almost fully letting through rays used to see inside the body and other rays
scope: Almost fully letting through rays used to see inside the body and other rays, not blocking them
  and not letting through only the light we can see.
examples:
- The radiolucent tissues let the rays pass almost fully through them.
- A radiolucent cover lets the rays used to see inside the body pass through it.
