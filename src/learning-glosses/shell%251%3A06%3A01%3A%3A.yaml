simpleMeaning: a metal cover of the same thickness all over, such as the guard fixed to a big gun to keep
  its crew safe
scope: 'Also called scale and plate: a metal cover of even thickness, not bullets for a big gun and not
  the hard cover of a sea animal.'
examples:
- A shell of metal guards the gunners on the big gun.
- The shell on the gun is the same thickness all over.
