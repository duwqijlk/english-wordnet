senseId: 'strep%1:05:00::'
synsetId: 01383685-n
simpleMeaning: round bacteria that stay purple in a lab test, in pairs or chains; they cause illnesses
  such as scarlet fever and tonsillitis (swollen parts at the back of the throat)
scope: Also called streptococcus and streptococci, this is the round bacteria itself, not an illness it
  causes and not the word that describes something caused by it.
examples:
- The lab test found strep in the sample from his throat.
- Strep can spread in pairs and chains and make people ill with a sore throat.
