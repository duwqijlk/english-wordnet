simpleMeaning: A serious infection of rodents, sometimes deadly, caused by a bacterium; it reaches people
  by accident when a flea that has bitten an infected animal bites them.
scope: Another name for the plague, the same disease as pestilence and pestis, not a destructive insect
  or other animal, an annoying person, or any epidemic disease in general.
examples:
- Fleas from infected rats can carry pest to people.
- The old records describe how pest spread through the town.
