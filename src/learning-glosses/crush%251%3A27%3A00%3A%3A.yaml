simpleMeaning: leather whose natural surface lines have been made stronger and clearer to see
scope: This is a kind of leather, not the act of pressing something hard and not pressing or hurting something
  so it is badly hurt.
examples:
- The bag was made of brown crush leather, and its surface lines stood out clearly.
- She chose crush leather for the shoes because its natural lines had been made clearer to see.
