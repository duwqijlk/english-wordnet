simpleMeaning: one of the two main parts of a sentence, the part that has the action word and the words
  that go with it
scope: 'Another name for a predicate: the part of a sentence with the action word, not the part that names
  who or what the sentence is about.'
examples:
- In the sentence 'She runs fast', the verb phrase is 'runs fast'.
- A verb phrase can be long, as in 'has been working all day'.
