simpleMeaning: Ceramics and enamels are made with this pale, crystalline mineral, a sodium or potassium
  aluminum silicate.
scope: Another name for nepheline, the same pale silicate mineral; it is not nepheline syenite, the rock
  that contains it, nor nephelinite, the volcanic rock named after it.
examples:
- A thin section of the rock showed grains of nephelite.
- The enamel factory grinds nephelite into a fine powder for its glazes.
