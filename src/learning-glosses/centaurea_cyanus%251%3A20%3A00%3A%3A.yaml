simpleMeaning: A one-year plant of Eurasia grown in North America, with showy heads of blue, purple, pink
  or white flowers.
scope: Also called bluebottle, cornflower and bachelor's button; a one-year plant with showy heads of
  blue, purple, pink or white flowers, among the one-year plants grown for their flowers.
examples:
- The Centaurea cyanus showed heads of blue and white flowers.
- Centaurea cyanus is a one-year plant of Eurasia grown in North America.
