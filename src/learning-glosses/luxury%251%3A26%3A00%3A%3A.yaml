simpleMeaning: great wealth, as shown by a way of living with the best and most expensive things
scope: This sense is wealth shown by an expensive way of living, not one single expensive thing that a
  person enjoys.
examples:
- They lived in luxury, with fine food, soft clothes, and a very large house.
- Her life of luxury made her family's great wealth clear to everyone.
