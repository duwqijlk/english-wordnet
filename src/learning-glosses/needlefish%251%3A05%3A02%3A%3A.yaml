simpleMeaning: a long thin fish from European waters that swims just below the surface, seizes its food
  in long toothed jaws, and is found in great numbers along the shore
scope: 'Also called gar and billfish: a long thin hunting fish of Europe that stays near the top of the
  water, not the other needlefish with a long tube-like snout and a slim body covered in bony plates.'
examples:
- A needlefish flashed near the top of the water as we crossed the bay.
- The needlefish caught small fish with its long jaws full of teeth.
