simpleMeaning: Protection against sickness that a person is born with, part of the way the body is made.
scope: Protection against sickness that comes with birth, not protection gained from a shot or from having
  had the sickness; also called innate immunity.
examples:
- Her natural immunity kept her well through the winter.
- Natural immunity is part of the way a child's body is made.
