senseId: 'polychromize%2:30:00::'
synsetId: 00285573-v
simpleMeaning: To cover a thing with many different colours, so it shows a mix of shades
scope: This is the act of covering a thing with many colours; polychrome and polychromise are other names
  for this sense, not painting a thing one plain colour.
examples:
- She will polychromize the old chair in many colours.
- He polychromized the frame in red, blue and gold.
