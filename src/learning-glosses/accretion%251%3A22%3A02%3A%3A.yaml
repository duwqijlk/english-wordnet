simpleMeaning: In biology, growth by adding parts or bits that stick together.
scope: In biology, growth by adding parts or bits that stick together, not the forming of a star or planet
  by gravity pulling things together, not a larger share of a will left to one person when another person
  dies, fails to meet a condition, or turns it down, and not new land built up by earth left by water.
examples:
- The accretion of shell layers built up the reef.
- Accretion added new cells to the growing part.
