simpleMeaning: made so that bullets cannot go through it
scope: Describes a thing that bullets cannot go through; not the verb of the same name, to make a thing
  that way, and not a plan said to be unable to fail.
examples:
- The car was fitted with bulletproof glass.
- He wore a bulletproof vest at work.
