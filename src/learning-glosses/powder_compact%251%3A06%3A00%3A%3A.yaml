simpleMeaning: A small case for face creams, with a mirror inside, made to be carried in a woman's handbag
scope: A small case with a mirror for face creams, also called a compact, not a case for medicines and
  not a large box kept at home.
examples:
- She opened her powder compact to check her face in its small mirror.
- Her powder compact was small enough to fit in her handbag.
