simpleMeaning: Held together by silica, a hard mineral, this rock built up from layers is not shale, and
  it has no flat splits like slate
scope: It is a rock built up from layers, held together by silica, not shale itself and not slate itself.
examples:
- Silica holds this argillite together, unlike shale.
- Argillite has no flat splits the way slate does.
