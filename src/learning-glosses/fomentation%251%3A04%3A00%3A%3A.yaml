simpleMeaning: starting trouble or bad feeling between people on purpose
scope: 'Also called instigation: starting trouble on purpose, not a warm wet cloth used to ease pain,
  and not an accident.'
examples:
- His fomentation of the quarrel turned the whole meeting against him.
- The report blamed her for the fomentation of bad feeling in the office.
