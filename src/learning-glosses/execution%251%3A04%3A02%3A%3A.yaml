simpleMeaning: the act of doing something well, by putting what you know into action, not just knowing
  it
scope: 'Also called performance: doing something well by using what you know, not signing a legal paper
  and not a court order to carry out a judgment.'
examples:
- His execution of the plan was smooth and showed great skill.
- The execution of the dance showed years of practice and knowledge in action.
