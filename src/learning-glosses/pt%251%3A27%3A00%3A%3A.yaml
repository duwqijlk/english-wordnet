simpleMeaning: A heavy, costly metal, grey-white and not easily worn away by air or chemicals, found in
  nickel and copper ores and at times in pure lumps in the ground.
scope: This is the heavy, costly grey-white metal, also called platinum and atomic number 78, not gold
  or silver.
examples:
- Pt is a heavy metal that is not easily worn away by air.
- Miners found Pt in nickel ores in the hills.
