simpleMeaning: to kill someone because they will not give up their faith
scope: To kill a person for holding to their faith, not to make a person suffer as a martyr is made to
  suffer, and not the noun sense of a person who dies for their faith.
examples:
- Saint Sebastian was martyred for his faith.
- The rulers martyred those who would not give up their beliefs.
