senseId: 'marital_communications_privilege%1:07:00::'
synsetId: 05187813-n
simpleMeaning: While they were married, what one said in private may not be told to others by the husband
  or wife
scope: Also called husband-wife privilege, this is the rule that a husband or wife may not tell others
  the private things the other said while they were married, not a ban on all talk between husband and
  wife.
examples:
- Under marital communications privilege, she could not repeat what her husband had told her.
- The judge said marital communications privilege kept his wife's words out of the trial.
