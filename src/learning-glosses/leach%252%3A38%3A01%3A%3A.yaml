simpleMeaning: To make a liquid run slowly through something.
scope: This is making a liquid run slowly through something; not washing things out of soil, and not the
  liquid spreading slowly on its own.
examples:
- He leached water slowly through the soil in the pot.
- She leached the water through sand and stones.
