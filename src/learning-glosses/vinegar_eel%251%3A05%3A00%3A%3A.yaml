simpleMeaning: In sour liquids lives a tiny worm that eats the tiny living things that turn them sour,
  such as the sharp liquid it is named for.
scope: Also called vinegar worm, it lives in sour liquids, feeding on the tiny living things that make
  them ferment.
examples:
- The vinegar eel feeds on the tiny living things in the sour liquid.
- We found a vinegar eel in the jar of vinegar.
