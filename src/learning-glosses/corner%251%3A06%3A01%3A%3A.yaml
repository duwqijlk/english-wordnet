simpleMeaning: In architecture, the solid outer edge where two walls of a building meet, especially one
  built around a large stone at the base
scope: This is the outside angle of a building, not the inside angle where two walls meet in a room, and
  not the place where two streets cross.
examples:
- We walked around the corner of the building to get out of the wind.
- A drainpipe runs down the corner of the house.
