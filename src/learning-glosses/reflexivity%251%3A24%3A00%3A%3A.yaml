simpleMeaning: the link between a word like 'himself' and the person or thing it points back to in a sentence
scope: 'Also called reflexiveness: the link between a word like ''himself'' and the person or thing it
  points back to, not the logic and maths sense of a thing tied to itself, and not a word that points
  to someone else.'
examples:
- In 'Maria cut herself', the reflexivity links 'herself' to Maria.
- The reflexivity in 'The dog washed itself' ties 'itself' back to the dog.
