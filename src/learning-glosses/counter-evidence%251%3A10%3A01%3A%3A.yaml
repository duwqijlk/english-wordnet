senseId: 'counter-evidence%1:10:01::'
synsetId: 92446198-n
simpleMeaning: In philosophy, law and the sciences, facts that tend to show that a claim or idea is wrong
scope: This is facts that tend to show a claim or idea is wrong; counterevidence is another name for it;
  not facts that back a claim up, and not a full proof that settles the question.
examples:
- The new tests gave counter-evidence that went against the old theory.
- She found counter-evidence that the claim was false.
