simpleMeaning: a machine that throws seed, plant food, sand, or other things out in all directions
scope: Also called spreader, this is a machine for throwing seed or sand out widely; it is not a person
  who speaks on radio or television.
examples:
- The farmer used a broadcaster to spread seed over the field.
- A broadcaster threw sand evenly across the icy road.
