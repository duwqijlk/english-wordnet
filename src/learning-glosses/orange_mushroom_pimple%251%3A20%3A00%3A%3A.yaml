simpleMeaning: A red-yellow kind of the small growth that forms on fungi
scope: A red-yellow kind of the small growth that forms on fungi; not a growth on plants and not a mushroom
  that grows on its own.
examples:
- She found an orange mushroom pimple covering a white mushroom in the woods.
- The orange mushroom pimple turned the white mushroom bright red.
