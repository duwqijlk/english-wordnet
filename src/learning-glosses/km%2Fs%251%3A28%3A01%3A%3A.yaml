simpleMeaning: In one sixtieth of a minute, a thing covers a length counted in thousands of metres, and
  that length is its speed
scope: A measure of speed, also called kilometers per second and kilometres per second; not a distance
  and not a time.
examples:
- Light travels at almost 300,000 km/s in a vacuum.
- The rocket reached a speed of 11 km/s.
