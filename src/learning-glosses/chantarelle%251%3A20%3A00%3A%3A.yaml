simpleMeaning: A deep yellow mushroom found in many lands, good to eat, with a smooth top and a sweet
  smell like apricots.
scope: Also called chanterelle; a yellow mushroom good to eat, not a poisonous yellow mushroom.
examples:
- We picked chantarelles in the woods for supper.
- The chantarelle smells faintly of apricots.
