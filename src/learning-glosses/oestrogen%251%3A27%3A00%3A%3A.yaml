simpleMeaning: The general name for female sex hormones, a kind of fat-like stuff called a steroid, given
  out by the ovary and bringing about the usual female features of the body.
scope: Also called estrogen, it is a general name for the female sex hormones given out by the ovary.
examples:
- The doctor said her oestrogen levels were low.
- Oestrogen helps the body develop female features at puberty.
