simpleMeaning: a metal thing that rings, set high in a place of worship, most often rung to call people
  to a service
scope: A ringing thing set high in a place of worship that calls people to a service, not a small hand
  bell and not a door bell.
examples:
- The church bell rang out across the town.
- We heard the church bells calling us to the service.
