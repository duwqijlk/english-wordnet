simpleMeaning: the title a student gets from a two-year college after finishing its course of study with
  success
scope: This is the title from a two-year college, not a person with a lower place in a group or business,
  and not the act of joining or linking things together.
examples:
- She earned an associate degree at her local two-year college.
- His associate degree in nursing took two years to finish.
