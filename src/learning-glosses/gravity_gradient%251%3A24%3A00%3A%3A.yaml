simpleMeaning: How the pull on one part of a thing that is not round differs from the pull on another
  part
scope: How the pull differs from one part of a thing that is not round to another, not a pull that is
  the same all over and not the shape of the thing itself.
examples:
- The gravity gradient of the moon causes the ocean tides on Earth.
- The gravity gradient pulls harder on the near side of the moon than on the far side.
