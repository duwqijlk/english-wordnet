simpleMeaning: To do with more than one kind of being, apart from sex differences, in a breeding group.
scope: To do with more than one kind of being, apart from sex differences, in a breeding group; not to
  do with the forming of a compound into two or more unlike crystal shapes.
examples:
- Their stock was polymorphous at dawn.
- The group was polymorphous by nature.
