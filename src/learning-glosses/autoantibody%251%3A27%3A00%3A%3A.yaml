simpleMeaning: a part of the body's own defence system that attacks the body's own tissues
scope: A defence that attacks the body's own tissues, not a defence that attacks germs from outside the
  body.
examples:
- The doctor found autoantibodies in her blood and knew her body was attacking itself.
- His autoantibody levels rose as the illness got worse.
