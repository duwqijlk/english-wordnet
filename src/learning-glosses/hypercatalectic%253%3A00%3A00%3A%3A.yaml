simpleMeaning: In verse, having an extra syllable or syllables at the end of a line or foot that is already
  complete in its beat
scope: In verse, this describes a line or foot with an extra syllable at the end; not a line that is too
  short and not a line with a missing beat.
examples:
- The hypercatalectic line had one extra syllable at the end.
- Her hypercatalectic verse closed with a long foot.
