senseId: 'color_vision_deficiency%1:26:00::'
synsetId: 14176492-n
simpleMeaning: A condition passed down in the family that makes a person unable to tell one shade from
  another
scope: A condition passed down in the family that leaves a person unable to tell shades apart; color blindness,
  colour blindness and colour vision deficiency are other names for this sense, not poor sight in general
  and not a lack of sight.
examples:
- His color vision deficiency makes it hard to read the charts.
- The test showed a color vision deficiency.
