simpleMeaning: A long-lived grass that stands dry weather, with no seed bristles or very short ones and
  long creeping underground stems; from Europe and the mild parts of Asia.
scope: 'Also called awnless bromegrass: a long-lived grass that stands dry weather, with no seed bristles
  or very short ones, not a grass that needs much water and not a grass with long seed bristles.'
examples:
- Bromus inermis spread across the dry field on its long underground stems.
- Farmers sow Bromus inermis where rain is scarce.
