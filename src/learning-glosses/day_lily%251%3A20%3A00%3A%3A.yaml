simpleMeaning: Many kinds of this long-lived plant have swollen roots and long thin leaves like blades,
  and usually yellow flowers, like lilies, open in the morning and close by night
scope: Also called a daylily; not the broad-leaved plant used as ground cover.
examples:
- The day lily by the fence opened a fresh yellow flower this morning.
- By evening the day lily flower had already closed and faded.
