simpleMeaning: said of some seeds with a fleshy cover, most often bright in colour
scope: 'Another name for ariled: said of some seeds with a fleshy cover, most often bright in colour,
  not a seed with a hard shell and not a seed with no cover at all.'
examples:
- The arillate seeds were easy to spot by their bright coats.
- An arillate seed has a bright, fleshy coat around it.
