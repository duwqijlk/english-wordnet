simpleMeaning: A post by the road shaped like a hand, with one part pointing the way.
scope: A post by the road shaped like a hand, with one part pointing the way; also called fingerpost,
  not a plain post with words on it and not a sign on a wall.
examples:
- The fingerboard at the crossroads pointed to the village.
- We read the fingerboard and turned left.
