simpleMeaning: 'This band of flesh in the leg moves the top of the leg: it pulls it in toward the body,
  and it straightens it'
scope: A band of flesh in the leg that moves the thigh, also called musculus adductor magnus, not the
  band that bends the knee and not a bone.
examples:
- The great adductor muscle helps pull the leg inward.
- He strained his great adductor muscle during the match.
