simpleMeaning: Churches or faiths grow closer as one when people work for their unity
scope: Said of work that helps churches or faiths grow closer as one; ecumenic, ecumenical and oecumenic
  are other names for this sense, not work that keeps faiths apart.
examples:
- The oecumenical council met to talk about unity among churches.
- His oecumenical work brings faiths together.
