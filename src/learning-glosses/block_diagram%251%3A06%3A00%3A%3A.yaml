simpleMeaning: a drawing that shows how the parts of a system join to each other, most often a system
  that runs on small electric currents
scope: A drawing that shows how the parts of a system join to each other, most often a system that runs
  on small electric currents, not a drawing of how a thing looks and not a list of its parts.
examples:
- The block diagram shows how the parts of the radio join to each other.
- She drew a block diagram to show how each part of the system links to the next.
