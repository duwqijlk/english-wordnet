senseId: 'extinction_angle%1:25:00::'
synsetId: 13914428-n
simpleMeaning: Seen in light that waves in one plane, a crystal looks darkest after it has been turned
  a certain distance from its straight line
scope: Angle of extinction is another name for how far a crystal must be turned before it looks darkest
  in polarized light, not the turn that makes it look brightest.
examples:
- They turned the crystal to find its extinction angle.
- At the extinction angle, the crystal looked darkest in the light.
