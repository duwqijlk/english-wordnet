simpleMeaning: Iron, a heavy, bendable metal drawn to a magnet; silver-white when pure but quick to rust;
  used in building, tools, and arms, and it carries oxygen in the blood.
scope: 'Also called iron and Fe: a heavy metal that bends and is drawn to a magnet, silver-white when
  pure but quick to rust, not a light metal and not a metal that stays bright in air.'
examples:
- Atomic number 26 is the number for iron, the metal in most steel tools.
- The blood needs atomic number 26 to carry oxygen around the body.
