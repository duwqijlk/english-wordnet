simpleMeaning: To do with body processes that happen over a day and night, once each day
scope: To do with body processes that happen over a day and night, once each day; not body processes that
  follow the week or the year and not a single act that happens once.
examples:
- Our circadian rhythms tell us when to sleep.
- Jet lag upsets the circadian clock of the body.
