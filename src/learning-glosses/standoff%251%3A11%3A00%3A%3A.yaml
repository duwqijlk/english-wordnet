simpleMeaning: the end of a game or contest where both sides have the same score and no one has won
scope: 'Also called draw and tie: a game ends with the same score on both sides and no winner, not holding
  back an attack.'
examples:
- The game ended in a standoff, with both teams on two points.
- Their last match was a standoff at one goal each.
