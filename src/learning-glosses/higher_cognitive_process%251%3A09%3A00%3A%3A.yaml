simpleMeaning: A way of thinking that needs knowledge already held and makes use of it.
scope: Ways of thinking that need knowledge a person already has, not the simple acts of seeing, hearing,
  or taking in new facts.
examples:
- A higher cognitive process lets us solve a problem with what we already know.
- Her teacher said planning a trip used a higher cognitive process, not just memory.
