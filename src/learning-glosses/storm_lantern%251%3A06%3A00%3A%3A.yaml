simpleMeaning: With a glass tube round the flame and a holed metal top to keep it safe from strong winds,
  an oil lamp, or a candle holder with a glass tube.
scope: People also call it hurricane lamp, hurricane lantern, storm lamp, and tornado lantern, and it
  is an oil lamp with a glass tube round the flame and a holed metal top, or a candle holder with a glass
  tube.
examples:
- She lit the storm lantern.
- The storm lantern burned on the table.
