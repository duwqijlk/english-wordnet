simpleMeaning: having the front part of the neck, or the sound from it, of the kind named just before
  this word
scope: Used after another word that names the kind, as in deep-throated or white-throated. It does not
  stand on its own, and it is not about having a sore neck or a sick voice.
examples:
- The deep-throated singer filled the hall with sound.
- A white-throated bird sat on the branch.
