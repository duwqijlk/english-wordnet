simpleMeaning: changing something in a secret way, or in a way that is not right
scope: 'Also called tampering: the act of changing something in secret or in a way that is not right.
  Not the adjective sense, which describes a person who takes part in other people''s private matters
  without being asked, in a way they do not want.'
examples:
- Someone found signs of meddling in the company's money records.
- Meddling with the machine's settings stopped it from working right.
