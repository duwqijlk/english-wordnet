simpleMeaning: the running of less important work by a computer while more important work is not using
  it
scope: 'Also called background processing: less important work run when more important work is not using
  the computer, not the main work done while the computer is busy.'
examples:
- The system uses backgrounding to run low-priority jobs when nothing more urgent needs the computer.
- With backgrounding, the update waits until the computer is free.
