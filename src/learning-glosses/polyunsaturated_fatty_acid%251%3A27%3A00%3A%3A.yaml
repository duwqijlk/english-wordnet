simpleMeaning: A fatty acid found mainly in fish and in corn, soybean and safflower oils; two or more
  of the bonds between its carbon atoms are double or triple.
scope: This is the fatty acid with two or more double or triple bonds; not the monounsaturated kind, which
  has only one such bond, and not a saturated one.
examples:
- Oily fish such as salmon supply polyunsaturated fatty acids.
- Nutrition labels often list polyunsaturated fatty acid content separately.
