simpleMeaning: A situation or action that is not fair because rules or standards are not followed
scope: 'Also called unfairness: this is an unfair state or act that breaks rules, not a fair difference
  that the rules allow.'
examples:
- The inequity of the pay system angered the workers.
- They protested the inequity in how the rules were applied.
