simpleMeaning: grey nerve tissue holding cell bodies as well as nerve threads; it makes up the outer layer
  of the brain, built of nerve cells with no fatty coat
scope: 'Also called gray matter, gray substance, grey matter, and grey substance: grey nerve tissue in
  the brain, not the white nerve tissue and not the skull.'
examples:
- The substantia grisea holds the cell bodies of nerve cells.
- Signals pass through the substantia grisea of the brain.
