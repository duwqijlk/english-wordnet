simpleMeaning: One of the most common of the five main kinds of proteins that fight sickness, and the
  main one that guards the linings of the gut and the airways
scope: This is one of the most common of the five main kinds of proteins that fight sickness, and the
  main one that guards the linings of the gut and airways, also called immunoglobulin A; near kinds are
  IgG and IgM.
examples:
- IgA is the main antibody in the linings of the gut and the airways.
- Doctors test IgA levels when they check how well the body fights sickness.
