simpleMeaning: A building where people can stay the night and also play games of chance for money.
scope: A building that is both a place to stay and a place to play games of chance; casino-hotel is another
  name for this sense, not a place that only offers rooms and not a place that only offers games.
examples:
- The new hotel-casino has hundreds of rooms and a large gaming floor.
- They spent the evening at the hotel-casino.
