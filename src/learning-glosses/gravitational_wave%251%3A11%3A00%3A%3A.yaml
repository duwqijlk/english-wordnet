simpleMeaning: In physics, a movement thought to carry the pull that draws things together and to move
  as fast as light
scope: In physics, a movement thought to carry the pull that draws things together; gravity wave is another
  name for it, not a sea wave and not a sound wave.
examples:
- Scientists found signs of a gravitational wave from two stars.
- A gravitational wave moves as fast as light.
