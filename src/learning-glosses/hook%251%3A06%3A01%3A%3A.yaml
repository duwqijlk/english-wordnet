simpleMeaning: a curved or bent tool or part of a machine, used to hang, hold, or pull something
scope: This tool is also called claw; it is not a sharp bend or shape, and not a shot in golf or basketball.
examples:
- Hang the heavy bag on the metal hook above the door.
- The crane lifted the box with a strong hook.
