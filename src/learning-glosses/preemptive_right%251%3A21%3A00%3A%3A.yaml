simpleMeaning: a chance for people who own shares in a firm to buy new shares first, so their part of
  the firm does not get smaller
scope: A first chance for share owners to buy new shares, so their share of the firm stays the same, not
  a general chance to buy shares.
examples:
- Her preemptive right let her buy new shares before they were offered to others.
- The preemptive right helped her keep her part of the firm when new shares were sold.
