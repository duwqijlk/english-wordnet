scope: A surface swelling of the tongue with uneven red patches and pain from hot or spicy food, also
  called glossodynia exfoliativa, and not a deep swelling of the tongue.
examples:
- Moeller's glossitis left red patches on her tongue.
- With Moeller's glossitis, even spicy food hurt his tongue.
