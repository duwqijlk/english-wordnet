simpleMeaning: most often made to find what lies under the surface, a tunnel cut by a boring tool
scope: 'Also called bore and bore-hole: a tunnel cut to look for what lies under the surface, not a hole
  made for a nail or a screw.'
examples:
- The drill hole went down through rock to reach water.
- They took samples from the drill hole to see what lay below.
