simpleMeaning: Turning a cylinder studded with small pegs makes this music maker sound, each peg giving
  a note as it goes round.
scope: This is also called grind organ and hand organ, the music maker sounded by turning a pegged cylinder.
examples:
- The barrel organ sounded as the cylinder turned.
- A barrel organ played while the pegs turned.
