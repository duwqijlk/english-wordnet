simpleMeaning: very light and fine and gentle in a way that is not usual
scope: 'Also called gossamer: this means very light and fine, not the sense of being like air with no
  solid form, and not the sense about ether, a chemical liquid.'
examples:
- The dancer wore an ethereal dress of thin white cloth.
- Her ethereal singing was soft and light.
