simpleMeaning: A sudden, serious infection of the brain and spinal cord, caught when germs enter an open
  wound; in late stages it may cause sudden tightening of jaw and voice-box muscles
scope: Also called lockjaw. This is the infection caught when germs enter an open wound, not the steady
  tight pull in a muscle that comes from fast nerve signals.
examples:
- He stood on a rusty nail and was given a shot to stop tetanus.
- Tetanus can make a person's jaw so tight that they cannot open their mouth.
