simpleMeaning: In a large old British house, a small room next to the kitchen, used for washing and keeping
  kitchen tools and for other heavy, dirty house work
scope: A small room for washing and keeping kitchen tools in a large old British house, not the main kitchen
  itself.
examples:
- She washed the big pots in the scullery.
- The scullery was full of clean plates and pans.
