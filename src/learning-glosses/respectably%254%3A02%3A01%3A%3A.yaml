senseId: 'respectably%4:02:01::'
synsetId: 00444277-r
simpleMeaning: In a way that is fairly good, and good enough to be thought well of.
scope: To a fairly good extent, close in sense to the use for behaving in a decent, upright way, but this
  one is about how well a thing is done.
examples:
- She played respectably well for her first game.
- He did respectably well in the exam, though not at the top.
