senseId: 'truncus_atrioventricularis%1:08:00::'
synsetId: 05397822-n
simpleMeaning: a cord of changed heart muscle that carries the heart's signal from the small knot between
  the upper and lower chambers to the lower chambers, making them squeeze
scope: Also called atrioventricular bundle and atrioventricular trunk; a cord of heart muscle carrying
  the heart's signal, not the heart muscle itself and not the knot where the signal starts.
examples:
- The truncus atrioventricularis carries the signal that makes the lower chambers squeeze.
- Damage to the truncus atrioventricularis can slow the heartbeat.
