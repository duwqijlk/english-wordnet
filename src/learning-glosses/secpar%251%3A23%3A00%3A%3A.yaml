simpleMeaning: a unit of length in space, the distance from Earth at which a star shows a shift of one
  second of arc, equal to 3.262 light years
scope: 'Also called a parsec: a unit of length in space, not a unit of time and not a light year.'
examples:
- The nearest star is about one secpar from Earth.
- Astronomers give the distance in secpars, not in miles.
