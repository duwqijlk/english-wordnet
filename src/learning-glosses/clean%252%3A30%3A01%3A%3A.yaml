simpleMeaning: To take off parts that are not wanted, such as feathers from a bird or stones from fruit.
scope: This is not the general act of washing away dirt; it is about removing unwanted parts from food
  or materials.
examples:
- She cleaned the fish before cooking it.
- The cherries were cleaned and ready to eat.
