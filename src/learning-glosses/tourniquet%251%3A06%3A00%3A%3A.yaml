senseId: 'tourniquet%1:06:00::'
synsetId: 03086660-n
simpleMeaning: a band tied tight around an arm or leg to press on an artery (a big blood vessel) and stop
  the blood from flowing
scope: This is a tight band used to stop heavy bleeding from an arm or leg; it is not an ordinary band
  put on a cut to cover it.
examples:
- The nurse tied a tourniquet around his arm to stop the bleeding.
- He made a tourniquet from a strip of cloth and pressed it tight.
