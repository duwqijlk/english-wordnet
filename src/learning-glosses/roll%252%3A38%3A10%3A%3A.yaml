simpleMeaning: to move along in soft waves, going up and down as it advances
scope: This sense is smooth wave-like forward movement, as of fog, mist or the sea; it is not the rounded
  shape of hills seen from a distance, not tumbling end over end, and not rocking from side to side.
examples:
- Fog rolled across the valley in slow, soft waves.
- The waves rolled toward the shore in long, gentle lines.
