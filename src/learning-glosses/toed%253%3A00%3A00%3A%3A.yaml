simpleMeaning: Says what kind of toes something has, and often comes joined to the word that names that
  kind
scope: This is having toes of a named kind, often joined to another word, not the act of touching something
  with a toe.
examples:
- The bird is long-toed, with toes made for wading.
- A five-toed animal leaves a clear print.
