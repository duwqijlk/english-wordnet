simpleMeaning: showing different colours when looked at from different sides
scope: Showing different colours when looked at from different sides, not showing one colour from every
  side and not changing colour in different light.
examples:
- The pleochroic stone looked blue from one side and green from another.
- Under the lens, the pleochroic crystal showed two colours at once.
