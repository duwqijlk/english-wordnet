simpleMeaning: to stay away from work you ought to do, for instance by making out that you are ill
scope: To dodge work you ought to do, not to hide and wait in secret for someone.
examples:
- He skulked at home all week, saying he was sick, to get out of his chores.
- She skulked off and left the hard jobs to the rest of us.
