simpleMeaning: The point on the compass that sits halfway between north and northeast.
scope: Also called nor'-nor'-east and north northeast; this is the point on the compass between north
  and northeast, not the point between north and northwest.
examples:
- The ship turned to NNE and held that course till dawn.
- On the map, NNE sits between north and northeast.
