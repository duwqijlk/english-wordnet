simpleMeaning: a test that finds what a substance is, most of all a protein, by how it sets off the body's
  defence
scope: A test that finds what a substance is by how it sets off the body's defence, also called immunochemical
  assay; not a test that measures how much of it there is and not a test done on blood alone.
examples:
- The lab used an immunoassay to find the protein in the sample.
- An immunoassay showed which substance was in the blood.
