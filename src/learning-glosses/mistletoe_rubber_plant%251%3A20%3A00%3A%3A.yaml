simpleMeaning: Often kept in the house, this bush or small tree has leaves like those of the thing that
  lives on tree branches
scope: 'Also called a mistletoe fig: a bush or small tree kept in the house for its leaves, not the kind
  that gives sap and not the thing that lives on tree branches.'
examples:
- The mistletoe rubber plant by the window needs little water.
- He bought a mistletoe rubber plant for his office.
