simpleMeaning: a fighter who can beat the people who fight against them
scope: 'Also called master and victor: a fighter who can beat rivals. It is not the word for high rank,
  and not the word for very good quality.'
examples:
- The young boxer faced a superior who had beaten every rival.
- No one in the town could beat this superior in a fight.
