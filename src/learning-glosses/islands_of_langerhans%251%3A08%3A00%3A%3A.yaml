simpleMeaning: Small groups of cells in the pancreas that form the part of that organ that makes hormones;
  they make insulin and other hormones.
scope: Also called isles of Langerhans and islets of Langerhans, these are small groups of hormone-making
  cells in the pancreas; not the digestive part of the pancreas or the whole organ.
examples:
- The islands of Langerhans make insulin.
- Damage to the islands of Langerhans can stop insulin being made.
