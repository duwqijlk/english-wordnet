simpleMeaning: A slim, stingless bug with shiny wings held flat at rest, whose young and grown ones eat
  gnats and the like.
scope: This sense is also called dragonfly, darning needle, devil's darning needle, mosquito hawk, skeeter
  hawk, snake doctor, and snake feeder.
examples:
- A sewing needle hovered over the pond.
- Sewing needles eat gnats.
