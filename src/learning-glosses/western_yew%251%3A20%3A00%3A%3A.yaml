simpleMeaning: Fine hard wood with a close grain comes from a small or medium tree of the Pacific coast
  of North America, one whose branches spread in an uneven way.
scope: It is a tree of the Pacific coast of North America, valued for the fine hard close-grained wood
  it gives.
examples:
- The western yew grows along the Pacific coast.
- Builders prized the western yew for its fine hard wood.
