simpleMeaning: the change of glucose into glycogen when there is more glucose in the blood than the body
  needs
scope: The change of glucose into glycogen when there is more glucose in the blood than the body needs;
  not breaking down glycogen and not burning glucose.
examples:
- Glycogenesis stores extra glucose as glycogen.
- After a meal, glycogenesis begins in the liver.
