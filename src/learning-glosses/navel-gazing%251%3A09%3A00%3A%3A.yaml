simpleMeaning: Most often, thinking about oneself in a pleased, self-satisfied way, with no thought for
  others, as if staring at one's own belly.
scope: Most often, thinking about oneself in a pleased, self-satisfied way, with no thought for others,
  also called omphaloskepsis; not deep thought about a problem and not simple pride.
examples:
- His navel-gazing kept him from seeing what others needed.
- The essay was pure navel-gazing, all about the writer himself.
