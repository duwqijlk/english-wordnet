simpleMeaning: Pressed close and held tight, with the parts packed together.
scope: Pressed close and held tight, not the small case for face powder, not the act of pressing things
  together, and not the way a thing packs down well.
examples:
- The compact soil was hard to dig.
- Compact clusters of flowers grew along the wall.
