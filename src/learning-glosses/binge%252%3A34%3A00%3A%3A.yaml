simpleMeaning: to eat far too much, in a greedy way and with no control over yourself
scope: 'Also called stuff, gorge, engorge, glut, overeat, satiate and overindulge: eating far too much,
  not the noun sense of a short time of doing too much, and not drinking too much alcohol.'
examples:
- The kids binged on ice cream after dinner.
- He binged on cake and felt sick afterwards.
