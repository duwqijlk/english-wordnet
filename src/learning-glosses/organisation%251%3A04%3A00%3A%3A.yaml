simpleMeaning: the work of arranging how a business is run, or how an activity that is part of a business
  is run
scope: 'Also called organization: the work of arranging how a business or a business activity is run,
  not putting people or things in order and not a group of people who run something.'
examples:
- The organisation of the new shop took six months.
- She was put in charge of the organisation of the sales fair.
