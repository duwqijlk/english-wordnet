simpleMeaning: A sex-gland hormone made by the front pituitary gland, which in females spurs growth of
  the milk glands and milk-making after giving birth.
scope: Also called lactogenic hormone and luteotropin, it is a sex-gland hormone made by the front pituitary
  gland, which in females spurs growth of the milk glands and milk-making after giving birth.
examples:
- Prolactin spurs milk-making after birth.
- Prolactin is made by the front pituitary gland.
