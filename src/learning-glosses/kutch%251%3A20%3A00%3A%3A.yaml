simpleMeaning: A substance used in tanning, got from the bark of several kinds of mangrove tree in the
  Pacific
scope: This is a substance used in tanning, got from mangrove bark in the Pacific, also called cutch,
  not a dye and not the bark itself.
examples:
- Kutch was used to tan leather in the old tannery.
- The trader bought kutch from the Pacific coast.
