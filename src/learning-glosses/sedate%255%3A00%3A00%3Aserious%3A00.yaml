simpleMeaning: worthy of respect, serious and sad in the way you act and in your character, and firm about
  keeping promises
scope: Worthy of respect, serious and sad in the way you act and in your character, and firm about keeping
  promises, also called grave, solemn, and sober, not the act of calming someone with a drug.
examples:
- The sedate judge listened without a smile.
- She had a sedate nature and never broke a promise.
