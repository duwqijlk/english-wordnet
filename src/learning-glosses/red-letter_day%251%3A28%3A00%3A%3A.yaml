simpleMeaning: a time that stands out in the mind because it was very happy or important, named for holy
  days once marked in bright ink on church lists
scope: A very happy or important date in a person's life, not a church holiday and not an ordinary date
  on a list.
examples:
- Their wedding was a real red-letter day for the whole family.
- Winning the prize made it a red-letter day she would never forget.
