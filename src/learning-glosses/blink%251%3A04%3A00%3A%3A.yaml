simpleMeaning: the quick shutting and opening of the eyes, done without thinking
scope: The reflex act of quickly shutting and opening the eyes, not the verb for doing it briefly or the
  verb meaning to shine unsteadily.
examples:
- She gave a quick blink and turned away.
- The sudden light caused an involuntary blink.
