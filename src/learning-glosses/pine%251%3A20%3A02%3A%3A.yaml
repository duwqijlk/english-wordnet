simpleMeaning: strong and long-lasting pale yellow or white wood with straight lines in it, often sticky
  with sap, cut from a kind of tall tree with needle leaves
scope: Strong and long-lasting pale yellow or white wood with straight lines in it, often sticky with
  sap, not the tree itself and not wood from a broad-leaf tree.
examples:
- The floor was made of pine from the northern forests.
- He built the shelves out of cheap pine.
