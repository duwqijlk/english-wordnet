simpleMeaning: A card game for four players in two pairs, played with 52 cards, in which each side gains
  a point for every trick it wins beyond six.
scope: Also called long whist, a card game for four players in two pairs, played with 52 cards, each side
  gaining a point for every trick won beyond six.
examples:
- They played whist every Friday night after supper.
- Our side won the whist by taking eight tricks.
