simpleMeaning: A line that bends, or a sheet spread out in space, fixed on a graph by numbers with the
  highest power two
scope: 'Another name for quadric: a curve or a surface whose numbers follow a rule with the highest power
  two, not a straight line or a flat sheet.'
examples:
- The quadric surface in the model curved like the side of a bowl.
- She sketched a quadric surface to show how the numbers worked.
