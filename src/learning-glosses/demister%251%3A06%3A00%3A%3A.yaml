simpleMeaning: a heater that clears the thin cloud of water drops from the front window of a car
scope: This is a heater that clears the thin cloud of water drops from a car's front window, not a wiper
  that pushes rain off and not a heater that warms the people in the car.
examples:
- She switched on the demister so she could see through the front window.
- The demister cleared the mist in less than a minute.
