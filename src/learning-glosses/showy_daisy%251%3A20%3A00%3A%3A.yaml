simpleMeaning: A mountain plant of the northwestern United States whose leafy branching stems each end
  in one big, eye-catching bloom of many narrow pink, lavender or white petals.
scope: The mountain wildflower with pink, lavender or white flowers and one bright head per stem, not
  the white-flowered garden hybrid called shasta daisy.
examples:
- Showy daisies cover the mountain slopes of the northwestern United States in late summer.
- Each showy daisy stem bears a single flower head with narrow pink or lavender petals.
