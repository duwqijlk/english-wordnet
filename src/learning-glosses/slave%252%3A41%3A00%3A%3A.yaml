simpleMeaning: to work extremely hard
scope: This is the act of working extremely hard, for which break one's back, buckle down and knuckle
  down are other names, not the hard-working person (the noun) and not an ordinary day's work.
examples:
- They slaved over the hot stove all evening to feed the guests.
- He slaved away at the accounts until the early hours.
