simpleMeaning: An Old World one-year plant with heart-shaped leaves and large seeds whose short greyish
  fibres are hard to remove, thought to be an ancestor of modern short-fibre kinds.
scope: 'Also called Gossypium herbaceum: an Old World plant thought to be an ancestor of modern short-fibre
  kinds, not a modern cotton and not a plant with long fibres.'
examples:
- The Levant cotton grew in the dry field, its heart-shaped leaves turning yellow.
- Farmers once grew Levant cotton for its short greyish lint.
