simpleMeaning: A round shape that touches a bend from the hollow side, with the same reach from middle
  to edge as the bend at that point.
scope: Also called circle of curvature, this round shape touches a bend from the hollow side and shares
  the bend's reach from middle to edge at that point.
examples:
- The osculating circle touches the curve on its hollow side.
- At that point the osculating circle and the curve share one radius.
