simpleMeaning: A person who works for change and holds that it should be sought without force or fighting
scope: 'Another name for this is non-resistant: a person who seeks change without force, not a person
  who fights for change and not a person who accepts things as they are.'
examples:
- The passive resister refused to raise a hand against the soldiers.
- Gandhi's followers were passive resisters who marched without weapons.
