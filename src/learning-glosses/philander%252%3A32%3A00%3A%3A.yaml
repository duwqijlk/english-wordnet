simpleMeaning: to talk or act in a loving way with someone, without meaning it in a serious way
scope: 'Also called butterfly, flirt, romance, mash, dally and coquette: to talk or act in a loving way
  without a serious purpose, not to love someone in a serious, lasting way.'
examples:
- He philandered with women at parties but never wanted a real relationship.
- She accused him of philandering instead of being true to her.
