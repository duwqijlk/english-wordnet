  party is usually people picked by its countrywide meeting for places or parts.
scope: The group that runs a political party, usually people picked by its countrywide meeting, with power
  over running those meetings and election drives.
examples:
- The national committee has power over the planning of campaigns.
- Members of the national committee are picked by the national convention.
