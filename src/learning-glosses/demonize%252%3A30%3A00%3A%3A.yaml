simpleMeaning: to turn a person or thing into an evil spirit
scope: This is turning someone or something into an evil spirit. It is not just saying that a person is
  very bad or treating a person as an enemy.
examples:
- In the tale, a curse demonized the prince and gave him horns.
- The old book says the spell can demonize a person.
