simpleMeaning: a person who passes water in their sleep while lying in their sleeping place
scope: 'Also called bedwetter and wetter: a person who passes water in their sleep, not a person who sweats
  a lot and not a small child learning to use the toilet.'
examples:
- The bed wetter was seen by a doctor about the problem.
- Our son was a bed wetter until he was eight.
