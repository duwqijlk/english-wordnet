senseId: 'derivation%1:09:00::'
synsetId: 05788715-n
simpleMeaning: A chain of reasoning that shows how a conclusion follows, step by step, from ideas already
  accepted as true.
scope: A line of reasoning from accepted ideas to a conclusion, not the drawing of fluid from a sick part
  of the body, not the history of a word, and not the forming of new words from old ones.
examples:
- Her derivation of the result took three pages of careful reasoning.
- The derivation shows how the conclusion follows from the premises.
