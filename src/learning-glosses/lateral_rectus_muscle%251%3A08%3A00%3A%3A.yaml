simpleMeaning: When this band of flesh in the eye pulls tight, the eye looks out to the side.
scope: When this band of flesh in the eye pulls tight, the eye looks out to the side; abducens muscle
  and lateral rectus are other names for this sense, not a band that turns the eye inward, and not a band
  that lifts the eye.
examples:
- The lateral rectus muscle turns the eye outward.
- Damage to the lateral rectus muscle makes it hard to look to the side.
