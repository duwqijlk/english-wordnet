simpleMeaning: 'In genetics, the cell division behind sexual reproduction: one nucleus becomes four, each
  with half the usual chromosomes, giving an animal''s eggs and sperm or a plant''s spores.'
scope: 'This is the genetics sense: a cell division that halves the chromosome count to make sex cells;
  meiosis and reduction division are other names for the same process, but miosis can also mean the narrowing
  of the pupil in bright light.'
examples:
- In genetics, miosis is another name for the process that halves the chromosome number.
- Some older papers use miosis where most textbooks say meiosis.
