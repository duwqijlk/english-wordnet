simpleMeaning: A machine that splits atoms to make heat, cooled and slowed by the liquid in its middle,
  which turns to steam that can turn a wheel that makes power.
scope: This is a machine that splits atoms to make heat, cooled and slowed by the liquid in its middle,
  not a machine that makes power by burning fuel.
examples:
- The boiling water reactor makes power from splitting atoms.
- In a boiling water reactor, the liquid turns to steam that drives the turbine.
