simpleMeaning: through summer and autumn, loose bunches of sweet-smelling green-white flowers crown a
  strong climber from Europe to Afghanistan and Lebanon, which sheds its leaves in winter
scope: 'Also called old man''s beard and traveller''s joy: a strong climber with sweet-smelling green-white
  flowers, not a vine grown for its fruit.'
examples:
