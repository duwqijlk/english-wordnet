senseId: 'required_reserve_ratio%1:24:01::'
synsetId: 92411756-n
simpleMeaning: A share of the money in a bank, held back so the bank can pay when far more people than
  usual ask for money they can take any time.
scope: 'Also called cash reserve ratio or reserve ratio: a share of the money in a bank, held back so
  the bank can pay when far more people than usual ask for money they can take any time; not the money
  the bank lends out.'
examples:
- The required reserve ratio rose after the bank scare.
- The central bank sets the required reserve ratio.
