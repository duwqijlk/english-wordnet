simpleMeaning: A small evergreen from Peru, with a broad round crown and thin drooping branches, bearing
  pretty groups of greenish flowers followed by groups of rose-pink fruit.
scope: Also called molle, pepper tree, and Schinus molle; a small evergreen from Peru with greenish flowers,
  not a pepper plant and not a pine.
examples:
- The Peruvian mastic tree bears rose-pink fruits after its greenish flowers.
- They planted a Peruvian mastic tree for shade in the courtyard.
