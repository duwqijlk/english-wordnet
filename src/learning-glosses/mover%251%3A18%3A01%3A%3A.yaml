simpleMeaning: In meetings run by set rules, a person who puts forward a formal proposal for the group
  to vote on
scope: In meetings run by set rules, a person who puts forward a formal proposal for the group to vote
  on; not a person who carries furniture, and not a company that moves houses.
examples:
- The mover of the motion asked the council to vote at once.
- As mover, she spoke first in favour of the plan.
