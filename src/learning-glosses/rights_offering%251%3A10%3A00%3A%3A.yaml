simpleMeaning: People who already own shares in a firm get the first chance to buy its new ordinary shares
  for less than the price the public will pay later.
scope: 'Also called a rights issue: a first chance for current shareholders to buy new shares cheaply,
  not a sale of shares to the public.'
examples:
- The rights offering gave current shareholders the first chance to buy new shares.
- She bought extra shares through a rights offering at a price below the public price.
