simpleMeaning: A person of the Siouan people who used to live in Iowa and in Minnesota and Missouri.
scope: A person of the Siouan people who used to live in Iowa and in Minnesota and Missouri, also called
  Iowa; not the tongue spoken by these people.
examples:
- An Ioway elder told stories of Minnesota and Missouri.
- The Ioway lived in Iowa long ago.
