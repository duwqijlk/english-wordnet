simpleMeaning: To cook up what is false or untrue.
scope: This sense is also called invent, manufacture, and fabricate, for cooking up what is false or untrue,
  where invent is to make up a thing that is not real or not true, and manufacture is to make up something
  that is not real or not true, unlike the sense for a bit of leather shaping the front of a shoe-top,
  unlike the sense for a made-up tune to play along, and unlike the sense for a luring woman, working
  men by her sex charms.
examples:
- They vamp a tale, cooking up what is false.
- They vamp excuses, cooking up what is untrue.
