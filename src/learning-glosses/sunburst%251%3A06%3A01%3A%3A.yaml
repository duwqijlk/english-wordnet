simpleMeaning: a pattern with a round shape in the middle like the sun, and lines going out from it in
  all directions
scope: A pattern with a round middle and lines going out from it, not a brooch (a piece of jewellery you
  pin to clothes) with a pattern like the sun, and not the sun suddenly coming out from behind clouds.
examples:
- The old gate had a sunburst carved in wood above it.
- She drew a sunburst with long lines around a round centre.
