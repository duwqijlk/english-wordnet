simpleMeaning: one of many kinds of small moth with wings edged in fine hairs, whose young roll leaves
  or live inside fruit and swellings on plants
scope: 'Also called a tortricid moth: a small moth with fringed wings, not a butterfly.'
examples:
- The tortricid rested on the leaf in the evening light.
- Tortricid larvae had rolled the apple leaves into tubes.
