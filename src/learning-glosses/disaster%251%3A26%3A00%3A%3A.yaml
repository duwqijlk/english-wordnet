simpleMeaning: A state of very great ruin and bad luck, usually with no way to put things right
scope: A state of ruin and bad luck, not a single act that brings ruin and not a small piece of bad luck.
examples:
- His policies were a disaster for the country.
- The flood was a disaster for the whole town.
