simpleMeaning: a small bird that cannot fly, of the Falkland Islands and New Zealand, with a tuft of feathers
  on its head
scope: A small flightless bird of the Falkland Islands and New Zealand with a tuft of feathers on its
  head; not the dark brown crested myna and not a large penguin.
examples:
- The crested penguin waddled across the rocks in the Falkland Islands.
- Crested penguins nest on the shores of New Zealand.
