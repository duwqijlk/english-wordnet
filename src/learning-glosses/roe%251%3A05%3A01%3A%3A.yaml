simpleMeaning: the eggs of a fish, or the part inside a female fish that holds the eggs
scope: Fish eggs, or the part of a fish that holds them; not the eggs of a lobster or crab, and not those
  eggs served as food.
examples:
- The fish was full of roe when he cut it open.
- She found soft roe inside the female fish.
