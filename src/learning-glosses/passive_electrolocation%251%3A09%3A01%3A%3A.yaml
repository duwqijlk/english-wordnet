simpleMeaning: Some fish and some frogs, toads, and salamanders can sense charges around them with special
  sense spots, and so find where the charges come from.
scope: Some fish and water animals sense charges around them with special sense spots, and so find where
  the charges come from; not the kind that sends out its own signals to find things.
examples:
- Weakly electric fish use passive electrolocation to sense the charges around them.
- With passive electrolocation, the fish can tell where a charge in the water comes from.
