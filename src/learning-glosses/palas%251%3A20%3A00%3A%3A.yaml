simpleMeaning: a tree from eastern India with very many deep red flowers that feel like soft velvet, and
  that gives a yellow dye
scope: 'Also called dhak and dak: a tree from eastern India with many deep red soft flowers, not a tree
  grown for its wood or fruit.'
examples:
