simpleMeaning: A large meat-eating two-legged dinosaur with huge teeth with jagged knife-like edges; it
  may have fed on dead animals rather than hunting, in North America in the later Cretaceous period.
scope: A large meat-eating dinosaur that walked on two legs, with huge knife-edged teeth, also called
  tyrannosaurus and tyrannosaur, that lived in North America in the later Cretaceous period.
examples:
- Tyrannosaurus rex walked on two legs and had huge teeth.
- Tyrannosaurus rex lived in North America in the later Cretaceous period.
