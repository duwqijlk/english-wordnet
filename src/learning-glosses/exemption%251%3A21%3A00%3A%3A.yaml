simpleMeaning: an amount taken off the money a person pays tax on because of their situation, such as
  having people who depend on them, being blind, or being over 65
scope: A tax amount taken off because of a person's situation, not the act of freeing someone from a duty
  or a rule.
examples:
- She claimed an exemption for each of her children.
- Taxpayers over 65 are allowed an extra exemption.
