simpleMeaning: Where points are shown by marks placed in a grid, number work is used to look at shapes
  and lines.
scope: This is the part of maths that looks at shapes and lines by means of number work, also called analytic
  geometry or coordinate geometry.
examples:
- Analytical geometry helped us find where the two lines meet.
- She used analytical geometry to work out the size of the shape.
