simpleMeaning: A small eatable fungus with a thin stem, often found on rotting hard wood.
scope: This is a small eatable fungus with a thin stem found on rotting hard wood, not a big fleshy fungus
  on the ground or a poisonous fungus that must not be eaten.
examples:
- The deer mushroom grows on rotting hard wood in the forest.
- She found a deer mushroom with a thin stem on the old log.
