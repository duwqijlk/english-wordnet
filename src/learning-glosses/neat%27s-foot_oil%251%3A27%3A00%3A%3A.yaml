simpleMeaning: From the lower limbs of cattle comes this pale yellow liquid, put on leather to treat it
scope: This is a pale yellow liquid made from the lower limbs of cattle and put on leather, not a cooking
  oil and not a fuel oil.
examples:
- He rubbed neat's-foot oil into his old boots to keep the leather soft.
- The saddler used neat's-foot oil on the harness.
