simpleMeaning: to put a tall, thin, pointed top on a building or other high part
scope: This verb sense is about putting a pointed top on something, not the pointed top itself and not
  lifting something to a high place.
examples:
- Workers pinnacled the tower with a tall, thin, pointed top.
- The builders pinnacled the pediment with a pointed top.
