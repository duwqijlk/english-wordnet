simpleMeaning: good points that pull a person in by seeming to offer some kind of prize
scope: Good points that pull a person in by seeming to offer some kind of prize, with enticement and lure
  as other names for this sense, and not a plain fact or a promise that is sure.
examples:
- The free gift was the come-on that drew shoppers into the store.
- He saw through the come-on and read the small print first.
