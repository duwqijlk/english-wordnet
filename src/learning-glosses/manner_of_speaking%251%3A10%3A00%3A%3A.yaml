simpleMeaning: How a person talks, in their own style, with their own sound and their own choice of words
scope: Also called delivery and speech, this is a person's own way of talking, not what they say and not
  their written style.
examples:
- His manner of speaking was slow and careful.
- Her manner of speaking changed when she was nervous.
