senseId: tributary%5:00:00:obligated:00
synsetId: 01621562-s
simpleMeaning: paying money or goods to a ruler or strong country to show that it has power over you
scope: This describes a person, land, or country that pays in this way; it is not a small river that flows
  into a bigger river, and not a word for a stream that does the same.
examples:
- The small kingdom was tributary to the empire and sent money each year.
- They held the land as a tributary state under the king.
