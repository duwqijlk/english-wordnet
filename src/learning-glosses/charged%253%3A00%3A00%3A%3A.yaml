scope: A bit of matter, a body, or a whole set of things with a net amount of positive or negative electricity,
  not a subject that stirs up strong feelings and not a fizzy drink.
examples:
- The scientist studied charged particles under the microscope.
- A charged battery holds electric power until it is used.
