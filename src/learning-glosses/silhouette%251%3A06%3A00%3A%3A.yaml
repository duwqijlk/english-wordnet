simpleMeaning: a picture of the edge shape of a thing, filled in all over with one flat colour
scope: A picture of the edge shape of a thing, filled in all over with one flat colour, not the dark shape
  itself and not the act of showing a thing this way.
examples:
- She cut a silhouette of the cat from black paper.
- The silhouette hung on the wall in a plain frame.
