simpleMeaning: A drug that stops a body chemical (a protease) from working, sold as Crixivan, used to
  treat HIV.
scope: A drug that treats HIV by stopping a body chemical from working, not a cure for HIV and not a drug
  for other sicknesses.
examples:
- The doctor gave him indinavir for his HIV.
- Indinavir is sold under the trade name Crixivan.
