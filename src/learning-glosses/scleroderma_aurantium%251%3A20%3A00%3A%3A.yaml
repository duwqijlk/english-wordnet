simpleMeaning: An earthball fungus, dingy brownish yellow outside with a dark purplish inside; its outer
  skin is covered with a pattern of small warts
scope: Also called Scleroderma citrinum; a round earthball fungus, yellow-brown outside and dark purple
  inside, not the smooth earthball with a firm dry skin.
examples:
- We found Scleroderma aurantium growing under the oak trees.
- Scleroderma aurantium has a warty skin and a dark purple centre.
