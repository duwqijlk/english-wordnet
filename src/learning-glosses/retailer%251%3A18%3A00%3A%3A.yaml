simpleMeaning: a person or shop that sells goods to people who buy them for their own use
scope: A seller who sells to people for their own use; not a seller who sells goods in large amounts to
  other shops.
examples:
- The retailer raised the price of winter coats this week.
- A small retailer on our street sells fresh bread and milk.
