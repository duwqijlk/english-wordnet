simpleMeaning: to break a trip for a short time, as for a night, and then go on
scope: To break a trip for a short time, also called lay over; not to end a trip and not to change to
  another way of travel.
examples:
- We had to stop over in Venezuela on our flight back from Brazil.
- They decided to stop over for a night before going on.
