simpleMeaning: a plan for the economy in the former Soviet Union, meant to use more machines and make
  workers work better, but in time it ended central planning in Russia's economy
scope: This is the former Soviet Union's plan for its economy and the change it brought; not the country
  itself and not just the end of government planning on its own.
examples:
- The changes called perestroika changed how factories were run in the Soviet Union.
- Under perestroika, the government hoped machines and workers would do work better.
