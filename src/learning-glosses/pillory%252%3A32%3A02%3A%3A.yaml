simpleMeaning: To attack a person in words, with hard and violent blame.
scope: To blame a person hard and violently in words, also called blast, savage, or crucify; not the wooden
  frame, not merely holding a person up to scorn, and not the punishment itself.
examples:
- The press pilloried the minister over the scandal.
- Critics pilloried the new play on opening night.
