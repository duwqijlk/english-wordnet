simpleMeaning: A thin rod of sweet-smelling stuff, burned by Chinese people before a god image.
scope: A thin rod of incense burned before a god image, not a candle and not a stick burned for light.
examples:
- She lit a joss stick before the shrine.
- Smoke curled from the joss stick.
