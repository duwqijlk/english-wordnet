senseId: 'light_reflex%1:04:00::'
synsetId: 00867486-n
simpleMeaning: The automatic contraction of the ring muscle of the iris in response to bright light or
  certain drugs, making the pupil smaller.
scope: It is also called miosis, myosis, or a pupillary reflex.
examples:
- The doctor watched the light reflex as she shone a torch into his eye.
- A strong light reflex showed that his pupils still worked.
