simpleMeaning: for a boat or vessel, not having the official papers it should have
scope: This sense is for a boat or vessel with no official papers, not for an animal that is not listed
  by an official group for its kind.
examples:
- The harbour office stopped the unregistered boat because it had no official papers.
- They sailed in an unregistered vessel with no documents on board.
