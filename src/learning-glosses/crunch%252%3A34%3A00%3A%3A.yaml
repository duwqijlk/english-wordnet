simpleMeaning: To bite hard on a thing and break it into small bits with your teeth, making a grinding
  sound.
scope: Biting a thing hard with your teeth until it breaks, not pressing or rubbing a thing until it breaks
  and not the sound itself.
examples:
- The children crunched the celery sticks.
- He crunched the raw carrot and the sound filled the room.
