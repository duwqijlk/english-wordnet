simpleMeaning: Its young live in water, and the grown insect is small and moth-like, with two pairs of
  hairy, thin wings.
scope: Also called caddice-fly, caddis-fly, and caddis fly, this is a small moth-like insect with two
  pairs of hairy wings whose young live in water, not a true moth.
examples:
- A caddice fly fluttered, its wings catching the light.
- The caddice fly spent its early life in the water as a young larva.
