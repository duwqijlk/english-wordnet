simpleMeaning: An infection of animals and people from Listeria monocytogenes, worst for newborns and
  people with weak immunity; in sheep and cattle it often reaches the nervous system, causing nerve symptoms.
scope: This is the general name for the whole infection, which may stay in the gut or spread through the
  body. It is not listeria meningitis, the form that inflames the brain's coverings, and not a similar
  illness caused by other bacteria.
examples:
- People with weakened immune systems are warned to avoid unpasteurized cheese because of the risk of
  listeriosis.
- The outbreak of listeriosis was traced to a batch of smoked salmon.
