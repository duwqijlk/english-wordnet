scope: A sea animal with bright spots and a hard shell, found on sandy beaches along the Atlantic coast
  of the United States; lady crab is another name for this sense, not a dull-coloured crab of muddy shores.
examples:
- A calico crab scuttled across the sand at the water's edge.
- The children found a calico crab with bright spots on its shell.
