simpleMeaning: the part of a sleeve that goes around the wrist and covers it
scope: This is the end part of a sleeve, around the wrist. It is not a separate band that holds a watch
  on the wrist.
examples:
- His shirt had a tight wristband that buttoned shut.
- The wristband of her blouse was torn at the edge.
