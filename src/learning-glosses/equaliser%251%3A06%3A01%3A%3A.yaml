simpleMeaning: a piece of electric equipment that cuts down uneven sounds so the tones come out true
scope: 'Also called equalizer: a piece of electric equipment that cuts down uneven sounds, not a machine
  that makes sounds louder and not a radio set itself.'
examples:
- He turned the knobs on the equaliser to clear up the bass.
- The equaliser made the singer's voice sound true.
