simpleMeaning: in a way that shows very strong feeling, more than is usual in real life
scope: This is doing something in a way that shows very strong feeling, more than is usual in real life.
  Not about how good or bad a play is when it is judged as a play.
examples:
- He fell to his knees dramatically and begged for help.
- She paused dramatically before she told us the news.
