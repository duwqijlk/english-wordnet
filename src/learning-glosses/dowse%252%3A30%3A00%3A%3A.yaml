senseId: 'dowse%2:30:00::'
synsetId: 00216642-v
simpleMeaning: To slosh liquid on a thing, wetting it right through.
scope: This sense is also called soak, douse, drench, sop, and souse, for sloshing liquid on a thing,
  wetting it right through, where to soak is to put liquid all over a thing, or pour liquid onto it, and
  to douse is to pour liquid over a thing so that it is wet all over, unlike the sense for seeking underground
  water or minerals with a dowsing rod, and unlike the sense for seeking underground water or metal with
  a forked stick.
examples:
- She dowsed the cloth with water.
- Dowsing sloshes liquid on a thing.
