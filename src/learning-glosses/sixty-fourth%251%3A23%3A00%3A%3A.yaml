simpleMeaning: One of 64 pieces that are all the same size
scope: One of sixty-four pieces that are all the same size; not one of sixty-three pieces, and not the
  number sixty-four in counting order.
examples:
- A sixty-fourth of the pie was a tiny slice.
- Each sixty-fourth of the field measured the same.
