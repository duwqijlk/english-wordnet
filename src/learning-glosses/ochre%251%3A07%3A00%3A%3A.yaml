simpleMeaning: a colour that is yellow-orange to orange, in a middle strength, not very bright
scope: A colour, also called ocher. It is not the earth that is dug up and used to make this colour.
examples:
- She painted the kitchen walls in a warm ochre.
- His shirt was ochre, a colour between yellow and orange.
