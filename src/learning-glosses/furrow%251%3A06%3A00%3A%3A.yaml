simpleMeaning: a long, not deep line dug in the ground, especially one made by a plow
scope: A long, shallow cut in the ground; this is not a small fold in a smooth surface, and not the action
  of making such a cut.
examples:
- The farmer made straight furrows in the field before planting seeds.
- The plow left a deep furrow in the wet soil.
