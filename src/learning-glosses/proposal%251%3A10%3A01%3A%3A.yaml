simpleMeaning: the act of putting forward an idea or a plan for others to think about
scope: 'Also called a proposition: this is the act of putting a plan forward, not the plan itself that
  is put forward.'
examples:
- She made her proposal in a clear, short speech at the start of the meeting.
- His proposal of the new idea at the meeting started a long talk.
