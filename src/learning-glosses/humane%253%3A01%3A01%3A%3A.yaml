simpleMeaning: about the humanities, studies such as history, language and art that look at human thought
  and life
scope: 'Also called humanistic, and another name for this sense is humanist: it is about studies of human
  thought and art. It is not about being kind and stopping suffering, and not about people growing in
  mind and morals.'
examples:
- She chose humane studies at school, mainly history and old languages.
- In those days a humane education meant reading Latin and Greek books.
