simpleMeaning: In linguistics, a word that is made from another word
scope: In linguistics, a word made from another word, not a result in maths, not a substance made from
  another substance, and not a word that describes something as made in this way.
examples:
- '''Electricity'' is a derivative of ''electric''.'
- The teacher gave 'kindness' as a derivative of 'kind'.
