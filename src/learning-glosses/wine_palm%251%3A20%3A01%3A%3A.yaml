simpleMeaning: sweet sap for a drink and sugar, hard wood, and leaves for roof cover and weaving come
  from a tall fan-leaved tree of Africa, India, and Malaysia
scope: Also called longar palm, lontar, palmyra, palmyra palm, and toddy palm; a tall tree of Africa,
  India, and Malaysia, not the fishtail palm of India to the Malay Peninsula whose sap gives brown sugar
  and whose trunk gives sago.
examples:
- The wine palm grows tall in Malaysia.
- We saw a wine palm with fan leaves near the village.
