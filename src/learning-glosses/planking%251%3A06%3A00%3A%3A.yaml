simpleMeaning: On a ship, a covering or floor made of long, flat pieces of wood joined together
scope: This is the covering or floor itself on a ship, made of long flat pieces of wood; it is not those
  pieces of wood taken together as a supply, and not the work of putting such a covering in place.
examples:
- The ship's planking was worn smooth by years at sea.
- Water leaked through a gap in the planking of the old boat.
