simpleMeaning: A plant grown for its looks, of the genus Abutilon, with leaves that look like those of
  a broad-leaf tree.
scope: A plant grown for its looks, of the genus Abutilon, with leaves that look like those of a broad-leaf
  tree; not a tree grown for wood and not a plant grown for food.
examples:
- The flowering maple brightened the border with its leaves.
- Flowering maple is grown for its looks, not for its fruit.
