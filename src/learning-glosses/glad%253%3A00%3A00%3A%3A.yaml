simpleMeaning: feeling pleased and happy, or making other people feel that way, especially after something
  good has happened.
scope: This is not the plant sense of the word, and not a quiet feeling of satisfaction; it describes
  open happiness or something that produces it.
examples:
- She was glad to see her old friend at the door.
- The glad news spread through the village within an hour.
