simpleMeaning: Its surface shows two or more colors in separate patches, and the colors are most often
  bright.
scope: 'Also called painted, multicolor, multicolored, motley, piebald, pied, calico, multicolour, multicoloured,
  multi-color, multi-colored, multi-colour, multi-coloured, or particolored: having parts in different
  colors, most often bright, not one plain color all over.'
examples:
- The jester wore a particoloured coat of red, green, and gold.
- A particoloured dress hung in the shop window.
