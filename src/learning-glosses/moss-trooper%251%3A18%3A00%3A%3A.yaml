simpleMeaning: A robber who raids and steals, at first one who worked in the wet low lands between England
  and Scotland.
scope: A robber who raids and steals, first in the wet low lands between England and Scotland, not a soldier
  in an army and not a thief who works alone in a town.
examples:
- The moss-trooper rode off with the stolen cattle.
- Moss-troopers haunted the border lands in old times.
