simpleMeaning: the act of making something bad, like pain or annoyance, less strong
scope: This is the act of making something bad less strong, and relief is another name for it, not the
  bad thing itself and not stopping it for good.
examples:
- The medicine brought easing to her sore knee.
- A cool cloth gave some easing from the heat.
