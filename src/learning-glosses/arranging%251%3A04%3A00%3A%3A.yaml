simpleMeaning: A piece of music reworked so a different set of singers or players can perform it
scope: Also called arrangement; the work of fitting music for other voices or instruments, not the act
  of putting things in order.
examples:
- He spent the evening arranging the song for brass.
- Arranging music for a small band takes care.
