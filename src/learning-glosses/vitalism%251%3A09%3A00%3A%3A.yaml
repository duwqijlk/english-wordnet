simpleMeaning: In philosophy, the teaching that life cannot be explained by matter and chemistry alone,
  but needs a power of its own.
scope: In philosophy, it is the teaching that a power of their own, not matter or chemistry, is what makes
  living things alive.
examples:
- They turned to vitalism when matter and chemistry seemed to leave life unexplained.
- That vitalism set its followers against those who saw life as matter and chemistry alone.
