simpleMeaning: A tropical evergreen bush or small tree grown on a large scale in countries such as China,
  Japan, and India, whose leaves are dried for making a hot drink.
scope: This is the plant itself; it is not the drink made from its leaves, and not the afternoon meal.
examples:
- Tea is grown on the hillsides of southern India.
- The tea plant needs warm, wet weather.
