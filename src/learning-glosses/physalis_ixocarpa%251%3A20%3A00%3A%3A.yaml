simpleMeaning: A plant of Mexico and the southern United States that lives for one year, with sticky purple
  fruit that people eat, like small tomatoes.
scope: Also called tomatillo, jamberry, and Mexican husk tomato; a one-year plant of Mexico and the southern
  United States, set apart from other ground cherries by its sticky purple fruit like small tomatoes.
