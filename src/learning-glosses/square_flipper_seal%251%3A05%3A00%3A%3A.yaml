simpleMeaning: A middle-sized animal, greyish to yellow in colour, lives in the far north seas with stiff
  hairs on each side of its nose.
scope: Bearded seal, square flipper, and squareflipper are other names for this animal of the far north
  seas, of middle size and greyish to yellow in colour, with stiff hairs on each side of its nose, and
  not an animal of warm seas.
examples:
- The square flipper seal had stiff hairs on each side of its muzzle.
- A square flipper seal lives in the Arctic Ocean.
