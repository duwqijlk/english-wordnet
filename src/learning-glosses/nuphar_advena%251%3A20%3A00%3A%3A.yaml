simpleMeaning: A common water flower of the east and middle of North America, with wide leaves and round
  yellow blooms, in slow fresh or slightly salty water
scope: 'Also called cow lily, spatterdock, and yellow pond lily: a common water flower of the east and
  middle of North America, with wide leaves and round yellow blooms, not the white water flower of Egypt
  or the pale yellow water flower of the east.'
examples:
- Nuphar advena floated its round yellow blooms on the slow water.
- The Nuphar advena leaves spread wide across the pond.
