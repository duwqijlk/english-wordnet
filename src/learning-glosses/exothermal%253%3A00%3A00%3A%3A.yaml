simpleMeaning: Said of a chemical change or a chemical that happens or is made while heat is set free
scope: 'Also called exothermic or heat-releasing: said of a chemical change or chemical that sets heat
  free as it happens, not one that takes heat in.'
examples:
- The exothermal reaction warmed the beaker as it went on.
- An exothermal compound gives out heat while it forms.
