simpleMeaning: Someone who has earned high praise and deep respect from other people
scope: Someone who has earned high praise and respect, also called honorable, not someone who simply follows
  rules about what is right and good.
examples:
- He led an honourable life and was loved by all.
- She gave honourable service to her country for thirty years.
