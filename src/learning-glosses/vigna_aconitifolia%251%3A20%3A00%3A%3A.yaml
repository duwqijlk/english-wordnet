simpleMeaning: An East Indian bean plant with hairy leaves, small yellow flowers, and tube-shaped pods;
  used in India above all for food, feed, and richer soil; sometimes put with Phaseolus.
scope: An East Indian bean plant, also called moth bean and Phaseolus aconitifolius; not other bean plants
  of India and not the common bean.
examples:
- Vigna aconitifolia grows in the dry fields of India.
- Farmers sow Vigna aconitifolia to feed animals and enrich the soil.
