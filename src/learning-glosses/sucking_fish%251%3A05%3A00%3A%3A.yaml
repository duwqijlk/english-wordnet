simpleMeaning: A fish that clings by a round pad on its head to big fish or to things that move, with
  a long flat body in the sea.
scope: Also called remora and suckerfish, it is a sea fish with a long flat body that holds fast to big
  fish or moving things.
examples:
- A sucking fish held fast to the side of the shark.
- The sucking fish stayed fixed to the boat as it moved.
