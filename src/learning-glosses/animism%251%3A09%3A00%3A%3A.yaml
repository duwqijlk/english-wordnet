simpleMeaning: the view that all things in nature, and the whole world itself, have souls
scope: The view that all things in nature, and the whole world itself, have souls, not only people, and
  not the worship of one god.
examples:
- Animism is common among peoples who live close to the land.
- In animism, a river or a stone may be thought to have a soul of its own.
