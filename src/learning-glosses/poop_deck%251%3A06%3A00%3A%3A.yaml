simpleMeaning: an open flat top part on the raised back part of a ship, over only part of the ship
scope: An open flat top part on the raised back part of a ship, over only part of the ship, not the full-length
  top of the ship and not a covered part inside it.
examples:
- The sailors stood on the poop deck to look out over the sea behind the ship.
- From the poop deck, she could see the waves at the back of the ship.
