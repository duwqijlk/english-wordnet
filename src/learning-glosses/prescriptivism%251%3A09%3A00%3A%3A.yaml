simpleMeaning: In linguistics, the idea that rules for how a language should be used should be backed
  and spread
scope: In linguistics, a belief that backs rules for correct language use, not the ethics sense about
  moral statements and not the rules themselves.
examples:
- His prescriptivism led him to correct other people's grammar at every chance.
- Prescriptivism in language teaching backs strict rules for correct speech and writing.
