simpleMeaning: To show they are against plans to send them away or shut the place where they make things,
  people keep doing their jobs.
scope: This is a time when people keep doing their jobs as a protest against plans to send them away or
  shut the place where they make things.
examples:
- During the work-in, the workers kept doing their jobs.
- The work-in was a protest against the proposed closure.
