simpleMeaning: a dye got from lichens, a mix of fungus and green living things, that goes red in acids
  and blue in bases, used to roughly tell acid from base
scope: 'Also called litmus: a dye from lichens that goes red in acids and blue in bases, used only as
  a rough check, not a dye for cloth and not a tool that gives exact numbers.'
examples:
- We used a litmus test to check the water.
- The litmus test turned red, so the liquid was acid.
