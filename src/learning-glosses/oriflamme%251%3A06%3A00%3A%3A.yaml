simpleMeaning: A red flag, or one of red mixed with orange, carried as a sign by the first kings of France
scope: A red flag carried as a sign by the first kings of France, not a flag of later kings and not the
  sense of an inspiring idea that people rally round.
examples:
- The oriflamme flew above the early French king's army.
- The oriflamme was carried into battle as the king's standard.
