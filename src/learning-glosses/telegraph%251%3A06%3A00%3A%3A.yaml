simpleMeaning: a machine that sends messages far away along a wire, most often by a code of short and
  long sounds
scope: A machine that sends messages over a wire, most often in Morse code; not the verb sense of sending
  a telegram.
examples:
- The station used a telegraph to send the news to the next town.
- Before the telephone, the telegraph carried urgent messages across the country.
