simpleMeaning: A believer who has come to faith in Jesus through a striking change in their beliefs.
scope: This names a believer who came to faith in Jesus through a striking change in what they believed,
  set apart from other believers by the change that brought them to faith.
examples:
- He is a born-again Christian.
- She became a born-again Christian last year.
