simpleMeaning: A person is born with this illness, which usually passes from mother to son, hits boys
  and men, and makes bleeding hard to stop.
scope: Also called bleeder's disease and hemophilia, this illness passes from mother to son and usually
  hits boys and men.
examples:
- His haemophilia means a small cut can bleed for a long time.
- Haemophilia made the cut on his knee bleed without stopping.
