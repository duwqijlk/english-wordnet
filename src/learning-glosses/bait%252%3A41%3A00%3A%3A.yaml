simpleMeaning: to draw a person or an animal into danger by tempting them with something they want, so
  they can be caught
scope: To draw a person or an animal into danger by tempting them with something they want so they can
  be caught, not to pick on a person with unkind words.
examples:
- He baited the trap with cheese.
- They baited the fish with worms.
