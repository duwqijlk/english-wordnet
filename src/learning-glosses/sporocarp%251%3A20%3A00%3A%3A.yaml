  new plants start.
scope: A changed leaf part of some water ferns that wraps round the tiny cases where new plants start;
  spore case is another name for it.
examples:
- The sporocarp wraps round the tiny cases in the water fern.
- A sporocarp is a leaf part with a new shape in some water ferns.
