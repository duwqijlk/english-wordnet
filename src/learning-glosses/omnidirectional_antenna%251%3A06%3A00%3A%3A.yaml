simpleMeaning: a device that sends or takes in signals the same in every direction
scope: A device that sends or takes in signals the same in every direction; nondirectional antenna is
  another name for this sense, not a device that picks up waves from one way only and not a dish.
examples:
- The omnidirectional antenna picks up signals from all sides.
- Ships use an omnidirectional antenna to send and take in radio waves.
