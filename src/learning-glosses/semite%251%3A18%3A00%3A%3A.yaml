simpleMeaning: One of a group of peoples who speak that tongue, of the Middle East and the north of Africa.
scope: One of the peoples who speak that tongue in the Middle East and the north of Africa, not a person
  of another group and not the adjective sense.
examples:
- The Semite traced his family back to the Middle East.
- A Semite scholar studied the old tongues of northern Africa.
