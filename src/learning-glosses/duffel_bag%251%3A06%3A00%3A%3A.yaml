simpleMeaning: thick cloth sewn into a big, long, round sack holds the things a person owns
scope: 'Also called duffel, duffle and duffle bag: thick cloth sewn into a big, long, round sack holds
  the things a person owns, not a stiff case and not a small handbag.'
examples:
- He stuffed his clothes into a duffel bag for the trip.
- The duffel bag held all her gear for camp.
