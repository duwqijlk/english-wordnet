simpleMeaning: a coin of the United States or Canada equal in value to 25 cents
scope: This is the coin, not the 25-pound weight of the same name, and not any fourth part of a sum.
examples:
- She dropped a quarter into the parking meter.
- The candy used to cost a quarter, but now it costs a dollar.
