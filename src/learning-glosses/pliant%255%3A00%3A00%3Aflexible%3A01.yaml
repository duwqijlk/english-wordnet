simpleMeaning: does not break when it is bent or twisted
scope: 'Also called waxy, pliable and bendable: able to bend or twist without breaking, not the sense
  about being shaped or pulled into a new form.'
examples:
- The pliant wire bent easily without snapping.
- A pliant young tree moved in the wind but did not break.
