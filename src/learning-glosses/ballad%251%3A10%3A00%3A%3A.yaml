simpleMeaning: a poem that tells a story and comes from ordinary people
scope: A poem that tells a story and comes from ordinary people; lay is another name for this sense, not
  a song, and not a poem written by a known writer for the page.
examples:
- She recited a ballad, a poem telling the story of a sailor lost at sea.
- He read a ballad from an old book of folk poems.
