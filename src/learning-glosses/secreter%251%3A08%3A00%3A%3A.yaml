senseId: 'secreter%1:08:00::'
synsetId: 05335315-n
simpleMeaning: A part of the body that makes liquids the body needs and sends them out through tubes or
  straight into the blood
scope: 'Also called a gland, a secretor, and a secretory organ: a part of the body that makes liquids
  the body needs; not a part that stores food and not a part that moves blood.'
examples:
- The secreter sends its liquid into the blood.
- Each secreter in the body makes a liquid the body needs.
