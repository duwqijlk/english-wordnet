simpleMeaning: A whole set of clothes and other small things for a new baby
scope: A complete set for a new baby, not a single baby garment and not the furniture of a nursery.
examples:
- She packed the layette into a small bag before the baby was born.
- The layette included tiny shirts, socks, and a soft blanket.
