simpleMeaning: In still muddy water in the southern United States lives a salamander shaped like an eel,
  with two pairs of tiny feet.
scope: This is the eel-like salamander of the still, muddy waters of the southern United States, also
  called a blind eel, a congo eel or a congo snake, and not a true eel.
examples:
- We saw an amphiuma in the muddy pond.
- We found an amphiuma in the still muddy water.
