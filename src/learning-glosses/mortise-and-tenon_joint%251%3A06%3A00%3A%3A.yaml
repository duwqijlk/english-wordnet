senseId: 'mortise-and-tenon_joint%1:06:00::'
synsetId: 03793056-n
simpleMeaning: One piece is fixed to another when a part that sticks out is pushed into a hole cut to
  take it
scope: 'Also called a mortise joint: two pieces joined by a sticking-out part pushed into a cut hole,
  not pieces joined with nails or glue.'
examples:
- The carpenter cut a mortise-and-tenon joint to join the table legs.
- A mortise-and-tenon joint holds the frame firm without any nails.
