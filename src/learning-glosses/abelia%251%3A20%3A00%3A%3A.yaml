simpleMeaning: A deciduous or evergreen ornamental shrub with simple leaves set opposite each other and
  clusters of small white, pink or purplish flowers, native to Asia and Mexico.
scope: An ornamental flowering shrub grown in gardens; it is not a tree or a herb.
examples:
- A row of abelia hedged the path, covered in small pink flowers.
- Abelia grows well against a sunny wall.
