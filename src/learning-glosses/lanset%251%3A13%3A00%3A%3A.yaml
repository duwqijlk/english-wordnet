simpleMeaning: This fruit from the East Indies is yellow, tastes sharp, and looks like a berry
scope: A yellow fruit from the East Indies that tastes sharp and looks like a berry, also called lansa,
  lansat and lanseh; not the tree that bears it and not a sweet berry.
examples:
- A lanset sat in the fruit bowl.
- He tried a lanset and liked its tart flavour.
