simpleMeaning: A woman who spends time out of doors, as in hunting and fishing
scope: A woman who spends time out of doors, as in hunting and fishing, not a woman who works indoors
  and not a woman who only watches outdoor sports.
examples:
- The outdoorswoman spent the summer fishing in the north.
- She is an outdoorswoman who hunts in the hills each autumn.
