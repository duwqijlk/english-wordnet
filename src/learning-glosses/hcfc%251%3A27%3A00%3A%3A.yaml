simpleMeaning: A gas of fluorine and carbon taking the place of chlorofluorocarbon as a cooling gas and
  spray gas in cans; it harms the air less, but still does some harm.
scope: 'Also called hydrochlorofluorocarbon: a fluorine-and-carbon gas used as a cooling gas and a spray
  gas in cans, taking the place of chlorofluorocarbon; it harms the air less than the gas it replaces,
  but still does some harm.'
examples:
- HCFC is used in cans as a spray gas.
- Fridges now use HCFC instead of chlorofluorocarbon.
