simpleMeaning: A time from the twenty-fourth of December to the sixth of January.
scope: Also called Yuletide, Christmas, Christmastide, Christmastime and Noel, this is a period of days
  from the twenty-fourth of December to the sixth of January, not one single day.
examples:
- We spent Yule with my grandparents this year.
- Yule begins on the twenty-fourth of December.
