simpleMeaning: A kind of penicillin that still works on staph germs which other penicillins cannot kill,
  because those germs make something that breaks penicillin down
scope: A kind of penicillin that still works on staph germs which other penicillins cannot kill, not a
  drug that kills all germs and not a cream rubbed on the skin.
examples:
- The doctor gave him oxacillin for the infection.
- Oxacillin still works on germs that other penicillins cannot kill.
