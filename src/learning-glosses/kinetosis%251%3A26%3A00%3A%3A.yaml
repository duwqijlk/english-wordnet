simpleMeaning: Feeling dizzy or sick because of the movement of a moving vehicle you are travelling in
  or on
scope: This is feeling dizzy or sick because of the movement of a moving vehicle you are travelling in
  or on; motion sickness is another name for this sense, not dizziness from illness and not fear of travelling.
examples:
- Kinetosis made him feel sick on the long bus ride.
- She suffers from kinetosis whenever she travels by boat.
