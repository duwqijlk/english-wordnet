simpleMeaning: A changing flow of power comes from a bit of mineral shaken by sound waves, in this sound
  catcher.
scope: Also called a crystal mike, this sound catcher makes its power from a shaking bit of mineral, not
  one with no mineral at all.
examples:
- The crystal microphone turned sound waves into a changing flow of power.
- Sound waves shook the bit of mineral in the crystal microphone.
