senseId: grandiose%5:00:00:pretentious:00
synsetId: 01856216-s
simpleMeaning: Acting polite and grand in a put-on way, as if one were more important than one is, and
  looking down on others.
scope: Acting grand and polite in a put-on way and looking down on others, also called highfalutin, hifalutin,
  highfaluting, hoity-toity, or la-di-da, not impressive through needless size and splendour.
examples:
- His manner was grandiose, full of put-on politeness.
- She was grandiose at the party, looking down on everyone there.
