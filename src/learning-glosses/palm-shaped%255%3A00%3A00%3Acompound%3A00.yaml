simpleMeaning: Said of a leaf like the flat part of a hand, with small leaflets or lobes spreading out
  from one point
scope: 'Also called palmate: said of a leaf with leaflets or lobes spreading out from one point, not a
  leaf with a smooth edge and not a leaf with leaflets in a row.'
examples:
- The palm-shaped leaf had five lobes spreading from one point.
- Look for a palm-shaped leaf, with leaflets that spread out like fingers from one point.
