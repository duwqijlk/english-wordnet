simpleMeaning: A pretty set of bits of metal or glass or baked clay, hung loose together so that moving
  air makes them ring
scope: A pretty set of bits hung loose so moving air makes them ring; wind bell is another name for this
  sense, and it is not a church bell or a door bell.
examples:
- The wind chime rang softly all night.
- A wind chime hung by the back door.
