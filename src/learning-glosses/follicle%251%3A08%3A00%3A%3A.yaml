simpleMeaning: any very small round group of cells (the tiny parts that make up living things) with an
  empty space inside
scope: A very small round group of cells with a space inside, not a single cell on its own.
examples:
- Each follicle in the skin holds a hair at its base.
- Under the microscope, each follicle looked like a tiny round bag.
