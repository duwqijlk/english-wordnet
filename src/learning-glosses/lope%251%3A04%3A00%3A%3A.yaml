simpleMeaning: A smooth, easy way of running in three beats, faster than a trot and slower than a gallop.
scope: A smooth three-beat way of running, between a trot and a gallop; also called a canter.
examples:
- The horse broke into a lope across the field.
- She watched the dog's easy lope along the track.
