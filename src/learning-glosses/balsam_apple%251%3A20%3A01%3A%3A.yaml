simpleMeaning: A climber from the warm lands of the Old World; it flowers, and its fruit is red or orange,
  covered in small bumps.
scope: This flowering climber of warm lands is known by its red or orange fruit covered in small bumps.
examples:
- Red fruit covered in small bumps hung from the balsam apple.
- We saw the balsam apple by its red fruit.
