simpleMeaning: This body protein holds back a virus that has got into a cell, so the virus cannot make
  more copies of itself
scope: This protein is one of the body's own defences, made by a cell once a virus has got inside it.
examples:
- The cells made interferon after the virus got inside them.
- The interferon held the virus back, so it made far fewer copies.
