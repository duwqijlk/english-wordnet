simpleMeaning: It warns people that bad or sad things are on the way, and makes them afraid
scope: 'Also called minacious, threatening, ominous, menacing, sinister, forbidding and baleful: it warns
  of bad or sad things still to come, not a kind word and not a plain fact about what will happen.'
examples:
- She gave him a minatory look.
- The minatory letter warned of what would follow.
