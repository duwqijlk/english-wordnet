simpleMeaning: by a rule of geology, the bottom bed in a set of laid-down rock formed first and is the
  oldest
scope: In geology, this rule is also called superposition and the principle of superposition.
examples:
- Geologists use the superposition principle to order rock beds.
- The superposition principle puts the oldest bed at the bottom.
