simpleMeaning: In sailing, a deep hollow in a ship where water that leaks in runs to be pumped out
scope: A hollow in a ship where leaked water runs to be pumped out, not a tank that holds drinking water
  and not the lowest room where goods are stored.
examples:
- The bilge well filled with water after the storm.
- The crew pumped the bilge well dry before they set sail.
