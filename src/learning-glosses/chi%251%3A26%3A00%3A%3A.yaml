simpleMeaning: the life power thought to flow through all things in Zhongguo thought; in its traditional
  medicine, people believe good health needs a balance of its negative and positive forms
scope: Also called ki, qi and ch'i. Zhongguo is the name, in its own language, for the big country in
  East Asia; this is the life power in that country's thought and medicine, not a body part or a thing
  you can see.
examples:
- In Chinese medicine, doctors try to keep the chi flowing well through the body.
- She does slow morning exercises to help her chi and stay healthy.
