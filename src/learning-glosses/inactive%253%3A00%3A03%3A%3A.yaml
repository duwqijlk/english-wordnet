simpleMeaning: not doing anything, and not working or being used
scope: This sense is about not working or not being used, as with a machine or an account. Not a volcano
  that is not erupting, not the chemistry sense of not taking part in a change with other things, and
  not the sickness sense of not growing, or growing only slowly.
examples:
- The factory has been inactive for months, with all its machines silent.
- He closed his inactive bank account after two years.
