simpleMeaning: Said of things that belong to the main city of Kuwait, or to the people who live there.
scope: This word marks things of the main city of Kuwait and the people who live there, not the kingdom
  of Kuwait as a whole, and not a person from Kuwait.
examples:
- Kuwaiti streets are lined with luxury stores.
- The Kuwaiti shops were busy.
