simpleMeaning: White flowers on this long-lived herb from Europe and Asia give off fumes that can catch
  fire in hot weather.
scope: Also called dittany, burning bush, or fraxinella, this long-lived herb from Europe and Asia is
  known for white flowers that give off fumes able to catch fire in hot weather.
examples:
- The gas plant stood in the garden, its white flowers open.
- In hot weather the gas plant gave off fumes that could catch fire.
