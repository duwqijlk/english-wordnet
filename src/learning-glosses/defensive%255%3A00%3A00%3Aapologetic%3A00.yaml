simpleMeaning: trying in speech or writing to show that what you did was right
scope: For speech or writing that tries to show an action was right; not for things used to guard against
  attack, and not for a person's guarded way of acting.
examples:
- His letter sounded defensive, as if he had to explain every choice he made.
- She gave a defensive answer when asked why she was late.
