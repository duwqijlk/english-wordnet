simpleMeaning: a field of study that looks at how the mind takes in what words mean
scope: This is a field of study that looks at how the mind takes in what words mean, also called conceptual
  semantics; not the study of how words are used in talk.
examples:
- She took a course in cognitive semantics to learn how people grasp word sense.
- His paper on cognitive semantics looked at how the mind takes in the sense of space words.
