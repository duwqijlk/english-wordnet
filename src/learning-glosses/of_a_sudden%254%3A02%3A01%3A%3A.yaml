simpleMeaning: With no plan made first, on a quick urge, a thing happens when it is not expected, done
  fast and with no warning
scope: Done fast, with no warning and no plan made first, and not done slowly after long thought; abruptly,
  suddenly, dead, short, all of a sudden and on the spur of the moment are other names for this.
examples:
- He stopped of a sudden and turned back.
- Of a sudden, she felt a sharp pain in her side.
