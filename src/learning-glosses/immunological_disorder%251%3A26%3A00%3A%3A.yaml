simpleMeaning: A sickness that comes from the body's defences going wrong
scope: A sickness caused by the body's defences going wrong, not an infection from outside and not a sickness
  of one organ alone.
examples:
- An immunological disorder made her own body attack her joints.
- He suffers from an immunological disorder that weakens his defences.
