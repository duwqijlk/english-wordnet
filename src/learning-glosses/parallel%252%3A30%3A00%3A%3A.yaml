simpleMeaning: to put a thing so it runs in the same direction as another, at the same distance all along
scope: To set a thing so it runs beside another at the same distance all along, not the line itself and
  not to run beside a thing.
examples:
- The workers paralleled the new path to the road.
- She paralleled the fence to the edge of the field.
