simpleMeaning: a cover for a jar or glass bottle that you take away by turning it
scope: A cover for a jar or glass bottle that you take away by turning it, also called a twist-off lid;
  not a cover that pulls straight up and not a screw top that stays fixed.
examples:
- She gave the twist-off cap a turn and the jar opened.
- The twist-off cap on the jam jar came loose after one turn.
