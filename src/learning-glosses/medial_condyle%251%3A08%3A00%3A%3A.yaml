simpleMeaning: At the lower end of the thigh bone, on its inner side, a rounded knob of bone sticks out
scope: A knob of bone at the lower end of the thigh bone, on the inner side, not a knob on the outer side
  and not the whole thigh bone.
examples:
- The doctor pointed to the medial condyle on the inner side of her knee.
- A scan showed a small crack in the medial condyle of the thigh bone.
