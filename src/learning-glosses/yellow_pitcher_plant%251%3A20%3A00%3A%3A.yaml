simpleMeaning: Lids that stand up top tall yellow tubes that flare at the top, with wide mouths, on this
  plant of the southeast United States.
scope: 'Also called trumpets, huntsman''s horn, huntsman''s horns, and yellow trumpet: a plant of the
  southeastern United States with tall yellow tubes.'
examples:
- The yellow pitcher plant stood with its yellow tubes open.
- We saw a yellow pitcher plant with lids standing up over its tubes.
