simpleMeaning: to put a day, month, and year on something, or to work out when something probably happened.
scope: This is putting or finding a time on something, not going out with someone romantically and not
  the sweet fruit of a palm tree.
examples:
- Please date your check before signing it.
- Experts dated the bones to about ten thousand years ago.
