simpleMeaning: ticks, flies, or touching sick animals can at times pass this sickness, which spreads very
  fast among rodents, above all rabbits and squirrels, to people
scope: 'Also called deer fly fever, rabbit fever, tularaemia, and tularemia: a sickness of rodents that
  at times reaches people, not a sickness of people alone and not one spread by dirty water.'
examples:
- Yatobyo spread fast among the rabbits in the field.
- A hunter caught yatobyo after handling a sick squirrel.
