simpleMeaning: the color of growing grass, or a paint or dye of this color
scope: 'Also called green: the color itself, or a paint or dye of that color; not the rich, full look
  of plants growing strongly.'
examples:
- The greenness of the dye was too bright for the cloth.
- She chose a paint for its deep greenness, like the color of grass.
