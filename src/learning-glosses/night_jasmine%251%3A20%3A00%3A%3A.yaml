simpleMeaning: Sweet-smelling yellow-white blooms shaped like funnels grow in bunches on a West Indian
  bush that keeps its green leaves all year, and give off their scent after dark.
scope: Night jessamine is another name for this West Indian bush, whose blooms give off a sweet scent
  only after dark.
examples:
- The night jasmine gave off a sweet smell after dark.
- Night jasmine blooms open in bunches and smell sweet after dark.
