senseId: 'cryosurgery%1:04:00::'
synsetId: 00670072-n
simpleMeaning: Unwanted body tissue such as warts, cataracts, or skin cancers is killed off by very great
  cold, most often liquid nitrogen.
scope: Freezing off unwanted tissue, not cutting it out with a knife and not burning it away.
examples:
- The doctor used cryosurgery to remove the wart.
- Cryosurgery froze the small skin cancer away.
