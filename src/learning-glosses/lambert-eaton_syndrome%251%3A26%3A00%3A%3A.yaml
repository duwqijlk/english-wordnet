simpleMeaning: A disorder seen with lung cancer, marked by weak, tiring hip and thigh muscles and an aching
  back, caused by antibodies that attack the joins where nerves meet muscles.
scope: 'Also called carcinomatous myopathy, myasthenic syndrome, and Eaton-Lambert syndrome: a disorder
  of weak hip and thigh muscles seen with lung cancer, not ordinary tiredness and not a disease of the
  lungs themselves.'
examples:
- Lambert-Eaton syndrome left her legs weak and her back aching.
- The doctor linked his Lambert-Eaton syndrome to his lung cancer.
