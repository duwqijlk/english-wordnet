simpleMeaning: A tree from Europe and Asia, prized for its large nut that can be eaten and its hard wood
  with a rich pattern, grown widely
scope: This is a tree from Europe and Asia prized for its nut and wood; Circassian walnut, English walnut,
  English walnut tree and Juglans regia are other names for it, not a tree with a small inedible nut.
examples:
- Persian walnut is widely cultivated for its large edible nut.
- The Persian walnut has hard wood with a rich pattern.
