simpleMeaning: go after someone or something, or move along behind them as if chasing
scope: This is not obeying rules, tracking how something develops, or subscribing online; it is going
  after someone or moving behind them.
examples:
- The dog followed the boy all the way home.
- Detectives followed the suspect across the city.
