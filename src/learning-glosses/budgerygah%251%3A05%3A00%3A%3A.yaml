simpleMeaning: A small parrot from Australia, usually pale green, with black and yellow marks in the wild,
  now bred in many colours
scope: A small Australian parrot; lovebird, budgerigar, budgie, budgereegah and grass parakeet are other
  names for this bird, not a large parrot and not a wild bird of another kind.
examples:
- The budgerygah chattered from its perch in the cage.
- Wild budgerygahs are pale green with black and yellow marks.
