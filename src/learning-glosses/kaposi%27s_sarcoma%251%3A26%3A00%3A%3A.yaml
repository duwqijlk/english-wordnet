simpleMeaning: A cancer that starts as purple spots on the feet and legs and spreads from the skin to
  glands and organs inside the body; a common sign of AIDS
scope: This is a cancer that starts with purple spots and spreads through the body, not the rare skin
  rash that follows a smallpox vaccination.
examples:
- Kaposi's sarcoma often appears in people with AIDS.
- The doctor found Kaposi's sarcoma on his leg.
