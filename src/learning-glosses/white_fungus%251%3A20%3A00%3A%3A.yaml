simpleMeaning: Live fish, tadpoles, and eggs get a pale coat of threads on their outer parts, such as
  fins, when this growth attacks them and brings on disease.
scope: A pale growth that attacks live fish, tadpoles, and eggs and coats their outer parts, such as fins,
  not a growth on plants.
examples:
- A white fungus spread over the fins of the sick fish.
- The white fungus left a pale coat on the spawn.
