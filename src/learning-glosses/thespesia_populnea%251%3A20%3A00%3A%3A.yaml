simpleMeaning: A tropical tree, usually coastal, sometimes grown for show for rounded heart-shaped leaves
  and showy yellow and purple flowers, giving valued pink to dark red wood and seed oil.
scope: Not a palm or a mangrove, other tropical shore trees; also called a bendy tree, a portia tree,
  and a seaside mahoe.
examples:
- Thespesia populnea grows along the sandy shore.
- The Thespesia populnea by the beach had yellow flowers.
