simpleMeaning: In wet ground in Europe grows a sweet-smelling herb with a scent like the bergamot orange;
  it now grows wild in the east of North America.
scope: Also called water-mint, it is a sweet-smelling herb that thrives in wet places.
examples:
- Water mint grew in the wet ground by the stream.
- The water mint smelled like bergamot orange.
