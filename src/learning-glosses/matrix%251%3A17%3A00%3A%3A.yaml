simpleMeaning: a closed space or surrounding place where something starts or grows
scope: This is a place where something starts or grows, not a set of numbers in rows and columns, not
  rock that holds old remains, and not a mold for making records.
examples:
- The liquid gel forms a matrix in which new cells can grow.
- A plant needs a good matrix of soil and water to start growing.
