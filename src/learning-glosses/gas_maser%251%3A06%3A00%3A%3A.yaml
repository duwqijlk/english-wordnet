simpleMeaning: A device in which very short radio waves meet and act on tiny bits of fuel vapour.
scope: This is a device in which very short radio waves meet and act on tiny bits of fuel vapour, not
  a device that makes a beam of light and not an ordinary radio set.
examples:
- The lab used a gas maser to study the vapour.
- A gas maser can make very steady radio waves.
