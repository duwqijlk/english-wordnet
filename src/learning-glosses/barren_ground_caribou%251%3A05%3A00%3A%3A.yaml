simpleMeaning: a kind of northern deer of the cold treeless lands of northern Canada; in some groupings
  it is counted as part of the kind Rangifer tarandus
scope: A northern deer of the Canadian tundra, not a reindeer of the far north and not a woodland caribou.
examples:
- Barren ground caribou cross the tundra in great herds.
- The barren ground caribou spends the summer on the open tundra.
