simpleMeaning: A network of nerves serving the pelvic area and the lower limbs, built from the fourth
  and fifth lumbar nerves and the first three sacral nerves.
scope: The everyday English name for the plexus sacralis, the nerve network serving the pelvic area and
  the legs; not the lumbar plexus above it, and not the sciatic nerve it gives off.
examples:
- The sacral plexus sends branches to the buttocks, the back of the thigh and the lower leg.
- A growth pressing on the sacral plexus can cause pain down one leg.
