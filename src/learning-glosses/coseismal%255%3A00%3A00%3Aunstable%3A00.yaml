senseId: coseismal%5:00:00:unstable:00
synsetId: 02300035-s
simpleMeaning: at a place where the shaking from an earthquake gets there at the same time
scope: This is a place where the shaking from an earthquake gets there at the same time; coseismic is
  another name for this sense, not a place where the shaking gets there at a different time.
examples:
- The town lies on a coseismal line, so the shaking reaches every point on it at the same time.
- Scientists drew a coseismal map of the places where the earthquake waves got there at the same time.
