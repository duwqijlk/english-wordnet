senseId: 'pogrom%1:04:00::'
synsetId: 00422205-n
simpleMeaning: organized cruel and unfair treatment of a group of people who share the same origin or
  way of life, especially Jews
scope: This is planned harm against a group of people, especially Jews, not a single attack by one person
  and not harm in a war between armies.
examples:
- The pogrom forced many Jewish families to leave their town.
- People still remember the pogrom in which their shops were burned.
