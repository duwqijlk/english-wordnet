simpleMeaning: The same acts done again and again in a fixed pattern by someone whose troubled mind makes
  them keep doing them, an old word no longer used.
scope: This old name covers the fixed set of acts done by a person with such a condition, not the condition
  itself.
examples:
- She kept doing the same acts, and the old word anancasm was used for them.
- Anancasm is an old word for the acts she could not stop repeating.
