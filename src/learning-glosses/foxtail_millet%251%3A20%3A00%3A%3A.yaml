senseId: 'foxtail_millet%1:20:00::'
synsetId: 12155787-n
simpleMeaning: A coarse, drought-tolerant grass that lives one year, grown in Europe and Asia for grain,
  hay and forage, and in the United States mainly for hay and forage.
scope: This sense names the grass itself, not the grain harvested from it. Other millets are separate
  cereal grasses, and the regional detail describes where and for what it is grown rather than a second
  sense.
examples:
- A field of foxtail millet rippled in the wind.
- They fed the cattle on foxtail millet through the winter.
