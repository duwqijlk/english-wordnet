simpleMeaning: To give a quantity or idea in signs or a formula instead of ordinary words.
scope: This is putting a quantity into signs or a formula, not saying what you feel and not simply standing
  for an idea.
examples:
- The speed can be expressed as distance divided by time.
- Express the answer in metres per second, not in miles per hour.
