simpleMeaning: a copy of how a person or scene looks, printed on paper, on a clear slide, or stored as
  computer data
scope: This is a still image, not a film with movement or a description in words.
examples:
- She hung a picture of her grandparents above the fireplace.
- The report includes a picture of the damaged part, saved as a digital file.
