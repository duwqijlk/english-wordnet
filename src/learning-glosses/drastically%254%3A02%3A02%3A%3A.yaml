simpleMeaning: in a very strong way that has a big effect
scope: This means a change or act with a very big, strong effect; it is not a small, weak, or gentle way.
examples:
- Prices rose drastically after the storm cut off supplies.
- She changed her plans drastically and sold almost everything she owned.
