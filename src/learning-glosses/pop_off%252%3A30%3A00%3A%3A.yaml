simpleMeaning: When the body loses all it needs to stay alive, life stops
scope: To stop living, losing all the body needs to stay alive; also called die, go, pass, choke, exit,
  croak, decease, expire, perish, conk, buy the farm, cash in one's chips, drop dead, give-up the ghost,
  kick the bucket and pass away, not merely to faint or fall asleep.
examples:
- He popped off in his sleep.
- The old man popped off at the age of 102.
