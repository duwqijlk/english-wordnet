senseId: 'budding%1:22:00::'
synsetId: 13463132-n
simpleMeaning: 'a way some one-cell living things, such as yeasts, make new ones: a part grows, becomes
  different, narrows, and then breaks off from the parent'
scope: This is about one-cell living things making new ones in this way, not a plant's new growth and
  not something that is just starting to grow.
examples:
- The yeast made new cells by budding.
- In budding, a small part of the parent cell grows and then breaks off.
