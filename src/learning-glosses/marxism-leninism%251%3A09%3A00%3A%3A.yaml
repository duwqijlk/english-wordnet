simpleMeaning: Lenin's political and economic ideas guided the Soviet Union; his change to Marx's ideas
  put rule by empires first in capitalism, shifting the fight from rich lands to poor ones.
scope: Also called Leninism; the ideas of Lenin that guided the Soviet Union, not the ideas of Marx alone
  and not a form of government.
examples:
- Marxism-Leninism was the guiding doctrine of the Soviet Union.
- Followers of Marxism-Leninism say that rule by empires is the highest form of capitalism.
