simpleMeaning: A twining vine of the Old World tropics with three-part leaves and purple pea-like flowers,
  dark-red pods of edible seeds, for show and food in South Asia, in Dolichos sometimes.
scope: Not the Catalpa tree called Indian bean, nor other climbing food plants; also called bonavist,
  hyacinth bean, Dolichos lablab, Egyptian bean, and Indian bean.
examples:
- Lablab purpureus climbs the trellis in the garden.
- We grow Lablab purpureus for its dark-red pods.
