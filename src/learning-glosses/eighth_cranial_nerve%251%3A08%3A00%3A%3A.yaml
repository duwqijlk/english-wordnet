simpleMeaning: The tiny hairs of the balance organ and of the coiled hearing organ send their signals
  along this sense nerve, which comes in two parts.
scope: The acoustic nerve, the auditory nerve, the vestibulocochlear nerve, and nervus vestibulocochlearis
  are all names for the sense nerve that serves the balance organ and the hearing organ.
examples:
- The eighth cranial nerve carries signals from the inner ear to the brain.
- Damage to the eighth cranial nerve can upset both hearing and balance.
