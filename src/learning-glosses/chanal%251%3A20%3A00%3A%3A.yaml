simpleMeaning: Small orange or yellow flowers, then berries good to eat, grow on a prickly bush or small
  tree found in much of central Argentina
scope: Also called chanar, this prickly bush or small tree of central Argentina bears small orange or
  yellow flowers and then berries good to eat.
examples:
- We saw a chanal with small orange flowers in central Argentina.
- The chanal berries were good to eat after the flowers had gone.
