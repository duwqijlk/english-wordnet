simpleMeaning: A liquid acid with a carbon part, not full of hydrogen, that makers use to build acrylic
  resins.
scope: Also called acrylic acid, this is the liquid acid, not full of hydrogen, that makers use to build
  acrylic resins.
examples:
- They bought propenoic acid to make acrylic resins.
- Some propenoic acid went into the resin mix.
