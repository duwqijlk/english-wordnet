simpleMeaning: A part of a frame that makes it stiff so it will not bend.
scope: A stiffening part of a frame, not the straps that hold trousers up and not the verb sense of getting
  ready.
examples:
- The builders added a brace to stiffen the wooden frame.
- A steel brace held the frame firm against the wind.
