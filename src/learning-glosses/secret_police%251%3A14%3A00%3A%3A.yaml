simpleMeaning: A hidden force that works without being seen, most often against people thought to have
  turned on their country or stirred up revolt
scope: A hidden force that works without being seen, most often against people thought to have turned
  on their country or stirred up revolt; not the ordinary police who work in the open and not an army.
examples:
