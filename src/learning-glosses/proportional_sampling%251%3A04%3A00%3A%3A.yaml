senseId: 'proportional_sampling%1:04:00::'
synsetId: 00163238-n
simpleMeaning: a way of picking test groups in which a whole group is split into smaller groups and a
  few are picked by chance from each
scope: A way of picking test groups by splitting a whole group into smaller groups and picking a few by
  chance from each; also called representative sampling and stratified sampling; not picking a few from
  the whole group at random, and not asking everyone.
examples:
- Proportional sampling gave each small group a fair share of the test.
- The team used proportional sampling so no part of the town was left out.
