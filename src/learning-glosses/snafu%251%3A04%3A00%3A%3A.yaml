senseId: 'snafu%1:04:00::'
synsetId: 00076103-n
simpleMeaning: A word made from the first letters of 'things as usual, all in a mess', often used by soldiers
  in the Second World War.
scope: A soldiers' word for a normal mess in wartime, not the adjective for a thing tangled in confusion.
examples:
- The whole plan ended in a snafu.
- Another snafu held up the supplies.
