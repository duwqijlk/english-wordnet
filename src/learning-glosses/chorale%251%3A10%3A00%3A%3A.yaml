simpleMeaning: A grand Protestant church song tune, most of all one sung by Lutherans
scope: A grand Protestant church song tune, most of all one sung by Lutherans; choral is another name
  for this sense, not a song sung by the chorus in a play of old Greece and not a song for a choir in
  general.
examples:
- The organ played a chorale as the people left.
- Bach wrote many chorales for church use.
