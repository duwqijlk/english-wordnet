simpleMeaning: as thought of in a school of thought that puts free choice and personal meaning at the
  heart of life
scope: As seen by a school of thought about free choice and personal meaning, not the sense of dealing
  with existence itself and not the sense of coming from experience.
examples:
- It was an existential moment of choice for her.
- His existential doubts grew as he thought about freedom and death.
