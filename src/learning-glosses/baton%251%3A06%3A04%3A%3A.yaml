simpleMeaning: a short thick stick carried most of all by police officers to hit people with
scope: A police officer's club, not the thin rod a conductor uses, the hollow rod a drum major twirls,
  or the cylinder runners pass in a relay.
examples:
- The officer raised his baton to hold back the crowd.
- She saw a baton hanging from the policeman's belt.
