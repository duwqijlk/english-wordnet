simpleMeaning: a sound heard again after it hits a surface and comes back
scope: 'Also called echo and reverberation: a sound heard again after it comes back off a surface; not
  doing a test again and not DNA making a copy of itself.'
examples:
- The replication of the shout from the cave wall sounded like another voice.
- In the empty hall, every replication of his footsteps made him turn around.
