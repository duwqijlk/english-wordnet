simpleMeaning: A weak natural female sex hormone made by the ovaries of mammals; also made in a lab and
  sold under its trade name to treat a shortage of estrogen.
scope: A weak natural female sex hormone, also called estrone, oestrone or theelin; not a strong estrogen.
examples:
- The doctor prescribed Estronol for her estrogen deficiency.
- Estronol is made in a lab as well as in the body.
