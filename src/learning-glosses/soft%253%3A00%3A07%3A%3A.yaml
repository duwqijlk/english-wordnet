schema: oewn-learning-gloss-v2
senseId: 'soft%3:00:07::'
synsetId: 01461111-a
simpleMeaning: Chiefly in music, an instruction to perform quietly and with restraint.
scope: This is a musical instruction about how quietly and gently a piece is performed, not the general
  sense of a sound at low volume, nor a speech sound made with the tongue raised.
examples:
- The score marks the opening theme as soft, then builds to a forte.
- The conductor asked for a soft passage before the final crescendo.
