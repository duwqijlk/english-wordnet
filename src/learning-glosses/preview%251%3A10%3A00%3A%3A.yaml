simpleMeaning: a showing of a film to a chosen group of people before other people can see it
scope: This is an early showing of a whole film for a chosen group, not a short advertisement made of
  short scenes from the film.
examples:
- The actors were invited to a preview of the new film.
- Only a few writers got a ticket to the preview before the film opened to everyone.
