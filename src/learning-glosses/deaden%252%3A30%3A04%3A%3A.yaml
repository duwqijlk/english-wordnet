simpleMeaning: to change mercury (a silver liquid metal) into a grey powder made of very small round drops,
  as by shaking it with chalk or oil with fat in it
scope: To change mercury in this way, not to make something less strong or less lively, and not to slow
  something down.
examples:
- The worker deadened the mercury by shaking it with chalk.
- In the old process, they deadened metallic mercury with fatty oil.
