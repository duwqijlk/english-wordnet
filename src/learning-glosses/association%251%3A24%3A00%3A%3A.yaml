simpleMeaning: a connection between things or people that comes from their working together or relying
  on each other
scope: This is a link produced by contact or reliance, not an organized group of people and not a mental
  link between ideas.
examples:
- There is a close association between the two species.
- The association between the two firms began with a shared supplier.
