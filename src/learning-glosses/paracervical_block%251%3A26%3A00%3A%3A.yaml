senseId: 'paracervical_block%1:26:00::'
synsetId: 14052449-n
simpleMeaning: numbing of one part of the body by injecting a numbing drug on each side of the neck of
  the womb, used in labour and childbirth
scope: Numbing of one part of the body by injecting a numbing drug on each side of the neck of the womb,
  used in labour and childbirth; not numbing of the whole body and not a drug that puts the mother to
  sleep.
examples:
- The doctor gave a paracervical block during labour.
- A paracervical block numbs the cervix for childbirth.
