simpleMeaning: a hidden part of a country's trade where people pay in cash and the deals are not told
  to the state
scope: A hidden part of a country's trade where cash deals go unreported, not the open trade that is taxed
  and not a single secret deal.
examples:
- The black economy grew as more people paid in cash.
- The black economy hides cash deals from the tax office.
