simpleMeaning: having to do with the idea that things have a purpose
scope: Having to do with the idea that things have a purpose, not the idea that things happen by chance
  and not the study of causes.
examples:
- The teleological view sees purpose in the shape of the eye.
- His teleological claim was that the heart is made to pump blood.
