simpleMeaning: Clicking a marked word or small picture on the screen most often jumps you from one text
  file to another place or file.
scope: A word or picture you can click to jump to another place or file is this, not a plain word or picture
  with no such jump.
examples:
- Click on the hyperlink to go to the other file.
- The hyperlink in the text took you to another place.
