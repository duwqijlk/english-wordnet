senseId: 'accessory_after_the_fact%1:18:00::'
synsetId: 09779411-n
simpleMeaning: A person who helps or gives comfort to someone known to be a criminal or wanted by the
  law for a grave crime.
scope: Not a person who plans a crime beforehand and not a person who commits the crime.
examples:
- She was charged as an accessory after the fact for hiding the thief.
- An accessory after the fact helps a criminal once the crime is done.
