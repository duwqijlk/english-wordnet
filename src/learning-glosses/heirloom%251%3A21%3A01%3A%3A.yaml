senseId: 'heirloom%1:21:01::'
synsetId: 13285693-n
simpleMeaning: In law, any thing owned that law or custom treats as not to be split from what is left
  when a person dies, and is passed on with it
scope: In law, a thing owned that must stay with what is left when a person dies; not just any old family
  thing that a family keeps and passes down.
examples:
- The court said the ring was an heirloom, so it could not be sold apart from the house.
- Under the old law, the land was an heirloom and passed with the rest of what the owner left behind.
