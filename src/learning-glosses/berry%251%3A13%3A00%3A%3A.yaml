simpleMeaning: one of many kinds of small soft fruit that you can eat, used as sweet food at the end of
  a meal or to make jam, jelly and preserves
scope: This is the food sense, about small soft fruit that people eat; not the plant-science sense, which
  is about how a fruit grows.
examples:
- She put fresh berries on top of the cake for the sweet course.
- We made jam from the berries we picked that morning.
