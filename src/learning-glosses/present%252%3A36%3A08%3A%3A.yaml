simpleMeaning: Depict something in a generalized or symbolic way, as in a picture, sketch, or carved figure.
scope: This is the depict-in-art sense, not performing a play or putting on a stage show, not exhibiting
  something to an audience, not handing something over formally, not giving something as a gift, not offering
  an idea for others to consider, and not introducing someone to another person.
examples:
- The artist presents the queen as a distant, shadowy figure in the mural.
- In his sculpture, the war is presented as a tangle of broken wheels.
