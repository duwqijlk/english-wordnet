simpleMeaning: Sworn statements are taken, papers are said in writing to be real and true, and people
  are watched as they sign by this person, given power by law.
scope: A notary is another name for this person, given power by law to watch people sign their names,
  to say in writing that a paper is real and true, and to take sworn statements.
examples:
- The notary public watched her sign her name on the paper.
- We went to a notary public to have the document certified.
