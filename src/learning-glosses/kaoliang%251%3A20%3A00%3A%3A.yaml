simpleMeaning: Small white or brown grains eaten as food and dry stalks with a soft centre used for fodder,
  fuel, and thatching mark kinds of sorghum from China and Manchuria.
scope: Its small white or brown grains and dry stalks with a soft centre set this sorghum of China and
  Manchuria apart from other sorghums.
examples:
- Kaoliang grain was eaten as food.
- Kaoliang stalks were used to thatch the roof.
