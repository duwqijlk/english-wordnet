simpleMeaning: Waves of energy that copy an enemy's signals are sent into the enemy's machines
scope: 'Also called imitative electronic deception: waves of energy that copy an enemy''s signals are
  sent into the enemy''s machines so they read them as their own signals, not a real attack on the machines
  and not listening in on what the enemy sends.'
examples:
- The enemy's radar was fooled by electronic imitative deception that copied its own signals.
- Troops used electronic imitative deception to make the enemy's systems read false signals as their own.
