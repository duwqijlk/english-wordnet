senseId: 'scholium%1:10:00::'
synsetId: 06518028-n
simpleMeaning: a note in the margin of a book, written by a person who explains old or classical books
scope: A note in the margin of a book, also called scholia; not a note by the author, and not a note written
  in the main text.
examples:
- The scholium in the margin explains this line of Virgil.
- Each scholium gives the reader help with a hard passage.
