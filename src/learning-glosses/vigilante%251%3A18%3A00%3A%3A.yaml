simpleMeaning: a member of a group set up to watch for crime and punish people who break the law
scope: A member of a group that watches for crime and punishes people who break the law, not a police
  officer and not a person acting alone to punish crime.
examples:
- The vigilante met with the rest of the group each evening.
- As a vigilante, he helped the group watch the streets for thieves.
