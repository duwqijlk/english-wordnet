simpleMeaning: people whose political views are not extreme, sitting between the left and the right
scope: This means a group of people with middle-of-the-road politics, not the middle point of a place
  or thing.
examples:
- The new law was written to win over the political center.
- Both parties are courting the center ahead of the election.
