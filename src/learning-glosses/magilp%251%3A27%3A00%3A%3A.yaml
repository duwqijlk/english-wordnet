simpleMeaning: Painters mix this liquid into oil paints; it is linseed oil with sticky tree gum or turpentine.
scope: Also called megilp, this is a liquid mixed into oil paints, not a paint on its own.
examples:
- They mixed magilp into the oil paint.
- The oil paint held magilp.
