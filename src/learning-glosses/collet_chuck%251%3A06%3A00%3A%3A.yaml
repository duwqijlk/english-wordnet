simpleMeaning: A ring shaped like a cone that grips round pieces of work held in a turning machine
scope: A ring that grips round work in a turning machine; collet is another name for this sense, not a
  plain ring or a tool for cutting.
examples:
- The collet chuck gripped the rod while the lathe turned.
- She fitted a collet chuck to hold the thin metal rod.
