simpleMeaning: quick to become happy, nervous or full of strong feeling with little reason
scope: About a person or animal that shows strong feelings with little cause; not about a body part or
  cell that can react to a touch, light, or other change.
examples:
- The excitable dog barked and ran in circles when the doorbell rang.
- Excitable children find it hard to sit still before a trip.
