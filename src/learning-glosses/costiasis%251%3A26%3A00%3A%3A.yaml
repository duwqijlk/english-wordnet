simpleMeaning: A sickness that kills fresh-water fish, caused by a tiny one-celled living thing with a
  tail that gets into the skin.
scope: This is a sickness that kills fresh-water fish, caused by a tiny one-celled living thing with a
  tail that gets into the skin, not a sickness of sea fish and not a sickness caused by a worm.
examples:
- Costiasis killed half the fish in the tank.
- The vet found costiasis in the fresh-water fish.
