simpleMeaning: Add up every number a thing can take when chance decides it, share the total by how many
  numbers there are, and the answer is this number
scope: 'Also called expectation, arithmetic mean, and first moment: a number got from adding up numbers
  and sharing the total, not a guess about what will happen and not the worth of a thing.'
examples:
- The expected value of the game was three points a turn.
- She worked out the expected value before she placed her bet.
