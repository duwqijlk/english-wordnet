simpleMeaning: short underwear that women wear under other clothes, used in the plural
scope: This is women's underwear, used in the plural. It is not long trousers worn as outer clothes.
examples:
- She bought white cotton pants to wear under her dress.
- Her pants were showing below her skirt, and she felt shy.
