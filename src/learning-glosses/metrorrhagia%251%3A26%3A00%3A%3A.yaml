simpleMeaning: Bleeding from the womb that is not a monthly period, usually a sign of sickness such as
  cancer of the neck of the womb.
scope: Bleeding from the womb that is not a monthly period, usually a sign of sickness such as cancer
  of the neck of the womb; not a normal monthly period and not bleeding after giving birth.
examples:
- Metrorrhagia is bleeding from the womb outside the monthly period.
- The doctor said the metrorrhagia was usually a sign of sickness.
