simpleMeaning: a light move up or forward that a person or animal makes with their own body
scope: A light jump up or forward, also called spring, leap, and bound; not hitting something so it bounces.
examples:
- The child took a happy bounce across the grass.
- With a bounce, the dog jumped up to greet her.
