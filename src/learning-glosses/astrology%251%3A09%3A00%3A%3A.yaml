simpleMeaning: a study that is not real science and says it can tell the future by where the planets,
  the sun and the moon are
scope: This is the claim to tell the future from the sun, moon and planets, not the real science that
  studies space and the stars.
examples:
- She reads astrology pages to see what the stars say about her week.
- He does not believe astrology can really tell the future.
