simpleMeaning: the act of making a living thing or a chemical start to work or work more
scope: This is about a living thing or a chemical starting to work; it is not the general act of making
  something ready to use, and not making a bomb ready to go off.
examples:
- Quick activation of the chemical caused a change.
- The drug leads to activation of cells in the body.
