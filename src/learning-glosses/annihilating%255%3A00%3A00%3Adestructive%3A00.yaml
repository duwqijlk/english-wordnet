simpleMeaning: doing, or able to do, damage that destroys a thing completely
scope: This means destroying a thing completely, or being able to do so, also called withering and devastating.
  It is not just causing some harm or some damage.
examples:
- The annihilating fire destroyed the whole town.
- The army launched an annihilating attack that left nothing standing.
