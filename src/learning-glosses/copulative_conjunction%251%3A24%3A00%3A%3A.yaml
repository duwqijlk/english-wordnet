simpleMeaning: a link between parts of a sentence that adds the sense of one part to the sense of the
  next
scope: This is a link that adds meanings together; not a word that joins sentences, and not a verb that
  links a subject to its complement.
examples:
- The copulative conjunction 'and' adds the two ideas together.
- In 'bread and butter', the copulative conjunction joins two nouns.
