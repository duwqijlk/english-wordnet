simpleMeaning: A thick herb that creeps along the ground, keeps its leaves all year, and grows in western
  Europe
scope: Also called asarabacca; one of the creeping herbs of western Europe that keeps its leaves all year,
  unlike herbs that die back in winter.
examples:
- Asarum europaeum grows in western Europe.
- The thick leaves of Asarum europaeum stay green through the winter.
