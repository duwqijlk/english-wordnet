senseId: 'sensitiveness%1:07:02::'
synsetId: 04850224-n
simpleMeaning: The power to notice shifts in feeling among those near one, and answer to them.
scope: Also called sensitivity, this is the power to notice shifts in feeling among those near one and
  answer to them, not the body's power to answer to things from outside, not the power to answer to things
  the body can feel or to mark tiny amounts or differences, and not being open to one's own feelings and
  the feelings of others.
examples:
- Her sensitiveness to the mood of the room helped her calm the guests.
- His sensitiveness let him notice when a friend grew uneasy.
