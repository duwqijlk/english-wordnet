simpleMeaning: Using slopes and tiny steps of change, this branch of maths works out how a quantity changes
  when the number it depends on changes.
scope: Also called the method of fluxions; it works out how a quantity changes when the number it depends
  on changes, and is one part of calculus, not the whole of it.
examples:
- Differential calculus lets her work out how fast the quantity changes.
- He used differential calculus to find how the number changes with time.
