simpleMeaning: The layer of earth that lies under the top layer of soil and above the hard rock below.
scope: The layer of earth under the top soil and above the hard rock, not the top soil itself.
examples:
- The subsoil here is heavy clay.
- Roots reached down into the subsoil for water.
