simpleMeaning: Above all, cassiri, a strong drink, and tapioca are made from this cassava plant, with
  long thick roots good to eat and soft stems that break easily.
scope: 'Also called gari, manioc, bitter cassava, mandioca, and tapioca plant: a cassava plant with long
  thick roots good to eat, used above all to make cassiri and tapioca.'
examples:
- Farmers grew mandioc for its long thick roots.
- Mandioc was used to make tapioca.
