senseId: 'rejuvenate%2:32:02::'
synsetId: 00796045-v
simpleMeaning: to make a stream or river wear away land, as when the ground is lifted up
scope: In land and rivers, making a stream cut into the land after the land rises; not making a person
  look or feel young again.
examples:
- When the land rose, it rejuvenated the river, and the water began to cut deeper into the rock.
- A lifted plateau can rejuvenate a stream so that it wears away its banks again.
