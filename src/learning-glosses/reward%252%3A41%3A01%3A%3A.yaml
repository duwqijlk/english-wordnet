simpleMeaning: to give public praise or a prize to a person for what they did
scope: To give public praise or a prize to a person, also called honor; not the thing given itself and
  not just giving something in return for an act.
examples:
- Today we reward our soldiers for their brave acts.
- The scout was rewarded for courageous action.
