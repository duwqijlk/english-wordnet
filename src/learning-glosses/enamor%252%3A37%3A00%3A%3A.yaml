simpleMeaning: to draw a person to you and make that person feel strong love for you
scope: Another name for this sense is enamour. It means drawing a person to you and making that person
  feel strong love for you, not just liking you or noticing you.
examples:
- The singer enamored the crowd with her voice and kind smile.
- He tried to enamor her with kind words and small gifts.
