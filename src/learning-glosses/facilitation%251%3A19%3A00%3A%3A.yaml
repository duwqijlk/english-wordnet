simpleMeaning: In the study of nerves, the way two or more weak nerve signals join together to set off
  a strong signal in a nerve cell.
scope: In the study of nerves, this is the joining of weak signals to set off a strong one, not a single
  signal acting on its own.
examples:
- Facilitation let the two weak signals set off the nerve cell.
- The book explains facilitation in the nerves of the leg.
