simpleMeaning: a person who loves fine things that please the senses, especially good food and drink
scope: 'Also called epicure, epicurean, and foodie: a person who loves fine food and drink and other things
  that please the senses; not just a person who cooks well or eats a lot.'
examples:
- As a gourmet, she chose the wine and each dish with great care.
- The gourmet enjoyed the fine meal slowly, tasting every part of it.
