senseId: 'mimosa_pudica%1:20:00::'
synsetId: 11775788-n
simpleMeaning: A low or half-upright small shrub of tropical America and Australia, thick with bent-back
  thorns, with soft grey-green leaflets that fold and droop at night or when touched or cooled.
scope: Not other thorny shrubs, nor other plants whose leaves fold when touched; also called action plant,
  humble plant, live-and-die, sensitive plant, shame plant, and touch-me-not.
examples:
- Mimosa pudica folds its leaves when touched.
- The Mimosa pudica leaves drooped after she touched them.
