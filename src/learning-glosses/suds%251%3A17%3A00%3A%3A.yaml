simpleMeaning: the foam made by soap or by a cleaning product for washing
scope: 'Also called lather and soapsuds: the foam from soap, not beer and not the act of making foam.'
examples:
- The sink was full of suds after she washed the dishes.
- He washed his hands and made thick suds with the soap.
