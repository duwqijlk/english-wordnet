simpleMeaning: A person who trades against the law in goods that are scarce or under controls.
scope: A person who trades against the law in goods that are scarce or under controls; not an honest shopkeeper
  and not a person who simply buys goods for use.
examples:
- The black marketeer sold petrol at three times the price.
- Police arrested a black marketeer at the docks.
