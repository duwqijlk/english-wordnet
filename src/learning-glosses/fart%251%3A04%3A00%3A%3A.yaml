simpleMeaning: Gas from the gut that comes out through the back passage on its own, without you meaning
  it to.
scope: 'Also called wind: gas from the gut passing out through the back passage on its own, not the act
  of letting it out on purpose.'
examples:
- He let out a loud fart and laughed.
- A fart escaped as he bent down to tie his shoe.
