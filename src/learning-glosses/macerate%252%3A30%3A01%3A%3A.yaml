synsetId: 00399390-v
simpleMeaning: To make a thing soft, usually by leaving it to soak in liquid, so that it breaks apart.
scope: To make a thing soft, usually by soaking it in liquid, so that it breaks apart; not a softened
  substance used to flavour vodka, and not a thing becoming soft, coming apart, or breaking up by itself
  from too much soaking.
examples:
- The cook macerated the strawberries in sugar before serving them.
- The gizzard macerates food as part of digestion.
