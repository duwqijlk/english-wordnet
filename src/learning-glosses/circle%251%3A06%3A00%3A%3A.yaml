simpleMeaning: Any device or machine part that is shaped like a ring or that turns.
scope: This is a ring-shaped or turning mechanical part — round is another name for this same sense —
  not the geometric curve, not a tier of theater seats, and not the verb meaning to move around something.
examples:
- The machine punched out metal circles.
- The rope ran over a wooden circle at the top of the well.
