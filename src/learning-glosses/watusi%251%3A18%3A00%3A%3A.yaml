simpleMeaning: One who belongs to a Bantu-speaking people living in Rwanda and Burundi.
scope: Also called Watutsi and Tutsi, this is one of the Bantu-speaking people of Rwanda and Burundi,
  not the tongue they speak and not any other people of that land.
examples:
