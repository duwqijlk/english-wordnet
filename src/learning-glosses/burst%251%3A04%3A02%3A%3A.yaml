simpleMeaning: a spell of busy, energetic activity that starts suddenly, often with no clear reason.
scope: This is the sudden spell of activity sense — another name for it is a fit — not the firing of guns,
  and not a sudden intense happening.
examples:
- In a burst of energy, she cleaned the whole kitchen.
- The performance ended in a burst of applause.
