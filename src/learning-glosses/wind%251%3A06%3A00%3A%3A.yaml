simpleMeaning: A musical instrument that makes sound when air inside it is blown by the player or pumped
  with a bellows.
scope: This is the instrument itself, not the breath that powers it, not air moving outdoors, and not
  gas released from the body.
examples:
- The oboe is a wind instrument with a double reed.
- The orchestra's wind section rehearsed separately from the strings.
