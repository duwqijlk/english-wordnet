simpleMeaning: a part of a curve that is shaped like part of a circle
scope: 'Also called turn, twist and crook: this is a curved part of a line or road. It is not the shape
  made by folding and not a line on a shield.'
examples:
- The car slowed at the bend in the road.
- There is a sharp bend in the path near the river.
