simpleMeaning: any of several shorebirds with long legs and a loud cry like a whistle
scope: A long-legged shorebird with a loud cry like a whistle, not a person who tells tales about others
  and not any other shorebird without that cry.
examples:
- The tattler called loudly from the mudflat.
- We watched a tattler wading on its long legs at the shore.
