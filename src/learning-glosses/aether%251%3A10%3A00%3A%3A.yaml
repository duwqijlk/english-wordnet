simpleMeaning: something once thought to fill all space and to carry electromagnetic waves through it,
  waves that travel unseen and bring light and heat
scope: A substance once thought to fill all space and carry waves through it; ether is another name for
  this sense, not the liquid used to put people to sleep in surgery.
examples:
- Old books said aether filled the space between the stars.
- Scientists no longer believe aether exists.
