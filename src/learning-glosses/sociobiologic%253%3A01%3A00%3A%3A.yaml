senseId: 'sociobiologic%3:01:00::'
synsetId: 02676837-a
simpleMeaning: having to do with the study of how living things behave in groups
scope: Having to do with the study of how living things behave in groups, also called sociobiological;
  not having to do with the study of the body alone and not having to do with the study of the mind alone.
examples:
- He wrote a sociobiologic account of ant colonies.
- Her work takes a sociobiologic view of animal groups.
