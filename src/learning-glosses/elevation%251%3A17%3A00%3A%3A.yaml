simpleMeaning: a piece of ground that stands higher than the land around it
scope: A piece of ground that stands higher than the land around it; not the act of making something greater,
  and not the height of a dancer's leap.
examples:
- The house stood on a small elevation above the plain.
- From the elevation, we could see the whole valley.
