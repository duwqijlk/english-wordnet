simpleMeaning: Just behind the jaws of a ten-legged shellfish sit three pairs of small limbs on its middle
  part, used to take in food.
scope: One of three pairs of feeding limbs on a ten-legged shellfish, this is also called a maxilliped.
examples:
- The crab moved food to its mouth with a gnathopod.
- Each gnathopod sits just behind the jaws of the animal.
