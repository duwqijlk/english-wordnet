simpleMeaning: A part inside a gun that throws out the empty shell case after a shot is fired.
scope: A part inside a gun, also called a cartridge ejector, that throws out the empty shell case after
  a shot is fired; not a pump that moves liquid or gas along with a jet of steam or water.
examples:
- The ejector threw the empty case onto the ground.
- A worn ejector can fail to clear the case after firing.
