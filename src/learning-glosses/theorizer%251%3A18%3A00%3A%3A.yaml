simpleMeaning: A person who makes up ideas that try to explain how things work, most of all in science
  or in art
scope: A person who makes up ideas that try to explain how things work, most of all in science or in art;
  theorist, theoretician and theoriser are other names for this sense; not a person who tests ideas by
  doing tests.
examples:
- The theorizer worked on ideas about how minds learn.
- As a theorizer, he cared more for ideas than for tests.
