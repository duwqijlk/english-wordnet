simpleMeaning: a small thing that does sums, and it can work by moving parts or by electric power
scope: Also called a calculator; it is a small thing that does sums, not a big computer and not a bead
  frame used for sums.
examples:
- She used her calculating machine to add up the bills.
- The old calculating machine clicked as he worked out the sums.
