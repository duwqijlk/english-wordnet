simpleMeaning: to measure how heavy something is, using a weighing device or a method that works like
  one.
scope: This is not about adjusting something to a rate or standard, and not about attacking a wall; it
  means finding out how heavy something is.
examples:
- The loaded truck scaled just under the legal weight limit.
- At the mill, each sack of grain is scaled before storage.
