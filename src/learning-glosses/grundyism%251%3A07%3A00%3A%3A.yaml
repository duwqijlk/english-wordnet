simpleMeaning: Modesty that goes too far, or modesty put on for show.
scope: Also called primness, prudishness, and prudery; modesty that is too much or put on, not plain shyness.
examples:
- His Grundyism made him blush at the smallest joke.
- Her Grundyism was only for show; in private she was quite bold.
