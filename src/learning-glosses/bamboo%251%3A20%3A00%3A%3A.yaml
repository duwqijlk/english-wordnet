simpleMeaning: a grass that grows in hot places, with hard hollow stems like wood; its grown stems are
  used to build things and make furniture
scope: This is the living plant itself, not the hard stems cut from it and used as material for building
  and making things.
examples:
- Bamboo grows very fast in warm, wet places.
- Tall bamboo stood beside the river, its stems hollow inside.
