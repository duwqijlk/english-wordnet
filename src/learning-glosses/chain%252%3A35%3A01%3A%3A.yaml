simpleMeaning: To join several things end to end so they form one connected line.
scope: This is joining separate items in a row, not tying something down with metal links or a group of
  shops under one owner.
examples:
- The program chains the steps together so each one starts automatically.
- The editor chained the short clips into one continuous film.
