simpleMeaning: Changes in the eyes that happen on their own and let a thing be seen clearly on the back
  of the eye.
scope: These are changes in the eyes that let a thing be seen clearly on the back of the eye, not blinking
  and not the pupil growing small in bright light.
examples:
- The accommodation reflex lets the eye focus on near things.
- Her accommodation reflex worked well when she looked from far to near.
