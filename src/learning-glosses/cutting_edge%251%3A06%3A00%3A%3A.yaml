simpleMeaning: the sharp side of a knife blade that does the slicing
scope: The sharp side of a knife blade, also called knife edge, not the flat side of the blade and not
  the newest part of a field of work.
examples:
- He ran his thumb along the cutting edge to test how sharp it was.
- The cutting edge of the knife slid through the tomato with ease.
