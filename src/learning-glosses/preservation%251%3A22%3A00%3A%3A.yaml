simpleMeaning: a way of keeping things that come from living things from rotting away
scope: The work of keeping food or other matter from going bad, not a gain from keeping a thing safe and
  not the state of being well kept.
examples:
- Food preservation lets fruit last through the winter.
- The museum uses preservation to stop the old leather from rotting.
