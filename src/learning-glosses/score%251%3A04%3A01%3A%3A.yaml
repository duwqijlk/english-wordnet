simpleMeaning: The act of persuading someone into bed, which ends in sex.
scope: This is slang for a sexual conquest, not the tally of points in a game and not a written music
  chart.
examples:
- He boasted about his score at the bar, and nobody believed him.
- The novel's hero treats every date as a score to be won.
