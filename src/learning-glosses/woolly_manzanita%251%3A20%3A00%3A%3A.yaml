simpleMeaning: With branches that spread wide apart, this upright shrub of California bears young stems
  covered in soft hairs.
scope: This is an upright shrub of California, also called downy manzanita, whose branches spread wide
  apart and whose young stems are covered in soft hairs.
examples:
- The woolly manzanita had soft hairs on its young stems.
- The woolly manzanita stands with its branches spread wide.
