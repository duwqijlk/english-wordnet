simpleMeaning: a dance in a hall, with four beats in each bar, where partners move in set patterns, mixing
  short steps with long ones and quick steps with slow ones
scope: 'Also called foxtrot: a dance done with a partner in a hall, not a dance done alone and not a fast
  dance with no set steps.'
examples:
- They danced the fox-trot at the wedding.
- She learned the fox-trot in her dance class.
