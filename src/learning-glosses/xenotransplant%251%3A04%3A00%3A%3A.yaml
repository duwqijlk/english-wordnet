simpleMeaning: an operation in which living flesh or whole organs are moved from one kind of animal to
  another kind
scope: This is an operation that moves living flesh or whole organs from one kind of animal to another,
  also called xenotransplantation; not a short-term piece of flesh put on a burn, and not a move of flesh
  from one person to another.
examples:
- The xenotransplant moved a pig heart into a patient.
- Doctors are testing a xenotransplant that uses an animal kidney.
