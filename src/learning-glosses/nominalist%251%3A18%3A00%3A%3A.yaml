simpleMeaning: A thinker who has taken up nominalism, the idea that things called by the same word share
  nothing but that word
scope: A thinker who has taken up nominalism, not the doctrine itself and not a realist who holds the
  opposite view.
examples:
- The nominalist argued that 'red' names no real thing shared by red things.
- As a young nominalist, he rejected the idea that words point to real shared kinds.
