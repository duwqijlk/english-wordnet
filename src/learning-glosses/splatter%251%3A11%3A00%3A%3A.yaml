simpleMeaning: the sound of something bursting out in drops with a sharp, sudden noise
scope: The noise of drops bursting out with a sharp sound, also called a sputter, a spatter, or a splutter;
  not a small bit of liquid and not the act of letting liquid run out.
examples:
- The splatter of the paint gun filled the room.
- We heard the splatter of fat in the pan.
