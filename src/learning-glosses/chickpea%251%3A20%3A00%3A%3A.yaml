simpleMeaning: a plant from Asia grown for its short pods (the cases that hold seeds), each pod with one
  or two seeds that people can eat
scope: 'Also called chickpea plant: this is the living plant grown for its pods, not the large white seed
  itself and not the dried seed used as food.'
examples:
- The chickpea is grown in dry fields for its seeds.
- Farmers plant chickpeas and pick the short pods when they are ready.
