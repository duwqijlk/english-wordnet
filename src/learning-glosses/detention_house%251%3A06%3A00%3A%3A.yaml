senseId: 'detention_house%1:06:00::'
synsetId: 03186333-n
simpleMeaning: A place where young lawbreakers can be held for a short time, most often under the watch
  of a court for young people
scope: A place where young lawbreakers are held for a short time under a court for young people; also
  called detention camp, detention home and house of detention, not a prison for adults and not a school.
examples:
- The detention house held him until the court met.
- She stayed in a detention house for a week before her hearing.
