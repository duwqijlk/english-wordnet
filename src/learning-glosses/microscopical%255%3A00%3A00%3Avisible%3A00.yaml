simpleMeaning: Seen by a microscope, or done with one.
scope: Seen by a microscope, or done with one; also called microscopic; not of or to do with the study
  of tiny things, nor too small to see without a microscope.
examples:
- Their cell was microscopical in size.
- The work was microscopical and slow.
