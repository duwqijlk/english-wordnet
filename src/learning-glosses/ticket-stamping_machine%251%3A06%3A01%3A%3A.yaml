simpleMeaning: a device that works on its own and marks a travel card so it can be used, adding where
  it was used and the time
scope: This is a device that marks a ticket to make it good for travel, adding where and when it was used;
  ticket stamping machine is another name for this sense. Not a machine that sells tickets and not a hand
  stamp.
examples:
- She put her ticket into the ticket-stamping machine at the station.
- The ticket-stamping machine printed the station name and the time on his ticket.
