simpleMeaning: A herb of California with blooms of a purple that leans to rose.
scope: This is a herb of California with blooms of a purple that leans to rose; adobe lily is another
  name for this sense, not a herb of other states and not a herb with blooms of one plain colour.
examples:
- The pink fritillary bloomed in the spring.
- Pink fritillaries grow in the hills of California.
