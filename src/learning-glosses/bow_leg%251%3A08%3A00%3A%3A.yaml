simpleMeaning: a lower limb that curves out at the knee, or below the knee
scope: 'Also called bandy leg, bandyleg, bowleg and genu varum: a lower limb that curves out at the knee
  or below it, not a straight limb and not a limb that curves in at the knee.'
examples:
- His bow legs made his walk look wide and round.
- The doctor said the child's bow leg would straighten as he grew.
