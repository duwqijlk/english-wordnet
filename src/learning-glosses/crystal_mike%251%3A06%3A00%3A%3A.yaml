senseId: 'crystal_mike%1:06:00::'
synsetId: 03148223-n
simpleMeaning: A sound catcher whose bit of mineral shakes with sound waves and puts out power that rises
  and falls.
scope: Also called a crystal microphone, this sound catcher makes power from a shaking bit of mineral,
  not one with no mineral at all.
examples:
- The crystal mike picked up sound through its shaking bit of mineral.
- He spoke into the crystal mike and the power rose and fell with his words.
