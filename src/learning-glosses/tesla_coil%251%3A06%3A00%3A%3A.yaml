simpleMeaning: A device that makes an electric current stronger, with air at its middle, made to give
  off very high voltages many times a second.
scope: A device that makes an electric current stronger, with air at its middle, not a device with an
  iron middle and not a device that makes a current weaker.
examples:
- The Tesla coil made a very high voltage.
- He switched on the Tesla coil in the laboratory.
