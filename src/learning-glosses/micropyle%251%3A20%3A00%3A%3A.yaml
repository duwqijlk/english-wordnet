senseId: 'micropyle%1:20:00::'
synsetId: 11699829-n
simpleMeaning: Through a tiny hole in the wall of the part that will become a seed, the tube carrying
  pollen gets in
scope: A tiny hole in a plant's seed part, not a hole in a leaf or stem, and not the pollen tube itself.
examples:
- The pollen tube passed through the micropyle into the ovule.
- A micropyle is the only opening in the ovule wall.
