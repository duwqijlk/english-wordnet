simpleMeaning: one full time that something that happens again and again is done or takes place, from
  its start to its end
scope: This is one full time through a thing that happens again and again. It is not the length of time
  in which a set of events happens, and not the set of events itself.
examples:
- A year is one cycle of the seasons, from spring back to spring.
- Each cycle of the washing machine ends with a short spin.
