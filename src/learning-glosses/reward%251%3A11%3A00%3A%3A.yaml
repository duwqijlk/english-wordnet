simpleMeaning: something good given for good acts, or something bad given for bad acts, as what a person
  has earned
scope: What a person gets for what they have done, good or bad, not the act of giving such a thing and
  not making good acts stronger by giving them.
examples:
- Virtue is its own reward, the old saying goes.
- He took the reward as fair pay for years of good work.
