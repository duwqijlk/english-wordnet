simpleMeaning: any chemical that has four atoms of a halogen, one of a group of elements that form salts,
  in each molecule
scope: A chemical with four halogen atoms in each molecule, not one with three such atoms and not one
  with five.
examples:
- The chemist studied a tetrahalide made from chlorine.
- This tetrahalide has four halogen atoms in each molecule.
