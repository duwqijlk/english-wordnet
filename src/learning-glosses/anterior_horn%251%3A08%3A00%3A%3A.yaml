simpleMeaning: One of the two roots of a spinal nerve, passing from the front of the spinal cord and made
  up of motor nerve fibers.
scope: This sense is also called anterior root, ventral horn, and ventral root.
examples:
- An anterior horn ran from the cord.
- Anterior horns carry motor fibers to the muscles.
