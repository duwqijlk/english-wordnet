senseId: 'requisition%1:10:00::'
synsetId: 07206900-n
simpleMeaning: An official order asking for something. Most often, an army or public office takes a thing
  over for its own use, usually for a short time.
scope: An official order or demand, most often when an army or public office takes a thing for its own
  use for a time; not taking a person's land or goods and holding them until money owed is paid, as in
  another sense of this word.
examples:
- The army made a requisition for trucks from local firms.
- The city sent a requisition to take the hall for use as a shelter.
