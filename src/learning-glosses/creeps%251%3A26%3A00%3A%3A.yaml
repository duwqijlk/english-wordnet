simpleMeaning: A sickness of cows and sheep, brought on by too little of some food part, that leaves the
  blood weak, the bones soft, and the walk slow and stiff
scope: A sickness of cows and sheep from too little of some food part, not a feeling of fear.
examples:
- The creeps struck the flock after a dry summer.
- Cattle with the creeps walk with a slow, stiff gait.
