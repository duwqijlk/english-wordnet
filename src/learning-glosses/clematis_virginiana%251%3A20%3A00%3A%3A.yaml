simpleMeaning: A common climbing plant of east North America that spreads over other plants and bears
  many loose bunches of small creamy white flowers.
scope: Also called devil's darning needle, old man's beard and virgin's bower, this is a common climber
  of east North America, not the scarlet-flowered vine of Texas.
examples:
- The Clematis virginiana sprawls over the fence.
- Clematis virginiana bears small white flowers in summer.
