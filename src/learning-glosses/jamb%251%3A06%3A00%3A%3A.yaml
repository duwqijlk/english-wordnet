simpleMeaning: the side part that stands up straight in the frame of a door or window
scope: This sense is the side part of a door or window frame, not the top part of the frame and not jam
  as in food or a block in traffic.
examples:
- He leaned against the door jamb while he talked.
- The cat rubbed its head on the window jamb.
