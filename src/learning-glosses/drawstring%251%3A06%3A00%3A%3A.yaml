senseId: 'drawstring%1:06:00::'
synsetId: 03240263-n
simpleMeaning: a cord used as a tie, going through a seam (a folded edge that makes a small tunnel) around
  an opening, pulled to close it
scope: 'Also called a string: this is the cord itself that you pull to close a bag or clothes at an opening,
  not a long thin line for tying parcels.'
examples:
- He pulled the drawstring tight and closed the bag.
- These trousers have a drawstring at the waist.
