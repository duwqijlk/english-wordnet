simpleMeaning: a worker who puts down and mends the rails that trains run on
scope: A worker who puts down and mends train rails; platelayer is another name for this sense, and it
  is not a train driver and not a worker who builds roads.
examples:
- The tracklayer replaced a broken rail before the morning train arrived.
- A team of tracklayers worked through the night to mend the line.
