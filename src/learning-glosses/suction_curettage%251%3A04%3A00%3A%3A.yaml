simpleMeaning: a way of ending a pregnancy on purpose, where the embryo and afterbirth are drawn out with
  a vacuum through the opened neck of the womb before the 14th week
scope: Also called vacuum aspiration; a way of ending a pregnancy by suction, not a birth and not surgery
  with a knife.
examples:
- The doctor performed a suction curettage before the fourteenth week.
- Suction curettage uses gentle suction to empty the womb.
