simpleMeaning: a piece of cloth used in the bath to clean the face and body
scope: This is a cloth for cleaning the face and body in the bath, also called flannel, washrag, and face
  cloth; it is not a large towel for drying the body.
examples:
- She wet the washcloth and washed her face.
- He used a washcloth to clean his arms in the bath.
