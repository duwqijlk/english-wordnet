simpleMeaning: a large, rich show of scenes from history and other past events, usually with a parade
  where people dress in rich clothes from the past
scope: 'Also called pageantry: a rich public show of scenes from the past, usually with a parade, not
  a contest where people are judged for how they look.'
examples:
- The town held a pageant with scenes from its long history.
- In the pageant, children in fine old clothes walked in a parade past the king.
