simpleMeaning: A harmless slow-growing lump of gristle-like cells at the ends of tube-shaped bones, above
  all in the hands and feet.
scope: A harmless slow-growing lump at the ends of tube-shaped bones, not a fast-growing lump and not
  a break.
examples:
- An enchondroma grew slowly at the end of her finger bone.
- The enchondroma in his foot caused little pain.
