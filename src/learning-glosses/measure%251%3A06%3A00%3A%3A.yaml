simpleMeaning: a tool with marks placed at equal spaces along it, used as a guide when you work out the
  size or amount of something
scope: This is a tool with marks for working out size or amount, not a set of beats in music and not a
  pot that holds a set amount.
examples:
- He laid a measure along the wood to mark where to cut it.
- Use the measure on the wall to see how tall the child is.
