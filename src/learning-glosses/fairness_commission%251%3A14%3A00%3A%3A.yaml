simpleMeaning: A group of people asked to make sure that people with different views get a chance to speak
scope: A group set up to give different views a chance to be heard, not a court of law and not a body
  that makes laws.
examples:
- The fairness commission made sure both sides could speak at the meeting.
- A fairness commission was set up to hear views from all sides.
