senseId: 'sufficiency%1:26:00::'
synsetId: 14516537-n
simpleMeaning: enough money and other needed things for a person to live in comfort and to pay or do all
  they must
scope: Enough money and things to live in comfort and meet what a person must pay or do, not just an amount
  that is enough for a purpose and not the quality of being enough.
examples:
- With his small farm, he had a modest sufficiency and could feed his family well.
- They doubted his sufficiency to support a wife in comfort.
