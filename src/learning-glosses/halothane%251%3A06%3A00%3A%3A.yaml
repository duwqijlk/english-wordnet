simpleMeaning: a gas that cannot catch fire, breathed in to put a person fully to sleep, used with pain
  killers and drugs that relax the muscles for many kinds of surgery
scope: A gas breathed in to put a person fully to sleep for surgery, not a sleeping pill and not a local
  numbing drug.
examples:
- The doctor gave halothane to put the patient fully to sleep.
- Halothane is breathed in through a mask before surgery.
