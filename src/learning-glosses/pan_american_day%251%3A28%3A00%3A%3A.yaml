simpleMeaning: A date when the countries of the Americas mark how they stand together in rule and in trade.
scope: Also called April 14; a date that marks how the countries of the Americas stand together in rule
  and in trade, not a holiday for one country alone and not a trade deal.
examples:
- Pan American Day is marked each year with speeches about working together.
- Schools in many countries hold events for Pan American Day.
