simpleMeaning: Lying over and guarding the working wings behind them, these hard front wings are one of
  a pair on a beetle or some other insects
scope: This hard front wing of a beetle, also called a wing case, is the outer cover for the working wings
  behind it, not the working wings themselves.
examples:
- The beetle lifted its elytron and spread the thin wing beneath it.
- Under the elytron, the beetle's working wing lay folded flat.
