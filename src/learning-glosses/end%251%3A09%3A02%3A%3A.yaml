schema: oewn-learning-gloss-v2
senseId: 'end%1:09:02::'
synsetId: 05989760-n
simpleMeaning: The situation that a plan is meant to bring about, after which the work to bring it about
  stops.
scope: This is not the last part or tip of something and not a limit or boundary; it is the aim a plan
  is meant to reach.
examples:
- The end they sought was a fairer society.
- To what end are you saving all this money?
