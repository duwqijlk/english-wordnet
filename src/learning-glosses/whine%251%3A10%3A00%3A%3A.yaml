simpleMeaning: A sad complaint spoken in a high, drawn-out, unhappy voice
scope: A complaint said in a sad, high, unhappy voice, not a screeching noise and not the act of making
  such a noise.
examples:
- Her constant whine about the food wore us down.
- His whine over the lost game went on all evening.
