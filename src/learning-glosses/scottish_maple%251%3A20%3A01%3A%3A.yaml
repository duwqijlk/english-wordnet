simpleMeaning: A tree from Europe and Asia with pale grey bark that peels off in flakes like a sycamore's,
  and leaves with five egg-shaped parts that turn yellow in autumn
scope: Also called the sycamore, the great maple, and Acer pseudoplatanus; a Eurasian tree with pale grey
  bark that peels in flakes, its leaves turning yellow in autumn.
examples:
- The Scottish maple in the park had bark peeling off in pale flakes.
- In autumn the Scottish maple leaves turned a clear yellow.
