senseId: 'obsolesce%2:30:00::'
synsetId: 00568852-v
simpleMeaning: To become out of date and go out of use.
scope: To go out of use; not to break down, and not to be banned by law.
examples:
- This word has not obsolesced, although it is rarely used.
- The old tool obsolesced once the new machine arrived.
