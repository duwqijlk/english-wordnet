simpleMeaning: a dark, heavy, thick, sticky stuff, one of different kinds, that is left behind after other
  stuff is taken away
scope: This is the dark, sticky stuff itself, not how high or low a sound is and not a throw in baseball.
examples:
- Workers spread hot pitch on the roof.
- The road was sealed with pitch.
