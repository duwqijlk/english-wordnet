scope: A way of eating with only a little salt, also called low-salt diet and salt-free diet, not a fast
  and not a diet meant only for losing weight.
examples:
- A low-sodium diet keeps salt to a small amount.
- He follows a low-sodium diet because of his high blood pressure.
