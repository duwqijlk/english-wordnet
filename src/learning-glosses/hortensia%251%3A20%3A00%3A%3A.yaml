simpleMeaning: Its round heads of flowers open green and age to pink or blue on a bush that sheds its
  leaves in winter.
scope: It is a bush with round heads of flowers, not the very tall herb with much-doubled yellow flower
  heads that shares its name.
examples:
- The hortensia opened green and turned pink with age.
- She grew a hortensia for its round flower heads.
