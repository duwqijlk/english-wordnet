simpleMeaning: A drug or medicine made or handed out in a pharmacy and used to treat illness.
scope: This is a drug or medicine made or handed out in a pharmacy for treating illness, also called pharmaceutical;
  it is not a drug sold without such a place, and not the adjective sense about pharmacy work.
examples:
- The pharmaceutic helped to lower his fever.
- She picked up the pharmaceutic from the pharmacy.
