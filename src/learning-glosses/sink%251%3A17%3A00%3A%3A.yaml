senseId: 'sink%1:17:00::'
synsetId: 09458643-n
simpleMeaning: a hollow in the ground that connects with an underground channel, especially in limestone,
  made when rock dissolves or a cave roof falls in
scope: A natural hollow in the ground, also called a sinkhole or swallow hole, not the water basin fixture
  or the covered waste cistern.
examples:
- The farmer fenced off the sink so his cattle would not fall in.
- Water had worn the limestone into a wide sink.
