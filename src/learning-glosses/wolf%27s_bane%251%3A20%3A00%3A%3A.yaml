simpleMeaning: Broad round leaves and yellow flowers mark this poisonous herb of Europe and Asia, which
  lives year after year on a mass of thin roots below ground.
scope: Also called wolfsbane and wolfbane, this is a poisonous herb of Europe and Asia with broad round
  leaves and yellow flowers.
examples:
- Wolf's bane has yellow flowers and broad round leaves.
- Wolf's bane grows year after year on its thin roots.
