simpleMeaning: An illness passed down in families in which too much glycogen, a stored sugar, builds up
  in the muscles that move the body, leaving them weak and cramped.
scope: An illness passed down in families in which too much stored sugar builds up in the moving muscles,
  leaving them weak and cramped, not other inherited illnesses of the muscles.
examples:
- McArdle's disease left his legs weak and cramped after hard work.
- She has McArdle's disease, so her muscles tire fast.
