simpleMeaning: By mixing, every other color can be made from one of three colors
scope: One of the three colors from which all other colors come; primary color for pigments is another
  name for this sense, not a color made by mixing others.
examples:
- Blue is a primary colour for pigments, along with red and yellow.
- She used a primary colour for pigments to mix the green she needed.
