simpleMeaning: Grown to look at, this South American tree has golden yellow flowers and leaflets in pairs
  along a stem with one at the tip, keeping some leaves all year.
scope: Also called a tipu tree and a yellow jacaranda, this South American tree is grown to look at for
  its golden yellow flowers.
examples:
- A tipu shaded the garden with its golden flowers.
- Tipus lined the street in the old town.
