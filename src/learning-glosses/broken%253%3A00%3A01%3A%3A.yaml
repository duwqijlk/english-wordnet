simpleMeaning: Forcibly parted into pieces, or cracked or split, as a solid object is.
scope: This is not the sense of something interrupted or uneven in time or space; it is about a solid
  object in pieces or split.
examples:
- The broken glass lay across the kitchen floor.
- The handle is broken, so the door will not close.
