simpleMeaning: to make or become twice as great in size, reach, or strength
scope: This sense is about making something twice as big, wide, or strong, not about doing something again
  for a second time.
examples:
- They redoubled their efforts to finish the work on time.
- The noise redoubled as more people joined the crowd.
