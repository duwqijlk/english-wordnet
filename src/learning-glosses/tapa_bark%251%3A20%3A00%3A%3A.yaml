simpleMeaning: The thin stringy outer skin of the paper mulberry and Pipturus albidus
scope: The thin stringy outer skin of the paper mulberry and Pipturus albidus, also called tapa, tappa,
  and tappa bark; not the cloth made from it and not the inner wood of the tree.
examples:
- Tapa bark from the paper mulberry was softened for cloth.
- They stripped tapa bark to pound into fabric.
