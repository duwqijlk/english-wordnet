simpleMeaning: Any of a number of Christian groups that say they have kept a direct line back to the first
  Christian group.
scope: Any of the Christian groups that say they have kept a direct line back to the first Christian group;
  other churches make no such claim.
examples:
- The Catholic Church in our town dates back to the 1800s.
- She belongs to the Catholic Church.
