simpleMeaning: in a way that makes people think a thing is very good, big, or strong
scope: This tells how a thing is done, in a way that people think is very good; it is not about size alone
  and not about pressing a mark into something.
examples:
- The young singer sang impressively at the concert last night.
- He did impressively well in his final tests at school.
