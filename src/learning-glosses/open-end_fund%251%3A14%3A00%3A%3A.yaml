scope: A firm that puts money in under set rules, with a pool of things of worth that keeps selling its
  shares and buying them back; open-end investment company, mutual fund and mutual fund company are other
  names for this sense, not a bank and not a firm that puts money in without rules.
examples:
- She put her savings in an open-end fund.
- An open-end fund keeps selling its shares and buying them back.
