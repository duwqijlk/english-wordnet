simpleMeaning: A village or settlement in Israel where small farms work together and share help.
scope: A village or settlement in Israel made up of small farms that work together, not a city and not
  a single large farm.
examples:
- They live on a moshav in the north of Israel.
- The moshav grows fruit on its small farms.
