simpleMeaning: a sharp hand tool, shaped like a spade, for digging roots and weeds out of the ground
scope: 'Also called a spud: a sharp hand tool for digging out roots and weeds, not a big shovel and not
  a trowel for planting.'
examples:
- He used a stump spud to dig the weed roots out of the garden.
- The stump spud cut through the thick roots with its sharp edge.
