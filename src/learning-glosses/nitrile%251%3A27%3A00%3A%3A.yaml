simpleMeaning: any one of a group of carbon-based chemicals that hold a cyano group, a group of one carbon
  atom joined to one nitrogen atom, shown as -CN
scope: One of a group of carbon-based chemicals holding a cyano group; cyanide is another name for this,
  not a salt and not a simple acid.
examples:
- The chemist found a nitrile in the sample.
- The lab kept the nitrile in a sealed bottle for later tests.
