senseId: 'spectacle%1:04:00::'
synsetId: 00076291-n
simpleMeaning: Something you do wrong by mistake that makes other people see you as silly; said when you
  have made a fool of yourself in front of others
scope: This is a careless mistake that makes you look silly to other people. Not a big, grand show, and
  not just a strange person or thing that people see.
examples:
- He made a spectacle of himself by shouting and falling over in the street.
- She made a spectacle of herself when she threw her drink and slipped in front of everyone.
