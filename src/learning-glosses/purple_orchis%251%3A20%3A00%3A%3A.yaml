simpleMeaning: a North American plant with violet-purple flowers mixed with white in a spike, the outer
  flower parts forming a hood
scope: 'Also called purple-hooded orchis and showy orchis: a North American orchid whose violet-purple
  flowers grow in a spike with a hood over them, not a potted orchid and not a single-flowered wild plant.'
examples:
- The purple orchis bloomed in the spring woods, violet and white.
- Each purple orchis flower wore a small hood of joined petals.
