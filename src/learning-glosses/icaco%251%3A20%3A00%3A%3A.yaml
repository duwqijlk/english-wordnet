simpleMeaning: a small tree from warm parts of America that bears fruit like plums, good to eat
scope: A small tree from warm America with plum-like fruit that can be eaten; coco plum, coco plum tree
  and cocoa plum are other names for this sense, not the fruit itself and not a plum tree.
examples:
- The icaco grew beside the path, heavy with fruit.
- They picked ripe fruit from the icaco in the garden.
