simpleMeaning: trying to get into other people's business in a way that upsets or annoys them
scope: 'Also called busy, interfering, officious and meddlesome: this describes a person who gets into
  other people''s business in an annoying way, not the act of secretly changing something in a wrong way.'
examples:
- Her meddling neighbour kept asking about their money and telling them what to do.
- He told his meddling brother to stop reading his letters.
