senseId: 'deviated_nasal_septum%1:26:00::'
synsetId: 14116578-n
simpleMeaning: A common condition in which the wall between the nostrils is shifted out of place, blocking
  airflow and causing trouble breathing and repeated nosebleeds.
scope: A structural problem in the nose's inner wall, not a cold, allergy or sinus infection.
examples:
- The doctor said my blocked nose was caused by a deviated nasal septum.
- Surgery can correct a deviated nasal septum that makes breathing hard.
