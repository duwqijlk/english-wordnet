simpleMeaning: A group of people in a court who cannot all agree on a decision, so the trial has to end
  with no decision
scope: A court group that cannot agree on a verdict, so the case ends in a mistrial; not a jury that has
  reached a verdict and not a trial judge's decision.
examples:
- The hung jury could not agree, and the judge declared a mistrial.
- After three days, the hung jury was still split on the verdict.
