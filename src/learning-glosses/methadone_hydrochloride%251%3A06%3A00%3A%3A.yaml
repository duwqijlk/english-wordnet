simpleMeaning: a lab-made painkiller much like morphine, but less apt to hook its users; given to heroin
  users to wean them off the drug and keep them clean
scope: A man-made drug like morphine used to help people stop taking heroin, also called fixer, methadone,
  dolophine hydrochloride, methadon, and synthetic heroin; not morphine itself and not heroin.
examples:
- The clinic gives methadone hydrochloride to people trying to stop taking heroin.
- Methadone hydrochloride dulls pain like morphine but is less likely to cause dependence.
