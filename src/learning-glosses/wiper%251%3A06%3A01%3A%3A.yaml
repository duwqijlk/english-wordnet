simpleMeaning: a part in a switch that carries power on a moving arm, turning across fixed points until
  it stops on the one that lets power out
scope: A moving arm in a switch that carries power across fixed points, not the thing that wipes rain
  off a windscreen.
examples:
- The wiper moved across the contacts until it stopped on the outlet.
- When the wiper rests on a contact, the circuit is complete.
