simpleMeaning: a person paid to go with someone and stay by their side
scope: A paid helper who goes with a person, not a guard for an important person and not the act of going
  with someone.
examples:
- The old lady hired an escort to go with her to the shops.
- He worked as an escort for visitors to the big house.
