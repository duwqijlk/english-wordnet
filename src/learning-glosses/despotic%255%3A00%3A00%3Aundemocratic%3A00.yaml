simpleMeaning: like a ruler who has total power, or like that kind of rule; having total power over a
  country
scope: Also called authoritarian, autocratic, tyrannical, dictatorial and tyrannic. It is about a ruler
  or rule with total power, not a fair or shared way of ruling.
examples:
- The people suffered under a despotic government.
- A despotic ruler makes all the laws alone and lets no one question him.
