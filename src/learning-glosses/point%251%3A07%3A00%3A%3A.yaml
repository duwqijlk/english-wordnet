senseId: 'point%1:07:00::'
synsetId: 05078725-n
simpleMeaning: the quality of a shape that narrows to a sharp tip.
scope: 'This names the quality of tapering, not the tip itself: the sharp end of a knife is its point
  in the ordinary sense, while this sense is about how the shape narrows. It is a technical, bookish use,
  found mainly in older descriptions of geometry and craft. It is also not the V-shaped mark at the end
  of a drawn arrow.'
examples:
- 'A needle differs from a nail in its point: the metal narrows to a fine tip.'
- 'The difference between the two blades is the point: one narrows to a needle-sharp tip, the other ends
  flat.'
