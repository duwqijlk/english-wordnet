simpleMeaning: To press a folded line into a smooth flat thing, or to push it into small folds or lines;
  crisp, the old word for this, is no longer used.
scope: Also called wrinkle, crisp, crease, crinkle, scrunch, and ruckle, this is the word for pressing
  a folded line into a smooth flat thing.
examples:
- She scrunched up the dress.
- Scrunch up the paper like this.
