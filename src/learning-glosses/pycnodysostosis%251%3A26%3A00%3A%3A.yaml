simpleMeaning: A condition in which a person stays very short and has bones that break easily and teeth
  that are in bad shape
scope: This is a condition that keeps a person very short, with bones that break easily and bad teeth;
  not ordinary short height and not weak bones on their own.
examples:
- The child with pycnodysostosis broke her arm in a small fall.
- Pycnodysostosis left him very short, with fragile bones and bad teeth.
