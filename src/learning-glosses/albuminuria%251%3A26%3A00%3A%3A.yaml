simpleMeaning: too much protein in the urine, mostly albumin with some globulin; usually a sign of kidney
  trouble
scope: Also called proteinuria; too much protein in the urine, not a kidney disease itself but usually
  a sign of one.
examples:
- The test showed albuminuria, so the doctor checked her kidneys.
- Albuminuria can be an early sign that the kidneys are not working well.
