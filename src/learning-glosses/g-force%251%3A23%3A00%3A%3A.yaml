simpleMeaning: A unit that measures a push by how much it matches the pull of the earth, used to show
  how hard a body is pushed when its speed changes
scope: This is a unit that measures a push by how much it matches the pull of the earth; gee is another
  name for this sense, not a weight in kilos and not speed itself.
examples:
- The pilot felt strong g-force as the plane sped up.
- A g-force of two means twice the pull of the earth.
