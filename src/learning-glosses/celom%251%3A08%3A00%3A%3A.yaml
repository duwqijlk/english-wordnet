simpleMeaning: A hollow in the middle skin of an unborn babe that in folk gives rise to the chest, heart,
  and belly hollows.
scope: This sense is also called celoma and coelom, a hollow in the middle skin of an unborn babe that
  in folk gives rise to the chest, heart, and belly hollows.
examples:
- Celoms give rise to chest hollows.
- The celom forms in the unborn babe.
