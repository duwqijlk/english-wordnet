simpleMeaning: blood vessels near the skin running up the thumb side of the lower arm, joining the vessels
  on the little-finger side to form the vessel of the upper arm
scope: This is the blood vessel on the thumb side of the lower arm, also called vena radialis; not the
  vessel on the little-finger side.
examples:
- The radial vein runs just under the skin of the forearm.
- Blood in the radial vein flows up toward the elbow.
