simpleMeaning: religious leaders taken together as a group, especially Presbyterian ones
scope: Religious leaders as one group, especially Presbyterian ones. It is not a government department,
  not the building where such a department works, and not the work of one religious leader.
examples:
- The Presbyterian ministry met together to talk about church matters.
- All the local ministry came to the meeting of religious leaders.
