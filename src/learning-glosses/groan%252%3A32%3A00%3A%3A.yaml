simpleMeaning: to make a low sound to show pain, to show your body does not feel right, or to show you
  do not like something
scope: 'Also called a moan: to make a low sound to show pain, to show your body does not feel right, or
  to show you do not like something; not the sound itself as a thing.'
examples:
- He groaned as he lifted the heavy box with a sore back.
- The class groaned when the teacher gave them more work.
