simpleMeaning: A mild form of a bad pox that kills, caused by a weaker form of the germs
scope: A mild form of a bad pox that kills, caused by a weaker form of the germs; alastrim, milk pox and
  pseudovariola are other names for this sense, not the deadly form of the pox itself.
examples:
- The child caught pseudosmallpox, a mild pox that left only faint marks.
- Doctors once called the mild illness pseudosmallpox to set it apart from the deadly pox.
