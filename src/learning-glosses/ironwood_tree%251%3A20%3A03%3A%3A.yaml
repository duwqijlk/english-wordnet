simpleMeaning: This handsome East Indian tree is evergreen and often planted as an ornamental for its
  fragrant white flowers, which give a perfume; its very heavy hardwood goes into railway ties.
scope: Another name for the East Indian ornamental tree called ironwood in this lane, not its timber and
  not a different tree that also goes by this name.
examples:
- An ironwood tree stood at the end of the garden, covered in scented white flowers.
- The ironwood tree's timber is heavy enough for railway ties.
