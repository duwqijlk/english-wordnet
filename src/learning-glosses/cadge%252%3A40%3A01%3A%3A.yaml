simpleMeaning: To get a thing from someone by asking in a smooth, coaxing way, without paying for it.
scope: Also called scrounge; getting a thing by smooth, coaxing asking, not by stealing it outright.
examples:
- He is always cadging cigarettes from his friends.
- She cadged a lift home from a stranger.
