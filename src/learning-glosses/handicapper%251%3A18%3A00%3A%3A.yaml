senseId: 'handicapper%1:18:00::'
synsetId: 10390382-n
simpleMeaning: Someone who works out the betting odds from the likely result of a contest, above all a
  horse race
scope: Someone who works out the betting odds from the likely result of a contest, not a person who takes
  the bets and not a tipster; odds-maker is another name for this sense.
examples:
- The handicapper set long odds on the outsider.
- A good handicapper studies past races before setting the odds.
