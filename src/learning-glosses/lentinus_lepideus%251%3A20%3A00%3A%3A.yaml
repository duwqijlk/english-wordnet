simpleMeaning: A mushroom with a scaly top and white flesh and a ring on its stalk, with scales below
  the ring; it smells like liquorice
scope: Also called scaly lentinus; this is the scaly mushroom with a ring on its stalk, not other mushrooms
  with rings.
examples:
- Lentinus lepideus grew on the dead log.
- The Lentinus lepideus smelled of liquorice.
