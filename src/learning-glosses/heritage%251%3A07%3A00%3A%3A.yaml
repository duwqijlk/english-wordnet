simpleMeaning: a thing you cannot touch that is passed down to you from your family of long ago, such
  as a gift or a way of life
scope: 'Also called inheritance: something passed down from your family of long ago, not the old ways
  people keep and not land or a house you get when someone dies.'
examples:
- My only heritage was my mother's blessing.
- The world's heritage of knowledge belongs to us all.
