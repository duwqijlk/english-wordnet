simpleMeaning: With a bushy tail, it is one of several gnawing animals in the group Neotoma of the west
  of North America, and it stores away food and other things.
scope: It is also called pack rat, bushytail woodrat and trade rat, and it is one of several kinds in
  the group Neotoma, known for storing away food and other things.
examples:
- The packrat lives in the west of North America.
- Packrats have bushy tails.
