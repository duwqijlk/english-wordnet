simpleMeaning: Inside a thin, balloon-like case sit round, soft yellow berries, on a plant from America
  that lives one year and is grown for show.
scope: Also called downy ground cherry, it is the plant from America that lives one year, is grown for
  show, and bears round yellow berries in a thin, balloon-like case.
examples:
- Round yellow berries sat inside thin cases on the strawberry tomato.
- The strawberry tomato was grown for show, with its berries hidden in their cases.
