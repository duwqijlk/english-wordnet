simpleMeaning: In computing, one unit that describes almost anything a computer knows.
scope: The computing item a computer treats as a unit, not a physical thing, a grammar part or the act
  of protesting.
examples:
- In the program, each object stores its own data and methods.
- The programmer created a new object to hold the customer's details.
