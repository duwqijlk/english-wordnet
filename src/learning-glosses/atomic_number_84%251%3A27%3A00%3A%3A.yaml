simpleMeaning: A radioactive metal like tellurium and bismuth; found in uranium ores but can be made by
  striking bismuth with neutrons in a nuclear reactor.
scope: 'Also called Po and polonium: a radioactive metal like tellurium and bismuth, not tellurium itself
  and not a gas.'
examples:
- Atomic number 84 occurs in uranium ores.
- Polonium, atomic number 84, can be made in a nuclear reactor.
