simpleMeaning: Said of a thing that has the same effect as the part of the body's nerve system that works
  when the body is at rest
scope: Said of a thing that works like the nerve system that acts when the body is at rest, not one that
  acts when the body is under strain and not a thing that works in some other way.
examples:
- The doctor gave a parasympathomimetic drug to slow the patient's heart rate.
- Parasympathomimetic drugs act on the nerves that calm the body.
