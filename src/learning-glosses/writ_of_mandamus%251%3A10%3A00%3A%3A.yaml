simpleMeaning: A rare writ telling an officer to do a set task, the law's out-and-out duty, not for the
  officer's choice, used only when all other court cures fail.
scope: This sense is also called mandamus.
examples:
- A writ of mandamus told the officer to act.
- Writs of mandamus come last.
