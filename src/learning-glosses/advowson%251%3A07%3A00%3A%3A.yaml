simpleMeaning: English law gives someone the right to put forward a person to fill an empty church post
  that pays an income.
scope: Under English law, this right lets its holder put forward a person to fill an empty church post
  that pays an income.
examples:
- The advowson let the family name the next priest for the parish.
- After the old priest died, the advowson decided who would name his successor.
