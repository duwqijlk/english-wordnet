simpleMeaning: the outside face or outermost layer of a made object, including a layer of material that
  forms or looks like such an outer face.
scope: This is not the geometric boundary of a solid considered as a flat area; it is the outer face or
  coating of a made thing.
examples:
- Wipe the surface of the counter with a damp cloth.
- The statue's surface had been polished until it shone.
