senseId: 'macho%1:18:00::'
synsetId: 10298916-n
simpleMeaning: a man who shows, or tries hard to show, that he is strong and man-like in the way people
  expect men to be
scope: 'This word names the man himself: a man who shows that he is strong and man-like. It is not the
  describing word for how a man looks or acts.'
examples:
- The young macho lifted the heavy box to show how strong he was.
- He is a real macho who never lets anyone see that he is afraid.
