simpleMeaning: in a way that cannot be separated or undone
scope: This means joined so closely that the parts cannot be taken apart, not just placed together or
  joined for a short time.
examples:
- The two ideas are inextricably linked in his book.
- Her name became inextricably tied to the cause.
