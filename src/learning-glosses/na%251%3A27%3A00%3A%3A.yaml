simpleMeaning: A soft, waxy, silver alkali metal, found a lot in compounds, above all salt water and halite,
  or rock salt; it burns yellow and acts with great force in water.
scope: A soft metal, not potassium and not a salt; also called sodium and atomic number 11.
examples:
- Na burns with a yellow flame in water.
- Na is found in salt water and in rock salt.
