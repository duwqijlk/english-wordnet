simpleMeaning: Held in the pilot's hand, this lever works the flaps on the wings and tail of a plane.
scope: Also called a stick or a control stick; a lever held in the pilot's hand that works the flaps on
  the wings and tail of a plane, not the handle used to feed orders into a computer.
examples:
- The pilot pulled back on the joystick to lift the nose.
- He gripped the joystick as the plane banked to the left.
