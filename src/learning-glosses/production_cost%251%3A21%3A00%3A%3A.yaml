simpleMeaning: All the money spent on the stuff used to make things and on the work of making them
scope: All the money spent to make goods, not the money spent to sell them or to ship them.
examples:
- The production cost of each chair includes wood and wages.
- Rising production costs forced the factory to raise its prices.
