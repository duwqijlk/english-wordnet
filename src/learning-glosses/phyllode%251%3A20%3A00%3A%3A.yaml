schema: oewn-learning-gloss-v2
senseId: 'phyllode%1:20:00::'
synsetId: 13152511-n
simpleMeaning: The work of a leaf blade is done by a leaf stalk that has grown wide
scope: A leaf stalk that does the work of a leaf blade, not a true leaf blade and not an ordinary stalk
  that only holds a leaf up.
examples:
- The phyllode on this plant does the work of a leaf, though it is really a widened stalk.
- Acacia trees often have phyllodes in place of true leaves.
