simpleMeaning: to make leaves or flowers into a round ring shape
scope: To make flowers or leaves into a round ring, not to put such rings on a person, a door, or another
  thing to make it look nice.
examples:
- She wreathed the flowers into a ring for the table.
- He wreathed green leaves together to make a crown for the play.
