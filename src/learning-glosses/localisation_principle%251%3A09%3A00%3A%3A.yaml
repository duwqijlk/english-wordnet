simpleMeaning: The body keeps its jobs apart, each one in its own fairly small place in one part of the
  body, in the study of the body
scope: Also called localization, localisation, localisation of function, localization of function, and
  localization principle, this is the rule that each job of the body belongs in its own fairly small place.
examples:
- The localisation principle says each job of the body belongs in one part of it.
- By the localisation principle, each job of the body has its own fairly small place.
