simpleMeaning: wine comes from the small red berries of this graceful shrub or small tree, bare in winter,
  with pretty leaves; the berries turn black when ripe
scope: Also called wineberry, this graceful shrub or small tree bears small red berries that turn black
  when ripe and are used for wine.
examples:
- We saw a makomako in the garden.
- The makomako berries were ripe.
