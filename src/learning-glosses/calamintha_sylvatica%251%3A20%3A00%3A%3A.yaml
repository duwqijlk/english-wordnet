simpleMeaning: A mint-smelling plant that lives many years, from central and southern Europe.
scope: Also called common calamint and Satureja calamintha officinalis; a long-lived, mint-smelling plant
  of central and southern Europe, not a short-lived herb.
examples:
- Calamintha sylvatica smells of mint when you brush past it.
- Calamintha sylvatica grows along the woodland paths of southern Europe.
