simpleMeaning: A severe illness, often deadly, in people, monkeys and chimpanzees, caused by a virus;
  it brings high temperature and severe inner bleeding, spreads between people, and occurs mostly in Africa.
scope: A deadly viral illness, also called Ebola and Ebola fever, found mostly in Africa and spread between
  people.
examples:
- Ebola hemorrhagic fever is spread from person to person.
- Health workers feared Ebola hemorrhagic fever during the outbreak.
