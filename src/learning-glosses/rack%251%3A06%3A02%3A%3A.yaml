simpleMeaning: A tool for hurting people by pulling their bodies out of shape, pulling their joints apart,
  or cutting parts off
scope: 'Also called wheel: a tool for hurting people by pulling them out of shape, not a frame for holding
  things, and not the pain of being hurt in the mind.'
examples:
- The prisoner was tied to the rack.
- They threatened him with the rack to make him talk.
