simpleMeaning: To do with finding out what is wrong with a person or thing, and used to help find it out
scope: About finding out what is wrong, not the act of naming the illness itself and not a cure.
examples:
- The doctor ordered a diagnostic test to find the cause of the fever.
- A diagnostic reading test showed where the child had trouble with words.
