simpleMeaning: a stop or slowing down of activity during the winter, especially a slowing of the way the
  body works (metabolism) in some animals
scope: The stopping or slowing of activity for the winter, above all in some animals; it is not a short
  sleep and not rest in summer.
examples:
- In hibernation, a bear's body slows down and it uses very little energy.
- Hibernation helps some animals live through the long, cold winter.
