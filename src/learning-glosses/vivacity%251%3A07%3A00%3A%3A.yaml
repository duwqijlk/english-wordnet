simpleMeaning: the quality of being happy, full of life and full of energy
scope: This is the lively, happy quality in a person. It is not a single lively act and not the noise
  or busy feel of a place.
examples:
- Her vivacity made the whole class feel happy and awake.
- Even at eighty, he still spoke and laughed with great vivacity.
