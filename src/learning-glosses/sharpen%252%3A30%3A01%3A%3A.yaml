simpleMeaning: to make something clearer and more exact
scope: This is making something clearer and more exact, not making a blade sharp, not making your senses
  keener, and not making a picture or sound clearer.
examples:
- We need to sharpen our argument before the meeting.
- She sharpened her speech so that every point was clear and exact.
