simpleMeaning: The large rotating airfoils on a single-rotor helicopter that produce lift to support the
  helicopter in the air.
scope: It names the big spinning blades of a helicopter with one set of blades, the ones that lift it.
examples:
- The main rotor lifted the helicopter and held it up in the air.
- The helicopter with one set of blades rose on its main rotor.
