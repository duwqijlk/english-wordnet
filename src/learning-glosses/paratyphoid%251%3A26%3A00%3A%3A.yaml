simpleMeaning: any of a group of gut illnesses that spread by infection and look like typhoid fever
scope: A gut illness like typhoid fever, not typhoid fever itself; paratyphoid fever is another name for
  this sense.
examples:
- The doctor said the paratyphoid had spread through the town's water.
- Paratyphoid can cause fever and stomach pain like typhoid fever.
