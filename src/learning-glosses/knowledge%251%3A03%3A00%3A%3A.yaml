simpleMeaning: The facts and understanding a person has in their mind from learning, noticing and thinking.
scope: This is what a person has learned and understood, not the act of finding out or being familiar
  with a place.
examples:
- Her knowledge of local history surprised us.
- He used his knowledge of computers to fix the machine.
