simpleMeaning: A little flat, reddish-orange citrus fruit (a fruit like an orange or a lemon) from China,
  with loose skin
scope: 'Also called mandarin orange: this is the fruit from China that is a little flat and has loose
  skin; it is not the Chinese language and not a government official.'
examples:
- She peeled a mandarin and shared the sweet pieces with her sister.
- He bought a bag of mandarins at the market.
