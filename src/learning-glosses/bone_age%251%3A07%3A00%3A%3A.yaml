simpleMeaning: How old a person is judged to be, from the growth of hard body parts in X-ray pictures,
  matched against the growth of a typical person of known years.
scope: A measure of age from the growth of the hard parts inside the body, not a person's years counted
  from birth.
examples:
- His bone age was that of a child two years younger.
- Her bone age was two years behind her real age.
