simpleMeaning: A weed of Canada and the east of the United States, with yellow flowers, used at times
  to make dye
scope: This is a weed with yellow flowers used at times to make dye; grey goldenrod is another name for
  it, not a garden flower and not a weed of the west.
examples:
- Gray goldenrod grew along the road in Canada.
- Dyers used gray goldenrod to colour cloth yellow.
