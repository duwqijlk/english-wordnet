simpleMeaning: to feel a sudden and very strong feeling in your body and mind
scope: This is the act of feeling it yourself, not the thing that brings the feeling and not the act of
  making someone else feel it.
examples:
- He thrilled at the speed and the roar of the engine as the car raced on.
- She thrilled to hear her name called out as the winner.
