simpleMeaning: At the top of a wall, a brick that is laid sideways
scope: A brick put sideways at the top of a wall, also called cope and coping. It is not the beam over
  a door or window, nor a line of text above a passage.
examples:
- Each header in the top row was laid sideways across the wall.
- The builder laid the last header sideways at the top of the brick wall.
