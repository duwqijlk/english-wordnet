simpleMeaning: To do with any way of working that uses two or more things that can change
scope: To do with any way of working that uses two or more things that can change, not a way of working
  that uses only one such thing and not a thing itself.
examples:
- The study used a multivariate method to look at age, income and schooling together.
- Multivariate tests take more than one thing that can change into account.
