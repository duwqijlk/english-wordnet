simpleMeaning: Red tips on the feathers they fly with mark brown songbirds with soft feathers and crested
  heads, from the Northern Hemisphere.
scope: This name covers brown songbirds of the Northern Hemisphere, set apart by their crested heads and
  red tips on their flight feathers.
examples:
- A waxwing sang, its crest plain to see.
- We watched waxwings pass overhead, their red wing tips easy to spot.
