simpleMeaning: the act of loosening the ties that hold something shut or in place
scope: Also called undoing and untying, this is loosening ties that hold a thing; it is not tying a thing
  or holding it tight.
examples:
- The unfastening of the rope took only a minute.
- Unfastening the bundle was easy once the knot came loose.
