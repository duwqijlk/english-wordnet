simpleMeaning: A strong showy kind of goldenrod that grows in large numbers along the east coast and the
  Gulf coast of North America.
scope: Also called beach goldenrod and seaside goldenrod, this goldenrod grows in large numbers along
  the east coast and the Gulf coast of North America, a different kind from the goldenrod of Canada and
  the eastern United States.
examples:
- Solidago sempervirens lined the sand dunes along the coast.
- We saw Solidago sempervirens in full flower on the Gulf coast.
