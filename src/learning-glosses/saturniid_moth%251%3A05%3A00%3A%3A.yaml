simpleMeaning: A big moth with bright colours, usually from warm lands, whose young spin cases of fine
  thread.
scope: Also called saturniid, it is a big bright moth, usually from warm lands, and not one of the moths
  that live in cold lands.
examples:
- A saturniid moth came out of the case its young had spun of fine thread.
- The saturniid moth flew over the warm lands.
