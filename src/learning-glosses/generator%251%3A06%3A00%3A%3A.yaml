simpleMeaning: a machine that turns the power of moving parts into power in wires, by the action of magnets
scope: A machine that makes power in wires from moving parts, not a device that makes a signal or gas,
  and not a person who starts something.
examples:
- The generator in the mill turns the power of the turning wheel into power for the lights.
- When the wind blows, the generator on the hill makes power for the farm.
