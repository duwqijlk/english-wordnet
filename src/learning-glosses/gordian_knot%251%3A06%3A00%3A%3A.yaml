simpleMeaning: A hard tangle tied by Gordius, king of Phrygia, and cut through by Alexander the Great
  with his sword, after he heard that whoever untied it would rule Asia
scope: A hard tangle tied by Gordius, king of Phrygia, and cut by Alexander the Great, not a sailor's
  knot and not a puzzle to untie by hand.
examples:
- Alexander cut the Gordian knot with his sword.
- The Gordian knot could not be untied by hand.
