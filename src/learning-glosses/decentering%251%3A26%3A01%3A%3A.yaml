senseId: 'decentering%1:26:01::'
synsetId: 92449691-n
simpleMeaning: Jean Piaget's idea of how a child's mind grows, as the child moves bit by bit from a world
  seen only from the self to one shared with others.
scope: This is Jean Piaget's idea of a child moving from a self-only world to a shared world, also called
  decentration, not a child's first words or a test of how a child plays.
examples:
- Decentering means the child learns to see the world as others see it.
- The teacher watched for decentering as the child grew older.
