simpleMeaning: Any of many plants of the Gnaphalium group, whose flowers can be dried without losing their
  shape or colour.
scope: Plants whose flowers dry without losing shape or colour, not the Filago cudweed and not everlasting
  flowers.
examples:
- Cudweed grows along the dry path behind the house.
- She picked cudweed and dried the flowers for winter.
