simpleMeaning: the quality of a person who is not loyal, cannot be trusted, and may turn against people
  who trust them
scope: 'Also called faithlessness and fickleness: not being loyal or trusted, not the sense of not telling
  the truth and not the sense of a thing not being true.'
examples:
- His falseness hurt his friends, who learned they could not trust him.
- She saw his falseness when he broke his promise and helped their enemies.
