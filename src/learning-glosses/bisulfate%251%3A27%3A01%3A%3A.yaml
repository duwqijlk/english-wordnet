simpleMeaning: a salt or an ester, a compound made from sulphuric acid, with the make-up shown as HSO4-
scope: Also called hydrogen sulfate, this is a salt or an ester of sulphuric acid, not the acid itself.
examples:
- A spoonful of bisulfate went into the mixture.
- Bisulfate was one of the salts named on the bottle.
