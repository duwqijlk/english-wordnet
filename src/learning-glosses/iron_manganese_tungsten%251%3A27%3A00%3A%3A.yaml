simpleMeaning: A mineral made of iron and manganese tungstate in crystal form, the main ore of tungsten,
  found in quartz veins linked to granite rocks.
scope: This is the ore mineral itself, not the metal tungsten refined from it and not any other tungsten
  ore.
examples:
- Iron manganese tungsten is the main ore mined for the metal.
- Geologists found iron manganese tungsten in quartz veins near the granite.
