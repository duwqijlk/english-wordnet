simpleMeaning: Said of a church that has been formally recognized as the national or state church.
scope: This describes the legal standing of a church, not something that holds official authority or approval,
  not something relating to an office, not information confirmed by officials, not conduct that follows
  an established procedure, and not a person who holds an office or referees a game.
examples:
- The country has an official church, and its bishops are appointed by the state.
- After the split, only one branch remained the official church of the realm.
