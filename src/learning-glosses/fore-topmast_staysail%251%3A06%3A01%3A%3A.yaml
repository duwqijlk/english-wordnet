simpleMeaning: the front cloth that catches the wind and sits nearest the front mast, just ahead of it,
  on a big ship with cloths hung across it
scope: 'Also called a fore staysail: the innermost front jib on a large square-rigged ship, not a jib
  farther out from the mast and not a square sail.'
examples:
- The fore-topmast staysail was set just ahead of the foremast.
- On the big square-rigged ship, the crew raised the fore-topmast staysail first.
