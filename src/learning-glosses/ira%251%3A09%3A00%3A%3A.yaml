simpleMeaning: A savings plan for old age that lets you put in a set sum each year, with tax on what it
  earns put off till later.
scope: A savings plan for old age, also called an individual retirement account; not a pension from work
  and not a bank pot for daily use.
examples:
- She put money in an IRA each year.
- His IRA will be taxed when he draws it.
