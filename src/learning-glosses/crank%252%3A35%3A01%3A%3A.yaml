simpleMeaning: to bend a thing into the shape of that turning tool, with a part set off to one side
scope: To bend a thing into the shape of the turning tool, not to turn it round, not to fasten with it,
  and not the tool itself.
examples:
- He cranked the wire into a sharp bend.
- The pipe was cranked to fit round the corner.
