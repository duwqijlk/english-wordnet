simpleMeaning: to say words clearly, or to make a sound with the voice such as a cry or shout
scope: To say something in words or with a cry, shout, or other sound; also called express. Not the sense
  of making a sound that may not be a word, and not the adjective meaning total and complete.
examples:
- He uttered a curse under his breath.
- She uttered a cry of pain when she fell.
