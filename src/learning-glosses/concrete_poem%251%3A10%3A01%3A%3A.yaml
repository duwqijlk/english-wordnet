simpleMeaning: A piece of verse whose sense comes across by the shape or pattern its words make on the
  page
scope: A piece of verse whose sense comes across by the shape or pattern its words make on the page; not
  a verse that tells its sense by words alone and not a picture with no words.
examples:
- The concrete poem was shaped like a mouse's tail.
- Her concrete poem made its sense by the pattern on the page.
