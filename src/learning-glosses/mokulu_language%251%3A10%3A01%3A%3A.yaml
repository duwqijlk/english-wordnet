simpleMeaning: In word study, a Chadic tongue of Chad, Guera Region and department, Bitkine subprefecture,
  below Guera massif, in Moukoulou, Séguine, Doli, Morgué, Djarkatché (Mezimi) and Gougué villages.
scope: Not other Chadic languages, nor other tongues of Chad; also called Mokulu.
examples:
- Mokulu language is spoken in Chad.
- Children in Guera speak Mokulu language.
