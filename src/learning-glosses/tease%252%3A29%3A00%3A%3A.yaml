simpleMeaning: To push the ends of hair back toward the head with a comb, so the hair stands up and looks
  fuller
scope: Combing hair back to make it look full, not picking on a person with mean words and not raising
  hopes without meeting them.
examples:
- She teased her hair before the party so it would look fuller.
- The hairdresser teased the ends of my hair toward my scalp.
