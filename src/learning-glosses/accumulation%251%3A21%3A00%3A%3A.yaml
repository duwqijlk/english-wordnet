simpleMeaning: In finance, the money a company makes that is not paid to the people who own parts of it,
  but is added to the company's own money
scope: In finance, this is a company's kept profits, not the general act of gathering or building something
  up bit by bit.
examples:
- The company's accumulation grew as it kept its profits instead of paying them out.
- The report showed a large accumulation that the firm could use to grow.
