simpleMeaning: A crude path marked out across wild or hilly land.
scope: This is a route for travelling through wild country, not the marks left by something that has passed,
  not a piece of evidence, and not the act of dragging something along.
examples:
- We followed a narrow trail through the hills for most of the afternoon.
- The trail led us through thick forest to a small lake.
