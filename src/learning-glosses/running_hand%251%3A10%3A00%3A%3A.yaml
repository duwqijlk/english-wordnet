simpleMeaning: fast joined-up writing, with all letters written in full and linked inside each word, and
  the pen kept on the paper
scope: 'Also called cursive, longhand and cursive script: fast joined-up writing with the pen kept on
  the paper, not printed letters and not writing with gaps between letters.'
examples:
- Her running hand was so fast that I could barely read it.
- He took notes in running hand, never lifting his pen from the paper.
