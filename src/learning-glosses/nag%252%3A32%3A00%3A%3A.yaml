simpleMeaning: to keep bothering someone by complaining again and again about small, unimportant things
scope: 'Also called peck: to keep bothering someone with small complaints, not a person who does this,
  and not just to remind or urge someone again and again.'
examples:
- She nags her husband all day long about small things.
- He keeps nagging his son about the untidy room.
