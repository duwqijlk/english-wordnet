simpleMeaning: A small salmon with red flesh from the rivers and streams of the north Pacific, prized
  as food; its grown fish die after they lay their eggs.
scope: This is a small salmon with red flesh from the rivers of the north Pacific, also called red salmon,
  sockeye and sockeye salmon, not a fish of the open sea and not one that lives on after it lays its eggs.
examples:
- The blueback salmon swam up the river to lay its eggs.
- The blueback salmon is valued as food for its red flesh.
