simpleMeaning: A medical tool for looking at the clear front of the eye to find uneven places on its front
  surface.
scope: This is a medical tool for looking at the clear front of the eye to find uneven places on its front
  surface, not the examination itself and not an ordinary eye chart.
examples:
- The doctor used a keratoscope to check the front of my eye.
- A keratoscope shows uneven places on the cornea.
