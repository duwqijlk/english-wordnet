simpleMeaning: A receiver that picks up signals from all sides, set to the wave bands used for television.
scope: This is a receiver that picks up television signals from all sides, also called television antenna;
  not a radio receiver and not a satellite dish.
examples:
- The tv-antenna on the roof picks up all the channels.
- A new tv-antenna replaced the old one.
