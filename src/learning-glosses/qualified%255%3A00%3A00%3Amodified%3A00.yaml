simpleMeaning: made narrower in meaning, as when 'man' in 'a tall man' means only men who are tall
scope: A word used with a narrower meaning, not a person with the skill or training for a job.
examples:
- The word 'man' is qualified in 'a tall man', since it means only tall men.
- In the phrase 'a qualified yes', the yes is limited rather than full.
