simpleMeaning: trying to stop the other side from winning or from scoring, or made for that job
scope: Used for a team, player, or play that tries to stop the other side from winning or scoring, not
  for one that tries to score itself.
examples:
- The defending team held its lead until the end of the game.
- Their defending players stayed close to their own goal.
