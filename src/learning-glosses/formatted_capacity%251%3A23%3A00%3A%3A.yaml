simpleMeaning: In computer science, what is left after setting a disk up, with marks put on to divide
  it and keep time, is the room for use on that disk drive
scope: This is the room for use left on a disk drive after it is set up, not the disk's full size before
  setting it up.
examples:
- The formatted capacity of the old drive was smaller than the number on the box.
- After the setup, the formatted capacity left room for only a few files.
