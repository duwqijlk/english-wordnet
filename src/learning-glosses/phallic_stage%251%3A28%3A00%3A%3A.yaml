simpleMeaning: In psychoanalysis, the third step in a child's growth when knowing about and touching the
  sex organs is thought to be the main source of pleasure
scope: In psychoanalysis, the third step in a child's growth when the sex organs are thought to be the
  main source of pleasure; phallic phase is another name for this sense, not the earlier mouth step and
  not the later step when the child turns to others.
examples:
- The phallic stage is the third step in the child's growth in Freud's account.
- During the phallic stage the child finds most pleasure in the sex organs.
