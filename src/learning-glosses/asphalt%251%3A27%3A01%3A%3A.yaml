simpleMeaning: A dark, sticky stuff found in the ground and left over when oil is made pure, made up mostly
  of hydrocarbons, stuff made from hydrogen and carbon.
scope: A dark, sticky stuff from the ground or from making oil pure, not the mix of it with stones used
  for roads, and not the act of covering a road with it.
examples:
- Asphalt seeps from the ground in a few desert places.
- Natural asphalt was once used to seal boats against water.
