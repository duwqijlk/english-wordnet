simpleMeaning: Its big red or orange fruit is good to eat, though sharp enough to dry the mouth; it grows
  on a small Asian tree that loses its leaves in winter.
scope: This is a small Asian tree that loses its leaves in winter and bears big red or orange fruit you
  can eat, not the blackish bird of New Zealand that shares its name.
examples:
- A kaki dropped its leaves in winter and bore red fruit.
- We ate a kaki, though its sharp taste dried our mouths.
