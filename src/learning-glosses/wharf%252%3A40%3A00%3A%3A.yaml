simpleMeaning: to keep goods on a flat place by the water where ships load and unload
scope: Keeping goods on the flat place by the water where ships stop; not tying a ship up there, not taking
  goods off a ship there, and not building such a place.
examples:
- They wharfed the boxes of tea until the ship arrived.
- The men wharfed the goods under a roof by the water.
