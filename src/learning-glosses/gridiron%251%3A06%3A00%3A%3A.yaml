simpleMeaning: a cooking tool made of straight metal bars side by side, used to cook fish or meat over
  heat
scope: A cooking tool of metal bars, also called grid; not a field for American football and not a flat
  pan for frying.
examples:
- He placed the fish on the gridiron over the fire.
- She cleaned the gridiron after cooking the meat on it.
