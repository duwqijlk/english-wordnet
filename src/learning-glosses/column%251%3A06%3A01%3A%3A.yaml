simpleMeaning: a tall round upright post that stands alone and holds up nothing, as a monument does
scope: A tall round upright post that stands alone and holds up nothing, not one that holds up a roof
  and not a thing shaped like one; also called a pillar.
examples:
- A column stood in the square to mark the victory.
- The column rose alone at the edge of the park.
