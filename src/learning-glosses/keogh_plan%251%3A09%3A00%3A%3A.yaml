simpleMeaning: A way of saving for old age that lets tax be paid later, for workers in firms that are
  not companies, or for people who work for themselves.
scope: A tax-deferred saving deal for old age for workers in firms that are not companies and for people
  who work for themselves, distinct from a company work payment scheme.
examples:
- She put money in a Keogh plan each year.
- A Keogh plan lets him pay tax on his savings later.
