simpleMeaning: A protein joined to a compound of iron and porphyrin, which can hold iron.
scope: A protein joined to an iron-porphyrin compound; haemoprotein is another name for this sense, and
  this is not a plain protein or a protein joined to a sugar.
examples:
- Hemoglobin is a hemoprotein that carries oxygen in the blood.
- The hemoprotein in the cell holds iron in its centre.
