simpleMeaning: the habit of following set rules about how things must look or be done, with great care
  and exactness
scope: Strictly following set rules about how things look or are done, not the idea in philosophy that
  symbols have no meaning and not a loose way of doing things.
examples:
- His formalism showed in the way he kept to every rule of dress.
- The committee's formalism slowed every decision with extra steps.
