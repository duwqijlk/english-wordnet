simpleMeaning: Hard greenish-brown wood from the tree of the same name and from other trees of the genus
  Guaiacum
scope: Guaiac and guaiacum are other names for this hard greenish-brown wood; it is the wood, not the
  tree it comes from.
examples:
- The mallet was made of lignum vitae.
- Lignum vitae is one of the hardest woods known.
