simpleMeaning: This moment is one that suits taking pictures, or is planned for them, because the pictures
  give the people in them good public notice.
scope: It is also called photo op, and it is a moment set up for pictures that give good public notice
  to the people in them.
examples:
- A photo opportunity was arranged for the mayor.
- A photo opportunity gives a star good publicity.
