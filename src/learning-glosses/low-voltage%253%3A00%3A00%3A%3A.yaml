simpleMeaning: A small amount of electric power is enough for this thing to work on, or to be put under
scope: Also called low-tension, this describes a thing that works with a small amount of electric power,
  not one that uses a lot of power and not one that has no power at all.
examples:
- The low-voltage lights in the garden run on a small amount of power.
- This low-voltage motor is made to work with a small amount of electric power.
