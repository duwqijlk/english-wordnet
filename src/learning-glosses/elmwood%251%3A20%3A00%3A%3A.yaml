simpleMeaning: Hard tough timber from a kind of tree, used to make such things as tools and furniture.
scope: Hard tough timber from a tree, also called elm; not soft timber and not a living tree.
examples:
- The elmwood table was heavy and hard.
- Elmwood is used for tools and furniture.
