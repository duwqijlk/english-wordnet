simpleMeaning: Covered all over with hairs or fine threads packed close together like cotton.
scope: It means a thing covered all over with hairs or fine threads packed close together like cotton;
  woolly is another name for this sense, not smooth and bare, and not covered with stiff spikes.
examples:
- The aphid's lanate coat looked like a tuft of cotton.
- The lanate leaves were covered with fine hairs like cotton.
