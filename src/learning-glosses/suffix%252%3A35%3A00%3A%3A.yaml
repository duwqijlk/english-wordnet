senseId: 'suffix%2:35:00::'
synsetId: 01300709-v
simpleMeaning: to add a part at the end of a word, where the part changes the meaning or the way the word
  is used
scope: This is the verb for adding a part at the end of a word; not the added part itself and not a part
  added at the start of a word.
examples:
- You can suffix '-ed' to 'walk' to make 'walked'.
- The teacher suffixed 's' to each noun to make it plural.
