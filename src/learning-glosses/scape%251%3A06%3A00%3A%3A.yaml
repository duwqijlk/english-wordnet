simpleMeaning: In architecture, the straight up-and-down part of a column
scope: 'Also called shaft: the straight up-and-down part of a column in a building. Not the stalk of a
  flower that grows from the ground.'
examples:
- The scape of the old stone column was smooth and tall.
- Cracks ran down the scape, the long middle part of the column.
