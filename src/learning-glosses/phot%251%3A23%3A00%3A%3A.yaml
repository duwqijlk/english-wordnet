simpleMeaning: 'This unit measures the light that falls on a surface: one lumen on each square centimetre,
  with ten thousand of them making one lux.'
scope: This unit measures the light that falls on a surface, and ten thousand of them make one lux, not
  the lux itself.
examples:
- The light measured fifty phots.
- Ten thousand phots make one lux.
