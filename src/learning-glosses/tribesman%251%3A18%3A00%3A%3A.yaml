simpleMeaning: a man who belongs to a tribe, a group of people who share the same customs and way of life
scope: This is a man who is a member of such a group; it is not a woman member of the group, and not a
  person who only visits the group.
examples:
- The tribesman hunted with the other men from his village.
- A young tribesman showed the visitors the way through the hills.
