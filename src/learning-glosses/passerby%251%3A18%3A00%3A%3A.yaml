simpleMeaning: a person who goes past in a casual way or by chance
scope: 'Another name for this sense is passer: a person who goes past in a casual way or by chance, not
  a person who lives or works in the place and not a person who stops to stay.'
examples:
- A passerby walked past the new shop without going in.
- Only one passerby saw the accident happen.
