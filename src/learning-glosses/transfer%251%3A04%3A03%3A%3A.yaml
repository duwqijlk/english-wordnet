simpleMeaning: the act of changing something from one form into another
scope: This is the act of changing something into a different form, not a person who moves to a new job,
  and not a ticket for changing transport.
examples:
- The transfer of the novel into a screenplay took months.
- The transfer from paper records to a digital archive took two years.
