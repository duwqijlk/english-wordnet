simpleMeaning: A small shrub from Europe and Asia, sometimes grown for beauty, with yellow flower bunches
  that give a dye, common as a wild plant in Britain and the United States.
scope: This small shrub is also called whin, dyer's-broom, dyer's greenweed, dyeweed, woadwaxen and woodwaxen.
examples:
- The greenweed's yellow flowers give a dye.
- Greenweed is sometimes grown for beauty.
