simpleMeaning: clothes that have a special style of their own, or clothes chosen for a particular event.
scope: This is a noun for clothing of a special style or for an event, not the adjective use that says
  an occasion requires formal clothes or that clothes suit formal events.
examples:
- The performers wore traditional dress for the opening ceremony.
- Many guests arrived in formal dress for the awards evening.
