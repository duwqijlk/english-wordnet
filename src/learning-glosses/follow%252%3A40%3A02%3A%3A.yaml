simpleMeaning: have signed up to see new posts and updates from another user on social media
scope: This is not going after someone in person and not doing what someone's rules require; it is signing
  up to see another user's posts on social media.
examples:
- She follows three cooking accounts on Instagram.
- He followed the band's page to hear about new tours.
