simpleMeaning: Growing old too soon, with grey hair, skin full of lines and a bent back, in a child, is
  a rare state
scope: This rare state makes a child grow old too soon, with grey hair, lined skin and a bent back, not
  the slow aging of an old person.
examples:
- The child with progeria had grey hair and a bent back.
- Children with progeria look old before their time.
