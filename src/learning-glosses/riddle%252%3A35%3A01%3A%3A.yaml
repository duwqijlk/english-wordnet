simpleMeaning: to separate grain from its dry outer shells by passing it through a frame with big holes
scope: 'Also called screen: passing grain through a tool with holes to take the dry outer shells away.
  Not the noun riddle (the tool itself), not explaining a puzzle, and not setting a hard problem.'
examples:
- The farmer riddled the wheat to separate the grain from the chaff.
- They riddled the harvested grain to get the chaff out before storing it.
