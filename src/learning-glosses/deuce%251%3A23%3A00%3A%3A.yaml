simpleMeaning: the number that is one plus one, or the written sign for this number
scope: 'Also called two: the number one plus one, or its written sign, not a tied score in tennis or table
  tennis that needs two points in a row to win.'
examples:
- On the dice, he rolled a deuce.
- The card with two hearts is a deuce.
