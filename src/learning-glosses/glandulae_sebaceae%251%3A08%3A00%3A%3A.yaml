simpleMeaning: A skin gland that gives out an oily fluid, most often into a hair root, to oil hair and
  skin
scope: This is a skin gland that gives out an oily fluid, most often into a hair root, to oil hair and
  skin; sebaceous follicle and sebaceous gland are other names for this sense, not a sweat gland and not
  the skin itself.
examples:
- The glandulae sebaceae keep the skin from drying out.
- Oil from the glandulae sebaceae coats each hair.
