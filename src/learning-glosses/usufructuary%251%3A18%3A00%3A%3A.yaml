simpleMeaning: a person who has the right to use and enjoy land or goods that belong to someone else
scope: A person with the right to use and enjoy property that belongs to someone else, not the owner and
  not a person who rents it.
examples:
- As usufructuary of the farm, he could live there for life.
- The will made her usufructuary of the house.
