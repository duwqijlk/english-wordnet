simpleMeaning: Body parts are kept from going bad by filling them with plastics, so they can be used to
  teach and to study
scope: To keep body parts from going bad with plastics, for teaching and study, not to freeze them and
  not to dry them.
examples:
- The lab plastinates the heart so students can study it for years.
- She learned how to plastinate tissue during her training.
