simpleMeaning: a man in Venice who moves a gondola (a long, thin boat) through the water
scope: This is the person in Venice who moves a gondola, not the boat itself and not a person riding in
  it.
examples:
- The gondolier pushed his boat along the narrow canal.
- Our gondolier sang as he took us through Venice.
