simpleMeaning: a first idea about how something in nature works, not yet checked, but it could explain
  some facts if it is true
scope: 'Also called theory: a first idea about nature that still needs checking; not another thing that
  could happen or be chosen.'
examples:
- The scientist put forward a new possibility to explain why the plants died.
- This possibility could explain the facts, but it has not been checked yet.
