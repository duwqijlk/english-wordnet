simpleMeaning: a machine, such as a fan, that brings fresh air in or pushes bad air out
scope: A machine, such as a fan, that brings fresh air in or pushes bad air out; not the machine that
  helps a person breathe when their lungs cannot do the work on their own.
examples:
- A ventilator in the wall kept the kitchen air fresh.
- They turned on the ventilator to clear the smoke from the room.
