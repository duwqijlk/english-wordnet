simpleMeaning: A hot-land herb with orange-red blooms, then pods that call to mind a swallow with wings
  spread wide, a weed all through the hot lands.
scope: This sense is also called blood flower, unlike the sense for a perennial herb with a branched woody
  stock and bright yellow flowers.
examples:
- Swallowwort grew in the hot lands.
- A swallowwort bore orange-red blooms.
