simpleMeaning: A nerve unit in the outer layer of the brain, with short branch-like parts and with a long
  or short main thread that splits in the grey matter.
scope: Also called Golgi's cell; this nerve unit sits in the outer layer of the brain, with short branch-like
  parts and a main thread that splits in the grey matter.
examples:
- The Golgi cell sends its main thread through the grey matter.
- A Golgi cell in the outer layer of the brain has short branch-like parts.
