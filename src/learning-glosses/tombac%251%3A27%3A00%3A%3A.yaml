simpleMeaning: Cheap jewellery gets its gold look from this copper-and-zinc mix, at times with arsenic,
  which also coats things in gold.
scope: Cheap jewellery and gilding use this copper-and-zinc mix, also called tambac and tombak.
examples:
- This tombac ring looked like gold but cost very little.
- The cheap jewellery was coated in gold with tombac.
