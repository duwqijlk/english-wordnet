simpleMeaning: The set of a car's wheels, nearer at the bottom than the top.
scope: This sense is the set of a car's wheels, nearer at the bottom than the top, unlike the sense for
  a slope in a road's turn, with the outside higher than the inside to cut the pull of turning.
examples:
- The camber of the wheels was set wrong.
- Camber lines the wheels nearer at the bottom.
