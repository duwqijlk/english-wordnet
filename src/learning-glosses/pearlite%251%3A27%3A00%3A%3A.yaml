simpleMeaning: As hot iron cools, two forms of iron settle into thin layers, and this mix is one part
  of steel and cast iron.
scope: This layered mix is one part of steel and cast iron, and it is not a single metal on its own.
examples:
- The pearlite formed as the hot iron cooled.
- Cast iron holds pearlite among its parts.
