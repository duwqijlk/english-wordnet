simpleMeaning: Parts that slow the flow of power, joined one after another across a source of voltage,
  used to get a chosen part of the voltage
scope: This is a set of parts that slow the flow of power, joined one after another to get a chosen part
  of the voltage; voltage divider is another name for it, not a single part that slows power.
examples:
- The engineer added a potential divider to the circuit.
- A potential divider gave us half the voltage we needed.
