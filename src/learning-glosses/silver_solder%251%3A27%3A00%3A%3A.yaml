simpleMeaning: A metal that melts to join other pieces of metal and holds some of the pale grey-white
  metal in it
scope: A metal that melts to join other pieces of metal and holds some of the pale grey-white metal in
  it, not glue and not a joining metal with none of that metal in it.
examples:
- He used silver solder to join the two pipes.
- The silver solder held the chain links fast.
