simpleMeaning: A herb of marshes and bogs with single hanging yellow-green flowers and pitchers, somewhat
  twisted, with broad wings below.
scope: Also called a California pitcher plant; a marsh herb with single hanging yellow-green flowers and
  somewhat twisted pitchers with broad wings, kin to other pitcher plants.
examples:
- Darlingtonia californica grows in the bog, its yellow-green flowers hanging down.
- The Darlingtonia californica pitchers are somewhat twisted, with broad wings below.
