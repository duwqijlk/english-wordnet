simpleMeaning: one of the two times in a year when the sun crosses the line around the middle of the earth
  and day and night are the same length
scope: A time in the year when day and night are the same length, not one of the two points in the sky
  where the sun's path crosses a line around the sky.
examples:
- The spring equinox falls in March, when day and night are about the same length.
- On the day of the equinox, day and night each last about twelve hours.
