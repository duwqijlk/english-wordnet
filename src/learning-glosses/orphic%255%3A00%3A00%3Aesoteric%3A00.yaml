simpleMeaning: With a meaning that is hidden from the senses and not clear to the mind; past what most
  people can grasp
scope: 'Also called secret, mysterious, mystic, mystical, or occult: a hidden meaning past plain grasp,
  not a plain fact and not a lie.'
examples:
- The orphic lines in the poem hid a secret meaning.
- Her orphic words left the crowd unsure what she meant.
