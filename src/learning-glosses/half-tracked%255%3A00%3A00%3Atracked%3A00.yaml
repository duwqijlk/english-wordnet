simpleMeaning: with round wheels at the front and belts that move round and round at the back
scope: Also called half-track, this tells of a vehicle with wheels in front and moving belts at the back,
  not a vehicle with wheels all round and not one with belts all round.
examples:
- The half-tracked carrier moved slowly over the mud.
- They drove a half-tracked truck through the wet field.
