simpleMeaning: These are open mesh coverings, like netting, that women wear on their legs.
scope: Leg coverings for women made from open mesh cloth that looks like netting; not plain smooth stockings,
  and not thick woollen leg coverings.
examples:
- She wore fishnet stockings to the dance.
- Fishnet stockings are common in roller derby.
