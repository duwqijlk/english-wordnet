simpleMeaning: the seed of the mung plant, eaten as food, and food made from that seed
scope: The seed of the mung plant, eaten as food; golden gram, green bean, green gram, green soy, monggo,
  moong, mung, mung bean and munggo are other names for this sense, not the plant itself and not the pod
  that holds the seed.
examples:
- Mash bean is cooked in soups across Asia.
- We soaked the mash bean overnight before cooking it.
