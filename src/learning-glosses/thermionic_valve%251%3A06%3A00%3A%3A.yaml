simpleMeaning: An electronic device with metal parts set inside a glass or metal case with the air taken
  out
scope: This is an electronic device with parts set in a case with the air taken out, also called a tube,
  an electron tube, a thermionic tube, a thermionic vacuum tube and a vacuum tube; not a light bulb and
  not a transistor.
examples:
- The amplifier still uses a thermionic valve.
- He tested each thermionic valve before fitting it.
