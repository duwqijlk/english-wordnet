simpleMeaning: A body chemical made by the front part of the pituitary gland, which stirs the adrenal
  cortex into action
scope: A body chemical made by the front part of the pituitary gland, also called adrenocorticotrophic
  hormone, adrenocorticotrophin, adrenocorticotropic hormone, adrenocorticotropin, corticotrophin, and
  corticotropin; not a body chemical made by the adrenal cortex itself.
examples:
- ACTH stirs the adrenal cortex into action.
- The pituitary gland makes ACTH.
