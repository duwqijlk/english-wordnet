simpleMeaning: In physics, a measure of how much work a system can do, counted in joules or ergs
scope: This is a measure in physics of how much work a system can do; energy is another name for it, not
  heat itself or the motion of a thing.
examples:
- The free energy of the reaction tells us if it will happen.
- Scientists measured the free energy in joules.
