simpleMeaning: The middle of the cone of shots rises above a metre from the ground, though the shots fly
  almost level with the ground
scope: Shots fired almost level with the ground, not shots aimed high into the air and not a single shot.
examples:
- The grazing fire swept the field just above the grass.
- They held the grazing fire low so it stayed near the ground.
