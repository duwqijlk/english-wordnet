simpleMeaning: a big fish from the middle of the United States, with a flat top to its head and a jaw
  that sticks out
scope: 'Also called a goujon and a mudcat: a big fish from the middle of the United States, not a small
  pond fish and not a sea fish.'
examples:
- The angler caught a flathead catfish in the river.
- A flathead catfish lay on the bottom of the boat.
