simpleMeaning: a sport like wrestling that comes from jujitsu (an older fighting way that does not fight
  against force), and was made in Japan
scope: A Japanese fighting sport like wrestling and based on jujitsu. It is not wrestling itself, and
  not a fighting sport built mainly on hits and kicks.
examples:
- He has done judo for ten years and now teaches children.
- In judo, you throw the other person down without fighting against his force.
