simpleMeaning: In grammar, about a language that joins word roots and the bits that change them into single
  words, by a set pattern
scope: About how a language builds single words from roots and modifying parts, not a man-made chemical
  substance and not the combining of separate ideas into one whole.
examples:
- In synthetic languages, one word can carry the work of a whole phrase.
- Turkish is often given as a synthetic language.
