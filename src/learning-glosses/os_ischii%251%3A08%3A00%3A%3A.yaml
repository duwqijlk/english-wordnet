simpleMeaning: One of three parts of the hip bone, the part that sits below the upper part of the hip
scope: One of the three parts of the hip bone, also called ischial bone and ischium, sitting below the
  upper part of the hip, not the top part of the hip and not the front part.
examples:
- The os ischii is the lowest of the three hip bones.
- Doctors check the os ischii after a fall onto the hip.
