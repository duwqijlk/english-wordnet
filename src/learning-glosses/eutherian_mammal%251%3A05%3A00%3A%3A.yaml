simpleMeaning: An animal whose young grow inside the mother, fed through a placenta, the organ that joins
  mother and young; all such animals except egg-laying ones and pouch-bearing ones.
scope: An animal whose young grow inside the mother; also called a placental, a eutherian, or a placental
  mammal, not an egg-laying animal and not a pouch-bearing animal.
examples:
- A dog is a eutherian mammal because its pups grow inside the mother before birth.
- A eutherian mammal grows inside its mother before it is born.
