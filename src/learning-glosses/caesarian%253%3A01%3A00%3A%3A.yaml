simpleMeaning: To do with birth through the belly.
scope: This sense is also called cesarean, for what is to do with birth through the belly, unlike the
  sense for the birth of a child by a surgeon's cut through the belly wall and womb, from the tale that
  Julius Caesar was born so.
examples:
- The birth was caesarian, through the belly.
- The delivery was caesarian, through the belly.
