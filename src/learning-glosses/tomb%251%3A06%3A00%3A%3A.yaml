simpleMeaning: a place where a dead body is put, especially under the ground and marked by a stone
scope: 'Also called grave: a place where a dead body is put, especially under the ground and marked by
  a stone, not the dead body itself.'
examples:
- They buried him in a tomb under the old church.
- She put flowers on her grandfather's tomb.
