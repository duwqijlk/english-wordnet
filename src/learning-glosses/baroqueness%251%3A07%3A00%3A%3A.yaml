simpleMeaning: In the 1600s in Europe, rich and wide-ranging decoration in art and buildings, with much
  fine detail worked into every part.
scope: Also called baroque, this is the rich, much-detailed decoration of art and buildings in Europe
  in the 1600s.
examples:
- The baroqueness of the hall showed in every carved frame.
- Visitors stared at the baroqueness of the old church.
