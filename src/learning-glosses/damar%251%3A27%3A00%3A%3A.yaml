simpleMeaning: Any of a range of hard tree resins from trees of the Dipterocarpaceae family and of the
  Agathis kind, with a marked focus on the amboyna pine.
scope: This is a hard tree resin from Dipterocarpaceae and Agathis trees, also called dammar, dammar resin,
  and gum dammar, not tree sap in general or a soft gum from other trees.
examples:
- The craftsman used damar to make the varnish shine.
- Damar comes from trees of the Dipterocarpaceae family.
