simpleMeaning: A flat thing that blows up, hidden in an envelope or parcel and set off when opened.
scope: A flat thing that blows up, hidden in an envelope or parcel; letter bomb and parcel bomb are other
  names for this sense, not a bomb left in the open and not a firework.
examples:
- The package bomb went off when the clerk opened the parcel.
- Police found a package bomb in the mail room.
