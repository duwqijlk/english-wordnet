senseId: 'transcortical_aphasia%1:26:00::'
synsetId: 14122346-n
simpleMeaning: A wide term for loss of the power of speech caused by harm to the outer layer of the brain
  outside the two speech areas named for Broca and Wernicke
scope: A wide term for loss of speech from harm outside the two speech areas, not loss of speech from
  harm inside those areas and not loss of voice.
examples:
- Transcortical aphasia followed the injury to his brain.
- The patient had transcortical aphasia after the stroke.
