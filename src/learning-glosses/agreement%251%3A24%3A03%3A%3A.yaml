simpleMeaning: The way a word's form changes to match a related word, as a verb matching its subject in
  number.
scope: A grammar rule about matching word forms; not the act of saying yes, and not a deal that people
  arrange.
examples:
- In Latin, agreement between subject and verb is shown by the ending.
- The teacher marked the sentence wrong because there was no agreement between the pronoun and its noun.
