schema: oewn-learning-gloss-v2
senseId: 'civilise%2:41:00::'
synsetId: 02393545-v
simpleMeaning: to teach a person to notice small differences in taste and in judging quality, so they
  judge what is good with more care
scope: Also called school, train, educate, cultivate and civilize, this is teaching taste and judgment.
  It is not making a group of people live in a more settled, ordered way.
examples:
- Reading good books and hearing fine music helped to civilise his taste.
- She worked to civilise her judgment of art by looking closely at many paintings.
