simpleMeaning: Glands that set calcium levels working too weakly, kidneys not working well, or too little
  vitamin D are found with too little calcium in the blood.
scope: It is the state of too little calcium in the blood, also called hypocalcaemia.
examples:
- Hypocalcemia showed up in her blood test.
- His hypocalcemia went with too little vitamin D.
