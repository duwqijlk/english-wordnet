simpleMeaning: A brown liquid served with food, made from cooked chopped onions and parsley with dry white
  wine or vinegar.
scope: This is a brown sauce made from cooked chopped onions and parsley with dry white wine or vinegar;
  brown onion sauce is another name for this sense, and it is not a white sauce.
examples:
- The cook poured Lyonnaise sauce over the roast meat.
- Lyonnaise sauce gets its taste from onions, parsley and white wine.
