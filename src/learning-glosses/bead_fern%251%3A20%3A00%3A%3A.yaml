simpleMeaning: A beautiful spreading spore-bearing plant from eastern North America and eastern Asia,
  wild in western Europe, with divided leaves that fold slightly when handled and rounded lobes holding
  spore clusters.
scope: A spore-bearing plant with divided leaves and rounded spore lobes, not a flowering plant and not
  a moss.
examples:
- Bead fern spreads along the shaded bank behind the house.
- In autumn the bead fern sheds its spores from rounded lobes.
