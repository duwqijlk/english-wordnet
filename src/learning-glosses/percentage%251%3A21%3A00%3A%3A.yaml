simpleMeaning: the money or property that belongs to one person or group, or is owed to them, or was given
  by them
scope: 'Also called a share, a part, and a portion: what belongs to, is owed to, or was given by one person
  or group, not a rate out of a hundred and not a sum of money in general.'
examples:
- He wanted his percentage in cash.
- Each worker got a fair percentage of the profits.
