simpleMeaning: shaped like a long fine strand, and thin from side to side
scope: 'Also called filamentous, filiform, threadlike and thready: shaped like a long fine strand and
  thin from side to side, not thick and not flat and wide.'
examples:
- The filamentlike roots spread out in the soil.
- A filamentlike strand of the plant hung from the branch.
