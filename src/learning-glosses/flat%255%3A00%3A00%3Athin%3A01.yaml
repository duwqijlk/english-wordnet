simpleMeaning: Pressed thin from side to side along its entire length, as some leaf stalks and certain
  fish are.
scope: Narrow from side to side over the whole length, like a leaf stalk or a flounder, not a level surface
  with no slope, and not something lying stretched out on the ground.
examples:
- The leaf stalks of this plant are flat and ribbon-like.
- A flounder's flat body lies close to the sea floor.
