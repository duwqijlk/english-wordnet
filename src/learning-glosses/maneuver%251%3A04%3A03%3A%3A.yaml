simpleMeaning: a planned movement done with care and skill, with all its parts working together
scope: 'Also called play: a planned, skilled movement. It is not a move made to get away from an opponent,
  and it is not a move by soldiers or ships in a fight.'
examples:
- The driver made a hard maneuver to park the bus in the tight space.
- With one smooth maneuver, the dancer turned and caught her partner.
