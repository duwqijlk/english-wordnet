simpleMeaning: Squash plants that bear hard-shelled fruit shaped a bit like a turban, with a round middle
  part sticking out from the end away from the stem.
scope: This sense is for squash plants bearing hard-shelled fruit shaped somewhat like a turban, unlike
  the sense for a large squash shaped somewhat like a turban, usually with a rounded central portion sticking
  out from the blossom end.
examples:
- Turban squash plants bear hard fruit.
- Turban squash grows in the garden.
