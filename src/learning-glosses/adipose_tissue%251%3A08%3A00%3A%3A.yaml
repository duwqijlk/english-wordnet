simpleMeaning: The body's key organs are padded and kept warm by this body stuff, which holds stored fat
  and gives power when needed.
scope: This is body stuff that holds stored fat and gives power when needed; fat and fatty tissue are
  other names for this sense, not the fat in food.
examples:
- Adipose tissue padded the key organs and kept them warm.
- The body drew power from adipose tissue when it needed it.
