simpleMeaning: a roughly round pot with straight sides that is open at the top
scope: A round pot with straight sides that is open at the top, not the amount that fits in such a pot
  and not the act of carrying a thing in such a pot.
examples:
- He carried the water in a bucket.
- She filled the bucket at the tap.
