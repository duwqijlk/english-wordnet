simpleMeaning: The bones of the foot between the toes and the ankle bones, in people, and the same part
  in birds or in the back feet of four-legged animals.
scope: Of the middle bones of the foot in people, and the same part in birds and in the back feet of four-legged
  animals.
examples:
- The metatarsus bears the weight of the body when we stand.
- A break in the metatarsus kept the runner out for weeks.
