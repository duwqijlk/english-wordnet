simpleMeaning: A gland illness caused by too much ACTH, a body chemical, which makes the adrenal gland
  work too hard; it shows as being very fat.
scope: 'Also called hyperadrenalism: a gland illness caused by too much ACTH, which makes the adrenal
  gland work too hard, not a gland illness from too little ACTH and not simple overeating.'
examples:
- Cushing's disease made the adrenal gland work too hard.
- A person with Cushing's disease grows very fat.
