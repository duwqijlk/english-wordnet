simpleMeaning: Seed rooms sit inside this soft plant part, under a soft outer part; apples, pears, and
  others like them are all this kind
scope: Also called a pome, this is a soft juicy plant part with seed rooms inside, not a true berry and
  not a nut.
examples:
- An apple is a false fruit because its seeds sit in chambers inside the fleshy part.
- A pear counts as a false fruit, with its seeds in chambers and a fleshy outer part.
