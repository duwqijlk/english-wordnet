simpleMeaning: an event in which a thing moves to a new place without turning round
scope: An event in which a thing moves to a new place without turning round, not a chemical change and
  not a shift of feeling onto another thing.
examples:
- The earthquake caused a displacement of the ground by several feet.
- A small displacement of the wheel changed the car's path.
