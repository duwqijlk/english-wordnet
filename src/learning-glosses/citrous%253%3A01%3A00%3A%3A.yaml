simpleMeaning: To do with the Citrus group of plants, or with the fruit they bear.
scope: To do with the plants that bear oranges and lemons and with their fruit, not with other fruit plants
  and not with a single fruit on its own.
examples:
- The citrous groves of Florida produce oranges by the ton.
- Citrous trees need warm sun to bear fruit.
