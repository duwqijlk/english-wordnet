simpleMeaning: To act as if laws, rules, deals, or promises do not matter, and go against them
scope: 'Also called break: to go against a law, rule, deal, or promise, not to fill someone with disgust.'
examples:
- He offended the law when he drove without a licence.
- The firm offended its contract by refusing to pay.
