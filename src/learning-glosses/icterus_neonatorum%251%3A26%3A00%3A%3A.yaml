simpleMeaning: A yellowish look in a newborn baby, which most often goes away on its own.
scope: A yellowish look in a newborn baby that most often goes away on its own; jaundice of the newborn
  and physiological jaundice of the newborn are other names for it, not a lasting yellow colour from liver
  disease.
examples:
- The baby had icterus neonatorum, but it faded within a week.
- Icterus neonatorum is common in newborns and often clears on its own.
