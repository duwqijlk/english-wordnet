senseId: 'hair_seal%1:05:00::'
synsetId: 02082041-n
simpleMeaning: A seal whose ears lack outer flaps, whose coat is stiff and bristly, and whose hind legs
  serve as flippers for swimming.
scope: 'Another name for earless seal and true seal: seals with no outer ear flaps, a stiff coat and hind
  flippers for swimming. Not an eared seal such as a sea lion, which has small ear flaps, nor a walrus,
  which has tusks.'
examples:
- Old whalers called the harbour seal a hair seal to tell it apart from the fur seal.
- The hair seal's stiff coat keeps it warm in icy water.
