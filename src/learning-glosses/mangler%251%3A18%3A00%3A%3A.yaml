simpleMeaning: A person who wrecks a body or a part of it, cutting it badly, spoiling how it looks, or
  leaving it unable to work
scope: Also called maimer and mutilator, this is a person who wrecks a body or a part of it, not someone
  who harms a person by chance and not a surgeon.
examples:
- The mangler left his victims broken and scarred.
- Police hunted the mangler who had crippled the workers.
