simpleMeaning: blood that has come out of burst blood tubes and spread in the flesh near by, making a
  purple or black-and-blue mark on the skin
scope: Blood spread under the skin making a dark mark, not a cut that bleeds and not a red rash.
examples:
- The blow left an ecchymosis on her arm.
- His ecchymosis turned purple by the next day.
