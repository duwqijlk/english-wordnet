simpleMeaning: in a way that works and gives the result that was wanted
scope: 'This says how something is done: it truly works and gives the wanted result; it is not just done
  quickly, and not done in a way that only seems to work.'
examples:
- The new lock effectually kept thieves out of the house.
- Her plan effectually stopped the leak, and no water came through again.
