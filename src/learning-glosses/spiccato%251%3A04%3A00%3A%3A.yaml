simpleMeaning: In music, a way of playing a string instrument so the bow hops lightly off the strings
scope: A way of playing a string instrument in which the bow hops lightly off the strings, also called
  spiccato bowing; not a smooth stroke that stays on the strings, and not plucking the strings.
examples:
- She played the passage in spiccato, letting the bow bounce off the strings.
- The spiccato in the fast part made the notes short and light.
