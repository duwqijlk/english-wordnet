simpleMeaning: The speed of a piece of music, given as the number of beats in one minute
scope: This is the speed of a piece of music, given as the number of beats in one minute; beats per minute,
  bpm and metronome marking are other names for this sense, not the loudness of music and not the beat
  of a heart.
examples:
- The M.M. of the piece was 120 beats a minute.
- Set the M.M. before the band begins to play.
