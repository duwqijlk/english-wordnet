simpleMeaning: a freely moving place where two bones meet and movement is only a turn
scope: This is a freely moving place where two bones meet and movement is only a turn, not a hinge that
  bends one way and not a join that moves in many directions.
examples:
- The rotatory joint in the arm lets the hand turn.
- A rotatory joint moves only by turning, not by bending.
