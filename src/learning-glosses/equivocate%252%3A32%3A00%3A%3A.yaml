simpleMeaning: to speak in a way that is not clear on purpose, so others are led to think what is not
  true or do not get the facts
scope: 'Also called prevaricate, beat around the bush, and palter: speaking in a way that is not clear
  on purpose to hide facts, not speaking unclearly by mistake and not telling a plain lie.'
examples:
- When asked who took the money, he equivocated and gave no clear answer.
- She equivocated for a long time before she would say yes or no.
