simpleMeaning: a friendly, open way of behaving in a person who talks a lot
scope: 'Also called effusiveness: a friendly, open way in a person who talks a lot, not largeness in size
  and not the way a thing spreads or grows.'
examples:
- Her expansiveness made new guests feel welcome, as she talked freely with everyone.
- We liked his expansiveness; he was open and friendly and always ready to talk.
