senseId: 'plagiarize%2:40:00::'
synsetId: 02282906-v
simpleMeaning: to use another person's words or ideas from writing or speech as your own, without naming
  the source; of work or ideas owned by someone (intellectual property)
scope: 'Also called lift: this is using words or ideas without naming the source, not raising something
  up and not taking a thing you can touch.'
examples:
- He plagiarized whole pages from an older book in his essay.
- She was punished for plagiarizing another student's speech.
