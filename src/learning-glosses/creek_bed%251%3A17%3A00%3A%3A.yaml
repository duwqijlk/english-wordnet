simpleMeaning: a long low cut in the ground where a stream runs or once ran
scope: A low cut in the ground where a stream runs or once ran; streambed is another name for this sense,
  and it is not the stream itself and not a dry ditch.
examples:
- The creek bed was dry after weeks without rain.
- We walked along the creek bed looking for smooth stones.
