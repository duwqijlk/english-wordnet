simpleMeaning: In thought, a way of thinking most of all in Europe in the 1900s that holds people wholly
  free and so must answer for what they make of themselves.
scope: In thought, a way of thinking that holds people wholly free, also called existentialism and existential
  philosophy; not a set of church rules and not a way of thinking about nature alone.
examples:
- Existentialist philosophy holds that we make ourselves by our choices.
- She read existentialist philosophy to think about freedom.
