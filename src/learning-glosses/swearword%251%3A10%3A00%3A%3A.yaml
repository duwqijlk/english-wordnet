simpleMeaning: A foul or profane term, usually said when startled or angry.
scope: This sense is also called a curse, an oath, a cuss, swearing, and an expletive, for a foul or profane
  term, usually said when startled or angry, where a curse is a rude or offensive word most often used
  to show surprise or anger, an oath is a rude or dirty word most often said when taken by surprise or
  feeling angry, and a cuss is a rude or dirty word said most often when surprised or angry.
examples:
- He let out a swearword when he hit his thumb.
- The swearword slipped out in her surprise.
