simpleMeaning: a metric unit used to measure length, equal to 1,000 meters or 0.621371 miles
scope: 'Also called kilometer: a unit for measuring length, not a unit for weight, time, or speed.'
examples:
- The town is five kilometres from here.
- She ran ten kilometres every morning.
