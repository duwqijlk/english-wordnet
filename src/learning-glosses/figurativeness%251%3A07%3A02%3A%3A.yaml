schema: oewn-learning-gloss-v2
senseId: 'figurativeness%1:07:02::'
synsetId: 92440979-n
simpleMeaning: the showing of shapes and forms in a work of art
scope: In art, the showing of shapes and forms in a work, not speaking in pictures and not a work with
  no clear shapes.
examples:
- The figurativeness of the painting was clear in its lifelike faces and trees.
- Critics liked the figurativeness of her early work, with its clear shapes of people and houses.
