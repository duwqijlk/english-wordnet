simpleMeaning: It describes something that has or gives out a pleasantly comfortable amount of heat, or
  that can hold that heat in.
scope: This is about physical heat that feels good, not about colors or a friendly manner.
examples:
- The bread was still warm from the oven.
- She put on a warm coat before going outside.
