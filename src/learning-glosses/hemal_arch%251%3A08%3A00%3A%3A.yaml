simpleMeaning: Wrapping round the blood tubes at the tail end, a curved piece of bone grows from the under
  side of a back bone's middle.
scope: Also called a haemal arch, this curved bone grows from the under side of a back bone and wraps
  round the blood tubes at the tail end.
examples:
- We saw a hemal arch curving round the blood tubes near the tail.
- A hemal arch grew from the under side of a back bone.
