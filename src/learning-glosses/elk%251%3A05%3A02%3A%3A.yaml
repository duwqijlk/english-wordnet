simpleMeaning: a large deer from North America, where the male has large antlers with many spreading parts
scope: This is the large North American deer whose male has large antlers with many spreading parts. It
  is not the common deer of Europe and Asia, and not the very large northern deer called a moose in North
  America.
examples:
- A male elk with huge antlers stood in a North American meadow.
- In autumn, male elk show their large branched antlers in North America.
