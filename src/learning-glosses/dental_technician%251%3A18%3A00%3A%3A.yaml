simpleMeaning: a person who makes bridges and sets of false teeth that fit in the mouth
scope: This is a person who makes bridges and false teeth, also called a denturist, and not a dentist,
  who treats teeth rather than making these things.
examples:
- The dental technician made a new bridge for my broken tooth.
- Our dental technician builds dentures that fit well.
