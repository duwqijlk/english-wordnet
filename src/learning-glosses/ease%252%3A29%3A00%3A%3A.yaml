simpleMeaning: to make pain or an unpleasant feeling less strong
scope: This means making pain less strong, also called comfort; it is not about making a worry or fear
  calm, and not the noun for feeling comfortable and free from pain.
examples:
- The warm cloth eased the pain in her back.
- This medicine will ease the pain in your legs.
