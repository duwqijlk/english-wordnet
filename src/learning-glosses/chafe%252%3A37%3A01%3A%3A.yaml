simpleMeaning: to feel anger or irritation in its strongest form
scope: To feel anger or irritation in its strongest form, not to rub skin sore and not to make someone
  else angry.
examples:
- He was chafing at her suggestion that he stay at home.
- She chafed at the long wait for the bus.
