simpleMeaning: The number, types and positions of the hard parts in a person's or animal's mouth.
scope: This covers the whole set in a mouth, by number, type and arrangement, not one tooth alone or the
  cutting parts of a tool such as a saw.
examples:
- The vet counted the puppy's teeth to check that none were missing.
- The dentist studied the child's teeth and noted the gaps between them.
