simpleMeaning: about a young plant or animal that grows without a male cell joining a female cell
scope: 'Also called apogametic and apogamic: about growth without a male cell joining a female cell, not
  growth after such a joining and not growth by seed in the usual way.'
examples:
- Apogamous plants grow new plants without any male cells.
- The apogamous seed grew into a plant on its own.
