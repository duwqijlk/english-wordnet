simpleMeaning: Made by soaking pods in strong drink, or made to taste like the pods, this is a taste put
  into food.
scope: Also called vanilla, this is a taste put into food, made by soaking pods in strong drink, not the
  pods themselves.
examples:
- She put a spoon of vanilla extract into the cake mix.
- The vanilla extract gave the cream a sweet taste.
