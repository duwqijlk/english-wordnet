simpleMeaning: A religious group that looks forward to a time of joy, calm, and fairness when rescue from
  evil comes.
scope: A religious group that looks forward to a time of joy, calm, and fairness when rescue from evil
  comes, not a church with fixed rites and not a political party.
examples:
- The cargo cult waited for a time of joy and fairness.
- Members of the cargo cult looked forward to rescue from evil.
