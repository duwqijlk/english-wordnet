simpleMeaning: The meat from the rear end of a large sea animal with a hard shell, most often from a spiny
  rock kind of that animal
scope: The meat from the rear end of a large sea animal with a hard shell, not meat from its claws and
  not the whole animal.
examples:
- Lobster tail is served with melted butter.
- We ordered lobster tail for dinner.
