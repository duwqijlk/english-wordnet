simpleMeaning: a dull colour that runs from grey to yellow, or a pale green-brown
scope: A dull grey-brown colour, not the colourless dullness or the lifeless dullness of its other senses.
examples:
- She wore a drab coat that matched the grey sky.
- The drab walls of the old house had faded to a dull yellow-brown.
