simpleMeaning: a shrub or small tree from China, grown in mild lands for show for its tidy leaves that
  stay green all year and its sweet-smelling late flowers
scope: A shrub or small tree grown for show in mild lands, not a wild forest tree and not a flower bed
  plant.
examples:
- The xylosma by the gate keeps its tidy leaves all winter.
- Gardeners plant xylosma in mild lands for its late sweet-smelling flowers.
