simpleMeaning: a big tree or bush of the southeastern United States, bare in winter, with huge leaves
  in dense false rings and cream-white flowers tinged purple near the base
scope: 'Also called great-leaved macrophylla and large-leaved cucumber tree: a large tree or bush of the
  southeastern United States, not a cucumber plant and not a tree grown for fruit.'
examples:
- The large-leaved magnolia lost its leaves in winter.
- A large-leaved magnolia grew beside the house with huge leaves.
