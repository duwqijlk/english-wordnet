simpleMeaning: Opening into the blood vessel along the spine, this blood vessel runs beside the artery
  climbing up the neck.
scope: Also called vena vertebralis anterior, this is a blood vessel that runs beside the neck artery
  and opens into the vessel along the spine, not the artery itself.
examples:
- The anterior vertebral vein runs beside the artery that climbs the neck.
- The anterior vertebral vein opens into the vertebral vein.
