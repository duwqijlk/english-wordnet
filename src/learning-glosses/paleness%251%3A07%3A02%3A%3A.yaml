simpleMeaning: too little color in the skin, in a way that is not natural, as from a bruise, sickness,
  or strong upset feelings
scope: 'Also called pallor: too little color in a person''s skin; not the light color of a thing such
  as paper or cloth.'
examples:
- The paleness of her skin showed that she was ill.
- After the bad news, the paleness of his face worried us.
