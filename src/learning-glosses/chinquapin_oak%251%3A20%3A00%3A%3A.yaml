simpleMeaning: A medium-sized woody plant of the eastern United States that loses its leaves in winter
  and gives strong, lasting wood
scope: A medium-sized tree of the eastern United States that loses its leaves in winter and gives strong,
  lasting wood; chinkapin oak is another name for this sense, not the shrubby chestnut tree called chinquapin
  and not other oaks of the east.
examples:
- The chinquapin oak by the road loses its leaves in winter.
- They cut chinquapin oak for its strong, durable wood.
