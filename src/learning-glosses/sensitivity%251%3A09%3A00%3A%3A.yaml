scope: In physiology, the power to feel and answer things acting on the body, not the power to notice
  tiny amounts and not feeling what others feel.
examples:
- Her sensitivity to pain made her pull her hand back from the hot stove.
- Sensitivity lets us feel heat, cold, and touch.
