simpleMeaning: to make something feel less personal, or to treat a person as a thing with no feelings
  of their own
scope: To treat a person as a thing, not to give a real, outer form to a thought or feeling.
examples:
- The advert objectifies women by showing only their bodies.
- He felt the system objectified workers, treating them as numbers, not people.
