simpleMeaning: Soft fruit that people eat grows on these plants, which live one year and trail along the
  ground, one of many kinds in the group Cucurbita.
scope: Squash is another name for these plants, which live one year, trail along the ground, and are grown
  for their soft fruit that people eat, not plants that live on year after year.
examples:
- The squash vine trailed along the ground with soft fruit on it.
- A squash vine climbed over the low fence.
