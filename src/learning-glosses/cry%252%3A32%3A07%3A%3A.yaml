simpleMeaning: To speak words out loud, often from surprise, horror, or joy.
scope: 'Another name for shout: to speak words aloud, often from surprise, horror or joy, not a sudden
  wordless yell and not weeping.'
examples:
- '''Help!'' she cried as the current pulled her away from the shore.'
- '''What a beautiful view!'' he cried, stepping onto the balcony.'
