simpleMeaning: A plant of North America, found in many places, growing on its own, with white to pink
  flowers.
scope: A plant of North America, found in many places, growing on its own, with white to pink flowers,
  with lady's leek and nodding onion as other names for this sense, not a garden onion grown for food
  and not a flower grown for show.
examples:
- The nodding wild onion grows wild across North America.
- White and pink flowers mark the nodding wild onion in spring.
