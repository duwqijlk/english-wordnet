simpleMeaning: Played in belly dancing to the beat of the dance, one of a pair of small metal finger cymbals
  worn on the thumb and middle finger.
scope: One of a pair of small metal cymbals worn on the thumb and middle finger for belly dancing.
examples:
- She slipped a zill onto her thumb before the dance.
- The dancer's zills rang in time with the music.
