simpleMeaning: A closed car with seats at the front and back and two or four doors
scope: This is a closed car with front and rear seats and two or four doors, not a room where drinks are
  served and not a drinking house with rooms open to all.
examples:
- They drove off in a saloon with four doors.
- The saloon had room for five people.
