schema: oewn-learning-gloss-v2
senseId: proactive%5:00:00:active:03
synsetId: 00039507-s
simpleMeaning: 'of a policy, a person, or an action: acting to make things happen and keep control, instead
  of waiting and then answering what happens'
scope: Acting first to shape what happens, not waiting to answer what has happened; not the psychology
  sense of an earlier event acting on a later one.
examples:
- A proactive manager fixes problems before they grow.
- The council took proactive steps to stop flooding.
