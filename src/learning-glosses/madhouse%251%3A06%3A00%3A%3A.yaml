simpleMeaning: rude or unkind words for a hospital where people with a serious illness of the mind are
  looked after
scope: 'Also called sanatorium and nuthouse: rude words for a hospital for people with a serious illness
  of the mind, not just any noisy, wild place.'
examples:
- In the story, they locked him in a madhouse because his mind was ill.
- Calling the hospital a madhouse is a rude and unkind thing to say.
