simpleMeaning: What a person owes the revenue office is set out on this paper, along with what they earned
scope: This is a paper that tells the revenue office what tax is owed; return is another name for this
  sense. Not the tax itself and not money paid back.
examples:
- She filed her income tax return before the April deadline.
- His income tax return showed he had overpaid last year.
