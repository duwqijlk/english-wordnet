simpleMeaning: a thin line on the skin left where the skin was pulled tight, such as on the belly after
  a baby is born
scope: A thin line left by skin pulled tight, not a cut and not a bruise.
examples:
- She noticed a stretch mark on her belly after her baby was born.
- His stretch marks faded over time.
