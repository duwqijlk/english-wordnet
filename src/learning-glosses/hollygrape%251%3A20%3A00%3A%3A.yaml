simpleMeaning: Dark green feathery foliage, bunches of yellow flowers, and dark blue fruit mark this showy
  shrub of the Pacific coast of North America, green all year.
scope: Also called holly-leaves barberry and mountain grape, this is a showy shrub with yellow flowers
  and dark blue fruit, not a holly bush and not a grape vine.
examples:
- Hollygrape grows along the Pacific coast.
- The hollygrape in our yard bore dark blue fruit.
