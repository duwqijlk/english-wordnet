simpleMeaning: To fly a long way, people first fly from a small local airport to a big central one, where
  long flights leave
scope: 'Another name for this sense is hub-and-spoke: a way of flying in which small airports feed planes
  into one big central airport for long flights, not a direct flight between two small airports and not
  a train network.'
examples:
- The hub-and-spoke system means every flight from our town goes through the big airport.
- Airlines like the hub-and-spoke system because it fills the long flights.
