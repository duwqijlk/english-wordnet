simpleMeaning: A way to prevent pregnancy by using a device, such as a cap, a coil, or a sheath, or by
  using drugs or surgery.
scope: Also called contraception; a way to prevent pregnancy by using a device, drugs, or surgery, not
  a way to end a pregnancy and not the choice to have no children.
examples:
- The couple chose a contraceptive method together.
- Her doctor explained each contraceptive method.
