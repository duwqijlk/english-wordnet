simpleMeaning: in a careful, polite way that tries not to upset anyone, and that works to keep good relations
  between people
scope: Doing a thing in a careful, polite way that does not upset people; not diplomacy, the work of keeping
  good relations between countries, and not a diplomat, a person whose job is that work.
examples:
- She answered diplomatically when she was asked about the failed plan.
- He diplomatically changed the subject before the argument grew.
