simpleMeaning: A plant of Texas that lives for one year, with leaves cut deeply into narrow parts; grown
  for its bright yellow flower heads that spread from the middle.
scope: A one-year Texas plant grown for its yellow flower heads, also called Texas star; not a garden
  daisy and not a wild sunflower.
examples:
- Lindheimera texana grows in the open fields of Texas.
- Gardeners grow Lindheimera texana for its bright yellow flower heads.
