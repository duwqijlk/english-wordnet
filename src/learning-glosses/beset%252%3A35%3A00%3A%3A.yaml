simpleMeaning: to decorate or cover something in a rich way, as with gems (bright, costly stones)
scope: 'Also called encrust: to decorate or cover something in a rich way, as with gems. Not the sense
  of annoying a person again and again over a long time.'
examples:
- The crown was beset with bright jewels.
- Her dress was beset with small gems.
