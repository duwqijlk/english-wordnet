simpleMeaning: a bush or small tree with leaves made of small leaflets set along a stem, poisonous to
  farm animals, and thick bunches of sweet-smelling blue flowers and red seeds
scope: A bush or small tree with sweet-smelling blue flowers and red seeds, also called coral bean, frijolillo,
  and frijolito; not a bean plant grown for food and not a garden shrub.
examples:
- The mescal bean by the fence was covered in blue flowers.
- Farmers keep cattle away from mescal bean because its leaves are poisonous.
