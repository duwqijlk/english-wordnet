simpleMeaning: A stiff, much-branched plant of the Mediterranean that lives for years, with very white
  woolly stems and leaves.
scope: This stiff, much-branched plant of the Mediterranean keeps its very white woolly stems and leaves
  for years; dusty miller and Cineraria maritima are other names for this sense.
examples:
- Senecio cineraria lines the dry garden bed with its white woolly leaves.
- The stiff stems of Senecio cineraria stood up through the hot summer.
