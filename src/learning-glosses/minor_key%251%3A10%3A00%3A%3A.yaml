senseId: 'minor_key%1:10:00::'
synsetId: 06877358-n
simpleMeaning: A set of notes in music built on a scale whose third note is lower than in a major scale
scope: A set of notes in music built on a scale whose third note is lower than in a major scale; minor
  mode is another name for this sense, and not a major key or a single note.
examples:
- The song is written in a minor key, which gives it a sad sound.
- He played the piece in a minor key.
