simpleMeaning: Going from one thing to another in sudden, uneven steps, with no smooth flow in between
scope: Writing or talk that jumps in sudden, uneven steps, and jerky is another name for this sense, not
  smooth, steady writing that moves along step by step.
examples:
- His choppy prose jumped from one idea to the next without any link.
- Her choppy account of the trip left out half the story.
