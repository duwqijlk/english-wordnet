simpleMeaning: Said of a count, or of the king-like rights that belong to a count
scope: Said of a count and his king-like rights, not of the bones at the back of the roof of the mouth
  and not of a lord who ruled a palatinate in the Middle Ages.
examples:
- The palatine rights of the count were set out in the charter.
- A palatine court heard the case in the count's hall.
