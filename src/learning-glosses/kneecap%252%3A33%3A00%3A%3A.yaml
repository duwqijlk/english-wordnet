simpleMeaning: to shoot a person in the front part of the knee, often done by terrorist groups as a warning
scope: This is the verb sense about shooting a person in the knee as a warning; it is not the noun sense
  for the small bone at the front of the knee.
examples:
- They kneecapped the man as a warning to others.
- The group kneecapped two men and left them in the street.
