simpleMeaning: Money paid out each month to a person who has stopped working for good.
scope: This is money paid out each month to a person who has stopped work, not money put by while still
  working; it is also called retirement benefit, retirement check, and retirement pension.
examples:
- His retirement fund is paid into his bank each month.
- Her retirement fund covers her weekly shopping.
