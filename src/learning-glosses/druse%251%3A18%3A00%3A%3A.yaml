simpleMeaning: A follower of a secret faith that holds one God, living in the safety of the mountains
  of Syria and Lebanon, who holds that Al-hakim was God made flesh.
scope: A follower of a secret faith that holds one God, also called a Druze; not a Muslim and not a Christian.
examples:
- A Druse elder welcomed us to the mountain village.
- Many Druse families have lived in the mountains of Lebanon for centuries.
