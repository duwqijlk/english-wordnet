simpleMeaning: one of two upright posts, usually joined by a bar across the top, that are put at each
  end of a sports field to mark where points are scored
scope: One of the two posts at an end of a sports field, usually with a bar across the top; not the ball
  and not the whole area where points are scored.
examples:
- The ball hit the goalpost and bounced away.
- He kicked the ball straight between the goalposts.
