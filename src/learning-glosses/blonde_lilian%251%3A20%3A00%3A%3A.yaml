simpleMeaning: Single white flowers with yellow centers and blue or pink outsides grow on this North American
  dogtooth
scope: This North American dogtooth is also called a white dog's-tooth violet and a white dogtooth violet,
  and it bears single white flowers with yellow centers and blue or pink outsides.
examples:
- The blonde lilian had a single white flower with a yellow center.
- Some blonde lilian flowers have blue outsides, and some have pink outsides.
