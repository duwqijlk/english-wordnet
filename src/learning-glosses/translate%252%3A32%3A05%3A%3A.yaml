simpleMeaning: To work out the order of the small parts of a protein, a building block of the body, while
  it is being made, from a message in the cell
scope: Working out the order of a protein's small parts as it is made, not turning words from one language
  into another, and not changing one thing into a different form.
examples:
- The cell translates the message to build the protein.
- During growth, the cell translates the code into a new protein.
