simpleMeaning: a mark you can see, like a footstep, left by a person, animal, or vehicle that passed by
scope: A mark left by a person, animal, or vehicle that passed by, not a strap that joins a horse to a
  cart and not the act of following someone.
examples:
- We saw the traces of deer in the soft mud.
- The trace of a cart wheel ran across the field.
