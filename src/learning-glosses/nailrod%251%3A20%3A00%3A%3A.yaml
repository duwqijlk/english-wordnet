simpleMeaning: A tall marsh plant of North America, Europe, Asia and North Africa, with long flat leaves
  for mats and chair seats; cylindrical seed heads split when ripe, shedding much down.
scope: Another name for the tall marsh plant also called reed mace, reedmace, bulrush and cat's-tail;
  not the bur-reed, whose seed heads are prickly balls.
examples:
- Nailrod choked the shallow ditch behind the barn.
- Crafters once cut nailrod leaves to weave mats and chair seats.
