simpleMeaning: a large drum shaped like half a ball, made of brass or copper, with a top skin that can
  be made tighter or looser to change its sound
scope: A large drum used in music, not a metal pot for boiling water and not a hollow in the ground left
  by melted ice.
examples:
- He played the kettle drum at the back of the orchestra.
- The large kettle drum stood beside the other drums on the stage.
