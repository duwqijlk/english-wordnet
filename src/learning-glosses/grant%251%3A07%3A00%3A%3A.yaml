simpleMeaning: A right or special advantage that someone has been allowed to have.
scope: A right or advantage given to someone, not the contract to run a business under another firm and
  not a sum of money given as aid.
examples:
- The charter was a grant of fishing rights to the village.
- The old grant allowed the mill to draw water from the river.
