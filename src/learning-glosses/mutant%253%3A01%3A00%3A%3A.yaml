senseId: 'mutant%3:01:00::'
synsetId: 02998922-a
simpleMeaning: likely to change in the small parts inside a living thing that control how it grows, or
  caused by such a change
scope: Describes a living thing or a part of it that may change in this inner way, or that comes from
  such a change; not the noun sense, the living thing itself that has new features after such a change.
examples:
- The scientists studied a mutant gene that changed the colour of the flies.
- They found a mutant form of the plant that could live with very little water.
