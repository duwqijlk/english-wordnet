simpleMeaning: a very small fish from Europe, living in fresh water, common in streams with small stones
  on the bed
scope: This is the very small European fish that lives in streams with small stones. Not just any small
  fish used in a loose way.
examples:
- A minnow swam between the stones in the shallow stream.
- In a stream in Europe, a minnow swam over the small stones on the bed.
