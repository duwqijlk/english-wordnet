simpleMeaning: all the planes and other aircraft of a country's armed forces, seen as one whole
scope: This means all the aircraft of a country's armed forces, taken together. It is not about flying
  in general or about the work of making and running aircraft.
examples:
- By 1940, the nation's aviation included hundreds of war planes.
- He wrote a history of British aviation, listing every military aircraft the country had.
