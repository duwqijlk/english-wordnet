simpleMeaning: The front and side walls of the belly hollow are made by a flat muscle with fibres that
  run across.
scope: Transverse muscle of abdomen, transversus abdominis and transversus abdominis muscle are other
  names for this flat muscle of the belly walls.
examples:
- The musculus transversalis abdominis forms the front wall of the belly hollow.
- The musculus transversalis abdominis has fibres that run across.
