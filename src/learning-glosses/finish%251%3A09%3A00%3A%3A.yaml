simpleMeaning: In wine tasting, how a wine tastes at the back of your tongue as you swallow it.
scope: Only the taste left in the mouth as wine is swallowed; not the texture or look of a surface, not
  the time when something ends, not a state of flawless quality, not the place where a race or journey
  ends, not the fixed event that closes a competition, not a person's downfall, not any other event that
  ends something, not the act of completing something, and not any verb use (ending something, finally
  doing something, coming to an end, coating a surface, eating all the food, or ending a relationship).
examples:
- The wine has a nutty flavor and a pleasant finish.
- A long, dry finish lingered after we swallowed the last of the red.
