simpleMeaning: Pulling the shoulder blade toward the spine and a little upward is the work of a diamond-shaped
  muscle.
scope: Musculus rhomboideus minor and rhomboid minor muscle are other names for a diamond-shaped muscle
  that pulls the shoulder blade toward the spine and a little upward.
examples:
- The doctor pointed to the lesser rhomboid muscle on the chart.
- The lesser rhomboid muscle was named in the anatomy lesson.
