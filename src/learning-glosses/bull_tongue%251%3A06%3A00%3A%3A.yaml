simpleMeaning: A heavy farm tool for turning soil, with one wide blade, used mostly in fields where cotton
  grows
scope: A heavy farm tool with one wide blade, used mostly in cotton fields; not a light hand tool and
  not a machine for sowing seed.
examples:
- The farmer hitched the bull tongue to the mule.
- He used a bull tongue to break the hard ground in the cotton field.
