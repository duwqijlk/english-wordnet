simpleMeaning: illnesses from a virus that cause sore spots on the skin or on a mucous membrane (the wet
  inner lining of the mouth, nose and other body parts)
scope: These are the illnesses themselves, not the viruses themselves; the viruses are the very small
  things that cause these illnesses.
examples:
- The doctor said the sore spots on his lip were caused by herpes.
- Herpes can come back again in the same place on the skin.
