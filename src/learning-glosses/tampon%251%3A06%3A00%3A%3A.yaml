simpleMeaning: A plug of cotton or other material that takes in liquid, put into a wound or a space in
  the body to take in fluids that come out, especially blood
scope: This is the plug itself, not the act of putting such a plug in.
examples:
- She used a tampon to absorb the blood during her period.
- The doctor placed a small tampon in the wound to soak up the fluid.
