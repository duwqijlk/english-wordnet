simpleMeaning: the fatty flesh of a fish, pink in colour, from the Pacific coast and its rivers, eaten
  as food
scope: 'Also called sockeye and sockeye salmon: the flesh of the fish eaten as food, not the live fish
  itself and not flesh from Atlantic salmon.'
examples:
- She grilled red salmon with lemon for dinner.
- The red salmon in the shop came from a Pacific river.
