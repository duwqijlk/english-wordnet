simpleMeaning: Back legs built for leaps, long soft pale fur, and burrows dug in the deserts of the Old
  World mark this small animal.
scope: Also called gerbil, this small desert animal of the Old World digs burrows.
examples:
- The gerbille dug its burrow.
- A gerbille leapt away on its long back legs.
