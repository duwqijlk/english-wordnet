simpleMeaning: To keep bothering someone with fault-finding remarks that never let up.
scope: 'Also called a ride, a rag, a tease, a rally, a cod, a bait, a taunt, a tantalize, a twit, or a
  tantalise: to keep bothering someone with fault-finding remarks that never let up, not a loud sound
  made to show dislike or scorn for something.'
examples:
- Fellow workers razzed the new teacher when they wore a jacket and tie.
- The older boys razzed the new student about their haircut every day.
