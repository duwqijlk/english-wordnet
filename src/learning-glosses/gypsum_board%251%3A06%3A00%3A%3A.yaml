simpleMeaning: a flat board with a gypsum plaster centre stuck between sheets of paper or fibreboard,
  used in place of plaster or wallboard to make inside walls
scope: Also called plasterboard; a board with a hard centre used for inside walls, not a board of solid
  wood.
examples:
- Gypsum board lines the inside walls of the new house.
- The builders fixed gypsum board to the frame instead of wet plaster.
