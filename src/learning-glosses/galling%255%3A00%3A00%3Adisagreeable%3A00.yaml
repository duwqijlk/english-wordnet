senseId: galling%5:00:00:disagreeable:00
synsetId: 00090253-s
simpleMeaning: making people feel annoyed and a little angry
scope: This means making people feel annoyed, also called annoying, teasing, irritating, pestering, vexing,
  pesky, bothersome, nettlesome, plaguey, or vexatious; it is not about hurting the body or rubbing skin
  sore.
examples:
- It was galling to have to ask again for what was already mine.
- The long wait at the desk was galling for everyone in line.
