simpleMeaning: A person who decides the final content of a text, especially in a newspaper or magazine,
  and is in charge of getting it published
scope: This is the person who decides the final content of a text, especially a newspaper or magazine,
  not a computer program for changing data.
examples:
- The editor of the newspaper chose which stories to print.
- She works as an editor for a small magazine.
