simpleMeaning: In physiology, the power to feel things, and to answer what acts on the body from outside.
scope: In physiology, the power to feel things and to answer what acts on the body from outside, also
  called sensitivity or sensibility, not the power to notice small physical amounts or differences, not
  a readiness to answer changes in feeling between people, and not a feeling for one's own feelings and
  the feelings of others.
examples:
- Her sensitiveness to pain was high after the injury.
- The sensitiveness of his skin made the touch hurt.
