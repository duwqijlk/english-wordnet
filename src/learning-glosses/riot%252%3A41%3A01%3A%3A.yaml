simpleMeaning: to take part in loud, wild fun, drinking a lot of alcohol
scope: To have loud, wild fun while drinking a lot; not to take part in violent trouble in public, and
  not the wild party itself as a thing.
examples:
- The students rioted in the bar, singing loudly and drinking beer until late.
- He spent the evening rioting with old friends, drinking and making a lot of noise.
