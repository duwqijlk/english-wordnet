simpleMeaning: A fine tree with one trunk or a branching trunk, each with end bunches of long, narrow
  leaves and sprays of sweet white, yellow, or red flowers, from New Zealand.
scope: This sense is also called grass tree, for a fine tree with end bunches of long, narrow leaves,
  unlike the sense for an Australian palm with leaf buds that are edible when young.
examples:
- Cabbage tree has white flowers.
- Cabbage tree grows in New Zealand.
