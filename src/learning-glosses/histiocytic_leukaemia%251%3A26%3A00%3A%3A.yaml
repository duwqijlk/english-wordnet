simpleMeaning: A blood cancer in which monocytes, a kind of white blood cell, and their young forms grow
  in number in the blood.
scope: A blood cancer with too many monocytes and their young forms, not a blood cancer of other white
  cells; also called histiocytic leukemia, monoblastic leukaemia, monoblastic leukemia, monocytic leukaemia,
  and monocytic leukemia.
examples:
- The blood test showed histiocytic leukaemia.
- Histiocytic leukaemia brings too many monocytes into the blood.
