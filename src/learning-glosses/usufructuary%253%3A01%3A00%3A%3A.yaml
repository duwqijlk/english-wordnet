senseId: 'usufructuary%3:01:00::'
synsetId: 02832525-a
simpleMeaning: having to do with the right to use and enjoy property that belongs to someone else
scope: Having to do with the right to use and enjoy another's property, not having to do with owning it
  and not having to do with renting it.
examples:
- They signed a usufructuary agreement over the land.
- Her usufructuary rights ended when she moved away.
