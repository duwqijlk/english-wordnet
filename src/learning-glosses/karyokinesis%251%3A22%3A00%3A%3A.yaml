senseId: 'karyokinesis%1:22:00::'
synsetId: 13525942-n
simpleMeaning: A living process in which a cell's nucleus (its centre, holding its instructions) splits
  during mitosis or meiosis, the two ways a cell divides
scope: This is the splitting of a cell's nucleus, not the splitting of the whole cell and not the making
  of new cells themselves.
examples:
- Karyokinesis is the splitting of the cell's nucleus.
- During karyokinesis the nucleus divides.
