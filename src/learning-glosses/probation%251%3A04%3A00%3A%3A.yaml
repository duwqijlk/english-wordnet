simpleMeaning: 'In law, a way to deal with a person found guilty without prison: the court lets him go
  free, but he must follow the rules the court sets'
scope: In law, this is freedom after a guilty finding under court rules, not a trial period at a new job
  or in a group.
examples:
- The judge gave him probation instead of sending him to prison.
- She is on probation and must report to the court each month.
