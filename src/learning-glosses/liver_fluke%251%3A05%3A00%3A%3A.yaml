simpleMeaning: A flat worm that lives as a pest inside the organ that cleans the blood and the tubes that
  carry bile, in animals kept by people and in people.
scope: A flat worm that lives inside animals, not a round worm and not a worm that lives only in the gut.
examples:
- The liver fluke lives in the bile ducts of sheep.
- Liver flukes can harm the livers of cattle and people.
