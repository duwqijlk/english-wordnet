simpleMeaning: An operation that cuts away spare flesh in the mouth and throat to open the airway, meant
  to cure very bad snoring, with or without pauses in breathing in sleep.
scope: Also called palatopharyngoplasty, uvulopalatopharyngoplasty and UPPP; an operation that cuts away
  spare flesh in the mouth and throat to open the airway and cure very bad snoring.
examples:
- The surgeon suggested PPP for his severe snoring.
- After PPP, her snoring stopped almost completely.
