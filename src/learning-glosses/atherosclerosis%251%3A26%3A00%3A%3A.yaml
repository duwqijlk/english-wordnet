simpleMeaning: A stage of the hardening of the arteries in which fatty lumps form inside the artery walls,
  making the arteries narrower.
scope: A stage of hardening arteries with fatty lumps inside their walls, also called coronary artery
  disease.
examples:
- Atherosclerosis narrowed the arteries to his heart.
- The doctor warned him about atherosclerosis after the check-up.
