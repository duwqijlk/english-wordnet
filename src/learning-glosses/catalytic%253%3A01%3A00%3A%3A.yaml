synsetId: 03065814-a
simpleMeaning: Connected with making a chemical change happen faster by using a substance that is not
  used up in the change
scope: This is about making a chemical change go faster with a substance that is not used up in it. Not
  about slowing a change down, and not about a change with no such help.
examples:
- The catalytic material made the chemical change go much faster.
- Catalytic action helped turn the gas into a safer one.
