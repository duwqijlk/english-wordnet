simpleMeaning: to put small hard points on the bottom of a shoe so it does not slip
scope: This verb means putting gripping points on a shoe. Not the points themselves, not a fastener for
  a rope, and not tying a rope to one.
examples:
- They cleated the football shoes so the players would not slip.
- He cleats his boots before walking on ice.
