simpleMeaning: to put thoughts, ideas, or events in time in order
scope: To put thoughts, ideas, or events in time in order, not to put things in a way that looks good
  and not to plan something so it will happen.
examples:
- She arranged her thoughts before she spoke.
- He arranged the events of his life in order in his diary.
