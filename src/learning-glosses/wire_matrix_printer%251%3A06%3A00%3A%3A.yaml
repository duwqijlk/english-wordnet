simpleMeaning: A machine that makes marks on paper by striking, forming each letter from a set of small
  dots made by thin metal pins or pointed tools
scope: 'Also called wire printer and stylus printer: a machine that forms letters from dots, not a machine
  that sprays ink and not a machine that uses a laser.'
examples:
- The office wire matrix printer rattles as it works.
- Our old wire matrix printer still makes letters from dots.
