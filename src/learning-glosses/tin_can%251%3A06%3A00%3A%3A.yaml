simpleMeaning: a metal box sealed tight so air cannot get in, for food, drink, paint, or other things
scope: A metal box sealed tight against air, for food, drink or paint; can and tin are other names for
  this sense. Not an open metal box, and not a glass jar.
examples:
- She opened a tin can of beans for supper.
- The paint came in a tin can with a tight lid.
