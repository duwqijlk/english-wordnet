simpleMeaning: a curve of the spine that is not normal and bends backwards more than it should
scope: 'Also called humpback and kyphosis: this is the bent shape of the spine itself, not a person whose
  back is bent in this way.'
examples:
- The doctor said the hunchback was caused by a curve in her spine.
- A hunchback can make the upper back look round and high.
