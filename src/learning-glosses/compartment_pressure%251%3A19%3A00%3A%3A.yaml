simpleMeaning: the push of the air kept at a set level inside a sealed space, as in a plane
scope: The push of air kept steady inside a sealed space, as in a plane, not the push of air outside and
  not a leak.
examples:
- The compartment pressure stayed steady during the flight.
- A fault cut the compartment pressure in the cabin.
