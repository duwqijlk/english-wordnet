simpleMeaning: a bad person in a story who has special powers that normal people do not have
scope: A bad person with special powers in a story or film; not a good person with powers who helps people,
  and not a real bad person with no special powers.
examples:
- In the film, a supervillain with the power to control fire threatened the whole city.
- The hero finally stopped the supervillain who could fly and lift cars.
