senseId: 'contrast%1:07:00::'
synsetId: 05133627-n
simpleMeaning: how much light and dark parts differ, on a photo print or on the clear film the print is
  made from (the negative), or on a TV screen
scope: This is about how light and dark parts differ in a photo or on a TV screen, not the act of comparing
  things and not putting things side by side to show a difference.
examples:
- The photo has strong contrast, with very dark shadows and bright white areas.
- Low contrast made the TV picture look flat and grey.
