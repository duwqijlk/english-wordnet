simpleMeaning: A big tree of the Pacific coast that loses its leaves each year and has deeply cut leaves
  with bristle tips.
scope: This is a big tree of the Pacific coast that sheds its leaves each year and has deeply cut bristle-tipped
  leaves; Quercus kelloggii is another name for it, not other trees of the Pacific coast that keep their
  leaves all year.
examples:
- California black oak shaded the whole hillside.
- The California black oak dropped its deeply cut leaves in fall.
