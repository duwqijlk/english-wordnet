simpleMeaning: A thing put into hot metal that has melted, which joins with the unwanted parts in the
  metal so they can then be taken out easily
scope: This is a thing used when working with melted metal, not liquid coming out of the body, not lines
  of force around a magnet, and not a state of not knowing what to do.
examples:
- The worker added flux to the melted iron before pouring it.
- A little flux helped the unwanted parts rise so they could be taken away.
