simpleMeaning: 'Low-growing European weed, common in the southwestern United States and Mexico: reddish
  sprawling stems, fern-like leaves, small reddish-lavender flowers and upright slender fruits; often
  grown to feed animals.'
scope: This is the low weed grown as forage, not the similar musk clover and not a garden geranium.
examples:
- Alfilaria was growing thick along the edge of the field.
- The sheep grazed the alfilaria that came up after the rain.
