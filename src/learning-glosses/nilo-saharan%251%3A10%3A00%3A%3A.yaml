simpleMeaning: A family of East African tongues spoken by Nile peoples from the Sahara south to Kenya
  and Tanzania
scope: 'Also called Nilo-Saharan language: this names a whole group of related tongues of East Africa,
  not one tongue on its own.'
examples:
- Nilo-Saharan tongues are spoken from the Sahara to Kenya.
- The Nilo-Saharan family covers many East African tongues.
