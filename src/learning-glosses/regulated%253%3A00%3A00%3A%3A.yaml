simpleMeaning: Kept in order by rules, laws, or set ideas about how things should be done
scope: Kept in order by rules, laws, or set ideas about how things should be done; not left to run wild,
  and not stopped altogether.
examples:
- The regulated trade in medicine keeps bad drugs off the market.
- The bank works under regulated rules that limit what it can lend.
