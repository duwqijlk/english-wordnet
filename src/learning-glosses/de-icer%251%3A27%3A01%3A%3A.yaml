simpleMeaning: a substance that melts frozen water, in the form of a liquid or hard bits
scope: A substance that melts frozen water, also called ice melt and ice melter, not a tool that scrapes
  frozen water off and not a substance that keeps water from freezing.
examples:
- She spread de-icer on the frozen steps before the guests arrived.
- The de-icer came as a liquid that she poured over the windscreen.
