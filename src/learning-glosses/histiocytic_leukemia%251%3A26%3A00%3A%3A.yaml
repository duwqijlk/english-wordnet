senseId: 'histiocytic_leukemia%1:26:00::'
synsetId: 14268208-n
simpleMeaning: A blood cancer in which monocytes, a kind of white blood cell, and their young forms grow
  in number in the blood.
scope: A blood cancer with too many monocytes and their young forms, not a blood cancer of other white
  cells; also called histiocytic leukaemia, monoblastic leukaemia, monoblastic leukemia, monocytic leukaemia,
  and monocytic leukemia.
examples:
- The doctor found histiocytic leukemia in the blood test.
- Histiocytic leukemia brings too many monocytes into the blood.
