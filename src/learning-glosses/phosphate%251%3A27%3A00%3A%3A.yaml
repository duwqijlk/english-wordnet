simpleMeaning: a salt made from phosphoric acid, an acid that is made in part from the element phosphorus
scope: This is a chemical salt made from phosphoric acid, not the sweet fizzy drink that has a little
  of that acid in it.
examples:
- The lab made a phosphate by joining phosphoric acid with a base.
- This white powder is a phosphate, a salt of phosphoric acid.
