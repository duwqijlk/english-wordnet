simpleMeaning: A form of the peach plant whose fruit has smooth skin and usually yellow flesh.
scope: A peach plant with smooth-skinned fruit, also called nectarine; not the common peach with fuzzy
  skin and not a plum tree.
examples:
- The nectarine tree in our garden bears smooth fruit every summer.
- He planted a nectarine tree beside the old peach tree.
