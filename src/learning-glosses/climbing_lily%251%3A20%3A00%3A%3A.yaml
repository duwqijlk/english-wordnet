simpleMeaning: A long-lived herb from tropical Africa and Asia that winds upward by tendrils at its leaf
  tips, bears showy yellow, red or purple flowers, and is entirely poisonous.
scope: This is the whole poisonous twining plant with showy flowers, not just its bloom or the tendrils
  it grips with.
examples:
- The climbing lily scrambles over the fence on curling leaf tendrils.
- Every part of the climbing lily is toxic, so keep it away from children.
