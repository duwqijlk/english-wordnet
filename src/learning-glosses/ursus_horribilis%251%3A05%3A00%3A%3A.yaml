simpleMeaning: The uplands of western North America are home to a powerful bear of a brownish-yellow color.
scope: Also called grizzly, grizzly bear, silver-tip, silvertip and Ursus arctos horribilis, this is the
  strong brownish-yellow bear of the high lands of western North America, not a black bear and not a bear
  of the far north.
examples:
- We saw an Ursus horribilis fishing in the river.
- The Ursus horribilis stood on its hind legs in the high country.
