simpleMeaning: swollen in a way that is not normal, especially because of liquid or gas inside
scope: 'Also called swollen, puffy, bloated, distended, tumescent and tumid: this is a body part grown
  too big in a way that is not healthy, not just a little larger than usual.'
examples:
- His turgid stomach showed that he was very ill.
- The child's turgid belly was swollen with gas.
