simpleMeaning: to feel warm and deeply happy inside, as when you are healthy or moved by strong feeling
scope: To feel warm and deeply happy inside, also called glow, shine, or beam; not to have a bright face
  and not to send out rays.
examples:
- Her face radiated with happiness.
- She radiated with joy after the good news.
