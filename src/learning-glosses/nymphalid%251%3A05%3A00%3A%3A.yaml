simpleMeaning: One of a worldwide family of medium-to-large butterflies, generally marked by vivid wings
  and a shrunken, useless pair of front legs held folded on the chest.
scope: Another name for the same medium-to-large butterfly group also called nymphalid butterfly, brush-footed
  butterfly or four-footed butterfly, not a moth or a skipper.
examples:
- The monarch is a well-known nymphalid.
- Nymphalids usually rest with their reduced front legs folded against the body.
