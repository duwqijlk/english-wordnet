simpleMeaning: A group of four lines in a poem, with five beats in each line, where the first and third
  lines rhyme and the second and fourth lines rhyme
scope: A four-line verse group with this beat and rhyme pattern, not a pair of lines and not a free-form
  verse group.
examples:
- The elegiac stanza has four lines, with five beats in each line.
- She wrote the poem in an elegiac stanza, with the first and third lines rhyming and the second and fourth
  lines rhyming.
