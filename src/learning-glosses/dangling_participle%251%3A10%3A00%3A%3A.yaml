senseId: 'dangling_participle%1:10:00::'
synsetId: 06335079-n
simpleMeaning: 'A verb form, often at the start of a sentence, that seems to go with a word other than
  the one meant: ''flying across the country''.'
scope: This is a verb form that seems to go with the wrong word, not a verb form that clearly goes with
  its word or a misplaced word of another kind.
examples:
- '''Flying across the country, the Rockies came into view'' has a dangling participle.'
- The teacher marked the dangling participle in my sentence.
