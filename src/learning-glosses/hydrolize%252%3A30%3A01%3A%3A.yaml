simpleMeaning: To make a chemical split into smaller parts by letting it react with water
scope: To make a chemical react with water and break down, also called hydrolise; not the chemical breaking
  down on its own and not a thing simply getting wet.
examples:
- The chemist will hydrolize the compound in the lab.
- Heat helps to hydrolize the sample in water.
