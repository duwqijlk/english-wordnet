simpleMeaning: a herb that stays close to the ground across Europe and Asia, bearing narrow leaves and
  green flowers too small to catch the eye
scope: Also called knawe, it grows low in many parts of Europe and Asia, and its green flowers are small
  and hard to notice.
examples:
- The knawel spread low over the dry ground, its narrow leaves barely showing.
- Its green flowers are so small that the knawel is easy to walk past.
