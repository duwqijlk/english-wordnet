simpleMeaning: Sweet green flesh inside a thin skin marked like a fine mesh fills the fruit of this climbing
  plant.
scope: Also called net melon and netted melon, this is the vine that bears the fruit, not the fruit itself.
examples:
- The nutmeg melon vine bore sweet fruit.
- The nutmeg melon's thin skin was marked like a fine mesh.
