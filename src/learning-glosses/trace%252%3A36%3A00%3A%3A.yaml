simpleMeaning: to make a copy of a picture by putting a clear sheet over it and drawing on the sheet along
  the lines you can see through it
scope: To copy a drawing by drawing over its lines on a clear sheet, not to follow a person and not to
  find signs of a thing.
examples:
- She traced the flower pattern onto thin paper.
- The child traced the map through a clear sheet.
