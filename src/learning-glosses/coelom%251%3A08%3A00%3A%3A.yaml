simpleMeaning: A hollow space in an unborn babe's middle skin, which in folk becomes hollows of the chest,
  the heart, and the belly.
scope: This sense is also called celom and celoma, a hollow space in an unborn babe's middle skin, which
  in folk becomes hollows of the chest, the heart, and the belly.
examples:
- Coeloms become hollows of the chest.
- The coelom forms in the embryo.
