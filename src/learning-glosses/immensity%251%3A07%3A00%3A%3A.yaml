synsetId: 05111848-n
simpleMeaning: being very big in size, in how far it spreads, or in number, more than is usual
scope: The quality of being very large in size, spread or number, also called greatness, vastness, grandness
  and wideness; not just being big in a normal way.
examples:
- The immensity of the desert surprised us as we crossed it.
- The immensity of the ocean made the small ship look even smaller.
