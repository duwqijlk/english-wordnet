simpleMeaning: a person who stands at the front of the push for fair chances for people in groups with
  less power
scope: This is a person who stands at the front of the push for fair chances for people in groups with
  less power; civil rights activist and civil rights leader are other names for this sense, not a person
  who only backs the push.
examples:
- The civil rights worker led the drive to open the lunch counters to all.
- She joined the march as a civil rights worker and helped plan the route.
