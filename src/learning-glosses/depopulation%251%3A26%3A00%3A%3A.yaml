senseId: 'depopulation%1:26:00::'
synsetId: 14542810-n
simpleMeaning: The state of a place with fewer people living in it than before, or with no people living
  in it at all.
scope: Of a town, a valley, or a whole land losing its people.
examples:
- The depopulation of the valley left whole villages empty.
- Depopulation has left the old mining town with few people.
