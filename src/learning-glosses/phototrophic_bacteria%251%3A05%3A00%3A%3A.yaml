simpleMeaning: green and purple tiny living things that get their energy to grow from sunlight and take
  their carbon from carbon dioxide or from carbon in living matter
scope: Also called phototropic bacteria; tiny living things that grow on sunlight, not bacteria that feed
  on chemicals in the dark.
examples:
- Phototrophic bacteria in the pond use sunlight to grow.
- The green film on the rock is made of phototrophic bacteria.
