simpleMeaning: a chemical compound formed when one or more other compounds react and lose water
scope: A chemical compound formed when other compounds react and lose water, not a compound that takes
  in water and not a plain mix of compounds.
examples:
- The chemist made the anhydride by driving water out of the acid.
- An anhydride forms when two compounds lose water as they join.
