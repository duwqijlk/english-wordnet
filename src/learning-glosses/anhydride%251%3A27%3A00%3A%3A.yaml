simpleMeaning: a chemical stuff made when one or more other chemical stuffs join and lose water in the
  change
scope: A chemical stuff made when other stuffs join and lose water, not a stuff that takes in water and
  not a plain mix of stuffs.
examples:
- The chemist made the anhydride by driving water out of the acid.
- An anhydride forms when two compounds lose water as they join.
