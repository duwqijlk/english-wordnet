senseId: 'copula%1:10:00::'
synsetId: 06484495-n
simpleMeaning: A verb like 'be' or 'become' that joins the subject of a sentence to the words that describe
  it.
scope: A verb that joins a subject to what follows it, also called a copulative or a linking verb.
examples:
- The copula in 'She is happy' joins 'she' to 'happy'.
- In 'They became friends', the copula is 'became'.
