simpleMeaning: Any plant sickness that makes a plant droop and shrivel, most often brought on by small
  living things that attack the roots
scope: Any plant sickness that makes a plant droop and shrivel; wilt is another name for this sense, and
  it is not a dry spell or a frost burn.
examples:
- Wilt disease struck the tomatoes.
- The wilt disease made the leaves droop.
