senseId: 'vomit%1:04:00::'
synsetId: 00119553-n
simpleMeaning: the act, done by the body on its own, of pushing what is in the stomach out through the
  mouth
scope: This is the act itself, not the matter that comes out, not a medicine that makes it happen, and
  not the verb for doing it.
examples:
- A single vomit emptied his stomach in seconds.
- She felt the vomit begin, and the food came out through her mouth.
