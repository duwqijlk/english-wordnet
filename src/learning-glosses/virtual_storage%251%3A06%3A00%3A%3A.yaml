simpleMeaning: In computers, the store a user can reach, where made-up addresses stand for real ones,
  made by using the hard disk to act as more working memory
scope: 'Also called virtual memory: in computers, the store a user can reach, made by using the hard disk;
  not the memory built into the machine itself.'
examples:
- Virtual storage lets a program use more space than the machine really has.
- The system set aside virtual storage on the hard disk.
