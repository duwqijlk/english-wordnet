simpleMeaning: Named for the belief that it can ease sharp pains in the side, this low herb of the cool
  north has small white star-shaped flowers.
scope: This low herb is also called starwort and stitchwort.
examples:
- We found greater stitchwort in the cool north.
- The greater stitchwort's flowers are small, white and shaped like stars.
