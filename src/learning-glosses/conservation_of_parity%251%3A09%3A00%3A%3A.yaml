simpleMeaning: In physics, the rule that a thing and its mirror image follow the same laws, in a right-handed
  set of measures as in a left-handed one.
scope: Also called parity, mirror symmetry or space-reflection symmetry, this is the rule in physics that
  a thing and its mirror image follow the same laws.
examples:
- Conservation of parity means the mirror image follows the same laws.
- Under conservation of parity, the left-handed set of measures gives the same result as the right-handed
  one.
