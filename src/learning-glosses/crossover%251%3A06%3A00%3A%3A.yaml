simpleMeaning: 'For going from one side of a road or railway line to the other: a path, often marked,
  that people use to get across'
scope: A path for going across a road or railway, also called crossing and also called crosswalk; not
  a voter who votes in another party's vote and not a mix of music styles.
examples:
- Use the crossover to get to the other platform.
- The crossover over the railway was marked with white lines.
