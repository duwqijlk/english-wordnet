simpleMeaning: Lumps grow on the stem near the ground when germs bring this sickness to plants, above
  all to pome and stone fruits, grapes, and roses
scope: This sickness of plants is caused by germs, makes lumps grow on the stem near the ground, and is
  seen above all on pome and stone fruits, grapes, and roses.
examples:
- Crown gall made lumps on the rose stems near the ground.
- The gardener cut off the crown gall from the apple tree.
