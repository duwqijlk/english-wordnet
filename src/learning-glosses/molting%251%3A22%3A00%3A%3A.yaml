senseId: 'molting%1:22:00::'
synsetId: 13538045-n
simpleMeaning: the act, at regular times, of losing the outer covering in arthropods (animals with jointed
  legs and no backbone), or the outer skin in reptiles
scope: Also called molt, moult, moulting, and ecdysis; this is the regular losing of an outer covering
  or skin by some animals, not the growing of a new covering.
examples:
- Molting helps the young crab lose its hard outer covering as it grows.
- We watched a snake in molting, its old skin coming loose.
