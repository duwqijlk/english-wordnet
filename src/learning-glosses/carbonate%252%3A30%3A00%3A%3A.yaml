simpleMeaning: to treat a thing with carbon dioxide, the gas that people breathe out
scope: To treat something with carbon dioxide, not the salt-like substance itself and not to turn something
  into that substance.
examples:
- The factory carbonates the water before it is bottled as a fizzy drink.
- They carbonate the drink by forcing gas into it under pressure.
