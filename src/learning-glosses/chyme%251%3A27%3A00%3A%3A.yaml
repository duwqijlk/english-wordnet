simpleMeaning: Through a ring of muscle, food that has been partly digested moves from the stomach into
  the first part of the gut as a half-liquid mass
scope: This half-liquid mass of food has been partly digested and moves from the stomach through a ring
  of muscle into the first part of the gut; not food that has not been digested at all.
examples:
- The chyme passed from the stomach into the first part of the gut.
- Chyme is food that has been partly digested.
