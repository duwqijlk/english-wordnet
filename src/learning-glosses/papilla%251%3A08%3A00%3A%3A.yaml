simpleMeaning: A tiny bit of flesh that sticks out at the root of a hair, a tooth, or a feather
scope: A tiny bit of flesh at the root of a hair, tooth or feather; not the small bump on the tongue that
  helps with taste, and not a tiny growth on a petal or leaf.
examples:
- The papilla sits at the base of the hair, under the skin.
- Each feather grows from a papilla at its base.
