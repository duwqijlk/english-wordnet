simpleMeaning: used before a singular count noun in everyday speech to mean 'not a', 'not one' or 'never
  a'
scope: A word used before a singular count noun in everyday speech to mean 'not a', 'not one' or 'never
  a'; not the word 'no' and not the word 'none'.
examples:
- He heard nary a sound in the dark house.
- There was nary a cloud in the sky.
