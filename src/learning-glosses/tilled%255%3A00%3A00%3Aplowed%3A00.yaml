simpleMeaning: (of land) turned over and broken up with a plow, a harrow, or a hoe, farm tools used to
  work the earth
scope: This describes land worked with farm tools and ready for seed, not land left hard and untouched.
examples:
- The tilled land was ready for seed.
- They planted corn in the soft, tilled fields.
