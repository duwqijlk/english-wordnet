simpleMeaning: Inside its egg-shaped body sits a large chalky shell, and narrow fins as long as the body
  run along a sea animal with ten arms round its head.
scope: Also called cuttlefish, it is a sea animal with ten arms and a shell inside its body.
examples:
- The cuttle moved through the water on its narrow fins.
- Inside the cuttle is a large chalky shell.
