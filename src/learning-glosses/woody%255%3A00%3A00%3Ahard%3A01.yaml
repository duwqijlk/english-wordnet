simpleMeaning: made hard like wood when lignin (a thing in plant cell walls that makes them hard) builds
  up in those walls
scope: This is about a plant part that has turned hard like wood. It is not about land with many trees,
  and not about a thing made of wood.
examples:
- The old plant stem felt woody and was hard to bend.
- As the plant grew, its stem became woody and stiff.
