simpleMeaning: Blood from the back of the hand and the lower arm runs away through this tube into the
  one under the arm.
scope: This is the blood tube that drains the back of the hand and the lower arm into the tube under the
  arm, also called vena basilica.
examples:
- The basilic vein runs up the inner side of the arm.
- Blood from the back of the hand drains through the basilic vein.
