simpleMeaning: a plant with a strong smell; its dried leaves can be smoked for pleasure or to make pain
  less
scope: 'Also called marijuana and marihuana: this is the plant itself, not the sense that names its dried
  leaves as a drug people smoke or chew.'
examples:
- Ganja grows well in warm places, and its leaves have a strong smell.
- The farmer found ganja plants growing behind the house.
