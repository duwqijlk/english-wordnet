simpleMeaning: to grip a person's palm and move it up and down to say hello or to praise them
scope: To grip a person's palm and move it up and down as a greeting or praise, not a wave and not a hug.
examples:
- We shake hands when we meet for the first time.
- The two leaders shake hands after signing the deal.
