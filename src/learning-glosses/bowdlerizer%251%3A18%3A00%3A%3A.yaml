simpleMeaning: A person who cuts rude or shocking words and parts out of a piece of writing
scope: A person who cuts rude or shocking words and parts out of a piece of writing, also called a bowdleriser
  and an expurgator; not a person who writes new words and not a person who bans a whole book.
examples:
- The bowdlerizer cut the rude jokes from the play.
- A bowdlerizer had cleaned up the old novel for school use.
