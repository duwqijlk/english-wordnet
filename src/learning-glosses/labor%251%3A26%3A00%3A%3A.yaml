simpleMeaning: the last stage of pregnancy, from the first tightening of the womb until the baby is born
scope: This is not pregnancy as a whole and not the birth itself, and it has nothing to do with work or
  a social class.
examples:
- She was in labor for twelve hours before the baby was born.
- The midwife told her to go to the hospital as soon as labor started.
