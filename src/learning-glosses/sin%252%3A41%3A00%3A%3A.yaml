simpleMeaning: to do an act that breaks a law of God or a law of right and wrong
scope: 'Also called trespass: to break God''s law or a law of right and wrong; not the bad act as a noun,
  not the maths number, and not just making a serious mistake.'
examples:
- He believed he had sinned by lying to his family.
- They were taught not to sin against their neighbours.
