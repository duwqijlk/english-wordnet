senseId: 'metamorphosis%1:22:00::'
synsetId: 13536083-n
simpleMeaning: the clear and fast change in some animals from a larva, a very young form that looks quite
  different, into an adult
scope: 'Another name for this sense is metabolism: it is the clear, fast change from a larva into an adult,
  not a small or slow change in how an animal grows.'
examples:
- The caterpillar's metamorphosis into a butterfly took just a few weeks.
- During metamorphosis, the tadpole changes its shape and becomes a frog.
