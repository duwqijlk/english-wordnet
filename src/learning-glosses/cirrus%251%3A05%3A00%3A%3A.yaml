simpleMeaning: A thin, bendy limb on an animal, such as on barnacles, sea lilies, or many insects, often
  used for feeling things.
scope: A thin, bendy limb on an animal, not the wispy white cloud high in the sky.
examples:
- The barnacle waved its cirrus to catch food.
- Cirrus on the insect's head help it feel its way.
