simpleMeaning: a way of thinking that is ready to accept people or things that happen
scope: 'Also called acceptance and sufferance: a ready way of thinking that accepts different people or
  ways. Not the official act that gives people the right to hold views others do not agree with, especially
  about religion.'
examples:
- She showed great toleration when her neighbours held beliefs very different from her own.
- Living together in peace needs toleration from everyone in the street.
