simpleMeaning: When things and memories that matter to a person stir no feeling in them, psychoanalysis
  calls that lack of feeling by this name.
scope: Psychoanalysis uses this word for the state in which things and memories that matter to a person
  stir no feeling in them.
examples:
- They felt nothing about things that mattered to them, a case of acathexis.
- The acathexis made old memories leave them quite unmoved.
