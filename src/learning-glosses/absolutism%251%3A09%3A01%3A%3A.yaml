senseId: 'absolutism%1:09:01::'
synsetId: 06223441-n
simpleMeaning: A set of ideas holding that rule should have full power, held back by nothing.
scope: This sense is also called totalitarianism, for a set of ideas holding that rule should have full
  power, held back by nothing, unlike the sense for a form of rule where the ruler is an absolute dictator,
  held back by no constitution, laws, or opposition, or the like, unlike the sense for the doctrine of
  an absolute being, often tied to idealism in philosophy, and unlike the sense for rule through threats
  of punishment and harm.
examples:
- Absolutism gives the government full power with no limits.
- He believed in absolutism, with rule held back by nothing.
