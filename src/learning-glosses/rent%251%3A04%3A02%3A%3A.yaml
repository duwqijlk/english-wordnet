simpleMeaning: the act of tearing or ripping or splitting a thing
scope: 'Also called split, and also called rip: the act of tearing or splitting a thing, not the money
  paid to use a house and not the extra money from good farmland.'
examples:
- The rent in the cloth ran from top to bottom.
- One hard rent tore the paper in two.
