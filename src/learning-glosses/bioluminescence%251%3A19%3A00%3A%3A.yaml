simpleMeaning: light made by the body of a living thing, as in a firefly
scope: Light that a living body makes itself, not light from the sun, a fire, or a lamp.
examples:
- The fireflies filled the dark field with bioluminescence.
- Bioluminescence helps some deep-sea fish see and hunt in the dark.
