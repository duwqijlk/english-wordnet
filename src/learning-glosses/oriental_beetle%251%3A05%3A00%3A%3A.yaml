simpleMeaning: A hard-shelled insect brought to the United States from the East, whose young feed on the
  roots of sugar cane and other grasses.
scope: 'Also called Anomala orientalis and Asiatic beetle: an insect introduced from the East, told apart
  by its young feeding on the roots of sugar cane and other grasses.'
examples:
- The Oriental beetle came to the United States from the East.
- The young of the Oriental beetle feed on the roots of grasses.
