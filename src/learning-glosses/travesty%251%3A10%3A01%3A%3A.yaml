simpleMeaning: a piece of writing or other work that copies someone's style and shows it in a false way,
  usually to make people laugh
scope: 'Also called mockery, parody, takeoff, burlesque, spoof, lampoon, and pasquinade: a work that copies
  and twists a style for fun, not a funny play built on wild, unlikely events and not the act of making
  something into a bad copy.'
examples:
- The magazine printed a travesty of the author's best-known poem.
- His travesty of her serious style turned every line into a joke.
