simpleMeaning: a snake of the southern United States and Mexico, with a tail like a braided whip
scope: A snake of the southern United States and Mexico, with a tail like a braided whip; coachwhip snake
  is another name for this, not a thick-bodied snake and not a snake with a rattle.
examples:
- A coachwhip slipped across the desert sand.
- The coachwhip's tail looks like a braided whip.
