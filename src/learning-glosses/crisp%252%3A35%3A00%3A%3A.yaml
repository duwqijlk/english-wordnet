simpleMeaning: to make small folds or lines on a smooth flat thing, or a pressed line in it; this use
  is old and no longer used in normal speech
scope: 'Also called wrinkle, crease, crinkle and scrunch: this is making folds or lines in a flat thing,
  not cooking food until it is brown and hard, and not a thin fried slice of potato.'
examples:
- She crisped the paper to make a sharp fold.
- He crisped the cloth by pressing a line into it.
