simpleMeaning: sudden, strong pain in the belly, especially in babies
scope: Also called gripes and colic. This is sudden strong belly pain, especially in babies, not a long-lasting
  pain and not a complaint about something.
examples:
- The baby cried all night from griping in her belly.
- Griping kept the small baby awake and in pain.
