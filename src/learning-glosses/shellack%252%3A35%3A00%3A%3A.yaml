simpleMeaning: to cover something with shellac, a hard shiny material used to protect wood
scope: Another name for this is shellac. It means putting a hard shiny covering on something, not the
  material used for the covering.
examples:
- He shellacked the wooden chair to give it a shiny finish.
- She shellacked the desk to protect it from water spots.
