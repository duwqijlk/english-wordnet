simpleMeaning: In printing, a receptacle divided into compartments for the different letters, spaces,
  or numbers a typesetter uses.
scope: This is the printing receptacle that holds type, not a container for carrying things, a legal proceeding,
  an instance, a grammatical form, or a covering.
examples:
- The compositor returned each metal letter to its compartment in the case.
- A case with separate compartments held the type for each letter of the alphabet.
