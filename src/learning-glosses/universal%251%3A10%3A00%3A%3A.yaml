simpleMeaning: In logic, a claim that says something true of every member of a group
scope: In logic, a claim true of all members of a class, not a tool that fits many jobs and not a claim
  about the whole world.
examples:
- '''All men are mortal'' is a universal.'
- 'The logic class studied a universal: all birds have wings.'
