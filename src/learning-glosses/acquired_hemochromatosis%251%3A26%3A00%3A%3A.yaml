simpleMeaning: After many blood gifts, or after eating too much food that holds iron, too much iron builds
  up in the body.
scope: This is a sickness where too much iron builds up in the body, not a sickness a person is born with.
examples:
- Acquired hemochromatosis came after many blood gifts.
- Too much iron in the food can bring on acquired hemochromatosis.
