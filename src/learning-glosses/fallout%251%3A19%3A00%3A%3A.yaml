simpleMeaning: a bad and unwanted extra effect that comes after something else
scope: A bad extra effect that follows something, not the harmful dust that falls to the ground after
  a very powerful bomb.
examples:
- The fallout from the scandal cost the company many customers.
- She had to deal with the fallout after the plan failed.
