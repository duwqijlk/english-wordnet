synsetId: 05027863-n
simpleMeaning: The power in a material to spring back to its first shape or place after being bent or
  pressed, if it is not bent too far.
scope: The power of a material to spring back after being bent, also called resilience, and not a single
  act of springing back.
examples:
- The resiliency of the rubber lets it spring back after each press.
- Engineers tested the resiliency of the new metal.
