simpleMeaning: With cup-shaped blooms whose bent-back petals run from deep yellow to bright red, this
  lily grows in the southeast.
scope: Also called the pine lily and the tiger lily, this is a lily of the southeast, not the western
  kind with orange-red spotted blooms, and its cup-shaped blooms have petals running from deep yellow
  to bright red.
examples:
- A leopard lily opened its cup-shaped blooms in the southeast.
- Leopard lily blooms showed deep yellow petals that bent back.
