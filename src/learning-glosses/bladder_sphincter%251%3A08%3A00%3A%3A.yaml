simpleMeaning: the ring of muscle that closes the bladder, made of a thick layer of muscle round the opening
  to the tube that carries urine out
scope: 'Also called musculus sphincter vesicae: the ring of muscle that closes the bladder.'
examples:
- The bladder sphincter is a ring of muscle round the opening of the bladder.
- When the bladder sphincter relaxes, urine can flow out.
