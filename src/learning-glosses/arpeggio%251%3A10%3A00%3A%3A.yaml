simpleMeaning: a group of notes that belong together, played one by one very fast, not all at the same
  time
scope: In music, this is notes that belong together played one after another very fast, not all the notes
  played at once and not a single note on its own.
examples:
- He played a quick arpeggio on the piano.
- The song begins with an arpeggio, with the notes coming one after another.
