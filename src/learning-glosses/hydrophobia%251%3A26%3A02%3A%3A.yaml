simpleMeaning: 'Even a sip of liquid is hard to swallow for a person with rabies: that strong dislike
  is the sign.'
scope: This is the sign of rabies in which a person cannot bear to swallow liquids, not the disease rabies
  itself and not a fear of water.
examples:
- Hydrophobia made even a sip of water hard to swallow.
- 'One sign of rabies was hydrophobia: the sick person turned away from every drink offered.'
