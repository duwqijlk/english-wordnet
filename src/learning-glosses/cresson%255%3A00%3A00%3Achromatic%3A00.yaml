simpleMeaning: Yellower and darker than pea colour, this shade is greener and deeper than moss colour,
  a middle shade between yellow and leaf colour
scope: This shade is also called cress green or watercress, and it is greener and deeper than moss colour
  and yellower and darker than pea colour.
examples:
- The cresson paint gave the room a soft yellow-green look.
- He picked a cresson shade for the kitchen walls.
