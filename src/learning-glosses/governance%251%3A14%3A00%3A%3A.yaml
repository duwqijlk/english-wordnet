simpleMeaning: the people, groups, or departments that together run and manage something
scope: 'Also called organization, brass, administration, and establishment: the people who together run
  something, not the act of ruling and not a single ruler.'
examples:
- The governance of the association is responsible to its members.
- Good governance keeps the club's money safe.
