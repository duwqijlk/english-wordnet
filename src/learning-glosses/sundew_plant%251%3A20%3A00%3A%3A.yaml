simpleMeaning: any of several bog plants of the group Drosera, whose leaves have sticky hairs that hold
  insects fast and break them down for food; found all round the world
scope: Also called daily dew and sundew; a bog plant that holds insects fast on sticky leaves, not a pitcher
  plant and not an ordinary bog plant that feeds only from the soil.
examples:
- The sundew plant held a gnat fast on its sticky leaf.
- Sundew plants grow in bogs all round the world.
