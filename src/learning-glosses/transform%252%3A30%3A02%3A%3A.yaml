simpleMeaning: In maths, to change something by using a set rule that always works in the same way
scope: In maths, this is putting a number or shape through a set rule, not making electric power higher
  or lower, and not changing a living cell with material from another cell.
examples:
- To solve the problem, we transform each point by the same rule.
- The teacher transformed the shape by turning it and moving it to a new place.
