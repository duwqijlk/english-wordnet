simpleMeaning: a big metal container with two handles, given as a prize to the person or team that wins
  a contest
scope: Not a small vessel for drinking, and not a unit of measure for cooking.
examples:
- She raised the cup above her head as the crowd cheered.
- Our team has won the cup three years running.
