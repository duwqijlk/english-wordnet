senseId: 'knee_jerk%1:04:00::'
synsetId: 00866537-n
simpleMeaning: the leg kicks out straight by itself when the cord just below the front of the joint is
  tapped sharply
scope: Also called knee-jerk reflex and patellar reflex, it is the leg straightening by itself when tapped,
  with no plan behind the move.
examples:
- The knee jerk came fast after the sharp tap below the joint.
- A knee jerk straightened the leg before the person could think about moving it.
