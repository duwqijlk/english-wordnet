simpleMeaning: An infection that spreads from one person to another through sex or touch of the sex parts
scope: An infection spread through sex or touch of the sex parts; also called dose, sexually transmitted
  disease, venereal disease and venereal infection; not a cold caught from the air, and not a skin rash
  from an allergy.
examples:
- A social disease can spread through unprotected sex.
- The clinic treats people with a social disease.
