senseId: 'median%1:09:00::'
synsetId: 06033170-n
simpleMeaning: In a set of numbers, the value half way between the two numbers in the middle; the set
  may have an even or an odd number of items
scope: This is a number in a set of numbers; it is not the describing word for a thing that sits in or
  points to the middle, nor the describing word for a middle value.
examples:
- They worked out the median of the test scores for the class.
- For these five numbers, the median sits in the middle of the list.
