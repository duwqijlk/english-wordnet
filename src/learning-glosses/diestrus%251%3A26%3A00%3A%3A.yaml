simpleMeaning: Between bouts of mating activity, an animal with several heat cycles in one breeding season
  goes through this quiet time of no sexual drive.
scope: Also called diestrum; it is the quiet gap between bouts of mating activity in animals with several
  heat cycles in a season, not the mating activity itself.
examples:
- Diestrus is the quiet time between bouts of mating activity.
- In diestrus, the animal shows no sexual drive between heat cycles.
