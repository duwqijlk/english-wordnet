simpleMeaning: A bushy tree of the Pacific coast of the United States that gives a product called cascara
  sagrada
scope: A bushy Pacific coast tree that gives a product called cascara sagrada, also called bearberry,
  cascara buckthorn, chittamwood and chittimwood, not a fruit bush and not a garden shrub.
examples:
- Bearwood grows along the Pacific coast of the United States.
- The bearwood tree gives cascara sagrada.
