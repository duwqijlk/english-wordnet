simpleMeaning: a safety device in a circuit that breaks the flow of power when too much current passes
  through it
scope: A safety device that cuts off electric power when overloaded, not a device that starts burning
  and not the act of melting things together.
examples:
- The fuse blew when the heater was switched on.
- He changed the fuse in the plug.
