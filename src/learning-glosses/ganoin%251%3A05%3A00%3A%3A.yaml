simpleMeaning: a hard, glossy material like tooth enamel, formed in the lower skin of certain fishes,
  especially armoured ones such as gars, and covering the outer layer of their scales
scope: The enamel-like coat on fish scales; ganoine is another spelling for the same material, not a separate
  substance, and it is not ordinary tooth enamel.
examples:
- The scales of a gar are coated with ganoin, which gives them a glassy shine.
- Fossil scales often keep their layer of ganoin.
