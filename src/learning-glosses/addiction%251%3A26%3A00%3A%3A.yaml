simpleMeaning: being used to a thing that forms a habit in the body or mind, and needing it more and more
  (especially drink or drugs)
scope: Being used to a habit-forming thing and needing it more and more, not the old Roman law award of
  a person to another.
examples:
- His addiction to drink cost him his job.
- Her addiction grew worse each year she used the drug.
