simpleMeaning: the way printing plates or rollers are made by using light to form the picture on them
scope: The way printing plates or rollers are made by using light to form the picture on them; photomechanics
  is another name for this sense, not the way photographs themselves are turned into plates.
examples:
- Photoplate making makes printing plates by using light to form the picture on them.
- He learned photoplate making in the print shop, using light to form the picture.
