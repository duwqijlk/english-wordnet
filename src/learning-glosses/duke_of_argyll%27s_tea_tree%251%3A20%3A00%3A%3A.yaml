simpleMeaning: A bush that loses its leaves, standing straight or spreading, with thorny stems and violet-purple
  flowers followed by orange-red berries; from southeastern Europe to China.
scope: 'Also called common matrimony vine, Lycium barbarum, or Lycium halimifolium: a bush with violet-purple
  flowers and orange-red berries, not a rose bush and not a fruit tree.'
examples:
- The Duke of Argyll's tea tree blooms violet in spring.
- Birds eat the berries of the Duke of Argyll's tea tree.
