simpleMeaning: real and truly there, rather than only imagined or possible.
scope: This is not the narrower idea of being in place at this moment, nor of being contained inside something
  else; it says that something has real being.
examples:
- Philosophers still argue about whether numbers are existing things.
- The myth describes gods as existing beings rather than symbols.
