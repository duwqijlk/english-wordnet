simpleMeaning: loving or praising someone so much that you cannot see their faults
scope: Loving someone far too much, without seeing their faults; not fair praise and not calm respect.
examples:
- His idolatrous love for the singer blinded him to her flaws.
- She spoke of the leader in idolatrous terms, as if he could do no wrong.
