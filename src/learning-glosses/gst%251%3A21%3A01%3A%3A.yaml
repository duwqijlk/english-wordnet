simpleMeaning: A tax that the last shop to sell a thing adds to its price, based on what the thing is
  worth.
scope: 'Also called goods and service tax, value-added tax, and VAT: a tax added to the price of a thing
  by the last shop that sells it, not an income tax and not a tax on what a person owns.'
examples:
- The shop added GST to the price of the shoes.
- GST is charged by the last shop that sells the goods.
