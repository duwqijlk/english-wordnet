simpleMeaning: in a way that changes without a clear pattern, so you cannot tell what will happen next
scope: 'Another name for this sense is unpredictably: it means changing without a clear pattern, not in
  a steady or planned way.'
examples:
- Prices rose and fell erratically all through the year.
- The old car moved erratically, speeding up and slowing down without warning.
