simpleMeaning: of or tied to a test that finds what is in a liquid by passing a small electric flow through
  it
scope: Of or tied to a test that finds what is in a liquid by passing a small electric flow through it,
  not of a test that looks at colour and not of a test that smells a liquid.
examples:
- The polarographic test showed traces of lead in the water.
- She ran a polarographic check on the sample.
