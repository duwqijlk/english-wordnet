simpleMeaning: A pain in the head that comes when the blood vessels in the brain get wider, when muscles
  tighten, or when drugs cause a bad reaction.
scope: A pain in the head from wider brain blood vessels, tight muscles or drugs; headache and head ache
  are other names for this sense.
examples:
- Her cephalalgia came on after the long flight.
- Cephalalgia made it hard for him to read in bright light.
