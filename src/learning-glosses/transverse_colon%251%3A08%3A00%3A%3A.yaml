simpleMeaning: Joining the rising part to the falling part, this stretch of the large gut runs across
  the belly.
scope: This is the stretch of the large gut that joins the rising part to the falling part, not the rising
  or falling part itself.
examples:
- Food passed through the transverse colon.
- The transverse colon carries food across the belly.
