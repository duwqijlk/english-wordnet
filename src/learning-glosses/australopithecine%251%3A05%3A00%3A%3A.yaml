simpleMeaning: One of several kinds of dead animals like apes, walking on two legs like people, with small
  brains, of the group called Australopithecus, from 1 to 4 million years ago
scope: This is one of several dead ape-like kinds that walked on two legs with small brains, not a living
  ape and not an early true human.
examples:
- The australopithecine walked on two legs with a small brain.
- Australopithecines lived from 1 to 4 million years ago.
