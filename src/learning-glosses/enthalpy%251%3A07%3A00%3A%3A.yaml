simpleMeaning: In thermodynamics, a number that stands for the power inside a body, plus its size times
  the push on it
scope: 'Also called heat content: in thermodynamics, a number for the power inside a body plus its size
  times the push on it, not the power inside it alone and not its size alone.'
examples:
- The enthalpy of the gas rose as it was heated.
- They worked out the enthalpy from the gas's size and the push on it.
