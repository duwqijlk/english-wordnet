simpleMeaning: a garden plant from North America with sweet-smelling red, purple, yellow, or white flowers
  that open late in the day
scope: A garden plant from North America with sweet-smelling flowers in red, purple, yellow, or white
  that open late in the day; not a wild plant and not one whose flowers open in the morning.
examples:
- The common four-o'clock opened its red flowers as the sun went down.
- She planted common four-o'clock along the garden path.
