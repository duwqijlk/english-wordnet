simpleMeaning: a small rocket engine that gives the push needed to move and steer a ship that travels
  in space
scope: A small engine on a ship that travels in space, used to move and steer it; not a person who pushes
  their way in where they are not wanted.
examples:
- The crew fired a small thruster to turn the spacecraft.
- A broken thruster made it hard to steer the ship in space.
