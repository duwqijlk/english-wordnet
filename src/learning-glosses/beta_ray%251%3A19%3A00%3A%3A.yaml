simpleMeaning: Tiny bits shot out by an atom as matter breaks down on its own.
scope: Tiny bits given off as they break away from an atom, also called beta radiation and electron radiation;
  not light from a lamp and not heat from a fire.
examples:
- A beta ray struck the screen and left a mark.
- Beta rays pass through thin sheets of metal.
