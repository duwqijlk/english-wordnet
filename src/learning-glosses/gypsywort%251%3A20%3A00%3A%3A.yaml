simpleMeaning: A hairy plant from Europe and Asia with white flowers that have two lips.
scope: A hairy plant from Europe and Asia with white flowers that have two lips; gipsywort is another
  name for it, not a winged insect that eats shade trees and not a vetch grown for feed.
examples:
- Gypsywort grew by the stream with white flowers.
- The gypsywort had hairy stems and two-lipped white flowers.
