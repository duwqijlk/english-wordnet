simpleMeaning: A hard blow made with a blade or some other sharp, pointed tool.
scope: A hard blow made with a blade or another sharp pointed tool; thrust and stab are other names for
  this sense, not a cut with a blade and not a punch with a fist.
examples:
- One strong knife thrust to the heart killed him.
- The knife thrust came without warning.
