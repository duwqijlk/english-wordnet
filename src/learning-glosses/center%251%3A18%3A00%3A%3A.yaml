simpleMeaning: in football, the middle player on the line where play starts, who passes the ball backward
  to the quarterback to begin each play
scope: This is the football lineman, not the basketball player in the same role, not the middle point
  of a line, and not a building devoted to an activity.
examples:
- The center snapped the ball over the quarterback's head and the play was ruined.
- Our center is the biggest man on the line and rarely touches the ball after the snap.
