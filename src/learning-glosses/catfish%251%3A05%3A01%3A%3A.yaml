simpleMeaning: any of many kinds of fish that live mostly in fresh water near the bottom, in Eurasia and
  North America, with feelers like whiskers round the mouth
scope: Bottom-living fresh-water fish with whisker-like feelers; not the large deep-sea kind with strong
  teeth.
examples:
- Catfish swim in the river near the bottom.
- He caught a catfish with whiskers round its mouth.
