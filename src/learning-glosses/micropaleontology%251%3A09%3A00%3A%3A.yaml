simpleMeaning: The study of fossils so small they can only be seen with a microscope.
scope: The study of fossils so small they can only be seen with a microscope; not the study of large fossils,
  and not the study of living things.
examples:
- Micropaleontology lets scientists read the history of ancient seas from tiny fossils.
- He chose micropaleontology as his field after finding microfossils in chalk.
