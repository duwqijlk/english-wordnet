simpleMeaning: A person who will not listen to new ideas and will not change their views
scope: 'Also called narrow: a person who will not listen to new ideas, not a person who holds fast to
  one faith group and its rules.'
examples:
- The narrow-minded judge would not listen to a new way of seeing the case.
- Her narrow-minded views shut out every idea she had not met before.
