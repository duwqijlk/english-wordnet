senseId: 'platyrrhine%3:00:00::'
synsetId: 01411901-a
simpleMeaning: A word for monkeys from the Americas whose nose holes lie far apart, or for people with
  wide noses
scope: Also called broadnosed, platyrhine, platyrhinian, platyrrhinian and platyrrhinic, this word is
  about such monkeys or people, not the monkeys themselves.
examples:
- The platyrrhine monkeys of South America have nose holes that lie far apart.
- She has a platyrrhine face, with a wide nose.
