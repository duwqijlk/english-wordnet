simpleMeaning: In dentistry, a man-made cover that a dentist puts over a broken tooth or a bad, rotting
  tooth
scope: A cover a dentist makes for a bad tooth, also called a jacket and also called a cap. It is not
  the natural top part of a tooth, and not the headpiece a king or queen wears to show power.
examples:
- The dentist put a crown on my broken back tooth.
- She needs a crown because half of the tooth has broken off.
