simpleMeaning: A tall one-year marsh elder common in wet rich soil in central North America; its touch
  harms skin, and its much flower dust is a main cause of hay fever
scope: Also called burweed marsh elder or false ragweed; a tall marsh plant of central North America whose
  flower dust brings on hay fever.
examples:
- Iva xanthifolia grew thick along the wet ditch, its stems tall and green.
- After walking past Iva xanthifolia, her eyes began to water from the flower dust.
