simpleMeaning: a long thin tool with a big hole at one end, made for thick thread used to mend cloth or
  to sew patterns on it
scope: 'Also called darning needle: a long thin tool with a big hole at one end for thick thread, not
  a short needle for fine sewing and not a pin used to hold cloth together.'
examples:
- She threaded an embroidery needle with thick wool to mend the tear.
- He used an embroidery needle to sew the pattern onto the cloth.
