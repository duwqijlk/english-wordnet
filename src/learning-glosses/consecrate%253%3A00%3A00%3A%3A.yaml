simpleMeaning: set apart in a serious and formal way for a high purpose or for holy use
scope: 'Also called dedicated and consecrated: set apart for a high or holy purpose, not the act of giving
  something to a god by a promise and not naming a person to a church job.'
examples:
- The consecrated ground around the church is kept for holy use.
- They lived a consecrated life, set apart for the work of God.
