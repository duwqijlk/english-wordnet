simpleMeaning: a play in which the main person loses to a stronger power or to things that happen, and
  which makes people feel fear or feel sorry for that person
scope: This sense is a sad play, not a real sad event in which people are hurt or killed, and not a funny
  play with a happy end.
examples:
- We read a tragedy at school about a king who loses everything.
- The theatre put on a tragedy that left the whole room quiet and sad.
