senseId: 'maharaja%1:18:00::'
synsetId: 10301334-n
simpleMeaning: a Hindu prince or king in India who has a higher rank than a raja (a Hindu prince or king
  of lower rank)
scope: 'Also called maharajah: this is a Hindu prince or king in India with a rank above a raja, not a
  raja of lower rank himself.'
examples:
- The maharaja, the highest Hindu king in the area, gave orders to the rajas below him.
- A maharaja ruled the land, with rajas under him.
