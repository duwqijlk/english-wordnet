senseId: 'obligation%1:04:00::'
synsetId: 01132241-n
simpleMeaning: the power of the people around you that makes you do what they demand of you
scope: This is the power of the people around you that makes you do what they demand of you; duty and
  responsibility are other names for this sense. Not a legal agreement about payment, and not owing thanks
  for a favor done for you.
examples:
- Parents feel an obligation to care for their children.
- He went to the meeting out of a sense of obligation, not because he wanted to.
