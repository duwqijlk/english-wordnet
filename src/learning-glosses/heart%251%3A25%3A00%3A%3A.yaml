simpleMeaning: a flat shape with two rounded parts that curve inward at the top and meet in a point at
  the bottom, often seen on playing cards and valentines
scope: This is the drawn symbol, not the organ in the chest, the card suit, or the central part of something.
examples:
- She folded the paper and cut out a heart for the card.
- The chocolates were arranged in a box shaped like a heart.
