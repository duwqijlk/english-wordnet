simpleMeaning: To do with the spread of a cancer to other parts of the body, or changed by such a spread.
scope: About a cancer or growth that has spread to other parts of the body.
examples:
- The growth was metastatic, having spread from the first tumour.
- The scan showed the cancer was metastatic.
