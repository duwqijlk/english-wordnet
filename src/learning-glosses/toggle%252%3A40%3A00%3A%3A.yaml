simpleMeaning: to give something a small bar that goes through a loop, for fastening it
scope: Adding a small bar for fastening to something; not fastening something with such a bar, and not
  letting something go with a switch.
examples:
- They toggled each new coat with two wooden bars at the front.
- She toggled the bag, adding a small bar and loop to close it.
