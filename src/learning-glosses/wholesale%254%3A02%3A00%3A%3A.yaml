simpleMeaning: at the price paid by a shop that buys goods to sell them again
scope: At the price shops pay when they buy goods to sell again; not the act of selling goods to shops,
  and not selling in an ordinary shop to people who will use the goods.
examples:
- I can buy these shoes wholesale if I take fifty pairs at once.
- The farm sells its eggs wholesale to local shops.
