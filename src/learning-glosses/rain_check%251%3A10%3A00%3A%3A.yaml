simpleMeaning: A ticket stub that lets the holder enter a future event if the planned event was cancelled
  because of rain
scope: It is a stub given when wet weather calls off a planned event, good for getting into the same event
  at a later date.
examples:
- The rain check let us come back for the game next week.
- They kept the rain check until the new date was set.
