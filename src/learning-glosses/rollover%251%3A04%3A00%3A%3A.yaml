synsetId: 01158209-n
simpleMeaning: the act of changing the company that invests the money in your pension plan, without having
  to pay a tax charge for the change
scope: The act of moving a pension plan to a different company without paying extra tax, not a car or
  other vehicle turning over.
examples:
- She did a rollover when she moved her pension plan to a new company.
- A rollover let him change the company for his pension without paying a tax charge.
