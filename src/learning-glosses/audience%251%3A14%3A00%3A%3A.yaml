simpleMeaning: A group of people who watch or listen to a performance, usually one that is open to the
  public.
scope: This is the group gathered at a performance; it is not a formal meeting with an important person,
  and not the wider public that follows a show or publication.
examples:
- The audience clapped loudly at the end of the play.
- A small audience gathered in the square to hear the band.
