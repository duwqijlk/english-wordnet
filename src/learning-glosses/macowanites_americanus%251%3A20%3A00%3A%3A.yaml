scope: A small fungus with a cap that breaks easily to show the white flesh inside and a white stalk the
  cap almost hides, unlike fungi with firm caps and stalks in the open.
examples:
- Macowanites americanus has a cap that breaks easily.
- The white stalk of Macowanites americanus is almost hidden by the cap.
