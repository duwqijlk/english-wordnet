simpleMeaning: An upright spreading plant native to western Europe that loses its leaves each year, widely
  grown for its rich yellow flowers
scope: This is an upright western European plant grown for its rich yellow flowers; common broom, green
  broom and Cytisus scoparius are other names for it, and its nearest neighbours are the other yellow-flowered
  shrubs of western Europe.
examples:
- The Scotch broom on the bank was covered in rich yellow flowers.
- We cut back the Scotch broom after it flowered.
