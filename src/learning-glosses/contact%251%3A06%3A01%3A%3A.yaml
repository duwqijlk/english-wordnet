simpleMeaning: a thin curved lens of glass or plastic worn on the eye to fix sight or give medicine
scope: This is not a person you know or an act of touching, but a lens worn directly on the eye.
examples:
- He put his contact lenses in before the match.
- These contacts are made to release medicine slowly.
