simpleMeaning: A drug that stops fits, sold under its trade name, used to hold back some kinds of fits
  in epilepsy, and also to ease nerve pain from shingles.
scope: A drug that stops fits, also called gabapentin; its near kin are the other drugs that stop fits
  in epilepsy.
examples:
- Neurontin controls seizures in epilepsy.
- The doctor gave Neurontin for the shingles pain.
