simpleMeaning: Describing the middle number in a list put in order, or the number half way between the
  two middle numbers when there is an even number of numbers
scope: 'Also called average: this sense is about being the middle value in a list put in order, not the
  noun that names that middle number, and not the sense that means in or toward the middle.'
examples:
- The median score in the class was 20, with half the scores above it and half below it.
- They worked out the median pay for workers in the town.
