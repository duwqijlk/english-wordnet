simpleMeaning: Joining the one in the neck, this blood tube forms a larger one in the chest, carrying
  on from the one under the arm.
scope: Vena subclavia is another name for this blood tube, which carries on from the one under the arm
  and joins the one in the neck.
examples:
- The subclavian vein carries on from the one under the arm toward the neck.
- Blood in the subclavian vein flows on to form a larger one in the chest.
