simpleMeaning: a place that keeps money people can take out at any time, lends money, and does other money
  work for the public
scope: A money place that takes money people can take out at any time, lends money, and does other money
  work for the public; full service bank is another name for this sense, not a bank that only keeps savings.
examples:
- They opened an account at the commercial bank on Main Street.
- The commercial bank lent the shop money to buy new stock.
