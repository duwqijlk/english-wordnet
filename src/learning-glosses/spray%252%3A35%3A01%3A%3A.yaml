simpleMeaning: to come out on its own in a mass of tiny drops of liquid
scope: To come out on its own in a mass of tiny drops of liquid, not to throw a liquid about in tiny drops
  and not to cover a thing by throwing liquid on it.
examples:
- Water sprayed from the broken pipe onto the floor.
- Paint sprayed from the can as he shook it.
