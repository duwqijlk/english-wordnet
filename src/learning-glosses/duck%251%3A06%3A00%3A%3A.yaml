simpleMeaning: a heavy cotton cloth with threads that cross over and under in a simple way, used for clothes
  and tents
scope: Heavy cotton cloth for clothes and tents; not the swimming bird and not the act of trying not to
  do or answer something.
examples:
- The tent was made of strong duck that kept out the rain.
- He wore work clothes made from heavy duck.
