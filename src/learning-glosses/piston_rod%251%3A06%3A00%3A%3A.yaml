simpleMeaning: Moved by the sliding part inside the engine, or moving it, this long bar joins it to the
  rest of the machine
scope: A long bar that joins the sliding part inside an engine to the rest of the machine, not the sliding
  part itself and not a bar that stays still.
examples:
- The piston rod broke, and the engine stopped.
- Oil the piston rod so it slides well.
