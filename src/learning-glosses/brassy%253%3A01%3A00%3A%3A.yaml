simpleMeaning: like the sound of a thing made of brass and used to make music
scope: This is about how something sounds, like a thing made of brass used to make music; it is not the
  sense about a person who shows no shame and does not care about good manners.
examples:
- The bell made a loud, brassy sound that hurt my ears.
- Her voice sounded brassy and hard over the phone.
