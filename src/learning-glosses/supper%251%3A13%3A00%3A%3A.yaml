simpleMeaning: a light meal in the evening, eaten early if the main meal is at midday, or eaten late,
  near bedtime
scope: A light meal in the evening, not the main meal of the day.
examples:
- We had a light supper of bread and soup.
- Supper was served early because dinner had been at midday.
