schema: oewn-learning-gloss-v2
senseId: 'incitement%1:16:00::'
synsetId: 09207872-n
simpleMeaning: A spur to action; something that stirs people up and gets them going.
scope: Also called a provocation; a thing that stirs people to act, not the act of urging them on and
  not earnest persuasion.
examples:
- The tax rise was an incitement to protest.
- His words were the incitement the workers needed.
