simpleMeaning: Blood leaks under the skin in one of a group of sicknesses of the blood
scope: Also called purpura, this is one of a group of blood sicknesses that make blood leak under the
  skin, not a bruise from a knock and not a single sickness with one cause.
examples:
- The doctor said the spots were peliosis, a sickness of the blood.
- Peliosis can make blood leak under the skin without any cut.
