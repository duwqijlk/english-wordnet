simpleMeaning: A safety part built into a vehicle's starter switch that stops anyone without the key from
  using the vehicle.
scope: A safety part built into a vehicle's starter switch that stops anyone without the key from using
  the vehicle; lock is another name for it, not the key itself and not a lock on a door.
examples:
- He turned the key in the ignition lock.
- A broken ignition lock stopped the car from starting.
