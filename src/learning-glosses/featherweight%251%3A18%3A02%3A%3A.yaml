simpleMeaning: In amateur boxing, a boxer who weighs 126 pounds at most.
scope: An amateur boxer weighing no more than 126 pounds, not the weight class itself and not the professional
  boxer of 123 to 126 pounds.
examples:
- The young featherweight won his first three bouts.
- As a featherweight, he had to stay under 126 pounds.
