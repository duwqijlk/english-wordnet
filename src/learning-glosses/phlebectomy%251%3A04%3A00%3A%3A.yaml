simpleMeaning: surgery that takes out a vein, or part of one, at times for badly swollen veins
scope: Surgery that takes out a vein, or part of one, at times for badly swollen veins; not the tying
  off of a vein and not surgery that takes out a blood clot.
examples:
- The surgeon did a phlebectomy to take out the swollen vein in her leg.
- After the phlebectomy, the bad vein was gone for good.
