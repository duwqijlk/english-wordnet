simpleMeaning: A music tool you hit to make a beat, most often a hollow round tube with a thin skin pulled
  tight over each end
scope: A music tool you hit, not a metal can for liquids, not a brake part, and not a round hollow shape.
examples:
- She beat the drum softly as the band began to play.
- He tapped the drum with two sticks to keep the beat.
