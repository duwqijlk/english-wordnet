senseId: 'alpha-adrenoceptor%1:08:00::'
synsetId: 05616866-n
simpleMeaning: Tiny docking points on nerve cells of the body's fight-or-flight system, thought to account
  for why certain substances affect only some of its responses, such as narrowing blood vessels.
scope: The same nerve-cell docking point under another name, not a messenger substance and not the response
  it triggers.
examples:
- Blocking the alpha-adrenoceptor relaxes the muscle in the gut wall.
- Each alpha-adrenoceptor sits on a nerve cell and responds to only certain chemical signals.
