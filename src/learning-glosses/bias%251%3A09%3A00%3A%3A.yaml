simpleMeaning: a one-sided feeling that stops you from judging a matter fairly
scope: A one-sided feeling that blocks fair judgment, also called prejudice; not a slant across cloth
  and not a cut made at an angle.
examples:
- His bias against the new plan kept him from hearing the facts.
- The judge warned the jury to set aside any bias.
