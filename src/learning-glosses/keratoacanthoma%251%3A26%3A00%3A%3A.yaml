senseId: 'keratoacanthoma%1:26:00::'
synsetId: 14262579-n
simpleMeaning: In older people above all, a skin lump shoots up fast, looks like a cancer yet stays put,
  then usually fades on its own and often leaves a mark.
scope: This fast-growing skin lump looks like cancer but does not spread, and it usually goes away on
  its own.
examples:
- The keratoacanthoma grew fast and then faded away on its own.
- Her keratoacanthoma left a mark after it faded away.
