simpleMeaning: a count of how fast a computer works, equal to one thousand million sums with decimal points
  in one second
scope: Also called billion floating point operations per second, this is a speed measure for a computer,
  not a count of how much it can store and not a measure of power use.
examples:
- The new machine runs at several gigaflops.
- A gigaflop means the computer can do a billion such sums in one second.
