simpleMeaning: Letters and messages from officers, workers and soldiers are read by the armed forces when
  those people are not already under the first kind of checking.
scope: This is the armed forces' checking of personal letters and messages, and the first kind of checking
  is called primary censorship.
examples:
- Secondary censorship meant every letter home was read before it was sent.
- Under secondary censorship, an officer's phone calls could be listened to by the army.
