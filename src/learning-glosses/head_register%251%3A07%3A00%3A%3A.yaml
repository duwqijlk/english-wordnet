senseId: 'head_register%1:07:00::'
synsetId: 05134415-n
simpleMeaning: A singer or speaker who uses the high part of the range feels the high sung notes shake
  in the top of the skull
scope: The high range of the voice in speaking or singing, also called head tone and head voice, not the
  low range of the voice and not the chest voice.
examples:
- Her head register was clear and bright on the highest notes.
- The teacher asked him to sing the phrase in head register.
