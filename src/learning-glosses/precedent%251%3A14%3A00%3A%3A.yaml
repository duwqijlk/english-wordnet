simpleMeaning: a system of law based on earlier court decisions rather than on written laws
scope: This is a system of law that follows earlier court decisions rather than written laws, not a single
  past case and not a law passed by a government.
examples:
- Under precedent, judges look to earlier decisions when they rule on a case.
- Under this system, judges follow precedent instead of looking only at written laws.
