simpleMeaning: You look through a small lens in a tool that shows far-off things, and in its flat face
  lie fine lines, dots, crossed hairs, or wires.
scope: Also called graticule and reticle, it is a set of fine lines, dots, crossed hairs, or wires in
  the flat face of the lens you look through in a tool that shows distant things, not a woman's drawstring
  handbag.
examples:
- The reticule in the telescope showed a set of fine lines.
- Looking through the reticule, the fine lines crossed over the moon.
