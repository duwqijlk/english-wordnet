simpleMeaning: to make something less hard to follow or to do, or to cut down how much of it there is
scope: To make a thing less hard to follow or do, or smaller in scope, not to take words out of a text,
  and not to make a person less able.
examples:
- We had to simplify the instructions before anyone could follow them.
- This move will simplify our lives a great deal.
