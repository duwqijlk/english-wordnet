simpleMeaning: a person who is so bad that other people are surprised and upset
scope: A very bad person, not a bad event, not a bad piece of news, and not a scary story.
examples:
- Everyone called him a shocker after he cheated his own friends.
- She was a real shocker, lying to everyone at work.
