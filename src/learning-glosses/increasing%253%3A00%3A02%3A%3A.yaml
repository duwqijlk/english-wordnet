simpleMeaning: in music, becoming faster in tempo, louder in volume, or both
scope: This is a musical change in speed or loudness, not simply becoming greater or larger in size or
  amount.
examples:
- The orchestra played with increasing volume as the movement reached its climax.
- The conductor called for an increasing tempo in the final bars.
