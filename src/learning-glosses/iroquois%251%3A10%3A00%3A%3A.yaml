simpleMeaning: A family of the tongues of the North American Indians, spoken by the people of that name.
scope: A family of the tongues of the North American Indians, spoken by the people of that name, also
  called Iroquoian and Iroquoian language; not the people themselves.
examples:
- Iroquois is a family of tongues spoken by the Iroquois people.
- The Iroquois tongues are spoken in North America.
