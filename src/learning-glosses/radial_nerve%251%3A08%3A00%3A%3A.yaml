simpleMeaning: The largest branch of the shoulder's nerve network; it runs down the upper-arm bone, splits
  at the outer elbow, and reaches skin on the hand's back and straightening muscles below.
scope: Another name for the musculospiral nerve (also called nervus radialis); the arm's large nerve,
  not the median or ulnar nerve.
examples:
- The radial nerve runs down the arm beside the upper-arm bone.
- A branch of the radial nerve supplies the skin on the back of the hand.
