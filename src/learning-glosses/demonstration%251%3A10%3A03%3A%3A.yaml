simpleMeaning: A proof that works through a chain of points, each one leading to the next, until the claim
  is shown true
scope: A proof worked out by a chain of points that shows a claim is true, not a show in which a thing
  is put before people's eyes.
examples:
- His demonstration of the rule took three pages of working.
- The demonstration left no doubt about the answer.
