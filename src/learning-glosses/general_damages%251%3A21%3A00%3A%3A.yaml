simpleMeaning: In law, losses that can be clearly shown to have happened bring money to the hurt person,
  who has a right to it.
scope: Also called actual damages or compensatory damages, this is the money a hurt person has a right
  to receive for losses that can be clearly shown to have happened.
examples:
- The court gave her general damages for the losses she could prove.
- His general damages covered the harm the crash had caused.
