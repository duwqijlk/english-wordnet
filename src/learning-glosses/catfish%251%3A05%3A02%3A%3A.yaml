simpleMeaning: large fierce fish of the northern deep sea, eaten as food, with strong teeth and no fins
  on the belly
scope: Large fierce deep-sea food fish; not the fresh-water bottom fish with whiskers.
examples:
- Catfish with strong teeth hunt in the deep sea.
- The catfish had no fins on its belly.
