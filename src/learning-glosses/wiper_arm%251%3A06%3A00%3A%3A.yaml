simpleMeaning: a moving metal bar in a switch that turns over a row of fixed points and stops at one of
  them to make a connection
scope: 'Also called a wiper or a contact arm: a moving part in a switch, not a windscreen wiper and not
  a part of the human arm.'
examples:
- The wiper arm in the old switch had worn down and no longer made good contact.
- Turn the dial slowly until the wiper arm rests on the outlet you need.
