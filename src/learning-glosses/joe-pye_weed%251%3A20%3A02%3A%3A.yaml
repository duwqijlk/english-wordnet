simpleMeaning: A herb of North America with leaves in rings round the stem and bunches of flowers spotted
  with purple at the top
scope: This is a North American herb with ringed leaves and flower bunches spotted with purple; marsh
  milkweed, purple boneset, trumpet weed and Eupatorium purpureum are other names for this sense, unlike
  the kind with small pinkish or purple flower heads.
examples:
- Joe-Pye weed by the pond had flowers spotted with purple.
- Joe-Pye weed in the garden had whorled leaves and flowers spotted with purple.
