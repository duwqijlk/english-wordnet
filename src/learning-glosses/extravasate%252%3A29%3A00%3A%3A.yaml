simpleMeaning: to make hot melted rock flow out, as lava flows out of a volcano
scope: To make hot melted rock pour out, not to burst out on its own and not to leak blood from a vessel.
examples:
- The pressure inside the mountain made it extravasate lava.
- Heat from below caused the crater to extravasate molten rock.
