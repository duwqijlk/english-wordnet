simpleMeaning: a driver in a motor race who reaches the end of the race
scope: A driver in a motor race who reaches the end of the race, not a driver who drops out, not a painter
  who puts on the last coat, and not a race car.
examples:
- Only six finishers crossed the line in the wet race.
- He was a steady finisher, rarely crashing out.
