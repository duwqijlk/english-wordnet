simpleMeaning: the act of twisting something, or of changing the shape of something, for example yourself
scope: 'Also called contortion: the act of twisting something out of its usual shape, not the change in
  shape that comes from force put on a thing.'
examples:
- The deformation of his body as he twisted into the small box amazed the crowd.
- Deformation of the soft metal took place as she twisted it with her hands.
