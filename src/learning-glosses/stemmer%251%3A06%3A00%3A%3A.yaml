simpleMeaning: a tool that takes the stalks off fruit, such as grapes or apples
scope: This is a tool that takes stalks off fruit, not a miner's bar for packing a blast and not a worker
  who puts stalks on fake flowers.
examples:
- The stemmer stripped the stalks from a crate of grapes.
- She used a stemmer to clean the apples before cooking.
