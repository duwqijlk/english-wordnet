simpleMeaning: A butterfly like the banded purple, but with red spots on the undersides of the wings.
scope: It is a butterfly like the banded purple, not the banded purple itself and not a plain purple butterfly;
  also called red-spotted purple.
examples:
- Limenitis astyanax has red spots under its wings.
- The Limenitis astyanax looked like the banded purple.
