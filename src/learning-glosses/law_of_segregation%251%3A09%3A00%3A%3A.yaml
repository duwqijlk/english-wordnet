simpleMeaning: Each sex cell gets just one of a matching pair of threads, since the two threads part and
  go to different sex cells when sex cells form.
scope: This rule says that when sex cells form, the two matching threads part, so each sex cell gets just
  one of the pair.
examples:
- Under the law of segregation, the two matching threads parted, and each sex cell took one.
- The law of segregation means a sex cell never gets both threads of a matching pair.
