simpleMeaning: a male soldier of low rank who looks after his unit's office work after the day staff have
  gone
scope: A low-rank soldier who looks after his unit's office work after the day staff have gone, not the
  officer who leads the unit and not a guard on night watch.
examples:
- The charge of quarters stayed late to file the unit's papers.
- Ask the charge of quarters if you need the duty roster tonight.
