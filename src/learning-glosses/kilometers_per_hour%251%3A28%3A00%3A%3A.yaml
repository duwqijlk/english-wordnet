synsetId: 15304947-n
simpleMeaning: A thing moving for sixty minutes covers a length, and that length is its speed
scope: A speed got by dividing the length covered by the time taken, with time counted in sixty-minute
  units; also called kilometres per hour, km/h and kph, not a speed counted in seconds.
examples:
- The car drove at 60 kilometers per hour.
- The speed limit is 50 kilometers per hour on this road.
