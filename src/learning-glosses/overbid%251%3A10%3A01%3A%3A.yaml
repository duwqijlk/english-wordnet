simpleMeaning: In bridge, a call higher than the other side's call, above all when your partner has not
  called at all and your call tops what your hand is worth
scope: 'Also called overcall: in bridge, a call higher than the other side''s call, not a low call and
  not a pass.'
examples:
- His overbid in bridge was higher than the other side's call.
- She made an overbid although her cards were weak.
