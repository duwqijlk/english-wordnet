simpleMeaning: All the parts that deal with words and speech sit together in a big part of the brain's
  outer layer, on the left side in most people
scope: A big part of the brain holding all the parts for words and speech, also called language area;
  not the whole brain and not a part for sight or movement.
examples:
- The language zone holds the parts of the brain used for speech.
- In most people, the language zone is on the left side of the brain.
