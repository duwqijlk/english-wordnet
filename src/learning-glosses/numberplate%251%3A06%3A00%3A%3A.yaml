simpleMeaning: A plate fixed on the front and back of a car, with the car's own mark of letters and figures
  on it
scope: A plate fixed on the front and back of a car, with the car's own mark of letters and figures on
  it, with license plate as another name for this sense; not a maker's badge, and not a plate inside the
  car.
examples:
- The numberplate was dirty and hard to read.
- Every car must show a numberplate front and back.
