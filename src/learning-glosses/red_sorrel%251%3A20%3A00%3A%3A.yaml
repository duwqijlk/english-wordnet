senseId: 'red_sorrel%1:20:00::'
synsetId: 12200149-n
simpleMeaning: A sparsely prickly East Indian plant, an annual herb or a long-lived low shrub, widely
  grown for fleshy flower cups, used in tarts and jelly, and for stem fibre.
scope: This is the hibiscus grown for its fleshy flower cups; roselle, rozelle and sorrel (in this sense)
  are other names for the same plant. It is not the weedy sorrel picked as a table green, nor the wood-sorrel
  of the genus Oxalis.
examples:
- Red sorrel gives tarts a bright, tart flavour.
- Farmers in the region grow red sorrel for its fleshy calyxes.
