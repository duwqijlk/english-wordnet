simpleMeaning: In physics, connected with a material that is weakly drawn to a magnet
scope: In physics, this describes a material weakly drawn to a magnet, not a material strongly drawn to
  a magnet and not a material pushed away from a magnet.
examples:
- The paramagnetic sample moved slightly toward the magnet.
- The paramagnetic metal was drawn only weakly to the magnet.
