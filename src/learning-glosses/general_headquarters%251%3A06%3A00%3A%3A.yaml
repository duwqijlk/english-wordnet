simpleMeaning: the main army base from which the top officer runs and plans the work of the troops
scope: 'Also called a command post: the main base where a commander runs an army, not a small local base
  and not the home office of a firm.'
examples:
- The general headquarters moved to a hill behind the front line.
- Orders for the whole army came from general headquarters.
