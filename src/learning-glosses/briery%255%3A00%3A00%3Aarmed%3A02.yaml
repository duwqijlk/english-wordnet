simpleMeaning: Sharp bits such as barbs, quills, spines, thorns, or stiff hairs and the like cover it
  and guard it
scope: Prickly, bristled, barbed, thorny, bristly, spiny, burred, barbellate, briary, burry, setaceous,
  and setose are other names for what is said of a plant or animal with sharp bits that guard it.
examples:
- The briery stems scratched her arms.
- A briery thicket blocked the path.
