simpleMeaning: It moves in a curve shaped like the letter S, this small, pale desert snake with a rattle,
  found in the dry southwest of the United States.
scope: This small pale desert snake moves in an S-shaped curve, and is also called a horned rattlesnake.
examples:
- The sidewinder moved in an S-shaped curve.
- A sidewinder is a small pale rattlesnake of the desert southwest.
