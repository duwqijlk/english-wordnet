simpleMeaning: a thing put together from separate parts and treated as one whole
scope: 'Covers an assembled whole viewed as one thing; distinct from unit%1:17:00:: (a natural piece inside
  a substance), unit%1:09:00:: (a plain undivided whole), unit%1:24:00:: and unit%1:14:00:: (a part or
  group within a larger whole), and unit%1:23:00:: (a standard of measurement).'
examples:
- The engine has hundreds of parts, yet we talk about it as one unit.
- The sofa comes in sections, but the store sells it as a single unit.
