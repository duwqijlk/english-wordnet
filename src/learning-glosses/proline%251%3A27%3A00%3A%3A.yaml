simpleMeaning: A small part that makes up protein, found in many proteins and most often in collagen
scope: One of the small parts that make up protein, most often found in collagen; not a whole protein
  and not a vitamin.
examples:
- Proline is found in the collagen of skin and bone.
- The body uses proline to build proteins.
