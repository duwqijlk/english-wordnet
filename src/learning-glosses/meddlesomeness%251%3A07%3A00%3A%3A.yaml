senseId: 'meddlesomeness%1:07:00::'
synsetId: 04845162-n
simpleMeaning: Pushing behaviour shown by stepping in and putting forward yourself or your ideas when
  no one asked you to
scope: Pushing oneself into other people's business without being asked; intrusiveness and officiousness
  are other names for this, not helpful advice offered when asked and not honest plain speaking.
examples:
- Her meddlesomeness annoyed the whole office.
- His meddlesomeness led him to offer advice nobody wanted.
