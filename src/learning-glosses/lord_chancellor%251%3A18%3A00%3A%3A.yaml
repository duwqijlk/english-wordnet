simpleMeaning: The courts are led by the top officer of the king or queen, who also chairs the upper house
  of Parliament
scope: Also called lord high chancellor, this is the top officer of the king or queen in Britain, not
  an ordinary judge and not a member of the lower house.
examples:
- The lord chancellor opened the new session in the upper house.
- As lord chancellor, she led the courts and chaired the debates.
