senseId: 'irritability%1:12:00::'
synsetId: 07568195-n
simpleMeaning: a feeling of being easily annoyed and ready to complain in a childish, bad-tempered way
scope: This feeling, also called petulance; it is not a lasting habit of showing anger you cannot control,
  and not a body part that reacts too strongly.
examples:
- His irritability grew when the noise would not stop, and he snapped at everyone.
- She felt a wave of irritability and spoke sharply to her brother over a small mistake.
