simpleMeaning: A message to the public that usually gives advice about a danger or warns people about
  it
scope: This is a public warning message, not a word for giving advice in general and not a group that
  gives advice.
examples:
- The weather service put out a frost advisory.
- An advisory warned drivers about ice on the road.
