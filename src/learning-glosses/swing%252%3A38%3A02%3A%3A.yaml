simpleMeaning: To move in a curved path, often in order to hit something.
scope: The curved movement itself, not the aimed hit of a sweeping arm, a swaying walk, or a wide expressive
  gesture.
examples:
- She swung the bat at the ball.
- He took a step and swung his fist at the door.
