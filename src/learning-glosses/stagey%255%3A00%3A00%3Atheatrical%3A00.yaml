simpleMeaning: With the marks of the stage, especially a put-on, stiff air.
scope: Of a performance with the artificial, mannered quality of the stage, as stagy heroics.
examples:
- The acting was stagey, with the marks of the stage.
- The scene was stagey, with a put-on, stiff air.
