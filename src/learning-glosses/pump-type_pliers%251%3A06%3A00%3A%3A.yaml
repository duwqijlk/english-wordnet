simpleMeaning: A gripping tool, often used to hold and turn nuts, bolts and pipe joints.
scope: A gripping tool for nuts and bolts, not a cutting tool and not a tool for wood.
examples:
- He used the pump-type pliers to turn a stuck bolt.
- These pump-type pliers grip pipe joints well.
