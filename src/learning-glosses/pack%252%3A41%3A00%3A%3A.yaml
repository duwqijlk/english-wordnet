simpleMeaning: To fill a committee or lawmaking body with your own supporters so that its decisions go
  your way.
scope: This is about loading a group with allies to control how it decides, not about filling a container
  to capacity or about a close circle of people with shared aims.
examples:
- The mayor tried to pack the oversight board with loyal allies.
- Critics said the party had packed the committee before the vote.
