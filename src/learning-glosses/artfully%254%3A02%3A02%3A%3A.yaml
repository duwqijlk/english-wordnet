simpleMeaning: in a sly, clever way that is not open or clear
scope: 'Also called slyly, cunningly and craftily: this is a sly, hidden way of acting, not the sense
  of doing something with skill.'
examples:
- She artfully hid her plan while smiling at her rivals.
- He artfully got others to do his work without them noticing.
