senseId: slavish%5:00:00:servile:00
synsetId: 00794246-s
simpleMeaning: completely ready to obey others and do whatever they say, like a slave or a servant who
  has no choice
scope: Submissive and subservient are other names for this sense, which means obeying others completely,
  like a slave or a servant, not just being polite or doing a job well for someone.
examples:
- He was a slavish follower and agreed with everything his boss said.
- Her slavish obedience meant she never questioned an order, however unfair.
