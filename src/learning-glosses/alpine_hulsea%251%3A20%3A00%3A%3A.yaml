simpleMeaning: In the northwest of the United States grows a low clump of a plant with hairy stems, each
  topped by a flower head of short narrow yellow rays.
scope: Also called alpine gold, this is a low clump of a plant with yellow-rayed flower heads in the northwest
  of the United States.
examples:
- The alpine hulsea grows in the northwest of the United States.
- Each alpine hulsea stem is topped by a flower head with short narrow yellow rays.
