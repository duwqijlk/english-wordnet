simpleMeaning: a cloth pad holding ground black seed, put on the skin to redden it and ease pain in another
  part
scope: 'Also called a sinapism: a cloth pad holding ground black seed, put on the skin to redden it and
  ease pain in another part; not a sticking plaster for cuts and not a mustard sauce.'
examples:
- The nurse put a mustard plaster on his chest.
- A mustard plaster reddened the skin.
