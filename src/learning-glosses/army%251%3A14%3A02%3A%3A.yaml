simpleMeaning: The land force of the United States of America; the part of the government that puts together
  and trains soldiers for war on land.
scope: The land force of the United States, also called the U. S. Army, the United States Army, the US
  Army, or the USA; not the army of another country, and not a large group of things.
examples:
- The Army trains soldiers for land war.
- He joined the Army.
