simpleMeaning: Money and other things worth much are moved from place to place in this truck, whose sides
  are thick metal plates and whose doors shut with strong locks.
scope: Also called armoured car, this truck is the one banks use when money and things worth much must
  move under strong locks.
examples:
- The bank sent an armored car to fetch the cash from the shops.
- An armored car waited outside the museum while the paintings were loaded.
