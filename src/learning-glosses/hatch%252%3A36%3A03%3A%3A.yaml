simpleMeaning: to set thin lines of a different material, such as gold or silver, into a surface to make
  it pretty
scope: To set thin lines of a different material, such as gold or silver, into a surface to make it pretty,
  not a door or cover and not a pattern of crossing lines.
examples:
- The craftsman hatched the box with silver lines.
- She hatched the frame with gold.
