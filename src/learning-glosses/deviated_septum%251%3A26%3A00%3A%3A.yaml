senseId: 'deviated_septum%1:26:00::'
synsetId: 14116407-n
simpleMeaning: A wall that divides two hollow spaces, moved out of its normal place, usually the wall
  inside the nose
scope: A dividing wall that has shifted from where it should be, usually in the nose, not a broken bone
  and not a blocked nose.
examples:
- A deviated septum made it hard for him to breathe through one side of his nose.
- The doctor said her deviated septum was the cause of the snoring.
