simpleMeaning: parts of a plant with soft stems that people can eat, such as its seeds, roots, stems,
  leaves, bulbs, tubers, and fruits that are not sweet
scope: The eatable parts of a plant with soft stems, not the whole plant itself and not sweet fruit eaten
  as fruit.
examples:
- We grew vegetables in the garden and ate their leaves and roots.
- The market sold vegetables such as carrots, onions, and beans.
