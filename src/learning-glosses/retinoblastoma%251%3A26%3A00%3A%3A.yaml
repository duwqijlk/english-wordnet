simpleMeaning: Built of early small round eye cells, a harmful growth in the eye usually shows up before
  a child turns three
scope: It is a harmful growth in the eye of a young child, not a lump on the skin and not a harmless growth.
examples:
- Retinoblastoma usually shows up before a child turns three.
- The child's retinoblastoma was made of small round eye cells.
