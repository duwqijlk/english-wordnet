simpleMeaning: one high-energy light particle becomes two small bits with opposite electric charges, a
  negative one and a positive one, as it passes an atom's core
scope: 'Also called pair creation and pair formation: a light particle turning into two charged bits near
  an atom''s core, not two things made as a set in a factory.'
examples:
- Pair production needs a gamma ray to pass close to an atomic nucleus.
- In pair production, a single light particle turns into an electron and a positron.
