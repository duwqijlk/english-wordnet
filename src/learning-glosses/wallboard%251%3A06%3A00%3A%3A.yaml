simpleMeaning: Plaster, wood pulp, or other stuff is most often made into wide flat sheets that cover
  the sides of rooms and the dividers between them inside homes.
scope: Also called drywall and dry wall, it is the wide flat sheet, most often of plaster, wood pulp,
  or other stuff, that covers the sides of rooms inside homes.
examples:
- To form the inside faces of the new rooms, wallboard was put up.
- A sheet of wallboard covered the bare frame where the new wall would go.
