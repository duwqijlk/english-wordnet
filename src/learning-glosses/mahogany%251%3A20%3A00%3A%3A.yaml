simpleMeaning: Any of several tropical timber trees of the Meliaceae family, above all the genus Swietinia,
  valued for hard yellowish- to reddish-brown wood, easy to shape and taking a high shine.
scope: A tropical timber tree, not the wood it gives.
examples:
- Mahogany trees grow in the warm forests of Central America.
- The garden was planted with young mahogany trees.
