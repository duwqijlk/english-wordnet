simpleMeaning: a cone-shaped toy for a child, with a sharp steel tip at the bottom that lets it turn round
  and round on the spot
scope: A cone-shaped toy for a child, also called top, whirligig and teetotum; not a toy that rolls and
  not a game with cards.
examples:
- He wound the string round the spinning top and let it go.
- The spinning top stayed up on its steel point as it turned.
