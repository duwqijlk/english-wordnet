simpleMeaning: A powder made by grinding the seeds and pods of the tree that shares its name, used instead
  of chocolate.
scope: A powder, also called carob powder, ground from the seeds and pods of the carob tree; not the long
  pod itself, holding small beans and sweetish pulp that can be eaten, fed to animals and the source of
  a chocolate substitute, and not the evergreen Mediterranean tree, named in the Bible, that bears pods
  that can be eaten.
examples:
- She stirred carob into the cake mix instead of cocoa.
- The health food shop sells carob in large bags.
