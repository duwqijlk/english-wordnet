senseId: 'filibuster%2:41:00::'
synsetId: 02471919-v
simpleMeaning: To block a thing on purpose by dragging it out.
scope: To block a thing on purpose by dragging it out; not a lawmaker who makes long speeches to delay
  or block a bill they oppose, nor a trick of delaying or blocking a bill by making long speeches.
examples:
- They would filibuster the bill for weeks.
- The senator began to filibuster at noon.
