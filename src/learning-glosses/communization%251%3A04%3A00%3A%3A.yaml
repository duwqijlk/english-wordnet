simpleMeaning: Putting a whole nation in order so that it is run on the basis of communism
scope: The setting up of a nation on the basis of communism, also called communisation; not a change from
  private property to public property, which is the other sense of this word.
examples:
- Communization changed how land was owned in the country.
- The new government began the communization of farms and factories.
