simpleMeaning: the sharp point at the front of an arrow, made to hit its mark
scope: The striking point of an arrow, not the whole arrow and not a plant with arrow-shaped leaves.
examples:
- He found a stone arrowhead in the field.
- The arrowhead was sharp enough to pierce hide.
