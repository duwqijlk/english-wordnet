simpleMeaning: First put up in old Rome to mark a boundary, a square post in building work is topped with
  a statue, a head-and-shoulders likeness, or a beast.
scope: People also call it a term or a terminus, and it is a square post in building work topped with
  a statue, a head-and-shoulders likeness, or a beast.
examples:
- A terminal figure stood at each end of the garden wall.
- The terminal figure at the gate was a stone bust.
