simpleMeaning: A place with washing machines that people pay for with coins and use themselves to wash
  their clothes
scope: 'Also called Laundromat: a place to wash your own clothes with coin machines, not a service where
  workers wash clothes for you and not a machine at home.'
examples:
- I took my dirty clothes to the launderette on the corner.
- The launderette stays open late so workers can wash clothes after work.
