simpleMeaning: the number you get when you divide the distance round a circle by the distance across it,
  about 3.14159265358979323846
scope: The number got by dividing a circle's round measure by its across measure, not the round measure
  itself and not the across measure.
examples:
- pi is about 3.14, the number we use for circles.
- We used pi to work out the area of the circle.
