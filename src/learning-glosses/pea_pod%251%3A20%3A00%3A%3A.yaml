simpleMeaning: The thin skin round the small green seeds of a garden plant, which can be eaten in some
  kinds
scope: 'Also called a peasecod: the thin skin round the small green seeds of a garden plant, which can
  be eaten in some kinds, not the seeds themselves and not the skin of a bean.'
examples:
- She shelled the pea pods for dinner.
- Some pea pods are sweet enough to eat whole.
