simpleMeaning: a cover worn over a shoe that does not let water in and keeps the shoe safe from water
  or snow
scope: 'Also called rubber, galosh, golosh, and gumshoe: a cover worn over a shoe to keep it dry, not
  the cold area around the North Pole.'
examples:
- She wore an arctic over each shoe in the deep snow.
- He pulled his arctics on before walking through the wet snow.
