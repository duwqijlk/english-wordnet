simpleMeaning: A religion of northern Asia that holds spirits live in all things, and that go-betweens
  carry messages between the world we see and the spirit world
scope: This is a religion of northern Asia built on spirits in all things, not a religion with one god
  and not a religion of southern Asia; shamanism is another name for this sense.
examples:
- Asian shamanism teaches that spirits live in trees and stones.
- Followers of Asian shamanism turn to a shaman in times of trouble.
