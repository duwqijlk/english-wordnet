simpleMeaning: A strong join at the side that holds two chains of atoms next to each other in a big molecule.
scope: This is a side bond joining two chains of atoms, not the act of joining them; also called cross-linkage.
examples:
- A cross-link holds the two chains together.
- The molecule has many cross-links.
