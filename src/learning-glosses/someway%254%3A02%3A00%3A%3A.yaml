simpleMeaning: in a way that is not said, or by a way of doing it that is not said
scope: 'Also called somehow: it is about how a thing is done when the way is not said, not about where
  it is done or how much is done.'
examples:
- They managed someway to finish the work in time.
- He tried someway to make the plan work for everyone.
