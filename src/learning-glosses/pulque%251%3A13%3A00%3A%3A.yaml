simpleMeaning: A drink from Mexico made from the juice of different kinds of agave plants, a kind of thick-leaved
  plant, left to turn into alcohol, most of all from the maguey
scope: A drink made from agave juice that has been left to turn into alcohol, not a beer or a wine and
  not plain juice.
examples:
- They served pulque in clay cups at the feast.
- The pulque was made from the juice of the maguey plant.
