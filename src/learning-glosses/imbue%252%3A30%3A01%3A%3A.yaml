senseId: 'imbue%2:30:01::'
synsetId: 00457106-v
simpleMeaning: to let a feeling, idea, or liquid spread right through a thing, so that the whole of it
  takes it in
scope: Also called soak; not just wetting the outside of a thing, but filling the whole of it right through.
examples:
- The story is imbued with a sense of loss.
- He imbued the cloth with dye.
