simpleMeaning: Ordinary white metal gives way to a powdery grey metal in very cold weather.
scope: Also called tin disease and tin plague, it is what ordinary white metal becomes in very cold weather.
examples:
- In very cold weather, tin pest turns white metal grey and powdery.
- The white metal went grey and powdery with tin pest.
