simpleMeaning: The lip of this wildflower swells into a pouch; it is one of several kinds from the Americas,
  and gardeners find it hard or impossible to grow.
scope: This wildflower from the Americas, also called ladies' slipper, lady's-slipper, lady-slipper, lady
  slipper, and slipper orchid, is one of several kinds with a lower lip that swells into a pouch, and
  gardeners find it hard or impossible to grow.
examples:
- We found lady's slippers in the woods.
- The lady's slipper we planted did not last the summer.
