simpleMeaning: any hard fight or contest between two skilled people, or between two groups of people
scope: This is a hard fight or contest between two skilled sides; it is not the planned fight with deadly
  weapons used in the past to settle a matter of honour.
examples:
- The two chess masters met in a long duel for the world title.
- It was a close duel between the two best tennis players.
