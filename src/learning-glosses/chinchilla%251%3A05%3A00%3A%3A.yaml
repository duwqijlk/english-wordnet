simpleMeaning: a small animal of the rat and mouse group, with soft, light shiny grey fur; it comes from
  the Andes but people keep and breed it for its fur
scope: This is the living animal; it is not its fur sold on its own and not the thick wool and cotton
  cloth with the same name.
examples:
- The chinchilla sat in its cage eating hay.
- Chinchillas have very soft grey fur and come from the Andes.
