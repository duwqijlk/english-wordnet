simpleMeaning: A model that shows what a place looked like long ago, or an animal kind that died out long
  ago
scope: A model that shows a past age or a dead animal kind, not a made thing put back, not the act of
  putting it back, and not the state of being put back.
examples:
- The museum shows a restoration of the valley as it looked a million years ago.
- This restoration shows a great beast that died out long ago.
