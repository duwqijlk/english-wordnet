senseId: 'flightless_bird%1:05:01::'
synsetId: 01520206-n
simpleMeaning: Birds that cannot fly, with flat breastbones lacking a keel, the ridge that flight muscles
  attach to; this group includes ostriches, cassowaries, emus, moas, rheas, kiwis, and elephant birds.
scope: This is the ratite group of running birds with flat, keelless breastbones, not penguins or other
  diving birds that also cannot fly.
examples:
- The ostrich is a flightless bird that can outrun a horse.
- Moas were huge flightless birds that once lived in New Zealand.
