simpleMeaning: A dense, dark grey rock with fine grains, made mostly of two minerals, plagioclase feldspar
  and pyroxene; it is the most common form of solidified lava.
scope: The solid rock after lava cools; not lava while it is still molten.
examples:
- The cliffs are made of dark basalt.
- Basalt cools fast, so its grains are very fine.
