simpleMeaning: a striking bush of the southeastern United States that keeps its leaves all year, with
  glossy leaves, angled branches and pink to reddish flowers in umbrella-like clusters.
scope: This is the showy shrub with glossy leaves, angled branches and pink flower clusters; not another
  Lyonia species or an unrelated shiny-leaved garden shrub.
examples:
- Shiny lyonia grows wild in the sandy woods of the southeastern states.
- Gardeners plant shiny lyonia for its glossy leaves and pink flower clusters.
