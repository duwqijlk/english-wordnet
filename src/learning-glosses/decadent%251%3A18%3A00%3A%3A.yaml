simpleMeaning: a person whose way of living or whose art has become bad, weak, and low after being better
  before
scope: A person who has gone low in how they live or in their art, not the word that describes such a
  low way of living.
examples:
- He became a decadent who spent all his money on pleasure and made no serious art.
- The painter was once great, but as a decadent he stopped doing real work.
