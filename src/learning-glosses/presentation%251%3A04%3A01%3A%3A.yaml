simpleMeaning: the act of giving something, such as a prize or a reward, in a formal way
scope: This is about formally giving a prize or reward, not showing something to people, not putting news
  out in print, and not putting a plan to people to accept.
examples:
- At the presentation, the mayor gave the winner a gold medal.
- She made the presentation of the prize to the best student.
