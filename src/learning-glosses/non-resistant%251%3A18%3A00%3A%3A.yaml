simpleMeaning: A person who works to change things by refusing to fight back
scope: A person who works for change by refusing to fight back, with passive resister as another name
  for this sense, not a person who uses force and not a person who gives in.
examples:
- The non-resistant leader told his people to sit in the road and not fight back.
- She was a non-resistant who would not raise a hand against anyone.
