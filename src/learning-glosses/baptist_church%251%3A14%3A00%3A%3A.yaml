simpleMeaning: Any of several Protestant groups that stress the good news and hold that only people who
  choose for themselves should be baptised.
scope: This is any of several Protestant groups that stress the good news and hold that only people who
  choose for themselves should be baptised; Baptists is another name for it, and it is not a church that
  baptises babies or a Catholic church.
examples:
- The Baptist Church down the road baptises only people who choose for themselves.
- She joined a Baptist Church that stresses the good news.
