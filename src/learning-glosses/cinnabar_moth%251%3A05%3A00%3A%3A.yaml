scope: A big red-and-black flying insect of Europe whose young eat ragwort leaves, brought to the United
  States to keep ragwort down; cinnabar is another name for this sense, not the red stone of the same
  name and not other red-and-black moths.
examples:
- The cinnabar moth is red and black.
- Cinnabar moths were set free to eat ragwort.
