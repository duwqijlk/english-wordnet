simpleMeaning: Describes a person who gives in far too much to physical pleasures, especially drinking
  alcohol.
scope: This describes excessive appetites in a person, not the sound of speech or the strength of a drink.
examples:
- He was a hard drinker who went through several bottles a week.
- Her hard-living uncle spent his nights eating and drinking to excess.
