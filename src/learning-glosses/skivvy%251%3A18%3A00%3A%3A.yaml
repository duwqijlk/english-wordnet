simpleMeaning: a woman hired to work in someone's home, doing all kinds of low house jobs
scope: A woman paid to do all kinds of house work in another person's home; not a worker hired for one
  job only, such as a cook.
examples:
- In the big house, the skivvy cleaned, washed, and carried coal all day.
- They treated the young skivvy badly and gave her the worst jobs in the house.
