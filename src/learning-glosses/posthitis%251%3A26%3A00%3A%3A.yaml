simpleMeaning: swelling and soreness of the skin at the end of the penis, usually caused by germs that
  cause illness
scope: Swelling and soreness of the skin at the end of the penis, not swelling of the penis as a whole
  and not a cut or sore from an injury.
examples:
- The doctor said the posthitis was caused by an infection and gave him medicine to treat it.
- He went to the clinic because the posthitis made the skin sore and swollen.
