simpleMeaning: The Jewish rite of cutting a baby boy on the eighth day of his life.
scope: Also called Bris, Berit, Berith, and Briss; this Jewish rite is the cutting of a baby boy on the
  eighth day of his life, not other Jewish rites and not a rite for girls.
examples:
- The Brith was held on the eighth day.
- The family gathered for the Brith.
