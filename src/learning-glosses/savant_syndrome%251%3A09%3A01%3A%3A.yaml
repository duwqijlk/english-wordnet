synsetId: 92417572-n
simpleMeaning: a state in which a person with a mind that works in a different way, such as autism, shows
  very great gifts far beyond what most people can do
scope: A state in which a person with a mental disability shows gifts far beyond the usual, not a sickness
  of the mind alone and not ordinary talent.
examples:
- The boy with savant syndrome can play back a tune after hearing it once.
- People with savant syndrome may work out dates in their heads in seconds.
