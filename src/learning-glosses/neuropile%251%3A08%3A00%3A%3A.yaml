simpleMeaning: A dense mesh of dendrites, bare axons and glial shoots forming the main mass of the head
  web's grey matter, with nerve cell bodies set inside it.
scope: This sense is also called neuropil, for a dense mesh of dendrites, bare axons and glial shoots
