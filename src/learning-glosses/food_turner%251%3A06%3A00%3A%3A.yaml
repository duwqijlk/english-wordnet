simpleMeaning: a kitchen tool with a flat bendy part and a long handle, used to flip things over or to
  serve them
scope: 'Also called a turner: a kitchen tool for flipping over and serving things that are cooking, not
  tongs and not a serving spoon.'
examples:
- She used the food turner to flip the pancakes.
- He slid the food turner under the fish and lifted it onto the plate.
