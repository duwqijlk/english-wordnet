simpleMeaning: In the rocky high lands of Asia and the west of North America lives a small short-eared
  animal that digs burrows.
scope: It is also called a coney, a cony, a pika, or a rock rabbit, and it is a small short-eared animal
  that digs burrows in the rocky high lands of Asia and the west of North America.
examples:
- The mouse hare digs its burrow among the rocks.
- These mouse hares live in the rocky uplands of Asia and western North America.
