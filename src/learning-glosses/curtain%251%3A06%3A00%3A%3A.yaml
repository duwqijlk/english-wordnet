simpleMeaning: a piece of cloth that hangs down, used to cover something and keep out light, especially
  one that covers a window
scope: 'Also called drape: a hanging cloth for a window, not the big cloth that hides the stage in a theatre.'
examples:
- She closed the curtains to keep out the morning light.
- A thin curtain hung over the kitchen window.
