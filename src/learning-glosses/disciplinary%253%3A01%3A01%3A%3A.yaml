senseId: 'disciplinary%3:01:01::'
synsetId: 03072860-a
simpleMeaning: about keeping people's behavior under control and making them follow rules
scope: This sense is about things to do with controlling behavior and following rules, such as problems
  with behavior at school; it is not the sense for an action made to bring about good behavior.
examples:
- The school has many disciplinary problems in its classrooms.
- Teachers met to talk about disciplinary issues among older pupils.
