simpleMeaning: No beat is felt when the lower chambers of the heart stop squeezing, usually because they
  shake out of rhythm, and with no oxygen the person dies in time.
scope: A stop of the lower chambers of the heart, with no beat felt, also called cardiac arrest and cardiopulmonary
  arrest; not a slow weak beat.
examples:
- The monitor showed asystole after the heart stopped.
- Asystole means no beat can be felt at all.
