simpleMeaning: having to do with a continent, or limited to one, especially North America or Europe
scope: This sense is about being on or limited to a continent such as North America or Europe, not about
  the American colonies in the time of the American Revolutionary War.
examples:
- The continental United States does not include Hawaii.
- They travelled through continental Europe by train.
