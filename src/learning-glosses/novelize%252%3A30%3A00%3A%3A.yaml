senseId: 'novelize%2:30:00::'
synsetId: 00116427-v
simpleMeaning: To turn something into a long written story, or to write in the way of such a story.
scope: To turn something into a long written story; novelise is another name for this; not to write a
  story from nothing, and not to turn a story into a film.
examples:
- The author novelized the historical event.
- She novelized her grandmother's letters into a long family story.
