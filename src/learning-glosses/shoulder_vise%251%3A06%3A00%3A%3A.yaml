simpleMeaning: a clamp with jaws lined with soft material that holds wood in place without leaving marks
  on it
scope: A clamp with jaws lined with soft material for holding wood without marking it, also called a wood
  vise and a woodworking vise; not a bench vise and not a metal clamp.
examples:
- He fixed the plank in the shoulder vise before he cut it.
- The shoulder vise held the wood firm without denting it.
