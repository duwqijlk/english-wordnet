simpleMeaning: to find the size, length, weight, or amount of something or someone
scope: Finding the size or amount of something, not judging how good it is and not a pattern of beats
  in music.
examples:
- Measure the length of the wall before you buy the paint.
- She measured the child's height with a tape.
