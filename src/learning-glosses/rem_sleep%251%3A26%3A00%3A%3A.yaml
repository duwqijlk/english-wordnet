simpleMeaning: A stage of rest that comes back again and again, when a person dreams and the eyes shift
  fast
scope: A stage of rest that comes back again and again, when a person dreams and the eyes move fast, also
  called paradoxical sleep, rapid eye movement, rapid eye movement sleep and REM, not deep rest without
  dreams and not the act of waking up.
examples:
- During REM sleep, his eyes moved fast under closed lids.
- She woke from REM sleep in the middle of a dream.
