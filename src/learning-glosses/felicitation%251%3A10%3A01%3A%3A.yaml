simpleMeaning: Usually in the plural, a word of joy at the win or good luck of another.
scope: Usually in the plural, a word of joy at the win or good luck of another; also called congratulation;
  not the act of marking that one has cause to feast.
examples:
- Their felicitation came at dawn.
- The felicitation was given at noon.
