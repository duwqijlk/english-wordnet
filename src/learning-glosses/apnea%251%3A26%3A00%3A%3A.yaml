simpleMeaning: a short stop in a person's breathing
scope: A short stop in a person's breathing; not breathing that is fast, slow, or hard, but breathing
  that stops for a short time.
examples:
- The baby had a short apnea and then started breathing again on her own.
- Doctors watched him through the night because of his apnea.
