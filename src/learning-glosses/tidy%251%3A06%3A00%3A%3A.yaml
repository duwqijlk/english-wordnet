simpleMeaning: a small holder for small loose things, such as pins, thread and other things for sewing
scope: This is a small holder for loose things. It is not the word for a person or place that is neat
  and clean.
examples:
- She kept her needles and thread in a tidy on the table.
- He put the loose buttons into the tidy by the sewing box.
