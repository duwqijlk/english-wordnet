simpleMeaning: To fit a ship out with sails and masts.
scope: Nautical, of fitting out a vessel with sails and masts; it is not the general sense of preparing
  something in advance, nor the everyday sense of putting something in a place, and it is not the phrase
  set sail, which means to depart.
examples:
- The crew set the masts and rigged the ship before the crossing.
- They set a spare mast in the sloop after the storm.
