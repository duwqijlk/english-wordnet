simpleMeaning: This open curve is the cut a flat surface makes through the base of a cone whose tip sits
  straight above the middle of its round base
scope: An open curve made by a flat cut through the base of a cone; not a parabola, a different open curve
  made by cutting a cone, and not a circle.
examples:
- The graph showed a hyperbola opening to the left and right.
- She drew a hyperbola by cutting a paper cone with scissors.
