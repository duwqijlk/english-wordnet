senseId: 'catabolism%1:22:00::'
synsetId: 13464960-n
simpleMeaning: the way living things break down complex substances into simpler ones, giving off energy
  as they do so
scope: 'Also called destructive metabolism, dissimilation, or katabolism: the breaking down of substances
  in living things to free energy, not the building up of substances and not the whole set of chemical
  changes in the body.'
examples:
- After a hard run, catabolism breaks down stored food to give her muscles energy.
- The doctor explained that catabolism releases energy when the body breaks down complex substances.
