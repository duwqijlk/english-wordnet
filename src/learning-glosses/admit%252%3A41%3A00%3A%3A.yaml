simpleMeaning: to let a person take part in something and use the rights, do the work and take on the
  duties that go with it
scope: 'Also called include: to let a person take part with full rights and duties, not to say that something
  is true and not just to let a person into a group.'
examples:
- She was admitted to the medical profession after years of study.
- The board admitted her to the bar, and she could now do the work of a lawyer.
