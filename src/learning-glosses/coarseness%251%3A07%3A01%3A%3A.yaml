senseId: 'coarseness%1:07:01::'
synsetId: 04955899-n
simpleMeaning: The state of a thing being loose or rough to the touch, as cloth can be.
scope: Loose or rough feel in a thing's surface, not the quality of being made up of rather large bits.
examples:
- The coarseness of the old blanket made it scratchy against the skin.
- They chose the cloth in spite of its coarseness, liking its rough, open weave.
