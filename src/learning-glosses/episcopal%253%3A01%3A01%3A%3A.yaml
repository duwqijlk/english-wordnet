simpleMeaning: Said of things that are like the things of that church, or that have to do with that church.
scope: Also called Episcopalian, this word is used of that church and its ways, not of a person who belongs
  to it.
examples:
- The Episcopal church in our town has a tall tower.
- She was married by an Episcopal minister.
