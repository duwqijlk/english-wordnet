simpleMeaning: A slow, tailless Australian tree animal that carries its young in a pouch, with grey furry
  ears and coat, feeding on eucalyptus leaves and bark.
scope: Also called koala, kangaroo bear, koala bear, and native bear; not a bear.
examples:
- The Phascolarctos cinereus slept in the eucalyptus tree all day.
- A Phascolarctos cinereus ate leaves without coming down from the tree.
