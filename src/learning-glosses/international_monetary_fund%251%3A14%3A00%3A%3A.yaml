simpleMeaning: Trade between nations grows when the big currencies keep a steady value, and this body
  of the United Nations works to make that happen.
scope: Also called IMF, this body of the United Nations works for trade between nations, not a bank that
  lends money to people.
examples:
- The International Monetary Fund works to keep the big currencies steady in value.
- Trade grew after the International Monetary Fund helped the currencies hold their value.
