simpleMeaning: music in parts with one main voice standing out above the others
scope: Music in parts with one main voice standing out; not music with many equal voices and not a single
  voice alone.
examples:
- The choir sang in homophony, with the top voice leading.
- Homophony gives one tune the lead while the other parts back it.
