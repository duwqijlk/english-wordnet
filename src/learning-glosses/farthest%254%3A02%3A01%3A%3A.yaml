simpleMeaning: To the greatest degree or extent, or the most advanced stage; the form 'furthest' is used
  more often than this word in this sense
scope: To the greatest degree or extent or most advanced stage, not to the greatest distance in space
  or time.
examples:
- She went the farthest of all the children in her education.
- She goes farthest in helping us.
