simpleMeaning: a roof covering made of thin flat pieces of rock
scope: This sense is the rock pieces used on roofs; it is not the old writing board, and not a list of
  people put forward for an election.
examples:
- They replaced the broken slate on the roof with new pieces.
- Rain ran off the slate roof without leaking.
