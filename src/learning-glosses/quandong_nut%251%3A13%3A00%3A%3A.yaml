simpleMeaning: a seed from a fruit, hard on the outside and good to eat
scope: The seed of a fruit that can be eaten, not the fruit itself and not a nut from a nut tree.
examples:
- She cracked open a quandong nut and ate the seed inside.
- The cook ground quandong nut into flour for the cake.
