simpleMeaning: in a way that people could expect before it happens, or to a degree that people could expect
  before it happens
scope: In a way or to a degree that people could expect before it happens, not in a surprising way and
  not by chance.
examples:
- Predictably, he did not like the news and walked out.
- She predictably arrived late, as she does every week.
