simpleMeaning: in a way that shows very strong feeling and force
scope: 'This says how someone speaks or acts: with very strong feeling. It is not just loud, and not just
  angry; the strong feeling is the main point.'
examples:
- He vehemently denied taking the money.
- She argued vehemently against the new plan.
