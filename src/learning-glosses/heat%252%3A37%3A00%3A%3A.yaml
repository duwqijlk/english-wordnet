synsetId: 01764964-v
simpleMeaning: To heat people is to stir up strong feelings and passions in them.
scope: This is a figurative use of heat and has nothing to do with temperature or warming a room. The
  noun sense 'intense emotion' is the feeling itself, while this verb means to stir that feeling up in
  other people. It is literary and rather rare, and modern writers often prefer 'inflame' or 'stir up'.
examples:
- The speaker's words heated the crowd until they were ready to fight.
- Nothing heats the blood like an old injustice.
