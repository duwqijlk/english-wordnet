simpleMeaning: An African gnawing animal that lives underground and has the looks and ways of a small
  animal that digs in the earth
scope: An African gnawing animal that lives underground and has the looks and ways of a small animal that
  digs in the earth; not the scaly-tailed burrowing rat of India and not the furry tailless rodent of
  eastern Europe and the Middle East.
examples:
- The mole rat spent the day digging in the dry earth.
- A mole rat pushed fresh soil out of its burrow.
