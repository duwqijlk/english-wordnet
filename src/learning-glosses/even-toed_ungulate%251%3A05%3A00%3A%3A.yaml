simpleMeaning: A mammal whose young grow inside its mother, with feet that have hard horn coverings and
  a number of working toes on each foot that splits into two equal parts.
scope: A mammal whose young grow inside its mother, with hooves and a number of working toes that splits
  into two equal parts; also called an artiodactyl or an artiodactyl mammal, not a horse and not a rhinoceros.
examples:
- The deer is an even-toed ungulate with two toes on each foot.
- Even-toed ungulates include pigs, deer, and cattle.
