simpleMeaning: A plant of Europe now settled in North America, with yellow flowers and pods curved like
  a sickle.
scope: Sickle alfalfa, sickle lucerne and sickle medick are other names for this sense; it is not the
  low herb with small yellow flowers and curved black pods.
examples:
- Medicago falcata was growing wild along the road in North America.
- The Medicago falcata pods were curved like little sickles.
