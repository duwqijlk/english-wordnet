simpleMeaning: to tie or hold something firmly with a rope, string, or cord
scope: 'Also called tie: to fasten with a real rope, string, or cord, not to make a person owe a duty,
  and not the wider sense of making something fast in any way.'
examples:
- She used a cord to bind the sticks together into a tight bundle.
- He binds each package with string so the paper stays in place.
