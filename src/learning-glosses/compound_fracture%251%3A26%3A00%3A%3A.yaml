simpleMeaning: A break in a bone where the soft flesh is torn or the skin is open
scope: A break in a bone where the soft flesh is torn or the skin is open; open fracture is another name
  for this sense, not a clean break with the skin whole and not a bruise.
examples:
- The compound fracture tore the soft flesh and left the skin open.
- Doctors set the compound fracture and cleaned the open wound.
