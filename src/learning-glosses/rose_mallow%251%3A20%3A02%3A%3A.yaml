simpleMeaning: Showy flowers in white, pink, or purple grow in bunches at the tips of this plant's stems;
  it is the hollyhock of English cottage gardens.
scope: A plant with showy white, pink, or purple flowers in bunches at the stem tips, the hollyhock of
  English cottage gardens, not the salt-marsh shrub of the same name.
examples:
- Rose mallow flowers grow in bunches at the tips of the stems.
- This rose mallow is a hollyhock of the English cottage garden.
