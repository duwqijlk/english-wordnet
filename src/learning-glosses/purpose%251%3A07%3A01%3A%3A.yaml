simpleMeaning: The quality of being firmly determined to do or achieve something.
scope: This is not the aim or result someone wants to reach; it is the inner firmness that keeps them
  working toward it.
examples:
- She has a strong sense of purpose and rarely gives up.
- His sense of purpose carried him through years of difficult study.
