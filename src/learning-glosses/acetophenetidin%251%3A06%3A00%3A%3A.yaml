simpleMeaning: a white crystal-like chemical used to ease pain and to bring down fever
scope: Also called acetphenetidin and phenacetin; this is a white crystal-like drug that eases pain and
  lowers fever, not aspirin and not an antibiotic.
examples:
- The doctor gave him acetophenetidin for his fever.
- Acetophenetidin was once used to ease pain.
