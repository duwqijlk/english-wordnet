simpleMeaning: A punctuation dot (.) put at the end of a statement or after a shortened word or name.
scope: This is a mark in writing, not a blocked pipe, a camera part, or an action that ends.
examples:
- Put a full stop after that statement.
- The abbreviation 'Dr.' ends with a stop.
