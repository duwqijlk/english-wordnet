simpleMeaning: an essential oil, a strong-smelling oil taken from flowers, used as a scent
scope: 'Also called athar, attar and ottar: a scent taken from flowers, not a cooking oil and not a scent
  made from wood or spice.'
examples:
- She put a drop of atar on her wrist.
- The shop sold small bottles of atar made from roses.
