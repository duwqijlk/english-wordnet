simpleMeaning: a tough kind of cabbage with rough curled leaves that grow loose and never form a tight
  ball
scope: This is a kind of cabbage also called borecole, cole, kail and kale; not a cabbage with a tight
  round head and not a leafy herb used only for flavour.
examples:
- Colewort grew in neat rows in the garden.
- She cut colewort leaves for the pot.
