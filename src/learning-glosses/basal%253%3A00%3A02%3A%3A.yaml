simpleMeaning: Of leaves, especially, set at the foot of plant or of stem, springing straight from root,
  rootstock, or a root-like stem, especially.
scope: Also called radical; of leaves at the base of a plant or stem.
examples:
- Their leaf was basal in place.
- The growth was basal by form.
