simpleMeaning: To find out or make certain about something, usually by asking, checking, or trying.
scope: This means checking or finding out, not looking at something with your eyes and not visiting someone.
examples:
- See whether the door is locked.
- I'll see if the doctor can fit you in this afternoon.
