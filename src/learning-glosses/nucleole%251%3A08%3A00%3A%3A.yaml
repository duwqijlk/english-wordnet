simpleMeaning: The cell makes protein with help from RNA held in a small round bit of protein inside its
  centre.
scope: Also called a nucleolus, this small round bit of protein sits inside a cell's centre and is not
  the centre itself.
examples:
- The nucleole in the cell held RNA that helped the cell make protein.
- A nucleole can be seen inside the centre of a cell under a microscope.
