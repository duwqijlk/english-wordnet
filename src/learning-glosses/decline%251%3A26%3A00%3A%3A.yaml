simpleMeaning: a state that is worse than an earlier state, with a slow move away from that better state
scope: A state that has become worse over time, not ground that goes down, not a fall in charge or current,
  and not changing a word for grammar.
examples:
- After his illness, he went into a slow decline.
- The town's decline began when the factory closed.
