simpleMeaning: the act of going over something again and changing it, after thinking about it more
scope: The act of going over something again and changing it; revision is another name for this sense,
  and it is not simply making a thing different in size or a change from one state to another.
examples:
- The alteration of his opinion took weeks of thought.
- The alteration to the plan came after long talks.
