simpleMeaning: Used above all in syrups for coughs, this sweet-smelling sticky stuff, yellow-brown in
  colour, is got from a tree.
scope: This sticky stuff is also called tolu and tolu balsam.
examples:
- The cough syrup had balsam of tolu in it, and it smelled sweet.
- They stirred balsam of tolu into the cough syrup.
