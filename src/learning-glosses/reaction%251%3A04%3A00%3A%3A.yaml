simpleMeaning: a physical change in the body caused by a drug, food, or other trigger acting on it.
scope: This is not an emotional or behavioral response, and not a chemical change between substances;
  it is a process in the body brought on by something acting on it.
examples:
- The vaccine caused a mild reaction at the injection site.
- Her body had a strong reaction to the medication.
