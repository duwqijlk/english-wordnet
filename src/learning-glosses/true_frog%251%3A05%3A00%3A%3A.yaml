simpleMeaning: Smooth wet skin, feet joined by skin, and long back legs mark this frog, which eats insects
  and most often lives half in water.
scope: Also called a ranid, this is one of the frogs with webbed feet and smooth wet skin that eat insects
  and most often live half in water.
examples:
- A true frog caught flies near the water, then slipped back in.
- A true frog kicked through the water with its long back legs.
