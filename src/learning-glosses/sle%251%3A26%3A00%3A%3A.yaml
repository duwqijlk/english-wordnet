simpleMeaning: A swelling disease of the body's joining tissue, with signs that change, such as fever,
  weakness, tiredness, sore joints, and skin sores on the face, neck, or arms.
scope: A swelling disease of the body's joining tissue, with signs in many parts of the body, not only
  on the skin; also called disseminated lupus erythematosus and systemic lupus erythematosus.
examples:
- SLE can bring fever and sore joints.
- The doctor said SLE had hurt the skin on her face.
