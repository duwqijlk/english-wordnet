senseId: 'capitalize%2:30:00::'
synsetId: 00161975-v
simpleMeaning: to change money a company has kept aside into its capital (money that belongs to the company
  and is part of its value)
scope: It means changing a company's money kept aside into its capital, not counting money spent as a
  thing the company owns, not giving a business capital, and not writing in big letters.
examples:
- The company voted to capitalize its reserve funds.
- They will capitalize the extra money they had kept aside instead of paying it out.
