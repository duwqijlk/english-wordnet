simpleMeaning: A person who cannot sit still, acts without thinking, and cannot keep feelings in check
  has this health problem
scope: 'Also called minimal brain dysfunction, attention deficit disorder, attention deficit hyperactivity
  disorder and hyperkinetic syndrome: a health problem that makes a person restless, quick to act and
  unable to keep feelings in check, not a hurt to the head from a blow.'
examples:
- His minimal brain damage made it hard for him to sit still in class.
- The doctor said her minimal brain damage was why she acted without thinking.
