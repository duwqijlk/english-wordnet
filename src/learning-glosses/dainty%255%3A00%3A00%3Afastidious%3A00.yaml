simpleMeaning: Far too fussy about small things, and easily put off or made to feel sick by them
scope: Far too fussy and easily put off, with nice as another name for this sense, not simply neat and
  pretty and not careful in a useful way.
examples:
- He was too dainty about his food to enjoy camp cooking.
- So dainty was she that she would only touch the door handle with her elbow.
