simpleMeaning: 'A way to ready a mother for drug-free birth: she practises in class and at home, usually
  with a helper, learning how birth works and to relax, focus, and breathe'
scope: Also called Lamaze method of childbirth; a way of getting a mother ready for birth without drugs,
  through practice and learning how to relax, focus, and breathe.
examples:
- The Lamaze method helped her stay calm through the birth.
- They signed up for the Lamaze method classes before the baby came.
