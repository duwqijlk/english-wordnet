simpleMeaning: A slow tree animal of Central America with two long claws on each front foot and three
  long claws on each back foot.
scope: 'Also called two-toed sloth and unau: a slow tree animal of Central America with two claws on each
  front foot, not a three-toed sloth and not a monkey.'
examples:
- The unai hung upside down from a branch, moving almost too slowly to see.
- An unai has two long claws on each front foot and three on each back foot.
