simpleMeaning: White blood cells, the kinds called monocytes and macrophages, make this substance, which
  fights growths yet also sets off swelling, as in rheumatoid arthritis.
scope: Also called tumor necrosis factor; a substance made by white blood cells that fights growths but
  also sets off swelling.
examples:
- Tumour necrosis factor fights growths but also sets off swelling.
- Doctors measured tumour necrosis factor in her blood.
