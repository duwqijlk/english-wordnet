synsetId: 14579554-n
simpleMeaning: Sight fails when the thin layer at the back of the eye comes away from the dark layer behind
  it, and the spot is burned with light to mend it.
scope: Also called detached retina and detachment of the retina, it is a loss of sight from the thin layer
  at the back of the eye coming away from the dark layer behind it, and the spot is burned with light
  to mend it.
examples:
- The retinal detachment left them unable to see.
- The retinal detachment was treated by burning the spot with light.
