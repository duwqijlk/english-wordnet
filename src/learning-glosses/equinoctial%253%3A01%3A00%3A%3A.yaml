simpleMeaning: Said of the time of year when day and night last the same length of time
scope: About the time of year when day and night are the same length, not the great circle in the sky
  that shares the name.
examples:
- The equinoctial rains began just after the day and night grew equal in length.
- Farmers watched for the equinoctial change, when daylight and darkness last the same time.
