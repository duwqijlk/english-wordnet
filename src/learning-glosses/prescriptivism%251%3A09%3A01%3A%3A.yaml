simpleMeaning: In ethics, the view that statements about right and wrong tell people what feelings and
  acts are fitting
scope: In ethics, this is the view that statements about right and wrong tell people what feelings and
  acts are fitting, not the view that moral statements only state facts and not a rule book of good manners.
examples:
- Prescriptivism says moral talk tells us what to feel.
- He wrote about prescriptivism in his ethics class.
