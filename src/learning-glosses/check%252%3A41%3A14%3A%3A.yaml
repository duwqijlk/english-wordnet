simpleMeaning: in ice hockey, use the body or stick to stop or slow down a player on the other team
scope: This is the hockey action, not the noun for that move and not the general act of stopping an enemy.
examples:
- He checked the winger hard into the boards, and the referee let it go.
- You cannot check a player who does not have the puck.
