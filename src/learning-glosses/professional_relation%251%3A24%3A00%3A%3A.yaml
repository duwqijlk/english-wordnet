simpleMeaning: the link between two people when one asks a skilled person for help and gets it
scope: The link between a person who asks for skilled help and the person who gives it, not a friendship
  and not help from someone with no skill.
examples:
- A professional relation grew between the lawyer and her client.
- The doctor and the patient have a professional relation built on trust.
