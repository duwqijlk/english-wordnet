simpleMeaning: A loud horn that was once put on motor vehicles.
scope: A loud horn once used on motor vehicles, also called klaxon; not a modern car horn and not a siren.
examples:
- The old car sounded its claxon at the crossing.
- He pressed the claxon to warn the horse cart.
