simpleMeaning: White wine, tarragon, and shallots, instead of lemon juice, go into this sauce, which is
  like hollandaise, a butter sauce.
scope: This sauce is like hollandaise, a butter sauce, but it is not hollandaise itself.
examples:
- They served bearnaise with the meal.
- The bearnaise had white wine, tarragon, and shallots in it.
