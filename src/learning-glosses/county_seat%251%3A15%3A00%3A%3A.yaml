simpleMeaning: The town or city where the offices that run one small part of a state are based.
scope: 'Also called county courthouse and county town: the town or city where the offices that run one
  small part of a state are based, not the biggest town in the part and not a place where laws are made.'
examples:
- Springfield is the county seat.
- The county seat holds the land records.
