simpleMeaning: To take something using a method like hunting, snaring, or trapping.
scope: This is taking something by a method like hunting, snaring, or trapping; it is not seizing a fleeing
  person after a chase, not a door or window fastener, not a stop that limits how far a part moves, not
  noticing a mistake or slip, and not grabbing a moving object to stop it.
examples:
- The farmer caught a rabbit in the trap overnight.
- They caught two mice with a simple snare.
