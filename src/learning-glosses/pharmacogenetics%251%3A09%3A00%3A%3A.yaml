simpleMeaning: In the study of how traits pass down, the part that looks at why people or lab animals
  answer the same drug in different ways.
scope: The study of why people answer the same drug in different ways, not the study of drugs themselves.
examples:
- Pharmacogenetics helps explain why one drug suits one patient and not another.
- In pharmacogenetics, researchers ask why lab animals answer the same drug in different ways.
