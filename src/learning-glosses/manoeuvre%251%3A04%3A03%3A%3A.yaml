synsetId: 00557350-n
simpleMeaning: a planned, careful movement with its parts working together, needing skill and quick, neat
  use of the hands or body
scope: Also called play, and another name for it is maneuver. This is a careful, skilful movement, not
  a move to get away from an opponent and not a military move to gain a better place in attack or defence.
examples:
- The driver made a difficult manoeuvre to park in the small space.
- With one neat manoeuvre, she turned the boat around.
