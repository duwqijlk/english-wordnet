simpleMeaning: a woman with skill in helping a mother give birth to her baby
scope: Also called midwife; a woman skilled in helping mothers give birth, not a doctor and not a nurse
  who cares for the sick.
examples:
- The accoucheuse stayed with the mother through the long night.
- An accoucheuse was called to the house when the baby was due.
