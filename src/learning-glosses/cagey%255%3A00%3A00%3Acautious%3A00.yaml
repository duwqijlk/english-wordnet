simpleMeaning: very careful and slow to trust
scope: 'Also called chary, and another name for this sense is cagy: very careful and slow to trust. Not
  simply shy, and not brave or quick to trust.'
examples:
- He was cagey about the new plan and would not trust it at first.
- The cagey old man watched every stranger with great care.
