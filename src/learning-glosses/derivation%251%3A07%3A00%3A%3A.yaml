simpleMeaning: Traits passed down in a family, shared by those of the same blood.
scope: Traits passed down through a family line, also called lineage and ancestry; not the act of getting
  a thing from its source, not the source itself, and not the forming of new words from old ones.
examples:
- Her derivation from a long line of sailors showed in her love of the sea.
- The derivation of the family could be traced back for centuries.
