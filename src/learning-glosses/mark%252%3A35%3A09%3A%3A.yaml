simpleMeaning: to fasten a tag or label onto something
scope: Fastening a tag or label to something, not simply leaving a visible trace on it and not choosing
  or naming it; label and tag are other names for this sense.
examples:
- Staff marked each box with a red label.
- The gardener marked the young trees with small tags.
