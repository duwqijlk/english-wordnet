senseId: 'earlier%4:02:00::'
synsetId: 00061477-r
simpleMeaning: At a time before the present or before the point being talked about.
scope: This is not the adjective that compares two times; it is an adverb saying something happened before
  now or before the time in question.
examples:
- I saw her earlier today.
- He had mentioned the idea earlier in the meeting.
