simpleMeaning: Many tiny burns from a beam of strong light open the way for the watery liquid of the eye
  to drain away more easily
scope: This work on the eye makes many tiny burns with a beam of strong light so the watery liquid inside
  can drain away more easily.
examples:
- Laser trabecular surgery left many tiny burns where the liquid drains from the eye.
- After laser trabecular surgery, the liquid drained from the eye more easily.
