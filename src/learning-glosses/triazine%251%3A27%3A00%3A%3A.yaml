simpleMeaning: Any of three chemicals with the same atoms joined in different ways, with three carbon
  and three nitrogen atoms in a six-atom ring
scope: Any of three chemicals with the same atoms joined in different ways, with three carbon and three
  nitrogen atoms in a six-atom ring, not a chemical with only carbon atoms and not a chain that stays
  open.
examples:
- Triazine rings turn up in some weedkillers and dyes.
- The chemist drew the triazine ring with three carbons and three nitrogens.
