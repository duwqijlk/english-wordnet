simpleMeaning: To make a noise in your throat, the kind you make when you take something down too fast
scope: The noise made when something goes down too fast, not the act of swallowing itself.
examples:
- He gulped for help after choking on a big piece of meat.
- She gulped loudly when the bad news reached her.
