simpleMeaning: The lining of the gut and the breathing tubes grows from this innermost layer of cells
  in the early embryo.
scope: This innermost layer of the early embryo is also called endoblast, endoderm, entoderm and hypoblast.
examples:
- The entoblast will form the lining of the gut.
- In the early embryo, the entoblast lies innermost.
