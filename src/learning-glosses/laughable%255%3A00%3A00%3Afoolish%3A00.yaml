simpleMeaning: so silly and with so little good sense that people laugh at it in scorn
scope: 'Also called ridiculous, absurd, ludicrous, idiotic, preposterous, nonsensical, cockeyed, and derisory:
  so silly that people laugh at it in scorn, not just funny in a kind way.'
examples:
- His excuse for being late was laughable; no one could believe it.
- The price they asked for the old car was laughable.
