simpleMeaning: a large hat that keeps sun off the face, worn by girls and women
scope: This is a hat worn by girls and women to keep sun off the face; it is not a fixed cover over a
  window and not a shade you hold in your hand.
examples:
- The little girl wore a sunbonnet while she played in the garden.
- She tied her sunbonnet under her chin before going out in the sun.
