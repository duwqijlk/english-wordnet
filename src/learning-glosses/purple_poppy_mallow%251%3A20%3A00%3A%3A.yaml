simpleMeaning: a hairy plant that lives for years in the central United States, with round leaves cut
  deep into lobes and loose clusters of large flowers, red-purple or cherry red
scope: This is the hairy plant of the central United States with round lobed leaves and big flowers, not
  the poppy or the common mallow.
examples:
- The purple poppy mallow in the garden has round leaves.
- We saw purple poppy mallow flowers by the road.
