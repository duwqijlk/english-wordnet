simpleMeaning: this word is used of a gun, or the shot it fires, when its inner hole is a little more
  than a fifth of an inch across
scope: It is also called .22-calibre, .22 caliber, and .22 calibre, and it is used of a gun or its shot
  whose bore is a little more than a fifth of an inch across, not of one with a wider bore.
examples:
- He held a .22-caliber pistol.
- She cleaned a .22-caliber rifle.
