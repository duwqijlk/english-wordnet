simpleMeaning: Now growing wild as a weed in North America, this European herb bears small white, pink
  or purple flowers.
scope: 'Also called common comfrey: a European herb with small flowers that now grows wild in North America,
  not the southeastern boneset once used in folk medicine.'
examples:
- Boneset grows wild in North America.
- The boneset had small white flowers.
