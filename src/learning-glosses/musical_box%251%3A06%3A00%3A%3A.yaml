simpleMeaning: A device that produces music when pins on a revolving cylinder strike the tuned teeth of
  a comb-like metal plate.
scope: Also called music box, it is a case that plays a tune when pins on a turning drum strike a thin
  metal plate.
examples:
- She wound the musical box and a soft tune filled the room.
- The musical box on the shelf plays the same song every time.
