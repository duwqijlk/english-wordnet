simpleMeaning: One of the three Greek goddesses who fix fate or what will be; the Romans called them the
  Parcae, like the Norse Norns.
scope: These are Greek fate goddesses, not the Roman Parcae themselves; also called Moirai.
examples:
- The Moirae fix the fate of every person.
- The Moirae are three Greek goddesses of fate.
