synsetId: 09335000-n
simpleMeaning: A coat of fine hairs, or at times thin flat plates, covering a leaf or an insect.
scope: A coat of fine hairs or thin flat plates on a leaf or insect, not thick fur and not a hard shell;
  indument is another name for this sense.
examples:
- The leaf's indumentum felt soft to the touch.
- An indumentum of fine hairs covers the insect's back.
