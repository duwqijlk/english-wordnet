simpleMeaning: A middle-sized food fish like a tuna, of warm Atlantic and Pacific waters, less prized
  than tuna
scope: This is a middle-sized food fish like a tuna, not a true tuna and not a fish of cold northern waters;
  skipjack and Sarda sarda are other names for this sense.
examples:
- Atlantic bonito is caught in the warm waters off Florida.
- The Atlantic bonito on the market was less prized than tuna.
