simpleMeaning: the act of running after someone or something to try to catch them
scope: Also called following. This is the act of going after someone to catch them, not the metal frame
  used in printing and not trying to win someone for love or sex.
examples:
- The police began a chase through the streets after the thief.
- A short chase ended when the dog caught the ball.
