simpleMeaning: A person in the navy or coast guard who holds a rank below a commissioned leader, about
  the same rank as a sergeant in the army.
scope: A person in the navy or coast guard who holds a rank below a commissioned leader, about the same
  rank as a sergeant in the army; not a commissioned leader and not a new recruit.
examples:
- The petty officer checked the crew's work on deck.
- She was made a petty officer after three years at sea.
