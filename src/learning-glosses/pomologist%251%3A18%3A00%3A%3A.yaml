simpleMeaning: One who grows fruit trees, or who knows pomology, the study of fruit
scope: A person who grows fruit trees or knows much about fruit, not a gardener who grows vegetables and
  not a seller of fruit.
examples:
- The pomologist advised the farmers on the best apples to plant.
- As a pomologist, she spent her days among the orchards.
