simpleMeaning: the place on a body chemical that speeds up change, or on a germ-fighting protein, where
  the chemical change takes place
scope: The place on an enzyme or antibody where a chemical change happens, not the whole enzyme and not
  the cell that makes it.
examples:
- The drug blocks the active site of the enzyme so the reaction stops.
- The active site of the antibody binds to the germ.
