simpleMeaning: a person who makes printed pictures or pages by using a plate with lines cut into it
scope: This is the person who prints from a cut plate, not the worker who cuts designs or writing into
  a surface.
examples:
- The engraver printed the picture from the cut plate.
- An engraver ran the plate through the press to make each copy.
