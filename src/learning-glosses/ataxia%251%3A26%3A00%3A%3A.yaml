senseId: 'ataxia%1:26:00::'
synsetId: 14114736-n
simpleMeaning: not being able to control muscle movements done on purpose, so that movements are unsteady
  and the walk is a stagger
scope: 'Another name for ataxy, dyssynergia, and motor ataxia: not being able to control movements done
  on purpose, not weakness of the muscles.'
examples:
- Ataxia made it hard for him to walk in a straight line.
- Her ataxia showed in her unsteady hands.
