simpleMeaning: Found in Europe and America and sold fresh and smoked, these eels live in fresh water when
  grown but go back to the sea to lay eggs.
scope: Also called a freshwater eel, this eel lives in fresh water when grown but goes back to the sea
  to lay eggs, is found in Europe and America, and is sold fresh and smoked.
examples:
- The common eel swims in the river until it is time to spawn.
- Fishermen sell common eel fresh and smoked.
