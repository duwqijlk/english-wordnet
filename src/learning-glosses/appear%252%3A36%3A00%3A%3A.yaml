simpleMeaning: To perform as a character on stage or in a play or similar production.
scope: This is about taking part as a character in a stage play or similar production, not about seeming
  true, coming into sight, beginning to exist, or attending court.
examples:
- She appeared as Ophelia in a student production of Hamlet.
- He appeared in three plays at the Edinburgh Festival.
