simpleMeaning: In match play, a side that is ahead by as many holes as there are holes left to play
scope: In match play, a side ahead by as many holes as there are holes left to play, also called dormy,
  and not a side that is behind or one that has already won.
examples:
- He was dormie three and still lost the match.
- With two holes left and a two-hole lead, she was dormie.
