simpleMeaning: The front part of a missile made to carry an atom bomb to its mark
scope: The front part of a missile made to carry an atom bomb to its mark, with nuke and atomic warhead
  as other names for this sense; not the whole missile, and not a plain bomb dropped from a plane.
examples:
- The missile's nuclear warhead could destroy a whole city.
- They removed the nuclear warhead from the missile.
