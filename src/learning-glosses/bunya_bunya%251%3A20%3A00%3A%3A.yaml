simpleMeaning: An Australian conifer bearing two-inch seeds that taste like roasted chestnuts, a tree
  that, among the aborigines, is handed-down wealth guarded by law.
scope: This sense is also called bunya bunya tree, for an Australian conifer bearing two-inch seeds that
  taste like roasted chestnuts, unlike the sense for a nut tasting like roasted chestnuts, a staple food
  of Australian aborigines.
