scope: A large machine that speeds up protons, tiny parts of atoms, by changing the rate of an electric
  field; not a machine that splits atoms, and not a machine that makes power.
examples:
- The cosmotron sped up protons to great speeds.
- Scientists used the cosmotron to study tiny parts of atoms.
