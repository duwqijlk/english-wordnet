simpleMeaning: a person's tendency to want to be by himself or herself, away from other people
scope: This is a person's lasting tendency to want to be by himself or herself; it is not a sad feeling
  when other people are away, and not one short time on your own.
examples:
- 'Her aloneness was clear: she chose a small house far from town.'
- He liked his aloneness and spent most weekends by himself.
