simpleMeaning: put through strong forced teaching that makes a person drop old beliefs and accept new
  ones
scope: Describes a person forced to change what he believes, not just a person who was taught new ideas
  or talked into changing his mind.
examples:
- The prisoners felt brainwashed after months of forced lessons day and night.
- He said his brother had been brainwashed into giving up all his old beliefs.
