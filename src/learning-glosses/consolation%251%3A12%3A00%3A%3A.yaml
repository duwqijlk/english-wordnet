simpleMeaning: the good feeling you have when someone comforts you after a letdown
scope: This is the good feeling you get when someone comforts you after a letdown, and solace is another
  name for it, not the act of comforting and not a prize for losing.
examples:
- Second place was no consolation to him.
- The kind words were a consolation after her loss.
