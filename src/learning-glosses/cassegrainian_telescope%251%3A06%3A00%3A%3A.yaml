senseId: 'cassegrainian_telescope%1:06:00::'
synsetId: 02981937-n
simpleMeaning: A sky-viewing instrument with mirrors, a bowl-shaped main mirror and a second mirror curved
  out; light comes to a focus through a hole in the middle of the main mirror.
scope: This sense covers only the mirror instrument for viewing the sky whose light comes to a focus through
  a hole in the middle of its bowl-shaped main mirror; Gregorian telescope is another name for this sense.
examples:
- The Cassegrainian telescope showed the moons of Jupiter.
- We looked through the Cassegrainian telescope at the stars.
