simpleMeaning: pride that shows itself in bossy, superior treatment of people thought to be below one
scope: This is proud, bossy behaviour toward people seen as below one; arrogance, haughtiness, hauteur
  and lordliness are other names for this sense, not quiet self-belief and not firm leadership.
examples:
- Her high-handedness showed in the way she spoke to the staff.
- His high-handedness made every meeting a trial for his team.
