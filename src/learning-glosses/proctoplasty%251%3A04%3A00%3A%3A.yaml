simpleMeaning: An operation that rebuilds the anus or rectum
scope: An operation that rebuilds the lower end of the bowel, not an operation to remove part of it.
examples:
- The surgeon planned a proctoplasty to repair the damaged rectum.
- After the accident, a proctoplasty rebuilt the anus.
