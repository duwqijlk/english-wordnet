scope: 'Also called rydberg and rydberg constant: a number that gives the light-wave pattern of each kind
  of atom, not a measure of length and not a measure of time.'
examples:
- The rydberg unit gives the size of the number for hydrogen's light pattern.
- He wrote the answer in rydberg units, not in plain numbers.
