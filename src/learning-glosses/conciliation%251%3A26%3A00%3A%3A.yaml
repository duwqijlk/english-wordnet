senseId: 'conciliation%1:26:00::'
synsetId: 13995008-n
simpleMeaning: The state of showing goodwill and working together once people have made peace.
scope: Showing goodwill and working together after being reconciled, not the act of calming distrust and
  not the mediation that settles a dispute.
examples:
- A short spell of conciliation followed the peace talks.
- Conciliation between the neighbours lasted until the next row.
