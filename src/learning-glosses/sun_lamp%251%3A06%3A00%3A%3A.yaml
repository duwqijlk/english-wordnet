simpleMeaning: a light that uses the vapour of a silver-white metal to give off beams, used to treat health
  problems or for beauty care
scope: A lamp used in medical or beauty care, also called a sun-ray lamp, a sunlamp and a sunray lamp,
  not an ordinary room light and not a lamp that gives light only for seeing.
examples:
- The sun lamp in the clinic gives off strong beams for skin care.
- A sun lamp can help treat some skin problems.
