simpleMeaning: The space round the altar of a church, set aside for the clergy and choir, often shut off
  by a rail or screen
scope: The space round the altar for clergy and choir, not a shelter from danger and not a store for holy
  things.
examples:
- The priest stood in the sanctuary before the altar.
- The choir sang from the sanctuary at the front.
