simpleMeaning: covering just as much ground, range, or time as something else
scope: This means covering the same ground, range, or time as something else; conterminous and coterminous
  are other names for it, not a thing that covers more ground or less time.
examples:
- The two parks were coextensive, covering the same ground.
- Their coextensive terms of office lasted exactly the same time.
