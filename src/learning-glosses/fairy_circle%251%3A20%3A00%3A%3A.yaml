schema: oewn-learning-gloss-v2
senseId: 'fairy_circle%1:20:00::'
synsetId: 13027794-n
simpleMeaning: a ring of mushrooms marking the edge of a long-lived growth of thread-like fungus under
  the ground
scope: This is a ring of mushrooms over underground fungus; fairy ring is another name for this sense;
  not a ring of stones and not mushrooms growing on their own.
examples:
- A fairy circle appeared on the lawn after the rain.
- The fairy circle marked where the fungus grew underground.
