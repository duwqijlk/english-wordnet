simpleMeaning: A big fish of cold northern waters, eaten as food and caught for sport, that usually swims
  from the sea up rivers to lay eggs
scope: A big northern fish, not its flesh as food, not the pinkish-orange colour, and not the colour word.
examples:
- Salmon swim up the river to spawn each autumn.
- He caught a salmon in the cold northern river.
