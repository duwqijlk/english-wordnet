simpleMeaning: Pipes for smoking tobacco are made from timber cut from the hard root of a kind of heather
scope: Brier-wood and brierwood are other names for this timber from the hard root of a kind of heather,
  made into pipes for smoking tobacco.
examples:
- The pipe was carved from briarwood.
- He polished his briarwood pipe.
