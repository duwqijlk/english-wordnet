simpleMeaning: to make a set of ideas that try to explain one thing or event
scope: This means building a set of ideas that try to explain one subject. It is not just thinking that
  something may be true when you are not sure of it, and not making such ideas in general with no one
  subject in mind.
examples:
- He theorized the cause of the strange lights in the sky.
- The scientist theorized the way the small moon moves around the planet.
