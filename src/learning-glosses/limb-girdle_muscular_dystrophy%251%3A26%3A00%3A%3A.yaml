simpleMeaning: A muscle-wasting illness needing the faulty gene from both parents, appearing from late
  childhood to midlife; weakness slowly spreads from a shoulder or hip, with heart and lung trouble later.
scope: This is a slowly progressing muscle-wasting condition that begins in the shoulder or hip muscles
  and can start in childhood or adult life. It is not Duchenne muscular dystrophy, which starts in early
  childhood and weakens the heart early, nor a nerve disease that causes weakness.
examples:
- After struggling to lift his arms above his head, he was diagnosed with limb-girdle muscular dystrophy.
- Limb-girdle muscular dystrophy often runs in families, and her brother now uses a wheelchair.
