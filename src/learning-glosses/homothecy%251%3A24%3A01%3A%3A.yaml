simpleMeaning: In mathematics, a change that makes every part of a flat space bigger or smaller by the
  same amount, around one point that stays put
scope: In mathematics, a stretch or shrink that is the same in every direction around one fixed point,
  also called a homothety; not a slide that moves a shape, and not a stretch in one direction only.
examples:
- A homothecy with a factor of two doubles every length from the fixed point.
- The homothecy kept the shape the same while making it three times as large.
