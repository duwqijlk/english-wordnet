simpleMeaning: the leading part of a tool or weapon, the bit that juts out ahead of the rest
scope: This is the front of a tool or weapon such as a gun, not the front of an aircraft, the facial body
  part, or the verb meaning to win narrowly.
examples:
- The nose of the drill pressed hard against the plaster wall.
- She aimed carefully along the nose of the rifle.
