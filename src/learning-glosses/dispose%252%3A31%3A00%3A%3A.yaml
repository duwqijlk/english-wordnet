simpleMeaning: to make a person ready and willing to take up an act, a view, or a belief
scope: To make a person ready and willing to take up an act, a view, or a belief, also called incline;
  not to throw a thing away.
examples:
- Her kind words disposed him to forgive the insult.
- The speaker's calm tone disposed the crowd to listen.
