simpleMeaning: In the Roman Catholic Church, a devotion of fourteen prayers before fourteen pictures or
  carvings showing what happened as Jesus went from the house of Pilate to death at Calvary.
scope: Also called Stations; a Roman Catholic devotion of fourteen prayers said before pictures of the
  way of Jesus to his death, not the pictures themselves and not a single prayer.
examples:
- They prayed the Stations of the Cross on Good Friday.
- The Stations of the Cross are prayed in church during Lent.
