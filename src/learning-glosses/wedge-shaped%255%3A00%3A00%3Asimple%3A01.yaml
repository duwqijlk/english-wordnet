senseId: wedge-shaped%5:00:00:simple:01
synsetId: 02175297-s
simpleMeaning: Of a leaf, narrow and three-sided, wider at the tip and getting narrower toward the stem.
scope: Of a leaf, narrow and three-sided; cuneate is another name for this sense, not a round leaf and
  not a leaf with a wide base.
examples:
- The wedge-shaped leaves were wider at the tip than at the stem.
- She drew a wedge-shaped leaf in her notebook.
