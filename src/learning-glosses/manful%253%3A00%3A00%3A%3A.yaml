simpleMeaning: having the qualities that people think suit a man
scope: Also called manly. This describes a person who has qualities people think suit a man; it does not
  just mean that the person is a man.
examples:
- He gave a manful response, staying brave and calm under pressure.
- She praised his manful stand against the unfair plan.
