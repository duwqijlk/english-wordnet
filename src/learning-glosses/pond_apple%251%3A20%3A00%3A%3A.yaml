simpleMeaning: People eat its fruit, but this small plant from warm parts of America, which keeps its
  leaves all year, is grown most of all to join other plants onto.
scope: Also called a pond-apple tree, this small plant from warm parts of America is grown most of all
  to join other plants onto, not the yellow fruit itself.
examples:
- The pond apple kept its leaves all year.
- They joined another plant onto the pond apple.
