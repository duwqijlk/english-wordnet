senseId: 'holistic%3:00:00::'
synsetId: 01685348-a
simpleMeaning: Paying most attention to the link between the parts and the whole, in how the parts are
  joined as one thing and in how they work
scope: About parts working together as one whole; not about studying each part on its own.
examples:
- Her holistic care looks at sleep, food, and movement as parts of one whole.
- The teacher took a holistic view and taught reading, play, and music together.
