simpleMeaning: a holder of magnet-force fields in any set-up, used to hold a plasma, a hot gas of charged
  bits, during controlled atom-joining reactions
scope: A holder made of magnet-force fields for a hot charged gas, not a glass bottle and not a steel
  tank.
examples:
- The magnetic bottle held the plasma steady during the test.
- Engineers use a magnetic bottle to keep the hot gas in place.
