simpleMeaning: a very thin horse likely soon to die whose dead body would soon draw birds that eat dead
  flesh
scope: A very thin horse likely close to death, also called crowbait; not a healthy horse and not any
  other dying animal.
examples:
- The old crow-bait could barely stand on its thin legs.
- The farmer led the crow-bait to the field, where it soon died.
