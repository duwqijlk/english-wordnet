simpleMeaning: under a court order, the sheriff hands over property to pay off a debt that has not been
  paid
scope: Also called execution sale, forced sale, and sheriff's sale, this is property the sheriff hands
  over under a court order to pay off a debt that has not been paid.
examples:
- The house was lost in a judicial sale after the debt went unpaid.
- The court ordered a judicial sale to pay off the unpaid debt.
