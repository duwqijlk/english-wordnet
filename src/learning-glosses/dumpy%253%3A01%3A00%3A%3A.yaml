simpleMeaning: looking like a place where rubbish is thrown away and left, dirty and untidy
scope: This sense is about a place that looks dirty and untidy, not about a person or thing that is short
  and thick.
examples:
- The dumpy yard behind the house was full of old tyres and broken wood.
- They lived in a dumpy little flat with wet walls and old papers on the floor.
