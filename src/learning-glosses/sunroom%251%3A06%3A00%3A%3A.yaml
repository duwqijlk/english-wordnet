simpleMeaning: a room with walls made largely of glass, letting in light from the sun
scope: 'Also called solarium and sunporch: a room built largely of glass to let in the sun, not an open
  outdoor area and not a room made only for growing plants.'
examples:
- We sat in the sunroom and read in the bright light.
- Their new sunroom has glass walls on three sides.
