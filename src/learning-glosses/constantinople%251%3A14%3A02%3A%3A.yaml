simpleMeaning: The sixth church-wide meeting in 680–681 that ruled against Monothelitism by stating that
  Christ has two wills, one divine and one human.
scope: This is the sixth council, also called the Third Council of Constantinople, not the second council
  of 381, the fifth council of 553, or the council of 869 that condemned Photius.
examples:
- The Sixth Council of Constantinople met in 680–681.
- Constantinople's sixth council ruled that Christ has two wills.
