simpleMeaning: a hard, pointed, curved growth on the toe of a bird or certain mammals or reptiles
scope: A single sharp toe growth on an animal, not a crab's pincer, a hooked tool, or a whole bird's foot.
examples:
- The eagle gripped the branch with its sharp claws.
- The cat scratched the sofa with its claws.
