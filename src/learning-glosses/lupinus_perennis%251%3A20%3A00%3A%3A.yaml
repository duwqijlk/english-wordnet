simpleMeaning: A strong long-lived plant of eastern and central North America, with leaves shaped like
  a hand and bright blue flowers in long bunches.
scope: A strong long-lived North American plant with hand-shaped leaves, also called old-maid's bonnet,
  sundial lupine, wild lupine and Indian beet; not a garden rose and not a wild bean.
examples:
- Lupinus perennis grows in the dry fields of eastern North America.
- The blue flowers of Lupinus perennis stand in long bunches.
