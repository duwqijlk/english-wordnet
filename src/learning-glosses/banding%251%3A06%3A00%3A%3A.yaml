simpleMeaning: An added pretty bit, a strip whose colour or stuff is unlike the rest of the thing.
scope: An added pretty bit, a strip whose colour or stuff is unlike the rest of the thing; also called
  a band and a stripe; not a stripe or stripes of a colour that stands out.
examples:
- The banding on the edge of the cloth was red and gold.
- A strip of banding ran along the hem of the dress.
