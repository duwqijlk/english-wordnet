simpleMeaning: In Gestalt psychology, a rule that parts of what we see that move or work in the same way
  are seen as one thing
scope: In Gestalt psychology, a rule that parts moving or working together are seen as one thing; law
  of common fate is another name for this sense; not a rule about things that look alike, and not a rule
  about things close together.
examples:
- Things that move together show common fate, so we see them as one group.
- By common fate, the dots moving together looked like one shape.
