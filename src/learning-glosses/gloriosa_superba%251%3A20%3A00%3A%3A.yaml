simpleMeaning: Any plant of a genus from tropical Africa and Asia, a long-lived herb climbing by tendrils
  at its leaf tips, with showy yellow-to-red or purple flowers, all parts poisonous.
scope: A climbing plant with bright flowers, also called climbing lily, creeping lily, gloriosa and glory
  lily, with all parts poisonous.
examples:
- Gloriosa superba climbed the trellis in bright bloom.
- Keep children away from Gloriosa superba, as all its parts are poisonous.
