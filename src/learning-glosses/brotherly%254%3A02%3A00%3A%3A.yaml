senseId: 'brotherly%4:02:00::'
synsetId: 00290403-r
simpleMeaning: In old use, in a way that is like a brother
scope: This is the old adverb use for acting in a way like a brother. It is not the adjective use for
  a person or act that is like a brother.
examples:
- He spoke brotherly to the young man and helped him as one of his own family.
- They lived brotherly together, sharing all they had with each other.
