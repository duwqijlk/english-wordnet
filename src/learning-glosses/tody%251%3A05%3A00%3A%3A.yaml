simpleMeaning: a very small bird from the West Indies that eats insects, with red and green feathers and
  a long straight beak
scope: A very small bird from the West Indies, not a hummingbird and not a kingfisher.
examples:
- A tody sat on the branch, its red and green feathers bright in the sun.
- We watched a tody catch insects with its long straight bill.
