synsetId: 00833137-v
simpleMeaning: to ask someone questions and make them give a report about what they did and what they
  know
scope: This is asking questions after a job or event, not telling someone what to do before it starts.
examples:
- The officers debriefed the pilot after the flight.
- She was debriefed for an hour when she came back.
