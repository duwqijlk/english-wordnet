simpleMeaning: 'A principle in Gestalt psychology, which studies how people group what they see: the mind
  naturally completes unfinished shapes, fills in gaps, and treats uneven forms as even.'
scope: This is the Gestalt rule that the mind fills in the missing parts of a shape, another name for
  closure; it is not a legal statute or the end of a debate.
examples:
- The law of closure makes us read the broken outline as a complete square.
- Designers rely on the law of closure to let viewers finish a shape in their own minds.
