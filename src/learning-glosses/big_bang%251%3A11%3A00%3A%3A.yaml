simpleMeaning: In cosmology, all that exists is thought to have begun in one huge blast.
scope: This blast is said to have begun the whole universe, not a blast from a bomb and not the start
  of the earth alone.
examples:
- The big bang is the idea that the universe began in one huge blast.
- Most books on the big bang say it marked the start of all that exists.
