senseId: 'hellgrammite%1:05:00::'
synsetId: 02268921-n
simpleMeaning: A big brown young insect that lives in water and grows into a dobsonfly, put on a hook
  to catch fish.
scope: A big brown water larva that grows into a dobsonfly and is used as fishing bait; dobson is another
  name for this sense, and this is not the grown dobsonfly or any other bait.
examples:
- He put a hellgrammite on his hook before casting into the stream.
- The hellgrammite crawled under a stone in the shallow water.
