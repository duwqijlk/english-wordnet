senseId: 'double_dribble%1:04:00::'
synsetId: 00479866-n
simpleMeaning: a move in basketball that breaks the rules, when a player bounces the ball with both hands
  or starts to bounce it again after stopping
scope: A rule-breaking move in basketball, not a legal way to bounce the ball and not a foul of another
  kind.
examples:
- The referee called a double dribble when she bounced the ball with both hands.
- He was caught for a double dribble after he stopped and started to bounce the ball again.
