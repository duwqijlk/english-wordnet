senseId: 'deciduous%3:00:00::'
synsetId: 00917218-a
simpleMeaning: Losing its leaves when the growing season ends, said of a plant or shrub.
scope: Said of a plant or shrub that loses its leaves at the end of the growing season, not of teeth or
  antlers that are shed.
examples:
- The oak is deciduous, losing its leaves each autumn.
- Deciduous trees stood bare through the winter.
