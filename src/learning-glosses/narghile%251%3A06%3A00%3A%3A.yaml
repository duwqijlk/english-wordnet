simpleMeaning: 'A tobacco pipe from the East: the smoke is cooled by passing through water in a pot, and
  a long bendy tube joins the pipe to the pot.'
scope: People call this Eastern tobacco pipe nargileh, hookah, shisha, calean, chicha, hubble-bubble,
  hubbly-bubbly, kalian, sheesha or water pipe, and its smoke is cooled by passing through water in a
  pot.
examples:
- He smoked a narghile, drawing the smoke through water.
- The narghile's long tube reached the pot of water.
