simpleMeaning: A white powder used to colour things or in face creams, glass, inks and in a zinc skin
  cream, this is oxide of zinc
scope: Philosopher's wool, philosophers' wool and zinc oxide are also names for this oxide of zinc, a
  white powder used to colour things and in face creams, glass and inks, not the metal zinc itself.
examples:
- Flowers of zinc coloured the paint white.
- She mixed flowers of zinc into the face cream.
