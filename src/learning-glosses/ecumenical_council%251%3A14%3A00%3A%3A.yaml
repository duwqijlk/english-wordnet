simpleMeaning: In the early Christian church, the Pope led one of seven meetings of bishops from all over
  the known world to settle questions of belief, morals, and church rules.
scope: This is one of the seven meetings of bishops in the early church, led by the Pope, not a local
  meeting.
examples:
- The first seven councils through 787 are counted as ecumenical councils by both the Roman Catholic church
  and the Eastern Orthodox church.
- Bishops from all over the known world came to the ecumenical council.
