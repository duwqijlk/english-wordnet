simpleMeaning: to help a person who is acting or speaking by telling them the next words they have forgotten
  or not fully learned
scope: 'Also called remind and prompt: to help an actor or speaker by giving the next words; not an actor''s
  line that comes just before a speech and not the long stick used in pool.'
examples:
- The teacher cued the young actor when he forgot his line.
- She cued him quietly with the first word of the next sentence.
