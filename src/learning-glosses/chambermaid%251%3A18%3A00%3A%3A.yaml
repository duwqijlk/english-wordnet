simpleMeaning: a woman whose job is to clean and look after bedrooms, now mainly in hotels
scope: 'Also called fille de chambre: a woman paid to clean and care for bedrooms, now mainly in hotels,
  not a maid who does other kinds of house work.'
examples:
- The chambermaid changed the sheets and brought fresh towels.
- Each morning the chambermaid knocked before she entered the guest's room.
