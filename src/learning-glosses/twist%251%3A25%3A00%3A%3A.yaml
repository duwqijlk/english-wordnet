senseId: 'twist%1:25:00::'
synsetId: 13900557-n
simpleMeaning: The sharp angle a pulled-tight loop leaves in a line.
scope: This is the kink left when a looped line is pulled tight (kink is another name), not a smooth curve
  or the act of turning.
examples:
- Pulling the loop tight left a sharp twist in the rope.
- There was a twist in the wire where the loop had been drawn closed.
