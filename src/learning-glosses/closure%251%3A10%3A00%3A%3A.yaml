simpleMeaning: a rule that a group which makes decisions can use to cut short or stop a debate
scope: A rule that ends debate in a group that makes decisions, not a blockage in a pipe and not a matter
  that has been settled.
examples:
- The chair called for closure to end the long debate.
- Under the new rule, closure can be voted on after two hours of talk.
