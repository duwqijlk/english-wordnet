simpleMeaning: Of or like the families who hold the highest rank, a rank they have from birth
scope: 'Also called blue: this sense is about belonging to the highest social class, not about being soft
  and mild and not about a slope that rises slowly.'
examples:
- He came from a gentle family that had owned the land for hundreds of years.
- In the old story, she was of gentle blood and lived in a great house.
