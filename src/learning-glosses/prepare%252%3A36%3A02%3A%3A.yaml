simpleMeaning: To work out the words of a text or talk before it is written down or spoken.
scope: This is about working out the words of a report, speech or other text, not about getting objects
  ready for an event or about heating food.
examples:
- She prepared a report on the accident.
- He prepared a short speech for the ceremony.
