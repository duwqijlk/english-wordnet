simpleMeaning: to give a business money, using a mix of money from people who put money into it and money
  borrowed from lenders
scope: It means giving a business money to use, not changing money kept aside into capital, not treating
  money spent as a thing owned, and not writing in big letters.
examples:
- Investors and banks joined to capitalize the new company.
- They used money put in by investors and money borrowed from banks to capitalize the business.
