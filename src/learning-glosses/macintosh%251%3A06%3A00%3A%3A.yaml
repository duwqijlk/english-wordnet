simpleMeaning: Made of cloth treated with rubber, this coat keeps rain out
scope: Also called mac, mack and mackintosh, this is a raincoat that keeps water out, not the cloth it
  is made from and not a short jacket.
examples:
- He wore his macintosh through the storm and stayed dry.
- She hung her macintosh by the door after the rain stopped.
