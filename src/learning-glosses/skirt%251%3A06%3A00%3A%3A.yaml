simpleMeaning: a piece of clothing that hangs down from the waist and is worn mainly by girls and women
scope: A piece of clothing worn on its own, not the lower part of a dress or other clothing below the
  waist, and not the verb use that means to avoid something.
examples:
- She wore a long blue skirt to school.
- The girl's skirt hung down below her knees.
