simpleMeaning: having only one pair of small leaf parts, said of a leaf whose small parts grow along a
  stem
scope: This describes a leaf with only one pair of small leaf parts; it is not joining things in a chemical
  way and not changing a verb for person or tense.
examples:
- The plant has conjugate leaves, each with only one pair of leaflets.
- A conjugate leaf is easy to spot because it has just two leaflets opposite each other on the stem.
