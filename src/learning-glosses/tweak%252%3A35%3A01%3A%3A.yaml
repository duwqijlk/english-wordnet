simpleMeaning: To press a small part of the body hard between finger and thumb for a very short time
scope: To press a small part of the body hard between finger and thumb for a very short time; not to make
  a small change to a machine, and not to pull or tug.
examples:
- He tweaked her ear and laughed.
- She tweaked the baby's cheek and smiled.
