simpleMeaning: an old low brass wind instrument that people no longer use; it is long and curved and looks
  like a snake
scope: This is the old wind instrument, not the long animal with no legs and not the small firework that
  twists as it burns.
examples:
- The museum keeps a brass serpent in its music room.
- He played a serpent in the old church band.
