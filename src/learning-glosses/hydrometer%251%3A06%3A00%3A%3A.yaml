simpleMeaning: A tool for measuring how heavy a liquid or solid is for its size.
scope: A tool for measuring how heavy a liquid or solid is for its size, not a thermometer and not a barometer;
  gravimeter is another name for this sense.
examples:
- He dipped the hydrometer into the vat to test the beer.
- A hydrometer floats higher in a heavy liquid.
