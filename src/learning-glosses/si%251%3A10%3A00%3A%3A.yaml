simpleMeaning: The sound sung for the seventh note of any scale in the note-naming system.
scope: The sound for the seventh note of a scale, not the sixth note and not the first note; also called
  te and ti.
examples:
- Sing si for the seventh note of the scale.
- Si comes after la in the scale.
