simpleMeaning: A very large fungus of the Pacific Northwest, with a very thick stalk; the thin veil leaves
  a ring high up on the stalk.
scope: A very large fungus of the Pacific Northwest, set apart from other big stalked fungi by its very
  thick stalk and the ring the thin veil leaves high up on the stalk.
examples:
- Gymnopilus ventricosus grew under the trees, its thick stalk rising from the ground.
- We found a Gymnopilus ventricosus with a ring high up on its stalk.
