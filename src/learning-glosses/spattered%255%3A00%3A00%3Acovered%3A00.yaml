simpleMeaning: covered with bright spots of colour, often as part of a longer word
scope: 'Also called splashed or splattered: covered with bright spots, not a plain covered surface and
  not a single solid colour.'
examples:
- Kitchen walls spattered with grease were hard to clean.
- Her dress was spattered with bright paint after the art class.
