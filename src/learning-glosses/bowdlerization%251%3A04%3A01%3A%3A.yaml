senseId: 'bowdlerization%1:04:01::'
synsetId: 00397999-n
simpleMeaning: a piece of writing with all parts thought rude or shocking taken away
scope: A piece of writing with all parts thought rude or shocking taken away; bowdlerisation is another
  name for this sense, not the act of cutting them out and not words cut for length.
examples:
- The bowdlerization of the novel removed whole scenes.
- Victorian bowdlerization made the old tales safe for children.
