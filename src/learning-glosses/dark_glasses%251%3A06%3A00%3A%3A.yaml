simpleMeaning: Eye wear with lenses that are shaded or made to cut strong light, worn to keep the sun's
  bright light out of the eyes.
scope: Shaded eye wear that cuts the sun's glare; shades and sunglasses are other names for it, not plain
  reading lenses and not a hat.
examples:
- He was wearing a pair of dark glasses in the sun.
- She put on her dark glasses before going out.
