simpleMeaning: a feeling of pain or worry in the mind that makes a person not feel calm
scope: 'Also called irritation: a feeling of pain or worry in the mind, not pain in the body.'
examples:
- He felt a deep discomfort when he heard the bad news.
- Her discomfort grew as she waited for the result in silence.
