simpleMeaning: a person who keeps animals so that they can have young
scope: This is a person who keeps animals so they have young. It is not just a person who owns an animal
  or works with animals in another way.
examples:
- A dog breeder in our town raises puppies from her own dogs.
- The breeder sold a young horse to a local farmer.
