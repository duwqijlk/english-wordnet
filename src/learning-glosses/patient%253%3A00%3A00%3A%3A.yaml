simpleMeaning: able to stay calm and keep going through difficulty or delay without getting upset
scope: This is not about waiting a short while and not about medical care; it is about staying calm through
  real difficulty.
examples:
- She was patient with the slower students in her class.
- You have to be patient; the test results will take a week.
