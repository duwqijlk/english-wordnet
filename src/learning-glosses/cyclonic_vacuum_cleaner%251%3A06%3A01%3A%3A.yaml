simpleMeaning: The dust a machine sucks up is spun out into a long round tub that comes off.
scope: 'Also called cyclonic cleaner and cyclonic vacuum: a machine that sucks up dust and spins it into
  a tub, not one that keeps the dust in a bag.'
examples:
- The cyclonic vacuum cleaner sucks up dust without a bag.
- A cyclonic vacuum cleaner spins the dust into a tub that comes off.
