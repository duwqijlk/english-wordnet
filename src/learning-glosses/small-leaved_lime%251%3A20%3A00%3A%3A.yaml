scope: A wide-spreading European tree with tiny dark green growth on its branches, also called small-leaved
  linden; not the citrus fruit lime, and not a tree with big leaves.
examples:
- A small-leaved lime stood at the end of the garden path.
- They planted a small-leaved lime because its dark green leaves look good.
