simpleMeaning: Under the ground grow the small round parts of a plant of Europe, eaten as food and used
  in Scotland to give whiskey its taste.
scope: Also called earth-nut pea, earthnut pea, and tuberous vetch, its small round parts grow under the
  ground, are eaten as food, and are used in Scotland to give whiskey its taste.
examples:
- They dug up heath peas for supper.
- Heath peas give whiskey its taste in Scotland.
