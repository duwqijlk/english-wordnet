simpleMeaning: Of a leaf shape, narrow and three-sided, wide at the tip and getting narrow toward the
  stalk
scope: This says a leaf is narrow and three-sided, wide at the tip; wedge-shaped is another name for this
  sense.
examples:
- The leaf was cuneate, wide at the tip.
- Cuneate leaves taper to the stalk.
