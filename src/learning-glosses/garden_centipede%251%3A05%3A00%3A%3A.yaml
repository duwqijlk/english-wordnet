scope: This is a tiny bug with many legs that often lives in the earth under market crops and glasshouse
  plants; garden symphilid and symphilid are other names for this sense, not a true centipede and not
  a worm.
examples:
- The garden centipede lives in the earth under the crops.
- Garden centipedes harm the roots of glasshouse plants.
