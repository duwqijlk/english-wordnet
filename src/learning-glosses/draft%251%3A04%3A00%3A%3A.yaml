simpleMeaning: the act of pulling a load so that it moves
scope: 'Also called drawing, and another name for it is draught: pulling a load so it moves, not a serving
  of drink, not a part that controls air in a fireplace, and not a paper that orders payment.'
examples:
- With one strong draft, the horses pulled the wagon forward.
- The draft of the team moved the loaded cart across the field.
