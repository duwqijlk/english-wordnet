simpleMeaning: A small oval food, made of maize bread and either baked or fried, most often from the south.
scope: This small oval maize-bread cake, baked or fried and most often from the south, is also called
  a dodger or a corn dab.
examples:
- She fried a corn dodger.
- The corn dodger on her plate was small and oval.
