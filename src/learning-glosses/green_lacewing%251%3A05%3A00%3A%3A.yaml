simpleMeaning: A pale leaf-coloured insect with thin net-like wings that smells bad, whose young eat other
  small insects
scope: This pale bad-smelling insect is also called chrysopid and stink fly, and is not a butterfly and
  not a bee.
examples:
- A green lacewing rested on the window in the evening.
- The green lacewing lays eggs that hatch into hungry larvae.
