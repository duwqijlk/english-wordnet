simpleMeaning: to make a soft, weak cry, with little sound and little strength
scope: To cry softly and weakly, not to cry loudly; wail and whimper are other names for this sense.
examples:
- The kitten mewled at the door until someone let it in.
- The baby mewled softly in her sleep.
