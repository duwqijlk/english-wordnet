senseId: 'irrevocably%4:02:00::'
synsetId: 00125413-r
simpleMeaning: in a way that cannot be changed, undone, or taken back
scope: This describes something done in a way that can never be changed or undone; it is not just done
  with great force, and not just done for a long time.
examples:
- Signing the paper changed his life irrevocably.
- The old bridge was irrevocably damaged by the fire.
