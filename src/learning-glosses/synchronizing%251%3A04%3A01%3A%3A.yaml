simpleMeaning: An adjustment that brings a thing about, or about again, together.
scope: An adjustment that brings a thing about, or about again, together; also called synchronization
  or synchronisation; not the lining up of clocks to show the same time, nor the state of things happening
  at the same time.
examples:
- Their synchronizing timed the show.
- The synchronizing was done at dawn.
