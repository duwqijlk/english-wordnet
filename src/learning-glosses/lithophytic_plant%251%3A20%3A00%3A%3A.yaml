simpleMeaning: On rocks or ground full of small rocks this plant makes its home, and the air around it
  gives it what it needs to live.
scope: The plant that makes its home on rocks or ground full of small rocks and lives on what the air
  gives it is also called lithophyte.
examples:
- A lithophytic plant makes its home on rocks.
- The air gives a lithophytic plant what it needs to live.
