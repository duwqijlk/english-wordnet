simpleMeaning: In maths, a number that leaves nought when the number times the ones-and-noughts grid is
  taken from a square grid of numbers.
scope: Eigenvalue, eigenvalue of a square matrix, and characteristic root of a square matrix are other
  names for this number in maths, tied to a square grid of numbers.
examples:
- Her maths homework asked for an eigenvalue of a matrix, and she found it was 2.
- The eigenvalue of a matrix helped her solve the set of equations in her homework.
