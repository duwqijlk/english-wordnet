simpleMeaning: The flap that the body is born with lets blood flow one way, and this man-made part is
  put into the chest to take its place
scope: A man-made part that takes the place of a flap in the chest that lets blood flow one way, not a
  flap that is born in the body and not a tube that carries blood.
examples:
- The heart valve they put in lets blood flow the right way.
- After the heart valve was fitted, her breathing got easier.
