simpleMeaning: A cover of rubber or plastic that guards a mother's breast while she feeds her baby.
scope: A cover of rubber or plastic that guards a mother's breast while she feeds her baby, not a bottle
  for feeding a baby and not a pad worn inside clothing.
examples:
- She used a nipple shield while nursing her baby.
- The nipple shield is made of soft rubber.
