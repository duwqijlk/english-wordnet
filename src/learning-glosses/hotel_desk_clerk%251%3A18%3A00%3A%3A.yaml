simpleMeaning: A person who greets guests when they arrive and helps them with their stay.
scope: A worker who greets guests at a place to stay; hotel clerk is another name for this sense, not
  a worker who cleans rooms and not the person who runs the place.
examples:
- The hotel desk clerk smiled as we walked in.
- The hotel desk clerk booked a taxi for us.
