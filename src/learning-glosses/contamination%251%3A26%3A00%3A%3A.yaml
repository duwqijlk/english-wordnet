simpleMeaning: the state of being not clean because unwanted things have got in and mixed with something
scope: This is the state of being not clean; it is not the act of making something dirty, and not the
  unwanted thing itself that gets in.
examples:
- Contamination of the river made the water unsafe to drink.
- Tests found contamination in the food, so the shop had to close.
