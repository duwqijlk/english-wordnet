simpleMeaning: of or about babies or the first part of life when a person is a baby
scope: This sense means of or about babies and their early life, not the sense that means like a baby
  in the way someone acts.
examples:
- Infantile paralysis is a disease that affects babies.
- The doctor studies infantile growth in the first year of life.
