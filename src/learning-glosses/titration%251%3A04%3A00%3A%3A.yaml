simpleMeaning: To work out how strong a liquid is, measured amounts of it are added to a known amount
  of a second liquid until the two just finish reacting.
scope: This is how the strength of a liquid is worked out, by adding measured amounts of it to a known
  amount of a second liquid until the two just finish reacting.
examples:
- By titration, they found how strong the liquid was.
- They used titration to find how strong the liquid was.
