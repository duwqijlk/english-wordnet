simpleMeaning: about running and organizing the work of a business, office or other group, or in charge
  of doing this
scope: About the work of running an office or group, or in charge of that work; not about doing the group's
  main work itself.
examples:
- She does administrative work for the school office.
- He has an administrative role and looks after all the records.
