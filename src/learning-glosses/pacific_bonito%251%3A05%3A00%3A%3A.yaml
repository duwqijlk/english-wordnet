simpleMeaning: A common fish of the west coast of the Americas, whose dark oily flesh keeps well in cans
scope: This is a common fish of the west coast of the Americas, whose dark oily flesh keeps well in cans;
  Chile bonito, Chilean bonito and Sarda chiliensis are other names for this sense, and a fish of other
  coasts whose flesh does not keep well in cans is a different kind.
examples:
- The Pacific bonito is a common fish off the west coast.
- We canned Pacific bonito for the winter.
