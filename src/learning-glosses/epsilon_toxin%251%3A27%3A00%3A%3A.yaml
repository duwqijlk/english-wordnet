simpleMeaning: a poison made by the bacterium Clostridium perfringens that causes severe stomach cramps
  and diarrhea starting 8 to 22 hours after eating food heavily contaminated with the bacteria
scope: This is the gut poison made by Clostridium perfringens, not the bacterium itself or the other toxins
  the same germ produces.
examples:
- Epsilon toxin damages the lining of the gut and causes sudden, severe diarrhea.
- Food left out too long can carry the bacteria that produce epsilon toxin.
