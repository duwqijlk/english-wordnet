simpleMeaning: Africa is where this small warbler of Europe spends the winter, after nesting among tall
  water plants and wedges.
scope: Also called sedge bird, sedge warbler, and sedge wren, this small warbler of Europe nests among
  tall water plants and wedges and spends the winter in Africa.
examples:
- A reedbird sang among the tall water plants.
- We heard a reedbird by the water.
