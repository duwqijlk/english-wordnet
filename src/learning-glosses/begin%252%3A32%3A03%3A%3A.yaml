simpleMeaning: To start talking, or to give the first words of a speech or story.
scope: This is starting to talk or giving the opening words, not starting to learn a language and not
  starting another activity implied by an object.
examples:
- '"Good evening," she began.'
- He began by reading the minutes aloud.
