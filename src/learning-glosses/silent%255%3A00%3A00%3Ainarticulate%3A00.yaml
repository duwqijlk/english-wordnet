simpleMeaning: not able to speak because of deafness that runs in the family
scope: This describes someone who cannot speak because of inherited deafness, not someone who merely stays
  quiet when spoken to or a meaning that is only implied.
examples:
- Born deaf, she remained silent all her life and relied on signing.
- The school taught silent children to read lips and use sign language.
