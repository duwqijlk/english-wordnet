simpleMeaning: Cheaper wood below is covered by a thin skin of fine wood glued onto it.
scope: Also called veneer, it is the thin layer of fine wood that covers cheaper wood below, not fine
  wood all the way through.
examples:
- The veneering on the old table was a thin skin of fine wood.
- They fixed the veneering where it had come loose from the cheaper wood below.
