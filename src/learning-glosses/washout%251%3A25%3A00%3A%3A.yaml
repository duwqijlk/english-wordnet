simpleMeaning: A groove or break in ground that is rather soft, cut out by water wearing the earth away.
scope: A groove or break in ground that is rather soft, cut out by water wearing the earth away; not the
  wearing away itself, which is the process of washing soil or gravel away, as from a road.
examples:
- It was days after the storm before they could fill the washout and open the road.
- The track ended at a deep washout where the rain had cut the bank away.
