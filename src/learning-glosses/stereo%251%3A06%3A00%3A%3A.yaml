simpleMeaning: A machine that plays sound through two or more speakers, fed by two microphones, so the
  sound seems to come from all around
scope: This is a machine that plays sound through two or more speakers so it seems to come from all around,
  not a pair of photos and not a word for sound with two channels.
examples:
- He turned up the stereo and the room filled with music.
- Our stereo has two large speakers.
