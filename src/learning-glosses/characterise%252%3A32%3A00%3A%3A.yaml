senseId: 'characterise%2:32:00::'
synsetId: 00958719-v
simpleMeaning: To describe what a person or thing is like, and what sets them apart.
scope: 'Also called qualify or characterize: to describe what a person or thing is like; not to be typical
  of something.'
examples:
- You can characterise his behaviour as that of a proud man.
- The poem can be characterised as a sad song for a lost friend.
