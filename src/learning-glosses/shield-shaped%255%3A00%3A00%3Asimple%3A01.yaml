senseId: shield-shaped%5:00:00:simple:01
synsetId: 02177756-s
simpleMeaning: Of a leaf shape, round, with the stem joined near the middle of the under side rather than
  the edge, as in a nasturtium leaf
scope: Of a leaf shape, round, with the stem joined near the middle of the under side, also called peltate;
  not a heart-shaped leaf and not a leaf with the stem at the edge.
examples:
- The nasturtium has a shield-shaped leaf.
- A shield-shaped leaf has its stem near the middle of the under side.
