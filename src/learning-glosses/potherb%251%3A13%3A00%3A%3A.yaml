simpleMeaning: any of a group of soft green plants with leaves, stems, or flowers that are cooked and
  eaten or used to add taste to food
scope: This is a plant whose leaves, stems, or flowers are cooked and eaten, not a plant used only as
  medicine and not a plant grown only for its looks.
examples:
- She picked potherbs from the garden and cooked them for lunch.
- He cooked the potherb stems with rice for dinner.
