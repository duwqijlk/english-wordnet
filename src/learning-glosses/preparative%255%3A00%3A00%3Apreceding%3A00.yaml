simpleMeaning: Coming before something else, and getting it ready
scope: This means coming before something else and getting it ready; preparatory is another name for this
  sense, not the main event itself and not something done after it.
examples:
- Preparative work began a week before the opening.
- She made preparative notes for the meeting.
