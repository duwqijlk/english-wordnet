simpleMeaning: To put a hidden listening device on a phone or telegraph line so you can hear what is said
scope: Listening in on a phone line in secret, not an insect and not a hidden microphone itself; also
  called tap.
examples:
- The FBI bugged the phone line of the suspected spy.
- Is this hotel room bugged?
