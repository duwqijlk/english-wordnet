simpleMeaning: An early, medium-sized theropod, a fast-running two-legged meat-eating dinosaur with grasping,
  sharp-clawed hands and a short horn between the nostrils, found in North America during the Jurassic.
scope: This is the medium-sized Jurassic meat-eater with a short nose horn, not a tyrannosaur or a horned,
  plant-eating ceratopsian.
examples:
- A ceratosaurus skeleton in the hall shows the horn between its nostrils.
- The ceratosaurus ran on two legs and hunted smaller dinosaurs.
