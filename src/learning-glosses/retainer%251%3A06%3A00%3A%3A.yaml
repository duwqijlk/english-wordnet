simpleMeaning: A device worn in the mouth that keeps teeth, or a false tooth, in place after teeth have
  been straightened
scope: A mouth device that keeps teeth in place after straightening, not a fee paid in advance and not
  a person kept in service.
examples:
- She wore her retainer every night after the braces came off.
- The dentist told him to keep the retainer in for a year.
