senseId: 'subculture%1:14:00::'
synsetId: 08305674-n
simpleMeaning: a group of people in a country who have their own way of behaving and their own beliefs,
  different from most people in that country
scope: A smaller group inside a country with its own way of life and beliefs; not the way of life of the
  whole country and not just a group of friends.
examples:
- The music subculture in the city has its own clothes and beliefs.
- She studied a subculture of young artists who live and work together.
