simpleMeaning: to move your back forward and down, starting at the waist
scope: 'Also called bow and crouch: this is moving your own back forward and down. It is not making an
  object curved and not a curved part of a road.'
examples:
- She had to bend down to pick up the girl's bag.
- He will bend forward from the waist to greet the queen.
