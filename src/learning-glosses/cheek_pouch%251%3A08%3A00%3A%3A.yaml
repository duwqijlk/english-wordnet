simpleMeaning: a thin soft bag inside the mouth of many small animals that gnaw, such as a gopher
scope: A thin soft bag inside the mouth of a gnawing animal, not a bag worn outside the body and not a
  pocket in the clothes.
examples:
- The gopher stuffed seeds into its cheek pouch.
- Her cheek pouch bulged with the nuts she had stored.
