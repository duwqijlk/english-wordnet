simpleMeaning: an idea about what may be true, put together by guessing, usually with little hard proof
  to back it
scope: An idea put together by guessing, usually with little hard proof; not deep thinking over a subject
  and not a risky money deal.
examples:
- There was much speculation about the outcome of the election.
- He dismissed it as mere speculation.
