simpleMeaning: A faith held by many groups, above all in Asia, who follow the teaching of the Buddha in
  its many forms and honour him.
scope: The faith of many groups, above all in Asia, who follow the teaching of the Buddha in its many
  forms and honour him, set apart from the teaching itself, which is a different sense, and from other
  faiths held in Asia and elsewhere.
examples:
- Buddhism spread across Asia over many centuries.
- She studied Buddhism at the temple school.
