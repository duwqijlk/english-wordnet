simpleMeaning: A North American plant that lies along the ground, keeps its leaves all year like a heath
  plant, and has yellow flowers.
scope: 'Also called false heather: a low North American plant that keeps its leaves all year and has yellow
  flowers, not a true heather and not a tall shrub.'
examples:
- Golden heather spread low across the rocky ground.
- The golden heather's yellow flowers opened in spring.
