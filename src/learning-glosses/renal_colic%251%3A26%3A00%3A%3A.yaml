simpleMeaning: A kidney stone passing through the tube from the kidney goes with a sharp pain low in the
  back that spreads to the groin.
scope: It is a sharp pain low in the back that spreads to the groin, going with a kidney stone passing
  through the tube from the kidney.
examples:
- The renal colic came on as the kidney stone moved through.
- The pain of renal colic spread from the back to the groin.
