simpleMeaning: hurt by being frozen, fully or in part
scope: This means hurt by freezing, fully or in part, whether it is a part of the body or something else
  such as fruit; it does not mean just feeling very cold.
examples:
- His frostbitten toes turned dark after the night in the snow.
- She was treated in hospital for frostbitten fingers.
