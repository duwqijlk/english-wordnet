simpleMeaning: a very large cloud of gas, mainly hydrogen (a light gas), and dust in the space between
  the stars
scope: A huge cloud of gas and dust between the stars, not a cloudy spot on the eye and not a liquid medicine
  made to be sprayed.
examples:
- The telescope showed a bright nebula far away in space.
- Through the telescope, we could see the nebula as a faint cloud among the stars.
