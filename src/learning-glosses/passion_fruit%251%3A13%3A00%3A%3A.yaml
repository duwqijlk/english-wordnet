simpleMeaning: People make iced sweets, candy, and drinks from this egg-shaped fruit of warm lands, which
  grows on some kinds of climbing plant.
scope: The fruit of a climbing plant from warm lands, not the plant itself and not a drink made from it.
examples:
- She cut open a passion fruit and scooped out the seeds.
- They served passion fruit drinks at the party.
