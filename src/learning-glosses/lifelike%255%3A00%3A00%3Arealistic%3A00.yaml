schema: oewn-learning-gloss-v2
senseId: lifelike%5:00:00:realistic:00
synsetId: 01947643-s
simpleMeaning: making clear pictures come into the mind, as if the thing were real
scope: This is about words or pictures that make a clear picture in the mind; it is not about a person,
  statue, or painting that looks real and alive.
examples:
- Her lifelike description made me see the battle in my mind.
- His lifelike account of the storm let us picture every wave.
