simpleMeaning: To make a picture or a sound less hard and less sharp
scope: Making a picture or sound less hard, not making a thing soft to touch and not a thing getting soft
  on its own.
examples:
- The curtains soften the light in the room.
- She softened her voice so the baby would sleep.
