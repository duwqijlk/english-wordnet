senseId: 'southeast_by_south%1:24:00::'
synsetId: 13855192-n
simpleMeaning: The compass point one step clockwise from the point halfway between the rising sun and
  the direction opposite north
scope: A compass point one step clockwise from the south-east point, not that point itself and not the
  point two steps away.
examples:
- The ship sailed southeast by south.
- Southeast by south is one point south of southeast.
