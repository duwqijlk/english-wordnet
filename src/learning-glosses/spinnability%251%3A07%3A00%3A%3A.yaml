simpleMeaning: How well cloth fibres can be drawn out and twisted into thread
scope: How well cloth fibres can be drawn out and twisted into thread, not how strong a thread is and
  not how soft a cloth feels.
examples:
- The spinnability of the cotton was high, so it drew out into fine thread.
- Good spinnability means the fibres twist well into thread.
