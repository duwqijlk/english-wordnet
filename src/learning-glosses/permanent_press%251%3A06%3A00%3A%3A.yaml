simpleMeaning: A cloth treated with chemicals so it stays smooth and keeps its shape.
scope: A cloth treated with chemicals so it stays smooth and keeps its shape, also called durable press,
  not a cloth that needs ironing and not a cloth that falls out of shape.
examples:
- Her shirt was made of permanent press cloth.
- Permanent press keeps its shape after washing.
