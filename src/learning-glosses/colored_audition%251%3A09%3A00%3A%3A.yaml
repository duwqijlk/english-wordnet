simpleMeaning: A condition in which a sound heard also brings a sense of a shade to mind
scope: A condition in which sounds bring shades to mind; colored hearing is another name for this sense,
  not imagining a shade and not a fault of the ears.
examples:
- Her colored audition means a bell can bring a flash of blue.
- With colored audition, each note seemed to carry its own shade.
