simpleMeaning: to bring people into a country, or send them there, so they can live there
scope: This is what a country or group does when it brings people in to live there. It is not the act
  of moving to a new country yourself, and not the act of leaving a country.
examples:
- Britain immigrated many settlers to America long ago.
- The king immigrated workers from other lands to build his new town.
