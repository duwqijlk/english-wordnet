simpleMeaning: a lever that a pilot moves to work the hinged flaps on an aircraft's wings and tail.
scope: This is the lever a pilot uses in an aircraft, not the verb meaning to cling to a surface.
examples:
- The pilot pulled back on the stick to raise the nose.
- He gripped the stick as the plane began to climb.
