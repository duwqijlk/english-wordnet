simpleMeaning: a solid that has formed in a liquid, still floating in it or sunk to the bottom, or left
  behind after the liquid is poured through a filter
scope: This is the solid formed in a liquid, not the verb sense of falling straight down fast, head first.
examples:
- The white precipitate settled at the bottom of the test tube.
- After filtering, a brown precipitate was left on the paper.
