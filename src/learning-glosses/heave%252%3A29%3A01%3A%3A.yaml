simpleMeaning: to breathe in a loud, hard way when you are worn out and out of breath
scope: 'Also called gasp, pant, and puff: loud, hard breathing when you are worn out, not a rising and
  falling movement and not trying to be sick.'
examples:
- He heaved for breath at the top of the hill.
- After the race she stood heaving, hands on her knees.
