simpleMeaning: Small shiny white balls come mostly from this sea oyster of warm waters, found mostly off
  eastern Asia and the Pacific coast of North and Central America.
scope: A sea oyster of warm waters and a main source of small shiny white balls, not the balls themselves.
examples:
- Divers gather pearl oysters off the coast of eastern Asia.
- The pearl oyster lives in warm seas and makes small shiny white balls.
