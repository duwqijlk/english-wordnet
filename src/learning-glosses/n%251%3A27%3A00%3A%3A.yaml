simpleMeaning: a common gas, not metal, normally colorless, odorless and tasteless, of two atoms, slow
  to react; it fills 78% of the air by volume and is in all living tissue
scope: This is the gas with no color, smell or taste that fills most of the air, not the measure of push,
  the measure of a mix, the 14th letter, or the compass point, and it is also called nitrogen and atomic
  number 7.
examples:
- N fills most of the air we breathe.
- Plants take N from the soil.
