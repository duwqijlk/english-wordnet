simpleMeaning: To move, draw off, or empty a liquid as if by a tube.
scope: To move, draw off, or empty a liquid as if by a tube; also called siphon; not a pipe from the liquid
  in a pot to a lower place outside it, so that weight pushes the liquid through, nor a pipe-like part
  in a water creature, especially in shellfish, through which water is taken in or sent out.
examples:
- They would syphon the petrol from the tank.
- The farmer came to syphon the water.
