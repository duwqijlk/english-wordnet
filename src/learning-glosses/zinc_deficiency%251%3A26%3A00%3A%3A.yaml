simpleMeaning: Liver sickness, cystic fibrosis, or other sicknesses can bring on this lack, as can too
  little of a metal in the food a person eats.
scope: Too little of a metal in the body, brought on by too little in food or by sickness.
examples:
- His zinc deficiency came from too little zinc in his diet.
- Her zinc deficiency was caused by cystic fibrosis.
