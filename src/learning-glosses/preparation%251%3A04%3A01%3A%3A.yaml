simpleMeaning: school work that a student does away from school, especially at home
scope: This is school work that a student does outside school, especially at home; not the act of getting
  something ready, not a thing made to a set plan, and not cooking food.
examples:
- He did his evening preparation at home before dinner.
- She finished her preparation at home and brought it to school the next day.
