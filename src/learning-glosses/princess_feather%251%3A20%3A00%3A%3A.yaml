simpleMeaning: A one-season plant, originally from southeastern Asia and Australia and now wild in North
  America, with broad oval leaves and thin drooping spikes of crimson flowers.
scope: A crimson-spiked annual, also known as prince's-feather, prince's-plume and kiss-me-over-the-garden-gate;
  not the unrelated amaranth that shares the name princess feather.
examples:
- Princess feather has broad oval leaves and slender spikes of crimson flowers that hang downward.
- Though native to southeastern Asia and Australia, princess feather now grows wild in North America.
