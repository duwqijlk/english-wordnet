simpleMeaning: In physics, the thought that bits of matter pull each other with a pull that grows with
  the product of their masses and falls with the square of the gap.
scope: In physics, a thought about how bits of matter pull each other, also called gravitational theory,
  theory of gravitation and theory of gravity; its near kin are the other thoughts in physics about pulls
  between bits of matter.
examples:
- Newton's theory of gravitation explains the pull between masses.
- Newton's theory of gravitation says the pull grows with mass.
