simpleMeaning: A painting done in water-based paints that do not let light through, mixed with gum.
scope: A painting done in water-based paints that do not let light through, mixed with gum; not the paint
  itself, an opaque water-based paint made ready with gum.
examples:
- The artist's gouache hung in the front room, bright against the white wall.
- The gouache showed a harbour at dusk, painted in flat, bright colours.
