simpleMeaning: a tiny crystal of silicon, a material that carries electric signals, made to do many jobs
  in one small electric circuit
scope: A small electronic part, not a gambling counter, not a fried potato slice, and not a wooden float
  on a line.
examples:
- The new phone has a faster chip inside it.
- Engineers put a tiny chip in the washing machine to control it.
