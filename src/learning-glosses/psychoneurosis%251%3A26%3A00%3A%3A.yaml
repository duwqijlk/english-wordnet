senseId: 'psychoneurosis%1:26:00::'
synsetId: 14416566-n
simpleMeaning: A trouble of the mind or of how a person acts and feels, with no known cause in the nerves
  or the body.
scope: A trouble of the mind with no known bodily cause, also called neurosis and neuroticism; not a brain
  disease and not a passing worry.
examples:
- Her psychoneurosis made her fear open places for years.
- The doctor said his psychoneurosis had no cause in the nerves or the body.
