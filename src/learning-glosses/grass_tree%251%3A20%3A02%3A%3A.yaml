simpleMeaning: A thin Tasmanian plant with a bush-like shape that stays green all year, with long narrow
  tapering leaves three to five feet long
scope: This thin Tasmanian plant is also called tree heath, and is not a true tree and not a low bush.
examples:
- The grass tree stood alone on the dry hillside.
- A grass tree grew beside the track in Tasmania.
