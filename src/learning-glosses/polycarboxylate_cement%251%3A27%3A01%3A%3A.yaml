simpleMeaning: Fillings stay in place and holes in teeth are lined with this tooth glue.
scope: Unlike a filling itself, this tooth glue holds fillings in place and lines holes in teeth.
examples:
- The filling was held in place by polycarboxylate cement.
- This polycarboxylate cement lined the hole in the tooth.
