simpleMeaning: A colorless, flammable liquid that mixes with other liquids, used to dissolve resins, strip
  paint, and make lacquers, cements, adhesives, cleaning fluids and celluloid film.
scope: A clear industrial solvent, also called butanone; it is not acetone, a similar but different solvent,
  and not an alcohol.
examples:
- Methyl ethyl ketone cuts through the ink that builds up on printing presses.
- The label on the drum warned that methyl ethyl ketone is highly flammable.
