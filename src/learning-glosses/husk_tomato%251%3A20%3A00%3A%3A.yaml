simpleMeaning: Any of many worldwide annual or perennial plants of the Physalis genus, with edible fleshy
  berries inside a papery case; some are grown for their flowers.
scope: This is the whole plant, not its small edible fruit or the papery case around that fruit.
examples:
- Husk tomatoes are sometimes grown for their flowers.
- A husk tomato plant covered the back fence by August.
