simpleMeaning: The seed of the mung bean plant, eaten as food, and food made from that seed
scope: The seed of the mung bean plant eaten as food; also called green bean, green gram, green soy, mash
  bean, monggo, moong, mung, mung bean and munggo, not a rice grain and not a pea pod.
examples:
- Golden gram is cooked like lentils in many dishes.
- She bought golden gram at the market for soup.
