simpleMeaning: a hunting insect from western North America, with a long front part of its body that looks
  like a neck
scope: A hunting insect from western North America; not a fly that bites people and not a snake.
examples:
- The snakefly raised the long front part of its body as it hunted for prey.
- A snakefly rested on the bark in the western woods.
