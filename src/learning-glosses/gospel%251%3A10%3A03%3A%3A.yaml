simpleMeaning: folk music sung without instruments, first sung by Black slaves in the United States, with
  a leader singing and the group answering; it shaped other popular music, above all soul
scope: Folk music sung without instruments, with call and answer; not the Christian message, and not just
  any church song.
examples:
- The choir sang gospel at the service.
- Gospel music filled the hall.
