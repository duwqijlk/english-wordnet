simpleMeaning: a small case put in a gun, filled with powder that can blow up, but with no hard piece
  to be shot out
scope: This is a case for a gun with powder but no hard piece to shoot. It is not an empty space between
  words and not a gap where a part is missing.
examples:
- The soldier loaded a blank into his gun for training.
- They fired blanks during the film scene so no one would be hurt.
