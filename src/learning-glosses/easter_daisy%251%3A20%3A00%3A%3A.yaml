simpleMeaning: A low tufted plant with almost no stem, a ring of woolly leaves and large white-rayed flower
  heads and bristly dry fruits; from central Canada west to Arizona.
scope: A low tufted plant with a ring of woolly leaves and large white flower heads, also called a stemless
  daisy or Townsendia exscapa; not a garden daisy and not a dandelion.
examples:
- The Easter daisy bloomed in the rock garden in early spring.
- Easter daisy plants formed low woolly tufts among the stones.
