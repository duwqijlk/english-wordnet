simpleMeaning: To look into a matter or run a formal meeting, a state body picks a person, so it can use
  the powers the law gives it
scope: A person picked by a state body to look into a matter or run a formal meeting, also called a hearing
  officer, not a judge and not a lawyer for one side.
examples:
- The hearing examiner asked both sides to give their facts.
- A hearing examiner will run the meeting next week.
