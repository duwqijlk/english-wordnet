simpleMeaning: to have sex with another person and not stay true to your husband or wife in marriage
scope: Also called wander, betray and cheat. It means having sex with someone else while married, not
  walking with no clear way, not cheating in a test, and not breaking trust in other ways.
examples:
- She cuckolded her husband with a man from work.
- He learned that his wife had cuckolded him for months.
