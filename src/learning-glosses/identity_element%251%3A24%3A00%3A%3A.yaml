senseId: 'identity_element%1:24:00::'
synsetId: 13808960-n
simpleMeaning: A thing in maths stays just as it was after this step works on it
scope: In maths, a step that leaves a thing just as it was, also called identity and identity operator;
  not a change of size and not a new thing.
examples:
- Under multiplication, the identity element is 1, since it leaves any number unchanged.
- The teacher showed that the identity element for addition is zero.
