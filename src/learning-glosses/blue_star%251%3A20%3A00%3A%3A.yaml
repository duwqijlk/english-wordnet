simpleMeaning: With flowers the colour of a clear sky in short clusters at the stem ends, these low woody
  plants of the south-east United States grow slowly in bunches.
scope: These low woody plants of the south-east United States, with sky-coloured flowers in short clusters
  at the stem ends, are not tall shrubs.
examples:
- The blue stars grow slowly in bunches.
- Blue star bears sky-coloured flowers in short clusters at the ends of its stems.
