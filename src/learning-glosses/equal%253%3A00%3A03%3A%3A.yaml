simpleMeaning: having the needed power, skill, and other things it takes to do a task
scope: This means being able to do a task, not making things the same, not being as good as another person,
  and not a person with the same rank.
examples:
- She was equal to the hard task of running the office alone.
- After his training, he felt equal to the job.
