simpleMeaning: Several firms that each handle a different part of making and selling a product, from raw
  stuff to the people who buy it, are taken into one firm.
scope: Also called vertical integration, this is the case where several firms that handle every part of
  making and selling a product, from raw stuff to the buyer, end up inside one firm.
examples:
- Through vertical combination, the firm took over its suppliers, its factories, and its shops.
- By vertical combination, one firm took over every stage of making the product.
