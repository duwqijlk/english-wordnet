simpleMeaning: A South African animal like a mongoose, with a face like a lemur and only four toes.
scope: A South African animal like a mongoose, with a face like a lemur and only four toes, also called
  a meerkat; not a mongoose itself and not a lemur.
examples:
- The mierkat has a face like a lemur and only four toes.
- A mierkat lives in South Africa and looks like a mongoose.
