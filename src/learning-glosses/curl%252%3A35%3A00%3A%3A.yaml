simpleMeaning: to wind something round and round so it forms tight spirals or small loops
scope: Winding something into spirals or small loops; wave is another name for this sense, not a rival,
  and it is not merely taking a curved shape or wrapping something around an object.
examples:
- She curled her hair with a hot iron.
- He curled the ribbon with the edge of the scissors.
