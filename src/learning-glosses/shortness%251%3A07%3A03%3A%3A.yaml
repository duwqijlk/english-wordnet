simpleMeaning: the fact that a distance or a thing is small from one end to the other
scope: This is about length or distance being small, not about how long something lasts in time and not
  about a person's height.
examples:
- The shortness of the path made it an easy walk.
- The shortness of the rope meant it could not reach the ground.
