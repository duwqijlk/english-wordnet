simpleMeaning: In logic, to reach a clear decision that something is true by thinking step by step from
  the statements given
scope: 'Also called deduce: in logic, this is reaching a decision that something is true by thinking step
  by step from given statements. Not guessing an answer and not the general sense of working out a truth
  by thinking step by step outside logic.'
examples:
- In logic, we infer a new statement from the statements before it.
- From 'all men die' and 'he is a man', we infer that he will die.
