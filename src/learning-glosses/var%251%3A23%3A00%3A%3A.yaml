simpleMeaning: A unit of electric power in a circuit with changing current, equal to the power used up
  when 1 volt makes a current of 1 ampere.
scope: Also called a volt-ampere; a unit of electric power in a circuit with changing current, not a unit
  of heat or light.
examples:
- The var told them how much power the circuit used up.
- Engineers read the var on the meter.
