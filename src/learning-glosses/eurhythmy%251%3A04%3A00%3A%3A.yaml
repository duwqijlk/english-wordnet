simpleMeaning: To teach people to grasp music, smooth movements of the body show the beat of a piece of
  music.
scope: Also called eurhythmics, eurythmics and eurythmy, it is a way to teach people to grasp music through
  the body.
examples:
- They learned eurhythmy to show the beat of the music with their bodies.
- Eurhythmy helped them grasp the music through movement.
