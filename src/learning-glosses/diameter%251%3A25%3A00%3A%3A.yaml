simpleMeaning: a straight line through the middle of a circle or a sphere (a solid ball), joining two
  points on its edge or outer surface
scope: This is the straight line itself that goes across a circle or ball, not the length of that line.
examples:
- Draw the diameter from one side of the circle to the other.
- On the diagram, the diameter is drawn as a straight line through the centre.
