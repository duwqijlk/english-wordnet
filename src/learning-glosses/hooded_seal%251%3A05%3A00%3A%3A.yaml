simpleMeaning: a seal of middle size, dark grey, with a big sac on its head that it can blow up, found
  in the Arctic and the north Atlantic
scope: 'Also called bladdernose: a dark grey seal with a sac on its head, not a fur seal and not a sea
  lion.'
examples:
- The hooded seal blew up the big sac on its head as the boat drew near.
- A hooded seal rested on the ice in the cold north Atlantic.
