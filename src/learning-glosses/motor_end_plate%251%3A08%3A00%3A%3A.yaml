simpleMeaning: Where a nerve cell meets a muscle, its flat tip hands over the signals that reach the muscle.
scope: It is also called an end-plate or an endplate, and it is the flat tip of a nerve cell, not the
  muscle it hands its signals to.
examples:
- The motor end plate lies where the nerve meets the muscle.
- Signals reach the muscle through the motor end plate.
