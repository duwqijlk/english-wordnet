simpleMeaning: Of the face, having small flaws on the skin
scope: Also called pimpled, this describes the skin of the face when it has small raised spots, not skin
  that is clean and smooth.
examples:
- His pimply face made him shy about having his photo taken.
- Her pimply complexion got better as she grew older.
