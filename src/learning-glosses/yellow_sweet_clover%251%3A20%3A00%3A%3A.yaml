simpleMeaning: a Eurasian plant that lives two years, with gold flowers and scented leaves used to settle
  wind or flavour food, grown widely above all to feed or cover the soil
scope: A plant grown to feed or cover the soil, not a plant grown for its flowers alone and not a wild
  grass.
examples:
- Farmers sow yellow sweet clover to feed the soil.
- The yellow sweet clover by the fence has scented leaves.
