simpleMeaning: to make a dirty mark on something by rubbing it, or to make something dirty in that way
scope: 'Also called smear and smudge: to make a dirty mark by rubbing; not making something unclear to
  see or think about, and not the noun for an unclear thing.'
examples:
- He blurred the wet ink with his hand, leaving a dark mark.
- Be careful not to blur the fresh paint when you touch it.
