simpleMeaning: to tell what will happen next by powers beyond the natural world, whether by skill, as
  a real gift, or only as a show
scope: 'Also called divination and foretelling: the art of telling the future by powers beyond nature,
  not guessing from facts and not plain storytelling.'
examples:
- She earned her living by fortune telling at the fair.
- Fortune telling by cards drew a long line of visitors.
