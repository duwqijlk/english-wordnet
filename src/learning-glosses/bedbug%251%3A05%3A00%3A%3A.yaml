simpleMeaning: a small insect of places that are not hot or cold, that gets into a place in large numbers,
  especially beds, and feeds on human blood
scope: Also called a bed bug or a chinch, this is the small insect that lives in beds and feeds on blood,
  not any other kind of small insect in a house.
examples:
- We found a bedbug in the seam of the mattress.
- Bedbugs left small red bites on her arms after the night in the hotel.
