simpleMeaning: A person in sport who does acts that need skill, quick smooth movement, and parts of the
  body working well together
scope: This is a person whose acts need skill and body control, not a clown whose act is only for laughs
  and not a singer.
examples:
- The acrobat walked across a high wire with no net below.
- As an acrobat, she could turn over in the air and land on her feet.
