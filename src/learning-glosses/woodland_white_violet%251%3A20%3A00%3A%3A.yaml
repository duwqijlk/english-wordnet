simpleMeaning: In the east of North America, this short-stemmed plant bears pale flowers with a sweet
  smell, each marked with thin purple lines.
scope: Also called sweet white violet and white violet, this short-stemmed plant of the east of North
  America is known by its pale flowers with a sweet smell and thin purple lines.
examples:
- The woodland white violet opened its pale flowers.
- This woodland white violet bears pale flowers marked with thin purple lines.
