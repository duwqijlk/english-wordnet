simpleMeaning: to give a person or company the right to sell another company's goods or services in a
  place
scope: This is the act of giving that right, not the business that gets it, not the right itself, and
  not a right to vote given by a government.
examples:
- The company franchised its coffee shops to owners in many cities.
- They franchised the right to open stores across the country.
