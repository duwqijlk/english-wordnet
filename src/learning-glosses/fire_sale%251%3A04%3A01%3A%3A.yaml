simpleMeaning: As a rule, when a seller is about to go out of business, they sell what they own at very
  low prices.
scope: As a rule, when a seller is about to go out of business, they sell what they own at very low prices;
  not a normal cut in prices to win buyers and not a cut in prices to clear old stock.
examples:
- The shop held a fire sale after the owner went bankrupt.
- At the fire sale, goods went for a tenth of their price.
