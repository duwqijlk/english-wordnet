simpleMeaning: not honest on purpose, especially by seeming to feel one way while your true feelings lead
  you to act in another way
scope: Also called duplicitous and ambidextrous. This sense is about hiding true feelings while showing
  false ones, not about a simple honest mistake.
examples:
- She gave a deceitful smile, acting friendly while she planned to harm him.
- He was deceitful with his friends, hiding his anger behind kind words.
