simpleMeaning: to slice through something with wide, sweeping strokes, as with an ax or a long heavy knife
scope: 'Also called slash: to slice through something with wide sweeping strokes, not to make something
  shorter and not to fell a tree.'
examples:
- He cut down the tall weeds with a machete.
- She cut down the thick stalks with wide strokes of her ax.
