schema: oewn-learning-gloss-v2
senseId: 'heir_presumptive%1:18:00::'
synsetId: 10188834-n
simpleMeaning: A person who is next in line to get what a dead person leaves, but who can lose that place
  if a closer relative is born.
scope: This person expects to take over what a dead person leaves, but a closer relative born later can
  take that place; not an heir apparent, whose right cannot be lost, and not a person named in a will.
examples:
- The heir presumptive waited to see if a child would be born to the king.
- If no closer relative is born, the heir presumptive will take over the estate.
