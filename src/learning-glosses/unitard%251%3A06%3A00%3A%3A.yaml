simpleMeaning: A snug garment of stretchy fabric covering the torso from the shoulders to the thighs,
  which may have long sleeves or ankle-length legs, worn by ballet dancers and acrobats.
scope: Another name for the stretchy practice garment also called a leotard, body suit or cat suit; not
  a two-piece outfit or plain tights.
examples:
- The dancer pulled on a black unitard before rehearsal.
- The acrobats wore matching unitards for the evening show.
