simpleMeaning: In obstetrics, the way an unborn baby lies in the womb and where it sits compared with
  the path out at birth
scope: In obstetrics, this is how an unborn baby lies before birth, not a talk or show for people and
  not the act of giving a prize.
examples:
- The baby's presentation was head first, so the birth could go ahead normally.
- An abnormal presentation may mean the mother needs an operation to deliver the baby.
