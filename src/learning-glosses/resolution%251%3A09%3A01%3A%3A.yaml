simpleMeaning: something that people have decided and settled, and the end result that comes from making
  that decision
scope: 'Also called settlement: this is a matter that people have decided and settled, or the result of
  that decision, not a statement that solves a problem and not the sharpness of a picture.'
examples:
- The two sides finally reached a resolution after weeks of talks.
- The resolution of the long argument let everyone move on.
