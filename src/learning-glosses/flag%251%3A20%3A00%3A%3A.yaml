simpleMeaning: A plant whose leaves are long and pointed like swords, with upright stems and brightly
  colored flowers made of three petals and three hanging sepals.
scope: The iris group of plants, with sword-shaped leaves and upright stalks. It is not the cloth banner
  or the paving stone that share the name; this plant use appears mostly in older or gardening writing.
examples:
- Yellow flag grows along the muddy edge of the pond.
- The flags by the gate were in flower by early June.
