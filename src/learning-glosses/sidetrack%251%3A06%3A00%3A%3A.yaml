senseId: 'sidetrack%1:06:00::'
synsetId: 04223173-n
simpleMeaning: a short piece of train track used to hold trains and train cars, or to let trains on the
  same line pass each other
scope: Also called turnout and siding. This is a short track beside the main line, not the main line itself.
examples:
- The old coaches were left on the sidetrack while the main line stayed clear.
- The train waited on the sidetrack so another train could pass.
