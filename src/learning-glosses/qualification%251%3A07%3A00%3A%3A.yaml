simpleMeaning: a quality or thing that a person must have, and that makes them fit for something
scope: This is a quality a person must have to be right for something, also called making; it is not a
  limit added to a statement, and not a word that makes a statement less strong.
examples:
- Good eyesight is a qualification pilots must have.
- 'Her qualifications for the job are excellent: she has training and years of work.'
