simpleMeaning: a big black-and-white animal that eats plants and lives in the bamboo woods of China and
  Tibet, counted by some as a bear and by others as its own kind
scope: A big black-and-white animal that eats plants and lives in the bamboo woods of China and Tibet,
  counted by some as a bear; not the small reddish-brown animal that looks like a raccoon.
examples:
- The panda sat eating bamboo shoots in the shade.
- Visitors watched the pandas play in their large enclosure.
