simpleMeaning: Twelve family groups of ancient Israel, each held to come down from one of the twelve sons
  of Jacob.
scope: This is twelve family groups of ancient Israel, each held to come down from one of the twelve sons
  of Jacob, also called the Twelve Tribes of Israel; other family groups of ancient Israel are not counted
  among the twelve.
examples:
- The Tribes of Israel were said to come down from the twelve sons of Jacob.
- Each of the Tribes of Israel had its own land.
