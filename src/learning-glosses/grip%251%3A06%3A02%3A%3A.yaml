simpleMeaning: a flat hair pin made of wire, with two thin parts that press tightly together, used to
  keep hair that is cut short and straight in place
scope: The noun for a flat wire hair pin that keeps short hair in place. Not the bag for clothes, and
  not holding something tight.
examples:
- In Britain, she keeps her short hair in place with a grip.
- He bought a small pack of grips for his sister's hair.
