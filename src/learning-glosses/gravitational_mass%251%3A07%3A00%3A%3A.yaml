senseId: 'gravitational_mass%1:07:00::'
synsetId: 05032686-n
simpleMeaning: In physics, how much stuff is in a body, found by how hard the body pulls other bodies
  toward it
scope: In physics, how much stuff is in a body, found by the pull it has on other bodies, not how heavy
  it feels on a scale and not its size.
examples:
- Scientists worked out the planet's gravitational mass from its pull on the moon.
- The gravitational mass of the star bends the paths of nearby bodies.
