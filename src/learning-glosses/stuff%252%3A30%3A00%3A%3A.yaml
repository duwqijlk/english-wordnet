simpleMeaning: To put a filling inside food before cooking it.
scope: This is putting a filling into food for cooking, not cramming something into a cavity, not pressing
  or forcing something, not blocking something up, not eating too much, not preparing an animal skin for
  mounting, and not filling a container tightly with material.
examples:
- She stuffed the turkey with bread, herbs, and onion.
- We stuffed the peppers with rice and baked them.
