simpleMeaning: a blood vessel that comes off the aorta, the main blood vessel in the body, and feeds the
  testicles
scope: 'Also called internal spermatic artery: a branch of the main blood vessel that feeds the testicles,
  not the main vessel itself and not the veins that drain them.'
examples:
- The arteria testicularis carries blood to the testicles.
- Damage to the arteria testicularis can cut off the blood flow to a testicle.
