simpleMeaning: of walls, having a covering of plaster (a soft mix that is spread on a wall and then goes
  hard)
scope: 'Also called plastered: walls covered with plaster. Not covered with a layer that stops water and
  air getting through.'
examples:
- Workmen spread wet plaster over the bricks to make sealed walls.
- The sealed walls of the old house were smooth and hard to the touch.
