simpleMeaning: A small part added to the end of a root word that changes how the word is used
scope: 'Also called inflectional ending: a small part added to the end of a root word, not a change inside
  the word and not a whole new word.'
examples:
- The inflectional suffix -ed marks the past tense.
- A common inflectional suffix is -s for plurals.
