simpleMeaning: belonging to or like people who work for pay, own little, and have a low place in society
scope: This describes people who work for pay and own little, or things of theirs; it is not the noun
  that names one such person.
examples:
- They lived in a small proletarian home near the factory.
- The book tells of proletarian life in the city.
