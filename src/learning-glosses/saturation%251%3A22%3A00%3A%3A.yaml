simpleMeaning: the act of making something hold as much of a liquid or other substance as it can, so it
  is full of it in every part
scope: This is the process of making something full of a substance, not pure bright colour, not just soaking
  with a liquid, and not a state where more input stops having an effect.
examples:
- The saturation of the wood with oil took several days.
- They checked the saturation of the cloth with the chemical.
