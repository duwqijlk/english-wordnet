simpleMeaning: one of two broad muscles on each side of the neck, worked by the face nerve, from the lower
  jaw to the collarbone, helping move the mouth and jaw
scope: A flat muscle of the neck, not a muscle of the jaw and not a muscle of the shoulder.
examples:
- The platysma tightens when he opens his mouth wide.
- The surgeon cut through the platysma to reach the neck.
