simpleMeaning: the act of making something such as a bomb stop working, so it can do no harm
scope: The act of making a bomb or a like thing safe so it cannot work. It is not making a tense, hard
  situation calmer, though the same word is also used for that.
examples:
- Defusing the bomb took the team two hours.
- His job is defusing old bombs found in the fields.
