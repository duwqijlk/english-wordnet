simpleMeaning: The word used to say something about the subject in the final statement is held in this
  statement of a three-step line of thought
scope: Another name for major premise, this is one of the two starting statements in a line of reasoning,
  the one holding the word used in the final statement, not the other starting statement and not the final
  statement itself.
examples:
- The major premiss was that all men are mortal.
- She wrote the major premiss first, then the minor premiss.
