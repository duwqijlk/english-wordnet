simpleMeaning: a thin wild or half-wild pig of mixed farm stock, with long legs and a sharp ridge along
  its back, living mostly in the south-east United States
scope: Also called razorback hog and razorbacked hog; a wild pig of the south-east United States, not
  a whale and not a farm pig.
examples:
- A razorback crossed the road in front of our car.
- The razorback rooted in the woods at the edge of the farm.
