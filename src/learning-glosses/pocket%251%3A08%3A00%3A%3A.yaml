simpleMeaning: a bag-like body structure in some animals, such as marsupials, gophers or pelicans
scope: A sac-like body part in some animals, not a stitched compartment in clothing or a hollow space
  in an object.
examples:
- The gopher filled its cheek pockets with seeds.
- A pelican can stretch the large pocket under its beak.
