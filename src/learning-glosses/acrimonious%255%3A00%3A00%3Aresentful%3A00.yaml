simpleMeaning: full of strong anger about being treated badly, or not trusting what other people say or
  mean
scope: 'Also called bitter: this describes a person or talk full of strong anger about being treated badly,
  or not trusting other people; not a mild or friendly disagreement.'
examples:
- They had an acrimonious argument about money.
- His acrimonious words showed he did not trust her.
