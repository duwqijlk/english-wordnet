synsetId: 05025269-n
simpleMeaning: The quality of a thing that shines, either by sending out its own visible rays or by throwing
  back rays that fall on it.
scope: This is not the state of a place being well lit, the way illumination is used in a painting, or
  the happy look on someone's face; it is a thing's own shining quality.
examples:
- The moon has no light of its own; it simply reflects the sun.
- 'The stone''s light seems to come from within: it gives off a faint glow even in total darkness.'
