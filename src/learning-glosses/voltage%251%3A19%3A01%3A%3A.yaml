simpleMeaning: How much the electrical charge differs between two points in a circuit (a path for electricity
  to move around), measured in volts
scope: 'Also called potential: the difference in electrical charge between two points in a circuit. This
  is not the rate at which energy is drawn from a source.'
examples:
- The voltage between the two points is nine volts.
- The battery gives a voltage of twelve volts across its two ends.
