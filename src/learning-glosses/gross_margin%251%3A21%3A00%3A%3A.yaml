simpleMeaning: Of all the sales money, the part left after the cost of the goods is taken off
scope: The share of sales money left after the cost of the goods, shown as a part of all sales money,
  also called margin of profit and profit margin, not the whole sales money and not the profit after all
  costs are paid.
examples:
- The shop's gross margin rose when it bought stock more cheaply.
- A high gross margin means much of each sale is left after paying for the goods.
