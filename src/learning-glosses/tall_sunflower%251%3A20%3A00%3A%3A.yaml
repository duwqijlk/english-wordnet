simpleMeaning: From the middle and east of the United States to Canada, this very high American plant
  lives for years and bears thick roots underground that people eat.
scope: Also called giant sunflower, this is a very high American plant whose thick roots grow underground
  and are eaten.
examples:
- The tall sunflower can grow very high.
- People eat the thick roots of the tall sunflower.
