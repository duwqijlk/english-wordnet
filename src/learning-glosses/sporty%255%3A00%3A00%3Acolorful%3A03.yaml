simpleMeaning: especially of clothes, easy to see and notice because it stands out
scope: Also called flashy, gaudy, showy and jazzy, this sense means bright and easily noticed, especially
  of clothes; it is not fair play in sport, and not fit for playing sport.
examples:
- He wore a sporty, bright-orange jacket just to stand out from others.
- She chose a sporty purple hat with big, bright stripes so people would notice it.
