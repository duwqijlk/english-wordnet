simpleMeaning: having the rank of a male member of a king's or queen's family, or right and fit for such
  a person
scope: About having a royal son's rank or being fit for one, not about a king himself and not about a
  large or generous sum of money.
examples:
- He walked with a princely bearing that made people stand back.
- They gave him a princely room with a large bed and fine chairs.
