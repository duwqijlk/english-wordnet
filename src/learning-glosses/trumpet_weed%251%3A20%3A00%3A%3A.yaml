simpleMeaning: At the tips of this North American herb are bunches of flowers spotted with purple, and
  its leaves grow in rings round the stem.
scope: Also called marsh milkweed and purple boneset, this North American herb bears bunches of purple-spotted
  flowers at its tips.
examples:
- We knew the trumpet weed by the rings of leaves round its stem.
- The trumpet weed opened its purple-spotted flowers at the tips.
