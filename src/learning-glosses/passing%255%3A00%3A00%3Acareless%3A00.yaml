simpleMeaning: quick and without care for small points; not done fully and carefully
scope: 'Also called casual: describing a quick look or check done without care for small points. Not the
  movement sense, not a throw in American football, and not good enough to pass a test.'
examples:
- He gave the house only a passing glance and missed the crack in the wall.
- Her passing check of the report left several small errors in place.
