simpleMeaning: not believable because the chance of it being true is too small
scope: 'Also called unlikely and unbelievable: a claim whose chance of being true is too small for belief,
  not a wild tale told to amaze.'
examples:
- An improbable excuse like that fooled nobody.
- It seemed improbable that the small team would win.
