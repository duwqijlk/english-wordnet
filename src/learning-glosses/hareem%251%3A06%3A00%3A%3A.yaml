simpleMeaning: Rooms in a Muslim home are kept for wives, for women kept as lovers, and for other women
  of the family.
scope: Also called harem, seraglio and serail, these rooms in a Muslim home are kept for wives, for women
  kept as lovers, and for other women of the family.
examples:
- The wives lived in the hareem of the house.
- She went into the hareem to see the wives.
