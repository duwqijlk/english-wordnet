simpleMeaning: the fixed point on a compass that is opposite north and is at 180 degrees
scope: 'Also called south: this is the compass point at 180 degrees, opposite north; it is not going toward
  the south, and not describing something moving toward the south.'
examples:
- On a compass, the southward is marked at 180 degrees.
- The map shows the southward at the bottom, directly opposite north.
