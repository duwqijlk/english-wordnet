simpleMeaning: The State Department's main source of analyses explaining world events, and its focal point
  for the Intelligence Community's policy issues and activities.
scope: Also called INR; the State Department office that gives the main reading of world events for policy
  makers, distinct from the office that gathers secrets abroad.
examples:
- The Bureau of Intelligence and Research briefed the secretary on the crisis.
- Analysts at the Bureau of Intelligence and Research follow events around the world.
