simpleMeaning: To do with a trait passed down in families that is shaped by several genes working together
scope: To do with a family trait shaped by several genes at once, not a trait shaped by one gene and not
  a trait shaped by the world around a person.
examples:
- Height is a polygenic trait.
- The polygenic trait showed up in children and grandchildren alike.
