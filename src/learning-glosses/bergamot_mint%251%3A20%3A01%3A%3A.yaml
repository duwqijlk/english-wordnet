simpleMeaning: a plant whose leaves smell like a sweet-smelling kind of orange
scope: 'Also called eau de cologne mint and lemon mint: a plant with leaves that smell like a sweet orange,
  not the other kind of bergamot mint, a herb with showy flower heads.'
examples:
- She picked bergamot mint from the garden because its leaves smelled so sweet.
- The cook rubbed bergamot mint leaves between her fingers to enjoy their orange scent.
