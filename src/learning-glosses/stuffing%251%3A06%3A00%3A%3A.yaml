simpleMeaning: soft material put inside mattresses, cushions, and cloth-covered furniture
scope: Soft material put inside mattresses, cushions, and cloth-covered furniture, not the seasoned mix
  put inside meat.
examples:
- The stuffing in the old mattress had gone flat.
- She pulled the stuffing out of the torn cushion.
