simpleMeaning: to fill people with ideas that call for a great change in the way things are done
scope: To fill people with ideas for great change; not to overthrow a government by force, and not to
  change a machine or a habit.
examples:
- The book revolutionized the young workers.
- Her speeches revolutionized the town.
