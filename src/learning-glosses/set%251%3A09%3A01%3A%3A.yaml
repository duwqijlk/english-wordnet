simpleMeaning: A lasting tendency of mind that shapes how a person reacts.
scope: In psychology, a settled tendency of mind that shapes how a person responds; it is not the brief
  readiness of the moment, nor a group of people or a television receiver.
examples:
- The experiment measured how mental set shaped the answers.
- Once such a set is formed, contrary evidence is often ignored.
