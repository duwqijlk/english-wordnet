simpleMeaning: An ordinary tool used to find how warm the air is, with a plain glass end that stays free
  of water.
scope: An ordinary tool used to find how warm the air is, with a plain glass end that stays free of water,
  not a tool with a wet end and not a barometer.
examples:
- The dry-bulb thermometer showed twenty degrees.
- He read the dry-bulb thermometer to check the air temperature.
