senseId: purple%5:00:00:rhetorical:00
synsetId: 02024586-s
simpleMeaning: said or written with far too many fancy words and details, in a way that tries too hard
  to seem grand
scope: About writing or speech that is too fancy; not the colour itself, not the dress of a cardinal,
  and not fit for a king or queen.
examples:
- The story was full of purple passages that used too many fancy words.
- She cut the purple prose from her essay and wrote in plain words.
