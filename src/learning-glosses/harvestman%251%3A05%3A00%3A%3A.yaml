simpleMeaning: Legs far longer and much thinner than its small, round body mark this animal of the spider
  kind
scope: An animal of the spider kind, also called daddy longlegs, with a small, round body and very long,
  thin legs, not a true spider and not a farm worker.
examples:
- A harvestman walked across the stone with its long legs.
- The harvestman hid under the leaf in the garden.
