simpleMeaning: The upshot of stretching a thing out in time.
scope: This sense is also called continuation and prolongation, for the upshot of stretching a thing out
  in time, unlike the sense for what follows from making a thing last longer.
examples:
- Protraction is the upshot of stretching a thing out in time.
- Protraction stretches time out.
