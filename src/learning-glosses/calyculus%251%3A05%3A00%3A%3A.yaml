simpleMeaning: In a living thing, a tiny hollow shaped like a cup may be a taste bud, the cup in the eye,
  or a coral hollow holding a polyp.
scope: Also called caliculus and calycle, this names a tiny cup-like hollow in a living thing, not a ring
  of leaf-like parts that looks like the outer part of a flower.
examples:
- The calyculus in the coral held a polyp.
- The calyculus on the tongue helps us taste food.
