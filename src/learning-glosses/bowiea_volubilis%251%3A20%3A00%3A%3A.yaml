simpleMeaning: A much-branched South African plant with no leaves, whose long twining bright green stems
  grow from big bulbs above the ground, kept as a decorative plant.
scope: Also called climbing onion; a leafless South African twining plant grown for show for its bright
  green stems from big bulbs above ground.
examples:
- Bowiea volubilis climbs up the trellis in the greenhouse.
- The Bowiea volubilis in the pot has bright green stems but no leaves.
