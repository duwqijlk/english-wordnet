simpleMeaning: in a poor or wrong way that is not good enough; not well, and ill is often used as part
  of a joined word
scope: Another name for this sense is ill, often as part of a joined word. This sense is doing something
  in a poor way, not feeling pain or sorrow strongly, and not needing something very much.
examples:
- The car runs badly in cold weather.
- He did badly on the exam.
