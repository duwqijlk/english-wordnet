  by long stems under the ground.
scope: Once a grass of Europe, it now grows wild across North America as a weed; couch grass, dog grass,
  quack grass, quick grass, witch grass and witchgrass are other names for this sense.
examples:
- Quackgrass took over fast.
- They weeded the quackgrass out.
