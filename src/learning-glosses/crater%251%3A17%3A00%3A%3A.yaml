simpleMeaning: a hollow like a bowl, made when a rock from space or a bomb strikes the ground
scope: A bowl-like hollow made by a rock from space or a bomb, not the hollow at the top of a volcano.
examples:
- The bomb left a deep crater in the field.
- A crater marked where the meteorite had fallen.
