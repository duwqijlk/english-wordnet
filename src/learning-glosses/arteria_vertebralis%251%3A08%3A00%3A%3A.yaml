simpleMeaning: the first blood vessel to come off the subclavian artery, the big blood vessel under the
  collarbone, and it is split into four parts
scope: The first branch of the big blood vessel under the collarbone, split into four parts, not the big
  vessel itself and not a vein.
examples:
- The arteria vertebralis is the first branch of the subclavian artery.
- Surgeons traced the arteria vertebralis through its four parts.
