senseId: 'legitimate%2:32:02::'
synsetId: 00898327-v
simpleMeaning: To show that a thing is fair and right, and to state it firmly.
scope: To show a thing to be fair and right, not the act of making a child lawful, not a lawful marriage
  or child, not a practice that meets accepted standards, and not a government backed by law.
examples:
- The court legitimated his claim to the land.
- Her work legitimated the new method in the eyes of all.
