simpleMeaning: upper room on one side of a chest pump that takes in blood from great veins and from its
  own vein
scope: Not the lower room of the heart, and not the room on the other side; also called atrium dextrum
  and right atrium.
examples:
- Blood enters the right atrium of the heart from the great veins.
- The right atrium of the heart is the first room blood reaches.
