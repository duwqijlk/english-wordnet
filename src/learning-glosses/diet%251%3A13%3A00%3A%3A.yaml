simpleMeaning: a set of foods chosen for a person to eat, as a doctor orders
scope: A set of foods chosen for a person to eat, not the food a person usually eats, not the act of eating
  less, and not a law-making body.
examples:
- The doctor gave her a diet low in salt.
- His diet after the operation had no meat in it.
