  germ-fighting bits that clump sheep red blood cells together.'
scope: This blood check looks for germ-fighting bits that clump sheep red blood cells together, and a
  yes points to a sickness that makes the glands swell.
examples:
- The heterophil test came back yes.
- She waited for the heterophil test to tell whether her swollen glands came from that sickness.
