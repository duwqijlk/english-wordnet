simpleMeaning: An upright bush of North America that loses its leaves in winter, with pale yellow flowers.
scope: An upright bush of North America that loses its leaves in winter, with pale yellow flowers; not
  a climbing plant and not a bush that keeps its leaves in winter.
examples:
- The fly honeysuckle stood upright in the garden.
- Fly honeysuckle has pale yellow flowers in spring.
