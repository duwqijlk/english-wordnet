simpleMeaning: Belonging to, coming from, or connected with a god or divine power.
scope: This is not a casual word for something merely special or impressive; it describes what belongs
  to or comes from a god.
examples:
- The temple is a holy place for millions of believers.
- They treated the ground as holy and removed their shoes.
