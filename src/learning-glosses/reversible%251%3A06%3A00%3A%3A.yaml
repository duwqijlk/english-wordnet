simpleMeaning: A piece of clothing, often a coat, that can be turned inside out so either side shows.
scope: A piece of clothing, often a coat, that can be turned inside out so either side shows, not a thing
  that can be turned back or undone, not a thing that can take either of two states, and not the use for
  a thing that can be turned back or worn either side out.
examples:
- She wore her reversible to the game, blue side out.
- He turned his reversible inside out and wore the red side.
