senseId: 'paleo-amerind%1:18:00::'
synsetId: 10414133-n
simpleMeaning: A person from the first peoples to live in North America and South America, in the late
  Pleistocene time
scope: This is a person from the first peoples of North and South America; Paleo-American and Paleo-Indian
  are other names for this sense, not a person from a later people of the Americas.
examples:
- A Paleo-Amerind was among the first people to live in South America.
- The Paleo-Amerind lived during the late Pleistocene epoch.
