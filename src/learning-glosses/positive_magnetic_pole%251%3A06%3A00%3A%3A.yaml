simpleMeaning: the end of a magnet that turns to point north when the magnet hangs free
scope: This is the north end of a magnet, also called a north-seeking pole and a positive pole, not the
  south end that points south.
examples:
- The positive magnetic pole of the compass needle points north.
- When the magnet hung free, its positive magnetic pole turned toward the north.
