simpleMeaning: One of a group of drugs that lift low mood by stopping a brain substance from breaking
  down other mood substances, so they build up
scope: One of a group of drugs that lift low mood by stopping a brain substance from breaking down mood
  substances, not a drug that adds new mood chemicals and not a sleeping drug.
examples:
- The doctor gave her a monoamine oxidase inhibitor for her low mood.
- Monoamine oxidase inhibitors can take weeks to work.
