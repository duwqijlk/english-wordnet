simpleMeaning: An ordinary-looking seat used to kill a condemned person with electric current.
scope: This is the execution device; it is not a normal seat for sitting on, and not a seat in an orchestra.
examples:
- In some states the chair remains an option for execution.
- The condemned man was led to the chair shortly after midnight.
