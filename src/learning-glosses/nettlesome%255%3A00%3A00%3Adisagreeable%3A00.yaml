senseId: nettlesome%5:00:00:disagreeable:00
synsetId: 00090253-s
simpleMeaning: That nettles and vexes.
scope: This sense is also called annoying, teasing, irritating, pestering, vexing, galling, pesky, bothersome,
  plaguey, and vexatious, for that which nettles and vexes, where annoying is causing a person to feel
  upset and a little angry, teasing is making people feel annoyed and a little angry, and irritating is
  making people feel annoyed or bothered.
examples:
- The wait was nettlesome, it nettled and vexed.
- The noise was nettlesome, nettling and vexing.
