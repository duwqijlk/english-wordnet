simpleMeaning: An account that makes a thing too plain, so that it misleads.
scope: An account that makes a thing too plain, so that it misleads; not making a thing seem too plain,
  simpler than it is.
examples:
- Their oversimplification led the jury astray.
- The oversimplification was printed in full.
