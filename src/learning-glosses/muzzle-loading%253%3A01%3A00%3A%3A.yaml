simpleMeaning: Said of a gun that is filled from the front end, with the shot or the shell put in there
scope: Said of a gun that is filled from the front end, not of a gun filled from the back, and not a name
  for the gun itself.
examples:
- The old muzzle-loading rifle took a long time to fill.
- Soldiers with muzzle-loading guns poured powder down the barrel.
