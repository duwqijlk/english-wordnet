simpleMeaning: A small tool with teeth for tidying hair, made small enough to carry in a coat or in trousers.
scope: 'Another name for this sense is pocketcomb: a small hair tool that fits in a coat or trousers,
  not a brush and not a large hair tool.'
examples:
- He took the pocket comb from his coat and tidied his hair.
- She keeps a pocket comb in her bag.
