simpleMeaning: a word made from a verb and used as a name for an action, such as the -ing form of an English
  verb used in that way
scope: This is a verb form used as a name for an action, not the verb itself and not a word that tells
  what a thing is like.
examples:
- In the sentence Swimming is fun, the word swimming is a gerund.
- The teacher asked us to find a gerund in the sentence.
