simpleMeaning: This kind of movie is made for people of all ages to enjoy, with nothing in it that young
  viewers should not see
scope: 'Also called a family movie: a kind of movie with nothing unfit for young viewers, made to please
  people of all ages, not a movie made only for children and not a movie for grown-ups only.'
examples:
- We watched a family film that the children and their grandparents both liked.
- The new family film pleased young viewers and their parents alike.
