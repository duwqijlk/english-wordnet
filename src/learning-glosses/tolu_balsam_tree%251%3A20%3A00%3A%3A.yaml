simpleMeaning: a mid-sized tree of warm America that gives a sticky sap and a fragrant hard wood for fine
  furniture and cabinet work
scope: Also called the tolu tree; a tropical American tree giving fine wood for furniture, not a pine
  and not a tree grown for fruit.
examples:
- The tolu balsam tree grew in the warm valley.
- They cut tolu balsam tree wood for the cabinet.
