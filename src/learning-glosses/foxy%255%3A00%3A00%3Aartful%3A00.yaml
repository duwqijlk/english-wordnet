simpleMeaning: good at tricking people and hiding the truth in a clever way
scope: 'Also called slick, sly, tricky, cunning, dodgy, crafty, wily and tricksy: this means good at tricking
  people, not having the look of a fox and not good-looking in a sexy way.'
examples:
- The foxy salesman had a clever answer for every question, but none of them were true.
- She gave a foxy smile and hid the real price from us.
