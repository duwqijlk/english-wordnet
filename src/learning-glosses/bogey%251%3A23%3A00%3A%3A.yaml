simpleMeaning: In golf, a score on a hole that is one hit more than the set number for that hole
scope: In golf, a score that is one hit over the set number for a hole, not the evil creature in stories
  that has the same name.
examples:
- He made a bogey on the last hole of the game.
- She was pleased with a bogey because that hole was very hard.
