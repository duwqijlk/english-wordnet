simpleMeaning: An animal that moves on its toes, with the rest of its foot off the ground, like a dog,
  a cat, or a horse
scope: An animal that walks on its toes alone, not one that walks flat-footed; digitigrade is another
  name for this sense.
examples:
- The digitigrade mammal walked on its toes, like a cat.
- A digitigrade mammal such as a dog walks on its toes.
