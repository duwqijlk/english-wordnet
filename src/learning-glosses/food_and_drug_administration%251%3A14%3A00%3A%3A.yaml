simpleMeaning: This office of the United States department for health and human services checks new things
  people eat and new goods for health before people may sell them.
scope: Also called FDA; an office inside the United States department for health and human services, not
  the whole department and not a state office.
examples:
- The Food and Drug Administration approved the new medicine.
- The Food and Drug Administration checks new foods before they reach the shops.
