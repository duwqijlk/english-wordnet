simpleMeaning: An illness of the lungs and skin that brings up too much thick spit and makes lumps.
scope: 'Also called coccidioidomycosis, coccidiomycosis and desert rheumatism: an illness of the lungs
  and skin with too much thick spit and lumps, not a cold and not a skin rash alone.'
examples:
- Valley fever brought a cough and lumps on his skin.
- She caught valley fever in the dry country.
