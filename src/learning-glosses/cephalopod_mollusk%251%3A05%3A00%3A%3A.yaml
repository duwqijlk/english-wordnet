simpleMeaning: a sea animal with a well-formed head and eyes, and arms that carry suckers
scope: A sea animal with a well-formed head and eyes, and arms that carry suckers; cephalopod is another
  name for this sense, not a fish and not a shellfish with a hard shell.
examples:
- A cephalopod mollusk uses its arms to catch food.
- The cephalopod mollusk watched us with its large eyes.
