simpleMeaning: A base of wood pulp and sodium or potassium nitrate, soaked through with a strong blasting
  liquid, makes this dynamite.
scope: Also called gelignite, this names the dynamite whose blasting liquid is soaked into wood pulp mixed
  with sodium or potassium nitrate.
examples:
- The miners lit a stick of gelly to break the rock.
- He handled the gelly with great care.
