simpleMeaning: to set a fire on purpose and keep it under control, to stop a fire that is coming through
  woods or open grass land
scope: This is the verb for setting such a fire on purpose. It is not the loud noise from an engine or
  a gun, and not a plan that goes wrong.
examples:
- The crew decided to backfire the meadow before the wild fire reached it.
- Workers backfired along the road to halt the fire coming through the woods.
