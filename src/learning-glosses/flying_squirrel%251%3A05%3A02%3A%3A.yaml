simpleMeaning: Night animals of the phalanger kind that move with long glides, using skin folds like a
  parachute along the sides of the body.
scope: These are night animals that move with long glides on skin folds like a parachute, not birds or
  bats, and they are also called a flying opossum and a flying phalanger.
examples:
- The flying squirrel glided down to the next tree.
- A flying squirrel spread its skin folds and leapt.
