simpleMeaning: to make work better by cutting out the weak parts and making what is left smooth and clear
scope: To make work better by cutting out weak parts, not a stuff used to make a thing smooth and bright
  and not a very high level of skill in work.
examples:
- She polished her essay before she sent it in.
- He polished the speech until every line was clear.
