simpleMeaning: someone whose work at a port is to load ships and to unload them when they come in
scope: A worker who puts goods on ships and takes goods off ships in a port, also called a dock worker,
  docker, dockhand, dockworker, loader or lumper, and not a sailor or a ship's captain.
examples:
- The dock-walloper loaded crates onto the freighter all morning.
- A dock-walloper unloaded the sacks of grain at the port.
