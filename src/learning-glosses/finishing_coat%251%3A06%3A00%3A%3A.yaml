simpleMeaning: Last of all, paint, plaster, varnish, or some other such stuff goes on a surface as this
  coat.
scope: Also called finish coat, this is the coat that goes on a surface last of all, of paint, plaster,
  varnish, or some other such stuff.
examples:
- They put the finishing coat on the door after the first coats.
- A finishing coat of varnish covered the table top.
