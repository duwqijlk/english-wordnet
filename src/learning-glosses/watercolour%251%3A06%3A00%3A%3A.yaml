simpleMeaning: a picture painted with paints that mix with water
scope: A finished picture made in this way, also called watercolor; it is not the paint itself and not
  the act of painting.
examples:
- She hung a small watercolour of the sea above her desk.
- He gave me a watercolour that shows the village in winter.
