simpleMeaning: a chemical compound in which a group of other atoms or molecules is attached to one central
  atom.
scope: This is a technical chemistry term, not the everyday adjective meaning "not simple" and not an
  ordinary mixture.
examples:
- The blue complex contains copper at its centre.
- Chemists studied how the complex forms around a metal ion.
