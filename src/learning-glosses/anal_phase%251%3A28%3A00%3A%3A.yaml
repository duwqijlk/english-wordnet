simpleMeaning: In psychoanalysis, the second stage in a child's growth in feelings about the body and
  in getting on with others, when the child learns to control the bowels
scope: In psychoanalysis, the second stage of a child's growth, also called anal stage; not the baby's
  first stage and not a later stage of growing up.
examples:
- During the anal phase, the toddler was learning to use the potty.
- The book said the anal phase comes after the baby's first stage and before the next one.
