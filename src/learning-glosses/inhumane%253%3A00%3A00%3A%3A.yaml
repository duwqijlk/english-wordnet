simpleMeaning: having no pity or care for the pain of others, and showing this in what a person does
scope: This means having no pity at all and acting that way toward others, not just being a little unkind
  or strict.
examples:
- Keeping prisoners in tiny dark rooms is inhumane.
- It is inhumane to leave a dog without water in the hot sun.
