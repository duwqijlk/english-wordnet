simpleMeaning: Being rude and bold by nature, taking more freedom than you should.
scope: Rude boldness that takes too much freedom, also called crust, not the juice from the liver, not
  a plant swelling, and not a horse sore.
examples:
- He had the gall to ask for more money.
- Her gall shocked the whole room.
