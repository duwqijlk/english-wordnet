simpleMeaning: To go mouldy and spoil, because the air around is damp
scope: To go mouldy and spoil in damp air, with mold and mould as other names for this sense, not the
  thin growth itself and not the slow change of becoming so.
examples:
- The furniture mildewed in the damp old house.
- Clothes left in the cellar soon mildew.
