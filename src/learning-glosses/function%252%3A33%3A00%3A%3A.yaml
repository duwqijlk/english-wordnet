simpleMeaning: to carry out the duties that belong to a particular official job or position
scope: This is about a person doing the duties of an office or job, not about an object serving a purpose
  such as a box used as a table.
examples:
- The mayor functions as the city's chief executive, overseeing all departments.
- As town clerk, he functions under the authority of the council.
