simpleMeaning: a person whose job is to run a sale where buyers offer more and more money for things
scope: A person who runs a sale where buyers offer more and more money for things; not the act of selling
  things in that way.
examples:
- The auctioneer asked for a higher price and waited for hands to go up.
- When no one offered more money, the auctioneer sold the painting to the last buyer.
