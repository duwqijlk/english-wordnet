simpleMeaning: a person or company whose work is to provide a certain kind of goods or help
scope: A person or company whose work is to provide goods or help, not the person who buys them and not
  a maker who sells only what they make.
examples:
- Our supplier delivers fresh vegetables every morning.
- The supplier sent the parts we had ordered.
