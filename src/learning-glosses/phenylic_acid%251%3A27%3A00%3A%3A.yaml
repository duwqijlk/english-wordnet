simpleMeaning: A white, crystal-like acid kin of benzene that poisons and dissolves in water, used to
  make things, to fight germs and to wash wounds, deadly if taken in.
scope: This sense is also called carbolic acid, hydroxybenzene, oxybenzene and phenol, for a white, crystal-like
