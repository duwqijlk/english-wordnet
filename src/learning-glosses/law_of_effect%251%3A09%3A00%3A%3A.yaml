simpleMeaning: 'In mind-study, the rule that acts are picked by what follows them: acts with good ends
  tend to repeat, while acts that end badly are not done again.'
scope: 'In mind-study: the rule that good ends make acts repeat.'
examples:
- The law of effect says acts with good effects tend to repeat.
- Trainers use the law of effect, since good effects bring repeats.
