simpleMeaning: A person or thing that can be covered by a policy that pays when there is loss or harm
scope: A person or thing that can be covered by a policy that pays for loss; not a person or thing already
  covered by one, and not a thing no firm will cover.
examples:
- The old house was still insurable, so they bought cover for it.
- Not every boat is insurable after years at sea.
