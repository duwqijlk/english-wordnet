simpleMeaning: not asked for, and fought against by the people who run a company, said of an attempt to
  buy or take control of that company
scope: Said of an attempt to buy or take control of a business when the people who run it do not want
  it; not about enemy soldiers, and not about soldiers from another country.
examples:
- The company fought off a hostile takeover by a larger firm.
- He made a hostile bid for the business, but its leaders said no.
