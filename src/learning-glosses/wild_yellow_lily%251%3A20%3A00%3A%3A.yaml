simpleMeaning: A common plant of the east of the United States with hanging gold or reddish flowers with
  brown spots
scope: This is a common plant of the east of the United States with hanging gold or reddish flowers with
  brown spots; meadow lily and wild meadow lily are other names for this sense, not a garden lily and
  not another plant with spotted flowers.
examples:
- The wild yellow lily nodded over the stream bank.
- We found a wild yellow lily with brown spots on its gold flowers.
