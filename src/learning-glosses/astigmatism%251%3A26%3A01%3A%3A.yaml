simpleMeaning: In optics, rays of light from one point fail to meet at one single point of focus when
  an optical system has this fault
scope: Also called astigmia, this is a fault in an optical system where light rays from one point do not
  meet at one focus, not poor eyesight from a misshapen cornea.
examples:
- The astigmatism in the telescope kept the star from coming to a sharp point.
- The lens maker tested the glass for astigmatism before fitting it in the camera.
