simpleMeaning: The way people use goods to get what they need or to make things, in the study of goods
  and money.
scope: 'Also called use and consumption: the way people use goods to get what they need or to make things,
  not the making of goods alone.'
examples:
- Economic consumption rose as people bought more goods.
- The economic consumption of energy has increased steadily.
