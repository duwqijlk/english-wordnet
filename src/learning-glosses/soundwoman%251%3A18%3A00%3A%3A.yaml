simpleMeaning: a female worker who makes the audio of a TV or radio show louder or adds noises to it
scope: A female worker who makes the audio of a TV or radio show louder or adds noises; not a soundman,
  the man in the same job, and not a TV presenter.
examples:
- The soundwoman turned the volume up so everyone in the hall could hear the actor.
- The soundwoman added the sound of rain to the radio play.
