simpleMeaning: a person who kills someone by pressing hard on their neck so they cannot breathe
scope: This is a person who kills in this way, not the plant of the same name that grows around a tree
  and kills it.
examples:
- The police caught the strangler who had killed three people in the town.
- People were afraid to walk alone at night while a strangler was still free.
