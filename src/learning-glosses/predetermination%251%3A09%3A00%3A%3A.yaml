simpleMeaning: a firm decision made in the mind before something happens, with a plan to do a thing
scope: A decision made in the mind before an event, not a decision made during it, and not the theological
  idea that God has fixed every event in advance.
examples:
- He entered the argument with a predetermination to prove me wrong.
- Her predetermination to win the race shaped every choice she made before the start.
