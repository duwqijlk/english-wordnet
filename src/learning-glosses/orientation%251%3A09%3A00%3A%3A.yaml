simpleMeaning: the whole set of views and beliefs a person holds, fitted together into one way of seeing
  things
scope: A person's joined-up set of views and beliefs, not where they stand in space and time, and not
  the act of getting your bearings.
examples:
- Her political orientation shapes how she reads the news.
- His orientation toward hard work comes from his parents.
