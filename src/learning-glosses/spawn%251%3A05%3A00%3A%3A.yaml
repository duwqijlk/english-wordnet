simpleMeaning: a mass of eggs laid by fish, by animals that live both in water and on land, or by soft-bodied
  animals, many with shells
scope: A mass of eggs laid by fish and similar animals, not the act of laying them.
examples:
- The pond was full of spawn in spring.
- Fish leave their spawn among the reeds.
