simpleMeaning: White flour of good quality comes from the grain of this African plant, a crop of real
  worth also cut for animal feed and hay.
scope: 'Also called teff: an African plant grown for its grain and cut for animal feed and hay.'
examples:
- Farmers in Africa grow teff grass for its grain and cut it for hay.
- They ground the grain of teff grass into white flour.
