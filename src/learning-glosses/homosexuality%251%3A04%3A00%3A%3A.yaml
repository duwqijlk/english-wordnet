simpleMeaning: a sexual attraction to people of the same sex, or sexual relations with people of the same
  sex
scope: 'Also called gayness, queerness, homoeroticism and homosexualism: attraction to people of the same
  sex, not attraction to people of the other sex and not attraction to both sexes.'
examples:
- She spoke openly about her homosexuality and her life with her wife.
- He said his homosexuality was part of who he was, and he felt attraction only to men.
