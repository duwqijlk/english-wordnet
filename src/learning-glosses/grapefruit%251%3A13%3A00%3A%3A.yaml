simpleMeaning: a large yellow fruit with rather sour, juicy soft parts inside; a usual serving is one
  half of it
scope: The fruit itself, which people eat, not the tree it grows on.
examples:
- She ate half a grapefruit for breakfast.
- The grapefruit was so sour that she added a little sugar.
