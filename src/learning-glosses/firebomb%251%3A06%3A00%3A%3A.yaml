simpleMeaning: a bomb made to start fires, and that works best against things that burn easily, such as
  fuel
scope: Also called incendiary, this is a bomb made to start fires, not a bomb made mainly to damage things
  by exploding.
examples:
- The plane dropped a firebomb on the fuel store.
- A firebomb started a large fire in the empty building.
