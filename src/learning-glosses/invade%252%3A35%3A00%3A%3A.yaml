senseId: 'invade%2:35:00::'
synsetId: 01230052-v
simpleMeaning: to get inside something, or to attack it, in a way that harms it
scope: To enter and harm something, like an illness spreading in the body; not an army entering a country
  to take it, and not simply going where you should not go.
examples:
- The illness had invaded her lungs and made it hard to breathe.
- Harmful insects invaded the young plants and ate their leaves.
