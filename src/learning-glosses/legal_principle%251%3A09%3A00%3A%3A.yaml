simpleMeaning: In law, the rules courts use are built on this basic idea
scope: 'Also called judicial doctrine and judicial principle: in law, a basic idea behind the making of
  court rules, not a rule in one case and not the study of law itself.'
examples:
- The judge based her ruling on a legal principle about fairness.
- Students learn each legal principle before they study real cases.
