simpleMeaning: Money or goods a buyer leaves with a broker as a pledge, when buying shares with money
  borrowed from that broker
scope: Money or goods left with a broker as a pledge when buying shares on borrowed money, not room to
  move within limits and not profit on sales.
examples:
- The broker asked for more margin on the account.
- He put up margin to buy the shares.
