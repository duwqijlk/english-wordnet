simpleMeaning: Birds, jointed-legged animals, and creeping animals above all shed their outer covering
  of feathers, hard skin, skin, or hair from time to time.
scope: Also called moulter; an animal that sheds its outer covering from time to time, above all a bird,
  a jointed-legged animal, or a creeping animal.
examples:
- The young molter lost its feathers.
- A snake is a molter that sheds its skin.
