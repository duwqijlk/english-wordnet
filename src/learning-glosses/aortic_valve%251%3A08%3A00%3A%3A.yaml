simpleMeaning: Blood is kept from running back from the main blood tube into the heart by this half-moon-shaped
  valve between the tube and the heart's left lower room
scope: This is the valve between the heart's left lower room and the main blood tube, not one that lets
  blood run back into the heart.
examples:
- The aortic valve stops blood from flowing back into the heart.
- Blood passed through her aortic valve into the main blood tube.
