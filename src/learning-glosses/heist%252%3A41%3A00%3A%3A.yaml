simpleMeaning: to enter a place where someone lives when you have no right to be there, and to steal things
  from it
scope: 'Also called burgle and burglarize: this is stealing from a place where someone lives that you
  enter with no right to be there, not stealing from a shop or from a person in the street.'
examples:
- The men planned to heist the empty house on the corner.
- Someone heisted the flat while the family was away.
