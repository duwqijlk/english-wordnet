simpleMeaning: A device used in a job where two faces are rubbed against each other with gritty matter
  caught between them.
scope: This device is used in a job where two faces are rubbed against each other with gritty matter caught
  between them; it is not a cutting tool, and it is not a cloth polisher.
examples:
- The worker put two faces in the lapping machine with gritty matter between them.
- The lapping machine rubbed the two faces together with gritty matter between them.
