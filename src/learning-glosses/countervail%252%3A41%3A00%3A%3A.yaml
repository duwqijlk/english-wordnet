senseId: 'countervail%2:41:00::'
synsetId: 02549571-v
simpleMeaning: To stand against and soften the force of a thing, by doing the opposite.
scope: This sense is also called neutralize, counteract, and counterbalance, for standing against and
  softening the force of a thing, by doing the opposite, unlike the sense for making up for a thing, or
  balancing it out.
examples:
- His countervail softened the blow.
- Countervails work against the first move.
