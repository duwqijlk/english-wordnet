simpleMeaning: A drug of the tetracycline kind that treats some infections caused by bacteria, by rickettsial
  germs and by other germs.
scope: 'Also called demeclocycline hydrochloride: a tetracycline drug for some infections from bacteria,
  rickettsial germs and other germs, not for every infection.'
examples:
- The doctor gave him Declomycin for the infection.
- Declomycin cleared up the bacterial infection in a week.
