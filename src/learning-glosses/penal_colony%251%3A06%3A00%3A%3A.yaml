simpleMeaning: A place where people found guilty of crimes are sent to live far from home, often on an
  island from which it is hard or not possible to get away.
scope: A place far from home where people found guilty of crimes are sent to live, not an ordinary jail
  in a town and not a free town where people choose to live.
examples:
- The old penal colony stood on a small island.
- Many were sent to the penal colony and never came back.
