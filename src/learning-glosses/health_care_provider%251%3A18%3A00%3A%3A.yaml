simpleMeaning: A person who helps find, stop, or treat sickness or a loss of the power to use the body
  or mind well.
scope: A person who helps find, stop, or treat sickness or a loss of the power to use the body or mind
  well, also called caregiver and health professional; not a patient and not a hospital.
examples:
- Your health care provider can tell you which shots you need.
- She works as a health care provider at the town clinic.
