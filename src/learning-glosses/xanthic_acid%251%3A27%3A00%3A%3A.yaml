simpleMeaning: any of a group of sour liquids made with carbon that hold sulphur and break down fast
scope: This is one of a group of sour liquids that hold sulphur and break down fast, not a lasting liquid
  and not a solid.
examples:
- The xanthic acid broke down fast when it was left in the air.
- She made xanthic acid in the lab, but it did not last long.
