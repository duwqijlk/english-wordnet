simpleMeaning: A member of the native people of North America who live by the Coos River and Bay and the
  lower Coquille River in Oregon.
scope: One of the native peoples of the Coos River and Bay and the lower Coquille River in Oregon; the
  people, not the tongue of the same name.
examples:
- Kusan families lived by the Coos River in Oregon.
- A Kusan elder spoke of the Coos River.
