simpleMeaning: a painting or drawing in a book, especially in a book from the Middle Ages that is decorated
  by hand with bright colours and gold
scope: This is a painting or drawing inside a book, especially an old decorated one; it is not a small
  copy of a person or thing.
examples:
- A small miniature in the old book showed a king on a horse.
- The first page of the book has a gold miniature of a garden.
