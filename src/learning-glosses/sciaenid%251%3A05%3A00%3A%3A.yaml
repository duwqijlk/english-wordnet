simpleMeaning: A wide-spread family of meat-eating fish of the perch kind, with a large air sac that they
  use to make sounds.
scope: A wide-spread family of meat-eating fish of the perch kind, also called sciaenid fish; not a perch
  itself and not a bass.
examples:
- The sciaenid family includes the croakers.
- Sciaenids make sounds with their air sacs.
