simpleMeaning: a polite act or word that shows good opinion and high regard for someone
scope: A polite act or word that shows good opinion and high regard for someone; respect is another name
  for this, not a readiness to give in to others and not a polite regard for their feelings.
examples:
- His deference to her wishes was very flattering.
- She showed great deference to the old teacher.
