simpleMeaning: to fight or carry on a war, a battle, or a long set of planned fights
scope: Also called engage. This verb is about fighting a war or a battle, not the money a person is paid
  for work.
examples:
- The king waged war against his enemies for many years.
- They waged a long campaign to take back their land.
