scope: This is a wild plum tree of California that keeps its leaves all year; evergreen cherry, holly-leaf
  cherry, holly-leaved cherry and islay are other names for this sense, and it is one of the wild plum
  trees, close to the chokecherry and the pin cherry.
examples:
