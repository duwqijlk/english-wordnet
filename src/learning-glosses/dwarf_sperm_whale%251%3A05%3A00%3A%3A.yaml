simpleMeaning: A very small sea animal of the central coasts of the Atlantic and Pacific, at most eight
  feet long
scope: A very small sea animal, at most eight feet long, not a large whale and not a dolphin.
examples:
- The dwarf sperm whale is only about eight feet long.
- A dwarf sperm whale swims off the central coasts of the Atlantic and Pacific.
