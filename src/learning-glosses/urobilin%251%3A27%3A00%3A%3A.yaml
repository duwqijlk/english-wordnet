simpleMeaning: A brown colouring substance from bile, made from other substances in the body, found in
  the stools and in small amounts in urine.
scope: A brown colouring substance from bile, found in the stools and in small amounts in urine, not a
  red colouring substance and not a substance found only in the blood.
examples:
- Urobilin gives the stools their brown colour.
- Only small amounts of urobilin are found in urine.
