simpleMeaning: A brown colouring stuff from bile, made from other stuffs in the body, found in the stools
  and in small amounts in urine.
scope: A brown colouring stuff from bile, found in the stools and in small amounts in urine, not a red
  colouring stuff and not a stuff found only in the blood.
examples:
- Urobilin gives the stools their brown colour.
- Only small amounts of urobilin are found in urine.
