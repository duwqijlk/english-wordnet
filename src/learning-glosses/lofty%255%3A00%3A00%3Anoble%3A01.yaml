simpleMeaning: with thoughts, aims and words that are good and high, raised above the low and mean
scope: High in moral or intellectual worth; grand and elevated are other names for this sense, not the
  sense of looking grand and noble, and not simply tall.
examples:
- He spoke of lofty ideals that few could reach.
- The essay set out a lofty concept of duty.
