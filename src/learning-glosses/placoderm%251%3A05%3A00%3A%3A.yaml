simpleMeaning: a fish-like animal with a backbone, head and upper body in bony plates, that ruled the
  seas and rivers of the Devonian age, seen as the first with jaws
scope: An early fish-like animal with jaws, not a shark and not a modern bony fish.
examples:
- The placoderm was one of the first animals to have jaws.
- Placoderm fossils show bony plates on the head.
