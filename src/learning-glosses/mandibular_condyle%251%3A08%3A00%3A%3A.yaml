simpleMeaning: The knob at the end of the lower jaw bone that joins the skull
scope: Also called condylar process and condyloid process; the knob at the end of the lower jaw bone,
  not the jaw bone itself and not the skull.
examples:
- The mandibular condyle lets the jaw move up and down.
- A blow to the mandibular condyle can lock the jaw.
