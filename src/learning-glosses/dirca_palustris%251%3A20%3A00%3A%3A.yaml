simpleMeaning: A shrub of eastern North America that loses its leaves each year, with tough, bendy branches,
  bendable bark and small yellow flowers.
scope: Also called leatherwood, moose-wood, moosewood, ropebark and wicopy; a shrub of eastern North America
  with bendy branches and small yellow flowers.
examples:
- Dirca palustris grows in eastern North America.
- The Dirca palustris has small yellow flowers.
