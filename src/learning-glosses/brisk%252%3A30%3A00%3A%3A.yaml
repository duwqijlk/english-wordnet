simpleMeaning: to become quicker and more active
scope: This is the verb for a change, when something becomes quicker and more active; it is not the word
  for cold, fresh air or for a quick, short way of speaking.
examples:
- Business brisked up once the summer visitors arrived.
- Sales usually brisk up in the weeks before the holidays.
