simpleMeaning: to be enough for a wish or need, or to fit a rule or limit that must be kept
scope: 'Also called meet, fit, fill, and satisfy: to be enough for a need or to fit a set rule.'
examples:
- This plan fulfills all the rules for the course.
- A small, quiet room fulfills her need for a place to work.
