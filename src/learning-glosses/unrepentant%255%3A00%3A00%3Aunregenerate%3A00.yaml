simpleMeaning: keeping on doing wrong and not willing to stop or change
scope: 'Also called obstinate, cussed, and obdurate: this is about a person who keeps doing wrong and
  will not change, not just about a person who is hard to move on one point.'
examples:
- The unrepentant thief stole again the day after he left prison.
- She was unrepentant and kept breaking the same rules.
