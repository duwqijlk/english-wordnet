simpleMeaning: One of a pair of fins joined to a fish's hip bones, helping it steer, like the hind legs
  of an animal that lives on land.
scope: 'Also called the pelvic fin: one of a pair of fins on a fish''s hip bones that help it steer, like
  the hind legs of an animal that lives on land.'
examples:
- The fish steered with its ventral fins.
- A ventral fin sits on each side of the fish's belly.
