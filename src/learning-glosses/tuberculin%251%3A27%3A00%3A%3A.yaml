simpleMeaning: a clean liquid holding a cleaned-up bit of protein from the germ that causes tuberculosis,
  used to test for the disease
scope: A clean liquid used to test for tuberculosis, not a cure for the disease and not the germ itself.
examples:
- The nurse gave him a tuberculin test to check for tuberculosis.
- A small amount of tuberculin is put under the skin to see if the body reacts.
