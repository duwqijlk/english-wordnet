simpleMeaning: To see if the body stuff of two people will work well together, a set of tests is done
  before a body part is moved from one person to another.
scope: These tests are done before a body part is moved from one person to another, not after the move,
  and they test two people, not one alone.
examples:
- Tissue typing showed the donor and the patient were a good match.
- Before the transplant, tissue typing took several days.
