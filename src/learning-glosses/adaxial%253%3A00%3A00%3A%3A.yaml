simpleMeaning: On the side nearest the middle line of a plant part or living thing.
scope: The side of a leaf or body part nearest its middle line, not the far side and not the edge.
examples:
- The upper side of a leaf is known as the adaxial surface.
- The adaxial face of the petal catches more light.
