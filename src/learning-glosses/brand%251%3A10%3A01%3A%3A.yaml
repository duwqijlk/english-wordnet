simpleMeaning: A mark or sign that carries shame and a bad reputation.
scope: This is a sign of shame or bad name attached to a person or a name, not a name given to a product,
  not the mark burned into skin to show ownership, not the act of publicly calling someone shameful, and
  not the old word for a sword.
examples:
- The scandal left a brand on the family name for generations.
- A public brand of cowardice could ruin a soldier's career.
