senseId: 'haemorrhagic_fever%1:26:00::'
synsetId: 14200905-n
simpleMeaning: a set of illnesses caused by a virus, usually found only in one part of the world; fever
  and gut problems come first, then the tiny blood tubes bleed
scope: Also called hemorrhagic fever, viral haemorrhagic fever, and viral hemorrhagic fever; a group of
  viral illnesses with bleeding, not a single fever and not ordinary flu.
examples:
- Haemorrhagic fever broke out in the valley after the rains.
- Doctors feared haemorrhagic fever when the patient began to bleed.
