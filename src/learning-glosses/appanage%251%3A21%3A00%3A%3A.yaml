senseId: 'appanage%1:21:00::'
synsetId: 13275342-n
simpleMeaning: A gift of money or goods given by a ruler or law-making body to keep a member of a ruling
  family who needs support.
scope: A gift from a ruler or law-making body to keep a member of a ruling family who needs support; apanage
  is another name for it, and it is not a wage for work and not a gift to a stranger.
examples:
- The prince lived on the appanage granted by the king.
- Younger sons of the family received an appanage to live on.
