simpleMeaning: In the Middle Ages, a light coat with no sleeves, made of linked metal rings, worn under
  another coat of the same kind
scope: In the Middle Ages, a light sleeveless coat of linked metal rings worn under another coat of the
  same kind, not a full suit of armour and not a cloth coat.
examples:
- The soldier wore a habergeon under his hauberk.
- A habergeon was lighter than a full coat of mail.
