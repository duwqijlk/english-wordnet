simpleMeaning: This person does the unwelcome jobs a boss gives them, as part of the work
scope: A person who does a boss's unwelcome jobs, not a person who chops wood and not the boss giving
  the orders.
examples:
- The hatchet man told the staff the bad news for the director.
- As hatchet man, he carried out the orders no one else would touch.
