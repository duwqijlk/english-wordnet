simpleMeaning: a form used to make music records, letters for printing, or other surfaces with a raised
  pattern
scope: A hard form used to make copies, not a set of numbers set out in rows and lines in maths, and not
  the soft part at the base of a nail or the material that holds body cells.
examples:
- The matrix for the record was made of metal.
- Workers pressed each new copy from the same matrix.
