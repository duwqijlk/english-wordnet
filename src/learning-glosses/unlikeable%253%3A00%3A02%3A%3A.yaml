simpleMeaning: Of a person in a book or a play, tending to stir up feelings against them.
scope: Also called unsympathetic, unappealing, and unlikable, of a character in a book or a play who stirs
  up feelings against them.
examples:
- The unlikeable hero made readers root against them from the first chapter.
- She found the unlikeable villain hard to enjoy, though the story was good.
