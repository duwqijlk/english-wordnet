simpleMeaning: A strip of cloth wound round a limb so that each turn goes slanting up or down
scope: A strip of cloth wound round a limb so that each turn goes slanting up or down; not a strip wound
  straight round, and not a plaster.
examples:
- The nurse put an oblique bandage on his arm.
- An oblique bandage held the dressing in place.
