simpleMeaning: stretch out in long, winding curves
scope: Not a bendable object or a sliding body, and not simply travelling a winding route, but the way
  a river, road or queue lies in long, repeated curves.
examples:
- A narrow path snakes up the hillside.
- The queue snaked around the building and out into the street.
