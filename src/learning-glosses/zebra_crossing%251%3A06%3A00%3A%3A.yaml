simpleMeaning: a place where people on foot can walk over a road and cars must stop for them, often marked
  with stripes that run at a slant
scope: A place where people on foot can walk over a road and cars must stop for them, also called pedestrian
  crossing; not a place where cars have the right of way and not a footbridge.
examples:
- She waited at the zebra crossing until the cars stopped.
- The zebra crossing was painted with white stripes.
