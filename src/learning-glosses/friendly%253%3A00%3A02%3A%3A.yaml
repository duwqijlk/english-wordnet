simpleMeaning: of or belonging to the fighting forces of your own country, or to those of a country on
  the same side
scope: This is about the fighting forces of your own country or of a country on the same side, and about
  places or things that belong to them; not about a person who is kind like a friend and not about being
  willing to help a plan.
examples:
- The plane landed safely in friendly territory.
- He was hurt by friendly fire from his own side.
