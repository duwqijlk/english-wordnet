simpleMeaning: with edges cut like a saw, where each tooth is itself cut with smaller teeth
scope: An edge cut like a saw, with teeth that are themselves toothed, not a plain saw edge and not a
  smooth edge.
examples:
- The biserrate leaf had teeth along its edge that were themselves notched.
- Botanists described the margin as biserrate because each tooth bore smaller teeth.
