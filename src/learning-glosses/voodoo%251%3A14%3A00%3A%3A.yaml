simpleMeaning: In Haiti, the people who follow a religion that uses magic and worships gods seen as spirits
  in all things
scope: This names the followers in Haiti, not the religion itself, not a magic charm, and not the act
  of putting magic on someone.
examples:
- The voodoo gathered at night for songs and prayers.
- The voodoo in Haiti follow a religion with magic and spirits in nature.
