simpleMeaning: A gull-like sea bird, flying along the top of the water with a long lower beak dipped in,
  to skim out food.
scope: A gull-like sea bird, flying along the top of the water with a long lower beak dipped in, to skim
  out food; not a stiff hat of straw with a flat crown, nor a cooking tool used to skim fat from the top
  of liquids, nor a quick, shallow reader.
examples:
- Their skimmer flew at dusk.
- The skimmer skimmed the waves.
