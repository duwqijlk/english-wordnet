senseId: dilettante%5:00:00:superficial:00
synsetId: 01880299-s
simpleMeaning: showing an interest that is not deep or serious, and not done with much skill
scope: This describes an interest or effort that is not deep or serious and lacks skill; it is not the
  noun naming a person who does an activity without serious aims.
examples:
- Her dilettante interest in painting ended after a few easy lessons.
- He took a dilettante approach to history, reading only short, fun pieces.
