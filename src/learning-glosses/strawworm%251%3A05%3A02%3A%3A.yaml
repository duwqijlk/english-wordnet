simpleMeaning: the young of the caddis fly, which builds a silk cover with sand or bits of plant stuck
  on it
scope: This is the young of the caddis fly, also called caddisworm; not the young of the chalcid fly that
  harms wheat stalks.
examples:
- The strawworm builds its case from silk and sand.
- A strawworm hid inside a case covered with plant bits.
