simpleMeaning: cut in an uneven way, with rough sharp edges, as if torn
scope: Also called lacerated. This describes a thing cut unevenly with rough, sharp edges, not the act
  of cutting or tearing flesh.
examples:
- The plant has lacerate leaves with rough, uneven edges.
- He picked up a lacerate leaf, torn into uneven strips.
