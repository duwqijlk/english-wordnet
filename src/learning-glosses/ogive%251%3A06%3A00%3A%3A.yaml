simpleMeaning: Keeping the load safe from heat as it flies through the air, this cone-shaped head is the
  front part of a missile or rocket.
scope: It is also called nose cone, the cone-shaped head at the front of a missile or rocket.
examples:
- The ogive took the heat of the flight.
- The rocket's ogive led the way through the air.
