simpleMeaning: to make a strong feeling less strong or to make someone calm
scope: This means making a feeling less strong or calm, also called still, another name for it is relieve;
  it is not about making pain in the body less, and not the noun for feeling comfortable.
examples:
- The good news eased her worry.
- His kind words eased her fears and helped her feel calm.
