simpleMeaning: any air-like substance that has no fixed shape or size and can spread out without limit.
scope: This is any particular air-like substance, not the general state of matter and not petrol for cars.
examples:
- Oxygen is a gas that we need to breathe.
- The gas from the broken pipe filled the kitchen.
