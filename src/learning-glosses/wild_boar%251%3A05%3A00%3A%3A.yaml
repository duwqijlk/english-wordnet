simpleMeaning: a pig of Europe, Asia and Africa with a slim body and large tusks, the ancestor of most
  farm pigs, brought to the United States
scope: 'Also called boar: a pig of the Old World with a slim body and large tusks, not a farm pig and
  not a warthog.'
examples:
- The wild boar rooted in the mud at the edge of the wood.
- Hunters tracked the wild boar through the forest.
