simpleMeaning: One of a pair, these small tube parts of an animal cell near its centre make star groups
  when cells split, made of nine groups of three tiny tubes.
scope: One of a pair of small tube parts of an animal cell near its centre; not the centre itself, and
  not a part of a plant cell.
examples:
- Each centriole is one of a pair of small tube parts near the centre of the cell.
- Centrioles make star groups when cells split.
