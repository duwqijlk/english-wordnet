simpleMeaning: A direct-current machine whose turning part and field coils join in parallel to one power
  source, for industrial changing-speed work, as in machine tools, winding and unwinding machines and
  tensioners.
scope: Also called shunt wound DC motor; a motor whose turning part and field coils join side by side
  to one power source, not a motor whose parts join one after another and not a motor run on alternating
  current.
examples:
- A shunt DC motor has good speed regulation even as the load varies, but does not have the starting torque
  of a series DC motor.
- The factory uses a shunt DC motor to drive the winding machine.
