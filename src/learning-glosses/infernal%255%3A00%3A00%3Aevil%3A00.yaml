scope: 'Also called hellish, unholy, demonic, diabolical, satanic, fiendish and diabolic: this means very
  evil or cruel, not about a strong fire out of control and not a word used to make other words stronger.'
examples:
- The story tells of an infernal king who liked to hurt his own people.
- They called the camp an infernal place, where guards were cruel every day.
