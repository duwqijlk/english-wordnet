simpleMeaning: a person who is the best of their kind, with no one to match them
scope: A person who is the best of their kind, with no one to match them, also called ideal; not a holy
  person named by the church, and not the act of naming one.
examples:
- She is a saint among teachers, loved by every child she taught.
- Among cooks he was a saint, and no one could match his skill.
