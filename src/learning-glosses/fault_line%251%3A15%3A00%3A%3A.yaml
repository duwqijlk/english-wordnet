simpleMeaning: In geology, the place on the ground where a break in the rock meets the surface
scope: This is where a break in the rock reaches the ground, not the break itself deep underground and
  not a line drawn on a map.
examples:
- The fault line runs across the valley floor.
- They mapped the fault line before building the road.
