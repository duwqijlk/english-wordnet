simpleMeaning: a condition in which glands in the skin that make oil work too hard, so the skin turns
  oily
scope: A condition in which the skin's oil-making glands work too hard and the skin turns oily; not dry
  skin and not a skin infection.
examples:
- His seborrhea made his forehead look shiny by midday.
- The doctor said the seborrhea was causing her scalp to be oily.
