simpleMeaning: To take away the air a fire needs, so it goes out.
scope: To take away the air a fire needs, so it goes out, not to take away a person's air and not to hide
  a feeling.
examples:
- Firefighters smothered the flames with foam.
- He smothered the fire with a wet blanket.
