simpleMeaning: A small songbird with long wings, quick and graceful in flight, that travels the same route
  every year.
scope: A fast, graceful songbird with long wings, not the action of moving food down the throat or a mouthful
  of liquid food.
examples:
- A swallow swooped low over the pond to catch insects.
- The swallows return to this barn every spring.
