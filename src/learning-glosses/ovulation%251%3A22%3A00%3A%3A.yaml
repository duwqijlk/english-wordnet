simpleMeaning: the act of an egg leaving the part in a woman's body where eggs are kept, usually half
  way through the time between her monthly bleeds
scope: This sense is an egg leaving the part where eggs are kept in a woman; it is not the monthly bleed
  itself and not a baby growing inside her.
examples:
- Ovulation usually happens about two weeks before her next monthly bleed.
- She used a simple test to find the day of ovulation.
