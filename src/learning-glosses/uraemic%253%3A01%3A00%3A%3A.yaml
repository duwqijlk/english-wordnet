simpleMeaning: To do with too much waste holding nitrogen in the urine, most often because the kidneys
  do not work well.
scope: 'Also called azotemic and uremic: to do with too much waste holding nitrogen in the urine, most
  often from kidneys that fail, not a pain in the bladder and not a simple infection of the urine.'
examples:
- The uraemic patient had too much waste in the urine because his kidneys failed.
- Uraemic signs show when the kidneys do not work well.
