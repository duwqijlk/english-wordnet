senseId: 'extremism%1:09:00::'
synsetId: 06227743-n
simpleMeaning: any set of ideas about how a country should be run that supports plans that go too far
  and will not change those plans at all to agree with others
scope: A set of ideas about how a country should be run that supports plans that go too far and will not
  change those plans at all; not a single strong act, and not a set of ideas that will change to agree
  with others.
examples:
- The party was known for its extremism and its refusal to talk with others.
- Teachers warned students about the dangers of political extremism.
