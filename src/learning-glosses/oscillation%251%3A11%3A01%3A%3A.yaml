simpleMeaning: one full round of something that happens again and again, from its start to its end
scope: 'Also called cycle: one full round of a thing that happens again and again, not the regular change
  in a value in physics and not moving back and forth between states.'
examples:
- A year is one oscillation of the seasons, from spring round to spring again.
- The machine counted each oscillation as one full turn, from the start back to the same point.
