simpleMeaning: A piece of meat cooked in an oven, or ready to be cooked in an oven, big enough to cut
  into more than one serving
scope: 'Also called a joint: a piece of meat for the oven big enough for more than one serving, not meat
  already cooked by dry heat in an oven.'
examples:
- We bought a roast for Sunday lunch and sliced it at the table.
- She put the roast in the oven early in the morning.
