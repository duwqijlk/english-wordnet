simpleMeaning: A claim by the United States on all that a person owns when that person has not paid the
  money owed to the country's government
scope: A claim by the United States on all that a person owns when the money owed to the government goes
  unpaid; not a bill for money owed and not a claim by a state or a private lender.
examples:
- The federal tax lien covered all of his property.
- A federal tax lien was placed on the house.
