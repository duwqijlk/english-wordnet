simpleMeaning: Made to look pretty, this is the front of a woman's bodice or shirt
scope: The pretty front of a woman's bodice or shirt, not the thick pad a fencer wears on the chest and
  not the underside of a turtle's shell.
examples:
- The plastron was the prettiest part of her new blouse.
- She sewed a plastron onto the front of the shirt.
