simpleMeaning: The marks of a famous English poet and his verse, above all wild feeling, deep sadness,
  and showy force.
scope: This is the style of Lord Byron and his poetry, marked by wild feeling, sadness and showy force;
  not the mere copying of his way of life, and not simple admiration of the poet.
examples:
- His early poems are full of Byronism, wild feeling and deep sadness.
- Critics saw Byronism in the young writer's stormy verse.
