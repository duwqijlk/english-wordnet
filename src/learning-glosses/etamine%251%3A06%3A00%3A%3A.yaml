simpleMeaning: Made of cotton or wool thread, this soft cloth has wide gaps between the threads and serves
  for curtains, clothes, and other things.
scope: Also called etamin, this is a soft, loosely woven cloth of cotton or wool thread, used for curtains,
  clothes, and other things.
examples:
- She sewed the curtains from etamine.
- Her blouse was made of etamine.
