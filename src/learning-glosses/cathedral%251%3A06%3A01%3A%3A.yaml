simpleMeaning: the main Christian church of the area that a bishop is in charge of
scope: The main church for a bishop and his area; not the word for things to do with a bishop's job or
  throne, and not just any church.
examples:
- The cathedral is the main church of the bishop for this area.
- People came from all over the area to the cathedral for the big service.
