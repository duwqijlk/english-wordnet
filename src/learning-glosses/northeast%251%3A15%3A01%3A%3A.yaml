simpleMeaning: the part of a country, a region, or a city that lies toward the top right corner of a map
scope: A place in the upper right part of a country, a region, or a city, not the direction itself and
  not a wind from there.
examples:
- They live in the northeast of the country.
- The northeast of the city is full of old factories.
