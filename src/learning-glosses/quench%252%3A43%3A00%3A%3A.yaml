simpleMeaning: to make a fire stop burning, and to make a flame or a light go out
scope: 'Also called extinguish: to put out a fire, flame, or light, not to satisfy thirst and not to stop
  a spark in a wire.'
examples:
- He quenched the fire with a bucket of sand.
- The rain quenched the flames at last.
