simpleMeaning: The green outer leaves, the pollen stalks, and the flower's outer cup all sit on a cup,
  ring, or tube at the base of a flower, as in roses.
scope: Also called calyx tube and floral cup, this is the part of a flower that carries its outer leaves
  and pollen stalks, not the stalk below the flower.
examples:
- The hypanthium of the rose holds the sepals in a neat cup.
- In this flower the hypanthium forms a ring round the base of the petals.
