simpleMeaning: an illness caused by one changed gene on a chromosome that does not set a person's sex
scope: 'Also called autosomal dominant disease: an illness from one changed gene, not an illness that
  needs two changed genes and not an illness from a gene on a sex chromosome.'
examples:
- Huntington's disease is an autosomal dominant disorder that can be passed on by one parent.
- Her doctor told her the autosomal dominant disorder came from a single changed gene.
