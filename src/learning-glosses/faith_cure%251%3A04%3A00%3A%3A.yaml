senseId: 'faith_cure%1:04:00::'
synsetId: 00700989-n
simpleMeaning: Care given by praying and trusting in God.
scope: It is help given to a person through prayer and trust in God, and faith healing is another name
  for this sense, while help from a doctor and prayer on its own, with no help given, are different things.
examples:
- Many people sought a faith cure at the shrine.
- She believed a faith cure would help her mother.
