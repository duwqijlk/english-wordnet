simpleMeaning: giving or passing on facts about something to people
scope: This is about giving or passing on facts about something; it is not the sense about teaching people,
  and not the sense about making people know more.
examples:
- The leaflet was very informative and told us all the times and prices.
- His talk was informative, giving many new facts about the birds.
