simpleMeaning: the luck of finding good things you were not looking for, when you least expect them
scope: Good luck in finding fine things by chance, not skill and not a planned search.
examples:
- By pure serendipity she found the lost letter in an old coat.
- His serendipity led him to a rare book in a market stall.
