simpleMeaning: a title used when speaking to the woman in charge of a convent.
scope: This is not the everyday word for a child's female parent; it is a title used to address the head
  of a convent.
examples:
- '''Yes, Mother, I will lock the gate tonight,'' the novice replied.'
- '''Mother, the sisters are waiting for you in the chapel.'''
