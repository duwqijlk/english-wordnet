simpleMeaning: help with supplies or office work given by one or more of the armed services to one or
  more parts of the United States government
scope: Help with supplies or office work given by the armed services to parts of the United States government,
  also called interagency support; not help one army gives another and not help given to the public.
examples:
- The army gave interdepartmental support to the health office.
- Interdepartmental support moved food to the relief teams.
