simpleMeaning: of a look, one given from the side of the eyes, sly and full of sexual want
scope: A look given from the side of the eyes, sly and full of sexual want; not a look of sly ill will.
examples:
- He gave her a leering look, his eyes moving over her body as she walked past.
- She turned away from the leering stare of the man who kept eyeing her with open sexual want.
