simpleMeaning: A picture stored as a flat set of tiny dots, each dot with its own brightness.
scope: A picture stored as a flat set of tiny dots, each with its own brightness; electronic image is
  another name for this sense, not a picture drawn with lines and not a printed photograph.
examples:
- The bitmap looked blocky when enlarged.
- He saved the drawing as a bitmap.
