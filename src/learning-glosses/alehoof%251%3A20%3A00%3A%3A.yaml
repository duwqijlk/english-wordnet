simpleMeaning: a creeping, fragrant mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets, naturalized in North America, sometimes classed in genus Nepeta.
scope: Another name for the creeping European mint commonly called ground ivy, not a separate species.
examples:
- Alehoof crept along the shaded wall, its round leaves and small purple flowers close to the ground.
- He planted alehoof in a hanging basket, where its trailing stems soon hung over the side.
