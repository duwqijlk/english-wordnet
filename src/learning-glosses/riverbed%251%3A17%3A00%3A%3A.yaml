simpleMeaning: the ground at the bottom of a river, where the water flows or flowed before
scope: The bottom under the water, not the bank at the side of the water and not the water itself.
examples:
- When the water fell in summer, we could walk on the dry riverbed.
- Small stones covered the riverbed under the clear water.
