simpleMeaning: With flowers that usually grow in flat-topped clusters and roots that creep along underground,
  this low bristly rose shrub grows in southern Oregon and California.
scope: This low bristly rose shrub of southern Oregon and California is set apart by its creeping roots
  and its usually flat-topped clusters of flowers.
examples:
- The ground rose showed its flat-topped clusters of flowers.
- A ground rose grew low and bristly.
