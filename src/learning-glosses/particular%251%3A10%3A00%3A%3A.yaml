senseId: 'particular%1:10:00::'
synsetId: 06763856-n
simpleMeaning: in logic, a claim that something is true of some members of a group but not all of them
scope: A logical claim about some but not all members of a class, not a fact about one part of a subject,
  nor a small part of a whole.
examples:
- The logician treated 'some cats are black' as a particular.
- A particular makes a claim about some members of a class, not all of them.
