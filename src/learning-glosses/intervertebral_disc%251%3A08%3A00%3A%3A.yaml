simpleMeaning: Between every two bones of the back but the top two, a soft pad of tough gristle takes
  the shock
scope: Also called the intervertebral disk, this pad of tough gristle cushions the bones of the back,
  all but the top two.
examples:
- An intervertebral disc lies between two bones of the back.
- The intervertebral disc cushions the bones of the back.
