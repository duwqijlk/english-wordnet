simpleMeaning: a person who claims the right to be king, queen, or ruler, usually without a true right
  to that place
scope: A person who says he or she should rule, usually with no true right. Not a person who hides true
  feelings by saying things he or she does not believe, and not a person who makes false claims in other
  ways.
examples:
- The pretender raised an army to take the throne from the king.
- Many people saw the pretender as the true heir to the throne.
