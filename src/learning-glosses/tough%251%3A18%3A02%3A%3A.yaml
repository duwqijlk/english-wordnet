simpleMeaning: a person who learned to fight in the streets instead of training in a boxing gym
scope: This is not a trained boxer and not merely a strong person; it is someone whose fighting skill
  came from street experience.
examples:
- He grew up as a street tough, never trained in any boxing gym.
- The bouncer kept an eye on the toughs hanging around the entrance.
