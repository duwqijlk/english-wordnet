simpleMeaning: In phonetics, a speech sound made with the mouth open and the tongue pushed forward in
  the mouth
scope: In phonetics, this is a speech sound made with the mouth open and the tongue pushed forward, not
  a sound made with the tongue pulled back and not a consonant.
examples:
- The 'a' in 'man' is a front vowel.
- The 'e' in 'gel' is a front vowel.
