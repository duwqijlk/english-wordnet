simpleMeaning: in a way that is like a young person who is not yet fully grown
scope: This means doing something in a way like a young person who is not yet fully grown, not in a grown-up,
  serious way.
examples:
- The boy sulked childishly when he lost the game.
- She giggled childishly and hid behind her hands.
