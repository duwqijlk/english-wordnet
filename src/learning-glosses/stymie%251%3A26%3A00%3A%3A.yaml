simpleMeaning: In golf, a time when another player's ball sits in the way between your ball and the hole
scope: 'Also called stymy: in golf, a situation where another player''s ball blocks your way to the hole,
  not a block in another game or in daily life.'
examples:
- He faced a stymie because the other ball lay right in front of the hole.
- A stymie left her with no straight putt to the hole.
