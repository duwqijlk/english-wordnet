simpleMeaning: usually in the plural, one of a row of three dots showing that some words have been left
  out or that a sentence is not finished
scope: This is one of a row of dots showing that words are left out or a sentence is not finished, not
  a full stop at the end of a finished sentence and not the whole row taken together.
examples:
- The writer used a suspension point to show that words were left out.
- A suspension point at the end of the line showed that the sentence was not finished.
