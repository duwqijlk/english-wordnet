simpleMeaning: so bad that it makes people feel strong dislike and want to turn away
scope: This sense is also called wicked, foul, disgusting, revolting, distasteful, loathsome, yucky, repelling,
  skanky, and repellant. It means very bad and making people turn away, not a thing that keeps animals
  or water away, and not unable to take in a liquid.
examples:
- The smell from the bins was repellent.
- He found the idea of eating raw snails repellent.
