simpleMeaning: to grow soft and limp because the air has gone out of it
scope: To grow soft and limp as air leaves, not to let the air out of something else and not to fall flat
  in a sudden way.
examples:
- The balloons deflated slowly after the party.
- The tyre deflated overnight and was flat by morning.
