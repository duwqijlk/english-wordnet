simpleMeaning: In maths, a grid of numbers with equal rows and columns, less a number times the ones-and-noughts
  grid, works out to nought for one such number
scope: Also called an eigenvalue, an eigenvalue of a matrix, or an eigenvalue of a square matrix, this
  number in maths is the one that makes a grid of numbers with equal rows and columns work out to nought.
examples:
- They found the characteristic root of a square matrix by working through the numbers.
- She worked out the characteristic root of a square matrix for the grid of numbers.
