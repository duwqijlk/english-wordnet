simpleMeaning: a plant whose young leaves are much eaten as green food and whose seeds are eaten as grain
scope: 'Also called love-lies-bleeding and tassel flower: a food plant, not a plant grown only for show
  and not a grain plant like wheat.'
examples:
- She picked the young leaves of the velvet flower for dinner.
- The velvet flower's seeds were ground and eaten like grain.
