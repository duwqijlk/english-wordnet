simpleMeaning: Only a short way ahead is lit by the light from a car's front lamps
scope: The light from a car's front lamps that shows a short way ahead, not the light that reaches far
  and not a lamp on the back of the car.
examples:
- She switched to low beam when another car came towards her.
- Low beam shows only a short way ahead on a dark road.
