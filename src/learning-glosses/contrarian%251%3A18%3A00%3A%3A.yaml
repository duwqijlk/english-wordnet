simpleMeaning: A person who puts money in against what most other buyers think, on purpose.
scope: A person who puts money in against what most other buyers think, not one who follows the crowd.
examples:
- A contrarian bought shares while everyone else was selling.
- The contrarian went against the advice of other investors and won.
