simpleMeaning: to put a sticky substance on a surface or cloth to fill small holes or make it stiff.
scope: This is about treating a surface or cloth, not about measuring how big something is.
examples:
- The cloth was sized before it was printed.
- They sized the walls to seal the small holes.
