simpleMeaning: to do with the rotting of dead plants or animals, or going on at the same time as that
  rotting
scope: About rotting itself, or with rotting going on; not the sense that says a thing is far gone in
  rotting and has a very bad smell.
examples:
- The putrid changes in a dead animal's body help return it to the soil.
- Bacteria cause many of the putrid changes that go on after death.
