simpleMeaning: very hot liquid rock that comes out of a volcano; it is the hot liquid rock from under
  the ground once it comes to the surface
scope: Hot liquid rock on the surface of the ground, after it comes out of a volcano; not magma, the same
  hot rock while it is still under the ground.
examples:
- Lava flowed slowly down the side of the mountain.
- Hot lava covered the road near the village.
