simpleMeaning: The flat piece inside a shoe or boot, under the foot, that the foot rests on.
scope: The flat piece inside a shoe or boot under the foot, not the hard outer bottom that touches the
  ground; insole is another name for this sense.
examples:
- The innersole of his shoe had worn thin.
- She put a soft innersole in her boots.
