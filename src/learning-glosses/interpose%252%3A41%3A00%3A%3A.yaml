schema: oewn-learning-gloss-v2
senseId: 'interpose%2:41:00::'
synsetId: 02544431-v
simpleMeaning: to get involved in an action so that you change it or make it harder to go on, or by using
  force or the threat of force
scope: 'Interfere and intervene are other names for this sense: getting involved so as to change an action
  or make it harder, by force or the threat of force or in another way. It is not putting forward a remark
  or point while taking part in something.'
examples:
- The government interposed in the strike and forced both sides to talk.
- No one interposed when the two sides began to fight, so the argument grew worse.
