simpleMeaning: Worn against the body to soak up the blood that leaves a woman's body each month, a pad
  thrown away after one use, sold under the trade name Kotex.
scope: Also called a sanitary towel, it is the throw-away pad worn against the body, not a washable cloth,
  to soak up the blood that leaves a woman's body each month.
examples:
- They put a fresh sanitary napkin in the bag.
- They changed the sanitary napkin before the long walk.
