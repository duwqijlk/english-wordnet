senseId: dictatorial%5:00:00:undemocratic:00
synsetId: 00721128-s
simpleMeaning: Like an absolute ruler or absolute rule, holding complete power over others.
scope: Like an absolute ruler or absolute rule, holding complete power over others, also called authoritarian,
  autocratic, tyrannical, despotic, or tyrannic; not expecting unquestioning obedience, and not simply
  of or like a dictator.
examples:
- The new leader's rule was dictatorial, with no one allowed to question it.
- Her manner in meetings was dictatorial, and nobody dared to disagree.
