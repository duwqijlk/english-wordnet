simpleMeaning: a woman who has a child of her own, also used when you speak to her.
scope: This is not the slimy substance used in vinegar-making, nor the act of caring for someone; it is
  a woman with a child.
examples:
- My mother taught me how to cook.
- She became a mother at the age of thirty.
