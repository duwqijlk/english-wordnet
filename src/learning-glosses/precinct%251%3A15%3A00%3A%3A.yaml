simpleMeaning: a part of a city or town set apart as an area for running local affairs
scope: A part of a city or town set apart for running local affairs, not one single office building inside
  that area.
examples:
- Voters in this precinct go to the school hall to vote.
- The city drew new lines for the precinct last year.
