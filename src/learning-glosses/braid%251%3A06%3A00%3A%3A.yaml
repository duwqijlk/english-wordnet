simpleMeaning: A strip of trim put on clothes or curtains to make them look nice
scope: This is trim put on clothes or curtains for show, not a way of wearing hair or the act of weaving
  hair.
examples:
- Gold braid runs along the edge of the curtain.
- She sewed braid on the hem of her dress.
