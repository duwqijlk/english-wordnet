simpleMeaning: blood tubes that branch off the inner blood tube of the hip and feed the hip joint and
  the buttock area
scope: Blood tubes that branch off the inner blood tube of the hip and feed the hip joint and the buttock
  area; arteria glutea and arteria glutes are other names for this sense, not a vein and not that blood
  tube itself.
examples:
- The gluteal artery supplies blood to the hip.
- Surgeons must avoid the gluteal artery during the operation.
