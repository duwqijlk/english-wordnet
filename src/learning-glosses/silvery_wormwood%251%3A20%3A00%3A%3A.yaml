simpleMeaning: a silver-haired woody plant of the central and southern United States and Mexico, a troublesome
  weed on open grazing land
scope: A silver-haired woody plant of the central and southern United States and Mexico, a troublesome
  weed on open grazing land, also called sand sage; not a silver-haired woody plant of the north and not
  a weed of garden beds.
examples:
- Silvery wormwood spread over the grazing land.
- The rancher pulled up silvery wormwood from the field.
