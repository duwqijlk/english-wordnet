simpleMeaning: one of many proteins usually in the body, or made by the body when a thing (an antigen)
  gets in; it makes that thing harmless, so the body fights illness
scope: A substance in the body that stops harmful things that get in, not a medicine given from outside
  and not the harmful thing itself.
examples:
- The blood test showed antibodies against the virus.
- After the illness, her body made antibodies that help protect her.
