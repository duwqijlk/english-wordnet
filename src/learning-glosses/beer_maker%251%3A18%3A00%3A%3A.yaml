simpleMeaning: a person who makes a drink from malt (sprouted grain), hop flowers and water
scope: 'Also called a brewer: a person who makes the drink from malt, hops and water, not a person who
  sells the drink and not a person who grows the grain.'
examples:
- The beer maker tasted the new batch before it was sold.
- Our local beer maker uses hops from his own farm.
