simpleMeaning: Whose dead, rotted parts make peat, this pale or grey moss is one of many kinds of a plant
  group called Sphagnum.
scope: This pale or grey moss is also called sphagnum, peat moss, and sphagnum moss.
examples:
- Bog moss breaks down into peat after it dies.
- Bog moss turns into peat as its dead parts rot.
