simpleMeaning: In building, a three-sided bracket of brick or stone, usually sticking out only a little
  way.
scope: In building, a three-sided bracket of brick or stone, also called a truss, usually sticking out
  only a little way; not the act of putting such a bracket on a building.
examples:
- The beam rested on a stone corbel set into the wall.
- Carved corbels held up the corners of the roof.
