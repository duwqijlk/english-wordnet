simpleMeaning: Changing how something looks so that people cannot tell what it really is
scope: 'Also called disguise: the act of hiding what a thing really is by changing how it looks, not the
  cloth with green and brown marks used for this and not an outward look that gives a false idea.'
examples:
- Camouflage is the way the team hid the tent by painting it to look like the ground around it.
- 'The animal''s safety lay in camouflage: it changed its look so that hunters could not tell what it
  was.'
