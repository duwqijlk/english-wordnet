simpleMeaning: to put a name or sign on goods to show who made or sells them
scope: 'Also called brand: putting a name or sign on goods, not having the name or sign put on an official
  list, and not the sign itself.'
examples:
- The maker trademarks each bag with its name in gold letters.
- They trademarked the bottles by printing their sign on every label.
