simpleMeaning: How far above the line where earth meets sky a thing sits, as an angle, above all a star
  or planet.
scope: Not the angle round the sky from north, which is azimuth; also called altitude, elevation and ALT.
examples:
- The EL of the star was 30 degrees.
- We took the EL of the planet at dusk.
