schema: oewn-learning-gloss-v2
senseId: 'attest%2:32:01::'
synsetId: 00822637-v
simpleMeaning: to give facts that show something is true, to be proof of it, and to show it by the way
  you act, think, or look
scope: 'Also called evidence, demonstrate, manifest, and certify: giving facts or acting in a way that
  shows something is true. Not saying in an official way that a paper is true, and not showing how a word
  is used.'
examples:
- The many happy guests attested to the success of the party.
- Her kind acts attest to her good heart.
