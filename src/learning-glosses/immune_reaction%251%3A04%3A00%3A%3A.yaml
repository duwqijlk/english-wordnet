simpleMeaning: When the body meets something foreign, its defenses recognize it as an antigen, such as
  a virus, fungus, bacterium or transplanted organ, and make antibodies that latch onto it.
scope: One of three names for this defense reaction, alongside immune response and immunologic response;
  it is not the antibody molecules on their own, and not a vaccine.
examples:
- A severe immune reaction followed the transplant, and doctors tracked his antibody levels.
- The immune reaction began within days of the infection.
