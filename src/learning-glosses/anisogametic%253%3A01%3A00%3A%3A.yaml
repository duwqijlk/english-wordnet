simpleMeaning: When two unlike sex cells join to make new life, this word is used of either one of the
  pair
scope: This word is used when the two sex cells that join are unlike each other, not when they are alike.
examples:
- The anisogametic cell joined with a sex cell unlike itself.
- Anisogametic cells come in unlike pairs that join to make new life.
