simpleMeaning: in a sudden way with great force, as when something bursts apart
scope: With sudden force, or growing suddenly and strongly; not slowly, calmly, or in a small, steady
  way.
examples:
- The gas caught fire and burned explosively.
- Anger grew explosively in the crowd after the speech.
