simpleMeaning: 'Spreading European weed, common in the southwestern United States and Mexico: reddish
  trailing stems, fern-like foliage, small reddish-lavender blooms and narrow upright fruits; often grown
  to feed animals.'
scope: This is the low weed grown as forage, not the similar musk clover and not a garden geranium.
examples:
- Alfileria spread across the bare ground beside the road.
- Ranchers in the valley plant alfileria for spring forage.
