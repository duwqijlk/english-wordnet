simpleMeaning: Used as a medicine to stop germs from growing, it is one of several man-made carbon mixes
  that holds back germs needing the food stuff PABA to live.
scope: 'Also called sulfa, sulfa drug, and sulfonamide: a medicine that stops the growth of germs that
  need PABA to live.'
examples:
- The sulpha stopped the germs from growing.
- She took sulpha to hold back the germs that need PABA.
