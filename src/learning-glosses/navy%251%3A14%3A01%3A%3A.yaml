simpleMeaning: The sea force of the United States of America; the arm of government that keeps, trains
  and arms ships and sailors fit to fight at sea.
scope: Not the sea force of any other land, nor the Army; also called the United States Navy, the US Navy
  and USN.
examples:
- The Navy sent ships to the far sea.
- He joined the Navy at eighteen.
