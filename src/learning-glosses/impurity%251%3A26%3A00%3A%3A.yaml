simpleMeaning: the state of a thing that is not pure, because something unwanted is mixed into it
scope: This is the state of a thing that is not pure because something unwanted is mixed in. It is not
  the unwanted thing itself, and it is not being pure and clean.
examples:
- The impurity of the water made it unsafe to drink.
- Tests showed the impurity of the metal after cheaper stuff was mixed in.
