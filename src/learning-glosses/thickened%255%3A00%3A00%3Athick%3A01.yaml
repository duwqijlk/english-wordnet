simpleMeaning: no longer thin, but grown or made thicker than it was
scope: Made or grown thicker than before, not skin gone hard with calluses and not a liquid made thick
  so it pours slowly.
examples:
- The scan showed thickened bronchial arteries.
- The sauce thickened as it cooled.
