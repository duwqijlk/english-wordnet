simpleMeaning: A large shop for buying things, set out in separate parts for different kinds of goods,
  and often one of a chain of such shops
scope: 'Also called department store: this is one large shop with many kinds of goods in separate parts,
  not a small single shop and not the whole chain of shops.'
examples:
- They bought clothes, toys, and kitchen goods all in the same emporium.
- The new emporium on the high street has separate floors for shoes, food, and home goods.
