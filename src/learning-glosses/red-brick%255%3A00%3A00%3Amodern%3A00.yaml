simpleMeaning: Of or to do with British universities first built in the late 1800s or the 1900s
scope: Of British universities first built in the late 1800s or the 1900s, also called redbrick; not of
  the old universities like Oxford and not of a school.
examples:
- She studied at a red-brick university in the north.
- The red-brick colleges grew fast in the 1900s.
