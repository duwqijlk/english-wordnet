senseId: 'distill%2:30:03::'
synsetId: 00476114-v
simpleMeaning: to make a liquid purer and stronger by heating it until it turns to steam and then cooling
  the steam back to liquid
scope: To purify and strengthen a liquid by heating it to steam and cooling the steam back; not the liquid
  itself changing, and not taking a part out of it.
examples:
- They distill the water to make it safe to drink.
- The factory distills the oil to make it purer.
