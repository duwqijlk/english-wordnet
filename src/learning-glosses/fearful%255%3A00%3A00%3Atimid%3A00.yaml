simpleMeaning: shy and easily afraid by nature, or showing that you are shy and easily afraid
scope: This sense is about a person who is shy and easily afraid, or who shows it; it is not about a thing
  that makes other people afraid, and not about having no courage.
examples:
- The fearful child hid behind her mother at the gate.
- He cast fearful glances at the big dog by the door.
