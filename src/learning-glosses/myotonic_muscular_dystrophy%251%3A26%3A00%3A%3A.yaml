simpleMeaning: 'Severe muscle-wasting condition: face, feet, hand and neck weakness, slurred speech, spreading
  hand weakness; from birth to middle age onset, slow progression, dominant inheritance: one parent can
  pass it on.'
scope: A third name for this same muscle-wasting disease, not a distinct type; the other two names in
  this lane mean exactly this illness.
examples:
- The clinic specialises in adults with myotonic muscular dystrophy who need help with mobility and speech.
- Myotonic muscular dystrophy usually progresses slowly, so many people live for decades after the first
