simpleMeaning: a person who went to live in a new place or to look for gold, especially in the western
  United States or in northwest Canada and Alaska
scope: This is a person, especially one in the west or far north, not the dough mix used for making bread.
examples:
- The old sourdough had lived alone in Alaska for twenty years.
- A sourdough told stories of looking for gold in western Canada.
