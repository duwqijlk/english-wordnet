simpleMeaning: a state of being apart from others because of anger or dislike between them
scope: 'Also called alienation: people being apart because of anger or dislike, not just being far away
  in place and not a short argument.'
examples:
- Their estrangement began after a bitter fight about money.
- Years of estrangement ended when the two brothers finally spoke again.
