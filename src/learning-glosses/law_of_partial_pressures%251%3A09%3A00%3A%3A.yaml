simpleMeaning: In chemistry and physics, the rule that a gas mixture's pressure equals the sum of what
  each gas would exert alone in the same space at the same temperature.
scope: This is the rule for adding up the separate contributions of the gases in one mixture. It is not
  Boyle's law, which relates one gas's pressure to its volume, nor the ideal gas law linking pressure,
  volume and temperature.
examples:
- The law of partial pressures explains why each gas in a scuba tank contributes its own share of the
  total.
- Using the law of partial pressures, she calculated how much oxygen the breathing mixture held.
