simpleMeaning: to send a message or try to reach someone by radio, telephone or similar means, or signal
  in order to pass on a message
scope: This is sending a message or signal by radio, telephone or similar means, not the narrower sense
  of telephoning someone for a conversation, not giving someone a name or describing them, not shouting,
  not ordering someone to come, not the cry of a bird, and not a short social visit.
examples:
- The ship called for help on the radio.
- The tower called the plane to warn it about the storm.
