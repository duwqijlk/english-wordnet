simpleMeaning: A yearly grass of Europe, often a weed on waste ground, most of all by roads and hedges.
scope: 'Also called barley grass and wall barley: a yearly grass of Europe that grows as a weed on waste
  ground, not a sown crop grass and not a grass of wet marshes.'
examples:
- Hordeum murinum grows along the roadside.
- The farmer pulled up Hordeum murinum from the field edge.
