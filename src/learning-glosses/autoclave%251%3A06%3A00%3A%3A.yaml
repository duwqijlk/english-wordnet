simpleMeaning: A closed pot that heats things past the point where water boils, used to make chemicals
  or to make surgeons' tools free of germs.
scope: A device that heats things past boiling point, also called a steriliser or sterilizer, not the
  act of putting a thing in one.
examples:
- The nurse put the surgical tools in the autoclave.
- An autoclave heats things past the boiling point of water.
