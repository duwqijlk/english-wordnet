simpleMeaning: a settled way of being in which a person generally has little interest in things and shows
  little strong feeling for them
scope: 'Also called numbness and indifference: a lasting way of being with little interest in things,
  not just a short time with no feeling or strong interest.'
examples:
- His apathy meant he never joined clubs and cared little about school events.
- Her apathy showed in the way she showed no interest in anything around her.
