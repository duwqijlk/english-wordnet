simpleMeaning: to put dark writing liquid on a thing, so that it is marked, coated, covered, or stained
scope: To mark or stain a thing with writing liquid, not to sign a paper and not the liquid itself.
examples:
- He inked his finger by mistake.
- She inked the stamp and pressed it on the paper.
