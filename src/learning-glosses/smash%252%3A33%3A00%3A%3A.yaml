simpleMeaning: to bring down or destroy something that people see as evil or harmful
scope: To bring down or destroy something people see as evil or harmful; not a very bad crash with a car,
  not hitting something hard and suddenly, and not a hard tennis hit from above the head.
examples:
- The police worked for months to smash the drug ring.
- The new law helped to smash the group that was selling stolen goods.
