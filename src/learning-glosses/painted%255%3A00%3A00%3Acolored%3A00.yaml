simpleMeaning: having parts or patches in different colors, and usually in bright colors
scope: Having different colors in parts or patches, usually bright; not covered with a thin layer of color,
  and not seeming false or without life.
examples:
- The painted desert glowed red, gold and brown in the sun.
- A painted horse with white and brown patches stood in the field.
