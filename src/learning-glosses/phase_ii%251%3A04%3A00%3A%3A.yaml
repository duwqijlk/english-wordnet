simpleMeaning: A test of a treatment on more people than the first test, to see how well it works for
  the illness it treats, while watching for bad side effects
scope: This is a test of a treatment on more people than the first test; phase II clinical trial is another
  name for this sense, and it is not the first test of the treatment.
examples:
- The drug passed phase II with good results.
- In phase II, doctors watched for side effects.
