senseId: 'welcome%3:00:00::'
synsetId: 02550712-a
simpleMeaning: Pleasing or satisfying, or gladly accepted and given without conditions.
scope: This is not the friendly act of meeting someone when they arrive, and not the friendly feeling
  of being accepted; it describes something that pleases people or is gladly accepted.
examples:
- The cool drink was very welcome on a hot day.
- Any help you can give would be welcome.
