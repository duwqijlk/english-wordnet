simpleMeaning: a burner tool that mixes air and gas and burns them to make a very hot flame
scope: This tool is also called a torch and a blowlamp. It makes a hot flame from air and gas, and it
  is not a light you carry in your hand.
examples:
- He used a blowtorch to heat the metal pipe.
- The worker lit the blowtorch and put on dark glasses.
