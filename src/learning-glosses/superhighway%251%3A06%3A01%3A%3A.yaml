simpleMeaning: A wide electronic network, like the internet, that moves sound, pictures, and video fast
  in digital form.
scope: A wide electronic network for fast digital sound, pictures, and video, also called the information
  superhighway; not a road for cars.
examples:
- The superhighway carries video to homes in seconds.
- Schools use the superhighway to share lessons online.
