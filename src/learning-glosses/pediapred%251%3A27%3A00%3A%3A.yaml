simpleMeaning: A drug that calms swelling in the body, used to treat illnesses that make parts of the
  body sore and swollen.
scope: This is a drug that calms swelling, also called prednisolone and also called Prelone, not a painkiller
  on its own or a drug for a single illness.
examples:
- The doctor gave her Pediapred for the swelling.
- Pediapred calmed the sore joints.
