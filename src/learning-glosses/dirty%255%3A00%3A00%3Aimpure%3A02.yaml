simpleMeaning: In color, dulled by impurities so it looks cloudy rather than bright, and often joined
  to another word by a hyphen.
scope: A dull, clouded color — another name for dingy, muddied or muddy — not something covered in grime
  and not radioactive contamination.
examples:
- The sea looked a dirty grey under the low clouds.
- He painted the kitchen a dirty white.
