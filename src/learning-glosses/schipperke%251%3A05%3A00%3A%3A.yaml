simpleMeaning: A kind of small, thick-set black dog, first used to guard boats in the Netherlands and
  Belgium.
scope: A small thick-set black dog first used to guard boats; not a terrier and not a corgi, a short-legged
  herding dog.
examples:
- The schipperke barked at strangers from the boat.
- Our schipperke guards the yard day and night.
