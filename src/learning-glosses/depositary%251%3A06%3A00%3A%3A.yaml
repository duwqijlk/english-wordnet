simpleMeaning: a place where things can be left for safe keeping
scope: A place where things can be left for safe keeping, also called deposit, depository or repository,
  and not a bank or a shop that sells things.
examples:
- The museum sent its old maps to a depositary for safe keeping.
- The town's records are held in a depositary outside the city.
