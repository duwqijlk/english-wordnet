simpleMeaning: The way the young seeds are set out in the placenta, and the way the placentas are set
  out in the seed case.
scope: The way the young seeds are set out in the placenta, and the way the placentas are set out in the
  seed case; not pollination and not fertilisation.
examples:
- Botanists study placentation to tell one flower family from another.
- The placentation in lilies differs from that in peas.
