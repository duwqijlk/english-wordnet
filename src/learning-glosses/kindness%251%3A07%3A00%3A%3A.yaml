simpleMeaning: the way of acting with a warm heart, care for what others need, a wish to ease their pain,
  and care not to hurt them
scope: This is a way of treating people with care and warmth, not just being polite and not just giving
  a gift.
examples:
- Her kindness to the new pupil made his first day much easier.
- The old man's kindness showed in the way he listened and helped his neighbours.
