simpleMeaning: a cloth cover that you put over a pillow on a bed
scope: Also called case. This is a cloth cover for a pillow, not a woman's under-dress and not a small
  flat piece of cloth or paper.
examples:
- He bought a new pillow slip for the guest bed.
- She washed the slip and put it back on the pillow.
