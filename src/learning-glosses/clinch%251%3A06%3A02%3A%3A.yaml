simpleMeaning: a tool that holds things firmly together, generally used by people who work with wood
scope: 'Also called clamp: a tool that holds things firmly together, not a rope loop and not a hold with
  the arms.'
examples:
- He used a clinch to hold the two boards together while he worked.
- The clinch kept the wood firmly in place on the bench.
