simpleMeaning: With no plugs at all, this part links one cable to another
scope: A small part that joins two cables without plugs, also called barrier strip; not a plug and not
  a socket for one cable.
examples:
- The junction barrier joined the two cables without any plugs.
- He wired the cables into the junction barrier.
