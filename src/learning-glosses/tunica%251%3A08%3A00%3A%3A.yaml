simpleMeaning: a thin sheet of body tissue that wraps round and covers a part of the body
scope: A thin layer that wraps round and covers a part of the body, also called tunic and adventitia;
  not the skin on the outside of the body and not a muscle.
examples:
- The tunica covers the outer wall of the blood vessel.
- The doctor pointed to the tunica around the organ.
