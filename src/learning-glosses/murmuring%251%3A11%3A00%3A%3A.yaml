schema: oewn-learning-gloss-v2
senseId: 'murmuring%1:11:00::'
synsetId: 07401520-n
simpleMeaning: a low sound that goes on and is hard to make out, often with the lips moving but no clear
  words spoken
scope: Also called mutter, murmur and muttering. This is the low sound itself, not a complaint said in
  a low, unclear voice.
examples:
- A soft murmuring came from the next room, but we could not hear any clear words.
- She sat with her lips moving in a quiet murmuring, saying nothing we could understand.
