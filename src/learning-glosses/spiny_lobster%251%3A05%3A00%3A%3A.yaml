simpleMeaning: With no big claws like a true lobster, a large sea animal good to eat has a shell covered
  with sharp points.
scope: This large sea animal, good to eat and with a shell covered in sharp points and no big claws like
  a true lobster, is also called crawfish, crayfish, langouste, rock lobster, and sea crawfish.
examples:
- They caught a spiny lobster.
- The spiny lobster had no big claws.
