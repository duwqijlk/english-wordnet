simpleMeaning: Large greyish-green fruit shaped like a football, with a rough, warty skin, grows on one
  of several winter plants of this kind.
scope: It is one of several winter plants, not the large football-shaped fruit itself that shares its
  name.
examples:
- The hubbard squash grew very large.
- She cut open a hubbard squash.
