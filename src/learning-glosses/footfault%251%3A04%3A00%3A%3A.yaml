simpleMeaning: In tennis, a fault made when the player serving fails to keep both feet back of the line
  at the back of the court.
scope: In tennis, this is a fault made when the player serving fails to keep both feet back of the line,
  not a fault in the play itself.
examples:
- The umpire called a footfault on the server.
- She lost the point on a footfault.
