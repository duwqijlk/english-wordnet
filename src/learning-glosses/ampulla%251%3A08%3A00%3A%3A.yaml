simpleMeaning: A broad part where a tube or pipe in the body widens, especially one of the curved tubes
  in the inner ear.
scope: This is a swelling in a duct or canal of the body, and not the two-handled flask the Romans used
  for wine or oil.
examples:
- Her ampulla sits in the inner ear.
- The duct widens into an ampulla.
