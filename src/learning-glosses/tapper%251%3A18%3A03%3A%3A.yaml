simpleMeaning: A dancer who beats out rhythms with small metal plates fixed to the toes and heels of the
  shoes.
scope: A dancer who beats out rhythms with small metal plates fixed to the toes and heels of the shoes;
  not a tavern keeper who draws drink from kegs or casks, not someone who listens in on telephone wires,
  not a worker who cuts screw threads with a tap, and not a person who strikes a surface lightly again
  and again.
examples:
- The tapper's shoes clicked on the wooden stage as she danced.
- He trained as a tapper and could beat out any rhythm with his feet.
