simpleMeaning: a unit in science for measuring inductance, naming a force of one volt made as a flow of
  one ampere goes up or down by one ampere in one second
scope: This is the unit of inductance, not the light gas, the heat total, or the 8th letter, and it is
  also called henry.
examples:
- The coil had an inductance of 2 H.
- H is the unit used to measure inductance.
