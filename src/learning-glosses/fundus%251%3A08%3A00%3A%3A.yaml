simpleMeaning: In anatomy, the bottom of a hollow organ, or the part of it farthest from its opening.
scope: In anatomy, this is the bottom of a hollow organ, or the part farthest from its opening; not the
  opening itself, and not the top of the organ.
examples:
- The fundus of the stomach sits above the opening where food comes in.
- The doctor looked at the fundus of her womb.
