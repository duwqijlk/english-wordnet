simpleMeaning: Shaped like a hollow helmet, the crest on this duck-billed dinosaur comes from nose passages
  that widen into it.
scope: Also called corythosaur, it is a duck-billed dinosaur whose nose passages widen into a helmet-like
  crest, not a horned dinosaur.
