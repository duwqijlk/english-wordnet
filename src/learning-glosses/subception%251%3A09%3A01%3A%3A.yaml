simpleMeaning: In psychology, noticing or reacting to something that acts on the senses without knowing
  about it or being aware of it
scope: In psychology, noticing or reacting to something without knowing about it, also called subliminal
  perception; not noticing something on purpose and not a dream.
examples:
- Subception lets us react to a signal we never notice.
- In tests of subception, people respond without knowing why.
