simpleMeaning: A shining patch high in the sky, bright with shifting colours, that can be seen when the
  sun is a little way below the horizon.
scope: A shining patch high in the sky, bright with shifting colours, seen when the sun is a little way
  below the horizon, also called mother-of-pearl cloud; not an ordinary white cloud and not the northern
  lights.
examples:
- Nacreous clouds shone in colours above the winter sky.
- We saw a nacreous cloud just after sunset.
