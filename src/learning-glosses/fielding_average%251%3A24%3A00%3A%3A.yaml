simpleMeaning: Add the assists and outs a player who stops the ball makes in baseball, divide by the chances
  that player had, and the number you get rates the player's work.
scope: This baseball number comes from a player's assists, outs made, and chances, and rates that player's
  work stopping the ball.
examples:
- His fielding average rose after a clean week in the field.
- The coach checked her fielding average before naming the team.
