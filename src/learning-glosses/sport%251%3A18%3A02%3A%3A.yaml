simpleMeaning: Someone known for how they act when teased, beaten, or facing hard times.
scope: This is a person's way of handling teasing or losing, not the teasing itself, and not someone who
  plays games.
examples:
- She was a good sport about losing the final.
- He's a poor sport who sulks whenever he doesn't win.
