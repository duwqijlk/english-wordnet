simpleMeaning: Able to kill germs that cause disease or to stop them from growing.
scope: This describes something that kills disease germs or stops them growing; antimicrobial is another
  name for it, and it is not a cure for one illness only.
examples:
- The antimicrobic cream kills germs on the skin.
- Nurses wash with an antimicrobic soap before touching patients.
