simpleMeaning: a thin covering like skin, joined to the young main body of some mushrooms
scope: A thin covering on a young mushroom, not a priest's silk cloth at High Mass and not the thin skin
  around a baby before birth.
examples:
- A thin veil covers the young mushroom.
- When the mushroom grows, its veil breaks and falls away.
