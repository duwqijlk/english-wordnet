simpleMeaning: in a way that shows beauty and grace, and with good taste
scope: In a way that shows beauty and good taste; not just in a graceful way, with no thought of taste.
examples:
- The room was elegantly decorated, with soft colours and fine chairs.
- She dressed elegantly for the dinner, in a simple black dress that suited her well.
