simpleMeaning: The line where the two sides of the hard roof of the mouth meet in the middle
scope: The line where the two sides of the hard roof of the mouth meet in the middle, not the soft part
  at the back and not a tooth.
examples:
- The palatine raphe runs down the middle of the hard palate.
- The dentist pointed to the palatine raphe in the middle of the mouth.
