simpleMeaning: The three arms of the federal government of the United States that make laws, carry them
  out, and judge by them.
scope: The three arms of the federal government of the United States, also called U.S. government, United
  States, United States government and US Government, not the government of one state and not the government
  of another land.
examples:
- The U.S. has three arms of government.
- The U.S. makes laws through Congress.
