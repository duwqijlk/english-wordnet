simpleMeaning: a tablet that holds one or more substances that help the body stay healthy, taken to add
  to what a person eats
scope: A tablet with vitamins in it, taken to add to food, not a pill that treats an illness and not a
  vitamin in food itself.
examples:
- She takes a vitamin pill with breakfast every morning.
- The doctor said a vitamin pill is no replacement for a good diet.
