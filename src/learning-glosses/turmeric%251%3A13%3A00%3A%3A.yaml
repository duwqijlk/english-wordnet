simpleMeaning: a powder made from the dried, ground thick stem that grows under the ground (a rhizome)
  of a plant, used to add taste to food
scope: The powder used to add taste to food, not the plant itself that it is made from.
examples:
- She added a spoon of turmeric to the rice to give it more taste.
- Turmeric is a common powder used to add taste in many curry dishes.
