simpleMeaning: Red blooms in tight bunches crown a tall bush of eastern Australia, its leaves widening
  toward the tip.
scope: This bush stands tall in eastern Australia, unlike the low, spreading kind whose narrow leaves
  frame round, packed bunches.
examples:
- The waratah showed red blooms in tight bunches above the leaves.
- Waratahs in eastern Australia grow tall, with leaves that widen toward the tip.
