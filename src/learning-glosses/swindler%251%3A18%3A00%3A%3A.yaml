simpleMeaning: a person who cheats you by lying and tricking you in a dishonest way to get money from
  you
scope: 'Also called a grifter, a scammer, or a chiseler: a person who cheats people by lies, not an honest
  seller and not a thief who takes by force.'
examples:
- The swindler sold the old man a car that did not work and kept his money.
- Police caught the swindler who had tricked many people online.
