simpleMeaning: An upland lizard of the south-west of the United States and Mexico, with stripes running
  along its body overlaid with light spots.
scope: Also called Cnemidophorus exsanguis, this upland lizard of the south-west United States and Mexico
  is known by stripes running along its body overlaid with light spots, among other whiptails and other
  upland lizards.
examples:
- The Chihuahuan spotted whiptail lives in the uplands of the south-west United States and Mexico.
- The Chihuahuan spotted whiptail has long stripes overlaid with light spots.
