simpleMeaning: From the southern end of the western foothills of the Sierra Nevada in California rises
  the biggest living thing, a very tall tree that keeps its leaves all year.
scope: Also called a big tree, this is the biggest living thing, a very tall tree that keeps its leaves
  all year, from the southern end of the western foothills of the Sierra Nevada in California.
examples:
- The giant sequoia stood taller than every other tree in the park.
- We walked beneath a giant sequoia in the California foothills.
