simpleMeaning: To release something outward all at once, fast and with force.
scope: This is about sending something out in a burst, as with a glance or a jet of water, not throwing
  an object at a target and not a person moving fast.
examples:
- She shot him a warning glance across the table.
- The hose shot a jet of cold water across the yard.
