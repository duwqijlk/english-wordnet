simpleMeaning: A glacier, a slow river of ice, leaves earth and stones piled up behind it
scope: Earth and stones left behind by a glacier, not a pile made by people and not the glacier itself.
examples:
- The moraine marked where the glacier had stopped.
- Farmers cleared stones from the moraine to plant crops.
