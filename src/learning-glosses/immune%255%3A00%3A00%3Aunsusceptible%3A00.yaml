simpleMeaning: about the body's power to fight off a disease or illness, or giving the body that power
scope: 'Also called resistant: about the body''s power to stay safe from a disease, or giving that power;
  not the noun for a person who cannot catch an illness, and not the wider sense about the state of being
  safe from illness.'
examples:
- She is immune to measles because she had the disease as a child.
- The new vaccine makes people immune to the infection.
