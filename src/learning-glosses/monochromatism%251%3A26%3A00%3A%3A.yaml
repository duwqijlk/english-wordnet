simpleMeaning: This is a state of seeing in which no colour is seen at all, and colours are told apart
  only by brightness
scope: 'Also called monochromacy, monochromasy, monochromatic vision and monochromia: a state of seeing
  with no colour at all, not poor colour sight and not night blindness.'
examples:
- Monochromatism is rare, and those who have it see only light and dark.
- Tests showed monochromatism, not ordinary colour blindness.
