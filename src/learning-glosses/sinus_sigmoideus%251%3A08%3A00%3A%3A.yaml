simpleMeaning: On the bones at the side and back of the head, a blood tube bends like the letter S inside
  the tough cover round the brain
scope: Also called a sigmoid sinus, it is a blood tube with an S-shaped bend lying on the bones at the
  side and back of the head, inside the tough cover round the brain.
examples:
- The sinus sigmoideus runs along the bones at the side of the head, inside the tough cover round the
  brain.
- A scan showed the sinus sigmoideus blocked near the back of the head.
