simpleMeaning: a plant grown in many places for its grey-green leaves, which smell good and are used in
  cooking and in making perfume, a sweet-smelling liquid for the skin
scope: This is the plant itself, grown for its leaves; it is not the leaves on their own, used fresh or
  dried to add taste to food, especially meat.
examples:
- She planted rosemary by the kitchen door and picked its leaves for roast potatoes.
- The rosemary in the pot has soft grey-green leaves with a strong, good smell.
