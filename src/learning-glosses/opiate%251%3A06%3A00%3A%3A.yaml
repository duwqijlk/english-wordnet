simpleMeaning: a drug that makes a person sleepy and dulls pain (a narcotic), with opium in it or with
  a drug made from opium in it
scope: This is the drug itself, one that has opium in it; it is not a word for making a person sleepy
  and not for the feeling such a drug gives.
examples:
- The doctor gave him an opiate to stop the pain after the operation.
- Opiates are strong drugs, so doctors must be careful with how much they give.
