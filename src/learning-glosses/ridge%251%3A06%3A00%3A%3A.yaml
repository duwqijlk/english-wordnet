simpleMeaning: The beam that holds the top ends of the sloping roof beams in place, running along the
  top where the two sloping sides of a roof meet.
scope: The beam at the top of a roof, not a raised edge on a bone and not a long raised line of high ground.
examples:
- The ridge beam runs along the top of the roof.
- The ridge holds the rafters at the top of the roof.
