senseId: 'screen%1:06:05::'
synsetId: 04159676-n
simpleMeaning: The picture that electricity makes on the wide front end of an old-style display tube,
  as in a television or monitor.
scope: This sense is not a flat modern display, a cover that blocks sight, or a surface for projected
  pictures, but the glowing picture on the front of an old-style display tube.
examples:
- The image on the cathode-ray screen was slightly curved at the edges.
- He watched the green screen of the old terminal flicker.
