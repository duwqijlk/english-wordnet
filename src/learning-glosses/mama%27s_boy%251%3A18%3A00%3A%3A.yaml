simpleMeaning: He has few of the usual interests of young males and sticks too close to his mother
scope: Also called mamma's boy and mother's boy, this is a young male too close to his mother and with
  few of the usual interests of young males, not a loving son and not a shy child.
examples:
- His friends teased him as a mama's boy because he never went anywhere without his mother.
- The mama's boy stayed home with his mother instead of playing with the other boys.
