simpleMeaning: In music, a fixed pattern of notes rising or falling in pitch, usually within one octave.
scope: A fixed pattern of musical notes, not a marked measuring strip and not a standard used to rank
  things.
examples:
- She practices the major scale every morning before playing her pieces.
- The song is built on a simple five-note scale.
