simpleMeaning: to breathe or blow onto a person in a church rite, above all to show the work of the Holy
  Spirit
scope: To breathe or blow onto a person in a church rite, above all to show the work of the Holy Spirit;
  not the medical blowing of powder into the body and not a blessing given by laying on hands.
examples:
- The priest will insufflate the child during the baptism rite.
- In the old rite, the bishop would insufflate the catechumen.
