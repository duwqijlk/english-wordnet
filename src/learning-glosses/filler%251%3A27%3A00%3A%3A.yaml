simpleMeaning: a material used to close cracks or holes in a surface
scope: A material used to close cracks or holes in a surface; not the writing put in empty space between
  stories in a magazine or newspaper.
examples:
- He spread filler over the crack in the wall and let it dry.
- Use a little filler to close the small hole before you paint the wood.
