simpleMeaning: In the Middle Ages, the lord of a palatinate (a great region) who ruled his lands with
  full power
scope: In the Middle Ages, the lord of a palatinate who ruled his lands with full power; palsgrave is
  another name for this lord, not a bone of the face and not a mere landowner.
examples:
- The palatine held court in his own castle.
- As palatine, he could coin money and raise an army.
