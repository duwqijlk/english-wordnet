simpleMeaning: The metal piece in a ring or other jewelry that keeps a gem fixed in position.
scope: The metal part of a ring or piece of jewelry that holds a gem, not the place or time where a story
  happens and not the scenery on a stage.
examples:
- The jeweler replaced the loose setting so the stone would not fall out.
- The diamond sat in a simple silver setting.
