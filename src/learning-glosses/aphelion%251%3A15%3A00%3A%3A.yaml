simpleMeaning: The point in a planet's or comet's path round the sun where it is farthest from the sun.
scope: The farthest point from the sun on a planet's or comet's path, not the nearest point and not a
  point on the sun itself.
examples:
- Earth reaches aphelion in early July.
- At aphelion the comet moves most slowly.
