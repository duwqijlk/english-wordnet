simpleMeaning: Under the top of the head, on one side or the other, lies this part of the outer layer
  of the brain
scope: 'Another name for the parietal lobe: the part of the brain''s outer layer under the top of the
  head, not the part at the front of the brain and not the part at the back.'
examples:
- The parietal cortex helps us know where things are.
- Damage to the parietal cortex can affect how we sense touch.
