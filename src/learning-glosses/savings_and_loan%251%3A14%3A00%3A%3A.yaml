simpleMeaning: a bank that takes in people's money to keep safe, which by law must lend some of it for
  buying homes
scope: A savings bank that must by law put some of its money into home loans; savings and loan association
  is another name for this sense. Not an ordinary bank and not a lender that only lends to businesses.
examples:
- The savings and loan gave her a loan to buy a small house.
- He kept his savings in a savings and loan near his home.
