simpleMeaning: having to do with the outer covering of a body or plant
scope: Of the outer covering of a body or plant, also called integumentary; not of the inner parts or
  the flesh inside.
examples:
- The integumental layer keeps water out of the plant.
- Doctors studied the integumental tissue that covers the animal's body.
