simpleMeaning: a section of a political party, law-making body or other group that has its own views or
  a special role
scope: A faction inside an organization, not a bird's limb or an airplane's lifting surface.
examples:
- The party's left wing pushed for more spending on schools.
- She belongs to the conservative wing of the Senate.
