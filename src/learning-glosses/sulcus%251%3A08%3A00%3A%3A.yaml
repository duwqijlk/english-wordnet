simpleMeaning: In anatomy, the narrow dips that mark the folds on the brain's surface are these; they
  can lie in any body part or tissue.
scope: In anatomy, this names the narrow dip that marks a fold, not the fold itself.
examples:
- Each sulcus marks a fold on the surface of the brain.
- A sulcus lay between two folds on the brain's surface.
