simpleMeaning: in a free way that does not keep to the strict, plain meaning
scope: This sense is about speaking, writing or taking meaning in a free way that is not strict or exact,
  not about giving or using a lot of something.
examples:
- Read the word 'heart' liberally here, as love and feeling, not as the body part.
- He used the word 'home' liberally to mean any safe place, not just a house.
