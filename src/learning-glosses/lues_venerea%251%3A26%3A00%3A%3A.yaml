simpleMeaning: a common illness spread through sex, brought on by a spiral-shaped germ; its signs shift
  from stage to stage, and it can reach a child still in the womb
scope: 'Also called pox, syphilis, lues, and syph: a sex disease that moves through stages, not a short-lived
  infection that clears up on its own.'
examples:
- The doctor told him he had lues venerea and needed treatment at once.
- Lues venerea can pass from a mother to her unborn child if it is not treated.
