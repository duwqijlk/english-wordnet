simpleMeaning: A belly muscle that runs at a slant on each side of the body.
scope: A belly muscle that runs at a slant on each side of the body; oblique, abdominal external oblique
  muscle and external oblique muscle are other names for it, not a straight belly muscle and not a back
  muscle.
examples:
- The musculus obliquus externus abdominis tightens when you twist.
- He felt the musculus obliquus externus abdominis work as he turned.
