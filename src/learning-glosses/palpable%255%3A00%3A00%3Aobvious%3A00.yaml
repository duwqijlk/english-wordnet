simpleMeaning: so clear that anyone can see, feel, or know it at once
scope: 'Also called plain, apparent, evident, manifest, unmistakable, and patent: something so clear it
  can be seen, felt, or known at once, not something that can only be touched and not something merely
  likely.'
examples:
- The palpable lie fooled no one.
- A palpable fear filled the hall.
