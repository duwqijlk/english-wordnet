simpleMeaning: a red raised birthmark of blood vessels close under the skin, looking like a small red
  fruit, that most often shrinks as the child grows older
scope: 'Another name for strawberry haemangioma: a red birthmark made of blood vessels, not a mole and
  not a cancer.'
examples:
- The strawberry hemangioma on his arm faded as he grew older.
- Her strawberry hemangioma was bright red when she was a baby.
