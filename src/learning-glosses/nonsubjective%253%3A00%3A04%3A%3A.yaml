scope: Not bent by feelings or one's own views, but built on things that can be seen and checked, with
  objective as another name for this sense, not a view bent by feelings and not a guess.
examples:
- Her nonsubjective account stuck to what could be seen.
- A nonsubjective test is built on facts, not feelings.
