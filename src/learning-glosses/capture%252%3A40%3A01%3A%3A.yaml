simpleMeaning: to make a very small piece of matter or a body in space move in a new path around something
scope: To make a small piece of matter or a body in space move in a new path around something, not catching
  a person after a chase and not showing an idea or feeling.
examples:
- The star captured a comet and pulled it into a new path around it.
- The centre of the atom captured a slow-moving neutron and held it close.
