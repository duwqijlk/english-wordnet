simpleMeaning: A law-making body in the ruling assembly of Russia and of some other states once in the
  USSR.
scope: A law-making body in the ruling assembly of Russia and of some other states once in the USSR; parliament
  and congress are like this, as law-making bodies, but this word names the body in the Russian and former
  Soviet setting.
examples:
- The Duma passed the new law after a long debate.
- Members of the Duma met in Moscow to vote.
