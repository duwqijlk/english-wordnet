simpleMeaning: a plant that grows under water, with narrow leaves and small flowers, in fresh water or
  water that is a little salty
scope: A water plant with narrow leaves and small flowers; not the girl-like water spirit of lakes and
  rivers in old Greek stories.
examples:
- Naiads grew in the shallow water at the edge of the pond.
- A naiad grew among the stones in the slow, fresh water of the creek.
