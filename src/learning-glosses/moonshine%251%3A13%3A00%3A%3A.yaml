simpleMeaning: whiskey made by heating a mix of crushed corn and water (a corn mash) and cooling the gas
  from it, in a way that breaks the law
scope: Also called bootleg and corn liquor, this is the drink itself, not the act of making a drink in
  a way that breaks the law.
examples:
- He was arrested for selling moonshine made in the woods.
- The police found jars of homemade moonshine in the barn.
