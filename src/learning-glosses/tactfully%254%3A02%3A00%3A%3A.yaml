simpleMeaning: in a way that is careful with other people's feelings and does not upset them
scope: Saying or doing something in a careful way that does not upset people; not in a rude, blunt way
  that hurts feelings.
examples:
- He tactfully changed the subject when she began to look upset.
- She tactfully told him that his shirt did not go with his trousers.
