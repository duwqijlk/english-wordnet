simpleMeaning: A tube of wet skin and muscle about 8.3 metres long from mouth to anus, that takes in food
  and gets rid of waste
scope: 'Also called an alimentary canal, an alimentary tract, a digestive tract, a digestive tube, and
  a gastrointestinal tract: a tube of wet skin and muscle from mouth to anus that takes in food and gets
  rid of waste.'
examples:
- Food moves through the GI tract from mouth to anus.
- The GI tract takes in food and gets rid of waste.
