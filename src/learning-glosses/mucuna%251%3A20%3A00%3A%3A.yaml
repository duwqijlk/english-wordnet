simpleMeaning: One of several woody plants, upright or climbing, in a group of many kinds that spread
  across the hot lands of both halves of the world.
scope: This woody climber or upright plant of the hot lands is one of several kinds in its group.
examples:
- Mucuna grows across the hot lands of both halves of the world.
- Some mucuna plants stand upright while others climb.
