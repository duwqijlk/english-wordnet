simpleMeaning: An electric cold box in which food is kept frozen and stored for long times.
scope: An electric cold box in which food is kept frozen for long times; freezer and deep freezer are
  other names for it, not a fridge and not a pantry.
examples:
- Put the meat in the deep-freeze.
- The deep-freeze keeps food frozen for months.
