simpleMeaning: the kind of word that forms the main telling part of a sentence
scope: This is the kind of word that fills the telling part of a sentence, not a single word that just
  names an action, a thing that happens, or a state of being.
examples:
- In the sentence 'She runs fast', 'runs' is the verb.
- The verb is the telling part of the sentence.
