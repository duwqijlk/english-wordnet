simpleMeaning: Seeds from which new trees grow are held in this hard, scaly case that grows on a tree
  with needle leaves
scope: A hard, scaly case that holds the seeds of a tree with needle leaves, not the leaves of the tree
  and not the fruit of a pine.
examples:
- Fir cones lay on the ground under the trees.
- She picked up a fir cone to look at its scales.
