simpleMeaning: In philosophy, the thinking of Aristotle about the study of nature, the running of states,
  poetry, right and wrong, the nature of being, and logic.
scope: It is Aristotle's philosophy in its widest reach, taking in logic, the nature of being, right and
  wrong, poetry, the running of states, and the study of nature.
examples:
- She studied peripateticism and its account of logic and ethics.
- Peripateticism takes in poetry, politics and the study of nature.
