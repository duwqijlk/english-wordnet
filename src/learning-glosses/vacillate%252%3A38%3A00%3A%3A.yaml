simpleMeaning: to move up and down again and again, in a way like waves
scope: This sense is about moving up and down like waves; waver and fluctuate are other names for this
  sense, not the sense about being unable to decide between choices.
examples:
- The line on the screen vacillated up and down.
- The needle vacillated as the signal rose and fell.
