simpleMeaning: In sewing, a join made by folding cloth edges under and stitching them so no rough edge
  shows
scope: In sewing, a join made by folding cloth edges under and stitching them so no rough edge shows,
  also called a fell; not a plain stitched join and not a fold left unstitched.
examples:
- The felled seam lay flat on the shirt.
- She finished the trousers with a felled seam.
