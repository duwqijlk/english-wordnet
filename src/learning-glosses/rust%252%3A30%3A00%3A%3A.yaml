simpleMeaning: to be destroyed by water or air, or by a thing that can harm other things and wear them
  away, such as an acid
scope: This verb sense is about a thing being destroyed in this way, not the brown layer that forms on
  metal and not a plant disease with the same name.
examples:
- The old iron pipes rusted after years in the rain.
- The metal gate will rust if it is left out in wet air.
