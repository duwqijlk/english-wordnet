simpleMeaning: Dogs and cattle fall sick from one of a group of germs that carry DNA inside a twenty-sided
  protein shell, with no known link to sickness in people.
scope: It is also called parvo, and it is one of a group of germs that make dogs and cattle sick, with
  no known link to sickness in people.
examples:
- The parvovirus made the dog sick.
- The cattle caught parvovirus and fell sick.
