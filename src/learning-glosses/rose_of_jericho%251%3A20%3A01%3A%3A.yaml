simpleMeaning: A small grey desert plant of Asia with tiny white flowers that curls up when dry and opens
  out when wet.
scope: Also called a resurrection plant and Anastatica hierochuntica; a small desert plant that curls
  up when dry, not the fern-like plant of the same name from the south-west of the United States.
examples:
- The rose of Jericho curls up when dry.
- When wet, the rose of Jericho opens out again.
