simpleMeaning: A sudden sore swelling of the tongue after hurt or infection, with pain.
scope: A sudden swelling of the tongue after hurt or infection, not a long-lasting tongue swelling and
  not a mouth sore elsewhere.
examples:
- Acute glossitis made her tongue swell and hurt when she ate.
- After the burn, acute glossitis set in within a day.
