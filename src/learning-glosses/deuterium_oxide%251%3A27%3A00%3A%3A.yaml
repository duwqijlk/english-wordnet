simpleMeaning: Water in which much of the hydrogen is a heavy form of it, used in machines where atoms
  are split
scope: Heavy water used where atoms are split, not plain water; heavy water is another name for this sense.
examples:
- Deuterium oxide cools the reactor in the plant.
- The plant uses deuterium oxide in its reactor.
