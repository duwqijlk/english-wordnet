simpleMeaning: a rough, uneven edge on paper, left by the frame used to make it by hand, or made on purpose
  on paper made by a machine
scope: This is the rough edge of a sheet of paper, also called a deckle edge; not a smooth cut edge and
  not the frame used to make the paper.
examples:
- The book's deckle looked rough and uneven along the top.
- She chose paper with a deckle for the wedding invitations.
