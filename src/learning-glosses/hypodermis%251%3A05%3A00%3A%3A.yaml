senseId: 'hypodermis%1:05:00::'
synsetId: 01898491-n
simpleMeaning: Under the hard skin of jointed animals such as insects and crabs, this sheet of cells gives
  off that hard skin.
scope: This sheet of cells gives off the hard outer covering of jointed animals, and it is not that covering
  itself.
examples:
- The hypodermis gives off the hard outer covering of the crab.
- The hypodermis in an insect makes the hard covering over its body.
