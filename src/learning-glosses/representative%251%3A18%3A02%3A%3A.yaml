simpleMeaning: someone who argues for another person or group, pushing their plans and aims
scope: 'Also called a voice: someone who argues for another person or group, pushing their plans and aims,
  not a person chosen to speak for a group in general and not a member of the United States Congress.'
examples:
- The representative of the firm spoke for its plans at the meeting.
- A representative from each union argued for the workers' aims.
