simpleMeaning: A brightly coloured duck from North America that makes its nest in hollow trees
scope: A bright North American duck that nests in hollow trees; summer duck and wood duck are other names
  for this sense, not a duck that nests on open ground.
examples:
- A wood widgeon landed on the pond near the hollow oak.
- The wood widgeon nests in a hollow tree, not on the ground.
