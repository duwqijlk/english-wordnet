simpleMeaning: a chemical built by starting from ammonia and swapping some hydrogen atoms for carbon-and-hydrogen
  groups that bond at a single point
scope: Also called amine; a chemical built from ammonia, not ammonia itself and not a salt.
examples:
- An aminoalkane forms when hydrogen in ammonia is swapped for a carbon group.
- The aminoalkane in the bottle came from ammonia.
