simpleMeaning: in a way that shows someone is thinking deeply about something
scope: This is doing or saying something while thinking deeply about it; it is not doing it quickly and
  without thinking.
examples:
- She looked out of the window and spoke musingly about the past.
- He nodded musingly as he thought about her words.
