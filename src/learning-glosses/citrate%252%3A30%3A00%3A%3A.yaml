simpleMeaning: To change a thing by joining it with citric acid, so it becomes a salt or a salt-like substance.
scope: To make a thing form a salt or ester of citric acid, not the salt or ester itself.
examples:
- The chemist citrated the mixture to keep it stable.
- They citrate the solution before testing it.
