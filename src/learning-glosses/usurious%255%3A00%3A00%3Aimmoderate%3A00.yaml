senseId: usurious%5:00:00:immoderate:00
synsetId: 01538377-s
simpleMeaning: Wildly beyond the bounds of reason or fair measure.
scope: This sense is also called steep, outrageous, exorbitant, unconscionable, and extortionate, for
  what is wildly beyond the bounds of reason or fair measure, where steep is far too great, past what
  is fair or right, and outrageous is far beyond what is fair or right, much too great.
examples:
- The rate was usurious, far beyond reason.
- Usurious charges burdened the poor.
