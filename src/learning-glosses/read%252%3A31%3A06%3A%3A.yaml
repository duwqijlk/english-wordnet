simpleMeaning: For a computer or device to get information stored on a magnetic tape or another digital
  source.
scope: This is not interpreting a person’s behavior or a written message, and not a gauge showing a value;
  it is obtaining stored digital data.
examples:
- The drive cannot read the damaged disc.
- The software reads data from a memory card.
