simpleMeaning: A bed cover, usually with stretchy edges, made to fit one mattress closely.
scope: Also called fitted sheet; a bed cover made to fit one mattress closely, not a flat bed cover and
  not a blanket.
examples:
- The contour sheet hugged the corners of the mattress.
- She bought a contour sheet for the new bed.
