simpleMeaning: The form of a word that tells how much of a quality or how something is done, showing more
  of it, as in 'faster' for 'fast'
scope: The form 'faster' takes, not a word that judges by setting things side by side and not a word about
  the study of likeness.
examples:
- In 'faster', the comparative shows that one thing moves at a greater speed.
- She explained that 'more surely' is the comparative of the adverb 'surely'.
