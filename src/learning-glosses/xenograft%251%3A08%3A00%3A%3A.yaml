simpleMeaning: living flesh from an animal of one kind, put for a short time on a person or animal of
  another kind, as with bad burns
scope: This is living flesh from an animal of one kind put for a short time on a person or animal of another
  kind, also called heterograft; not a lasting piece of flesh, and not the operation that moves flesh
  or whole organs from one kind to another.
examples:
- Doctors used a xenograft to cover the burns for a few days.
- The xenograft came from a pig and was placed on the patient's arm.
