simpleMeaning: A person who holds that no teaching about right and wrong, or about God, is true.
scope: A person who rejects all teachings about right and wrong or about God.
examples:
- The nihilist said no rule of right and wrong could be proved.
- As a nihilist, they trusted no church and no code of morals.
