simpleMeaning: A tough evergreen bush of wet acid ground, from the Arctic and Canada to the north-eastern
  United States, whose wiry stems carry hanging bunches of white or pink flowers.
scope: Another name for bog rosemary, the wet-ground evergreen; not the culinary herb rosemary.
examples:
- Moorwort grows in wet, acid ground from the Arctic to the north-eastern United States.
- A patch of moorwort turned the bog pink in June.
