simpleMeaning: Like people with no schooling who throw nuts at the stage when a show displeases them,
  these are people whose complaints count for nothing.
scope: People whose complaints count for nothing, not the cheap seats high up at the back of a hall.
examples:
- He ignored complaints from the peanut gallery.
- The critics in the peanut gallery called the show a flop, and no one listened.
