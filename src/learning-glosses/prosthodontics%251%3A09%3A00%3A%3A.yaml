simpleMeaning: Tooth doctors fit false teeth and other made parts where teeth and nearby mouth and jaw
  parts are lost; that fitting work is this branch.
scope: 'Also called prosthodontia: the branch of tooth care that puts in false teeth and other made parts
  where teeth and nearby mouth and jaw parts are lost.'
examples:
- He chose prosthodontics because he liked fitting false teeth.
- Prosthodontics covers made parts that take the place of teeth and jaw parts.
