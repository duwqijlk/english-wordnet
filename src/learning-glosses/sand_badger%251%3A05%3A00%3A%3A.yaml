simpleMeaning: an animal from southeast Asia with a nose like a pig's
scope: An animal from southeast Asia with a pig-like nose; also called a hog-nosed badger and a hog badger.
  Not a common badger and not a pig.
examples:
- The sand badger sniffed the ground with its long, pig-like snout.
- We saw a sand badger rooting in the sand with its pig-like nose.
