simpleMeaning: A style of building common in Spain from the 13th to the 16th centuries, marked by arches
  shaped like a horseshoe.
scope: This is a style of building, not the word for Moorish peoples themselves; also called Moorish architecture.
examples:
- Moorish arches are shaped like a horseshoe.
- The old hall was built in the Moorish style.
