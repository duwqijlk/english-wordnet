simpleMeaning: To bring sleep and stop fits, this barbiturate comes as a salt of sodium, sold as Seconal,
  a white powder with no smell and a slightly bitter taste.
scope: Also called red devil and secobarbital sodium, this white powder drug brings sleep and stops fits.
examples:
- The doctor gave him secobarbital to bring sleep.
- Secobarbital stopped his fits when given as its sodium salt.
