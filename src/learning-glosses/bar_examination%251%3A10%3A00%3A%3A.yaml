simpleMeaning: Whether a person is fit to work as a lawyer in one place is settled by this test, held
  at set times.
scope: This test for would-be lawyers is also called the bar exam.
examples:
- Candidates for the bar examination must show they are fit to work as lawyers.
- Many students take the bar examination soon after law school.
