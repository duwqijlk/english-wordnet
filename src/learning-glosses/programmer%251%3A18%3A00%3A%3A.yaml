simpleMeaning: a person whose job is to plan, write, and check the sets of instructions that make a computer
  work
scope: This is a person who makes the instructions a computer follows, not a person who only uses a computer
  or fixes its parts.
examples:
- The programmer found and fixed a mistake in the bank's new app.
- As a programmer, he writes the instructions that run the shop's website.
