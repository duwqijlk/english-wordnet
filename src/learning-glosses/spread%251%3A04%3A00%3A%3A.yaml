simpleMeaning: The act of something growing outward so that it covers a larger area or goes on for a longer
  time.
scope: This is the act of something growing wider or lasting longer, not the overall process or result
  of distributing things across a wide area, not a random scattering of objects, and not the weight a
  person gains around the middle.
examples:
- The spread of the disease through the region took only weeks.
- Historians studied the spread of the religion across the continent.
