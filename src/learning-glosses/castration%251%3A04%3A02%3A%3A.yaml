simpleMeaning: the act of cutting out parts of a book or other writing that people think are bad or wrong
scope: Cutting bad parts out of a book or other writing; not taking out parts of a male animal's body
  and not an operation on a person.
examples:
- The castration of the book removed all the rude scenes.
- Castration of the play cut out lines the town did not like.
