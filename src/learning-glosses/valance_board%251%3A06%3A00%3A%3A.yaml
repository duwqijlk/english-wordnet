simpleMeaning: A pretty frame that hides the fittings at the top of a window where the curtains hang.
scope: 'Also called cornice, pelmet and valance: a pretty frame that hides the fittings at the top of
  a window, not the curtain itself and not a shelf.'
examples:
- A valance board hid the curtain rail at the top of the window.
- He fitted a valance board above the window.
