senseId: infective%5:00:00:septic:00
synsetId: 02122026-s
simpleMeaning: A thing that can pass on a sickness caught from germs, or that comes from one itself
scope: This is about a thing or a person that carries a sickness caught from germs; infectious is another
  name for this sense, and it is not the sickness itself or a thing that is only unclean.
examples:
- Viruses and other infective agents spread the sickness.
- A carrier remains infective without showing signs of the disease.
