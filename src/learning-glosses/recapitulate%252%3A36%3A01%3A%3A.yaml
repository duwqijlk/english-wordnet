senseId: 'recapitulate%2:36:01::'
synsetId: 01739025-v
simpleMeaning: To go through again, before birth, the steps of change by which a kind of living thing
  came to be as it is.
scope: To go through again, before birth, the steps of change in a kind of living thing; not to play an
  earlier theme again in a piece of music.
examples:
- The embryo was said to recapitulate the steps of its kind's long history.
- In the womb, the young animal recapitulates stages its kind passed through long ago.
