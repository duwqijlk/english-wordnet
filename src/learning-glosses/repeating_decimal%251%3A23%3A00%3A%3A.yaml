simpleMeaning: a number after the point with a set of figures that goes on and on in the same order
scope: 'Also called a circulating decimal and a recurring decimal: a number after the point whose figures
  go on in the same order, not a number that ends and not a whole number.'
examples:
- One third is a repeating decimal, with the figure 3 going on for ever.
- She wrote out the repeating decimal and put a bar over the part that repeats.
