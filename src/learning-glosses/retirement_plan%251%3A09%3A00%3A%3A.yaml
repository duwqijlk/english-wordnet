simpleMeaning: A scheme for putting money by while a person still works, to use once work has ended for
  good.
scope: This is a scheme for putting money by while a person still works, not a monthly sum paid out after
  work ends; it is also called retirement account, retirement program, retirement savings account, and
  retirement savings plan.
examples:
- He pays into a retirement plan each month.
- Her retirement plan will give her money when she stops working.
