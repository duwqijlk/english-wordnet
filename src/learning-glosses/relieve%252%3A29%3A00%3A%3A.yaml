simpleMeaning: to make pain or another bad feeling in the body less, or to stop it
scope: This is about making pain in the body less, not about calming a strong feeling in the mind and
  not about saving someone from harm.
examples:
- This pill will relieve your headaches.
- A cold cloth relieved the pain in his swollen ankle.
