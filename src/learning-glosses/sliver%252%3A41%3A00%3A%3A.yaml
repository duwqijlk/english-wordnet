simpleMeaning: to cut or split a thing into thin pieces
scope: To cut or split a thing into thin pieces, also called splinter; not a thin piece itself, and not
  a thing breaking up on its own.
examples:
- He slivered the soft wood with a sharp knife.
- She slivered the soap into thin shavings for the wash.
