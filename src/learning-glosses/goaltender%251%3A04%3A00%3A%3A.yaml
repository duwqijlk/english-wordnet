simpleMeaning: Standing in front of the net, this player on an ice hockey, soccer or lacrosse team tries
  to stop the other side from scoring.
scope: The player who guards the net on an ice hockey, soccer or lacrosse team is also called a goalie,
  a goalkeeper or a netkeeper.
examples:
- The goaltender stopped the shot and kept the net clear.
- Our goaltender guards the net through the whole game.
