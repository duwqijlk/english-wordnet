simpleMeaning: A small offshoot of a branch, chiefly its end part, and usually a branch that grew this
  year or last year.
scope: A small offshoot of a branch, not a whole branch and not a leaf; twig and sprig are other names
  for this sense.
examples:
- The gardener cut the branchlet back to the main stem.
- New branchlets grew along the old branch after the spring rain.
