simpleMeaning: to stop living because the body can no longer carry out the work that kept the person alive
scope: 'Also called die, go, pass, choke, exit, croak, perish, and expire: to leave life behind, not merely
  to fall asleep or to faint.'
examples:
- The old man deceased peacefully in his sleep.
- Many decease each year from illnesses that could have been treated.
