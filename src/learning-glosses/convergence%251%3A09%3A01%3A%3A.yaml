simpleMeaning: something that shows what theories or things that people can see in the world have in common
scope: This shows what theories or things people can see in the world have in common; intersection and
  overlap are other names for this sense. Not things moving closer together in space.
examples:
- The convergence of the two theories shows that both explain learning in much the same way.
- There is a clear convergence between their ideas, because both stress practice and time.
