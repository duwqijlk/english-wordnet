senseId: 'fibrinolysis%1:22:00::'
synsetId: 13501379-n
simpleMeaning: A normal process that goes on all the time, breaking down the tough threads of a clot and
  so clearing away small blood clots.
scope: A normal process that goes on all the time, breaking down the tough threads of a clot and so clearing
  away small blood clots; not the forming of a clot and not a drug that breaks clots down.
examples:
- Fibrinolysis clears small clots from the blood.
- Drugs can speed up fibrinolysis after a heart attack.
