simpleMeaning: to let something wrong pass without blame, and to be kind and not strict with the person
scope: 'Also called excuse: to let wrong acts pass without blame, not to say that the wrong acts were
  right.'
examples:
- She condoned his late work and did not punish him for it.
- The boss condoned the small mistake and told the worker to carry on.
