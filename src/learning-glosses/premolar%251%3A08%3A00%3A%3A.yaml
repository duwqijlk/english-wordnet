simpleMeaning: A tooth with two points that sits between the front teeth and the back teeth.
scope: 'Another name for a bicuspid: a tooth with two points that sits between the front teeth and the
  back teeth; not a front tooth and not a back tooth.'
examples:
- The dentist found a crack in her premolar.
- A premolar sits between the front teeth and the back teeth.
