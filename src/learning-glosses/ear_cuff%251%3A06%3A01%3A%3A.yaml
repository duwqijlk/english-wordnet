simpleMeaning: An earring that needs no pierced hole, made in many sizes as a small wrap or hook that
  hangs over the whole ear and dangles from the rim.
scope: This is a piece of ear jewellery that needs no piercing and sits over the rim of the ear. It is
  not a stud or hoop that passes through a hole. 'Ear hook earring', 'ear wrap' and 'earcuff' are other
  names for the same item; the term is current, not dated or technical.
examples:
- She added a silver ear cuff to finish her outfit.
- He wore an ear cuff on one ear and a plain stud on the other.
