simpleMeaning: Of, or to do with, or in the land south of the Sahara Desert.
scope: This means the land south of the Sahara Desert, not the desert itself or the land north of it.
examples:
- Sub-Saharan Africa lies south of the great desert.
- Many peoples live in sub-Saharan lands.
