simpleMeaning: A tame kind of goat kept for its long, soft, shiny hair, which is true mohair.
scope: A tame kind of goat kept for its long soft hair, also called an Angora goat; not the rabbit or
  cat of the same name and not a wild goat.
examples:
- Angora goats give fine mohair.
- She keeps an Angora for its hair.
