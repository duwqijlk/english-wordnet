simpleMeaning: This measure of data is two to the power of sixty bits, or one thousand twenty-four pebibits,
  each a very large unit of data
scope: 'Also called exbibit: a very large measure of data counted in bits, not the byte unit EiB and not
  a smaller measure of data.'
examples:
- One Eibit is two to the power of sixty bits of data.
- The line can move one Eibit of data.
