simpleMeaning: Of or relating to the view that true knowledge comes only from things seen and tested
scope: This is about the view that true knowledge comes only from things seen and tested; positive and
  positivistic are other names for this sense, not a view based on faith, and not the person who holds
  the view.
examples:
- The positivist thinkers trusted only what could be tested.
- She followed a positivist doctrine in her work.
