synsetId: 03240263-n
simpleMeaning: a cord that goes through a seam (the folded edge that makes a small tunnel) around an opening,
  pulled to close it
scope: A cord you pull to close an opening in a bag or in clothes, not a cord on an instrument or racket
  and not a group of things in a line.
examples:
- He pulled the string in the top of the bag and closed it tight.
- The string around the opening of her hood kept the cold air out.
