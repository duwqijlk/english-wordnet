simpleMeaning: To make something shorter while keeping its essential parts.
scope: This is the verb sense for shortening a text or plan while keeping its main content, not the noun
  for a binding agreement, not the noun for the winning bid in bridge, not the noun for the bridge variety,
  not the verb sense for entering a legal agreement, not the verb sense for hiring someone by written
  agreement, not the verb sense for catching an illness, not the verb sense for squeezing or pressing
  together, not the verb sense for becoming smaller, not the verb sense for causing something to shrink,
  not the verb sense for compressing or concentrating, and not the verb sense for making something narrower
  or more restricted.
examples:
- The publisher asked him to contract the manuscript to half its length.
- She contracted the long report into a one-page summary.
