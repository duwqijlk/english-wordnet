synsetId: 01617863-s
simpleMeaning: A thing that handles dates and times right, even as the years move from the 1900s into
  the 2000s
scope: This is about a thing ready to handle dates and times right across the change of century, not a
  thing that only works in one century.
examples:
- The bank checked that its system was Y2K compliant before 2000.
- Our old software is not Y2K compliant, so it may fail on dates after 1999.
