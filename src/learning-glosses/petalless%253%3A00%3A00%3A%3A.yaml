synsetId: 01781077-a
simpleMeaning: Of a flower, having no soft coloured parts around its centre.
scope: Of a flower, this means it has no soft coloured parts; it is not a flower that has them, and not
  a bare stem with no flower at all.
examples:
- The petalless flower looked plain beside the roses.
- Some grasses have petalless flowers that few people notice.
