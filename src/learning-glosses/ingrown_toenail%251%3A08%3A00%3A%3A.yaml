simpleMeaning: A nail on a toe whose free end or sides have grown into the soft flesh around it.
scope: A nail on a toe whose free end or sides have grown into the soft flesh around it, also called onyxis;
  not a nail that has come off and not a sore on the toe.
examples:
- His ingrown toenail made walking hurt.
- The doctor cut back the ingrown toenail.
