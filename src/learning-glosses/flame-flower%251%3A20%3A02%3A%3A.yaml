simpleMeaning: Long thin leaves like grass and tall stems of red or yellow blooms that hang down mark
  this plant of the group Kniphofia.
scope: Also called a flame flower, a flameflower, kniphofia, or tritoma, this plant is marked by long
  thin leaves like grass and tall stems of red or yellow blooms that hang down.
examples:
- The flame-flower by the pond had tall stems of red blooms.
- She grew flame-flowers for their long grass-like leaves.
