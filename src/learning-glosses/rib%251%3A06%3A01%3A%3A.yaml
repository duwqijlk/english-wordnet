simpleMeaning: a raised band that sticks out under a curved roof or ceiling and can be there to look good
  or to hold the roof up
scope: A raised band under a curved roof, not a bone in the chest and not the act of making raised lines
  by knitting.
examples:
- The old church has a rib running along the stone ceiling.
- Painters worked on the ribs of the vaulted roof.
