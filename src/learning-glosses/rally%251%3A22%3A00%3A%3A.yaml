simpleMeaning: a clear getting better in strength or in how you feel while you are ill
scope: Getting stronger or in better spirits while ill; not a run of hits in a sport and not a large meeting
  of people.
examples:
- After days of fever, the patient had a rally and sat up to eat.
- Her rally did not last, and by night she was weak again.
