simpleMeaning: to climb something in an awkward way, using the hands and feet to pull oneself along.
scope: This is not the noun for the outer covering of a body, and not the act of removing it; it means
  to climb clumsily.
examples:
- The boys skinned up the tree to reach the apples.
- She skinned over the wall and dropped into the yard.
