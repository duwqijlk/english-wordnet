simpleMeaning: The highest ruling body in old Athens, which later became a court of law
scope: In ancient Athens, the highest body of government, which in later times acted as a court of law,
  and so stood above the city's other assemblies and courts.
examples:
- The Areopagus was the highest assembly in ancient Athens.
- Later the Areopagus acted as a court of law in Athens.
