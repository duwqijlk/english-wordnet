simpleMeaning: an amount of something that is carried from one place to another or worked on, all at one
  time
scope: An amount carried or worked on at one time, not a device that uses electrical power and not an
  amount of alcohol that makes a person drunk.
examples:
- The truck carried a full load of bricks.
- This washing machine can wash a large load at once.
