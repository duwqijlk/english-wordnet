simpleMeaning: Doing a task well, by using what you know, not just by knowing it.
scope: Doing a task well, by using what you know, not just by knowing it, also called performance, execution
  or carrying out; not doing a task badly, and not knowing a task without doing it.
examples:
- Her carrying into action of what she had learned went well.
- They praised her carrying into action of all she had learned.
