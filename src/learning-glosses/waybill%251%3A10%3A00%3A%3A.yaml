simpleMeaning: The carrier gives the sender this note when goods are shipped, saying the goods have been
  taken in and stating the terms of delivery.
scope: Also called bill of lading, it is the note a carrier gives a sender for goods taken in.
examples:
- The waybill said the goods had been received.
- She kept the waybill until the goods were delivered.
