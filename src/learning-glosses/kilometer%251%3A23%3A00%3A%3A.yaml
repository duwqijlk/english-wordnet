simpleMeaning: a unit of length in the metric system, equal to 1,000 metres, or about six tenths of a
  mile
scope: A metric unit of length, 1,000 metres, also called a kilometre; not a mile and not a metre.
examples:
- The town is five kilometers away.
- She ran ten kilometers in the race.
