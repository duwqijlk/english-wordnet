simpleMeaning: 'A tool for measuring sound: a light disc hung from a quartz thread; when a moving sound
  wave hits it, the twist it makes shows the speed of the sound.'
scope: A tool that measures sound, not a microphone and not a meter that shows loudness; it hangs a light
  disc from a quartz thread.
examples:
- The Rayleigh disk hung still until the sound wave passed.
- They used a Rayleigh disk to measure the speed of the wave.
