simpleMeaning: a long narrow cut in the surface of a record that the needle follows as the record plays
scope: This is the cut line in a record's surface, not a railway line, a path, a song on an album, a running
  event, or the metal belt of a heavy vehicle.
examples:
- The needle jumped out of the track and the music stopped.
- Dust had settled in the grooves of the old vinyl record.
