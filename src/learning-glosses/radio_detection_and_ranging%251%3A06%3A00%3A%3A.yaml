simpleMeaning: a measuring tool for finding far-away objects; it sends a pulse of microwave radiation
  and listens for the echo
scope: Also called radar, microwave radar, and radiolocation; a tool that finds distant objects by their
  echo, not a plain radio that only sends or takes in sound.
examples:
- The ship's radio detection and ranging set picked up the storm ahead.
- Radio detection and ranging helped the crew spot the plane in the dark.
