simpleMeaning: A medium-sized food fish like a tuna, of warm Atlantic and Pacific waters, less prized
  than tuna.
scope: Also called skipjack and Atlantic bonito; a medium-sized food fish of warm seas, less prized than
  tuna, not a true tuna and not a fresh-water fish.
examples:
- The Sarda sarda is a food fish of warm Atlantic waters.
- Sarda sarda is less prized than tuna.
