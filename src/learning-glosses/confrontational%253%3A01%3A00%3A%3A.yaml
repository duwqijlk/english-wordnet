simpleMeaning: about arguing in a direct and strong way, or speaking strongly against someone
scope: About arguing or speaking against someone in a direct, strong way. It is not a friendly or calm
  way of talking and working together.
examples:
- His confrontational manner made the meeting turn into an argument.
- She took a confrontational approach and argued with her boss face to face.
