simpleMeaning: the people, committees or departments that together form a group whose job is to run or
  manage something
scope: The people who run something, also called organization, administration, establishment and governance;
  not the metal, not a musical instrument, and not the group of instrument players in a band.
examples:
- The brass met to decide the new rules for the school.
- Company brass approved the plan after a long meeting.
