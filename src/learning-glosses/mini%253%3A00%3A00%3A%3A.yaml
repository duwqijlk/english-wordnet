simpleMeaning: of a woman's dress or skirt, very short, with the bottom edge above the knee
scope: A very short piece of women's clothing, with the hem above the knee, not a small size in general
  and not a short coat.
examples:
- She wore a mini dress to the party.
- The mini skirt ended well above her knees.
