simpleMeaning: to show something off with pride, or to act in a showy, self-important way to try to make
  others take notice
scope: Also called flash and swank. This means showing off with pride, not simply showing a thing, and
  not breaking a rule on purpose.
examples:
- He flaunted his new sports car by driving slowly past his friends.
- She flaunted her gold watch, holding her arm up so everyone could see it.
