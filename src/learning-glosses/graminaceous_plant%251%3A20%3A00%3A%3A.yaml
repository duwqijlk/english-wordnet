simpleMeaning: These plants are found in every land, with hollow jointed stems, long narrow leaves, and
  a build that is green and soft or woody.
scope: Also called a gramineous plant, this names the wide-spread kind with hollow jointed stems and long
  narrow leaves.
examples:
- The graminaceous plant in the field had hollow jointed stems.
- Grasses are graminaceous plants with long narrow leaves.
