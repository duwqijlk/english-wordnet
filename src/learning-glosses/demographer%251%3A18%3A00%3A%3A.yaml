senseId: 'demographer%1:18:00::'
synsetId: 10021919-n
simpleMeaning: a scientist who studies how groups of people grow, how close together they live, and their
  life numbers, such as births, deaths and marriages
scope: This person studies how groups of people change, also called a demographist, not a person who only
  counts people once.
examples:
- A demographer studied why the town grew so fast.
- The demographer used numbers about births and deaths to study the city.
