simpleMeaning: a device with a ridged surface that clothes are rubbed against to clean them
scope: This is the board used to scrub clothes clean; not the broad plank along the side of a boat that
  keeps water from splashing in.
examples:
- She rubbed the dirty shirts against the washboard to get them clean.
- Before washing machines were common, people used a washboard to scrub their clothes.
