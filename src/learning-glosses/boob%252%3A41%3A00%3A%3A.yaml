simpleMeaning: to do something rude in company, to do something wrong, or to make a big mistake
scope: This verb, also called sin, blunder, and goof, means making a big mistake or doing something rude
  in company; it is not the noun for a woman's breast.
examples:
- He boobed during the job interview and gave the wrong answer.
- She boobed by calling her teacher by the wrong name in class.
