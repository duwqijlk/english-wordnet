simpleMeaning: A formal complaint used to keep a particular person from serving on a jury.
scope: A legal objection in court to a person chosen for jury service; not a sentry's demand for a password,
  a question demanding an explanation, or a general objection raised in court.
examples:
- The defense lawyer used a challenge to remove the juror.
- Each side may make only a limited number of challenges to proposed jurors.
