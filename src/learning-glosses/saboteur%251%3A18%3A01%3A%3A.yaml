simpleMeaning: a person in a secret group that works against its own government, who tries to help an
  enemy that may come to attack the country
scope: A member of a secret group who tries to help a coming enemy, not just any person who damages things
  on purpose to stop work.
examples:
- The saboteur sent town plans to the enemy waiting across the border.
- Police caught a saboteur who had joined a secret group to help the invaders.
