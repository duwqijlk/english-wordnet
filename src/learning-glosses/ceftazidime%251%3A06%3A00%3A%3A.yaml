simpleMeaning: a germ-killing drug of the kind called cephalosporin, given by needle, sold as Fortaz and
  Tazicef, used to treat medium-level infections
scope: A germ-killing drug given by needle for medium-level infections, not a pill and not a drug for
  mild infections.
examples:
- The doctor gave her ceftazidime for the infection.
- Ceftazidime is sold under the names Fortaz and Tazicef.
