simpleMeaning: A white powder (LiCO3) used to make glass and ceramics and, as a drug, to treat some kinds
  of depression and the high moods of manic-depressive disorder.
scope: A white powder used as a drug for low and high moods; also called lithium carbonate, Eskalith,
  and Lithonate.
examples:
- Lithane steadied her moods over the winter.
- The doctor prescribed Lithane for his depression.
