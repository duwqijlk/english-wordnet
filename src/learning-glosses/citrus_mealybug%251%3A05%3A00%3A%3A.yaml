scope: A bug that eats many kinds of farmed plants but does most harm to trees that bear oranges, lemons,
  and fruit like them; not a bug that eats only one kind of plant and not a bug that harms farm animals.
examples:
- The citrus mealybug fed on the leaves of the young trees.
- Farmers watch for the citrus mealybug because it can harm their fruit trees.
