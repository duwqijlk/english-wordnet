simpleMeaning: a hot drink made by heating port wine (a strong sweet red wine) with oranges and cloves
  (a spice with a strong taste)
scope: A hot wine drink; not the bishop piece in chess that moves across the board, and not a church leader.
examples:
- We drank warm bishop at the winter party.
- She made bishop with oranges and cloves for her guests.
