simpleMeaning: a swelling of the stomach or gut of an animal kept by people, caused by too much gas
scope: Not the act of swelling up and not making something swell; this is the swollen state itself in
  an animal's gut.
examples:
- The vet treated the cow for bloat after it ate too much clover.
- Bloat can kill a sheep if the gas is not let out.
