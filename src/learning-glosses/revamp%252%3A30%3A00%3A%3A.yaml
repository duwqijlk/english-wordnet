simpleMeaning: to fix a thing up, mend it, and make it work or look as good as before
scope: Fixing up and mending a thing to make it good again, not building a new thing and not only cleaning
  it.
examples:
- They revamped their old house before selling it.
- She revamped the old dress and wore it again.
