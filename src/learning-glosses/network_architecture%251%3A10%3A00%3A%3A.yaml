simpleMeaning: A set of design rules, covering data forms and steps, for building a linked set of data
  machines.
scope: A set of design rules for building a linked set of data machines, not one machine alone and not
  a set of wires.
examples:
- The firm set out its network architecture before building the system.
- A good network architecture keeps the data machines working as one set.
