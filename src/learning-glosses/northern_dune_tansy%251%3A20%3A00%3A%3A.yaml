senseId: 'northern_dune_tansy%1:20:00::'
synsetId: 12043290-n
simpleMeaning: A faintly hairy perennial spreading by underground stems, with fragrant feathery leaves
  and loose clusters of small round yellow flowers on shifting sand of the North American Pacific coast.
scope: This is the low, spreading seaside perennial with feathery scented leaves and button-like yellow
  heads that grows on Pacific coastal sand, not the taller common tansy of roadsides, and not other dune
  grasses.
examples:
- Northern dune tansy holds the loose sand together with its spreading roots.
- The yellow buttons of northern dune tansy were scattered along the coastal path.
