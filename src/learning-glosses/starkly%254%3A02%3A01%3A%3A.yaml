senseId: 'starkly%4:02:01::'
synsetId: 00467557-r
simpleMeaning: in a way that makes a thing's outer line stand out clearly, or makes the difference between
  things stand out clearly
scope: About a shape or a difference standing out clearly; not the wider use for doing a thing in a plain,
  bare way.
examples:
- The dark tree stood starkly against the white field.
- Red letters showed starkly on the black sign.
