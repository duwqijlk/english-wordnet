simpleMeaning: an Asian tree with leaves all year round and sweet-smelling greenish-yellow flowers that
  give an oil that turns to vapour, grown widely in hot lands for show
scope: 'Also called ylang-ylang: a tree grown for show, not the scented oil taken from its flowers.'
examples:
- The ilang-ilang in the garden was full of sweet-smelling yellow flowers.
- Workers pick ilang-ilang flowers to make the scented oil.
