simpleMeaning: the join between the two halves of the bone at the front of the skull, usually gone by
  the age of 6
scope: This is the join between the two halves of the front skull bone, also called frontal suture; not
  a break in the skull and not a join between other skull bones.
examples:
- The sutura frontalis joins the two halves of the frontal bone in a young child.
- By the age of six, the sutura frontalis has usually closed.
