simpleMeaning: to take everything out of a place, or take away all that someone has, so that it is left
  empty
scope: 'Also called clean: taking everything out of a place or taking away all someone has; not stealing
  goods, and not taking the dry leaves off a plant.'
examples:
- The storm stripped the trees of all their apples.
- Hungry boys stripped the plates of food in minutes.
