simpleMeaning: to grow fast, step by step, starting from a wide base and getting bigger as it goes
scope: To grow fast step by step from a wide base; not the solid shape with a square base and a point
  at the top, and not buying more shares with gains from shares already held.
examples:
- Starting from a wide base of small buyers, sales pyramided week by week.
- The debt pyramided fast as new costs were added at each step.
