simpleMeaning: in the form of a short story about a real thing that happened
scope: This describes writing or a report that is like one short real story. It is not the sense about
  a person who often tells such stories.
examples:
- Her report was anecdotal and told one short, real story about a patient.
- He wrote an anecdotal account of a strange day at sea.
