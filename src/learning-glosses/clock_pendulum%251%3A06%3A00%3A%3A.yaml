simpleMeaning: a swinging weight that keeps a timepiece running at a steady speed
scope: A swinging weight that sets the pace of a timepiece, not a weight that hangs still and not the
  hands of a timepiece.
examples:
- The clock pendulum swung back and forth behind the glass door.
- He oiled the clock pendulum so the old timepiece would keep good time.
