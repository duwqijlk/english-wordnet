simpleMeaning: an enzyme, a kind of cell tool, in cells with a nucleus that adds telomeres, the end caps
  of chromosomes, to chromosome ends after they split
scope: An enzyme in cells with a nucleus that adds telomeres to chromosome ends after they split, not
  an enzyme that cuts chromosomes and not a part of the chromosome itself.
examples:
- Telomerase adds telomeres to the ends of chromosomes after they divide.
- The lab studies how telomerase adds telomeres to chromosome ends.
