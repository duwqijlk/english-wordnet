senseId: 'law_of_independent_assortment%1:09:00::'
synsetId: 05893591-n
simpleMeaning: each one of a pair of matching threads in the cell parts from its pair on its own, apart
  from the other pairs, so the outcome is left to chance
scope: A rule about how matching chromosomes split apart, not a rule about how traits pass from parent
  to child in general and not a rule about cells splitting in two.
examples:
- The law of independent assortment says each chromosome pair splits off on its own.
- By the law of independent assortment, the results of a cross are left to chance.
