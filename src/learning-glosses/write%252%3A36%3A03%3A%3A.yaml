simpleMeaning: set down or say aloud the letters that make up the usual accepted spelling of a word or
  part of a word
scope: This is about getting the letters of a word right, not about covering a surface with marks or composing
  a whole text.
examples:
- She can write her name now, but she still mixes up b and d.
- How do you write your surname — with one n or two?
