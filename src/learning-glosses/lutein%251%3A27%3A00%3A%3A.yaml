simpleMeaning: The yellow stuff that gives colour to plants, to the fat of animals and to the yolks of
  eggs.
scope: The yellow stuff that gives colour to plants, to animal fat and to egg yolks; not the yellow of
  a flower's petals alone and not a dye made by people.
examples:
- Lutein gives egg yolks their deep yellow colour.
- Green leaves hold lutein as well as green colouring.
