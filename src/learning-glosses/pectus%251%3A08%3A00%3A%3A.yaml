simpleMeaning: The front of the body between the neck and the sheet of muscle under the lungs, or the
  same part in other animals with backbones
scope: 'Also called the chest or the thorax: the front of the body between the neck and the sheet of muscle
  under the lungs, not the belly and not the back.'
examples:
- The blow landed on his pectus.
- A pectus injury can make breathing hard.
