simpleMeaning: A flat bread people often make in New England and Scotland, using oat flour or barley flour
scope: This is a flat bread made from oat or barley flour, linked with New England and Scotland. It is
  not a sweet cake and not a thin pancake.
examples:
- She baked a bannock from barley flour, the way they do in Scotland.
- For breakfast in New England, we ate a flat oat bannock with butter.
