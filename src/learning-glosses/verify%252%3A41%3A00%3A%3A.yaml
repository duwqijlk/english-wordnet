simpleMeaning: To check a test in science, or to keep it true, by running a like test beside it or setting
  it next to a set mark.
scope: This is checking a test in science against a like test or a set mark, also called control, not
  putting a legal mark on a paper or swearing a thing is true.
examples:
- They verified the trial by running a second one beside it.
- She verified the result against the set standard.
