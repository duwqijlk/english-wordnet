senseId: 'hypermetropy%1:26:00::'
synsetId: 14577603-n
simpleMeaning: A fault of the eye in which far-away things look clear but close things look blurred.
scope: A fault of the eye in which far things look clear and near things look blurred; farsightedness,
  hypermetropia, hyperopia and longsightedness are other names for it, not the fault in which near things
  look clear and far things look blurred.
examples:
- Her hypermetropy meant she could read road signs but not a book.
- Glasses corrected his hypermetropy for close work.
