simpleMeaning: A powder made from the crushed seeds and pods of the carob tree, used in place of chocolate
scope: Carob and carob powder are other names for this sense; it is a powder set apart from chocolate
  and cocoa by being made from the seeds and pods of the carob tree.
examples:
- She stirred Saint-John's-bread into the cake mix instead of chocolate.
- Saint-John's-bread tastes sweet, like the carob pods it comes from.
