simpleMeaning: An evergreen climbing shrub of southern Florida and the West Indies, grown for its bunches
  of sweet-smelling white to creamy flowers, followed by round white juicy berries.
scope: An evergreen climbing shrub with sweet-smelling white flowers and round white berries, also called
  a blolly or a West Indian snowberry.
examples:
- The Chiococca alba climbed over the porch, its white berries bright in the sun.
- We planted Chiococca alba for its sweet-smelling flowers.
