simpleMeaning: A metal mix that holds 0.9% carbon, the point at which it melts as one; a mix with 0.9%
  carbon is all pearlite, one fine layered mix.
scope: A metal mix with just under one part carbon in a hundred, not a soft iron and not a mix with much
  more carbon; no other name is listed for this sense.
examples:
- The smith chose eutectoid steel for the blade.
- Eutectoid steel holds 0.9% carbon and is all pearlite.
