simpleMeaning: anything that looks like a feather in its shape or its light weight
scope: Anything shaped or light like a feather, such as smoke rising in a thin shape; not a real feather
  on a bird and not feathers worn as decoration.
examples:
- A plume of smoke rose slowly from the chimney.
- The tall grass had soft plumes that moved in the wind.
