simpleMeaning: Any of a few kinds of grown sweet-fruit trees that bear sweet, juicy fruit shaped like
  the blood-pumping organ.
scope: Any of a few kinds of grown sweet cherries with sweet juicy fruit shaped like the blood-pumping
  organ, also called oxheart and oxheart cherry; not a sour cherry and not a wild cherry.
examples:
- The heart cherry tree in the yard bore sweet juicy fruit.
- She picked a basket of heart cherries for a pie.
