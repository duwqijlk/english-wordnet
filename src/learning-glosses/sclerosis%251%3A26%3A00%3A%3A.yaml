simpleMeaning: any illness in which the material that body parts are made of (tissue) becomes hard or
  thick
scope: This is an illness that makes parts of the body hard or thick, not healthy hardening after a cut
  and not only a disease of the bones.
examples:
- The doctor said sclerosis had made the tissue in her lung hard.
- Sclerosis can make a part of the body thick and stiff.
