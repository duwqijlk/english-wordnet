simpleMeaning: a plant found in most parts of the world, but not in South America, New Zealand, or some
  islands in the sea
scope: 'Also called great duckweed: a plant found in most parts of the world but not in South America,
  New Zealand, or some islands in the sea, and not the flax plant grown for seed.'
examples:
- Water flaxseed grows in most parts of the world but not in South America.
- You will not find water flaxseed in New Zealand.
