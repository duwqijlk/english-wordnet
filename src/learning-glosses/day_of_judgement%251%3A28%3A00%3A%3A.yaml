simpleMeaning: The time at the end of the world, after Armageddon, when God will settle the fate of every
  person by the good and evil of their life on earth.
scope: 'Also called doomsday, crack of doom, day of reckoning, end of the world, eschaton, Doomsday, Day
  of Judgment, Judgement Day, Judgment Day, Last Day, Last Judgement and Last Judgment: the last reckoning
  after Armageddon, when God settles each person''s fate.'
examples:
- On the Day of Judgement, God will judge every life.
- Preachers spoke of the Day of Judgement as the end of time.
