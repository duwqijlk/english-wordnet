simpleMeaning: having flat pieces of wood fixed on a wall or door, or wood covering the lower part of
  a wall
scope: 'Also called paneled: describes a wall, door or room with flat wood pieces fixed on it, not a plain
  wall with no wood on it.'
examples:
- They sat in a panelled room with dark wood walls.
- The hall has a panelled door made of oak.
