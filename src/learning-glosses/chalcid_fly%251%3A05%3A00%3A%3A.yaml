simpleMeaning: Tiny bugs of many kinds whose young feed on the eggs and grubs of various bugs, with many
  a kind helpful in killing off harmful bugs.
scope: Tiny bugs of many kinds whose young feed on the eggs and grubs of various bugs, also called chalcid,
  chalcid wasp, and chalcidfly.
examples:
- The chalcid fly kills harmful bugs.
- A chalcid fly lives off other bugs' eggs.
