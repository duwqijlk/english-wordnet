simpleMeaning: It makes people feel disgust and want to keep away, because it is so bad
scope: Also called disgustful, disgusting, distasteful, foul, loathsome, repellant, repellent, repelling,
  revolting, skanky, wicked, or yucky, it means so bad it makes people turn away in disgust, not just
  unpleasant or rude.
examples:
- The loathly smell from the drain made everyone leave the room.
- He found the loathly sight of the rotting food hard to bear.
