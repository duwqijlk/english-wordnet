simpleMeaning: a picture or a diagram (a drawing that shows how a thing works), used to make a subject
  nicer or easier to understand
scope: This is a picture or a diagram used to make a subject nicer or easier to understand; it is not
  a story or example told in words to make a point clear.
examples:
- The book has an illustration of a boat on page ten.
- She drew an illustration to show how the plant grows.
