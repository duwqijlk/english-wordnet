simpleMeaning: to stay watchful and careful about possible danger, paying close attention to anything
  that might cause trouble.
scope: This is not simply to pay attention to a task or to look after someone; it is to stay watchful
  because danger or trouble may be near.
examples:
- Mind the traffic when you cross the road after dark.
- Walking home alone, she stayed alert to every sound behind her.
