simpleMeaning: To push a wooden pin through a thing, or drive one into it
scope: To push or drive a wooden pin into a thing, not to fasten with a pin and not the pin itself.
examples:
- He pegged the tent cloth to the ground with wooden pins.
- She pegged the paper to the board.
