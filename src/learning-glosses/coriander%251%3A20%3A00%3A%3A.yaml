simpleMeaning: A plant from Europe, Asia and Africa, like parsley in how it looks, with leaves and seeds
  that have a strong smell
scope: This is the living plant itself, also called cilantro and coriander plant; not the leaves picked
  for use as a seasoning, and not the dried seeds used as a spice.
examples:
- Coriander grows well in her garden.
- She planted coriander next to the parsley.
