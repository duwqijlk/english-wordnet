simpleMeaning: a kind of jazz music played by big bands, popular in the 1930s, with flowing rhythms (patterns
  of beats) but simpler than later jazz
scope: Also called swing and swing music, this is the 1930s big-band jazz style; it is not the later kinds
  of jazz, which are not as simple.
examples:
- The big band played jive and the dance floor soon filled.
- People in the 1930s loved to dance to jive.
