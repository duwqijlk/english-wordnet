simpleMeaning: the material in the body that lies around the centre part (the nucleus) of the lens in
  the eye
scope: This is the material around the centre of the eye's lens, not the outer layer of the brain and
  not the outer layer of another organ or plant part.
examples:
- The cortex around the centre of the lens had turned cloudy.
- Damage to the cortex of the lens can make sight less clear.
