simpleMeaning: to name a dead person as one of the holy ones of the church
scope: To name a dead person as one of the holy ones of the church, not a person who is the best of their
  kind, and not a holy person named by the church.
examples:
- The church sainted the old bishop fifty years after his death.
- He was sainted for his life of prayer and good works.
