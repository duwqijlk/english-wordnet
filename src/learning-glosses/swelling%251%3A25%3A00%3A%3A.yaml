simpleMeaning: a part that sticks out from the surface around it
scope: 'Also called bump, bulge and hump: a part that sticks out from what is around it; not a body part
  made larger by illness or hurt, and not the growing larger of a heated thing.'
examples:
- There was a swelling in the road where tree roots pushed up from below.
- A round swelling rose from the flat side of the tree trunk.
