simpleMeaning: A tool used in surgery to cut very thin slices of skin
scope: This is a tool used in surgery to cut very thin slices of skin, not a scalpel and not a tool for
  taking a whole piece of skin.
examples:
- The surgeon used a dermatome to take a thin slice of skin.
- A dermatome cuts the skin in very thin sheets.
