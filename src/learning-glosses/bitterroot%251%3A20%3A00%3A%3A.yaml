simpleMeaning: A showy succulent that grows low to the ground in the Rocky Mountains, with deep to pale
  pink flowers and fleshy starchy roots; it is Montana's state flower.
scope: This sense is the low-growing Rocky Mountains plant with pink flowers and starchy roots; it is
  not the South American bitterwood tree, despite the similar name.
examples:
- Bitterroot blooms among the rocks of the Rocky Mountains.
- The bitterroot is the state flower of Montana.
