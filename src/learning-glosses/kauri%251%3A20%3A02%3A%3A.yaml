simpleMeaning: White wood with a fine close grain, from a tree of the genus Agathis, above all Agathis
  australis
scope: This is white close-grained wood from a tree of the genus Agathis, above all Agathis australis,
  not the tree itself and not wood from any other kind of tree.
examples:
- The table was made of pale kauri.
- Kauri wood comes from trees of the genus Agathis.
