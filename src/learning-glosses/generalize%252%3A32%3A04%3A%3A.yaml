simpleMeaning: to make something fit what most people like so that many people use it, show it to the
  public, and bring it into common use
scope: 'Also called popularize and generalise: to make something liked and widely used, not to speak in
  broad words and not to draw a broad rule from single cases.'
examples:
- The company generalized the new drink by making it cheap and selling it everywhere.
- They generalized the use of the new tool so that most workers could use it every day.
