simpleMeaning: A part of a film made of linked shots that develop one subject within a movie.
scope: This is a run of connected film shots inside a movie, not a notable event in a series of happenings,
  not a short section of a literary or dramatic work, and not one installment of a broadcast serial.
examples:
- The film's opening episode follows the family as they leave their village.
- Critics singled out the final episode of the movie for its brilliant editing.
