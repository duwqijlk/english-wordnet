simpleMeaning: Being ordinary because it is dull and not exciting
scope: This is being ordinary because it is dull and not exciting; prosiness is another name for this
  sense, not being plain and simple on purpose, and not being badly made.
examples:
- The prosaicness of the report made it hard to finish.
- She disliked the prosaicness of everyday talk at the office.
