simpleMeaning: A person who says whether a thing, often a work of art, is real, or who stands behind its
  being true.
scope: 'For works of art and other valued things: one who judges whether a thing is real or stands behind
  its truth.'
examples:
- The appraiser examined the painting and said it was real.
- An appraiser can tell whether a work of art is genuine.
