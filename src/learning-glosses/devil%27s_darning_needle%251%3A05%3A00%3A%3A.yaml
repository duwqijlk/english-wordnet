simpleMeaning: A thin-bodied bug that never stings, with glinting wings held out flat at rest, the grown
  and the young eating gnats and such.
scope: This sense is also called darning needle, dragonfly, mosquito hawk, sewing needle, skeeter hawk,
  snake doctor, and snake feeder, for a thin-bodied bug that never stings, with glinting wings held out
  flat at rest, the grown and the young eating gnats and such, unlike the sense for a common climber of
  eastern North America that sprawls over other plants and bears many heads of small creamy white blooms.
examples:
- A devil's darning needle skimmed the pond.
- The devil's darning needle ate gnats.
