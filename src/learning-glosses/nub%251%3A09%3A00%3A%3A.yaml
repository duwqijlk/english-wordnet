simpleMeaning: the best, most needed, and most important part of an idea or of something a person lives
  through
scope: 'Also called heart, center, core, centre, meat, sum, substance, marrow, essence, kernel, gist,
  pith, and inwardness: the most important part of an idea or experience, not a small lump or short piece
  of something.'
examples:
- The nub of her argument was that the plan cost too much.
- He missed the nub of the idea and talked only about small details.
