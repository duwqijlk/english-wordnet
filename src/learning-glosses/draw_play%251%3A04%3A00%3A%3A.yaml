simpleMeaning: In American football, a move in which the quarterback steps back as if to throw, then gives
  the ball to the fullback running toward the line of scrimmage.
scope: In American football, a move in which the quarterback steps back as if to throw, then gives the
  ball to the fullback; draw is another name for this sense, not a pass and not a run by the quarterback.
examples:
- The team scored on a draw play in the third quarter.
- They ran a draw play to catch the defence off guard.
