simpleMeaning: Grows on a bush of warm lands in America, this sharp-tasting fruit, red or yellow like
  a cherry, holds a great deal of vitamin C.
scope: This is the sharp-tasting fruit of a warm-land bush, also called barbados cherry and surinam cherry,
  not the bush itself that bears it.
examples:
- The acerola hung on the bush, red and sharp to the taste.
- She ate the acerola for the vitamin C in its sharp red flesh.
