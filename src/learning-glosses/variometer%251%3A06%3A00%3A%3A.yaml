simpleMeaning: a tool that measures changes in a magnetic field, the unseen force around a magnet
scope: A tool that measures changes in a magnetic field, not a compass and not a tool that measures heat.
examples:
- The variometer showed how the magnetic field changed during the storm.
- He used the variometer to track changes in the magnetic field over the day.
