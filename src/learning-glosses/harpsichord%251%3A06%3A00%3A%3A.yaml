simpleMeaning: a keyboard instrument whose strings are pulled by small pieces fixed on parts that can
  turn
scope: An old keyboard instrument, also called cembalo, whose strings are pulled, not hit like a piano
  and not played with air like an organ.
examples:
- The harpsichord made a bright sound when its strings were pulled as she pressed the keys.
- He learned to play the harpsichord, an old instrument with keys and strings.
