simpleMeaning: This word applies to a custom under which people wed only outside their own clan or tribe.
scope: Also called exogamous, this word is used of a custom under which people wed outside their own clan
  or tribe, never within it.
examples:
- Under exogamic custom, a young man had to find a wife in another clan.
- The exogamic rule kept marriages outside the tribe.
