simpleMeaning: a seat for a servant, or a place for bags, at the back of a horse-drawn carriage
scope: A servant's seat or bag space at the back of a carriage, not a low dull noise and not a fight between
  young gangs.
examples:
- The servant rode in the rumble at the back of the carriage.
- They packed the bags in the rumble.
