simpleMeaning: A small western plant that branches a great deal, with tiny blue-and-white flowers, from
  British Columbia to Ontario and south to California and Colorado.
scope: 'Also called Collinsia parviflora: a small much-branched western plant with tiny blue-and-white
  flowers, not the other blue-eyed Mary kinds.'
examples:
- The maiden blue-eyed Mary grew low among the rocks, its tiny blue-and-white flowers bright.
- We found maiden blue-eyed Mary on the dry hillside in spring.
