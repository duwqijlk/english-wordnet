simpleMeaning: When a blood tube in the brain breaks open or is blocked, the brain gets too little of
  the gas it needs to live, and awareness is lost at once.
scope: Also called stroke and apoplexy, a sudden loss of awareness when a blood tube in the brain breaks
  open or is blocked; not a slow fading of awareness.
examples:
- He had a cerebrovascular accident and lost awareness in a moment.
- A cerebrovascular accident happens when a blood tube in the brain breaks open or is blocked.
