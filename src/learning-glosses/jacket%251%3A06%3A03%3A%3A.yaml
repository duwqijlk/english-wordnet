simpleMeaning: the hard outer metal case around some kinds of ammunition (things fired from guns)
scope: This is the hard metal cover on some bullets, not a cover for a tooth and not an outer cover for
  other things in general.
examples:
- The jacket around this bullet is made of hard metal.
- The bullet's jacket split when it hit the steel plate.
