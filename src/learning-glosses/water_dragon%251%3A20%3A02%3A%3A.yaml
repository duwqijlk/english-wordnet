simpleMeaning: Small white blooms in thin curled bunches grow on a soft-stemmed plant of North America
  that lives for many years in wet places.
scope: Also called lizard's-tail and swamp lily, this soft-stemmed plant of wet places in North America
  bears small white blooms, unlike the swamp plant with bright yellow blooms like buttercups.
examples:
- The water dragon grew in wet places, its small white blooms in thin curled bunches.
- Water dragons of North America live for many years as soft-stemmed plants of wet places.
