simpleMeaning: A member of the church who puts stress on its traditional forms of worship
scope: A member of the church who stresses its traditional worship, not just any member of the church,
  and not a member of the Roman Catholic church.
examples:
- He was an Anglican Catholic who loved the old hymns.
- As an Anglican Catholic, she went to confession every week.
