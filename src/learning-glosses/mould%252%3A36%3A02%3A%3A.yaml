simpleMeaning: to shape soft stuff such as clay or wax into a form
scope: To shape soft stuff into a form, not to pour liquid into a cast and not the dish that comes out
  of a form; model and mold are other names for this sense.
examples:
- She moulded a head out of clay.
- The children moulded animals from wax.
