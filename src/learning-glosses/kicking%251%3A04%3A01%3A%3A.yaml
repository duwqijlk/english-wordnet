simpleMeaning: The steady push of the legs, back and forth in time, when a person swims or does body exercise
scope: Also called kick, this is the steady push of the legs in swimming or body exercise, not a single
  hard hit with the foot.
examples:
- The swimmer's kicking was strong and even all the way down the pool.
- Her kicking in the water class kept her moving forward.
