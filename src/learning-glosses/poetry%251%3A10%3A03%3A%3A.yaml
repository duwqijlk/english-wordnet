simpleMeaning: any form of communication that is beautiful or brings up feelings in people
scope: This is any form of communication that is beautiful or brings up feelings, not only a set of poems
  and not only the art of writing poems.
examples:
- His speech was pure poetry, beautiful and full of feeling.
- Her words were poetry to the listeners, beautiful and deeply moving.
