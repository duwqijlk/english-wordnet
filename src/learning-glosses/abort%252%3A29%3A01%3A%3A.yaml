simpleMeaning: to stop growing, die, and leave the mother's body before birth
scope: 'For a baby growing in the mother: to stop growing and die before birth, not the act of ending
  a pregnancy by a medical act and not stopping a plan early.'
examples:
- The pregnancy was lost when the fetus aborted.
- The doctor explained that the fetus had aborted early in its growth.
