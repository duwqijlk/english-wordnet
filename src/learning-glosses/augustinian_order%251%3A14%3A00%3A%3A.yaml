senseId: 'augustinian_order%1:14:00::'
synsetId: 08165074-n
simpleMeaning: Any of several groups of monks or nuns who live by a rule drawn from the writings of St
  Augustine.
scope: This is one of several groups of monks or nuns living by a rule from the writings of St Augustine,
  not a single group and not a rule drawn from another saint's writings.
examples:
- The Augustinian order follows a rule drawn from the writings of St Augustine.
- She joined an Augustinian order that keeps the rule of St Augustine.
