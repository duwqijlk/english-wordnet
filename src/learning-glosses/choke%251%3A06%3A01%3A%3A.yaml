simpleMeaning: a coil of wire in an electric circuit that lets a current flowing in one direction pass
  easily but makes a current that keeps changing direction weaker
scope: This is a part for an electric circuit, not the part that controls air in a gasoline engine and
  not the act of having trouble breathing.
examples:
- The radio uses a choke to smooth the power.
- He replaced the broken choke in the circuit.
