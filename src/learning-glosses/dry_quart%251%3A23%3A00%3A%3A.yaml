simpleMeaning: One of the measures for things that are not wet in the United States, as big as two pints,
  or 67.2 cubic inches.
scope: 'Also called quart: a measure for things that are not wet, not the liquid measure of the same name
  and not a smaller measure such as a pint.'
examples:
- He measured out a dry quart of oats.
- The farm stand sold berries by the dry quart.
