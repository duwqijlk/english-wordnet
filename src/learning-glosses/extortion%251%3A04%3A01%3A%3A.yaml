simpleMeaning: Unfair taking of money or fees by someone misusing their power.
scope: Unfair demands for money made by misusing power or office, not the crime of getting money by threats
  of harm.
examples:
- Citizens complained of extortion when officials charged fees for work they were bound to do.
- The report exposed extortion in the issuing of permits.
