simpleMeaning: very surprised and shocked, so much that a person cannot speak
scope: 'Also called dumbfounded, stupefied, dumbstruck, thunderstruck and dumfounded: so surprised a person
  cannot speak, not just a little surprised.'
examples:
- She was flabbergasted by the surprise news and could not speak.
- The workers were flabbergasted when their boss suddenly quit.
