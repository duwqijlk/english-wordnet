simpleMeaning: Some of the tissue from a pregnancy stays inside the body when the pregnancy ends
scope: 'Also called an incomplete abortion: a pregnancy that ends with some tissue left inside the body,
  not a pregnancy that ends with all of the tissue gone.'
examples:
- The doctor said the partial abortion left tissue inside her.
- After the partial abortion, some tissue stayed in the womb.
