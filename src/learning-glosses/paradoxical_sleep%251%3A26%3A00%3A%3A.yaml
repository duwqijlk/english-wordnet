senseId: 'paradoxical_sleep%1:26:00::'
synsetId: 14049226-n
simpleMeaning: a stage of rest that comes back again and again, in which a person dreams and the eyes
  move fast back and forth
scope: A stage of rest that comes back again and again, in which a person dreams and the eyes move fast
  back and forth; rapid eye movement and rapid eye movement sleep are other names for this sense, and
  it is not deep dreamless rest or being awake.
examples:
- During paradoxical sleep she dreamed vividly.
- Paradoxical sleep brings fast eye movements and dreams.
