senseId: homocyclic%5:00:00:cyclic:02
synsetId: 00680438-s
simpleMeaning: Above all, the ring is made of carbon bits, and all the bits in the closed ring are of
  the same kind
scope: A chemical made of a closed ring of bits of the same kind, also called isocyclic, above all carbon;
  not a ring of mixed kinds of bits and not an open chain.
examples:
- Benzene is a homocyclic compound.
- The homocyclic ring in this molecule is made of carbon atoms.
