simpleMeaning: a part in a muscle that feels when the muscle tissue is pulled longer
scope: A part in a muscle that feels when the muscle is pulled longer; not a part that moves the muscle
  and not a nerve in the skin.
examples:
- A stretch receptor tells the brain when a muscle is pulled longer.
- Stretch receptors in the leg fired as she bent her knee.
