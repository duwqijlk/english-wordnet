simpleMeaning: a flat grey sheet in the sky about halfway up, at a height of 2 or 3 miles
scope: A flat grey sheet in the sky at a height of 2 or 3 miles; altostratus cloud is another name for
  this sense, not a puffy mass and not a low flat sheet.
examples:
- Altostratus covered the sky all morning.
- The altostratus hid the sun for hours.
