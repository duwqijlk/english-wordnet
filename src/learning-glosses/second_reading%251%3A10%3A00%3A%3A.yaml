simpleMeaning: 'the next time a proposed law is put before lawmakers: to agree its main ideas in Britain,
  or to talk over a committee report and vote in the US'
scope: The next stage of a proposed law before lawmakers, after its first reading; not the first reading
  and not the final vote that makes it law.
examples:
- The bill passed its second reading by a large majority.
- After the second reading, the committee will look at the bill in detail.
