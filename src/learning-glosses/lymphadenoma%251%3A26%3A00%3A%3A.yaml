simpleMeaning: a lump in the body that helps fight sickness, grown far bigger than it should be
scope: A body lump grown far too big, not a lump swollen by a short illness and not a cancer.
examples:
- The doctor felt a lymphadenoma under her jaw.
- A lymphadenoma can stay swollen for weeks.
