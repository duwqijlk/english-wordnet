senseId: 'familiarly%4:02:00::'
synsetId: 00338291-r
simpleMeaning: In a close way, as people do with those they know well.
scope: In the close way of people who know each other well, not in a formal or distant way.
examples:
- They spoke familiarly, calling each other by first names.
- He was familiarly known as Jack to everyone in the village.
