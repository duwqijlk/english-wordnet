simpleMeaning: A steep slope made by people in front of a strong place built for fighting
scope: A steep man-made slope in front of a fort; scarp, escarpment and escarp are other names for this
  sense, not a natural hill and not the fort wall itself.
examples:
- The protective embankment rose steeply before the fort's walls.
- Soldiers hid behind the protective embankment.
