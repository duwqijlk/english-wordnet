simpleMeaning: not of your own country's forces and not of the forces of a country that helps yours in
  war
scope: This word describes the forces of an enemy country. It is not the noun for enemy soldiers, not
  a person or act that is unfriendly and ready to fight, and not a business attempt to take control that
  the leaders do not want.
examples:
- They saw hostile ships near the coast.
- A hostile plane flew over the border.
