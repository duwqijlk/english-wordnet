simpleMeaning: A bush or small tree of North America that loses its leaves in winter, with three-part
  leaves and red berries.
scope: A North American bush or small tree with three-part leaves and red berries, not a low cranberry
  plant; also called a cranberry bush and a cranberry tree.
examples:
- The highbush cranberry grows wild in the north woods.
- We picked red berries from the highbush cranberry.
