simpleMeaning: This eastern plant of the United States bears greenish flowers, each with a lower petal
  cut deep into narrow strips.
scope: This plant is also called green fringed orchis, ragged-fringed orchid, and ragged orchis.
examples:
- We found a ragged orchid with a greenish flower.
- A ragged orchid grew in the east of the United States.
