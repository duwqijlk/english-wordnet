simpleMeaning: in baseball, a batted ball that lets the batter reach base safely, not counting fielding
  mistakes
scope: A base hit in baseball, not a physical blow, a popular success, a dose of a drug, a murder, or
  a visit to a website.
examples:
- He got two hits and scored a run.
- Her hit in the ninth inning drove in the winning run.
