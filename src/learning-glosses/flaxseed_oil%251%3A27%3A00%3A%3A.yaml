simpleMeaning: A drying liquid got from the seed of the plant, used to make such things as paints.
scope: A drying liquid got from the seed of the plant, used to make such things as paints; linseed oil
  is another name for this sense, not a cooking oil, and not a liquid used only to thin paint.
examples:
- Flaxseed oil dries into a hard coat on wood.
- Painters mix flaxseed oil into their paints.
