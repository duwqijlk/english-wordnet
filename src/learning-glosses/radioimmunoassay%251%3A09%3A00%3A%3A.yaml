simpleMeaning: A test that finds a substance in the body after the stuff has been marked with radiation
scope: A test that finds a substance in the body by marking it with radiation, not a test that looks for
  the stuff without any such mark.
examples:
- The radioimmunoassay showed how much of the hormone was in her blood.
- Doctors used a radioimmunoassay to find the small amount of the drug in his blood.
