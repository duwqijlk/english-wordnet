simpleMeaning: In grammar, this describes a noun (a word used as a name) that names something that is
  not alive
scope: A grammar sense about nouns that name things that are not living. It is not the sense that means
  seeming dead, with no breathing and no pulse you can feel.
examples:
- The word 'table' is an inanimate noun.
- In this lesson, 'stone' is listed as inanimate because a stone is not living.
