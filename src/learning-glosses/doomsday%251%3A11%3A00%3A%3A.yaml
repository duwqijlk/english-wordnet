simpleMeaning: the bad end that is coming for someone, bringing ruin or great harm
scope: Also called doom. This is a bad end coming for someone, not the day at the end of time when God
  judges all people.
examples:
- Everyone feared the doomsday that was coming for the town.
- Losing the harvest felt like doomsday for the village.
