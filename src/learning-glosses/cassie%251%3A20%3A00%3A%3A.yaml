simpleMeaning: Sweet-smelling yellow flowers used to make perfume grow on a thorny shrub or small tree
  of tropical America
scope: Also called flame tree, huisache, mimosa bush, scented wattle, sweet acacia, and sweet wattle,
  this thorny shrub or small tree of tropical America bears sweet-smelling yellow flowers used to make
  perfume.
examples:
- The cassie was in flower, its yellow blooms sweet in the air.
- Perfume makers gather the flowers of the cassie.
