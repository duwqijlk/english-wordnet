simpleMeaning: fixed in what you will do without good reason, and not ready to change even when others
  argue with you, beg you, or attack you
scope: 'Also called hardheaded: fixed in a way that is hard to reason with, not just firm about a good
  plan and not just careful.'
examples:
- He stayed mulish and refused to change the plan, though everyone argued with him.
- Her mulish answer ended the talk; she would not listen to any reason.
