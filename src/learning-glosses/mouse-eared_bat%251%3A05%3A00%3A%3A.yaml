simpleMeaning: A winged animal that eats meat and has ears shaped like those of a small animal with a
  long tail
scope: A meat-eating flying animal with ears like a small animal's, not a fruit-eating flying animal and
  not one with plain round ears.
examples:
- We saw a mouse-eared bat with ears shaped like a small animal's.
- The mouse-eared bat ate meat and had ears shaped like a small animal's.
