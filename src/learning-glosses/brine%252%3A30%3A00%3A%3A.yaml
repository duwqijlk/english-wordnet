simpleMeaning: to keep something in salt water for a time
scope: This is the act of keeping something in salt water; not the salt water itself, and not soaking
  in plain water with no salt.
examples:
- They brined the meat overnight before cooking it.
- He is brining the vegetables in a large pot of salt water.
