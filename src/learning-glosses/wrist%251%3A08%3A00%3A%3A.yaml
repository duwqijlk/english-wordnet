simpleMeaning: the joint between the far end of the radius (a lower-arm bone) and the nearest row of carpal
  bones (small bones at the base of the hand)
scope: This is the joint between the hand and the lower arm; it is not the hand itself and not the joint
  in the middle of the arm.
examples:
- She hurt her wrist when she fell on her hand.
- He wore a watch around his wrist.
