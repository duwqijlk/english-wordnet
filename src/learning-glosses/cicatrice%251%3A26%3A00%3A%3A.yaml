simpleMeaning: a mark left when hurt skin or other tissue heals, most often on the skin
scope: This is a mark left when hurt skin or other tissue heals, most often on the skin; cicatrix and
  scar are other names for this sense, not a fresh cut and not a birthmark.
examples:
- A cicatrice ran across his knee from the old fall.
- The cicatrice on her arm had faded to a thin pale line.
