simpleMeaning: A category of nouns, pronouns and adjectives that controls agreement in an inflected language;
  arbitrary in some tongues, in Indo-European ones usually based on sex or being alive.
scope: The full name for the noun class that gender also names, such as masculine, feminine or neuter,
  which governs agreement between words; not the male-female biological distinction.
examples:
- Russian grammatical gender is often hard for beginners to predict.
- The chapter explains grammatical gender in Spanish step by step.
