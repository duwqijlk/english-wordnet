simpleMeaning: to say what a person or thing is like, naming its marks and odd ways
scope: To say what a person or thing is like, naming its marks and odd ways, not to set a demand in a
  contract.
examples:
- The poem can be qualified as a lament for a dead lover.
- She qualified his manner as cold and proud.
