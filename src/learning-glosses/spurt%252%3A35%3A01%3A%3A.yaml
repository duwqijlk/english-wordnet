simpleMeaning: To wet a thing by making liquid shoot out at it in a sudden short burst.
scope: To wet a thing by making liquid shoot out at it, also called squirt, not the sudden burst itself
  and not a stream that keeps flowing.
examples:
- He spurted water at the wall to clean it.
- The pipe spurted mud onto her shoes.
