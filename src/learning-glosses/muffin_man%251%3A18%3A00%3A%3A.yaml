simpleMeaning: In the past, a male seller who went from street to street with small round cakes
scope: A man who once went from street to street selling small round cakes, not a baker in a shop and
  not a seller of other food.
examples:
- The muffin man rang his bell as he walked down the lane.
- In the old song, the muffin man sells his cakes door to door.
