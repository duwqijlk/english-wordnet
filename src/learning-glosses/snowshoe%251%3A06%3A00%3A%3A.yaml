senseId: 'snowshoe%1:06:00::'
synsetId: 04259441-n
simpleMeaning: A light frame shaped like a racquet, strengthened by cross pieces and a web of straps,
  worn one on each foot to walk on deep snow.
scope: A frame worn on the feet to walk on deep snow, not the act of travelling on snowshoes.
examples:
- She put on her snowshoes before crossing the deep drifts.
- He walked across the field in snowshoes, leaving wide tracks behind him.
