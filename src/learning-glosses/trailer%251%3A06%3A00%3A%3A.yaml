simpleMeaning: a vehicle with wheels that a car or truck pulls behind it, made so people can live or stay
  in it
scope: This is the pulled vehicle people can stay in, not the short advertisement for a coming film, and
  not the large pulled vehicle used only to carry goods.
examples:
- They slept in their trailer at the camp site.
- He pulled the trailer behind his truck and slept in it that night.
