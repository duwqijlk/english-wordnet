simpleMeaning: Parts of a company other than the preferred kind, giving the holder a cut of its gains
  and a vote in choosing its leaders.
scope: These are also called common shares and common stock, and unlike the preferred kind they give the
  holder a cut of the company's gains and a vote in choosing its leaders.
examples:
- Over 40 million Americans put money into ordinary shares.
- Holders of ordinary shares vote in choosing the company's leaders.
