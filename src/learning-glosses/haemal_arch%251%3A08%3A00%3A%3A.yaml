simpleMeaning: Blood tubes near the tail run through this curved bone, which grows from the underside
  of a back bone's middle.
scope: Also called a hemal arch, blood tubes near the tail run through this curved bone under a back bone.
examples:
- The haemal arch closes round the blood tubes near the tail.
- In the skeleton the haemal arch stood out below the back bone.
