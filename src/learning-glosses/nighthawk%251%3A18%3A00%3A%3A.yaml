simpleMeaning: A person who likes to stay up late and be busy at night
scope: This is a person who likes to stay up late; night owl and nightbird are other names for this sense,
  and not the night bird of the same name or a person up late only for work.
examples:
- He is a nighthawk who never sleeps before dawn.
- The old nighthawk kept the shop open past midnight.
