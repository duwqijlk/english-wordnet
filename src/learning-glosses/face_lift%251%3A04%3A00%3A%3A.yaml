simpleMeaning: Skin drawn back and extra skin cut off near the hair leaves the front of the head free
  of lines and other marks of age.
scope: Also called a lift, a facelift, cosmetic surgery, face lifting, nip and tuck, rhytidectomy, and
  rhytidoplasty, this is an operation on the face, not on another part of the body.
examples:
- Some actresses have more than one face lift.
- Her face lift took away the lines on the front of her head.
