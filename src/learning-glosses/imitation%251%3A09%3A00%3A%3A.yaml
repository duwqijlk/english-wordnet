simpleMeaning: The idea that art should show nature and human life exactly as they are.
scope: The idea that art should show nature and human life exactly as they are, not a comic copy of a
  person and not a fake copy of a real thing.
examples:
- The school taught imitation as the first rule of art.
- For him, imitation meant copying nature exactly, never inventing.
