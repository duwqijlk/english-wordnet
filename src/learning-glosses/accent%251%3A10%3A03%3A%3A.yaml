simpleMeaning: the words and ways of speaking that belong to one group of people and set them apart
scope: The words used by one group of people, not the way one person speaks and not a written mark over
  a letter.
examples:
- Their accent uses words that only people from their town know.
- The accent of the group was full of words no one else used.
