simpleMeaning: in a big, fine way that people admire
scope: Done in a big, fine way that people admire; not done in a proud or rude way, and not done in a
  small, plain way.
examples:
- The hall was grandly dressed with gold cloth and tall flowers.
- He grandly opened the doors of his new house to all his guests.
