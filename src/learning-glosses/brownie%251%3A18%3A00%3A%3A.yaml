simpleMeaning: In folklore, a fairy that is somewhat naughty and likes to play tricks
scope: In folklore, this kind of fairy is also called imp, elf, pixie, pixy, hob and gremlin. It is not
  the small square chocolate cake.
examples:
- In the old tale, a brownie came at night and played tricks in the kitchen.
- The children left milk out for the brownie who lived in the barn.
