simpleMeaning: the act of making a thing through taking something away
scope: This is making a thing through taking something away; not making a thing by adding parts, and not
  the act of taking a thing away for its own sake.
examples:
- Creating by removal is how the sculptor freed the figure.
- The artist loved creating by removal, cutting away stone.
