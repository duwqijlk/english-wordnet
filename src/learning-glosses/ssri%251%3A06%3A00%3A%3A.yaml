simpleMeaning: A drug that lifts low mood, by stopping the brain from taking back serotonin, so more of
  it stays free to reach the brain's nerve ends.
scope: Also called selective-serotonin reuptake inhibitor; a drug that lifts low mood by stopping the
  brain from taking back serotonin, so more of it stays free to reach the brain's nerve ends.
examples:
- The doctor gave her an SSRI for her low mood.
- An SSRI can take weeks to lift the mood.
