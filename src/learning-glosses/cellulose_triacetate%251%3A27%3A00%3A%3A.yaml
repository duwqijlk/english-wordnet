simpleMeaning: a kind of acetate that burns rather slowly; used in place of celluloid for motion-picture
  film
scope: A kind of acetate that burns rather slowly, used in place of celluloid for motion-picture film;
  triacetate is another name for this sense, not celluloid itself and not ordinary film.
examples:
- Cellulose triacetate burns rather slowly and is used for motion-picture film instead of celluloid.
- This motion-picture film uses cellulose triacetate instead of celluloid.
