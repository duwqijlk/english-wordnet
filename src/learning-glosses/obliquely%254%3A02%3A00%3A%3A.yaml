simpleMeaning: at an angle that is not straight up and down and not flat, but leaning to one side
scope: In a leaning, slanting way; not straight up and down, not flat, and not in a straight line from
  side to side.
examples:
- The pole stood obliquely in the ground, leaning far to the left.
- Sunlight fell obliquely through the window and lit the side wall.
