simpleMeaning: a thing made by people, especially a car, that has faults and is not good enough
scope: 'Also called lemon: a thing made by people, especially a car, that has faults; not a thing that
  smells bad, and not a person thought to be very bad.'
examples:
- The used car he bought was a real stinker, with faults in the engine and brakes.
- That cheap washing machine was a stinker and broke down after a month.
