simpleMeaning: to manage to show or say well something that you cannot touch, like a feeling or an idea
scope: To show or say well a feeling or idea that you cannot touch, not catching a person after a chase
  and not catching an animal in a trap.
examples:
- Her words captured the joy of spring in a way everyone could feel.
- The song captures the sadness of leaving home.
