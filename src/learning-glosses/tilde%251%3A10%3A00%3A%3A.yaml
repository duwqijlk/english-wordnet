simpleMeaning: A mark set over the letter n in Spanish for a nose sound made at the mouth roof, or over
  a vowel in Portuguese to show a nose sound.
scope: A mark used in Spanish over n and in Portuguese over a vowel, to show a nose sound.
examples:
- A tilde sits over the n.
- Tildes mark nose sounds.
