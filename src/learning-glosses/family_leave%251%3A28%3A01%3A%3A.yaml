senseId: 'family_leave%1:28:01::'
synsetId: 92440601-n
simpleMeaning: Paid time off work, given in almost all countries, for an employee to care for a child
  or to make plans for the child's welfare.
scope: Paid time off work to care for a child or to make plans for the child's welfare, also called parental
  leave; not time off taken only by a mother after birth and not time off for sickness.
examples:
- She took family leave after her baby was born.
- He used his family leave to look after his new son.
