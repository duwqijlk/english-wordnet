simpleMeaning: to try to find a person or thing, or to try to find out if something is real
scope: 'Also called search: this is trying to find a person or thing, or to find out if something is real.
  It is not asking for help or trying to get a thing you want.'
examples:
- Police seek the missing man in every town nearby.
- They seek proof that the old story is true.
