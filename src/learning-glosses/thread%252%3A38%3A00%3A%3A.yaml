simpleMeaning: to move or to make a thing move in long bends and turns
scope: 'Also called wind, wander, and weave: to move in long bends and turns, not to put a fine cord through
  a hole and not to put beads on a cord.'
examples:
- The river threaded through the hills on its way to the sea.
- The path threaded through the fields behind the house.
