senseId: 'gentile%1:18:02::'
synsetId: 09698566-n
simpleMeaning: a person who does not belong to your own religion; Mormons and Hindus use the word in this
  way
scope: This is a person who is not a member of the speaker's own religion, in the way Mormons and Hindus
  use the word. Not the narrower sense of a Christian set against a Jew, and not the word for things of
  non-Jewish peoples.
examples:
- To the Mormon family, their new neighbour was a gentile because he was not a Mormon.
- In that Hindu village, a visitor from another religion was called a gentile.
