simpleMeaning: a small furry tree animal of Australia with a pouch for its young and a long tail that
  can usually grip
scope: A small furry tree animal of Australia with a pouch for its young; possum and opossum are other
  names for this sense, not a squirrel and not a small ground animal with a pouch.
examples:
- A phalanger slept curled in the fork of the tree, its long tail wrapped round a branch.
- The phalanger moved through the trees at night, gripping each branch with its tail.
