senseId: discursive%5:00:00:indirect:02
synsetId: 00771957-s
simpleMeaning: Describes talk or writing that wanders from the main point and takes in a wide range of
  things.
scope: Talk or writing that wanders from the main point, also called rambling, digressive, and excursive;
  not talk that stays on one point and not talk that is short and sharp.
examples:
- His discursive speech wandered from topic to topic.
- The discursive book covers many subjects at once.
