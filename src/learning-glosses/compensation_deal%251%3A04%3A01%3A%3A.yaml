simpleMeaning: a trade in which a seller in one country gets goods from the buyer in the other country
  as part of the pay
scope: A swap of goods for part of a payment in trade between countries, not a payment made only in money.
examples:
- Under the compensation deal, the exporter accepted machinery as part of the payment.
- The compensation deal let the importer pay partly in goods instead of cash.
