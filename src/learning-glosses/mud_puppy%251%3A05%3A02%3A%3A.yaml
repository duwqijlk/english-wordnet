simpleMeaning: A young salamander of the high lakes of Mexico, which most often lives its whole life without
  changing form.
scope: Also called axolotl; a young salamander of the high lakes of Mexico that most often lives without
  changing form, not the grown salamander of North America and not a fish.
examples:
- The mud puppy stayed in its larval form for years.
- Mud puppies live in the high lakes of Mexico.
