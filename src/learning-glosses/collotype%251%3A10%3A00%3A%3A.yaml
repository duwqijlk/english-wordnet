simpleMeaning: From a glass plate coated with a jelly-like layer that holds the picture to be copied,
  pictures are printed by light and machine, in one colour or several
scope: Also called collotype printing and photogelatin process, this printing process uses a glass plate
  coated with a jelly-like layer to copy pictures in one colour or several.
examples:
- The old book was printed by collotype.
- The workshop used collotype to copy the picture in several colours.
