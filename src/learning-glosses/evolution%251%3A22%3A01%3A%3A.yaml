simpleMeaning: how a thing changes little by little until it reaches a later stage, especially a more
  advanced or mature one
scope: 'Also called development: a slow change into a later stage, especially a more advanced or mature
  one, not the biology sense of species change.'
examples:
- The evolution of Greek civilization took centuries.
- The slow evolution of her skill as a writer pleased her teacher.
