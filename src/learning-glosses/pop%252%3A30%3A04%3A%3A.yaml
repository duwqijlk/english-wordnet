simpleMeaning: to make something break apart with a loud bang
scope: This is the deliberate act of bursting something; unlike the other row, the thing does not burst
  by itself, and a bang alone without anything breaking is not enough.
examples:
- The child popped the balloon with a pin.
- He popped the paper bag behind her to make her jump.
