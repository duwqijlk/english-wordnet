simpleMeaning: very loud in a way that people notice and find rude, and quick to shout out in anger or
  protest
scope: 'Also called blatant, strident, clamorous and clamant: very loud and quick to shout, not just any
  loud sound and not quiet speech.'
examples:
- A vociferous crowd shouted outside the office all morning.
- She was vociferous in her anger at the new plan, shouting for everyone to hear.
