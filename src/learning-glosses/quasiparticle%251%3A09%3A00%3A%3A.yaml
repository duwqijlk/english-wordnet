simpleMeaning: With a place and a motion of its own, a bit of energy in a crystal or other stuff can in
  some ways count as a tiny thing.
scope: It is a bit of energy that counts as a tiny thing only in some ways.
examples:
- In the crystal, the quasiparticle held its place.
- The quasiparticle moved through the crystal.
