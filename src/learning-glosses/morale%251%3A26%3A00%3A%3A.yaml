simpleMeaning: how good a person feels inside, from feeling sure of themselves, useful, and with a purpose
scope: How good a person feels inside, from confidence, usefulness and purpose, not the spirit of a whole
  team.
examples:
- Her morale rose after the praise from her boss.
- Good food and rest lifted his morale after the long day.
