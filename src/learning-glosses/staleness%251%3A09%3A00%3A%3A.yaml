senseId: 'staleness%1:09:00::'
synsetId: 05657630-n
simpleMeaning: The dullness of a thing said or done so often that it feels worn out and brings nothing
  new.
scope: Also called triteness, the dullness of a thing said or done so often it brings nothing new; not
  the loss of freshness in a thing as it grows old.
examples:
- The staleness of his jokes made the crowd groan.
- After years of the same show, its staleness showed in every line.
