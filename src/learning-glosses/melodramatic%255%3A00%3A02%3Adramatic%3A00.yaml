simpleMeaning: full of excitement and strong feelings that move people deeply
scope: This can describe a story, a person, or a way of acting that is full of excitement and strong feeling;
  it is not calm or plain in feeling.
examples:
- The film gave a melodramatic account of two dangerous days at sea.
- Her melodramatic story about the storm had everyone listening closely.
