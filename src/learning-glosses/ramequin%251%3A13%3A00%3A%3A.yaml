simpleMeaning: Cheese, egg and bread crumbs are baked into a dish served in single portions in its own
  small heat-proof dish.
scope: Also called ramekin, this cheese dish is baked with egg and bread crumbs and served in its own
  small heat-proof dish.
examples:
- He had a ramequin for lunch.
- The ramequin came out of the oven in its own dish.
