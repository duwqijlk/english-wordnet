simpleMeaning: move something over a surface in a circling motion while pressing down
scope: This is the circling rub itself, also called pass over, not the noun for an act of wiping.
examples:
- Wipe the table with a damp cloth, working in small circles.
- She wiped the mirror in slow circles until it was clear.
