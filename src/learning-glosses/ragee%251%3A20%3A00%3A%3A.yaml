simpleMeaning: an East Indian grain grass whose seeds make a slightly bitter flour, a main food in the
  East
scope: Also called coracan, corakan, finger millet, kurakkan, and ragi; a grain grass of India, not wheat
  and not rice.
examples:
- Ragee flour makes flat bread in India.
- Farmers grow ragee for its bitter flour.
