simpleMeaning: Grey when young and black when old, this kind of mushroom has a pitted top joined to the
  stem with almost no loose edge round it.
scope: Also called a black morel or a narrowhead morel, this mushroom has a pitted top joined to the stem
  with almost no loose edge round it.
examples:
- The young conic morel was grey.
- An old conic morel had turned black.
