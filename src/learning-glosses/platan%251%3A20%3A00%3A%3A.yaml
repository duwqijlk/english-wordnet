simpleMeaning: one of several tall plants of one group, with thin pale bark that comes off in small plates,
  leaves cut into rounded parts, and round heads of fruit
scope: Also called a plane tree and a sycamore; not a maple and not an oak.
examples:
- The platan in the park has bark that peels in thin plates.
- A platan drops round heads of fruit in autumn.
