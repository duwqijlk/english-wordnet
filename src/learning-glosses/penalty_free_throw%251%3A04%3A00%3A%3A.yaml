synsetId: 00111784-n
simpleMeaning: a shot at the basket from the foul line that no one may block, given when the other side
  has broken a rule
scope: 'Also called a charity shot, a charity throw, a charity toss, a foul shot and a free throw: a shot
  from the foul line after the other side breaks a rule, not a shot taken during open play.'
examples:
- He made the penalty free throw after the foul.
- The penalty free throw put her team two points ahead.
