simpleMeaning: When a letter is sent in an envelope, a paper that backs up the letter may go with it
scope: This is a paper sent in an envelope with a letter, most often to back it up; enclosure is another
  name for this sense. Not the letter itself and not the envelope.
examples:
- Please find the inclosure with this letter.
- The inclosure listed the papers that backed up her claim.
