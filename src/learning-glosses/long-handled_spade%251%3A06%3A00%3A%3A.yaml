simpleMeaning: Narrow ditches are dug with this digging tool, whose handle reaches far
scope: Also called a ditch spade, this is a digging tool with a far-reaching handle for narrow ditches,
  not a short tool for garden beds.
examples:
- He used a long-handled spade to clear the ditch.
- The long-handled spade reached deep into the narrow trench.
