simpleMeaning: the full round of the heart from one beat to the next, when an electric pulse moves through
  the heart muscle and squeezes the upper rooms, then the lower ones
scope: The heart's full beat-to-beat round, not a single heartbeat and not heart disease.
examples:
- Doctors study the cardiac cycle to see how the heart beats.
- Each cardiac cycle starts with the upper rooms of the heart squeezing.
