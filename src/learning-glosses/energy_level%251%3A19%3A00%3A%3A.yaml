simpleMeaning: A set amount of power to do work that a thing can have, most of all a tiny charged bit
  in an atom or a group of atoms.
scope: 'Also called an energy state: a set amount of power to do work that a thing can have, not any amount
  at all and not the power itself.'
examples:
- The atom stayed at one energy level.
- Only certain energy levels are possible for the atom.
