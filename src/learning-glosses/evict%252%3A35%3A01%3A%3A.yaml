simpleMeaning: to force a person to leave a place without going through the courts
scope: This sense is forcing a person out without using the courts, not forcing a person out of a home
  by an order from a court.
examples:
- The owner tried to evict the family himself instead of going to court.
- They were evicted by men who threw their things into the street, with no court order.
