simpleMeaning: the person who rows nearest the back of a racing boat and sets how fast the rest of the
  team rows
scope: The rower at the back of a racing boat who sets the speed for the team, not the brain illness,
  not a mark made with a pen, and not a hit in golf.
examples:
- As stroke, she sat at the back of the boat and set the pace for the crew.
- The stroke kept a steady speed so the rest of the team could row together.
