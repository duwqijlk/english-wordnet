simpleMeaning: not showing or copying the outside world or the things in nature
scope: This is art that does not show or copy the outside world, with abstract, nonfigurative and nonobjective
  as other names for this sense, not a picture of a real place or person.
examples:
- The abstractionist canvas showed only blocks of colour.
- An abstractionist painter may avoid any shape from nature.
