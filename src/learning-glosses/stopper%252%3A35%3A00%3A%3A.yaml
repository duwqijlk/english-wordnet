simpleMeaning: To shut or make safe with a plug, or as if with a plug
scope: To shut or make safe with a plug, or as if with a plug; not the plug itself, and not a card in
  bridge.
examples:
- He stoppered the jar so the jam would keep.
- She stoppered the bottle and put it back on the shelf.
