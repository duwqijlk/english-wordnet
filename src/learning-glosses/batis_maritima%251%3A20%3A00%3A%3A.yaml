simpleMeaning: A low coastal bush of warm parts of the New World with a strong smell, male or female flowers
  in cone-shaped spikes, and thick juicy leaves.
scope: A low coastal bush with a strong smell, also called saltwort; set apart from other coastal bushes
  and from other bushes of warm coasts.
examples:
- Batis maritima grows low along warm coasts.
- The thick juicy leaves of Batis maritima hold water.
