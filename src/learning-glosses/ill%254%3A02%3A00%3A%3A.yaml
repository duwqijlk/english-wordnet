simpleMeaning: In a bad, wrong, or unsatisfactory way.
scope: This describes doing something badly; it is not the noun for a sickness, and it does not mean 'only
  just'.
examples:
- The team was ill-prepared for the sudden change.
- The report was ill-judged and caused an uproar.
