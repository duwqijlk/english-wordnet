simpleMeaning: A fine clay, usually white, formed from weathered minerals rich in aluminium, feldspar
  among them, used in ceramics and as an absorbent and as a filler, in paper too.
scope: Also called china clay, kaolin, kaoline, porcelain clay, and terra alba; a fine white clay from
  weathered aluminous minerals, used in ceramics, as an absorbent, and as a filler in paper.
examples:
- China stone is used as a filler in paper.
- The china stone is usually white.
