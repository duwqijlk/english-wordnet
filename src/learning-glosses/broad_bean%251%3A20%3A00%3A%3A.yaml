simpleMeaning: an upright plant from the Old World grown most of all for its big flat seeds that people
  can eat, but also as food for animals
scope: 'Also called broad-bean, broad-bean plant and field bean: an upright plant grown for its big flat
  seeds that people can eat, not the cooked seeds eaten like lima beans.'
examples:
- She planted broad beans in the garden this spring.
- The farmer grew broad beans to feed his cattle.
