simpleMeaning: A closed loop of six carbon atoms with hydrogen atoms joined to it
scope: A closed loop of six carbon atoms with hydrogen atoms joined to it; benzene formula, benzene nucleus
  and benzene ring are other names for this sense; not an open chain of atoms, and not a ring of another
  number of atoms.
examples:
- The Kekule formula shows six carbon atoms in a closed chain.
- Chemists draw the Kekule formula as a ring.
