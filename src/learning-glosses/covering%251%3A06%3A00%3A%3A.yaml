schema: oewn-learning-gloss-v2
senseId: 'covering%1:06:00::'
synsetId: 03127399-n
simpleMeaning: A made thing that lies over another thing, most times to keep it safe, to keep harm away
  from it, or to hide it
scope: This is a made thing that lies over something else, not the act of hiding a thing by blocking the
  view of it, not a thing found in nature that lies over something, and not the act of keeping a thing
  safe by lying over it.
examples:
- She put a plastic covering over the bed to keep it dry.
- The covering on the chair kept the dust off it.
