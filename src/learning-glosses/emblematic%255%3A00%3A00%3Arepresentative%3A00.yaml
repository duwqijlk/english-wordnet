simpleMeaning: acting as a thing you can see that stands for an idea or quality you cannot see
scope: This sense is also called symbolic and symbolical. It means a thing you can see stands for an idea,
  not that the thing is the idea itself.
examples:
- A crown is emblematic of royalty.
- The dove is emblematic of peace.
