simpleMeaning: younger than another person, lower in rank, or having been in a job or in service for less
  time
scope: Describes a person who is younger, lower in rank, or newer in a job or in service than another
  person, not the older or higher one.
examples:
- She is the junior nurse on the team and started last year.
- He is junior to the manager, so she makes the big choices.
