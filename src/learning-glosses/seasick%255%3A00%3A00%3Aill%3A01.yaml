simpleMeaning: feeling ill, as if you want to throw up, because of the movement of a boat or other vehicle
scope: 'Also called carsick and airsick: this is feeling ill from movement when you travel, not being
  ill for another reason, such as bad food.'
examples:
- She felt seasick during the rough boat trip.
- He gets seasick even on a short ferry ride.
