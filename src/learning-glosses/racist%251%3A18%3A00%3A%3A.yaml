simpleMeaning: a person who ranks people by race, putting one group above the rest and holding that ranking
  as a firm unfair view
scope: A person who holds one race better than the rest, not someone who merely dislikes another group,
  and not the adjective that describes such a view.
examples:
- The racist claimed his own group was better than all others.
- She refused to listen to the racist at the meeting.
