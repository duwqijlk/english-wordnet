simpleMeaning: A state in which things are getting better, or what has been built up so far, as when a
  chess player brings pieces into play early on.
scope: This is the state of improving or the gains made so far, as in the opening of a chess game, not
  a recent event, not the act of improving something, not the process of passing to a more advanced stage,
  not biological growth, not making land or water more productive, not a developed district, not a musical
  section, and not the processing of photographic film.
examples:
- In chess, look after your development before you move your queen.
- White's quick development gave him control of the center.
