simpleMeaning: Thick with fine hairs on its leaf stalks and on the undersides of its leaves, this small
  North American fern stays green all year.
scope: Also called wooly lip fern, it is a small evergreen fern of North America, known by the thick hairs
  on its leaf stalks and leaf undersides.
examples:
- The hairy lip fern grew in the shade of the rocks.
- We found a hairy lip fern with thick hairs under its leaves.
