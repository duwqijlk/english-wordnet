simpleMeaning: a tall grass that grows in hot lands in Southeast Asia, with thick, jointed stems full
  of fibres; its juice is a main source of sugar
scope: Also called sugar cane. This is the living grass plant itself, not the cut juicy stems that are
  chewed or used for molasses and sugar.
examples:
- Sugarcane grows tall in the hot fields near the sea.
- Farmers cut the sugarcane and take it to make sugar.
