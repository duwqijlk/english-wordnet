simpleMeaning: to hit someone hard again and again with a whip or a stick
scope: To hit someone hard again and again with a whip or a stick, with slash, whip, lash, strap and welt
  as other names for this sense, and not to wash with soap or give a single light hit.
examples:
- The teacher lathered the boy with a whip for stealing.
- The children were lathered hard for lying.
