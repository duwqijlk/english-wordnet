simpleMeaning: Said of a thing that is not fit to carry on, or that does not work as it should
scope: Said of a thing that is not fit to carry on or does not work as it should, not of a thing that
  works well.
examples:
- The launch was no-go after the fault was found.
- With the engine no-go, they put off the trip.
