simpleMeaning: One of the numbers that fixes a point by how far it is from two lines or three flat surfaces;
  the lines, or where the surfaces cross, are the axes.
scope: This is one number in a system of numbers that fixes a point, giving its distance from two lines
  or from three flat surfaces; it is not the whole set of numbers that fixes the point.
examples:
- The Cartesian coordinate tells how far the point is from the lines.
- We found the Cartesian coordinate on the graph.
