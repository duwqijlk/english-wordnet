simpleMeaning: A judge's written view that backs the court's ruling on a case, but sets out that one judge's
  own reasons
scope: A judge's written view that backs the court's ruling on a case, but sets out that one judge's own
  reasons; not a view that goes against the ruling and not the court's ruling itself.
examples:
- The judge wrote a concurring opinion to set out her own reasons.
- His concurring opinion backed the court's ruling on the case.
