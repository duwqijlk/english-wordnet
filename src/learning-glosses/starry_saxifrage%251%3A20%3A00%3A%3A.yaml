simpleMeaning: A small alpine plant of Europe that often spreads in low mats and bears tiny white flowers
  with narrow petals
scope: A small alpine plant of Europe that spreads in low mats and bears tiny white flowers, also called
  star saxifrage; not a tall garden flower and not a moss.
examples:
- Starry saxifrage grows in low mats on the high slopes.
- We found starry saxifrage flowering among the rocks in Europe.
