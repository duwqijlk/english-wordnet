simpleMeaning: Points count when a ball goes through a high flat ring, on a court between two teams of
  five.
scope: This is the court contest for two teams of five, also called basketball and hoops.
examples:
- The basketball game was won by the team that threw the ball through the ring most often.
- Each basketball game has two teams of five on the court.
