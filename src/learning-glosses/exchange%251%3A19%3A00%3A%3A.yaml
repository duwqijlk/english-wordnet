simpleMeaning: a chemical process in which one atom, charged particle, or group of atoms takes the place
  of another.
scope: This is a swap at the level of atoms and molecules, not a trade of goods or a conversation.
examples:
- The exchange of ions across the membrane keeps the cell charged.
- Chemists studied the exchange of atoms during the reaction.
