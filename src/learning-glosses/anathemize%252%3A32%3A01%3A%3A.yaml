simpleMeaning: To ask God to punish a person or thing that has been called evil.
scope: This threat of God's punishment is also called accurse, execrate, anathematise, anathematize, anathemise,
  and comminate.
examples:
- The priest said the church would anathemize anyone who defied its rules.
- The bishop anathemized the man before the whole church.
