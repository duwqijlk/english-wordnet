simpleMeaning: a standard amount, such as a kilogram or a pound, used to say how heavy something is
scope: This is one single unit, not the whole system of units, not the heaviness itself, not a metal block
  used on a balance, and not the importance of something.
examples:
- The pound is a weight used in Britain and the United States.
- In the metric system, the gram is the smallest common weight on kitchen scales.
