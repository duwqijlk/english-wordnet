simpleMeaning: the tube through which food passes in the body, in particular in a very young animal before
  birth or in a sea animal
scope: The food tube of the body, in particular in a very young animal before birth or in a sea animal,
  not the mouth alone and not the stomach alone.
examples:
- The enteron of the embryo was already a clear tube.
- In the tiny sea animal, the enteron runs from the mouth to the far end.
