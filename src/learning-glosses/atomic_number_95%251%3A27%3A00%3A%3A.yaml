simpleMeaning: A heavy metal that gives off rays on its own, heavier than uranium; made by firing helium
  atoms at uranium.
scope: 'Also called Am and americium: a heavy metal that gives off rays on its own, made by firing helium
  atoms at uranium; the next metal in the set is atomic number 96.'
examples:
- Atomic number 95 was first made by firing helium atoms at uranium.
- Scientists found atomic number 95 after bombarding uranium with helium atoms.
