simpleMeaning: to stir up strong feelings or passions in someone.
scope: This is not the ceremony held over a dead body before burial, and not the trail of water left behind
  a moving boat; it is about stirring up emotions.
examples:
- Her letter woke old jealousy in him.
- The song woke a longing she had long forgotten.
