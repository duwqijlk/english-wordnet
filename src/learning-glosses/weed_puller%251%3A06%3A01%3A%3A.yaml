senseId: 'weed_puller%1:06:01::'
synsetId: 92466315-n
simpleMeaning: A garden tool with steel claws that grip unwanted plants by the root to take them out cleanly.
scope: A garden tool with steel claws; weed remover is another name for this sense, not a hoe and not
  a spray for killing plants.
examples:
- He used the weed puller to get the dandelions out by the root.
- The weed puller grips the plant so it comes out cleanly.
