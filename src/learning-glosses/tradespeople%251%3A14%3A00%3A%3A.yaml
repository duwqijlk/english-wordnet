simpleMeaning: people who work in buying and selling goods
scope: These are people as a group who work in buying and selling; it is not one such person alone, and
  not people who only buy goods for their own use.
examples:
- Local tradespeople open their shops early on market day.
- The tradespeople in this town sell food, clothes, and tools.
