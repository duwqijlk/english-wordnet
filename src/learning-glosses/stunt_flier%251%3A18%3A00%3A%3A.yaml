simpleMeaning: a person who steers a plane and travels round the country, showing daring tricks in the
  air and jumps with a parachute
scope: 'Also called a stunt pilot or a barnstormer: a person who goes round the country giving shows of
  daring flying and parachuting, not a pilot of a plane that carries people and not a person who jumps
  from a plane for fun.'
examples:
- The stunt flier thrilled the crowd with a loop over the field.
- A stunt flier came to our town fair and jumped out of his plane with a parachute.
