simpleMeaning: a person who, for fun, goes up steep places with hands and feet, especially high mountains
scope: A person who goes up mountains or rock faces for fun, not a plant that grows up a support, not
  an iron spike on a shoe, and not a person who flatters others to rise in society.
examples:
- The climber reached the top of the rock face before dark.
- Every summer the climbers head for the mountains.
