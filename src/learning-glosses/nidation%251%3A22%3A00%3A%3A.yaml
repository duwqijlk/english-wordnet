synsetId: 13517489-n
simpleMeaning: In embryology, the natural process by which a fertilized egg settles and grows into the
  lining of the womb in mammals that bear live young
scope: 'Also called implantation: the settling of a fertilized egg into the womb lining, not the joining
  of egg and sperm and not the birth itself.'
examples:
- Nidation takes place when the fertilized egg settles into the lining of the womb.
- After nidation, the egg is fixed in the womb lining and starts to grow.
