simpleMeaning: a move in which the feet go over the head, to the front or to the back, and come back down
scope: 'Also called flip and somersault: a move where the feet go over the head and come back down, not
  a plain jump or a roll along the ground.'
examples:
- Her somersaulting across the mat impressed the whole class.
- The child kept somersaulting forward and backward on the soft floor.
