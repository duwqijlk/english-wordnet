simpleMeaning: Any of several kinds of moth with long narrow front wings that can fly fast and stay still
  in the air over flowers while they feed
scope: Any of several kinds of moth with long narrow front wings that can fly fast and stay still in the
  air over flowers while they feed; hawk moth, hawkmoth, hummingbird moth and sphinx moth are other names
  for this sense, not a butterfly and not a moth that cannot stay still in the air.
examples:
- The sphingid hovered over the flowers, its long narrow wings beating fast.
- A sphingid can fly fast and stay still in the air while it feeds.
