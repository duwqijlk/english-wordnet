simpleMeaning: a bird that follows small insects as they march and looks, on the outside, like a bird
  of another kind
scope: A bird that lives near ants and looks like a bird of another kind, not a true shrike and not a
  bird that lives far from ants.
examples:
- The ant shrike called from a low branch near the ant trail.
- We saw an ant shrike hop through the bushes after the ants.
