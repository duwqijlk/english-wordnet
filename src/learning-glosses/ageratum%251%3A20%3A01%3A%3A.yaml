simpleMeaning: a plant with leaves set in pairs across the stem and small heads of blue or white flowers
scope: A plant with paired leaves and small blue or white flower heads, not the large showy blue-flowered
  plant of the southern United States.
examples:
- The ageratum in the bed has small blue flower heads.
- Her ageratum bears white flowers in small heads above paired leaves.
