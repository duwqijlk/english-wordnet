simpleMeaning: any visible gathering of gas, smoke, dust or other particles.
scope: Any visible mass of smoke, dust, gas or similar particles, not the weather cloud of water or ice
  high in the sky, nor a crowd of things.
examples:
- A cloud of dust rose from the dry road as the truck passed.
- Smoke from the chimney formed a grey cloud above the town.
