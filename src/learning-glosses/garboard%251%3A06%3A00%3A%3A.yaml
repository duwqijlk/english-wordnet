simpleMeaning: A wooden ship has a thick strip of wood that runs right beside the long beam at the very
  bottom, and this strip is the first one put on
scope: Also called garboard plank and garboard strake, this is the first strip of wood next to a ship's
  keel, not a plank higher up the side of the ship and not the keel itself.
examples:
- The shipwright checked the garboard before the rest of the hull was planked.
- Water was leaking in along the garboard where it met the keel.
