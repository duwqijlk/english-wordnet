simpleMeaning: in soccer or hockey, the player whose job is to stand at the goal and stop the other team
  from scoring
scope: Also called goalie, this is the player who guards the goal in soccer or hockey, not the place or
  job itself and not the other players on the team.
examples:
- The goalkeeper caught the ball just before it crossed the line.
- Our goalkeeper stopped three shots in the hockey game.
