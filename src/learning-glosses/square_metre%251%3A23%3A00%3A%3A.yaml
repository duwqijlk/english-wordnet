simpleMeaning: a measure of area, the size of a flat shape with four equal sides each one unit of length;
  a centiare is one hundredth of an are
scope: Also called square meter and centare, also spelt centiare; a measure of area, not a measure of
  length and not a measure of volume.
examples:
- The floor is 20 square metres in size.
- We bought 5 square metres of tiles for the kitchen.
