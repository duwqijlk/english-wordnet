schema: oewn-learning-gloss-v2
senseId: 'bromide%1:10:00::'
synsetId: 07168754-n
simpleMeaning: a remark that people have heard too often, with no new idea, so that its meaning is already
  clear to everyone
scope: 'Also called cliche, commonplace, platitude, and banality: a dull, often-heard remark, not the
  chemical salt once used as a calming drug.'
examples:
- His speech was full of bromides that everyone had heard before.
- Saying 'time will heal' was a bromide, not real help.
