simpleMeaning: A stringed music tool whose metal strings are plucked while a sliding metal bar presses
  them to make a sliding note
scope: A stringed music tool whose metal strings are plucked while a sliding metal bar presses them; not
  an ordinary guitar and not a violin.
examples:
- He played the steel guitar with a sliding metal bar.
- The steel guitar gave the song a sliding, wailing sound.
