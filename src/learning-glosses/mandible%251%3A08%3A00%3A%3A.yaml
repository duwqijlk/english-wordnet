simpleMeaning: the jaw bone in animals with a back bone, joined so it can move and open the mouth
scope: The jaw bone that moves to open the mouth, also called jowl and jawbone. It is the bone itself,
  not the chin, the teeth, or the top jaw that stays still.
examples:
- The dog's mandible moved up and down as it chewed the bone.
- A broken mandible made it hard for the cat to eat.
