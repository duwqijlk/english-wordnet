simpleMeaning: To hit or rub something hard, again and again, until it breaks into small bits
scope: 'Also called grind: to break a thing into small bits by hitting or rubbing it, not a hard time
  caused by a shortage and not the sound of crushing.'
examples:
- The cook crunched the garlic with the flat of a knife.
- They crunched the ice into small bits for the drinks.
