simpleMeaning: A bush or small tree of the south-eastern United States to the West Indies and Brazil,
  grown for its thin bunches of white flowers and orange and crimson leaves.
scope: 'Also called cyrilla, leatherwood or white titi: a bush or small tree of the south-eastern United
  States to Brazil, grown for its white flowers and orange and crimson leaves, not a tall forest tree
  and not a plant with blue flowers.'
examples:
- Cyrilla racemiflora bore thin bunches of white flowers.
- In autumn the Cyrilla racemiflora leaves turned orange and crimson.
