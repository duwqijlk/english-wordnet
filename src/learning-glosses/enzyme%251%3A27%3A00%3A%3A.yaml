simpleMeaning: any of several complex proteins that cells make, each one speeding up a certain chemical
  change in a living thing
scope: This names a protein made by living cells. It speeds up a certain chemical change in a living thing.
  It is not the cell that makes it and not the change itself.
examples:
- An enzyme in the stomach speeds up the breaking down of food.
- Without this enzyme, the chemical change in the cell would be very slow.
