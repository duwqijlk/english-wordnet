simpleMeaning: Chicken, veal, omelettes, green salads and spinach are served with these fresh fern-like
  leaves, like parsley, as a garnish.
scope: Fresh fern-like leaves used as a garnish, not the whole herb plant grown for its leaves.
examples:
- She scattered chervil over the omelette.
- Chervil garnished the green salad.
