senseId: 'control%1:18:00::'
synsetId: 09527922-n
simpleMeaning: a spirit that is believed to help a person who communicates with the dead during a meeting
  held for that purpose.
scope: This is not a switch or lever, not a policy that limits prices, and not the general act of managing
  something; it is a spirit that helps at a sitting to contact the dead.
examples:
- The medium claimed that her control was the spirit of a Victorian doctor.
- At the seance, the control answered questions through the medium's voice.
