simpleMeaning: In a relaxed way, or in a way that avoids hardship.
scope: This is the adverb 'soft' meaning in a comfortable, unhurried way, or without hardship, as in the
  fixed phrases 'sleep soft' and 'live soft'. It is not the adjective senses such as low in volume or
  yielding to pressure, and not the adverb 'softly', which describes a gentle manner rather than an easy
  life. The use is rare and somewhat dialectal or literary today.
examples:
- They lived soft in a cottage by the sea, with no clock and no debts.
- The old dog slept soft on the warm flagstones all afternoon.
