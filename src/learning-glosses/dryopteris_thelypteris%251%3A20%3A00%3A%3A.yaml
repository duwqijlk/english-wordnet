simpleMeaning: A fern with leaves cut into narrow parts like a feather, growing in wet places and found
  all over the cool lands of the north.
scope: A fern of wet places found all over the cool north, also called the marsh fern and Thelypteris
  palustris; not a fern of dry ground and not a tree fern.
examples:
- Dryopteris thelypteris grew in the wet ground by the pond.
- We found Dryopteris thelypteris in the marsh.
