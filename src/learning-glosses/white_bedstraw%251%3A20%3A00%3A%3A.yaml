simpleMeaning: From Europe and Asia comes this herb, now growing wild in North America, with loose bunches
  of many tiny pale blooms.
scope: Also called false baby's breath, infant's-breath, white madder, and wild madder, this herb of Europe
  and Asia now grows wild in North America, bearing loose bunches of tiny pale blooms.
examples:
- The field was covered with white bedstraw and its tiny pale blooms.
- Gardeners pulled up white bedstraw where it had spread.
