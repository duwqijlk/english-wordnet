simpleMeaning: the habit of being careful ahead of time, before anything goes wrong
scope: The habit of being careful before trouble comes, not a single step taken to ward off danger and
  not the careful judgment used in the moment.
examples:
- Precaution was second nature to him after years at sea.
- Her precaution saved the family from a costly mistake.
