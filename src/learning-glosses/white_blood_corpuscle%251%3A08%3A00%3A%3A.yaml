simpleMeaning: small living bits that swallow up and break down germs and fungi, and help the body defend
  itself
scope: 'Also called a white blood cell, a leucocyte, a leukocyte, a white cell or a white corpuscle: small
  bits that fight germs, not red blood cells and not germs themselves.'
examples:
- The white blood corpuscle count was high after the infection.
- White blood corpuscles help the body fight off sickness.
