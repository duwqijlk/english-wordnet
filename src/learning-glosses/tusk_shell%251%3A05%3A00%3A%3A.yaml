simpleMeaning: One of many kinds of sea animal that digs with a foot shaped like a spade and lives in
  a long tube that narrows, open at both ends.
scope: Also called a tooth shell, this sea animal digs with a foot shaped like a spade and lives in a
  long tube open at both ends.
examples:
- A tusk shell digs with its spade-shaped foot.
- The tusk shell lives in a long tube open at both ends.
