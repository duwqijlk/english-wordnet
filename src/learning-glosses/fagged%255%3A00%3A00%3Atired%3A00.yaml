senseId: fagged%5:00:00:tired:00
synsetId: 02442263-s
simpleMeaning: Drained of strength, dead tired, spent to the last.
scope: This sense is also called spent, gone, exhausted, and fatigued, for being drained of strength,
  dead tired, spent to the last, where spent means so tired that you have no energy or strength left,
  gone is worn out and extremely tired, with no energy or strength left to carry on, and exhausted is
  with no strength or power to work left at all, and too tired to do more.
examples:
- He was fagged, drained of strength.
- She was fagged, dead tired.
