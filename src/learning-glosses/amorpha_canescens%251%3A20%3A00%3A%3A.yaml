simpleMeaning: A bush of sandy woods and stream banks in the western United States, with grey downy feather-like
  flowers and dull clusters of flowers; once thought to show lead ore nearby.
scope: 'Also called lead plant and leadplant: a shrub, not a tree, and not the lead ore itself.'
examples:
- Amorpha canescens grew along the sandy stream bank.
- The old guide said Amorpha canescens marked the place where lead ore lay.
