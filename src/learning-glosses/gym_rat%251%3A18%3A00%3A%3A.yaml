simpleMeaning: Playing sports or working out in a sports hall or health spa takes up all this person's
  free time
scope: A person who spends all their free time playing sports or working out in a sports hall or health
  spa, not a coach and not someone who plays once a week.
examples:
- He is a real gym rat, at the club every night after work.
- The gym rat knew every machine in the hall by name.
