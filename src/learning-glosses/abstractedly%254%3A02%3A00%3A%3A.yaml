simpleMeaning: In a way that shows the mind is elsewhere, lost in other thoughts.
scope: Also called absently or absentmindedly; in a way that shows the mind is elsewhere.
examples:
- He read the letter abstractedly, barely taking in the words.
- She nodded abstractedly while thinking of something else.
