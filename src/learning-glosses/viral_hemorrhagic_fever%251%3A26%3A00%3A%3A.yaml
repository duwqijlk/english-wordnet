simpleMeaning: fever and stomach and gut troubles, then bleeding from small blood vessels, mark a group
  of sicknesses spread by a virus, usually found in one place
scope: 'Also called viral haemorrhagic fever, haemorrhagic fever, and hemorrhagic fever: a group of sicknesses
  spread by a virus, usually found in one place only; not a single sickness.'
examples:
- Viral hemorrhagic fever spread through the valley that summer.
- Doctors watched for viral hemorrhagic fever after the fever and gut troubles began.
