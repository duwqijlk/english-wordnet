simpleMeaning: In a way that shows no sorrow for a wrong done
scope: In a way that shows no regret for wrongdoing, not in a sorry way and not in a careless way.
examples:
- He spoke impenitently of his crimes, showing no regret.
- She stood impenitently before the court.
