simpleMeaning: Through a cut in the belly and womb, the baby is brought out by a doctor, a way of birth
  once thought to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, cesarian, abdominal delivery, caesarean, caesarean delivery, caesarean
  section, caesarian section, cesarean delivery, cesarean section, and cesarian section, this is a birth
  by a cut through the belly and womb, not a birth through the birth canal.
examples:
- A caesarian delivery was needed when labour stalled.
- They chose a caesarian delivery after the scan.
