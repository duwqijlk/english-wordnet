simpleMeaning: A North American nut with a very hard, thick woody shell.
scope: This is the hard-shelled nut of the North American nut tree, not the tree itself and not a nut
  with a thin shell.
examples:
- She cracked a black walnut and ate the meat inside.
- The black walnut had a shell too hard to crack by hand.
