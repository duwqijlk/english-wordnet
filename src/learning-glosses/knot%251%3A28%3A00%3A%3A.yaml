simpleMeaning: a measure of speed for ships and wind, one sea mile each hour, or about 1.15 land miles
  each hour
scope: A speed unit for ships and wind, not a tied rope, not a bird, and not a lump in wood.
examples:
- The ship sailed at twelve knots.
- The wind blew at twenty knots.
