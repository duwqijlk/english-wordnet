simpleMeaning: to make something stop shaking and stay firm and still
scope: This is the verb that means to make something firm and still, not doing something in a way that
  does not shake, and not holding something up to keep it firm.
examples:
- He steadied the ladder with one hand.
- She steadied herself against the wall.
