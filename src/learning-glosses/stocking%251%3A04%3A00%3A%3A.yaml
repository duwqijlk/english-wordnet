simpleMeaning: the act of putting in a supply of something, such as fish in a river or goods in a shop
scope: The act of putting in a supply of something; not the long, close-fitting clothing worn over the
  foot and leg.
examples:
- The stocking of the lake with trout took all morning.
- Regular stocking of the stream keeps plenty of fish there.
