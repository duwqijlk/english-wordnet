simpleMeaning: to set a thing up by the areas of a country it covers
scope: To set a thing up by the areas of a country it covers; territorialise is another name for this
  sense, not to add land to a country and not to make a thing into a territory.
examples:
- The railways were territorialized after the war.
- The firm territorialized its offices across the country.
