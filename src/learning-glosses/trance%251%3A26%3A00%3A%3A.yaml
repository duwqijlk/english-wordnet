simpleMeaning: a state of mind brought on by magic words, or as if by them
scope: A state of mind brought on by magic words, or as if by them; also called spell and enchantment,
  not the kind of dance music and not the sleep-like state in which a person barely acts.
examples:
- The words put her into a trance.
- He fell into a trance as if by a spell.
