simpleMeaning: a sword used in fencing, a sport where people fight with swords, with a blade shaped like
  a V and a slightly curved handle
scope: 'Also called sabre: this is the fencing sword, not the heavy curved sword for fighting, and not
  the act of cutting or killing with a sword.'
examples:
- The fencer lifted her saber before the match began.
- He held the saber by its slightly curved handle.
