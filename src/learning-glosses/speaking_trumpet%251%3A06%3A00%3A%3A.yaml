simpleMeaning: A cone-shaped aid that makes the voice louder and sends it in one way, once held to the
  ear of a person who could not hear well
scope: A cone-shaped aid that makes the voice louder and sends it in one way, once held to the ear of
  a person who could not hear well; not a musical horn and not a hearing aid worn in the ear.
examples:
- The old man held a speaking trumpet to his ear to hear the speaker.
- A speaking trumpet makes the voice louder and sends it one way.
