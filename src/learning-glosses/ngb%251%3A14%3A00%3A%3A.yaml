simpleMeaning: The office that runs the Army National Guard and the Air National Guard and keeps the Army,
  the Air Force and Guard units in touch with each other
scope: This office, also called the National Guard Bureau, runs the Army and Air National Guards and links
  them to the Army and Air Force; it is not a Guard unit itself.
examples:
- The NGB issued new guidance to the state Guard units.
- Staff at the NGB work with both the Army and the Air Force.
