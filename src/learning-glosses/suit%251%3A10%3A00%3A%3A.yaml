simpleMeaning: A request or plea put to someone more powerful or higher in rank.
scope: This is an appeal to someone above you, for help or favour; it is not a man courting a woman, and
  not a legal case in court.
examples:
- The old knight made suit to the king for his confiscated lands.
- She carried her suit to the duke, begging him to spare her brother.
