simpleMeaning: to make water cloudy by stirring up the bits that have sunk to the bottom
scope: 'Also called roil: this is about making water cloudy, not about making a person angry or annoyed.'
examples:
- His boots riled the clear stream, and the water turned cloudy.
- The net riled the pond, stirring up mud from the bottom.
