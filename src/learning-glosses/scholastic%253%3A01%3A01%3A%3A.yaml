simpleMeaning: In philosophy, about an old way of thinking that uses careful reason to study questions
  of faith and truth
scope: About this old way of thinking in philosophy; not a person who cares too much about formal rules
  and book learning, and not just about schools in general.
examples:
- He wrote a book on scholastic thought in the Middle Ages.
- The teacher explained a scholastic argument about faith and reason.
