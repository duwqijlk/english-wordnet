simpleMeaning: how dark a colour is, when it is the darkest colour of all and least like white
scope: The quality of being the darkest colour, least like white; black and blackness are other names
  for this sense, not a dark shade of blue or red and not a stain.
examples:
- The inkiness of the print made the words hard to read.
- She liked the inkiness of the black paint.
