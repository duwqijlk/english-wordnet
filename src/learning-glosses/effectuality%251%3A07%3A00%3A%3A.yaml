simpleMeaning: The power to make something happen, or to bring about a change
scope: 'Also called effectiveness, effectivity, and effectualness: the power to make something happen,
  not the speed of an act and not how easily a person is stirred up.'
examples:
- The effectuality of the treatment was clear within days.
- They praised the effectuality of the new method.
