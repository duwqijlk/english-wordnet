senseId: 'broken%3:00:02::'
synsetId: 00290849-a
simpleMeaning: Not continuous in space, time or order, or changing suddenly rather than smoothly.
scope: This is not the sense of a solid object in pieces; it describes something interrupted, uneven or
  unconnected.
examples:
- The broken line of hills stretched toward the coast.
- He spoke in a broken voice, stopping after every few words.
