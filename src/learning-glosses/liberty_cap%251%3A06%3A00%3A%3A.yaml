simpleMeaning: a hat that fits tight and comes to a point at the top, worn to show support for freedom
  in France during its Revolution and in America before 1800
scope: A pointed hat that stood for freedom in the French Revolution and early America, not a soldier's
  helmet and not a crown.
examples:
- A liberty cap was worn as a sign of freedom in the French Revolution.
- The actor put on a liberty cap for the scene set in 1790s America.
