simpleMeaning: a whole number that divides a bigger number into equal whole parts, with nothing left over
scope: 'Another name for an aliquot part: a whole number that divides another number exactly, not an aliquant
  that does not divide it exactly and not the adjective use of aliquot that means showing such a divisor.'
examples:
- 4 is an aliquot part of 12.
- Six is an aliquot of 24 because it divides 24 into equal whole parts.
