simpleMeaning: not smooth or easy in the way a person or thing moves or holds the body
scope: 'Also called clumsy, ungainly, unwieldy and gawky: not smooth in movement or in how the body is
  held, not the sense of making a heavy, dull sound.'
examples:
- The tall boy moved in a clunky way, with long arms and legs that seemed hard to control.
- After the injury, her steps were slow and clunky.
