simpleMeaning: Growing smaller is what happens to the black opening in the middle of the eye after this
  medicine
scope: 'Also called miotic, miotic drug or myotic drug: a medicine that makes the black opening in the
  middle of the eye grow smaller, not a medicine that makes it grow wider and not a word used of a thing
  that has to do with the shrinking.'
examples:
- The doctor put a myotic in her eye before the test.
- The myotic took effect within a few minutes.
