simpleMeaning: longer in one direction than the other, so not square, round, or ball-shaped
scope: Longer in one direction than the other; not the leaf shape whose sides run in almost the same direction,
  and not the noun for a flat shape itself.
examples:
- The table has an oblong top, longer one way than the other.
- She drew an oblong shape on the paper, not a circle.
