simpleMeaning: A brain illness after a sudden virus infection, especially flu or chicken pox, in young
  children, marked by fever, throwing up, confusion, coma, and a fatty liver.
scope: A brain illness of young children after a virus infection, with a coma, a sleep from which the
  child cannot wake, among its signs; not a head injury and not a brain illness present from birth.
examples:
- The doctor said the child's Reye's syndrome followed a bout of flu.
- Reye's syndrome is rare but very serious in young children.
