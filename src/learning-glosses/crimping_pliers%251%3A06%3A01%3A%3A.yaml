simpleMeaning: A hand tool used to join two pieces of bendable stuff, usually a wire and a metal plate,
  by pressing one or both out of shape so they hold together.
scope: This is a hand tool for joining metal parts, not a tool for curling hair; also called crimper.
examples:
- She gripped the wire with crimping pliers.
- The crimping pliers joined the wire to the plate.
