schema: oewn-learning-gloss-v2
senseId: 'instill%2:31:01::'
synsetId: 00607995-v
simpleMeaning: to teach something by saying it again and again, or by giving strong warnings, until it
  stays in a person's mind
scope: To teach something by saying it again and again, or by giving strong warnings, until it stays in
  a person's mind; infuse is another name for this sense, not to teach in one lesson, and not to force
  a belief.
examples:
- Good teachers instill a love of reading in children.
- Her parents instilled in her the habit of saving money.
