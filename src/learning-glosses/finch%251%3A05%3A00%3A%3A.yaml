simpleMeaning: One of many kinds of small birds that sing, with a short, strong beak made for crushing
  seeds
scope: This names the small seed-eating bird itself, with its short, strong beak; it is not a large bird
  and not a bird that eats mostly other animals.
examples:
- A small finch sat on the branch, breaking open seeds with its short beak.
- We saw bright yellow finches at the bird feeder in the garden.
