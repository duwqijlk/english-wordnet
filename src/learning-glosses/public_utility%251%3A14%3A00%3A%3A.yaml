simpleMeaning: A firm that runs a service for all and must follow state rules
scope: This is a firm that serves everyone and must follow government rules; public-service corporation
  and public utility company are other names for it, not a private firm run for its owners.
examples:
- The public utility cut off the water for repairs.
- Our public utility is owned by the city.
