simpleMeaning: A round turning part with a rubber ring, a metal edge, and a cover over its middle, that
  moves a motor vehicle along.
scope: A round turning part that moves a motor vehicle along, not a steering wheel and not a spare tyre
  kept in the boot.
examples:
- The car wheel spun on the wet road.
- He changed the car wheel after the tyre went flat.
