simpleMeaning: an animal with no bones in its back, with a soft body that is not in parts, usually inside
  a hard outer covering
scope: Also called shellfish, and another name for this sense is mollusc. It is the soft animal that usually
  has a shell, not a fish with bones inside its body.
examples:
- A snail is a mollusk that carries its shell on its back.
- The mollusk in the shallow water hid inside its hard shell.
