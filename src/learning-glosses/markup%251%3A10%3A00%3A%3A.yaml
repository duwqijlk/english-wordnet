simpleMeaning: Detailed notes about style for setting a text in print; notes written by hand are usually
  on the copy, for example a line under words to be printed slanted
scope: These are notes for printing a text, not the amount a price is raised, and not code tags used in
  a computer file.
examples:
- The editor's markup showed which words should be in italics.
- Please follow the markup on the copy when you set the page.
