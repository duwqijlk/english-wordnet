simpleMeaning: a set of machines used to put out radio or television signals
scope: 'Also called a transmitter: a set of machines that puts out radio or television signals, not a
  person who sends a letter or a message.'
examples:
- The radio sender sent its signal over the whole town.
- A stronger sender let the television station reach homes far away.
