simpleMeaning: Soft stuff that springs back when pressed, put inside a thing to fill it, to shape it,
  to guard it, or to soften it.
scope: Also called padding, soft stuff put inside a thing to fill, shape, guard, or soften it.
examples:
- The cushioning inside the chair had gone flat.
- Extra cushioning made the helmet fit well.
