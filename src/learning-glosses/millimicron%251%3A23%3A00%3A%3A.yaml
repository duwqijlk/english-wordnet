simpleMeaning: To count a length, you use this metric unit, one billionth of a metre
scope: A metric unit of length, one billionth of a metre, also called micromillimeter, micromillimetre,
  nanometer, nanometre and nm; not the millimeter, a much larger unit, and not a unit of area.
examples:
- The film was only a few millimicrons thick.
- Dust specks measured in millimicrons settled on the lens.
