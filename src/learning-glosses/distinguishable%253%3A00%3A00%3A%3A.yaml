senseId: 'distinguishable%3:00:00::'
synsetId: 00584665-a
simpleMeaning: able to be seen or known as different from something else
scope: Able to be told apart from something else. Not exactly the same as it, and not so like it that
  you cannot tell the two apart.
examples:
- The two birds look almost the same, but their songs are distinguishable.
- In the dark, only the tall tower was distinguishable.
