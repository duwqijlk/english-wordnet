senseId: 'igniter%1:06:00::'
synsetId: 03671917-n
simpleMeaning: A gadget for setting fuel, charges, or fires alight.
scope: This sense is also called a light and a lighter, for a gadget for setting fuel, charges, or fires
  alight, where a light is a device that makes a flame to set fire to fuel, an explosive charge, or a
  fire, and a lighter is a thing that makes a flame to light fuel or a fire, or to set off a charge, unlike
  the sense for a substance used to kindle a fire.
examples:
- The igniter set the fuel alight.
- Igniters set charges alight.
