simpleMeaning: a thick paste to eat, made by mashing chickpeas with sesame paste, lemon juice, and garlic,
  served above all as a dip for flat bread, from the Middle East
scope: 'Also called hummus, humus, hommos, and humous: a thick chickpea spread, not a bean dip and not
  a cheese spread.'
examples:
- We ate hoummos with flat bread at the market stall.
- She made hoummos by mashing chickpeas with lemon juice and garlic.
