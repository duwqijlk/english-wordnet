scope: A night-flying insect from Europe whose young in America bore into the stems and tops of maize
  and other plants; corn borer, corn borer moth and Pyrausta nubilalis are other names for it, not an
  insect that eats leaves and not a moth of Asia.
examples:
- The European corn borer moth came from Europe.
- The young of the European corn borer moth bore into the corn stems.
