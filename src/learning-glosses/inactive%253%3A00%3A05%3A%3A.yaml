simpleMeaning: used for things like volcanoes that are not throwing out hot rock now, but could do so
  again
scope: 'Also called dormant: used for things like volcanoes that are quiet now but could throw out hot
  rock again. Not a thing in chemistry that takes no part in a change, and not a thing lying unused.'
examples:
- The inactive volcano has not thrown out rock for a hundred years, but it may wake one day.
- They live near an inactive volcano that looks quiet and safe.
