senseId: 'regurgitation%1:04:00::'
synsetId: 00119553-n
simpleMeaning: The stomach throwing its contents back up into the mouth, on its own and without being
  meant.
scope: Also called vomit, vomiting, puking, or emesis, this is the stomach throwing its contents back
  up into the mouth, not the bringing back of something learned by heart and not blood flowing back through
  a faulty heart valve.
examples:
- Regurgitation woke the baby, milk coming back into its mouth.
- He felt regurgitation after the rich meal, food rising in his throat.
