simpleMeaning: a small animal that digs holes in the ground and lives in dry land in the southwest of
  the United States
scope: A small hole-digging animal of the dry southwest of the United States, not a rat of the desert
  and not a small animal that lives in houses.
examples:
- A cactus mouse darted into its hole as we walked past.
- The cactus mouse lives in the dry lands of the southwest.
