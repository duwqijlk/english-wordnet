simpleMeaning: a bad headache to do with the blood vessels that comes back again and again, and women
  get it more often than men
scope: A bad headache that keeps coming back, to do with the blood vessels; migraine, hemicrania and sick
  headache are other names for this sense, not a headache from a blow, and not a dull ache that never
  leaves.
examples:
- Her megrim returned each month, a bad headache that kept her in a dark room.
- He took medicine as soon as the megrim began, before the pain grew worse.
