simpleMeaning: For womb lining growing out of place, and in pills that stop pregnancy, this man-made copy
  of the body's pregnancy chemical is used, sold under a trade name.
scope: Also called norethandrolone and norethindrone acetate, it is sold under a trade name and used both
  in pills that stop pregnancy and to treat womb lining growing out of place.
examples:
- The pill had norethindrone in it.
- For womb lining growing out of place, the treatment used norethindrone.
