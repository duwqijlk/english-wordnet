simpleMeaning: A way of keeping a firm's books in which each sum is written down when it is earned or
  owed, not when the money comes in or goes out.
scope: In this way of keeping a firm's books, a sum goes in when it is earned or owed, not when the money
  comes in or goes out.
examples:
- Our firm keeps its books on an accrual basis, writing each sum down when it is earned.
- The firm wrote the sum down on an accrual basis as soon as it was earned, before any money came in.
