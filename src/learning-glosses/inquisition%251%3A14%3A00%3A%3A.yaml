simpleMeaning: A past court of the Roman Catholic Church, from 1232 to 1820, set up to find and stop beliefs
  held to be false.
scope: A past Church court that sought out false belief, not a modern court and not a general asking of
  questions.
examples:
- The Inquisition tried men for heresy in Spain.
- Fear of the Inquisition kept many silent.
