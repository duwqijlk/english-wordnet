simpleMeaning: The act of making someone calm and friendly, and getting past their doubt and bad feeling
scope: This is making someone calm and friendly again, after doubt and bad feeling; conciliation and placation
  are other names for this sense, not the act of making up for a sin or wrong done to a god.
examples:
- His gift was an act of propitiation after the long quarrel.
- She offered a public propitiation to win back the trust of her neighbours.
