simpleMeaning: to cut points like teeth into the edge of something, so that the edge has sharp points
  for cutting
scope: To cut points into an edge; not a slit in old clothing and not a loose flap on old clothing.
examples:
- He jagged the edge of the metal sheet with a file.
- She jagged the wood to make a row of sharp teeth.
