simpleMeaning: a clear liquid chemical made from a gas, with a part made of carbon and nitrogen, that
  can still join to other things
scope: 'Also called acrylonitrile or vinyl cyanide: a clear liquid chemical, not the gas it is made from
  and not a finished plastic.'
examples:
- The tank holds propenonitrile, a clear liquid made from propene gas.
- Propenonitrile is a clear liquid chemical that can still join to other things.
