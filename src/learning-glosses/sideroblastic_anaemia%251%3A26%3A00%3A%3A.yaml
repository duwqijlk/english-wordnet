simpleMeaning: a blood illness that does not get better with treatment, marked by young red blood cells
  holding iron in the soft inner part of bones
scope: A blood illness that does not get better with treatment, also called sideroblastic anemia, siderochrestic
  anaemia, or siderochrestic anemia; not a blood illness from too little iron and not a short illness
  of the blood.
examples:
- The doctor said she had sideroblastic anaemia.
- Sideroblastic anaemia does not get better with the usual treatment.
