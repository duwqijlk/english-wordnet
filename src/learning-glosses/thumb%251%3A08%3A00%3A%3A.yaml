simpleMeaning: the short thick finger on the inside of a hand, the first of the five fingers
scope: This is the finger itself, not a shaped strip on wood or stone and not the part of a glove that
  covers this finger.
examples:
- She hurt her thumb when she shut the door on her hand.
- He held the cup between his thumb and his other fingers.
