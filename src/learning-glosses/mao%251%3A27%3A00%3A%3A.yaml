simpleMeaning: An enzyme that speeds the breaking down by oxygen of many body chemicals, such as epinephrine,
  norepinephrine and serotonin.
scope: 'Also called monoamine oxidase: an enzyme that breaks down body chemicals by oxygen, not the body
  chemicals themselves.'
examples:
- MAO breaks down serotonin in the body.
- The lab measured MAO in the blood sample.
