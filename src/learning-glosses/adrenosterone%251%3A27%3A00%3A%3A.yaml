simpleMeaning: A chemical made by the body, of the kind that acts like the male sex chemical, taken from
  the outer part of the small gland above the kidney.
scope: What sets this body chemical apart is that it acts like the male sex chemical and comes from the
  outer part of the small gland above the kidney.
examples:
- The adrenosterone in the sample acted like the male sex chemical.
- The lab traced the adrenosterone back to the small gland above the kidney.
