senseId: 'stagnant_hypoxia%1:26:00::'
synsetId: 14065245-n
simpleMeaning: too little air in the body parts, from slow blood flow at the edges of the body, as after
  the heart fails to pump well
scope: Too little air in the body parts, from slow blood flow at the edges of the body, as after the heart
  fails to pump well; ischemic hypoxia is another name for this sense, not a lack of air from thin mountain
  air and not too little air in the blood alone.
examples:
- Stagnant hypoxia left his feet cold and pale.
- The nurse watched for stagnant hypoxia after the heart trouble.
