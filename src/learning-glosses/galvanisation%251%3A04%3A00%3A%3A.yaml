simpleMeaning: Either the work of covering a thing with metal by using an electric flow, or the work of
  coating iron with zinc to keep it from rust.
scope: This is the work of covering a thing with metal by an electric flow, or of coating iron with zinc,
  also called galvanization; not painting, and not dipping iron in melted tin.
examples:
- Galvanisation keeps the iron gate from rusting.
- The factory does galvanisation of steel parts.
