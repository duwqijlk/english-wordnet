simpleMeaning: a herb like parsley, used to add taste to food or to make a dish look good
scope: 'Also called cilantro: a herb used to add taste to food or make it look good, not the living plant
  as a whole and not its dried seeds.'
examples:
- She put fresh coriander on top of the soup before serving it.
- Add some chopped coriander to the salad to give it more taste.
