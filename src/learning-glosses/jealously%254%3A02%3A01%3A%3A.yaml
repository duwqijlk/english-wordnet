simpleMeaning: in a way that shows you want what another person has and feel bad because they have it
scope: 'Also called enviously and covetously: done in a way that shows you want what another person has.
  Not just done with a wish to keep what is yours, with no wanting of another person''s things.'
examples:
- He looked jealously at his friend's new car.
- She watched jealously as her sister showed off the prize she wanted for herself.
