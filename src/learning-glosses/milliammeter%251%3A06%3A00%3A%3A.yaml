simpleMeaning: A tool that measures electric current, and can pick up very small currents, marked in thousandths
  of an ampere
scope: A tool for measuring very small electric currents, not a tool for measuring larger currents and
  not a tool for measuring voltage.
examples:
- He read the milliammeter to check the tiny current in the circuit.
- The milliammeter showed only a few thousandths of an ampere.
