simpleMeaning: A deciduous South African tree with large leaves of paired leaflets and one at the end
  and many fragrant orange-yellow flowers; it gives red juice and heavy, strong, lasting wood.
scope: Also called bloodwood tree and kiaat; a deciduous tree of South Africa with large leaves of paired
  leaflets and one at the end, many fragrant orange-yellow flowers, red juice and heavy, strong, lasting
  wood.
examples:
- Pterocarpus angolensis shed its leaves in the dry season, its orange flowers bright against the bare
  branches.
- The wood of Pterocarpus angolensis is heavy and strong, used for fine furniture.
