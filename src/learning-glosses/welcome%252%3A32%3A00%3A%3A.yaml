simpleMeaning: To meet someone in a friendly way when they arrive.
scope: This is not the adjective meaning pleasing or gladly accepted, and not the noun for the friendly
  feeling you receive; it is the act of meeting and greeting someone.
examples:
- She welcomed the guests at the door.
- They welcomed us with warm smiles.
