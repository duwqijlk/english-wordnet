simpleMeaning: someone who tugs or drags something to try to move it
scope: 'Also called dragger: a person who tugs or drags something to move it, not a tool or machine that
  does this work.'
examples:
- The puller held the rope tight and leaned back with all his strength.
- Each puller took hold of the cart and dragged it up the hill.
