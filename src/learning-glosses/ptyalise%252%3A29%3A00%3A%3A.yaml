senseId: 'ptyalise%2:29:00::'
synsetId: 00101710-v
simpleMeaning: To force spit or thick wet stuff out of the mouth
scope: This is forcing spit or thick wet stuff out of the mouth, also called spit, spew, ptyalize or spue;
  not swallowing, and not coughing up from the chest.
examples:
- He ptyalised on the pavement after tasting the sour milk.
- The old man ptyalised into a cup at the dentist.
