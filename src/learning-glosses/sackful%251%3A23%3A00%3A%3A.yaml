simpleMeaning: the amount of a thing that fills one sack
scope: Also called a sack, this is the amount that fills one sack, not the sack itself and not a small
  part of what is in it.
examples:
- She bought a sackful of potatoes at the market.
- He carried a sackful of apples into the kitchen.
