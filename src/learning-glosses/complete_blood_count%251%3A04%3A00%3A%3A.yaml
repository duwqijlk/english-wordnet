synsetId: 00654218-n
simpleMeaning: a test that finds how many white cells, red cells, and platelets, tiny bits that help cuts
  stop bleeding, are in one cubic millimeter of a sample
scope: A test that finds how many white cells, red cells, and platelets are in a tiny amount of a sample,
  also called a blood profile; not a test that finds a person's type and not a test for one illness.
examples:
- The doctor ordered a complete blood count to check her white cells.
- His complete blood count showed too few platelets.
