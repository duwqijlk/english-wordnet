simpleMeaning: The main part of a higher plant that makes food from light and lets water out into the
  air
scope: The main part of a higher plant, not a sheet of paper in a book and not a stem.
examples:
- The leaf turned yellow in the autumn.
- The leaf makes food for the plant from sunlight.
