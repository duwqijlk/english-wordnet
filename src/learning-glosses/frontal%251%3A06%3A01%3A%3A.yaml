simpleMeaning: a piece of cloth hung to cover the front of an altar (a special table in a church)
scope: A cloth for the front of an altar, not the pretty thing worn on the forehead and not the word for
  the front part of something.
examples:
- The white frontal covered the front of the altar for the Sunday service.
- They changed the frontal to a green one for the new season.
