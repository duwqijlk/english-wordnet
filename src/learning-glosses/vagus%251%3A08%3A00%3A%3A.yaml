simpleMeaning: the stomach, food pipe, heart, lungs, voice box, and throat, and most of the belly's inner
  parts, are all served by this mixed nerve
scope: Also called nervus vagus, pneumogastric, pneumogastric nerve, tenth cranial nerve, vagus nerve,
  and wandering nerve; this mixed nerve serves many parts from throat to belly, not a nerve of the leg
  and not one that works a single part.
examples:
- The vagus runs from the brain down to the stomach and heart.
- Damage to the vagus can upset the heart, lungs, and belly.
