simpleMeaning: A part of a computer that holds and turns a disk and reads and writes what is stored on
  it, whether it works by magnets or by light.
scope: It is also called disc drive and disk drive, and it reads and writes what is stored on a turning
  disk.
examples:
- The hard drive in my laptop holds all my photos.
- When the hard drive failed, the computer could no longer find its files.
