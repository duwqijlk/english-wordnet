simpleMeaning: Used to wash with or to let water run through, the dry, stringy part of the fruit of a
  plant of the group Luffa.
scope: Also called loofah, loofa, and luffa, people wash with this dried fruit part or let water run through
  it to strain.
examples:
- She washed her back with a loufah sponge.
- He cleaned the pan with a loufah sponge.
