simpleMeaning: The eggs of these big-footed, short-winged birds of Australasia hatch in the warmth of
  a mound of rotting plants they build.
scope: 'Also called megapode, mound-bird, mound builder, and scrub fowl: its eggs are warmed by a mound
  of rotting plants.'
examples:
- Mound birds build mounds of rotting plants to warm their eggs.
- The mound bird lays its eggs in the warm mound.
