simpleMeaning: One of the long main feathers that stick out along the outer edge of a bird's wing.
scope: This is not a small body feather and not a tail feather; it is one of the strong flight feathers
  at the outer edge of the wing.
examples:
- The hawk's primaries were damaged, so it could not fly well.
- You can tell the species by the black tips on its primaries.
