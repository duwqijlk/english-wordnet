simpleMeaning: A long-lived plant with sharply toothed triangular leaves on leafy stems bearing a cluster
  of yellow flower heads; found in moist places in the mountains of western North America.
scope: Also called arrowleaf groundsel; not a plant with smooth leaves and not a plant of dry plains.
examples:
- The Senecio triangularis grew yellow heads in the damp mountains.
- We saw Senecio triangularis with triangular leaves on the trail.
