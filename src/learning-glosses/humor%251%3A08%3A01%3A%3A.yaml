simpleMeaning: In the Middle Ages, one of the four liquids in the body. People thought the amount of each
  one decided how a person felt and how well they were
scope: 'Also called humour: in the Middle Ages, one of four body liquids thought to control health and
  feeling, not the part of a person that enjoys funny things and not a joke that makes people laugh.'
examples:
- In the Middle Ages, doctors thought too much of one humor in the body made a person ill.
- People once named blood as one of the four humors in the body.
