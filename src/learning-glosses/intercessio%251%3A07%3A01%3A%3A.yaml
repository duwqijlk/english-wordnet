simpleMeaning: In ancient Rome, the power of a high office holder to stop a law or a ruling
scope: In ancient Rome, the power of a high office holder to stop a law or a ruling; not a vote to pass
  a law and not a power held by the people.
examples:
- The tribune used his intercessio to block the new tax law.
- An intercessio by one magistrate could stop the work of another.
