simpleMeaning: A stretch of history that stands out because of its special character or because it is
  counted from a particular point or event.
scope: This is a span of history defined by its character or a starting point, not a division of geological
  time.
examples:
- The discovery marked the beginning of a new era in medicine.
- We are living in an era of rapid technological change.
