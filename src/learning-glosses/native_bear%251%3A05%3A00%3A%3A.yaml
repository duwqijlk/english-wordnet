simpleMeaning: A slow-moving, tailless Australian marsupial that lives in trees, has grey fur and furry
  ears, and eats eucalyptus leaves and bark.
scope: Another name for the koala, koala bear and kangaroo bear, an Australian tree-dwelling marsupial;
  not a wombat, a possum or a true bear.
examples:
- A native bear has grey fur, furry ears and no tail.
- The native bear feeds on eucalyptus leaves and bark.
