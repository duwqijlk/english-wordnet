simpleMeaning: the body parts that work together to make babies and to make urine and pass it out
scope: 'Also called urinary apparatus, urogenital apparatus, urogenital system, genitourinary apparatus,
  genitourinary system, apparatus urogenitalis and systema urogenitale: the body parts that work together
  to make babies and to make and pass urine, not only the kidneys and not only the sex organs.'
examples:
- The doctor said his urinary system was healthy after the check.
- The urinary system joins the parts for making babies with the parts for making urine.
