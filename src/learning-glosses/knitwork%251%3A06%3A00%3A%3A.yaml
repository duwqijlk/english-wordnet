scope: This is work made by joining yarn in linked loops, by hand or by machine, also called knitting
  and knit, not woven cloth and not crochet, which uses a hooked tool.
examples:
- Her knitwork covered the whole table in soft loops of wool.
- The shop sold knitwork made on a machine as well as by hand.
