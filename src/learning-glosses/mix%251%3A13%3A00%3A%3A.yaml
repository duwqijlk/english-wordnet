simpleMeaning: a blend of dry ingredients put together by a company and sold ready to use
scope: This is not the act of combining things, and not a blend of fresh or liquid foods; it is a packaged
  dry blend sold for cooking.
examples:
- She bought a cake mix and only had to add eggs and milk.
- The soup mix makes a quick lunch on cold days.
