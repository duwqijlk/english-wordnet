schema: oewn-learning-gloss-v2
senseId: 'mutate%2:30:00::'
synsetId: 00119681-v
simpleMeaning: to go through a change in the basic material inside cells that controls how a living thing
  is made and grows
scope: This is a change in a living thing or its cells; it is not a normal change in shape or size as
  a thing grows.
examples:
- The virus can mutate quickly and become harder to stop.
- These cells may mutate and no longer work in the normal way.
