simpleMeaning: a liquid for cleaning the skin and making pores (the tiny holes in the skin) smaller
scope: This sense is a liquid for the skin, not the black or coloured powder used in a printer and not
  a liquid that changes the colour of a photo.
examples:
- After washing her face, she put toner on a cotton pad and wiped her skin.
- This toner cleans the skin and makes the pores feel tight.
