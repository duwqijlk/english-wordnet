simpleMeaning: A shrub of the eastern United States that drops its leaves each year, with leaves and bark
  that smell very strong, yellow flowers, and then bright red or yellow berries.
scope: A shrub of the eastern United States with strong-smelling leaves, also called spice bush, spicebush,
  American spicebush, Benjamin bush and Benzoin odoriferum; not a true spice tree and not a garden lilac.
examples:
- Lindera benzoin grows in the woods of the eastern United States.
- The leaves of Lindera benzoin smell strong when you crush them.
