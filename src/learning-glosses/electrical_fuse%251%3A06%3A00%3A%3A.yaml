simpleMeaning: Too much power running through it makes this part break the flow of power
scope: 'Also called fuse: when too much power runs through it, this part breaks the flow of power, not
  a switch that a person turns by hand and not a wire that only carries power.'
examples:
- When the heater drew too much power, the electrical fuse cut the power.
- We changed the electrical fuse after it stopped the power to the kitchen.
