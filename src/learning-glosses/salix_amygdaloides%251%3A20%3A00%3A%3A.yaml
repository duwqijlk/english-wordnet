simpleMeaning: Its leaves look like those of peach trees or almond trees, and this willow grows in the
  west of the United States.
scope: Also called almond-leaves willow, peach-leaved willow and peachleaf willow; a willow of the west
  of the United States with leaves like those of peach or almond trees, not the Old World willow grown
  to make baskets.
examples:
- Salix amygdaloides grows in the west of the United States.
- The leaves of Salix amygdaloides look like those of a peach tree.
