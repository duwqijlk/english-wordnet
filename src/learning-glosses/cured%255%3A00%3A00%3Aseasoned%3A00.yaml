simpleMeaning: of concrete or mortar, kept damp to help it harden
scope: Of concrete or mortar kept damp to help it harden, not rubber treated to improve it, and not tobacco,
  meat, or hay left to keep.
examples:
- The workers kept the cured concrete damp for a week so it would harden well.
- They covered the cured slab with wet cloth to keep it damp.
