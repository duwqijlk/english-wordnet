simpleMeaning: Where a nail should stay joined to the skin beneath it, it comes away instead
scope: A nail coming loose from the skin under it, not a nail that breaks and not a nail that grows in
  a strange shape.
examples:
- Onycholysis made her thumbnail lift away from the skin beneath it.
- The doctor saw onycholysis on two of his fingernails.
