simpleMeaning: A North American plant that lives for years, with leaves used as medicine, sometimes put
  in the group called Cassia.
scope: This North American plant lives for years and is known for leaves used as medicine, sometimes placed
  in the group called Cassia; wild senna and Cassia marilandica are other names for this sense.
examples:
- Senna marilandica grows wild in the meadows of North America.
- The leaves of Senna marilandica were once used as medicine.
