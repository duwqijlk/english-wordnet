simpleMeaning: A fine style of writing of the Elizabethan time, marked by even turns and set-against pairs
  and same-sound starts and likenings, with nods to nature and old tales.
scope: Of an elegant prose style of the Elizabethan period, marked by balance, antithesis, alliteration,
  and long similes with nods to nature and myth.
examples:
- Euphuisms balance turns and pairs.
- The euphuism marks Elizabethan writing.
