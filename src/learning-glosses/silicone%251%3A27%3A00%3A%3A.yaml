simpleMeaning: One of many kinds of substance that stay unchanged in very hot and cold temperatures, used
  in lubricants (things that help parts move), glues, coatings, man-made rubber and electrical insulation
scope: 'Also called silicone polymer: this is a substance that stays the same in heat and cold, not silicon,
  the hard material used in computer parts.'
examples:
- This cooking tool is made of silicone and can stand very high heat.
- Silicone around the wires helps stop electricity from passing where it should not.
