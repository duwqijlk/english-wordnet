simpleMeaning: In nonhuman mammals, a condition or time of greater sexual excitement and activity.
scope: This is the breeding state of animals, not warmth or a form of energy, and not a qualifying race.
examples:
- The mare comes into heat in early summer.
- Males compete for access to females that are in heat.
