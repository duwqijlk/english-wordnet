simpleMeaning: a substance that lies between two points, and that signals can move through, so people
  can send and get messages
scope: This is the material that signals move through so messages can travel. It is not a way of storing
  facts and news, such as a book, and not a substance that helps a job get done.
examples:
- Air is the medium through which these radio signals travel.
- The cable provides a medium for signals to reach many homes.
