simpleMeaning: Coming from God's care for the world.
scope: Also called divine, this is coming from God's care for the world, not the use for a thing so lucky
  or so fitting it seems sent by God, and not the use for what has to do with God's care in general.
examples:
- The visit was providential, a gift of God's care.
- Her recovery was providential, a blessing from God's care.
