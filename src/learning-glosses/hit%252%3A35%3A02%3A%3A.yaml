simpleMeaning: Make a sound or a piece of music by pressing the keys or playing the strings of a musical
  instrument.
scope: This is not a planned attack, unwanted sexual attention or a sudden harmful effect; it is making
  music on an instrument.
examples:
- She hit a wrong note during the piano recital.
- He hit the strings of his guitar and the room fell silent.
