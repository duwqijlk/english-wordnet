simpleMeaning: a stubborn way of acting in which a person, on purpose, will not obey rules or let others
  guide them
scope: 'Also called perversity and perverseness: a stubborn, on-purpose refusal to obey or be guided.
  It is not the other sense about being fussy and odd in character.'
examples:
- Out of sheer contrariness, he refused to follow any of the teacher's advice.
- Her contrariness made her argue against every rule the group set.
