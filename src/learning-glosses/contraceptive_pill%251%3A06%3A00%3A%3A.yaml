synsetId: 03943171-n
simpleMeaning: Estrogen and progestin inside a tablet stop a woman from becoming pregnant, by keeping
  her ovaries from letting an egg go.
scope: This is the hormone tablet a woman takes by mouth to stop pregnancy, also called the pill, anovulant,
  anovulatory drug, birth control pill, oral contraceptive, or oral contraceptive pill.
examples:
- She takes a contraceptive pill to stop herself from becoming pregnant.
- A contraceptive pill holds two hormones that stop an egg from being set free.
