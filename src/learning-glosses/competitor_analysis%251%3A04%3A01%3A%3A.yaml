simpleMeaning: In marketing and business planning, a study of what firms that rival you now or may rival
  you later do well and do badly
scope: In marketing and business planning, a study of what firms that rival you now or may rival you later
  do well and do badly; not a study of your own firm and not a plan for selling.
examples:
- The team did a competitor analysis before they set their prices.
- A competitor analysis showed what rival firms do well and do badly.
