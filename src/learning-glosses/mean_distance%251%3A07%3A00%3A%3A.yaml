simpleMeaning: the average of the greatest and least measures of how far a moon or other body that circles
  a larger body is from it
scope: The average of the greatest and least distances of a body from the one it circles; not the greatest
  distance alone, and not the least.
examples:
- The mean distance of the Moon from Earth is about 384,000 kilometres.
- Astronomers worked out the mean distance of the new moon from its planet.
