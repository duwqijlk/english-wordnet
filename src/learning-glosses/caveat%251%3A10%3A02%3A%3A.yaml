simpleMeaning: In law, a formal note put in with a court or officer to stop a case until the person who
  put it in can be heard
scope: In law, a formal note that stops a court case until its maker can be heard; not a general warning
  or a condition added to a deal.
examples:
- The lawyer filed a caveat to stop the will being dealt with until the family could be heard.
- A caveat was put in with the court, so the case had to wait for a hearing.
