simpleMeaning: To use a sextant, a handheld instrument that measures angles to the stars or sun, to work
  out how high a heavenly body is above the horizon.
scope: This is the navigator's use of a sextant to find how high the sun or a star stands, not taking
  a photograph and not firing a weapon.
examples:
- The navigator shot the sun at noon to fix our position.
- Sailors still shoot a star with a sextant when the electronics fail.
