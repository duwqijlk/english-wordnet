schema: oewn-learning-gloss-v2
senseId: 'acceptor%1:18:00::'
synsetId: 09779015-n
simpleMeaning: A person or organisation that agrees to pay a cheque or written order to pay, and so must
  pay the person named in it when the time comes.
scope: Not the chemical that takes in electrons and not a person who simply takes a gift.
examples:
- The bank acted as acceptor of the draft and paid it at maturity.
- As acceptor, the bank must pay the draft when it falls due.
