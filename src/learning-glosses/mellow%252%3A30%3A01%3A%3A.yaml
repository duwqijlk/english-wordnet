simpleMeaning: to make a person softer and gentler in feeling and in the way they act
scope: To make a person gentler and calmer in feeling, not to make fruit softer and riper and not to become
  relaxed and easygoing.
examples:
- Age and experience mellowed him over the years.
- Travel mellowed her views about other countries.
