simpleMeaning: A plant with one to four white bell-shaped flowers on stems; bulbs edible in hard times,
  eastern Montana and western North Dakota south to northern Arizona and northwestern New Mexico.
scope: Not other lilies with white flowers, nor other plants with edible bulbs; also called sego lily.
examples:
- Calochortus nuttallii grows in the west.
- The bulbs of Calochortus nuttallii are edible.
