simpleMeaning: a New Zealand tree that loses its leaves in winter, whose inner bark gives a strong fibre
  like flax, called New Zealand cotton
scope: Also called ribbonwood; not the small New Zealand shrub with paper-white flowers that shares the
  name ribbonwood.
examples:
- The ribbon tree loses its leaves each winter.
- They spun the ribbon tree's inner bark into a strong fibre.
