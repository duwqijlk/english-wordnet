simpleMeaning: a rich sweet loaf made with equal weights of butter, sugar, and flour
scope: This is a rich sweet loaf made with equal weights of butter, sugar, and flour, not a light sponge
  loaf and not a loaf made with fruit or nuts.
examples:
- She baked a pound cake for the party and served it with tea.
- A slice of pound cake is rich and sweet.
