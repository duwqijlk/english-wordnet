simpleMeaning: Heat made by a fire lit outside a round tube or spinning wheel turns into power to move
  things in this machine.
scope: This machine turns heat into power to move things, with the fire lit outside the part where the
  heat is turned into power.
examples:
- A steam engine is an external-combustion engine because its fire burns outside the cylinder.
- In an external-combustion engine, heat made outside the chamber drives the machine.
