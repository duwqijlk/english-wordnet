simpleMeaning: Small cubes of meat, soaked in a tasty sauce first, then cooked on a long thin rod, usually
  with pieces of vegetable on the rod too.
scope: Also called kebab and shish kebab; small cubes of meat, soaked in a tasty sauce first, then cooked
  on a long thin rod, usually with pieces of vegetable on the rod too, not a stew or a roast.
examples:
- We grilled kabobs over charcoal for dinner.
- She ordered a kabob with peppers and onions.
