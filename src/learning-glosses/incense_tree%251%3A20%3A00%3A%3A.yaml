simpleMeaning: Gum or sap that is burned to make a sweet smell in the air comes from a warm-climate tree
  of the Burseraceae group, one of various kinds
scope: These trees give off sweet smelling gums or saps for burning, unlike the incense cedar, whose wood
  itself smells sweet.
examples:
- The incense tree gave off a gum that was burned for its sweet smell.
- Incense tree resin gives off a sweet smell when it is burned.
