simpleMeaning: an illness caused by a large flat worm, Fasciolopsis buski, living in the gut, common in
  eastern Asia
scope: This is an illness from a large gut worm; not a stomach upset from bad food and not a worm in the
  skin.
examples:
- Fasciolopsiasis is common in parts of eastern Asia.
- Doctors found fasciolopsiasis in patients from eastern Asia.
