simpleMeaning: rough food, fed above all to farm animals, made from whole plants or the leaves and stalks
  of a grain crop
scope: Rough feed for farm animals, made from whole plants or grain stalks; not soldiers treated as expendable,
  and not the act of feeding animals.
examples:
- The farmer stored fodder in the barn for the winter.
- They cut the fodder from whole plants and fed it to the cattle.
