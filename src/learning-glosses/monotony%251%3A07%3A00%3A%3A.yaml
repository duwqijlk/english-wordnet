senseId: 'monotony%1:07:00::'
synsetId: 04747566-n
simpleMeaning: the way a thing stays the same, in a repeated pattern, with no change, so it makes people
  feel tired and bored
scope: 'Also called sameness and humdrum: the quality of staying the same with no change. Not the quality
  of a voice or sound staying at the same level.'
examples:
- The monotony of the long drive made him sleepy.
- She broke the monotony of work by taking a walk at lunch.
