simpleMeaning: A decorative projection, one of a pair, that rises above the panel over each rear wheel
  of a car.
scope: This is the decorative car part, not a swimming shoe, a fish's body part, or a window slat.
examples:
- The old sedan still had chrome fins above its rear wheels.
- One fin was bent after the car scraped a post.
