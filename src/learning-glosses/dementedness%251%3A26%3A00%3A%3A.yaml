schema: oewn-learning-gloss-v2
senseId: 'dementedness%1:26:00::'
synsetId: 14418807-n
simpleMeaning: a slow loss of the mind's power, caused by a fault in the body or by a fault in how the
  mind works
scope: This is a loss of the mind's power from a cause in the body or in how the mind works; dementia
  is another name for this sense, not a short bout of being confused and not a loss of memory from old
  age alone.
examples:
- His dementedness grew worse until he could no longer find his way home.
- Doctors linked her dementedness to a fault in her brain.
