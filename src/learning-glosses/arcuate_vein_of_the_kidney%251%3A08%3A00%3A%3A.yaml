simpleMeaning: Small tubes between the lobes of the organ that filters the blood, and small tubes at the
  end of the gut, both send their blood into these blood tubes.
scope: Also called vena arcuata renis, this is a set of blood tubes that take blood from the small tubes
  between the lobes of the organ that filters the blood and from the small tubes at the end of the gut.
examples:
- The arcuate vein of the kidney took in blood from the small tubes between the lobes.
- The arcuate vein of the kidney also took in blood from the small tubes at the end of the gut.
