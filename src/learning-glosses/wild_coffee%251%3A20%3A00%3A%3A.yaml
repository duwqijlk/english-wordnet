simpleMeaning: Coarse and weed-like, this American herb lives for years, with big leaves that usually
  wrap round the stem and purple or dull red flowers.
scope: Also called feverroot, horse gentian, and tinker's root, this is a rough weed-like American herb
  that lives for years, with big leaves that usually wrap round the stem and purple or dull red flowers.
examples:
- Wild coffee bore purple flowers.
- The wild coffee had big leaves that wrapped round the stem.
