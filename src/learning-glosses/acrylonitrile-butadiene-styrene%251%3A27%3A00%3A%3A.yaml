simpleMeaning: one of a group of mixed plastics used to make car bodies and the cases of computers and
  other machines
scope: This is one of a group of mixed plastics for car bodies and machine cases, not a single plain plastic
  and not the finished car or computer itself.
examples:
- The toy car's shell was made of acrylonitrile-butadiene-styrene.
- Many computer cases are moulded from acrylonitrile-butadiene-styrene.
