simpleMeaning: A big shedding oak from the eastern United States, flaky bark, leaves with fewer lobes
  than white oaks elsewhere, yielding heavy strong wood for building, thriving in wet soil.
scope: This sense is also called swamp oak.
examples:
- A swamp white oak grew in wet soil.
- Swamp white oaks give strong wood.
