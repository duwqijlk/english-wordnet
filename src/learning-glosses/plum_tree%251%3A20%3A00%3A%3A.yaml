simpleMeaning: Any of several woody plants that bear oval fruit people can eat, with smooth skin and one
  hard stone inside
scope: Any of several woody plants that bear oval fruit people can eat, with smooth skin and one hard
  stone inside; also called plum; not a cherry tree and not a bush that bears berries.
examples:
- A plum tree stood at the end of the garden.
- The plum tree was heavy with ripe fruit.
