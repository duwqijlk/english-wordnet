synsetId: 00382134-n
simpleMeaning: the act of putting one thing here and there among other things
scope: The act of putting one thing here and there among other things, also called interspersal; not the
  act of mixing things all together and not the act of putting things in a row.
examples:
- The interspersion of pictures in the text made the book easy to follow.
- Her talk gained from the interspersion of short stories among the facts.
