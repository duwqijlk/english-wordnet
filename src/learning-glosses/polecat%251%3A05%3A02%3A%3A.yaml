simpleMeaning: A North American mammal of the weasel family that usually sprays a very foul-smelling liquid
  when frightened; some classifications place it in its own subfamily, Mephitinae.
scope: Skunk and wood pussy are other names for this American animal; it is not the European polecat,
  a dark brown woodland relative.
examples:
- The polecat sprayed a foul-smelling liquid when it was startled.
- Some classifications put the polecat in its own subfamily, Mephitinae.
