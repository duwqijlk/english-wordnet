simpleMeaning: any of many kinds of animals that live in water, have a backbone and scales, are mostly
  cold-blooded, and breathe through gills.
scope: This is not the meat of such an animal eaten as food, and not the act of catching one; it is the
  living water animal itself.
examples:
- Small silver fish darted between the rocks.
- The pond is full of fish.
