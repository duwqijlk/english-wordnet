senseId: persuasible%5:00:00:susceptible:00
synsetId: 02370402-s
simpleMeaning: Able to be talked into doing or believing something by what others say.
scope: This is about a person open to being talked round, also called persuadable; it is not about being
  easily tricked, and not about a person who talks others round.
examples:
- She was persuasible and agreed after a short talk.
- The persuasible boy changed his mind when his friends spoke to him.
