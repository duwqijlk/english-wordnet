simpleMeaning: getting joy, or joy linked to sex, from being hurt, treated badly, or controlled by another
  person
scope: This is about getting joy from being hurt or controlled yourself; it is not about getting joy from
  hurting other people.
examples:
- His masochistic wishes made him want a partner who would control and hurt him.
- She described the character's masochistic pleasure in being treated badly.
