simpleMeaning: The ability to feel objects and forces through contact with the body, especially with the
  hands.
scope: This is not the act of putting a hand on something, and not a small amount of something; it is
  the sense that lets the body feel contact.
examples:
- A baby learns about the world through touch.
- The illness left him with little sense of touch in his hands.
