simpleMeaning: a form of the card game in which extra tricks beyond the agreed number count toward winning
  the game, now mostly replaced by the newer form of the game
scope: 'Also called auction: a form of the card game in which extra tricks count toward the win, not the
  newer form of the game that replaced it.'
examples:
- They played auction bridge before the newer game took over.
- In auction bridge, extra tricks count toward the game.
