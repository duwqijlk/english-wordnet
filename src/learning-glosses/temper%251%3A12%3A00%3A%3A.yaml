simpleMeaning: the way a person feels at a time, as a habit or for a short while
scope: The way a person feels at a time, also called mood; not a nature quick to show anger, and not a
  sudden burst of anger.
examples:
- Whether he praised or cursed me depended on his temper at the time.
- He was in a bad temper all morning.
