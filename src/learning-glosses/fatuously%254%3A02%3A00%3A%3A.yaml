simpleMeaning: in a way that shows a lack of thought or too much pride in oneself, without knowing how
  foolish it looks
scope: 'Also called inanely: acting in a foolish way without knowing it, not wise and not knowingly cruel.'
examples:
- He smiled fatuously at his own joke.
- She nodded fatuously, proud of an answer that made no sense.
