simpleMeaning: A dishonest business arrangement where goods pass through far too many sellers, each charging
  the next more, until retail prices are needlessly inflated.
scope: This is the dishonest selling chain that inflates retail prices, not the legitimate investment
  practice of adding to a winning position.
examples:
- The regulator accused the company of pyramiding.
- Pyramiding pushed wholesale prices up until ordinary shops could no longer compete.
