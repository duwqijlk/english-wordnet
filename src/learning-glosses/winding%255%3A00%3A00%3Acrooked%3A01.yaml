simpleMeaning: having many turns and bends, again and again
scope: 'Also called twisting: having many turns and bends, like a road up a hill. This is not the act
  of turning or twisting something.'
examples:
- We drove along a winding road up the mountain.
- The winding path through the woods is full of surprises.
