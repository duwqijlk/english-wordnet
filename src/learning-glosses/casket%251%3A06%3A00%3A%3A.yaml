simpleMeaning: A small box, often richly made, for keeping jewels or other things of great worth.
scope: A small, often richly made box for jewels or valuables, not the box a dead body is buried in.
examples:
- She kept her grandmother's jewels in a casket.
- The casket held rings and necklaces of great worth.
