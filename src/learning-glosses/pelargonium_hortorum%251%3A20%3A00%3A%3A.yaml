simpleMeaning: A geranium that stands upright, with wavy-edged leaves that have a wide band of colour
  just inside the edge, and white, pink, or red flowers.
scope: Also called bedding geranium, fish geranium, and zonal pelargonium; an upright geranium, set apart
  from trailing geraniums by its wavy-edged leaves with a wide band of colour.
examples:
- Pelargonium hortorum stood in pots along the front steps.
- The Pelargonium hortorum in the window box had red flowers.
