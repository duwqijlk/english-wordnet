simpleMeaning: a red light-catching colour stuff in the rod cells at the back of the eye of animals with
  backbones, which light breaks down into a different stuff
scope: Not the red of blood, and not the dark stuff that fills the eye; also called retinal purple and
  visual purple.
examples:
- Rhodopsin helps the eye adjust to the dark.
- In bright light, rhodopsin breaks down fast.
