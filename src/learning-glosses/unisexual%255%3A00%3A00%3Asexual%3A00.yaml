simpleMeaning: of or having only one sex, or only one kind of sex organ, and not both
scope: Of one sex only, not of both sexes at once and not a plant or animal with both male and female
  parts.
examples:
- Some flowers are unisexual, with only male or only female parts.
- The unisexual fish had only one kind of sex organ.
