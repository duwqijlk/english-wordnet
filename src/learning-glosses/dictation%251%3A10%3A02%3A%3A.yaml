simpleMeaning: words that a person has spoken for writing down and that have been written down; a piece
  of writing made in this way
scope: The written words themselves, or one such piece of writing, not the act of speaking words for another
  person to write down.
examples:
- He signed his dictation and sent it without reading it again.
- This dictation is three pages long and ready to send.
