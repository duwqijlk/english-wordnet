simpleMeaning: a body action that happens on its own and pushes gas noisily out of the stomach through
  the mouth
scope: 'Also called belch, burp and belching: gas coming noisily out of the stomach through the mouth,
  not gas passed from the other end of the body.'
examples:
- His loud burping after the meal made everyone laugh.
- The baby needed help to stop burping after drinking milk.
