simpleMeaning: to get a pure part from a liquid by distillation (heating it and cooling the steam that
  comes off)
scope: This is the verb sense of getting a pure part by heating a liquid and cooling its steam, not the
  liquid made by soaking a thing in water, not getting a thing out by force, and not working out a meaning.
examples:
- Workers extract pure alcohol from the heated liquid by cooling the steam that rises.
- She extracted the plant oil by heating the mix and cooling the steam back to a liquid.
