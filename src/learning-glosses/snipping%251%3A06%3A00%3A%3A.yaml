simpleMeaning: a small piece of anything, especially a small piece that has been cut off
scope: A small piece of something, also called a snippet; it is not the act of cutting off a piece and
  not a whole thing.
examples:
- She saved a snipping from the plant to grow a new one.
- A snipping of hair fell to the floor at the barber's shop.
