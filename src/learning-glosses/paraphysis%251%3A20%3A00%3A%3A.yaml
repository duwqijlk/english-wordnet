simpleMeaning: Among the spore cases grows a thin thread or hair, plain or branched, that makes no spores
  and can end in a point or a thick round tip.
scope: This is a thin thread or hair that grows among the spore cases and makes no spores, unlike the
  spore cases themselves.
examples:
- The paraphysis stood among the spore cases.
- A paraphysis ended in a thick round tip.
