simpleMeaning: A nerve that starts from two sets of roots, one from the head and one from the back, that
  join to form one nerve
scope: A nerve that starts from two sets of roots, one from the head and one from the back, that join
  to form one nerve; accessory nerve, eleventh cranial nerve and nervus accessorius are other names for
  this sense, not a nerve from the arm and not a nerve that stays in the head.
examples:
- The spinal accessory starts from two sets of roots that join to form one nerve.
- The spinal accessory nerve runs from the head and the back.
