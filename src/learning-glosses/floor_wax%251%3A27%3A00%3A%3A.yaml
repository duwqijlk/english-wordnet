simpleMeaning: A mix made with a soft, shiny stuff, rubbed on the flat surfaces people walk on inside
  to make them shine and to keep their top layer safe.
scope: This is a mix rubbed on the flat surfaces people walk on inside to make them shine, not a cleaner
  or a paint.
examples:
- She put floor wax on the hall.
- The floor wax made the boards shine.
