simpleMeaning: A living thing that lives in surroundings holding oxygen but with no matter from living
  things in them
scope: This is a living thing that lives in surroundings holding oxygen but with no matter from living
  things in them, not one that lives where such matter is plentiful and not one that lives without oxygen.
examples:
