simpleMeaning: a bitter alkaloid (a natural chemical made by plants) found in coffee and tea, which makes
  people feel more awake and full of energy
scope: The bitter substance in coffee and tea that makes people feel awake, not coffee or tea itself.
examples:
- Too much caffeine late at night kept her awake.
- He drank less coffee because the caffeine made his heart beat fast.
