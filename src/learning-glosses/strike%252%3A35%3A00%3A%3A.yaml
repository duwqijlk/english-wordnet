simpleMeaning: Use the hand, a fist or a weapon to hit someone or something with force.
scope: This is a physical blow with your hand, fist or a weapon, not a planned attack on an enemy or a
  sudden harmful effect such as illness or bad weather.
examples:
- He struck the table with his fist.
- The guard struck the thief across the face.
