simpleMeaning: A low plant that lives many years, with leaves covered in white down and groups of small
  white flowers.
scope: A low plant that lives many years, with leaves covered in white down and groups of small white
  flowers, also called cat's feet; not a tall plant, and not a plant with yellow flowers.
examples:
- Cat's foot grew along the path.
- The cat's foot plant has white flowers.
