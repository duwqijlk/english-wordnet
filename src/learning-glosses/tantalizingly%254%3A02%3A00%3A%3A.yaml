simpleMeaning: in a way that makes someone want something very much, but they cannot have it
scope: In a way that makes a person want what they cannot have; not in a plain way that gives them what
  they want, and not in a way with nothing in it that they want.
examples:
- The fresh bread sat tantalizingly on the table, but dinner was still an hour away.
- The prize was shown tantalizingly to the players, but no one could touch it yet.
