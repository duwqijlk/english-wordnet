simpleMeaning: lacking all or part of what a person's body or mind can do, including the loss of a part
  of the body
scope: 'Also called disabled: this describes a person who lacks some or all of what the body or mind can
  do; it is not the noun use that means handicapped people as a group.'
examples:
- Special parking spaces near the door are kept for handicapped drivers.
- The school gives extra help to handicapped children who need it.
