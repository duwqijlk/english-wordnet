simpleMeaning: a very hot pepper that is thin and becomes narrow at the end, with a strong sharp taste
scope: Also called chilly, chili and chilli. This is the hot pepper itself, not a dish made with peppers
  and meat.
examples:
- One small chile made the whole soup very hot.
- He chopped a fresh chile and added it to the sauce.
