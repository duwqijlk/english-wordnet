simpleMeaning: A birth defect in which skin partly or fully joins two or more fingers or toes.
scope: This is a birth defect in which skin joins two or more fingers or toes, also called syndactylism,
  and not a missing finger or a broken toe.
examples:
- The baby was born with syndactyly of two toes.
- Syndactyly joined her middle and ring fingers.
