senseId: hag-ridden%5:00:00:troubled:00
synsetId: 02467274-s
simpleMeaning: Troubled again and again by bad dreams or fears that have no good reason.
scope: Troubled again and again by bad dreams or fears that have no good reason; tormented and hagridden
  are other names for this sense, not the quality of having no courage and not a passing fright at one
  single thing.
examples:
- She was hag-ridden by bad dreams night after night.
- He felt hag-ridden by fears that had no good reason.
