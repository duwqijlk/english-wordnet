simpleMeaning: Used to decorate cloth and to sew things together, this stitch is made of loops linked
  one to the next
scope: This stitch of loops linked one to the next is not the crochet stitch made by pulling one loop
  of yarn through another.
examples:
- She used chain stitch to edge the cushion.
- He learned chain stitch in his first sewing class.
