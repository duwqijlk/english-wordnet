simpleMeaning: make something, such as a bell or an instrument, produce a noise
scope: This is not speaking or singing yourself, and not announcing news with a noise; it means making
  an object give out a noise.
examples:
- She sounded the bell twice, then listened for an answer.
- The technician sounded each pipe to check that it was clear.
