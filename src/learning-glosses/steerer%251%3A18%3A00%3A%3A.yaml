simpleMeaning: A person who charms or tricks someone and leads them into danger, usually as part of a
  plot.
scope: 'Also called decoy: a person who charms or tricks someone and leads them into danger, usually as
  part of a plot, not a person who steers a ship.'
examples:
- The steerer lured them into the alley as part of the plot.
- They soon saw the friendly stranger was a steerer leading them into danger.
