simpleMeaning: to change the way you live or act so you fit in with new or different things around you
scope: 'Also called adjust: to change yourself to fit new conditions, not to change a book or plan to
  make it fit something else.'
examples:
- She soon adapted to life in the new town.
- The workers had to adapt to the new rules at the factory.
