simpleMeaning: A system for grouping living things by family ties, worked out from branching charts drawn
  to show how the groups are kin
scope: This system is also called cladistics; it groups living things by family ties worked out from branching
  charts.
examples:
- The team used cladistic analysis to sort the new fossils into groups.
- Cladistic analysis showed that the two birds were close kin.
