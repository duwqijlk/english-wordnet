simpleMeaning: Light from the sun, with no good shield for the eyes, harms the back of the eye
scope: Harm to the back of the eye from the sun, not pain from bright light and not a colouring stuff
  in the eye.
examples:
- She suffered photoretinitis after looking at the sun without eye protection.
- Photoretinitis can follow a long look at the bright sun with no shield over the eyes.
