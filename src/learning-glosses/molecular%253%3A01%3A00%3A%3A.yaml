simpleMeaning: to do with molecules, or made of them; a molecule is the smallest bit of a substance that
  still keeps its nature
scope: This is to do with molecules, the smallest bits of a substance; not to do with single atoms on
  their own, and not to do with the whole substance.
examples:
- Molecular structure decides how a substance behaves.
- The molecular weight of water is eighteen.
