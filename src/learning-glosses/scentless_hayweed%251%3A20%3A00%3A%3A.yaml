simpleMeaning: An everywhere-found European weed of one year, bearing white blossoms and fine-cut leaves,
  naturalized and sometimes farmed in the east of North America, sometimes set as genus Matricaria.
scope: This sense is also called corn mayweed, scentless camomile, scentless false camomile, and scentless
  mayweed, for an everywhere-found European weed of one year, bearing white blossoms and fine-cut leaves.
examples:
- Scentless hayweed bears white blossoms.
- Scentless hayweed grows in the east of North America.
