simpleMeaning: Work or a set of work that builds muscle, in which the muscles tighten against a force
  without moving and stay the same length.
scope: Also called isometric exercise, work or a set of work that builds muscle by tightening the muscles
  against a force without moving.
examples:
- Isometrics build muscle without moving.
- They do isometrics daily.
