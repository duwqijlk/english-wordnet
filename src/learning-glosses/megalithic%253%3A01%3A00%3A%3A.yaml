simpleMeaning: about very large stones set up, or about the people who put them up
scope: This describes very large stones set up and the people who set them up, not just anything that
  is very big.
examples:
- Stonehenge is a famous megalithic monument in England.
- They studied the megalithic stones that stand in a circle on the hill.
