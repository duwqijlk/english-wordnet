simpleMeaning: Food from the soil is taken in by a thin thread-like bit that grows from a skin cell a
  little way back from the tip.
scope: This is a thin thread-like bit that grows from a skin cell a little way back from the tip and takes
  food from the soil.
examples:
- The plant took in food through its root hairs.
- A root hair grows a little way back from the tip.
