simpleMeaning: The brain and spinal cord are wrapped round by three thin skins, and this is one of them
scope: A thin skin that wraps round the brain and spinal cord, one of three, also called meninges; not
  the brain itself and not the skull.
examples:
- Each meninx is one of three skins around the brain.
- The meninx was cut during the operation.
