simpleMeaning: an imaginary line round the Earth that runs the same way as the equator and never meets
  it
scope: An imaginary line round the Earth that runs the same way as the equator, not a line or surface
  in mathematics and not the act of making things run side by side.
examples:
- The town lies on the forty-ninth parallel.
- Sailors crossed the parallel at noon.
