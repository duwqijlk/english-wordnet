simpleMeaning: Glands in the lining of the neck of the womb that make mucus
scope: These are glands in the lining of the neck of the womb that make mucus; cervical glands and cervical
  glands of the uterus are other names for this sense, not the womb itself and not glands elsewhere in
  the body.
examples:
- The doctor looked at the glandulae cervicales uteri under the microscope.
- Mucus from the glandulae cervicales uteri lines the neck of the womb.
