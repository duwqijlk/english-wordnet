simpleMeaning: Rosy-purple flowers in bunches grow where the leaves meet the stem on this Old World plant,
  standing tall or lying low, living many years, brought to the United States.
scope: 'Also called cheese, high mallow and tall mallow: a long-lived Old World plant, brought to the
  United States, with rosy-purple flowers in the leaf joints.'
examples:
- The cheeseflower stood tall with rosy-purple flowers.
- Cheeseflower grows in the United States now.
