simpleMeaning: A floor covering from India, made of rough felt and sewn with a pattern
scope: A floor covering from India, made of rough felt and sewn with a pattern, also called nammad and
  numdah rug, and not a plain woollen blanket or a carpet woven on a loom.
examples:
- A numdah lay beside the bed in the guest room.
- She bought a numdah with red flowers sewn across it.
