simpleMeaning: With the egg cells of a flower on thin flaps reaching into a seed case made of joined parts
scope: This describes a flower with its egg cells on thin flaps reaching into a seed case made of joined
  parts, not a flower with egg cells on a central stalk and not a simple seed case.
examples:
- Lamellate placentation puts the ovules on thin flaps inside the ovary.
- In lamellate placentation the egg cells sit on thin flaps of the placenta.
