simpleMeaning: A silver-grey insect with no wings, found in houses, that eats book covers and clothes
  stiffened with starch.
scope: A wingless silver-grey house insect, also called silverfish; not a moth and not a cockroach.
examples:
- Lepisma saccharina hid behind the books on the shelf.
- We found Lepisma saccharina eating the starch in an old shirt.
