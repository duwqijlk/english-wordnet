senseId: 'latent_heat%1:19:00::'
synsetId: 11491497-n
simpleMeaning: Warmth taken in or given out while a thing changes from one state to another, at a set
  warmth and pressure.
scope: Warmth taken in or given out while a thing changes from one state to another, at a set warmth and
  pressure; heat of transformation is another name for this sense, not warmth that makes a thing hotter,
  and not warmth lost by cooling.
examples:
- Latent heat is taken in when ice melts.
- The latent heat of the steam warmed the room.
