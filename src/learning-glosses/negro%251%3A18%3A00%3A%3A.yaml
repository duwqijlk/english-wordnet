simpleMeaning: a person whose family comes from Africa; the word is old and now felt as rude and insulting
scope: A person with African ancestry; Black, Negroid and African-American are other names for this sense;
  the word itself is old and offensive today, and this sense is about the person, not the colour.
examples:
- The old book used the word Negro for Black people.
- Today most people do not use the word Negro, as it is felt to be offensive.
