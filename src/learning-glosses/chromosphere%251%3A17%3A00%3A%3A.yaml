simpleMeaning: A layer of gas in the sun's atmosphere, from the photosphere to the corona, visible during
  a total eclipse of the sun.
scope: A gas layer of the sun's air, not the sun's bright face and not its outer crown.
examples:
- The chromosphere can be seen round the sun during an eclipse.
- You can see the chromosphere when the sun is fully covered.
