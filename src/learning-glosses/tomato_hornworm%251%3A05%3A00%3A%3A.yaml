simpleMeaning: With white stripes on a big green body, this young hawkmoth eats plants grown for their
  red fruit and for potatoes, much like a close kind.
scope: People also call it potato worm, a big green young hawkmoth with white stripes that eats tomato
  and potato plants, much like the tobacco hornworm.
examples:
- Tomato hornworms ate the tomato plants.
- A tomato hornworm has white stripes on its green body.
