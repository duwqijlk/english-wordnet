simpleMeaning: A small apricot tree grown from a cross of two kinds, from Asia and Asia Minor, with purple-tinged
  twigs and white flowers followed by poor purple fruit.
scope: Also called black apricot and purple apricot; a small apricot tree from Asia and Asia Minor, grown
  from a cross of two kinds, with purple-tinged twigs, white flowers and poor purple fruit.
examples:
- Prunus dasycarpa bore white flowers in spring, then purple fruit.
- The Prunus dasycarpa in the orchard was a small tree with purple-tinged twigs.
