simpleMeaning: a picture made from a photographic negative (a piece of film that shows light parts dark
  and dark parts light)
scope: A picture made from a film negative; not a picture made from an engraving, not cloth with a pattern
  on it, and not the words in a book.
examples:
- She ordered a print of the photograph to put in a frame.
- This print was made yesterday from a film negative.
