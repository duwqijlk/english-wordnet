simpleMeaning: to turn round and round fast, again and again, around a fixed line through your own middle
scope: 'Also called spin and also called whirl: to turn round fast on your own centre, not to walk as
  if you cannot control your steps and not a dance.'
examples:
- The coin reeled around and around before it fell flat.
- The small wheel reeled on its pin, turning again and again.
