simpleMeaning: needing a lot of hard work and strength from the body
scope: This says a thing needs much hard work and strength from the body; it does not mean hard for the
  mind only, and it is the opposite of needing little work.
examples:
- Climbing the steep hill with a heavy bag was effortful work.
- The effortful task of lifting stones left them tired.
