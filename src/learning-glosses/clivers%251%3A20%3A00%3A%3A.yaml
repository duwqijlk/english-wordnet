simpleMeaning: Stems covered in small curved hooks mark a plant that lives for one year, found in North
  America, Europe and Asia.
scope: Also called cleavers, catchweed, goose grass and spring cleavers, this plant lives for one year,
  has stems covered in small curved hooks, and grows in North America, Europe and Asia.
examples:
- Clivers caught on her skirt as she walked.
- Clivers grew thick along the hedge.
