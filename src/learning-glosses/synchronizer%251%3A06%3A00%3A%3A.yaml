simpleMeaning: A gauge that tells if two motions that come round are in time, especially a gauge that
  lets a pilot set a twin-engine plane's airscrews in time.
scope: This sense is also called synchroniser, synchronoscope, and synchroscope.
examples:
- A synchronizer told if the motions were in time.
- Synchronizers help pilots.
