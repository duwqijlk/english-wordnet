simpleMeaning: to do work on a wet mix, for example concrete or mud
scope: This is working a wet mix like concrete or mud, not playing in a liquid or thick mix, not the clay
  and sand mix for a pond, and not dipping plants in mud.
examples:
- The builders puddled the wet concrete before pouring it into the frame.
- He puddled the mud with a spade to make it smooth.
