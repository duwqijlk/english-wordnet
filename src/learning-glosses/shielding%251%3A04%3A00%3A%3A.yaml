simpleMeaning: the act of keeping a person or thing safe from harm
scope: The act of keeping someone or something safe from harm, not a metal cover that blocks rays and
  not a lead wall against radiation.
examples:
- Shielding the workers from the heat was the first job.
- The shielding of the young plants kept them alive through the frost.
