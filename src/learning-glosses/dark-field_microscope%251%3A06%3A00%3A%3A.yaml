simpleMeaning: A tool for looking at tiny things that uses light thrown off in all directions to show
  bits too small to see with an ordinary lens.
scope: A tool that shows tiny things by scattered light; not an ordinary lens and not a telescope.
examples:
- The dark-field microscope showed the tiny bits clearly.
- She put the sample under the dark-field microscope.
