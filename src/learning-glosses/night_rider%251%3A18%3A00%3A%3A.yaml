simpleMeaning: One of a secret band on horseback in the south of the United States after the Civil War,
  who frightened people and paid them back.
scope: One of a secret band on horseback in the south of the United States after the Civil War who frightened
  people, also called nightrider; not a soldier in the war and not a lone horseman.
examples:
- The night rider came by dark to frighten the family.
- Night riders burned the barn as an act of revenge.
