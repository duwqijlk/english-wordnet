simpleMeaning: an illness from a small flat worm, the liver fluke, that lives in the liver; the liver
  is sometimes harmed, and the illness is linked to liver rot
scope: Also called fasciolosis, this is an illness from a liver worm, not a wound to the liver and not
  a disease of the gut.
examples:
- The sheep had fascioliasis after grazing on wet pasture.
- Fascioliasis can damage the liver of cattle.
