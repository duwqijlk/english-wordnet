simpleMeaning: a government run mostly through offices staffed by officials who are not elected
scope: A government run through offices of unelected officials; not any group slowed by red tape, and
  not a government run by elected leaders.
examples:
- The bureaucracy ran the country while the king was ill.
- In a bureaucracy, clerks make most of the decisions.
