scope: This is money or things that belong to a person or group, are owed to them, or were put in by them,
  also called share, part, and percentage. It is not a serving of food or a piece of a whole.
examples:
- He wanted his portion paid in cash.
- Each partner put in a portion of the money to start the shop.
