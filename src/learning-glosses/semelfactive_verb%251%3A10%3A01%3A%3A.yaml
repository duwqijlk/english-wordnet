senseId: 'semelfactive_verb%1:10:01::'
synsetId: 92462255-n
simpleMeaning: a form of a doing word that shows one act with no repeat and no going on
scope: In grammar, a form of a doing word that shows one act with no repeat and no going on; not a verb
  for an act that keeps going and not a verb for a habit.
examples:
- In 'she blinked once', 'blinked' is a semelfactive verb.
- The teacher said 'sneeze' is a semelfactive verb because it names one act that happens once.
