simpleMeaning: The power, most often held by a president or governor, to free a person found guilty in
  the area they govern from punishment or to make their sentence shorter.
scope: The power of a president or governor to free a guilty person or cut their sentence, not a court
  ruling and not a pardon by a jury; no other name is listed for this sense.
examples:
- The governor used executive clemency to free the old prisoner.
- Executive clemency cut her sentence by ten years.
