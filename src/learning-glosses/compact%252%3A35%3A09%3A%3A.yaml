simpleMeaning: To pack down well, going into a small tight mass with ease.
scope: To pack down well, not the act of pressing a thing together, not the state of being pressed close,
  and not the small case for face powder.
examples:
- The dry snow compacts easily underfoot.
- The loose earth compacts well when it is damp.
