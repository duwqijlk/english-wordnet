simpleMeaning: The vein that drains into the ileocolic vein after running beside the artery of the appendix.
scope: It is also called vena appendicularis, and it names the vein that drains into the ileocolic vein
  after running beside the artery of the appendix.
examples:
- The surgeon tied off the appendicular vein during the operation.
- The scan showed the appendicular vein running beside the artery of the appendix.
