simpleMeaning: Bile, a bitter yellow-green liquid, leaves the liver through this tube
scope: The tube that carries bile out of the liver, not a blood vessel and not a tube from any other organ.
examples:
- The hepatic duct carries bile from the liver to the gut.
- A stone blocked the hepatic duct and stopped the bile from draining.
