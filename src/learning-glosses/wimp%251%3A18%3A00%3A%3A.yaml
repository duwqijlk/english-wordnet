senseId: 'wimp%1:18:00::'
synsetId: 10801493-n
simpleMeaning: a person who has little belief in himself or herself and finds it hard to make a choice
  and keep to it
scope: Also called chicken and crybaby, this names a person who has little self-belief and cannot keep
  to a choice; it is about the mind, not about the size or strength of the body.
examples:
- He called himself a wimp for being afraid to speak in class.
- Don't be a wimp; tell them what you really think.
