simpleMeaning: the 1,000th year mark for something, or the party held to mark 1,000 years since it began
scope: This sense is the point when 1,000 years have passed, or its party, not the full period of 1,000
  years itself.
examples:
- The city held a big party for its millennium, 1,000 years after it was founded.
- Few churches live to celebrate a millennium.
