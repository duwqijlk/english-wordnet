simpleMeaning: an electronic device that finds radio signals or signs of radioactivity
scope: Not any device that picks up a signal, and not the part in a radio that takes out the sound.
examples:
- The detector at the gate sounded when it found signs of radioactivity.
- The ship's detector picked up faint radio signals from far away.
