simpleMeaning: Not real at all, but more like something made up or dreamed.
scope: Not really so, but fanciful or made up; not the sense of having no solid form, and not simply failing
  to match the facts.
examples:
- The whole scene felt unreal, like a dream.
- The unreal world of advertising made everything look perfect.
