simpleMeaning: Keeping to the set ways or beliefs of a group, especially in religion.
scope: Used of a person or their views, about keeping to the customs or doctrines of a group, especially
  in religion.
examples:
- Her views were conforming, keeping to the old customs of the church.
- They were conforming in every way, keeping to the old customs.
