simpleMeaning: a floor made of small pieces of wood put together in a pattern
scope: This is a wooden floor made of small pieces in a pattern, not the seats on the main floor of a
  theatre.
examples:
- The large hall has a parquet floor made of dark pieces of wood.
- They cleaned the parquet in the living room and polished it until it shone.
