simpleMeaning: to support a group, or to agree with and support a way of thinking
scope: This sense is about joining a group or supporting its ideas, not about putting things in a straight
  line or in the right place.
examples:
- The small party aligned itself with the larger group.
- He aligned himself with those who wanted change.
