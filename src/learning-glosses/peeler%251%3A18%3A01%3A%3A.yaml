simpleMeaning: a worker whose job is to take the skins off fruits and vegetables
scope: A person whose work is taking the skins off fruits and vegetables, not the kitchen tool that does
  this job and not a performer who takes clothes off for show.
examples:
- The factory hired peelers to prepare potatoes all day.
- As a peeler in the large kitchen, he took the skins off vegetables.
