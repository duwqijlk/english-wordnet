simpleMeaning: A process in which charged bits of matter are swapped between a liquid and a solid that
  will not dissolve, often a resin; it is widely used in factory work.
scope: A process that swaps charged bits between a liquid and a solid that will not dissolve, not a process
  that mixes two liquids and not a filter that only takes bits out.
examples:
- The plant uses ion exchange to soften the water.
- Ion exchange removed the unwanted salts from the solution.
