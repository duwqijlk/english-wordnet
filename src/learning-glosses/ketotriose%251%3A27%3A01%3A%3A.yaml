simpleMeaning: A kind of sugar, a ketose, with three carbon atoms in it; in truth, only one such sugar
  is real, and it is called dihydroxyacetone
scope: A sugar with three carbon atoms, in truth only dihydroxyacetone; not a sugar with more carbon atoms
  and not a different kind of sweet stuff.
examples:
- Dihydroxyacetone is the only real ketotriose that chemists know.
- A ketotriose has three carbon atoms in each of its small parts.
