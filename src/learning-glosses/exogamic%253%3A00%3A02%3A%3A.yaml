simpleMeaning: Said of a flower that can be made to bear seed by pollen from a flower that is not closely
  related to it
scope: Also called exogamous, this is said of a flower that can take pollen from a flower that is not
  closely related to it, not the custom of marrying outside one's group.
examples:
- The exogamic blossom could only bear seed with pollen from an unrelated flower.
- Exogamic flowers need pollen from a plant that is not closely related.
