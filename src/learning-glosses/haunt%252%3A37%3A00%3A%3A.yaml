simpleMeaning: to keep after someone or something like a ghost, and not leave it alone
scope: Also called ghost; this is keeping after someone or something like a spirit, not following in secret
  to watch them, as in the stalk sense.
examples:
- Fear of illness haunts her every night.
- A ghost haunts the old hall, and no one will sleep there.
