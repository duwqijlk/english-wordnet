simpleMeaning: a person who studies living things and knows a lot about them, especially plants and animals
scope: This is a person who studies living things, especially plants and animals, not a thinker who believes
  the world can be understood through science.
examples:
- The naturalist spent years studying birds and plants in the forest.
- As a naturalist, she wrote books about wild animals and trees.
