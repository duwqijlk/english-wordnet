simpleMeaning: A colouring matter made from a cadmium chemical and a barium chemical, with shades that
  run from lemon yellow to orange.
scope: A colouring matter in shades from lemon yellow to orange, not a dye or a colour made from plants.
examples:
- The artist mixed cadmium yellow with white.
- Cadmium yellow gives the sun a bright glow in the painting.
