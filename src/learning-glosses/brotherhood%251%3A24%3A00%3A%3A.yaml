senseId: 'brotherhood%1:24:00::'
synsetId: 13836548-n
simpleMeaning: the family link between a male child and the other children of his parents
scope: This is the family link itself. It is not the feeling that men should treat each other like family.
examples:
- The law treats their brotherhood as a close family relation.
- His brotherhood with the other sons of the house was a matter of birth, not choice.
