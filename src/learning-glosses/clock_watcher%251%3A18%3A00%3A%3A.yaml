simpleMeaning: a person at work who keeps thinking about the time when work ends
scope: A worker who keeps thinking about when work ends, not a worker who checks the time once and not
  a person who collects timepieces.
examples:
- The clock watcher counted the minutes until five o'clock.
- She was known as a clock watcher who never stayed a minute past the end of the day.
