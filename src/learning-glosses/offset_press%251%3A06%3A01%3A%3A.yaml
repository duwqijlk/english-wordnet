simpleMeaning: a printing machine in which the inked picture moves from a plate to a rubber sheet, then
  onto the paper or other surface
scope: A machine that prints by moving ink from plate to rubber sheet to paper, not a press that stamps
  ink straight from plate to paper.
examples:
- Many modern offset presses use computer-to-plate systems instead of film.
- The printer ran the posters through the offset press overnight.
