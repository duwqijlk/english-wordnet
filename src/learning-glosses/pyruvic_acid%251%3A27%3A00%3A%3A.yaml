simpleMeaning: A clear sour liquid that forms as a key middle step when food is turned into energy or
  when food is fermented
scope: A clear liquid that forms during the change of food into energy or when food is fermented, not
  the acid in lemons and not vinegar.
examples:
- Pyruvic acid builds up in the muscles during hard exercise.
- The lab measured the pyruvic acid in the sample after fermentation.
