simpleMeaning: Putting blood, or the liquid part of blood, into a person's vein or artery.
scope: Putting blood into a vein or artery, not the pouring of a liquid from one vessel to another.
examples:
- The patient needed a transfusion after the operation.
- Doctors gave her a blood transfusion to replace what she had lost.
