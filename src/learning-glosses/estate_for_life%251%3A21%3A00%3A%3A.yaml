simpleMeaning: In law, a right to hold land or a house only while the holder lives
scope: In law, a right to hold land only while the holder lives; not a right that lasts for ever and not
  a short let.
examples:
- He held the estate for life and lived there until he died.
- The estate for life ended when she died.
