simpleMeaning: A large breed of shepherd dog used in police work and as a guide for people who cannot
  see.
scope: Also called alsatian, German shepherd, and German shepherd dog; a large breed of shepherd dog used
  in police work and as a guide for people who cannot see, not a small pet dog.
examples:
- The German police dog helped the officers search the building.
- A German police dog guided the blind man across the street.
