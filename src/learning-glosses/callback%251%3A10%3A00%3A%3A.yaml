simpleMeaning: a request from the maker of a faulty product asking people to return it so it can be fixed
  or replaced
scope: 'Also called a recall: a request from the maker of a faulty product to send it back for a fix or
  a new one, not a phone call made in return and not a second try at a part in a play.'
examples:
- The car maker issued a callback for cars with faulty brakes.
- We got a letter about a callback on our washing machine.
