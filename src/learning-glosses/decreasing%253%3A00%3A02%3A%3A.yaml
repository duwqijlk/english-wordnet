simpleMeaning: In music, getting slower and/or quieter
scope: In music, this means the playing gets slower and/or quieter. It is not the general sense of becoming
  smaller or less in amount.
examples:
- The piece ends with a decreasing passage, played more and more slowly and softly.
- She marked the last bars decreasing, so the singers grew quieter and slower.
