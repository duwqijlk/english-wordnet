simpleMeaning: in a simple, trusting way, like someone who does not know about wrong or harm
scope: In a simple, trusting way, like someone who knows nothing of wrong, not in a sly or knowing way.
examples:
- She smiled at him innocently.
- He asked innocently what the big box was for.
