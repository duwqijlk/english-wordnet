simpleMeaning: This person's work is to get and study butterflies and moths, and so to know about insects
scope: 'Another name for a butterfly collector and a lepidopterist: a person who gets and studies butterflies
  and moths, not someone who studies insects in general and not a person who keeps butterflies as pets.'
examples:
- The lepidopterologist spent the summer catching butterflies in the meadow.
- As a lepidopterologist, she kept a large case of moths she had studied.
