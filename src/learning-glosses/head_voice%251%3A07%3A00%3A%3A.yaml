simpleMeaning: The upper part of the range in speaking or singing, where the shaking of sung notes is
  felt in the skull.
scope: The high range of the voice in speaking or singing, also called head register and head tone, not
  the low range of the voice and not the chest voice.
examples:
- She sang the high passage in head voice.
- His head voice carried the top notes without strain.
