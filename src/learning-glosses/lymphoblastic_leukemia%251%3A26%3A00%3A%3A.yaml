simpleMeaning: A kind of blood cancer in which nearly all the wrong cells in the blood that flows round
  the body are young white blood cells.
scope: A kind of blood cancer in which nearly all the wrong cells in the blood that flows round the body
  are young white blood cells; not a blood cancer of older cells and not a cancer of the blood that stays
  in one place.
examples:
- The boy was treated for lymphoblastic leukemia in the children's ward.
- Tests showed lymphoblastic leukemia, with young white cells filling the blood.
