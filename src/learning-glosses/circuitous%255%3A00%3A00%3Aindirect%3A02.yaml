simpleMeaning: not direct in speech or in what a person does, but going in a roundabout way
scope: 'Also called roundabout: not direct in speech or in what a person does; it is not about a long,
  roundabout road or trip.'
examples:
- His circuitous explanation left everyone unsure what he meant.
- She gave a circuitous answer and never said yes or no.
