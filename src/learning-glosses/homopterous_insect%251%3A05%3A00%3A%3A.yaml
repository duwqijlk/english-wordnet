simpleMeaning: A flying creature with thin, skin-like front wings and back wings
scope: A flying creature with thin front and back wings, also called a homopteran; not a bug with hard
  wing covers, and not a fly with only one pair of wings.
examples:
- The homopterous insect sat on the stem, its thin wings held flat.
- Aphids are homopterous insects with thin front and back wings.
