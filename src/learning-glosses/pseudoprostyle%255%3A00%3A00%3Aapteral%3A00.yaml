simpleMeaning: Free columns stand in the roofed porch, and they run only across the opening to the building
scope: A building marked by rows of free columns in a roofed porch at the front, only across the opening;
  prostyle is another name for this sense, not a building with columns all round it.
examples:
- The old temple is pseudoprostyle, with free columns across the front porch and plain walls at the sides.
- From the front, the pseudoprostyle hall looks like a Greek temple, but its sides have no columns.
