simpleMeaning: A garden tool with steel claws that grip unwanted plants by the root to take them out cleanly.
scope: A garden tool with steel claws; weed puller is another name for this sense, not a hoe and not a
  spray for killing plants.
examples:
- She bought a weed remover with steel claws for the garden.
- The weed remover pulls the plant out by the root.
