simpleMeaning: a long-acting drug in crystal form, one of the barbiturates (drugs that calm the nerves),
  sold as Mebaral, used to calm people and to stop fits in epilepsy
scope: A long-acting drug in crystal form, sold as Mebaral, that calms people and stops fits; not a short-acting
  sleeping pill, and not a drug for pain.
examples:
- The doctor gave mephobarbital to calm her and to stop her fits.
- Mephobarbital, sold as Mebaral, is used in treating epilepsy.
