simpleMeaning: A metal of the rare earth group that joins with three other atoms, found with yttrium,
  and that makes things that pull hard to a magnet.
scope: This is a metal of the rare earth group also called Ho and atomic number 67, not a metal of another
  group or a metal found on its own.
examples:
- Holmium is found with yttrium in the earth.
- Holmium makes things that pull hard to a magnet.
