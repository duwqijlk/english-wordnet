  squeezes in the stomach and small gut.
scope: This is a chemical made in the gut that seems to help control the squeezes of smooth muscle in
  the stomach and small gut.
examples:
- Motilin helps set the pace of the squeezes in the stomach.
- Doctors study motilin to learn how the gut moves food along.
