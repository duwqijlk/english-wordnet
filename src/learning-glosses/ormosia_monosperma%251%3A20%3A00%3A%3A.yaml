simpleMeaning: A small tree of the West Indies and northeastern Venezuela with large oblong pointed leaflets
  and sprays of purple flowers; its seeds are black or scarlet with black spots.
scope: Also called bead tree, jumby bean, and jumby tree; found in the West Indies and northeastern Venezuela.
examples:
- The Ormosia monosperma in the garden bore scarlet seeds with black spots.
- We saw an Ormosia monosperma with purple flowers in the West Indies.
