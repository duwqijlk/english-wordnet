simpleMeaning: the young of an insect that grows up bit by bit, without a full change of shape, like a
  young dragonfly or mayfly
scope: The young of an insect that grows without a full change of shape, not the nature goddess of old
  stories.
examples:
- The nymph of a dragonfly lives in the water.
- A mayfly nymph clung to the stone in the stream.
