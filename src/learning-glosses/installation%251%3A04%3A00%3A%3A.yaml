simpleMeaning: the job of putting a piece of equipment in place and getting it ready to use
scope: The job of putting equipment in place and getting it ready to use, not the equipment itself and
  not a place where things are put on show.
examples:
- The installation of the new phone took only a few minutes.
- They finished the installation of the washing machine by noon.
