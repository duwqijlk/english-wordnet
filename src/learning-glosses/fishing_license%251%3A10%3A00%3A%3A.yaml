simpleMeaning: For a set time, this paper lets the person who holds it catch fish
scope: 'Also called a fishing licence and a fishing permit: a paper that lets its holder catch fish for
  a set time, not a paper that lets someone hunt and not a paper that lets someone drive.'
examples:
- He showed his fishing license before he cast his line.
- She bought a fishing license for the summer.
