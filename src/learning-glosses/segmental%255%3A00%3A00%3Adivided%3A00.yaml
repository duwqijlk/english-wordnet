simpleMeaning: Having the body made of a row of like parts, as in worms with many rings or lobsters
scope: 'Also called segmented or metameric: a body made of a row of like parts, not a body in one piece
  and not a soft body with no clear parts.'
examples:
- The segmental body of the earthworm is made of many like parts.
- Lobsters show a segmental plan, with the body split into repeated parts.
