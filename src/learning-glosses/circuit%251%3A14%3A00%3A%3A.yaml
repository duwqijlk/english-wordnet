simpleMeaning: In law, one of twelve groups of states in the United States, each with its court of appeals,
  first named when judges rode from town to town to hold court
scope: In law, one of twelve groups of states with its own court of appeals, not a racetrack, not a line
  around an area, and not the act of going around a course.
examples:
- The case was heard in the Ninth Circuit.
- She was appointed to a circuit court of appeals.
