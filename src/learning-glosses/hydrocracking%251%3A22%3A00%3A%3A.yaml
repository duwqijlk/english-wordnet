simpleMeaning: By adding the lightest gas under great pressure, with a substance that speeds the change,
  the bits of oil are split into kerosene and gasoline.
scope: This is the splitting of oil into kerosene and gasoline with the lightest gas under great pressure.
examples:
- The refinery uses hydrocracking to make more kerosene.
- Hydrocracking turns oil into gasoline and kerosene.
