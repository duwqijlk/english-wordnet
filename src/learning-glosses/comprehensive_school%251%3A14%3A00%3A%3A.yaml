simpleMeaning: a big place of learning in Britain or Canada for older children of every skill level
scope: A big place of learning in Britain or Canada for older children of every skill level, also called
  a composite school; not a school that takes only the top pupils and not a small local school.
examples:
- The comprehensive school in town takes children of every skill level.
- She started at the comprehensive school when she was eleven.
