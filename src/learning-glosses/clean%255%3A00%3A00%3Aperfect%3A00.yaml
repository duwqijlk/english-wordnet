simpleMeaning: 'Of a record: showing no faults or offences that count against someone.'
scope: This is the record-with-no-faults sense, not the sense of being free from dirt or having tidy habits,
  not the sense of having no restrictions or conditions, not the sense of sound or colour that is clear
  and undimmed, not the sense of being free from impurities, not the manuscript sense for a text with
  few changes or corrections, not the sense of purity required by religious ritual, not the sense of causing
  no pollution or radiation, not the sense of language or behaviour fit for everyone, not the sense of
  being free from infection, not the sense of being morally pure, not the sense of a surface with nothing
  written or printed on it, not the sense of fair play, not the sense of having no troubles, not the sense
  of being thorough, not the sense of carrying no hidden weapon, not the sense of moving or acting deftly,
  not the sense of being free of drugs, not the noun for a weightlifting move, not the adverb senses meaning
  'completely' or 'by the rules', and not the verbs for washing dirt away, removing feathers or pits,
  tidying a house, washing the body, being washable, stripping someone of money, emptying something, taking
  a spot off while washing, removing unwanted matter, or shelling and husking.
examples:
- The applicant had a clean record, with no complaints or violations.
- A clean driving record can lower your insurance costs.
