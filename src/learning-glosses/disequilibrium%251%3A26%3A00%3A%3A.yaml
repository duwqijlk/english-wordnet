simpleMeaning: when things are out of balance in a shaky state because some forces are stronger than the
  rest
scope: When things are out of balance in a shaky state, and not a steady balance or a small change in
  one force alone.
examples:
- The disequilibrium in the region grew as one army grew far stronger than the other.
- A disequilibrium in trade left one country selling far more than it bought.
