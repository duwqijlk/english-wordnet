simpleMeaning: the act of giving someone a post at once, whether or not that person agrees
scope: 'Also called co-option: giving someone a post at once, not a slow choice after talks and not a
  vote.'
examples:
- The co-optation of a new member took only a few minutes.
- Her co-optation to the board went ahead even though she had not said yes.
