simpleMeaning: A fern of tropical America with brown scaly underground stems, grown for its large deeply
  lobed deep bluish-green fronds; sometimes put in its own fern genus.
scope: Also called golden polypody, rabbit's-foot fern, serpent fern, and Phlebodium aureum; not a moss
  and not a flowering plant.
examples:
- The Polypodium aureum grew large fronds in the warm greenhouse.
- We watered the Polypodium aureum for its deep green leaves.
