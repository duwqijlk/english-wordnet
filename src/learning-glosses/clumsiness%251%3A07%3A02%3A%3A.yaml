senseId: 'clumsiness%1:07:02::'
synsetId: 04822855-n
simpleMeaning: the way a person is stiff and not relaxed and does not move or act with ease, as when they
  feel embarrassed
scope: This is being stiff and not relaxed, as when a person feels embarrassed; awkwardness, stiffness
  and gracelessness are other names for this sense. Not a way of moving or holding the body that is not
  smooth.
examples:
- His clumsiness at the party came from feeling embarrassed and not knowing what to say.
- In her clumsiness, she stood stiff and silent when she was introduced to the guests.
