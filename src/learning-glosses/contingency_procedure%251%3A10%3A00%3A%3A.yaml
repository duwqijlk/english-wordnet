senseId: 'contingency_procedure%1:10:00::'
synsetId: 06595530-n
simpleMeaning: A back-up plan used instead of the usual one when a strange but foreseen event happens.
scope: A back-up plan used instead of the usual one when a foreseen event happens, not the usual plan
  itself and not a plan made up on the spot.
examples:
- The team had a contingency procedure for a power cut.
- A contingency procedure took over when the alarm sounded.
