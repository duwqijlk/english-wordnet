simpleMeaning: A weapon that blows up under the sea at a set level below the surface to attack a submarine
scope: This is a weapon that blows up under the sea to attack a submarine; depth bomb is another name
  for it, not a weapon dropped from the air onto land.
examples:
- The ship dropped a depth charge to drive off the submarine.
- A depth charge went off just below the surface of the sea.
