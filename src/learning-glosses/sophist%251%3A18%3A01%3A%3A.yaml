simpleMeaning: One of a group of Greek thinkers and teachers of the 5th century BC who thought and talked
  about many kinds of things
scope: One of a group of Greek thinkers and teachers of the 5th century BC who thought about many kinds
  of things; not a thinker of a later age and not a teacher of one subject only.
examples:
- The Sophist taught his pupils to argue about law and nature.
- A Sophist of the 5th century BC might speak on any subject.
