simpleMeaning: A tropical American plant whose large, fleshy, edible fruit has a tuft of stiff leaves
  at the top; widely grown in the tropics.
scope: The plant that bears the fruit, not the fruit sold as food; pineapple is another name for this
  plant.
examples:
- The pineapple plant bears a large fruit with a tuft of stiff leaves.
- Pineapple plants are widely cultivated in the tropics.
