simpleMeaning: able to be given a new shape, bent, or stretched out
scope: 'Also called pliable, malleable, pliant and tensile: able to be given a new shape, bent, or stretched
  out, not hard and stiff, and not easily snapped.'
examples:
- Copper is ductile and can be drawn into thin wire.
- The hot glass was ductile enough to be pulled into long threads.
