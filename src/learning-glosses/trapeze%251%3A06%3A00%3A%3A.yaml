simpleMeaning: a swing high in the air, used by people who do tricks in a circus
scope: A high swing for circus tricks, not a child's swing in a park and not a trick done on it.
examples:
- The performer hung from the trapeze high above the crowd.
- She swung on the trapeze and caught her partner's hands.
