simpleMeaning: in a complete way, with nothing left out or held back; used in everyday talk to make a
  word stronger
scope: Also called dead, absolutely, and perfectly. It makes the next word mean completely, not just a
  little.
examples:
- After the long walk, the children were utterly tired.
- The room was utterly silent when she finished speaking.
