simpleMeaning: a person who cries too much and complains too much in a high, unhappy voice
scope: 'Also called whiner, complainer, grumbler and moaner: a person who cries and complains too much,
  not a person who lacks confidence and cannot make up his mind.'
examples:
- Stop being such a crybaby and tell me what is wrong.
- The other children called him a crybaby because he cried and complained at every small hurt.
