simpleMeaning: A hairpiece worn by men, in fashion in the 1600s and 1700s.
scope: A hairpiece worn by men, in fashion in the 1600s and 1700s; periwig is another name for this sense,
  not a woman's hairpiece and not a hat.
examples:
- The actor wore a peruke for the role of a 17th-century judge.
- His peruke sat crooked on his head during the play.
