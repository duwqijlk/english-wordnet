simpleMeaning: A condition in pregnancy caused by poison, in which a woman has fits and may fall into
  a sleep she cannot wake from, during or just after pregnancy.
scope: A condition of pregnancy caused by poison, with fits and a sleep that cannot be woken from, not
  a fit on its own and not a fit from another cause.
examples:
- The doctor feared eclampsia when the fits began.
- Eclampsia can follow a difficult pregnancy.
