simpleMeaning: An illness that grows over a person's life from causes in the mind, not in the body
scope: An illness that grows from causes in the mind rather than the body, not an illness present from
  birth and not one caused by a hurt to the body.
examples:
- The doctor said her psychogenesis went back to fears she had as a child.
- His psychogenesis showed how an illness of the mind can grow over a lifetime.
