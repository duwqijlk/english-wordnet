simpleMeaning: a hard piece with tiny parts in a set order, used as a part inside machines that run on
  power
scope: A part inside machines that run on power, not a hard stone from the ground, not clear glass, and
  not a hard solid made from a chemical.
examples:
- The repair man changed the crystal in the old radio.
- The crystal in the transmitter failed, so the machine stopped sending signals.
