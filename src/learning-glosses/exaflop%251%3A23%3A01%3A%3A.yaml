simpleMeaning: In computer science, a measure of how fast a computer works, set at one followed by eighteen
  zeros of sums with decimal points done each second
scope: In computer science, a measure of how fast a computer works, not a measure of how much it can store
  and not a kind of computer.
examples:
- The new machine runs at more than one exaflop.
- Engineers measured the system in exaflops to compare its speed.
