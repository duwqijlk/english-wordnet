simpleMeaning: flat round sea animals, shaped like discs, that live on sea floors of loose dry grains
scope: This is a flat, disc-shaped sea animal that lives on sandy sea floors; not a coin and not a starfish.
examples:
- We found a sand dollar washed up on the beach.
- The sand dollar lay flat on the sea floor.
