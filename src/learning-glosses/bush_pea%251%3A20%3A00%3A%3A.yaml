simpleMeaning: any of a group of plants of the genus Thermopsis, with leaves in threes and yellow or purple
  flowers in long clusters
scope: Any of a group of plants of the genus Thermopsis, with leaves in threes and yellow or purple flowers
  in long clusters, not a garden pea and not any other plant with three-part leaves.
examples:
- Bush pea grew wild on the dry hillside.
- The bush pea's yellow flowers stood out in the grass.
