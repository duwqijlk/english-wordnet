senseId: 'malice_aforethought%1:09:00::'
synsetId: 05803965-n
simpleMeaning: Often at issue in murder trials, this is, in law, a person's plan in the mind to do a wrongful
  act, knowing it is against the law
scope: Also called mens rea, this is, in law, a person's plan to do a wrongful act while knowing it is
  against the law, not a wrongful act done without thinking first and not an act done by mistake.
examples:
- The prosecutor had to prove malice aforethought to win the murder case.
- Malice aforethought was at issue in the trial.
