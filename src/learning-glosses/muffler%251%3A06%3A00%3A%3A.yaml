simpleMeaning: a piece of cloth that a person wears around the neck
scope: A piece of cloth worn around the neck; not the part on a car that makes its noise softer, and not
  a device that cuts shaking or sound in other machines.
examples:
- He wrapped a thick muffler around his neck before going out in the cold.
- Her red muffler kept her neck warm in the wind.
