simpleMeaning: A plant of the East Indies grown for its useful threads, now grown widely in many lands.
scope: A plant of the East Indies grown for its useful threads, now grown widely, also called bimli hemp,
  deccan hemp, kanaf and kenaf; not a cotton plant and not a food plant.
examples:
- Bimli was grown for the strong threads in its stems.
- Farmers planted bimli across the warm lowlands.
