simpleMeaning: One of the two lumps of lymph tissue, one on each side of the back of the mouth.
scope: One of the two lumps of lymph tissue, one on each side of the back of the mouth, also called tonsil
  and palatine tonsil; not a lump at the back of the tongue and not a swollen gland in the neck.
examples:
- The doctor saw that her faucial tonsil was swollen.
- A faucial tonsil sits on each side of the back of the mouth.
