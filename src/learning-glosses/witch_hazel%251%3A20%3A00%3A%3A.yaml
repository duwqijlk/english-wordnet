simpleMeaning: Of the group Hamamelis, this bush or tree has bark that gives a skin wash, a liquid that
  makes the skin feel tight.
scope: Also called witch hazel plant, wych hazel, and wych hazel plant, this is the bush or tree itself,
  not the skin wash made from its bark.
examples:
- The bark of witch hazel goes into a skin wash.
- One witch hazel grows as a bush, and the next one as a tree.
