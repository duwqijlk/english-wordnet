simpleMeaning: something made to remember a person or event, made of a yellow metal that is a mix of copper
  and zinc
scope: A thing made of brass to remember a person or event, not the brass metal on its own, not a brass
  wind instrument, and not a brass object for use or decoration.
examples:
- The brass in the church bears the names of soldiers who died.
- Visitors stopped to read the old brass by the door.
