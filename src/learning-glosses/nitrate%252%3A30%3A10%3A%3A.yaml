simpleMeaning: to treat a chemical that contains carbon with nitric acid (a strong acid), so that it changes
  into a new chemical made with that acid
scope: This is the verb for treating something with acid to change it, not the noun for the chemical substance
  itself.
examples:
- Workers nitrate the substance by treating it with nitric acid.
- Nitrating the liquid must be done with great care in the laboratory.
