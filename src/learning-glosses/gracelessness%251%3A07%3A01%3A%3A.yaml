simpleMeaning: The awkwardness of a person who is stiff and tense, as from being embarrassed.
scope: 'Also called awkwardness, stiffness, or clumsiness: the awkwardness of a person who is stiff and
  tense, as from being embarrassed; not a general lack of grace in how one stands, looks, moves, or shows
  feeling.'
examples:
- His gracelessness at the party came from embarrassment.
- She tried to hide her gracelessness, standing stiff and tense.
