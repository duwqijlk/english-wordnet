simpleMeaning: In Hinduism, a Hindu caste or set-apart social group, one of thousands across India, whose
  men often all share one job, such as cutting hair or making pots
scope: One of thousands of Hindu social groups across India, marked by its men sharing one job, not the
  whole caste system and not a single family.
examples:
- The potters of the town all belonged to the same jati.
- Each jati in the village had its own work, and the barbers formed one jati.
