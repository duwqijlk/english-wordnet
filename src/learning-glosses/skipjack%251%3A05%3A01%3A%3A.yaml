simpleMeaning: a schooling ocean tuna worth much in the Pacific but less in the Atlantic, growing to 75
  pounds, very like the oceanic bonito, if not the same fish
scope: 'Also called a skipjack tuna: a schooling tuna of the open sea, not a yellowfin tuna and not a
  bluefin tuna.'
examples:
- The skipjack swam with a school of tuna far out at sea.
- Fishermen caught a skipjack weighing close to 75 pounds.
