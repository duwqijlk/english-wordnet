simpleMeaning: With many double links in its chain of carbon atoms, this fatty acid has its first double
  link six atoms from the start of the chain.
scope: It is also called omega-6 fatty acid, a fatty acid with many double links in its chain of carbon
  atoms.
examples:
- Omega-6 differs from omega-3 in where its first double link sits.
- In omega-6, the first double link sits six atoms from the start of the chain.
