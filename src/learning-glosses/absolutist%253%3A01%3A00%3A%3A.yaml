senseId: 'absolutist%3:01:00::'
synsetId: 03150713-a
simpleMeaning: to do with totalitarianism, a way of ruling in which one person or group has complete control
  over all parts of people's lives
scope: About a way of ruling where all power is held by one person or group; it is not the noun for a
  person who backs this way of ruling.
examples:
- The absolutist government banned all other parties.
- Under its absolutist rules, the ruler held all power alone.
