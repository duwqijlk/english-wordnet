simpleMeaning: The longest and thickest bone in the human body, going from the pelvis (the wide bone at
  the hips) to the knee
scope: The long leg bone from hip to knee, also called thighbone and femoris, and not any other bone in
  the body.
examples:
- The femur is the strongest bone in her leg.
- He broke his femur in the fall and could not walk.
