simpleMeaning: the words and word use that are typical of one group of people
scope: 'Accent is another name for this sense: it is the words and word use of one group of people. Not
  accent in the sense of the sound of someone''s speech alone, and not a full separate language.'
examples:
- My grandparents speak a local dialect with words I rarely hear in the city.
- The immigrants spoke an odd dialect of English that was hard for me to follow.
