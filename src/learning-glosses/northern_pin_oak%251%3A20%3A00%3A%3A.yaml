simpleMeaning: Leaves that stick out to sharp points mark this small or middling tree of the east and
  middle of America, which loses its leaves in winter.
scope: Also called a jack oak, it is the tree of the east and middle of America whose leaves stick out
  to sharp points and fall in winter.
examples:
- The northern pin oak loses its leaves each winter.
- You can tell a northern pin oak by the sharp points on its leaves.
