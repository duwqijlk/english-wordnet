senseId: 'developmental_age%1:07:00::'
synsetId: 04932055-n
simpleMeaning: The years at which most children reach a point in size, movement or mind are used to show
  how far one child has grown
scope: This measures growth against age norms, not the child's age in years.
examples:
- Her developmental age was two years ahead of her real age.
- The test put his developmental age at four, though he was only three.
