simpleMeaning: A shrub from tropical America and Australia that lies flat or stands half-upright, with
  backward-curving thorns and soft grey-green leaflets that close and sag when handled, cooled or at night.
scope: The low, flat-growing, thorn-armed kind, not the other semi-climbing sensitive plant with prickles
  and not the annual touch-me-not of wet ground.
examples:
- The sensitive plant spread flat across the bank, its stems thick with small thorns.
- At dusk the sensitive plant's leaflets folded and hung down.
