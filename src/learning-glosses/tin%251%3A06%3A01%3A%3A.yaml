simpleMeaning: a metal box for tea, flour, or other foods that must stay dry
scope: A metal box for keeping dry foods, not a sealed box for food or paint and not a baking pan.
examples:
- She kept tea in a tin on the shelf.
- The flour tin stood beside the sugar tin.
