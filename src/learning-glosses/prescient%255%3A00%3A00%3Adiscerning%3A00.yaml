simpleMeaning: able to see the meaning and importance of events before they happen
scope: Seeing what events mean before they happen, not just wise about things now and not a magic power
  to tell the future.
examples:
- Her prescient warning about the flood saved many lives.
- The writer made a prescient guess about how the war would change the country.
