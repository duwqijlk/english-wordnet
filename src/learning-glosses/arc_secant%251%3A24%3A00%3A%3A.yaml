senseId: 'arc_secant%1:24:00::'
synsetId: 13811032-n
simpleMeaning: In maths, the angle that has a given number as the ratio of the longest side of a right-angled
  triangle to the side next to it.
scope: 'Also called arcsec, arcsecant, and inverse secant: the angle worked out from a given number, not
  the secant itself and not the angle from a different triangle ratio.'
examples:
- The arc secant of 2 is 60 degrees.
- Use the arc secant to work out the angle.
