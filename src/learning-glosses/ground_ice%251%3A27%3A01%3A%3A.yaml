simpleMeaning: Frozen water of every kind that forms in soil that is freezing or already frozen
scope: This is frozen water in the soil itself, not a sheet of ice on a lake and not a moving mass of
  ice in the mountains.
examples:
- Ground ice can stay frozen in the soil for years.
- The road builders had to dig through ground ice.
