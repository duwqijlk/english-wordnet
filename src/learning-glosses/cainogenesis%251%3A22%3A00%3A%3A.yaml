simpleMeaning: Such as the placenta in mammals, features or parts first show while a young animal is still
  forming, though its kind had none of them in its earlier history
scope: 'Also called caenogenesis, cenogenesis, kainogenesis, and kenogenesis: features or parts that first
  show while a young animal is still forming, though its kind had none of them before.'
examples:
- Cainogenesis gave the young animal a feature its kind had not had before.
- The placenta is one case of cainogenesis in mammals.
