simpleMeaning: In law, an agreement or point given up by the sides or their lawyers about the court matter;
  it must be in writing unless part of the court record
scope: This law sense, also called judicial admission, is an agreement in a court case, not a thing that
  must be taken as true for another thing to hold.
examples:
- The lawyers signed a stipulation that the test results were correct, so the judge did not need to hear
  proof.
- A stipulation of fact was written into the court record to save time.
