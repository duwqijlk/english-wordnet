simpleMeaning: to work on part of the body with the hands, as in a massage, to help it get better
scope: This is working on the body with the hands to help it heal, not controlling a person in a clever
  way and not changing something in a dishonest way.
examples:
- The therapist manipulated the patient's back to ease the pain.
- She learned how to manipulate stiff joints with gentle massage.
