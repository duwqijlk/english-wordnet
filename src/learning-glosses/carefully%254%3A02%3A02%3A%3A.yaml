simpleMeaning: in a cautious, tactful way, as if handling something easily harmed
scope: Acting with caution and tact to avoid harm or offence, not simply paying close attention to a task.
examples:
- She carefully worded the refusal so that he would not feel rejected.
- He carefully raised the subject of her father's illness.
