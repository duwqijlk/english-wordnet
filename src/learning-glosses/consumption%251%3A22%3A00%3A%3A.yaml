simpleMeaning: In money matters, the using up of goods to meet needs or to make things.
scope: Also called use, in money matters this is using up goods to meet needs or to make things, not a
  wasting sickness of the lungs and not the plain act of using a thing up.
examples:
- The consumption of energy has increased steadily.
- Consumption of fuel rose over the winter.
