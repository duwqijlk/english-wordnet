simpleMeaning: A loaf raised with yeast, made of white flour, ground corn and dark sweet syrup.
scope: A loaf raised with yeast, made of white flour, ground corn and dark sweet syrup, not a loaf made
  of white flour alone and not a flat loaf with no yeast.
examples:
- She baked anadama bread for breakfast.
- Anadama bread is made with cornmeal and molasses.
