simpleMeaning: A heart beat with an extra sound in it, which can point to something wrong with the heart.
scope: 'Also called gallop rhythm: a heart beat with an extra sound, not a normal beat and not a murmur.'
examples:
- The doctor heard a cantering rhythm through the stethoscope.
- A cantering rhythm can warn of heart trouble.
