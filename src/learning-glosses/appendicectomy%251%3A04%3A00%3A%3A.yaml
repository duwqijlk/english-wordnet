simpleMeaning: an operation in which a surgeon takes out the appendix, the small worm-shaped tube joined
  to the large bowel
scope: 'Also called appendectomy: an operation to take out the appendix, not an operation on the bowel
  itself and not a treatment with medicine.'
examples:
- She needed an appendicectomy after the appendix burst.
- The surgeon performed an appendicectomy on the boy that morning.
