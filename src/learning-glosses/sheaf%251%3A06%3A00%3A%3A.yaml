simpleMeaning: a number of things tied up together so they can be carried or put away
scope: This is a number of things tied together; bundle is another name for this sense; not a single thing,
  and not things left loose.
examples:
- He carried a sheaf of papers under his arm.
- She tied the wheat into a sheaf for storage.
