simpleMeaning: A seeming gift for knowing things that are not there for the eyes or ears or touch to find.
scope: Not sight or hearing or any of the five senses; also called clairvoyance, extrasensory perception,
  second sight and E.S.P.
examples:
- She claimed to have ESP and to know what was in the box.
- Tests of ESP ask people to guess hidden cards.
