simpleMeaning: A cast piece of metal that holds the hollow tubes and the cooling paths of a motor.
scope: 'Also called a block and a cylinder block: a cast piece of metal that holds a motor''s tubes and
  cooling paths, not the whole motor and not a soft part that wears out fast.'
examples:
- The engine block was cracked and had to be replaced.
- The engine block holds the cylinders of the motor.
