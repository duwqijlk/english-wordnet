simpleMeaning: This person belongs to the large western branch of the Sioux people, several groups that
  lived on the plains.
scope: Also called Teton, Teton Dakota and Teton Sioux, this is a member of the large western branch of
  the Sioux people, not a member of another Sioux branch and not a member of a different plains people.
examples:
- The Lakota man told stories of the plains where his people lived.
- Many Lakota families lived on the plains in several groups.
