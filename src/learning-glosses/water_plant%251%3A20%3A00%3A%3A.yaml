simpleMeaning: Part or all of its life, this green thing lives in the wet, its roots in mud like the lotus,
  or adrift with nothing to hold it, like the hyacinth.
scope: Also called aquatic plant, hydrophyte, and hydrophytic plant, it is a plant that lives part or
  all of its life in water.
examples:
- The water plant grew partly in the mud of the pond.
- A water plant floated free without anchorage.
