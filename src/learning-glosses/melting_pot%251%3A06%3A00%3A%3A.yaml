simpleMeaning: A vessel made of stuff that does not melt easily, used for very hot chemical reactions
scope: A vessel of heat-proof stuff for very hot chemical reactions; crucible is another name for this,
  not a vessel for cooking and not a vessel that melts itself.
examples:
- The melting pot held the hot chemicals.
- She heated the mixture in a melting pot.
