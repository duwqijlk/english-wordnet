simpleMeaning: Blisters rise and the eyes and lungs are harmed by this poisonous war gas, made from sulfur
  chemicals, for which no cure is known
scope: This war gas is also called a blistering agent, mustard agent, mustard gas and sulfur mustard.
examples:
- Dichloroethyl sulfide was feared as a war gas that raises blisters.
- The army warned troops about dichloroethyl sulfide and its blisters.
