simpleMeaning: a sound made by forcing air through a narrow opening, especially as a way to show you do
  not like something
scope: A sound made by forcing air through a narrow opening to show you do not like something, also called
  hiss; not a loud ringing noise.
examples:
- The hissing of the audience showed they did not like the play.
- A loud hissing came from the crowd after the bad decision.
