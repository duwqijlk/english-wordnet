simpleMeaning: it tells how wide the hole in a gun barrel is, a little less than half an inch across,
  or how wide the shot it fires is
scope: This word is also called .45-caliber, .45-calibre, and .45 calibre, and it is the size-name for
  a gun barrel's hole, or the shot from it, at a little less than half an inch across.
examples:
- A .45 caliber handgun needs the right size of shot.
- He checked that the .45 caliber rounds matched his gun.
