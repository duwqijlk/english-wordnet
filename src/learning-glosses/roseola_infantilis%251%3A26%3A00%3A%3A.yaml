simpleMeaning: 'A viral illness of babies and young children: sudden high fever, mild sore throat; a few
  days later, a faint pinkish rash lasting a few hours to a few days.'
scope: Another name for exanthema subitum and pseudorubella, the same illness as roseola infantum; not
  measles or rubella.
examples:
- Roseola infantilis begins with a sudden high fever, and a faint pinkish rash appears a few days later.
- After the baby's fever, the doctor recognised the rash of roseola infantilis.
