simpleMeaning: a guess that turns out to be right, made by seeing clearly what others miss or by good
  luck
scope: This is a right guess made by seeing clearly or by luck, not the art of telling the future by power
  beyond nature, and not words said to come from a god.
examples:
- His divination about the winner was right, though no one else saw it coming.
- By pure divination, she guessed that the missing key was in the coat pocket.
