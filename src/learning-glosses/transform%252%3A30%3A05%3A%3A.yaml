simpleMeaning: to change a bacterial cell so it has new genes, by adding DNA (the material that carries
  a cell's genes) from another cell of the same or closely related kind
scope: Changing a bacterial cell by putting in DNA from a cell of the same or a closely related kind;
  not raising or lowering an electric current or voltage, and not changing something in maths.
examples:
- The scientists transformed the bacterial cell by adding DNA from another cell.
- In the test, a cell was transformed when DNA from a related kind was put into it.
