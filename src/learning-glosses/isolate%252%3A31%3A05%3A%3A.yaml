senseId: 'isolate%2:31:05::'
synsetId: 00657049-v
simpleMeaning: to keep experiences apart from the feelings that belong with them
scope: This is about keeping an experience apart from feelings, not about keeping a person alone away
  from others.
examples:
- In therapy, he learned to isolate the memory from the fear it brought.
- She tried to isolate what happened from how she felt about it.
