simpleMeaning: to get small folds in it, or to get crushed or pressed into folds
scope: 'Also called crumple: to get small folds in it, or to get crushed or pressed into folds, not making
  folds on a smooth flat thing and not pulling cloth into folds.'
examples:
- This fabric won't wrinkle in the wash.
- The paper wrinkled when it got wet.
