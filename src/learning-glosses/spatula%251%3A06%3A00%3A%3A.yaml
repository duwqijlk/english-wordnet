simpleMeaning: a hand tool with a thin, flat part that bends easily, used to mix soft things or spread
  them out
scope: A tool for mixing or spreading soft things; not the narrow cooking tool used to turn food over
  in a pan.
examples:
- Use a spatula to mix the soft paint well.
- He used a spatula to spread butter on the toast.
