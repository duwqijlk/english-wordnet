simpleMeaning: in a way that keeps going for a long time and does not stop or give up
scope: This sense is about the way someone keeps doing something and does not give up. It is close to,
  but listed apart from, the other sense of this word that means with a quality of not giving up.
examples:
- She asked persistently until the teacher gave her an answer.
- He knocked persistently on the door for ten minutes.
