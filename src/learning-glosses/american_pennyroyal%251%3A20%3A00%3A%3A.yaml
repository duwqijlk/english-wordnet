simpleMeaning: An upright hairy branching herb of North America with purple-blue flowers, whose essential
  oil keeps insects away and is sometimes used in folk medicine.
scope: 'Also called pennyroyal and Hedeoma pulegioides: an upright hairy herb with purple-blue flowers,
  not the European pennyroyal and not a garden mint.'
examples:
- American pennyroyal grew in a sunny patch behind the barn.
- We rubbed American pennyroyal oil on our arms to keep the gnats away.
