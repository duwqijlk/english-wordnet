simpleMeaning: a person who makes trouble by taking part in violent public trouble that breaks the peace,
  and who fights against the people in power
scope: This is a person in a violent public disturbance, not a person who protests in peace and not a
  soldier.
examples:
- Police arrested a rioter who had thrown stones at the shops.
- The rioters set fire to cars in the street.
