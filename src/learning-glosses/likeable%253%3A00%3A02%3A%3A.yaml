simpleMeaning: Of a character in a story or play, making people feel care and understanding for that character
scope: 'Also called sympathetic, appealing and likable: this is about a character in a story or play,
  not about a real person who is easy to like.'
examples:
- The hero of the play is a likeable young man, and we care what happens to him.
- In the story, even the thief is likeable, so readers feel sorry for him.
