simpleMeaning: Of a person, upright on both feet, holding the upper body straight above legs that are
  not bent.
scope: This describes a person's upright posture on the feet, not an action begun from that posture and
  not the act of getting into it.
examples:
- A standing passenger gave up her seat to an elderly man.
- The hall was so crowded that latecomers had to remain standing.
