simpleMeaning: made weaker in strength, in how much is in a mix, in quality, or in how pure it is
scope: 'Also called dilute: this means made weaker or less pure, not strong and not at full strength.'
examples:
- The diluted juice tasted weak because we added too much water.
- She cleaned the floor with diluted soap.
