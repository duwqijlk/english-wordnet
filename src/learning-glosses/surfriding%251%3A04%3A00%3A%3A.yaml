simpleMeaning: the sport of riding a board toward the shore on the top of a wave
scope: This is the sport of riding a board toward the shore on the top of a wave, also called surfing
  and surfboarding; not swimming in the waves and not sailing.
examples:
- He took up surfriding on his summer holiday.
- Surfriding needs a board and a good wave.
