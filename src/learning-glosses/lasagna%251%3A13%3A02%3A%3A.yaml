simpleMeaning: A dish baked in the oven, made of flat sheets of pasta in layers with sauce and cheese
  and meat or vegetables
scope: A baked dish of pasta layers with sauce and cheese; not a plate of plain pasta and not a meat pie.
examples:
- She served hot lasagna with a green salad.
- He made lasagna with meat and cheese for the family.
