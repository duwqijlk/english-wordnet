simpleMeaning: A small tree of the sea coasts of the warm lands of the Old World, with leaves that shine
  silver underneath.
scope: A small coastal tree of the Old World tropics with silver-backed leaves, not the large evergreen
  tree of India and Burma.
examples:
- The looking-glass plant grew along the shore, its leaves flashing silver.
- We found a looking-glass plant near the beach.
