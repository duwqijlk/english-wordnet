simpleMeaning: The good quality of being worth more than any price can show.
scope: The good quality of being worth more than any price can show, not the quality of being too fine
  or fussy in taste.
examples:
- The preciousness of the old letters lay in what they meant to her.
- He spoke of the preciousness of time with his children.
