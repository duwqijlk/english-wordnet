simpleMeaning: To do whatever is needed in advance so something is ready for a job, event, or use.
scope: This is about doing what is needed beforehand so people or things are ready, not about mending
  something broken, treating tissue for a microscope, or buying an exemption.
examples:
- The crew fixed the hall for the ceremony, setting out chairs and flowers.
- We fixed up a room upstairs for our guest.
