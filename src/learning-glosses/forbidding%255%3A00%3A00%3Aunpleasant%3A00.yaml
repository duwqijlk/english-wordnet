simpleMeaning: Hard in looks or manner, so that people do not want to come near.
scope: Hard in looks or manner, so that people do not want to come near, with grim as another name for
  this sense, and not a sign that something bad is about to happen.
examples:
- She gave him a forbidding scowl.
- The house had a forbidding look, with dark windows and a locked gate.
