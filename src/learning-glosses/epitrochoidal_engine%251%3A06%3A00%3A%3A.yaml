simpleMeaning: a machine that turns round and round and makes power by burning fuel inside it, with four
  steps in each turn and no parts that move back and forth
scope: A turning power machine with four steps and no back-and-forth parts, not a machine with pistons
  that move back and forth and not a machine that turns by wind or water.
examples:
- The epitrochoidal engine in the car turns without any pistons moving back and forth.
- An epitrochoidal engine makes power in four steps as its main part turns round.
