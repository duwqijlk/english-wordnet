simpleMeaning: a bodily condition that matches a powerful need or want.
scope: Not a passing wish or a plan; this sense is a bodily condition tied to a strong need.
examples:
- After three days without water, the hikers felt an overpowering drive to find a stream.
- Psychologists study how the drive for food shapes animal behavior.
