simpleMeaning: a device that sends out or picks up signals the same in every direction
scope: A device that sends out or picks up signals the same in every direction; also called omnidirectional
  antenna, not a device that points its signals one way and not a dish.
examples:
- The radio used a nondirectional antenna to pick up signals from all sides.
- A nondirectional antenna sends its signal out in every direction.
