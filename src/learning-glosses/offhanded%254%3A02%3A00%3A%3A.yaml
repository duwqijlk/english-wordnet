simpleMeaning: in a way that shows you have not thought much and do not care about other people's feelings
scope: 'Also called offhand and offhandedly: this tells how an action is done, in a careless, unkind way,
  not the word that describes a person or manner as careless and unkind.'
examples:
- He replied offhanded, barely looking up from his phone.
- She dismissed the question offhanded, without listening to it at all.
