simpleMeaning: a separate space in a car for bags, shopping, or tools
scope: 'Also called a boot: a space in a car for bags and shopping, not the main part of a tree and not
  a large strong case for travel.'
examples:
- He put his golf bag in the trunk.
- She opened the trunk and took out the shopping bags.
