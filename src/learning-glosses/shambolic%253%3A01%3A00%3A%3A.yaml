senseId: 'shambolic%3:01:00::'
synsetId: 03147605-a
simpleMeaning: In British slang, very messy and not well ordered
scope: This sense describes a thing or a way of doing things that is messy and not well ordered, not a
  thing that is neat and well planned.
examples:
- The office was in a shambolic state after the move.
- It is a shambolic system, and no one can make it work well.
