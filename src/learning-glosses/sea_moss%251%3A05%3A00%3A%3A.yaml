simpleMeaning: A water creature that stays attached and builds dense groups of tiny tube-shaped bodies,
  each fringed with tentacles; it grows on stones or seaweed and reproduces by budding.
scope: This is the animal colony, not the red alga that also goes by this name.
examples:
- The sea moss on that stone is a colony of tiny animals, not a plant.
- Sea moss can spread across a rock in a single season.
