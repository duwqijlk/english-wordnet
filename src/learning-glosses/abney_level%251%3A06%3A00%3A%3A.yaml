simpleMeaning: A land-measuring tool with a liquid tube that shows what is flat and a sighting tube; it
  measures the slope of a line from the user to the target
scope: A land-measuring tool with a liquid tube and a sighting tube, not a theodolite, which measures
  angles with a telescope, and not a plain spirit level used on its own.
examples:
- The surveyor checked the slope with his Abney level.
- She held the Abney level steady and read the angle.
