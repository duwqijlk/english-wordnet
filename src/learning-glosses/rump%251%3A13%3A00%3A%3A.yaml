simpleMeaning: the fleshy back part of an animal's body, just behind the lower back and above the back
  legs
scope: The fleshy hind part of an animal, not its belly and not its tail.
examples:
- The butcher trimmed the rump for the roast.
- The horse's rump was broad and strong.
