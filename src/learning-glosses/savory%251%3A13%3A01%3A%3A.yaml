simpleMeaning: A dish with a sweet smell and a spicy taste, served at the end of a meal or before it
scope: A spicy dish served at the end of dinner or as a first course; not the small herb plant and not
  the adjective for wholesome behaviour.
examples:
- They served a savory of smoked fish at the end of the meal.
- The menu opened with a savory of spiced meat.
