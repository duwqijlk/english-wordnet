simpleMeaning: to give a quality to a person, place, or thing
scope: This is giving a quality, such as charm or a special feel, to something, not handing over a thing
  as a gift.
examples:
- Her smile bestowed a warm glow on the whole room.
- The old hall bestows a quiet charm on every wedding held there.
