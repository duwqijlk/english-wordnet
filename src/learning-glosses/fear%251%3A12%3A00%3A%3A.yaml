simpleMeaning: The bad feeling you get when you think something dangerous or painful might happen, which
  often makes you want to run away or fight.
scope: This is not a mild worry about something uncertain; it is the strong feeling caused by a clear
  danger or pain.
examples:
- She felt a sudden fear when she heard footsteps behind her.
- His fear of heights stopped him from climbing.
