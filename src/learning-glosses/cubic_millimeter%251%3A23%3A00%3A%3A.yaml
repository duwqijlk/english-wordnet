simpleMeaning: A measure of size for how much space a thing takes up, equal to a tiny cube one thousandth
  of a metre on each side.
scope: Also called cubic millimetre; a tiny measure of volume, not a measure of length and not a measure
  of weight.
examples:
- The dose was measured in cubic millimeters.
- A cubic millimeter is a very small amount of space.
