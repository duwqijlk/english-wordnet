simpleMeaning: A fast-growing evergreen of tropical America, with white flowers and fleshy edible fruit;
  its bark gives a silky fibre for rope, and its wood is prized for barrel staves.
scope: Also called calabur tree, calabura, silk wood, silkwood, and Jamaican cherry; a fast-growing evergreen
  of tropical America, not a palm and not a fruit tree of Asia.
examples:
- Muntingia calabura grows fast in the warm parts of America.
- The white flowers of Muntingia calabura give way to fleshy fruit.
