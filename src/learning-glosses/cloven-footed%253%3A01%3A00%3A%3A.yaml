simpleMeaning: having to do with the split hooves of animals that chew cud or of pigs
scope: 'Also called cloven-hoofed: it describes the split hooves of cud-chewing animals or pigs, not a
  single solid hoof and not the shape of a foot in general.'
examples:
- The cloven-footed goat left two small marks in the mud.
- A cloven-footed pig walked across the yard.
