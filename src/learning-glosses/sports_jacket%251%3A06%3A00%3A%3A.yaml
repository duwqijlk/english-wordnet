simpleMeaning: a light top with one row of buttons down the front, often striped with the colours of a
  club or school
scope: 'Also called a blazer, a sport coat, a sport jacket, or a sports coat: a light jacket that closes
  with one row of buttons, not a suit jacket and not a heavy coat for cold weather.'
examples:
- He hung his sports jacket on the hook by the door.
- The sports jacket was striped in the colours of his club.
