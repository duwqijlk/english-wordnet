simpleMeaning: Soft red seeds hang on a desert bush whose stems come in sections, with almost no leaves,
  only small flat ones like scales.
scope: Also called ephedra, this is a desert bush with stems in sections and almost no leaves, not a leafy
  bush of dry land.
examples:
- The joint fir grows in the dry desert.
- A joint fir's red seeds stand out against its bare stems.
