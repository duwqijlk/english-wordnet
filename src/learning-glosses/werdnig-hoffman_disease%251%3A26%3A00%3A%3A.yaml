senseId: 'werdnig-hoffman_disease%1:26:00::'
synsetId: 14193552-n
simpleMeaning: An illness inherited from both parents, in which nerve cells in spine and brain waste away,
  so the frame muscles shrink and go limp; death often comes in early childhood.
scope: Not muscular dystrophy or polio, other illnesses that weaken muscles in children.
examples:
- Werdnig-Hoffman disease weakens a baby's muscles.
- The doctor said the child had Werdnig-Hoffman disease.
