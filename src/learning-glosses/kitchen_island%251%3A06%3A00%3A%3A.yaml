simpleMeaning: This counter in a room for cooking stands on its own, and you can reach it from every side
scope: A free-standing counter in a room for cooking, open on all sides, not a counter fixed to a wall
  and not a table for eating.
examples:
- She chopped vegetables on the kitchen island while the children sat around it.
- The kitchen island gave us extra space to prepare dinner.
