simpleMeaning: A set amount of data, 1024 mebibytes, or 1,073,741,824 bytes.
scope: A unit of data of 1024 mebibytes, not the 1000-megabyte unit and not a letter; also called gigabyte,
  gibibyte, GiB, and GB.
examples:
- The file is 3 G in size, or 3,221,225,472 bytes.
- This drive holds 2 G of data.
