simpleMeaning: one of two swellings at the end of the smell nerve at the base of the brain, just over
  the nose
scope: One of two swellings at the end of the smell nerve at the base of the brain, just over the nose;
  not the nerve itself and not a swelling elsewhere in the head.
examples:
- The olfactory bulb sits at the base of the brain above the nose.
- Signals pass through the olfactory bulb on their way to the brain.
