simpleMeaning: A male worker who cuts off big pieces of stone from a pit where stone is dug
scope: 'Also called ledgeman: a male worker who cuts off big pieces of stone where stone is dug, not a
  worker who shapes stone after it is cut.'
examples:
- The quarryman split off a block of stone for the new wall.
- As a quarryman, he spent his days cutting stone from the pit.
