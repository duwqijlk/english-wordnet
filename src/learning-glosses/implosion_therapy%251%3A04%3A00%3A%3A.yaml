simpleMeaning: This treatment keeps giving a person large amounts of one kind of thing, until they turn
  away from it or feel it less, to change how they act.
scope: Also called flooding, this treatment gives a person one kind of thing in large amounts, rather
  than a little at a time.
examples:
- Implosion therapy was part of her treatment.
- He went through implosion therapy.
