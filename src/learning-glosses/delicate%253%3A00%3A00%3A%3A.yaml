simpleMeaning: very fine and lovely, with small differences that are hard to notice, and easy to harm
  or break
scope: Very fine and lovely and easy to harm, not a tool that picks up small changes and not careful work
  done with great skill or with very fine differences.
examples:
- She wore a delicate chain of thin gold around her neck.
- The delicate wings of the butterfly tore at a touch.
