simpleMeaning: The gap between a bent ray of light and a line standing straight up from the face where
  two things meet, at the point where the ray bends
scope: The gap between a bent light ray and a line standing straight up from the face where two things
  meet, not the gap where light first hits the face and not the bend of a mirror.
examples:
- The angle of refraction grows as light enters water at a slant.
- She worked out the angle of refraction for the glass block.
