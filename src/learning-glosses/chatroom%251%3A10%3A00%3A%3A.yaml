simpleMeaning: an internet place where a number of people can talk to each other live, often about one
  set topic
scope: An internet place where people talk to each other live; chat room is another name for this sense,
  not a phone call and not a message board where replies come later.
examples:
- She opened a chatroom for fans of the show.
- The chatroom let us talk in real time.
