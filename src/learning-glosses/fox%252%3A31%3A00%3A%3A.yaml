simpleMeaning: To puzzle someone so much that they cannot think clearly.
scope: This means to baffle someone, not to trick them into doing something, and not to describe an animal
  or its fur.
examples:
- The riddle completely foxed me for a while.
- The last question on the exam foxed even the best students.
