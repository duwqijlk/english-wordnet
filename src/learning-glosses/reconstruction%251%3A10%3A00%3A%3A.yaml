simpleMeaning: Putting small pieces of evidence together to work out what they mean
scope: An account built up from small pieces of evidence; not a memory made in the mind, and not the rebuilding
  of a broken thing.
examples:
- The police made a reconstruction of the night from the clues.
- Her reconstruction of the meeting filled in the missing parts.
