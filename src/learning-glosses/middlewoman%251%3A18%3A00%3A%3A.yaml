simpleMeaning: a woman who buys goods in large amounts and sells them on to shopkeepers, not to the people
  who will use them
scope: A woman who buys in bulk and sells on to shopkeepers; not a shopkeeper herself and not a buyer
  for one shop.
examples:
- The middlewoman bought cloth in bulk and sold it to shops.
- As a middlewoman, she sells goods to merchants, not to shoppers.
