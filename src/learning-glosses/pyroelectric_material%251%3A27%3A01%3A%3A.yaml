simpleMeaning: A thing that makes a short burst of electric power for a little while when it gets hot
  or cold
scope: A thing that gives a short burst of electric power when its heat changes, not a thing that makes
  power all the time and not a plain wire.
examples:
- This pyroelectric material gives a small shock of power when it cools.
- The sensor uses a pyroelectric material to make power from a change in heat.
