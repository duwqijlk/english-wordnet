simpleMeaning: A room under the ground where dead people are put, most often under a church
scope: A burial room under the ground, most often under a church, not a wine cellar and not a grave in
  the open ground.
examples:
- The old crypt under the church held the bones of kings.
- They found a crypt beneath the floor of the chapel.
