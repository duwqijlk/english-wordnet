simpleMeaning: So people can tell who made a thing for sale, a very small bit of stuff is put into it
scope: A tiny marker added to a product to show its maker, not a part of the product itself and not a
  label on its outside.
examples:
- The identification particle in the plastic lets makers prove where it came from.
- Each batch of parts got an identification particle to show who made them.
