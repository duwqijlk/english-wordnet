simpleMeaning: to make a wild animal lose its wild ways and grow calm and willing to obey
scope: To make a wild animal lose its wild ways and grow calm and willing to obey, also called domesticate,
  domesticise, reclaim or tame, and not to hunt a wild animal or to keep one in a cage.
examples:
- She domesticized the stray dog until it followed her everywhere.
- They domesticized wolves thousands of years ago.
