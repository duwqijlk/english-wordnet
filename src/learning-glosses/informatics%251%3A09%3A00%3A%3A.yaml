simpleMeaning: The work of gathering, changing, keeping, finding again, and sorting written-down facts
  into order belongs to certain fields of study.
scope: Also called information processing and information science, it is a group of fields of study that
  work with written-down facts, gathering them, changing them, keeping them, finding them again, and putting
  them in order.
examples:
- They studied informatics and learned how written-down facts are sorted.
- Informatics showed them how to find facts kept in writing.
