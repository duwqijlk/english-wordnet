simpleMeaning: used of a marriage that has been sealed by the couple having sex for the first time after
  the wedding.
scope: This describes a marriage sealed in a physical way, not a task or piece of work that has been finished.
examples:
- In those days a marriage was not completed until the wedding night.
- The old law treated the marriage as completed only after the couple had slept together.
