simpleMeaning: where the highest law-making power lies with a group of top ministers, chosen from the
  law-making body and who must answer to it
scope: About a way of ruling where top ministers hold the highest power, not about the rules for meetings
  and not just to do with a law-making body in general.
examples:
- The country has a parliamentary system, and its top ministers must answer to the elected body.
- In a parliamentary democracy, the ministers are chosen from the law-making body.
