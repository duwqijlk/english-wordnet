simpleMeaning: to get pleasure from something and enjoy it
scope: 'Also called enjoy, relish, savor, and bask: to get pleasure from something. It is not the noun
  sense about the taste that a food or sauce gives in the mouth.'
examples:
- She savoured every moment of her holiday by the sea.
- He savoured his moment of success on the stage.
