senseId: 'commiseration%1:12:00::'
synsetId: 07569430-n
simpleMeaning: Sorrow felt with others over the bad things that have happened to them.
scope: Also called pity, and also called pathos or ruth, this is sorrow felt with others over their misfortunes,
  not the showing of sympathy with another's grief.
examples:
- She offered commiseration after his loss.
- His commiseration was warm and sincere.
