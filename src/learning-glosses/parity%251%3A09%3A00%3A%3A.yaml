synsetId: 06114921-n
simpleMeaning: In physics, the fact that this property stays the same, in a world where the laws of nature
  are the same for right-handed and left-handed ways of measuring position
scope: Also called conservation of parity, mirror symmetry and space-reflection symmetry. In physics this
  is about laws staying the same for left and right, not the mathematics sense about odd and even numbers,
  and not the number of children a woman has given birth to.
examples:
- In physics, parity is conserved when the laws work the same in left-handed and right-handed systems.
- The teacher explained parity by showing that nature does not change when left and right are swapped.
