simpleMeaning: A weed found in many places in Europe, with yellow flowers like daisies; sometimes it is
  a harmful weed and can poison cattle if they eat a lot of it
scope: Also called benweed, ragweed, and tansy ragwort, this is the European plant with yellow flowers,
  not the American kind with yellow flowers.
examples:
- Ragwort grew all along the road, with bright yellow flowers.
- The farmer pulled up the ragwort so his cattle would not eat it.
