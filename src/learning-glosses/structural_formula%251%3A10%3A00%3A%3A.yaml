simpleMeaning: a full written form that shows how the tiny parts are set out inside a molecule, the smallest
  bit of something
scope: A full written form showing how tiny parts are set out inside a molecule; not a short form with
  only letters and numbers and not a picture of a molecule.
examples:
- The structural formula shows how the atoms join in the molecule.
- Draw the structural formula before you name the compound.
