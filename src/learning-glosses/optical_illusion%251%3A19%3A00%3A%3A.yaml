simpleMeaning: something the eyes see that gives a false or misleading look
scope: Something the eyes see that gives a false or misleading look; not a thing that is really there
  and not a trick of hearing.
examples:
- The optical illusion made the lines look bent.
- An optical illusion can fool the eyes into seeing what is not there.
