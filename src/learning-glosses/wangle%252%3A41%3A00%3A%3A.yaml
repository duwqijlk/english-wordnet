senseId: 'wangle%2:41:00::'
synsetId: 02533097-v
simpleMeaning: to get something you want by using tricks or dishonest ways
scope: 'Also called manage and finagle: to get something by tricks or dishonest ways, not the noun sense
  for an act done in this way and not to run something in a normal way.'
examples:
- He wangled a free ticket by telling a clever lie.
- She wangled a day off by making up a story for her boss.
