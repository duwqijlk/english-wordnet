senseId: goddamn%5:00:02:cursed:00
synsetId: 00673178-s
simpleMeaning: swear words used in everyday speech, not formal speech, to make other words sound stronger
scope: Also called damn, blame, damned, blessed, blasted, and blamed. This word is used before another
  word to make it stronger in rough speech; it is not the word used alone to show anger or surprise.
examples:
- That goddamn car will not start again.
- He forgot the goddamn keys.
