simpleMeaning: Sudden but mild liver infection from an RNA virus that does not stay in the blood, usually
  caught by taking in food or drink soiled with feces.
scope: Also called infectious hepatitis; a short liver infection caught from soiled food or drink, not
  the long-lasting kind.
examples:
- Hepatitis A spread through the soiled water.
- She caught hepatitis A from shellfish.
