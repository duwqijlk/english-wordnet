simpleMeaning: A thick stew with a strong taste, made from any meat and any vegetables that are at hand,
  from the south of the United States
scope: A thick stew of any meat and vegetables, from the south of the United States; not a thin soup and
  not a stew made to one set recipe.
examples:
- They ate burgoo at the county fair.
- The burgoo was thick and hot, full of meat and vegetables.
