simpleMeaning: to pay one person you owe money to before another person you owe money to
scope: To pay one lender first when you owe money to more than one, not to like one thing more than another.
examples:
- The firm preferred one creditor over another when it paid its debts.
- He preferred the bank over the other lenders.
