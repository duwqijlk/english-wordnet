simpleMeaning: a person whose job is to find out about news stories and tell them to others or fix them
scope: This is a person who finds and writes news stories for work. It is not a person who just reads
  the news or tells a story to friends.
examples:
- The reporter asked questions and wrote the story for the paper.
- A reporter fixed the news story before it was printed.
