simpleMeaning: One of two tubes that carry the egg from the egg-making organ to the womb.
scope: One of two tubes from the egg-making organ to the womb; not the womb itself and not the egg-making
  organ.
examples:
- The egg travels down the oviduct to the womb.
- An oviduct carries the egg from the ovary.
