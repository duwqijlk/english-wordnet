senseId: sincere%5:00:00:serious:00
synsetId: 02126120-s
simpleMeaning: holding firmly to what you think is true, with no humour and no sign of doubt
scope: 'Also called solemn and earnest: this sense means holding firmly to your beliefs with no humour,
  not just being honest and meaning what you say.'
examples:
- He was sincere in his strong views, and he never joked about them.
- A sincere believer, she held her opinions firmly and without humour.
