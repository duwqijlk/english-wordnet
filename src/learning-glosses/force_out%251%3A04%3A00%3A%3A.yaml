simpleMeaning: in baseball, a fielder holding the ball steps on the base a runner who has to run must
  reach, and gets the runner out before the runner gets there
scope: Also called force, force-out and force play, this is an out in baseball for a runner who must run,
  not an out made by catching a hit ball.
examples:
- The shortstop got the force out at second base.
- A force out ended the inning with the bases full.
