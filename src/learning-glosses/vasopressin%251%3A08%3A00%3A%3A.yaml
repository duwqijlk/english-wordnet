synsetId: 05421490-n
simpleMeaning: A hormone from the pituitary gland and from nerve endings in the brain that tightens blood
  vessels, raising blood pressure, and makes the kidneys reabsorb water, reducing urine flow.
scope: The pituitary hormone that tightens vessels and makes the kidneys take water back, raising blood
  pressure as a result; it is the same thing as antidiuretic hormone, not adrenaline, and not a sex hormone.
examples:
- Vasopressin is released when the body needs to conserve water.
- Doctors sometimes give vasopressin to raise a patient's blood pressure.
