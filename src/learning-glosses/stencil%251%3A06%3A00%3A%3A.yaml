simpleMeaning: A sheet of metal, plastic, cardboard or other material with a design cut through it; ink
  or paint pressed through the holes prints that design on the surface below.
scope: The cut-out sheet used to print a pattern, not the act of printing with it or the printed image
  itself.
examples:
- She taped the stencil to the wall and brushed paint through the letters.
- A torn stencil leaves ragged edges on every print.
