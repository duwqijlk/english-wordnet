simpleMeaning: A doubt kept to oneself that stops a person from fully accepting something.
scope: This is holding back from fully taking a thing as true because of a doubt kept to yourself, also
  called reservation and arriere pensee, not a doubt you speak out and not a refusal to act.
examples:
- She agreed to the plan, but with a mental reservation about whether it would work.
- He gave his word with a mental reservation, still unsure that the story was true.
