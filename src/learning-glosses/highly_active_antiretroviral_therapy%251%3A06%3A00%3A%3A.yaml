simpleMeaning: 'Doctors treat AIDS and HIV with two kinds of medicine at once: one blocks the virus from
  copying itself, the other blocks a later step in its growth.'
scope: Also called drug cocktail, this is a mix of medicines used to treat AIDS and HIV, not a single
  drug taken on its own.
examples:
- Her doctor put her on highly active antiretroviral therapy last year.
- Highly active antiretroviral therapy can keep the virus under control.
