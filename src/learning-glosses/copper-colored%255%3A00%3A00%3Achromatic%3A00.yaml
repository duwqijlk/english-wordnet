simpleMeaning: of a thing with the reddish-brown look of a common metal used for coins and pipes
scope: This is the reddish-brown look of the metal copper; coppery and copper-coloured are other names
  for this sense; not a bright red, and not a dull brown.
examples:
- The copper-colored roof shone in the sun.
- She wore a copper-colored dress.
