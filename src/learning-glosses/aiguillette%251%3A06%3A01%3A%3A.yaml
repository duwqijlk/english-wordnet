simpleMeaning: A short plaited cord with a metal tip hangs from the shoulder of a uniform, there only
  to dress it up.
scope: Aglet and aiglet are also names for the metal-tipped dress cord that hangs from the shoulder of
  a uniform.
examples:
- The aiguillette hung from the shoulder of the uniform.
- An aiguillette tipped with metal finished off the dress uniform.
