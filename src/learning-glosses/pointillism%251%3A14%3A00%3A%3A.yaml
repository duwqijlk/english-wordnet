simpleMeaning: A group of painters, led by Georges Seurat in late nineteenth-century France, who painted
  with tiny dots of pure colors that blend in the eye.
scope: This is the painters' group and movement, not the dot-painting technique or the painting genre
  it produced.
examples:
- Seurat's followers carried pointillism into the new century.
- At first the public mocked pointillism, but collectors soon prized it.
