senseId: 'annexation%1:04:00::'
synsetId: 00079356-n
simpleMeaning: the formal act of taking something, especially land, by winning it in war or by moving
  in and taking control of it
scope: The formal taking of land by war or by moving in, not the wider sense of joining or uniting one
  thing with another.
examples:
- The annexation of the island made it part of the larger country.
- People in the town spoke against the annexation of their land.
