simpleMeaning: One old ruling house of Europe, in power in France from 1589 to 1793, and also in Spain,
  Naples and Sicily.
scope: This is a royal line of Europe, also called Bourbon dynasty, not a single king nor the family member.
examples:
- The Bourbon line held the French throne from 1589 to 1793.
- Bourbons also ruled in Spain, Naples and Sicily.
