simpleMeaning: 'How much a set of numbers spreads out: take how far each number sits from the middle value,
  and take the mean of those gaps.'
scope: It is a single figure for the spread of a set of numbers, not for where its middle value lies,
  and it is also called average deviation.
examples:
- The average absolute deviation of the scores was small, so they lay close together.
- She worked out the average absolute deviation to see how spread out the test results were.
