senseId: 'organizer%1:06:00::'
synsetId: 03924859-n
simpleMeaning: 'A small, light, hand-held machine like a small computer, made to do a set of tasks: a
  diary, a store of personal facts, a telephone, an alarm clock, and more'
scope: This machine sense is also called organiser, personal digital assistant, personal organiser, and
  personal organizer; it is not a person who brings order to a business or group.
examples:
- She kept her dates and phone numbers in a small electronic organizer.
- His organizer rang to wake him in the morning.
