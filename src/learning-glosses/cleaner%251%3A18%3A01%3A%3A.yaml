simpleMeaning: the person who runs a shop where clothes are washed in a special way without water
scope: The person who runs a shop where clothes are washed without water; not a liquid or powder used
  to wash things, and not a person whose job is to wash rooms and buildings.
examples:
- The cleaner who owns the shop on the corner washed my coat without water.
- She asked the cleaner to have her wedding dress ready by Saturday.
