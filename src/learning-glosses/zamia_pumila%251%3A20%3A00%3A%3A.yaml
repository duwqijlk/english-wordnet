scope: A small tough woody plant of Florida, the West Indies and Cuba; coontie, Florida arrowroot and
  Seminole bread are other names for this sense, not other woody plants of Florida whose roots give no
  arrowroot.
examples:
- Zamia pumila grows in the sandy soil of Florida.
- The Zamia pumila roots yield arrowroot.
