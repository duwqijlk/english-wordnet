simpleMeaning: A tough Chinese climber, now wild across the United States. It is grown as an ornamental
  for its glossy, heart-shaped, cinnamon-scented leaves, and in the tropics for its edible tubers.
scope: The ornamental climbing yam grown for its leaves and tubers, not the cinnamon tree whose bark is
  the spice.
examples:
- Cinnamon vine has spread far beyond gardens in the eastern United States.
- Gardeners plant cinnamon vine for its glossy, heart-shaped leaves.
