simpleMeaning: In the wet, marshy ground of the northeast of North America stands a small tree whose branches
  spread wide and grow thick with leaves, its wood of poor quality.
scope: A small tree of wet ground in the northeast, with wide branches and poor wood; black spruce is
  another name for it, not the shrubby pine of the northwest coast.
examples:
- The spruce pine grows in wet ground in the northeast of North America.
- The spruce pine has wide-spreading branches thick with leaves.
