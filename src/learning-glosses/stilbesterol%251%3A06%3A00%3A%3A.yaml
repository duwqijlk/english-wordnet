simpleMeaning: a man-made drug, not a steroid, that acts like estrogen; once used for period trouble,
  but later tied to vaginal cancers in daughters of women given it in pregnancy
scope: 'Also called diethylstilbesterol: a drug that acts like estrogen, not a natural hormone and not
  a drug still used for period trouble.'
examples:
- Doctors once gave stilbesterol to women with period problems.
- Stilbesterol was later tied to cancers in the daughters of women who took it.
