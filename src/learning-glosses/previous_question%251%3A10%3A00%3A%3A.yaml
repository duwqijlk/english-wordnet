simpleMeaning: A call for a quick vote on the matter being talked about by a group that meets to decide
  things
scope: A call for a quick vote on the matter being talked about by a group that meets to decide things;
  not a vote on the matter itself and not a call to put the matter off.
examples:
- The chair put the previous question to the assembly.
- A member moved the previous question to end the debate.
