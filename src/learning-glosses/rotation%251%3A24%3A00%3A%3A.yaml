simpleMeaning: In maths, a change in which the lines that show direction are turned by a set angle around
  a fixed centre
scope: In maths, a turning of the direction lines by a set angle around a fixed centre; not a planned
  order of things taking turns, and not the act of turning on an axis.
examples:
- A rotation of 90 degrees turns the shape onto its side.
- We studied rotation in maths today.
