simpleMeaning: held in place by its lower end, as some pollen sacs are held to their thin stalks
scope: Held in place by its lower end, not hanging free and not held by its tip.
examples:
- The basifixed anther sat on the end of its thin stalk.
- In this flower the basifixed pollen sacs do not swing free.
