simpleMeaning: In logs, the whole-number part, with its sign, of a log's value — in ‘log 643 = 2.808’
  it is 2
scope: In logs, the whole-number part of a log's value, not a quality of a machine and not a striking
  quality of a thing.
examples:
- For log 643, the characteristic is 2.
- The characteristic of the log tells you the size of the number.
