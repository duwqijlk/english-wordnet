simpleMeaning: the state of being the last or the most extreme in size, time, distance, or amount
scope: The state of being last or most extreme; ultimateness is another name for this sense, and it is
  not a thing being merely finished or the top place in a ranking.
examples:
- The ultimacy of these social values left no room for doubt.
- He spoke of the ultimacy of life and death.
