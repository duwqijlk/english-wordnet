simpleMeaning: to cook food gently in hot liquid that is just barely bubbling
scope: To cook food gently in hot, just-bubbling liquid, not to boil it hard and not to fry it.
examples:
- She poached the eggs in water that was barely moving.
- He poached the fish in milk until it was tender.
