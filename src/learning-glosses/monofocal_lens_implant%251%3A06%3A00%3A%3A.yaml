simpleMeaning: After surgery for a cataract, a clouding of the eye, this piece is put in the eye to give
  clear sight at a distance, with one point of focus
scope: After surgery for a cataract, this piece is put in the eye to give clear sight at a distance, not
  a pair of glasses and not a piece that focuses at more than one distance.
examples:
- After the cataract was taken out, the surgeon put in a monofocal lens implant.
- Her monofocal lens implant gives her clear sight for driving, but she needs glasses to read.
