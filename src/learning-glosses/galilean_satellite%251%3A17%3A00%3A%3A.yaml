simpleMeaning: One of the four moons of Jupiter discovered by Galileo.
scope: Also called Galilean; a moon of Jupiter found by Galileo, not a moon that circles another planet.
examples:
- The Galilean satellite Europa is covered in ice.
- We watched a Galilean satellite pass across the face of Jupiter.
