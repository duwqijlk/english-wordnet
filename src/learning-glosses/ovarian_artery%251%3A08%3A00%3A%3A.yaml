simpleMeaning: A blood tube that comes off the main blood tube of the body and carries blood to the egg-making
  organs.
scope: A blood tube from the main blood tube to the egg-making organs; arteria ovarica is another name
  for this sense, not the blood tube to the womb and not the main blood tube itself.
examples:
- The ovarian artery carries blood to the ovaries.
- The surgeon tied off the ovarian artery.
