senseId: 'royal%1:06:00::'
synsetId: 04122896-n
simpleMeaning: In sailing, the sail set directly above the topgallant, which is the sail immediately below
  it near the top of the mast.
scope: This is the small upper sail of a ship, not any of the adjective senses meaning of, fit for, ranked
  as, or crowned as a monarch, and not the noun meaning a stag with at least twelve antler points.
examples:
- With the wind steady, the crew set the royal above the topgallant.
- The royal flapped loudly as the ship came about.
