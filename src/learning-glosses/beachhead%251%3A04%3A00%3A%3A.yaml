senseId: 'beachhead%1:04:00::'
synsetId: 00037020-n
simpleMeaning: A first thing achieved that makes it possible to go further.
scope: A first thing achieved that makes it possible to go further, also called a foothold; not a bridgehead
  taken on the enemy's shore by troops landing from the sea.
examples:
- The small shop was a beachhead for the firm in a new town.
- They saw the first sale as a beachhead, a start they could build on.
