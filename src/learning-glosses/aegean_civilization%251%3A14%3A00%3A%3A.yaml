simpleMeaning: The very old peoples who lived on the islands in the sea east of Greece and in the lands
  around it.
scope: 'Also called Aegean civilisation and Aegean culture: the very old peoples on the islands in the
  sea east of Greece and in the lands around it, not the peoples of today and not the sea itself.'
examples:
- Aegean civilization built towns on the islands.
- The Aegean civilization traded across the sea.
