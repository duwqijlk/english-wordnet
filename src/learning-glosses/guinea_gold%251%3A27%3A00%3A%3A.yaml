simpleMeaning: Water pipes, other metal fittings, and low-cost jewelry are made from this brass, which
  holds so much copper that it turns a touch red.
scope: Also called red brass, this is a reddish brass used for pipes, fittings, and cheap jewelry, not
  gold and not plain yellow brass.
examples:
- The guinea gold taps in the old house had a warm reddish shine.
- Guinea gold was used for cheap jewelry because it looked rich but cost little.
