simpleMeaning: A striking evergreen shrub of the southeastern US, with glossy leaves, angular branches
  and rounded clusters of pink to reddish flowers.
scope: Another name for fetter bush; it has pink to reddish flower clusters, not the small white bell-shaped
  flowers of the other fetterbush.
examples:
- Fetterbush grew in dense evergreen stands near the creek.
- The fetterbush by the porch was covered in pinkish blooms.
