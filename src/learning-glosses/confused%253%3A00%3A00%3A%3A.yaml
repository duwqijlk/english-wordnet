simpleMeaning: not able to think clearly or act in a sensible way, because the mind is not clear
scope: It is about a person whose mind is not clear and who cannot act well. It is not about being lost
  in place or time, and not about words or plans in no clear order.
examples:
- After the accident, he was confused and could not answer simple questions.
- She felt confused and did not know what to do next.
