simpleMeaning: A jay, a kind of bird, of northern North America, with a black-topped head and no crest,
  known for bold stealing.
scope: A jay of northern North America; camp robber, gray jay and grey jay are other names for this sense,
  not a crow and not a bird with a crest.
examples:
- The whisker jack stole food from our camp without fear.
- A whisker jack sat on the branch, its black-topped head easy to see.
