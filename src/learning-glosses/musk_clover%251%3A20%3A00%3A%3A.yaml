simpleMeaning: A low one-year plant from Europe, now growing wild in America, much like the plant called
  alfilaria.
scope: A low one-year plant from Europe, now growing wild in America; muskus grass is another name for
  it, not a tall plant and not a clover grown for feed.
examples:
- Musk clover spread along the dry field edge.
- She pressed a sprig of musk clover in her book.
