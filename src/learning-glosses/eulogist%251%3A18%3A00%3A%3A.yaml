simpleMeaning: a person who gives a speech that praises someone
scope: 'Also called panegyrist: a person who gives speeches of praise, not a person who gives a speech
  to teach and not someone who speaks in a court.'
examples:
- The eulogist stood up and praised the woman's long life of service.
- At the funeral, the eulogist spoke of the man's kindness and good work.
