simpleMeaning: a person of very great importance who is widely known and respected
scope: 'Also called giant, titan, heavyweight, and colossus: a person of very great importance and wide
  fame, not a very large animal or a big company.'
examples:
- As a behemoth of science, she was asked to lead the new research centre.
- The old judge was a behemoth in the legal world, known and respected by everyone.
