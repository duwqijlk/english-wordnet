simpleMeaning: the sound a brief burst of escaping steam makes, as from an engine
scope: The sound of a short steam burst, not the single hard breath taken through the mouth or the clothing
  worn on the legs.
examples:
- The steady pant of the steam engine filled the shed.
- The engine's pant slowed as it came to rest.
