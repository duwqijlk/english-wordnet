simpleMeaning: In criminal law, money a backer must give up if a person charged with a crime does not
  come to court for trial
scope: 'Also called bail or bond: in criminal law, money lost by the backer if the accused stays away
  from trial, not a fine and not a court fee.'
examples:
- The judge set the bail bond at $10,000.
- The alderman furnished a $10,000 bail bond.
