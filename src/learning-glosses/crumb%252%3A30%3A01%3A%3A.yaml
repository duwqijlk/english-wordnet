simpleMeaning: to break something into very small pieces
scope: To break food into small pieces; not the small piece itself, not putting small pieces on food as
  a coat, and not taking small pieces off food.
examples:
- Crumb the dry bread into a bowl with your fingers.
- She crumbed the stale cake into small pieces over the plate.
