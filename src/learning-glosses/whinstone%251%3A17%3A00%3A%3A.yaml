simpleMeaning: Any of several kinds of hard coloured rock, above all rock made of chert (a very hard rock)
  or of dark rock from cooled melted rock.
scope: Any of several kinds of hard coloured rock; whin is another name for this sense, not soft rock
  and not sand.
examples:
- The wall was built of whinstone from the quarry.
- Whinstone is a hard rock often used for roads.
