simpleMeaning: A shrub of the eastern and southern coasts of the United States, with lovely clusters of
  white flowers that smell of spice.
scope: This is a shrub of the eastern and southern coasts with white flowers that smell of spice, also
  called pepper bush, summer sweet, or white alder, and not a lilac or a mock orange.
examples:
- The sweet pepperbush bloomed white along the coast.
- Bees crowded the sweet pepperbush flowers.
