simpleMeaning: To do with the care of God for the world and all in it.
scope: To do with the care of God for the world and all in it; not the use for a thing so lucky or so
  fitting it seems sent by God, and not the use for a thing that comes from God's care.
examples:
- Their trust was providential, resting on God's care for all things.
- The teaching was providential, about how God guides the world.
