simpleMeaning: Single hairs along its whole length mark this ringed worm, which lives on land or in water
  and has both male and female parts in one body.
scope: Also called oligochaete worm, this ringed worm lives on land or in water, with both male and female
  parts in one body and single hairs along its whole length.
examples:
- The oligochaete lived on land.
- An oligochaete lived in water.
