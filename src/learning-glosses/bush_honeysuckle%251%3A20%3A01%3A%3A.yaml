simpleMeaning: a wide-spreading shrub of the north-east of the United States with small groups of sweet-smelling
  green and yellow flowers
scope: A wide-spreading shrub of the north-east of the United States with small groups of sweet-smelling
  green and yellow flowers, not the south-eastern kind with big crowded yellow flower heads and not a
  climbing honeysuckle.
examples:
- Bush honeysuckle grew along the edge of the woods.
- The bush honeysuckle's small green and yellow flowers smelled sweet.
