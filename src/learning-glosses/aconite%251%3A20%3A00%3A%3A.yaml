simpleMeaning: One of a group of plants that are usually poisonous, with thick underground roots, leaves
  cut into lobes like a hand, and blue or white flowers.
scope: A usually poisonous plant of the group called Aconitum, with thick roots and lobed leaves.
examples:
- Aconite grows wild along the stream bank.
- The gardener warned us that the aconite in the border is poisonous.
