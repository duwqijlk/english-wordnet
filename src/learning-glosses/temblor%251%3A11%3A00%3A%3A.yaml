senseId: 'temblor%1:11:00::'
synsetId: 07443554-n
simpleMeaning: Shaking and trembling at the surface of the earth, caused by movement deep down along a
  crack in the rock or by a volcano
scope: Shaking and trembling at the surface of the earth from movement deep down or a volcano, also called
  an earthquake, a quake, and a seism; not a shaking from a passing truck and not a sea wave.
examples:
- The temblor shook the town for ten seconds.
- A temblor from the volcano rattled the windows.
