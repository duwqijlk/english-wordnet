simpleMeaning: the study of sorting things into groups in a fixed, orderly way
scope: The study of sorting things into groups in a fixed, orderly way, not the groups themselves and
  not the act of sorting one thing.
examples:
- She works in systematics, sorting plants into groups.
- Systematics gives each living thing a place in a larger order.
