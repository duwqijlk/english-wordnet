simpleMeaning: A lack of the female sex hormone can be treated with a man-made form of a body chemical
  that also occurs in nature.
scope: Also called oestriol, this is a body chemical found in nature whose man-made form is used when
  the body lacks the female sex hormone.
examples:
- The doctor said the estriol level in her blood was low.
- She was given estriol to treat the lack of the female sex hormone.
