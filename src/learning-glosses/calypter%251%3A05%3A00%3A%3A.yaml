simpleMeaning: a small flat part like a scale between the bottom of a two-winged fly's wing and the halter,
  the small knob that helps the fly keep its balance
scope: 'Also called alula: a small scale-like part at the base of a fly''s wing, not a wing itself and
  not a leg.'
examples:
- The calypter lies between the wing base and the halter of the fly.
- Under the lens, the calypter looked like a tiny scale.
