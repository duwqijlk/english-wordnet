senseId: riotous%5:00:00:immoral:00
synsetId: 01553629-s
simpleMeaning: not held back by common ways of living or by ideas of right and wrong
scope: Also called fast, dissipated, degraded, degenerate, debauched, profligate, dissolute, and libertine,
  this means living with no hold from right and wrong. It is not the sense about loud trouble, fighting,
  or disorder in a crowd.
examples:
- They led a riotous life, with drink and no thought for right or wrong.
- His riotous living shocked the small town.
