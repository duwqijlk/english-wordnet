synsetId: 00343635-v
simpleMeaning: to come out little by little and become clear or visible
scope: This sense is about a story, plan or fact slowly becoming known, not about a living thing growing,
  and not about making a photograph visible.
examples:
- The full story only developed after the police spoke to witnesses.
- It gradually developed that the two men had known each other for years.
