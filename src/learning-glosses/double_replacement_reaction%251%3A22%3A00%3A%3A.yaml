simpleMeaning: Each of two compounds, chemicals made of joined parts, gives its charged bit with a positive
  charge to the other, and takes the other's bit in return.
scope: This is a chemical process in which two compounds swap their positive charged bits with each other.
examples:
- In the double replacement reaction, the two compounds swapped positive ions.
- We wrote out the double replacement reaction on the board.
