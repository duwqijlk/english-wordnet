simpleMeaning: A common thorny tropical American tree with sprays of yellow flowers and edible pods curved
  like a sickle; it yields good timber, a yellow dye and a sticky gum.
scope: This is the thorny American tree with curved edible pods, not the true tamarind.
examples:
- Manila tamarind grows quickly in dry tropical soil.
- She made a tart drink from the pulp of manila tamarind pods.
