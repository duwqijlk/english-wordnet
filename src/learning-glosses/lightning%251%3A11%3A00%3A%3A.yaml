simpleMeaning: the flash of light that comes with a burst of power in the sky, or a flash like it, that
  can shine for a second or more
scope: The flash of light that comes with a burst of power in the sky, not the burst of power itself and
  not the noise that comes after it.
examples:
- Lightning lit up the whole sky.
- We saw lightning flash over the hills.
