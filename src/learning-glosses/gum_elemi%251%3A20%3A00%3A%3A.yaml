simpleMeaning: A sweet-smelling sticky stuff got from trees of the Burseraceae family and burned as incense.
scope: A sweet-smelling sticky stuff got from trees of the Burseraceae family and burned as incense; elemi
  is another name for it, not the sweet-smelling resin that is also used in perfume and not the sticky
  stuff used to thicken food.
examples:
- The priest burned gum elemi as incense.
- Gum elemi came from trees of the Burseraceae family.
