simpleMeaning: A time of fierce trouble and upset, as in politics or in how people live.
scope: 'Also called turbulence and upheaval: a time of fierce trouble and upset, as in politics or in
  how people live, not a calm and orderly time.'
examples:
- The Sturm und Drang of those years was a time of fierce trouble and upset.
- Sturm und Drang marked the politics of the time, with fierce trouble everywhere.
