simpleMeaning: a poisonous plant from Europe and Asia that lives for many years, with wide round leaves,
  yellow flowers and a root part made of many fibres
scope: 'Also called wolf''s bane and wolfbane: this is the poisonous plant with yellow flowers, not a
  wolf and not a poison in general.'
examples:
- Wolfsbane grows wild in the hills, but you must not eat it.
- She painted the yellow flowers of the wolfsbane by the path.
