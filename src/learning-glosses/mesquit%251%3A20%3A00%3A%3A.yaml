simpleMeaning: Small flowers in tube-shaped spikes in the leaf joints come first, then big sweet pods,
  on any of several small thorny trees or bushes of the Prosopis group
scope: Any of several small thorny trees or bushes, also called mesquite.
examples:
- Mesquit pods are sweet enough to chew.
- A mesquit stood in the yard.
