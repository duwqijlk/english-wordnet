simpleMeaning: The part of living things' chemistry that deals with the make-up and the work of enzymes
scope: This is the part of living things' chemistry that deals with the make-up and the work of enzymes,
  not the study of food alone and not the study of illness alone.
examples:
- She studied enzymology to learn how enzymes work in living things.
- Enzymology deals with the make-up of enzymes.
