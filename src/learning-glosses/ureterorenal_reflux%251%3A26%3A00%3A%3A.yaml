simpleMeaning: urine flowing back from the tube that leads to the bladder into the hollow part of the
  kidney where urine gathers
scope: Urine that flows back toward the kidney, not urine flowing the normal way down to the bladder and
  not stomach acid flowing back up.
examples:
- The scan showed ureterorenal reflux after the boy's kidney infection.
- Her doctor found ureterorenal reflux when urine flowed back into her kidney.
