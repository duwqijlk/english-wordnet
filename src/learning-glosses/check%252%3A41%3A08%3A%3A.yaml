simpleMeaning: make something less strong or intense, soften it, keep it under control, and stop it from
  going past set limits
scope: This is not stopping a moving thing suddenly, not blocking an opponent in a game, and not holding
  back a danger or an enemy.
examples:
- The bank raised interest rates to check inflation.
- She checked her anger and answered calmly.
