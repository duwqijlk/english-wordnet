simpleMeaning: In a blob of foam it makes, a tiny jumping plant-eater lives, guarding itself and its young.
scope: Also called a spittlebug, this tiny jumping plant-eater makes a blob of foam and lives in it.
examples:
- A spittle insect lives in the blob of foam it makes.
- The spittle insect jumped from one leaf to another.
