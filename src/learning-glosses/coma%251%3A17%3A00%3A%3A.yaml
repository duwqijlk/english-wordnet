simpleMeaning: In astronomy, a bright cloud of dust and gas round the cold heart of a comet, that forms
  as the comet moves near the sun and warms up
scope: In astronomy, the bright cloud round a comet's cold heart, not a tuft of hairs or leaves on a plant.
examples:
- The coma of the comet glowed brightly as it neared the sun.
- Through the telescope, the coma looked like a pale cloud around the comet's head.
