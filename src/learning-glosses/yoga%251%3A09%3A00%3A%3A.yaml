simpleMeaning: a way of training the mind through what you do, what you know, and what you give yourself
  to, until you reach clear, calm sight of what is true
scope: A mind-training discipline, not the system of body and breathing exercises also called yoga.
examples:
- She practises yoga each morning to train her mind and find calm.
- His yoga is a path of action, learning, and devotion.
