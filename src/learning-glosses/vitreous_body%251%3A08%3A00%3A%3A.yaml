simpleMeaning: A clear jelly with no colour fills the back part of the eyeball, hiding nothing behind
  it.
scope: Also called vitreous humor and vitreous humour, it fills the back part of the eyeball with a clear
  jelly you can see through.
examples:
- Through the pupil, the vitreous body could be seen as a clear jelly.
- The vitreous body lay at the back of the eyeball, clear and see-through.
