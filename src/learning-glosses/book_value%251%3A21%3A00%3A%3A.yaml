simpleMeaning: The value at which an asset is recorded on a balance sheet, equal to its cost minus accumulated
  depreciation
scope: This is the figure a firm records for a thing it owns, worked out from what it paid for it less
  the wear since then.
examples:
- The book value of the van fell each year as it wore out.
- The book value of the old press was far less than what it had cost when new.
