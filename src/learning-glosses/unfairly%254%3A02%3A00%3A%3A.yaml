simpleMeaning: in a way that is not fair
scope: This is about a way of acting that is not fair. It is not about being fair, and it is not a noun
  for a wrong act.
examples:
- The teacher treated him unfairly by giving him extra work.
- They said the rules were used unfairly against small teams.
