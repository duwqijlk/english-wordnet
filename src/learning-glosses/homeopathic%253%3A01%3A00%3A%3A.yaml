senseId: 'homeopathic%3:01:00::'
synsetId: 03084394-a
simpleMeaning: relating to treating illness with very small amounts of a substance that in big amounts
  would cause the same illness in a healthy person
scope: Relating to this one way of treating illness, not to regular medicine in general and not to any
  other kind of treatment.
examples:
- She chose a homeopathic treatment instead of regular medicine.
- Homeopathic remedies are made with very small amounts of substances.
