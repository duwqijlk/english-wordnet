simpleMeaning: a very hard plain cake of baked dough with no salt, once the main food on ships
scope: 'Also called hardtack, pilot biscuit, pilot bread and ship biscuit: a very hard dry food once kept
  on ships, not a soft fresh loaf and not a sweet cake.'
examples:
- Sailors lived on sea biscuit for weeks at a time.
- The sea biscuit was so hard he had to soak it in water.
