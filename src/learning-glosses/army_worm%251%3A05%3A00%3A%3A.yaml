simpleMeaning: Above all grass and grain are eaten up by the young of a night-flying moth that move in
  huge crowds.
scope: These moth young are also called armyworm, and are not the army cutworm young that eat grain crops
  and alfalfa in the middle western states.
examples:
- The army worms moved in huge crowds through the grass.
- Army worms ate the grass and the grain.
