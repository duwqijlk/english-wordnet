simpleMeaning: a group of lines of energy waves (electromagnetic radiation) that run side by side in nearly
  the same direction
scope: A set of lines of light or other waves running side by side; not the thick bar in a building, not
  the bar women gymnasts use, and not a feeling of happiness.
examples:
- The machine sends out a thin beam of X-rays.
- A strong beam of light came in through the window.
