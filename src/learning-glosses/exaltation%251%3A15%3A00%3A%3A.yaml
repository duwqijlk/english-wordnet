simpleMeaning: the place of a planet in the zodiac (the band of signs in the sky) where people believe
  it has its strongest effect
scope: This is the place of a planet in the sky signs where its effect is believed to be strongest, not
  a flock of larks flying overhead.
examples:
- In old star books, the exaltation of the sun was said to be in Aries.
- They worked out the planet's exaltation from its place among the sky signs.
