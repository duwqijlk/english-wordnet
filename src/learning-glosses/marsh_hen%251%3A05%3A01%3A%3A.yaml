simpleMeaning: any of several small water birds of the group called Gallinula, told apart from rails by
  a flat plate on the forehead and by looking like a farm hen
scope: 'Also called gallinule, swamphen, and water hen: a small water bird with a plate on its forehead,
  not a rail and not a farm hen.'
examples:
- A marsh hen swam through the reeds with its young.
- We saw a marsh hen with a pale plate on its forehead.
