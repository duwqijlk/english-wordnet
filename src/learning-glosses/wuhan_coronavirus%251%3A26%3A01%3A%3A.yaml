simpleMeaning: A disease caused by the germ SARS-CoV-2, which spread round the world in 2020
scope: 'Also called coronavirus, corona, coronavirus disease 2019, novel coronavirus pneumonia, 2019-nCoV
  acute respiratory disease, COVID-19, Wuhan flu, Wuhan pneumonia, or Wuhan virus: a disease caused by
  the germ SARS-CoV-2, which spread round the world in 2020, not the common cold and not the flu.'
examples:
- Wuhan coronavirus spread round the world in 2020.
- Wuhan coronavirus is caused by the germ SARS-CoV-2.
