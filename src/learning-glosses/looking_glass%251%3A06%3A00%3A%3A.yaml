simpleMeaning: A flat shiny surface that shows your face, most often the kind a woman uses while getting
  dressed
scope: Also called glass, this is a mirror, most often the kind a woman uses while dressing, not a window
  and not a picture.
examples:
- She checked her hair in the looking glass before she left.
- The looking glass on the wall showed her whole dress.
