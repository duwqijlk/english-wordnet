simpleMeaning: the power of a thing to draw people in by seeming to offer them a reward
scope: The power of a thing to draw people in by seeming to offer a reward; not the act of talking a person
  into a thing, and not the thing used to trap fish or animals.
examples:
- The lure of easy money drew many young men to the city.
- Fame has a strong lure for some people.
