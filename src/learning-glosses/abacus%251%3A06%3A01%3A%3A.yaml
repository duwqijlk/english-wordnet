senseId: 'abacus%1:06:01::'
synsetId: 02668977-n
simpleMeaning: a flat block placed flat on the top part of a post, which helps to hold up the beam that
  lies across the top
scope: This is the flat block at the top of a stone post in a building; it is not the counting frame with
  beads that slide on rods.
examples:
- The stone abacus sits on top of the column and holds the beam.
- Each column in the old hall has a wide, flat abacus at its top.
