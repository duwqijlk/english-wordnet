senseId: shortsighted%5:00:00:improvident:00
synsetId: 01902113-s
simpleMeaning: not thinking ahead about what will happen later, and seeing only a small range of what
  could happen
scope: This is about thinking, also called short and also called myopic; it is not the eye sense of not
  seeing far things clearly.
examples:
- Cutting the school money was a shortsighted plan that will cause bigger costs later.
- His shortsighted choice saved money today but left nothing for next year.
