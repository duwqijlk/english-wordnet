simpleMeaning: a tall tree of Africa, India, and Malaysia with fan-shaped leaves; it gives hard wood,
  sweet sap for wine and sugar, and leaves used for roof cover and weaving
scope: The same tall fan-leaved tree as longar palm, also called palmyra, palmyra palm, toddy palm, and
  wine palm, not a small bush and not a tree grown only for fruit.
examples:
- The lontar grows tall in Africa, India, and Malaysia.
- We drank wine made from lontar sap.
