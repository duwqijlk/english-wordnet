simpleMeaning: A four-sided board under the strings gives out the sound of this old stringed instrument,
  which is like a lyre or a zither.
scope: It is the old stringed instrument, kin to the lyre and the zither, whose sound comes from a four-sided
  board under the strings.
examples:
- They played a tune on the psaltery.
- The player tuned the psaltery before playing.
