simpleMeaning: For a few moments a person loses awareness and some muscles jerk or twitch, in a seizure
  that is soon over.
scope: It is also called epilepsia minor, the short seizure in which awareness goes for a few moments
  and some muscles jerk.
examples:
- The girl was frightened by her first petit mal.
- During the petit mal, his muscles gave brief jerks.
