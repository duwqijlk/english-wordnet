simpleMeaning: Many small sacs of fluid fill the blood-cleaning organs, which grow large in this sickness
  and often stop working
scope: A sickness of the blood-cleaning organs that grow large and fill with many sacs, often leading
  to their failure, not the failure itself.
examples:
- Polycystic kidney disease left her kidneys large and full of small sacs of fluid.
- His polycystic kidney disease often made his kidneys stop working.
