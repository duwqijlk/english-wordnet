simpleMeaning: the quality of being pure and new, as if just made, and not gone stale or spoiled
scope: The pure, just-made quality of food or air, not newness of ideas and not rudeness.
examples:
- She loved the freshness of newly baked bread.
- The freshness of the air revived him.
