simpleMeaning: a ring-shaped blind spot that sits around the middle of what a person sees
scope: A ring-shaped blind spot around the centre of a person's sight, not a blind spot that covers the
  centre itself and not a general loss of sight.
examples:
- The doctor found an annular scotoma that left a ring of darkness around the centre of her vision.
- He could read the words in the middle of the page, but his annular scotoma hid the words in a ring around
  them.
