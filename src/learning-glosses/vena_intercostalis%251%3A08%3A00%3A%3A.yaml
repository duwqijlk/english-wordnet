simpleMeaning: Several blood tubes that drain the spaces between the ribs of the rib cage.
scope: Several blood tubes draining the spaces between the ribs; intercostal vein is another name for
  this sense; not a blood tube of the arm and not one of the belly.
examples:
- The vena intercostalis drains the space between two ribs.
- The vena intercostalis carries blood away from the rib spaces.
