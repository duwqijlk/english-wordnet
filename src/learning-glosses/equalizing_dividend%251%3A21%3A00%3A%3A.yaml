simpleMeaning: A payment to share owners that makes up for money lost when the plan for payments changes.
scope: A payment that makes up for a loss when the payment plan changes, not a regular share payment and
  not a bonus for good results; no other name is listed for this sense.
examples:
- The firm paid an equalizing dividend after it changed its payment dates.
- Holders got an equalizing dividend to cover the loss from the new plan.
