simpleMeaning: a small airship with no stiff frame, used for watching an area, or as a barrage balloon,
  a balloon kept in the sky to stop enemy planes
scope: A small airship used for watching an area or for blocking planes, not the meat food with the same
  name.
examples:
- A sausage hung in the sky above the camp, watching for enemy planes.
- The men raised the sausage to block low-flying planes.
