simpleMeaning: not being able to see well in dim light, from too little vitamin A or from a fault in the
  back of the eye
scope: Not being able to see well in dim light; also called moon blindness and night blindness, not being
  blind in bright light and not short sight.
examples:
- Nyctalopia made it hard for him to drive at dusk.
- Her nyctalopia came from too little vitamin A.
