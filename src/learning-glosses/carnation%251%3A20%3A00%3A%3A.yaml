simpleMeaning: A plant from Europe and Asia with pink to purple-red flowers that smell like spice and
  are usually double; people grow it widely in many types and many colors
scope: Also called gillyflower and clove pink, this is the plant itself, not the pink or reddish-pink
  color with the same name.
examples:
- She wore a pink carnation in her hair.
- The garden was full of carnations in red, white and pink.
