simpleMeaning: a person who teaches one person at a time, as in singing or acting
scope: 'Also called coach: a person who teaches one person at a time. This is the person, not the verb
  for giving such teaching, and not a teacher of a whole class.'
examples:
- She hired a tutor to help her learn singing.
- His acting tutor gave him lessons alone at home.
