simpleMeaning: Every flat side is a many-sided shape matching the others, and every corner is the same
  as the rest; only five such shapes exist.
scope: It is also called ideal solid, regular convex polyhedron, and regular polyhedron, and it is one
  of only five such shapes.
examples:
- A cube is a regular convex solid with six square faces.
- They built a model of a regular convex solid.
