simpleMeaning: A mixed liquid sits in a bag of thin skin, and its watery part dries off through the skin,
  leaving the fine bits behind and the liquid stronger.
scope: A way of making a mixed liquid stronger, by letting its watery part dry off through thin skin while
  the fine bits stay behind.
examples:
- Pervaporation made the mixed liquid stronger by drying off its watery part.
- In pervaporation, the fine bits stay in the bag of thin skin.
