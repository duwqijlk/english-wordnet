simpleMeaning: A soft silvery metal of the group that reacts with water; it burns in air and reacts with
  force in water, and is found in carnallite, lepidolite and pollucite.
scope: Also called Rb and rubidium; a soft silvery metal that burns in air and reacts with force in water,
  distinct from metals that sit calm in air and water.
examples:
- Atomic number 37 burns in air and reacts with force in water.
- The sample of atomic number 37 came from pollucite.
