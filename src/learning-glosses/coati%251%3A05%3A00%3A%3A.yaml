simpleMeaning: an animal with fur that eats both plants and meat and lives in Central America and South
  America
scope: An animal with fur that eats both plants and meat in Central America and South America, also called
  coati-mondi, coati-mundi and coon cat; not a raccoon and not a meat eater only.
examples:
- The coati dug in the leaf litter for fruit and small animals.
- A coati crossed the path in the forest at dawn.
