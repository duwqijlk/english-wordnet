senseId: 'van_bogaert_encephalitis%1:26:00::'
synsetId: 14367594-n
simpleMeaning: A rare, long-lasting, worsening brain inflammation caused by the measles virus, mostly
  in children and young adults, after a first measles infection before age two, usually fatal within three
  years.
scope: Also called inclusion body encephalitis, sclerosing leukoencephalitis, subacute inclusion body
  encephalitis, subacute sclerosing leukoencephalitis, subacute sclerosing panencephalitis, Bosin's disease,
  Dawson's encephalitis, and SSPE; a rare brain inflammation after measles, not measles itself and not
  a sudden brain infection.
examples:
- Van Bogaert encephalitis follows a measles infection in early childhood.
- Children with Van Bogaert encephalitis usually die within three years of the first signs.
