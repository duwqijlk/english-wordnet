simpleMeaning: The thread that joins two pieces of fabric cannot be seen, or can barely be seen, when
  this device joins them together
scope: This device is also called a blind stitch machine and a blindstitch machine, and it joins two pieces
  of fabric with thread that stays out of sight, or nearly out of sight.
examples:
- The blindstitch sewing machine stitched the two pieces of fabric together so the thread was out of sight.
- She finished the seam with the blindstitch sewing machine, and the thread could barely be seen.
