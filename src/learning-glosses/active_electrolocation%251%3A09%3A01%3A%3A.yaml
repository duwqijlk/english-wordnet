simpleMeaning: an animal finds its way by making an electric field round itself and feeling where the
  field bends, using sense organs that pick up electric signals
scope: An animal's way of sensing by making an electric field, not sight and not hearing.
examples:
- The fish uses active electrolocation to find food in dark water.
- By active electrolocation, the animal can sense things it cannot see.
