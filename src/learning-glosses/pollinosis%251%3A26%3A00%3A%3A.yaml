simpleMeaning: a nose problem that comes and goes with the seasons, caused by the body reacting badly
  to plant grains in the air
scope: Also called hay fever, this is a nose problem that comes with the seasons from a bad reaction to
  plant grains in the air, not a nose problem that lasts all year.
examples:
- His pollinosis gets worse each spring when plant grains fill the air.
- Pollinosis makes her nose run and her eyes itch every autumn.
