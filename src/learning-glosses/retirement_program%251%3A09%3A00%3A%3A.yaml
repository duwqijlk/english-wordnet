simpleMeaning: A set way of putting money by while a person still works, to use once work has ended for
  good.
scope: This is a set way of putting money by while a person still works, not a monthly sum paid out after
  work ends; it is also called retirement account, retirement plan, retirement savings account, and retirement
  savings plan.
examples:
- The firm runs a retirement program for its staff.
- She joined the retirement program when she turned thirty.
