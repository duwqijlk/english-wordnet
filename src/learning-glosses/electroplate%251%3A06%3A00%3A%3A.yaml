simpleMeaning: Any made thing covered with a thin coat of metal by passing a current through a liquid.
scope: A made thing coated with metal by electricity, not a solid metal thing and not a painted thing.
examples:
- She polished the electroplate until the thin coat of silver shone.
- This electroplate cup was made by coating plain metal with silver.
