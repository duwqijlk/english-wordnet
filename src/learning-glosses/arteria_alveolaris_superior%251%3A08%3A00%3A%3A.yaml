simpleMeaning: a blood vessel in the tooth sockets that carries blood to the top teeth
scope: A blood vessel that feeds the top teeth, not a vessel that feeds the lower teeth and not a vein
  that takes blood away.
examples:
- The arteria alveolaris superior carries blood to the upper teeth.
- Damage to the arteria alveolaris superior can hurt the top teeth.
