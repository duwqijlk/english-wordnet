simpleMeaning: the bad feeling of shame you get when other people learn that you are not good enough or
  that you did something wrong
scope: This sense is the feeling of shame itself, not an event that causes that feeling and not a state
  of having money problems.
examples:
- She felt deep embarrassment when her mistake was read out in front of everyone.
- His embarrassment grew when the whole class learned about his lie.
