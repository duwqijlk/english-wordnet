simpleMeaning: money paid ahead of time to keep a person ready to work for you when needed
scope: Money paid in advance to keep someone's help ready; consideration is another name for this sense,
  not a device that holds teeth in place.
examples:
- The lawyer asked for a retainer before taking the case.
- We paid a retainer to keep the plumber on call.
