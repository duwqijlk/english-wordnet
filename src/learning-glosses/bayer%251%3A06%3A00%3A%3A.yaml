simpleMeaning: A modified form of salicylic acid, a pain and swelling drug usually taken as tablets; it
  also lowers fever and slows blood clotting by poisoning platelets.
scope: Also called aspirin, acetylsalicylic acid, Empirin and St. Joseph; a pain drug taken as tablets,
  not a drug for sleep and not a drug that kills germs.
examples:
- She took a Bayer for her headache.
- The doctor told him to take Bayer after the operation.
