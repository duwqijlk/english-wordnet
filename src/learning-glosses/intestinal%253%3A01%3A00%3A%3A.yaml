simpleMeaning: of, about, or inside the long tube in the body that food goes through after the stomach
scope: This is about the long food tube in the body, not about the stomach itself and not about the heart
  or blood.
examples:
- He went to the doctor for an intestinal problem.
- Food moves slowly through the intestinal wall.
