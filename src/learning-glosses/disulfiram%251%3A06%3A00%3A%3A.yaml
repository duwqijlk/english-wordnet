simpleMeaning: If a person taking it drinks alcohol, they feel sick and throw up; doctors use this drug,
  sold as Antabuse, to treat heavy drinking
scope: Doctors use this drug, sold as Antabuse, to treat heavy drinking, and a person who drinks alcohol
  while taking it feels sick and throws up.
examples:
- The doctor gave him disulfiram to help him stop drinking.
- On disulfiram, even one drink made her feel sick.
