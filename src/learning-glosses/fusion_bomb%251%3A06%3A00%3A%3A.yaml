simpleMeaning: Helium comes from light bits of hydrogen joining at great heat in this weapon, which sets
  free the power locked in atoms.
scope: Also called a hydrogen bomb or a thermonuclear bomb, this is a weapon in which light bits of hydrogen
  join at great heat to make helium, setting free the power locked in atoms.
examples:
- The fusion bomb sets free power when light bits of hydrogen join at great heat.
- A fusion bomb makes helium from hydrogen at great heat.
