simpleMeaning: Rude, coarse behaviour that shows a lack of good manners and good taste
scope: This is rude and coarse behaviour that lacks tact; crudeness and crudity are other names for this
  sense, not simple shyness and not a single rude remark.
examples:
- His gaucheness embarrassed everyone at the dinner.
- The town was famous for its gaucheness, and visitors noticed it at once.
