simpleMeaning: Its petals bend back from cup-shaped blooms, deep yellow to scarlet, on this plant of the
  southeastern United States.
scope: Also called a leopard lily or a tiger lily, this plant of the southeastern United States bears
  cup-shaped blooms, deep yellow to scarlet.
examples:
- The pine lily's cup-shaped blooms were deep yellow to scarlet.
- The pine lily showed cup-shaped blooms with petals that bent back.
