simpleMeaning: Split into five parts; of a flower, having each ring of parts made of five, or of a number
  that is five times a whole number.
scope: Split into five parts, of a flower with each ring made of five parts or five times a whole number,
  not split into four parts and not split into six parts.
examples:
- The pentamerous flowers had five petals in each ring.
- A pentamerous bloom shows five petals in each ring.
