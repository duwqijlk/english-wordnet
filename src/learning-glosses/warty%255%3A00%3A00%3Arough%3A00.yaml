simpleMeaning: of skin, covered with small hard raised lumps, or with raised parts that look like those
  lumps
scope: This describes skin with small hard raised lumps on it, not smooth skin and not skin that is only
  rough with no raised parts.
examples:
- The frog had rough, warty skin.
- His warty hands were covered with small hard lumps.
