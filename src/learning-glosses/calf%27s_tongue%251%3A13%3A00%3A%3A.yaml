simpleMeaning: the mouth part of a young cow that is eaten as meat
scope: It is meat from a young cow, not a live animal and not the meat of a grown cow.
examples:
- Calf's tongue was served cold with mustard.
- She bought a calf's tongue at the butcher's shop.
