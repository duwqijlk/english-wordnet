senseId: 'gee%1:23:00::'
synsetId: 13670214-n
simpleMeaning: a unit of force equal to the force of gravity (the pull of the earth); it shows the force
  on a body when the body changes speed or direction
scope: 'Also called g-force: a unit for measuring force when a body speeds up, not the word gee said to
  show surprise and not a call to a horse.'
examples:
- The pilot felt five gees as the plane turned fast.
- Astronauts may feel three gees when the rocket speeds up.
