simpleMeaning: to speak in a loud, excited voice, like someone making a big speech to a crowd
scope: To talk loudly and excitedly, also called a rant or a rave; not the noun sense of an opening for
  liquid, and not the gushing sense.
examples:
- He spouted about his new car for an hour.
- She spouted off in front of the whole class.
