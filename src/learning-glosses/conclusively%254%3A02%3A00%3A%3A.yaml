simpleMeaning: in a way that shows something is true and leaves no doubt
scope: In a way that settles a question for good, not in a way that only makes a thing look likely or
  partly true.
examples:
- The test conclusively showed that the water was safe to drink.
- They conclusively proved that he was not at the place that night.
