simpleMeaning: Lasting wood for timber, or split and woven into chair seats and containers, comes from
  a medium to large leaf-shedding oak of the east of the United States.
scope: Also called cow oak, this is a medium to large oak of the east of the United States that loses
  its leaves yearly, not a small oak that keeps its leaves.
examples:
- The basket oak loses its leaves yearly.
- Basket oak wood is split and woven into baskets.
