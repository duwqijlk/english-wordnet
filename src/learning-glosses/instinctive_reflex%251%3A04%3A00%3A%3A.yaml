senseId: 'instinctive_reflex%1:04:00::'
synsetId: 00865191-n
simpleMeaning: The body acts on its own, with no thought and no learning, when something sets it off
scope: An act the body does on its own with no thought, also called inborn reflex, innate reflex, physiological
  reaction or reflex; not an act you choose to do and not one you learn by practice.
examples:
- Blinking when dust flies at your eyes is an instinctive reflex.
- The baby's instinctive reflex made her grasp the finger placed in her hand.
