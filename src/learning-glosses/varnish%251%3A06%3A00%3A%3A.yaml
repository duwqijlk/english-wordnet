senseId: 'varnish%1:06:00::'
synsetId: 04529282-n
simpleMeaning: a clear liquid put on a surface that dries hard and shiny and lets the surface show through
scope: This is the clear coating itself, not the act of putting it on a surface, and not paint that hides
  a surface with color.
examples:
- A coat of varnish protected the wooden table.
- The varnish gave the door a hard, shiny finish.
