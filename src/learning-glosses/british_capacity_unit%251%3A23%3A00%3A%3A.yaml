simpleMeaning: A measure of how much a holder can hold, fixed by law in the old empire system of weights
  and measures, used for both dry goods and liquids.
scope: Also called the Imperial capacity unit, this measure of how much a holder can hold was fixed by
  law in the old empire system of weights and measures and is used for both dry goods and liquids, unlike
  a unit of weight and a unit of length, which measure other things.
examples:
- The British capacity unit was listed on the old chart.
- Cooks once used a British capacity unit for flour.
