senseId: 'counterrevolutionary%3:00:00::'
synsetId: 02022617-a
simpleMeaning: Showing opposition to revolution, with strong dislike of it.
scope: Said of views or feelings that oppose revolution, not the person who tries to undo a revolution's
  changes and not the sense of relating to a counterrevolution.
examples:
- His views were counterrevolutionary to the core.
- The movement was counterrevolutionary in its aims.
