simpleMeaning: A person who takes part in a loud party with others
scope: A person taking part in a loud party, also called reveller and merrymaker, not a person who only
  watches others have fun.
examples:
- The reveler joined the loud party in the hall.
- One reveler beat a drum as the crowd moved down the street.
