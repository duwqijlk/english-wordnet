schema: oewn-learning-gloss-v2
senseId: 'nonchalance%1:07:00::'
synsetId: 04680827-n
simpleMeaning: A calm way of acting that shows little worry or care about things
scope: Also called indifference and unconcern. It is staying calm and seeming not to care, not a lack
  of all feeling.
examples:
- She answered the hard questions with nonchalance, as if they did not worry her at all.
- His nonchalance surprised us, because he stayed calm when the plan went wrong.
