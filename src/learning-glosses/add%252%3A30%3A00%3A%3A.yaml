simpleMeaning: to put something together with something else, or to make something bigger or better by
  joining more to it.
scope: It is not the arithmetic sense of finding a total; it means putting something extra into or onto
  something else.
examples:
- Add a little salt to the soup.
- They added a new room to the back of the house.
