simpleMeaning: a sudden and violent shift in the ground that changes the shape of the land
scope: A sudden violent change in the land itself, not a disaster that ruins people's lives.
examples:
- The volcano's eruption was a catastrophe that reshaped the whole valley.
- A catastrophe under the sea can lift the ocean floor in seconds.
