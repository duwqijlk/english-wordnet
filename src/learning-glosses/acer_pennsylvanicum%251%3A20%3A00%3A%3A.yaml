simpleMeaning: A maple of eastern North America, with striped bark and big leaves in two lobes that turn
  clear yellow in autumn.
scope: A maple of eastern North America with striped bark, also called goosefoot maple, moose-wood, moosewood,
  striped dogwood and striped maple; its big two-lobed leaves that turn clear yellow in autumn set it
  apart from other maples.
examples:
- Acer pennsylvanicum has striped bark and big leaves.
- In autumn the Acer pennsylvanicum turns clear yellow.
