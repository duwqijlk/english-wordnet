simpleMeaning: either side of the backbone, between the hip bone and the ribs, in a person or in an animal
  with four legs
scope: 'Also called lumbus: a part of the body on either side of the back, not a cut of meat from that
  part of an animal.'
examples:
- He felt a sharp pain in his loin when he bent down.
- The cloth was tied around the man's loins.
