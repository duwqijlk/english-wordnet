simpleMeaning: The fruit of its vine, this green melon stays good for a long time, with flesh from pale
  green to orange.
scope: It belongs with the green melons whose flesh runs from pale green to orange, not the muskmelon
  kind with a smooth white rind.
examples:
- The winter melon stayed good for a long time.
- She cut a winter melon and found pale green flesh inside.
