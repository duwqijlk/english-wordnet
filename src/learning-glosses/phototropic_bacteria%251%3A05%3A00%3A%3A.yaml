simpleMeaning: tiny living things, green and purple, that take their growing energy from sunlight and
  build themselves from carbon drawn from carbon dioxide or from carbon in living things
scope: Another name for phototrophic bacteria; green and purple living things that grow on sunlight, not
  germs that feed on chemicals.
examples:
- Phototropic bacteria turn sunlight into the energy they need to grow.
- In the lab we grew phototropic bacteria under a bright lamp.
