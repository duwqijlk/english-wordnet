simpleMeaning: the making of a picture in your mind of something that you do not take as real and that
  your senses do not show you as there now
scope: 'Also called vision: a picture made in the mind of something not real and not seen now, not a real
  sight with the eyes and not the power to think of new ideas.'
examples:
- In his imagination, the small room became a great palace.
- Her imagination made the dark forest full of strange animals.
