simpleMeaning: A kind of metal that gives off rays, past uranium in the list of basic kinds; found in
  tiny amounts in uranium rock; left over when plutonium is made.
scope: A kind of metal that gives off rays, also called neptunium and Np; set apart from uranium and plutonium
  themselves and from other metals that give off rays.
examples:
- Atomic number 93 is left over when plutonium is made.
- Only tiny amounts of atomic number 93 are found in uranium rock.
