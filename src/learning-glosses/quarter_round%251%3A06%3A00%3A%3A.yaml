simpleMeaning: A raised strip that, cut across, looks like a fourth of a circle or an oval
scope: 'Also called thumb and ovolo: a raised strip whose cut-across shape is a fourth of a circle or
  an oval, not a flat strip or a strip with a sharp edge.'
examples:
- The quarter round along the ceiling hid the join between the walls.
- He nailed a quarter round strip into the corner of the room.
