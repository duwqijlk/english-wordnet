simpleMeaning: in a stiff, unbending way, without smooth or easy movement
scope: It stresses stiff, unbending movement; the near sense of the same word in this batch is the wider
  one, about moving clumsily and not smoothly in general.
examples:
- The old man walked gracelessly, his legs stiff and unbending.
- He rose gracelessly from the chair, stiff and slow.
