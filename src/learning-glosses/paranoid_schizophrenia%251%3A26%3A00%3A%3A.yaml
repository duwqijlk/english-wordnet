simpleMeaning: A mental illness with false beliefs of persecution, greatness or jealousy; anger, anxiety,
  aloofness and gender doubts appear, yet they usually seem presentable and cope normally unless acting
  on them.
scope: The delusion-dominated form of this severe mental illness; paranoic type schizophrenia is the same
  form under another name, while paraphrenia is a separate condition.
examples:
- He was diagnosed with paranoid schizophrenia after describing a firm belief that his neighbours were
  plotting against him.
- People with paranoid schizophrenia often appear calm and capable at work even while holding intense
  false beliefs.
