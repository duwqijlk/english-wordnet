simpleMeaning: the body's way of breathing in and breathing out, taking in oxygen from the air breathed
  in and letting out carbon dioxide when breathing out
scope: 'Also called breathing, respiration and external respiration: the body taking air in and out, not
  the act of bringing fresh air into a room.'
examples:
- A machine measured her ventilation as she breathed in and out.
- Poor ventilation in his lungs made breathing hard after the illness.
