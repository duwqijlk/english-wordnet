simpleMeaning: The part of chemistry that studies the substances and changes in living things; it tries
  to understand living things by looking at them through chemistry
scope: This study looks only at the chemistry inside living things, not at all of the study of life and
  not at chemistry with no link to life.
examples:
- She studied biochemistry to learn how the body makes energy from food.
- In biochemistry, students learn what happens to sugars inside cells.
