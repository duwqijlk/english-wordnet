simpleMeaning: A small moth with thin wings, whose young feed on crops and harm them
scope: This is a small thin-winged moth whose young harm crops; gelechiid moth is another name for this
  sense, not a butterfly and not any other small moth.
examples:
- The gelechiid laid its eggs on the leaves.
- Farmers watch for gelechiid caterpillars on their crops.
