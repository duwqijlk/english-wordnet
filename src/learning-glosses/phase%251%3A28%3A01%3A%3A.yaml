simpleMeaning: A particular point in the time of a repeating cycle, measured from a chosen point taken
  as zero and shown as an angle
scope: This is a point in a repeating cycle shown as an angle, not a state of matter and not the lit shape
  of the moon.
examples:
- The engineer measured the phase of the wave as an angle from zero.
- Two waves with the same phase reach their top point at the same time.
