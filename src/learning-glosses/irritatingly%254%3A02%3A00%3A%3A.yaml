simpleMeaning: in a way that makes other people feel annoyed and not calm
scope: This means in a way that annoys people, not in a way that makes people feel calm or pleased.
examples:
- The clock ticked irritatingly all night long.
- He kept tapping his pen irritatingly during the test.
