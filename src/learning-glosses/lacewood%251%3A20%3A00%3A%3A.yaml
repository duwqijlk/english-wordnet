scope: Hard, tough, springy wood of a sycamore tree, in changing colours and sometimes with mixed streaks;
  sycamore is another name for this sense, not the living tree itself and not plain pale wood.
examples:
- The table was made of lacewood with a fine pattern.
- Lacewood bends without breaking.
