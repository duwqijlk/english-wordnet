simpleMeaning: An inner ring of smooth muscle made from round fibres of the lower gut.
scope: An inner ring of smooth muscle in the lower gut; not the outer ring of striped muscle, and not
  a muscle you move at will.
examples:
- The musculus sphincter ani internus works without thought.
- The musculus sphincter ani internus keeps the lower gut closed.
