schema: oewn-learning-gloss-v2
senseId: 'exempt%2:41:00::'
synsetId: 02570061-v
simpleMeaning: to let a person not have to follow a rule or do something they must do
scope: This means letting a person not follow a rule, also called free and also called relieve; it is
  not the state of being free from a duty.
examples:
- The teacher exempted him from the test because he was ill.
- She exempted me from the exam after I finished the extra work.
