simpleMeaning: a fur-bearing animal of Europe and Asia with a brown coat and a pale breast and throat
scope: This is a fur-bearing animal of Europe and Asia, also called beech marten; not a weasel and not
  a sable.
examples:
- A stone marten slipped through the gap in the wall.
- The stone marten's pale throat showed against its brown coat.
