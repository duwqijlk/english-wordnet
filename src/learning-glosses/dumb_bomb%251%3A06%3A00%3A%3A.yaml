simpleMeaning: a weapon that drops straight down under its own weight, with nothing to steer it to its
  mark
scope: 'Also called gravity bomb: a weapon that falls without being steered, not a guided missile and
  not a bomb set off on the ground.'
examples:
- The plane dropped a dumb bomb over the target area.
- The dumb bomb fell wide of its mark because nothing steered it.
