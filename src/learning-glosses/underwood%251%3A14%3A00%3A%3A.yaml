simpleMeaning: The low growth of small trees, bushes, ferns and the like, growing under taller trees in
  a wood or forest.
scope: 'Also called undergrowth and underbrush: the low plants growing under taller trees in a wood, not
  the tall trees themselves and not open grassland.'
examples:
- We pushed through the thick underwood to reach the clearing.
- The underwood under the tall oaks was full of ferns.
