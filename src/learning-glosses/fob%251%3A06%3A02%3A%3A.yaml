simpleMeaning: A pocket in a waistcoat made to hold a pocket watch.
scope: A pocket in a waistcoat for holding a pocket watch, not the watch chain and not the ornament hung
  from it.
examples:
- He slipped his watch into the fob of his waistcoat.
- The fob in his jacket held his grandfather's watch.
