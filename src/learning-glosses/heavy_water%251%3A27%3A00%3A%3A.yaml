simpleMeaning: A liquid like ordinary drinking liquid but with a large share of deuterium atoms, a form
  of hydrogen with extra weight, used in atomic reactors
scope: This is a liquid like ordinary drinking liquid but with a large share of deuterium atoms, also
  called deuterium oxide, and not ordinary drinking liquid or water used in homes.
examples:
- Heavy water is used in some nuclear reactors.
- The plant stores heavy water for its reactors.
