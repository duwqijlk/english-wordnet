simpleMeaning: One of a group of Hindu priests who hold to a faith that honours all gods, as taught by
  the Vedanta school
scope: One of a group of Hindu priests who hold to a faith that honours all gods, as taught by the Vedanta
  school; not a priest of one god only and not a monk.
examples:
- The smarta priest prayed to many gods in the same temple.
- A smarta follows the Vedanta teaching that all gods are one.
