simpleMeaning: teaching that is given through a series of lessons or meetings
scope: This is not the group of students itself, nor a social rank; it is the teaching given over a series
  of lessons.
examples:
- She missed two weeks of class while she was in hospital.
- The teacher packs a lot of discussion into every class.
