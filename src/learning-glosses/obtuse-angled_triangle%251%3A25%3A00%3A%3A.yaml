simpleMeaning: A shape with three sides, one of whose inside corners is wider than a right angle
scope: A shape with three sides and one inside corner wider than a right angle, also called an obtuse
  triangle; not a leaf with a blunt tip and not a shape with three equal sides.
examples:
- The obtuse-angled triangle in the drawing has one corner wider than a right angle.
- She drew an obtuse-angled triangle with a wide corner at the top.
