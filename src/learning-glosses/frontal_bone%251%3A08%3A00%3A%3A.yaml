simpleMeaning: The large hard part of the skull that forms the front of the head and the upper part of
  the eye sockets
scope: The large hard part at the front of the skull; forehead and os frontale are other names for this
  sense, not the jaw and not the cheek.
examples:
- The frontal bone forms the forehead.
- A blow to the frontal bone can break the eye socket.
