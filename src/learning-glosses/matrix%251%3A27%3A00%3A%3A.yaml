simpleMeaning: In geology, a mass of rock made of very small grains, with fossils, crystals, or gems set
  inside it
scope: In geology, this is the rock that holds fossils, crystals, or gems, not a set of numbers set out
  in rows and lines in maths and not the substance in which body cells are set.
examples:
- The fossil was still set in a hard matrix of fine rock.
- They found a clear crystal in its dark matrix.
