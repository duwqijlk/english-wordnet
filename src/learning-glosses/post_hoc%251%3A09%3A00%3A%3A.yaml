simpleMeaning: Because one thing came after another, a person wrongly holds that the first thing made
  the second happen.
scope: This is the mistake of taking what came first to have made what came after happen, also called
  post hoc ergo propter hoc, not a cause shown by sound proof.
examples:
- His post hoc claim was that the rain came because he had washed the car.
- 'She saw the post hoc error: the bell rang after lunch, but lunch did not ring the bell.'
