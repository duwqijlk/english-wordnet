simpleMeaning: full of great wrongdoing, and seen as bad because people believe it is a sin
scope: Also called sinful and iniquitous, this describes acts thought to be very bad and against God,
  not merely rude or unpleasant acts.
examples:
- They called stealing from the poor an ungodly act.
- In the story, the ungodly king harmed many innocent people.
