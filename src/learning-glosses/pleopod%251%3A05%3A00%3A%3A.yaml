simpleMeaning: One of the paired belly limbs of some water shellfish, working first of all to carry the
  eggs in females, and usually shaped for swimming.
scope: This sense is also called swimmeret, for one of the paired belly limbs of some water shellfish,
  working first of all to carry the eggs in females, and usually shaped for swimming.
examples:
- Pleopods carry eggs in females.
- Pleopods help crustaceans swim.
