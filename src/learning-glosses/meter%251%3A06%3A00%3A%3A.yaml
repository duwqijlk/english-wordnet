simpleMeaning: One of many kinds of tool made for measuring how much of something there is
scope: This is a tool for measuring an amount, not the unit of length, not the strong beat in a line of
  poetry, and not the act of stamping mail.
examples:
- The electricity meter shows how much power we have used.
- He read the water meter outside the house.
