simpleMeaning: keeping yourself and your home free from dirt, as a habit
scope: This describes a person who keeps free from dirt as a habit, not doing a job smoothly with no trouble
  and not doing something in a way that makes little dirt.
examples:
- She is cleanly in her habits and washes her hands often.
- They are cleanly people who keep every room free from dirt.
