simpleMeaning: Words heard or read can hardly be followed by a person in this state, who talks smoothly
  while the words mean nothing.
scope: Fluent aphasia, impressive aphasia, and receptive aphasia are other names for this state, in which
  a person talks smoothly but the words mean nothing.
examples:
- A person with sensory aphasia talked smoothly but said nothing clear.
- Words heard or read made little sense to a person with sensory aphasia.
