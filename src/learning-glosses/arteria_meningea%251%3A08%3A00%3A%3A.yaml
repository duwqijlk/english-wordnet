simpleMeaning: Any of three arteries that bring blood to the covers of the brain and the parts near them.
scope: 'Also called meningeal artery: any of three arteries that bring blood to the covers of the brain
  and the parts near them, not the main artery of the brain and not a vein.'
examples:
- The arteria meningea feeds the covers of the brain.
- A tear in the arteria meningea can bleed inside the head.
