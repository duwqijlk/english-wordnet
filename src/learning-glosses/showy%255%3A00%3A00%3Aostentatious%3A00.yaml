simpleMeaning: made to get attention and impress people, but often doing so in a way that has no good
  taste
scope: 'Also called flamboyant and splashy: this sense is about showing off to get attention, often without
  good taste, not the sense about bright, noticeable clothes and not the sense about looking rich and
  stylish.'
examples:
- She wore a cheap, showy bracelet that tried to look rich but had no taste.
- He bought a showy car just to impress people, though it looked tasteless.
