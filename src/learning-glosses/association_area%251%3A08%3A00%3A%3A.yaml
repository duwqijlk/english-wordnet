simpleMeaning: parts of the outer layer of the brain that do not move the body or take in the senses,
  but are thought to help us think and learn
scope: 'Also called association cortex: parts of the outer brain layer for thinking, not the parts that
  move the body and not the parts that take in the senses.'
examples:
- Damage to an association area can make it hard to plan what to do next.
- The association area helps the brain join what the eyes see with what we know.
