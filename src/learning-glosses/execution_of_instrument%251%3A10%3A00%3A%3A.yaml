simpleMeaning: In law, a legal paper, such as a contract or deed, counts as finished once signed, and
  perhaps sealed and passed on, so it has force in law.
scope: The signing that makes a legal paper binding, not the carrying out of a sentence; also called execution.
examples:
- The execution of instrument took place when both parties signed the deed.
- The execution of instrument was complete once the deed had been signed and sealed.
