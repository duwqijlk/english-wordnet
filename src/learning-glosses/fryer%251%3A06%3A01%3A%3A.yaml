simpleMeaning: a machine used in a kitchen to cook food in deep hot oil, and its size depends on what
  it will be used for
scope: This is a kitchen machine for cooking food in hot oil, not the meat of a young chicken that is
  ready for cooking.
examples:
- She put the chips in the fryer and waited until they were crisp.
- The small fryer sits on the kitchen top, next to the cooker.
