senseId: 'curry_favor%2:32:00::'
synsetId: 00882850-v
simpleMeaning: to say sweet, overdone praise to a person in the hope that the person will like you and
  help you
scope: 'Also called court favor, court favour and curry favour: it is trying to win a person''s good will
  with overdone praise, not honest praise and not asking for help in a plain way.'
examples:
- He kept currying favor with the boss by praising every idea she had.
- She tried to curry favor with the teacher by saying sweet things about the lessons.
