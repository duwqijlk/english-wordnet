simpleMeaning: not smooth or pleasing in the way words are put together
scope: 'Also called awkward, clumsy, and inept: this is about words that are not smooth or pleasing, not
  about a thing that is big, heavy, or hard to move.'
examples:
- His cumbersome writing style made the story hard to follow.
- She gave a cumbersome apology with long, hard sentences.
