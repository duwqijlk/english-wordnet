simpleMeaning: A person who stands in front of a show, as at a fair, and gives a loud, lively sales talk
  to people who might buy.
scope: For a showman at a fair or carnival calling out to draw a crowd.
examples:
- The barker called out to the crowd to come and see the show.
- A barker stood by the tent, shouting about the wonders inside.
