simpleMeaning: to hit your hands together or shout after a show to show you liked it
scope: Also called spat, and another name for it is applaud. This means hitting your hands together to
  show you liked a show, not hitting a person in a friendly way and not a disease.
examples:
- The crowd clapped and cheered after the play ended.
- Everyone clapped loudly when the singer finished her song.
