simpleMeaning: deep and rough in sound, as if from shouting, being ill, or strong feeling
scope: 'Also called hoarse and husky: deep and rough in sound; not a rude, unfriendly way of speaking
  to people.'
examples:
- The old man answered in a gruff voice after shouting all day.
- Her gruff voice told us she had a bad cold.
