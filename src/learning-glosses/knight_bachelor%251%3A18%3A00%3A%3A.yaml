simpleMeaning: Only a small flag could be shown by this man, who holds the lowest rank in this order of
  honour
scope: 'Also called a bachelor and a bachelor-at-arms: a man of the lowest rank in this order of honour,
  not a higher-ranking knight.'
examples:
- The young knight bachelor rode in the parade with only a small flag.
- As a knight bachelor, he could show no more than a pennon.
