simpleMeaning: a body chemical made from tyrosine, a building block of proteins, that acts like the nerves
  that speed the body up, found in chocolate, cola drinks, ripe cheese, and beer
scope: A body chemical, not a drug added to food or a flavouring; it acts like the nerves that speed the
  body up.
examples:
- Patients taking MAOIs should avoid foods containing tyramine.
- The doctor warned her that tyramine in ripe cheese could raise her blood pressure.
