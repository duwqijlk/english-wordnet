simpleMeaning: a sudden passing out caused by too little blood reaching the brain
scope: The noun for passing out, not the verb meaning to lose consciousness or the adjective senses for
  unclear, weak or unbrave; swoon, deliquium and syncope are other names for it.
examples:
- She had a faint after standing too long in the sun.
- He came round quickly after his faint.
