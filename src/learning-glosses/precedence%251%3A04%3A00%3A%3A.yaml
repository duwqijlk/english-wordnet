simpleMeaning: the act of coming or going before others in time, order, or rank, as in a ceremony
scope: Coming before in time, order or rank, as in a ceremony; wider than the other sense of this word,
  which is only about coming before in time.
examples:
- In the ceremony, the mayor took precedence over the other guests.
- Questions of precedence decided who entered the hall first.
