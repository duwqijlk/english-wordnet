simpleMeaning: dreaming in your mind while you are awake, without noticing what is around you
scope: Also called daydream, reverie and daydreaming. These are thoughts in the mind while awake, not
  a dream in sleep and not a plan for the future.
examples:
- She sat in a revery and did not hear her name called.
- His revery ended when the bell rang for class.
