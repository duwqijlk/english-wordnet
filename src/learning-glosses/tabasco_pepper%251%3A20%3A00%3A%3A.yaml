simpleMeaning: The hot sauce of the Gulf Coast states comes mostly from this plant, which bears very hot
  middle-sized long red fruits.
scope: Hot pepper and tabasco plant are other names for this plant with very hot red fruits, grown to
  make hot sauce.
examples:
- The tabasco pepper bore very hot red fruits.
- They grew tabasco pepper in the Gulf Coast states to make hot sauce.
