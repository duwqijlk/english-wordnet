simpleMeaning: In the drive of a machine, the device that either joins the side giving power to the side
  that receives it or separates the two.
scope: The link between the parts that supply power and those that receive it, not the pedal or lever
  the driver works or the small strapless handbag.
examples:
- The clutch began to slip, so the engine raced without turning the wheels.
- A worn clutch could no longer connect the motor to the pump.
