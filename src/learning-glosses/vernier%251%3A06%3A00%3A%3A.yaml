simpleMeaning: A small sliding scale that moves along a main scale and shows small parts of its divisions.
scope: A small sliding scale that shows small parts of a main scale; vernier scale is another name for
  this sense; not a ruler and not a fixed scale.
examples:
- He used a vernier to measure the width to a small part of a millimetre.
- The vernier slides along the main scale.
