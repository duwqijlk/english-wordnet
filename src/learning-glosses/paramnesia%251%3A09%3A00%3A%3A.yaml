simpleMeaning: In psychiatry, a fault of memory in which dreams or fancies are mixed up with what is real.
scope: A fault of memory that mixes dreams with what is real, not a loss of memory and not a feeling of
  having seen a thing before.
examples:
- His paramnesia made him sure the dream had really happened.
- Paramnesia blurred the line between her fancies and her past.
