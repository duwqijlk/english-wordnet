simpleMeaning: Picture-taking that makes flat pictures look deep and solid, by looking at two slightly
  different pictures of one thing at once through a special viewer
scope: Picture-taking that makes flat pictures look deep and solid, also called stereo photography and
  stereophotography; not an ordinary flat photograph and not a moving picture.
examples:
- Stereoscopic photography needs two pictures seen at once.
- The book shows how stereoscopic photography gives depth to pictures.
