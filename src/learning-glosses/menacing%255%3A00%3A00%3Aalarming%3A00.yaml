senseId: menacing%5:00:00:alarming:00
synsetId: 00195958-s
simpleMeaning: showing that something bad or sad is still to come, and making people feel afraid
scope: Also called threatening, ominous and sinister. This describes a look, a sound, a sky or a way of
  acting that seems to warn of bad or sad things still to come.
examples:
- Dark, menacing clouds told us a storm was on its way.
- He gave her a menacing look and took a step closer.
