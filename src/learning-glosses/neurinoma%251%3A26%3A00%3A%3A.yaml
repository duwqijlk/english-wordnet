simpleMeaning: A growth, most often harmless, on the cover around a nerve.
scope: A growth, most often harmless, on the cover around a nerve, not a growth on the tough cover of
  a nerve outside the brain and spine.
examples:
- The neurinoma on the nerve grew slowly and caused no pain.
- Doctors found a small neurinoma on the nerve near her ear.
