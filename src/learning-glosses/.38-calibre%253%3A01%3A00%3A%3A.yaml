senseId: '.38-calibre%3:01:00::'
synsetId: 03158270-a
simpleMeaning: this word describes a gun, or the shot it fires, whose inner hole is a little more than
  three eighths of an inch wide
scope: It is also called .38-caliber, .38 caliber, and .38 calibre, and it describes a gun or its shot
  with a bore a little more than three eighths of an inch wide, not of one with a narrower bore.
examples:
- She loaded a .38-calibre shell.
- He held a .38-calibre pistol.
