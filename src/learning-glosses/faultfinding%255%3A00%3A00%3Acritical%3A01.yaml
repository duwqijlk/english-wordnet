simpleMeaning: Quick to spot faults, and to point them out.
scope: Quick to spot faults, and to point them out; not quick to judge right and wrong, or to judge by
  one's own views, nor small and unfair fault-finding that goes on and on.
examples:
- Their tutor was faultfinding and hard.
- The critic was faultfinding all term.
