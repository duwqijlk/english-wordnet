simpleMeaning: A thin cord of nerve gets a fatty coat that builds up round it over time
scope: 'Also called myelinization: the slow growth of a fatty coat round a thin cord of nerve, not the
  loss of that coat and not the growth of the nerve itself.'
examples:
- Myelinisation takes place as the young child's nerves grow.
- The scan showed myelinisation around the nerve.
