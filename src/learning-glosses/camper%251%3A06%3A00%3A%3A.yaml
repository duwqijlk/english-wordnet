simpleMeaning: a vehicle with things inside for sleeping and living, made for trips taken for fun
scope: This is a vehicle made for travel and sleeping on a trip, not a person who stays for a short time
  in a tent or lodge for fun.
examples:
- They drove across the country in a camper and slept in it each night.
- We hired a camper with a small kitchen and two beds for our road trip.
