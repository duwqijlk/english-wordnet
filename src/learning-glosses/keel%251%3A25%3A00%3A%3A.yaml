simpleMeaning: a raised strip or edge on a thing that looks like the long beam along the bottom of a boat
scope: A raised strip shaped like the bottom beam of a boat; not that beam itself, not the ridge on a
  flying bird's breastbone, and not walking without control.
examples:
- The keel along the shell's underside caught the light.
- A small keel ran down the middle of the leaf.
