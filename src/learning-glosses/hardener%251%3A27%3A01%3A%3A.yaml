simpleMeaning: A thing that makes another thing firm, above all a substance added to varnish or paint
  to give a firmer surface or finish
scope: A thing that makes another thing firm, above all a substance added to varnish or paint, not a softener
  and not the varnish itself.
examples:
- Add the hardener to make the varnish set firm.
- This hardener gives the paint a tougher finish.
