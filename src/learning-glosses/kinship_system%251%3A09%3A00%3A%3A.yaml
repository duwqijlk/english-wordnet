simpleMeaning: The words for kin and the duties kin owe each other make up one way of life's own set of
  family ties, in the study of peoples.
scope: In the study of peoples, this set of family ties, with its words for kin and the duties kin owe
  each other, belongs to one way of life and not to another.
examples:
- The kinship system of the village gave cousins clear duties to each other.
- Under their kinship system, cousins owed each other help.
