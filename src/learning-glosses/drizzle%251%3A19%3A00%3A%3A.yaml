simpleMeaning: Very light rain, heavier than mist but not as heavy as a shower.
scope: This is the noun for very light rain, between mist and a shower, not the verb for letting small
  drops fall.
examples:
- A light drizzle fell all morning.
- We walked home in the drizzle without umbrellas.
