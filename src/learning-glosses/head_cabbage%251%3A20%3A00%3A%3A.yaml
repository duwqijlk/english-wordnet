simpleMeaning: Any of several grown kinds of the leafy green vegetable with a short thick stem and a big
  tight ball of leaves that can be eaten, usually green
scope: Any of several grown kinds of leafy green vegetable with a short thick stem and a big tight ball
  of leaves that can be eaten, also called head cabbage plant, and not a loose-leaf kind with no firm
  ball.
examples:
- We grew head cabbage in the garden this year.
- The head cabbage had a big tight ball of green leaves.
