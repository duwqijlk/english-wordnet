simpleMeaning: Breath is taken into a tiny pouch in the lungs, where the smallest breathing tubes widen
  at their ends
scope: Also called an alveolus or an air cell, this is a tiny pouch in the lungs, not the thin-walled
  tubes of insects.
examples:
- The air sac at the end of the tube fills with breath each time we breathe in.
- Air sacs in the lungs filled with breath as she breathed in.
