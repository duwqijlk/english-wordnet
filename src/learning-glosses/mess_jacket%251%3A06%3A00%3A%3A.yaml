  to a point at the back.
scope: It is also called a monkey jacket and a shell jacket, and officers wear it for formal dinners in
  their dining room.
examples:
- The mess jacket was worn to the formal dinner in the officers' dining room.
- The mess jacket narrowed to a point at the back.
