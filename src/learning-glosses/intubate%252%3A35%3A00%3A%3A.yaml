senseId: 'intubate%2:35:00::'
synsetId: 01424826-v
simpleMeaning: to put a cannula (a thin tube) or another tube into a part of the body
scope: Putting a thin tube into a part of the body; not taking a tube out, and not putting in a solid
  tool with no tube.
examples:
- The nurse intubated the blood vessel in the man's neck with a thin tube.
- They intubated the vein so that medicine could go straight into it.
