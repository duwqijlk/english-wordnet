simpleMeaning: On the salt marshes and sea beaches of the Old World grows a bushy plant with sharp leaves,
  which people burn to make rough soda ash.
scope: Also called barilla, glasswort, kali, and saltwort, this bushy marsh plant is burned to make soda
  ash, not the fleshy glasswort that grows by the sea.
examples:
- Kelpwort grows on the salt marshes.
- They burned kelpwort for soda ash.
