simpleMeaning: A low, spreading or half-upright shrub from tropical America and Australia, thickly covered
  with backward-curving thorns; its soft grey-green leaflets fold and droop at night or when touched or
  cooled.
scope: This is the thorny, touch-sensitive shrub also called humble plant, not a medicine or a cut flower.
examples:
- The action plant folds its leaflets the moment a finger touches them.
- Its curved thorns make the action plant awkward to weed, but visitors love watching its leaves droop.
