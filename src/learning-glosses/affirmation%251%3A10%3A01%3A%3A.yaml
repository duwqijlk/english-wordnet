schema: oewn-learning-gloss-v2
senseId: 'affirmation%1:10:01::'
synsetId: 06697543-n
simpleMeaning: In religion, a serious statement made in place of an oath, for a person who will not swear
  an oath for reasons of faith or conscience
scope: This is a serious statement used instead of an oath, not simply the act of saying that something
  is true.
examples:
- He made an affirmation instead of swearing an oath in court.
- She made an affirmation because her faith would not let her swear an oath.
