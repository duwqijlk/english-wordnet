senseId: 'provoke%2:37:00::'
synsetId: 01763170-v
simpleMeaning: to cause a feeling, an emotion, or a reaction to appear in someone
scope: 'Also called fire, raise, arouse, kindle and evoke: to bring out a feeling or reaction in someone,
  not to cause an event to happen and not to annoy someone again and again.'
examples:
- The sad story provoked pity in many readers.
- Her kind words provoked a smile from the child.
