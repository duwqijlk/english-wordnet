simpleMeaning: in a way that gives great pleasure
scope: This tells how a thing is or how something is done, in a way that gives pleasure; it is not the
  feeling of pleasure itself.
examples:
- The small garden is delightfully bright on a sunny morning.
- The old house looks delightfully warm and welcoming in the evening light.
