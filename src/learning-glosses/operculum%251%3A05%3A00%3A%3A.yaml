simpleMeaning: A hard flap sits over the slits behind the gills of a fish, and over the opening of the
  shell of certain shelled animals when they pull back inside.
scope: A hard flap that covers gill slits or the mouth of a shell, not the gill itself and not the shell.
examples:
- The operculum covers the gill slits of the fish.
- When the snail pulls back, the operculum shuts the mouth of its shell.
