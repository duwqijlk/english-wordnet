scope: In baseball, the small raised patch of ground where the thrower stands; hill and mound are other
  names for this sense, not home plate and not the batter's box.
examples:
- The pitcher toed the pitcher's mound and looked in for the sign.
- Rain had turned the pitcher's mound to mud.
