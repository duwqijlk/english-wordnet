simpleMeaning: A way of life that shows what a person values and how they think.
scope: 'Also called a lifestyle: what a person holds dear and how they think show in the way they live,
  not a short-term deal between two sides in a row.'
examples:
- 'Her modus vivendi is simple: good food, good books, and time with friends.'
- His modus vivendi shows how much he cares about honest work.
