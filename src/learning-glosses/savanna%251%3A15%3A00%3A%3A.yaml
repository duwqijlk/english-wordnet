simpleMeaning: a flat area of grassland in tropical or subtropical lands, the hot areas in and near the
  middle of the earth
scope: 'Also called savannah: this is flat grassland in hot lands, not a forest, not a desert, and not
  grassland in cold or mild places.'
examples:
- Lions live on the wide savanna, where grass grows tall in the hot sun.
- We crossed the flat savanna and saw very few trees.
