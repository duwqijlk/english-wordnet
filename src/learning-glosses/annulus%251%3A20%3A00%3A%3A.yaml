simpleMeaning: In fungi, the ring left round a grown mushroom's stem from the thin veil that covered it
  when young, sitting like a collar
scope: 'Also called skirt: in fungi, the ring left round a grown mushroom''s stem by its young veil, not
  the cap and not the stem itself.'
examples:
- The annulus sat round the stem like a little collar.
- You can see the annulus on the mature mushroom, left from its veil.
