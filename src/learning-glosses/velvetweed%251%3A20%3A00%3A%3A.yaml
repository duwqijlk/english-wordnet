simpleMeaning: Strong fibre comes from this tall annual plant of tropical Asia, which bears yellow flowers
  and velvety leaves and now grows wild in south-eastern Europe and the United States.
scope: Another name for velvetleaf, this same tropical Asian fibre plant; not the unrelated south-western
  US shrub with furry lobed leaves and red-purple flowers.
examples:
- Velvetweed spreads quickly through disturbed ground.
- The stems of velvetweed yield a strong fibre.
