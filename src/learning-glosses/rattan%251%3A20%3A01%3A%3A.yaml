simpleMeaning: a palm tree that climbs, from Sri Lanka and south India, known for its very long stems,
  which are used to make Malacca canes (long sticks for walking)
scope: Also called rattan palm. This is the living climbing plant itself, not its cut stems used for chairs
  and baskets, and not a stick made from those stems.
examples:
- The rattan climbs high through the trees in Sri Lanka.
- The rattan in south India can grow stems of great length.
