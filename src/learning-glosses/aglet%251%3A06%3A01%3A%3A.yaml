simpleMeaning: a metal or plastic tip that covers the end of a shoelace or ribbon
scope: A tip on the end of a lace or ribbon, also called aiglet, not the lace itself and not a fancy cord
  worn on a uniform.
examples:
- The aglet on my shoelace came loose and the lace started to fray.
- She slipped a new aglet over the end of the ribbon.
