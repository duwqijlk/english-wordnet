simpleMeaning: a building gets its frame, heat kept in, and defence against fire and mould all at once
  from ready-made blocks of light concrete first made in the mid-1920s
scope: Also called autoclaved aerated concrete, autoclaved cellular concrete, autoclaved lightweight concrete,
  and porous concrete; light ready-made blocks for building, not bricks and not steel beams.
examples:
- Autoclaved concrete was first made in the mid-1920s.
- They chose autoclaved concrete because it holds the building up and keeps heat in.
