simpleMeaning: the low-fat meat of a very large flat fish from the Atlantic or Pacific sea
scope: The meat eaten as food, not the living fish itself in the sea.
examples:
- We had halibut for dinner, and its white meat was light and tasty.
- She bought fresh halibut at the market to cook that night.
