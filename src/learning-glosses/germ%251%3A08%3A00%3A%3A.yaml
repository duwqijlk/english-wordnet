simpleMeaning: a tiny, plain-looking living thing, such as a fertilized egg, from which a whole living
  thing can grow
scope: A tiny living thing from which a whole living thing can grow, not a disease-causing microbe and
  not the start of an idea.
examples:
- The germ grew into a complete organism in the dish.
- Each germ in the sample developed into a new plant.
