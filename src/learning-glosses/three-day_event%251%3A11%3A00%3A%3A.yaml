synsetId: 07476007-n
simpleMeaning: 'A horse contest in parts: first, set moves done in a fixed order; next, jumps across open
  land; last, jumps in a ring.'
scope: A horse contest with all three parts in order — first dressage, then cross-country jumping, then
  stadium jumping — not just one of those parts on its own.
examples:
- She rode in a three-day event for the first time this spring.
- The three-day event ends with stadium jumping in front of a big crowd.
