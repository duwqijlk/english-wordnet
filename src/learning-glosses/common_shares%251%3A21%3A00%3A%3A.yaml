simpleMeaning: Unlike the favoured kind, these parts of a firm give their owners part of the firm's gains
  and a vote when owners choose.
scope: Also called common stock and ordinary shares, this is the kind of holding that is not the favoured
  kind, giving its owners part of the firm's gains and a vote.
examples:
- Over 40 million Americans invest in common shares.
- She bought common shares in the firm.
