simpleMeaning: A court order that tells a boss to hold back all or part of a worker's pay and send it
  to the court or the winner of the case
scope: This is a court order that tells a boss to hold back all or part of a worker's pay and send it
  to the court or the winner of the case; not a fine paid at once and not a tax.
examples:
- The court sent a garnishment to her boss.
- Under the garnishment, part of his pay goes to the court.
