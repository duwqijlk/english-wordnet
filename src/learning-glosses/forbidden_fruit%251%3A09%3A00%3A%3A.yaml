synsetId: 05702967-n
simpleMeaning: At first, the apple from the tree of knowledge of good and evil in the Garden of Eden;
  now, anything that tempts a person but is risky, sex for one.
scope: The apple of Eden first, and now anything tempting but risky; not an ordinary apple and not a thing
  that is merely pleasant.
examples:
- The forbidden fruit of the story was an apple from the tree of knowledge.
- For him, the forbidden fruit was a love he knew would bring trouble.
