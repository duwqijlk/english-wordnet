simpleMeaning: To pad furniture or give clothes a firm shape, makers weave this stiff stuff from the long
  strands on a horse's or a camel's coat.
scope: Also called hair, this is the cloth woven from horsehair or camelhair that pads furniture and stiffens
  clothes.
examples:
- The haircloth lining gave the jacket its firm shape.
- Upholsterers still use haircloth inside the backs of chairs.
