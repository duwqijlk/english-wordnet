simpleMeaning: In life lore, the being of two forms of one beast kind, apart from sex differences.
scope: In life lore, the being of two forms of one beast kind, apart from sex differences; not, in chemistry,
  the mark of certain substances that lets them stand in two clear crystal forms.
examples:
- Their dimorphism showed at dawn.
- The dimorphism was plain at noon.
