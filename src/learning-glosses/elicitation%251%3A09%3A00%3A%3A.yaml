simpleMeaning: something that stirs a living thing and brings out one kind of actions
scope: 'Also called evocation and induction: something that stirs a living thing and brings out one kind
  of actions, not the actions themselves and not a question asked to get an answer.'
examples:
- The elicitation of his testimony was not easy.
- The elicitation of the dog's tricks took only a few treats.
