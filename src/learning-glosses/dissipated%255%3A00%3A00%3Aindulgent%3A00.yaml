simpleMeaning: having one's mind full of fun, most of all games of chance where luck decides the winner
scope: 'Sporting, gambling and betting are other names for this sense: a life spent chasing fun, most
  of all games of chance, not a wild life with no care for what is right.'
examples:
- He led a dissipated life at the card tables.
- The dissipated young lord spent his nights gambling.
