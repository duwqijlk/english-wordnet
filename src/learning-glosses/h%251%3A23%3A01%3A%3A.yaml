simpleMeaning: a fixed number in science, joining a small bit of energy to its rate of swing; about 6.626
  times 10 to minus 34 in units of energy times time
scope: This is the fixed number joining a small bit of energy to its rate of swing, not the gas, the unit
  of inductance, or the 8th letter, and it is also called Planck's constant.
examples:
- The value of h is about 6.626 times 10 to minus 34.
- Physicists use h to link energy and frequency.
