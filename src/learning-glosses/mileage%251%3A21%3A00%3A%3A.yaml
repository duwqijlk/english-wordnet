simpleMeaning: money paid for travel, worked out at a set amount for each mile traveled
scope: Money paid for travel, worked out for each mile traveled; not the number of miles traveled, and
  not the amount of fuel a car uses for each mile.
examples:
- His job pays mileage for every mile he drives for work.
- She claimed mileage for her trip to an office in another town.
