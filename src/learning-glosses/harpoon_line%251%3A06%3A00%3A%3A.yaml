simpleMeaning: A strong rope that ties the catch to the boat of the person who threw the spear
scope: This is a strong rope that ties the catch to the harpooner's boat, not the spear itself and not
  a rope for tying up a boat at a dock.
examples:
- The harpoon line went taut as the whale pulled away.
- He coiled the harpoon line after the catch was brought in.
