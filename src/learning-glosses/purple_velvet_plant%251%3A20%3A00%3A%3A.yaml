  leafy growth from Java is kept.
scope: Also called royal velvet plant and velvet plant, it is a leafy growth from Java, kept for its handsome
  leaves.
examples:
- The purple velvet plant had handsome leaves, soft and smooth to the touch.
- Violet hairs covered the leaves of the purple velvet plant.
