simpleMeaning: no longer have something that was yours, or no longer be able to see it.
scope: This is not about failing to hear or follow what someone says; it is about an object that is no
  longer in your possession or no longer in view.
examples:
- I lost my keys somewhere between the car and the front door.
- We lost sight of the boat in the mist.
