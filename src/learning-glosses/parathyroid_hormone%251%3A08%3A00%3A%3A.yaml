simpleMeaning: A hormone that the parathyroid glands make and release into the blood; it balances phosphorus
  and calcium and plays a role in nerve and muscle activity and blood clotting.
scope: Another name for parathormone; it is the hormone, not the parathyroid glands that release it.
examples:
- The parathyroid glands release parathyroid hormone into the blood.
- Parathyroid hormone keeps calcium and phosphorus levels in balance.
