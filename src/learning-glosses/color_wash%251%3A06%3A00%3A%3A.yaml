simpleMeaning: a thin coat of water-based paint with a dye in it that gives a surface a tint
scope: A thin coat of water-based paint with a dye in it; colour wash is another name for this sense;
  not a thick coat of paint, and not plain white paint.
examples:
- They gave the wall a pale color wash.
- A color wash softened the bright white wall.
