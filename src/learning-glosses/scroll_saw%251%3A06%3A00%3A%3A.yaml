simpleMeaning: a power cutting tool with a thin, narrow blade and small teeth, used to cut curved shapes
scope: This is a power tool with a thin blade for cutting curved shapes; also called a jigsaw and a fretsaw,
  not a hand saw and not a tool for straight cuts.
examples:
- She used a scroll saw to cut the curved edge of the wooden sign.
- The scroll saw made a neat curve in the thin board.
