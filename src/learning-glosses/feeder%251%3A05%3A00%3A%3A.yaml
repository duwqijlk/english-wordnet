simpleMeaning: an animal that is being made fat, or that is fit to be made fat
scope: An animal kept to be made fat; not the thing put outside that gives food to wild birds, and not
  a small stream that flows into a bigger one.
examples:
- The farmer kept twenty feeders in the pen behind the barn.
- These young pigs are feeders and will be sold when they are fat enough.
