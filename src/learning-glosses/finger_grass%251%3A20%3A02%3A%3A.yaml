simpleMeaning: Creeping stems that root on their own mark this grass, a weed that troubles lawns.
scope: Also called crabgrass or crab grass, this grass troubles lawns with creeping stems that root on
  their own, unlike the Chloris grass of short grassland.
examples:
- The lawn was full of finger grass, with creeping stems that had rooted all through it.
- Finger grass spread across the lawn, its stems taking root wherever they touched the ground.
