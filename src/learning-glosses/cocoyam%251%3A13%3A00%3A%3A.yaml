simpleMeaning: a thick starchy root that grows in warm lands
scope: This is a thick starchy root from warm lands; taro, dasheen and edda are other names for this sense,
  and it is not the root of one taro plant only or a leaf or stem.
examples:
- The cocoyam grew as a thick starchy root in the warm soil.
- Farmers dug up cocoyam roots after the rains.
