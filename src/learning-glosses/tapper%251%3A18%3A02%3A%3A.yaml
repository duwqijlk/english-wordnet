simpleMeaning: A worker who uses a cutting tool called a tap to make screw threads.
scope: A worker who uses a cutting tool called a tap to make screw threads, not a person who listens in
  on phone or telegraph wires in secret, not a tavern keeper who taps kegs or casks, not a dancer who
  sounds out rhythms with metal taps on the toes and heels of the shoes, and not a person who strikes
  a surface lightly and usually repeatedly.
examples:
- The tapper cut the threads inside the nut with care.
- They worked as a tapper in the machine shop.
