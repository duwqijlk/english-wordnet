simpleMeaning: typical of a mental illness, or having a mental illness
scope: This word describes a person, behaviour, or signs linked to this illness; it is not the noun use
  that names the person who has the illness.
examples:
- His neurotic fear of germs made him wash his hands again and again.
- She went to a doctor for help with her neurotic symptoms.
