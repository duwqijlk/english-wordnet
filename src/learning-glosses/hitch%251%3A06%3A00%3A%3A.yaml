simpleMeaning: a knot for a short time that you can undo by pulling against the pull that holds it
scope: This is a knot used for tying for a short time, not an uneven way of walking from a hurt leg, not
  a problem that blocks you, and not a jump.
examples:
- He tied the rope to the post with a hitch.
- She used a quick hitch that came undone with one pull.
