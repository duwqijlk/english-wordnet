simpleMeaning: A tall timber pine of western North America, common and widespread, with dark green needles
  two to five per cluster; its bark forms thick, dark brown plates with age.
scope: Another name for the tall western pine also called bull pine, ponderosa or ponderosa pine, not
  an eastern pine such as the white pine.
examples:
- Western yellow pine forests cover much of the Rocky Mountains.
- Loggers prize western yellow pine for its straight trunk.
