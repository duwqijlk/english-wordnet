simpleMeaning: not held shut or in place in a firm way
scope: 'Also called unlocked, unbolted, unbarred and unsecured: a door or gate not held shut firmly, not
  the sense of a phone that has been opened for use.'
examples:
- The gate was unlatched, so it swung open in the wind.
- She pushed the unlatched door and walked inside.
