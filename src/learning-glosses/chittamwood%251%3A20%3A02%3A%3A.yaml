simpleMeaning: On the Pacific coast of the United States, a low, bushy tree gives cascara sagrada
scope: A shrubby tree of the Pacific coast of the United States that gives cascara sagrada; bearberry,
  bearwood, cascara buckthorn and chittimwood are other names for this sense, not the southern tree with
  great plumes of feathery flowers.
examples:
- Chittamwood grows along the Pacific coast.
- The bark of the chittamwood yields cascara sagrada.
