simpleMeaning: In grammar, marking or showing the word that is the subject of a verb, and words that name
  the same thing as that word after a linking verb
scope: In grammar, the form that marks the subject of a verb; not the object form and not the noun that
  is itself the subject.
examples:
- In 'She runs', 'she' is in the nominative case.
- The nominative form marks the subject of the verb.
