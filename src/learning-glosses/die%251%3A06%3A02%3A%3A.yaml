simpleMeaning: a metal tool that cuts the spiral ridges on the outside of a screw, bolt, or pipe.
scope: This is not the small cube used in games, and not the verb meaning to stop living.
examples:
- He turned the die onto the end of the rod to cut new threads.
- A set of dies lets a mechanic make bolts of different sizes.
