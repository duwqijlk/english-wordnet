simpleMeaning: to dress someone in formal clothes, especially the long special clothes worn for church
  services
scope: 'Also called robe: this is dressing someone else in formal church clothes, not dressing yourself,
  and not the sleeveless piece of clothing worn under a coat.'
examples:
- The helpers vested the priest in his robes before the service.
- They vested the new bishop in red robes.
