simpleMeaning: having to do with a consonant, or made up of consonants, or acting as one
scope: Of or like a consonant sound, not a vowel sound and not a word with no consonants.
examples:
- The word 'string' has a consonantal cluster at the start.
- A consonantal sound is made when the mouth blocks the air in part.
