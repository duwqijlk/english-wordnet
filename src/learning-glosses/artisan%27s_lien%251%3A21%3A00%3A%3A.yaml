simpleMeaning: The right of a worker to keep a piece of work until the worker has been paid for it
scope: The right of a worker to keep a piece of work until the worker has been paid for it; not the right
  to sell the work and not a debt owed to a bank.
examples:
- The carpenter kept an artisan's lien on the chair until he was paid.
- An artisan's lien lets the worker hold the work until payment comes.
