simpleMeaning: A thorny southern US shrub with glossy leaves and inedible citrus-like fruit; Native Americans
  used its amber timber for bows, and it is planted as a boundary hedge.
scope: The thorny hedge tree with inedible citrus-like fruit and amber timber, not the fragrant white-flowered
  garden shrub sold under a similar name.
examples:
- Farmers planted bow wood as a living fence along their fields.
- The bow wood in the hedgerow was covered in long thorns.
