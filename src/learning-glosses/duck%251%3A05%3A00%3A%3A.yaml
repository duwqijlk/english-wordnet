simpleMeaning: a small bird that swims, wild or kept by people, with skin between its toes, a wide flat
  bill, and usually a low flat body and short legs
scope: The small swimming bird; not the heavy cotton cloth and not the act of trying not to do or answer
  something.
examples:
- A duck swam across the pond with its young.
- The ducks on the farm have short legs and wide flat bills.
