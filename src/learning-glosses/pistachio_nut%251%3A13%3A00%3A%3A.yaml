simpleMeaning: The green part inside that can be eaten sits in a hard shell, on trees that grow round
  the Mediterranean Sea
scope: 'Also called pistachio: the green part inside the shell of a tree nut, not the tree itself and
  not another kind of nut.'
examples:
- She cracked open a pistachio nut and ate the green kernel.
- Pistachio nuts grow on trees round the Mediterranean Sea.
