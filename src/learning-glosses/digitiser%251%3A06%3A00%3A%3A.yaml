simpleMeaning: a machine that changes smooth signals, which vary without breaks, into signals made of
  numbers
scope: A machine that turns smooth signals into signals made of numbers, also called an analog-digital
  converter, an analog-to-digital converter or a digitizer, and not a machine that plays music or one
  that makes pictures.
examples:
- The lab bought a new digitiser to feed the old tapes into the computer.
- We used a digitiser to turn the radio signal into numbers.
