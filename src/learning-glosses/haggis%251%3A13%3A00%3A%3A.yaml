simpleMeaning: A food made of the inner parts of a sheep or young cow, cut up small with oats, hard fat
  and onions, and boiled inside the animal's stomach
scope: A food boiled inside a sheep's or calf's stomach; it is not a sausage and not a meat pie.
examples:
- They served haggis at dinner and cut it open at the table.
- For his first meal in Scotland, he tried haggis and liked its rich taste.
