simpleMeaning: to pretend to be a very interested customer in order to get other people to join in or
  pay more
scope: This is the action of pretending to be a very interested customer to draw others in, not the person
  who does this.
examples:
- He shilled at the sale, bidding high to push the price up.
- She shilled for the stall, acting very interested so that others would buy.
