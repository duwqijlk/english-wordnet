simpleMeaning: The whole body loses all feeling and sense of what is done when this drug is given
scope: A drug that sends the whole body into a state of no feeling, also called a general anesthetic,
  not a drug that numbs only one part of the body and not a sleeping pill.
examples:
- The surgeon asked for a general anaesthetic before starting the operation.
- A general anaesthetic was used so the patient would feel no pain.
