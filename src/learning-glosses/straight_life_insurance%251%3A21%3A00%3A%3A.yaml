senseId: 'straight_life_insurance%1:21:00::'
synsetId: 13368962-n
simpleMeaning: a plan that pays a set sum when a person dies, with the same yearly payment made every
  year until that person dies
scope: 'Also called ordinary life insurance and whole life insurance: a plan that pays a set sum when
  a person dies, with the same yearly payment until that person dies, not a plan that pays only for a
  set number of years.'
examples:
- He took out straight life insurance so his family would get a set sum when he died.
- Her straight life insurance costs the same amount every year.
