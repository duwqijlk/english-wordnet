simpleMeaning: a pan with a bottom that curves out, used for frying in Chinese cooking
scope: This is a cooking pan with a bottom that curves out, used for frying in Chinese cooking. It is
  not a flat pan, and not a deep pot made for soup.
examples:
- She heated oil in a wok before adding the meat.
- He cooked the vegetables quickly in a large wok.
