simpleMeaning: One part of the body holds each job it does in its own fairly small place, says this idea
  from the study of the body
scope: Also called localization, localisation of function, localisation principle, localization of function,
  and localization principle, it holds that each job of the body has its own fairly small place.
examples:
- Localisation puts each job of the body in its own small place.
- Localisation keeps each job of the body in one part of it.
