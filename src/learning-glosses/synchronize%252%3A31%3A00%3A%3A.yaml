simpleMeaning: to put events together in time, or show them as happening at the same time
scope: This is about putting events together in time or showing them as happening at the same time; it
  is not making things work together at the same time or in the same way.
examples:
- The writer synchronized the events in the two men's lives so the reader could compare them.
- He synchronized the Bible stories by placing events from different books in the same years.
