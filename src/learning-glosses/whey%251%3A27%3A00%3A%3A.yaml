simpleMeaning: The watery part of milk left after the thick part has been taken out to make cheese.
scope: Also called milk whey, the watery part of milk left after the thick part has been taken out to
  make cheese, not the watery part that comes when raw milk sours and sets.
examples:
- She drained off the whey when the cheese began to set.
- The whey ran off into a bowl as the curd formed.
