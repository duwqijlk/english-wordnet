simpleMeaning: a protein that joins with a helper chemical, called a coenzyme, to form an enzyme that
  can do its work
scope: A protein that is not yet active on its own, not a coenzyme and not a finished working enzyme.
examples:
- The apoenzyme needs its coenzyme before it can act.
- Without the coenzyme, the apoenzyme stays idle in the cell.
