simpleMeaning: a panel of the armed forces that judges its members charged with grave breaks of military
  law
scope: This is a panel of the armed forces that judges its members charged with grave breaks of military
  law, not a court for people outside the armed forces and not a hearing about small rule breaks.
examples:
- He faced a court-martial for leaving his post.
- The court-martial found the soldier guilty of a grave break of military law.
