simpleMeaning: An illness in which tissue thickens in the movement paths on the sides and front of the
  spinal cord, so muscles waste away bit by bit, starting in the limbs.
scope: Also called amyotrophic lateral sclerosis and ALS; an illness that wastes the muscles from the
  limbs, not a sudden injury and not a muscle cramp.
examples:
- Lou Gehrig's disease slowly weakens the muscles, starting in the arms and legs.
- He was told he had Lou Gehrig's disease after his hands grew weak.
