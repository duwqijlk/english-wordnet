simpleMeaning: Where most leaves meet its stem, this one-year plant of warm central Asia and Africa bears
  two sharp points that point apart, standing tall and straight.
scope: This one-year plant of warm central Asia and Africa is known by the two sharp points that spread
  apart where most leaves meet its stem.
examples:
- The thorny amaranth stood tall, its sharp points spread wide.
- Thorny amaranth pricked my fingers as I brushed past the stem.
