simpleMeaning: a bad lack of thyroid hormone, a substance made by a gland in the neck, that stops growth
  of the body and mind
scope: A bad lack of thyroid hormone that stops growth of the body and mind; not a mild lack of the hormone
  and not slow growth from another cause.
examples:
- The doctor said the cretinism came from a lack of thyroid hormone.
- Cretinism left the boy short and slow to learn.
