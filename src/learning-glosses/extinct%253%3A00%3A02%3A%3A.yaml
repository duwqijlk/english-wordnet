simpleMeaning: of a volcano or a thing like one, no longer active and never to be active again
scope: A volcano that has gone dead for good, never to erupt again; not a living thing that has died out,
  and not a fire that has gone out.
examples:
- The extinct volcano has not erupted for thousands of years.
- They built a village on the slopes of an extinct volcano.
