simpleMeaning: to make a piece of writing or a plan shorter while keeping its main points
scope: This means shortening a text while keeping what matters, not making a physical thing smaller and
  not making an idea less complicated.
examples:
- The editor reduced the article from ten pages to four.
- We had to reduce the report to fit the word limit.
