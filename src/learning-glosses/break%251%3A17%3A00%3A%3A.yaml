simpleMeaning: In geology, a fracture in Earth's outer layer where one side has shifted relative to the
  other.
scope: This is a geological fault, not a pause from work, a piece of good luck, a jail escape, or a bone
  fracture.
examples:
- A deep break in the rock ran along the valley floor.
- Geologists mapped the break where the two rock layers had shifted.
