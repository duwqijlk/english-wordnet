simpleMeaning: A thing found on an X chromosome, a thread in the cells of the body.
scope: A thing found on an X chromosome, not one found on a Y chromosome or on any other part of the body.
examples:
- The X-linked gene sits on the X chromosome.
- Doctors found the X-linked gene on one of her X chromosomes.
