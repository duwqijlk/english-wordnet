simpleMeaning: A heavy iron bar with one end shaped like a wedge, used to lift heavy things.
scope: This is a heavy iron bar for lifting heavy things; pry is another name for this sense, not a hammer
  or any ordinary metal bar.
examples:
- He used a crowbar to lift the lid off the crate.
- The workmen prised the boards up with a crowbar.
