simpleMeaning: looking or seeming almost the same as the real thing.
scope: It is not about distance in space or time, and not 'almost' before an adjective; it describes an
  imitation that looks very like the real thing.
examples:
- The shop sells near copies of famous handbags.
- Her voice is a near match for the singer on the record.
