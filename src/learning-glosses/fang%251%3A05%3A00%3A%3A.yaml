senseId: 'fang%1:05:00::'
synsetId: 01468113-n
simpleMeaning: a hollow tooth, or a tooth with a line cut in it, of a snake with poison, used to put its
  poison into the animal it bites
scope: This is the poison tooth of a snake, not the long tooth of a meat-eating animal and not the poison
  part of an insect.
examples:
- The snake put its fangs deep into the frog and let its poison go in.
- A fang can be hollow, so poison can run through it.
