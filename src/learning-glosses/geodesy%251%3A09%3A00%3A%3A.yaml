simpleMeaning: The branch of the study of the earth that looks at the shape of the earth and works out
  the exact place of points on it.
scope: This is the branch of the study of the earth that looks at the shape of the earth and works out
  the exact place of points on it, not the drawing of maps and not the study of the earth alone.
examples:
- Geodesy tells us the true shape of the earth.
- He studied geodesy to fix exact points on the land.
