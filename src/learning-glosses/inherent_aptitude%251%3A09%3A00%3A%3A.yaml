simpleMeaning: When it meets one kind of thing, a living thing often acts in a set way that it was born
  with
scope: A set way of acting a living thing is born with, also called instinct; not a skill learned through
  practice and not a habit picked up by chance.
examples:
- The salmon's inherent aptitude for swimming upstream guides it home.
- An inherent aptitude in the young birds made them follow the call.
