simpleMeaning: Pottery richly painted and covered with a shiny coat made with tin oxide
scope: Pottery richly painted and covered with a shiny coat made with tin oxide, not plain pottery and
  not a coat of paint alone; majolica is another name for this sense.
examples:
- The maiolica plate was painted in bright blues and greens.
- She collected maiolica from Italy.
