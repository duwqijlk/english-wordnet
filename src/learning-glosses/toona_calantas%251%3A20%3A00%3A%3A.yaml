simpleMeaning: A tree of the Philippines that gives hard red wood that smells sweet, used as timber.
scope: Also called kalantas, Cedrela calantas, Philippine cedar and Philippine mahogany, this is a tree
  of the Philippines whose hard red wood smells sweet, not any other timber tree.
examples:
- Toona calantas grows in the Philippines.
- The wood of Toona calantas is hard and red and smells sweet.
