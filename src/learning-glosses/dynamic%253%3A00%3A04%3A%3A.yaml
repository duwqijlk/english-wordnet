simpleMeaning: In grammar, used for verbs and words made from verbs, like 'running', that show an action,
  not a state of being
scope: 'Also called active: in grammar, about verbs that show action, not about a person full of energy
  and force, and not about the study of forces and movement.'
examples:
- In 'she runs fast', 'runs' is a dynamic verb.
- Dynamic verbs like 'run' and 'eat' show actions.
