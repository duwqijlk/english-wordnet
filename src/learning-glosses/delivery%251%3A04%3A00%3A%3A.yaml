simpleMeaning: the act of getting a person or thing back from loss or danger, or of keeping them safe
  from it
scope: 'Also called rescue and saving: this is getting someone back from loss or danger or keeping them
  safe, not a throw in baseball, not a way of speaking, and not bringing goods.'
examples:
- They prayed for the delivery of the city from the enemy.
- The delivery of the prisoners from danger was a great relief to all.
