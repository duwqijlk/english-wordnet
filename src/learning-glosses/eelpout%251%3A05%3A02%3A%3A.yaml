simpleMeaning: In the fresh waters of the north of Europe, Asia and North America lives a long thin cod
  with long thin parts around its mouth.
scope: Ling, burbot and cusk are other names for this long thin cod of the fresh waters of the north,
  not the sea fish of the same name.
examples:
- The fisherman caught an eelpout in the lake.
- The eelpout swam through the fresh water.
