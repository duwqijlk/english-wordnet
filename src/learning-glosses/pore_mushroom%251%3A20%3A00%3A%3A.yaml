simpleMeaning: A woody fungus whose spore-producing surface lies inside tubes or pores; its fruiting bodies
  are usually woody when mature and last a long time.
scope: Another name for this fungus is pore fungus, and it is also called a polypore; unlike a gilled
  mushroom, it has its spores in tubes or pores.
examples:
- This shelf-like pore mushroom grows on birch trunks and releases spores from fine tubes.
- The guide pointed out a pore mushroom rather than a gilled one, showing us the tiny holes underneath.
