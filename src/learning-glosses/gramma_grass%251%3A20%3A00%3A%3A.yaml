simpleMeaning: A plant of the plains of South America and western North America, where farm animals feed
  on it.
scope: 'Also called gramma, grama or grama grass: a plant of the plains of South America and western North
  America where farm animals feed, not a lawn grass and not a tall prairie grass.'
examples:
- Gramma grass covered the dry plains in a low green mat.
- Cattle fed on the gramma grass of the western plains.
