simpleMeaning: A way of making pictures by using the pull of the tiny parts of atoms, showing how thickly
  those parts are packed
scope: A way of making pictures by using the pull of the tiny parts of atoms; not an X-ray picture and
  not a drawing.
examples:
- The doctor ordered magnetic resonance imaging to look inside the patient's knee.
- Magnetic resonance imaging gave a clear picture of the brain.
