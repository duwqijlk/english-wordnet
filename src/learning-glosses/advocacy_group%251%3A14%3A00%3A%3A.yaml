simpleMeaning: A set of people joined by one cause, pressing lawmakers and officials to act for them,
  most often by meeting them and putting their case face to face.
scope: Also called lobby, lobby group, pressure group, special-interest group, special interest, special
  interest group, and third house, these people press lawmakers and officials to act for their cause,
  most often by meeting them and putting their case face to face.
examples:
- The advocacy group met the lawmakers to press its case.
- An advocacy group for clean rivers spoke at the hearing.
