simpleMeaning: an event in which something moves from one state or stage to another
scope: An event in which something moves from one state or stage to another; also called change, and not
  the act of making a change, and not the revising of a piece of work.
examples:
- The alteration in the weather caught us by surprise.
- Few alterations had taken place in the old street since his last visit.
