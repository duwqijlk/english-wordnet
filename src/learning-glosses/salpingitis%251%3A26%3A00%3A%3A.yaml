simpleMeaning: A swelling usually from germs that spread from the birth canal or womb into a tube that
  carries eggs, or into the tube that joins the ear to the throat
scope: A swelling of a tube that carries eggs or of the tube that joins the ear to the throat, usually
  after germs spread from the birth canal or womb; not a swelling of the womb itself.
examples:
- Salpingitis is a swelling of the tube that carries eggs.
- Her salpingitis followed germs spreading from the womb.
