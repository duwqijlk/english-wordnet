simpleMeaning: A snake of southeast Asia and the Malay peninsula, bright in colour and full of poison,
  yet one that does not attack people.
scope: A bright, poisonous snake of southeast Asia that does not attack people, with cobras and vipers
  as near rivals.
examples:
- The krait lay still in the grass, bright in colour and easy to see.
- We saw a krait on the path in southeast Asia.
