simpleMeaning: the use of lies and dishonest acts to cheat someone, usually to get money from them
scope: Also called shenanigan, guile, wile, and chicanery. This is using lies to cheat someone, usually
  for money, not a harmless joke or a magic act.
examples:
- His trickery left many people without their savings.
- The seller used trickery to get money from old people.
