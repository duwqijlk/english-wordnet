simpleMeaning: A former name for a childhood condition with marked trouble in talking, play and social
  life, starting in early childhood.
scope: A former name for a childhood condition with marked disability and signs that start in early childhood,
  also called autistic disorder, childhood autism, classic autism, classical autism, infantile autism,
  infantile psychosis, Kanner's autism and Kanner's syndrome; its near kin are other conditions of the
  autism spectrum.
examples:
- Kanner syndrome is an old name for the condition.
- The doctor wrote Kanner syndrome in his notes.
