senseId: 'vocative_case%1:10:00::'
synsetId: 06323227-n
simpleMeaning: In some languages where nouns change their form, the form of a noun used when someone speaks
  to the person or thing named
scope: 'Also called vocative: the word form used to call out to someone, not the form used as a subject
  or an object.'
examples:
- In Latin, the vocative case is used when you call someone by name.
- When the teacher called "Marcus!" she used the vocative case.
