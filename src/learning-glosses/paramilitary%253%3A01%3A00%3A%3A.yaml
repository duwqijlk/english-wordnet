simpleMeaning: to do with a group of ordinary people, not soldiers, who are set up to work like soldiers
  or to help them
scope: About a group of civilians set up to act like soldiers or help them, not regular soldiers and not
  the group itself.
examples:
- The paramilitary force guarded the border towns.
- He joined a paramilitary unit after leaving the army.
