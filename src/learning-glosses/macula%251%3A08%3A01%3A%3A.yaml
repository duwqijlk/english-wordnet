simpleMeaning: Where the skin has changed colour in a patch that is usually flat, not raised, one of many
  kinds of sickness is the cause
scope: Also called macule, this is a patch of skin changed in colour by sickness, not a dark spot on the
  sun and not a part of the eye.
examples:
- A macula on her arm had changed colour after the illness.
- The doctor looked at the macula and asked about her health.
