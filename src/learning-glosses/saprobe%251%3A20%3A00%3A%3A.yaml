simpleMeaning: A living thing that lives in dead matter in still or foul water and gets its food from
  it.
scope: A living thing that feeds on dead matter in still, foul water; not a parasite that feeds on living
  things and not a plant that makes its own food.
examples:
- Saprobes live in the still water of the pond.
- The saprobe feeds on dead leaves in the ditch.
