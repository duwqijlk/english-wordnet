senseId: 'flatness%1:07:02::'
synsetId: 04963287-n
simpleMeaning: the quality of a surface that has little or no contrast and no bright spots or shine
scope: Also called matt, mat and matte, this is the dull look of a surface with little contrast and no
  shine, not the quality of being level.
examples:
- The flatness of the photograph made the grey wall look dull.
- She liked the flatness of the paint, with no shine at all.
