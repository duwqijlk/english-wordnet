simpleMeaning: A piece of jewelry made in the shape of a long feather, or such a feather itself, worn
  on a hat, above all one from an egret.
scope: This long feather, worn on a hat, or the jewel made in its shape, is also called aigrette; above
  all it is one from an egret.
examples:
- She wore an aigret of egret feathers on her hat.
- The aigret pinned to her hat was made of egret feathers.
