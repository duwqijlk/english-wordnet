simpleMeaning: Pumped full of air, a ring of strong rubber round a wheel carries motor vehicles and bikes
  and the like.
scope: A pneumatic tyre is another name for this air-filled ring of strong rubber round a wheel, used
  on motor vehicles and bikes and the like.
examples:
- The pneumatic tire on my bike went flat.
- We put a new pneumatic tire on the front wheel of the car.
