simpleMeaning: A cheat that the court takes as proved from what happened, though the doer may have had
  no bad aim.
scope: A cheat the court takes as proved from what happened, though no bad aim need be shown; not real
  cheating done to hurt another, and not a mere mistake.
examples:
- The judge found fraud in law from the papers alone.
- Fraud in law does not need proof of a bad aim.
