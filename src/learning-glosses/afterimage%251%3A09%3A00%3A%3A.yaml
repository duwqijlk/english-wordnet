senseId: 'afterimage%1:09:00::'
synsetId: 05944848-n
simpleMeaning: an image that you still see after you stop looking at something, usually with its colours
  and light and dark the other way round
scope: An image left in your eyes after you look at something; it is not a real picture in front of you
  and not a memory.
examples:
- After looking at the bright light, he saw an afterimage when he closed his eyes.
- The orange dot left a blue afterimage that stayed for a few seconds.
