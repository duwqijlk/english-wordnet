simpleMeaning: a slice of meat cut from a part of an animal or a large fish that has a lot of meat
scope: A slice of meat cut for cooking and eating. Not a pointed wooden post with a like-sounding name,
  a stake.
examples:
- He grilled a thick steak for dinner.
- She ordered a tuna steak at the restaurant.
