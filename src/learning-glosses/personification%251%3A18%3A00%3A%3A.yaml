senseId: 'personification%1:18:00::'
synsetId: 10437846-n
simpleMeaning: A living person who stands for a general idea or quality, such as kindness or courage.
scope: This is about a real person who stands for an idea, not the act of giving human traits to an idea,
  and not a picture or story that shows an idea as a person or animal.
examples:
- She is the personification of optimism.
- The old sailor became a personification of courage in the town.
