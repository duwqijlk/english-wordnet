simpleMeaning: the last part of a pregnancy, starting when the pains begin and ending when the child is
  born
scope: 'Also called labor and labour: the last part of pregnancy, from the first pains to the birth, not
  keeping a person shut in.'
examples:
- Her confinement lasted six hours.
- The midwife stayed with her through the confinement.
