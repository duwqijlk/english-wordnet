simpleMeaning: A South American bush or small tree with long shiny leaves that stay green all year and
  bunches of green or yellow flowers.
scope: A South American bush or small tree with shiny evergreen leaves, not a tall forest tree and not
  a plant grown for fruit.
examples:
- The puka grows in the warm parts of South America.
- In spring the puka bears bunches of green or yellow flowers.
