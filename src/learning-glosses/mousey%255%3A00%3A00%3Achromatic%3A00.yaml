simpleMeaning: Of a dull, pale brown colour, like the fur of a mouse.
scope: Also called mousy or mouselike, of a dull, pale brown colour like the fur of a mouse; not the use
  for a person who is quiet, timid, and of no effect.
examples:
- Her hair was mousey, dull and pale brown.
- The coat looked mousey next to the bright scarves.
