simpleMeaning: To join parts by lowering them into a bath of hot melted joining metal.
scope: To join parts by lowering them into hot melted joining metal, not to join them with a hot iron
  and not to glue them.
examples:
- They dip solder the wires by lowering them into the hot bath.
- The worker will dip solder the joints this morning.
