scope: A fresh-water fish from Central America with a long sword-like tail, kept in home fish tanks; swordtail
  and helleri are other names for this sense. Not the small surface-feeding fish used to control mosquitoes.
examples:
- The topminnow darted through the plants in the tank.
- A male topminnow shows a long tail like a sword.
