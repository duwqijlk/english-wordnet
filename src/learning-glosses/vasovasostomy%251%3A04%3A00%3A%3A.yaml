senseId: 'vasovasostomy%1:04:00::'
synsetId: 00717772-n
simpleMeaning: The tube that carries seed out is made to work again by an operation that tries to undo
  the operation that cut it.
scope: This is an operation that tries to undo the cutting of the tube that carries seed out, not the
  cutting operation itself.
examples:
- He had a vasovasostomy to undo the earlier operation.
- His vasovasostomy aimed to make the tube work again.
