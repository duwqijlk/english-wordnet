simpleMeaning: the verb form that shows the subject of the verb is the one the action happens to, not
  the one doing it
scope: The verb form that shows the subject is the one the action happens to, not the one doing it; passive
  is another name for this sense.
examples:
- ‘The ball was thrown by the boy’ uses the passive voice.
- ‘The ball was thrown’ is a short passive voice form.
