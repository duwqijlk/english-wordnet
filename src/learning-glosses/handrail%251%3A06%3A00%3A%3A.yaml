simpleMeaning: a long bar at the side of stairs or a balcony that people can hold so they do not fall
scope: 'This sense is also called banister, balustrade, and bannister: a bar to hold beside stairs or
  a balcony, not a fence in a garden or a rail for trains.'
examples:
- She held the handrail as she walked slowly down the stairs.
- He leaned on the handrail and looked down from the balcony.
