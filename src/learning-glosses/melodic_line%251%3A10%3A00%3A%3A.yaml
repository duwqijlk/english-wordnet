simpleMeaning: Notes that follow one after another make a set you can tell apart
scope: A set of notes, one after another, that you can tell apart, also called air, line, melodic phrase,
  melody, strain and tune; not a single note and not the words of a song.
examples:
- She hummed the melodic line from the first song of the show.
- The melodic line in the chorus stays in your head all day.
