simpleMeaning: 'It may need an operation to put it right: a blood vessel that joins two large vessels
  by the heart and stays open after birth'
scope: A blood vessel near the heart that stays open after birth and may need an operation to put it right,
  not a vessel that closed as it should and not a hole in the heart.
examples:
- The baby was born with a patent ductus arteriosus.
- Doctors watched the patent ductus arteriosus to see if it would close on its own.
