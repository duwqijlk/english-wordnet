simpleMeaning: a sickness of the brain and spinal cord, above all in horses and cattle, that makes the
  animal sway and fall often as it walks
scope: 'Also called staggers: a sickness of the brain and spinal cord in horses and cattle, not a sickness
  that blinds the eyes.'
examples:
- Blind staggers makes a horse sway and fall often as it walks.
- Cattle with blind staggers cannot walk straight.
