simpleMeaning: a person that others laugh at and play tricks on
scope: Also called butt, goat, and laughingstock. This is a person others laugh at and trick, not a person
  who does what a stronger person tells him to do.
examples:
- In the show, Tom was the stooge, and the others laughed at him in every scene.
- The boys made the new boy their stooge and played tricks on him all week.
