simpleMeaning: A slow, small rise and fall on a brain chart, the usual one when a person is awake but
  calm and sleepy.
scope: Theta rhythm is another name for this slow, small brain wave on a brain chart.
examples:
- The theta wave showed on the brain chart while she lay awake but sleepy.
- He lay awake but drowsy as the theta wave came slow and small.
