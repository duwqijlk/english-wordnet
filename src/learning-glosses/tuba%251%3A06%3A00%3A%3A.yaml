simpleMeaning: a brass wind instrument that plays lower notes than any other of its kind
scope: A brass wind instrument that sounds the lowest notes; not a trumpet or a trombone, which play higher.
examples:
- He played the tuba in the school band.
- The tuba gave the low notes under the melody.
