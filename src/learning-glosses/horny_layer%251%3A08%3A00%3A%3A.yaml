simpleMeaning: The outside skin, made of dead cells that fall away
scope: The outside skin, made of dead cells that fall away, also called the corneum; not the living skin
  below it, and not a scab.
examples:
- The horny layer of the skin sheds dead cells every day.
- A thick horny layer guards the skin of the heel.
