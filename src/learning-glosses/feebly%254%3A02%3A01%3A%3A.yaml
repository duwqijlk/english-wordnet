simpleMeaning: In a weak way, so faint that it is barely seen or heard.
scope: This means doing something weakly and faintly, not the sense of doing it in stops and starts.
examples:
- The lighthouse flashed feebly against the dark coast.
- Her voice came feebly through the phone.
