simpleMeaning: to open or move something out so that it becomes longer, or reaches its full length
scope: 'Also called stretch: this is about opening or moving something out to a longer length or to its
  full length, not about reaching across time or distance and not about making a range wider.'
examples:
- He extended the ladder to its full length.
- She carefully extended the rope to its full length.
