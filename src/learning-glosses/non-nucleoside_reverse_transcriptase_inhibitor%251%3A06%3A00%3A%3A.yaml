senseId: 'non-nucleoside_reverse_transcriptase_inhibitor%1:06:00::'
synsetId: 03833695-n
simpleMeaning: a virus-fighting drug used against HIV that fastens straight onto reverse transcriptase
  and stops RNA from turning into DNA, often used along with other drugs
scope: A drug that blocks reverse transcriptase by fastening straight onto it, not a nucleoside reverse
  transcriptase inhibitor, which works by joining the virus's DNA, and not a drug that kills the virus
  outright.
examples:
- The doctor added a non-nucleoside reverse transcriptase inhibitor to her HIV drugs.
- This non-nucleoside reverse transcriptase inhibitor stops the virus from turning RNA into DNA.
