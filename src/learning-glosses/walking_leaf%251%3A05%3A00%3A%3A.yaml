simpleMeaning: a warm-climate insect with a flat body that looks like the flat part of a plant, common
  in southern Asia and the East Indies
scope: A warm-climate insect with a flat body like the flat part of a plant, also called leaf insect;
  not a real leaf and not a stick insect.
examples:
- The walking leaf sat still on the branch, looking like part of the plant.
- A walking leaf is hard to see among the green leaves of a tree.
