simpleMeaning: A kind of fungus, wide and egg-shaped, most often smooth though a few bear tiny sharp warts,
  and not turning blue with iodine.
scope: A kind of fungus, wide and egg-shaped and most often smooth, though a few bear tiny sharp warts;
  it does not turn blue with iodine, unlike fungi that do stain blue.
examples:
- Fischer's slime mushroom grew on the damp log, wide and egg-shaped.
- The Fischer's slime mushroom we found was smooth, with no warts at all.
