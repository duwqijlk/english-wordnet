simpleMeaning: a table or stand that holds a bowl and a jug of water for washing yourself
scope: This sense is also called a wash-hand stand in British English. It is a movable table or stand
  with a bowl and a jug for washing, not a bathroom sink fixed in place and joined to a water pipe.
examples:
- In the old bedroom, a washstand held a bowl and a jug of water.
- Before bathrooms were common, people washed at a washstand each morning.
