senseId: 'cosignatory%1:18:00::'
synsetId: 09636720-n
simpleMeaning: one of two or more people who put their names to the same paper, such as a treaty or a
  declaration
scope: One of two or more people who put their names to the same paper; cosigner is another name for this
  sense, not the only person who signs a paper.
examples:
- She was a cosignatory of the treaty, one of three leaders who signed it.
- As cosignatory of the declaration, he put his name to the same paper as the other leaders.
