simpleMeaning: A salad that as a rule has fried bits of bread and a dressing made with a raw egg.
scope: This is a salad with fried bread bits and a raw-egg dressing; not other salads with cooked dressings,
  and not a salad of fruit.
examples:
- We shared a Caesar salad with fried croutons at lunch.
- The Caesar salad came with a dressing made from a raw egg.
