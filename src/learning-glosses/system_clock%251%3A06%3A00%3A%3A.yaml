senseId: 'system_clock%1:06:00::'
synsetId: 04384929-n
simpleMeaning: An electronic device in a computer that sends out a steady fast signal to keep all the
  inner parts working together.
scope: This is an electronic device in a computer that keeps the inner parts working together, not a wall
  clock and not a timer.
examples:
- The system clock keeps the computer's parts in step.
- A fault in the system clock slowed the machine.
