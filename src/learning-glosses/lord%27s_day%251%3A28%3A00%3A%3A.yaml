simpleMeaning: Most Christians keep this as a time of rest and worship, at the start of the week.
scope: Also called Sun, Sunday, and Dominicus, this is the start of the week, kept by most Christians
  for rest and worship, not any other time of the week.
examples:
- The Lord's Day is a time of rest for our family.
- On the Lord's Day, most Christians go to church to worship.
