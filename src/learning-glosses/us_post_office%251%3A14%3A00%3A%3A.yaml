simpleMeaning: The government of the United States set up a group of its own to deliver the mail, and
  at times phone and radio messages, to people and firms there.
scope: Also called PO, Post Office and United States Post Office, this is the group that delivers the
  mail in the United States, not the group that sorts it and not any other part of the government.
examples:
- The US Post Office delivered the parcel yesterday.
- She mailed the letter at the US Post Office.
