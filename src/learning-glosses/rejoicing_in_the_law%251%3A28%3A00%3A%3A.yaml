simpleMeaning: In Judaism, a Jewish holy day on the 22nd or 23rd of Tishri, marking the end of the year's
  round of readings from the Torah.
scope: Also called Rejoicing of the Law, Rejoicing over the Law, Shimchath Torah, Simchas Torah, Simchat
  Torah, Simhat Torah and Simhath Torah; in Judaism, a holy day on the 22nd or 23rd of Tishri marking
  the end of the year's round of readings from the Torah.
examples:
- Rejoicing in the Law falls on the 22nd or 23rd of Tishri.
- On Rejoicing in the Law, the Torah readings for the year come to an end.
