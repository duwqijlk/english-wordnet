simpleMeaning: Any of a group of green living things from the mild lands of Europe and Asia, grown for
  yellow flowers and fine leaves
scope: A group of plants grown for yellow flowers and fine leaves; not the spotted wild animal, and not
  any other yellow-flowered plant.
examples:
- The leopard plant's yellow flowers brightened the shady bed.
- Gardeners grow leopard plant for its bold leaves.
