simpleMeaning: a fishing net shaped like a cone that is pulled through the water at great depth
scope: This net is also called a dragnet; it is not a long fishing line with many hooks and not the act
  of fishing with such a net.
examples:
- The boat pulled a large trawl behind it deep under the sea.
- Fish were caught in the trawl as it moved through the water.
