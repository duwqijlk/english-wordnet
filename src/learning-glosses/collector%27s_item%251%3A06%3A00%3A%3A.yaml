simpleMeaning: the best and most striking thing in a set of things kept together, the one people look
  at first
scope: This is the best and most striking thing in a set of things kept together, also called a showpiece
  and a piece de resistance; not just any thing in the set, and not a thing kept for its price alone.
examples:
- The old clock is the collector's item in her set of clocks.
- Visitors crowd round the collector's item at the back of the room.
