senseId: 'palatalise%2:32:00::'
synsetId: 00953101-v
simpleMeaning: To say a consonant, a speech sound made by blocking the air, with the tongue pressed to
  the roof of the mouth
scope: 'Also called palatalize: to say a consonant with the tongue on the roof of the mouth, not to say
  a sound with the lips and not to change a word''s spelling.'
examples:
- In that dialect, speakers palatalise the 't' before 'i'.
- Children learn to palatalise certain sounds as they pick up the language.
