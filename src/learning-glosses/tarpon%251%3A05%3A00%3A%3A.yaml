simpleMeaning: a big silver fish caught for sport in warm sea water near the Atlantic coast, above all
  off Florida
scope: This is a big silver fish caught for sport in warm Atlantic waters, not a small river fish and
  not a fish caught for food.
examples:
- The tarpon leapt clear out of the water as he fought it.
- Anglers come to Florida hoping to catch a tarpon.
