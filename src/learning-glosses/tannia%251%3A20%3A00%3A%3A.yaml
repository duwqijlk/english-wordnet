simpleMeaning: From warm parts of America comes this plant of the aroid kind, whose thick underground
  stems people cook and eat as they do yams or potatoes.
scope: Its thick underground stems are cooked and eaten like yams or potatoes; malanga, spoonflower and
  yautia are other names for it, not the yam or the potato itself.
examples:
- They dug up the tannia and cooked its thick stems like potatoes.
- Tannia grows in warm parts of America.
