simpleMeaning: to give a person the power of a king or queen and put them on a throne as ruler
scope: This verb is about making someone a king or queen. It is not the round gold thing a king wears
  on his head, and not a cover for a broken tooth.
examples:
- The prince was crowned king in the abbey.
- They crowned the new queen in a big ceremony.
