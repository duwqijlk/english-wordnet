simpleMeaning: a shape with a corner or a round turn, made when something is folded
scope: This shape made by folding is also called fold and bend. It is not a small dip in a smooth surface,
  and not the knife sense.
examples:
- The crease in the folded napkin formed a sharp corner.
- The paper had a round crease where it had been folded.
