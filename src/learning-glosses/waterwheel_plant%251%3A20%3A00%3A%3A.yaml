simpleMeaning: a floating perennial plant with rings of six to nine leaves whose hinged tips snap shut
  to catch prey such as water fleas; native to Europe, Africa, Asia and Australia.
scope: This small floating meat-eating plant with snapping leaf traps is not a waterwheel used to power
  mills.
examples:
- The waterwheel plant traps water fleas with its hinged leaves.
- The pond was covered with waterwheel plants.
