simpleMeaning: about the art of speaking or writing in a way that moves or wins over other people
scope: This sense is about speaking or writing that aims to win people over, not the sense of using fine
  style while giving too little thought to ideas.
examples:
- She made a few rhetorical changes to the speech before the debate.
- His rhetorical skill helped him win over the crowd.
