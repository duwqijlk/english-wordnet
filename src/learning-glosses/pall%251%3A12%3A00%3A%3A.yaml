simpleMeaning: a sudden strong fear that makes a person feel unable to move or think clearly
scope: 'Also called chill: a sudden strong fear, not hanging cloth for a window and not cloth for a dead
  body.'
examples:
- A sudden pall took hold of him when he heard steps behind him in the dark.
- The bad news sent a pall through the crowd, and no one moved or spoke.
