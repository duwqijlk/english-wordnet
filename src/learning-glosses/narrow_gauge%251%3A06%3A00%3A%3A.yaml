simpleMeaning: Less wide than the usual 56.5 inches is this rail track, or the gap between its two rails
scope: A rail track, or the gap between its two rails, less wide than the usual 56.5 inches, not the usual
  width of track and not a road.
examples:
- The narrow gauge line ran through the hills on a track less wide than most.
- This narrow gauge track was built for the small trains of the valley.
