simpleMeaning: One of several related tongues of the Celts, spoken in Ireland and Scotland.
scope: Also called Erse, Erse language, Gaelic, Gaelic language, and Goidelic; one of several related
  tongues of the Celts in Ireland and Scotland, set beside the Brythonic tongues of Wales and Brittany.
examples:
- The Goidelic language of the village was Irish.
- Scholars group Irish and Scottish Gaelic as Goidelic language.
