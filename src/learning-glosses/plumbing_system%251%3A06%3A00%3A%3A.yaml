simpleMeaning: In a building, water or gas is carried to where it is used, and waste is taken away, by
  the pipes and fittings.
scope: Plumbing is another name for these pipes and fittings in a building, which carry water or gas to
  where it is used and take waste away.
examples:
- The plumbing system carries water to where it is used in the building.
- The plumbing system takes waste away from the building.
