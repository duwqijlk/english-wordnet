simpleMeaning: light concrete blocks, ready-made since the mid-1920s, that stand up to fire and mould,
  keep heat in, and give a building its frame all at once
scope: Also called autoclaved aerated concrete, autoclaved cellular concrete, autoclaved concrete, and
  porous concrete; light ready-made blocks for building, not heavy stone blocks and not poured concrete.
examples:
- Autoclaved lightweight concrete gives the house its frame and keeps heat in.
- Autoclaved lightweight concrete is used for walls that must stand up to fire.
