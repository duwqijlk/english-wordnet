simpleMeaning: In medicine, a person who is very ill usually keeps moving and jerking in bed and cannot
  lie still.
scope: In medicine, very restless tossing and twitching, usually by a person with a severe illness; jactitation
  is another name for this sense, not a single twitch and not restless sleep.
examples:
- Jactation kept the sick man tossing all night.
- The nurse watched the jactation of the feverish patient.
