simpleMeaning: A deep cut in the ground that lets people move safely between the back and front lines
  of a defended place
scope: A deep cut in the ground that lets soldiers move safely between the back and front lines; approach
  trench is another name for this sense, not a front-line fighting trench and not a ditch for water.
examples:
- The soldiers used the communication trench to reach the front line.
- A communication trench linked the rear camp to the front.
