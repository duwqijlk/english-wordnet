simpleMeaning: of dials and meters, to show a certain number or reading
scope: Also called record, show, and read, this is what dials and meters do when they show a certain number,
  not writing a name in a list and not sending a letter by special post.
examples:
- The gauge registered empty when the tank ran dry.
- The thermometer registered ten degrees below zero.
