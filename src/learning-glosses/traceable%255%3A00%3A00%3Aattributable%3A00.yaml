simpleMeaning: 'usually followed by ''to'': able to be shown to come from a named cause or place'
scope: This sense, usually used with 'to', is about showing where a thing came from or what caused it,
  not about being able to follow or find a thing by its path.
examples:
- The fault was traceable to a broken wire.
- His illness was traceable to bad water in the village.
