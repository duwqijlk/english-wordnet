simpleMeaning: The belief that every quarrel between countries can be settled by letting others judge
  it
scope: 'Also called pacifism: the belief that quarrels between countries can be settled by others judging
  them, not the belief that war is the answer and not a plan for fighting a war.'
examples:
- His pacificism led him to call for talks instead of war.
- She held to pacificism even when other countries armed for war.
