simpleMeaning: Paint makers use this yellow-white crystal-like stuff, found in the ground as sphalerite
  and wurtzite, because it gives off light and shines.
scope: 'Another name for this sense is zinc sulfide: a yellow-white crystal-like stuff that gives off
  light and is used as a paint colour that shines.'
examples:
- Zinc sulphide made the sign glow.
- The zinc sulphide in the paint gave off a soft light.
