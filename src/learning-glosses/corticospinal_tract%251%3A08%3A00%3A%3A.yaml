simpleMeaning: A bundle of movement nerves on each side of the central nervous system, running from the
  cortex through the brainstem to nerve cells in the head and spinal cord.
scope: This is the movement pathway from the cortex to the spinal cord, not a sensory tract for touch
  or pain and not one single nerve cell.
examples:
- Damage to the corticospinal tract can cause weakness on one side of the body.
- The corticospinal tract carries movement commands from the brain to the spine.
