simpleMeaning: very much, in a way that many people know about and think is bad
scope: An adverb saying how far something is true, with the added sense that people know it and think
  it bad; not a word for a person who is known for bad things.
examples:
- The road is notoriously hard to drive on in winter.
- He is notoriously late for every meeting.
