simpleMeaning: Someone who cares for babies while their parents work, usually in the carer's own home
scope: This person cares for babies while the parents work, usually at home; not the person set to watch
  people who visit from another country.
examples:
- The minder looks after three babies at her own home while their parents work.
- We leave our son with a minder during the day because we both work.
