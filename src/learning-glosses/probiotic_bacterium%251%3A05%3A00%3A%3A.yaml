simpleMeaning: a helpful tiny living thing found in the gut of healthy animals with fur, often thought
  of as a plant
scope: 'Also called probiotic, probiotic flora, and probiotic microflora: a helpful tiny living thing
  in the gut of healthy animals, not a germ that makes you ill and not a plant.'
examples:
- The yoghurt had a probiotic bacterium that helps the gut stay healthy.
- A probiotic bacterium lives in the gut of healthy animals.
