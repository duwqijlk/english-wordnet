senseId: 'esmolol%1:06:00::'
synsetId: 03301688-n
simpleMeaning: Used mainly for fast or uneven heartbeats, this drug is given into a vein and slows the
  heart, but only for a short time; it is sold as Brevibloc.
scope: This is a drug that slows the heart for only a short time, not one that keeps it slow for a long
  time.
examples:
- Esmolol was given into a vein to slow his racing heart.
- His heartbeat slowed after esmolol, then quickened again.
