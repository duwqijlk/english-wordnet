simpleMeaning: a very large barrel, especially one that holds as much as 2 butts (large barrels used as
  a measure) or 252 gallons
scope: A very large barrel for liquid, named by how much it holds; not a small bottle or cup, and not
  the weight word that sounds the same.
examples:
- The wine was kept in a huge tun in the dark cellar.
- They needed a crane to lift the full tun onto the cart.
