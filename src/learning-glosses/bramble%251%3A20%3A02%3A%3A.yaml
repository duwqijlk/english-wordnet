simpleMeaning: any of several kinds of rough bushes or climbing plants covered with sharp thorns
scope: This is any rough thorny bush or vine, not a single named plant and not the fruit it bears.
examples:
- Brambles had grown thick across the old path.
- He tore his sleeve on a bramble while picking berries.
