simpleMeaning: A way of writing satire first made by Horace, a Roman poet of the 1st century BC.
scope: This is the satire first made by Horace, a Roman poet of the 1st century BC, not satire first made
  by a later writer or another kind of writing.
examples:
- The fountain of Horatianism in Spain was the imitation of Epode II, Beatus Ille, by the Marquis de Santillana,
  one of Castile's two first sonneteers, in the first half of the fifteenth century.
- Many poets learned Horatianism from the works of Horace.
