simpleMeaning: how light a thing is when you compare it with other things
scope: This is about how light a thing is when compared with others, not about floating in space where
  nothing pulls a body down.
examples:
- The weightlessness of balsa wood makes it good for making small model planes.
- Its weightlessness surprised her, because the large box was so easy to lift.
