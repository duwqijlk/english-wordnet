simpleMeaning: one of the two outer branches of the paired belly vessel, on each side, running down to
  become the main vessel of the thigh
scope: This is an outer blood vessel low in the belly; not the inner branch on the same side and not the
  thigh vessel it becomes.
examples:
- The external iliac artery runs down toward the thigh.
- On each side, an external iliac artery becomes the femoral artery.
