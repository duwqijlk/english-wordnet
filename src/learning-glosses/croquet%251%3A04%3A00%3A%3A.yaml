simpleMeaning: a game where players hit a wooden ball through a set of hoops, and the winner is the first
  to go through all the hoops and hit a post
scope: This is a game played by hitting a wooden ball through hoops, not golf, where balls are hit into
  holes, and not hockey, where a ball is hit into a goal.
examples:
- We played croquet on the grass in the garden.
- In croquet, you hit the ball through each hoop in turn.
