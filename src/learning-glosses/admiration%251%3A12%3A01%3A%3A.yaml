simpleMeaning: a happy feeling of liking someone or something and thinking they are very good
scope: 'Another name for this sense is esteem: a happy feeling of liking and thinking well of someone;
  it is not the feeling you get from something strange and surprising.'
examples:
- She looked at the painting with great admiration.
- His admiration for his teacher grew each year.
