simpleMeaning: with sticky purplish fruit you can eat, shaped like small tomatoes, this plant lives one
  year and grows in Mexico and the south of the United States
scope: Also called tomatillo, this one-year plant from Mexico and the south of the United States is not
  the yellow-to-purple kind of the same name; it bears sticky purplish fruit you can eat, shaped like
  small tomatoes.
examples:
- The jamberry bore sticky purplish fruit.
- Jamberries looked like small tomatoes.
