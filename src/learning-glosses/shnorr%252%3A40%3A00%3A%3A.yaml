simpleMeaning: to get something by begging for it or by sweet talk, or to try to get it that way
scope: To get something by begging or sweet talk, also called scrounge, cadge and schnorr; not to buy
  it and not to steal it.
examples:
- He is always shnorring cigarettes from his friends.
- She tried to shnorr a free ticket off the man at the door.
