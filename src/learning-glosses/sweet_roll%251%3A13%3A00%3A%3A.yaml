simpleMeaning: With or without raisins, nuts, spices, or a shiny coat, this yeast-raised bun is one of
  many kinds.
scope: A coffee roll is another name for it, a yeast-raised bun that may hold raisins, nuts, spices, or
  a shiny coat.
examples:
- A sweet roll with raisins made a quick breakfast.
- The baker set out sweet rolls with a shiny coat on top.
