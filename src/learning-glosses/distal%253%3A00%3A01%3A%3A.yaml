simpleMeaning: Farthest from the place where an arm, leg, or bone starts or joins the body
scope: The end of a limb or bone farthest from where it joins the body, not the end nearest that join.
examples:
- The distal joint of her finger hurt after the fall.
- The doctor pressed the distal end of the broken bone.
