simpleMeaning: Under green tough skin, this tree of warm America hides a small fruit good to eat, with
  sweet juicy flesh you can see through.
scope: 'Also called genip, ginep, and honey berry: a tree of warm America with a small sweet fruit in
  green tough skin.'
examples:
- The mamoncillo tree bore small green fruit.
- Children sucked the sweet juicy flesh of the mamoncillo.
