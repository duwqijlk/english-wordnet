simpleMeaning: 'a rule about how fast planets move: a line joining a planet and the sun sweeps the same
  flat space in the same time'
scope: A rule about how fast planets move, also called the law of equal areas, not a rule about how far
  planets are from the sun and not a rule about gravity.
examples:
- The law of areas says a planet moves faster when it is near the sun.
- Kepler's law of areas explains why planets speed up and slow down.
