simpleMeaning: Made of, or covered with, small bits that feel like meal in texture
scope: This word for a meal-like, bitty surface is also called gritty, grainy, granular, mealy, coarse-grained
  and farinaceous, and is not smooth or fine.
examples:
- The granulose surface felt rough under her fingers.
- The granulose powder left a mealy residue on the table.
