simpleMeaning: In informal use, odd in a way that stands out.
scope: Also called quirky or offbeat, this is about what is strikingly out of the ordinary, not the use
  for sexual behaviour that shows or appeals to strange tastes.
examples:
- Her taste in clothes was kinky, and no one could guess what she would wear next.
- The lamp in the window was kinky, with a shade shaped like a shoe.
