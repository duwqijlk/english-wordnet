simpleMeaning: any device that starts a thing burning, used to set off a charge that drives something
  forward
scope: A device that starts burning, not the safety device in an electric circuit and not the act of melting
  things together.
examples:
- The fuse lit the rocket's charge.
- A damp fuse would not start the firework.
