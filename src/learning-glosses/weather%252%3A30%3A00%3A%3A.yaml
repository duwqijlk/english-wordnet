simpleMeaning: to change in appearance or condition through exposure to the elements
scope: This is about material changing through exposure to the outdoors; it is not about surviving a difficulty,
  and it is not the noun for atmospheric conditions.
examples:
- The wooden fence had weathered to a pale grey.
- Paint on the seaward side weathers quickly in the salt air.
