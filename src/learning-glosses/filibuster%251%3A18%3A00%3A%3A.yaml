senseId: 'filibuster%1:18:00::'
synsetId: 10107637-n
simpleMeaning: A lawmaker who makes very long speeches to hold up or block a law they are against.
scope: A lawmaker, also called a filibusterer, who makes very long speeches to hold up or block a law
  they are against; not the long speeches themselves used to hold up a law, and not the act of blocking
  a thing by holding it up.
examples:
- The filibuster spoke through the night to stop the bill.
- As a filibuster, they held the floor until the session ended.
