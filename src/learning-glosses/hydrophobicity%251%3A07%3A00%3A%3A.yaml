simpleMeaning: How much a thing pushes water away and keeps it from soaking in
scope: How strongly a thing turns water away, not how much water it takes in and not a thing that likes
  water.
examples:
- The jacket's hydrophobicity kept the rain from soaking through.
- They tested the hydrophobicity of the cloth by pouring water on it.
