simpleMeaning: This lamp burns oil behind a glass tube, with a pierced metal lid so high winds cannot
  blow it out; it may also be a candlestick with the same tube.
scope: Hurricane lamp, storm lamp, storm lantern and tornado lantern are other names for this lamp, which
  keeps its flame safe from high winds.
examples:
- The hurricane lantern stayed lit all night.
- He carried a hurricane lantern into the yard.
