simpleMeaning: having a natural skill that seems to come from your family or from the moment you came
  into the world.
scope: It is not the plain sense of coming into the world at a time or place; it describes a skill that
  seems to be part of a person from the start.
examples:
- She is a born teacher and can explain anything clearly.
- Their daughter is a born performer and loves being on stage.
