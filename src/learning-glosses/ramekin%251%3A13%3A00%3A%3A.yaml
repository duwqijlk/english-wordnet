simpleMeaning: Egg and bread crumbs go into this cheese dish, which is baked and served in its own small
  heat-proof dish.
scope: Also called ramequin, this is the cheese dish baked and served in its own small heat-proof dish,
  not one made for sharing.
examples:
- She baked a ramekin for supper.
- The ramekin came to the table in its own small dish.
