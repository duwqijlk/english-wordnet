simpleMeaning: Tongues of the Kamarupan group, spoken in west Burma, Bangladesh and the far east of India.
scope: Tongues of the Kamarupan group in Burma, Bangladesh and India, not a single tongue or a group of
  tongues from China; also called Chin, Kuki, Kuki-Chin, Kuki-Chin language and Kuki language.
examples:
- The Chin language is spoken in western Burma.
- Old songs were sung in the Chin language.
