senseId: debatable%5:00:00:controversial:00
synsetId: 00604761-s
simpleMeaning: able to be argued about because people may not agree on it
scope: This is a point people can argue for and against and do not agree on. It is not just a point that
  is open to doubt.
examples:
- Whether homework helps children learn is a debatable question.
- It is debatable whether the new law will make roads safer.
