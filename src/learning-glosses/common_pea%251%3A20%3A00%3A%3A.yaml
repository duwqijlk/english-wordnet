simpleMeaning: a plant that grows round green seeds people most often eat fresh, not dried
scope: This is a plant that grows round green seeds most often eaten fresh; garden pea and garden pea
  plant are other names for this sense, not a plant whose seeds are eaten dried.
examples:
- She shelled the common peas and ate them raw.
- The common pea in the garden gives fresh seeds each summer.
