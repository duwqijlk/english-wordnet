simpleMeaning: something that makes things harder for a person and holds the person back
scope: Also called an albatross, this is something that holds a person back, not the real heavy stone
  used to grind grain.
examples:
- The old debt was a millstone around his neck.
- Caring for the empty building became a millstone for the small charity.
