senseId: 'thalassemia_major%1:26:00::'
synsetId: 14219421-n
simpleMeaning: a fatal illness a child gets from both parents, with no hemoglobin in the blood; the bones
  are misshapen, and the heart, spleen, and liver are swollen
scope: 'Also called thalassaemia major: a fatal blood illness passed down from both parents, not a mild
  blood problem and not an illness caught from germs.'
examples:
- Thalassemia major is fatal without care, as the blood has no hemoglobin.
- The doctor found thalassemia major when the baby's liver and spleen were swollen.
