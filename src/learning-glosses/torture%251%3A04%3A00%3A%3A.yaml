simpleMeaning: the act of hurting a person on purpose, in body or mind, to make them give up what they
  know or admit to something, or for any other reason
scope: The act of hurting a person on purpose to get what they know or a confession, not the pain itself
  and not the act of tormenting someone in mind only.
examples:
- The prisoner feared torture during the war.
- Torture was used to force a confession.
