simpleMeaning: a fig tree of India that grows very big and lives long; it has no roots growing down from
  its branches as the banyan does, and Buddhists hold it holy
scope: 'Also called bo tree, pipal, pipal tree, pipul, and sacred fig: a great fig tree of India held
  holy by Buddhists, not a banyan and not an ordinary fig tree.'
examples:
- The old peepul has stood by the temple for hundreds of years.
- Buddhists hold the peepul holy.
