simpleMeaning: a building where the people of one town or area can meet for social or cultural activities
scope: A meeting place for the people of one town or area, not a hall hired for one private party and
  not a club that only members may use.
examples:
- The community center runs classes for children after school.
- We met at the community center to plan the street party.
