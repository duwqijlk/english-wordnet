simpleMeaning: suffering from a serious illness of the mind, so the mind does not work in a normal way
scope: 'Also called sick, crazy, and mad: having a serious illness of the mind. It is not feeling worried
  and unhappy, and not finding it hard to get on well with other people.'
examples:
- The disturbed man believed that voices were telling him what to do.
- She was so disturbed in her mind that she could not think clearly or look after herself.
