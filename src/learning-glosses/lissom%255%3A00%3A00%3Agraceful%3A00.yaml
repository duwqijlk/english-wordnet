simpleMeaning: A slim shape that bends and moves with ease looks graceful
scope: 'Also called lissome, lithe, lithesome, sinuous and supple: slim and graceful, bending and moving
  with ease, not stiff and heavy and not thick-set.'
examples:
- The lissom dancer bent and turned with ease.
- Her lissom figure moved with grace across the stage.
