simpleMeaning: to make a shape by pouring hot liquid, such as wax or melted metal, into a hollow form
  and letting it set
scope: 'Also called cast: to make a shape by pouring hot liquid into a hollow form, not shaping clay by
  hand and not the fungus or the container.'
examples:
- They molded the hot metal into a bell.
- He molded candles from beeswax.
