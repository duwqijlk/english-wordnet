simpleMeaning: In law, about the rights people hold and the duties they owe, not about the rules that
  bring those rights and duties into being.
scope: Also called essential, in law about the rights people hold and the duties they owe, not about the
  rules that bring them into being.
examples:
- The reform was substantive, setting out new duties for employers.
- That part of the law is substantive, not about how rights are set up.
