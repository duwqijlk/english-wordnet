senseId: 'panentheism%1:09:00::'
synsetId: 06234997-n
simpleMeaning: the belief that God is in part of the world and all that happens in it, yet is also beyond
  the world and acts in it
scope: The belief that God is in part of the world and all that happens in it, yet is also beyond the
  world and acts in it; not the belief that God is only in the world and not the belief that God never
  acts in the world.
examples:
- Panentheism holds that God is both in the world and beyond it.
- She believed in panentheism, seeing God in all things and beyond them.
