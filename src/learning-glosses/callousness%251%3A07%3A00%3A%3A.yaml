simpleMeaning: the quality of having no feeling for other people and of being hard and without care toward
  them
scope: Also called hardness and insensibility. It is having no feeling for others, not the hardness of
  a thing you can touch.
examples:
- His callousness shocked everyone when he laughed at their pain.
- She showed great callousness by walking past the crying child.
