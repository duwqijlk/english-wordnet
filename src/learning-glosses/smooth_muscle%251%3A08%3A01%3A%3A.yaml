simpleMeaning: Seen through a strong lens it shows no stripes, and it is body tissue in thin flat layers
scope: Under a lens it shows no stripes, unlike the kind in the walls of the gut that works without thought.
examples:
- Under the microscope, the smooth muscle showed no stripes.
- The smooth muscle in the sample lay in thin sheets.
