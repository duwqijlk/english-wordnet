simpleMeaning: describing an event at which people are expected to wear formal clothes.
scope: This describes an event that calls for formal clothes, not the clothes themselves.
examples:
- The annual dinner is a dress occasion, so guests wear suits.
- The invitation made it clear that the evening was a dress occasion.
