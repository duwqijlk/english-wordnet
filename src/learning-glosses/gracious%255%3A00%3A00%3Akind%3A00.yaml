simpleMeaning: kind and warmly polite, especially as a king is to his people
scope: Kind and warmly polite, especially as a king is to his people; not charm and good taste alone,
  not mere politeness, and not a wish to give favors.
examples:
- The gracious king welcomed the poor farmers to his hall.
- She gave a gracious reply to the nervous visitor.
