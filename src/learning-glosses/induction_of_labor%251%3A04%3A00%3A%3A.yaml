simpleMeaning: In childbirth care, a doctor starts birth on purpose by breaking the bag of water round
  the baby or by giving oxytocin, a drug that makes the womb squeeze.
scope: Starting birth on purpose with a drug or by breaking the water bag, not birth that starts on its
  own.
examples:
- The doctor ordered an induction of labor because the baby was late.
- The midwife explained the induction of labor to the mother before it began.
