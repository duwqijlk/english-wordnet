simpleMeaning: to cause a person to be taken in and kept at an institution such as a hospital, prison
  or care home
scope: This is about placing a person in an institution, not about posting a letter or passing on a message.
examples:
- The court sent him to a secure mental hospital for treatment.
- Social services sent the boy to a residential school for children with special needs.
