senseId: 'angina_pectoris%1:26:00::'
synsetId: 14131521-n
simpleMeaning: A heart trouble that brings sudden attacks of pain in the chest when the heart gets too
  little oxygen
scope: A heart trouble with sudden attacks of chest pain when the heart lacks oxygen; angina is another
  name for this sense, not a lasting heart attack and not chest pain from the lungs.
examples:
- He felt angina pectoris after climbing the stairs.
- Angina pectoris often strikes during hard work or strong feeling.
