simpleMeaning: Describing a spoken sound or syllable that takes comparatively more time to say.
scope: This is about how much time a spoken sound takes, not a great length in space, not a great amount
  of time in general, not being tall, and not having a good memory.
examples:
- The vowel sound in 'beat' is long, but the one in 'bit' is short.
- In this poem, each long syllable counts as two beats.
