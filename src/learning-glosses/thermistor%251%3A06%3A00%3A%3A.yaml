senseId: 'thermistor%1:06:00::'
synsetId: 04427341-n
simpleMeaning: Made of stuff that only partly lets power through, this part holds back more or less power
  with the heat, and so steadies the other parts of the circuit.
scope: A small part whose hold on power shifts with heat, also called thermal resistor; it steadies other
  parts in a set of wires.
examples:
- The thermistor steadied the set of wires as the heat rose.
- When the heat rose, the thermistor held back more power.
