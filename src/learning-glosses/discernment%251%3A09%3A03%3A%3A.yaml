senseId: 'discernment%1:09:03::'
synsetId: 05757616-n
simpleMeaning: the power to judge in a fine, careful way, especially to tell what is good and beautiful
  in art
scope: 'Also called taste, appreciation, and perceptiveness: careful judging, especially of beauty and
  art, not judging wisely about life in general.'
examples:
- She showed discernment in choosing paintings for the show.
- His discernment helped him pick poems of real beauty.
