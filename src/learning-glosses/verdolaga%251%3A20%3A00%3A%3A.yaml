simpleMeaning: Cultivated, trailing, mat-forming weed with bright yellow blossoms; its edible, mildly
  sour leaves are eaten raw or cooked, especially in Indian, Greek and Middle Eastern cooking; it occurs
  worldwide.
scope: The Spanish name for this same edible weed, not a separate species and not a cooked dish.
examples:
- Verdolaga grows easily in hot, dry ground.
- The market stall sold bunches of verdolaga.
