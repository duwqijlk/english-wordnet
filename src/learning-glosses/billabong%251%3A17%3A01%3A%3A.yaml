simpleMeaning: a still pool of water in the bed of a stream that flows only at times
scope: A still pool in the bed of a stream that flows only at times, not a lake and not a running stream.
examples:
- Cattle drank from the billabong in the dry season.
- After the rains, the billabong joined the river again.
