simpleMeaning: doing tricks in the air while falling freely, before pulling a cord to open a parachute
scope: This is doing tricks while falling freely before a parachute opens, not just falling with a parachute
  open and not a jump where you do no tricks in the air.
examples:
- She went skydiving and did turns in the air before her parachute opened.
- Skydiving is hard because you must do moves while you fall and still open your parachute in time.
