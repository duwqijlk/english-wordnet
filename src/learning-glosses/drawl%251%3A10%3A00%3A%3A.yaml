simpleMeaning: a slow way of speaking, in which the sounds of words are held for a long time
scope: A slow way of speaking with sounds held long, not a fast way of talking and not a soft voice.
examples:
- He spoke in a slow drawl, stretching out every word.
- Her Southern drawl made each sentence last a little longer.
