simpleMeaning: A person who looks after accounts and files and keeps them in order
scope: A person who looks after accounts and files and keeps them in order, also called a recorder; not
  a person who makes such things and not a person who throws them away.
examples:
- The record-keeper filed the old letters by date.
- Our record-keeper keeps every bill and receipt in order.
