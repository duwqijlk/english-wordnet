simpleMeaning: An organ in the upper belly grows too big, and the blood loses some of its cell types;
  it goes with many illnesses
scope: A state in which an organ in the belly grows too big and the blood loses some of its cell types,
  seen with many illnesses; not a swollen liver and not a blood shortage alone.
examples:
- The doctor found hypersplenism when she felt his swollen belly.
- Hypersplenism left her with too few blood cells of one kind.
