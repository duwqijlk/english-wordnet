senseId: 'twist%2:35:02::'
synsetId: 01282617-v
simpleMeaning: To bend an object or give it an angular shape.
scope: This means bending an object out of shape, not pulling it violently to remove it, and not the act
  of winding; turn and bend are other names for this sense.
examples:
- She twisted the wire into a small heart.
- He twisted the dough into a long braid.
