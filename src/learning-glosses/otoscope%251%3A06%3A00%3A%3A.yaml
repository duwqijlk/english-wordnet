simpleMeaning: A sick-room tool of a big-making lens and a light, used to look into the outer ear, the
  ear hole and especially the ear drum.
scope: This sense is also called auriscope and auroscope, for a sick-room tool of a big-making lens and
  a light, used to look into the outer ear, the ear hole and especially the ear drum.
examples:
- Otoscopes look into the ear.
- An otoscope lights the ear drum.
