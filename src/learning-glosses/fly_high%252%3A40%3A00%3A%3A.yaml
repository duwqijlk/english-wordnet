simpleMeaning: to keep doing better and better, or to be at the top of your work, or to become very important
  in history
scope: 'Also called thrive, flourish, and prosper: to do well and reach a top point, not to stay at a
  low point and not to fail.'
examples:
- After years of hard work, she began to fly high in her field.
- The young writer is flying high with his new book.
