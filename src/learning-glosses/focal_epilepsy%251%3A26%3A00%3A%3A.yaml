simpleMeaning: fits that start with a small upset in one part of the brain, such as a twitch in a limb,
  a false feeling, or a troubled mind
scope: Fits that start with a small upset in one part of the brain, also called cortical epilepsy, not
  fits that shake the whole body at once.
examples:
- Her focal epilepsy began with a twitch in one hand.
- The doctor said his focal epilepsy started in one part of the brain.
