simpleMeaning: sailors wore these trousers, whose legs widen from the knee down to very wide hems; the
  very wide hem was the fashion of the 1960s
scope: Also called bell-bottoms and bellbottom pants; wide-legged trousers, not ordinary straight trousers
  and not a skirt.
examples:
- Bellbottom trousers flared out at the ankle.
- The old sailor still kept his bellbottom trousers.
