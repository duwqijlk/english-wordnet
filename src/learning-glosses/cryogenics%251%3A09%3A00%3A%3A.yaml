simpleMeaning: The part of physics that studies what happens at very low temperatures
scope: The part of physics that studies what happens at very low temperatures, also called cryogeny; not
  the study of heat and not the study of gases alone.
examples:
- Cryogenics lets scientists store living cells at very low temperatures.
- She studied cryogenics to learn how matter acts in extreme cold.
