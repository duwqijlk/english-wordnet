simpleMeaning: A part joined so it can swing, that drops into a cut in a toothed wheel to push it on or
  keep it from turning back
scope: A swinging part that drops into a cut in a toothed wheel; also called dog, click and pawl, not
  the wheel itself and not a lock.
examples:
- The detent clicked into place and held the wheel still.
- A worn detent let the wheel slip back.
