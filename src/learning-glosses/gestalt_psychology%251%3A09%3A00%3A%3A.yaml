simpleMeaning: a theory of the mind that stresses how the whole shape of a thing matters, more than its
  parts
scope: 'Also called configurationism: a theory of the mind that stresses how the whole shape of a thing
  matters, more than its parts, not a theory that looks only at single parts.'
examples:
- Gestalt psychology changed how we think about seeing shapes.
- In Gestalt psychology, the whole pattern counts for more than its parts.
