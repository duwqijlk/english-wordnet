simpleMeaning: a whip made of nine cords, each one knotted
scope: This is the knotted whip itself, not the animal called a cat, not the tracked machine used for
  moving earth, and not the act of beating someone with it.
examples:
- The sailor was punished with a cat made of nine knotted cords.
- In the old navy, the cat was a feared instrument of punishment.
