simpleMeaning: a monkey or ape of Africa, Arabia or Asia, with a tail that cannot grip and nostrils set
  close together
scope: An Old World monkey or ape, not a New World monkey with a gripping tail and not a tailless ape.
examples:
- The catarrhine's nostrils sit close together.
- A catarrhine swung through the trees of the African forest.
