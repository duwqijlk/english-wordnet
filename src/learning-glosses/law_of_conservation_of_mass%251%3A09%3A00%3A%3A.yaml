simpleMeaning: In classical physics, a basic rule that stuff cannot be made or destroyed in a system with
  nothing going in or out
scope: A basic rule of classical physics that matter cannot be made or destroyed in a system with nothing
  going in or out, also called conservation of mass, conservation of matter or the law of conservation
  of matter, not a rule about energy and not a rule about motion.
examples:
- The law of conservation of mass says matter cannot be made or destroyed.
- 'In the closed jar, the law of conservation of mass held: nothing was lost.'
