simpleMeaning: Made in the kidney, this stuff breaks down protein and turns one blood stuff into another,
  starting the breaking down of clots in the blood.
scope: Urokinase is another name for this stuff made in the kidney, which starts the breaking down of
  clots in the blood, not one that makes clots.
examples:
- A plasminogen activator was added to the blood to break down the clot.
- The blood had plasminogen activator added to it to start the breaking down of the clot.
