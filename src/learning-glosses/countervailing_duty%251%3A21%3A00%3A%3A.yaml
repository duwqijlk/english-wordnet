senseId: 'countervailing_duty%1:21:00::'
synsetId: 13339046-n
simpleMeaning: a tax put on goods to balance money given by other countries' governments to their own
  makers
scope: This is a tax put on goods to balance help given by other countries' governments to their own makers,
  not a tax that pays for a country's own costs and not a fine.
examples:
- The countervailing duty raised the price of the cheap steel.
- To balance the help given by foreign governments, the country put a countervailing duty on the goods.
