simpleMeaning: Found in the areas that lie toward the top of the globe.
scope: This describes where something lies on the globe, not a direction it faces and not the direction
  a wind blows from.
examples:
- She spent the summer in northern Norway.
- The northern half of the island is quieter and wilder.
