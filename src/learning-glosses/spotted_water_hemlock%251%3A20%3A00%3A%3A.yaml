simpleMeaning: A tall water hemlock from northeastern North America that lives two years, with purple-streaked
  stems and clusters of very poisonous roots shaped like small sweet potatoes.
scope: Another name for spotted cowbane and spotted hemlock; the tall, two-year water hemlock of northeastern
  North America, not the different plant called poison hemlock.
examples:
- Spotted water hemlock grows along the banks of slow streams.
- Foragers are warned never to pick spotted water hemlock by mistake.
