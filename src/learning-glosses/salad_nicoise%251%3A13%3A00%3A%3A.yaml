simpleMeaning: Red fruit and small salty fish, most often, with black olives and small pickled buds on
  top, make up this dish.
scope: Among mixed dishes, this one is known for its red fruit, small salty fish, black olives, and small
  pickled buds.
examples:
- The salad nicoise came with black olives and capers on top.
- They served a salad nicoise with tomatoes and anchovies.
