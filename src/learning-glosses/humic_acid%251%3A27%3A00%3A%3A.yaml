simpleMeaning: Only when its pH, a measure of sourness, is above 2 does this dark brown stuff from rotted
  matter dissolve in water
scope: A dark brown part of rotted matter that dissolves in water only when the pH is above 2, not the
  rotted matter itself and not other chemicals in soil.
examples:
- Humic acid stays solid in very sour water but dissolves when the pH rises above 2.
- The half-life of humic acid is measured in centuries.
