simpleMeaning: To stop pain in one small place, this mix of two chemicals, methyl and ethyl chloride,
  is sprayed on the skin.
scope: This is a spray that numbs one small place on the skin, made from a mix of two chemicals.
examples:
- Anesthyl numbed the skin where the cut was.
- The anesthyl spray stopped the pain in one small place.
