simpleMeaning: The curved bone under the eye that makes the cheek stand out
scope: The curved bone under the eye that makes the cheek stand out, not the jaw bone and not the bone
  of the nose; cheekbone, jugal bone, malar bone and os zygomaticum are other names for this sense.
examples:
- The malar forms the high point of her cheek.
- He broke his malar in the fall.
