simpleMeaning: pots and dishes made from the red-brown clay found on the island of Lemnos, in the Aegean
  Sea
scope: Pots and dishes made from the red-brown clay of Lemnos, not the brownish orange colour called terra
  cotta, and not other earthenware.
examples:
- The museum held a bowl of terra sigillata.
- Terra sigillata was made from the clay of Lemnos.
