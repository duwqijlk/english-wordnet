simpleMeaning: The groups of all France met as one body, and its last meeting was in seventeen eighty-nine.
scope: A meeting of the groups of all France, not a meeting of one part of France and not a modern law-making
  body.
examples:
- The Estates General met for the last time in 1789.
- King Louis called the Estates General to meet.
