simpleMeaning: a warning sound from a car, made by its driver
scope: This is the warning sound itself that a driver makes. It is not the car part that makes the sound
  and not the hard growth on an animal's head.
examples:
- A loud horn warned us that a car was coming.
- The sound of a horn told the walkers to move out of the way.
