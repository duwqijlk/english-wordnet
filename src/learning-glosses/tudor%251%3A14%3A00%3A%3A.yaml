simpleMeaning: An English ruling house begun by Henry, whose kings and queens held the throne from Henry
  VII to Elizabeth I, 1485 to 1603.
scope: This is the English ruling house from Henry VII to Elizabeth I, also called the House of Tudor,
  not a later ruling house or a style of building.
examples:
- The Tudor kings ruled England from 1485 to 1603.
- Elizabeth I was the last Tudor monarch.
