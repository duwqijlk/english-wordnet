simpleMeaning: A dull yellow-brown flying animal with big ears that lives in holes in rock.
scope: A dull yellow-brown flying animal with big ears that lives in holes in rock, not a bright-coloured
  bat of the trees and not a small mouse; pallid bat is another name for this sense.
examples:
- A cave bat hung upside down in the dark cave.
- We saw a cave bat fly out of the cave at dusk.
