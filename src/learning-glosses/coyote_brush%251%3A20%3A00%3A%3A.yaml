simpleMeaning: Flower heads in leafy branching clusters crown a bush that stays green all year and spreads
  wide in the southwest of the United States.
scope: Also called chaparral broom, coyote bush and kidney wort; it is a bush that stays green all year,
  not a brush for sweeping.
examples:
- Coyote brush stays green all year.
- The coyote brush bears flower heads in leafy clusters.
