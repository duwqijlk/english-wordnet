simpleMeaning: a frame made of strips of wood or metal that form a pattern made to look good
scope: 'Also called lattice and fretwork: a frame of strips of wood or metal that makes a pattern, not
  a solid wall and not a plain frame with no pattern.'
examples:
- The garden fence was made of white latticework.
- Sun came through the latticework on the porch.
