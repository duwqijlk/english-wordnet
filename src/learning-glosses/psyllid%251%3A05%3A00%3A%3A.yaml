simpleMeaning: A tiny bug with legs made for leaping drinks plant juices, and looks much like a small
  cicada.
scope: It is also called jumping plant louse and psylla, and it is a tiny bug that sucks the juices of
  plants, like a cicada but not one.
examples:
- The psyllid jumped from one leaf to the next.
- The psyllids drink the juices of the plants they live on.
