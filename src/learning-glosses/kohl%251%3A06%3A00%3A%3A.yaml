simpleMeaning: a make-up that women in Egypt and Arabia put on the edges of their eyelids to make those
  edges darker
scope: This is a dark make-up for the edges of the eyelids, used by women in Egypt and Arabia. It is not
  make-up for the lashes and not color put on the whole lid.
examples:
- She drew a thin line of kohl along the edges of her eyelids.
- The women put on kohl before the wedding.
