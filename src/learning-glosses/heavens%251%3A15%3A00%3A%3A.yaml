simpleMeaning: the surface the sky seems to have, like the inside of a ball, with sun, moon, stars, planets
  and other things in space seeming to lie on it
scope: Also called sphere. This is the sky seen as the inside surface of a ball around the earth, not
  the open air or the weather above us.
examples:
- The stars moved slowly across the heavens.
- He looked up at the heavens on a clear night.
