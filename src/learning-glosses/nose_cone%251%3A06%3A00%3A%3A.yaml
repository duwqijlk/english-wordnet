simpleMeaning: As it flies through the air around the earth, the load a missile or rocket carries is shielded
  from heat by its pointed front part.
scope: Ogive is another name for this pointed front part of a missile or rocket, which shields the load
  it carries from heat.
examples:
- The nose cone shields the load from heat as the rocket flies.
- A nose cone protects the load inside the rocket from heat.
