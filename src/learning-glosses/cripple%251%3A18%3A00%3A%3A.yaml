simpleMeaning: a person who cannot walk in the normal way because their legs or back are hurt or do not
  work well
scope: A person who cannot walk in the normal way because of hurt legs or back; not the verb sense meaning
  to make something weak or useless.
examples:
- The old cripple moved slowly with the help of two sticks.
- After the accident, he lived as a cripple and used a chair with wheels.
