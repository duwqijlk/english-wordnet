simpleMeaning: Only the thin glassy skin left by the last step is taken off, with a rough stone or tape,
  and the work ends smooth and true to shape.
scope: 'Also called microfinishing machine and microhoning machine: a machine tool that takes off only
  the thin glassy skin left by the last step.'
examples:
- The superfinishing machine took off the thin skin left by the last step.
- The superfinishing machine left the metal part smooth and true to shape.
