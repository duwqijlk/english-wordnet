simpleMeaning: A heavy bird with small wings from South America, hunted for food or sport, that looks
  like a chicken but is related to birds that cannot fly
scope: 'Also called tinamou: this South American bird, not the bird hunted in the eastern United States
  and Canada and not the meat of quail or grouse.'
examples:
- We saw a partridge with a heavy body and small wings near the river in Brazil.
- The partridge ran across the grass in South America and hid in the bushes.
