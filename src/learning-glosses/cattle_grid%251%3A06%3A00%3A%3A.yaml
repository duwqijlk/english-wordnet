simpleMeaning: A set of side-by-side metal bars laid over a ditch, so that people on foot and cars can
  cross while farm animals cannot.
scope: This set of bars is also called cattle guard.
examples:
- The cattle grid let the car cross while the cows stayed in the field.
- We walked over the cattle grid and left the sheep behind us.
