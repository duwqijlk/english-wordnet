simpleMeaning: A guide book that tells the habits of one group, most of all the fixed rites of a house
  of monks or nuns
scope: A guide book telling the habits of one group, also called a consuetudinal, not a book of laws and
  not a history of the group.
examples:
- The consuetudinary described the monks' morning rites.
- Each house kept its own consuetudinary.
