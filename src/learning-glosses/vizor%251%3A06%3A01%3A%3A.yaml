simpleMeaning: a plate of hard metal with slits to see through, fixed or hinged to a helmet of the Middle
  Ages to guard the face
scope: A plate of hard metal with slits to see through, also called visor; not a modern face mask and
  not the helmet itself.
examples:
- The knight lowered his vizor before the fight.
- The vizor of the old helmet still moves on its hinge.
