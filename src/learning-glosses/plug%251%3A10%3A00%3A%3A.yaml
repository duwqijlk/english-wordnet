simpleMeaning: very open and showy praise or advertising for something, made to get many people's attention
scope: Open, showy praise for something; this is not the water post for fires, and not a thing used to
  fill a hole.
examples:
- The singer gave her new song a plug on the radio show.
- His book got a plug in the morning paper.
