simpleMeaning: a state of not knowing, especially about the accepted beliefs of a religion
scope: 'Also called unknowingness: a lack of knowledge, especially about accepted religious beliefs, not
  doing something without knowing it.'
examples:
- In his unknowing, he had never heard the accepted teachings of the faith.
- Her unknowing about the basic beliefs of her religion surprised her teacher.
