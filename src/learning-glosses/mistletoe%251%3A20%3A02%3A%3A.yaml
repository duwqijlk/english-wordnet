simpleMeaning: Plants in America that look very much like the plant with the same name from Europe, Asia
  and Africa
scope: Plants in America that look very much like the plant with the same name from Europe, Asia and Africa,
  not that plant itself, which lives on other trees and is used at Christmas, and not the bush from the
  middle and south-east of Europe.
examples:
- The teacher showed us pictures of American mistletoe and of the Old World kind side by side.
- American mistletoe looks very much like the plant of the same name from the Old World.
