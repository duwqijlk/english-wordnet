simpleMeaning: To tie a boat fast to a bitt, a pin, or a cleat, all things made for tying ropes to.
scope: To tie a boat fast to a bitt, a pin, or a cleat, all things made for tying ropes to; not a thing
  a climber's rope can be tied to, and not to wind a rope round a thing or a person to make it or them
  safe.
examples:
- They belayed the boat to the cleat before going ashore.
- They belayed the little boat and stepped onto the jetty.
