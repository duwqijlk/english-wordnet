simpleMeaning: to tremble or move quickly and powerfully back and forth
scope: This is rapid, forceful trembling, not the signal made by moving a head or fist and not the hand-clasping
  greeting.
examples:
- The old engine shook violently before it finally started.
- The windows shook as the train rumbled past.
