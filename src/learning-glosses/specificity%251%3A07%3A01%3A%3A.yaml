simpleMeaning: the quality of being clear and exact rather than broad and general
scope: This is about being clear and exact in a general way, not the sense that means something acts only
  on one kind of living thing.
examples:
- The specificity of her answer helped us understand exactly what she meant.
- He added specificity to the plan by naming dates and places.
