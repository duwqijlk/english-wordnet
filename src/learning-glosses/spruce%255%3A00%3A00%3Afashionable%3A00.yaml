simpleMeaning: neat and smart in dress and in the way a person acts, and following the newest style
scope: 'Also called dashing, jaunty, snappy, rakish, dapper, natty, raffish and spiffy: neat and smart
  in dress and in the way a person acts, not a tree and not its wood.'
examples:
- He looked spruce in his new suit and clean shoes.
- A spruce young man walked in, well dressed and polite.
