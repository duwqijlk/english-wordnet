simpleMeaning: work for a performer or a group of performers that lasts only for a limited time
scope: Also called an engagement, this is work for performers for a limited time, not the act of saving
  a seat, a room, or a place on a trip for someone.
examples:
- The band got a booking to play at the theatre for two weeks.
- Her summer booking with the dance group ends in August.
