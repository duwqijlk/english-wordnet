simpleMeaning: Soft joining tissue that wraps round single nerve threads inside a nerve
scope: This is soft joining tissue that wraps round single nerve threads inside a nerve, not the nerve
  thread itself and not the hard outer coat of a nerve.
examples:
- The endoneurium wraps round single nerve threads.
- Injury to the endoneurium can harm the nerve threads inside.
