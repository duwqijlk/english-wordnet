simpleMeaning: A very poisonous chemical used to cut lines into metal plates and into the boards that
  carry electric paths.
scope: A very poisonous chemical used to cut lines into metal plates and circuit boards, not a metal itself
  and not a cleaner.
examples:
- The worker used iron perchloride to etch the metal plate.
- Iron perchloride can burn skin, so gloves are worn when it is used.
