simpleMeaning: to split a pack of cards by chance into two piles so that choosing particular cards is
  harder
scope: This is the card player's move, not a way of shortening something or removing unwanted items.
examples:
- The dealer cut the deck, then handed the cards to the player on her left.
- Before dealing, he always cuts the pack twice to show there is no trickery.
