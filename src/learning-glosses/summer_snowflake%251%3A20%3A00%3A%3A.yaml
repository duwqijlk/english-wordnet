simpleMeaning: In the east of the United States this common Old World plant now grows wild, with grasslike
  leaves and bunches of white starlike blooms marked with green lines.
scope: Starflower and sleepy dick are other names for this common Old World plant, now growing wild in
  the east of the United States, with grasslike leaves and bunches of white starlike blooms.
examples:
- The summer snowflake grows wild in the east of the United States.
- The summer snowflake bears white starlike blooms marked with green lines.
