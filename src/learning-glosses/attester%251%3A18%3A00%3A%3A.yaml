simpleMeaning: a person who backs up a claim that something is true or real
scope: 'Also called attestant: a person who says something is true or real, not a person who signs a paper
  to show it is real.'
examples:
- The attester told the judge the papers were true.
- The attester spoke up to say the story was true.
