simpleMeaning: Anglers use this land worm as bait; it digs into soil and lets air in, and often comes
  up when the ground is cool or wet.
scope: Another name for earthworm, crawler, wiggler, nightcrawler, nightwalker, angleworm, dew worm, fishing
  worm, and red worm, this is a land worm used as bait, not a sea worm and not a worm that lives in wood.
examples:
- She threaded a fishworm onto the hook.
- Fishworms wriggled in the damp soil of the garden.
