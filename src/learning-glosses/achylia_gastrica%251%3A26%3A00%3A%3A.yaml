simpleMeaning: the lack of some or all of the juices in the stomach
scope: Another name for this sense is achylia; it is a lack of some or all of the stomach juices, not
  a lack of acid alone and not an illness of the stomach.
examples:
- The doctor found that achylia gastrica left his stomach with too little juice to break down food.
- With achylia gastrica, her stomach made no juices at all after meals.
