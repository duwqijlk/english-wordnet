simpleMeaning: To trim rough-cut wood to a standard thickness and width.
scope: To cut timber to a standard size, not to put a finish on it or to put clothes on someone.
examples:
- The carpenter dressed the planks before fitting them.
- Machines dress the timber to a uniform width.
