simpleMeaning: With the back bent over and the shoulders hanging forward, so the body stays bent and never
  straightens up.
scope: With the back curved and shoulders dropped, also called crooked and hunched, not standing straight.
examples:
- The stooped old man walked slowly down the lane.
- She was stooped with age and leaned on a stick.
