simpleMeaning: A storm of thunder, lightning, and heavy rain or hail comes after strong streams of rising
  air.
scope: A thunderstorm and an electric storm are other names for this storm, with heavy rain or hail, thunder,
  and lightning, that comes when air rises in strong streams.
examples:
- The electrical storm lit up the whole sky.
- An electrical storm kept the planes on the ground all evening.
