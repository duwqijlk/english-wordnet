simpleMeaning: One of the four picture cards in a deck, the one with a woman's image.
scope: This is the playing card with a woman's picture, not the most powerful chess piece, not a female
  ruler, and not the leading female competitor.
examples:
- He laid the queen of hearts on the table and won the trick.
- She drew a queen, then smiled and raised the bet.
