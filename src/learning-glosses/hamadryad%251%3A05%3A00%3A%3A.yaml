simpleMeaning: The largest snake with a deadly bite, this large cobra of south-east Asia and the East
  Indies is sometimes put in the group Naja.
scope: Also called king cobra, it is the largest venomous snake, a large cobra of south-east Asia and
  the East Indies.
examples:
- A hamadryad raised its head in the tall grass.
- The hamadryad is the largest venomous snake in Asia.
