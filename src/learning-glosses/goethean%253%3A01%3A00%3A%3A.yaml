simpleMeaning: Said of things that belong to Goethe or are done in the way he did them.
scope: Also called Goethian; said of things of Goethe or in his manner, not of things of another writer
  and not of the German tongue.
examples:
- Her Goethean view of nature shaped the whole poem.
- The scholar wrote in a Goethean style, full of calm reason.
