simpleMeaning: a cheerful, light activity done for fun, not for a serious purpose
scope: 'Also called play, romp, frolic and gambol: a cheerful activity done for fun, not the small pickled
  bud used in food, not a silly trick, and not a playful jump.'
examples:
- The children's caper in the garden was just fun and games.
- What began as a caper at the beach soon had everyone laughing.
