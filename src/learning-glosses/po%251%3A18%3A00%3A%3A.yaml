simpleMeaning: An officer without a commission in the Navy or Coast Guard, with a rank like a sergeant
  in the Army.
scope: A Navy or Coast Guard rank, not the post office and not an Army sergeant; also called a petty officer
  and P.O.
examples:
- The PO gave the order to the sailors.
- After two years, he was made a PO.
