senseId: 'theoretically%4:02:01::'
synsetId: 00171499-r
simpleMeaning: in a way that uses ideas about how things work, not by trying them out in real life
scope: This says how a person works or thinks, using ideas rather than real trials; it is not the sense
  that means something is true if we take some facts as given.
examples:
- He worked out the problem theoretically, with notes and numbers, before he built anything.
- She solved the puzzle theoretically, on paper, without touching the real machine.
