simpleMeaning: Filled with brightness, or sending out brightness of its own.
scope: This is not the noun naming a shining quality or a well-lit condition; it is the adjective that
  describes a room, sky or object as bright or glowing.
examples:
- The room is light and airy now that the heavy curtains are gone.
- At six in the morning the sky was already light.
