simpleMeaning: a mark drawn on a map that joins places of the same height
scope: A mark on a map joining places of the same height, also called contour; not a road and not a border.
examples:
- The contour line showed that the hill rose steeply.
- Follow the contour lines on the map to find the flat ground.
