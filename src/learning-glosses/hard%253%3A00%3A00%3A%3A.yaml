simpleMeaning: A speech sound made without the vocal cords vibrating.
scope: This concerns the lack of vocal-cord vibration, not where the back of the tongue is raised.
examples:
- The hard /p/ in 'pin' is made without vocal-cord vibration.
- The /t/ at the start of 'top' has no vocal-cord vibration.
