simpleMeaning: the shape of a moving rise and fall, drawn as a line on a graph that plots its size against
  time
scope: 'Also called waveform and wave shape: the drawn shape of a rise and fall over time, not a sea wave
  itself and not a sound on its own.'
examples:
- The wave form on the screen showed a smooth rise and fall.
- He studied the wave form to see how the signal changed over time.
