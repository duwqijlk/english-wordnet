simpleMeaning: A grey metal that joins with four other atoms and acts like zirconium with other chemicals,
  found in zirconium minerals and used in filaments because it gives off electrons easily.
scope: Also called atomic number 72 and hafnium; a grey metal like zirconium, not zirconium itself.
examples:
- Hf is used in filaments.
- The sample contained Hf.
