senseId: 'intoxication%1:12:00::'
synsetId: 07544195-n
simpleMeaning: a feeling of great joy and excitement that is too strong for a person to stay calm and
  think clearly
scope: This is a strong happy feeling that makes calm thought hard; it is not being drunk on alcohol and
  not being harmed by poison.
examples:
- The intoxication of winning filled the whole team.
- He felt a kind of intoxication from his new wealth and power.
