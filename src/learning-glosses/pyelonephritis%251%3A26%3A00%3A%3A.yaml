senseId: 'pyelonephritis%1:26:00::'
synsetId: 14589889-n
simpleMeaning: A sore swelling of the kidney and the part where urine collects, caused by germs that make
  a person ill
scope: A sore swelling of the kidney caused by germs, not a sore bladder and not a stone in the kidney.
examples:
- The germs had spread to her kidney, and the doctor said it was pyelonephritis.
- He had pyelonephritis, with a sore swollen kidney and a high fever.
