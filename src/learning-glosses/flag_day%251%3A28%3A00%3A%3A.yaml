simpleMeaning: A time to remember the year seventeen seventy-seven, when the United States took up the
  sign that stands for it.
scope: A time to remember the adoption of the United States flag; also called June 14, not Independence
  Day, which marks a different event.
examples:
- Flag Day falls on June 14.
- Schools hold a Flag Day assembly each year.
