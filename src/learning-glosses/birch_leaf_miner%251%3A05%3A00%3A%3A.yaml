simpleMeaning: The young of this small black flying insect from Europe, now in eastern United States,
  eat tunnels in the green parts of a pale barked tree and strip it bare.
scope: This is the small black flying insect from Europe, now in the eastern United States, whose young
  eat tunnels in the green parts of a pale barked tree.
examples:
- The birch leaf miner's young ate tunnels in the green parts of the tree.
- The birch leaf miner had stripped the tree bare.
