simpleMeaning: a pointed curve with small points on the inside on both sides of the top
scope: This is a pointed curve with small points on the inside near the top; not a plain round curve and
  not a pointed curve with no points inside.
examples:
- The trefoil arch above the door has small points on the inside near the top.
- Stone cutters shaped the trefoil arch with points on both sides of its top.
