simpleMeaning: A brown kind of beetle that eats stored grain, above all rice.
scope: Also called black weevil and rice weevil, this beetle lives on grain already stored, a different
  kind from the moth whose young eat stored grain.
examples:
- The Sitophylus oryzae beetles had eaten into the sacks of stored rice.
- Farmers check stored grain for Sitophylus oryzae before they sell it.
