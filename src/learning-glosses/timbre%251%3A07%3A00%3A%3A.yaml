simpleMeaning: In music, the special quality of a sound made of many parts that makes it different from
  other sounds, such as a voice, a noise, or a musical sound
scope: 'Also called quality, tone, and timber: in music, the special character of a sound that sets it
  apart, not how high or low it is and not how loud it is.'
examples:
- The timbre of her voice was warm and rich.
- A flute and a cello can play the same note, but their timbre is very different.
