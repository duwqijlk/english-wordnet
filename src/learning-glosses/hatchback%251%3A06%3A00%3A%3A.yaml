simpleMeaning: the back door of a car, which slopes down and lifts up to open
scope: This is the back door of a car, also called a hatch or a liftgate; it is not the whole car that
  has such a door.
examples:
- He lifted the hatchback and put the bags in the back of the car.
- The hatchback would not stay up, so she held it open with one hand.
