simpleMeaning: A sloth of Central America with two long claws on each front foot and three long claws
  on each back foot.
scope: This is a sloth of Central America with two long claws on each front foot and three long claws
  on each back foot, also called the two-toed sloth, unai or unau; it is not the three-toed sloth.
examples:
- The Choloepus hoffmanni hung from the branch by its long claws.
- A Choloepus hoffmanni moved slowly through the trees of Central America.
