simpleMeaning: a knife that fits on the end of a rifle for use as a weapon
scope: This is the knife itself, fixed to a rifle; it is not the act of stabbing or killing someone with
  such a knife.
examples:
- The soldier fixed his bayonet to the end of his rifle.
- Each rifle came with a bayonet for close fighting.
