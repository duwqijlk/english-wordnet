simpleMeaning: Usually a yellow gas, not metal, one bond only, in the halogen group, that hurts and burns,
  can kill, and helps other things burn, got from fluorite, cryolite, or fluorapatite.
scope: A yellow gas that hurts and burns, also called fluorine and atomic number 9; not the unit of capacitance,
  and not the letter.
examples:
- Fluorine is a yellow gas.
- Fluorine can burn skin.
