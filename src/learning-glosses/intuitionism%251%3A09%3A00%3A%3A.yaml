simpleMeaning: In philosophy, the view that we learn what is true above all by a direct sense of it, without
  working it out by reason
scope: In philosophy, the view that we learn what is true above all by a direct sense of it; not the view
  that knowledge comes from the senses and not the view that it comes from reason.
examples:
- Intuitionism holds that moral truths are known at once, not proved.
- The philosopher defended intuitionism against the empiricists.
