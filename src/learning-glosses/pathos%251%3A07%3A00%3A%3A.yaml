senseId: 'pathos%1:07:00::'
synsetId: 05218522-n
simpleMeaning: A quality in a thing that stirs feeling in people, especially pity or sorrow.
scope: Also called poignancy, a quality that stirs feeling, especially pity or sorrow, not the feeling
  of pity and sorrow itself.
examples:
- The pathos of the old man's story moved everyone in the room.
- There was pathos in her voice as she told of losing her home.
