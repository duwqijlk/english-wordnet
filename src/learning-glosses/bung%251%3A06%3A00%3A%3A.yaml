senseId: 'bung%1:06:00::'
synsetId: 02923032-n
simpleMeaning: a piece that you put into a hole in a barrel or a flask (a bottle with a narrow top) to
  close the hole
scope: 'Also called spile: a thing that closes a hole in a barrel, not the act of giving extra money for
  a service.'
examples:
- He pulled the bung out of the barrel to pour the wine.
- The bung was loose, so wine leaked from the barrel.
