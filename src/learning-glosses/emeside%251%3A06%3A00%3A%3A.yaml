simpleMeaning: A drug that stops fits, used to treat short spells of staring in petit mal epilepsy
scope: A drug that stops fits, used to treat short spells of staring; ethosuximide and Zarontin are other
  names for this sense, not a drug for long shaking fits and not a painkiller.
examples:
- Emeside stopped her staring spells.
- The doctor gave Emeside for the petit mal fits.
