simpleMeaning: a large parrot with a long tail and very bright colours, from Central America and South
  America, and one of the largest and most showy of all parrots
scope: A large, bright parrot with a long tail from Central and South America, not a smaller parrot and
  not any other bright bird.
examples:
- A blue-and-gold macaw flew over the trees with its long tail behind it.
- The bright red macaw at the zoo was larger than the other parrots.
