simpleMeaning: the way a machine or electrical device reacts to a signal put into it, or to a range of
  such signals
scope: This is not a spoken or written answer, but how a device reacts to a signal.
examples:
- The engineer measured the response of the circuit to a range of frequencies.
- A slow response from the sensor delayed the alarm.
