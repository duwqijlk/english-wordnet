synsetId: 00042258-a
simpleMeaning: In grammar, describing a verb form where the subject carries out what is said.
scope: 'Grammatical voice: the subject as the doer in a clause; not the voice noun itself, not a condition
  growing more severe or wider in scope, not readiness for military or naval operations, not a disposition
  to act or bring about change, not taking part in a group or cause, not personal liveliness, not exerting
  influence or producing an effect, not a busy place or constant coming and going, not a machine in operation,
  not verbs or participial adjectives expressing action rather than a state, not volcanoes that can erupt
  or are erupting, not full-time work, not the chemical noun, and not a member of an organization.'
examples:
- In 'The dog chased the ball', 'chased' is in the active voice.
- Use an active verb when you want to say clearly who did what.
