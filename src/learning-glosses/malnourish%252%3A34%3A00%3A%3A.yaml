simpleMeaning: to give a person or animal too little food, or food that is not good enough to keep them
  well
scope: 'Also called undernourish: to give a person or animal too little food or poor food, not to give
  no food at all.'
examples:
- The camp malnourished the children, giving them poor food and too little of it.
- If farmers malnourish their animals, the animals stay small and weak.
