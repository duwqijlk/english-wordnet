simpleMeaning: a person whose beliefs about religion go against the main fixed teachings of the Roman
  Catholic Church
scope: 'Also called misbeliever and religious outcast: a person whose beliefs about religion go against
  the Roman Catholic Church, not just a person who holds different ideas in any field.'
examples:
- The priest called him a heretic for speaking against the Church's teachings.
- In those days, a heretic could be put to death for his beliefs about religion.
