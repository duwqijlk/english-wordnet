simpleMeaning: a piece of music for the organ that takes a hymn tune and changes it again and again
scope: A piece of organ music built on a hymn tune; not a short opening piece for a service and not a
  song sung by a choir.
examples:
- The organist played a chorale prelude before the service began.
- Bach wrote many chorale preludes based on well-known hymn tunes.
