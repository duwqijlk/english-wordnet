simpleMeaning: with no stars in the sky and with nothing that looks like a star
scope: This describes a sky or night with no stars and no star-like things to see; it does not mean dark
  on its own.
examples:
- We walked home under a clear but starless sky.
- On starless nights, the village felt very dark.
