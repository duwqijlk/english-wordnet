simpleMeaning: The land that belongs to one country and is ruled by that country's own government.
scope: The land ruled by one country, also called soil, not a small marked-off part of a country and not
  land ruled by no one.
examples:
- American troops were stationed on Japanese territory.
- No foreign army may enter the territory without leave.
