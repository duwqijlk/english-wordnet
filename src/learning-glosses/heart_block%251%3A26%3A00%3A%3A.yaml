simpleMeaning: Because the signal that sets the beat that drives the blood does not get through as it
  should, a person keeps blacking out in sudden fits.
scope: Also called atrioventricular block, it is a state of blacking out in sudden fits that come back
  again and again.
examples:
- Heart block made her black out without warning.
- She blacked out again, and the tests showed heart block.
