simpleMeaning: Well-spiced round lumps of ground sea food and eggs and crushed crumbs, cooked slowly in
  stock made from sea food
scope: This is a well-spiced round lump of ground sea food, eggs and crumbs cooked in stock; gefilte fish
  is another name for this sense, not a fried patty of flaked sea food and potato.
examples:
- She dropped the fish balls into the soup.
- The fish ball was soft and well spiced.
