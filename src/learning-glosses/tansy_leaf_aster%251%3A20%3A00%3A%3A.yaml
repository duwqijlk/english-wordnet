simpleMeaning: a wild aster that grows from Alberta to Texas and Mexico, with fernlike leaves and flower
  heads of very narrow bright purple rays
scope: Also called a tahoka daisy; not a garden daisy and not a tall sunflower.
examples:
- A tansy leaf aster grows wild on the open plain.
- Tansy leaf asters bloom from Alberta to Mexico.
