simpleMeaning: a person who passes on their right to own something by signing a cheque or a paper that
  can be passed on for money
scope: 'Also called indorser: a person who passes on their right to own something by signing a cheque
  or a paper that can be passed on for money, not a person who backs a product in public and not a person
  who signs as a witness.'
examples:
- As endorser of the cheque, she signed it over to her brother.
- The endorser passed on his right to the shares by signing the paper.
