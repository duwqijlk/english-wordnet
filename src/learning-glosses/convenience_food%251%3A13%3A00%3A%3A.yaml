simpleMeaning: a packed meal or dish that can be made ready fast and with little work, such as by warming
  it up or letting it thaw
scope: A packed dish that is quick and easy to get ready; not a meal cooked from raw parts, and not food
  eaten at a restaurant.
examples:
- We ate convenience food for dinner because we got home late.
- She keeps convenience food in the freezer for busy nights.
