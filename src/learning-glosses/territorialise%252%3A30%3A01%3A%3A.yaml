senseId: 'territorialise%2:30:01::'
synsetId: 00581029-v
simpleMeaning: to put a thing on a basis of the parts of a country it serves
scope: To put a thing on a basis of the parts of a country it serves; territorialize is another name for
  this sense, not to add land to a country and not to make a thing into a territory.
examples:
- The railways were territorialised in the 1920s.
- The company territorialised its sales teams by region.
