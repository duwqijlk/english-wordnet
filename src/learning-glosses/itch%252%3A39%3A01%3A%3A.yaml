simpleMeaning: to scrape or rub the skin as if to make an annoying feeling on it feel better
scope: 'Also called scratch and rub: this is the act of scraping or rubbing the skin, not the annoying
  feeling itself and not the skin sickness.'
examples:
- He itched the bite on his arm.
- She itched her back where the mosquito had bitten her.
