senseId: 'simile%1:10:00::'
synsetId: 07122967-n
simpleMeaning: A way of speaking that says a thing is like a thing of another kind, usually with the words
  'like' or 'as'.
scope: A figure of speech that compares unlike things with 'like' or 'as', not a plain statement of likeness.
examples:
- The poet used a simile to compare her eyes to stars.
- '''Brave as a lion'' is a simile.'
