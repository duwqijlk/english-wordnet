senseId: manipulative%5:00:00:artful:00
synsetId: 00150729-s
simpleMeaning: good at getting other people to do or think what you want, so that you gain from it
scope: This describes a person who is good at getting others to do what he or she wants for his or her
  own gain, not a person who is just good at handling things with the hands.
examples:
- The manipulative salesman made her buy things she did not need, just so he could earn more.
- He was so manipulative that his friends did what he wanted without seeing how he gained from it.
