senseId: 'hypoproteinemia%1:26:00::'
synsetId: 14294348-n
simpleMeaning: An abnormally low level of protein in the blood, which can point to a poor diet or to intestinal
  or kidney disorders.
scope: It differs from anemia, a lack of red cells in the blood, in that the lack here is of protein,
  which may point to too little food or to trouble in the gut or the kidneys.
examples:
- Her hypoproteinemia pointed to a diet with too little food.
- The test found hypoproteinemia, which may point to trouble in his kidneys.
