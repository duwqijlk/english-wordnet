simpleMeaning: A person who nearly always looks sad or cross.
scope: Also called a sourpuss, a pouter, and a picklepuss; a person who nearly always looks sad or cross,
  set beside a person who is sad for a short time and a person who is angry.
examples:
- He is a gloomy Gus, always looking sad even on fine days.
- Do not be such a gloomy Gus; the news is not all bad.
