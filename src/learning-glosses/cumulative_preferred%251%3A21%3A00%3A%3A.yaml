synsetId: 13357219-n
simpleMeaning: a kind of share in a company that is paid before other shares, and if a payment is missed
  it stays owed until it is paid
scope: A kind of share paid before others, with missed payments kept and owed, also called cumulative
  preferred stock, not an ordinary share and not a company loan.
examples:
- She bought cumulative preferred shares, so a missed payment was still owed to her.
- The company skipped a payment, but cumulative preferred holders were paid later.
