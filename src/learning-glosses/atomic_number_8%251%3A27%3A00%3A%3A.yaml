simpleMeaning: A non-metal two-bond element, normally a colourless odourless tasteless nonflammable two-atom
  gas; it makes up 21 percent of the air by volume; the most common element in the earth's crust.
scope: Also called O and oxygen; a gas that makes up 21 percent of the air, not nitrogen, the gas that
  makes up most of the air, and not hydrogen, another light gas.
examples:
- Atomic number 8 is the element oxygen.
- We breathe in atomic number 8 from the air.
