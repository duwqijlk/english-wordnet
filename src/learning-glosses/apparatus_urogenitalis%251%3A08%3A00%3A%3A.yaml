simpleMeaning: The set of body parts that take part in making children and in making and passing urine.
scope: The set of body parts for making children and for making and passing urine; genitourinary apparatus
  and genitourinary system are other names for it, and it is not the gut and not the heart and blood system.
examples:
- The doctor studied the apparatus urogenitalis in the textbook.
- Illness of the apparatus urogenitalis can affect both passing water and having children.
