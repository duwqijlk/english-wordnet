simpleMeaning: a marsupial (an animal that carries babies in a pouch) active at night in trees, with a
  bare tail that holds things, from southern North America to northern South America
scope: Also called possum, this is the North and South American animal with a bare tail, not the small
  furry tree animal of Australia with the same name.
examples:
- An opossum climbed the tree at night.
- The opossum held on to the branch with its bare tail.
