simpleMeaning: one of many kinds of thorny bush that produce large, sweet-smelling flowers in many colors.
scope: This is not a cut flower, the wine, or the color; it is the living bush that produces such flowers.
examples:
- She planted a climbing rose against the garden wall.
- The roses in the front yard bloom every June.
