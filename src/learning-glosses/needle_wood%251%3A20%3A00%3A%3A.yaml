simpleMeaning: Pointed leaves and flowers the colour of cream grow on a large, bushy shrub in central
  and eastern Australia.
scope: This large, bushy shrub is also called needle-wood and needlewood, and it is not a tree.
examples:
- We saw a needle wood in central Australia.
- The needle wood had creamy white flowers.
