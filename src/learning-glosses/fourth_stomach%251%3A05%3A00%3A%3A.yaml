simpleMeaning: the last part of the belly of an animal that chews its food twice, where the food is broken
  down
scope: 'Also called abomasum: the last part of the belly of an animal that chews its food twice, where
  food is broken down, not the belly of a person and not one of the earlier parts.'
examples:
- The fourth stomach of the cow is where most digestion happens.
- Food passes into the fourth stomach after the first three parts.
