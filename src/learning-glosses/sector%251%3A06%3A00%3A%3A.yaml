simpleMeaning: a tool for measuring that has two arms with marks on them, joined at one end so they can
  open and close
scope: A measuring tool with two arms joined at one end, not the smallest piece of a computer track for
  storing data and not a shape cut from a circle.
examples:
- He used a sector to measure the size of the angle.
- The old sector had two brass arms joined at one end.
