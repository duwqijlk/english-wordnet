simpleMeaning: Over an open fire above all, this long-handled tool with prongs cooks or browns frankfurters
  or bread and the like.
scope: This is the long-handled pronged tool for cooking or browning food, used above all over an open
  fire.
examples:
- The bread was held over the fire on a toasting fork.
- We cooked the frankfurters on a toasting fork over the open fire.
