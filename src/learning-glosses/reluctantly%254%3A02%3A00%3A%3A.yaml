simpleMeaning: in a way that shows you do not want to do something
scope: Doing something in a way that shows you do not want to do it; not doing it freely, happily, or
  with a strong wish to do it.
examples:
- He reluctantly agreed to lend his brother the money.
- She reluctantly left the party early because she had to work.
