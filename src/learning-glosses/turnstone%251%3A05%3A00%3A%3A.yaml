simpleMeaning: a sea bird like a plover that moves from place to place and flips over stones on the shore
  to find food
scope: This is a sea bird that flips over stones on the shore to find food; not a gull and not a bird
  that hunts in deep water.
examples:
- A turnstone flipped over a pebble and picked up a small crab.
- Turnstones stopped on the beach on their long move south.
