senseId: 'direct_tide%1:11:00::'
synsetId: 07417473-n
simpleMeaning: High water on one side of the earth happening at the same time as high water on the far
  side.
scope: High water on both sides of the earth at the same time, not high water on one side only and not
  low water.
examples:
- The direct tide raised the water on both sides of the earth.
- A direct tide lifted boats on both sides of the earth at once.
