simpleMeaning: showing a quick, sharp mind and the ability to plan cleverly and find practical solutions.
scope: This is not about learning quickly or doing well in school, and not about neat appearance; it emphasizes
  alert, calculating, and resourceful thinking.
examples:
- She made a smart decision to invest before prices rose.
- The smart negotiator knew when to walk away.
