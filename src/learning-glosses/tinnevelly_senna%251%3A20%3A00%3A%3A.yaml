simpleMeaning: an upright bush with clusters of brownish-yellow flowers; its dried leaves are used as
  a medicine that loosens the bowels, and it is sometimes put in the group Cassia
scope: Also called true senna; a bush whose dried leaves loosen the bowels, not a tree and not a flower
  grown for show.
examples:
- The tinnevelly senna grew along the road.
- He brewed tinnevelly senna leaves for his stomach.
