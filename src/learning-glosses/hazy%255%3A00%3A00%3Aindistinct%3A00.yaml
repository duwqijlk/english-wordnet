simpleMeaning: not clear in shape, with soft edges that are hard to make out
scope: 'Also called blurred, fuzzy, blurry, or foggy: not clear in shape, with soft edges that are hard
  to make out, not air full of fog or mist.'
examples:
- The trees were hazy shapes in the far distance.
- His memory of the day was hazy and hard to hold.
