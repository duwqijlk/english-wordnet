senseId: 'spiritualize%2:30:03::'
synsetId: 00581589-v
simpleMeaning: to lift something up and see it as perfect, as Christ was shown in a bright changed form
scope: To lift something up and see it as perfect, as in Christ's transfiguration; glorify and transfigure
  are other names for this sense, not a general praise.
examples:
- The poem spiritualizes the old hero into a figure of light.
- Her writing spiritualizes the simple life she lived.
