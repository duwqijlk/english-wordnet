simpleMeaning: a link between things or events, such as when one causes the other or when they share some
  of the same features
scope: 'Also called connection: a link between things or events, such as one causing the other; not the
  state of being joined together.'
examples:
- Scientists studied the connectedness between lack of sleep and poor memory.
- 'There is a clear connectedness between the two events: the rain caused the flood.'
