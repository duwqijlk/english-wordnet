simpleMeaning: To have gone through a feeling, condition, or situation yourself, so that you understand
  it from direct experience.
scope: This is about having lived through an experience or feeling, not about knowing a fact and not about
  being acquainted with a person.
examples:
- She has known hunger and never wastes food.
- He knows the loneliness of working night shifts.
