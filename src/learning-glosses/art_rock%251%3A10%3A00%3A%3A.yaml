simpleMeaning: This kind of popular music is made for listening, not dancing; it came up in the 1970s,
  mixing jazz with other kinds of music.
scope: Among kinds of popular music, this one — also called progressive rock — came up in the 1970s, mixes
  jazz with other kinds of music, and is made for listening, not dancing.
examples:
- The crowd sat and listened while art rock filled the hall.
- They played art rock that no one danced to.
