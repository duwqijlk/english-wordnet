simpleMeaning: In geometry, the fact that a point and a plane can swap roles in the theorems (statements
  proved to be true) of projective geometry
scope: In geometry this is about points and planes swapping roles, not the physics sense about matter
  and light as waves and small parts, and not the general sense of being in two opposed parts.
examples:
- In projective geometry, duality lets you swap points and planes in a theorem.
- Students use duality to turn a theorem about points into one about planes.
