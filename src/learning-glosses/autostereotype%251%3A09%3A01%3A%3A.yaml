simpleMeaning: a fixed picture of their own cultural group that the people in it share, too simple to
  show what they are really like or how they act
scope: A shared view of one's own cultural group, not a view of another group and not one person's own
  view of themself.
examples:
- Their autostereotype is very positive, and it shows how they see their own group.
- The group's autostereotype painted them as warm and hard-working people.
