simpleMeaning: People with weak defences against sickness, such as people with AIDS, and babies may come
  down with a sickness of the lungs.
scope: Pneumocystis carinii pneumonia, pneumocystis pneumonia and interstitial plasma cell pneumonia are
  other names for this lung sickness of babies and people with weak defences.
examples:
- The baby had pneumocytosis.
- The doctors treated the infant for pneumocytosis.
