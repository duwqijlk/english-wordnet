simpleMeaning: writing down what a person does and studying their mind, to judge or guess their skill
  in one area of life or to find a certain group they belong to
scope: This is the act of studying a person in this way, not drawing the side view of a face and not a
  short written description of a person.
examples:
- The police used profiling to find people who might have done the crime.
- Profiling helped the school judge which job each student could do well.
