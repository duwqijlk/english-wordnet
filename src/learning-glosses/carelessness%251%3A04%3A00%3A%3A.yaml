simpleMeaning: Not taking the care that a sensible person would take in the same situation
scope: Not taking due care; neglect is another name for this sense, not a mistake made on purpose and
  not bad luck.
examples:
- His carelessness left the gate open, and the dog ran out.
- The accident was caused by carelessness, not by bad weather.
