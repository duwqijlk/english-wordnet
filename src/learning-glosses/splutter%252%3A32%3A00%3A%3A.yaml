simpleMeaning: to say words with a spitting sound, as if in a rage
scope: 'Also called sputter: to speak with a spitting sound, as if in anger, not to spit something up
  and not the loud noise of something bursting.'
examples:
- She spluttered with rage when she heard the news.
- '''Get out!'' he spluttered, red in the face.'
