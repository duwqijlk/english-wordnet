simpleMeaning: The signal is picked up by a machine circling the earth, made stronger, and sent back down,
  in this television system.
scope: This television system takes its signal from a machine circling the earth, while cable television
  takes its signal from a wire.
examples:
- They watch satellite television at home.
- Satellite television brings shows into our home.
