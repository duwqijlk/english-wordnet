simpleMeaning: tending to push into a place or a person's life, especially their private life, when not
  wanted
scope: About pushing into private life when not wanted, not the rock sense where hot liquid rock is pushed
  between other rock layers.
examples:
- Her intrusive questions about my family made me feel uneasy.
- The intrusive caller kept asking about their private life.
