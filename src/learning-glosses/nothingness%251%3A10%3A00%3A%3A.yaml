simpleMeaning: talk that puffs itself up with grand words but carries no real point, meant to fool the
  hearer
scope: 'Also called wind and jazz: empty, showy talk that means nothing, not the state of being nothing
  at all.'
examples:
- His speech was pure nothingness, all show and no fact.
- Don't give me any of that nothingness.
