simpleMeaning: Describing the sun when it shows little activity at its surface, for example few sunspots.
scope: This is the sun's own low surface activity, not the everyday adjective for a place free of noise
  or a person who is calm.
examples:
- Astronomers call the sun quiet when its surface shows few sunspots.
- The sun was quiet that year, with barely a sunspot to be seen.
