simpleMeaning: putting a vowel or a consonant sound into a word so the word is easier to say
scope: Putting a vowel or a consonant sound into a word so it is easier to say, not taking a sound out
  of a word and not changing one sound for another.
examples:
- The plural of 'bush' shows epenthesis, with a vowel put in to make it easier to say.
- Speakers use epenthesis when they add a sound inside a word to ease its sound.
