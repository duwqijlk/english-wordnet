simpleMeaning: A fallen arch in the part of the leg that meets the ground, leaving it spread out and pressed
  down more than usual.
scope: A fallen arch in the part of the leg that meets the ground, leaving it spread out and pressed down
  more than usual; pes planus is another name for this sense, not a high arch, and not a foot with a normal
  arch.
examples:
- His flatfoot ached after the long walk.
- A flatfoot spreads out more than a normal foot.
