simpleMeaning: A bush called Catha edulis gives leaves that are chewed like tobacco or brewed as tea,
  and they lift the mood and wake the body.
scope: Cat, kat, khat, and qat are other names for these leaves, chewed like tobacco or brewed as tea.
examples:
- In Yemen, quat is used daily by most adults.
- Leaves of quat brewed as tea woke them up.
