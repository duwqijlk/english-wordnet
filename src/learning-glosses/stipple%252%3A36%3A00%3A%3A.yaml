simpleMeaning: to cut a design into a surface by making small dots and short, quick strokes
scope: Cutting a design into a surface with dots and flicks, not putting paint on with dots and not making
  shade with short touches in paint or ink.
examples:
- The artist stippled the metal plate to make the bird's feathers.
- He learned to stipple a portrait into copper using a sharp tool.
