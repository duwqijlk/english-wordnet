simpleMeaning: A person with this way of being helps the people near them and treats them as friends
scope: A way of being in which a person helps the people near them and treats them as friends, also called
  neighborliness and good-neighbourliness; not a cold way of keeping to oneself.
examples:
- His neighbourliness meant he always lent tools to the people on his street.
- The neighbourliness of the village showed in the way everyone looked out for each other.
