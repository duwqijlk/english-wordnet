simpleMeaning: Sexual activity that two people share, often including intercourse.
scope: This is the sexual activity itself, not the feeling of deep affection, not the person who is loved,
  not sexual desire, and not a zero score in tennis.
examples:
- They made love for the first time that night.
- Their love was purely physical, with no affection between them.
