simpleMeaning: a made-up mark in a space where a push or pull acts, showing which way the push or pull
  goes at each place
scope: A made-up mark in a space where a push or pull acts, showing which way the push or pull goes at
  each place; not a real mark on the ground and not a line drawn on a map.
examples:
- The field line shows the way the force pulls at that point.
- A field line runs from the north pole to the south pole.
