simpleMeaning: A bush plant grown above all in the southern United States, with small flat seeds that
  can be eaten
scope: Butter-bean plant and butter bean are other names for this bush plant grown above all in the southern
  United States; it is not the tall-growing plant of the other sense and not the cooked seeds.
examples:
- The lima bean is a common crop in the south.
- Farmers grow lima bean for its small flat seeds.
