simpleMeaning: A ring in which atoms of more than one kind are joined, most of all a ring of carbon atoms
  with at least one atom that is not carbon
scope: This is a ring in which atoms of more than one kind are joined, most of all a ring of carbon atoms
  with at least one atom that is not carbon, also called heterocyclic ring, and not a ring of atoms all
  of one kind.
examples:
- The heterocycle has one nitrogen atom in its ring.
- Pyridine is a heterocycle with a nitrogen atom.
