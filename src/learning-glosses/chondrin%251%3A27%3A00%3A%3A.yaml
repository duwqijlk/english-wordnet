simpleMeaning: a jelly-like substance got by boiling cartilage, the smooth firm tissue at the ends of
  bones, in water
scope: A jelly-like substance got by boiling cartilage in water; not the cartilage itself and not a glue
  made from bones.
examples:
- Chondrin forms when cartilage is boiled in water.
- The cook drew chondrin from the boiled cartilage.
