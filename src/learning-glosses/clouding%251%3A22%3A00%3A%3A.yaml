simpleMeaning: the process by which small bits of water become visible in the sky
scope: The forming of what you can see in the sky from water, not a loss of clearness in the eyes or in
  the mind.
examples:
- Clouding began in the late morning, and by noon the sky was grey.
- Pilots watch for clouding that can hide the mountains ahead.
