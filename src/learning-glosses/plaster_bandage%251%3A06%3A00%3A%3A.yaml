simpleMeaning: Often made of a white powder that sets hard, this wrap with a firm covering holds broken
  bones still while they heal.
scope: Also called cast and plaster cast, this firm wrap holds broken bones still while they heal.
examples:
- A plaster bandage held the broken bones still.
- The broken bones healed under a plaster bandage.
