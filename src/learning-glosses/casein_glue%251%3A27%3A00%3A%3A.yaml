simpleMeaning: A sticky stuff made from a milk protein, used for things like plywood and cupboards.
scope: A sticky stuff made from a milk protein, used for things like plywood and cupboards; not a sticky
  stuff made from fish, and not a sticky stuff made from plants.
examples:
- The casein glue held the plywood together.
- He used casein glue on the cupboard.
