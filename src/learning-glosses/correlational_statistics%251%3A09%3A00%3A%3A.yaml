senseId: 'correlational_statistics%1:09:00::'
synsetId: 06040778-n
simpleMeaning: Two or more things are tied together when a steady change in one is matched by a steady
  change in the other.
scope: The link between two or more things that change together in a steady way is also called correlation.
examples:
- Correlational statistics showed that taller children tended to read better.
- The report used correlational statistics to link hours of study with test marks.
