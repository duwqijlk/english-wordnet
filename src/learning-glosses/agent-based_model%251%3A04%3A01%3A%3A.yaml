simpleMeaning: Parts that act on their own, alone or in groups such as firms, are copied in a computer
  plan, to show what their dealings do to the whole.
scope: A computer plan for copying how many parts act and deal with each other, not a plan of one thing
  alone.
examples:
- An agent-based model showed how the firms would act together.
- They built an agent-based model to see what follows for the whole.
