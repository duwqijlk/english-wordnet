senseId: 'azido_radical%1:27:00::'
synsetId: 14645372-n
simpleMeaning: One part of a chemical, made from hydrazoic acid and written N3-, that has one free link
  to join to other parts
scope: One part of a chemical that can join to other parts, not a whole chemical and not a part with two
  free links; azido group is another name for it.
examples:
- The azido radical joins to the ring in the new compound.
- Chemists use the azido radical to build new chemicals.
