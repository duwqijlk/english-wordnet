simpleMeaning: a person who takes part in an event made for dancing with other people, such as a ball
scope: This is a person who takes part in an event with other people that is made for dancing, such as
  a ball, not a person who dances as a job.
examples:
- The dancers filled the hall at the ball, moving to the music all night.
- She was a keen dancer and never missed the village dance on Fridays.
