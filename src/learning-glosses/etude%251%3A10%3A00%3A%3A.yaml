simpleMeaning: A short piece for one instrument alone, written to practise on or to show off fine playing
scope: A short piece for one instrument alone; not a song with words, and not a long piece for many players.
examples:
- She played an etude for piano at the recital.
- The etude was written to show off fast finger work.
