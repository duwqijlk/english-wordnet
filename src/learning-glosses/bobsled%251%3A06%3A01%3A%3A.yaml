simpleMeaning: Once, two short sleds joined as one.
scope: This sense is, once, two short sleds joined as one, unlike the sense for a long racing sled, for
  two or more folk, with a steering device, and unlike the sense for riding a bobsled.
examples:
- The old bobsled was two short sleds joined together.
- Bobsleds once were two short sleds coupled.
