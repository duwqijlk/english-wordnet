simpleMeaning: the act of gathering more and more of something over time, so the amount keeps growing
scope: This is the general act of gathering more over time, not the finance sense where profits are kept
  and added to a company's money base.
examples:
- The accumulation of dust in the corner took many months.
- Slow accumulation of snow blocked the road.
