simpleMeaning: how far a thing can be split into parts, or shared out among a number of people
scope: How far a thing can be split into parts or shared out among people, and not the act of splitting
  a thing or a thing that cannot be split.
examples:
- The divisibility of the cake let us share it among eight children.
- They tested the divisibility of the land before they split it among the heirs.
