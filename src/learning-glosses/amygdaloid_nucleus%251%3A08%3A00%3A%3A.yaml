simpleMeaning: Almond-shaped nerve cluster in the front of the temporal lobe, linked to the hypothalamus,
  hippocampus and cingulate gyrus, and key to emotion and motivation as part of the limbic system.
scope: Another name for the amygdala, the almond-shaped brain area; the corpus amygdaloideum is a third
  name for the same structure, not a separate brain part.
examples:
- The amygdaloid nucleus helps give emotional weight to what we experience.
- Researchers recorded activity in the amygdaloid nucleus during the test.
