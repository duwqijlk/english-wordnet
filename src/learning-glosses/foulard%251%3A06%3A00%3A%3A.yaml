simpleMeaning: Usually with a printed pattern on it, this light cloth is woven plain or in a diagonal
  pattern from silk or silk-like stuff
scope: This light cloth is woven plain or in a diagonal pattern from silk or silk-like stuff, and it stands
  beside plain silk and twill, which name the stuff and the weave alone.
examples:
- She wore a foulard round her neck.
- The foulard had a small printed pattern.
