simpleMeaning: Turned to liquid by heat.
scope: Also called molten or liquefied, this is about a thing turned to liquid by heat, not a thing reduced
  to a liquid state or changed from solid to liquid in some other way.
examples:
- The wax was liquified by the heat of the lamp.
- The metal stayed liquified until it cooled.
