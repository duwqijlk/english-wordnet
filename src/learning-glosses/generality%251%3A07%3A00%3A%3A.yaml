senseId: 'generality%1:07:00::'
synsetId: 04771667-n
simpleMeaning: The quality of holding true in many cases, applying widely, and not being tied to one case.
scope: The quality of holding true widely, not a single idea or finding that applies widely.
examples:
- The generality of his claim made it hard to test.
- She spoke of the generality of the rule, not of one case alone.
