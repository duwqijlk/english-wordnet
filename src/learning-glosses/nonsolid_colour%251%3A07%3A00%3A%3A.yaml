simpleMeaning: a shade made by a pattern of dots of different shades that together look like the shade
  wanted
scope: A shade made by a pattern of dots of different shades; also called dithered color, dithered colour
  and nonsolid color, not a plain flat shade and not a shade from mixed paint.
examples:
- The screen showed a nonsolid colour built from tiny dots.
- A nonsolid colour is made by dots that together look like one shade.
