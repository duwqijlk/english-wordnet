simpleMeaning: a pastime or activity that takes up your time and thoughts, usually in a pleasant way
scope: This is not the fee charged for a loan or a share in a business; it is something you do that keeps
  you pleasantly occupied.
examples:
- Photography has been his main interest since college.
- Her interests include gardening and folk music.
