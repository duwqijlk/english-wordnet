simpleMeaning: At about monthly gaps, while a woman can still bear children, blood leaves the womb.
scope: Also called menstrual blood and menstrual flow, this blood comes from the womb at about monthly
  gaps, not from a cut.
examples:
- Menorrhea came back at about monthly gaps.
- Menorrhea came from the womb.
