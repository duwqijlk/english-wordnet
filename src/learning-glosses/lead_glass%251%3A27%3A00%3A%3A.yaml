simpleMeaning: A clear hard material made with the soft grey metal, that bends light a lot
scope: A clear hard material that bends light a lot, not an ordinary window pane and not a drinking cup.
examples:
- The fine lead glass vase caught the light and threw bright colours on the wall.
- The maker used lead glass for the lens because it bends light so much.
