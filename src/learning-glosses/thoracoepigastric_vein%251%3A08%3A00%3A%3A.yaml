simpleMeaning: From by the blood tube near the skin of the belly, a blood tube runs up to join the blood
  tube under the arm or in the chest.
scope: A blood tube of the belly wall, also called vena thoracoepigastrica, that runs up to the blood
  tube under the arm or in the chest.
examples:
- The thoracoepigastric vein joins the vein under the arm.
- Blood runs up the thoracoepigastric vein from the belly wall.
