simpleMeaning: the way a living thing looks that makes it hard for hunters to see it or makes it look
  bad to eat
scope: The way a living thing looks that hides it from hunters, not bright marks meant to warn or to draw
  a mate.
examples:
- The moth's protective coloration made it blend into the tree bark.
- Protective coloration helps the frog stay hidden from birds that hunt it.
