scope: 'Also called Sunnah or hadith: in Islam, the way of life laid down as the rule for Muslims, drawn
  from Muhammad''s teaching and acts and from readings of the Koran, set apart from the Koran itself as
  a lived way of life.'
examples:
- Sunna guides how many Muslims live day to day.
- He studied the Sunna to learn the Prophet's way of life.
