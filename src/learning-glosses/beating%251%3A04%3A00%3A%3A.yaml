simpleMeaning: the act of punishing a person by hitting them again and again
scope: This is punishment by hitting a person again and again. It is not the regular movement or sound
  of the heart, and not winning against another person in a game or fight.
examples:
- The boy was given a beating for stealing.
- A beating with a stick was used as punishment at the school.
