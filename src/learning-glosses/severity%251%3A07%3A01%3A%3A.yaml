simpleMeaning: how bad or strong something unwelcome is, such as pain or bad weather
scope: How bad or strong something unwelcome is, such as pain or bad weather; not how strong something
  pleasant is, and not the thing itself.
examples:
- The severity of the storm kept everyone indoors.
- Doctors asked about the severity of his pain.
