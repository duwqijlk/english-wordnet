simpleMeaning: The culture and religion of the Jews are what this word marks, when things belong to them
  or are like them.
scope: Also called Judaic, this word marks things to do with the culture and religion of the Jews, not
  things to do with another faith.
examples:
- The Judaical customs of the town were old and strong.
- She wrote about Judaical law and prayer.
