simpleMeaning: the dot used at the end of a declarative sentence or after an abbreviation.
scope: This is the dot itself, in older British printing and typography; most modern writers say 'full
  stop' or 'period'. It is not the decimal dot that comes before fractional digits, and not a visible
  spot or small round mark on a surface. The word is rare in current general English and survives mainly
  in typographic description.
examples:
- In older British printing a sentence ended with a point rather than a period.
- The editor put a point after each abbreviation in the list.
