simpleMeaning: A one-year plant of California with white blooms, each with a deep purple mark on its petals.
scope: A one-year plant of California with white blooms, each with a deep purple mark on its petals; not
  a plant with plain white blooms, and not a card with five marks.
examples:
- The five-spot opened its white flowers in spring.
- A five-spot grew beside the trail in California.
