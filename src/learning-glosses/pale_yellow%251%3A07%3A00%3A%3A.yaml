simpleMeaning: A gold colour that shifts a little, dull and often mixed with white
scope: 'Also called straw and wheat: a gold colour that shifts a little, dull and often mixed with white,
  not a strong bright yellow and not a greenish yellow.'
examples:
- She painted the wall pale yellow.
- The pale yellow of the old paper had faded in the sun.
