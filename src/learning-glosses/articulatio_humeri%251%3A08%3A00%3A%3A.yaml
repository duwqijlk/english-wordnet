simpleMeaning: a ball-and-socket joint where the round top of the upper arm bone fits into a hollow in
  the scapula, the flat bone of the upper back
scope: 'Also called the shoulder: the joint where the upper arm bone meets the shoulder blade, not the
  elbow and not the bone itself.'
examples:
- He hurt his articulatio humeri when he fell on his shoulder.
- The articulatio humeri lets the arm swing in all directions.
