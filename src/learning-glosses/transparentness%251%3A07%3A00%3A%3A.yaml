simpleMeaning: Being so clear that light passes through and you can see through a thing
scope: 'Also called transparency and transparence: being so clear that light passes through, not cloudiness
  and not a shine on the surface.'
examples:
- The transparentness of the window let in the morning light.
- Its transparentness made the thin cloth seem almost absent.
