simpleMeaning: not knowing or noticing something because a person did not take care to keep it in mind
scope: This sense is the not knowing that comes from not taking care to remember, not just a general habit
  of forgetting things.
examples:
- His forgetfulness left him with no idea the meeting had moved, because he had failed to remember the
  new time.
- Through forgetfulness, she left the letter unposted and never thought of it again.
