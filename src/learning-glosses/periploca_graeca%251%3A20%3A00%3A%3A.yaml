simpleMeaning: A leaf-shedding climber for arches and fences, with bad-smelling but striking flowers and
  poisonous yellow fruits, grown for its dark shining leaves; from southeastern Europe to Asia Minor.
scope: Also called silk vine, this climber is grown for its dark shining leaves and has poisonous yellow
  fruits; it is not a honeysuckle and not a jasmine.
examples:
- Periploca graeca climbed the garden arch.
- The yellow fruits of Periploca graeca are poisonous.
