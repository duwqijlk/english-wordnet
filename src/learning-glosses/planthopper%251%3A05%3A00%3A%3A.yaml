senseId: 'planthopper%1:05:00::'
synsetId: 02262029-n
simpleMeaning: An insect kin to the little jumping insects that live on leaves and to spittlebugs, that
  seldom harms crops grown by farmers.
scope: An insect kin to leafhoppers and spittlebugs that seldom harms crops grown by farmers; plant hopper
  is another name for this sense, not a leafhopper and not a spittlebug.
examples:
- The planthopper sat on the rice stem, doing little harm.
- Planthoppers rarely damage the crop.
