simpleMeaning: A person who moves onto land owned by the state, by law, meaning to make it their own in
  time.
scope: Also called a squatter or a homesteader; one who settles by law on state land, meaning to gain
  title to it.
examples:
- The nester built a cabin on the open land.
- A nester could claim the land after living on it for years.
