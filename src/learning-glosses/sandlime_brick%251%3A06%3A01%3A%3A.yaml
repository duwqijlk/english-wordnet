simpleMeaning: A building block made with sand and lime mixed with water, not clay, and most often pale
  grey or almost white.
scope: A building block of sand and lime, also called calcium-silicate brick, flintlime brick, and sand-lime
  brick; not a clay brick and not a concrete block.
examples:
- The new school was built of sandlime brick.
- Sandlime brick keeps a pale, even colour.
