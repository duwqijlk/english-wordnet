simpleMeaning: in a way that has a lot of fine detail added to make a thing look beautiful
scope: This means done with much detail added for beauty; it is not done in a plain way and not in a simple
  way with little detail.
examples:
- The gate was ornately carved with leaves and birds.
- An ornately decorated box sat on the table.
