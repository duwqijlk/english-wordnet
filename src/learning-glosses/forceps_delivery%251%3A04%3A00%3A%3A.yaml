simpleMeaning: a birth helped by metal tongs passed through the vagina to grip and pull out the baby's
  head, mostly replaced by cesarean section because the tongs can injure the baby
scope: A vaginal birth assisted with tongs; not an unassisted birth and not a cesarean section, the operation
  that has largely replaced it.
examples:
- The doctor turned to a forceps delivery when the baby showed signs of distress.
- Forceps deliveries are far less common today than they once were.
