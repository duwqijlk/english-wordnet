simpleMeaning: Any of many fruits with thick skin and juicy flesh, such as oranges and lemons, grown in
  warm parts of the world.
scope: A fruit with thick skin and juicy flesh, grown in warm lands; not a fruit of cold lands, and not
  a vegetable.
examples:
- Citrus fruits hung heavy on the trees.
- She grows citrus in her warm garden.
