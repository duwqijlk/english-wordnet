simpleMeaning: In mathematics, i is a value that gives -1 when squared, and a + bi is this kind of value,
  with a and b as ordinary values
scope: In mathematics, a value of the form a + bi, also called a complex number, a complex quantity and
  imaginary; not an ordinary number on a number line and not a made-up number in a story.
examples:
- The teacher showed how an imaginary number can be drawn on a graph.
- You need an imaginary number to solve this equation, since no ordinary value works.
