simpleMeaning: used to show or make clear how something works or that something is true
scope: This sense means used to show or make a point clear; it is not the sense about openly showing feelings.
examples:
- He used a demonstrative model to show how the engine works.
- The chart is demonstrative and helps students see the change at once.
