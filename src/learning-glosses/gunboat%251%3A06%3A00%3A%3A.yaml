simpleMeaning: a small boat that can go in shallow water and carries guns fixed on it, used to watch and
  guard the coast
scope: A small boat with guns, used to guard the coast in shallow water; not a large war ship and not
  a boat for carrying people or goods.
examples:
- A gunboat watched the coast near the harbour.
- The small gunboat could sail in the shallow river.
