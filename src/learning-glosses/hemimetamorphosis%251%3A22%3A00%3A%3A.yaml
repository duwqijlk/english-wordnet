simpleMeaning: Only part of the change of shape happens as a young insect grows into an adult
scope: Only part of the change of shape as a young insect grows up, also called hemimetabolism and hemimetaboly,
  not a full change and not a change in other animals.
examples:
- Hemimetamorphosis is the way grasshoppers grow.
- In hemimetamorphosis, the young insect changes shape only a little.
