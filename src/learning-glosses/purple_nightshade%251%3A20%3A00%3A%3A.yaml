simpleMeaning: A nightshade, weedy, silver-leaved, with white, blue, or violet flowers and a roundish
  berry used widely for curdling milk across the middle United States as far south as South America.
scope: Also called prairie berry, silver-leaved nettle, silver-leaved nightshade, silverleaf nightshade,
  trompillo, and white horse nettle, it is a nightshade, weedy, silver-leaved, with white, blue, or violet
  flowers and a roundish berry used widely for curdling milk across the middle United States as far south
  as South America.
examples:
- Purple nightshade curdles milk.
- Purple nightshades grow from the middle United States down to South America.
