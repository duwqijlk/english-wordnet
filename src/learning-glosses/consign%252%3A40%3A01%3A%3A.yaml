senseId: 'consign%2:40:01::'
synsetId: 02353320-v
simpleMeaning: to hand something over or give it up for good, in a way that cannot be taken back or undone
scope: This means giving something up for good with no way back, not sending goods to a shop to be sold
  and not just leaving something with a person for a time.
examples:
- He consigned his old letters to the fire, never to see them again.
- She consigned the painful memory to the past and refused to return to it.
