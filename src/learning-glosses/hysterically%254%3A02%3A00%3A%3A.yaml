simpleMeaning: in a wild, out-of-control way, with cries and tears that a person cannot hold back
scope: Done in a wild, uncontrolled way, not done calmly and not done merely with great feeling.
examples:
- She screamed hysterically when she heard the news.
- He laughed hysterically, unable to stop himself.
