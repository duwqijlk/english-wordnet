simpleMeaning: The lower part of the large gut is looked at with a bendy tube with a light at its end,
  put into the body.
scope: This tube, also called a sigmoidoscope, is put into the body to look at the lower part of the large
  gut.
examples:
- A flexible sigmoidoscope was used to look at the lower part of the gut.
- The flexible sigmoidoscope showed the lower part of the large gut clearly.
