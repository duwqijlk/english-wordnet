simpleMeaning: A dull, aching feeling that stays with you for a long time
scope: This is a long-lasting dull pain of feeling, not a sharp pain in the body and not a short burst
  of grief.
examples:
- The mental anguish of losing her son stayed with her for years.
- He bore his mental anguish in silence, a dull ache that never quite left him.
