senseId: 'secularization%1:04:01::'
synsetId: 01157952-n
simpleMeaning: the process of changing something, such as art, schooling, society or morals, so that religion
  no longer rules or shapes it
scope: The process of changing something so that religion no longer rules or shapes it; secularisation
  is another name for this sense; not the loss of faith by one person and not a ban on religion.
examples:
- The secularization of schools took years to complete.
- Secularization of the courts followed the new constitution.
