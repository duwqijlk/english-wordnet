senseId: 'bowdlerise%2:30:00::'
synsetId: 00201398-v
simpleMeaning: to cut out or change parts of a text that are thought rude or unfit to read
scope: 'Also called bowdlerize, castrate, expurgate and shorten: to cut out or change the rude parts of
  a text, not to fix spelling and not to cut a text short for length.'
examples:
- The editor decided to bowdlerise the novel for young readers.
- They had to bowdlerise the play before it could be shown in schools.
