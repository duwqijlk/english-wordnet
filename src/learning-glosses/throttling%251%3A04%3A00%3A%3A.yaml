simpleMeaning: the act of making someone unable to breathe by pressing hard on the windpipe (the tube
  in the throat that air goes through)
scope: 'Also called choking, strangling, and strangulation: pressing on someone''s throat tube to stop
  them breathing, not breathing trouble caused by food stuck in the throat.'
examples:
- The throttling left marks on the man's throat.
- He was charged after the throttling of a shop worker.
