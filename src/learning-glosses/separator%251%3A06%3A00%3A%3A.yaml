simpleMeaning: A machine that spins a liquid fast so the tiny bits in it are thrown out to the sides and
  taken away.
scope: Also called a centrifuge or an extractor, a machine that spins a liquid so the tiny bits in it
  are thrown out.
examples:
- The separator spun the milk and took out the cream.
- They ran the mixture through a separator to take out the solid bits.
