senseId: 'immune_globulin%1:27:00::'
synsetId: 15055048-n
simpleMeaning: a set of proteins made in lymph tissue in animals with backbones, which work as defenders
  against sickness
scope: A set of body proteins that work as defenders against sickness; immune gamma globulin, immune serum
  globulin and immunoglobulin are other names for this sense, not a single protein and not a drug that
  kills germs directly.
examples:
- The immune globulin in his blood fought the sickness.
- Doctors gave him immune globulin after the bite.
