simpleMeaning: By eye or by an electric eye, this tool sets a light beside a known light to measure how
  bright it is.
scope: It is a tool that measures how bright a light is by setting it beside a known light.
examples:
- The photometer showed that the lamp was brighter than the standard.
- He used a photometer to measure the light.
