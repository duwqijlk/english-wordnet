simpleMeaning: a sound a person makes with the voice to show pain or that they do not like something
scope: A sound made with the voice to show pain or dislike, also called a groan, not the act of making
  such a sound.
examples:
- She let out a low moan when she hurt her knee.
- His moan showed he did not like the bad news.
