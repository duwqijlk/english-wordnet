simpleMeaning: the way you know where your body is and how it moves, and how hard your muscles are working
scope: 'Also called kinaesthesia and kinesthesia: knowing where your body is and how it moves, not seeing
  where it is and not hearing it move.'
examples:
- Her feeling of movement told her that her arm was raised even with her eyes closed.
- After the long walk, his feeling of movement was dull and his legs felt heavy.
