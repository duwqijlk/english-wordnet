simpleMeaning: a sudden and strong fall or complete breaking down
scope: 'Also called debacle: a sudden and strong fall or breaking down, not a slow fall or a small failure.'
examples:
- The building's sudden fall was a fiasco that shocked the whole town.
- When the bridge fell down without warning, it was a terrible fiasco.
