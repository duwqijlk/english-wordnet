simpleMeaning: Far low shots are hit with this golf club, whose shaft reaches far and whose face is steep
scope: A golf club with a far-reaching shaft and a steep face for far low shots, not a wood and not a
  short club for near shots.
examples:
- He took out his long iron for the shot across the fairway.
- Her long iron sent the ball low over the grass.
