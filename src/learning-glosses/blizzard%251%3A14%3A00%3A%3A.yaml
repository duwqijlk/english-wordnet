simpleMeaning: a lot of bad things that happen one after another, none of them expected
scope: 'Also called a rash: a sudden run of bad, unexpected events, not a snowstorm and not a single bad
  event.'
examples:
- A blizzard of lawsuits hit the company that year.
- After the scandal came a blizzard of angry letters.
