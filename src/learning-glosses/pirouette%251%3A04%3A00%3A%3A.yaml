simpleMeaning: In ballet, a fast spin of the body, especially on the toes
scope: In ballet, this is the fast spin itself, especially on the toes; it is not the verb for doing that
  spin.
examples:
- The dancer did a perfect pirouette on her toes.
- His pirouette ended with one leg high in the air.
