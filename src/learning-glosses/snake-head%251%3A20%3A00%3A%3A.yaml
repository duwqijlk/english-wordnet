simpleMeaning: A gay marsh perennial of east and mid North America, with waxy spear-like leaves, its bloom
  white-cream below, pink through to dark purple.
scope: This sense is also called turtlehead, shell-flower, shellflower, and snakehead.
examples:
- Snake-heads grow in the marsh.
- A snake-head bloomed pink and white.
