senseId: immaterial%5:00:00:unimportant:00
synsetId: 01283686-s
simpleMeaning: often used with 'to', not important and not making a difference one way or the other
scope: Not important, also called indifferent; it is not the sense about a thing having no body or form.
examples:
- The cost is immaterial to him; he will pay any price.
- Whether we leave now or later is immaterial, so choose the time you like.
