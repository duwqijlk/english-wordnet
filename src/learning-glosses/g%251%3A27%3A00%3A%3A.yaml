simpleMeaning: A small unit of DNA, made from a base found in it, with a deoxyribose sweet part and a
  phosphate part.
scope: A small unit of DNA, not the base guanine and not a letter; also called deoxyguanosine monophosphate,
  deoxyguanylate, deoxyguanylic acid, and dGMP.
examples:
- G is one of the small units that make up DNA.
- The lab found G in the DNA sample.
