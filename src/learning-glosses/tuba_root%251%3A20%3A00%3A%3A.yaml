simpleMeaning: a woody climbing plant with bright green leaves and sprays of white flowers touched with
  pink, whose thick roots hold the stuff called rotenone
scope: Also called derris root; a woody climbing plant whose thick roots hold rotenone, not a vine grown
  for its flowers alone.
examples:
- Tuba root climbs over the fence, its white flowers touched with pink.
- Farmers once dug up tuba root for the rotenone in its thick roots.
