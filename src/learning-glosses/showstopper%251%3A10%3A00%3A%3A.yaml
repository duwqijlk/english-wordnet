simpleMeaning: A turn in a show that stuns the crowd with how good it is, so the show must wait until
  they quiet down.
scope: Also called a stopper, a turn that brings the show to a halt while the crowd quiets down.
examples:
- Her solo was a showstopper, and the crowd cheered for five minutes.
- The showstopper brought the whole house to its feet.
