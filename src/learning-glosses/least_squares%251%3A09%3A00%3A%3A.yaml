simpleMeaning: A way to fit a smooth line or bend to measured points, keeping the total of the gaps, each
  times itself, as small as it can be.
scope: Also called the method of least squares, this way of fitting a smooth line or bend to measured
  points chooses the fit whose gaps, each times itself, add up to the least.
examples:
- The least squares fit gave a smooth bend through the measured points.
- Least squares chose the bend whose gaps added up to the least.
