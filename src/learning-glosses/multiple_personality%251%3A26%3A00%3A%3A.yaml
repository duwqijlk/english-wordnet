simpleMeaning: A relatively rare disorder in which the unity of a person's personality breaks down and
  two or more separate personalities appear
scope: Also called split personality, it is a rare break in which one person's sense of self splits into
  two or more separate selves.
examples:
- After the accident, doctors said his multiple personality showed two quite different selves.
- Her multiple personality made her act like two different people at different times.
