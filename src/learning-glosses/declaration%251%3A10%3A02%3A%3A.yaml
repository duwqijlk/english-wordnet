senseId: 'declaration%1:10:02::'
synsetId: 06748966-n
simpleMeaning: In law, words given without an oath that may still be taken as proof in a legal matter
scope: In law, this is a statement given without an oath that a court may take as proof, not a strong
  plain statement, not a list of goods for tax or duty, and not the top bid in bridge.
examples:
- His declaration of innocence was read to the court.
- The declaration was admitted as proof in the case.
