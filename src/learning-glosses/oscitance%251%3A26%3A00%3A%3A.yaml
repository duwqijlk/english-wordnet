simpleMeaning: Being sleepy and slow, shown by opening the mouth wide to take in air
scope: Sleepiness and slowness shown by yawning, also called oscitancy; not being merely tired and not
  the wide open-mouthed breath itself.
examples:
- His oscitance showed in a long yawn during the dull lecture.
- Oscitance crept over the class as the afternoon wore on and yawns spread.
