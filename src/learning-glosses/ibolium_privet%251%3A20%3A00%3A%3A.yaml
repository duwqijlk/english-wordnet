simpleMeaning: A shrub grown by joining two kinds of one shrub group, whose branches grow fast and crowd
  close together.
scope: Also called ibota privet, this shrub is a cross of two kinds of one shrub group, not a plant of
  one kind only.
examples:
- The ibolium privet along the fence grows fast and fills in thick.
- We planted an ibolium privet to screen the yard from the road.
