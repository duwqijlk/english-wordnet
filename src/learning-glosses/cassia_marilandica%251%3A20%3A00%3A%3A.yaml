simpleMeaning: A North American herb that lives year after year, whose leaves are used as medicine and
  which is sometimes placed in the genus Cassia.
scope: A North American herb that lives year after year, also called wild senna and Senna marilandica;
  not an annual herb that dies in one year.
examples:
- Cassia marilandica comes back year after year.
- The leaves of Cassia marilandica are used as medicine.
