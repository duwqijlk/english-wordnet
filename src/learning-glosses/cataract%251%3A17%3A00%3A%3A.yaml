simpleMeaning: a large waterfall, where water rushes hard over a high steep edge of rock
scope: This sense is water falling hard over rock, not the eye disease of the same name where the eye
  becomes cloudy.
examples:
- The river ends in a wide cataract that falls over the rocks.
- Mist rose from the cataract as the water rushed over the edge.
