simpleMeaning: to hit something hard again and again with a heavy tool like a large hammer
scope: To hit with a heavy tool, not the insect with hard wing covers and not to fly or go in a way like
  that insect.
examples:
- He beetled the clay hard to make it flat and firm.
- The workers beetled the stones again and again with heavy wooden tools.
