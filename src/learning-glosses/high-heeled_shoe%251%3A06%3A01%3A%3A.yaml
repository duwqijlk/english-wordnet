simpleMeaning: In this kind of shoe, the back of the foot is held well above the toes by a tall raised
  part at the back.
scope: Also called high heels and high heels shoe, this is a shoe with a tall raised back part, not a
  flat shoe.
examples:
- She bought a pair of high-heeled shoes for the wedding.
- The high-heeled shoe lifted her back foot well above her toes.
