simpleMeaning: A leading school of early Greek thought before Socrates, named for its home in the Greek
  colony of Elea in south Italy, a town also called Velia.
scope: One of the leading schools of ancient Greek thought before Socrates, based in the Greek colony
  of Elea in south Italy; it is the thought of the time before Socrates, not the thought of Socrates himself.
examples:
- Her essay on Eleaticism traced its roots to Parmenides and Elea.
- His book on Eleaticism looks at the early Greek school based at Elea in south Italy.
