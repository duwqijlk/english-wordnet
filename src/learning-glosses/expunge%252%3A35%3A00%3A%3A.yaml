senseId: 'expunge%2:35:00::'
synsetId: 01552202-v
simpleMeaning: to take something out by rubbing it out, crossing it out, or treating it as if a line were
  drawn through it
scope: 'Also called strike, scratch, and excise: taking words out on a page by rubbing or a line through
  them, not hitting something and not cutting skin.'
examples:
- The teacher asked him to expunge the wrong word from his list.
- She expunged the name by drawing a line through it.
