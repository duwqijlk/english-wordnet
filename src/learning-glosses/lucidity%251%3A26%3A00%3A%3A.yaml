simpleMeaning: a state of mind that is clear and not confused
scope: This is a clear state of mind in a person, not the clearness of writing or speech that makes it
  easy to understand.
examples:
- After days of illness, she had a short time of lucidity and spoke clearly to her family.
- His lucidity returned, and he knew where he was and who we were.
