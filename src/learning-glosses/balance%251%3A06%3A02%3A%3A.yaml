simpleMeaning: A small wheel inside a machine that holds its speed steady, especially one that swings
  against a fine spring to keep a clock or watch on time.
scope: This is the moving wheel inside a machine or clock, not the weight that counterbalances another
  weight and not a weighing scale.
examples:
- The watchmaker cleaned the balance and oiled the spring.
- A worn balance can make a clock run fast.
