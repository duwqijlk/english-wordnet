simpleMeaning: To force a duty, burden, or punishment on someone.
scope: This is the verb for forcing a duty or punishment on someone, not the common verb for putting something
  down, nor the nouns for a story poem or song.
examples:
- The court laid a heavy fine on the company.
- The new law lays a duty on employers to keep records.
