simpleMeaning: An electric device that switches a lamp on and off by itself, such as for a shop sign.
scope: An electric device that blinks a lamp on and off, not a person who shows their body and not a flashing
  signal light.
examples:
- The flasher made the shop sign blink all night.
- A flasher in the display turns the lights on and off.
