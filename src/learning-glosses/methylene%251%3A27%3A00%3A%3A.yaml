simpleMeaning: A part of a molecule, CH2, with two free links, that comes from methane.
scope: A part of a molecule, CH2, with two free links, that comes from methane, also called a methylene
  group or a methylene radical; not the part with one free link and not the whole methane molecule.
examples:
- Methylene is the CH2 part that comes from methane.
- A methylene part has two free links.
