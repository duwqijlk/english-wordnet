simpleMeaning: A small plant of South America that grows on other plants and has round lumps along its
  underground stems
scope: This is a small South American plant that grows on other plants, not the large Australasian fern
  whose underground stem is eaten.
examples:
- The potato fern grows on the trunk of a big tree.
- We saw a potato fern with round lumps along its underground stems.
