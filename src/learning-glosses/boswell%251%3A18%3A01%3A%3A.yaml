simpleMeaning: A person who loves and admires another person deeply, and writes down what that person
  says and does.
scope: It names a person whose deep love for one other person shows in a written record of that person's
  words and deeds, and it is about the admirer, not the person admired.
examples:
- James Boswell wrote down all that Dr Johnson said and did.
- A true Boswell follows the person admired and records every word.
