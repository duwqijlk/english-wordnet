simpleMeaning: like a loud sound of something being torn apart by force, or of a tree being broken apart
  by lightning
scope: 'Also called ripping and splitting: like a loud tearing sound, not a quiet, soft, or pleasant sound.'
examples:
- A rending roar rose as the crowd pushed forward.
- The rending sound of the tree splitting in the storm filled the air.
