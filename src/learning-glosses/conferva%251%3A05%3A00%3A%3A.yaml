simpleMeaning: With branching threads that make scum on still or stagnant fresh water, this is one of
  several kinds of water plant from the group Tribonema.
scope: This water plant makes scum on still or stagnant fresh water; it is not a land plant and not a
  sea plant.
examples:
- Conferva made scum on the still water.
- The conferva formed scum where the water stood still.
