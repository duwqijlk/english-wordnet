simpleMeaning: 'The body''s response to high-energy rays from radioactive or nuclear sources: light doses
  bring diarrhea, nausea, vomiting, hair loss; heavier doses bring sterility, cataracts, cancers; extreme
  doses kill within hours.'
scope: 'This is the same condition as radiation sickness: the illness that follows too much high-energy
  ray exposure, not the rays themselves or the treatment of disease with radioactive material.'
examples:
- Doctors diagnosed radiation syndrome after his long exposure at the site.
- Acute radiation syndrome can be fatal at very high doses.
