simpleMeaning: A doctor's tool gauging heart-beat push and blood flow through the heart over a set time,
  from the body's kick-back as blood leaves the heart's lower rooms.
scope: This sense is also called cardiograph, a doctor's tool gauging heart-beat push and blood flow through
  the heart over a set time, from the body's kick-back as blood leaves the heart's lower rooms.
examples:
- The ballistocardiograph gauges the push of heart beats.
- Ballistocardiographs measure blood flow.
