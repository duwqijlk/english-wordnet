simpleMeaning: the act of throwing your body down so that you fall and sink down
scope: The act of throwing your body down; not falling down because you are tired or ill, not breaking
  down in your mind, and not a sudden fall in business or prices.
examples:
- With one great collapse, she threw herself down onto the bed.
- He landed on the cushions in a loose collapse after throwing himself down.
