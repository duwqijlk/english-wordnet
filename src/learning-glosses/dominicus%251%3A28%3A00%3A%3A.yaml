simpleMeaning: Most Christians rest and worship on this day, the first day of the week.
scope: The first day of the week, a day of rest and worship for most Christians; Sun, Sunday and Lord's
  Day are other names for this sense. Not any other day of the week.
examples:
- We rest on Dominicus and go to church.
- Most shops stay shut on Dominicus.
