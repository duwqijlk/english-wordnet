simpleMeaning: music that people in a community pass on from older people to younger people, usually with
  no known maker, and that shows how people there live
scope: This is a kind of music, not the people of a place themselves and not a story passed on in words.
examples:
- The band plays folk that tells stories about farm life.
- He learned folk from singers in his home town.
