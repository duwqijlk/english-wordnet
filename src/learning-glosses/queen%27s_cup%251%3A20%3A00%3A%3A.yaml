simpleMeaning: From Alaska to California and east to Oregon and Montana, this plant bears one or two white
  star-shaped flowers on short stalks with no leaves.
scope: Also called bride's bonnet, this plant stands apart from other plants with white flowers by its
  one or two star-shaped flowers on short, leafless stalks.
examples:
- The queen's cup bore one white star-shaped flower.
- Queen's cup grew in Alaska and Montana.
