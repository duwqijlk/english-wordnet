simpleMeaning: The clear liquid in which the unborn child floats inside the sac around it.
scope: 'Also called waters and amnionic fluid: the clear liquid in which the unborn child floats inside
  the sac around it, not the blood of the mother and not the liquid in the stomach.'
examples:
- The amniotic fluid cushions the unborn child.
- Doctors can test the amniotic fluid before birth.
