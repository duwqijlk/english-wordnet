simpleMeaning: a person who says that money or other help, a right, or a title is theirs
scope: A person who says money or other help, a right, or a title should be theirs; not a person who already
  holds it and not a person who gives it.
examples:
- Claimants for help with money must fill in a form first.
- He was a claimant to the throne and said he should be king.
