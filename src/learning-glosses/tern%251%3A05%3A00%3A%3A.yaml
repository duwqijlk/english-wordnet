simpleMeaning: a small, thin gull with narrow wings and a tail that splits into two points at the end
scope: This is the small, thin sea bird with narrow wings and a tail that splits at the end, not a larger
  gull with no split in its tail.
examples:
- A tern flew low over the sea with its narrow wings spread.
- The tern's tail split into two points as it turned in the air.
