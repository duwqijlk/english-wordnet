simpleMeaning: In music, the first time a play or piece of music is shown in public anywhere
scope: The first public showing of a play or piece of music anywhere in the world, not a first night in
  one town only and not a later repeat performance.
examples:
- The new opera had its world premiere in Vienna last spring.
- Critics from many countries came to the world premiere of the play.
