simpleMeaning: One of the ways of speaking used by the Lapp people, generally held to be part of the Uralic
  family of tongues
scope: One of the Lapp ways of speaking, also called Lappic, Lappic language and Lappish; not the Lapp
  people themselves and not one single tongue, since it covers several.
examples:
- Lappish language is one of the tongues of the far north.
- She grew up hearing Lappish language at home.
