simpleMeaning: A small tool held in the hand for opening closed bottles or cans
scope: A hand tool for opening sealed bottles or cans; not a person who opens things and not the first
  act of a show.
examples:
- He used an opener on the bottle of juice.
- The opener lay beside the cans on the shelf.
