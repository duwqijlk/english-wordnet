simpleMeaning: Grown in many kinds, this wild fruit of the eastern United States has tough skins that
  slip off the flesh with ease, dark purple-black in colour.
scope: This names the wild fruit of the eastern United States, dark purple-black with skins that slip
  off the flesh, not the native kind known as the parent of cultivated kinds such as Concord grapes.
examples:
- She picked fox grapes in the eastern United States.
- She picked fox grapes whose skins slipped off the flesh.
