simpleMeaning: small cubes of meat left in a tasty sauce to take in its taste, then cooked on a thin long
  stick, usually with vegetables
scope: Also called kabob and shish kebab. This is meat cooked on a stick, usually with vegetables, not
  meat cooked in a pot or on a flat pan.
examples:
- He grilled a kebab of lamb and peppers for lunch.
- The kebabs were served hot, straight off the stick.
