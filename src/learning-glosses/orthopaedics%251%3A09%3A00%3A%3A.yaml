simpleMeaning: The part of medicine that deals with faults or bent shapes of the spine and joints
scope: 'Also called orthopedics: the medicine of spine and joint faults, not the medicine of the skin
  and not the medicine of the mind.'
examples:
- He studied orthopaedics to treat bent spines and bad joints.
- Orthopaedics covers faults of the spine and the joints.
