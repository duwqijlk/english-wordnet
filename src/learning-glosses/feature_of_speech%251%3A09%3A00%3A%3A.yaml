simpleMeaning: In linguistics, a mark of a language unit that sets it apart from other units of the same
  kind
scope: In linguistics, a mark that sets one language unit apart from others of the same kind, also called
  a feature; not a sound on its own and not a word's meaning.
examples:
- The feature of speech sets this sound apart from others.
- Linguists study each feature of speech in the language.
