simpleMeaning: a room in an inn or club where guests are met and welcomed
scope: A room for meeting guests in an inn or club, not a sitting room in a private home.
examples:
- Guests waited in the parlor of the small inn.
- The club parlor was full of visitors talking and drinking tea.
