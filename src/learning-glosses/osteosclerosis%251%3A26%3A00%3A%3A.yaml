simpleMeaning: Bone turns hard in a way it should not, growing as hard as ivory
scope: Bone that has grown too hard in a wrong way, not bone that breaks down from sickness and not bone
  that is hard in a healthy way.
examples:
- Osteosclerosis made the bone show up bright white on the scan.
- The doctor said osteosclerosis was the cause of the hard, thick bone.
