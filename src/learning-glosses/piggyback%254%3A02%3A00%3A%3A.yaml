simpleMeaning: carried on a person's back or shoulder, or sitting on their hip with legs on both sides
scope: Carried on a person's back or shoulder, or on their hip with legs on both sides; not the noun name
  for the act of carrying in this way, and not the verb sense about moving truck loads by train.
examples:
- She carried her tired son piggyback up the stairs.
- The child rode piggyback on his father's shoulders.
