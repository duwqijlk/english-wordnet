simpleMeaning: of a nerve thread or signal that starts outside the brain and the cord of nerves in the
  back and travels in toward them
scope: Of a nerve signal travelling in toward the brain and the cord of nerves in the back; not of the
  senses in general, and not a signal going out to the muscles.
examples:
- Sensory nerves carry touch signals to the brain.
- The sensory signal reached the brain in a flash.
