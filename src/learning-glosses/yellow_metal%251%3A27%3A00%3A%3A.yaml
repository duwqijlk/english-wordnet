simpleMeaning: a kind of brass with more zinc in it than alpha brass, stronger than alpha brass, used
  to make castings and things shaped while hot
scope: A kind of brass with more zinc, also called alpha-beta brass; not plain copper and not steel.
examples:
- Yellow metal is used to make castings.
- The valve was cast in yellow metal.
