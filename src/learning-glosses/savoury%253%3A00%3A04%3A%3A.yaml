senseId: 'savoury%3:00:04::'
synsetId: 01632017-a
simpleMeaning: Good and decent in a moral sense, or fit to be accepted.
scope: Also called savory, this is what is good and decent in a moral sense, or fit to be accepted, not
  a sweet-smelling or spicy dish served at the end of dinner or as a first course, and not either of the
  two sweet-smelling herbs from the mint family.
examples:
- His past was scarcely savoury, and few trusted him.
- Her record was savoury, and no one could find fault with it.
