simpleMeaning: the distance from one end of a fixed object to the other, measured along its greatest extent
scope: This is not the amount of time something lasts, and not the distance covered by something that
  moves.
examples:
- The table has a length of two meters.
- Measure the length of the wall before you buy the shelf.
