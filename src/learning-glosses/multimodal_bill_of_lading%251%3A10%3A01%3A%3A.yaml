simpleMeaning: A paper given for goods that are sent on a trip using two or more ways of travel
scope: 'Also called a combined transport bill of lading: a paper given for goods sent by two or more ways
  of travel, not a paper for goods sent by one way only and not a paper for goods that stay in one place.'
examples:
- The multimodal bill of lading covered the whole trip, from truck to ship.
- They gave us a multimodal bill of lading when the goods went by road and then by sea.
