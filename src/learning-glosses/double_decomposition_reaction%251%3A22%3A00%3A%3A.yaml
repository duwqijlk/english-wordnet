simpleMeaning: Parts change hands between two compounds, chemicals made of joined parts, and two new compounds
  come out of the swap (AB+CD=AD+CB).
scope: This chemical reaction, also called double decomposition and metathesis, trades parts between two
  compounds to make two new compounds.
examples:
- The double decomposition reaction gave two new compounds.
- We watched a double decomposition reaction in the school lab.
