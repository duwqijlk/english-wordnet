simpleMeaning: With more than one thread at times, this sewing is done by a device that sews
scope: A line of sewing made by a device that sews, not a line sewn by hand and not a kind of cloth.
examples:
- She finished the hem with a neat machine stitch.
- The machine stitch on the cuff came loose after one wash.
