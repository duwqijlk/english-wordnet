simpleMeaning: earth that has taken in a lot of water; soft, wet ground
scope: 'Also called mud: soft, wet earth. It is not the very fine soil that is soft when wet but hard
  when heated.'
examples:
- Her boots sank into the soft clay by the river.
- After the rain, the ground was wet clay and their shoes got stuck in it.
