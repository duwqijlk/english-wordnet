simpleMeaning: a wild false belief, especially one caused by a drug that makes a person see things that
  are not there
scope: A wild false belief, especially from such a drug; not the short feeling of not knowing where you
  are or which way to go.
examples:
- The drug gave him disorientation, and he thought the walls were speaking to him.
- In his disorientation, he believed strangers were following him everywhere.
