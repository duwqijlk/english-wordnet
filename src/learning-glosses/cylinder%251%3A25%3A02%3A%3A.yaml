simpleMeaning: A solid shape with a round side and two flat ends that lie level with each other.
scope: A solid shape with a round side and two flat ends, not a round box for gas, not a chamber for a
  piston, and not the round surface itself.
examples:
- A cylinder has two flat round ends.
- The solid was a perfect cylinder, smooth and even.
