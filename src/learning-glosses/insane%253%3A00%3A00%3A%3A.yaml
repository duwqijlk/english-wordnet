simpleMeaning: having a mind that is very ill, or showing this kind of illness
scope: This describes a serious illness of the mind in a person, or behaviour that shows it; it does not
  mean only angry, wild, or foolish in everyday talk.
examples:
- The court found him insane and sent him to a hospital for care.
- Insane laughter came from the empty room all night.
