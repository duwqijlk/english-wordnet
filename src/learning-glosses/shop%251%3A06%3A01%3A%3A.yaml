simpleMeaning: A small workplace where things are made or crafts are done by hand.
scope: This is not a place that sells things to customers and not a school class; it is a small place
  where goods are made.
examples:
- The carpenter keeps his tools and timber in a small shop behind the house.
- Sparks flew as the welder worked in his shop.
