senseId: 'renal_pelvis%1:08:00::'
synsetId: 05604197-n
simpleMeaning: Urine from the blood-cleaning organ first gathers in a funnel-shaped hollow at its outlet,
  before running down a tube
scope: Also called pelvis, it is the funnel-shaped hollow where urine gathers, not the organ itself and
  not the tube it runs down.
examples:
- The ureter carries urine away from the renal pelvis.
- The renal pelvis sits where the kidney meets the tube that carries urine on.
