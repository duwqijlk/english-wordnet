simpleMeaning: The sounds made by singers or people playing instruments, or a playback of those sounds.
scope: This is audible sound, not the art or system of music, not pleasant natural sounds, not the activity
  of singing or playing, and not punishment for one's actions.
examples:
- The music from the orchestra filled the hall.
- He fell asleep to the music playing softly on the radio.
