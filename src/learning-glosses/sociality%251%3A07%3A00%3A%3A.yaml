simpleMeaning: the way a person or animal tends to spend time with others and to form groups with them
scope: This is the tendency to be with others and form groups, not a well-known person at parties and
  not one single act of meeting others.
examples:
- Wolves show strong sociality and live and hunt in groups.
- Human sociality helps babies learn from the people around them.
