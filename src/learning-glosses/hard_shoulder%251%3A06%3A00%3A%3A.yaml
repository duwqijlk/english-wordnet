simpleMeaning: A flat strip of paved ground beside a fast main road, where a driver can stop in an emergency.
scope: This is a flat strip of paved ground beside a fast main road for stopping in an emergency, not
  a driving lane or a lay-by.
examples:
- He pulled onto the hard shoulder to change the tyre.
- Never drive on the hard shoulder.
