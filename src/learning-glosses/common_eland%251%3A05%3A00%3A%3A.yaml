simpleMeaning: a large antelope with dark yellow-brown fur, found in southern and eastern Africa
scope: A large African antelope with dark yellow-brown fur, found in the south and east of Africa; not
  a small antelope and not one from western Africa.
examples:
- A common eland stood at the edge of the herd.
- We saw a common eland graze on the dry grass in Kenya.
