simpleMeaning: a wrong act that breaks a law, a duty, or a rule of right and wrong
scope: 'Also called transgression: a wrong act that breaks a law, a duty, or a rule of right and wrong,
  not a mistake made by chance and not a small fault.'
examples:
- His evildoing cost him the trust of his friends.
- The judge spoke of the evildoing that had harmed so many people.
