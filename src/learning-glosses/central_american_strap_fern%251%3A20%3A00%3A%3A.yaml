simpleMeaning: A plant with long thin leaves and no flowers, with shorter and narrower leaves than its
  Florida relative, found from Florida to West Indies and Mexico and south to Argentina.
scope: 'Also called narrow-leaved strap fern or Campyloneurum augustifolium: a plant with long thin leaves
  and no flowers, with leaves shorter and narrower than those of the Florida strap fern, found from Florida
  to Argentina.'
examples:
- Central American strap ferns grew in the shade.
- We saw a Central American strap fern by the stream.
