simpleMeaning: a bush or small tree with flowers in spring, of the Crataegus group (a group of plants
  that are closely related to each other)
scope: 'Also called hawthorn: a bush or small tree in the Crataegus group, not other bushes or trees with
  spring flowers outside that group.'
examples:
- The haw in our garden has white flowers in spring.
- A haw grew by the path, small and full of flowers in May.
