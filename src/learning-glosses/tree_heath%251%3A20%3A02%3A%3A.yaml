simpleMeaning: A thin, bare-looking evergreen woody plant of Tasmania, with long narrow leaves that taper
  to a point and grow 3 to 5 feet long
scope: A thin evergreen woody plant of Tasmania with long tapering leaves, also called grass tree; not
  a low heather bush and not a plant with short round leaves.
examples:
- The tree heath stood bare and gaunt on the hillside.
- Tree heath leaves can grow up to 5 feet long.
