simpleMeaning: Pupils who paid nothing and were picked by the local council were taken in by this old
  learning place, which charged fees yet also took money from the state.
scope: This was a place of learning of the past that charged fees for teaching and took money from the
  state for taking in pupils who paid nothing.
examples:
- Her father paid fees at a direct-grant school.
- The direct-grant school also took money from the state.
