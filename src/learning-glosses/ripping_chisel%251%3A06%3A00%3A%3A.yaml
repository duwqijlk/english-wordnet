simpleMeaning: a long hand tool with a cutting end that bends a little, used to lever things apart with
  force or to clean out narrow holes for joints
scope: A long hand tool with a cutting end that bends a little; not a straight chisel for fine work, and
  not a crowbar.
examples:
- He used the ripping chisel to lift the old floorboard.
- A ripping chisel cleaned out the mortise.
