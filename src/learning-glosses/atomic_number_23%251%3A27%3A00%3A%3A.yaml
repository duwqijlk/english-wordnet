simpleMeaning: A soft grey-white metal that can poison, used in mixtures that make steel; found in several
  kinds of stone, among them carnotite and vanadinite.
scope: A soft grey-white metal that can poison, also called V and vanadium; set apart from other metals
  used to make steel and from metals that are safe to touch.
examples:
- Atomic number 23 is used in mixtures that make steel.
- Miners find atomic number 23 in carnotite and vanadinite.
