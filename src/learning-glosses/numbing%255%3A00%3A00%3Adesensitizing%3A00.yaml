simpleMeaning: Making a part of the body, or the mind, feel nothing
scope: Causing a body part or the mind to feel nothing, not putting someone to sleep and not making something
  less loud.
examples:
- The numbing effect of grief left her unable to cry.
- The cold had a numbing effect on his fingers.
