simpleMeaning: Far kin to the eastern and central kinds, these apes of the west of Africa have masked
  or pale faces; they may be a kind on their own.
scope: This name covers chimpanzees of the west of Africa alone, far kin to the eastern and central kinds.
examples:
- We saw a western chimpanzee with a pale face.
- Western chimpanzees are far kin to the eastern kinds.
