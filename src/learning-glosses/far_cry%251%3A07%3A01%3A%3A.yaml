schema: oewn-learning-gloss-v2
senseId: 'far_cry%1:07:01::'
synsetId: 04759989-n
simpleMeaning: A big gap between what was hoped for and what is, so different that the two seem to belong
  to separate worlds
scope: A big gap between what was hoped for and what came, not a small difference and not a loud call.
examples:
- Her new job was a far cry from the one she had left behind.
- The meal was a far cry from what the menu had promised.
