simpleMeaning: a pale yellow to brown liquid fat made from rapeseed that people can eat, and also used
  to help things move smoothly or to give light
scope: A pale yellow to brown liquid fat from rapeseed that can be eaten and also used to help things
  move smoothly or give light, also called rape oil and rapeseed oil, and not a dark cooking fat.
examples:
- She fried the fish in colza oil because it stays light and clear.
- The old lamp burned colza oil, and the mill used it to keep the gears turning.
