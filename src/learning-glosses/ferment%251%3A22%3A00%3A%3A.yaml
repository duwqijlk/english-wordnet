simpleMeaning: a process in which something makes a natural substance break down into simpler parts; above
  all, the breaking down of sugar into alcohol without air
scope: A process in which something makes a natural substance break down into simpler parts, above all
  sugar into alcohol without air; not a substance that causes this change and not a drink made by it.
examples:
- During the ferment, the sugar slowly turned into alcohol.
- The slow ferment gave the bread its sour taste.
