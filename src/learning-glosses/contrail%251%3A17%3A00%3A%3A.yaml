simpleMeaning: A plane leaves this man-made cloud behind as it flies, when air above its wing thins and
  turns to drops, or when water in its engine gas does so.
scope: This is a man-made cloud left behind by a plane in the sky, also called a condensation trail, and
  not a cloud that forms on its own.
examples:
- We could see a contrail in the sky.
- The plane left a contrail in the sky.
