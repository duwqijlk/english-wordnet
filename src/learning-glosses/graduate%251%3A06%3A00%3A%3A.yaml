simpleMeaning: A glass cup, tube, or bottle with marks on its sides that show how much liquid it holds
scope: A marked glass cup or tube for measuring liquid, not a person who has finished a course of study
  and not the act of marking out a scale.
examples:
- Pour the liquid into the graduate and read the mark.
- The graduate held fifty millilitres of water.
