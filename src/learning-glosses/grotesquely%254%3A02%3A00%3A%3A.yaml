simpleMeaning: in a strange and ugly way that looks wrong and not natural
scope: This is about how something looks or is done in a strange and ugly way, not just in a very bad
  way and not a name for a strange ugly thing.
examples:
- The figures lay grotesquely twisted on the ground behind the house.
- His face was grotesquely stretched in the old painting.
