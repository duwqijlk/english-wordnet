senseId: 'human_right%1:07:00::'
synsetId: 05184373-n
simpleMeaning: In law, a basic freedom that belongs to every person, that no government may block, such
  as life, liberty, freedom of thought and expression, and being equal before the law
scope: In law, this is a basic freedom belonging to every person that no government may block; not a freedom
  given by one country alone and not a favour a ruler may grant or take away.
examples:
- Everyone has a human right to speak freely.
- The court said the law broke a basic human right.
