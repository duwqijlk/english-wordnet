simpleMeaning: A swelling on the eyelid, where a tiny gland that makes oil has become infected
scope: An infected swelling on the eyelid, also called a sty and an eye infection; not a sore on the eye
  itself or a swelling elsewhere on the face.
examples:
- The hordeolum on her eyelid was red and sore.
- He had a hordeolum that made it hurt to blink.
