simpleMeaning: A Chadic tongue south of Lake Chad, above all in the North Region, Mayo-Louti, round Guider
  and Figuil, and in a small part of Diamare in the Far North Region
scope: A Chadic tongue of the land south of Lake Chad, in the North and Far North Regions, not a tongue
  of the north bank or of the coast; also called Gidar.
examples:
- Gidar language is spoken south of Lake Chad.
- He learned Gidar language from his mother in the North Region.
