simpleMeaning: the position and power of a ruler or a bishop (a high church leader) with the right to
  sit in a special chair at formal events
scope: This sense is the position and power, not the special chair itself and not a toilet; it is about
  rank and power for a ruler or a high church leader.
examples:
- He gave up the throne after losing the war and left the country.
- She came to the throne as a young queen and held great power.
