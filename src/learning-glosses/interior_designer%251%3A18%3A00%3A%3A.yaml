simpleMeaning: a person whose job is to plan the look of the inside of rooms and buildings
scope: A person who plans how the inside of rooms and buildings should look, also called designer; not
  a builder and not a person who plans the outside of a building.
examples:
- The interior designer chose soft colours for the small flat.
- We hired an interior designer to plan the new office.
