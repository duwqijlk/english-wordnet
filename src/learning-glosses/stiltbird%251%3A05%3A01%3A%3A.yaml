simpleMeaning: Three toes and long thin legs mark this black-and-white wader of inland ponds, marshes,
  or salty lagoons.
scope: Also called stilt, longlegs, long-legs, and stilt plover; a black-and-white wader of inland ponds
  and marshes or salty lagoons.
examples:
- A stiltbird picked its way across the lagoon.
- The stiltbird's long legs kept it clear of the water.
