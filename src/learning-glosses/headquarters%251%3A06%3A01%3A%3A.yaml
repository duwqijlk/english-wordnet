simpleMeaning: the main office of a company or group, from which its work is run, usually used in the
  plural
scope: 'Usually used in the plural: this is a company''s main office, from which its work is run, not
  an army place for a leader and not a group of army leaders and their helpers.'
examples:
- Many companies have their headquarters in New York.
- The bank's headquarters are in London, with smaller offices in other cities.
