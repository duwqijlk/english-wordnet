simpleMeaning: Germs that cause two sicknesses spread by sex, one of them the sickness named after this
  germ, the other lymphogranuloma venereum.
scope: Germs that cause two sicknesses spread by sex, not a germ that causes a sickness of the lungs or
  of the gut; also called C. trachomatis.
examples:
- Chlamydia trachomatis spreads through sex and must be treated.
- Doctors test for Chlamydia trachomatis with a simple swab.
