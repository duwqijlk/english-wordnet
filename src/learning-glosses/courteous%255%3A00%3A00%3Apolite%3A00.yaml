simpleMeaning: With good manners and respect in the way you treat others.
scope: This is good manners shown in how you act toward others, also called nice or gracious, and it is
  close to the other courteous sense of being marked by courtesy and good manners in character, not rude
  or cold behaviour.
examples:
- The waiter was courteous and held the door for us.
- Her reply was courteous even though the letter was rude.
