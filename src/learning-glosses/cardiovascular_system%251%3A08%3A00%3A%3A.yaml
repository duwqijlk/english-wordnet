simpleMeaning: the organs and body tissues that carry blood and lymph, a clear liquid, around the body
scope: 'Also called the circulatory system: the body parts that move blood and lymph, not the heart alone
  and not the breathing parts alone.'
examples:
- The cardiovascular system carries blood to every part of the body.
- A weak cardiovascular system may not move blood well around the body.
