simpleMeaning: said or used so often that it has become too familiar to feel fresh
scope: This is not about needing rest or sleep; it describes words, jokes or ideas worn out by overuse.
examples:
- The speech was full of tired jokes about the weather.
- The film relies on tired old plot twists.
