simpleMeaning: A small part added to the end of a root word that changes how the word is used
scope: 'Also called inflectional suffix: a small part added to the end of a root word, not a change inside
  the word and not a whole new word.'
examples:
- The inflectional ending -s makes the word plural.
- An inflectional ending can show that the action happened in the past.
