synsetId: 02801928-n
simpleMeaning: the main substance in a mixture, to which the other parts are added.
scope: This is not the chemical that neutralises acid or the bottom of a shape; it is the largest or most
  important part of what something is made of.
examples:
- Olive oil is the base of this dressing, with vinegar and herbs added.
- The sauce has a base of tomatoes and garlic.
