senseId: 'catamenia%1:22:00::'
synsetId: 13534950-n
simpleMeaning: the blood that flows each month from the womb of a woman who is not with child, from puberty
  until her monthly bleeding stops
scope: Monthly bleeding, also called flow, period, menstruation, menses and menstruum; not a wound and
  not bleeding after birth.
examples:
- Catamenia begin at puberty in most girls.
- The catamenia stopped when she reached menopause.
