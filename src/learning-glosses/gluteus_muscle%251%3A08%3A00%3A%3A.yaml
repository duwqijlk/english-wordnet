simpleMeaning: There are three big bands of flesh that make the buttock, and this is one of them; they
  move the thigh
scope: One of three large muscles that form the buttock and move the thigh, also called glute, gluteal
  muscle and gluteus; not a vein and not a muscle of the arm.
examples:
- The gluteus muscle helps lift the leg behind you.
- His gluteus muscle ached after hours of cycling.
