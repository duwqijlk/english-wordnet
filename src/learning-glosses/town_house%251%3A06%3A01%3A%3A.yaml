simpleMeaning: A home in a row of matching homes joined side by side, so each home shares a wall with
  the next one
scope: A home in a row of matching homes with shared walls; row house is another name for this sense.
  Not a house that stands alone and not a block of flats.
examples:
- They bought a town house in a row of matching homes.
- Our town house shares a wall with the home next door.
