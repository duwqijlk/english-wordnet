simpleMeaning: one of many parts that are all the same shape and size and that stick out from a gear
scope: This is a part on a gear, not the hard white part in your mouth used for biting, and not a thing
  that only looks like that mouth part.
examples:
- One tooth on the gear broke, so the machine stopped turning.
- Each tooth on this gear must be the same size and shape.
