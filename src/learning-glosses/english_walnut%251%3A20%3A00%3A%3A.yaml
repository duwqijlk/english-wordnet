simpleMeaning: A tree of Europe and Asia, prized for its large nuts that can be eaten and for its hard
  wood with a rich pattern; grown in many places.
scope: A tree of Europe and Asia prized for its large nuts and its hard wood with a rich pattern, also
  called Circassian walnut, English walnut tree, Juglans regia and Persian walnut; not the nut alone,
  which is the same word in another sense.
examples:
- The English walnut in the orchard gives large nuts each year.
- English walnut wood has a rich pattern prized by makers of fine boxes.
