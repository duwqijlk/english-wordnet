simpleMeaning: The fine, soft, thick, short hair on animals such as cattle and deer, or the wool of sheep
  and undercoat of some dogs.
scope: The soft coat on an animal's body, not the raised threads of a fabric and not a heap of things;
  down is another name for this sense.
examples:
- A deer's winter pile is short and dense.
- The dog's thick pile felt soft under my hand.
