simpleMeaning: A rectangular tiered temple or terraced mound built by the ancient Assyrians and Babylonians.
scope: Also called ziggurat and zikurat, this four-sided stepped temple or flat-topped mound was built
  by the ancient Assyrians and Babylonians.
examples:
- The zikkurat rose in wide steps.
- The steps of the zikkurat led up to the temple.
