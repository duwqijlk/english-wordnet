simpleMeaning: A loud, long, high sound used to warn people
scope: This is the loud warning sound itself, not the device that makes the sound, and not the water animal
  with small front legs and no back legs.
examples:
- We heard a siren and moved out of the way of the fire truck.
- An air raid siren warned people to take cover at once.
