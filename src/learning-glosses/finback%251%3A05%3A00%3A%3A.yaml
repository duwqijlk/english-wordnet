simpleMeaning: 'Its throat is scored with deep grooves, and plates fill its mouth: a big flat-headed whale
  of the Atlantic and Pacific.'
scope: Also called common rorqual, fin whale, or finback whale, this is the big flat-headed whale of the
  Atlantic and Pacific with a throat scored with deep grooves and plates in its mouth.
examples:
- A finback surfaced off the coast, its flat head clear of the water.
- Finbacks swim in the Atlantic and Pacific oceans.
