simpleMeaning: A group of lands that were once Soviet Socialist Republics in the Soviet Union before it
  broke up in December 1991.
scope: This is the group of former Soviet republics that joined together after the Soviet Union broke
  up in 1991, also called the CIS; it is not the Soviet Union itself.
examples:
- The Commonwealth of Independent States formed after the Soviet Union broke up.
- Several lands joined the Commonwealth of Independent States in 1991.
