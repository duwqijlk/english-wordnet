simpleMeaning: Marked by growth that is not full change, with the same count of body parts at each stage
scope: This describes growth that is not full change, with the same count of body parts at each stage,
  not growth with full change and not growth that adds body parts.
examples:
- The epimorphic young kept the same count of body parts.
- Epimorphic growth leaves the count of body parts the same at each stage.
