simpleMeaning: In Gaza and the West Bank, Palestinian Arabs rose against Israel, first in the late 1980s
  and then again in 2000
scope: Also called the intifadah, this rising of Palestinian Arabs against Israel took place in Gaza and
  the West Bank, first in the late 1980s and again in 2000.
examples:
- The first intifada ended when Israel granted limited autonomy to the Palestine National Authority in
  1993.
- Palestinian Arabs rose in the intifada against Israel in the late 1980s.
