simpleMeaning: Many groups or governments are affected when a thing is done in a way that takes in many
  sides
scope: In a way that takes in many sides, not in a way that takes in only one side and not in a way that
  takes in only two sides.
examples:
- The nations acted multilaterally to settle the dispute.
- The deal was reached multilaterally, with many governments at the table.
