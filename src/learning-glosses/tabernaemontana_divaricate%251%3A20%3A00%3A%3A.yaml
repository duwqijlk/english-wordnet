simpleMeaning: A tropical shrub with glossy leaves and fragrant flowers that open at night, their petals
  crimped or wavy; from northern India to Thailand.
scope: Also called coffee rose, crape jasmine, crepe gardenia, crepe jasmine, pinwheel flower, Adam's
  apple, East Indian rosebay, and Nero's crown; a tropical shrub of northern India to Thailand, grown
  for its night flowers, while the true jasmine and the true gardenia are different shrubs.
examples:
- Tabernaemontana divaricate opens its fragrant flowers after dark.
- The glossy leaves of Tabernaemontana divaricate shine in the sun.
