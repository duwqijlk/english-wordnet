simpleMeaning: rich soil made of sand and clay mixed with dead plant and animal matter that is breaking
  down
scope: Rich soil that is good for growing plants, not plain sand, not plain clay, and not dry dirt with
  nothing in it to feed plants.
examples:
- The garden has deep loam, and the roses grow well in it.
- She put loam in the pot before planting the seeds.
