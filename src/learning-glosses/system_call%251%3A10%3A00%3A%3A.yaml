schema: oewn-learning-gloss-v2
senseId: 'system_call%1:10:00::'
synsetId: 06599393-n
simpleMeaning: an order that pauses the program now running and hands control to the main program that
  runs the machine
scope: This is an order that pauses a running program and hands control to the main program; supervisor
  call instruction is another name for this sense. Not an order from the user and not a fault in the program.
examples:
- The program made a system call to ask for more memory.
- A system call hands control to the supervisor while the program waits.
