simpleMeaning: the part of a pine tree, shaped like a cone, that makes seeds
scope: This is the seed-holding part of a pine tree, not the tree itself and not its leaves or wood.
examples:
- She picked up a pinecone that had fallen under the tree.
- Pinecones opened in the heat and dropped their seeds on the ground.
