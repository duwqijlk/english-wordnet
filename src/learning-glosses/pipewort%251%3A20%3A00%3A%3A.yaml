simpleMeaning: A water plant living for years in North America, Ireland and the Hebrides, with see-through
  green leaves spiralling from the base and tight button-like clusters of tiny white flowers.
scope: The small water plant with tight white button-like flower heads, not a water lily or a marsh reed.
examples:
- Pipewort grows in shallow water along the lake shore.
- Tiny white flowers crowd together on each pipewort stem.
