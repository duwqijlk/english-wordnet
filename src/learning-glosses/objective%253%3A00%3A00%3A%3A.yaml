simpleMeaning: not shaped by feelings or by a wish to favor one side; based on things that can be seen
  or checked
scope: 'About fair judgment based on what can be seen and checked: not the lens in a telescope or microscope,
  not the grammar sense about the object of a verb, and not the art sense about showing things as they
  are seen.'
examples:
- The judge gave an objective view of the case, based only on the facts she could check.
- We need an objective test that does not depend on anyone's feelings.
