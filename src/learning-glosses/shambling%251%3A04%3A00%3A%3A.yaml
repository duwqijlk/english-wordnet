simpleMeaning: a slow way of walking in which your feet drag along the ground and are not lifted
scope: 'Also called shuffle, shuffling, and shamble: this is a slow walk with the feet dragging, not a
  normal step-by-step walk with the feet lifted.'
examples:
- From his shambling across the room, I could see his feet never left the floor.
- Her shambling walk dragged her shoes along the path.
