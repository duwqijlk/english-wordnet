simpleMeaning: A widely grown American plant with greenish-white flowers on a tall stalk, flowering only
  after ten to twenty years and then dying.
scope: Also called American agave; a widely grown American plant that flowers only once, after ten to
  twenty years, and then dies.
examples:
- Agave americana waited twenty years before it flowered.
- After it flowered, the Agave americana died.
