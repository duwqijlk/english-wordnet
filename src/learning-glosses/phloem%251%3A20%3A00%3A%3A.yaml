simpleMeaning: In plant life, tissue that carries made foodstuffs, say from leaves, to parts that need
  them, made mostly of sieve tubes.
scope: This sense is also called bast, for tissue that carries made foodstuffs, say from leaves, to parts
  that need them, made mostly of sieve tubes.
examples:
- Phloem carries food through the plant.
- Phloem is made of sieve tubes.
