simpleMeaning: a make-up used to make the eyes or cheekbones stand out
scope: A make-up for the eyes or cheekbones, not the bright pen used to mark important words in a book.
examples:
- She put a little highlighter on her cheekbones before the party.
- He used highlighter around his eyes to make them stand out.
