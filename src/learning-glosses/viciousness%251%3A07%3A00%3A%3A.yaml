simpleMeaning: the way a person is, in that they are very cruel in a strong and harmful way
scope: 'Also called brutality, savagery, and ferociousness: this is a person''s way of being very cruel,
  not one single cruel act on its own.'
examples:
- People feared the king for his viciousness toward anyone who spoke against him.
- Her viciousness showed in the joy she took in hurting others.
