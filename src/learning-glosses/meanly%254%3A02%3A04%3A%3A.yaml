simpleMeaning: in an unkind, angry way that shows a bad temper
scope: This sense, also called nastily, is about speaking or acting in an unkind, angry way; it is not
  about doing something poorly or in a shameful way with no honor.
examples:
- ‘Don't expect me to help you,’ he added meanly.
- She spoke meanly to her brother and made him cry.
