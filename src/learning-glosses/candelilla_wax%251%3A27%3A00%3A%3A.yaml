simpleMeaning: A hard brown stuff that forms a coat on the shrubs that bear this name.
scope: A hard brown coat on the shrubs, not the shrub itself and not beeswax.
examples:
- Candelilla wax coats the stems of the shrub.
- Workers gather candelilla wax from the desert plants.
