simpleMeaning: boldness that pushes too far and shows no shame or respect
scope: Boldness that pushes too far and shows no shame or respect; not brave action with good cause and
  not plain confidence.
examples:
- He had the audacity to ask for a raise on his first day.
- Her audacity shocked the room when she spoke back to the judge.
