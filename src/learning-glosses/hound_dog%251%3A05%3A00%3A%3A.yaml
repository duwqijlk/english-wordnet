simpleMeaning: One of several kinds of hunting animal, usually with big ears that hang down.
scope: A hunting dog with big ears that hang down, not a guard dog and not a lapdog; hound is another
  name for this sense.
examples:
- The hound dog bayed as it picked up the scent.
- Our neighbour keeps a hound dog for hunting rabbits.
