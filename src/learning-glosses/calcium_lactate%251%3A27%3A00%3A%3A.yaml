simpleMeaning: A white crystal salt made when lactic acid acts on calcium carbonate, used in foods as
  a baking powder and given by doctors as a source of calcium.
scope: For foods, as a baking powder, and as a source of calcium given by doctors.
examples:
- Calcium lactate is used in foods.
- The doctor gave calcium lactate as a source of calcium.
