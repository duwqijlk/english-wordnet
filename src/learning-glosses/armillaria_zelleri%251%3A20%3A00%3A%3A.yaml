simpleMeaning: A large fungus with a sticky cap that dries and turns brown as it ages, with off-white
  gills.
scope: A large fungus with a sticky cap that dries and turns brown as it ages, with off-white gills; the
  cap, not the gills, changes colour.
examples:
- Armillaria zelleri grew in a ring under the pines, its cap sticky to the touch.
- The gills of Armillaria zelleri were off-white, and the cap had turned brown with age.
