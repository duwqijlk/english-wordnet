simpleMeaning: a sea animal with both its side fins and its lower fins made big
scope: 'Also called four-wing flying fish: a sea animal with both its side fins and its lower fins made
  big, not a fish with only its side fins made big and not a fish that swims without fins.'
examples:
- The biplane flying fish spreads both sets of big fins to glide.
- A biplane flying fish has two pairs of fins made big.
