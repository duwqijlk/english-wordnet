simpleMeaning: Special programs that stay in the main memory of a computer all the time and control how
  the programs of users are run.
scope: Special programs that stay in a computer's main memory all the time and control how users' programs
  are run; not a program written by a user and not a program that runs only once.
examples:
- Supervisory software stays in memory while the computer runs.
- The supervisory software controls how user programs are processed.
