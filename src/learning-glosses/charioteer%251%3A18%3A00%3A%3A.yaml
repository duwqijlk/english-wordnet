senseId: 'charioteer%1:18:00::'
synsetId: 09929680-n
simpleMeaning: a person who drives a chariot, an old open carriage pulled by horses
scope: This is the person who drives the carriage and controls the horses. It is not the carriage itself,
  and not a person riding on a horse.
examples:
- The charioteer held the reins tightly as the horses ran.
- A skilled charioteer led his horses safely around the track.
