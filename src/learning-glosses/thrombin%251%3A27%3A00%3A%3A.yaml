simpleMeaning: a substance in blood that works on fibrinogen, a protein in blood, and makes the blood
  clot
scope: A substance in blood that makes blood clot, not the clot itself and not the operation that takes
  a clot out.
examples:
- Thrombin helps the blood clot after an injury.
- Thrombin in the blood helped the cut form a clot and stop the bleeding.
