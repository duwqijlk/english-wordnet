simpleMeaning: In the body, a long, narrow split running through an organ cuts it into rounded parts
scope: In the body, a long, narrow split through an organ that cuts it into rounded parts, not a crack
  in rock and not a wound.
examples:
- A deep fissure runs through the centre of the liver.
- The surgeon traced the fissure that splits the brain into two halves.
