  on its back and is found all over the world.
scope: Also called an oceanic whitetip shark and a white-tipped shark, it is a big shark of deep water
  with pale ends on the fin on its back, found all over the world, not the smooth dogfish kind of the
  Pacific and Indian Oceans.
