simpleMeaning: The young of a fly that lays its eggs on animals, usually growing inside a horse, a sheep,
  or a person.
scope: The young of a fly that usually grows inside a horse, a sheep, or a person, not the grown fly itself.
examples:
- The vet found a bot in the horse's coat.
- Bots grow inside the bodies of sheep.
