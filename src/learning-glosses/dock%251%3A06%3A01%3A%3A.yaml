simpleMeaning: A platform that sticks out from the shore into the water, held up by posts, so ships and
  boats can be reached from it
scope: A platform out over the water on posts, not the flat place where trucks are loaded and not the
  place where a person sits in court.
examples:
- The fishermen walked out along the dock to reach their boat.
- We tied the small boat to the dock and went ashore.
