simpleMeaning: a long curved fold on the inner face of the two halves of the brain, the part of the brain's
  feeling system that lies in the outer layer
scope: A long curved fold on the inner face of the two halves of the brain, part of the limbic system;
  gyrus cinguli is another name for this sense, not the outer surface of the brain and not the band joining
  the two halves.
examples:
- The cingulate gyrus helps link feeling and thought.
- Damage to the cingulate gyrus can change how a person feels pain.
