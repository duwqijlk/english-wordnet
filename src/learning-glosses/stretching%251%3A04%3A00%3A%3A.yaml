simpleMeaning: an exercise made to move your arms, legs and muscles as far as they can go
scope: Also called a stretch; this is exercise that moves the arms and legs as far as they can go, not
  the general act of making something longer or wider.
examples:
- Stretching before running helps my legs feel loose.
- She does stretching every morning to keep her back free from pain.
