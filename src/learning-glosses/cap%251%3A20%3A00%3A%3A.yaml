simpleMeaning: the top part of a fungus (a living thing such as a mushroom), held up by a stem and shaped
  like an umbrella or a cone
scope: The top part of a mushroom or another fungus, not a tight covering for the head, not a small explosive,
  and not the top of a column.
examples:
- The cap of this mushroom is wide and flat on top.
- She picked the mushroom up by its stem, not by its cap.
