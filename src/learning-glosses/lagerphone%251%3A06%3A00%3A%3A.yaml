simpleMeaning: an Australian instrument for bush tunes, made from a long stick with bottle caps fixed
  loosely along it, struck with another stick or knocked on the ground
scope: An Australian instrument for bush music, not a drum and not a stick used to beat time.
examples:
- He played the lagerphone by banging it on the ground.
- A lagerphone hung on the wall of the bush band's hall.
