simpleMeaning: a wild animal with long ears that lives in wet land near the sea from North Carolina to
  Florida
scope: This is a wild long-eared animal of wet coastal land from North Carolina to Florida, also called
  marsh hare, not a tame pet animal and not a rabbit of dry inland woods.
examples:
- A swamp rabbit darted into the reeds at the edge of the marsh.
- Swamp rabbits feed in the wet fields near the coast.
