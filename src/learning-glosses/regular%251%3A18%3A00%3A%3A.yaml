simpleMeaning: a customer who goes to the same place often.
scope: This is not a soldier and not the adjective for fixed patterns; it is a person who visits any one
  place often, not only a bar or café.
examples:
- The waiter knows all the regulars by name.
- She is a regular at the café near her office.
