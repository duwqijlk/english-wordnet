scope: A bulb made of many small bulbs joined together, from the onion plant that grows its bulbs in clusters,
  not the small mild bulbs used for seasoning and not the plant itself.
examples:
- They planted shallot bulbs in rows along the garden bed.
- The shallot split into small bulbs when they pulled it from the soil.
