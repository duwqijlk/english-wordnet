simpleMeaning: shares in a firm that give the holder the right to vote and to let someone else vote for
  them
scope: Shares in a firm that give the holder the right to vote; not shares that pay money only and not
  a loan to the firm.
examples:
- She bought voting stock so she could vote at the meeting.
- Holders of voting stock choose the men and women who run the firm.
