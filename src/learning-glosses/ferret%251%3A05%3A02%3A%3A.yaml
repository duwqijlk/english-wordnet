simpleMeaning: a wild animal of the weasel family that lives on the grasslands of the United States and
  is almost gone
scope: A wild weasel-like animal of the grasslands of the United States, almost gone, not the tame white
  ferret kept for hunting and not the act of hunting something down.
examples:
- The black-footed ferret lives only on the prairies of the United States.
- Ferrets of this kind are nearly extinct in the wild.
