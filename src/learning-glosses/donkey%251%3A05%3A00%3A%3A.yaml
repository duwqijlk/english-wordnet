simpleMeaning: an animal kept by people to carry heavy loads, bred from the wild ass of Africa; it is
  patient but stubborn
scope: A real animal kept by people to carry loads, not the sign used for the Democratic Party.
examples:
- The donkey carried our bags up the hill.
- Donkeys are patient, but a stubborn donkey may refuse to move.
