simpleMeaning: the web of nerve cells in a part deep in the brain that wakes the brain up and keeps a
  person alert
scope: A web of nerve cells that wakes the brain and keeps a person alert, not the outer layer of the
  brain and not the nerves that move the body.
examples:
- Damage to the reticular activating system left him hard to wake.
- The reticular activating system helps us stay alert during the day.
