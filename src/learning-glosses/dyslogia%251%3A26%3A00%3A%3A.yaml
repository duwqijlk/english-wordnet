senseId: 'dyslogia%1:26:00::'
synsetId: 14425588-n
simpleMeaning: Most often, hard thinking lies behind a weakened power to put thoughts into spoken words,
  as in weak minds or some illnesses of the mind.
scope: It is the weakened power of putting thoughts into spoken words, most often when thinking itself
  is hard.
examples:
- After the illness, his dyslogia made it hard to put his thoughts into words.
- Her dyslogia came from trouble in thinking.
