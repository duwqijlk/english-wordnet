simpleMeaning: a tool that tells the number of single events in which tiny bits of matter gain or lose
  charge
scope: A tool that tells the number of single events in which tiny bits of matter gain or lose charge,
  not a plain tube and not a device that counts things in general.
examples:
- The counter tube clicked each time a charged bit passed through it.
- Scientists used a counter tube to record the events.
