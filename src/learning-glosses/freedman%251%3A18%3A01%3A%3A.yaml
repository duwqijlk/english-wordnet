simpleMeaning: a man who was a slave and is now free
scope: This is a man who was once a slave and is now free, not a woman with the same past and not a man
  who was never a slave.
examples:
- The freedman bought a small farm after he was set free.
- Many freedmen worked for pay on the land where they had once been slaves.
