simpleMeaning: Counting round from home plate against the clock, the player on the fielding side stands
  at the nearest corner of the inner diamond.
scope: It is also called first, the fielding job of the player who stands at the corner of the inner diamond
  nearest home plate.
examples:
- She played first base in the game.
- The coach put him at first base.
