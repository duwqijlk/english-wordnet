simpleMeaning: A plant from the warm parts of America that stings when it is touched
scope: 'Also called devil nettle: a stinging plant from the warm parts of America, not a tree and not
  a plant grown for food.'
examples:
- She brushed against a pica-pica and her arm stung for an hour.
- Do not touch the pica-pica; it will sting you.
