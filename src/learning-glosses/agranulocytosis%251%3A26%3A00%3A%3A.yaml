simpleMeaning: One kind of white blood cell falls to very low numbers in this sudden sickness of the blood,
  often brought on by rays or by drugs.
scope: 'Also called agranulosis or granulocytopenia: a sudden sickness of the blood in which one kind
  of white blood cell falls to very low numbers, not a sickness of the red cells.'
examples:
- Agranulocytosis left him with very few of one kind of white blood cell.
- The drug treatment brought on agranulocytosis.
