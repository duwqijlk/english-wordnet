simpleMeaning: A fern that grows in mats on rock or soil, with creeping roots and big divided fronds,
  found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern also called adder's fern and golden maidenhair, not the tropical
  golden polypody.
examples:
- Common polypody covers the mossy boulders along the trail.
- We found common polypody growing on an old stone wall.
