simpleMeaning: a way to use a computer with pictures, small signs and lists on the screen, not with typed
  words, worked with a mouse as well as keys
scope: A picture-based way of using a computer; graphical user interface is another name for this sense;
  not a typed command line and not the computer itself.
examples:
- The new GUI lets you click on pictures instead of typing commands.
- She likes the GUI because it is easy to use with a mouse.
