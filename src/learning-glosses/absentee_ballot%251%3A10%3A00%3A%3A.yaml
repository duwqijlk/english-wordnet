simpleMeaning: In elections, a vote cast while away, most often sent by post before polling day
scope: In elections, a vote cast while away, most often sent by post before polling day; not a vote cast
  in person and not a vote counted after polling day.
examples:
- She sent in an absentee ballot before polling day.
- His absentee ballot arrived by post.
