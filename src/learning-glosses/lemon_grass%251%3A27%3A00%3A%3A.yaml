simpleMeaning: Used far and wide in Asian cooking and in scents and cures, it is a sweet-smelling oil
  that smells of a sour yellow fruit.
scope: It is also called lemongrass and lemongrass oil, and it is an oil, not the grass it comes from
  and not its leaves.
examples:
- Lemon grass gave the dish its sweet smell.
- The scent carried the sweet smell of lemon grass.
