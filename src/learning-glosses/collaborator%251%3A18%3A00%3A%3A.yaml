simpleMeaning: someone who teams up with another person because both care about the same work or the same
  field
scope: 'Also called partner: a person who joins with another in shared work or a shared field, not someone
  who works with an enemy force.'
examples:
- The musician and the librettist were collaborators on the opera.
- The two collaborators shared the work between them.
