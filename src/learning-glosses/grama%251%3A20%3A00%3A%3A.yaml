simpleMeaning: A grass of the plains of South America and western North America, where farm animals feed
  on it.
scope: 'Also called gramma, grama grass or gramma grass: a grass of the plains of South and western North
  America where farm animals feed, not a lawn grass and not a tall prairie grass.'
examples:
- Grama covered the dry plains in a low green mat.
- Cattle fed on the grama of the western plains.
