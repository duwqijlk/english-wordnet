senseId: 'growth-onset_diabetes%1:26:00::'
synsetId: 14141905-n
simpleMeaning: A severe form of diabetes that starts early in life, with heavy urination, great thirst,
  hunger, weight loss and bouts of blood acid build-up; diet and insulin injections control it.
scope: Another name for the severe, early-onset form of diabetes also called juvenile diabetes and insulin-dependent
  diabetes mellitus; not the adult-onset type 2 form, and not diabetes insipidus.
examples:
- The doctor explained that growth-onset diabetes needs insulin from the very start.
- In growth-onset diabetes, weight loss may show up before any other sign.
