simpleMeaning: Said of the bones in the fingers and toes, and of things that have to do with them
scope: Said of the bones in the fingers and toes, and of things to do with them, not of the bones of the
  wrist or ankle.
examples:
- The phalangeal bones are the small bones of the fingers.
- A phalangeal fracture broke one of the bones in her toe.
