simpleMeaning: the study of how goods are made and how they reach the people who buy them
scope: The study of how goods are made and how they reach buyers, not the study of land and rivers and
  not the study of money on its own.
examples:
- She studied economic geography to learn why factories sit near ports.
- His course in economic geography looks at how wheat moves from farms to shops.
