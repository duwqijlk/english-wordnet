senseId: 'hypersensitivity_reaction%1:26:00::'
synsetId: 14556805-n
simpleMeaning: The immune system attacks a harmless substance such as pollen, dust, animal hair or certain
  foods, with effects that can be mild or life-threatening.
scope: This is the body's overreaction to a harmless substance at any severity, up to anaphylactic shock;
  it is not the normal immune defence against germs, and not a reaction to something genuinely harmful
  such as a poison.
examples:
- Her skin broke out in a hypersensitivity reaction after she handled the cat.
- Doctors call the hypersensitivity reaction mild when it causes only a rash.
