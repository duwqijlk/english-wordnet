simpleMeaning: A fast-growing vine from eastern Asia with starchy roots, three-part leaves, purple flowers,
  and seed pods, grown for animal feed and root starch, widespread in the southern United States.
scope: Not other fast-growing vines, nor other plants grown for animal feed; also called kudzu and kudzu
  vine.
examples:
- Pueraria lobata covers the hillside.
- Farmers grow Pueraria lobata for animal feed.
