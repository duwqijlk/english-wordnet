simpleMeaning: A body stuff that can make the body produce, or join with, another body stuff that clumps
  blood cells of the same kind
scope: A body stuff that makes or joins the clumping stuff for same-kind blood, not a plain germ-fighting
  stuff and not the clumping stuff itself.
examples:
- The lab tested the isoagglutinogen in the blood sample.
- Isoagglutinogen can join with the clumping stuff in the blood.
