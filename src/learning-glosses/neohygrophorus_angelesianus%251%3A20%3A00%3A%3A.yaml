simpleMeaning: A small fungus with a rounded brown cap, sunken disc, waxy wine-coloured gills and a brown
  stalk, fruiting in or near melting snow banks in western North American mountains.
scope: A small brown fungus of the western mountains of North America, not a shelf fungus on trees and
  not a mould.
examples:
- Neohygrophorus angelesianus fruits near melting snow banks in the western mountains.
- We found Neohygrophorus angelesianus with its wine-coloured gills beside a snow bank.
