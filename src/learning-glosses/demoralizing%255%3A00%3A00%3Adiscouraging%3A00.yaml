simpleMeaning: making people lose hope and stop trusting in their own power to do things without help
scope: 'Also called disheartening, dispiriting, and demoralising: this makes people lose hope and belief
  in themselves; it is not just any sad news.'
examples:
- Losing five games in a row was demoralizing for the team.
- The long wait and repeated failures had a demoralizing effect on the workers.
