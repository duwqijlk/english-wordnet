simpleMeaning: Shapes, lines and colours come first in this picture-making; it never tries to show things
  as they look.
scope: This picture-making, also called abstract art, puts shapes, lines and colours first, not likeness
  of things seen.
examples:
- The painter turned to abstractionism.
- Much of the work is abstractionism.
