simpleMeaning: A disk bearing a single long groove holding a sound, playing music again as it spins beneath
  a needle riding the groove.
scope: This sense is also called record, disc, platter, disk and phonograph record, for a disk bearing
  a single long groove holding a sound, playing music again as it spins beneath a needle riding the groove.
examples:
- Phonograph recordings play music.
- A phonograph recording turns under a needle.
