simpleMeaning: A woman carrying a baby has this sickness when her blood pressure runs too high, her body
  swells, and protein turns up in her urine.
scope: Toxaemia, toxaemia of pregnancy, and toxemia are other names for this sickness of a woman carrying
  a baby, marked by high blood pressure, swelling, and protein in the urine.
examples:
- High blood pressure and protein in her urine showed toxemia of pregnancy.
- Swelling and high blood pressure pointed to toxemia of pregnancy.
