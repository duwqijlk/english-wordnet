simpleMeaning: to go with or stay with someone as a friend
scope: Also called company, this is the act of being with someone as a friend; it is not the friend who
  stays with you, and it is not a business or firm.
examples:
- She companioned her old friend on the long trip north.
- He companioned her through the long winter months.
