simpleMeaning: A baby grows by getting bigger, the old idea said, from a tiny whole creature already in
  the seed cell, an idea liked in the 1700s and now set aside
scope: Also called theory of preformation; a discredited 18th-century idea about how a new life grows.
examples:
- Preformation held that a tiny person already lived inside the seed cell.
- Preformation was once a popular idea, but scientists now set it aside.
