simpleMeaning: From the southern midwest of the United States, a low, bushy tree with leaves bigger than
  those of the Allegheny chinkapin, a close kin of it
scope: A shrubby tree much like the Allegheny chinkapin but with bigger leaves, from the southern midwest
  of the United States; not the chestnut tree with small nuts that can be eaten and not the chinquapin
  oak.
examples:
- This chinquapin has larger leaves than the Allegheny chinkapin.
- The chinquapin grows wild across the southern midwest.
