simpleMeaning: A bump or a crack in a smooth face that makes it uneven
scope: An uneven bump or crack in a smooth face; not a straight edge and not a hole right through it.
examples:
- The jaggedness of the cliff made the climb hard.
- He ran his hand over the jaggedness of the broken glass.
