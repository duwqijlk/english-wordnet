simpleMeaning: a record book in which money dealings are written down in the order they take place
scope: This is not a magazine or newspaper, and not a personal diary of thoughts; it is a book for recording
  money dealings in order.
examples:
- She records every sale in the journal as soon as it happens.
- The auditor compared the journal with the bank statements.
