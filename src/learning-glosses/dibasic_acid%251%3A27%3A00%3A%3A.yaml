simpleMeaning: A chemical with two hydrogen bits in each tiny part that can be swapped for other bits
scope: A chemical with two hydrogen bits that can be swapped in each tiny part, not a chemical with one
  such bit and not a salt.
examples:
- Dibasic acid has two hydrogen atoms that can be replaced.
- The dibasic acid gave up both of its hydrogen atoms in the reaction.
