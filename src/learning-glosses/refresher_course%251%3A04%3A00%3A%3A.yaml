simpleMeaning: a class that goes over a subject again and brings it up to date for people who have fallen
  behind
scope: 'Also called a refresher: a class that brings people who have fallen behind up to date, not a first
  class in a subject and not a test.'
examples:
- She took a refresher course in first aid before starting the new job.
- The refresher course helped the nurses catch up with the new rules.
