simpleMeaning: any of several plants with long stalks topped by blue or yellow flowers
scope: A plant with long stalks topped by blue or yellow flowers, not a plant with short stalks and not
  a plant with flowers of another colour.
examples:
- Catananche grew along the path, its long stalks topped with blue flowers.
- She planted catananche because she liked its yellow flowers on tall stalks.
