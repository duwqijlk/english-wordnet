simpleMeaning: a white blood cell that a red dye called eosin stains with ease, so the cell shows up pink-red
scope: 'Also called eosinophil: a white blood cell that stains easily with the red dye eosin, not a red
  blood cell and not a white blood cell that does not take the stain.'
examples:
- Under the microscope, the eosinophiles stood out in pink-red.
- The doctor ordered an eosinophile count after the allergy test.
