senseId: 'narcotic_antagonist%1:06:00::'
synsetId: 03814517-n
simpleMeaning: A drug used to undo the effects of strong painkilling drugs, above all to undo the slowing
  of breathing.
scope: A drug used to undo the effects of strong painkilling drugs, above all to undo the slowing of breathing;
  not a painkilling drug itself and not a drug that puts a person to sleep.
examples:
- The doctor gave a narcotic antagonist to undo the drug's effect on his breathing.
- A narcotic antagonist can reverse the slowing of breathing.
