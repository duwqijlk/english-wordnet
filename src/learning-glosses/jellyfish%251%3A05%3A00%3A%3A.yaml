simpleMeaning: one of many sea animals, usually in the sea, that swim free and are the young-making form
  of the groups called hydrozoans and scyphozoans
scope: One of many sea animals that swim free in the sea, usually, and are the young-making form of the
  groups called hydrozoans and scyphozoans; not the large one with a bag-like float and stinging arms.
examples:
- A jellyfish drifted past the boat.
- The swimmer was stung by a jellyfish.
