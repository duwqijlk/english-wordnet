simpleMeaning: copying the way someone speaks or acts in a funny way to make people laugh at them
scope: Copying the way a person speaks or acts in a funny way to make people laugh at them, not a written
  work that copies someone's style.
examples:
- His mockery of the teacher made the whole class laugh.
- She did a mockery of his walk that had everyone in fits.
