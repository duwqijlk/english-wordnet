simpleMeaning: Your shoulders move ahead of you and your back makes a round shape as you bend
scope: 'Also called hunch, hump and hunch over: to bend forward so the back rounds and the shoulders come
  forward, not to stand up straight.'
examples:
- He hunched forward over the desk to read the small print.
- She hunched forward in her chair, listening hard.
