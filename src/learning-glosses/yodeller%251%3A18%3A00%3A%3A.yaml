simpleMeaning: a singer who jumps fast between a high voice and a low voice, often heard in folk songs
  from Switzerland
scope: A singer who switches quickly between a high and a low voice; not a singer who sings in one voice
  only.
examples:
- The yodeller sang on the mountain path as the hikers walked by.
- A yodeller entertained the crowd at the folk festival.
