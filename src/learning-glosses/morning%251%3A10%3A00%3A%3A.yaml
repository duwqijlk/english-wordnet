simpleMeaning: A short friendly word used to greet someone, or say goodbye, early in the day.
scope: This is the spoken greeting, not the early part of the day itself.
examples:
- '''Morning!'' she called as she passed me on the stairs.'
- He nodded and said 'morning' to the guard at the gate.
