simpleMeaning: very hard to understand or follow, with many small parts, and at times tricky or not honest
scope: 'Also called involved, tangled, tortuous, labyrinthine, and knotty: very hard to follow with many
  small parts, not simple and clear.'
examples:
- His convoluted plan had so many steps that no one could follow it.
- She gave a convoluted reason that sounded tricky and hard to trust.
