simpleMeaning: A food starch got by soaking and drying the root of a tropical plant, the stuff tapioca
  is made from, a main food in hot lands.
scope: Also called manioc, cassava starch, and manioca; the starch made from the root, not the plant itself
  and not the root eaten as food.
examples:
- Cassava is used to thicken the soup.
- The pudding was made with cassava and coconut milk.
