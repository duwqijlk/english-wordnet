simpleMeaning: the strip of ground cleared by one sweep of a scythe, a long blade on a handle for cutting
  grass, or one pass of a mowing machine
scope: The strip cut by one sweep of a mowing blade, not a wide stretch of land in general and not the
  cut grass itself.
examples:
- He cut a wide swath through the tall grass.
- Each swath of mown hay lay in a neat line behind the machine.
