simpleMeaning: The planned use of waves of energy to send information that leads people wrong on purpose.
scope: Planned misleading information sent by energy waves, not a lie told in words and not a fault in
  a machine.
examples:
- The enemy used electronic deception to send false signals to our ships.
- Electronic deception made the radar show planes that were not there.
