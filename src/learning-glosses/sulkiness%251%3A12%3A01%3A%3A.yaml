senseId: 'sulkiness%1:12:01::'
synsetId: 07566964-n
simpleMeaning: A mood, or the show of one, in which a person holds apart from others in silence, sulky
  and withdrawn.
scope: Also called a sulk; a mood or show of silent withdrawal, not a lasting sullen and resentful nature.
examples:
- His sulkiness kept him in his room all day.
- She answered with sulkiness, saying nothing and looking away.
