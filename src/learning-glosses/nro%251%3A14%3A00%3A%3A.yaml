simpleMeaning: An office in the US defence department that plans, builds, runs space spy systems to spot
  trouble spots worldwide, watch arms-control deals and green issues, and help plan military moves
scope: This is a United States defence office that runs space spy systems worldwide; National Reconnaissance
  Office is another name for it, not the defence department as a whole.
examples:
- The NRO builds satellites that watch trouble spots.
- The NRO helps plan military operations.
