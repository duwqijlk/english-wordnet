simpleMeaning: the skill or work of planning and setting up lamps and other man-made sources to make a
  place bright
scope: The skill or work of planning and setting up man-made brightness for a place; not the lamps and
  equipment themselves, and not the state of a place being full of light.
examples:
- She took a course in lighting for the stage.
- He is learning lighting so he can work on films.
