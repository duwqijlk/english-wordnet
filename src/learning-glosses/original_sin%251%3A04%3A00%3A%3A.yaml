senseId: 'original_sin%1:04:00::'
synsetId: 00758836-n
simpleMeaning: A wrong that people are said to be born with, passed down from Adam to all who come after
  him
scope: A wrong said to be passed down from Adam to all who come after him, not a wrong a person does on
  their own and not a wrong done only once.
examples:
- Adam and Eve committed the original sin when they ate the forbidden fruit in the Garden of Eden.
- The priest taught that the original sin is passed down to all of Adam's children.
