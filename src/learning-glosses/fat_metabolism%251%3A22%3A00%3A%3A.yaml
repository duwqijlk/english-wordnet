simpleMeaning: Into acids and glycerol, then into still smaller bits the body's cells can use, this body
  process breaks down the oily parts of food
scope: The breaking down of food oils in the body, not the building of body fat and not digestion as a
  whole.
examples:
- Fat metabolism breaks down the oils in food so cells can use them.
- Doctors study fat metabolism to learn how the body uses food oils.
