simpleMeaning: to study something in detail by breaking it into its parts, such as a sum, a chemical,
  or a sentence
scope: analyze is another name for this sense; not cutting open a body, and not just looking at a whole
  thing.
examples:
- The teacher asked them to dissect the poem line by line.
- Scientists dissected the data to find the error.
