simpleMeaning: The chemical processes inside cells and tissues by which some organisms release energy
  from organic molecules and produce carbon dioxide, which the blood carries to the lungs.
scope: This is the energy chemistry that happens inside cells, not breathing in and out; internal respiration
  and respiration are other names for this same process.
examples:
- Cellular respiration releases energy from sugar inside the cell.
- Without oxygen, cellular respiration cannot yield much energy.
