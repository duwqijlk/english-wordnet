simpleMeaning: the feeling of being separate from other people and not part of their group
scope: The feeling of being separate from other people, not the act of making a person unfriendly and
  not the passing of land to a new owner in law.
examples:
- He felt a deep sense of alienation at his new school.
- Her alienation grew after her friends stopped calling her.
