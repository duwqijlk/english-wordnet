scope: Also called a genital stage, this psychoanalytic term marks the fifth step in growing up, when
  sex and getting on with others hold a young person's interest most.
examples:
- His genital phase began in his teens, when interest in sex grew strong.
- During her genital phase, getting on with friends and interest in sex mattered most.
