simpleMeaning: a thin tube put inside a tube-like part of the body, such as a blood vessel, to hold it
  up during and after an operation that joins parts together
scope: This is a thin tube put inside the body to support a vessel or other tube-like part, not a tube
  used outside the body.
examples:
- During the operation to join the parts of the blood vessel together, the doctor put a stent inside it
  to hold it up.
- After the operation that joined the parts together, the stent stayed inside the vessel to hold it up.
