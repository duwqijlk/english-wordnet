simpleMeaning: A plant of the Old World with long slim leaves marked with raised lines, now found widely
  in mild parts of the world.
scope: A plant of the Old World with long slim leaves marked with raised lines, now found widely in mild
  parts of the world, also called buckthorn, ribgrass, ribwort and ripple-grass; not the banana-like fruit
  called plantain and not a broad-leaved plant.
examples:
- Narrow-leaved plantain grows along the path edges.
- The narrow-leaved plantain has long thin leaves with raised lines.
