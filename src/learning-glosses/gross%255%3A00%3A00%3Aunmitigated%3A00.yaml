simpleMeaning: total and without any limit, used in everyday speech to make a word stronger, often to
  show that something is bad
scope: Also called perfect, complete, staring, utter, pure, thorough and stark. This sense makes a word
  mean total and complete, not the sense about earning money or the sense about being clearly bad.
examples:
- The report described it as gross negligence, a total failure to take care.
- He talked gross nonsense from start to finish.
