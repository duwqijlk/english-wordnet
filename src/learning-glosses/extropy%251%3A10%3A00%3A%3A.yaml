simpleMeaning: The prediction that human minds and machines will let life spread in an orderly way through
  the whole universe.
scope: The prediction that human minds and machines will let life spread in an orderly way through the
  whole universe, not a forecast of doom and not a law of nature.
examples:
- Extropy holds that life will spread through the universe.
- He believed in extropy, the spread of life through the stars.
