simpleMeaning: An alert, nimble lizard with shrunken limbs, a long body and glossy scales; it needs more
  moisture than most lizards and lives in tropical regions worldwide.
scope: This is the sleek, short-legged tropical lizard also called a skink or a scincid; it is not a gecko,
  and not a large monitor lizard.
examples:
- A scincid lizard shot into a crevice when I lifted the log.
- Scincid lizards need damp places, so they are rare in dry desert sand.
