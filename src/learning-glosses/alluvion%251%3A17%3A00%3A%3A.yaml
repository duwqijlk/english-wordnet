simpleMeaning: Where its water slows down, a rushing stream leaves behind the clay, silt, or gravel it
  has carried.
scope: 'Also called alluvium, alluvial deposit, and alluvial sediment: clay, silt, or gravel that a rushing
  stream carries and leaves where the water slows, not the slow making of new land.'
examples:
- The alluvion lay where the stream slowed down.
- The rushing stream carried the alluvion of clay and gravel.
