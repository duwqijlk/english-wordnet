simpleMeaning: going on without a break in time, and going on for a very long time with no fixed end
scope: About something that goes on without a break; not a fixed number in maths, and not a person who
  stays true in love or purpose.
examples:
- He lived in constant pain that never stopped.
- The city had constant noise day and night, with no quiet break.
