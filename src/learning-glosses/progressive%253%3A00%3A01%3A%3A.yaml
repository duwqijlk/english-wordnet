simpleMeaning: in favour of changes that move a place or a group forward
scope: For people or ideas that back change and improvement, not the verb tense for action going on now,
  not a reform movement, and not something that grows bit by bit.
examples:
- She joined a progressive school that tried new ways of teaching.
- The town chose a progressive mayor who promised steady change.
