simpleMeaning: A person who wanders from place to place, with no fixed home and no clear way of earning
  a living.
scope: Also called a floater, a vagrant, or a vagabond, a wanderer with no fixed home and no clear way
  of earning a living.
examples:
- The drifter moved from town to town, finding work where they could.
- A drifter slept in the barn that night.
