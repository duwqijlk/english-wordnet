synsetId: 04414142-n
simpleMeaning: A sleep drug sold under this trade name, often given by doctors, that works slowly and
  lasts through the night to help people who wake up often.
scope: Also called temazepam; a sleep drug that works slowly and lasts through the night, not a drug that
  works fast and wears off quickly and not a drug for pain.
examples:
- Restoril helped her sleep through the night without waking.
- The doctor gave Restoril to the man who woke up often during the night.
