simpleMeaning: a close-fitting cover for the head that keeps hair dry when you swim
scope: A cover worn on the head for swimming, not a hat worn for warmth and not a cover for the face.
examples:
- She put on her bathing cap before she got into the pool.
- His bathing cap kept his hair dry while he swam.
