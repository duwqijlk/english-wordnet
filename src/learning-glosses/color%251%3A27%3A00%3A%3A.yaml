senseId: 'color%1:27:00::'
synsetId: 15009532-n
simpleMeaning: A substance such as paint or dye that gives something its hue.
scope: This is a substance, such as paint or dye, whose purpose is to give hue; it is not a thing's visible
  appearance as judged by hue, lightness and saturation, not the physical light attribute behind it, not
  vividness or interest, not a musical sound's quality, not a misleading outward show or form, not the
  physics property that quarks carry, not the adjective meaning able to produce hues, not the act of decorating
  an object with hues, not something turning a different shade on its own, not adding hue in a general
  way, not affecting someone's feelings or judgment, not biasing or slanting something, and not giving
  a misleading explanation or excuse.
examples:
- The fresco painter ground his own colors from earth and stone.
- The dye shop sold colors made from indigo and madder root.
