simpleMeaning: the part of the science of living things that studies how the bodies of living things work
scope: This is the study of how living things work, not the workings and processes of a living thing themselves.
examples:
- She is studying physiology to learn how the heart and lungs work.
- His course in physiology covered how the body uses food for energy.
