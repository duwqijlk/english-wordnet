simpleMeaning: a thing done or got away from by only a very small gap
scope: Also called a close shave, a narrow escape, a squeak, or a squeaker, this is a win or escape by
  a very small gap, not an easy win and not a clear escape.
examples:
- It was a close call when the car stopped just short of the wall.
- Their close call came when the boat nearly hit the rocks.
