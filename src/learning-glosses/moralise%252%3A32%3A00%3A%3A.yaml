senseId: 'moralise%2:32:00::'
synsetId: 00830035-v
simpleMeaning: A talk about right and wrong that sounds like a sermon from a preacher
scope: 'Also called moralize, preachify or sermonize: to talk like a preacher about right and wrong, not
  to give a real sermon in church and not to judge a person in a court of law.'
examples:
- He began to moralise about the evils of television.
- Don't moralise at me; just tell me what happened.
