simpleMeaning: The large parts that grow from a bird's wing or tail, not the small ones that cover the
  bird's body
scope: 'Also called a pinion, a quill, and a quill feather: one of the large wing or tail feathers of
  a bird, not one of the small ones that cover its body.'
examples:
- The owl lost a flight feather during the storm.
- A flight feather from the eagle's wing lay on the ground.
