simpleMeaning: A fruit with a wing-like part that usually holds one seed and does not split open, such
  as those of ash, elm, or maple trees.
scope: This is a tree fruit, not the lever you press to work a machine or a musical scale.
examples:
- In autumn the ash trees shed their keys all over the path.
- Each maple key spun to the ground like a tiny wing.
