simpleMeaning: a worker who splits logs to build fences of logs laid across rails
scope: A worker who splits logs to build fences of logs laid across rails; rail-splitter is another name
  for this sense, not a person who sorts living things into many groups.
examples:
- The splitter cut logs all day for the new fence.
- A splitter turns whole logs into rails for fences.
