simpleMeaning: a skilled worker whose job is to fix buildings or old valued furniture, and bring them
  back to good shape, or give them a new surface finish
scope: 'Also called restorer, refinisher, and renovator: this is a worker who fixes old buildings or furniture.
  It is not the belt or jacket that keeps a person from going under in water, and not a cook who keeps
  fruit or meat good for later.'
examples:
- The museum hired a preserver to fix the old wooden desk.
- A preserver worked for months to bring the old house back to its first good shape.
