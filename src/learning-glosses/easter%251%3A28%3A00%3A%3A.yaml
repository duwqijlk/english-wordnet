simpleMeaning: A Christian feast that marks the rising of Christ from the dead, kept on the Sunday after
  the first full moon after the start of spring.
scope: Not Christmas or Good Friday; this is the feast of the Resurrection.
examples:
- Easter falls on a Sunday in spring.
- Churches are full on Easter morning.
