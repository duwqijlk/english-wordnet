simpleMeaning: an old Norse name for a form of magic that people in the north used in the late Iron Age
scope: This is an old Norse word for a kind of magic in the late Iron Age; seithr, seid, seidh, seidr
  and seith are other names for this sense, not modern stage magic and not a Norse god.
examples:
- Seidhr was a kind of magic used in the old north.
- The tale describes a seer who worked seidhr.
