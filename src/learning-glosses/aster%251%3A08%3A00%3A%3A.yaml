simpleMeaning: A star-shaped build-up in a cell's fluid, with thin threads like rays round the centrosome,
  a small body in the cell, formed while the cell splits in two.
scope: A star-shaped build-up inside a cell while it splits in two, not the fall flower of the same name.
examples:
- The aster formed in the cell as it began to split.
- Under the lens, the aster showed thin threads like rays.
