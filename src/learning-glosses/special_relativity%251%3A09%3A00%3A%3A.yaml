simpleMeaning: 'in physics, a theory with two fixed points: light in empty space always moves at the same
  speed, and physics laws stay the same in every steady system'
scope: Also called the special relativity theory and the special theory of relativity, this theory rests
  on two fixed points about light speed and physics laws.
examples:
- Special relativity holds that light in empty space always moves at the same speed.
- He learned special relativity to see why physics laws stay the same in every steady system.
