simpleMeaning: to be cross and in a bad mood, saying nothing and looking unhappy
scope: 'Also called stew and brood: to be cross and silent in a bad mood, not to cry and not to shout.'
examples:
- He grizzled all morning after losing the game.
- Don't grizzle about the rain; it will stop soon.
