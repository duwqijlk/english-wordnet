simpleMeaning: A colourless oily liquid found in fats in combined form, the main fatty acid in olive and
  canola oils, used in soap, cosmetics, ointments and lubricating oils.
scope: The main fatty acid in olive and canola oils, used in soap, cosmetics and lubricants; not a fat
  or oil itself, and not another fatty acid such as stearic acid.
examples:
- Oleic acid makes up most of the fatty acids in olive oil.
- Manufacturers use oleic acid to make soap and cosmetics.
