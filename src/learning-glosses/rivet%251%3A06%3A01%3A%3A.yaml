senseId: 'rivet%1:06:01::'
synsetId: 04350424-n
simpleMeaning: a round raised knob put on a thing to decorate it, as on a vault, shield, or belt
scope: A round raised knob that decorates something, also called a stud; not the metal pin used to fasten
  parts together, and not the act of fastening with one.
examples:
- A row of brass rivets decorated the old belt.
- The shield bore a single bright rivet at its centre.
