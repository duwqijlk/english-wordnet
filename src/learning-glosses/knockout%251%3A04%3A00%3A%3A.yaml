simpleMeaning: a hit that makes the person you are fighting not awake and not able to feel or know anything
scope: This is a hard hit that stops a fight; it is not a win without such a hit and not a person who
  looks very good.
examples:
- He won by a knockout in the second round.
- One hard punch was a knockout, and the other boxer did not get up.
