simpleMeaning: rough to the touch, with a skin or surface covered in small hard plates or flaking bits
scope: A surface that feels rough because of scales or scurf on it, not the body of a fish or reptile
  covered in hard plates.
examples:
- The scaly skin on his heels felt rough.
- Her hands were dry and scaly after the long winter.
