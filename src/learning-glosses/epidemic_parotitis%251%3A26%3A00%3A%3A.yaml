simpleMeaning: With fever and swelling of the glands beside the ears, it is a sudden sickness caught from
  others and caused by a virus.
scope: It is also called mumps, and it brings fever and swelling of the glands beside the ears.
examples:
- Epidemic parotitis gave him a fever and swollen glands beside his ears.
- Epidemic parotitis spreads from one person to another.
