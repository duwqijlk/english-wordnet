simpleMeaning: In computer science, the desktop on which icons sit and windows open.
scope: The screen area behind icons and windows, not unwanted interference in a reading and not a minor
  event happening alongside.
examples:
- She set a photo of the sea as her background.
- The white text is hard to read against that bright background.
