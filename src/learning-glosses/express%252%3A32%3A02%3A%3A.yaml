simpleMeaning: to act as the sign or medium through which a feeling, idea, or amount is made known.
scope: This is about a thing serving as the channel or sign, not about a person putting a feeling into
  words or showing it directly.
examples:
- The painting expresses a quiet grief that words cannot capture.
- The graph expresses the same data in a simpler form.
