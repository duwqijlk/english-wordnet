simpleMeaning: to change something into a form made with numbers, so that a computer can use it
scope: Changing paper, sound, or pictures into a form a computer can use; not making a copy by hand and
  not printing something out on paper.
examples:
- He digitized all his old family photos.
- The library is digitizing its old books so people can read them on a computer.
