simpleMeaning: In tennis, a return of a ball that looked impossible to reach.
scope: A tennis term for a shot played back after a desperate chase, not a point won and not the everyday
  verb to get.
examples:
- She chased a lob into the corner and made a remarkable get.
- His get off the backhand kept the rally alive.
