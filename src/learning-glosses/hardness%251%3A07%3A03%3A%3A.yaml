simpleMeaning: A cold lack of feeling for others, with no warmth or pity at all.
scope: This is a cold lack of feeling for others; not the stiffness of a hard thing, and not the mineral
  salts in water.
examples:
- The hardness of the landlord shocked even his friends.
- She showed a hardness towards the beggars at the gate.
