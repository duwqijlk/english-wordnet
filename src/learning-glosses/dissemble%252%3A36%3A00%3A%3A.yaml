senseId: 'dissemble%2:36:00::'
synsetId: 01725433-v
simpleMeaning: to act in a way that is not natural or real, as if putting on a manner that is not your
  own
scope: To behave in a put-on, unnatural way; also called act, and another name for pretend. It is not
  behaving as you really are or really feel.
examples:
- She dissembled at the party, laughing in a high, false way that was not like her at all.
- He dissembled when the guests came, putting on grand manners he never used at home.
