simpleMeaning: A person trained to find, stop, or treat sickness or a loss of the power to use the body
  or mind well.
scope: A person trained to find, stop, or treat sickness or a loss of the power to use the body or mind
  well, also called caregiver and health care provider; not a patient and not a hospital.
examples:
- A health professional checked her blood pressure and listened to her chest.
- Talk to a health professional if the pain does not go away.
