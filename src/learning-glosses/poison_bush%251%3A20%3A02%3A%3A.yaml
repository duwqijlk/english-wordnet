simpleMeaning: An Australian evergreen shrub whose leaves grow in rings of leaflets, with showy yellow
  to orange-red flowers and pods of two seeds; foliage is toxic to livestock.
scope: The Gastrolobium shrub also called gastrolobium and poison pea; not the separate Swainsona plants
  that are poisonous to sheep and sometimes share this name.
examples:
- A poison bush grew by the fence, its yellow flowers bright against the dry grass.
- The farmer cleared every poison bush from the paddock before bringing in the sheep.
