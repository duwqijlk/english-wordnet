  round yellow centres.
scope: This widespread, strong-smelling weed is also called mayweed, stinking chamomile, and stinking
  mayweed, and it is not the other dog fennel of the southeastern United States.
examples:
- Dog fennel grew thick along the fence.
- We pulled the dog fennel out because of its rank smell.
