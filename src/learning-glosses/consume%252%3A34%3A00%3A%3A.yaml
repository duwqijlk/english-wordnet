simpleMeaning: to help yourself to food or drink, or to eat or drink it as a regular habit
scope: 'Also called have and take: to help yourself to food or drink, or to eat or drink it as a regular
  habit, not to burn something up until it is gone.'
examples:
- He consumed a bowl of chicken soup at lunch every day.
- She consumed sugar in her coffee each morning.
