simpleMeaning: When folds in the throat shake, the sound that comes out is shaped by the hollow space
  above them.
scope: Also called voice, phonation, vocalisation, vocalism, and vocalization, it is the sound that comes
  from folds shaking in the throat.
examples:
- The vox rang out clear across the hall.
- The giraffe cannot make any vox.
