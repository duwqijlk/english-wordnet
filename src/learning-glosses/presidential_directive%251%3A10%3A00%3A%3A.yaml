simpleMeaning: Most often sent to all the heads of departments and agencies, this order comes from the
  President of the United States
scope: 'Another name for an executive action: an order from the President of the United States, most often
  sent to all the heads of departments and agencies; not a law passed by Congress and not an order from
  a lower official.'
examples:
- The president issued a presidential directive to every department head.
- Under the new presidential directive, agencies must report weekly.
