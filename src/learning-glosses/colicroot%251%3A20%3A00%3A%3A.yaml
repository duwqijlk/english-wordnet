simpleMeaning: People say the bitter underground part of one of several long-lived Aletris plants, with
  leaves like grass, cures belly pain
scope: This is a plant said to cure belly pain, not a drug or a garden flower; also called colic root,
  crow corn, star grass, and unicorn root.
examples:
- The gardener planted colicroot in the herb bed.
- Colicroot leaves look like blades of grass.
