simpleMeaning: A shape that can be cut into two matching halves by any flat cut that runs from top to
  bottom through its middle.
scope: Also called actinomorphous, this word describes a shape that gives two matching halves however
  it is cut through its middle.
examples:
- The actinomorphic flower could be cut into two matching halves through its middle.
- A student drew an actinomorphic star that split into matching halves down the middle.
