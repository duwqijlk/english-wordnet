simpleMeaning: Today this word is used only in one set phrase, for the strong anger you feel when someone
  treats you unfairly
scope: Strong anger at unfair treatment, also called dudgeon, used only in one set phrase; not mild annoyance
  and not rage at a person.
examples:
- He left in high dudgeon after the insult.
- She stormed out in high dudgeon when her work was dismissed.
