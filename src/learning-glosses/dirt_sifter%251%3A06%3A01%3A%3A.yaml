simpleMeaning: A garden tool with a mesh that lets fine earth through and holds back big unwanted bits.
scope: A garden mesh tool that keeps big unwanted bits out of earth, not a kitchen sieve and not a shovel.
examples:
- She used a dirt sifter to clean the garden soil.
- The dirt sifter held back stones and roots.
