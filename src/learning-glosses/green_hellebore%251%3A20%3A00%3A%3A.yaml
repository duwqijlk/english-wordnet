simpleMeaning: A plant that loses its leaves in winter, with large dark leaf-coloured foot-shaped leaves
  and nodding shallow dish-shaped flowers the colour of leaves
scope: This winter-bare plant is not a rose and not an evergreen shrub.
examples:
- Green hellebore flowered in the shady corner of the garden.
- The green hellebore lost its leaves in the cold winter.
