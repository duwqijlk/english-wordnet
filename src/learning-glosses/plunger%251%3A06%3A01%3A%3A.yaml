simpleMeaning: A hand tool with a stick and a rubber cup at one end; the cup holds tight when pushed down,
  and it clears blocked drains
scope: 'Also called plumber''s helper: the hand tool for clearing blocked drains, not a person who risks
  money for big gains and not a machine part that moves in and out.'
examples:
- He used a plunger to clear the blocked sink.
- She pushed the plunger down over the drain again and again.
