simpleMeaning: a frame fixed to a vehicle for holding luggage, skis, or other such things
scope: A frame fixed to a vehicle for holding luggage, not a warship that holds planes, a living thing
  that passes on a hidden gene, or a radio wave.
examples:
- He tied the skis to the carrier on the roof of the car.
- The carrier held two suitcases on the back of the bike.
