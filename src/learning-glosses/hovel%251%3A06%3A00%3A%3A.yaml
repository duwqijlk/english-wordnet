simpleMeaning: a small place where someone lives, built in a rough and simple way
scope: 'Also called a hut or a shack: a small place where someone lives, built in a rough and simple way,
  not a proper house and not a tent.'
examples:
- The family lived in a hovel with no running water.
- After the storm, they took shelter in a hovel at the edge of the field.
