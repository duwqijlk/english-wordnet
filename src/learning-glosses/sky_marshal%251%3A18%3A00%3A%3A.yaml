simpleMeaning: Riding as a passenger on a plane for safety, this person is trained by the government in
  ways to stop hijackings and terror
scope: Also called an air marshal, this is a person trained by the government in hijacking and terrorist
  tactics who rides as a passenger on a plane for safety.
examples:
- The sky marshal rode as a passenger on the flight, trained to stop hijackings.
- No one on the flight knew which passenger was the sky marshal.
