simpleMeaning: a paper or list that tells people what acts or games will happen at a stage show or a sports
  event
scope: 'Also called program: a list of what will happen at a show or a sports event; not the instructions
  a computer follows, and not the act of writing those instructions.'
examples:
- She bought a programme to see who would sing at the concert.
- The programme listed every race at the sports day.
