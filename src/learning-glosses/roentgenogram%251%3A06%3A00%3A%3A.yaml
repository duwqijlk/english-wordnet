simpleMeaning: a picture made by passing X rays through the body onto film, used to find what is wrong
  with a patient
scope: A picture made by passing X rays through the body onto film; not a photograph taken with light,
  and not a scan made by sound.
examples:
- The roentgenogram showed a break in the arm.
- The doctor studied the roentgenogram before the operation.
