simpleMeaning: a split in the tie between people or groups, as between two sides that are against each
  other
scope: 'Also called break, rupture, breach and rift: this is a split between people or groups, not the
  act of cutting something off.'
examples:
- The fight led to a severance of ties between the two groups.
- After the argument, there was a full severance between the two sides.
