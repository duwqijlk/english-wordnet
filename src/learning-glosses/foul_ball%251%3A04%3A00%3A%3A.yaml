simpleMeaning: a hit with the bat that goes outside the two lines marking the sides of the field
scope: This is a hit in baseball that lands outside the lines marking the field; not a fair hit that stays
  inside the lines or a pitch that is not hit.
examples:
- The batter hit a foul ball into the stands.
- That foul ball nearly struck a fan.
