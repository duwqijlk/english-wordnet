simpleMeaning: Like a scape or a scape itself, a bare stalk; having a bare stalk with no leaves that grows
  from the ground itself.
scope: A plant part like a bare stalk with no leaves, growing from the ground; not a leafy stem and not
  a stalk that bears leaves along its length.
examples:
- Tulips are scapose flowers.
- The scapose stalk rises straight from the ground.
