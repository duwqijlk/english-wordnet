simpleMeaning: Those who help at the holy meal, the Eucharist, share this sign of welcome in the Roman
  Catholic Church, a sign of Christian love.
scope: In the Roman Catholic Church, this sign of welcome, also called a pax, shows Christian love for
  those who help at the holy meal.
examples:
- Those who helped at the holy meal shared the kiss of peace.
- The kiss of peace passed among those who helped at the holy meal.
