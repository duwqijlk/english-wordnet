simpleMeaning: In tennis, a return hit that goes past a player who has come up to the net
scope: A return hit in tennis that goes past a player at the net, not a hit the player at the net can
  reach and not a serve.
examples:
- Her passing shot went past him at the net.
- He won the point with a passing shot down the line.
