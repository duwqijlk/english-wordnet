simpleMeaning: that destroys holy images used in worship, used of faiths, such as Islam, that forbid any
  likeness of living things
scope: That destroys holy images used in worship, used of faiths that forbid any likeness of living things,
  not a person who breaks images and not a ban on all art.
examples:
- The iconoclastic rulers ordered the holy images to be destroyed.
- The iconoclastic faith forbids any likeness of a living thing.
