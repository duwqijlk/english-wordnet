senseId: 'buoy%1:10:00::'
synsetId: 07280883-n
simpleMeaning: A usually brightly coloured floating object tied by a rope to the sea floor, marking a
  harbor channel or a hidden danger beneath the water.
scope: The moored float itself, not a lit marker or beacon, and not the verbs meaning to stay afloat,
  to keep something afloat, or to mark with one.
examples:
- The buoy marked the edge of the dredged channel.
- A bright orange buoy bobbed beside the rocks.
