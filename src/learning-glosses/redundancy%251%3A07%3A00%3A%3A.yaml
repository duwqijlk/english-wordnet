simpleMeaning: The quality of being extra, because there is more than is needed and the extra part is
  not needed
scope: This is the general quality of being extra and not needed; it is not the electronics design that
  copies parts so one can take over if another fails, and not the repeating of a message to cut errors
  when sending it.
examples:
- When the new machines arrived, there was redundancy among the factory workers, and some lost their jobs.
- Keeping three copies of every old file is pure redundancy; no one ever looks at them.
