simpleMeaning: A children's game in which they play at being a medical worker, a nurse, or a sick person
  in a pretend clinic.
scope: This is not a person with a medical or academic title; it names the game children play at pretending
  to be in a clinic.
examples:
- The children spent the afternoon playing doctor in the garden shed.
- In the game of doctor, her little brother was always the patient.
