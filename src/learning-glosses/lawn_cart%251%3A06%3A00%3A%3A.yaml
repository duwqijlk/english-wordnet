simpleMeaning: A small carrier on one or more wheels with handles, for moving light loads from place to
  place.
scope: A small carrier on one or more wheels with handles, for moving light loads from place to place;
  barrow, wheelbarrow and garden cart are other names for this sense, not a large farm wagon, and not
  a carrier with no wheels.
examples:
- He piled leaves into the lawn cart and pushed it to the pile.
- She pulled the lawn cart by its handles to move the small loads.
