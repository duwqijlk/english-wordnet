senseId: 'salve%1:06:00::'
synsetId: 03851070-n
simpleMeaning: A thick, soft cream, usually with a medicine in it, put on the skin to heal or soothe a
  sore place
scope: A cream put on the skin to heal or soothe; ointment and balm are other names for this sense, not
  anything that heals in a general way.
examples:
- She rubbed salve on the burn.
- The salve soothed the red, sore skin.
