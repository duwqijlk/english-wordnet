simpleMeaning: A farm tool that pulls unwanted plants from crops with thin springy teeth set on a frame
  that bends to follow the shape of the ground.
scope: Also called flex harrow and flexible harrow, it is a farm tool for clearing crops of unwanted plants.
examples:
- The farmer used the tine weeder to clear the weeds from the crops.
- A tine weeder bends to follow the shape of the ground.
