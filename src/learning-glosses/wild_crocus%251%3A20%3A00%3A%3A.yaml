simpleMeaning: This plant of North America and Siberia stays low and hairy, lives year after year, and
  shows blue-violet or lilac flowers when spring is young.
scope: Also called blue tulip, lion's beard, and prairie anemone, it is a short hairy plant that lives
  year after year in North America and Siberia.
examples:
- Early in spring, wild crocus opened blue-violet flowers.
- The short wild crocus of Siberia lives year after year.
