simpleMeaning: Year after year, this herb of eastern North America bears red flowers with thin petals
  notched at the ends.
scope: This names the herb of eastern North America that lives for years and bears red flowers with thin
  petals notched at the ends.
examples:
- Fire pink grew by the trail, its red flowers standing out among the leaves.
- The fire pink came back year after year, with red flowers and thin notched petals.
