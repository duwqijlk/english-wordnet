simpleMeaning: to make small balls of air or gas in or on a liquid, or to send them out
scope: A liquid making or sending out small balls of air or gas by itself, not making another liquid do
  so, and not the balls themselves.
examples:
- The soup bubbled gently in the pot.
- The water began to bubble as it got hotter.
