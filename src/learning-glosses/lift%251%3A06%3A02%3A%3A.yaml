simpleMeaning: A single layer of material used, along with others like it, to build the heel of a shoe
  or boot.
scope: A structural layer inside a heel, not the removable insert that adds height.
examples:
- The lift on the left boot had worn thin, so the heel sloped.
- He asked the cobbler to add a new lift to the heel of his boots.
