simpleMeaning: Cells the body accepts, most of all stem cells, can be grown for transplant from an egg
  cell made with the centre of one of a sick person's own cells.
scope: Biomedical cloning is another name for this way of growing new cells the body will accept for transplant.
examples:
- Therapeutic cloning uses a patient's own cells.
- New stem cells from therapeutic cloning can be used for transplant.
