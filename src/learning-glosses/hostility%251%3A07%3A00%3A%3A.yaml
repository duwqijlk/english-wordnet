simpleMeaning: A very unfriendly way of thinking and acting toward others
scope: A very unfriendly cast of mind, not a violent act and not the feeling of a hostile person.
examples:
- He could not hide his hostility toward the new chief.
- Her hostility showed in every word she spoke.
