simpleMeaning: high standing and great importance that comes from being clearly much better than others
scope: 'Also called note, distinction and eminence: high standing that comes from being much better than
  others, not just being well known or having power.'
examples:
- Her preeminence as a scholar was clear to everyone at the university.
- The school's preeminence in science came from years of strong teaching.
