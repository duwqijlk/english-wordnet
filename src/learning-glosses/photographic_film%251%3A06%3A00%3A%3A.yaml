simpleMeaning: Negatives or clear pictures for showing come from this flat sheet of celluloid, a hard
  clear plastic, covered with a coat that reacts to light.
scope: Also called film, this celluloid sheet, a hard clear plastic, carries a light-reacting coat for
  negatives or clear pictures for showing.
examples:
- They loaded the photographic film and took the picture.
- The photographic film gave them negatives and clear pictures for showing.
