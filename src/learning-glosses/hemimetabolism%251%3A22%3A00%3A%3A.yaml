simpleMeaning: In insects, the young grow into adults by changing shape only part of the way, not in full
scope: A change of shape in young insects that goes only part of the way, also called hemimetaboly and
  hemimetamorphosis, not a full change and not a change in other animals.
examples:
- Grasshoppers show hemimetabolism as they grow.
- The nymphs grow by hemimetabolism, changing shape a little at each stage.
