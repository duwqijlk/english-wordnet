simpleMeaning: To do with what a thing does, especially not with how it is built.
scope: This is about what a thing does rather than how it is built, not the sense of a machine that works,
  nor the sense of how a thing works rather than the body, nor the two senses of being made for a use.
examples:
- The problem is functional, not a matter of how the bridge was built.
- They chose the design on a functional basis, not a geographical one.
