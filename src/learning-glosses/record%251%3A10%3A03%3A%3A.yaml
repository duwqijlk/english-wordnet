simpleMeaning: Any item, such as a document, a vinyl disc, or a photograph, that provides lasting evidence
  or details of what happened before.
scope: This is kept evidence of past events, not the physical music disk, a team's win-loss tally, a career's
  achievements, a best-ever performance, or a criminal history.
examples:
- The museum keeps a record of every item donated to it.
- Her letters provide a detailed record of life during the war.
