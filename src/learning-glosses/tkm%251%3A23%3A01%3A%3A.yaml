simpleMeaning: 'Freight is counted in this unit: one tonne of goods carried one kilometre by one kind
  of transport.'
scope: Also called a tonne-kilometer and a tonne-kilometre, it is the unit for freight carried one tonne
  at a time over one kilometre.
examples:
- They reckoned the freight in tkm.
- Moving 1250 kilograms over 90 kilometers equals 112.5 tkm.
