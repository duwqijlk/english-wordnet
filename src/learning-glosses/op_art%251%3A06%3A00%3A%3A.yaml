simpleMeaning: In the 1960s, a liked way of making pictures used strong colour clashes that trick the
  eye, and did not show things as they really look.
scope: It is a 1960s way of making pictures that does not show things as they really look, but works through
  clashing colours that are hard for the eye to settle on.
examples:
- The op art print on the wall was hard for the eye to settle on.
- She hung an op art poster above her desk.
