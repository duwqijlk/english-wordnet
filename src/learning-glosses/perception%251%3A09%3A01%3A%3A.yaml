senseId: 'perception%1:09:01::'
synsetId: 05938922-n
simpleMeaning: the picture in the mind of a thing seen or felt, the first step in forming an idea of it
scope: The picture in the mind of a thing seen or felt, the first step in forming an idea, not the act
  of seeing itself and not the knowledge that comes from it.
examples:
- Her perception of the room was of a dark, cold place.
- His perception of the sound stayed with him all day.
