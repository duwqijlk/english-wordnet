simpleMeaning: The kind of communism put forward by Leon Trotsky, which calls for a revolution at once
  all over the world by working people.
scope: This is the kind of communism put forward by Leon Trotsky, which calls for a revolution at once
  all over the world by working people; other kinds of communism, such as Marxism or Stalinism, call for
  change in other ways.
examples:
- Trotskyism calls for a revolution all over the world by working people.
- Leon Trotsky put forward Trotskyism as his kind of communism.
