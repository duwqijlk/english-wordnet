simpleMeaning: Cattle eat the seed pods of this big ornamental tree of the American tropics, which bears
  twice-divided leaves and globe-like clusters of crimson-stamened flowers.
scope: Another name for the large ornamental tree of the American tropics also called monkey pod and rain
  tree; it is the tree itself, not its pods or a different plant.
examples:
- The zamang in the park is a favorite spot for picnics.
- Its pods fell from the zamang and the cattle ate them.
