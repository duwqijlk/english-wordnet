simpleMeaning: meat that comes from any kind of crab and is eaten as food
scope: Also called crab. This is the flesh eaten as food, not the living sea animal itself.
examples:
- She put fresh crabmeat in the salad.
- The crabmeat was sweet and soft to eat.
