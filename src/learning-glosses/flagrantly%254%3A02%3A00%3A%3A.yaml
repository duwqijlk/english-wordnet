synsetId: 00342657-r
simpleMeaning: In a way that is openly and plainly wrong, with no attempt to hide it.
scope: Of breaking safety rules or ignoring a ban, in full view of others.
examples:
- The firm flagrantly broke the safety rules and paid the fine without shame.
- She flagrantly ignored the ban, smoking in full view of the guards.
