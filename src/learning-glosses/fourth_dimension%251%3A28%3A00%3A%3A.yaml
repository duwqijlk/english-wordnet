simpleMeaning: the number needed, along with the three numbers that give a place in space, to say exactly
  when and where a thing happens
scope: 'Another name for time: the number needed with the three numbers of space to say exactly when and
  where a thing happens, not one of the three numbers of space on its own.'
examples:
- In physics, the fourth dimension is time.
- To fix the event you need the fourth dimension as well as length, width and height.
