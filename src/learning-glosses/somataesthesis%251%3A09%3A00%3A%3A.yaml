senseId: 'somataesthesis%1:09:00::'
synsetId: 05667701-n
simpleMeaning: 'A person knows the body without sight or hearing: touch, the feel of the limbs, and the
  parts inside tell what it is doing.'
scope: Also called somaesthesia, somaesthesis, somatesthesia, somatic sense, somatic sensory system, somatosensory
  system, somesthesia, or somesthesis, it is the body's own sense, not sight or hearing.
examples:
- With eyes shut, somataesthesis still tells where the arms are.
- Through somataesthesis, a person feels a hand grow numb.
