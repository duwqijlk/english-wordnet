simpleMeaning: when it is upset, this wingless creature hops in wild leaps; it lives in dark wet places,
  such as under dead tree trunks
scope: Also called machilid, this wingless creature lives in dark wet places, such as under dead tree
  trunks, and hops in wild leaps when it is upset.
examples:
- A jumping bristletail lived under the dead tree trunk.
- The jumping bristletail leapt wildly when it was upset.
