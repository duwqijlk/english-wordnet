scope: A native of Galatia in Asia Minor, above all one of the people believed to have been Gauls who
  took the land in the third century BC, rather than a native of another part of Asia Minor.
examples:
- The Galatian lived in Asia Minor.
- A Galatian came to the market from Galatia.
