simpleMeaning: An evergreen tree of Australia and nearby lands, with white or silvery bark and young leaves,
  and yellow flowers.
scope: 'Also called mimosa and silver wattle: an evergreen tree of Australia and nearby lands with white
  or silvery bark, young leaves and yellow flowers, not a tree that loses its leaves in winter.'
examples:
- Acacia dealbata shows yellow flowers in spring.
- The bark of Acacia dealbata is white or silvery.
