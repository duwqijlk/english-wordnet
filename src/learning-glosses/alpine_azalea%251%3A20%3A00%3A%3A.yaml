simpleMeaning: a low spreading evergreen shrub of high mountains in the northern half of the world, grown
  for its rose pink flowers
scope: Also called mountain azalea; a low mountain shrub grown for its flowers, not a tall garden shrub.
examples:
- The alpine azalea spread like a mat over the rocks.
- Alpine azalea blooms pink on the high slopes in June.
