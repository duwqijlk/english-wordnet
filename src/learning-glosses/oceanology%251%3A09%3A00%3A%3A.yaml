simpleMeaning: The branch of science that studies the seas, both their physical side and the life in them.
scope: The science of the seas, also called oceanography; not the study of fresh water and not the study
  of the sea floor alone.
examples:
- She studied oceanology to learn about life in the seas.
- Oceanology covers both the water and the life in it.
