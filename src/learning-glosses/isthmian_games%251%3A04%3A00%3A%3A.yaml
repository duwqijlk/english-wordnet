simpleMeaning: The old contest of all Greeks, held every two years on the Isthmus of Corinth in the first
  and third years of each Olympiad.
scope: One of the old contests for all Greeks, held at Corinth in the first and third years of each Olympiad,
  and set apart by that place and timing.
examples:
- Athletes came to the Isthmian Games every two years.
- The Isthmian Games were held on the Isthmus of Corinth.
