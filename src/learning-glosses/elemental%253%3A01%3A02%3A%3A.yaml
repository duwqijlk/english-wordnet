simpleMeaning: to do with very bad weather
scope: About very bad weather, such as storms, hail or cold rain. It is not about one of the basic things
  that all other things are made from.
examples:
- They raced against elemental storms and cold rain.
- The ship faced elemental weather, with hail and strong wind.
