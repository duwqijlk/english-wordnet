simpleMeaning: a small round boat made of animal skins stretched over a frame of thin sticks, still used
  in some parts of Great Britain
scope: A small round boat made with skins over thin sticks, not a large ship and not a boat made from
  wood boards.
examples:
- He crossed the river in a small coracle.
- The fisherman pulled his coracle out of the water.
