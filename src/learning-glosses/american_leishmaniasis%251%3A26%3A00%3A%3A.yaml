simpleMeaning: A kind of the sore sickness that lives in Mexico and Central America and South America,
  with sores only on the skin and the soft wet skin inside the body
scope: This is a kind of the sore sickness that lives in Mexico and Central America and South America,
  with sores only on the skin and the soft wet skin inside the body, also called leishmaniasis americana,
  mucocutaneous leishmaniasis, nasopharyngeal leishmaniasis and New World leishmaniasis; not the other
  kinds of the same sickness of other lands.
examples:
- American leishmaniasis left sores only on his skin.
- She was treated for American leishmaniasis in Mexico.
