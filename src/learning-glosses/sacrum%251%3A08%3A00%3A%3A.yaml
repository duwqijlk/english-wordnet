simpleMeaning: a wedge-shaped bone made of five fused vertebrae that forms the back part of the pelvis,
  joining the lowest lower-back vertebra at its base and the tailbone at its tip
scope: This is the fused pelvic bone at the base of the spine, separate from the tailbone below it and
  the lumbar vertebrae above.
examples:
- The sacrum carries the weight of the upper body into the pelvis.
- A fall can fracture the sacrum.
