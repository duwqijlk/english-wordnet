simpleMeaning: in a way that shows a child can do or understand things in a more grown-up way than is
  normal for their age
scope: This is about a child acting in a more grown-up way than is normal for their age, not about a plant
  growing early and not just about doing something soon.
examples:
- At age five, she precociously read books meant for older children.
- He precociously asked his teacher hard questions about how the world works.
