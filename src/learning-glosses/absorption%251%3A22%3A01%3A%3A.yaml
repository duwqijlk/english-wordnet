simpleMeaning: the way the body takes in nutrients (the useful parts of food) after food is broken down
  in the stomach and gut
scope: 'Also called assimilation: the body taking in the useful parts of food after it is broken down.
  Not the physics sense, not the chemistry sense, and not one group joining another group.'
examples:
- Good absorption helps a child grow strong from the food she eats.
- After digestion, absorption moves nutrients into the body.
