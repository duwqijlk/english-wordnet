simpleMeaning: by three times, to three times the size or amount
scope: This tells how much a thing grows or changes, by three times; it is not the describing word for
  a thing that is three times as great, and not the sense about having unlike parts.
examples:
- Our rent increased threefold in the past five years.
- Sales rose threefold after the new shop opened.
