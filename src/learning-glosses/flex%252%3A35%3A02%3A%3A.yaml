simpleMeaning: to make a thing take a shape that is not straight, but bent or at an angle
scope: 'Also called turn, twist, bend, and deform: to make a thing bent or at an angle, not to tighten
  a muscle to show its size.'
examples:
- He flexed the thin wire into a hook.
- The strong man flexed the iron bar with his hands.
