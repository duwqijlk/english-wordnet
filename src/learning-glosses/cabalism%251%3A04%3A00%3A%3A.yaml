simpleMeaning: holding fast to a very old and extreme idea about God and holy teaching
scope: 'Also called kabbalism: holding fast to a very old and extreme idea about God, not a secret plot
  and not a new way of thinking.'
examples:
- His cabalism made him reject every new reading of the old texts.
- The writer's cabalism kept him tied to the oldest ideas of his faith.
