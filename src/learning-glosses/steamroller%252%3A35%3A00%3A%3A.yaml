simpleMeaning: To crush a thing flat with a heavy rolling machine, as if to make it level.
scope: To crush a thing flat with a heavy roller, as if to level it, not the heavy machine itself, and
  not simply making a surface flat and level.
examples:
- Workers steamrollered the loose stones to crush them down.
- They steamrollered the roadbed until it was crushed flat.
