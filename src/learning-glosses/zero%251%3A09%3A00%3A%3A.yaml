simpleMeaning: The mark on a scale where counting starts, with numbers above it on one side and below
  it on the other
scope: The starting mark on a scale for numbers above and below, not the number that leaves a sum unchanged
  and not a gun sight setting.
examples:
- Zero on the scale marks where the count starts.
- He set the dial back to zero before he began.
