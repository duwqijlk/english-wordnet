simpleMeaning: One of the many tiny tubes in bone that hold blood vessels and tissue that joins things
  together, and together they form a network.
scope: This is one of the tiny tubes in bone that hold blood vessels, not a blood vessel itself or a tube
  in soft flesh.
examples:
- A Haversian canal carries blood through bone.
- Haversian canals form a network inside the bone.
