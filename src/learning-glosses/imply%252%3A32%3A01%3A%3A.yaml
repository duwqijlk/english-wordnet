simpleMeaning: In logic, to show that one thing must be true if another thing is true
scope: In logic, it is about what must follow from a fact. It is not the everyday use for hinting at something
  without saying it plainly.
examples:
- In logic, saying all men die and Tom is a man can imply that Tom will die.
- If A implies B, and A is true, then B must be true.
