simpleMeaning: Breathing in and out moves oxygen from the air into the body and sends carbon dioxide out
  with each breath.
scope: The body's taking in of air and letting it out, not the use of oxygen inside the cells; also called
  breathing, ventilation, and respiration.
examples:
- External respiration brings oxygen into the blood and clears carbon dioxide away.
- When external respiration stops, the body gets no fresh oxygen.
