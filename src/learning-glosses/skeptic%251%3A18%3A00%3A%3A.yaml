simpleMeaning: a person who, as a habit, doubts what most people accept as true
scope: 'Also called doubter and sceptic: a person who doubts what others accept as true, not a person
  who knows nothing about a subject.'
examples:
- The skeptic asked for proof before he believed the claim.
- As a skeptic, she questioned the popular belief.
