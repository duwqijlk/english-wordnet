simpleMeaning: An evergreen tree of the West Indies and Central America, with dark green leaves gold and
  silky beneath and purple fruit you can eat, star-shaped when cut across.
scope: A green-all-year tree of the West Indies and Central America, also called star apple, not a tree
  grown only for its wood.
examples:
- The caimito in the yard bears purple fruit.
- Cut a caimito across and you will see a star.
