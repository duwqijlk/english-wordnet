simpleMeaning: a person with power who puts too much unfair pressure on other people
scope: This is a person with power who puts too much unfair pressure on other people; not just any leader
  or ruler, and not a person with no power who is simply unkind.
examples:
- The workers saw their boss as an oppressor who gave them no rest.
- People rose up against the oppressor who ruled the land with fear.
