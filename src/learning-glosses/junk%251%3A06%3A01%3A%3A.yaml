simpleMeaning: one of several kinds of Chinese boats with a high back deck and lugsails (sails hung from
  a bar that lies across the mast at an angle)
scope: This is a Chinese boat with sails, not old things that are thrown away or have no use.
examples:
- A junk sailed slowly into the harbor with its sails up.
- They crossed the bay in a wooden junk.
