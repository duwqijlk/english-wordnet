simpleMeaning: a poisonous plant from northern Europe with hooded blue-purple blooms; its dried leaves
  and roots give a strong poison called aconite
scope: 'Also called monkshood and helmetflower: a poisonous plant with hooded blue-purple blooms, not
  an orchid or a skullcap plant.'
examples:
- The gardener warned us not to touch the helmet flower growing by the fence.
- Dried helmet flower leaves were once used to make a strong poison.
