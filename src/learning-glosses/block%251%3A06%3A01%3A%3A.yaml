simpleMeaning: Something that stops a pipe or tube so that liquid or gas cannot pass through.
scope: A thing that obstructs the inside of a pipe or tube; not a computing data unit, not a memory lapse,
  not a ban on using assets, and not interference with broadcast signals.
examples:
- A block of fat had formed in the kitchen drain.
- The plumber removed a block from the water pipe.
