simpleMeaning: a flat, blade-like part that sticks out from the arm of an anchor
scope: 'Also called flue: this is the flat part of an anchor, not a part of a whale''s tail, not a sharp
  part on a weapon, and not a small flat worm that lives inside animals.'
examples:
- The anchor's fluke dug into the sand and held the boat in place.
- A wide fluke on each arm helps the anchor grip the sea bed.
