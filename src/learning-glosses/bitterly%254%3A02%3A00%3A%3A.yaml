simpleMeaning: in a way that shows strong angry, hurt feelings because you think you were treated in an
  unfair way
scope: In a way full of angry, hurt feelings about unfair treatment, not in a way that tastes sharp and
  not in a very cold or strong way.
examples:
- She complained bitterly about losing her job to a younger worker.
- He spoke bitterly about the way the company had treated him.
