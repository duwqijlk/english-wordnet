simpleMeaning: In classical mythology, a figure of great strength and daring, remembered for brave deeds
  and often born of a god and a human.
scope: This is the hero of ancient myth, not an ordinary brave person, not a story's main character, and
  not the long sandwich.
examples:
- Achilles is the greatest hero of Greek myth.
- The hero slew the monster and returned home.
