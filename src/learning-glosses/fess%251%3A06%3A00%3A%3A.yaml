simpleMeaning: 'In heraldry, a basic shape on a shield: a wide band that goes across it from side to side'
scope: Also called fesse. This is a wide band across a shield in heraldry, not a band going down a shield
  and not a small mark or picture on a shield.
examples:
- The old shield had a red fess across its middle.
- He painted a silver fess on the blue shield.
