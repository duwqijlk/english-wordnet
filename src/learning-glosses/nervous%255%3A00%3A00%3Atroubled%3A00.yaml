simpleMeaning: worried or uneasy, or causing or showing those feelings
scope: Feeling or causing worry, not being easily excited or highly strung, and not the medical sense
  about the body's nerves; anxious, queasy, uneasy and unquiet are other names for this sense.
examples:
- She felt nervous before the interview.
- There were a few nervous moments while they waited for the verdict.
