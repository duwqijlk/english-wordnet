simpleMeaning: to clean a thing with a sour chemical so that it turns pale
scope: To clean a thing with a sour chemical so it turns pale, not to wash it with soap and water and
  not to dye it a new colour.
examples:
- She decided to acid-wash the blue jeans to give them a pale look.
- They acid-wash the denim before they sew the jackets.
