simpleMeaning: a growth in the body that is not cancer and is made of the tough stuff that joins parts
  of the body
scope: A growth that is not cancer, made of the tough stuff that joins body parts, not a cancer and not
  a sore on the skin.
examples:
- The doctor found a fibroma on her arm.
- The fibroma was small and did not spread.
