simpleMeaning: A circuit joining two or more places so data can be sent and received between them.
scope: This is the data-transmission circuit between locations, also called a data link, not the computer
  instruction pointing from one program part to another or the radio communication system within a larger
  network.
examples:
- Engineers installed a dedicated link between the two data centers.
- When the link failed, the remote site lost contact with the main server.
