simpleMeaning: A European grass-like plant with small parts under the soil that can be eaten, like nuts.
scope: 'Also called chufa or an earth almond: a European grass-like plant with small edible parts under
  the soil, not an almond tree and not a potato.'
examples:
- Ground almond grows in damp fields across Europe.
- Farmers dig up ground almonds for their small edible tubers.
