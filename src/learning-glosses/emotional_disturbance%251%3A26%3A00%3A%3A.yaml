simpleMeaning: No bodily fault in the brain that can be found lies behind this trouble of the mind, where
  feelings are disturbed above all else
scope: Also called affective disorder, emotional disorder, and major affective disorder, this trouble
  of the mind disturbs feelings above all else, with no clear bodily cause in the brain.
examples:
- His emotional disturbance made it hard for him to keep his feelings steady.
- The emotional disturbance came with no bodily fault in the brain that anyone could find.
