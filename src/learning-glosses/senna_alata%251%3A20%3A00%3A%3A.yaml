simpleMeaning: A tropical shrub, chiefly of the Americas, with yellow flowers and large leaves whose juice
  is used to heal ringworm and poisonous bites, and sometimes placed in the genus Cassia
scope: Also called the ringworm bush, ringworm cassia, ringworm shrub, and Cassia alata; a tropical shrub
  whose leaf juice heals ringworm and poisonous bites.
examples:
- Senna alata grew by the path with big yellow flowers.
- The healer rubbed Senna alata juice on the ringworm.
