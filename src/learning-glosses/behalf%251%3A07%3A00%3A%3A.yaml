simpleMeaning: for the good of someone, usually said as 'in' plus this word rather than 'on' plus this
  word, and usually with a word like 'his' or 'your'
scope: This is about doing something for someone's good, not about speaking or acting for someone in their
  place.
examples:
- She spoke a good word in his behalf.
- He is campaigning in his own behalf.
