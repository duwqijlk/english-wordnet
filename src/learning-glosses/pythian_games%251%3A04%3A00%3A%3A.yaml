simpleMeaning: An old sports meeting of all Greece at Delphi, held every four years in the third year
  of the Olympiad, in honour of Apollo.
scope: An old sports meeting of all Greece at Delphi, held every four years in the third year of the Olympiad,
  in honour of Apollo, not the Olympic Games and not the Isthmian Games.
examples:
- The Pythian Games were held at Delphi in honour of Apollo.
- Athletes from all Greece came to the Pythian Games every four years.
