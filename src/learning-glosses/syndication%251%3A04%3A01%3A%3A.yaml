simpleMeaning: selling a piece of writing or a cartoon so it can be printed in many papers or magazines
  at the same time
scope: This sense is selling writing or a drawing to many papers at the same time, not forming a joined
  group or running one.
examples:
- She earned money from the syndication of her weekly cartoon.
- Syndication put his article in papers across the country on the same day.
