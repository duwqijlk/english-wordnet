simpleMeaning: For its own gain, not for the good of all, a small group runs a party group, and this party
  member belongs to that group
scope: 'Also called hack and machine politician: a party member in a small group that runs a party for
  its own gain, not an honest reformer and not a party member who serves the public.'
examples:
- The political hack owed his seat to the clique that ran the party.
- Voters distrusted the political hack who served only his friends.
