simpleMeaning: a tooth with two points, that sits between the front teeth and the back teeth
scope: 'Also called a premolar: a tooth with two points between the front teeth and the back teeth, not
  a front tooth and not a back tooth.'
examples:
- The dentist found a small crack in my bicuspid.
- She lost a bicuspid when she was twelve years old.
