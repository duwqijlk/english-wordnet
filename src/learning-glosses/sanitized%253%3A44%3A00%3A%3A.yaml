simpleMeaning: made clean and safe to use, with germs and dirt taken away
scope: This describes a thing that has been made clean and free from germs. It is not about a story or
  report that has had bad or rude parts taken out.
examples:
- The bandages were kept in a sanitized bag.
- She cleaned the baby's bottle until it was fully sanitized.
