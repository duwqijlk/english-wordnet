simpleMeaning: The act of putting oil on a person as part of a holy rite or a rite of healing
scope: The act of putting oil on a person in a holy rite or a rite of healing, also called unction; not
  the oil itself and not a blessing with no oil.
examples:
- The inunction took place during the healing service.
- Inunction with holy oil was part of the ceremony.
