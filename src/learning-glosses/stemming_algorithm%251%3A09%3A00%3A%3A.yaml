simpleMeaning: A set of steps that cuts off endings that change a word's form or make a new word, so changed
  forms all go back to one base form
scope: A set of steps for cutting word endings, also called a stemmer; not the worker who takes the stiff
  middles out of tobacco leaves.
examples:
- The stemming algorithm reduces words to one base form.
- A stemming algorithm cuts endings off word forms.
