senseId: 'achromatinic%3:01:00::'
synsetId: 02707375-a
simpleMeaning: Of the stuff inside the centre of a cell, taking up little colour from dyes.
scope: Describing cell stuff that stains only faintly, not cell stuff that takes a strong colour and not
  a dye itself.
examples:
- The achromatinic part of the nucleus stayed pale.
- Achromatinic threads took up almost no dye.
