simpleMeaning: not any thing; no amount or thing at all
scope: Also called nothing, zero, zip, naught, aught, nil, cipher, nix, nada, cypher, zilch, goose egg
  and zippo. It means not any thing and no amount at all.
examples:
- All the work we had done was reduced to null.
- By the end of the year, his savings had fallen to null.
