simpleMeaning: A rare disorder of the body's chemistry, passed on when both parents carry it, in which
  dark colouring settles in the tissues and the urine carries a dark substance
scope: This disorder is also called alcaptonuria.
examples:
- The alkaptonuria showed in his urine.
- Alkaptonuria runs in families and shows up in the urine.
