simpleMeaning: not willing because you dislike something a little or do not think it is right
scope: This means not wanting to do something because of a mild dislike or a feeling that it is wrong;
  it is not being unable to do it.
examples:
- She was disinclined to speak in front of the whole class.
- He felt disinclined to accept the plan, though he did not hate it.
