simpleMeaning: A disorder present at birth that grows worse, in which the body handles fats badly; it
  starts at age 5 and brings blindness, loss of mind and early death
scope: Also called juvenile amaurotic idiocy; a disorder present at birth that grows worse, starting at
  age 5 with blindness, loss of mind and early death, its near kin being other disorders of fat handling
  in children such as Tay-Sachs disease and Niemann-Pick disease.
examples:
- Spielmeyer-Vogt disease begins in childhood, at about age five.
- Children with Spielmeyer-Vogt disease slowly lose their sight.
