senseId: 'use%1:04:01::'
synsetId: 00415192-n
simpleMeaning: In psychology, a fixed way of reacting automatically to a given situation, which may be
  inborn or built up by repeating it often.
scope: This is the psychology term for an automatic habit of response, whether inherited or learned by
  repetition. It is not the ordinary noun for the act of using something, and not 'what something is used
  for'. Rare and literary outside psychology; modern speech usually says 'habit'.
examples:
- It was his use to walk the same path to the mill each morning.
- Long use had taught the old dog to wait by the gate.
