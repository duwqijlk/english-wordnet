simpleMeaning: the plain middle sound of a word, the soft uh sound in a part of a word that is not stressed
scope: The soft uh sound in an unstressed part of a word, also called shwa; not a full clear vowel and
  not a stressed sound.
examples:
- The last sound in 'sofa' is a schwa.
- The schwa is the weak sound in the first part of 'about'.
