simpleMeaning: The place where the nerve from the eye meets the back of the eye, which cannot sense light.
scope: The place where the nerve from the eye meets the back of the eye, which cannot sense light; optic
  disc and optic disk are other names for this sense, not a dark mark on the eye and not a gap in what
  a person knows.
examples:
- The blind spot cannot sense light.
- Light falling on the blind spot is not seen.
