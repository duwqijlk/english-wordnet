simpleMeaning: in the cold north of Europe, Asia, and America grows a low shrub with green leaves all
  year round and red berries that people can eat
scope: 'Also called cowberry, foxberry, lingberry, lingenberry, and mountain cranberry: a low shrub with
  red berries that people can eat, not a tall bush and not a plant whose berries are blue or black.'
examples:
- We picked lingonberries in the woods in northern Sweden.
- The jam was made from fresh lingonberries.
