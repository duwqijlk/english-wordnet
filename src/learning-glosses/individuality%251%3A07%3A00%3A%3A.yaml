simpleMeaning: the quality of being a single person on your own, not just part of a group
scope: This is the quality of being a single person on your own, also called individualism and individuation.
  It is not the special way a person is and acts that makes that person unlike others.
examples:
- She kept her sense of individuality even in a large class.
- Wearing the same uniform did not take away the children's individuality.
