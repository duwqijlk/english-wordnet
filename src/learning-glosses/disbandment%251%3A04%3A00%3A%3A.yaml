simpleMeaning: the act of breaking up a group so that it no longer meets or works together
scope: The act of breaking up a group so that it no longer meets or works together, not the act of starting
  a group and not the act of joining a group.
examples:
- The orchestra faced the prospect of disbandment.
- Disbandment of the club followed the loss of its funds.
