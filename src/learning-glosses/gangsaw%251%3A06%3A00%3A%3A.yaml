simpleMeaning: Several blades set side by side cut at the same time in this power-driven saw
scope: A machine saw with several blades that cut together, not a hand saw with one blade and not a saw
  that cuts one piece at a time.
examples:
- The gangsaw cut the log into planks in one pass.
- They fed the board through the gangsaw to slice it into strips.
