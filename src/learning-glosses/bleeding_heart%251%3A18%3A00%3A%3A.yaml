simpleMeaning: a person who feels too much pity for people who say they are badly treated or have too
  little
scope: A person who feels too much pity for people who say they are badly treated, not a kind helper and
  not the garden plant with pink flowers.
examples:
- He is such a bleeding heart that he gives money to every story he hears.
- Critics called her a bleeding heart for taking up the cause of the poor.
