simpleMeaning: The eye turns outward when this small cord tells the straight muscle on its outer side
  to pull.
scope: Also called abducens nerve, abducent, abducent nerve, nervus abducens, and sixth cranial nerve,
  this cord is the one that tells the straight muscle on the outer side of the eye to pull.
examples:
- The abducens carries orders to the muscle that turns the eye outward.
- The eye turns outward when the abducens tells its muscle to pull.
