simpleMeaning: A safety device in a car that keeps the driver or the person beside them from being thrown
  forward, by filling up when the car crashes.
scope: In a crash, this safety device in a car fills up and keeps the driver or the person beside them
  from being thrown forward.
examples:
- Her air bag filled and held her back when the car crashed.
- His air bag saved him from being thrown forward in the crash.
