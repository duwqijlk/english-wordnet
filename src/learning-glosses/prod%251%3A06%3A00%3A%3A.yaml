simpleMeaning: a tool with a sharp end, used to poke a thing so that it starts to move
scope: A pointed tool used to poke a thing into motion, not the act of poking or thrusting.
examples:
- The farmer used a prod to move the cows along the road.
- He gave the donkey a prod with the stick to get it walking.
