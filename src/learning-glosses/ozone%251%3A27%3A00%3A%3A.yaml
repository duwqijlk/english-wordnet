simpleMeaning: A colourless gas (O3) dissolves in alkalis and cold water, is a strong oxidizer, forms
  from oxygen under electric sparks or ultraviolet light, and screens ultraviolet rays in the stratosphere.
scope: The gas O3, a strong oxidizer that shields Earth from ultraviolet rays high in the atmosphere;
  not ordinary oxygen (O2), and not the ozone layer as a whole.
examples:
- Ozone high in the atmosphere absorbs harmful ultraviolet radiation.
- The sparking equipment produced ozone from the oxygen in the air.
