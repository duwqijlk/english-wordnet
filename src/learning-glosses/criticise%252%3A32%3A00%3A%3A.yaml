simpleMeaning: to say what is wrong with someone or something, and to point out faults that are real or
  only seem to be there
scope: 'Also called knock and criticize: to say what is wrong with a thing or person, not to work as a
  critic giving views on art, books, or films.'
examples:
- She criticised the plan for being too slow.
- He criticised the food, saying the soup was cold and the bread was hard.
