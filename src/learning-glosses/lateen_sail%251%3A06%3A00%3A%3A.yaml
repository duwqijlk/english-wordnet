simpleMeaning: A three-cornered cloth that catches the wind, set fore and aft, used above all in the Mediterranean.
scope: A three-cornered cloth that catches the wind, set fore and aft, used above all in the Mediterranean;
  lateen is another name for this sense, not a square cloth, and not a cloth set across the boat.
examples:
