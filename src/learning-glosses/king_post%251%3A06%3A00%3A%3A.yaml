simpleMeaning: An upright piece that joins the crossbeam to the top point of a three-sided frame
scope: This is an upright piece that joins the crossbeam to the top point of a three-sided frame, not
  a side piece of the frame and not the crossbeam itself.
examples:
- The king post joins the crossbeam to the top of the frame.
- A king post holds the roof frame together.
