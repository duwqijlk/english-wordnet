simpleMeaning: about, used in, or doing the work of treating illnesses of the mind
scope: This word is about care and work for illnesses of the mind; it is not about illness of the body
  or care for the body.
examples:
- She works as a nurse in a psychiatric hospital.
- He stayed at home after his psychiatric treatment ended.
