simpleMeaning: Spikes of blue flowers and showy leaves of many colours mark one of several kinds of plant
  from warm lands in the Old World, of the group Coleus.
scope: Also called coleus, this plant from warm lands in the Old World is one of several kinds of the
  group Coleus, with showy leaves of many colours and spikes of blue flowers.
examples:
- The flame nettle in the window box had leaves of many colours.
- She grew flame nettles for their spikes of blue flowers.
