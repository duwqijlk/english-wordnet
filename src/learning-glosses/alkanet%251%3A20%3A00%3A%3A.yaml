simpleMeaning: Grown for the sake of its blooms, fine, thin, and most often blue, this herb comes back
  year after year or lives for two.
scope: Also called bugloss, the name belongs to the whole herb, though the blooms are what it is grown
  for.
examples:
- Alkanet grew in the garden bed for its blue flowers.
- The alkanet's blue flowers opened beside the other herbs.
