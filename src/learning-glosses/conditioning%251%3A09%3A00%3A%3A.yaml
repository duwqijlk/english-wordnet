simpleMeaning: a way of learning in which what a living thing does comes to depend on a signal in the
  place around it
scope: A way of learning tied to a signal in the surroundings, not simply getting used to a thing and
  not a habit formed by chance.
examples:
- The dog's conditioning made it sit when it heard the bell.
- Through conditioning, the rat learned to press the lever for food.
