simpleMeaning: about the part of the United States that generally includes Washington, Oregon, and Idaho,
  and sometimes Montana and Wyoming
scope: About that named group of states in the United States, not just placed in or pointing toward the
  north-west.
examples:
- The northwestern region of the United States generally includes Washington, Oregon, and Idaho.
- Sometimes Montana and Wyoming are counted as part of the northwestern region too.
