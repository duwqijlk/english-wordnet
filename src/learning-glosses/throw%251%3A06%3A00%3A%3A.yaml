simpleMeaning: a light blanket or cover draped loosely over something
scope: This is a soft cloth covering laid over something, not the act of sending an object through the
  air, and not a cast of dice or a coin.
examples:
- She folded the throw and laid it across the foot of the bed.
- A woolen throw kept the old man warm in his chair.
