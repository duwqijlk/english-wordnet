simpleMeaning: To leave the other player with no clear shot at the ball they want to hit.
scope: In snooker, to leave the other player with no clear shot; not the game itself, a form of pool played
  with fifteen red balls, six balls of other colours, and a cue ball.
examples:
- He snookered his opponent, leaving the white ball tucked behind the pink.
- They snookered the other player so well that no direct shot was left.
