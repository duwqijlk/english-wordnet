simpleMeaning: Needing a lot of thought, because it is difficult to understand, work out or accept.
scope: This sense is about an idea, problem or decision that is hard to understand or accept, not about
  something physically hard to chew or a task that tests your stamina.
examples:
- The final question was tough, and none of us could work out the answer.
- Losing the match was a tough result to accept.
