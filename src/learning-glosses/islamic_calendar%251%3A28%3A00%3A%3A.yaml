simpleMeaning: The moon count of months used by Muslims, from 622 AD, the year of the Hegira; its year
  moves back through the sun year and comes round every 32 years.
scope: 'Also called Mohammedan calendar, Moslem calendar, Muhammadan calendar and Muslim calendar: the
  moon count of months used by Muslims, from 622 AD, the year of the Hegira; its year moves back through
  the sun year and comes round every 32 years, unlike the sun-based count used in most of the world.'
examples:
- The Islamic calendar starts in 622 AD, the year of the Hegira.
- Under the Islamic calendar, the new year moves back through the sun year.
