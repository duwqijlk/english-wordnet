senseId: 'letters_of_administration%1:10:00::'
synsetId: 06543472-n
simpleMeaning: A legal paper that names a person to manage what someone who has died leaves behind when
  no executor was named.
scope: A law paper that names who looks after a dead person's goods, not a will and not a paper that names
  an heir.
examples:
- The court gave her letters of administration so she could settle her father's estate.
- Without letters of administration, the bank would not let him touch the estate.
