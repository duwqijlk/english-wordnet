simpleMeaning: a plant with leaves that have a strong, pleasant smell, that lives for one year or for
  more than two years
scope: This is the living plant itself, not just its cut leaves used on food to add taste or to make a
  dish look good.
examples:
- Parsley grows well in a pot by the kitchen window.
- She planted parsley in the garden in spring.
