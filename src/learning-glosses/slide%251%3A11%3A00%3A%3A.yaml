simpleMeaning: In geology, the downward movement of a big body of soil, rock, snow, or similar material.
scope: 'The geology sense: a mass of soil, rock, or snow moving downhill, not the playground ramp, the
  chute for goods, or a smooth movement along a surface.'
examples:
- A slide of mud and rock buried the road.
- The heavy snow caused a slide on the mountain pass.
