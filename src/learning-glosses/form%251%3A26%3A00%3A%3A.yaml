simpleMeaning: In physical chemistry, a separate state of matter within a system, made of material with
  the same chemical makeup and physical state, divided from other material by a phase boundary.
scope: This is the physical-chemistry sense of a separate state of matter, not a shape, body, or outward
  appearance, not the sound or spelling of a word, not a document with spaces to fill in, not a kind or
  type, not a class of students, not a biological subgroup, not a mannequin or a concrete mold, not the
  arrangement of parts in a work, not a particular way something shows itself, not an ability to perform,
  and not any verb use.
examples:
- The liquid and the gas are separate forms in the system, each with its own physical state.
- A phase boundary divides one form of the substance from the other.
