simpleMeaning: a small bag for travel that holds brushes, bottles, and things for washing and caring for
  the face and body
scope: A small travel bag for brushes, bottles, and washing things, not a large suitcase for clothes and
  not a box for tools.
examples:
- She packed her brushes and bottles into the dressing case before the trip.
- His dressing case held a razor, a comb, and a small bottle.
