schema: oewn-learning-gloss-v2
senseId: 'statement%1:10:06::'
synsetId: 07217786-n
simpleMeaning: The act of putting something into words as a claim or declaration.
scope: This is the act of making a claim or declaration, not the financial record of money paid in and
  out (the other sense of this word), not the spoken or written message itself, not a claim offered as
  proof that something is true, not the playing of a musical theme, not a message sent without words,
  and not a line of code in a computer program.
examples:
- The mere statement of a belief does not make it true.
- Making that statement before the board cost him his job.
