simpleMeaning: the part of the study of language that deals with how words are put together and how they
  change their form, and sometimes also with what they mean
scope: The part of the study of language about word order and word forms, not the study of sounds and
  not a book of rules for one language.
examples:
- Good grammar helps the reader follow your ideas.
- She teaches grammar at the local school.
