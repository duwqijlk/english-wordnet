simpleMeaning: A thing with a smell so bad that people do not want to be near it, especially a cheap cigar
scope: This is a thing that smells very bad, not a person thought to be bad and low, and not a thing,
  especially a car, that is badly made or does not work well.
examples:
- That cheap cigar was a real stinker.
- The old cheese was a stinker, so he threw it away.
