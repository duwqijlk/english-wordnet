simpleMeaning: a method of torturing someone by enclosing the feet in iron and crushing them slowly.
scope: This is the torture method itself, not the iron device used to carry it out or the car's luggage
  compartment.
examples:
- Prisoners were subjected to the boot until their feet were crushed.
- The boot was a brutal punishment that shattered the bones of the feet.
