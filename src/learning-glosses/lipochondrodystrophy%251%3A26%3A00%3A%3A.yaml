senseId: 'lipochondrodystrophy%1:26:00::'
synsetId: 14180645-n
simpleMeaning: An inherited disorder, passed on only when both parents carry the gene, in which the body
  mishandles complex sugars, causing severe bone and cartilage deformities and intellectual disability.
scope: Another name for dysostosis multiplex and gargoylism, the same inherited disorder of sugar metabolism;
  not a separate disease of fat storage.
examples:
- Lipochondrodystrophy was the name used before the enzyme defect was understood.
- The old textbook described lipochondrodystrophy as a disorder of sugar metabolism.
