simpleMeaning: no feeling in the lower half of the body, from harm to the main nerve cord in the back
  or a drug put in under the covering round that cord
scope: 'Also called spinal anaesthesia and spinal anesthesia: no feeling in the lower half of the body,
  not the word for things to do with the back or its main nerve cord.'
examples:
- The doctor gave her a spinal before the operation on her legs.
- He was given a spinal so he would feel no pain below the waist.
