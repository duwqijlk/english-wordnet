simpleMeaning: A serious long-lasting swelling of the lower small gut that keeps coming back, bringing
  bouts of loose bowels with belly pain, sickness, fever and loss of weight.
scope: Also called regional enteritis or regional ileitis; a serious long-lasting swelling of the lower
  small gut with bouts of loose bowels and belly pain, not a short stomach upset.
examples:
- Crohn's disease causes bouts of belly pain and weight loss.
- She lives with Crohn's disease, a long-lasting swelling of the gut.
