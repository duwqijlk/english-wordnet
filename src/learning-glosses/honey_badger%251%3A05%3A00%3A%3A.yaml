simpleMeaning: This meat-eating animal, kin to the weasel, lives in the woods of Africa and southern Asia
  and comes out after dark.
scope: People also call this night-roaming, meat-eating animal of the woods in Africa and southern Asia
  a ratel.
examples:
- The honey badger came out after dark and moved through the woods.
- We saw a honey badger near the trees at the edge of the forest.
