simpleMeaning: Staying upright is helped when the cord that joins a muscle to the bone is pulled and the
  muscle tightens on its own.
scope: People also call it myotactic reflex, and it is a muscle that tightens on its own when its cord
  is pulled, which helps the body stay upright, not a movement the person chooses to make.
examples:
- His stretch reflex kept him upright.
- The muscle tightened by a stretch reflex.
