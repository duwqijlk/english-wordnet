simpleMeaning: a knife used by doctors in operations, with a pointed blade that is sharp on both sides,
  used to make holes and small cuts
scope: 'Also called lance: this is a knife used by doctors in operations to make holes and small cuts,
  not a pointed arch in an old church building and not a long spear.'
examples:
- The doctor used a lancet to make a small cut in the skin.
- She cleaned the lancet before using it to make a tiny hole for the blood test.
