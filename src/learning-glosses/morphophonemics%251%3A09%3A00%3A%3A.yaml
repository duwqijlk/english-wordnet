simpleMeaning: The study of how the small parts of words sound in their different forms when they are
  used in a language
scope: The study of word sounds in use, not the study of word meanings and not the study of sounds on
  their own.
examples:
- She took a course in morphophonemics to learn how word parts change their sound.
- Morphophonemics asks why the same word part can sound different in different words.
