simpleMeaning: used especially of ideas or principles, set deep in the mind and held firm, so they are
  hard to change
scope: Also called planted, and another name for it is ingrained; it is about ideas set deep, not about
  a thing put into the body or into the ground.
examples:
- His implanted belief that hard work matters never left him.
- She had an implanted respect for her teachers that stayed all her life.
