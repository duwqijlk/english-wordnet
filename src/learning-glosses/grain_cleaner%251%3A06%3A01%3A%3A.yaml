simpleMeaning: Before seed is stored or sold, it goes through this machine, which takes the dirt and bad
  bits out of it and makes it better
scope: A machine that cleans and improves harvested seed before storage or sale, not a mill that grinds
  it and not a storehouse.
examples:
- The farmer ran the grain through the grain cleaner before selling it.
- A new grain cleaner stood beside the barn.
