simpleMeaning: a small oily fish from Europe, often smoked or put in tins, like sardines
scope: 'Also called brisling: a small oily fish from Europe, not a sardine and not a big fish eaten fresh.'
examples:
- We ate smoked sprat on toast for lunch.
- The sprat is a small fish, often sold in tins like sardines.
