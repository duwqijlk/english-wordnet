simpleMeaning: strong praise and show of liking, especially when people clap loudly
scope: Strong praise shown by loud clapping, not just quiet liking and not a prize or award given to someone.
examples:
- The singer got a long ovation at the end of the show.
- The crowd gave him an ovation when he finished his speech.
