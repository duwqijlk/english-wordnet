simpleMeaning: how wide a tube or gun barrel is, measured straight across
scope: The width of a tube or gun barrel measured straight across, also called a gauge, caliber or calibre,
  not the hole itself, not the act of drilling it, and not a dull person.
examples:
- The bore of the rifle is smaller than that of the shotgun.
- The pipe's bore must match the fitting exactly.
