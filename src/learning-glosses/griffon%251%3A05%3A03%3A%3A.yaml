scope: A big vulture of south Europe and north Africa, with pale feathers and black wings; also called
  griffon vulture; not a breed of very small, firm, wiry-coated dogs of Belgian stock, with a short, bearded
  muzzle, nor a winged beast with the head of an eagle and the body of a lion.
examples:
