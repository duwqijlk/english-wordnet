simpleMeaning: A usually sunless, free-living protozoan, with whip-like limbs, some bringing ills to humans
  and other beasts.
scope: A usually sunless, free-living protozoan, with whip-like limbs, some bringing ills to humans and
  other beasts; also called flagellate protozoan, flagellated protozoan, mastigophoran, or mastigophore;
  not having, or like, a lash or whip, as a flagellum does.
examples:
- Their flagellate swam at dawn.
- The flagellate was seen in the drop.
