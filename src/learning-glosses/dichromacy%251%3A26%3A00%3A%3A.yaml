senseId: 'dichromacy%1:26:00::'
synsetId: 14177098-n
simpleMeaning: Only two kinds of light, mixed together, let a person with this lack of colour sight match
  any shade; most people need three.
scope: Also called dichromasy, dichromatism, dichromatopsia and dichromia; it is a lack in colour sight,
  not the full colour sight of most people, who need three kinds of light to match a shade.
examples:
- Dichromacy let him match the shade with two kinds of light, while his friends needed three.
- Her dichromacy means she needs only two kinds of light to match any colour she sees.
