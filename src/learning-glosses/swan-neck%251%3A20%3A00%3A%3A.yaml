simpleMeaning: any of several orchids of the group Cycnoches whose slim, arching flower stems bend in
  a long curve, like a big white water bird
scope: Also called a swan-flower, a swan orchid, a swanflower, and a swanneck; an orchid with slim curving
  flower stems, not a swan and not a water lily.
examples:
- The swan-neck orchid had flower stems arching in a long curve.
- A swan-neck in bloom shows slender columns of flowers.
