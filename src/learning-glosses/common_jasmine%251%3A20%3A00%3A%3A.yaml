simpleMeaning: White, yellow or red flowers with a sweet smell grow on this climbing bush that loses its
  leaves in autumn, used to make perfume and to give tea a taste.
scope: Also called jessamine and true jasmine, this is the climbing bush with sweet-smelling white, yellow
  or red flowers, used to make perfume and to give tea a taste.
examples:
- The common jasmine gave off a sweet smell.
- She picked common jasmine flowers to scent the tea.
