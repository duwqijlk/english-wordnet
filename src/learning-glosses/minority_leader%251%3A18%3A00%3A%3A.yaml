simpleMeaning: The person who heads the party with fewer seats in a law-making body.
scope: The person who heads the party with fewer seats in a law-making body; not the person who heads
  the party with more seats, and not the person who runs the meetings.
examples:
- The minority leader spoke against the bill in the debate.
- She became minority leader after her party lost seats.
