simpleMeaning: An insect that, when fully grown, has four wings more or less covered with tiny scales.
scope: 'Another name for a lepidopteran and a lepidopterous insect: a grown insect with four wings more
  or less covered with tiny scales, not a young insect without wings and not a bird.'
examples:
- The lepidopteron rested on the leaf, its four wings folded flat.
- Under the glass, the lepidopteron showed wings dusted with tiny scales.
