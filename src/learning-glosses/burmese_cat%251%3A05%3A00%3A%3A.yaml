simpleMeaning: A short-haired breed with a body like the Siamese, but with a plain dark brown or grey
  coat.
scope: It names a breed of cat, not one single cat; the breed is known by its short hair, its body like
  the Siamese cat's, and its coat of one plain dark colour, brown or grey.
examples:
- The Burmese cat slept in the sun.
- Our Burmese cat has a dark brown coat.
