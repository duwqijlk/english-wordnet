simpleMeaning: something that happens when a thing goes from being in one state to being in another
scope: 'Also called change and alteration: an event in which something passes from one state to another.
  It is not the act of making something different, and not a slightly changed copy.'
examples:
- A sudden modification in the weather turned the warm day cold.
- The modification from solid ice to liquid water happens as it warms.
