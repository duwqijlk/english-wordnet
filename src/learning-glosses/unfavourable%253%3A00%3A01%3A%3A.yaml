simpleMeaning: Of wind or weather, likely to get in the way or work against you.
scope: Of wind or weather, likely to get in the way or work against you; also called unfavorable; not
  about events that work against success, and not about failing to cheer, approve, or please.
examples:
- The wind was unfavourable all morning.
- The weather turned unfavourable before noon.
