simpleMeaning: A reddish-brown dried gummy substance from several Eucalyptus trees, especially Eucalyptus
  camaldulensis.
scope: Also called eucalyptus gum and red gum; this reddish-brown gummy substance dries after oozing from
  such trees.
examples:
- The eucalyptus kino oozed from the tree and dried.
- Eucalyptus kino dried reddish-brown where it had oozed.
