simpleMeaning: What oozes from any of several trees of that kind, above all one kind of them, dries into
  a reddish-brown sticky stuff.
scope: Also called eucalyptus gum and red gum, it is a reddish-brown sticky stuff that dries after oozing
  from trees of that kind.
examples:
- The eucalyptus kino oozed from the tree and dried.
- Eucalyptus kino dried reddish-brown where it had oozed.
