simpleMeaning: a person who lives in Maine only for the warm months of the year
scope: A person who spends only the warm months in Maine, also called a sport, not a person who lives
  in Maine all year round.
examples:
- The summercater spends June to August at her cottage in Maine.
- Every year the summercater returns to Maine when the weather warms up.
