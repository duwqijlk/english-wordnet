simpleMeaning: a way of weighing things in which the pound has 16 ounces, or 7,000 grains
scope: Another name for avoirdupois, it is a set of weights built on the 16-ounce pound, not a metric
  set and not one weight by itself.
examples:
- The grocer used avoirdupois weight to weigh the flour.
- Avoirdupois weight was the common set of weights in the market.
