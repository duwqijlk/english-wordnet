simpleMeaning: a doctor, especially an intern (a doctor still in early training), who lives in a hospital
  and cares for patients in it, guided by the medical staff there
scope: A doctor who lives in a hospital and is guided by its medical staff, not a person who lives in
  a house, town, or country.
examples:
- The resident checked on the patient during the night.
- After finishing medical school, she became a resident at the city hospital.
