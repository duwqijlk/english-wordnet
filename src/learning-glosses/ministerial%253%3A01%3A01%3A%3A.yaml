simpleMeaning: Of or relating to a member of the government who heads a department, or to the department
  itself.
scope: Of or relating to a member of the government who heads a department, or to the department itself;
  not of or relating to a minister of religion.
examples:
- The ministerial meeting brought together heads of several departments.
- A ministerial decree set new rules for the schools.
