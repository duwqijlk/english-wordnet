simpleMeaning: The picture of a thing that you see in a mirror or in another thing that throws back light
scope: The picture of a thing seen in a mirror, not light bouncing back on its own and not slow thinking.
examples:
- He studied his reflection in the mirror.
- Her reflection smiled back at her from the glass.
