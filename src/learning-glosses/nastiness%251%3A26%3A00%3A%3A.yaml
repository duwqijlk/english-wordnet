simpleMeaning: a state of being very dirty, with bad dirt and waste that makes people feel sick
scope: 'Also called filth, foulness and filthiness: a very dirty state full of bad dirt and waste. Not
  the sense about a mean wish to hurt other people.'
examples:
- The nastiness of the old kitchen, with dirt and old food everywhere, made us leave.
- He could not stand the nastiness of the public toilet.
