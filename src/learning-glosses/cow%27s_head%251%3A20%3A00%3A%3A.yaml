simpleMeaning: A morel whose stalk joins its spore-making top for about half the length of the top, the
  top marked with ridges and pits
scope: This kind of morel is also called half-free morel, and it is set apart by its spore-making top
  joining its stalk for about half its length.
examples:
- The cow's head stood out among the morels we picked.
- The cow's head was easy to spot among the morels.
