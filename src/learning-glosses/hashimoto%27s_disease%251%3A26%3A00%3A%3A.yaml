simpleMeaning: An illness in which the body's own defence attacks the small gland in the front of the
  neck, seen most often in women in middle age.
scope: An illness where the body's defence turns on the neck gland, most often in middle-aged women, not
  an illness of another gland.
examples:
- She was told she had Hashimoto's disease after blood tests.
- Hashimoto's disease can make a person feel tired and cold.
