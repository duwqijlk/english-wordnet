simpleMeaning: Said of a thing that shows a split into parts, or brings one about
scope: Said of a thing that marks or makes a split into parts, not the grammar sense of a word that names
  a part of a whole.
examples:
- The report noted partitive tendencies in education that divided the classes into small groups.
- Her partitive plan split the work into separate parts.
