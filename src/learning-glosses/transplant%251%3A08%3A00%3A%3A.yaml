simpleMeaning: In surgery, a piece of flesh or an organ moved from one person to another; at times the
  same person gives and takes it
scope: In surgery, flesh or an organ moved from one person to another; not the operation of moving it,
  and not a plant moved to new soil.
examples:
- The transplant saved her life.
- He waited months for a kidney transplant.
