simpleMeaning: a person who often refuses to do what they are told and often goes against what others
  want
scope: 'Also called headstrong, wilful or willful: a person who often refuses to obey and often goes against
  others, not someone who is easy to lead and not someone who disobeys only once.'
examples:
- The froward child would not follow the rules no matter how often they were told.
- Her froward temper made every lesson a struggle.
