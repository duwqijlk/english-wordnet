senseId: 'misprint%1:10:00::'
synsetId: 06782461-n
simpleMeaning: a mistake in something printed, caused by a machine failing in some way
scope: 'Also called literal, and also called typo: a mistake in printed words, caused by a machine failing
  in some way. It is not a mistake in handwriting, and it is not a wrong word a writer chose.'
examples:
- The book has a misprint on page ten, where one letter is missing.
- A misprint in the newspaper turned the word 'cat' into 'car'.
