simpleMeaning: to become smaller because of disease or because a part of the body is not used
scope: To grow smaller and weaker from disease or from not being used; this is the verb, not the noun
  that names that shrinking itself.
examples:
- Muscles that are not used will atrophy during a long stay in bed.
- His leg muscles began to atrophy after months without walking.
