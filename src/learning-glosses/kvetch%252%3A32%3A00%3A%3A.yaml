simpleMeaning: When you are unhappy, you put it into words and speak of your complaints and your discontent
scope: 'Another name for complain, kick, plain and quetch: to say you are not happy with something, not
  just to feel unhappy and not a person who complains.'
examples:
- My mother kvetches all day about the neighbours.
- She kvetched about the long wait at the doctor's.
