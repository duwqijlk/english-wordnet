senseId: profligate%5:00:00:immoral:00
synsetId: 01553629-s
simpleMeaning: Living without respect for custom or for right and wrong.
scope: Also called fast, dissipated, degraded, riotous, degenerate, debauched, dissolute, and libertine,
  this is living without respect for custom or for right and wrong, not the noun use for a person who
  spends money and goods wildly.
examples:
- Their life was profligate, full of drink and late nights.
- The crowd was profligate in its pleasures, caring nothing for custom.
