simpleMeaning: of a tube or passage in the body, open, so things can pass through it freely
scope: Of a tube in the body, open and letting things pass freely; not the paper giving rights to an invention
  and not plain to see.
examples:
- The doctor said the airway must stay patent after the operation.
- A patent vessel lets blood flow freely to the heart.
