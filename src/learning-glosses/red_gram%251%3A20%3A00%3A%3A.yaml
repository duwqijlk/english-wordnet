simpleMeaning: A woody herb, grown a great deal in the tropics, with flat pods and striking yellow blooms,
  of warm lands.
scope: This woody herb of warm lands is also called dhal, cajan pea, catjang pea, dahl, pigeon-pea plant,
  and pigeon pea.
examples:
- Red gram grows in warm lands across the tropics.
- The red gram in the field bore flat pods.
