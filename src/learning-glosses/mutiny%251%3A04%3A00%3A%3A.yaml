simpleMeaning: an open act of going against the people in power, especially by sailors or soldiers against
  their officers
scope: The act itself, open rebellion against people in power, not the verb that means to do this act
  and not a normal protest.
examples:
- The sailors started a mutiny against their captain.
- A mutiny broke out on the ship after the officers cut the food.
