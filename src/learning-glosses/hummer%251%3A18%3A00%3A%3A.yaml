simpleMeaning: A singer who makes a tune with the lips shut, without saying any words.
scope: A singer who makes a tune with the lips shut and no words said, not the fastest ball a pitcher
  can throw in baseball.
examples:
- The hummer kept the tune going while the others sang the words.
- She was a fine hummer, though she never opened her lips.
