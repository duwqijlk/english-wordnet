senseId: 'ridge%2:35:00::'
synsetId: 01313077-v
simpleMeaning: To dig with a spade so the ground rises in high lines and falls in low lines, one after
  the other.
scope: Digging the ground into high and low lines, not ploughing strips in a field and not the beam at
  the top of a roof.
examples:
- They ridged the soil before planting the seeds.
- The gardener ridged the beds in turn through the spring.
