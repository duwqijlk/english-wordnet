senseId: 'microfilm%1:06:00::'
synsetId: 03764961-n
simpleMeaning: film that holds photos of pages and other things in very small size, kept to save space,
  and read with a machine that makes them big again
scope: This is the film itself, holding very small photos for keeping; it is not the act of recording
  something on this film, and not ordinary film for a camera.
examples:
- The old newspapers are kept on microfilm at the library.
- She used a special machine to read the microfilm.
