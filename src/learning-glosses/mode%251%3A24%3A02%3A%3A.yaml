simpleMeaning: How a speaker thinks of an action or state, shown by the form of the verb.
scope: How a speaker thinks of an action or state, shown by the form of the verb, also called mood, not
  the sorting of claims in logic and not the most common value in a set of numbers.
examples:
- The mode of the verb shows whether the speaker states a fact or a wish.
- In this sentence, the mode tells us the speaker is giving a command.
