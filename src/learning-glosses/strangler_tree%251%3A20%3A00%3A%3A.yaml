senseId: 'strangler_tree%1:20:00::'
synsetId: 13144190-n
simpleMeaning: Roots that hang in the air reach down the trunk, join round it, and in the end kill it,
  while a vine or tree grows on that tree.
scope: People also call it strangler, and it is a vine or tree that grows on another tree and in the end
  kills it with roots that join round its trunk, not the tree it grows on.
examples:
- Roots hung in the air from the strangler tree.
- The strangler tree had killed its host.
