simpleMeaning: a poison made and sent out by some animals, such as some snakes and some insects that make
  poison, for example spiders and scorpions
scope: This is the poison itself that an animal makes, not angry words or a strong bad feeling toward
  someone.
examples:
- The snake's venom can make a person very ill.
- A bee sting puts a small amount of venom into the skin.
