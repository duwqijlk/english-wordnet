simpleMeaning: small holes that form in a surface because of corrosion (slow harm from chemicals, water
  or air)
scope: 'Also called indentation and roughness: this is small holes forming in a surface because of corrosion,
  not holes or marks made by hitting or scratching.'
examples:
- Pitting had left small holes all over the old metal pipe.
- After years in sea water, pitting could be seen on the side of the ship.
