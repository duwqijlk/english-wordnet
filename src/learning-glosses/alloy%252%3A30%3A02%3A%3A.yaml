simpleMeaning: to mix a metal with other things to make a new metal
scope: To mix a metal with other things to make a new metal, not to melt a metal alone and not to mix
  things that have no metal in them at all.
examples:
- They alloy copper with tin to make bronze.
- The smith alloys iron with carbon to make steel.
