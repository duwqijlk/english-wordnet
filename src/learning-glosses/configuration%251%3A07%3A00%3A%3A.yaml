simpleMeaning: all the ways a thing fills space, especially its outline or outer shape
scope: 'Also called shape, form, contour and conformation: this is how a thing fills space, especially
  its outline, not how its parts are set up.'
examples:
- From the plane, the configuration of the river's bends was easy to see.
- She drew the configuration of the hills as one long, curving line.
