simpleMeaning: In electronics, a way of linking parts so the current passes through them one after another.
scope: This is an electrical connection, not similar things one after another, not a set of television
  or radio programs, not a periodical published on a schedule, not a set of sports contests, not a matching
  set of stamps or coins, and not a mathematical sum.
examples:
- The installer connected the batteries in series to double the voltage.
- In a series circuit, the same current flows through every component.
