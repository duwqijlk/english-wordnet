simpleMeaning: The sweet filling at the heart of a candy that is coated in chocolate or something similar.
scope: This is the sweet filling inside a coated candy, not a shopping complex, not the political middle,
  not an area roughly central within a larger region, not a midpoint of a line or figure, not a place
  where one activity is concentrated, not the most essential part of an idea or experience, not whatever
  object holds interest and attention, not a cluster of nerve cells, not a building devoted to one activity,
  not a basketball, American football, or hockey playing position, not the players who fill those positions,
  not politically moderate people, not the middle of a military or naval formation, not the outfield ground
  ahead of a catcher, not the adjective for neither right nor left, not the adjective meaning equally
  distant from extremes, and not the verbs meaning to move to the middle, to fix attention on something,
  or to have something as its focus.
examples:
- The chocolate had a soft orange centre.
- He bit into the sweet and found a centre of thick caramel.
