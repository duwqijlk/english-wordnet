simpleMeaning: a device used to turn gas that comes from a hot liquid into liquid
scope: This sense is any device that turns gas from a hot liquid into liquid, not only the hollow coil
  kind and not a lens that makes light stronger.
examples:
- The condenser turned the steam back into water.
- In the lab, a cold condenser was used to collect the liquid.
