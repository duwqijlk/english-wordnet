simpleMeaning: A flat sea fish found from North Carolina to Florida and in the eastern Gulf of Mexico.
scope: 'Also called a gray flounder: a flat sea fish of the warm south-east coast of the United States,
  not a cold-water flatfish and not a fish of the Pacific coast.'
examples:
- The grey flounder lives in shallow water off Florida.
- Fishermen catch grey flounder along the Gulf coast.
