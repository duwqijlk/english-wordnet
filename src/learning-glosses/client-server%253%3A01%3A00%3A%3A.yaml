simpleMeaning: To do with a computer system in which one main computer serves a number of linked work
  stations.
scope: To do with a computer system in which one main computer serves a number of linked work stations,
  not a single computer working alone and not a system with no main computer.
examples:
- The office runs a client-server system for its files.
- In a client-server setup, the main computer holds the shared data.
