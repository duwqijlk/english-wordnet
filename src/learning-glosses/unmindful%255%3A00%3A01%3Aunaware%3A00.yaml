senseId: unmindful%5:00:01:unaware:00
synsetId: 00193532-s
simpleMeaning: Taking no notice of a thing, or giving it no thought.
scope: Also called oblivious, this is said of one taking no notice of a thing, or giving it no thought,
  and it is used with 'to' or 'of'.
examples:
- She was unmindful of the risks she ran.
- He was unmindful to the noise behind him.
