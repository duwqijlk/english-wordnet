simpleMeaning: a part in the body of a bug or a spider that makes fine thread, above all in the worm that
  spins cocoons
scope: A part in the body of a bug or a spider that makes fine thread, above all in the worm that spins
  cocoons, also called sericterium or serictery; not a part that makes poison and not a part that makes
  wax.
examples:
- The silk gland of the spider made fine thread for its web.
- A silk gland lets the worm spin its cocoon.
