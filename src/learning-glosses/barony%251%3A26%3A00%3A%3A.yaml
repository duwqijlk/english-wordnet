simpleMeaning: the rank, standing and dignity of a baronet or a baroness
scope: 'Also called baronetcy: the rank, standing and dignity of a baronet or a baroness, not the land
  they own and not the title itself.'
examples:
- He rose to the barony after years of service.
- The barony passed to her eldest son.
