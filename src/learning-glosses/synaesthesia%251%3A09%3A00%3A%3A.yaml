senseId: 'synaesthesia%1:09:00::'
synsetId: 05728549-n
simpleMeaning: A feeling that normally belongs to one sense comes when a different sense is stirred, so
  a person senses in one way what should come through another.
scope: Synesthesia is another name for this crossed feeling, in which the sense that is stirred is not
  the sense through which the feeling comes.
examples:
- When a note sounds, synaesthesia can turn it into a flash of yellow.
- Tasting food can bring a shape to mind for a person with synaesthesia.
