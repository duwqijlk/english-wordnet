simpleMeaning: connected with knights, or formed by a group of knights
scope: This sense is about knights or made up of knights, not about horse riding or people who ride horses.
examples:
- The king set up an equestrian order whose members were all knights.
- He joined an equestrian group made up of knights who served the king.
