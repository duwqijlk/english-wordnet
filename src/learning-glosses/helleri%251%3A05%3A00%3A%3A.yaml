simpleMeaning: A fresh-water fish from Central America with a long tail shaped like a sword, often kept
  in fish tanks.
scope: A fresh-water fish from Central America with a long sword-like tail, kept in fish tanks; swordtail
  is another name for this sense, and this is not a sea fish or a fish with a short tail.
examples:
- The helleri swam in the tank, its long tail trailing behind it.
- Aquarium keepers like the helleri for its sword-like tail.
