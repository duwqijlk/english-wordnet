senseId: 'galvanized_iron%1:27:00::'
synsetId: 14901251-n
simpleMeaning: Zinc covers this metal to keep it from rusting.
scope: This metal is covered with zinc to keep it from rust; it is not plain metal, and it is not zinc
  itself.
examples:
- The roof was made of galvanized iron, so it did not rust in the rain.
- Galvanized iron fences last longer than plain iron ones.
