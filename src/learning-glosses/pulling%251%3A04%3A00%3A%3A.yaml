simpleMeaning: It is the act of bringing something nearer or moving it along with you by force.
scope: The act itself, also called a pull, not a device used for pulling or a hard, sustained effort.
examples:
- Constant pulling on the rope wore out the crew.
- The pulling of the cart up the hill tired the horses.
