simpleMeaning: a tube made in an operation, usually around a damaged part, so blood can flow past it
scope: This is the surgery sense of bypass, not the road that goes around a town and not the electrical
  part that lets current flow around a device.
examples:
- The surgeon made a bypass around the blocked part of the artery.
- After the bypass, blood could flow past the damaged part.
