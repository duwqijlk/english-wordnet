simpleMeaning: one of the English settlers who sailed to America on the Mayflower and started the Plymouth
  colony in New England in 1620
scope: Also called a Pilgrim Father; one of the Mayflower settlers of 1620, not any later settler and
  not a traveller to a holy place.
examples:
- The Pilgrims landed in New England in 1620.
- A Pilgrim helped build the first homes at Plymouth.
