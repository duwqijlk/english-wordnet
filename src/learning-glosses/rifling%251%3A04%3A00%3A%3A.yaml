simpleMeaning: the act of cutting spiral lines inside the barrel (the long tube of a gun that a bullet
  goes through)
scope: 'Also called grooving: this sense is the act of cutting spiral lines inside a gun barrel, not the
  gun itself and not searching a place to steal things.'
examples:
- Rifling is done by cutting spiral lines inside the barrel.
- During rifling, the maker cuts spiral lines inside the gun barrel.
