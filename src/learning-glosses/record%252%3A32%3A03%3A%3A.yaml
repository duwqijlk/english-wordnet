simpleMeaning: to show a measurement, as a machine or instrument does.
scope: Not to store sound or pictures and not to write something down; here it means a gauge or meter
  showing a figure.
examples:
- The thermometer recorded 40 degrees at noon.
- The barometer recorded a sharp fall in pressure.
