simpleMeaning: In a shy, ashamed way, like a person who knows they have done something silly
scope: In a shy, ashamed way, like a person who knows they have done something silly; not in a bold way,
  and not in a merely quiet way.
examples:
- He smiled sheepishly when his mother found the broken plate.
- She looked sheepishly at the teacher and said she had lost her book.
