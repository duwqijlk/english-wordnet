simpleMeaning: To cut meat apart where its bones meet.
scope: Cutting meat apart at a bone, not fastening or fitting parts together, and not the roasting cut
  itself.
examples:
- Ask the butcher to joint the chicken before you freeze it.
- She jointed the rabbit with a sharp knife.
