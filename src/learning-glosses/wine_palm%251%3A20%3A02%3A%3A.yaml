simpleMeaning: A palm with fishtail leaves, of India and Malaya, whose sap makes jaggery, brown and sweet,
  while sago is got from its soft heart.
scope: This sense is also called jaggery palm, kittul, kitul, kitul tree, and toddy palm, for a fishtail
  palm found from India to the Malay Peninsula, whose sap gives a brown sugar, jaggery, and whose trunk
  pith gives sago.
examples:
- Wine palms give jaggery.
- Wine palm sap makes sugar.
