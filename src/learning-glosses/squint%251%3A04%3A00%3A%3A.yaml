simpleMeaning: the act of looking with the eyes shut part way
scope: The act of looking with the eyes shut part way, not a look sent to one side in doubt and not eyes
  that point in different ways.
examples:
- With a squint, she tried to read the small print.
- His squint at the bright light made him look cross.
