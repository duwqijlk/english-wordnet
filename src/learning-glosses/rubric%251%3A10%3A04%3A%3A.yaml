synsetId: 06357363-n
simpleMeaning: The heading at the top of a law or a bill, naming it and sometimes giving a short account
  of the matters it covers.
scope: Also called title and statute title; a heading that names a statute or legislative bill and may
  briefly sum up what it deals with, not directions for church services, not an explanation of an obscure
  word, and not an authoritative rule of conduct.
examples:
- The rubric at the head of the bill named the schools it would help.
- Under that rubric, the act set out help for schools.
