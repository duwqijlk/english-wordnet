simpleMeaning: a machine in which the middle parts of atoms split in a set way to make power
scope: 'Also called atomic reactor, chain reactor or pile: a machine in which the middle parts of atoms
  split in a set way to make power, not a bomb and not a machine that burns coal.'
examples:
- The atomic pile made power for the town.
- Workers built an atomic pile to turn the splitting of atoms into power.
