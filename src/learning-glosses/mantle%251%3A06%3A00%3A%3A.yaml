simpleMeaning: a loose piece of clothing with no sleeves, worn over other clothes and shorter than a cloak
scope: A loose sleeveless garment, also called a cape, shorter than a cloak; not the protective layer
  in a shell animal and not a hanging cloth used as a blind.
examples:
- She wore a mantle over her dress against the evening chill.
- The priest's mantle reached only to his waist.
