simpleMeaning: a long, heavy wave of the sea that moves toward the shore.
scope: This is a long, heavy sea wave moving toward the shore, not a spinning movement and not the verb
  for rounded land shapes.
examples:
- A long, heavy roll broke over the bow and soaked the deck.
- The rolls broke into white foam along the beach.
