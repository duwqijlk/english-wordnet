synsetId: 14284052-n
simpleMeaning: Lung inflammation caused by breathing in or choking on vomited stomach contents, which
  may happen while a person is unconscious from anesthesia, drunkenness, a seizure or cardiac arrest.
scope: This is lung damage from stomach material entering the airway, not a lung infection. It can happen
  when a person is unconscious, for example under anesthesia, drunk, in a seizure or in cardiac arrest.
examples:
- She was admitted to intensive care with aspiration pneumonia after vomiting while heavily sedated.
- People who have trouble swallowing are at greater risk of aspiration pneumonia.
