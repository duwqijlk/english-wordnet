simpleMeaning: a railway vehicle with its own power source that pulls the carriages or wagons of a train.
scope: This is not the motor inside a machine; it is the whole rail vehicle that pulls a train.
examples:
- The engine at the front of the train was covered in soot.
- Two engines were needed to pull the heavy freight train up the mountain.
