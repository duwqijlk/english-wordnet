simpleMeaning: A paper hat in the shape of a cone that teachers once put on the heads of slow or lazy
  pupils.
scope: This is a paper hat in the shape of a cone that teachers once put on the heads of slow or lazy
  pupils, not a party hat, and it is also called a dunce's cap and a dunce cap.
examples:
- The teacher put a fool's cap on the boy.
- He wore the fool's cap in the corner.
