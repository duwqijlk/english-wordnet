simpleMeaning: a yellow-brown, watery liquid part of blood, full of protein (what the body uses to grow
  and heal), that splits away when blood forms a thick lump
scope: This is the liquid part that splits from blood when it thickens, not whole blood and not the solid
  cells in blood.
examples:
- The nurse kept the blood serum in a small glass tube.
- They tested the serum to check the levels of protein in his blood.
