simpleMeaning: 'A coneflower of the great plains below the Rocky Mountains, with heads like a Mexican
  hat: tall red-brown centre and drooping yellow or yellow and red-brown rays.'
scope: A coneflower of the plains, also called Mexican hat; not other coneflowers with plain yellow heads
  and not the sunflower.
examples:
- Ratibida columnaris dots the plains with its hat-shaped heads.
- We saw Ratibida columnaris blooming below the Rockies.
