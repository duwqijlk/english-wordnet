simpleMeaning: That stirs laughter.
scope: This sense is also called funny, comic, amusing, comical, laughable, and risible, for stirring
  laughter, where funny means making you laugh because it is amusing, comic means making people laugh,
  amusing means making people laugh, and comical means making people laugh.
examples:
- The tale was mirthful, stirring laughter.
- The jest was mirthful, stirring laughter.
