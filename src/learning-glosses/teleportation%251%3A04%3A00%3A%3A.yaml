simpleMeaning: an imagined way of travel at once from one place to another, where matter is made to disappear
  in the first place and made again in the second
scope: An imagined way of moving at once by being taken apart and made again in a new place, not real
  travel by a vehicle and not just very fast travel.
examples:
- In the story, teleportation lets the hero vanish here and appear on another planet at once.
- Scientists say teleportation of a person is not possible with what we know today.
