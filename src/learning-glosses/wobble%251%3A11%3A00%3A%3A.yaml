simpleMeaning: a shaking movement from side to side that is not steady
scope: This is the shaking movement itself, not the act of moving in this way and not a loss of belief
  or support.
examples:
- The table had a slight wobble when I touched it.
- We felt a wobble in the chair as it rocked from side to side.
