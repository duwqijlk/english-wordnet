simpleMeaning: Straight bends that run side by side, made first to the front and then to the back, so
  a sheet bends back and forth like an accordion.
scope: 'Also called accordion fold, concertina fold, and z-fold: a way of folding a sheet back and forth
  in straight parallel bends.'
examples:
- He made a zig-zag fold in the letter.
- The leaflet had a zig-zag fold.
