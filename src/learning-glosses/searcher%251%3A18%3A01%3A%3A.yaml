simpleMeaning: a customs officer whose job is to look through bags, goods and vehicles for things that
  are not allowed, or that tax must be paid on
scope: This is a customs officer who checks bags, goods and vehicles for things that are not allowed or
  that tax must be paid on; it is not a person who is looking for something in general, and not a blue-green
  beetle that eats caterpillars.
examples:
- The searcher opened our bags at the border and checked them for goods we had not paid tax on.
- A searcher stopped the truck and looked inside for goods that were not allowed in the country.
