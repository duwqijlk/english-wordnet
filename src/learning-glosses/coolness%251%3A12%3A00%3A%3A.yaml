simpleMeaning: A calm, steady sureness about yourself that nothing shakes or ruffles.
scope: Not the coolness of fearless nerve in danger; this is quiet self-assurance in ordinary life.
examples:
- He performed with all the coolness of a veteran.
- Her coolness at the meeting impressed the whole board.
