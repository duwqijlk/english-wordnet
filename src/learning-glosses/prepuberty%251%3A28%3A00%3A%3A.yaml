simpleMeaning: the two years just before the body starts to change and grow towards being able to have
  children
scope: The two years just before the body starts to change towards being able to have children, not the
  change itself and not the years after it.
examples:
- During prepuberty, children often grow taller quite quickly.
- The study followed children through prepuberty to track the early changes in growth.
