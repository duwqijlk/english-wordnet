senseId: 'factor%1:08:00::'
synsetId: 05444328-n
simpleMeaning: In genetics, a stretch of DNA used to build a protein chain, with non-coding pieces around
  and inside it, passed from parent to child as a unit of inheritance.
scope: A gene, not a circumstance that helps cause a result, not a statistical variable, and not the commissioned
  agent who trades for another.
examples:
- Mendel's early writings describe a factor as the particle that carries a trait to the next generation.
- Before the structure of DNA was known, geneticists spoke of a factor for each inherited feature.
