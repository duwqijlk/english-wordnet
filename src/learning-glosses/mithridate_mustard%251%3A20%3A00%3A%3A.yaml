simpleMeaning: A bad-smelling weed from Europe and Asia, with round flat seed cases, now growing wild
  all over North America
scope: 'Fanweed, field pennycress, penny grass and stinkweed are other names for this sense: a bad-smelling
  weed with round flat seed cases, not the yellow-flowered plant grown for its hot seeds.'
examples:
- The mithridate mustard grew along the edge of the field.
