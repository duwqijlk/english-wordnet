simpleMeaning: a drug taken by mouth that slows the heart, sold as Visken, and used to treat high blood
  pressure
scope: A drug taken by mouth that slows the heart and treats high blood pressure, not a drug that raises
  blood pressure and not a painkiller.
examples:
- The doctor gave him pindolol for his high blood pressure.
- She takes pindolol every morning to keep her blood pressure down.
