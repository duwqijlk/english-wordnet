simpleMeaning: Only a weak sense of what is to come, given by a small sign.
scope: 'Also called a glimmer and a glimmering, and another name for it is an inkling: a faint sign or
  a weak sense of what is to come.'
examples:
- He had no intimation of what was about to happen.
- She gave only the slightest intimation that she knew the truth.
