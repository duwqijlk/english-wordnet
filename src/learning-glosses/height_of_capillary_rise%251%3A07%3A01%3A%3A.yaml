simpleMeaning: How far up a liquid climbs in a very thin tube.
scope: How far up a liquid climbs in a very thin tube, not how wide the tube is and not how much liquid
  there is.
examples:
- The height of capillary rise is greater in a narrower tube.
- We measured the height of capillary rise in the thin glass tube.
