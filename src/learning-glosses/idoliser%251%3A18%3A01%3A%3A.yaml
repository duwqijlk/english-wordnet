simpleMeaning: someone who is so full of praise for a person they love that they miss every fault
scope: A person who loves and praises someone without seeing any fault, also called an idolizer; not a
  calm admirer and not a critic.
examples:
- He was an idoliser of the old singer, and could hear no fault in her voice.
- Every idoliser in the crowd cheered as if she were perfect.
