simpleMeaning: A set of poems that hands down what a people believe and remember, by telling one great
  heroic tale.
scope: A body of old heroic poems that carry a people's ways, not a single short poem and not a prose
  history; no other name is listed for this sense.
examples:
- The epos of the valley people tells of a hero who crossed the sea.
- Scholars read the epos to learn how the old tribes saw their past.
