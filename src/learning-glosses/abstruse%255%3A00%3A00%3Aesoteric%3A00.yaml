senseId: abstruse%5:00:00:esoteric:00
synsetId: 00902519-s
simpleMeaning: So hard to grasp that a person of ordinary understanding or knowledge cannot make sense
  of it.
scope: Also called deep, this is said of a thing most people cannot make sense of, even when they try.
examples:
- The professor's lectures were abstruse, and most students gave up trying to follow them.
- Her theory was abstruse, and even keen readers struggled to grasp it.
