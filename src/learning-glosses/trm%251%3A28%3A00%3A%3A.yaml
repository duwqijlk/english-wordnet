simpleMeaning: The shared world time at which a message is sent from Earth to a ship in space or another
  body in the sky.
scope: Also called transmission time, this is the shared world time at which a message is sent from Earth
  to a ship in space or another body in the sky, not the time a message comes back to Earth.
examples:
- TRM is the time the message left Earth.
- They logged the TRM of the signal to the spacecraft.
