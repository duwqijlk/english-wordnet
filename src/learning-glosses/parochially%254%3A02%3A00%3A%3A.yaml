senseId: 'parochially%4:02:00::'
synsetId: 00419581-r
simpleMeaning: in a narrow way that looks only at one small place or group
scope: In a narrow way that looks only at one small place or group, not in a wide way that takes in the
  whole world and not in a fair way that weighs all sides.
examples:
- He thought parochially about the town's needs.
- She judged the plan parochially, seeing only her own street.
