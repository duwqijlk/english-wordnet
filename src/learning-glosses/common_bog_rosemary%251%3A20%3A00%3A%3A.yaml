simpleMeaning: An evergreen shrub with upright or trailing stems and hanging clusters of white or pink
  flowers, growing in peat bogs and other wet acidic ground in northern Europe.
scope: A low evergreen shrub of wet acid bogs with hanging white or pink flowers, not the kitchen herb
  rosemary; marsh andromeda is another name for it.
examples:
- Common bog rosemary spreads across the wet peat bog in spring.
- The hanging pink flowers make common bog rosemary easy to spot.
