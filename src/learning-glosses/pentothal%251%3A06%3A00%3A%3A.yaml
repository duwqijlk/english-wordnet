simpleMeaning: A strong, fast-acting sleep drug in powder form that takes in water from the air; injected,
  it leaves a person relaxed and unaware during surgery.
scope: Also called thiopental, thiopental sodium and thiopentobarbital sodium; among drugs that put people
  to sleep, this is a strong one that acts fast and is given by injection for surgery.
examples:
- The doctor gave Pentothal before the operation.
- Pentothal put her to sleep within moments.
