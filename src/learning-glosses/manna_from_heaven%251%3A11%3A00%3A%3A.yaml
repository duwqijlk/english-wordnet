simpleMeaning: Good luck that arrives all at once, with no warning, such as a sudden chance to earn money
scope: Also called boom, gravy, windfall, godsend, bonanza, bunce and gold rush, this is sudden good luck,
  not hard-earned success and not a steady rise in wealth.
examples:
- The new contract was manna from heaven for the small firm.
- When the grant came through, it was manna from heaven for the struggling school.
