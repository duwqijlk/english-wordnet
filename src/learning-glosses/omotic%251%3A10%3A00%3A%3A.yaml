simpleMeaning: A group of related tongues spoken in a valley in the south of Ethiopia, closely tied to
  the Cushitic tongues
scope: These are related tongues of one valley in southern Ethiopia, close kin of the Cushitic tongues;
  the Cushitic tongues themselves are a different group.
examples:
- Omotic is spoken in a valley in the south of Ethiopia.
- Linguists say Omotic is closely tied to the Cushitic tongues.
