simpleMeaning: A protein in the liquid part of blood that holds the parts of blood that fight illness
scope: This is a protein in the liquid part of blood that holds the parts that fight illness; gamma globulin
  is another name for this sense, not a red blood cell and not a medicine made from blood.
examples:
- The doctor gave him human gamma globulin after the exposure.
- Human gamma globulin helps the body fight illness.
