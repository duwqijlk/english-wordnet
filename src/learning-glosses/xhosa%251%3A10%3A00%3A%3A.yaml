simpleMeaning: A language in the Bantu family, closely related to Zulu and the second most common home
  language in South Africa.
scope: Also called Xhosa language, this is a language of southern Africa, not a people and not the Zulu
  language itself.
examples:
- She grew up speaking Xhosa at home in South Africa.
- Many children in South Africa learn Xhosa as their first language.
