simpleMeaning: the ships of one country or trade, taken as the means of carrying goods
scope: The ships belonging to one country or trade, used to carry goods; not a single ship and not the
  act of sending a parcel.
examples:
- The country's shipping grew fast in the last century.
- Shipping by sea was the cheapest way to move the goods.
