simpleMeaning: able to be worked out, or given a rough number or value
scope: This sense means a thing can be worked out in numbers or given a rough value; it is not the sense
  that means a person is worthy of respect.
examples:
- The cost of the damage is estimable from the repair bills.
- The risk is estimable if we have enough past records.
