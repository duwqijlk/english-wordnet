simpleMeaning: a small bit of something wet, or of a liquid
scope: A small bit of something wet or liquid, also called a splash or a dab; not the noise and not the
  act of letting it run out.
examples:
- A splatter of mud landed on his shoe.
- She added just a splatter of milk to her tea.
