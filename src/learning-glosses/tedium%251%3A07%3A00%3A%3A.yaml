simpleMeaning: the dull quality of something that goes on too long or moves too slowly
scope: This is the dull quality of something that is long or slow. Not pain and not tiredness.
examples:
- He felt the tedium of the long wait in the cold hall.
- The tedium of the slow train ride made the hours feel very long.
