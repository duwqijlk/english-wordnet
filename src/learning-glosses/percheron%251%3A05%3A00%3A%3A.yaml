simpleMeaning: One of a kind of grey or black heavy horse, first used in France to pull big carriages
  or guns.
scope: A grey or black heavy horse of France, set apart from light riding horses by its size and its work
  pulling big carriages or guns.
examples:
- The Percheron pulled the wagon up the hill without strain.
- A grey Percheron stood in the yard, waiting to be harnessed.
