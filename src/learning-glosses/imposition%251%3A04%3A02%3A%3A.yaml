simpleMeaning: the act of putting something in place by power, such as a new tax or a ban on trade
scope: The act of putting a tax or a trade ban in place by power, not a hard or unfair thing asked of
  someone.
examples:
- The imposition of a new tax made many people angry.
- People spoke against the imposition of a ban on trade with the country.
