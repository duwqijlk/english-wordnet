simpleMeaning: a drug sold as Phenergan that calms allergies and also stops the sickness of travel
scope: A drug sold as Phenergan for allergies and for the sickness of travel; not a drug for pain, and
  not a drug that puts a person to sleep.
examples:
- She took promethazine before the boat trip to stop the sickness.
- The doctor gave him promethazine for the rash and the itching.
