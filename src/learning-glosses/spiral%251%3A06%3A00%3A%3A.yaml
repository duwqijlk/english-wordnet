simpleMeaning: a thing made of something wound round and round in loops that go on without a break
scope: 'Also called a coil: a thing wound round and round in loops, not a flat winding line and not a
  line drawn on paper.'
examples:
- The spiral of rope lay in loops on the deck.
- He wound the hose into a spiral on the wall.
