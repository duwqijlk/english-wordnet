simpleMeaning: the person, thing or scene that an artist or a maker of photos picks to show in a picture
scope: This is the person, thing or scene an artist or a maker of photos picks to show in a picture, also
  called the subject or the content of the picture, not the maker of the picture and not the frame it
  hangs in.
examples:
- The depicted object in the painting is a train crossing a bridge.
- Her depicted object for the portrait was her grandmother.
