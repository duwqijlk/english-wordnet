simpleMeaning: A cook tool used to skim fat from the face of fluids.
scope: A cook tool used to skim fat from the face of fluids; not a gull-like sea bird that flies low over
  the water with a long lower beak dipped to skim up food, nor a stiff straw hat, flat-topped, nor a quick
  skin-deep reader.
examples:
- Their skimmer dipped at dawn.
- The skimmer was used at noon.
