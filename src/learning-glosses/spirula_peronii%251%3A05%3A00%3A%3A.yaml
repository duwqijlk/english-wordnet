simpleMeaning: A small tropical soft-bodied sea animal with arms, of the genus that shares its name, with
  large eyes and short arms and a many-chambered shell wound in a flat spiral
scope: Also called spirula; a small tropical sea animal with a soft body and arms, large eyes and a shell
  wound in a flat spiral, its near kin being other small sea animals with arms such as the octopus and
  the cuttlefish.
examples:
- Spirula peronii drifts in warm tropical seas.
- The shell of Spirula peronii is wound in a flat spiral.
