simpleMeaning: In the east of the Himalayas lives a big, heavy animal of the antelope kind
scope: A big, heavy antelope-like animal of the eastern Himalayas, also called takin, not a true goat
  and not a small antelope.
examples:
- The gnu goat lives in the high forests of the eastern Himalayas.
- We saw a gnu goat grazing on the steep hillside.
