simpleMeaning: the lines of force around a magnet that keeps its power for a long time or around a small
  bit of matter that carries electricity and is moving
scope: This sense is also called magnetic field and magnetic flux; it is about force around a magnet or
  moving charged matter, not liquid flowing from the body and not a substance used with hot metal.
examples:
- The flux around the magnet could be drawn as curved lines.
- A moving charged particle creates flux in the space around it.
