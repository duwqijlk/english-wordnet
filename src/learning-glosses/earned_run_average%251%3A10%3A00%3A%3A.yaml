simpleMeaning: In baseball, the scores made off a pitcher that count against him, counted for each nine
  innings he pitches, give a number showing how well he does.
scope: It is a baseball number for pitchers, not a batting number for hitters.
examples:
- His earned run average fell below three this season.
- The earned run average is printed next to each pitcher's name.
