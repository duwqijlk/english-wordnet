simpleMeaning: Doctors who care for a whole household look after the health of people of any age and either
  sex
scope: 'Also called family practice: a kind of doctoring for people of all ages and both sexes that cares
  for the whole household, not care for one person only and not care in a hospital.'
examples:
- She chose family medicine because the doctor knew her whole household.
- Our family medicine doctor treats the children and their grandparents.
