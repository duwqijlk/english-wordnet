simpleMeaning: A showy bush from eastern India, often planted in the south of the United States
scope: This is a showy bush from eastern India, often planted in the south of the United States; crepe
  flower and crepe myrtle are other names for it; not a rose bush, and not a wild bush of the same place.
examples:
- A crape myrtle bloomed pink outside the house.
- Crape myrtles line the streets in the southern United States.
