simpleMeaning: a chemical that works on surfaces, widely used in industry and for washing clothes
scope: The cleaning chemical itself, widely used in industry and for washing clothes; it is not the other
  sense of a soap-like cleaning stuff that lifts oil and holds dirt in the liquid.
examples:
- The factory buys a detergent that is also used for washing clothes.
- A strong detergent is used in industry to clean oily machine parts.
