simpleMeaning: A person born in Spanish America whose family comes wholly from Europe, usually from Spain
scope: A Spanish American of wholly European family, usually Spanish; not a person of mixed family and
  not a newcomer from Europe.
examples:
- The criollo families owned much of the land.
- He was a criollo, born in Mexico of Spanish parents.
