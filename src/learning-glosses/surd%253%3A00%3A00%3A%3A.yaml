simpleMeaning: Made without shaking of the voice-cords.
scope: This sense is also called hard, voiceless, and unvoiced, for being made without shaking of the
  voice-cords, where hard is a speech sound made without the vocal cords vibrating, unlike the sense for
  a sound made with no voice from the throat.
examples:
- The sound was surd, made without shaking of the voice-cords.
- The letter was surd, made with no voice-cords shaking.
