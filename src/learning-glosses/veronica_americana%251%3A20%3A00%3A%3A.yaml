simpleMeaning: A low plant of western North America and northeastern Asia with stems that lie flat on
  the ground and close-packed clusters of pale violet to lilac flowers.
scope: A low plant with stems that lie flat, also called brooklime and American brooklime; its nearest
  kin are the upright speedwells with loose flower spikes.
examples:
- Veronica americana grows along the stream with its stems flat on the damp ground.
- We found Veronica americana in flower beside the mountain lake.
