simpleMeaning: the dried underground part of any of several plants of the Smilax group, used to give food
  and drink flavour
scope: The dried underground part of Smilax plants used to flavour food and drink, not a fresh root and
  not another flavouring such as vanilla.
examples:
- The drink was flavoured with sarsaparilla root.
- She ground dried sarsaparilla root into the syrup.
