simpleMeaning: In physics, the idea that light moves as a flow of tiny bits
scope: This is the idea that light moves as a flow of tiny bits, also called corpuscular theory of light;
  not the idea that light moves as waves.
examples:
- Newton backed the corpuscular theory when he wrote about light.
- The corpuscular theory treats light as a flow of tiny bits.
