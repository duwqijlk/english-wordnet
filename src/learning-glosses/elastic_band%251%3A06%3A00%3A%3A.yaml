simpleMeaning: papers and other things stay in a tight bunch inside a thin loop of stretchy rubber
scope: 'Also called elastic: a thin loop of stretchy rubber that keeps things in a tight bunch, not a
  long strip of rubber and not a metal clip.'
examples:
- She put an elastic band round the letters to keep them together.
- The elastic band snapped as he stretched it round the papers.
