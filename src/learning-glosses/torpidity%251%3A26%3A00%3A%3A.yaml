senseId: 'torpidity%1:26:00::'
synsetId: 14038092-n
simpleMeaning: a state in which the body and mind are still and only partly aware of what is around
scope: This is a stillness of body and mind with feeling partly switched off; torpor is another name for
  this sense. Not sleep and not a lack of feeling caused by injury.
examples:
- After the long illness, a torpidity settled over him, and he barely moved or spoke.
- The torpidity left her sitting still, half aware of the voices around her.
