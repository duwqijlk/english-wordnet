simpleMeaning: Mostly one full month of pay, this extra month of pay comes on top of a thirteenth month
  of pay, given to workers under the law or their work agreement
scope: This extra month of pay comes on top of a thirteenth month of pay, and the thirteenth salary is
  the first extra month of pay.
examples:
- Some institutions add a fourteenth salary for higher pay grades.
- The fourteenth salary is paid on top of the thirteenth.
