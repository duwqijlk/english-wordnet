simpleMeaning: In psychiatry, a mind process outside a person's awareness that tries to cut down the worry
  tied to natural urges
scope: In psychiatry, a mind process outside a person's awareness that cuts down worry from natural urges;
  also called defense, defence, defence mechanism, defence reaction and defense mechanism, not a plan
  made on purpose and not a cure.
examples:
- Her defense reaction pushed the worry out of her mind.
- His defense reaction kept him from seeing the truth.
