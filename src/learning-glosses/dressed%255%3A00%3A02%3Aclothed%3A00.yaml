simpleMeaning: wearing clothes that are formal or showy rather than everyday
scope: Formal or showy clothing, not the broader sense of being clothed, particularly in fine or elegant
  attire, and not smoothed lumber or stone; dolled up, dressed-up, dressed to kill, dressed to the nines,
  spiffed up, spruced up and togged up are other names for this sense.
examples:
- The children were dressed in their Sunday best.
- He was dressed in a tuxedo for the awards dinner.
