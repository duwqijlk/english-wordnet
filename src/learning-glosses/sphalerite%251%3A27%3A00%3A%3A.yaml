simpleMeaning: Made up mostly of zinc sulfide in crystal form, this rock gives more zinc than any other
  source.
scope: Also called blende and zinc blende, this rock gives more zinc than any other source and is made
  up mostly of zinc sulfide in crystal form.
examples:
- Most zinc comes from sphalerite, the rock that gives more than any other source.
- Much of the world's zinc comes from sphalerite.
