simpleMeaning: A cannon that can fire its shells up steeply, for hitting things at fairly short range.
scope: A cannon made to fire up steeply at close range, not a flat-firing gun and not a long-range cannon.
examples:
- The crew aimed the high-angle gun up over the hill.
- A high-angle gun can fire shells in a steep arc.
