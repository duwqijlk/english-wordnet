simpleMeaning: Pink or purple flowers grow in loose bunches on this plant from Europe and Asia, whose
  stems are spiny and whose roots are tough.
scope: 'Also called rest-harrow: a plant of Europe and Asia with loose bunches of pink or purple flowers
  and spiny stems, not the woody European plant with leaves of a single leaflet.'
examples:
- Restharrow bears loose bunches of pink or purple flowers.
- The spiny stems of restharrow stand above its tough roots.
