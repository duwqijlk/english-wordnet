simpleMeaning: a silk cloth worn over the shoulders by a priest at High Mass (an important church service)
  in the Roman Catholic Church
scope: A silk cloth a priest wears at High Mass, not the covering on a young mushroom and not the thin
  skin around a baby before birth.
examples:
- The priest wore a veil over his shoulders at High Mass.
- The priest's silk veil lay folded near the altar.
