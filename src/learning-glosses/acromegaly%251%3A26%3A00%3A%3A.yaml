simpleMeaning: A condition in which bones of hands, feet and face enlarge, often with headaches, muscle
  pain and emotional upset, from too much growth hormone due to a pituitary tumor.
scope: The condition of bony overgrowth in the hands, feet and face that appears in adults, not gigantism,
  the similar overgrowth that starts in childhood. 'Acromegalia' is another name for the same disorder.
  It is a medical term.
examples:
- His wedding ring no longer fit, and the doctor recognized the first signs of acromegaly.
- Untreated acromegaly can leave a person with a heavy jaw and much larger hands.
