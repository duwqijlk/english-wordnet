simpleMeaning: The church meeting of 1512 to 1517 that issued rules for church life and planned, but never
  carried out, a crusade against Turkey
scope: The fifth meeting in the series of Lateran church meetings, held in 1512 to 1517, coming after
  the four earlier Lateran meetings and dealing with church rules and a planned crusade against Turkey
  that never took place.
examples:
- The Fifth Lateran Council issued rules for church life in 1512.
- The Fifth Lateran Council planned a crusade against Turkey that never took place.
