simpleMeaning: A stemless long-lived plant, with large flowers whose white or purple-brown florets sit
  in a rosette of long spiny leaves hairy beneath; of high places in southern and eastern Europe.
scope: 'Also called stemless carline thistle: a stemless plant, not a shrub, and not a true thistle.'
examples:
- Carlina acaulis grew flat on the high ground.
- The rosette of Carlina acaulis held large flowers.
