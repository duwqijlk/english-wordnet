simpleMeaning: A bottle full of liquid that catches fire, with a rag wick in its neck, thrown as a rough
  weapon.
scope: 'Also called a gasoline bomb: a bottle of burning liquid thrown as a weapon, not a factory-made
  bomb.'
examples:
- The petrol bomb smashed and set the dry grass alight.
- Police found a petrol bomb with a rag wick in the alley.
