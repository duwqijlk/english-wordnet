simpleMeaning: A small thorny tree or bush from India that keeps its leaves all year, grown widely for
  its big fruits like lemons, with thick bumpy skin.
scope: Also called a citron or a citron tree; a thorny fruit tree of India with big thick-skinned fruit,
  kin to the lemon tree but grown for its own large fruit.
examples:
- The Citrus medica in our garden bears huge fruit with thick bumpy skin.
- Farmers in India grow Citrus medica for its large lemon-like fruit.
