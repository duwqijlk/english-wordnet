senseId: 'b_lymphocyte%1:08:00::'
synsetId: 05459271-n
simpleMeaning: A white blood unit from bone marrow giving fluid defence; it spots free antigens in fluid
  and grows into plasma units that make antibodies, which switch off the antigens.
scope: Also called B cell; a white blood unit that defends the body through fluids, not a T unit and not
  a plasma unit.
examples:
- The B lymphocyte grew into a plasma cell that made antibodies.
- A B lymphocyte spots free antigens floating in the blood.
