simpleMeaning: at the two far ends of a scale; fully against each other
scope: 'Also called opposite: views or meanings at the two far ends, not the north or south pole region.'
examples:
- Their polar views on the plan left no room for a middle way.
- The two sides took polar positions in the debate over the new law.
