simpleMeaning: Extreme bravery, especially in bold action taken as a last resort.
scope: 'Another name for heroic: extreme bravery, especially in last-resort action, not stubborn resolve,
  a despairing mood, or reckless violence.'
examples:
- They made a desperate attempt to reach the climbers before the storm broke.
- In a desperate effort to save the boat, she dived into the freezing water.
