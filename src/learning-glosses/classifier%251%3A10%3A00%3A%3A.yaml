simpleMeaning: a word or word part used in some tongues in some settings, such as when counting things,
  to show what kind of thing is counted
scope: A word or word part that shows the kind of a counted thing in some languages, not a word that names
  the thing itself.
examples:
- In Chinese, a classifier comes before the noun when you count things.
- The classifier in the phrase tells you what kind of thing is being counted.
