simpleMeaning: the spreading of the sea over land, shown by layers of rock from the sea lying over layers
  made on land
scope: In geology, the sea spreading over land, as shown in layers of rock; not the act of breaking a
  law, a duty, or a right way of behaving.
examples:
- These rocks show a transgression, with sea layers lying over older land layers.
- A transgression left clear signs in the rock along this coast.
