simpleMeaning: Showing, or calling for, fair play and good sport.
scope: This sense is also called sporting and sporty, for showing, or calling for, fair play and good
  sport, where sporting is showing fair play, or asking others to play fair.
examples:
- The play was sportsmanlike, showing fair play.
- The game was sportsmanlike, calling for fair play.
