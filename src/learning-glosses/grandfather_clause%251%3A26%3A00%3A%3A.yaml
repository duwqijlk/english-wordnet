simpleMeaning: After the American Civil War, this let illiterate white people in the south keep voting,
  as an exception to a rule that left a right they already had.
scope: This names the exception under which a right held before a new rule came in stays in place.
examples:
- The grandfather clause let him keep voting under the old rules.
- A grandfather clause in the new law kept his right to vote.
