simpleMeaning: to press a thing hard between two fingers
scope: 'Also called squeeze and pinch: to press a thing hard between two fingers, not a sudden shake of
  a muscle and not a short quick move with no control.'
examples:
- She twitched the cloth between her fingers to feel how thick it was.
- He twitched her sleeve to get her to turn round.
