simpleMeaning: any stuff, such as a simple element or a compound not made by living things, that a green
  plant can take in and use to build new living matter
scope: A stuff a green plant takes in to build new living matter, not the food stuff an animal takes in
  for energy and growth.
examples:
- The plant took the nutrient from the soil.
- Farmers add nutrients to poor soil to feed their crops.
