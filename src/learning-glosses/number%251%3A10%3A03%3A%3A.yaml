simpleMeaning: the digits that are dialed to reach one particular telephone.
scope: This sense is not an account or membership code, not a written sign for a quantity, and not the
  grammar feature of singular and plural; it is specifically the digits used to call one telephone.
examples:
- I wrote down her number before she left.
- He dialed the number twice but no one answered.
