simpleMeaning: the part that two ideas or things share, shown as one shared area
scope: The shared part between two ideas or things, with intersection as another name for this sense,
  and not the act of two things covering each other in time or a disagreement.
examples:
- There was no overlap between their proposals.
- The overlap in their plans made the work easier.
