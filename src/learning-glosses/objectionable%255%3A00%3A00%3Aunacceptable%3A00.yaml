simpleMeaning: able to be argued against or questioned, used of something a person might say is wrong
  or bad
scope: This sense means a thing can be argued against and a person may say it is wrong or bad, not the
  sense where a thing makes people show strong dislike or protest.
examples:
- Many readers found the plan objectionable and argued against it in the meeting.
- He wrote an objectionable claim that people could rightly say was wrong.
