simpleMeaning: to lock something with a hinged metal plate that fits over a loop and is held by a pin
  or a small lock
scope: This is the act of locking with that metal fastener, not the fastener itself and not locking with
  a key alone.
examples:
- She hasped the shed door before she left.
- He hasped the box and put a small lock through it.
