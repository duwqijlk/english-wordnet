simpleMeaning: A hollow cord of outer skin tissue in the unborn young from which the brain and the cord
  of the back grow.
scope: A hollow cord in the unborn young from which the brain and back cord grow, not a blood tube and
  not a food pipe.
examples:
- The neural tube forms early in the unborn child.
- If the neural tube does not close, the brain cannot grow as it should.
