simpleMeaning: Small branches to the skin of the inner leg and foot come off this nerve, which runs down
  from the main nerve of the thigh.
scope: Also called nervus saphenus, it is a nerve of the inner leg and foot, not the main nerve of the
  thigh it comes from.
examples:
- The saphenous nerve runs down the inner side of the leg.
- The saphenous nerve gives off small branches to the skin of the inner foot.
