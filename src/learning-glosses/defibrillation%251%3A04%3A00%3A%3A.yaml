simpleMeaning: Treatment that stops the heart muscle from beating in a wild, uneven way, usually by giving
  the heart an electric shock from a machine made for the job.
scope: Treatment that stops the wild, uneven beating of heart muscle, usually by an electric shock.
examples:
- The medics used defibrillation to restart his heart.
- Defibrillation gave her heart a shock and set it beating right again.
