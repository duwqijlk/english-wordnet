simpleMeaning: In a cell's centre, a small round bit of protein holds RNA, and that RNA helps the cell
  make protein.
scope: Also called a nucleole, this small round bit of protein holds RNA inside a cell's centre and is
  not the whole centre around it.
examples:
- The nucleolus held RNA that helped the cell make protein.
- A nucleolus can be seen in the centre of a cell under a microscope.
