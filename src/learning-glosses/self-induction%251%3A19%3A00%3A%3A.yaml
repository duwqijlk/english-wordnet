simpleMeaning: The making of a force that pushes power round a circuit (EMF), made by a change in the
  flow of power in that same circuit; most often measured in henries
scope: The making of a push in a circuit by its own change of flow, not a push from a battery and not
  a push made by a nearby circuit.
examples:
- Self-induction makes a push in the coil when the flow changes.
- Engineers allow for self-induction when they build a circuit.
