simpleMeaning: to say a word or part of a word with more force, or to speak in a way that shows where
  you come from
scope: 'Also called stress and accent: saying a word or part of a word with more force, or saying words
  with an accent; not making a feature or idea stand out more.'
examples:
- In this word, you accentuate the first part, not the last.
- She accentuated the last syllable when she said the name.
