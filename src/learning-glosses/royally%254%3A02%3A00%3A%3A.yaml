simpleMeaning: in a way that is like a king or queen
scope: Done in the way of a king or queen, or treated in that way; not the word royal used for a person
  in a king's or queen's family, and not the word royal used to describe things of a king or queen.
examples:
- They were royally treated at the hotel, with the best room and food.
- The guests came in royally, in fine clothes and with music playing.
