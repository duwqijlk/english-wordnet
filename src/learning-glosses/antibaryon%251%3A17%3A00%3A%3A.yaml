simpleMeaning: a tiny bit of matter with a baryon number of minus one that is the opposite twin of a baryon,
  a heavy bit of matter
scope: The opposite twin of a baryon, not a baryon itself and not a meson, another tiny bit of matter.
examples:
- The antibaryon met its matching baryon and both vanished in a flash of light.
- Physicists found the antibaryon in the debris of the crash.
