simpleMeaning: A big winged animal from the Americas that often catches insects in the air while it is
  flying
scope: This is a big bird from the Americas that catches insects while flying; flycatcher and tyrant flycatcher
  are other names for this sense, and it is not a small songbird or a bird that hunts on the ground.
examples:
- The tyrant bird caught a fly in mid-air.
- A tyrant bird swooped through the air and caught a moth.
