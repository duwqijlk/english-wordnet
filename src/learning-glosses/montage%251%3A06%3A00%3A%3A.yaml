simpleMeaning: a work of art made by sticking together pieces of paper or photographs to form one picture
scope: 'Also called collage: one picture made from pieces stuck together, not a single photograph taken
  on its own.'
examples:
- She made a montage of family photographs for the school wall.
- His montage joined old tickets, letters, and pictures into one image.
