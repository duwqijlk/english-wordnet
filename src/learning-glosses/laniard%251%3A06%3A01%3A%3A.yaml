simpleMeaning: A length of cord that hangs from the neck and keeps a knife or a whistle close at hand.
scope: A length of cord that hangs from the neck and keeps a knife or a whistle close at hand; lanyard
  is another name for this sense, not a cord worn round the waist, and not the sailing rope of the same
  name.
examples:
- He wore a laniard round his neck with his whistle on it.
- The guard's laniard held his knife close at hand.
