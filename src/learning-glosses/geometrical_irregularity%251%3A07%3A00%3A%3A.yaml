simpleMeaning: An uneven lack of balance in shape, or an uneven pattern in space.
scope: This is an uneven lack of balance in shape, or an uneven pattern in space; irregularity is another
  name for this sense, not a neat even pattern and not a smooth curve.
examples:
- The wall showed a geometrical irregularity in its shape.
- A geometrical irregularity broke the even rows of tiles.
