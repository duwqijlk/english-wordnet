senseId: 'bermudan_option%1:21:01::'
synsetId: 92437391-n
simpleMeaning: A right to buy or sell that the buyer may use only at a set number of times, and those
  times are always spaced apart
scope: This is a right to buy or sell that can be used only on set dates, not one that can be used at
  any time and not one that can be used only on a single last day.
examples:
- The Bermudan option can be used only on the dates set out in the deal.
- He held a Bermudan option and used it on one of the set dates.
