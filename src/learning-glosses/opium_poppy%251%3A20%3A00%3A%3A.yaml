  plant from which a drug is made.
scope: This herb from southwestern Asia, with greyish leaves and white or reddish flowers, is the plant
  from which a drug is made, not the drug itself.
examples:
- We saw an opium poppy with white flowers.
- The opium poppy had greyish leaves.
