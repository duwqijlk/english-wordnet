simpleMeaning: the fixed set of steps that must be followed when doing religious ceremonies
scope: This is the fixed set of steps for a religious ceremony; it is not the word used to describe something
  as linked to such ceremonies, and not just any daily habit.
examples:
- The ritual for the festival begins with prayers at dawn.
- They performed the ancient ritual exactly as the old book set out.
