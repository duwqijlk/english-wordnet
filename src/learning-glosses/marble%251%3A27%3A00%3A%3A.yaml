simpleMeaning: a hard stone with a bright grain, made when another stone is changed by heat and weight,
  that can be made very smooth, used for statues and parts of buildings
scope: A hard stone with a bright grain, made when another stone is changed by heat and weight, that can
  be made very smooth, used for statues and buildings, not a statue made from such stone and not the act
  of painting a thing to look like such stone.
examples:
- The floor was made of white marble.
- The statue was carved from marble.
