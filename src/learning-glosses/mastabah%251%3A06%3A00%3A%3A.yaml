simpleMeaning: Its sides slope in from a four-sided base to a flat top, and bricks of dried mud make this
  very old tomb of Egypt
scope: Also called mastaba, this very old tomb of Egypt, built of bricks of dried mud, is not the pyramid
  that grew out of it.
examples:
- The mastabah came before the pyramids in Egypt.
- The mastabah was built long ago in Egypt.
