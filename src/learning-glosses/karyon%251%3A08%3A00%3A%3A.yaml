simpleMeaning: The part of a cell that holds DNA, the plan for life, and RNA, its working copy, and that
  guides growth and making new cells
scope: 'Another name for a cell nucleus or nucleus: the part of a cell that holds the plans for life and
  guides growth, not the whole cell and not the splitting of that part when a cell divides.'
examples:
- The karyon holds the plans that tell the cell how to grow.
- Damage to the karyon can stop a cell from making new cells.
