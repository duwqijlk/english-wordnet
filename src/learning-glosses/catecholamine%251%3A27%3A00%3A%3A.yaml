simpleMeaning: any of a set of body chemicals, such as adrenaline and noradrenaline, made in the middle
  of the gland above the kidney
scope: A body chemical, not a hormone from elsewhere and not the gland that makes it.
examples:
- Catecholamine levels rise when you are frightened.
- The gland above the kidney makes catecholamine.
