simpleMeaning: Living off people, this tiny one-celled thing gives them malaria.
scope: Malaria parasite is another name for this tiny one-celled living thing, which lives off people
  and gives them malaria, not the sheet of living matter found in slime moulds.
examples:
- The plasmodium gives people malaria.
- The plasmodium lives off its human host and makes the person ill with malaria.
