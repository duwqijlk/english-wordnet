simpleMeaning: the act of finding out or showing how much of something there is
scope: This is finding out or showing how much there is, not the logic sense about words like some, all,
  or no limiting a statement.
examples:
- The quantification of water use helped the town plan how to save water.
- Careful quantification of the chemicals took a long time in the lab.
