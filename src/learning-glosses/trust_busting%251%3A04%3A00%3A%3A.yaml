simpleMeaning: In law, what a government does to break up groups of firms that control a whole trade,
  above all under the laws of the United States against such firms.
scope: This is government action to break up firms that control a whole trade, not a law that sets prices
  and not a private suit by one firm against another.
examples:
- Trust busting broke up the big oil firm.
- The government used trust busting to end the monopoly.
