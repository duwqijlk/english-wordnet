schema: oewn-learning-gloss-v2
senseId: 'haze%1:09:00::'
synsetId: 05692366-n
simpleMeaning: a state of mind where thoughts are not clear and a person feels mixed up
scope: This is a state where a person cannot think clearly; fog and daze are other names for this sense.
  It is not thin cloud, dust or smoke in the air that makes it hard to see, and not forcing hard or shaming
  tasks on someone, as in the army.
examples:
- After the long night with no sleep, he moved through the day in a haze and could not think clearly.
- In her tired haze, she could not keep her thoughts in order.
