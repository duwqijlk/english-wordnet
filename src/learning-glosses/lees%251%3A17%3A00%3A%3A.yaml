simpleMeaning: The bits that sink to the bottom of an alcoholic drink while it ferments.
scope: The bits left at the bottom of a drink after it ferments, not the drink itself.
examples:
- He poured off the wine and left the lees in the jar.
- The lees settled at the bottom of the barrel.
