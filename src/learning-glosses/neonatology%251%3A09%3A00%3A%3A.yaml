simpleMeaning: In children's medicine, the branch that cares for newborn babies, finding and treating
  their sicknesses.
scope: In children's medicine, the branch that cares for newborn babies, not the care of older children
  and not the care of mothers in childbirth.
examples:
- She trained in neonatology to care for newborn babies.
- Neonatology finds and treats sicknesses in the first days of life.
