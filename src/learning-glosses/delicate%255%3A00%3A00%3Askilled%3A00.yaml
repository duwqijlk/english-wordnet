simpleMeaning: showing great skill, especially in work done with very careful, exact steps
scope: Work done with great skill, especially very careful work, not a tool that picks up small changes,
  not a fine lovely thing and not work with very fine differences.
examples:
- The surgeon's delicate touch saved the tiny blood vessel.
- It took delicate work to mend the old watch.
