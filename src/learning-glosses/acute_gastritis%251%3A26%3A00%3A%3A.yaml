simpleMeaning: a sudden sore swelling of the stomach lining after swallowing something that hurts it,
  such as too much aspirin
scope: A sudden sore swelling of the stomach lining caused by swallowing something that hurts it, not
  a long-term stomach illness and not a stomach ache from overeating.
examples:
- Too much aspirin gave him acute gastritis and a burning pain in his stomach.
- Her acute gastritis came on after she swallowed the harsh medicine.
