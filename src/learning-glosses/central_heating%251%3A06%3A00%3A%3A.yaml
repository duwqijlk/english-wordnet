simpleMeaning: a system that warms air or water at one furnace and sends it through the building by vents
  or pipes and radiators
scope: A system that warms air or water at one furnace and sends it through the building by vents or pipes
  and radiators, not a fire in one room and not warm air from outside.
examples:
- Central heating kept the whole house warm in winter.
- They switched on the central heating when the cold came.
