simpleMeaning: done without paying attention to what you are doing or to what may happen next
scope: About doing something without paying attention; it is not the other sense of this word, which shows
  a lack of care for other people.
examples:
- He stared thoughtlessly at the picture, not really seeing it.
- She answered thoughtlessly, without stopping to think about the question.
