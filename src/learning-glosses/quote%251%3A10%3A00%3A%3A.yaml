simpleMeaning: a mark used in writing to show that the words inside it are what someone else said or wrote
scope: A mark in writing that shows words are from someone else. Not the passage itself that is copied,
  and not the act of putting such marks around words.
examples:
- Put a quote mark before and after the words she spoke.
- The teacher told us to put quotes around the exact words.
