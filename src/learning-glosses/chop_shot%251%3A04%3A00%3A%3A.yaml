simpleMeaning: In tennis, a ball hit back with a downward stroke that makes the ball spin backwards
scope: In tennis, a ball hit back with a downward stroke that makes the ball spin backwards; chop is another
  name for this sense, not a hard flat hit and not a high soft hit that floats.
examples:
- She won the point with a chop shot.
- A chop shot puts backspin on the ball.
