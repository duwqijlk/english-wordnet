simpleMeaning: to dig out a long, shallow cut or line in something
scope: 'Also called groove: to dig out a long, shallow line in something; not a fold in a smooth surface
  as a thing, and not cutting a line into a tall stone post.'
examples:
- The farmer furrowed the soil before planting the seeds.
- The running water furrowed the soft earth after heavy rain.
