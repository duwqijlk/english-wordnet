simpleMeaning: Sweet-smelling pink or white blooms in bunches grow on a low bush of eastern North America
  that keeps its tough leaves all year.
scope: 'Trailing arbutus is another name for it: it is a low bush of eastern North America with tough
  leaves that stay all year and sweet-smelling pink or white blooms.'
examples:
- Mayflowers grew low in eastern North America.
- The mayflower bore pink blooms in bunches.
