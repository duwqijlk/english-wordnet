simpleMeaning: To speak of a person in a formal speech that honours their life or deeds
scope: To speak of someone in a formal act of honour, also called memorialize; not the other sense of
  serving as a lasting sign of a person or event.
examples:
- The President memorialised the heroes of the battle.
- She memorialised her late teacher in a short speech.
