simpleMeaning: the act of putting stuff into a thing until it is full
scope: The act of putting stuff into a thing until it is full, not a plug in a tooth, not thread across
  cloth, and not food put in pastry.
examples:
- The filling of the tank took ten minutes.
- The filling of the hall with chairs began early.
