simpleMeaning: a person who holds to old ways and seems dull in what they think or how they look
scope: A person who holds to old ways and seems dull, not a person who likes new ideas and not a young
  person who is simply quiet.
examples:
- You may call him a fuddy-duddy, but he likes his old ways.
- The fuddy-duddy would not try the new music.
