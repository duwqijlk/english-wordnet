simpleMeaning: the activity of singing, whistling, or playing an instrument
scope: This is the activity of making sounds, not the art form itself, the sounds you hear, or the phrase
  'face the music'.
examples:
- The family makes music together every Sunday afternoon.
- She was making music in the kitchen, whistling as she worked.
