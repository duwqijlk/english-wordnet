simpleMeaning: To keep the frame of a car or truck steady, a stiff metal rod joins the front wheel parts
  and the back wheel parts too.
scope: Anti-sway bar is another name for this stiff metal rod that keeps a car's frame steady.
examples:
- A new stabilizer bar was fitted to the truck.
- The car has a stabilizer bar at the front.
