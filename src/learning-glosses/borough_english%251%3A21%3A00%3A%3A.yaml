simpleMeaning: A former custom by which the youngest son took the land and his older brothers got none.
scope: A former English custom for passing on land, in which all the land went to the youngest son and
  his older brothers got none, set apart from other ways of passing on land by giving everything to the
  youngest.
examples:
- Under borough English, the youngest son took the farm.
- Borough English gave the land to the youngest son.
