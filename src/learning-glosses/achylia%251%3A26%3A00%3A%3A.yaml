simpleMeaning: a state in which the stomach makes little or none of the juices that break down food
scope: When the stomach makes little or none of its juices for breaking down food; achylia gastrica is
  another name for this sense, not a stomach that makes too much juice.
examples:
- His achylia meant food sat undigested in his stomach.
- The doctor treated her achylia with juices taken by mouth.
