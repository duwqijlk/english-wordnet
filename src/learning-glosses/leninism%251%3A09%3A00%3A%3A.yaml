simpleMeaning: Lenin's political and economic ideas guided the Soviet Union; his change to Marxism put
  rule by empires at the top of capitalism, moving the fight from rich to poor lands.
scope: Also called Marxism-Leninism; the ideas of Lenin that guided the Soviet Union, not the ideas of
  Marx alone and not a form of government.
examples:
- Leninism shaped the way the Soviet Union was ruled.
- Students of Leninism study how Lenin changed the ideas of Marx.
