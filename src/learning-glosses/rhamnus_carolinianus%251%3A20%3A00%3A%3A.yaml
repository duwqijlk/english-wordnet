simpleMeaning: A bush of the eastern and central United States that loses its leaves in autumn, with black
  fruit like berries; it turns golden-yellow in autumn.
scope: 'Also called an Indian cherry or a Carolina buckthorn: a bush of the eastern and central United
  States with black fruit like berries, golden-yellow in autumn, not a cherry tree and not a buckthorn
  of another land.'
examples:
- We saw Rhamnus carolinianus with its black fruit in the woods.
- Rhamnus carolinianus turns golden-yellow in autumn.
