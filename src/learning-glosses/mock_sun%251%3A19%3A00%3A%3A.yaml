simpleMeaning: a bright patch of light in a ring around the sky, made when light bends as it passes through
  tiny bits of ice
scope: A bright patch of light in a ring around the sky, made when light bends as it passes through tiny
  bits of ice; parhelion is another name for this bright patch, not the real sun and not a rainbow.
examples:
- We saw a mock sun beside the real sun in the cold morning sky.
- A mock sun can appear when tiny ice bits hang in the air.
