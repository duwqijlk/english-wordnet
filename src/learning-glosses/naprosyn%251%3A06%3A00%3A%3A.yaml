simpleMeaning: A drug that is not a steroid and fights swelling, sold under its trade name, used to treat
  joint pain, sore muscles and bones, and middling pain.
scope: A drug against swelling that is not a steroid, also called naproxen; its near kin are the other
  drugs used to treat joint pain and sore muscles.
examples:
- Naprosyn eased his arthritis.
- She took Naprosyn for the moderate pain.
