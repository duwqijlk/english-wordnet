simpleMeaning: one of the two holes at the back of the nose space that lead to the throat passage
scope: 'Also called a choana, an internal nostril, and a posterior nasal aperture: one of the two back
  holes from the nose space to the throat, not a hole at the front of the nose.'
examples:
- The doctor looked at the posterior naris to check the back of the nose.
- Air passes through each posterior naris on its way to the throat.
