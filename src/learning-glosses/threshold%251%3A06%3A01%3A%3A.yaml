simpleMeaning: the flat piece of wood or stone at the bottom of a doorway, which you step on when you
  go through the door
scope: 'Also called doorstep: this is the piece at the bottom of a doorway, not the smallest sound or
  feeling a person can notice.'
examples:
- She stood on the threshold and looked inside.
- He tripped over the wooden threshold at the front door.
