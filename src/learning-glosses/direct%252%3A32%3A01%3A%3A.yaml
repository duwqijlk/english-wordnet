schema: oewn-learning-gloss-v2
senseId: 'direct%2:32:01::'
synsetId: 00751382-v
simpleMeaning: To tell someone which way to go or where a place is.
scope: This is telling a person which way to go or where a place can be found; it is not commanding with
  authority, not taking somebody somewhere, not causing something to go somewhere, not steering a ship,
  aircraft or vehicle along its path, not aiming a weapon, camera or blow at a target, not intending something
  towards a goal, not planning and running a whole complicated undertaking, not guiding actors or conducting
  a musical performance, not governing or managing, not designing something for a particular audience,
  not writing an address on an envelope, not the adjective senses (straight path, no go-between, plain
  or frank manner, unbroken family line, eastward sky motion, proportional relation, one-way current,
  immediate result, exact words, total and unmitigated), and not the adverb meaning without swerving.
examples:
- A guard directed us to the staff entrance.
- The sign directed visitors to the car park.
