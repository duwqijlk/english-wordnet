simpleMeaning: In Judaism, a ceremony brings a Jewish girl into religious life on her twelfth birthday,
  the start of her religious duties
scope: This is a ceremony in Judaism for a Jewish girl on her twelfth birthday, also called bas mitzvah
  or bath mitzvah, not the act of confirming a girl in the ceremony.
examples:
- Her bat mitzvah was held on her twelfth birthday.
- The whole family came to her bat mitzvah.
