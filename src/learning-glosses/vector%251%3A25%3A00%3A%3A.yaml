simpleMeaning: a straight part of a line that has a set length and a set direction in space
scope: This is a straight part of a line with a set length and direction. It is not a living thing that
  carries disease, and not a quantity that is split into parts.
examples:
- Draw a vector with a length of five units pointing north.
- The vector on the graph shows both size and direction.
