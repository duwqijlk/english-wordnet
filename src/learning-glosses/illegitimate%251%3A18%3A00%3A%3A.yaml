simpleMeaning: a child whose parents were not married to each other
scope: 'Also called bastard and whoreson: a child whose parents were not married to each other, not the
  describing word for a marriage or a child that the law does not accept.'
examples:
- In the old story, the illegitimate was left out of the father's will.
- He was treated as an illegitimate and could not use the family name.
