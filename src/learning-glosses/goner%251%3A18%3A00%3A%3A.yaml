simpleMeaning: a person in deep trouble with no way out, who cannot be saved
scope: 'Also called toast: a person in deep trouble who cannot be saved, not a piece of bread heated until
  brown.'
examples:
- After the engine failed over the sea, he knew he was a goner.
- If the medicine does not work soon, she is a goner.
