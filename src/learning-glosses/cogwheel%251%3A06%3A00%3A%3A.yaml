senseId: 'cogwheel%1:06:00::'
synsetId: 03435461-n
simpleMeaning: A round part with teeth round its edge that meshes with another toothed part, so what it
  drives moves faster or slower, or turns the other way.
scope: Also called gear, gear wheel and geared wheel, this toothed part turns against another toothed
  part.
examples:
- The cogwheel turned the smaller gear.
- The cogwheel's teeth caught the teeth of the other part.
