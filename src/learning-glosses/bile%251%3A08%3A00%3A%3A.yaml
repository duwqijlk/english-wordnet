simpleMeaning: A juice made by the liver and kept in the gallbladder, which helps the body break down
  fats in food
scope: 'Also called gall: a juice from the liver that helps break down fats, not anger or bitterness.'
examples:
- Bile helps the body break down the fats in a meal.
- The liver makes bile, which is stored in the gallbladder.
