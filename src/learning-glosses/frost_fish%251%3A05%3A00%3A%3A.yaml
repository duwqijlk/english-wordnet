simpleMeaning: long sea creatures with a long thin body like a whip, no scales, and sharp teeth, close
  kin to the snake mackerel
scope: Long thin sea creatures with sharp teeth, not true mackerels and not eels; also called cutlassfish
  and hairtail.
examples:
- The frost fish caught off the coast had a body like a long whip and sharp teeth.
- A frost fish can grow long and thin, with no scales on its skin.
