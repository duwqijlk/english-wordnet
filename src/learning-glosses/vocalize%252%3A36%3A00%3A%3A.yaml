simpleMeaning: to sing every note of a tune or a scale using one and the same vowel sound
scope: To sing every note of a tune or a scale using one and the same vowel sound; not to speak with the
  voice, and not to sing words.
examples:
- The singer would vocalize on one vowel sound each morning to warm up her voice.
- She vocalized the whole scale on the sound 'ah'.
