senseId: 'insulin_shock_treatment%1:04:00::'
synsetId: 00708100-n
simpleMeaning: Giving enough of a blood-sugar drug to bring on fits and a sleep from which the person
  cannot be woken.
scope: Giving enough of a blood-sugar drug to bring on fits and a sleep from which the person cannot be
  woken, also called insulin shock and insulin shock therapy; not low blood sugar by itself and not a
  drug given to wake a person.
examples:
- Insulin shock treatment brought on fits in the patient.
- Doctors stopped insulin shock treatment long ago.
