simpleMeaning: Of the ordinary or poor quality typical of goods made for general sale rather than for
  a special standard.
scope: It is not about trade links or a profit-first attitude; it describes plain or poor quality in goods.
examples:
- The hotel was clean but of an ordinary, mass-market standard.
- These are cheap goods of the sort sold in any supermarket.
