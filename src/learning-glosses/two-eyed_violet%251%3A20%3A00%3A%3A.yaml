simpleMeaning: A flower of the Pacific coast of North America with white petals touched with yellow and
  deep purple.
scope: This is a flower of the Pacific coast with white petals touched with yellow and deep purple, also
  called heartsease; not a daisy and not a rose.
examples:
- The two-eyed violet grew near the coast path.
- Two-eyed violets bloomed in the spring sun.
