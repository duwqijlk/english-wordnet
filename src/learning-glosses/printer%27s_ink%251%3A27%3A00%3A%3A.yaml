simpleMeaning: A thick but soft liquid for marking paper that dries fast, made specially for use in printing
scope: This is the liquid used to put words and pictures on paper; printing ink is another name for this
  sense, not paint and not the liquid in a pen.
examples:
- The printer's ink dried fast on the fresh pages.
- His hands were black with printer's ink after a day at the press.
