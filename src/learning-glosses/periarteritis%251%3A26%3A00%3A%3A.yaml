simpleMeaning: This illness makes the outer coat of an artery swell
scope: This is a swelling of the outer coat of a blood vessel, not a swelling of its inner coat and not
  a swelling of a vein.
examples:
- Periarteritis made the artery wall tender.
- The doctor found periarteritis in the small artery.
