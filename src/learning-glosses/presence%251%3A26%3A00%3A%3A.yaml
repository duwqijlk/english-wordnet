simpleMeaning: the fact of being in a place at a particular time, or of existing now.
scope: This is not a spirit that is sensed nearby, and not the way a person carries themselves; it is
  the fact that someone or something is in a place or exists now.
examples:
- Your presence at the meeting is required.
- The presence of bacteria in the water was confirmed.
