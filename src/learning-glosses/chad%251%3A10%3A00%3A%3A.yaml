simpleMeaning: A family of Afroasiatic tonal languages, mostly with two tones, spoken in the lands west
  and south of a large lake in north central Africa.
scope: 'Also called Chadic and Chadic language: this Afroasiatic family is marked by its tones, mostly
  two, in the lands west and south of Lake Chad in north central Africa.'
examples:
- Chad is a family of tonal languages spoken in north central Africa.
- Most languages in the Chad family have two tones.
