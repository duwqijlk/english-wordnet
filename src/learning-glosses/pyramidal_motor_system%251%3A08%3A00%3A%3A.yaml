senseId: 'pyramidal_motor_system%1:08:00::'
synsetId: 05499264-n
simpleMeaning: A bundle of movement nerves on each side of the central nervous system, running from the
  cortex through the brainstem to nerve cells in the head and spinal cord.
scope: This is the whole set of movement pathways from the cortex to the spinal cord, not the sensory
  tracts for touch or pain and not the brain's balance circuits.
examples:
- The pyramidal motor system carries signals for skilled voluntary movement.
- Damage to the pyramidal motor system can cause spastic weakness.
