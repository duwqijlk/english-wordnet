simpleMeaning: a time when there is far too little food, often because crops have failed, and many people
  go hungry, starve, and die
scope: A severe lack of food that leaves people starving, not just a short spell of hunger.
examples:
- The famine followed years of failed harvests.
- Famine drove whole families from their homes.
