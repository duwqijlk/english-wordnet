simpleMeaning: In chemistry, a mix of two liquids, one spread through the other in tiny drops.
scope: In chemistry, a mix of two liquids spread through each other; not the light-sensitive coating on
  paper or film.
examples:
- Mayonnaise is an emulsion of oil and water.
- The chemist shook the emulsion until the two liquids held together.
