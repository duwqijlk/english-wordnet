simpleMeaning: A material that is mixed with cement and water to make concrete, mortar, or plaster; sand
  and small stones are examples
scope: This is the sand or small stones mixed with cement to make concrete; it is not the word for a thing
  made of many small parts packed together, and not the verb for adding up to a total.
examples:
- The builders mixed aggregate with cement and water.
- Coarse aggregate of small stones was added to the concrete mix.
