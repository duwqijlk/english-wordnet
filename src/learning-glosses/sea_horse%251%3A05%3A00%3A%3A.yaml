simpleMeaning: Swimming standing up, a small fish with a curled tail has a head shaped like that of the
  animal it is named for, bent sharply down.
scope: A seahorse is another name for this small fish that swims standing up, not the large northern mammal
  of the same name.
examples:
- The sea horse swam standing up.
- A sea horse has a head shaped like that of the animal it is named for.
