simpleMeaning: an action taken ahead of time to prevent possible harm or injury
scope: This sense is an action taken beforehand to prevent harm; it is not a protective device, and not
  the defensive stance held in boxing or fencing.
examples:
- Wearing a helmet is a sensible guard against head injury.
- They installed cameras as a guard against theft.
