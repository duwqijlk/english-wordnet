senseId: 'transposition%1:04:03::'
synsetId: 00340733-n
simpleMeaning: In electricity, a reordering of the places of power lines, to lessen the effects of shared
  capacitance and inductance.
scope: In electricity, a reordering of the places of power lines, to lessen the effects of shared capacitance
  and inductance; not, in the study of genes, a change in which a bit of a chromosome moves to a new place
  on the same or another chromosome, nor, in music, playing in a key other than the one meant, shifting
  the pitch of a piece up or down, nor, in maths, the moving of a sum from one side of an equation to
  the other, with a change of sign.
examples:
- Their transposition cut the hum.
- The transposition was taught at school.
