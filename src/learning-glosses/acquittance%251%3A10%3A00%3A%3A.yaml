simpleMeaning: a written paper from the law that shows a debt or duty has been paid off or ended
scope: This is a legal paper that proves a debt or duty is finished; release is another name for it, not
  a receipt for a new payment and not a promise to pay.
examples:
- The bank gave her an acquittance when the loan was fully paid.
- Keep the acquittance safe as proof that you owe nothing more.
