simpleMeaning: The substance in beer, wine and spirits that makes people drunk; also used as a cleaner,
  fuel and medicine ingredient, and a renewable additive to gasoline.
scope: The same substance as ethanol and ethyl alcohol, whatever the source; not the strong neutral spirit
  used for blending whisky.
examples:
- The refinery buys fermentation alcohol from nearby sugar mills.
- Fermentation alcohol can be blended with gasoline as a renewable fuel.
