simpleMeaning: a learned person today who is able to learn about many different interests, and to learn
  more than just a little about each one
scope: This is a learned person today who can learn about many different interests. It is not a person
  who learns about only one thing in great depth.
examples:
- As a generalist, she knew more than a little about history, science, and art.
- He is a generalist who has studied many fields and knows a good deal about each.
