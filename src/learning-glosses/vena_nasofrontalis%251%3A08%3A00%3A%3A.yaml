simpleMeaning: The blood tube above the eye and the one at the corner of the eye meet in this tube, lying
  in the front middle part of the eye socket.
scope: 'Also called the nasofrontal vein: a blood tube in the front middle part of the eye socket, not
  the tube above the eye and not the one at the corner of the eye.'
examples:
- The vena nasofrontalis lies in the front middle part of the eye socket.
- Surgeons take care near the vena nasofrontalis when they work inside the eye socket.
