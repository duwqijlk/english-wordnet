senseId: 'exterior_angle%1:25:00::'
synsetId: 13913228-n
simpleMeaning: In a shape with straight sides, the amount added to a corner on the inside of the shape
  to make a straight line
scope: 'Also called an external angle: the amount that fills an inside corner of a shape with straight
  sides up to a straight line, not the inside corner itself and not a corner of a shape with curved sides.'
examples:
- The exterior angle at that corner of the triangle measured 120 degrees.
- She added the interior angle and the exterior angle and got 180 degrees.
