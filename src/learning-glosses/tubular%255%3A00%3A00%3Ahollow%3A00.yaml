simpleMeaning: forming a hollow pipe, or having hollow pipes that let liquids pass through
scope: 'Also called tubelike, cannular, tube-shaped, and vasiform: this means shaped like a hollow pipe
  or having such pipes, not solid and not flat.'
examples:
- The plant has tubular flowers that are hollow inside.
- These tubular roots have hollow spaces inside for water to pass through.
