simpleMeaning: Grey-green leaves, fresh or dried, with a strong smell, used a great deal to give flavour
  to meat, birds, and game
scope: The grey-green leaves used to flavour meat, birds, and game, not the wise teacher and not the plant
  they come from.
examples:
- She added sage to the stuffing.
- She crushed fresh sage leaves over the roast.
