simpleMeaning: A Japanese instrument like a banjo, with a long neck, three strings, a fingerboard without
  frets, and a rectangular body; it is played with a pick.
scope: Also known as samisen; it is not a guitar or a koto.
examples:
- She plucked the shamisen with a pick.
- A shamisen has a long neck and three strings.
