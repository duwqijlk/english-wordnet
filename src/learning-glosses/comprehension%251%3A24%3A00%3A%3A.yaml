simpleMeaning: when one thing holds something else inside it as part of itself
scope: When one thing holds another inside it as a part; not understanding a thing, and not a list.
examples:
- He admired the comprehension of so many ideas in one short book.
- The comprehension of the new facts made her report much longer.
