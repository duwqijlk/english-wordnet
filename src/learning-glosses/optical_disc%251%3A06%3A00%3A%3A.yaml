simpleMeaning: Tiny holes cut in its face keep computer data on this flat round plate with a plastic coat,
  read by a beam of light that moves over it.
scope: 'It is also called optical disk: a flat round plate with a plastic coat, read by a beam of light
  that moves over its face.'
examples:
- The optical disc held all her photos as tiny holes in its face.
- He put the optical disc in the player to read it.
