simpleMeaning: The act of changing from imperial measures to measures in metres, grams and seconds.
scope: The act of changing from imperial measures to measures in metres, grams and seconds, also called
  metrication; not a change of coins and not a change of language.
examples:
- Metrification changed the country's measures to metres, grams and seconds.
- Metrification took years to finish in some towns.
