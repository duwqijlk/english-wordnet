schema: oewn-learning-gloss-v2
senseId: 'resistance%1:04:02::'
synsetId: 00203133-n
simpleMeaning: the act of fighting against or saying no to something you think is wrong or do not agree
  with
scope: 'Also called opposition: the act of fighting against something you think is wrong. Not fighting
  by soldiers against an enemy army, not an electrical part, and not a secret group.'
examples:
- The new law met with strong resistance from local shop owners.
- There was a lot of resistance to the plan to close the school.
