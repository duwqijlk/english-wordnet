simpleMeaning: A beta blocker, a drug that slows the heart; it treats high blood pressure, chest pain,
  irregular heartbeat and heart attack, and may cause depression or worsen heart failure.
scope: One particular beta blocker used for heart and blood-pressure conditions, not a general name for
  the whole class of such drugs or for other heart medicines.
examples:
- Her doctor switched her to metoprolol after the heart attack.
- Metoprolol can make you feel tired, so he takes it at bedtime.
