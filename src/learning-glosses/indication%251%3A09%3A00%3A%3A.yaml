senseId: 'indication%1:09:00::'
synsetId: 05824916-n
simpleMeaning: a piece of information about how something is, shown to a person by a meter or a like device
scope: 'Also called a reading: a piece of information a meter shows about how something is, not a sign
  that points to something and not the act of pointing something out.'
examples:
- The barometer gave clear indications of an approaching storm.
- The indication on the dial showed the tank was nearly empty.
