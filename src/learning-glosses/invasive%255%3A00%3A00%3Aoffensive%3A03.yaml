simpleMeaning: to do with entering a country by force and attacking it in a strong, harmful way
scope: Also called invading, this sense is about entering and attacking a place by force; it is not about
  slowly coming in without permission and not about a disease spreading in the body.
examples:
- The invasive army entered the country and attacked its cities.
- They planned an invasive attack across the border.
