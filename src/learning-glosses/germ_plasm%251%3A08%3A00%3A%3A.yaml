simpleMeaning: Inside the sex cells there is soft living stuff, and it holds the tiny parts that carry
  the body's plan for life
scope: 'Also called plasm: the soft living stuff inside the sex cells, not the whole sex cell itself and
  not the hard parts of the body.'
examples:
- The germ plasm in the sex cells holds the parts that carry the body's plan for life.
- Scientists study germ plasm to learn how traits pass to the next young.
