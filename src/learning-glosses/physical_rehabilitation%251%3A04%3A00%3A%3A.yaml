simpleMeaning: Help given to people who cannot use part of their body well, to take away or lessen what
  keeps them from doing things.
scope: This is help that takes away or lessens what keeps a person from using the body well; physical
  restoration is another name for this sense, not a cure that makes the body whole again and not help
  with money or a home.
examples:
- After her stroke, she went to physical rehabilitation to learn to walk again.
- Physical rehabilitation helped him use his arm after the accident.
