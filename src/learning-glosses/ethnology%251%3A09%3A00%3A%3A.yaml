simpleMeaning: In anthropology, the study of how people split into groups by race, where each group came
  from, where they live, and what makes each group different.
scope: The study of peoples and races as groups, not the study of a single people or of ancient bones.
examples:
- She studied ethnology to learn how peoples spread across the world.
- His ethnology course compared the customs of different races.
