simpleMeaning: the act of putting things into given groups, where the order of the things in each group
  does not matter
scope: The mathematics sense of choosing groups where order does not matter, not the code that opens a
  lock, not a set of chess moves, and not things joined to make a new whole.
examples:
- The teacher asked how many combinations of two letters we could make from A, B and C.
- A combination of three players is the same group even if you name the players in a different order.
