simpleMeaning: A sickness caused by tiny round worms in the blood or body tissues, which block the vessels
  that carry clear fluid
scope: A sickness caused by tiny round worms in the blood or body tissues, which block the vessels that
  carry clear fluid; not a sickness caused by germs in water and not a sickness of the skin alone.
examples:
- Filariasis blocked the vessels in his leg.
- Filariasis comes from tiny worms in the blood.
