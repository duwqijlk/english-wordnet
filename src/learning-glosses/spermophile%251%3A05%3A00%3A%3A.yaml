simpleMeaning: Any of several kinds of ground squirrel that dig burrows on land in the Old and New Worlds
  and often damage farm crops
scope: Any of several kinds of ground squirrel that dig burrows on land and often damage farm crops; gopher
  and ground squirrel are other names for this sense, not a tree squirrel and not a rat that lives in
  houses.
examples:
- The spermophile digs burrows on the ground and damages the crops.
- A spermophile is a ground squirrel that lives in the Old and New Worlds.
