simpleMeaning: How the body moves is shaped by this part of the brain's outer layer
scope: 'Also called the excitable area, the motor area or the motor cortex: the part of the brain that
  shapes how the body moves, not the part that takes in what the senses feel and not the part that plans
  or thinks.'
examples:
- The motor region sends the signals that move the arm.
- Damage to the motor region left his leg weak.
