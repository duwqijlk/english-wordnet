simpleMeaning: the act of hiding the truth by using words that are not clear and can mean more than one
  thing
scope: This is the act of hiding the truth with unclear words, not one single statement that avoids a
  hard truth, and not just the quality of being unclear.
examples:
- The report was full of equivocation, using unclear words to hide what really happened.
- Through equivocation, she hid the truth by choosing words that could be taken two ways.
