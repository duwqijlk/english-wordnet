simpleMeaning: not smooth or skilled in the way a person moves, acts, or does something
scope: This is about moving or acting without skill or smoothness. It is not about feeling uneasy with
  other people, and not about words that sound clumsy.
examples:
- He is an awkward dancer and often steps on his partner's feet.
- She made an awkward gesture with her hands when she tried to explain.
