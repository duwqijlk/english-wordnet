simpleMeaning: When light and other rays fall on it, most of all light, this thing makes a voltage
scope: Said of a thing that makes a voltage from light and other rays, not of a thing that only gives
  off light and not of a battery that stores power.
examples:
- The photovoltaic panel makes a voltage in bright sunlight.
- These photovoltaic cells run the pump when the sun shines on them.
