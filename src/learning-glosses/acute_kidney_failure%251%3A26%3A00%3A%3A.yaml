senseId: 'acute_kidney_failure%1:26:00::'
synsetId: 14138368-n
simpleMeaning: Kidney failure linked to burns or other injury, sudden infection, or a block in the urinary
  tract.
scope: Also called acute renal failure; it is linked to burns, injury, sudden infection or a block in
  the urine tubes, not a slow loss of kidney work over years.
examples:
- Acute kidney failure set in after the burns kept the organs that clean the blood from working.
- A block in the tubes that carry urine brought on acute kidney failure.
