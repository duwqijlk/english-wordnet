simpleMeaning: the wide, raised part at the base of a flower that holds the pistil, the part that makes
  seeds
scope: The wide, raised part at the base of a flower that holds the seed-making part, not the stalk that
  lifts that part and not the petals.
examples:
- The gynobase swells beneath the pistil of the flower.
- Botanists point to the gynobase when they show how the flower is built.
