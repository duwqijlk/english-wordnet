simpleMeaning: In the south-east of the United States, a low, bushy kind of chestnut bears small nuts
  that people can eat
scope: A shrubby chestnut tree of the south-east of the United States with small nuts that can be eaten;
  dwarf chestnut and eastern chinquapin are other names for this sense, not the other chinquapin tree
  of the southern midwest and not the chinquapin oak.
examples:
- The chinquapin in our yard bears small nuts each autumn.
- We gathered chinquapins from the low shrubby tree.
