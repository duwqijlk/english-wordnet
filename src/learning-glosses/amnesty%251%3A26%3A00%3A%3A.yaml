simpleMeaning: a set time when people who broke the law will not be punished for what they did
scope: A set time when people who broke the law are not punished, not the official order that lets one
  person go free from punishment.
examples:
- During the amnesty, many people handed in illegal guns without fear of punishment.
- The government declared a month-long amnesty for unpaid taxes.
