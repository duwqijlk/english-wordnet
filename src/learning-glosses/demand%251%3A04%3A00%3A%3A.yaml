simpleMeaning: The action of forcefully asking for something in a way that leaves the other person little
  choice.
scope: This is the action of forcefully asking, not the urgent request itself as a thing and not a required
  task or duty.
examples:
- The union's demand for safer working conditions led to a strike.
- Her sudden demand for the truth caught him off guard.
