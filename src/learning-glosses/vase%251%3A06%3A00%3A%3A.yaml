simpleMeaning: an open jar made of glass or porcelain (a hard white material made from baked clay), used
  as a pretty thing to look at or to hold flowers
scope: A jar used as a pretty thing to look at or to hold flowers; not a closed jar for keeping food or
  drink.
examples:
- She put red roses in a glass vase on the table.
- A blue vase stood by the window, full of fresh flowers.
