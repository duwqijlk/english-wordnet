simpleMeaning: A tool or substance that kills flesh for a medical end, as in taking off a wart, searing
  with hot iron, live wire, or a biting substance, or freezing it.
scope: A tool or substance that kills flesh for a medical end, also called cautery.
examples:
- The doctor used a cauterant to take off the wart.
- A cauterant burned the wart away.
