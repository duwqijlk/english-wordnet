simpleMeaning: A small untidy American cherry that grows on sandy ground and bears tiny purplish-black
  fruit that is hardly good to eat
scope: Also called sand cherry, Prunus pumila, Prunus pumilla susquehanae and Prunus susquehanae, this
  is a small straggling American cherry of sandy ground with tiny purplish-black fruit, not a tall cherry
  tree and not a cherry with large sweet fruit.
examples:
- The Prunus cuneata grew on the sandy bank.
- A Prunus cuneata bore tiny dark fruit.
