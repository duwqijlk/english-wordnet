simpleMeaning: How far apart the two rails of a railway are, or how far apart the wheels of a train are.
scope: How far apart the rails of a railway or the wheels of a train are, not the tool that measures things,
  not the standard size something is judged by, not the width of a tube, and not the act of judging or
  fitting to a size.
examples:
- The gauge of this line is wider than the usual one.
- A narrow gauge lets trains run on steep mountain tracks.
