senseId: 'color_circle%1:10:00::'
synsetId: 07014335-n
simpleMeaning: a chart in which hues that are opposites, or their names, are put on opposite sides of
  a ring
scope: A chart that puts opposite hues across from each other; color wheel is another name for this sense;
  not a chart of one hue, and not a wheel that turns.
examples:
- On the color circle, red sits across from green.
- The color circle shows which hues are opposites.
