simpleMeaning: A camera glass made of more than one piece, that lets in a lot of light
scope: A camera glass made of more than one piece, that lets in a lot of light, not a plain single glass
  and not the glass used for wide views.
examples:
- She put a portrait lens on her camera.
- The portrait lens let in enough light for the dim room.
