simpleMeaning: to bring a person or group into hard times, especially hard times with money
scope: To put a person or group into hard times, especially with money, not the state of being in danger,
  trouble or need.
examples:
- High rents can distress families who already have little money.
- The loss of sales distressed the small company and left it short of money.
