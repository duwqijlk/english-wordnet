senseId: 'warlord%1:18:00::'
synsetId: 10787505-n
simpleMeaning: The highest army leader in an area, with power to rule its people; they answer to nobody,
  especially when the main government is weak
scope: An army leader who also rules an area, not a common soldier, not an army leader with no power over
  people, and not a leader of a strong main government.
examples:
- The warlord controlled the region and collected taxes from its people.
- When the government fell, a warlord took power in the north.
