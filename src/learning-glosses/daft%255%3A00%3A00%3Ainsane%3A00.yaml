simpleMeaning: in loose everyday talk, a word for a person whose mind does not work in the usual way
scope: A slang word for a mind not working right, with cracked, nuts, buggy, bats and crackers as other
  names for this sense, and not a medical term or merely silly.
examples:
- They said he was daft because he talked to people who were not there.
- The daft old man talked to himself all day.
