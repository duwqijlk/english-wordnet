simpleMeaning: a growth made of a mass of blood vessels or lymph vessels
scope: A growth made of blood or lymph vessels, not a swelling of one vessel and not a cancer that spreads.
examples:
- The doctor found a small angioma on his arm made of tiny blood vessels.
- An angioma may look like a red lump on the skin.
