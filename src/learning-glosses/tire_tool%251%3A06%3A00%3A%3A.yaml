simpleMeaning: To fit the outer cover of an air-filled wheel onto its steel rim, this hand-held bar forces
  it on.
scope: Also called a tire iron, it is the hand-held bar for fitting a wheel's outer cover onto its steel
  rim.
examples:
- They reached for the tire tool to get the cover onto the wheel.
- The tire tool forced the cover onto the wheel.
