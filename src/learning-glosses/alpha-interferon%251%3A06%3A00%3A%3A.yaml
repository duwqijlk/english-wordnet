simpleMeaning: A body protein, made inside the body and in labs for sale, used as a drug to guide the
  defences of the body, fight viruses, and hold back growths.
scope: This is one form of a body protein used as a drug, distinct from other forms of the same protein.
examples:
- Alpha-interferon is made inside the body and in labs for sale.
- Alpha-interferon guides the body's defences against viruses.
