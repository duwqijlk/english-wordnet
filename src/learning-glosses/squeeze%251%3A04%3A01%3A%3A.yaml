simpleMeaning: forceful pressure on someone to give in, applied by gathering power or using it unfairly
scope: Also called a power play or squeeze play; not the act of pressing, the romantic hold, or slang
  for a partner.
examples:
- The union called the lockout a crude squeeze on its members.
- Critics saw the new rules as a squeeze on small businesses.
