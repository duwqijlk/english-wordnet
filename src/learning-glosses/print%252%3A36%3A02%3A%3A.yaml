simpleMeaning: to have words or pictures put in a book, newspaper or magazine so that people can read
  or see them
scope: This means having words or pictures appear in a book, newspaper or magazine for people to read;
  it is not just copying a page with a machine, not making a picture, and not writing letters by hand
  in separate shapes.
examples:
- The magazine printed her short story in its June issue.
- They decided not to print the letter in the newspaper.
