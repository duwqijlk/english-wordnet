simpleMeaning: A Christian teaching that the church-one drive backs joint work and a deeper fellow-feeling
  in various church groups, with one Christian whole as its end.
scope: This sense is also called ecumenicalism and ecumenicism, a Christian teaching that the church-one
  drive backs joint work and a deeper fellow-feeling in various church groups, with one Christian whole
  as its end.
examples:
- Ecumenisms back joint work.
- The ecumenism aims at a single Christian whole.
