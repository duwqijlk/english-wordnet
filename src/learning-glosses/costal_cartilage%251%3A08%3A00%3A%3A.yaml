simpleMeaning: Gristle that links the breastbone to the rib ends, soft and springy enough to let the chest
  move as a person breathes
scope: The springy gristle between the breastbone and the rib ends lets the chest move as a person breathes.
examples:
- The costal cartilage bent a little as she took a deep breath.
- She felt the costal cartilage move as she breathed in.
