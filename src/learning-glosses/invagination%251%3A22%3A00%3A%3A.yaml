simpleMeaning: When the outer layer of a thing turns in on itself, it makes a pocket in the surface
scope: The folding in of an outer layer to make a pocket in a surface, also called infolding, introversion
  or intussusception; not a cell wall growing in area.
examples:
- The invagination of the blastula folds its outer layer into a pocket.
- Invagination turned the outer layer inward and left a hollow in the surface.
