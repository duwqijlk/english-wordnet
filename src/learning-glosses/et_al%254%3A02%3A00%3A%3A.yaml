simpleMeaning: A Latin phrase placed after a name to stand for the other people involved alongside that
  person.
scope: This sense points to extra people, not to other places or passages in a text.
examples:
- The results reported by Smith et al. have not been repeated.
- Chen et al. published the method in a 2019 paper.
