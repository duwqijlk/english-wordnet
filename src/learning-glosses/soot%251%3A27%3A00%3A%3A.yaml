simpleMeaning: A black, fine-grained substance made up wholly or mostly of shapeless carbon, used to make
  pigments and ink.
scope: Not ash from a fire, nor coal dust; also called crock, smut, lampblack and carbon black.
examples:
- Soot blackened the walls of the chimney.
- The ink was made from soot.
