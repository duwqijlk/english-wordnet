simpleMeaning: a part of the system that starts an engine, made of two shaped metal rods with a space
  between them
scope: A part of an engine's starting system, not the whole starting system and not a plug; the two metal
  rods and the space between them make the flash that starts the engine.
examples:
- The mechanic cleaned the spark gap on the old engine.
- A wide spark gap can stop the engine from starting.
