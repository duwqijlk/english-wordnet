simpleMeaning: a plant that grows under the surface of fresh or slightly salty ponds, lakes, streams and
  marshes, with narrow leaves and small blooms
scope: 'Also called a naiad: a plant that lives under the surface of fresh or slightly salty water, not
  the water lily with large showy flowers that float on the surface and not a plant that grows on dry
  land.'
examples:
- The water nymph grew just below the surface of the pond.
- A water nymph with narrow leaves and tiny flowers filled the shallow end of the lake.
