simpleMeaning: Feathered creatures carry this tiny wingless louse for most of its life, and it bites them
  with mouth parts made for the job.
scope: This tiny wingless insect that lives mostly on feathered creatures is also called biting louse
  and louse.
examples:
- The bird louse bit the bird and stayed on it.
- More than one bird louse lived on the same bird.
