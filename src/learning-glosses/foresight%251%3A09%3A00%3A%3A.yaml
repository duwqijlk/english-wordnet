senseId: 'foresight%1:09:00::'
synsetId: 05813285-n
simpleMeaning: The power to see what will happen before it does, and to know it in advance
scope: Knowing what will happen before it does, not careful planning for the future and not a lucky guess.
examples:
- Her foresight showed when she said the small shop would grow into a big store.
- His foresight let him see the price fall long before it happened.
