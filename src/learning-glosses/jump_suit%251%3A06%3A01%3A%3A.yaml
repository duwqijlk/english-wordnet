simpleMeaning: A person who drops from a plane with a parachute wears this single piece of clothing, shaped
  like their uniform
scope: A single piece of clothing shaped like a parachutist's uniform, also called jumpsuit; not a two-piece
  outfit and not a uniform for work.
examples:
- He put on a jump suit before the parachute lesson.
- The jump suit was made in one piece, with no separate top and trousers.
