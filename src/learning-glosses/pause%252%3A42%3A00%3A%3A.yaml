schema: oewn-learning-gloss-v2
senseId: 'pause%2:42:00::'
synsetId: 02647119-v
simpleMeaning: Stop doing something for a while and then carry on.
scope: Another name for this sense is hesitate; it is breaking off an activity and then going on, not
  the noun for the interval itself or the broader sense of ceasing an action temporarily.
examples:
- He paused at the door before going in.
- She paused to check her notes and then continued.
