simpleMeaning: Keep a safe gap from others, away from crowds, to slow the spread of catching illnesses;
  big steps call off group events and shut schools, workplaces, and public places.
scope: It is also called social distancing, and it keeps a safe gap from others and away from crowds to
  slow the spread of catching illnesses.
examples:
- To practice physical distancing, stay at least 6 feet from other people.
- Physical distancing can slow the spread of the virus.
