simpleMeaning: With spikes of greenish blooms and blades white and hairy underneath, it is a plant of
  Europe that lives one year and grows wild as a weed in North America.
scope: It is also called oakleaf goosefoot, a one-year plant of Europe with spikes of greenish blooms.
examples:
- The oak-leaved goosefoot grows wild in North America.
- Oak-leaved goosefoot lives only one year.
