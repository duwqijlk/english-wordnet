simpleMeaning: a close, careful look at something to check it and spot mistakes
scope: 'Examination is another name for this sense: looking at something with great care, such as to find
  mistakes, not a quick look and not a test of knowledge.'
examples:
- The accounts stood up to close scrutiny.
- Her work passed scrutiny without a single error found.
