simpleMeaning: In plants, a natural swelling or growth sits at the foot of a stalk or bristle in some
  mosses, or on the scale of a cone in cone-bearing trees.
scope: In plants, a natural swelling at the foot of a stalk or cone scale, not the outgrowth on a bone
  or body part that the same word names in anatomy.
examples:
- The apophysis swells at the foot of the stalk in the moss.
- An apophysis also grows on the scale of a cone in some cone-bearing trees.
