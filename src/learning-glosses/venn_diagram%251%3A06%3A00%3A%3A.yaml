simpleMeaning: A drawing that uses rings to show groups in maths or logic inside a box shape for everything;
  things in more than one group sit where the rings cross.
scope: A drawing that uses rings to show groups in maths or logic, also called Venn's diagram, with things
  in more than one group where the rings cross.
examples:
- A Venn diagram uses rings to show groups inside a box shape.
- In a Venn diagram, things in two groups sit where the rings cross.
