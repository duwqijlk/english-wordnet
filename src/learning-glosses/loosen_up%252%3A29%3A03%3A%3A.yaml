simpleMeaning: To make the body bendy and easy to move by stretching, as if to get ready for hard physical
  activity.
scope: This is making the body bendy by stretching before hard physical activity, not becoming less tense
  in manner, which is the other sense of loosen up; limber up and warm up are other names for this sense.
examples:
- She loosened up with stretches before the race.
- Loosen up before you lift, or you may pull a muscle.
