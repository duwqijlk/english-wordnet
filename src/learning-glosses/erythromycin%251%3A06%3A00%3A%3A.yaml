simpleMeaning: An antibiotic produced by a soil bacterium; it is effective against many Gram-positive
  bacteria and some Gram-negative ones.
scope: The antibiotic drug, not the soil bacterium that produces it.
examples:
- The vet gave the dog erythromycin for a stubborn skin infection.
- Erythromycin is often used for people who are allergic to penicillin.
