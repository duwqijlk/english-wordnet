simpleMeaning: A sea creature with a body shaped like the blood-pumping organ, held in a hard shell with
  sharp points.
scope: A sea creature with a body shaped like the blood-pumping organ in a hard shell with sharp points,
  not a round sea urchin and not a sand dollar.
examples:
- The heart urchin lay half buried in the sand.
- A heart urchin has a hard shell covered in sharp points.
