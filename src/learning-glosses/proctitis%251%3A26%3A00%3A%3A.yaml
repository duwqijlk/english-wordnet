simpleMeaning: A red, swollen rectum, with bloody stools and a frequent urge to pass waste; it is often
  linked to Crohn's disease or ulcerative colitis.
scope: Inflammation of the rectum itself, not colitis (inflammation of the colon) or plain rectal pain.
examples:
- Proctitis can cause bloody stools and a frequent urge to pass waste.
- His proctitis was linked to ulcerative colitis.
