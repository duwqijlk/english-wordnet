simpleMeaning: A word used before or instead of someone's name to show their rank or the job they do,
  such as 'Mr.' or 'General'.
scope: This sense is not the name of a book, film or song, and not a word showing noble rank.
examples:
- The envelope was addressed to 'Dr. Chen', using her professional title.
- He was introduced as 'Captain' Hall, a title earned in the navy.
