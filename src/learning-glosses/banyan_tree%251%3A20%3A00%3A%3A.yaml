simpleMeaning: New trunks grow where shoots from this plant from India drop from the air to the ground
  and take root.
scope: This plant is also called banyan, banian and banian tree.
examples:
- The banyan tree put out shoots in the air.
- Shoots of the banyan tree dropped to the ground and rooted as fresh trunks.
