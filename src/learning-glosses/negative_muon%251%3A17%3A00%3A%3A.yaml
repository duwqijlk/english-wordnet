simpleMeaning: A bit of matter with a minus charge breaks into an electron, a neutrino and an antineutrino,
  and half of a group of them is gone in 2 microseconds.
scope: This bit of matter is also called mu-meson and muon, and half of a group of them is gone in 2 microseconds.
examples:
- Half of the negative muons in the group were gone in 2 microseconds.
- The negative muon broke down into an electron, a neutrino and an antineutrino.
