simpleMeaning: an East Indian tree that bears oily seeds, whose oil is used to treat leprosy
scope: An East Indian tree whose seed oil is used to treat leprosy; chaulmoogra and chaulmoogra tree are
  other names for this sense, not a fruit tree grown for food.
examples:
- Chaulmugra seeds yield an oil for leprosy.
- The chaulmugra grows in East India.
