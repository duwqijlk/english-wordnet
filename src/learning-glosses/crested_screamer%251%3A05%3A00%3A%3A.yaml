simpleMeaning: A bird much like its horned relative, but with a soft tuft of feathers on the back of its
  head
scope: A bird told apart from the horned screamer by the soft feathers on the back of its head, not the
  horned screamer itself and not a bird with no head tuft.
examples:
- The crested screamer called loudly from the lake edge.
- We saw a crested screamer with its feather tuft raised.
