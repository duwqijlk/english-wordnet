simpleMeaning: a unit of length used in navigation, exactly 1,852 meters, once based on the distance covered
  by one sixtieth of a degree of latitude
scope: 'Also called mile: the navigation unit of exactly 1,852 meters, not the 1,760-yard land unit and
  not the former British unit of 6,080 feet.'
examples:
- The ship was ten mi from port when the storm hit.
- The island lay five mi to the north.
