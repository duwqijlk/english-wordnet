simpleMeaning: Of a kind that stands out as special or surprising, and never used with a word like 'not'
scope: 'Also called quite and quite an: it marks a person or thing as special or surprising, not the plain
  word quite meaning very or fully.'
examples:
- She's quite a girl, full of life and ideas.
- It was quite a walk to the top of the hill.
