simpleMeaning: a thing that women wear on the head for formal occasions, with jewels on it
scope: A jewel-covered thing women wear on the head for a formal occasion, not a full crown worn by a
  king or queen and not a plain band for the hair.
examples:
- She wore a tiara with her dress at the formal dinner.
- The bride's tiara shone under the lights.
