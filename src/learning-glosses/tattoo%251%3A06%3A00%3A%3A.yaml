simpleMeaning: A picture or mark put on the skin for good, made by pushing coloured ink under the skin
scope: A picture made on the skin, not a drum beat or horn call for soldiers.
examples:
- He has a tattoo of a rose on his arm.
- She got a tattoo to mark her birthday.
