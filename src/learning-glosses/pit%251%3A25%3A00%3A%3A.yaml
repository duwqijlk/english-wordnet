simpleMeaning: a hollow place that goes in from a surface, especially a hollow place in the body
scope: A hollow that goes in from a surface, especially in the body, not a place dug in the ground to
  get stone or coal and not an area beside a race track.
examples:
- There was a small pit in the surface of the metal plate.
- A deep pit in his cheek showed when he smiled.
