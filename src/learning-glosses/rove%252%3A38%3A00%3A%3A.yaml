simpleMeaning: to move from place to place with no set aim, often looking for food or work
scope: To move from place to place with no set aim, often looking for food or work; range, roll, cast,
  drift, wander, swan, stray, roam, ramble and tramp are other names for this sense, not a planned trip.
examples:
- They roved from town to town looking for work.
- The cattle rove across the open plain.
