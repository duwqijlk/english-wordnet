simpleMeaning: Any branch of Shinto other than Kokka.
scope: 'Also called Shuha Shinto: any branch of Shinto other than Kokka, not Shinto as a whole and not
  Kokka itself.'
examples:
- The Shua is a branch of Shinto, but it is not Kokka.
- Kokka is one branch of Shinto, and the Shua is another.
