scope: This is grey with a spotty pattern of darker grey marks, also called dapple-gray, dappled-gray,
  and dappled-grey, not plain grey or grey with white spots.
examples:
- The dapple-grey horse stood in the field.
- His dapple-grey coat has darker grey marks all over it.
