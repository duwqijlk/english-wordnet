simpleMeaning: a sum put on or taken off because of certain facts about the case
scope: 'Also called allowance: a sum added or taken off for stated reasons, not the act of changing a
  thing.'
examples:
- The bill showed an adjustment for the damaged goods.
- An adjustment of ten pounds was made for the late delivery.
