senseId: 'lustre%1:07:02::'
synsetId: 04961860-n
simpleMeaning: The brightness of a surface that sends back the light falling on it.
scope: Also called sheen, luster, or shininess, this is the bright look of a thing that shines by giving
  back light, not a coat put on pots or china.
examples:
- The lustre of the silk caught the light.
- The old wood had lost its lustre.
