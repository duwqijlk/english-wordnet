senseId: 'groundbreaking_ceremony%1:04:00::'
synsetId: 00240350-n
simpleMeaning: A formal event where the first soil is dug up to start work on a construction project
scope: Groundbreaking is another name for this sense; it is a formal event that starts construction work,
  not the construction work itself and not a party to mark a finished project.
examples:
- The mayor spoke at the groundbreaking ceremony for the new school.
- They held a groundbreaking ceremony before work on the bridge began.
