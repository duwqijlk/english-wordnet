simpleMeaning: The bigger of two tall fast-running birds that cannot fly, like ostriches but with three
  toes, found from Brazil to Patagonia.
scope: Also called rhea; the bigger of two tall fast-running birds that cannot fly, like ostriches but
  with three toes, not the smaller of the two and not a bird that flies.
examples:
- Rhea americana runs fast across the grassland of Brazil.
- We watched Rhea americana stride over the plain on three toes.
