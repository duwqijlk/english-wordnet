simpleMeaning: Flower heads in flat-topped clusters with pearly white leaf-like parts crown this plant
  of America, whose leaves hold soft woolly hairs and whose flowers keep when dried.
scope: Also called pearly everlasting; it is a plant of America with woolly leaves and white flower heads.
examples:
- The cottonweed has soft woolly hairs on its leaves.
- The cottonweed bears white flower heads.
