simpleMeaning: Showing that a suspected illness or germ that causes disease is present.
scope: This describes a test result that detects a suspected illness or germ, not an affirming, hopeful
  or accepting attitude, not being certain or very sure, not something beneficial, not something formally
  imposed, not something impossible to deny, not the philosophy of positivism, not a direction of increase
  or progress, not a number greater than zero, not an electric charge, not excessive confidence, and not
  the noun senses such as the uncompared form of an adjective or a photographic film.
examples:
- Her test came back positive for influenza, so she stayed home from work.
- The vet said the blood sample was positive, which meant the dog had been exposed to the infection.
