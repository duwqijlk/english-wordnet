simpleMeaning: placed in, or facing, the part of a place that lies between north and west
scope: A place or thing that lies or faces between north and west, not the direction itself and not a
  place in the northwest.
examples:
- The northwestern corner of the garden gets little sun.
- The northwest side of the house faces the hills.
