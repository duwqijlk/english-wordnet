simpleMeaning: sounds people make out loud to show great joy and happiness
scope: 'Also called jubilation and exultation: sounds made to show great joy, not the quiet feeling of
  joy itself and not a party.'
examples:
- There was loud rejoicing in the streets after the team won.
- We heard rejoicing from the hall as the good news was read out.
