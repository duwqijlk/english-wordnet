simpleMeaning: A small cone-shaped pouch that sticks out from the front top part of each upper chamber
  of the heart
scope: This is a small cone-shaped pouch at the front top of each upper chamber of the heart; auricle
  and atrial auricle are other names for it, not the lower pumping chamber and not the main wall of the
  heart.
examples:
- The auricula atrii sticks out from the upper chamber of the heart.
- Each auricula atrii is a small pouch at the front of the heart.
