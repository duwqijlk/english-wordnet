senseId: 'electrical_converter%1:06:00::'
synsetId: 03274114-n
simpleMeaning: Power that flows back and forth comes out of this machine flowing one way only, or the
  other way round
scope: A machine that changes one kind of power into the other, not a machine that only stores power and
  not a switch that only turns power on or off.
examples:
- The electrical converter in the charger turns the power from the wall into the kind the phone needs.
- The electrical converter changed the direct current from the battery into alternating current for the
  lights.
