simpleMeaning: A long wide cloth of wool with a hole cut for the head, it hangs over the shoulders as
  part of a monk's dress.
scope: Also called scapular, it is a long wide wool cloth with a hole for the head, worn over the shoulders
  as part of a monk's dress, and it has no sleeves of its own.
examples:
- He wore a scapulary of wool over his shoulders.
- The scapulary hung over his shoulders as part of his dress.
