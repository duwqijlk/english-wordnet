simpleMeaning: not serious, and ready to laugh and play instead of thinking with care
scope: 'This sense is also called silly, and giddy is another name for it: not serious and ready to laugh
  and play. Not the feeling that the room is turning and you may fall, and not the verb that makes someone
  feel that way.'
examples:
- The dizzy girls could not stop laughing in class.
- He acted dizzy all through the party, never taking anything seriously.
