simpleMeaning: 'The mechanism of a modern rifle or shotgun: a sliding lever moves back and forth, throwing
  out the empty shell case, readying the gun and loading a new round.'
scope: Another name for the pump action; it is the sliding-lever mechanism of a modern rifle or shotgun,
  not a bolt-action, lever-action or trigger mechanism.
examples:
- He worked the slide action to load a new round.
- The rifle's slide action threw out the empty case.
