simpleMeaning: a strange thing that is not common, and that a person may want to keep
scope: 'Also called curiosity, oddity, rarity, curio, and oddment: this is a strange thing a person may
  want to keep, not a strange quality that a person or thing has.'
examples:
- The old coin was a peculiarity that collectors wanted to buy.
- He kept the shell as a peculiarity from his trip to the sea.
