simpleMeaning: a shrub or small woody plant growing on land in western Australia that keeps its leaves
  all year and bears bright yellow-orange flowers, and lives off the roots of grasses
scope: A shrub or small woody plant of western Australia with bright yellow-orange flowers, living off
  grass roots; flame tree is another name for this sense. Not a plant that feeds itself, and not the other
  flame tree plants of tropical America or South Australia.
examples:
- The fire tree was in full bloom, its yellow-orange flowers bright against the dry grass.
- A fire tree grows beside the track, drawing food from the roots of the grasses around it.
