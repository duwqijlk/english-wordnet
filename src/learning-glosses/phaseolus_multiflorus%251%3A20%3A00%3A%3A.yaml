simpleMeaning: A bean from tropical America with red flowers and black beans marked with spots, like the
  common bean but living for years; a favourite food bean in Great Britain.
scope: Also called runner bean, scarlet runner, scarlet runner bean, Dutch case-knife bean and Phaseolus
  coccineus; a red-flowered bean of tropical America that lives for years, grown as food in Great Britain.
examples:
- Phaseolus multiflorus climbed the poles, its red flowers bright against the leaves.
- We grew Phaseolus multiflorus for its beans in the kitchen garden.
