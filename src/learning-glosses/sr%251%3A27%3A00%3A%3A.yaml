simpleMeaning: A soft metal, silver-white or yellowish, of the alkali metal group, that turns yellow in
  air and is found in celestite and strontianite.
scope: This is the soft silver-white metal of the alkali group, also called strontium and atomic number
  38, not calcium or barium.
examples:
- Sr turns yellow when left in air.
- Miners found Sr in celestite rock.
