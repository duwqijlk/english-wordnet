simpleMeaning: A kind of skin disease found in Mexico and Central and South America, whose sores stay
  on the skin and the wet inner lining.
scope: Also called mucocutaneous leishmaniasis and nasopharyngeal leishmaniasis, this form of the disease
  found in Mexico and Central and South America keeps its sores on the skin and the wet inner lining.
examples:
- Sores from leishmaniasis americana stayed on the skin.
- Leishmaniasis americana occurs in Mexico and in Central and South America.
