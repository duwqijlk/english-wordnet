synsetId: 04157539-n
simpleMeaning: Wire gear that makes speech unclear while sent, and makes it plain again on receipt.
scope: Wire gear that makes speech unclear while sent, and makes it plain again on receipt; not a light
  bike with tough tyres and springs, a cross-country bike made for rough ground, nor a fast mover, one
  who scrambles.
examples:
- Their scrambler garbled the call.
- The scrambler was used at dawn.
