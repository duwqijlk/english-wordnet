simpleMeaning: to make a shot in billiards (a game with balls on a table), where the white ball hit by
  the player hits one ball and then another
scope: This is the act of making that kind of shot in a table ball game, not the shot itself, which is
  the noun use.
examples:
- He caromed cleanly, sending the white ball into one ball and then the other.
- She caromed on her last turn and won the game.
