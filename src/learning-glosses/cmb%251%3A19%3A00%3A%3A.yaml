simpleMeaning: In cosmology, the cooled leftover heat of the hot big bang that fills the whole universe
  and can still be seen today, at about 2.725 kelvin on average
scope: In cosmology, this cooled leftover heat from the hot big bang, also called cosmic background radiation,
  cosmic microwave background, cosmic microwave background radiation, CBR and CMBR, fills the whole universe
  and can still be seen today.
examples:
- Scientists measure the CMB to learn about the early universe.
- The CMB fills the whole universe with faint heat.
