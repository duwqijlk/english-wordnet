simpleMeaning: Prized for its timber, this tall larch of the west of North America bears pale green sharply
  pointed leaves and oblong cones.
scope: Also called western larch, this tall larch of the west of North America is valued for its timber.
examples:
- Western tamarack is prized for its timber.
- The tamarack leaves of the west were pale green and sharply pointed.
