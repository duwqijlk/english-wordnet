simpleMeaning: In law, land or goods settled on a woman about to marry, as her marriage gift in place
  of a widow's share.
scope: In law, land or goods settled on a woman about to marry; legal jointure is another name for it,
  not a gift given after marriage and not the widow's share itself.
examples:
- The jointure gave her land of her own when she married.
- Her father settled a jointure on her before the wedding.
