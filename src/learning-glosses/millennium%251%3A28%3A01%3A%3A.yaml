simpleMeaning: In the New Testament, a thousand years when the faithful rule with Jesus, foretold in Revelation;
  its meaning is much debated, and some churches expect justice, peace and happiness.
scope: This is the expected biblical reign of Christ, not an ordinary span of a thousand years or a thousandth
  anniversary.
examples:
- Many believers look forward to the millennium foretold in Revelation.
- The sermon described the millennium as a time of justice and peace.
