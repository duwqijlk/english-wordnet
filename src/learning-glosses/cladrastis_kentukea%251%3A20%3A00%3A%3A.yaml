simpleMeaning: A small round-topped tree that loses its leaves in autumn, with showy white flowers in
  bunches at branch ends and heavy hard wood that gives yellow dye.
scope: Also called gopherwood, Cladrastis lutea, or Kentucky yellowwood, this small tree stands out for
  its white flowers in bunches at branch ends and its hard wood that gives yellow dye.
examples:
- Cladrastis kentukea bloomed white in May.
- The Cladrastis kentukea gave yellow dye from its wood.
