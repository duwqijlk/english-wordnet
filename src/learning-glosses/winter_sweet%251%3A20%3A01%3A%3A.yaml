simpleMeaning: A shrub from Japan that loses its leaves in the cold months and is grown for its nice-smelling
  yellow flowers
scope: A shrub grown for its scented yellow flowers, not the winter heliotrope plant and not a shrub grown
  only for its leaves.
examples:
- The winter sweet by the gate is full of yellow flowers.
- We grow winter sweet for the scent of its winter flowers.
