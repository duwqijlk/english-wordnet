senseId: 'triangulation%1:04:00::'
synsetId: 00618577-n
simpleMeaning: A way of mapping land by splitting the ground into triangles, measuring one side and the
  angles it makes with the other two, finding the lengths of the rest.
scope: A way of surveying land by dividing it into triangles, not a way of fixing the position of one
  point from the angles to it from two known points, useful in navigation.
examples:
- The surveyors used triangulation to map the valley, dividing it into triangles.
- By triangulation they worked out the width of the river without crossing it.
