simpleMeaning: a person whose job is to sell things in a shop
scope: This is a person who sells things in a shop. It is not a person who sells things from place to
  place, and not the owner of the shop.
examples:
- The salesclerk helped me find a shirt in my size.
- A salesclerk at the shoe shop showed us several pairs to try on.
