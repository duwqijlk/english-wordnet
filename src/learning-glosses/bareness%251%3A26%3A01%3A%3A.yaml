simpleMeaning: A cold, empty feeling about a place, as if nothing living belongs there.
scope: 'Also called desolation, nakedness, and bleakness: a cold, empty feeling about a place, not a room
  with almost nothing in it.'
examples:
- The bareness of the landscape made her shiver.
- A bareness hung over the ruined town, empty and still.
