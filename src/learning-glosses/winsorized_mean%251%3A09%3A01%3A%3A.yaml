senseId: 'winsorized_mean%1:09:01::'
synsetId: 92436724-n
simpleMeaning: A statistics measure of the middle, like the average and median, found by taking the average
  after the highest and lowest values are swapped for the most extreme values left.
scope: A statistics measure of the middle, like the average and the median; the ordinary average is a
  different measure, and so is the median on its own.
examples:
- The Winsorized mean of the numbers was close to the ordinary mean.
- She used a Winsorized mean because a few very high numbers bent the average.
