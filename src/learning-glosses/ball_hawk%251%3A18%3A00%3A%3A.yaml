simpleMeaning: a player on a team who is good at taking the round object from the other side or catching
  it
scope: A team player known for taking or catching the round object, not a player known for scoring and
  not a player who only guards the goal.
examples:
- The ball hawk stole the pass and ran the other way.
- Our ball hawk catches almost every long throw.
