senseId: 'counter_conditioning%1:09:00::'
synsetId: 05767946-n
simpleMeaning: A way of teaching in which a new response that does not fit with the old one is taught
  for a signal that already brings out a learned response
scope: This is teaching a new response that does not fit with the old one for a signal that already brings
  out a learned response; not plain teaching of a first response, and not letting a learned response fade
  away.
examples:
- Counter conditioning helped the dog stop fearing the sound of thunder.
- The therapist used counter conditioning to teach a calm response to the feared thing.
