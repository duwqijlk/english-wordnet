simpleMeaning: a big pot of metal or baked clay, with a handle and a spout, used to hold strong drink,
  usually wine
scope: A big pot with a handle and spout for strong drink, not a cup and not a bottle.
examples:
- He poured wine from the flagon.
- The flagon stood on the table at dinner.
