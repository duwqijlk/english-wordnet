simpleMeaning: Round green parts joined to the stalk at the middle, and pink-red flowers, belong to this
  trailing South American geranium, often grown.
scope: Also called ivy-leaved geranium and hanging geranium, it is the trailing South American geranium,
  often grown, with pink-red flowers and round green parts joined to the stalk at the middle.
examples:
- The ivy geranium trails as it grows.
- Ivy geraniums bear pink-red flowers.
