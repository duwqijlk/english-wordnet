scope: This is a spider orchid that blooms in spring; early spider orchid is another name for it, not
  an orchid that blooms in summer and not an orchid with a narrow lip.
examples:
- Ophrys sphegodes blooms in spring.
- The Ophrys sphegodes flower has a broad brown velvety lip.
