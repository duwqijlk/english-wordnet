simpleMeaning: The process of a thing becoming hard or solid as it cools, dries, or forms crystals
scope: 'Also called set, hardening and curing: a thing becoming hard as it gets cold, dries or forms crystals,
  not a thing becoming soft or liquid.'
examples:
- The solidifying of the glue took about an hour.
- We watched the solidifying of the hot wax as it cooled.
