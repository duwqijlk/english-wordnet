senseId: 'sensitization%1:04:00::'
synsetId: 00830831-n
simpleMeaning: the act of giving a living thing a set of shots so it reacts to a serum, the liquid part
  of blood
scope: The act of giving a living thing a set of shots so it reacts to a serum, also called sensitisation,
  sensitising and sensitizing; not a single shot, and not making it react to a drug.
examples:
- Sensitization of the patient began with small doses of serum.
- The lab used sensitization to make the animals react to the serum.
