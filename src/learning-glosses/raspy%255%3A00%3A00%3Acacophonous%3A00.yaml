simpleMeaning: a voice or sound that comes out rough and broken, hard and sore on the ear
scope: A harsh, grating sound, also called rough, scratchy, rasping, and grating; not a voice that is
  merely low or quiet.
examples:
- His raspy voice was hard to hear over the noise.
- After shouting all day, her raspy throat made every word hurt.
