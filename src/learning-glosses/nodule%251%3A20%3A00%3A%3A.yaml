simpleMeaning: a small round lump that sticks out on a plant
scope: A small round lump on a plant; not a small hard lump in rock or earth, and not a lump that grows
  in the body.
examples:
- The roots of the bean plant were covered in small nodules.
- She cut a leaf stem and found a hard nodule near the base.
