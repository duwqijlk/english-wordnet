simpleMeaning: A person whose job is to carry things.
scope: 'Also called carrier: a person whose job is to carry things, not a messenger with news, not a coffin
  carrier, and not a person holding a cheque or bond.'
examples:
- The bearer took the parcels to every house on the street.
- Bearers carried the water up the hill each morning.
