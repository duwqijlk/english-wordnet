simpleMeaning: A person who leaves a body badly hurt, spoiled in shape, broken, or lame
scope: 'Also called a maimer or a mangler: a person who leaves a body badly hurt, spoiled in shape, broken
  or lame, not a person who hurts by words and not a healer.'
examples:
- The mutilator left his victims badly hurt and lame.
- The cruel mutilator was caught after he crippled his dog.
