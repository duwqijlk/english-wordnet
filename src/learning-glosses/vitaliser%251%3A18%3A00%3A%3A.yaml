simpleMeaning: a person who gives other people new strength, life, and spirit
scope: A person who gives others new life and drive, also called an energiser, an energizer, and a vitalizer;
  not a person who merely cheers others on.
examples:
- The new coach was a vitaliser who lifted the whole team.
- Her energy made her a vitaliser in the office.
