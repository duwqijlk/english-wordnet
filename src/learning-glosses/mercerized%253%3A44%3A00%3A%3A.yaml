simpleMeaning: Cotton thread comes out smaller, brighter, and readier to take dye once it has been soaked
  in a harsh chemical.
scope: Mercerised is another name for this cotton thread, made smaller and brighter by a harsh chemical
  so it takes dye better.
examples:
- The mercerized thread came out smaller and brighter.
- The mercerized cotton took the dye better after its soak in the harsh chemical.
