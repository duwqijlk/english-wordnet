simpleMeaning: No cure is known for this poisonous war gas, made with sulfur stuff, that raises blisters
  and harms the eyes and lungs.
scope: This poisonous war gas is also called blistering agent, dichloroethyl sulfide, mustard gas, and
  sulfur mustard, and no cure is known for it.
examples:
- The mustard agent raised blisters on the skin of those caught in the gas.
- The mustard agent attacked the eyes and lungs of those caught in it.
