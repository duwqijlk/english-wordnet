simpleMeaning: The part of the government that looks after dealings with other countries.
scope: This is the foreign-relations part of the government, not the part that deals with things inside
  the country and not the part that looks after the country's money.
examples:
- The Foreign Office spoke to the government of the other country.
- She works at the Foreign Office and deals with other countries.
