simpleMeaning: a part made of two nitrogen atoms joined twice, with a join on each side to a part made
  of hydrogen and carbon
scope: 'Also called azo radical: a part of two nitrogen atoms with a join on each side, not the azido
  group of three nitrogen atoms and not a single nitrogen atom on its own.'
examples:
- The azo group joins two carbon parts by its two nitrogen atoms.
- In this dye, the azo group sits between two parts made of hydrogen and carbon.
