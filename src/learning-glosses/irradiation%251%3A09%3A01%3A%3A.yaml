simpleMeaning: A learned response comes out when a signal like, but not the same as, the one first used
  is given, in Pavlovian conditioning
scope: In Pavlovian conditioning, this names a learned response set off by a signal like the first one,
  not the spread of signals in the brain and not the way a bright thing looks bigger.
examples:
- After training, irradiation let a like sound bring out the same response.
- Irradiation showed that a sound close to the first one worked just as well.
