simpleMeaning: In law, a right in land or a house that goes back to the giver, or the giver's family,
  when a set time runs out.
scope: In law, an interest in an estate that reverts to the grantor or their heirs at the end of some
  period, not a return to a normal form in genetics.
examples:
- The reversion meant the house would return to her family after her death.
- His will set out the reversion to the original owner's heirs.
