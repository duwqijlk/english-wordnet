simpleMeaning: Ground taken out of growing crops and planted with crops that make it richer, while the
  government pays farmers for the ground they have set aside.
scope: It is ground taken out of growing crops and planted with crops that make it richer.
examples:
- The farmer set aside his land in a soil bank and the government paid him for it.
- Crops that make the ground richer now grow on the soil bank.
