simpleMeaning: A sweet-smelling liquid of oils from plants and strong drink
scope: A sweet-smelling liquid of plant oils and strong drink, also called cologne and cologne water;
  not plain water and not a medicine.
examples:
- She dabbed eau de cologne on her wrists.
- Eau de cologne is a sweet-smelling liquid of plant oils and strong drink.
