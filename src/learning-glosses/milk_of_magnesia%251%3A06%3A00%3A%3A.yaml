simpleMeaning: a white liquid with fine bits in it, made of magnesium hydroxide, a chemical that loosens
  the bowels; in small amounts it also calms acid in the stomach
scope: A white liquid drug that loosens the bowels, not a drink and not a drug for pain.
examples:
- She took a spoonful of milk of magnesia for her upset stomach.
- The doctor said milk of magnesia would help move her bowels.
