senseId: 'survivor_guilt%1:12:00::'
synsetId: 07551825-n
simpleMeaning: those living through a disaster killing many others often feel deep blame, in part for
  doing too little to save them, in part for feeling unworthy beside the dead
scope: This blame is felt by those who lived when others died, not by those who caused the deaths.
examples:
- She felt survivor guilt after the fire.
- He felt survivor guilt after the crash.
