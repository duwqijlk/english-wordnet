simpleMeaning: a thick, deep sea animal, much used as food and caught for fun, found all over the world
  in warm, tropical seas near the shore
scope: A thick, deep sea animal that people eat and catch for fun in warm, tropical seas near the shore,
  not the lean flesh of the animal sold as food.
examples:
- We caught a porgy off the warm coast and cooked it for dinner.
- Anglers come here to catch porgy in the warm coastal waters.
