simpleMeaning: A person who often goes to see new plays on their opening night.
scope: A person who often goes to see new plays on their opening night; not an actor in the play and not
  a person who goes only once.
examples:
- She is a first-nighter who never misses an opening.
- The first-nighter knew every new play in town.
