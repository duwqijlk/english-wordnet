simpleMeaning: This branch of medicine looks after the parts that pass water and the parts that make babies,
  finding what is wrong and treating it.
scope: Urogenital medicine is another name for this branch of medicine, which finds and treats sicknesses
  of the parts that pass water and the parts that make babies.
examples:
- A doctor in urology found what was wrong with the water parts and put it right.
- The urology clinic treats sicknesses of the parts that pass water.
