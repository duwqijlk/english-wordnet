simpleMeaning: a fast-starting disease from a virus that spreads from person to person; it gives fever
  and makes the glands (small soft parts) in front of the ears swell
scope: Also called epidemic parotitis. This is the illness itself, with fever and swollen glands in front
  of the ears; it is not just any swelling of the face.
examples:
- She stayed home from school because she had mumps.
- Mumps made both sides of his face swell up.
