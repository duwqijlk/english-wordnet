simpleMeaning: A mix of cement, sand and water blown onto a surface under strong air pressure.
scope: A mix of cement, sand and water blown onto a surface under strong air pressure, not a chemical
  used in paints and explosives and not the piece of hard stone that makes a spark in an old weapon.
examples:
- Workers sprayed gunite onto the wall of the pool.
- The gunite set hard on the surface within hours.
