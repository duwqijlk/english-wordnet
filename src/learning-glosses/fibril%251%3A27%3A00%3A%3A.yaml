simpleMeaning: A hair-thin strand, natural or man-made.
scope: This sense is also called a strand and a filament, for a hair-thin strand, natural or man-made,
  where a strand is a very thin thread of stuff, from nature or made by folk.
examples:
- The fibril is a hair-thin strand.
- Fibrils are hair-thin strands.
