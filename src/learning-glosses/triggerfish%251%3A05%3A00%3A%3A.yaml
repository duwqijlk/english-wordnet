simpleMeaning: any of many deep, flat-sided warm-sea fish with rough skin and spines in the first fin
  on its back that can stand up
scope: A warm-sea fish with rough skin and spines that stand up, not a flatfish and not a reef fish with
  soft fins.
examples:
- The triggerfish raised the spines on its back fin as the diver came near.
- Triggerfish feed on the reef, their rough skin scraping against the coral.
