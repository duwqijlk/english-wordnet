simpleMeaning: Where a forest has been cut, this medium-sized birch of eastern North America often grows
  again, with white or pale bark and wood of little worth
scope: Also called grey birch, this is a medium-sized birch with white or pale bark and wood of little
  worth, not a birch prized for its timber.
examples:
- The gray birch by the road had pale bark.
- A gray birch often grows again where a forest has been cut.
