simpleMeaning: Living inside the nose spaces of mammals, it is a worm-shaped creature with jointed legs
  and two pairs of hooks beside its mouth.
scope: Also called tongue worm, it is the worm-shaped creature with jointed legs that lives inside the
  nose spaces of mammals.
examples:
- The pentastomid lived in the nose spaces of a mammal.
- Pentastomids live as parasites in the nose spaces of mammals.
