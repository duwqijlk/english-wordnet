simpleMeaning: This snipe of the Old World is bigger and darker than the whole snipe.
scope: Also called great snipe and woodcock snipe; a larger, darker snipe of the Old World, not the common
  snipe of Eurasia and Africa.
examples:
- Gallinago media is a large snipe that breeds in the marshes of northern Europe.
- The Gallinago media we saw was darker than the whole snipe beside it.
