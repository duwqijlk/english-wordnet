simpleMeaning: A sum paid to the state on what a person buys, worked out from the price and taken straight
  from the buyer
scope: A sum paid to the state on what a person buys, worked out from the price and taken straight from
  the buyer; not a sum charged on what a person earns and not a charge for a service.
examples:
- The nuisance tax added a few pence to the price of the ticket.
- Shoppers pay the nuisance tax at the till.
