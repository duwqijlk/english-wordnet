schema: oewn-learning-gloss-v2
senseId: 'encapsulate%2:35:00::'
synsetId: 01590905-v
simpleMeaning: to put something in a capsule (a small case that holds things) or in another small thing
  that holds it
scope: This sense is about putting a thing inside a small case that holds it; it is not about covering
  a thing loosely or just placing it near a case.
examples:
- The medicine is encapsulated in a tiny capsule so it is easy to swallow.
- They encapsulated the seeds in small plastic balls to keep them dry.
