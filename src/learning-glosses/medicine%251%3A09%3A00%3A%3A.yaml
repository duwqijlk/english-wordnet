simpleMeaning: the areas of science that treat illness using methods other than surgery.
scope: This is not a drug or other substance taken to treat illness, and not the practice of surgery;
  it names the fields of science that treat illness without operations.
examples:
- He specializes in internal medicine.
- Modern medicine offers many treatments that avoid surgery.
