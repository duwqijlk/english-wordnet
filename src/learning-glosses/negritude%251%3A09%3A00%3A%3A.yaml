simpleMeaning: A way of thinking that holds Black ways of life to be free-standing and good in their own
  right, and a claim for the worth of African ways of life
scope: An ideological position on Black culture and the African cultural heritage, holding Black ways
  of life to be good in their own right.
examples:
- Negritude shaped the poems he wrote about his home.
- She read about Negritude in a book on African ideas.
