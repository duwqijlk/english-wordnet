simpleMeaning: A thin fold of skin joining the toes of some swimming birds and mammals.
scope: This is the skin between an animal's toes, not woven cloth and not the internet.
examples:
- A duck's foot has a web of skin between the toes.
- An otter's paws are joined by a web of skin.
