simpleMeaning: In the study of disease, dead flesh that dries out and turns dark brown when the blood
  tubes are blocked.
scope: Cold gangrene, dry gangrene and mummification are other names for this gangrene where blocked blood
  tubes dry the dead flesh dark brown.
examples:
- Mumification necrosis left the dead flesh dry and dark brown.
- Mumification necrosis comes where the blood tubes are blocked.
