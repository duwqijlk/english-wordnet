senseId: 'trip%1:04:01::'
synsetId: 00077383-n
simpleMeaning: An accidental mistake or slip that causes embarrassment.
scope: This is a slip in what someone says or does that leaves them embarrassed; it is not a stumble that
  nearly makes you fall, not a journey, and not the catch that sets a mechanism going.
examples:
- His only trip during the speech was a mangled name near the end.
- She recovered quickly after a trip over the wording of the oath.
