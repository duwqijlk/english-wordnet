simpleMeaning: a word that does not change its form and is used to join words, groups of words, parts
  of a sentence, or whole sentences
scope: 'Also called conjunction, conjunctive, and continuative: a joining word that does not change its
  form. It is not the describing sense about joining things, and not a thing or tool that joins parts.'
examples:
- '''And'' is a connective that joins two short sentences into one.'
- '''But'' works as a connective between the two parts of the sentence.'
