simpleMeaning: When one thing goes up, the other goes down, and the number that sums up their link lies
  between 0 and -1
scope: A link in which one thing grows as the other shrinks, also called a negative correlation; not a
  link in which both grow together and not no link at all.
examples:
- There is an indirect correlation between the price of a good and how much of it people buy.
- An indirect correlation shows up when more rain means fewer hours of sun.
