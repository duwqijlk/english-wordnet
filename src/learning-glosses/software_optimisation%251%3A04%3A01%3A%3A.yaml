simpleMeaning: the work of changing a computer program so that part of it runs better or uses less
scope: The work of changing a computer program so part of it runs better or uses less, also called software
  optimization, program optimisation and program optimization; not writing a new program and not fixing
  a fault in one.
examples:
- Software optimisation cut the time the program took to load.
- After software optimisation, the app used less memory on her phone.
