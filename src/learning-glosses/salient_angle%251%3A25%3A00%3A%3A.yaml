simpleMeaning: Inside a many-sided shape, a corner of less than 180 degrees is one that sticks out.
scope: A corner that sticks out is a salient angle when it sits inside a many-sided shape and measures
  less than 180 degrees.
examples:
- A salient angle jutted out from the side of the shape.
- The drawing showed a salient angle of less than 180 degrees.
