simpleMeaning: a picture that shows how a rising and falling signal changes over time, made by marking
  its values against time
scope: 'Also called waveform and wave form: a drawing of how a rising and falling signal changes with
  time, not a picture of sea waves and not a chart of air heat.'
examples:
- The book printed the wave shape of the sound on one page.
- She drew the wave shape to show how the signal rose and fell over time.
