simpleMeaning: Of high cold lands round the far north, this low bush drops its leaves and turns bright
  red in autumn, with dark berries, some shading to blue.
scope: Also called alpine bearberry, this is a low bush that drops its leaves and turns bright red in
  autumn, with dark berries, some shading to blue, set apart from other low bushes by its autumn colour
  and its berries.
examples:
- The black bearberry turned bright red in autumn.
- Black bearberry grows in cold high lands round the far north.
