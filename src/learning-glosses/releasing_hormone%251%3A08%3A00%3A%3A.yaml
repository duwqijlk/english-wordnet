simpleMeaning: One of a set of chemical messengers the hypothalamus makes and sends through the blood
  to the pituitary, where each one tells it to put out a particular substance.
scope: This is the hypothalamic messenger that prompts the pituitary, not the broader substance sense
  of the term and not a pituitary secretion.
examples:
- The blood carried a releasing hormone from the hypothalamus to the pituitary.
- Researchers blocked one releasing hormone to see which pituitary signal disappeared.
