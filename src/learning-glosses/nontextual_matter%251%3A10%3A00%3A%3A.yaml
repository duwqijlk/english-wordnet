schema: oewn-learning-gloss-v2
senseId: 'nontextual_matter%1:10:00::'
synsetId: 07011408-n
simpleMeaning: Pictures and other images printed in a book, magazine or similar work
scope: Pictures and other images in print, with art, artwork and graphics as other names for this sense;
  not the words of the book, and not a picture shown on a screen.
examples:
- The publisher was in charge of all the nontextual matter in the book.
- The book's nontextual matter includes maps and drawings.
