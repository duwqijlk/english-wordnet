senseId: 'commensal%3:01:00::'
synsetId: 02711528-a
simpleMeaning: Living close to another living thing in a way that helps one of them and leaves the other
  unharmed
scope: Living close to another living thing in a way that helps one of them and leaves the other unharmed;
  not a parasite, which harms its host, and not a partnership where both gain.
examples:
- The barnacle is commensal on the whale.
- Commensal fish live close to sharks without harming them.
