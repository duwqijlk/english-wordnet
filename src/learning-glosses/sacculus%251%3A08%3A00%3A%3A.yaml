simpleMeaning: a small bag-like pouch, most of all the smaller of the two little chambers of the inner
  ear
scope: 'Also called a saccule: a small bag-like pouch in the inner ear, not a large pouch in the body
  and not the larger of the two ear chambers.'
examples:
- The sacculus sits beside its larger partner chamber in the inner ear.
- In the diagram, the sacculus was marked as the smaller chamber.
