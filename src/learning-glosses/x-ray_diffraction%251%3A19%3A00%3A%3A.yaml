simpleMeaning: The way a beam of X rays is spread out by the atoms of a crystal, and the spread-out pattern
  shows how the crystal is built
scope: A way of learning how a crystal is built from the pattern made when X rays are spread out by its
  atoms; not the tube that makes the rays.
examples:
- X-ray diffraction showed the structure of the crystal.
- Scientists use X-ray diffraction to study crystals.
