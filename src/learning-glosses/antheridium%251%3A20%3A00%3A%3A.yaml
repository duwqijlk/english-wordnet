simpleMeaning: the male part of a plant that makes spores; it makes tiny swimming male cells, like the
  anther in a flower
scope: The male part of a spore-making plant, not the anther itself and not the female part.
examples:
- The antheridium of the fern releases swimming male cells.
- In mosses, the antheridium makes the male cells that swim to the egg.
