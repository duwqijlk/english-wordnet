simpleMeaning: a drug that stops a person feeling things in the body for a short time
scope: This is a drug that stops feeling in the body for a short time; anaesthetic, anesthetic and anaesthetic
  agent are other names for it, not a plain painkiller that only eases pain.
examples:
- The doctor gave the patient an anesthetic agent before the operation.
- An anesthetic agent stopped all feeling in her arm for an hour.
