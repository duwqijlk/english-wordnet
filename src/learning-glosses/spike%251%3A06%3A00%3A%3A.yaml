senseId: 'spike%1:06:00::'
synsetId: 04282780-n
simpleMeaning: a sharp point fixed to the bottom of a shoe worn by a person who plays sport, to help them
  grip the ground
scope: One sharp point on the bottom of a sports shoe, not the whole shoe with such points, and not a
  sharp tool or a fence point.
examples:
- A spike on his running shoe dug into the track.
- Each spike on her football boots helped her grip the wet grass.
