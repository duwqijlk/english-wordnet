simpleMeaning: to capture a place by climbing its walls with ladders during an attack.
scope: This is not ordinary climbing for sport or travel, and not adjusting something to a standard; it
  means taking a defended place by ladder assault.
examples:
- The attackers scaled the fortress walls with ladders before dawn.
- Medieval armies sometimes scaled city walls to surprise the defenders.
