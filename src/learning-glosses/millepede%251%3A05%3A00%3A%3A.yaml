simpleMeaning: A tube-shaped body of 20 to 100 or more parts, most with two pairs of legs, marks this
  plant-eating jointed animal with no poison, one of many kinds.
scope: Also called millipede and milliped, it is one of many kinds of plant-eating jointed animal with
  no poison.
examples:
- The millepede has a tube-shaped body with many parts.
- A millepede eats plants and has no poison.
