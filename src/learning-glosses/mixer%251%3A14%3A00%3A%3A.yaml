simpleMeaning: a party held so that people can meet each other and spend time together in a friendly way
scope: 'Also called a social or a sociable: a friendly party for meeting people, not the kitchen tool,
  not a drink mixed with alcohol, and not sound equipment.'
examples:
- The college held a mixer so new students could meet each other.
- At the mixer, she talked with people from other classes.
