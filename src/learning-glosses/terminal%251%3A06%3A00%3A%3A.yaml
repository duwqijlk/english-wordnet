simpleMeaning: a place where buses, trains, or other transport stop to take on or let off people or goods
scope: 'Also called a depot: a place where transport stops to take on or let off people or goods, not
  a computer screen and keyboard, not a battery contact, and not the end of a route.'
examples:
- We met at the bus terminal before the trip started.
- The new terminal can take hundreds of travellers every hour.
