simpleMeaning: a person who gets into a competition by giving false facts or making a false claim
scope: A person in a game or race under a false claim; not a winning throw in horseshoes and not a person
  who rings church bells.
examples:
- The team was thrown out when its star player turned out to be a ringer.
- He entered the local race as a ringer, using a false name.
