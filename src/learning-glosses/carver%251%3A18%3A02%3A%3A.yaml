simpleMeaning: a person who makes wooden panels with designs cut into them
scope: This is a person who makes panels from wood with designs, also called woodcarver, not a person
  who cuts meat at a meal.
examples:
- The carver made a wooden panel with flowers cut into it.
- A skilled carver was asked to make new panels for the church door.
