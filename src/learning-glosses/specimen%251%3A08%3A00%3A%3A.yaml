simpleMeaning: a small sample of tissue, blood, or urine taken from the body to be tested for what is
  wrong
scope: A small sample taken from the body for testing, not a piece of something shown as an example and
  not a small bit of a plant or animal kept for study.
examples:
- The nurse took a specimen of the man's urine for testing.
- They sent a specimen of the patient's blood to the laboratory.
