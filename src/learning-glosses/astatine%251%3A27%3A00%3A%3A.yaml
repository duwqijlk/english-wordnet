simpleMeaning: A very shaky radioactive element, the heaviest of the halogen group, that forms when uranium
  and thorium break down
scope: This is a very shaky radioactive element, the heaviest of the halogen group, not a lighter halogen
  such as chlorine and not a steady element; At and atomic number 85 are other names for this sense.
examples:
- Astatine breaks down so fast that little of it is ever found.
- Scientists study astatine in tiny amounts.
