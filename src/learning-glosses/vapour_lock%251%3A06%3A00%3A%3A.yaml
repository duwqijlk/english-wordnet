synsetId: 04528420-n
simpleMeaning: a pipe can be stopped by gas bubbles, especially in hot weather, when fuel in the gas line
  boils and the bubbles keep petrol from the engine's fuel mixer
scope: 'Also called vapor lock: gas bubbles that stop flow in a pipe, not a leak and not a block made
  by dirt in the pipe.'
examples:
- Vapour lock kept the petrol from the engine on the hottest day.
- The car would not start because of vapour lock in the fuel line.
