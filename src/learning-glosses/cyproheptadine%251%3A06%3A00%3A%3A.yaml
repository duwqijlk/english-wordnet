simpleMeaning: a drug that blocks the body's response to things that cause allergy, sold as Periactin,
  and used to treat some allergic reactions
scope: A drug that treats some allergic reactions, not a drug for pain and not a drug for infection.
examples:
- The doctor gave her cyproheptadine for her itchy rash.
- Cyproheptadine helped stop his sneezing after the allergy flared up.
