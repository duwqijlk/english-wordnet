simpleMeaning: Any mouse of the group Apodemus that is out at night and lives in woods, open ground and
  gardens of the Old World.
scope: This is a mouse of the Old World that is out at night, also called fieldmouse.
examples:
- A field mouse ran across the garden at night.
- The field mouse lives in woods and gardens.
