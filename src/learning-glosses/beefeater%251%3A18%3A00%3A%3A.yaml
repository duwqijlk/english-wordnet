simpleMeaning: an officer in the bodyguard of the king or queen of Britain, dressed for ceremony
scope: 'Also called a yeoman: an officer who guards the king or queen of Britain, not a soldier in battle
  and not a guard at a prison.'
examples:
- A beefeater stood at the gate of the Tower in his red uniform.
- The beefeater told us about the jewels kept at the Tower.
