simpleMeaning: a way a person is already set to act or feel before a thing happens
scope: This is a set way to act or feel that a person already has before a thing happens. Not the sense
  about a set way of taking in what people say.
examples:
- He has a predisposition to worry before a test.
- Her predisposition to help others showed when a stranger fell.
