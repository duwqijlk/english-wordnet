senseId: 'comparative_negligence%1:04:00::'
synsetId: 00740930-n
simpleMeaning: In law, the money paid to the person bringing the case is cut by that person's share of
  the carelessness, shared with the person it is brought against.
scope: This is the law sense where carelessness is shared between the two sides in a case, not carelessness
  on its own.
examples:
- The comparative negligence rule shared the blame between the two sides.
- Under comparative negligence, the money paid was cut by the same share.
