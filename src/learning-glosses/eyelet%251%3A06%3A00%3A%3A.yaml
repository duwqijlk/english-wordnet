senseId: 'eyelet%1:06:00::'
synsetId: 03313798-n
simpleMeaning: A small hole, usually round with neat edges, in cloth or leather, for a cord, hook, or
  bar to pass through.
scope: A small hole in cloth or leather, also called an eyehole, usually round with neat edges, for a
  cord, hook, or bar to pass through; not cloth covered with small holes with finely stitched edges that
  form a pretty pattern, and not the metal ring put in such a hole so cords or lines can be fastened to
  it.
examples:
- She threaded the lace through the eyelet in the shoe.
- The eyelet in the sail was torn and needed stitching.
