simpleMeaning: A metal frame that slopes at the front of a train and pushes things off the track
scope: A sloping metal frame at the front of a train that clears the track, also called pilot and buffer;
  not a soft pad that takes a blow and not the low guard by a fire.
examples:
- The fender at the front of the engine pushed the fallen branch off the track.
- Snow piled up against the fender as the train moved on.
