simpleMeaning: in a way that matters a lot, or by an amount that matters a lot
scope: This sense covers a way that matters a lot and also an amount that matters a lot; the close other
  sense covers only a way.
examples:
- She spoke importantly in the meeting, and everyone listened to her ideas.
- His early work contributed importantly to the team's success, more than any other person's work.
