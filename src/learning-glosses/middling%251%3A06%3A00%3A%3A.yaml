simpleMeaning: Any goods of middle quality or size, especially coarse bits of ground wheat mixed with
  bran (the outer parts of the grain)
scope: A noun for goods of middle quality or size, especially ground wheat parts mixed with bran; it is
  not the describing word that means fairly good.
examples:
- The mill sold the middling to farmers as animal feed.
- This sack holds middling, the coarse part left from grinding wheat.
