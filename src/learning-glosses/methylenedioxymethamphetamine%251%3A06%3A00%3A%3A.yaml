simpleMeaning: A speed drug, kin to mescaline and amphetamine, taken by law-breakers for joy and visions;
  once used in mind-cure, but made unlawful in the United States in 1985.
scope: A stimulant drug chemically related to mescaline and amphetamine, used illicitly for its euphoric
  and hallucinogenic effects; formerly used in psychotherapy but in 1985 declared illegal in the United
  States. Also called MDMA.
examples:
- Their methylenedioxymethamphetamine was seized at dawn.
- The methylenedioxymethamphetamine was banned in 1985.
