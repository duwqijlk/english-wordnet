simpleMeaning: a part near the base of a bird's tail that makes oil, found in most birds
scope: 'Also called preen gland: a part that makes oil at the base of a bird''s tail, not a part that
  makes feathers and not a part inside the body.'
examples:
- Most birds have a uropygial gland at the base of the tail.
- The bird spread oil from its uropygial gland over its feathers.
