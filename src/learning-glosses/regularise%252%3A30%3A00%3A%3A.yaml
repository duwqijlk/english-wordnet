simpleMeaning: To make a thing more even or steady
scope: To make a thing more even or steady, also called regularize; not to leave a thing uneven and not
  to force it to follow rules.
examples:
- Doctors use a pace maker to regularise the heart beat.
- The town plans to regularise parking on the high street.
