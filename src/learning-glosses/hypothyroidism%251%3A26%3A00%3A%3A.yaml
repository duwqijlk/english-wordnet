simpleMeaning: This disorder of the glands comes when the gland in the front of the neck works too slowly
  and makes too little of its hormones.
scope: This is a neck gland that works too slowly, not one that works too fast.
examples:
- The doctor said her hypothyroidism came from too little hormone from the gland in her neck.
- His hypothyroidism meant the gland in the front of his neck worked too slowly.
