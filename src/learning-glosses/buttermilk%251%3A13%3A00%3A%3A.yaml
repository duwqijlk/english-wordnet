simpleMeaning: the liquid left after churning sour raw milk into butter, or pasteurized milk that has
  been soured by adding a culture
scope: A sour milk drink or cooking liquid, not fresh milk and not cream.
examples:
- She poured buttermilk into the pancake batter.
- The buttermilk left over from churning gave the bread a tangy taste.
