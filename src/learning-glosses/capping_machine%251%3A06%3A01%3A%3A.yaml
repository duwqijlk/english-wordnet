simpleMeaning: a tool, worked by hand or on its own, that puts tight tops on bottles
scope: 'Also called bottle capper: a tool that puts tops on bottles, not a tool that fills bottles and
  not a hand tool that opens them.'
examples:
- The capping machine sealed fifty bottles in an hour.
- She fed the empty bottles into the capping machine.
