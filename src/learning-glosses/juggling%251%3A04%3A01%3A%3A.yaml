simpleMeaning: The act of moving things around to leave people with a false idea of what is true
scope: The act of moving things around to leave people with a false idea of what is true; juggle is another
  name for this sense; not the act of throwing and catching balls in the air.
examples:
- The juggling of the figures hid the true state of the company.
- His juggling with the dates made the report hard to trust.
