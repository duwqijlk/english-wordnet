simpleMeaning: a plant part, made after pollen joins with it, that holds a young plant and food for it
  in a hard coat and can grow into a new plant
scope: A plant part, made after pollen joins with it, that holds a young plant and food for it in a hard
  coat and can grow into a new plant, not the white fluid from a man's body and not putting bits into
  clouds to make rain.
examples:
- Plant the seeds in spring, and water them well.
- Each seed holds a young plant inside its coat.
