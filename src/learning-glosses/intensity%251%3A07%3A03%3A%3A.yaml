simpleMeaning: the amount of energy that sound, light, or other radiation (waves of energy sent through
  space) carries
scope: 'Also called strength: this is about how much energy sound or light carries, not about how strong
  a feeling or action is in general, and not about how pure and bright a colour is.'
examples:
- He turned down the intensity of the sound.
- They measured the intensity of the light from the station.
