simpleMeaning: 'A metal catch for a door or lid: a metal plate on a hinge that fits over a metal loop
  and is locked with a pin or a padlock'
scope: This is the metal catch itself for a door or lid, not the act of locking with it and not a small
  lock on its own.
examples:
- She lifted the hasp and opened the box.
- Lock the hasp with a padlock before you leave.
