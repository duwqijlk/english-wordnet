simpleMeaning: used of the animals with no backbones that belong to Arthropoda, the group with jointed
  legs and a hard outer shell
scope: 'Also called arthropodal and arthropodous: used of animals with no backbones that belong to Arthropoda,
  not of animals with backbones and not of a worm or a snail.'
examples:
- The arthropodan body plan includes jointed legs and a hard outer shell.
- Beetles and lobsters are arthropodan animals.
