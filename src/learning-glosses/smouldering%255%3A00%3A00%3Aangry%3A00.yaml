senseId: smouldering%5:00:00:angry:00
synsetId: 00116869-s
simpleMeaning: showing anger that is held back only just, so it can still be seen
scope: Also called smoldering. This is about anger that is only just held back, not about a fire burning
  slowly with no flame.
examples:
- Her voice stayed calm, but her eyes were smouldering with anger.
- He gave a smouldering look and said nothing.
