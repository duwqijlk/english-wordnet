simpleMeaning: Soap, paper, aluminium and many sodium compounds are made with this strong chemical that
  burns.
scope: Also called sodium hydroxide, this is the strong chemical used to make soap, paper, aluminium and
  many sodium compounds, not the soap itself.
examples:
- Caustic soda is used to make soap, paper and aluminium.
- Caustic soda can burn the skin on contact.
