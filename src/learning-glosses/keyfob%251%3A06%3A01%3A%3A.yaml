simpleMeaning: A small thing fixed to a key ring or key chain and made to sit well in the hand
scope: This is a small thing fixed to a key ring or key chain and made to sit well in the hand; key fob
  is another name for this sense, not the ring itself and not a tag with writing on it.
examples:
- His keyfob hangs from his key ring.
- She holds her keyfob in her hand as she looks for her keys.
