simpleMeaning: a male devil in old belief, said to lie on sleeping people and to mate with sleeping women
scope: A male devil in old belief who lies on sleepers, not a dream itself and not a female devil.
examples:
- In the old tale, an incubus came to her in the night.
- They blamed the incubus for her troubled sleep.
