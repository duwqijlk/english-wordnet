simpleMeaning: in a helpful way that fits in with what another person wants
scope: Done in a willing way to suit someone else, not done with reluctance and not done only to suit
  yourself.
examples:
- Accommodatingly, he lowered his voice so the baby could sleep.
- She accommodatingly moved her chair to make room for us.
