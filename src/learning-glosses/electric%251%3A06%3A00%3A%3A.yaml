simpleMeaning: A car that runs on power stored in a battery instead of on petrol or diesel.
scope: This is the car itself; it is not the adjective for equipment that uses current, and it is not
  a mood of tense excitement.
examples:
- She traded her old diesel for an electric.
- The new electric can travel 300 miles on one charge.
