simpleMeaning: In psychology, being ready for a short time to act or answer in one set way
scope: In psychology, a short-lived readiness to react in one set way, also called set; not being ready
  in general and not a plan.
examples:
- The test showed a readiness in the subjects to solve problems the familiar way.
- Her readiness to respond in that one way came from the training.
