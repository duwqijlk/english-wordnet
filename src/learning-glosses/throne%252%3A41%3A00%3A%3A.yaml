simpleMeaning: to put a king or queen in place as ruler, in a ceremony where they take the special chair
scope: This is putting a king or queen in place as ruler; it is not sitting as a ruler yourself and not
  the special chair itself.
examples:
- They throned the new king in the cathedral.
- The prince was throned after his father died.
