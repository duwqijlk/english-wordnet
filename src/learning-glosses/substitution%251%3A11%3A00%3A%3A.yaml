synsetId: 07458361-n
simpleMeaning: a time when one thing is put in the place of another thing
scope: This is the event of one thing taking the place of another, not the new thing itself and not a
  person who takes another player's place in a game.
examples:
- The substitution of the old pipe with a new one took an hour.
- A substitution was made when the broken chair was replaced with a good one.
