simpleMeaning: A wild lily of dry northwest North America, from British Columbia to California, east of
  the Cascades, with clusters of one to three lilac flowers like umbrellas on thick stems.
scope: Also called sagebrush mariposa tulip; a wild lily of dry northwestern North America, not a garden
  lily and not another mariposa.
examples:
- Calochortus macrocarpus grows east of the Cascades.
- Calochortus macrocarpus bears lilac flowers in loose clusters.
