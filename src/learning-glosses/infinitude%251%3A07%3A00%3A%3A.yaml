simpleMeaning: The fact of having no end or limit, so that it goes on without stopping
scope: 'Also called boundlessness, infiniteness, and limitlessness: having no end or limit, not a fixed
  amount and not a large but counted number.'
examples:
- The infinitude of the stars amazed the early sailors.
- She felt the infinitude of time stretching before her.
