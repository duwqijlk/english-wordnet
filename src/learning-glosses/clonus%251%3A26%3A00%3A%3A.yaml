simpleMeaning: A fit in which the muscles tighten and loosen by turns, again and again.
scope: A fit in which the muscles tighten and loosen by turns, again and again; not a single cramp and
  not a steady shaking.
examples:
- The patient's leg showed clonus after the injury.
- Clonus made his ankle jerk again and again.
