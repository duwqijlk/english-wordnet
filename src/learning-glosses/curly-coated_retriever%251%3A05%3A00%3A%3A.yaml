simpleMeaning: Game from land or water is brought back by this English breed of dog, with a black or liver-coloured
  coat of tight rings of hair.
scope: This English breed of dog has a tight-ringed coat and brings back game, not a smooth-coated breed
  of dog.
examples:
- The curly-coated retriever brought the game back from the water.
- Her curly-coated retriever has a black coat of tight rings of hair.
