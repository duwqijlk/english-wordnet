simpleMeaning: Shares in a firm that stand for more worth than the firm truly has, because the firm's
  total worth is less than the money put into it.
scope: Shares that claim more worth than the firm truly has; not shares in a firm doing well and not money
  owed by the firm.
examples:
- He warned that the watered stock was worth far less than its price.
- The firm sold watered stock after it had lost much of its worth.
