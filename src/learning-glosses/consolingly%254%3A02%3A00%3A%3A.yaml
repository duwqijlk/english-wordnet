simpleMeaning: in a way that helps someone feel better and less sad or worried
scope: This is about speaking or acting to make a sad or worried person feel better, also called comfortingly;
  it is not the sad feeling itself.
examples:
- She spoke consolingly to her crying son.
- He put his arm around her and said consolingly, 'It will be all right.'
