simpleMeaning: one of a pair of feelers on an insect's head or a crab's, able to move and usually able
  to sense touch and taste
scope: A feeler on the head of an insect or a crab, not a radio device that sends signals and not a keen
  sense for what people think.
examples:
- The ant waved its antennae as it walked.
- The crab's antenna felt the food in front of it.
