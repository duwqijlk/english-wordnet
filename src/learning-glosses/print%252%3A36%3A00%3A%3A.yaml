simpleMeaning: to make one or more copies of something by putting words or pictures onto paper
scope: The act of making copies of words or pictures on paper; not writing letters by hand, not one picture
  on its own, and not the words or pictures themselves.
examples:
- Please print fifty copies of this notice for the meeting.
- The shop can print the whole book in one day.
