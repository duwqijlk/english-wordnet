senseId: noncommittal%5:00:00:indefinite:00
synsetId: 00705889-s
simpleMeaning: refusing to promise that you will follow one plan or hold one view, or anything like them
scope: This means not giving a clear answer or promise about a plan or a view, not being uninterested
  and not being against it.
examples:
- Asked if she would take the job, she gave a noncommittal answer.
- He was noncommittal about the plan and said he needed more time.
