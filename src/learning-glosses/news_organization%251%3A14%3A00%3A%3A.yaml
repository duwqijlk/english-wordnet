simpleMeaning: Papers get reports of what has happened from this office, which gathers them and sends
  them out by electronic means
scope: This office gathers reports of what has happened for papers and sends them out by electronic means;
  news agency, news organisation, press agency and press association are other names for it, not a single
  television station and not a single reporter.
examples:
- The news organization sent its reports to papers across the country.
- She works for a news organization that gathers stories from around the world.
