simpleMeaning: the start of a wearing-away or damaging process, for example one caused by a chemical substance.
scope: This is not a sudden fit of illness or a physical assault, but the start of chemical damage or
  decay.
examples:
- Engineers inspect the pipelines regularly for any sign of chemical attack.
- A protective coating shields the steel from attack by salt water.
