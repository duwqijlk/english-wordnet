simpleMeaning: In music, the section of a piece or movement, especially in sonata form, where the main
  themes are worked out and elaborated.
scope: This is the musical section where themes are worked out, not the act of improving something, the
  process of passing to a more advanced stage, biological growth, a recent event, making land or water
  more productive, a developed district, a state of improvement such as in the opening of a chess game,
  or the processing of photographic film.
examples:
- The development begins after the exposition and takes the main theme through several new keys.
- In the development, the composer breaks the melody into fragments and combines them in new ways.
