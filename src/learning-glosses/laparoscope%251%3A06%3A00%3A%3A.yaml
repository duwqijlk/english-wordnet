simpleMeaning: a thin tube with a light at the end, put through a cut in the belly wall to look at the
  organs inside or to do small surgery
scope: A thin tube put through the belly wall to look at the organs inside, not a tool for open surgery
  and not a tube put in through the mouth.
examples:
- The doctor used a laparoscope to look inside the patient's belly.
- A laparoscope lets doctors do small surgery through a tiny cut.
