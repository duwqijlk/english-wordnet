simpleMeaning: An open-chest operation that links a length of vessel from the aorta to a heart artery
  beyond the clogged part, restoring the heart's blood supply.
scope: Another name for the same open-chest operation also called coronary bypass or coronary artery bypass
  graft, not a stent placement or valve repair.
examples:
- Coronary bypass surgery can relieve chest pain caused by narrowed arteries.
- He was back at work two months after coronary bypass surgery.
