simpleMeaning: A heavy poisonous silvery-white radioactive metal, uranium, found in many kinds of atom
  (isotopes), used to fuel nuclear power and to make nuclear arms
scope: This is a heavy poisonous radioactive metal, not a light metal and not a metal safe to handle;
  U and uranium are other names for this sense.
examples:
- Atomic number 92 is the metal uranium.
- Uranium, atomic number 92, is used for nuclear fuels.
