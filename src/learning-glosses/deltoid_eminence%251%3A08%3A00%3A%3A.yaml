simpleMeaning: A bump on the outer side of the upper arm bone where the shoulder muscle joins it
scope: A bump on the outside of the upper arm bone where the shoulder muscle joins, also called deltoid
  tuberosity; not the muscle itself and not the whole arm bone.
examples:
- The deltoid eminence is where the shoulder muscle joins the arm bone.
- You can feel the deltoid eminence on the outer arm.
