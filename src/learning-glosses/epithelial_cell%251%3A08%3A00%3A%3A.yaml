simpleMeaning: one of the tiny living parts packed close together to form the thin covering that lines
  the inside or covers the outside of the body
scope: One of the tiny parts that make up a body covering, not the covering as a whole and not a part
  of the blood.
examples:
- An epithelial cell from the lining of the cheek was seen under the microscope.
- Epithelial cells pack together to form the skin on the surface of the body.
