simpleMeaning: an organ with no duct at the base of the neck that makes white blood cells and helps fight
  off illness; it shrinks with age
scope: Also called the thymus; it sits at the base of the neck and helps the body fight illness, not the
  thyroid gland and not a lymph node.
examples:
- The thymus gland shrinks as we age.
- Doctors found the thymus gland swollen in the child.
