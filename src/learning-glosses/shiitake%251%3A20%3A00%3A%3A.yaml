simpleMeaning: Its golden or dark brown to blackish cap can be eaten, but the stem of this east Asian
  mushroom cannot.
scope: Golden oak mushroom and shiitake mushroom are other names for this east Asian mushroom whose cap
  can be eaten but whose stem cannot.
examples:
- The cook sliced shiitake into the soup and left the stems out.
- People in east Asia eat shiitake, a mushroom with a golden or dark brown cap.
