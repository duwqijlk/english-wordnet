simpleMeaning: When good things happen one after another, a person is in a state of good fortune
scope: Also called good fortune and good luck, this is the state of having good things happen, not skill
  and not a single lucky break.
examples:
- Her luckiness showed when she won three prizes in a row.
- His luckiness kept him out of trouble all year.
