simpleMeaning: A wild, fast rush of water, or of some other liquid.
scope: A wild, fast rush of water or other liquid, not a slow river and not a sudden burst from a pipe.
examples:
- A torrent of rainwater rushed down the street.
- The torrent carried away the bridge.
