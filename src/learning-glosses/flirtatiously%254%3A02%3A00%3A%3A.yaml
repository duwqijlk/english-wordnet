simpleMeaning: in a playful way that shows you like someone and hope they like you too
scope: This describes the way someone speaks, smiles, or acts when they playfully show they like someone;
  it is not a serious or cold way of acting.
examples:
- She smiled flirtatiously at him across the table.
- He spoke flirtatiously to the woman he had just met at the party.
