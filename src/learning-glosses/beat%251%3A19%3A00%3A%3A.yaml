simpleMeaning: One pulse of the oscillation formed when two waves of unlike frequency are added; its frequency
  equals the gap between the two.
scope: This is the physics pulse made by combining waves, not a musical rhythm, a police patrol area,
  or an act of hitting.
examples:
- The two tuning forks produced slow beats that rose and fell.
- The beats grew faster as the two frequencies moved further apart.
