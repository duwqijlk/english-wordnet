simpleMeaning: a group of separate organizations that join together to reduce competition by controlling
  how a product or service is made and supplied
scope: This is a business arrangement, not a feeling of confidence between people.
examples:
- The government broke up the oil trust into smaller competing companies.
- In the early 1900s, several railroads combined into a trust to fix prices.
