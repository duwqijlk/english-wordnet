simpleMeaning: a person who uses the hand most people write with better than the other hand
scope: A person who uses the hand most people write with better than the other hand; right-hander and
  righthander are other names for this sense, not a pitcher in baseball and not a person who uses both
  hands well.
examples:
- She is a right hander, so she writes with the hand most people write with.
- As a right hander, he throws with the hand most people write with and catches with the other hand.
