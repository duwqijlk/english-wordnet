simpleMeaning: In rugby, at a scrum, the player in the middle of the front row, who tries to get the ball
  with a foot
scope: The rugby player in the middle of the front row of a scrum, not a golfer whose shots curve left
  and not a prostitute who walks the streets to find customers.
examples:
- The hooker won the ball with a quick flick of his foot.
- Our hooker was pushed back in the scrum.
