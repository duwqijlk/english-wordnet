simpleMeaning: Two people who are wed are each free to have sex with other people, with no guilt or jealousy
  from the other one
scope: Two people who are wed, each free to have sex with other people without guilt or jealousy from
  the other; not a marriage where both stay faithful to each other and not a marriage that has ended.
examples:
- They chose an open marriage so each could see other people.
- In an open marriage, neither partner is jealous of the other's lovers.
