simpleMeaning: The usual beat of the heart when it is run by the small knot of tissue joining the upper
  and lower parts.
scope: The usual beat of the heart when it is run by the small knot of tissue joining the upper and lower
  parts, with atrioventricular nodal rhythm as another name for this sense, not a fast beat caused by
  exercise and not an uneven beat caused by sickness.
examples:
- The doctor said her heart was in nodal rhythm.
- Nodal rhythm is the usual beat when the node runs the heart.
