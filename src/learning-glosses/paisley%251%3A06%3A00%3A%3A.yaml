simpleMeaning: a soft wool cloth with a pattern in many colours, made of curved shapes that turn round
  in swirls
scope: This is the soft wool cloth with the curved pattern, not just a curved pattern used on other cloth
  or clothes.
examples:
- She wore a soft paisley scarf with red and blue curved shapes.
- The shop sold paisley cloth for making warm dresses.
