simpleMeaning: Its jaw sticks out in front of a flat head on a big catfish from the middle United States
scope: A big catfish from the middle of the United States, also called flathead catfish and mudcat, not
  a small fish and not a fish with a round head.
examples:
- The goujon we caught had a flat head and a jaw that stuck out.
- A goujon swam slowly along the river bed.
