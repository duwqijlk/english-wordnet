simpleMeaning: the act of bringing a male and a female together so that they can have young
scope: Also called union, pairing, mating and conjugation; this is a male and a female coming together
  to have young, not a metal part that joins two objects.
examples:
- The coupling of the dogs was planned by the breeder.
- For these fish, coupling takes place only in spring.
