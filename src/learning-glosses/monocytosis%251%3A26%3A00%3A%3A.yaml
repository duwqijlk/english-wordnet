simpleMeaning: More of one kind of white blood cell shows up in the blood than is normal, a sign of one
  kind of blood cancer
scope: More of one kind of white blood cell in the blood than is normal, a sign of one kind of blood cancer,
  not a rise in red blood cells and not the cancer itself.
examples:
- The doctor noted monocytosis in the blood test and ordered checks for leukemia.
- Monocytosis can be a sign that something is wrong with the blood.
