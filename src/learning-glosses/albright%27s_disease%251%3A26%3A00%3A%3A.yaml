simpleMeaning: A health problem in which bone grows wrongly as tough stringy tissue, and it hits many
  bones at once
scope: Also called polyostotic fibrous dysplasia; a health problem in which bone grows wrongly in many
  bones at once, not a break or a single-bone trouble.
examples:
- Albright's disease affected several of her bones.
- Doctors found Albright's disease in his leg and arm.
