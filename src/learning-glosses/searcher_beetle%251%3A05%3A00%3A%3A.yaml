simpleMeaning: a big shiny blue-green insect that hunts and eats caterpillars, found in North America
scope: A big shiny blue-green insect that eats caterpillars; searcher is another name for this sense.
  Not a small brown beetle and not an insect that eats plants.
examples:
- A searcher beetle caught a caterpillar on the garden path.
- The searcher beetle lives in North America and hunts caterpillars.
