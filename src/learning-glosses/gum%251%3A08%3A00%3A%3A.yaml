simpleMeaning: the soft flesh in the jaws that fits around the bottom of each tooth and has a thin wet
  covering
scope: This is the flesh around the teeth in the mouth, not the sticky stuff from plants and not the sweet
  stuff people chew.
examples:
- Her gums hurt when she brushed her teeth.
- The dentist checked his gums for signs of illness.
