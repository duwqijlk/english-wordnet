simpleMeaning: In dentistry, a man-made cover put over a broken or bad tooth
scope: Also called a crown or a cap. This is a cover for a tooth, not a hard metal cover for a bullet
  and not an outer cover for other things.
examples:
- The dentist put a jacket crown on her broken tooth.
- A jacket crown was made for his bad back tooth.
