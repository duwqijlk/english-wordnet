simpleMeaning: In art, an Austrian group in the 1890s that made art and buildings in a way like the French
  art nouveau style
scope: This art and building group in Austria in the 1890s, also called sezession, is not the act of leaving
  a union or a group of countries.
examples:
- The Secession was an Austrian group of artists and builders in the 1890s.
- Paintings made under the Secession followed a style like French art nouveau.
