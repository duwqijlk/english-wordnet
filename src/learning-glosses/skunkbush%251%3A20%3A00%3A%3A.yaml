simpleMeaning: Fruit you can eat grows on this shrub of California, whose leaves, usually in three parts,
  smell bad, and which loses its leaves in winter.
scope: Also called squaw-bush or squawbush, it is a shrub of California whose leaves smell bad, and its
  fruit can be eaten.
examples:
- The skunkbush lost its leaves in winter.
- We ate the fruit of the skunkbush.
