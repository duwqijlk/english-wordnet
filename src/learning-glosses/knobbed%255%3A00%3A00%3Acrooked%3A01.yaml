simpleMeaning: Said of an old person or an old tree, with hard round lumps all over it.
scope: Said of an old person or tree with hard round lumps, also called knotted, gnarled, gnarly, and
  knotty; not merely bent or twisted.
examples:
- The knobbed stick leaned against the door.
- His knobbed hands shook as he poured the tea.
