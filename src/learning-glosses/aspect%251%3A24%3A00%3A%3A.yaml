simpleMeaning: The part of a verb that shows whether an action is just starting, going on, finished, or
  done again
scope: How a verb shows the timing of an action, not the look of a thing and not one side of a question.
examples:
- In 'she is singing', the aspect shows the action is still going on.
- The aspect of the verb tells us the action has finished.
