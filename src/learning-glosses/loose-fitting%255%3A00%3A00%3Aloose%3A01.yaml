senseId: loose-fitting%5:00:00:loose:01
synsetId: 01449882-s
simpleMeaning: Clothes that leave space between the cloth and the body, so the cloth hangs free
scope: Also called baggy and sloppy, this is clothing that hangs away from the body instead of fitting
  close, not clothing that fits tight and not clothing made to show the shape of the body.
examples:
- She wore a loose-fitting dress on the hot day.
- His loose-fitting shirt moved in the wind.
