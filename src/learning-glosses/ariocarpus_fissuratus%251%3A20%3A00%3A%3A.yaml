simpleMeaning: A cactus usually without branches or spines, covered with warty bumps, with magenta flowers
  and white or green fruit; like the related mescal; northeastern Mexico and southwestern United States.
scope: 'Also called living rock: a cactus, not a stone, and not mescal itself.'
examples:
- Ariocarpus fissuratus sat low among the rocks.
- Ariocarpus fissuratus opened magenta flowers in spring.
