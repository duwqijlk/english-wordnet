simpleMeaning: In physics, the mark of a tiny bit called a quark that sets what part it plays when bits
  pull hard on each other
scope: 'Also called color: in physics, the mark of a tiny bit called a quark, not the shade of a thing
  you see and not a false show put on to mislead.'
examples:
- Each kind of quark comes in three colours in physics.
- The colour of a quark sets its part in the strong pull between bits.
