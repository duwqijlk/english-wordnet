simpleMeaning: a diamond-shaped back muscle that pulls the shoulder blade toward the backbone
scope: 'Also called the greater rhomboid muscle or the rhomboideus major muscle: a diamond-shaped back
  muscle that pulls the shoulder blade toward the backbone; not the smaller rhomboid muscle and not a
  chest muscle.'
examples:
- The musculus rhomboideus major draws the shoulder blade toward the backbone.
- He felt the musculus rhomboideus major tighten as he pulled his shoulders back.
