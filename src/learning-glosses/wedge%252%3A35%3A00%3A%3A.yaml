simpleMeaning: to push or fit yourself or something into a small tight space where there is hardly room
scope: 'Also called force and squeeze: this is pushing into a small tight space, not the wood block that
  stops a heavy thing moving and not the heel of a shoe.'
examples:
- She wedged herself into the last free seat on the train.
- He wedged the bag into the tight space under the seat.
