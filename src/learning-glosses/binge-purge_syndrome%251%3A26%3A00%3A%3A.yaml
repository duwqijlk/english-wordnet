simpleMeaning: An eating ill in which one swings between fierce hunger for food and loathing of food,
  marked by gorging and then spells of fasting or making oneself sick.
scope: This sense is also called binge-vomit syndrome, bulimarexia, and bulimia nervosa, an eating ill
  in which one swings between fierce hunger for food and loathing of food, marked by gorging and then
  spells of fasting or making oneself sick.
examples:
- Binge-purge syndrome swings between hunger and loathing.
- The binge-purge syndrome brings spells of fasting.
