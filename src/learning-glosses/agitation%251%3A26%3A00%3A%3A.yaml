simpleMeaning: a time when things are stirred up and changing in a wild, unsettled way
scope: A time of wild, unsettled change, not the uneasy feeling inside one person and not the act of stirring
  something.
examples:
- The country went through a period of agitation after the election.
- There was much social agitation before the reforms.
