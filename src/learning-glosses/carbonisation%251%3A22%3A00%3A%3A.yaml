simpleMeaning: Heating coal without air until it breaks down, as in ovens that make coke.
scope: Heating coal without air until it breaks down, as in ovens that make coke; carbonization is another
  name for this sense, not burning coal in open air and not making charcoal in a pit.
examples:
- Carbonisation turns coal into gas and coke.
- The carbonisation of coal gives off gas.
