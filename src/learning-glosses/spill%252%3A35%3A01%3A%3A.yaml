senseId: 'spill%2:35:01::'
synsetId: 01544585-v
simpleMeaning: to let something come out drop by drop, in small amounts, or in a way that is like drops
scope: Another name for this sense is shed. It is about pouring out in drops or small amounts, not about
  a liquid running out of a cup or box, and not the liquid itself.
examples:
- The cut spilled blood in slow drops.
- She spilled tears when she heard the sad news.
