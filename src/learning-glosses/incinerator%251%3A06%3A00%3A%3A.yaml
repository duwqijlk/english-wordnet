simpleMeaning: a machine that burns things in a very hot fire, especially to get rid of waste
scope: A machine for burning waste very hot, not a kitchen oven and not a heater that warms a building.
examples:
- The hospital puts used bandages into the incinerator.
- All the town's waste is burned in a large incinerator.
