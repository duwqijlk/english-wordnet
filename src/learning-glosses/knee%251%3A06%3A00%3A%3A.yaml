simpleMeaning: the section of a trouser leg that covers the joint in the middle of the leg
scope: The cloth part of a trouser leg, not the body joint itself and not the matching joint in an animal.
examples:
- There was a rip in the knee of his jeans.
- She wiped her hands on the knees of her trousers.
