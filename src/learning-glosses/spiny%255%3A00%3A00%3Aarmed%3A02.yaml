simpleMeaning: having sharp points that keep animals away, such as small hooks, long stiff points, plant
  points, or stiff hairs
scope: Covered with sharp points that keep animals away, also called prickly, bristled, barbed, thorny,
  bristly, burred, barbellate, briary, briery, burry, setaceous and setose; not smooth or soft.
examples:
- The spiny plant hurt my hand when I touched it.
- A spiny fish lives in the river and is hard to hold.
