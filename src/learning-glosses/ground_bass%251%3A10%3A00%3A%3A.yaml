simpleMeaning: Played again and again without a break, a short tune stays in the low part of the music
scope: A short tune in the low part of the music, played again and again, not a tune that changes all
  the time and not the high part of the music.
examples:
- The ground bass repeats through the whole piece.
- She played the ground bass while the singer sang over it.
