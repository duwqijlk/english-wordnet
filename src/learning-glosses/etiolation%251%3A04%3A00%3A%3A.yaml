simpleMeaning: In plants, making a plant grow without the green stuff that catches sunlight, by keeping
  it out of the sun
scope: In plants, making a plant grow without sunlight; not the green growth of a plant in light, and
  not the wilting of a plant.
examples:
- The etiolation of celery keeps the stalks pale and tender.
- Etiolation left the plant pale from lack of sun.
