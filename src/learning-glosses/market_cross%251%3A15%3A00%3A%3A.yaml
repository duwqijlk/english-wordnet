simpleMeaning: Where public business is often done, in the town square, stands a shape like a plus sign
scope: A monument in the shape of a plus sign in a town square where public business is often done, not
  a church cross and not a signpost.
examples:
- The market cross still stands in the middle of the town square.
- Townsfolk gathered by the market cross to hear the news.
