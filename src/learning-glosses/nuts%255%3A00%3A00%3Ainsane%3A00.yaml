simpleMeaning: Loose, joking words for a mind that is not working in the usual way
scope: Also called cracked, this is a loose, joking word for a mind that is not working in the usual way,
  not the hard food that grows in a shell.
examples:
- He went nuts when he heard the news.
- The long wait drove her nuts.
