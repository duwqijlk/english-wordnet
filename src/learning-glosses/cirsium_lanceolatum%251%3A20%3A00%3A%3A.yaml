simpleMeaning: A thistle from Europe with quite large heads and prickly leaves, now a common weed across
  the United States.
scope: A European thistle, also called boar thistle, bull thistle, spear thistle and Cirsium vulgare,
  set apart from the field thistle by its large heads and prickly leaves.
examples:
- Cirsium lanceolatum grew along the fence.
- The prickly leaves of Cirsium lanceolatum marked it as a weed.
