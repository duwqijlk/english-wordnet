simpleMeaning: to cause a sharp, stinging feeling or a light tingling feeling in the skin
scope: 'Also called tingle: to make the skin sting or feel a light tingling feeling, not the small sharp
  point on a plant stem or leaf and not a light, sharp pain felt in many small places at once.'
examples:
- The nettles prickled her bare arms as she walked past.
- The cold wind prickled his cheeks on the hill.
