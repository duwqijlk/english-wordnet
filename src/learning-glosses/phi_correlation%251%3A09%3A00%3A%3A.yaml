simpleMeaning: Two sets of marks, each falling into one of two ranked groups, are matched by this number,
  which shows how closely they go together, as with male and female.
scope: It is also called fourfold point correlation and phi coefficient, and it gives the link between
  two sets of marks, not a score for one set alone.
examples:
- They worked out the phi correlation for the two sets of scores.
- The phi correlation for male and female scores was written down as a single number.
