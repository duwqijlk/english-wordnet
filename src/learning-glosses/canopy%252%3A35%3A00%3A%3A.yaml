senseId: 'canopy%2:35:00::'
synsetId: 01340208-v
simpleMeaning: to cover something with a covering, usually of cloth, that works as a roof to give shelter
  from weather
scope: This is the act of covering something with a covering, usually of cloth, that works as a roof;
  not the covering itself, not the clear cover over the front part of a plane, and not the top part of
  a parachute.
examples:
- They canopied the market stalls with a large cloth to keep off the rain.
- She canopied the outdoor tables with a cloth so people could eat outside in wet weather.
