simpleMeaning: Soft hairs cover this herb from South Africa, whose blooms carry bright blue rays.
scope: Soft hairs and blooms with bright blue rays mark this herb from South Africa, not a smooth herb
  with blooms of another colour.
examples:
- The kingfisher daisy showed its bright blue rays.
- A kingfisher daisy in bloom showed bright blue rays.
