simpleMeaning: blood flowing back through a vein, seen when the heart fails to pump well and fluid builds
  up
scope: Blood flowing back through a vein when the heart fails to pump well, not blood flowing back in
  a healthy heart and not a block in an artery.
examples:
- The doctor looked for hepatojugular reflux as a sign of heart failure.
- Hepatojugular reflux showed that the heart was not pumping well.
