simpleMeaning: Inside many seeds and cereal grains, the food store has an outer part made of this grainy
  protein.
scope: This grainy protein sits in the outer layer of the food store inside a seed; it is not the whole
  seed itself.
examples:
- The aleurone lies just under the skin of the grain.
- The aleurone forms the grainy outer layer of the food store inside the seed.
