simpleMeaning: a tied score in tennis or table tennis where a player must win two points in a row to win
  the game
scope: This is the tied score in tennis or table tennis, not the number two, which is another sense of
  the same word.
examples:
- The score reached deuce after a long rally.
- At deuce, she won the next two points and took the game.
