simpleMeaning: A student who holds one of the grants set up by the will of Cecil that lets the student
  study at Oxford University.
scope: A student who studies at Oxford on a grant left by Cecil Rhodes, not a student on any other grant
  and not a fellow of the university.
examples:
- She became a Rhodes scholar and went to study at Oxford.
- A Rhodes scholar studies at Oxford on a grant from Cecil Rhodes.
