senseId: 'assimilation%1:26:00::'
synsetId: 13953961-n
simpleMeaning: The state of people from different backgrounds coming to feel part of one larger nation.
scope: The state of people from different backgrounds coming to feel part of one larger nation, not the
  fitting of one case to a general pattern in the ideas of Jean Piaget, not how the nourishing parts of
  food pass into the body after eating, and not the taking in of new ideas into what one already knows
  and thinks.
examples:
- Assimilation brought the newcomers into the life of the nation.
- The assimilation of the immigrants took a generation.
