simpleMeaning: An enzyme made by bacteria to break up invading viruses; it cuts nucleic acid such as DNA
  at chosen sites into smaller pieces and is used in genetic engineering.
scope: 'Another name for restriction nuclease and restriction endonuclease: a bacterial enzyme that cuts
  nucleic acid at set sites. It is not a ligase, which joins DNA fragments instead of cutting them.'
examples:
- The researchers used a restriction enzyme to cut the plasmid at a known site.
- Bacteria deploy restriction enzymes to destroy the DNA of invading viruses.
