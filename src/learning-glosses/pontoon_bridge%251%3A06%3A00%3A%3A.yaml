simpleMeaning: A short-term crossing over water, built on a row of floating hollow tanks
scope: This is a short-term crossing over water on floating tanks; not a fixed crossing built on stone
  posts, and not a boat used to carry people.
examples:
- Soldiers crossed the river on a pontoon bridge.
- The army built a pontoon bridge after the flood.
