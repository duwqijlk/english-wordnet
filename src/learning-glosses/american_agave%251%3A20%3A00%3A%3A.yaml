simpleMeaning: A plant of the Americas, grown widely by people, with pale green-white flowers on a tall
  stalk; it flowers only once, after ten to twenty years, and then dies.
scope: Also called Agave americana; a plant with pale green-white flowers on a tall stalk that flowers
  only once after ten to twenty years and then dies, unlike plants that flower every year.
examples:
- The American agave in the yard is twenty years old and still has not flowered.
- After twenty years, our American agave finally flowered and then died.
