simpleMeaning: able to react in some way when something acts on it
scope: 'Also called irritable: able to react to things that act on it. Not the sense of a person who is
  easily excited.'
examples:
- Nerve cells are excitable and send a signal when they are touched.
- The heart muscle is excitable, so a small electric shock can make it beat.
