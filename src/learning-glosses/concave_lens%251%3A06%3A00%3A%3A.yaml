simpleMeaning: A curved piece that makes a beam of light with rays side by side spread out as it goes
  through
scope: A curved piece that makes a beam of light with rays side by side spread out as it goes through;
  diverging lens is another name for this sense, not a piece that brings light to a point and not a flat
  sheet.
examples:
- The concave lens makes a straight beam of light spread out.
- He held a concave lens up to the light.
