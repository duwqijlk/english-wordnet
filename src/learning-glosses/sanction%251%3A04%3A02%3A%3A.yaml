simpleMeaning: a way a group makes its members keep to the rules and ways it counts as right
scope: A means of enforcing a group's rules, not formal approval and not the act of approving something.
examples:
- Gossip can act as a sanction in a small village.
- The tribe used shame as a sanction against stealing.
