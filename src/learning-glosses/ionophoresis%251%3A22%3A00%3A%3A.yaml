simpleMeaning: With positive bits moving to one pole and negative bits to the other, tiny charged bits
  move through a thick mix under an electric field
scope: Also called cataphoresis, dielectrolysis, and electrophoresis, this is the movement of charged
  bits through a thick mix under an electric field.
examples:
- Ionophoresis sent the charged bits through the thick mix.
- Under ionophoresis, the positive bits went to one pole.
