simpleMeaning: You press this tool down to leave a mark or a picture on something; it is usually made
  of rubber
scope: A tool, usually of rubber, pressed down to leave a mark or a picture, not a postage stamp and not
  the act of stamping a paper to show it is approved.
examples:
- The clerk used the handstamp on each ticket.
- She pressed the handstamp onto the paper to leave a star.
