simpleMeaning: a singing bird with a long tail and grey and white feathers, from the south of the United
  States, that can copy the songs of other birds
scope: Also called mocker; this is a grey and white singing bird that copies other birds, not a person
  who makes fun of others.
examples:
- A mockingbird sat in the tree and copied the call of another bird.
- We heard a mockingbird singing many different songs in the morning.
