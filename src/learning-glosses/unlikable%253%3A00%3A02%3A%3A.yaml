simpleMeaning: for a character in a story or play, making people who read or watch feel strong dislike
  for that character
scope: Also called unsympathetic, unappealing, and unlikeable, this is about a character in a story or
  play whom people who read or watch strongly dislike, not about a real person in daily life.
examples:
- The hero's brother is an unlikable character who lies to everyone.
- She wrote an unlikable man in her play, and the audience disliked him at once.
