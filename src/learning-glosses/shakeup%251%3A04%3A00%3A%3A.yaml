simpleMeaning: the act of giving a whole body a new order, often with big and far-reaching changes
scope: The act of giving a group a new order, often with big and far-reaching changes, also called reorganization,
  reorganisation and a shake-up; not a small change of staff and not a fight.
examples:
- The shakeup forced out the top officials.
- After the shakeup, the curriculum was taught in a new way.
