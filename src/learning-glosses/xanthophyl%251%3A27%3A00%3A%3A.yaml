simpleMeaning: yellow colouring from a group of plant colours called carotenoids, found in plants, animal
  fats and egg yolks
scope: This is a yellow colour in plants, animal fats and egg yolks, also called lutein and xanthophyll;
  not the tiny living things that make yellow colour, and not a green colour in leaves.
examples:
- The xanthophyl in the egg yolk gives it a rich yellow colour.
- Xanthophyl is one of the yellow colours found in green leaves.
