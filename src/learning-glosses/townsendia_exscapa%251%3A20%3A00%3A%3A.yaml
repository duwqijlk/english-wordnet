simpleMeaning: A dwarf tufted, nearly stemless herb with a rosette of woolly leaves and large white-rayed
  flower heads and bristly seed cases, from central Canada and United States west to Arizona.
scope: Also called stemless daisy and Easter daisy; a dwarf, nearly stemless herb with woolly leaves and
  large white-rayed flower heads, not the common daisy of lawns and not the oxeye daisy.
examples:
- Townsendia exscapa forms a low tuft of woolly leaves on the prairie.
- The large white-rayed heads of Townsendia exscapa open in spring.
