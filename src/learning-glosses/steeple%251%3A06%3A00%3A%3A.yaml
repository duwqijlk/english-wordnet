simpleMeaning: rising to a point at the top, a tall tower stands on a building, most often a church or
  temple
scope: Also called a spire; a tall tower on a building, not the church itself.
examples:
- The church steeple could be seen from miles away.
- A white steeple rose above the roofs of the little town.
