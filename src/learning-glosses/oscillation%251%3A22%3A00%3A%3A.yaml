schema: oewn-learning-gloss-v2
senseId: 'oscillation%1:22:00::'
synsetId: 13549168-n
simpleMeaning: the act of moving back and forth between two states, or of changing again and again from
  one state to another
scope: This is the process of changing again and again between states; not one single complete round of
  an event that repeats, and not the physics sense in which a value changes again and again around a middle
  value.
examples:
- His oscillation between hope and fear lasted for weeks.
- We saw a slow oscillation in her mood, from calm to worried and back again.
