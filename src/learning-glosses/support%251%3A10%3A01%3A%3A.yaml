simpleMeaning: A sung or played part in music that backs up or provides a background for other musical
  parts.
scope: This is a part of the music, not a load-bearing structure or an argument backed by evidence.
examples:
- The piano part provided quiet support for the singer's melody.
- A low cello line played behind the solo violin.
