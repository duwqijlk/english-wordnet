simpleMeaning: to go to a place, get a person or thing there, and take them away with you
scope: This is to go and get a person or thing from a place and take them away with you; it is not bringing
  things together in one place, not the church prayer and not a call or package paid for by the person
  who gets it.
examples:
- She collected the children from day care after work.
- On Monday he collected the results from the office.
