simpleMeaning: a thin monkey from Asia with a long tail
scope: A thin monkey from Asia with a long tail; not a monkey from other places, and not a monkey with
  a short tail or a heavy body.
examples:
- A langur sat in the tree, its long tail hanging down.
- We saw a group of langurs moving through the forest in India.
