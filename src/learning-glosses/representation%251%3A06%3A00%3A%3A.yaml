simpleMeaning: A thing made to show a person or thing in a form you can see or touch
scope: A made thing that shows a person or thing in a form you can see or touch, not the act of standing
  in for someone and not a body of lawmakers.
examples:
- The statue is a representation of the queen.
- The painting was a fine representation of the harbour.
