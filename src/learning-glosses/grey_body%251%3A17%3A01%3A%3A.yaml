senseId: 'grey_body%1:17:01::'
synsetId: 92462504-n
simpleMeaning: An object that gives off rays at a fixed share of what a perfect giver of rays would give
  off at the same heat
scope: This is an object that gives off rays at a fixed share of the ideal amount; gray body is another
  name for it, not a perfect giver of rays and not an object that gives off rays only at some colours.
examples:
- The grey body gave off less heat than a perfect black body at the same heat.
- In the lab, the grey body was used to show how real objects give off rays.
