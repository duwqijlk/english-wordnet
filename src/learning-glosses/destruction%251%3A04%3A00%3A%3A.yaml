simpleMeaning: the end of a thing when it is hurt so badly that it cannot be fixed or is no longer there
scope: 'Also called devastation: a thing is hurt so badly that it ends, not just one event that does great
  harm.'
examples:
- The fire caused the destruction of the old house.
- War brought destruction to the whole town.
