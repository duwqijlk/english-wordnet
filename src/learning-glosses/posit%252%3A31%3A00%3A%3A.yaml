senseId: 'posit%2:31:00::'
synsetId: 00718663-v
simpleMeaning: to accept something as true without proof, so you can use it as a starting point for thinking
  or arguing
scope: To accept a thing as true to start thinking, also called postulate; not the noun name for such
  a starting idea in logic.
examples:
- The book posits that all people are born equal.
- He posited three basic rules to explain how nature works.
