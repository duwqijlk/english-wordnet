simpleMeaning: to do something you think is too low or unworthy for a person like you
scope: 'Also called descend and deign: doing something you think is beneath you, not treating someone
  as lesser and not behaving in a low, unworthy way.'
examples:
- He would not condescend to answer such a question.
- She condescended to join them for tea, though she thought it beneath her.
