simpleMeaning: A word whose meaning is the exact contrary of another word's.
scope: It names a word with a contrary meaning, not the relationship of direct opposition itself, not
  a competitor you are set against, and not something turned upside down; antonym and opposite word are
  other names.
examples:
- In this exercise, match each word with its opposite.
- '''Hot'' is the opposite of ''cold''.'
