simpleMeaning: Telling a small lie or not speaking clearly on purpose, as an act that does not matter
  much
scope: A small act of lying or of being unclear on purpose, not a serious lie told to do great harm and
  not an honest mistake.
examples:
- His fibbing about eating the cake fooled no one.
- She was caught fibbing about why she was a few minutes late.
