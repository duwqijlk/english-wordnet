simpleMeaning: A condition caused by too much parathyroid hormone, which raises blood calcium to abnormal
  levels; it can affect many body systems, especially by breaking down bone and causing osteoporosis.
scope: This is the medical condition with too much parathyroid hormone and high blood calcium, not hyperthyroidism
  (too much thyroid hormone) and not hypoparathyroidism (too little parathyroid hormone).
examples:
- Blood tests showed hyperparathyroidism as the cause of her high calcium.
- Untreated hyperparathyroidism can slowly weaken the bones.
