simpleMeaning: A group of that council of the United Nations that works on making that part of the world
  richer.
scope: This is the part of the United Nations that looks after that part of the world, not the part that
  looks after other parts of the world.
examples:
- The Economic Commission for Latin America published a report on trade.
- The Economic Commission for Latin America helps countries in that part of the world.
