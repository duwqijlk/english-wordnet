simpleMeaning: The power to look at what is going on, see it clearly, and come to a wise choice about
  it.
scope: The power to size up a state of things and reach a sound choice, not the court's ruling and not
  the paper that gives the reasons for it.
examples:
- Her judgment in hiring staff was sound.
- He showed good judgment when he refused to lend the money.
