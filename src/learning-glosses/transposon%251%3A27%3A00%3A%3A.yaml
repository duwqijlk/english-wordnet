simpleMeaning: Above all a bit of germ DNA that can move as a whole, a bit of DNA in biology can join
  itself into many different places along a chromosome.
scope: Also called a jumping gene, this is the bit of DNA that can move as a whole to many places along
  a chromosome.
examples:
- The transposon moved as a whole to a new place.
- A transposon had joined itself into the chromosome at a new site.
