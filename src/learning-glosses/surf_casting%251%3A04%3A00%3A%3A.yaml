simpleMeaning: throwing fake bait far out into the sea, as far as 200 yards, while the waves break round
  you
scope: This is throwing bait far into the sea from the shore, also called surf fishing; not fishing from
  a boat and not fishing in a lake.
examples:
- He went surf casting at dawn, with the waves breaking around his legs.
- Surf casting takes a long rod to throw the bait far out.
