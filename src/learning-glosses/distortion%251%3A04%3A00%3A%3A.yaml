simpleMeaning: when the sense of a thing is twisted so it looks like a different sense from the one meant
scope: This is about words being changed to mean something else, not a change in a sound, not a fault
  in a lens or mirror, and not a bent shape.
examples:
- The distortion of her words in the report made it sound as if she agreed.
- His distortion of the facts turned a small mistake into a scandal.
