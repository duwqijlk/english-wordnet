simpleMeaning: a chemical change or stuff that takes in heat as it happens or as it is made
scope: 'Also called endothermic and heat-absorbing: a change or stuff in chemistry that takes in heat,
  not one that gives out heat and not heat itself.'
examples:
- The endothermal reaction took in heat from its surroundings as it went on.
- An endothermal compound forms only when heat is taken in.
