scope: Also called sweetleaf; a small yellowwood tree of the southern United States, known by its small
  sweet-smelling white flowers and by the yellow dye from its leaves and bark.
examples:
- Symplocus tinctoria grows in the southern United States.
- The Symplocus tinctoria tree gives a yellow dye from its bark.
