simpleMeaning: Low, bushy plants of the south-eastern United States that form slow-growing clumps and
  bear blue flowers in short clusters at the ends of the stems.
scope: These are low, bushy plants with blue flowers in short clusters, also called blue star; not a tall
  shrub and not a plant with red flowers.
examples:
- Amsonia tabernaemontana formed a slow-growing clump in the garden.
- The blue flowers of Amsonia tabernaemontana opened in short clusters.
