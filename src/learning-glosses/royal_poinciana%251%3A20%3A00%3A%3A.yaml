simpleMeaning: A showy tropical tree or shrub from Madagascar, widely planted in warm regions for its
  huge sprays of scarlet and orange flowers, sometimes classed in the genus Poinciana.
scope: This is the large Madagascar tree with scarlet and orange flower sprays, not a smaller poinciana
  grown as a garden shrub.
examples:
- The royal poinciana spread a wide canopy of orange flowers over the street.
- Royal poinciana trees line many avenues in tropical cities.
