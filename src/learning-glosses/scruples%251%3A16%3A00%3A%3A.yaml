simpleMeaning: a reason in a person's mind for acting, that follows from ideas of right and wrong; these
  ideas guide what the person thinks and does
scope: Also called conscience, moral sense, and sense of right and wrong. This is the reason in the mind
  that guides a person, not a rule or law made by other people.
examples:
- His scruples stopped him from lying to his friend.
- She had no scruples about taking money that was not hers.
