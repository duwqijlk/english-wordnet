simpleMeaning: 'a unit of force: the force that makes 1 kilogram move 1 metre per second faster each second,
  equal to 100,000 dynes (very small units of force)'
scope: A unit used to measure force, not a unit of mass like the kilogram and not the man Newton himself.
examples:
- The small engine pushes with a force of 200 newtons.
- We measured the pull in newtons, not in kilograms.
