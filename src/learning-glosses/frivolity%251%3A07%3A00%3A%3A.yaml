simpleMeaning: the quality a person has when they are not serious or sensible
scope: This names a person's quality of not being serious or sensible, not careful thought or serious
  behaviour.
examples:
- Her frivolity made it hard to trust her with important work.
- In an emergency, frivolity has no place; people need calm and care.
