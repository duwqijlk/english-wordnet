simpleMeaning: A printer that puts the place to send a letter on the envelope by itself.
scope: A printer that marks letters with where to send them, not a printer for pages of text and not a
  stamp machine.
examples:
- The office addressing machine prints hundreds of envelopes each morning.
- Before the addressing machine, clerks wrote each envelope by hand.
