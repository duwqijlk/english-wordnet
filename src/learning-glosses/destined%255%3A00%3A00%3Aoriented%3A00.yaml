simpleMeaning: Heading in a set direction, or meaning to head there; often joined to the name of the place,
  as in college-bound.
scope: 'Also called bound: heading in a set direction, or meaning to head there, often joined to the name
  of the place, not fated or meant by some higher power.'
examples:
- A train destined for the coast left at noon.
- The parcel was destined for an address in York.
