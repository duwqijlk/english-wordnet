simpleMeaning: Thick, sword-shaped leaves marked with spots of different colours are why this plant is
  kept in the house, or it is grown for its strong threads.
scope: This plant is also called sansevieria, and not the strong thread that comes from it.
examples:
- They keep bowstring hemp in the house for its marked leaves.
- They grow bowstring hemp for its strong threads.
