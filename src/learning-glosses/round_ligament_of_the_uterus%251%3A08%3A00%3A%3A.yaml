simpleMeaning: a cord fixed to each side of the womb, in front of and below the mouth of the egg tube,
  running through the groin to the outer lips
scope: Also called ligamentum teres uteri; a cord that holds the womb, not a muscle and not a blood vessel.
examples:
- The round ligament of the uterus runs through the groin.
- Each round ligament of the uterus holds the womb in place.
