simpleMeaning: With the mass of a proton or more, one of the smallest bits takes part in strong pulls
  between bits, and is a kind of bit with baryon number one.
scope: Also called a baryon, it is one of the smallest bits, with the mass of a proton or more.
examples:
- The heavy particle took part in the strong pull between bits.
- A heavy particle has at least the mass of a proton.
