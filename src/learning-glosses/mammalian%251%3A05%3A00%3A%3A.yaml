simpleMeaning: An animal with hair more or less covering its skin and a backbone, warm-blooded, its young
  born alive and fed with milk, but for a few that lay eggs.
scope: 'Also called a mammal: an animal with hair more or less covering its skin and a backbone, warm-blooded,
  its young born alive and fed with milk, but for a few that lay eggs; not the adjective sense about the
  class Mammalia.'
examples:
- A dog is a mammalian, born alive and fed with milk as a pup.
- The whale is a mammalian, warm-blooded, with hair more or less covering its skin.
