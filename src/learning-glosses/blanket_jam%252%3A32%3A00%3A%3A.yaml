simpleMeaning: to block a wide range of radio waves so that no messages get through in an area, except
  those sent by a beam aimed in one direction
scope: To block radio waves over a wide range so no messages get through in an area, not to block one
  single frequency.
examples:
- The army used blanket jamming to stop radio messages in the area.
- They blanket jammed the whole band so no messages got through.
