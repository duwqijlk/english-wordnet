simpleMeaning: To set things in tune, or tie them in tune.
scope: This sense is also called harmonize, for setting things in tune, or tying them in tune, unlike
  the sense for bringing into tune, concord, or accord while making music or singing, unlike the sense
  for singing or playing in tune, and unlike the sense for writing a harmony.
examples:
- They harmonised the parts in tune.
- Harmonising sets things in tune.
