simpleMeaning: A figure worked out from observed values with no knowledge of the shape of the pattern
  they come from or of its set numbers
scope: This is a figure worked out from observed values with no knowledge of the pattern's shape or set
  numbers; nonparametric statistic is another name for it, not a figure that needs that knowledge first.
examples:
- The distribution free statistic let her compare the two groups without guessing the shape of the data.
- He used a distribution free statistic because the sample was too small to assume a pattern.
