simpleMeaning: A tough sheet used to wrap meat, that blood and meat juices cannot soak through
scope: A tough sheet for wrapping meat that blood cannot soak through, not thin paper for parcels and
  not a plastic bag.
examples:
- He wrapped the joint in butcher paper.
- Butcher paper kept the blood from soaking through.
