simpleMeaning: This board with keys makes a long strip of paper full of holes, and the holes tell a machine
  how to cast metal letters, apart from the casting itself.
scope: A board with keys that makes a holed paper strip to guide the casting of metal letters, not the
  casting machine itself.
examples:
- The monotype keyboard made a holed paper strip for the casting machine.
- He typed the text on the monotype keyboard before the letters were cast.
