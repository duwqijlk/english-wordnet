senseId: 'arctiid_moth%1:05:00::'
synsetId: 02308059-n
simpleMeaning: A moth with a thickset body and wide wings carrying striking stripes or spots, whose caterpillars
  are covered in hair.
scope: This is the same sense as the shorter name arctiid, and it refers to the adult moth, not to the
  caterpillar. It is not a general label for any patterned moth, because many unrelated families are also
  striped. The name is technical, used mainly by entomologists.
examples:
- An arctiid moth rested on the fence post, wings spread wide.
- We reared the arctiid moth from a hairy caterpillar.
