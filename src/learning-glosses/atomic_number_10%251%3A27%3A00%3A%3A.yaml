simpleMeaning: A colourless, odourless gas that glows red in a tube with the air taken out; one of six
  gases that do not react, found in the air in small amounts.
scope: Also called Ne and neon; one of six gases that do not react with other things, found in the air
  in small amounts.
examples:
- Atomic number 10 is the gas that makes the red glow in the sign.
- The tube held atomic number 10, which glowed red.
