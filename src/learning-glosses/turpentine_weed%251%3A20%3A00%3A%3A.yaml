simpleMeaning: narrow straight leaves line the many thin branches of a low sticky half-shrub of the southwestern
  United States, crowned with hundreds of tiny yellow flower heads
scope: A low plant of the southwestern United States, not a tall shrub with big blooms; also called broom
  snakeroot, broom snakeweed, rabbit-weed, rabbitweed, and snakeweed.
examples:
- The turpentine weed grew along the dry roadside.
- We brushed past a turpentine weed and its leaves stuck to our sleeves.
