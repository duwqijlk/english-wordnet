simpleMeaning: The bridge at the base of the brain and the small brain at the back grow from this part
  of the back of the brain
scope: A part of the back of the brain that grows into two other parts, not the whole back of the brain
  and not the front of the brain.
examples:
- The metencephalon develops into the pons and cerebellum.
- In the embryo, the metencephalon is the part of the hindbrain that grows into two parts.
