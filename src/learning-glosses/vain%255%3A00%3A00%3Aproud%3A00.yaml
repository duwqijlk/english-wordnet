simpleMeaning: marked by false pride and by thinking you are much more important than you really are
scope: Also called swollen. This sense is about false pride and thinking you matter too much, not about
  a try that has no success.
examples:
- He is vain about his looks and checks the mirror all day.
- She was too vain to say that she needed help.
