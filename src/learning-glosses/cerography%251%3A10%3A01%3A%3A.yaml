simpleMeaning: The craft of cutting lines into a wax-covered plate, on which a printing surface is made
  by coating it with metal by electric current.
scope: The craft of cutting lines into a waxed plate to make a printing surface, not cutting into wood
  and not printing with a press alone.
examples:
- Cerography was used to make fine prints in the last century.
- The artist learned cerography to copy her drawings in wax.
