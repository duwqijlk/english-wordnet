simpleMeaning: Grown for large pale yellow blooms that open in the early morning, this plant of the southwest
  United States lives two years and has white stems and toothed leaves.
scope: This plant of the southwest United States lives two years and is grown for its large pale yellow
  blooms that open in the early morning, and it is not the Liatris kind with small round bloom heads in
  clusters.
examples:
- The blazing star opened its pale yellow blooms early in the morning.
- White stems and toothed leaves marked the blazing star.
