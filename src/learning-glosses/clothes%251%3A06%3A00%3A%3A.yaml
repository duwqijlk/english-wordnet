simpleMeaning: The things people wear on their bodies, such as shirts, trousers, and coats.
scope: This is the everyday word for what a person wears; it is not a single garment, and not cloth as
  a material.
examples:
- She packed warm clothes for the trip.
- His clothes were soaked through by the rain.
