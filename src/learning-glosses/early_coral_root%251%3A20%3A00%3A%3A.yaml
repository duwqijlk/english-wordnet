simpleMeaning: A plant with clusters of almost leafless pale yellow-green stems and matching white-lipped
  flowers, found from northern New Mexico through South Dakota and Washington to Alaska.
scope: The pale-stemmed, nearly leafless plant of northern woods with white-lipped flowers, not a leafy
  green plant of the same habitat.
examples:
- Early coral root grows in shady woods from New Mexico to Alaska.
- The early coral root bears pale yellow-green flowers with white lower lips.
