simpleMeaning: A calm, proud way of standing and acting that wins respect from others
scope: 'Also called presence: a calm and dignified way of acting, not the way a person holds their body
  and not a picture on a shield.'
examples:
- Her bearing impressed everyone in the room.
- He spoke with a bearing that showed quiet pride.
