simpleMeaning: Said of the state or island of Hawaii, or of the people who live there, their way of life,
  and their tongue.
scope: This word is used of Hawaii, its people, their way of life, and their tongue; it is not the name
  of the language itself, and not a person from Hawaii.
examples:
- She wore a Hawaiian shirt to the beach party.
- They danced to Hawaiian music at the festival.
