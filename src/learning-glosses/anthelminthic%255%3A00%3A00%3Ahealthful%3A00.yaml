simpleMeaning: Able to drive out or kill the small worms that live inside the body
scope: Able to drive out or kill the small worms that live inside the body; anthelmintic, helminthic and
  parasiticidal are other names for this sense, not a medicine for worms itself and not a drug that kills
  germs.
examples:
- An anthelminthic drug clears worms from the gut.
- Doctors gave an anthelminthic medicine to the sick child.
