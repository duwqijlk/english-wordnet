senseId: 'monomaniac%1:18:00::'
synsetId: 10348856-n
simpleMeaning: a person whose mind is taken over by one fixed idea
scope: A person fixed on one single idea, not a person with many fears and not someone who is ill in a
  general way.
examples:
- The collector became a monomaniac about old coins.
- He was a monomaniac, talking of nothing but his invention.
