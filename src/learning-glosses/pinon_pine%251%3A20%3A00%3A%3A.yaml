simpleMeaning: A small tree of Mexico and southern Texas, with needles in groups of two or three.
scope: This is a small tree of Mexico and southern Texas, with needles in groups of two or three; not
  a tall tree, and not a tree of the far north.
examples:
- The pinon pine grew on the dry hills of Texas.
- Pinon pines have needles in groups of two or three.
