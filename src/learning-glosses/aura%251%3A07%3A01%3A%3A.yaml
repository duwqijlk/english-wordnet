simpleMeaning: A special something about a person or thing that you feel but cannot see or touch
scope: A special feeling about a person or thing that cannot be seen or touched, also called air or atmosphere,
  not a feeling before illness and not a ring of light.
examples:
- The old house had an aura of romance.
- An aura of mystery hung about the stranger.
