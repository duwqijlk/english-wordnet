simpleMeaning: the feeling you have when someone makes you feel afraid or shy and not brave
scope: This is the feeling of fear that a person is made to have; it is not the act of making a weaker
  person afraid, and not the low feeling you get near someone famous or rich.
examples:
- She felt a sense of intimidation when the angry man stood close to her.
- A feeling of intimidation stopped her from speaking in the meeting.
