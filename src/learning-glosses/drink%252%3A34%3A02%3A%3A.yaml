synsetId: 01174572-v
simpleMeaning: To take in far too much alcohol, in a way that shows a serious dependence on it.
scope: Taking far too much alcohol as a habit; not merely swallowing any liquid, not having an ordinary
  glass with a meal, and not being absorbed by a film or a story.
examples:
- Her father drank heavily for years before he finally got help.
- He has been drinking since his twenties and cannot stop.
