simpleMeaning: anything that causes pressure or tension in a living thing
scope: This is the thing that causes pressure or tension in a living thing, not the pressure or tension
  itself.
examples:
- Lack of sleep is a common stressor for students during exams.
- Great heat can be a stressor for plants in summer.
