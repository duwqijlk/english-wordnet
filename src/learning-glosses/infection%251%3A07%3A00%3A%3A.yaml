simpleMeaning: a bad effect on a person's morals that leads them to do wrong
scope: This is harm to a person's morals, not an illness caused by germs entering the body and not the
  bad state of the body that follows an illness.
examples:
- Greed was an infection that led the leaders to do wrong.
- He warned that the infection of dishonesty was spreading through the office.
