simpleMeaning: A member of the branch of Islam that sees Ali as the true successor to Mohammed and rejects
  the first three caliphs
scope: Also called Shi'ite, Shia Muslim, Shiite and Shiite Muslim; a member of the branch of Islam that
  sees Ali as the true successor to Mohammed, not a member of the branch that accepts the first three
  caliphs.
examples:
- A Shi'ite Muslim prays at the mosque on Fridays.
- The Shi'ite Muslim scholar wrote about the first three caliphs.
