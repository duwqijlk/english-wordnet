synsetId: 05014082-n
simpleMeaning: the features of a living thing that show if it is male or female, based on its part in
  making new life
scope: Also called sex. This is the male-or-female side of a living thing, based on its part in making
  new life, not the name or social role a person uses in daily life.
examples:
- The doctor could not yet tell the baby's gender.
- Each fish's gender can be seen from its size and colour.
