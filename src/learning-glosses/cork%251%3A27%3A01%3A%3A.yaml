simpleMeaning: In plants, the outer layer of bark made of dead cells that guards what lies under it
scope: In plants, the dead outer layer of bark that guards what lies under it, not the bark of the oak
  used for stoppers and not the fishing float.
examples:
- The cork protects the tree from cold and insects.
- Under the microscope, the cork showed layers of dead cells.
