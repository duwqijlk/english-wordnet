simpleMeaning: how easy it is to know what will happen before it happens
scope: This is about how easy it is to know what will happen next. It is not about a thing being sure
  to happen, and not about it staying the same.
examples:
- The predictability of the bus times helps me plan my day.
- There is little predictability in the weather here, so we never know what will come.
