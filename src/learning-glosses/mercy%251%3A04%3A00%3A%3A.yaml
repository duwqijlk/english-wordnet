simpleMeaning: Kind, easy treatment of a person who broke the law, shown by the court or the people who
  give out punishment
scope: Kind treatment of a law-breaker by a court, not help given to people in pain.
examples:
- He threw himself on the mercy of the court.
- The judge showed mercy to the young thief.
