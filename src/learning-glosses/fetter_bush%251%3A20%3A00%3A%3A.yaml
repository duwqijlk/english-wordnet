simpleMeaning: A striking evergreen shrub of the southeastern US, with glossy leaves, angular branches
  and rounded clusters of pink to reddish flowers.
scope: Another name for fetterbush; this is the showy shrub with pink to reddish flower clusters, not
  the fetterbush with small white bell-shaped flowers.
examples:
- Fetter bush was thick along the edge of the swamp.
- Its angled branches and pink flower clusters identify it as fetter bush.
