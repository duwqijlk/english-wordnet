simpleMeaning: a part of a piano, covered in felt (a thick soft cloth), that hits the strings and makes
  them shake
scope: This is the felt-covered part inside a piano, not the hand tool for nails and not the part of a
  gun.
examples:
- When she pressed the key, the hammer hit the piano string.
- A broken hammer inside the piano made one note sound weak.
