simpleMeaning: One thing can set off a run of like things, each bringing down the next, as a falling block
  brings down a whole row of blocks standing on end.
scope: This is what follows when one thing sets off a run of like things, not one thing alone.
examples:
- One late train had a domino effect on the whole timetable.
- The domino effect meant one small fault stopped the whole line.
