simpleMeaning: the main way to judge a firm's money health, turning its numbers into ratios set beside
  past ratios and those of other firms in the same or other trades
scope: The main money-ratio tool for judging a firm, not a single ratio and not a look at one firm's books
  alone.
examples:
- The bank used a ratio analysis to compare the firm's debts with its income.
- A ratio analysis showed the shop was doing worse than others in its trade.
