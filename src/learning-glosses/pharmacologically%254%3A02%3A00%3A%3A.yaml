simpleMeaning: In a way that has to do with the study of drugs and their effects.
scope: This is about something looked at through the study of drugs, not through the making of drugs,
  and not through one patient's treatment.
examples:
- Pharmacologically, this plant could have important uses.
- The drug was tested pharmacologically before it was sold.
