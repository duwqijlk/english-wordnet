synsetId: 01004814-n
simpleMeaning: The work of finding how long or wide very small things are, using a micrometer, a tool
  that measures tiny lengths.
scope: The work of finding how long or wide very small things are, using a micrometer, a tool that measures
  tiny lengths; not the tool itself, and not measuring large things.
examples:
- She used micrometry to measure the width of a single hair.
- Micrometry showed the parts were only a few thousandths of a millimetre wide.
