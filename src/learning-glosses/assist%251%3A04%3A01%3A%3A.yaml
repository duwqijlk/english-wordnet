simpleMeaning: the act of giving help that meets a need or moves an effort or a purpose forward
scope: Also called help, aid, and assistance. This is the noun for giving help that meets a need; it is
  not the verb sense of helping someone.
examples:
- He gave me an assist with the housework.
- Thank you for the assist with moving these boxes.
