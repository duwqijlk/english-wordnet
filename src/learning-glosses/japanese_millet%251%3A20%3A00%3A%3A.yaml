simpleMeaning: A coarse yearly grass grown in Japan and south-east Asia for its seeds to eat and for feed;
  a key food for wild animals in the United States.
scope: 'Also called billion-dollar grass, sanwa millet, Echinochloa frumentacea and Japanese barnyard
  millet: a coarse yearly grass grown in Japan and south-east Asia for its seeds to eat and for feed,
  a key food for wild animals in the United States; other coarse yearly grasses are grown for other uses
  or feed other animals.'
examples:
- Japanese millet is grown in Japan and south-east Asia for its seeds.
- Wild animals in the United States feed on Japanese millet.
