simpleMeaning: In logic, a statement that follows straight from the proof of another statement
scope: 'This is the logic sense: a new statement that follows from one already proved. It is not the everyday
  sense of a result that follows naturally in real life.'
examples:
- Once the theorem was proved, its corollary followed with no extra work.
- The corollary can be shown in two short lines from the main proof.
