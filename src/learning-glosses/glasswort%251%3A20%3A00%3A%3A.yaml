simpleMeaning: Thick stems, tiny scale-like leaves and small spikes of tiny flowers mark this fleshy plant
  of the seashore, once used in making a clear hard see-through stuff.
scope: Also called samphire, this is a fleshy plant of the seashore, not the bushy glasswort of salt marshes
  that is burned for soda ash.
examples:
- Glasswort grows along the seashore where the tide comes in.
- People once used glasswort in making glass.
