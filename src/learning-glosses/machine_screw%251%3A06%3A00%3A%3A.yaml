senseId: 'machine_screw%1:06:00::'
synsetId: 03707329-n
simpleMeaning: A fastener with a spiral groove round it, used with a nut or in a hole cut to match, with
  a slot in its head for a driver.
scope: A grooved fastener with a slotted head, used with a nut or a matching hole; not a nail and not
  a bolt without a slot.
examples:
- He tightened the machine screw with a screwdriver.
- The machine screw held the cover in place.
