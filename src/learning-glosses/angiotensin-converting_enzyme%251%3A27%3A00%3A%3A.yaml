simpleMeaning: A blood substance takes its second form when this body chemical cuts its first form.
scope: Angiotensin converting enzyme is another name for this body chemical, which cuts a blood substance
  from one form into another.
examples:
- The blood substance took its second form after angiotensin-converting enzyme had cut its first form.
- Angiotensin-converting enzyme works on the first form of a blood substance in the body.
