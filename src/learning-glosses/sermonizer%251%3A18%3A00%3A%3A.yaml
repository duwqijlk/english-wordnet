simpleMeaning: One whose work is preaching the gospel.
scope: This sense is also called preacher, for one whose work is preaching the gospel, where preacher
  is a person whose job is to speak to people about the gospel (the good news about Jesus in the Bible).
examples:
- The sermonizer preaches the gospel.
- Sermonizers preach the gospel.
