simpleMeaning: A condition in which a gland in the neck works too slowly, marked by dry skin, swelling
  round the lips and nose, and a failing mind.
scope: A condition in which a gland in the neck works too slowly, marked by dry skin, swelling round the
  lips and nose and a failing mind, also called myxedema; not a skin disease on its own and not a swelling
  from an injury.
examples:
- Myxoedema left her skin dry and her face swollen.
- The doctor treated his myxoedema with thyroid medicine.
