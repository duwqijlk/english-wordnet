simpleMeaning: Thick underground roots that people eat grow on a very tall plant from America that lives
  for years, from the middle and east of the United States to Canada.
scope: Also called a tall sunflower, this plant grows very tall in America and has thick underground roots
  that people eat.
examples:
- We dug up the roots of a giant sunflower to eat.
- Giant sunflowers grow from the middle of the United States to Canada.
