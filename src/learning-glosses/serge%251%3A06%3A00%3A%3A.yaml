simpleMeaning: a cloth made of wool, woven in a way that makes slanted lines on its surface
scope: This is a wool cloth woven so that it has slanted lines on its surface; it is not other kinds of
  cloth such as cotton or silk.
examples:
- His suit was made of dark blue serge.
- She chose serge for the skirt because the cloth was strong and warm.
