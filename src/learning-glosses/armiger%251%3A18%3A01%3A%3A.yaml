simpleMeaning: a squire who serves a knight and carries the knight's fighting gear
scope: 'Also called armor-bearer: a squire who carries a knight''s fighting gear, not the knight himself
  and not a servant who works in the house.'
examples:
- The armiger carried the knight's sword into the hall.
- As armiger, he walked behind his knight and bore his shield.
