simpleMeaning: To throw rays back in many directions as they pass through the tiny parts of a substance
scope: To send rays back as they pass through a substance, not to send them straight on and not to take
  them in.
examples:
- Dust in the air can backscatter the light from a lamp.
- The atoms backscatter the rays that pass through them.
