simpleMeaning: To make a thing look nice by sewing small round balls onto it
scope: To sew small round balls onto a thing to make it look nice, not a small round ball itself and not
  a strip of wood with a row of small round shapes on it.
examples:
- She beaded the wedding gown with tiny white beads.
- They beaded the dress for the show.
