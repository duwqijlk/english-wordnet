simpleMeaning: A set of steps in parts, usually four, joined by hinges that lock in place
scope: Steps in parts, usually four, that fold at joints and lock; not a fixed set of steps and not a
  rope one.
examples:
- He set up the articulated ladder to reach the high shelf.
- The articulated ladder folds at its joints for easy storage.
