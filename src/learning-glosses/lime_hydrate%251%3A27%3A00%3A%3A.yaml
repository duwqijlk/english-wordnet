simpleMeaning: A sharp stuff made by heating a kind of stone, which can burn the skin
scope: 'Also called lime, calcium hydrate, calcium hydroxide, caustic lime and hydrated lime: a sharp
  stuff made by heating a kind of stone, not the green fruit of the same name and not quicklime.'
examples:
- Builders mix lime hydrate into plaster to make it set.
- Wear gloves when you handle lime hydrate, as it can burn the skin.
