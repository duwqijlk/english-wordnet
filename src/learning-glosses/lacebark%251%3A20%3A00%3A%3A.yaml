simpleMeaning: a small tree or bush from New Zealand with many sweet-smelling pure white flowers in bunches
  where the leaves join the stem, whose bark is used to make rope
scope: 'Also called houhere and ribbonwood: a small New Zealand tree or bush with sweet-smelling white
  flowers, not a lace plant and not a tree grown for its wood.'
examples:
- A lacebark in the garden was covered in sweet-smelling white flowers.
- People once made rope from the bark of the lacebark tree.
