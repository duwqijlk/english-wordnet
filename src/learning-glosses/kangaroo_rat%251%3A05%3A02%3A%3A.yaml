simpleMeaning: Any of several kinds of small Australian animal, about the size of a rabbit and shaped
  like a small long-tailed animal, with long back legs for jumping
scope: This is one of a group of small Australian animals about the size of a rabbit, not a full-sized
  kangaroo and not a rabbit, and not the other sense of the same name.
examples:
- A kangaroo rat hopped across the dry grass.
- The kangaroo rat is about the size of a rabbit.
