simpleMeaning: Its back is reddish brown, and this common bird of Europe is blue and green.
scope: Also called Coracias garrulus; a common blue-and-green bird of Europe with a reddish-brown back,
  not a bird of a single colour.
examples:
- A European roller sat on the wire, its blue and green feathers bright in the sun.
- We saw a European roller with a reddish-brown back near the field.
