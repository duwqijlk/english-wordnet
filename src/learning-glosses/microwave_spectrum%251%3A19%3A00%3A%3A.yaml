simpleMeaning: Within the full range of waves that carry energy through space, the part made up of very
  short radio waves
scope: The band of very short radio waves in the range of waves that carry energy, not the band of visible
  light and not the band of long radio waves.
examples:
- The microwave spectrum is used to heat food in the oven.
- Astronomers study the microwave spectrum to learn about the early universe.
