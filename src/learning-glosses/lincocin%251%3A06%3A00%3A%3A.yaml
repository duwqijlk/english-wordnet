senseId: 'lincocin%1:06:00::'
synsetId: 03675948-n
simpleMeaning: A drug that kills germs, got from a streptomyces bacterium, used to treat some infections
  that penicillin cannot cure.
scope: 'Also called lincomycin: a drug got from a streptomyces bacterium, used against infections penicillin
  cannot cure, not a drug for all infections and not a drug made from penicillin.'
examples:
- The doctor gave Lincocin for the infection that penicillin could not cure.
- Lincocin is used to treat some infections that resist penicillin.
