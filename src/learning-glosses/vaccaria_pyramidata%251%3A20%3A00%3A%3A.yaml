simpleMeaning: A one-season European plant with pale rose-coloured flowers, a garden flower or a self-sown
  weed of grain fields, brought to North America and sometimes classed as a soapwort.
scope: Also called cow cockle, cowherb, Saponaria vaccaria, and Vaccaria hispanica; a one-season European
  plant with pale rose-coloured flowers, grown as a garden flower or found as a weed of grain fields,
  not the true soapwort and not a pink of the garden.
examples:
- Vaccaria pyramidata bears pale rose-coloured flowers in the grain field.
- We grew Vaccaria pyramidata as a garden flower last summer.
