simpleMeaning: Spread on the faces to be joined by solder, this substance cleans them so they hold together
  better.
scope: It is a substance spread on faces to be joined by solder, not the solder itself.
examples:
- Soldering flux was spread on the faces before they were joined by solder.
- The soldering flux cleaned the faces so the joint held well.
