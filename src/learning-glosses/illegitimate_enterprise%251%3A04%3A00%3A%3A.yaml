simpleMeaning: An unlawful business run for money, such as blackmail, fraud, selling drugs, or prostitution.
scope: An unlawful business run for money, such as blackmail, fraud, selling drugs, or prostitution; racket
  and fraudulent scheme are other names for it, not a lawful business and not a single crime done once.
examples:
- The police closed down the illegitimate enterprise running drugs through the port.
- An illegitimate enterprise can look like a real business from the outside.
