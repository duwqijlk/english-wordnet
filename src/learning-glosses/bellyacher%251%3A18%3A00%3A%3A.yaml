simpleMeaning: a person who keeps making too many complaints, with tears and a sad, high voice
scope: 'Also called a crybaby, whiner, complainer, grumbler and moaner: a person who keeps making too
  many complaints, not a person who makes one fair complaint and not a person who is truly hurt.'
examples:
- The bellyacher spent the whole trip moaning about the food and the heat.
- No one wanted to sit near the bellyacher at lunch.
