simpleMeaning: A talk in which a person who wants a post is asked questions, to find out if they fit the
  post
scope: A talk to find out if a person who wants a post fits it, also called an employment interview; not
  a talk to hire someone on the spot and not a chat about pay.
examples:
- Her job interview lasted an hour and she answered questions about her past work.
- He went to a job interview for a post at the bank.
