simpleMeaning: Timber and paper wood come from this middle-size tree of the east of North America, the
  chief one cut there.
scope: Also called eastern spruce and yellow spruce, this middle-size tree of the east of North America
  gives both timber and paper wood.
examples:
- Loggers cut the red spruce for timber.
- Paper mills use wood from the red spruce.
