scope: Also called Equatorial Guinean franc; this is the main money unit of that republic, not a coin
  of another land.
examples:
- The Equatoguinean franc is the main unit of money in Equatorial Guinea.
- Prices in Equatorial Guinea are given in Equatoguinean francs.
