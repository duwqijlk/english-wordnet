simpleMeaning: A law put to all the voters, who say yes or no to it at the end.
scope: A law sent to all the voters for a final yes-or-no vote, not a vote by lawmakers alone.
examples:
- The referendum on the new law will be held in June.
- Voters rejected the plan in a referendum last year.
