simpleMeaning: A common bird of prey of North America and Europe that makes its nest in wet low land and
  open country
scope: A bird of prey of North America and Europe that nests in wet low land and open country, with hen
  harrier and marsh hawk as other names for this sense; not a hawk of the woods, and not a sea bird.
examples:
- A northern harrier hunted low over the marsh.
- We saw a northern harrier nesting in the open moor.
