simpleMeaning: to become thin small pieces
scope: To become thin small pieces, not to come off in thin small pieces from a surface, not to cover
  something with thin small pieces, and not a person with an odd way of acting.
examples:
- As it dried, the mud flaked into thin pieces.
- The mixture flakes into thin small pieces as it cools.
