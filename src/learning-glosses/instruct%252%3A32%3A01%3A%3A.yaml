simpleMeaning: to tell a person what they should do to carry out a piece of work
scope: This is telling a person how to do a piece of work. It is not doing the work yourself.
examples:
- The teacher instructed the class to open their books and start the first task.
- She instructed him to check the machine before turning it on.
