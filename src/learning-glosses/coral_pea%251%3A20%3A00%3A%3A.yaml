simpleMeaning: any of several Australian climbing plants in the group Kennedia, with bright red flowers
scope: Any of several Australian climbing plants in the group Kennedia, with bright red flowers; not a
  climbing plant with blue flowers, and not a pea grown for food.
examples:
- The coral pea climbed over the fence with its scarlet flowers.
- Bright red flowers covered the coral pea as it climbed the garden wall.
