simpleMeaning: In Marxism, workers below the organised working class who do not seek change by revolution.
scope: In Marxism, workers below the organised working class who do not seek change by revolution; not
  the organised working class and not the middle class.
examples:
- Marx called the beggars and thieves part of the lumpenproletariat.
- The lumpenproletariat took no part in the workers' movement.
