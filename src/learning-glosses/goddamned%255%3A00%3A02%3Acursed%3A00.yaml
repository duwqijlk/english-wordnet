simpleMeaning: swear words used in everyday speech, not formal speech, to make other words sound stronger
scope: Swear words used in everyday speech to make other words stronger; damn, blame, damned, blessed,
  goddamn, blasted and blamed are other names for this sense, not the adverb use that shows anger or surprise
  on its own.
examples:
- He's a goddamned fool if he thinks that will work.
- It's a goddamned shame we missed the train.
