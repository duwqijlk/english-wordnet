simpleMeaning: A sickness passed down in a family that starts in grown-up life and ends with loss of memory
  and clear thought.
scope: A sickness that runs in families, not a sickness caught from others and not a sickness of childhood;
  also called Huntington's chorea.
examples:
- Huntington's disease runs in her family, and she fears she may get it one day.
- Huntington's disease first showed itself when he was forty.
