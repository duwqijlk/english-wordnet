simpleMeaning: A plant that often has many yellow-green orchid flowers with white pouches, growing by
  streams and seeps in the south-west of Oregon and the north of a warm western state.
scope: Also called Cypripedium californicum, it is the streamside plant of this kind, among other orchids
  with pouches, often bearing many yellow-green flowers with white pouches along streams and seeps from
  south-western Oregon into the north of a warm western state.
examples:
- California lady's slipper grew along the creek bank.
- The California lady's slipper flowers glowed pale in the shade.
