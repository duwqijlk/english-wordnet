simpleMeaning: The 4th to 7th tubes between the back ribs come together into this blood tube, which pours
  its blood into the azygos tube.
scope: 'Also called the accessory hemiazygos vein and the accessory hemiazygous vein: the 4th to 7th tubes
  between the back ribs come together into this blood tube, which pours its blood into the azygos tube.'
examples:
- The vena hemiazygos accessoria is formed by the union of the posterior intercostal veins.
- The vena hemiazygos accessoria empties into the azygos vein.
