simpleMeaning: stuck in a difficult situation and unable to get free, as if caught in deep mud.
scope: This is about being trapped by difficulties, not about choosing to take part or about strong feelings
  for someone.
examples:
- He was so involved in debt that he could not see a way out.
- The country found itself involved in a costly war.
