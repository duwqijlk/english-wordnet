simpleMeaning: An Asian temple, usually a tall tower shaped like a pyramid with a roof that curves up
  at the edges
scope: This is a temple building in Asia, usually a tall tower with a roof that curves up; it is not any
  Asian building and not a church or mosque.
examples:
- We visited a tall pagoda by the lake in Japan.
- The pagoda's roof curves up at the edge of each level.
