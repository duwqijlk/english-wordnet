simpleMeaning: Loose bunches of green flowers, touched with purple, grow on this small tree from the warm
  lands of Central America.
scope: This small Central American tree is also called tree celandine, and it is not the Chinese and Japanese
  herb of the same name.
examples:
- They picked a loose bunch from the bocconia.
- We watched the bocconia open its loose green flowers.
