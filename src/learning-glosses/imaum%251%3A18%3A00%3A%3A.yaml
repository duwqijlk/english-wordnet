simpleMeaning: In Islam, the man who says the prayers for the people in a mosque; for Shiites, also a
  known authority on Islamic teaching and law and a guide in faith
scope: 'Also called an imam: in Islam, the man who leads prayers in a mosque, not a priest and not a preacher
  in general.'
examples:
- The imaum led the evening prayers in the mosque.
- People asked the imaum to guide them in matters of faith.
