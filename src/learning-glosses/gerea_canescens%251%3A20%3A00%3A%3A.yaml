simpleMeaning: A slender hairy plant with few leaves and golden-yellow flower heads, found in sandy desert
  from southeastern California to southwestern Utah and western Arizona and northwestern Mexico.
scope: Also called desert sunflower; a hairy desert plant with yellow flower heads, not a true sunflower.
