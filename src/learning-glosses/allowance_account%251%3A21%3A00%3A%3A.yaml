simpleMeaning: a store of money set aside from a firm's profits to cover a change in the worth of the
  things the firm owns
scope: This is money set aside from a firm's profits to cover a change in the worth of the things it owns;
  allowance is another name for this sense, and it is not a bank account for everyday use and not a fund
  for paying bills.
examples:
- The firm opened an allowance account to cover a fall in the worth of its goods.
- The allowance account holds money set aside from profits.
