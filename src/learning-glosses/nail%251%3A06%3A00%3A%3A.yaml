simpleMeaning: a thin piece of metal with a sharp end, hit with a hammer into wood or other things to
  hold them together
scope: A thin metal pin for holding things together, not the hard part on a finger or toe and not an old
  measure of length for cloth.
examples:
- He hammered a nail into the wall to hang the picture.
- She used two nails to fix the loose board in place.
