simpleMeaning: a stop in the working of something for a short time, such as a computer
scope: A short stop in the working of something, such as a computer, not an amount of goods lost in storage
  or transport.
examples:
- There will be a network outage from 8 to 10 a.m.
- The outage cut power to the whole street.
