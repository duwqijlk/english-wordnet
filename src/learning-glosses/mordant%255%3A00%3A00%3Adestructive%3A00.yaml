senseId: mordant%5:00:00:destructive:00
synsetId: 00590069-s
simpleMeaning: Said of a substance, especially a strong acid, that can eat away or destroy a thing by
  chemical action.
scope: 'Also called caustic, corrosive, vitriolic, and erosive: a substance that eats away by chemical
  action, not the dye-fixing sense and not bitter words.'
examples:
- The liquid is mordant and eats away metal.
- That cleaner is mordant enough to burn skin.
