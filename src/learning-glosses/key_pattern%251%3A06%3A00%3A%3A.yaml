simpleMeaning: A pretty design of lines that run up and down and side to side, over and over, most times
  raised above the flat face.
scope: A fret is another name for this pretty repeated design of straight lines, most times raised above
  the flat face.
examples:
- A simple key pattern ran along the top of the wall.
- The key pattern stood out from the flat face.
