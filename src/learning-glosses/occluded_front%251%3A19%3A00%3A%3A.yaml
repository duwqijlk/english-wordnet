senseId: 'occluded_front%1:19:00::'
synsetId: 11481479-n
simpleMeaning: In weather science, a line formed when cold air closes round a mass of warm air and lifts
  it.
scope: A weather line where cold air has closed round warm air and lifted it, also called occlusion; not
  a warm line and not a cold line.
examples:
- The occluded front brought rain as the warm air rose.
- Rain fell along the occluded front.
