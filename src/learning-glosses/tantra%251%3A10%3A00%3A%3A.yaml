simpleMeaning: Hindu or Buddhist holy writings from fairly new times that set out rites for the body,
  speech, and mind
scope: Hindu or Buddhist holy writings from fairly new times that set out rites for the body, speech,
  and mind; not old holy writings and not writings about gods alone.
examples:
- The scholar studied a tantra on the rites of the body.
- This tantra sets out acts of speech and mind for worship.
