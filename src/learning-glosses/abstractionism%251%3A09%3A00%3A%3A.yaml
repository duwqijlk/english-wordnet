simpleMeaning: a work that refers to no real thing and no clear example
scope: This is a work that refers to no real thing and no clear example; not a picture of a real scene,
  and not the art movement that builds on inner form.
examples:
- The abstractionism of the painting left viewers to guess at its subject.
- Her abstractionism avoids any shape you could name from daily life.
