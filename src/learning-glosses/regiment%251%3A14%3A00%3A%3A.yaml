simpleMeaning: a group of soldiers smaller than a division, often split into two battalions made up of
  companies, squadrons, or batteries
scope: An army unit below a division, not the act of putting people under strict order.
examples:
- The regiment marched through the town at first light.
- He served with the same regiment for ten years.
