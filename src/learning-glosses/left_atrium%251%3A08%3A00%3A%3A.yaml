simpleMeaning: The upper room on one side of the heart that takes in blood from the veins of the lungs
scope: 'Another name for left atrium of the heart and atrium sinistrum: the upper room of the heart that
  takes in blood from the veins of the lungs, not the lower room that pumps blood out.'
examples:
- The left atrium receives blood from the lungs.
- Doctors measured the pressure in her left atrium.
