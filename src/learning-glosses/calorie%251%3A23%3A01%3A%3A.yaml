simpleMeaning: a unit of heat, the amount that warms one gram of water by one degree centigrade at normal
  air pressure
scope: This is the small calorie, a measure of heat; not the large food calorie that warms one kilogram
  of water.
examples:
- One calorie warms one gram of water by one degree.
- Scientists once used the calorie as a unit of heat.
