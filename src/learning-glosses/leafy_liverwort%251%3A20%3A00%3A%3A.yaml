simpleMeaning: A plant like moss, with tiny scale-like parts, that usually grows on other plants
scope: A moss-like plant with tiny scale-like parts; not a true moss, and not a liverwort with no leaves
  at all.
examples:
- The leafy liverwort grew in a soft green mat on the tree trunk.
- A leafy liverwort covered the damp bark with tiny green scales.
