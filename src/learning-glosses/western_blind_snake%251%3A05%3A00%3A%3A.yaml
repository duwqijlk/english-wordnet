simpleMeaning: A burrowing animal of the west of the United States digs among the roots of bushes and
  under rocks, in desert and rocky hillsides and in beach sand.
scope: A burrowing snake of desert and rocky ground in the west of the United States.
examples:
- The western blind snake burrowed beneath the rocks.
- A western blind snake hid among the roots of the shrubs.
