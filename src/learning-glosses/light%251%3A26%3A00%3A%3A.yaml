simpleMeaning: The condition of a place or time when there is a great amount of brightness.
scope: This is not the shining quality of an object, nor the use of brightness in a picture; it is the
  condition of a place or time being well lit.
examples:
- They played outside as long as there was light.
- The kitchen has plenty of light in the morning, thanks to the big windows.
