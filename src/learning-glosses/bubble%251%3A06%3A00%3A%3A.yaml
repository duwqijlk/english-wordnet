simpleMeaning: a round cover, shaped like the top half of a ball, made of glass or plastic that you can
  see through
scope: A hard round cover you can see through, not a small ball of gas and not a risky plan.
examples:
- The pilot sat under a glass bubble over the front of the plane.
- A clear plastic bubble covers the food on display to keep it clean.
