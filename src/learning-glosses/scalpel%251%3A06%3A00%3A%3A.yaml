simpleMeaning: a thin, straight knife used to cut the body during an operation, or to cut a body open
  to study it
scope: A doctor's thin, straight knife for cutting the body, not a knife for food and not a knife for
  general cutting work.
examples:
- The surgeon picked up a scalpel and made a small cut.
- She used a clean scalpel to cut the tissue.
