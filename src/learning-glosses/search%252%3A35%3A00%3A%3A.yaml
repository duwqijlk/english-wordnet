simpleMeaning: To try hard to find a person or thing, or to find out whether something is real.
scope: This is not about looking through a place or container; it is about trying to find a person or
  thing, or to learn whether something exists.
examples:
- Police are still searching for the stolen car.
- Scientists are searching for a cure for the disease.
