simpleMeaning: At the back of a shoe or boot, a piece of leather gives the shoe its shape and holds the
  foot firm
scope: A piece of leather at the back of a shoe or boot, also called a counter, not the sole and not the
  front of the shoe.
examples:
- The heel counter of my boot had gone soft and would not hold its shape.
- He pressed the heel counter to check that it was still stiff.
