simpleMeaning: Meat from the side and back of an animal. It is cut from the part between the ribs and
  the rump.
scope: This is a piece of meat for eating, not the part of a body on the side between the hip bone and
  the ribs.
examples:
- She roasted a loin of pork for dinner.
- The butcher cut the loin into thick pieces.
