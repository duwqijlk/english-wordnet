synsetId: 08576692-n
simpleMeaning: In law, the home a person means to come back to whenever away, where they have their main
  base; each person must have only one such home at a time.
scope: 'Also called domicile: in law, the home a person means to come back to whenever away.'
examples:
- Her legal residence was the house where she had her main base.
- He kept his legal residence in the town where he meant to return.
