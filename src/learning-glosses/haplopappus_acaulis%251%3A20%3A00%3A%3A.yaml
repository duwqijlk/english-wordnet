simpleMeaning: A dark green upright herb of the north-west United States and south-west Canada, with stiff
  leaves in thick bunches and yellow flower heads; at times put in its own genus
scope: Also called a stemless golden weed and Stenotus acaulis, it grows in the north-west United States
  and south-west Canada and is known for its stiff leaves in thick bunches and its yellow flower heads.
examples:
- Haplopappus acaulis grows in the north-west with stiff leaves.
- The yellow flower heads of Haplopappus acaulis open in summer.
