synsetId: 07534279-n
simpleMeaning: a feeling of being very annoyed because you are being hurt in your mind or feelings
scope: This is the very annoyed feeling caused by someone troubling you, not the strong suffering or pain
  feeling, and not the act of troubling someone in mind.
examples:
- His brother's endless teasing was a torment to her.
- The loud music from next door all night was a torment.
