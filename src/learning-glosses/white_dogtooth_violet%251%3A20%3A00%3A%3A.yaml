simpleMeaning: On this North American plant, one pale flower at a time opens, yellow in the middle and
  blue or pink outside.
scope: Also called white dog's-tooth violet and blonde lilian, it opens one pale flower at a time, yellow
  in the middle and blue or pink outside, never in bunches.
examples:
- A white dogtooth violet opened one pale flower.
- The white dogtooth violet showed blue on the outside.
