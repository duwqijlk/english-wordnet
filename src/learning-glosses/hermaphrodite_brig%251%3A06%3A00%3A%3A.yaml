simpleMeaning: Square sails on the front mast and sails set along the ship on the back mast mark this
  two-masted sailing ship.
scope: Also called brigantine, this is a two-masted sailing ship with square sails on the front mast and
  sails set along the ship on the back mast, not a one-masted boat.
examples:
- The hermaphrodite brig sailed into the harbour with both masts set.
- A hermaphrodite brig carries square sails on its foremast.
