synsetId: 00417926-v
simpleMeaning: to make things the same as each other, the same all through, or well matched to each other
scope: 'Also called match, equal, and equalize: making things the same or well matched, not just thinking
  of two things as the same, and not being the same in maths.'
examples:
- The boss equated the pay for the two jobs so both groups got the same.
- They equated the hours across the team, giving each person the same number of shifts.
