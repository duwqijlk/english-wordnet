simpleMeaning: One of many kinds of North American plant in a group called Liatris, with clusters or loose
  bunches of small flat round flower tops.
scope: Also called button snakeroot, gay-feather, gayfeather, and snakeroot, this North American plant
  is the one in the Liatris group with clusters of small flat round flower tops, not the kind with white
  stems and large pale yellow flowers.
examples:
- Blazing star grows with long clusters of small flowers.
- The blazing star has flat round flower tops.
