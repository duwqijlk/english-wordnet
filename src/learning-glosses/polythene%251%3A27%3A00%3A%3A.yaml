simpleMeaning: Used most often to wrap things and to keep heat in, this light stuff goes soft when hot
scope: Also called polyethylene, this light stuff goes soft when hot and is used most often to wrap things
  and to keep heat in, not a heavy hard stuff used to build things.
examples:
- The sandwiches were wrapped in polythene.
- Polythene round the pipes keeps the heat in.
