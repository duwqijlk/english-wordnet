simpleMeaning: The flag flown by a ship to show which country it belongs to.
scope: The flag a ship flies to show its country, not a naval officer, and not a general emblem flown
  as a sign of nationality.
examples:
- The ship lowered its ensign as it entered the harbour.
- An ensign flew from the stern of the boat.
