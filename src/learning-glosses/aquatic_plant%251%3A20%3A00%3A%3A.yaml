simpleMeaning: a plant that grows in water, some of it or all of it, either fixed in the mud like a lotus
  or floating free like a water hyacinth
scope: 'Also called hydrophyte, hydrophytic plant, and water plant: a plant that grows in water, not a
  plant that grows on dry land.'
examples:
- The aquatic plant floated on the pond without any roots in the mud.
- Lotus is an aquatic plant that roots in the mud.
