simpleMeaning: the form that shows a simple quality on its own, with no more, less, or change in size
  or amount
scope: Also called positive adverb, this is the plain form of an adverb that shows a simple quality, not
  the form that makes a comparison with more or less.
examples:
- In the sentence 'She drove fast', the word 'fast' is a positive-degree adverb.
- '''Hard'' in ''She worked hard'' is a positive-degree adverb.'
