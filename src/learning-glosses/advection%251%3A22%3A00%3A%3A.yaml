simpleMeaning: In weather science, the sideways movement of heat or other things in the air
scope: In weather science, the sideways movement of heat or other things in the air, not the rising or
  falling of air and not the movement of water.
examples:
- Advection brought warm air from the south.
- The advection of cold air lowered the temperature overnight.
