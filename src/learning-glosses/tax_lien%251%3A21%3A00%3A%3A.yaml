simpleMeaning: A lien a tax collector may use when taxes are not paid, similar to a judgment lien.
scope: A claim on property that a collector can use when the money owed to the state goes unpaid, much
  like the claim a court gives after a judgment.
examples:
- The tax lien let the collector hold the house until the taxes were paid.
- He found a tax lien on the land for unpaid taxes.
