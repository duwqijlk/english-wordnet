simpleMeaning: The soft meat of the loin muscle on each side of the back bone
scope: The soft meat of the loin muscle on each side of the back bone, also called undercut; not a chop
  and not the meat of the leg.
examples:
- The butcher cut a tenderloin from the side of the spine.
- Roast tenderloin is soft enough to cut with a fork.
