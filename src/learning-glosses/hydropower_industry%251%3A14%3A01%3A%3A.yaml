simpleMeaning: All the businesses that make electricity and other energy from water that falls or flows
scope: All the businesses that make electricity and other energy from falling or flowing water, not a
  single dam and not the making of electricity from coal or wind.
examples:
- The hydropower industry grew as more dams were built along the river.
- Jobs in the hydropower industry include building dams and running turbines.
