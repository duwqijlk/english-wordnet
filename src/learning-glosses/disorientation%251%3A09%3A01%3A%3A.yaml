simpleMeaning: a feeling of being mixed up, usually for a short time, about where you are, what to do
  next, and which way to go
scope: This is the usual short feeling of not knowing where you are or which way to go, not the wild false
  beliefs a person may get from a drug that affects the mind.
examples:
- After the long flight, his disorientation lasted an hour, and he could not find the way out of the airport.
- The fever gave her a brief disorientation, so she did not know which room was hers.
