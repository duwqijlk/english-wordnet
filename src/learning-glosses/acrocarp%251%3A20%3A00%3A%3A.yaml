simpleMeaning: The tiny egg-holder caps the main stem of this moss, and the spore case sits on top of
  it.
scope: Also called acrocarpous moss, this names the moss whose main stem is capped by the tiny egg-holder,
  with the spore case on top of it.
examples:
- The acrocarp bore its capsule at the tip of the main stem.
- In the damp wood, acrocarp grew with its spore case at the tip of the main stem.
