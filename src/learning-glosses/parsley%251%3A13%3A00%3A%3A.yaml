simpleMeaning: a plant with a pleasant smell, its flat or curly leaves cut into small pieces and put on
  food to make it look and taste better
scope: This is the leaves cut up and put on food, not the living plant itself, described by whether it
  lives for one year or for many years.
examples:
- She put fresh parsley on top of the soup.
- He cut the parsley into small pieces and spread it over the fish.
