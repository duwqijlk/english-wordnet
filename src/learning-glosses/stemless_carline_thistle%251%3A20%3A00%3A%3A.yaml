simpleMeaning: A stemless perennial thistle of alpine southern and eastern Europe, with large flowers
  whose white or purple-brown florets sit in a rosette of long, spiny leaves hairy beneath.
scope: The alpine carline thistle that never grows a stem; not the common carline thistle, which has an
  upright leafy stem, and not the lowland stemless thistles of pastures. Botanical.
examples:
- A stemless carline thistle grew flat against the limestone, its flower head ringed by spiny leaves.
- We found stemless carline thistles only high in the eastern Alps.
