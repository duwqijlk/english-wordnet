simpleMeaning: when a part of the body or one of its organs reacts too strongly to something
scope: 'This is the body sense: a body part or organ that reacts too strongly, not a bad temper and not
  a cross, angry feeling.'
examples:
- The doctor tested the irritability of the muscle in her leg.
- Irritability of the bowel can cause pain after eating.
