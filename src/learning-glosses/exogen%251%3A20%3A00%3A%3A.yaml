simpleMeaning: A flowering plant with two seed leaves, whose stem grows by adding layers on its outside.
scope: A flowering plant with two seed leaves; also called a dicot, a dicotyledon, or a magnoliopsid,
  not a plant with one seed leaf and not a plant without flowers.
examples:
- The oak is an exogen, growing by layers on the outside of its stem.
- Exogens have two seed leaves when they sprout.
