simpleMeaning: A church feast twelve days after Christmas, marking the visit of the three wise men to
  the baby Jesus.
scope: This feast is also called Epiphany, January 6, Three Kings' Day, and Twelfth day, and it marks
  the wise men's visit, not Christmas itself.
examples:
- Epiphany of Our Lord falls twelve days after Christmas.
- On Epiphany of Our Lord, the church remembers the three wise men.
