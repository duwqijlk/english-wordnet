simpleMeaning: Any of many marine fishes whose long spiny body can swell with water or air into a ball;
  some carry a strong nerve poison; closely related to spiny species.
scope: This is the fish that puffs into a spiny ball, not the dangerous dish made from it and not the
  related spiny puffers; 'blowfish', 'globefish' and 'puffer' are other names for the same fish.
examples:
- A pufferfish inflated the moment the diver came close.
- Some pufferfish carry a nerve poison strong enough to kill.
