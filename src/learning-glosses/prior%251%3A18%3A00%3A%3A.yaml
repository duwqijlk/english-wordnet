simpleMeaning: the head of a community of monks, ranking just below an abbot in an abbey.
scope: This sense is not the adjective meaning 'earlier' or 'before', and not the abbot himself, but the
  office just below the abbot.
examples:
- The prior welcomed the pilgrims at the abbey gate.
- When the abbot was away, the prior led the daily prayers.
