simpleMeaning: a secret set of religious acts in groups that worshipped old Greek or Roman gods, with
  singing, dancing, drinking, and sex
scope: This is the secret set of religious acts of old Greece or Rome, not the wild modern party with
  too much drinking and open sex listed for the same word elsewhere.
examples:
- The ancient Greeks held an orgy in honour of their god, with singing and dancing late into the night.
- In the old Roman cult, an orgy was a secret rite with drinking and sex.
