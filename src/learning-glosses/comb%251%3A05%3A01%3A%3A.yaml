simpleMeaning: The soft red raised bit of skin on top of the head of a hen, a cock, or a bird like them.
scope: The red crest on a hen's or cock's head, not the swimming plate of a sea animal and not the tool
  for hair.
examples:
- The cock's comb stood bright red on its head.
- The hen's comb was small and pale beside the cock's.
