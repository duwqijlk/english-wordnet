simpleMeaning: At the base of the brain, pale threads run in a curve from the memory part of each side
  to the other side and to two parts deep inside.
scope: 'Also called a fornix: a curved bundle of pale threads at the base of the brain joining the memory
  parts of the two sides.'
examples:
- The trigonum cerebrale runs along the base of the brain.
- The trigonum cerebrale joins each side's hippocampus to the other side.
