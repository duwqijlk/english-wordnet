simpleMeaning: In a casual way that shows no care for the feelings of others.
scope: Casually, without thought for others, also called offhand or offhanded; not merely in a relaxed
  way.
examples:
- She dismissed him offhandedly, without even looking up.
- He replied offhandedly that he had forgotten.
