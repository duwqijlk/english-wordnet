senseId: unconvincing%5:00:00:implausible:00
synsetId: 01805119-s
simpleMeaning: so unlikely to be true that people do not believe it
scope: Also called unlikely, unbelievable, and improbable. This describes something said or shown, such
  as a story or a reason, that people do not believe because it seems too unlikely to be true. Not something
  that is only hard to understand or only strange.
examples:
- His excuse for being late was unconvincing.
- The witness gave an unconvincing account of that night.
