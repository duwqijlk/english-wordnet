simpleMeaning: In electronics, of a circuit or a tool whose output grows or falls in the same step as
  what goes in
scope: 'Also called linear, and another name for it is analogue: this is the electronics sense for a circuit
  or tool, not the noun sense of a thing that is like another thing.'
examples:
- An analog circuit gives an output that changes in step with the input.
- The old radio uses an analog amplifier, not a digital one.
