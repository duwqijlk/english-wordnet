simpleMeaning: To place something centrally, between other things.
scope: This rare verb means to place an object centrally, as when arranging things on a shelf. It is not
  the noun for the central part or the adjective for a period between two others, and modern English usually
  prefers 'centre' or 'put in the middle'.
examples:
- She middled the vase on the table and stepped back.
- He middled the star at the very top of the tree.
