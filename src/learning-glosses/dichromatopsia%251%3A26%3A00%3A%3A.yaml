simpleMeaning: Most people need three kinds of light to match any shade, but a person with this lack of
  colour sight can do it with only two.
scope: Also called dichromacy, dichromasy, dichromatism and dichromia; it is a lack in colour sight, not
  the full colour sight of most people, who need three kinds of light to match a shade.
examples:
- With dichromatopsia, she matches any shade by mixing two kinds of light.
- Dichromatopsia means he needs only two kinds of light to match a shade.
