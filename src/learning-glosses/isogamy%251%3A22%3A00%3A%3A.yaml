senseId: 'isogamy%1:22:00::'
synsetId: 13524716-n
simpleMeaning: Two sex cells of the same size and shape join, and in biology that joining is how young
  are made
scope: In biology, making young by joining two sex cells of the same size and shape; not joining sex cells
  of different sizes and not making young without sex cells.
examples:
- Isogamy takes place when two gametes of the same size meet.
- Some simple sea plants use isogamy to make new plants.
