simpleMeaning: In genetics, a male cell with one set joining a female cell with one set makes a cell with
  two sets, and the living thing that grows from it
scope: This cell is also called a zygote, and it differs from an unjoined egg cell by holding two sets.
examples:
- A fertilized ovum holds two sets, one from each parent cell.
- The fertilized ovum grew into a living thing.
