simpleMeaning: A nitrogen part of RNA, made from a ring-shaped chemical called pyrimidine and never found
  in DNA, that joins with adenine.
scope: This is a nitrogen part of RNA, never found in DNA, and it joins with adenine, not the adenine
  itself.
examples:
- Uracil pairs with adenine in RNA.
- RNA holds uracil where DNA holds a different base.
