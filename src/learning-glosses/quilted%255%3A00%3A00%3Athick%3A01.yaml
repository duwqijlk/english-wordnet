simpleMeaning: Cloth in layers, stitched through in a pattern so the layers stay together
scope: Cloth made of layers sewn together in a pattern; not a single sheet of cloth, and not cloth joined
  in a plain way.
examples:
- She wore a quilted jacket on the cold morning.
- The quilted cover kept the bed warm through the night.
