simpleMeaning: a way of printing in which a plate puts an inked mark on a rubber-covered roller, which
  then puts it on the paper
scope: A way of printing by roller; not a plant shoot, and not the act of making an offset.
examples:
- The book was printed by offset.
- Offset gives a clean, sharp print.
