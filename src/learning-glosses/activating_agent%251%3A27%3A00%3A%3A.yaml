simpleMeaning: In mining, a chemical that works on surfaces to make one chosen kind of mineral cling more
  strongly to air bubbles.
scope: In mining, this chemical is used when one chosen kind of mineral must be made to cling more strongly
  to air bubbles.
examples:
- The plant added activating agent to the tank so the chosen rock would cling to the bubbles.
- Without activating agent, the rock would not cling to the air bubbles.
