simpleMeaning: the part of the study of language that looks at the different ways people speak
scope: The study of the different ways people speak; not a book of maps of ways of speaking, and not the
  study of language in general.
examples:
- She took a course in dialectology to learn how speech changes from town to town.
- Dialectology helps us see why the same word sounds different in the north and the south.
