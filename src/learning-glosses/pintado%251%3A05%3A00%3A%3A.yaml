simpleMeaning: a large mackerel, a sea fish good to eat, found in the mild coastal waters of the Atlantic
  off the United States
scope: 'Also called kingfish and cero: a large sea fish good to eat from the mild Atlantic coastal waters
  off the United States, not a fresh-water fish and not a small bait fish.'
examples:
- The pintado is a large fish caught off the Atlantic coast.
- Fishermen sell pintado in the markets of the eastern United States.
