simpleMeaning: If a bank across the country, or another approved money house, cannot pay its savers, this
  state-backed body covers the money in their accounts.
scope: Also called the Federal Deposit Insurance Corporation, this is the state-backed body that covers
  the money in accounts at banks across the country and at other approved money houses, not a bank itself
  and not a savings account.
examples:
- The FDIC guards money held in banks.
- Her savings are safe because the FDIC guards the bank.
