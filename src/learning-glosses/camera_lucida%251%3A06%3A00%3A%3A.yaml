simpleMeaning: A person looking through a part fixed to this tool for looking sees at the same time the
  picture of a thing and the paper for drawing it.
scope: A tool for looking that shows a thing and the paper for drawing it at once, not a tool that takes
  a photograph.
examples:
- With a camera lucida, she could see the flower and her paper at the same time.
- He used a camera lucida to sketch the leaf while looking at it.
