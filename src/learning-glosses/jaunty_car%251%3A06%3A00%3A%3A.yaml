simpleMeaning: An open vehicle with two wheels, pulled by one horse, once much used in Ireland.
scope: An open two-wheeled vehicle pulled by one horse, once much used in Ireland; jaunting car is another
  name for it, not a closed vehicle and not one pulled by two horses.
examples:
- The jaunty car took us to the station.
- We hired a jaunty car for the day.
