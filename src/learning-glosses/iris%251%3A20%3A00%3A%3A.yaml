simpleMeaning: A plant with sword-like leaves and upright stems, whose bright flowers have three petals
  and three drooping sepals.
scope: This is the flowering plant, not the colored ring around the pupil of the eye.
examples:
- The iris by the fence came up purple again this spring.
- Irises have stiff upright stems and bright flowers with three drooping sepals.
