simpleMeaning: In music, a sign that shows a bar holds two or four half notes
scope: A sign in music about how many half notes fit in a bar, not a sign that tells how fast to play
  and not a mark that shows how loud to play.
examples:
- The piece is written in alla breve, so each bar has two half notes.
- She played the alla breve passage with a steady beat.
