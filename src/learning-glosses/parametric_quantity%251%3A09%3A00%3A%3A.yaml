simpleMeaning: a fixed number in the rule for a curve that can be changed to give a set of curves of the
  same kind
scope: A fixed number in the rule for a curve that can be changed to give a set of curves of the same
  kind; parameter is another name for this sense, and it is not a number that changes on its own or the
  curve itself.
examples:
- Changing the parametric quantity gives a new curve of the same kind.
- The parametric quantity stays fixed for one curve.
