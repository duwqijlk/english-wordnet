simpleMeaning: Said of the shape of a leaf, cut into finger-like parts rather than rounded ones
scope: Said of a leaf shape cut into finger-like parts rather than rounded ones, not the palmate leaf
  shape with lobes spreading from one point.
examples:
- The sycamore leaf is palmatifid, cut almost to the middle.
- A palmatifid leaf is split like fingers, not rounded like a lobe.
