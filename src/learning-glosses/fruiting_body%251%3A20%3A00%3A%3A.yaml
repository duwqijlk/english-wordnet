simpleMeaning: the part of a living thing that makes tiny seed-like cells
scope: A part of a plant or fungus that makes tiny seed-like cells, not a root and not a leaf.
examples:
- The fruiting body of the mushroom rose above the soil.
- Spores are released from the fruiting body when it is ripe.
