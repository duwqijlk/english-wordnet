simpleMeaning: At its base this soup from Russia or Poland most often has beet juice.
scope: A soup from Russia or Poland, also called borscht, borsch, borsh, borshch and borsht.
examples:
- The bortsch was served with beet juice at its base.
- They finished the bortsch and asked for a second bowl.
