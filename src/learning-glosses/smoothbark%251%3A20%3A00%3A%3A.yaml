simpleMeaning: any of a few kinds of Australian gum tree whose outer covering is even all the way up,
  except near the bottom of the trunk
scope: An Australian gum tree with a smooth outer covering except near the bottom of the trunk, not a
  tree with rough bark all over and not a pine.
examples:
- The smoothbark by the track had a pale trunk that was smooth to the top.
- Several smoothbarks grow on the dry hills of Australia.
