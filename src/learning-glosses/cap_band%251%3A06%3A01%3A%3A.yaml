scope: A strip that goes round the head covering worn by members of the armed forces, often dark and in
  a colour that stands out, often black, sometimes patterned or striped; not the whole head covering and
  not a badge.
examples:
- The officer's cap band was dark blue with gold leaves.
- His cap band marked him as a senior officer.
