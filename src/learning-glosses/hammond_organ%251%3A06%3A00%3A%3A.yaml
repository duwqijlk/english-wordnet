simpleMeaning: In music, an electric machine that makes sounds like a pipe instrument
scope: Also called the organ, the electric organ, or the electronic organ; an electric machine that copies
  the sound of a pipe instrument, not a real pipe instrument.
examples:
- He played the Hammond organ at the dance.
- The Hammond organ sounds like a pipe instrument.
