simpleMeaning: a small, thin piece of metal, plastic, or ivory used to pluck the strings of a guitar or
  other stringed instrument.
scope: This is not the act of choosing or a tool for breaking ground; it is the small piece used on a
  stringed instrument.
examples:
- He dropped his pick inside the guitar and had to shake it out.
- She prefers a thin plastic pick to her fingers.
