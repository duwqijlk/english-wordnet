simpleMeaning: A blackbird of North America whose blue-black feathers have rusty edges in the autumn.
scope: Also called the rusty blackbird and rusty grackle, this is a blackbird of North America whose blue-black
  feathers show rusty edges in the autumn; not a blackbird that stays plain black all year, and not a
  blackbird from outside North America.
examples:
- Euphagus carolinus flew past, its blue-black feathers edged with rust.
- In the fall, Euphagus carolinus shows rusty edges on its feathers.
