simpleMeaning: one of the two soft, fleshy parts on a woman's chest that make milk
scope: One of the two soft parts on a woman's chest that make milk; breast, tit and bosom are other names
  for this sense, and it is not a door knocker or a boastful person.
examples:
- The nurse checked the mother's knockers after the birth.
- She laughed and said her knockers were sore from nursing.
