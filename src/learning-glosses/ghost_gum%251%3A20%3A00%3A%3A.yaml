simpleMeaning: a small to medium tree of Australia and Tasmania with smooth white to light grey bark that
  comes off in patches or strips
scope: 'Also called snow gum and white ash: a small to medium tree of Australia and Tasmania with smooth
  white to light grey bark that comes off in patches or strips, not a gum tree with rough dark bark.'
examples:
- A ghost gum stood by the road, its white bark peeling in long strips.
- Ghost gums grow across much of Australia and Tasmania.
