simpleMeaning: a person or kind, living now or no longer living, that thinks at a high level, speaks clearly,
  and walks upright
scope: 'Also called man, human, and human being: a person or kind that thinks, speaks, and walks upright.
  It is not the sense about a person who loves people of the same sex.'
examples:
- Scientists study old bones to learn how early homo lived.
- Every person alive today is a homo who can speak and walk upright.
