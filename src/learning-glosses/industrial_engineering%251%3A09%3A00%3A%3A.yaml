simpleMeaning: The study of how to plan and run work systems that bring people, stuff and power together
  to make things well.
scope: The study of planning and running work systems that bring people, stuff and power together, not
  the study of machines alone and not the running of a business alone; industrial management is another
  name for this sense.
examples:
- She studied industrial engineering at college.
- Industrial engineering helps factories work better.
