simpleMeaning: a strong leather glove worn to keep the hand safe
scope: A leather glove that guards the hand, also called gauntlet and metal glove; not the punishment
  of running between two lines of men, and not a narrow place where two railroad tracks meet.
examples:
- The falconer wore a gantlet when the bird landed on his hand.
- He pulled on a thick gantlet before handling the thorny branches.
