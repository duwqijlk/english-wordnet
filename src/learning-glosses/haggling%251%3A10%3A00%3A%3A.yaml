simpleMeaning: one time of arguing hard, as when trying to agree on a price
scope: 'Also called haggle, wrangle and wrangling: one strong argument, as over a price; not quiet talk
  and not a fight with hands.'
examples:
- After an hour of haggling, the seller lowered the price.
- There was a lot of haggling at the market before they agreed.
