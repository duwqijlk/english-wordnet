simpleMeaning: the quality of being bent out of a straight line or shape
scope: The state of being bent away from a straight path or shape; not the move of a pointer on a measuring
  tool from its zero point, not the amount a wave is bent, and not a strange, wrong way of judging.
examples:
- The deflection of the thin board was clear when a heavy weight sat on it.
- Engineers measured the deflection of the bridge under the load of the trucks.
