simpleMeaning: The hard, tough wood of the plane tree, springy and of changing colour, sometimes with
  streaks of other colours
scope: The hard tough springy wood of the tree, of changing colour, not the tree itself and not the wood
  of the European maple.
examples:
- The table was made of sycamore.
- Sycamore is a hard wood that takes a fine polish.
