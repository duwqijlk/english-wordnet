senseId: 'frustum%1:25:00::'
synsetId: 13940490-n
simpleMeaning: Cut the top off a cone or a pyramid with a flat cut level with the base, and the part that
  stays below is this shape.
scope: This is the shape of the part left below when the top is cut off a cone or a pyramid by a flat
  cut level with the base, not the whole cone or pyramid and not the top piece cut away.
examples:
- The frustum of the pyramid had a flat top where the point had been cut off.
- She drew a frustum by cutting a cone with a line level with its base.
