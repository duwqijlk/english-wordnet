simpleMeaning: in a way that looks true or right but is not
scope: In a way that looks true or right but is not, not in a way that is plainly false and not in a way
  that is merely unclear.
examples:
- He argued speciously, and the crowd believed him.
- She speciously claimed the plan would cost nothing.
