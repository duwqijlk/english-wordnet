simpleMeaning: In India, Pakistan and Burma, a bright fabric wrap, cotton or silk, worn as a skirt, loincloth
  or sash.
scope: Another name, alongside longyi and lungyi, for the long South Asian wrap; it is not a different
  garment.
examples:
- The fisherman tied his lungi above his knees before wading into the water.
- Many men in Bangladesh wear a lungi at home.
