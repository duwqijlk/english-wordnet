simpleMeaning: Seeming to come from spirits or powers beyond the world we know
scope: Seeming to come from spirits or powers beyond the world we know; weird and uncanny are other names
  for this sense; not merely strange, and not merely very late at night.
examples:
- An unearthly light filled the old house.
- He heard the unearthly scream of a bird in the dark.
