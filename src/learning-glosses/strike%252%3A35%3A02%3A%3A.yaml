simpleMeaning: To come upon someone or something suddenly and usually bring harm.
scope: Sudden harm coming to someone or something — another name for hit in this sense — not a physical
  blow or a clock sounding the hour.
examples:
- The earthquake struck at midnight.
- He was stricken with cancer when he was still a teenager.
