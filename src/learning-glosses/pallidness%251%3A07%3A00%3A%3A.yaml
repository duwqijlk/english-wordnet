senseId: 'pallidness%1:07:00::'
synsetId: 04984828-n
simpleMeaning: Skin with no colour in it that is not natural, from a bruise, sickness or strong feeling
scope: 'Also called pallor, paleness, achromasia, lividity, lividness and luridness: skin with no colour
  in it in a way that is not natural, not a tan and not a blush.'
examples:
- The pallidness of her face after the shock worried her mother.
- His pallidness came from weeks of sickness, not from the cold.
