simpleMeaning: a person whose job is to put a condemned prisoner to death, acting on a court's order
scope: An official who carries out a death sentence on a court's order, not a judge and not a murderer.
examples:
- The executioner waited for the signal before carrying out the sentence.
- In those days the executioner wore a black hood.
