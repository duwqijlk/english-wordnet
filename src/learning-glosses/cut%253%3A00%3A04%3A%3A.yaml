simpleMeaning: said of grass or other plants that a hand tool or machine has shortened close to the ground.
scope: This describes grass or vegetation that has been taken down, not something separated or pierced,
  not a garment shaped by a tailor, not a book with trimmed pages, not a tidy trimmed appearance, not
  a lowered price, and not a liquid weakened with water.
examples:
- The cut grass was left in rows to dry.
- Farmers gathered the cut hay before the storm.
