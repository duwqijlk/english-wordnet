simpleMeaning: to fasten something with a small bar that goes through a loop, or as if with such a bar
scope: Fastening something with a small bar through a loop; not letting something go with a switch, and
  not adding such a bar to something.
examples:
- He toggled his thick coat shut against the cold wind.
- She toggled the bag closed before she left the house.
