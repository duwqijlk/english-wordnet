simpleMeaning: A rare sickness present from birth in which the blood cannot clot because the liquid part
  of the blood has no fibrinogen, the stuff that makes clots.
scope: A rare sickness from birth in which blood cannot clot, not a sickness that makes blood clot too
  much and not a lack of red blood cells.
examples:
- Congenital afibrinogenemia means even a small cut can bleed for a long time.
- The baby was found to have congenital afibrinogenemia.
