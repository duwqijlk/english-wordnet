simpleMeaning: A set amount of data, 1000 million-byte units, or 1,000,000,000 bytes.
scope: A unit of data of 1000 megabytes, not the 1024-mebibyte unit and not a letter; also called gigabyte
  and GB.
examples:
- The file is 3 G in size, or 3,000,000,000 bytes.
- This drive holds 2 G of data.
