simpleMeaning: used of a person, above all, who cannot think clearly or judge what is right
scope: A person who shows no good sense or judgment, not someone knocked out cold and not a meaningless
  act.
examples:
- It was a senseless waste of money.
- Only a senseless person would drive that fast in fog.
