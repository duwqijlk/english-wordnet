simpleMeaning: A paint made of colour mixed with melted beeswax, set firm with heat once it is put on
scope: This is a paint made of colour mixed with melted beeswax, set firm with heat once it is put on,
  not a water paint and not a paint that dries in air.
examples:
- The artist painted in encaustic, mixing colour with melted beeswax.
- Encaustic is set firm with heat after it is put on.
