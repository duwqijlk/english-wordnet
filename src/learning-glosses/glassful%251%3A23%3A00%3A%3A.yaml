simpleMeaning: the amount that one glass can hold when it is full
scope: The amount that fills one glass, also called glass. It is not the drinking glass itself, and it
  is not the clear hard stuff that windows are made of.
examples:
- She drank a whole glassful of water after the run.
- He poured two glassfuls of milk into the bowl.
