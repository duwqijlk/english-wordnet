simpleMeaning: Any of several blocks on a work table that a piece can be pushed against while it is cut
  or smoothed
scope: Any of several blocks on a work table that a piece can be pushed against while it is cut or smoothed,
  not a clamp and not a vice.
examples:
- He pushed the board against the bench hook while he planed its edge.
- A bench hook holds the work steady on the bench.
