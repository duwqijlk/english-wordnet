simpleMeaning: A hat of straw with a flat top, made to hold its shape
scope: 'Also called a sailor, a boater and a skimmer: a stiff straw hat with a flat top, not a soft cloth
  hat and not a tall hat.'
examples:
- He wore a leghorn against the midday sun.
- Her leghorn had a wide brim and a flat crown.
