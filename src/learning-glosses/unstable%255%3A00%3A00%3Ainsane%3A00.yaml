simpleMeaning: having a mind so badly ill that thoughts and feelings no longer work as they should
scope: A mind that is badly ill, not a wobbly thing, not a person whose feelings keep changing, and not
  a peace that gives no comfort.
examples:
- His unstable mind made it hard for him to follow a plan.
- After the illness, she was unstable and needed care every day.
