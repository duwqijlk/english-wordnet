simpleMeaning: gases or smells come out of a thing and spread into the air around it
scope: 'Also called breathe: to push gases or smells out of a thing, not to give off light or heat and
  not to make a sound.'
examples:
- The drain began to emit a bad smell.
- The old fridge emitted a strange gas.
