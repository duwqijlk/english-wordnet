senseId: 'affidavit%1:10:00::'
synsetId: 06749278-n
simpleMeaning: a written statement that a person swears is true, made before someone who has the legal
  right to take such a sworn promise
scope: A written statement sworn to be true; not a statement spoken aloud in court, and not a plain written
  statement with no sworn promise behind it.
examples:
- She signed an affidavit saying that she saw the accident happen.
- The court asked him to write an affidavit about what he knew.
