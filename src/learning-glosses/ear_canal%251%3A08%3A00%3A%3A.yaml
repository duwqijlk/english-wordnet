simpleMeaning: one of the two tubes on the side of the head, running from the outer flap to the thin skin
  that forms the drum
scope: One of the two tubes on the side of the head, also called the acoustic meatus, the auditory canal,
  the auditory meatus, and the external auditory canal; not the inner tube that carries sound to the brain
  and not the outer flap itself.
examples:
- Water got stuck in his ear canal after swimming.
- The doctor looked inside her ear canal with a light.
