simpleMeaning: This painter's work is the last coat of paint, put on once the other coats are in place
scope: A painter who puts on the last coat of paint, not the painter who puts on the first coats and not
  the baseball player who ends a game.
examples:
- The finisher came back the next day to put on the last coat.
- They hired a finisher to give the walls a smooth last coat.
