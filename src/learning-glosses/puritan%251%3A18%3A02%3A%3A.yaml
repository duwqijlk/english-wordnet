simpleMeaning: A member of a group of English Protestants of the 1500s and 1600s who held the Reformation
  under Elizabeth was not complete and wanted simpler worship under set rules
scope: This is a member of the Puritan group of the 1500s and 1600s, not a Protestant of today and not
  a person who merely dislikes fun.
examples:
- The Puritan wanted the church service made simpler.
- Puritans settled in New England in the 1600s.
