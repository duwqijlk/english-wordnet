simpleMeaning: a person who knows a lot about getting more work out of machines and workers
scope: 'Also called efficiency expert: a person who knows a lot about getting more work out of machines
  and workers, not a person who fixes machines and not a person who runs a factory.'
examples:
- The efficiency engineer found ways to cut wasted time on the line.
- An efficiency engineer watched the workers and the machines all morning.
