simpleMeaning: The move of a measuring tool's pointer or pen away from its zero mark
scope: The shift of a meter's pointer or pen from zero, also called deflection; not the reading itself
  and not a fault in the tool.
examples:
- A small deflexion of the needle showed the current.
- The deflexion grew as the voltage rose.
