simpleMeaning: quick to notice what is going on and quick to act on it
scope: Also called alive and awake, this is being quick in mind to notice and act, not just watching closely
  for danger and not a state of being ready for action.
examples:
- She stayed alert through the long meeting and caught every change in the plan.
- An alert mind spots a small problem before it grows.
