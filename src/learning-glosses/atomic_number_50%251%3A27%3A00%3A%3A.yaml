simpleMeaning: A shiny metal that can be bent and does not rust, used in many metal mixes and to coat
  other metals against rust; found chiefly in cassiterite as tin oxide.
scope: Also called tin and Sn; a shiny metal that resists rust, not the soft grey metal thallium and not
  the radioactive metal plutonium.
examples:
- Atomic number 50 is tin, a metal that does not rust easily.
- The can was coated with atomic number 50 to keep it from rusting.
