simpleMeaning: The leaves and stems of such plants as the starchy root crop and tobacco are bored into
  by the young of a moth of the crop as it grows.
scope: Not the moth itself, but its young, which bores into the leaves and stems of plants.
examples:
- The potato tuberworm bored into the potato leaves and left them full of holes.
- The potato tuberworm had bored into the tobacco stems as well as the potato leaves.
