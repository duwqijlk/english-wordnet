simpleMeaning: Heat needed to warm a thousand grams of water by one degree at normal air pressure, a unit
  food experts use to show the fuel a food gives the body.
scope: This unit of heat is also called a calorie, a kilocalorie, a large calorie, or a nutritionist's
  calorie.
examples:
- The book lists the food's power in kilogram calories.
- The diet chart gives each meal in kilogram calories.
