simpleMeaning: In language, the plainest and most exact sense of a word, and all the things that word
  can name
scope: 'Also called reference: in language, the plainest and most exact sense of a word and all the things
  that word can name, not classes for people who are not full students and not the letters after the dot
  in a computer file name.'
examples:
- The extension of the word 'dog' takes in every dog there is.
- In logic, the extension of a word is the group of things it names.
