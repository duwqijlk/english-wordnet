simpleMeaning: Small white flowers crowd into dense heads above soft grey-green leaves; the pods are hairy.
  This tall European annual grows wild in North America and is sometimes a troublesome weed.
scope: Another name for hoary alison; not the garden flower sold as sweet alyssum.
examples:
- Hoary alyssum spread quickly through the dry pasture.
- The grey-green leaves and white heads of hoary alyssum stood out in the dry grass.
