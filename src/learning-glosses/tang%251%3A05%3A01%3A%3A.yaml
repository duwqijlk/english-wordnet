simpleMeaning: one of several kinds of large brown sea plant, above all those of the kind called Laminaria
scope: One of several kinds of large brown sea plant, above all those of the kind called Laminaria; not
  a sharp taste or smell, and not a common rockweed used for manure.
examples:
- The tang washed up on the beach after the storm.
- Fishermen cut tang from the rocks at low tide.
