simpleMeaning: Food in small pans sits inside a big pan of hot water, which keeps it warm or cooks it
  slowly.
scope: It is the big pan of hot water that small pans of food sit in while they stay warm or cook slowly.
examples:
- The sauce stayed warm in the bain-marie.
- They put the small pans in the bain-marie and left the food to cook slowly.
