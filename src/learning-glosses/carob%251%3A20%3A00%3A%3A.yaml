simpleMeaning: A tree of the lands round the Mediterranean Sea, named in the Bible, that keeps its leaves
  all year and bears pods that can be eaten.
scope: A tree, also called algarroba, a carob bean tree, or a carob tree, that keeps its leaves all year
  round the Mediterranean Sea and bears pods that can be eaten; not the long pod itself, holding small
  beans and sweetish pulp that can be eaten, fed to animals and the source of a chocolate substitute,
  and not the powder ground from its seeds and pods and used in place of chocolate.
examples:
- Carob trees grow all along the dry hills of the island.
- The old carob in the yard drops its pods every summer.
