simpleMeaning: A thing a baby is given to suck or bite on
scope: This is a thing a baby sucks or bites on, not a thick bed cover and not a person who calms fears.
examples:
- The baby fell asleep with her comforter in her mouth.
- The nurse gave the baby a comforter to suck on.
