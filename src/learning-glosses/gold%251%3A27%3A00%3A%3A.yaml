simpleMeaning: A soft yellow metal with three or one charge that bends and stretches, found mainly as
  lumps in rock and rivers; it resists most chemicals, not chlorine or acid mix.
scope: A yellow metal, also called Au or atomic number 79; not the colour alone, and not any other metal.
examples:
- Gold is a soft yellow metal.
- The ring is made of gold.
