simpleMeaning: any of a group of sugars that break down into four simple sugar parts when fully split
  with water
scope: A sugar that gives four simple sugar parts when split, not a sugar that gives three and not one
  that gives five.
examples:
- Stachyose is a tetrasaccharide found in beans.
- The lab tested a tetrasaccharide that breaks down into four simple sugars.
