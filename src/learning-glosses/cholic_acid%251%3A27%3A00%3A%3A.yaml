simpleMeaning: a hard chemical that does not mix into water and is found in bile, the bitter liquid that
  helps the body break down food
scope: A hard chemical found in bile, not a liquid made by the body and not a food.
examples:
- The lab found cholic acid in the sample of bile.
- Cholic acid does not mix into water, so it stays in the bile.
