simpleMeaning: a brain chemical that the brain needs to work in the normal way; as a drug, sold as Dopastat
  and Intropin, it treats shock and low blood pressure
scope: A brain chemical and, as a drug, a treatment for shock and low blood pressure, not a general drug
  for the brain.
examples:
- Dopamine helps the brain send signals from one part to another.
- The doctors gave him dopamine to raise his blood pressure.
