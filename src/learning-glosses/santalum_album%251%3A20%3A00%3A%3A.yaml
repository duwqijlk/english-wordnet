simpleMeaning: A tree of Indonesia and Malaysia that lives off other plants, with sweet-smelling, tightly
  grained yellowish heartwood that keeps insects away; chests are among the things made from it.
scope: A tree of Indonesia and Malaysia, also called sandalwood tree and true sandalwood; not other sweet-smelling
  trees and not the sandalwood of Australia.
