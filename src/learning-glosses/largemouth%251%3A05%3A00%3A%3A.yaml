simpleMeaning: A fish is a big black bass when the corner of its mouth falls behind its eye
scope: Also called largemouth bass, largemouth black bass, largemouthed bass, and largemouthed black bass,
  this is a big black bass whose mouth corner runs past its eye, not a smallmouth bass whose mouth corner
  stops short of the eye.
examples:
- The largemouth struck the lure hard and fought all the way to the boat.
- We caught a largemouth near the reeds at first light.
