simpleMeaning: A way of keeping a system working right by sending some of what comes out back in to change
  what comes out next
scope: A process that controls what a system puts out, not a spoken answer to what someone has done and
  not a piece of advice.
examples:
- The heater uses feedback to keep the room at the right heat.
- Feedback from the sensor stops the motor when it runs too fast.
