simpleMeaning: to make a liquid mixture weaker in strength or flavor
scope: This is about weakening a drink or other liquid mixture, not about boiling a sauce down and not
  about saying a word with less force.
examples:
- Add a little water to reduce the lemon juice.
- The distiller reduces the spirit with spring water before bottling.
