senseId: 'northwest_by_west%1:24:00::'
synsetId: 13856960-n
simpleMeaning: A compass point that lies one step toward the sunset from the point halfway between the
  Arctic and the sunset.
scope: This is the compass point one step west of northwest; not northwest by north, which lies one step
  to the north of northwest, and not northwest itself.
examples:
- The captain set a course northwest by west to clear the rocks.
- Northwest by west lies between northwest and west-northwest on the old compass.
