simpleMeaning: A lamp that gives a wide beam of light made by people, used for taking pictures.
scope: A lamp that gives a wide beam of light made by people, used for taking pictures; flood, floodlight
  and flood lamp are other names for this sense, not sunlight and not a small torch.
examples:
- The photoflood lit the whole set for the shoot.
- She switched on a photoflood to take the portrait.
