senseId: 'indulging%1:04:00::'
synsetId: 01075165-n
simpleMeaning: the act of giving yourself or another person what is wanted
scope: This is the act of giving yourself or another person what is wanted; indulgence, humoring and pampering
  are other names for this sense. It is the act that meets a want, not the want itself.
examples:
- Indulging in rich food every night made him feel ill.
- She saw no harm in a little indulging of her wish for a long rest.
