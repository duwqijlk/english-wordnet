scope: This is a weed of Europe with a winged stem and hairy leaves, now found in the east of the United
  States; yellow star-thistle and Centaurea solstitialis are other names for it, and it is not a weed
  of the west of the United States.
examples:
- Barnaby's thistle grows along the roads in the east.
