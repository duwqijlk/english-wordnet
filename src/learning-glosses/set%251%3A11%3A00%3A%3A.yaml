senseId: 'set%1:11:00::'
synsetId: 07378145-n
simpleMeaning: The moment the sun or another heavenly body sinks below the horizon.
scope: Poetic or literary, the noun for the event of a heavenly body going below the horizon; it is not
  the verb to set, nor the adjective for the sun already down, nor the time left before dark.
examples:
- We walked home before the set of the sun.
- After the set of the evening star, the road lay in darkness.
