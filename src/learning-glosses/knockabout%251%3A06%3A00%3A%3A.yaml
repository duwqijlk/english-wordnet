simpleMeaning: A small sailing boat with a plain set of sails and no pole sticking out at the front
scope: A small sailing boat with a plain set of sails and no pole at the front, not a large ship and not
  a boat with a full set of sails.
examples:
- They sailed the knockabout across the bay.
- The knockabout had no bowsprit, so the front deck was clear.
