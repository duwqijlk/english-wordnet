simpleMeaning: a sudden red colour that comes to the face from shame, guilt, embarrassment, or shyness
scope: 'Also called blush: a sudden red colour that comes to the face, not a short hot feeling in the
  body and not washing with liquid.'
examples:
- A flush spread across her face when the teacher praised her.
- His flush showed how shy he felt.
