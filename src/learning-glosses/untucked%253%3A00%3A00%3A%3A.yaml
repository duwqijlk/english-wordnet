simpleMeaning: with no small folds sewn into the cloth, or with the edge not pushed in to hold it in place
scope: This is about cloth with no folds sewn in, or a shirt, sheet, or cloth whose edge is not pushed
  in; not about clothes that are loose in size or fit.
examples:
- Her plain shirt front was untucked, with no folds sewn into it.
- The sheet came untucked during the night.
