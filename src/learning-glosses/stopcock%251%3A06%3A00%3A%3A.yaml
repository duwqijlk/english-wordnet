simpleMeaning: a tap that turns to let a liquid through or shut it off
scope: 'Also called cock and turncock: a tap that turns to control a liquid, not a plug that fills a hole
  tightly and not a plain pipe with no tap.'
examples:
- He turned the stopcock to shut off the water.
- The stopcock under the sink was stiff and hard to turn.
