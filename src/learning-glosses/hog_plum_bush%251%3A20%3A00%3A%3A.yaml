simpleMeaning: a small tree of North America, shrub-like in form, bearing small fruit, yellow to reddish,
  that people can eat
scope: A small tree of North America, shrub-like in form, bearing small yellow to reddish fruit that people
  can eat; chickasaw plum and hog plum are other names for this sense, not a garden plum and not a cherry
  tree.
examples:
- A hog plum bush grew beside the old fence.
- The hog plum bush was full of small reddish fruit.
