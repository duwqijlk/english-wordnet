simpleMeaning: Any creative group that leads the way in inventing and applying new ideas and methods in
  a field, especially in the arts.
scope: 'This is the old avant-garde sense: a group at the front of a field''s new work, not the leading
  soldiers of an army (the ''van'' of a battle) and not the road vehicle. It is archaic and literary,
  surviving mainly in older writing about art and ideas. Modern writers normally say ''the avant-garde''
  or ''the vanguard''.'
examples:
- The young painters of the 1920s saw themselves as the van of a new art.
- He was proud to belong to the van of modern architecture.
