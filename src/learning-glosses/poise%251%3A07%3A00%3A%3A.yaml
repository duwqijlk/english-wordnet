simpleMeaning: staying calm and in control of your feelings when you are under great pressure
scope: 'Also called cool: staying calm and steady under hard pressure, not the balance of a thing at rest
  and not getting ready for something hard.'
examples:
- She kept her poise when the crowd grew angry.
- His poise under fire won the trust of his men.
