simpleMeaning: Sound gets to the thin cover that shakes by going through one of the two tubes in the outer
  ear, starting at the flap on the head.
scope: Also called the auditory canal, auditory meatus, ear canal, and external auditory canal, this names
  one of the two tubes in the outer ear that run from the flap on the head to the thin cover that shakes.
examples:
- The doctor looked into the acoustic meatus with a small light.
- Wax had blocked the acoustic meatus and dulled the sound.
