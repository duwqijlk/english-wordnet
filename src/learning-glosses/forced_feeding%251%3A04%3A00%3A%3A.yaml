senseId: 'forced_feeding%1:04:00::'
synsetId: 01060215-n
simpleMeaning: giving a person liquid food, as through a tube in the nose, when they cannot or will not
  eat
scope: This is food given through a tube to someone who cannot or will not eat; gavage is another name
  for it, not ordinary eating or a meal taken by mouth.
examples:
- The doctors ordered forced feeding for the patient who refused all food.
- After the operation she needed forced feeding through a nasal tube.
