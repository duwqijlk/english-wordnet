simpleMeaning: The mountain kind, gorals, serows, chamois, and the gnu kind are all horned animals kin
  to the bearded farm animal, yet shaped like a wild grazer.
scope: A horned animal that looks part farm animal and part wild grazer, not one or the other alone.
examples:
- The goat antelope stood on the high rock.
- A goat antelope grazed near the mountain goats.
