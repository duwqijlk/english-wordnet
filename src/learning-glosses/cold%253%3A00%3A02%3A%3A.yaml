simpleMeaning: It means being unfriendly, with no warm or kind emotion toward other people.
scope: This is the figurative use about a person's manner, not physical temperature, illness, or simply
  being quiet.
examples:
- She gave him a cold look and walked away.
- His cold manner made the new staff feel unwelcome.
