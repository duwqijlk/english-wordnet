simpleMeaning: the act of bending something over on itself
scope: This is the act of bending something, not a thing that can be bent and put away, not the way a
  protein (a substance in living things) takes shape, and not a bend in rock.
examples:
- Folding the letter took her only a moment.
- He finished the folding of the maps and put them in a drawer.
