simpleMeaning: to burst at once and let out a great amount of power, as when the matter inside changes
  very fast in a chemical or physical way
scope: This sense is a thing itself bursting and letting out power. It is not a person making something
  else burst to ruin it, and not showing that an idea is false.
examples:
- The bomb exploded and let out a bright flash of light.
- The gas can exploded when it got too hot.
