simpleMeaning: likely to make people angry or bitter
scope: A word for something that stirs up anger or bitter feeling, also called provoking or agitating,
  not a word for something that calms people down and not a word for something that merely annoys.
examples:
- The agitative delay at the airport made the crowd angry.
- His agitative words stirred up bitter feeling in the room.
