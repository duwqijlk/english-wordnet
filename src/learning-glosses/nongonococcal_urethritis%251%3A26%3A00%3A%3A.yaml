simpleMeaning: This swelling in the tube that carries urine out of the body passes from person to person
  during sex, and chlamydia, a germ, most often causes it
scope: A swelling in the tube that carries urine out of the body, passed on during sex; not the same swelling
  caused by gonorrhea, and not a swelling from other causes.
examples:
- The doctor said the nongonococcal urethritis came from a germ passed on during sex.
- He was treated for nongonococcal urethritis after tests found chlamydia.
