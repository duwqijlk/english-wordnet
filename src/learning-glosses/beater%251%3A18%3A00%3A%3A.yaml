simpleMeaning: a worker who makes wild animals come out from where they hide so that a hunter can hunt
  them
scope: This is a person who helps in a hunt by driving wild animals out. It is not a kitchen tool used
  for mixing food.
examples:
- The beaters walked through the tall grass to drive the birds out.
- One beater was sent ahead to make the game come out of the bushes.
