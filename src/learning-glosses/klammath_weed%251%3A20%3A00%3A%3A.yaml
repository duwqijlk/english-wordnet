simpleMeaning: A long-lived plant with yellow flowers, common in fields and waste ground but unwanted
  in grazing land.
scope: A long-lived yellow-flowered plant common in fields and waste ground, not a garden flower grown
  on purpose and not a grass of grazing land.
examples:
- Klammath weed spread across the old field.
- The farmer pulled the klammath weed from the grazing land.
