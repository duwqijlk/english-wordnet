senseId: 'palimpsest%1:10:00::'
synsetId: 06419157-n
simpleMeaning: A hand-written book or sheet, usually on papyrus or parchment, carrying more than one text,
  with the earlier writing not fully rubbed out and still to be seen.
scope: Of hand-written books or sheets, usually on papyrus or parchment, where an earlier text still shows
  through.
examples:
- The palimpsest showed traces of an older text beneath the new writing.
- Scholars studied the palimpsest to read the erased words.
