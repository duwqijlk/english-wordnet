senseId: 'spatial_relation%1:07:00::'
synsetId: 05081943-n
simpleMeaning: The way a thing is placed in a place, with respect to the things around it
scope: This is about the placing of things in a place, not the things themselves and not the direction
  they face.
examples:
- He described the spatial relation of each chair to the table.
- The spatial relations of the furniture on the stage were carefully planned.
