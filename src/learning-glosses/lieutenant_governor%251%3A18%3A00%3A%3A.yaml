simpleMeaning: To stand in for the head of a state in the United States, this person is voted into office
scope: A person voted into office to stand in for the head of a state, not the head of a state and not
  a deputy mayor.
examples:
- The lieutenant governor took over when the governor fell ill.
- Voters chose a new lieutenant governor in November.
