simpleMeaning: No one under a king may call him to answer, for his power comes straight from God, and
  rising against him is the worst of political crimes
scope: Also called the divine right of kings, this is the belief that a king's power comes straight from
  God and no one under him may call him to answer, and that rising against him is the worst of political
  crimes.
examples:
- The Stuarts in Britain in the 16th century put forward the doctrine of the divine right of kings.
- Under the divine right, rebellion was the worst of political crimes.
