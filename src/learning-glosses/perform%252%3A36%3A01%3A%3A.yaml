simpleMeaning: to present a work such as music, a play, or a dance to an audience
scope: This is presenting a work for an audience, not carrying out a task or action, not working or functioning
  in a role, and not getting something done.
examples:
- The orchestra will perform a new symphony tonight.
- She performed the role of Juliet in the school play.
