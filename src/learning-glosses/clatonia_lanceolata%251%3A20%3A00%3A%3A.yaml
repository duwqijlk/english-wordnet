simpleMeaning: A small slim plant with two thick juicy leaves halfway up its stem and a loose spray of
  white, pink or rose cup-shaped flowers, and a root bulb to eat.
scope: Also called a spring beauty; a small wildflower with two thick leaves halfway up its stem and a
  spray of cup-shaped flowers, kin to other small spring wildflowers.
examples:
- Clatonia lanceolata grows along the damp path, its pink flowers open in the morning.
- We found Clatonia lanceolata with its two thick leaves halfway up the stem.
