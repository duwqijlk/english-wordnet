simpleMeaning: A small cord that carries orders from the brain to the muscle that pulls the eye outward
scope: A small cord carrying orders from the brain to the muscle that pulls the eye outward, also called
  abducens, abducens nerve, abducent, abducent nerve or nervus abducens; not the cord that moves the eye
  inward or upward.
examples:
- The sixth cranial nerve tells the side muscle of the eye to pull it outward.
- Damage to the sixth cranial nerve can leave the eye turned inward.
