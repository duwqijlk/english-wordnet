simpleMeaning: lacking some or all of what a person's body or mind can do, even to the loss of a part
  of the body
scope: Lacking some or all bodily or mental powers, not people as a group and not a thing out of order.
examples:
- After the illness she was disabled and could not walk.
- He has a disabled hand that cannot grip.
