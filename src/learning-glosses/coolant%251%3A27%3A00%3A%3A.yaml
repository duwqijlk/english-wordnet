simpleMeaning: A gas or liquid that makes things cold, above all one used to cool a system by moving heat
  from one part to another.
scope: This is a gas or liquid that makes things cold by moving heat away, not the tower that cools water
  and not ice that simply melts.
examples:
- He added more coolant to the car's radiator.
- Lathe workers use a mix of oil and water as a coolant for the cutting tool.
