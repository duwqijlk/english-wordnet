simpleMeaning: A bright light that burns in colour and warns others that a lorry or train is there
scope: This is a bright coloured light lit as a warning sign by lorries and trains; fuzee is another name
  for this sense, not the grooved spindle in a clock.
examples:
- The driver lit a fusee to warn cars behind the lorry.
- A fusee burns with a bright coloured light beside the track.
