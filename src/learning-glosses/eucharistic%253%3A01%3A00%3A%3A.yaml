simpleMeaning: Said of things that have to do with the Eucharist, the holy meal shared in church.
scope: Said of things that have to do with the Eucharist, not of other church rites or of the church building
  itself.
examples:
- The Eucharistic cup was placed on the altar.
- She sang in the choir during the Eucharistic service.
