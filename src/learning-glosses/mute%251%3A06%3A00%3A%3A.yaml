simpleMeaning: a thing put on or in a musical instrument to make its sound softer
scope: This is a thing used on an instrument to make its sound softer, not the act of making a sound less
  strong by wrapping and not being unable to speak.
examples:
- She put a mute on her trumpet to make it softer.
- The mute made the violin sound soft and warm.
