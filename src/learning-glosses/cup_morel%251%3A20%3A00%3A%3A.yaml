senseId: 'cup_morel%1:20:00::'
synsetId: 13053378-n
simpleMeaning: An edible morel shaped like a cup or saucer, up to 20 cm across, with a wrinkled inner
  surface spreading outward from the middle and easily mistaken for inedible mushrooms.
scope: An edible morel with a wide cup- or saucer-shaped cap; not the common morel, whose cap is tall
  and pitted like a sponge.
examples:
- She sliced the cup morel and added it to the pan.
- A cup morel can grow almost as wide as a dinner plate.
