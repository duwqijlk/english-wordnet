simpleMeaning: The city where a bishop's cathedral stands.
scope: This is the bishop's city or seat, not a cathedral building, and it is the noun, not the verb meaning
  to perceive. The word survives mainly in names such as the See of Canterbury.
examples:
- He was appointed to the see of Canterbury in 1162.
- The bishop rarely left his see in the last years of his life.
