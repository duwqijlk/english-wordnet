simpleMeaning: to let or make a person go, so that your time with them ends
scope: To let a person leave after meeting them, not to end their job and not to stop thinking about an
  idea or a court case.
examples:
- The teacher dismissed the class and the children went home.
- After I gave my report, the officer dismissed me and I left the room.
