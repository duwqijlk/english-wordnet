simpleMeaning: A hadron with the count plus one, this is any smallest bit of matter as heavy as a proton
  or heavier, taking part in the strong force.
scope: Also called heavy particle, this is one of the smallest bits of matter, as heavy as a proton or
  heavier, not a light bit of matter.
examples:
- A baryon is as heavy as a proton.
- The baryon takes part in the strong force.
