synsetId: 13875199-n
simpleMeaning: A way of measuring heat in which the coldest possible point is 0 degrees; water turns to
  ice at 273.16 degrees and boils at 373.16 degrees
scope: Also called absolute scale; this is the heat measure that starts at the coldest possible point,
  not the Celsius or Fahrenheit measures.
examples:
- The Kelvin scale starts at absolute zero.
- Water boils at 373.16 degrees on the Kelvin scale.
