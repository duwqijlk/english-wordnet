simpleMeaning: a week at a British university when shows and street parades with floats are put on to
  get money for good causes
scope: A week at a British university with shows and parades to get money for good causes, not a piece
  of old cloth and not the act of teasing a person.
examples:
- Students took part in rag week to raise money for a local hospital.
- During rag week the students held a parade of floats through the town.
