synsetId: 01195632-v
simpleMeaning: With no care for how much, eat far more than you need
scope: 'Also called stuff, gorge, binge, engorge, glut, overeat, satiate, overindulge, englut, gormandise,
  ingurgitate and overgorge: to eat far more than you need, not to eat a normal meal and not to taste
  a dish.'
examples:
- The kids pigged out on ice cream after school.
- We pigged out at the buffet and could hardly move.
