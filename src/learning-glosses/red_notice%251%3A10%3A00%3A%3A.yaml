synsetId: 07291437-n
simpleMeaning: An Interpol request naming a wanted person, asking police to arrest the person for sending
  back to face trial, made at one member country's request, sent to all member countries.
scope: Also called International Wanted Notice; an Interpol request to arrest a wanted person for sending
  back to face trial, not a local police call for help and not a court order made in one country only.
examples:
- Interpol sent a Red Notice to all member countries for the wanted man.
- The police held him under a Red Notice while the other country asked for his return.
