senseId: 'filibuster%1:04:00::'
synsetId: 01069936-n
simpleMeaning: In law, a way of holding up or blocking a new law by making long speeches.
scope: In law, long speeches used to delay or block a new law; not the lawmaker who makes such speeches
  and not the act of blocking by delay in general.
examples:
- The filibuster went on for eleven hours before the vote.
- Opponents used a filibuster to stop the bill reaching a vote.
