simpleMeaning: an arrangement of details or parts that is not natural and is clearly made up
scope: This is a putting together of details or parts that looks made up, not a plan to trick people,
  not a useful tool for a job, and not the skill of making new things.
examples:
- The ending felt like a contrivance, with too many chance meetings put together at once.
- Readers did not believe the contrivance of the lost letter turning up at just the right time.
