simpleMeaning: to rot and break down, and start to smell very bad
scope: This is about dead matter or food rotting and smelling bad, not about a living thing dying and
  not about metal turning to rust.
examples:
- The meat putrefied in the heat and filled the room with a bad smell.
- Dead leaves putrefy in the wet soil.
