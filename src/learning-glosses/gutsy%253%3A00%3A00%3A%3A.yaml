simpleMeaning: showing courage and a strong will when things are hard or there is danger; strong and free,
  and not held back
scope: 'Also called plucky: brave and not held back when things are hard or risky, not just bold in talk
  and not about the stomach.'
examples:
- It was a gutsy choice to speak up when everyone else stayed silent.
- The gutsy young driver kept going through the storm to reach the town.
