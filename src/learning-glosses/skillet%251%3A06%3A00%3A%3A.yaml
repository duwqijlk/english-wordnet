simpleMeaning: a pan used for cooking food in hot oil or fat
scope: A pan used for frying food in oil or fat; not a deep pot for cooking food in water, and not a flat
  sheet for baking in an oven.
examples:
- She fried the eggs in a heavy iron skillet.
- He put the skillet on the stove and poured in a little oil.
