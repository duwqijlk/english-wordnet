simpleMeaning: Loose skin hangs from the throat of this bright Asian bird of the pheasant kind, which
  has two fleshy growths on its head.
scope: This bright Asian bird of the pheasant kind is known by the loose skin at its throat and the two
  fleshy growths on its head.
examples:
- The tragopan's bright colours caught my eye at once.
- The tragopan showed its bright colours and the loose skin at its throat.
