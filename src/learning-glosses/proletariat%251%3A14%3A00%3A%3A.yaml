simpleMeaning: a group of people in a society who do hard work with their hands or who work for pay
scope: 'Also called labor and labour: the group of people who do hard work with their hands or work for
  pay, not the group who own land or businesses.'
examples:
- The proletariat worked long hours in the factories for low pay.
- The book tells how the proletariat lived and worked for pay.
