simpleMeaning: showing that you do not think you are better or more important than other people, and not
  proud in the way you act
scope: This describes a person who is not proud and does not think they are above others. It is not about
  being low in rank or poor.
examples:
- Even after he won the prize, he stayed humble and thanked his teachers.
- She gave a humble apology and said the mistake was hers.
