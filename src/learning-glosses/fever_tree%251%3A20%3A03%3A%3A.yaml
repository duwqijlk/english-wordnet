simpleMeaning: A tall, fast-growing woody plant grown for timber, with leaves holding a healing oil; its
  young leaves are bluish.
scope: A tall, fast-growing woody plant grown for timber, with leaves holding a healing oil and young
  leaves that are bluish, also called blue gum; not a slow-growing hardwood and not a small healing shrub.
examples:
- The fever tree grew fast beside the river.
- Young leaves of the fever tree are bluish.
