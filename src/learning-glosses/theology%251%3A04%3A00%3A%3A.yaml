simpleMeaning: a job that a person learns by taking special courses in religion, usually at a college
  or seminary (a college that trains people for church work)
scope: This sense is the job a person gets after taking such courses, not the careful study of religion
  and of religious truth itself.
examples:
- He studied theology at Oxford before becoming a priest.
- She took special courses in theology at a seminary to train for church work.
