simpleMeaning: This tree or shrub, one of a group of plants, often bears showy leaf-like parts that look
  like flowers.
scope: This tree or shrub is also called dogwood and cornel, and it often bears showy leaf-like parts
  that look like flowers.
examples:
- A dogwood tree stood at the edge of the yard.
- The dogwood tree by the path had showy parts that looked like flowers.
