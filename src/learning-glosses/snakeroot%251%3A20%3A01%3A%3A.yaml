simpleMeaning: A plant in the genus Sanicula with leaves divided into leaflets spreading from one point,
  single-sex flowers in branched umbrella-like clusters, then bristly fruit; said to have healing powers.
scope: The plant of the genus Sanicula reputed to heal, also called sanicle — not white snakeroot of the
  daisy family or Virginia snakeroot.
examples:
- Snakeroot bears single-sex flowers in branched clusters.
- The old herbalist believed snakeroot had healing powers.
