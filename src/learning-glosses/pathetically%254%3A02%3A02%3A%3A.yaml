simpleMeaning: in a way that makes people feel sad for someone and want to help them
scope: 'Also called pitiably: in a way that makes people feel sad and kind toward someone, not in a way
  that makes people think badly of someone.'
examples:
- The sick child cried pathetically in his bed.
- The lost dog whined pathetically at the door.
