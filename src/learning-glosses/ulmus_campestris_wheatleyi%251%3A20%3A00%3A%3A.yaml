simpleMeaning: A kind of English elm with straight-up branches and wider leaves.
scope: 'Also called guernsey elm, wheately elm, Jersey elm, Ulmus campestris sarniensis, and Ulmus sarniensis:
  a kind of English elm with straight-up branches and wider leaves, different from the common English
  elm and from other elms with drooping branches.'
examples:
- Ulmus campestris wheatleyi has straight-up branches and wider leaves.
- The Ulmus campestris wheatleyi in the park is a kind of English elm.
