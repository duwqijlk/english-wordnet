simpleMeaning: a snake of the grasslands and woods of western North America that looks and feels like
  stretchy stuff, with its tail and head much the same shape
scope: 'Also called a tow-headed snake: a snake of the grasslands and woods of western North America,
  not a water snake and not a tree snake.'
examples:
- We saw a rubber boa in the grassland.
- The rubber boa felt smooth and firm in my hands.
