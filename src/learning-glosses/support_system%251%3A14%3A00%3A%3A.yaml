senseId: 'support_system%1:14:00::'
synsetId: 08452034-n
simpleMeaning: a set of people and places you keep in touch with in a loose way so you can help each other
  and live the way you do
scope: This is the people and places you lean on day to day, not a machine that holds things up and not
  a formal aid plan.
examples:
- Her family and friends are her support system.
- A good support system helped him keep his flat and his job.
