simpleMeaning: Using a slow, careful plan to wear down those against you, without facing them head on.
scope: Using a slow, careful plan to wear down those against you, without facing them head on; also called
  fabian, not the word for a member of the Fabian Society or for things of Fabianism.
examples:
- He took a Fabian approach, waiting for the other side to tire.
- Her Fabian policy wore down the opposition over months.
