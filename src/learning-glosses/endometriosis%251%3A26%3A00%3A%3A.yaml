simpleMeaning: a health problem in which the tissue that lines the womb is found in other parts of the
  body; it causes pain before periods and pain during periods
scope: Also called adenomyosis. This is tissue in the wrong place in the body that causes pain around
  periods, not just ordinary period pain on its own.
examples:
- Her doctor said the endometriosis was the cause of her pain each month.
- She had treatment for endometriosis for several years.
