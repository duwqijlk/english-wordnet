simpleMeaning: A tool you set to fit a pipe, with two toothed jaws that grip the pipe so you can turn
  it.
scope: Also called pipe wrench; a tool with toothed jaws that grip a pipe so you can turn it.
examples:
- He used a tube wrench to turn the pipe.
- The tube wrench gripped the pipe firmly as she turned it.
