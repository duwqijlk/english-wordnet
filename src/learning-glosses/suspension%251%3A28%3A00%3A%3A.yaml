senseId: 'suspension%1:28:00::'
synsetId: 15295994-n
simpleMeaning: a stretch of time when something stops for a while
scope: A stretch of time when something stops for a while; break, pause and interruption are other names
  for this sense, and it is not the stop itself or a hanging or a mixture in liquid.
examples:
- There was a long suspension in the talks.
- The suspension gave both sides time to think.
