simpleMeaning: money paid to the owner of a block of flats for power, lifts, care of the building, and
  the like
scope: A payment to the owner of a block of flats for power, lifts and care of the building; not the rent
  and not a tip.
examples:
- The service charge covers the lifts and the lights in the hall.
- We pay a service charge each month to the owner of the flats.
