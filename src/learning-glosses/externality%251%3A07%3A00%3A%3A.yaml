simpleMeaning: Being outside, facing toward the outside, or having to do with the outside, seen as a quality
  of a thing
scope: 'Also called outwardness: this is about being outside or facing the outside, not about one single
  thing that is outside.'
examples:
- The externality of the design means that all its main parts face outward.
- We talked about the externality of the building, with its doors and windows turned to the street.
