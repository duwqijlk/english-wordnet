simpleMeaning: A tray or stand that holds pens and other tools for writing, and pots of ink
scope: This is the tray or stand that holds writing tools and pots of ink. It is not the small pot of
  ink by itself, the one a pen is put into to get ink.
examples:
- A brass inkstand stood on the desk, holding two pens and a pot of ink.
- She put the pen back on the inkstand after signing the letter.
