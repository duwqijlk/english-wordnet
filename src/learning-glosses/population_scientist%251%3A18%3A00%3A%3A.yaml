simpleMeaning: a person who studies how groups grow and how many live in a place, and their births, deaths,
  and other life facts
scope: 'Also called a demographer or a demographist: a person who studies how groups grow, how many live
  in a place, and their births and deaths, not a person who treats sick people.'
examples:
- The population scientist studied how fast the town grew over ten years.
- A population scientist counts births and deaths to learn how a group changes.
