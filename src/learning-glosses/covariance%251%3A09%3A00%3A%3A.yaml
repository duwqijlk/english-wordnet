simpleMeaning: In statistics, the average of the numbers made by multiplying the gaps of two things that
  change from their own averages
scope: A number in statistics that shows how two things that change move together, not how one thing on
  its own spreads out and not a simple average.
examples:
- The covariance of height and weight was positive, so taller people tended to be heavier.
- We worked out the covariance of the two sets of marks to see how they moved together.
