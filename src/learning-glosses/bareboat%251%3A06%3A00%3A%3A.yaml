simpleMeaning: a ship, such as a yacht, that a person can hire with no captain, no crew, and no food or
  supplies on board
scope: A ship hired with no captain, crew or supplies, not a ship hired with a crew and not the trip itself.
examples:
- They hired a bareboat for a week in the Greek islands.
- The bareboat came with no food, so we stocked it ourselves.
