simpleMeaning: To take the colour out of a sample in a laboratory so that its parts stand out more clearly
scope: To take the colour out of a laboratory sample so its parts stand out more clearly, not to wash
  a cloth and not to add colour to a sample.
examples:
- The student had to destain the slide before looking at it.
- She will destain the sample to make the cells easier to see.
