simpleMeaning: a kind of word that changes the meaning of a verb or of a clause (a group of words that
  forms part of a sentence)
scope: This is the group of words that change a verb or a clause, not a verb, a noun or another kind of
  word.
examples:
- In 'she sang loudly', 'loudly' is an adverb.
- The teacher asked us to find the adverb in the sentence.
