simpleMeaning: A tree whose bark is rough, smells bad and is toxic, with strong, durable timber; its bark
  and seeds serve as a laxative, a worm treatment and a narcotic.
scope: The toxic, strong-timbered tree also called cabbage bark and cabbage tree; not the Australian palm
  with edible leaf buds or New Zealand's long-leaved flowering tree.
examples:
- The cabbage-bark tree is felled for its strong, lasting timber.
- Handling the cabbage-bark tree's bark calls for care because it is toxic.
