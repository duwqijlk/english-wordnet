simpleMeaning: a truck made of two parts joined together, a cab that pulls and a trailer that follows
  behind it
scope: 'Also called rig and semi: a truck made of a cab that pulls and a trailer that follows behind it,
  not a truck with one fixed body and not a small van.'
examples:
- The articulated lorry turned slowly into the yard with its trailer swinging behind it.
- An articulated lorry carried the load from the port to the warehouse.
