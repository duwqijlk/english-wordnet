simpleMeaning: The ideas and high aims linked to the old Greek world at its height.
scope: The shared ideas and aims of the old Greek world at its height, about how people thought and what
  they held dear, not the Greek tongue and not the later Greek world that followed it.
examples:
- Hellenism shaped the art and thought of Rome.
- The poet's Hellenism shows in every line he wrote.
