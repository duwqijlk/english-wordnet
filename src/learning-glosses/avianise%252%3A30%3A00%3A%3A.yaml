simpleMeaning: To change tiny living things by growing them again and again in a young chick still in
  the egg
scope: This is to change tiny living things by growing them again and again in a young chick still in
  the egg; avianize is another name for it, not to change them by heat and not to kill them with drugs.
examples:
- Scientists avianise the germs by growing them in chick eggs.
- To avianise a virus, they grow it again and again in a young chick.
