simpleMeaning: very clear and strong to see, with details shown in full, and made to cause a big, excited
  reaction
scope: Very clear, strong pictures or details made to cause a big reaction; not the sense that means bad
  against what is right and harming a person's name.
examples:
- The paper printed shocking photos of the crash, with every detail clear to see.
- The film used shocking, close pictures of the war to make people react strongly.
