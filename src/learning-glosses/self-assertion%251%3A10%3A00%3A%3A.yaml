simpleMeaning: Thinking you are better than others shows when you push your own views on them in a showy,
  careless way.
scope: This word marks the pushing of your own views on others in a showy, careless way that shows you
  think you are better than them.
examples:
- Their self-assertion was showy and careless.
- Self-assertion showed in the way the views were pushed on others.
