simpleMeaning: In mathematics, a value that can change and has zero as its limit (the value it gets closer
  and closer to)
scope: In mathematics, a value that can change and gets closer and closer to zero, not the describing
  word for a thing that is very, very small.
examples:
- In this lesson, an infinitesimal is a value that gets closer and closer to zero.
- The teacher used an infinitesimal to show a value with zero as its limit.
