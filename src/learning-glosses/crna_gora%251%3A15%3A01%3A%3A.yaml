simpleMeaning: A country in south-eastern Europe next to Bosnia, Albania and Serbia, once part of Yugoslavia.
scope: Also called Montenegro; a south-east European country, not Bosnia, Albania or Serbia, its neighbours.
examples:
- Crna Gora borders Serbia.
- We travelled through Crna Gora last summer.
