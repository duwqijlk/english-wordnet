simpleMeaning: One of two blood tubes that branch off the inner neck blood tube and split into three.
scope: One of two blood tubes that branch off the inner neck blood tube and split into three; not the
  blood tube in the neck itself and not the blood tube that feeds the covers of the brain.
examples:
- The middle cerebral artery splits into three branches inside the head.
- The surgeon traced the middle cerebral artery as it split into three.
