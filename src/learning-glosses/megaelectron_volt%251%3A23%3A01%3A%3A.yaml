simpleMeaning: A unit of energy, the work done when one tiny charged bit is sped up by a difference of
  one million eV
scope: A measure of energy used in physics, not a measure of weight and not a measure of length.
examples:
- A megaelectron volt is a unit of energy.
- The particle gained one megaelectron volt of energy.
