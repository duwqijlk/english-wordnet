synsetId: 05324224-n
simpleMeaning: A band of flesh in the eye that, when it tightens, turns the eyeball down and toward the
  middle.
scope: An eye muscle that turns the eyeball down and toward the middle, not the muscle that turns the
  eye up and not a muscle that turns it out; inferior rectus is another name for this sense.
examples:
- The inferior rectus muscle turns the eye downward.
- When the inferior rectus muscle tightens, the eyeball moves down.
