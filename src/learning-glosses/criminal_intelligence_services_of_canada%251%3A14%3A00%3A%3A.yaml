simpleMeaning: A body of the government that brings together the secret-information units of the country's
  law officers.
scope: A body of the government that brings together the secret-information units of the country's law
  officers, also called CISC; it joins the units into one, rather than leaving them apart.
examples:
- Criminal Intelligence Services of Canada joins the intelligence units of law officers.
- Criminal Intelligence Services of Canada brings together the intelligence units of Canadian law officers.
