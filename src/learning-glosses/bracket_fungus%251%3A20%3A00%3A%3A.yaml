simpleMeaning: From the side of a tree trunk or a wooden beam, a tough growth spreads out into a flat
  shelf.
scope: Also called shelf fungus, this tough growth spreads from tree trunks and wooden beams in a flat
  shelf.
examples:
- A bracket fungus had spread across the cut end of the fallen log.
- The bracket fungus grew in a flat shelf along the side of the old fence post.
