simpleMeaning: A phrase or a saying that sounds like the words of a poem
scope: A phrase or a saying in the style of a poem, not a plain everyday phrase and not a whole poem.
examples:
- The word 'hath' is a poeticism in the old poem.
- She loved the poeticisms in the old verses, words no one uses in plain talk.
