simpleMeaning: A plate with the picture cut into it is made with light, and pictures are printed from
  it
scope: A way of printing pictures from a plate with the design cut into it, not from a flat plate and
  not by offset printing.
examples:
- The artist used photogravure to print the portrait from a copper plate.
- This book of prints was made by photogravure.
