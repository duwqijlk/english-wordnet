simpleMeaning: How to reach a goal in war, politics, business, or one's own life, thought out with care.
scope: A careful way of working out how to reach a goal in war, politics, business, or one's own life,
  not a list of plays for a sports team and not a sudden idea.
examples:
- The President's game plan for the talks took months to work out.
- Her game plan for the new shop was to win new buyers one street at a time.
