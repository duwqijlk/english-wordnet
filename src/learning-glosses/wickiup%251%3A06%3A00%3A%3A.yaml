simpleMeaning: The American Indians who move from place to place in the southwest of the United States
  use a hut made of a frame covered with mats or cut branches.
scope: Also called wikiup, this hut of a frame covered with mats or cut branches was used by the American
  Indians who move from place to place in the southwest of the United States, unlike the tipi, a tent
  of skins.
examples:
- The family built a wickiup from branches and mats.
- They slept in a wickiup while they moved across the southwest.
