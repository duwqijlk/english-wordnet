simpleMeaning: A shot in basketball, made with one hand from under or beside the basket, often bounced
  off the back board.
scope: A shot in basketball, made with one hand from under or beside the basket, often bounced off the
  back board; layup is another name for this sense, not a shot taken from far away, and not a shot made
  with two hands.
examples:
- He scored with a lay-up in the last minute.
- Her lay-up bounced off the backboard and in.
