simpleMeaning: a tall tree of the southern United States whose needles grow in groups of two or three
  and are not long, with reddish brown bark on a full-grown tree
scope: A tall tree of the southern United States, also called short-leaf pine and shortleaf pine; not
  a longleaf pine and not a loblolly pine.
examples:
- A shortleaf yellow pine grew behind the house.
- The shortleaf yellow pine had reddish brown bark.
