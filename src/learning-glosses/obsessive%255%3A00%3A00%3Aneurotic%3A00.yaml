simpleMeaning: coming from or making up an obsession, a thought or feeling that stays in the mind and
  will not go away
scope: Showing or forming an obsession; not the person who has obsessions, and not a passing worry.
examples:
- His obsessive checking of the locks kept him up at night.
- She had an obsessive fear that she had left the stove on.
