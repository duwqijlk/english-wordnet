simpleMeaning: A changed form of cortisol, a chemical the body makes, used as a drug that fights swelling
  to treat arthritis and as a drug that holds back the body's defences
scope: Also called prednisone, Deltasone, Meticorten, or Orasone; a changed form of cortisol used to treat
  arthritis and to hold back the body's defences.
examples:
- The doctor gave him Liquid Pred for the swollen joints.
- Liquid Pred helped hold back her body's defences after the transplant.
