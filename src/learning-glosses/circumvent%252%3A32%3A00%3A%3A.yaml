senseId: 'circumvent%2:32:00::'
synsetId: 00811316-v
simpleMeaning: to avoid or try to avoid doing a duty, answering a question, or dealing with a problem
scope: 'Also called duck, skirt, hedge, dodge, parry, elude, evade, sidestep and fudge: to avoid a duty,
  a question or a problem. It is not about moving around the side of a thing.'
examples:
- He circumvented the question and talked about something else instead.
- They circumvented their duties by letting other people do the work.
