senseId: hysterical%5:00:00:agitated:00
synsetId: 00087291-s
simpleMeaning: showing very strong feelings that the person cannot control
scope: This sense is about feelings that are too strong for the person to control; it is not the sense
  about an illness of the mind.
examples:
- She burst into hysterical laughter when she heard the silly story.
- The crowd grew hysterical when the fire spread through the building.
