simpleMeaning: something that is just barely done or just barely got away from
scope: Also called a close call, a narrow escape, a squeak, or a squeaker, this is a thing just barely
  done or just barely got away from, not an easy win and not a clear escape.
examples:
- The close shave left him shaken after the branch missed his head by inches.
- It was a close shave when the train passed just as we crossed the track.
