simpleMeaning: A curved sword from the East, with its sharp edge on the outer side of the curve
scope: This is a curved sword from the East with the sharp edge on the outer curve, not a straight sword
  and not a short knife.
examples:
- The soldier carried a scimitar in a belt at his side.
- The old scimitar had a wide, curved blade.
