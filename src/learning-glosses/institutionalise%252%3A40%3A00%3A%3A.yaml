senseId: 'institutionalise%2:40:00::'
synsetId: 02353564-v
simpleMeaning: To get people taken into an institution.
scope: This sense is also called institutionalize, for getting people taken into an institution, where
  send is to arrange or cause someone to be admitted to an institution, such as a hospital or school,
  charge is to cause a person to be admitted to an institution, used of people sent to a hospital, prison,
  or similar place, and commit is to make a person be taken into a place such as a prison or a hospital.
examples:
- They institutionalised him, getting him taken in.
- Institutionalising gets people taken into an institution.
