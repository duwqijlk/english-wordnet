simpleMeaning: Any stuff made of carbon, the black stuff in coal, joined with one other stuff or with
  a group that acts as one
scope: A stuff made of carbon joined with another stuff or a group that acts as one; not a stuff with
  no carbon in it and not a single stuff on its own.
examples:
- Methane is an organic compound.
- Sugar is an organic compound found in fruit.
