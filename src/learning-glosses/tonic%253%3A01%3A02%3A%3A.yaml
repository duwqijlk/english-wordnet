simpleMeaning: having to do with, or making, the normal tightness of muscles or body tissue
scope: About the normal tightness of muscles or tissue, not the fizzy drink and not the stressed part
  of a word.
examples:
- The tonic reflex kept her muscles firm as she stood.
- Tonic muscle contraction holds the body upright.
