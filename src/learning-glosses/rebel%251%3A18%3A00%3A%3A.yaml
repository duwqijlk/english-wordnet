simpleMeaning: A person who fights with weapons against the people in power, most of all to make life
  better
scope: A person who fights against the people in power, not the act of fighting back itself, and not a
  person who simply will not obey.
examples:
- The rebels fought the army for three years.
- She joined the rebels after the new laws came in.
