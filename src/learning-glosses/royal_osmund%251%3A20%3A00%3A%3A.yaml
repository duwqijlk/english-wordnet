simpleMeaning: each leaf split twice into fine leaflets, rising straight up in tufts from a large plant
  with deep roots that grows in many lands
scope: Also called a royal fern, a ditch fern, and a king fern; a large fern with deep roots, not a low
  creeping fern.
examples:
- A royal osmund grows beside the stream in the woods.
- The royal osmund in the garden has leaves taller than my knees.
