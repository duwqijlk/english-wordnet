simpleMeaning: The patch of short grass that lies round the hole on a golf course
scope: This is the patch of short grass round the hole on a golf course; green and putting green are other
  names for this sense. Not the long grass of the fairway and not the hole itself.
examples:
- He practised his short shots on the putting surface before the round.
- Rain left the putting surface slow and soft.
