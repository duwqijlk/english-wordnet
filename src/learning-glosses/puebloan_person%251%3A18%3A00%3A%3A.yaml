simpleMeaning: A member of one of about two dozen Native American peoples, so named by the Spanish because
  they live in villages of adobe and rock.
scope: Also called Pueblo; a member of one of about two dozen Native American peoples who live in villages
  of adobe and rock.
examples:
- The Puebloan person we met told us about life in the village.
- Many Puebloan persons live in villages built of adobe and rock.
