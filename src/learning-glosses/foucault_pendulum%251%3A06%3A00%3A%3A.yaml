senseId: 'foucault_pendulum%1:06:00::'
synsetId: 03391390-n
simpleMeaning: A weight hung on a long wire that can swing in any direction; the turn of its swing shows
  that the earth turns.
scope: A weight on a long wire whose turning swing shows the earth's turn, not a weight hung on a short
  string.
examples:
- The Foucault pendulum swings in any direction.
- The Foucault pendulum shows that the earth turns.
