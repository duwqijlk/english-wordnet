simpleMeaning: a large, somewhat old-style, fish-eating bird that dives in the northern half of the world,
  with webbed feet far back, and kin to grebes, small water birds
scope: 'Also called diver: this is the northern bird that dives for fish, not a person who dives or jumps
  into water.'
examples:
- A loon called across the lake and then dived under the water for fish.
- We watched loons swimming on the northern lake, their feet set far back.
