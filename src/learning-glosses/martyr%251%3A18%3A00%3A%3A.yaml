senseId: 'martyr%1:18:00::'
synsetId: 10316279-n
simpleMeaning: a person who takes pain and loss because of a belief they will not give up
scope: A person who suffers for a belief, not one who is killed for refusing to give up a faith, and not
  the act of killing or tormenting such a person.
examples:
- She became a martyr for free speech, losing her job rather than staying silent.
- The martyr went to prison for his beliefs and never gave them up.
