simpleMeaning: the wood from any one of a group of trees or bushes that keep their leaves all year, from
  Australia and the north of New Caledonia
scope: The wood of such a tree or bush, not the living tree or bush itself and not pine wood from other
  trees.
examples:
- The table was made of cypress pine.
- The fence posts were cut from cypress pine.
