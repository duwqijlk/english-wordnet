simpleMeaning: A person of a North American Indian people who lived in Oregon by the Columbia river and
  its side rivers in Washington and the north of Idaho.
scope: 'Also called Sahaptin or Sahaptino: a person of a North American Indian people who lived in Oregon
  by the Columbia river and its side rivers in Washington and the north of Idaho, not a speaker of the
  language alone and not a person of another Indian people.'
examples:
- A Shahaptian lived in Oregon by the Columbia river.
- The Shahaptian people lived along the Columbia river and its side rivers.
