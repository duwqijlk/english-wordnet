simpleMeaning: Glaucoma, a sickness of the eye that can take away sight, is treated with this plant drug,
  put in the eye as drops, that acts on the nerves
scope: A drug put in eye drops, not a pill taken by mouth and not a drug for another part of the body.
examples:
- The doctor put pilocarpine drops in her eyes to treat her glaucoma.
- Pilocarpine is used in eyedrops for people with glaucoma.
