simpleMeaning: in old times, showing or getting the loyalty and service that a lord and his land-holder
  owed each other
scope: The adjective for such loyalty, not the person who holds land and not the lord.
examples:
- He swore to serve his liege lord in war and in peace.
- A liege subject owed the lord both work and fighting men.
