simpleMeaning: 'A copier that prints from a flat plate of stone or metal: the plate is treated so ink
  sticks in the wanted pattern and is pushed away elsewhere.'
scope: Also called lithograph, it is a copier that prints from a flat plate, not from raised type.
examples:
- They used the lithograph machine to print copies from a stone plate.
- The lithograph machine prints from a flat plate of metal.
