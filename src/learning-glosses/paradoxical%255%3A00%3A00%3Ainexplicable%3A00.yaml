schema: oewn-learning-gloss-v2
senseId: paradoxical%5:00:00:inexplicable:00
synsetId: 00943164-s
simpleMeaning: seeming to contain two opposite ideas that cannot both be right, but in fact able to be
  true
scope: This describes something that seems to go against itself but may be true, not something that is
  simply false and not something that cannot be explained at all.
examples:
- It is paradoxical that standing still can be more tiring than walking.
- The paradoxical truth is that we must spend money to save money.
