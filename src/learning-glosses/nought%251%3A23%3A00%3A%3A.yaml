simpleMeaning: In maths, a number that leaves any other number just as it was when you add it to that
  number
scope: Also called zero, cipher and cypher, this is the number that changes nothing when it is added;
  it is not any other number used in counting.
examples:
- Five plus nought is still five.
- Write nought here, because adding it will not change the total.
