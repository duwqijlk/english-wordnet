senseId: 'liquidity%1:26:00::'
synsetId: 14504004-n
simpleMeaning: The state of a thing that can flow with ease, does not spread out much, and is quite hard
  to press into less space.
scope: This state is also called liquid, liquidness and liquid state. It is the flowing state of a thing,
  not a solid state and not a gas.
examples:
- Water keeps its liquidity when it is warm, but ice does not flow.
- The liquidity of oil lets it flow through the pipe.
