schema: oewn-learning-gloss-v2
senseId: 'direct_transmission%1:17:00::'
synsetId: 09290133-n
simpleMeaning: A way germs pass straight into a person's body through touch, a bite, a kiss or sex, or
  in droplets that land in the eyes, nose or mouth.
scope: A disease-spread route, not the radio or electrical kind of transmission, and not indirect spread
  through a mosquito, contaminated water or a shared object.
examples:
- Direct transmission can happen when a sick person's cough droplets reach someone's eyes or mouth.
- Kissing is one route of direct transmission for some infections.
