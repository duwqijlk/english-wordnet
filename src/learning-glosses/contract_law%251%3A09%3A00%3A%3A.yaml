simpleMeaning: The part of the rules of a country that deals with the rights and duties of people who
  make deals with each other.
scope: The part of the rules of a country about the rights and duties of people who make deals, not the
  rules about crime and not the rules about owning land.
examples:
- Contract law covers what happens when a deal is broken.
- She studied contract law at university.
