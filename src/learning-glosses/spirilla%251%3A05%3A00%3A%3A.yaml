simpleMeaning: Any of several kinds of tiny living things with whip-like tails that need air and have
  a twisty rod shape
scope: Any of several kinds of tiny living things with whip-like tails that need air and have a twisty
  rod shape; spirillum is another name for this sense, not a round germ and not a germ that lives without
  air.
examples:
- The spirilla in the water have whip-like tails and twisty rod shapes.
- Spirilla need air to live.
