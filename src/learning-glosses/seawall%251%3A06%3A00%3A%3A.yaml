simpleMeaning: a strong wall of stone or concrete that goes from the shore out into the sea to stop the
  sea washing a beach away
scope: Also called groin, mole, jetty, bulwark, breakwater and groyne, this is a wall of stone or concrete
  at the shore that stops the sea washing a beach away. It is not a natural bank of sand or rock by the
  sea.
examples:
- The seawall kept the waves off the beach.
- Workers built a new seawall along the shore.
