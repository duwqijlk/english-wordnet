senseId: 'rapaciousness%1:07:01::'
synsetId: 04842048-n
simpleMeaning: A wish for wealth that is too strong, most often for large amounts
scope: Also called voraciousness and greediness, this is a strong want of wealth, not a want of food and
  not a fair wish to get rich.
examples:
- His rapaciousness showed in his endless hunt for more wealth.
- The rapaciousness of the landlords left the tenants with almost nothing.
