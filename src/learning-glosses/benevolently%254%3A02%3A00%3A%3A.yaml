simpleMeaning: in a kind and helpful way, with good wishes for others
scope: Describing how something is done in a kind and helpful way, not the noun for kindness itself and
  not the word that describes a kind person.
examples:
- She smiled benevolently at the children.
- He benevolently gave money to help his neighbors.
