simpleMeaning: To do work in a rush, without care, giving it too little time or thought.
scope: To do work in a rush, without care, giving it too little time or thought; not to give out too little
  of something.
examples:
- He scanted the job and left half of it undone.
- She scanted the report, giving it only a quick look.
