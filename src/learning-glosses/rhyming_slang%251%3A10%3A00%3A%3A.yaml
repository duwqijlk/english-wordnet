simpleMeaning: Informal words that swap a word for words or a phrase ending in the same sound, then usually
  drop that ending.
scope: Informal words that swap a word for words or a phrase ending in the same sound and then usually
  drop that ending, not ordinary words used as they stand.
examples:
- He answered in rhyming slang.
- She spoke rhyming slang with her neighbours.
