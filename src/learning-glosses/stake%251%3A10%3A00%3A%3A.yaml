simpleMeaning: A post set up so people can see where a thing is, such as the start or end of a race track
scope: 'Also called a post: a marker post set up to show a place, not a post for tying a person to be
  burned and not the act of tying a thing to one.'
examples:
- A stake marked the corner of the lot.
- The stakes marked the start and the end of the race track.
