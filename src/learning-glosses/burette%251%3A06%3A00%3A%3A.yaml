simpleMeaning: With lines marked on it and a tap at the bottom, this glass tube measures out liquid in
  a test that finds how much of a chemical it holds.
scope: Also called a buret, this is the glass tube with lines marked on it and a tap at the bottom, used
  to measure liquid in a test.
examples:
- The burette stood in its holder on the bench.
- She opened the tap of the burette to let the liquid run out.
