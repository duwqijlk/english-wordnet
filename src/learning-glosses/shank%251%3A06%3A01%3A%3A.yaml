simpleMeaning: the round straight part of a drill bit, the part held in the drill
scope: The round straight part of a drill bit, the part held in the drill; not the like part of a bolt,
  and not the long thin part of a thing in general.
examples:
- The shank of the drill bit slipped in the chuck.
- He gripped the bit by its shank.
