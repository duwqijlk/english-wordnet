simpleMeaning: making you think of death and things rotting away, in a way that fills you with fear
scope: 'Also called morbid: it describes something that brings death and rotting to mind, not something
  kind or pleasant to look at.'
examples:
- The old house had a ghoulish look on a dark night.
- He told a ghoulish story about dead bodies in the old church.
