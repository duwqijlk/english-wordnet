simpleMeaning: A person who copies the way a book or a song is made, to make people laugh
scope: 'Another name for a parodist: a person who copies a style to make people laugh, not a writer of
  new work and not a clown.'
examples:
- The lampooner copied the poet's style so well that the crowd roared.
- As a lampooner, she turned the famous song into a joke.
