senseId: entire%5:00:01:whole:00
synsetId: 00517305-s
simpleMeaning: including every part of a group, area, or period, with nothing left out.
scope: It is not the sense of one object being unbroken or undamaged; it means all of a group, area, or
  period is included.
examples:
- She spent the entire day at the library.
- The entire class passed the exam.
