simpleMeaning: A bird or animal with a tuft or a part that sticks out on its head, most often for show,
  and often named that way in its kind name.
scope: A bird or animal with a tuft on its head; not a knight's helmet with a plume.
examples:
- The crested oriole sang from the branch.
- We saw a crested duck on the pond.
