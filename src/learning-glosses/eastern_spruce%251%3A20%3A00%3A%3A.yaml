simpleMeaning: Wood for making paper comes from this middle-sized spruce of the east of North America,
  the tree cut most for wood there.
scope: Red spruce and yellow spruce are other names for this tree from the east of North America, the
  one cut most for wood there and used for paper.
examples:
- The eastern spruce grows in the east of North America.
- They made paper from the eastern spruce.
