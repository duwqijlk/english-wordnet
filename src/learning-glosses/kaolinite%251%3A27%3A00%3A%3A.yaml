simpleMeaning: A mineral of aluminium silicate (a compound of aluminium, silicon and oxygen), the main
  source of kaolin
scope: This is a mineral, the main source of kaolin, not a finished clay product and not a metal ore.
examples:
- Kaolinite is the main source of kaolin.
- The clay pit yields much kaolinite.
