simpleMeaning: In electronics, a set of linked parts or circuits that work together.
scope: This is a set of linked electronic parts or circuits, not a general system of connected things
  or people, not a group of broadcasting stations that air the same programs, not a fabric of woven string,
  rope, or wire, not a set of crossing lines or channels, and not the verb meaning to communicate with
  people in a group.
examples:
- The technician traced the fault through a network of electronic components.
- Each part in the network is connected to at least one other part.
