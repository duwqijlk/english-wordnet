simpleMeaning: In law, the end of a man and wife living together, by their own agreement or by a court's
  order
scope: In law, the end of a husband and wife living together, not the parting of friends or groups and
  not the end of a job.
examples:
- They sought a separation after ten years of marriage.
- The court granted the separation last spring.
