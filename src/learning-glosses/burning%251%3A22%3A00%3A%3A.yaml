simpleMeaning: a process that gives off heat and light as a material reacts with oxygen
scope: Another name for combustion, the heat-and-light reaction of a material with oxygen, not the act
  of setting something on fire or torture with hot objects.
examples:
- Burning releases heat and light as the fuel reacts with oxygen.
- The burning of coal produces a great deal of heat.
