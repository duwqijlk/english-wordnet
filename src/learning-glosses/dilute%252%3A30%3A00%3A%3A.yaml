simpleMeaning: to make a mix less strong or less full of taste
scope: 'Also called cut, reduce, and thin: to make a mix weaker, not to make a mix less pure by adding
  a worse thing, and not the word for a mix that is already weak.'
examples:
- Dilute the juice with water before you serve it.
- He diluted the paint with water to make it run more easily.
