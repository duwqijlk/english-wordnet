simpleMeaning: 'A basic rule from old-style physics: stuff can be neither made nor wiped out in a closed
  set-up'
scope: A basic rule that stuff can be neither made nor wiped out in a closed set-up, also called conservation
  of matter, the law of conservation of mass, and the law of conservation of matter, not a rule about
  heat and not a rule about new stuff appearing.
examples:
- Conservation of mass says matter is never lost in a closed set-up.
- The class learned conservation of mass in physics.
