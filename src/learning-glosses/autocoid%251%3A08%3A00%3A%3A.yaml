simpleMeaning: a substance made inside the body that acts on the body, especially one whose kind is not
  known
scope: 'Also called autacoid: a substance made inside the body that acts on the body, not a medicine taken
  from outside the body.'
examples:
- The autocoid was released by the cells and changed the blood flow nearby.
- Scientists studied the autocoid to learn how it acted on nearby tissue.
