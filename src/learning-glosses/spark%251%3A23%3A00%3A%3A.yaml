simpleMeaning: a small bit of a quality that you can just see and that may grow stronger
scope: A small bit of a quality that may grow, not a small bit of burning stuff thrown off by a fire and
  not the act of giving off small bits of fire.
examples:
- There was still a spark of hope in her voice.
- A spark of interest showed in his eyes.
