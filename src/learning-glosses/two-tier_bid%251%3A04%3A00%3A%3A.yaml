simpleMeaning: An offer to take over a firm in which the buyer offers to pay more for the shares needed
  to gain control than for the rest.
scope: This is an offer to take over a firm that pays more for the shares needed to gain control, not
  a plain offer for all shares at one price and not a merger.
examples:
- The two-tier bid offered to pay more for the first shares than for the rest.
- Under the two-tier bid, shareholders got more for the shares that gave the buyer control than for the
  shares that were left.
