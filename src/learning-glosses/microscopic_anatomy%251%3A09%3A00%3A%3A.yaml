simpleMeaning: Tiny parts inside body tissues and organs are what this field of study looks at
scope: The study of the tiny parts of tissues and organs, not the study of whole organs you can see with
  your eyes, and not the study of illness.
examples:
- She took a course in microscopic anatomy to learn how muscle fibres look up close.
- Microscopic anatomy shows how the tiny parts of the liver are put together.
