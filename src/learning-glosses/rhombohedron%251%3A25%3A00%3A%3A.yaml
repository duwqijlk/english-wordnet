simpleMeaning: a solid shape with six flat sides that are all the same shape, each a slanted square or
  a slanted four-sided shape
scope: A solid with six matching flat faces, not a cube and not a pyramid.
examples:
- The crystal grew as a rhombohedron with six flat faces.
- She drew a rhombohedron to show the shape of the stone.
