simpleMeaning: hit the surface of the earth or come down onto it
scope: This is something that lands or runs onto the earth itself, not a person forcing something else
  down or a wire being connected for safety.
examples:
- The boat grounded on a sandbank at low tide.
- The whale grounded on the beach and rescuers rushed to help it.
