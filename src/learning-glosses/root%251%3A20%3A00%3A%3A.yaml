simpleMeaning: In botany, a plant part usually under the ground, with no buds, leaves or nodes (small
  joints), that takes in water and mineral salts and usually holds the plant firm
scope: This is the plant part under the ground, not the part inside a tooth, nail or hair, and not a basic
  word form in language study.
examples:
- The roots of the tree spread deep under the ground.
- A carrot is a root that people can eat.
