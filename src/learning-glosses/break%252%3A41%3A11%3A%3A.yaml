simpleMeaning: get into another person's property, real or online, without permission, usually meaning
  to steal or do violence
scope: This is unlawful entry into a place or account, not smashing an object and not merely ignoring
  a rule.
examples:
- Someone broke into the warehouse through a side window.
- Hackers broke into the company's servers overnight.
