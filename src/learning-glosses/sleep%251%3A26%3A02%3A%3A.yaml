simpleMeaning: a long, still state in which a person or animal is not awake and does not move much
scope: This is not normal rest; it is a long, still condition caused by illness, cold or the needs of
  an animal's body.
examples:
- The sick animal lay in a sleep from which it did not wake.
- Some animals fall into a long sleep when the weather turns cold.
