simpleMeaning: Neutrons freed when one atom splits set off the splitting of others, so a nuclear change
  keeps itself going
scope: The splitting goes on by itself once it starts, not a single split that soon stops.
examples:
- The scientists watched the chain reaction with care.
- The chain reaction began when the first atom split.
