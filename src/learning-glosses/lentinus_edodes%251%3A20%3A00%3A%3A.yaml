simpleMeaning: An east Asian mushroom that can be eaten, with a gold or dark brown to almost black cap
  and a stalk that cannot be eaten.
scope: An edible east Asian mushroom, also called shiitake, shiitake mushroom, golden oak mushroom, Chinese
  black mushroom and Oriental black mushroom; not a poisonous toadstool and not a field mushroom.
examples:
- Lentinus edodes is grown in large numbers for food in east Asia.
- The cap of Lentinus edodes turns dark brown as it grows.
