simpleMeaning: Round the lungs, and along the inside of the chest, lies a thin cover.
scope: This thin cover wraps round the lungs and lines the inside of the chest, and it is not the lungs
  themselves.
examples:
- The pleura round the lungs is a thin cover.
- The pleura lines the inside of the chest wall.
