simpleMeaning: a lizard that lives in the Americas, on Madagascar, and on some Pacific islands; the males
  often have a long tail and a bright patch on the throat
scope: 'Also called an iguanid: a lizard of the Americas, Madagascar, and some Pacific islands, not a
  snake and not a chameleon.'
examples:
- The iguanid lizard basked on a warm rock with its long tail stretched out.
- An iguanid lizard in the zoo flashed the bright patch on its throat.
