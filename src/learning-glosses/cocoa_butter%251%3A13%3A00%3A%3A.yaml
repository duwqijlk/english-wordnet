simpleMeaning: the plant fat taken from chocolate liquid, drawn from the beans that chocolate comes from;
  it is what white chocolate is built on
scope: The plant fat taken from chocolate liquid, drawn from the beans that chocolate comes from, and
  what white chocolate is built on; not a dairy fat, and not the dark part of chocolate.
examples:
- Cocoa butter melts easily in the hand.
- The recipe uses cocoa butter to make white chocolate.
