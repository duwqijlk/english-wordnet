simpleMeaning: a belt or jacket used to save a person in water, because it floats and keeps the person
  up
scope: This belt or jacket is also called a flotation device and a life preserver, not a person who mends
  old buildings and not a cook who keeps food.
examples:
- She threw a preserver to the man who had fallen into the sea.
- Every child on the boat wore a bright orange preserver.
