senseId: 'dyslexic%1:18:00::'
synsetId: 10060414-n
simpleMeaning: a person who has a problem that makes it hard to learn to read, write, and spell words
scope: This names a person who finds reading and spelling hard; it is not the describing word for the
  condition itself or for being like that.
examples:
- He is a dyslexic and reads with help from a teacher.
- Many dyslexics learn well when lessons use sound and pictures.
