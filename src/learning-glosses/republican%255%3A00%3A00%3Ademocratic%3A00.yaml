simpleMeaning: of a kind of government where the highest power lies with the people, who have the right
  to vote for leaders who must answer to them
scope: About a government where people vote for leaders who answer to them; not of the Republican Party,
  and not a person who supports this kind of government.
examples:
- The country has a republican form of government, with free votes for all adults.
- 'He held a very republican notion: leaders should answer to the people.'
