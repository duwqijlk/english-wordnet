simpleMeaning: a metric unit used to measure how much space something takes up, equal to one hundredth
  of a liter
scope: This is a metric unit used to measure how much space something takes up, one hundredth of a liter;
  it is not a liter itself and it does not measure weight.
examples:
- The bottle holds 75 cl of wine.
- Add 20 cl of milk to the pan.
