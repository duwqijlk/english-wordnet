simpleMeaning: in a way that leads to death; also used for feelings that are very strong, such as hate,
  jealousy, or fear
scope: Used for a way that leads to death, and also for very strong feelings such as hate, jealousy, or
  fear; not for a small or weak feeling.
examples:
- He was mortally wounded in the battle and died soon after.
- She was mortally afraid of snakes.
