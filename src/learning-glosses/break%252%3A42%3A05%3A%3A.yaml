simpleMeaning: to change or stop something that is steady and continuous, such as a pattern or flow
scope: This is about changing a steady pattern or flow, not smashing an object and not entering a place
  without permission.
examples:
- A single loud laugh broke the silence of the library.
- Tall pines break the flat line of the horizon.
