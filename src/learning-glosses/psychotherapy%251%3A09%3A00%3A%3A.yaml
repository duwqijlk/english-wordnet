simpleMeaning: the part of psychiatry (the study and care of mind problems) that deals with ways of working
  with the mind
scope: This sense names a part of psychiatry, not the treatment itself that a person gets for mind or
  feeling problems.
examples:
- She studied psychotherapy as part of her training in psychiatry.
- His book is about psychotherapy as a branch of psychiatry.
