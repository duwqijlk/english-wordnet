simpleMeaning: Used for the moment in breathing when air is pulled into the body
scope: This describes the part of breathing when air is drawn in, not the part when air is breathed out.
examples:
- The inspiratory muscles pull air into the lungs.
- Doctors listen for inspiratory sounds when they check a patient's breathing.
