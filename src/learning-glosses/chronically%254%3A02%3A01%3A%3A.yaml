simpleMeaning: in a way that is a habit and has gone on for a long time
scope: 'Also called inveterate: this is about a habit kept for a long time, not about a thing that grows
  slowly and lasts for a long time.'
examples:
- For many years, he smoked chronically, day after day.
- She is chronically late and has been so for years.
