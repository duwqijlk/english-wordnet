simpleMeaning: a flat sheet made by joining two or more thin sheets or layers together and making them
  stick as one
scope: A flat sheet made from layers joined together, not the act of making such a sheet or of covering
  a thing with a thin sheet.
examples:
- The table top is made of laminate that looks like wood.
- He cut a sheet of laminate to cover the shelf.
