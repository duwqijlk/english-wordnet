simpleMeaning: any part of a set of horse gear that fits around the horse's head
scope: This is horse equipment for the head, not a hat or a hard covering that a person wears on the head.
examples:
- The worker put the headgear on the horse before the ride.
- This part of the headgear goes around the horse's nose.
