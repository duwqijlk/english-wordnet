simpleMeaning: A roofed part that sticks out from a sloping roof to hold a tall opening for light
scope: A roofed part that sticks out from a sloping roof to hold a tall opening for light; dormer is another
  name for it, not a flat roof light and not a wall opening.
examples:
- The dormer window let light into the attic bedroom.
- They added a dormer window to the sloping roof.
