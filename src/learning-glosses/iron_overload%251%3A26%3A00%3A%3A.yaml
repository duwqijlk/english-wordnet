synsetId: 14230411-n
simpleMeaning: a condition that arises when iron gathers in the tissues, bringing darkened skin, a big
  liver, diabetes, and trouble with the pancreas and joints.
scope: Another name for the iron-storage disorder also called hemochromatosis, bronzed diabetes or iron-storage
  disease, not merely getting plenty of iron in food.
examples:
- Iron overload is often found when blood tests show very high iron levels.
- Long-term iron overload can harm the liver and joints.
