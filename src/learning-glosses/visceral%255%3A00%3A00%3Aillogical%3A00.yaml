simpleMeaning: known at once by a feeling inside, not by thinking it out or by watching
scope: This is something known by a feeling inside; intuitive is another name for this sense; not something
  worked out by thought, and not something to do with the body's inner organs.
examples:
- She had a visceral sense that the plan would fail.
- His visceral dislike of the idea surprised even him.
