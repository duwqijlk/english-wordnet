simpleMeaning: As they lose their wetness, wood, bulbs, potatoes, or fruit crumble, brought on by a fungus.
scope: A fungus brings on this crumbling of wood, bulbs, potatoes, or fruit as they lose their wetness.
examples:
- Dry rot had eaten the floor boards until they crumbled.
- The dry rot spread through the stored potatoes.
