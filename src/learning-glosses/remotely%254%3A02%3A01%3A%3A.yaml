simpleMeaning: In a far-off way, faintly and at a distance, not close at hand
scope: In a remote manner, only faintly like the thing it calls to mind, not to a remote degree.
examples:
- The tones were remotely those of the old liturgy.
- Her voice sounded remotely like her mother's.
