simpleMeaning: to identify the kind of living thing something is, as in botany or biology.
scope: This sense is not about working out what is wrong with an illness or problem, and not about giving
  a label or an insult; it is about identifying a living thing's kind.
examples:
- The guide named the bird from its song.
- She named the wildflower using a field guide.
