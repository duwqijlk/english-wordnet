simpleMeaning: A small, fast-growing thorny Chinese orange tree that loses its leaves yearly and bears
  fragrant flowers and showy, inedible fruit; used as a rootstock for grafting and for hedges.
scope: Another name for the trifoliate orange, a thorny Chinese citrus grown for grafting and hedges.
  It is not the sweet eating orange, nor the bitter orange used in marmalade.
examples:
- The nursery sells trifoliata seedlings for use as rootstock.
- A dense hedge of trifoliata blocked the wind from the orchard.
