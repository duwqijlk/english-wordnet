simpleMeaning: In economics, the rule that when money of equal face value circulates, the better kind
  is kept and the worse spent; bad money drives out good, named for Sir Thomas.
scope: Not other rules of economics, such as supply and demand; this rule is about good money being driven
  out by bad money of the same face value.
examples:
- Gresham's Law says bad money drives out good.
- Under Gresham's Law, people hoard the better coins.
