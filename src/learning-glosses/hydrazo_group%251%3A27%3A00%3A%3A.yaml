simpleMeaning: a set of atoms, -HNNH-, that can join to two other parts and comes from hydrazine, a chemical
  made of hydrogen and nitrogen
scope: A set of atoms that can join to two other parts, also called hydrazo radical; not a single atom
  and not the whole chemical it comes from.
examples:
- The hydrazo group links the two rings in this molecule.
- Chemists use the hydrazo group to join two parts of a larger chemical.
