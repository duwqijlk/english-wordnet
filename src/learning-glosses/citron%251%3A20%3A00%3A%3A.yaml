simpleMeaning: A small tree or bush of India, with thorns and leaves that stay green all year, grown widely
  for its large fruits like lemons, with thick, bumpy skin.
scope: A small tree or bush of India, also called citron tree, not the large lemonlike fruit with thick,
  sweet-smelling rind, usually preserved.
examples:
- The citron grew beside the wall, its thorns catching at sleeves.
- A citron stood in the corner of the garden, green all year round.
