simpleMeaning: to copy another person in a funny way, in order to make people laugh
scope: To copy a person in a funny way for a show, not to pretend to be someone in order to cheat people.
examples:
- The actor impersonated the famous singer, and the crowd laughed at his voice.
- On the show, she impersonates well-known leaders in a funny way.
