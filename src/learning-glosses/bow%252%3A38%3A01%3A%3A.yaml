simpleMeaning: to lean the back forward and down by bending at the waist
scope: This sense is also called bend, crouch or stoop; it means bending the back forward and down from
  the waist, not a respectful greeting gesture and not just lowering the head or bending a knee.
examples:
- She bowed forward from the waist and touched her toes.
- The gymnast bowed from the waist to loosen her back.
