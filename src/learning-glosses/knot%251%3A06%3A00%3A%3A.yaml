simpleMeaning: a fastening made by looping and tying a rope or cord around itself or around another rope
  or thing
scope: A fastening made by looping and tying rope, not the bird called a knot, not a unit of speed at
  sea, not a hard round piece in wood and not tying a rope into such a fastening.
examples:
- He tied the rope in a knot that would not slip.
- The sailor undid the knot with cold fingers.
