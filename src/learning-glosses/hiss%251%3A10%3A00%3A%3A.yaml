simpleMeaning: A shout or noise that shows scorn or displeasure.
scope: Other names for this jeering cry of scorn or displeasure are boo, hoot, Bronx cheer, raspberry,
  razz, razzing, snort and bird; it is not the breathy sound itself or the act of making it.
examples:
- A loud hiss rose from the crowd when the referee made the call.
- The actor ignored the hiss from the audience.
