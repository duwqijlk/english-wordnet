simpleMeaning: Taken together, every creature that swims on its own in one stretch of water counts here,
  from living things too small to see up to whales.
scope: This word names all the swimming animals in one stretch of water taken together, from the tiniest
  living things up to whales, not one animal on its own.
examples:
- Fish and whales are part of the nekton.
- The nekton moves on its own through the water.
