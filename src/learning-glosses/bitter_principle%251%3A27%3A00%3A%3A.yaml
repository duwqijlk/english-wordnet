simpleMeaning: Any one of several hundred chemical compounds with a strong unpleasant taste, which cannot
  be grouped by their chemical makeup.
scope: Any one of several hundred chemical compounds with a strong unpleasant taste that cannot be grouped
  by chemical makeup; not a single named compound and not a sweet-tasting compound.
examples:
- Quinine is a bitter principle used in tonic water.
- The bitter principle in the bark makes it hard to swallow.
