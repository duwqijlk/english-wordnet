simpleMeaning: Fine, soft, thick hair, such as the short hair of cattle or deer, the wool of sheep, or
  the soft underlayer of fur on some dogs.
scope: This is not the direction opposite up, not a feeling of low spirits, and not a machine that has
  stopped working.
examples:
- The dog's thick down keeps it warm through the winter.
- Cashmere comes from the fine down of goats.
