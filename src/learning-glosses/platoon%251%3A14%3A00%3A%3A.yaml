simpleMeaning: a small group of soldiers, part of a company, usually with its own base and two or more
  squads, and usually led by a lieutenant
scope: A small group of soldiers, part of a company, usually led by a lieutenant; not a whole company
  and not a team of police.
examples:
- The platoon marched out at dawn.
- A platoon of thirty men guarded the bridge.
