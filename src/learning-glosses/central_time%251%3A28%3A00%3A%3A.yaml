simpleMeaning: The clock setting used in the middle part of the United States, six zones west of Greenwich,
  set at the 90th line of longitude.
scope: The clock setting used in the middle part of the United States, also called Central Standard Time
  or CST, six zones west of Greenwich.
examples:
- Central Time is used in the middle part of the United States.
- We set the clock to Central Time.
