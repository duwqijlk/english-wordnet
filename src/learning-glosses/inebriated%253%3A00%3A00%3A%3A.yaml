simpleMeaning: unable to think clearly, or wild and excited, because of a drug or a drink, especially
  alcohol
scope: 'Also called gone, drunk, ripped, and intoxicated: unable to think clearly or wild because of drink
  or a drug, not just happy, tired, or ill.'
examples:
- He was so inebriated that he could not walk in a straight line.
- The inebriated crowd sang loudly outside the bar.
