simpleMeaning: a soft sound, like the sound of silk cloth or leaves moving in the wind
scope: 'Also called whisper, and also called rustle: a soft sound like cloth or leaves in the wind, not
  speaking in a soft voice.'
examples:
- The whispering of the leaves filled the garden.
- We heard the whispering of silk as she moved.
