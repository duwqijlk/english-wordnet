simpleMeaning: A sound-catching tool that picks up sound best from the front, in a heart-shaped pattern.
scope: A sound-catching tool that picks up sound best from the front, in a heart-shaped pattern; cardioid
  microphone is another name for this sense, not a tool that hears all round and not a loudspeaker.
examples:
- The singer sang into the front of a cardioid mike on stage.
- A cardioid mike picks up sound best from the front.
