simpleMeaning: People in a set act on each other and change each other, and this part of social psychology
  looks at how that happens
scope: People in a set act on each other and change each other, and this part of social psychology looks
  at how that happens, not the study of one person alone and not the study of crowds in general.
examples:
- Group dynamics explains why the team worked better together than apart.
- The course in group dynamics looks at how people change each other in a set.
