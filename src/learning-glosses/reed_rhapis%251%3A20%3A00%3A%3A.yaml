simpleMeaning: Beside another lady palm, this Chinese lady palm has thinner stems and finer sheath fibres
scope: 'Also called slender lady palm: a Chinese lady palm with thinner stems and finer sheath fibres
  than another lady palm.'
examples:
- The reed rhapis had stems thinner than the lady palm beside it.
- She chose a reed rhapis because its stems were thin and its sheath fibres fine.
