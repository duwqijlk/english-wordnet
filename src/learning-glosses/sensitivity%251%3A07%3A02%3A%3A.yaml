simpleMeaning: the skill of noticing and feeling changes in the moods of the people around you
scope: Noticing and feeling changes in the moods of people around you, not quickness to notice small physical
  things and not the body's sense of touch.
examples:
- Her sensitivity to her friends' moods made her a good listener.
- He showed great sensitivity when he saw his friend was upset.
