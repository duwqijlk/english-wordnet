simpleMeaning: A thin strip of cord with a cover, put along the edge of a hem
scope: A thin covered cord along the edge of a hem; not a tube that carries water, oil, or gas.
examples:
- The dressmaker added white piping along the hem of the skirt.
- The tailor sewed piping along the hem of the jacket.
