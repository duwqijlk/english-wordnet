simpleMeaning: not changed or made less strong by any limits, conditions, or things held back
scope: Also called flat and unconditional, this means given with no limits held back, not the sense about
  a group or class.
examples:
- She gave a categorical denial and added no conditions at all.
- His answer was a categorical no, with nothing held back.
