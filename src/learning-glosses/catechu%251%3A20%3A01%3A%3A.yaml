simpleMeaning: a thorny tree of the East Indies with feathery leaves, yellow flowers and flat pods, from
  which a dark extract is taken
scope: The tree itself, not the dark extract taken from it.
examples:
- Catechu grows wild in the dry hills of India.
- The catechu tree bore yellow flowers that spring.
