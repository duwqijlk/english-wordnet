simpleMeaning: a soft cream for the skin that holds a resin (a sweet-smelling sticky substance from trees)
scope: This is the soft cream made with the substance, not the sweet-smelling substance itself and not
  the plant that gives it.
examples:
- She rubbed the balsam on her sore chest.
- The doctor put some balsam on the dry skin.
