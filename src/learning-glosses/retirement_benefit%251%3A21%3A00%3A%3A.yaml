simpleMeaning: Money paid each month to a person who has stopped working for good.
scope: This is a sum paid out month by month to a person who has stopped work, not money put by while
  still working; it is also called retirement check, retirement fund, and retirement pension.
examples:
- Her retirement benefit arrives on the first of each month.
- His retirement benefit helps pay the bills now that he no longer works.
