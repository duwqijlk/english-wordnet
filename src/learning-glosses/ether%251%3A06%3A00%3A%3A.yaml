scope: A clear liquid that turns to gas fast and burns easily, once breathed in to put people to sleep
  for surgery; not a class of compounds joined by oxygen, and not the old idea of a substance filling
  space.
examples:
- The dentist once used ether to put patients to sleep.
- Ether burns so easily that it must be kept far from flames.
