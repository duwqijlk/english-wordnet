simpleMeaning: a circuit in a computer that sends one result only when several inputs combine in a set
  way
scope: A logic circuit also called a logic gate, not a barrier in a fence or a boarding passage in an
  airport.
examples:
- An AND gate sends a signal only when both of its inputs are on.
- A single faulty gate can stop the whole chip from working.
