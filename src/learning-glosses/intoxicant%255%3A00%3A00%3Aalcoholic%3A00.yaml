simpleMeaning: Bringing on drunkenness.
scope: This sense is also called intoxicating, for bringing on drunkenness, unlike the sense for a liquor
  or brew holding drink-spirit as the working part, and unlike the sense for a drug that can bring on
  drunkenness.
examples:
- The brew was intoxicant, bringing on drunkenness.
- The drink was intoxicant, bringing on drunkenness.
