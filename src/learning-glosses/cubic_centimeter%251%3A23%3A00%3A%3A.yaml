simpleMeaning: a measure, in the metric set of measures, of how much space a thing takes up, equal to
  one thousandth of a litre
scope: Also called cc, ml, mil, a milliliter, a millilitre, or a cubic centimetre, this is a metric measure
  of volume, not a measure of length or weight.
examples:
- The bottle holds 250 cubic centimeters of water.
- Add 5 cubic centimeters of the liquid to the mix.
