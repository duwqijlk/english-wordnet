simpleMeaning: a mistake that a person does not mean to make and that makes them feel ashamed
scope: 'Also called trip: a mistake that a person does not mean to make; not a way of walking that is
  not steady, and not the act of walking in this way.'
examples:
- Saying the wrong name at the meeting was an embarrassing stumble.
- He made one stumble in his speech and his face turned red.
