simpleMeaning: A person who holds, gives, or gets a part of something that belongs to more than one person
scope: A person who holds, gives, or gets a part of something; not a person who keeps a whole thing alone
  and not a person who owns nothing.
examples:
- The sharer of the prize gave half to his brother.
- As a sharer in the farm, she helped with the harvest.
