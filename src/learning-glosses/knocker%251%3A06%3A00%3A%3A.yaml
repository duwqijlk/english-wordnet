simpleMeaning: a thing fixed to a door by a hinge, most often of metal and made to look nice
scope: A thing fixed to a door by a hinge, most often of metal and made to look nice; not a person who
  knocks and not a big shot who boasts.
examples:
- She lifted the knocker and let it fall twice.
- The brass knocker shone on the old front door.
