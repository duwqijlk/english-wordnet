simpleMeaning: One branch of the Tai languages, spoken in south and southwest Guizhou, on the Guizhou-Yunnan
  plateau, and in Yunnan and Sichuan.
scope: Also called Buyi and Yay; one branch of the Tai languages, not the other Tai branches of the same
  area.
examples:
- Bouyei is spoken in Guizhou.
- Many Bouyei speakers live in southwest China.
