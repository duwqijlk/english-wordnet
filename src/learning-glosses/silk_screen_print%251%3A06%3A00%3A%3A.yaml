simpleMeaning: Ink is pushed through the open parts of a fine net that holds a cut-out shape, making a
  picture on the surface below.
scope: This picture is made by pushing ink through a fine net that holds a cut-out shape, and is also
  called a silkscreen or a serigraph.
examples:
- She made a silk screen print with ink pushed through a fine net.
- The silk screen print showed the cut-out shape in ink.
