simpleMeaning: A Chadic tongue south of Lake Chad, above all in the North Region, Mayo-Louti, round Guider
  and Figuil, and in a small part of Diamare in the Far North Region
scope: A Chadic tongue of the land south of Lake Chad, used in the North Region round Guider and Figuil
  and in a small part of Diamare in the Far North Region; also called Gidar language.
examples:
- Gidar is spoken south of Lake Chad.
- She grew up speaking Gidar in the North Region.
