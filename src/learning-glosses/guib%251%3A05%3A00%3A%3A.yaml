simpleMeaning: A kind of antelope with white marks that look like horse straps, and with horns that twist.
scope: 'Also called a bushbuck: an antelope with white harness-like marks and twisted horns, not a deer
  and not an antelope with straight horns.'
examples:
- The guib stood among the bushes, its white marks bright in the sun.
- We saw a guib with twisted horns and white marks on its coat.
