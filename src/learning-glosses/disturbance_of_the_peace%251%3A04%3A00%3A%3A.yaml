simpleMeaning: An act that pesters, barges in on, holds back, stirs, or lifts folk up from rest, else
  robs dwellers of their peace and calm.
scope: This sense is also called breach of the peace, disorderly behavior, and disorderly conduct, an
  act that pesters, barges in on, holds back, stirs, or lifts folk up from rest, else robs dwellers of
  their peace and calm.
examples:
- Disturbances of the peace wake folk up from rest.
- The disturbance of the peace takes calm from dwellers.
