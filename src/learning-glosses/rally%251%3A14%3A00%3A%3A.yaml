simpleMeaning: a large meeting of people held to build strong excitement and keen feeling in them
scope: A large meeting of people held to build strong excitement; not an act of trying again with new
  strength, and not a long run of strokes in a sport.
examples:
- Thousands came to the rally to support the candidate.
- She spoke to the crowd at the election rally.
