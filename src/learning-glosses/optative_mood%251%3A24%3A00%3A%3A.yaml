simpleMeaning: In English, said with helping verbs like may or might, this verb form, as in Greek or Sanskrit,
  says what someone wishes or hopes for.
scope: 'It is also called optative: a verb form, as in Greek or Sanskrit, for saying what someone wishes
  or hopes for, said in English with helping verbs like may or might.'
examples:
- The optative mood in the old Greek line showed a wish.
- We use the optative mood when we say what we hope for.
