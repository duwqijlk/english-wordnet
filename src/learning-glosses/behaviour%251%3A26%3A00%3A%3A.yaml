simpleMeaning: the way something, such as a machine or a substance, acts or reacts in set conditions
scope: 'Also called behavior: this is how a machine or substance acts in set conditions, not how a person
  acts toward other people.'
examples:
- The behaviour of the metal changes when it is heated.
- Scientists study the behaviour of this gas under high heat.
