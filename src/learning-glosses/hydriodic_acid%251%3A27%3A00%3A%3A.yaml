simpleMeaning: a liquid, marked HI, with no colour or a yellow colour, made when hydrogen iodide is put
  in water
scope: A colourless or yellow liquid of hydrogen iodide in water, not a gas and not a solid form of the
  same stuff.
examples:
- The lab keeps a bottle of hydriodic acid on the shelf.
- Hydriodic acid is a strong acid, so it must be handled with care.
