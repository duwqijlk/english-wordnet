simpleMeaning: a person, animal, plant, or material in which a germ that causes infection usually lives
  and reproduces
scope: This is not a place or document that information comes from; it is a living creature or material
  in which an infectious germ normally lives and reproduces.
examples:
- Rats serve as a source for the bacteria that cause the illness.
- Fruit bats are the natural source of the virus.
