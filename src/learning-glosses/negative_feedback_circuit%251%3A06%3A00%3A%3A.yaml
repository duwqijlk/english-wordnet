senseId: 'negative_feedback_circuit%1:06:00::'
synsetId: 03102186-n
simpleMeaning: To cut down what goes in, some of what comes out is sent back along this path
scope: A path that takes some of what comes out away from what goes in, also called a control circuit;
  not a path that adds to what goes in.
examples:
- The amplifier uses a negative feedback circuit to keep its sound steady.
- A negative feedback circuit stops the machine from running too fast by cutting back what goes in.
