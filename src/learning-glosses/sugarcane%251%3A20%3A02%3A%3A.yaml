simpleMeaning: juicy stalks whose sap gives molasses (a thick sweet syrup) and sugar for sale; fresh stalks
  are sometimes chewed for their juice
scope: 'Also called sugar cane: this is the juicy stalks cut from the plant, not the tall grass plant
  itself that grows in hot places in south-east Asia.'
examples:
- Workers cut the sugarcane and chewed a fresh piece for its sweet juice.
- Sugarcane is crushed so its sap can be made into sugar and molasses.
