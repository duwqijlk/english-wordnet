simpleMeaning: a written order for money to be paid, made by one person or bank for another person or
  bank to pay
scope: A written order telling one person or bank to pay money, not a serving of drink, not the pulling
  of a load, and not a part that controls air in a fireplace.
examples:
- The bank issued a draft for the full amount owed.
- She paid the supplier with a draft drawn on her bank.
