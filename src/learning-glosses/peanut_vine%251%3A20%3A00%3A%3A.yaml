simpleMeaning: A sprawling, widely grown New World crop of tropical and warm regions; bright yellow flowers
  on stalks bend to the soil, where the seed pods ripen below ground.
scope: This is the plant that bears the pods, another name for peanut, not the pods or nuts people eat,
  and not any other low-growing vine.
examples:
- The peanut vine bends its flower stalks down until the pods form in the soil.
- After planting, a peanut vine spreads low across the field within weeks.
