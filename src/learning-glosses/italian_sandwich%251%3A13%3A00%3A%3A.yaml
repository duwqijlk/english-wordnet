simpleMeaning: A large amount of meat and cheese in a long crisp roll cut along its length, with tomato,
  onion, lettuce, and sauces; its name changes across the United States
scope: Also called a hero, wedge, sub, bomber, submarine, grinder, torpedo, hero sandwich, hoagie, hoagy,
  poor boy, submarine sandwich, zep, or Cuban sandwich; the name changes by region.
examples:
- We shared an Italian sandwich at the deli, the long roll filled with meat and cheese.
- He ordered an Italian sandwich with extra tomato and lettuce.
