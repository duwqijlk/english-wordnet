simpleMeaning: the branch of the study of human beings that deals with how humans came to be and how they
  differ
scope: The branch of the study of human beings that deals with how humans came to be and how they differ;
  not the study of how peoples live and not the study of old bones alone.
examples:
- She studied physical anthropology to learn how humans came to be and how they differ.
- Physical anthropology looks at the birth and the range of human beings.
