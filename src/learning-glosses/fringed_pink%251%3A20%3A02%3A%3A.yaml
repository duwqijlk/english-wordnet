simpleMeaning: With pink flowers edged with a fringe, this is a low herb with wiry stems and many branches,
  from southern California.
scope: Also called ground pink and moss pink, this is a low herb of southern California with pink flowers
  edged with a fringe, not the Eurasian pink with sweet-smelling lilac or rose flowers.
examples:
- The fringed pink opened its pink flowers edged with a fringe.
- The fringed pink grew low with wiry stems and pink flowers.
