simpleMeaning: A strong drug that blocks the effects of narcotics, and works best against morphine
scope: Also called naloxone; a strong drug sold under the trade name Narcan that blocks the effects of
  narcotics, above all morphine, whose nearest rivals are other drugs used against an overdose of narcotics.
examples:
- The nurse gave Narcan to reverse the morphine.
- Narcan acts fast when a person has taken too much morphine.
