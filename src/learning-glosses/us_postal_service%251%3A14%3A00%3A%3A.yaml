simpleMeaning: A group on its own in the United States government puts the mail in order and carries it
  to the people and firms of the United States.
scope: Also called United States Postal Service and USPS, this is the group that sorts the mail and brings
  it to people and firms, not the group that only delivers it and not any other part of the government.
examples:
- The US Postal Service sorted the mail overnight.
- The US Postal Service brought the parcel to our door.
