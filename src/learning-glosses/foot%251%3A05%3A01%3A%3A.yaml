senseId: 'foot%1:05:01::'
synsetId: 02156097-n
simpleMeaning: The end of the leg that an animal with a backbone, other than a person, stands or walks
  on.
scope: The leg ending of an animal with a backbone other than a person, not a moving or gripping organ
  on an animal without a backbone, the metrical unit of poetry, or a support shaped like a leg ending.
examples:
- The horse shifted its weight from one foot to the other.
- The cat licked its injured foot.
