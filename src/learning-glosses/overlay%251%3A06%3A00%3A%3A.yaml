simpleMeaning: a layer of boards fixed over the frame of a building to make it stronger and to give a
  base for an outer covering that keeps out the weather
scope: 'This sense is also called sheathing and overlayer: boards fixed over a building frame, not a thin
  decorative layer put over a surface for looks.'
examples:
- The workers nailed the overlay of boards over the wall frame.
- Before the outer walls went on, the overlay had to be fixed to the joists.
