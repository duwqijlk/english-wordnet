senseId: nice%5:00:00:fastidious:00
synsetId: 00987524-s
simpleMeaning: Extremely fussy and easily disgusted; over-particular about small things.
scope: 'This is the old, literary sense of ''nice'': too hard to please and quick to be disgusted, especially
  about food or dirt. It is not the everyday sense of pleasant or agreeable, and not the courteous sense.
  It survives mainly in older writing and in set phrases such as ''nice about his food''.'
examples:
- He was too nice about his food to touch the camp stew.
- She was too nice to use the grimy public telephone.
