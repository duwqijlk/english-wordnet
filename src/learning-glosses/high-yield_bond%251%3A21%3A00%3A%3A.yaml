simpleMeaning: To pay for takeovers, some bought with borrowed money, a firm with weak credit puts out
  a risky promise to pay, marked BB or less.
scope: It is also called a junk bond.
examples:
- The firm sold high-yield bonds to pay for the takeover.
- Investors bought the high-yield bond despite its low rating.
