simpleMeaning: A person who keeps a thing, a place, or an idea going and defends it
scope: Upholder is another name for this sense; it covers a person who supports a thing, a place, or an
  idea and keeps it going.
examples:
- The maintainer of the old bridge checked it every week.
- She was a maintainer of local traditions in the village.
