simpleMeaning: Giving enough of a blood-sugar drug to bring on fits and a sleep from which the person
  cannot be woken.
scope: Giving enough of a blood-sugar drug to bring on fits and a sleep from which the person cannot be
  woken, also called insulin shock therapy and insulin shock treatment; not low blood sugar by itself
  and not a drug given to wake a person.
examples:
- The doctor gave insulin shock to bring on fits.
- Insulin shock left the patient in a deep sleep.
