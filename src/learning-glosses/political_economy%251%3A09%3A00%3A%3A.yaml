simpleMeaning: The part of the study of society that deals with how goods and services are made, shared
  and used, and how they are run
scope: The part of the study of society that deals with how goods and services are made, shared and used,
  and how they are run; also called economics and economic science; not the study of laws and not the
  running of one firm.
examples:
- She studied political economy at university.
- Political economy looks at how wealth is shared.
