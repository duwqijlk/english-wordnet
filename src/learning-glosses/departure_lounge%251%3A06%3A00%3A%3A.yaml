simpleMeaning: a room where people who will travel wait for the time to leave
scope: This is a room where people wait before they travel, not a room where people wait after they arrive
  and not the place where tickets are sold.
examples:
- We sat in the departure lounge for an hour before our flight.
- The departure lounge had seats, food shops, and large windows.
