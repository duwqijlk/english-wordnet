simpleMeaning: One thousandth of the unit used to count how much a thing holds back a change in the flow
  of current
scope: A small unit for counting how much a thing holds back a change in the flow of current, one thousandth
  of the larger unit; not the larger unit itself and not a unit for counting charge.
examples:
- The coil had an inductance of five millihenries.
- She measured the choke in millihenries.
