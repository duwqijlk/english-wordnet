simpleMeaning: Chickens, geese, rabbits, hogs, ducks and pigeons, and the like, are tame farm animals
  of little size, kept for use or gain.
scope: They are tame farm animals of little size, kept for use or gain, not wild animals.
examples:
- The farmer kept small livestock.
- Small livestock such as chickens and ducks lived on the farm.
