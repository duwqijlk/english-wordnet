simpleMeaning: the use of rude and dirty words that a person cannot stop, often with a mind that is not
  well
scope: This is rude and dirty talk a person cannot stop, often when the mind is not well; not bad words
  said on purpose and not a speech problem that stops talk.
examples:
- His coprolalia made him shout rude words he could not stop.
- Coprolalia can be part of a mind that is not well.
