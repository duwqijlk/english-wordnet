simpleMeaning: A set of written signs that came from Aramaic, used to write the language it is named for.
scope: The written signs for the Uighur language, also called Uigur and Uygur; not the language itself
  and not a member of the people who speak it.
examples:
- The old book was written in Uighur script.
- She learned to read Uighur as a child.
