simpleMeaning: one of several kinds of large animal that look like oxen and live in Asia or Africa, such
  as the water kind and the Cape kind
scope: One of the ox-like animals of Asia and Africa, not the large brown animal of the flat lands of
  North America and not meat from that North American animal.
examples:
- A water buffalo pulled the cart through the wet fields.
- A group of Cape buffalo stood near the river.
