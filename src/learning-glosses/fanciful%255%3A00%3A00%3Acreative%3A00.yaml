simpleMeaning: letting imagined ideas come freely, or shaped by imagined ideas
scope: 'Also called notional: this sense is about imagined ideas and free play of the mind, not about
  liking something or wanting it.'
examples:
- She has a fanciful mind and loves to invent stories about flying ships.
- He wrote a fanciful tale about a city under the sea.
