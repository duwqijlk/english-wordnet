simpleMeaning: a set unit for measuring pressure, equal to one dyne, a very small push, on each square
  centimetre
scope: 'Also called a barye and a microbar: a set unit of pressure, not a unit of weight and not a unit
  of length.'
examples:
- The lab gave the pressure in bar absolute rather than in pounds per square inch.
- One bar absolute is a tiny unit, so most pressures need many of them.
