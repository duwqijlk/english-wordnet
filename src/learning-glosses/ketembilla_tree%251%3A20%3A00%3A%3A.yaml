simpleMeaning: A small, spiny, bushy tree grown for its dark purple fruit, which has sweet flesh tasting
  of gooseberries; it is cultivated in Sri Lanka and India.
scope: Another name for ketembilla, the tree; not the fruit sold under the same name.
examples:
- They planted a ketembilla tree beside the road.
- The ketembilla tree bears small purple fruit each year.
