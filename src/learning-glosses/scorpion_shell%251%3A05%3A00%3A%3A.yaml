simpleMeaning: any of many tropical sea snails that as adults have the edge of the shell opening drawn
  out into a row of long curved spines
scope: A tropical sea snail whose grown shell has long curved spines round its opening; not a land snail
  and not a clam.
examples:
- The scorpion shell on the beach had long curved spines round its opening.
- Collectors prize a scorpion shell for its spiny edge.
