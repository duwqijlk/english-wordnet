simpleMeaning: to become less tight or worried, and to rest and feel calm and at ease
scope: This is when you yourself stop feeling worried and rest. It is not making another person feel calm,
  not becoming loose or less tight, and not just acting in a friendlier way.
examples:
- After work, he likes to relax in a hot bath.
- Sit down and relax for a while after your long walk.
