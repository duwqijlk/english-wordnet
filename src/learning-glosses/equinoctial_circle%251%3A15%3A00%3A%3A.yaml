simpleMeaning: The great ring in the sky that runs halfway between the north and south poles of the sky.
scope: The great ring in the sky halfway between the sky's poles, also called celestial equator, equinoctial,
  and equinoctial line; not the path of the sun and not a ring around one pole.
examples:
- The equinoctial circle lies halfway between the poles of the sky.
- Sailors of old used the equinoctial circle to fix their place at sea.
