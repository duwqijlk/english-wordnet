simpleMeaning: Usually near the last part of the small gut or the bent part of the large gut, the gut
  twists the wrong way and blocks itself.
scope: A twist in the gut that blocks it, usually near the end of the small gut; not a twist of the stomach.
examples:
- The volvulus blocked his gut and needed surgery.
- A volvulus twists the intestines until nothing can pass.
