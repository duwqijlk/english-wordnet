simpleMeaning: used in informal speech before a noun to show anger or strong feeling.
scope: It is not a curse asking God to punish someone and not a religious judgement; here it only adds
  force to what you are saying.
examples:
- I can't get this damn door open.
- Where did I put that damn key?
