simpleMeaning: To leave food to soak in a seasoned liquid before it is cooked.
scope: Also called marinate, to leave food to soak in a seasoned liquid before it is cooked, not the seasoned
  liquid itself, a mix of vinegar or wine and oil with spices, used for soaking foods before cooking.
examples:
- Marinade the herring overnight before you fry it.
- He marinaded the chicken in lemon and herbs, then grilled it.
