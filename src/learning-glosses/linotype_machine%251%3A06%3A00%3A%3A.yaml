simpleMeaning: A device for setting type, worked from a keyboard, that casts a whole line as one solid
  piece of metal.
scope: It is a keyboard device that casts a whole line of type at once, not a hand press and not a single-letter
  caster; also called Linotype.
examples:
- The Linotype machine cast a whole line at once.
- He worked the Linotype machine from a keyboard.
