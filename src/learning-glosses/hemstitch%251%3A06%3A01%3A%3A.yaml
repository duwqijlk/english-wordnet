simpleMeaning: A kind of stitch in which threads that run side by side are pulled out and the bare threads
  left are caught in bunches
scope: This is a kind of stitch in which threads that run side by side are pulled out and the bare threads
  left are caught in bunches, also called hemstitching, and not a plain stitch that joins two edges or
  a stitch that makes a picture.
examples:
- She finished the edge with a hemstitch.
- The hemstitch held the threads in small bunches.
