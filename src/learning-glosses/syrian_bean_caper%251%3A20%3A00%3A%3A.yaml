simpleMeaning: A long-lived bush of the east Mediterranean lands and south-west Asia, with flowers whose
  buds are used to flavour food.
scope: 'Also called bean caper and Zygophyllum fabago: a long-lived bush of the east Mediterranean lands
  and south-west Asia, whose flower buds flavour food, not a small soft herb and not a tree grown for
  fruit.'
examples:
- The Syrian bean caper grew wild in the east Mediterranean lands.
- We picked the buds of the Syrian bean caper to flavour our food.
