simpleMeaning: To keep the dogs away from a horse's feet and to send them signals, a rider on horseback
  carries this lash, not for striking the horse
scope: A lash carried by a rider on horseback to guide the hounds, not a whip for striking the horse.
examples:
- The rider carried a hunting whip on the ride.
- She flicked the hunting whip to warn the hounds away from the horse.
