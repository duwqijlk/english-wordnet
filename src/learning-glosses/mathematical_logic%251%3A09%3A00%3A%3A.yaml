simpleMeaning: To fix clear tests for whether claims hold together and follow, a way of looking only at
  the shape of claims, not at what they say.
scope: 'Formal logic and symbolic logic are other names for it: it tests claims by the shape they take,
  not by what they say.'
examples:
- In her mathematical logic class, they checked whether the claims held together without asking what they
  meant.
- In mathematical logic, two claims with the same shape count as the same even when they speak of different
  things.
