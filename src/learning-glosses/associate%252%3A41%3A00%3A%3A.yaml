senseId: 'associate%2:41:00::'
synsetId: 02475598-v
simpleMeaning: to bring people or groups together so that they join or act as one, or to come together
  in this way
scope: This means to bring together or come together to act as one; it is not a person with a lower place
  in a group, not a college degree, and not having lower rights.
examples:
- Several small shops associated with each other to buy goods together at a lower price.
- The two groups will associate with each other to act against the new plan.
