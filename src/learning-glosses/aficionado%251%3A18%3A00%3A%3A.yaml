simpleMeaning: a person who loves one kind of music or one music performer very much
scope: A person who loves one kind of music or one performer very much, not a person who only listens
  now and then and not the performer.
examples:
- As a jazz aficionado, he owns early records by all his favourite players.
- Every aficionado of this singer knows the words of her first songs.
