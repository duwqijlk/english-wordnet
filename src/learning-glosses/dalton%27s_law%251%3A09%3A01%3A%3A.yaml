simpleMeaning: In chemistry, a rule that when two elements can form more than one compound, the amounts
  of one joining a fixed amount of the other stand in a whole-number relation.
scope: Also called the law of multiple proportions; in chemistry, a rule about how elements join in whole-number
  amounts, not the rule about gas pressures in a mixture.
examples:
- Dalton's law tells us how elements combine in whole-number amounts.
- We used Dalton's law in chemistry class.
