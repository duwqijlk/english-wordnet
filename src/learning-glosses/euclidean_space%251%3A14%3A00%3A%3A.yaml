simpleMeaning: A set of points where the rules and meanings laid down by Euclid hold; it is measured by
  distance, has straight lines, and has a fixed number of measures
scope: A set of points where the rules and meanings laid down by Euclid hold, measured by distance with
  straight lines and a fixed number of measures; not a set of points on a curve and not a set with endless
  measures.
examples:
- Euclidean space follows the rules laid down by Euclid.
- In Euclidean space, straight lines and fixed measures hold.
