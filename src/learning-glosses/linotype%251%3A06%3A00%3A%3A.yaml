simpleMeaning: A machine for setting print, worked from keys, that pours one whole line of type at a time
  as a single bar of metal
scope: Linotype machine is another name for this sense; not a typewriter and not a printing press.
examples:
- The Linotype clattered as it cast a line of type.
- Old newspapers were set on a Linotype.
