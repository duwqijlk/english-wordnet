simpleMeaning: This plant from Europe, Asia, and Africa, of the group Scilla, has narrow leaves at the
  base and pink, blue, or white flowers in bunches along a stem.
scope: Also called scilla, this plant from Europe, Asia, and Africa has narrow leaves at the base and
  pink, blue, or white flowers in bunches along a stem, and not dense spikes of small white flowers with
  a bulb used as a medicine.
examples:
- The squill had narrow leaves at the base and pink flowers in bunches.
- The squill bloomed with pink flowers.
