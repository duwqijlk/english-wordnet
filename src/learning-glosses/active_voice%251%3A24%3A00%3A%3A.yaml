senseId: 'active_voice%1:24:00::'
synsetId: 13825370-n
simpleMeaning: the way of saying a sentence so that the doer of the action, or the thing that causes what
  happens, comes first as the subject
scope: Active is another name for this way of saying a sentence, used when the subject does the action
  or causes what happens.
examples:
- '''The boy threw the ball'' uses the active voice.'
- She wrote the sentence in the active voice so the doer came first.
