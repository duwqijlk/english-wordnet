simpleMeaning: a neck condition caused by pressure on spinal nerve roots, with neck pain, muscle weakness
  and tingling
scope: Another name for cervical disc syndrome, the neck-nerve condition; not a general neck sprain or
  a disc infection.
examples:
- Cervical root syndrome can cause weakness in the muscles of the shoulder.
- An MRI helped confirm that his neck pain came from cervical root syndrome.
