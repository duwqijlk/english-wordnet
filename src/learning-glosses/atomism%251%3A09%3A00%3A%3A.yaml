simpleMeaning: Tiny separate bits that cannot be split or destroyed, and that can be counted to an end,
  make up all stuff, in chemistry
scope: Also called atomic theory, atomist theory, or atomistic theory, this idea in chemistry says all
  stuff is made of tiny bits, not of stuff that can be split without end.
examples:
- Atomism says all stuff is made of tiny bits that cannot be split.
- Democritus and Epicurus held atomism as their view of the world.
