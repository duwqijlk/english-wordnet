simpleMeaning: a vitamin that keeps the walls of cells and tiny blood tubes strong, so liquids cannot
  pass through them
scope: A vitamin that keeps the walls of cells and tiny blood tubes strong; bioflavinoid is another name
  for this sense, not vitamin C and not any other vitamin.
examples:
- Citrin helps keep the walls of small blood vessels firm.
- The doctor said citrin was once used to strengthen blood vessel walls.
