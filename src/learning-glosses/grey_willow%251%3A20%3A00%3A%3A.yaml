simpleMeaning: A bushy shrub of Europe and Asia, with pale twigs covered in soft fine hairs
scope: This is a bushy shrub of Europe and Asia with pale hairy twigs; gray willow is another name for
  it, not a tall tree willow and not a shrub with smooth twigs.
examples:
- Grey willow grows beside the stream in thick bushes.
- The grey willow's twigs look pale and soft in spring.
