senseId: 'existential_operator%1:10:00::'
synsetId: 06313745-n
simpleMeaning: A sign in logic that says a claim holds for at least one thing.
scope: A sign in logic that says a claim holds for at least one thing, also called existential quantifier;
  not a sign that says a claim holds for all things and not a word of plain speech.
examples:
- The existential operator in the line says that at least one number fits.
- With an existential operator, the claim needs only one true case.
