simpleMeaning: Having qualities that make other people care about and like someone or something very much
scope: 'Also called loveable: this sense means someone or something is easy for others to care about and
  like very much. Not just good to look at and not just pleasant to be with.'
examples:
- The small dog was so lovable that everyone wanted to hold it.
- He is a lovable child, kind and quick to smile.
