simpleMeaning: the act of handing prisoners over to the country where the crime was done
scope: This is handing prisoners to another country. It is not singing, playing or acting a work, and
  not a single performance of a song or play.
examples:
- The rendition of the prisoners to the country where the crime took place caused a long court fight.
- Lawyers argued against the rendition of the two prisoners.
