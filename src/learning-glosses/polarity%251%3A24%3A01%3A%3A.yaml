simpleMeaning: the way two opposite qualities or ways of acting are linked to each other
scope: The link between two opposites, such as good and evil; not having a positive or negative electric
  pole.
examples:
- He saw a polarity between good and evil in the story.
- The polarity between freedom and safety shapes the whole debate.
