simpleMeaning: a building with machines where logs are cut and where logs and cut wood are made smooth
  and the right size, ready to use
scope: This is a place where logs are cut and cut wood is made smooth and ready to use, not a mill that
  grinds grain and not the wood itself.
examples:
- The sawmill cut the big logs into long boards.
- He works at the sawmill near the river.
