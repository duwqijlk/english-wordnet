simpleMeaning: A small flat piece of plastic, metal or wood used to cover holes and screws that show in
  furniture
scope: A small flat piece of plastic, metal or wood used to cover holes and screws that show in furniture;
  hole plug is another name for this sense, and this is not a screw itself.
examples:
- After fastening the boards with a screw, use a plug button to cover it.
- He pressed a plug button into the hole in the chair.
