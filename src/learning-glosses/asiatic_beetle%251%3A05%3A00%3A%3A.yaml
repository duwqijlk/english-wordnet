scope: Also called Anomala orientalis and Oriental beetle; an insect brought into the United States from
  the East, known by its young feeding on the roots of sugarcane and other grasses.
examples:
- The Asiatic beetle came to the United States from the Orient.
- Asiatic beetle larvae feed on the roots of grasses.
