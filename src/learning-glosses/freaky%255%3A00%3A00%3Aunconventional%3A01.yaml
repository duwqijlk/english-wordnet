simpleMeaning: very easy to see as very far from the usual way and not like most things
scope: 'Also called bizarre, eccentric, freakish, outlandish, and flaky: very far from the usual way,
  not the sense that means strange and a bit frightening.'
examples:
- He wore a freaky hat with three tall points on top.
- The house had a freaky design, with round doors and walls that lean to one side.
