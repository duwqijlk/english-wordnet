simpleMeaning: Changed in form, this rock holds almost the same stuff as marl
scope: Also called marlite, this is a rock changed in form with almost the same make-up as marl, not soft
  marl itself and not a rock of a different make-up.
examples:
- The marlstone wall was built from blocks of the local rock.
- Marlstone crumbles more easily than granite.
