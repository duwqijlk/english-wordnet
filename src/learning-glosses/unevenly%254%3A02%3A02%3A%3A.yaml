simpleMeaning: in a way that is rough and not steady, with parts that are not all the same
scope: 'Also called raggedly: a rough, not steady way of doing something. Not the sense about sharing
  or treating people in a way that is not fair or equal, and not the sense of a way that is not regular.'
examples:
- He breathed unevenly, with short rough breaths that stopped and started.
- She spoke unevenly, her voice rough and breaking between words.
