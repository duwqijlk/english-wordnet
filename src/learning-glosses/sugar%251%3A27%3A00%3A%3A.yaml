simpleMeaning: a class of substances that are essential building material for living cells and a source
  of energy for animals, ranging from small simple molecules to large ones and grouped by how many basic
  units are joined in them.
scope: This is the whole class of these substances in biology and nutrition, not the white sweetener sold
  for cooking and not the act of adding it to food.
examples:
- Sugars are among the main fuels for animal cells.
- Starch and other large sugars are built from many simple units.
