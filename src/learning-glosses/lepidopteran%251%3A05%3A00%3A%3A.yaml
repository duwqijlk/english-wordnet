simpleMeaning: Four wings are what this bug has when it is grown up, and tiny scales cover them more or
  less
scope: 'Also called a lepidopteron and a lepidopterous insect: a grown bug with four wings more or less
  covered in tiny scales, not a bug with two wings and not a young bug without wings.'
examples:
- The lepidopteran rested on the flower with its four wings folded.
- A lepidopteran in its adult state has wings covered in tiny scales.
