simpleMeaning: The use of germs, viruses, or poisons to kill people and animals or to spoil food.
scope: Also called a bioattack, a biologic attack, a biological attack, and biological warfare; the use
  of germs, viruses, or poisons as weapons, not the use of guns and bombs.
examples:
- The treaty bans the use of BW in war.
- BW was feared as a secret weapon.
