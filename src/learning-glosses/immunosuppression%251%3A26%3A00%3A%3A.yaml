senseId: 'immunosuppression%1:26:00::'
synsetId: 13998067-n
simpleMeaning: A weaker-than-normal defense against germs and other invaders. It may be on purpose, to
  stop the body rejecting a transplanted organ, or a side effect of radiotherapy or chemotherapy.
scope: The state of lowered defenses, whether planned or not. It is not the drug or treatment that produces
  it, and not a lasting immune deficiency present from birth.
examples:
- Doctors watch closely for infection during immunosuppression after a transplant.
- Some cancer treatments cause immunosuppression, so patients are told to avoid crowds.
