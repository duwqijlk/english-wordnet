synsetId: 08603563-n
simpleMeaning: Where the air stays calm near 30 degrees north or south of the equator, in one of two belts
  whose winds are too light and shifting for sailing.
scope: Sailors meet it as one of two calm belts, the northern one near 30 degrees north and the southern
  one near 30 degrees south.
examples:
- The ship drifted in the horse latitude, with barely a wind to move it.
- Sailors know the horse latitudes by their calms and fickle winds.
