simpleMeaning: In the west of the United States grows a bush or small tree with white blooms; its sky-coloured
  fruit ends up in wine and jelly.
scope: This bush is also called blue elderberry.
examples:
- White blooms covered the blue elder.
- They picked blue elder fruit for jelly.
