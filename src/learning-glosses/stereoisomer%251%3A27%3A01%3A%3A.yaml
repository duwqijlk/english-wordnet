schema: oewn-learning-gloss-v2
senseId: 'stereoisomer%1:27:01::'
synsetId: 92429523-n
simpleMeaning: Any of a set of forms of one stuff in which the smallest bits are joined in the same order
  but sit in different places in space
scope: Any of a set of forms of one stuff in which the smallest bits are joined in the same order; not
  forms joined in a different order and not a mixture of stuffs.
examples:
- A stereoisomer has the same order of bits but a different shape in space.
- The chemist found a stereoisomer of the same stuff.
