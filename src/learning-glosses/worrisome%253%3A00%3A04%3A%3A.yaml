simpleMeaning: not making a person feel calm and safe, and tending to make them feel worried
scope: Making a person feel worried because it does not feel safe or calm; not the stronger sense of making
  a person feel very upset and afraid.
examples:
- The long silence from the hospital was worrisome.
- His cough sounded worrisome, so we called a doctor.
