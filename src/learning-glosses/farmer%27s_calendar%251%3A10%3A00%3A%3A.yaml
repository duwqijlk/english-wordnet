simpleMeaning: A book that comes out once a year, with weather forecasts and other mixed information set
  out by the days of that year.
scope: A book that comes out once a year, with weather forecasts and other mixed information set out by
  the days of that year, also called an almanac; not a daily paper and not a book of weather forecasts
  alone.
examples:
- He checked the farmer's calendar for the frost dates.
- The farmer's calendar comes out every year with weather forecasts.
