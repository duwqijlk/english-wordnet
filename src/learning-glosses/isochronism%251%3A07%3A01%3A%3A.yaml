senseId: 'isochronism%1:07:01::'
synsetId: 92437061-n
simpleMeaning: the way a thing keeps happening at the same steady pace, with the same gap between each
  time, even when other things about it change
scope: A steady timing that stays the same even when other things change, not a one-off event and not
  a speed that rises and falls.
examples:
- 'Galileo showed the isochronism of a swinging pendulum: each swing took the same time.'
- The isochronism of the clock's beat stayed steady even as the spring wore down.
