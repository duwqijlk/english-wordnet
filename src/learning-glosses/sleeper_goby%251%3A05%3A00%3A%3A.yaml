scope: A warm-water fish that looks like a small bottom fish and lies still on the bottom in shallow water,
  also called sleeper; not a fish that swims in open water and not a bottom fish that hides in mud.
examples:
- The sleeper goby lay still on the sandy bottom.
- We spotted a sleeper goby resting in the shallows.
