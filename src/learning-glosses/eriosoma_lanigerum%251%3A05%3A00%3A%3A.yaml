simpleMeaning: A bug that feeds most of all on the bark of apple trees and other trees, on parts above
  ground and on roots.
scope: 'Also called the woolly apple aphid and American blight: it feeds on bark, on the parts above ground
  and on the roots of apple and other trees.'
examples:
- Eriosoma lanigerum feeds on the bark of our apple trees.
- We found Eriosoma lanigerum on the roots of the old apple tree.
