simpleMeaning: A court order telling a wrongdoer to give up property, so as to take away the gains from
  wrong acts
scope: A court order making a wrongdoer give up property to lose the gains of wrong acts, not a fine and
  not a jail term.
examples:
- The judge ordered divestiture to break up the monopoly.
- Divestiture forced the firm to sell off the mills it had gained by fraud.
