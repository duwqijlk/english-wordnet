simpleMeaning: A way of treating sickness with tiny amounts of a cure that, in big amounts in a well person,
  would bring on signs of sickness like the ones being treated.
scope: A way of treating sickness with tiny amounts of a cure that, in big amounts in a well person, would
  bring on signs like the ones being treated, not ordinary drug treatment and not herbal medicine; also
  called homeopathy.
examples:
- She treats colds by homoeopathy.
- Homoeopathy uses tiny amounts of a cure to treat sickness.
