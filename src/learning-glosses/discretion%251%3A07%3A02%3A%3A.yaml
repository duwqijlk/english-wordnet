simpleMeaning: the freedom to choose as you like, with no outside force telling you what to do
scope: Freedom to decide for yourself, not the habit of judging wisely and not keeping secrets.
examples:
- The gift was left to her discretion.
- He used his discretion to spend the money as he wished.
