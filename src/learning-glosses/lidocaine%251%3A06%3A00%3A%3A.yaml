simpleMeaning: A drug that numbs one part of the body, put on the skin or on the wet inner surfaces of
  the body; also sold under the name Xylocaine.
scope: Not a drug that puts the whole body to sleep; also called Xylocaine.
examples:
- The dentist used Lidocaine to numb my gum.
- Lidocaine is put on the skin before the needle.
