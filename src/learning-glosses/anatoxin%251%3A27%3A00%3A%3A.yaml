senseId: 'anatoxin%1:27:00::'
synsetId: 15059021-n
simpleMeaning: a germ poison made weak so it can no longer harm, yet still strong enough to make the body
  build defences against the disease it comes from
scope: Also called toxoid; a weakened germ poison used to build defences, not the live poison and not
  a cure after sickness.
examples:
- Doctors use anatoxin to help the body build defences against diphtheria.
- The anatoxin was weak enough not to harm, yet it trained the body.
