senseId: 'epidural%1:26:00::'
synsetId: 14052134-n
simpleMeaning: numbing of the belly, genitals and pelvis by injecting painkiller into the space around
  the spinal cord; used in childbirth and gynecological surgery
scope: Another name for this same procedure is epidural anaesthesia (also spelled epidural anesthesia);
  it numbs only the lower body, unlike a general anaesthetic, and is not the adjective meaning 'on or
  outside the dura mater'.
examples:
- She asked for an epidural so she could stay awake during the birth.
- The epidural numbed her from the waist down within twenty minutes.
