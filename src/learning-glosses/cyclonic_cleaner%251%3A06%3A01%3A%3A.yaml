simpleMeaning: A machine that spins dust out of the air it sucks up sends the dust into a long round tub
  that can be taken off.
scope: 'Also called cyclonic vacuum and cyclonic vacuum cleaner: a machine that sucks up dust and spins
  it into a tub, not one that keeps the dust in a bag.'
examples:
- The cyclonic cleaner spun the dust into its tub.
- She took off the tub of the cyclonic cleaner to empty it.
