senseId: 'column_chromatography%1:22:00::'
synsetId: 13471243-n
simpleMeaning: In chemistry, a way of sorting a mix by passing it through a tall tube of fine powder that
  holds each part back for its own time
scope: A way of sorting a mix in a tube of fine powder; not a way of sorting by heat and not a single
  test for one thing.
examples:
- They used column chromatography to sort the plant oils.
- Column chromatography split the mix into its parts.
