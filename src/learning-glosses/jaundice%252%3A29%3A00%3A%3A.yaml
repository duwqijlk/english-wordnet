simpleMeaning: to give a person the illness that turns the skin and the whites of the eyes yellow, or
  to make a person see things in a bitter way
scope: 'The verb: to give a person the illness that turns the skin and the whites of the eyes yellow,
  or to make a person see things in a bitter way; not the illness itself, and not the noun sense of a
  rough and bitter manner.'
examples:
- The disease jaundiced her skin and the whites of her eyes.
- Years of failure had jaundiced the way he saw other people.
