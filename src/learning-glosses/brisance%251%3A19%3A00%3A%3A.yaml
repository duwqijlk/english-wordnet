simpleMeaning: how much a sudden burst of power breaks and crushes what is near it, as when something
  blows up
scope: The breaking and crushing power of a sudden burst, not the loud sound of a blast and not a slow
  push.
examples:
- The brisance of the blast shattered every window in the street.
- Engineers measured the brisance of the charge before they used it in the quarry.
