simpleMeaning: Creamy-white flowers, bright and easy to see and with a strong sweet smell, grow in short
  bunches at the ends of the stems of this large tough shrub.
scope: 'Also called mock orange: a large tough shrub with showy creamy-white flowers in short bunches
  at the ends of its stems.'
examples:
- The syringa by the door was covered in creamy-white flowers.
- We could smell the syringa from across the garden.
