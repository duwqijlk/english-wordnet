simpleMeaning: an extra metal piece that is twisted down tight on top of a first piece to keep it from
  coming loose
scope: 'Also called a locknut: an extra metal piece that keeps a first piece from coming loose, not a
  bolt and not a washer.'
examples:
- He put a safety nut on the bolt to keep it from working loose.
- The safety nut kept the wheel from rattling loose.
