simpleMeaning: not held up or kept going by help that is not money or a thing
scope: This sense is about help that is not money or a thing, not about a building or object with nothing
  under it to hold it up.
examples:
- His claim stayed unsupported by any proof.
- The plan was unsupported by the group, so it soon failed.
