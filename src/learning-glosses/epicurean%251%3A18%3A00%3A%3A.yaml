senseId: 'epicurean%1:18:00::'
synsetId: 10081464-n
simpleMeaning: A person who loves fine food and drink especially, and other pleasures that please the
  senses.
scope: A person given to refined pleasures of the senses, especially good food and drink, also called
  an epicure, a gourmet, or a foodie; not the adjective sense of showing luxury and giving pleasure to
  the senses.
examples:
- The epicurean spent their evenings sampling rare wines.
- They were a noted epicurean, fond of rich food and fine drink.
