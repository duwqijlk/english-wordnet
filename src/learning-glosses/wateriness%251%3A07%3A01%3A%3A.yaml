simpleMeaning: thinness or poor quality shown by too much liquid, in writing as well as in food
scope: Thin, weak quality from too much liquid, not richness and not plain dryness.
examples:
- The wateriness of his long speech bored the listeners.
- No one enjoys the wateriness of potatoes boiled in too much water.
