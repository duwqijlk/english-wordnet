simpleMeaning: how near one thing is to another, when the gap between them is rather small
scope: How near things are to each other in space, not a lack of openness, not stuffy air, and not warm
  friendship.
examples:
- The closeness of the two houses surprised us.
- She measured the closeness of the boat to the dock.
