simpleMeaning: to join things in a line on a thin cord, or to tie or fix something with a thin cord
scope: To join things on a cord or to tie with a cord, not to take the hard parts out of food and not
  to put a cord on an instrument.
examples:
- Please string the beads together to make a necklace.
- She used a cord to string the package shut.
