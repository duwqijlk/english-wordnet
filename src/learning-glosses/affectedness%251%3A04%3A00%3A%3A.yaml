simpleMeaning: a way of acting that is put on and made too big
scope: Also called pose, affectation, and mannerism, this is a way of acting that is put on and too big,
  not a plain way of acting and not a real feeling.
examples:
- Her affectedness showed in the grand way she waved her hand.
- He spoke with an affectedness that made his friends smile.
