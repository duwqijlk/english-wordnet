simpleMeaning: a part that sticks out from the surface around it
scope: This is the noun for a raised part that sticks out, also called bump, swelling and hump; it is
  not the verb senses about swelling or sticking out.
examples:
- The bulge in his pocket showed he was carrying a gun.
- There was a small bulge on the side of the tire where it was weak.
