simpleMeaning: This big fern from Australia and New Zealand stays green all year, and its root part can
  be eaten, at times as food by the people who lived there first.
scope: This big fern from Australia and New Zealand is not the small South American fern of the same name.
examples:
- The potato fern's root part fed the people who lived there first.
- In the cold months, the potato fern stays green.
