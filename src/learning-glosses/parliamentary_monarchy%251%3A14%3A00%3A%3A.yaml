simpleMeaning: a land ruled by a king or queen, where a group of chosen lawmakers makes the laws
scope: A land ruled by a king or queen, where a group of chosen lawmakers makes the laws; not a land ruled
  by the people and not a king who rules alone.
examples:
- Spain is a parliamentary monarchy.
- The parliamentary monarchy kept both the crown and the lawmakers.
