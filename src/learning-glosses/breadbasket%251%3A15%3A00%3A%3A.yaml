simpleMeaning: A part of the land that grows most of a country's grain.
scope: A land that grows most of a country's grain, not the stomach organ and not a basket for serving
  bread.
examples:
- The breadbasket of the country grew most of its wheat.
- Drought in the breadbasket cut the grain harvest in half.
