simpleMeaning: One made-up flat face joins every place a ripple reaches at the same moment as it moves
  through a medium, in physics.
scope: In physics, wave front is another name for this made-up flat face that joins every place a ripple
  reaches at the same moment.
examples:
- The wavefront moved through the stuff as the ripple spread.
- The wavefront was drawn across the places the ripple had reached at once.
