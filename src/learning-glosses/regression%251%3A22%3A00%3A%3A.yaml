simpleMeaning: In psychiatry, a way the mind keeps itself safe by running away from what is real and going
  back to being like a young child
scope: In psychiatry, this is the mind going back to child-like ways to keep away from what is real; it
  is not the number-based sense used to work out one value from another.
examples:
- After the shock, his regression showed in his need to be held and spoken to like a small child.
- The doctor saw her regression as a way to escape the pain of adult life.
