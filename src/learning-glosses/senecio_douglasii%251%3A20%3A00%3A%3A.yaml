simpleMeaning: A bluish-green bushy leafy plant covered in close white wool, with branched bunches of
  yellow flower heads, from the southwestern United States and poisonous to grazing farm animals
scope: Also called threadleaf groundsel; a bluish-green bushy plant with yellow flower heads, poisonous
  to grazing animals, not the yellow-flowered weed that poisons cattle in Europe.
examples:
- Senecio douglasii grew thick on the dry hillside.
- The rancher warned us that Senecio douglasii is poisonous to his cattle.
