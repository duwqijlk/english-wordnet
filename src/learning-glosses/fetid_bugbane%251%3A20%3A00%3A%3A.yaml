simpleMeaning: A plant of Siberia and eastern Asia with bad-smelling green-white flowers.
scope: A plant of Siberia and eastern Asia with bad-smelling green-white flowers, also called foetid bugbane;
  not a sweet-smelling flower and not a shrub of western Europe.
examples:
- The fetid bugbane grew at the edge of the Siberian wood.
- Its fetid bugbane flowers smelled so bad that we moved away.
