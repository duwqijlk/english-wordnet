simpleMeaning: a ring of bright light drawn round the head of a holy person
scope: Also called glory and aura; a ring of bright light round the head of a saint, not a glow in the
  sky.
examples:
- The saint in the painting wore a golden halo.
- A halo shone round the head of the saint in the old picture.
