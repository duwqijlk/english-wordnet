simpleMeaning: the act of turning or rotating around on the spot
scope: This is one act of turning on the spot, not the act of winding something around, not a bend or
  kink in a line, and not a braided hairstyle.
examples:
- With a quick twist of his head, he checked the room behind him.
- A sharp twist of her wrist loosened the lid.
