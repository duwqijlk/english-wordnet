simpleMeaning: with no clear outline or set form, and nothing about it that marks it out
scope: A thing with no clear outline or set form, not a thing that merely lacks symmetry or good looks.
examples:
- The shapeless lump of clay sat on the table, with no clear outline at all.
- Shapeless clouds drifted across the sky, changing form as they moved.
