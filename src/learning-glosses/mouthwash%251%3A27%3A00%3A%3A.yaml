simpleMeaning: a liquid with medicine in it, used to wash the mouth and to hold in the throat and move
  it around there
scope: 'Also called gargle: a liquid with medicine for cleaning the mouth, not a drink and not toothpaste.'
examples:
- She used mouthwash to clean her mouth after brushing her teeth.
- He held the mouthwash in his mouth and throat, then spat it out.
