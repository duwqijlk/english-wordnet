simpleMeaning: out of spite, with a cruel wish to do harm
scope: Showing a cruel wish to hurt others out of spite, with spiteful and vindictive as other names for
  this sense, and not mere anger or a fair act.
examples:
- He gave a despiteful laugh when she fell.
- The despiteful child broke her sister's toy on purpose.
