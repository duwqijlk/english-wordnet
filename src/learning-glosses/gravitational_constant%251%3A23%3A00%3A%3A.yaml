simpleMeaning: In physics, the fixed number, the same everywhere, that links pull to mass and distance
  in Newton's law of pull
scope: In physics, this fixed number is also called constant of gravitation and universal gravitational
  constant, and is not a changing amount and not a law itself.
examples:
- The gravitational constant appears in Newton's law of universal pull.
- Physicists use the gravitational constant to work out the pull between masses.
