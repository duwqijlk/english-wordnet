simpleMeaning: Like, made of, or filled with long thin sharp-ended bits, above all of wood
scope: Like, made of, or filled with long thin sharp-ended bits, above all of wood, also called splintery;
  not smooth and not made of one solid piece.
examples:
- The slivery floor caught at bare feet with its sharp bits.
- Old pine boards can turn slivery as they dry out.
