simpleMeaning: A pinon of the south-west United States, with one needle in each bunch and often many stems,
  prized for its nuts.
scope: A pinon of the south-west United States with one needle in each bunch, also called single-leaf,
  single-leaf pine and single-leaf pinyon, not a pine of the east and not a tree with needles in pairs.
examples:
- The Pinus monophylla grows on dry hills in the south-west.
- Pinus monophylla nuts were gathered for food.
