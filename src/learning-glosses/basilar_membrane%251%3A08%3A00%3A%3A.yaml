simpleMeaning: a thin sheet in the inner ear that holds up the hearing organ
scope: A thin sheet in the inner ear that holds up the hearing organ, not the eardrum and not a nerve.
examples:
- Sound waves move the basilar membrane inside the ear.
- The basilar membrane supports the tiny hearing organ.
