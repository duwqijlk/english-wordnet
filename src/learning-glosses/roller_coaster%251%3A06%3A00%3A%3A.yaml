simpleMeaning: People ride this high track in a park for fun, most often round sharp bends and down steep
  drops
scope: Also called big dipper and chute-the-chute, it carries people round sharp bends and down steep
  drops in a park, for fun.
examples:
- The roller coaster climbed slowly and then rushed down the steep drop.
- The roller coaster rounded the sharp bend at speed.
