simpleMeaning: A greedy fish-eating fish of the waters of the north of the world
scope: A greedy fish-eating fish of the waters of the north of the world; not a small pond fish, and not
  a fish that eats plants.
examples:
- The northern pike is a greedy hunter among the reeds.
- He caught a northern pike in the cold northern lake.
