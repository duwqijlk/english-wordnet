simpleMeaning: a man who competes and holds the top position, above all rivals
scope: This is not a male royal ruler; it is a man who dominates a competitive field.
examples:
- For a decade he was the king of the heavyweight division.
- At twenty-five he was already the king of the local racing circuit.
