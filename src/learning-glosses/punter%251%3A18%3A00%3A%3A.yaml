simpleMeaning: In football, a player who kicks the ball after letting it fall from their hands, striking
  it before it touches the ground.
scope: Of the player in football who drops the ball from their hands and kicks it before it touches the
  ground.
examples:
- The punter kicked the ball high down the field.
- As punter, they dropped the ball and struck it cleanly before it hit the ground.
