simpleMeaning: A six-pointed star made from two triangles with equal sides, used as a sign of the Jewish
  faith.
scope: This is a six-pointed star made from two triangles with equal sides, used as a sign of the Jewish
  faith; Mogen David, Shield of David, Solomon's seal and Star of David are other names for this sense,
  and it is not a five-pointed star.
examples:
- The Magen David hung on the wall of the hall.
- A Magen David marks the front of the book about the Jewish faith.
