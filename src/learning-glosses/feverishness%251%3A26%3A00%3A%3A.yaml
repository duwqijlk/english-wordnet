simpleMeaning: It often means an infection is present when the body grows hotter than it should be
scope: 'Also called fever, febricity, febrility, and pyrexia: the body growing hotter than usual, often
  a sign of infection, not a hot day and not a feeling of warmth from hard work.'
examples:
- Her feverishness grew worse through the night.
- The nurse watched his feverishness, which often meant an infection was present.
