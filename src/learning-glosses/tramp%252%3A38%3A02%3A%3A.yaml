simpleMeaning: to go about with no set goal, often in search of food or a job
scope: To go about with no set goal, often in search of food or a job, also called range, roll, cast,
  drift, wander, swan, stray, roam, or ramble; not walking with heavy steps and not walking far for pleasure.
examples:
- The labourers tramped from town to town looking for work.
- They tramped across the country in search of food.
