simpleMeaning: a birth condition in which some or all fingers or toes are missing
scope: A birth condition with fingers or toes missing, also called adactylia and adactylism; not fingers
  or toes cut off later and not fingers or toes that are merely bent.
examples:
- The child was born with adactyly and has no toes.
- Adactyly means his hands were born without fingers.
