simpleMeaning: A place to spend the night out, open till late, where you can watch a show, dance, and
  eat and drink.
scope: Also called a club, a nightclub, and a nightspot; a late-night place with shows, dancing, food
  and drink, not a theatre and not a plain bar.
examples:
- They spent the evening at a cabaret, watching singers and dancing.
- He played the drums at a cabaret on Friday nights.
