simpleMeaning: Able to wake up or speed up the work of the body or the mind, by means of a chemical
scope: Able to wake up or speed up the work of the body or the mind, by means of a chemical; not a drug
  that puts a person to sleep and not a food that gives energy.
examples:
- The stimulative drug woke the patient up.
- A stimulative chemical can speed up the work of the body.
