simpleMeaning: A person with this quarrelsome readiness starts court cases and keeps them going
scope: A person with this quarrelsome readiness starts court cases and keeps them going, not a single
  lawsuit and not a fondness for arguing in words alone.
examples:
- His litigiousness meant he sued over every small slight.
- The firm's litigiousness kept it in court for years.
