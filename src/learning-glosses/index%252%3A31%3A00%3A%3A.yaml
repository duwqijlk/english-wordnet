simpleMeaning: to change wages, prices or other amounts so they follow changes in the general level of
  prices
scope: To change amounts so they follow price changes, not to add a list at the back of a book and not
  to put a name in such a list.
examples:
- The government indexes pensions so they rise when prices rise.
- The bank indexes the loan payments to the general level of prices.
