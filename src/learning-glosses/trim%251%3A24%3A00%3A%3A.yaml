simpleMeaning: The way an aircraft holds itself in the air when left to fly on its own
scope: The way a plane holds itself in the air when left on its own, not a decoration on a garment, not
  setting sails, and not being neat and tidy.
examples:
- The pilot checked the trim of the plane before takeoff.
- Left alone, the trim held the plane level in the air.
