simpleMeaning: to move the body in a set pattern, usually while music plays
scope: This is the action of performing a dance, not the noun senses such as the art form or the party,
  not moving gracefully, and not skipping or jumping about.
examples:
- They danced together at the wedding reception.
- She danced a waltz with her grandfather.
