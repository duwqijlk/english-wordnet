simpleMeaning: A place giving shelter to people driven from home by war, political oppression or their
  faith.
scope: A refuge for people displaced by war or persecution, not a soldier's temporary quarters, a prison,
  or a children's summer site.
examples:
- They spent three years in a camp for refugees from the war.
- The family fled the fighting and found shelter in a camp near the border.
