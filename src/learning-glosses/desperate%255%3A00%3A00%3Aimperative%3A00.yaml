simpleMeaning: Great urgency or force, especially when driven by a strong need or wish.
scope: Great urgency or force, especially when driven by a strong need or wish, not firm determination
  and not reckless violence.
examples:
- She felt a desperate need to explain herself.
- He had a desperate urge to leave the room.
