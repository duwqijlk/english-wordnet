simpleMeaning: A document that proves someone owns a share of a company.
scope: The paper proving a shareholder's ownership only; not corporate equity, a supply kept for future
  use, the goods a shop has on hand, a cooking liquid, a thick perennial stem, a graft rootstock, a bright-flowered
  Old World plant, a Malcolmia ornamental, a person's ancestry, a breed of domesticated animals, a person's
  reputation, lumber, the handle end of a tool, the handle or butt of a gun, a white cravat, farm animals,
  a routine thing, an overused saying, a standard item regularly sold, or any verb use (keeping goods
  on hand, fitting something out, putting fish into a pond, putting livestock on land, gathering a store
  for later, supplying something with goods, putting out sprouts).
examples:
- He kept the stock certificates in a fireproof safe.
- Old stock certificates from the 1920s are now collector's items.
