simpleMeaning: Blood tubes that carry blood to the outer sex organs of people.
scope: Blood tubes to the outer sex organs, also called arteria pudenda; not blood tubes to the heart
  and not blood tubes to the brain.
examples:
- The pudendal artery carries blood to the outer sex organs.
- Damage to a pudendal artery can cut off blood to that part of the body.
