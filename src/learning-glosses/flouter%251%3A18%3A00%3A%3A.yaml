simpleMeaning: A person who laughs at something in a scornful way, or shouts at it to show contempt.
scope: A person who laughs at something in a scornful way or shouts at it to show contempt, also called
  a mocker or a jeerer; not a person who laughs in a friendly way and not a person who argues with words.
examples:
- The flouter mocked the singer from the back of the hall.
- No one likes a flouter who jeers at other people's work.
