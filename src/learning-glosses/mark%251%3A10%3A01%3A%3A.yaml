simpleMeaning: a visible sign of shame or a bad reputation attached to someone
scope: A visible sign of shame or a bad reputation, not an ordinary printed symbol, not a clue that something
  happened, and not the lasting impression of a great deed; brand is another name for this sense.
examples:
- His public betrayal left a mark of infamy on the family name.
- The ruined castle remains a mark of the king's disgrace.
