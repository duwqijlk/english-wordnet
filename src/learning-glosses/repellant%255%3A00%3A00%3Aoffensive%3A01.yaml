senseId: repellant%5:00:00:offensive:01
synsetId: 01630074-s
simpleMeaning: Very nasty, making people draw back from it in dislike and disgust.
scope: 'Also called wicked, foul, disgusting, revolting, distasteful, loathsome, repellent, yucky, repelling,
  or skanky: very nasty, making people draw back from it in dislike and disgust, not a chemical that keeps
  animals away, not a substance put on cloth to keep water out, not serving to push things back, and not
  the power to push back.'
examples:
- The smell from the drain was repellant.
- Their manners at dinner were repellant to everyone at the table.
