simpleMeaning: a state of mind brought on by magic words, or as if brought on by them
scope: 'Also called spell, and another name for it is trance: this is the state of mind itself, not the
  magic words that bring it on.'
examples:
- A strange enchantment came over him when he heard the magic words.
- Under the enchantment, she could not move or speak.
