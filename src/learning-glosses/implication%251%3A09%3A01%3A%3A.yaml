schema: oewn-learning-gloss-v2
senseId: 'implication%1:09:01::'
synsetId: 05788882-n
simpleMeaning: a thing worked out from what is said or done, even when it is not said straight out
scope: A thing worked out from what is said or done, even when it is not said straight out; not the link
  between 'if' and 'then', not being mixed up in a wrong act, and not a charge.
examples:
- His resignation had political implications.
- The implication of her words was that she would leave.
