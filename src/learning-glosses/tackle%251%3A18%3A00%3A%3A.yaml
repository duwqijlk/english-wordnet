simpleMeaning: a football player who takes a front line place on the team, for attack or for defence
scope: This is a person who plays on the football line, not the place itself, not the act of bringing
  a player down, and not ship gear.
examples:
- Our tackle is the biggest player on the team.
- The right tackle blocked well and helped his team win.
