simpleMeaning: Doing something that the law forbids.
scope: This is the carrying out of a crime; it is not a government document granting military officer
  rank, not a fee paid as a share of money handled, not a group given a matter to consider, not a group
  of representatives, not the act of granting authority, not the state of being ready for service, not
  a formal command or order, not a special assignment given to someone, and not any verb use (equipping
  a ship for service, ordering goods, or charging someone with a task).
examples:
- The commission of the fraud took months of careful planning.
- He was charged with the commission of a violent offense.
