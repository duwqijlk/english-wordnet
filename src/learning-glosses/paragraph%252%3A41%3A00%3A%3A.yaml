simpleMeaning: to split a piece of writing into separate parts
scope: To split a piece of writing into separate parts, not the part itself, not the act of writing such
  parts, and not writing about someone in a short part of a paper.
examples:
- Paragraph the story before you print it.
- The teacher paragraphed the long text for her class.
