senseId: 'angioedema%1:26:00::'
synsetId: 14143792-n
simpleMeaning: large patches of swelling under the skin that return, start suddenly, fade within a day,
  and strike mostly young women, often after food or drugs set off an allergy
scope: Also called atrophedema, giant hives, and periodic edema; large patches of swelling under the skin,
  not hives from a sting and not a lasting swelling.
examples:
- Her angioedema flared up suddenly and the swelling under her skin faded by morning.
- Angioedema often follows an allergic reaction to food.
