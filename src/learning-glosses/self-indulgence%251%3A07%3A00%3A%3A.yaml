simpleMeaning: not being able to stop giving in to sudden wants and wishes
scope: Not being able to stop giving in to sudden wants and wishes, also called indulgence; not simply
  enjoying a pleasure now and then, and not excess in bodily appetites.
examples:
- His self-indulgence showed in the way he bought whatever caught his eye.
- Years of self-indulgence had left her unable to say no to a craving.
