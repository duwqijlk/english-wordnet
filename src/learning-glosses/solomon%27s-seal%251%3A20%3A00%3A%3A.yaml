simpleMeaning: One of several plants in the group Polygonatum, with pairs of hanging yellow-green flowers
  and a thick underground stem marked by scars in a set shape.
scope: A plant of the genus Polygonatum with paired drooping yellowish-green flowers and a thick rootstock
  marked with scars; the false Solomon's seal is a different plant, and so is the lily of the valley.
examples:
- Solomon's-seal grows in the shade with its paired drooping flowers.
- I found Solomon's-seal by its thick rootstock marked with scars.
