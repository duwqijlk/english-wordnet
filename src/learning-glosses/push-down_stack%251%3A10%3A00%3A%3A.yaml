simpleMeaning: A pile of things where the newest one on top is always the next one taken off, last in,
  first out
scope: 'Also called a stack or a push-down list: a pile where the last thing put in is taken out first,
  not a line where the first thing in is taken first.'
examples:
- The push-down stack kept the newest card on top.
- He took the top item from the push-down stack.
