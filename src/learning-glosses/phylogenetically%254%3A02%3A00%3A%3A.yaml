simpleMeaning: In a way that has to do with how a group of living things grew and changed over time.
scope: This is about how a group of living things grew and changed over time, not about one living thing's
  own growth, and not about how things look now.
examples:
- This part of the brain is phylogenetically old.
- The two kinds are phylogenetically close, so they share much.
