simpleMeaning: To write down information and keep it in a lasting form.
scope: This is writing information down for the future, not capturing sound electronically, showing a
  reading on a gauge, or the kept evidence itself.
examples:
- The clerk recorded every complaint in a handwritten log.
- Scientists recorded the temperature every hour in their notebook.
