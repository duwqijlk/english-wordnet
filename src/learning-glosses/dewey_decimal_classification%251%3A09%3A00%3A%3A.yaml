simpleMeaning: A way for libraries to sort factual publications into subject groups, giving each a three-number
  code and more numbers after a point; publications sit on shelves in number order.
scope: A library sorting scheme, also called the Dewey decimal system and the decimal system of classification.
examples:
- The library uses the Dewey decimal classification to shelve its books.
- She found the gardening book by its Dewey decimal classification number.
