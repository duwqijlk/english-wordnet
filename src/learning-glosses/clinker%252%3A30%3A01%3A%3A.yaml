simpleMeaning: To clear the cinders and hard lumps from a fire.
scope: To clear the cinders and hard lumps from a fire; not a lump of stuff that will not burn, left after
  a fire of wood, coal, or charcoal, nor to turn to such lumps, or form them, under too much heat in burning.
examples:
- They would clinker the fire each night.
- The stoker came to clinker the grate.
