simpleMeaning: a part that takes work from a motor and sends it to a tool or machine that needs it to
  run
scope: A part that moves work from a motor to other equipment, not the motor itself and not the tool that
  does the final job.
examples:
- The farmer used the power takeoff on his tractor to run the pump.
- A broken power takeoff meant the jackhammer got no work from the engine.
