simpleMeaning: The person who holds it can take money out of a bank account, or pay for things straight
  from that account, with this thin piece, usually plastic
scope: It lets the person who holds it take money out of a bank account or pay for things straight from
  it, and it is usually made of plastic.
examples:
- She paid with her debit card, and the money came straight out of her bank account.
- He used his debit card to take money out of his bank account.
