simpleMeaning: intensely felt and painful, like the sting of a thin edge or pointed object
scope: A feeling that hurts intensely, not a cutting edge, a harsh tone, or a sudden large rise.
examples:
- She felt a sharp pain in her ankle.
- A sharp wind cut through their coats.
