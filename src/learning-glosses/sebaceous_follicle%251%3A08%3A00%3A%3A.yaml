simpleMeaning: A skin gland that gives out an oily stuff, most often into a hair root, to oil hair and
  skin
scope: A skin gland that gives out an oily stuff, most often into a hair root, to oil hair and skin, also
  called glandulae sebaceae or sebaceous gland; not a sweat gland and not a hair root itself.
examples:
- The sebaceous follicle oils the hair as it grows.
- A blocked sebaceous follicle can swell.
