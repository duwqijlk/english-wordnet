simpleMeaning: Teeth that grow out of line are stopped from going wrong or put right by this part of tooth
  care.
scope: This part of tooth care, also called dental orthopaedics, dental orthopedics, orthodontia, and
  orthodontics, keeps teeth from growing out of line and puts crooked teeth right.
examples:
- Teeth that grow out of line are put right by orthodonture.
- Teeth can be kept straight with orthodonture.
