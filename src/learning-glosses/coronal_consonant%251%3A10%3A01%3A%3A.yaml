simpleMeaning: In phonetics, a speech sound made with the front part of the tongue, which can bend
scope: A speech sound made with the front part of the tongue that can bend, not a sound made with the
  lips or the back of the tongue.
examples:
- The 't' in 'top' is a coronal consonant.
- She learned that 's' is a coronal consonant made with the front of the tongue.
