simpleMeaning: Dried leaves of the hemp plant that people smoke or chew to feel very happy; seen as a
  soft drug, it is the law-banned drug used most often
scope: Also called marijuana, cannabis, or marihuana. This sense is the dried leaves used as a drug, not
  the strong-smelling plant itself, which is another sense of the same word.
examples:
- He was arrested for carrying ganja in his bag.
- Some people smoke ganja to relax after work.
