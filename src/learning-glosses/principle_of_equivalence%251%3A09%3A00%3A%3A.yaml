simpleMeaning: In physics, the rule that someone in a lab cannot tell if the lab stands in a steady pull
  from gravity or is speeding up
scope: In physics, a rule about what an observer inside a lab can and cannot tell about its motion.
examples:
- The principle of equivalence says the two labs would feel the same inside.
- She used the principle of equivalence to explain why the lab felt still.
