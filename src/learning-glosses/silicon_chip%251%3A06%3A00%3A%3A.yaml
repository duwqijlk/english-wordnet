simpleMeaning: electronic gear that does many jobs in one small circuit, made from a tiny crystal of a
  material that carries electric signals
scope: Also called a chip, a microchip, a micro chip and a microprocessor chip; a small piece of electronic
  gear, not a computer and not a plain wire.
examples:
- The silicon chip in the phone does many jobs at once.
- A single silicon chip runs the whole washing machine.
