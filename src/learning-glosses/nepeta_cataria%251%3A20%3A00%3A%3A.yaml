simpleMeaning: A hairy sweet-smelling herb that lives many years, with rings of small white purple-spotted
  flowers on a tip spike; once a household remedy, and strongly attractive to cats.
scope: Also called catnip and catmint; a hairy sweet-smelling herb that cats love, not a cooking mint
  and not a garden flower grown for show.
examples:
- Nepeta cataria grows in sunny corners and cats roll in it.
- She dried Nepeta cataria to use as a household remedy.
