simpleMeaning: A way of telling people apart by looking at the unique order of the paired units in the
  body's chemical code, often used as proof in criminal court cases.
scope: Also called genetic fingerprint; a way of telling people apart from their body's chemical code,
  often used as proof in criminal court cases.
examples:
- The DNA fingerprint proved he was at the scene.
- Police used a DNA fingerprint as evidence in the case.
