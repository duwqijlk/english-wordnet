senseId: 'nontraditional%3:00:00::'
synsetId: 00614561-a
simpleMeaning: not following the old, usual ways of doing things
scope: This sense is about not following the old, usual ways of doing things. It is the opposite of traditional,
  which means following those ways, and it is not just about being new in time.
examples:
- They chose a nontraditional wedding outdoors by the river.
- The school uses nontraditional lessons with no fixed timetable.
