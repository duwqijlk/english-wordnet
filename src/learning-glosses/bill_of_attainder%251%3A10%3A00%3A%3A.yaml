simpleMeaning: a law passed by a law-making body that says a person is guilty of treason or a serious
  crime, without a trial
scope: A law that says a person is guilty without a trial, not a court's ruling and not a charge brought
  before a judge.
examples:
- The new bill of attainder named the general a traitor without any trial.
- Bills of attainder are banned by the United States Constitution.
