schema: oewn-learning-gloss-v2
senseId: 'mark%1:10:05::'
synsetId: 06659006-n
simpleMeaning: a thing you can notice that points to something hidden, such as a visible hint that an
  event took place
scope: A noticed hint of something hidden, like evidence that an event happened - not a printed symbol,
  not a badge of shame, and not the lasting impression of an achievement; sign is another name for this
  sense.
examples:
- The muddy footprints were a mark that someone had come in while we slept.
- Spring flowers are a welcome mark that winter is finally over.
