simpleMeaning: the back part of a small body that sends out body chemicals, made mostly of tissue that
  makes those chemicals
scope: 'Also called a neurohypophysis, a pars nervosa, and a posterior pituitary: the back part of a small
  body that sends out body chemicals, not the front part of that body.'
examples:
- The posterior pituitary gland is the back part of that small body.
- The doctor pointed to the posterior pituitary gland on the scan.
