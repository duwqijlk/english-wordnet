simpleMeaning: The study of the sound set of one language, and the close look at and sorting of its smallest
  sense-changing sounds.
scope: This is the study of a language's sound set and the sorting of its smallest sounds, not the sounds
  themselves, and not the study of word sense.
examples:
- She took a course in phonemics at college.
- Phonemics looks at how sounds are sorted in a language.
