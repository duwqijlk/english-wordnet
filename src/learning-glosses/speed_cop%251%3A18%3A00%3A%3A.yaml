scope: A police officer who rides a motorbike and checks how fast drivers are going; motorcycle cop is
  another name for this sense, not a police officer on foot and not a traffic warden.
examples:
- The speed cop on his motorbike stopped the driver for going too fast.
- A speed cop checks how fast the cars are going.
