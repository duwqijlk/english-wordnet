simpleMeaning: to keep something for a long time by taking all water and other liquids out of it
scope: 'Also called dehydrate: taking all water out of a thing to keep it for a long time; it is not the
  word for a dull thing with no life or energy in it.'
examples:
- They desiccate the fruit so it will keep through the winter.
- Farmers desiccate herbs before they store them in jars.
