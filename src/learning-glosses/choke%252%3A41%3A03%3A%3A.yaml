simpleMeaning: to do badly when you should do well, because you feel nervous and worried
scope: This is doing badly at an important time because you feel nervous and worried, not being unable
  to breathe and not stopping living.
examples:
- The team choked in the final game and lost by a large score.
- She choked during her big test and could not answer questions she knew well.
