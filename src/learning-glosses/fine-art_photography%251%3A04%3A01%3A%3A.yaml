simpleMeaning: Pictures made with a camera in line with the maker's own vision as an artist.
scope: 'Also called fine art photography: pictures made with a camera as the maker''s own work, not pictures
  taken to sell a product and not pictures taken to record news.'
examples:
- Her fine-art photography hangs in galleries across the country.
- He turned to fine-art photography after years of taking wedding pictures.
