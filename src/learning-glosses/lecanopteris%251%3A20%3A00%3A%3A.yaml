simpleMeaning: Ants that live with them make their homes in the fat hollow stems under the ground of any
  of several strange ferns.
scope: Any of several strange ferns whose fat hollow stems under the ground give a home to ants.
examples:
- The lecanopteris in the pot had fat hollow stems where ants lived.
- Ants moved in and out of the hollow stems of the lecanopteris.
