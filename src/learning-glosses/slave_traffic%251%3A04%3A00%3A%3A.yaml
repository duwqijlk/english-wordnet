simpleMeaning: Above all Black Africans, people held as forced workers were shipped to America and bought
  and sold between the 1500s and the 1800s.
scope: Also called the slave trade, it is the buying and selling of people held as forced workers, above
  all Black Africans shipped to America between the 1500s and the 1800s.
examples:
- The slave traffic carried Black Africans by ship to America to be sold.
- People bought and sold through the slave traffic came mostly from Africa.
