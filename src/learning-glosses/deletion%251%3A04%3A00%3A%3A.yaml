senseId: 'deletion%1:04:00::'
synsetId: 00395418-n
simpleMeaning: The act of cutting out a thing written or printed.
scope: The act of cutting out a thing written or printed; not the gap left when a change by an editor
  makes a piece of writing shorter, nor in the study of genes, the loss or want of one or more small parts
  from a chromosome, nor any way in which sounds or words are left out of spoken words or phrases.
examples:
- Their deletion changed the page.
- The deletion was marked in red.
