simpleMeaning: A thin cover, grown from the middle layer, round the clear part of the eye that bends light
scope: A thin cover round the eye's clear part; not the clear part itself, and not the clear front window
  of the eye.
examples:
- The lens capsule holds the lens in place inside the eye.
- The surgeon opened the lens capsule to remove the cloudy lens.
