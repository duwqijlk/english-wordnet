simpleMeaning: 'Count the green cup and the ring of petals as one thing: together they shut in the parts
  of a flower that make seeds.'
scope: 'Also called perigonium, perianth, chlamys, and floral envelope: the outer parts of a flower as
  a whole, not the green cup or the ring of petals on their own.'
examples:
- The perigone wraps round the seed-making parts of the flower.
- Botanists call the cup and petals together the perigone.
