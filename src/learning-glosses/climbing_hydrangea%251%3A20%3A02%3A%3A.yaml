simpleMeaning: White to creamy flowers in fairly flat heads grow on a plant that loses its leaves in autumn,
  with roots that hang in the air.
scope: This plant loses its leaves in autumn and grows with roots in the air, not the kind with large
  flat flower heads.
examples:
- The climbing hydrangea had grown up the wall.
- The climbing hydrangea lost its leaves in autumn.
