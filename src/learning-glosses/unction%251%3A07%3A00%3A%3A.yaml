simpleMeaning: Smug earnestness that serves oneself.
scope: Smug earnestness that serves oneself; not a thick substance, usually with medicine in it, put on
  the skin as a cure or to soothe a sore, nor too many smooth words of praise, given with put-on charm,
  nor the anointing of oil as part of a holy rite or a healing rite.
examples:
- Their unction sickened the room.
- The unction of the preacher was plain.
