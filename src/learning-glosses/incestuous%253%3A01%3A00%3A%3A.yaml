simpleMeaning: about or involving sex between people who are close family members
scope: This sense is about real sex between close family members. It is not the looser sense where a group
  seems too close and shut off from others.
examples:
- He was charged over his incestuous relationship with his sister.
- The story is about an incestuous marriage between a brother and a sister.
