simpleMeaning: a flat thin four-sided piece, made of baked clay or rubber or a floor covering, put on
  a surface to cover it
scope: A flat thin piece for covering a floor or wall, not a piece used in a board game and not one made
  for a roof.
examples:
- The kitchen floor was covered in blue tiles.
- He laid a tile on the bathroom wall.
