senseId: hedged%5:00:00:qualified:02
synsetId: 01919895-s
simpleMeaning: Not open and direct in its wording, because it avoids saying something with no limits
scope: This describes words that are careful and not direct, not a row of bushes around a place and not
  a way to protect money.
examples:
- He gave a hedged answer and would not promise a date.
- Her hedged reply said the plan might work, but she made no clear claim.
