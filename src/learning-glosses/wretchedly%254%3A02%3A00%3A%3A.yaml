simpleMeaning: in a very unhappy way, showing great sadness or suffering
scope: In a way that shows someone is very unhappy and suffering, not simply in a very bad or poor way.
examples:
- '''I have lost everything,'' he said wretchedly.'
- She sat wretchedly by the window, crying all afternoon.
