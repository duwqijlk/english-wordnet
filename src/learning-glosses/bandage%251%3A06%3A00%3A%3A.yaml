simpleMeaning: A soft cover put over a hurt part of the body to keep it safe
scope: Also called patch; this is a soft cover for a hurt part of the body, not a cream or a hard splint.
examples:
- She put a bandage on his cut knee.
- The nurse changed the bandage on her arm.
