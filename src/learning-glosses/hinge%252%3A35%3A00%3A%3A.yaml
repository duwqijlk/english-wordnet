simpleMeaning: to fix one part to another with a joint that lets it swing open and shut
scope: To fix something with a joint that lets it swing, not the joint itself and not the key point that
  later events depend on.
examples:
- He hinged the small door to the frame so it could swing open.
- They hinged the lid to the box with two small pieces of metal.
