simpleMeaning: (of water or another liquid) to flow away as material that is no longer wanted or needed.
scope: This is liquid flowing away as unwanted matter, not the adjective sense describing bleak, remote
  land, not the noun senses for discarded materials, pointless activity, the habit of squandering resources,
  worthless wilderness, or a legal loss in an estate's value, and not the verb senses meaning to spend
  or throw away, use inefficiently, kill, spend extravagantly, lose vigor, make thin, destroy, grow weaker,
  or dispose of something.
examples:
- If the seal fails, dirty water will waste into the surrounding soil.
- The overflow pipe lets excess water waste safely into the drain.
