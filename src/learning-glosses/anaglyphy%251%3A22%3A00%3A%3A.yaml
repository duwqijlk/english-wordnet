simpleMeaning: Two pictures in clashing colours are laid one on the other, and seen through glasses with
  one red lens and one green lens, they stand out in depth.
scope: These are pictures in clashing colours that stand out in depth through glasses with one red lens
  and one green lens, not ordinary flat pictures.
examples:
- Anaglyphy made the flat picture stand out in depth.
- Through red and green glasses, the anaglyphy gave the picture depth.
