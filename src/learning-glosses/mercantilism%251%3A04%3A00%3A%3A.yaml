simpleMeaning: the buying and selling of things, done to supply goods and services
scope: The buying and selling of goods, done to supply goods and services; commerce and commercialism
  are other names for this sense, not the 18th-century system of government-controlled trade.
examples:
- Their mercantilism supplied the town with goods and services through buying and selling.
- Mercantilism is the business of buying and selling to supply what people need.
