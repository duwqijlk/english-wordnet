simpleMeaning: Small blood tubes from the front tubes of the eye that drain the white coat of the eye.
scope: Small blood tubes draining the white coat of the eye; scleral veins is another name for this sense;
  not blood tubes of the back of the eye and not ones of the eyelid.
examples:
- The venae sclerales drain the white coat of the eye.
- Tiny venae sclerales run from the front of the eye.
