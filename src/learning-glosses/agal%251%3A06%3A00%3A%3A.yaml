simpleMeaning: a cord, often of goat hair, that Arabs, above all Bedouins, wind round their heads to hold
  down the head cloth
scope: A cord wound round the head to hold down the head cloth; not the head cloth itself and not a plain
  headband.
examples:
- He wound the black agal round his head to hold the cloth in place.
- The agal is often made of goat hair.
