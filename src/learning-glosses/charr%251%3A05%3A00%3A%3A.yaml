simpleMeaning: any of several kinds of small fish like trout, in the group of living things (the genus)
  called Salvelinus
scope: A small fish like a trout, in the Salvelinus group; not just any small fish, only fish in this
  group.
examples:
- We caught a small charr in the cold lake.
- Charr live in deep, cold water and look like small trout.
