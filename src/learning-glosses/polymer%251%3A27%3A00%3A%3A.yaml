senseId: 'polymer%1:27:00::'
synsetId: 15018895-n
simpleMeaning: a substance found in nature or made by people, made of large molecules (groups of atoms)
  built as a chain of small, same parts repeated again and again
scope: This is the whole large built-up thing, not one of the small repeated parts that make it and not
  a plain mix of separate things.
examples:
- This plastic is a polymer made in a factory.
- Natural rubber is a polymer found in trees.
