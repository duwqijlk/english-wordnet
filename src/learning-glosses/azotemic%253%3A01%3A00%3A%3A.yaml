simpleMeaning: Urine that holds too much nitrogen waste, most often because the kidneys do not work well,
  is described by this word.
scope: This word names urine with too much nitrogen waste in it; uraemic and uremic are other names for
  this sense.
examples:
- The test found the urine azotemic, with too much nitrogen waste in it.
- Urine that is azotemic most often comes from kidneys that do not work well.
