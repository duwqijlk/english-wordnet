simpleMeaning: a painful or upsetting event that makes life hard
scope: This is a hardship or misfortune someone endures; unlike the court row it has nothing to do with
  guilt, and unlike the sports row it is not a qualifying contest.
examples:
- Caring for her sick father was a long trial for the whole family.
- The flood was the worst trial the village had faced in years.
