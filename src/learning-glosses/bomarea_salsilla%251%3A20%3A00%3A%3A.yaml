simpleMeaning: A tropical vine with umbrella-like clusters of small purple flowers and roots good to eat,
  sometimes boiled in place of potatoes; from Colombia.
scope: Also called salsilla; a tropical vine with umbrella-like clusters of small purple flowers and roots
  good to eat, distinct from other vines with roots that are not good to eat.
examples:
- Bomarea salsilla grows in Colombia with purple flowers.
- We boiled the roots of Bomarea salsilla in place of potatoes.
