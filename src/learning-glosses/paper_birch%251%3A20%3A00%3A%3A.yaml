simpleMeaning: People peel the white bark off this small American birch in sheets and often work it into
  such things as baskets and toy canoes.
scope: 'Also called canoe birch and paperbark birch: a small American birch whose white bark peels off
  in sheets, often worked into baskets or toy canoes.'
examples:
- The paper birch by the lake had white bark peeling off in strips.
- They wove a basket from paper birch bark.
