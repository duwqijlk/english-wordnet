simpleMeaning: Run by computer, this phone service picks up calls, sends them where they should go, and
  keeps spoken notes to hand on.
scope: Also called voicemail, this computer system answers calls and keeps phone messages; not a live
  person taking calls.
examples:
- Leave a voice mail after the beep.
- I checked my voice mail and found three messages.
