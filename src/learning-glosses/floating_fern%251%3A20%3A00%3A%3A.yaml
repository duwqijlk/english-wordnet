simpleMeaning: From the east of the United States to warm America, this small water plant drifts free
  on the surface, and now grows wild in western and southern Europe.
scope: Also called a mosquito fern, this small water plant drifts free on the surface and now grows wild
  in western and southern Europe, unlike the tropical one often kept in fish tanks.
examples:
- The floating fern drifted free on the water.
- The children watched the floating fern drift free on the water.
