simpleMeaning: something used to treat, prevent or ease the symptoms of a disease
scope: This is a drug or other thing used against illness, not the profession itself, not the branches
  of medical science that use nonsurgical methods, not punishment for one's actions, and not the verb
  meaning to treat someone.
examples:
- The doctor prescribed a medicine for her cough.
- Keep all medicines out of reach of children.
