simpleMeaning: used of the less old of two people who share the same name, especially a son named after
  his father.
scope: This is not a general word for a low age, and not a comparison between unrelated people.
examples:
- John Smith, younger, took over the family business.
- The younger Mr. Jones ran the shop.
