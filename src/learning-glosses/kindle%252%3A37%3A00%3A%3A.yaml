simpleMeaning: To start a feeling in someone so that it shows, as pity, a smile, or sympathy does.
scope: Also called fire, raise, provoke, arouse, or evoke, this is bringing a feeling out in someone,
  not lighting a fire.
examples:
- Her kind words kindled pity in everyone who heard her.
- The speech kindled a smile on the faces of the tired crowd.
