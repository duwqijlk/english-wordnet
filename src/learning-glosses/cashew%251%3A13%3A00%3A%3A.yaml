simpleMeaning: a nut with the shape of a kidney that people can eat only after it has been roasted
scope: This nut, also called cashew nut, is the food itself, not the tree it grows on.
examples:
- She ate a handful of roasted cashews for a snack.
- Cashews must be roasted before people can eat them safely.
