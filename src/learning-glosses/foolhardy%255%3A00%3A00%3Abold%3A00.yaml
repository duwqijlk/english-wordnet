simpleMeaning: openly not caring about danger or about what may happen, and going ahead in a bold way
  anyway
scope: 'Also called reckless, rash and heady: doing something bold without caring about danger or what
  may happen, not being brave in a safe and wise way.'
examples:
- It was foolhardy to climb the cliff without a rope.
- He made a foolhardy attempt to cross the river in the storm.
