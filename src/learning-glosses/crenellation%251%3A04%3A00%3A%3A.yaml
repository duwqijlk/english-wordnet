senseId: 'crenellation%1:04:00::'
synsetId: 00913403-n
simpleMeaning: the act of building high, strong walls (ramparts) with gaps in them, through which guns
  or arrows can be fired
scope: 'Also called crenelation: this is the act of building such walls, not the finished wall with gaps
  that stands around the top of a castle.'
examples:
- The crenellation of the castle walls took the builders a whole summer.
- During the crenellation, the workers left narrow gaps for the archers.
