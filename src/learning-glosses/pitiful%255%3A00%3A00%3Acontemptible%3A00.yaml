simpleMeaning: making people feel both scorn and pity at the same time
scope: 'Also called pathetic: stirring both scorn and pity, not the sense of simply deserving pity.'
examples:
- His pitiful excuses earned him both pity and scorn.
- The pitiful show of courage made the crowd feel sorry and scornful at once.
