simpleMeaning: 'a game children play on an area drawn on the ground: a child throws a stone into the area,
  hops through it and back, then picks the stone up'
scope: A children's game played on an area drawn on the ground, where a child throws a stone into the
  area, hops through it and back, and picks the stone up. Not a game played on a board or on a screen.
examples:
- The girls played hopscotch in the school yard all afternoon.
- In hopscotch, you hop on one foot through the drawn squares to reach the stone.
