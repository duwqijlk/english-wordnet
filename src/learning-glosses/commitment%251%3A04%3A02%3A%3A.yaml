simpleMeaning: a duty to pay money that comes from an agreement made by contract
scope: A duty to pay money under a contract; not the quality of firm purpose, and not the act of tying
  yourself to a way of acting.
examples:
- The loan is a long-term commitment, with money to pay back every month.
- Before signing, she checked every commitment the contract would place on her.
