simpleMeaning: Sold under the name Methedrine, this amphetamine-based drug comes as clear crystals of
  a salt and excites the nerves while cutting hunger.
scope: 'Also called glass, ice, trash, chalk, meth, crank, shabu, methamphetamine, deoxyephedrine, and
  methamphetamine hydrochloride: a drug made from amphetamine that wakes the nerves and cuts hunger, not
  a drug that puts a person to sleep.'
examples:
- The police found chicken feed in small clear crystals.
- Chicken feed wakes the nerves and cuts hunger.
