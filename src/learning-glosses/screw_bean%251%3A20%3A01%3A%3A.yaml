simpleMeaning: In the southwest of the United States and the northwest of Mexico, a bush or small tree
  bears seed cases twisted round in a curl.
scope: People also call it screwbean, screwbean mesquite, or tornillo, and it is the bush or tree itself,
  not the sweet pod it bears.
examples:
- The screw bean grew in the southwest of the United States.
- The screw bean bore seed cases twisted round in a curl.
