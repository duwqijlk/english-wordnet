simpleMeaning: A line drawn through places on a map where the same stage of a thunderstorm happened at
  the same time.
scope: A line through places where the same stage of a thunderstorm happened at the same time, not a line
  joining places with the same rainfall and not a line of equal temperature.
examples:
- The isobront linked towns struck by the same storm stage at once.
- On the weather map, an isobront showed where the thunder peaked together.
