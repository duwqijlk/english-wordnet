senseId: 'immodest%3:00:02::'
synsetId: 01543810-a
simpleMeaning: thinking or showing that you are more important or better at things than you really are
scope: About thinking you are more important or able than you are; not the sense about dress, words, or
  acts that are not proper or polite.
examples:
- His immodest claim that he was the best player on the team annoyed everyone.
- She gave an immodest speech about her own great success.
