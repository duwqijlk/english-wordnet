simpleMeaning: happy and proud, especially because of a win or success
scope: 'Triumphant is another name for this sense: feeling happy and proud after a win or success. Not
  the sense that means connected with a win or used to mark a win.'
examples:
- She gave a triumphal smile after winning the race.
- He felt triumphal as his team lifted the cup.
