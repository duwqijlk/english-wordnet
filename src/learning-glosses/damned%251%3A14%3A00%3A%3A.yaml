simpleMeaning: people who are judged and sent to punishment that never ends
scope: A word for the group of people sent to punishment that never ends; not the swear-word adjective
  that makes another word stronger, and not the adjective for someone in danger of that punishment.
examples:
- In the old story, the damned cry out from the fire.
- He felt he had visited the land of the damned.
