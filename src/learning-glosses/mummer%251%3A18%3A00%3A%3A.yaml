simpleMeaning: a performer who acts a part in silence, using only the face and the body to show what is
  happening
scope: 'Also called a mime: a silent actor who tells a story with the face and body alone, not an actor
  who speaks lines.'
examples:
- The mummer bowed and mimed opening a door that was not there.
- At the fair, a mummer in white paint made the crowd laugh without saying a word.
