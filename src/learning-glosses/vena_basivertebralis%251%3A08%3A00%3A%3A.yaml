simpleMeaning: one of several veins that drain the spongy inside of the back bones and empty into the
  web of veins at the front inside the spine
scope: 'Also called basivertebral vein: one of the veins that drain the spongy inside of the back bones,
  not an artery and not a vein of the neck.'
examples:
- The vena basivertebralis drains the spongy substance of the vertebrae.
- Several vena basivertebralis veins empty into the vertebral venous plexus.
