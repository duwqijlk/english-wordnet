simpleMeaning: a local church area in the care of one church leader; it is one part of a larger church
  area (a diocese)
scope: This is the local church area in the care of one church leader, not the church building itself
  and not the larger area that holds many such areas.
examples:
- The new priest visited every home in the parish.
- Our parish is small, with only two villages in it.
