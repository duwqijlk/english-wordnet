simpleMeaning: showing a close link, from knowing a person or thing well or from being closely joined
  with it
scope: Close from knowing a person or thing well, or from things being closely joined; not warm and friendly
  in feeling, and not used for private body parts.
examples:
- They are intimate friends who tell each other everything.
- There is an intimate link between the two subjects she studies.
