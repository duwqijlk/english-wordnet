simpleMeaning: Under the laws that govern a country, this part of the study of money and goods looks at
  the conditions that exist and the choices those laws allow.
scope: This part of the study of money and goods looks at the conditions that exist and the choices the
  laws of a country allow.
examples:
- Constitutional economics asks how a country's laws shape the choices people can make.
- She studied constitutional economics to learn how rules limit what a government can do.
