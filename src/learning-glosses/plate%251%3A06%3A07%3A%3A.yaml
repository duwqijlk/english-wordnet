simpleMeaning: a flat glass or metal sheet used in photography to record an image
scope: A sheet made for photography, not an ordinary sheet of metal or glass, a piece of armor, or a dish
  of food; photographic plate is another name for this sense.
examples:
- The old photographs were stored on glass plates.
- She developed the plate in a darkroom.
