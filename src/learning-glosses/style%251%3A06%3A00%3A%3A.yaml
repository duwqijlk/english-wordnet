simpleMeaning: a sharp-pointed instrument used to write, draw, or cut designs into a surface
scope: This is the pointed tool, not the rules for spelling and printing, not a narrow growth on a plant
  or animal, and not elegance of appearance.
examples:
- Roman schoolchildren used a style to scratch letters into wax tablets.
- The engraver pressed the style into the copper plate to cut the design.
