simpleMeaning: a caution given before something happens soon, especially something bad or dangerous
scope: This is a caution given before something happens soon, especially about something bad or dangerous;
  warning, admonition and monition are other names for this sense, and it is not a simple hint or a command.
examples:
- His final word of advice was not to play with matches.
- Her word of advice before the storm was to keep the doors shut.
