simpleMeaning: causing harm or damage, especially when something hits suddenly and hard, or when disease
  or great loss strikes
scope: 'Also called blasting: this means causing sudden harm or damage, not being in a ruined state and
  not costing too much money.'
examples:
- A ruinous storm destroyed the young fruit trees.
- The ruinous wind tore branches from the trees.
