simpleMeaning: the person who looks after the physical side of a show and is in charge of the raised platform
  while the show is on
scope: The person who looks after the physical side of a show and runs the raised platform while it is
  on; stager is another name for this sense; not the director, who guides the acting, and not an actor.
examples:
- The stage manager called for quiet before the curtain rose.
- Our stage manager checks every light before the show starts.
