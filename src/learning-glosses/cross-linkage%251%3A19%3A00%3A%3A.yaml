simpleMeaning: A strong join at the side that holds two chains of atoms next to each other in a big molecule.
scope: This is a side bond joining two chains of atoms, not the act of joining them; also called cross-link.
examples:
- A cross-linkage holds the two chains together.
- Cross-linkages form between the chains.
