synsetId: 10116389-n
simpleMeaning: A person swimming who stays up on the top of the water without sinking.
scope: A swimmer who stays up on the water, not a loan whose rate shifts with another rate, not a policy
  that covers goods wherever they are, not spots seen before the eyes, not a voter who votes in more than
  one place in one election, not a thing that floats, and not a wanderer with no fixed home.
examples:
- The floater drifted on their back, arms spread wide.
- Only a calm floater can rest on the water without kicking.
