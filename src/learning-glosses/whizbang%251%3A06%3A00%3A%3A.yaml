simpleMeaning: A firework that, like the shell of the same name, first makes a whizzing sound and then
  bursts with a loud bang
scope: A firework that whizzes then bursts; whizzbang is another name for this sense, and it is not a
  quiet sparkler or a big rocket.
examples:
- The children lit a whizbang in the yard.
- A whizbang went off with a loud bang.
