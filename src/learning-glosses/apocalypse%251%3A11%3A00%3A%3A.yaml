simpleMeaning: a great disaster that shakes the whole world, in which God wipes out the powers of evil
  that rule it
scope: A world-shaking disaster in which God destroys the ruling powers of evil, not a sudden bad event
  in general.
examples:
- In the story, the apocalypse ends the rule of evil on earth.
- They feared the apocalypse would come when the powers of evil fell.
