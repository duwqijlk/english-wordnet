simpleMeaning: In physics, the set of light lines given off when electrons move between levels inside
  an atom, a set that marks one element out from another
scope: The set of lines given off by one element's atoms, not the broad band of light from a hot solid
  and not the lines from a star.
examples:
- The atomic spectrum of sodium shows two bright yellow lines.
- Scientists read the atomic spectrum to tell which element is present.
