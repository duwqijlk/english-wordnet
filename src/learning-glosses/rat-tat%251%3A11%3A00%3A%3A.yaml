simpleMeaning: a set of short sharp taps, as when a drum is hit or a door is knocked on
scope: 'Also called rat-a-tat and rat-a-tat-tat: short sharp taps, not one tap alone and not a ring of
  a bell.'
examples:
- There was a rat-tat at the door before breakfast.
- The rat-tat of sticks on the drum kept time for the march.
