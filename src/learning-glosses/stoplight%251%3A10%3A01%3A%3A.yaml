simpleMeaning: a red light at the back of a car or other road vehicle that goes on when the driver uses
  the brakes to slow down or stop
scope: This is the red light at the back of a vehicle that goes on for braking; it is not the set of lights
  at a road crossing that tells cars when to go.
examples:
- The car's left stoplight came on when the driver braked.
- A broken stoplight can make driving behind that car unsafe.
