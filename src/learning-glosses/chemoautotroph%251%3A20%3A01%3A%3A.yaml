simpleMeaning: Most of its carbon comes from the gas carbon dioxide for a living thing that gets its power
  from chemicals.
scope: This living thing is also called a chemotrophic autotroph.
examples:
- The chemoautotroph gets its power from chemicals.
- A chemoautotroph takes most of its carbon from carbon dioxide.
