simpleMeaning: a time of rough, wild trouble and upset in politics or in the life of a country, when order
  breaks down
scope: Wild disorder in public life, not bad weather in the air and not the shaking of a plane.
examples:
- The industrial revolution was a period of great turbulence.
- The country went through years of turbulence after the election.
