simpleMeaning: The person says which traits from a list fit them and which acts and choices they would
  make in imagined cases, in a set of questions about their own character.
scope: Also called self-report inventory, this is a set of questions a person answers about their own
  character.
examples:
- He answered a self-report personality inventory about his own traits.
- The self-report personality inventory asked which choices she would make in imagined cases.
