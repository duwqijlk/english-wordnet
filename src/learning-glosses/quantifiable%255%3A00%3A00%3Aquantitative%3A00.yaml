schema: oewn-learning-gloss-v2
senseId: quantifiable%5:00:00:quantitative:00
synsetId: 01922126-s
simpleMeaning: able to be measured or counted and shown as a number or amount
scope: This says something can be shown as a number or amount, not what the number is and not how good
  it is or what kind it is.
examples:
- The cost of the damage is quantifiable, so we can put a price on it.
- Not all risks are quantifiable in money.
