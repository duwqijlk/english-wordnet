simpleMeaning: 'This machine can take in data of three kinds: data sent out, data sent in, and other data
  that has been worked on.'
scope: Also called input/output device and I/O device, this is a machine that takes in data sent out,
  data sent in, or other data that has been worked on, not a machine that only shows data.
examples:
- The IO device took in the data from the keyboard.
- The IO device sent the finished data to the printer.
