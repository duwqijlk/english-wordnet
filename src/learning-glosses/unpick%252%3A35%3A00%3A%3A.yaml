simpleMeaning: To take a thing apart thread by thread until it comes undone, or to come undone that way.
scope: Also called untangle, unravel, unknot, or unscramble; taking a thing apart thread by thread until
  it comes undone, not undoing the stitches of a piece of sewing.
examples:
- She began to unpick the old sweater to reuse the wool.
- The seam started to unpick after years of wear.
