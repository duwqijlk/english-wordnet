simpleMeaning: Blood tubes from the network of tubes in the throat that empty into the deep blood tube
  of the neck.
scope: Blood tubes from the throat network that empty into the deep neck tube; pharyngeal vein is another
  name for this sense; not blood tubes of the mouth and not ones of the chest.
examples:
- The vena pharyngeus carries blood from the throat to the neck tube.
- A cut near the vena pharyngeus can bleed heavily.
