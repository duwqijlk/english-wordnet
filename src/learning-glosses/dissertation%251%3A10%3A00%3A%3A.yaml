simpleMeaning: a long piece of writing that puts forward a new way of looking at a subject, found by careful
  study, usually needed for a higher degree
scope: 'Also called a thesis: a long piece of writing with a new idea from study for a higher degree,
  not a short school essay.'
examples:
- She spent three years writing her dissertation for her higher degree.
- His dissertation put forward a new idea about how children learn to read.
