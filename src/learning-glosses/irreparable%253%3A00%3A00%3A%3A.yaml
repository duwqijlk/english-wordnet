senseId: 'irreparable%3:00:00::'
synsetId: 01970617-a
simpleMeaning: that cannot be fixed or made good again
scope: Damage or harm that can never be fixed, not damage that is only hard or costly to fix.
examples:
- The fire caused irreparable harm to the old building.
- The mistake did irreparable damage to their friendship.
