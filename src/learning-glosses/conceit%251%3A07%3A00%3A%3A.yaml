simpleMeaning: thinking far too well of yourself and your looks, a false sense of your own worth
scope: Too much pride in yourself; vanity is another name for this sense, not the clever wordplay sense
  of conceit.
examples:
- His conceit made him sure everyone admired him.
- Her conceit showed in every boast about her looks.
