simpleMeaning: A thief who breaks into another person's house without leave.
scope: A thief who breaks into another person's house without leave, also called housebreaker; not a thief
  who steals in the street, and not a thief who breaks into a shop.
examples:
- The cat burglar slipped in through a window.
- The cat burglar took jewels from the house.
