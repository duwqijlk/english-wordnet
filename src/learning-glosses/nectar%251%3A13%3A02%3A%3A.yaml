simpleMeaning: fruit juice, especially when served pure, with no water added to thin it
scope: Fruit juice, especially when served pure and undiluted, not the drink of the gods in old stories
  and not the sweet juice that draws bees to flowers.
examples:
- She poured a glass of peach nectar for breakfast.
- This nectar is pure fruit juice, with no water added.
