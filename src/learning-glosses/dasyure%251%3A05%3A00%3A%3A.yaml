simpleMeaning: Any of several pouched animals that live more or less in trees and look a bit like martens.
scope: A pouched animal that lives in trees and looks like a marten; not a possum and not a weasel.
examples:
- The dasyure hunts in the trees at night.
- A dasyure looks a bit like a marten.
