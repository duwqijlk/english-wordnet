simpleMeaning: A unit of force, the same as the pull of the earth on a mass; it tells how much force acts
  on a body when its speed or course alters.
scope: A unit of force from gravity, not a unit of weight and not a letter; also called gee and g-force.
examples:
- The pilot felt 3 g in the sharp turn.
- At 5 g, the test pilot could barely lift his arm.
