simpleMeaning: to bend your back forward and down from the waist
scope: 'Also called bow, bend, and crouch: to bend the back forward from the waist, not to drop down fast
  on an animal and not to act in a bad or low way.'
examples:
- She stooped to pick up the bag from the floor.
- He stooped to pass under the low door.
