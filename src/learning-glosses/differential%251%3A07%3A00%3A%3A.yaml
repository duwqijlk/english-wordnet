simpleMeaning: something about a thing that makes it different from other things that are like it
scope: This is something about a thing that shows how it is different from like things; not a math result
  about change and not the word that describes a gap.
examples:
- Price is the main differential between the two phones.
- Taste was the differential that made her pick one cake over the other.
