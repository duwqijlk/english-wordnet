simpleMeaning: a fixed amount used to say how heavy atoms or tiny bits of matter are
scope: A fixed amount used to say how heavy atoms or tiny bits of matter are, not a measure of length
  and not a measure of heat.
examples:
- The atomic mass unit is used to weigh single atoms.
- Scientists give the weight of a molecule in atomic mass units.
