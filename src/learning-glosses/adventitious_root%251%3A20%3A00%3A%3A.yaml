simpleMeaning: A growth that comes up in a strange place, as from a stem, and not in the usual place.
scope: A growth in a strange place, as from a stem, not a growth in the usual place under the ground and
  not a stem itself.
examples:
- The ivy put out an adventitious root from its stem.
- An adventitious root can grow from a leaf joint.
