simpleMeaning: Castings and things shaped while hot are made from this strong metal, which holds more
  zinc than the weaker kind.
scope: Also called yellow metal, it is the strong metal with more zinc, used for castings and things shaped
  while hot.
examples:
- The workshop ordered alpha-beta brass for the castings because it is stronger than the other kind.
- They shaped the alpha-beta brass while it was still hot.
