simpleMeaning: one of several red drugs that kill germs, taken from tiny living things in the soil
scope: A red drug that kills germs, taken from tiny living things in the soil; not a drug made in a lab,
  and not a drug that only eases pain.
examples:
- The doctor gave actinomycin to fight the infection.
- Actinomycin comes from tiny living things found in the soil.
