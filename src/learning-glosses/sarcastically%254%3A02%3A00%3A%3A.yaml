simpleMeaning: in a mocking way that says the opposite of what is really meant
scope: Said in a mocking way that means the opposite, not said in a plain or kind way.
examples:
- ‘Ah, now we're getting at the truth,’ he said sarcastically.
- She thanked him sarcastically for the mess he had made.
