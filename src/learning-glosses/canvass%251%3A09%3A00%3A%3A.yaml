senseId: 'canvass%1:09:00::'
synsetId: 05809006-n
simpleMeaning: a set of questions asked to a small group of people picked by chance, done to find out
  what people in general think
scope: 'Also called poll and opinion poll: a set of questions to find out what people think, not heavy
  cloth for sails or tents, and not going to homes to ask for votes.'
examples:
- A canvass of local voters showed most people wanted lower taxes.
- The group did a canvass to learn what young people think about the plan.
