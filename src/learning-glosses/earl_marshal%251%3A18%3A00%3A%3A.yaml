simpleMeaning: A high officer of the English nobility who plans royal parades and other formal events
scope: A high officer of the English nobility who plans royal parades, not a soldier and not a royal servant.
examples:
- The earl marshal planned the royal procession.
- An earl marshal organises ceremonies for the English nobility.
