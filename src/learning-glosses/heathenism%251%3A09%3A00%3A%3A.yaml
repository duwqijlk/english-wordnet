simpleMeaning: These are the many faiths that are not the Christian, Jewish or Muslim faith
scope: Any faith other than the Christian, Jewish or Muslim faith, also called pagan religion and paganism,
  not one of those three faiths and not a lack of all faith.
examples:
- Heathenism in the old north took many forms.
- The book traces heathenism back to the faiths that came before Christianity.
