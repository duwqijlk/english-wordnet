simpleMeaning: a growth on a plant or animal, like the flap under a hen's beak or a bump near the scar
  of some seeds
scope: A growth, also called caruncula; not a wart and not a fruit.
examples:
- The caruncle hung below the rooster's beak.
- A caruncle grows near the scar on some seeds.
