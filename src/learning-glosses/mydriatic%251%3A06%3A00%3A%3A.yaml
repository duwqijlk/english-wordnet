simpleMeaning: The black opening in the middle of the eye grows wider when a person takes this medicine,
  which helps the doctor look at the eye
scope: 'Also called a mydriatic drug: a medicine that makes the black opening of the eye grow wider, to
  help look at the eye, not a medicine that makes it grow smaller.'
examples:
- The nurse put a mydriatic in his eye before the test.
- A mydriatic widened her pupils so the doctor could see inside her eye.
