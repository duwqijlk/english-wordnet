senseId: 'average_deviation%1:09:01::'
synsetId: 92436720-n
simpleMeaning: A mean worked out from the gaps between each number and the middle value of the set, saying
  how spread out the set is.
scope: This figure gives the mean size of the gaps from a set's middle value, not the middle value itself,
  and it is also called average absolute deviation.
examples:
- The average deviation of the temperatures was three degrees.
- They used the average deviation to show how much the readings varied.
