simpleMeaning: a house built by a gate, where the person who guards the gate most often lives
scope: A house by a gate where the gatekeeper most often lives, not a guard's hut without a house and
  not the gate itself.
examples:
- The gatehouse stood beside the main entrance to the estate.
- The keeper lived in the gatehouse by the old wooden gate.
