simpleMeaning: A yearly French state prize in a contest for painters, artists, sculptors, musicians and
  architects; the winner in each art gets help to study in the Italian capital.
scope: A French state prize given each year, with one winner in each of five arts who gets help to study
  in Rome.
examples:
- She won the Prix de Rome for her painting.
- The Prix de Rome sent him to study in Rome for a year.
