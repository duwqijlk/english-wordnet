simpleMeaning: To bounce back after striking a surface, as heat, sound, light, or shock waves do.
scope: To bounce back after striking a surface, as heat, sound, light, or shock waves do, not to treat
  a thing in a furnace.
examples:
- Her voice reverberated through the empty hall.
- The sound reverberated off the stone walls long after the bell stopped.
