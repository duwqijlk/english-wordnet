simpleMeaning: In medicine, the blowing of air or a powder mixed with medicine into the lungs or into
  another hollow part of the body
scope: In medicine, the blowing of air or a powder mixed with medicine into the lungs or another hollow
  part of the body; not breathing in on one's own and not putting medicine in with a needle.
examples:
- Insufflation of the powder into the lungs eased the cough.
- The doctor used insufflation to get the drug into the sinus.
