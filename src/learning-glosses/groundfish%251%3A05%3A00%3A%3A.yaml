simpleMeaning: Fish that live at the bottom of the sea, above all the cod-like fish such as cod and haddock,
  important for sale, and flat fish such as flounder
scope: These are fish that live at the bottom of the sea; bottom fish is another name for this sense,
  not fish that swim near the top and not shellfish.
examples:
- Groundfish are caught by boats that drag nets along the sea bed.
- Cod is a groundfish that lives near the bottom.
