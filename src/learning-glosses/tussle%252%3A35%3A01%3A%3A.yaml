simpleMeaning: To fight and struggle with another person or animal in a rough, messy way, with your bodies
  close together
scope: Also called scuffle. This is a close, messy fight, not a fight at a distance and not an argument
  in words only.
examples:
- The two men tussled on the floor by the door.
- The boys tussled over the ball in the yard.
