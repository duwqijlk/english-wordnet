simpleMeaning: Forcing a liquid into a part of the body, above all through the tubes that carry blood.
scope: Forcing a liquid into a part of the body, above all through the tubes that carry blood, not taking
  a liquid out of the body and not a liquid that soaks in by itself.
examples:
- Perfusion brought the drug deep into the sick organ.
- The surgeon kept up perfusion through the blood tubes.
