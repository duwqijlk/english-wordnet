simpleMeaning: old age brings a loss of memory and clear thought as the brain breaks down, with no disease
  of the brain's blood vessels
scope: This is a loss of memory and clear thought in old age, also called senile dementia; not a loss
  of memory from a stroke or from a disease of the blood vessels in the brain.
examples:
- After years of senile psychosis, he no longer knew his own children.
- The book described senile psychosis as a slow loss of memory in old age.
