simpleMeaning: The attacker dies too in this attack, killing or hurting other people, most often with
  a bomb
scope: An attack that kills or hurts others while the attacker dies too, most often with a bomb, not a
  battle between armed sides and not an attack the attacker walks away from.
examples:
- The martyr operation killed several people at the market.
- Police said the martyr operation was carried out with a bomb.
