simpleMeaning: Made to look like raised carving, this is a painting or a stained-glass window, among other
  things, in shades of grey with strong light and shade.
scope: This is work in shades of grey that looks like raised carving, not a work in full colour.
examples:
- The grisaille panels on the wall looked like stone carvings.
- She studied the grisaille window, painted all in shades of grey.
