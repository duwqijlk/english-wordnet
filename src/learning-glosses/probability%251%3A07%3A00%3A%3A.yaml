simpleMeaning: how likely a thing is to happen, or the thing that is most likely to happen
scope: How likely a thing is to happen, or the most likely thing to happen; not a number that gives the
  chance of an event.
examples:
- For a while mutiny seemed a probability.
- Going by past experience, there was a high probability that the visitors were lost.
