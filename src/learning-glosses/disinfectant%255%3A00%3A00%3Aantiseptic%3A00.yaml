simpleMeaning: keeping infection (sickness in the body caused by very small living things) from starting
  by slowing or stopping their growth or action
scope: This describes something that stops infection; it does not name the heat, rays, or chemical itself
  that kills very small living things.
examples:
- Alcohol has a disinfectant effect that helps keep a cut clean.
- The soap has a strong disinfectant power, so germs cannot grow on the skin.
