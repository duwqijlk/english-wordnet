senseId: 'parenchyma%1:20:02::'
synsetId: 13117076-n
simpleMeaning: The main tissue of higher plants, made of thin-walled cells that can still divide when
  mature, and forming most of leaves, roots, fruit pulp and stem pith.
scope: 'This is the plant-tissue sense: the main tissue of higher plants, not the animal-organ sense naming
  an organ''s essential working tissue.'
examples:
- Most of the tissue inside a leaf is parenchyma.
- The pith at the centre of the stem is mainly parenchyma.
