simpleMeaning: a small fish like a herring that eats tiny plants and animals, often put in tins whole
  or as a paste, and found in large numbers in tropical seas worldwide
scope: This is the living fish itself, found in large numbers in tropical seas; not the tinned or salted
  fish used as a small first dish or to add taste to sauces.
examples:
- A school of anchovies swam near the surface of the warm sea.
- Anchovies feed on tiny plants and animals floating in the water.
