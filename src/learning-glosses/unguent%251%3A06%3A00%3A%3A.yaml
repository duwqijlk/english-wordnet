simpleMeaning: A soft mix, half solid and half liquid, usually with a medicine in it, put on the skin
  to heal a sore spot or calm it.
scope: Also called an unction, an ointment, a salve, or a balm; a soft mix put on the skin to heal or
  soothe.
examples:
- He spread the unguent over the burn to soothe it.
- The unguent eased the sore skin on her hands.
