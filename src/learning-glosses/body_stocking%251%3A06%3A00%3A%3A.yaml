simpleMeaning: Women wear this close-fitting one-piece garment under their clothes, covering the chest
  and belly, and sometimes the arms and legs too.
scope: This close-fitting one-piece garment, worn under clothes by women, covers the torso and may have
  sleeves and legs.
examples:
- They pulled on a body stocking before dressing.
- The body stocking had long sleeves and legs.
