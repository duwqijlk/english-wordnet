simpleMeaning: The part of the United States government that runs all country-wide plans for schools and
  learning, with help in money for schools and learners; set up in 1979.
scope: The schools department, also called the Department of Education or the Education Department; not
  learning itself, and not any other department.
examples:
- Education runs federal school programs.
- The Education Department was created in 1979.
