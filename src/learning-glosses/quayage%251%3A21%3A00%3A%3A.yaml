simpleMeaning: Money paid for the use of a place where ships load and unload
scope: A fee for using a wharf, not a tax on goods and not the cost of a ship.
examples:
- The ship's owner paid the quayage at the port.
- Quayage was charged for every day the ship stayed at the wharf.
