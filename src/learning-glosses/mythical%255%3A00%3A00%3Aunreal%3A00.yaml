simpleMeaning: told of in old tales, or based on them, with no real facts or true past behind it
scope: 'Also called fabulous: told of in old tales with no real facts behind it, not a thing that is merely
  made up on the spot.'
examples:
- Mythical centaurs appear in the old tales but never lived.
- The fabulous unicorn of the mythical stories has no place in real life.
