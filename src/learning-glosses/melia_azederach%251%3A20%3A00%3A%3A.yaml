simpleMeaning: A tree of northern India and China with purple blossoms and small yellow fruits that cannot
  be eaten, now settled in the southern United States where it gives shade.
scope: This is a tree of northern India and China with purple blossoms and small yellow fruits that cannot
  be eaten, now settled in the southern United States where it gives shade; chinaberry, azedarach, azederach,
  chinaberry tree, China tree, Melia azedarach, Persian lilac and pride-of-India are other names for this
  sense, not a tree with edible fruit.
examples:
- The Melia azederach in the yard gave deep shade in summer.
- We planted a Melia azederach for its purple blossoms.
