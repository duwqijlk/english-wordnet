simpleMeaning: a heated argument in which people exchange angry words.
scope: This is not a physical brawl or a battle; it is a fierce argument carried on in words.
examples:
- The couple had a bitter fight over money last night.
- They got into a shouting fight over the phone about the unpaid rent.
