simpleMeaning: to make someone feel strong disgust and a strong wish to turn away
scope: 'Also called shock, offend, outrage, appall, and scandalize: to make someone feel strong disgust,
  not just to surprise them or upset them a little.'
examples:
- The priest's bad actions scandalised many people in the town.
- The news report scandalised readers who could not believe such cruelty.
