simpleMeaning: A fairly firm, somewhat dry meat that comes from an animal's organs rather than its usual
  muscle cuts, most often from a cow or a calf.
scope: This is not the organ as part of a body, the central part of an idea or a playing card; it is meat
  from such an organ, eaten as food.
examples:
- The butcher suggested braising the heart slowly, because it is a firm, dry meat.
- She grew up on a farm where beef heart was a cheap and filling Sunday dinner.
