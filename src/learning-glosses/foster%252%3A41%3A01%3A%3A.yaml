simpleMeaning: to bring up a child in your home when you are not the child's parent by birth or by law
scope: This is the action of bringing up such a child; it is not the word used to describe the parent,
  child or home in that kind of care.
examples:
- They decided to foster a young child who needed a home.
- She has fostered three children over the years.
