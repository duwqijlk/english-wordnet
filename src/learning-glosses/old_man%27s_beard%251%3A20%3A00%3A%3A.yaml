simpleMeaning: Dense hanging bunches of grey-green, wavy, hairlike threads clinging to tree trunks and
  branches by thin wiry roots, from the southeastern United States through the West Indies to South America.
scope: This is the grey-green plant that drapes tree limbs in hanging tufts, not the two climbing vines
  of the same name with fragrant green-white or creamy-white flower clusters.
examples:
- Old man's beard hung in grey-green strands from the branches above the path.
- The trees along the river were covered in old man's beard.
