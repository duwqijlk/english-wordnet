simpleMeaning: to go and live on land given by the government and make it your home
scope: This is the act of going to live on government land and making a home there; it is not the house
  or the land itself.
examples:
- They homesteaded in Kansas on land the government gave them.
- Many families homesteaded on free government land in the 1800s.
