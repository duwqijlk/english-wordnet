simpleMeaning: a link between things in which they happen at times that have nothing to do with each other
scope: This is when things happen at times that have nothing to do with each other; asynchronism, asynchrony,
  desynchronization and desynchronizing are other names for this sense, not things that happen at the
  same time and not things that happen one after another in a set order.
examples:
- The desynchronisation of the two clocks meant one showed noon while the other showed three.
- The doctors saw a desynchronisation in the patient's brain waves after the stimulus.
