simpleMeaning: The hole in a piece of clothing where the wearer's head comes through, and the edge of
  the clothing round it.
scope: The hole in a piece of clothing where the wearer's head comes through, and the edge of the clothing
  round it, also called neck; not a sleeve hole and not a pocket.
examples:
- The neck opening of the shirt was too tight.
- She widened the neck opening of the dress.
