simpleMeaning: A large west African tree with large hand-lobed leaves and bunches of small white flowers
  from the leaf joints, and one-winged seeds; it gives soft white to pale yellow wood.
scope: A large west African tree with large hand-lobed leaves and bunches of small white flowers, also
  called samba, arere, obeche, obechi and Triplochiton scleroxylon, giving soft white to pale yellow wood.
examples:
- Triplochiton scleroxcylon grows in west Africa with large hand-lobed leaves.
- The wood of Triplochiton scleroxcylon is soft and white to pale yellow.
