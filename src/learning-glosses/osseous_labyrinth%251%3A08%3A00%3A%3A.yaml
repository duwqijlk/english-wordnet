simpleMeaning: A hollow place in the hard part of the temple bone that holds the soft inner maze of the
  ear
scope: 'Also called bony labyrinth: a hollow place in the temple bone that holds the soft inner maze of
  the ear, not the outer ear and not the tube that leads into the ear.'
examples:
- The osseous labyrinth holds the soft inner parts of the ear.
- A blow to the head can harm the osseous labyrinth.
