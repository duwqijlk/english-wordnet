simpleMeaning: a shaking of the body that usually comes from weakness, strain, or sickness
scope: A shaking of the body that usually comes from weakness, strain, or sickness; not a shake you cannot
  stop that comes as if from illness or fear, and not the shaking of the ground.
examples:
- A tremor in his hands made it hard for him to write.
- The old man's tremor grew worse when he was tired.
