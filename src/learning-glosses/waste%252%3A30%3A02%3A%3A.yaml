simpleMeaning: to grow weak and thin from grief or deep sorrow
scope: This is a person growing thin and weak from grief, not making someone else thin and weak, nor plain
  physical weakening without that cause.
examples:
- After the funeral, he began to waste away before our eyes.
- She wasted away during the long months of mourning.
