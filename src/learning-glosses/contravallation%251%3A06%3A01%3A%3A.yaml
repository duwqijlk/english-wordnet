simpleMeaning: a wall or bank built round a place under attack by the attackers, to stop those inside
  from striking out
scope: A wall built round a besieged place by the attackers; not a wall that guards a town and not a ditch
  dug by the defenders.
examples:
- The army raised a contravallation around the town.
- Behind the contravallation, the besiegers waited out the siege.
