simpleMeaning: to join two pieces of wood or metal together by using the kind of cut joint that locks
  their ends together
scope: This is joining wood or metal with a cut joint, not the joint itself as a thing and not wrapping
  cloth round someone.
examples:
- The carpenter scarfed the two beams together.
- He scarfed the metal bars end to end to make one long bar.
