simpleMeaning: A company in the United States that works through a country-wide council that sets up local
  councils, to build good character and give citizenship training.
scope: It covers one country-wide organisation made up of many local councils across the United States,
  set up by a national council to build character and train citizens.
examples:
- The Boy Scouts of America met at the town hall on Tuesday.
- The Boy Scouts of America runs local councils across the United States to build character and train
  citizens.
