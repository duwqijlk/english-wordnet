simpleMeaning: A tear gas stronger than CN gas but fading faster; it can be released from grenades or
  cluster bombs and can burn skin or fatally fill the lungs with fluid.
scope: This is a tear gas stronger than CN gas that clears from the air sooner; it is not ordinary smoke,
  and its danger is burns and lung injury rather than simple irritation.
examples:
- The inspectors found traces of chlorobenzylidenemalononitrile in the abandoned canister.
- Chlorobenzylidenemalononitrile can cause severe burns and lung damage, so handlers wear protective gear.
