simpleMeaning: Much like the flower of the same name in Europe, this long-lived plant grows in New Zealand.
scope: It is the New Zealand plant that looks much like the flower of the same name in Europe, not that
  European flower itself.
examples:
- In New Zealand, the north island edelweiss looks much like the flower of the same name in Europe.
- The north island edelweiss is a long-lived plant, not one that dies after a single year.
