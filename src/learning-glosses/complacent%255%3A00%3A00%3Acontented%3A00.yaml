simpleMeaning: so happy with yourself and what you have done that you stop seeing what is wrong
scope: So happy with yourself and what you have done that you stop seeing what is wrong; not plainly happy
  and not rightly proud.
examples:
- After years of wins, the team grew complacent and stopped training hard.
- He was complacent about his work and missed the mistakes in it.
