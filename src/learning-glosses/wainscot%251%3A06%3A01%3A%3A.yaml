simpleMeaning: a panel that forms the lower part of a wall inside a room and is finished in a different
  way from the upper part
scope: The panel itself on the lower part of a wall inside a room, not the wooden panels in general that
  can be used to line the walls of a room.
examples:
- A dark wood wainscot ran along the lower wall of the hall.
- They painted the wainscot white and the upper wall blue.
