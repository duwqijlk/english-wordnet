simpleMeaning: That shakes you with sudden jerks, or is marked by sudden jerks and uneven movement.
scope: That shakes with sudden jerks and uneven movement; rough, rocky, bumpy, jumpy and jolting are other
  names for it, not smooth and steady movement.
examples:
- The jolty road shook the cart at every turn.
- A jolty ride left us tired and sore.
