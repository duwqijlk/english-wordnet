simpleMeaning: The state of things once who a person is, or what a thing is, has been made known.
scope: The state of things once who a person is, or what a thing is, has been made known, not the act
  of naming it, and not the paper that proves it.
examples:
- The identification of the victim was followed at once by an arrest.
- Once identification of the body was complete, the family was told.
