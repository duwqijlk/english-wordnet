simpleMeaning: a street lined with buildings that were first private stables (places for keeping horses)
  and are now homes
scope: A street where buildings that were first private stables are now homes. It is not one stable on
  its own, and it is not a street that was always made of homes.
examples:
- She lives in a quiet mews behind the big houses.
- The old mews now has small homes where horses were once kept.
