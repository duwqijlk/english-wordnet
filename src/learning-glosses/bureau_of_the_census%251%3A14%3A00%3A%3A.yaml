simpleMeaning: A Commerce Department office that counts all people in America and gives facts and studies
  about its people.
scope: Also called the Census Bureau; a Commerce Department office for the United States census, giving
  facts and studies about its people, not a state office that counts only one state.
examples:
- The Bureau of the Census counted every home in the town.
- Bureau of the Census workers knocked on our door.
