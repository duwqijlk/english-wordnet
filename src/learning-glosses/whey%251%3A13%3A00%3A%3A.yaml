senseId: 'whey%1:13:00::'
synsetId: 07865709-n
simpleMeaning: The thin watery part of milk, left when untreated milk sours and sets into curds.
scope: The watery part of milk left when milk sours and sets into curds, not the watery part drawn off
  the curd when cheese is made.
examples:
- The whey drained off as the milk soured and set into curds.
- She poured the whey away after the milk had turned.
