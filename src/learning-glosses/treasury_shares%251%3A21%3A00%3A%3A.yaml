simpleMeaning: With no vote and no payouts, stock a firm has bought back counts as given out but not held,
  though the firm may scrap it or sell it again.
scope: Also called reacquired stock and treasury stock, it is stock a firm has bought back that it may
  scrap or sell again, given out but not held, with no vote and no payouts.
examples:
- The firm kept its treasury shares aside for a later sale.
- The firm bought back the treasury shares to cancel them.
