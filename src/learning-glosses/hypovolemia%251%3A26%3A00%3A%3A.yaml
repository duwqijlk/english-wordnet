simpleMeaning: A blood disorder in which the amount of blood moving around the body goes down.
scope: A sickness where the blood moving around the body is too low in amount, also called hypovolaemia;
  not too much blood moving around the body and not a lack of blood in one part of the body.
examples:
- The doctor said hypovolemia was the cause of her low blood pressure.
- After losing a lot of blood, he was treated for hypovolemia.
