simpleMeaning: to shut the eyes part way, as when bright light hits them
scope: To shut the eyes part way against bright light, not a look sent to one side in doubt and not eyes
  that point in different ways.
examples:
- The driver squinted as the sun hit his eyes.
- She squinted at the bright sky.
