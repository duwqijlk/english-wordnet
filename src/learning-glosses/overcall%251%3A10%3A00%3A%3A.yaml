simpleMeaning: In bridge, a call higher than the other side's call, above all when your partner has not
  called at all and your call tops what your hand is worth
scope: 'Also called overbid: in bridge, a call higher than the other side''s call, not a low call and
  not a pass.'
examples:
- An overcall in bridge tops the other side's call.
- He risked an overcall with a poor hand.
