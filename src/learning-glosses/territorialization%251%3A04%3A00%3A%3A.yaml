simpleMeaning: the act of turning a place into a land that has its own rules and borders
scope: The act of turning a place into a land with its own rules, also called territorialisation; not
  the act of joining two lands together.
examples:
- Territorialization changed the region into a land with its own laws.
- The territorialization of the islands took a decade.
