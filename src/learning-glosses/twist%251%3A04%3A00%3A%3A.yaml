simpleMeaning: A lively partner dance, popular in the 1960s, performed by swinging the hips and arms in
  time to the music.
scope: This is the 1960s dance itself, not the act of turning something, a swirling current of water or
  air, or a bend in a line.
examples:
- At the school dance, the band played a song for the twist.
- She learned the twist from an old film about the 1960s.
