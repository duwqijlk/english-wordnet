simpleMeaning: a joint between the far end of the radius, a lower-arm bone, and the nearest row of small
  hand bones
scope: This joint, also called wrist, wrist joint, radiocarpal joint and articulatio radiocarpea; not
  the elbow and not the hand itself.
examples:
- The carpus bends when you wave your hand.
- She felt pain in her carpus after the fall.
