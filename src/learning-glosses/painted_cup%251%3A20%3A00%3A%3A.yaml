simpleMeaning: Brightly coloured leaf-like parts crown dense spikes of hooded flowers on any of several
  kinds of plant in the group Castilleja.
scope: Any of several kinds of plant with dense spikes of hooded flowers and brightly coloured leaf-like
  parts.
examples:
- The painted cup has dense spikes of hooded flowers.
- We saw a painted cup with brightly coloured parts round its flowers.
