simpleMeaning: A wheeled vehicle made to run on the steel lines of a track
scope: 'Also called a car, a railcar, and a railroad car: a single wheeled vehicle that runs on steel
  lines, not a whole set of joined vehicles and not the firm that runs them.'
examples:
- Three railway cars had jumped off the steel lines after the storm.
- The last railway car carried the mail bags.
