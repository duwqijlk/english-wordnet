simpleMeaning: A common European one-year weed with white flowers and finely cut leaves, settled and sometimes
  grown in eastern North America, sometimes put in genus Matricaria.
scope: This sense is also called corn mayweed, scentless false camomile, scentless hayweed, and scentless
  mayweed, for a common European one-year weed with white flowers and finely cut leaves.
examples:
- Scentless camomile grows white flowers.
- Scentless camomile weeds eastern North America.
