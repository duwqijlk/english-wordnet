simpleMeaning: Too weak to carry real weight or importance.
scope: This describes an argument, claim or evidence with little behind it, not a narrow object or a body
  with little fat; slight is another name for the same sense.
examples:
- The evidence against him was thin.
- The film's plot was thin and predictable.
