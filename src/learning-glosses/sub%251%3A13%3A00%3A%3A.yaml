simpleMeaning: a big sandwich of meat and cheese on a long crisp roll cut open along its length, with
  tomato, onion, lettuce and sauce; its name changes across the United States
scope: A long sandwich, also called a hero, a wedge, a bomber, or a submarine; not the warship that goes
  under water.
examples:
- He ordered a sub with meat and cheese.
- They shared a foot-long sub at lunch.
