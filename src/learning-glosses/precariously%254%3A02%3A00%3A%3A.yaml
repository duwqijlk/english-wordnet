simpleMeaning: in a way that could easily fail or fall apart
scope: Done in an unsafe way that could easily fail; not done in a careless way, and not done in a bold
  way.
examples:
- The cup sat precariously on the edge of the table.
- The new firm stood precariously after a year of losses.
