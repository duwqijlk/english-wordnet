simpleMeaning: To treat, work on, heat, melt, or clean a thing in a furnace that throws its heat back
  down on the thing.
scope: This is heating or melting a thing in a furnace, not sound or heat bouncing back.
examples:
- The workers reverberate the ore in the great furnace.
- They reverberated the metal until it ran clean.
