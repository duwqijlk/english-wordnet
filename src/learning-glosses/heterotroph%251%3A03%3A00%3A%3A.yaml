simpleMeaning: A living thing that must feed on rich stuff made by other living things to stay alive.
scope: A living thing that must feed on stuff made by other living things; not a living thing that makes
  its own food from light, and not one that feeds on plain rock or water.
examples:
- Animals are heterotrophs because they feed on other living things.
- A heterotroph cannot make its own food and must eat plants or animals.
