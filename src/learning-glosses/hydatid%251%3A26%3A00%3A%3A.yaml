simpleMeaning: A sac filled with liquid that forms when young tapeworms settle in the body, as in the
  illness echinococcosis
scope: This is a sac filled with liquid that forms when young tapeworms settle in the body, not a sac
  filled with air and not a swelling caused by a blow.
examples:
- The hydatid was found in the patient's liver.
- Doctors removed a hydatid filled with liquid.
