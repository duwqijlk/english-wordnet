simpleMeaning: In the greedy way a pig eats, to eat far more than you need, with no shame and no stop
scope: To eat far more than you need, also called stuff, gorge, binge, engorge, glut, overeat, satiate,
  overindulge, englut, gormandise, gormandize, gourmandize, ingurgitate and pig out; not a normal meal
  and not a small snack.
examples:
- He overgorged on cake at the party and felt sick.
- Do not overgorge at dinner, or you will feel ill all night.
