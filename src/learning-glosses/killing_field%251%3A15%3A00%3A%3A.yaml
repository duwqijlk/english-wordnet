simpleMeaning: An area, usually in the plural, where many people have died, usually murdered in large
  numbers or wiped out as a group during war or violent unrest
scope: This is an area, usually spoken of in the plural, where many people have died, usually murdered
  in large numbers or wiped out as a group during war or violent unrest, not a place where armies fight
  and not a burial ground.
examples:
- The killing fields of Cambodia are a place of mourning.
- Reporters visited the killing field after the war.
