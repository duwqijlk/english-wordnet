simpleMeaning: a person who hurts another person's body very badly, usually as a punishment or to force
  the person to do something
scope: This names the person who causes very bad pain, not the act of causing it and not the person who
  suffers it.
examples:
- The torturer hurt the prisoner to make him talk.
- The guards feared the torturer who worked in the prison.
