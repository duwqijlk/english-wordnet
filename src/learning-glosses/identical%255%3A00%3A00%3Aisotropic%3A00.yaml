senseId: identical%5:00:00:isotropic:00
synsetId: 01363878-s
simpleMeaning: having qualities that have the same value in every direction, along every axis (a straight
  line used for measuring)
scope: This describes a thing whose qualities are the same in every direction; not two things that look
  exactly alike, and not twins that came from one egg.
examples:
- The material is identical in strength in every direction, so it does not break more easily one way than
  another.
- Scientists found the substance identical along every axis, with the same strength whichever way they
  measured it.
