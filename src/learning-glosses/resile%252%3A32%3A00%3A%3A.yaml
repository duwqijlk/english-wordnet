simpleMeaning: to take back in a formal way a belief one used to hold, often when pushed to do so
scope: 'Also called retract, recant, forswear and abjure: to take back a belief one used to hold, not
  to change one''s mind in private and not to deny a fact one never believed.'
examples:
- Under pressure, he resiled from his earlier statements about his faith.
- She resiled from the beliefs she had held for years.
