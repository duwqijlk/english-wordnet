simpleMeaning: Hanging back down from branches high up, one of many kinds of slow-moving mammal of South
  and middle America eats leaves and fruit.
scope: Sloth is another name for this mammal, one of many slow-moving kinds of South and middle America
  that hang back down from branches to eat leaves and fruit.
examples:
- A tree sloth hung back down from the limb, munching leaves.
- The tree sloth ate fruit as it hung back down from a branch.
