senseId: 'hearing%1:10:00::'
synsetId: 07161975-n
simpleMeaning: A meeting where a committee or grand jury calls witnesses and takes their statements.
scope: This is a session where a committee or grand jury gathers testimony, not a court proceeding that
  decides a case and not a chance to speak for yourself.
examples:
- The Senate committee will hold a hearing on the new tax rules next week.
- The grand jury ended its hearing after questioning three witnesses.
