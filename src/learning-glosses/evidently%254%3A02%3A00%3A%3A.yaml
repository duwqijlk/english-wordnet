senseId: 'evidently%4:02:00::'
synsetId: 00039730-r
simpleMeaning: in a way that is clear to see and leaves no doubt; 'plain' is often used in everyday talk
  for 'plainly'
scope: Also called obviously, apparently, plain, and plainly. This means clearly and with no doubt, not
  as a guess or a weak idea.
examples:
- She was evidently in great pain, as anyone could see from her face.
- He evidently knew the answer, since he replied at once and with no doubt in his voice.
