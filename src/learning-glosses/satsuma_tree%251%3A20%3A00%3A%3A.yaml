simpleMeaning: The orange fruit from China known as mandarin has this kind, which most people call cold
  hardy mandarin, Christmas orange, or tangerine.
scope: Also called satsuma, it is one kind of mandarin orange, not a fruit from some other kind.
examples:
- The satsuma tree bore mandarin oranges.
- They ate fruit from the satsuma tree.
