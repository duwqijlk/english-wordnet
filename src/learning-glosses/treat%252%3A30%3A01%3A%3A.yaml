simpleMeaning: to put something through a process so it is made ready for a purpose, improved, or put
  right.
scope: This is not giving medical care to a sick person or animal, and not a pleasant surprise; it applies
  to things, which are put through a process to prepare, improve or fix them.
examples:
- The water is treated with chlorine before it reaches our taps.
- Farmers here treat the soil with lime to improve it.
