simpleMeaning: to make someone feel scared and worried, and give them a bad surprise
scope: This means to scare and worry someone and give them a bad surprise, also called alarm, dismay and
  appall; it is not just to make someone sad or angry.
examples:
- The bad news horrified everyone in the room.
- She was horrified at the thought of the crash.
