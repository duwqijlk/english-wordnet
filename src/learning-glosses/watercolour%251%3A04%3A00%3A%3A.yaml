simpleMeaning: the art or way of painting with paints that are mixed with water
scope: 'Also called watercolor: this is the art and way of painting with paints mixed with water, not
  the paint itself and not a finished painting.'
examples:
- She studied watercolour at art school for three years.
- He teaches watercolour to beginners at the local art class.
