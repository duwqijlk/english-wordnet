simpleMeaning: A moth active at night that is usually medium-sized and dull-colored; its larvae, or young,
  typically have smooth bodies and are destructive pests on farms.
scope: This is the adult insect, not the caterpillars it comes from; owlet moth is another name for this
  same moth.
examples:
- A noctuid flew into the porch light after dark.
- The noctuid's smooth-bodied larvae are destroying the vegetable crop.
