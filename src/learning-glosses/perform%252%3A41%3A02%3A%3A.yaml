simpleMeaning: To carry out the job it is meant to do, as a machine, device, or organ.
scope: This is about a thing working or functioning as intended, not about carrying out a task and not
  about acting on a stage.
examples:
- The new engine performs well even in cold weather.
- Her kidneys are no longer performing properly.
