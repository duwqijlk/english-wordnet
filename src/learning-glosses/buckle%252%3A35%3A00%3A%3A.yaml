simpleMeaning: to fasten or hold a thing in place by using the small piece that joins two ends together
scope: 'Also called clasp: to fasten or hold a thing in place with a buckle; not the buckle itself, and
  not a bent shape in something.'
examples:
- He buckled his belt before leaving the house.
- She buckled the strap on her bag and picked it up.
