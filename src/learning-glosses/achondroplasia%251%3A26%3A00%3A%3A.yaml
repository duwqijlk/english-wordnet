senseId: 'achondroplasia%1:26:00::'
synsetId: 14145286-n
simpleMeaning: a bone illness passed from parents that starts before birth, where soft tissue between
  bones (cartilage) turns to bone, so the body stays very short
scope: Also called achondroplasty, chondrodystrophy, and osteosclerosis congenita, this is the illness
  that starts before birth and keeps the body very short.
examples:
- The baby was born with achondroplasia, so his arms and legs stayed short.
- Doctors told the parents that achondroplasia is passed down in families.
