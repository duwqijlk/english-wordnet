simpleMeaning: A park run to make money, with stalls and shows for fun
scope: Also called a funfair or an amusement park, this is a park run to make money with stalls and shows
  for fun, not a public park for quiet walks and not a zoo.
examples:
- The children spent the day at the pleasure ground, riding the shows and buying sweets at the stalls.
- A new pleasure ground opened on the edge of town, with stalls and shows for fun.
