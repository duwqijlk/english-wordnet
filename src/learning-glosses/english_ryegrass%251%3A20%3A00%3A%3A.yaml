simpleMeaning: A grass of Europe that lives many years, grown in many places for fields where animals
  feed, for hay, and for lawns.
scope: A European grass that lives many years, also called perennial ryegrass and Lolium perenne; it is
  grown for pasture and hay and as a lawn grass.
examples:
- English ryegrass covers the field where the sheep graze.
- The farmer sowed English ryegrass for hay and for the lawn.
