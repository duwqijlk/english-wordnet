simpleMeaning: Cloth made of cotton or linen, with a soft raised surface on one side, used to cover wounds
scope: This is a cloth used to cover wounds; it is not the small loose bits of fibre that come off cloth.
examples:
- The nurse put soft lint over the cut on his arm.
- She bought a roll of lint to cover the wound.
