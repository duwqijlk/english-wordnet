simpleMeaning: The state of doing something without real feeling, full strength, hard work, firm promise,
  or fixed will.
scope: This is doing something without real feeling or full strength, not honest doubt or tiredness.
examples:
- His halfheartedness showed in the weak applause.
- Her halfheartedness about the plan was clear to all.
