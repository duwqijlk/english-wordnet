synsetId: 01184392-n
simpleMeaning: a court case that one side brings against another to answer for a wrong done, to guard
  a right, or to stop a wrong
scope: A court case brought by one side against another, also called action and legal action; not a criminal
  trial and not a private talk to settle a dispute.
examples:
- She brought an action at law against the builder for the damage to her house.
- The action at law was filed to protect his rights to the land.
