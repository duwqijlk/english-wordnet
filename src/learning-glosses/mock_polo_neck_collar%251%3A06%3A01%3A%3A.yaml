senseId: 'mock_polo_neck_collar%1:06:01::'
synsetId: 92448838-n
simpleMeaning: A collar that copies the polo neck's stand-up shape and soft top fold, but has both ends
  of its tube sewn to the neckline.
scope: A collar sewn to the neckline at both ends of its tube, unlike the polo neck style it copies; mock
  turtleneck collar is another name for the same thing.
examples:
- The shirt has a mock polo neck collar sewn down at both ends.
- She chose a mock polo neck collar because it stands up around the neck.
