simpleMeaning: The state of mind in which one thing fills your thoughts
scope: The state of mind in which one thing fills your thoughts, also called preoccupation; not fear about
  what may happen, and not pleasant thoughts that wander.
examples:
- His preoccupancy with the case kept him awake.
- Her preoccupancy showed in her silence.
