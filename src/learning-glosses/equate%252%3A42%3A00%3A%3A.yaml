simpleMeaning: In mathematics, to have the same value as something else, or to match it part by part
scope: 'Also called correspond: in mathematics, having the same value or matching part by part, not thinking
  of one thing as like another and not making things the same.'
examples:
- When x is 2, the two sides of the equation equate.
- In this table, each value in the first row equates to one value in the second row.
