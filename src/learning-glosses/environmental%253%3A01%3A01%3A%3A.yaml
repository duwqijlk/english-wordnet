simpleMeaning: It describes something that relates to the outside conditions and surroundings in which
  a person or thing exists.
scope: This is about surroundings and conditions in general, not about harm to nature.
examples:
- The study looked at environmental factors such as noise and light.
- Poor environmental conditions made the illness spread faster.
