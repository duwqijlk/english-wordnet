simpleMeaning: that can be pulled out easily and then goes back to its first size or shape
scope: For cloth or other material that can be pulled and then goes back, not for something hard that
  cannot be pulled or that stays pulled out.
examples:
- This stretchy shirt fits well because the cloth pulls and then goes back.
- She wore stretchy pants that were easy to move in.
