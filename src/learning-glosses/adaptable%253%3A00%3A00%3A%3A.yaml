simpleMeaning: able to become fit, or be made fit, for a particular use or a particular situation
scope: This means able to become fit, or be made fit, for a particular use or a particular situation;
  not fixed for one use only and not just easy to bend in shape.
examples:
- A good nurse must be adaptable when the day changes suddenly.
- The frame is adaptable to cloth of different widths.
