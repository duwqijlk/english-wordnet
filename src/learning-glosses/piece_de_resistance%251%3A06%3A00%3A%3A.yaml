senseId: 'piece_de_resistance%1:06:00::'
synsetId: 03073571-n
simpleMeaning: In a set of things, this is the one people most want to see, the main thing on show
scope: Also called a showpiece or a collector's item, this is the best thing in a set, not just any one
  thing in it and not the whole set.
examples:
- The painting was the piece de resistance of the whole show.
- Her roast was the piece de resistance of the meal.
