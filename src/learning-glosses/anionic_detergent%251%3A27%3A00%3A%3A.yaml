simpleMeaning: A class of man-made detergents whose molecules do not ionize in water solutions.
scope: Also called anionic and non-ionic detergent; its molecules do not split into charged parts in water
  solutions.
examples:
- The clothes were washed with an anionic detergent.
- The anionic detergent went into the wash water.
