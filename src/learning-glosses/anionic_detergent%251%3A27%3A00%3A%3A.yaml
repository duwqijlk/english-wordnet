simpleMeaning: When used in water, this man-made washing stuff keeps its tiny bits whole; they never split
  into charged parts.
scope: Also called anionic and non-ionic detergent, this is one of the man-made washing stuffs that work
  in water without splitting into charged parts.
examples:
- The clothes were washed with an anionic detergent.
- The anionic detergent went into the wash water.
