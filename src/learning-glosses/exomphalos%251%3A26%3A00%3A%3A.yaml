simpleMeaning: a birth condition in which some organs from the belly push out into the cord joining a
  baby to its mother
scope: This is a birth condition where belly organs push into the cord; not a hernia that appears later
  in life and not a normal cord.
examples:
- The baby was born with exomphalos.
- Doctors treated the exomphalos soon after birth.
