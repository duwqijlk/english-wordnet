senseId: 'lugsail%1:06:00::'
synsetId: 03701902-n
simpleMeaning: A four-cornered sail raised on a pole that stands at a slant to the mast.
scope: This is a four-cornered sail raised on a pole that stands at a slant to the mast, not a three-cornered
  sail and not a sail on a pole straight across the mast; lug is another name for this sense.
examples:
- The crew raised the lugsail as the wind freshened.
- A lugsail hung from the slanted yard.
