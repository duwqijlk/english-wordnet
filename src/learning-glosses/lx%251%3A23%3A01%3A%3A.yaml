simpleMeaning: A unit for measuring light, the same as one lumen for each square metre, or 0.0929 foot
  candle.
scope: A unit for measuring light, the same as one lumen for each square metre; lux is another name for
  this sense, not a unit of power.
examples:
- The meter read 300 lx in the room.
- Outdoors the light measured 20,000 lx.
