simpleMeaning: not likely to lead to good results or to give people pleasure
scope: It describes a thing, start or plan that does not look likely to go well or give pleasure, not
  a promise that was broken.
examples:
- The new shop had an unpromising start, with very few customers in its first week.
- She faced an unpromising task, with little hope that it would end well.
