simpleMeaning: an act that breaks trust by going against what you believe in, your country, a cause you
  support, or something like these
scope: This is the act of going against your beliefs, your country or a cause, not an event where every
  ticket has been sold and not just selling all of a product.
examples:
- Giving the secret plans to the other side for money was seen as a sellout.
- Many fans called the leader's deal with the company a sellout of the cause they had fought for.
