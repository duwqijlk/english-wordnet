simpleMeaning: a thin plant with fringed white flowers that grows in the east of North America
scope: A thin plant with fringed white flowers from the east of North America; not a white flower of another
  kind and not a plant with coloured flowers.
examples:
- The snowy orchid bloomed in the damp woods of Maine.
- We found a snowy orchid with white flowers near the trail.
