simpleMeaning: Bright flowers shaped like bells grow on this plant, one of a group whose flowers look
  much like the flowers of gloxinias.
scope: This is a plant with bright bell-shaped flowers, also called hot water plant, not the gloxinia
  whose flowers it looks like.
examples:
- The achimenes opened its bright bell-shaped flowers.
- Achimenes bears flowers much like the flowers of gloxinias.
