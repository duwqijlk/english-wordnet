senseId: 'disregarding%4:02:00::'
synsetId: 00119427-r
simpleMeaning: no matter what happens, with no thought for the bad points that come with it
scope: This sense, also called regardless and also called irrespective, means going on in spite of everything,
  not giving up because of problems.
examples:
- He carried on, disregarding, and finished his work on time.
- Disregarding, she went ahead and opened the shop she had planned.
