simpleMeaning: In medicine, the forming of sick matter in an abscess or a blister, and the letting out
  of pus.
scope: In medicine, the forming of sick matter in an abscess or a blister, and the letting out of pus;
  also called festering or suppuration; not, in life science, the unfolding of a living thing as it grows
  from simple to more complex, nor the coming to full growth, the becoming mature.
examples:
- Their maturation showed at dawn.
- The maturation was plain in the scan.
