simpleMeaning: going round in the direction opposite to the way the hands of a clock move
scope: About turning or moving the way clock hands do not go; the opposite of clockwise.
examples:
- Turn the lid counterclockwise to open the jar.
- The dancers moved counterclockwise around the room.
