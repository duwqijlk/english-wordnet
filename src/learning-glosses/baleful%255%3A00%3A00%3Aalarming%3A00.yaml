senseId: baleful%5:00:00:alarming:00
synsetId: 00195958-s
simpleMeaning: that seems to warn of harm or sad things to come, and makes people feel afraid
scope: 'Also called threatening, ominous, menacing, sinister, and forbidding: this describes a look, sound,
  or thing that warns of bad things to come, not an act that itself does harm.'
examples:
- He gave her a baleful look before he spoke.
- Dark, baleful clouds gathered over the town before the storm.
