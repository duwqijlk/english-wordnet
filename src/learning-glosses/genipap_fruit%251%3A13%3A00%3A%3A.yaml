simpleMeaning: With a thick skin round it, this juicy fruit of warm lands is as big as an orange.
scope: Also called genipap, this names the juicy fruit of warm lands, as big as an orange, with a thick
  skin, not the tree that bears it.
examples:
- She peeled a genipap fruit and ate the juicy flesh.
- A genipap fruit as big as an orange sat on the table.
