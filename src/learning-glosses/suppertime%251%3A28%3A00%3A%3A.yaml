simpleMeaning: the usual time of day when people eat their evening meal
scope: 'Also called dinnertime: the usual time for the evening meal, not the meal itself and not the time
  of a midday meal.'
examples:
- At suppertime, the whole family sat down together.
- We must be home by suppertime.
