simpleMeaning: 'Any of a family of curves: the set of points a fixed distance from a given curve, measured
  along lines through one fixed point.'
scope: A whole family of curves built by a fixed-distance rule from another curve, not one particular
  named curve; the limaçon is only a special case.
examples:
- The conchoid of Nicomedes is the best-known member of this family of curves.
- As the chosen distance grows, the two branches of the conchoid move further apart.
