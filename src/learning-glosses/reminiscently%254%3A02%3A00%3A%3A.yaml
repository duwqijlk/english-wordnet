simpleMeaning: in a way that shows you are thinking about past days
scope: This word says how a person speaks or thinks, with past days in mind. It is not about the past
  itself, and not about learning a fact again.
examples:
- She spoke reminiscently of her days at school.
- He smiled reminiscently as he told us about his first job.
