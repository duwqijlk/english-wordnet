simpleMeaning: Flowering early, this long-lived plant of southern and southeastern Europe bears heads
  of flowers like those of a common yellow-flowered plant.
scope: Also called a goldilocks aster, this is the early-flowering plant of southern and southeastern
  Europe whose flower heads look like those of a common yellow-flowered plant.
examples:
- Goldilocks flowered early.
- The goldilocks had heads of yellow flowers.
