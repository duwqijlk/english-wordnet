simpleMeaning: Money a country earns from services and from property it owns, minus what it pays out for
  those things, over a set time
scope: The gap in services and property money over time, not the gap in goods traded and not the whole
  balance of payments.
examples:
- The country's invisible balance improved when more visitors spent money on services.
- A good invisible balance means a country earns more from services and property than it pays out.
