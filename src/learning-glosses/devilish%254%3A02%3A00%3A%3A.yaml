simpleMeaning: in a playful way that is bold and a little naughty
scope: Done in a playful, bold way, not in a wicked way and not in the manner of a devil in a story.
examples:
- He grinned devilishly when he saw the trick had worked.
- She looked at him devilishly, enjoying the joke.
