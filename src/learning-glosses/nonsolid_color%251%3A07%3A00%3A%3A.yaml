simpleMeaning: a shade made by a pattern of dots of different shades that together look like the shade
  wanted
scope: A shade made by a pattern of dots of different shades; also called dithered color, dithered colour
  and nonsolid colour, not a plain flat shade and not a shade from mixed paint.
examples:
- The printer made a nonsolid color from tiny dots of ink.
- A nonsolid color looks flat from far away but is made of dots.
