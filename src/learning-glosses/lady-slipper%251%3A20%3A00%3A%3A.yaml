simpleMeaning: One of several kinds from the Americas, this wildflower is hard or impossible for gardeners
  to grow, and its lower lip swells into a pouch.
scope: Also called ladies' slipper, lady's-slipper, lady's slipper, lady slipper, and slipper orchid,
  this is one of several wildflowers from the Americas, with a lower lip that swells into a pouch, and
  gardeners find it hard or impossible to grow.
examples:
- A lady-slipper grew wild at the edge of the woods.
- We tried to grow a lady-slipper in the garden, but it would not take.
