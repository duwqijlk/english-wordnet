senseId: 'conciliation%1:10:00::'
synsetId: 07165830-n
simpleMeaning: Ways of helping two sides in a dispute reach a settlement by talking it through, without
  going to a formal hearing.
scope: Ways of settling a dispute through mediation, without a formal hearing; not the act of winning
  over distrust, and not the state of goodwill after people are reconciled.
examples:
- Conciliation helped the workers and the owners agree on new terms.
- The two sides turned to conciliation before taking the dispute further.
