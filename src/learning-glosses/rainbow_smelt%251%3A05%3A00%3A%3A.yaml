simpleMeaning: An important fish from the sea and from lakes in eastern North America and Alaska, eaten
  by people
scope: This is a fish from the sea and from lakes in eastern North America and Alaska that people eat,
  not a fish from warm southern seas and not a fish no one eats.
examples:
- Rainbow smelt live in the cold lakes of Alaska.
- Fishermen catch rainbow smelt in eastern North America.
