simpleMeaning: A common bush or small tree of warm parts of the Americas, with purplish fruit.
scope: A common bush or small tree of warm America with purplish fruit; mombin and mombin tree are other
  names for it, not a tall forest tree and not a bush with red fruit.
examples:
- The jocote bore purplish fruit in the dry season.
- A jocote grew by the path to the village.
