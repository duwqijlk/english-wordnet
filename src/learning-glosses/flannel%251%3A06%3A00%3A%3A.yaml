simpleMeaning: a soft, light cloth made of wool, used to make clothes
scope: A soft wool cloth used for clothes, not the trousers of the same name and not a cloth for washing
  the face and body.
examples:
- She wore a flannel shirt on the cold morning.
- The tailor cut the flannel suit from a soft wool cloth.
