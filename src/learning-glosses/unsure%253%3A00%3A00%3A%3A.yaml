simpleMeaning: not sure, or showing in some way that a person is not sure
scope: 'Also called uncertain: a person is not sure, or their face or actions show they are not sure;
  this is the opposite of being fully sure.'
examples:
- She felt unsure about which road to take.
- He gave an unsure smile and looked down at the floor.
