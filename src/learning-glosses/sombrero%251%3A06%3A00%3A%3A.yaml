simpleMeaning: a hat made of straw with a tall top and a wide edge around it, worn in the American southwest
  and in Mexico
scope: This wide-edged straw hat worn in Mexico and the American southwest, not a soft cloth hat or any
  other kind of hat.
examples:
- He wore a sombrero to keep the sun off his face.
- The farmer's sombrero had a very wide brim.
