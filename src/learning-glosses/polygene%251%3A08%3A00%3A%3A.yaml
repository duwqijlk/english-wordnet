simpleMeaning: One of the small parts that carry the plan for life, which on its own does little but with
  others makes clear differences
scope: One of the small parts that carry the plan for life, which does little alone but makes clear differences
  with others; not a part that by itself makes a big difference.
examples:
- Height is shaped by many polygenes working together.
- One polygene alone has little effect on how a plant grows.
