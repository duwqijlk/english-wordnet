synsetId: 03925552-n
simpleMeaning: a heavy stone or iron tool, usually with a flat base and a handle, for crushing and mixing
  grain, medicines, colour powders and other things on a flat stone
scope: Also called pestle and muller, this is a heavy tool for crushing and mixing things, not a word
  for something that weighs a stated number of pounds.
examples:
- She used a pounder to crush the grain against the flat stone.
- The old pounder was made of iron and had a wooden handle.
