simpleMeaning: a small animal that digs in the ground, with large bags outside its cheeks; one of the
  Geomyidae, a family of digging animals, from Central America and southwest North America
scope: Also called pocket gopher and pouched rat. This is the animal with large cheek bags from Central
  America and southwest North America, not a land tortoise and not a very active person.
examples:
- The gopher carried seeds in the large pouches in its cheeks.
- A gopher pushed fresh soil up beside the hole where it lives under the ground.
