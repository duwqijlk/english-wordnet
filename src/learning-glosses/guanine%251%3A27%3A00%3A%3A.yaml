simpleMeaning: A purine base (a kind of chemical base) found in DNA and RNA, that joins with cytosine.
scope: A purine base (a kind of chemical base) found in DNA and RNA, that joins with cytosine, not adenine
  and not a sugar in DNA.
examples:
- Guanine pairs with cytosine in DNA and RNA.
- The DNA strand held guanine opposite cytosine.
