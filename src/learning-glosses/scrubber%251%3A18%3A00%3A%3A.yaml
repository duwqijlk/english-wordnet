simpleMeaning: A hand who uses a scrub brush to clean a face, usually a floor or deck.
scope: A hand who uses a scrub brush to clean a face, usually a floor or deck; not a brush with short
  stiff hairs for hard cleaning, nor a cleanser that takes dirt out of a gas.
examples:
- Their scrubber scrubbed at dawn.
- The scrubber was seen at noon.
