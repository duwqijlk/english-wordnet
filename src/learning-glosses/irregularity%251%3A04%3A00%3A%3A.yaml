simpleMeaning: behavior that breaks a rule or a custom, or goes against what people see as right or polite
scope: 'Also called abnormality: behavior that breaks a rule or what is seen as right. Not the sense about
  the bowels, not an uneven shape, and not things that do not happen at fixed times.'
examples:
- The report listed an irregularity in how the money was spent.
- Any irregularity in the voting was taken very seriously.
