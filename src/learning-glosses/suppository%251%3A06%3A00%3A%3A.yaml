simpleMeaning: A small plug of medicine made to be put into the back passage or the birth canal, where
  it melts.
scope: A small plug of medicine put into the back passage or the birth canal, where it melts; not a pill
  to swallow and not a cream rubbed on the skin.
examples:
- The nurse gave him a suppository to bring down the fever.
- A suppository melts inside the body after it is put in.
