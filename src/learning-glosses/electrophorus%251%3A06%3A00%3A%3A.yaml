simpleMeaning: a plain machine that makes power that stays in one place, giving the same charge again
  and again
scope: A plain machine that makes power that stays in one place, not a battery and not a machine that
  makes power flow.
examples:
- The electrophorus gave a small spark each time it was used.
- With an electrophorus, you can make the same charge again and again.
