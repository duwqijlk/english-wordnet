simpleMeaning: Two toothed jaws close round a tube and hold it tight, so you can turn the tube with this
  tool, which you set to fit the tube.
scope: This is an adjustable tool with two toothed jaws that grips and turns a tube; tube wrench is another
  name for it.
examples:
- He used the pipe wrench to turn the tube.
- The pipe wrench's toothed jaws gripped the tube so it would not slip.
