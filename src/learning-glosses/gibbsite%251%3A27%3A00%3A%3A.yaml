simpleMeaning: A white mineral in hard clear bits, made of aluminium joined to oxygen and hydrogen, found
  in bauxite and giving alumina, the white powder from which aluminium is made.
scope: Among the minerals found in bauxite, this white one is the source of alumina.
examples:
- We found gibbsite in the bauxite.
- They got gibbsite from the bauxite.
