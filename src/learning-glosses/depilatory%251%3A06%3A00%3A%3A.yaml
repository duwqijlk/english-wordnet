simpleMeaning: hair that is not wanted is cleared away for a time by this beauty product, and it grows
  back after a while
scope: Hair that is not wanted is cleared away for a time by this beauty product, also called a depilator
  or an epilator, not a razor that cuts hair at the skin and not a strong wash used to take hair off animal
  skins.
examples:
- She used a depilatory on her arms before the wedding.
- The depilatory worked in minutes, but the hair was back in a week.
