simpleMeaning: The nerve network from the chest spinal cord that prepares the body for fight or flight
  and opposes parasympathetic effects, speeding the heart, narrowing blood vessels and reducing digestive
  secretions.
scope: The branch of the autonomic nervous system that readies the body for action; not the parasympathetic
  branch, which calms the body and supports digestion.
examples:
- When the alarm sounded, his sympathetic nervous system sent his heart pounding.
- Long-term stress keeps the sympathetic nervous system switched on and can raise blood pressure.
