simpleMeaning: having no force that slows or stops things when they rub or slide against each other
scope: This describes a surface or movement with no slowing force between touching parts, not just smooth
  or easy in a general way.
examples:
- The puck moved across the ice as if the surface were frictionless.
- In class, we imagined a frictionless floor where a ball would never stop.
