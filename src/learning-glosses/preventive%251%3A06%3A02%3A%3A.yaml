simpleMeaning: a drug or thing used to stop a baby from starting to grow inside a woman
scope: This thing, also called preventative, is used to stop a baby from starting; it is not a medicine
  to stop illness and not a thing that blocks or slows something else.
examples:
- She uses a preventive so she will not get pregnant.
- The clinic gives free preventives to women who do not want a baby now.
