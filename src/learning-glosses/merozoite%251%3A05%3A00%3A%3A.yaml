simpleMeaning: A cell made when a parent germ splits without sex, during its life cycle
scope: A cell made when a parent germ splits without sex during its life; not a cell made by two parents
  and not the parent germ itself.
examples:
- The merozoite enters the blood after the germ splits.
- After the parent germ splits, each merozoite seeks a new home.
