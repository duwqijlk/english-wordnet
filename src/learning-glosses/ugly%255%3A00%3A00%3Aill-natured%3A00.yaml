simpleMeaning: likely to be angry or to show bad feelings, and seeming a little threatening
scope: This describes a person, mood or feeling that is angry and seems a little threatening; not a person
  or thing that does not look good.
examples:
- The waiter was in an ugly mood and spoke in a threatening way.
- An ugly feeling grew in the room before the fight started.
