simpleMeaning: A stream that forms the line between two owners' land jumps to a new course all at once,
  taking land from one owner and giving it to the other.
scope: This is the sudden jump of a boundary stream to a new course, not a slow shift of its banks.
examples:
- The avulsion moved the river and left part of his field on the other side.
- After the avulsion, the boundary stream ran through her neighbour's land.
