simpleMeaning: In ponds and slow-moving streams, one of several water plants of the group Ceratophyllum
  forms sunk masses.
scope: It is one of several water plants of the group Ceratophyllum, found in sunk masses in ponds and
  slow-moving streams rather than on dry land.
examples:
- Hornwort formed a sunk mass under the water of the pond.
- The hornwort grew in the slow stream.
