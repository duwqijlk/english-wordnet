simpleMeaning: a thin skin with blood vessels in it that covers the inner side of long bones
scope: A thin skin with blood vessels in it that covers the inner side of long bones, not the skin on
  the outside of a bone and not the soft stuff inside a bone.
examples:
- The endosteum lines the inner surface of the thigh bone.
- Blood vessels run through the endosteum inside the long bone.
