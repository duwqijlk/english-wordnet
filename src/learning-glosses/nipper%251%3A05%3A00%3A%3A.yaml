senseId: 'nipper%1:05:00::'
synsetId: 02159184-n
simpleMeaning: a gripping part on a limb of a crustacean (an animal like a crab, with jointed legs and
  a hard outer covering) or another such animal
scope: Also called claw, and another name for this sense is pincer. It is the gripping part on a crab,
  lobster or another animal with jointed legs, not a hand tool used to cut things.
examples:
- The crab lifted a small stone with its nipper.
- A lobster uses a nipper to hold its food.
