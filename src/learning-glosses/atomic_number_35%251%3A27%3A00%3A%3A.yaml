simpleMeaning: A heavy dark brown liquid, not a metal, that turns to gas easily and eats away at things;
  it belongs to the halogen group and is found in sea water.
scope: Also called Br and bromine; a heavy dark brown liquid found in sea water, not a metal of the same
  group.
examples:
- Atomic number 35 is a dark brown liquid found in sea water.
- A drop of atomic number 35 eats away at the metal plate.
