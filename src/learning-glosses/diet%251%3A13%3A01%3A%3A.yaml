simpleMeaning: the food and drink a person or an animal usually takes in
scope: The food and drink a person or animal usually takes in, not a set of foods ordered by a doctor,
  not the act of eating less, and not a law-making body.
examples:
- Rice is the main part of their diet.
- The diet of the fox includes mice and berries.
