simpleMeaning: a thin, bendy stick made from the stems of a kind of palm tree
scope: The stick made from the plant's stems, not the climbing palm itself and not the stem stuff used
  to make chairs and other things.
examples:
- He carried a rattan, a thin stick made from palm stems.
- The old man tapped the rattan against the table to get attention.
