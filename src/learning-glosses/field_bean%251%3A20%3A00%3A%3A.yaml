simpleMeaning: a plant from Europe, Asia, or Africa that grows straight up, grown most of all for big
  flat seeds people can eat, and also as food for farm animals
scope: 'Also called a broad bean, a broad-bean, and a broad-bean plant: a plant that grows straight up,
  grown for its big flat seeds, not a climbing bean and not a plant grown only for food for animals.'
examples:
- Field beans grew along the edge of the garden.
- The farmer grew field beans to feed his cows.
