simpleMeaning: a word added to another word that adds almost no meaning of its own but makes the other
  word stronger
scope: A word that only makes another word stronger, not the adjective for strong feeling or hard work,
  and not the farming sense.
examples:
- In 'finished up', 'up' is an intensive that adds force to 'finished'.
- '''Honestly'' in ''I honestly don''t know'' is an intensive that makes the denial stronger.'
