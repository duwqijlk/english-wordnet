simpleMeaning: a pile or raised bank of earth or stones made by people, rather than a natural rise in
  the land.
scope: This is not a natural raised area of land; it is a heap or bank built by people.
examples:
- The children piled the earth into a small hill.
- A low hill of stones had been raised beside the road.
