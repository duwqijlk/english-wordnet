simpleMeaning: The substance in beer, wine and spirits that makes people drunk; also used as a solvent,
  in medicines and colognes, and as a renewable additive to gasoline.
scope: The chemical in general, with industrial and fuel uses; not the 95 percent neutral spirit used
  for blending whisky.
examples:
- Ethyl alcohol is the substance that makes alcoholic drinks intoxicating.
- The label says the cleaner contains ethyl alcohol.
