simpleMeaning: A harmless, legless, wormlike lizard of warm or tropical regions with hidden eyes and ears
  and a short blunt tail; it is in the genus Amphisbaena.
scope: A legless lizard of the genus Amphisbaena that resembles an earthworm, with hidden eyes and ears.
  It is not a snake, although it is long and limbless; its tail is short and blunt.
examples:
- The worm lizard slipped into a crack in the dry earth.
- Children often mistake a worm lizard for a snake.
