simpleMeaning: trying to win favor by praising someone too much in a way that is not honest
scope: 'Also called sycophantic and bootlicking: praising someone too much to win favor, not truly admiring
  them, and not limited here to people with power.'
examples:
- His fawning praise of the boss made his workmates uncomfortable.
- She gave the manager a fawning smile and agreed with everything he said.
