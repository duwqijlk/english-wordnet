simpleMeaning: A word once used for taking on the gender role of the other sex.
scope: A word once used for taking on the gender role of the other sex, not a change of tune in music,
  a change in the way a chemical turns light, an organ turned inward, a change in the order of genes,
  or cold air lying under warm air.
examples:
- In old books, inversion was the word for taking on the gender role of the other sex.
- The term inversion is no longer used in that sense.
