simpleMeaning: a layer put over a surface to make it look better, such as a thin sheet of gold or a thin
  sheet of wood
scope: This is a thin layer put on a surface to make it look better, not a strong protective layer put
  over the frame of a building to make it stronger.
examples:
- The box had a gold overlay that shone in the light.
- She chose a wood overlay for the plain table top.
