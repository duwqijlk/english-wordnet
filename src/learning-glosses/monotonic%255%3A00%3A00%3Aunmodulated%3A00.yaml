senseId: monotonic%5:00:00:unmodulated:00
synsetId: 01545995-s
simpleMeaning: Said or sounded in a voice that stays at one pitch, with no rise or fall
scope: Said or sounded in a voice that stays at one pitch, with no rise or fall; flat, monotonous and
  monotone are other names for this, not a list of numbers that only goes up or only goes down.
examples:
- He read the list in a monotonic voice that never rose or fell.
- The monotonic hum of the machine stayed at one pitch all day.
