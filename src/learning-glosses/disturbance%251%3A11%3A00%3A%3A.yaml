simpleMeaning: something going on that goes wrong, gets in the way, or stops what is happening
scope: This is the fault-or-break-in sense of disturbance, not a disorder of thought or feeling, not noise
  that breaks up a signal, and not a noisy outburst among people.
examples:
- He looked around for the source of the disturbance.
- There was a disturbance of neural function after the injury.
