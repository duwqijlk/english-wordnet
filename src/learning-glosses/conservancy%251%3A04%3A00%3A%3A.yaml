simpleMeaning: official work to keep trees, soil, rivers and other parts of nature safe
scope: The work of keeping nature safe in an official way, not a group in charge of fishing and boats
  on a river or in a port.
examples:
- Conservancy of the valley's trees and rivers is the council's job.
- Good conservancy keeps the soil rich and the water clean.
