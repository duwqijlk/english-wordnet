simpleMeaning: A liquid with no colour or a yellow colour and a strong smell, one of the parts that make
  up creosote
scope: A clear or yellow liquid with a strong smell, one part of creosote; not the whole of creosote and
  not a solid.
examples:
- The creosol in the sample had a sharp smell.
- Creosol is a liquid that comes from creosote.
