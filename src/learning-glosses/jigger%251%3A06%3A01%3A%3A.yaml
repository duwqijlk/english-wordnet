simpleMeaning: any small mast on a sailing boat, especially the back mast of a yawl (a sailing boat with
  two masts)
scope: A small mast on a sailing boat, also called jiggermast. Not the tiny biting mite also called jigger,
  and not the small glass for whiskey.
examples:
- The jigger at the back of the yawl held a small sail.
- He climbed the jigger to fix the ropes above the deck.
