simpleMeaning: a jet in which blades driven by a turbine send extra air to the burner and give extra push
scope: 'Also called turbofan, fan-jet, fanjet and fanjet engine: a jet that gains extra push from air
  sent to the burner, not a plain jet and not a propeller plane.'
examples:
- The new turbofan engine is quieter than older jets.
- Engineers tested the turbofan engine on the ground before the first flight.
