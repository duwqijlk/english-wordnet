simpleMeaning: how much a thing sets a person thinking, by the ideas it puts in their mind
scope: How full of ideas a thing is, and how much it makes people think; not the act of making a suggestion.
examples:
- The suggestiveness of her paintings made me think for hours.
- There was a strange suggestiveness in his smile.
