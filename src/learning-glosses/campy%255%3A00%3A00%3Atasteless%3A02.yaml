scope: 'Also called camp: funny in a knowing, high-style way because it is overdone on purpose, not simply
  funny and not a serious drama played straight.'
examples:
- The campy musical played up the silliness of every role.
- Her campy act was overdone on purpose, and the crowd loved it.
