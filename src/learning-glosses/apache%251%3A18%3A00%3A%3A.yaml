simpleMeaning: A member of Athapaskan peoples who moved to the Southwest, from Arizona through Texas into
  Mexico, and lost a war against the US in 1861-1886 and were sent to Oklahoma.
scope: A member of the Athapaskan peoples of the southwestern desert, not the Apache language and not
  a member of other peoples of the Southwest.
examples:
- The Apache fought hard to keep their desert homeland.
- Many Apache were moved to Oklahoma after the war.
