simpleMeaning: One of four makers of body chemicals, set above or inside the soft mass in the front of
  the neck.
scope: One of four makers of body chemicals above or inside the soft mass in the front of the neck, also
  called parathyroid; not that soft mass itself and not a maker of chemicals in the belly.
examples:
- The parathyroid gland keeps the body's calcium in balance.
- Surgeons take care not to harm a parathyroid gland.
