simpleMeaning: a fruit about the size of an apple, of the passion-flower kind, grown in the West Indies
scope: This is a fruit about the size of an apple from the West Indies, not the plant that bears it and
  not a fruit of another size.
examples:
- She cut open a sweet calabash for breakfast.
- They bought a sweet calabash at the market in the West Indies.
