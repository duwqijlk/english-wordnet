simpleMeaning: a bush-like tree common along tropical coasts, whose light, tough wood serves for canoe
  outriggers and whose fiber makes rope and caulking; often planted as an ornamental.
scope: Another name for the shrubby tropical-shore mahoe, valued for outrigger wood and fiber; not the
  taller Cuban forest tree with hairy leaves and orange-red flowers.
examples:
- Purau trees line much of the tropical coast, their light wood favored for outriggers.
- Islanders once used purau fiber to make cord and caulking.
