simpleMeaning: People eat the fat roots below the ground of this thick-haired plant that lives many years
  in the middle of North America.
scope: Also called breadroot and pomme blanche, this thick-haired plant of the middle of North America
  has fat roots that people eat.
examples:
- People eat the fat roots of the pomme de prairie.
- The pomme de prairie is covered in thick hairs.
