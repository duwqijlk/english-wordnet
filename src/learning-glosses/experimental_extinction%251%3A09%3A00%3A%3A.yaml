simpleMeaning: In learning by conditioning, the process in which the reward is taken away and the learned
  response stops depending on the signal that once set it off.
scope: In learning by conditioning, the process in which the reward is taken away; also called extinction,
  not the learning of a new response and not the forgetting of a fact.
examples:
- Experimental extinction ended the dog's response when the food stopped.
- The rat showed experimental extinction after the reward was removed.
