simpleMeaning: a tool used to hit floor coverings to knock the dust out of them
scope: A tool for knocking dust out of floor coverings by hitting them, not a machine that sucks up dust
  and not a brush for sweeping a floor.
examples:
- She took the carpet beater outside to clean the rug.
- He swung the carpet beater hard to knock the dust from the mat.
