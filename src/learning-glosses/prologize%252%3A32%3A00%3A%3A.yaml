senseId: 'prologize%2:32:00::'
synsetId: 00904052-v
simpleMeaning: To write or speak the short opening piece of a play or book
scope: To write or speak the short opening piece of a play or book, also called prologise or prologuize;
  not to write the main part of a play and not to sum up a book at its end.
examples:
- The author will prologize his own work.
- Actors often prologize a first night.
