simpleMeaning: in a bad or sad state that makes people feel sorry, or should make them feel sorry, for
  the person or thing
scope: 'Also called poor, miserable, wretched, and pitiful: in a sad, bad state that deserves pity; not
  the sense where pity is mixed with scorn or contempt.'
examples:
- The pathetic dog waited in the rain with no home to go to.
- They lived in a pathetic little room and had almost no food.
