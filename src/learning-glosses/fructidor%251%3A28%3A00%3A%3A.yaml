simpleMeaning: The last month of the Revolutionary calendar, the month of fruit, which falls in August
  and September.
scope: The twelfth and last month of the Revolutionary calendar, covering late summer, not one of the
  other eleven months.
examples:
- Fructidor came after Thermidor in the Revolutionary calendar.
- The harvest festival fell in Fructidor.
