simpleMeaning: to make something last longer, or stretch further in time or space
scope: 'Also called sustain: to make something last longer, not to end it early.'
examples:
- They tried to prolong the meeting until everyone had spoken.
- The doctor wanted to prolong the treatment for one more week.
