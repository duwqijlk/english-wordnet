senseId: 'continuant%1:10:00::'
synsetId: 07133075-n
simpleMeaning: A speech sound made by narrowing, but not shutting, the path the voice takes
scope: A speech sound made by narrowing but not shutting the voice path, also called a continuant consonant,
  not a sound made by shutting the voice path and not a vowel.
examples:
- The sound 's' is a continuant.
- A continuant lets air pass while the voice path narrows.
