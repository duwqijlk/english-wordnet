simpleMeaning: A coloured stick of make-up used to darken the hairs above the eyes.
scope: A coloured make-up stick for darkening the brow hairs, not mascara and not a liner for the lids.
examples:
- She drew on her eyebrow pencil before leaving the house.
- He bought a soft eyebrow pencil to fill in his brows.
