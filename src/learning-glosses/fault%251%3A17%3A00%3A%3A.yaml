simpleMeaning: In geology, a crack in the earth's crust where one side has shifted relative to the other
scope: This is a crack in the earth's crust where the two sides have moved relative to each other; break,
  shift, fracture, faulting and geological fault are other names for this sense. Not an electrical failure
  and not a mistake.
examples:
- The road was built directly over a geological fault.
- Movement along the fault triggered a small earthquake.
