simpleMeaning: A wire or cord used to hold something steady, most of all a tent.
scope: A wire or cord used to hold something steady, most of all a tent; guy, guy cable and guy wire are
  other names for it, not a tent peg and not the pole that holds a tent up.
examples:
- They tied a guy rope to the tent to hold it steady.
- The guy rope kept the mast from swaying in the wind.
