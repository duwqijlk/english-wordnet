simpleMeaning: A low curved top, shaped like a flat oval or with a point, most often drawn with four points
  as its guides.
scope: A low curved top, flat-oval or pointed, drawn with four points as guides; not a high round top
  and not a top drawn with one point.
examples:
- The four-centered arch over the door was low and wide.
- Builders used a four-centered arch for the old hall.
