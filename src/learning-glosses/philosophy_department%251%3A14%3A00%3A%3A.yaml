simpleMeaning: The part of a college or university that teaches the study of ideas about life and knowledge.
scope: This is the part of a college that teaches the study of ideas about life, also called department
  of philosophy; it is not the part that teaches history, and not a single teacher of the subject.
examples:
- The philosophy department meets on the second floor.
- She joined the philosophy department as a teacher.
