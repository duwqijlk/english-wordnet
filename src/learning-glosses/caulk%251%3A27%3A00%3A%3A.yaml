simpleMeaning: A soft paste that fills gaps and seals joints in building and repair, to keep water out.
scope: A filler used in building and repair to keep water out, also called caulking; not the act of sealing
  with it.
examples:
- He pressed caulk into the crack around the window frame.
- The caulk had dried and cracked, so water came in.
