simpleMeaning: the power of a living thing to keep itself safe from harmful things in the place where
  it lives
scope: A living thing's power to stay safe from harmful things around it, such as salt or dirty air; not
  the state of being able to fight off disease, and not a force that slows movement.
examples:
- These trees have strong resistance to salt and dirty air.
- The plant's resistance to hot, dry air helped it live through the summer.
