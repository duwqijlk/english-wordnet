simpleMeaning: To tell what will happen by looking at water, such as the shapes made by the rise and fall
  of the sea
scope: Telling the future from water, not from stars or cards and not from dreams.
examples:
- She practised hydromancy by watching the tides.
- In the old tale, the seer used hydromancy to read the water.
