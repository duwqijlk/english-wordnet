simpleMeaning: In psychiatry, a disorder of thought or feeling, a softer word than mental illness.
scope: In psychiatry, this is a disorder of thought or feeling, not a sickness of the body, and it is
  also called a disturbance, a mental disorder, a mental disturbance, and a psychological disorder.
examples:
- The doctor spoke of folie rather than mental illness.
- Folie is the French word for such a disorder.
