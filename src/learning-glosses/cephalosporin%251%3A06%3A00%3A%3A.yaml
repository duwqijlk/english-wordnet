synsetId: 03000447-n
simpleMeaning: A group of antibiotics that work against many bacteria, made by fungi and close to penicillin
  (sold as Mefoxin); adding side chains gives semi-synthetic versions with stronger germ-fighting power.
scope: One class of fungus-made antibiotics related to penicillin; not penicillin itself.
examples:
- The doctor prescribed a cephalosporin for the stubborn ear infection.
- Cephalosporins were developed from fungi and later modified to work better against resistant bacteria.
