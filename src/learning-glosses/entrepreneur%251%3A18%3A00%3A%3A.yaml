simpleMeaning: a person who sets up a business and takes the risk for it
scope: This is a person who sets up their own business and takes the risk for it. It is not a worker in
  a business, and not a manager who runs a business for someone else.
examples:
- As an entrepreneur, she started her own shoe shop.
- The young entrepreneur risked his savings to open a bakery.
