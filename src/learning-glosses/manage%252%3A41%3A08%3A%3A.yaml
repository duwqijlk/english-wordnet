simpleMeaning: Get something you want by using dishonest tricks or underhand methods.
scope: This sense is about reaching a result through deceit, not about succeeding with scant means or
  being in charge of something.
examples:
- They managed the deal by bribing two officials.
- He managed a place on the guest list by posing as a reporter.
