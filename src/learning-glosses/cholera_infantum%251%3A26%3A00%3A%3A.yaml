simpleMeaning: A sickness of the gut in children that often kills, with signs like another gut illness
  but not truly that illness
scope: A sickness of the gut in children that often kills, with signs like another gut illness but not
  truly that illness; not that illness itself and not other sicknesses of the gut in children.
examples:
- Cholera infantum struck many children in the town.
- The baby died of cholera infantum.
