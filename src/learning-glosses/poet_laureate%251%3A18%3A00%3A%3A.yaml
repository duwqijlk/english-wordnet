simpleMeaning: A writer of poems given a formal post in the royal house of Great Britain
scope: This is a writer of poems with a formal post in the royal house of Great Britain, not a writer
  of poems only thought of as holding such a place, and not any writer of poems.
examples:
- The poet laureate read a new poem at the king's birthday.
- She was named poet laureate and now writes poems for the royal household.
