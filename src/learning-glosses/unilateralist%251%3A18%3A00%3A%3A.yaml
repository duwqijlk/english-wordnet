simpleMeaning: a person who backs one side acting alone
scope: A person who backs one side acting alone, not one who backs acting with others and not one who
  backs a deal made by all sides.
examples:
- The unilateralist argued for going it alone.
- As a unilateralist, she opposed the joint pact.
