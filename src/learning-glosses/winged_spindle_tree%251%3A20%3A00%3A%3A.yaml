simpleMeaning: A bushy shrub that loses its leaves, with thin, wide, corky ridges running along its branches,
  turning brilliant red in autumn and native from northeastern Asia to central China.
scope: A bushy Asian shrub whose branches carry thin corky ridges and which turns brilliant red in autumn.
  It is not the common European spindle, which lacks such wide corky wings.
examples:
- The nursery sells winged spindle trees as ornamental shrubs.
- We planted a winged spindle tree along the back fence.
