simpleMeaning: A glass tube marked with lines, used to measure how much gas grows or shrinks when gases
  react with each other.
scope: A tool for measuring gas changes, not one for measuring heat or air pressure.
examples:
- The chemist used a eudiometer to measure the gas given off by the reaction.
- A eudiometer showed the gas had shrunk after the two gases mixed.
