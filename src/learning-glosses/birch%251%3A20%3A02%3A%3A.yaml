simpleMeaning: hard wood with a fine close grain from any of several kinds of the tree, used mostly for
  furniture, indoor finishes, and plywood
scope: The hard wood of the tree, not the tree itself and not the stick used for punishment.
examples:
- The table was made of pale birch.
- Birch plywood covered the cabin walls.
