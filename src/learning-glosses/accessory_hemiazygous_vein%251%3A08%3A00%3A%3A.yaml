simpleMeaning: formed when the 4th to 7th tubes between the back ribs meet, this blood tube empties into
  the azygos tube
scope: 'Also called accessory hemiazygos vein and vena hemiazygos accessoria: a chest blood tube formed
  from the back rib veins, not the azygos vein itself.'
examples:
- The accessory hemiazygous vein carries blood from the upper ribs.
- Surgeons trace the accessory hemiazygous vein to the azygos vein.
