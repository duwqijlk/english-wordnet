simpleMeaning: a very bad crash, especially one with a car or another motor vehicle
scope: A noun for a very bad crash, especially one with a car or another motor vehicle; not destroying
  something people see as evil or harmful, not hitting something hard and suddenly, and not a hard tennis
  hit from above the head.
examples:
- There was a bad smash between two cars on the main road.
- No one was killed in the smash, but both cars were badly damaged.
