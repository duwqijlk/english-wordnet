simpleMeaning: The red parts of the blood are the wrong shape, curved like a half moon, in this blood
  illness people are born with, found mostly in black people
scope: This blood illness is also called crescent-cell anemia, drepanocytic anaemia, drepanocytic anemia,
  sickle-cell anaemia, sickle-cell anemia, and sickle-cell disease, and it is one people are born with,
  found mostly in black people.
examples:
- The baby was born with crescent-cell anaemia.
- She has lived with crescent-cell anaemia since birth.
