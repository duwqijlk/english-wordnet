senseId: 'welcome%1:26:00::'
synsetId: 14436669-n
simpleMeaning: The friendly acceptance that people show when you arrive or join them.
scope: This is not the act of greeting someone at the door, and not the adjective describing something
  pleasing; it is the friendly feeling of being accepted.
examples:
- The visitors had clearly outstayed their welcome.
- There was no welcome for strangers in that village.
