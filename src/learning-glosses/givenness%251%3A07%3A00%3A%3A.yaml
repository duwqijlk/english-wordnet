simpleMeaning: the way something is taken as true, agreed or supposed, without proof
scope: The way a thing is taken as true without proof, not a fact shown to be true and not a guess made
  on the spot.
examples:
- The givenness of the idea let the talk move on.
- He questioned the givenness of the rule.
