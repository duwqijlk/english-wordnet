simpleMeaning: a tree of the Tilia group with heart-shaped leaves and hanging branched sprays of small
  yellowish flowers, often fragrant; the timber of some kinds is valuable.
scope: The Tilia tree, also called basswood, lime tree or linden; not the citrus tree that bears green
  limes, the fruit itself, or the white calcium powder.
examples:
- The old lime in the churchyard is a Tilia with heart-shaped leaves and fragrant summer flowers.
- Limes were planted along the avenue for shade, and their pale flowers scent the air in June.
