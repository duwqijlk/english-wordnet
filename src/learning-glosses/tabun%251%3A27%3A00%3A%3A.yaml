simpleMeaning: 'The first nerve agent known, made by German chemists in 1936: a highly toxic, flammable
  liquid that dissolves in organic solvents and serves as a nerve gas in chemical warfare.'
scope: The specific German nerve agent of 1936, a liquid chemical weapon. It is not sarin, the later and
  better-known nerve agent, and not the general phrase nerve gas. The term belongs to chemistry and chemical
  warfare.
examples:
- The inspectors found drums of tabun at the old chemical plant.
- Emergency crews carry antidotes for anyone exposed to tabun.
