simpleMeaning: having or making a thin, high sound, like the sound of a mouse or of a rusty hinge
scope: This word, also called squealing, squeaky and squeaking, describes a thin, high sound; it does
  not mean loud in a deep way or rough and low.
examples:
- The old gate made a screechy sound when it opened.
- Her screechy voice hurt my ears.
