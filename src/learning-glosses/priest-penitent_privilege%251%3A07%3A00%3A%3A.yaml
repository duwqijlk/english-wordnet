synsetId: 05188204-n
simpleMeaning: the right of a church minister to keep secret what a person tells him in confession or
  in a like private talk
scope: The right of a church minister to keep secret what a person tells him in confession; not a lawyer's
  right to keep a client's words secret, and not a doctor's duty to keep a patient's facts private.
examples:
- The priest-penitent privilege lets the minister stay silent about what he heard in confession.
- She trusted the priest-penitent privilege when she spoke to him in private.
