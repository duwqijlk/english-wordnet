simpleMeaning: A chain of changes in which each step, big or small, and each turn is fixed by chance
scope: A chain of changes fixed by chance; not a planned path and not a steady march in one direction.
examples:
- In the model, the particle's random walk carried it far from its start.
- Each random walk in the test ended in a different place.
