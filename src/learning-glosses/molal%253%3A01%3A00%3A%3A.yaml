senseId: 'molal%3:01:00::'
synsetId: 02911633-a
simpleMeaning: Said of a liquid in which the amount dissolved is counted by weight, with one mole, a set
  amount, of the dissolved thing in each kilogram of the liquid
scope: Said of a liquid whose strength is counted by weight of liquid, not by volume; not molar, which
  counts by volume.
examples:
- A molal solution holds one mole of salt in each kilogram of water.
- The chemist made up a molal mixture for the test.
