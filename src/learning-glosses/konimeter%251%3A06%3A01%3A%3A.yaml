simpleMeaning: An instrument that measures dust in the air by drawing a sample through a small opening
  onto a greased glass plate, where the particles stick.
scope: This is the instrument that measures dust in air; it is not a general air-quality monitor, and
  not the greased plate on which the sample is collected.
examples:
- The mine inspector used a konimeter to check the dust level underground.
- Samples from the konimeter showed far fewer particles after the ventilation was improved.
