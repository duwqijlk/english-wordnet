simpleMeaning: aimed at helping churches and other faiths come together as one
scope: 'Also called ecumenic, oecumenic and oecumenical: aimed at helping churches and other faiths come
  together as one, not about one church or faith on its own and not about the movement that works for
  union.'
examples:
- Her ecumenical work brings leaders of many churches together.
- The ecumenical talks aim to heal old splits between faiths.
