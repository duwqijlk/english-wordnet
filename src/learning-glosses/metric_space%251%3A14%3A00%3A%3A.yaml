senseId: 'metric_space%1:14:00::'
synsetId: 08021137-n
simpleMeaning: A set of points where each pair has a distance, never below zero, the same in both directions,
  and never longer than going by way of a third point.
scope: A set of points where each pair has a distance that follows the three rules above, not a loose
  set of points with no such rule and not a single flat surface.
examples:
- In a metric space, every pair of points has a distance that follows the three rules.
- The teacher showed that a metric space needs a distance for each pair of points.
