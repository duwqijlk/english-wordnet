simpleMeaning: an open area that has walls or buildings all around it or around part of it
scope: 'Also called court: an open area with walls or buildings around it, not a room inside a building
  and not a garden or a street.'
examples:
- The children played in the courtyard behind the school.
- Our hotel room looked out over a small courtyard.
