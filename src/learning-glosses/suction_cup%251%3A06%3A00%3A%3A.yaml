simpleMeaning: Made of rubber, glass, or plastic, this round hollow piece sticks to a surface, or pulls
  things onto it, by leaving a small empty space inside.
scope: Like a hook or a clamp, this round hollow piece holds things in place, but it does so by the empty
  space it leaves inside.
examples:
- The suction cup held the hook to the bathroom tile.
- The suction cup drew the sign onto the glass.
