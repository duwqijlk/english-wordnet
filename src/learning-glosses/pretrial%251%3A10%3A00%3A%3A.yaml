senseId: 'pretrial%1:10:00::'
synsetId: 07159734-n
simpleMeaning: In law, a meeting before a trial where both sides set out how facts will be shared and
  what will be tried; more useful in civil than in criminal cases
scope: This is a meeting in law held before a trial starts, not the trial itself and not a casual talk
  with no plan for the case.
examples:
- The judge held a pretrial to decide what the trial would cover.
- At the pretrial, both sides shared their lists of facts.
