simpleMeaning: Rooms in a Muslim home kept for wives, for women who live with a man as wives without being
  married to him, and for women of the family
scope: These are rooms, also called a hareem, a seraglio, and a serail, not the group of women who live
  in them.
examples:
- Visitors were not allowed to enter the harem at the back of the house.
- The women of the family lived in the harem, away from guests.
