simpleMeaning: when feelings of joy run far too big, and a person believes they are far greater and more
  important than they are
scope: A mood of overblown joy and self-importance, not a thing that grows or spreads, and not grand,
  bold behaviour.
examples:
- After the good news, his expansive mood made him talk as if he owned the whole town.
- Her expansive talk that night was full of wild joy and plans far beyond her means.
