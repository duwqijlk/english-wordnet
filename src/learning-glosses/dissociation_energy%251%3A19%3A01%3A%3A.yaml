senseId: 'dissociation_energy%1:19:01::'
synsetId: 92466354-n
simpleMeaning: the amount of power needed to break all the ties in one tiny bit of matter and pull every
  one of its smallest parts fully apart
scope: The power needed to break every tie in one bit of matter and pull all its smallest parts fully
  apart, not the power given off when ties form and not the power needed to break just one tie.
examples:
- The dissociation energy of water is high because its bonds hold fast.
- They used the dissociation energy to work out how the molecule would break apart.
