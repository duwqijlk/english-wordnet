simpleMeaning: any of many small harmless North American legless creatures with a yellow or orange band
  round the neck
scope: Not the harmless European snake of the same name, and not a large North American snake; also called
  ring-necked snake and ringneck snake.
examples:
- A ring snake hid under the damp leaves.
- The ring snake had an orange band round its neck.
