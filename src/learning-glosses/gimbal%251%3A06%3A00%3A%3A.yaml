simpleMeaning: A device that lets a thing, such as a ship's compass, stay level even when its stand tips
scope: This is a device that lets a thing stay level even when its stand tips, not the compass itself
  and not a fixed stand.
examples:
- The gimbal kept the compass level in the rough sea.
- He fixed the gimbal so the lamp would not swing.
