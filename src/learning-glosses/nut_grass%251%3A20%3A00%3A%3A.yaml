simpleMeaning: Small lumps under the ground that people can eat grow on a long-lived plant found in many
  places, shaped like the hard fruit it is named for.
scope: Also called a nut sedge, nutgrass or nutsedge, this long-lived plant is found in many places and
  has small lumps under the ground, shaped like the hard fruit it is named for, that people can eat.
examples:
- The nut grass had small lumps under the ground.
- The small lumps of nut grass were good to eat.
