senseId: 'arc_cosine%1:24:00::'
synsetId: 13810065-n
simpleMeaning: The angle you get back when you start from a stated side ratio, the side next to the angle
  over the longest side of a right-angled triangle.
scope: The angle you get back from a stated side ratio; arccos, arccosine and inverse cosine are other
  names for it, and it is not the ratio itself and not the angle's sine.
examples:
- The arc cosine of 0.5 is 60 degrees.
- Use the arc cosine to find the angle from the ratio.
