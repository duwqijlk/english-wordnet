simpleMeaning: a small insect that steals the young of other colonies and makes them work, found all over
  the north of the world
scope: A small insect that raids other colonies and lives across the north of the world, not an ordinary
  garden ant and not a termite.
examples:
- The sanguinary ant raided the nest and carried off its young.
- A sanguinary ant colony was found in the northern woods.
