simpleMeaning: a set of proteins made in lymph tissue in animals with backbones, which act as antibodies
  in the body's defence
scope: Also called immunoglobulin, immune globulin, immune gamma globulin, or immune serum globulin; a
  set of proteins that fight disease, not a hormone and not a blood cell.
examples:
- Ig levels rise after a vaccine.
- The lab measured Ig in her blood.
