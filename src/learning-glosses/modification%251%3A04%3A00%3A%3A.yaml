simpleMeaning: the act of making something different, such as changing the size of a piece of clothing
scope: 'Also called adjustment and alteration: the act of making something different. It is not an event
  in which something passes from one state to another, and not a slightly changed copy.'
examples:
- She made a small modification to the dress to make it fit better.
- One modification to the plan will make it work better.
