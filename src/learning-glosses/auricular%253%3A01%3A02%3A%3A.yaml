senseId: 'auricular%3:01:02::'
synsetId: 02659830-a
simpleMeaning: said of something that has to do with the ear, is heard with the ear, or is shaped like
  an ear
scope: Said of things linked to the ear, whether heard or shaped like it, not of things linked to the
  eye and not of a sound itself.
examples:
- An auricular confession is one spoken into a priest's ear.
- The auricular appendage is a small flap shaped like an ear.
