simpleMeaning: From a tall pole hangs a level bar at its middle, and below the bar hangs a four-sided
  cloth.
scope: 'No sloping bar holds this cloth: it is four-sided, hung below a level bar that is held at its
  middle from a tall pole.'
examples:
- The crew raised the square sail.
- The square sail was mended with needle and thread.
