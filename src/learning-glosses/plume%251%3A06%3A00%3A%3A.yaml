simpleMeaning: one feather or a group of feathers that a person wears to look good
scope: Feathers worn to look good, not the feathers that cover a bird's body, and not a light thing shaped
  like a feather.
examples:
- The hat had a bright red plume on one side.
- She wore a plume of white feathers in her hair.
