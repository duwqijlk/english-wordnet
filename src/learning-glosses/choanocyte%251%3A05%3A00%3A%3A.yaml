simpleMeaning: a cell in a sponge with a whip-like tail and a ring of soft matter round it, keeping water
  moving through the sponge
scope: A cell in a sponge with a whip-like tail and a ring of soft matter round it, also called a collar
  cell; not a nerve cell and not a muscle cell.
examples:
- The choanocyte beats its tail to draw water through the sponge.
- Choanocytes keep water moving through the sponge's body.
