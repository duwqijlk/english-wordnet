simpleMeaning: a hanging work of art whose light parts are carefully balanced so that moving air makes
  them turn.
scope: This is a hanging work of art, not a telephone or any other object that can be moved.
examples:
- A bright mobile hung above the baby's cot.
- The gallery showed a large metal mobile that turned in the draft.
