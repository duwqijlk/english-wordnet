simpleMeaning: People with this brain swelling could not move their eyes, and their muscles grew very
  weak, after it spread widely between 1915 and 1926.
scope: 'Also called encephalitis lethargica, epidemic encephalitis, lethargic encephalitis, and sleepy
  sickness: a brain swelling that spread widely between 1915 and 1926.'
examples:
- The sleeping sickness left him unable to move his eyes.
- Doctors saw many cases of sleeping sickness in 1920.
