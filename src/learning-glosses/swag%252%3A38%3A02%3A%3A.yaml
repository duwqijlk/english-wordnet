senseId: 'swag%2:38:02::'
synsetId: 01989538-v
simpleMeaning: To droop or sink down and settle, as if pressed on or no longer held tight.
scope: Also called flag, droop, and sag, to sink or settle as if pressed on or no longer held tight, not
  a bundle of a traveller's things, not stolen goods, not a heavy unsteady sway, and not a walk that cannot
  be held steady.
examples:
- The shelf began to swag under the weight of the books.
- The rope will swag if it is not pulled tight.
