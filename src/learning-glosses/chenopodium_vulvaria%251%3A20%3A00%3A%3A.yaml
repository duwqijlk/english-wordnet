scope: This is a goosefoot of Europe with leaves that smell strongly, also called the stinking goosefoot;
  it is a plant that came to eastern North America from elsewhere, not one that grew there all along.
examples:
- Chenopodium vulvaria grows along the path, its leaves giving off a strong smell.
- We found Chenopodium vulvaria near the fence, a plant that came from Europe.
