simpleMeaning: Used to kill fungi and to make aspirin, dyes, and perfumes, this white crystal-like stuff
  leaves a bitter aftertaste.
scope: 'Another name for this sense is salicylic acid: a white crystal-like stuff that tastes bitter after
  swallowing and goes into aspirin, dyes, and perfumes, and kills fungi.'
examples:
- The chemist weighed out 2-hydroxybenzoic acid for the aspirin mixture.
- 2-Hydroxybenzoic acid gives the medicine its bitter aftertaste.
