simpleMeaning: Passed on as young by biting insects, these thin thread-like round worms live in the blood
  and body tissues of animals with backbones.
scope: Thin thread-like worms that live in the blood of animals with backbones and spread through insect
  bites, not gut worms and not the insects themselves.
examples:
- Mosquitoes can pass filaria to people through their bites.
- Filaria live in the blood of the animals they infect.
