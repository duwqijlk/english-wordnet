senseId: 'dispersion%1:07:00::'
synsetId: 05094504-n
simpleMeaning: The way things are spread out over a stretch, an area, or a volume of space, lying scattered
  about.
scope: Also called distribution, the way things are spread out over a place; not the act of spreading
  or scattering something.
examples:
- The dispersion of the seeds covered the whole field.
- Scientists studied the dispersion of nerve fibres in the body.
