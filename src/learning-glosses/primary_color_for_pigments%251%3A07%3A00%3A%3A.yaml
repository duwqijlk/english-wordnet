simpleMeaning: One of three colours from which every other colour can be made by mixing
scope: One of the three colours from which all other colours come; primary colour for pigments is another
  name for this sense, not a colour made by mixing others.
examples:
- Red is a primary color for pigments, along with blue and yellow.
- The painter mixed a primary color for pigments with white to make a lighter shade.
