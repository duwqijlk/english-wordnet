simpleMeaning: having a great name that many people know, and thought of with great respect
scope: 'Also called honored, prestigious and honoured: known by many people for a good name and well thought
  of, not just liked by a few people or known for a short time.'
examples:
- Our esteemed teacher was given an award for fifty years of work.
- The esteemed writer spoke to a full room.
