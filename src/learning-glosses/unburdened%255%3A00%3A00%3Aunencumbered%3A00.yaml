simpleMeaning: not carrying a load, and not held back by one
scope: This is about not carrying a heavy load, not about being free from hard problems or duties.
examples:
- Unburdened by bags, she walked up the hill with ease.
- The horse ran on, unburdened, after the rider took off its pack.
