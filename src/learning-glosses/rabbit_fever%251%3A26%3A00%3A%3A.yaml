simpleMeaning: a sickness that spreads very easily among rodents, above all the long-eared kind and squirrels,
  and people can catch it at times from ticks, flies, or touching sick animals
scope: This sickness of rodents is also called deer fly fever, tularaemia, tularemia, and yatobyo; it
  is not a cold or a common flu.
examples:
- Rabbit fever spread fast among the squirrels that year.
- He caught rabbit fever after handling a sick animal.
