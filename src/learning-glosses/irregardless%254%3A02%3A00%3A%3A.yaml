simpleMeaning: In spite of everything, sometimes said in a joking way as a mix of 'irrespective' and 'regardless'
scope: It means the same as 'regardless', but it is a mix of two words, sometimes said in a joking way.
examples:
- Irregardless of the rain, we went out.
- He said irregardless with a grin, knowing it was not proper.
