simpleMeaning: the meat people eat from a water animal that has a shell and no bones in its body, especially
  an animal like an oyster or a crab
scope: This is the meat of the animal, eaten as food. It is not the living water animal itself with a
  soft body in a shell.
examples:
- She cannot eat shellfish, so she never orders crab or oysters.
- He loves shellfish and often eats shrimp for dinner.
