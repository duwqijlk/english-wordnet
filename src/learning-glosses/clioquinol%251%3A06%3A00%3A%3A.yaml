simpleMeaning: This drug clears up some infections caused by fungi, such as athlete's foot
scope: Also called iodochlorhydroxyquin, this drug is for infections caused by fungi, not for infections
  caused by bacteria.
examples:
- The doctor gave her Clioquinol for the athlete's foot on her toes.
- He put Clioquinol on the fungal infection between his toes.
