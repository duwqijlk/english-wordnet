simpleMeaning: A measure of how spread out a set of numbers is, worked out as the gap between the upper
  and lower quarter marks.
scope: A measure of how spread out a set of numbers is, worked out as the gap between the upper and lower
  quarter marks, also called an interquartile range or a midspread; not the full range from lowest to
  highest and not the average.
examples:
- The middle fifty of the data was 3.5.
- To find the middle fifty, take the gap between the upper and lower quarter marks.
