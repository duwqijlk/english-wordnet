simpleMeaning: A South American shrub with pale pink flowers and egg-shaped reddish-brown fruit that can
  be eaten and looks somewhat like a tomato.
scope: Another name for the tamarillo, the South American shrub grown for its egg-shaped reddish-brown
  fruit; not the common garden tomato, and not the pepino.
examples:
- The tree tomato grows quickly and bears pale pink flowers.
- Farmers in New Zealand grow tree tomatoes for their reddish-brown fruit.
