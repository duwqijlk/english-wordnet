simpleMeaning: a person who sells advice about betting or about making money from price changes, especially
  at a horse-racing track
scope: This is a person who sells advice about betting, especially at horse races; it is not a person
  who buys tickets to sell again at a higher price.
examples:
- A tout at the track offered to sell him tips for the next race.
- The tout claimed he knew which horse would win.
