simpleMeaning: A person trained in health care who makes up and gives out medicines
scope: A person trained to make up and give out medicines, not a doctor who orders them and not a shopkeeper
  who sells other goods.
examples:
- The pharmacist made up the medicine the doctor had ordered.
- Ask the pharmacist if you are unsure how to take the pills.
