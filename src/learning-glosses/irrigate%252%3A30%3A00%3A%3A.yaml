simpleMeaning: to bring water to land or crops through channels, ditches, or streams
scope: 'This sense is also called water: to bring water to farm land. It is not the sense about washing
  a body part or wound with a steady flow of liquid to clean it.'
examples:
- Farmers irrigate the dry fields through small channels from the river.
- They irrigated the crops all summer when there was no rain.
