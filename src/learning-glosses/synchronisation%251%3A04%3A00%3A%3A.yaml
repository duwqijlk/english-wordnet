senseId: 'synchronisation%1:04:00::'
synsetId: 00809161-n
simpleMeaning: The setting of clocks to show the same time.
scope: This sense is also called synchronization and synchronizing, for the setting of clocks to show
  the same time, unlike the sense for a setting that makes a thing happen or happen again in step, and
  unlike the sense for the tie that holds when things happen at the same time.
examples:
- Synchronisation is the setting of clocks to show the same time.
- Synchronisation sets clocks to the same time.
