simpleMeaning: With big off-white or pale yellow blooms spotted with purple and a long bent beak, a plant
  that lives one year, from the southern United States to Mexico
scope: Also called common devil's claw, common unicorn plant, devil's claw, elephant-tusk and ram's horn,
  this plant lives one year and grows from the southern United States to Mexico, with big off-white or
  pale yellow blooms spotted with purple and a long bent beak.
examples:
- The proboscis flower bore big pale yellow blooms spotted with purple.
- A long bent beak hung from the proboscis flower.
