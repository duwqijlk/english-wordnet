simpleMeaning: Flowers give up a sweet-smelling oil that is used as a scent
scope: A sweet-smelling oil got from flowers, also called attar, with atar and athar as other spellings
  of the same name; not a scent made from man-made stuff and not a cooking oil.
examples:
- She put a drop of ottar on her wrist.
- The shop sold ottar made from roses.
