simpleMeaning: to act in the way that is expected on a holiday or during a rite (a set act done for beliefs
  or a special day)
scope: 'Also called keep and celebrate: to act as expected on a holiday or at a special ceremony, not
  to see that something is there and not to watch something with care.'
examples:
- They observe the holiday by resting and not working.
- She observed the rite by lighting a candle at the set time.
