simpleMeaning: Its yellow fruit, shaped like eggs and good to eat, and its bunches of purple flowers are
  why people sometimes grow this one-year plant of Australia.
scope: Also called poroporo, this is a one-year Australian plant grown for its purple flowers and yellow
  fruit, not a tree that bears apples.
examples:
- The kangaroo apple bore yellow fruit.
- She grew a kangaroo apple for its purple flowers.
