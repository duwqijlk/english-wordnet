senseId: 'contract_of_adhesion%1:10:00::'
synsetId: 06533869-n
simpleMeaning: One side has much less power to bargain in this written deal, which binds that side tightly
  while the other stays free, as some printed standard deals do.
scope: Also called an adhesion contract, this written deal binds one side tightly while the other stays
  free, and shows one side has much less power to bargain.
examples:
- The contract of adhesion left her no room to change the terms.
- He signed a contract of adhesion because the firm would take no changes.
