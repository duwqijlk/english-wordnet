simpleMeaning: 'A sign from the old number system of Rome: I, V, X, L, C, D, and M stand for 1, 5, 10,
  50, 100, 500, and 1000 in Arabic signs.'
scope: A sign of the old Rome number system, not the Arabic signs used today and not a letter of the alphabet.
examples:
- The Roman numeral XIV stands for fourteen.
- Clocks often use a Roman numeral for the hour.
