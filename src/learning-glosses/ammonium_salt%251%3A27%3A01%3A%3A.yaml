simpleMeaning: Any salt containing the NH4+ ion, formed when an acid neutralizes ammonium hydroxide
scope: This compound holds the charged NH4 bit and is made when an acid meets an ammonia-water base; it
  is not the charged bit on its own.
examples:
- Ammonium salt forms when the acid meets the base.
- The ammonium salt held the charged bit.
