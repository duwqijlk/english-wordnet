simpleMeaning: money paid to workers who are given special jobs or who do more work than their usual work
scope: 'Also called an extraneous duty allowance: money paid to workers given special jobs or who do more
  work than usual, not their normal pay and not a bonus for good work.'
examples:
- Her extra duty allowance covered the weekends she spent on the special project.
- He received an extra duty allowance for taking on the night shifts.
