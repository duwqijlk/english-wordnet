simpleMeaning: to cover wood or another surface with a clear, hard layer that makes it shine
scope: The act of putting this clear covering on a surface, not the clear, hard covering itself.
examples:
- He will varnish the wooden table to make it shine.
- She varnished the door before putting it outside.
