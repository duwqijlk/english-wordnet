simpleMeaning: a person trusted to hold the money bet by two or more people and to give it to the winner
scope: A person trusted to hold bets and give them to the winner; not a person with an interest in a business.
examples:
- The stakeholder held the money until the race ended.
- Both men gave their stakes to the stakeholder.
