senseId: 'synchronous_motor%1:06:00::'
synsetId: 04382702-n
simpleMeaning: an electric machine whose turning speed rises and falls with the rate of the alternating
  current that powers it
scope: An electric machine whose turning speed matches the rate of the power that drives it; not an ordinary
  motor whose speed does not follow the power rate and not a power source itself.
examples:
- The factory uses a synchronous motor to keep the conveyor at a steady speed.
- A synchronous motor runs faster when the power rate rises.
