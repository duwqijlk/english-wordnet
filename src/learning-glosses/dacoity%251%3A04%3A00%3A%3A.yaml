simpleMeaning: a theft carried out by a gang of armed robbers working together
scope: Also called dakoity, it is a robbery by an armed gang, not a theft by one person alone and not
  a war.
examples:
- The dacoity on the highway left the travelers with nothing.
- Police blamed the dacoity on a gang that had struck three villages.
