simpleMeaning: A falling sickness in which fits start with a lone upset of brain work, such as a twitch
  of a limb, a false sense, or a mind upset.
scope: This sense is also called focal epilepsy, a falling sickness in which fits start with a lone upset
  of brain work, such as a twitch of a limb, a false sense, or a mind upset.
examples:
- Cortical epilepsies start with a lone upset.
- The cortical epilepsy brings fits.
