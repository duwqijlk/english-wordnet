simpleMeaning: the stage of a young person's life after babyhood and before the teen years
scope: The stage of a child's life after babyhood and before the teen years, not the whole time in a person's
  life when they are a child.
examples:
- In his childhood, after babyhood and before his teens, he lived on a farm.
- Childhood is the stage after babyhood and before the teen years.
