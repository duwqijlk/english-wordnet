simpleMeaning: the act of getting back a thing that was lost, or saving one that might be lost
scope: The act of getting back a thing that was lost, or saving one that might be lost, also called retrieval;
  not getting well after being ill.
examples:
- The recovery of the stolen jewels took weeks.
- Her recovery of the lost keys was a relief.
