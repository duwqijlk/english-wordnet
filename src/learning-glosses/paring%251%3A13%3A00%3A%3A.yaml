simpleMeaning: a part of a fruit or a vegetable that you cut off, usually used in the plural, especially
  the skin or peel
scope: This is the part cut off fruit or vegetables, especially the skin. It is not a thin piece shaved
  off wood.
examples:
- She threw the potato parings into the bin.
- Apple parings lay in a pile by the sink.
