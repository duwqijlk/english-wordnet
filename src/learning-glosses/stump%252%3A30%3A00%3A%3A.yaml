simpleMeaning: to take out of the ground the short parts of trees left after the trees have been cut down
scope: Clearing a piece of land by taking out the parts left after trees are cut; it is not the three
  wooden posts that stand up in cricket.
examples:
- They stumped the field before planting corn.
- The workers spent a week stumping the new land.
