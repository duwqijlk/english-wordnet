simpleMeaning: A tool that finds how far away a thing is, using sound, light or electric signals
scope: A tool for finding how far away a thing is, also called a rangefinder; not a ruler and not a telescope.
examples:
- He aimed the range finder at the far hill.
- The range finder showed the deer was two hundred yards away.
