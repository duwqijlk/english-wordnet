simpleMeaning: to make one's body loose and bendy by stretching, as if to get ready for hard bodily work
scope: To make one's body loose and bendy by stretching before hard bodily work, also called limber up
  and loosen up; not a cool-down after work and not a rest.
examples:
- She warmed up before the race with slow stretches.
- The team warms up together before every game.
