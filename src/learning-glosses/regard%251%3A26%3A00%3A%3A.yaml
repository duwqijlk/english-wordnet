simpleMeaning: the state of being held in high honour by others
scope: 'Also called respect: the state of being held in high honour by others, not kind words that wish
  a person well and not the act of linking a person to a wrong act.'
examples:
- He is held in high regard by his neighbours.
- The teacher earned the regard of the whole town.
