simpleMeaning: a shrub or fairly large tree that grows in half-salty water along the shores of western
  Africa and warm America, valued nearby for tannin, the stuff that tans leather
scope: A shrub or fairly large tree of half-salty coastal water in western Africa and warm America, valued
  nearby for its tannin; not the red mangrove and not a tree of fresh water inland.
examples:
- White mangrove grows where the river meets the sea.
- The white mangrove along the shore gives tannin for leather.
