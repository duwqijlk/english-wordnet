senseId: 'arcus_zygomaticus%1:08:00::'
synsetId: 05292350-n
simpleMeaning: Where a spur of the cheekbone meets a spur of the temple bone, a thin curved bar of bone
  forms on the side of the head
scope: Also called zygoma and zygomatic arch, it is the bar of bone that runs from the cheekbone to the
  temple bone.
examples:
- The arcus zygomaticus runs along the side of the head from the cheekbone to the temple bone.
- You can feel the arcus zygomaticus as a thin bar of bone on the side of your head.
