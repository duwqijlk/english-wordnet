simpleMeaning: A clear point of difference between two things or people that are much alike
scope: A clear point of difference between similar things, not the act of telling them apart and not an
  honour or high standing.
examples:
- She could not see the distinction between the two fabrics.
- The distinction between the twins was hard to spot.
