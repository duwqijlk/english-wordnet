senseId: 'europeanize%2:30:01::'
synsetId: 00410794-v
simpleMeaning: A place starts to use the ideas of mainland Europe, and its customs and character change
  too.
scope: To make a place like mainland Europe in its ideas, customs and character, also called Europeanise,
  and not to take a land from its own rule and put it under a European body.
examples:
- The new government set out to Europeanize the region, and its customs, character and ideas changed.
- Missionaries helped Europeanize the town, and its people took up the ideas of mainland Europe.
