simpleMeaning: In geology, the wearing down or grinding down of something by physical action, as when
  small bits wash over it; also used in a way that is not literal.
scope: 'Also called wearing, erosion, eating away and wearing away: in geology, something worn or ground
  down by physical action, not harm done by chemicals and not building land up.'
examples:
- The eroding of the river banks left the path narrow and unsafe.
- Eroding by wind and rain slowly wore down the old stone wall.
