simpleMeaning: A small slow-growing leaf-shedding shrub-like tree of dry sandy open land in the southeastern
  United States, with leaves whose bristle-tipped lobes look like a bird's toes.
scope: Also called turkey oak and Quercus laevis; a small slow-growing tree of dry sandy open land in
  the southeastern United States, distinct from other small trees of wet ground or rich soil.
examples:
- The American turkey oak grows in the dry sandy barrens.
- American turkey oak leaves have bristle-tipped lobes.
