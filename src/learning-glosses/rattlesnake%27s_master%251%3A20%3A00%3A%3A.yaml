simpleMeaning: In the United States, a rough, prickly plant of a kind called eryngo, long-lived, was thought
  to heal the bite of the creature it is named for.
scope: Also called rattlesnake master and button snakeroot, this plant of the United States is thought
  to heal the bite of the creature it is named for.
examples:
- In the United States, rattlesnake's master grows as a rough, prickly plant.
- People used rattlesnake's master because it was thought to heal a bite.
