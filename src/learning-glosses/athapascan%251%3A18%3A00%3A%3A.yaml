simpleMeaning: A person from one of the first peoples of North America who speak a tongue, living in the
  cold north of western Canada and middle Alaska.
scope: Also called Athabascan, Athabaskan, and Athapaskan; a person from one of the first peoples of North
  America, not the group of tongues they speak.
examples:
- He is an Athapascan from the far north of Alaska.
- The Athapascan speaks a tongue of the first peoples.
