simpleMeaning: the set of ways of doing work that people use in one area of study or work
scope: This is the set of ways used in one area of study or work; it is not the part of philosophy that
  studies the ideas behind those ways.
examples:
- The research methodology was clear and easy to follow.
- Their methodology for the study used tests with two groups of people.
