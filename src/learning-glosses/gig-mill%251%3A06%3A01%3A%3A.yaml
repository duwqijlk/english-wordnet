simpleMeaning: Rollers covered in wire turn round and round in a works, raising cloth to make it soft.
scope: Also called a gig mill, this works raises cloth with turning wire rollers to make it soft.
examples:
- The gig-mill raised the cloth with its wire rollers.
- The gig-mill made the cloth soft with turning wire rollers.
