simpleMeaning: a strip of metal with each end bent to make a square corner, used to hold stone or brick
  work together
scope: A strip of metal with each end bent to make a square corner, used to hold stone or brick work together;
  cramp is another name for this sense, not a tool for bending metal and not the pain of a cramp.
examples:
- The builder fixed a cramp iron across the crack in the wall.
- Two cramp irons held the stone blocks together.
