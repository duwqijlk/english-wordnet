simpleMeaning: Wild, unheld excitement or zeal.
scope: This sense is also called madness, for wild, unheld excitement or zeal, where madness is very strong
  excitement or very strong interest in something, and not held back in any way, unlike the sense for
  the mark of being most extreme, unreasonable, or fanatical in view, most zealous, like one with rabies.
examples:
- Rabidity is wild, unheld excitement.
- Rabidity means wild zeal.
