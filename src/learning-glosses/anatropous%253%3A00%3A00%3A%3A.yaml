simpleMeaning: said of a seed part in a plant, turned all the way round so it points back down along its
  stalk
scope: This is a seed part turned right round on its stalk, also called inverted, not one that points
  straight up or out.
examples:
- The anatropous ovule hung with its tip pointing down toward the stalk.
- She pointed out the anatropous ovule in the flower, turned right round on its stalk.
