simpleMeaning: Plants make this chemical, first taken from a fungus, and it helps plants grow
scope: A plant chemical first taken from a fungus that helps plants grow, not a man-made plant food and
  not a chemical that stops growth.
examples:
- Farmers spray gibberellin on the vines to make the grapes grow larger.
- The gibberellin was first found in a fungus that attacks rice plants.
