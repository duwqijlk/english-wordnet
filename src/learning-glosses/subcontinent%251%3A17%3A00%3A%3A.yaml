simpleMeaning: a large area of land that is a separate and different part of a larger land area, such
  as India or Greenland
scope: A large separate part of a continent, such as India or Greenland, not a whole continent on its
  own and not a small island.
examples:
- The Indian subcontinent is a large, separate part of Asia.
- India is often called a subcontinent because it is so large and separate.
