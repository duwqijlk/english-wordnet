simpleMeaning: the reward or punishment that someone has earned and deserves, usually used in the plural
scope: What a person deserves, whether reward or punishment, usually in the plural; not the act of abandoning
  a cause or army.
examples:
- The cruel landlord eventually got his just deserts.
- After years of faithful service, she finally received her just deserts.
