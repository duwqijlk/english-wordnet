simpleMeaning: A flat scale set level with a road, for checking how heavy lorries, cars and farm animals
  are, and more.
scope: A flat scale set level with a road; not a small kitchen scale and not a bridge for crossing.
examples:
- The lorry stopped on the weighbridge to be weighed.
- Farmers use the weighbridge to weigh cattle before market.
