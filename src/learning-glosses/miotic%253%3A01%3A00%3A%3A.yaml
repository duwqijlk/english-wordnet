simpleMeaning: To do with the black opening in the middle of the eye growing smaller, or making it grow
  smaller
scope: 'Also called myotic: to do with the black opening in the middle of the eye growing smaller, not
  the drug itself and not a drug that makes it grow larger.'
examples:
- The doctor used a miotic drug to make the pupil smaller.
- Miotic drops narrow the pupil before the eye test.
