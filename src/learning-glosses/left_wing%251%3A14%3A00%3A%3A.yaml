simpleMeaning: These people want life to get better for everyone, through change in how society, politics,
  or money is run, in different amounts
scope: 'Another name for the left: people who want change in how society, politics, or money is run, not
  people who want things to stay as they are.'
examples:
- The left wing of the party pushed for more spending on schools.
- She joined the left wing because she wanted fairer pay for workers.
