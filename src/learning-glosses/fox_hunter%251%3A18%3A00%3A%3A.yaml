simpleMeaning: a person on horseback who rides behind the dogs chasing a wild animal with a red coat and
  a bushy tail
scope: A person on horseback who rides after dogs that are chasing a wild animal, not a person who hunts
  on foot and not a person who keeps the dogs.
examples:
- The fox hunter rode across the field behind the hounds.
- A fox hunter in a red coat led the chase.
