simpleMeaning: to cover a surface with a thin coat that forms on it with age
scope: To cover a surface with a thin coat that forms on it with age, also called patinate and patinize;
  not to paint a surface and not to polish a surface.
examples:
- He patinised the bronze statue.
- The workers patinised the copper roof.
