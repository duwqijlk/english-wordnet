simpleMeaning: a liquid with weak or dead cells from disease germs in it, put into the body with a needle
  so the body makes things that fight disease
scope: A liquid put into the body with a needle so the body makes things that fight disease, not a drug
  that fights the disease itself.
examples:
- The nurse gave the child a vaccine at the clinic.
- This vaccine helps the body fight the disease.
