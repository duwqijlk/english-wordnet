simpleMeaning: people meet and say what they feel, openly and without holding back, so that they come
  to know each other better
scope: People meet and say what they feel, openly and without holding back, so that they come to know
  each other better, not a class with a teacher and not a meeting to plan work.
examples:
- She joined an encounter group to talk more openly about her feelings.
- In the encounter group, everyone took turns saying what they felt.
