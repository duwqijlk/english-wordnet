simpleMeaning: to hide someone in secret and keep them safe, such as a person running from the law
scope: 'Also called harbor: to give secret shelter to someone hiding from the law, not a sheltered port
  where ships load and unload.'
examples:
- They harboured the fugitive in their attic for weeks.
- The farmer was accused of harbouring a thief who had escaped from prison.
