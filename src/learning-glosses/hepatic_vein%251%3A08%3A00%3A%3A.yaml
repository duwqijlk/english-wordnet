simpleMeaning: A blood vessel that drains the liver and flows into the big blood vessel that leads to
  the heart
scope: This is a blood vessel that drains the liver and flows into the big blood vessel that leads to
  the heart, also called vena hepatica, and not a blood vessel that feeds the liver or one that drains
  the gut.
examples:
- The hepatic vein carries blood from the liver.
- Surgeons traced the hepatic vein to the vena cava.
