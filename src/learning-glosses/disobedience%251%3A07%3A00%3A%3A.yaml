simpleMeaning: the quality of a person who does not want to do what they are told to do
scope: This is a person's lasting quality of not doing what they are told, not one single act of not following
  a rule.
examples:
- His disobedience at school got him into trouble every week.
- The teacher was tired of the child's disobedience.
