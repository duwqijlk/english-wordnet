simpleMeaning: done in a way that shows no skill, or in a way that people do not like
scope: This sense is about doing a thing with no skill or in a way people do not like; it is not about
  a result that works against someone, and not about how much someone needs a thing.
examples:
- She writes badly, with mistakes in almost every line.
- He paints badly, so few people buy his work.
