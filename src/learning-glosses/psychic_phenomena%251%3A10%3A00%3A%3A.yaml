simpleMeaning: Strange things that seem to break the laws of nature, and seem to be caused by the mind
  alone
scope: 'Also called parapsychology and psychic phenomenon: strange things that seem to be caused by the
  mind, not magic tricks and not things science can already explain.'
examples:
- The show looked at psychic phenomena such as minds that seem to move objects.
- Scientists study psychic phenomena to see if the mind can act on its own.
