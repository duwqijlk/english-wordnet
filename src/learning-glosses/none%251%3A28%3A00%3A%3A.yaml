simpleMeaning: The ninth hour of the day, counted from sunrise, kept as a fixed time of prayer.
scope: The hour itself rather than the service said at it, counted from sunrise and so about mid-afternoon.
examples:
- At none the heat in the courtyard was at its worst.
- The rule fixed prayer at none, about three in the afternoon.
