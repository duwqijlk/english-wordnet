simpleMeaning: a formal, serious statement that you do not agree with something
scope: A formal, serious statement that you do not agree; not a public group act in the street, and not
  the verb sense of saying something is true.
examples:
- The team finished the game under protest to the league president.
- The senator rose to record his protest against the new law.
