simpleMeaning: A warm-climate shrub, especially of the Americas, with yellow flowers and big leaves whose
  juice cures ringworm and poisonous bites, sometimes put in genus Cassia.
scope: This sense is also called ringworm cassia and ringworm shrub, for a warm-climate shrub, especially
  of the Americas, with yellow flowers and big leaves.
examples:
- Ringworm bush juice cures ringworm.
- The ringworm bush grew yellow flowers.
