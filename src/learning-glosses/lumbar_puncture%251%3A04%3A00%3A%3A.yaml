senseId: 'lumbar_puncture%1:04:00::'
synsetId: 00945884-n
simpleMeaning: taking fluid out of the space around the lower spine with a needle, to find out what is
  wrong or to treat an illness
scope: 'Also called spinal puncture and spinal tap: fluid taken from around the lower spine with a needle,
  not a blood test and not an injection of medicine.'
examples:
- The doctor did a lumbar puncture to test the fluid around her spine.
- After the lumbar puncture, he had to lie flat for a few hours.
