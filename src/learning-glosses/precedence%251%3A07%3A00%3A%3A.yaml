simpleMeaning: the fact of coming or happening before something else in time
scope: This sense is only about coming before in time. It is not about coming first in rank or order at
  a formal event.
examples:
- The earlier event takes precedence in time over the later event.
- We gave precedence in time to the story that was written first.
