senseId: 'case-fatality_proportion%1:24:00::'
synsetId: 13838283-n
simpleMeaning: the share of people with a disease who die from it, most often shown as a number out of
  a hundred or out of a thousand
scope: A way to count how deadly a disease is from the number of people who die from it, not the total
  number of people who catch it and not the number of deaths in a place.
examples:
- The case-fatality proportion for the disease was 2 out of every 100 cases.
- Doctors used the case-fatality proportion to see how deadly the new disease was.
