simpleMeaning: In Christianity, of or in line with the gospel, the teaching about Jesus, especially as
  told in the first four books of the New Testament
scope: About or in line with the gospel teaching, especially in the first four books of the New Testament;
  not about a church whose members stress a personal change of heart and full trust in the Bible, and
  not about strong support for a cause.
examples:
- The song's words are evangelical, drawn from the first books of the New Testament.
- The book takes an evangelical view, following the teaching found in Matthew, Mark, Luke and John.
