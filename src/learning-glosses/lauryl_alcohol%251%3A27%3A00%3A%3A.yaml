simpleMeaning: A clear solid alcohol that will not mix with water, used to make detergents and medicines
scope: Used to make cleaning products and medicines, this clear solid chemical will not mix with water;
  1-dodecanol is another name for this sense, not a liquid that mixes with water, and not a substance
  used only as a drink.
examples:
- Lauryl alcohol is used in many detergents.
- The cream contained lauryl alcohol.
