simpleMeaning: Used to make cleaning stuff and medicines, this clear solid chemical will not mix with
  water.
scope: Used to make cleaning stuff and medicines, this clear solid chemical will not mix with water; 1-dodecanol
  is another name for this sense, not a liquid that mixes with water, and not a stuff used only as a drink.
examples:
- Lauryl alcohol is used in many detergents.
- The cream contained lauryl alcohol.
