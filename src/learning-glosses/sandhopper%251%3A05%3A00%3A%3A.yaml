simpleMeaning: tiny sea animals with hard shells that leap like fleas, found in large numbers on ocean
  beaches
scope: This is a tiny jumping sea animal often found on ocean beaches, also called a sand hopper, a sand
  flea and a beach flea; not a true biting flea and not a large crab.
examples:
- Sandhoppers jumped all over the wet sand at low tide.
- A sandhopper landed on my towel after the wave washed in.
