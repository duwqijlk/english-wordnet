synsetId: 00515150-v
simpleMeaning: to make something easier to see and seem more important by putting it in front
scope: 'Also called highlight and spotlight: to make something stand out in front, not the front part
  of a picture itself and not the background.'
examples:
- The report foregrounds the needs of young children.
- In his speech, he foregrounded the cost of food over all other points.
