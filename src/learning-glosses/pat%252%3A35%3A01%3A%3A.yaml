simpleMeaning: to touch someone in a loving or playful way, with a light touch or a small press, especially
  under the chin
scope: 'Also called chuck: this is a loving or playful touch, especially under the chin, not a plain light
  tap on the back or head.'
examples:
- She patted the baby under the chin and made him laugh.
- He patted his daughter under the chin in play.
