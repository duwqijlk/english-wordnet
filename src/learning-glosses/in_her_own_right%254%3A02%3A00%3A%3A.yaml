simpleMeaning: A title held, or skills earned, is what gives a woman this place
scope: A woman who holds a title or a standing through what she has gained herself, also called in his
  own right, in its own right or in one's own right; not a woman who gains a place through marriage or
  birth.
examples:
- She is a rich woman in her own right rather than by inheritance.
- She became a peer in her own right, not through her husband.
