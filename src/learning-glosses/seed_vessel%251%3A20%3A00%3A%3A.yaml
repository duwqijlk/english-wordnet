simpleMeaning: the ripe walls of a plant's fruit case, changed in many ways
scope: The ripe walls of a plant's fruit case, also called pericarp; not the seeds inside and not the
  flower that made it.
examples:
- The seed vessel splits open when the fruit is ripe.
- The seed vessel is the ripe wall of the plant ovary.
