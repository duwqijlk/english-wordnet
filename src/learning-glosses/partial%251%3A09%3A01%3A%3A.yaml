simpleMeaning: In sound, one high tone that goes with a main low tone, where the high tone repeats a whole
  number of times as fast as the main tone
scope: In sound, this is a high tone that goes with a main tone. It is not the maths sense about how a
  value changes, and not the word for being only part of a whole.
examples:
- The piano note was rich because each partial could be heard clearly.
- The second partial sounded much higher than the main note.
