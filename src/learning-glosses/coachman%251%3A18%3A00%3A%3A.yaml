simpleMeaning: a man whose work is driving a coach or carriage, a vehicle pulled by horses that carries
  people
scope: A man who drives a horse-pulled coach, not a driver of a car or bus and not a sports trainer.
examples:
- The coachman stopped the horses outside the house.
- Our coachman drove us through the town in his carriage.
