simpleMeaning: A carefully supported explanation of part of nature, built from an organized body of accepted
  knowledge that applies in many situations to explain a group of facts.
scope: This is not an untested guess or a single researcher's hunch; it is a widely accepted framework
  supported by evidence.
examples:
- Darwin's theory explains how living things change over time.
- The theory has been tested for more than a century.
