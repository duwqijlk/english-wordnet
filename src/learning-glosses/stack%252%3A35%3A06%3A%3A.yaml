simpleMeaning: to put things in a set order so you have a better chance to win
scope: This is fixing the order of things so you can win; it is not putting things in piles, and not covering
  something with piles.
examples:
- He stacked the cards so that he would get the best ones.
- They stacked the deck before the game to help their friend win.
