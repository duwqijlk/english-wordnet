schema: oewn-learning-gloss-v2
senseId: 'pulley_block%1:06:00::'
synsetId: 04026692-n
simpleMeaning: a wheel with a rope that runs in a cut round its edge, used to change the way a pull acts
  or where it acts
scope: A wheel with a rope in a cut round its edge that changes the way a pull acts; block, pulley and
  pulley-block are other names for this sense, not a plain wheel with no rope and not a rope on its own.
examples:
- The pulley block helped the sailors raise the sail.
- He threaded the rope through the pulley block and pulled.
