simpleMeaning: a person who says one group, or one group of people by race, should have power over all
  other groups
scope: This is a person who backs power for one group over all others; it is not a leader who already
  rules and not just a person who is proud of their own group.
examples:
- The supremacist gave speeches saying his race should rule over others.
- People in the town spoke against the supremacist and his ideas.
