simpleMeaning: one of the blood tubes that run beside the nerves of the spine
scope: A blood tube that runs beside a nerve of the spine; not an artery and not a nerve itself.
examples:
- The intervertebral vein drains blood from the muscles around the spine.
- Surgeons must take care not to cut an intervertebral vein.
