simpleMeaning: Cutting through the belly and womb brings the baby out of the mother, a birth once thought
  to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, abdominal delivery, caesarean, caesarean delivery, caesarean section,
  caesarian delivery, caesarian section, cesarean delivery, cesarean section, and cesarian section; a
  birth by surgery, not a birth the usual way.
examples:
- Her baby was born by cesarian.
- The cesarian took the baby out through a cut in the womb.
