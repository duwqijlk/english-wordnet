simpleMeaning: The everyday matters of earthly existence, as opposed to heaven and what comes after death.
scope: This is not the planet Earth, not the whole of human society, and not a particular area of activity
  or interest.
examples:
- He withdrew from the world to live in a monastery.
- Monks renounce the world and its pleasures.
