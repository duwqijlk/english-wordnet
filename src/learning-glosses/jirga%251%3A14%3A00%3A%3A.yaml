simpleMeaning: a Pashto word for a meeting of older men who make decisions
scope: In Pashto, a meeting of male elders who decide matters, not a court of law and not any meeting.
examples:
- Most criminal cases are handled by a tribal Jirga rather than by laws or police.
- The elders met in a Jirga to settle the land dispute.
