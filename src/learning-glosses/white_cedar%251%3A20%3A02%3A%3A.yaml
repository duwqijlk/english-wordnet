simpleMeaning: A small tree that keeps its leaves all year, from the east of North America, with tiny
  scale-like leaves on flat little branches.
scope: A small tree that keeps its leaves all year, from the east of North America; northern white cedar
  is another name for this sense, not the slow-growing tree of middle size on the east coast, which is
  another sense of the same word.
examples:
- The white cedar keeps its tiny scale-like leaves all year.
- A white cedar grows in the east of North America.
