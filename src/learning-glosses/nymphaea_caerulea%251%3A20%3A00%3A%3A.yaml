simpleMeaning: A blue water flower of Egypt that the Egyptians of long ago held holy.
scope: Also called blue lotus; a blue water flower held holy in Egypt, while the blue lotus of India is
  a different kind.
examples:
- Nymphaea caerulea floated on the still water, its blue flowers open to the sun.
- The Egyptians held Nymphaea caerulea holy and carved its blue flower on temple walls.
