simpleMeaning: A long-lived Eurasian cress growing mainly in springs and streams, with thick peppery leaves
  eaten in salads, cooked as a vegetable or garnish; also introduced in North America and beyond.
scope: The edible watercress used in salads, not garden cress or other cresses grown as herbs.
examples:
- Common watercress grows wild in cold springs and streams.
- Farmers now grow common watercress well beyond its native range.
