simpleMeaning: when gases from factories and works mix with water in the air, acids form, and the rain
  that falls carries them, above all sulfur dioxide and nitrogen oxides
scope: 'Also called acid rain: rain carrying acids from the air, not ordinary rain and not snow or hail.'
examples:
- Acid precipitation has damaged the forests of the north.
- The acid precipitation falling on the lake comes from gases given off far away.
