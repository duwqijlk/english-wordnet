senseId: 'paragrapher%1:18:00::'
synsetId: 10417393-n
simpleMeaning: Short pieces of writing, such as the ones a newspaper prints on its opinion page, are written
  by this person
scope: A person who writes short pieces of writing, not a person who writes whole books and not a person
  who writes news stories.
examples:
- The paragrapher sent in three short pieces for the opinion page.
- As a paragrapher, she wrote short notes for the newspaper.
