simpleMeaning: A green-all-year plant that creeps or climbs, with prickly zigzag stems, shiny leaves,
  and bunches of pale-green flowers; it grows from the Canary Islands to southern Europe, Ethiopia, and
  India.
scope: Also called rough bindweed; a climbing green plant with prickly stems, not a soft garden flower
  and not a tree.
examples:
- Smilax aspera climbs over the stone wall behind our house.
- The pale-green flowers of Smilax aspera open in spring.
