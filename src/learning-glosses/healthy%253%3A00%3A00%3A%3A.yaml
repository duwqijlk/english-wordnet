simpleMeaning: in good physical or mental condition, showing no illness or weakness
scope: This describes a person's or animal's condition, not something that keeps you well or a business
  that is doing well.
examples:
- She stayed healthy by walking every morning.
- The doctor said the baby was healthy and growing well.
