simpleMeaning: The coat round the thin core thread of some nerve fibres is made of a pale, greasy stuff.
scope: It is also called myelin and medulla, and it is the pale, greasy stuff that forms the coat round
  a nerve thread, not the thread itself.
examples:
- Myeline forms the coat round the nerve thread.
- The nerve thread was wrapped in myeline.
