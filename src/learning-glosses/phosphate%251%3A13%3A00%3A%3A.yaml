simpleMeaning: a drink with small bubbles, made with fruit syrup and a little phosphoric acid (a chemical
  with a sharp taste)
scope: This is a bubbly fruit drink, not a salt made from the same acid.
examples:
- At the old soda shop, she ordered a cherry phosphate.
- He drank a lemon phosphate on the hot afternoon.
