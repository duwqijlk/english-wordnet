simpleMeaning: numbers are written with a base in this way, and by agreement the dot that marks whole
  numbers from parts of a whole never moves from its place
scope: 'Also called fixed-point notation: numbers written with a base where the dot never moves from its
  place, not floating-point notation, where the dot can move.'
examples:
- The fixed-point representation system kept the dot in one place in all its numbers.
- Engineers chose a fixed-point representation system for the old machine.
