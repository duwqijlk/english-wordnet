simpleMeaning: chains of flowers hung in curves between two points, used to make a place look nice
scope: 'Also called festoonery: real chains of flowers hung in curves to make a place look nice, not a
  flower design carved or painted on a pot or building, and not a curtain hung in curves.'
examples:
- A festoon of roses hung between the two posts at the gate.
- They put a flower festoon across the front of the hall for the wedding.
