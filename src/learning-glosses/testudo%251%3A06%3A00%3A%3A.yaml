simpleMeaning: A movable cover that Roman soldiers held over their heads for shelter as they came up to
  the walls of a fort under siege
scope: A cover carried over Roman soldiers as they neared a fort's walls; it was held above them, not
  built as a roof.
examples:
- The soldiers raised the testudo over their heads as they neared the wall.
- Under the testudo, the Roman troops neared the walls of the fort.
