simpleMeaning: Gibbsite is the mineral name for this white stuff in crystal form, found in the ground.
scope: The names aluminium hydroxide, hydrated aluminium oxide, and hydrated aluminum oxide mean the same
  white crystal stuff.
examples:
- Tests showed the white crystals were aluminum hydroxide, the mineral gibbsite.
- The ground holds aluminum hydroxide in crystal form.
