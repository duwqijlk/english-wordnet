simpleMeaning: Something said that is true word by word, but is said in a clever way so that an unpleasant
  truth stays hidden
scope: 'Also called equivocation: words that are not false but hide an unpleasant truth. This is not failing
  to do a duty you should do, and not running away from a person or place.'
examples:
- When asked if he had taken the money, he gave an evasion that was true but hid the facts.
- Her evasion sounded true, but it left out the unpleasant part.
