simpleMeaning: a growth in the body made of young cells that have not yet grown into their final form
scope: 'Also called blastoma and embryonal carcinosarcoma: a growth made of young cells that have not
  yet grown into their final form, not a growth of fully grown cells and not a swelling from infection.'
examples:
- The doctors found a blastocytoma in the child's kidney.
- The blastocytoma was removed by surgery.
