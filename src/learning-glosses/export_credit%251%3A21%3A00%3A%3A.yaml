senseId: 'export_credit%1:21:00::'
synsetId: 13400279-n
simpleMeaning: an amount a buyer in one land gets a bank in the seller's land to hold ready to pay for
  goods sent from that land
scope: This is money set aside by a bank to pay for goods sent from another land, not money a seller lends
  to a buyer and not a payment made after the goods arrive.
examples:
- The firm used an export credit to pay for the machines it sent abroad.
- Her bank opened an export credit so the goods could leave port.
