simpleMeaning: To judge something by seeing how it stands against a fixed rule
scope: To judge something against a fixed rule, not to make it follow the rule and not to test it for
  faults.
examples:
- The tests standardized the pupils against a national level.
- They standardized each school's results against the national scores.
