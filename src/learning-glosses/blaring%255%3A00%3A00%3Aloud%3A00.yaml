simpleMeaning: so loud and sharp that it hurts the ears and is hard to ignore
scope: This is a loud, sharp sound that hurts the ears; blasting is another name for this sense, and it
  is not a soft sound or a loud noise that is pleasant.
examples:
- The blaring noise of trumpets filled the hall.
- We shut our ears against the blaring music from his car radio.
