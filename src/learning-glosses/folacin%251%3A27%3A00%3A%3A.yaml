simpleMeaning: a vitamin of the B group that the body must have so that cells can grow and make new cells
scope: 'Also called folic acid, folate, pteroylglutamic acid and pteroylmonoglutamic acid: a B vitamin
  needed for cells to grow and copy themselves, not vitamin C and not a mineral.'
examples:
- The book lists folacin among the B vitamins the body needs.
- Without folacin, cells cannot grow and make new cells.
