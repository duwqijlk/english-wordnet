simpleMeaning: A dream far more frightening than a plain bad dream marks this trouble, which comes in
  the deep stage of the night, when the eyes stay still.
scope: Also called pavor nocturnus, it is a trouble that brings dreams far worse than a plain bad dream,
  in the deep stage of the night.
examples:
- Her sleep terror disorder came in the deep stage of the night.
- His sleep terror disorder brought a dream far worse than a nightmare.
