simpleMeaning: the right, given in writing, for a person to use a motor vehicle
scope: 'Also called a driver''s licence, a driver''s license, or a driving license: the right, given in
  writing, for a person to use a motor vehicle, not a learner''s permit and not a vehicle''s registration.'
examples:
- He showed his driving licence at the car hire desk.
- You must carry your driving licence when you drive.
