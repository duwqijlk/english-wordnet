simpleMeaning: A blood vessel that branches off the main vessel at the base of the brain and carries blood
  to the inner ear
scope: This is a blood vessel that branches off the main vessel at the base of the brain to carry blood
  to the inner ear, also called artery of the labyrinth and internal auditory artery, not the main vessel
  itself and not a vein.
examples:
- The labyrinthine artery supplies blood to the inner ear.
- Damage to the labyrinthine artery can affect hearing and balance.
