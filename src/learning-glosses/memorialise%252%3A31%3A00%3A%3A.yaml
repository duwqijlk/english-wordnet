simpleMeaning: To act as a lasting sign that keeps a person or event in people's minds
scope: To serve as a lasting sign of a person or event, also called memorialize; not the other sense of
  speaking of someone in a formal act of honour.
examples:
- The statue memorialises the fallen soldiers of the town.
- The new bridge memorialises the workers who built it.
