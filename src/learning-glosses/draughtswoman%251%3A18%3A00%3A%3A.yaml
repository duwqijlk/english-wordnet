simpleMeaning: a female worker with skill who puts the plans for a building or a machine on paper
scope: 'Also called a draftswoman: a female worker who draws plans of buildings or machines, not someone
  who builds them and not someone who draws pictures for fun.'
examples:
- The draughtswoman drew up the plans for the new school.
- As a draughtswoman, she spent her days making plans for bridges and factories.
