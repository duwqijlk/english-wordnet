simpleMeaning: The V-shaped mark at one end of a drawn arrow that shows which way it faces.
scope: This is not a punctuation dot, a decimal dot, or the quality of a shape narrowing to a tip; it
  is part of an arrow symbol.
examples:
- The point of the arrow on the map faces north.
- Make the point of the arrow wider so its direction is clear.
