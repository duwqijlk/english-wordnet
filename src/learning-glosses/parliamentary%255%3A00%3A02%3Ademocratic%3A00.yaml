simpleMeaning: following the rules and ways of working of a group that meets to make laws or to talk and
  decide things
scope: This sense is about following the rules and ways of a group that meets to make laws. It is not
  the sense about a country run by such a group, and not the wide sense about parliament in general.
examples:
- Parliamentary procedure helps the meeting stay fair and in order.
- She learned parliamentary rules so the debate would run well.
