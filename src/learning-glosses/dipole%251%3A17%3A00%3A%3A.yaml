simpleMeaning: Two matching but opposite electric charges, or two opposite ends of a magnet, set a short
  way apart.
scope: Two equal and opposite charges or magnet ends set a short way apart, not the two-rod aerial sense
  and not a single charge.
examples:
- The two charges form a dipole across the small gap.
- A dipole has opposite charges at its two ends.
