simpleMeaning: able to make new cells and tissues, the groups of cells that make up parts of the body
scope: This is about living tissue that can make new cells, not the noun sense for a small unit of language
  and not the sense about shaping things.
examples:
- This formative layer in the bone makes new cells as the bone grows.
- The formative tissue at the tip of the root keeps making new cells.
