simpleMeaning: To make a thing fine, pure, and unmixed, by taking out dirt and matter that does not belong
scope: To make a thing fine, pure, and unmixed by taking out what does not belong, not to make it weaker
  by polishing or purifying.
examples:
- They refined the sugar until it was white and pure.
- The mill refined the oil to a clear liquid.
