simpleMeaning: Teeth for gears, grooves for shafts, and teeth for chain wheels come from this special
  kind of milling machine.
scope: Also called a hobbing machine, it is a special kind of milling machine that cuts teeth into gears,
  grooves into shafts, and teeth into chain wheels.
examples:
- The hobber cut the teeth of the gear.
- They used a hobber to cut grooves into the shaft.
