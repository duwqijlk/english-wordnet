simpleMeaning: Small and usually bright in colour, they feed at the top of warm fresh or salty water and
  bear young that swim; people often use them against mosquitoes.
scope: Also called poeciliid, poeciliid fish, and topminnow, it is one of the small fishes that bear live
  young instead of laying eggs.
examples:
- Live-bearers swim at the top of warm fresh water.
- A live-bearer gives birth to young that swim.
