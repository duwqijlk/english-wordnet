simpleMeaning: A fresh-water turtle from the United States and South America that people often raise to
  sell, with some young ones sold as pets
scope: This is a fresh-water turtle, also called a yellow-bellied terrapin; it is not a baseball pitch
  that curves a little, and not a person who slips or slides.
examples:
- We saw a slider resting on a rock by the river.
- Farmers raise young sliders and sell some of them as pets.
