simpleMeaning: A false hair piece for men, in style in the 1600s and 1700s.
scope: A false hair piece for men, in style in the 1600s and 1700s, also called a peruke, not a false
  hair piece for women and not a hat.
examples:
- The judge wore a periwig in the old court.
- A periwig was the mark of a fine man in 1700.
