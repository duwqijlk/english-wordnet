simpleMeaning: to copy someone or something in a funny or mocking way
scope: This is to copy someone or something in a funny or mocking way, not to leave the ground in a plane
  and not to remove clothes.
examples:
- The comic took off the mayor's slow speech and made the crowd laugh.
- She can take off her teacher so well that we all laugh.
