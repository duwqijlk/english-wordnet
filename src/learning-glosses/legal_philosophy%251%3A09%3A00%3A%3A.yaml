simpleMeaning: This thinking looks at why judges decide as they do and at the rules a society sets
scope: 'Also called law and jurisprudence: thinking about the rules a society sets and why courts decide
  as they do, not a rule in one court case and not the study of right and wrong in general.'
examples:
- Her legal philosophy class asked why judges follow past rulings.
- He wrote a book on legal philosophy and the roots of court decisions.
