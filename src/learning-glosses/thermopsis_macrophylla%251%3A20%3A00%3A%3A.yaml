simpleMeaning: A bushy herb of the western United States, with yellow flowers like peas.
scope: A bushy herb of the western United States with yellow flowers like peas, also called the false
  lupine, the golden pea and the yellow pea; it is not a true lupine and not a pea grown for food.
examples:
- A Thermopsis macrophylla grows in the western United States.
- The Thermopsis macrophylla has yellow flowers like peas.
