simpleMeaning: A short cloth, usually thin enough to see through, hung from a rod fixed halfway up a window.
scope: A short cloth hung halfway up a window, not a full-length cloth and not a blind.
examples:
- She hung a cafe curtain halfway up the kitchen window.
- The cafe curtain lets light in while hiding the room.
