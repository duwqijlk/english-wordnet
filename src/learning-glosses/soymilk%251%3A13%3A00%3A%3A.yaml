simpleMeaning: Used in some food for babies and in making tofu, this drink stands in for dairy, made from
  flour of the beans it is named for and water.
scope: It is also called soya milk and soybean milk, a drink that stands in for dairy and not the white
  liquid that comes from cows.
examples:
- The baby's food was made with soymilk.
- Tofu was made with soymilk.
