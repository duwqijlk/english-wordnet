simpleMeaning: A poison made by a germ that causes strong stomach cramps and loose bowels starting 8 to
  22 hours after eating food full of large numbers of the germs.
scope: 'Also called epsilon toxin: a poison made by a germ in food, not a stomach bug caught from a sick
  person and not food poisoning from a virus.'
examples:
- The Clostridium perfringens epsilon toxin caused cramps hours after the meal.
- Doctors traced the outbreak to Clostridium perfringens epsilon toxin in the meat.
