simpleMeaning: Of the old high-rank families whose rank came by birth and passed to their children, with
  roots most of all in feudal times, the old time of lords and land
scope: This is the word for high birth and old high rank, not the word for one titled person.
examples:
- She came from a noble family with land held for many years.
- The noble house had held its rank since feudal times.
