simpleMeaning: The lower part of the rising large gut, the pouch where the large gut starts, the appendix,
  and the end of the small gut all drain through this blood tube.
scope: Also called ileocolic vein, this blood tube serves the end of the small gut, the appendix, and
  the lower large gut.
examples:
- Blood from the appendix leaves through the vena ileocolica.
- Blood from the lower part of the large gut leaves through the vena ileocolica.
