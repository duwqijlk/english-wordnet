senseId: 'acetabulum%1:08:00::'
synsetId: 05603979-n
simpleMeaning: The hollow in the hip bone, shaped like a cup, into which the top of the thigh bone fits
  to make a joint that turns in all directions.
scope: Also called cotyloid cavity, this is the cup-shaped hollow in the hip bone where the thigh bone
  fits, not the ball at the top of the thigh bone itself.
examples:
- The head of the thigh bone fits into the acetabulum.
- A break in the acetabulum can stop the hip joint from turning.
