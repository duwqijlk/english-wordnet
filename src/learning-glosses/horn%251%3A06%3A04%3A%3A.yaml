simpleMeaning: the high front part of a western saddle, usually made of metal covered with leather
scope: This is the high front part of a western saddle. It is not the hard growth on an animal's head
  and not a car part that makes a warning sound.
examples:
- She held the horn of the saddle as the horse ran.
- He tied the rope around the saddle horn.
