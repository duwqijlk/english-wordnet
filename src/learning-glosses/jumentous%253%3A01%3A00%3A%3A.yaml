simpleMeaning: Having a strong smell like that of a horse, donkey or other animal that carries loads
scope: A strong smell like that of an animal that carries loads; not a faint smell and not the smell of
  a wild animal.
examples:
- The jumentous smell of the stable hung in the air.
- The doctor noted the jumentous smell of the patient's urine.
