senseId: 'right_of_first_publication%1:10:00::'
synsetId: 06484839-n
simpleMeaning: By this paper, the printing and selling of a book, song, or work of art belong to one person
  alone.
scope: Also called copyright, this paper keeps the printing and selling of a book, song, or work of art
  in one person's hands.
examples:
- The right of first publication kept others from printing the book.
- The right of first publication belonged to the writer.
