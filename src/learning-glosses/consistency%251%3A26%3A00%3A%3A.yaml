simpleMeaning: when what is said or written fits together and agrees with the facts, with no part going
  against another
scope: When what is said fits together and fits the facts, not a person's steady way of acting and not
  a logic system whose rules never clash.
examples:
- His rambling argument lacked any consistency.
- 'The witness''s story had consistency: every part of it matched the facts.'
