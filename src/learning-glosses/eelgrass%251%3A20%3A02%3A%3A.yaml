simpleMeaning: a plant that grows under water, with long flat leaves like ribbons, found in Europe, Asia
  and Africa, and in Australia
scope: A plant that grows under water, with long flat leaves like ribbons, found in Europe, Asia and Africa,
  and in Australia, not the North Atlantic eelgrass with very long narrow leaves.
examples:
- Eelgrass grows under the water off the coast of Australia.
- The eelgrass in the bay has long flat leaves like ribbons.
