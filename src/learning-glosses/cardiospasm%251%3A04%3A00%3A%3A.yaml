senseId: 'cardiospasm%1:04:00::'
synsetId: 00227578-n
simpleMeaning: A sudden tightening of the ring of muscle between the food pipe and the stomach, so that
  it fails to open when you swallow and food cannot pass through.
scope: A spasm of the muscle valve where the food pipe meets the stomach; despite the name, not a heart
  condition.
examples:
- Cardiospasm made swallowing difficult because the valve at the bottom of his food pipe would not open.
- Doctors treated her cardiospasm by stretching the tight ring of muscle above her stomach.
