simpleMeaning: One of the two small back wings of a fly or other two-winged insect, used to keep steady
  in flight
scope: One of the two small back wings of a fly, used to keep steady in flight, not a rope for a horse
  and not a rope for hanging.
examples:
- The halter of the fly beats fast to keep it steady.
- Flies use their halters to keep their balance in the air.
