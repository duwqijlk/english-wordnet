simpleMeaning: Land where grass grows over all or most of the ground, or where grass or alfalfa (a plant
  grown for animal food) is grown to make hay
scope: This is land covered with grass, including a field where grass is grown to make hay; it is not
  a wood and not a garden.
examples:
- Cows ate grass in the wide meadow beside the river.
- They cut the grass in the meadow to make hay.
