simpleMeaning: A big tree from middle and south Europe and Asia Minor that loses its leaves in winter,
  with long narrow leaves that have pointed lobes.
scope: Also called turkey oak and European turkey oak; a big tree from middle and south Europe that loses
  its leaves in winter, not a small evergreen tree and not a tree of North America.
examples:
- Quercus cerris drops its leaves each winter.
- The Quercus cerris in the park has long narrow leaves with pointed lobes.
