simpleMeaning: Three smaller bones joined as one spread out to make one side of the lower body frame.
scope: This is the bone that makes up one side of the lower body frame, also called a hipbone, and it
  is not one of the three smaller bones on its own.
examples:
- The innominate bone was broken.
- They counted three smaller bones in the innominate bone.
