simpleMeaning: In the warm waters of the tropical Atlantic and the Caribbean lives a food fish with a
  wide gold stripe along each side and on its tail.
scope: Yellowtail is another name for this warm-water food fish of the tropical Atlantic and the Caribbean,
  marked by the wide gold stripe along its sides and tail.
examples:
- We ate yellowtail snapper with rice for supper.
- Fishermen in the Caribbean catch yellowtail snapper for the table.
