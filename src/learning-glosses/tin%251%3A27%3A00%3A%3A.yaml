simpleMeaning: A silver-grey metal that can be hammered flat and does not rust, mixed with other metals
  and spread over them to stop rust, got mostly from cassiterite as an oxide.
scope: This is a silver-grey metal that can be hammered flat and does not rust, also called atomic number
  50 and Sn, not a can for food and not a thin sheet.
examples:
- Tin does not rust.
- They coated the pan with tin.
