simpleMeaning: acting for someone or speaking for them, usually said as 'on' plus this word and 'of',
  rather than 'in' plus this word and 'of'
scope: This is about acting or speaking for someone in their place, not about doing something for their
  good.
examples:
- The guardian signed the contract on behalf of the minor child.
- This letter is written on behalf of my client.
