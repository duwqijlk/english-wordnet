simpleMeaning: A bright shining patch high in the sky, showing many colours, that may be seen when the
  sun is just below the horizon
scope: 'Nacreous cloud is another name for this sense: a bright shining patch high in the sky showing
  many colours, not an ordinary white cloud and not the northern lights.'
examples:
- A mother-of-pearl cloud shone in the evening sky.
- We saw a mother-of-pearl cloud as the sun went down.
