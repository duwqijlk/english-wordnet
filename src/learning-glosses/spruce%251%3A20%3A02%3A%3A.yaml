simpleMeaning: light, soft, fairly strong wood from a certain kind of tree, used especially for beams
  and wood work in buildings
scope: This is the wood from the tree, not the tree itself and not neat and fashionable in dress and manners.
examples:
- The beams were made of spruce.
- They used spruce for the doors and window frames.
