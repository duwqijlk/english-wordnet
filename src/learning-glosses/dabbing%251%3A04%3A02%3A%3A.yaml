simpleMeaning: A dance move in which the dancer drops the head while lifting one arm and elbow up, in
  a move said to look like a sneeze
scope: A dance move said to look like a sneeze; dab is another name for this sense, not the drug sense
  of dabbing.
examples:
- The dancer ended his routine with a dabbing move.
- She was dabbing to the music on the dance floor.
