simpleMeaning: A low-growing perennial herb from Europe, now also found elsewhere, with heart-shaped leaves
  and buttercup-like yellow flowers; its tuberous roots have been used in a poultice to ease piles.
scope: This is the low European herb with heart-shaped leaves and yellow buttercup-like flowers; lesser
  celandine is another name for the same plant, not a separate species.
examples:
- Pilewort flowers before the trees come into leaf.
- Old herbals recommended pilewort for painful swellings.
