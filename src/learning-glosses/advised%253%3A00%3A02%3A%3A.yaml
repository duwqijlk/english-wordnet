simpleMeaning: made after careful thought first or after hearing what others think is best
scope: This sense describes a choice or act made after careful thought or after hearing what others think
  is best. It is not a quick choice made with no thought at all.
examples:
- It was a well-advised move to check the facts before signing.
- His well-advised decision to wait gave everyone time to think.
