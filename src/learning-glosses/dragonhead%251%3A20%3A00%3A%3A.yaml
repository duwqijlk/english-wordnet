simpleMeaning: Its leaves are long and narrow, edged with sharp teeth, and its flowers stand in spikes
  of blue to violet on an herb of America
scope: It is also called dragon's head, a plant of America whose flowers grow in spikes of blue to violet.
examples:
- The dragonhead had spikes of blue flowers.
- The dragonhead's leaves were long and narrow, with sharp teeth along the edges.
