schema: oewn-learning-gloss-v2
senseId: 'major_tranquillizer%1:06:00::'
synsetId: 03719275-n
simpleMeaning: A person whose mind has lost touch with what is real is calmed by this drug, given when
  calm is wanted
scope: Also called antipsychotic, antipsychotic agent, antipsychotic drug, neuroleptic, neuroleptic agent,
  neuroleptic drug, major tranquilizer and major tranquilliser, this is a calming drug for a person whose
  mind has lost touch with what is real, not a drug that puts a person to sleep and not a drug for worry
  alone.
examples:
- He was given a major tranquillizer after his mind lost touch with what was real.
- A major tranquillizer helped calm the patient through the night.
