scope: A green salad plant with crisp, tightly packed, pale green leaves in a firm head, also called crisphead
  lettuce and iceberg; not a loose-leaf salad plant and not cabbage.
examples:
- She bought a head of iceberg lettuce for the salad.
- The iceberg lettuce stayed crisp in the fridge all week.
