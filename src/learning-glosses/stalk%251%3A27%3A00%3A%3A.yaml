simpleMeaning: 'The bits left after seed is taken out: the seed coats and small bits of stem or leaves'
scope: Also called straw, this is the material left after seeds are taken out, not the tall green stem
  that holds a plant up, and not the act of following someone.
examples:
- After threshing, a pile of stalk lay beside the barn.
- They used the stalk as bedding for the animals.
