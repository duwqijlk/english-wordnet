simpleMeaning: Of lichens, having a thin hard skin that sticks fast to the surface on which it grows
scope: This word says a lichen forms a thin skin stuck to its surface, not a leafy growth and not a free-standing
  plant.
examples:
- Crustose lichens cover the old stone wall.
- The crustose growth clung to the bare rock.
