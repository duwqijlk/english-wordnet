senseId: 'synchronize%2:30:00::'
synsetId: 00394859-v
simpleMeaning: to make things happen at the same time, and to change their time or the way they are done
  so they fit together
scope: 'Also called sync: making things happen at the same time and changing them to fit, not just arranging
  or showing events as if they happen together.'
examples:
- The dancers synchronized their steps with the music.
- Please synchronize the clocks so they all show the same time.
