simpleMeaning: to make a person or thing seem higher and more perfect; the word is linked to the Bible
  story of Christ's change
scope: 'Also called glorify: making something seem higher or more perfect in the mind, not changing how
  it really looks.'
examples:
- In the poem, the writer transfigures a common man into a saint in people's minds.
- The book transfigures a simple act of kindness into something holy and perfect.
