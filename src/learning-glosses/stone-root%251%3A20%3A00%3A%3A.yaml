simpleMeaning: In the eastern United States grows a tall, strong-smelling plant that lives year after
  year, with pointed leaves edged with sharp teeth and loose sprays of pale yellow flowers.
scope: 'Also called horse balm, horseweed, richweed, stone root, and stoneroot: a tall, strong-smelling
  plant of the eastern United States that lives year after year, not a plant that lives only one year.'
examples:
- The stone-root has loose sprays of pale yellow flowers.
- Stone-root grows tall in the eastern United States.
