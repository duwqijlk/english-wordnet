simpleMeaning: A clerk or office worker thought to care too much about keeping spending under tight control
scope: A dismissive name for a clerk or office worker seen as too keen on controlling spending, not a
  plain accountant and not an auditor.
examples:
- The bean counter refused to sign off the trip until every receipt was checked.
- Don't be such a bean counter; the party cost very little.
