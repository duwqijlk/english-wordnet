simpleMeaning: The middle part of a cell breaks apart and dissolves when the cell dies
scope: The breaking apart of a cell's middle part as the cell dies, not the splitting of that part when
  a cell divides and not the part itself.
examples:
- After the cell died, karyolysis set in and the middle part broke apart.
- Under the microscope, they could see karyolysis in the dead cells.
