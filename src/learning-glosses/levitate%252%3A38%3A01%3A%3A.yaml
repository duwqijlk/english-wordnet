senseId: 'levitate%2:38:01::'
synsetId: 01948325-v
simpleMeaning: to make a person or thing rise into the air and float there, as if the pull that draws
  things to the ground did not hold it
scope: This means making a person or thing rise and float in the air, not a person or thing staying up
  in the air on its own.
examples:
- The magician levitated the woman above the stage.
- In the film, she levitates a cup just by looking at it.
