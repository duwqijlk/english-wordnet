simpleMeaning: Having parts that fit together in a neat, logical way that also looks or feels pleasing.
scope: This describes how the parts of a whole fit together in a design or work of art; it is not about
  items following a rule-based sequence, and not merely about things being put in some arrangement.
examples:
- The essay has an ordered structure, with each part leading logically into the next.
- The painting's ordered composition keeps the eye moving smoothly.
