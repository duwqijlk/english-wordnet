simpleMeaning: using tiny living things, viruses, or poisons to kill people and animals or spoil food
scope: 'Also called bioattack, biologic attack, and biological warfare: using germs, viruses, or poisons
  to kill people and animals or spoil food, not guarding against such harm and not a chemical attack.'
examples:
- The town feared a biological attack on its water supply.
- A biological attack can spread sickness through food and animals.
