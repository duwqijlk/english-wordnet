simpleMeaning: a tuna that schools in the ocean, much like oceanic bonito, if not the same fish, growing
  to 75 pounds, worth much in the Pacific but less in the Atlantic
scope: 'Another name for a skipjack: a tuna that schools in the open sea, not a yellowfin tuna and not
  a bluefin tuna.'
examples:
- A skipjack tuna darted through the school near the boat.
- The cannery paid well for skipjack tuna from the Pacific.
