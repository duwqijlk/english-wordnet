senseId: grand%5:00:00:dignified:00
synsetId: 00755631-s
simpleMeaning: Describing a person's look or conduct as dignified and suited to someone of high standing.
scope: A person's dignified, imposing look or manner such as suits a person of high rank only; not behavior
  that is ambitious in scale, not the manner of a lord, not showy wealth or superior quality, not something
  extraordinarily good, not high moral or intellectual worth, not great physical size, not the most magnificent
  in decoration, not the number one thousand, and not the piano.
examples:
- The old general still had a grand bearing that made younger officers straighten up.
- There was something grand about the way she walked into the room, as if everyone should stand.
