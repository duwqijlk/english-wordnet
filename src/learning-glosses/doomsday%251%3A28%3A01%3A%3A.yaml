synsetId: 15196354-n
simpleMeaning: In the New Testament, the day at the end of time after Armageddon (the last great fight),
  when God will decide fates by the good and evil of earthly life
scope: This is the end-of-time day in the New Testament, also called crack of doom, day of reckoning,
  end of the world, and eschaton; it is not the other sense of a bad or terrible fate for a person.
examples:
- In the story, people waited in fear for doomsday, when God would judge them all.
- Some early Christians thought doomsday would come soon after the last great fight.
