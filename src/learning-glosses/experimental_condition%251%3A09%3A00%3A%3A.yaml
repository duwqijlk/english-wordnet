senseId: 'experimental_condition%1:09:00::'
synsetId: 05806871-n
simpleMeaning: In an experiment, the step that is changed on purpose so its effect can be judged by comparing
  it with a step left unchanged.
scope: In an experiment, the step changed on purpose to judge its effect; also called a condition, not
  the step left unchanged and not the whole experiment.
examples:
- The experimental condition gave the plants extra light.
- In the experimental condition, the dose was doubled.
