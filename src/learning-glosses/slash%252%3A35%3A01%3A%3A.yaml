simpleMeaning: to cut with wide sweeping strokes, as with an ax or a long heavy knife
scope: To cut with wide sweeping strokes, not a cut made with a blade, not beating with a whip, and not
  an open patch of forest land.
examples:
- He slashed at the tall grass with his blade.
- The workers slashed a path through the thick bushes.
