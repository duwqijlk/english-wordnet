simpleMeaning: a tall tree with long feather-like leaves that grows in the far south of Florida and in
  Cuba
scope: A tall tree with long feather-like leaves that grows in southern Florida and Cuba, not a coconut
  tree and not a short garden palm.
examples:
- A royal palm stood tall beside the road in Miami.
- The royal palm in the garden drops its long leaves after a storm.
