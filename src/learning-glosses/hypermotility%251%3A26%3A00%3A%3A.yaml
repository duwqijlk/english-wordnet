simpleMeaning: Too much movement, above all too much movement of the gut, the tube that carries food through
  the body.
scope: Too much movement of the body, above all of the gut, not too little movement and not a single sudden
  movement.
examples:
- The doctor blamed her stomach pain on hypermotility of the gut.
- Hypermotility made the food pass through too fast.
