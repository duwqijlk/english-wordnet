simpleMeaning: The amount of petrol or diesel a vehicle burns to cover 100 km.
scope: Also called liters per hundred kilometers, it is a measure of fuel use, not a measure of speed.
examples:
- Litres per hundred kilometres tell us how much fuel the vehicle burns.
- The list gives litres per hundred kilometres for each vehicle.
