simpleMeaning: to put a thought or feeling into words, or to make it known with a cry, shout, or other
  noise
scope: 'Another name for express, utter, verbalize, and give tongue to: to put feelings into words or
  sounds, not to write them down and not to keep them to yourself.'
examples:
- She verbalised her anger in a loud shout.
- He verbalised his fear with a cry when the door slammed.
