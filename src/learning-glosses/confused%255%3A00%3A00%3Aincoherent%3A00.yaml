simpleMeaning: not following in a clear order, with parts that do not join up well
scope: About talk, thoughts or a story that does not follow in order, also called scattered. Not about
  things mixed up with no order, and not about a person who is lost.
examples:
- He gave a confused set of instructions that jumped from step three back to step one.
- She told a confused story that kept changing the order of events.
