simpleMeaning: A fungus with a reddish violet cap that feels smooth and slimy, with close violet gills;
  every part turns dark violet when bruised.
scope: Also called Cortinarius mutabilis; a fungus with a reddish violet cap that feels smooth and slimy
  and close violet gills, every part turning dark violet when bruised.
examples:
- The purple-staining Cortinarius bruised dark violet where I touched it.
- We found a purple-staining Cortinarius with a slimy cap under the pines.
