simpleMeaning: a formal church curse that says a person can no longer be part of the church
scope: A formal church curse that shuts a person out, not an informal angry wish and not just a word for
  something hated.
examples:
- The priest read out the anathema against the leader who had broken church law.
- The church declared an anathema and shut him out from its services.
