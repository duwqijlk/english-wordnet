simpleMeaning: A white solid rock-like stuff found in nature as periclase, used as a source of the metal
  that burns with a bright white light
scope: A white solid rock-like stuff found in nature as periclase, not any white powder and not a metal
  itself; magnesia and periclase are other names for this sense.
examples:
- Magnesium oxide is used to line furnaces that run very hot.
- The white magnesium oxide powder came from the mineral periclase.
