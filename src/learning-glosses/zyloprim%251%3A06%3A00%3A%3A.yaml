simpleMeaning: A drug used to treat gout and other ills in which too much uric acid builds up in the body.
scope: 'Also called allopurinol: a drug for gout and other ills where too much uric acid builds up, not
  a painkiller and not a drug for low uric acid.'
examples:
- The doctor gave her Zyloprim for her gout.
- Zyloprim helps when too much uric acid builds up.
