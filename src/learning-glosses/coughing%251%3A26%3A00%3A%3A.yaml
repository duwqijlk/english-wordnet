simpleMeaning: A sudden loud burst of air from the lungs that clears the breathing passages, a common
  sign of upper-airway infection, bronchitis, pneumonia or tuberculosis.
scope: 'Another name for cough: the sudden burst of air clearing the airways; not the act of forcing air
  out (the verb), and not a disease.'
examples:
- Her coughing grew worse whenever she lay down.
- The coughing from the next bed kept him awake.
