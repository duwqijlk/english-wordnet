simpleMeaning: A lever with a sharp point that rests on a fixed spot, used to roll heavy wheels
scope: A tool with a sharp point that rests on a fixed spot to roll heavy wheels, not a crowbar for pulling
  nails and not a plain metal rod.
examples:
- He used a pinch bar to roll the wheel into place.
- The pinch bar rested on a stone as he moved the wheel.
