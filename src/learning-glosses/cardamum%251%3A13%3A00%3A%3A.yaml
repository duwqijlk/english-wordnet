simpleMeaning: People use these sweet-smelling seeds to flavour food, as they do cinnamon and cloves,
  above all in pickles and barbecue sauces.
scope: 'Also called cardamom and cardamon: the seeds used to season pickles and sauces, not the herb they
  come from.'
examples:
- Cardamum seeds went into the barbecue sauce.
- A pinch of cardamum gave the pickles a warm smell.
