simpleMeaning: a state of wild disturbance that leaves people hurt and things destroyed.
scope: This is not a single violent act and not the sheer force of something; it names a turbulent condition
  that brings injuries and destruction.
examples:
- The violence that followed the election left shops burned and many people injured.
- After the uprising, a long period of violence left the region in ruins.
