simpleMeaning: refusing to believe, or questioning, the main beliefs held by a group, especially a religion
scope: 'About religion in particular: refusing to believe or questioning its main beliefs, not just doubting
  one claim or a person''s story in everyday life.'
examples:
- He took a skeptical view of the church's teaching about miracles.
- She grew skeptical about the religion she had been raised in.
