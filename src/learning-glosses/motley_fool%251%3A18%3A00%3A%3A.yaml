simpleMeaning: A paid clown who amused a king or a lord in the Middle Ages.
scope: Also called fool, and jester is another name for this sense; a paid clown who amused a king or
  a lord in the Middle Ages, not a modern circus clown and not a servant.
examples:
- The motley fool made the king laugh at the feast.
- In the play, a motley fool sings for the lord.
