simpleMeaning: A small tree from warm parts of America. It is bush-like. People grow it in many warm places
  for its sweet round yellow fruit.
scope: This is the tree itself, also called guava bush and true guava, not the fruit it grows.
examples:
- The small guava tree in the yard gives sweet yellow fruit.
- Farmers grow guava trees in warm places for the fruit.
