simpleMeaning: having a serious illness of the mind, so the mind does not work in a normal way
scope: Also called sick, crazy, mad, disturbed, unbalanced and demented. It means a serious illness of
  the mind, not just being angry or upset.
examples:
- After years alone in the house, the old man seemed quite unhinged.
- Her unhinged talk and wild acts worried the whole family.
