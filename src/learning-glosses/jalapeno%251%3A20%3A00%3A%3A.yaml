simpleMeaning: a plant that grows long peppers that get narrow at one end, taste very hot, and are usually
  red
scope: 'Also called cayenne: the plant that grows these hot peppers; not the pepper itself, which is picked
  and eaten.'
examples:
- The jalapeno in her garden grew tall and was covered in long red peppers.
- One jalapeno plant can give you many hot peppers in a single summer.
