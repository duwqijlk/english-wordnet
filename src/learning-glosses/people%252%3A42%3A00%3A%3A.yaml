simpleMeaning: To supply a place with inhabitants.
scope: Literary and usually passive, of supplying inhabitants to a place rather than crowding or filling
  it; it is not the noun for persons.
examples:
- The new province was peopled with veterans of the legion.
- The valley had been peopled by farmers for centuries.
