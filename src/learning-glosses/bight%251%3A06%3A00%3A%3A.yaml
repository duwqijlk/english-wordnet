simpleMeaning: The loose middle part of a rope, not either of its ends.
scope: The loose middle part of a rope, not either of its ends, not a wide bay cut into the shore, not
  a bend or curve, especially one in a coastline, and not the verb use for fastening with such a loop.
examples:
- He took hold of the bight of the rope and pulled it tight.
- The bight of the rope hung loose between the two posts.
