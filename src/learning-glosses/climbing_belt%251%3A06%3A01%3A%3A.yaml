simpleMeaning: A rope loop worn round the body, at times with a seat, used by people who tend wild bees
  to go up trees and reach the nests.
scope: A rope loop worn round the body for going up trees to tend wild bees, not a rope used to climb
  rocks and not the suit that guards a bee keeper.
examples:
- He fastened the climbing belt round his waist before going up the tree.
- The climbing belt let her reach the wild bees' nest safely.
