simpleMeaning: The blood tube under the collar bone is what this blood tube turns into, carrying on from
  the inner-arm and upper-arm blood tubes.
scope: Also called axillary vein, this blood tube turns into the blood tube under the collar bone, carrying
  on from the inner-arm and upper-arm blood tubes rather than being one of them.
examples:
- The vena axillaris carries on from the basilic and brachial veins.
- Blood in the vena axillaris flows on to become the subclavian vein.
