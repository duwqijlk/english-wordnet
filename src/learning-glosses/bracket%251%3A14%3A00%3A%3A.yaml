simpleMeaning: a group or kind of things that fall inside set limits
scope: A group of things inside set limits, not the < > or [ ] marks on a page and not the act of putting
  things into brackets.
examples:
- People in the higher income bracket pay more tax.
- The age bracket for the class is ten to twelve.
