simpleMeaning: a record that shows how much is still owed for goods and work bought on credit
scope: This is one record of money owed, also called payable; not the full set of a debtor's accounts
  and not money owed to the firm.
examples:
- The account payable showed how much we still owed the supplier.
- She checked the account payable before paying the bill.
