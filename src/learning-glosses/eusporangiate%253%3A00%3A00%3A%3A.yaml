simpleMeaning: A fern whose spore cases start from a group of cells in the outer skin of the plant
scope: Of ferns, with spore cases that start from a group of surface cells, not ferns whose spore cases
  start from a single cell.
examples:
- The eusporangiate ferns in the collection have spore cases that grow from groups of surface cells.
- The botanist classed the plant as eusporangiate because its spore cases arose from a group of skin cells.
