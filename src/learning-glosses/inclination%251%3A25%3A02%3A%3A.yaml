simpleMeaning: In astronomy, the angle between the flat surface of an orbit and the flat surface of the
  earth's path round the sun, given in degrees.
scope: In astronomy, the angle between the flat surface of an orbit and the flat surface of the earth's
  path round the sun; not the angle of a magnetic needle, and not a liking for something.
examples:
- The inclination of the planet's orbit is about seven degrees.
- They worked out the inclination from the path the comet takes.
