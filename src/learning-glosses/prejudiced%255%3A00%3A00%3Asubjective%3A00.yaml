simpleMeaning: coming from a person's feelings and unfair ideas that were formed before knowing the facts
scope: This describes something that comes from a person's feelings and unfair fixed ideas, not the sense
  that names a person who is unfair in the beliefs he holds.
examples:
- His prejudiced view of the plan came from anger, not from the facts.
- She gave a prejudiced answer based on how she felt about the people.
