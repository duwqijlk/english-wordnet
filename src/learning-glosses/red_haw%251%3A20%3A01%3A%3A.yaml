simpleMeaning: Short, wool-like hairs thickly coat the stems and leaves of this North American thorn tree
  with rose-tinted fruit.
scope: Also called downy haw, this is the North American thorn tree whose stems and leaves are thickly
  coated with short, wool-like hairs, not the kind with thick bunches of pink and rose-tinted blooms.
examples:
- The red haw bears rose-tinted fruit.
- Short, wool-like hairs coat the stems of the red haw.
