simpleMeaning: A meat-eating plant of the coastal plains of the Carolinas, with leaves that feel touch,
  fold shut on hinges, and have stiff hairs at the edges, closing to trap insects.
scope: A meat-eating plant whose leaves fold shut to trap insects, also called a Venus's flytrap or Venus's
  flytraps.
examples:
- The Dionaea muscipula snapped shut on a fly.
- A Dionaea muscipula leaf closed around the insect in seconds.
