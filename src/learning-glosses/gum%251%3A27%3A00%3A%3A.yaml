simpleMeaning: a sticky stuff from some plants that can mix into water; it is soft and thick when wet
  but gets hard when it dries
scope: This is a sticky plant stuff, not the flesh around the teeth and not a tree that gives this stuff.
examples:
- The plant gum dried into hard drops on the stem.
- This gum goes soft in water and hard when dry.
