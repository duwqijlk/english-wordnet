senseId: 'rigidity%1:07:00::'
synsetId: 05030907-n
simpleMeaning: the way a thing is stiff and does not bend easily
scope: This sense is about a thing being stiff and not bending easily; it is not the sense about being
  very strict and severe and not changing.
examples:
- The rigidity of the steel beam keeps the bridge from bending.
- Because of its rigidity, the thick board snapped instead of bending.
