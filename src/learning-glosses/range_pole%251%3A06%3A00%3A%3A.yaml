simpleMeaning: Surveyors line up their sights on a straight rod marked with bands that take turns in red
  and white, each band one foot wide.
scope: Also called a ranging pole and a flagpole, it is the striped rod that surveyors use to line up
  their sights.
examples:
- The surveyor set up the range pole.
- We sighted along the range pole to check the line.
