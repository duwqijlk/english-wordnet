simpleMeaning: Low plants put in deep shade or on a steep slope where grass is hard to grow.
scope: 'Also called groundcover: low plants put in shade or on steep slopes where grass is hard to grow,
  not a lawn and not a tall hedge.'
examples:
- Ivy makes good ground cover under the big trees.
- We planted ground cover on the steep bank behind the house.
