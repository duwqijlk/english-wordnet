simpleMeaning: A honeysuckle of Europe that winds round other plants, with sweet-smelling red and yellow-white
  flowers.
scope: A European honeysuckle that winds round other plants, with sweet-smelling red and yellow-white
  flowers; not the common North American vine with compound leaves and bluish-black berry-like fruit.
examples:
- The woodbine climbed the fence, its flowers sweet in the evening.
- Bees visited the woodbine all through the summer.
