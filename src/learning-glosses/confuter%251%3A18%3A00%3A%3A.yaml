simpleMeaning: A person in a debate who shows a claim is wrong by giving proof or reasons against it
scope: A person in a debate who shows a claim is wrong, also called a disprover, rebutter, and refuter,
  not a person who merely disagrees and not a judge.
examples:
- The confuter answered each point with facts.
- As a skilled confuter, she won the debate.
