simpleMeaning: In verse, lines made by counting the syllables in each line, not by the pattern of stresses
  or long and short syllables.
scope: In verse, this means lines built on the number of syllables, not metrical verse and not free verse.
examples:
- The poem was syllabic, with ten syllables in each line.
- Syllabic verse counts syllables, not stresses.
