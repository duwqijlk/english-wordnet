simpleMeaning: to provide people or places with something they need, especially by giving it out.
scope: This is the act of giving or making something available, not the amount kept in stock and not the
  activity viewed as a whole.
examples:
- The company supplies fresh bread to local shops.
- Volunteers supplied blankets to the shelter.
