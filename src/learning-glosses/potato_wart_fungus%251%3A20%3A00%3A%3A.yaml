simpleMeaning: A tiny living thing that makes a lumpy growth disease in the round underground parts of
  the food plant
scope: This is a tiny living thing that causes a lumpy growth disease in the round underground parts of
  the food plant, not the food plant itself.
examples:
- The potato wart fungus made lumps on the tubers.
- Farmers fear the potato wart fungus because it spoils the crop.
