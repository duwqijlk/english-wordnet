simpleMeaning: a made-up place of great wealth and chance, looked for in South America by explorers of
  the 1500s
scope: A made-up place of great wealth and chance, not a real town in South America and not a gold mine.
examples:
- The explorers searched for eldorado in South America.
- To them, eldorado was a city of gold that did not exist.
