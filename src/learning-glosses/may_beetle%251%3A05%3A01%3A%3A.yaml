simpleMeaning: Any one of several big European kinds that eat plants, harming them both as grubs and as
  grown insects.
scope: 'Also called a cockchafer, a May bug, or Melolontha melolontha: any one of several big European
  kinds that eat plants as grubs and as grown insects, not the North American kind that eats leaves in
  late spring.'
examples:
- The May beetle ate the leaves of the young plants.
- May beetles harm plants both as grubs and as grown insects.
