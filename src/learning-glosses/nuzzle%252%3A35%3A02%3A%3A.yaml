simpleMeaning: to get yourself into a snug, easy position and settle there
scope: 'Also called nest, nestle, cuddle, and snuggle: to settle into a snug, easy place, not to push
  with the nose and not to fall asleep.'
examples:
- The children nuzzled into their sleeping bags to keep warm.
- We nuzzled against each other on the cold night.
