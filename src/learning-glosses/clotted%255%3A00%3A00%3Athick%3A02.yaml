simpleMeaning: grown thick, with parts stuck together in soft thick lumps
scope: 'Also called clogged: this means thick and stuck together in soft lumps, not thin and able to flow
  easily.'
examples:
- The clotted blood was thick and lumpy in the bowl.
- She stirred the clotted cream, which had formed soft thick lumps.
