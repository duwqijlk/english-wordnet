simpleMeaning: Soap comes from a fat or oil split apart with water while heated with an alkali, one case
  of a chemical made from an acid and an alcohol.
scope: The name is for the chemical change, above all the splitting of a fat or oil with water to make
  soap.
examples:
- They used saponification to turn oil into soap.
- With saponification, soap is made from a fat or oil heated with an alkali.
