scope: 'Also called a pacemaker: a bit of heart tissue made for one job, setting the heartbeat, not a
  machine put in the chest and not a weak heart.'
examples:
- The cardiac pacemaker sends the signal that starts each heartbeat.
- Damage to the cardiac pacemaker can make the heartbeat uneven.
