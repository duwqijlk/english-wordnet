simpleMeaning: The way the members of a community are linked in an ordered pattern of roles and ties.
scope: This is about people and their social roles, not the arrangement of parts inside a building or
  object and not a physical thing that was built.
examples:
- Sociologists study how the structure of the family has changed.
- The structure of the village reflects old class divisions.
