senseId: 'epiphora%1:10:00::'
synsetId: 07114779-n
simpleMeaning: Saying the same end words again at the close of two or more sentences, lines of verse,
  and the like that follow one another.
scope: 'Also called an epistrophe: saying the same end words again at the close of two or more sentences,
  lines of verse, and the like that follow one another, not saying the same words at the start and not
  repeating one whole sentence.'
examples:
- The speech used epiphora, ending each sentence with the same words.
- Epiphora repeats the ends of sentences that follow one another.
