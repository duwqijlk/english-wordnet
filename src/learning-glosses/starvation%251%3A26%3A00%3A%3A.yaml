simpleMeaning: A state of very great hunger, caused by going without the food the body needs for a long
  time
scope: This is the state of being very hungry over a long time, not the act of keeping food from someone.
examples:
- Starvation left the whole village weak and thin.
- After months of starvation, the prisoners could barely stand.
