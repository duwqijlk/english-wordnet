simpleMeaning: The changing of sound waves into electric waves by a microphone.
scope: The changing of sound waves into electric waves by a microphone; not the changing of electric waves
  back into sound and not the act of recording itself.
examples:
- Microphoning turns sound waves into electric waves.
- The engineer checked the microphoning before the show.
