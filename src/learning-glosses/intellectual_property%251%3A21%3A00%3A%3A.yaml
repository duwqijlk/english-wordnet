simpleMeaning: things you own that you cannot touch, made by the mind, such as patents, trade marks or
  the right to copy a work
scope: Things you own that you cannot touch, made by the mind, such as patents and trade marks; not land
  or a house and not a mere idea no one owns.
examples:
- The song is the writer's intellectual property.
- The firm guards its intellectual property with patents.
