simpleMeaning: A single serving of minced meat or fish in a rich creamy sauce, baked in a small pastry
  mold or a shell sharing its name.
scope: This sense is a single serving of minced meat or fish in a rich creamy sauce, baked in a small
  pastry mold or a shell sharing its name, unlike the sense for a small pastry shell for creamy mixtures
  of minced foods.
examples:
- The timbale was baked in a mold.
- They served a fish timbale.
