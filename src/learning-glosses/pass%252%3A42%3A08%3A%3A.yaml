simpleMeaning: to spread or reach across a length, an area, a period of time, or a range, going between
  two points or past a given point
scope: This describes how far something spreads or reaches, not a person dying.
examples:
- The pipeline passes across two hundred miles of open desert.
- A narrow road passes over the mountain and down into the next valley.
