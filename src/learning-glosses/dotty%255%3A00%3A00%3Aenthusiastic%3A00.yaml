senseId: dotty%5:00:00:enthusiastic:00
synsetId: 00889690-s
simpleMeaning: very strongly keen on something or someone, or thinking about it all the time
scope: 'Also called wild, crazy, and gaga: very keen on a person or thing and thinking about them all
  the time. Not the sense of dotty that means mentally not well.'
examples:
- She is dotty about old cars and talks about them all day.
- They are dotty about each other and spend every free hour together.
