simpleMeaning: Buyers and sellers trade a thing out in the open for this amount of money
scope: Also called market value, this is the amount of money a thing sells for in the open, not a set
  price and not the cost of making it.
examples:
- The market price of wheat went up after the dry summer.
- They sold the car at the market price, not a penny more.
