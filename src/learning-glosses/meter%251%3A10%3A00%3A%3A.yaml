schema: oewn-learning-gloss-v2
senseId: 'meter%1:10:00::'
synsetId: 07108759-n
simpleMeaning: In prosody, the strong beat on one sound part in a small group of sound parts in a line
  of poetry
scope: 'Also called beat and measure, and another name for this sense is metre: this is the one strong
  beat in a small group of sounds in poetry, not the whole pattern of a poem, not the unit of length,
  and not a measuring tool.'
examples:
- She marked the meter in each small group of sounds in the verse.
- The teacher showed us where the meter falls in this line of poetry.
