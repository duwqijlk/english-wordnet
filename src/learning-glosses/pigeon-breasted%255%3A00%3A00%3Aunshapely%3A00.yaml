simpleMeaning: When a bone sickness in early childhood leaves the chest bone jutting out, the chest is
  misshapen.
scope: Also called chicken-breasted, this chest shape is the mark left by a bone sickness in early childhood.
examples:
- The pigeon-breasted child had a chest bone that stuck out because of a bone sickness in early childhood.
- The child's chest was pigeon-breasted from a bone sickness in early childhood.
