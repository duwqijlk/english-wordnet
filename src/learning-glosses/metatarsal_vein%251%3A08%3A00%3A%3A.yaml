simpleMeaning: blood tubes with branches on the top and the sole of the foot, serving the long bones in
  the middle of the foot
scope: Blood tubes with branches on the top and sole of the foot, serving the long bones in the middle
  of the foot; vena metatarsus is another name for this sense, not a blood tube of the leg, and not a
  nerve of the foot.
examples:
- The metatarsal vein runs along the top of the foot to the long bones.
- A metatarsal vein on the sole of the foot drains blood from the toes.
