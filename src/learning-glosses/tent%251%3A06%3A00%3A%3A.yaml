simpleMeaning: a shelter you can carry with you, usually made of canvas stretched over supporting poles
  and tied to the ground with ropes and pegs
scope: A cloth shelter carried and set up for camping, also called a collapsible shelter, not a web shaped
  like one and not the act of living in one.
examples:
- They set up a tent in the field behind the barn.
- The tent kept us dry through the storm.
