simpleMeaning: The giving of a liquid food with enough nourishment through a tube into the vena cava,
  a large vein, for long-term coma, severe burns, or severe gut conditions.
scope: Also called hyperalimentation and total parenteral nutrition; liquid food given through a tube
  into a large vein for long-term coma, severe burns, or severe gut conditions, not ordinary tube feeding
  into the stomach.
examples:
- TPN kept her alive while she was in a long-term coma.
- The doctors started TPN after his severe burns.
