simpleMeaning: In chemistry, the rule that what an element is like goes round in a set order as its number
  grows
scope: Also called the periodic law; a chemistry rule about how elements repeat, not a rule about how
  fast things change and not a rule for naming elements.
examples:
- Mendeleev's law shows why elements fall into a repeating pattern.
- We used Mendeleev's law to place the new element in the table.
