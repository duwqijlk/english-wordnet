scope: 'Also called corrupt, pervert, profane, demoralize, subvert, debase, misdirect, deprave, demoralise,
  or vitiate: to spoil someone''s morals through drink or sensual pleasure, not the wild gathering itself.'
examples:
- The older boys tried to debauch the new pupils with drink.
- Critics said the film would debauch young viewers.
