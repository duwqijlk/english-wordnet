simpleMeaning: for pay, a male worker takes away the waste people throw away and gets rid of it
scope: A man paid to take away and get rid of waste, also called a dustman or a garbage man, not a woman
  who does the same work and not a man who makes waste.
examples:
- The garbageman lifted the heavy bins onto the truck.
- A garbageman came down our road early this morning.
