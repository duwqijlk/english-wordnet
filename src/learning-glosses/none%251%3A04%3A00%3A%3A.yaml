simpleMeaning: In the Roman Catholic Church, the prayers said at about three in the afternoon.
scope: The church service said at the ninth hour, once at three o'clock and now often earlier. It is the
  service, not the hour itself, and not the pronoun meaning not any.
examples:
- The monks gathered for none at three o'clock.
- Bells rang for none across the valley.
