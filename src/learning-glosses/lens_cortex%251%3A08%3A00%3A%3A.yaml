simpleMeaning: Round the hard middle of the clear part of the eye lies the soft stuff of the body
scope: 'Also called cortex: the soft stuff of the body round the hard middle of the clear part of the
  eye, not the hard middle itself and not the white of the eye.'
examples:
- The surgeon removed the lens cortex during the eye operation.
- Damage to the lens cortex can cloud a person's sight.
