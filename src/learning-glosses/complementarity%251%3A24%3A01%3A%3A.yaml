simpleMeaning: A link between two states or ideas that are the reverse of each other and that between
  them cover all that can be
scope: A link between two opposite states or ideas that between them cover all that can be; not the sense
  where one thing adds to or leans on the other, and not a link between things that are alike.
examples:
- The complementarity of light and dark covers all that can be.
- Physicists speak of the complementarity of waves and particles.
