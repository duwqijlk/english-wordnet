simpleMeaning: a time when a mammal other than a person is in a state of strong sexual excitement and
  is very active
scope: heat is another name for this sense; not a fixed habit that is hard to break, not a groove in the
  ground, and not the verb sense of digging a groove.
examples:
- The deer were in rut in the autumn woods.
- During the rut, the stags fought over the females.
