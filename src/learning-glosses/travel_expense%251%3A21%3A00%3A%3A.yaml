simpleMeaning: Expenses, often plural, incurred by an employee while doing the job and usually reimbursed
  by the employer.
scope: This is money spent in doing a job, most often in the plural, which the firm the worker works for
  usually pays back.
examples:
- The travel expense was paid back by the firm.
- The travel expenses were claimed back after the trip.
