simpleMeaning: a printed sign that points to a second note at the foot of a page or to another part of
  the text, when the star sign is already used
scope: 'Also called dagger: this printed sign points to a second page note or to another part of the text,
  not the tall stone pillar with a pyramid top.'
examples:
- Use an obelisk for the second note on the page, because the star is already used for the first.
- The obelisk after his name pointed readers to a note at the foot of the page.
