simpleMeaning: one of many kinds of climbing plant with wood-like stems, of the group Vitis (its scientific
  name), that bears groups of berries people can eat
scope: 'Also called grape and grape vine: this is the climbing plant itself, not the fruit it bears and
  not news passed from person to person.'
examples:
- The grapevine climbed over the old fence and gave heavy groups of fruit.
- They planted a grapevine on the sunny side of the house.
