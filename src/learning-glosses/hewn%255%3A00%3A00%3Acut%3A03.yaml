simpleMeaning: made by striking it hard again and again with a heavy blade, such as an ax or a chisel,
  until it takes the shape wanted
scope: Shaped by hard blows with a heavy cutting tool, not cut in a smooth or gentle way.
examples:
- The house was built of hewn logs.
- The path was hewn through the thick undergrowth.
