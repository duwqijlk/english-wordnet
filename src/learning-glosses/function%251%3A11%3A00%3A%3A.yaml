simpleMeaning: a formal or official social event that people attend
scope: This is the same formal social event as the other noun sense of 'function' — the two entries name
  one event, a gathering or ceremony people go to — so it is not a job, role or purpose, and not a mathematical
  relation.
examples:
- The charity function raised money for the hospital.
- She attended a function at the embassy last night.
