senseId: caudate%5:00:00:simple:01
synsetId: 02175070-s
simpleMeaning: 'Of a leaf shape: getting narrower bit by bit until it ends in a long thin tip like a tail.'
scope: A leaf shape that narrows to a long tail-like tip, not a leaf shape that ends in a point and not
  the tail-shaped part of the brain.
examples:
- The caudate leaf narrows slowly to a long thin tip.
- Botanists call this leaf caudate because its end runs out like a tail.
