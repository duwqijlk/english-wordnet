simpleMeaning: a hat made from the soft hair of a beaver, or from a material like it
scope: 'Also called beaver: a hat made from beaver hair, not a small wheel under furniture and not a small
  pot for shaking sugar over food.'
examples:
- He wore a tall black castor on cold days.
- The old castor was made from beaver fur and kept his head warm.
