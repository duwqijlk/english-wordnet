simpleMeaning: a part in the two halves of the brain that runs smell in simpler animals, and in people
  seems to shape strong feelings and the acts that go with them
scope: Not the whole brain, and not the nose itself; also called olfactory brain.
examples:
- The rhinencephalon links smell to feeling in the brain.
- The dog's rhinencephalon guides it by smell.
