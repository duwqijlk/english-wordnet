senseId: 'sternwheeler%1:06:00::'
synsetId: 04324201-n
simpleMeaning: a boat that runs on steam, with a wheel with flat blades at its back end that pushes it
  through the water
scope: A steam boat with its blade wheel at the back end, not a boat with the wheel at the side and not
  a boat with no wheel at all.
examples:
- The old sternwheeler carried people up and down the river.
- We watched the sternwheeler's great wheel turn slowly at the back of the boat.
