senseId: 'abducent%3:00:00::'
synsetId: 00002956-a
simpleMeaning: most often used of muscles, moving a part away from the middle of the body or away from
  a part next to it
scope: This is about a muscle that pulls a part away from the middle of the body; abducting is another
  name for this sense, not a nerve in the eye and not a muscle that pulls a part toward the middle.
examples:
- The abducent muscle moved his arm away from his side.
- When the abducent muscle works, the leg moves away from the middle of the body.
