simpleMeaning: a saw with a long handle and a bent blade at the end, sometimes with a cutter too, for
  cutting back small trees
scope: A saw with a long handle and a bent blade at the end, sometimes with a cutter too, for cutting
  back small trees; also called pruner and lopper; not a short saw for logs, and not a pair of shears.
examples:
- He reached up with the pruning hook to cut the dead branch.
- The pruning hook has a bent blade at the end of a long handle.
