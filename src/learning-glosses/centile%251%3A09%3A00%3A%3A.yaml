simpleMeaning: In statistics, one of the 99 numbered points that cut a set of scores in order into 100
  parts, each holding one hundredth of the whole.
scope: In statistics, one of 99 points cutting scores into 100 equal parts, not a single score and not
  an average; percentile is another name for this sense.
examples:
- Her score lay at the 90th centile of the class.
- The centile shows where a score stands among all the scores.
