simpleMeaning: a strong habit of saying no to your own wants, especially to fun and nice things in the
  world
scope: Also called asceticism and nonindulgence, this is a person's own habit of saying no to wants, not
  a government plan to spend less.
examples:
- He lived a life of austerity, with plain food and no fine clothes.
- Her austerity meant she never bought anything just for fun.
