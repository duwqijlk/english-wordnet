simpleMeaning: Gout that is far gone or has lasted a long time shows itself in hard stuff that gathers
  round a joint or in the outer ear.
scope: This hard stuff round a joint or in the outer ear is also called a chalkstone.
examples:
- A tophus had formed round the joint.
- A tophus in the outer ear showed the gout had lasted a long time.
