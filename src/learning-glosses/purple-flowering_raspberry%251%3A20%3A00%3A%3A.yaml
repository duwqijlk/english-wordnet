simpleMeaning: a bushy raspberry of eastern North America whose red or orange fruit is shaped like a thimble,
  with bright pink to violet flowers
scope: 'Also called thimbleberry and flowering raspberry: a bushy raspberry of eastern North America with
  bright flowers and thimble-shaped fruit, not a blackberry and not a garden raspberry grown for jam.'
examples:
- The purple-flowering raspberry grew wild along the eastern woods.
- Its purple-flowering raspberry fruit was red and shaped like a thimble.
