simpleMeaning: the hurt person has the right to get money, in law, for losses that can readily be shown
  to have happened
scope: Compensatory damages and general damages are other names for this money, which the hurt person
  has the right to get in law for losses that can readily be shown to have happened.
examples:
- The court gave her actual damages for the losses she could prove.
- He asked for actual damages to cover the money he had lost.
