simpleMeaning: A drug you can get without a doctor's note, that only one person or firm has the right
  to make and sell
scope: A drug you can get without a doctor's note, that only one person or firm may make and sell, not
  a drug that needs a doctor's note and not a drug anyone may make.
examples:
- She bought a patent medicine for her cold without seeing a doctor.
- The patent medicine on the shelf promised to cure a cough.
