simpleMeaning: feeling sick because of movement when travelling
scope: This sense means feeling sick from movement, also called seasick and also called airsick; it is
  not feeling ill for another reason.
examples:
- I felt carsick on the long bus ride through the hills.
- The children got carsick during the drive to the coast.
