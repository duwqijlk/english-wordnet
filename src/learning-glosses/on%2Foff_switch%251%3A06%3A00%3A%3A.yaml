simpleMeaning: With a turn at a joint, this control sits in either of two places
scope: A control that turns at a joint to sit in either of two places, also called toggle and on-off switch;
  not a dial with many places and not a button pushed in once.
examples:
- The on/off switch on the fan has two settings.
- She flipped the on/off switch and the machine hummed to life.
