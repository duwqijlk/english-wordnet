simpleMeaning: A chemical process that joins many small units into one large chain-like stuff
scope: This is a chemical process that joins many small units into one large chain-like stuff; polymerization
  is another name for it, not the breaking apart of such a stuff and not a change in its state.
examples:
- Polymerisation turns small units into a long chain.
- Heat speeds up polymerisation in the factory.
