simpleMeaning: a cup made of hard, leaf-like parts that holds the bottom of an acorn
scope: A cup of hard leaf-like parts at the base of an acorn, also called an acorn cup, not the acorn
  itself and not a leaf.
examples:
- The cupule held the acorn tight to the branch.
- Each acorn sat in a cupule of hard, leaf-like parts.
