senseId: 'originalism%1:09:00::'
synsetId: 05955083-n
simpleMeaning: The view that the first law of the United States should be read as the people who wrote
  it first meant it
scope: The view that the first law of the United States should be read as its writers first meant it,
  not a view that judges should read it in a new way and not a view about other laws.
examples:
- The judge's originalism led him to read the Constitution as its writers meant it.
- Originalism holds that the words of the Constitution mean what they meant when written.
