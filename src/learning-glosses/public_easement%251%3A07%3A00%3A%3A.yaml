simpleMeaning: A right anyone has to use land that belongs to someone else, such as the right to use streets
  open to all
scope: A right anyone has to use land that belongs to someone else, such as streets open to all; not a
  private right and not owning the land.
examples:
- The path across the farm is a public easement, so walkers may use it.
- Residents claimed a public easement to reach the beach through the private land.
