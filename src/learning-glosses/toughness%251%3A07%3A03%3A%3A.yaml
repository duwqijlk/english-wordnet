simpleMeaning: how springy and hard a piece of metal is, and how much force it can take before it cracks
scope: 'Also called temper: this sense is about metal only, not about a person being strong and not giving
  up easily.'
examples:
- The toughness of this steel helps the bridge stand up to heavy loads without cracking.
- They tested the toughness of the metal before using it to make tools.
