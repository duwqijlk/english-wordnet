simpleMeaning: a gas made by blowing steam over hot coke or coal, a mix of hydrogen and carbon monoxide
  with small amounts of other gases
scope: A gas made from steam blown over hot coke or coal, not steam itself and not natural gas.
examples:
- The factory made water gas by blowing steam over hot coke.
- Water gas burns well because it holds hydrogen and carbon monoxide.
