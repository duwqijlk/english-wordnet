senseId: 'quaver%2:32:01::'
synsetId: 01052990-v
simpleMeaning: To make sounds that are not steady, rising and falling in loudness or pitch.
scope: To make unsteady sounds that rise and fall; waver is another name for this sense, and it is not
  singing with trills, which is the other sense of this word.
examples:
- Her voice began to quaver with fear.
- The old singer's notes quavered as he sang.
