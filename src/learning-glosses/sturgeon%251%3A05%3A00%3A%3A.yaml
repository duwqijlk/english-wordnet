simpleMeaning: a large, old kind of fish valued for its meat and eggs, found widely in the north part
  of the world where it is not very hot or cold
scope: This is the large fish itself, valued for its meat and eggs; it is not a name for the eggs alone.
examples:
- We saw a sturgeon swimming in the cold river.
- The fisherman caught a large sturgeon for its meat and eggs.
