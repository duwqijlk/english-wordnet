synsetId: 07579857-n
simpleMeaning: a way of eating that limits how much sodium chloride is taken in, often used to treat high
  blood pressure, swelling, or certain other illnesses
scope: A way of eating that limits salt intake, also called low-sodium diet and salt-free diet, not a
  diet that limits all food and not a diet for losing weight.
examples:
- A low-salt diet limits how much salt you take in.
- Her doctor put her on a low-salt diet to help her blood pressure.
