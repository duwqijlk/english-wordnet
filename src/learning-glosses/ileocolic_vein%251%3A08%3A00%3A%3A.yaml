senseId: 'ileocolic_vein%1:08:00::'
synsetId: 05376909-n
simpleMeaning: Blood leaves the end of the small gut, the appendix, the pouch where the guts meet, and
  the lower rising part of the large gut through this tube.
scope: Also called vena ileocolica, this tube carries blood away from the end of the small gut, the appendix,
  and nearby parts, rather than bringing blood to them.
examples:
- Blood leaves the appendix through the ileocolic vein.
- The ileocolic vein takes blood from the end of the small gut.
