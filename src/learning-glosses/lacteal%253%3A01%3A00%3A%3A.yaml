simpleMeaning: 'A thing or part that has to do with milk: it may look like milk, make milk, or be made
  of milk'
scope: About milk, not about the small tubes in the body that carry a milky fluid, and not a milk drink.
examples:
- The lab tested the lacteal fluids from the sample.
- Lacteal glands in a mother make milk for her baby.
