simpleMeaning: People wear things made from the hard, stone-like frame of a Mediterranean sea animal,
  delicate red or pink in colour.
scope: Also called coral and red coral, this names the hard, stone-like frame left by a Mediterranean
  sea animal, not the living animal itself.
examples:
- The precious coral in the shop was delicate red in colour.
- A ring made of precious coral lay in the shop window.
