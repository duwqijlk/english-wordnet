simpleMeaning: a small train station between the big main stations, or any station where trains halt only
  when a traveller gives a sign
scope: 'Also called a flag stop or a way station: a small station between the big stations, or a station
  where trains halt only when a traveller gives a sign, not a big main station and not a place where every
  train halts.'
examples:
- The whistle stop was just a small platform beside the track.
- They got off at a whistle stop in the middle of nowhere.
