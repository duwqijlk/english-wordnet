simpleMeaning: having to do with the first followers of Jesus, or with what they taught
scope: 'Another name for apostolic: it means coming from the Apostles or their teaching, not coming from
  a pope or the papacy.'
examples:
- The apostolical letters were written by the first followers of Jesus.
- His apostolical zeal came from the teaching of the early church.
