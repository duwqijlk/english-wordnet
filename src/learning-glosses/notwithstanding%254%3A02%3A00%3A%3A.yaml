schema: oewn-learning-gloss-v2
senseId: 'notwithstanding%4:02:00::'
synsetId: 00027761-r
simpleMeaning: In spite of anything that goes against what came before, often used just before admitting
  a fact that goes against it
scope: Still, however, yet, nevertheless and nonetheless are other names for this sense; this is a word
  that sets up a fact against what came before, not a word that simply joins two facts.
examples:
- Notwithstanding the rain, the match went on.
- He kept his word, notwithstanding the cost to himself.
