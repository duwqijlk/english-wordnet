senseId: 'headline%2:32:00::'
synsetId: 00978256-v
simpleMeaning: to tell many people about something in a big, clear way so that lots of people notice it
scope: This means to make something widely known, not the title at the top of a newspaper story and not
  putting a title on a story.
examples:
- The shop headlined its big sale in every window in town.
- The new singer was headlined in papers all over the country.
