simpleMeaning: having one or more openings that let air in or let gases out
scope: This word is about a thing having openings for air or gases, not about a person letting out strong
  feelings in words.
examples:
- The vented helmet has small openings that let air in.
- The storage room is vented, so gases can go out safely.
