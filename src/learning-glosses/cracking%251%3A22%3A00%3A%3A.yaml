simpleMeaning: the process of breaking heavy molecules (small parts) of naphtha or petroleum (kinds of
  oil) into hydrocarbons that weigh less (parts of hydrogen and carbon), especially in refining oil
scope: The oil process described here, not a sudden sharp noise and not the simple act of breaking something.
examples:
- Cracking turns heavy oil into lighter parts that can be used as fuel.
- At the plant, cracking is used to break down petroleum.
