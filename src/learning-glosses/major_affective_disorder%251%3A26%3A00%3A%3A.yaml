simpleMeaning: strong feelings rule a person's mind in this illness, which no clear harm to the brain
  brings on
scope: Also called affective disorder, emotional disorder, and emotional disturbance, this is an illness
  in which strong feelings rule, not one brought on by clear harm to the brain.
examples:
- He lives with major affective disorder.
- Major affective disorder affects how a person feels.
