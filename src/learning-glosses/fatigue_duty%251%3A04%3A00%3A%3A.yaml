simpleMeaning: work that is not fighting, done by soldiers, such as cleaning, digging, or draining water
scope: 'Also called fatigue: work that is not fighting, done by soldiers, not a battle task and not the
  tired feeling after hard work.'
examples:
- The soldiers were given fatigue duty after breakfast, cleaning the barracks.
- Fatigue duty kept the men digging ditches all afternoon.
