simpleMeaning: People hold this woman in high regard for her style, and she is in middle age or older
scope: A stylish, highly respected woman in middle age or older, not a young woman and not a woman of
  low standing.
examples:
- The grande dame of the theatre took her seat in the front row.
- She was the grande dame of the city's art world.
