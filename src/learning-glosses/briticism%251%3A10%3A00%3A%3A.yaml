simpleMeaning: A way of saying something used in Great Britain, above all as unlike American English.
scope: Also called an Anglicism and a Britishism; this is a form of words used in Great Britain, set against
  American English, not an American form of words.
examples:
- Briticism is a word used in Britain but not in America.
- He used a Briticism in his letter.
