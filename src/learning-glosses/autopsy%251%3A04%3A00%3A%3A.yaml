senseId: 'autopsy%1:04:00::'
synsetId: 00142216-n
simpleMeaning: a careful check of a dead body, cutting it open, to find why the person died or what changes
  a disease made in the body
scope: 'Also called postmortem and necropsy: this is the check of a dead body itself, not the verb sense
  of doing such a check, and not a check of a living person.'
examples:
- The autopsy showed that he died of a heart problem.
- Doctors did an autopsy to find the cause of death.
