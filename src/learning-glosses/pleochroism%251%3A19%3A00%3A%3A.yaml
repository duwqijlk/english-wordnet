simpleMeaning: A crystal can look one colour from one side and a different colour from another side
scope: The same crystal looks a different colour from each side; it is not the crystal changing colour,
  and not the colour of light passing through glass.
examples:
- The pleochroism of the stone made it look blue from one side and green from another.
- Pleochroism shows different colours in the same crystal from different sides.
