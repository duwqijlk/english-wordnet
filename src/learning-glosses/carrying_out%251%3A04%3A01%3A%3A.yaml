simpleMeaning: Doing a task well, by using what you know, not just by knowing it.
scope: Doing a task well, by using what you know, not just by knowing it, also called performance, execution
  or carrying into action; not doing a task badly, and not knowing a task without doing it.
examples:
- She is carrying out the plan exactly as agreed.
- Carrying out the orders took all day.
