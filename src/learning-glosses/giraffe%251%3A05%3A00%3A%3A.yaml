simpleMeaning: the tallest four-legged animal that lives today, with a spotted coat, small horns, and
  a very long neck and legs, found on the open grassland of hot Africa
scope: The tallest four-legged animal, with a spotted coat and long neck and legs; not a horse, and not
  another big animal of Africa.
examples:
- The giraffe bent its long neck down to eat the leaves.
- A giraffe can reach the top of a tall tree.
