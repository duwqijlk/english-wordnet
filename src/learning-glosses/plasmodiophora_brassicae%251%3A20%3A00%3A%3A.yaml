scope: Also called clubroot fungus, this is a fungus like a slime mould that swells cabbage roots, not
  a mushroom and not a harmless soil fungus.
examples:
- Plasmodiophora brassicae had swollen the cabbage roots.
- The Plasmodiophora brassicae spread through the field.
