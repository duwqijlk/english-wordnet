simpleMeaning: To pass out a thing in small shares, a little at a time, among the people who receive it.
scope: 'Also called lot, deal, and distribute: handing something out in small amounts, not running a plan
  or a fund.'
examples:
- She administered small sums of money to each child.
- He administered sharp remarks to everyone in the room.
