simpleMeaning: having more mishaps than most people have
scope: A person who has more mishaps than most people, not someone who has had one bad day and not someone
  who has only the usual number of mishaps.
examples:
- He is so accident-prone that he has broken three bones this year.
- Accident-prone drivers pay more for insurance.
