simpleMeaning: to arrive on land from the water
scope: This is to come to land from the water. Not a piece of wood that holds up a building, and not to
  be the land at the edge of the water for something.
examples:
- After a long night on the water, the small boat shored near the village.
- The ship shored safely, and the people stepped onto the land.
