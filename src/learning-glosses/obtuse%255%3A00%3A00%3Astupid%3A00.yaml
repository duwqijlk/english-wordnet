simpleMeaning: takes a long time to learn or understand things, and is not quick at thinking
scope: 'Also called slow, dull, dim, dumb, and dense: slow in the mind, not the leaf sense that means
  round at the tip, and not the sense that means not good at judging.'
examples:
- He was obtuse in class and needed more time to learn each new idea.
- The obtuse student asked the teacher to say the lesson again in simple words.
