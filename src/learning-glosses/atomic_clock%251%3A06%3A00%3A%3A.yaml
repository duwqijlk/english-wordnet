simpleMeaning: A timekeeper that sets its time from the shaking of the smallest bits of matter
scope: This is a timekeeper set by the shaking of the smallest bits of matter, not a timekeeper set by
  a swinging weight and not one set by the sun.
examples:
- The atomic clock in the laboratory keeps almost perfect time.
- An atomic clock sets its time from the shaking of tiny bits of matter.
