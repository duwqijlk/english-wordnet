simpleMeaning: In printing, a tray where the person who sets type keeps the letters, spaces, and numbers,
  divided into small boxes for each kind
scope: In printing, a tray for holding type, also called case and typesetter's case, not a box for finished
  pages and not a drawer of tools.
examples:
- The compositor's case held the small letters in the lower tray.
- She reached into the compositor's case for the letter she needed.
