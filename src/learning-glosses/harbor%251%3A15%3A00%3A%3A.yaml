simpleMeaning: a safe port where ships are kept from bad weather and can load and unload goods
scope: Also called harbour and haven. This is a safe place for ships, not the act of hiding a person who
  is running from the law.
examples:
- The ships waited in the harbor until the storm passed.
- Trucks took the goods away from the harbor after the ship unloaded.
