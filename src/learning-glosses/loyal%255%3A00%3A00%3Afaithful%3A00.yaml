simpleMeaning: Staying true to a friend, a promise, or a cause, and never changing your mind about it
scope: 'Also called fast and firm: staying true to a friend, a promise, or a cause, not just liking someone,
  and not just keeping a promise for a short time.'
examples:
- Her loyal supporters stood by her through the long trial.
- He stayed loyal to his old friend for many years.
