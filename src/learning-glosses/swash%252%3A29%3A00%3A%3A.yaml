simpleMeaning: To show off with a proud manner, sure of yourself beyond what is fair.
scope: To act proud and too sure of yourself, also called swagger or bluster; not to splash or move noisily.
examples:
- He swashed into the room as if he owned the place.
- The young captain swashed about the deck, boasting of his victories.
