simpleMeaning: A tree of the western United States, like the white-barked tree but with brownish bark.
scope: A tree of the western United States, like the paper birch but with brownish bark, not the paper
  birch itself and not an eastern birch.
examples:
- Mountain birch grew on the dry slopes.
- The mountain birch had brownish bark, not white.
