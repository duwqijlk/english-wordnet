simpleMeaning: A rootless meat-eating swamp plant with a leafy ring at its base and hollow leaf tubes
  that swell into traps, each ending in two long twisting arms with stiff hairs.
scope: This is the rootless swamp plant that traps small creatures in its leaves, not a Venus flytrap
  or a bladderwort.
examples:
- Genlisea grows in wet, nutrient-poor soil.
- The twisted leaves of genlisea form a trap for tiny creatures.
