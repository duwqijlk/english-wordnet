simpleMeaning: an old kind of hunting fish of North America, covered with hard scales and with long jaws
  full of thin, sharp teeth
scope: An old kind of hunting fish of North America, with hard scales and long jaws; not the long thin
  fish of Europe, and not any other fish.
examples:
- The gar swam slowly through the warm river.
- A gar's long jaws are full of needlelike teeth.
