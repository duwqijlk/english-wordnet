simpleMeaning: A tree of the East Indies that sends down shoots from its arms, which root in the ground
  and grow into new trunks.
scope: This is a tree of the East Indies that sends down shoots from its arms, which root in the ground
  and grow into new trunks; banyan, banian, banian tree, banyan tree, East Indian fig tree and Ficus bengalensis
  are other names for it; not a tree with one trunk only and not a small garden tree.
examples:
- The Indian banyan spreads its arms over the whole yard.
- New trunks grow down from the Indian banyan's arms.
