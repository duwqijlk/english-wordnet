simpleMeaning: a ruler or chief of a land who answers to no higher ruler, in particular in Africa or Arabia
scope: 'Also called emir, ameer and amir: a ruler or chief of a land who answers to no higher ruler, in
  particular in Africa or Arabia, not a ruler who answers to a king and not a headman with no land of
  his own.'
examples:
- The emeer met the traders at the gates of his town.
- An emeer ruled the small desert state for thirty years.
