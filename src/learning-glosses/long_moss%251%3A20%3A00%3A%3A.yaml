simpleMeaning: Dense hanging bunches of grey-green, wavy, hairlike threads clinging to tree trunks and
  branches by thin wiry roots, from the southeastern United States through the West Indies to South America.
scope: This is the grey-green plant that drapes tree limbs in hanging tufts, not a true moss growing on
  rocks or soil, nor a lichen spreading flat over bark.
examples:
- Long moss hung in grey tassels from the branches of the old oak.
- Along the Gulf Coast, long moss drapes almost every tree in the swamp.
