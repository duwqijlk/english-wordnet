simpleMeaning: one of a group of things that stays still until a change, such as a bit that hides it being
  split off by water, lets it speed up work
scope: Proenzyme is another name for this still thing, which only turns into a work-speeding chemical
  after a change and is not a chemical that is already at work.
examples:
- The zymogen needs a change before it can speed up work.
- A zymogen stays still until a bit that hides it is split off by water.
