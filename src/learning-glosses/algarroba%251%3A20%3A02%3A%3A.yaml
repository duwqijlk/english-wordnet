simpleMeaning: 'Farm animals eat it, and people use it in place of chocolate: a long pod with small beans
  and flesh that is a little sweet and soft to eat.'
scope: 'Also called carob, algarroba bean, carob bean, locust bean, and locust pod: a long pod eaten by
  farm animals and used in place of chocolate, not the tree itself and not the mesquite of the Gulf Coast.'
examples:
- The farmer fed the algarroba to his goats.
- She used the algarroba in place of chocolate.
