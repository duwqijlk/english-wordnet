simpleMeaning: any of many trees in the Cupressus group that stay green all year, grow in mild northern
  lands, bear round cones, and have dark leaves like small scales
scope: 'Also called cypress tree: the living tree itself, not the wood taken from such a tree.'
examples:
- A tall cypress stood beside the old church.
- Cypresses stay green through the winter in this region.
