simpleMeaning: a thin woodwind instrument (one you blow into) with a tube that gets wider towards the
  end, played through a mouthpiece made of two thin reeds
scope: 'Also called hautbois and hautboy: this thin instrument you blow through two thin reeds, not a
  clarinet and not a flute.'
examples:
- She plays the oboe in the school orchestra.
- The oboe made a clear sound through its mouthpiece of two thin reeds.
