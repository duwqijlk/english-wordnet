simpleMeaning: This simple sea creature keeps a bag-like body in one piece, while its young shows a stiff
  rod down its back.
scope: Tunicate and urochord are other names for this simple sea creature, told from other sea animals
  by the stiff rod its young shows and its body in one piece.
examples:
- The urochordate kept its bag-like body in one piece as it drifted in the sea.
- The young urochordate showed a stiff rod down its back.
