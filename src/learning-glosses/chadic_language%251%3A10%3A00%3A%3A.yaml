simpleMeaning: A family of Afroasiatic tonal tongues, mostly with two tones, spoken in the lands west
  and south of Lake Chad in north central Africa.
scope: Also called Chad and Chadic, this Afroasiatic family covers many tongues west and south of Lake
  Chad, mostly with two tones, and is not a single tongue or a different family of tongues.
examples:
- Chadic language is a family of tonal tongues spoken in north central Africa.
- Most tongues in the Chadic language family have two tones.
