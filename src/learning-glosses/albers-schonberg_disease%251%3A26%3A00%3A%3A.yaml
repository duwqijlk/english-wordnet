simpleMeaning: A sickness passed down in families in which the bones grow too dense; in bad cases the
  hollow inside the bone where marrow sits may close up.
scope: A sickness passed down in families in which the bones grow too dense, also called marble bones
  disease and osteopetrosis; its nearest kin are other sicknesses of the bones passed down in families.
examples:
- Albers-Schonberg disease made her bones grow too dense.
- The doctor said Albers-Schonberg disease runs in families.
