simpleMeaning: A person of the worldwide group that claims to come down from Jacob, or that has joined
  it, and is joined by ties of culture or faith.
scope: This is a person of the worldwide group from Jacob, also called Jew and Israelite, not a speaker
  of the Hebrew language or a person of another faith.
examples:
- Hebrews trace their descent from Jacob.
- A Hebrew may join the group by conversion.
