simpleMeaning: Of or relating to the Monera, the group of the simplest living things, whose cells have
  no inner core.
scope: Of or relating to the Monera, the group of the simplest living things, whose cells have no inner
  core; not the living things themselves, and not the group of living things with a cell core.
examples:
- Moneran cells have no inner core to hold their genes.
- The moneran group includes the bacteria.
