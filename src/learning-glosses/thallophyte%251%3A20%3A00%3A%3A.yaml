simpleMeaning: A flat body with no stem, root or leaf marks one of a group of living things that breed
  by tiny spores.
scope: A simple living thing with a flat body that has no stem, root or leaf, unlike a plant with separate
  parts.
examples:
- A thallophyte has no stem or root, only a flat body.
- The book lists the thallophyte among living things that spread by spores.
