simpleMeaning: A sound kept on a disk with one unbroken groove, used to play music again by turning while
  a needle rides in the groove.
scope: This sense is also called record, disc, platter, disk and phonograph recording, for a sound kept
  on a disk with one unbroken groove, used to play music again by turning while a needle rides in the
  groove.
examples:
- Phonograph records play music.
- A phonograph record turns under a needle.
