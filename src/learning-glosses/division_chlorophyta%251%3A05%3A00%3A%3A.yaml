simpleMeaning: A large group of mostly fresh-water green growths with colouring a and b, storing food
  as starch, with fibre walls; kinds Chlorophyceae, Ulvophyceae, Charophyceae; plainly the forebears of
  land plants.
scope: 'Also called Chlorophyta: a large group of mostly fresh-water green growths, not land plants and
  not fungi.'
examples:
- The division Chlorophyta includes most fresh-water green growths.
- Scientists place pond scum in the division Chlorophyta.
