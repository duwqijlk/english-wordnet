simpleMeaning: The one vein that drains the organ above the kidney, joining the main vein of the belly
  on the right and the kidney vein on the left.
scope: Also called vena centralis glandulae suprarenalis; the single vein that drains the gland above
  the kidney, not the vein that drains the kidney itself.
examples:
- The central vein of the suprarenal gland carries blood away from the gland above the kidney.
- On the right, the central vein of the suprarenal gland joins the main vein of the belly.
