senseId: 'indian_red%1:07:00::'
synsetId: 04981083-n
simpleMeaning: A brown colour with a warm tint, like the earth of that colour that native people of America
  used as paint on the body
scope: This colour is named for its likeness to the earth used as body paint, not for the pigment of the
  same name; near rivals are that pigment sense and the earth itself.
examples:
- The walls were painted Indian red, a warm brown colour like the earth used as body paint.
- Indian red is a reddish-brown colour that looks like the soil used as body paint.
