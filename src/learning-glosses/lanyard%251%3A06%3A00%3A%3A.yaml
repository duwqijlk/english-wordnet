simpleMeaning: On ships, a rope used to stretch or tie fast the rigging (the ropes that hold the sails
  and masts)
scope: 'Also called laniard: a rope on a ship, used on the rigging; it is not the cord worn round the
  neck to hold a knife or whistle, and not the cord used to fire a cannon.'
examples:
- The sailor pulled the lanyard to make the rigging tighter.
- A lanyard held the ship's rigging fast in the strong wind.
