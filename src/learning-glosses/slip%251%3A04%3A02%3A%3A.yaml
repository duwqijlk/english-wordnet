simpleMeaning: An act that makes people feel uneasy, or that shows no care for what other people feel
scope: This is an act that makes people feel uneasy or shows no care for their feelings; it is not a fall,
  not getting away from someone, and not a piece of clothing.
examples:
- His slip at dinner embarrassed everyone at the table.
- Mentioning her illness in front of guests was a cruel slip.
