simpleMeaning: a large wild cat from America that looks like a lion
scope: 'Also called painter and cougar: this is a large wild cat from America that looks like a lion,
  not the large spotted cat from warm parts of America that looks like a leopard.'
examples:
- A panther moved quietly through the woods in Florida at night.
- The panther has a plain brown coat with no spots.
