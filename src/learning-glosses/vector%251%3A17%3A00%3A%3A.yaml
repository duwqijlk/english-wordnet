senseId: 'vector%1:17:00::'
synsetId: 09492415-n
simpleMeaning: a person, animal, or tiny living thing that people cannot see (a microorganism) that carries
  a disease and passes it to others
scope: 'Also called transmitter: a living thing that carries a disease and passes it on. It is not a straight
  line with length and direction, and not a quantity that can be split into parts.'
examples:
- Mosquitoes are vectors that carry malaria.
- Fleas can be vectors of plague, passing the disease to people.
