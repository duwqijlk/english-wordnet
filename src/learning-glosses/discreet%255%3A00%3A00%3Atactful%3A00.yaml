simpleMeaning: Quietly noticing what other people feel, and acting with care for them, without drawing
  eyes to it
scope: Quietly noticing what others feel and acting with care, not the sense of holding back out of prudence
  and modesty.
examples:
- She was discreet about the news and told no one.
- He kept a discreet silence while the others argued.
