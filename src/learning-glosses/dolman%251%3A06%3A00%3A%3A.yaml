simpleMeaning: a loose outer coat worn by a woman, with wide sleeves that are tight at the wrist
scope: A loose outer coat for a woman, not a jacket worn by a soldier and not a coat with plain narrow
  sleeves.
examples:
- She wore a dolman over her evening dress.
- The old dolman hung in the wardrobe, its wide sleeves folded flat.
