simpleMeaning: the gears in a car that send power from the engine through a long rod to the wheels that
  drive it
scope: These are the gears in a car that send power from the engine to the wheels that drive it; transmission
  is another name for this sense, not a wire that carries power and not a radio message.
examples:
- The mechanic fixed the transmission system in her car.
- A fault in the transmission system stopped power reaching the wheels.
