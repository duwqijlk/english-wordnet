simpleMeaning: to make a sound or noise less strong, especially by wrapping something around it
scope: 'Also called damp and muffle: this is about making a sound less strong, especially by wrapping
  something around it. It is not about something losing shine, and not about a sound that is not clear.'
examples:
- Wrapping a cloth around the bell dulled its sound.
- Thick curtains dulled the noise from the street.
