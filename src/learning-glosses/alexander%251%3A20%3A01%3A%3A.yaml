simpleMeaning: a plant from Europe that looks a bit like celery; it now grows wild in many parts of the
  coast in Britain and is often grown for use in cooking
scope: This plant is also called alexanders, black lovage and horse parsley; it is a plant used in cooking,
  not a person with this name.
examples:
- Alexander grows along the coast near our village.
- She picked some alexander to add to the soup.
