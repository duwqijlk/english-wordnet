simpleMeaning: The eyeball and the inner side of the lids are lined by this clear, slippery skin that
  keeps them moist.
scope: This is the clear, slippery skin on the eyeball and the inner side of the lids, not the skin on
  the outside of the lid.
examples:
- The conjunctiva keeps the eyeball moist.
- Her conjunctiva was red and sore.
