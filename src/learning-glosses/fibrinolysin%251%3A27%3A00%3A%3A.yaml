simpleMeaning: a substance in the body that breaks down the tough threads that hold a blood clot together
scope: 'Also called plasmin: a body substance that breaks down clots, not a drug that stops bleeding and
  not the clot itself.'
examples:
- Fibrinolysin dissolved the clot in the test tube.
- Doctors studied fibrinolysin to see how it breaks down blood clots.
