simpleMeaning: to become aware of something from a feeling inside you, not through your eyes, ears or
  skin.
scope: This is not physical feeling and not the meaning of a word; it is a quiet, instinctive awareness.
examples:
- She sensed that someone was watching her, even though the street was empty.
- He sensed trouble as soon as he entered the room.
