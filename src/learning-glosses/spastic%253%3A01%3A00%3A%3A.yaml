senseId: 'spastic%3:01:00::'
synsetId: 03131276-a
simpleMeaning: about or marked by a sudden tight pulling of a muscle that you cannot control
scope: This describes a thing marked by a sudden tight pulling of a muscle that cannot be controlled.
  It does not name a person whose muscles stay tight and who cannot move in the usual way, and it does
  not describe such a person.
examples:
- She has a spastic colon that tightens without warning.
- The doctor said the pain came from a spastic muscle in his back.
