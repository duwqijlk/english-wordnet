simpleMeaning: This side of a blade does the cutting, and it is sharp
scope: 'Also called cutting edge: the sharp side of a blade that does the cutting, not the flat side of
  the blade and not the handle.'
examples:
- Be careful — the knife edge is very sharp.
- He ran his thumb along the knife edge to test it.
