simpleMeaning: In accounting, a note made at the end of a time span to put sums in the right span.
scope: In accounting, a note at the end of a time span that puts sums in the right span, not a note that
  closes the books and not a day-to-day note.
examples:
- The accountant made an adjusting entry for the unpaid rent.
- Each adjusting entry moves a sum into the time span it belongs to.
