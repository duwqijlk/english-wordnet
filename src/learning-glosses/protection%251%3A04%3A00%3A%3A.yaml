simpleMeaning: The work of keeping someone or something safe from harm.
scope: This sense is not the physical cover or shield used for safety, but the act of keeping someone
  or something safe.
examples:
- The guards provided protection for the family during the journey.
- The new law offers protection to people who report wrongdoing.
