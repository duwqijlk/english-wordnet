simpleMeaning: A covering made of stuff that melts only at very high heat, put on the inside walls of
  a furnace.
scope: Also called a furnace lining; a covering for the inside walls of a furnace, not the adjective for
  a thing that does not respond to a process or stimulus.
examples:
- The refractory inside the furnace had cracked.
- Workers replaced the refractory after the fire.
