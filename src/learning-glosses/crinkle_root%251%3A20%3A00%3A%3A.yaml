simpleMeaning: A North American plant with a strong smell and scaly or toothed underground parts.
scope: This is a North American plant with scaly underground parts, not a garden flower or a food plant;
  also called crinkle-root, crinkleroot, pepper root, and toothwort.
examples:
- Crinkle root grew along the stream.
- The crinkle root smelled sharp when dug up.
