simpleMeaning: clearly very new, or bringing deep and complete change
scope: 'Also called radical: clearly very new, or bringing deep change; not the sense about supporting
  or taking part in change in government, and not a person who supports such change.'
examples:
- It was a revolutionary discovery that changed how doctors treat the illness.
- Her revolutionary idea changed the way people take photos.
