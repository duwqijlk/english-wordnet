simpleMeaning: in Australia and Tasmania grows a small or medium tree whose smooth bark, white to pale
  grey, sheds in patches or strips
scope: 'Also called a ghost gum or a white ash: a small or medium tree of Australia, not a tall eucalyptus
  and not a red gum.'
examples:
- The snow gum shed strips of white bark onto the track.
- Snow gums grew all along the cold mountain slopes.
