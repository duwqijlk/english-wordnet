simpleMeaning: A perennial rush-like flowerless herb with jointed hollow stems, narrow toothed leaves
  and spreading underground stems; often weedy in the Northern Hemisphere, some in Africa and South America.
scope: This sense is the jointed, flowerless plant of damp ground, not a horse’s tail and not the unrelated
  reedy grasses it resembles.
examples:
- Horsetails grew thickly along the muddy bank of the stream.
- Gardeners pull horsetail out before its underground stems spread further.
