simpleMeaning: A hot southern dish of chicken, or small game, cooked slowly with corn, tomatoes, lima
  beans, okra, onions, and potatoes.
scope: A thick mixed dish of the southern United States, with chicken or small game and several vegetables
  cooked together in one pot, not a thin soup made of one food.
examples:
- Brunswick stew bubbled on the stove all afternoon.
- We ate Brunswick stew with corn bread at the church supper.
