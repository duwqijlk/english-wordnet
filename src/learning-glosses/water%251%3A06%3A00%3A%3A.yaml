simpleMeaning: a facility that supplies a place with the liquid that people drink and use every day
scope: This is not the liquid itself and not a lake, river or sea; it is the supply facility that provides
  the liquid.
examples:
- The town's water is tested for bacteria every week.
- A burst pipe left the village without water for two days.
