simpleMeaning: Moving across the sky from west to east, or circling the sun the same way the Earth does.
scope: This is a heavenly body's eastward movement across the sky, or a planet circling the sun the same
  way the Earth does; it is not a straight, short path in space, not something with no go-between or middle
  step, not plain or frank in manner, not descent through an unbroken family line, not a proportional
  relation to another quantity, not a one-way electrical flow, not something that follows at once as a
  result, not a word-for-word quotation, not total and unmitigated, not the adverb meaning without swerving,
  and not any verb use (commanding, aiming at a goal, aiming a weapon, camera or blow, guiding actors,
  conducting music, governing or managing, taking or sending someone somewhere, steering a course, telling
  someone the way, designing for an audience, addressing an envelope, or planning a complex undertaking).
examples:
- Mars turned direct last week after two months of retrograde motion.
- The planet is direct now, drifting eastward against the background stars.
