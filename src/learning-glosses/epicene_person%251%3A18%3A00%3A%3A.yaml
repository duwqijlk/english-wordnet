simpleMeaning: A human being with both male and female sex traits and parts, so that at birth no clear
  choice of male or female can be made.
scope: 'Also called a hermaphrodite, an epicene, an androgyne, a gynandromorph and an intersex: a human
  being with both male and female sex parts, not a person with only male parts and not a person with only
  female parts.'
examples:
- The epicene person had both male and female sex parts.
- At birth, no clear choice could be made for the epicene person.
