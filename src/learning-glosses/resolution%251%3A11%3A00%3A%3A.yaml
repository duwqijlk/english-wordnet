simpleMeaning: the going down of swelling or other signs that a part of the body is red, hot and sore,
  especially in a lung
scope: The going down of swelling or other signs of illness in the body, especially in a lung; not a decision
  that settles a problem and not the music sense of a rough group of notes turning smooth.
examples:
- The doctor waited for the resolution of the swelling in his lung.
- Resolution of the red, sore place on her leg took a few days.
