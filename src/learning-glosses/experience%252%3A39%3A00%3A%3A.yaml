simpleMeaning: to feel or go through a state of body or mind, such as pain or joy.
scope: It is not a long, hard period of life and not knowledge you have gained, but a state you feel at
  one time.
examples:
- Several passengers experienced chest pain during the flight.
- He experienced a moment of pure happiness when he saw her.
