simpleMeaning: To hold back private news and say nothing about things that must stay secret
scope: This is holding back private news and saying nothing about things that must stay secret; keep one's
  mouth shut is another name for this sense, not simply staying silent when there is nothing to hide and
  not refusing to speak at all.
examples:
- She kept quiet about the surprise party.
- He knew the secret but kept quiet.
