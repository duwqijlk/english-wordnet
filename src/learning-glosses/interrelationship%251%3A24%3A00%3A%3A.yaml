simpleMeaning: Two things linked with each other, with each one acting on the other and being acted on
  in turn
scope: Things linked so that each acts on the other and is acted on in turn, also called interrelatedness
  or interrelation; not a one-way link and not a single thing on its own.
examples:
- The interrelationship between diet and health is well known.
- He traced the interrelationship of the two events.
