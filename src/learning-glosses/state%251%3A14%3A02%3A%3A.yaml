simpleMeaning: The part of the country's government that sets and keeps foreign policy.
scope: The foreign-policy department, also called the Department of State, the State Department, or the
  United States Department of State; not a part of a country, and not any other department.
examples:
- The Department of State was created in 1789.
- State handles talks with other countries.
