simpleMeaning: a person who shows that they look down on someone or something by words or by the look
  on their face
scope: A person who shows contempt for someone or something; also called a sneerer, not a person who simply
  disagrees and not someone who mocks with jokes.
examples:
- The scorner raised an eyebrow and turned away without a word.
- Every scorner in the room made her feel small.
