schema: oewn-learning-gloss-v2
senseId: 'percolate%2:35:02::'
synsetId: 01460857-v
simpleMeaning: to make a liquid that dissolves other things pass through a material that lets liquid through,
  to take out of that material a part that can dissolve in the liquid
scope: This sense is making a liquid pass through something to take something out of it, not liquid spreading
  slowly on its own, not making coffee, and not the liquid that comes out.
examples:
- The chemist percolated water through the powder to extract the active part.
- Percolate the solvent through the sand to draw out the soluble material.
