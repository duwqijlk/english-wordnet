simpleMeaning: a shoe that reaches the ankle and is tied through two or three pairs of small holes, often
  made of soft leather
scope: A shoe that reaches the ankle and is tied through two or three pairs of small holes, often made
  of soft leather, also called a chukka; not a tall boot and not a sandal.
examples:
- He wore chukka boots with his suit.
- Her chukka boot was made of soft brown leather.
