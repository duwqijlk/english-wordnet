simpleMeaning: A fellow insect living in ordered crowds, as a rule the egg-laying queen and the males
  have wings at breeding time, and wingless, barren females are the workers.
scope: This sense is also called ant and emmet, for a fellow insect living in ordered crowds, as a rule
  the egg-laying queen and the males have wings at breeding time, and wingless, barren females are the
  workers.
examples:
- Pismires live in ordered colonies.
- A pismire queen has wings.
