simpleMeaning: in a quick way, acting on a sudden urge, without taking care
scope: 'Also called impulsively: acting on a sudden urge without taking care, not done slowly after careful
  thought.'
examples:
- He impetuously jumped into the cold river without checking how deep it was.
- She impetuously spent all her money on a ticket she had not planned to buy.
