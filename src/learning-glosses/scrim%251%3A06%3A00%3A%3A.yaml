simpleMeaning: a strong cloth with small open spaces between its threads, used to make a curtain in a
  theater
scope: A strong open cloth used as a curtain in a theater, not a heavy closed curtain and not cloth for
  clothes.
examples:
- From the front, the scrim looked solid, but light shone through it.
- The actors stood behind the scrim so the audience could only see their shapes.
