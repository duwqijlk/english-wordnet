simpleMeaning: making young by the joining or fusing of a male cell and a female cell
scope: Making young by the joining of male and female cells, not the joining of sperm and egg only and
  not making young without such a joining.
examples:
- Amphimixis is the kind of reproduction in which male and female cells join.
- In amphimixis, a male cell and a female cell fuse to make a new young.
