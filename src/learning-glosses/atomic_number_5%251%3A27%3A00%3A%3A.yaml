simpleMeaning: A chemical element that joins with three other atoms, found as a hard black solid or as
  a yellow or brown powder.
scope: This is a chemical element with three joining points; B and boron are other names for it, and it
  is not a metal or a compound built from more than one kind of atom.
examples:
- Atomic number 5 stands for boron on the chart of the elements.
- The teacher wrote atomic number 5 on the board next to the symbol B.
