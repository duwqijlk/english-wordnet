simpleMeaning: Made from quicksilver, formed from vapour, this white poisonous crystal comes apart in
  water and is used to keep wood from rotting, to clean wounds, and to kill pests.
scope: Bichloride of mercury, corrosive sublimate and mercuric chloride are other names for this white
  poisonous crystal made from quicksilver.
examples:
- Mercury chloride was used as a wood preservative.
- Mercury chloride mixed with water was used to clean wounds.
