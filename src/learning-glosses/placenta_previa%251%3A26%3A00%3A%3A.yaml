senseId: 'placenta_previa%1:26:00::'
synsetId: 14072329-n
simpleMeaning: A pregnancy in which the placenta lies in the lower, not upper, part of the uterus, which
  can cause late bleeding and may need a cesarean delivery
scope: This word names a pregnancy in which the organ feeding the baby grows low in the womb, and not
  one in which it grows high.
examples:
- She had placenta previa, and the pregnancy bled late on.
- The baby was born by an operation because of placenta previa.
