simpleMeaning: How much a person or thing is liked, looked up to, and wanted by a large group of people
scope: Being liked and wanted by very many people; not being liked by a few friends only, and not fame
  for one single deed.
examples:
- His charm soon won him affection and popularity.
- The popularity of American movies spread round the world.
