simpleMeaning: a cord coated with white dust, used by builders to mark a straight mark on a face that
  stands up
scope: A cord coated with white dust that builders use to mark a straight mark on a face that stands up,
  not a plain cord and not a pencil mark.
examples:
- The builder held the chalk line tight against the wall to mark where the shelf would go.
- She pulled the chalk line taut and let it fall back to leave a straight white mark.
