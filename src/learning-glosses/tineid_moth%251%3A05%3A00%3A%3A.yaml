simpleMeaning: small winged insects of a pale yellow color, whose young feed on wool and fur
scope: Another name for tineid, this is a small winged insect of a pale yellow color whose young feed
  on wool and fur; not the dull-colored moth with mouth parts made for chewing.
examples:
- A tineid moth fluttered out of the fur coat.
- The tineid moth laid eggs on the wool sweater.
