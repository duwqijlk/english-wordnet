synsetId: 06749518-n
simpleMeaning: In law, a signed paper (an affidavit) that is added to a statement and says the statement
  is true
scope: In law, a signed paper added to a statement to say it is true, not the general act of checking
  that something is true and not a statement by itself.
examples:
- The lawyer added a verification to the statement before filing it.
- Without a verification, the court would not accept the statement.
