simpleMeaning: It is a mild illness caused by a virus that affects your nose and throat.
scope: Not a serious lung illness such as flu or pneumonia, and not the adjective for low temperature.
examples:
- I caught a cold and stayed home for two days.
- She has a bad cold and keeps sneezing.
