senseId: 'lineament%1:09:00::'
synsetId: 05857811-n
simpleMeaning: A mark that sets a thing's true nature.
scope: This sense is also called character and quality, for a mark that sets a thing's true nature, where
  character is the typical quality that makes a place or thing what it is, and quality is the special
  feel or character that something seems to have, unlike the sense for telling bits of one's face, the
  eyes with nose, mouth, chin.
examples:
- Lineament is a mark that sets true nature.
- Lineament sets a thing's true nature.
