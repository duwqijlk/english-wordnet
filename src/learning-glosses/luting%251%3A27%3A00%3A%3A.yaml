simpleMeaning: A paste or soft stuff that is pressed into a join or spread over a surface full of tiny
  holes, so that gas or liquid cannot pass through.
scope: A paste that seals a join or a surface full of tiny holes so gas or liquid cannot pass through,
  also called lute; not a glue and not a paint.
examples:
- The worker spread luting around the pipe joint to stop the gas leak.
- They used luting to seal the cracks in the old tank.
