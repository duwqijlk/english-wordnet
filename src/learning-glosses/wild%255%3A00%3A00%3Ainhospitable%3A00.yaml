simpleMeaning: Remote and gloomy, with nothing around; empty and deserted.
scope: A bleak, remote place that feels empty and deserted; not land left untamed and uncultivated, and
  not keen enthusiasm for something.
examples:
- They built the lighthouse on a wild stretch of coast miles from any town.
- The cottage stood alone on a wild, windswept moor.
