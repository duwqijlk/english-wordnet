simpleMeaning: To keep everyday clothes clean while doing dirty work, this loose one-piece cover-all or
  smock goes on over them.
scope: This loose one-piece cover-all worn over everyday clothes for dirty work is also called overall
  and boilers suit, not a tight-fitting garment and not one worn under other clothes.
examples:
- He pulled on a boilersuit before starting the dirty work.
- The boilersuit kept her everyday clothes clean.
