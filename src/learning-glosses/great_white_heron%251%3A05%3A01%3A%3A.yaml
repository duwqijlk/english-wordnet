simpleMeaning: In Florida and the Florida Keys lives a big water bird whose feathers are a very light
  colour
scope: A big water bird with very light feathers that lives in Florida and the Florida Keys, not a small
  water bird and not the common egret of the same name.
examples:
- We saw a great white heron wading in the shallows near the Keys.
- The great white heron stood still in the water, waiting for fish.
