synsetId: 06035262-n
simpleMeaning: A pattern of chances, worked out in thought, that comes close to the two-outcome pattern
  when the chance is small and the number of tries is large.
scope: A way of working out chances that comes close to the two-outcome way when the chance is small and
  the tries are many, not a way of counting things seen and not a rule for one try only.
examples:
- The Poisson distribution is used to work out rare events.
- A Poisson distribution fits the number of calls in an hour.
