senseId: 'biographism%1:09:01::'
synsetId: 92447157-n
simpleMeaning: reading what a piece of writing means as nothing more than the life of the person who wrote
  it
scope: Reading what a piece of writing means as nothing more than the life of the person who wrote it,
  not reading it for its own words and not reading it as a picture of its time.
examples:
- The critic's biographism turned the novel into a record of the writer's youth.
- Biographism treats every poem as a page from the poet's life.
