simpleMeaning: A number, given as a percent, that shows how wide a skull is at its widest compared with
  how long it is at its longest.
scope: A percent figure comparing a skull's width with its length; cephalic index and cranial index are
  other names for this sense, and it is not a head circumference.
examples:
- The breadth index of the skull was 78 percent.
- Anthropologists use the breadth index to compare skull shapes.
