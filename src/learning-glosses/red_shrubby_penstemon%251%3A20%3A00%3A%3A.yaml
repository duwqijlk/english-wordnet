simpleMeaning: a low, much-branched bush with dark green leaves and bunches of brick-red flowers at branch
  ends, growing on the coast hills and foothills of northern California
scope: Also called redwood penstemon; a low bush with brick-red flowers from the coast hills of northern
  California, not a tall tree.
examples:
- A red shrubby penstemon blooms with brick-red flowers in June.
- We saw red shrubby penstemon on the coastal hills of northern California.
