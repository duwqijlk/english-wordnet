simpleMeaning: To soak up extra wetness on the skin, this fine dust is made of a soft white mineral and
  is usually sweet-smelling.
scope: Also called talcum, this fine dust soaks up extra wetness on the skin.
examples:
- She put talcum powder on her feet before her shoes.
- He used talcum powder after his bath to stay dry.
