simpleMeaning: a paper from the state that gives a person a right or a special favour
scope: An official paper granting some right or privilege, not a document for an inventor's sole rights
  to an invention, and not the adjective meaning obvious.
examples:
- The king gave the company a patent to trade in the region.
- She showed the patent that gave her the right to run the ferry.
