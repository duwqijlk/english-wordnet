simpleMeaning: In psychology, the doing of a mixed thinking task; a working that changes what the mind
  holds
scope: In psychology, the doing of a mixed thinking task; process, operation, cognitive operation and
  cognitive process are other names for this, not a single simple thought and not a movement of the body.
examples:
- Thinking is a mental process.
- Remembering is a mental process that changes what the mind holds.
