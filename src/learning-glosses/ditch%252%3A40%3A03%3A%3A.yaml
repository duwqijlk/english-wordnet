simpleMeaning: To end a link with a person or a thing for good, most often in a rough or thoughtless way
scope: 'Also called dump: to cut off all ties with a person or a group, not a channel dug in the ground
  and not leaving a car or a plane in a crash.'
examples:
- She ditched her old friends after she moved to a new town.
- The firm ditched him after many years of hard work.
