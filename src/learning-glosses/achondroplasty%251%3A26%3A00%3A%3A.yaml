simpleMeaning: Soft bone-making tissue turns into hard bone in this bone sickness, passed down in the
  family and starting before birth, and it leaves the person very short.
scope: This is a bone sickness passed down in the family, also called achondroplasia, chondrodystrophy
  and osteosclerosis congenita, not a sickness that starts after birth.
examples:
- Achondroplasty starts before birth and leaves the person very short.
- The child's achondroplasty was passed down in the family.
