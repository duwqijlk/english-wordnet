simpleMeaning: Passed to people from sick birds, this lung illness is not of the usual kind, brought on
  by a tiny germ.
scope: It is also called ornithosis and psittacosis, and it is a lung illness not of the usual kind, brought
  on by a tiny germ and passed to people from sick birds.
examples:
- Parrot fever passed to him from a sick bird.
- He caught parrot fever from a sick bird.
