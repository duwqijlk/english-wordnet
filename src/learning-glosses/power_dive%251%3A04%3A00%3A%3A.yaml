simpleMeaning: A flying machine drops fast, made faster by its own weight pulling it down and by its engine
scope: A steep fall of a flying machine, not a fall of a swimmer into water and not a drop in prices.
examples:
- The pilot pulled the plane out of a power dive just above the trees.
- During the air show, the jet made a steep power dive toward the field.
