simpleMeaning: Blood is drawn out, split into its parts by dialysis, and some parts are kept while the
  rest go back into the giver by transfusion.
scope: It is also called apheresis, the treatment that draws blood out, splits it into parts by dialysis,
  and sends the rest back into the giver.
examples:
- Pheresis split her blood into its parts by dialysis.
- After pheresis, the rest of the blood went back into the giver.
