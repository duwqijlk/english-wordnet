simpleMeaning: a common perennial herb across the southern and eastern United States with drooping clusters
  of pink flowers and thick lower leaves like a paw, sometimes placed in genus Prenanthes.
scope: Another name for lion's foot; it is this pink-flowered woodland herb, not a plant gall or a bitter
  fluid from the liver.
examples:
- Gall of the earth blooms in late summer with drooping clusters of pink flowers.
- The thick leaves of gall of the earth stay close to the ground.
