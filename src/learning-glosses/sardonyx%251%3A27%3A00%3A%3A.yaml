simpleMeaning: Flat bands of a reddish stone lie side by side with a stone of another colour in this banded
  stone.
scope: The name is for a banded stone whose flat bands of a reddish stone lie side by side with a stone
  of another colour, not a stone of one colour all through.
examples:
- The sardonyx shows flat bands of two colours.
- Flat bands of two colours mark the sardonyx.
