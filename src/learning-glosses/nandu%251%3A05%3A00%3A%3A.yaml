simpleMeaning: From Peru to the Strait of Magellan lives the smaller of two tall, fast, flightless birds
  like ostriches, with three toes on each foot.
scope: People also call it rhea, the smaller of two tall, fast, flightless birds like ostriches, found
  from Peru to the Strait of Magellan.
examples:
- A nandu ran fast on its three-toed feet.
- Nandu live from Peru to the Strait of Magellan.
