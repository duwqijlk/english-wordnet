simpleMeaning: a kind of the card game canasta, played with three packs of cards and six joker cards
scope: This is a card game played with three packs of cards; it is not the lively dance from Brazil, and
  not the music for that dance.
examples:
- Samba uses three packs of cards and six jokers.
- They taught us samba, a kind of canasta, at the card club.
