simpleMeaning: A form of torture of the foot used in China, in which the victim's foot was put between
  three pieces of bamboo and squeezed bit by bit.
scope: This is a form of torture of the foot used in China, in which the victim's foot was put between
  three pieces of bamboo and squeezed bit by bit, not a beating and not a punishment ordered by a court.
examples:
- The kia quen squeezed the victim's foot between three pieces of bamboo.
- Prisoners feared the kia quen, a form of foot torture.
