simpleMeaning: A plant with wine, lavender, purple, black blooms in bunches on the upper half of leafy
  stems, growing from Montana south through the Rocky Mountains to Arizona and New Mexico.
scope: A mountain flower of the American West, also called Penstemon whippleanus; its nearest kin are
  other penstemons with bunched blooms on leafy stems.
examples:
- Whipple's penstemon was in flower on the high trail above the valley.
- We saw Whipple's penstemon growing in bunches on the rocky slope.
