simpleMeaning: Two tall stones most often stand up with one flat stone laid across the top of them in
  this very old burial place made of huge stones.
scope: A cromlech or a dolmen is another name for this very old burial place, made of huge stones rather
  than small ones.
examples:
- The portal tomb has two tall stones with a flat stone across the top.
- A portal tomb is made of huge stones.
