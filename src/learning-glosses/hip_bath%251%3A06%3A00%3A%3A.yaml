simpleMeaning: A tub for washing while seated, with the water covering the lower body as if sitting in
  a chair.
scope: A tub for washing while seated, not a full bath and not a shower.
examples:
- She took a hip bath to ease her sore back.
- The old house had a hip bath in the corner of the room.
