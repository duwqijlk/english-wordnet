simpleMeaning: So that a debt that has not been paid is met, the sheriff sells what a person owns on a
  court order.
scope: Also called an execution sale, a judicial sale, or a sheriff's sale, this names the court-ordered
  sale of what a person owns so that an unpaid debt is met.
examples:
- The forced sale of the house paid off the debt.
- A forced sale was ordered after the owner failed to pay.
