simpleMeaning: Above all a cornmeal loaf with bits of ham, and at times an Irish soda loaf, this is a
  cake most often cooked in a pan over an open fire.
scope: Also called skillet bread, this is a cake cooked in a pan over an open fire, not a loaf baked in
  an oven.
examples:
- She made fry bread in a pan over the open fire, with bits of ham in the mix.
- They ate the fry bread from the pan over the open fire.
