simpleMeaning: A word put before another word in everyday talk to say it is complete, often in a bad way
scope: Used in everyday talk before a word to say it is complete, often when criticizing something, also
  called perfect, complete, staring, utter, pure, thorough, and gross, not the bare plain truth with nothing
  held back.
examples:
- He is a stark fool to believe that story.
- It was stark nonsense from start to finish.
