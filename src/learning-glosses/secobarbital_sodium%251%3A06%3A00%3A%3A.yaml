simpleMeaning: Sold as Seconal, this barbiturate in salt form, a white powder with no smell and a slightly
  bitter taste, brings sleep and stops fits.
scope: Also called red devil and secobarbital, this is the salt form of a white powder drug that brings
  sleep and stops fits.
examples:
- Secobarbital sodium brought him sleep.
- The nurse gave secobarbital sodium to stop the fits.
