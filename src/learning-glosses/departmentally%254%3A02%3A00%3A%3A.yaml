simpleMeaning: in a way that depends on one part of an organisation
scope: It turns on one part of an organisation, not on the whole organisation, and not on one person alone.
examples:
- Departmentally, the decision belonged to the science faculty.
- The matter was settled departmentally, not by the whole college.
