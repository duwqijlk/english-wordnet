simpleMeaning: The company boss in charge of money, with the power to set aside funds and approve spending
scope: This is the company boss in charge of money, with the power to set aside funds and approve spending;
  chief financial officer is another name for this sense, and it is not the boss in charge of the whole
  running of the firm.
examples:
- The CFO signed off on the new budget.
- Our CFO will speak at the meeting about spending.
