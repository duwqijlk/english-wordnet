scope: A long bar hung from a crane hook to lift loads, not a plain bar used to hold up a roof and not
  a rope sling on its own.
examples:
- The spreader beam lifted the load with ropes tied along its length.
- Workers fixed the spreader beam to the crane hook before the lift.
