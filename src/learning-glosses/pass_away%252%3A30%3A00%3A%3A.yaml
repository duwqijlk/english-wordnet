simpleMeaning: To lose all the body needs to stay alive, and so leave this life
scope: 'Also called die, go, pass, choke, exit, croak, decease, expire, perish, conk, buy the farm, cash
  in one''s chips, drop dead, give-up the ghost, kick the bucket, and pop off: to stop living, not to
  leave a place and not to fall asleep.'
examples:
- Her grandfather passed away last winter.
- He passed away in his sleep.
