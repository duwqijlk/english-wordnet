simpleMeaning: A fairly large lot of shares, bonds or goods goes at a low price, most often to clear them
  out rather than as everyday trade.
scope: This word names a sale of a fairly large lot at a low price, made to clear the lot out rather than
  as everyday trade.
examples:
- The selloff cleared out a large lot of shares at a low price.
- They held a selloff of bonds at a low price.
