simpleMeaning: A creeping plant from Europe, now found in warm lands round the world; used for lawns and
  fields for grazing, above all in the southern United States and India.
scope: 'Also called devil grass, doob, kweek, scutch grass, star grass, Bermuda grass and Cynodon dactylon:
  a creeping plant from Europe, now found in warm lands round the world and used for lawns and grazing
  fields.'
examples:
- Bahama grass covers the lawn in the southern yard.
- The farmer sowed Bahama grass for pasture in the warm field.
