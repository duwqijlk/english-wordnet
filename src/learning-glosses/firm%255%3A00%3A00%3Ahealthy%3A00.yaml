simpleMeaning: with the springy quality of healthy body tissue
scope: This describes body tissue that is healthy and springy, not an object that resists pressure, and
  not a voice or movement free from trembling.
examples:
- The doctor was pleased to find firm muscles after the long illness.
- Regular exercise keeps the skin firm.
