simpleMeaning: to be drawn to a model bird set out to attract wild birds, said of wild birds themselves
scope: Said of wild birds that come to a model bird a hunter sets out; not the sense of the hunter drawing
  birds in with the model, and not a plant growing shoots.
examples:
- The ducks stooled readily and flew in toward the wooden birds.
- Geese that stool to the decoys make the hunt easy.
