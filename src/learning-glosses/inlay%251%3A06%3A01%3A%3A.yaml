senseId: 'inlay%1:06:01::'
synsetId: 03577782-n
simpleMeaning: In dentistry, a filling made as one solid piece, such as gold or porcelain, shaped to fit
  a hole in a tooth and fixed there with cement
scope: This is a filling for a tooth, not a piece of wood fitted into a surface as a decoration.
examples:
- The dentist fitted a gold inlay into the damaged tooth.
- Her porcelain inlay matched the colour of her other teeth.
