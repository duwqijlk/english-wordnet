simpleMeaning: White flour of good worth comes from this African grass, which matters as a food grain
  and is also cut as feed for farm animals and hay.
scope: A grass from Africa that matters as a food grain, giving white flour of good worth, and also as
  feed for farm animals and hay; teff grass is another name for it.
examples:
- Teff gives white flour of good worth.
- Farmers cut teff for hay as well as for grain.
