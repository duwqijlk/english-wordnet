simpleMeaning: the quality of not staying the same, but changing or being different
scope: Also called variability. This is the quality of changing or being different, not an official permission
  to break a building rule and not a maths measure of how numbers spread out from their average.
examples:
- There is a lot of variance in the children's heights.
- Variance in the weather makes farming hard in this area.
