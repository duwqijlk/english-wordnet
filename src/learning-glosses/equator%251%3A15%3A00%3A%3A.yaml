simpleMeaning: an imaginary line around the Earth, making its biggest circle, at the same distance from
  the North Pole and the South Pole
scope: The line around the Earth only, not a line around any other ball or round surface.
examples:
- The equator passes through hot lands near the middle of the Earth.
- The crew marked the day their ship crossed the equator.
