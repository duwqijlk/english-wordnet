simpleMeaning: Bringing about a state of things that works against success or gets in the way of doing
  a thing well.
scope: 'Also called unfavourable: a state of things that works against success, not wind or weather that
  works against you and not a thing that is merely not to your liking.'
examples:
- The unfavorable terms of the deal hurt their chances of success.
- An unfavorable outcome followed the long delay.
