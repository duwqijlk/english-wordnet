simpleMeaning: A tall tree that grows fast and gives timber, with leaves holding a healing oil, and its
  young leaves are of a sky colour.
scope: A tall tree that grows fast and gives timber, with leaves holding a healing oil; fever tree is
  another name for this sense, not a slow-growing tree and not a tree with no oil in its leaves.
examples:
- The blue gum grows fast in warm lands.
- Blue gum leaves hold a healing oil.
