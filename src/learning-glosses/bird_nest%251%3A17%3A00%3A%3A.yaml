simpleMeaning: A place built by a flying creature where it lays eggs and its young hatch.
scope: A place built by a flying creature for its eggs and young; bird's nest and birdnest are other names
  for this sense, not a hole in the ground and not a cage.
examples:
- A bird nest rested on the window ledge.
- The bird nest was empty after the young had flown.
