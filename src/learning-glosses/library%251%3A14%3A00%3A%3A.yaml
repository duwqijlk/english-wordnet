simpleMeaning: A set of books, papers, or recordings kept together so that people can consult them or
  borrow them.
scope: This is the collection itself, not the building or room that holds it, and not a set of computer
  programs.
examples:
- The school has a large library of children's books.
- He built a private library of rare maps and letters.
