schema: oewn-learning-gloss-v2
senseId: exchangeable%5:00:00:replaceable:00
synsetId: 01985596-s
simpleMeaning: Able to take the place of another thing or swap places with it, so each can stand in for
  the other with no loss of use or fit.
scope: Able to swap places with another thing with no loss of use, also called similar, standardized,
  interchangeable, and standardised; not a thing that must stay in one place and not a thing that only
  looks the same.
examples:
- The two plugs are exchangeable, so either fits the socket.
- These parts are exchangeable with no loss of how well they work.
