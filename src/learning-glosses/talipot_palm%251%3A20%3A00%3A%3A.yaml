simpleMeaning: In southern India and Sri Lanka grows a tall palm whose huge leaves are used as umbrellas
  and fans or cut into strips for writing paper.
scope: Also called talipot, this is a tall palm of southern India and Sri Lanka.
examples:
- They fanned themselves with talipot palm leaves.
- He wrote on strips cut from talipot palm leaves.
