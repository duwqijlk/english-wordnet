simpleMeaning: The taking of minerals and mineral salts out of a liquid, above all out of water
scope: Taking minerals and their salts out of a liquid, above all water, also called demineralisation;
  not adding minerals and not simple filtering.
examples:
- Demineralization leaves the water free of salts.
- The plant uses demineralization to clean its water.
