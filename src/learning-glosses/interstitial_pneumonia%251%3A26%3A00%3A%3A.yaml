simpleMeaning: A long-term lung illness that harms the tissue between the air sacs of the lungs.
scope: A long-term lung illness that harms the tissue between the air sacs of the lungs; not a short illness
  from germs and not a lung illness from smoke alone.
examples:
- Interstitial pneumonia made breathing hard over months.
- The scan showed interstitial pneumonia in both lungs.
