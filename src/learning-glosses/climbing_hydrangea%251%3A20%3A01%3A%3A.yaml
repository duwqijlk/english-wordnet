simpleMeaning: a shrub that clings with sticky aerial roots, bearing paired leaves and clusters of small
  white flowers at branch tips; it ranges from the Himalayas to Taiwan and Japan
scope: A climbing shrub from Asia with small white flower clusters; not the deciduous climbers with large
  flat heads that share the name.
examples:
- Climbing hydrangea holds on to the wall with its aerial roots.
- The climbing hydrangea bore small white flowers in clusters.
