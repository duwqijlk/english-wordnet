simpleMeaning: Of a dog, to make long, drawn-out barking sounds.
scope: This is a dog's long bark; it is not a person speaking in deep tones, not a coastal inlet, and
  not the tree.
examples:
- The hounds bayed at the moon all night.
- A dog bayed somewhere in the dark woods.
