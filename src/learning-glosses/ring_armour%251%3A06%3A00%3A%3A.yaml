simpleMeaning: (Middle Ages) a bendy coat worn for defence, made from many small metal loops linked together
scope: 'Also called mail, chain armor, chain armour, chain mail, ring armor and ring mail: a bendy coat
  of defence from the Middle Ages made of linked metal loops, not a solid plate coat and not a cloth coat.'
examples:
