simpleMeaning: A germ brings on a sudden sickness in which the nerve cells of the brain stem and the cord
  down the back swell
scope: It is also called polio, acute anterior poliomyelitis, and poliomyelitis.
examples:
- The doctor said the infantile paralysis came from a germ.
- The infantile paralysis swelled the nerve cells of the brain stem and spinal cord.
