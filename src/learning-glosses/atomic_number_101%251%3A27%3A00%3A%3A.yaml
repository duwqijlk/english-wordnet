simpleMeaning: A man-made radioactive element made by striking einsteinium with alpha bits; its present
  sign is Md, for mendelevium, while Mv was its old sign.
scope: Also called Md, mendelevium, and Mv; a man-made radioactive element, not one found in nature.
examples:
- Atomic number 101 is the place of mendelevium in the list of elements.
- Mendelevium has atomic number 101.
