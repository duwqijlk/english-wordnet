senseId: 'syncytium%1:08:00::'
synsetId: 05613517-n
simpleMeaning: Held in one thin skin with no walls inside, this lump of living stuff holds many centres,
  as in muscle threads.
scope: This lump of living stuff is not a group of cells each with walls of its own, since it holds many
  centres in one thin skin.
examples:
- The muscle held a syncytium with many centres.
- A syncytium in the muscle showed no walls inside.
