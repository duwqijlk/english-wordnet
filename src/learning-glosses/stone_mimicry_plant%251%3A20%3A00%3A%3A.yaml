simpleMeaning: Plants with no stem at all form tight clumps of grey-green leaves in South Africa, full
  of water and with the feel of lumps of granite.
scope: 'Also called living granite and living rock: plants with no stem that grow in tight clumps of grey-green
  leaves full of water, in South Africa.'
examples:
- The stone mimicry plant grows in clumps in South Africa.
- The stone mimicry plant has thick grey-green leaves and no stem.
