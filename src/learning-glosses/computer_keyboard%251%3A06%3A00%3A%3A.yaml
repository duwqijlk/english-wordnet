simpleMeaning: Set out like those of a typewriter, these keys put words and numbers into a machine.
scope: Also called keypad, this is the set of keys for putting words and numbers into a machine, not the
  keys of a typewriter itself.
examples:
- The computer keyboard has keys set out like a typewriter's.
- I typed the letter on the computer keyboard.
