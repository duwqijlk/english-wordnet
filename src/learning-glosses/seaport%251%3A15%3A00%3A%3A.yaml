simpleMeaning: a safe place by the sea where ships are kept from bad weather and can load and unload goods
scope: 'Also called harbor, harbour, and haven: a safe place by the sea where ships load and unload goods,
  not a place far from the sea for planes or trains.'
examples:
- Ships came into the seaport to unload their goods.
- The small seaport was safe for ships in bad weather.
