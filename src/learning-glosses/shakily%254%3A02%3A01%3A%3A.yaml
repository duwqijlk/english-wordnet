simpleMeaning: in a way that is weak and not firm, so it could easily fall apart
scope: In a weak, unsteady way, as when support is thin, not the physical trembling of a hand or a voice.
examples:
- The theory is shakily supported by some obscure data.
- Her argument rested shakily on a single old letter.
