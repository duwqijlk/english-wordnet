simpleMeaning: A small ball of cork or rubber ringed with feathers, the piece players hit over the net
  in badminton
scope: The feathered piece hit over the net in badminton, also called a bird, not the weaving holder and
  not a bus going back and forth.
examples:
- He smashed the shuttle over the net.
- The shuttle landed just inside the line.
