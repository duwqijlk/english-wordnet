schema: oewn-learning-gloss-v2
senseId: 'symmetrical%3:00:00::'
synsetId: 02380286-a
simpleMeaning: having parts that match each other in size and shape and in where they stand in relation
  to each other
scope: Also called symmetric. This sense is about parts that match in size, shape, and place, not the
  wider sense where different parts or things match or balance each other.
examples:
- The house has a symmetrical front, with a window on each side of the door.
- Her face looked almost perfectly symmetrical in the photo.
