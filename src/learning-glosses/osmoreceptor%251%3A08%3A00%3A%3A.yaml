simpleMeaning: A part of the body that feels changes in how strong the body's water is
scope: A body part that feels changes in how strong the body's water is, not a part that feels heat or
  touch and not a part that moves the body.
examples:
- Osmoreceptors in the brain sense when the body's water grows too strong.
- The osmoreceptor told the brain that the water in the blood had grown too strong.
