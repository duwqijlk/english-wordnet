simpleMeaning: A ground pine found widely along the eastern and southeastern coasts of the United States,
  in wet, bare sandy or peaty soil, its stems densely covered in bristly leaves.
scope: This is a clubmoss, a ground pine thickly clad in bristly leaves, not a true grass despite the
  word grass in its name. It grows in bare wet coastal ground of the eastern and southeastern United States.
examples:
- Foxtail grass spread across the bare sandy ground behind the dunes.
- We found foxtail grass growing in peaty soil near the coast.
