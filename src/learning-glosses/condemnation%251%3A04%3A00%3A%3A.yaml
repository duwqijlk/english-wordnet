senseId: 'condemnation%1:04:00::'
synsetId: 01225746-n
simpleMeaning: In law, the act of taking land away from its owner for public use, or saying that food
  or a building is not safe or fit to use
scope: This law sense is about taking land for public use or saying food or a building is not fit to use.
  It is not speaking out against something as wrong, and it is not a court finding a person guilty and
  giving a punishment.
examples:
- The condemnation of the empty field let the city build a new road there.
- After the condemnation of the unsafe building, no one was allowed to live in it.
