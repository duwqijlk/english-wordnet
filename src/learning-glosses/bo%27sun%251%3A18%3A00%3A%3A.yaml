simpleMeaning: an officer of low rank on a trading ship, in charge of the work done by the other sailors
scope: 'Also called bo''s''n, boatswain, bos''n or bosun: an officer of low rank on a trading ship, in
  charge of the other sailors'' work, not the captain and not an ordinary sailor.'
examples:
- The bo'sun ordered the crew to raise the sails.
- The old bo'sun knew every rope on the ship.
