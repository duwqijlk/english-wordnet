simpleMeaning: The officer in charge of ACLANT, a United States Army general put forward by the President
  and agreed by the council of the NATO alliance.
scope: This is the officer in charge of ACLANT, a United States Army general put forward by the President
  and agreed by the council of the NATO alliance; SACLANT is another name for this post, not the officer
  in charge of ACE and not a naval officer.
examples:
- The Supreme Allied Commander Atlantic leads the forces of ACLANT.
- A general was named Supreme Allied Commander Atlantic by the President.
