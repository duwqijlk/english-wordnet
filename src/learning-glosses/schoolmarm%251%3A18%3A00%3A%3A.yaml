simpleMeaning: A school-teacher, a woman, especially one held to be strict.
scope: This sense is also called mistress and schoolmistress, for a school-teacher, a woman, especially
  one held to be strict, where mistress is a woman who teaches at a school, especially one people think
  is strict.
examples:
- The schoolmarm was a school-teacher, especially held to be strict.
- Schoolmarms teach at school.
