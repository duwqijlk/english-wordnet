simpleMeaning: In botany, before a bud opens, the outer and inner flower leaves lie in a set order inside
  it.
scope: In botany, this is also called aestivation, and it is the way flower leaves lie in a bud, not the
  summer rest of animals.
examples:
- The petals showed estivation in the closed bud.
- The estivation of the flower could be seen before it opened.
