simpleMeaning: Able to be tested by trying it out or by watching closely, so it can be shown to be true
  or false
scope: 'Also called confirmable and falsifiable: able to be tested by trying out or by watching, not just
  able to be checked in a general way and not already proved true.'
examples:
- The claim is verifiable because we can test it by measuring the water each day.
- A verifiable result must be one that others can check by doing the test again.
