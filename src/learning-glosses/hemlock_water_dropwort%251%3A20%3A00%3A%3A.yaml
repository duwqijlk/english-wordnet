simpleMeaning: A poisonous European plant with tuber-like roots, yellow flowers and celery-like leaves,
  whose yellow sap stains the skin, and every part of which is extremely poisonous.
scope: This is not hemlock despite its name, and not celery although its leaves look like it; it is a
  separate poisonous plant.
examples:
- The yellow sap of hemlock water dropwort stains the skin.
- Every part of the hemlock water dropwort is extremely poisonous.
