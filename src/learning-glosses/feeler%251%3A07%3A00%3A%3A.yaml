simpleMeaning: a sharp power to notice things, like a body part that picks up touch or taste
scope: 'Also called antenna: this is a power to notice things, not a thin touch part on a fish or on an
  insect''s head, and not a suggestion put out to see how others act.'
examples:
- She has a real feeler for what the public will like.
- His feeler for trouble made him check the locked door twice.
