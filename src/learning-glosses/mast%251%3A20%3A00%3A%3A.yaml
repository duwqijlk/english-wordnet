simpleMeaning: Acorns, beechnuts and other forest-tree nuts that collect on the ground.
scope: This is the collective name for fallen tree nuts, not the same nuts when used as pig feed, nor
  the upright poles that share the word.
examples:
- After the storm, fallen mast lay thick beneath the beech trees.
- Deer browse the mast on the forest floor through the winter.
