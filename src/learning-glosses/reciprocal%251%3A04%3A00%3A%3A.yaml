schema: oewn-learning-gloss-v2
senseId: 'reciprocal%1:04:00::'
synsetId: 00852776-n
simpleMeaning: breeding that uses a pair of crosses, where the sexes linked to each set of genes are swapped
  from one cross to the other
scope: Also called reciprocal cross, this is a pair of breeding crosses with the sexes swapped for each
  gene type, not the maths sense of a number that gives 1 when multiplied by another number.
examples:
- The team set up a reciprocal to test whether the mother or the father passed on the trait.
- A reciprocal gave a different result when the sexes of the parent plants were swapped.
