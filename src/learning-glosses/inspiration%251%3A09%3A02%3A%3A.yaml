simpleMeaning: the mind becoming active in a special and unusual way, so a person does unusual things
  or creates new things
scope: This is the mind becoming active and ready to create; it is not breathing in air, not a god's special
  effect on people's minds, and not a sudden idea that solves a problem.
examples:
- The walk in the hills gave her inspiration for a new song.
- He found inspiration in the old photos and started to paint again.
