simpleMeaning: to put something on a long seat so people can see it
scope: This sense is putting something on a bench for people to see, as at a dog show. It is not lifting
  a weight or doing exercise, and not a bench as a seat or a work table.
examples:
- They benched the poodles at the dog show.
- The owner benched his dog for the judges to see.
