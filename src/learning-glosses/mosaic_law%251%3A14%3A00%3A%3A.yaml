simpleMeaning: The rules God gave to the Israelites through Moses, starting with the Ten Commandments,
  with many rules of worship from the Old Testament's first five books, the Torah in Judaism
scope: Also called the Law of Moses; the rules God gave to the Israelites through Moses, not the rules
  of another faith and not the laws of a king.
examples:
- Mosaic law begins with the Ten Commandments.
- The Mosaic law rules come from the first five books of the Old Testament.
