simpleMeaning: The main unit of money in Kenya is made up of one hundred cents.
scope: Also called a shilling, this is the main unit of money in Kenya, not the money of another country.
examples:
- He paid ten Kenyan shillings for the meal.
- The Kenyan shilling is the money used in Kenya.
