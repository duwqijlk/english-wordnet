simpleMeaning: a worker who can get work only at certain times of the year
scope: A person who works only at certain times of the year, not the word for something that happens in
  or depends on one time of year.
examples:
- The farm hires seasonals to pick fruit in the summer.
- Many seasonals travel to the coast for hotel work each summer.
