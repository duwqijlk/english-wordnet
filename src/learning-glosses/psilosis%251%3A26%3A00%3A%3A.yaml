synsetId: 14424383-n
simpleMeaning: a lasting illness that strikes people in hot regions and elsewhere, in childhood and adulthood;
  the body fails to absorb nutrients, causing wasting and smelly diarrhea.
scope: Another name for sprue and tropical sprue, a long-term illness in which the body does not absorb
  nutrients properly; not the separate sense where psilosis means hair falling out.
examples:
- Older medical texts still use psilosis for this wasting illness.
- Untreated psilosis can leave a patient severely emaciated.
