simpleMeaning: A flower cluster in which the flowers or side stems come one after another on opposite
  sides
scope: A flower cluster with flowers or side stems coming one after another on opposite sides, not a cluster
  with flowers all along one stem and not one with all the flowers on the same side.
examples:
- The scorpioid cyme opened its flowers one side at a time.
- In a scorpioid cyme the branches take turns on opposite sides.
