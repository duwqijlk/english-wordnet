simpleMeaning: the process of a baby's teeth coming through the gums
scope: This sense is a baby's first teeth coming through, not teeth coming in for older children or adults.
examples:
- Teething kept the baby awake at night.
- Her teething started at six months, and one small tooth soon showed.
