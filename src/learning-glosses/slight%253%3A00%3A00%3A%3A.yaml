simpleMeaning: 'Used of things without a count, meaning a small amount: hardly any, or with "a", at least
  a little.'
scope: Another name for this sense is little; it measures amount, unlike the senses for a claim lacking
  substance or a person of slender build.
examples:
- There was slight swelling around the ankle.
- He showed slight interest in the offer.
