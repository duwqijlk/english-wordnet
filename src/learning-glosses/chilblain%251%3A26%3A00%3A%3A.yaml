simpleMeaning: a painful red swelling on the hands and feet, caused by being out in cold and wet
scope: 'Also called chilblains: a painful red swelling caused by cold and wet, not a cut and not a pain
  with no swelling.'
examples:
- Working outside in the wet cold gave him a chilblain on his hand.
- She had chilblains on her feet after the long winter walk.
