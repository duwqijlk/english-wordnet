simpleMeaning: a poisonous plant from northern Europe with blue-purple blooms shaped like a hood; a strong
  poison called aconite comes from its dried leaves and roots
scope: 'Also called helmet flower and monkshood: a poisonous plant with hooded blue-purple blooms, not
  an orchid or a skullcap plant with the same name.'
examples:
- The helmetflower in the wood is poisonous, so we left it alone.
