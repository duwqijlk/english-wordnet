simpleMeaning: Going onto another person's property without the right to do so, for an unlawful purpose.
scope: Going onto another's property without the right, for an unlawful purpose; break-in and housebreaking
  are other names for this sense, not a burglary itself and not a break for rest.
examples:
- The charge was breaking and entering after the shop door was forced.
- Breaking and entering is a crime even if nothing is taken.
