simpleMeaning: a sharp pointed part that is fixed to the cartridge, the small part that holds it, on a
  record player
scope: A sharp part on a record player, not the pointed tool used for writing, drawing, or cutting designs.
examples:
- The stylus on his record player was worn, so the music sounded rough.
- She put in a new stylus before playing the old record.
