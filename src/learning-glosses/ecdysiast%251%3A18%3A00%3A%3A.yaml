simpleMeaning: a person who takes off clothes to music in front of an audience to give them sexual pleasure
scope: 'Also called stripper, peeler, striptease and exotic dancer: a person who undresses to music for
  an audience, not an actor in a play and not a dancer who keeps clothes on.'
examples:
- The ecdysiast came on stage and began to undress to the music.
- She worked as an ecdysiast in a nightclub.
