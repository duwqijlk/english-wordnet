simpleMeaning: the use of chemicals holding gold to treat sickness, such as rheumatoid arthritis, a disease
  that makes the joints hurt and swell
scope: The use of chemicals holding gold to treat sickness, such as rheumatoid arthritis; not a treatment
  with plain gold rings and not a herbal cure.
examples:
- Her doctor tried chrysotherapy for her arthritis.
- Chrysotherapy uses gold chemicals to ease joint disease.
