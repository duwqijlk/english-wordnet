simpleMeaning: a sickness that harms the main stems of pear trees and apple trees
scope: This is a tree sickness, not a sickness of leaves or fruit and not a sickness of other trees.
examples:
- Collar blight killed two of the pear trees.
- The farmer found collar blight on the trunk of an apple tree.
