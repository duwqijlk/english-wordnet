simpleMeaning: In botany, the growth of a fruit that has no seeds and forms without the joining of male
  and female cells
scope: In botany, fruit that grows with no seeds and no joining of male and female cells, not fruit grown
  from seed and not a fruit with seeds inside.
examples:
- The parthenocarpy of this fruit means it grows with no seeds.
- Parthenocarpy lets a fruit form without seeds.
