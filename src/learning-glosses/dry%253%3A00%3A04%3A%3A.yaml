simpleMeaning: opposed to making and selling alcoholic drinks, or having a rule that forbids it
scope: This describes a person, group or place that is against alcohol, not a drink that is low in sugar,
  and not something lacking water.
examples:
- The state voted to go dry in 1919.
- Preachers led the dry campaign against the saloons.
