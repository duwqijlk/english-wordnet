simpleMeaning: Flowers in flat-topped bunches mark this plant of the bare shale ground in Virginia, which
  lives for many years and blooms late.
scope: This is a plant of the shale barrens of Virginia, not the African water plant of the same name.
examples:
- The umbrella plant blooms late on the shale barrens of Virginia.
- An umbrella plant with flat-topped bunches of flowers grew on the bare ground.
