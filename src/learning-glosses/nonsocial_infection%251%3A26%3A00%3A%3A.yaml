simpleMeaning: A germ sickness picked up in a hospital or other place where people get health care
scope: A germ sickness picked up in a hospital or health care centre, also called cross infection, and
  not a sickness caught from other people in daily life.
examples:
- She got a nonsocial infection during her stay in hospital.
- The nonsocial infection spread quickly among patients on the ward.
