simpleMeaning: a light food with holes in it, made from eggs, flour and sugar, with no fat mixed in
scope: A light food with holes in it, made from eggs, flour and sugar with no fat; not a heavy cake and
  not a washing sponge.
examples:
- She baked a sponge cake with eggs, flour and sugar and no fat.
- The sponge cake was so light that it seemed full of air.
