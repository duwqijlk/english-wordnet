simpleMeaning: a tall rush plant with soft stems that stand straight up or bend over; it grows in Europe
  and Asia, Australia, and New Zealand, and is common in North America
scope: 'Also called bullrush, common rush, and soft rush: this is the tall soft-stemmed plant of wet places,
  not another waterside plant such as the one with a thick brown head.'
examples:
- Bulrushes grew tall along the edge of the pond.
- The soft stems of the bulrush bent over the water.
