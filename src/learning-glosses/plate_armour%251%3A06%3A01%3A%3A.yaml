simpleMeaning: In the 1300s, mail gave way to this old body covering made of iron or steel sheets
scope: 'Another name for plate armor: this old body covering of iron or steel sheets took the place of
  mail in the 1300s, and it is not the steel plate that guards a fort or a car.'
examples:
- The knight's plate armour shone in the sun.
- Plate armour took the place of mail in the 1300s.
