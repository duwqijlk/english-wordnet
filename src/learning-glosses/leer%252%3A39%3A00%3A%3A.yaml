simpleMeaning: to look at someone from the side with a sly, rude, or evil look that hints at something
  improper
scope: To look at someone in a sly, improper way, not the look itself on a face.
examples:
- The men leered at the young women on the beach.
- He leered at her across the room, and she turned away.
