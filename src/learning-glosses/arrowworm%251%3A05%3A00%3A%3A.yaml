simpleMeaning: A transparent sea worm of the group Chaetognatha, with horizontal side and tail fins and
  movable curved spines on each side of the mouth.
scope: Another name for chaetognath, the small transparent sea worm with side and tail fins and spines
  beside its mouth; not an earthworm, and not a roundworm.
examples:
- An arrowworm drifted through the sample, its body almost invisible in the water.
- Arrowworms are common in plankton and use their mouth spines to seize prey.
