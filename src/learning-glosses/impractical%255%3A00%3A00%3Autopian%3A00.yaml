simpleMeaning: Based on hopes and guesses, not on what can really be done
scope: Based on hopes, not on what can be done, with airy and windy as other names for this sense, not
  a plan that fails for want of money only and not a person who ignores practical matters.
examples:
- His impractical schemes for getting rich came to nothing.
- They talked of airy, impractical plans to change the world.
