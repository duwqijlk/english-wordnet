simpleMeaning: A flap with two pointed parts, set between the upper and lower rooms on the left side of
  the heart
scope: A flap with two pointed parts between the upper and lower rooms on the left side of the heart;
  bicuspid valve and left atrioventricular valve are other names for this flap, not a flap with three
  parts and not a flap on the right side of the heart.
examples:
- The mitral valve closed after each beat of the heart.
- A faulty mitral valve let blood flow back into the upper room.
