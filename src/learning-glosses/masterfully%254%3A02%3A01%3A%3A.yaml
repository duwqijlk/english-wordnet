simpleMeaning: in a way that shows great skill, as a person with great skill in the work would do it
scope: This says how well a thing is done, with great skill, not in a bossy way and not just with great
  strength.
examples:
- The young boy played the violin masterfully.
- She handled the hard talks masterfully and kept everyone calm.
