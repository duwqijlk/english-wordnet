simpleMeaning: to fix something in place with small, short pins that have a flat top
scope: This is fixing something in place with a small, short pin that has a flat top; not the pin itself,
  which is the noun sense of the same word.
examples:
- She thumbtacked the poster to the notice board.
- He thumbtacked a note to the cork board.
