senseId: 'pancreatin%1:27:00::'
synsetId: 14873165-n
simpleMeaning: An extract of animal pancreas containing its enzymes, used for pancreatitis (inflammation
  of the pancreas) and other conditions where the pancreas releases too little digestive fluid.
scope: It is an extract from the pancreas of animals that supplies pancreatic enzymes, not the natural
  secretion the pancreas itself releases in the body.
examples:
- The doctor prescribed pancreatin for a condition involving too little digestive fluid from the pancreas.
- Pancreatin contains enzymes taken from animal pancreas.
