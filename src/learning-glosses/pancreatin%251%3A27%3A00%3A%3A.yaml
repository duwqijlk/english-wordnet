simpleMeaning: Taken from the pancreas of animals, this stuff holds the pancreas's own enzymes and treats
  a swollen pancreas and other ills where the pancreas makes too little juice.
scope: A stuff taken from the pancreas of animals, used to treat a swollen pancreas and other ills where
  the pancreas makes too little juice.
examples:
- The doctor gave him pancreatin for his swollen pancreas.
- Pancreatin helps when the pancreas makes too little juice.
