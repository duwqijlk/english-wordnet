simpleMeaning: a librarian who sorts books and other printed works into groups by kind
scope: 'Also called cataloger: a librarian who sorts printed works into groups by kind, not a librarian
  who lends books and not a person who sells books.'
examples:
- The cataloguer spent the morning sorting new books into groups by kind.
- Ask the cataloguer where the books on birds are kept.
