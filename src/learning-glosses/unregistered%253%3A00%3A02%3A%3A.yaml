simpleMeaning: of animals, not put on the list of an official group that records animals of one kind and
  says an animal truly is of that kind
scope: This sense is only about animals and their kind, not about a boat that does not have official papers.
examples:
- The farmer kept unregistered cattle on his land.
- They sold the unregistered horses without official papers for their kind.
