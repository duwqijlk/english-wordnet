simpleMeaning: A group of Protestant and eastern Christian bodies that work together for unity and joint
  action in faith and in everyday life.
scope: This joins many Protestant and eastern churches to work for unity in faith and in everyday life;
  it is a body of churches, not one church on its own.
examples:
- The World Council of Churches met to talk about unity.
- Many churches belong to the World Council of Churches.
