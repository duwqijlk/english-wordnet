simpleMeaning: A warning that makes a person watchful and ready to face danger
scope: A warning that makes a person watchful, not a bell or sound that warns of danger, and not the act
  of warning someone.
examples:
- The alert about the storm made people watch for danger.
- After the alert, the town stayed watchful through the night.
