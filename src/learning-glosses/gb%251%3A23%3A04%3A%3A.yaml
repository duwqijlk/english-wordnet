simpleMeaning: A unit of information equal to one thousand megabits, or one billion bits.
scope: A unit of information, also called gigabit or Gbit, not the byte unit GB and not the magnetomotive
  unit Gb.
examples:
- The connection runs at ten Gb per second.
- This cable carries one Gb of data.
