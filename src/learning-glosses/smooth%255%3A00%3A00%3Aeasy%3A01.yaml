simpleMeaning: It describes a situation free of obstacles or trouble, so things go forward without hindrance.
scope: This is a situation or process free of trouble, not motion that runs without jolts and not the
  act of clearing obstacles away.
examples:
- Negotiations were smooth from the start, with no disputes at all.
- Despite the tight deadline, the launch was smooth and uneventful.
