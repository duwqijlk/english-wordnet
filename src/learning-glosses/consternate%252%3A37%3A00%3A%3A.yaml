simpleMeaning: To fill someone with fear, worry, dismay, or confusion.
scope: To fill someone with fear, worry, or confusion, not simply to surprise them and not to make them
  angry.
examples:
- The sudden news consternated the whole family.
- She was consternated by the strange letter.
