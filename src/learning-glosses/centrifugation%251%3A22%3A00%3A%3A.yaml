senseId: 'centrifugation%1:22:00::'
synsetId: 13466469-n
simpleMeaning: the way of sorting stuff that is heavy for its size from stuff that is light for its size
  by spinning it round very fast in a machine
scope: A way of sorting stuff by spinning it fast, not a way of sorting stuff by letting it settle on
  its own.
examples:
- Centrifugation pulled the red cells to the bottom of the tube.
- The lab used centrifugation to split the cream from the milk.
