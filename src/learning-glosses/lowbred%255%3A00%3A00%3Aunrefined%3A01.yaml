simpleMeaning: Of a person, coarse and uncultured in manner, with no elegance or social polish.
scope: This is a lasting coarseness of manner, not a single act of bad manners.
examples:
- The lowbred foreman spat on the floor and laughed at the lady's accent.
- She found his lowbred manners impossible to overlook.
