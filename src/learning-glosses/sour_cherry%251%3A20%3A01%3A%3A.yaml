simpleMeaning: a fairly small tree from Europe and Asia that grows sharp-tasting fruit you can eat, red
  to black in colour
scope: A fairly small tree from Europe and Asia with sharp-tasting red to black fruit you can eat, also
  called sour cherry tree; not a sweet cherry tree, and not a wild plum tree.
examples:
- A sour cherry grows beside the fence in our garden.
- The sour cherry by the gate is full of dark red fruit.
