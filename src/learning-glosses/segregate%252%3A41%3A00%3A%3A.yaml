senseId: 'segregate%2:41:00::'
synsetId: 02487728-v
simpleMeaning: to keep people apart because of race or religion, and to carry out a set of rules that
  keeps people apart because of race
scope: This is the verb for keeping people apart by race or religion as a rule; not the noun for a person
  who has been kept apart, and not just putting different things in different places.
examples:
- The old law segregated schools by race.
- The town segregated its swimming pools, with different pools for different races.
