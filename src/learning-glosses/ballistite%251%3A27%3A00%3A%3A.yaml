simpleMeaning: A blast powder that burns with quite little smoke, made with treated cotton called pyrocellulose
  and used to drive shells and bullets forward.
scope: This is a blast powder that burns with quite little smoke, made with treated cotton called pyrocellulose;
  smokeless powder is another name for it, and it is not a powder that makes much smoke or a powder used
  only for fireworks.
examples:
- Ballistite burns with quite little smoke.
- Gunners used Ballistite to drive shells forward.
