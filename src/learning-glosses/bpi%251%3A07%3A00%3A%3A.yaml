simpleMeaning: A count of how closely bits of information are packed on a thing that stores them
scope: A count of how closely bits of information are packed on a thing that stores them, also called
  bits per inch; not a count of words on a page and not the size of the store itself.
examples:
- The disk's bpi tells how much it can hold.
- A high bpi means more information fits on the tape.
