simpleMeaning: a lawyer of the highest rank in England, who speaks for people in court
scope: A top-ranking lawyer in England who speaks in court, with sergeant as another name for this sense,
  not a soldier of that rank and not any lawyer.
examples:
- The serjeant spoke for the accused man in court.
- Only a serjeant could take on such a hard case in those days.
