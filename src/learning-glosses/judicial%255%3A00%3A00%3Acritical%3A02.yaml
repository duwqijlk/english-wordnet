simpleMeaning: showing careful thought before giving a view or making a decision
scope: This sense means thinking carefully and fairly before you decide. It is not the sense about a judge,
  a court, or the law.
examples:
- Her review was judicial, weighing both sides before she gave her view.
- He took a calm, judicial look at the facts before speaking.
