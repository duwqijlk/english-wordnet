simpleMeaning: a medicine or treatment that keeps a sickness from starting or slows how it goes on
scope: This is a medicine or treatment for sickness, also called preventative and prophylactic; not a
  thing that blocks or slows other things in general, and not a way to stop a woman having a baby.
examples:
- She takes a daily pill as a preventive against the flu.
- The doctor gave him a preventive to slow the sickness.
