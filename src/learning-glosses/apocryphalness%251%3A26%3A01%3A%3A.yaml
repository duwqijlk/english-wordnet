senseId: 'apocryphalness%1:26:01::'
synsetId: 92419948-n
simpleMeaning: The quality of something that may not be true, whose facts may be wrong.
scope: The quality of something that may not be true, not a proven lie, and not the sense that means a
  text may not be real or accepted as true.
examples:
- He warned us about the apocryphalness of the story.
- The apocryphalness of the tale did not stop people repeating it.
