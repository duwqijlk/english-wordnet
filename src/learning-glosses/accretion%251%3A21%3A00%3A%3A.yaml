simpleMeaning: In law, a rise in one person's share of an estate, as when another person meant to gain
  dies, fails to meet a condition, or turns the inheritance down.
scope: In law, a rise in one person's share of an estate, not the forming of a heavenly body as gravity
  pulls together objects and gases, not a growth of land from deposits or sediment carried by water, and
  not growth by bits sticking together.
examples:
- His share grew by accretion when his brother turned the inheritance down.
- Accretion raised her part of the estate after the other heir died.
