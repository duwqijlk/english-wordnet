simpleMeaning: a big blood tube in the arm that joins the blood tube in the armpit
scope: A big blood tube in the arm that flows into the blood tube under the arm, not a blood tube in the
  leg and not a tube that carries blood to the arm.
examples:
- The doctor could see the cephalic vein on the top of her arm.
- The nurse put the needle into his cephalic vein.
