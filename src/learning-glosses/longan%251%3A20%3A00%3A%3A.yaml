simpleMeaning: A tree from Southeast Asia through to Australia, grown mainly for its sweet edible fruit
  that resembles litchi nuts, and sometimes classed in the groups Euphorbia or Nephelium.
scope: The tree, also called longanberry and lungen, not just its fruit or a litchi tree.
examples:
- The longan in the back garden is full of sweet fruit.
- Farmers plant longan mainly for its sweet fruit.
