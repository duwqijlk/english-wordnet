simpleMeaning: move a liquid out slowly, leaving the solid bits behind
scope: The slow separating of liquid from sediment, not making liquid run, not rain falling hard, and
  not crowds moving in; decant and pour out are other names.
examples:
- She poured the wine carefully into a jug, leaving the sediment in the bottle.
- Pour the clear liquid off the top and throw away the residue.
