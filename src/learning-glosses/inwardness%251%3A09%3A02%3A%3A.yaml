schema: oewn-learning-gloss-v2
senseId: 'inwardness%1:09:02::'
synsetId: 05929717-n
simpleMeaning: The point that counts most within an idea or a lived thing.
scope: The point that counts most within an idea or a lived thing; also called heart, center, core, centre,
  meat, sum, substance, marrow, essence, kernel, nub, gist, or pith; not a mind taken up with what lies
  within a person, especially right and wrong, nor a mind taken up, especially, with one's own views and
  right and wrong, nor the state of being inward or within.
examples:
- Their inwardness lay in one short line.
- The inwardness of the tale was plain.
