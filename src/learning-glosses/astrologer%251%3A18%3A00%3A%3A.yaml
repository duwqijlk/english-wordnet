simpleMeaning: a person who tells what will happen in the future from the positions of the planets, the
  sun, and the moon
scope: A person who tells the future from the positions of the planets, sun and moon; not a scientist
  who studies the stars, and not a fortune-teller who reads cards.
examples:
- The astrologer studied the planets before giving her reading.
- People once asked an astrologer what the new year would bring.
