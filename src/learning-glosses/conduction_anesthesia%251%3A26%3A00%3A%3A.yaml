simpleMeaning: Loss of feeling in the part of the body served by one nerve, brought on by putting a numbing
  drug on that nerve.
scope: Also called block anaesthesia, block anesthesia, conduction anaesthesia, nerve block anaesthesia,
  and nerve block anesthesia; not a loss of feeling in the whole body, and not a drug that puts a person
  to sleep.
examples:
- The dentist used conduction anesthesia to numb the lower jaw.
- Conduction anesthesia let the surgeon work on the hand without pain.
