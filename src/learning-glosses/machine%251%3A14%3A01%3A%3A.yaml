simpleMeaning: a complex organization with many parts that reaches its aims in a smooth and effective
  way.
scope: This is not a physical device that does work, and not a vehicle; it is a group of people organized
  to get things done.
examples:
- The party machine was already working on the next election.
- The company runs like a well-oiled machine.
