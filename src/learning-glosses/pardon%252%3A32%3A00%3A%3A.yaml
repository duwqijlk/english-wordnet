simpleMeaning: to forgive someone in law and free them from punishment for a wrong act
scope: This is the verb act of freeing someone in law; it is not the noun, the written paper that gives
  that freedom.
examples:
- The president pardoned the man after ten years in prison.
- She was pardoned and left prison the same day.
