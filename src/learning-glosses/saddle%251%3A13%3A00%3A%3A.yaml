simpleMeaning: a piece of meat, especially from sheep or lamb, made of part of the backbone and both loins
  (the meat on each side of the lower back)
scope: This is a piece of meat, not the seat you put on a horse for riding and not the low place between
  two high hills.
examples:
- They cooked a saddle of lamb for dinner.
- She bought a saddle of lamb at the market.
