simpleMeaning: Leaves like silk, with a strong smell, grow on a plant that lives for years in the dry
  north, and its flower heads are tawny.
scope: Also called wormwood sage, this is a plant of the dry north with leaves like silk and flower heads
  of a tawny colour.
examples:
- The prairie sagewort grew in the dry northern field.
- In the dry northern field, prairie sagewort showed tawny flower heads.
