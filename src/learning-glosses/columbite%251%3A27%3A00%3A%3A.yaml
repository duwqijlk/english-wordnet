simpleMeaning: a black stone-like stuff that holds two metals, niobium and tantalum, and is dug up to
  get them
scope: This is a black stone-like stuff dug up to get two metals, also called niobite; not a gem and not
  a common rock.
examples:
- The miners dug up columbite to get the metals inside it.
- A lump of black columbite lay on the table in the rock room.
