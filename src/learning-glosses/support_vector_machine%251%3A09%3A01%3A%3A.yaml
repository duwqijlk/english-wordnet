simpleMeaning: A way of sorting things that draws one flat wall, or several, through a space of many measures,
  and can also work out numbers or do other jobs.
scope: 'Also called support vector network: a way of sorting things by drawing flat walls through a space
  of many measures.'
examples:
- The support vector machine sorted the samples into two groups.
- The support vector machine has been widely used in the biological sciences.
