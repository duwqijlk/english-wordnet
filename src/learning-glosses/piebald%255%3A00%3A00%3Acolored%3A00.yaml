simpleMeaning: having parts or patches in different colors, usually bright colors
scope: 'Also called painted, multicolor, multicolored, motley, pied, calico, multicolour, multicoloured,
  multi-color, multi-colored, multi-colour, multi-coloured, particolored and particoloured: having patches
  in different colors. Not one plain color all over.'
examples:
- A piebald horse with black and white patches stood in the field.
- The piebald dog had brown and white patches on its back.
