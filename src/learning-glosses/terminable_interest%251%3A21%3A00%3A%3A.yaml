simpleMeaning: a right in property that ends when certain set conditions are met
scope: A right in property that ends when certain set conditions are met; not a right that lasts for ever,
  and not a right to use a thing for a day.
examples:
- The terminable interest ended when the lease ran out.
- He held a terminable interest in the farm.
