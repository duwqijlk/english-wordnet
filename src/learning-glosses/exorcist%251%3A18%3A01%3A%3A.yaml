simpleMeaning: One of the lower ranks in the old Western Church, now done away with in the Roman Catholic
  Church.
scope: One of the lower ranks in the old Western Church, now done away with; not a priest and not a person
  who casts out demons in stories.
examples:
- The exorcist held a minor order in the old Western Church.
- That order of exorcist was suppressed in the Roman Catholic Church.
