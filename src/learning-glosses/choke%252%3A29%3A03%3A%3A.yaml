senseId: 'choke%2:29:03::'
synsetId: 00077451-v
simpleMeaning: to try hard to breathe because you are not getting enough oxygen (the gas in air that the
  body needs)
scope: This means the body is not getting enough air, not breathing hard because of a strong feeling,
  and not the electric or engine parts with this name.
examples:
- He started to choke on a fish bone.
- The baby choked and could not get enough air.
