simpleMeaning: The idea that a country or group should be run as a union of parts that each govern themselves
  in large part.
scope: Of a constitution that leaves states to run their own schools, keeping power close to the people.
examples:
- Federalism shaped the new constitution, leaving the states to run their own schools.
- He wrote in defence of federalism, arguing that local rule keeps power close to the people.
