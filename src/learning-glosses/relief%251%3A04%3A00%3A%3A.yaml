simpleMeaning: Help given to people who are old, poor, or living with a disability.
scope: State or charitable support for people in need, not a carved artwork on a surface, not the act
  of easing pain, and not the comfortable feeling after worry.
examples:
- After the factory closed, many families lived on relief for years.
- The charity provides relief to elderly residents who cannot afford heating.
