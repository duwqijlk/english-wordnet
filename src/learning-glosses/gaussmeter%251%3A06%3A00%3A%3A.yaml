simpleMeaning: A meter that compares how strong magnetic fields are.
scope: This is a meter that compares how strong magnetic fields are; magnetometer is another name for
  this sense, not a needle that points north and not a meter that measures electric push.
examples:
- He used a gaussmeter to check the magnet's field.
- The gaussmeter showed the two fields were equal in strength.
