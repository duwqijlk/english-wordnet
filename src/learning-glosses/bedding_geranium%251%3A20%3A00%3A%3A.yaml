simpleMeaning: White, pink, or red flowers grow on this upright geranium, whose wavy-edged leaves have
  a wide band of colour just inside the edge
scope: Also called a fish geranium or a zonal pelargonium, this upright geranium has wavy-edged leaves
  with a wide band of colour just inside the edge and white, pink, or red flowers.
examples:
- We saw bedding geraniums with white flowers.
- Her bedding geraniums had red flowers.
