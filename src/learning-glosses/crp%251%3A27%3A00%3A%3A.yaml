simpleMeaning: A substance made by the body when tissue is inflamed, a kind of blood protein found in
  some cases of sudden swelling
scope: 'Also called C-reactive protein: a substance in the blood that appears with sudden swelling, not
  a cause of the swelling and not a protein found in all cases.'
examples:
- The doctor ordered a CRP test to check for swelling.
- Her CRP level was high after the infection.
