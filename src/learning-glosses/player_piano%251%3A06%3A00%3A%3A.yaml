simpleMeaning: A keyboard instrument that works by itself, using a roll of paper with holes in it to press
  the keys
scope: A keyboard instrument that works by itself from a roll of paper with holes in it; mechanical piano
  is another name for this sense, and this is not an ordinary keyboard instrument played by hand.
examples:
- The player piano played the tune by itself from the roll of paper.
- A player piano uses a roll of paper with holes to press its keys.
