senseId: 'peer-to-peer%3:00:02::'
synsetId: 90009192-a
simpleMeaning: Of a group of two or more machines joined as equals, sharing work, command and use of files
  and things with each other.
scope: A way of joining machines as equals so each shares work and files with the others, not a set-up
  with one main machine in charge and not a single machine working alone.
examples:
- The two laptops shared files in a peer-to-peer link.
- A peer-to-peer setup lets each machine send work straight to the other.
