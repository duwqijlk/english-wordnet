simpleMeaning: The electric charge that certain crystals, quartz among them, produce when squeezed, or
  the way an applied voltage makes them expand or contract.
scope: 'Another name for the piezoelectric effect: charge released by squeezing a crystal, and the matching
  change of shape when a voltage is applied; not a kind of stored electricity.'
examples:
- Piezoelectricity makes the crystal in a gas lighter spark when you press the button.
- Researchers are studying piezoelectricity as a way to harvest power from footsteps.
