simpleMeaning: The doing up of run-down parts of a town by middle-class people, which pushes out poorer
  people who lived there.
scope: In towns and cities, for run-down areas done up by middle-class people, with poorer residents pushed
  out.
examples:
- Gentrification changed the old dockside streets beyond recognition.
- Rents rose sharply with gentrification in the area.
