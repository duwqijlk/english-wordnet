simpleMeaning: a kind of sorghum that grows as a grain plant in the dry parts of Asia and North Africa
scope: 'Also called durra and dourah: a kind of sorghum that grows as a grain plant in the dry parts of
  Asia and North Africa, not wheat or rice.'
examples:
- Farmers in the dry lands grow doura for grain.
- Doura stands up well in hot, dry summers.
