simpleMeaning: a very thin, light cloth made of silk or rayon (a man-made material like silk)
scope: This is the thin, light cloth itself, used for clothes; not a dress or other thing made from it,
  and not silk on its own.
examples:
- She wore a dress made of pale pink chiffon.
- The scarf was made of light chiffon that moved in the wind.
