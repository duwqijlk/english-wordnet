simpleMeaning: A wine from the Jerez area of southern Spain, or one like it made elsewhere; it can be
  dry or sweet, is yellow-brown, and is usually drunk before a meal
scope: This is the wine from the Jerez area of southern Spain, or a wine like it made elsewhere, usually
  drunk before a meal; it is not a red table wine and not just any sweet drink.
examples:
- They drank a small glass of sherry before dinner.
- This dry sherry comes from southern Spain.
