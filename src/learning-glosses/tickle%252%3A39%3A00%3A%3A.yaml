simpleMeaning: to touch a part of the body lightly so as to stir the nerves in the skin, causing uneasiness,
  laughter, or sudden uncontrolled movements
scope: This is the act of touching a body part lightly, not the skin feeling itself and not feeling a
  sudden strong feeling in the mind.
examples:
- He tickled the baby's feet and she laughed.
- Please do not tickle my neck; it makes me jump.
