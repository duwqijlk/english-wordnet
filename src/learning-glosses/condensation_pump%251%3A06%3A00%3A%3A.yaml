simpleMeaning: a machine that makes a space with almost no air in it
scope: This is a machine that makes a space with almost no air in it; diffusion pump is another name for
  this sense, not a pump that moves water or air in a house.
examples:
- The lab fitted a condensation pump to clear the air from the chamber.
- A condensation pump ran all night to keep the vacuum high.
