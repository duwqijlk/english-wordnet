simpleMeaning: a thick, slippery liquid or soft substance, such as the kind used for cooking or in machines,
  that does not mix with water.
scope: It is not the dark liquid taken from the ground for fuel, not paint, and not the verb; it is the
  general slippery substance itself.
examples:
- Add a little cooking oil to the hot pan.
- The engine needs more oil before the long drive.
