simpleMeaning: in a way where the body shakes strongly again and again and the person cannot stop it
scope: This tells how a body moves, shaking hard and out of control; it does not mean shaking a little
  from cold or fear.
examples:
- Her leg twitched convulsively during the night.
- His whole body shook convulsively, and no one could hold him still.
