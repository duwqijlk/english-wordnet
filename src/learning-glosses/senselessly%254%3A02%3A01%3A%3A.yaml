simpleMeaning: In a way with no meaning and no purpose.
scope: Doing a thing with no meaning and no purpose, not the sense of acting in a way that shows no sense
  or reason.
examples:
- The bystanders were senselessly killed, though they had done nothing.
- He senselessly smashed the windows of the empty house.
