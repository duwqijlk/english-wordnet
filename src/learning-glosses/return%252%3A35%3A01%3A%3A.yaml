simpleMeaning: A player carries the ball back the other way after a kick, an interception or a fumble.
scope: This is the football action of carrying the ball back, not the tennis stroke that sends the ball
  back, not coming or going back to a place, not giving something back to its owner, not returning a favor,
  not answering back, and not submitting a report.
examples:
- He returned the opening kickoff to midfield.
- The cornerback intercepted the pass and returned it 30 yards.
