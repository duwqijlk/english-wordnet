simpleMeaning: The guts of people and other animals are home to most of these rod-shaped germs, which
  stay clear under a dye test and do no harm or else cause disease.
scope: Also called enteric bacteria and enterics, these are gut germs, not the germs that live on skin
  or in soil.
examples:
- Enterobacteria were found in the water sample.
- Most enterobacteria live in the gut without causing harm.
