simpleMeaning: Being worldly and sharp in mind, a quality gained through learning, through life, or through
  losing one's illusions.
scope: Also called sophistication, mundanity, or mundaneness; being worldly and sharp in mind through
  learning or life, not a concern with worldly things that leaves spiritual needs aside.
examples:
- Her worldliness showed in the way she spoke of Paris and Rome.
- Years abroad had given him a worldliness his friends admired.
