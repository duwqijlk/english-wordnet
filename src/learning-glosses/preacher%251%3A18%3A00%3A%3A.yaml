simpleMeaning: a person whose job is to speak to people about the gospel (the good news about Jesus in
  the Bible)
scope: This is a person whose job is to speak to people about the gospel as religious teaching. It is
  not any person who gives a talk about other subjects, and it is not the talk itself.
examples:
- The preacher stood up and told the people about the gospel.
- Every Sunday, the preacher speaks to the church about Jesus.
