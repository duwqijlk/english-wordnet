simpleMeaning: a box that keeps light out, holds film, and feeds the film forward as it is needed for
  taking photos
scope: 'Also called magazine: a box that keeps light out and holds film for a camera, not a case that
  holds bullets for a gun and not the part of a record player that holds the needle.'
examples:
- I put a new cartridge of film into the camera.
- The cartridge kept the film safe from light until it was used.
