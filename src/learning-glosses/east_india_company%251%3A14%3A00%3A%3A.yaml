simpleMeaning: An English firm from 1600 trading with new British lands in India and south-east Asia;
  it ran Bengal until the British army took over in 1858 after the Indian Mutiny.
scope: An old trading firm that once ran Bengal, not a modern company and not a government body.
examples:
- The East India Company shipped tea from Calcutta to London.
- In the 1700s the East India Company took control of Bengal.
