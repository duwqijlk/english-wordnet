simpleMeaning: when parts of the body that most often work well together fail to work as one
scope: 'Also called asynergy: body parts failing to work as one, not a single part that is weak and not
  a part that is hurt.'
examples:
- The illness caused asynergia, so his arms and legs no longer moved together.
- Asynergia made it hard for her to walk in a smooth way.
