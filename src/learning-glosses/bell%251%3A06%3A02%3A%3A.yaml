simpleMeaning: A button outside a door that rings or buzzes as a signal when pressed.
scope: The button outside a door, with doorbell and buzzer as other names for it, not the metal instrument
  that rings, the sound it makes, or a set of tuned bells.
examples:
- She pressed the bell twice and waited on the step.
- The bell by the gate was broken, so visitors had to knock.
