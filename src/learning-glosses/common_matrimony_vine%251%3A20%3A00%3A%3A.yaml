simpleMeaning: A deciduous shrub that is upright or spreading, with spiny branches, violet-purple flowers
  and orange-red berries, found from southeastern Europe to China.
scope: A spiny shrub with purple flowers and red berries; despite the name, it is not a climbing vine.
examples:
- Common matrimony vine bears violet-purple flowers followed by bright orange-red berries.
- In the garden, common matrimony vine grows as a spreading shrub with spiny branches.
