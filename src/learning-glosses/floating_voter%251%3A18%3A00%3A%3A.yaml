schema: oewn-learning-gloss-v2
senseId: 'floating_voter%1:18:00::'
synsetId: 10703410-n
simpleMeaning: A person who backs no party and whose choice, hard to guess, can turn the result of a vote
  one way or the other.
scope: This is a person with no party tie whose choice can turn a vote, not a loyal party supporter, and
  it is also called a swing voter.
examples:
- The floating voter had not made up her mind.
- Floating voters can decide a close election.
