simpleMeaning: The taste you feel in your mouth when you take in vinegar or lemon juice
scope: This is the taste felt in the mouth from vinegar or lemon juice, not a drink mixed with lemon juice
  and not a smell from food gone stale, and not the word for food that has that taste.
examples:
- The sour taste of the lemon made her lips purse.
- A sip of the dressing left a sour taste in his mouth.
