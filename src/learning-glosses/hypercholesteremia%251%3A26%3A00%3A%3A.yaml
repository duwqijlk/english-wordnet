senseId: 'hypercholesteremia%1:26:00::'
synsetId: 14292821-n
simpleMeaning: Too much of a fatty substance in the blood cells and the liquid part of the blood, which
  raises the risk of atherosclerosis, the narrowing of blood vessels
scope: Too much of a fatty substance in the blood, also called hypercholesterolemia; not too much potassium
  in the blood and not the fatty substance itself.
examples:
- The doctor said her hypercholesteremia raised her risk of heart disease.
- He takes medicine for hypercholesteremia.
