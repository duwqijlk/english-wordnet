simpleMeaning: Joining the vein of the gut to make the vein that leads into the liver, this vein is made
  from several small veins on the surface of the spleen.
scope: Also called splenic vein, this vein is made from small veins on the spleen and joins the vein of
  the gut to make the vein that leads into the liver.
examples:
- The vena lienalis joins the vein of the gut to make the vein that leads into the liver.
- Blood from the spleen flows through the vena lienalis toward the liver.
