simpleMeaning: A game in which balls with numbers are drawn by chance, and players cover the matching
  numbers on their cards.
scope: Also called bingo, beano, or keno; a game in which balls with numbers are drawn by chance, and
  players cover the matching numbers on their cards.
examples:
- They played lotto on Friday nights, covering numbers as the balls came out.
- She won at lotto when the last number on her card was drawn.
