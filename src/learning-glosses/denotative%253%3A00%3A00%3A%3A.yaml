simpleMeaning: names a thing straight out, in plain words that say just what is meant
scope: This is about a word that names a thing straight out, with denotive as another name for this sense;
  not a word that hints at a feeling and not a word used in a vague way.
examples:
- The denotative use of 'rose' names the flower itself.
- A denotative word tells you what thing is meant.
