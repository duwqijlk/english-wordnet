synsetId: 02440714-v
simpleMeaning: to bring workers into a labour group, or to set up such a group
scope: To get workers to join a labour group or to set one up; unionize is another name for this sense,
  and this is not simply joining a group yourself.
examples:
- The manager tried to unionise the workers in the factory.
- She was sacked for trying to unionise her fellow workers.
