simpleMeaning: The back seat for a second rider behind the first, on a horse or a motorbike.
scope: For the back seat on a horse or a motorbike, where a second person sits behind the rider.
examples:
- She rode pillion, holding tight to the rider in front.
- The pillion was too small for a second rider.
