simpleMeaning: to join a small chemical part made of carbon, hydrogen and oxygen to a chemical
scope: Another name for this sense is acetylate, also called acetylize; it is joining a small chemical
  part to a chemical, not breaking a chemical apart and not mixing two chemicals.
examples:
- The lab will acetylise the sample first.
- They acetylise the compound to make it easier to study.
