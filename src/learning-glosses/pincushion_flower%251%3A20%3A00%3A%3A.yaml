simpleMeaning: A one-year plant of the Old World with sweet-smelling heads of purple to deep red blooms,
  now at home in the United States.
scope: This is a one-year plant of the Old World with sweet-smelling purple to deep red blooms, now at
  home in the United States; mournful widow is another name for this sense, not a plant that lives for
  many years and not a plant of the New World.
examples:
- The pincushion flower bloomed purple in the garden.
- Pincushion flowers grow wild in the United States now.
