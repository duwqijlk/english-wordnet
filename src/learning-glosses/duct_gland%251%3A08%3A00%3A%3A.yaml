simpleMeaning: a liquid made in this part of the body leaves the body through a tube
scope: 'Also called exocrine and exocrine gland: a liquid made in this part of the body leaves the body
  through a tube, not a part that sends its liquid straight into the blood.'
examples:
- A duct gland in the mouth sends saliva out through a small tube.
- A duct gland pours its liquid out through a tube instead of into the blood.
