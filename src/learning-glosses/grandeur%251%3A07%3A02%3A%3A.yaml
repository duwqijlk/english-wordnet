simpleMeaning: the quality of a high mind and a lifted spirit in what a person thinks, hopes, and does
scope: The quality of a high mind and a lifted spirit in what a person thinks, hopes, and does, also called
  nobility; not the look of a grand building or scene.
examples:
- The old king spoke with a grandeur that moved the whole court.
- Her grandeur of mind showed in her calm, generous acts.
