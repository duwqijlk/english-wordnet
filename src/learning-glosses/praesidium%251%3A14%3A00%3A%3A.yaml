simpleMeaning: In socialist countries, this small standing group runs things with all the powers of a
  bigger law-making group, and stands in for it when it is not meeting
scope: This is the small standing group that runs things in socialist countries, also called presidium,
  not the bigger law-making group it stands in for.
examples:
- The praesidium met to decide the new rules.
- She was chosen to serve on the praesidium.
