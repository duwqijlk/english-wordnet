simpleMeaning: A plant from Europe with bright yellow flowers, common where grain grows, and known as
  a weed there.
scope: This European plant with bright yellow flowers, a weed in grain fields, is also called a field
  marigold.
examples:
- Corn marigold spread through the wheat field.
- The corn marigold in the barley had bright yellow flowers.
