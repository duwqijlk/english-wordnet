senseId: 'license%1:26:01::'
synsetId: 14018291-n
simpleMeaning: Being free to go against the rules that normally apply, or the usual ways of doing things,
  on purpose, especially in how you behave or speak.
scope: This is the freedom to depart from normal rules by choice, also spelt licence, not a legal permit
  and not unchecked freedom with no restraint.
examples:
- The writer took license with the facts to make the story more dramatic.
- She used poetic license to change the ending of the play.
