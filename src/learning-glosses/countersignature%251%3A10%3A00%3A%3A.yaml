simpleMeaning: a second name signed on a paper already signed, to show that the first signing stands
scope: A second name signed on a paper already signed, to show that the first signing stands, also called
  countersign; not the first signing and not a stamp on the paper.
examples:
- The bank asked for a countersignature before it would pay the cheque.
- Her countersignature on the form showed that the first signing was approved.
