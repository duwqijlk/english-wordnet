senseId: 'rowlock%1:06:00::'
synsetId: 03911849-n
simpleMeaning: While you row, this holder on the boat's top edge keeps the oar in place and gives it a
  point to turn on.
scope: Also called a pin, peg, oarlock, thole, or tholepin; a holder on the boat's top edge that keeps
  the oar in place and gives it a point to turn on.
examples:
- He set the oar in the rowlock and pushed off.
- The rowlock held the oar steady as she rowed.
