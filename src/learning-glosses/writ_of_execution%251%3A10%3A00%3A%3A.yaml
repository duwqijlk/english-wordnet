simpleMeaning: A routine court order that tries to make a ruling happen for the winner, by letting a sheriff
  carry it out
scope: Also called execution, it is a routine court order that tries to make a ruling happen for the winner
  by letting a sheriff carry it out.
examples:
- The writ of execution let the sheriff carry out the ruling.
- After the ruling, the court sent a writ of execution to the sheriff.
