simpleMeaning: A fast-growing shrub that stays green all year, from the south-east of the United States,
  with arching tangled branches and clusters of white flowers.
scope: 'Also called dog hobble, dog laurel, switch-ivy and Leucothoe editorum: a fast-growing evergreen
  shrub with white flower clusters, not a tree and not a shrub with single flowers.'
examples:
- Leucothoe fontanesiana grew fast along the fence, its white flowers in clusters.
- We planted Leucothoe fontanesiana for its arching branches.
