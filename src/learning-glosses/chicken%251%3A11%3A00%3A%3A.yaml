simpleMeaning: a silly and risky contest where people keep doing a dangerous thing until one person gets
  afraid and stops
scope: This is the dangerous contest itself, not the farm bird, not its meat, and not a person who is
  unsure.
examples:
- Two drivers raced toward each other in a game of chicken until one turned away.
- The boys played chicken on their bikes, riding straight at each other until one turned aside at the
  last moment.
