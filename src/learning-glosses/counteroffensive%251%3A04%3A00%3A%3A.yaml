schema: oewn-learning-gloss-v2
senseId: 'counteroffensive%1:04:00::'
synsetId: 00982286-n
simpleMeaning: A big attack by a force on defence, made to take the lead back from the force attacking
  it, and bigger than a counterattack.
scope: Not a mere counterattack, this is a large attack by a defending force to seize the lead from the
  attackers.
examples:
- The army launched a counteroffensive at dawn.
- Their counteroffensive pushed the enemy back across the river.
