simpleMeaning: In music, a sign written at the start of lines of music that shows how high or low the
  notes after it are
scope: This is the sign at the start of written music that sets how high or low the notes are, not a note
  itself and not the lines the music is written on.
examples:
- The treble clef at the start tells you the notes will be high.
- She drew a bass clef before she wrote the low notes.
