simpleMeaning: a long hole dug in the ground to keep soldiers safe, with a low wall of the dug-out earth
  along its edge
scope: A dug hole that soldiers use to stay safe on land, not the deep long cut in the ocean floor and
  not the act of digging.
examples:
- The soldiers waited in the trench all night.
- They dug a trench and piled the earth in front of it.
