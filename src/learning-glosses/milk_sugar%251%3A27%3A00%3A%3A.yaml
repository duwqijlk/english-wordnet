simpleMeaning: One glucose bit linked to one galactose bit makes this stuff, which is found in the drink
  mothers give their young and in no other food.
scope: Also called lactose, it is the only such stuff in the drink mothers give their young.
examples:
- Milk sugar is found only in milk.
- One glucose bit linked to one galactose bit makes milk sugar.
