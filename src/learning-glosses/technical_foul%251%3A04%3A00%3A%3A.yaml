synsetId: 00772845-n
simpleMeaning: In basketball, a penalty that can be given to a player, a coach, or a team for bad sporting
  conduct, not usually from bodily contact during play
scope: In basketball, a penalty for bad sporting conduct that can be given to a player, a coach, or a
  team, also called a technical; not a penalty for bodily contact and not a free throw.
examples:
- The coach got a technical foul for shouting at the referee.
- A technical foul gave the other team two free throws.
