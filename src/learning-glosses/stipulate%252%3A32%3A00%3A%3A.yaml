simpleMeaning: to say clearly in a contract or agreement what must be done or given, and to make that
  a clear demand in the agreement
scope: 'Also called condition, specify and qualify: to put a clear demand into a contract or agreement,
  not to give details in general talk.'
examples:
- The contract stipulates that rent must be paid on the first day of each month.
- The agreement stipulates clear rules for who must repair the roof.
