simpleMeaning: In chemistry and physics, the push of a mix of gases equals the sum of the pushes each
  gas would give alone in the same space at the same heat
scope: 'Also called Dalton''s law and law of partial pressures: in chemistry and physics, the rule about
  the pressure of a mix of gases, not the rule about how elements join in fixed amounts and not a rule
  about heat alone.'
examples:
- Dalton's law of partial pressures explains the pressure of a gas mix.
- We used Dalton's law of partial pressures in class.
