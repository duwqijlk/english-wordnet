simpleMeaning: To put yourself into something in a quiet, indirect way
scope: To put yourself into something in a quiet, indirect way; not to push in openly and not to hint
  at something.
examples:
- He insinuated himself into the talk of the people at the next table.
- She insinuated her way into the committee without anyone inviting her.
