simpleMeaning: food a person did not finish at a restaurant, put in a pack to take home, said to be for
  the pet, though no one believes the claim
scope: Food left over at a restaurant, put in a pack to take home, also called a doggie bag, and not food
  bought to eat at home.
examples:
- The waiter put her uneaten chicken in a doggy bag.
- We asked for a doggy bag for the rest of the pizza.
