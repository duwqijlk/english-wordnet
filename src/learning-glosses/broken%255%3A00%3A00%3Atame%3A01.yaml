simpleMeaning: Taught to follow commands and accept being handled, as a horse is trained for riding.
scope: An animal that has been tamed and taught to obey; it is not a machine that fails, something cracked
  or incomplete, or a group in confusion.
examples:
- The wild colt was finally broken and could be led on a rope.
- A broken horse stands quietly while it is saddled.
