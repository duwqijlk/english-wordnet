simpleMeaning: a tool for opening cans, with a pointed three-sided end that cuts through the top of a
  can
scope: A tool for opening cans, with a pointed three-sided end that cuts through the top of a can; not
  a key for a door and not a knife for cutting food.
examples:
- He opened the tin with a church key.
- The church key pierced the lid with its pointed end.
