simpleMeaning: a person who does things and reacts in a fixed way, without thought, feeling or interest
scope: 'Also called zombi: this is a living person with no feeling or interest in what they do, not a
  dead body brought back to life and not a strong drink with rum and fruit juice.'
examples:
- After working all night, he moved through the day like a zombie.
- She sat at her desk like a zombie, doing her work with no thought or feeling.
