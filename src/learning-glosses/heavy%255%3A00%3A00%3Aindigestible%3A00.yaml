senseId: heavy%5:00:00:indigestible:00
synsetId: 01186658-s
simpleMeaning: Said of food that is dense or not properly risen, so likely to cause discomfort in the
  digestive tract.
scope: This is about food that is dense or poorly risen, and so likely to upset digestion, not about great
  physical weight or density, not great degree, quantity, or number, not military or industrial armaments
  or equipment, not emotional burden or sadness, not a stout person with a large frame, not compact fine-grained
  soil, not a cloud-darkened sky, not great intensity or force, not an isotope of greater atomic mass,
  not a villain in a play, not opacity to light, not large extent or density, not thick fabric, not something
  prodigious, not loud deep sound, not overindulgence in drink, not grave or important matters, not slow
  laborious movement, not equipment built for rough work, not a steep slope, not being full of or bearing
  weight, not work requiring effort, not exhausting effort, not dullness or lack of liveliness, not deep
  sleep, not advanced pregnancy, not the noun for a villain actor, not the noun for a tragic role, and
  not the adverb meaning slowly under a burden.
examples:
- The pudding was so heavy that he felt bloated for hours afterwards.
- She avoided heavy cakes at night because they gave her indigestion.
