simpleMeaning: an official trip to a place to check the place and see that work there is done in the right
  way
scope: This sense is an official trip to check a place, not a bad event seen as a punishment and not a
  social call at a home.
examples:
- The bishop's visitation to each church in the area took a week.
- The school had a visitation from the health office to check its kitchen.
