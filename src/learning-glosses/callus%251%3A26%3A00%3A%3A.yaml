simpleMeaning: bone tissue that forms while a broken bone is healing
scope: Bone tissue that forms as a broken bone heals; not the thick hard skin on a foot, and not the plant
  lump on an orchid.
examples:
- The callus around the break grew as the bone healed.
- X-rays showed a callus forming over the fracture.
