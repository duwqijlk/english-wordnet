simpleMeaning: of rocks, loose matter and the like, found in the place where they and the parts they are
  made of were formed
scope: Rocks and like matter found where they were formed, not rocks carried in from some other place.
examples:
- The autochthonous limestone formed in the same bed where it now lies.
- The autochthonous peat had formed in the bog where it was found.
