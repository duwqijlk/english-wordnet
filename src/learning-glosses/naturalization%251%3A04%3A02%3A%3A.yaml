simpleMeaning: The bringing of animals or plants to a new place, where they grow though not born there.
scope: The bringing of animals or plants to a new place, where they grow though not born there; not the
  granting of citizenship to a foreigner, nor the changing of a borrowed word's sounds to fit the new
  tongue, nor the state of being made to fit with nature.
examples:
- Their naturalization spread the plant far and wide.
- The naturalization of the bird took years.
