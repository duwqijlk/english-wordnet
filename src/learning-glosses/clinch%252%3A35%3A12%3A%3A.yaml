simpleMeaning: to hold the person you are fighting in boxing with one or both arms so he cannot hit you
scope: In boxing, holding the other fighter with the arms to stop hits, not the noun for that hold and
  not making nail ends flat.
examples:
- The tired fighter clinched his opponent to stop the punches.
- With both arms, he clinched the other fighter so no more punches could land.
