senseId: 'concord%1:24:00::'
synsetId: 13819525-n
simpleMeaning: The fixing of word endings by their ties to other words.
scope: This sense is also called agreement, for the fixing of word endings by their ties to other words,
  where agreement is how a word's form shifts to match a related word, as a verb matching its subject
  in number, unlike the sense for a tuneful state of things in general, and of their marks, as of colours
  and sounds, a fitting of parts with each other and with the whole, unlike the sense for setting out
  the words of a text to make a concordance, and unlike the sense for setting out by concord or agreement.
examples:
- Concord fixes word endings by word relations.
- The concord of verb and subject showed in the sentence.
