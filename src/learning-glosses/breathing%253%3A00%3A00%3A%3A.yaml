simpleMeaning: Moving or able to move air in and out of the lungs normally; sometimes used with another
  word to form a compound.
scope: Moving air in and out of the lungs normally, or able to do so, also called eupneic and eupnoeic;
  not the noun naming the whole bodily act.
examples:
- The rescuers pulled a breathing child from the rubble.
- The heavy-breathing dog lay panting in the shade.
