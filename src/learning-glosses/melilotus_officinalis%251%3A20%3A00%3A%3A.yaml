simpleMeaning: A two-year yellow-flowered Eurasian plant, with sweet-smelling leaves used for the stomach
  or for flavour; grown widely, above all as green feed for the soil or a cover crop.
scope: 'Also called yellow sweet clover: a two-year yellow-flowered plant of Europe and Asia, with sweet-smelling
  leaves used for the stomach or for flavour, grown widely as green feed for the soil or a cover crop,
  not a white-flowered clover and not a woody shrub.'
examples:
- Melilotus officinalis grew along the field edge with its yellow flowers.
- The farmer sowed Melilotus officinalis as a cover crop to feed the soil.
