simpleMeaning: to change the high or low sound, the kind of sound, or how loud something is
scope: 'This is about changing a sound in general: how high or low it is, what kind of sound it is, or
  how loud it is. It is not the special sense of changing the rise and fall of your voice as you speak,
  and it is not changing radio waves.'
examples:
- The engineer modulated the volume of the recording before saving it.
- She modulated the pitch of the note to match the rest of the song.
