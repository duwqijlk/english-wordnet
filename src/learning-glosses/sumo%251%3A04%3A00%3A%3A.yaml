simpleMeaning: 'A Japanese wrestling sport: you lose if you are forced out of a small ring or if any part
  of your body other than your feet touches the ground'
scope: This is the Japanese wrestling sport itself, with its small ring and its losing rules, not a person
  who takes part in the sport.
examples:
- The two men began their sumo match inside the small ring.
- In sumo, a fighter loses if he is pushed out of the ring.
