simpleMeaning: in a way that shows a wish to hurt someone or do them harm
scope: This describes doing or saying something in a way meant to hurt someone, not just thinking unkind
  thoughts and not doing something by chance.
examples:
- He maliciously spread a false story about his rival.
- She answered maliciously, hoping her words would hurt him.
