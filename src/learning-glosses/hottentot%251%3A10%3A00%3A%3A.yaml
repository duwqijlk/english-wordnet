simpleMeaning: Any one of the group of languages called Khoisan, used by the people in Namibia and South
  Africa who keep herds of farm animals
scope: This is any of the Khoisan languages spoken by the herding people of Namibia and South Africa,
  also called Hottentot language, Khoikhoi, Khoikhoi language, Khoikhoin and Khoikhoin language; near
  rivals are other Khoisan languages such as Nama and the San languages.
examples:
- Hottentot is one of the Khoisan languages spoken by the herding people of Namibia and South Africa.
- Linguists group Hottentot with the Khoisan languages of southern Africa.
