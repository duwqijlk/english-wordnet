simpleMeaning: a plant that lives for years, with pale red flowers, growing in stony ground in the west
  of the United States
scope: A plant that lives for years, with pale red flowers, growing in stony ground in the west of the
  United States; not a rock rose, which has yellow, white, or reddish flowers, and not a garden flower
  grown in soft soil.
examples:
- Rock pink grew in the stony ground along the path.
- We saw rock pink with pale red flowers on the dry hillside.
