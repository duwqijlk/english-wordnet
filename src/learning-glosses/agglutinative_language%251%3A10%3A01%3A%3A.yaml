schema: oewn-learning-gloss-v2
senseId: 'agglutinative_language%1:10:01::'
synsetId: 92461960-n
simpleMeaning: A tongue whose words join small parts in a straight row, so that each bit of meaning has
  a part of its own.
scope: In this tongue, each bit of meaning has a part of its own, so one part does not carry many bits
  of meaning at once.
examples:
- He learned an agglutinative language where each new part of a word added one bit of meaning.
- In an agglutinative language, speakers join small parts to build a word.
