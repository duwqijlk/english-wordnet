simpleMeaning: In pathology, the clostridium germs make poisons that kill body tissue, usually leaving
  a deadly sickness; it can also be used as a weapon made from germs.
scope: It is also called clostridial myonecrosis, emphysematous gangrene, gangrenous emphysema, gas gangrene,
  gas phlegmon, and progressive emphysematous necrosis.
examples:
- The emphysematous phlegmon left dead tissue where the germs had made their poisons.
- The emphysematous phlegmon killed the tissue after the germs had made their poisons.
