simpleMeaning: How past events are explained by the causes found by science, such as the causes that shaped
  the earth
scope: 'Also called paletiology: the way of explaining past events by scientific causes, not a story of
  what happened in the past and not the study of old earth features now buried under rock.'
examples:
- The book uses palaetiology to explain the ancient flood.
- Palaetiology seeks the scientific causes behind past changes in the land.
