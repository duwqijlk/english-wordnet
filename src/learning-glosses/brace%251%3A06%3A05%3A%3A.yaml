simpleMeaning: Bands that stretch and keep a person's trousers from falling down.
scope: Stretchy bands that keep trousers up, not a stiffening part of a frame and not the verb sense of
  getting ready.
examples:
- He wore braces to keep his trousers up.
- His braces snapped as he bent down.
