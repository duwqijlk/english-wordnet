simpleMeaning: Blood put into a person that does not match the blood already there can set off fever and
  itchy red spots, or failing kidneys, collapse, and death.
scope: This is what the body does when blood put into it does not match the blood already there.
examples:
- A transfusion reaction set in when the given blood did not match the patient's own blood.
- The transfusion reaction ranged from itchy red spots to failing kidneys.
