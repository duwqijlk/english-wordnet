simpleMeaning: Said of a tree or bush that is part of the olive family
scope: Said of a tree or bush in the olive family, not of a fruit tree of another family and not of the
  olive fruit itself.
examples:
- The oleaceous shrub grew beside the garden wall.
- Botanists classed the tree as oleaceous because it belonged to the olive family.
