simpleMeaning: A tool that sends sound pulses through water and works out how far things are from how
  long their echoes take to come back.
scope: Also called asdic or an echo sounder, a tool that measures distance in water by sound echoes.
examples:
- The ship used sonar to map the sea floor.
- Sonar picked up the wreck lying far below the surface.
