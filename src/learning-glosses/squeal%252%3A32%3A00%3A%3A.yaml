simpleMeaning: To tell the police or others about a wrong deed you or someone else did, usually because
  pressure was put on you
scope: 'Also called confess: telling about a wrong deed under pressure, not letting out a high cry like
  a pig.'
examples:
- He squealed to the police about the robbery.
- After hours of questions, she squealed and named the others.
