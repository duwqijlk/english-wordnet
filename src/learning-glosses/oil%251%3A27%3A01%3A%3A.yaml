simpleMeaning: a dark liquid found under the ground, made mostly of carbon and hydrogen, that is used
  to make petrol and many other products.
scope: It is not the cooking or machine liquid, not paint, and not the verb; it is the raw fuel taken
  from under the earth.
examples:
- The country earns much of its money from oil.
- Oil prices rose sharply last year, so petrol cost more.
