simpleMeaning: a white top with a stiff front, made for a man to wear in the evening, often with a formal
  black suit
scope: 'Also called an evening shirt: a white top with a stiff front for a man to wear in the evening,
  not an everyday top and not a suit on its own.'
examples:
- He put on his dress shirt and black tie before the dinner.
- The dress shirt had a stiff front that stayed smooth all evening.
