simpleMeaning: The eyepiece makes bigger the picture that a large mirror curved inward forms in this optical
  telescope.
scope: Also called a reflector, this is an optical telescope whose picture comes from a large curved mirror
  and is made bigger by the eyepiece.
examples:
- Isaac Newton invented the reflecting telescope in 1668.
- The reflecting telescope made the far stars look bigger.
