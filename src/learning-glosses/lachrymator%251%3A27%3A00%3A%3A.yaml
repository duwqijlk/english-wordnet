simpleMeaning: 'A gas used to break up crowds: it makes the eyes fill with tears but does not hurt them'
scope: 'Also called lacrimator: a gas used to break up crowds by filling the eyes with tears without hurting
  them, not a gas that harms the eyes and not a gas used to kill.'
examples:
- Police used a lachrymator to clear the square.
- The lachrymator made the protesters' eyes water without injuring them.
