simpleMeaning: Of, about, or fitting monks who live together as one group, and their way of life.
scope: This is of, about, or fitting monks who live together as one group, and their way of life; cenobitic,
  cenobitical and coenobitic are other names for this sense, not the life of a lone monk and not a rule
  for nuns alone.
examples:
- The coenobitical monks shared all their work.
- A coenobitical house keeps one table for all.
