simpleMeaning: so surprised that a person cannot speak
scope: 'Also called dumbfounded, flabbergasted, stupefied, thunderstruck and dumfounded: so surprised
  that a person cannot speak, not just quiet and not just surprised in a small way.'
examples:
- She stood dumbstruck when she heard the news.
- He was dumbstruck at the size of the gift.
