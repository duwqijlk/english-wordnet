senseId: 'vindicate%2:32:01::'
synsetId: 00906447-v
simpleMeaning: to show, with proof, that a person should not be blamed and that what was said or thought
  against them is wrong
scope: To clear a person with proof, not to keep, support or defend a right or idea.
examples:
- New facts vindicated the man who had been blamed for the theft.
- She was vindicated when the letter proved she was telling the truth.
