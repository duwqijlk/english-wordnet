simpleMeaning: A 14-line poem made of three groups of four lines and a closing pair of lines, in a five-beat
  rhythm, with the rhyme pattern abab cdcd efef gg.
scope: A 14-line poem, also called Elizabethan sonnet and English sonnet; not the Spenserian kind with
  its own rhyme pattern and not the Petrarchan kind.
examples:
- Her favourite Shakespearean sonnet ends with a rhyming pair.
- The Shakespearean sonnet follows the rhyme pattern abab cdcd efef gg.
