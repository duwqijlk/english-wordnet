simpleMeaning: a crack in the outer layer of the earth, or of another planet, through which hot liquid
  rock and gases burst out
scope: Also called volcano, this is a crack in the ground where hot rock bursts out; it is not a way to
  let out feelings, not an opening in an animal's body, and not a slit in a coat.
examples:
- Lava poured from a vent in the side of the mountain.
- A new vent opened in the ground, and hot gases burst out.
