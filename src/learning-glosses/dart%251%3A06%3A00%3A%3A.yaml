simpleMeaning: a small fold in cloth that is sewn in place and gets narrower at one end, made when making
  clothes
scope: This is a small sewn fold in clothing; it is not the small pointed thing that is thrown or shot,
  and not moving fast and lightly.
examples:
- The dressmaker sewed a dart at the waist of the dress.
- She added two darts to make the shirt fit better.
