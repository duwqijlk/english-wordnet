simpleMeaning: to give an army vehicles with engines, guns, and thick metal plates that protect the people
  inside
scope: 'Also called mechanize, mechanise, and motorise: giving an army fighting vehicles with engines,
  not just putting an engine in a vehicle or giving it a vehicle for travel.'
examples:
- The army motorized its fighting units before the war began.
- They motorized the division with armoured trucks and gun carriers.
