simpleMeaning: doing what you are told, and acting in a dutiful, yielding way toward another person
scope: Doing what you are told and yielding to another person, not giving orders and not mere agreement.
examples:
- The dog's obedience pleased its trainer.
- Obedience to the rules kept the class in order.
