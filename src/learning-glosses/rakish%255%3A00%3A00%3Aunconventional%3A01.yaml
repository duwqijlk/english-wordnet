simpleMeaning: having a manner that is without worry and does not follow usual ways, or that others think
  is bad
scope: 'Also called raffish: showing a free, wild manner that breaks usual rules, not the sense of being
  smart and up to date in dress and manners.'
examples:
- He had a rakish charm, laughing and doing things his own way at the party.
- The rakish young men stayed out late and cared little for polite rules.
