simpleMeaning: Bounced back to earth by the high layer of air or by a satellite in space, this radio signal
  can travel round the curve of the earth.
scope: A radio signal bounced back to earth from high above, which lets it travel round the curve of the
  earth.
examples:
- The sky wave carried the broadcast over the horizon.
- The sky wave bounced off the ionosphere and reached a station far away.
