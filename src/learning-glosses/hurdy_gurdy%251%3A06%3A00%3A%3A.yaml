schema: oewn-learning-gloss-v2
senseId: 'hurdy_gurdy%1:06:00::'
synsetId: 02799187-n
simpleMeaning: A musical instrument with strings, played by a wheel that rubs against the strings to make
  sound
scope: This is a stringed musical instrument that makes sound when a wheel rubs against its strings; hurdy-gurdy
  and wheel fiddle are other names for this sense, not a violin played with a bow and not a guitar.
examples:
- The hurdy gurdy sounded at the street fair.
- He played a hurdy gurdy with a turning wheel.
