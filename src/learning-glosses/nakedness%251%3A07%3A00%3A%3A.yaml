simpleMeaning: a way of acting that is open and easy for others to see, especially about one's acts and
  aims, with nothing hidden and not keeping things secret
scope: 'Also called openness: being open about what you do and why, with nothing hidden; it is not having
  no clothes on, and not a cold, empty feeling in a place.'
examples:
- Her nakedness about her plans surprised us; she hid nothing about what she was doing or why.
- He spoke with nakedness about his past acts, keeping no secrets from the group.
