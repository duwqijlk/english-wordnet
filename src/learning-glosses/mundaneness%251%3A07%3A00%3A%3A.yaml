simpleMeaning: The quality of being clever about the world and at ease in it, built up through learning,
  experience or the loss of simple beliefs.
scope: The quality of being clever about the world and at ease in it; sophistication, worldliness and
  mundanity are other names for it, not plain dullness and not book learning alone.
examples:
- Her mundaneness showed in the way she talked about art and travel.
- His mundaneness came from years of living abroad.
