simpleMeaning: making a person feel strong sexual desire, or giving sexual pleasure
scope: This is about sexual desire or sexual pleasure; sultry is another name for this sense. Not the
  wider sense about strong desires of the body in general, such as desire for food.
examples:
- She gave him a sensual look that showed her desire.
- The film has a slow, sensual dance scene.
