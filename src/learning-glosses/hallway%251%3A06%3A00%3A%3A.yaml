simpleMeaning: A way through the inside of a building, with rooms opening off along it.
scope: Another name for hall in its passage sense, not a large room for gatherings and not an entrance
  lobby.
examples:
- She waited in the hallway outside his office.
- The hallway was narrow and poorly lit.
