synsetId: 92439921-n
simpleMeaning: A three-sided shape with one right angle whose side lengths are counting numbers, with
  the squares of the two short sides adding to the square of the long side.
scope: A three-sided shape with one right angle whose side lengths are counting numbers, not a shape with
  three equal sides and not a shape with no right angle.
examples:
- The sides 3, 4 and 5 make a Pythagorean triangle.
- If the sides fit the rule, the shape is a Pythagorean triangle.
