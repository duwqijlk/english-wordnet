simpleMeaning: Tiny biting insects that have got into the hair around a person's private parts and are
  living there
scope: This is a bad case of tiny lice in body hair down below, not the sea animals of the same name and
  not ordinary head lice.
examples:
- He was told he had crabs and was given a lotion to kill the lice.
- The crabs spread through the hair and made him itch all night.
