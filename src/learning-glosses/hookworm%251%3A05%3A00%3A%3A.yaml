simpleMeaning: A small round worm that lives off other creatures, sucking blood, and holds on to the gut
  wall with hooked mouth parts.
scope: Not the sickness caused by these worms, this is the small round worm itself, living off other creatures
  and sucking blood.
examples:
- The hookworm fastens to the wall of the gut with its hooked mouth.
- The vet found hookworms in the dog's gut.
