simpleMeaning: Yellowing of the skin and the whites of the eyes, from a build-up of bile pigment, bilirubin,
  in the blood, which can mark gallstones or liver infection or anemia.
scope: Yellowing of the skin and the whites of the eyes, from a build-up of bile pigment, bilirubin, in
  the blood, which can mark gallstones or liver infection or anemia; it is also called jaundice.
examples:
- Icterus yellows the skin and eyes.
- Icterus can mark liver infection.
