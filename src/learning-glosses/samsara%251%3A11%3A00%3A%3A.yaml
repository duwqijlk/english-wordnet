simpleMeaning: In Hinduism and Buddhism, the never-ending round of birth and suffering and death and being
  born again
scope: The never-ending round of birth, suffering, death, and being born again, not escape from that round
  and not fate.
examples:
- In samsara, beings are born again and again.
- The teaching says samsara is the round of birth and death.
