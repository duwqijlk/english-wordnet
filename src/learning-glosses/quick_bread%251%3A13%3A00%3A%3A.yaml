simpleMeaning: baked goods made with a substance that makes dough rise, so they can go in the oven at
  once
scope: Baked goods made to go in the oven at once with a rising agent, not bread left to rise with yeast
  and not cake.
examples:
- She made quick bread with baking soda for breakfast.
- This quick bread needs no yeast and bakes in half an hour.
