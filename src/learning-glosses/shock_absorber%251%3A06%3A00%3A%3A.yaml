simpleMeaning: a part in a machine that takes in the force of sudden pushes or hits and makes them weaker
scope: A part in a machine that takes in the force of sudden pushes or hits, also called a shock or a
  cushion; not a spring that pushes back and not a brake that stops a wheel.
examples:
- The old car needed a new set of shock absorbers.
- A good shock absorber keeps the car from bouncing on a rough road.
