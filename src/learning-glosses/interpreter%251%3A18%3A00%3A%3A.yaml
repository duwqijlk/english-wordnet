simpleMeaning: A person who speaks in public for another person or group, putting forward their policies
  and aims
scope: A person who speaks for another's aims, also called voice and representative; not a computer program
  and not a person who turns speech from one language to another.
examples:
- The interpreter for the minister explained the new policy to the press.
- An interpreter for the company spoke at the meeting.
