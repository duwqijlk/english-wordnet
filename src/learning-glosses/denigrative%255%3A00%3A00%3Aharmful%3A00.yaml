senseId: denigrative%5:00:00:harmful:00
synsetId: 01164777-s
simpleMeaning: Words about a person that do harm and are often untrue, tending to make others think badly
  of them
scope: These are harmful, often untrue words about a person; also called denigrating, slanderous, calumniatory,
  calumnious, defamatory, denigratory, libellous and libelous, not praise and not a true report.
examples:
- His denigrative comments damaged her standing at work.
- The denigrative article was full of untrue claims.
