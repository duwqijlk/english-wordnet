simpleMeaning: a group of people who settle far from home and keep ties with their home country, still
  its citizens but not truly ruled by its government
scope: This sense is a group of people living far from home, also called settlement; it is not a land
  ruled by a far country and not a group of living things grown from one cell.
examples:
- A small colony of British families lived in India but kept close ties with Britain.
- The American colony in Paris met each week to share news from home.
