simpleMeaning: A job finished in a set number of evenly timed steps.
scope: A job finished in a set number of evenly timed steps; not a job with no set number of steps, and
  not a job done in one step only.
examples:
- The fixed-cycle operation finished in exactly eight steps.
- A fixed-cycle operation runs for a set number of timed steps.
