simpleMeaning: a common trailing plant of eastern North America that lives year after year, a kind of
  milkwort with leaves like wintergreen and usually pink-purple flowers with winged outer petals
scope: A low trailing plant with pink-purple flowers, not wintergreen itself and not other milkworts;
  also called bird-on-the-wing, flowering wintergreen, and fringed polygala.
examples:
- Gaywings spread along the forest floor with pink-purple flowers.
- We found gaywings trailing over the moss, its leaves much like wintergreen.
