simpleMeaning: A blend of mercury with another metal, usually silver, that dentists pack into tooth cavities;
  chemists use that label for most mercury-metal mixtures, since only iron and platinum resist dissolving.
scope: The dentist's filling material, not a figurative blend of different things; the shorter word 'amalgam'
  names the same alloy more generally.
examples:
- Some patients ask their dentist to replace dental amalgam with a tooth-coloured filling.
- Dental amalgam has been used for more than a century to restore back teeth.
