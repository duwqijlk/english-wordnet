simpleMeaning: In physics, a tiny bit of matter that is simpler than an atom and makes up all things.
scope: In physics, this is a tiny bit of matter simpler than an atom, also called an elementary particle;
  not an atom itself, and not a molecule made of atoms.
examples:
- A fundamental particle is far smaller than an atom.
- Scientists study fundamental particles to learn what all matter is made of.
