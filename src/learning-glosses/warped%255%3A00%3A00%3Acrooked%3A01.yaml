simpleMeaning: 'Above all of wood: boards or beams that have bent and twisted out of shape, most often
  after getting wet.'
scope: Wood that has bent out of shape, not wood that is simply old or cracked; the bending comes from
  water, not from being cut that way.
examples:
- The warped floorboards rose and dipped where the rain had got in.
- The warped door would no longer shut properly.
