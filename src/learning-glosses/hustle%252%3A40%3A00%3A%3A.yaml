simpleMeaning: By hard, busy work that is especially dishonest, to sell a thing to someone or get a thing
  from them
scope: To push hard to sell or get things by busy, especially dishonest work, also called roll and pluck,
  not the dishonest trick itself.
examples:
- He hustled tickets outside the ground before the match.
- She hustled the tourists into buying cheap watches.
