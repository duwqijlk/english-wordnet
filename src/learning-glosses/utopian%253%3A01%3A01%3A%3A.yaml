senseId: 'utopian%3:01:01::'
synsetId: 03031707-a
simpleMeaning: about, or like, a place or society that people imagine, where life is perfect
scope: This is about, or like, an imagined perfect place or society. It is not about aiming for perfection
  that cannot be reached, and not a person who wants to change society in ideal ways.
examples:
- The book tells a utopian story about life in a perfect future world.
- They built a small utopian village where everyone shared work and food.
