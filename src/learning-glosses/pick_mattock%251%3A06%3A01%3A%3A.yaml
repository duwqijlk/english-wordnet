simpleMeaning: Used to break up hard ground and stony earth, this hand tool joins a pointed digging end
  and a flat cutting blade for more than one job.
scope: It is also called pick-mattock, and it is not a pick on its own or a flat blade on its own, but
  both in one hand tool.
examples:
- She used the pick mattock to break up the stony earth.
- He used the pick mattock on the hard, stony ground.
