simpleMeaning: A hard, flat growth shaped like a digging tool sits on each hind leg of this digging creature
  of the northern half of the world.
scope: It is also called spadefoot, a digging creature of the northern half of the world with a hard,
  flat growth on each hind leg.
examples:
- The spadefoot toad is a digging creature of the northern half of the world.
- Each hind leg of a spadefoot toad has a hard, flat growth shaped like a digging tool.
