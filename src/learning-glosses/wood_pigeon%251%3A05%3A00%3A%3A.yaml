simpleMeaning: A bird of Europe and Asia with white patches on its wings and neck
scope: A bird of Europe and Asia with white patches on wings and neck, also called cushat and ringdove;
  not a tame city bird kept in lofts and not a small wild dove of the fields.
examples:
- A wood pigeon fed on the lawn with white patches showing on its neck.
- We heard a wood pigeon call from the trees.
