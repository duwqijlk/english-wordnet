simpleMeaning: Its blade of joined metal strips runs 50 cm or more, often cut with deep grooves, and its
  hilt runs far out on this short sword.
scope: This short sword stands out from other seaxes by its long hilt and its blade of joined metal strips
  50 cm or more in length.
examples:
- The edge of the long seax ran straight to its tip.
- He held the long seax by its hilt.
