simpleMeaning: Generous and kind, showing that one feels for others and understands them.
scope: Also called kindly, sympathetic, benevolent, or charitable, generous and kind, showing that one
  feels for others and understands them; not the use for a person who speaks freely and plainly.
examples:
- She was openhearted, giving money and time to anyone in need.
- He was openhearted in his welcome, and the strangers felt at home.
