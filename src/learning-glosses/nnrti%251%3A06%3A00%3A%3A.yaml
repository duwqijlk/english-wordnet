simpleMeaning: A drug that fights viruses and is used against HIV; it fastens straight onto the part that
  turns RNA into DNA and stops the change; often used with other drugs.
scope: 'Also called non-nucleoside reverse transcriptase inhibitor: a drug that fights viruses and is
