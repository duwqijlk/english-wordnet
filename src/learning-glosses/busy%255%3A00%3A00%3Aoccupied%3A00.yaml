simpleMeaning: already taken by someone else, so not free to use — said of a phone line or toilet; in
  Britain such a phone line is called engaged
scope: This describes a phone line or toilet that is occupied, not a person with a lot to do, and not
  a place full of activity.
examples:
- I called her office, but the line was busy.
- The toilet is busy right now, so please use the one downstairs.
