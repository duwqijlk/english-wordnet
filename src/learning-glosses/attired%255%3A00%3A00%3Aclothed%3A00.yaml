simpleMeaning: wearing clothes, especially fine clothes, and often joined with another word
scope: 'Also called dressed, garbed, robed, and appareled: this means wearing clothes, especially fine
  ones, not being without clothes and not the clothes themselves.'
examples:
- The elegantly attired gentleman walked into the hall.
- The tuxedo-attired guests arrived for the dinner.
