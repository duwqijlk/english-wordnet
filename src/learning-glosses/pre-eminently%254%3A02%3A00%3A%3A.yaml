simpleMeaning: in a way that is far above all others, with more worth and note than the rest
scope: This is a word also called preeminently, used to say that something stands far above all others,
  not just a little better than most.
examples:
- She was pre-eminently the best singer in the whole town.
- The work was pre-eminently good, far above all the rest.
