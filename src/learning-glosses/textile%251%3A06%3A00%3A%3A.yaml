simpleMeaning: a thing made by weaving, felting, knitting, or crocheting threads from plants, animals,
  or man-made matter
scope: 'Also called material, cloth, and fabric: a thing made by weaving, felting, knitting, or crocheting
  threads; not a single thread and not a finished piece of clothing.'
examples:
- The textile in the curtains was light and semitransparent.
- She measured off enough textile for a dress.
