simpleMeaning: a plant that can live where there is very little water, with thick soft parts that hold
  water inside them for later use
scope: This is the plant itself, which holds water in its thick parts; it is not the word for food that
  is juicy and good to eat.
examples:
- A cactus is a succulent that can live in the desert.
- She keeps succulents on her dry, sunny window ledge and waters them only rarely.
