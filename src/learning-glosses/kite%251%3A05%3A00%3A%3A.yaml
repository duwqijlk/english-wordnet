simpleMeaning: one of several kinds of small hawk in one hunting bird family, with long pointed wings;
  it moves in a smooth, light way and eats insects and small animals
scope: A small hunting bird with long pointed wings, not the light toy flown on a string and not a bad
  bank check.
examples:
- A kite flew low over the fields looking for small animals.
- We watched a kite catch an insect in the air.
