simpleMeaning: Most often a weed on land where crops are grown, this plant of North America bears thin
  brushy bunches of flowers.
scope: Also called old witch grass, old witchgrass, witch grass, and witchgrass, this North American plant
  is most often found as a weed on land where crops are grown.
examples:
- On land where crops are grown, tumble grass grows as a weed.
- With thin brushy bunches of flowers, tumble grass grew on the land where crops were grown.
