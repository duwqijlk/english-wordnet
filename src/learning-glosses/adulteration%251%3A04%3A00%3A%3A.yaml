simpleMeaning: the act of making a thing worse, especially by putting one thing in place of another against
  the rules
scope: This is the act of making a thing worse by putting one thing in place of another against the rules,
  not an honest change to a recipe and not a plain mistake in making it.
examples:
- The adulteration of the milk with water was found by the food inspectors.
- Adulteration of the medicine put patients at risk.
