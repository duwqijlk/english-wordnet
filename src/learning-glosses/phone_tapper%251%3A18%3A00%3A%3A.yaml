simpleMeaning: A person who joins a listening set to a voice or signal wire in secret, to hear what is
  said over it
scope: 'Another name for a tapper: a person who listens in on a voice or signal wire in secret, not a
  person who fixes wires and not a person who listens with leave to do so.'
examples:
- The phone tapper had joined his own set to the line outside the house.
- Police said a phone tapper had been at work on the office wires for weeks.
