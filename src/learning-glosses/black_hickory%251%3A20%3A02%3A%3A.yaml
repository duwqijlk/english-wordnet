simpleMeaning: a hard-shelled nut good to eat grows on this smooth-barked North American hickory, which
  has seven to nine leaflets
scope: Also called big-bud hickory, mockernut, mockernut hickory, and white-heart hickory; a smooth-barked
  North American hickory, not a rough-barked hickory or a walnut.
examples:
- The black hickory in the yard bears hard-shelled nuts.
- Black hickory has smooth bark and seven to nine leaflets.
