scope: A cone-shaped tree of south-west California with sharp, pointed leaves and cone scales ending in
  long spines, not a pine and not a spruce.
examples:
- The bristlecone fir grows in south-west California.
- Its leaves are sharp, and the bristlecone fir has long spines on its cones.
