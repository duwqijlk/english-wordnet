simpleMeaning: The hot cloud of tiny carbon bits that rises when something burns.
scope: This is the hot, carbon-filled cloud from burning, not the act of breathing in tobacco.
examples:
- Thick smoke poured from the burning building.
- The smoke from the campfire made her cough.
