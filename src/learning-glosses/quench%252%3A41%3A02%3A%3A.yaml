simpleMeaning: In electrical work, to stop sparks when power is cut off in a coil circuit, or to stop
  a swing or a sudden flow of power in a part
scope: In electrical work, to stop sparks when power is cut off, or to stop a swing or a sudden flow of
  power; not to weaken a glow, and not to put out a fire.
examples:
- The circuit quenched the spark when the switch was opened.
- The device quenches the discharge before it can damage the parts.
