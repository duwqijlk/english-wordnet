simpleMeaning: a musical instrument of the 1500s, like a guitar, with a pear-shaped body that makes the
  sound and wire strings
scope: 'Also called cither, cithern, citole, and cittern: a musical instrument of the 1500s, like a guitar
  with a pear-shaped body and wire strings, not a modern guitar and not a lute.'
examples:
- The gittern in the museum had a pear-shaped body and wire strings.
- A player of the gittern sang songs from the 1500s.
