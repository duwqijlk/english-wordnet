simpleMeaning: the bony meat of a fish like a herring, usually caught as it travels to fresh water to
  lay its eggs, especially on the Atlantic coast
scope: The meat of this fish, eaten as food, especially from the Atlantic coast; not the live fish itself.
examples:
- We fried the shad and carefully picked out the many small bones.
- Fresh shad from the Atlantic coast is on the menu tonight.
