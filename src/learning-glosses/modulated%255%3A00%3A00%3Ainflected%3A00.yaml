simpleMeaning: changed in how loud a sound is and also in its tone or how high or low it is
scope: About a sound changed in loudness and also in tone or in how high or low it is; not the wider sense
  where only one of these may change.
examples:
- His modulated voice got louder and deeper for the king's lines.
- She spoke in a modulated way, changing both loudness and tone for each person.
