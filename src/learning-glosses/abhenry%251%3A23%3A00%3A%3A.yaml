simpleMeaning: a very small unit for measuring inductance, how much a coil fights a change in electric
  current, one thousand-millionth of the full unit
scope: This is a very small unit for measuring inductance; not the full unit and not a measure of electric
  current itself.
examples:
- The coil had an inductance of just a few abhenrys.
- Engineers seldom use the abhenry because it is so small.
