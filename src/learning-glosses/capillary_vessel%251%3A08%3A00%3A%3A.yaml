simpleMeaning: any of the very small blood tubes that join the tiny tubes from the heart to the tiny tubes
  back to the heart
scope: 'Also called capillary: any of the very small blood tubes that join the tiny tubes from the heart
  to the tiny tubes back to the heart, not a large blood tube and not a tube that carries air.'
examples:
- A capillary vessel lets blood pass into the tissues.
- The capillary vessels in the skin are very small.
