simpleMeaning: A net of nerves that serves the organs low in the belly.
scope: A net of nerves serving the organs low in the belly, also called plexus hypogastricus, not a single
  nerve and not a net of blood tubes.
examples:
- The hypogastric plexus carries signals to the organs low in the belly.
- Damage to the hypogastric plexus can upset the bladder.
