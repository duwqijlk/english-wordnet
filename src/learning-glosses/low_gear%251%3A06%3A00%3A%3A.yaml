simpleMeaning: The bottom forward speed setting in a motor vehicle, used to start a car moving.
scope: The bottom forward speed setting in a motor vehicle, used to start a car moving; low, first and
  first gear are other names for this sense, not a high speed setting for fast driving.
examples:
- Put the car in low gear to climb the steep hill.
- She started in low gear and changed up as the car picked up speed.
