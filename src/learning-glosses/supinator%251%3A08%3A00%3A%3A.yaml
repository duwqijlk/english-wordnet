simpleMeaning: a muscle, most of all in the forearm, that makes or helps the turning of the palm to face
  up
scope: This is a muscle in the forearm that turns the palm up, not a muscle that bends the elbow and not
  a muscle that turns the palm down.
examples:
- The supinator helped turn his palm up to catch the ball.
- After the injury, her supinator was too weak to turn her palm up.
