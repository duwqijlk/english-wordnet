simpleMeaning: A rule that push put on a body of fluid anywhere spreads the same in all directions; the
  push acts at right angles to any face touching the fluid
scope: This is a rule about how push spreads through a fluid, also called Pascal's law of fluid pressures.
examples:
- Pascal's law explains how a hydraulic press works.
- Under Pascal's law, push on a fluid spreads the same in all directions.
