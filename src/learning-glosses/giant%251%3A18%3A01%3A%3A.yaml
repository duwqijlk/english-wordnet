simpleMeaning: Someone of exceptional importance whose standing is well known.
scope: A person of exceptional importance and standing, not the imaginary giant of folklore, a physically
  huge person, or the giant star.
examples:
- She became a giant in the field of modern medicine.
- A giant of the civil rights movement, he inspired millions.
