simpleMeaning: to smile in a false, showy way, or to smile at someone in a mocking way
scope: Another name for this act is smirk; this is the verb, not the noun sense that names the smile itself.
examples:
- She simpered at the guests as she took their coats.
- He simpered when his rival made a mistake.
