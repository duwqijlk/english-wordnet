simpleMeaning: a tree of warm parts of America that keeps its leaves all year and bears nuts shaped like
  a kidney, which people can eat only after they are roasted
scope: 'Also called cashew: a warm-climate evergreen tree with roasted nuts, not a nut tree of cold lands
  and not a tree grown only for its wood.'
examples:
- The cashew tree in the yard bears nuts that must be roasted.
- Farmers grow cashew trees for their nuts.
