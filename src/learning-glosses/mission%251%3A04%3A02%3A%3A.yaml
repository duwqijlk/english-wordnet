simpleMeaning: The organized work of spreading a religion, done by people sent out to teach it.
scope: This is the religious work itself, not the organization of people who carry it out, and not an
  ordinary assignment or a military operation.
examples:
- The church sent her to do mission work in the highlands.
- He devoted his later years to mission work among poor families.
