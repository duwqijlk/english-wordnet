simpleMeaning: a bright happy look in the eyes or on the face that shows joy
scope: Also called light and sparkle, this is a bright happy look in the eyes or on the face that shows
  joy, not a bit of burning matter and not a small sign of a feeling.
examples:
- He had a spark in his eye when he laughed.
- There was a spark in her eyes as she told the joke.
