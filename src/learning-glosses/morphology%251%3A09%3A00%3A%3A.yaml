simpleMeaning: The part of biology that studies the shape and build of animals and plants.
scope: The part of biology that studies the shape and build of animals and plants; not the part of geology
  that studies the shape, layout, and growth over time of rocks and land.
examples:
- She studied morphology to learn how animal bodies are built.
- Morphology showed how the plant's leaves were shaped.
