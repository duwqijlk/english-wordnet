senseId: awing%5:00:00:impressive:00
synsetId: 01285602-s
simpleMeaning: Filling one with awe, wonder, and high regard.
scope: This sense is also called amazing, awesome, and awful, for filling one with awe, wonder, and high
  regard, where amazing is so surprising and striking that it leaves you full of wonder, awesome is what
  stirs a strong feeling of respect and amazement, or of great admiration, and awful is so grand or striking
  that it fills you with wonder and respect.
examples:
- The sight was awing, filling us with wonder.
- Awing views filled them with awe.
