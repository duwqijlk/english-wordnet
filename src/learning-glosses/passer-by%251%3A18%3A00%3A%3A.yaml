simpleMeaning: a person who goes past a place in a casual way or by chance
scope: A person who goes past a place in a casual way or by chance, also called passer and passerby; not
  a person who lives nearby and not a person who came there on purpose.
examples:
- A passer-by saw the crash and called for help.
- The passer-by had no link to the house.
