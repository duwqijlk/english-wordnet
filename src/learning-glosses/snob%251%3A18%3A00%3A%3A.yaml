simpleMeaning: a person that people see as thinking he or she is better than others, and annoying to be
  with
scope: 'Also called snot and prig: a person people see as too proud and annoying, not just someone who
  likes fine things.'
examples:
- People call him a snob because he looks down on everyone else.
- The other guests thought he was a snob and did not enjoy talking to him.
