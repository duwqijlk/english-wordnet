simpleMeaning: a machine that keeps things that spoil from going bad by making them ice-cold, then lowering
  the air pressure so the ice in them turns to gas without melting
scope: A machine that keeps things that spoil by making them ice-cold and lowering the air pressure, not
  a machine that dries things with heat.
examples:
- The freeze-dryer kept the medicine good for years.
- They put the fruit in the freeze-dryer to keep it from going bad.
