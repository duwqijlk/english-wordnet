simpleMeaning: In daisy-family plants such as thistles and dandelions, the ring of small leaves at a flower's
  base is made of scales, stiff hairs, or soft hairs like feathers.
scope: The ring of small leaves at a flower's base, in daisy-family plants such as thistles and dandelions.
examples:
- The pappus of the dandelion is a ring of soft hairs.
- Each thistle flower has a pappus of stiff bristles.
