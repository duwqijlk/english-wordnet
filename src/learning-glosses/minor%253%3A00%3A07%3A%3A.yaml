simpleMeaning: less serious or less dangerous than others; not great in harm or risk
scope: This means not very bad or risky; it is not about low importance or rank, and not about a wrong
  act that should get only a short punishment.
examples:
- She had only minor cuts after the fall.
- There was minor flooding after the rain.
