simpleMeaning: behaving with calm, polite and proper manners that show good judgment and are worthy of
  respect
scope: This describes calm, polite and proper behaviour that is worthy of respect; it is not rude or careless
  behaviour.
examples:
- She gave a decorous smile and spoke in a quiet, polite way.
- His decorous behaviour at dinner pleased the older guests.
