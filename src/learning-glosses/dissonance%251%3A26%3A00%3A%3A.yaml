schema: oewn-learning-gloss-v2
senseId: 'dissonance%1:26:00::'
synsetId: 14005842-n
simpleMeaning: a strong disagreement between people in what they think, in what they do, or in the kind
  of people they are
scope: 'Also called disagreement and dissension: this is a strong disagreement between people; it is not
  the sense about a bad sound with no musical quality.'
examples:
- There was dissonance between the two leaders over how to spend the money.
- Dissonance grew in the team as members chose different ways to work.
