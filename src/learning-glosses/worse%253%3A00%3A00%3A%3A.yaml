simpleMeaning: Of poorer quality, condition or appeal than something else being compared.
scope: This is not the adverb for doing something less well; it describes a thing being of poorer quality
  than another.
examples:
- The second hotel was worse than the first.
- Her cough is worse today than yesterday.
