simpleMeaning: Sharp teeth edge the pointed leaves of a tall, strong-smelling plant that lives year after
  year, its loose sprays of pale yellow flowers in the eastern United States.
scope: 'Also called horse balm, horseweed, richweed, stone-root, and stone root: sharp teeth edge the
  pointed leaves of this tall, strong-smelling plant of the eastern United States, which lives year after
  year.'
examples:
- Stoneroot has pointed leaves edged with sharp teeth.
- Stoneroot grows tall in the eastern United States.
