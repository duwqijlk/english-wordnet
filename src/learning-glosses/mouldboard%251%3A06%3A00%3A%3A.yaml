simpleMeaning: A wedge made by the bent part of a steel plough blade, which turns over the cut earth.
scope: Also called moldboard; a wedge made by the bent part of a steel plough blade, not the whole plough
  and not the flat cutting edge.
examples:
- The mouldboard turned the soil as the plough moved on.
- A worn mouldboard leaves the furrow half-turned.
