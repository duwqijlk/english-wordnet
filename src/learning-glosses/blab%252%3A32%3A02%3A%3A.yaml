senseId: 'blab%2:32:02::'
synsetId: 01038676-v
simpleMeaning: to talk fast about small, unimportant things, and to keep on talking without stopping
scope: Also called chatter, clack, prattle, gibber, gabble, blabber, tattle, piffle, prate, twaddle, palaver,
  and maunder. It is fast talk about small things, not telling a secret that someone trusted you with.
examples:
- He blabbed for an hour about his shoes and the weather.
- She keeps blabbing about small things and never stops to listen.
