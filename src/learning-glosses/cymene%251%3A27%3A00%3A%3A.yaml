simpleMeaning: A colourless hydrocarbon liquid with a benzene-like ring, occurring in three forms in the
  scented oil of cumin and thyme and used in making synthetic resins.
scope: A single hydrocarbon compound found in plant oils, not the oils themselves or a plant.
examples:
- Cymene is one of the compounds that give cumin oil its smell.
- The factory uses cymene to make synthetic resin.
