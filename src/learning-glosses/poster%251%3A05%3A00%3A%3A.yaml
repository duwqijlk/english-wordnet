simpleMeaning: Travelers can hire this horse, and mail carriers can use it; it is kept at an inn or a
  place where horses are changed
scope: A horse kept for hire at an inn, not a person who sticks up notices and not a printed sign put
  up in a public place.
examples:
- The innkeeper lent the traveler a poster for the next stage of his trip.
- The poster was ready at the inn for the mail carrier.
