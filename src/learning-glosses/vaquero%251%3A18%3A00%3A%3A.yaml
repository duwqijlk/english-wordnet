simpleMeaning: A name used in one place for a cowboy; this one is used above all in southwestern and central
  Texas, while buckaroo is used above all in California.
scope: 'Also called buckaroo and buckeroo: a name used in one place for a cowboy, this one above all in
  southwestern and central Texas, not a farmer and not a soldier.'
examples:
- The vaquero rode out to bring in the cattle.
- In Texas, a vaquero is what people call a cowboy.
