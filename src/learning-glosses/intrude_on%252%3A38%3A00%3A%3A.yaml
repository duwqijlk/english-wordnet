simpleMeaning: By stepping into a place or a part of life that is not yours, you break a right or a rule
scope: To step into a place or a part of life that is not yours, also called encroach upon, invade or
  obtrude upon; not a welcome visit and not a fair claim.
examples:
- Please don't intrude on our talk.
- The new road would intrude on the farmers' fields.
