schema: oewn-learning-gloss-v2
senseId: 'heroically%4:02:00::'
synsetId: 00358426-r
simpleMeaning: in a brave way that shows no fear, even when there is great danger
scope: This tells how an action is done, with great bravery in danger. It does not name a brave person,
  and it is not about how something looks.
examples:
- The firefighter heroically ran into the burning house to save the child.
- She heroically stood in front of her friend when the dog attacked.
