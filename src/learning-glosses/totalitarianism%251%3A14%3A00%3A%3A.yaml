schema: oewn-learning-gloss-v2
senseId: 'totalitarianism%1:14:00::'
synsetId: 08457622-n
simpleMeaning: a way of ruling a country where one person has full power and is not held back by a constitution,
  laws, or people who oppose them
scope: Also called tyranny, authoritarianism, dictatorship, despotism, absolutism, monocracy, one-man
  rule and shogunate, this is a system where one ruler has full power, not just the belief that a government
  should have full power.
examples:
- Under totalitarianism, no one was allowed to speak against the ruler.
- The country lived under totalitarianism, and laws did not limit the ruler's power.
