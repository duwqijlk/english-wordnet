simpleMeaning: In most plants with tubes for water, a layer one cell thick between the wood and the parts
  that carry food makes new cells so the plant grows thicker.
scope: This layer inside most plants with tubes for water is what makes new cells; it is not the wood
  or the parts that carry food.
examples:
- New wood forms from the cambium in the trunk.
- The cambium makes new cells that let the trunk grow thicker.
