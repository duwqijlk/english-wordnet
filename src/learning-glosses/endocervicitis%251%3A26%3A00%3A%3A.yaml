simpleMeaning: Swelling with heat and pain in the wet inner skin of the lower neck of the womb.
scope: A painful swelling of the inner skin at the neck of the womb, not a swelling of the womb itself
  and not a swelling of the birth canal.
examples:
- The doctor found endocervicitis during her check-up.
- Endocervicitis made the inner skin of her cervix sore and swollen.
