simpleMeaning: At times measured for a quick health check, this force of the moving liquid on its tube
  walls comes from the squeeze of the lower left chamber of the heart.
scope: This is the force of the moving liquid on its tube walls, not the beat of the heart itself and
  not the flow of the liquid.
examples:
- Her blood pressure was taken to judge how healthy she was.
- Blood pressure comes from the squeeze of the lower left chamber of the heart.
