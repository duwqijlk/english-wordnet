simpleMeaning: An upright bushy hairy annual plant with three-part leaves and purple to pink flowers;
  grown for food, feed and better soil, mainly for its nutritious oily seeds; native to Asia.
scope: Also called soybean, soy, soya, soja, soja bean, soya bean and soybean plant; a plant grown for
  its oily seeds, not a plant grown for its flowers and not a climbing bean.
examples:
- Glycine max is grown for its oily seeds.
- The field was planted with Glycine max this year.
