simpleMeaning: to make something less thick or less solid
scope: To make something less thick or less solid, not to break it apart and not the chemical sense about
  making a substance weaker.
examples:
- Heat can rarefy the wax, making it less solid than before.
- Doctors found that the bone had been rarefied and was no longer as solid.
