simpleMeaning: A plum plant that grows wild in the northeastern United States. Its fruit is dark purple,
  and the flesh inside is yellow
scope: This is the wild plum plant of the northeastern United States; not the small sour dark purple fruit
  itself, and not the thorny bush from Europe and Asia with plum-like fruits.
examples:
- A sloe grew at the edge of the woods, full of dark purple fruit.
- The sloe in that part of the United States bears fruit with yellow flesh.
