  with one seed inside, on this Australian plant.
scope: This Australian plant is also called a blue fig, a quandong, or a quandong tree.
examples:
- The silver quandong tree has glossy green leaves and white flowers.
- Glossy blue fruit with one seed inside grows on the silver quandong tree.
