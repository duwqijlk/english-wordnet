simpleMeaning: the act of making something very wet all the way through with a liquid
scope: The act of making something wet through with a liquid, not a state in which adding more has no
  effect, and not how strong and pure a color is.
examples:
- Saturation of the soil left water standing on the fields.
- After saturation, the cloth could hold no more water.
