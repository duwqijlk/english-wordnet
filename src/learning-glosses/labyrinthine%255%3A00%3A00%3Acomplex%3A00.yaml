schema: oewn-learning-gloss-v2
senseId: labyrinthine%5:00:00:complex:00
synsetId: 02186248-s
simpleMeaning: like a place with many twisting paths that is hard to find your way through, in shape or
  in how hard it is to follow
scope: Also called mazy, this sense is about the shape of a place or network with many twisting paths,
  or about how hard such a place or network is to follow; it is not the sense that means very complicated
  and sometimes tricky or dishonest, and not the sense about the inner ear.
examples:
- The old town has a labyrinthine set of small streets that twist and cross each other.
- Visitors got lost in the labyrinthine halls of the old palace.
