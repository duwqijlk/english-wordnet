simpleMeaning: In eye medicine, something wrong with the way the eye bends light, so things far away look
  blurred.
scope: Also called nearsightedness or shortsightedness, in eye medicine something wrong with the way the
  eye bends light, so things far away look blurred.
examples:
- Her myopia meant she could not read the board from the back of the room.
- Myopia makes distant road signs look blurred.
