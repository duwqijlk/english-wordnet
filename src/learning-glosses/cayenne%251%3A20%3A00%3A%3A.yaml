simpleMeaning: A plant that bears long peppers, very hot, narrowing to a fine point, and usually red.
scope: Also called jalapeno; a plant bearing very hot, long peppers, usually red, not the ground spice
  made from its pods and seeds.
examples:
- Cayenne grew in pots on the sunny sill.
- The cayenne peppers were long, hot, and red.
