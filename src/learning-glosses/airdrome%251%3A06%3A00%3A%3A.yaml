simpleMeaning: Planes take off and land here, where a tower guides them and sheds hold them, with rooms
  for people and goods
scope: Also called an airport, an aerodrome, or a drome, this is a place where planes take off and land,
  with a tower, sheds, and rooms for people and goods.
examples:
- The airdrome was busy as planes came in to land.
- Passengers waited in the airdrome while their luggage was loaded.
