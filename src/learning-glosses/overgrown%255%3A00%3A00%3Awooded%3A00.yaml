simpleMeaning: A place full of plants that have grown wild, usually plants no one wants there
scope: A place thick with wild plants no one wants, not a single plant that has grown too big.
examples:
- The garden was overgrown with weeds and wild grass.
- An overgrown path led through the trees to the old house.
