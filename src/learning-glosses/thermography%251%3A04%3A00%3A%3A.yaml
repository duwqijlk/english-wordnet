senseId: 'thermography%1:04:00::'
synsetId: 01008255-n
simpleMeaning: a way to find illness by using a heat camera to record heat from parts of the body, to
  study blood flow and find growths
scope: A method of finding illness from body heat, not the heat camera itself, and not a blood test.
examples:
- Thermography helped the doctor study the blood flow in her leg.
- The clinic used thermography to look for growths that could not be felt.
