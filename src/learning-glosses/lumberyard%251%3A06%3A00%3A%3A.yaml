simpleMeaning: a place of work where wood for building is kept ready to be sold
scope: A place where wood for building is kept to be sold. It is not a forest where trees grow, and not
  a workshop where things are made from wood.
examples:
- He bought the boards he needed at the lumberyard.
- The lumberyard keeps long planks under a roof until they are sold.
