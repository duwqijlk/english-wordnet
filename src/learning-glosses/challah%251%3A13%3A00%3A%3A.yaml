simpleMeaning: In Judaism, a white loaf enriched with eggs and yeast, often braided and brushed with beaten
  egg before baking
scope: Another name for hallah, a Jewish egg bread; not a plain white sandwich loaf or a sweet cake.
examples:
- She baked a challah for the Sabbath meal.
- The challah was braided and glazed with egg.
