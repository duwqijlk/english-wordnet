simpleMeaning: a machine that prints each character as a pattern of dots
scope: A machine that prints each character as a pattern of dots; dot matrix printer and dot printer are
  other names for this sense, not a printer that prints whole letters at once and not a machine that prints
  pictures only.
examples:
- The old matrix printer clattered as it printed the letter.
- A matrix printer forms each character from dots.
