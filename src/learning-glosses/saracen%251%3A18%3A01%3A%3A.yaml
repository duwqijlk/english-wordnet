simpleMeaning: In past times, a person from the wandering tribes of the dry lands of Syria and Arabia
  when Rome ruled.
scope: A member of a wandering desert people of old Syria and Arabia in Roman times, not a Muslim fighter
  of the Crusades and not a person of Arabia today.
examples:
- The Saracen traders crossed the desert with their camels.
- Saracen camps stood in the dry lands of Syria and Arabia.
