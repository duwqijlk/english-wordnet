simpleMeaning: A tube of slimy skin and muscle running some 8.3 metres from mouth to anus, at work in
  breaking down food and clearing waste.
scope: This sense is also called alimentary canal, alimentary tract, digestive tract, and digestive tube,
  for a tube of slimy skin and muscle running some eight point three metres from mouth to anus, at work
  in breaking down food and clearing waste.
examples:
- The gastrointestinal tract breaks down food.
- Food passed through the gastrointestinal tract.
