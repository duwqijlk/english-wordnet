simpleMeaning: 'It is thought to make people talk freely: a sleep-making, numbing dose put into a vein
  loosens people up and weakens their hold on what they keep back.'
scope: Also called truth serum; a drug given by vein that loosens people up and is thought to make them
  talk freely.
examples:
- The spy was given a truth drug before the questioning began.
- The truth drug loosened her up, and she began to talk freely.
