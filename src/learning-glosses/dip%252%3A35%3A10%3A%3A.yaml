simpleMeaning: to push your hand or a thing for holding something quickly down into a container
scope: To push a hand or a container down into something that holds things; not to take something up and
  out, and not to put something in liquid for a short time to make it wet.
examples:
- She dipped her hand into the bag to find her keys.
- He dipped the cup into the big water bucket.
