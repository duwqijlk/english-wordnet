simpleMeaning: A pill sold as Fosamax, given to women past the change of life to stop or treat weak, brittle
  bones.
scope: A pill for weak bones in women past the change of life, also called Fosamax by its trade name;
  not a calcium pill and not a pain pill.
examples:
- Her doctor gave her alendronate to keep her bones strong.
- She takes alendronate once a week.
