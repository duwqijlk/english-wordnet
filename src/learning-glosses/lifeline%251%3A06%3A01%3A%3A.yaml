simpleMeaning: a rope used to lift a diver in deep water up or let the diver down
scope: A rope used to lift a diver in deep water up or let the diver down; not a rope thrown to a drowning
  person, and not help that keeps people going.
examples:
- The crew hauled on the lifeline to bring the diver up.
- He held the lifeline as he went down to the wreck.
