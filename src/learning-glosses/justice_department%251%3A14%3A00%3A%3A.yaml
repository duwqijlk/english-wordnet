simpleMeaning: The part of the United States government that makes sure federal laws are kept, including
  all laws about civil rights, set up in 1870.
scope: The part of the United States government that makes sure federal laws are kept, including all laws
  about civil rights, set up in 1870, also called Justice, Department of Justice and DoJ, among other
  parts of the United States government.
examples:
- The Justice Department brought the case to court.
- The Justice Department was set up in 1870 to enforce federal laws.
