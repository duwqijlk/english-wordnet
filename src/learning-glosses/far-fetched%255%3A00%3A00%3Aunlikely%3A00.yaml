simpleMeaning: Said of a theory or reason given for something, made up with great fancy but hard to believe
scope: 'Also called farfetched: a theory or excuse that sounds made up and is hard to believe, not a plain
  guess and not a lie.'
examples:
- His far-fetched excuse for being late fooled no one.
- The far-fetched theory about the missing keys did not convince her.
