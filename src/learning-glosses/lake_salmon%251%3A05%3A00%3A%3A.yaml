simpleMeaning: This Atlantic kind of fish never reaches the sea; it lives only in the still waters of
  New England and the southeast of Canada.
scope: One of the Atlantic kinds of fish, also called landlocked salmon, it lives only in the still waters
  of New England and the southeast of Canada, and never reaches the sea.
examples:
- We fished for lake salmon in the still waters of New England.
- We watched lake salmon swim in the still waters.
