simpleMeaning: very good manners and very good behaviour when with other people
scope: This is the quality of having very good manners and very good behaviour with other people, not
  wealth, high rank or fine looks.
examples:
- She thanked every guest with graciousness.
- His graciousness made visitors feel welcome in his home.
