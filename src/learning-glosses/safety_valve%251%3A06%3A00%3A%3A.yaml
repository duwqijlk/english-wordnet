simpleMeaning: When the push inside a closed pot, like a boiler, grows too strong, this part opens on
  its own to let the steam out.
scope: This part is also called an escape, an escape cock, an escape valve, or a relief valve; it opens
  on its own when the push inside a boiler grows too strong.
examples:
- The safety valve opened on its own and the boiler did not burst.
- A faulty safety valve can let a boiler burst.
