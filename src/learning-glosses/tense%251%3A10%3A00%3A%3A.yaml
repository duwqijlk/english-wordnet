simpleMeaning: In grammar, a group of verb forms that show when something happens, in the past, now, or
  in the future
scope: This is the grammar sense about time in verb forms, not feeling nervous or worried, and not being
  pulled tight.
examples:
- The past tense of 'go' is 'went'.
- In this tense, the verb shows that something will happen later.
