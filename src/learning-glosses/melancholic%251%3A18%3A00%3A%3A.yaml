senseId: 'melancholic%1:18:00::'
synsetId: 10326262-n
simpleMeaning: a person who often feels deep, lasting sadness
scope: This is a person who often feels deep, lasting sadness. It is not the describing word for something
  sad or making people sad, and it is not a short sad feeling that soon passes.
examples:
- The old poet was a melancholic who wrote about his long sadness.
- As a melancholic, she found it hard to feel joy even on bright days.
