simpleMeaning: Its young dig into green blades and eat the soft stuff inside; this moth or two-winged
  fly is one of several kinds, above all those of the Gracilariidae group.
scope: Also called a leaf-miner, this is one of several kinds of small moth or two-winged fly whose young
  dig and feed inside green blades.
examples:
- A leaf miner dug into the leaf to feed.
- The leaf miner's young fed on the soft stuff inside the leaf.
