simpleMeaning: having a covering on the outside, especially a thin metal one
scope: About a thing that has a covering on its outside, often metal; not the sense of a person wearing
  clothes.
examples:
- The pipes were clad in copper to keep them from rusting.
- An armor-clad tank rolled slowly down the street.
