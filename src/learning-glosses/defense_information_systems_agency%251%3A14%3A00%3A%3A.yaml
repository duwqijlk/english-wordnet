simpleMeaning: A combat-support group in the Department of Defense that builds, runs and supports information
  systems for the President, the Secretary of Defense and the Joint Chiefs of Staff.
scope: Also called DISA, this group serves the President and its top officers, not a fighting force.
examples:
- The Defense Information Systems Agency keeps the ways of passing on facts working day and night.
- The Defense Information Systems Agency helps that country's leader talk to its top officers.
