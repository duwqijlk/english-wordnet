simpleMeaning: when something breaks open all at once with great force and flies apart
scope: Also called burst; this is the act of breaking apart, not the loud noise it makes and not the small
  puff of air at the end of a speech sound.
examples:
- The explosion of the firecrackers awoke the children.
- The explosion of the gas tank sent pieces flying across the yard.
