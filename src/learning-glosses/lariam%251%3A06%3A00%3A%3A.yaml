simpleMeaning: A drug against malaria that works where chloroquine fails; it is said to harm the mind
  and nerves in some people.
scope: A drug against malaria that works where chloroquine fails, also called mefloquine, mefloquine hydrochloride
  and Mephaquine; its near kin are other drugs against malaria, such as chloroquine.
examples:
- Lariam works where chloroquine fails.
- He took Lariam before his trip.
