simpleMeaning: A tall plant of warm America, with big shield-shaped leaves and stems that are hollow inside
scope: A tall woody plant of warm America with big shield-shaped leaves and hollow stems; imbauba, snake
  wood, trumpet-wood and trumpet tree are other names for this sense. Not a plant with solid stems and
  not a plant of cold lands.
examples:
- Trumpetwood grows along the river bank.
- The trumpetwood's hollow stems rattle in the wind.
