simpleMeaning: A poisonous foul-smelling herb of the Old World with sticky hairy leaves and yellow-brown
  flowers, that gives two drugs, hyoscyamine and scopolamine
scope: A poisonous foul-smelling herb; black henbane, henbane and stinking nightshade are other names
  for this sense, not a sweet-smelling garden herb or a harmless leafy weed.
examples:
- Hyoscyamus niger grew behind the wall, its yellow-brown flowers easy to spot.
- Keep children away from Hyoscyamus niger; it is a poisonous herb.
