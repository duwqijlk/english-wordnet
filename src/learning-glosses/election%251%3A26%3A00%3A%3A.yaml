simpleMeaning: the state or fact of being chosen by a vote
scope: The fact of being chosen by a vote for a job or place, not the belief that God has chosen some
  people to be saved.
examples:
- They celebrated his election as mayor.
- Her election to the council was a surprise to everyone.
