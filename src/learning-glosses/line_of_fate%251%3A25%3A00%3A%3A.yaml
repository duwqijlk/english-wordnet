simpleMeaning: People who read hands say this fold in the skin of the hand shows how well you will do
  in life
scope: 'Another name for line of destiny: the fold in the hand that is said to show how well you will
  do in life, not the heart fold and not the life fold.'
examples:
- She asked about the line of fate in her palm.
- The line of fate on his hand was deep and clear.
