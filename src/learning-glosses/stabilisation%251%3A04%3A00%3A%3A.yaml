simpleMeaning: the act of making something steady so it stays the same and does not move or change
scope: The act of making something steady; stabilization is another name for this sense; not the act of
  keeping a ship or plane from turning over.
examples:
- The stabilisation of prices helped farmers plan ahead.
- Wage stabilisation was needed for peace in the factories.
