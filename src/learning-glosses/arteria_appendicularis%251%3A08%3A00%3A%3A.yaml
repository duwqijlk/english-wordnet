simpleMeaning: The small worm-shaped part that hangs off the lower gut gets its blood from a side blood
  tube branching off the one that feeds the lower gut.
scope: This is a side blood tube, also called the appendicular artery, that carries blood to the small
  worm-shaped part hanging off the lower gut.
examples:
- The arteria appendicularis carries blood to the small worm-shaped appendix.
- When the appendix is taken out, the arteria appendicularis is tied off.
