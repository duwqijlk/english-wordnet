simpleMeaning: In astronomy, the angle north or south of the sky's equator at which an object sits, given
  in degrees and paired with right ascension to place it in the sky.
scope: A short written form of declination, the sky coordinate measured from the celestial equator; not
  a falling off or a refusal.
examples:
- The catalogue lists the star's dec as +38 degrees.
- Astronomers gave the object's dec and right ascension so others could find it.
