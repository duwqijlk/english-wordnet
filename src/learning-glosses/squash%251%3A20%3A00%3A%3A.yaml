simpleMeaning: one of many Cucurbita plants (a group of close kinds) that live one year, grow flat along
  the ground, and are grown for their soft fruit that people eat
scope: The plant itself, grown for its fruit; not the fruit eaten as food, and not the indoor ball game
  played with rackets.
examples:
- Squash grows fast in warm weather and spreads along the ground.
- We planted squash in the garden this spring for its fruit.
