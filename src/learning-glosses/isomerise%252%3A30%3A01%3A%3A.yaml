simpleMeaning: to make something turn into a new form of the same stuff, with the same parts set out in
  a new way
scope: To make something turn into a new form of the same stuff, with the same parts set out in a new
  way; isomerize is another name for this sense, not changing on its own.
examples:
- Heat can isomerise the compound into a new form.
- The chemist isomerised the stuff with a new method.
