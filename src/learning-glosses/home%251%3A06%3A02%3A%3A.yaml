simpleMeaning: In baseball, the flat rubber base where the batter stands, which a runner must touch in
  order to score.
scope: This is the baseball base at the plate, not the place where you live, not the house itself, not
  the country or city you come from, and not a comforting environment.
examples:
- The runner slid across home and the crowd roared.
- The umpire ruled that he never touched home.
