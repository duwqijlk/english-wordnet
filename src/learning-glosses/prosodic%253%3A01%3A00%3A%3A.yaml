simpleMeaning: The sounds above single sounds, how high the voice is, how hard sounds are hit, where they
  join, and nose and voice sounds, give speech its beat.
scope: Of the beat of speech and the sounds above single sounds.
examples:
- The prosodic beat of the poem made it easy to chant.
- Her prosodic skill showed in the rise and fall of her voice as she read.
