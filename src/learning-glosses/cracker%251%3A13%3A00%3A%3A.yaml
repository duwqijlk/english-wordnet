simpleMeaning: a thin crisp flat cake made of flour and water, with or without something to make it rise
  and with or without fat, not sweet or only a little sweet
scope: A thin crisp flat cake made of flour and water, not sweet or only a little sweet; not the computer
  breaker, not the party gift, and not the firework.
examples:
- She spread cheese on a cracker.
- He ate two crackers with his soup.
