simpleMeaning: Thin curled strips cut from trees, used for packing or stuffing
scope: Thin curled strips cut from trees for packing or stuffing, also called excelsior; not fine dust
  from sawing and not soft straw used for packing.
examples:
- We packed the glass jars in wood shavings so they would not break.
- The box was full of wood shavings around the vases.
