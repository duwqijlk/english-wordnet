simpleMeaning: As blood starts to clot, an enzyme set free from blood platelets turns prothrombin into
  thrombin.
scope: Also called thrombokinase, it is an enzyme from blood platelets that acts as blood starts to clot.
examples:
- As the blood began to clot, thromboplastin was set free from the platelets.
- As the blood clotted, thromboplastin turned prothrombin into thrombin.
