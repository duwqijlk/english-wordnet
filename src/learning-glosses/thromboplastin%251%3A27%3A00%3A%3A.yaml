simpleMeaning: From the tiny bits in blood that help it clot comes a stuff that changes one blood stuff
  into the stuff that makes blood clot as clotting starts.
scope: Also called thrombokinase, it is a stuff from blood platelets that acts as blood starts to clot.
examples:
- As the blood began to clot, thromboplastin was set free from the platelets.
- As the blood clotted, thromboplastin turned prothrombin into thrombin.
