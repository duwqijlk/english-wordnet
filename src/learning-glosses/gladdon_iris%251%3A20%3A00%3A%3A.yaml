simpleMeaning: Bad-smelling leaves and purple flowers grow on this iris in the south and west of Europe
  and in North Africa.
scope: Also called a gladdon, a roast beef plant, a stinking gladwyn, or a stinking iris, this iris of
  southern and western Europe and North Africa bears purple flowers and bad-smelling leaves.
examples:
- The gladdon iris bloomed with purple flowers.
- Its gladdon iris leaves smelled bad.
