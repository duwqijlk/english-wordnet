simpleMeaning: a plant that builds its own food from plain matter that contains carbon
scope: 'Also called autophyte, autophytic plant, and autotroph: a plant that makes its own food, not a
  plant that must feed on other living things and not an animal.'
examples:
- An autotrophic organism can live on light, air, and water alone.
- Each autotrophic organism in the pond made its own food.
