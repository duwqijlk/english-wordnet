simpleMeaning: the quality of being dull, flat, and lacking in interest or taste
scope: Being dull, flat, and lacking in interest or taste; vapidness is another name for this sense, and
  this is not simply being quiet or rude.
examples:
- The vapidity of his talk bored everyone.
- She was struck by the vapidity of the play.
