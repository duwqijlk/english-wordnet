simpleMeaning: to produce young animals or plants from parents of different breeds or types
scope: This is breeding two different varieties, not moving to the other side of something or folding
  limbs into a shape.
examples:
- The farmer crossed a hardy local sheep with a larger foreign breed.
- These roses were crossed to produce a flower that resists disease.
