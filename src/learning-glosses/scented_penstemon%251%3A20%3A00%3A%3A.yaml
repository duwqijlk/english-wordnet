simpleMeaning: A plant with upright stems that carry long, narrow clusters of puffy, sweet-smelling flowers
  in white to reddish pink, found in Arizona, New Mexico and Utah.
scope: A plant of Arizona, New Mexico and Utah, also called balloon flower.
examples:
- Scented penstemon has long, narrow clusters of sweet-smelling flowers on upright stems.
- The flowers of scented penstemon range from white to reddish pink.
