simpleMeaning: After a concert or play, the performers come back on stage to accept the audience's clapping.
scope: This is the performers' return to the stage after a show, not the bodily bend of respect and not
  the stringed-instrument tool.
examples:
- The audience kept clapping until the cast came out for a final bow.
- She took her bow after the last song and the lights went down.
