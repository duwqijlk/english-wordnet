simpleMeaning: In baseball, a throw to the batter delivered as fast as the pitcher can.
scope: A very fast pitch, not the cloud from a fire and not the act of using tobacco.
examples:
- The closer's smoke blew past the batter for strike three.
- He could not catch up to the smoke and swung late.
