simpleMeaning: Someone given the job of watching visitors from other countries, usually in a country where
  one group rules with full control
scope: This watcher is given the job of watching visitors from other countries, usually where one group
  rules with full control; not the person who cares for babies at home.
examples:
- A government minder stayed close to the visiting reporters at all times.
- Their minder watched the foreign guests and went with them everywhere they went.
