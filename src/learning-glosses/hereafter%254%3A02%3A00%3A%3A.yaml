synsetId: 00357692-r
simpleMeaning: in a later part of this document, statement, or other matter
scope: 'Also called hereinafter: this means later in the same document, not from now on and not in life
  after death.'
examples:
- The names are listed hereafter, in the last part of this letter.
- The rules set out hereafter must be followed by every member named in this document.
