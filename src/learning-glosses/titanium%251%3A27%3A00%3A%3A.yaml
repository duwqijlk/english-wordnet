simpleMeaning: A light, strong, grey, shining metal that does not rust, used in light, strong mixes for
  plane parts; its main sources are rutile and ilmenite.
scope: A light, strong, grey metal for plane parts, also called Ti and atomic number 22; not steel and
  not another light metal.
examples:
- Titanium parts keep a plane light and strong.
- The frame was made of titanium, not steel.
