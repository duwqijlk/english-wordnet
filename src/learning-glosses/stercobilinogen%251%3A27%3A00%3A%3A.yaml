synsetId: 14780933-n
simpleMeaning: A pigment precursor made in the gut from bilirubin breakdown; oxidation turns it into urobilins,
  and some leaves in feces while some is reabsorbed and excreted in bile or urine.
scope: A bile-pigment breakdown product formed in the bowel; not bilirubin, the pigment it comes from,
  and not urobilin, which it yields on oxidation. Medical biochemistry.
examples:
- The stool test detects stercobilinogen, which oxidizes to urobilin as the sample stands.
- Some stercobilinogen is reabsorbed from the colon and later appears in the urine.
