simpleMeaning: A set of connected carriages pulled by an engine along metal tracks, used to carry passengers
  or goods.
scope: This is not a line of animals or carts, and not a series of events; it is the railway vehicle itself.
examples:
- We took the train from London to Edinburgh.
- The train was late because of the snow.
