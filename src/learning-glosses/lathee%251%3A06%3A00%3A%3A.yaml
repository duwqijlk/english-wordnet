simpleMeaning: Police in India use this heavy stick, often made of bamboo and bound with iron
scope: 'Also called lathi: a heavy stick carried as a weapon by police in India, not a bat for sport and
  not a walking stick.'
examples:
- The constable raised his lathee to hold back the crowd.
- A lathee made of bamboo hung by the door of the police station.
