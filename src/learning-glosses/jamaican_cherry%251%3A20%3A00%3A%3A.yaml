simpleMeaning: A fast-growing tree of tropical America, green all year, with white flowers and soft edible
  fruit; its bark gives silky fibre for ropes, and its wood is prized for staves.
scope: 'Also called calabur tree, calabura, silk wood, silkwood, or Muntingia calabura: a fast-growing
  green tree of tropical America, not a cherry tree and not a plum tree.'
examples:
- The Jamaican cherry bears soft fruit in summer.
- We sat under a Jamaican cherry in the warm sun.
