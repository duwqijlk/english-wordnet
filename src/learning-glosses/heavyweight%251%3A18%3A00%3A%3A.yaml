simpleMeaning: a person who is very important and is well known
scope: Also called giant, titan, behemoth, and colossus, this is a very important and well-known person,
  not a boxer or a wrestler in the heaviest class.
examples:
- She is a heavyweight in the world of science, known to leaders everywhere.
- The meeting brought together several heavyweights from the film business.
