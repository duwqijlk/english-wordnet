simpleMeaning: A word book that has not been cut short by leaving out words or word meanings; a full word
  book.
scope: This is a word book that has not been cut short, also called unabridged; not a small pocket word
  book and not a book of quotations.
examples:
- The unabridged dictionary lists every word.
- She looked up the word in the unabridged dictionary.
