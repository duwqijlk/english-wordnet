simpleMeaning: something good that happens suddenly and brings good luck, such as a sudden chance to make
  money
scope: 'Also called boom, gravy, godsend, and bonanza: a sudden piece of good luck, not money you earn
  in the usual way and not a planned gain.'
examples:
- The town got a windfall when a rich visitor gave it a lot of money.
- Selling the old painting was a windfall for the family, who had not hoped to make so much.
