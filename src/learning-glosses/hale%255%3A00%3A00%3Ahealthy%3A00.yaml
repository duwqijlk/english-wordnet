simpleMeaning: showing strong good health, or brought back to strong good health
scope: 'Also called whole: strong and healthy, or well again after illness; not the verb hale that means
  to force someone to do something.'
examples:
- At ninety, she is still hale and hearty and walks every day.
- After months of illness, he is hale again and back at work.
