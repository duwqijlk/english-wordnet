simpleMeaning: Above all, about a star seen again after it was hidden by the sun's light, or seen for
  the last time before it is hidden; also near the sun.
scope: About a star rising or setting near the sun; heliac is another name for this sense, and this is
  not a word for the sun itself or for a star seen at night.
examples:
- The heliacal rising of the Dog Star marked the start of the year.
- Astronomers watched for the heliacal setting of the star before it vanished behind the sun.
