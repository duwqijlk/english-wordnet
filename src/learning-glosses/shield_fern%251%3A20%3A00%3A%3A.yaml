senseId: 'shield_fern%1:20:00::'
synsetId: 13213523-n
simpleMeaning: a plant with small covers, more or less shield-shaped, over its spore spots, of the groups
  Dryopteris, Polystichum or Lastreopsis
scope: Also called a buckler fern; a plant with covered spore spots, not a tree fern and not a flowering
  plant.
examples:
- The shield fern in the damp corner has dark green leaves.
- We planted a shield fern under the old oak tree.
