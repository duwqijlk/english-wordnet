simpleMeaning: A European grass that has spread as a weed in North America; its sharp-pointed seeds hurt
  farm animals that eat them.
scope: A European grass that has spread as a weed in North America, also called goat grass; its nearest
  kin are other grasses that spread as weeds and hurt farm animals.
examples:
- Aegilops triuncalis had spread through the field as a weed.
- The farmer pulled out Aegilops triuncalis before its seeds could hurt the sheep.
