simpleMeaning: To lift a thing out or up with a cup-shaped tool, or as if with one
scope: To lift a thing out or up with a cup-shaped tool, not to dig with a machine and not to fill a cup.
examples:
- Scoop the sugar out of the container.
- She scooped the rice onto her plate with a big spoon.
