simpleMeaning: A skin gland whose opening is blocked leaves its oily matter to fill a common small swelling
  under the skin.
scope: Wen, pilar cyst, and sebaceous cyst are other names for it, a common swelling under the skin.
examples:
- The steatocystoma felt like a small round swelling under the skin.
- A steatocystoma forms when a skin gland is blocked and its oily matter has nowhere to go.
