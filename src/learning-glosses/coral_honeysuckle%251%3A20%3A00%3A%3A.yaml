simpleMeaning: A plant of North America that climbs, keeps its leaves all year, and bears pinkish-red
  or orange flowers
scope: Also called trumpet flower, trumpet honeysuckle, and trumpet vine, this is a plant of North America
  that climbs, keeps its leaves all year, and bears pinkish-red or orange flowers.
examples:
- The coral honeysuckle climbed the fence with its red flowers.
- A coral honeysuckle grew along the wall, its orange flowers bright in the sun.
