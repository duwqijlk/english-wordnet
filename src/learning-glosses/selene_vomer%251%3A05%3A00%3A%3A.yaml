simpleMeaning: Like the moonfish, but with eyes high on its short flat forehead.
scope: 'Also called lookdown and lookdown fish: a fish like the moonfish, but with eyes set high on its
  short flat forehead, not the moonfish itself and not a fish with low-set eyes.'
examples:
- The Selene vomer held its eyes high on its forehead as it swam.
- A Selene vomer is easy to tell from a moonfish by the height of its eyes.
