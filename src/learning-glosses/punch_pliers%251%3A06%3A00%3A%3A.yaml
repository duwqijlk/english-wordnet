simpleMeaning: A hand tool with two arms that squeeze together to cut small holes in paper or leather
scope: A hand tool that cuts small holes in paper or leather, not pliers used only to grip things and
  not a desk hole punch.
examples:
- She used the punch pliers to make holes in the leather strap.
- The punch pliers cut two neat holes in the paper.
