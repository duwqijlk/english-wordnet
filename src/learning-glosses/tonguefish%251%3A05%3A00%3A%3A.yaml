simpleMeaning: a sea creature that lies flat, with both eyes on the left side, a tail that comes to a
  point, and little worth to sellers
scope: A sea creature that lies flat with both eyes on the left side, also called a tongue-fish; not a
  creature with eyes on both sides, and not one of much worth to sellers.
examples:
- The tonguefish lay flat on the sea floor, both eyes on its left side.
- A tonguefish is worth little, so few boats go out to catch it.
