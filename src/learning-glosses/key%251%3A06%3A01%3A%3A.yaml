simpleMeaning: A small bar you press down to make a machine work, such as one on a piano or a computer.
scope: This is a part you press to operate a machine, not a device that opens a lock or a set of musical
  notes.
examples:
- She hit the wrong key and the whole line of text vanished.
- The piano's middle key stuck and would not rise again.
