simpleMeaning: an athletic contest in which each player must do, one after another without a break, a
  spring on one foot, a stride, and a leap
scope: An athletic contest in which each player must do, one after another without a break, a spring on
  one foot, a stride, and a leap; triple jump is another name for this sense, not a long jump and not
  a high jump.
examples:
- She won the hop-step-and-jump with a leap of over twelve metres.
- The hop-step-and-jump needs a hop, a step and a jump in one flowing move.
