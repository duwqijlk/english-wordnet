simpleMeaning: the duty of a legal adviser to work for what is best for the person they serve
scope: The duty of a legal adviser to work for what is best for the person they serve; not a friendship,
  and not a business deal between strangers.
examples:
- The lawyer-client relation means she must act in his best interests.
- A lawyer-client relation begins when the client hires the lawyer.
