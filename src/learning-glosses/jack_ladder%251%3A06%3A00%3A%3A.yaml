simpleMeaning: Wooden or metal rungs or steps are held by this hanging ladder of ropes or chains on a
  ship.
scope: Also called a pilot ladder, it is the hanging ladder of ropes or chains on a ship that holds wooden
  or metal rungs or steps.
examples:
- The sailor climbed down the jack ladder.
- The jack ladder was made of ropes and wooden rungs.
