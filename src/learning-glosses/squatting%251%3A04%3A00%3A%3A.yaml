simpleMeaning: The act of lowering your body and staying there, with your knees bent and your bottom close
  to your heels.
scope: Holding a low crouching pose, also called a squat, not the exercise of bending down again and again.
examples:
- He stayed squatting by the fire for an hour.
- Squatting on her heels, she looked at the flowers.
