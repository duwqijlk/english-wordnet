scope: In mathematics, a number of the form a + bi; not the common sense of the word, which means something
  that is not real and exists only in the mind.
examples:
- The teacher wrote the imaginary number 4 + 3i on the board.
- In this lesson, every imaginary number on the page is written in the form a + bi.
