senseId: coterminous%5:00:00:commensurate:00
synsetId: 00483453-s
simpleMeaning: the same size, range, or length of time as something else
scope: To be the same in size, range, or length of time as something else, not to be bigger or smaller
  and not to share only a border; coextensive and conterminous are other names for this sense.
examples:
- The two empires were coterminous for a hundred years.
- Her time in office was coterminous with the war.
