simpleMeaning: very hard and unfriendly in manner or looks, in a way that puts people off and makes people
  a little afraid
scope: 'Also called grim and forbidding: hard and unfriendly in manner or looks, not simply serious or
  quiet, and not hard to do.'
examples:
- The dour teacher rarely smiled and spoke in a cold, hard voice.
- His dour face made the children afraid to ask him a question.
