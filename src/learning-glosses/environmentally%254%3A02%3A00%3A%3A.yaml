simpleMeaning: in a way that is for the natural world around us
scope: This word links a thing or action to the natural world around us; it is not a word for the rooms
  or places where a person lives or works.
examples:
- The factory must work in an environmentally safe way.
- They chose an environmentally safe way to clean the water, so no dirty water reached the river.
