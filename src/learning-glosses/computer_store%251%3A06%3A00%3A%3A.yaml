simpleMeaning: a shop that sells machines that work with numbers and facts to people who run small firms
  and to people who buy for their own use
scope: A shop that sells machines that work with numbers and facts to people who run small firms and to
  people who buy for their own use; not a shop that sells big machines to large firms and not a shop that
  fixes machines.
examples:
- He bought a new laptop at the computer store on Main Street.
- The computer store helped her pick a machine for her small shop.
