simpleMeaning: Its fruit goes into wines and jellies, from a common bush of central and eastern North
  America with dark purple berries.
scope: Also called sweet elder, this is a common bush of central and eastern North America with dark purple
  berries, whose fruit goes into wines and jellies; other bushes with dark berries are its nearest rivals.
examples:
- The black elderberry bore dark purple berries.
- Black elderberry fruit goes into wines and jellies.
