simpleMeaning: a small motor-driven boat whose deck is open or only partly covered.
scope: This is the boat itself, not the act of starting a business or sending a ship into the water, and
  not a large vessel with a fully enclosed deck.
examples:
- They tied the launch to the dock and climbed aboard.
- The little launch carried six passengers across the bay.
