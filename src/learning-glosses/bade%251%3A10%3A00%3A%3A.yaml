simpleMeaning: A Chadic tongue of north Nigeria, heard most in Yobe State — Jakusko, Bursari and Karasuwa
  — and also in Guri in Jigawa State and Zaki in Bauchi State.
scope: Also called Bade language; not any other tongue of Nigeria.
examples:
- Bade is spoken in Yobe State.
- She grew up hearing Bade at home.
