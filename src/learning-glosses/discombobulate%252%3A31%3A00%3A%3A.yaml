schema: oewn-learning-gloss-v2
senseId: 'discombobulate%2:31:00::'
synsetId: 00623406-v
simpleMeaning: to be hard to understand for someone and make them unable to think clearly
scope: This sense is also called fox, throw, confuse, confound, befuddle, bedevil, and fuddle. It is about
  a mind made unclear, not about being rude or making someone sad.
examples:
- The long list of rules discombobulated him, and he could not think what to do next.
- The new form discombobulates many people because the questions jump around.
