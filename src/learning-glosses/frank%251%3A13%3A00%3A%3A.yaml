simpleMeaning: Beef or pork cut into very small pieces and made into a smooth sausage, usually smoked;
  it is often served in a bread roll
scope: 'Dog is another name for this sense: a sausage often served in a bread roll. Not the word for speaking
  in a direct, honest way, and not stamping a letter.'
examples:
- He ate two franks with mustard at the fair.
- She put a frank in a bread roll for lunch.
