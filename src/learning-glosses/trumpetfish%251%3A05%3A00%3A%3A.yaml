simpleMeaning: A sea creature of warm Atlantic waters, with a long nose, that swims with its nose pointing
  down
scope: A warm-water Atlantic sea creature with a long nose that swims nose down; not a sea creature that
  swims upright and not one with a short nose.
examples:
- The trumpetfish drifted past the reef, nose down.
- We watched a trumpetfish hover above the coral with its long snout pointing down.
