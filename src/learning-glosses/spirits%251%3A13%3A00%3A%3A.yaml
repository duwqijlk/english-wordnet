simpleMeaning: a strong drink made by heating a liquid and cooling the steam back to liquid, not by letting
  it ferment
scope: A strong drink made by heating a liquid and cooling the steam back to liquid, not wine or beer,
  which are made by letting a liquid ferment.
examples:
- The shop sells spirits such as whisky and gin in tall bottles.
- He poured a small glass of spirits and drank it slowly with water.
