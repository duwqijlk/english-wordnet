simpleMeaning: shaking and moving of the ground, caused by movement under the earth along a crack or by
  the activity of a volcano
scope: 'Also called a quake: this is the shaking of the ground itself, not the crack under the earth and
  not a volcano on its own.'
examples:
- The earthquake shook houses across the whole city.
- After the earthquake, many roads were left cracked and broken.
