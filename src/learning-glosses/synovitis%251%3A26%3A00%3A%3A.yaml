simpleMeaning: a sore, swollen state of the thin lining inside a joint, which makes the joint hurt and
  swell
scope: This is a sore, swollen lining inside a joint, not the whole joint itself and not a broken bone.
examples:
- Synovitis made her knee hurt when she walked.
- The doctor said synovitis was causing the swelling in his wrist.
