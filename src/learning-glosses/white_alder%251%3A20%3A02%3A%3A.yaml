simpleMeaning: A bush of the east and south coasts of the United States, with lovely bunches of spice-scented
  pale flowers.
scope: A bush of the east and south coasts of the United States; pepper bush, summer sweet and sweet pepperbush
  are other names for this sense, not a tree and not a bush with red flowers.
examples:
- The white alder blooms with sweet-smelling pale flowers on the coast.
- We planted a white alder in the garden for its lovely flowers.
