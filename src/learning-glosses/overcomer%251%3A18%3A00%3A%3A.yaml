simpleMeaning: By force or by talk, this person beats others down and takes charge of them
scope: A person who beats others down by force or talk and takes charge of them, not one who gives in
  and not one who wins by luck.
examples:
- She proved an overcomer in every fight for the top job.
- The overcomer took charge of the group after the long fight.
