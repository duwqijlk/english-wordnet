senseId: 'wisdom_tooth%1:08:00::'
synsetId: 05315451-n
simpleMeaning: Any of the last four back teeth on each side of the upper and lower jaw, the last grown-up
  teeth to break through, between ages 16 and 21
scope: One of the last teeth to come through at the back of the mouth, not a front tooth and not a tooth
  that comes through in childhood.
examples:
- My wisdom tooth ached all weekend.
- The dentist took out her wisdom tooth.
