simpleMeaning: a pain-killing drug got from the saffron plant, used to treat gout, a painful swelling
  of the joints
scope: A pain-killing drug got from the saffron plant and used to treat gout, not a drug for other kinds
  of pain and not the plant itself.
examples:
- The doctor gave him colchicine for the gout in his foot.
- Colchicine eased the swelling in her toe within a day.
