simpleMeaning: to put a belt or a band around a person or a thing
scope: This is the act of putting a band around something, not the band or tight garment itself, and not
  cutting round a tree to kill it.
examples:
- She girdled her dress with a wide red sash.
- The workers girdled the post with strong steel bands.
