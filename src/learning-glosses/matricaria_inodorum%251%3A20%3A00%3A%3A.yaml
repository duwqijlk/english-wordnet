simpleMeaning: A common European weed living one year, with white flowers and finely cut leaves, wild
  and sometimes grown in eastern North America; sometimes classed under its own genus name
scope: Also called corn mayweed, scentless camomile, scentless false camomile, scentless hayweed, scentless
  mayweed, or Tripleurospermum inodorum; a common European weed with white flowers and finely cut leaves,
  now wild in the east of North America.
examples:
- Matricaria inodorum grew along the field edge, its white flowers bright in June.
- She pulled Matricaria inodorum from the garden beds.
