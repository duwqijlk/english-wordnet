simpleMeaning: A time set by law in the United States when people do not work, once named for the end
  of a war and given a new name in 1954
scope: Also called November 11, Veterans' Day and Veterans Day; not a holiday of another country, but
  a United States holiday.
examples:
- Schools close on Armistice Day, as they do on other public holidays.
- Armistice Day falls in November.
