simpleMeaning: A plant that lives for years, with many branches, growing in the east of the United States
  and carrying white, deep red or purple flowers.
scope: This is a wild plant of the eastern United States with white to purple flowers, not a garden plant
  grown for show and not a marsh plant with pink flowers.
examples:
- The swamp milkweed grew along the edge of the wet field.
- Bees visited the swamp milkweed for its purple flowers.
