simpleMeaning: White-to-scarlet flowers shaped like the hard mouth of a bird or like claws grow on this
  shrub from New Zealand, whose leaves stay on all year.
scope: Also called a parrot's beak, this is the New Zealand shrub whose flowers are shaped like the hard
  mouth of a bird or like claws and whose leaves stay on all year.
examples:
- The parrot's bill had white flowers shaped like claws.
- The parrot's bill kept its leaves through the year.
