simpleMeaning: The one-God faith of Muslims, begun in Arabia in the 7th century, built on the teachings
  of Muhammad set out in the Koran.
scope: This is the faith itself, not the civilization of Muslims as a whole; also called Islam, Islamism,
  Mohammedanism and Muhammadanism.
examples:
- Muslimism began in Arabia in the 7th century.
- The teachings of Muhammad lie at the heart of Muslimism.
