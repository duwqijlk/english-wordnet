simpleMeaning: By electronic means, reports about what has happened go out to papers from this body that
  gathers them
scope: Reports about what has happened go out by electronic means to papers from a body that gathers them;
  news agency, news organization, press agency and press association are other names for this sense, not
  a single paper and not a body that makes the news.
examples:
- The news organisation sent the report to papers in many towns.
- He works at a news organisation that gathers stories and sends them out by electronic means.
