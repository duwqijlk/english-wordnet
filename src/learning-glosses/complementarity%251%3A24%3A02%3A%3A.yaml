senseId: 'complementarity%1:24:02::'
synsetId: 13863666-n
simpleMeaning: A tie between two things where each adds to the other or leans on the other
scope: A tie between two things where each adds to the other or leans on the other; not the sense where
  two opposite states cover all that can be, and not a tie between things that have nothing to do with
  each other.
examples:
- The complementarity of the sexes shows how each adds to the other.
- Their work shows the complementarity of town and country.
