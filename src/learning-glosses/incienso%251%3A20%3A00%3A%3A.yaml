simpleMeaning: A fragrant, rounded shrub of the southwestern US and Mexico, with easily broken stems,
  dense blue-green leaves and yellow flowers; its resin goes into incense, varnish and folk medicine.
scope: The resinous desert shrub of the US Southwest and Mexico; brittle bush and brittlebush are other
  names for the same plant, not a separate incense product or spice.
examples:
- The shrub known locally as incienso grows all along the arroyo.
- They burned incienso resin as incense in the mission church.
