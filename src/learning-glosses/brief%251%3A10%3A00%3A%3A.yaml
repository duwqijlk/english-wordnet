simpleMeaning: a short written piece that gives only the main points of something
scope: This is a short piece that gives only the main points of something; it is not the paper for a court
  case that sets out what happened and what the law says about it.
examples:
- She read the brief to learn the main points of the plan.
- He wrote a short brief that summed up the long report in two pages.
