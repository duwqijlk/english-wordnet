senseId: 'liberation%1:04:01::'
synsetId: 00217041-n
simpleMeaning: The end of a person's job, when they are free to leave.
scope: The ending of someone's job; release, sack, firing, dismissal and discharge are other names for
  this sense, and it is not the freeing of a prisoner or a country.
examples:
- The letter told of her liberation from the company.
- After his liberation, he looked for new work.
