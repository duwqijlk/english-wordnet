simpleMeaning: a unit of force used outside technical work, equal to the weight of sixteen ounces under
  free-fall acceleration of 32 feet per second per second.
scope: This is a measure of force, not the ordinary weight unit of sixteen ounces, not the apothecary
  weight unit, and not the money unit.
examples:
- The rope was rated to hold five hundred pounds of force.
- A falling brick can strike with hundreds of pounds of force.
