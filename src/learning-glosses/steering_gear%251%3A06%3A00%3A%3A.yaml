simpleMeaning: The wheel a driver holds is joined by this to the rods and joints that turn a motor vehicle,
  so the vehicle follows the wheel.
scope: The driver's wheel and the turning parts meet through this link.
examples:
- The driver turned the wheel, and the steering gear turned the vehicle with it.
- Without the steering gear, the wheel would not steer the vehicle.
