simpleMeaning: A creeping European sweet-smelling mint-family plant with round leaves and small purplish
  flowers, often grown in hanging baskets, now wild in North America, and sometimes classed in its own
  genus.
scope: A creeping mint-family plant with round leaves and small purplish flowers; also called alehoof,
  field balm, gill-over-the-ground, ground ivy, runaway robin, Glechoma hederacea, Glechoma hederaceae,
  and Nepeta hederaceae.
examples:
- Nepeta hederacea creeps across the damp bank.
- Nepeta hederacea hangs in baskets on the porch.
