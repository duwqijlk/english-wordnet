simpleMeaning: A plant of west North America with woody root-stems and tufts of stiff grass-like base
  leaves and spikes of creamy white blooms.
scope: This sense is also called squaw grass, a plant of west North America with woody root-stems and
  tufts of stiff grass-like base leaves and spikes of creamy white blooms, unlike the sense for a stemless
  plant with tufts of grasslike leaves and an erect panicle of minute creamy white flowers, from the southwestern
  United States and Mexico, unlike the sense for a yucca of west central United States having a clump
  of basal grasslike leaves and a central stalk with a terminal raceme of small whitish flowers, and unlike
  the sense for a yucca of southern United States having a clump of basal grasslike leaves and a central
  stalk with a terminal raceme of small whitish flowers.
examples:
- Bear grass grows in west North America.
- The bear grass bears creamy white blooms.
