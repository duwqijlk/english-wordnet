simpleMeaning: a fancy edge of short hanging threads at each end of a carpet from the East
scope: This is a fancy edge of short hanging threads at each end of a carpet from the East, also called
  selvedge; not the side edge of cloth and not a plain hem.
examples:
- The selvage at each end of the carpet was made of short silk threads.
- She chose the rug for its fine selvage.
