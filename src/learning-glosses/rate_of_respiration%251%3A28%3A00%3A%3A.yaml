simpleMeaning: How fast a person breathes in and out; it is often counted to get a quick check on a person's
  health
scope: How fast a person breathes in and out, also called the respiratory rate; not the depth of a breath
  and not the pulse.
examples:
- The nurse noted his rate of respiration after the run.
- Her rate of respiration rose as she climbed the stairs.
