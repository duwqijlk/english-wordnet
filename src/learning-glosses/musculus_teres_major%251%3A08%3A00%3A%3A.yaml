simpleMeaning: A muscle that moves the arm and turns it toward the middle of the body.
scope: A muscle that moves the arm and turns it inward; not the smaller muscle that turns the arm outward,
  and not a shoulder muscle that lifts the arm.
examples:
- The musculus teres major pulled the arm down and in.
- He strained the musculus teres major in the gym.
