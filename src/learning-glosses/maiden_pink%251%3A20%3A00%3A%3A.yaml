simpleMeaning: One pale flower with a deep red centre grows on this low plant of Europe and Asia, which
  spreads out in a loose mat.
scope: A low mat-forming plant with one pale flower, not a tall upright plant and not a plant with many
  flowers.
examples:
- The maiden pink spread out in a loose mat.
- Each maiden pink bore a single pale flower with a crimson centre.
