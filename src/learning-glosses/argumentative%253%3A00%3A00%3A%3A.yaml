senseId: 'argumentative%3:00:00::'
synsetId: 00606011-a
simpleMeaning: tending to disagree a lot, and to go on disagreeing with others
scope: This describes a person, or talk or writing, that is full of disagreement. Not the noun for one
  single disagreement, and not a person who is quiet and agrees easily.
examples:
- The argumentative child questioned every rule the teacher gave.
- He became argumentative and would not accept anyone else's view.
