simpleMeaning: A picture made on paper from a piece of film that shows light parts dark and dark parts
  light.
scope: This is a picture made on paper from a piece of film, also called a print; it is not a picture
  drawn by hand, and not the film itself.
examples:
- The photographic print hung on the wall.
- She made a photographic print from the old film.
