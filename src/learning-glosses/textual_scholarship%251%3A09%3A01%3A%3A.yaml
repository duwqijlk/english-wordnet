simpleMeaning: How written works and the papers that hold them are described, copied out, edited and given
  notes is one broad name for several kinds of study.
scope: This broad name covers several kinds of study of written works and the papers that hold them.
examples:
- Her work in textual scholarship began with copying out an old letter by hand.
- The course in textual scholarship taught him how to add notes to old papers.
