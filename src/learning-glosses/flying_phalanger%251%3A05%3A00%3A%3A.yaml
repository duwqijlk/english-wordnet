simpleMeaning: Night animals that move with long glides, using skin folds like a parachute along the sides
  of the body.
scope: These are night animals that move with long glides on skin folds like a parachute, not birds or
  bats, and they are also called a flying opossum and a flying squirrel.
examples:
- The flying phalanger glided between the trees.
- A flying phalanger rested in the branches at dawn.
