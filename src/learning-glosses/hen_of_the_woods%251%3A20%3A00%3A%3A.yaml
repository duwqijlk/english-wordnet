simpleMeaning: People gather this big grey-brown fungus to eat, a mass of caps that overlap at the foot
  of a tree and look a bit like a farm bird.
scope: Also called hen-of-the-woods, this is a big edible fungus in a mass of caps at the foot of a tree,
  not a small single mushroom.
examples:
- Hen of the woods grows in overlapping caps at the base of trees.
- He fried hen of the woods with garlic.
