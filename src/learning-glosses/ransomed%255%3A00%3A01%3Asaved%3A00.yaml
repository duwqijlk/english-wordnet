simpleMeaning: freed or got back by paying the money that was demanded for letting the person or thing
  go
scope: Set free or got back by such a payment; not just saved from danger in some other way, and not still
  held while the money is being asked for.
examples:
- The ransomed children came home late last night.
- The ransomed ship was given back to its owners.
