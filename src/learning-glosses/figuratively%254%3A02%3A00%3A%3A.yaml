simpleMeaning: using words in a way where the meaning is not the plain, direct one
scope: About words used with a changed meaning, not words used in their plain and direct sense.
examples:
- Figuratively speaking, his heart was broken, though no doctor could find damage.
- When she said she was drowning in work, she meant it figuratively, not in the plain sense.
