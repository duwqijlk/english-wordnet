simpleMeaning: Between two times when she is ready to mate, a female mammal that is not a person shows
  no wish to mate at all.
scope: 'Also called anestrum, anoestrum and anoestrus: the quiet state of a female mammal between two
  heats, not the heat itself and not the act of mating.'
examples:
- Anestrus follows the heat and ends when the next heat begins.
- In anestrus the female shows no wish to mate.
