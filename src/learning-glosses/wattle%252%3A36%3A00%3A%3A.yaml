simpleMeaning: to build something from thin sticks and branches woven together, or with that material
scope: To build with sticks and branches woven together; not the loose skin on a bird's neck, not the
  trees that give the sticks, and not just weaving the sticks together.
examples:
- The workers wattled the walls of the hut, building them from sticks and branches.
- He wattled a shelter for the animals using thin branches woven together.
