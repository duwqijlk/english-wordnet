simpleMeaning: a person who sleeps in the same room or sleeping place as you
scope: A person who shares your sleeping place, not just a person who lives in the same house or works
  with you.
examples:
- My bunkmate in the camp hut snored all night.
- He and his bunkmate took turns using the small lamp.
