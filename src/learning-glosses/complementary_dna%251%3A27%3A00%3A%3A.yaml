simpleMeaning: A single thread of the material that carries a living thing's instructions, matching a
  messenger thread, or made from that thread by a copying enzyme (reverse transcriptase).
scope: Also called cDNA; a single thread of instruction-carrying material that matches a messenger thread
  or is made from that thread by a copying enzyme.
examples:
- The lab made complementary DNA from the messenger RNA sample.
- Complementary DNA matches the messenger RNA it was copied from.
