simpleMeaning: 'It is one of many systems that carry what the body feels: push, tickle, warmth, cold,
  shaking, pain, and where the arms and legs are and how they move.'
scope: It is one of many systems that carry feelings of touch, warmth, cold, and pain.
examples:
- Somatosense lets us feel a tickle on the skin.
- We use somatosense to tell hot from cold.
