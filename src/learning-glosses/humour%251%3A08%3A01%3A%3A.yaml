simpleMeaning: a body liquid, one of four whose balance people in the Middle Ages thought decided how
  you felt and how well you were
scope: 'Also called humor: in old medicine, one of four body liquids, not a sense of what is funny and
  not a mood.'
examples:
- Old doctors blamed the humours when a patient felt low.
- The four humours were said to set both mood and health.
