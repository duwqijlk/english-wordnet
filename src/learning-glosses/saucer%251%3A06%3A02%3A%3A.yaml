simpleMeaning: An aerial that beams radio waves, even very short ones, in one direction, made from a curved
  dish that catches them
scope: An aerial that beams radio waves in one direction, also called a dish, not the small plate under
  a cup and not a throwing disk.
examples:
- The saucer on the roof picks up signals from space.
- Engineers aimed the saucer at the distant station.
