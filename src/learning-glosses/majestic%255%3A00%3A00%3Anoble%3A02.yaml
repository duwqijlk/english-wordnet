simpleMeaning: right for a supreme ruler to have, or belonging to one
scope: 'Also called royal and purple, and another name for it is regal: what is right for a supreme ruler
  to have, or belongs to one; not just showing dignity, and not a thing for ordinary people.'
examples:
- She wore majestic robes for the ceremony.
- The king entered in majestic state.
