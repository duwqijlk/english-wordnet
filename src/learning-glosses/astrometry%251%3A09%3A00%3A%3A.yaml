simpleMeaning: Measuring where bodies in the sky are and how they move is the work of this part of the
  study of the stars.
scope: This part of the study of the stars measures where bodies in the sky are and how they move.
examples:
- In astrometry, the positions of stars are measured and their motion tracked.
- Through astrometry, the motion of planets across the sky is tracked.
