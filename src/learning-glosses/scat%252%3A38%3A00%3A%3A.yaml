simpleMeaning: to run away fast; to turn and run; to leave in a hurry
scope: To run away fast, also called run, escape, bunk, lam and scarper; not the jazz singing sense of
  scat, where a singer uses made-up sounds instead of words.
examples:
- When the dog charged at us, the children scatted across the yard.
- The boys scatted down the street when the police car turned the corner.
