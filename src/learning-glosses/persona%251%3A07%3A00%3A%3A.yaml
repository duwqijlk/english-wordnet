simpleMeaning: In Jungian psychology, the outer face a person shows to the world
scope: In Jungian thought, the face shown to the world, with image as another name for this sense, and
  not the real self or a role in a play.
examples:
- Her public persona was warm and open.
- She kept up a cheerful persona for the cameras.
