simpleMeaning: Holding political views that are neither strongly left-wing nor strongly right-wing.
scope: This is not about the middle of a place or object; it is only about moderate political or intellectual
  views.
examples:
- They formed a new centre party before the election.
- The senator holds centre views on most social questions.
