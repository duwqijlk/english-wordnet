simpleMeaning: Hard spotted green fruit that cannot be eaten grows on this climbing plant of the dry lands
  of central and southwestern United States and Mexico, living year after year.
scope: Also called a buffalo gourd, a prairie gourd, a prairie gourd vine, and a wild pumpkin, this climbing
  plant of the dry lands of central and southwestern United States and Mexico bears small hard spotted
  green fruit that cannot be eaten.
examples:
- A calabazilla climbs over the dry ground.
- No one eats the fruit of the calabazilla.
