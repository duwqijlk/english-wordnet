simpleMeaning: A sleeved outer garment worn outdoors, reaching from the shoulders down over the body.
scope: The sleeved clothing worn outdoors, not an animal's fur covering and not a thin layer spread over
  a surface.
examples:
- She put on her coat and went out into the snow.
- He hung his coat by the door.
