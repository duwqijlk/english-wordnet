simpleMeaning: something shown to people, or the act of showing something so people can see it
scope: This sense, also called demonstration, is about showing something for people to see, not about
  formally giving a prize and not about making news public.
examples:
- The presentation of the new car drew a large crowd.
- Her presentation of the photos helped us see the place clearly.
