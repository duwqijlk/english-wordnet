simpleMeaning: Muslim fighters in a group that fights a holy war in small, surprise attacks.
scope: Also called mujahideen, mujahadeen, mujahadein, mujahedeen, mujahedin and mujahidin; a fighting
  force of Muslim guerrilla fighters waging a jihad, not a regular national army and not a single fighter.
examples:
- The mujahadin fought in the hills.
- Mujahadin units crossed the border at night.
