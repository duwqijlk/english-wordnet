simpleMeaning: In genetics, a change in a living thing or a whole kind of living thing that gives it a
  very different body form
scope: In genetics, a change that gives a living thing or a whole kind of living thing a very different
  body form; not the slow change of normal growth and not the leaping of sand grains in moving water.
examples:
- A saltation in the plant's genes gave it flowers of a new shape.
- The scientist wrote that the change was a saltation, not a slow shift.
