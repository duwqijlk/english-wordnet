simpleMeaning: A long-lived herb with underground stems, large striking shield-shaped leaves and white
  to bright pink flowers in round heads on bare stems, along stream banks in California's Sierra Nevada.
scope: A streamside herb with shield-shaped leaves, also called umbrella plant, Darmera peltata and Peltiphyllum
  peltatum, not the Asian herb of the same name, along stream banks in California's Sierra Nevada.
examples:
- Indian rhubarb grew thick along the stream bank.
- The pink flower heads of Indian rhubarb rose on bare stems.
