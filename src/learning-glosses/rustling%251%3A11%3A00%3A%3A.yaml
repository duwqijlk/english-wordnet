simpleMeaning: The soft, light sound made when silk clothes move, or when leaves move in the wind
scope: 'Also called whisper, whispering and rustle: a soft, light sound from silk clothes or leaves in
  the wind; not a loud noise and not a person speaking words very quietly.'
examples:
- We heard the rustling of leaves in the wind.
- There was a soft rustling of silk as she walked past.
