simpleMeaning: the way a thing sits or points when judged by north, south, east and west, or by other
  set directions
scope: Which way a thing faces, not a set of beliefs and not knowing where you are.
examples:
- The orientation of the house lets the sun in all morning.
- Check the orientation of the map before you start walking.
