simpleMeaning: the seed case of a cypress tree, where the seeds are made
scope: The seed case of a cypress tree, not the leaf or the wood, and not the cone of a pine or a fir.
examples:
- The gardener collected the galbulus from the cypress in the yard.
- Each galbulus held tiny seeds inside its round shell.
