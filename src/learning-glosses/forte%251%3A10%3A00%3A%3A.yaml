simpleMeaning: a piece of music, or a part of it, that is to be played loudly
scope: This is a loud piece or part of music, not the strong part of a sword blade and not the word that
  tells players to play loudly.
examples:
- The next forte shook the hall as the band played as loudly as it could.
- She wrote a short forte for the loud end of the song.
