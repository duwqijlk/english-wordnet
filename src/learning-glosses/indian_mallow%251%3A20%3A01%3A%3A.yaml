simpleMeaning: A tall annual herb or low shrub of tropical Asia with soft leaves and yellow flowers, yielding
  a strong fibre, now wild in southeastern Europe and the United States.
scope: Also called butter-print, velvet-leaf, velvetleaf, velvetweed, Abutilon theophrasti, and China
  jute; a tall Asian herb with yellow flowers, not the American weed of the same name.
examples:
- Indian mallow grew tall by the fence.
- We cut Indian mallow for its fibre.
