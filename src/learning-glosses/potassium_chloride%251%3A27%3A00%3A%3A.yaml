simpleMeaning: A potassium salt with the formula KCl, sold under several brand names and taken as tablets
  to treat low potassium levels.
scope: This compound is also called potash muriate or potassium muriate; it is a potassium salt, not table
  salt, which is sodium chloride, or another salt such as potassium citrate.
examples:
- The hospital gave him potassium chloride tablets to correct his low potassium.
- Potassium chloride is the chemical name for the salt in several potassium supplements.
