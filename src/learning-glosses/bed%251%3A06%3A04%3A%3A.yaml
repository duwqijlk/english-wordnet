simpleMeaning: One layer of a material, usually of the same kind throughout.
scope: Not a sleeping place, not a garden plot, not the ground beneath a river, and not the layer of ore
  or coal that is thick enough to mine.
examples:
- The patio was built on a thick bed of gravel.
- She served the fish on a bed of rice.
