simpleMeaning: To condemn a person or thing as evil, saying that God will punish it.
scope: This spoken curse is also called accurse, execrate, anathematise, anathemise, anathemize, and comminate.
examples:
- The priest threatened to anathematize the man who stole from the church.
- The bishop anathematized the offender before the whole church.
