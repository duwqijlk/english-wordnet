simpleMeaning: one of two raised shapes that stick up above the back wheel covers of a car, put there
  to look good
scope: This is one of a pair of raised shapes above the back of a car; tailfin and fin are other names
  for this sense, not a fish's fin and not a part of a plane.
examples:
- The old car had a tall tail fin on each side.
- A tail fin rose above the back wheel of the car.
