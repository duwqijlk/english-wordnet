senseId: notifiable%5:00:00:reported:00
synsetId: 00473688-s
simpleMeaning: That must be told to the public authorities.
scope: A case or illness that must be told to the authorities; not a thing that is merely worth telling
  people about, and not a secret that must be kept.
examples:
- Measles is a notifiable disease, so doctors must tell the health office about every case.
- The new infection was made notifiable within a week.
