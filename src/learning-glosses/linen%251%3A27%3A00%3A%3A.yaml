simpleMeaning: good paper made from plant threads, or with a surface that looks like cloth made from those
  threads
scope: This is paper, not the cloth made from plant threads and not clothes or home cloth goods made from
  that cloth.
examples:
- She wrote the letter on thick linen paper with a rough surface.
- The wedding card was printed on white linen that felt like cloth.
