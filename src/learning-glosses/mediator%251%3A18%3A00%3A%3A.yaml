senseId: 'mediator%1:18:00::'
synsetId: 09647729-n
simpleMeaning: a person who talks with two sides that do not agree, to help them talk to each other and
  reach an agreement
scope: 'Also called an intermediary: a person who helps two sides that do not agree to talk and reach
  an agreement, not a judge who decides for them.'
examples:
- The two groups asked a mediator to help them talk.
- A mediator helped the workers and the company reach an agreement.
