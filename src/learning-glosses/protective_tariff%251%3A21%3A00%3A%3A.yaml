simpleMeaning: A tax on goods brought in from other countries, meant to keep businesses in this country
  safe from what other countries sell
scope: A tax on goods brought in, not a tax on goods made at home; not a ban on goods from abroad.
examples:
- The government put a protective tariff on imported steel.
- A protective tariff made foreign cars cost more than local ones.
