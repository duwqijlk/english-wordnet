synsetId: 00145758-r
simpleMeaning: in a way that leaves no doubt at all.
scope: This strengthens a whole statement to show there is no doubt; it is not the adjective sense of
  being fixed or sure to happen.
examples:
- I will certainly be there by eight.
- That was certainly the best meal I have had all year.
