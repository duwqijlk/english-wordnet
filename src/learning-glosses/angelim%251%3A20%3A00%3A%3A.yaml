simpleMeaning: any of a few kinds of tree from warm parts of America, in the group called Andira
scope: This is one of a few kinds of tree from warm parts of America; andelmin is another name for it,
  not a tree from cold lands or a single kind of tree.
examples:
- Angelim grows in the warm forests of South America.
- The angelim is one of several trees in the Andira group.
