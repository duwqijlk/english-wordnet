simpleMeaning: A group of tiny viruses whose code for life is held in one thin string, each with a coat
  made of protein, the stuff that builds the body.
scope: This is a group of tiny viruses with one thin string of life code and a protein coat; not one virus
  on its own, and not viruses whose code is held in two strings.
examples:
- The cold was caused by a picornavirus.
- Picornavirus germs have a protein coat.
