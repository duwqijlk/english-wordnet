simpleMeaning: A poisonous plant that lives for years, with harsh milky sap, bell-shaped white or pink
  flowers and a very bitter root; it belongs to the group Apocynum.
scope: This is the poisonous Apocynum plant with milky sap and bell-shaped flowers; it is not milkweed,
  and not the dogwood tree despite the similar name.
examples:
- Dogbane grew thick along the fence, and its milky sap stained the hands of anyone who pulled it.
- Cattle avoid dogbane because the plant is poisonous and its root is very bitter.
