simpleMeaning: In the East Indies grows a yellow fruit that tastes sharp and looks like a berry
scope: A yellow fruit that tastes sharp and looks like a berry, also called lansa, lanseh and lanset;
  not the tree that bears it and not a sweet berry.
examples:
- We picked a lansat from the tree.
- The lansat was too tart for him to eat.
