simpleMeaning: a bushy plant kept in the house, with white to pale pink flowers and then bunches of bright
  red berries, from warm parts of the Americas
scope: Also called a rougeberry, a blood berry, and a bloodberry; a bushy houseplant with pink flowers
  and red berries, not a rose and not a berry bush grown outside.
examples:
- The rouge plant stood on the window sill.
- Her rouge plant bore bright red berries in winter.
