scope: This is one of a group of chemicals in living cells that help pass tiny charged parts between molecules,
  not a vitamin and not a protein.
examples:
- Ubiquinone helps cells pass tiny charged parts from one molecule to another.
- As cells use oxygen to make energy, ubiquinone passes tiny charged parts between molecules.
