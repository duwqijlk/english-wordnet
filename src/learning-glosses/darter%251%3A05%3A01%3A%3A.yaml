simpleMeaning: With a long bendy neck and a thin sharp bill, this bird of warm inland waters eats fish.
scope: Also called anhinga and snakebird; this is the fish-eating bird of warm inland waters, not a bird
  of the sea and not one that eats plants.
examples:
- The darter held its long neck above the water.
- A darter caught a fish in the warm river.
