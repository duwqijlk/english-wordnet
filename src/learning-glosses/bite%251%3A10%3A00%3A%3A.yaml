simpleMeaning: A sharp, cutting quality in humour or witty remarks.
scope: A sharp, cutting quality in remarks, also called pungency, not a physical wound and not the act
  of using teeth.
examples:
- Her remarks had a bite that stung long after the meeting.
- There was real bite in his review of the film.
