simpleMeaning: a single one cooked on its own in cream or butter in a small dish
scope: A single one cooked on its own in cream or butter in a small dish, also called a baked egg and
  an egg en cocotte; not a boiled egg and not a fried egg.
examples:
- She made a shirred egg in a small dish with cream.
- A shirred egg is cooked on its own in butter.
