simpleMeaning: in maths, the angle that goes with a given number, found by undoing the ratio of the side
  next to the angle to the longest side of a right-angled triangle
scope: In maths, the angle that goes with a given number, found by undoing the cosine, also called arc
  cosine, arccos or arccosine; not the cosine itself and not the inverse sine.
examples:
- The inverse cosine of 0.5 is 60 degrees.
- Use the inverse cosine to find the angle.
