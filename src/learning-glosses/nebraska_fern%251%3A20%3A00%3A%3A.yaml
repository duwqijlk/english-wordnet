simpleMeaning: A large branching herb living two years, from Eurasia and Africa, now in North America,
  with large feathery leaves and white flowers, mostly in damp places, all parts most poisonous.
scope: 'Also called hemlock, poison hemlock, poison parsley, winter fern, California fern, and Conium
  maculatum: a large branching herb with feathery leaves and white flowers, every part most poisonous,
  not a true fern and not a parsley for eating.'
examples:
- The Nebraska fern grew tall in the damp hollow.
- Do not touch the Nebraska fern; every part of it is most poisonous.
