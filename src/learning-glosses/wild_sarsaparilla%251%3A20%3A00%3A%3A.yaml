simpleMeaning: A common herb of central and eastern North America comes back year after year, its sweet-smelling
  roots used instead of the roots of the drink plant.
scope: Also called false sarsaparilla and wild sarsparilla, this is the herb of central and eastern North
  America whose sweet-smelling roots take the place of the roots of a root drink.
examples:
- In central North America, wild sarsaparilla comes back year after year.
- Its sweet smell marks wild sarsaparilla roots, used in place of the roots of a root drink.
