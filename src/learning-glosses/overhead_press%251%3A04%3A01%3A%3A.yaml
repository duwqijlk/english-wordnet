simpleMeaning: A strength move, most often done standing, in which a heavy weight is pushed straight up
  from the shoulders until the arms are straight above the head
scope: A strength move done standing, pushing a heavy weight straight up from the shoulders until the
  arms are straight above the head, not a pull-down move and not a lift from the floor.
examples:
- She does an overhead press with a barbell each morning.
- The overhead press pushed the weight straight up from his shoulders.
