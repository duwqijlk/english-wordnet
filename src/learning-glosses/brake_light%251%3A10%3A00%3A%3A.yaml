simpleMeaning: a red lamp at the back of a road vehicle that comes on when the driver slows down or stops
scope: 'Also called stoplight: a red lamp at the back of a road vehicle that comes on when the driver
  slows down or stops, not a front lamp that lights the road and not a lamp that stays on all the time.'
examples:
- The brake light came on as the car slowed down.
- I saw her brake light flash when she stopped at the corner.
