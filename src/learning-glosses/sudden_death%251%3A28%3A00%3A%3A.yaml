simpleMeaning: In sports, extra time that ends the moment one side scores, as in football and golf.
scope: In a game, extra time that stops at the first score, not a person dying without warning and not
  ordinary extra time that runs to the end.
examples:
- With sudden death in force, the first goal won the football match.
- They played sudden death in the golf play-off until one player won a hole.
