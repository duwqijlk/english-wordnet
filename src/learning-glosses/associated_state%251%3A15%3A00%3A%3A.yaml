simpleMeaning: Set up by treaty, this is a land ruled in part by a stronger land, though not owned by
  it, but free to run its own home affairs.
scope: A land partly ruled by a stronger land but free in its own home affairs, also called a protectorate;
  not a land owned outright by another.
examples:
- The island was an associated state, free to run its own home affairs.
- The treaty made the island an associated state of the larger country.
