simpleMeaning: a shade you hold in your hand and can fold up when you stop using it
scope: 'Also called a parasol: a shade you hold in your hand and can fold up, not a fixed cloth cover
  over people or things.'
examples:
- She opened her sunshade and held it over her head in the hot sun.
- He folded his sunshade before he went back inside.
