simpleMeaning: a path for walking between rows of seats, as in a hall or bus or train, or between rows
  of shelves in a shop
scope: 'Also called aisle: a walk path between seats or shelves, not a short-lived path of planks over
  mud and not a bridge for getting on or off a ship.'
examples:
- Please keep the gangway clear in the theatre.
- He pushed the cart along the gangway between the shelves.
