simpleMeaning: A hard green cheese from Switzerland, made from milk with the cream taken off, set thick,
  and given taste with clover.
scope: A hard green Swiss cheese with clover; not cheddar, a hard yellow cheese, and not parmesan, a hard
  cheese for grating.
examples:
- He grated sapsago over the potatoes.
- Sapsago is green and hard, with the taste of clover.
