simpleMeaning: To do with the small part that makes tears, or with the place near it
scope: 'Also called lacrimal: to do with the tear-making part or the place near it, not to do with the
  eye itself and not to do with crying.'
examples:
- The doctor looked at the lachrymal sac in the corner of her eye.
- Tears flow from the lachrymal gland when we cry.
