simpleMeaning: a still, upright posture with arms at the sides and feet together, which service members
  take during drill or a formal inspection.
scope: This is a rigid military stance, not the act of concentrating on something, not the work of caring
  for someone, not a general interest in a subject, not a polite act showing affection, and not the mental
  power of focusing.
examples:
- The sergeant barked, 'Stand at attention!'
- The recruits snapped to attention as the officer approached.
