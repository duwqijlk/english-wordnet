simpleMeaning: A low, wide-spreading evergreen shrub from southern Australia, with leaves that are triangular
  or rather heart-shaped, orange-yellow flowers, and later flat pods with wings.
scope: Another name for the low Australian shrub also called native holly, not the red-flowered coral
  tree or a pea grown for food.
examples:
- Common flat pea grows low to the ground in southern Australia.
- Gardeners plant common flat pea for its orange-yellow flowers and winged pods.
