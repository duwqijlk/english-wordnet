senseId: 'central_sulcus%1:08:00::'
synsetId: 05231116-n
simpleMeaning: A deep groove that runs up the side of each half of the brain, marking off the front part
  from the part just behind it.
scope: Also called sulcus centralis; the groove that runs up the side of the brain between its front and
  back parts, not the long groove along the lower side of the brain.
examples:
- The central sulcus runs up the side of the brain.
- Damage near the central sulcus can affect movement.
