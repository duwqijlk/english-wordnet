senseId: 'algebraic_number%1:23:00::'
synsetId: 13753012-n
simpleMeaning: A value that makes a maths equation true when the equation uses only ratios of whole counts.
scope: A value that solves a maths equation using only ratios of whole counts; not a plain whole count
  and not a value no such equation can give.
examples:
- Two is an algebraic number because it solves a simple equation.
- An algebraic number can be the root of an equation with whole-number parts.
