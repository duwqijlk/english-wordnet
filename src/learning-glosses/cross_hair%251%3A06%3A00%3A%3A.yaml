senseId: 'cross_hair%1:06:00::'
synsetId: 03141424-n
simpleMeaning: One of two thin straight marks at right angles in a sighting tool, used to aim or to set
  the tool right
scope: This is one of a pair of fine marks used for aiming, not a single line and not a mark on a map;
  cross wire is another name for this sense.
examples:
- He had the target in his cross hairs.
- She lined up the cross hair with the centre of the target.
