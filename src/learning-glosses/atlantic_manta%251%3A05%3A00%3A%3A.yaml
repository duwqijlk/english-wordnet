simpleMeaning: The largest ray of its kind, 22 feet across at most, found worldwide but common in the
  Gulf of Mexico and off the southern United States, mostly at sea
scope: This is the largest ray of its kind, common in the Gulf of Mexico, not a smaller ray and not a
  ray of rivers; Manta birostris is another name for this sense.
examples:
- The Atlantic manta glided beneath our boat in the Gulf of Mexico.
- An Atlantic manta can grow 22 feet across its wings.
