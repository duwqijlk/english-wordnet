simpleMeaning: To turn a person's feelings against a thing, so they feel sick at it and judge it wrong.
scope: To fill a person with strong dislike that offends their sense of right; also called disgust, sicken,
  and nauseate, not the act of rising against rulers and not making a revolution.
examples:
- The cruel pictures revolted everyone who saw them.
- Such waste revolted her sense of right and wrong.
