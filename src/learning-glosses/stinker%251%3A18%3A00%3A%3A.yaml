simpleMeaning: a person who other people think is very bad and not worth any respect
scope: This is a person thought to be very bad and low, also called rat, crumb, git, skunk, puke, bum,
  scumbag, lowlife, rotter, and stinkpot; it is not a thing that smells bad and not a badly made thing.
examples:
- Only a stinker would cheat his own friend.
- He was a stinker who lied to everyone who trusted him.
