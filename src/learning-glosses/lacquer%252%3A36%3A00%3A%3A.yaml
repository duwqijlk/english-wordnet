simpleMeaning: To cover a thing with a thin hard shining coat
scope: To put a thin hard shining coat on a thing, not the coat stuff itself and not ordinary paint.
examples:
- He lacquered the wooden box until it shone.
- A lacquered box from China stood on the shelf.
