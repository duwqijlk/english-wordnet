simpleMeaning: a release of electricity into the air around it, which turns the air close to it into charged
  parts
scope: 'Also called corona discharge, corposant, and electric glow: this is a release of electricity in
  the air, not the outer part of the sun, not rings of light around a bright thing, and not the disease.'
examples:
- A faint corona formed around the high-voltage wire.
- Engineers try to stop corona because it wastes power.
