simpleMeaning: A blood tube that drains the roof of the mouth and empties into the blood tube of the face.
scope: A blood tube draining the roof of the mouth; palatine vein is another name for this sense; not
  a blood tube of the tongue and not one of the neck.
examples:
- The vena palatina drains the roof of the mouth.
- The dentist noted the vena palatina during the examination.
