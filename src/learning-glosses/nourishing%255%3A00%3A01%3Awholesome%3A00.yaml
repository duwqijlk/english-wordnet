simpleMeaning: giving the body the food it needs, or being that food, to help a person live and grow well
scope: This is about food that is good for the body; it is not about food that only tastes good or only
  fills you up.
examples:
- The soup is nourishing and helps her get strong again.
- He made a nourishing meal of beans, rice, and greens.
