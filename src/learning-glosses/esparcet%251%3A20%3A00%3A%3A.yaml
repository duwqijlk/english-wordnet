simpleMeaning: A perennial Eurasian herb with pale pink flowers and curved pods, wild in chalky grasslands
  of Britain and North America; an important fodder crop and honey source in Britain.
scope: The pink-flowered fodder and honey plant named here, not an ordinary white or red clover or a garden
  flower.
examples:
- Esparcet covered the chalky slope with pale pink flowers.
- Farmers sow esparcet to make hay for their animals.
