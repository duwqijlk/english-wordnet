senseId: 'nephrogenic_diabetes_insipidus%1:26:00::'
synsetId: 14143080-n
simpleMeaning: A sickness in which too much urine is made because the kidneys do not answer to normal
  amounts of vasopressin, a chemical that tells them how much water to keep.
scope: A sickness in which too much urine is made because the kidneys do not answer to normal amounts
  of vasopressin, not the sugar sickness and not a sickness of the bladder.
examples:
- Nephrogenic diabetes insipidus made him pass far too much urine.
- In nephrogenic diabetes insipidus, the kidneys do not answer to vasopressin.
