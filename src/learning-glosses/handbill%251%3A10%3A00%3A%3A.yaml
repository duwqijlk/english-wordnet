simpleMeaning: made to reach many people, this is a printed note, usually on a page or a small sheet,
  that tells people about something
scope: A printed note made to reach many people, also called a bill, a broadsheet, a broadside, a circular,
  a flier, a flyer and a throwaway, not a newspaper and not a poster on a wall.
examples:
- She gave out a handbill for the school fair.
- The handbill told people about the sale on Saturday.
