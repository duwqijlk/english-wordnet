simpleMeaning: Along the coasts of the United States from New York to Mexico lives a small, shiny fish
  of the drum kind, often taken for a white fish.
scope: This small, shiny fish of the drum kind is also called a mademoiselle.
examples:
- The silver perch lives along the coasts of the United States from New York to Mexico.
- A silver perch is often taken for a white fish.
