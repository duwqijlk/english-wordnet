simpleMeaning: when you make a phone call or send a package and the person who gets it pays for it
scope: This word shows how a call is made or a package is sent, with the other person paying; it is not
  the church prayer and not the act of gathering things.
examples:
- Please call me collect when you reach the hotel.
- She sent the package collect, so I paid when it arrived.
