simpleMeaning: A white blood corpuscle with no small grains inside, in health a fourth of all white blood
  corpuscles but more common when the body fights sickness.
scope: A white blood corpuscle with no small grains inside, in health a fourth of all white blood corpuscles;
  lymphocyte is another name for this sense, not a red blood corpuscle and not a blood platelet.
examples:
- Lymph cells rose in her blood as she fought the infection.
- A lymph cell count helps doctors spot infection.
