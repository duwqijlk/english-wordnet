simpleMeaning: In chemistry, a reaction and the reverse reaction going at the same speed
scope: In chemistry, a reaction and its reverse running at equal speeds, not a sense of balance in the
  ear and not a calm state of mind.
examples:
- At equilibrium, the reaction goes forward and back at the same rate.
- The chemist waited until the mixture reached equilibrium.
