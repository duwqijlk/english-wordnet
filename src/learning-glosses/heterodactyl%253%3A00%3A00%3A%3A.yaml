simpleMeaning: The third and fourth toes point forward, while the first and second toes of a bird's foot
  point back
scope: Of a bird's feet, the first and second toes point back and the third and fourth point forward,
  not feet with all toes forward and not feet with the first and fourth toes back.
examples:
- The bird's heterodactyl foot has its first two toes pointing back.
- Trogons are known for their heterodactyl feet.
