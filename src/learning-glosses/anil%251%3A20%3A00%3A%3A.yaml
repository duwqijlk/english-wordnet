simpleMeaning: A bush of the West Indies and South America from which the blue dye called indigo is got.
scope: A shrub of the West Indies and South America that is a source of indigo dye, not the blue dye itself.
examples:
- Anil grew wild along the roadside in the West Indies.
- Farmers cut anil to make indigo dye.
