simpleMeaning: a hot room or bath from Finland, where water is poured on hot stones to make steam
scope: 'Also called a sweat room: a hot room where steam is made by putting water on hot stones, not a
  normal bath in water and not a dry hot room.'
examples:
- We sat in the sauna until the steam made us sweat.
- He poured water on the hot stones in the sauna.
