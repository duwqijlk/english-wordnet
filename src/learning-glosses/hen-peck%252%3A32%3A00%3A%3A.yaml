simpleMeaning: Complaints about little things keep coming, and the person hearing them cannot get a rest
  from them
scope: To keep after someone with small complaints that never let up, also called nag and peck, not a
  single angry outburst and not a fair complaint about something big.
examples:
- She hen-pecks her husband about the dishes every day.
- He hen-pecked his brother over every little mistake.
