simpleMeaning: A branch of the Tai language group, spoken in central and north-east Vietnam near the China
  border, in places such as Cao Bang and Lang Son, and possibly in Laos.
scope: Also called Tho; not a different Tai language such as Thai or Lao.
examples:
- Tay is spoken in the north-east of Vietnam.
- Many Tay speakers live near the border with China.
