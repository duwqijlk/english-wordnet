simpleMeaning: The first horse, a dead early kind the size of a dog, with four toes, that lived long ago
  in the Eocene age
scope: This is the first horse, a dead early kind the size of a dog, with four toes, that lived long ago
  in the Eocene age; dawn horse is another name for it, not a horse of today and not a large early horse.
examples:
- Eohippus was the first horse, the size of a dog.
- The eohippus had four toes and lived in the Eocene age.
