senseId: 'offer%2:40:09::'
synsetId: 02302703-v
simpleMeaning: to express greetings, sympathy, or good wishes to someone in words
scope: This is putting a greeting or good wish into words, not holding something out for someone to take,
  not handing it over, and not volunteering to do something.
examples:
- He offered his sympathy to the family at the funeral.
- She offered her congratulations to the newlyweds.
