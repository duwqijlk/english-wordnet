simpleMeaning: a unit for measuring length in the metric system (the system of measuring built around
  the metre), equal to one thousandth of a metre
scope: 'Also called millimeter and mm: this is a small unit for measuring length, not a metre, which is
  a much longer unit.'
examples:
- The screw is only five millimetres long.
- She drew a line one millimetre wide.
