simpleMeaning: money or a reward given for doing something such as catching criminals, killing animals
  that hunt other animals, or joining the army, in particular by the government
scope: Money or a reward for acts such as catching criminals; bounty is another name for this sense, not
  a prize given to make people buy things and not a fee.
examples:
- The government offered a premium for every wolf killed.
- He collected the premium for catching the escaped prisoner.
