simpleMeaning: In common law, a written order from a higher court to a lower court, telling it to send
  up the record of a case.
scope: In common law, a higher court's order for a lower court to send up a case record, not an appeal
  and not a summons.
examples:
- The higher court issued a writ of certiorari to review the case.
- Certiorari lets a higher court call for the record of a lower court's case.
