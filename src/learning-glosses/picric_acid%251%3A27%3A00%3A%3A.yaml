simpleMeaning: Used in strong explosives, as a dye, and in work with chemicals, this strong yellow acid
  is poisonous and can blow up with great force.
scope: This yellow acid is poisonous and can blow up with great force, and it is used in strong explosives,
  as a dye, and in work with chemicals.
examples:
- The picric acid was used as a dye.
- The picric acid was used in strong explosives.
