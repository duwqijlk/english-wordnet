simpleMeaning: A fold of skin in the eye that guards it, found in reptiles and birds and some mammals.
scope: A fold of skin in the eye that guards it in reptiles and birds and some mammals, not an eyelid
  and not the clear front of the eye.
examples:
- The bird's nictitating membrane slid across its eye.
- A nictitating membrane guards the eyes of reptiles and birds.
