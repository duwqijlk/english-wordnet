simpleMeaning: a worker who belongs to a group of workers that joins together to help protect pay and
  work conditions
scope: This sense is a worker who belongs to such a group; it is not the head of the group and not a worker
  who stays outside the group.
examples:
- As a unionist, she pays money each month to her trade union.
- He has been a unionist since he started work at the factory.
