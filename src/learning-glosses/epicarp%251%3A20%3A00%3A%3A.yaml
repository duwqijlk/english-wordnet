simpleMeaning: The outer skin of the fruit wall, as the skin of a peach or a grape
scope: This is the outer skin of the fruit wall, as the skin of a peach or a grape; exocarp is another
  name for it, not the flesh of the fruit and not the stone inside.
examples:
- The epicarp is the outer skin of a peach.
- Peel the epicarp from the grape before eating it.
