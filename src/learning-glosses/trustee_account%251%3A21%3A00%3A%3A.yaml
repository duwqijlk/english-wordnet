simpleMeaning: While they live, the owner looks after the money in the bank for someone else, who gets
  what is left when the owner dies.
scope: Also called savings account trust, savings bank trust, and trust account; a bank deposit its owner
  runs for someone else, who gets what is left after the owner dies.
examples:
- The trustee account was opened in her name for her grandson.
- After his death, the trustee account went to the person he had named.
