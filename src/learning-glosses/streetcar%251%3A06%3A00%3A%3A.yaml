simpleMeaning: A vehicle with wheels. It gets its power from electricity and runs on rails.
scope: This is a vehicle that carries people along rails in a street, also called tram and trolley; it
  is not a train that runs between towns and not a bus that runs on roads without rails.
examples:
- The streetcar stopped at the corner to let people get on.
- We rode a streetcar across the city centre.
