simpleMeaning: A thick round shrub of China that stays green all year, with spiny leaves, grown in many
  places for show
scope: A round evergreen shrub of China with spiny leaves; Chinese holly is another name for this sense,
  not a tall tree or a deciduous shrub that loses its leaves.
examples:
- Ilex cornuta formed a dense hedge along the drive.
- The spiny leaves of Ilex cornuta stayed green through winter.
