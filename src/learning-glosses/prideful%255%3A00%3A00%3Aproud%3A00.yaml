senseId: prideful%5:00:00:proud:00
synsetId: 01897176-s
simpleMeaning: having or showing a feeling that you are better than other people, and a low view of those
  you think are not good enough
scope: 'Also called haughty, imperious, disdainful, lordly, swaggering, supercilious, overbearing and
  sniffy: feeling you are better than others, not just feeling glad about something you did well.'
examples:
- He walked in with a prideful look and spoke as if no one else mattered.
- Her prideful tone made the new workers feel small.
