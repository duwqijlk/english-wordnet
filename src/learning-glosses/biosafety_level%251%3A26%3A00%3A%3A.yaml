simpleMeaning: How safe a place is from germs that can spread sickness, which rests on how work is done
  and on the gear and rooms used.
scope: How safe a place is from germs that can spread sickness, resting on work ways and gear; not a sickness
  itself and not a drug.
examples:
- The biosafety level of the lab was checked each year.
- A high biosafety level keeps workers safe from germs.
