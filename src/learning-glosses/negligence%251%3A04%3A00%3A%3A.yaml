simpleMeaning: not acting with the care that a careful person would show in the same situation
scope: 'Also called neglect and carelessness: not showing the care a careful person would show, not a
  lasting way of not caring about your duties.'
examples:
- The driver's negligence caused the crash.
- The court found negligence in the way the stairs were left unsafe.
