senseId: 'dependent_clause%1:10:00::'
synsetId: 06325801-n
simpleMeaning: As a noun, an adjective or an adverb, a group of words in a long sentence cannot stand
  alone as a full sentence
scope: It is also called a subordinate clause, a group of words that cannot stand alone as a full sentence.
examples:
- The dependent clause 'when she arrived' cannot stand alone.
- In the sentence, the dependent clause works as a noun.
