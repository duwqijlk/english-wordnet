simpleMeaning: a fruit, most of all a peach, whose flesh sticks fast to the stone
scope: A fruit, most of all a peach, whose flesh sticks fast to the stone; cling is another name for this
  sense, not a fruit whose flesh comes away from the stone and not a fruit with no stone.
examples:
- This clingstone peach is hard to eat without a knife.
- Clingstones are best for canning because the flesh holds to the stone.
