simpleMeaning: a group of people who share the same religion and go to the same church again and again
scope: This group, also called fold and congregation, is the people of one church; it is not the word
  for being loyal and true to a person or cause.
examples:
- On Sunday, the faithful filled the small church.
- The priest spoke to the faithful after the service.
