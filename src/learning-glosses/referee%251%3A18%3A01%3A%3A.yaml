simpleMeaning: a person who reads new writings for a publisher and judges whether they are good enough
  to print
scope: A person who reads new writings and judges them for a publisher; reader is another name for this
  sense, not a judge in a sports game and not someone who checks a colleague's work.
examples:
- The referee praised the novel and urged the publisher to print it.
- She works as a referee for a publishing house.
