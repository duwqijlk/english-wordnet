simpleMeaning: A grass-like plant of Europe with small underground stems that can be eaten like nuts
scope: A grass-like plant of Europe with small underground stems that can be eaten like nuts; earth almond
  and ground almond are other names for this sense, not other grass-like plants of wet ground and not
  the nut of a tree.
examples:
- Farmers grow chufa for its small nutlike tubers.
- Chufa is eaten like a nut in parts of Europe.
