simpleMeaning: Blood leaves the organ above the kidney through this one tube, joining the great belly
  tube on the right and the kidney tube on the left.
scope: 'Also called the central vein of suprarenal gland: blood leaves the organ above the kidney through
  this one tube, joining the great belly tube on the right and the kidney tube on the left.'
examples:
- The vena centralis glandulae suprarenalis drains blood from the gland above the kidney.
- On the right, the vena centralis glandulae suprarenalis empties into the large vein of the belly.
