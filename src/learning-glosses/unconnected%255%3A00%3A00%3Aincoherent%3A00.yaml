senseId: unconnected%5:00:00:incoherent:00
synsetId: 00467212-s
simpleMeaning: with no clear order, where one part does not follow well from the part before it
scope: Also called confused, scattered, disconnected, illogical, disjointed, garbled and disordered. This
  is about parts not following in a clear order, not about things being not joined in a physical way.
examples:
- His talk was unconnected, jumping from one idea to another with no clear order.
- She wrote a long, unconnected set of notes that were hard to follow.
