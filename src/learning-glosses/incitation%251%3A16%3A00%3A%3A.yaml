schema: oewn-learning-gloss-v2
senseId: 'incitation%1:16:00::'
synsetId: 09207872-n
simpleMeaning: a means that wakes people up and gets them going, or a thing that pushes them to act
scope: A thing or a means that stirs people to act; incitement and provocation are other names for this
  sense, not the act of urging itself and not a calm plea.
examples:
- The poster was an incitation to join the march.
- His speech served as an incitation to protest.
