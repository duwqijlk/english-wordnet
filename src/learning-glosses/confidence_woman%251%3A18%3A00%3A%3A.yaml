simpleMeaning: a female person who wins the trust of someone and then tricks them out of money
scope: This is a female swindler who first wins a person's trust and then tricks them out of money; con
  woman is another name for this sense, and it is not a confidence man or a plain thief.
examples:
- The confidence woman gained the couple's trust and then emptied their bank account.
- A confidence woman talked her way into the house by pretending to be a nurse.
