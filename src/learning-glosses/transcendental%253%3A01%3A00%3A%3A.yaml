simpleMeaning: Of, or like, a way of thinking that puts feeling and the spirit above what can be seen
  and touched
scope: Of a way of thinking that puts feeling and the spirit above what can be seen and touched, not of
  a way of thinking based only on facts.
examples:
- She wrote about transcendental thought that puts feeling and the spirit above what can be seen and touched.
- The transcendental thinkers valued the spirit above matter.
