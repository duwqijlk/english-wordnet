simpleMeaning: A floating long-lived meat-eating plant from central and southern Europe, Africa, Asia
  and Australia, with rings of 6-9 leaves ending in flaps that shut on prey like water fleas.
scope: Also called waterwheel plant; a floating plant that eats small animals, not a plant that grows
  in soil and not a fish.
examples:
- Aldrovanda vesiculosa floats on the surface of the pond.
- The flaps of Aldrovanda vesiculosa snap shut on tiny prey.
