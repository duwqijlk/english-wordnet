simpleMeaning: a long, narrow part of the sea that goes into the land between steep cliffs, and common
  in Norway
scope: 'Also called fjord: a long, thin part of the sea between steep cliffs, not an open bay and not
  a wide part of the sea along the coast.'
examples:
- The boat sailed slowly along the fiord, with steep cliffs on both sides.
- We visited a fiord in Norway where the sea ran deep between the cliffs.
