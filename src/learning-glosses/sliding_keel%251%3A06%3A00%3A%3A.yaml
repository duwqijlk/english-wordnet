simpleMeaning: A fin under a sailing boat that can be pulled up or let down to stop the boat drifting
  sideways downwind
scope: A fin under a sailing boat that can be pulled up or let down to stop the boat drifting sideways
  downwind, also called centerboard, centreboard or drop keel; not a fixed fin and not a rudder.
examples:
- He raised the sliding keel as the boat entered shallow water.
- The sliding keel kept the boat from drifting sideways in the wind.
