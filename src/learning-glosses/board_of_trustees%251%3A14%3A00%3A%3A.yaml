simpleMeaning: A group picked by vote or by choice to set the rules for a school, college or university
scope: A group that sets the rules for a school, college or university; not the teachers who teach there
  and not a board that runs a business firm.
examples:
- The board of trustees voted to raise fees.
- He chairs the board of trustees of his old college.
