simpleMeaning: A place built by a flying creature where it lays eggs and hatches its young.
scope: A place built by a flying creature for its eggs and young; bird nest and birdnest are other names
  for this sense, not a hole in the ground and not a cage.
examples:
- A bird's nest sat in the fork of the oak tree.
- The bird's nest held three blue eggs.
