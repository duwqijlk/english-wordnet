simpleMeaning: used for an amount that has no one set value, as in an equation that cannot be solved
scope: For an amount or value in maths with no fixed value, as in an equation that cannot be solved; not
  the wider sense of a thing not clearly fixed or known before.
examples:
- In maths, 0/0 is called an indeterminate form.
- The value is indeterminate, so the equation cannot be solved.
