simpleMeaning: a curve made by a point inside a wheel as the wheel rolls along a flat line
scope: It is a curve drawn by a point inside a rolling wheel, not the curve made by a point on the edge
  of the wheel and not a plain circle.
examples:
- The curtate cycloid in the book was drawn by a point inside the rolling wheel.
- The curtate cycloid traced a smooth wavy path as the wheel rolled on.
