simpleMeaning: a big tree of south-east Asia whose nuts give oil for coating wood; the nut kernels, threaded
  on a string, are used near home as candles
scope: 'Also called candlenut: a big south-east Asian tree whose nuts give oil and candles, not the small
  Asian tree whose juice gives lacquer.'
examples:
- The varnish tree grows tall in the warm lands of south-east Asia.
- Kernels from the varnish tree, strung together, burn like candles.
