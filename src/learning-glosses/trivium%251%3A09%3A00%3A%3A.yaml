simpleMeaning: in the Middle Ages, the first course of study at a university, in grammar, logic, and the
  art of speaking well, seen as three roads to fine speech
scope: The first medieval university course of grammar, logic, and rhetoric, not the later course of four
  subjects and not a single subject on its own.
examples:
- Students began with the trivium before they moved on to the fourfold course.
- The trivium taught grammar, logic, and rhetoric to young scholars.
