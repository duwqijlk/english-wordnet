simpleMeaning: a cold box run by power, in which food is kept frozen and stored for a long time
scope: Also called Deepfreeze; a cold box run by power in which food is kept frozen for a long time, not
  an ordinary fridge.
examples:
- She put the extra bread in the freezer for the winter.
- The freezer hummed in the corner of the kitchen.
