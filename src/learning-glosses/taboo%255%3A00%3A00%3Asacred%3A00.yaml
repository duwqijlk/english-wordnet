schema: oewn-learning-gloss-v2
senseId: taboo%5:00:00:sacred:00
synsetId: 02064165-s
simpleMeaning: not allowed to be used in a way that shows no respect for holy things, especially in the
  islands of the South Pacific
scope: This describes a thing that must not be used in a way that shows no respect, because it is holy,
  especially in the South Pacific islands; it is not the ban or custom itself, and not the act of declaring
  a thing holy and forbidden.
examples:
- The carving was taboo, so no one was allowed to touch it for ordinary use.
- On the island, the holy ground was taboo and visitors had to stay away.
