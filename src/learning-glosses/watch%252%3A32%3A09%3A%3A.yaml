simpleMeaning: find out, learn, or become certain about something, usually by asking questions or checking
scope: Not about staying alert to danger, and not about looking after a child or pet.
examples:
- Watch the dial until you are sure the tank is full.
- The vet watched the puppy's breathing to learn whether the medicine had worked.
