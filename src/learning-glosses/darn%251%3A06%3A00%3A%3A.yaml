simpleMeaning: a worn or torn hole that is closed up with stitches, most often in a piece of clothing
scope: 'Also called a patch, and another name for it is a mend: the sewing that fixes a hole, not the
  act of sewing in general.'
examples:
- Her stockings had several darns in them.
- She put a darn in the elbow of his old sweater.
