senseId: 'biohazard%1:26:00::'
synsetId: 14566043-n
simpleMeaning: a danger to people or to nature that comes from living things or poisons they make, or
  from conditions to do with living things
scope: This is the danger or harm itself, not the bacterium, virus, or poison that could be used as a
  weapon in war.
examples:
- Dirty water from the lab is a biohazard for the river and for people nearby.
- Workers wear gloves because waste from sick animals is a biohazard.
