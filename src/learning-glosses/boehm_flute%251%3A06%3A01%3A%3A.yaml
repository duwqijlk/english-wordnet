simpleMeaning: A side-blown wind instrument of the West, played in concerts, made of metal or wood.
scope: Also called transverse flute, C flute, and Western concert flute; a side-blown wind instrument
  of the West made of metal or wood, distinct from end-blown wind instruments and from reed instruments.
examples:
- She played the Boehm flute in the concert.
- The Boehm flute is made of metal or wood.
