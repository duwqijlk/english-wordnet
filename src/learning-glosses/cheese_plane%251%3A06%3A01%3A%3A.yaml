simpleMeaning: Thin, even slices of firm and hard kinds of the food made from milk come from a tool like
  a knife.
scope: This tool is also called a cheese slicer.
examples:
- She used the cheese plane to cut thin slices of firm cheese.
- The cheese plane made thin, even slices from the hard kind.
