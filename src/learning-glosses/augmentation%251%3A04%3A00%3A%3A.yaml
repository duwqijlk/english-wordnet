simpleMeaning: the act of making something bigger or greater in size or amount
scope: This is the act of making something grow in size or amount. It is not the extra part that is added,
  and it is not making something smaller.
examples:
- The augmentation of the budget helped the school buy more books.
- He asked for an augmentation of his pay.
