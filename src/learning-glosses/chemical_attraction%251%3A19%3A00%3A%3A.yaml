simpleMeaning: the pull that draws the smallest parts of matter to each other and holds them together
  in one small group
scope: 'Also called affinity: the pull that holds parts of matter together, not a pull between people
  and not a magnet''s pull.'
examples:
- Chemical attraction holds the atoms together in the water molecule.
- Dyes show chemical attraction when they stick to wool and silk.
