simpleMeaning: A plant of eastern North America with a bunch of small white flowers at the top and roots
  used as medicine.
scope: This eastern North American plant is known for its white flowers at the top and its roots used
  as medicine; senega root, senega snakeroot, senga root, Polygala senega and Seneca snakeroot are other
  names for this sense.
examples:
- Seneka snakeroot was gathered for its medicinal roots.
- A patch of Seneka snakeroot flowered white at the wood's edge.
