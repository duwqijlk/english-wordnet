simpleMeaning: a water bird with a long neck and swimming feet, typically living in groups and moving
  with the seasons; usually larger than a duck, but spends less time in water
scope: This is the living bird; not the meat of the bird used as food.
examples:
- A goose flew low over the lake with the others in its group.
- The goose stretched its long neck and walked toward the water.
