simpleMeaning: a small thin fish, up to 8 inches long, covered with hard bony plates; it lives mostly
  in the deeper waters of the northern Pacific
scope: Also called sea poacher and sea poker, this is the small fish, not a cooking pan and not a person
  who hunts or fishes without the right to do so.
examples:
- The poacher swam in deep northern Pacific water.
- This poacher has hard plates over its body.
