senseId: 'nonabsorbent%3:00:00::'
synsetId: 00007832-a
simpleMeaning: Liquid stays on the top of this, and none of it soaks in
scope: A thing that lets no liquid soak in, also called nonabsorptive, not a thing that soaks liquid up
  and not a thing that lets liquid pass through.
examples:
- The nonabsorbent tray kept the water on its surface.
- Wax paper is nonabsorbent, so the juice just sat on top.
