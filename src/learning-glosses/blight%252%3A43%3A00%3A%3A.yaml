simpleMeaning: to bring harm on something that spoils it and makes it fail to do well
scope: To bring a spoiling harm to a thing, not the state of being harmed and not a disease itself.
examples:
- Too much rain may blight the garden with mold.
- Frost can blight the young fruit trees in spring.
