simpleMeaning: In chemistry, the cleaning of a substance by heating it until it turns to vapour and then
  cooling it back to liquid.
scope: In chemistry, the cleaning of a substance by turning it to vapour and back to liquid; not finding
  the length of a curve, and not putting a mistake right.
examples:
- Rectification of the crude oil gave a much purer liquid.
- The chemist used rectification to clean the spirit.
