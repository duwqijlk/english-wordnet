simpleMeaning: showing a cut in size or amount, or making something smaller or less
scope: This sense means smaller or less, or making something smaller, not making it bigger and not just
  explaining a hard idea in a too simple way.
examples:
- Their reductive plan cut the budget to a much smaller amount.
- The reductive effect of the new rules left the team with fewer staff.
