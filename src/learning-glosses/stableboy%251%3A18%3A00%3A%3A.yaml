simpleMeaning: the horses in a stable are in this man's care; he is paid to tend them
scope: A man whose job is to look after horses in a stable, not a rider and not the owner of the stable.
examples:
- The stableboy fed the horses before dawn.
- A young stableboy led the mare out to the yard.
