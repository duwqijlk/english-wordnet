simpleMeaning: The way a cell splits so that its centre divides into centres, each with the same number
  of gene-carrying threads
scope: The way a cell splits so that its centre divides into centres, each with the same number of gene-carrying
  threads; not the splitting that makes sex cells with half the number.
examples:
- During mitosis the cell's centre divides into matching centres.
- Mitosis keeps the number of gene threads the same in each new cell.
