simpleMeaning: in the form of a shape with four equal sides and right angles.
scope: This is not the adjective describing a thing's shape and not the verb of shaping something; it
  describes the way an action is done so that the result is square.
examples:
- Cut the paper square and fold it in half.
- The tiles were laid square along the edge of the floor.
