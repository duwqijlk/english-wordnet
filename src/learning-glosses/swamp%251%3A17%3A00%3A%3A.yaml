simpleMeaning: low land that is covered with water for part of the year, with more trees and bushes than
  a marsh and water that drains better than in a bog
scope: Low wet land with trees and bushes, not a marsh or a bog, and not the verb sense of covering with
  water or the sense of a very hard situation.
examples:
- Tall trees grow in the swamp where the ground stays wet for months.
- The road ends at a swamp full of bushes and still water.
