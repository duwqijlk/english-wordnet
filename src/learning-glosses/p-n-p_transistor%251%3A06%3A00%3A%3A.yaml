simpleMeaning: 'A transistor made of three semiconductor layers: an n-type layer in the middle, between
  two p-type layers, one acting as the emitter and the other as the collector.'
scope: The p-n-p kind of junction transistor, as opposed to the n-p-n kind, which has the layers in the
  reverse order.
examples:
- A p-n-p transistor has an n-type layer between two p-type layers.
- In a p-n-p transistor, one p-type layer acts as the emitter and the other as the collector.
