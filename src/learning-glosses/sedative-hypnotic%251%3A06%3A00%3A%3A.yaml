simpleMeaning: A calming drug that slows the brain and nerve centre, eases worry and brings sleep
scope: A calming drug that slows the brain and nerve centre, eases worry and brings sleep, also called
  sedative-hypnotic drug; not a plain painkiller and not a drug that wakes a person up.
examples:
- The doctor gave her a sedative-hypnotic to help her sleep.
- A sedative-hypnotic slows the nervous system.
