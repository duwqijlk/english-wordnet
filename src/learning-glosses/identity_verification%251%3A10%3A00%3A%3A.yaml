simpleMeaning: Finding out who a living person is by machine, from the shape of the body and the way the
  person acts.
scope: Finding out who a living person is by machine, from the body and the way the person acts; biometric
  authentication and biometric identification are other names for it, not asking for a password and not
  a paper identity card.
examples:
- The bank used identity verification to check who she was before opening the account.
- Identity verification by fingerprint took only a few seconds at the gate.
