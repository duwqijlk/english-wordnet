simpleMeaning: to leave a dirty mark on something with a dirty thing, such as soot, the black powder made
  by smoke
scope: This sense is about making a dirty mark with a thing like soot, not about harming farm plants and
  not about rude words or pictures.
examples:
- The smoke smutted the white wall above the fire.
- His dirty hands smutted the clean shirt.
