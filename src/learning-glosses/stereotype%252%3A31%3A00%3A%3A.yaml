simpleMeaning: to judge a person or a group by a fixed, simple idea about what people like them are
scope: To judge people by a fixed, simple idea about their kind, not the fixed idea itself and not judging
  on real facts.
examples:
- I was stereotyped as a lazy Southern European.
- The film stereotyped all farmers as slow and simple.
