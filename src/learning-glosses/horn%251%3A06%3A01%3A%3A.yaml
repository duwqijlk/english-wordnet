simpleMeaning: a musical instrument made of brass, with a bright, clear sound; it has a thin tube, a wide
  open end, and parts the player presses to change the sound
scope: 'Also called trumpet: a brass musical instrument with a thin tube and a wide open end; not the
  other horn whose tube is curled round in a ring, not a horn on an animal''s head, and not a car horn.'
examples:
- He pressed the horn's valves, and a bright, clear note rang out.
- The horn rang out bright and clear above the other instruments.
