simpleMeaning: a light thing you hold in your hand that opens out into a wide cover and folds up when
  not in use
scope: The light folding cover you hold in your hand; not the group of army planes in the air and not
  a word meaning covering many things at once.
examples:
- She opened her umbrella when the rain started.
- He carried a small umbrella in his bag.
