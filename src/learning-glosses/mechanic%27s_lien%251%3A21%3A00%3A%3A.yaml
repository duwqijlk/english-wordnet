simpleMeaning: A claim on a building or other thing that has been built or fixed, so the worker gets paid
  for the work and the goods used
scope: A claim on a building that makes sure the builder is paid for work and goods used, not a claim
  for any other debt and not a mortgage.
examples:
- The mechanic's lien on the new house made sure the builder was paid.
- After the repairs, the worker put a mechanic's lien on the shop.
