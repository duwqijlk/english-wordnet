simpleMeaning: A swelling of the brain coverings in which body cells crowd into the coverings
scope: A swelling of the brain coverings in which body cells crowd into the coverings; not a swelling
  of the brain itself and not other sicknesses of the brain coverings.
examples:
- Choriomeningitis swells the coverings of the brain.
- The patient with choriomeningitis needed rest in a dark room.
