simpleMeaning: the base part of a plant's seed case, across from the tiny opening, where the skin and
  the inner part join
scope: The base part of a plant's seed case, across from the tiny opening, where the skin and the inner
  part join, not the bands that hold an egg yolk in place and not the seed itself.
examples:
- The chalaza sits at the base of the plant's seed case.
- At the chalaza, the skin and the inner part of the seed case join.
