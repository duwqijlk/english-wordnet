simpleMeaning: the bone that joins the shoulder blade to the breastbone
scope: This bone, also called collarbone, joins the shoulder blade to the breastbone, not the shoulder
  blade itself and not the breastbone itself.
examples:
- She broke her clavicle in the fall from her bike.
- The clavicle joins the shoulder blade to the front of the body.
