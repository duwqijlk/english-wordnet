simpleMeaning: A thick rope that holds a boat in place, running from a floating marker to an anchor.
scope: A thick rope that holds a boat in place, running from a floating marker to an anchor, not a rope
  that ties a boat to a dock and not a chain that lifts an anchor.
examples:
- The ground cable held the ship fast in the harbour.
- Divers checked the ground cable running down to the anchor.
