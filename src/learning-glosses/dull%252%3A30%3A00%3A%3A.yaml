simpleMeaning: become less bright to look at; lose its shine or brightness
scope: This verb is about a thing losing its shine to look at, not about a sound that is not clear, not
  about making a sound softer, and not about a person who is slow to learn.
examples:
- The silver dulled after years without cleaning.
- The bright paint dulled in the strong sun.
