simpleMeaning: a large flicker of eastern North America with a red neck and a bright gold underside to
  its wings and tail
scope: A large flicker of eastern North America, also called yellow-shafted flicker; not a small woodpecker
  and not a meadowlark.
examples:
- A yellowhammer sang from the top of the tree.
- The yellowhammer has a red neck and gold under its wings.
