simpleMeaning: a serious illness of the mind that starts all at once and lasts only a short time, a few
  weeks or months
scope: 'Also called an acute schizophrenic episode: a mind illness that starts all at once and lasts only
  weeks or months, not a slow illness that lasts for years.'
examples:
- Her reactive schizophrenia began all at once and was gone within two months.
- The doctor said his reactive schizophrenia would last only a few weeks.
