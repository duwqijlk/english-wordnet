simpleMeaning: enough money to live easily without hardship or worry about expenses
scope: 'Another name for the noun ease: material ease from having enough money, not the soothing of distress,
  the relaxed feeling of the body, or the satisfaction a person or thing gives.'
examples:
- A steady salary let them live in comfort at last.
- They retired in comfort, with a paid-off house and no debts.
