simpleMeaning: one of two small round parts on the lower side of the brain, where the front curves of
  a band of fibres in the brain end
scope: One of a pair of small round parts under the brain; corpus mamillare and mamillary body are other
  names for this sense, not the brain stem and not the pituitary gland.
examples:
- The scan showed a small mammillary body under the brain.
- Each mammillary body sits at the end of a curve of the fornix.
