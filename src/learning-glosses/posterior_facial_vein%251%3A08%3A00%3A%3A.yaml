simpleMeaning: Small blood tubes from the sides of the head join in front of the ear into one tube that
  runs at the back of the face.
scope: This is the back branch of the blood tubes of the face, also called the retromandibular vein or
  vena retromandibularis.
examples:
- The posterior facial vein forms where small tubes meet in front of the ear.
- Blood from the face drains through the posterior facial vein.
