senseId: 'dispatcher%1:18:01::'
synsetId: 10037147-n
simpleMeaning: a worker in a company that carries people or goods who decides when vehicles leave by looking
  at the weather, so that the service works well
scope: This is the transport company worker who controls when vehicles leave, not the vehicles themselves
  and not the people they carry.
examples:
- The dispatcher delayed the buses because of the snow.
- The dispatcher told the drivers that the trains would leave late because of the storm.
