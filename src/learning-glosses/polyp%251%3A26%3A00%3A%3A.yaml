simpleMeaning: a small lump that grows on the surface of the wet inner skin inside the body and has blood
  vessels (thin tubes that carry blood) in it
scope: This is a small lump that grows inside a person's body, not a small sea animal that stays in one
  place with a hollow body.
examples:
- The doctor found a polyp in her nose and took it out.
- A small polyp in the bowel can grow slowly over many years.
