simpleMeaning: to put a fault into something or to make something less than perfect
scope: This is the act of making something less than perfect, not a fault in a plan or law paper, and
  not a weak part of a person's character.
examples:
- One small error flawed the whole report.
- Do not let one mistake flaw your good work.
