simpleMeaning: To turn into hard lumps that will not burn, when the heat is too great.
scope: To turn into hard lumps that will not burn under too much heat; not the hard lump itself, and not
  clearing such lumps out.
examples:
- The coal began to clinker in the fierce heat of the furnace.
- If the fire burns too hot, the ash will clinker together.
