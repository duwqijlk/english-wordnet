simpleMeaning: Kashmir's eastern Himalayas are home to this one-season herb, which bears purple flowers
  and a fragrant root whose volatile oil is used in perfume and to preserve furs.
scope: A Himalayan herb whose root oil perfumes and preserves furs; not orris root, a different perfumery
  root.
examples:
- Perfumers once prized costusroot for the sweet oil in its root.
- Stored furs were protected with oil pressed from costusroot.
