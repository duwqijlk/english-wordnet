simpleMeaning: The back part of the brain that takes in nerve threads from a small side part of the brain
  and is the first place where sight is received.
scope: 'Also called the first visual area, the striate area, the striate cortex, and Brodmann''s area
  17: the back part of the brain where sight is first received, not the part that moves the eyes and not
  the part that stores what is seen.'
examples:
- Damage to area 17 of Brodmann can take away sight in part of what a person sees.
- Signals from the eyes first reach area 17 of Brodmann at the back of the head.
