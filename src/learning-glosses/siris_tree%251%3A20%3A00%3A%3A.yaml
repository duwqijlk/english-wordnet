simpleMeaning: long seed pods that rattle in the wind hang from a large wide Old World tree with big leaves
  and round bunches of greenish-yellow flowers
scope: It is also called siris, a large wide Old World tree with big leaves and round bunches of greenish-yellow
  flowers.
examples:
- Long seed pods rattled in the wind on the siris tree.
- The siris tree had big leaves and round bunches of greenish-yellow flowers.
