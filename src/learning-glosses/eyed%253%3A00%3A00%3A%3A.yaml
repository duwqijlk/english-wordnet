synsetId: 00956522-a
simpleMeaning: having one or more of the round parts in the head used for seeing, or a mark like one,
  especially as named, and often used joined to another word
scope: This describes having eyes or marks like eyes, as in red-eyed; it is not the act of looking at
  a person or thing.
examples:
- After a night with no sleep, he was red-eyed and tired.
- The bird's eyed feathers have round marks like eyes.
