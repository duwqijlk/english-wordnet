simpleMeaning: Usually bushy, this is one of many kinds of plant whose fruit people eat young, before
  its skin or seeds turn hard.
scope: Summer squash is another name for this usually bushy plant, whose fruit is eaten young before its
  skin or seeds turn hard.
examples:
- The summer squash vine bore fruit that we ate while it was young.
- We picked young fruit from the summer squash vine.
