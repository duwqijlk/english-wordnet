simpleMeaning: feeling warm, calm, and a little light-headed after a drink or a drug, above all marijuana
scope: This is a pleasant, slightly drunk feeling, also called high, not a mellow taste and not the act
  of becoming relaxed.
examples:
- After one glass of wine he felt pleasantly mellow.
- She sat back, mellow from the smoke, and smiled.
