simpleMeaning: Its soft feathers under its wings edge clothes, and this black-and-white bird of Africa
  feeds on dead flesh.
scope: 'People also call it a marabou or a marabout: it is the black-and-white bird of Africa that feeds
  on dead flesh.'
examples:
- A marabou stork fed on dead flesh.
- They gathered the soft feathers of the marabou stork to edge a coat.
