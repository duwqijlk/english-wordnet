simpleMeaning: a lawyer or barrister with no people who have asked them to act for them
scope: A lawyer or barrister with no clients, not a lawyer with too much work and not a person who has
  no job at all.
examples:
- After a year with no work, the young barrister feared he would stay briefless.
- The briefless lawyer spent the day in chambers hoping for a case.
