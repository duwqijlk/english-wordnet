senseId: 'tropical_sprue%1:26:00::'
synsetId: 14424383-n
simpleMeaning: a lasting illness that strikes people in hot regions and elsewhere, in childhood and adulthood;
  the body fails to absorb nutrients, causing wasting and smelly diarrhea.
scope: Another name for psilosis and sprue; despite the name, the illness also occurs in non-tropical
  regions, and it is not hair loss.
examples:
- Tropical sprue responds well to antibiotics and vitamin supplements.
- He developed tropical sprue while working overseas and lost a lot of weight.
