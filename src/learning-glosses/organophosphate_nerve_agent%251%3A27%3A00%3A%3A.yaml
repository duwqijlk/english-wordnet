simpleMeaning: A chemical weapon disrupting the body's signalling, first made in 1936; tested in camps
  in World War II, not in battle; Iraq allegedly used it against Iran and the Kurds.
scope: This sense is the broad class of chemical weapons, not a single named agent such as sarin or an
  agricultural insecticide.
examples:
- The inspectors found traces of an organophosphate nerve agent in the warhead.
- Exposure to an organophosphate nerve agent can kill within minutes.
