simpleMeaning: A woody vine with bright green leaves and bunches of rose-tinted white flowers; its swollen
  roots hold rotenone.
scope: 'Also called derris root or tuba root: a woody vine with bright green leaves and rose-tinted white
  flowers, not a tree and not a plant with yellow flowers.'
examples:
- Derris elliptica climbed the tree, its rose-tinted white flowers in bunches.
- The swollen roots of Derris elliptica hold rotenone.
