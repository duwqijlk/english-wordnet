simpleMeaning: In the northeast of North America grows a herb with hanging bunches of pale yellow flowers,
  at times put in the group Prenanthes.
scope: Also called cankerweed, this herb of the northeast of North America has hanging bunches of pale
  yellow flowers, unlike the lettuce grown for salads.
examples:
- The white lettuce showed its hanging bunches of pale yellow flowers.
- We found white lettuce in the northeast.
