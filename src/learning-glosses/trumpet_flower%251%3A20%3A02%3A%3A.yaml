simpleMeaning: A Mexican winter-green climbing plant with big lone funnel blooms, sweet and yellow, with
  purple-brown ridges in the throat.
scope: This sense is also called chalice vine and cupflower, unlike the sense for an evergreen North American
  honeysuckle vine with coral-red or orange flowers.
