simpleMeaning: The player who names the top suit must take 3 rounds to win a hand, after each player gets
  5 cards in a game like ecarte, an old card game
scope: 'Also called euchre: a card game where each player gets 5 cards and the player who names the top
  suit must take 3 rounds, not poker and not bridge.'
examples:
- We played five hundred after dinner, and I had to take three tricks to win.
- Five hundred is my favourite card game because each player only gets five cards.
