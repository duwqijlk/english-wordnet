simpleMeaning: Worn on the slopes or as smart dress, these trousers of stretchy cloth are most often held
  tight by a strap under the foot
scope: Also called salopettes, they are the stretchy trousers held tight by a strap under the foot, worn
  on the slopes or as smart dress.
examples:
- Before heading out to the slopes, the ski pants were pulled on.
- The ski pants stayed tight because of the strap under each foot.
