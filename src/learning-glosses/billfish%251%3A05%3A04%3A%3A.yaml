simpleMeaning: A slim fish with a long beak, living in the mild waters of the Atlantic.
scope: A slim long-beaked fish of mild Atlantic waters; not a giant warm-water game fish and not a shark.
examples:
- The billfish swam in the mild Atlantic water.
- Billfish with long beaks fed near the surface.
