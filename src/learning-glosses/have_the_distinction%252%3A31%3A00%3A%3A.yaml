simpleMeaning: one thing that is easy to notice sets a person or thing apart from others of the same kind
scope: One thing that is easy to notice sets a person or thing apart from others of the same kind; not
  a small difference and not fame in general.
examples:
- The cafe has the distinction of serving the best coffee in town.
- She has the distinction of being the youngest doctor in the hospital.
