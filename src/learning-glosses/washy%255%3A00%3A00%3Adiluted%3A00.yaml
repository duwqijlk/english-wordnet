senseId: washy%5:00:00:diluted:00
synsetId: 00759980-s
simpleMeaning: Too watery, thin and flat in taste.
scope: This sense is also called weak and watery, for what is too watery, thin and flat in taste, where
  weak is with too much liquid added, so it tastes thin and has no flavour, and watery is with too much
  liquid added, so it is thin and has little taste.
examples:
- The soup was washy, thin and flat in taste.
- The tea was washy, with too much water in it.
