simpleMeaning: a white hard bitter salt that is used when making glass, paper, dyes and drugs
scope: A hard white salt used in making glass, paper, dyes and drugs, also called sodium sulfate; not
  table salt for food, and not a liquid.
examples:
- The plant bought sodium sulphate to make dyes for paper.
- A worker added sodium sulphate to the mix for the glass.
