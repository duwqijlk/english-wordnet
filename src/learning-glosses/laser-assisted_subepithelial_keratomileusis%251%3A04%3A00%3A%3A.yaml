simpleMeaning: A thin flap in the top skin layer of the eye is lifted, stays joined at one edge, while
  the front part of the eye changes shape.
scope: An eye operation that reshapes the front of the eye to change how it bends light.
examples:
- After laser-assisted subepithelial keratomileusis, her sight was sharp without glasses.
- The surgeon planned laser-assisted subepithelial keratomileusis to sharpen his sight without glasses.
