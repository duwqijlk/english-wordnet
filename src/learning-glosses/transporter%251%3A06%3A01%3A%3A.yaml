simpleMeaning: A belt that keeps moving and carries things along, as in a factory.
scope: Also called a conveyor; a belt that moves things along, not a crane that lifts and loads goods
  with speed and not a long truck for carrying motor vehicles.
examples:
- The transporter moved the boxes along the line.
- They watched the transporter carry parts across the factory floor.
