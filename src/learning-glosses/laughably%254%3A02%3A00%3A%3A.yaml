simpleMeaning: in a way that makes people laugh, or that should make people laugh
scope: This sense is also called ridiculously, ludicrously and preposterously. It means in a way that
  makes people laugh or should make them laugh, not in a way that shows a person is laughing while doing
  something.
examples:
- Her pay was laughably small, but she still lived well.
- He wore a laughably large hat that made everyone in the room laugh.
