simpleMeaning: the way a line or surface leans to one side and does not stand straight up
scope: 'This sense is also called list, lean and leaning: the slant of a line or surface. It is not the
  old fight between knights on horses, and not a slight favouring of one side.'
examples:
- The old tower has a clear tilt to the left.
- From here you can see the tilt of the ship's mast.
