simpleMeaning: to do with, or like, the belief in things beyond what people can grasp
scope: To do with, or like, the belief in things beyond human grasp; not a person who holds that belief,
  and not the adjective for what is typical of that belief.
examples:
- He trusted his mystic intuition about people.
- She wrote mystic theories about how markets move.
