simpleMeaning: A widely spread network holding free and fixed germ-eating cells that come from bone marrow.
scope: This is a widely spread network of germ-eating cells from bone marrow, also called mononuclear
  phagocyte system, and not the blood network or the lymph network.
examples:
- The system of macrophages clears germs from the blood.
- Cells of the system of macrophages line the liver.
