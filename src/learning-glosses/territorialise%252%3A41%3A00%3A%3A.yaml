senseId: 'territorialise%2:41:00::'
synsetId: 02437822-v
simpleMeaning: to set up a place as a land with its own rules and borders
scope: To set up a place as a land with its own rules and borders, also called territorialize; not to
  make a land larger by adding land, and not to place a thing on a land basis.
examples:
- The government moved to territorialise the new province.
- They voted to territorialise the district and give it its own council.
