senseId: 'substrate%1:15:00::'
synsetId: 08675518-n
simpleMeaning: The layer below, with another layer lying on top of it.
scope: A layer lying underneath another; not a language whose sounds pass into a new tongue, not the stuff
  an enzyme works on, and not a surface on which a living thing grows or is fixed.
examples:
- The substrate of sand lay under the layer of rich soil.
- Builders laid the substrate first, then the floor on top.
