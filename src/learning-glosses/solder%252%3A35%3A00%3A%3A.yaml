simpleMeaning: to join two metal parts by melting a soft metal onto them so they stick together when it
  cools
scope: This is the act of joining metal parts in this way, not the soft metal itself that is melted to
  make the join.
examples:
- Please solder these two pipes together.
- He learned to solder the wires to the board.
