simpleMeaning: The gain when takings are more than spending over a set time, counting the loss in value
  of tools and other costs paid without cash.
scope: 'Also called net, profit, earnings, profits, net income, or net profit: the gain when takings are
  more than spending over a set time, counting the loss in value of tools and other costs paid without
  cash.'
examples:
- The shop's lucre for the year was small after all costs were counted.
- They counted the lucre left when spending was taken from takings.
