simpleMeaning: to set open windows on a computer screen so that each one lies partly over the next, with
  the top bars showing
scope: To set open windows on a computer screen so that they lie partly over each other, not water rushing
  down and not a sudden fall of small things.
examples:
- She cascaded the windows so she could see all their title bars.
- Cascade the open windows to find the one you want.
