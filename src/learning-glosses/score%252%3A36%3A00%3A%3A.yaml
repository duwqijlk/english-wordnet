simpleMeaning: compose the written music for a film, play, or similar work, setting down what each instrument
  plays
scope: This is the verb for composing music for a production, not the noun naming the written music itself
  and not the sense of gaining points in a game.
examples:
- She was asked to score the new film by a young director.
- He scored three ballets before he turned thirty.
