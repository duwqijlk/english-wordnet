simpleMeaning: Holy vultures eat the body in this long-held Tibetan rite for the dead, in which it is
  laid out in the open air.
scope: It is a rite for the dead in which the body is left in the open air for holy vultures, not put
  in the ground.
examples:
- The family chose a sky burial for their father.
- Vultures gathered for the sky burial.
