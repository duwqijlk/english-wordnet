simpleMeaning: People use this cassava most to make cassiri, a drink that makes one drunk, and starch;
  it has long thick roots to eat and soft stems that break with ease.
scope: A cassava used most to make cassiri, a drink that makes one drunk, and tapioca; gari, manioc, bitter
  cassava, mandioc and mandioca are other names for it.
examples:
- They grew the tapioca plant for its long thick roots.
- Farmers use the tapioca plant to make cassiri and starch.
