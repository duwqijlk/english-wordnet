simpleMeaning: A unit of length used to measure the size of letters in text, equal to about one seventy-second
  of an inch.
scope: This is not a unit added to a game score or a fee on a loan; it measures the size of type.
examples:
- The book’s main text is set in 11-point type.
- Increase the font size by two points.
