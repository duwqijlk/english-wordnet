simpleMeaning: the trait of holding fast to one's own view and refusing to give way or come to an agreement
scope: The trait of holding fast to one's own view and refusing to give way, also called intransigence;
  not mere firmness of purpose and not a refusal to obey an order.
examples:
- His intransigency blocked every attempt at a deal.
- The talks failed because of her intransigency.
