simpleMeaning: How the muscles, nerves, blood tubes, and the rest of one part of the body fit together
  is what this field learns, part by part.
scope: Also called topology and regional anatomy, this is the study of the body part by part, with close
  care for how each part's pieces fit together.
examples:
- She studied topographic anatomy to learn how the arm's muscles and nerves lie together.
- Topographic anatomy maps the body region by region.
