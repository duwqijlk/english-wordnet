simpleMeaning: having a spine that curves too much, so the upper back sticks out
scope: This sense, also called humped, humpbacked, hunchbacked, gibbous, crookbacked and kyphotic, describes
  a person or a back with this curve; it is not the noun name for such a person.
examples:
- The crookback old man leaned on a stick as he walked.
- His crookback back made it hard for him to stand straight.
