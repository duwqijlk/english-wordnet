senseId: 'miracle_worker%1:18:00::'
synsetId: 10341412-n
simpleMeaning: A person who says they can do wonderful things that cannot be explained by natural laws,
  or is said to be able to do them.
scope: A person who says they can do wonderful things that cannot be explained by natural laws, or is
  said to be able to do them; not only a male person who does this, and not only a female person who does
  this.
examples:
- The miracle worker said they could heal a sick child with a touch.
- Villagers said the miracle worker had made a blind woman see again.
