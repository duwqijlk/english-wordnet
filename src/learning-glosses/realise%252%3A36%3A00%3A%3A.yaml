simpleMeaning: To make an idea or plan exist in the world, not only in the mind
scope: 'Also called realize: making an idea or plan exist in the world, not earning money from work or
  business, and not adding chords to baroque music.'
examples:
- She realised her dream of opening a small shop.
- Their plan was finally realised when the new school opened.
