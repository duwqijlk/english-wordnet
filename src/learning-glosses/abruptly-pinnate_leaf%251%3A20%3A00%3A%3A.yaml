simpleMeaning: a part of a plant with small parts in pairs along a stem and a pair at the tip
scope: This is a leaf with small leaflets in pairs along the stem and a pair at the tip; also called even-pinnate
  leaf, not a leaf with one leaflet at the tip.
examples:
- The abruptly-pinnate leaf had small leaflets in pairs along its stem.
- The abruptly-pinnate leaf ended in a pair of small leaflets, not one.
