simpleMeaning: looking as if the color has been made less bright by a light dust on top
scope: This is about color made pale and less bright, not about how a thing feels dry and soft like powder.
examples:
- She wore a powdery blue dress, pale and soft in color.
- The walls were painted a powdery pink that looked light and dull.
