simpleMeaning: a cut of beef that has the H-shaped bone of the rump in it
scope: A cut of beef that has the H-shaped bone of the rump in it; not a boneless cut and not a cut from
  the front of the animal.
examples:
- The butcher sold her an aitchbone for the Sunday roast.
- An aitchbone has the H-shaped bone in the middle.
