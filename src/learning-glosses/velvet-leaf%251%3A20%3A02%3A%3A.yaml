simpleMeaning: in the southwest United States grows a long-lived shrub, tall like a tree, with furry foliage
  split like a spread hand and showy red-purple flowers
scope: 'Also called tree mallow and velvetleaf: a tall shrub of the south-west United States with showy
  red-purple flowers, not a tree and not a low herb.'
examples:
- The velvet-leaf in the desert garden has soft furry leaves.
- We saw a velvet-leaf with showy red-purple flowers in the southwest.
