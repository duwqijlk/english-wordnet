simpleMeaning: To put your name down, in due form, as a member or player.
scope: This sense is also called enter, raise, recruit, enroll, and inscribe, for putting your name down,
  in due form, as a member or player, where entering is signing up in an official way to join a group
  or take part in an event, raising is officially bringing people into a group as members, and recruiting
  is signing someone up in an official way so they join a group or take part in something.
examples:
- She enrolled in the course.
- Enrolling puts your name down.
