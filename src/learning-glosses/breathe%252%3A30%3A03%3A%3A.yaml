simpleMeaning: develop full flavor by taking in air after being opened and left standing a while
scope: Describes a drink improving in taste as it sits open, not the act of drawing air in and out, and
  not giving off a smell.
examples:
- Let the red wine breathe for an hour before you pour it.
- The bottle was left open to breathe while dinner was prepared.
