simpleMeaning: A set of related tongues of a people of West Africa, used as a shared tongue from Senegal
  to Chad, and the best known of the tongues of West Africa
scope: A set of tongues, also called Fula, Fulani, and Peul; not one tongue and not a people.
examples:
- Ful is used from Senegal to Chad.
- Ful is the best known of the tongues of West Africa.
