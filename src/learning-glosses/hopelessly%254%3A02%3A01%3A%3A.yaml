senseId: 'hopelessly%4:02:01::'
synsetId: 00202043-r
simpleMeaning: In a way that shows no hope is left, with no good end in sight
scope: This is about doing a thing in a way that shows no hope is left, not about a person who feels desperate
  because no comfort or success seems possible.
examples:
- The papers were hopelessly jumbled after the move.
- She remained hopelessly in love with the old house.
