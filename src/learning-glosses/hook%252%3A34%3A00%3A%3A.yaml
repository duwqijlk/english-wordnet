simpleMeaning: to make someone or yourself keep needing something and not be able to stop, especially
  a narcotic drug (a strong drug that dulls pain)
scope: This verb means making someone need something, especially a drug; it is not making cloth with a
  needle and not a curved tool or a shot in a game.
examples:
- The drug hooked him after only a few weeks, and he could not stop using it.
- She got hooked on pain pills and needed help to stop.
