simpleMeaning: any one of different kinds of tools that you hold in your hand and use to remove things
  from a surface by pushing or pulling across it
scope: A hand tool for taking things off a surface, not a knife for cutting and not a brush for painting.
examples:
- She used a scraper to remove old paint from the wall.
- He held the scraper flat and pushed the ice off the window.
