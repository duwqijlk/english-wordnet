simpleMeaning: During an operation, to use a tool to keep the cut edges of a wound or a body part held
  open
scope: To keep the cut edges of a wound or a body part held open with a tool during an operation; retract
  and draw back are other names for this sense, not to stretch back a bowstring.
examples:
- The nurse helped to pull back the edges of the wound so the doctor could see inside.
- They had to pull back the organ to reach the part behind it.
