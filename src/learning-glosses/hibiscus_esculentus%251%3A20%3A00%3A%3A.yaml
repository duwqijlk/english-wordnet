simpleMeaning: Tall coarse one-year Old World tropical plant, widely grown in southern US and West Indies
  for long sticky green pods, a base for soups and stews, sometimes in genus Hibiscus.
scope: Also called okra, gumbo, lady's-finger, okra plant, and Abelmoschus esculentus; a plant grown for
  its sticky green pods, not a bean plant.
examples:
- Hibiscus esculentus grew tall in the garden.
- We cooked Hibiscus esculentus pods in the stew.
