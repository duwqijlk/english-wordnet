simpleMeaning: ready to believe others, with the open trust and lack of doubt of a small child
scope: This is a trusting, open way of being; childlike and simple are other names for this sense, not
  a wise and wary way of acting and not a show of innocence put on to fool others.
examples:
- Her dewy-eyed trust in the stranger surprised her older sister.
- He listened with dewy-eyed wonder to the old sailor's tales.
