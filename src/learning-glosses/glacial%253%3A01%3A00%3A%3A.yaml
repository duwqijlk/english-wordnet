simpleMeaning: connected with a glacier (a very large mass of ice that moves very slowly), or made by
  one
scope: This is about a large moving mass of ice, or made by one; it is not cold and unfriendly in manner.
examples:
- Glacial deposits cover much of the valley floor.
- The lake was formed by glacial ice long ago.
