simpleMeaning: Bunches of blooms spotted with purple stand at the tips of the stems of this North American
  herb, whose leaves grow in rings.
scope: People also call it purple boneset and trumpet weed, and the word names a North American herb with
  purple-spotted blooms.
examples:
- The marsh milkweed grows in North America and bears bunches of blooms spotted with purple.
- We saw marsh milkweed with purple-spotted blooms at the stem tips.
