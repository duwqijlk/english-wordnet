simpleMeaning: the study of whole sets of linked parts across many fields, to find rules that work for
  every kind of set at every level
scope: This is the study of whole sets of linked parts in many fields; not the study of one kind of set
  alone, and not a plan for building one machine.
examples:
- Systems theory helps us see how parts of a forest work as one whole.
- She used systems theory to study how a hospital and a town affect each other.
