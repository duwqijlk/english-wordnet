simpleMeaning: a person who says that something is not true
scope: This is a person who says something is not true. It is not a unit that shows how fine silk, nylon
  or rayon is, and not an old coin once used in parts of Europe.
examples:
- He is a well-known denier of the moon landing, and says the photos are false.
- The denier told the meeting that the report was not true at all.
