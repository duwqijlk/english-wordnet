simpleMeaning: a spot on a machine run by power, such as a battery, where power goes in or comes out
scope: 'Also called a pole: the spot where power enters or leaves a battery or other device, not a station
  and not a computer screen.'
examples:
- Connect the red wire to the positive terminal of the battery.
- The terminal on the old battery had gone green with age.
