simpleMeaning: for the wind to blow in sudden hard gusts, the way it does during a short storm
scope: For the wind to blow in sudden hard gusts, not a sudden loud cry and not the sound of high whining.
examples:
- When it squalls, the crew takes in the sails.
- The wind began to squall just as the boat left the harbour.
