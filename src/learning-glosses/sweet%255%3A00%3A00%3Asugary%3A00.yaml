simpleMeaning: Made by adding sugar to food or drink.
scope: Food or drink given extra sugar; not something whose own taste is like sugar, not wine with its
  natural sugar left in, and not salt-free water.
examples:
- She takes her coffee sweet, with two spoons of sugar.
- The children asked for sweet tea instead of water.
