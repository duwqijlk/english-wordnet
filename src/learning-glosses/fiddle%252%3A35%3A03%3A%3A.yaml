simpleMeaning: to change a thing or play with it, usually in secret or in a way that is not honest
scope: 'Also called monkey: changing a thing in secret or in a way that is not honest, not playing a string
  instrument and not stealing from the person you work for.'
examples:
- Someone fiddled with the numbers in the report before the meeting.
- The reporter fiddled with the facts to make the story sound better.
