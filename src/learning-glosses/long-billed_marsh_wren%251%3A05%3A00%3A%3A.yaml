simpleMeaning: A small American songbird with a beak of more than usual length, that lives among tall
  reeds on wet ground.
scope: This is a small American songbird with a long beak that lives among tall reeds, not a short-beaked
  wren and not a bird of dry fields.
examples:
- The long-billed marsh wren sang from the tall reeds.
- We heard a long-billed marsh wren in the marsh at dawn.
