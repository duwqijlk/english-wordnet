simpleMeaning: a frame holding two lenses, worn in front of the eyes to make sight clearer
scope: A frame holding two lenses, worn in front of the eyes to make sight clearer; glasses and spectacles
  are other names for this sense, not a single lens and not dark glasses worn against the sun.
examples:
- He put on his eyeglasses to read the letter.
- Her eyeglasses slipped down her nose as she laughed.
