simpleMeaning: the part of a plant that makes seeds, in plants that keep their seeds inside fruit, especially
  a part with bright, showy parts in strong colors
scope: 'Also called flower and blossom: the seed-making part of a plant, especially a bright one; not
  the act or time of a plant bearing flowers.'
examples:
- The rose bush was covered with large pink blooms.
- Each bloom on the tree had five white parts around its center.
