simpleMeaning: From its stem, thin lines run side by side through this part of a plant
scope: A part of a plant with lines that run side by side from its stem, not a part with lines that spread
  out like fingers and not a part with lines that branch.
examples:
- The parallel-veined leaf felt smooth between my fingers.
- Grasses often have a parallel-veined leaf.
