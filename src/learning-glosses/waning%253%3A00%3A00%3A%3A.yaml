simpleMeaning: about the moon in the time when the lit part that we can see gets smaller
scope: This describes the moon in the time when the lit part we see gets smaller; not a slow fall in size
  or amount in general.
examples:
- After the full moon, the waning moon looks smaller each night.
- In its waning days, the moon rose later and showed less light.
