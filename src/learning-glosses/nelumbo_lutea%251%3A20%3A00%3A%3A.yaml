simpleMeaning: A water lily of the east of North America with pale yellow blooms and round, nut-like seeds
  people can eat
scope: 'Also called water chinquapin, yanquapin, and American lotus: a water lily of the east of North
  America with pale yellow blooms and seeds people can eat, not the white water flower of Egypt or the
  round yellow water flower of slow ponds.'
examples:
- The Nelumbo lutea by the lake had pale yellow blooms.
- We gathered Nelumbo lutea seeds to eat.
