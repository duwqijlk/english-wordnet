simpleMeaning: Of the higher part of the lowest rank in society, above the poorest people.
scope: The higher part of the lowest social rank, not the middle rank and not the poorest people.
examples:
- An upper-lower-class family lived in the small house by the river.
- He came from an upper-lower-class home and worked his way up.
