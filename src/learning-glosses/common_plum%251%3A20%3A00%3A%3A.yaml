simpleMeaning: Any of several kinds of fruit grown widely in cool temperate lands
scope: Any of several kinds of fruit grown widely in cool temperate lands; not a cherry or a peach, and
  not a single named kind.
examples:
- The common plum grows well in cool lands.
- We picked the common plums before the first frost.
