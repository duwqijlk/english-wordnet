synsetId: 00217417-v
simpleMeaning: to put flax, hemp or jute in liquid so that the thin threads come loose from the hard woody
  part
scope: This sense is about putting flax, hemp or jute in liquid to free the threads in them, not just
  leaving any thing in liquid to get wet.
examples:
- The workers ret the hemp in liquid until the threads come loose.
- After the jute was retted, its threads could be pulled free from the woody part.
