simpleMeaning: A low wide shrub of the Mediterranean lands, grown for its thick rings of purple or yellow
  flowers at the leaf joints.
scope: 'Also called Phlomis fruticosa: a low wide shrub of the Mediterranean lands, grown for its thick
  rings of purple or yellow flowers at the leaf joints; other low shrubs of the same lands have flowers
  in bunches at the ends of branches or of other colours.'
examples:
- Jerusalem sage grows low and wide in the Mediterranean lands.
- The purple flowers of Jerusalem sage grow in thick rings at the leaf joints.
