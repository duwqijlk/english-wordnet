simpleMeaning: a big group of sympathetic nerves, the nerves that work without our thinking, in the belly
  just behind the stomach
scope: A big group of sympathetic nerves in the belly behind the stomach, also called abdominal nerve
  plexus, coeliac plexus and plexus celiacus; not a single nerve and not part of the stomach itself.
examples:
- A hard blow to the solar plexus can knock the wind out of you.
- The solar plexus lies in the belly, just behind the stomach.
