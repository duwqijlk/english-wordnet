simpleMeaning: a wish to do kind things and to help people in need
scope: This sense is a wish to do kind things and help people in need, not ill will and not a single gift
  on its own.
examples:
- Her benevolence led her to give food and money to poor families.
- People thanked the old man for his benevolence toward neighbours in need.
