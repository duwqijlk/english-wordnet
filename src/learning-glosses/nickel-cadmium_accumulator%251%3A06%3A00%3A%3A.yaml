simpleMeaning: With Ni on one side and Cd on the other, this battery can be charged again, runs down very
  slowly when idle, and is often kept as spare power.
scope: Nicad is another name for this battery, which can be charged again and runs down very slowly when
  idle, and is often kept for back-up power.
examples:
- The nickel-cadmium accumulator still worked after a long rest.
- They fitted a nickel-cadmium accumulator in the emergency light.
