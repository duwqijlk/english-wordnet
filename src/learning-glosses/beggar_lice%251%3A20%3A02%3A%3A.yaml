senseId: 'beggar_lice%1:20:02::'
synsetId: 12547021-n
simpleMeaning: Rough sticky pod sections or loments, the jointed kind, grow on any of various plants of
  hot and warm lands, with three-part leaves.
scope: This is one of various plants of hot and warm lands, with three-part leaves and rough sticky pod
  sections; beggar's lice and tick trefoil are other names for this sense, not the Eurasian and North
  American plant with small prickly nutlets that stick to clothing.
examples:
- Beggar lice caught on her dress with its rough sticky pods.
- The beggar lice had three-part leaves and jointed pods.
