simpleMeaning: A tall tree of western North America that stays green all year, cut for wood and sold in
  large amounts.
scope: Also called west coast hemlock, western hemlock, and Tsuga heterophylla, this tall evergreen of
  western North America is a timber tree valued in trade for its wood.
examples:
- The Pacific hemlock stays green all year.
- Loggers cut the Pacific hemlock for wood.
