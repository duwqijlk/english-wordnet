simpleMeaning: To break up blocks of frozen water, you use this steel rod with a sharp point
scope: A steel rod with a sharp point for breaking up blocks of frozen water, also called ice pick; not
  a ship that breaks up frozen water and not a knife.
examples:
- He used an icepick to break the large block into smaller pieces.
- She chipped at the frozen block with an icepick until it split apart.
