simpleMeaning: A substance, such as ethanol or formaldehyde, that sets tissue and cells so they can be
  looked at under a microscope
scope: This is a substance that sets tissue and cells for study under a microscope, not a spray that stops
  pictures from smudging and not a hair spray.
examples:
- The fixative kept the cells firm for study.
- She put the tissue in fixative.
