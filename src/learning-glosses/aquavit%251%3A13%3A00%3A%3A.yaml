simpleMeaning: A strong drink from Scandinavia, usually given the taste of caraway seeds.
scope: A strong drink from Scandinavia, usually given the taste of caraway seeds; akvavit is another name
  for it, and it is not beer and not a soft drink.
examples:
- He drank a glass of aquavit with the meal.
- Aquavit is often served cold with fish.
