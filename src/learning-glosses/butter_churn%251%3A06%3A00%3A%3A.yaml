simpleMeaning: A pot in which cream is shaken hard so the fat part comes out and thin milk is left
scope: A pot in which cream is shaken hard so the fat part comes out; churn is another name for this sense,
  not a pot for cooking and not a pot for storing milk.
examples:
- She worked the butter churn until the cream turned.
- Cream in the butter churn slowly gave up its fat.
