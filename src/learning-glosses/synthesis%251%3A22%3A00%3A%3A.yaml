simpleMeaning: the process of making a new chemical, usually by joining simpler chemicals together
scope: This is the process of making a new chemical by joining simpler chemicals. Not a single chemical
  itself, and not the general joining of ideas or parts into one whole.
examples:
- The synthesis of this medicine in the lab took many steps.
- Scientists used synthesis to make the new chemical from simpler ones.
