senseId: 'pardoner%1:18:01::'
synsetId: 10418998-n
simpleMeaning: A person who lets a wrong go and does not hold it against the wrongdoer.
scope: A person who lets a wrong go, also called excuser and forgiver; not a judge who sets the penalty
  and not a person who forgets a debt.
examples:
- The pardoner let the thief go without a fine.
- As a pardoner, she forgave the debt in full.
