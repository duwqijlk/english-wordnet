simpleMeaning: a white crystal-like oxide, a chemical in which oxygen has joined with another element,
  used to make calcium hydroxide
scope: 'Also called burnt lime, calcium oxide, calx, fluxing lime, lime and quicklime: a white crystal-like
  oxide used to make calcium hydroxide, not slaked lime and not plain chalk.'
examples:
- The builder mixed calcined lime with water to make mortar.
- Calcined lime was stored in dry sacks to keep it from damp air.
