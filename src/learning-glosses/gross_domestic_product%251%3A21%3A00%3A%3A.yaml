simpleMeaning: 'The United States'' 1991 measure of a country''s economy: the total market worth of goods
  and services its workers and money make inside its borders in a year, most often.'
scope: The United States' measure of a whole country's economy, not the worth of one firm and not what
  a government spends.
examples:
- The gross domestic product grew by two percent last year.
- Economists watch the gross domestic product to see how the economy is doing.
