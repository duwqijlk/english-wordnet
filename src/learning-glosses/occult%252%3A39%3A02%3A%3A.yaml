simpleMeaning: to stop being seen, or for its light to stop shining
scope: This sense is about a body or light itself going out of sight. It is not about one body hiding
  another, and it is not about magic or hidden powers.
examples:
- The distant star occults when the moon passes in front of it.
- Every so often, the beam of light occults and then appears again.
