simpleMeaning: a small knife you carry in your pocket, first used to cut quill pens (pens made from a
  bird feather)
scope: This is a small knife you carry in your pocket, first made for cutting feather pens. It is not
  a large knife for heavy work, and not a pen itself.
examples:
- He cut the string with his penknife.
- She kept a small penknife in her bag for opening letters.
