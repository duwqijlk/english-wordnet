simpleMeaning: With only a few words in passing, this person brings a thing up
scope: A person who brings a thing up only in passing, not someone who talks about it at length and not
  a writer.
examples:
- The mentioner of the plan said only a few words about it before moving on.
- As the mentioner of the old house, she brought it up only in passing.
