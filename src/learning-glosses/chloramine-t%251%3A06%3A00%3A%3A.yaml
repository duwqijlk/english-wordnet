scope: This is any one of a group of substances that hold chlorine and nitrogen, used to clean wounds
  and keep them free of germs, also called chloramine.
examples:
- The nurse washed the cut with chloramine-T to keep it clean.
- Chloramine-T is used on wounds to kill germs.
