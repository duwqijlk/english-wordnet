senseId: 'noncallable_bond%1:21:00::'
synsetId: 13359795-n
simpleMeaning: a loan paper with a rule that the owner cannot cash it in before a set day, most often
  the day it falls due
scope: A loan paper that cannot be cashed in before a set day; not a loan paper that can be cashed in
  at any time and not a share in a firm.
examples:
- A noncallable bond cannot be cashed in early.
- She held a noncallable bond until it fell due.
