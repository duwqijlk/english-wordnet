simpleMeaning: a tree from India, one of the Combretaceae, a family of trees, that gives wood and a sticky
  gum
scope: This is an Indian tree that gives wood and gum; dhawa is another name for this sense, not a tree
  grown only for its fruit and not a tree from Africa.
examples:
- The dhava grows across the dry hills of central India.
- Carpenters cut dhava for its hard timber.
