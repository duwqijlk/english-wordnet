simpleMeaning: so loud and harsh that it is not pleasant to hear
scope: 'Also called raucous: loud and harsh in sound, not the sense for speech sounds made by pushing
  air through a narrow place, and not a person who shouts in a loud, angry way.'
examples:
- A strident noise came from the old machine all morning.
- The music was strident and too loud for anyone to enjoy.
