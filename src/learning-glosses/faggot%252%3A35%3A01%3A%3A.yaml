simpleMeaning: to fasten long thin pieces of iron together so they can be heated or joined together by
  heat
scope: To fasten iron rods together for heating or joining by heat, not tying sticks into a bundle and
  not joining cloth with a stitch.
examples:
- The workers faggoted the iron rods before heating them in the fire.
- He learned to faggot rods of iron so they could be joined by heat.
