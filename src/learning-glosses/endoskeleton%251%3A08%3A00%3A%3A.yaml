simpleMeaning: the frame inside the body, made of bone and gristle, in particular in animals with backbones
scope: The frame inside the body, made of bone and gristle, not the hard outer covering of an insect or
  crab and not the frame of a building.
examples:
- The endoskeleton of a fish is made of bone and gristle.
- A shark's endoskeleton gives its body its shape from the inside.
