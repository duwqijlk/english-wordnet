simpleMeaning: Blood tubes that pass from the outer lips of the female sex organs at the back to the blood
  tube inside the groin.
scope: Blood tubes from the outer lips at the back to the inner groin tube; posterior labial veins is
  another name for this sense; not blood tubes of the front lips and not ones of the leg.
examples:
- The venae labiales posteriores pass from the outer lips to the inner groin tube.
- Blood flows through the venae labiales posteriores toward the pelvis.
