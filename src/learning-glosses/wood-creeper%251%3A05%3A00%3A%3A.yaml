simpleMeaning: many kinds of South and Central American birds climb and feed on tree trunks as the hammering
  birds do, with curved beaks and stiff tail feathers
scope: Also called tree creeper, woodcreeper, and woodhewer, a bird that climbs trees to feed, not a woodpecker
  and not a nuthatch.
examples:
- The wood-creeper climbed the trunk, bracing itself with its stiff tail feathers.
- A wood-creeper uses its curved bill to pick insects from the bark.
