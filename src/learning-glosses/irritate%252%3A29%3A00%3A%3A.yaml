simpleMeaning: To stir a part of the body into a wrong or sore state, or to rub it raw and make it swell
scope: To make a body part sore or swollen, not to stir it into its usual action, and not to annoy a person.
examples:
- Aspirin irritates my stomach.
- The rough collar irritated the dog's neck all day.
