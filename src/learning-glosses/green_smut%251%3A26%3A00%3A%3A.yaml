simpleMeaning: A sickness of rice plants, in which the grains are covered with a powder the colour of
  leaves made of tiny bits
scope: This is a sickness of rice plants; false smut is another name for it, not a sickness of wheat and
  not a sickness of leaves.
examples:
- Green smut spoiled the rice crop.
- The farmer found green smut on the rice grains.
