simpleMeaning: In chemistry, a thing made by joining two or more basic parts or other parts that go into
  it, always in the same set share by weight
scope: In chemistry, a thing made by joining two or more basic parts or other parts that go into it, always
  in the same set share by weight; compound is another name for this sense, not a mere mix and not a single
  simple part.
examples:
- Water is a chemical compound of hydrogen and oxygen.
- Salt is a chemical compound, not a mere mix.
