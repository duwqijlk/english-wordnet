simpleMeaning: used when you give the smallest amount that is still true, even if the rest is not known
scope: 'Also called at any rate, leastways and leastwise: a way to state the smallest amount that is still
  true, not a guess and not a promise of more.'
examples:
- At least he came to the meeting.
- She saved at least ten pounds.
