simpleMeaning: To take something up and put it to work toward a particular aim.
scope: This stresses what the thing will be used for, not merely receiving a gift, replying yes to an
  offer, or putting up with an annoyance.
examples:
- The gallery accepted the sculpture for its autumn show.
- The lab accepted the samples for testing.
