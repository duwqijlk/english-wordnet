simpleMeaning: a pretty cover for a lamp that stops people from seeing the light bulb straight on
scope: 'Also called shade and lamp shade: a pretty cover for a lamp, not a lamp itself and not a cover
  for a window.'
examples:
- She put a blue lampshade on the lamp by the bed.
- The lampshade was broken, so the bright light hurt our eyes.
