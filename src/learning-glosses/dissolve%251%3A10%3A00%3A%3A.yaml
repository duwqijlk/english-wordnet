simpleMeaning: In film, a slow change from one scene to the next, where the next scene is slowly shown
  over the first as the first scene slowly fades out
scope: In film, the slow change between scenes described here, not a single scene simply fading out on
  its own.
examples:
- The film used a dissolve to move gently to the next scene.
- A slow dissolve took us from the house to the sea.
