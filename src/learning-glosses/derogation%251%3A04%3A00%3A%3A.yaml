schema: oewn-learning-gloss-v2
senseId: 'derogation%1:04:00::'
synsetId: 00233014-n
simpleMeaning: In law, the partial taking away of the force of a law, so that part of it no longer has
  effect
scope: In law, this is the partial taking away of the force of a law, not the full end of a law and not
  a small change to its words.
examples:
- The new act brought a derogation of the old rule.
- A derogation of the law left part of it without effect.
