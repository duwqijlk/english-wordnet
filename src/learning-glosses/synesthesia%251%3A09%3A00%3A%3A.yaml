senseId: 'synesthesia%1:09:00::'
synsetId: 05728549-n
simpleMeaning: A person's senses are crossed, so a feeling that normally comes through one sense arrives
  through a different one instead.
scope: Synaesthesia is another name for this crossing of the senses, in which the sense stirred is not
  the sense the feeling belongs to.
examples:
- When a piano note sounds, synesthesia can turn it into a wash of colour.
- Tasting food can bring a sound to mind for a person with synesthesia.
