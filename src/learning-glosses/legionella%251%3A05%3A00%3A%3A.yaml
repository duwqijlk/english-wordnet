simpleMeaning: a rod-shaped germ that does not stain purple, moves, and needs air to live; it grows in
  heating and air systems and can cause Legionnaires' disease
scope: A rod-shaped germ that lives in heating and air systems and can cause Legionnaires' disease, not
  a virus and not a harmless germ in water.
examples:
- Legionella can grow in the warm water of old heating systems.
- The doctors found legionella in the air conditioning water.
