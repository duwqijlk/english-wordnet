senseId: 'hydatid_mole%1:26:00::'
synsetId: 14216424-n
simpleMeaning: a problem in pregnancy in which the parts that feed the unborn baby break down into groups
  of small sacs full of fluid, and the baby most often dies
scope: 'Also called hydatidiform mole or molar pregnancy: a pregnancy problem in which tissue around the
  baby breaks down into fluid sacs, not a normal pregnancy and not a growth on the skin.'
examples:
- The doctor said a hydatid mole had formed during her pregnancy.
- A hydatid mole can lead to the loss of the baby.
