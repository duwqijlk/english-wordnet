simpleMeaning: a sailing boat or ship with a stated kind of sails and the ropes that hold them
scope: A sailing boat or ship named for its kind of sails and ropes, not the long, thin, pointed brush
  used by artists.
examples:
- The square rigger sailed into the harbour with all its sails up.
- A three-masted rigger stood at the dock, ready to leave.
