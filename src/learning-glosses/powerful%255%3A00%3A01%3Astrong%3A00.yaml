simpleMeaning: Of a person, having a solid, heavy build, tough-looking and strong.
scope: This is a person's own bodily build and muscle, not strength beyond human limits, and not sheer
  force of impact or influence.
examples:
- The boxer had powerful shoulders and a thick neck.
- He was a powerful man, built like a farmhand.
