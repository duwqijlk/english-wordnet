simpleMeaning: A plant that grows on trees, from Brazil, much grown as a houseplant, with jointed flat
  parts and usually rose-purple flowers that open in winter.
scope: A plant that grows on trees, with jointed flat parts and rose-purple winter flowers, also called
  Schlumbergera baridgesii or Schlumbergera buckleyi.
examples:
- Our Christmas cactus bloomed in December, its rose-purple flowers bright against the window.
- The Christmas cactus on the shelf has flat jointed stems.
