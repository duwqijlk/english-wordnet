simpleMeaning: A machine reads the heart's beats by electric signals and writes them down as a chart,
  in a test of how the heart works.
scope: Also called cardiography, it is a test that records how the heart works, using a machine that writes
  its beats down as a chart.
examples:
- Electrocardiography showed how fast the heart was beating.
- Electrocardiography is used when the heart's beats need to be read.
