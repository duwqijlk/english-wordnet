simpleMeaning: Bricks of dried mud make this very old Egyptian tomb, its sides sloping in from a four-sided
  base to a flat top
scope: Also called mastabah, this very old Egyptian tomb of dried mud bricks is not the pyramid that grew
  out of it.
examples:
- The Egyptian pyramids developed from the mastaba.
- The mastaba was built long ago in Egypt.
