simpleMeaning: A bushy pine of the north-west coast of the United States, with two needles in a bunch
  and red to yellow-brown bark split into small squares
scope: 'Also called lodgepole, lodgepole pine, shore pine and spruce pine: a bushy pine of the north-west
  coast with bark split into small squares, not a tall straight pine.'
examples:
- Pinus contorta grows along the north-west coast of the United States.
- The bark of Pinus contorta is split into small squares.
