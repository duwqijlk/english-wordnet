simpleMeaning: A mix of drugs that block the proteins a virus needs, taken with drugs that block the virus
  from copying itself, used to treat AIDS and HIV
scope: A mix of drugs used to treat AIDS and HIV, not a single drug or a cure; also called drug cocktail
  and highly active antiretroviral therapy.
examples:
- HAART helps people living with HIV.
- The doctor gave her HAART to treat AIDS.
