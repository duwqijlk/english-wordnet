simpleMeaning: a person who studies living things, and whose work is mainly about how parents pass things
  like eye color to their children
scope: A scientist who studies living things and works mainly on how parents pass things like eye color
  to their children; not a scientist who studies all living things in general.
examples:
- The geneticist studied how eye color passes from parents to children.
- A geneticist at the university is looking at why some illnesses run in families.
