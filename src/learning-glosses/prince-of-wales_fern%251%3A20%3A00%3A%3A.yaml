simpleMeaning: A New Zealand fern with feather-like fronds, densely woolly stalks, and sometimes classified
  in genus Todea.
scope: Also called crape fern, Leptopteris superba, Prince-of-Wales feather, Prince-of-Wales plume, and
  Todea superba; a New Zealand fern whose stems are thickly covered with soft wool-like hair.
examples:
- The Prince-of-Wales fern in the fern house has finely divided leaves.
- We saw a Prince-of-Wales fern with stems covered in soft wool-like hair.
