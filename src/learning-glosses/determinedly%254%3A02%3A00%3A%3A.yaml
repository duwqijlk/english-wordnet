simpleMeaning: with a firm decision to keep going, and in a way that shows you will not stop or give up
scope: Done with a firm decision to keep going, not done with a strong wish to succeed and lots of energy.
examples:
- He held on to the rope determinedly until help came.
- She worked determinedly to finish the job on time.
