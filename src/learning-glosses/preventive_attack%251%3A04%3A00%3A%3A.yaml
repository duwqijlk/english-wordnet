simpleMeaning: A blow made first, to stop harm from an enemy that is thought to be coming
scope: 'Another name for a preventive strike: a blow made first to stop harm from an enemy that is thought
  to be coming; not a blow made in a fight that is already going on.'
examples:
- The general ordered a preventive attack before dawn.
- A preventive attack was launched to stop the invasion.
