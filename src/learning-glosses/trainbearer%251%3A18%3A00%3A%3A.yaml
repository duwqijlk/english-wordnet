simpleMeaning: A person who holds up the long back part of a dress or robe at a formal event
scope: A person who carries the back of a long dress or robe at a formal event, not the person who wears
  it and not a servant who carries a bag.
examples:
- The trainbearer lifted the bride's train as she walked down the aisle.
- At the coronation, a young trainbearer held up the queen's robe.
