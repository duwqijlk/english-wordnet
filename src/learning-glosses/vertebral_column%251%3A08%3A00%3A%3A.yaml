simpleMeaning: 'Down the back runs the main frame of the body: small bones in a line that keep the cord
  of nerves inside safe.'
scope: Also called the back, spine, backbone, rachis, and spinal column, this is the main frame down the
  back, a line of small bones guarding the cord of nerves inside.
examples:
- The vertebral column runs down the middle of the back.
- A break in the vertebral column can harm the cord of nerves inside.
