simpleMeaning: In law, when a third person comes between a husband and wife on purpose and with spite,
  and has no good reason, it is a civil wrong
scope: In law, this is a civil wrong in which a third person comes between a husband and wife with no
  good reason, not a wrong done by the husband or wife themselves.
examples:
- She sued for alienation of affection after her husband's friend turned him against her.
- The court heard a claim of alienation of affection against the woman's friend.
