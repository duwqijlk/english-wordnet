simpleMeaning: A learned act that comes just before an unpleasant thing happens
scope: A learned act that comes just before an unpleasant thing happens; conditioned avoidance is another
  name for this sense, not a natural act done without learning and not the unpleasant thing itself.
examples:
- The conditioned avoidance response began before the shock came.
- His conditioned avoidance response came just before the unpleasant thing happened.
