simpleMeaning: A move in which your feet roll over your head, front or back, and land back where they
  began
scope: A move with the feet rolling over the head and back, not a dive into water and not a drink with
  a beaten egg.
examples:
- The gymnast did a flip on the mat.
- He can do a flip forward or backward without stopping.
