simpleMeaning: A percussion instrument made of tuned pieces that are struck with a hammer and played in
  an orchestra.
scope: 'Another name for a chime or gong: a tuned orchestral set, not one hanging metal bell or a doorbell.'
examples:
- She played the bells in the school orchestra.
- A soft stroke on the bells opened the final movement.
