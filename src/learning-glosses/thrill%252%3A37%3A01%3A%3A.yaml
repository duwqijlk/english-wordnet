simpleMeaning: to fill a person with a very strong, high feeling
scope: This is the act of making someone feel it, not the act of feeling it yourself and not the thing
  that brings the feeling.
examples:
- The news thrilled the children at the thought of going to the movies.
- Her great win thrilled the whole town, and people cheered in the streets.
