simpleMeaning: to move something or oneself with force, energy, or without care.
scope: This is not the usual sense of sending an object through the air toward a target; it emphasizes
  forceful, energetic, or careless movement.
examples:
- She threw her bag onto the floor and collapsed into a chair.
- He threw himself into the cold water.
