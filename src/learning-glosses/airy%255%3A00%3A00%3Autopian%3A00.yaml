simpleMeaning: not based on what can be done or made real, but on guesses and hopes
scope: 'Also called windy: an idea built on guesses and hopes, not on what can be done, not a light, thin
  feeling like air.'
examples:
- They laughed at his airy theories about getting rich.
- Her airy schemes for saving the town never got past talk.
