simpleMeaning: the quality of deserving to be believed in and relied on
scope: The quality of deserving to be believed in and relied on, not one honest act on its own and not
  a feeling on its own.
examples:
- Her trustworthiness made everyone happy to leave money in her care.
- Years of honest work proved the bank's trustworthiness.
