simpleMeaning: Someone who wants the law to give the unborn full safety and to keep induced abortion against
  the law.
scope: The word is used for a person who backs full legal safety for the unborn and stands against legalized
  induced abortion.
examples:
- The pro-lifer wants induced abortion to stay against the law.
- Many pro-lifers back full legal safety for the unborn.
