simpleMeaning: A nocturnal tree-dwelling primate of Indonesia and the Philippines with huge eyes and padded
  digits for climbing; alone among primates it eats no plants, only insects and small vertebrates.
scope: A small big-eyed primate of Indonesian and Philippine forests that feeds at night. It is not a
  lemur or a bush baby, the similar nocturnal primates of Madagascar and Africa.
examples:
- A tarsier clings upright to a thin branch, its huge eyes fixed on a moth.
- Visitors on the island come at dusk to watch tarsiers leave their sleeping places.
