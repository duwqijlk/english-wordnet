simpleMeaning: a statement made by turning another statement around, so what was first becomes last and
  what was last becomes first
scope: A statement got by turning another statement around, not words that reverse each other's relation
  and not talking with someone.
examples:
- The converse of 'all cats are animals' is 'all animals are cats'.
- In logic class, they asked us to write the converse of the statement.
