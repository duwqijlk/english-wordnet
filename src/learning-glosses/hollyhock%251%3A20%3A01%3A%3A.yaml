simpleMeaning: A tall plant of the group called Alcea, from the Middle East but now found in many places,
  grown for its very large flowers of many colours.
scope: A tall plant of the genus Alcea, not the like plant of the genus Althaea, whose flowers are smaller.
examples:
- Hollyhocks lined the cottage wall, their tall stems full of pink flowers.
- She grew hollyhocks from seed for the back of the border.
