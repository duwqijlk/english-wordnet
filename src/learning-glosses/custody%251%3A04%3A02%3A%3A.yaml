simpleMeaning: the right to look after a person or thing, and in a divorce case the right to house a child,
  care for them, and make them follow the rules
scope: 'Also called hands: the right to look after someone, and in a divorce case a child, not the act
  of holding someone in a police cell.'
examples:
- The mother was awarded custody of the children.
- Your guests are now in my custody.
