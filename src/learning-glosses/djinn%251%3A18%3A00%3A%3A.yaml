simpleMeaning: In Islam, an unseen spirit named in the Koran that Muslims believe lives on earth and works
  on people by taking the shape of a person or an animal
scope: 'Also called jinnee, genie, djinni, djinny, and jinni: in Islam this is an unseen spirit that lives
  on earth, not an angel and not a god.'
examples:
- In the story, a djinn took the shape of an old man to speak to the travellers.
- The people in the tale believed a djinn lived in the empty house and could work on those who went inside.
