simpleMeaning: Any fruit of a plant of the nightshade family, above all of the kinds Solanum, Capsicum
  and Lycopersicon
scope: Any fruit of a plant of the nightshade family, above all of the kinds Solanum, Capsicum and Lycopersicon;
  not a leafy green, and not a root crop.
examples:
- Tomatoes and peppers are solanaceous vegetables.
- Aubergines are solanaceous vegetables, like tomatoes.
