senseId: 'tragically%4:02:00::'
synsetId: 00238709-r
simpleMeaning: in a way that is very sad and ends with very bad results
scope: It tells how a thing happens or ends, in a very sad way with bad results, not a sad play and not
  a sad event itself.
examples:
- The trip ended tragically when their car hit a tree.
- Tragically, the young singer died in a fire.
