simpleMeaning: the act of holding another person in your arms, as when you say hello or show love
scope: The act of holding someone in your arms to say hello or show love, not a warm and loving way of
  welcoming new ideas or people, and not including something as part of a larger thing.
examples:
- She gave her old friend a warm embrace at the door.
- Their embrace lasted a long time after they met again.
