simpleMeaning: All the skills and marks a maker uses to say something through a craft or an art.
scope: The set of skills and marks used to say things in an art or craft, not the list of words a person
  knows.
examples:
- He introduced a wide vocabulary of techniques.
- Her vocabulary of shapes and colours grew with each new picture.
