simpleMeaning: a soft part fixed to the top of the back of a car seat to help stop neck injury in a crash
scope: A soft support on a car seat for the head, not a pillow for sleeping and not the main back of the
  seat.
examples:
- She raised the headrest so it supported her head.
- The car's headrest kept his neck safer in the crash.
