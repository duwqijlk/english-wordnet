simpleMeaning: a small knife that fits in a pocket, with a blade that jumps open when you press a button
scope: A small knife for a pocket whose blade opens when you press a button; not a pocket knife you open
  by hand, and not a large kitchen knife.
examples:
- He pressed the button and the switchblade opened at once.
- The switchblade fits in his pocket, and its blade jumps out when the button is pressed.
