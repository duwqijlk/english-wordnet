simpleMeaning: in a way that shows a mind that is very ill and not thinking or acting in a normal way
scope: This describes how a person acts when their mind is very ill; it does not mean simply very or in
  a very strong way.
examples:
- He laughed insanely and talked to people who were not there.
- She behaved insanely after she stopped taking her medicine.
