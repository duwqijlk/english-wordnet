simpleMeaning: a person who makes a long hard trip, such as a walk through high rough land
scope: This is a person who makes a long hard trip on foot; not a person on a short walk and not a person
  who travels by car.
examples:
- The trekker crossed the high pass after three days of walking.
- Every trekker in the group carried food and a tent.
