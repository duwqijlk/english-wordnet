simpleMeaning: Tough stuff in sheets, smooth and light brown, made from a plant fibre such as hemp, in
  the form of strong sheets or thin cardboard.
scope: Also called manila, manilla, and manilla paper, it is strong, smooth stuff in sheets, light brown,
  made from a plant fibre.
examples:
- He wrote the address on a sheet of manila paper.
- The manila paper tore only when he pulled it hard.
