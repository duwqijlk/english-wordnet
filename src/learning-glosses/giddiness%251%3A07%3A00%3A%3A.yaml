simpleMeaning: a way of acting without thinking first and not being able to keep your mind on one thing
  for long
scope: 'Also called silliness: this is a silly, thoughtless way of acting, not the feeling that your head
  is turning and you may fall.'
examples:
- Her giddiness made her laugh and talk fast and forget what she was doing.
- In his giddiness, he kept starting new jobs and finishing none of them.
