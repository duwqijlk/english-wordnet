synsetId: 01661889-v
simpleMeaning: Take apart a structure that was put up only for a short time, such as a tent or a stage
  set.
scope: This is taking a tent or stage set apart after use, not crossing words out of a text and not forming
  coins with a stamp.
examples:
- After the final show, the crew struck the set.
- We struck the tents at dawn and moved on.
