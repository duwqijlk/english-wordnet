simpleMeaning: a thing the body learns to do when a set sign shows up first
scope: This is a thing the body learns to do when a set sign shows up first; acquired reflex, conditional
  reaction, conditional response, conditioned reaction, conditioned reflex and conditioned response are
  other names for this sense, not a born-in act that needs no sign.
examples:
- The rat's conditional reflex fired as soon as the light came on.
- His conditional reflex to the tone grew stronger with each trial.
