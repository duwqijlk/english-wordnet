simpleMeaning: A deed-cure course for fear and other worry-bound deed ills, with the cared-for one facing
  what is feared at ease till the worry dies out.
scope: This sense is also called desensitisation procedure, desensitisation technique, desensitization
  procedure, desensitization technique, and systematic desensitisation.
examples:
- Systematic desensitization treats fears.
- A systematic desensitization eased the worry.
