senseId: 'accessory_vertebral_vein%1:08:00::'
synsetId: 05364437-n
simpleMeaning: A vein that runs with the vertebral vein, passes through an opening in the seventh neck
  vertebra's side projection, and empties into a large vein of the upper chest.
scope: A neck vein that follows the vertebral vein but takes a different path; it is not the vertebral
  vein itself.
examples:
- The accessory vertebral vein drains into the brachiocephalic vein.
- During the dissection, the accessory vertebral vein was seen passing through the transverse foramen.
