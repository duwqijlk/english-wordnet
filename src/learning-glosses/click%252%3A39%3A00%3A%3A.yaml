simpleMeaning: to make a short, sharp sound, like a clock going tick by tick
scope: A thing makes a short, sharp sound, like a clock; not a person making a sound with the tongue when
  speaking, and not pressing a mouse button.
examples:
- The old clock clicked softly as its hands moved.
- Her shoes clicked on the hard floor as she walked.
