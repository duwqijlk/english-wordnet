simpleMeaning: especially of ideas or principles, set deep and held very firmly, so they are hard to change
scope: Also called planted and implanted, this describes ideas or principles set deep in the mind and
  held firm, not easily changed.
examples:
- He had an ingrained belief that hard work always leads to success.
- Their ingrained respect for the rules shaped every choice they made.
