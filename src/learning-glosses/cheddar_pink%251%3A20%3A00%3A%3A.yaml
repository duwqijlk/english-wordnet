simpleMeaning: Flowers of a rose colour or red, big and sweet-smelling, grow on a low plant of central
  Europe that spreads out like a mat and lives for many years.
scope: This low plant of central Europe is also called a cheddar pink.
examples:
- The cheddar pinks spread across the ground in a thick mat.
- Her cheddar pink opened a big sweet-smelling flower.
