simpleMeaning: To hand pieces of a thing to people, so each one gets a fair share
scope: This is handing pieces of a thing to people so each gets a fair share; share is another name for
  this sense, not keeping the whole thing for oneself, and not giving a gift with no set share.
examples:
- The cook portioned out the soup to the guests.
- She portioned out the cake among the children.
