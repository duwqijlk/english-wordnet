simpleMeaning: A soft blue-white metal that can be drawn out and hammered flat, joins two other atoms,
  and poisons; it is found with zinc ores
scope: This metal is also called cadmium and atomic number 48; it is not zinc and not another soft metal.
examples:
- Cd is found with zinc ores.
- The battery contained Cd.
