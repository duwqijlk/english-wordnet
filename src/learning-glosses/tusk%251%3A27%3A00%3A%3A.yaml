simpleMeaning: the hard, smooth, cream-white stuff that makes up most of an elephant's or a walrus's long
  pointed teeth
scope: 'Also called ivory: the hard white stuff of an elephant''s or walrus''s teeth, not the tooth itself,
  and not the act of stabbing with it.'
examples:
- The handle was carved from tusk, pale and smooth to the touch.
- Traders once paid a high price for elephant tusk.
