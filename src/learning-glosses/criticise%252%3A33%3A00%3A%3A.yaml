simpleMeaning: to do the work of judging works of art or writing and giving your view on them
scope: 'Also called criticize: this is about judging works and giving your views, not about finding fault
  with a person or a thing in daily life.'
examples:
- She criticises films for a newspaper each week.
- He was asked to criticise the new play in a written review.
