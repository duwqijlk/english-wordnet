simpleMeaning: Tiny rod-shaped germs that stay clear under a certain dye test, most of which live in the
  guts of people and other animals, doing no harm or else causing disease.
scope: Also called enterics and enterobacteria, these are gut germs, not the germs that live on skin or
  in soil.
examples:
- Enteric bacteria live in the human gut.
- Some enteric bacteria cause food poisoning.
