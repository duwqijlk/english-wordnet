synsetId: 92463799-n
simpleMeaning: A switch that stays in place, on or off, for as long as it is left, with no power to hold
  it there
scope: A switch that holds its on or off place with no power to the coil, also called a bistable relay,
  a keep relay or a latching relay; not a switch that needs power to stay on.
examples:
- The impulse relay kept the lights on after the power was cut.
- An impulse relay in the panel holds the circuit either on or off.
