simpleMeaning: This health problem shows in a person who cannot keep feelings in check, acts without thinking,
  and cannot sit still
scope: 'Also called minimal brain damage, attention deficit disorder, attention deficit hyperactivity
  disorder and hyperkinetic syndrome: a health problem that shows in restlessness, quick acts and feelings
  that cannot be kept in check, not a hurt to the head from a blow.'
examples:
- Minimal brain dysfunction can make a pupil restless and quick to act.
- Her minimal brain dysfunction showed in feelings she could not keep in check.
