simpleMeaning: rules made by the government that say how buildings must be built and kept, with ways out
  of a building, so people stay safe when one starts to burn
scope: Government rules for keeping buildings safe from burning, not rules for putting out a fire and
  not the rules of one building alone.
examples:
- The new fire code requires two stairways in every building.
- The hotel was closed because it broke the fire code.
