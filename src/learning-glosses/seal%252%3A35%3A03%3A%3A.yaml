simpleMeaning: to make something tight, so air or liquid cannot get in or out
scope: The verb for closing something tight so nothing gets out, not the thing that closes it and not
  the sea animal or its fur.
examples:
- Seal the windows before the cold winter comes.
- She sealed the bag so the water would not get in.
