simpleMeaning: An important fish that people eat, living in the Arctic and in cold waters that are not
  the coldest
scope: This is the whole fish that lives in cold seas, not its white flesh as food, not the plant part
  that holds seeds, and not the sense that means paid for when you get something.
examples:
- We bought a fresh cod at the market for dinner.
- Cod live in the cold seas of the north.
