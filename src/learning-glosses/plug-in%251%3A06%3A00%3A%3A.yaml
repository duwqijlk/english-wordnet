simpleMeaning: A computer gains new powers from a flat piece with printed paths that fits one of its spare
  slots.
scope: A card, a board, an add-in, a circuit board, and a circuit card are all other names for it, and
  unlike the software module of the same name, it is a flat piece with printed paths that fits a spare
  slot of a computer.
examples:
- We put a plug-in in the computer to give it new powers.
- The plug-in fits into an expansion slot in the computer.
