simpleMeaning: a state in which there is little or no noise and people feel calm and at peace
scope: 'Also called quietude: a calm state with little or no noise, not complete silence with no sound
  at all, and not the act of making a place calm.'
examples:
- She loved the quietness of the house in the early morning.
- After the storm, a deep quietness fell over the small village.
