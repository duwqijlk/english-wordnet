simpleMeaning: Taken by mouth, this dose holds three kinds of weakened germs, not killed, to guard the
  body against the illness that can leave arms or legs unable to move.
scope: Also called oral poliovirus vaccine, it guards the body against the illness that can leave arms
  or legs unable to move.
examples:
- The trivalent live oral poliomyelitis vaccine protects the body from the illness that can leave legs
  unable to move.
- After the trivalent live oral poliomyelitis vaccine, the body can fight off the illness that can leave
  arms unable to move.
