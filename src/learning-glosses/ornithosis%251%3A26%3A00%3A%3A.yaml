simpleMeaning: Passed to people from sick birds, this lung illness not of the usual kind is brought on
  by a tiny germ.
scope: People also call it parrot fever and psittacosis; it is a lung illness not of the usual kind, passed
  to people from sick birds.
examples:
- Ornithosis spread from sick birds to people.
- She caught ornithosis from an infected bird.
