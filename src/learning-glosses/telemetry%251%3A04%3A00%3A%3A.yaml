simpleMeaning: the automatic sending and measuring of facts from far-away places by wire, radio, or other
  ways
scope: The automatic sending and measuring of facts from far away, not a radio broadcast and not a report
  made by hand.
examples:
- Telemetry from the satellite told the team how hot the craft was.
- The hospital used telemetry to watch the patient's heart from another room.
