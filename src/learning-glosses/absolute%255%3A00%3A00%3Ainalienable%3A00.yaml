senseId: absolute%5:00:00:inalienable:00
synsetId: 00094922-s
simpleMeaning: So binding that it cannot be broken or encroached upon.
scope: 'Another name for inviolable and infrangible: a binding quality that cannot be broken, not ''complete
  and unrestricted'', ''final and unchangeable'', or ''not limited by law''.'
examples:
- The charter recognizes an absolute right to clean water that no government may remove.
- Her claim to the estate was absolute, and no court could overturn it.
