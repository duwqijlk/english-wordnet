simpleMeaning: A person whose faith goes against the set teaching of the Roman Catholic Church.
scope: 'Also called heretic or misbeliever: a person whose faith goes against the set teaching of the
  Roman Catholic Church, not a person who has left the Church, a person with no faith at all, or a person
  shut out as a punishment who still holds the faith.'
examples:
- The religious outcast was shut out by his village.
- She lived as a religious outcast after she spoke against the Church.
