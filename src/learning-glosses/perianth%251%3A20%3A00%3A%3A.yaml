simpleMeaning: A flower's cup and petals, with the pollen stalks and seed cases held inside them, are
  together called by this one name.
scope: 'Also called chlamys, floral envelope, perigone, and perigonium: the name for all the outer parts
  of a flower together, not one part alone.'
examples:
- The perianth wraps round the stamens and pistils of the flower.
- Petals and sepals together make up the perianth.
