simpleMeaning: lower in standing than other things of its kind, and worth less in people's eyes
scope: Of low rank or standing, not a small printed mark and not a planet's path around the sun.
examples:
- He held an inferior post in the firm, with little say in what was done.
- An inferior grade of cloth wears out fast and soon looks shabby.
