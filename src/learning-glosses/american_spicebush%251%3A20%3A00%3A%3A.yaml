simpleMeaning: A shrub of the eastern United States that loses its leaves each year, with strongly scented
  leaves and bark, yellow flowers, and then scarlet or yellow berries.
scope: This is a shrub with strongly scented leaves and bark and yellow flowers, also called spice bush,
  spicebush, Benjamin bush, Benzoin odoriferum and Lindera benzoin; not a tall tree and not a plant grown
  for its fruit.
examples:
- The American spicebush filled the air with scent from its leaves.
- Yellow flowers covered the American spicebush in spring.
