simpleMeaning: a request from the company that made a product that has a fault, asking people to send
  the product back so it can be fixed or replaced
scope: This is a maker asking for a faulty product to be sent back, not remembering something and not
  a horn call for soldiers.
examples:
- The car company issued a recall for cars with faulty brakes.
- A recall asked owners to return the toys for repair.
