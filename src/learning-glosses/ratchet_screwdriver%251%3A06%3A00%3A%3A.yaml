simpleMeaning: Push down on the handle and the tip turns, but only one way, because a toothed wheel inside
  stops it turning back.
scope: Also called a spiral ratchet screwdriver, it is a hand tool whose tip turns only one way when you
  push down on the handle.
examples:
- The ratchet screwdriver turned the screw when pushed down.
- With the ratchet screwdriver, the tip would not turn back.
