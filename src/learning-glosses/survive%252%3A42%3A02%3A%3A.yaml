simpleMeaning: To still be around after something bad happens, such as an illness or a hardship.
scope: This is about still being around after a hardship; come through, make it, pull round and pull through
  are other names for this sense. Not merely staying alive, and not living longer than someone else.
examples:
- The company survived the financial crisis.
- She survived a serious car accident.
