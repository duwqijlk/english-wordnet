simpleMeaning: The English county places where law cases were heard, done away with in 1971, replaced
  by Crown places for hearing them
scope: These are the county places in England where law cases were heard, done away with in 1971; assizes
  and court of assize are other names for them; not the Crown places that replaced them.
examples:
- The case was heard at the court of assize and nisi prius in York.
- Before 1971, the court of assize and nisi prius tried the most serious crimes in the county.
