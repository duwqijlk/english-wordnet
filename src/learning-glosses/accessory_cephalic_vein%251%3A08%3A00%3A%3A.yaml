simpleMeaning: Near the elbow, this blood tube joins the main arm tube, after running along the thumb
  side of the lower arm.
scope: 'Another name for this sense is vena cephalica accessoria: the blood tube that runs along the thumb
  side of the lower arm to meet the main arm tube near the elbow.'
examples:
- The accessory cephalic vein runs along the thumb side of her forearm.
- Surgeons traced the accessory cephalic vein to where it joins the cephalic vein near the elbow.
