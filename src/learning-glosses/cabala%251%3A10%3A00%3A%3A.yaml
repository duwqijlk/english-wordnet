simpleMeaning: A secret matter of hidden lore, like the Jewish Kabbalah, kept from most people.
scope: A secret matter of hidden lore like the Kabbalah, also called cabbala, cabbalah, kabala, kabbala
  and kabbalah; not the Kabbalah itself and not a public teaching.
examples:
- He studied the cabala in secret for years.
- The cabala was known only to a few.
