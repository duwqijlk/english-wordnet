simpleMeaning: a sharp sense for noticing things, like a sense organ that picks up touch or taste
scope: A keen feel for what is going on, not an insect's feelers and not a device that sends radio signals.
examples:
- She had a fine antenna for what the public wanted.
- His antenna for trouble warned him before the meeting turned sour.
