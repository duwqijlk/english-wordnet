simpleMeaning: A drug for schizophrenia, a severe mental illness, used when other drugs do not help; it
  also calms people down and has few side effects.
scope: A drug for schizophrenia that does not respond to other drugs, also called clozapine; it also works
  as a sedative, and it is known to have few side effects.
examples:
- The doctor prescribed Clozaril when other drugs did not help his schizophrenia.
- Clozaril calmed her down and caused few side effects.
