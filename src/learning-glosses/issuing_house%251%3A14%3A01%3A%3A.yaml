simpleMeaning: A bank or money firm that lists, hands out, and sells a security, such as a share or bond,
  at its first sale for another company
scope: A bank or money firm that sells a new security for another company, not a plain issuer and not
  a bank that lends money.
examples:
- The issuing house sold the new shares for the small firm.
- An issuing house lists the shares before the first sale.
