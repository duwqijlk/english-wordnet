simpleMeaning: an action done to get away from a person you are fighting against
scope: Also called maneuver. This is an action to get away from a person you are fighting against, not
  a skilled move in general and not moving soldiers or ships in war.
examples:
- His quick manoeuvre left his opponent unable to catch him.
- The boxer's last manoeuvre helped him get away from a hard punch.
