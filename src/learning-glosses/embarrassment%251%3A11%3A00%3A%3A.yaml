simpleMeaning: an event that makes a person feel shame
scope: This sense is an event that causes shame, not the feeling of shame itself and not a state of having
  money problems.
examples:
- Losing the vote was a big embarrassment for the party leaders.
- The broken microphone at the start of his talk was an embarrassment for the school.
