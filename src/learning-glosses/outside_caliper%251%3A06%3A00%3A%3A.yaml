simpleMeaning: A tool for measuring the outer size of a thing, with two arms whose tips bend in.
scope: A tool for measuring outer size; not a tool for measuring inner size and not a ruler.
examples:
- He used the outside caliper to check the width of the pipe.
- The outside caliper showed the rod was too thick.
