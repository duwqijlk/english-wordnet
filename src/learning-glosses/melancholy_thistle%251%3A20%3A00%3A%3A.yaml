simpleMeaning: a plant that lives for years and spreads by stems that creep, from northern Europe, with
  long narrow leaves at the base and, usually, single heads of reddish-purple flowers
scope: A thistle from northern Europe with narrow leaves at the base and usually single reddish-purple
  flower heads; not a common thistle and not a garden flower grown for show.
examples:
- Melancholy thistle grows along the edge of the north field.
- We found a melancholy thistle with one reddish-purple flower head by the path.
