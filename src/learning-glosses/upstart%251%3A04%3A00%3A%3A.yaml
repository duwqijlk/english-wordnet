simpleMeaning: 'a gymnastics exercise: you start with legs over your upper body, curve your back, swing
  your legs out and down, and push your chest up straight'
scope: 'Also called kip: a gymnastics move that ends with the body up straight. It is not a person who
  has suddenly got more money or a higher place in society, and not a word that describes such a person.'
examples:
- She did an upstart on the bars and ended with her body up straight above the bar.
- The gymnast learned the upstart by curving her back and pushing her chest up.
