simpleMeaning: a strong will to keep working at a task until it is done, and not give up
scope: 'Also called industry, and another name for it is industriousness: the will to keep working hard
  at a task, not one single hard effort.'
examples:
- Her diligence in studying helped her pass the hard test.
- With diligence and care, he finished the long report on time.
