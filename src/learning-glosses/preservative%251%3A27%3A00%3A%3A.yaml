synsetId: 15022096-n
simpleMeaning: a chemical added to things to help keep them from going bad or breaking down
scope: This is the noun for the chemical itself, added to help keep things from going bad; not the adjective
  for something that can keep things from going bad.
examples:
- This jam has no preservative in it, so keep it in the fridge.
- They added a preservative to the wood to stop it rotting.
