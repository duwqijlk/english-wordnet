simpleMeaning: A sharp point fixed to a rider's heel, used to press a horse and make it move on
scope: This is the sharp point on a rider's heel that presses a horse on, not the tube-shaped part at
  the foot of a flower and not any pointed part that sticks out.
examples:
- The cowboy dug his spurs into the horse's sides.
- He wore spurs on his boots for the ride.
