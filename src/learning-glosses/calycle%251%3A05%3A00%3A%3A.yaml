simpleMeaning: A taste bud, the cup in the eye, or the hollow in a coral that holds a polyp is one of
  these small cup-like parts of a living thing.
scope: Also called caliculus and calyculus, this names a small cup-like part of a living thing, not a
  ring of leaf-like parts that looks like the outer part of a flower.
examples:
- The calycle in the coral held a small polyp.
- They found a calycle on the tongue.
