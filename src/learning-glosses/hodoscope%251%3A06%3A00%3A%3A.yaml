simpleMeaning: In physics, a tool that follows the path of a tiny bit of matter carrying an electric charge.
scope: In physics, a tool that follows the path of a charged bit of matter, not a cloud chamber and not
  a counter that only clicks when a bit passes.
examples:
- The hodoscope traced the path of the charged bit.
- Physicists used a hodoscope to follow the particle.
