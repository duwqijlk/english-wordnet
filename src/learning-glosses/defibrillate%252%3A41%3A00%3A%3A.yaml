simpleMeaning: To stop the fast, uneven beating of the heart and bring back its normal beat, usually with
  electric shocks.
scope: Used of stopping fibrillation and restoring normal contractions, usually by electric shocks.
examples:
- The patient's heart had to be defibrillated to save their life.
- The doctors defibrillated the patient twice before the heart steadied.
