simpleMeaning: A deal that gives top bosses big money benefits, which the buyer of a firm must pay if
  the bosses lose their jobs after a takeover.
scope: A deal giving top bosses big money if they lose their jobs after a takeover, not a golden handshake
  for retiring and not a normal pay deal.
examples:
- The chief's golden parachute paid out millions after the takeover.
- Her golden parachute gave her three years' pay when the firm was sold.
