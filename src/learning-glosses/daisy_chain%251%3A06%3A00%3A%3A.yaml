simpleMeaning: Students wear this string of flowers, joined stem to stem, on class day at some schools.
scope: This is a string of flowers linked by their stems, worn by students on class day, not loose flowers
  and not a flower for any ordinary day.
examples:
- The students wore a daisy chain on class day.
- She linked the daisies into a daisy chain by their stems.
