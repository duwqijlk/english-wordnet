simpleMeaning: The punctuation mark ? that comes at the end of a sentence to show a question.
scope: The mark ? at the end of a sentence, also called question mark; not a full stop and not a mark
  inside a sentence.
examples:
- Put an interrogation point at the end of the question.
- The interrogation point tells the reader that the sentence asks something.
