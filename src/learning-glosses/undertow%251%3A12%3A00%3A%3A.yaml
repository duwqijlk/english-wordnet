senseId: 'undertow%1:12:00::'
synsetId: 07514688-n
simpleMeaning: a feeling that goes against the main and strongest feeling
scope: This sense is about a feeling that runs against the main feeling. It is not the real flow of water
  at the sea that moves out after waves break.
examples:
- His cheerful account had a quiet undertow of regret.
- There was an undertow of fear beneath her calm words.
