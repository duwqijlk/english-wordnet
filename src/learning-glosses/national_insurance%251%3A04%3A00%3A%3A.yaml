simpleMeaning: In Britain, a state plan paid for by bosses and workers, giving money to people out of
  work, sick, or retired, and giving medical care.
scope: In Britain, a state plan paid for by bosses and workers, not a private plan and not a tax.
examples:
- National insurance pays for her medical care.
- He paid national insurance from his wages.
