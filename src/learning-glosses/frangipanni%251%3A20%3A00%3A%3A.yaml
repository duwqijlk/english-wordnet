simpleMeaning: A deciduous tropical American shrub or small tree with milky sap and funnel-shaped, sweet-smelling
  flowers in various colors.
scope: The same tropical tree under an older spelling of frangipani; not frangipane, the almond pastry,
  and not the borrowed perfume name.
examples:
- Frangipanni trees shade the terrace where guests eat breakfast.
- He planted a frangipanni near the pool, where its scent drifts in the evening.
