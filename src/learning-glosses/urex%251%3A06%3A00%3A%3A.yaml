simpleMeaning: A germ-killing chemical found in many products used to treat infections of the urinary
  tract
scope: A germ-killing chemical in many products for urinary infections, also called methenamine and Mandelamine;
  not a germ-killing chemical for skin wounds and not a drug that kills viruses.
examples:
- The doctor gave her Urex for a urinary infection.
- Urex is found in many products that treat bladder infections.
