simpleMeaning: wind that blows against the way a ship or a plane is moving
scope: Wind that blows against the way a ship or plane moves, not wind that blows the same way and pushes
  it along.
examples:
- The plane flew slowly because of a strong headwind.
- A headwind made the ship's trip take much longer.
