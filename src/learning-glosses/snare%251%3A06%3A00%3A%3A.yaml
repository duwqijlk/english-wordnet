simpleMeaning: a trap for birds or small mammals, often made with a loop of rope that pulls tight round
  what it catches
scope: 'Also called a gin or a noose: a trap for birds or small animals, not the strings on a drum, not
  the drum itself, not a trick that catches you by surprise, and not the surgeon''s wire loop.'
examples:
- The hunter set a snare near the rabbit run.
- A rabbit was caught in the snare by its leg.
