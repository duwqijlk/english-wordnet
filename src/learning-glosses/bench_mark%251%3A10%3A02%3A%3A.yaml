simpleMeaning: Land measurers cut or fix this sign on a lasting thing whose height and place are already
  known, and use it as a fixed point to check other measures.
scope: Also called benchmark, this sign on a lasting thing whose height and place are known is used by
  land measurers as a fixed point.
examples:
- The bench mark on the stone gave the height of the ground.
- They checked the new bench mark against the old one.
