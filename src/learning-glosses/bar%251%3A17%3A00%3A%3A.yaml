simpleMeaning: a long raised bank lying just beneath or partly beneath the surface of a river or near
  the shore
scope: 'The river or coastal landform sense: a natural ridge under water, not a metal or wooden pole,
  solid block, counter, pressure unit, or act of blocking.'
examples:
- The boat ran aground on a sand bar near the river mouth.
- At low tide a long bar appeared across the harbour entrance.
