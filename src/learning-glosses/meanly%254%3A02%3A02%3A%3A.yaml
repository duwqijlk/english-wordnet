simpleMeaning: in a very shameful way, with no honor
scope: This sense, also called basely, is about acting in a shameful way with no honor; it is not about
  doing something poorly or in an angry, unkind way.
examples:
- He acted meanly, taking praise for work he had not done.
- She meanly sold her friend's secret for money.
