simpleMeaning: the hold that stops a thing from sliding as it moves over a surface, such as a car tire
  on a road
scope: 'Also called grip: the hold of a tire or wheel on a road, not the act of pulling on a bone or arm
  to help it heal.'
examples:
- The tires lost traction on the wet road.
- Good traction helps the car go up a snowy hill without sliding.
