simpleMeaning: A measure of how spread out a set of numbers is, worked out as the gap between the upper
  and lower quarter marks.
scope: A measure of how spread out a set of numbers is, worked out as the gap between the upper and lower
  quarter marks, also called an interquartile range or a middle fifty; not the full range from lowest
  to highest and not the average.
examples:
- The midspread of the data was 3.5.
- To find the midspread, take the gap between the upper and lower quarter marks.
