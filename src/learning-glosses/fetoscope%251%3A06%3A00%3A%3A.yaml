simpleMeaning: A listening tube set on a pregnant woman's belly to hear the unborn child's heart beat
scope: A listening tube set on a pregnant woman's belly to hear the unborn child's heart beat, also called
  a foetoscope; not a tube used on the chest and not a machine that shows pictures of the child.
examples:
- The nurse used a fetoscope to hear the heart beat.
- With the fetoscope on her belly, the heart beat came through clear.
