simpleMeaning: a system of words, sounds, or signs that people use to communicate.
scope: It is not the special vocabulary of a subject and not a person's style of writing; it is the whole
  system of communication itself.
examples:
- Children learn language quickly when they hear it every day.
- French and Spanish are different languages, but they share some words.
