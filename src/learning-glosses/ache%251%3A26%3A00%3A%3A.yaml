simpleMeaning: a pain that is not sharp, lasts a long time, and is usually fairly strong but not the strongest
scope: A lasting pain that is not sharp. It is not the verb sense of the same word, which means to feel
  such a pain, and it is not a short, sharp pain.
examples:
- He had a dull ache in his back all day.
- The ache in her tooth would not go away.
