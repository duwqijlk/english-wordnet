simpleMeaning: a B vitamin used to treat a blood illness in which the body has too few healthy red blood
  cells
scope: 'Also called antipernicious anemia factor and cobalamin: a B vitamin used to treat a blood illness,
  not other B vitamins used for other ills.'
examples:
- The doctor gave her cyanocobalamin to treat her pernicious anemia.
- Cyanocobalamin is a B vitamin that helps people with pernicious anemia.
