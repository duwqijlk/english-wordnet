simpleMeaning: A large evergreen cone-bearing tree of North Africa and Spain, with flat branches and scale-like
  leaves and hard scented wood; its bark gives a resin used in varnish.
scope: A large evergreen cone-bearing tree, also called sandarac, sandarac tree, and Callitris quadrivalvis;
  not other cone-bearing trees of North Africa and not the pine.
examples:
- Tetraclinis articulata grows in the hills of North Africa.
- Varnish makers use the resin of Tetraclinis articulata.
