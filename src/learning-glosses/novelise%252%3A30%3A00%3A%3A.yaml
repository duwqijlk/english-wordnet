synsetId: 00116427-v
simpleMeaning: To turn something into a long written story, or to write like one.
scope: To turn something into a long written story; novelize is another name for this; not to write a
  story from nothing, and not to turn a story into a film.
examples:
- The author novelised the historical event and sold it as a book.
- She novelised her grandmother's letters into a long family story.
