simpleMeaning: Any of several kinds of small fish like herring that people eat and that are often put
  in tins.
scope: Any of several kinds of small food fish like herring, often put in tins; not the fish that swims
  in huge groups near the coasts of Europe.
examples:
- We ate sardines on toast for lunch.
- A tin of sardines will keep for a long time.
