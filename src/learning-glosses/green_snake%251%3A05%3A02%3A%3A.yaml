simpleMeaning: one of many kinds of colubrid, a big family of thin animals with no legs, that live in
  Africa
scope: One of many kinds of African colubrid, not one of the two North American snakes of the same name
  and not a single kind.
examples:
- We saw a green snake sliding through the grass in the reserve in Kenya.
- The guide said this green snake was one of many kinds found in Africa.
