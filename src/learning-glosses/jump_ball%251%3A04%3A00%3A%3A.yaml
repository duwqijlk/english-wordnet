simpleMeaning: A referee settles a disputed claim by throwing it up between two players, who leap to tap
  it to a teammate, so play can start or start again.
scope: In basketball, it is the toss-up a referee uses when two sides both claim it.
examples:
- The jump ball opened the game.
- The jump ball came after the two sides both claimed it.
