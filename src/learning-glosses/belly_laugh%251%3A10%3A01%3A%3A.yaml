simpleMeaning: a sudden burst of deep, loud, warm sound made when something is very funny
scope: 'Also called a guffaw: a sudden burst of deep, loud sound when something is very funny, not a quiet
  smile and not a short giggle.'
examples:
- His belly laugh filled the room when he heard the joke.
- She let out a belly laugh at the funny story.
