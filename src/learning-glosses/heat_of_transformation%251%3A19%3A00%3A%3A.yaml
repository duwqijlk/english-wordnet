simpleMeaning: Warmth taken in or given out while a thing changes from one state to another, at a fixed
  warmth and pressure.
scope: Warmth taken in or given out while a thing changes from one state to another, also called latent
  heat; not warmth that only melts a solid and not warmth from burning.
examples:
- Steam gives out the heat of transformation as it turns back to water.
- The heat of transformation is taken in or given out at a fixed warmth and pressure.
