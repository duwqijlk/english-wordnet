simpleMeaning: A gilled mushroom with a flat cap, greyish or yellowish brown, with pale gills and a stalk
  that swells toward the foot.
scope: A gilled mushroom with a flat cap and pale gills, not the creamy-capped fungus that stains yellow
  when handled.
examples:
- The Clitocybe clavipes grows in the pine woods.
- Clitocybe clavipes has a flat greyish cap.
