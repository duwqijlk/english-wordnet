simpleMeaning: A plant of cool northern lands that comes back year after year, with jagged leaves and
  bunches of small pale purple and white flowers
scope: 'Also called livelong, orpin, and orpine: a plant of cool northern lands that comes back year after
  year, not a plant that lasts for one year only and not a shrub.'
examples:
