simpleMeaning: a long, narrow boat with a flat bottom, rowed with one oar from the back, long used on
  the canals of Venice
scope: A flat-bottomed boat rowed on the canals of Venice, not the car under an airship and not a low
  freight car.
examples:
- A gondola carried them along the canal.
- The gondolier steered the gondola under the bridge.
