simpleMeaning: Feeling, or making one feel, as if all is turning, and likely to fall
scope: A turning feeling in the head that may make one fall, also called dizzy, not the silly, light-headed
  mood.
examples:
- She felt giddy after spinning round too fast.
- The giddy climb up the cliff made his head swim.
