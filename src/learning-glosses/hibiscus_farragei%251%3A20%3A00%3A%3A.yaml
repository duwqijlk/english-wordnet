simpleMeaning: A shrub of southern and western Australia with whole or shallowly cut toothed leaves and
  purple flowers; sometimes put in the genus with the same name as the plant.
scope: 'Also called bush hibiscus and Radyera farragei: a shrub of southern and western Australia with
  whole or shallowly cut toothed leaves and purple flowers; other Australian shrubs have leaves cut more
  deeply or flowers of other colours.'
examples:
- Hibiscus farragei grows in southern and western Australia with purple flowers.
- The toothed leaves of Hibiscus farragei are whole or only shallowly cut.
