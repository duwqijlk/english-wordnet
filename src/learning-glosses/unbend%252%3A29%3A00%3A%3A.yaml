simpleMeaning: to let the mind stop feeling stress, tightness or the need to be formal and serious
scope: This is about freeing the mind from stress or formality, not about becoming calm and resting yourself,
  and not about taking a sail off a ship.
examples:
- After the long meeting, he tried to unbend his mind by taking a quiet walk.
- She unbent her mind from its worries by listening to soft music.
