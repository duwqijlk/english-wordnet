simpleMeaning: What a person says or writes seems true, so people can trust it.
scope: Seeming to deserve to be believed or accepted; not a person who believes things too easily, which
  is the wrong use of the word.
examples:
- She was a credible witness in the trial.
- The report gave a credible account of what had happened.
