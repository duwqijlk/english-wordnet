simpleMeaning: With long thin heads of white or pale purple flowers, one of many plants of a group called
  Limonium, growing in mild lands in salty wet ground by the coast
scope: Marsh rosemary and statice are other names for this plant of salty marsh ground, with white or
  pale purple flower heads.
examples:
- Sea lavender grew in the salt marsh with white flowers.
- The sea lavender in the marsh had pale purple flowers on its spikes.
