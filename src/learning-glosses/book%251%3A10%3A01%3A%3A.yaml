simpleMeaning: The written text of a play or other work for the stage, used in getting a performance ready.
scope: This is the script of a play or show, not a printed work for reading or a joined set of tickets.
examples:
- The director went back to the book during rehearsals.
- The musical's book was rewritten before it opened.
