simpleMeaning: a rope used by a person whose job is to hang people who must die in this way by order of
  a court
scope: 'Also called halter, hangman''s halter, hangman''s rope, and hempen necktie: this is the rope used
  for hanging a person. It is not the hemp plant that gives strong fibres and drugs.'
examples:
- The hangman tested the hemp before the hanging.
- In the old story, the condemned man feared the hemp that would hang him.
