simpleMeaning: how good something is because it meets the rules people agree on
scope: Also called acceptability; how good a thing is because it meets agreed rules, not the act of saying
  yes to it and not how much people like it.
examples:
- The acceptableness of the plan depended on whether it met the safety rules.
- They judged the acceptableness of his work by the standards of the trade.
