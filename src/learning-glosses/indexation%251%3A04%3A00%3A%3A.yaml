simpleMeaning: In economics, a way of tying pay and interest to the cost of living, so that rising prices
  hurt less.
scope: A way of tying pay and interest to the cost of living, not rising prices themselves and not a rise
  in pay on its own.
examples:
- The country used indexation to protect wages.
- Indexation ties pensions to the cost of living.
