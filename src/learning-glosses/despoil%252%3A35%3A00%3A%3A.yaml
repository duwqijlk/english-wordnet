simpleMeaning: to wreck something and take away everything it has
scope: 'Also called rape, spoil, plunder, and violate: to wreck a place and take away all it has. It is
  not just stealing goods without wrecking the place, which is the other sense of this word in this batch.'
examples:
- The raiders despoiled the palace, breaking its statues and taking all its gold.
- The invading army despoiled the town, smashing homes and carrying off its treasures.
