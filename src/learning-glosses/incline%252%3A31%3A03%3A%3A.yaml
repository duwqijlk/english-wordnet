senseId: 'incline%2:31:03::'
synsetId: 00682760-v
simpleMeaning: to make someone ready to accept a new way of thinking or feeling, or a new belief, and
  ready to do something
scope: 'Also called dispose: to make someone willing, not to tend to do something yourself, not to bend
  the head, and not a raised area of land.'
examples:
- Their kind words inclined us to trust them.
- What he said inclined her to change her mind.
