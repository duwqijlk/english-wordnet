simpleMeaning: one of the stiff, hollow, sharp points on a porcupine or hedgehog that keep it safe
scope: This is the sharp point on a porcupine or hedgehog, not a large wing or tail feather of a bird
  and not a pen made from a feather.
examples:
- The porcupine raised its quills when the dog came close.
- One quill from the hedgehog was stuck in his glove.
