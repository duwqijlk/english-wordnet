simpleMeaning: The old dialects of Langue d'oc, the tongue of southern France in the Middle Ages.
scope: Also called Langue d'oc, Langue d'oc French, Old Occitan, and Provencal; the old dialects of southern
  France in the Middle Ages, not the living Romance tongue of the same region.
examples:
- Occitan was spoken in the south of France long ago.
- The old songs were written in Occitan.
