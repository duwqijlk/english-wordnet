simpleMeaning: This word is used of things that centre on Europe and the Europeans.
scope: 'The same sense as Eurocentric: things centred on Europe and the Europeans, not things centred
  on other lands.'
examples:
- His Europocentric view of history left out the rest of the world.
- The book takes a Europocentric view, putting Europe at the centre of every story.
