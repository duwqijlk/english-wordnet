simpleMeaning: a way of Christian teaching about God, shaped by South American Roman Catholics, that puts
  winning social and political freedom first as a sign of the final saving of souls
scope: A Christian way of thinking that puts freedom from unfair rule first, not a church service and
  not a political party's plan.
examples:
- Liberation theology grew among Catholics in South America.
- He wrote about liberation theology and its call for freedom from unfair rule.
