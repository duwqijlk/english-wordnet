simpleMeaning: In ancient Rome, a loose robe worn by a young man as a sign that he was a grown man and
  a citizen
scope: In ancient Rome, a robe worn by a young man as a sign of manhood and citizenship, not a robe worn
  by a child and not a soldier's cloak.
examples:
- He put on the toga virilis at sixteen.
- The toga virilis marked him as a citizen of Rome.
