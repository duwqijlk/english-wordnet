simpleMeaning: the condition of being young or not yet fully grown or experienced
scope: This is the condition of being young and not yet experienced, not the energy that comes with it,
  and not the period of life between childhood and adulthood.
examples:
- They forgave him because of his youth.
- His youth and inexperience showed in the way he answered.
