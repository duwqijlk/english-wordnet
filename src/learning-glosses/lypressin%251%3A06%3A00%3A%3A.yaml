simpleMeaning: Used for a sickness in which the body passes far too much water, this drug tightens the
  blood tubes and cuts down the water the body passes
scope: A drug that cuts down the water the body passes and tightens the blood tubes, not a drug that makes
  the body pass more water and not a drug for the common sugar sickness.
examples:
- The doctor gave him lypressin for his diabetes insipidus.
- Lypressin helped cut down how often she had to pass water.
