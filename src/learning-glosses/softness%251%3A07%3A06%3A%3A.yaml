simpleMeaning: a look in which the light is low and quiet, with no bright shine or hard glare
scope: A low, quiet look of light with no bright shine or hard glare, not a gentle manner and not a blurred
  outline.
examples:
- The softness of the morning sky made the whole field look calm.
- We liked the softness of the lamplight in the small room.
