senseId: ko'd%5:00:00:unconscious:00
synsetId: 00574990-s
simpleMeaning: This word marks a person hit so hard that they cannot wake up.
scope: Also called out, stunned, kayoed, and knocked out, this word marks a person hit so hard that they
  cannot wake up, not a person who is merely asleep.
examples:
- The boxer was KO'd in the third round.
- One hard punch left him KO'd on the canvas.
