simpleMeaning: Out at dusk or by night, a shore bird of the Old World and warm parts of America has a
  big head and eyes, and a swollen leg joint.
scope: A shore bird also called stone curlew, known by its big head, big eyes and swollen leg joint.
examples:
- The thick-knee stood still on the shore at dusk.
- We saw a thick-knee with its big eyes open in the dark.
