simpleMeaning: Someone a group will not have among them or let in, for some reason
scope: This is someone a group will not have among them or let in, for some reason, not a welcome guest
  and not simply a stranger.
examples:
- After the scandal he became persona non grata at the club.
- The envoy was declared persona non grata and told to leave.
