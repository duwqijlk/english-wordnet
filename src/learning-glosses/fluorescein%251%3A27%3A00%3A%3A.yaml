senseId: 'fluorescein%1:27:00::'
synsetId: 15012254-n
simpleMeaning: A yellow dye visible even when greatly diluted; it acts as an indicator when silver nitrate
  is added to sodium chloride, turning pink once no chloride ions remain.
scope: This is the particular yellow indicator compound used in silver nitrate and sodium chloride tests,
  not any dye that glows under ultraviolet light.
examples:
- Even a trace of fluorescein gives the water a bright yellow color.
- The fluorescein turned pink as soon as no chloride ions remained in the solution.
