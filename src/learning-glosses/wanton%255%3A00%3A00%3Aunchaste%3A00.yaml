simpleMeaning: treating sex in a light way, not serious about it, and with no holding back
scope: Also called light, easy, loose, promiscuous and sluttish. It is about sex with no holding back,
  not about an act done for no reason and not about cruel acts.
examples:
- The story tells of a wanton woman who took many lovers.
- He led a wanton life, moving from lover to lover.
