simpleMeaning: An oil drawn from the flowers of the tree of the same name and used to make scents.
scope: An oil drawn from the flowers of the tree of the same name and used to make scents, not the tree
  itself and not an oil for cooking.
examples:
- A drop of ilang-ilang oil made the room smell sweet.
- The maker added ilang-ilang to the scent to give it a sweet smell.
