senseId: 'force%2:32:00::'
synsetId: 00749422-v
simpleMeaning: make someone accept something by pressing them hard and refusing to let up.
scope: This is not physical shoving, squeezing into a space, or pushing someone into an action or state;
  it is imposing demands or views with relentless pressure.
examples:
- He forced his opinions on everyone at the dinner table.
- The government forced the new rules on small businesses with no consultation.
