simpleMeaning: to hit someone hard again and again with a whip or a thin stick
scope: 'Also called whip, lash, and strap: to hit someone hard again and again with a whip or a thin stick,
  not to cut with sweeping strokes and not a hard wide cut.'
examples:
- He was slashed with a whip for stealing.
- The guards slashed the prisoners with rods.
