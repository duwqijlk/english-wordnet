simpleMeaning: A large black-and-white vulture of South and Central America, with bright wattles and wart-like
  lumps on its head and neck.
scope: Also called a king vulture; a large black-and-white vulture of South and Central America, not a
  small vulture and not a bird of the Old World.
examples:
