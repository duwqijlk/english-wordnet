simpleMeaning: A large branching plant living two years, from Eurasia and Africa, now in North America,
  with large fern-like leaves and white flowers; usually in damp places, every part extremely poisonous.
scope: A large plant with fern-like leaves and white flowers, every part extremely poisonous, also called
  hemlock, poison hemlock, poison parsley, winter fern, California fern or Nebraska fern.
examples:
- The Conium maculatum grew thick along the damp ditch.
- 'Do not touch Conium maculatum: every part of it is very poisonous.'
