simpleMeaning: a night spent with a dead body, keeping watch over it until the burial the next day
scope: 'Another name for a wake: a night of watching over a dead body before burial, not the act of looking
  at something.'
examples:
- The family held a viewing at the funeral home the night before the burial.
- Friends came to the viewing to sit with the body through the night.
