simpleMeaning: A one-year Old World plant with heart-shaped leaves and large seeds with short greyish
  lint that is hard to take off; considered an early form of today's short-fibre cottons.
scope: Also called Levant cotton; a one-year Old World plant with heart-shaped leaves, whose large seeds
  carry short grey lint that is hard to take off.
examples:
- Gossypium herbaceum grew in the field, its heart-shaped leaves wide.
- The Gossypium herbaceum seeds had short grey lint.
