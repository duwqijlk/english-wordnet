simpleMeaning: Coming 12 to 30 times each second, this is the usual brain wave shown on a brain scan of
  a person who is awake and alert.
scope: Beta wave is another name for this brain wave, the usual one in a person who is awake and alert.
examples:
- The beta rhythm showed on the scan while she was awake and alert.
- His beta rhythm ran at 20 times a second.
