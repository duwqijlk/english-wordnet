simpleMeaning: Soft mashed fruit, cooked in water and usually made sweet and spiced.
scope: Soft mashed fruit, cooked and usually made sweet and spiced; applesauce is another name for it,
  and it is not a thin juice and not a raw fruit.
examples:
- She served pork with apple sauce.
- The apple sauce was sweet and spiced.
