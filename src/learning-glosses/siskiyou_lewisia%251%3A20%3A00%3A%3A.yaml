simpleMeaning: An evergreen plant with long leaves in a base ring and pink or striped flower clusters;
  grows on mountain cliffs and rock cracks in southwestern Oregon and northern California.
scope: This is the whole mountain wildflower, not a related garden species or the flowers on their own.
examples:
- Siskiyou lewisia clings to the cliff face, its pink flowers opening between the rocks.
- We found siskiyou lewisia growing in a narrow rock crevice high in the mountains of northern California.
