simpleMeaning: in a skilled way that shows you can do a job well
scope: 'Also called ably, capably, and competently: done in a skilled way that shows a job done well,
  not just done fast or done in a fitting way.'
examples:
- She aptly led the new team through its first hard job.
- He aptly fixed the broken machine on his first try.
