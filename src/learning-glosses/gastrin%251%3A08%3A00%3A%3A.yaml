simpleMeaning: A small protein hormone made by the stomach lining; when protein fragments and amino acids
  reach the small intestine, it triggers the release of stomach acid.
scope: A stomach hormone that triggers acid release, not ghrelin (which stirs appetite) and not stomach
  acid itself.
examples:
- Eating a meal raises gastrin levels in the blood.
- The doctor ordered a gastrin test to see why her stomach made so much acid.
