simpleMeaning: A dance style typical of the Gypsies of Andalusia, strong and with a clear beat, with hand
  clapping and feet stamping
scope: This dance, also called gypsy dancing, is a style of dancing, not the guitar music made for this
  dance.
examples:
- She learned flamenco in Seville and practised the fast footwork every day.
- The flamenco dancers clapped their hands and stamped their feet to the music.
