simpleMeaning: a thing that points to or hints at something else
scope: A thing that points to or hints at something else; indication is another name for this sense, not
  a proof, not a plain fact, and not a number on a scale.
examples:
- Symptoms are the prime indicants of disease.
- A sudden silence was an indicant of foul play.
