simpleMeaning: A very thin thread of stuff that comes from nature or is made by people
scope: A very thin thread, not a necklace, not a shore and not a pattern in a bigger whole.
examples:
- A single strand of hair fell across her face.
- The rope is made of many fine strands twisted together.
