senseId: 'alcoholism%1:26:00::'
synsetId: 14088126-n
simpleMeaning: A long-term condition of regular intoxication and dependence on drink, with heavy drinking
  that ruins health and brings severe symptoms when drinking stops.
scope: This is the long-term condition with dependence and withdrawal, not the intense craving alone or
  a single drunken episode.
examples:
- Her alcoholism grew worse after the divorce, and she could no longer work.
- He has lived with alcoholism for twenty years and still attends a support group.
