simpleMeaning: Whether they do no harm or cause disease, these rod-shaped germs live in the guts of people
  and other animals, and a dye test leaves them clear.
scope: Also called enteric bacteria and enterobacteria, these are gut germs, not the germs that live on
  skin or in soil.
examples:
- Enterics are the germs most often found in the gut.
- The lab grew enterics from the sample.
