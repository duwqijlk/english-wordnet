simpleMeaning: Sharp-pointed leaf-like bits ring the flower heads of this herb, one of several kinds in
  the group Dipsacus from Europe, Asia, and Africa.
scope: Also called teasle and teazel, this herb's flower heads are ringed with sharp-pointed bits.
examples:
- A teasel grew wild.
- Sharp little spikes ringed the teasel's flower heads.
