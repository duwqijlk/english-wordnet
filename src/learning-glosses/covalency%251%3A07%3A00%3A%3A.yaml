senseId: 'covalency%1:07:00::'
synsetId: 05041916-n
simpleMeaning: Atoms join in a chemical compound by sharing pairs of electrons, and this is the count
  of how many pairs one atom can share.
scope: 'Also called covalence: atoms joined by shared pairs of electrons, not a bond made by giving electrons
  away.'
examples:
- Covalency counts the electron pairs an atom can share.
- The covalency of hydrogen is one shared pair of electrons.
