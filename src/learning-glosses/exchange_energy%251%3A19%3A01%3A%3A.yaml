simpleMeaning: In physics, the amount of work a system can do that comes from swapping two matching tiny
  parts.
scope: In physics, the amount of work a system can do that comes from swapping two matching tiny parts;
  not the heat of a thing and not the power used to run a machine.
examples:
- The exchange energy between the two atoms was hard to work out.
- Physicists measured the exchange energy of the molecule.
