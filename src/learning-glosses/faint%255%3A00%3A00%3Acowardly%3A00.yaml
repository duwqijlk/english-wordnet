simpleMeaning: slow to take bold action because of a lack of confidence or nerve
scope: The cowardly sense, not a loss of consciousness, a barely noticeable light, sound or smell, or
  something with no clear outline; timid, faint-hearted and fainthearted are other names for it.
examples:
- He was faint of heart and would not risk the climb.
- A faint heart rarely wins such contests.
