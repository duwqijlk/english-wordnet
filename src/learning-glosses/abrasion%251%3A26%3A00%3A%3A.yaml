simpleMeaning: a place on the skin where the top part is torn or rubbed off
scope: 'Also called a scratch or a scrape: a place where skin is torn or rubbed off, not the act of rubbing
  something away and not a deep cut.'
examples:
- He cleaned the abrasion on his knee after he fell.
- The abrasion on her arm hurt but did not bleed much.
