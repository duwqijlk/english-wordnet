simpleMeaning: Used as medicine and to flavour food and strong drink, these small grains taste of liquorice.
scope: Also called anise and aniseed, this word is used of small grains that taste of liquorice and are
  used as medicine and to flavour food and strong drink.
examples:
- The baker put anise seed in the bread for its liquorice taste.
- In the kitchen, anise seed went into both the cakes and the strong drink.
