simpleMeaning: A sweet-smelling woody plant of the West Indies that bears the berries called allspice.
scope: This is a sweet-smelling woody plant of the West Indies that bears allspice berries; allspice and
  allspice tree are other names for this sense, not a plant of the East Indies and not a plant grown for
  its wood.
examples:
- The pimento tree grows in Jamaica.
- Pimento trees bear allspice berries.
