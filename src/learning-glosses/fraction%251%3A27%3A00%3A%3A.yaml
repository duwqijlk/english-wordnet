simpleMeaning: one part of a mixture, separated from the other parts by a process made for splitting mixtures
  into parts
scope: This is a part taken out of a mixture, not a part of a whole number in maths and not just a very
  small amount.
examples:
- The lightest fraction was taken off first during refining.
- Each fraction from the oil was collected in a separate tank.
