simpleMeaning: a quantity of strong alcoholic drink equal to about 750 millilitres, the standard size
  of a liquor bottle in the United States
scope: This is the bottle size or amount of drink, not the ordinal number in a series and not a fraction
  in general.
examples:
- He bought a fifth of whiskey on the way home.
- They shared a fifth of vodka at the party.
