simpleMeaning: If their party won, these leading members of the party out of power would most likely take
  the same jobs as ministers.
scope: The party out of power has a set of leading members who would take ministers' jobs if it won, not
  the ministers in power now.
examples:
- If their party wins, members of the shadow cabinet take over as ministers.
- The shadow cabinet gives the party out of power its own team of would-be ministers.
