simpleMeaning: 'The way of building that grew up in the Eastern Roman Empire after the 400s: great domes
  on square bases, round arches, spires and much use of small coloured tiles.'
scope: The way of building of the Eastern Roman Empire after the 400s; set apart from the building of
  the Western Roman Empire and from later ways of building with domes.
examples:
- Byzantine architecture is known for its great domes and mosaics.
- The church shows Byzantine architecture in its round arches.
