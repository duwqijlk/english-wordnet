simpleMeaning: A hard, corrosion-resistant mineral that is a natural mix of osmium and iridium, often
  with small amounts of rhodium and platinum, used in needles and pen nibs.
scope: This sense is the natural osmium-iridium mineral also called osmiridium; it is not the pure metal
  osmium or iridium on its own.
examples:
- Geologists found grains of iridosmine in the river gravel.
- The pen nib was tipped with iridosmine to resist wear.
