simpleMeaning: Brought out of danger, especially freed from the hold and penalty of wrongdoing against
  God.
scope: This describes someone or something brought out of danger, not money set aside for later.
examples:
- The stranded climbers were saved by a rescue team.
- Many in the congregation spoke of being saved.
