simpleMeaning: Henri Bergson once held that a power, neither of matter nor of chemistry, drives how living
  things change and grow.
scope: Also called vitality, elan vital, and life force, it is the power Bergson once held to drive how
  living things change and grow, and it is neither of matter nor of chemistry.
examples:
- Bergson wrote about the vital force driving how living things change.
- For Bergson, a vital force drove how living things change and grow.
