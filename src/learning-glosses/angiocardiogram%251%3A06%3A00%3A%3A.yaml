simpleMeaning: After a substance that blocks X rays is put into the blood, a run of X-ray pictures shows
  the heart and its blood vessels at work.
scope: This is a run of X-ray pictures showing the heart and its blood vessels at work, not a single picture
  of the blood vessels alone.
examples:
- The angiocardiogram showed her heart at work.
- An angiocardiogram was taken after the blocking substance went into his blood.
