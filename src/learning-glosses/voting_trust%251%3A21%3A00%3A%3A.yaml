senseId: 'voting_trust%1:21:00::'
synsetId: 13384877-n
simpleMeaning: People who own shares with votes keep the shares but hand the right to vote to others chosen
  to use it, under an agreement.
scope: An agreement in which share owners keep their shares but hand the voting rights to others; not
  a sale of the shares.
examples:
- The voting trust let the trustees vote the shares.
- Under the voting trust, the owners kept their shares but gave up the vote.
