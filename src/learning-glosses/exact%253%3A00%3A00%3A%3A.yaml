simpleMeaning: showing complete and precise agreement with the facts in every detail
scope: The broad adjective for a copy or amount that agrees with the facts in every detail; not the narrower
  sense for true ideas and wording, nor the absolute use meaning with nothing softened.
examples:
- She made an exact copy of the key.
- The arrow landed in the exact centre of the target.
