simpleMeaning: to make words or shapes on something by using a sheet with holes cut in it and putting
  paint or ink over it
scope: The act of marking or printing with a stencil, not the stencil sheet itself.
examples:
- She stenciled the name onto the wooden box.
- He stenciled a flower pattern onto the wall.
