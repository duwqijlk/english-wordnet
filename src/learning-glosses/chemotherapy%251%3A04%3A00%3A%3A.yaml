simpleMeaning: using drugs made from chemicals to treat or control a disease, or a mental illness
scope: This is treating or controlling a disease or a mental illness with drugs made from chemicals; not
  surgery and not treatment with heat or rays.
examples:
- She is having chemotherapy for her illness.
- The doctor said chemotherapy might control the disease.
