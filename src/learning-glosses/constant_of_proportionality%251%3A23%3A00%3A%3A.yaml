simpleMeaning: The fixed worth of the share of two linked amounts x and y, usually set down as y = kx,
  where k is the link factor.
scope: This sense is also called factor of proportionality, the fixed worth of the share of two linked
  amounts x and y, usually set down as y = kx, where k is the link factor.
examples:
- Constants of proportionality fix the share of x and y.
- The constant of proportionality is written y = kx.
