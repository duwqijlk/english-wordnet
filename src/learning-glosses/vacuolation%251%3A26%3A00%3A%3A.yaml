senseId: 'vacuolation%1:26:00::'
synsetId: 14101175-n
simpleMeaning: The state of having become full of tiny hollow spaces, called vacuoles, inside a cell.
scope: The state of a cell that has become full of tiny hollow spaces, with vacuolisation and vacuolization
  as other names for this sense; not a single hollow space and not the filling of a cell with water.
examples:
- Vacuolation of the cells was clear under the microscope.
- The report noted vacuolation in the plant cells.
