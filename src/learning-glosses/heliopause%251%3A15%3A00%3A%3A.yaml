simpleMeaning: The boundary where the sun's influence ends, about 100 Earth-sun distances from the sun,
  between the interplanetary and interstellar media, where the solar wind meets radiation from other stars.
scope: The boundary itself, where the sun's influence stops, not the space of that influence inside it
  or the sun itself.
examples:
- The probe crossed the heliopause and entered interstellar space.
- At the heliopause, the solar wind meets radiation from other stars.
