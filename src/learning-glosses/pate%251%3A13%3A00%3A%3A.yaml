simpleMeaning: a food made of liver, meat, or bird meat, cut very small or ground up, with salt, herbs,
  or spices added in different ways for taste
scope: This is a food made from liver, meat, or bird meat; not the top of a person's head.
examples:
- He spread pate on a small piece of toast.
- She bought some duck pate at the shop.
