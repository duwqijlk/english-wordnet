simpleMeaning: fully right and exact, and not letting any change away from a set rule
scope: Also called rigorous. This sense means fully exact with no change from a set rule, not just hard
  and firm in a general way.
examples:
- In the strict sense of the word, a tomato is a fruit.
- He is a strict vegetarian and never eats meat at all.
