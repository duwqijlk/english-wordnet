simpleMeaning: directed at only one aim or object, not split among several.
scope: This is not something intended for one person or one thing; it is attention or effort fixed on
  one aim rather than several.
examples:
- She set out with a single purpose and let nothing pull her away from it.
- The research had a single aim, and every experiment served it.
