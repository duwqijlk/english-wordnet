simpleMeaning: in a way that shows you do not trust a person or thing, or that you think something is
  wrong
scope: This describes acting when you do not trust a person or thing or think something is wrong; it is
  not about an action that looks strange to others.
examples:
- She looked at the new man suspiciously and asked who he was.
- He read the letter suspiciously, sure that it was not true.
