simpleMeaning: To give your time and energy to a cause, group or country.
scope: This is giving your life or effort to a cause or institution, not working as someone's servant,
  not delivering a legal document to someone, and not being enough for a need.
examples:
- She served the church faithfully for over thirty years.
- He wanted to serve his country as a diplomat.
