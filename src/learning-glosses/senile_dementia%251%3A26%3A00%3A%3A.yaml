simpleMeaning: a loss of memory and clear thought that comes with old age, caused by the brain wearing
  down, not by problems with the blood vessels in the brain
scope: This is a loss of memory and clear thought in old age, also called senile psychosis; not a loss
  of memory from a stroke or from a disease of the blood vessels in the brain.
examples:
- The doctor said the old man's senile dementia was getting worse.
- She read about senile dementia and how it changes a person's memory.
