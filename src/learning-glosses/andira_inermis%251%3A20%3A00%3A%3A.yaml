simpleMeaning: A tree with rough, foul-smelling, poisonous bark and strong lasting wood; its bark and
  seeds are used as a laxative, a worm medicine, and a drug that dulls pain.
scope: 'Also called the cabbage-bark tree, cabbage bark, and cabbage tree: a tree with poisonous bark
  and strong wood, not a fruit tree and not a softwood pine.'
examples:
- Andira inermis stood at the edge of the clearing, its bark rough and dark.
- The Andira inermis seeds were kept away from children because they are poisonous.
