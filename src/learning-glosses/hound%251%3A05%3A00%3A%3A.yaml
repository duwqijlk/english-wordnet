simpleMeaning: one of several kinds of dog used for hunting, typically with large ears that hang down
scope: A hunting dog of one of these kinds, not the verb sense of chasing someone and not letting go,
  and not just any dog.
examples:
- The hunter followed his hound through the woods.
- A bloodhound is a kind of hound with a very strong sense of smell.
