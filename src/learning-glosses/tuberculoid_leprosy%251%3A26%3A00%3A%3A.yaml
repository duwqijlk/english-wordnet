simpleMeaning: a form of a skin sickness in which lumps grow in the skin and in the nerves of the skin
scope: A form of a skin sickness with lumps in the skin and in the nerves of the skin; not a common skin
  rash and not a sickness of the lungs.
examples:
- Tuberculoid leprosy left lumps in the skin of his arm.
- The doctor saw tuberculoid leprosy in the lumps on her skin and the sore nerves.
