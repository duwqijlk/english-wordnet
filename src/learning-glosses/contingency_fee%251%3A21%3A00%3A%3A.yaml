synsetId: 13342103-n
simpleMeaning: money paid only if the result is good, as when a lawyer is paid only if a case is won
scope: Money owed only when the work ends well, not a fixed charge and not pay for time worked.
examples:
- The lawyer worked for a contingency fee and took nothing when the case was lost.
- She agreed to a contingency fee, so she would pay only if she won.
