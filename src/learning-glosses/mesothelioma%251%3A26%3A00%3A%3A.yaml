simpleMeaning: a kind of cancer of the thin covering around the lungs, the belly or the heart, usually
  linked to contact with asbestos dust
scope: A cancer of the thin covering around the lungs, belly or heart, not a cancer that starts in the
  lung itself.
examples:
- The doctor told him his mesothelioma was linked to asbestos dust from his old job.
- Mesothelioma is a rare cancer that grows around the lungs or belly.
