simpleMeaning: a noise at a very high pitch, like the cry of a person
scope: A high noise that only resembles a person's cry; not the sharp piercing cry a person actually gives,
  nor the verb for crying out suddenly.
examples:
- The scream of the brakes made everyone cover their ears.
- We heard the scream of the wind through the broken window.
