simpleMeaning: The sad, let-down feeling you get when what you hoped for does not happen
scope: The feeling of being let down when hopes fail, not the act or failure that lets someone down.
examples:
- His disappointment was plain to see when the team lost.
- She felt a deep disappointment when the letter never came.
