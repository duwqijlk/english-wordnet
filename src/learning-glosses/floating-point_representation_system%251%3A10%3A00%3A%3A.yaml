simpleMeaning: a way to write numbers in which a raised figure of the base marks where the dot goes; 0.0012
  becomes 0.12 with -2, and -2 is that figure
scope: A way to write numbers in which a raised figure of the base marks where the dot goes; floating-point
  notation is another name for this sense. Not ordinary decimal writing, and not a way of writing whole
  numbers only.
examples:
- The floating-point representation system lets computers store very small numbers.
- She explained the floating-point representation system with the example of 0.0012.
