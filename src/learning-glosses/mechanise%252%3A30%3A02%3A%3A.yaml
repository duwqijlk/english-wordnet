simpleMeaning: To give a group motor vehicles that carry guns and have strong metal covers
scope: To give a group motor vehicles that carry guns and have strong metal covers, also called mechanize,
  motorize and motorise; not to give foot soldiers new guns alone.
examples:
- They planned to mechanise the army with armoured cars.
- To mechanise a force takes many trucks and guns.
