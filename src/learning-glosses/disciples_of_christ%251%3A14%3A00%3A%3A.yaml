simpleMeaning: A Protestant church that takes the Bible as the only source of true faith in Jesus and
  baptises by dipping people right under water.
scope: A Protestant church that follows the Bible alone, also called the Christian Church; not a Roman
  Catholic church and not a church that baptises by sprinkling.
examples:
- The Disciples of Christ meet in a plain church in town.
- She was baptised by the Disciples of Christ as an adult.
