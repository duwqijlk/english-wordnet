simpleMeaning: a box with straight sides that you pack clothes in and carry with you
scope: Also called a bag and a grip, this is a box for packing clothes to carry with you, not a backpack
  and not a purse.
examples:
- She packed her suitcase the night before the flight and set it by the door.
- His suitcase was so full of clothes that he had to sit on it to shut it.
