simpleMeaning: a three-sided piece of wood that floats, tied to the end of a log line used to tell a ship's
  speed
scope: A wooden float on the end of a log line, not the tiny electronic part and not a gambling counter.
examples:
- The chip bobbed on the water at the end of the log line.
- Sailors threw the chip over the side to check their speed.
