simpleMeaning: with its parts placed so that one side does not match the other
scope: 'Another name for this is asymmetrical: it means the sides do not match, not that something is
  equal and balanced on both sides.'
examples:
- The building has an asymmetric shape, with a tall tower on one side only.
- She wore an asymmetric dress that was longer at the back than at the front.
