simpleMeaning: A picture or figure showing one of the fourteen steps on Christ's road to Calvary.
scope: This is a picture or figure showing one of the fourteen steps on Christ's road to Calvary, not
  the road itself and not a picture of another part of his life.
examples:
- We stopped at each Station of the Cross to pray.
- The church walls held a Station of the Cross at every step.
