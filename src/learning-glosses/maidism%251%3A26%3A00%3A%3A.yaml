simpleMeaning: sickness from too little niacin (a B vitamin) or tryptophan, or trouble making niacin;
  stomach upset, red skin, mental or nerve problems; can come from poor diet, alcohol or nutrition problems
scope: This is another name for pellagra, the same illness as mal de la rosa and mayidism, not a separate
  disease and not the vitamin whose lack causes it.
examples:
- Villagers living on corn alone were said to suffer from maidism.
- Old medical reports describe maidism among prisoners fed mostly on corn.
