simpleMeaning: The thick stem, lasting from year to year, of a plant with soft stems.
scope: The thick lasting stem of a soft-stemmed plant, not a root and not a woody trunk; stock is another
  name for this sense.
examples:
- The caudex of the plant stays alive through the winter while the soft stems die back.
- You can see the thick caudex at the base of the plant.
