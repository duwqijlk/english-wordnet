simpleMeaning: a plant from India that grows from thick stems under the ground, with seeds that smell
  strong and are used to add taste to food
scope: This is the plant itself, also called cardamon; not just its seeds, which are used to add taste
  to food.
examples:
- Cardamom grows best in warm, wet parts of India.
- The cardamom in her garden has long green leaves and small seeds.
