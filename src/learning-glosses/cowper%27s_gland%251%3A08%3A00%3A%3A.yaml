scope: Among organs that add fluid to semen, this pair is the one that sends its fluid into the urine
  tube and shares its origin with Bartholin's gland in a woman, and bulbourethral gland is another name
  for it.
examples:
- Cowper's gland adds fluid to semen.
- The doctor explained that Cowper's gland sends fluid into the urine tube.
