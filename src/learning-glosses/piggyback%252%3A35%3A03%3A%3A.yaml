simpleMeaning: to carry truck trailers filled with goods on train cars
scope: This is moving truck trailers by train. It is not carrying a person on your back or shoulders,
  and not the act of carrying in that way.
examples:
- They piggyback the trailers on train cars to move goods faster.
- The company piggybacks loaded truck trailers on rail cars each night.
