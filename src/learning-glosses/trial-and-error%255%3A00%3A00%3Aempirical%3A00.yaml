simpleMeaning: testing many ways or ideas until the mistakes get small enough or go away
scope: A way of working things out by testing many ways or ideas until mistakes are small enough or gone;
  not a single test and not a plan worked out in advance.
examples:
- She found the right mix by trial-and-error, changing one thing at a time.
- He learned the game by trial-and-error, trying new moves until they worked.
