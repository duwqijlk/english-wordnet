simpleMeaning: a job with hard, boring work that keeps a person shut in one place
scope: This is a job with hard, boring work, not a machine for exercise with a moving belt and not a mill
  turned by walking on a belt or steps.
examples:
- After ten years on the factory treadmill, he wanted work with more freedom.
- She left the office treadmill to start her own small shop.
