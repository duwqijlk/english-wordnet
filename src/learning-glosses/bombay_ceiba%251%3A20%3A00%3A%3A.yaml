simpleMeaning: A very large tropical tree with deep grooves in its thick trunk, holding big seed pods
  covered with soft, shiny fibre; the source of the soft kapok fibre.
scope: Also called kapok, ceiba tree, silk-cotton tree, white silk-cotton tree, Ceiba pentandra, and God
  tree; a very large tropical tree whose seed pods hold soft, shiny fibre.
examples:
- The Bombay ceiba in the park towers over the other trees.
- Farmers collect the silky floss from the Bombay ceiba's pods.
