simpleMeaning: a low bush in the east of the United States that loses its leaves in winter and bears sweet
  fruit of a dark blue colour
scope: 'Also called dryland blueberry: a low bush with dark blue sweet fruit, not a tall tree and not
  a bush with red fruit.'
examples:
- The dryland berry grows wild in the hills.
- We picked the fruit from a dryland berry near the road.
