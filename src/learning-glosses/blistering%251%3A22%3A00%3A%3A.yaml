simpleMeaning: small raised bubbles filled with liquid that form in or beneath the skin
scope: Small raised bubbles of liquid in or under the skin, not harsh words and not heat that raises blisters.
examples:
- The blistering on her hands got worse after the long hike.
- The blistering on his feet made walking painful.
