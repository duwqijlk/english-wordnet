simpleMeaning: how strongly something, such as a drug or a drink, acts on the body or by chemistry
scope: How strongly a thing such as a drug acts on the body or by chemistry, not the general power to
  get a result.
examples:
- Doctors studied the effectiveness of the new medicine.
- The effectiveness of the drink surprised even its makers.
