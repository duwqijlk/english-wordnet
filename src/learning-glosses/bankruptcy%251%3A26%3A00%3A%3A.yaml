simpleMeaning: Not being able to pay what you owe when each payment falls due
scope: This is not being able to pay your debts when they fall due; failure is another name for this sense,
  not the court process that shares out what is left among those owed money.
examples:
- The shop faced bankruptcy after months of losses.
- He declared bankruptcy when he could no longer pay his debts.
