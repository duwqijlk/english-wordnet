simpleMeaning: Grown in Europe and America for fields where animals feed for good, for hay, and for lawns,
  this grass has wide flat leaves
scope: Also called fescue and meadow fescue, this grass differs from other grasses by its wide flat leaves.
examples:
- Fescue grass covered the lawn with wide flat leaves.
- They cut the fescue grass for hay.
