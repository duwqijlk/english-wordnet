simpleMeaning: With sweet-smelling green or greyish leaves, these shrubs or herbs of the daisy kind are
  any of several kinds
scope: It is any of several shrubs or herbs of the daisy kind, with sweet-smelling green or greyish leaves,
  not a shrub with leaves that have no smell.
examples:
- Artemisia has sweet-smelling green or greyish leaves.
- This artemisia is one of several shrubs of the daisy kind.
