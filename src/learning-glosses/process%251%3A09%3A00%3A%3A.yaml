simpleMeaning: in psychology, a mental operation made up of several parts that works on the contents of
  the mind
scope: This is not a course of action, a court order, a natural growth on a body, or a gradual natural
  change, but a mental operation studied in psychology.
examples:
- The process of remembering involves several mental operations.
- Psychologists study the process by which the mind organizes new information.
