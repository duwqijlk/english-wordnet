simpleMeaning: To make a short clicking sound with the tongue, as a sign that you do not approve.
scope: This is a short clicking sound made with the tongue to show disapproval, also called tsk and tut;
  not a sigh and not a groan.
examples:
- She tut-tutted at the messy room.
- He tut-tutted when he saw the broken vase.
