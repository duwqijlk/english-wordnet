simpleMeaning: In cards, the deed of taking a trick with a trump, when short of suit.
scope: This sense is also called ruff, for, in cards, the deed of taking a trick with a trump, when short
  of suit, where ruff is, in card games, playing a trump card to take a round when you have no card of
  the suit that was led.
examples:
- Trumping is the deed of taking a trick with a trump.
- Trumping takes a trick when short of suit.
