simpleMeaning: This field looks at the body's defence against sickness step by step in chemical terms,
  such as the marks that set it off and the fighters the body makes.
scope: Also called chemoimmunology, this field studies the chemical side of how the body defends itself
  against sickness.
examples:
- She took a course in immunochemistry.
- They hired her to teach immunochemistry.
