simpleMeaning: one of two groups of sea birds from the north, with a short neck and a bright bill that
  is flat from side to side
scope: This sense is the northern sea bird with a short neck and a bright, flat bill; it is not a penguin
  and not a gull.
examples:
- Puffins come back to the northern cliffs each spring to have their young.
- The puffin's bright bill is flat and easy to see from far away.
