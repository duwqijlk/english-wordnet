simpleMeaning: A thing for winding round it things that bend easily — thread, tape, film, and the like.
scope: Also called reel and spool; a thing for winding round it things that bend easily — thread, tape,
  film, and the like, not the thread itself.
examples:
- She wound the thread onto a bobbin for the sewing machine.
- The bobbin ran out of thread halfway through the seam.
