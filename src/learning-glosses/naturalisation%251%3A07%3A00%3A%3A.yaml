simpleMeaning: The way a thing is made to fit in with the world around it
scope: The way a thing is made to fit in with the world around it; also called naturalization; not gaining
  citizenship, not a change in how a word is said, and not bringing plants or animals to a new place.
examples:
- The naturalisation of the garden made it look as if it had always been there.
- By naturalisation, the new building came to fit the old street.
