simpleMeaning: Wood from any of those trees, especially the hard, close-grained wood of the sugar tree,
  used especially for chairs, tables, and floors.
scope: Wood from any of those trees, especially the hard, close-grained wood of the sugar tree, not the
  living tree itself.
examples:
- The table was made of polished maple.
- Maple floors gleam in the old hall.
