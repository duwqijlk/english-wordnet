simpleMeaning: a man whose job is to look after fires, such as the fire that burns coal on a train or
  a steam ship
scope: This sense is a man who looks after a coal fire on a train or steam ship, not a man in a fire service
  who puts out fires in buildings.
examples:
- The fireman added coal to the fire on the steam train.
- On the steamship, the fireman kept the fire burning all night.
