simpleMeaning: A tree from Asia whose bunches of blossoms are usually white, and whose fruit, good to
  eat, looks like a peach.
scope: It is also called apricot, and it names the tree from Asia whose bunches of blossoms are usually
  white, and whose fruit, good to eat, looks like a peach, not the fruit itself.
examples:
- They planted an apricot tree in the yard for its white blossoms.
- The apricot tree bore fruit that looked like peaches.
