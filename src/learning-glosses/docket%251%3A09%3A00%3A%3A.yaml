simpleMeaning: A list of jobs to be done, set in the order of their times.
scope: A time-ordered list of matters to attend to, also called schedule and agenda; not a court's list
  of cases.
examples:
- The docket for the day listed six meetings.
- Her docket was full by nine in the morning.
