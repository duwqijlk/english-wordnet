senseId: 'continuous%3:00:02::'
synsetId: 00600068-a
simpleMeaning: describing a function (a maths rule for working out values) or a curve that goes on with
  no breaks and no uneven jumps
scope: This sense is for a function or a curve with no breaks; it is not the wider sense of something
  that goes on in time or space without stopping.
examples:
- The graph shows a continuous curve with no gaps.
- A straight line can be drawn as a continuous function.
