senseId: 'euthenics%1:09:00::'
synsetId: 06052436-n
simpleMeaning: People live well and work well when the places around them are made better; this is the
  study of how to do that
scope: The study of bettering people's lives by bettering their surroundings, not the study of bettering
  people by changing what they are born with.
examples:
- She studied euthenics to learn how better housing could improve health.
- Euthenics looks at how clean air and safe streets help people live well.
