simpleMeaning: A small tree with thorns, from South America, whose flowers are dark red and bright red
  and grow either alone or in bunches
scope: This small thorny tree from South America is also called a ceibo, a common coral tree, or a crybaby
  tree, and its dark red and bright red flowers grow alone or in bunches.
examples:
- The cry-baby tree bloomed with dark red flowers.
- Dark red flowers grew alone or in bunches on the cry-baby tree.
