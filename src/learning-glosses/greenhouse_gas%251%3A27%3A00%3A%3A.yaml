simpleMeaning: Something in the air, with no fixed shape, that soaks up heat rays and so helps to warm
  the earth.
scope: 'Also called a greenhouse emission: a gas that soaks up heat rays and helps to warm the earth,
  not a gas that cools the air and not the warming of the earth itself.'
examples:
- Methane is a greenhouse gas that warms the planet.
- Factories release greenhouse gases into the air.
