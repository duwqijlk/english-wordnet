simpleMeaning: By law, people in the United States take this date off work; it had another name until
  nineteen fifty-four.
scope: Another name for this is Veterans' Day; it is a date off work by law in the United States, once
  called Armistice Day and kept on November 11.
examples:
- Veterans Day falls on November 11.
- Veterans Day used to be called Armistice Day.
