simpleMeaning: A timekeeper that sets its time by the gap in energy between two states of the heart of
  atoms of a soft metal, held in a magnetic field.
scope: A timekeeper set by shifts of energy in atoms of a soft metal, not a clock with hands and not a
  sun dial.
examples:
- The caesium clock keeps time to a tiny fraction of a second.
- Labs use a caesium clock to set world time.
