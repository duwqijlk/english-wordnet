senseId: 'haunt%2:38:00::'
synsetId: 02008023-v
simpleMeaning: to follow in secret, or to keep coming back on its own, again and again
scope: Also called stalk; this is secret following or a thing that keeps coming back, not acting like
  a ghost to scare or trouble a person.
examples:
- Her ex-boyfriend haunted her for months, following her home in secret.
- The sad song haunted him, coming back to his mind again and again.
