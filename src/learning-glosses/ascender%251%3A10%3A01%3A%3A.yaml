senseId: 'ascender%1:10:01::'
synsetId: 06843611-n
simpleMeaning: The tall part of this small letter stands higher than the other small letters
scope: A small letter with a tall part rising above the rest; not the tall part itself in printing, and
  not a person who climbs.
examples:
- The letter 'b' is an ascender because its tall part rises above the other letters.
- In this typeface, every ascender stands out clearly.
