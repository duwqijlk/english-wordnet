simpleMeaning: The end of a hammer head that sits across from the flat face used to strike, in one of
  many shapes.
scope: The end of a hammer head across from its flat striking face, in one of many shapes, not the face
  itself.
examples:
- The peen of the hammer was rounded for shaping metal.
- He struck the nail with the peen, not the flat face.
