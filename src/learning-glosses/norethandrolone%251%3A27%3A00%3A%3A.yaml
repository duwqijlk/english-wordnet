simpleMeaning: Pills that stop pregnancy hold this man-made copy of the body's pregnancy chemical, sold
  under a trade name and also used to treat womb lining growing out of place.
scope: Also called norethindrone and norethindrone acetate, this is the man-made copy of the body's pregnancy
  chemical that pills stopping pregnancy hold.
examples:
- The pill contained norethandrolone.
- Womb lining growing out of place was treated with norethandrolone.
