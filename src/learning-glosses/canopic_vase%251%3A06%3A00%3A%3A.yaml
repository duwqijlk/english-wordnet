simpleMeaning: A pot used in old Egypt to hold the inner parts of a body made ready for burial.
scope: 'Also called canopic jar: a pot for the inner parts of an embalmed body, not a storage jar and
  not a coffin.'
examples:
- The canopic vase stood beside the coffin in the tomb.
- A canopic vase held the entrails of the embalmed body.
