simpleMeaning: a swimming stroke in which the arms move one after the other over the head, with a flutter
  kick of the legs
scope: This is a swimming stroke with arms moving one after the other over the head; crawl is another
  name for it, not a back stroke or a breast stroke.
examples:
- She swam the front crawl across the lake.
- The front crawl is the fastest swimming stroke.
