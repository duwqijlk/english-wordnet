simpleMeaning: How the stage and its things are set out to show the place of a play or film.
scope: 'Also called setting: how the stage and its things are set out to show the place of a play or film,
  not the play or its words.'
examples:
- The mise en scene placed a kitchen table at centre stage.
- A bare mise en scene suited the bleak play.
