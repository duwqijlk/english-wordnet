simpleMeaning: to push into other people's private matters and get in the way when no one asked
scope: 'Also called meddle: to push into others'' private matters unasked, not to change a thing in secret.'
examples:
- Don't tamper in my affairs, she said.
- He tampered in a quarrel that had nothing to do with him.
