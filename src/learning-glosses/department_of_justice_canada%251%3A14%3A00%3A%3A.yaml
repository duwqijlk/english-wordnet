simpleMeaning: A part of the government of that land that takes the government's cases to court and gives
  it legal advice
scope: Also called DoJC; the part of that land's government that does its legal work, not any other government
  office.
examples:
- The Department of Justice Canada filed the case on behalf of the government.
- She asked the Department of Justice Canada for a legal opinion.
