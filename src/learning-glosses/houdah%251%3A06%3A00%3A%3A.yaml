simpleMeaning: A rider sits in this seat, often with a cover over it, on the back of a camel or elephant
scope: A seat for riding on a camel or elephant, also called a howdah; not a saddle and not a carriage.
examples:
- The houdah swayed gently as the elephant walked along the track.
- She climbed into the houdah for the ride across the desert.
