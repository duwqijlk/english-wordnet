senseId: 'cavil%1:10:00::'
synsetId: 06774509-n
simpleMeaning: dodging the real point of an argument by raising small points that do not matter
scope: Dodging the real point of an argument with small points that do not matter; quibble and quiddity
  are other names for this sense, not an honest answer to the argument and not a fair objection.
examples:
- His cavil about the date did nothing to answer the main charge.
- She dismissed his cavil and asked him to deal with the real question.
