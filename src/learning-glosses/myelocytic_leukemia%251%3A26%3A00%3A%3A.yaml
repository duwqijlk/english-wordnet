simpleMeaning: Too many young white blood cells grow and show up in the blood when this harmful growth
  forms in the parts of the body that make blood.
scope: Also called granulocytic leukemia, this harmful growth forms in the parts of the body that make
  blood, where too many young white blood cells grow and show up in the blood.
examples:
- Myelocytic leukemia made too many young white blood cells grow.
- Myelocytic leukemia filled the blood with young white blood cells.
