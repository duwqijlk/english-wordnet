simpleMeaning: Shots that a watcher can see burst, so the aim can be changed from what is seen
scope: Shots whose bursts can be seen and the aim changed from what is seen, not shots fired blind and
  not a target hit by chance.
examples:
- The observed fire let the gunners correct their aim.
- With observed fire, each burst was watched before the next shot.
