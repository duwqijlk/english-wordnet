simpleMeaning: a person who buys goods in large amounts and sells them to shops and other sellers, not
  to the people who will use them
scope: 'Also called jobber: this person buys goods in large amounts and sells them to shops and other
  sellers, not straight to the people who use the goods.'
examples:
- The wholesaler sells rice to small shops by the truckload.
- A wholesaler bought the toys from the maker and sold them to stores.
