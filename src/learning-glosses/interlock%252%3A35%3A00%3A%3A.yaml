simpleMeaning: to join tightly with one another, so that the people or things joined fit together and
  hold
scope: For people or things that join tightly with one another and hold; not the noun sense, which is
  the act of joining in this way.
examples:
- The two pieces interlock, so the toy house stays together.
- Their fingers interlocked as they walked down the street.
