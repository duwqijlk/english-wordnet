simpleMeaning: to act in a certain way and show it in how you carry yourself
scope: Also called act, do, carry, bear, behave, conduct, deport, and comport, this sense is about how
  a person acts, not about a court saying a person is not guilty.
examples:
- She acquitted herself well in her first job interview.
- He acquitted himself with care during the hard talk.
