simpleMeaning: The increase in a person's waistline, most often in middle age.
scope: This is weight gained around a person's middle, not a scattering of objects and not the act of
  something covering a wider area.
examples:
- He blamed his middle-aged spread on too many business dinners.
- She joined a gym to fight the spread around her waist.
