simpleMeaning: A holy day marking the angel Gabriel's news to the Virgin Mary that she would bear Christ;
  it is a quarter day in England, Wales and Ireland
scope: This holy day is also called Annunciation Day, Lady Day and March 25; it is not Christmas and not
  the feast of the Assumption.
examples:
- The Annunciation falls on 25 March.
- They kept the Annunciation as a holy day.
