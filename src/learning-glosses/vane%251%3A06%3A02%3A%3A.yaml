simpleMeaning: a flat part fixed to the end of an arrow, bomb or missile to keep it steady and guide it
  as it flies
scope: A flat part at the end of an arrow, bomb or missile; it is not the flat part of a feather, and
  not the turning device that shows which way the wind blows.
examples:
- An arrow's vane helps it fly straight through the air.
- A broken vane made the missile fly off its path.
