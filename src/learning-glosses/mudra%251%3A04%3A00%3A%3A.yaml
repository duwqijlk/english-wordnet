simpleMeaning: A hand held in a fixed shape as part of worship or holy dance, especially in Hinduism or
  Buddhism
scope: A set hand sign used in worship or holy dance, not an everyday hand wave and not a dance move with
  no holy meaning.
examples:
- During the prayer, the priest made a mudra with his hands.
- The dancer held a mudra as part of the temple dance.
