simpleMeaning: A one-year woody vine of Asia with long bunches of purplish flowers and pods thick with
  hairs, grown in the southern United States for green manure and grazing.
scope: Also called cowage, velvet bean, Bengal bean, Benghal bean, Florida bean, Mucuna aterrima, Mucuna
  deeringiana, and Stizolobium deeringiana, grown in the southern United States for green manure and grazing.
examples:
- Mucuna pruriens utilis grew as green manure in the southern fields.
- Farmers planted Mucuna pruriens utilis for grazing and to feed the soil.
