simpleMeaning: To start doing the activity that the object naturally calls for, such as smoking a cigar
  or taking a class.
scope: This is starting the activity that a named object implies, such as smoking a cigar, not starting
  to speak and not starting to learn a language.
examples:
- He began a cigar while he waited for the train.
- The students began chemistry in the fall.
