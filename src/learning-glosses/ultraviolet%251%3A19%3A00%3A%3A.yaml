simpleMeaning: A kind of energy that travels in waves, with waves shorter than light we can see but longer
  than X rays
scope: Also called ultraviolet illumination, ultraviolet light and ultraviolet radiation, this is energy
  that travels in waves, not the word that describes something as having such waves.
examples:
- Too much ultraviolet from the sun can burn the skin.
- Ultraviolet can harm the eyes if you look at a strong lamp.
