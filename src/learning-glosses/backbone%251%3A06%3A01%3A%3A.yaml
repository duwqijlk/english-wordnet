simpleMeaning: the part of a book's cover that holds the inner ends of the pages and shows when the book
  stands on a shelf
scope: spine is another name for this sense; the edge of a book's cover, not the bones in the back.
examples:
- The title was printed on the backbone of the book.
- The backbone of the old Bible was cracked.
