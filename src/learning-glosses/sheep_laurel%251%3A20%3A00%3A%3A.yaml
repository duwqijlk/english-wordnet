simpleMeaning: Small red flowers and narrow leaves mark a low North American bush that looks like another
  shrub of the same kind, and it is poison to young farm animals.
scope: Also called lambkill and pig laurel, it is a low bush with narrow leaves and small red flowers
  that is poison to young farm animals.
examples:
- Young stock were kept away from the sheep laurel.
- She knew the sheep laurel by its narrow leaves and small red flowers.
