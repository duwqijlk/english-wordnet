simpleMeaning: Pakistan's spy service, a strong political, military force almost on its own, with nuclear
  arms know-how and ways to send them, close to the Taliban and other armed Islamic groups
scope: Pakistan's spy service; Directorate for Inter-Services Intelligence and Inter-Services Intelligence
  are other names for this sense, not a military unit that fights battles or a foreign spy service.
examples:
- ISI has long shaped politics in Pakistan.
- Reporters say ISI keeps close ties with armed groups.
