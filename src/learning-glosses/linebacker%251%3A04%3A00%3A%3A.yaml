simpleMeaning: In American football, the place where a player on the team without the ball plays, standing
  just behind the line where play starts
scope: The place played by a player on the team without the ball in American football. It is a place on
  the field, not the player himself and not a place on the team with the ball.
examples:
- He plays linebacker for the school team.
- For this game he was put at linebacker, just behind the line.
