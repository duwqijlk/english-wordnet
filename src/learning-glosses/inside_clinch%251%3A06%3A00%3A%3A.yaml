simpleMeaning: A knot in which the end of the rope lies within the loop
scope: A knot with the end of the rope inside the loop, not a knot with the end outside the loop and not
  a plain loop with no knot.
examples:
- He tied an inside clinch to fasten the sail.
- An inside clinch holds fast because the end lies within the loop.
