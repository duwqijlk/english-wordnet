simpleMeaning: a drug that stops the body from reacting to certain chemicals (an antihistamine), used
  to treat or prevent motion sickness
scope: Also called meclizine and meclizine hydrochloride; for motion sickness only, not for other kinds
  of sickness.
examples:
- Antivert helped her on the long boat trip.
- The doctor gave him Antivert before the flight.
