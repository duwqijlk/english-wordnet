synsetId: 05033101-n
simpleMeaning: In chemistry, the weight of one atom of a chemical stuff, given in atom weight units.
scope: 'Also called atomic mass or atomic weight: in chemistry, the weight of one atom of a chemical stuff,
  given in atom weight units; not the weight of a whole lump of the stuff, and not the weight of a whole
  molecule.'
examples:
- The relative atomic mass of carbon is about twelve.
- Relative atomic mass is given in atomic mass units.
