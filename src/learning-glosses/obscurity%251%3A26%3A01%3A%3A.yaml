simpleMeaning: the state of not being clear to see because there is not enough light
scope: This sense is about not being clear to see because there is not enough light, not about being little
  known and not important.
examples:
- The room sank into obscurity when the only lamp went out.
- In the obscurity, I could not see the chairs clearly.
