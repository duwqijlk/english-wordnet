simpleMeaning: Any one of the gases that do not react with other things, from the helium group in the
  table of elements.
scope: 'Also called inert gas and noble gas: any one of the gases that do not react with other things,
  from the helium group in the table of elements.'
examples:
- Argonon does not react with other gases, even when heated.
- The chemist listed argonon among the inert gases of the helium group.
