simpleMeaning: To recognize someone or something as a particular person or thing, or to work out their
  identity.
scope: This is not finding out where something is and not putting an object somewhere; it is only about
  identifying a person or thing.
examples:
- Her face was familiar, but I could not place her.
- I couldn't place the voice on the phone at first.
