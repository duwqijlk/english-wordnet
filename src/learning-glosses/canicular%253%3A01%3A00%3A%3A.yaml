simpleMeaning: About the days just before or just after the Dog Star first appears before sunrise, and
  most of all about those days.
scope: About the days round the rising of the Dog Star, not about the star itself and not about summer
  heat.
examples:
- Canicular days fall in the hottest part of summer.
- The canicular heat made the afternoons still.
