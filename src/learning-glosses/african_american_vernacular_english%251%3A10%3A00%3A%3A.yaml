simpleMeaning: A way of speaking in the United States that is not the usual standard form, used by Black
  people there in a way that sets it apart
scope: This is a nonstandard way of speaking in the United States used by Black people there, also called
  AAVE, African American English, Black English, Black English Vernacular, Black Vernacular, Black Vernacular
  English and Ebonics; not the standard speech taught in schools.
examples:
- She grew up speaking African American Vernacular English.
- African American Vernacular English is used by many Black people in the United States.
