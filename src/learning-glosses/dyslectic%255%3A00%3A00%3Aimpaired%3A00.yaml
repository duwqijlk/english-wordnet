simpleMeaning: Often with a fault in the nerves, a person is not able to take in the sense of written
  words well
scope: Not able to read and take in written words well, not a fault of the eyes, and also called dyslexic.
examples:
- The dyslectic boy read slowly and missed the sense of the words on the page.
- Her dyslectic son found long books hard to follow.
