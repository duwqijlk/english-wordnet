senseId: 'fluxmeter%1:06:00::'
synsetId: 03377779-n
simpleMeaning: A tool that measures magnetic flux, the flow of magnetic force, by the electric current
  it makes in a coil of wire.
scope: A tool that measures magnetic flux by the electric current it makes in a coil of wire; not a tool
  that measures electric current on its own and not a tool that measures heat.
examples:
- The fluxmeter showed the strength of the magnetic field.
- He used a fluxmeter to measure the flux in the coil.
