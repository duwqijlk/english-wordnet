simpleMeaning: to add a word part to the start of a word
scope: This is the verb for adding a part at the start of a word; it is not the added part itself, and
  not adding a part at the end.
examples:
- You can prefix 'un-' to 'happy' to make the word 'unhappy'.
- She prefixed 're-' to 'read' to make the word 'reread'.
