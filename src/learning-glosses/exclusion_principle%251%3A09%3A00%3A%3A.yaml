senseId: 'exclusion_principle%1:09:00::'
synsetId: 05895546-n
simpleMeaning: The rule that no two electrons, protons, or neutrons in one system can share the same set
  of quantum numbers, the numbers that mark each state.
scope: A rule about electrons, protons, and neutrons sharing states; not a rule about keeping people out
  and not a law about whole atoms.
examples:
- The exclusion principle explains why electrons fill shells one by one.
- No two electrons in the atom can break the exclusion principle.
