simpleMeaning: Tamed or changed by people for their own use, as with farm animals and crops such as maize.
scope: This describes an animal or plant that people have tamed or bred for human use; it is not about
  the home or family, and not about goods made in your own country.
examples:
- The farm keeps domestic animals such as cows, pigs and goats.
- These domestic plants have been grown by people for thousands of years.
