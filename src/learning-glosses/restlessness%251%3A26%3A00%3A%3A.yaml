simpleMeaning: a feeling of being annoyed when you have to wait, and of being annoyed by anything that
  makes the wait longer
scope: 'Also called impatience: being annoyed when you have to wait, and being annoyed by anything that
  makes the wait longer. This is not the sense where someone feels they cannot keep still and keeps moving
  all the time.'
examples:
- His restlessness grew as the train was late again and again.
- She felt restlessness when the doctor made her wait for an hour.
