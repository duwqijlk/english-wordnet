simpleMeaning: In nautical and aeronautical use, placed at or toward the back end of a vessel or aircraft.
scope: This adjective describes a fixed position on a ship or plane, not the adverb that tells where someone
  goes or puts something.
examples:
- The aft cabin was small but quiet.
- He checked the aft hatch before departure.
