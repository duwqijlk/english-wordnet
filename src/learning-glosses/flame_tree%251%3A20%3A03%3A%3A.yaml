senseId: 'flame_tree%1:20:03::'
synsetId: 12759359-n
simpleMeaning: a low woody plant growing on land in western Australia, green all year, with bright yellow-orange
  flowers; it draws its food from the roots of grasses
scope: A shrub or small woody plant of western Australia with bright yellow-orange flowers, living off
  grass roots; fire tree is another name for this sense. Not the tropical American shrub with fragrant
  yellow flowers, and not the South Australian tree with scarlet flowers.
examples:
- The flame tree's yellow-orange flowers stood out in the dry western Australian scrub.
- A flame tree had taken root near the fence, feeding off the roots of the grasses.
