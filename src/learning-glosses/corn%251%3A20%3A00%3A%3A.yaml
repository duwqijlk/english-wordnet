simpleMeaning: A tall cereal grass with kernels packed on large ears, farmed in many varieties across
  America and the main cereal of Mexico and Central and South America since before Columbus.
scope: The living cereal plant and the crop in the field, not the harvested kernels, the ears served as
  food, a foot corn, or British grain generally; maize names the same plant.
examples:
- Farmers in Iowa plant corn in spring and harvest it in autumn.
- Corn was first domesticated in Mexico thousands of years ago.
