simpleMeaning: In coastal swamps and river lowlands that flood grows a common cone-bearing tree of the
  southeastern United States, its trunk widening at the foot
scope: Also called bald cypress, southern cypress and swamp cypress, this is a cone-bearing tree of the
  southeastern United States that grows in coastal swamps and flooding river lowlands, not the wood of
  the tree.
examples:
- The pond bald cypress grew in the coastal swamp, its trunk wide at the foot.
- Pond bald cypress lines the flooding river bottoms of the southeast.
