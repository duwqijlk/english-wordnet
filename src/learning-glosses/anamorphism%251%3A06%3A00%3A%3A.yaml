simpleMeaning: 'Above all, one that only looks right when seen in one special way: a picture or shape
  pulled out of true.'
scope: This is the kind of picture that only looks right from one special viewpoint, also called anamorphosis,
  and not the deep change of rocks under the earth.
examples:
- The anamorphism on the wall only looked right from one corner of the room.
- We saw an anamorphism that only made sense when we stood in the right place.
