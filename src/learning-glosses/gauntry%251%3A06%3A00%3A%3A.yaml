simpleMeaning: a frame of steel bars on side posts that reaches over or around a thing; it can hold up
  railway signs above several tracks or hold a moving crane
scope: A steel frame that stands over tracks or a work area, not a bridge for people and not a crane itself;
  also called gantry.
examples:
- The gauntry over the yard held the signals for four tracks.
- A travelling crane ran along the gauntry above the workshop floor.
