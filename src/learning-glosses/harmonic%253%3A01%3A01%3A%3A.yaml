simpleMeaning: about the part of acoustics (the science of sound) that studies what musical sounds are
  made of
scope: About the science of what musical sounds are made of, not about notes played together in a song
  and not about shaking in a nearby thing.
examples:
- The book gives a harmonic study of how musical sounds are built.
- His harmonic work looked at what sounds in music are made of.
