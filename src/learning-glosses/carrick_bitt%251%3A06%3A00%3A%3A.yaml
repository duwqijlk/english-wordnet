simpleMeaning: one of a pair of strong posts on a ship's deck that hold up a windlass, a machine that
  winds ropes
scope: One of a pair of strong posts on a ship's deck that holds up a rope-winding machine, not a post
  that holds a sail and not a rail on the deck.
examples:
- The carrick bitt stood on the deck beside the windlass.
- The sailors tied a rope to the carrick bitt while they worked the windlass.
