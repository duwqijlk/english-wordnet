simpleMeaning: a rough block of lead or iron, made by pouring the hot melted metal out of a furnace (a
  large oven for melting metal)
scope: A rough block of lead or iron; not the farm animal, not a greedy person, and not the bed of sand
  used to shape hot iron.
examples:
- The workers lifted a heavy pig of iron onto the cart.
- A pig of lead is rough and very heavy.
