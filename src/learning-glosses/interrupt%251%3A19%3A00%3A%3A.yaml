simpleMeaning: a signal that stops a computer program for a short time so that another job can be done
  first
scope: A computer signal that stops a program for a short time; it is not the act of disturbing someone
  who is doing something.
examples:
- The printer sent an interrupt to tell the computer to stop and deal with it first.
- When the keyboard sends an interrupt, the program stops for a short time so the computer can read the
  key.
