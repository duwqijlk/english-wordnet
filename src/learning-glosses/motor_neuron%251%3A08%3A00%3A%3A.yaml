simpleMeaning: a nerve cell that carries signals out from the brain or the spinal cord
scope: 'Also called an efferent neuron, a motoneuron, or a motor nerve fiber: a nerve cell that sends
  signals out from the brain or spinal cord, not one that carries signals in.'
examples:
- The motor neuron sends the signal to the muscle.
- Damage to a motor neuron can stop the arm from moving.
