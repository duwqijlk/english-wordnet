simpleMeaning: Any of the sugars that give only a few simple sugars when fully split with water.
scope: Any of the sugars that give only a few simple sugars when fully split with water; not a sugar that
  gives many simple sugars and not a single simple sugar.
examples:
- An oligosaccharide gives only a few simple sugars when split.
- They found an oligosaccharide in the milk.
