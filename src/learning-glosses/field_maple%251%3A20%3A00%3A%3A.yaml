simpleMeaning: a bush-like tree from Europe and Asia that people often grow as a thick row of plants along
  a border
scope: 'Also called a hedge maple: a bush-like tree from Europe and Asia often grown as a hedge, not a
  tall forest tree and not a hedge made of other plants.'
examples:
- The field maple along the road was cut into a neat hedge.
- We planted a field maple to mark the edge of the garden.
