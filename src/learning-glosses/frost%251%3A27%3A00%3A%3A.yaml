simpleMeaning: tiny pieces of ice that form a white layer, especially on things outside
scope: This is the white ice itself, especially outside, not the act of ice forming and not the sweet
  covering put on a cake.
examples:
- Frost covered the grass and the car windows this morning.
- A thin layer of frost formed on the leaves outside.
