simpleMeaning: one single still, see-through picture in a set of such pictures that together make a cinema,
  television or video film
scope: This is one still picture in a film; it is not the border round a picture, not a part of a computer
  screen, and not one part of a bowling game.
examples:
- In one frame, the actor is just opening the door.
- If you stop the video, you can see a single frame clearly.
