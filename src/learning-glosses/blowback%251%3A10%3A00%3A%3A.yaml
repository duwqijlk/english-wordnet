simpleMeaning: False news that comes back into the country that first spread it, after its own spies planted
  the false story abroad.
scope: False news that comes back to the country that spread it, not the escape of gases from a fired
  gun.
examples:
- The blowback embarrassed the government when its own lies came home.
- Officials feared blowback from the false story they had planted abroad.
