simpleMeaning: the act of giving out secret information to others without permission, especially when
  done on purpose
scope: This is secret information given out without permission, especially on purpose; not a hole that
  lets liquid or light in or out, and not liquid flowing out of a container.
examples:
- The leak of secret government papers to the press caused a big problem.
- Someone inside the office was blamed for the leak of private emails.
