simpleMeaning: This old garden plant has flowers that smell strongest in the evening, and it now grows
  wild across Europe, through Siberia, and into North America
scope: Also called sweet rocket; a garden plant with sweet-smelling night flowers, not a rose or a lilac.
examples:
- The damask violet filled the garden with scent as evening came on.
- She planted damask violet along the path so its flowers would smell strongest after dark.
