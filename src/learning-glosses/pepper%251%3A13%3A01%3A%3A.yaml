simpleMeaning: a spice with a strong, hot taste, made from the berry of a common plant from East India,
  used whole or ground into powder
scope: This is the whole or ground spice used on food, not the plant it grows on and not the sweet or
  hot fruit of the Capsicum kind.
examples:
- She ground black pepper over the soup.
- Add a little pepper to the sauce for a hot taste.
