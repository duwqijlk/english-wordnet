synsetId: 00116173-v
simpleMeaning: to grow from a mixed way of speaking into a full, settled language
scope: This is about a way of speaking growing into a full language; not a pidgin, which is a simpler
  mixed way of speaking, and not a single new word.
examples:
- Pidgins often creolize when children start to learn them as their first language.
- The traders' mixed speech creolized over a few years.
