simpleMeaning: the act of throwing something down, or of falling head first, from a high place
scope: A throw or a fall head first from a high place, not rain or other water falling to the ground,
  not quick action, and not a chemical change.
examples:
- The sudden precipitation of the boulder from the cliff frightened the walkers below.
- His precipitation from the roof left him badly hurt.
