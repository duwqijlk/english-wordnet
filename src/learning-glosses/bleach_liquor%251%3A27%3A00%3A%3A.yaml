simpleMeaning: Cloth or the pulp used to make paper goes into this liquid, and a stuff in it takes the
  colour out.
scope: This is a liquid for taking the colour out of cloth or paper pulp.
examples:
- We used bleach liquor to take the colour out of the old curtains.
- We poured bleach liquor over the cloth to take out the colour.
