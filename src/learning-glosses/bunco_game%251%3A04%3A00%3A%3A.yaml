simpleMeaning: A trick in which you cheat at betting or get a person to buy a thing that has no worth
scope: A trick in which you cheat at betting or get a person to buy a thing with no worth; con, sting,
  hustle, flimflam, bunco, bunko, bunko game, con game, confidence game and confidence trick are other
  names for this trick, not an honest game and not a fair sale.
examples:
- He lost his money in a bunco game.
- The bunco game was a trick to cheat players out of cash.
