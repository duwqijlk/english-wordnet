simpleMeaning: A measure tool made of a thin band of cloth, else metal, scored in inches and centimetres,
  for sizing lengths.
scope: This sense is also called tape and tapeline, a narrow band of cloth or metal marked in inches or
  centimetres, used to size lengths.
examples:
- A tape measure sized the room.
- Tape measures mark inches.
