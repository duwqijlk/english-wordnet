simpleMeaning: a very hot fruit that grows thin and comes to a sharp point, with a strong sharp taste
scope: 'Also called chile, chili, chilli and chilly: the very hot fruit itself, thin and sharp at the
  end, not the plant it grows on and not a mild sweet fruit.'
examples:
- One bite of the chili pepper burned her tongue.
- He grew a chili pepper that was thin and came to a sharp point.
