simpleMeaning: an illness from a changed gene on an autosome, a chromosome that is not a sex chromosome,
  where one copy of the gene is enough to cause the illness
scope: 'Also called autosomal dominant disorder: an illness from a changed gene on a chromosome that is
  not a sex chromosome, not an illness that needs two copies of a changed gene.'
examples:
- Autosomal dominant disease runs in the family because one copy of the changed gene is enough.
- The doctor said the autosomal dominant disease came from a changed gene on an autosome.
