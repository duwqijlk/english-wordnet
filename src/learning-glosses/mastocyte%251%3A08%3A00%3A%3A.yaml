simpleMeaning: Full of body chemicals, this large unit of the body's joining tissue spills them out in
  allergic reactions or when the body is hurt or swollen.
scope: Also called labrocyte and mast cell, it is the large joining-tissue unit whose body chemicals spill
  out in allergic reactions or when the body is hurt or swollen.
examples:
- Mastocytes spill their chemicals in an allergic reaction.
- A mastocyte spilled its chemicals after the tissue was hurt.
