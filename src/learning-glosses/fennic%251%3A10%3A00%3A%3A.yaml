simpleMeaning: One of two groups in the Finno-Ugric family of languages; Finnish and Estonian belong to
  this group, but Hungarian does not.
scope: Also called Baltic-Finnic, Finnic, and Non-Ugric; this is one of the two groups in the Finno-Ugric
  family, holding Finnish and Estonian but not Hungarian.
examples:
- Fennic covers Finnish and Estonian.
- Hungarian is not a Fennic language.
