simpleMeaning: Used, wrongly but often, to mean ready to believe things too easily.
scope: Used, wrongly but often, for a person who believes things too easily; not the sense of deserving
  to be believed.
examples:
- She was not the credible fool he expected.
- Do not call him credible when you mean he believes anything he is told.
