simpleMeaning: Suddenly and with no warning; happening unexpectedly, on a quick urge, without planning
  ahead.
scope: This is not about being rude or brief in speech; it describes something that happens all at once
  and without warning.
examples:
- The horse stopped short when a dog ran into the road.
- The car pulled up short at the edge of the cliff.
