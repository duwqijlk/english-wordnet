simpleMeaning: A shrub of eastern North America that loses its leaves in winter, with sweet-smelling leaves
  like a fern and tiny white flowers.
scope: This is a shrub of eastern North America with sweet-smelling fernlike leaves, also called sweet
  fern and Comptonia peregrina; near kinds are other shrubs of the region with leaves of other shapes
  and scents.
examples:
- Comptonia asplenifolia grows in the woods of eastern North America.
- The sweet scent of Comptonia asplenifolia fills the air in summer.
