simpleMeaning: to push air out of your throat suddenly, as when you have a cold in your chest or your
  chest feels blocked
scope: This is the act of suddenly pushing air out of your throat, as when you have a cold in your chest
  or your chest feels blocked. Not a cold itself and not a pain in the chest.
examples:
- He coughs all night when he has a cold.
- The smoke made her cough again and again.
