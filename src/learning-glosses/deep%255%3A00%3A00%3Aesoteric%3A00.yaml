simpleMeaning: hard to get into and impossible for an ordinary person to understand or follow.
scope: This is not physical distance downwards or a low sound; it is about ideas too difficult for most
  people to grasp.
examples:
- The lecture was too deep for me; I lost the thread after ten minutes.
- The book is deep, full of references that only specialists recognise.
