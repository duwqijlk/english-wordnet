simpleMeaning: a tool (sold as Aqua-Lung) that lets divers breathe under water; its name is short for
  self-contained underwater breathing apparatus, words that mean a breathing set you carry yourself
scope: Also called aqualung, this is the breathing set a diver carries under water, not the act of diving
  itself.
examples:
- He checked his scuba before going under the water.
- With scuba on her back, she could breathe deep below the surface.
