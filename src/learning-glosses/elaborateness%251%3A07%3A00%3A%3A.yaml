simpleMeaning: The mark of rich, tangled detail.
scope: This sense is also called intricacy, elaboration, and involution, for the mark of rich, tangled
  detail, unlike the sense for a showy look, richly decked out, even too richly.
examples:
- Elaborateness marked the rich detail.
- The elaborateness of the carving showed.
