simpleMeaning: The muscles and bones around the hip get their blood from a tube that starts in the big
  tube deep inside the hip
scope: This blood tube is also called arteria iliolumbalis.
examples:
- The iliolumbar artery feeds the muscles of the hip.
- Damage to an iliolumbar artery can starve the pelvic bones of blood.
