simpleMeaning: how a thing or a light looks to a person in its shade, its light and dark, and how strong
  the shade is
scope: 'Also called color: how a thing or a light looks to a person in its shade and light, not a false
  show put on to mislead and not the mark of tiny bits in physics.'
examples:
- The colour of the sky changed at sunset.
- She liked the soft colour of the new dress.
