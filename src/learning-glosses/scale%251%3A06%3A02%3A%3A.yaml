simpleMeaning: A machine that shows how heavy something is by measuring its mass.
scope: This is the weighing machine itself, not the marked dial or readout it carries, and not a series
  of musical notes.
examples:
- The kitchen scale showed that the flour weighed exactly 500 grams.
- He stepped onto the scale and groaned at the number.
