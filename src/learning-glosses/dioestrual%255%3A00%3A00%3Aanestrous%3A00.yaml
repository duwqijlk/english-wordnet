simpleMeaning: Describes an animal in a time when it is not ready to mate, between mating times in a breeding
  season with several such times.
scope: An animal in a quiet time between mating times, also called diestrous, diestrual, and dioestrous;
  not an animal ready to mate and not an animal with only one mating time a season.
examples:
- The doe was dioestrual between her mating times.
- A dioestrual ewe is not ready to mate.
