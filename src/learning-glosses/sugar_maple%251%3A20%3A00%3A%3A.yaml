simpleMeaning: 'A maple from eastern and central parts of North America: hard close-grained furniture
  wood, three- to five-lobed leaves, many subspecies, and sap that yields most maple syrup and sugar.'
scope: Another name for rock maple, the maple whose sap is the main source of maple syrup and sugar; other
  maples, such as red maple, are not the main syrup source.
examples:
- Sugar maples are tapped in late winter for their sap.
- The sugar maple's leaves turn gold in October.
