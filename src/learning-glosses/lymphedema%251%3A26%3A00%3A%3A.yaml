simpleMeaning: Swelling, most often in the legs, when the body's clear fluid gathers in the flesh of the
  parts that are swollen.
scope: Swelling, most often in the legs, when the body's clear fluid gathers in the flesh of the parts
  that are swollen; not swelling from a knock and not swelling of the whole body.
examples:
- Lymphedema made her left leg swell after the operation.
- He wore a tight stocking to ease the lymphedema in his leg.
