simpleMeaning: A prickling feeling in the fingers, caused by pressure on a nerve that serves the arm
scope: This is a prickling feeling in the fingers from pressure on a nerve that serves the arm; not a
  prickling from poor blood flow and not a pain in the arm.
examples:
- Thoracic outlet syndrome gave her a prickling feeling in her fingers.
- Pressure on a nerve in his arm caused thoracic outlet syndrome.
