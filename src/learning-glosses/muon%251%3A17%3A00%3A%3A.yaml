simpleMeaning: One of the smallest bits of matter carries a minus charge; in two millionths of a second,
  half of them break into an electron, a neutrino, and an antineutrino.
scope: Mu-meson and negative muon are other names for this tiny bit of matter with a minus charge, half
  of which breaks apart after two millionths of a second.
examples:
- The muon broke apart after two millionths of a second.
- Scientists study muons to learn how tiny bits of matter break apart.
