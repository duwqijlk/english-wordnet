simpleMeaning: a small tight part of each chromosome that shows up when a cell divides, where the two
  halves stay joined in an X shape
scope: A small tight part of each chromosome that shows up when a cell divides, where the two halves stay
  joined in an X shape; kinetochore is another name for this sense, not the whole chromosome and not the
  cell wall.
examples:
- The centromere holds the two halves of the chromosome together.
- Scientists find the centromere hard to read in full.
