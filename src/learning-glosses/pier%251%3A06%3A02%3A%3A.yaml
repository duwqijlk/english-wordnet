simpleMeaning: In building, an upright piece of wall between two doors or windows, holding up the weight
  above it
scope: In building, an upright piece of wall, not the platform built out over the water.
examples:
- The pier between the two windows held up the roof.
- Stone piers framed the wide doorway.
