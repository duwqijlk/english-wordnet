simpleMeaning: a part of a person's nature that makes them gloomy and low in spirits
scope: A part of a person's nature that makes them gloomy, not the old fluid once thought to cause sadness
  and not the adjective for sad things.
examples:
- A deep melancholy seemed part of his nature.
- Her melancholy kept her gloomy through the winter.
