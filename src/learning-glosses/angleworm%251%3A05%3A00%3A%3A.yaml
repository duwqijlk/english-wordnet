simpleMeaning: this land worm is used as bait; it digs through the soil and lets air in, and it often
  comes up when the ground is cool or wet
scope: 'Also called earthworm, crawler, wiggler, nightcrawler, nightwalker, dew worm, fishing worm, fishworm,
  and red worm: the land worm anglers use as bait, not a worm that lives in water.'
examples:
- The angleworm came up after the rain and lay on the cool path.
- He dug up an angleworm to use as bait for the fish.
