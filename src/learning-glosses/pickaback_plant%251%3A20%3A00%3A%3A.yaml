simpleMeaning: a strong plant that lives for years, with flowers standing up in long bunches, and new
  young plants that grow where a leaf meets its stalk
scope: Also called a piggyback plant and youth-on-age; a plant whose young grow where leaf meets stalk,
  not a plant that spreads by runners.
examples:
- A pickaback plant in the pot had tiny new plants on its leaves.
- The pickaback plant grows young plants where each leaf meets its stalk.
