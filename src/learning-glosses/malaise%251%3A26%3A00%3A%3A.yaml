simpleMeaning: a feeling of not being well in the body, as when a little sick or low in spirits
scope: 'Also called uneasiness and unease: a general feeling of being a little unwell in the body or low
  in spirits, not a sharp pain and not a named sickness.'
examples:
- A general malaise kept her in bed all day.
- He felt a malaise and could not do his work well.
