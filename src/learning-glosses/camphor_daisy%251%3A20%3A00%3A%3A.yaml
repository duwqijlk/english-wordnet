simpleMeaning: a plant that lives for one year in the south of the United States and Mexico, with stiff
  hairy leaves and pale yellow flowers
scope: A one-year plant of the warm south with pale yellow flowers, not a garden daisy and not a bushy
  herb of the north.
examples:
- The camphor daisy grew along the dry road in Texas.
- Camphor daisies showed their pale yellow flowers in spring.
