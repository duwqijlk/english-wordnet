scope: A bulb-shaped nerve end in tissue beneath the skin, set apart from other nerve ends by its shape
  and place beneath the skin, and found in large numbers in the palms, soles, joints, and genitals.
examples:
- The Pacinian corpuscle fired when the skin was pressed.
- Pacinian corpuscles crowd the skin of the palm.
