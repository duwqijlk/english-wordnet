simpleMeaning: full of false pride and thinking you are far more important than you really are
scope: Also called swollen, vain, egotistical and egotistic. It is false pride that makes a person think
  too much of himself, not a fair pride in real skill or work.
examples:
- He is so conceited that he thinks everyone should listen to him.
- She became conceited after one small win and stopped listening to others.
