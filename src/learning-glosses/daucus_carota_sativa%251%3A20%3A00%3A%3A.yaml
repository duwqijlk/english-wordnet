simpleMeaning: A plant that lives many years but is grown for one year, in many kinds, for its long pointed
  orange roots people eat; it grows in temperate and tropical regions.
scope: Also called a carrot or a cultivated carrot; a plant grown for one year for its long orange roots,
  kin to other root vegetables grown for food.
examples:
- Daucus carota sativa is grown in the garden for its long orange roots.
- Farmers grow Daucus carota sativa in mild and hot lands.
