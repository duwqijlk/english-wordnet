simpleMeaning: Sweet-smelling flowers the colour of old ivory grow on this small upright bush from Australia
  and Tasmania.
scope: Also called blunt-leaf heath, this is the small upright kind with sweet-smelling ivory flowers,
  not the thin tall kind with white to rose or purple-red flowers.
examples:
- A common heath with sweet-smelling flowers grew in Australia.
- The common heath opened its ivory flowers.
