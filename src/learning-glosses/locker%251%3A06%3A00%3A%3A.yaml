simpleMeaning: a small cupboard or box-like space for keeping clothes and things of value; usually it
  has a lock
scope: 'Also called cabinet: a small space for keeping clothes and things of value, usually with a lock;
  not the large box kept at the end of a bed and not a part that locks or closes a thing.'
examples:
- She put her coat and bag in her locker at school.
- He keeps his money and watch in a locker at the gym.
