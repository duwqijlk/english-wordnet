senseId: 'machiavellianism%1:09:00::'
synsetId: 06223917-n
simpleMeaning: The belief that a ruler may use any means, even cruel or dishonest ones, to gain and keep
  full power over a state.
scope: This is the belief that a ruler may use any means, even cruel or dishonest ones, to gain and keep
  full power over a state; it covers both gaining power and keeping it, and the means may be of any kind.
examples:
- Machiavellianism holds that a ruler may use any means to keep power.
- Critics called his rule Machiavellianism when he used dishonest means to stay in power.
