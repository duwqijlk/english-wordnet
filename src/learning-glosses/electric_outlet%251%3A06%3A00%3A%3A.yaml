simpleMeaning: A socket that takes a plug so a machine can get power from the wires of a building
scope: 'Also called outlet, electric receptacle and electrical outlet: a socket that takes a plug so a
  machine can get power from the wires of a building, not a switch that turns power on and off and not
  the wire itself.'
examples:
- Plug the lamp into the electric outlet beside the bed.
- The electric outlet in the kitchen stopped working after the storm.
