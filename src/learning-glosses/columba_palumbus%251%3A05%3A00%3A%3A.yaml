simpleMeaning: A pigeon of Europe and Asia with white marks on its wings and neck.
scope: A pigeon of Europe and Asia with white marks on its wings and neck, also called cushat, ringdove
  and wood pigeon; the white marks on wings and neck are what set it apart from other pigeons.
examples:
- Columba palumbus flew down from the tree with white patches on its wings.
- We saw Columba palumbus in the wood, its neck marked with white.
