senseId: 'bolt%1:06:02::'
synsetId: 02869446-n
simpleMeaning: a sliding bar in a gun loaded from the back; it pushes out a used cartridge (a bullet case),
  puts in a new one, and closes the back
scope: This is the sliding bar inside a gun. It is not the screw used with a nut, not the part of a lock
  moved by a key, and not a flash of lightning.
examples:
- He pulled back the bolt to load the rifle.
- The bolt pushed the empty case out of the gun.
