simpleMeaning: A pattern of diamonds in many colours on a plain background, first used for knitted things,
  taken from the checked cloth of a family in the west of Scotland.
scope: A diamond pattern in many colours, also called argyll, not the silver gravy holder and not a sock
  in that pattern.
examples:
- His socks had an argyle pattern in red and blue.
- She wore an argyle sweater to the match.
