simpleMeaning: A burrowing egg-laying mammal covered in spines, with a long snout and claws for hunting
  ants and termites, native to Australia.
scope: Also called an echidna or a spiny anteater; a spiny egg-laying burrower of Australia, not the African
  night kind, the New Guinea kind, or the scaly kind.
examples:
- The anteater shuffled through the dry grass of Australia.
- An anteater uses its long snout to sniff out termites.
