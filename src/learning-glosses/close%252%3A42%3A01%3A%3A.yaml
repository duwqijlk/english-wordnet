simpleMeaning: 'of shares or goods being traded: to have a particular price or listing at the moment trading
  stops'
scope: This is not about shutting a building or ending a meeting; it is about the final price of something
  traded on a market.
examples:
- The shares closed at 42 dollars, up three on the day.
- Oil closed lower after a day of heavy selling.
