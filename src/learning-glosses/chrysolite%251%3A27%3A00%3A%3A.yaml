simpleMeaning: A brown or yellow-green stone, a kind of olivine, found in rock made by fire or changed
  by heat, and cut as a jewel
scope: A brown or yellow-green stone, a kind of olivine, found in rock made by fire or changed by heat,
  and cut as a jewel; not other green jewel stones and not a stone with no use as a jewel.
examples:
- The ring held a pale chrysolite.
- Chrysolite is cut as a gemstone.
