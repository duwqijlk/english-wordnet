simpleMeaning: To make it less strong; to calm it down and keep it under control.
scope: 'Also called control, hold, check, contain, curb, and moderate: making a feeling or act less strong
  and keeping it within limits, not stopping it or letting it run free.'
examples:
- She had to hold in her anger during the meeting.
- Hold in your temper until you have heard the whole story.
