simpleMeaning: a small Asian animal with small horns and a cry like a dog's
scope: A small Asian deer with a dog-like cry, also called muntjac; not a roe deer and not a small antelope.
examples:
- The barking deer called out in the forest at dusk.
- We heard a barking deer long before we saw it.
