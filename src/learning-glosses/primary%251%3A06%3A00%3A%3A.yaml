simpleMeaning: In an electrical circuit, a coil of wire whose changing current creates a current in a
  nearby coil.
scope: This is the wire coil in an electrical circuit, not the early election that chooses candidates,
  the main wing feather of a bird, or the star that other bodies orbit.
examples:
- The changing current in the primary induces a voltage in the secondary coil.
- He wound the primary tightly around the iron core.
