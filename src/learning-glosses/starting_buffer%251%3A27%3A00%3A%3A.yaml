simpleMeaning: A liquid that holds the acid and base levels of a mix steady at the start of a chemical
  change
scope: A liquid that holds the acid and base levels of a mix steady at the start of a chemical change,
  not a liquid used to wash things and not the chemical change itself.
examples:
- The starting buffer kept the mix steady while the test ran.
- She mixed the starting buffer before the reaction began.
