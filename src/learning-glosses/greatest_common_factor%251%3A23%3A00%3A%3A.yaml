senseId: 'greatest_common_factor%1:23:00::'
synsetId: 13757303-n
simpleMeaning: Take a set of whole numbers; the biggest whole number that fits into all of them with no
  remainder is this
scope: This is the biggest whole number that goes into every number in a set with nothing left over, also
  called greatest common divisor and highest common factor, not the smallest whole number in the set and
  not a number that fits only one of them.
examples:
- The greatest common factor of 15 and 25 is 5.
- Find the greatest common factor of 8 and 12.
