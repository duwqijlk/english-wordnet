simpleMeaning: A young person brought up by parents who are not their own
scope: This is a young person brought up by parents who are not their own, also called fosterling and
  foster child; it is not a young person brought up by their own parents and not a child taken as their
  own by law.
examples:
- The foster-child came to live with them at the age of five.
- Every foster-child in the home had a small room of their own.
