simpleMeaning: anger that is usually huge in scale, far beyond common anger
scope: Huge anger on a grand scale, not the anger raised by a wrong that is counted as a deadly sin.
examples:
- He feared the wrath of the gods.
- The wrath of the storm tore roofs from houses.
