simpleMeaning: In eye care, a fault in the way the eye bends light, so things far away look blurred
scope: Also called myopia and nearsightedness; a fault of far sight, not a fault of near sight and not
  blindness.
examples:
- Her shortsightedness means she cannot read the road signs.
- His shortsightedness got worse, and far-off faces turned to blurs.
