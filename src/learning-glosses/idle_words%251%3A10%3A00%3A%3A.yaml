simpleMeaning: grand-sounding talk with little behind it, that is not honest or states things larger than
  they are
scope: Talk that sounds fine but means nothing, also called jazz, malarkey, malarky, nothingness, or wind;
  not honest talk and not plain silence.
examples:
- Don't listen to his idle words; he never means what he says.
- Her speech was full of idle words and empty promises.
