simpleMeaning: to add more land to a land so that it grows larger
scope: To add more land to a land so that it grows larger, also called territorialise; not to set up a
  new land with its own rules, and not to give land away.
examples:
- The empire sought to territorialize its borders by taking new land.
- They territorialized the province by adding the river valley.
