senseId: 'opposition%1:24:02::'
synsetId: 13876846-n
simpleMeaning: the way in which two things stand against each other
scope: The way two things stand against each other, not the act of standing against a thing, not a body
  of people joined against a thing, and not a direction opposite to another.
examples:
- The opposition between the two ideas shaped the whole debate.
- There is a clear opposition between light and dark in the painting.
