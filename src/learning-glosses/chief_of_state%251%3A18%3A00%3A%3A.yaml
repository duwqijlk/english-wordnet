simpleMeaning: The person who stands for a country in public, and who may also run its government
scope: This is a country's top public representative, who may also head its government, not a tribal leader
  and not a minister alone.
examples:
- The chief of state welcomed the foreign leader.
- As chief of state, she signed the treaty.
