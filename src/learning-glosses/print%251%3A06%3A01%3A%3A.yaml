simpleMeaning: cloth with a pattern made with dye and pressed onto it, usually by rollers with designs
  cut into them
scope: This is cloth with a pattern on it, not the words in a book or newspaper, not a picture on paper,
  and not the act of making copies.
examples:
- She wore a dress made of a bright cotton print.
- The shop sells a light print for making summer dresses.
