simpleMeaning: A drug, for example, that can liven the body or mind up and get it moving
scope: 'Also called excitant and excitative: said of a drug that livens the body or mind, not a drug that
  sends it to sleep.'
examples:
- The excitatory drug stirred the patient from his drowsy state.
- She felt the excitatory effect of the strong coffee within minutes.
