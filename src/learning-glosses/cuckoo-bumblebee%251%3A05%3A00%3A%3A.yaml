simpleMeaning: a bee that lives in the nests of big hairy bees and takes food and care from them instead
  of making its own nest
scope: A bee that lives in the nests of big hairy bees and takes food and care from them, not a bee that
  builds its own nest and gathers its own food.
examples:
- The cuckoo-bumblebee slipped into a nest and laid her eggs there.
- The cuckoo-bumblebee left her eggs for the other bees to raise.
