simpleMeaning: a part in a brass wind instrument that changes the length of the air inside it to change
  the note
scope: A part of a brass wind instrument, not the flow-control device and not the heart or shell senses.
examples:
- The trumpeter pressed a valve to change the note.
- A stuck valve made the horn sound out of tune.
