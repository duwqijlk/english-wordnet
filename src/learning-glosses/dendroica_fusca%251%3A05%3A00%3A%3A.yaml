simpleMeaning: A black-and-white warbler of North America that lives in woods, with a head and throat
  of orange and black
scope: Also called Blackburn or Blackburnian warbler; it is one of the wood warblers, told apart from
  the others by its black-and-white body and orange-and-black head and throat.
examples:
- The Dendroica fusca has an orange-and-black head.
- We saw a Dendroica fusca in the woods.
