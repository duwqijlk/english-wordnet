senseId: 'exhortation%1:10:01::'
synsetId: 07154408-n
simpleMeaning: A spoken or written message that urges its hearers to do a thing.
scope: A message that urges its hearers to take action, not the earnest act of urging people on to win
  them over.
examples:
- The letter was an exhortation to vote.
- His exhortation called on the town to give blood.
