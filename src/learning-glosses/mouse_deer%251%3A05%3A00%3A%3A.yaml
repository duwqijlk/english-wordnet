simpleMeaning: a very small hornless cud-chewing animal of warm parts of Asia and west Africa
scope: 'Also called a chevrotain: a very small hornless cud-chewing animal of warm parts of Asia and west
  Africa; not a mouse and not a true deer.'
examples:
- We saw a mouse deer in the warm forest of Asia.
- Mouse deer live in warm parts of Asia and west Africa.
