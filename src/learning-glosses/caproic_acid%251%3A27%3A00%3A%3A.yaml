simpleMeaning: Made by people or drawn from the oils and fats of animals, this greasy chemical gives off
  a smell like a goat's.
scope: It is also called hexanoic acid, and people know it by the goat-like smell it gives off.
examples:
- The lab found caproic acid in the sample of animal fat.
- Caproic acid smells like goats, and the lab could tell it from that smell.
