simpleMeaning: This measure of length, brought in by Tito Livio Burattini in 1675, is as long as a free
  seconds pendulum and half of one hundredth of the modern one away.
scope: Also called catholic metre, metro cattolico, universal meter and universal metre, this is a length
  as long as a free seconds pendulum, not the modern metre itself.
examples:
- The catholic meter was as long as a free seconds pendulum.
- Burattini brought in the catholic meter in 1675.
