simpleMeaning: A plant from the lands around the Mediterranean Sea, like a thistle, grown widely for its
  big flower head that people eat
scope: A thistle-like plant grown for its big edible flower head; also called artichoke and artichoke
  plant, not a thistle grown for its leaves and not a small green vegetable.
examples:
- We steamed a globe artichoke for dinner.
- The globe artichoke in the garden had a large flower head.
