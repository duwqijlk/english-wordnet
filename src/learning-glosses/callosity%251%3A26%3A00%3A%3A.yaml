simpleMeaning: a part of the skin that gets thick and hard where it is pressed or rubbed over and over,
  like the bottom of the foot
scope: 'Also called callus: a patch of skin made thick and hard by being pressed or rubbed again and again,
  not a sore and not a wart.'
examples:
- Years of digging left a callosity on his palm.
- The callosity on the sole of her foot came from walking barefoot.
