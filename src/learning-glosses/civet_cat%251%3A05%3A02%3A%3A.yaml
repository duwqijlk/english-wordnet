simpleMeaning: With a long bushy tail ringed in black and white, this mammal like a raccoon eats both
  plants and animals and lives in Mexico and the southwestern United States
scope: Also called bassarisk, cacomistle, cacomixle, coon cat, miner's cat, raccoon fox, ring-tailed cat
  and ringtail, this is a raccoon-like mammal of Mexico and the southwestern United States, not the musk-secreting
  cat-like animal of the same name.
examples:
- The civet cat moved with its long ringed tail behind it.
- A civet cat eats both plants and animals in Mexico.
