simpleMeaning: the quality of being stiff and hard to press out of shape, not easy to scratch, and ranked
  on the Mohs scale of scratch resistance
scope: How hard a solid is to press or scratch, not the quality of water and not a lack of feeling.
examples:
- The hardness of the diamond made it hard to cut.
- She tested the hardness of the stone with a steel file.
