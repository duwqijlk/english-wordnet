simpleMeaning: A part of the body without a tube that puts its body chemicals straight into the blood.
scope: 'Also called a ductless gland and endocrine: a part of the body that puts its chemicals straight
  into the blood, not a part with a tube and not the whole system of such parts.'
examples:
- The endocrine gland puts its chemicals straight into the blood.
- An endocrine gland has no tube to carry its chemicals out.
