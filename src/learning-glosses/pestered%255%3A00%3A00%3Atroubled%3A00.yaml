simpleMeaning: worried or bothered again and again, especially by small things that keep annoying you
scope: 'Also called annoyed, harassed, vexed, and harried: feeling bothered again and again by small things,
  not hurt in one big attack and not just angry once.'
examples:
- The pestered father had to listen to his children asking for sweets again and again.
- She felt pestered by the flies buzzing around her all afternoon.
