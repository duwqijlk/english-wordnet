senseId: 'bobble%2:41:00::'
synsetId: 02533317-v
simpleMeaning: to do something badly and ruin it, or to make a mess of it
scope: This sense means doing a thing badly and ruining it, also called blow, fumble, spoil, fluff, bumble,
  botch, bungle, muff, mishandle and flub; it is not the short juggling of a thrown or hit baseball.
examples:
- She bobbled the simple repair and broke the tap.
- The singer bobbled the last line and had to start the song again.
