simpleMeaning: a soft thick cover worn to keep the upper limb safe, used by football players and hockey
  goalkeepers
scope: 'Also called arm guard: a soft cover worn to protect the upper limb in sport, not a glove and not
  a shin guard.'
examples:
- The goalkeeper pulled his arm pad on before the game.
- A hard hit to his arm pad left no mark.
