simpleMeaning: to hit and knock down a person or animal with an axe on a long handle, or as if with one
scope: 'Also called poleaxe: this is the act of knocking a person or animal down with that axe, not the
  axe itself — not the battle axe of long ago and not the axe used to kill cattle.'
examples:
- The farmer poleaxed the cow with his long-handled axe.
- The soldier poleaxed his enemy, who fell at once.
