simpleMeaning: light, thin streaks of rain that dry up in the air before they reach the ground, most of
  all when the air near the ground is dry
scope: Light rain that dries up before it reaches the ground, not ordinary rain and not cloud.
examples:
- Virga hung in pale streaks below the clouds but never reached the ground.
- We watched virga fade in the dry air over the desert.
