simpleMeaning: The living space of young officers on a British warship.
scope: The living space of young officers on a British warship, not the topmost boards along the side
  of a boat and not the part of a gun that you hold.
examples:
- The young officers met in the gun room of the British warship.
- His bed was in the gun room below the deck.
