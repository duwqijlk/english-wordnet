simpleMeaning: A large musical instrument with keys, whose strings lie flat on a frame shaped like a harp
  and are usually held up by three legs
scope: This large keyed instrument is also called grand, and is not an upright instrument with vertical
  strings.
examples:
- She practised for hours on the grand piano.
- The grand piano stood in the centre of the concert hall.
