simpleMeaning: In the group Liatris, a North American kind of plant that grows its small round flat flower
  heads in long loose bunches.
scope: Also called blazing star, button snakeroot, gayfeather, or snakeroot, this plant of the group Liatris
  grows in North America, with small round flat flower heads in long loose bunches.
examples:
- The gay-feather bore long loose bunches of small flower heads.
- A gay-feather in the flower bed had round flat flower heads.
