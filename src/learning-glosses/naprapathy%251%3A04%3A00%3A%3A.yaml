simpleMeaning: Its signs, so the belief goes, come from trouble in the bands and soft tissues that hold
  the body together, and it treats sickness without drugs.
scope: It treats sickness without drugs, on the belief that its signs come from trouble in the bands and
  soft tissues.
examples:
- Sickness can be treated by naprapathy without drugs.
- Some turn to naprapathy because it uses no drugs.
