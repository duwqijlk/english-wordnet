simpleMeaning: What follows from what can be studied with a set of terms and the links between them, worked
  out in the abstract, in logic and mathematics.
scope: In logic and mathematics, this names the set of terms and the links between them, worked out in
  the abstract, used to study what follows from what.
examples:
- A formal system lets us test what follows from a set of rules.
- The book explains deduction with a formal system of terms and rules.
