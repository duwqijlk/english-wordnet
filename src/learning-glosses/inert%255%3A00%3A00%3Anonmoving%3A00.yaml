senseId: inert%5:00:00:nonmoving:00
synsetId: 01569431-s
simpleMeaning: not able to move by itself, and not able to fight against being moved
scope: This is about not being able to move or push back when moved, not about a thing that hardly changes
  when it meets other things.
examples:
- The heavy stone lay inert on the ground and did not move at all.
- After the power failed, the machine sat inert on the floor.
