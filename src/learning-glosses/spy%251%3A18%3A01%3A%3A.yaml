simpleMeaning: someone who watches other people in secret
scope: This is a person who watches others in secret, not a secret agent hired by a state or business
  and not the act of watching in secret itself.
examples:
- He thought a spy was watching him from across the street.
- The children hid because a spy stood near the gate, watching them in secret.
