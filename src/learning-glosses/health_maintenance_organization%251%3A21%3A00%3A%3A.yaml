simpleMeaning: A group plan that pays for care, giving members the use of certain hospitals, clinics,
  and doctors.
scope: A group plan that pays for care at certain hospitals and clinics, not private insurance that pays
  any doctor and not a hospital itself.
examples:
- Her health maintenance organization covers visits to the clinics on its list.
- He joined a health maintenance organization through his job.
