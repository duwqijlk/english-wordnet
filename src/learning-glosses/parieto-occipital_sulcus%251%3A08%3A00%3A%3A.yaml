simpleMeaning: Near the back end of each half of the brain runs a groove that sets the upper side part
  apart from the back part.
scope: 'Also called parieto-occipital fissure: a groove near the back end of each half of the brain, between
  the upper side part and the back part.'
examples:
- The parieto-occipital sulcus runs between the upper side part and the back part of the brain.
- Doctors trace the parieto-occipital sulcus to find where the back part begins.
