simpleMeaning: a worker in a betting shop who works out how much the winners are paid
scope: A worker in a betting shop who works out the winnings; not a person who moves to a new land, and
  not one who settles disputes.
examples:
- The settler worked out the winnings after each race.
- A settler in the betting shop checks every ticket before paying out.
