simpleMeaning: A sickness of rice in which the grains are covered with a green dust of tiny seed-like
  spores.
scope: A sickness of rice in which the grains are covered with a green dust of tiny seed-like spores,
  also called green smut; not a true smut and not a rice rust.
examples:
- False smut turned the rice grains green with dust.
- The false smut spread through the paddy after the rains.
