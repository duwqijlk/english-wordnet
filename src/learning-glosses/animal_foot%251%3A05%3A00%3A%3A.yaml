simpleMeaning: the low end of the leg of a living thing with a backbone, but not a person, that it stands
  and walks on
scope: The end of a leg that a creature with a backbone, but not a person, stands and walks on; foot is
  another name for this sense, and it is not a person's foot and not the whole leg.
examples:
- The dog hurt its animal foot on a sharp stone.
- The horse lifted one animal foot and shook off the mud.
