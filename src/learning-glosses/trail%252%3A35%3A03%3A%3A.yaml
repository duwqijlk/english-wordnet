simpleMeaning: To let something drag loosely along the ground or another surface.
scope: This means pulling something loosely along a surface, with train as another name for it, not walking
  slowly or lagging behind, and not hanging down so that it drags.
examples:
- She trailed her scarf behind her as she ran.
- The toddler trailed his blanket across the floor.
