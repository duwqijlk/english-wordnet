simpleMeaning: A man-made drug like progesterone, used to treat cancer of the womb lining
scope: A man-made hormone drug for cancer of the womb lining; megestrol is another name for this, not
  a painkiller and not a drug for other cancers.
examples:
- Megestrol acetate is used to treat cancer of the womb lining.
- The doctor gave her megestrol acetate after the tests.
