simpleMeaning: A deal in which both sides make promises to each other, each side both giving and getting
  a promise.
scope: A deal in which both sides make promises to each other; not a one-sided promise and not a gift.
examples:
- The bilateral contract bound both firms to keep their word.
- They signed a bilateral contract for the work.
