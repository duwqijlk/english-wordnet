simpleMeaning: Clarinets and other tools that make music are shaped from this hard stuff, taken from one
  kind of tree
scope: The hard stuff from one kind of tree that is shaped into tools that make music, also called cocoswood
  and cocuswood, not the dark red stuff from the cocobolo tree and not plain timber for building.
examples:
- The new clarinet was made from granadilla wood.
- The shop kept a stock of granadilla wood for its clarinets.
