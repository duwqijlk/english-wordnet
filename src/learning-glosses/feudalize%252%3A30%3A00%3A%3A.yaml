simpleMeaning: make a country or a people live under the old system of land held in return for service
scope: To make a country or a people live under the old land system, not to free them from it and not
  to bring them under a king's direct rule.
examples:
- The king sought to feudalize the northern lands.
- They tried to feudalize the whole country.
