simpleMeaning: in a short and clear way, using few words and saying just what needs to be said
scope: Saying something in few, clear words and going straight to the point, not speaking for a long time
  or giving many small details.
examples:
- She explained the plan succinctly in two short sentences.
- Please answer succinctly and do not add extra details.
