simpleMeaning: To make a person drunk by giving them drinks that hold alcohol
scope: To make a person drunk with drinks that hold alcohol; soak is another name for this sense; not
  to fill someone with high spirits, and not the effect of a drug.
examples:
- Too much wine can intoxicate even a strong man.
- The strong beer intoxicated him before the night was over.
