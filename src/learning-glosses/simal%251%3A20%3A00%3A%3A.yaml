simpleMeaning: Kapok gives better fibres than this tree of India, whose silk cotton falls short of it.
scope: It is also called the red silk-cotton tree, and its fibres fall short of kapok, not the kapok tree
  itself.
examples:
- The simal sheds silk cotton fibres that fall short of kapok.
- This simal bears silk cotton fibres poorer than kapok.
