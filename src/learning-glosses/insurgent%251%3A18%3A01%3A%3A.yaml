simpleMeaning: a person in an armed group that is not a regular army, fighting a stronger force by damaging
  things and making repeated small attacks
scope: Also called irregular, guerrilla, and guerilla. This is a fighter in an armed group that is not
  a regular army, fighting a stronger force, not just any person who takes part in an armed fight against
  the people in power.
examples:
- An insurgent damaged the bridge to slow the larger army.
- The insurgents kept making small attacks on the stronger force's trucks.
