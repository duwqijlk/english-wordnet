simpleMeaning: a sickness in which the body's own defence turns on its blood tubes and the tissue that
  joins parts, laying down tough stringy tissue in the skin
scope: 'Also called scleroderma: a sickness in which the body''s defence harms its own vessels and tissue
  and hardens the skin, not a skin rash, and not a wound.'
examples:
- Dermatosclerosis left her skin hard and tight.
- The doctor said dermatosclerosis was harming the blood vessels in her skin.
