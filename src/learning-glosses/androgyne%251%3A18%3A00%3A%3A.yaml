simpleMeaning: A person with both male and female sex parts, so that at birth no clear choice of male
  or female can be made.
scope: 'Also called hermaphrodite, epicene, epicene person, gynandromorph and intersex: a person with
  both male and female sex parts, so that at birth no clear choice of male or female can be made, not
  a person with male parts only and not a person with female parts only.'
examples:
- The baby was born an androgyne.
- An androgyne has both male and female sex parts.
