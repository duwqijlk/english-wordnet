simpleMeaning: having a lot to do or being fully taken up with an activity.
scope: This is not about prying into other people's affairs, and not about a design packed with detail;
  it describes being occupied with work or activity.
examples:
- I'm busy with a report and can't talk now.
- She kept busy in the garden all afternoon.
