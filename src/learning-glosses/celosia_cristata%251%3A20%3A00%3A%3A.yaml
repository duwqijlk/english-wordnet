simpleMeaning: In a garden, this plant grows for one year and has feather-like spikes of red or yellow
  flowers
scope: Also called cockscomb and common cockscomb, this is the same plant as Celosia argentea cristata,
  a garden plant with red or yellow flower spikes, not the silver-white weed.
examples:
- Celosia cristata filled the garden bed with red spikes.
- She cut a few stems of Celosia cristata for the table.
