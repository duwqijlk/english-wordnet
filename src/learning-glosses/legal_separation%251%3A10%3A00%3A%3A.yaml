simpleMeaning: A husband and wife who live apart get a court order that sets out what each may do and
  must do
scope: 'Also called judicial separation: a court order for a husband and wife who live apart, not a divorce
  and not a couple living apart with no court order.'
examples:
- They sought a legal separation before deciding on divorce.
- The legal separation set out who would pay the bills.
