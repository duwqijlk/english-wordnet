simpleMeaning: 'Tests that tell one tiny living thing from another rest on this: after a germ-fighting
  stuff made by the body meets it, the coat round the thing swells.'
scope: Quellung is another name for this swelling, used in tests that tell one tiny living thing from
  another.
examples:
- The quellung reaction showed a swollen coat round the germ.
- The quellung reaction named the germ.
