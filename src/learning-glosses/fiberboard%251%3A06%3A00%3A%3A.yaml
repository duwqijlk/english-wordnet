simpleMeaning: Stiff flat sheets made from small bits of wood pressed tight with glue, used to cover walls.
scope: Also called fibreboard and particle board, this is a stiff sheet of pressed wood chips used to
  cover walls, not solid wood and not cardboard.
examples:
- The workers nailed fiberboard over the bare wall.
- Fiberboard panels lined the inside of the shed.
