simpleMeaning: of or like the fungi in the large group whose tiny seeds grow on special cells
scope: Of or like these fungi, not of the fungi in other groups and not of the fruiting part itself.
examples:
- The basidiomycetous fungi in the wood made pale caps in the damp.
- This basidiomycetous growth spread through the old log.
