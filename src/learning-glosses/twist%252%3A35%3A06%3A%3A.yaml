simpleMeaning: To pull something forcefully and suddenly, often to tear it away from whatever holds it
  or where it starts.
scope: This is a violent pull that may tear something loose, not bending an object into a shape, squirming,
  or spraining a joint; wrench is another name.
examples:
- The wind twisted the shutter off its hinge.
- She twisted the loose tooth out with a quick pull.
