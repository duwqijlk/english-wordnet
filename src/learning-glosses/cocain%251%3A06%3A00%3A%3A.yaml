simpleMeaning: Taken for fun or put on the skin to take away feeling, this drug from coca leaves is one
  of the chemicals called alkaloids, and it can grip people hard
scope: Also called cocaine, this is a drug from coca leaves that numbs the skin or is taken for fun, and
  it can grip people till they cannot stop.
examples:
- Cocain numbs the skin where it is put on.
- Cocain can grip people till they cannot stop taking it.
