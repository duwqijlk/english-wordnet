simpleMeaning: a way of saying a sound, with a puff of breath you can hear let out with it
scope: In speech, a sound said with a puff of breath let out, not the act of breathing air in.
examples:
- The aspiration after the 'p' in 'pin' is a puff of air you can feel on your hand.
- English speakers give the 't' in 'top' a clear aspiration.
