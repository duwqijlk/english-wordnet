simpleMeaning: to lift and hold a person or thing up by putting a pillow under it
scope: To raise something on a pillow, not the pillow itself.
examples:
- She bolstered his head with a pillow so he could sit up.
- Nurses bolstered his back with a pillow to help him breathe.
