simpleMeaning: very serious and very important, and needing serious thought
scope: 'Also called heavy: very serious and very important, and needing serious thought. Not a place where
  a dead body is put, and not grave meaning causing fear of great harm.'
examples:
- They faced a grave choice that would change many lives.
- The leaders met to talk about grave matters of state.
