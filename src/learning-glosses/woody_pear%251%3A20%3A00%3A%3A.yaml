simpleMeaning: A thick hard skin covers each fruit of this tree, wide at the bottom and narrow at the
  top.
scope: Also called native pear, this tree bears fruit wide at the bottom and narrow at the top, each with
  a thick hard skin.
examples:
- The woody pear bore fruit with thick hard skins.
- The fruit of the woody pear is wide at the bottom and narrow at the top.
