simpleMeaning: the hard inner layer, usually like wood, in the wall of some fruits such as peaches, plums,
  cherries and olives, that holds the seed
scope: Also called a stone. This is the hard part that holds the seed inside some fruit, not the place
  of suffering in Christian belief and not a hole dug in the ground.
examples:
- She took the pit out of the peach before she ate it.
- Each cherry has a small hard pit in the middle.
