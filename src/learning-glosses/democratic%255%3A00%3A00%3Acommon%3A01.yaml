simpleMeaning: standing for ordinary people in general, or made to please them and serve their good
scope: Made for ordinary people in general, also called popular, not about voting or a system of rule
  by the people.
examples:
- Democratic art speaks to ordinary people, not only to the rich.
- The writer aimed for a democratic style that all readers could enjoy.
