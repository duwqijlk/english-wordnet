simpleMeaning: In computer science, an extra bit (0 or 1) added to a group of bits so it has an odd or
  even number of 1s; a mismatch signals an error.
scope: This sense is the extra bit itself, not the odd-or-even condition it creates or the checking method
  as a whole.
examples:
- A check bit lets the receiver detect a damaged group of bits.
- The software appends a check bit to each byte before sending it.
