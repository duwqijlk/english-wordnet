senseId: 'conditional_reaction%1:04:00::'
synsetId: 00865904-n
simpleMeaning: a learned act that happens only when a set signal comes first
scope: This is a learned act that happens only when a set signal comes first; acquired reflex, conditional
  reflex, conditional response, conditioned reaction, conditioned reflex and conditioned response are
  other names for this sense, not a born-in act that needs no signal.
examples:
- After weeks of training, the dog's conditional reaction came at the sound of the bell.
- Her conditional reaction to the light showed she had learned the link.
