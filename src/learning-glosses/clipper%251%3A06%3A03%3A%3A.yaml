simpleMeaning: In electronics, a circuit that responds unevenly and caps how high a signal can rise at
  any moment, trimming off the tops of a wave
scope: Another name for the limiter, a circuit that caps signal peaks; not the sailing ship or the cutting
  tools that share this name.
examples:
- The engineer added a clipper to cut off the signal peaks.
- A clipper keeps the wave from rising above the set level.
