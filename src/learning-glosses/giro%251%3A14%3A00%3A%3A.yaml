simpleMeaning: A British way of moving money between accounts, by bank or post office, when told to.
scope: A British way of moving money between accounts, by bank or post office, when told to; not a cheque
  from the British government for a person out of work, cashable at a bank or a post office.
examples:
- Their giro moved the rent each month.
- The giro took three days to clear.
