simpleMeaning: The part of the United States government that looks after trade at home and abroad, runs
  the count of the people and the patent office, and began in 1913.
scope: Also called Commerce, the Commerce Department and the Department of Commerce; not the Treasury
  or other government parts.
examples:
- The DoC released new trade figures.
- She works for the DoC in Washington.
