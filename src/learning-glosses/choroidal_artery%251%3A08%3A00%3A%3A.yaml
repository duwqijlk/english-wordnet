simpleMeaning: a blood tube that carries blood to the web of small blood tubes in the dark layer of the
  eye
scope: A blood tube that carries blood to the dark layer of the eye, also called arteria choroidea, and
  not a blood tube that drains blood away from the eye.
examples:
- The choroidal artery supplies the network of blood vessels in the choroid.
- Damage to a choroidal artery can starve the eye's dark layer of blood.
