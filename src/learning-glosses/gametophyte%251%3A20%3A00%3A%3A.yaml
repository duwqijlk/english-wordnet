simpleMeaning: The plant, or the stage in a plant's life, that bears sex cells, in plants that change
  between two forms over their lives
scope: This is the plant, or the stage in a plant's life, that bears sex cells, in plants that change
  between two forms; not the changed branch that bears the sex-cell parts and not the spore-bearing phase.
examples:
- The gametophyte is the stage that bears sex cells.
- In ferns, the gametophyte is a small green plant.
