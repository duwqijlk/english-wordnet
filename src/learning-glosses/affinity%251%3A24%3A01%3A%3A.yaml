simpleMeaning: In anthropology, being family because of marriage or adoption, not because of blood
scope: In anthropology, a family link made by marriage or adoption, not by blood; not a natural likeness
  between people or things, and not a force between atoms.
examples:
- Their affinity came from marriage, so they were family but not blood relations.
- In this village, affinity through adoption gives a child the same family place as a blood child.
