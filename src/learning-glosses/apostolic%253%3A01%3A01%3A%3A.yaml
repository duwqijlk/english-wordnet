simpleMeaning: A thing is called this when it comes from the head of the church that follows the Apostles,
  the pope or the papacy.
scope: This word is also called papal, apostolical, and pontifical, and it marks a thing as coming from
  the pope or the papacy.
examples:
- The apostolic letter came from the pope.
- An apostolic blessing was read out in church.
