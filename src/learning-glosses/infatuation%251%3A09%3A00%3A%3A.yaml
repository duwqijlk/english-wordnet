simpleMeaning: a person or thing that someone loves or wants in a very strong way, but only for a short
  time
scope: This is the person or thing that is loved in this strong, short way, not the strong and foolish
  feeling of love itself.
examples:
- Her infatuation, a young actor, did not even know her name.
- The old car became his latest infatuation, and he spent every day cleaning it.
