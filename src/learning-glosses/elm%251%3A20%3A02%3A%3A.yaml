simpleMeaning: strong, hard wood that comes from this tree, used to make such things as tools and furniture
scope: The wood that comes from this tree, not the tree itself and not the wood of another tree such as
  oak.
examples:
- The elm was hard and tough, good for making tool handles.
- They chose elm for the table because it would not split easily.
