simpleMeaning: In chemistry, one chemical compound forming crystals of different kinds
scope: In chemistry, one chemical compound forming crystals of different kinds; polymorphism is another
  name for this sense, and this is not different compounds forming the same kind of crystal.
examples:
- Pleomorphism lets one compound form crystals of different kinds.
- The pleomorphism of the compound gave crystals of two kinds.
