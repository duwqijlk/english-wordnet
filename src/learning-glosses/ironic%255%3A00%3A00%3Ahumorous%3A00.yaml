simpleMeaning: Said in a funny way that mocks or cuts at what it speaks of
scope: Also called dry, wry, and ironical; a funny mocking tone, not the sense of a sad clash between
  what was looked for and what came to pass.
examples:
- His ironic smile told us he did not believe a word of it.
- She made an ironic remark about the weather after the picnic was rained out.
