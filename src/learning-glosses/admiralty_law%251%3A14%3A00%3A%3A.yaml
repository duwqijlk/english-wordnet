simpleMeaning: The set of rules between nations that deals with sea areas near and far from shore, with
  moving goods by sea, and with fishing at sea, and the like.
scope: This is also called marine law and maritime law, and it covers the rules for the sea, while other
  branches of law cover what happens on land.
examples:
- Admiralty law decided the dispute over the cargo lost at sea.
- The admiralty law case turned on where the fishing boat had sailed.
