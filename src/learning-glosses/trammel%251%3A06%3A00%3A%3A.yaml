simpleMeaning: A hold that hems in or cuts down freedom, especially a thing used to tie down or hold a
  prisoner.
scope: A hold that hems in or cuts down freedom, especially a thing used to tie down or hold a prisoner;
  also called bond, shackle, or hamper; not a fishing net of three layers, the outer two of coarse mesh
  and the loose inner one of fine mesh, nor a pothook that can be moved, set in a fireplace.
examples:
- Their trammel bound the man.
- The trammel was locked at dawn.
