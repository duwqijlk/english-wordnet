simpleMeaning: In the 1400s and 1500s, artists made fine-lined drawings by moving a metal-tipped tool
  over paper coated to hold the marks it left.
scope: People in the 1400s and 1500s used this way of drawing when they wanted fine lines on paper coated
  to take a metal tip.
examples:
- The silverpoint in the frame shows fine lines made with a metal tip.
- The artist held the silverpoint steady while drawing the outline on the coated paper.
