simpleMeaning: The time for one full cycle of the earth's slow turn, which shifts where spring and autumn
  begin, is about twenty-five thousand eight hundred rounds of the seasons.
scope: Also called the great year; this is the time for one full cycle of the slow turning of the earth,
  not a single calendar year and not one season.
examples:
- A Platonic year lasts about twenty-five thousand eight hundred years.
- Astronomers measure the Platonic year by the slow turning of the earth.
