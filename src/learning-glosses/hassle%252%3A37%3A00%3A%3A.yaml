simpleMeaning: to keep on annoying someone, again and again, over a long time
scope: This is keeping on annoying someone, again and again, over a long time; provoke, harass, plague,
  harry and molest are other names for this sense, and it is not a single rude remark.
examples:
- He hassled his staff all week with pointless demands.
- This man hassles his female co-workers.
