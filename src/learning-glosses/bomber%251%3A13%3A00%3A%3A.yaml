simpleMeaning: A big sandwich on a long crusty roll cut down its length, filled with meat, cheese, tomato,
  onion, lettuce, and other things, called by other names across the United States
scope: A big sandwich on a long roll, also called hero, wedge, sub, and submarine, not the war plane that
  drops bombs.
examples:
- He ordered a bomber with meat, cheese, and lettuce for lunch.
- The bomber was so big she could not finish half of it.
