simpleMeaning: The Roman Catholic Church's full list of the people it accepts as saints
scope: A complete list of accepted saints in the Roman Catholic Church; not a set of basic rules, not
  a set of holy books, and not a priest.
examples:
- Her name was added to the canon of saints by the Church.
- He checked the canon to see if the saint was listed there.
