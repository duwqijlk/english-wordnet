simpleMeaning: In biology, the kind that best shows the key marks of the group it belongs to.
scope: In biology, this is the kind that best shows the key marks of the group it belongs to, not any
  member of the group and not the group itself.
examples:
- The type species shows the key marks of its genus.
- When they set up the new genus, they pointed to the type species as its best example.
