simpleMeaning: Death of heart tissue when the blood flow to the heart muscle is blocked.
scope: Death of heart tissue from blocked blood flow; myocardial infarct is another name for this, and
  it is not a weak heart or a blocked lung.
examples:
- She had a myocardial infarction last year.
- A myocardial infarction kills part of the heart muscle.
