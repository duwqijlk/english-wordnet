simpleMeaning: a kind of work and things built outside, made by people with no training who do not think
  of themselves as makers of such work
scope: This is work made by people with no training who do not think of themselves as makers of such work;
  naive art, outsider art, primitive art and vernacular art are other names for this sense, and it is
  not work by trained artists.
examples:
- The museum showed self-taught art by people who had never taken a class.
- Her garden was full of self-taught art made from wood and stone.
