simpleMeaning: Blooms in white, pink, or red crown a geranium growing straight up, its leaves wavy at
  the edges with a broad patch of another colour set in from each rim.
scope: Also called bedding geranium and fish geranium, this upright geranium is known by its wavy-edged
  leaves, the broad band of another colour inside each leaf edge, and its white, pink, or red blooms.
examples:
- White blooms crown zonal pelargonium above leaves marked by a wide band of another colour.
- The leaves of zonal pelargonium show a broad patch of another colour inside each wavy edge.
