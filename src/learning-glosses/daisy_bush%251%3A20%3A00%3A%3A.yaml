simpleMeaning: An evergreen shrub of the genus Olearia, mostly from Australia, valued for its neat shape,
  sometimes fragrant leaves and masses of white, purple or blue flowers.
scope: A flowering shrub of the genus Olearia, mostly from Australia, grown in gardens for its showy blooms;
  not the small lawn daisy or a low garden herb.
examples:
- A daisy bush grew beside the fence, its leaves giving off a faint scent.
- She planted a daisy bush where it would catch the morning sun.
