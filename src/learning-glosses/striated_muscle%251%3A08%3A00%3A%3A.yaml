simpleMeaning: Tied to bone at one end or both, this flesh pulls the bone to move a part of the frame,
  and it shows lines that run across it.
scope: Also called skeletal muscle, it is the flesh tied to bone at one end or both, which pulls the bone
  to move part of the frame and shows lines across it.
examples:
- The striated muscle tightened and pulled the bone with it.
- The striated muscle showed lines running across it.
