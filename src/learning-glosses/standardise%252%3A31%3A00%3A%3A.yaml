senseId: 'standardise%2:31:00::'
synsetId: 00684355-v
simpleMeaning: to judge something by seeing how it stands against one fixed rule
scope: To judge something by seeing how it stands against one fixed rule; standardize is another name
  for this sense; not to make things follow a rule, which is the other sense of this word.
examples:
- The judge standardised each entry by checking it against the same set of rules.
- They standardised the old coins by weighing each one against the official weight.
