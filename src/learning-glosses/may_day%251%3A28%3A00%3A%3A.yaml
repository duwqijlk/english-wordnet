simpleMeaning: The first of the fifth month, kept in many lands to mark the coming of summer, and in Russia
  and lands near it to honour work.
scope: 'Also called First of May and May 1: the first of the fifth month, kept in many lands to mark the
  coming of summer and in Russia and lands near it to honour work, not the first of any other month.'
examples:
- May Day is a holiday in many countries.
- Workers march on May Day in Russia.
