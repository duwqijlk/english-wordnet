simpleMeaning: More than twice the usual single set of the tiny threads that carry the plan for life is
  what a living thing or a cell has, in genetics
scope: In genetics, a living thing or a cell with more than twice the usual single set of the tiny threads
  that carry the plan for life, not one with the usual single set and not one with only twice that set.
examples:
- The polyploid wheat plant has more than twice the usual number of chromosomes.
- A polyploid cell holds extra sets of chromosomes.
