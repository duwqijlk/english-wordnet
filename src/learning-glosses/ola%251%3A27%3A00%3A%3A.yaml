scope: A leaf, or a strip cut from a leaf, of the talipot palm, used in India as paper for writing on;
  olla is another name for this sense, not a palm leaf used for shade and not paper made from wood.
examples:
- The ola leaf served as paper for the old text.
- Scribes wrote on ola strips in India.
