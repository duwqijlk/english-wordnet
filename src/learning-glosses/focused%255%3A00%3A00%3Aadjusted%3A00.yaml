simpleMeaning: of a thing made to see with, such as an eye or a pair of glasses for the theatre, set so
  it makes a clear picture
scope: Of a thing made to see with, set so it makes a clear picture, not a thing that is already sharp
  and clear to see.
examples:
- The opera glasses were focused so the stage looked clear.
- She held the focused glasses up and the far seats came clear.
