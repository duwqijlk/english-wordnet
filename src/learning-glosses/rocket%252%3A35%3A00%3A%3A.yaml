senseId: 'rocket%2:35:00::'
synsetId: 01244317-v
simpleMeaning: to push or send something forward using an engine that carries its own fuel and is pushed
  by hot gases rushing out
scope: This is the action of pushing something with such an engine, not the engine itself, not the vehicle,
  and not rising fast on its own.
examples:
- They used a small engine to rocket the satellite into space.
- The satellite was rocketed toward the moon.
