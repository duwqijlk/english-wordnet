senseId: 'reexamination%1:10:01::'
synsetId: 07210064-n
simpleMeaning: In law, questions put to a witness by the side that first called that witness, asked after
  the other side has questioned them
scope: In law, more questions for a witness from the side that called them, after the other side has questioned
  them; also called redirect examination; not the first questioning of a witness and not cross-examination.
examples:
- After cross-examination, the lawyer's reexamination of the witness cleared up the point.
- The judge allowed a brief reexamination so the witness could explain her earlier answer.
