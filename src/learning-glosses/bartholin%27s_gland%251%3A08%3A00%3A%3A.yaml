simpleMeaning: Either of the two small parts at the back of a woman's outer parts that make a slippery
  fluid; the same in form as Cowper's part in a man.
scope: Either of two small parts that make a slippery fluid, the same in form as Cowper's part in a man;
  set apart from other small parts of the body and from Cowper's part itself.
examples:
- A Bartholin's gland makes a slippery fluid.
- The doctor said her Bartholin's gland was swollen.
