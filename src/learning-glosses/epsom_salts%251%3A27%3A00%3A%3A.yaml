senseId: 'epsom_salts%1:27:00::'
synsetId: 14969863-n
simpleMeaning: A substance of magnesium sulfate with water in it, swallowed to ease heartburn and constipation
  and given by needle to stop fits
scope: A bitter substance used as a medicine, not a cooking salt and not a salt for softening water; also
  called bitter salts.
examples:
- She took Epsom salts to ease her constipation.
- The nurse gave Epsom salts by needle to stop the fits.
