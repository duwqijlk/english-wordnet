simpleMeaning: In soccer, a point scored by mistake when a player knocks the ball into the net their side
  is guarding
scope: In soccer, a point scored by mistake into the net a side is guarding, not a point scored into the
  other side's net and not a point scored on purpose.
examples:
- His own goal in the last minute cost them the match.
- The defender's own goal gave the other team the lead.
