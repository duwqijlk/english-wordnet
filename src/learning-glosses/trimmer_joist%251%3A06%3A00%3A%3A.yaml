simpleMeaning: So a gap is left for stairs or a chimney and the like, this joist in a floor or roof frame
  takes the end of a cross beam.
scope: Trimmer is another name for this joist in a floor or roof frame, which takes the end of a cross
  beam to leave a gap for stairs or a chimney.
examples:
- The trimmer joist took the end of the cross beam in the floor frame.
- A trimmer joist left a gap in the floor frame for the chimney.
