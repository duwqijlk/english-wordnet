simpleMeaning: a statement claiming that someone has done something wrong or broken a rule
scope: This is a claim that a person did wrong, not the act of bringing a case in court and not the price
  of something.
examples:
- She denied the charge that she had copied his work.
- He faced a serious charge of cheating on the exam.
