simpleMeaning: to let someone off a rule or duty, giving them leave not to follow it
scope: Letting someone off a rule or duty, not handing out medicine and not giving out small portions.
examples:
- The head dispensed her from the morning duty.
- He was dispensed from the rule for one day.
