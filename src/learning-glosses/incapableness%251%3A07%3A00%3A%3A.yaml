simpleMeaning: The state of not being able to do something, whether in body, in mind, or under the law.
scope: Not being able to do a thing, in body, in mind, or by law; incapability is another name for this
  sense, not a lack of skill alone and not a choice not to act.
examples:
- His incapableness for the task was clear when he could not lift the heavy box.
- The court found her incapableness to sign the contract because of her age.
