simpleMeaning: Bits of a person's body tissue or body fluid are read for their DNA so that the person
  can be named.
scope: This is the test that names a person from their DNA, also called genetic fingerprinting.
examples:
- Genetic profiling named the woman from a bit of her skin.
- A drop of spit was enough for genetic profiling to name its owner.
