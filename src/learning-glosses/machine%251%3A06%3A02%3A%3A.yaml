simpleMeaning: A device that passes force from one point to another to move a load.
scope: This is the basic physics sense, such as a lever or pulley, that shifts force from one place to
  another; it is not a car, and not a powered appliance in the home.
examples:
- A lever is a simple machine for lifting heavy weights.
- The pulley is the oldest machine in the workshop.
