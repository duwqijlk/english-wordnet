senseId: 'x-linked_dominant_inheritance%1:07:00::'
synsetId: 04930476-n
simpleMeaning: A pattern of passing down in which a strong gene on the chromosome a mother always passes
  down makes a trait show in the child.
scope: 'One way a trait is passed down: a strong gene on the chromosome a mother always passes down is
  enough for the trait to show, unlike a pattern where the gene must come from both parents.'
examples:
- With X-linked dominant inheritance, one strong gene is enough for the trait to show.
- The family showed X-linked dominant inheritance in every generation.
