synsetId: 08613892-n
simpleMeaning: Marks on the side of a ship show how deep the water may come when the ship is loaded as
  it should be.
scope: Also called load line, Plimsoll and Plimsoll mark; marks on the side of a ship that show how deep
  the water may come when it is loaded as it should be, not marks for speed and not marks on the ship's
  deck.
examples:
- The Plimsoll line showed the crew how deep the ship sat in the water.
- When the water reached the Plimsoll line, the ship was loaded as it should be.
