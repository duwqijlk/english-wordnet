simpleMeaning: The first of its kind; a dead four-toed beast of the Eocene age, as big as a dog.
scope: This is the first of its kind, a dead four-toed beast as big as a dog, also called eohippus, not
  a horse of today or a dog-sized beast of a later age.
examples:
- The dawn horse lived long ago and was as big as a dog.
- Fossils show the dawn horse had four toes on each foot.
