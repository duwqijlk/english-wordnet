simpleMeaning: In psychiatry, repeating the words of another person, without thought or sense, as can
  happen in schizophrenia.
scope: In psychiatry, the automatic repeating of another person's words without meaning, as in schizophrenia,
  not a song stuck in the head and not talking in sleep.
examples:
- She kept repeating his words; her echolalia worried the nurse.
- Echolalia made her repeat everything the doctor said.
