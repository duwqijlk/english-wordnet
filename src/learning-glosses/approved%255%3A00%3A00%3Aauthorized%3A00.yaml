simpleMeaning: set or made official by people in power, and said by them to be right to use or do
scope: For a thing set up or said to be right by people in power; not just liked by many people, and not
  just allowed for a short time.
examples:
- The city gave us a list of approved places to park.
- Only approved drugs can be sold in the shops.
