simpleMeaning: Some tiny one-celled living things have this thin skin that guards them
scope: A thin skin that guards some tiny one-celled living things, not the thick shell of a larger animal
  and not a film on water.
examples:
- Under the lens, the pellicle of the protozoan showed as a thin clear rim.
- The pellicle keeps the tiny creature safe from harm.
