simpleMeaning: This large plant-eating mammal of the bamboo forests of China and Tibet is black and white;
  some put it with the bears, others in a family of its own.
scope: Panda, coon bear and panda bear are other names for this large black and white mammal of the bamboo
  forests of China and Tibet.
examples:
- We watched a giant panda eat bamboo.
- The giant panda slept in the bamboo forest.
