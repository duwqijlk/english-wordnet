senseId: 'splurge%1:10:00::'
synsetId: 06903050-n
simpleMeaning: a display meant to show off, for example of effort or of using far more than is needed
scope: This is a showy display of effort or of going too far, not a quiet or plain show and not the act
  of spending freely.
examples:
- The opening ceremony was a splurge of lights, music, and fireworks.
- Their wedding was a splurge of flowers and fine food, meant to impress everyone.
