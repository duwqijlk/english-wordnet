simpleMeaning: How fast the blood-pumping organ in the chest beats, most often counted to get a quick
  idea of a person's health.
scope: How fast the blood-pumping organ beats, most often counted for a quick idea of health, also called
  pulse; not blood pressure and not the speed of breathing.
examples:
- Her heart rate rose after she ran up the stairs.
- The nurse checked his heart rate to get a quick idea of his health.
