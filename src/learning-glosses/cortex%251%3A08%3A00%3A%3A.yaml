simpleMeaning: the material that forms the outer layer of a body part or other structure in a plant or
  an animal
scope: This is the outer layer of any body part or plant structure, not only the special outer layer of
  the brain and not the material around the centre of the lens in the eye.
examples:
- The cortex forms a thin outer layer around the organ.
- In this plant, the cortex lies just under the skin of the stem.
