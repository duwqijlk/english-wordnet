simpleMeaning: Health and normal working need a steady level between the amounts of body salts, such as
  calcium, sodium and potassium.
scope: It is a steady level of body salts that health and normal working need, not one salt on its own.
examples:
- A good electrolyte balance keeps the body working as it should.
- The body needs an electrolyte balance to stay healthy.
