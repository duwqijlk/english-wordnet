simpleMeaning: A small dry fruit that does not split open, with the seed loose inside its wall.
scope: Not a soft fleshy fruit and not a nut with a hard shell.
examples:
- A sunflower seed sits in an achene that does not split open.
- The achene fell and the seed stayed loose inside it.
