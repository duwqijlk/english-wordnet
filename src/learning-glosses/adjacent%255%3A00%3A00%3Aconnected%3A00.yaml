simpleMeaning: Sharing an edge or border, so the two things join and touch along that edge.
scope: This means two places that share an edge, also called neighboring, not the sense of simply being
  the nearest thing in place.
examples:
- 'Rhode Island has two adjacent states: Massachusetts and Connecticut.'
- The adjacent fields touch along a shared fence.
