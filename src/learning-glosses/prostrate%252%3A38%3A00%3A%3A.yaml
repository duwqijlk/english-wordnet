simpleMeaning: to lie flat with the face down, as a way of showing that you give in to someone
scope: This is lying flat with the face down to show you give in to someone; it is not making someone
  too weak to act.
examples:
- He prostrated himself before the king to show he gave in.
- They prostrated themselves on the floor in front of their ruler.
