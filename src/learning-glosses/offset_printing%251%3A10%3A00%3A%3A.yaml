simpleMeaning: A rubber-covered roller takes the ink from a flat sheet and presses the marks onto paper,
  in this way of making copies.
scope: Also called offset, this way of making copies runs the ink through a rubber-covered roller between
  the flat sheet and the paper.
examples:
- The pages were made by offset printing.
- Offset printing pressed the marks onto the paper from the rubber roller.
