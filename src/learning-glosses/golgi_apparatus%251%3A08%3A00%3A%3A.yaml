simpleMeaning: Like a net, this structure sits in the cytoplasm, the soft stuff that fills an animal cell,
  above all in cells that make fluids.
scope: Also called Golgi body, Golgi complex, and dictyosome; a net-like part inside an animal cell, not
  the whole cell and not the part that carries the cell's instructions.
examples:
- The Golgi apparatus helps the cell send out the fluids it makes.
- In the lab we saw the Golgi apparatus inside the animal cell.
