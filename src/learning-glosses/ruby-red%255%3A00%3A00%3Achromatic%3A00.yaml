simpleMeaning: a colour at the end of the rainbow, next to orange, like blood or cherries or tomatoes
scope: 'Also called red, scarlet, crimson, ruby, cherry, reddish, ruddy, carmine, cerise, blood-red, or
  cherry-red: a colour at the end of the rainbow, next to orange, not orange itself and not pink.'
examples:
- Her ruby-red dress stood out in the crowd.
- The ruby-red paint matched the cherries on the table.
