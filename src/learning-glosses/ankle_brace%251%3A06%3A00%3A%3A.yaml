simpleMeaning: a stiff support worn round the joint where the foot joins the leg to make it stronger
scope: A stiff support worn to make the ankle stronger, not a bandage and not a shoe.
examples:
- She wore an ankle brace after she twisted her ankle.
- The player put on an ankle brace before the match.
