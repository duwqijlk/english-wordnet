simpleMeaning: a version of the drink Caipirinha made with black vodka in place of cachaça
scope: A drink made like a Caipirinha but with black vodka in place of cachaça, not the drink made with
  cachaça and not a drink made with plain vodka.
examples:
- He asked for a caipiblack instead of the usual drink.
- The caipiblack on the menu was made with black vodka.
