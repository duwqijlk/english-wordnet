senseId: 'brutalize%2:30:01::'
synsetId: 00113860-v
simpleMeaning: to make a person cruel and hard, with no care for others and no kind human feeling
scope: About changing another person so that they become cruel and uncaring, not about changing in that
  way yourself and not just about treating someone cruelly.
examples:
- Life in the camps had brutalized him, and he stopped caring for others.
- The long war brutalized the young soldiers and left them cold and hard.
