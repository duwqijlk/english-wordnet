simpleMeaning: A magician who seems to know the thoughts of another person, usually by clever signals
  from a helper.
scope: A magician who seems to know the thoughts of another person, usually by clever signals from a helper,
  not someone with real powers of thought-reading and not a fortune-teller.
examples:
- The mind reader guessed the card in her hand.
- A mind reader needs a sharp eye for small signals.
