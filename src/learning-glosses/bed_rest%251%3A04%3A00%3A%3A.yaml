simpleMeaning: staying in your sleeping place all the time, as when a person is ill or hurt
scope: 'Also called bedrest: staying in your sleeping place all the time when ill or hurt, not a short
  sleep and not a holiday in a hotel.'
examples:
- The doctor put her on bed rest after the fall.
- He spent a week on bed rest with a broken leg.
