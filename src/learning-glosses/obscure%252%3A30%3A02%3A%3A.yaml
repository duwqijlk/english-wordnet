simpleMeaning: to make something impossible to read, see, or notice by covering it or hiding it
scope: 'Also called hide, veil, and obliterate: to cover or hide something so it cannot be read, seen,
  or noticed; not the sense that makes an idea unclear, and not the sense that makes a vowel sound weak.'
examples:
- A thick curtain obscured the message written on the board.
- Dark clouds obscured the moon, so we could not see it at all.
