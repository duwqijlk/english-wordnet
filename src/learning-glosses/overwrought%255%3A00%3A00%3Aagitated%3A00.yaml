simpleMeaning: very upset and unable to stay calm, especially because of strong feeling
scope: 'Also called distraught: very upset and not calm, especially from strong feeling, not just a little
  worried or excited.'
examples:
- She was overwrought after hearing the bad news.
- He became overwrought and could not stop crying.
