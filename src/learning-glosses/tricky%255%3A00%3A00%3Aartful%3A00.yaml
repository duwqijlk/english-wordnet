simpleMeaning: good at making people believe things that are not true
scope: 'Also called slick, sly, and cunning: good at making people believe things that are not true. This
  is not the sense of hard to do or hard to deal with.'
examples:
- The tricky salesman made the old car sound new.
- The tricky lawyer made the witness look like a liar.
