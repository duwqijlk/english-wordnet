simpleMeaning: A way of telling how much chlorine or other chemicals of the same kind are in water, most
  of all sea water
scope: A way of telling how much chlorine or other chemicals of the same kind are in water, most of all
  sea water; not the act of adding chlorine to water and not the chlorine itself.
examples:
- The chlorinity of sea water is high near the shore.
- Scientists measure chlorinity to learn how salty the water is.
