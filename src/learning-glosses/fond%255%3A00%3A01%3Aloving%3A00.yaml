simpleMeaning: loving so much that it goes too far, and letting the loved one have their way
scope: Love that goes too far and gives in too much, not warm love on its own and not a silly hope.
examples:
- The fond grandparents gave the child everything she asked for.
- A fond mother spoiled her only son.
