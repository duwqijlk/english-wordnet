simpleMeaning: a pilot who has been taught to crash a plane on purpose and who is ready to die in the
  crash
scope: This is the pilot, not the plane used for such an attack.
examples:
- The kamikaze was ready to crash his plane on purpose.
- A young kamikaze flew toward the ship, knowing he would die.
