simpleMeaning: a first plan that sets out the main ideas, not yet with all the details filled in
scope: An early plan in outline form, not a secret plot made in a dishonest way and not a group of linked
  parts that form a whole.
examples:
- The engineer drew a simple scheme for the new bridge.
- Their scheme for the school trip was still only a first draft.
