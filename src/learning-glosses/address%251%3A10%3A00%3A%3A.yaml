simpleMeaning: the act of giving a formal speech to a group of people.
scope: This is not the details of where someone lives, and it is not the way you speak to one person;
  it is the formal talk given to a group.
examples:
- The president gave an address to the graduating class.
- Her address to the staff lasted twenty minutes.
