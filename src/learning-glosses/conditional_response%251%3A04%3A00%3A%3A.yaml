simpleMeaning: a learned answer the body gives only after a set cue has come
scope: This is a learned answer the body gives only after a set cue has come; acquired reflex, conditional
  reaction, conditional reflex, conditioned reaction, conditioned reflex and conditioned response are
  other names for this sense, not a born-in answer that needs no cue.
examples:
- The conditional response appeared each time the bell rang.
- Training built her conditional response to the flash of light.
