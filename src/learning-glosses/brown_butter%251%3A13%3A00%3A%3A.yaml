simpleMeaning: a cook heats clear melted fat slowly till dark, then stirs in vinegar or lemon juice and
  capers
scope: 'Also called beurre noisette: clear melted fat heated slowly till dark and mixed with vinegar or
  lemon juice and capers, not plain melted fat.'
examples:
- She poured brown butter over the fish, with lemon juice and capers.
- Brown butter is made by heating clear fat slowly till it turns dark.
