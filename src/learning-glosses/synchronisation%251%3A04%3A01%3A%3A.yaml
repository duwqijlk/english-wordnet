simpleMeaning: A setting that makes a thing happen or happen again in step.
scope: A setting that makes a thing happen or happen again in step; also called synchronization or synchronizing;
  not the lining up of clocks to show the same time, nor the state of things happening at the same time.
examples:
- Their synchronisation timed the show.
- The synchronisation was done at dawn.
