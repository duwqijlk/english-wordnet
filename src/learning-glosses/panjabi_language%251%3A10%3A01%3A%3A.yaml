simpleMeaning: The way of speaking of India used by people in Pakistan and Punjab.
scope: Also called Panjabi, Punjabi, and Punjabi language, this is the way of speaking of India used by
  people in Pakistan and Punjab; other ways of speaking of India are used in other lands.
examples:
- He learned the Panjabi language in Punjab.
- The Panjabi language is spoken in Pakistan and Punjab.
