simpleMeaning: The small round groups that make new plants sit inside a leaf part with a new shape, found
  in some water ferns.
scope: A changed leaf part of some water ferns that holds the groups where new plants start; sporocarp
  is another name for it.
examples:
- The spore case holds the small round groups in the water fern.
- A spore case is a leaf part with a new shape in some water ferns.
