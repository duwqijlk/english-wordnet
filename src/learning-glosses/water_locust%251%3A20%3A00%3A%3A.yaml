simpleMeaning: In the swamps and low river ground of the southern United States grows a tree with short
  oval pods and dark heavy wood.
scope: Also called swamp locust, this is a tree of the swamps and low river ground of the southern United
  States, with short oval pods and dark heavy wood.
examples:
- The water locust stood by the swamp, its pods hanging low.
- We gathered water locust pods from the low river ground.
