simpleMeaning: In cricket, a set of three upright sticks with small pieces of wood across the top, used
  in the game
scope: In cricket, the set of three sticks with small top pieces used in play; not a small gate or small
  opening in a fence or wall.
examples:
- The bowler hit the wicket with a fast ball.
- He stood in front of the wicket and held his bat ready.
