simpleMeaning: to get a book, newspaper or other work ready and bring it out for people to buy or have
scope: 'Also called issue: this is getting a work ready and bringing it out for the public. It is not
  the sense where a writer has their own work brought out.'
examples:
- The company will publish a new newspaper next month.
- They publish books for young readers every year.
