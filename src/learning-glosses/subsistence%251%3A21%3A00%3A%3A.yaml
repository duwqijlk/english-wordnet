simpleMeaning: Barely enough food, money, or other things for a person to stay alive on.
scope: Barely enough to live on, not a comfortable living and not wealth.
examples:
- The family lived on a bare subsistence after the harvest failed.
- His wages gave him no more than a subsistence.
