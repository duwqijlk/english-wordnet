simpleMeaning: to stitch one part to the next, passing the thread over and over in loops
scope: To join parts with looping stitches, not to sew over an edge with long slanting stitches and not
  to make the sky cloudy.
examples:
- She overcast the two halves of the seam before she pressed it flat.
- He overcast the torn lining to the coat, stitch by stitch.
