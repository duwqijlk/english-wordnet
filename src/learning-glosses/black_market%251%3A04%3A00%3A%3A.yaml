simpleMeaning: An illegal trade in which goods or money are bought and sold against the rules on rationing
  or controls.
scope: An illegal trade in which goods or money are bought and sold against the rules on rationing or
  controls; not a lawful open shop and not a simple swap between friends.
examples:
- During the war, butter sold on the black market.
- He bought cigarettes on the black market.
