simpleMeaning: a metal bar or wire that connects several electrical circuits so they share a common link.
scope: This is the metal conductor inside electrical equipment, not a passenger vehicle and not a network
  layout.
examples:
- The power bus carries current to every board in the rack.
- A short in the main bus shut down the whole system.
