synsetId: 00548281-n
simpleMeaning: A jazz singer makes wordless sounds with the voice, aiming to sound like an instrument
  instead of using the words of the song.
scope: Also called scat, this is a jazz style in which the words of a song are replaced by nonsense sounds,
  not a plain rendering of the words.
examples:
- She loves scat singing and often sings along with the band.
- His scat singing turned the old song into sounds with no words at all.
