simpleMeaning: The church meeting in 1179 that condemned the Albigenses and the Waldenses for beliefs
  the church held to be wrong.
scope: This is the church meeting of 1179 that condemned the Albigenses and the Waldenses for beliefs
  the church held to be wrong, not a church meeting of another year.
examples:
- The Third Lateran Council met in 1179.
- The Third Lateran Council condemned the beliefs of the Albigenses.
