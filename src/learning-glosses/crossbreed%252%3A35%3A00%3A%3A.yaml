simpleMeaning: to make young animals or plants by using parents that are of different kinds
scope: Also called cross. This is the act of making young animals or plants from parents of different
  kinds, not the young animal or plant itself.
examples:
- Farmers crossbreed these cows to get more milk.
- She tried to crossbreed the two kinds of rose.
