simpleMeaning: an open boat with a flat bottom, used in water that is not deep, and moved by pushing a
  long pole against the bottom
scope: A flat-bottomed boat moved with a long pole in shallow water, not a kick of a ball and not a bet
  on a race.
examples:
- We hired a punt for an afternoon on the shallow river.
- He pushed the punt slowly along with a long pole.
