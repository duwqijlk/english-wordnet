simpleMeaning: A painful inflammation of the foot, most of all the big toe, from bad uric acid handling,
  which leaves acid and salt build-up in blood and in joints.
scope: This sense is also called gout and gouty arthritis, for a painful inflammation in the big toe and
  foot from faulty uric acid handling, leaving the acid and its salts built up in the blood and joints.
examples:
- Urarthritis swells the big toe.
- Urarthritis comes from uric acid.
