simpleMeaning: a dangerous situation that tends to trap people and destroy them
scope: This is a dangerous situation that is hard to leave, not wet sand in the ground that pulls things
  down into it.
examples:
- Debt became a kind of quicksand for the family, and each month they sank deeper.
- The talks fell into political quicksand and soon ended in failure.
