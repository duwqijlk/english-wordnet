simpleMeaning: A fixed sign sits on a ship's compass and shows which way the ship is heading
scope: Also called lubber's line, lubber's point and lubber line, this is a fixed mark on a ship's compass,
  not a mark on a chart and not a rope on the ship.
examples:
- The lubber's mark showed we were off course.
- He watched the lubber's mark as the ship turned.
