simpleMeaning: Where rock has split on a slant, the upper side seems to have dropped below the lower side.
scope: Also called a common fault or a normal fault, this is a crack on a slant in rock, not a level one.
examples:
- The gravity fault left the upper rock sitting lower than the rock below it.
- Along the gravity fault, the top side had slid down.
