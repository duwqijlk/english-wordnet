simpleMeaning: The poor and developing countries of Asia, Africa, and Latin America taken together
scope: This is the name for the developing countries of Asia, Africa, and Latin America as one group,
  set beside the First World and the Second World.
examples:
- The Third World includes many countries in Asia and Africa.
- Many countries of the Third World are in Latin America.
