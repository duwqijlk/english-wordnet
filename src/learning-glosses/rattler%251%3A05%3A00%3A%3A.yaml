simpleMeaning: a pit viper (a poisonous snake with holes near its eyes that feel heat) with hard parts
  at the end of its tail that make a noise when shaken
scope: 'Also called rattlesnake: this is the snake, not a train of freight cars, which is another sense
  of the same word.'
examples:
- A rattler lay still beside the path, its tail shaking.
- We heard the rattler before we saw it among the rocks.
