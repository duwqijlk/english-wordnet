simpleMeaning: something so foul that your senses or your feelings turn away from it in disgust
scope: The quality of being foul to the senses or feelings, not the lack of moral or spiritual values
  and not the quality of being wicked.
examples:
- The wickedness of his language surprised us.
- The wickedness of the smell drove everyone from the room.
