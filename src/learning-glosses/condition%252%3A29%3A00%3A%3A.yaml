simpleMeaning: To put a smoothing product on something so that its surface becomes smooth and shiny.
scope: The verb for adding a smoothing product that leaves a surface sleek and glossy; it is not improving
  something's general state, not training a person's or animal's behaviour, not the research factor varied
  in an experiment, and not the noun for a level of fitness.
examples:
- I always condition my hair after shampooing.
- This treatment conditions dry hair without leaving it greasy.
