simpleMeaning: A hand tool made of a turning rod with a handle set beside it
scope: A hand tool with a turning rod and a handle beside it, also called a crank; not the live mix that
  starts souring, not the first course, and not the motor that starts an engine.
examples:
- He used a starter to turn the old engine by hand.
- The starter's handle turned the rod with each pull.
