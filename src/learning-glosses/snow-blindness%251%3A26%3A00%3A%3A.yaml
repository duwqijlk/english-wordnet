simpleMeaning: A short-lived loss of sight caused by bright sunlight bouncing off ice and frozen water
scope: A short-lived loss of sight caused by bright sunlight bouncing off ice and frozen water, also called
  snowblindness; not lasting damage to the eyes and not poor sight from birth.
examples:
- Snow-blindness struck the climber after hours on the bright glacier.
- He wore dark glasses to guard against snow-blindness.
