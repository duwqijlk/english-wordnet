simpleMeaning: in a way that copies what others have done and adds nothing new
scope: In a way that copies others and adds nothing new, as opposed to an original way of doing it.
examples:
- He wrote unoriginally, copying lines from older books.
- She painted unoriginally, repeating the same old scenes.
