simpleMeaning: A plant of wet ground, resembling grass, whose tube-shaped stems are often hollow.
scope: This is the plant sense of rush, a wetland grass-like growth, not the hurried-movement noun or
  the sudden-flow noun.
examples:
- Tall rushes grew along the edge of the pond.
- They cut bundles of rushes to weave baskets.
