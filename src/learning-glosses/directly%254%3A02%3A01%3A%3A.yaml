simpleMeaning: In an open, honest way, saying what one really thinks without hiding it.
scope: 'Tells how a person speaks or answers: openly and honestly; not a straight path with no bends,
  not something done with nothing in between, and not something happening at once.'
examples:
- She asked him directly whether he had read the report.
- He told me directly that the plan would not work.
