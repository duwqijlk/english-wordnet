simpleMeaning: Round fruit and pears get reddish-brown spots from this fungus, and other fruit too.
scope: Also called apple rust, this is a fungus that makes reddish-brown spots on round fruit, pears and
  other fruit too, not the reddish-brown crust on old metal.
examples:
- Cedar-apple rust left reddish-brown spots on the apples.
- The pears were marked by cedar-apple rust.
