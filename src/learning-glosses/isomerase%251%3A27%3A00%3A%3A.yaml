senseId: 'isomerase%1:27:00::'
synsetId: 14948497-n
simpleMeaning: a substance in living things that speeds up a change, turning what it acts on into a form
  with the same parts in a new order
scope: An enzyme that speeds the change of a substance into a form with the same parts in a new order;
  it does not build new substances or break substances down.
examples:
- The isomerase in the sample changed the sugar into a new form.
- Researchers added an isomerase to turn the compound into a form with the same parts in a new order.
