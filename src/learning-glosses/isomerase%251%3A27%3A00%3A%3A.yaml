simpleMeaning: The stuff it acts on ends up in a form with the same parts set out in a new way, and this
  substance in living things speeds that change
scope: A substance that speeds the change of a stuff into a form with the same parts in a new order; not
  a substance that builds new stuff and not a substance that breaks stuff down.
examples:
- The isomerase in the sample changed the sugar into a new form.
- Researchers added an isomerase to turn the compound into a form with the same parts in a new order.
