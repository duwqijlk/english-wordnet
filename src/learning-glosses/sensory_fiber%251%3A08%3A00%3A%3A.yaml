simpleMeaning: a thin cord that carries signals toward the brain and the cord of nerves down the back
scope: A thin cord that carries signals toward the brain and the cord of nerves down the back, also called
  an afferent fiber; not the whole nerve that carries the signals, and not a cord that carries orders
  out to the muscles.
examples:
- A sensory fiber carried the signal from her fingertip to her brain.
- When the sensory fiber was cut, he could no longer feel the touch.
