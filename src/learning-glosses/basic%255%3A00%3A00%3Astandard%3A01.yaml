simpleMeaning: Cut down to the simplest form that still works for every important case, with nothing essential
  left out.
scope: This is not the noun for an everyday product that people must always buy; it describes something
  cut down to its simplest useful form.
examples:
- The manual gives a basic explanation of how the engine works.
- We need a basic model of the process before we add any detail.
