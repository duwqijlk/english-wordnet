simpleMeaning: a worldwide system of computer networks joined to each other, using one set of rules called
  TCP/IP to send and share data
scope: 'Also called net and internet: the worldwide system for sharing data between computers, not a single
  computer and not a single website.'
examples:
- People meet, work, and share photos in cyberspace every day.
- She found the old article somewhere in cyberspace.
