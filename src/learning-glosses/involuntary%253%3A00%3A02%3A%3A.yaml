simpleMeaning: done by the body on its own, with no thought behind it, through the nerve system that works
  on its own
scope: Done by the body with no thought behind it, not something done on purpose.
examples:
- The involuntary muscles in his gut kept working while he slept.
- She gave an involuntary start at the loud bang.
