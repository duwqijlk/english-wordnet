simpleMeaning: in a way that shows something is exactly right, with nothing different or wrong
scope: 'Also called just, exactly, and properly: this word stresses that something is exactly as said,
  not the sense of doing something in a careful, exact way.'
examples:
- That is precisely what I meant.
- The jewel was gone, precisely as he had said.
