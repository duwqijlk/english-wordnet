simpleMeaning: One of many kinds in the group called Zinnia, this plant is grown for heads of blooms in
  many bright colours.
scope: Gardeners also call this plant old maid and zinnia, and grow it for heads of blooms in many bright
  colours.
examples:
- The old maid flower bore heads of blooms in many bright colours.
- One old maid flower grew heads of bright blooms.
