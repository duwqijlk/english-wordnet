simpleMeaning: The sun travels across the sky each year along a path in the plane of the earth's way round
  the sun, leaning about 23 degrees from the equator.
scope: This is the sun's yearly path in the sky, tilted against the equator, and it is not the equator
  itself.
examples:
- All the planets move round the sun in almost the same ecliptic.
- The sun stays on the ecliptic all year.
