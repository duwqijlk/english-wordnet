simpleMeaning: A wild man who cuts off the top part of a foe's body and keeps it as a sign of victory.
scope: One who cuts off and keeps the top part of a foe's body as a sign of victory, also called headhunter;
  not a hunter of animals and not a soldier who takes prisoners.
examples:
- The head-shrinker kept the shrunken heads of his enemies as trophies.
- Stories told of a head-shrinker who dried the heads of fallen foes.
