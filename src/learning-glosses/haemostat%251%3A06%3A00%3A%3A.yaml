simpleMeaning: A tool used in surgery that pinches a blood tube shut to stop blood from flowing out.
scope: This is a tool that pinches a blood tube shut in surgery, not a bandage or a stitch; also called
  hemostat.
examples:
- The surgeon clamped the vessel with a haemostat.
- She passed the haemostat to the surgeon during the operation.
