simpleMeaning: one ten billionth of a meter, or 0.0001 micron, is the length of this metric unit, used
  for the wavelengths of electromagnetic radiation
scope: 'Also called angstrom: a tiny unit of length used for wavelengths, not a unit of weight or of everyday
  length.'
examples:
- The angstrom unit is used for wavelengths too small for nanometres.
- Scientists gave the bond length in angstrom units.
