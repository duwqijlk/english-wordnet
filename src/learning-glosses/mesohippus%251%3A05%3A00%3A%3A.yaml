simpleMeaning: A three-toed animal of North America from the Oligocene, a time long ago, probably not
  a direct ancestor of the modern horse.
scope: A three-toed animal of North America from the Oligocene, a time long ago, probably not a direct
  ancestor of the modern horse; not a modern horse and not a horse alive today.
examples:
- The mesohippus lived in North America long before modern horses.
- A mesohippus had three toes on each foot.
