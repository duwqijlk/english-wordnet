simpleMeaning: A polite set phrase said when meeting or leaving someone, wishing them a pleasant time
  later in the day.
scope: This is the greeting or farewell formula itself; it is not the part of the day, and not a general
  wish for a good day.
examples:
- He tipped his hat and said, 'Good afternoon, madam.'
- '''Good afternoon,'' she called as she left the office.'
