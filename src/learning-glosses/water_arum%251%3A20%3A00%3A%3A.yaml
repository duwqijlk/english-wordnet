simpleMeaning: a plant of wet lands and bogs in mild lands, with small greenish flowers half hidden in
  a white leaf-like sheath and red berries
scope: 'Also called wild calla: a plant of wet lands and bogs in mild lands, with small greenish flowers
  and red berries; not a garden flower, and not a plant of dry ground.'
examples:
- Water arum grows in the bog, its white sheath half hiding the small flowers.
- We found water arum with red berries by the wet path.
