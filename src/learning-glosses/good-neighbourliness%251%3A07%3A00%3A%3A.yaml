simpleMeaning: the people who live near you get kind words and real help from someone who likes to look
  after them
scope: 'Also called good-neighborliness, neighborliness and neighbourliness: the people near you get kind
  words and real help, not just a wave in passing and not a friendship with one person.'
examples:
- His good-neighbourliness showed when he cleared snow from the path next door.
- Good-neighbourliness kept the whole street in touch with one another.
