senseId: 'valgus%1:26:00::'
synsetId: 14492277-n
simpleMeaning: a shape fault in which part of an arm or leg is pushed out of line, away from the middle
  of the body
scope: A fault in the shape of an arm or leg that turns part of it away from the middle of the body, not
  a break and not a fault that turns part of it toward the middle.
examples:
- The valgus in his knee made his lower leg angle outward.
- Her valgus foot turned away from the middle of her body.
