simpleMeaning: A thin strip with small round shapes along it, used on the edge of furniture to make it
  look better
scope: 'Also called bead, beadwork, or astragal: this is a fixed strip on furniture, not loose round pieces
  worn or sewn on cloth.'
examples:
- The old chair has beading along the edge of its back.
- She chose a table with beading around the top to make it look nice.
