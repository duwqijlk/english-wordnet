simpleMeaning: 'Sudden damage to the breathing organs: coughing, crackling sounds, inflamed tissue that
  stiffens and turns fibrous, unable to take in oxygen; seen in people breathing harsh chemical vapors
  or ammonia.'
scope: 'This is a distinct condition: sudden injury to the breathing organs from harsh chemical irritants,
  related to but not identical with adult respiratory distress syndrome and wet lung; not the newborn
  disease that stops the lungs expanding.'
examples:
- The factory workers were diagnosed with white lung after years near chlorine leaks.
- White lung left him unable to climb a flight of stairs.
