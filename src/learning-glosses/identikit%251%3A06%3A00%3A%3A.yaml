schema: oewn-learning-gloss-v2
senseId: 'identikit%1:06:00::'
synsetId: 03564711-n
simpleMeaning: A picture of a face built from what witnesses tell the police, made by putting together
  clear sheets showing different parts of the face
scope: This face picture is also called an Identikit picture; it is not a photograph and not a drawing
  made from life.
examples:
- The police made an Identikit of the man from the witness's words.
- An Identikit helped them find the suspect.
