simpleMeaning: a strong closed container that does not let air in or out, used to measure the heat given
  off when something burns
scope: This is a strong closed container used in tests to measure heat from burning, not a weapon that
  blows up and not an event that fails badly.
examples:
- The scientists put the fuel in a bomb to measure the heat it gave off when it burned.
- A bomb was used in the lab to find how much heat the coal made as it burned.
