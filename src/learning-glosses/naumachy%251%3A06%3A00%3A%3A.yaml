scope: A staged sea fight on water, put on for show by the people of ancient Rome, with naumachia as another
  name for this sense, not a real battle at sea.
examples:
- The naumachy ended with the ships rowing in a circle around the pool.
- In the naumachy, men fought a sea battle that was only for show.
