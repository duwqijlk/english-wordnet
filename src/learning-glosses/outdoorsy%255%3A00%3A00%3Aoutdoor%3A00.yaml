simpleMeaning: typical of a life spent outside, or right for such a life
scope: It describes a person or way of life linked to time spent outside; it is not a wild place itself
  and not just a single event held outside.
examples:
- She is an outdoorsy person who hikes and camps most weekends.
- They chose an outdoorsy life in a small mountain town.
