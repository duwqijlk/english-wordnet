simpleMeaning: Marked by very strong feelings or beliefs, tending to answer with force, and full of eager,
  intense feeling
scope: 'Also called fierce, and another name for it is violent: very strong feeling, not a thing being
  torn and not a mild feeling.'
examples:
- He spoke with tearing rage about the unfair decision.
- Her tearing loyalty to her friends never wavered.
