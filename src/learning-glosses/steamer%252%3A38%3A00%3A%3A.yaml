simpleMeaning: to move from place to place by the power of hot mist from boiling water
scope: To move from place to place by the power of hot mist from boiling water, also called steam; not
  to cook food by hot mist and not to move by wind.
examples:
- The ship steamed off into the Pacific.
- The old boat steamed slowly up the river.
