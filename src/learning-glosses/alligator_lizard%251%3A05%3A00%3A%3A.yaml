simpleMeaning: Of the west of North America, a slim animal with short legs has a fold of its own down
  each side that lets its body stretch.
scope: It is a slim short-legged animal of the west of North America, with a fold down each side that
  lets its body stretch, and it is not a true alligator or a lizard of the east.
examples:
- The alligator lizard stretched its body as it moved.
- We saw an alligator lizard in the west of North America.
