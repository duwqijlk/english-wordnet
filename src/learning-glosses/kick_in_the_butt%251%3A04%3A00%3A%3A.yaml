simpleMeaning: A punishment in which a person is hit in the backside with a foot
scope: A punishment dealt with a foot to the backside, not a hit to another part of the body and not a
  punishment by words.
examples:
- He got a kick in the butt for his rude remark.
- The coach gave the lazy player a kick in the butt.
