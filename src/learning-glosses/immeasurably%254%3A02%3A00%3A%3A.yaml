simpleMeaning: to a degree so great that it cannot be counted or put in numbers
scope: To a degree so great that it cannot be counted, not just to a large degree that can still be counted.
examples:
- Her help changed his life immeasurably.
- The city has grown immeasurably in the last ten years.
