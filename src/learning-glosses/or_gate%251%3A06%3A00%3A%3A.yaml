simpleMeaning: A switch in a computer that gives out a signal when any one of its inputs gives out a signal.
scope: Also called OR circuit; a computer switch that fires when any input fires.
examples:
- The OR gate fired when the first input came on.
- An OR gate lets a signal through if any input is on.
