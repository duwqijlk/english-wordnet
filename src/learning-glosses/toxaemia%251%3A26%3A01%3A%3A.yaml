simpleMeaning: High blood pressure, swelling, and protein in the urine mark this state in pregnancy that
  is not as it should be.
scope: This state in pregnancy is also called toxaemia of pregnancy, toxemia, or toxemia of pregnancy.
examples:
- In pregnancy, toxaemia can bring high blood pressure.
- The toxaemia showed in high blood pressure and swelling during the pregnancy.
