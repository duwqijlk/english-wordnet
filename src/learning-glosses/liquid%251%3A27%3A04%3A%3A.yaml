simpleMeaning: a thing that is in the flowing state at usual room heat and air pressure
scope: A thing in the flowing state at usual room heat and air pressure, not the state itself, and not
  a sound in speech.
examples:
- Water is a liquid at room temperature.
- Oil is a liquid that pours slowly from the bottle.
