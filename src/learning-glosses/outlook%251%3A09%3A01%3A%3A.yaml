simpleMeaning: A person's usual way of thinking that shapes how they see and answer what happens to them
scope: A usual way of thinking about life; mindset and mentality are other names for this sense, not a
  view of a place.
examples:
- Her outlook on life was bright and hopeful.
- His outlook changed after years of travel.
