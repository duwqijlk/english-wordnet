simpleMeaning: Any set of signs used to write amounts, such as figures or letters.
scope: Any set of signs used to write amounts; number representation system is another name for this;
  not a way of counting on the fingers, and not a single figure on its own.
examples:
- The decimal number system uses ten figures.
- Binary is a number system that uses only two signs.
