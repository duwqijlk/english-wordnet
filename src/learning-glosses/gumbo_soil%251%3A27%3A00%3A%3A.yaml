simpleMeaning: Full of water, any of several fine, dusty kinds of earth turn to waxy, very sticky mud.
scope: Also called gumbo, this earth turns to waxy, very sticky mud when it is full of water.
examples:
- After the rain, the gumbo soil stuck to our boots.
- We crossed the gumbo soil in our boots after the rain.
