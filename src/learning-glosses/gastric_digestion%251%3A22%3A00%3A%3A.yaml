simpleMeaning: how proteins are broken down in the stomach by the juices there
scope: This is the breaking down of proteins in the stomach by its juices, not the chewing of food in
  the mouth and not the later work of the gut.
examples:
- Gastric digestion begins when stomach juices act on the protein in a meal.
- Gastric digestion slows when the stomach makes too little juice.
