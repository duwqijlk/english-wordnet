simpleMeaning: Sweet yellow flowers shaped like funnels bloom on this woody vine, which keeps its leaves
  all year, in the southeast of the United States, and the plant is poisonous.
scope: 'Also called evening trumpet flower and yellow jessamine: a poisonous evergreen vine of the southeastern
  United States.'
examples:
- The yellow jasmine opened its yellow flowers.
- Do not let the children pick the yellow jasmine, for it is poisonous.
