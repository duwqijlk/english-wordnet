simpleMeaning: the quality of having a taste that makes food pleasing to eat
scope: The quality of tasting good and making food pleasing to eat; flavoursomeness is another name for
  this sense, not the smell of food and not how much food there is.
examples:
- The flavorsomeness of the soup kept us asking for more.
- Roasting gave the meat a flavorsomeness we all enjoyed.
