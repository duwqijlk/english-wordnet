simpleMeaning: small markers pushed into a surface to show a score or to mark a place
scope: Small markers pushed into a surface to show a score or a place, not a small piece of wood or metal
  used to hold things together and not a piece of jewellery worn on clothes.
examples:
- She moved the pin on the map to mark the town.
- The pin on the board showed his score for the round.
