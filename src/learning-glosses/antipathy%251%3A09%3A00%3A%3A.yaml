simpleMeaning: a person or thing that someone hates very strongly and wants to stay away from
scope: This is the person or thing that is hated, not the strong feeling of hate itself.
examples:
- Cats were his greatest antipathy, so he never visited houses with pets.
- Public speaking was her antipathy, and she avoided it whenever she could.
