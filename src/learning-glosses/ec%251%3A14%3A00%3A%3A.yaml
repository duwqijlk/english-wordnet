simpleMeaning: A group of European states set up after World War II to cut trade walls and work more closely
  with each other.
scope: This is the group of European states formed after the Second World War to ease trade, also called
  the European Union, the EU, the Common Market, the EEC, the European Community, the European Economic
  Community, and Europe; it is not a world body or a single state.
examples:
- Britain joined the EC in 1973.
- The EC cut trade walls between its member states.
