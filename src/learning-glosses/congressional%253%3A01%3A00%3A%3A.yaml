simpleMeaning: about or to do with the group of people chosen to make the laws of a country
scope: This is about the group of people chosen to make a country's laws, not about a large meeting for
  talks and not about a local law-making group.
examples:
- The congressional hearing lasted all day.
- Congressional leaders met to talk about the new law.
