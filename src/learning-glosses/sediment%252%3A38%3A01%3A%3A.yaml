simpleMeaning: to lay down small solid bits as a layer at the bottom
scope: Putting such bits down as a layer at the bottom. It is not the bits themselves falling and staying
  there, and not the name for the bits themselves.
examples:
- The slow river sedimented fine sand along its banks.
- Each flood sedimented a thin layer of mud on the fields.
