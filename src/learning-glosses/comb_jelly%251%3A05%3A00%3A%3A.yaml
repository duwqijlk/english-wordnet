simpleMeaning: a jellyfish-like marine animal, symmetrical in two planes, that swims by beating eight
  rows of tiny hairs set like comb teeth; it lives alone and is both male and female.
scope: 'Another name for ctenophore: the jellyfish-like sea animal that moves by rows of beating hairs
  and is both male and female. Not a true jellyfish, which swims by pulsing.'
examples:
- A comb jelly drifted near the surface, its eight rows of beating hairs catching the light.
- The aquarium kept a single comb jelly, which needs no mate because it is both male and female.
