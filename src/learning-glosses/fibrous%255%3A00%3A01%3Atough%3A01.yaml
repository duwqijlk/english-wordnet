simpleMeaning: Meat threaded through with sinew, especially impossible to chew.
scope: Also called stringy or sinewy, this is meat threaded through with sinew, especially impossible
  to chew, not the use for a thing with fibres like those of jute, especially fibres used for making rope.
examples:
- The meat was fibrous, and they could barely chew it.
- The old hen was fibrous, tough with sinew.
