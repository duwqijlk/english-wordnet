simpleMeaning: A long spear with a handle and a hooked point, thrown to catch big fish or whales, with
  a strong rope tied to it
scope: A thrown spear for catching whales and big fish, not a plain fishing spear and not the act of throwing
  one.
examples:
- The harpoon struck the whale and held fast.
- He threw the harpoon from the front of the boat.
