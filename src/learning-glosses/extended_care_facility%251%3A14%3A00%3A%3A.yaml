simpleMeaning: People who stay ill for a long time, or who are getting better after a sudden bad illness,
  get medical help here over a long time.
scope: This place exists for people who need medical help over a long time, while they stay ill or get
  better after a sudden bad illness.
examples:
- He stayed in an extended care facility while he got better after his illness.
- The extended care facility looks after people who need help for a long time.
