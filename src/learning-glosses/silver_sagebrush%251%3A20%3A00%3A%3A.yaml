simpleMeaning: a short plant with many branches that comes back year after year in the west of the United
  States, with pale leaves; an important plant for food and cover
scope: A low plant of the western United States, also called gray sage, grey sage and silver sage; not
  a garden herb and not a tree.
examples:
- The silver sagebrush grew beside the trail.
- Rabbits hid in the silver sagebrush from the hawk.
