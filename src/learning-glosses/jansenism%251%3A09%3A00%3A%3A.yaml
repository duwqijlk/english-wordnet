simpleMeaning: 'A teaching of the Roman Catholic Church from one churchman and his followers: only those
  under God''s fixed plan are saved, and the rest are lost for ever'
scope: A Roman Catholic teaching about who is saved, set apart from other teachings by its claim that
  only those under God's fixed plan are saved.
examples:
- Jansenism held that only a few are saved under God's fixed plan.
- The priest warned that Jansenism gave a hard view of who is saved.
