simpleMeaning: In grammar, the putting of one word-part after another, as a word that adds sense after
  the word it adds sense to, or a bit added after its base.
scope: In grammar, for a word or word-part placed after the word it goes with.
examples:
- A postposition comes after the word it goes with.
- Postpositions follow their words.
