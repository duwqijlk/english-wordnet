simpleMeaning: to make a thought or feeling known in words, or through a cry, shout, or other sound.
scope: This is not showing a feeling indirectly through art or appearance, and not being the medium that
  carries a meaning.
examples:
- The crowd expressed its delight with a roar.
- She expressed her joy with a loud shout.
