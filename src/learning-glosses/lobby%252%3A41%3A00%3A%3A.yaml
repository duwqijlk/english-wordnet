simpleMeaning: To hold a person back in talk, as if by a grip on their clothes, to get them to do you
  a favour for money or for power
scope: Holding a person in talk to win a favour, not the room at the door and not a group that tries to
  change a law.
examples:
- He lobbied the minister in the hall, keeping him in talk long after the meeting had ended.
- She lobbied her old friend at the door, holding him in talk until he agreed to help.
