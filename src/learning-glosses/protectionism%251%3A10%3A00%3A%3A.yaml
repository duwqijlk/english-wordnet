simpleMeaning: a plan by a state to put taxes or limits on goods from other lands so that its own makers
  are kept safe from outside makers
scope: A plan by a state to put taxes or limits on goods from other lands to keep its own makers safe;
  not free trade, and not a ban on all goods from other lands.
examples:
- Protectionism kept the cheap cloth out of the home market.
- The new leaders turned to protectionism to save the steel works.
