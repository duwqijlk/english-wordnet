senseId: 'adult-onset_diabetes_mellitus%1:26:00::'
synsetId: 14142418-n
simpleMeaning: A mild blood-sugar disease that develops slowly in adults; obesity, stress, menopause or
  other factors can trigger it; diet and blood-sugar-lowering drugs (hypoglycemic agents) usually control
  it without insulin.
scope: This is an old name for type 2 diabetes, the adult form that often needs no insulin; it is not
  type 1 diabetes, which requires insulin from the start, nor the diabetes that appears only during pregnancy.
examples:
- In the 1980s my aunt was told she had adult-onset diabetes mellitus and would not need insulin.
- Older medical texts use adult-onset diabetes mellitus for the same illness most people now call type
  2.
