simpleMeaning: In embryology, the splitting again and again of an egg cell after a male cell has joined
  with it
scope: 'Also called cleavage: in embryology, the splitting of an egg cell again and again after a male
  cell has joined with it, not the general act of dividing or splitting something into parts.'
examples:
- Segmentation begins soon after the egg is fertilised, as one cell splits into many.
- In this stage of segmentation, the cells keep dividing again and again.
