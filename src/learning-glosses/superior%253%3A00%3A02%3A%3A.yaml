simpleMeaning: very good in quality, or very good at doing something
scope: About very good quality, or being very good at doing something. It is not the sense about a high
  position or importance, and not the fighter who can beat rivals.
examples:
- Her superior work on the house won much praise.
- He is a superior student who does very well in maths.
