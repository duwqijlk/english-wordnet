simpleMeaning: a living thing that feeds on dead plant and animal matter, especially a fungus or a bacterium
scope: A living thing that feeds on dead matter, especially a fungus or a bacterium; saprophytic organism
  is another name for this sense, not a parasite that feeds on a living host and not a plant that makes
  its own food.
examples:
- A saprophyte feeds on dead leaves and fallen wood.
- The fungus in the log is a saprophyte, living off dead matter.
