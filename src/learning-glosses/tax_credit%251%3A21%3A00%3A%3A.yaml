simpleMeaning: a cut in the money a person owes the government, made straight from the amount owed and
  not based on how much they earn
scope: A cut made straight from the amount owed, not a cut in the income that is counted for tax and not
  a lower rate for low earners.
examples:
- The new tax credit cut 500 pounds from the tax she owed.
- His tax credit took 300 dollars off the amount he had to pay in tax.
