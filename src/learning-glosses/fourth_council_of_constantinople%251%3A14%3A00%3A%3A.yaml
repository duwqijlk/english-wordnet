simpleMeaning: the meeting in 869 that condemned Photius, who had become head of the eastern church without
  the Vatican's approval, and brought on the split between the eastern and western churches
scope: The meeting in 869 that condemned Photius, who had become head of the eastern church without the
  Vatican's approval, also called Constantinople; not the first meeting of its kind and not a meeting
  about belief alone.
examples:
- The Fourth Council of Constantinople met in 869.
- Photius was condemned by the Fourth Council of Constantinople.
