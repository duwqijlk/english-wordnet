simpleMeaning: A gun can be found from the one-of-a-kind marks it leaves on the bullet it fires and the
  case it throws out.
scope: 'Also called ballistic fingerprinting and bullet fingerprinting: finding the gun that fired a bullet
  from the marks it leaves on the bullet and the case.'
examples:
- Ballistic identification showed that one gun had fired both bullets.
- They used ballistic identification to name the gun behind the shot.
