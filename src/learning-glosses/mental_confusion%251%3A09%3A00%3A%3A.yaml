senseId: 'mental_confusion%1:09:00::'
synsetId: 05691387-n
simpleMeaning: a state in which a person cannot think or act in a clear, ordered way
scope: A state in which thought and acts lack clear order; not a lasting low power of thought, and not
  a troubled state of upset and disorientation.
examples:
- His mental confusion made it hard for him to follow the talk.
- After the fall, her mental confusion lasted for hours.
