simpleMeaning: a set of drawings in a row that tell a story in a paper or a book
scope: This is a set of drawings in a row that tell a story; cartoon strip, funnies and strip are other
  names for this sense, and it is not one drawing on its own.
examples:
- He reads the comic strip in the morning paper every day.
- The comic strip told the tale of a lost dog in four small drawings.
