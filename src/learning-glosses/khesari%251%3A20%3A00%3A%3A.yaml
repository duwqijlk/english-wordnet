simpleMeaning: A plant from Europe that lives for one year, grown to feed farm animals; its seeds are
  eaten as food in India and fed to farm animals elsewhere
scope: This is a plant from Europe that lives for one year, grown to feed farm animals, its seeds eaten
  as food in India; grass pea is another name for this sense, not a plant grown for its flowers and not
  a tree.
examples:
- Farmers grow khesari to feed their animals.
- Khesari seeds are eaten as food in India.
