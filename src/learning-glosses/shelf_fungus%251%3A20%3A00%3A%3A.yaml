simpleMeaning: a woody growth that forms flat parts like ledges on tree trunks and wooden frames, and
  makes spores there
scope: A woody growth that forms flat parts like ledges on tree trunks and wooden frames, also called
  a bracket fungus; not a mushroom that can be eaten and not a shelf on a wall.
examples:
- A shelf fungus grew on the old oak trunk.
- The shelf fungus formed flat ledges on the dead tree.
