simpleMeaning: to cover or hide something so that it cannot be seen or understood
scope: 'Also called hide, obscure, and obliterate: to make something so hidden that it cannot be seen
  or understood, not a cloth or thin covering and not putting a cloth over something.'
examples:
- Fog veiled the road so drivers could not see ahead.
- His polite words veiled a hidden threat.
