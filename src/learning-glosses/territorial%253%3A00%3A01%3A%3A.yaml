senseId: 'territorial%3:00:01::'
synsetId: 02418296-a
simpleMeaning: guarding one's own area of land and keeping out people or animals that try to come into
  it
scope: Describing an animal or person that guards its own area of land, not just belonging to an area
  of land, and not a soldier or an army unit.
examples:
- The dog is territorial and barks at strangers near the house.
- These birds are strongly territorial in spring and chase other birds away.
