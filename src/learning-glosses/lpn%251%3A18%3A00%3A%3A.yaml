simpleMeaning: A nurse with enough training to get a state licence and give everyday care to sick people.
scope: Also called licensed practical nurse or practical nurse; a nurse trained sufficiently for a state
  licence to provide routine care to sick people.
examples:
- She works as an LPN at the hospital.
- After her training, she became an LPN.
