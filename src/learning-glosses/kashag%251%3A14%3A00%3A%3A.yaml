simpleMeaning: A group that gives advice to the government of Tibet, a government that has left its own
  land.
scope: A group that gives advice to a government in exile, not the government itself and not a group that
  makes the laws.
examples:
- The Kashag gave advice to the Tibetan government on the new plan.
- He was chosen to serve on the Kashag.
