simpleMeaning: To keep people well, the government sets rules on what must be done, as with pipes and
  drains, and keeps them in force
scope: Rules set and kept in force by the government on what must be done to keep people well, not a law
  about crime and not advice a doctor gives.
examples:
- The new health code requires restaurants to keep food cold.
- Plumbers must follow the health code when they fit new pipes.
