simpleMeaning: fat from the back, sides and belly of a pig, kept by curing
scope: Fat cut from a pig and kept by curing; not fresh pork meat and not bacon made from the belly alone.
examples:
- She fried a piece of salt pork to flavor the beans.
- The old recipe calls for salt pork instead of butter.
