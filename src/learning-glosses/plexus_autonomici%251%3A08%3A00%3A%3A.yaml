simpleMeaning: A net of nerve threads from the two systems that run the body without thought, one that
  speeds it up and one that slows it down
scope: A net of nerve threads from the two systems that run the body without thought; also called autonomic
  plexus; not a net of nerves that move the arms and legs by choice.
examples:
- The plexus autonomici helps keep the heart beating steadily.
- Damage to the plexus autonomici can upset digestion.
