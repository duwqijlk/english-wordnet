simpleMeaning: one of several colouring powders of a warm gold colour made from lead and its compounds
scope: One of several colouring powders made from lead and its compounds, not a plain yellow dye and not
  a colouring powder made without lead.
examples:
- The artist mixed chrome yellow into the paint for the sunlit wall.
- Chrome yellow gave the old poster its bright golden tone.
