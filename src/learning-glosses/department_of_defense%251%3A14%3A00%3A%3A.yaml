simpleMeaning: A part of the United States government that looks after the safety of the country, made
  in nineteen forty-seven.
scope: Also called the United States Department of Defense, it keeps the country safe, not the department
  that deals with other countries.
examples:
- The Department of Defense looks after the safety of the country.
- The Department of Defense was made in nineteen forty-seven.
