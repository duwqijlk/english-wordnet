simpleMeaning: a piece of footwear that rises halfway up the leg toward the knee
scope: Footwear that rises halfway up the leg toward the knee, also called a buskin, a desert boot and
  a half boot, and not a low shoe or a full-length boot.
examples:
- He laced up his combat boots, which rose halfway to his knees, before the long march.
- Her combat boot reached halfway up to her knee and kept out the mud.
