simpleMeaning: An exercise in gymnastics, done on the rings, where a person holds the body up with both
  arms stretched straight out to the sides
scope: This is a move on the rings in gymnastics, not a cross used as a sign of the Christian religion.
examples:
- The gymnast held a crucifix on the rings for three seconds.
- He learned the crucifix after months of training on the rings.
