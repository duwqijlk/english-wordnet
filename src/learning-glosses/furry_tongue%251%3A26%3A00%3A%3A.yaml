senseId: 'furry_tongue%1:26:00::'
synsetId: 14335228-n
simpleMeaning: A harmless side effect of some drugs that kill germs, in which the small raised spots in
  the mouth grow dark and look hairy.
scope: This is a harmless dark growth in the mouth after some drugs, also called black tongue or hairy
  tongue; not a sore mouth, and not a sign of a sickness in the body.
examples:
- His furry tongue cleared up a week after he stopped the drug.
- The drug gave her a furry tongue that looked dark and hairy.
