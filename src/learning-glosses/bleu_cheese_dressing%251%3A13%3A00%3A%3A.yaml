simpleMeaning: A thick sauce for salads with bits of a strong blue-veined curd in it.
scope: A thick sauce for salads with bits of a strong blue-veined curd in it; blue cheese dressing is
  another name for this sense, not a thin oil sauce and not a sauce made with white curd.
examples:
- She poured bleu cheese dressing over the salad.
- The bleu cheese dressing has bits of strong curd in it.
