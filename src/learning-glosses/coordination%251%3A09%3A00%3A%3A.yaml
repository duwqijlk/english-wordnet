simpleMeaning: the way the parts of the body move well together, in smooth and good order
scope: The way body movements work well together, not the joining of parts into one plan, and not words
  of the same rank in grammar.
examples:
- The dancer showed fine coordination as she turned and leapt.
- Good coordination helps a child catch a ball with both hands.
