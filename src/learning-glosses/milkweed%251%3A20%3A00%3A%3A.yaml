simpleMeaning: any of many plants in the Asclepias group, with white, milk-like juice and pods that split
  open to free seeds with soft, light tufts
scope: Also called silkweed. This is the plant with white, milk-like juice and soft, light seeds, not
  the sow thistle with yellow flowers that shares the same name.
examples:
- Milkweed grows wild along the road in summer.
- The pods of the milkweed split open and let the soft seeds blow away.
