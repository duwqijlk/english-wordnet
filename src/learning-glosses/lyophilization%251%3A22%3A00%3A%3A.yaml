simpleMeaning: The ice in frozen food, blood plasma, drugs, or tissue turns straight to gas in a vacuum,
  so the stuff dries out and keeps its shape.
scope: Also called freeze-drying and lyophilisation; the ice in frozen food, blood plasma, drugs, or tissue
  turns straight to gas in a vacuum, so the stuff dries out and keeps its shape.
examples:
- Lyophilization turns the ice in the sample straight to gas.
- They chose lyophilization because the dried food keeps its shape.
