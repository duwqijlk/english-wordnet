senseId: 'inaccessibly%4:02:00::'
synsetId: 00205818-r
simpleMeaning: in a way that is hard or impossible to reach
scope: Doing or placing something so that it is hard or impossible to reach; not merely far away and not
  hidden on purpose.
examples:
- The hut stood inaccessibly on the top of a mountain.
- The papers were stored inaccessibly, high on a locked shelf.
