simpleMeaning: To move marks for folds, and the like, from a paper shape to the stuff being sewn, a loose
  looped stitch is used in sewing.
scope: This is the loose looped stitch that moves marks for folds from a paper shape to the stuff being
  sewn.
examples:
- She put a tailor's tack through the cloth to mark the fold.
- A tailor's tack held the mark in place till the cloth was cut.
