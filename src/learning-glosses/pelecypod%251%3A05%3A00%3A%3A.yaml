simpleMeaning: Inside two shells joined by a hinge lives a sea or fresh-water soft-bodied kind with flat
  gills.
scope: A bivalve and a lamellibranch are other names for this soft-bodied kind, living inside two shells
  joined by a hinge.
examples:
- The pelecypod has flat gills inside its two shells.
- A pelecypod lives in sea water or fresh water.
