simpleMeaning: a motor that burns fuel inside it, with its tubes set in a ring round a box in the middle
scope: 'Also called a radial engine: a motor with its tubes in a ring round the middle, not a motor with
  its tubes in a straight line and not a steam motor.'
examples:
- The old plane flew with a rotary engine.
- The mechanic opened the rotary engine to check the ring of tubes.
