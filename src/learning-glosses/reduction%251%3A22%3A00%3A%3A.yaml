  oxygen leaves or hydrogen joins, always with the opposite change in the giver
scope: 'Also called reducing: in chemistry, the taking up of electrons by an atom, not making something
  smaller or simpler.'
examples:
- The reduction of the ore took place in the furnace.
- We learned how reduction adds electrons to an atom in class.
