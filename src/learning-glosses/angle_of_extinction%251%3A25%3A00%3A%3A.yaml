senseId: 'angle_of_extinction%1:25:00::'
synsetId: 13914428-n
simpleMeaning: In work with crystals, how far a crystal must be turned from its own line before it looks
  darkest in light made to shake in one plane.
scope: 'Also called extinction angle: how far a crystal must be turned before it looks darkest in light
  that shakes in one plane, not the slant of a line drawn on paper.'
examples:
- The angle of extinction told her how far to turn the crystal.
- He found the angle of extinction by turning the crystal until it went dark.
