simpleMeaning: All the smallest sense-changing sounds that one language uses, taken as a set.
scope: This is the whole set of smallest sense-changing sounds in one language, not the sounds of another
  language, and not the study of those sounds.
examples:
- English has its own phonemic system.
- The phonemic system of the language has forty sounds.
