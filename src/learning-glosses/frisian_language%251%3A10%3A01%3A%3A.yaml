simpleMeaning: A West Germanic tongue spoken in Friesland in the north-west of the Netherlands, a near
  kin of English.
scope: 'Also called Frisian: a West Germanic tongue of Friesland in the north-western Netherlands, near
  kin of English, not the people of Friesland and not the adjective for things of Friesland.'
examples:
- The Frisian language is spoken in Friesland.
- English is a near relative of the Frisian language.
