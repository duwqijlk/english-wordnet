simpleMeaning: to say false things about someone because you want to hurt them, and to harm how other
  people think of them
scope: Also called smear, sully, besmirch, defame, denigrate, and asperse. This is the verb for saying
  false bad things about someone to hurt them, not the noun for the false words themselves.
examples:
- He slandered his rival by saying, falsely, that she had stolen money.
- She said the newspaper had slandered her with lies about her past.
