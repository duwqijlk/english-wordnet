simpleMeaning: The act of animals feeding on grass or other plants where they grow.
scope: The act of animals feeding on grass where it grows, not the act of eating a meal at a table.
examples:
- The grazing of the sheep kept the hillside short.
- Grazing went on all day in the lower field.
