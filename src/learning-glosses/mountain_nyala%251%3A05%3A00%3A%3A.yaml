simpleMeaning: An antelope with long rough hair that lives on the high land of Ethiopia
scope: An antelope with long rough hair of the high land of Ethiopia, not a lowland nyala and not a goat.
examples:
- A mountain nyala stood on the high slopes above the valley.
- We saw a mountain nyala with its shaggy coat in the Ethiopian hills.
