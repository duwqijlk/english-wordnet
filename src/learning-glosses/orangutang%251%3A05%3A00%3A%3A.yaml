simpleMeaning: A big ape with very long arms that lives in trees in Borneo and Sumatra
scope: 'Also called orang or orangutan: a big tree-living ape of Borneo and Sumatra, not a monkey and
  not a gorilla.'
examples:
- The orangutang swung slowly through the trees of Borneo.
- We watched an orangutang rest in the shade with its long arms folded.
