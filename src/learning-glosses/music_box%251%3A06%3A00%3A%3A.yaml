simpleMeaning: Pins on a turning drum hit the tuned teeth of a thin metal plate shaped like a comb, and
  tunes come out of this case.
scope: Also called musical box, it is a case that plays tunes when pins on a turning drum hit a thin metal
  plate.
examples:
- The music box played a soft tune.
- He wound the music box and listened to the melody.
