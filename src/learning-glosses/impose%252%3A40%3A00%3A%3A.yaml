simpleMeaning: to set a tax, fine, or charge and take the money for it
scope: This sense is setting and collecting money such as a tax or fine, not making someone take something
  unpleasant.
examples:
- The city imposed a new tax on cars and collected it each year.
- The government imposes a fine on drivers who park in the wrong place.
