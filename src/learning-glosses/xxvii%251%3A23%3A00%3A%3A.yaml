simpleMeaning: The number that comes from adding twenty-six and one.
scope: Also called 27 and twenty-seven; the number after twenty-six, not twenty-six and not twenty-eight.
examples:
- XXVII in Roman numerals means twenty-seven.
- There were XXVII chairs in the hall.
