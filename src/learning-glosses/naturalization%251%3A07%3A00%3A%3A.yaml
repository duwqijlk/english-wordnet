simpleMeaning: The state of being made to fit with nature.
scope: The state of being made to fit with nature; not the course by which a stranger is made a citizen,
  nor the change of a borrowed word's sound to match the speech of those who take it, nor the bringing
  of beasts or plants to a place where they thrive but do not belong.
examples:
- Their naturalization shaped the park.
- The naturalization of the garden was plain.
