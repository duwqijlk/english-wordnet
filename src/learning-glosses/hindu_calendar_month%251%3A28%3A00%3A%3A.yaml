simpleMeaning: Any part of the year that follows both the moon and the sun, as used by that people.
scope: A division of the year in that people's way of counting time, not a holy day and not a season.
examples:
- This Hindu calendar month follows the moon, so its start moves from year to year.
- They set the date of the wedding by the Hindu calendar month, not by the common one.
