simpleMeaning: the way things are linked by how they are the same and how they are different
scope: This is the way things are linked by how they are the same and how they are different. Not the
  qualities in things that let them be compared with each other.
examples:
- The comparison of the two towns shows they are the same in size but different in age.
- In her comparison of the songs, she found the same tune but different words.
