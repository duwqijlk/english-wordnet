simpleMeaning: A world body for getting rid of chemical weapons; it runs the Chemical Weapons Convention.
scope: Also called Organization for the Prohibition of Chemical Weapons; this is the international body
  that runs the Chemical Weapons Convention, not a national military force.
examples:
- The OPCW checks that chemical weapons are destroyed.
- OPCW inspectors visit the plant each year.
