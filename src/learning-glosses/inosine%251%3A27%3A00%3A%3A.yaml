simpleMeaning: A cell building block made from adenosine, a like building block, by taking a part away,
  used in kidney transplants to give sugar for a short time.
scope: A cell building block made from adenosine by taking a part away, used in kidney transplants to
  give sugar for a short time; not the adenosine itself and not a sugar given by mouth.
examples:
- Inosine gave the kidney sugar for a short time after the transplant.
- Doctors used inosine to feed the new kidney.
