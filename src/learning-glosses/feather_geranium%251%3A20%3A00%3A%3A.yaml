simpleMeaning: Now at home in North America, this sweet-smelling goosefoot of Europe and Asia has leaves
  like oak leaves and many yellow-green flowers.
scope: Its leaves like oak leaves and its many yellow-green flowers mark it out among goosefoots.
examples:
- She picked a feather geranium with yellow-green flowers.
- She grew feather geranium for its sweet smell.
