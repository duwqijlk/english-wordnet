simpleMeaning: decided by chance, a sudden feeling, or a passing fancy, not by need or by thinking it
  through
scope: Decided by sudden feeling or whim, not a hasty act done without thought and not a natural show
  of feeling.
examples:
- His impulsive refusal surprised everyone at the meeting.
- An impulsive choice of colour left the room looking strange.
