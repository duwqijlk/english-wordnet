simpleMeaning: a blood tube near the side of the head that joins a middle blood tube and drains into a
  blood tube behind the jaw
scope: This is a blood tube near the side of the head that drains into a tube behind the jaw, not a large
  blood tube in the brain and not a tube that drains the upper lip.
examples:
- The superficial temporal vein joins the middle temporal vein before it drains behind the jaw.
- The surgeon followed the superficial temporal vein to the tube behind the jaw.
