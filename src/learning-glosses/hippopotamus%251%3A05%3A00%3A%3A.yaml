simpleMeaning: a very large animal with thick skin that eats only plants and lives in or near rivers in
  the hot parts of Africa
scope: 'Also called hippo and river horse: a very large animal that eats only plants and lives near rivers
  in Africa, not a horse and not a small river animal.'
examples:
- A hippopotamus stood in the river with only its eyes above the water.
- We saw a hippopotamus eating grass near the river.
