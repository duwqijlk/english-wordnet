simpleMeaning: begin a course of action such as a new career or a field of study
scope: This is starting a new activity, job or area of study; it is not physically going inside a place
  or signing up as a member.
examples:
- After graduation she entered a career in journalism.
- He entered the field of medicine at twenty-two.
