simpleMeaning: Any soft gap with only skin over it between the bones of a baby's head, or of an unborn
  child.
scope: This is a soft gap with only skin over it between the bones of a baby's head, not a break or a
  wound, and it is also called a fontanel and a soft spot.
examples:
- The fontanelle pulsed gently.
- The nurse checked the fontanelle.
