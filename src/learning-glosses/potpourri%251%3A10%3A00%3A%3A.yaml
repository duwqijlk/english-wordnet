simpleMeaning: A piece of music made of a run of songs or other pieces from many places.
scope: Also called a medley or a pastiche, this is music made of a run of pieces from many places, not
  a jar of sweet-smelling petals and spices.
examples:
- The band played a potpourri of old songs.
- Her potpourri mixed tunes from three shows.
