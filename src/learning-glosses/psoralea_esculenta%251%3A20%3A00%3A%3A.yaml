simpleMeaning: A plant with thick hairs that lives for years in the middle of North America and has thick
  underground roots people can eat.
scope: Also called breadroot, pomme blanche, pomme de prairie and Indian breadroot; a hairy plant with
  roots people eat, not a smooth plant grown for flowers and not a tree with fruit people eat.
examples:
- Psoralea esculenta grows on the dry plains, its thick roots dug up for food.
- The Psoralea esculenta we found had thick hairs all over its stems.
