synsetId: 07068162-n
simpleMeaning: A loud serenade for a newly married pair, made by banging pans and kettles as a tease.
scope: Also called a callathump, callithump, charivari, chivaree, or shivaree; a loud teasing serenade
  for a newly married pair, not a sweet song sung to honour them.
examples:
- The neighbours gave the couple a belling with pans and kettles.
- A belling woke the newly married pair at midnight.
