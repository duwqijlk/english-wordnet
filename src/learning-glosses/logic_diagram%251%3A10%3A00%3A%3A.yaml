simpleMeaning: A picture that shows how a computer program works, drawn with strict rules for what follows
  from what
scope: A drawing that shows how a computer program works, also called a logical diagram; not the program
  itself and not a chart of its steps.
examples:
- The logic diagram shows how the program decides what to do next.
- She drew a logic diagram before she wrote any code.
