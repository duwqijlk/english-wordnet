simpleMeaning: To change the high or low sound of your voice while speaking.
scope: To change the high or low sound of your voice while speaking, rather than reciting in a flat, repetitive
  rhythm or marking the pitch differences that distinguish words in tonal languages.
examples:
- The coach told him to tone his voice instead of speaking in a flat drone.
- She toned her voice to sound friendlier on the phone.
