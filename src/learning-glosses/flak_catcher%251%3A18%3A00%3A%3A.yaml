simpleMeaning: Criticism of an employer is met by this smooth talker, who speaks for them and turns it
  into something good for them
scope: 'Also called a flack, a flack catcher, and a flak: a smooth talker who speaks for an employer and
  turns bad words into something good for them, not a news reporter and not a lawyer.'
examples:
- The flak catcher fielded the reporters' questions all afternoon.
- As the firm's flak catcher, she turned the scandal into good press.
