simpleMeaning: in a way that has many parts or many small details, worked out with care
scope: This describes how an action is done, with many small details and care; it is not a plain or simple
  way of doing something.
examples:
- The plan was elaborately spelled out so that no one would miss a step.
- She elaborately decorated the room with flowers, lights, and small pictures.
