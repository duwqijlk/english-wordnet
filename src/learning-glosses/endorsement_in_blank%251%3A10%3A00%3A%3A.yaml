simpleMeaning: A signed note on trade paper that names no one to be paid, so the person with it can be
  paid.
scope: 'Also called a blank endorsement: a signed note on trade paper that names no one to be paid, not
  a note that names who is to be paid and not a promise to pay at a set date.'
examples:
- He signed the endorsement in blank so anyone holding it could be paid.
- The endorsement in blank named no payee.
