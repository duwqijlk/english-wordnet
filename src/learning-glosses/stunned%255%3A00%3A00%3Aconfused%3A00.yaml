senseId: stunned%5:00:00:confused:00
synsetId: 00438360-s
simpleMeaning: unable to think or feel clearly, especially after a shock that leaves the mind dull and
  slow
scope: Also called stupid, this is being unable to think clearly after a shock, not being knocked out
  by a hard blow.
examples:
- He sat stunned after the news, unable to answer my questions.
- She looked stunned and could not think what to do next.
