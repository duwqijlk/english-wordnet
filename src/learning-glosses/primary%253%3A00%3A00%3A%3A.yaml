simpleMeaning: First in rank, importance, or value, and direct and immediate rather than secondary or
  indirect.
scope: This is not the noun for an early party election or a bird's wing feather; it describes something
  that comes first in importance or acts directly rather than through something else.
examples:
- Safety is our primary concern.
- The primary cause of the fire was faulty wiring.
