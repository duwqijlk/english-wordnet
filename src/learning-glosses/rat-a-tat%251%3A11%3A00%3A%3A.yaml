simpleMeaning: quick hard knocks, like drum beats or door knocks, one after another
scope: 'Also called rat-a-tat-tat and rat-tat: quick hard knocks, like on a drum or a door, not one single
  knock and not a long steady beat.'
examples:
- We heard a rat-a-tat on the door and opened it at once.
- The rat-a-tat of the drum called the band to order.
