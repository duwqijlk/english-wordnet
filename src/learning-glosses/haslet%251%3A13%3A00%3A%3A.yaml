simpleMeaning: Usually shaped into a loaf and cooked slowly in liquid, meat from a pig's heart, liver
  and other soft parts inside the body is served cut up small.
scope: Haslet is the name for meat from a pig's heart, liver and other soft parts inside the body, usually
  cut up small, shaped into a loaf and cooked slowly in liquid.
examples:
- The butcher made haslet from the pig's heart and liver.
- She sliced the haslet loaf for lunch.
