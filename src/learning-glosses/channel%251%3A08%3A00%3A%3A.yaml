simpleMeaning: A tube or passage inside the body, lined with surface cells, that carries a secretion or
  other substance.
scope: This is a duct inside a living body, not a waterway for ships, not a groove or furrow, and not
  a means of communication or a television station.
examples:
- The snake releases venom through a channel in its fangs.
- Bile flows along a narrow channel from the liver to the gut.
