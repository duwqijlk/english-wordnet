simpleMeaning: a disease of the breathing organs caused by breathing in dust from black fuel
scope: A disease of the breathing organs caused by breathing in dust from black fuel; anthracosis, black
  lung and black lung disease are other names for this sense, not a disease from smoke and not a broken
  bone.
examples:
- Years in the pit gave him coal miner's lung.
- The doctor said the coal miner's lung came from breathing in coal dust.
