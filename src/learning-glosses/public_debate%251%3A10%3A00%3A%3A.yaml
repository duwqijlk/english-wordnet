senseId: 'public_debate%1:10:00::'
synsetId: 07256764-n
simpleMeaning: One side puts an idea forward in a set way, the other side speaks against it, and most
  often a vote follows
scope: A set talk where one side states an idea and the other side speaks against it, most often ending
  in a vote; debate and disputation are other names for this sense, not a casual argument or a private
  talk.
examples:
- The school held a public debate on whether phones should be banned in class.
- In the public debate, one side argued for the new road and the other side argued against it.
