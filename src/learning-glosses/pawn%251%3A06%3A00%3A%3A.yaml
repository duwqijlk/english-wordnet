simpleMeaning: In chess, the weakest piece, which moves only straight ahead and takes pieces only to the
  side, and can become a stronger piece at the far end of the board
scope: The weakest chess piece, moving only straight ahead; not the king, the queen, or any of the stronger
  pieces.
examples:
- She moved a pawn forward two squares.
- If a pawn reaches the far end, it can become a queen.
