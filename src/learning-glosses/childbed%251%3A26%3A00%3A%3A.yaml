simpleMeaning: the last part of the time before a baby is born, from when the birth pains start until
  the baby is born
scope: Also called labor, labour, confinement and travail. This sense is the last stage before a baby
  is born, not work in general and not the whole time a woman carries a baby.
examples:
- She was in childbed for six hours before her son was born.
- After a long childbed, the mother held her baby for the first time.
