simpleMeaning: of or like the officials and offices that run an organization, or the way they work
scope: About the officials and offices that run an organization and the way they work, not a word for
  the organization itself.
examples:
- His bureaucratic way of working meant every small change needed three signed forms.
- The bureaucratic offices took weeks to deal with one simple form.
