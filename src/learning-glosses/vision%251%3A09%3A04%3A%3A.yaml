senseId: 'vision%1:09:04::'
synsetId: 05633248-n
simpleMeaning: The making of a picture in the mind of something the senses do not perceive and that is
  not taken as real.
scope: 'Another name for imagination and imaginativeness: picturing what is not there, not a vivid mental
  picture, a supernatural apparition, or eyesight.'
examples:
- His vision of an underwater kingdom became the basis for the whole novel.
- The story began as a vision of a city where everyone could fly.
