simpleMeaning: To say the same words over and over in one flat voice, keeping a steady beat
scope: 'Also called tone: to say words over and over in one flat voice, not to say words in a singing
  voice and not to sing a set song.'
examples:
- The students chanted the same slogan over and over again.
- The crowd chanted his name all night.
