simpleMeaning: A small metal ring that lines a hole, so that ropes or cords can be tied through it
scope: This is a small metal ring that lines a hole for tying ropes or cords; loop, eyelet, grommet and
  cringle are other names for this sense, not a hook and not a plain ring with no hole to line.
examples:
- He passed the rope through the grummet in the sail.
- The grummet kept the cord from wearing the edge of the hole.
