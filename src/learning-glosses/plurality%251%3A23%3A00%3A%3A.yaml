simpleMeaning: In a vote with more than two picks, the count of votes for the one or side getting the
  most, but less than half of the votes.
scope: In a vote with more than two picks, the count of votes for the one or side getting the most, but
  less than half of the votes; not the state of being many.
examples:
- Their plurality stood at dawn.
- The plurality was counted at noon.
