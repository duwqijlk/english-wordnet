simpleMeaning: A short pipe put into a pipeline and used to measure how much liquid is flowing through
  it.
scope: A measuring pipe for the flow of liquid inside a pipeline; other pipes that only carry liquid,
  and other flow meters used outside a pipeline, are different kinds.
examples:
- A Venturi tube measures how much liquid is flowing in the pipeline.
- We put a Venturi tube into the pipeline.
