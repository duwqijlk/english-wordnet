simpleMeaning: where a stuff has soaked up light of only some colours, the dark stripe left in the spread
  of white light that has passed through it
scope: It is the name for the dark stripe left in the spread of white light when a stuff in its path soaks
  up light of only some colours.
examples:
- The spectrum showed a dark absorption band where the gas had taken in some colours.
- They found an absorption band in the light that had passed through the vapour.
