senseId: 'absorption_band%1:19:00::'
synsetId: 11440745-n
simpleMeaning: where a substance has soaked up light of only some colours, the dark stripe left in the
  spread of white light that has passed through it
scope: It names a single dark band in that spectrum, not the whole spectrum of the white light that has
  passed through the substance.
examples:
- The spectrum showed a dark absorption band where the gas had taken in some colours.
- They found an absorption band in the light that had passed through the vapour.
