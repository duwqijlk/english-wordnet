  the knee down, and sailors wore them
scope: Also called bell-bottoms and bellbottom trousers; wide-legged trousers, not ordinary straight trousers
  and not a skirt.
examples:
- He wore bellbottom pants to the 1960s party.
- Bellbottom pants were once part of a sailor's uniform.
