simpleMeaning: in a way that shows deep love and that you stay true to a person or cause and will not
  leave it
scope: It tells how someone serves or stays with a person or cause with deep love and care, not just how
  they feel inside.
examples:
- She devotedly cared for her sick husband for many years.
- He served his old teacher devotedly and never left her side.
