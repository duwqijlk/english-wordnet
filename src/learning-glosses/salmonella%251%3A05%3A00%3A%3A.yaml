simpleMeaning: Long thin gut bacteria that do not hold a purple stain in a test; they cause typhoid fever
  and food poisoning, and can be used as a war weapon
scope: This sense is the bacteria themselves, not typhoid fever or food poisoning, which are the illnesses
  they cause.
examples:
- Salmonella in raw eggs can make people very ill.
- Doctors found salmonella in the food that caused the poisoning.
