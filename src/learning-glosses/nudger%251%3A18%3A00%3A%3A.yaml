simpleMeaning: Someone who pushes another person gently.
scope: A person who gives a gentle push; not someone who shoves hard, and not a person who pushes a cart
  or pram.
examples:
- He needs a regular nudger to keep him awake.
- The old man acted as her nudger, giving her arm a small push when she dozed off.
