senseId: 'frenchify%2:30:01::'
synsetId: 00411742-v
simpleMeaning: To make a thing look or be like the people of France.
scope: This word is for a person who makes a thing French in look or in the way it is, not for a thing
  that grows French by itself.
examples:
- Let's Frenchify the restaurant and charge more money.
- They Frenchified the menu by adding French dishes and French names.
