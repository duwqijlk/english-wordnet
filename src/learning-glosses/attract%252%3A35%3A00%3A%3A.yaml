simpleMeaning: To pull a person or thing toward you by looks, charm, or some other strong power
scope: 'Also called pull and draw: to bring a person or thing toward you by looks or charm, not merely
  to please someone and not to drag a thing by force.'
examples:
- Her good looks attract the stares of many men.
- The ad attracted many new customers to the store.
