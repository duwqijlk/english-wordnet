simpleMeaning: a flat sea creature whose back is covered with white or yellow marks, found in warm seas
  in many parts of the world
scope: 'Also called a spotted ray: a flat sea creature with a marked back found in warm seas in many parts
  of the world, not a shark and not a ray of cold seas.'
examples:
- The spotted eagle ray glided over the sand.
- We watched a spotted eagle ray swim through the warm water.
