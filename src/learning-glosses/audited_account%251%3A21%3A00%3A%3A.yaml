simpleMeaning: A firm's books and the ways it keeps them are gone over by a trained book-checker in this
  check.
scope: This is a check of a firm's books by a trained person, also called an audit, not the books themselves.
examples:
- The firm went through an audited account of its books.
- An audited account checked the firm's books and records.
