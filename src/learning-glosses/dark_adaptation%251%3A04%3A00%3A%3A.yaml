simpleMeaning: The way the eyes get used to low light; cone cells get used to it first, and rod cells
  keep at it for up to four hours.
scope: This is how the eyes get used to low light, not the way the eyes focus on near things or the loss
  of sight in the dark.
examples:
- Dark adaptation takes time when you step into a dim room.
- After dark adaptation, her eyes could see in the low light.
