  from two languages into one word.'
scope: 'Also called loan-blend and hybrid: a word built from parts of more than one language, not a word
  taken whole from one language.'
examples:
- Loanblend words mix parts from two languages, like 'monolingual'.
- The teacher gave 'monolingual' as a loanblend, with a Greek start and a Latin end.
