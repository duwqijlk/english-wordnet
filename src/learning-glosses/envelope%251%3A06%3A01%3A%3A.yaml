simpleMeaning: a flat holder, usually with four straight sides, that holds a letter, a thin small parcel,
  or other thin things
scope: A flat holder, usually with four straight sides, for a letter or thin parcel, not the most a machine
  can do and not a line in maths.
examples:
- She put the letter in an envelope and sealed it.
- He wrote his name on the front of the envelope.
