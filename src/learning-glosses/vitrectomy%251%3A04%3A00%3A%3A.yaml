simpleMeaning: The clear jelly inside the eye is taken out in this operation, and salty water is put in
  its place.
scope: It is one of the operations on the eye, in which the clear jelly inside is taken out and salty
  water put in its place.
examples:
- Before the vitrectomy, the jelly inside the eye was still in place.
- After the vitrectomy, salty water filled the space where the jelly had been.
