simpleMeaning: A Mediterranean vine with long fruit that, when ripe, throws out its seeds and juice hard
  when touched.
scope: 'Also called exploding cucumber, squirting cucumber or touch-me-not: a Mediterranean vine with
  long fruit that throws out its seeds and juice when touched, not a vine with fruit that stays shut and
  not a plant grown for food.'
examples:
- Ecballium elaterium threw out its seeds when touched.
- The ripe fruit of Ecballium elaterium bursts and throws out seeds and juice.
