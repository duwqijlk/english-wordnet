simpleMeaning: the first shot in billiards or pool, which sends the balls spreading across the table
scope: This is the first shot of a billiards or pool game, not a turn in bowling and not a pause.
examples:
- He made a strong break and sank two balls.
- A weak break left the balls clustered near the cushion.
