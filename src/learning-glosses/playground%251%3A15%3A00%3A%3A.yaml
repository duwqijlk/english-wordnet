simpleMeaning: an area where many people go to rest, have fun, or spend their free time, for a holiday
  or for other reasons
scope: This is a wide area people go to for holidays and free time, not the small outdoor yard where children
  play at school or in a park.
examples:
- The sunny coast is a popular playground for holiday visitors.
- The island became a playground for people who love sailing and swimming.
