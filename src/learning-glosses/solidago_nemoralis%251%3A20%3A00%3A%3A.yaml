simpleMeaning: A weed of Canada and the east of the United States with yellow flowers, at times used to
  make dye.
scope: Also called gray goldenrod and grey goldenrod, this weed grows in Canada and the east of the United
  States and has yellow flowers at times used to make dye, a different kind from the goldenrod of the
  seaside.
examples:
- Solidago nemoralis grew along the dry road in Canada.
- The yellow flowers of Solidago nemoralis were once used to dye cloth.
