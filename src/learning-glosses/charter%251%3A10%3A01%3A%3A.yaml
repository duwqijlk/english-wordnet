simpleMeaning: an agreement to hire or rent transport for a time
scope: A deal to hire transport, not the paper that sets up a group and gives it its rights, and not the
  verb sense of holding goods or services under a pay deal.
examples:
- They signed a charter for the boat for the week.
- The charter for the plane cost a lot of money.
