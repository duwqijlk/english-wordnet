simpleMeaning: a worry illness marked by very strong, baseless fear of plain things or of meeting people
scope: A worry illness of very strong, baseless fear of plain things or of meeting people; phobia and
  phobic neurosis are other names for this sense, not ordinary shyness and not a passing fright.
examples:
- His phobic disorder made him fear plain things like lifts and open squares.
- A phobic disorder can keep a person from meeting people at all.
