simpleMeaning: An itchy skin break-out marked by pale-centred welts with clear-cut red rims, usually the
  upshot of a body over-reaction to bug bites, food or drugs.
scope: This sense is also called hives, urticaria and urtication, for an itchy skin break-out marked by
