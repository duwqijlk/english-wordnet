simpleMeaning: 'a person who backs a political idea: that society should keep changing for the better,
  with laws that guard each person''s freedom and rights'
scope: 'Another name for this sense is liberal: a person who backs change and reform, not the tax sense
  of progressive and not a verb tense.'
examples:
- The young progressive campaigned for fair housing and free speech.
- As a progressive, she voted for laws that protect civil liberties.
