simpleMeaning: Parts or side shoots of hollow tubes join, by nature or by a surgeon's work, into one unbroken
  run.
scope: This joining, also called inosculation, makes parts or side shoots of hollow tubes into one unbroken
  run, whether it comes about by nature or by a surgeon's work.
examples:
- The surgeon made an anastomosis to join the two ends of the gut.
- A natural anastomosis lets blood flow between the two tubes.
