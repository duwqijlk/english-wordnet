simpleMeaning: A tube-shaped wind instrument with eight finger holes and a whistle mouthpiece.
scope: A tube-shaped wind instrument with eight finger holes; recorder, fipple flute and fipple pipe are
  other names for this sense; not a side-blown flute and not a clarinet.
examples:
- She played the vertical flute at the concert.
- The vertical flute has eight finger holes.
