simpleMeaning: to make a person find it hard to pass solid waste out of the body
scope: This sense is about making the body find it hard to pass waste; it is not the sense about blocking
  or slowing something as if with a block in a pipe.
examples:
- Eating too much cheese can constipate some people.
- The medicine constipated him for two days.
