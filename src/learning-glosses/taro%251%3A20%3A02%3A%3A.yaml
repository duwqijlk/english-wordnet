simpleMeaning: The thick, starchy root of a plant grown in warm lands, that can be eaten.
scope: Also called cocoyam, dasheen, or eddo, the thick, starchy root of the taro plant, eaten as food;
  not the plant it grows on, and not the wider use for any tropical starchy root.
examples:
- They dug up the taro and boiled the root for supper.
- Taro is cooked before eating, as the raw root is not safe.
