simpleMeaning: Used in sweet dishes, preserves and jellies, this small yellow-to-orange fruit comes from
  the Barbados gooseberry cactus.
scope: This small fruit of the Barbados gooseberry cactus goes into desserts, preserves and jellies; it
  is not the cactus itself, and it is not an apple.
examples:
- Blade apples from the Barbados gooseberry cactus went into the jelly.
- She put blade apple in the preserves.
