simpleMeaning: A body of soldiers in the armed forces that keeps order among troops and watches over prisoners.
scope: This is the whole corps that keeps order among soldiers, not one member of it; also called military
  police.
examples:
- The MP keeps order among soldiers and guards prisoners in wartime.
- The commander asked the MP to take charge of the prisoners.
