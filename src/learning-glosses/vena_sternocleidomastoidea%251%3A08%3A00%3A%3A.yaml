simpleMeaning: A blood tube that drains the long neck muscle and empties into the deep blood tube of the
  neck.
scope: A blood tube draining the long neck muscle; sternocleidomastoid vein is another name for this sense;
  not a blood tube of the face and not one of the chest.
examples:
- The vena sternocleidomastoidea drains the long muscle of the neck.
- The vena sternocleidomastoidea empties into the deep neck tube.
