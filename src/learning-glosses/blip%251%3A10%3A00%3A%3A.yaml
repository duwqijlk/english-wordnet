simpleMeaning: On a screen that uses radio waves to find things, a bright spot that shows where a thing
  is after the waves hit it and come back
scope: Also called pip. This is the bright spot on a radar screen, not a sudden small shock and not a
  short break in something.
examples:
- A blip on the screen showed the plane was near.
- The pilot watched the blip move across the radar screen.
