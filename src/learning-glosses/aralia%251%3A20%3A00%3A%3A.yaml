simpleMeaning: One of many kinds of plant, known by small flowers in bunches like an umbrella, leaves
  made of small leaflets, and a strong smell it often gives off.
scope: Small flowers in bunches like an umbrella and leaves made of small leaflets mark the plants this
  sense covers.
examples:
- The aralia smelled strong.
- The aralia bore small flowers in bunches like an umbrella.
