simpleMeaning: a paper by which a firm or a state borrows money, usually with interest or at a lower price,
  paying a fixed sum each year and then the sum owed
scope: A paper by which a firm or a state owes money and pays it back over time, not a thing that ties
  a person down and not money paid to free a person for trial.
examples:
- The city sold bonds to pay for the new bridge.
- She put her savings in a government bond.
