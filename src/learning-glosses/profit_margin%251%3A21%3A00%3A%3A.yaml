simpleMeaning: The number you get when you divide all the money a business makes by the money it takes
  in from sales once returns are taken off
scope: This is the number that shows how much money is kept from what is taken in, also called gross margin
  and margin of profit, and not the whole amount a business takes in.
examples:
- The shop's profit margin grew when its costs fell.
- A high profit margin means the firm keeps much of what it earns.
