simpleMeaning: The study, done by science, of the old bones and other remains of early people.
scope: The study of the old bones and other remains of early people; human paleontology is another name
  for this sense, not the study of living people and not the study of animal bones.
examples:
- She works in human palaeontology and digs up old bones.
- Human palaeontology tells us how early people lived.
