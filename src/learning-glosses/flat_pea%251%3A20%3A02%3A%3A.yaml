simpleMeaning: An evergreen shrub with near heart-shaped leaves and bright yellow pea-like flowers, then
  flat pods with flat wings, from Australia and Tasmania.
scope: This sense is an evergreen shrub with near heart-shaped leaves and bright yellow pea-like flowers,
  then flat pods with flat wings, from Australia and Tasmania, unlike the sense for a European perennial
  with mottled flowers of purple and pink, sometimes grown for fodder or as green manure.
examples:
- The flat pea bears yellow flowers.
- Flat peas grow in Australia.
