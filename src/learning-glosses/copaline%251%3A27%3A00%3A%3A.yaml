simpleMeaning: copal, a hard tree sap, that has started to turn to stone and is dug from the ground
scope: Copal that has started to turn to stone and is dug from the ground; copalite and fossil copal are
  other names for this sense, not fresh copal and not stone all the way through.
examples:
- The copaline was dug from an old river bed.
- A lump of copaline lay among the stones in the pit.
