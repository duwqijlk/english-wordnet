simpleMeaning: Large white or yellow flowers crown any plant of the Argemone group with prickly leaves,
  stems and pods, found chiefly in tropical America
scope: Also called argemone, prickly poppy, or white thistle; not other prickly plants of tropical America
  with large flowers.
examples:
- Devil's fig grows in the hot parts of tropical America.
- The devil's fig in the garden had large white flowers and prickly pods.
