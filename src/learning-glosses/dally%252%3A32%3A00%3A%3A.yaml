simpleMeaning: to talk or act in a loving way with someone, without meaning it in a serious way
scope: This sense is talking or acting in a loving way without serious plans, also called butterfly, flirt,
  romance, mash, philander, and coquette; it is not acting with no care about a thing.
examples:
- He dallied with the new secretary, but he never meant to marry her.
- She dallied with him at parties, though she had no serious feelings for him.
