simpleMeaning: a long, narrow ditch in the ground made by digging or by water wearing the ground away
scope: 'Also called a cut: a long, narrow ditch in the ground; not a strong cut made with a sharp tool.'
examples:
- Rain had worn a deep gash across the side of the hill.
- A long gash in the earth showed where the workers had dug.
