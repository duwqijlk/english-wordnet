simpleMeaning: to make a secret plan together to do something bad or against the law, and to promise each
  other to do it
scope: 'Also called conjure: to plan in secret with others and promise to act together, not to work together
  in the open.'
examples:
- They conspired to overthrow the government.
- The two men conspired to steal the jewels.
