simpleMeaning: to throw up what is in the stomach through the mouth
scope: 'Also called sick, cat, cast, puke, chuck, purge, retch, honk, and spew: to throw up what is in
  the stomach. This is the verb act, not a medicine that makes it happen and not what comes up.'
examples:
- After drinking too much, he vomited outside.
- The child felt sick and vomited into a bowl.
