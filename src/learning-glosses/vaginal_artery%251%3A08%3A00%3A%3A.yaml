simpleMeaning: a branch of the internal iliac, a blood vessel deep in the body, that brings blood to the
  birth canal, the base of the bladder and the lower bowel
scope: 'Another name for arteria vaginalis: a blood vessel that brings blood to the birth canal and nearby
  parts, not a vein and not a vessel that serves only the leg.'
examples:
- The vaginal artery supplies blood to the vagina and the base of the bladder.
- Surgeons must take care not to cut the vaginal artery during the operation.
