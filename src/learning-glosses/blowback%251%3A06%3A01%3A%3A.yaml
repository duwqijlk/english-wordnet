simpleMeaning: 'A way of making a self-loading gun work: gas from the burning charge drives the spent
  case backward, and that motion supplies the energy to load the next round.'
scope: A firearm operating system, not the backward escape of gases after a shot or the political sense
  about planted misinformation.
examples:
- The pistol uses blowback, so the bolt is held in place only by its spring.
- The gunsmith explained how blowback uses the rearward motion of the case to cycle the action.
