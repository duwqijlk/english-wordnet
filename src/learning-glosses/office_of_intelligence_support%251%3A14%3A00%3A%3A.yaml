simpleMeaning: The agency that watches how the Treasury's parts deal with secret-information work and
  joins the secret-information agencies to the people in charge of the country's money dealings with other
  lands.
scope: Also called OIS; the agency that watches how the Treasury's parts deal with secret-information
  work and joins the secret-information agencies to the people in charge of the country's money dealings
  with other lands, not the secret-information agencies themselves and not the officials in charge of
  money dealings with other lands.
examples:
- The Office of Intelligence Support links the Treasury to the Intelligence Community.
- Staff of the Office of Intelligence Support brief the Treasury.
