simpleMeaning: A lab method of washing one substance out of a solid with a solvent, freeing material stuck
  to the solid's surface. It is used to get uranium ions.
scope: A purification step that washes captured material off a solid, not dissolving a sample completely
  and not just filtering.
examples:
- Elution with a salt solution released the proteins bound to the column.
- The final elution step collected the purified DNA.
