simpleMeaning: a thin straight stick with a sharp point at one end and small flat parts at the other end
  to keep it steady, made to be shot from a bow
scope: This is the thin stick shot from a bow, not the mark that shows which way to go.
examples:
- He shot an arrow into the centre of the target.
- She put an arrow to her bow and shot at the target.
