simpleMeaning: a fairly thin flat stretch of something that lies over or under another stretch
scope: A thin flat stretch of something lying over or under another, not one thickness of a single substance,
  not a hen that lays eggs and not the act of putting one thickness over another.
examples:
- A layer of dust covered the old books.
- The cake had a layer of cream between the sponges.
