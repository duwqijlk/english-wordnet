simpleMeaning: of a picture or drawing, made with light and dark parts that pass into each other by small
  steps
scope: Of a picture or drawing, made with steps of light and dark, not a place kept out of the sun.
examples:
- The shaded parts of the face seemed to fall back.
- The shaded side of the hill looked darker in his picture.
