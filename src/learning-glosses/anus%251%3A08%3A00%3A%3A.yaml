simpleMeaning: the opening at the end of the tube that food passes through, where solid waste leaves the
  body
scope: This is the body opening where solid waste leaves; it is not the tube food passes through and not
  the opening for urine.
examples:
- Waste leaves the body through the anus.
- The doctor checked the skin around his anus.
