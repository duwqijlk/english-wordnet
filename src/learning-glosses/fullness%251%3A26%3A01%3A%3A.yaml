simpleMeaning: Being whole and complete across a wide range, with nothing left out
scope: Being complete across a wide range, not the feeling of having eaten enough and not richness of
  sound.
examples:
- The fullness of her account left no question unanswered.
- He admired the fullness of the report, which covered every part of the subject.
