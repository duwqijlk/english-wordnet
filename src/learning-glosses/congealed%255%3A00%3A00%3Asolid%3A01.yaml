simpleMeaning: set thick and soft like jelly, and made solid by cooling
scope: 'Also called jellied: a soft mass or food that has set like jelly and gone solid, not one that
  is still liquid and warm.'
examples:
- They served a congealed salad made with fruit and jelly.
- The congealed sauce sat in the cold pan in a soft, solid lump.
