simpleMeaning: A swimming stroke in which each arm reaches forward over the head in turn while the legs
  kick quickly up and down.
scope: The overarm stroke (also called front crawl or Australian crawl), not the slow movement on hands
  and knees or the verb for swimming this way.
examples:
- She won the race with a powerful crawl.
- He switched to the crawl for the final length.
