simpleMeaning: One of several shrubs from the mild parts of Europe and America, with leaves that stay
  on all year.
scope: This is the name for one of several shrubs from the mild parts of Europe and America whose leaves
  stay on all year, not one that drops its leaves in winter.
examples:
- The arbutus kept its leaves through the winter.
- Arbutus grows in the mild parts of Europe and America.
