simpleMeaning: 'It goes with making new things: the mind moving off in different directions, taking in
  many sides of a thing and at times leading to fresh ideas and answers.'
scope: Also called out-of-the-box thinking, this is the mind moving off in different directions and taking
  in many sides of a thing.
examples:
- Divergent thinking led her to a fresh idea.
- His divergent thinking took in many sides of the problem.
