simpleMeaning: a small cloth that opens in the air, or a flat part that moves out, to slow a plane down
scope: A small cloth that opens in the air, or a flat part that moves out, to slow a plane down, also
  called an airbrake, and not the main brakes on the wheels or a parachute used to land people.
examples:
- The pilot opened the dive brake to slow the plane before landing.
- A dive brake helped the plane lose speed in its steep drop.
