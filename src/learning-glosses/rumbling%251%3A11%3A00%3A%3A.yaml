simpleMeaning: a loud, low, flat sound that goes on without stopping
scope: A loud, low sound that goes on and on, also called rumble, grumble and grumbling; here it names
  the sound itself, not the word used to describe such a sound.
examples:
- They heard the rumbling of thunder far away.
- The rumbling of the night train could be heard all over the town.
