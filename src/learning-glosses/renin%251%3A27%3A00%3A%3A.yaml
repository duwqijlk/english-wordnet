simpleMeaning: Made by the kidneys, this body helper breaks down protein and starts the making of a substance
  that raises the pressure of the blood
scope: It is a body helper made by the kidneys, not the blood pressure it acts on and not the substance
  it helps to make.
examples:
- Renin helps the body make angiotensin.
- The kidneys send renin out into the blood.
