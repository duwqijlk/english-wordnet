simpleMeaning: With wide gaps between its threads, this soft cloth of cotton or wool is made into curtains
  and clothes and other things.
scope: Also called etamine, this is a soft cloth with wide gaps between the threads, made of cotton or
  wool thread and used for curtains, clothes, and other things.
examples:
- She bought etamin for the curtains.
- Her dress was made of etamin.
