simpleMeaning: a public show of not agreeing, often done by a group that has planned it together
scope: 'Also called protest and dissent: a public show of not agreeing, often by a planned group, not
  a step in a trial and not the act of saying you oppose a thing in earnest.'
examples:
- The objection to the new road was loud and public.
- The crowd voiced its objection in the square.
