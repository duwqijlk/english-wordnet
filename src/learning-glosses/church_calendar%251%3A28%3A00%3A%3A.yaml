simpleMeaning: a list of the dates of fasts and feasts in the Christian year
scope: A list of the dates of fasts and feasts in the Christian year, also called an ecclesiastical calendar;
  not a wall calendar of the months and not a list of saints' days alone.
examples:
- The church calendar marked Lent and Easter.
- She checked the church calendar for the date of the feast.
