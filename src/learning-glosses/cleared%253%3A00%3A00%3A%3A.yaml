simpleMeaning: with objects and things that block the way taken away, such as trees and brush
scope: With blocking things taken away, as with land or a street; not free to go ahead, not proved not
  guilty, and not passed for payment.
examples:
- They played on the cleared field after the trees were cut down.
- The cleared road was open again after workers took away the fallen branches.
