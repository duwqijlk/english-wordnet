simpleMeaning: A case made of puff pastry holds a savoury mix of meat, and a sauce most often comes with
  it.
scope: It is a kind of pastry case with a meat filling, and a sauce most often comes with it.
examples:
- The vol-au-vent was filled with a savoury mix of meat and served with a sauce.
- The vol-au-vent on the plate had a savoury meat filling.
