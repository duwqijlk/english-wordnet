simpleMeaning: To tie or fix a thing in place with a round band.
scope: To tie or fix a thing in place with a round band, not the band itself, not the ring for basketball,
  and not the frame that spreads a skirt.
examples:
- The cooper hooped the barrel with iron bands.
- They hooped the vats before the wine was poured in.
