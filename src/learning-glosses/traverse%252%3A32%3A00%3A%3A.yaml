synsetId: 01070402-v
simpleMeaning: when one side in a court case says a fact claimed by the other side is not true, and does
  so in the formal way the court asks for
scope: 'Also called deny: in a court case, one side says a fact claimed by the other side is not true,
  in the formal way the court asks for; not a bar that runs across a window and not travelling across
  a place.'
examples:
- The lawyer traversed the allegation that her client had signed the letter.
- In his reply, the defendant traversed the claim about the broken fence.
