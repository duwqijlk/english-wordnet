simpleMeaning: A piece of electronic equipment, such as a radio or television, that picks up or sends
  out broadcast signals.
scope: This is not the scenery of a stage production, not a collection of matching items and not a group
  in mathematics; it is radio or television equipment.
examples:
- He turned the set off and went to bed.
- The old wireless set still worked after fifty years.
