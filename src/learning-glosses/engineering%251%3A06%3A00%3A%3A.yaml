simpleMeaning: On a ship, the compartment that houses the main motor and the machinery around it.
scope: Unlike the two abstract senses for the practical application of science to industry and for the
  academic discipline itself, this one names a physical space aboard a vessel.
examples:
- The fire began in the engineering spaces and spread along the lower deck.
- Below decks, the engineering compartment was loud with the throb of the diesels.
