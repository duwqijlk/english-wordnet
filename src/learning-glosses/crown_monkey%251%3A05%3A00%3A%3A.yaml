simpleMeaning: a kind of long-tailed animal from India with a tuft of hair on its head like a small cap
scope: A long-tailed animal from India with a tuft of hair on its head like a small cap; bonnet macaque,
  bonnet monkey and capped macaque are other names for this sense, and it is not a plant.
examples:
- The crown monkey sat in the tree, its tuft of hair standing up like a cap.
- We saw a crown monkey with a small cap of hair in the Indian forest.
