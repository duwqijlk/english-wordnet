simpleMeaning: one of several kinds of tree that grow in warm parts of America and belong to the Andira
  group
scope: This is one of several kinds of tree in warm parts of America in the Andira group, also called
  angelim, not a tree from cold lands or of another group.
examples:
- The andelmin grows tall in the warm forests of Brazil.
- Several kinds of andelmin grow across tropical America.
