simpleMeaning: To change an oil or fat into soap by treating it with an alkali, which splits an ester
  with water into an acid and an alcohol
scope: It turns oil or fat into soap by treating it with an alkali, not the fat itself turning into soap
  on its own.
examples:
- The factory saponifies oils and fats to make soap.
- They saponify the oil with an alkali.
