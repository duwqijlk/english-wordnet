simpleMeaning: a bushy plant of eastern North America, a kind of bramble, with large pink to purple blooms
  and red or orange fruit shaped like a thimble
scope: A bushy bramble of eastern North America with pink to purple blooms and red or orange thimble-shaped
  fruit; thimbleberry and purple-flowering raspberry are other names for this sense. Not a common garden
  raspberry, and not a plant with small white flowers.
examples:
- The flowering raspberry was covered in pink blooms in June.
- We picked the red fruit of a flowering raspberry along the trail.
