simpleMeaning: a music instrument like a xylophone (bars you hit to make music), but with metal bars and
  spinning disks in tubes below them that make the sound waver
scope: Also called vibraphone and vibraharp. This is the music instrument, not a feeling or mood you get
  from a place or a person.
examples:
- She played the vibes in the school jazz band.
- The vibes rang out with a soft, wavering sound.
