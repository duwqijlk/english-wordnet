simpleMeaning: A mass of tissue that helps the body fight illness, found on the back wall and top of the
  upper throat, behind the uvula (the small piece hanging there)
scope: This throat tissue is also called pharyngeal tonsil, third tonsil, tonsilla adenoidea, and tonsilla
  pharyngealis. It is the noun for the tissue itself, not the word that means relating to such tissue.
examples:
- Enlarged adenoids can make it hard for children to breathe.
- The doctor checked the child's adenoid for swelling.
