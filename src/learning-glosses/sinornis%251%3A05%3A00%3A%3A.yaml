simpleMeaning: A sparrow-sized fossil bird of the Jurassic and Cretaceous periods, with a ridged breastbone
  and a leftover tail; found in China, maybe the second most primitive of all birds.
scope: A sparrow-sized fossil bird, not the first bird Archaeopteryx and not a modern sparrow; it lived
  in the Jurassic and Cretaceous periods.
examples:
- Sinornis lived long before modern birds.
- Fossils of Sinornis were found in China.
