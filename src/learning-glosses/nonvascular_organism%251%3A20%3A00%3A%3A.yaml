senseId: 'nonvascular_organism%1:20:00::'
synsetId: 13105239-n
simpleMeaning: A living thing with no tubes to carry water and food, such as algae, lichens, fungi, or
  mosses.
scope: A living thing with no tubes to carry water and food, not a plant with tubes that carry water.
examples:
- Mosses are nonvascular organisms that soak up water through their leaves.
- A nonvascular organism has no tubes to move water through its body.
