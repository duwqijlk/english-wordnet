simpleMeaning: The family of tongues that takes in most of the tongues spoken in Africa south of the Sahara;
  most use tone, but some, like Swahili or Fula, do not.
scope: 'Also called Niger-Kordofanian language: the family of tongues of most of Africa south of the Sahara,
  not one tongue and not the tongues of North Africa.'
examples:
- Niger-Kordofanian takes in most of the tongues of Africa south of the Sahara.
- Swahili is an exception among Niger-Kordofanian tongues, since it is not tonal.
