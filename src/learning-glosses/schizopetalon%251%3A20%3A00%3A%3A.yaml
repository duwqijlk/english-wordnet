simpleMeaning: a small pretty plant of South America that lives one year, with deeply cut leaves and clusters
  of fringed flowers that smell of almonds and look purple-white
scope: A small pretty South American plant with deeply cut leaves and fringed flowers; not a rose and
  not a daisy.
examples:
- Schizopetalon grows in the dry hills of Chile, its fringed flowers smelling of almonds.
- The schizopetalon in her garden lived only one year.
