simpleMeaning: A map for a person who sails a ship, showing the weather, water and sailing conditions
  that are usual in a place.
scope: A map for a person who sails a ship, showing the weather, water and sailing conditions that are
  usual in a place, also called naval chart and pilot chart; not a land map and not a map of the stars.
examples:
- The captain checked the navigational chart before leaving port.
- A navigational chart shows the weather and water conditions.
