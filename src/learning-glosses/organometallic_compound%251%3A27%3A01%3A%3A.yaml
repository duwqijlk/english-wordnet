simpleMeaning: A chemical substance in which a carbon-based part is joined to a metal
scope: A chemical substance in which a carbon-based part is joined to a metal, not a plain metal and not
  a substance with no metal in it.
examples:
- Tetracarbonyl nickel is an organometallic compound with a metal joined to a carbon-based part.
- An organometallic compound joins a carbon-based part to a metal.
