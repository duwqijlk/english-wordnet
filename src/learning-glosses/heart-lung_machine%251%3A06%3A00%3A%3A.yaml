simpleMeaning: Blood taken out, filled with air and sent back round the body is what this pump does while
  a chest is cut open to mend it.
scope: This pump, used while a chest is cut open to mend it, takes blood out, fills it with air and sends
  it back round the body, and is called a heart-lung machine.
examples:
- The heart-lung machine kept blood moving during the operation.
- The heart-lung machine took over while the chest was cut open.
