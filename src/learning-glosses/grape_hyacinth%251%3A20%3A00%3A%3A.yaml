simpleMeaning: any of several kinds of early spring flower from Europe and Asia with close-packed stalks
  of round blue flowers in bunches like small round fruit
scope: A spring flower with close-packed stalks of round blue flowers in bunches, not a vine that bears
  fruit and not other spring bulbs.
examples:
- Grape hyacinth blooms early in spring along the garden path.
- She planted grape hyacinth bulbs under the trees for their blue flowers.
