simpleMeaning: a blood vessel in the brain that starts from the main vessel at the base of the brain and
  splits into three smaller vessels
scope: This is a blood vessel in the brain that starts from the main vessel at its base and splits into
  three, not a vein and not a vessel outside the brain.
examples:
- The posterior cerebral artery starts from the main vessel at the base of the brain.
- The scan showed the posterior cerebral artery splitting into three smaller vessels.
