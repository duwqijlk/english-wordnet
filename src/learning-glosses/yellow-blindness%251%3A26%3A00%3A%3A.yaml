simpleMeaning: A sight fault in which a person sees with two colours and is far less able to sense egg-yolk-coloured
  light, so rare that some doubt it is real
scope: 'Also called tetartanopia: a sight fault with weak feeling for one colour, not a total lack of
  colour sight and not a fault of the eye lens.'
examples:
- Yellow-blindness is so rare that some doubt it exists.
- He was tested for yellow-blindness as a child.
