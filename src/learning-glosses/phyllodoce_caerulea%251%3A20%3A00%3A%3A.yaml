simpleMeaning: A small bush with tiny leaves that stay green all year and pink or purple flowers, on high
  mountain tops and high ground in Asia, Europe and the United States
scope: Also called mountain heath and Bryanthus taxifolius, it is a small bush of high mountain tops and
  high ground in Asia, Europe and the United States, with tiny leaves that stay green all year and pink
  or purple flowers, while other small bushes of high ground and other shrubs with pink or purple flowers
  are different kinds.
examples:
- The Phyllodoce caerulea bloomed pink on the high mountain top.
- We found Phyllodoce caerulea on high ground in northern Europe.
