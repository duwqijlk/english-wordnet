simpleMeaning: a rock that forms bright crystals, cut and polished to set in a ring or other piece of
  jewellery
scope: A rock that forms bright crystals, cut and polished for jewellery; stone and gem are other names
  for this sense, not a plain pebble and not a piece of glass.
examples:
- He had the gemstone set in a ring for his wife.
- She had jewels made of the rarest gemstones.
