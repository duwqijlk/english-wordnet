simpleMeaning: A substance that has soaked right through a thing, so that it fills it.
scope: A substance that has soaked right through a thing, so that it fills it, not the act of joining
  male and female cells and not a substance that only coats the outside.
examples:
- The impregnation, whatever it was, had turned the rock blue.
- They tested the impregnation in the cloth to see how far it had gone.
