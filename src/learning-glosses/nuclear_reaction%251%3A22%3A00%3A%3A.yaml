simpleMeaning: In physics, a change that alters the power, build or make-up of the hearts of atoms
scope: In physics, a change that alters the power, build or make-up of the hearts of atoms; not a change
  in the outer parts of atoms, and not a chemical change.
examples:
- A nuclear reaction in the sun gives off great heat.
- The nuclear reaction changed the make-up of the atoms.
