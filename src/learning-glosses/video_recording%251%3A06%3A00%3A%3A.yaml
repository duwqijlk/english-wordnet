simpleMeaning: a copy of both what is seen and what is heard, above all one of a film or television programme
scope: A copy of pictures and sound, also called video; not a sound-only tape and not a live show.
examples:
- We watched a video recording of the school play.
- She made a video recording of her grandmother telling stories.
