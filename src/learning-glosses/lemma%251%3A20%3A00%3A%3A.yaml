simpleMeaning: The lower and thicker of the two husks that wrap close round the tiny flower of most grasses
scope: The lower husk round a grass flower; flowering glume is another name for this sense, not the heading
  of a piece of writing.
examples:
- The lemma wrapped the tiny floret like a husk.
- Botanists look at the lemma to tell grasses apart.
