simpleMeaning: Coming before niacin, this building block of proteins is one the body must have to grow
  and to keep its food use in order.
scope: Also called tryptophane, this is a building block of proteins the body must have to grow.
examples:
- Without tryptophan, the body cannot grow as it should.
- Tryptophan helps the body make niacin.
