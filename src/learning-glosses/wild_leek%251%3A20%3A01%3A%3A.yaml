simpleMeaning: A rough Old World green of many years, with a big bulb and a tall stalk of greenish purple-tinged
  blooms, now settled wild far and wide.
scope: This sense is also called kurrat, unlike the sense for a North American plant that lives year after
  year, with a slim bulb and whitish blooms.
examples:
- A wild leek grew in the field.
- Wild leeks bear purple blooms.
