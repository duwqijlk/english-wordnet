simpleMeaning: In psychology, a strong wish to move away from or stay away from a place, thing, or event
scope: This is a strong wish to move away from or stay away from something; not a wish to go toward something
  and not a fear of a place.
examples:
- His abience made him leave the crowded room.
- Her abience toward the dark house kept her from going inside.
