simpleMeaning: a very fine soil that is soft and easy to shape when wet but becomes hard when heated strongly
scope: Fine soil that can be shaped when wet and turns hard in heat, not just soft wet earth in the ground.
examples:
- She shaped the clay into a small bowl before it dried.
- The clay in this pit becomes hard when it is baked in a fire.
