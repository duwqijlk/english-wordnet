simpleMeaning: a rail at the side of stairs or a balcony that stops people from falling
scope: Also called banister, handrail and bannister. This is the rail itself at the side of stairs or
  a balcony, not the stairs and not a wall.
examples:
- They held the balustrade as they walked down the stairs.
- A wooden balustrade runs along the edge of the balcony.
