simpleMeaning: long pods eaten as food, usually cut into pieces about half an inch long, a much-liked
  food in Britain
scope: These are long pods eaten as food, usually cut into short pieces, a much-liked food in Britain;
  runner bean and scarlet runner are other names for this sense, not the plant that grows the pods and
  not a kidney bean.
examples:
- He cut the scarlet runner bean into short pieces for supper.
- Scarlet runner bean is a favourite in Britain, often cooked with butter.
