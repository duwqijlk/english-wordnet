simpleMeaning: A side branch from the artery of the spleen, carrying blood to the pancreas
scope: Also called a pancreatic artery; not the artery of the spleen itself and not the blood tube that
  feeds the belly muscles.
examples:
- The arteria pancreatica feeds the pancreas from the spleen artery.
- A block in the arteria pancreatica can starve the pancreas of blood.
