simpleMeaning: It is the evening that comes just before the day of All Saints, and young people often
  use it to play tricks on others.
scope: 'Also called Allhallows Eve and Halloween: the evening before the day of All Saints, when young
  people play tricks, not a holy day itself and not any night for tricks.'
examples:
- On Hallowe'en the children knocked on doors asking for sweets.
- We carved pumpkins for Hallowe'en.
