simpleMeaning: A dwarf shrub that lies flat and forms mats in Arctic and alpine parts of North America
  and Greenland, with deep green oval leaves that narrow toward the base.
scope: Also called bearberry willow; not a tall tree and not a willow of warm lands.
examples:
- The Salix uva-ursi formed a flat mat on the Arctic rocks.
- We found Salix uva-ursi with deep green leaves in Greenland.
