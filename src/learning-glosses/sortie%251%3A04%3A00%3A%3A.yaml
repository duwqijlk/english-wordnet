simpleMeaning: an army action in which soldiers held in a place by the enemy around them rush out to attack
scope: This is an army rush out to attack, also called sally; it is not a normal attack by an army that
  is free to move.
examples:
- The soldiers made a sortie at night to attack the enemy outside the walls.
- A quick sortie helped the shut-in soldiers break through the enemy line.
