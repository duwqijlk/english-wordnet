simpleMeaning: In Europe and North America grows this grass that lives for years in wet meadows and ditches,
  with wide leaves.
scope: This grass is also called gardener's garters, reed canary grass and ribbon grass, and it lives
  for years in wet meadows and ditches.
examples:
- Lady's laces grew in the wet meadow with its wide leaves.
- The lady's laces in the ditch lived for years.
