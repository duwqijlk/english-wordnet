simpleMeaning: The back or top part of a theatre balcony, where the cheapest seats are.
scope: The back or top part of a theatre balcony with the cheapest seats, also called the peanut gallery;
  not the dress circle and not the seats on the main floor.
examples:
- We sat in the family circle because the tickets were the cheapest.
- The family circle is at the very back of the balcony.
