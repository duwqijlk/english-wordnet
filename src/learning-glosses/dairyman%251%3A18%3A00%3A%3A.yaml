simpleMeaning: a person who owns or runs a farm or business where cows are kept for milk
scope: This is the person who owns or runs the dairy farm or business. It is not a man who only works
  there for someone else.
examples:
- The dairyman owns the farm and sells milk to local shops.
- As the dairyman in charge, he hired two men to milk the cows.
