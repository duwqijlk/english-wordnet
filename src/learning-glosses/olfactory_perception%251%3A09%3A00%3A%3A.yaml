simpleMeaning: When certain chemicals in gas form set off the parts inside the nose that pick up smells,
  a feeling follows.
scope: Smell, odor, odour, and olfactory sensation are other names for this feeling, which follows when
  certain chemicals in gas form set off the parts inside the nose that pick up smells.
examples:
- She loved the smell of roses, and her olfactory perception of them pleased her.
- His olfactory perception of the roses came when the chemicals reached his nose.
