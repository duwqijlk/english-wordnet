synsetId: 04654347-n
simpleMeaning: the quality of honestly and firmly holding to a purpose and not giving up on it
scope: The quality of staying firmly with a purpose; not the act of tying yourself to a way of acting,
  and not a contract with a duty to pay money.
examples:
- Her commitment to the team never weakened, even during the hardest years.
- He showed real commitment by holding to his goal for ten years.
