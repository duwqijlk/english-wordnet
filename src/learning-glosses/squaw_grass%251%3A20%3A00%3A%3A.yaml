simpleMeaning: a plant of western North America with woody underground stems and tufts of stiff narrow
  leaves at the base, and spikes of creamy white flowers
scope: 'Also called bear grass: a western plant with stiff narrow leaves and spikes of creamy white flowers,
  not a true grass of open fields and not a lily with broad leaves.'
examples:
- Squaw grass grew in thick tufts on the dry hillside.
- The squaw grass sent up spikes of creamy white flowers.
