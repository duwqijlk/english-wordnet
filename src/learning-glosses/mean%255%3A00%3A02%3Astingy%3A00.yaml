simpleMeaning: A person who is unwilling to give or share, or behavior that shows this unwillingness.
scope: This concerns a person or behavior, not the size of a sum of money or living conditions.
examples:
- She was mean with her money and never contributed to the fund.
- His refusal to share even one blanket showed how little he would give.
