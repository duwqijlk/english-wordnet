simpleMeaning: A town or city is split into several small areas for voting, and each area has one place
  where people vote
scope: A small voting area in a town or city with one place to vote, not a whole town and not a large
  area for choosing members of a national government.
examples:
- Each election district in our town has a single polling place.
- The map showed how the city was split into election districts.
