simpleMeaning: stated as the nearest whole number or nearest multiple of ten, a hundred, or a thousand
scope: This describes a figure stated to the nearest unit, not something shaped like a circle and not
  a full, rich sound.
examples:
- Give me a round figure for the total cost.
- The population was reported in round numbers, around 50,000.
