simpleMeaning: Seen only with a tube that makes far-off things look close.
scope: Said of a thing seen only with such a tube, not of eyes or sight that can pick out far-off things.
examples:
- The bright star has a telescopic companion that only a lens can show.
- That faint moon is telescopic, too dim for the bare eye.
