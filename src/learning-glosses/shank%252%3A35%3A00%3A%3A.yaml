simpleMeaning: to hit a golf ball with the heel of the club, so it flies off in the wrong way
scope: To hit a golf ball with the heel of the club so it flies off wrong, not the bad shot itself, and
  not the lower leg of a horse.
examples:
- He shanked the ball into the trees.
- She shanked her shot and lost the hole.
