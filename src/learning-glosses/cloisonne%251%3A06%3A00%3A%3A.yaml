simpleMeaning: Things made of metal with a hard glassy coloured coating, in which the colours are kept
  apart by thin strips of metal.
scope: Things made of metal with a hard glassy coloured coating, the colours kept apart by thin strips
  of metal; not plain painted metal, and not the describing word for metal made in this way.
examples:
- The vase was fine cloisonne with blue and gold panels.
- She collected cloisonne boxes from the market.
