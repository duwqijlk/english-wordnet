simpleMeaning: A way of taking pictures of the brain that shows where blood flows when parts of the brain
  are at work.
scope: This is a brain scan that shows blood flow to working parts of the brain; not a plain picture of
  the brain's shape, and not a scan of the body outside the head.
examples:
- Functional magnetic resonance imaging showed blood flowing to the part of her brain that moves her hand.
- The team used functional magnetic resonance imaging to watch the brain at work.
