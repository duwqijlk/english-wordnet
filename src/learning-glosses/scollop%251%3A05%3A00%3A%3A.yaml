simpleMeaning: An edible sea bivalve with a fluted fan-shaped shell, swimming by squirting water from
  the shell in a run of snapping moves.
scope: This sense is also called scallop and escallop, for an edible sea bivalve with a fluted fan-shaped
  shell, unlike the sense for a thin slice of meat, especially veal, usually fried or broiled, and unlike
  the sense for the edible muscle of mollusks with fan-shaped shells, served broiled or poached or in
  salads or cream sauces.
examples:
- Scollops swim by squirting water.
- Scollops taste good broiled.
