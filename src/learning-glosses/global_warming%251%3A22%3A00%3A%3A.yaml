simpleMeaning: A long-lasting rise in the mean heat of the air around the Earth, which changes weather
  over time
scope: A lasting rise in air heat around the Earth, not a short hot spell and not a change in one place
  only.
examples:
- Scientists say global warming is raising sea levels.
- Global warming may bring hotter summers and heavier rain.
