simpleMeaning: Used to put a wash holding medicine, or a wash that cleans, on the ball in its socket,
  this small holder has a curved edge that fits round it.
scope: Also called an eyebath and an eyecup, this small holder with a curved edge is used to put a wash
  holding medicine, or a wash that cleans, on the ball in its socket.
examples:
- She filled the eye cup with the wash and held it to her eye.
- The eye cup has a curved rim that fits neatly round the eye.
