simpleMeaning: In cosmology, what fills all of space today is the cooled remains of the hot big bang,
  with an average temperature of about 2.725 kelvin.
scope: Also called cosmic microwave background and cosmic microwave background radiation, it is the cooled
  remains of the big bang, not light from stars.
examples:
- Scientists study the cosmic background radiation to learn about the early universe.
- The cosmic background radiation is left over from the big bang.
