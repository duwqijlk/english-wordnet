simpleMeaning: Small furry tree animals of Australia with a pouch for their young and long tails that
  can usually grip branches
scope: A small furry tree animal of Australia, not the night tree animal of the Americas of the same name.
examples:
- A possum slept in the gum tree through the day.
- The possum's tail curled around the branch as it climbed.
