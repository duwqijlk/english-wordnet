schema: oewn-learning-gloss-v2
senseId: 'wasteful%3:00:00::'
synsetId: 02430842-a
simpleMeaning: likely to use much more than is needed or to use things without care
scope: This sense is about using too much or using things without care, not about doing great harm and
  leaving a place ruined.
examples:
- He is wasteful with water and leaves the tap running all day.
- Their wasteful use of paper means they buy new packs every week.
