simpleMeaning: a tube in the body through which a body fluid moves around
scope: A tube in the body through which a body fluid moves, also called a vessel, not a pipe or a container
  used outside the body.
examples:
- The vas was blocked, so the fluid could not flow.
- Each vas carries fluid to a different part of the body.
