senseId: 'boo%1:10:00::'
synsetId: 07138578-n
simpleMeaning: a sound of dislike and scorn that people let out when they hear or see something they do
  not like
scope: 'Also called a bird, a hiss, a snort, and a hoot: a sound of dislike and scorn, not a cheer and
  not a single word of protest.'
examples:
- The crowd gave a loud boo when the singer forgot the words.
- A few boos rose from the back of the hall.
