simpleMeaning: To flow slowly, in drops or in a stream that starts and stops
scope: To run slowly in drops or an unsteady stream, not a fast steady flow and not the noun sense of
  drops forming and falling.
examples:
- Water trickled onto the lawn from the broken hose.
- Tears trickled down her cheeks as she listened.
