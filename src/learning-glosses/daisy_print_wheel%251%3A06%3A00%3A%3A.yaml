simpleMeaning: a round part in a typing machine, with letters and marks set round its edge that strike
  paper to leave marks
scope: 'Another name for a daisy wheel: a round part with letters round its edge that strikes paper, not
  a wheel on a car and not the machine itself.'
examples:
- The daisy print wheel spun to bring the right letter to the paper.
- A cracked daisy print wheel left some letters faint on the page.
