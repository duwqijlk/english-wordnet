simpleMeaning: In computer science, a machine that puts the results of work done by a computer onto paper
scope: In computer science, a machine that puts the results of work done by a computer onto paper, not
  a person whose job is printing.
examples:
- The printer ran out of paper halfway through the report.
- She sent the report to the printer and waited for the pages.
