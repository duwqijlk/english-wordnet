simpleMeaning: having only a few small, not fully grown trees and other plants, with low bushes under
  them, spread thinly over the land
scope: Also called scrabbly. This describes land thinly covered with small trees and low bushes, not land
  thick with tall, fully grown trees.
examples:
- They walked across open scrubby woods with small trees and low bushes.
- The scrubby hills had only a few short trees growing on them.
