simpleMeaning: a fastener made of a wedge or pin pushed through a slot to hold two other pieces together
scope: A fastener made of a wedge or pin pushed through a slot to hold two other pieces together; cottar
  is another name for this sense, not a screw, and not a nail.
examples:
- The cotter held the two pieces together in the frame.
- He tapped the cotter through the slot to lock the joint.
