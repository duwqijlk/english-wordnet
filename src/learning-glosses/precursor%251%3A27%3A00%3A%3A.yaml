simpleMeaning: a material that another material is made from, especially by chemical changes in a living
  body
scope: This sense is a material that another material is made from, especially in a living body; it is
  not the finished material itself and not just a person or thing that comes before another.
examples:
- This chemical is a precursor; the body turns it into an important substance.
- Scientists measured the precursor in the blood before it changed into the final substance.
