simpleMeaning: A shrub from South Africa with forked spines and fruit like plums; people often plant it
  as a hedge.
scope: 'Also called hedge thorn and natal plum: a South African shrub with forked spines and plum-like
  fruit, planted as hedging, while its larger kin have bright green spines and shiny leaves.'
examples:
- Carissa bispinosa is often used as hedging in South Africa.
- The Carissa bispinosa has forked spines and plum-like fruit.
