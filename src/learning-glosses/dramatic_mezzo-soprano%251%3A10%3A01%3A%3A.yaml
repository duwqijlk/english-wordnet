simpleMeaning: from about the F below middle C up to the G two octaves above middle C, this kind of mezzo-soprano
  voice can sing across that whole range
scope: This is a kind of mezzo-soprano voice with a range from about the F below middle C to the G two
  octaves above it, not a soprano that sings higher still.
examples:
- The dramatic mezzo-soprano filled the hall with her voice.
- She trained as a dramatic mezzo-soprano and sang the role of the witch.
