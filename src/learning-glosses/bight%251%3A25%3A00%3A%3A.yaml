simpleMeaning: A turn where a line bends and curves, most often in a coastline.
scope: A turn where a line bends and curves, most often in a coastline, not the loose middle part of a
  slack rope, not a wide bay where the shore bends inward, and not the verb use for fastening with a bight.
examples:
- The road followed the bight of the coast for miles.
- From the hill we could see the bight where the shore curved round.
