simpleMeaning: a British measure for how much a container can hold, for liquid or dry things, equal to
  2 gallons
scope: This is the British measure equal to 2 gallons, for liquid or dry things, not the United States
  dry measure and not the verb senses about bothering a person or hitting lightly.
examples:
- In the old British market, a peck of flour was a common amount to buy.
- She ordered a peck of potatoes, which was two gallons in the old British measure.
