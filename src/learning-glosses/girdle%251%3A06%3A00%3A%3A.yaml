senseId: 'girdle%1:06:00::'
synsetId: 03117520-n
simpleMeaning: a piece of clothing a woman wears under her other clothes, fitting close to her body and
  holding its shape
scope: 'Also called stays and corset: a woman''s under-clothing that fits close and holds the body''s
  shape. It is not a band around the waist of a skirt or trousers, and not the verb senses about putting
  a band on or cutting around a tree.'
examples:
- She wore a girdle under her dress.
- The girdle felt tight around her waist.
