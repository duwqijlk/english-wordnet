simpleMeaning: Meat is what this tree-living animal of south-east Asia and the East Indies eats, and its
  coat is spotted or striped.
scope: Also called palm cat, this meat-eating animal spends its life in the trees of south-east Asia and
  the East Indies.
examples:
- A palm civet lives in the trees of south-east Asia.
- The palm civet eats meat.
