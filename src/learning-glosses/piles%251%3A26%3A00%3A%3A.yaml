simpleMeaning: swollen veins (thin tubes that carry blood) inside or outside the opening where solid waste
  leaves the body
scope: Swollen veins inside or outside the opening where solid waste leaves the body. Not a stack of things
  put one on top of another, and not a large amount of something.
examples:
- He saw a doctor because his piles were painful when he sat down.
- The doctor gave her cream to treat her piles.
