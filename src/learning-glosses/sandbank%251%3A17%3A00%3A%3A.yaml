simpleMeaning: a low hill of sand under the water near a shore or in a river, that shows above the water
  when the tide is low
scope: A low hill of sand under the water near a shore or in a river, not a beach and not a sand dune
  on land.
examples:
- The boat ran aground on a sandbank.
- At low tide the sandbank showed above the water.
