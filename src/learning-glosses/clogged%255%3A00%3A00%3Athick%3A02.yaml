simpleMeaning: grown thick and stuck together in soft, thick lumps, as blood does when it sets
scope: Not the blocked-up sense and not the loaded-down sense; this is about a liquid or soft stuff that
  has gone thick and lumpy.
examples:
- The seeds clogged together in the damp soil.
- The blood clogged into soft lumps around the cut.
