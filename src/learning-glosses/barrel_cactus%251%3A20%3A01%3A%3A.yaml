simpleMeaning: a ribbed, rounded cactus of the Ferocactus genus that does not branch, has many spines
  and usually bears large funnel-shaped flowers followed by dry fruit
scope: This is the ribbed Ferocactus kind; a similar Echinocactus plant is also called a barrel cactus
  but is a different sense.
examples:
- A barrel cactus stores water in its thick, ribbed stem.
- The barrel cactus in the desert garden opened its large funnel-shaped flowers.
