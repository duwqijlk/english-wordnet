simpleMeaning: a very strong feeling of suffering, with very bad pain in the mind or body
scope: 'Also called torture, and another name for it is agony: this is the strong pain feeling itself,
  not the annoyed feeling caused by being troubled, and not the act of hurting someone in mind.'
examples:
- The loss of his son put him in torment for years.
- She was in torment from the pain in her back.
