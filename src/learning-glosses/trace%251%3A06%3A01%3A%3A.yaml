simpleMeaning: one of two straps that join a horse's harness to a wagon or other vehicle, or to a crossbar
  that shares the pull
scope: One of two straps that join a horse to a cart, not a mark left by a passing foot and not the act
  of copying a drawing.
examples:
- The trace joined the horse's harness to the wagon.
- He checked both traces before the cart set off.
