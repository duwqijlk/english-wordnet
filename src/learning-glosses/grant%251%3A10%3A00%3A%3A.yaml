simpleMeaning: A deal giving someone the right to run a business controlled by another firm.
scope: A contract for operating a business under the control of another, not money given as aid and not
  a right or privilege on its own.
examples:
- He secured the grant to run the beer stand at the ball park.
- The grant gave the family the sole right to operate the ferry.
