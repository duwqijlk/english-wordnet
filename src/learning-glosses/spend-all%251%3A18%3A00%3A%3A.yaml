simpleMeaning: a person who wastes money without care, paying out far too much
scope: Also called spender and spendthrift, this is a person whose money is soon gone, not a person who
  saves money and not a person who steals it.
examples:
- He was a spend-all who never kept a penny.
- The spend-all bought gifts for everyone in the shop.
