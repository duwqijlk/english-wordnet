simpleMeaning: A water-based liquid with the chlorides of sodium, potassium, and calcium, matching animal
  tissues in salt level; used to treat dehydration and, in lab tests, for tissue outside the body.
scope: Also called Ringer's solution; a water-based liquid that matches animal tissues in salt level,
  not a drug for pain and not drinking water.
examples:
- The nurse gave him Ringer solution to correct his dehydration.
- In the lab, they kept the tissue in Ringer solution.
