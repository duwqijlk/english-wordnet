simpleMeaning: the hip, the buttock, and the top part of the leg in a person
scope: The hip, buttock and top of the leg on a person, not the same part of an animal and not the leg
  as a whole.
examples:
- He fell on his haunch and bruised it.
- The rider sat firm in the saddle, his haunch pressed against the leather.
