simpleMeaning: Bending first one way and then the other, again and again
scope: A road or path that turns and bends again and again, not a single bend and not a thing bent out
  of shape.
examples:
- The twisting road climbed the mountain in sharp turns.
- We drove down a twisting track full of bends.
