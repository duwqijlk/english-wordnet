simpleMeaning: With long speeches and the like, this person holds things up and will not answer or work
  with others.
scope: This is a person who will not answer or work with others and who holds things up with long speeches
  and the like.
examples:
- The stonewaller answered nothing and held things up with long speeches.
- A stonewaller holds things up with long speeches instead of answering.
