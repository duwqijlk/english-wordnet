simpleMeaning: to argue in a loud, angry way that upsets people around you
scope: 'Also called brawl: this is arguing loudly and angrily, not a quiet talk and not the noun for one
  strong argument about a price.'
examples:
- They continued to wrangle in the street long after they left the bar.
- The two men wrangled loudly outside the shop.
