simpleMeaning: Most times harmless, this huge flat sea animal of warm open seas eats tiny sea life and
  small fish, but its great size makes it a danger when harpooned.
scope: People also call it a devilfish or a manta ray, and it is the huge flat sea animal of warm open
  seas.
examples:
- A manta swam in the warm open sea, huge and flat.
- The manta turned dangerous once it had been harpooned.
