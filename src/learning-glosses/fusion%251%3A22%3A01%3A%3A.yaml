simpleMeaning: the joining of sounds, syllables, or words that sit next to each other into one
scope: The joining of sounds, syllables, or words that sit next to each other into one; not the joining
  of pictures from the eyes, and not the joining of atoms.
examples:
- In fast speech, fusion joins two sounds into one.
- Fusion of the two words made them hard to tell apart.
