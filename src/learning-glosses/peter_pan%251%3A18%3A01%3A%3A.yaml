simpleMeaning: A man who acts like a boy and seems never to grow up, named for the boy in Barrie's play.
scope: This is a man who acts like a boy and seems never to grow up, not a real boy and not a man who
  is simply young.
examples:
- He is a Peter Pan who refuses to settle down.
- At fifty he was still a Peter Pan.
