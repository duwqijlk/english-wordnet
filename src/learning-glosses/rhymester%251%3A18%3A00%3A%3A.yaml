simpleMeaning: 'Said with scorn of small, weak poets: a writer of lines that end in matching sounds, often
  a poor one.'
scope: 'Also called rhymer, versifier, poetiser, or poetizer: a writer of rhyming lines, often a poor
  one named with scorn, not a fine poet.'
examples:
- His verses were poor, and he was known as a rhymester.
- The rhymester wrote lines that all ended in the same sounds.
