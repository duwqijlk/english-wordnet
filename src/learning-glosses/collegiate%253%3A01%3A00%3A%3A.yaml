senseId: 'collegiate%3:01:00::'
synsetId: 02710260-a
simpleMeaning: to do with, like, or typical of a place for study after high school, or of the students
  who study there
scope: Collegial is another name for this sense. This is about a college or its students; not about a
  school for young children, and not about friendly relations between people at work.
examples:
- She plays in a collegiate sports league at her university.
- Collegiate life includes classes, sports, and living with other students.
