simpleMeaning: A common North American weed with narrow straight leaves and small round yellowish flower
  heads that lack outer petals, widely established across temperate regions and sometimes classed as an
  Erigeron.
scope: The common North American weed described here, now established across temperate regions; it is
  a plant, not a horse ailment, and botanists sometimes place it among the Erigerons.
examples:
- Horseweed has spread along roadsides across the whole region.
- The field was thick with horseweed by late summer.
