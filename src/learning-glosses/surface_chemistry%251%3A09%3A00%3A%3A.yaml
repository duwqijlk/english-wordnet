simpleMeaning: What goes on where a liquid meets a gas, and where other kinds of stuff meet, is the work
  of this part of the study of stuff.
scope: This is the part of the study of stuff that looks at what goes on where two kinds of stuff meet,
  above all a liquid and a gas.
examples:
- Where oil meets water, surface chemistry looks at what happens there.
- A course in surface chemistry taught how a gas meets a liquid.
