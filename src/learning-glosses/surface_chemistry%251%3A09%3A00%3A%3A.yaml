simpleMeaning: The branch of chemistry studying processes at interfaces between phases, especially between
  liquid and gas.
scope: This branch of chemistry focuses on what happens where phases meet, above all where a liquid meets
  a gas.
examples:
- Where oil meets water, surface chemistry looks at what happens there.
- A course in surface chemistry taught how a gas meets a liquid.
