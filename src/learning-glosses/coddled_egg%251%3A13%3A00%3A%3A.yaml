simpleMeaning: a food in a shell, cooked briefly in its shell in water that is boiling gently
scope: A food in a shell, cooked briefly in its shell in water that is boiling gently; boiled egg is another
  name for this, not one cooked hard and not one fried out of its shell.
examples:
- She served a coddled egg for breakfast.
- A coddled egg is cooked briefly in its shell.
