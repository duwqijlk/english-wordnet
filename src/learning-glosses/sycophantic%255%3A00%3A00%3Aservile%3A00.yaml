schema: oewn-learning-gloss-v2
senseId: sycophantic%5:00:00:servile:00
synsetId: 00793949-s
simpleMeaning: trying to win a person's liking or help by praising them too much and in a way that is
  not honest
scope: 'Also called fawning and bootlicking: this is about praising a person too much, in a way that is
  not honest, to win their liking or help, and the person does not have to have power. Not only the close
  sense about doing this to people with power.'
examples:
- His sycophantic praise of his new classmate was only a way to win her friendship.
- She was sycophantic to her neighbour, praising his cooking again and again so that he would help her.
