simpleMeaning: Several kinds of climbing plant curl round their neighbours as they grow; they belong to
  the groups Convolvulus and Calystegia.
scope: The groups Convolvulus and Calystegia hold several of these climbing plants.
examples:
- The bindweed wound round the fence posts.
- The bindweed wound round the fence as it grew.
