simpleMeaning: The part of the study of society that looks at how people vote, and how voting changes
  over time, by asking people in polls
scope: The study of voting trends, not the study of voting rules and not the work of running an election.
examples:
- She took up psephology after years of reporting on elections.
- His book on psephology uses polls to track how voters change their minds.
