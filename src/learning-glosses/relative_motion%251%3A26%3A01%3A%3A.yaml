simpleMeaning: What a thing's move looks like when judged against a fixed set of things, like two walls
  and the floor of a room.
scope: It is how a thing moves as seen from a fixed set of things, like two walls and the floor of a room.
examples:
- The train's relative motion made the trees seem to rush past the window.
- From the boat, the relative motion of the shore made the land look as if it were moving.
