simpleMeaning: A tree of Mexico and south-western California with tall column-like stems and creamy yellow
  flowers that smell of honey.
scope: Another name for cirio, the tall column-stemmed candlewood of Mexico and south-western California;
  not a cactus.
examples:
- The boojum tree's tall stem rose straight from the dry ground.
- Creamy yellow flowers on the boojum tree smell of honey.
