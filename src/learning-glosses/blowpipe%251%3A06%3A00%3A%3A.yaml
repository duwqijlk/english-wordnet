simpleMeaning: a hollow rod used to push air or gas into a flame so that the heat is stronger in one place
scope: 'Also called blow tube and blowtube: a rod that pushes air or gas into a flame to make the heat
  stronger, not a straw for drinking, and not a pipe for smoking.'
examples:
- The glassworker held the blowpipe to the flame to make the heat fierce enough to bend the glass.
- With a blowpipe, the metalworker aimed a jet of air into the fire.
