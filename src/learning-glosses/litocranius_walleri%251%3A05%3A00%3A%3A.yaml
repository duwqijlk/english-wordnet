simpleMeaning: A thin East African antelope with a slim neck and horns that curve back.
scope: 'Also called gerenuk: a thin East African antelope with a slim neck and backward-curving horns,
  not a heavy antelope and not an antelope with straight horns.'
examples:
- A Litocranius walleri grazed on the dry plain, its slim neck held high.
- We saw Litocranius walleri with horns curving back.
