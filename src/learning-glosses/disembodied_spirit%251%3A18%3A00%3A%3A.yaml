simpleMeaning: A being from beyond the body, without flesh, that can show itself or be heard by people.
scope: A being without a body that can show itself or be heard, also called a spirit; not a living person
  and not a dream.
examples:
- The old house was said to hold a disembodied spirit.
- A disembodied spirit spoke in the dark room.
