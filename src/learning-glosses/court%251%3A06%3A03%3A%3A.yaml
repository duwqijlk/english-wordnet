simpleMeaning: a hotel for people traveling by car, where the rooms open directly onto the parking area
scope: This is a place to stay overnight with parking beside the rooms, not an enclosed yard, a playing
  surface, or a royal home.
examples:
- We spent the night at a motor court beside the highway, with the car parked right outside our room.
- A neon sign for the old motor court still glows above the empty parking lot.
