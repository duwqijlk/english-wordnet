senseId: 'exocrine%3:01:00::'
synsetId: 02926694-a
simpleMeaning: to do with glands that send fluid out through a tube, or with the fluid those glands send
  out
scope: Said of things to do with glands that send fluid out through a tube, not of the glands themselves
  and not of glands that send fluid straight into the blood.
examples:
- Sweat is an exocrine secretion that cools the body.
- The doctor studied the exocrine tissue to learn how the glands work.
