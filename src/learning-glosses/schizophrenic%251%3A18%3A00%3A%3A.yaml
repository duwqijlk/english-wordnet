simpleMeaning: a person who has schizophrenia, a serious illness of the mind that can change how a person
  thinks and sees what is real
scope: This names a person who has the illness, not the illness itself and not a word that describes a
  person or thing to do with the illness.
examples:
- As a schizophrenic, he takes medicine each day and meets his doctor often.
- The group gives housing help to a schizophrenic who has no home.
