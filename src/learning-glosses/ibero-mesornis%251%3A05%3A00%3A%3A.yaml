simpleMeaning: a fossil bird the size of a sparrow, from the dinosaur age, with a small leftover tail,
  found in Spain, thought to be maybe the third oldest of all birds
scope: 'Also called iberomesornis: a sparrow-sized fossil bird from the dinosaur age found in Spain, not
  a living bird and not a dinosaur.'
examples:
- The ibero-mesornis fossil was dug up in Spain.
- An ibero-mesornis had a tail, unlike most birds today.
