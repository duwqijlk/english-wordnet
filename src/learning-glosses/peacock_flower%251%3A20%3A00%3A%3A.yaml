simpleMeaning: A showy tropical tree or shrub from Madagascar, widely planted in warm regions for its
  huge sprays of scarlet and orange flowers, sometimes classed in the genus Poinciana.
scope: This is the Madagascar tree with huge scarlet and orange flower sprays, not the bird called a peacock
  or another flowering shrub.
examples:
- The peacock flower along the road was covered in scarlet blossoms.
- Gardeners in the tropics grow the peacock flower for its huge orange-red clusters.
