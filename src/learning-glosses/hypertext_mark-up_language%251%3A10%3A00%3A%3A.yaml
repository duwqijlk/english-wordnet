simpleMeaning: A set of labels and rules, made to fit SGML, an older set of rules for setting out text,
  for building pages of linked text.
scope: A set of labels and rules for building pages of linked text; hypertext markup language is another
  name for it, not a set of rules for laying out printed pages and not a computer language for writing
  programs.
examples:
- She learned hypertext mark-up language to build her first web page.
- Hypertext mark-up language uses labels to mark the parts of a page.
