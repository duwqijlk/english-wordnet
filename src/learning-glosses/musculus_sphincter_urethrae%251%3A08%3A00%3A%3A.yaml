simpleMeaning: A striped ring muscle that squeezes shut the tube carrying urine out of the body.
scope: A striped ring muscle that squeezes shut the urine tube; not a smooth muscle, and not a muscle
  of the gut.
examples:
- The musculus sphincter urethrae holds urine in the bladder.
- When the musculus sphincter urethrae relaxes, urine flows out.
