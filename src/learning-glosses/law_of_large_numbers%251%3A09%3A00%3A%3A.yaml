simpleMeaning: In statistics, the figures of a whole group are, on the whole, the same figures that many
  things picked by chance from that group will show
scope: In statistics, a rule about chance picks from a group matching the group as a whole, not a rule
  about one pick and not a rule about small groups.
examples:
- The law of large numbers says a big sample should look like the whole group.
- By the law of large numbers, the average of many coin tosses comes close to half heads.
