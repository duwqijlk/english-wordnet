simpleMeaning: A piece of material used in a garment to make it stronger or roomier
scope: 'Another name for this sense is inset: a piece of material used in a garment to strengthen or enlarge
  it, not a metal plate for a joist, and not a piece of chain mail.'
examples:
- The tailor added a gusset to the shirt to give it more room.
- A gusset under the arm made the jacket fit better.
