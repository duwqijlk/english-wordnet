simpleMeaning: showing feelings openly, in what you say and do
scope: Showing feelings openly in words and actions; not the sense that means serving to show or prove
  something.
examples:
- She is a warm, demonstrative mother who hugs her children often.
- The demonstrative fans cheered, cried, and hugged each other after the win.
