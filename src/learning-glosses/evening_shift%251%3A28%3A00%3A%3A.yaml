simpleMeaning: a set of work hours in the time after the afternoon and before night, from 4 in the afternoon
  to midnight
scope: A set of work hours in the time after the afternoon and before night, not a set of work hours in
  the morning and not a set of work hours at night.
examples:
- Her evening shift runs from 4 in the afternoon to midnight.
- He took the evening shift so he could look after the children in the morning.
