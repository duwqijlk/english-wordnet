simpleMeaning: set out by Tito Livio Burattini in 1675, it is a unit of length as long as a free seconds
  pendulum, half a centimetre away from the length used today
scope: Also called catholic meter, catholic metre, universal meter, and universal metre, it is a unit
  of length set out by Burattini in 1675.
examples:
- The metro cattolico differed from the modern metre by half a centimetre.
- Burattini set out the metro cattolico in 1675.
