simpleMeaning: One of various drugs for treating blood pressure that is high or an uneven heartbeat, weakening
  and slowing heartbeats by shutting off beta-adrenergic receptors found among self-working nerves.
scope: Also called beta-adrenergic blocker, beta-adrenergic blocking agent, and beta-blocking agent, one
  of various drugs for treating blood pressure that is high or an uneven heartbeat, weakening and slowing
  heartbeats by shutting off beta-adrenergic receptors found among self-working nerves.
examples:
- Beta blockers treat high blood pressure.
- Beta blocker weakens the heartbeat.
