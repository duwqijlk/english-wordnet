simpleMeaning: Saponin, a bitter plant stuff that stings, is held in the dried root of two plants of the
  group Polygala.
scope: This dried root of two Polygala plants is not the living bushy herb of the same name.
examples:
- The senega root came from two plants.
- Saponin in senega stings.
