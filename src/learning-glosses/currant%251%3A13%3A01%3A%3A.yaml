simpleMeaning: any of several sour red or black berries used mainly for jellies and jams
scope: These are fresh sour berries for jellies and jams, not the small dried fruit used in cooking and
  not the bush plant they grow on.
examples:
- She made jam from red currants she picked in the garden.
- Black currants have a strong sour taste.
