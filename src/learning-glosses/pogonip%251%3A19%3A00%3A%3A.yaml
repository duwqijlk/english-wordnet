simpleMeaning: Thick cold fog with bits of ice in it, in winter
scope: 'Also called ice fog: thick cold fog with bits of ice in it in winter, not a light mist and not
  snow falling from the sky.'
examples:
- A thick pogonip hung over the valley all morning.
- Drivers slowed down in the pogonip, which was full of tiny bits of ice.
