simpleMeaning: A mild skin trouble that makes the skin much too dry and rough
scope: 'Also called xerodermia: a mild skin trouble with dry rough skin, not a rash that itches and not
  skin that is only sun-dried.'
examples:
- Xeroderma left her hands dry and rough all winter.
- The doctor said his xeroderma was mild.
