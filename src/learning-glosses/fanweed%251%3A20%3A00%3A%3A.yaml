simpleMeaning: a bad-smelling weed from Europe and Asia with round flat seed cases, now growing wild all
  over North America
scope: This is a bad-smelling weed with round flat seed cases; field pennycress, mithridate mustard, penny
  grass and stinkweed are other names for this sense; not a garden plant and not a weed with long pods.
examples:
- Fanweed spread across the field with its flat pods.
- The fanweed smelled bad when crushed.
