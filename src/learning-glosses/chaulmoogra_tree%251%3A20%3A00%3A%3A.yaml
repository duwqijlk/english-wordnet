simpleMeaning: an East Indian woody plant with oily seeds, whose oil is used to treat leprosy
scope: An East Indian woody plant whose seed oil is used to treat leprosy; chaulmoogra and chaulmugra
  are other names for this sense, not a fruit tree grown for food.
examples:
- They planted a chaulmoogra tree near the clinic.
- The chaulmoogra tree gives oily seeds.
