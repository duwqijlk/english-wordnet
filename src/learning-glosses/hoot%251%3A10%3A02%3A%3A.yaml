simpleMeaning: a cry or noise people make to show they are not pleased or think little of someone
scope: 'This sense is also called bird, hiss, snort, and boo: a cry or noise that shows people are not
  pleased or think little of someone; it is not the loud cry of an owl and not the verb sense of shouting
  loudly.'
examples:
- The crowd gave a hoot when the singer stopped early.
- Hoots came from the angry fans after the bad play.
