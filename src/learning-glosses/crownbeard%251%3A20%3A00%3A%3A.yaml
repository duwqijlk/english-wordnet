simpleMeaning: a plant from one group of plants, Verbesina, whose white or yellow flower heads grow in
  close bunches
scope: 'Also called crown beard and crown-beard: a plant from one group of plants, Verbesina, with white
  or yellow flower heads in close bunches, not a plant with one big flower head and not other plants with
  white or yellow flowers.'
examples:
- The crownbeard in the field had bunches of small white flowers.
- Yellow crownbeard grows along the road in late summer.
