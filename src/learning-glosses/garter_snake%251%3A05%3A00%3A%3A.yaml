simpleMeaning: Found in North and Central America, these are one of many harmless long thin animals with
  lines along their bodies that give birth to live young.
scope: Also called a grass snake, this is one of many harmless striped animals that give birth to live
  young in North and Central America.
examples:
- The garter snake showed lines along its body.
- We saw a garter snake with lines along its body.
