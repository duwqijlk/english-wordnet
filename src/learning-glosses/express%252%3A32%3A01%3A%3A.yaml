senseId: 'express%2:32:01::'
synsetId: 00945869-v
simpleMeaning: to show a feeling, thought, or quality so that other people can see or understand it.
scope: This is about making an inner feeling or idea visible to others, not about saying words aloud and
  not about something being a sign of something else.
examples:
- She expressed her thanks with a warm hug.
- The children expressed their excitement by jumping up and down.
