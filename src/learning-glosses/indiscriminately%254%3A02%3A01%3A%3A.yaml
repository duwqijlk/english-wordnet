simpleMeaning: in a way that treats all things the same, with no careful choice between them
scope: Done with no careful choice between things or people; not done carefully for a chosen few, and
  not done in a set order.
examples:
- The guards fired indiscriminately into the crowd.
- She buys books indiscriminately and soon has no room left for them.
