simpleMeaning: A long-lasting illness that gets worse over time, in which the coating round some nerve
  threads is lost
scope: A long-lasting nerve illness, also called disseminated sclerosis or multiple sclerosis; not a short
  illness of the nerves.
examples:
- Disseminated multiple sclerosis slowly took away the feeling in her legs.
- He was told disseminated multiple sclerosis had damaged the coating round his nerves.
