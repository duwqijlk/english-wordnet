simpleMeaning: a chapel paid for so that Masses are sung for the soul of the giver
scope: A chapel paid for so that Masses are sung for the soul of the giver, not a large church and not
  a chapel for daily prayer.
examples:
- The chantry was built so that Masses could be sung for its donor.
- A chantry stood at the far end of the church.
