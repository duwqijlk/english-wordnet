simpleMeaning: a long fishing cord with many short cords and hooks joined to it, most often hung between
  floating marks
scope: A long fishing cord with short cords and hooks, also called a trotline, a trawl, a spiller and
  a trawl line; not a single rod and line and not a net.
examples:
- He put out a setline across the bay before dark.
- The setline caught three fish overnight.
