simpleMeaning: a part of a longer written work or piece of music that is complete by itself
scope: Also called a section; this is a part of a book or a piece of music, not the act of splitting something
  up and not an area of land split into smaller pieces.
examples:
- The longest subdivision of the book deals with the war years.
- Each subdivision of the song can be played on its own.
