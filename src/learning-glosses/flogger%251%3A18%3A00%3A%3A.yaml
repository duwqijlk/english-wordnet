senseId: 'flogger%1:18:00::'
synsetId: 10116733-n
simpleMeaning: A person who beats others with a whip as a punishment, above all an official whose job
  is to whip people who have broken the law.
scope: A person who beats others with a whip as a punishment, above all an official; not a person who
  hurts others in anger and not a judge who gives the punishment.
examples:
- The flogger was ordered to whip the prisoner ten times.
- In old times a flogger carried out the whipping in the town square.
