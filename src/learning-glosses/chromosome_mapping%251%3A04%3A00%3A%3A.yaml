simpleMeaning: In genetics, the work of finding where genes sit on the long threads in a cell that carry
  them
scope: In genetics, the work of finding where genes sit on the long threads in a cell that carry them;
  mapping is another name for this sense, and it is not reading the genes themselves or a map of the whole
  body.
examples:
- Chromosome mapping showed the gene sat near one end of the thread.
- The team used chromosome mapping to place each gene in its spot.
