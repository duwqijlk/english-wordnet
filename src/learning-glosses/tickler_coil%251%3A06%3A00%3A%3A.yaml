simpleMeaning: Part of the output is sent back by this small wound wire, joined to the wire net inside
  an airless glass tube and in line with its power-taking end.
scope: One of the small wound wires inside an airless glass tube, this one is joined to the wire net and
  sends part of the output back.
examples:
- The tickler coil sits in line with the power end of the glass tube.
- The wire net inside the tube is joined to the tickler coil.
