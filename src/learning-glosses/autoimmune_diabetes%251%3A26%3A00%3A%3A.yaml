senseId: 'autoimmune_diabetes%1:26:00::'
synsetId: 14141905-n
simpleMeaning: A severe early-onset diabetes in which the immune system attacks insulin-making cells,
  causing frequent urination, thirst, hunger, weight loss and occasional blood acid build-up; diet and
  insulin injections are needed.
scope: Another name for the severe, early-onset form of diabetes caused by an immune attack on the insulin-making
  cells, also called juvenile diabetes and insulin-dependent diabetes; not adult-onset type 2 diabetes,
  and not diabetes insipidus.
examples:
- Autoimmune diabetes is treated with insulin injections from the day it is diagnosed.
- In autoimmune diabetes, the body's own defenses destroy the cells that release insulin.
