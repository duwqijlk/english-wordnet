simpleMeaning: Spikes of flowers shaped like fingers top this rough one-year plant of the warm lands of
  the Old World, now a weed that grows wild elsewhere
scope: Also called goose grass, wire grass, and yardgrass, this rough one-year plant of the warm lands
  of the Old World is now a weed that grows wild elsewhere.
examples:
- Yard grass has spikes of flowers shaped like fingers.
- This yard grass came from the warm lands of the Old World.
