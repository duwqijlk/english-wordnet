simpleMeaning: In the southeast United States grows a thorny tree, bare in winter, whose white flowers
  give way to small black stone fruit.
scope: Shittim, shittimwood, and southern buckthorn are other names for this thorny tree of the southeast
  United States, not the large hardy shrub with showy fragrant flowers of the other mock orange sense.
examples:
- The mock orange bore white flowers.
- They planted a mock orange with small black fruit.
