simpleMeaning: The amount of collateral a customer deposits with a broker when borrowing from the broker
  to buy securities.
scope: This is also called margin, and it is the money or goods a buyer leaves with a broker as a promise
  when borrowing to buy shares.
examples:
- He put down a security deposit before the broker would lend him the money.
- They left a security deposit with the broker when borrowing to buy shares.
