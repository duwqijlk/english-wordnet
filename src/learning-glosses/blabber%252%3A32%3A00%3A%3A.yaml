simpleMeaning: to talk fast and without stopping about small, unimportant things
scope: 'Also called chatter, clack, prattle, gibber, gabble, blab, tattle, piffle, prate, twaddle, palaver
  and maunder: to talk fast and without stopping about small, unimportant things, not a serious talk about
  important things.'
examples:
- He blabbered about the football game for a whole hour.
- Please stop blabbering about small things and get to work.
