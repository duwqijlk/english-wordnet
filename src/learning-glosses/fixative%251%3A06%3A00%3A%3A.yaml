simpleMeaning: A varnish mixed with alcohol and sprayed over pictures to keep them from smudging.
scope: A varnish mixed with alcohol and sprayed over pictures to keep them from smudging; not a chemical
  used to set tissues for study, and not a plain varnish brushed on wood.
examples:
- She sprayed fixative over the drawing to stop it smudging.
- The fixative kept the charcoal lines in place.
