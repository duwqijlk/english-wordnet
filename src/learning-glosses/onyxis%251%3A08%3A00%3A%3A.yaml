simpleMeaning: a toenail whose free tip or edges have grown into the flesh around it
scope: A toenail whose free tip or edges have grown into the flesh around it; ingrown toenail is another
  name for this sense, not a toenail that has fallen off and not a bruised toe.
examples:
- Onyxis made every step hurt until the nail was treated.
- Her onyxis hurt where the nail edge had grown into the flesh.
