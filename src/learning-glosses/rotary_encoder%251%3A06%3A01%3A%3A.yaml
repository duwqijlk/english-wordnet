simpleMeaning: A code of numbers or waves comes from a machine run by power that turns how far a rod has
  turned, or how it moves.
scope: Shaft encoder is another name for this machine run by power, which turns how far a rod has turned,
  or how it moves, into a code of numbers or waves.
examples:
- The rotary encoder sent a code of numbers.
- A rotary encoder told how far the rod had turned.
