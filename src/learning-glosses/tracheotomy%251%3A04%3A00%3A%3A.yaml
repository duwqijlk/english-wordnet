simpleMeaning: A surgeon's cut that opens the windpipe, with a tube set in to let air through, done when
  the throat is blocked by swelling, cancer, or other causes.
scope: A surgeon's cut that opens the windpipe, with a tube set in to let air through, done when the throat
  is blocked by swelling, cancer, or other causes; also called tracheostomy.
examples:
- Their tracheotomy saved the child.
- The tracheotomy was done at dawn.
