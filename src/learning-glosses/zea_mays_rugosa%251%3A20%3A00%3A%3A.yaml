simpleMeaning: A corn plant grown so that its young ears are sweet and good to eat.
scope: Also called Zea saccharata, green corn, sugar corn, sweet corn, or a sweet corn plant, this is
  a corn plant grown for sweet young ears that are good to eat, not the flour corn whose kernels are almost
  all soft starch.
examples:
- We planted Zea mays rugosa for its sweet young ears.
- Zea mays rugosa gives young ears that are sweet and good to eat.
