simpleMeaning: Starches, proteins, and fats are broken down with the help of this liquid, which the pancreas
  sends into the first part of the gut after the stomach.
scope: This liquid comes from the pancreas and works in the gut, breaking down starches, proteins, and
  fats.
examples:
- The pancreatic juice flows from the pancreas into the gut.
- Pancreatic juice breaks down starches, proteins, and fats in the gut.
