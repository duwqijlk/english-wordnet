simpleMeaning: where the brain meets the spinal cord lie the lowest part, the bridge, the middle part
  and parts of the small region below the centre
scope: 'Also called brain stem and brainstem: the part of the brain joined to the spinal cord, not the
  whole brain and not the spinal cord itself.'
examples:
- The brain-stem is the part of the brain that joins the spinal cord.
- The brain-stem is made up of several smaller parts.
