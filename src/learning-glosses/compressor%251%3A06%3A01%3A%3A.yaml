senseId: 'compressor%1:06:01::'
synsetId: 92461567-n
simpleMeaning: An electronic device that makes the softest and loudest parts of a sound closer together
  in volume.
scope: An electronic device that narrows the range of a sound signal, not the mechanical device that squeezes
  gases.
examples:
- The engineer used a compressor to even out the singer's voice.
- A compressor keeps loud peaks from jumping out of the mix.
