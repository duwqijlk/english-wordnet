simpleMeaning: A small, thick-set bird, almost wholly of the water, that builds floating nests, like a
  loon but smaller, with lobed, not webbed, feet.
scope: Of a small water bird that builds floating nests and dives at dawn, like a loon but smaller.
examples:
- Their grebe dived at dawn.
- The grebe nested on the lake.
