simpleMeaning: A very large old leafy plant of the warm wet Pacific lands, in kinds that differ a lot
  from place to place
scope: This is a very large old fern of the warm wet Pacific lands, in kinds that differ a lot; angiopteris
  is another name for this sense, not a small garden plant and not a tree.
examples:
- The giant fern spread its fronds over the path.
- A giant fern grew beside the stream in the warm wet forest.
