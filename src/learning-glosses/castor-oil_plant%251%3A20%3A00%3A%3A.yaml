simpleMeaning: Large shrub from tropical Africa and Asia with hand-shaped leaves and spiny capsules whose
  seeds yield a thick oil and the poison ricin; now widely spread through the tropics.
scope: Another name for the same tropical shrub, also called palma christi; not the oil pressed from its
  seeds or the seed itself.
examples:
- The castor-oil plant can grow as tall as a small tree in a single season.
- In many hot countries the castor-oil plant has escaped gardens and now grows wild.
