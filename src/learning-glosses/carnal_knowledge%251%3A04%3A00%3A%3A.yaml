simpleMeaning: the act in which a man and a woman have sex until the strongest feeling comes and fluid
  is released, with a man's penis inside a woman's vagina
scope: 'Also called relation, intercourse, coitus, coition, copulation, sex act, sexual congress, sexual
  intercourse, and sexual relation: the act of having sex, not a kiss or an embrace.'
examples:
- In law, carnal knowledge means full sexual intercourse.
- The old statute used carnal knowledge to mean the sex act itself.
