simpleMeaning: A part of the United States government that looks after people who served in the armed
  forces, made in nineteen eighty-nine.
scope: This word is about the government office that serves people who served in the armed forces, not
  the one that looks after the country's safety.
examples:
- The Department of Veterans Affairs looks after people who served in the armed forces.
- The Department of Veterans Affairs was made in nineteen eighty-nine.
