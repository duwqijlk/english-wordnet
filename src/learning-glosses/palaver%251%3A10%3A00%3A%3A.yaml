simpleMeaning: Loud, muddled talk with nothing in it.
scope: Loud, muddled talk with nothing in it; also called rhetoric; not winning one over by soft words,
  stroking, or flattery, nor to rattle on fast about things of no weight.
examples:
- Their palaver filled the hall.
- The palaver went on for hours.
