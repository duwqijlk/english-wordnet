simpleMeaning: The pedal you press with your foot to open or close the valve that sets an engine's speed.
scope: This is a vehicle's accelerator pedal, not a weapon that fires a missile from a tube, not large
  transportable armament, not a person judged by shooting skill, not a hired killer, not a hand pump that
  forces grease into machinery, not a ceremonial firing of a firearm as a signal or salute, and not the
  verb meaning to shoot.
examples:
- He put his foot on the gun and the old truck slowly picked up speed.
- The rubber cover had worn off the gun, making the pedal slippery.
