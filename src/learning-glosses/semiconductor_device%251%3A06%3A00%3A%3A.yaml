senseId: 'semiconductor_device%1:06:00::'
synsetId: 04178892-n
simpleMeaning: a part that carries electric current and is made from a substance that partly carries it
scope: It is a part that lets current pass through a substance that passes it only in part; semiconductor
  and semiconductor unit are other names for this sense, not a wire and not a part made of plain metal.
examples:
- A semiconductor device controls the flow of current in the radio.
- The semiconductor device failed and the set went dead.
