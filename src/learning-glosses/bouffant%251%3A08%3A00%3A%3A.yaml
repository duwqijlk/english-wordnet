simpleMeaning: a woman's style of hair in which the hair stands up and looks big and full
scope: A woman's hair style that looks big and full, not loose flat hair and not a short cut close to
  the head.
examples:
- She wore her hair in a bouffant for the party.
- The singer's bouffant made her hair look tall and full.
