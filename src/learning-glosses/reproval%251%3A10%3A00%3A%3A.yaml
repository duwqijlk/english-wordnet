simpleMeaning: A deed or words of blame and censure.
scope: This sense is also called rebuke, reprimand, and reproof, for a deed or words of blame and censure,
  where rebuke is words or an act that tell someone off for what they did, and reprimand is an act, or
  words, that show strong disapproval.
examples:
- Reproval is a deed of blame.
- Reproval comes in words of censure.
