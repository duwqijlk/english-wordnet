senseId: 'proof%1:10:01::'
synsetId: 06603166-n
simpleMeaning: In printing, a test copy of text or an image made so that mistakes can be found.
scope: This is a printer's trial copy read for mistakes, not a trial photograph and not evidence that
  something is true.
examples:
- The editor read the proof and marked three typos.
- She checked the final proof before the book went to press.
