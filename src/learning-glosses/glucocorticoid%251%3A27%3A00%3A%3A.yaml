simpleMeaning: A hormone, a fat-like substance called a steroid, made by the outer layer of a small gland
  above the kidney in animals, acting on sex glands and calming inflammation.
scope: A steroid hormone from the outer layer of a small gland above the kidney, acting on the sex glands
  and calming inflammation.
examples:
- The doctor gave her a glucocorticoid to calm the swelling.
- Glucocorticoids act on the sex glands as well as on swelling.
