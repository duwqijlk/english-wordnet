simpleMeaning: A plant of Tropaeolum (its science group name), from hot parts of America, with sharp-tasting
  juice and yellow to red flowers with long thin parts at the back
scope: This is the living plant itself, with yellow to red flowers; it is not the other sense, where its
  flowers, seeds and leaves are used to give food a sharp taste.
examples:
- Nasturtiums with bright red flowers grew along the fence.
- She planted nasturtium in a sunny pot, and soon yellow flowers opened.
