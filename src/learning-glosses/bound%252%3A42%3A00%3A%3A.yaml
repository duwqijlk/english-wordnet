simpleMeaning: Stretch along the edge of something, or touch it directly.
scope: 'Another name for border: to lie along the edge of an area or touch it, not to move forward with
  jumps, and not the noun for a light jump.'
examples:
- The field is bounded by a low stone wall.
- A canal bounds the north side of the property.
