simpleMeaning: To be sorted into the group or type that is right for it.
scope: Correct classification in a group or type, not membership in an organization or place, ownership,
  or being a mere part of something.
examples:
- This species belongs with the reptiles, not the amphibians.
- The guitar belongs among stringed instruments.
