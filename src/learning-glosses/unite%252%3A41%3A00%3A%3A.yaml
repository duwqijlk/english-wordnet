simpleMeaning: to act together with others for the same purpose or because of the same belief
scope: 'Also called unify: this is about people acting together for a shared purpose or belief, not about
  two things being joined or linked together.'
examples:
- The workers united to ask for better pay.
- People from many towns united around the same belief.
