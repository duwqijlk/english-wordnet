simpleMeaning: the act of keeping an activity going without a break or a stop
scope: 'Also called continuance: this is keeping an activity going without a stop, not a part added to
  a book or play and not a thing being made longer in time.'
examples:
- The continuation of work through the night let the team finish on time.
- The continuation of the music, with no pause at all, held the attention of the crowd.
