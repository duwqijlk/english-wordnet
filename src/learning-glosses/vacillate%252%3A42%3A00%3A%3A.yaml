simpleMeaning: to be unsure what to do, and to keep moving between two opposite choices or ways of acting
scope: 'Also called hover, vibrate and oscillate: to be unsure what to do and keep changing your choice.
  Not to move or sway in a rising and falling wave-like pattern.'
examples:
- She vacillated for days between taking the new job and staying where she was.
- He keeps vacillating about whether to buy the car or wait.
