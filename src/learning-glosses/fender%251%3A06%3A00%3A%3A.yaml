simpleMeaning: A soft pad or block that takes the force of a blow and keeps it from doing harm
scope: A soft pad that takes the force of a blow, also called buffer; not the low guard by a fire and
  not the frame at the front of a train.
examples:
- The boat's fender kept it from scraping the dock.
- They hung fenders along the side of the boat before it came into the dock.
