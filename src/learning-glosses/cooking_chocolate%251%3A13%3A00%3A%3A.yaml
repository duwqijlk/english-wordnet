simpleMeaning: For baking and for making icings, sauces and sweets, this is pure chocolate with no sugar
  in it.
scope: Also called baking chocolate and bitter chocolate, this pure chocolate with no sugar in it is for
  baking and for making icings, sauces and sweets, not for eating on its own.
examples:
- She melted cooking chocolate for the cake.
- Cooking chocolate went into the icing for the cake.
