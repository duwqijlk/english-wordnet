simpleMeaning: Tending to heal or bring back to health.
scope: This sense is also called healing, therapeutic, and remedial, for tending to heal or bring back
  to health, where healing helps a person get well or return to good health, unlike the sense for a medicine
  or course of care that heals sickness or eases pain.
examples:
- The waters were curative, tending to heal.
- The air was curative, bringing back health.
