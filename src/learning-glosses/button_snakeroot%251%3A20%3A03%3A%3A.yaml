simpleMeaning: Small round flat flower heads in long clusters or loose bunches mark one of many kinds
  of North American plant of the group Liatris
scope: 'Also called blazing star, gay-feather, gayfeather, and snakeroot: a North American plant of the
  group Liatris with flower heads in long clusters, not the spiky plant thought to cure rattlesnake bite.'
examples:
- The button snakeroot bore long clusters of small flower heads.
- We saw button snakeroot with long clusters of flower heads.
