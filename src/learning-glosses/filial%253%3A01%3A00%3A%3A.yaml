synsetId: 02895579-a
simpleMeaning: Naming the generation, or the run of generations, that comes after the parents.
scope: Naming the generations after the parental one, not the sense of what befits a son or daughter.
examples:
- The pups were filial, the first generation after the parents.
- In the cross, the young are filial.
