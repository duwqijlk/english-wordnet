simpleMeaning: Seeds shelled from their pods and cooked in the same way as the lima kind.
scope: Seeds shelled from their pods and cooked in the same way as the lima kind, also called broad bean;
  not seeds eaten whole in their pods and not dried seeds kept for winter.
examples:
- We shelled fava beans for supper.
- The fava beans were cooked with olive oil.
