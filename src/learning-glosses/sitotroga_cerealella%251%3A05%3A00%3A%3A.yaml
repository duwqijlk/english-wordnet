scope: Also called angoumois grain moth and angoumois moth, this moth's young feed on grain already stored,
  a different kind from the brown weevil that eats stored grain.
examples:
- The Sitotroga cerealella moth lays its eggs on stored grain.
- Sitotroga cerealella young eat the inside of wheat kernels in the store.
