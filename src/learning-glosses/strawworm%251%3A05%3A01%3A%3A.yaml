simpleMeaning: Stalks of wheat and other grain crops are harmed by the young of a kind of small fly.
scope: Also called jointworm, it is the young of a kind of small fly that harms the stalks of wheat and
  other grain crops, not the young of the caddis fly.
examples:
- The strawworm ate into the wheat stalks.
- Among the barley stalks, strawworm were found.
