simpleMeaning: an infection caused by a fungus that attacks the damp parts of the body
scope: This is a fungus infection of the damp parts of the body, not athlete's foot and not a bite that
  makes the skin itch.
examples:
- Dhobi itch made the skin between his legs sore and red.
- He got dhobi itch after wearing wet clothes all day.
