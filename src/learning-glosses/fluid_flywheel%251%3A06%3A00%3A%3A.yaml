simpleMeaning: a join in a machine that passes turning power through liquid, with a heavy wheel doing
  the driving
scope: A join in a machine that passes turning power through liquid, not a solid metal join and not a
  wheel that only stores turning power.
examples:
- The fluid flywheel lets the engine pick up speed without a jolt.
- The crane's fluid flywheel passed the turning power from the motor to the winch.
