simpleMeaning: water falling from the sky to the ground, in any form, such as rain, snow, hail, sleet,
  or mist
scope: Water coming down from the sky, not a sudden loss of power or standing.
examples:
- The downfall began as light rain and turned to sleet by night.
- After the storm, the downfall left the streets wet and shining.
