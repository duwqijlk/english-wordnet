simpleMeaning: a vine or tree that grows on another tree, whose roots grow down through the air, join
  tightly around the other tree's trunk and in the end kill that tree
scope: This plant, also called a strangler tree, grows on and kills another tree; it is not a person who
  kills someone by squeezing the neck.
examples:
- A strangler grew around the tall tree and slowly killed it.
- The strangler's roots reached down to the ground around the tree it grew on.
