simpleMeaning: Hunger and growth stay on track with this B vitamin, which keeps away the sickness that
  comes when the body has too little of it.
scope: This B vitamin is also called thiamine, aneurin, and thiamin, and it keeps away the sickness that
  comes when the body has too little of it while keeping hunger and growth on track.
examples:
- With the antiberiberi factor, hunger and growth stay on track.
- Without the antiberiberi factor, the sickness caused by too little of it can take hold.
