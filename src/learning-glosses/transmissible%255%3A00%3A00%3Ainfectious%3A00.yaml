senseId: transmissible%5:00:00:infectious:00
synsetId: 01305977-s
simpleMeaning: Of a disease, able to move from person to person by infection.
scope: Also called catching or contagious, this is said of a disease that can move from person to person
  by infection, not of a thing passed down to family members under fixed rules, usually the rules of the
  law.
examples:
- The cough is transmissible, so the sick child stayed home.
- This fever is transmissible through close contact.
