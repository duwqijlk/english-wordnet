simpleMeaning: A thing stays still or keeps moving in a straight line at the same speed unless a push
  from outside acts on it.
scope: This rule says a thing keeps moving or staying still unless a push acts on it; not the rule about
  energy staying the same in a closed set of things, and not the rule about how a push changes speed.
examples:
- The first law of motion says the ball keeps rolling until something stops it.
- A first law of motion test showed the block stayed still until pushed.
