simpleMeaning: Thin and thick strokes are nearly the same in this print lettering, its shapes are uneven,
  the ends of tall letters lean, and it follows a design from the 1700s.
scope: Also called old style, it is a kind of print lettering made after an 18th-century design.
examples:
- The old style font on the cover looks soft and uneven.
- She picked an old style font for the wedding invitations.
