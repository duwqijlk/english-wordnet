simpleMeaning: Loose bunches of yellowish flowers crown this tall plant that lives for years, with a strong
  smell and toothed pointed leaves, in the eastern United States
scope: Also called horseweed, richweed, stone-root, stone root, and stoneroot, this is a strong-smelling
  tall plant with yellowish flowers.
examples:
- Horse balm grows in the eastern United States.
- The horse balm's yellowish flowers hung in loose bunches.
