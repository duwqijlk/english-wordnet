simpleMeaning: a heater that warms a room or building by sending steam or hot water round through a row
  of pipes
scope: A pipe heater that warms rooms with steam or hot water, not the cooling part in a vehicle and not
  anything that gives off energy.
examples:
- The radiator under the window hissed as the steam came through.
- She hung her wet coat over the radiator to dry.
