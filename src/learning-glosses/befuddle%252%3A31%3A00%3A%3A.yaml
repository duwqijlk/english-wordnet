simpleMeaning: to be confusing to someone and make them unable to think clearly
scope: 'Also called fox, throw, confuse, confound, bedevil, discombobulate and fuddle: to mix a person
  up so they cannot think clearly, not to mix up facts or things.'
examples:
- The long, unclear directions befuddled the new students.
- This hard question befuddled even the teacher.
