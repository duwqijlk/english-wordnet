senseId: trite%5:00:00:unoriginal:00
synsetId: 01693210-s
simpleMeaning: used or said so many times that it feels too well known and no longer new or interesting
scope: Also called tired, stock, threadbare, commonplace, banal, timeworn, and hackneyed. It is about
  words or ideas used too often, not about a person who needs rest.
examples:
- His speech was full of trite phrases that everyone had heard many times.
- She tried not to use trite jokes in her story.
