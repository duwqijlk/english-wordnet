simpleMeaning: A process in which a material reacts with oxygen (a gas in the air) to give out heat and
  light
scope: 'Also called burning: this is the process that gives heat and light, not a state of loud, wild
  trouble and strong feeling.'
examples:
- When wood catches fire, combustion gives heat and light.
- Combustion in the engine burns fuel and makes heat.
