synsetId: 14488096-n
simpleMeaning: a bubble that is a fault on a surface, made when something put on the surface does not
  stick well, as when air gets under a coat of paint
scope: A bubble-like fault on a painted or covered surface where a layer did not stick; not a raised place
  filled with liquid on skin, and not the act of forming one.
examples:
- A blister in the paint showed where air had got under it.
- The hot sun made a blister in the paint on the door.
