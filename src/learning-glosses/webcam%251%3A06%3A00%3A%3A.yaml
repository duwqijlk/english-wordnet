simpleMeaning: a digital camera whose job is to take digital photos and send them over the internet
scope: This is a digital camera made to send photos over the internet. It is not a camera that only keeps
  photos on itself, and it is not the photo itself.
examples:
- She used a webcam to send a photo of her desk to her class.
- The webcam on his computer takes photos and sends them over the internet.
