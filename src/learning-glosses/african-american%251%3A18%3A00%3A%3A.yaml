simpleMeaning: A person whose forebears came from Africa; the words ‘Negro’ and ‘Negroid’ are old and
  insulting today.
scope: A person whose forebears came from Africa, also called Black, Negro and Negroid, the last two old
  and insulting today; this is the noun sense, not the adjective sense.
examples:
- Many African-Americans live in the city.
- The African-American spoke of her forebears.
