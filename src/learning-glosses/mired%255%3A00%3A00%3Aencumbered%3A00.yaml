simpleMeaning: stuck in something and held back, as if caught in deep wet mud
scope: 'Also called involved: stuck and held back in a hard place or problem, not free to move on and
  not just dirty with mud.'
examples:
- The plan got mired in small details and never moved forward.
- She felt mired in confusion and could not decide what to do next.
