simpleMeaning: A large long-haired mammal of the cattle family, from Canada and Greenland, between an
  ox and a sheep in size and in the shape of its body.
scope: This is the large long-haired mammal of Canada and Greenland, also called musk sheep — not a true
  ox or a true sheep, though it stands between the two.
examples:
- A musk ox stood on the cold plain in Greenland.
- Musk oxen have long shaggy coats.
