simpleMeaning: A way of taking floating dust bits out of a gas by giving the bits a strong electric charge
  and catching them on charged plates.
scope: A process that takes suspended dust from a gas with high-voltage charge, catching it on charged
  plates.
examples:
- Electrostatic precipitation clears dust from the gas.
- They use electrostatic precipitation in the plant.
