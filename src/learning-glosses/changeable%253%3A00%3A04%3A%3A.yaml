simpleMeaning: can become different in shape or look, in how good it is, or in its basic kind, or often
  becomes different in those ways
scope: This sense is about form, quality or basic kind becoming different; not about color becoming different
  in different light, and not just the general sense of being open to change.
examples:
- This changeable material can take a new shape when heated.
- Her changeable plan kept taking a different form as new facts came in.
