simpleMeaning: the act of taking hold of a thing with the teeth and jaws and biting a piece off it
scope: 'Also called bite: the act of taking hold with the teeth and jaws and biting a piece off; not the
  act of chewing food and not a noisy bite.'
examples:
- One chomp took the end off the carrot.
- The dog's chomp left marks on the bone.
