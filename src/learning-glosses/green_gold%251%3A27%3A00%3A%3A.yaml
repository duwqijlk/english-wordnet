simpleMeaning: A mix of the yellow metal with silver, or with silver and cadmium, that has the colour
  of leaves, with at least fourteen parts in twenty-four pure.
scope: A mix of the yellow metal that has the colour of leaves, not pure yellow metal and not a mix of
  another colour.
examples:
- The ring was made of green gold.
- Green gold gets its colour from the silver mixed into it.
