simpleMeaning: a break in a bone where the bone is split into small sharp pieces or crushed
scope: This is a bone broken into small pieces or crushed, not a simple clean break in a bone.
examples:
- The comminuted fracture left his leg bone in many small pieces.
- After the crash, the doctor said her comminuted fracture would need a plate.
