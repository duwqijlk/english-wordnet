simpleMeaning: the act of growing soft and full of water after being left in water or some other liquid
scope: The act of growing soft and full of water after being left in water or some other liquid, not the
  act of washing a thing and not the act of filling a thing right through.
examples:
- After a long soak, the dried beans were soft again.
- The hard sponge needed a good soak to grow soft again.
