simpleMeaning: Now wild in the United States and elsewhere, this one-year climber from warm lands in America
  bears red, at times white, flowers and leaves cut into thin parts.
scope: Also called cypress vine, it is a one-year climber with red flowers, not a vine that lives for
  many years.
examples:
- Star-glory climbed and opened red flowers.
- The star-glory bore white flowers at times.
