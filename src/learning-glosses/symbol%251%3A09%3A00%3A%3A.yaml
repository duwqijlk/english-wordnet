senseId: 'symbol%1:09:00::'
synsetId: 05773412-n
simpleMeaning: A thing you can see that stands for something you cannot see, because people link it with
  that thing or agree it means it
scope: A visible thing that stands for something unseen, not a written mark or letter that carries a set
  meaning.
examples:
- The eagle is a symbol of the United States.
- The dove is a symbol of peace.
