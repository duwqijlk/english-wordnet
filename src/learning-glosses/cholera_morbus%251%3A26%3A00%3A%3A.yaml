  whose cause is not known
scope: 'Also called collywobbles: a severe sickness of the stomach and gut, not cholera itself.'
examples:
- Cholera morbus left him with cramps and vomiting.
- Cholera morbus brought on cramps, vomiting, and loose bowels.
