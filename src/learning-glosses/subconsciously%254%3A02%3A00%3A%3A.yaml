simpleMeaning: in a way that comes from the part of the mind that a person does not know about, but that
  still changes what they think and do
scope: From thoughts in the mind that a person does not know about; not done on purpose and not done with
  clear knowledge.
examples:
- She subconsciously copied the way her mother spoke.
- He tapped his foot subconsciously while he waited.
