simpleMeaning: To charge a person falsely, out of ill will, and to tear down their good name.
scope: Also called smear, sully, slander, besmirch, defame, and asperse; to charge falsely out of ill
  will and tear down a good name.
examples:
- The paper denigrated the mayor with false claims.
- Rivals denigrated her work to hurt her name.
