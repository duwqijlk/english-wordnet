senseId: 'plavix%1:06:00::'
synsetId: 03052583-n
simpleMeaning: A drug that thins the blood, cleared for treating mild heart attacks, by stopping the small
  blood parts from sticking together into lumps that would slow the flow of blood
scope: Also called clopidogrel bisulfate, this is a blood-thinning drug for mild heart attacks, not a
  drug that breaks up clots already formed.
examples:
- The doctor gave him Plavix after his mild heart attack.
- She takes Plavix to keep her blood thin.
