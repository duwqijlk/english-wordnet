simpleMeaning: pink or red powder that people put on their cheeks to add colour, as part of makeup
scope: This powder is also called paint, blush, or blusher. It is makeup for the cheeks, not the act of
  putting it on to make the cheeks red.
examples:
- She put a little rouge on her cheeks before the party.
- He bought some rouge at the makeup shop.
