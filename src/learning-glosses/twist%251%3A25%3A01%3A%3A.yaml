simpleMeaning: A curved part of a road, path or line where it changes direction.
scope: This is a smooth curve where a road or line changes direction, not the sharp kink left by a pulled-tight
  loop or the act of winding; turn is another name.
examples:
- The road takes a sharp twist just past the bridge.
- A twist in the path hid the house from view.
