simpleMeaning: a sweet drink made of milk or cream mixed with eggs, usually with strong drink such as
  whisky in it
scope: A sweet party drink of milk or cream and eggs, usually with strong drink in it; not a plain glass
  of milk and not a cooked egg dish.
examples:
- They served eggnog in small cups at the winter party.
- He drank a glass of eggnog with a little whisky in it.
