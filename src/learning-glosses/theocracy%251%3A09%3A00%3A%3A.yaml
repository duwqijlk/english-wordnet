simpleMeaning: The belief that God, or God's guidance, should rule a country.
scope: The belief that God, or God's guidance, should rule a country, not a land itself ruled by a god
  or by officials thought to be guided by God.
examples:
- He wrote in favour of theocracy, saying only God's guidance could rule justly.
- The preacher taught theocracy, that God should guide the rulers.
