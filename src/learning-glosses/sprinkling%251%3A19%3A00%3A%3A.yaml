senseId: 'sprinkling%1:19:00::'
synsetId: 11526585-n
simpleMeaning: a light fall of rain that comes down in some places and not in other places near them
scope: 'Also called scattering, and also called sprinkle: a light fall of rain in some places only, not
  the act of putting water on something for a religious reason or by hand.'
examples:
- A sprinkling of rain fell on our street but not on the next one.
- We felt a light sprinkling while the town across the river stayed dry.
