simpleMeaning: a group of creative people who lead the way in using new ideas and methods in a field,
  especially in the arts
scope: A group of creative people who lead the way in using new ideas and methods in a field, especially
  in the arts; van is another name for this sense, and it is not the front of an army or a group that
  follows others.
examples:
- The vanguard of modern art met in Paris.
- She joined the vanguard of young poets.
