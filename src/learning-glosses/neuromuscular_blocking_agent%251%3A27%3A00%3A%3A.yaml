simpleMeaning: Signals pass from the nerve cells that move the body to the muscles that move the bones,
  and this thing gets in their way.
scope: A thing that blocks the signals that pass from the nerve cells that move the body to the muscles
  that move the bones.
examples:
- The neuromuscular blocking agent got in the way of the signals passing to the muscles.
- The neuromuscular blocking agent works between the nerve cells that move the body and the muscles.
