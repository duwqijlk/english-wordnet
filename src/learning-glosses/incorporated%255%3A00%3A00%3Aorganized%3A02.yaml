simpleMeaning: set up as a company in a form the law allows, and kept in that form
scope: Set up in law as a company, also called corporate; it does not mean joined in or built into something
  else.
examples:
- The incorporated town has its own small government.
- They run an incorporated business, so the law treats it as separate from its owners.
