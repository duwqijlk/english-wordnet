senseId: 'trellis%2:41:00::'
synsetId: 02515407-v
simpleMeaning: to make a plant, such as a vine, grow up over a frame of thin bars that cross each other
scope: This is guiding a vine to grow on a frame, not the frame itself and not just planting a vine in
  the ground.
examples:
- She trellised the young vine so it would climb the garden frame.
- They trellis the roses each spring to keep them off the ground.
