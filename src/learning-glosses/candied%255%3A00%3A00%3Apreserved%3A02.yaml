simpleMeaning: kept from going bad, especially for fruit, by putting sugar over it or letting it take
  sugar in
scope: 'Also called crystalized, glace, and crystalised: about food, especially fruit, kept by sugar on
  or in it, not about fresh fruit with no sugar.'
examples:
- She put candied orange peel on top of the cake.
- Candied cherries keep for months because of the sugar.
