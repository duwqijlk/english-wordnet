simpleMeaning: To do with a time away from home, above all the time when the Jews were held captive in
  Babylon.
scope: Of a time away from home, above all the Jews' time in Babylon, not a short trip and not a move
  to a new home for good; no other name is listed for this sense.
examples:
- The exilic songs speak of home far away.
- His exilic years in Babylon shaped the people's prayers.
