simpleMeaning: to drop your head and throw one arm and elbow up at the same time as a dance step, in a
  move said to look like a sneeze
scope: The act of doing the dance move, not the move itself and not a small bit of something wet.
examples:
- He dabbed on the last beat and the crowd cheered.
- She dabbed twice during the dance and then kept dancing.
