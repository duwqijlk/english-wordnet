simpleMeaning: A plant of eastern North America with bad-smelling pink to purple flowers and a sharp-tasting
  root used in folk medicine, above all to ease childbirth.
scope: A plant of eastern North America with bad-smelling pink to purple flowers and a sharp-tasting root
  used in folk medicine, also called birthroot, purple trillium and red trillium.
examples:
- Trillium erectum grows in the woods of eastern North America with pink to purple flowers.
- The root of Trillium erectum was used in folk medicine to ease childbirth.
