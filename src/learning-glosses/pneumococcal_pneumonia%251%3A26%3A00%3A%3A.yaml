simpleMeaning: A sickness of the lungs brought on by one kind of small germ
scope: A sickness of the lungs brought on by one kind of small germ, not a sickness of the lungs from
  other causes and not a cold.
examples:
- He was in hospital with pneumococcal pneumonia after the germs reached his lungs.
- The doctor said her pneumococcal pneumonia came from germs that attack the lungs.
