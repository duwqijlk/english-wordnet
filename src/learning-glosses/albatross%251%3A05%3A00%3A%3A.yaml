simpleMeaning: a large bird with feet joined by skin and long thin wings, living in the southern half
  of the world, known for strong flight without beating its wings
scope: 'Also called mollymawk: a large bird that lives in the southern half of the world, not the sense
  that means something that holds a person back.'
examples:
- An albatross followed the ship for days without beating its wings.
- We saw an albatross flying low over the cold southern sea.
