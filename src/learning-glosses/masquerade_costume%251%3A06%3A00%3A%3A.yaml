simpleMeaning: At a party where people dress up, these clothes hide who you are
scope: Also called fancy dress and masquerade, these are clothes worn to hide who you are at a party where
  people dress up, not everyday clothes and not a stage costume.
examples:
- She wore a bright masquerade costume to the ball.
- His masquerade costume hid his face behind a mask.
