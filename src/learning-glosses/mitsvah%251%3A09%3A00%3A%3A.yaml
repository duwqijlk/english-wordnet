simpleMeaning: In Judaism, a rule or order from Jewish law that a person must keep
scope: 'Also called a mitzvah: a rule or order from Jewish law, not a piece of advice and not a custom
  with no force of law.'
examples:
- Keeping the mitsvah was part of her daily life.
- He taught the children a new mitsvah each week.
