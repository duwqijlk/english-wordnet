simpleMeaning: A common tree of the south-east of the United States, its trunk wide at the foot, growing
  in swamps by the sea and low land by rivers that flood.
scope: 'Also called pond bald cypress, southern cypress and swamp cypress: a tree of wet land in the south-east
  of the United States, not the wood cut from it.'
examples:
- Bald cypress trees grow in the swamps of the south-east.
- The bald cypress by the river had a trunk wide at its foot.
