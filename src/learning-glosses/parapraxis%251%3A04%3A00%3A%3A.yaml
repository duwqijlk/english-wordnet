senseId: 'parapraxis%1:04:00::'
synsetId: 00074648-n
simpleMeaning: a small slip made without meaning to, most often in speaking or writing, in small mishaps,
  or in forgetting
scope: A small slip made without meaning to, most often in speaking or writing, in small mishaps, or in
  forgetting; slip, miscue and slip-up are other names for this sense, and it is not a big mistake made
  on purpose or a slip of the tongue only.
examples:
- Calling her by the wrong name was a mere parapraxis.
- His parapraxis in the letter went unnoticed.
