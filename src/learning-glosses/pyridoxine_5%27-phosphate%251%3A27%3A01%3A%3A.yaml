simpleMeaning: When a phosphorus part is joined to pyridoxamine, the result is this form of vitamin B6.
scope: Also called pyridoxamine 5'-phosphate, this is the form of vitamin B6 that comes from pyridoxamine
  with a phosphorus part joined to it, not pyridoxamine on its own.
examples:
- With a phosphorus part joined to it, pyridoxamine becomes pyridoxine 5'-phosphate.
- A phosphorus part joined to pyridoxamine gives pyridoxine 5'-phosphate.
