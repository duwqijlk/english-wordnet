simpleMeaning: a long pole on a ship that holds a high sail, set above the sail above the main sail
scope: A pole on a ship that holds a high sail set above the sail above the main sail; top-gallant yard
  is another name for this sense, not the pole that holds the main sail and not the sail itself.
examples:
- The crew raised the topgallant yard to catch the wind.
- From the deck, the topgallant yard looked thin against the sky.
