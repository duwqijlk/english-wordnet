simpleMeaning: An orchid of the south of Europe with sweet-smelling greenish-white flowers; at times put
  in the group of the same name.
scope: Also called a lesser butterfly orchid or Platanthera bifolia; it grows in the south of Europe and
  is known for its sweet-smelling greenish-white flowers.
examples:
- Habenaria bifolia is an orchid of the south of Europe.
- The Habenaria bifolia flowers smell sweet and are greenish-white.
