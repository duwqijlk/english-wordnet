simpleMeaning: The pouch where the large gut starts and the small gut opens into it.
scope: The pouch where the large gut starts, also called a blind gut and cecum; not the small gut itself
  and not the appendix.
examples:
- The caecum sits at the start of the large gut.
- The appendix hangs off the caecum.
