simpleMeaning: a state of doing nothing, caused by feeling tired and having no energy or wish to move
  or act
scope: 'Also called listlessness: a state of doing nothing through tiredness and low energy, not the deeper
  state where body and mind partly stop working and feeling is partly lost.'
examples:
- After lunch, a torpor fell over the hot, quiet room.
- He sat in torpor and did not answer anyone for an hour.
