simpleMeaning: A sleep drug sold as Nembutal that calms people, helps them sleep, and stops muscle spasms
scope: A drug sold as Nembutal that calms people, helps them sleep and stops muscle spasms; pentobarbital
  and pentobarbital sodium are other names for this sense, not a stinging insect and not a coat.
examples:
- The doctor gave him a yellow jacket to help him sleep.
- A yellow jacket calmed her nerves before the operation.
