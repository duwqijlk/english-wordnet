simpleMeaning: Two kinds of shares in a firm, A and B, differ because the A kind gives its owners more
  say, such as a vote
scope: This covers shares in a firm that come in two kinds, A and B, not shares that all carry the same
  rights.
examples:
- The classified stock gave A holders a vote.
- She held classified stock in both classes, A and B.
