simpleMeaning: the machine used to make a picture that shows the inside of the body
scope: 'Also called scintigraph: the machine that makes a picture of the inside of the body, not the picture
  itself and not a machine that takes ordinary photographs.'
examples:
- The scintiscanner made a picture that showed the inside of his chest.
- The doctor read the picture from the scintiscanner.
