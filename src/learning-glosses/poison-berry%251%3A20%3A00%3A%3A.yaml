simpleMeaning: A white-flowered herb from Eurasia that now grows wild in America; its hairy leaves are
  toxic, while its black berries may be safe to eat or may be harmful.
scope: Another name for common nightshade and poisonberry, also called black nightshade; the whole white-flowered
  plant, not its berries alone.
examples:
- Poison-berry grows wild in America after arriving from Eurasia.
- The berries on poison-berry may be harmful, so it is safest not to eat them.
