simpleMeaning: The body's act of drawing air in and pushing it out, taking in oxygen and releasing carbon
  dioxide.
scope: The bodily act of moving air in and out, also called respiration, ventilation and external respiration;
  not the adjective describing lungs that work normally, nor the chemical use of oxygen inside cells.
examples:
- Slow, deep breathing helped her calm down.
- The doctor listened to his breathing.
