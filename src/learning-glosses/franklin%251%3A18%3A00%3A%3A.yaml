simpleMeaning: A landowner of the 1300s and 1400s who was a free man but not born into the noble class.
scope: A free landowner of the 1300s and 1400s, not a lord and not a serf tied to the land.
examples:
- The franklin owned broad fields but held no noble title.
- In the old tale, a franklin welcomed the travellers to his hall.
