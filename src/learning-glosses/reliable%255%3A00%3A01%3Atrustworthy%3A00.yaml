simpleMeaning: matching the facts, so people can believe it is true
scope: 'Also called authentic: matching the facts, so it can be believed. This is about facts and reports,
  not about a person or machine you can trust to do what is needed.'
examples:
- The book gives a reliable account of what really happened that day.
- Her reliable report matched all the facts the police had found.
