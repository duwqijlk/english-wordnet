simpleMeaning: a hot-climate tree with a prickly trunk, whose heavy red timber gives a red dye and is
  used for fine furniture
scope: 'Also called brazilwood, peach-wood and peachwood: a hot-climate tree with a prickly trunk whose
  heavy red timber gives a red dye, not a softwood tree and not a dye plant.'
examples:
- The cabinet maker chose pernambuco wood for its deep red colour.
- The cabinet was made of pernambuco wood.
