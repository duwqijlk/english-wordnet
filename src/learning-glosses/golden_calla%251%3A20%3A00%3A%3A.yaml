simpleMeaning: Yellow leaf-like parts wrap round the flower of one of the plants in the group called Zantedeschia
scope: One of a group of plants called Zantedeschia with yellow leaf-like parts round the flower, not
  a white-flowered kind and not a garden lily.
examples:
- The golden calla opened its yellow flowers in spring.
- She planted golden callas along the pond edge.
