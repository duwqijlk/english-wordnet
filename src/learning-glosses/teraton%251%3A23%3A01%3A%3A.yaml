simpleMeaning: A measure of how strong a blast or a bomb is, by how many trillion tons of TNT would give
  the same energy
scope: A measure of how strong a blast or a bomb is, by how many trillion tons of TNT would give the same
  energy; not a measure of weight and not a measure of heat.
examples:
- The blast was put at ten teratons of TNT.
- A teraton blast would dwarf any bomb ever made.
