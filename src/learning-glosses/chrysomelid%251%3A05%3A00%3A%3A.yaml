simpleMeaning: Its young live in and harm the roots and stems of plants, and this brightly coloured beetle
  eats the leaves
scope: This brightly coloured beetle eats the leaves of plants, and its young live in and harm the roots
  and stems; also called leaf beetle, not a beetle whose young eat the leaves too.
examples:
- The chrysomelid ate the leaves of the plant.
- The young of the chrysomelid lived in the roots and stems.
