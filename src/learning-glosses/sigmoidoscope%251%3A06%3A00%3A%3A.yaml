simpleMeaning: To look inside the lower part of the large gut, doctors push in a thin bendy tube with
  a light at its end.
scope: Doctors also call it a flexible sigmoidoscope, and it is one of the thin tubes with a light that
  let them see inside the body.
examples:
- The doctor used a sigmoidoscope to look inside the lower gut.
- A sigmoidoscope lets doctors see the lower part of the large gut.
