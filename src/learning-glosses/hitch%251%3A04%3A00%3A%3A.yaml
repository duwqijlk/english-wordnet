simpleMeaning: a way of walking that is not even, because one leg is hurt
scope: 'Also called limp, and another name for this sense is hobble: a walk that is not even because a
  leg is hurt, not a knot, not a thing that blocks the way, and not a jump straight up.'
examples:
- He walked with a hitch after he hurt his leg.
- Her hitch made each step slow and not even.
