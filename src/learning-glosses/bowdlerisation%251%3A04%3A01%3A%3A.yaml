simpleMeaning: written words from which rude or shocking parts have been cut out
scope: Written words from which rude or shocking parts have been cut out; bowdlerization is another name
  for this sense, not the act of cutting them out and not words cut for length.
examples:
- The old bowdlerisation of the play left out the rude jokes.
- Scholars still read the bowdlerisation that hid the poet's boldest lines.
