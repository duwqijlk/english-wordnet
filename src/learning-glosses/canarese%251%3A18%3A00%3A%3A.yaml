simpleMeaning: A person from the group of people who speak Kannada and live mostly in Kanara, in the south
  of India.
scope: This is one person of the Kannada-speaking people who live mostly in Kanara in southern India,
  also called Kanarese, and not the Kannada tongue itself.
examples:
- The Canarese man told us about life in Kanara.
- Many Canarese live in the south of India.
