simpleMeaning: A person paid to ride a horse, look after cattle, and do other work
scope: 'Also called cowhand, cowpoke, cowpuncher, and puncher: a paid worker on horseback who looks after
  cattle, not the farm owner.'
examples:
- The cowherd rode out each morning to check the cattle.
- They paid a cowherd to look after the cattle and do other jobs on the ranch.
