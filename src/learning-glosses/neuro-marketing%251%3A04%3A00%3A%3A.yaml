simpleMeaning: Selling based on studies of how buyers' bodies, thoughts, and feelings react.
scope: Selling based on studies of how buyers' bodies, thoughts, and feelings react, not selling by price
  cuts and not selling by ads alone; also called neuromarketing.
examples:
- Neuro-marketing studies how buyers' feelings shape what they buy.
- The firm used neuro-marketing to test its new adverts.
