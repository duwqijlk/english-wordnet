simpleMeaning: in the sun, the small side leaflets of a warm Asian shrub that stands upright turn on their
  stalks and jerk up and down
scope: 'Also called semaphore plant: a warm Asian shrub known for leaflets that turn and jerk in sunshine,
  not a vine and not a plant with still leaves.'
examples:
- In the morning sun the telegraph plant's leaflets began to jerk up and down.
- The telegraph plant stands upright in the garden, its side leaflets turning slowly.
