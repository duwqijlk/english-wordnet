simpleMeaning: Take every bit of someone's money from them in gambling, robbery, or the like.
scope: This means to strip someone of all their money, not to wash something or make it free of dirt.
examples:
- The card sharp cleaned him out in a single night of poker.
- The gang cleaned out the till before the alarm sounded.
