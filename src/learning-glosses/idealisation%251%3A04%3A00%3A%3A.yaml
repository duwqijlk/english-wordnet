simpleMeaning: Showing something as perfect, better than it really is
scope: 'Also called idealization: showing a thing as perfect, not a true picture of it and not the psychiatry
  sense of splitting a thing into good and bad.'
examples:
- His idealisation of his childhood made the past seem perfect.
- The film's idealisation of the old days hid their hardships.
