simpleMeaning: Any one of a group of Indic tongues spoken in Kashmir and eastern Afghanistan and northern
  Pakistan.
scope: 'Also called Dard and Dardic: any one of a group of Indic tongues spoken in Kashmir, eastern Afghanistan
  and northern Pakistan, set apart from other Indic tongues by its place.'
examples:
- He speaks a Dardic language from the valleys of Kashmir.
- The Dardic language he grew up with is one of several in the region.
