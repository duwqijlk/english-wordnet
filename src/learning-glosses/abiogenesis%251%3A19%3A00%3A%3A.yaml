simpleMeaning: a guess about how living things first came from things that were never alive
scope: A guess about how living things first came from things that were never alive, also called autogenesis
  and autogeny; not the growth of a living thing from a parent and not a story of creation by a god.
examples:
- Abiogenesis is the guess that life came from lifeless matter.
- Scientists still debate abiogenesis.
