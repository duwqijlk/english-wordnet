simpleMeaning: with the back and shoulders bent forward in a round shape, so the body does not stand up
  straight
scope: With the back and shoulders bent forward in a round shape, also called crooked, hunched or stooped;
  not standing up straight.
examples:
- The little old stooping woman walked slowly to the door.
- Years of work at the bench had left him stooping.
