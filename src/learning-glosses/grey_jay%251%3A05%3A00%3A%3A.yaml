scope: This is a northern North American bird with a black-topped head and no crest; camp robber, gray
  jay and whisker jack are other names for this sense, not a blue jay and not a crow.
examples:
- A grey jay swooped down and stole food from our camp table.
- The grey jay has no crest, but its black cap makes it easy to spot.
