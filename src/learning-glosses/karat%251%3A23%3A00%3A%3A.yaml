simpleMeaning: 'a way to measure how much gold is in a mix of metals: 18 means the mix is 75% gold, and
  24 means it is pure gold'
scope: Also called carat or kt. This is a measure of how pure gold is, not a measure of weight for a jewel
  or for gold itself.
examples:
- This ring is made of 18-karat gold.
- She bought a necklace of pure 24-karat gold.
