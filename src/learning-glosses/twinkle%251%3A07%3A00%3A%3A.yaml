simpleMeaning: happy feeling that shows in a bright, lively look on a person's face or in their eyes
scope: 'Also called light, spark, and sparkle: a happy, bright look on the face, not a quick change in
  light and not shining on and off.'
examples:
- There was a twinkle in her eye when she told the joke.
- He had a twinkle in his eyes as he watched the children play.
