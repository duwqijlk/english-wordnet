simpleMeaning: Behaving in a showy, put-on grand way, acting as if one is far more important than others,
  and looking down on them
scope: This describes behaving in a showy, put-on grand way; highfalutin, grandiose, hifalutin, highfaluting
  and hoity-toity are other names for this sense, not truly grand behaviour and not simply being polite.
examples:
- She gave a la-di-da wave and swept past us without a word.
- His la-di-da manners made the other guests laugh.
