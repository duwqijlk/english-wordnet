simpleMeaning: one of the very small tubes in the body that carry blood, joining small tubes from the
  heart with small tubes back to the heart
scope: This is a very small tube in the body that carries blood, not a thin tube used to hold liquid outside
  the body.
examples:
- Blood passes through a capillary on its way through the body.
- The doctor could see a broken capillary just under the skin.
