simpleMeaning: a soil that soaks up liquid and looks like clay, used to shrink and thicken wool cloth
  and to soak up other things
scope: A clay-like soil that soaks things up, not ordinary clay and not sand.
examples:
- Fuller's earth was spread on the wool cloth to shrink and thicken it.
- The cleaner used fuller's earth to soak up the oil spill.
