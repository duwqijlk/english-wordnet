simpleMeaning: The material inside a germ that passes on how it is made takes in a virus that attacks
  germs, and the germ stays in that state
scope: Also called lysogeny, this is the state of a germ that has taken a virus into itself, not the breaking
  open of a cell and not a virus on its own.
examples:
- The test showed lysogenicity in the germ, which now carried the virus inside it.
- In a state of lysogenicity, the virus stays joined to the germ's own material.
