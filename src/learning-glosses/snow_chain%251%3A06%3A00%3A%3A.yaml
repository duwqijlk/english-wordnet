simpleMeaning: a set of linked rings put round a wheel to help it grip on ice or white frozen ground
scope: A chain put round a wheel to help it grip on ice or snow, also called tire chain; not a chain for
  towing, and not part of the wheel itself.
examples:
- We fitted a snow chain to each back wheel before the climb.
- The snow chain gave the car grip on the icy road.
