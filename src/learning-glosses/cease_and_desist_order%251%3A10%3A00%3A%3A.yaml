simpleMeaning: In law, a step a court takes to stop a person or group from doing, or going on with, a
  certain act
scope: 'Also called enjoining, enjoinment, and injunction: a court step that stops a person or group from
  doing or going on with a certain act, not a fine and not a court step that makes someone do something.'
examples:
- The judge served a cease and desist order on the company.
- The firm stopped the ads after it got a cease and desist order.
