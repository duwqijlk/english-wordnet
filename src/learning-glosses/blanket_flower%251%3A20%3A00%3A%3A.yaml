simpleMeaning: Showy yellow bloom heads on long stalks, marked with scarlet or purple in the middle, grow
  on this plant of the middle United States that lives one year.
scope: Also called fire-wheel and fire wheel, this plant of the middle United States lives one year and
  bears showy yellow bloom heads marked with scarlet or purple in the middle.
examples:
- The blanket flower stood in the middle United States with showy yellow heads.
- Long stalks held the showy yellow heads of the blanket flower.
