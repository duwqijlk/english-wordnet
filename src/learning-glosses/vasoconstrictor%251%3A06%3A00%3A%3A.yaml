senseId: 'vasoconstrictor%1:06:00::'
synsetId: 04529716-n
simpleMeaning: cold, stress, nicotine, and certain body chemicals and drugs are things that make the opening
  of a blood vessel grow narrow, keeping blood pressure up or raising it
scope: 'Also called pressor and vasoconstrictive: a thing that narrows blood vessel openings and keeps
  blood pressure up, not a thing that widens blood vessels.'
examples:
- The drug is a vasoconstrictor that narrows the blood vessels in the skin.
- Nicotine acts as a vasoconstrictor, raising blood pressure.
