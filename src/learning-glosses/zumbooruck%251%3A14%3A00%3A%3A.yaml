simpleMeaning: A mounted force of the early modern era, made up of soldiers on camels, served Arab, Afghan,
  Persian, and Indian armies.
scope: Also called camel cavalry, zamboorak, zamburak, zamburek, and zumbooruk, this mounted force of
  soldiers on camels served the Arab, Afghan, Persian, and Indian armies of the early modern era.
examples:
- The zumbooruck served the Indian army in the early modern era.
- Soldiers of the zumbooruck rode camels for the Persian army.
