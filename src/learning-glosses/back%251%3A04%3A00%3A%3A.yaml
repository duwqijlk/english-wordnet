simpleMeaning: In American football, the role of a team member who lines up behind the line where each
  play begins.
scope: This is the team position, not the person who plays it, not the rear side of anything, not the
  spine, not the part of a chair, book or garment, and not the adverb meaning toward the rear.
examples:
- He was switched to the back position midway through the season.
- The back position requires both speed and strength.
