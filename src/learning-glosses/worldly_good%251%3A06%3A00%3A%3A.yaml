simpleMeaning: a thing of this life, not of faith or the spirit, that people own or use
scope: This is a thing of this life, not of faith or the spirit; worldly possession is another name for
  this sense, not a holy thing and not an idea.
examples:
- He gave up his worldly goods and lived with very little.
- The monks owned few worldly goods and kept no fine things.
