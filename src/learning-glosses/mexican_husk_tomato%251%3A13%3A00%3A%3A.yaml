simpleMeaning: A small fruit that can be eaten, yellow to purple, like a small round fruit, shut in a
  thin dry case
scope: Also called a tomatillo and a husk tomato; a small edible fruit in a thin dry case, not the plant
  that bears it and not a fruit without a case.
examples:
- The Mexican husk tomato was yellow inside its thin case.
- She peeled the case from a Mexican husk tomato.
