simpleMeaning: a rich sweet cake from the Middle East, made of thin layers of pastry that breaks easily
  into thin pieces, filled with nuts and honey
scope: A sweet cake with nuts and honey from the Middle East, not a plain bread and not a pie filled with
  fruit.
examples:
- We ate baklava after dinner, and the honey ran over the nuts.
- She cut the baklava into small pieces for her guests.
