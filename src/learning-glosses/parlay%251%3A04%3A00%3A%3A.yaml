simpleMeaning: A run of bets where the winnings from one bet are staked on the next bets.
scope: A run of bets where the winnings from one bet are staked on the next bets; not to stake winnings
  from one bet on a later wager.
examples:
- Their parlay paid at dusk.
- The parlay was lost at dawn.
