simpleMeaning: At least half of each figure's depth sticks out from the surface behind it in this kind
  of carving
scope: Carving that stands well out from the surface behind it, also called alto relievo and alto rilievo;
  not flat carving and not carving cut into the stone.
examples:
- The high relief on the temple wall showed warriors in battle.
- She admired the high relief, where the figures seemed to leap from the stone.
