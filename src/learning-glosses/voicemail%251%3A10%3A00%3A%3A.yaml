simpleMeaning: a computer system that answers phone calls, sends them where they should go, and takes
  messages, which can be saved and passed on
scope: A computer system that answers phone calls, sends them where they should go, and takes messages,
  not a person answering the phone and not a written note.
examples:
- She left a voicemail asking him to call back.
- His voicemail was full, so I sent a text instead.
