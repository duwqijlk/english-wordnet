simpleMeaning: a British coin that is no longer used, made of bronze, a brown metal, worth one fourth
  of a penny
scope: This is a real old coin from Britain worth very little, not a small amount of money in general
  and not a penny itself.
examples:
- He found an old farthing under the floor.
- In the past, a farthing could buy very little.
