simpleMeaning: a substance a gland makes and sends through the blood to the part of the body it acts on
scope: A substance a gland makes and sends through the blood to the part of the body it acts on, also
  called a hormone or endocrine; not a fluid poured out onto the skin and not the gland itself.
examples:
- The internal secretion of the thyroid acts on the whole body.
- Too little internal secretion from the gland slows growth.
