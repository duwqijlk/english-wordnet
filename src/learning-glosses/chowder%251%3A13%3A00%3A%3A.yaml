simpleMeaning: milk, bacon, onions, and potatoes cooked together to make a thick soup or stew
scope: This is the thick soup or stew made with milk, bacon, onions and potatoes, not any thin soup and
  not a stew made in another way.
examples:
- She made a warm bowl of chowder with bacon and onions.
- The chowder was thick with potatoes and milk.
