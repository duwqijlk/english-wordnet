simpleMeaning: People whose blood is low in iron take this drug, which helps their blood carry more of
  the red stuff that brings oxygen
scope: A drug that raises the red part of the blood, also called haematinic, not a vitamin and not a blood
  transfusion.
examples:
- The doctor gave her a hematinic for her low iron.
- He took a hematinic every day until his blood tests came back normal.
