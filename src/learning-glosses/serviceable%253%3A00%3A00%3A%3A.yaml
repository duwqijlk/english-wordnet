simpleMeaning: ready to be used, or able to keep working for a long time
scope: About a thing that is ready to be used, or that can keep working for a long time; not about a person
  who helps others, and not about fixing a thing.
examples:
- These boots are strong and serviceable for daily work.
- The old car is still serviceable after many years of use.
