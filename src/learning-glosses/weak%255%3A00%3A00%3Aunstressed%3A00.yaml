simpleMeaning: A vowel or syllable spoken with little or no emphasis, so it does not stand out in the
  word.
scope: 'This is about pronunciation: a vowel or syllable carrying little emphasis, the same sense as ''light''
  and ''unaccented'', not faint light or sound, bodily frailty, or a verb''s regular inflection.'
examples:
- In the word 'sofa', the second syllable is weak.
- English often reduces a weak vowel to a schwa.
