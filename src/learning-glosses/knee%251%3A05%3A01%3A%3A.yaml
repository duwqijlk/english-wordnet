simpleMeaning: the joint in a four-legged animal between the thigh bone and the shin bone, matching the
  same joint in people
scope: The same joint in a four-legged animal, not the one in a person, and not the cloth covering on
  a trouser leg.
examples:
- The horse injured its knee during the race.
- A dog's knee bends much like a person's.
