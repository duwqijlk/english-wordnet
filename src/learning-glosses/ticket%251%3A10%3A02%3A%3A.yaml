simpleMeaning: a list of people chosen by one political party to stand for election to public jobs
scope: This is a party's list of people for an election; it is not a paper that lets you travel or go
  in somewhere, and not an official paper for breaking a rule of the road.
examples:
- The ticket has five names, all chosen by the same party.
- Voters liked the whole ticket the party put forward for the election.
