simpleMeaning: Little pictures that stand for words or ideas, and smiling faces, used in electronic messages
  and on web pages
scope: Little pictures and smiling faces used in messages and web pages; not drawings in a book and not
  letters of the alphabet.
examples:
- She added an emoji at the end of her text.
- The message was full of emoji and short words.
