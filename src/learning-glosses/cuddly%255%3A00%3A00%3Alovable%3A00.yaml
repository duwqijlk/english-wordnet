simpleMeaning: making you want to hold a person, animal or thing close in your arms
scope: This describes a person, animal or thing that makes you want to hold it close. It is not just any
  person, animal or thing that people like.
examples:
- The baby panda looks so cuddly.
- She sleeps with a cuddly teddy bear every night.
