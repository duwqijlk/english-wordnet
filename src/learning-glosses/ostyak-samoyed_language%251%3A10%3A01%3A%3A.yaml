simpleMeaning: The Uralic way of speaking used by the people it is named for.
scope: Also called Ostyak-Samoyed, Selkup, and Selkup language, this is the Uralic way of speaking used
  by the people it is named for; other Uralic ways of speaking are used by other peoples.
examples:
- She learned the Ostyak-Samoyed language from her parents.
- The Ostyak-Samoyed language is a Uralic language.
