simpleMeaning: A two-part code given to banks and savings groups; the first part shows the place and the
  second names the bank itself.
scope: A two-part code for banks and savings groups, also called bank identification number and BIN; the
  first part shows the place and the second names the bank, which sets it apart from a code that names
  one thing only.
examples:
- The bank asked for our ABA transit number.
- An ABA transit number tells you where the bank is.
