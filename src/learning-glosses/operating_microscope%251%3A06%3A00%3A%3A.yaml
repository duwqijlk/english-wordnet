simpleMeaning: A tool with two eye pieces used by a doctor in surgery to see small parts of the body that
  are hard to reach, with a clear view
scope: A two-eyed lens tool for surgery, not a how-to book and not a spending plan.
examples:
- The surgeon looked through the operating microscope to find the tiny nerve.
- An operating microscope gives a clear view of parts too small to see well.
