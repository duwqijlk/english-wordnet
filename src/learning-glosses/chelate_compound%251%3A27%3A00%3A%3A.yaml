  a ring.
scope: 'Also called chelate: a ring-built chemical gripping a metal bit, not a metal bit joined to only
  one other bit.'
examples:
- The chelate compound gripped the metal bit tight.
- A chelate compound holds a metal bit by links to two other bits.
