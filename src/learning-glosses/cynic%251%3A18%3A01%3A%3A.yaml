simpleMeaning: A member of a group of old Greek thinkers who taught that being good is the only good thing,
  and that being good means keeping oneself in check.
scope: Not a Stoic or an Epicurean, and not a modern cynic who trusts no one; this is the ancient school.
examples:
- The Cynics taught that virtue alone is good.
- A Cynic held that self-control is the heart of virtue.
