simpleMeaning: 'nitrogen moving in a round: nitrates from the soil are taken up by plants that animals
  eat, and dead animals rot and send the nitrogen back to the soil'
scope: The round by which nitrogen moves through soil, plants, and animals, not the carbon cycle and not
  the use of nitrogen in fertilizer alone.
examples:
- The nitrogen cycle keeps nitrogen moving between the soil, plants, and animals.
- Farmers add manure to feed the nitrogen cycle in their fields.
