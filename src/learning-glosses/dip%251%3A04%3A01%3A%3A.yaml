simpleMeaning: a sports exercise on two bars side by side, where you lower and raise your body by bending
  and then making your arms straight
scope: An exercise done on two bars by lowering and raising the body, not the tasty food for small pieces
  of food and not the act of putting something into a liquid.
examples:
- He did ten dips on the parallel bars.
- Each dip made his arms tired as he lowered and raised his body.
