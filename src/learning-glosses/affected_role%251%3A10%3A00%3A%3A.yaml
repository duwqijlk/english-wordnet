senseId: 'affected_role%1:10:00::'
synsetId: 06343129-n
simpleMeaning: The semantic role of a person or thing that does not do the action but is directly involved
  in or affected by the verb's happening in the clause
scope: Also called patient or patient role, this is the person or thing a verb's action falls on, not
  the one doing it.
examples:
- In the sentence 'The ball was kicked by John', the ball has the affected role.
- The teacher showed how the noun in 'Mary broke the vase' takes the affected role.
