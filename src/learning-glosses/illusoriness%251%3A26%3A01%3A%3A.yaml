simpleMeaning: The quality of coming from an illusion, of seeming real while being false and made up.
scope: The quality of coming from an illusion, of seeming real while being false and made up, not a real
  quality of a thing and not a simple mistake.
examples:
- The illusoriness of the trick fooled us all.
- She saw through the illusoriness of his promises.
