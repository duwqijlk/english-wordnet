simpleMeaning: A pointer and keys give the orders in a way of working with a computer, where pictures,
  signs and lists to pick from take the place of typed words.
scope: It is a way of working with a computer that takes orders from a pointer and keys and shows pictures,
  signs and lists to pick from instead of typed words.
examples:
- She opened the file through the graphical user interface.
- The graphical user interface let him point and click instead of typing.
