simpleMeaning: having only one kind of spores, the tiny cells that grow into new plants
scope: Having only one kind of spores; not having two kinds of spores, which is heterosporous, and not
  having no spores at all.
examples:
- The homosporous fern makes spores of a single kind.
- Most ferns are homosporous, with one kind of spore.
