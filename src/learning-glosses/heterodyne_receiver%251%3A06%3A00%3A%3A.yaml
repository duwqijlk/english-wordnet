simpleMeaning: A radio set that joins a wave made in the set with the wave that carries the signal to
  make a supersonic wave then taken apart and made stronger.
scope: A radio set that joins a wave made in the set with the wave that carries the signal to make a supersonic
  wave then taken apart and made stronger; it is also called superhet and superheterodyne receiver.
examples:
- The heterodyne receiver picked up the station.
- A heterodyne receiver joins two waves.
