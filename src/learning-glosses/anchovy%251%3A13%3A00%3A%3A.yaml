simpleMeaning: very small fish, usually put in tins or kept in salt; they are used as a small first dish
  or to add taste to sauces
scope: This is the fish as food, usually in tins or salt, not the living small fish that eats tiny sea
  plants and animals in warm seas.
examples:
- Anchovies are often served as a small first dish with bread.
- She added an anchovy to the sauce to add taste.
