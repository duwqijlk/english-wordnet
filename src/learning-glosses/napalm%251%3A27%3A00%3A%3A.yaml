simpleMeaning: Gasoline made thick by aluminum soaps, chemicals that make liquids thick; a liquid that
  burns very strongly and is used in fire bombs and flamethrowers
scope: A thick gasoline liquid that burns very easily and is used as a weapon; it is not plain gasoline
  and not a bomb itself.
examples:
- Napalm was used in fire bombs during the war.
- The flamethrower sprayed napalm that burned fiercely.
