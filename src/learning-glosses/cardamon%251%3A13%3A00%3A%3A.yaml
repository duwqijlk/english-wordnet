simpleMeaning: People put these small sweet-smelling seeds in pickles and barbecue sauces to give food
  a taste, as they do cinnamon and cloves.
scope: 'Also called cardamom and cardamum: seeds used as a seasoning, not the plant that bears them.'
examples:
- She ground cardamon seeds into the pickle mix.
- Cardamon gives barbecue sauce a warm, sweet smell.
