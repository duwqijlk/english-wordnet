simpleMeaning: Unlike a rodent, this fairly big animal bites and chews at things with two pairs of upper
  front teeth made for such biting.
scope: A fairly big biting animal with two pairs of upper front teeth, this is also called a lagomorph.
examples:
- The gnawing mammal used its two pairs of front teeth to strip the bark.
- The gnawing mammal chewed at the bark with its upper front teeth.
