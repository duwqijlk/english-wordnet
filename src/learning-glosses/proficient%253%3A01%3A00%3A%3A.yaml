simpleMeaning: about the skill and way of doing a practical job or activity well
scope: 'Also called technical: this sense is about the skill and way of doing a practical activity, not
  about a person being good at something and not about facts of science.'
examples:
- The judges praised the proficient technique in her dance.
- His proficient footwork was the result of years of practice.
