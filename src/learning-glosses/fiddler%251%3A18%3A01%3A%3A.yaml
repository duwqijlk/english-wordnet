simpleMeaning: a person with little skill who tries to fix or mend things
scope: 'Also called tinkerer: a person with little skill who tries to fix things, not a person who keeps
  handling things in a nervous way without thinking.'
examples:
- Do not let that fiddler fix the sink; he has no training.
- The fiddler tried to mend the radio but made it worse.
