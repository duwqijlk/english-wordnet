simpleMeaning: a gap in the top of a castle wall, between two solid blocks of stone
scope: This is the open gap at the top of a castle wall, not the solid stone block beside it and not the
  whole wall top.
examples:
- An archer stood in the crenel and looked out over the field.
- The castle wall had a crenel between each pair of stone blocks.
