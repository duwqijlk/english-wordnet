senseId: 'cosmopolitan%3:00:02::'
synsetId: 00638795-a
simpleMeaning: made up of people from many parts of the world who feel at home in many places, and especially
  open in views and interests, not narrow and local only
scope: About a group or place made up of people from many lands and open in views, not just about a thing
  that is used or true in all parts of the world.
examples:
- New York is a cosmopolitan city with people from all over the world.
- His cosmopolitan views came from living in many different countries.
