simpleMeaning: a muscle in the upper arm that bends the forearm and turns the palm up
scope: 'Also called biceps humeri and musculus biceps brachii: a muscle in the upper arm that bends the
  forearm and turns the palm up, not the muscle at the back of the upper arm and not a muscle of the leg.'
examples:
- He felt his biceps brachii tighten as he lifted the weight.
- The biceps brachii bends the forearm when you curl your arm.
