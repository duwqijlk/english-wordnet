simpleMeaning: A small sheet with words, numbers, or pictures on it, shown fast to a group of learners
  by their teacher
scope: This is a teaching aid shown fast to a class, also called a flashcard; it is not a playing card
  or a card used to pay.
examples:
- The teacher held up a flash card with the word 'dog' on it.
- She learned new words with flash cards every morning.
