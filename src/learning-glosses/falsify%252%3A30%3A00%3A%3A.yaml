simpleMeaning: to make or give something that you know is not true, so others will believe it is true
scope: To give false facts on purpose, knowing they are not true; not putting false words into a written
  text.
examples:
- She falsified the records to hide the money she had taken.
- He falsified his age on the form, though he knew his real age.
