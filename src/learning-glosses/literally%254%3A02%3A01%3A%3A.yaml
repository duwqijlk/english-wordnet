schema: oewn-learning-gloss-v2
senseId: 'literally%4:02:01::'
synsetId: 00112012-r
simpleMeaning: Used just before a phrase that is not meant in its exact physical sense, to stress that
  the speaker is not exaggerating.
scope: This is not the sense of taking words in their exact, factual meaning; it is the emphatic use in
  front of a figure of speech.
examples:
- The stadium was literally a sea of red shirts.
- By Friday her desk was literally a mountain of paper.
