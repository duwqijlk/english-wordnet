simpleMeaning: A tool for looking into the eye, with a layer of water that stops the clear front of the
  eye from bending light
scope: A water-layered eye tool, not a surgery lens and not a pair of eye glasses.
examples:
- The doctor used an orthoscope to look deep into the eye.
- An orthoscope holds water against the eye to keep the view true.
