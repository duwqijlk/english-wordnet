simpleMeaning: Eating foods rich in starch so that the muscles hold more fuel in store.
scope: Also called carbo loading, it is a starch-rich diet for building up fuel in the muscles.
examples:
- Carbohydrate loading helped the runners store more fuel in their muscles.
- He began carbohydrate loading before the race.
