simpleMeaning: a big tree of the southern United States with needles that are not long, in groups of two
  or three, and reddish brown bark when it is fully grown
scope: A big tree of the southern United States, also called short-leaf pine and shortleaf yellow pine;
  not a longleaf pine and not a loblolly pine.
examples:
- The shortleaf pine stood tall at the edge of the field.
- We planted a shortleaf pine in the garden last spring.
