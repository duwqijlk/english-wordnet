simpleMeaning: in a way that shows you feel pleased and think well of what you or someone close to you
  has done
scope: This is about the way a person does a thing, not the feeling of being pleased by itself.
examples:
- He proudly showed his medal to his family.
- She walked proudly into the room after winning the game.
