simpleMeaning: Money that gangsters force someone to pay by threatening violence.
scope: This is money squeezed out of people or businesses by criminals, not a tax on imports and not the
  act of keeping someone safe.
examples:
- Every shop on the street had to pay protection to the local gang.
- When he refused to pay protection, his windows were smashed.
