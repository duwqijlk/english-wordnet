simpleMeaning: Three-part leaves grow on any of various plants of hot and warm lands, with rough sticky
  pod sections or loments, the jointed kind.
scope: This is one of various plants of hot and warm lands, with three-part leaves and rough sticky pod
  sections; beggar lice and tick trefoil are other names for this sense, not the Eurasian and North American
  plant with small prickly nutlets that stick to clothing.
examples:
- Rough sticky pods of the beggar's lice caught on his sleeve.
- Beggar's lice has three-part leaves and rough sticky pods.
