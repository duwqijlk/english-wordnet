simpleMeaning: Very fine grains that were once shaken out of a small pot with holes.
scope: Very fine grains that were once shaken out of a small pot with holes, also called caster sugar;
  not coarse grains, and not grains shaken from a bag.
examples:
- Castor sugar dissolves fast in tea.
- She dusted castor sugar over the cake.
