simpleMeaning: Pretend to be a doctor and hand out cures without any real training.
scope: To act as a false doctor; not the person himself, and not the cry of a duck.
examples:
- The man quacked for years, fooling sick people with false cures.
- She warned them not to trust doctors who quack.
