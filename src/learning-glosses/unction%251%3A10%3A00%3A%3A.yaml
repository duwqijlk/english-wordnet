senseId: 'unction%1:10:00::'
synsetId: 06709053-n
simpleMeaning: Praise that is too much and shallow, given with charm that is put on.
scope: Praise that is too much and shallow, given with charm that is put on; also called smarm or fulsomeness;
  not the thick cream, often with medicine in it, rubbed on the skin as a cure or to soothe a sore place,
  not the act of putting oil on a person in a holy rite or a healing rite, and not a smug, self-serving
  show of being earnest.
examples:
- His speech was full of unction, and nobody believed a word of it.
- The letter was pure unction, praising the boss for every small thing.
