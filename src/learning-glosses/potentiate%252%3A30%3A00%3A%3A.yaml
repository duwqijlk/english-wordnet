schema: oewn-learning-gloss-v2
senseId: 'potentiate%2:30:00::'
synsetId: 00230227-v
simpleMeaning: To help a drug, or a change in the body or its chemistry, have a stronger effect, by working
  with it
scope: To make a drug or a change in the body have a stronger effect by working with it, not to make the
  change happen and not to weaken it.
examples:
- This drug can potentiate the effect of the painkiller.
- The doctor warned that alcohol can potentiate the medicine.
