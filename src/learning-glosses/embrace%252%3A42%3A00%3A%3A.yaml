simpleMeaning: to include something within a wider range or area, as part of what a person, group, or
  place covers or deals with
scope: 'Also called cover: to include things within a wider range or area, not the act of holding a person
  in your arms, and not a warm, loving acceptance of a person or idea.'
examples:
- The course embraces history, art, and music.
- Her work embraces both teaching and research.
