simpleMeaning: one flat piece in a wall or door, or a part of a wall or door made of several flat pieces
scope: 'Also called panelling: flat covering pieces on a wall or door, not a group of people chosen to
  talk about or judge something.'
examples:
- The old room had dark wood paneling on its walls.
- Paneling covered the lower half of the door.
