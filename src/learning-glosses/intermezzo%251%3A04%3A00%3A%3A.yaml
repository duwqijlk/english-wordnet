schema: oewn-learning-gloss-v2
senseId: 'intermezzo%1:04:00::'
synsetId: 00521936-n
simpleMeaning: Between the parts of a longer show, a short bit of music, dance, or some other kind of
  show is put in
scope: A short act of music or dance between parts of a longer show, also called an interlude or an entr'acte;
  not a short piece of music played between acts of a play or opera.
examples:
- The dancers performed a short intermezzo between the two halves of the evening's show.
- An intermezzo of song filled the gap while the stage was changed for the next scene.
