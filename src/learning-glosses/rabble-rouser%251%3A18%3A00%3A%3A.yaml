simpleMeaning: A leader in politics who wins backing by stirring up what crowds feel and their unfair
  views of others
scope: 'Also called a demagogue: a leader in politics who stirs up crowds, not a fair speaker and not
  a calm leader.'
examples:
- The rabble-rouser worked the crowd into a fury with his speech.
- Voters grew tired of the rabble-rouser's angry speeches.
