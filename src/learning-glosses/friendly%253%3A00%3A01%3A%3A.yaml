simpleMeaning: showing the kind, warm way of acting that you expect from someone close to you who cares
  for you
scope: This is about kind, warm behaviour like a friend's, not about being willing to help a plan or cause,
  and not about soldiers from your own side.
examples:
- She gave me friendly advice when I was worried.
- We moved to a friendly town where people smiled and said hello.
