simpleMeaning: to plan and make something in a careful, artistic or skilled way
scope: This is not about intending something for a purpose; it is about making the shape or working form
  of a thing with skill.
examples:
- She designed a small wooden chair for her garden.
- He designed the cover of the magazine by hand.
