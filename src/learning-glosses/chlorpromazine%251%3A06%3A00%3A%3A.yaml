simpleMeaning: a drug made from phenothiazine, a chemical that works on the brain, used to calm severe
  mental illness and to make people sleepy and calm
scope: A drug that calms severe mental illness and also makes people sleepy and calm; not a painkiller
  and not a drug that wakes people up.
examples:
- The doctor gave him chlorpromazine to calm his troubled mind.
- Chlorpromazine helped her sleep through the night.
