simpleMeaning: Three parts of the brain, the lower back part, the small brain at the back, and the middle
  part, are joined by this band of nerve threads.
scope: This band of nerve threads joins three parts of the brain, not one nerve thread on its own.
examples:
- The pons joins three parts of the brain.
- The pons is a band of nerve threads.
