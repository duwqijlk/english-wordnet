simpleMeaning: Of the cup-shaped hollow in the hip bone that holds the top of the leg bone.
scope: Cotyloid and cotyloidal are other names for this sense, not of the knee joint and not of the shoulder
  hollow.
examples:
- The acetabular cup holds the head of the thigh bone.
- An acetabular fracture needs a hip surgeon.
