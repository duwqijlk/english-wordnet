simpleMeaning: A forceful, head-on strike at a defended place.
scope: This is the military noun for an attack on a defended place, not the weather event, an emotional
  uproar, or the verb for attacking suddenly.
examples:
- The castle was taken by storm before reinforcements could arrive.
- After weeks of siege, the rebels took the garrison by storm.
