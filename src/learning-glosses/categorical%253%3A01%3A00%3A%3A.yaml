simpleMeaning: to do with a group or class, or put in a group or class
scope: This means to do with a group or class, not the other sense where something is said with no limits
  or things held back.
examples:
- The library uses a categorical system that puts books into groups by subject.
- He made a categorical list of the plants by kind.
