simpleMeaning: being unable to stop yourself from giving in to sudden wishes and wants
scope: Being unable to resist giving in to one's wishes; not the church pardon, and not the act of pleasing
  oneself.
examples:
- His indulgence led him to buy whatever he wanted.
- She could not control her indulgence for sweets.
