simpleMeaning: a short notice in a paper or magazine, most often in small print, set with other notices
  of the same kind
scope: This is a short notice in a paper or magazine, most often in small print; classified and classified
  advertisement are other names for this sense, not a large showy notice and not a notice on its own.
examples:
- I found the job in a classified ad in the morning paper.
- She placed a classified ad to sell her old bike.
