simpleMeaning: a rough cotton cloth with threads far apart, first used to wrap cheese
scope: This is a thin cotton cloth with threads far apart, first used for wrapping cheese, not a thick,
  tightly made cloth.
examples:
- She wrapped the cheese in cheesecloth.
- They bought a piece of cheesecloth to wrap the soft cheese.
