simpleMeaning: A large evergreen cone-bearing tree growing in Spain and in North Africa, with flat branches
  and scale-like leaves; its hard wood smells sweet and its bark yields resin for varnish.
scope: Another name for sandarac, the same tree; it is not the fragrant wood or the brittle resin that
  share the name.
examples:
- Sandarac trees grow in North Africa and Spain.
- The sandarac tree's bark yields a resin used in varnishes.
