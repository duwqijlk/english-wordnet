simpleMeaning: the act of taking money away from what a worker is paid
scope: This is the act of taking money from pay, not the tax money itself that is taken and sent to the
  government.
examples:
- Withholding from her pay is done by the company she works for each month.
- The withholding of part of his pay happens before he gets the rest of his money.
