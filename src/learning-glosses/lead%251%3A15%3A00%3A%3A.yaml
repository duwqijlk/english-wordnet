simpleMeaning: in baseball, the spot a runner moves to after stepping off a base, ready to run to the
  next one
scope: This is the runner's position off a base, not an advantage held in a race, not the principal actor
  in a film, and not the soft heavy metal.
examples:
- The runner took a long lead off first base and stole second on the next pitch.
- The pitcher whirled and caught him with too big a lead, ending the inning.
