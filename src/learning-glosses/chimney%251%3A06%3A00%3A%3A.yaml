simpleMeaning: a tall, hollow part of a building that lets smoke from a fire go up and out through the
  wall or the roof
scope: The part on a house that smoke goes up through, not the small glass part that stands around the
  wick of an oil lamp.
examples:
- Smoke rose slowly from the chimney of the old farmhouse.
- Birds had built a nest on top of the chimney.
