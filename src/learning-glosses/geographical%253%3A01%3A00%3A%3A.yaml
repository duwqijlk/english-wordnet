simpleMeaning: connected with the science that studies the earth, its land, water and places where people
  live
scope: 'Also called geographic: this sense means connected with the science that studies the earth, not
  the sense that means decided by where a place is.'
examples:
- The book has a geographical map of the rivers and mountains in this area.
- She studies the geographical names of towns, lakes and seas.
