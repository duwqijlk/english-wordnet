simpleMeaning: To make something else a needed part or a needed result, or to show that it is a needed
  part or result
scope: 'Also called entail: this sense means to need or show something as a part or result that must follow,
  not to say that a person did a wrong act.'
examples:
- Building a larger factory implicates a much larger cost.
- His choice implicates changes for the whole team.
