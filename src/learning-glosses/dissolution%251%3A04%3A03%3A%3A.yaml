senseId: 'dissolution%1:04:03::'
synsetId: 00749605-n
simpleMeaning: a way of living where a person has no self-control and gives in too much to bodily pleasures
scope: This sense is also called dissipation, profligacy, looseness, and licentiousness. It is about a
  life with no self-control, not the ending of a relationship or group.
examples:
- 'His dissolution shocked his family: he spent every night drinking and chasing pleasure.'
- She fell into dissolution, giving all her time and money to bodily pleasures.
