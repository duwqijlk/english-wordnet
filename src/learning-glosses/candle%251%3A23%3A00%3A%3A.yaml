simpleMeaning: The base unit of light strength (luminous intensity) in the modern metric system; equals
  1/60 of the light from a square centimeter of an ideal heat radiator at 2,046 kelvin.
scope: This is the scientific unit of light intensity, another name for the candela, not the wax stick
  with a wick.
examples:
- In older books, the brightness of a lamp is sometimes given in candles.
- One candle is the same as one candela.
