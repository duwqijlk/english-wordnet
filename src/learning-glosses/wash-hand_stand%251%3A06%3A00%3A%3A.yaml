simpleMeaning: In Britain, a table or a frame holds a bowl and a jug of water for cleaning up, as a piece
  of furniture.
scope: Also called a washstand, this piece of furniture holds a bowl and a jug of water for cleaning up,
  and the name is British.
examples:
- A wash-hand stand with a bowl and a jug of water stood in the corner.
- Water was poured from the jug on the wash-hand stand to clean hands.
