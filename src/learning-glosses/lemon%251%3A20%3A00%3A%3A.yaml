simpleMeaning: a small tree with leaves that stay green all year; it first grew in Asia and is now grown
  in many places for its fruit
scope: This is the tree that the yellow fruit grows on; not the fruit itself, not its sharp sour taste,
  and not a bad car.
examples:
- A lemon tree grows in their garden and gives fruit each year.
- Lemon trees need sun and warm weather to grow well.
