simpleMeaning: A unit that tells how much charge two plates can hold at one volt between them, with one
  coulomb on each plate, equal in size and the other way round.
scope: The unit that tells how much charge a plate pair can hold at one volt; also called farad, and not
  the gas, and not the letter.
examples:
- The capacitor is rated at one farad.
- A farad is a very large unit.
