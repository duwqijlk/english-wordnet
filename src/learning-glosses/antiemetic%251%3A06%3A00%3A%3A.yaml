simpleMeaning: a drug that stops or eases sickness and vomiting
scope: 'Also called antiemetic drug: a drug that stops or eases sickness and vomiting, not a drug that
  causes vomiting and not a painkiller.'
examples:
- The doctor gave her an antiemetic before the treatment.
- An antiemetic can ease the sickness that follows surgery.
