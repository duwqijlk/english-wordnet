senseId: 'illegible%3:00:00::'
synsetId: 01408240-a
simpleMeaning: used of handwriting, print or other writing that cannot be read
scope: This sense is about writing or print that is too unclear to read, not about words that are hard
  to understand and not about something against the law.
examples:
- His handwriting was so illegible that no one could read the note.
- The old print had become illegible after years in the sun.
