simpleMeaning: In children, this kind of joint illness makes big joints swell and hurt, and it may slow
  the growth of their bones.
scope: This kind of joint illness hits children, and it is one form of a wider joint illness.
examples:
- Juvenile rheumatoid arthritis made their knees swell and ache.
- Juvenile rheumatoid arthritis made their elbows swell and ache.
