senseId: 'worker%1:05:01::'
synsetId: 02210101-n
simpleMeaning: a member of a group of insects that lives together, that cannot have young, looks for food,
  and looks after the young insects
scope: An insect in a group that looks for food and looks after the young, not a person who does a job
  for pay.
examples:
- A worker bee feeds the young bees in the hive.
- Worker ants carry food back for the whole group.
