simpleMeaning: An electronic signal reflected back to a radar antenna, containing information about the
  reflecting object's location and distance.
scope: Unlike the object out there, this is the signal that comes back to the set that sent it.
examples:
- The radar echo showed where the plane was.
- A radar echo from the ship told them how far away it was.
