simpleMeaning: the point in a planet's or comet's path round the sun where it comes nearest to the sun
scope: The point in a planet's or comet's path where it comes nearest to the sun, not the farthest point
  and not the sun itself.
examples:
- Earth reaches perihelion in early January.
- The comet sped up as it neared perihelion.
