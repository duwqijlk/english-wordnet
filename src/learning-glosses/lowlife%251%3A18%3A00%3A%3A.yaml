simpleMeaning: a person that other people think is very bad and deserves no respect
scope: 'Also called rat, crumb, git, skunk, puke, bum, scumbag, stinker, rotter and stinkpot: this is
  a person others think is very bad, not a poor person and not a person with a low place in life.'
examples:
- Only a lowlife would steal from an old woman.
- The neighbours called him a lowlife after he cheated so many people.
