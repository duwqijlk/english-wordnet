simpleMeaning: hundreds of tiny yellow flower heads crown a low sticky woody plant of the southwestern
  United States, its many thin branches bearing long thin leaves
scope: 'Also called broom snakeroot, broom snakeweed, rabbit-weed, rabbitweed, and turpentine weed: a
  low sticky plant of the southwest, not a tall shrub and not a garden weed.'
examples:
- Snakeweed grew in thick patches along the dry roadside.
- The snakeweed was covered in hundreds of tiny yellow flower heads.
