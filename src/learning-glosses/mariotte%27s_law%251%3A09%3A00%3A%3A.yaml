simpleMeaning: The rule that, at a fixed heat, the push of a perfect gas grows as its room shrinks, and
  shrinks as its room grows.
scope: 'Also called Boyle''s law: the rule that links the push and the room of a perfect gas at a fixed
  heat, not a rule about heat changing and not a rule about a real gas.'
examples:
- Mariotte's law says the pressure grows as the volume shrinks.
- At a fixed temperature, Mariotte's law links pressure and volume.
