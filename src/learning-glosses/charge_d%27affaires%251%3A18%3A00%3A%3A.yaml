simpleMeaning: the person who runs a country's office abroad for a short time while the top envoy is away
scope: The person who runs a country's office abroad for a short time while the top envoy is away, not
  the top envoy himself and not a junior clerk in the office.
examples:
- The charge d'affaires met the minister while the ambassador was on leave.
- As charge d'affaires, she signed the papers for the mission.
