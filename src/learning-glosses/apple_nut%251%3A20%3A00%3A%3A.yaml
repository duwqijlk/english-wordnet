simpleMeaning: a seed like a nut from a palm of South America, whose hard white shell takes a bright shine
  and is used to make things such as buttons
scope: 'Also called ivory nut and vegetable ivory: a hard-shelled seed from a South American palm, used
  for things like buttons, not an apple and not a nut to eat.'
examples:
- The apple nut's hard white shell shone after polishing.
- Apple nuts were carved into buttons.
