simpleMeaning: how much a wave is bent as it moves along
scope: 'Also called refraction: how much a moving wave is bent, not the movement of a pointer on a measuring
  tool and not the general fact of being bent.'
examples:
- The deflection of the light wave as it passed through water could be measured.
- Scientists measured the deflection of the sound wave when it hit the wall.
