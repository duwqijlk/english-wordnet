simpleMeaning: to fall down because you are very tired, you are ill, or you have a sudden attack
scope: To fall down from tiredness, illness, or a sudden attack; not a fall in business or prices, not
  throwing yourself down, and not breaking down in your mind.
examples:
- He collapsed after running all day in the heat.
- She collapsed during the meeting and was taken to hospital.
