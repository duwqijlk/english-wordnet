simpleMeaning: The bond of things that fall together.
scope: This sense is also called synchronization, synchronicity, synchrony, and synchronisation, for the
  bond of things that fall together, unlike the sense for an adjustment that brings a thing about, or
  about again, together, and unlike the sense for the making of time-keepers to agree.
examples:
- Synchronizing is the bond of things that fall together.
- Synchronizing bonds things that fall together.
