simpleMeaning: a front end that looks like the projecting part of a human face, especially the front of
  an aircraft
scope: This is the front of a vehicle or craft, not the facial body part, the pouring spout of a container,
  or the front of a tool or weapon.
examples:
- Ice built up along the nose of the aircraft during the long descent.
- The missile's nose was fitted with a camera instead of a warhead.
