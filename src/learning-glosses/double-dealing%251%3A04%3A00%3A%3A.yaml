simpleMeaning: saying you mean one thing while you act on a different, hidden aim, with no honest intent
scope: 'Another name for duplicity: cheating by saying one thing and doing another, not an honest mistake
  and not the adjective sense that describes a dishonest person.'
examples:
- His double-dealing cost him the trust of his partners.
- The double-dealing in the talks left both sides unsure what he really wanted.
