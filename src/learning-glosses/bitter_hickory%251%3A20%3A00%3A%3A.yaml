simpleMeaning: Too sharp in taste to eat are the thin-shelled nuts of this tree of the east of the United
  States, whose leaves have seven or nine small parts.
scope: This tree of the east of the United States bears thin-shelled nuts too sharp to eat, and bitter
  pignut, bitternut, bitternut hickory and swamp hickory are other names for it.
examples:
- We gathered the thin-shelled nuts that fell from the bitter hickory.
- We counted seven small parts on one leaf of the bitter hickory.
