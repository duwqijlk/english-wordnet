simpleMeaning: to get a thing done or made with only the small means you have
scope: To get a thing done with only the small means you have; also called deal and manage, and grapple
  and contend are other names for this sense; not the long cloak worn by a priest and not the brick at
  the top of a wall.
examples:
- We coped on just a gallon of gas.
- They coped on half a loaf of bread every day.
