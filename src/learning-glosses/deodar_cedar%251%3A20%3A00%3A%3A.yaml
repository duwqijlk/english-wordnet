simpleMeaning: Gardeners and builders prize this tall East Indian cedar for its looks and its wood, and
  its wide branches end in tips that droop.
scope: 'Also called deodar: a tall cedar prized for looks and timber, not a pine, and not a low shrub
  cedar.'
examples:
- A deodar cedar stood at the far end of the garden, its branches drooping at the tips.
- Builders prized the deodar cedar for its fine timber.
