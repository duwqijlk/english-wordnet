simpleMeaning: A number that tells how many, the one you get when you add seventy and eight together.
scope: Another name for this number is 78, and also seventy-eight; it tells how many things there are,
  not how they are placed in order.
examples:
- Seventy and eight add up to LXXVIII.
- LXXVIII comes after LXXVII.
