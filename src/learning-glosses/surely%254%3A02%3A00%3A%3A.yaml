simpleMeaning: in a way that leaves no doubt, with no question at all; in informal speech people sometimes
  say 'sure' for this word
scope: This sense is also called sure, and another name for it is certainly. It says that a thing is true
  or will happen with no doubt; it is not a way of asking, and it does not show doubt.
examples:
- The train will surely arrive before noon.
- She is surely the best player on the team.
