simpleMeaning: something that makes a person feel annoyed and bothered
scope: Something that keeps annoying a person, also called a thorn; not a sharp point on a plant stem
  and not a thing that hurts the skin.
examples:
- The loud buzzing was a constant irritant while she tried to work.
- His late replies became an irritant for the whole team.
