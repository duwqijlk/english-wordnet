senseId: 'devaluation%1:04:01::'
synsetId: 00807185-n
simpleMeaning: An official act by a country that makes its money worth less than the money of other countries
scope: This is a government's official lowering of its money's value against other countries' money, not
  a fall in price in the market on its own and not making a person or idea seem less important.
examples:
- The government announced a devaluation of its money to help goods sold abroad.
- After the devaluation, goods from other countries cost much more at home.
