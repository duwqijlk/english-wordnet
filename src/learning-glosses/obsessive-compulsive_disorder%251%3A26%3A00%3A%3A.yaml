simpleMeaning: A state of worry in which a person keeps doing the same set acts over and over, while the
  same thoughts and feelings keep coming back.
scope: A state of worry with set acts done over and over and thoughts that keep coming back, not a fear
  that soon goes away.
examples:
- She lived with obsessive-compulsive disorder, repeating the same acts.
- His obsessive-compulsive disorder brought the same thoughts back again and again.
