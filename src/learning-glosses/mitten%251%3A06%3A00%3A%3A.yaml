simpleMeaning: A glove with the thumb in its own part and the other four fingers together in one part
scope: A glove that keeps the thumb apart and the other four fingers together, not a glove with a separate
  place for each finger.
examples:
- She pulled a mitten onto each hand.
- His mittens kept his fingers warm in the snow.
