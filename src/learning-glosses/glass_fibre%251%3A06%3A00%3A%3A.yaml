simpleMeaning: A very thin thread made of a clear hard substance that guides light, used in groups to
  carry pictures
scope: This is a very thin thread made of a clear hard substance that guides light, used in groups to
  carry pictures; glass fiber, optical fiber and optical fibre are other names for this sense, not a copper
  wire and not a plain thread.
examples:
- Glass fibre carries light around bends.
- Bundles of glass fibre bring pictures from inside the body.
