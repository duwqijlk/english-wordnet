senseId: 'fracking%1:04:01::'
synsetId: 90001131-n
simpleMeaning: a way to make a well give more, by pushing liquid into rock with great force so the rock
  breaks
scope: This sense is the way of breaking rock in a well by pushing liquid in with great force to get more
  out of the well, not drilling a new well and not the liquid itself.
examples:
- Fracking made the old well give more gas.
- They used fracking to break the rock deep under the ground.
