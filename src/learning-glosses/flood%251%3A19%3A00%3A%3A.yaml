senseId: 'flood%1:19:00::'
synsetId: 11475008-n
simpleMeaning: when water rises and spills onto land that is usually dry
scope: This is water rising and spilling onto dry land. It is not the sea coming in between tides, and
  not the act of filling something on purpose until it spills over.
examples:
- After heavy rain, a flood covered the fields near the river.
- The flood left mud on roads that are usually dry.
