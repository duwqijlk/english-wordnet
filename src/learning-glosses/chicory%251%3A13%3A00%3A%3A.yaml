simpleMeaning: Leaves, crisp and spiky, that taste somewhat bitter.
scope: Crisp spiky leaves, somewhat bitter to the taste; not a long-lived Old World herb with rayed flower
  heads and blue florets, grown for its root and its heads of crisp eatable leaves used in salads, nor
  the root of the plant it is named for, roasted and ground to stand in for, or weaken, coffee, nor the
  dried root of the plant it is named for, used as a coffee stand-in.
examples:
- Their chicory grew at dawn.
- The chicory was picked at noon.
