simpleMeaning: of a stage in a child's sexual growth, centred on the bottom; held there, a person is said
  to become tidy, mean, stubborn and driven to repeat things, and more
scope: Also called anal retentive. This describes a stage in a child's sexual feelings centred on the
  bottom; it is not a plain word for the body part itself.
examples:
- The book describes the anal stage in a child's early growth.
- She wrote about people stuck at the anal stage and their love of order.
