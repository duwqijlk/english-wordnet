simpleMeaning: a doctor who is good at finding out what makes people react badly to things like pollen
  and treating them
scope: A doctor who finds and treats allergies, not a doctor for general illness and not the allergy itself.
examples:
- Our allergist found that dust was making my son sneeze.
- She went to an allergist to find out why her eyes itched every spring.
