simpleMeaning: a small lump of something a person can chew, such as tobacco
scope: 'Also called chew and also called plug: this is a small lump a person chews, not the act of biting
  and chewing food.'
examples:
- He took a wad of tobacco from the tin and put it in his mouth.
- The man kept a wad in his cheek while he worked.
