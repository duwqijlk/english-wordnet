simpleMeaning: A large tree of central and southern Europe and Asia Minor that sheds its leaves each year,
  with lance-shaped leaves that have spiked lobes
scope: This is the oak of central and southern Europe and Asia Minor that sheds its leaves each year and
  has spiked lobes on lance-shaped leaves; turkey oak and Quercus cerris are other names for it, not an
  evergreen oak and not an oak with round-lobed leaves.
examples:
- The European turkey oak drops its leaves each year.
- The lance-shaped leaves of the European turkey oak have spiked lobes.
