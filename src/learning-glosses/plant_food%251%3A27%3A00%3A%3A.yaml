simpleMeaning: any stuff, such as animal dung or a mix of nitrates, used to make soil richer for growing
scope: 'Also called fertilizer and fertiliser: any stuff, such as animal dung or a mix of nitrates, used
  to make soil richer for growing, not a poison for weeds and not plain water.'
examples:
- He spread plant food on the vegetable beds.
- Plant food made the soil richer for the roses.
