simpleMeaning: A set amount, such as a pound or a kilo, used to say how heavy a thing is.
scope: 'Also called weight: a set amount used to say how heavy a thing is, not a set amount for length
  and not a set amount for heat.'
examples:
- The pound is a weight unit used in the market.
- A kilo is a weight unit for heavy goods.
