simpleMeaning: In physics, the six kinds of a very small basic part (a quark) that joins with others to
  make larger parts
scope: In physics, this name is for the six kinds of quark. It is not the taste of food or drink, and
  not the verb that means to add taste to food.
examples:
- The teacher said that in physics, flavor is one of the ways to group quarks.
- Each flavor of quark behaves in a different way in tests.
