simpleMeaning: In a weak way, with stops and starts, as if there is little strength to go on.
scope: This means doing something weakly and in stops and starts, not the sense of doing it faintly, barely
  seen or heard.
examples:
- He spoke feebly, stopping to catch his breath.
- The old engine ran feebly, starting and stopping.
