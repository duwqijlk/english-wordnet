simpleMeaning: A tall annual herb or shrub from tropical Asia yields strong fibre and bears yellow flowers
  and velvety leaves; it now grows wild in south-eastern Europe and the United States.
scope: Another name for velvetweed, the tropical Asian fibre plant; not the south-western US shrub with
  lobed furry leaves and red-purple flowers.
examples:
- Velvetleaf chokes maize and soybean fields across the American Midwest.
- Farmers pull velvetleaf before it sets seed.
