simpleMeaning: the meat of chickens, turkeys, ducks or geese kept for food
scope: The meat of these birds when it is eaten as food; not the live birds kept on a farm, which is the
  other sense of the word.
examples:
- We bought fresh poultry at the market for dinner.
- She does not eat poultry, so she chose fish instead.
