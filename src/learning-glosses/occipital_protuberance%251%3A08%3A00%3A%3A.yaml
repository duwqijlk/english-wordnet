simpleMeaning: A bump that sticks out on the outside of the bone at the back of the head
scope: A bump on the bone at the back of the head, not a bump on the top or the front of the skull and
  not a soft swelling.
examples:
- The doctor felt the occipital protuberance at the back of the baby's head.
- A small occipital protuberance can be seen on the skull.
