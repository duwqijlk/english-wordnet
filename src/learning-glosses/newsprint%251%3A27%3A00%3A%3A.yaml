simpleMeaning: cheap paper made from wood pulp (soft, wet wood that has been broken down) and used to
  print newspapers on
scope: 'Also called newspaper: the cheap paper itself, not the printed paper full of news that you buy
  and read each day.'
examples:
- The magazine was printed on rough newsprint that turned yellow in the sun.
- He wrapped the cups in old newsprint before putting them in the box.
