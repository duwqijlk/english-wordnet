simpleMeaning: a set of letters or numbers that you type, dial, or say to be allowed to use something
  such as a phone line or computer network.
scope: This is not the right or opportunity to enter a place or use a service; it is the set of letters
  or numbers that unlocks it.
examples:
- The receptionist wrote the access code on the back of my key card.
- You cannot open the lab door without the four-digit code the manager gave you.
