synsetId: 13482593-n
simpleMeaning: a general rise in prices caused by more people wanting goods or by more money being available
scope: A rise in prices from stronger demand or more money being available; not a rise from higher costs,
  and not a rise in one price alone.
examples:
- Demand-pull inflation followed the sudden boom in spending.
- Economists blamed demand-pull inflation for the price rises.
