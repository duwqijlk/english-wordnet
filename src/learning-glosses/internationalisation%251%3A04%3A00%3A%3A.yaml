simpleMeaning: The act of putting something under the joint control of many nations.
scope: Putting something under the joint control of many nations, also called internationalization; not
  making a thing known in many lands.
examples:
- The internationalisation of the river took years of talks.
- They debated the internationalisation of the canal.
