simpleMeaning: A smallest bit of matter with a positive charge, which wipes itself and an electron out
  when the two meet
scope: A smallest bit of matter with a positive charge, which wipes itself and an electron out when the
  two meet; antielectron is another name for this sense, not an electron and not a bit with a negative
  charge.
examples:
- A positron met an electron in the cloud chamber.
- The positron vanished in a flash of light.
