simpleMeaning: Sheets, lines, lenses, rods or layers of frozen water, mostly 0.04 to 6 inches (1-150 millimeters)
  thick, that grow in frozen ground, drawing in water as the ground freezes.
scope: Thin sheets, lines, rods or layers of frozen water that grow in frozen ground, also called segregated
  ice.
examples:
- Taber ice forms in the frozen ground as water is pulled in.
- The Taber ice in the soil was a thin sheet only a few inches thick.
