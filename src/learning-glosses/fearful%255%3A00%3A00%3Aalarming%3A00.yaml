simpleMeaning: making people feel very strong fear
scope: This sense is also called terrible, awful, dread, dreadful, frightening, dreaded, fearsome, horrific,
  and dire. It is about a thing that makes people afraid, not a person who is shy and easily afraid, and
  not a person who has no courage.
examples:
- A fearful storm shook the whole town in the night.
- They heard a fearful cry from the dark wood.
