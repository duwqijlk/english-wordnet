simpleMeaning: A vein beside the vertebral vein that passes through an opening in a bony projection of
  the seventh neck vertebra and empties into the brachiocephalic vein.
scope: The Latin name of the accessory vertebral vein, not the main vertebral vein that it runs beside.
examples:
- The vena vertebralis accessoria drains blood from the neck into the brachiocephalic vein.
- During dissection, the vena vertebralis accessoria was seen passing through the seventh cervical vertebra.
