simpleMeaning: a soldier who is not a professional and is a member of a military unit for a territory
scope: This names a person, a soldier who is not a professional in a military unit for a territory. It
  is not the unit itself, and not the adjective senses about belonging to a state or ruler's land or about
  guarding land.
examples:
- He served as a territorial in a local military unit, while keeping his normal job.
- The territorials trained at weekends and worked other jobs in the week.
