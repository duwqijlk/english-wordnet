simpleMeaning: From South Carolina to Maine along the Atlantic coast of North America, this sea fish is
  liked as food for the pan.
scope: Northern porgy and scup are other names for this fish, liked as food for the pan and found along
  the Atlantic coast from South Carolina to Maine.
examples:
- The northern scup lives in the sea off the Atlantic coast.
- They cooked a northern scup in the pan for supper.
