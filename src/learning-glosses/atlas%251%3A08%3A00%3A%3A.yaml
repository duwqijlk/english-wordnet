simpleMeaning: the top bone in the neck (the first cervical vertebra)
scope: This sense is the top bone in the neck; it is not a book of maps, and not the strong man in old
  Greek stories who holds up the sky.
examples:
- The atlas is the neck bone that the head sits on.
- A break in the atlas can hurt the neck badly.
