synsetId: 00840873-v
simpleMeaning: To hide your real aims, above all by putting on a big show of good will so you can gain
  what you want.
scope: To hide your real aims by a show of good will, also called snow, hoodwink, bamboozle, lead by the
  nose and play false; not an open lie and not a plain refusal to answer.
examples:
- He tried to pull the wool over someone's eyes by praising the plan he meant to block.
- She saw through his attempt to pull the wool over someone's eyes.
