simpleMeaning: a thing that makes you feel a sudden and very strong feeling
scope: This is the thing that brings the feeling, not the act of feeling it and not a fright that is almost
  fun on its own.
examples:
- The thrill of riding the fast roller coaster made her laugh and shout.
- For him, the thrill of space travel was worth all the long years of training.
