simpleMeaning: spoken in a steady rhythm that stays the same, as in chanting
scope: 'Also called singsong and chantlike: spoken in a steady rhythm that stays the same, not spoken
  in a normal voice that changes as you go.'
examples:
- Their intoned prayers could be heard all through the hall.
- He read the long list in an intoned voice that never changed.
