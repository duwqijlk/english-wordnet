simpleMeaning: A wild dog-like animal that lives in the dry lands of North Africa, kin to the golden jackal
  and the grey wolf.
scope: A wild dog-like animal of the dry lands of North Africa, also called jackal, grey jackal, African
  golden wolf and Egyptian jackal; not the golden jackal or the grey wolf themselves.
examples:
- Canis anthus hunts at night in the deserts of North Africa.
- The Canis anthus is smaller than the grey wolf.
