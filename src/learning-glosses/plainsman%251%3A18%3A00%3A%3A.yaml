simpleMeaning: In open flat country, above all in the great grasslands of North America, lives a male
  person
scope: A male person who lives in a flat open land, above all in the Great Plains, not a person who lives
  in the hills or in a town.
examples:
- The old plainsman had spent his whole life on the open grassland.
- A plainsman from the north told stories of the long winters.
