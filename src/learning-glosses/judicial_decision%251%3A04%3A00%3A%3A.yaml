simpleMeaning: The ruling that a court with the power to decide gives on the matters put before it.
scope: The answer a court with the power to rule gives to the questions put before it, also called judgment
  or judgement; not the view of a court with no power to rule and not a ruling made outside the case.
examples:
- The judicial decision went against the company.
- A judicial decision from the high court settled the matter.
