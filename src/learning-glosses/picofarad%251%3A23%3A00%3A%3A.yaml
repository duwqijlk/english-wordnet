simpleMeaning: One millionth of a millionth of the full unit is this measure of how much electric charge
  a thing can hold
scope: A measure of how much electric charge a thing can hold, one millionth of a millionth of the full
  unit, not a unit of length and not a unit of weight.
examples:
- The picofarad is used to count very small amounts of electric charge.
- This small part holds only a few picofarads of charge.
