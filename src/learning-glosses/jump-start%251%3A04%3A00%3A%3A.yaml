simpleMeaning: The act of getting a car engine with a weak battery going, by wires joined to another car.
scope: Getting a car engine with a weak battery going by wires from another car; jumpstart is another
  name for it, not a new battery and not pushing the car to get it going.
examples:
- My battery was dead, so I had to get a jump-start from my neighbour.
- A jump-start got the old car going again.
