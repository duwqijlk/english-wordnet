simpleMeaning: An inflamed wet lining of the voice box, marked by a rough voice, loss of voice, and coughing.
scope: Of the voice box lining when it is inflamed, with a rough voice or loss of voice and coughing.
examples:
- Laryngitis left her with no voice at all.
- He stayed home with laryngitis and a bad cough.
