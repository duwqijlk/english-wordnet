synsetId: 01331827-n
simpleMeaning: RNA viruses, grouped according to their particles, found in arthropods, bats and rodents
  and mostly carried from animal to animal by blood-feeding arthropods, bringing fevers, hepatitis, bleeding
  and brain swelling.
scope: The broad virus group transmitted mainly by blood-feeding arthropods such as mosquitoes and ticks;
  arborvirus is the same group under another spelling, and it is not one virus species or the illness
  the viruses cause.
examples:
- West Nile virus is an arbovirus spread by mosquitoes.
- Public health teams monitor arboviruses in tick and mosquito populations.
