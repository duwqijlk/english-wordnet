simpleMeaning: Small flowers in shades from blue to lilac or mauve grow in tight bunches on a hairy plant
  that lives one year, found from California to Mexico.
scope: This is a hairy plant that lives one year and bears bunched flowers in shades from blue to lilac
  or mauve, not a plant that lives for years.
examples:
- Fiddleneck was in flower.
- The fiddleneck had small blue flowers.
