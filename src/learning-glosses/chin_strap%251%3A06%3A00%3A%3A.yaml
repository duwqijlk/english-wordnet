simpleMeaning: A hat is held in place by a band fixed to it that runs under the lower part of the face.
scope: This band, fixed to a hat, runs under the lower part of the face and keeps the hat in place.
examples:
- She fastened the chin strap under her chin before going out.
- The chin strap kept his hat in place.
