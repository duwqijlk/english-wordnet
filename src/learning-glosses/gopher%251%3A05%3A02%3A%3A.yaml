simpleMeaning: a land turtle that digs holes to live in, can be eaten, and lives in the south-east of
  North America
scope: This sense is the hole-digging land turtle of the south-east of North America, also called gopher
  tortoise and gopher turtle, not the small hole-digging furry animal and not a person full of energy.
examples:
- The gopher pulled its head into its hard shell and rested in its deep hole.
- A gopher with a heavy shell moved slowly over the sandy ground in Florida.
