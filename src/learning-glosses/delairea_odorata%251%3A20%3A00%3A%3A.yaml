simpleMeaning: A fleshy climber from South Africa that winds and lives through the year, with yellow flowers,
  grown mostly indoors for its leaves; it is sometimes put in the Senecio genus.
scope: Also called German ivy or Senecio milkanioides; a fleshy South African climber with yellow flowers,
  grown mostly indoors for its leaves, kin to other leafy houseplants.
examples:
- Delairea odorata winds around the window frame, its yellow flowers bright in spring.
- We keep Delairea odorata indoors for its leaves.
