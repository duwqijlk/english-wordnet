simpleMeaning: a big kind of dance music named for the feeling people who listen to it say they get, often
  called a rush
scope: A kind of dance music known for the rush its listeners feel, not other trance music such as Goa
  trance and not other dance music without that lift.
examples:
- The DJ closed the night with an anthem trance track that lifted the whole room.
- She loves anthem trance for the rush she feels when the beat drops.
