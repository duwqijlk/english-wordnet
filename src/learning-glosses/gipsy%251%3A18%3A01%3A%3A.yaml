simpleMeaning: a worker who moves from place to place because their work needs them to go where the work
  is
scope: 'Also called gypsy, and another name for it is itinerant: a worker who moves for work. It is not
  a person who lives like a Romani, moving from place to place and not following the usual way of life.'
examples:
- The gipsy followed the harvest, working on a new farm each month.
- Gipsies often travel far to find work that lasts only part of the year.
