simpleMeaning: a piece of leather that goes across a shoe, over the top middle part of the foot
scope: This is a part of a shoe, not the seat put on a horse for riding and not a piece of meat.
examples:
- The leather saddle across the top of his shoe was torn.
- His new shoes had a black saddle over the middle part.
