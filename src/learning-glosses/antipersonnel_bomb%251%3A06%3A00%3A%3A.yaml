scope: 'Also called anti-personnel bomb, daisy cutter, and fragmentation bomb: a bomb built to hurt troops
  and vehicles with flying bits, not one built to smash buildings.'
examples:
- An antipersonnel bomb leaves small fragments spread over a wide area.
- The antipersonnel bomb is meant to wound soldiers, not to destroy tanks.
