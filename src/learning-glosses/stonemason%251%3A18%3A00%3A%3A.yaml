simpleMeaning: a skilled worker who cuts and builds with stone or brick
scope: A worker who cuts and builds with stone or brick, not a worker who mainly works with wood or metal.
examples:
- The stonemason cut the block to fit the wall.
- A stonemason built the stone steps by hand.
