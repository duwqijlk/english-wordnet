simpleMeaning: The quality of a person who will not take a bold step for lack of nerve
scope: 'Also called faintness: the quality of a person who will not take a bold step for lack of nerve,
  not a short spell of feeling weak or dizzy.'
examples:
- His faintheartedness kept him from asking for the job.
- The faintheartedness of the committee showed in its slow decisions.
