simpleMeaning: a place made for putting things away and keeping them safe
scope: A place made for putting things away and keeping them safe, also called deposit, depositary or
  repository, and not a bank or a shop that sells things.
examples:
- The library keeps spare copies in a depository across town.
- Old newspapers are stored in a depository run by the state.
