simpleMeaning: a heavy grey rock-like stuff that holds copper and is dug up to get copper from it
scope: 'Also called copper glance: a heavy grey mineral that gives copper, not a blue copper mineral and
  not copper metal itself.'
examples:
- The chalcocite in his hand was heavy and dull grey.
- Chalcocite is dug from deep pits and sent off to get the copper out of it.
