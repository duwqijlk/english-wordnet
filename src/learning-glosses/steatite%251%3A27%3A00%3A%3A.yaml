simpleMeaning: A soft, heavy, closely packed kind of talc, a soft mineral that feels like soap, used to
  make fireplaces, table tops, and things made to look nice
scope: A soft, heavy, closely packed kind of talc, a soft mineral that feels like soap, also called soapstone,
  soap-rock, or soaprock; not chalk and not marble.
examples:
- The craftsman carved the steatite into a small bowl.
- Steatite feels like soap and is used for tabletops.
