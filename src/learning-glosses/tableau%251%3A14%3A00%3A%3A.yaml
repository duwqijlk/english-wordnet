simpleMeaning: a group of people placed in a pleasing way, as if they were in a picture
scope: A group of people set out like a picture, not a single person on their own and not the picture
  itself.
examples:
- The dancers ended the show in a beautiful tableau.
- At the end, the actors held a still tableau for the crowd.
