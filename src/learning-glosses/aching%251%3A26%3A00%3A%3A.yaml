simpleMeaning: a pain that is not sharp, lasts a long time, and is usually fairly strong
scope: 'Also called ache: a long, not sharp pain that is usually fairly strong, not the word that describes
  a body part that hurts.'
examples:
- The aching in his back lasted all day.
- She could not sleep because of the aching in her leg.
