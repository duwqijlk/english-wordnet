simpleMeaning: Any substance that makes another substance less pure or less good at its job.
scope: Any substance that makes another substance less pure or less good, also called an adulterant; not
  the person who does the mixing and not a substance that makes things better.
examples:
- The miller had to take the adulterator out of the flour before use.
- Chalk is a common adulterator in cheap flour.
