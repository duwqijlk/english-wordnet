simpleMeaning: to add this spice to something to give it flavor
scope: This is the verb for adding the spice to food, not the spice itself, not the fresh root, and not
  the orange-brown color.
examples:
- Ginger the soup lightly before you serve it.
- She gingered the tea to give it a warmer taste.
