simpleMeaning: A liquid that can take other things into itself, so they mix in fully and are no longer
  seen as separate
scope: This is a liquid for mixing other things into itself, also called dissolvent, dissolver, and dissolving
  agent; not a statement that solves a problem.
examples:
- Acetone is a common solvent used to take off nail paint.
- Use a solvent to clean the dried paint from the brush.
