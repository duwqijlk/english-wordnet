simpleMeaning: A thing a climber can make their rope fast to.
scope: A thing a climber can make their rope fast to, not the act of fastening a boat to a post or pin,
  and not the act of winding a rope round a thing or a person to make it fast.
examples:
- The climber clipped the rope to a solid belay before resting.
- They found a belay in a crack and made the rope fast.
