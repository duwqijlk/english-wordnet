simpleMeaning: the state of being taken over by large numbers of parasites (small living things that live
  and feed on other living things)
scope: This is being taken over by many small living things that live and feed on other living things,
  not an attack by soldiers and not just one such thing.
examples:
- An infestation of lice made the children scratch their heads all day.
- The house had a serious infestation of fleas from the dog.
