simpleMeaning: Before a program can run, a compiler, interpreter, or assembler must change these program
  instructions, written as plain text, into the form one computer can run
scope: A compiler, an interpreter, or an assembler turns this into the form one computer can run; it is
  not the finished form itself.
examples:
- The source code is written as plain text.
- A compiler changes the source code into the form one computer can run.
