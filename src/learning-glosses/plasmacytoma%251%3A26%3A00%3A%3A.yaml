simpleMeaning: A growth, most often in the soft stuff inside the bones, made of the white blood cells
  that make the stuff that fights sickness
scope: A growth made of one kind of blood cell, not a growth of other cells and not an infection of the
  bone marrow.
examples:
- The scan showed a plasmacytoma in the bone marrow.
- A plasmacytoma is a growth of blood cells, usually found in bone marrow.
