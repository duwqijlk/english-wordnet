simpleMeaning: a sleep state that comes round again, with no quick shifts of the organs of sight and no
  dreams, making up about three quarters of a normal night's sleep
scope: A sleep state with no quick shifts of the organs of sight and no dreams; also called nonrapid eye
  movement sleep and orthodox sleep, not the sleep state with quick shifts and dreams and not being awake.
examples:
- Most of the night is spent in nonrapid eye movement, with no dreams.
- Nonrapid eye movement takes up about three quarters of normal sleep.
