simpleMeaning: 'The nearest point in a path round a body, in a path round the Earth: the point where a
  moon or craft is nearest to the Earth.'
scope: The nearest point of a path round the Earth, where a moon or craft is nearest to the Earth, not
  the farthest point of the path and not a point on the ground.
examples:
- The moon reaches perigee once each month.
- At perigee the craft flew low over the Earth.
