simpleMeaning: This is the part of a gun that you hold, the end that rests against your shoulder, or a
  support part on a larger gun.
scope: It is a part of a gun, not a share of ownership in a company or an expression worn out by overuse.
examples:
- He rested the rifle's stock against his shoulder.
- The wooden stock was smooth from years of use.
