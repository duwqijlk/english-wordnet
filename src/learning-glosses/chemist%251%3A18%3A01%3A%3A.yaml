simpleMeaning: a person whose work is health care, trained to make and give out medicines
scope: A person who makes and gives out medicines, also called a pharmacist, an apothecary, or a druggist;
  not a scientist who studies chemistry.
examples:
- The chemist gave me the medicine the doctor had ordered for me.
- She took the paper from the doctor to the chemist to get her pills.
