simpleMeaning: to walk with a crowd in public to protest something or to take part in a public display
  of shared feeling
scope: This sense is not simply walking somewhere, and not making someone else walk in step.
examples:
- Thousands marched through the capital to protest against the new law.
- Students marched outside the university, demanding that fees be cut.
