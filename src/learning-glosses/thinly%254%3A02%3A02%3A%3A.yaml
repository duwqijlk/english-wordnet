simpleMeaning: in a way that is spread out over a wide area, with only a few in each place
scope: This is about how widely things are spread over an area; it is not about cutting something into
  thin pieces, and not about hiding a feeling only a little.
examples:
- Wild flowers grew thinly over the whole mountainside.
- People live thinly in this wide dry area, with only a few homes in each part.
