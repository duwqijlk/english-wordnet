simpleMeaning: a formal speech or piece of writing that says good things about a person or thing
scope: Paean, panegyric and pean are other names for this sense; this is formal praise in speech or writing
  in general, not only praise for a person who has died.
examples:
- His speech was an eulogy to hard work and honesty.
- She wrote a long eulogy in praise of the city she loved.
