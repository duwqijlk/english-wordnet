senseId: 'range_of_a_function%1:14:00::'
synsetId: 08016746-n
simpleMeaning: In mathematics, all the numbers that come out when a rule is used on the numbers it takes
  in
scope: Also called image and range, this is all the outputs a rule can give, not the inputs it takes and
  not one single output.
examples:
- The range of a function tells us which numbers can come out of it.
- The range of a function that squares a number is all numbers that are zero or more.
