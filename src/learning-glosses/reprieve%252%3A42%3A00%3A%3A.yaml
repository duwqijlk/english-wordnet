simpleMeaning: to put off the punishment of a person found guilty of a crime, such as an execution, to
  a later time
scope: To put off the punishment of a person found guilty of a crime to a later time; respite is another
  name for this sense, not the paper that grants the delay, and not a short break from harm.
examples:
- The governor reprieved the prisoner the night before his execution.
- She hoped the court would reprieve her brother.
