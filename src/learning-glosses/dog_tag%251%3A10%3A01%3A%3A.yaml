simpleMeaning: a flat piece of metal worn on a collar, marked with a number that shows the animal is on
  record
scope: A flat piece of metal on a collar with a number on it, and not the metal tag a soldier wears on
  a chain round the neck.
examples:
- The dog tag on his collar showed his number.
- She read the number on the dog tag before she called the owner.
