simpleMeaning: The act of making others think your cards are strong in poker, by a false show of sureness.
scope: Bluffing in poker by a false show of sureness; bluff is another name for this sense, not a real
  strong hand and not a lie told outside a game.
examples:
- His four flush fooled no one at the table.
- She tried a four flush and lost all her chips.
