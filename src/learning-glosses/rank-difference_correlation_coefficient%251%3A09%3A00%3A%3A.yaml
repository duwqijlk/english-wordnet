simpleMeaning: This number shows how closely two sets of marks move together, worked out by putting each
  set in order first, the way most often used.
scope: It is also called a rank-difference correlation, a rank-order correlation, or a rank-order correlation
  coefficient, and it is the number most often used to show how closely two sets of marks move together.
examples:
- The rank-difference correlation coefficient was close to one.
- They worked out the rank-difference correlation coefficient for the two tests.
