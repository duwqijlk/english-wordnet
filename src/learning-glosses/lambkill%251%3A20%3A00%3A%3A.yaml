simpleMeaning: Young farm animals are poisoned by this small North American bush, like mountain laurel
  but with narrower leaves and small red blooms.
scope: This bush is also called pig laurel and sheep laurel, and it poisons young farm animals.
examples:
- Lambkill poisons young farm animals.
- The lambkill bore small red blooms.
