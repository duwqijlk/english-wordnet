simpleMeaning: a person who tries to get other people to believe in a certain faith or set of ideas
scope: A person who tries to win others over to a faith or set of ideas, not a person sent abroad on a
  mission and not a priest who leads a church.
examples:
- The missionary spent years trying to win new followers.
- The missionary tried to get the villagers to follow her faith.
