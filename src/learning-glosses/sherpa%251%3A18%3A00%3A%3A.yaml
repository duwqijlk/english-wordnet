simpleMeaning: A person of the mountain people who live in Nepal and Tibet, known for skill in climbing
  high mountains
scope: A person of the mountain people of Nepal and Tibet, known for skill in climbing high mountains;
  not a person of another mountain people, and not a climber of low hills.
examples:
- Our Sherpa led us up the steep path.
- The Sherpa carried our bags to the high camp.
