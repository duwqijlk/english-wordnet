simpleMeaning: A person in a job who pushes their own rise at work by any means, often at the cost of
  acting with honesty.
scope: For a person who puts promotion before honesty, taking credit for others' work.
examples:
- The careerist took credit for other people's work.
- As a careerist, they put promotion before honesty.
