simpleMeaning: Stay on or below the surface of a liquid without going to the bottom.
scope: Staying on or below a liquid's surface without sinking, also called swim, not a thing that floats
  on water, a fish's air pouch, or proposing an idea to see how people react.
examples:
- Leaves float on the pond until they slowly waterlog and sink.
- The empty bottle will float even in rough water.
