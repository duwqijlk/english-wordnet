simpleMeaning: With hanging green flower heads and smooth stems and leaves you can almost see through,
  this plant belongs to the group Pilea.
scope: This plant is also called clearweed and richweed, and it is not one of the other plants called
  dead nettle.
examples:
- This dead nettle has hanging green flower heads and smooth stems.
- The dead nettle's leaves are smooth and you can almost see through them.
