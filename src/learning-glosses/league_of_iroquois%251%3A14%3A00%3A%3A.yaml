simpleMeaning: A group of tribes, first the Mohawk, Oneida, Onondaga, Cayuga and Seneca, the Five Nations,
  joined after 1722 by the Tuscarora, the Six Nations.
scope: 'Also called the Five Nations, the Six Nations and the Iroquois League: a union of tribes, first
  five nations and then six after the Tuscarora joined in 1722.'
examples:
- The League of Iroquois brought the Mohawk, Oneida and other tribes together.
- After 1722 the Tuscarora joined the League of Iroquois.
