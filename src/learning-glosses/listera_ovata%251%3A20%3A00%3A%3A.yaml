simpleMeaning: An orchid with a pair of egg-shaped leaves and a long thin cluster of green flowers sometimes
  touched with red-brown, from Europe to central Asia.
scope: 'Also called twayblade: an orchid with a pair of egg-shaped leaves and a long thin cluster of green
  flowers, not an orchid with one leaf.'
examples:
- Listera ovata grew in the damp wood, its green flowers in a long thin cluster.
- We found Listera ovata with a pair of egg-shaped leaves.
