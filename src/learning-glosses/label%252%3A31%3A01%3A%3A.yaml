simpleMeaning: In chemistry, to mark a mix or a tiny bit of matter so it stands out, by putting in an
  atom that has been marked
scope: In chemistry, marking a mix or a bit of matter with a marked atom, not marking single atoms to
  follow them and not putting a tag on a thing.
examples:
- They labelled the molecule so they could tell it apart in the test.
- The lab labelled the mix by adding a marked atom.
