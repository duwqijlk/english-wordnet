simpleMeaning: a big fish of the Pacific, much liked as food, whose grown fish die after they lay eggs
scope: 'Also called chinook, chinook salmon, and king salmon: a big Pacific fish eaten as food, not a
  small river trout and not a farmed Atlantic fish.'
examples:
- Fishermen caught a quinnat salmon nearly a metre long.
- The quinnat salmon swims upriver to lay its eggs and then dies.
