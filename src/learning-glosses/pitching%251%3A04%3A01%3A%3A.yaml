simpleMeaning: when a ship or another thing that carries people rises and falls all at once
scope: A sudden up-and-down move of a ship or another thing that carries people; pitch and lurch are other
  names for this sense, and it is not the thrower's job in baseball.
examples:
- The pitching and tossing of the boat made us feel sick.
- The pitching of the ship grew worse as the storm rose.
