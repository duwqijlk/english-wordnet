simpleMeaning: An infection caught from tiny living things passed to people by cats that carry them, which
  can badly harm the unborn child if a pregnant woman catches it.
scope: An infection passed to people by cats, which can badly harm the unborn child of a pregnant woman.
examples:
- Toxoplasmosis can pass to people from infected cats.
- The doctor warned that toxoplasmosis could harm the unborn child.
