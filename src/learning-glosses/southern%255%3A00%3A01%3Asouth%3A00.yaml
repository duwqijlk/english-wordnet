simpleMeaning: Coming from the south, a word used to describe winds.
scope: This describes air or wind that blows out of the south, not something located in the south and
  not something typical of the American South.
examples:
- A hot southern wind blew across the desert all afternoon.
- Icy southern winds kept the harbor closed for three days.
