simpleMeaning: People share thoughts and help each other in turn, each one getting something back
scope: Sharing and swapping in turn between people, also called interchange and reciprocation, not one
  person talking alone and not a one-way gift.
examples:
- Good talks need give-and-take from both sides.
- The give-and-take between the two friends kept the plan moving.
