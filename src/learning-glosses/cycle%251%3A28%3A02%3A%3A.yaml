simpleMeaning: the unit for how often something happens again and again; one hertz, named for Heinrich
  Rudolph Hertz, is for a thing that happens once in one second
scope: This is a unit for how often something happens again and again. It is not one full time through
  a repeated thing, not a length of time for a set of events, and not a bike with two wheels.
examples:
- The machine works at sixty cycles per second.
- This sound wave has a rate of a thousand cycles each second.
