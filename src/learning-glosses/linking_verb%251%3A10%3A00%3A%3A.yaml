senseId: 'linking_verb%1:10:00::'
synsetId: 06484495-n
simpleMeaning: A joining word, such as 'be' or 'become', that joins the subject of a sentence to what
  is said about it
scope: Copula and copulative are other names for this joining word that joins the subject of a sentence
  to what is said about it; it is not an action word and not a helping word used with a main verb.
examples:
- In 'She is happy', 'is' is a linking verb.
- The linking verb joins the subject to the words that describe it.
