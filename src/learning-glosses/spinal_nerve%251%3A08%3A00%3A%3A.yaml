simpleMeaning: a nerve cord joined to the cord down the back by two roots, one in front and one behind,
  one of 31 pairs leaving each side of the cord
scope: Also called nervus spinalis; not a nerve of the brain, and not a single cord but one of a pair.
examples:
- The spinal nerve leaves the cord between two bones of the spine.
- Damage to a spinal nerve can numb the arm or leg it serves.
