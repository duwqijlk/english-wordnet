simpleMeaning: A secret place to hide, most of the time far from other people and used by people who break
  the law
scope: A secret hiding place, not a room in a house where people sit and rest, and not an animal's home.
examples:
- The thieves hid the stolen gold in their den.
- The police found the outlaws' den deep in the woods.
