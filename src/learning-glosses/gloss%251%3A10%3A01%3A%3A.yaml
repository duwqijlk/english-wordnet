simpleMeaning: a list in A to Z order of the special words used in one field of study, often put at the
  end of a text on that field
scope: This is a list in A to Z order of the special words of one field of study, not one short note about
  a hard word and not a false front put on to mislead.
examples:
- The gloss at the end of the book lists all the special words used in it.
- Students turned to the gloss to find what the terms meant.
