simpleMeaning: In the body, a flat round pad of gristle that cushions the ends of bones where they meet
  in a joint.
scope: Also called semilunar cartilage; in the body, a pad of gristle cushioning the ends of bones in
  a joint, not the curved top of a still liquid in an upright tube, and not the lens hollow on one side
  and rounded on the other.
examples:
- He tore the meniscus in his knee and could not bend the joint.
- The meniscus cushions the bones where they meet in the knee.
