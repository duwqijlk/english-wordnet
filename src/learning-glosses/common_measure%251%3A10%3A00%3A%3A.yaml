simpleMeaning: the beat most often used in a ballad, with a short beat followed by a long beat in each
  line
scope: This is the beat most often used in a ballad; common meter is another name for this sense, and
  it is not a number that divides other numbers.
examples:
- The hymn was written in common measure, four lines to a verse.
- Many old ballads use common measure, with a short beat and then a long one.
