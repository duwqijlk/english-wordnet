simpleMeaning: An officer holding a commission in the Army, Air Force or Marines, ranked between the lowest
  officer rank and a captain.
scope: An officer in the Army, Air Force or Marines, ranked between the lowest officer rank and a captain;
  1st lieutenant is another name for this rank, not a captain and not an officer of the lowest rank.
examples:
- The first lieutenant led the platoon across the field.
- She was made a first lieutenant after two years of service.
