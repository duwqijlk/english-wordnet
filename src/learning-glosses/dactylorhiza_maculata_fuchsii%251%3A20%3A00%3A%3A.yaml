simpleMeaning: A European orchid with long leaves spotted purple and flowers from pink to white or pale
  purple, spotted or lined deep red or purple.
scope: Also called a common spotted orchid or Dactylorhiza fuchsii; a European orchid with purple-spotted
  leaves and pink to white or pale purple flowers, kin to other spotted orchids.
examples:
- Dactylorhiza maculata fuchsii blooms in the meadow, its leaves spotted purple.
- The Dactylorhiza maculata fuchsii flowers are pink to white, spotted deep red.
