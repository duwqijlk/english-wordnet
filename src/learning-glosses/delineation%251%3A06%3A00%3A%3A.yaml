simpleMeaning: A drawing that shows the outlines of shapes and things.
scope: A drawing that shows the outlines of shapes and things; also called depiction or limning; not showing
  a thing by drawing or painting or the like, nor words that paint a clear, lively picture of a thing.
examples:
- The delineation showed the house in fine lines.
- Their delineation hung beside the map.
