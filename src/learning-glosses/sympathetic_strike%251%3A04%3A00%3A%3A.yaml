simpleMeaning: A stoppage of work in support of other workers who have stopped work, not because of a
  direct complaint against one's own employer.
scope: This is a stoppage of work to back other workers, also called sympathy strike, and not a walkout
  over one's own pay or a lockout.
examples:
- The dockers held a sympathetic strike for the miners.
- A sympathetic strike shut the port for a day.
