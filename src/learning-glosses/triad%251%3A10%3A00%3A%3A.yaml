simpleMeaning: a major or minor chord (three notes played together as one sound in music) made of a main
  note and its third and fifth notes
scope: This is a music sense about three notes played together, not a group of three people or things
  and not a set of three related ideas.
examples:
- The song ends with a simple triad played on the piano.
- She learned to play a major triad with her right hand.
