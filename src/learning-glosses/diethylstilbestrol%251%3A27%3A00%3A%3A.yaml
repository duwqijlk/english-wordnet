simpleMeaning: a strong chemical that acts like a female sex hormone, used as a drug and in food for farm
  animals and birds
scope: A strong chemical that acts like a female sex hormone, also called diethylstilboestrol, and not
  a drug that stops pain and not food that only feeds animals.
examples:
- The doctor gave her diethylstilbestrol as part of her treatment.
- Farmers once mixed diethylstilbestrol into feed for cattle.
