simpleMeaning: A tall tree that keeps its green needles all year, with a wide round top and needles that
  grow in rings like open shades at the ends of twigs.
scope: 'Also called Sciadopitys verticillata: a tall tree that keeps its green needles all year, with
  a wide round top and needles that grow in rings like open shades at the ends of twigs; other tall green
  trees have needles that grow singly or crowns of other shapes.'
examples:
- The Japanese umbrella pine has needles that grow in rings like open shades.
- We planted a Japanese umbrella pine for its wide round top.
