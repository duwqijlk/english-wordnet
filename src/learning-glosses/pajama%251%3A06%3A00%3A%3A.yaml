  trousers'
scope: 'Also called pyjama: loose clothes for sleeping, not the single pair of loose trousers worn as
  day clothes in some Asian countries.'
examples:
- She put on her pajamas and went to bed.
- His blue pajamas have a jacket top and long trousers.
