simpleMeaning: A member of an Algonquian people who once lived in New Jersey and New York and parts of
  Delaware and Pennsylvania
scope: A member of an Algonquian people of the east, also called Delaware; not a member of another Algonquian
  people.
examples:
- The Lenape lived along the rivers of New Jersey long ago.
- A Lenape elder told stories of his people.
