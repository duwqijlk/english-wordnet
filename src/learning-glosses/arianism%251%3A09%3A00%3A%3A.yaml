simpleMeaning: A teaching held to be wrong, taught by Arius, that said the Father stands far above the
  Son.
scope: A doctrine named for Arius, whose central claim is the radical primacy of the Father over the Son,
  and which is counted a heresy.
examples:
- Arianism taught that the Father came first.
- The bishop wrote against Arianism in his letter.
