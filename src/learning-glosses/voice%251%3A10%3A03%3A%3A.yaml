senseId: 'voice%1:10:03::'
synsetId: 07292402-n
simpleMeaning: A thing, such as a publication or an art form, that works like speech in giving people
  a way to express ideas and feelings.
scope: This is a channel or outlet itself, not the act of putting something into words, and not a person
  who speaks for others.
examples:
- The magazine became an important voice for reform, printing stories no other outlet dared to.
- Street art gave the neighborhood a voice when official newspapers ignored it.
