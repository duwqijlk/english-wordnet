simpleMeaning: A separation made in thought that keeps two things or ideas clearly apart.
scope: This is an abstract separation between ideas, not a physical crease, a printed mark, or a geometric
  figure.
examples:
- The film blurs the line between reality and fantasy.
- There is a fine line between confidence and arrogance.
