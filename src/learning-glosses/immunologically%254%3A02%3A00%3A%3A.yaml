simpleMeaning: In terms of how the body fights off sickness and disease.
scope: In terms of how the body fights off sickness and disease, not in terms of how the body digests
  food and not in terms of how the body moves.
examples:
- The two drugs work immunologically in quite different ways.
- Immunologically, the patient showed a strong response to the treatment.
