simpleMeaning: Money or aid from an outsider with no stake in a case keeps one side going, blocking justice,
  stirring needless cases, or upsetting the peace of the community
scope: This is also called maintenance, and it is help from an outsider with no stake in a case that blocks
  justice, stirs needless cases, or upsets the peace of the community.
examples:
- Unlike champerty, criminal maintenance does not necessarily involve personal profit.
- He was charged with criminal maintenance for paying a stranger's court costs.
