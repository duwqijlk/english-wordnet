simpleMeaning: In biology, a living thing that has traits that come from a change in its chromosomes,
  the parts of a cell that carry what it gets from its parents
scope: Also called sport, variation, and mutation. This is a living thing with such a change, not the
  word for describing something that tends to change in this way.
examples:
- The plant was a mutant with white leaves instead of green ones.
- They found a mutant plant with leaves of a different shape.
