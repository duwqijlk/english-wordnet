simpleMeaning: In chemistry, the account that all signs in a liquid are weak acids or weak bases whose
  charged form shows a colour unlike the one before it breaks apart.
scope: In chemistry, this account tells weak acids and weak bases apart by the colour their charged form
  shows.
examples:
- The theory of indicators helped her see why the liquid turned pink.
- He learned the theory of indicators before he tried the test in class.
