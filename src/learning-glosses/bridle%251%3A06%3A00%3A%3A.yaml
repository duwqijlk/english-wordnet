senseId: 'bridle%1:06:00::'
synsetId: 02903443-n
simpleMeaning: the straps and metal mouthpiece put on a horse's head, with reins, so the rider or driver
  can steer and control it
scope: The headgear on a horse, not the act of holding back power and not a horse's response to the reins.
examples:
- She fitted the bridle over the horse's head before the ride.
- The bridle gave the rider control of the horse.
