simpleMeaning: A mark of counting for nothing, mean and small.
scope: This sense is also called pettiness, triviality, and puniness, for a mark of counting for nothing,
  mean and small, where puniness is the mark of being small and mean, or slight.
examples:
- Slightness is a mark of counting for nothing.
- Slightness means mean and small.
