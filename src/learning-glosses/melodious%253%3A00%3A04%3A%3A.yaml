simpleMeaning: having a sound like music, especially a pleasing tune that is nice to hear
scope: 'Also called tuneful: having a sound like music, especially a nice tune. It is not just any loud
  or high sound, and it is not a song itself.'
examples:
- She sang in a soft, melodious voice that everyone liked to hear.
- The bird gave a melodious call from the tree in the morning.
