simpleMeaning: Used to grow new trees on, these common trees bear fruit that is sour or sharp in taste.
scope: These common trees bear sour fruit and serve as grafting stock, and bigarade, bitter orange tree,
  marmalade orange and sour orange are other names for this sense.
examples:
- The bitter orange bears fruit too sour to eat fresh.
- New trees are grafted onto bitter orange stock.
