simpleMeaning: Grey when young and black when old, the spore-bearing top of this pitted mushroom joins
  the stem with almost no free rim round it.
scope: People also call it black morel and conic morel, a pitted mushroom whose top is grey when young
  and black when old.
examples:
- The narrowhead morel had a pitted top.
- The narrowhead morel turned black as it grew old.
