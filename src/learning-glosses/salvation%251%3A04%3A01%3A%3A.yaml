simpleMeaning: something that keeps a person or thing safe from harm or from a bad situation
scope: Something that keeps a person or thing safe from harm, not the act of saving itself and not, in
  religion, being saved from sin and evil.
examples:
- Tourism was their economic salvation.
- For the small town, the new factory was its salvation.
