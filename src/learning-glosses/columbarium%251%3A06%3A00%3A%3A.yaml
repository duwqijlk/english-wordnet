simpleMeaning: a place under the ground, or another built place, with small hollow places in its walls
  to hold pots of ash from burned bodies
scope: A built place with small hollow places in its walls for pots of ash, not one single hollow place
  and not a grave in the earth.
examples:
- The columbarium held rows of urns in its walls.
- Families placed the urns in the columbarium.
