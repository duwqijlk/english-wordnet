senseId: 'floater%1:21:00::'
synsetId: 13436554-n
simpleMeaning: A paper that stands for a loan whose interest rate moves up and down with another rate,
  such as the rate paid on government bills.
scope: A loan paper with a changing interest rate, not an insurance policy for things that can be moved,
  not spots before the eyes, not a voter who votes in more than one place, not a thing that floats, not
  a wanderer, and not a swimmer who floats.
examples:
- The bank sold the floater at a low rate.
- Investors bought the floater because its rate moved with the market.
