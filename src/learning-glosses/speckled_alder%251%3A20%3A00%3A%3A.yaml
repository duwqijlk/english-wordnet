simpleMeaning: Its shoots are dotted with soft fine hairs the colour of rust, on a common bush of Canada
  and the north-east of the United States.
scope: Among bushes of Canada and the north-east of the United States, the common one whose shoots are
  dotted with soft fine hairs the colour of rust.
examples:
- The shoots of the speckled alder were dotted with rust-coloured hairs.
- A speckled alder stood among the other bushes.
