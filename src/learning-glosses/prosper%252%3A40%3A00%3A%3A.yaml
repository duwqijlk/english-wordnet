simpleMeaning: to keep moving forward at a steady pace, and to be at the best point in your work or to
  reach a point of great importance in history
scope: To keep moving forward well, and to be at the best point in your work or of great importance in
  history; thrive and flourish are other names for this sense, and it is not simply growing rich.
examples:
- The small shop began to prosper after a year.
- Under her rule, the country prospered and grew strong.
