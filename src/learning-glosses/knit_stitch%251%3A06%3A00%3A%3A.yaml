simpleMeaning: A basic loop of yarn made by putting the needle through the front of the loop from the
  left side.
scope: A basic loop of yarn made by putting the needle through the front from the left; plain, knit and
  plain stitch are other names for this sense, not a loop made from the back and not a fancy pattern.
examples:
- She used a knit stitch for the whole scarf.
- The knit stitch is the first one every beginner learns.
