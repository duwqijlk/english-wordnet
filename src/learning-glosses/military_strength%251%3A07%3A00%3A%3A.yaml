simpleMeaning: In a war, how well a fighting force fights depends on the troops and the arms and supplies
  it has
scope: 'Also called military capability, military posture, posture and strength: how well a fighting force
  can fight a war, judged by its troops and its arms and supplies, not the study of war and not a single
  battle.'
examples:
- The country's military strength grew as it bought new tanks.
- We faced an army of great military strength.
