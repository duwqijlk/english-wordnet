simpleMeaning: To show that you are unhappy or that you find fault with something
scope: This is showing unhappiness or fault-finding, not making a low dull sound and not a complaint said
  in a low voice.
examples:
- We grumbled about the extra work load.
- He grumbled about anything he thought was wrong.
