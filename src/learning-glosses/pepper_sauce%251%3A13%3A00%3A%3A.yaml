simpleMeaning: Made with the spiced liquid that deer meat was soaked in, fried vegetables, and small bits
  of meat, this brown liquid, full of hot spice, is served with deer meat.
scope: Also called poivrade, this brown liquid belongs with deer meat, not with other meats.
examples:
- The venison was served with pepper sauce.
- A spoonful of pepper sauce went on the venison.
