simpleMeaning: a small flat cap of plastic, metal, or wood, set over gaps and over screw heads that show
  in furniture
scope: A small flat cap of plastic, metal, or wood, set over gaps and over screw heads that show in furniture;
  plug button is another name for this sense, not a cork and not a screw.
examples:
- He pressed a hole plug over the screw in the table leg.
- The hole plug hid the screw head in the chair arm.
