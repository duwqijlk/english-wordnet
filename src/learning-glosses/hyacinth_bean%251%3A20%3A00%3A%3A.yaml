synsetId: 12558074-n
simpleMeaning: A perennial climber of the Old World tropics with fragrant purple blooms and maroon pods
  of edible seeds, grown across South Asia as food and ornament, sometimes classed in Dolichos.
scope: This is the whole climbing plant, not the pods or seeds sold as a vegetable, and not the unrelated
  hyacinth flower.
examples:
- The hyacinth bean climbed the fence and bore maroon pods by late summer.
- Indian gardeners grow hyacinth bean for both its looks and its edible seeds.
