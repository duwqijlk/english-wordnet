simpleMeaning: A public celebration in France, set aside by law, for the storming of the Paris prison
  in 1789
scope: This is the French public holiday marking the storming of the Paris prison in 1789; 14 July is
  another name for it, and it is not the prison itself.
examples:
- Bastille Day is marked on 14 July each year.
- Crowds gather in Paris on Bastille Day.
