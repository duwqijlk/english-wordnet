simpleMeaning: said of a hollow place or room in the body, most often one of the upper rooms of the heart
scope: Said of a hollow place in the body, most often an upper room of the heart, not of the lower rooms
  of the heart and not of a hollow place outside the body.
examples:
- The atrial wall separates the two upper chambers of the heart.
- Atrial pressure was measured during the test.
