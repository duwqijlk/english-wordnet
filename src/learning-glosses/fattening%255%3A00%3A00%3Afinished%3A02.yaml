simpleMeaning: being fed to grow fat before being killed for meat, or used to help do that
scope: This is about farm animals fed before being killed for meat, and the pens or other things used
  for that work, not about food that makes people gain weight.
examples:
- The fattening hogs ate well in the last weeks before they were sold.
- The farmer kept the pigs in fattening pens near the barn.
