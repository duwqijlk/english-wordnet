simpleMeaning: In grammar, a word such as 'a', 'an', or 'the' that works as a determiner and can show
  how specific the reference of a noun phrase is.
scope: This is the grammatical determiner, not a piece of nonfiction prose forming part of a publication,
  not one item of a class of goods, not a numbered section of a legal document, and not the verb meaning
  to bind someone by a training contract.
examples:
- In 'the red car', 'the' is the article.
- She forgot the article before 'dog', so the sentence sounded wrong.
