scope: Also called yellow henbane; a plant of sea beaches from Virginia to South America, set apart from
  other beach plants by its green-yellow flowers and its orange or yellow berries.
examples:
- Physalis viscosa grew on the sand just above the tide line.
- Orange berries dotted the Physalis viscosa along the beach.
