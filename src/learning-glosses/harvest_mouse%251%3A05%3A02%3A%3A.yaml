simpleMeaning: Several kinds of small grey creature live in the grain fields of the New World, wheat or
  corn among the crops there.
scope: This is one of several kinds of small grey New World mouse that lives in grain fields, not the
  reddish-brown Eurasian mouse that lives in cornfields.
examples:
- A harvest mouse slipped through the grain field.
- We saw a harvest mouse in the wheat field.
