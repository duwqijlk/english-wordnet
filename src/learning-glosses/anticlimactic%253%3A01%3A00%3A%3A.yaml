schema: oewn-learning-gloss-v2
senseId: 'anticlimactic%3:01:00::'
synsetId: 02640076-a
simpleMeaning: about a sudden change from a grand or strong style to one that looks silly
scope: About a sudden drop in style from grand to silly, not about a weak event that comes after the high
  point of a story.
examples:
- The speech turned anticlimactic when its grand opening gave way to a silly list of small jokes.
- His anticlimactic writing moved in one line from great war heroes to a clown falling over.
