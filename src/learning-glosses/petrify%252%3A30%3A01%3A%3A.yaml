simpleMeaning: To make someone or something go stiff and still with fear, too shocked to move or think,
  as if turned to stone
scope: To freeze someone or something with fear, not to turn a thing into real stone and not to calm a
  person down.
examples:
- Fear petrified her, and she could not move.
- The sudden noise petrified the child.
