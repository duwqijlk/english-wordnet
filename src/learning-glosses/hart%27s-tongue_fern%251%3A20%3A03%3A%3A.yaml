simpleMeaning: a common fern growing on trees, sometimes on the ground, with pale yellow-green leaves
  shaped like straps, found from Florida to Uruguay through the West Indies and Mexico
scope: 'Also called cow-tongue fern: a common fern with pale yellow-green strap-like leaves that grows
  on trees or on the ground, not the tropical American fern with leathery leaves.'
examples:
- The hart's-tongue fern grows on the trunk of a tree in the shade.
- We saw a hart's-tongue fern with pale yellow-green leaves near the path.
