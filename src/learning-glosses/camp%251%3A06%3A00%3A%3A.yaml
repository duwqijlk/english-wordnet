simpleMeaning: A place where soldiers live for a time in shelters put up by the military.
scope: Not 'a holiday site for travelers or children,' not 'a prison or a shelter for displaced people,'
  not 'a group of people who share a purpose,' not the adjective meaning 'deliberately vulgar or sentimental,'
  and not the verb senses such as 'to live in a tent.'
examples:
- The soldiers marched back to camp before nightfall.
- Rows of tents stood in the army camp outside the town.
