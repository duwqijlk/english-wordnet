simpleMeaning: a short, thick stick for hitting, carried most of all by police officers
scope: Also called baton, billy and truncheon, this is a short thick stick police carry to hit with; it
  is not a weapon with a blade and not a gun.
examples:
- The officer carried a nightstick on his belt.
- He raised his nightstick to stop the man from running.
