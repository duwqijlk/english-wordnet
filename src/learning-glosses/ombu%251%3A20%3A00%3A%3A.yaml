simpleMeaning: a fast-growing tree of South America that stays green all year, with a wide soft trunk
  full of water and dark green oval leaves
scope: A fast-growing tree of South America that stays green all year, with a wide soft trunk full of
  water and dark green oval leaves; bella sombra is another name for this sense, not a tree that loses
  its leaves and not a palm.
examples:
- The ombu shades the yard with its wide trunk.
- An ombu can grow fast in the South American pampas.
