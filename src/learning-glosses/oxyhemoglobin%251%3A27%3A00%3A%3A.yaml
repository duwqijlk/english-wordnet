simpleMeaning: bright red haemoglobin, the part of blood that joins with oxygen from the lungs
scope: Bright red haemoglobin joined with oxygen from the lungs; oxyhaemoglobin is another name for this
  sense, and it is not the dark red blood matter that has given up its oxygen or oxygen on its own.
examples:
- Oxyhemoglobin transports oxygen to the cells of the body.
- Oxyhemoglobin gives blood its bright red colour.
