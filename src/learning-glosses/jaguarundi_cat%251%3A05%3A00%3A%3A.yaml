simpleMeaning: A wild animal of warm parts of the Americas, with a long body and a long tail.
scope: A wild animal of the warm Americas; eyra, jaguarondi and jaguarundi are other names for it, not
  a large hunting animal such as a lion.
examples:
- The jaguarundi cat moved quietly through the dry grass.
- A jaguarundi cat rested in the shade of a tree.
