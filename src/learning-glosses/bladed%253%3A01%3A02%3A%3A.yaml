simpleMeaning: having one or more flat cutting edges, often in a word joined to another word
scope: Having one or more flat cutting edges, often as part of a joined word; not made of thin flat plates
  like a knife edge, and not simply carrying a sword.
examples:
- The bladed grass cut her bare feet.
- A single-bladed leaf fell from the tree.
