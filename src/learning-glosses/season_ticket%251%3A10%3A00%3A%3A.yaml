simpleMeaning: a pass that is good for several trips or a full set of shows, sold for less than the full
  price
scope: A pass good for several trips or a whole set of shows, sold for less; commutation ticket is another
  name for this sense. Not a single ticket and not a pass for one trip.
examples:
- She bought a season ticket for the train to work.
- Our season ticket covers every concert in the series.
