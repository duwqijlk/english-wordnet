senseId: 'systematic_desensitisation%1:04:00::'
synsetId: 00703008-n
simpleMeaning: A way used in deed-cure to treat fears and other deed ills of worry, where the one in care
  meets the feared thing at ease until the worry fades.
scope: This sense is also called desensitisation procedure, desensitisation technique, desensitization
  procedure, desensitization technique, and systematic desensitization.
examples:
- Systematic desensitisation treats fears.
- A systematic desensitisation eased the worry.
