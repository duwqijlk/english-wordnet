simpleMeaning: Flower heads packed tight in bunches at the ends of its branches mark this plant of Europe,
  which lives two years and was brought to North America.
scope: This European plant, now in North America, lives two years and bears flower heads packed tight
  in bunches at the ends of its branches.
examples:
- Welted thistle grew in the open.
- The welted thistle had flower heads in tight bunches.
