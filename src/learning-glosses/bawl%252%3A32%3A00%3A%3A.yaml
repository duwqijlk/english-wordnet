simpleMeaning: to cry out in a loud voice and let the sound go free, without holding any of it back
scope: 'Also called bellow: a loud cry let out freely, not a quiet cry and not a sob.'
examples:
- He bawled for help across the yard.
- She bawled at the children to come inside.
