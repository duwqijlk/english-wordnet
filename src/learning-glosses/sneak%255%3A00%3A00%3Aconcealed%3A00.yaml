simpleMeaning: quiet and careful, and done in secret, with great care not to be seen
scope: This word describes a thing or act that is quiet and secret so that no one sees it; it is not the
  noun for a person who moves about in secret, and not the verb for putting, bringing or taking a thing
  in secret.
examples:
- They made a sneak attack at dawn, before anyone was awake.
- He took a sneak look at the answers when the teacher left the room.
