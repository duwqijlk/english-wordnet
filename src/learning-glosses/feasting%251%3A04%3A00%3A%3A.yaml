simpleMeaning: eating a big, fine meal, often with entertainment going on as well
scope: A grand meal, often with entertainment; not an ordinary meal and not a party with no food.
examples:
- They spent the evening feasting on roast lamb and sweet wine.
- The whole village was feasting after the harvest.
