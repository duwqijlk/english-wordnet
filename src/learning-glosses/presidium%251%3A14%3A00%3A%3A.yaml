simpleMeaning: With all the powers of a bigger law-making group, this small standing group runs things
  in socialist countries and acts for it when it is not meeting
scope: This is a small standing group in socialist countries with all the powers of a bigger law-making
  group, also called praesidium; not the bigger law-making group itself.
examples:
- The presidium met every week to run the country.
- When the assembly was not in session, the presidium acted in its place.
