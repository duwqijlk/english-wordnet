simpleMeaning: Government offices and the firms that work for them get science and technology facts from
  this office in the armed forces department.
scope: This office gives science and technology facts to government offices and the firms that work for
  them; DTIC is another name for this sense, not the whole armed forces department.
examples:
- The Defense Technical Information Center sent the report to the contractor.
- She got the data from the Defense Technical Information Center.
