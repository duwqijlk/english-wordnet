simpleMeaning: A drug that stops some kinds of fits, sold under a trade name
scope: This is a drug that stops some kinds of fits before they happen; valproic acid is another name
  for it, and it is not Dilantin, a drug used to treat epilepsy.
examples:
- The doctor gave her Depokene to stop her fits.
- He takes Depokene each day to prevent seizures.
