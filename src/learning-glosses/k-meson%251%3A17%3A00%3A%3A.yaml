senseId: 'k-meson%1:17:00::'
synsetId: 09346566-n
simpleMeaning: A tiny bit of matter that breaks apart fast, made when bits of matter crash into each other
  at great speed
scope: 'Also called a kaon or a kappa-meson: a tiny bit of matter that falls apart fast after a high-speed
  crash, not a stable bit of matter and not a large piece of matter.'
examples:
- Scientists found a k-meson in the crash of two fast particles.
- A k-meson lives only a short time before it breaks apart.
