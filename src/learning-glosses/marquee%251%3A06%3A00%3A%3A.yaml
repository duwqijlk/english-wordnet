simpleMeaning: a fixed cover over the door of a hotel or similar building
scope: A fixed cover over a hotel door, not a tent and not a sign over a theatre.
examples:
- Guests waited under the marquee out of the rain.
- The hotel's marquee stretched over the front steps.
