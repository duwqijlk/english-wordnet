simpleMeaning: A loose piece of clothing worn over your other clothes to keep them clean and safe
scope: Loose clothing worn over other clothes for protection, not an apron and not a coat worn for warmth.
examples:
- He pulled on his coveralls before painting the ceiling.
- She wore a coverall over her dress while she cleaned the engine.
