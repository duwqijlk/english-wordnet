senseId: 'ordinary_life_insurance%1:21:00::'
synsetId: 13368962-n
simpleMeaning: A plan that pays a set sum when the person named in it dies, with the same yearly cost
  paid each year without change
scope: A set-sum death plan with a fixed yearly cost, not a loan charge and not a health plan.
examples:
- He took out ordinary life insurance to guard his family.
- The ordinary life insurance costs the same each year.
