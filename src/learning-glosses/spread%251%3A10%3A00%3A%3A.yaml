simpleMeaning: The two pages you see together when a book, magazine, or other publication lies open.
scope: This means the open pages of a publication, not the act of something widening out and not a scattered
  arrangement of objects.
examples:
- The recipe ran across a two-page spread in the magazine.
- The photo took up the whole centre spread.
