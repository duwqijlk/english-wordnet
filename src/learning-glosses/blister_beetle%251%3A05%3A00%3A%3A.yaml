simpleMeaning: an insect that gives off a liquid that raises sore bubbles on the skin
scope: 'Also called a meloid: an insect that gives off a liquid that raises sore bubbles on the skin,
  not a biting insect and not a stinging insect.'
examples:
- Do not touch a blister beetle, as the liquid it gives off can raise sore bubbles on your skin.
- The farmer warned us that a blister beetle can raise sore bubbles on the skin.
