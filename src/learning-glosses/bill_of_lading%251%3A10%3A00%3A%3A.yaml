simpleMeaning: a paper given by the carrier to the sender that says the goods have been received and sets
  out the terms of delivery
scope: Also called waybill; a carrier's receipt for goods shipped, not a ticket and not a contract of
  sale.
examples:
- The shipper kept the bill of lading as proof.
- Without a bill of lading the goods could not be claimed.
