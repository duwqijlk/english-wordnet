simpleMeaning: To use clever but false talk that twists what words mean or leaves them unclear, so people
  are led astray
scope: 'Also called twist: to twist what words mean or leave them unclear in order to mislead, not to
  spoil a thing by adding something worse.'
examples:
- He tried to sophisticate the question so no clear answer was possible.
- She would sophisticate every plain statement until no one knew what she meant.
