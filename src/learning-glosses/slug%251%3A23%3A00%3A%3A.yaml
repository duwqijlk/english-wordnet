simpleMeaning: 'A unit of mass: the mass that a push of one pound speeds up by one foot per second, every
  second, about 14.6 kilograms.'
scope: This is a unit of mass in science, not the soft animal, nor a drink of liquor, nor a hard blow,
  nor the boxing blow.
examples:
- One slug is about 14.6 kilograms.
- The slug is a unit of mass used in old books on physics.
