simpleMeaning: a law that stops people from selling drinks with alcohol in them
scope: A law that stops the sale of drinks with alcohol, not the years when such a law was in force in
  the United States and not a simple refusal to approve something.
examples:
- Prohibition made it against the law to sell alcohol in shops and bars.
- Under prohibition, no shop could legally sell wine or beer.
