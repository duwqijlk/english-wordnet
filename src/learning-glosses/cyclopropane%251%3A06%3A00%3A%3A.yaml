simpleMeaning: a gas with no colour that catches fire easily, at times breathed in to put a person to
  sleep for an operation
scope: A gas with no colour that burns easily and can put a person to sleep, not a liquid that puts people
  to sleep and not ordinary air.
examples:
- The doctor gave the patient cyclopropane to breathe before the operation.
- In the past, cyclopropane was breathed in to put patients to sleep during operations.
