simpleMeaning: to throw something with great force, as if it were sent from a strap used to throw stones
scope: To throw something hard; not to hold or carry a hurt arm in a cloth support, and not to move goods
  with straps.
examples:
- The boys sling stones at the old fence across the field.
- He can sling a rock far across the river.
