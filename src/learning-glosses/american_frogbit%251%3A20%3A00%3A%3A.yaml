simpleMeaning: A plant of America with roundish heart-shaped or kidney-shaped leaves, most often rooted
  in the muddy bottoms of ponds and ditches.
scope: A plant of America with roundish heart-shaped or kidney-shaped leaves, also called Limnodium spongia;
  its nearest kin are other water plants with round leaves.
examples:
- American frogbit floated on the pond with roundish leaves.
- We found American frogbit rooted in the muddy bottom of the ditch.
