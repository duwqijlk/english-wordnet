simpleMeaning: a simple book that gives the main teachings of a Christian religion in short form, written
  as questions and answers
scope: A simple teaching book for the Christian faith, set out as questions and answers; it is the book
  itself, not the act of asking someone many questions.
examples:
- The children learned the catechism at Sunday school.
- His catechism lay open on the desk, its questions and answers marked in pencil.
