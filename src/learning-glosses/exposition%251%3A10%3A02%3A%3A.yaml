simpleMeaning: In music, the part of a movement, especially in a sonata, in which the main tunes are heard
  for the first time.
scope: In music, the opening section of a movement where the main themes first appear, not the written
  explanation of a topic and not a public display.
examples:
- The exposition of the symphony states both main themes.
- In the exposition, the violins introduce the first theme.
