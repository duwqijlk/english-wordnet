simpleMeaning: the act of giving in and letting what another person wants stand
scope: 'Also called concession, and another name for it is conceding: the act of giving in, not saying
  in words that you have lost and not being a person who is ready to give in.'
examples:
- Her yielding to their demands ended the long argument.
- After much yielding, the group let his plan stand.
