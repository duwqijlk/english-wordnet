simpleMeaning: A hollow or container in which liquid is held.
scope: A recess or vessel for liquid, as in a pen; it is not the deep shaft dug for water, which is the
  everyday sense.
examples:
- He filled the well of the pen from the bottle.
- The ink well in the desk had dried up years before.
