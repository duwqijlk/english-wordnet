simpleMeaning: a person who has done a crime or has been found guilty of a crime in court
scope: 'Also called criminal, crook, and outlaw: a person who has done a crime or been found guilty in
  court, not a sore swelling at the end of a finger or toe.'
examples:
- The felon was sent to prison for the crime.
- Police are looking for a felon who broke the law.
