simpleMeaning: Tests picked for the person's age, sex, and how well they are come with a full look over
  the whole body
scope: A full look over the whole body, also called a checkup, a medical, a medical checkup, a medical
  exam and a medical examination, not a visit to treat an illness and not a single test.
examples:
- She went for her annual health check at the clinic.
- The health check found nothing wrong with his heart.
