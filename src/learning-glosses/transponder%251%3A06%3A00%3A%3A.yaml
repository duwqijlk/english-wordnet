simpleMeaning: A device run by power that picks up a set signal and sends back a set answer on its own.
scope: An electrical device that takes in one set signal and sends back a set reply on its own.
examples:
- The plane's transponder sent its position to the tower.
- Each car in the race carries a transponder so the timers can track it.
