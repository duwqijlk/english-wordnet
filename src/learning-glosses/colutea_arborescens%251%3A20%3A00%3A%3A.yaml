simpleMeaning: A yellow-flowered European bush grown for its long run of yellow flowers and very swollen
  bladder-like pods, and as food for wild animals.
scope: 'Also called bladder senna: a yellow-flowered European bush with swollen bladder-like pods, not
  a low herb and not a tree grown for timber.'
examples:
- Colutea arborescens bore yellow flowers all summer, then swollen bladder-like pods.
- We planted Colutea arborescens as food for wild animals.
