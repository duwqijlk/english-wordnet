senseId: 'inheritance%1:07:01::'
synsetId: 04928188-n
simpleMeaning: A gift of mind or spirit, not a thing you can touch, passed down from those who came before
  you.
scope: A gift of mind or spirit passed down from those who came before, also called heritage, not what
  the body passes on by birth, and not land or goods left by law.
examples:
- His inheritance was a love of music from his father.
- The world's inheritance of knowledge belongs to us all.
