simpleMeaning: A body chemical set free from blood platelets that turns prothrombin into thrombin as blood
  starts to clot
scope: This body chemical, also called thrombokinase and thromboplastin, is set free from blood platelets
  and turns prothrombin into thrombin as blood starts to clot, unlike an enzyme that breaks clots down
  or a chemical that keeps blood thin.
examples:
- Factor III is set free from blood platelets as blood starts to clot.
- The doctor spoke of factor III turning prothrombin into thrombin.
