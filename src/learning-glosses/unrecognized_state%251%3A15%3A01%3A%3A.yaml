senseId: 'unrecognized_state%1:15:01::'
synsetId: 84015070-n
simpleMeaning: Land that in fact rules itself but that other countries have not agreed to treat as a country.
scope: 'Also called disputed state, partially-recognized state and state with limited recognition: land
  that rules itself in fact but is not agreed to be a country, not a land ruled by another country and
  not a country known by all.'
examples:
- The unrecognized state ruled itself but no other country treated it as a country.
- An unrecognized state may print its own stamps and run its own army.
