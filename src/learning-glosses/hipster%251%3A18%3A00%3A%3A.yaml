simpleMeaning: a person who turns away from the way most people live and speaks up for very free ideas
  about politics and about the way to live
scope: 'Also called hippie, hippy and flower child: this is a person who turns away from the way most
  people live and wants very free ideas in politics and in life, not just a person who follows the newest
  fashion.'
examples:
- In the 1960s, a hipster turned away from normal life and spoke up for very free ideas.
- He called himself a hipster and spoke against the government and for a free way of living.
