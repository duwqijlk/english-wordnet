simpleMeaning: a strong drink made by heating the juice of bitter wild marasca cherries after it has fermented
scope: A strong drink made from fermented cherry juice; maraschino is another name for this sense, not
  wine and not a soft drink made from cherries.
examples:
- A little maraschino liqueur went into the cake.
- He poured a glass of maraschino liqueur after dinner.
