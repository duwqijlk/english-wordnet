simpleMeaning: a small plant from the Old World that comes back year after year, grown for its bright
  yellow flowers that open in early spring, often before the snow is gone
scope: A small plant grown for its bright yellow flowers that open in early spring, not monkshood, a tall
  poisonous plant with blue flowers.
examples:
- The winter aconite bloomed in February, before the snow had gone.
- She planted winter aconite along the path for early colour.
