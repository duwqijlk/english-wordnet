simpleMeaning: in a calm, relaxed way, or without trouble or hardship.
scope: It is not the adjective meaning 'not difficult'; it describes how something is done, calmly or
  without trouble.
examples:
- Take it easy and don't work too hard this week.
- You can rest easy now that the deadline has passed.
