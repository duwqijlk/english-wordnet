simpleMeaning: a medicine or a way of treating a sick person that makes the person well or takes pain
  away
scope: Also called cure, remedy, and curative. This sense names a medicine or treatment, not the describing
  word for something that tends to make a person well.
examples:
- This therapeutic is used to treat severe pain.
- The hospital tested the therapeutic on patients with the disease.
