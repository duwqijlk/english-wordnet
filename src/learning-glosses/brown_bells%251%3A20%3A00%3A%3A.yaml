simpleMeaning: Flowers shaped like small hanging cups, brownish-purple or greenish, grow on this California
  herb.
scope: This is a California herb with brownish-purple or greenish flowers shaped like small hanging cups;
  other herbs of California with cup-shaped flowers are its nearest rivals.
examples:
- Brown bells grow in California, with brownish-purple or greenish flowers.
- We found brown bells with flowers shaped like small hanging cups.
