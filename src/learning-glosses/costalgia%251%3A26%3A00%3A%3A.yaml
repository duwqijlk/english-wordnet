simpleMeaning: a pain in the chest that comes from swelling of the muscles between the ribs
scope: A pain in the chest from swollen muscles between the ribs, also called pleuralgia and pleurodynia,
  and not a pain from the heart or a broken rib.
examples:
- Costalgia made it hurt to breathe deeply.
- Her costalgia flared up after she strained the muscles between her ribs.
