simpleMeaning: Being kind and easy on a person, so they are spared a hard penalty
scope: 'Also called leniency, lenity and mildness: being kind and easy on a person so they are spared
  a harsh penalty, not the act of lightening a penalty or excusing someone from a chore.'
examples:
- The teacher was known for her lenience, and her pupils trusted her.
- His lenience towards the young worker surprised the whole team.
