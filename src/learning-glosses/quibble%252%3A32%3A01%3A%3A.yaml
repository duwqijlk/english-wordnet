simpleMeaning: to argue about small points that do not matter, as a way to not face whether a main point
  or question is true
scope: The act of avoiding a point by raising small points that do not matter, not the noun name for such
  an avoidance.
examples:
- He quibbled about a small word to avoid answering the main question.
- Do not quibble over details that do not change the truth.
