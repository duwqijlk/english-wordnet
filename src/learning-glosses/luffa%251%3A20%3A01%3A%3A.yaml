simpleMeaning: The dried stringy part of a fruit serves as a scrubber in washing and as a strainer for
  liquids.
scope: Also called loofah, loofa, and loufah sponge, it is the dried stringy part of a fruit used for
  washing or straining.
examples:
- She used a luffa to scrub her back.
- She strained the liquid through a luffa.
