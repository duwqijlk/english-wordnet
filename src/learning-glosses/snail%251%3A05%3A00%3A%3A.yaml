simpleMeaning: A creature that lives in fresh water, the sea, or on land, and usually carries a spiral
  shell on its back
scope: A soft creature that lives in fresh water, the sea, or on land and usually carries a spiral shell,
  not the kind people eat and not the act of going out to gather them.
examples:
- A snail moved slowly across the wet leaf.
- Snails in the garden hide in their shells when it is dry.
