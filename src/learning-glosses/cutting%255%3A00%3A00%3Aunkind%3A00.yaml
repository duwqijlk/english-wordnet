simpleMeaning: used for speech whose sound and whose words are both hard and hurtful
scope: This is about speech that hurts with its tone; not pain that feels sharp, and not a piece taken
  from a plant or shaping hard stuff.
examples:
- His cutting remarks made her cry.
- She made a cutting comment about his work.
