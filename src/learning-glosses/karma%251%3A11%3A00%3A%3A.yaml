simpleMeaning: In Hinduism and Buddhism, the result of what a person does, which decides what their next
  life will be when they are born again
scope: In Hinduism and Buddhism, this is how past acts shape the next life; it is not luck by chance and
  not fate fixed with no link to what a person does.
examples:
- In her belief, good karma from this life will lead to a better next life.
- Bad karma from harming others is said to shape a harder life when a person is born again.
