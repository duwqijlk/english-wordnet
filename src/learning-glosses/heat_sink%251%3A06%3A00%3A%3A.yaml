simpleMeaning: Made for the job, this piece of metal takes warmth away from a hot part and gives it off
  into the air
scope: This piece of metal is made to take warmth away from a hot part and give it off into the air, not
  a metal case and not a cooling fan.
examples:
- The heat sink on the chip keeps the processor cool.
- A larger heat sink lets the amplifier give off more warmth.
