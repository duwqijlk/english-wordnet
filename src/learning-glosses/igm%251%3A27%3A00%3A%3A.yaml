simpleMeaning: One of the five main kinds of germ-fighting proteins in blood, that fights blood infections
  and starts the making of immunoglobulin G.
scope: 'Also called immunoglobulin M: one of the five main kinds of germ-fighting proteins in blood, that
  fights blood infections and starts the making of immunoglobulin G, not a protein that fights gut infections
  and not a white blood cell.'
examples:
- IgM fights blood infections.
- The blood test showed a rise in IgM.
