simpleMeaning: A sea fish eaten as food and caught for sport, with dark stripes along its body, swimming
  up rivers to lay eggs, sometimes put in the group called Morone.
scope: Also called a striped bass or a striper, it is a sea fish with dark stripes along its body that
  swims up rivers to lay eggs, not a fish found among rocks along the northern coasts of Europe and America
  and not the lean flesh of market fish caught among rocks.
examples:
- Rockfish swim up the river each spring to lay their eggs.
- He caught a rockfish with dark stripes along its body.
