simpleMeaning: a serious virus disease of the nerves of warm-blooded animals, usually passed by the bite
  of an animal with the disease; it kills if the virus reaches the brain
scope: 'Also called madness, hydrophobia, and lyssa: this is the disease passed by a bite, not mental
  illness or great anger, which are other uses of the name madness.'
examples:
- The dog was tested for rabies after it bit a child.
- He had shots at once because the bite could give him rabies.
