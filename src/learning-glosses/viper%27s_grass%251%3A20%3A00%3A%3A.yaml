simpleMeaning: long black roots you can eat, shaped like carrots, grow on a long-lived herb of southern
  Europe with narrow smooth-edged leaves and single yellow flower heads
scope: 'Also called black salsify and scorzonera: a long-lived herb of southern Europe with long black
  roots you can eat; not a grass, and not a root grown only for show.'
examples:
- Viper's grass grows wild in the dry hills of southern Europe.
- They dug up viper's grass for its long black roots.
