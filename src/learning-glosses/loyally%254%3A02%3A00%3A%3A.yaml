simpleMeaning: in a way that shows strong support for a person, group or cause that does not stop or change
scope: Done in a way that shows strong support for a person, group or cause that does not stop or change;
  not just obeying orders or doing a job well.
examples:
- She loyally stood by her friend during the hard times.
- The old soldier loyally stayed true to his leaders for many years.
