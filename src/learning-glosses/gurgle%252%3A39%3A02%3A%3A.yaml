simpleMeaning: to make sounds like water that bubbles as it flows
scope: To make sounds like water that bubbles as it flows; not water itself flowing, and not words said
  with such a sound.
examples:
- The baby gurgled with joy when tickled.
- The kettle gurgled as the water boiled.
