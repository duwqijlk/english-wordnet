simpleMeaning: Twisting the hand can overwork the lower arm muscles, leaving the cord at the outer edge
  of the bend of the arm sore and swollen.
scope: 'Also called lateral epicondylitis and lateral humeral epicondylitis: a sore, swollen cord at the
  outer edge of the bend of the arm from using the lower arm muscles too much.'
examples:
- Twisting his hand again and again left him with tennis elbow.
- Her tennis elbow hurt each time she twisted her hand.
