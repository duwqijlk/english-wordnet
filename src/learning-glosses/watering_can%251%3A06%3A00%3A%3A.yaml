simpleMeaning: a container with a handle and a spout with a head full of small holes, used to give plants
  a light spray of liquid
scope: 'Also called a watering pot: a hand-held vessel for wetting plants, not a hose and not a cart with
  a tank for roads.'
examples:
- She filled the watering can and carried it to the tomato plants.
- He tipped the watering can gently over the seedlings.
