senseId: logical%5:00:00:rational:00
synsetId: 01932107-s
simpleMeaning: able to think and to put your thoughts into words in a clear way that does not change from
  start to end
scope: About a person who thinks clearly and puts thoughts into words in a way that stays the same; not
  just about correct reasoning in general and not about parts set out in a neat order.
examples:
- He is a logical speaker who explains each idea in a clear, steady way.
- She stayed logical and gave a clear account of what had happened.
