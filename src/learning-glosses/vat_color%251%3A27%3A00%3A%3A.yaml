simpleMeaning: A water-insoluble dye made soluble by an alkaline reduction, applied to cloth and then
  oxidized back into an insoluble dye inside the material; used for cotton.
scope: This is the textile dye applied in a soluble reduced form and fixed inside the cloth by oxidation;
  vat dye is another name for the same thing. It is not a direct dye, which is applied without that chemical
  change. The name belongs to dyeing and textile work.
examples:
- Indigo is the best-known vat color used on denim.
- The dyer dipped the cloth in the vat color and hung it out to oxidize.
