simpleMeaning: A surgical procedure using a suture to close the cervix in a pregnant woman whose cervix
  failed to hold earlier pregnancies
scope: This surgery closes the neck of the womb with a stitch, and it is done for a woman carrying a child
  whose neck has failed to hold earlier pregnancies.
examples:
- A purse-string operation closed the cervix with a stitch.
- The purse-string operation was done because the cervix had failed to hold earlier pregnancies.
