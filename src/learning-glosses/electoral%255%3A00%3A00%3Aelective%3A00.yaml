simpleMeaning: relating to the people who are chosen to vote for a leader, or made up of those people
scope: This sense is about the people who are chosen to vote for a leader, as in the electoral college;
  it is not just about elections in general.
examples:
- The electoral college meets to choose the president.
- Each state has a set number of electoral votes.
