simpleMeaning: about a turn round a centre line or round another thing in space, or causing such a turn
scope: 'Also called revolutionary: about a turn round a line or round another body, not a straight move
  and not a rocking back-and-forth motion.'
examples:
- The rotatory motion of the wheel kept the machine running smoothly.
- A rotatory joint lets the arm swing round in a full circle.
