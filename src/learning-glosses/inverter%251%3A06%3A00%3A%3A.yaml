simpleMeaning: An electrical device that changes direct current into alternating current.
scope: Used in electrical power systems, to supply alternating current from a direct-current source such
  as a battery or solar panels.
examples:
- The inverter changed the battery's direct current into alternating current.
- They fitted an inverter to power the house from the solar panels.
