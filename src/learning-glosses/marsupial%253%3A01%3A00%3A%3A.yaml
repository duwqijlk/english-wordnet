simpleMeaning: of or about animals such as the kangaroo, whose females carry their young in a pouch on
  the body
scope: Used to describe animals such as kangaroos, whose females carry their young in a pouch; not the
  noun, which is one of these animals itself.
examples:
- Marsupial mothers carry their babies in a pouch.
- The zoo keeps marsupial animals from Australia in a house of their own.
