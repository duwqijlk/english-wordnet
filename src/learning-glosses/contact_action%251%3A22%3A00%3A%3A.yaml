simpleMeaning: In chemistry, the speeding up of a change in a substance, brought on by stuff that stays
  the same itself.
scope: Also called catalysis; in chemistry, the speeding up of a change by stuff that stays the same itself,
  not a change that needs heat and not a change that uses up the helper.
examples:
- Contact action speeds the reaction without being used up.
- The chemist used contact action to make the process faster.
