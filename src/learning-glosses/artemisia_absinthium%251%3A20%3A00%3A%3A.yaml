simpleMeaning: A sweet-smelling herb of mild lands in Europe, Asia and North Africa, with a bitter taste,
  used to make the drink absinthe
scope: This sweet-smelling herb of mild lands in Europe, Asia and North Africa has a bitter taste and
  is used to make the drink absinthe; absinthe, common wormwood, lad's love and old man are other names
  for this sense.
examples:
- Artemisia absinthium grows wild on dry banks in Europe.
- The bitter leaves of Artemisia absinthium give absinthe its taste.
