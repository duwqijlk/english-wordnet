simpleMeaning: Showing good taste and fine manners, in dress and in the way you act.
scope: Showing good taste and fine manners in dress and in the way you act, not simply following what
  is in fashion now, and not merely liked by many at the time.
examples:
- She was a fashionable hostess with a fine sense of dress.
- His fashionable manners won him friends in town.
