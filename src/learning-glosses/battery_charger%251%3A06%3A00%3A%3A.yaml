simpleMeaning: a thing that holds a power cell that can be filled with power again, joined to it by a
  wire
scope: 'Another name for a charger: a thing that holds a power cell that can be filled with power again,
  not a power cell itself and not a plug on the wall.'
examples:
- He plugged the battery charger into the wall.
- The battery charger holds the dead battery while it fills with power.
