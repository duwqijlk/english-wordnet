simpleMeaning: pointing or guiding something back to where it came from or to a set place it should reach
scope: About a thing or animal that finds its way back or to a set place, not about just moving or travelling
  in any direction.
examples:
- The homing pigeon flew back to its owner.
- The homing beacon guided the ship back to the harbour.
