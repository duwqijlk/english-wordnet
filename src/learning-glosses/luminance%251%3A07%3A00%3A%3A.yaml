senseId: 'luminance%1:07:00::'
synsetId: 05025269-n
simpleMeaning: The mark of shining, by giving out or throwing back light.
scope: This sense is also called light, brightness, and luminosity, for the mark of shining, by giving
  out or throwing back light, where light is the quality of a thing that shines, either by sending out
  its own visible rays or by throwing back rays that fall on it.
examples:
- Luminance is the mark of shining.
- Luminance gives out or throws back light.
