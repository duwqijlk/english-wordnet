simpleMeaning: a strip of material fixed around a bird's leg so it can be identified
scope: This is an identification band fitted around a bird's leg; it is not jewellery worn on a finger,
  not a metal loop used for fastening or hanging things, and not the roped arena where people box.
examples:
- The team put a numbered ring on the goose's leg.
- Each ring carried a code that identified the bird.
