simpleMeaning: In orthopedics, pulling in a special way on a bone or a leg or arm that is broken, to ease
  pressure or keep parts in line during healing
scope: This is the medical pulling used while a broken bone heals, not the grip between a tire and the
  road.
examples:
- His leg was in traction for several days after the break.
- The doctor put her arm in traction to keep the bone in line.
