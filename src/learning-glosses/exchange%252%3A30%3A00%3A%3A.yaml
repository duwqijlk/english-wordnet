simpleMeaning: to give something and receive something else in its place, usually of the same kind.
scope: This means swapping one thing for another, not holding a conversation or undergoing a chemical
  reaction.
examples:
- The two boys exchanged hats.
- She exchanged the broken lamp for a new one.
