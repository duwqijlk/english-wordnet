schema: oewn-learning-gloss-v2
senseId: 'counteract%2:41:02::'
synsetId: 02570888-v
simpleMeaning: to work against something and stop or hold it back by doing the opposite in return
scope: This is working against a thing by doing the opposite in return, not only making the bad effects
  of a thing less strong.
examples:
- He tried to counteract the false story by telling the true story at once.
- The workers counteracted the push from the other side by pushing back with equal force.
