simpleMeaning: a special set of clothes worn at work by some men who serve in a house and by some drivers
  of cars for other people
scope: This is the special work clothes of house servants and drivers, not feeling ill from the liver
  and not the care of horses for pay.
examples:
- The driver wore a dark livery with gold buttons.
- All the house servants wore the same livery at the big house.
