simpleMeaning: to take and keep a tight hold of someone, as people do when they fight by holding each
  other in a match
scope: This is taking a tight hold of a person in a fight, not the hold of a tire on a road and not making
  a person stop still from fear.
examples:
- The wrestler gripped his opponent by the arm.
- They gripped each other and tried to push each other down.
