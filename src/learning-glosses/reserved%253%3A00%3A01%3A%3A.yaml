simpleMeaning: Holding back what you think and feel, and saying little about yourself.
scope: A held-back, quiet way with people, not a kept seat or a set-aside place.
examples:
- He was reserved in speech and rarely shared his views.
- She gave a reserved answer and kept her thoughts to herself.
