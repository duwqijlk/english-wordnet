simpleMeaning: everyday clothes worn by a person not in the armed forces, instead of a service dress
scope: These are everyday clothes worn by a person not in the armed forces; civies is another name for
  this sense, not a service dress and not a party outfit.
examples:
- Off duty, the sailor changed into civvies before going into town.
- He hung his civvies in the closet next to his dress blues.
