schema: oewn-learning-gloss-v2
senseId: 'direct%2:33:00::'
synsetId: 01153576-v
simpleMeaning: To aim something, such as a weapon, a camera or a hit, at a target.
scope: This is aiming something physical, such as a weapon, a camera or a blow, at a target; it is not
  intending effort or action toward a goal, not telling someone the way to go, not causing someone or
  something to go somewhere, not taking someone somewhere, not steering a course of travel, not guiding
  actors or conducting a performance, not governing or managing, not commanding with authority, not planning
  and running a complex scheme, not designing something for a particular audience, not writing an address
  on an envelope, not the adjective senses (straight, without intermediaries, frank, in an unbroken family
  line, moving eastward in the sky, proportional, one-way current, direct consequence, exact words, absolute),
  and not the adverb meaning without deviation.
examples:
- She directed the flashlight toward the noise in the hallway.
- He directed a punch at his opponent's jaw.
