simpleMeaning: To wrap or fill the body or a part of it with cloth or other material to cover, treat,
  or soak up blood.
scope: This is a way of treating the body or a part of it, not the cloth used for it, and not putting
  things into a bag or filling something to capacity.
examples:
- They packed his ankle with ice to bring down the swelling.
- She packed the wound with clean cloth until help arrived.
