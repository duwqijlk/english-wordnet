simpleMeaning: the bones that hold up the legs in a person, and the back legs or like parts in other animals
  with a backbone
scope: The bones that hold up the legs, not the joint inside them and not the angle at the edge of a roof.
examples:
- She put her hands on her hips and waited.
- He broke his hip in the fall.
