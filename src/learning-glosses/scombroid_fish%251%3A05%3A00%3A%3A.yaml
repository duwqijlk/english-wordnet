simpleMeaning: fish found in all warm and mild seas, caught for food and for sport, some keep warm by
  making some of their own heat and live in colder water
scope: 'Also called scombroid: fish of warm and mild seas, caught for food and for sport, not a river
  fish and not a shellfish.'
examples:
- Mackerel is a scombroid fish of warm and mild seas.
- We caught scombroid fish for sport off the warm coast.
