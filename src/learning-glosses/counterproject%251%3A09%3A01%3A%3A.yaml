simpleMeaning: A plan, scheme or proposal put forward against another one, as when a treaty is being talked
  over
scope: This is a plan, scheme or proposal put forward against another one; not the treaty itself, and
  not a small change made to a plan already agreed.
examples:
- The other side put forward a counterproject during the treaty talks.
- Their counterproject offered a different way to settle the border.
