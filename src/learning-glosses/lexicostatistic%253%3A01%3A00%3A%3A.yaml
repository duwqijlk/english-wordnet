simpleMeaning: To do with ways of counting that show how languages are tied to each other
scope: To do with counting ways of showing how languages are tied to each other, not to do with the sounds
  of one language and not to do with the history of one language.
examples:
- They used lexicostatistic techniques to compare the two languages.
- A lexicostatistic study showed the languages came from one parent tongue.
