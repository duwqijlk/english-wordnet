simpleMeaning: a secret way for sides to send messages instead of the usual ways, when a deal must be
  made in secret, most of all between nations or in government
scope: A secret way for sides to send messages instead of the usual ways, not the usual open ways of talking
  and not a secret meeting itself.
examples:
- They negotiated the deal via a back channel.
- The two sides used a back channel to talk in secret.
