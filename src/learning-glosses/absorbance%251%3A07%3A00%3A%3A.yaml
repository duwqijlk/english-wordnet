simpleMeaning: in physics, how far light, or other rays like it, gets through a substance, given as a
  number
scope: It is also called optical density, photographic density, and transmission density, and it is a
  number for how far light gets through a substance, not for how much the substance gives off.
examples:
- They measured the absorbance of the liquid in the tube.
- She wrote down the absorbance of each sample.
