simpleMeaning: Lacking the strength to work hard or to keep going, from being out of shape.
scope: 'Also called soft or flabby: weak and out of shape, unable to work hard or last, not the sense
  of hanging limp with no stiffness.'
examples:
- After months in bed, he was flaccid and weak.
- His muscles were flaccid after the long illness.
