senseId: 'dizzily%4:02:00::'
synsetId: 00083273-r
simpleMeaning: in a way that shows you feel as if the room is turning and you may fall
scope: In a way that shows an unsteady turning feeling in the head, also called giddily. It does not mean
  in a happy, silly way.
examples:
- He stood up too fast and walked dizzily across the room.
- She held the wall and moved dizzily after the ride stopped.
