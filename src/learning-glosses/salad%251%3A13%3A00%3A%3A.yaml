simpleMeaning: a mix of foods, set out on a plate or mixed and served with a wet sauce, usually made up
  of greens or with greens in it
scope: This is the mixed food dish itself, usually with greens in it; it is not the sauce alone and not
  the greens alone.
examples:
- She made a salad of tomatoes, eggs and greens with a light dressing.
- For lunch, we shared a large salad served with a creamy dressing.
