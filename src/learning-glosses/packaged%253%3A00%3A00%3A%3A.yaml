synsetId: 01743427-a
simpleMeaning: put inside a box, bag, or other covering that keeps it safe
scope: This means the thing is already inside a covering that keeps it safe; it is not sold loose with
  no covering, and it is not the act of putting it in.
examples:
- The packaged rice sat on the shelf in sealed bags.
- He bought packaged bread instead of loose rolls from the baker.
