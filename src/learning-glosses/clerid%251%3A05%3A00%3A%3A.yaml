simpleMeaning: Feeding on other insects, and usually bright in colour or shiny like metal.
scope: Feeding on other insects and usually bright in colour or shiny like metal, also called clerid beetle;
  not a beetle that feeds on plants and not one that is dull and dark.
examples:
- The clerid hunts other insects among the bark.
- A bright red clerid ran across the log.
