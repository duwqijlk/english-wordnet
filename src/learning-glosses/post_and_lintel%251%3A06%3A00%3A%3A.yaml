simpleMeaning: One beam laid flat across the top is held up by upright beams in this way of building.
scope: This way of building holds one beam flat across the top on upright beams, not a single beam on
  its own.
examples:
- The post and lintel held the flat beam across the top.
- A post and lintel is made of upright beams and a flat beam.
