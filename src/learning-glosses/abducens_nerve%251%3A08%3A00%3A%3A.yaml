simpleMeaning: The straight muscle on the outer side of the eye takes its orders to pull from this small
  cord.
scope: Also called abducens, abducent, abducent nerve, nervus abducens, and sixth cranial nerve, this
  cord sends orders to the straight muscle on the outer side of the eye.
examples:
- The abducens nerve moves the eye outward.
- The straight muscle on the outer side of the eye takes its orders from the abducens nerve.
