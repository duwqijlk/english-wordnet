simpleMeaning: A unit of information, one thousand twenty-four exbibytes.
scope: Also called ZiB, a zettabyte, or a zebibyte, this is a unit of one thousand twenty-four exbibytes,
  not the ZB that is one thousand exabytes.
examples:
- One ZB holds one thousand twenty-four exbibytes.
- The new disk could hold ten ZB, each one thousand twenty-four exbibytes.
