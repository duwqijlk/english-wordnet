senseId: 'shake%1:10:00::'
synsetId: 06644604-n
simpleMeaning: the act of taking hold of someone's hand and moving it up and down, to greet a new person
  or settle a deal
scope: This is the clasping greeting with another person's hand, not the frothy milk drink and not the
  gesture of moving one's own head or fist.
examples:
- The two leaders sealed the agreement with a firm shake.
- He offered a quick shake before introducing himself.
