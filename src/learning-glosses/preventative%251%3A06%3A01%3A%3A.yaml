simpleMeaning: a medicine or treatment that keeps an illness from starting or slows it down
scope: 'Also called preventive and prophylactic: a medicine or treatment against illness; not the word
  for a thing that stops pregnancy, and not the adjective sense of stopping things in general.'
examples:
- The doctor gave him a preventative that slowed the illness.
- She takes a preventative every winter so she does not get ill.
