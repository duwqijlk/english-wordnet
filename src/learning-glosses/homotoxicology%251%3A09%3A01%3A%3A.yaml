simpleMeaning: a way of seeing sickness as the body failing to clear a load of poisons, often treated
  with homeopathic cures in tiny doses, set out by Hans Heinrich Reckeweg
scope: A way of looking at sickness as the body failing to clear a load of poisons, not a cure for one
  illness and not a test done in a lab.
examples:
- In homotoxicology, a long cold is read as the body failing to clear a load of poisons.
- The clinic that used homotoxicology gave him a tiny-dose cure for his skin rash.
