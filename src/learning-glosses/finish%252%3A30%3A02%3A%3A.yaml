simpleMeaning: to come to the end of doing something, or to bring something to its end.
scope: This is not something such as a road or a period simply reaching its end, and it is not the surface
  look; it is completing an activity or bringing it to a stop.
examples:
- She finished her essay before dinner.
- He finished the job in an hour.
