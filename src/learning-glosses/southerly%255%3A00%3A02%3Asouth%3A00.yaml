simpleMeaning: On the side toward the south, or turned to face that way.
scope: On the side toward the south or turned to face that way, also called southern, not a wind from
  the south, and close in sense to the uses for something coming from or moving toward the south.
examples:
- The house had a southerly aspect, facing the sun.
- They took a southerly course across the plain.
