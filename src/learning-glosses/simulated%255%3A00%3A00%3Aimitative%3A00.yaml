simpleMeaning: copied or made to look like the real thing, and alike in how it is or acts
scope: This is about a thing made to copy a real thing; it is not the near sense that just means not real
  or false.
examples:
- The pilots trained in a simulated flight before flying a real plane.
- Soldiers practised under simulated combat conditions.
