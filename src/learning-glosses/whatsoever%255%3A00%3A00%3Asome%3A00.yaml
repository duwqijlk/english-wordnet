simpleMeaning: Any one, some, every one, or all of them, with nothing picked out; it can stand for a thing
  or for an amount
scope: Any one, some, every one, or all of them, with nothing picked out, also called any and whatever.
examples:
- I have no milk whatsoever left in the fridge.
- We need whatsoever help we can get.
