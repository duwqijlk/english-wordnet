simpleMeaning: This large tree grows in Asia, and its wood is hard, with dark streaks in it.
scope: A large tree of Asia whose wood is hard and marked with dark streaks; marble-wood, marblewood and
  Andaman marble are other names for this sense, not another tree of Asia with striped wood.
examples:
- The carpenter chose Diospyros kurzii for its hard, streaked wood.
- Diospyros kurzii grows tall in the forests of Asia.
