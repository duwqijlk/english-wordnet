simpleMeaning: A unit for measuring stored data, equal to 1,024 mebibytes, or 1,073,741,824 bytes.
scope: A data-size unit, also called gigabyte, gibibyte, G, and GB; not a smaller unit like a megabyte
  and not a bit.
examples:
- The file is 2 GiB in size.
- One GiB holds over a billion bytes.
