simpleMeaning: In physics, an effect that brings about a change in a measurable physical property.
scope: This is the physics quantity, not physical strength or intensity, a group of soldiers, an act of
  violence, a person with authority, or a law's legal validity.
examples:
- Gravity is the force that keeps the Moon in orbit around Earth.
- The engineers measured the force needed to lift the steel beam.
