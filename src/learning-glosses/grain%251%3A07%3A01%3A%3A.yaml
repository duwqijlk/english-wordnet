simpleMeaning: the way something is made up, especially the size and shape of the small parts it is made
  of
scope: 'Also called texture: the make-up of a thing, seen in its small parts; not dry seeds from plants
  like wheat, not one tiny piece of sand, and not the lines in wood.'
examples:
- Sand with a fine grain feels smooth under your feet.
- This stone has a coarse grain, so its surface feels rough.
