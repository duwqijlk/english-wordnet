simpleMeaning: a person who pretends to be a keen customer, so that other people will join in and take
  part
scope: This is a person who pretends to be a keen buyer to draw other people in, not the act of doing
  this work.
examples:
- The auction used a shill to push the price up.
- Everyone knew the happy buyer was a shill working for the seller.
