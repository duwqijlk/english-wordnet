simpleMeaning: a flat worm that lives in or on another living thing and feeds off it, holding on with
  sucking parts on its outside
scope: A flat worm that lives in or on another living thing. Not a part of a whale's tail, not the flat
  part of an anchor, and not a sharp point on a weapon.
examples:
- The sheep became ill because flukes were living in its body.
- A fluke can hold on inside its host with its small round sucking parts.
