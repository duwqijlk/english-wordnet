simpleMeaning: any plant with one stem that does not branch, topped by large leaves shaped like feathers
  or fans
scope: Any plant with one stem that does not branch, topped by large leaves shaped like feathers or fans;
  palm is another name for this sense, and it is not a plant with many branches or a plant with small
  plain leaves.
examples:
- A palm tree stood by the beach.
- The palm tree has large leaves at the top of its stem.
