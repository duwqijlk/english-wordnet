senseId: 'proenzyme%1:27:00::'
synsetId: 14715606-n
simpleMeaning: Not yet working, one of a group of body helpers is made to work by a change such as breaking
  off a bit that hides a working one
scope: Also called zymogen, this is one of a group of body helpers that do not yet work; a change makes
  them work.
examples:
- The proenzyme did not work until a change set it going.
- Once a bit broke off, the proenzyme began to work.
