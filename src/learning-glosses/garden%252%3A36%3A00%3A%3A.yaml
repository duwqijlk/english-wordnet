simpleMeaning: to do work such as planting and weeding in a plot where plants are grown
scope: This is the activity of tending plants in a plot, not the plot itself, the plants grown there,
  a lawn beside a house, or the adjective meaning ordinary or familiar.
examples:
- She gardens on weekends, planting tomatoes and pulling weeds.
- My grandfather gardened every morning until he was eighty.
