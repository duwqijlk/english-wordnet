senseId: 'heckler%1:18:00::'
synsetId: 10187158-n
simpleMeaning: a person who tries to make someone feel ashamed by using rude jokes, questions and words
  that show they do not agree
scope: This is a person who tries to make someone feel ashamed with rude jokes, questions and words that
  show they do not agree, not a person who asks a polite question and not a person who disagrees in a
  calm way.
examples:
- A heckler kept shouting rude jokes while the mayor was trying to speak.
- The heckler asked hard questions again and again to make the speaker look bad in front of the crowd.
