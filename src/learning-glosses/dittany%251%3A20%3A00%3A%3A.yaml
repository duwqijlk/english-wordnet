simpleMeaning: A long-lived herb of Europe and Asia with white flowers that give off a gas that can catch
  fire in hot weather.
scope: Also called a burning bush, fraxinella, or gas plant; the long-lived herb whose white flowers give
  off a gas that can catch fire, not a bush that burns.
examples:
- Dittany grew on the dry bank with white flowers.
- In hot weather dittany gave off a gas that could catch fire.
