simpleMeaning: the act of singing in one tone that stays the same and does not go up or down
scope: 'Also called chanting: singing in one tone that stays the same. Not the sense about one person
  singing the first part of a church song alone, and not the sense about how true the pitch of notes is.'
examples:
- His intonation never changed as he sang the long prayer in one low tone.
- The monks sang with a slow intonation that stayed on one note from start to end.
