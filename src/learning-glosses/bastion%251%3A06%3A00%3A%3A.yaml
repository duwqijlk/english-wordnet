senseId: 'bastion%1:06:00::'
synsetId: 02809168-n
simpleMeaning: a part of a strong wall that sticks out, built around a fort or other place to keep it
  safe in a fight
scope: This is a part of a strong wall around a fort or castle that sticks out. It is not the whole fort
  and not the whole wall around it.
examples:
- Soldiers stood on the bastion and watched for the enemy.
- The old castle still has a stone bastion at its corner.
