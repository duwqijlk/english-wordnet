simpleMeaning: hard fat found around the kidneys and the lower back in beef and sheep
scope: This is the hard fat from cows and sheep; it is not soft body fat in general and not the meat itself.
examples:
- She mixed chopped suet into the pudding before cooking it.
- The butcher wrapped some suet for making pastry.
