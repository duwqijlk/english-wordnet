simpleMeaning: a piece of metal that pulls iron and makes the pull inside a machine that makes power or
  a machine that runs on power
scope: A piece of metal that pulls iron and makes the pull inside a machine that makes power or runs on
  power, not a small magnet that holds notes to a fridge and not the metal that turns inside the machine.
examples:
- The field magnet in the old motor had lost its pull.
- Engineers changed the field magnet to make the dynamo work again.
