simpleMeaning: In physics, the rule that two bodies pull each other with a force that rises with the product
  of their masses and falls as the square of the gap grows
scope: In physics, the rule that two bodies pull each other, not the rule about how fast planets move
  and not a rule about falling things only.
examples:
- The law of gravitation says any two bodies pull each other.
- Newton's law of gravitation explains why the moon stays near the earth.
