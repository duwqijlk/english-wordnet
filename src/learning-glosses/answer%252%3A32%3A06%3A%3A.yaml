simpleMeaning: Reply so as to defend yourself against a charge, or to argue back during a dispute.
scope: Not simply replying to a question; here the reply defends against an accusation or argues a case.
examples:
- He answered the charge of negligence by producing the safety records.
- Given the chance to answer her critics, she spoke for ten minutes.
