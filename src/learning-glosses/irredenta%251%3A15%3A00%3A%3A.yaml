synsetId: 08606696-n
simpleMeaning: Another country rules this land, although its people and past tie it to a different country
scope: A land tied by its people and past to one country but ruled by another, also called irridenta;
  not a land that belongs to the country that rules it and not a colony settled from far away.
examples:
- The irredenta had long hoped to join its neighbour.
- Maps showed the irredenta under another flag.
