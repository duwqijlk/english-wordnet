simpleMeaning: All the lasting general laws of the country, brought together and set out by subject, and
  put out by a part of the House of Representatives.
scope: The country's lasting general laws set out by subject, also called U. S. Code; not one single law
  and not the laws of one state.
examples:
- The United States Code sets out federal law by subject.
- Lawyers look up the law in the United States Code.
