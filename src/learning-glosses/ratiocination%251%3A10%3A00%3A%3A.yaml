simpleMeaning: The proposition reached by logical reasoning, such as the one that must follow from the
  major and minor premises of a syllogism.
scope: Also called a conclusion, it is the point reached by thinking step by step from two starting ideas.
examples:
- By ratiocination, the two ideas led to the point that had to follow.
- Step by step, ratiocination reached the point that followed from the two starting ideas.
