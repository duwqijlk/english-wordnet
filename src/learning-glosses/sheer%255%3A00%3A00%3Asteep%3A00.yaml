senseId: sheer%5:00:00:steep:00
synsetId: 01148907-s
simpleMeaning: very steep, with a front that stands out and goes almost straight up and down
scope: Also called bold, and another name for this sense is bluff; it is about how steep a cliff or slope
  is, not about something being complete and total, and not about turning away.
examples:
- The path dropped down a sheer cliff to the sea.
- We stood at the top of a sheer rock face that fell straight down.
