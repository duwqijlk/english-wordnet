simpleMeaning: Through the stems and leaves of higher plants runs one strand of the system that carries
  water and food, made up mostly of water tubes and food tubes.
scope: 'Fibrovascular bundle and vascular strand are other names for this sense: a single strand of the
  water-and-food system in the stems and leaves, not the whole system.'
examples:
- A vascular bundle runs through the stem of the plant.
- The vascular bundle carries water and food to the leaves.
