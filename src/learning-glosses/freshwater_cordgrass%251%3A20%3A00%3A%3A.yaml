simpleMeaning: a North American grass with leaves that have dry thin edges and seed cases with long bristles
scope: This is a North American grass with dry-edged leaves and long-bristled seed cases; prairie cordgrass
  and slough grass are other names for it, not a sea grass or a garden lawn grass.
examples:
- Freshwater cordgrass grows along the edge of the marsh.
- The freshwater cordgrass bent in the wind.
