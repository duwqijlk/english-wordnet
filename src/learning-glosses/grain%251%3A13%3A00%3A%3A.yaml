simpleMeaning: food made from the seeds of grasses grown for food, when the seeds have much starch (the
  white substance in the seeds that gives energy)
scope: Also called cereal, this is food made from seeds, not the seeds as they grow, not the pattern in
  wood, and not a unit of weight.
examples:
- Rice is a grain that many people eat every day.
- They served a hot cooked grain with beans for dinner.
