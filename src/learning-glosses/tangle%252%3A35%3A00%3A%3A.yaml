simpleMeaning: to twist things together so they wind round each other into a mass that is hard to sort
  out
scope: 'Also called snarl and mat: to twist things together into a hard mass, not a mass of twisted things
  itself and not to make a thing messy and out of place.'
examples:
- The child tangled the cord around the chair leg.
- Do not tangle the wires when you put them away.
