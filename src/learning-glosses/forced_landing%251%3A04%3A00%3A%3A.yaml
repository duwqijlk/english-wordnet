simpleMeaning: a plane coming down at a time not planned, when the pilot cannot control events such as
  engine failure or bad weather
scope: This is a plane coming down when it was not planned, because of engine failure or bad weather;
  emergency landing is another name for it, not a normal landing at an airport.
examples:
- The pilot made a forced landing in a field after the engine failed.
- The storm caused a forced landing on a country road.
