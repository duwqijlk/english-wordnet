simpleMeaning: A big shaggy mammal of Canada and Greenland, one of the cattle family, in size and body
  shape halfway between an ox and a sheep.
scope: This is the large shaggy mammal of Canada and Greenland, also called musk ox — it stands between
  an ox and a sheep in size and shape, and is neither one.
examples:
- A musk sheep grazed on the cold grass in Canada.
- Musk sheep live in herds on the far northern plains.
