simpleMeaning: a tropical fruit shaped like a pear, with green or dark skin and soft deep-yellow flesh
  around one big seed
scope: The pear-shaped fruit, not the tree it grows on and not the dull yellow-green color named for it.
examples:
- She cut the avocado in half and took out the seed.
- He spread mashed avocado on his toast.
