simpleMeaning: A gathered frill on the front of a woman's blouse or a man's shirt
scope: A gathered frill on the front of a blouse or shirt, not a necktie and not a plain collar.
examples:
- She wore a jabot with her white blouse.
- The judge's jabot fell over his black robe.
