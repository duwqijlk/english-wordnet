simpleMeaning: A plant with most of its leaves at the bottom and open branching bunches of small white
  flowers, growing in western North America.
scope: This is a plant with most of its leaves at the bottom and open branching bunches of small white
  flowers; not a plant with leaves all up its stem and not a plant with big coloured flowers.
examples:
- The coast boykinia grew near the stream with its leaves low to the ground.
- We saw coast boykinia in flower, its small white blooms on open branches.
