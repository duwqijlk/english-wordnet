schema: oewn-learning-gloss-v2
senseId: heavy%5:00:00:important:00
synsetId: 01281533-s
simpleMeaning: A serious matter with real consequences that calls for careful thought.
scope: This means a matter or decision of serious importance that calls for careful thought, not physical
  weight or density, not unusually great degree, quantity, or number, not military or industrial armaments
  or equipment, not emotional burden, sadness, or weariness, not a stout person with a large frame, not
  compact fine-grained soil, not a sky darkened by clouds, not great intensity, power, or force, not an
  isotope of greater atomic mass, not an actor playing a villain, not dense matter that lets little light
  through, not relatively large extent and density, not fabric of considerable thickness, not something
  prodigious, not a full, loud, deep sound, not overindulgence in drink, not slow, laborious movement,
  not equipment built for rough work, not food that upsets digestion, not a steep slope, not being full
  of or bearing great weight, not work that requires effort, not effort to the point of exhaustion, not
  dullness or lack of liveliness, not deep, complete sleep, not advanced pregnancy, not the noun for an
  actor in villain roles, not the noun for a serious or tragic role, and not the adverb meaning slowly
  under a burden.
examples:
- She faced a heavy decision about whether to sell the family farm.
- The peace talks dealt with heavy matters of war and territory.
